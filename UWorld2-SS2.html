<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

const DATA = [{"n": 1, "q": "If a company uses a surety bond, it is most likely :", "opts": ["self-insuring.", "transferring risk.", "pledging collateral for a debt obligation."], "ans": "B", "expl": "Risk modification methods\nMethod Example\nDo not operate in a politically unstable country\nAvoid collection/storage of sensitive customer\nAvoid or prevent\ndata\nSet aside capital to absorb losses\nRisk acceptance:\nUse multiple geographic locations\nself-insure or diversify\nPurchase insurance\nRisk transfer\nObtain surety bond\nUse derivatives (eg, forward contracts or\nRisk shifting\noptions)\nMeasuring and monitoring risk are key risk management functions. Quantifying risk allows a\ncompany to determine if the expected benefits from a potential activity outweigh the costs.\nDuring the normal course of business, companies often must decide whether to accept or\navoid risk.\nRisk transfer occurs when a company has chosen to take on a risk and then transfers some\nof that risk to another party by purchasing insurance . By transferring risk to the insurer,\nthe insured has limited its potential loss to the cost of the insurance policy plus any associated\ndeductible and/or loss sharing.\nA surety bond is a form of insurance , transferring the risk that a third party will fail to\nfulfill its contractual obligation. For example, a real estate developer might purchase a surety\nbond to ensure that the contractor hired to construct a building satisfactorily completes the\njob.\n(Choice A) Self-insuring is a form of risk acceptance . Companies may decide to self-insure if\nthird-party risk modification methods such as risk transfer or risk shifting are either cost\nprohibitive or unavailable.\n(Choice C) A surety bond is not a type of debt obligation.\nThings to remember:\nThe risk transfer method of risk modification transfers much or all of a risk to a third party.\nThis method is advantageous when other options are either cost prohibitive or unavailable. A\nsurety bond is a form of insurance, transferring the risk of a third party failing to fulfill their\ncontractual obligation.\nDescribe methods for measuring and modifying risk exposures and factors to consider in choosing\namong the methods\nLOS", "qhtml": null}, {"n": 2, "q": "Which function is least likely a responsibility of the audit committee?", "opts": ["Recommending an external auditor", "Providing oversight of the application of accounting policies", "Monitoring company-wide compliance with all relevant laws and regulations"], "ans": "C", "expl": "Audit committee responsibilities\nOversee audit and control systems\nMonitor financial reporting process and ensure financial accuracy\nOversee application of accounting policies\nEnsure integrity of financial statements\nSupervise internal audit function\nRecommend external auditor\nPresent annual audit report to board\nBoard members serve on functional committees, which oversee different areas of a company.\nThese committees include but are not limited to governance, risk, and investment\ncommittees. The governance committee , not the audit committee, is responsible for\nmaintaining compliance with laws and regulations.\nThe audit committee is one of the most common committees on corporate boards. In\naddition to its primary function of overseeing a company's reporting process , the audit\ncommittee is charged with mitigating the risk of fraud or misstatements in both accounting\nand financial information. The committee maintains independence from company\nmanagement and establishes policies and procedures to ensure financial integrity .\n(Choices A and B) The audit committee's responsibilities include oversight of both the audit\nprocess (eg, recommending an external auditor) and the application of accounting policies.\nThings to remember:\nThe audit committee maintains independence from management as it oversees a company's\naudit and control systems and establishes policies and procedures to ensure financial integrity\n(eg, mitigating the risk of fraud or misstatements). The governance committee , not the audit\ncommittee, is responsible for monitoring company-wide compliance with laws and regulations.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate\nassociated risks\nLOS", "qhtml": null}, {"n": 3, "q": "Based on the pecking order theory, when a company issues equity, management is most\nlikely signaling that:", "opts": ["the stock is overvalued.", "the company can pay larger dividends.", "they have confidence in meeting future commitments."], "ans": "A", "expl": "Information asymmetry arises from the fact that a company's managers know more about the\ncompany and its prospects than the company's investors. Investors realize this and try to\ninterpret signals based on how management conducts the business, including raising capital.\nThe pecking order theory suggests that managers prefer to raise capital through\nmethods that require the least amount of disclosure, thus providing investors with\nthe least amount of information necessary. Based on this theory, issuing equity is the least\npreferred method since it requires significant disclosure and is scrutinized by\ninvestors. Equity issues may indicate that managers believe:\nthe company's prospects are not encouraging . If prospects were better, managers\nwould hesitate to dilute their ownership.\nthe stock is overvalued and therefore a good form of financing to fund projects or\nacquisitions. Managers would be reluctant to issue stock if they thought it was\nundervalued.\n(Choice B) The pecking order theory does not link the method of financing to dividend\npayments. However, since equity issues indicate future prospects are not encouraging, they\nare unlikely to indicate that the company can pay larger dividends.\n(Choice C) The issuance of debt would indicate that management has confidence in meeting\nfuture commitments since additional debt commits the company to future obligations.\nThings to remember:\nThe pecking order theory suggests that managers prefer raising capital through methods that\nprovide investors with the least amount of information necessary. Issuing equity is the least\npreferred method since it indicates to investors that management believes the company's\nprospects are not encouraging or that the stock is overvalued.\nExplain factors affecting capital structure and the weighted-average cost of capital\nLOS", "qhtml": null}, {"n": 4, "q": "The capital asset pricing model (CAPM) assumes that all investors can most likely :", "opts": ["influence security prices.", "invest any amount in an asset.", "plan for a multiple-period holding period."], "ans": "B", "expl": "Assumptions of the capital asset pricing model\n(CAPM)\nInvestors are risk averse, utility focused, and rational\nInvestors have a single-period time horizon\nInvestors are price takers\nInvestors have homogeneous expectations since they\nanalyze securities uniformly with identical methods\nand data\nInvestments are infinitely divisible\nNo transaction costs and taxes, no restrictions on\nshort-selling, and investors can lend and borrow\nunlimited amounts at the risk-free rate\nThe capital asset pricing model (CAPM) establishes a direct linear relationship between\nthe expected return of an asset and its beta , which is a measure of systematic risk. The\nbeta indicates the sensitivity of the asset's return to the overall market movement.\nThe CAPM assumes that investments are infinitely divisible, which implies that investors can\ninvest any amount of capital in a particular asset or investment, and thus rationally maximize\nutility and optimize their portfolios. This assumption also allows for ease in mathematical\nmodeling. By assuming infinite divisibility, the model can use continuous functions, which are\nsmoother and more mathematically tractable than discrete jump functions.\n(Choice A) CAPM assumes that investors are price takers. Therefore, the individual actions\nof any single investor do not have a significant impact on the market price of securities.\n(Choice C) CAPM assumes that investors plan for the same single -period holding period,\nsuch that all investors have the same time horizon. For this reason, the model presumes that\nall investors act rationally within the same investment period.\nThings to remember:\nThe CAPM assumes that investments are infinitely divisible, allowing investors to rationally\nmaximize utility and optimize their portfolios. This assumption also allows for ease in\nmathematical modeling.\nExplain the capital asset pricing model (CAPM), including its assumptions, and the security market\nline (SML)\nLOS", "qhtml": null}, {"n": 5, "q": "Which of the following is most likely a responsibility of a board of director's governance\ncommittee?", "opts": ["Defining performance criteria for management.", "Overseeing risk and capital management policies.", "Evaluating candidates for executive management positions."], "ans": "C", "expl": "A company's board of directors has several roles and is typically organized into committees\nthat focus on distinct functions. The governance committee , also known as\nthe nominating committee, implements best practices in the company's policies and\nprocedures . The governance committee:\nEvaluates candidates for board and executive management positions\nSets nomination procedures for board members\nEnforces corporate policies, such as a governance code and code of ethics\nEnsures compliance with applicable laws and regulations\nRecommends remedial actions for legal breaches\n(Choice A) Defining performance criteria for management is a function of the remuneration\ncommittee, which is primarily responsible for performance evaluation and compensation\npolicies related to the company's managers.\n(Choice B) Overseeing risk (capital) management policies is a function of the risk\n(investment) committee, which is often specific to the financial services (insurance) industry.\nThings to remember:\nThe governance committee implements the best practices found in the company's policies and\nprocedures. The committee evaluates candidates for board and management positions,\nensures compliance with regulations, and recommends remedial actions for legal breaches,\namong other functions.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate\nassociated risks\nLOS", "qhtml": null}, {"n": 6, "q": "A manufacturer with industry-average financial leverage is issuing debt to fund expansion of\nproduction capacity. All else equal, the stakeholder group most likely to benefit from the\nincrease in financial leverage is the company's:", "opts": ["bondholders.", "common shareholders.", "preferred shareholders."], "ans": "B", "expl": "Higher levels of financial leverage increase the potential for conflicts of interest between\nshareholders and other stakeholders. Companies use leverage (eg, debt) to increase\nexpected returns to shareholders through actions such as expanding capacity or\nrepurchasing shares. However, the potential for higher returns comes with a higher\nprobability of financial distress and/or bankruptcy since payments to creditors remain an\nobligation of the firm even when operating at a loss.\nIn general, no stakeholder benefits from a firm going bankrupt. However, the risk-return\ntrade-off of greater financial leverage benefits common shareholders due to their asymmetric\nreturn profile. Successful use of leverage can result in shareholder returns that are a multiple\nof their initial investment, whereas their losses normally cannot exceed 100% of the\ninvestment.\n(Choices A and C) All else equal, when a firm increases financial leverage by issuing debt,\nthe probability of bankruptcy increases. This reduces the likelihood of the company meeting\nfinancial commitments to senior security holders. Therefore, bondholders and preferred\nshareholders do not benefit from increases in financial leverage.\nThings to remember:\nHigher levels of financial leverage can increase expected returns for common shareholders but\nalso increase the probability of company bankruptcy. All else equal, greater financial leverage\nbenefits common shareholders but does not benefit bondholders and preferred shareholders.\nExplain factors affecting capital structure and the weighted-average cost of capital\nLOS", "qhtml": null}, {"n": 7, "q": "With regard to environmental, social, and governance (ESG) investing, full integration can\nbe best described as:", "opts": ["investment in assets related to specific ESG factors or themes.", "explicit inclusion of ESG factors in a fundamental analysis of individual stocks.", "inclusion of certain sectors or companies that have favorable ESG factors in a fund."], "ans": "B", "expl": "Environmental, social, and governance (ESG) implementation\napproaches\nDescription\nExcludes companies or sectors in which activities go\nNegative screening\nagainst investor beliefs\nPositive screening Selects companies with favorable ESG attributes\nBest-in-class Uses an ESG scoring system to rank companies\nCombines qualitative ESG factors with quantitative\nESG integration\ndata\nFocuses on a specific ESG theme or attribute in\nThematic investing\nwhich to invest\nSeeks to achieve targeted ESG goals along with\nImpact investing\nmeasurable financial results\nInvestors have increasingly considered environmental, social, and governance (ESG)\nfactors when evaluating companies. In turn, companies have increased their ESG reporting.\nThis reporting allows investors to take different approaches when screening potential\ninvestments and using those insights in their investment strategies.\nOne ESG implementation approach is full integration (ie, ESG integration): investors\nexplicitly include ESG factors in their traditional fundamental analysis of companies (eg,\nwhen making cash flow forecasts). Full integration allows analysts to understand the\nopportunities and risks arising from a company's management of its ESG resources.\n(Choice A) Investment in assets related to specific ESG factors or themes describes thematic\ninvesting.\n(Choice C) Including certain sectors or companies with favorable ESG factors in a fund\ndescribes positive screening.\nThings to remember:\nFull integration is an environmental, social, and governance (ESG) implementation approach\nby which investors explicitly include ESG factors in their traditional fundamental analysis of\ncompanies. Full integration allows analysts to understand the opportunities and risks arising\nfrom a company's management of its ESG resources and how that management affects the\ncompany's value.\nDescribe environmental, social, and governance factors of corporate issuers considered by\ninvestors\nLOS", "qhtml": null}, {"n": 8, "q": "A portfolio consists of two assets:\nExpected standard\nAsset Asset weight (%)\ndeviation (%)\nA 15 75\nB 8 25\nIf the expected standard deviation of the portfolio is 10%, then the two assets can be best\ndescribed as having:", "opts": ["no correlation.", "positive correlation.", "negative correlation."], "ans": "C", "expl": "The correlation coefficient evaluates how two assets' returns move or are expected to\nmove in relation to each other. It measures both the degree and the direction of the\nrelationship between the two assets. Positively correlated asset returns generally move in\nthe same way , while negatively correlated asset returns tend to move in opposite directions.\nThe closer the correlation coefficient is to −1 or 1, the stronger the negative or positive\nrelationship, respectively.\nThe correlation coefficient is used to calculate the expected standard deviation of portfolio\nreturns. The degree and the direction of the variance between asset returns affects the\nportfolio's overall risk. If two assets are less than perfectly correlated, combining them would\nproduce a portfolio with a lower standard deviation than the weighted average of the assets'\nstandard deviations. The closer the correlation coefficient is to −1, the lower the portfolio\nrisk.\nThe relationship between a two-asset portfolio's standard deviation and the weights, standard\ndeviations, and correlation of its component assets is shown below.\nIn this case, since all the other information is provided, the relationships above can be used to\nsolve for the assets' correlation as follows:\nThe correlation coefficient of assets A and B is −0.6792, so they are negatively\ncorrelated (Choices A and B) .\nThings to remember\nThe correlation coefficient of two assets expresses how their returns are expected to move in\nrelation to each other. The closer the coefficient is to 1 or −1, the stronger the correlation. If\ntwo assets are less than perfectly correlated, combining them would reduce the standard\ndeviation of the resulting portfolio, reflecting the lower risk of the assets in combination.\nCalculate and interpret the mean, variance, and covariance (or correlation) of asset returns based\non historical data\nLOS", "qhtml": null}, {"n": 9, "q": "An institutional investor has an above average willingness to take risk and a below average\nability to bear risk. The institution's investment adviser should most reasonably conclude that\nthe institution's risk tolerance is:", "opts": ["below average.", "average.", "above average."], "ans": "A", "expl": "As with individual investors, the risk tolerance of institutional investors is determined by\ntheir ability to bear risk and willingness to take risk. For an institutional investor:\nthe ability to bear risk is based on objective criteria such as the current value of assets\n(eg, pension plan funds) versus future obligations (eg, payments to retirees), and\nthe willingness to assume risk is based on subjective factors (eg, investor's attitude\ntoward risk exposure).\nAn adviser's task is easiest when the investor's ability to bear risk and willingness to take risk\nare consistent with each other. Advisers can appropriately recommend portfolios with more\n(less) risk exposure and higher (lower) expected returns if both the ability and willingness are\nhigh (low). Such recommendations are more challenging if the ability and willingness are not\naligned.\nIn general, when the ability and willingness are not consistent , the prudent course is to\ndetermine a level of risk tolerance that reflects the lower of the two factors . Therefore, for\nan institutional client with an above average willingness to take risk and a below average\nability to bear risk, an adviser would most appropriately conclude the client's risk tolerance is\nbelow average (Choices B and C) .\nThings to remember:\nAn institutional investor's risk tolerance is determined by the ability to bear risk, which can be\nobjectively assessed, and the willingness to assume risk, which is subjective (eg, based on the\ninvestor's attitude toward risk exposure). When the ability and willingness are not aligned,\nthe level of risk tolerance should reflect the lower of the two factors.\nDescribe the major components of an IPS\nLOS", "qhtml": null}, {"n": 10, "q": "Management wishes to limit a company's use of debt since its operating cash flows are\nunpredictable, despite the company's current lenders offering low rates. The company is most\nlikely in its:", "opts": ["mature phase.", "growth phase.", "start-up phase."], "ans": "B", "expl": "Life-cycle phase:\nFinancial and debt characteristics\nLife cycle phase Financial characteristics Debt characteristics\nRevenue growth: Low Availability: Little to none\nCash flow: Negative Cost: High\nStart-up\nBusiness risk: High Capital structure: ~0% debt\nAvailability: Moderate\nRevenue growth: High\nCost: Moderate\nCash flow: Increasing\nGrowth\nType of debt: Secured\nBusiness risk: Medium\nCapital structure: 0%–20% debt\nAvailability: High\nRevenue growth: Slowing\nCost: Low\nCash flow: Positive/predictable\nMature\nType of debt: Unsecured\nBusiness risk: Low\nCapital structure: > 20% debt\nThe proportion of debt in a firm's capital structure typically increases as the firm moves\nthrough its life cycle stages.\nIn the start-up phase, management would prefer taking on debt to avoid equity dilution\nbut the firm lacks access to debt due to high risk. A firm in this phase typically does not\nhave enough assets to secure against debt or enough cash flows to service debt.\nIn the growth phase , debt is more available but management generally chooses\nto use debt conservatively . A firm in this phase has typically started generating a\npositive cash flow, but the preference is to maintain operational flexibility and\nminimize financial risk.\nIn the mature phase, the firm is generating continuous cash flow and deleveraging over\ntime, but management tries to maintain a debt level close to that of the firm's optimal\ncapital structure. A mature firm will often use share buybacks, financed by debt, to\nincrease the proportion of debt in its capital structure.\nA firm's capital structure may also be dictated by the industry in which it operates. In this\nscenario, the company is leveraged and has access to low-cost debt, but management is\ntrying to minimize the risk of financial distress. These considerations suggest that the\ncompany is in the growth phase.\n(Choice A) In the mature phase, a company has a positive cash flow and less need of debt.\n(Choice C) Start-up companies are riskier for capital providers; therefore lenders would not\nbe offering low lending rates to a start-up.\nThings to remember:\nThe proportion of debt in a firm's capital structure typically increases as the firm moves\nthrough the stages of its life cycle. In the growth phase, debt has become more available, but\nmanagement generally uses it conservatively to maintain operational flexibility and minimize\nfinancial risk.\nExplain factors affecting capital structure and the weighted-average cost of capital\nLOS", "qhtml": null}, {"n": 11, "q": "A company's WACC increased from 4.8% to 5.2%. All else equal, which of the following\nis most likely the reason? The company's:", "opts": ["equity beta increased.", "effective tax rate increased.", "preferred stock price increased."], "ans": "A", "expl": "A company can raise capital from different sources (ie, debt, common equity, preferred\nequity), each with a different component cost of capital. A company's weighted average cost\nof capital (WACC) is the weighted average of these component costs, which are weighted by\nthe proportion of each kind of capital the company currently uses to support its business\nactivities.\nA company's cost of equity can be calculated multiple ways, but a common way is to use\nthe capital asset pricing model (CAPM). The CAPM estimates the company's cost of\nequity as its expected return based on the risk-free rate, the expected return of the market,\nand the company's equity beta, which measures risk. An increase in the\ncompany's beta implies greater risk, which results in investors demanding a greater return to\nbe compensated for that risk. This greater expected return results in an increased cost of\nequity and an increased WACC for the company.\n(Choice B) An increase in the company's effective tax rate would decrease its after-tax cost\nof debt and, therefore, its WACC. This applies only in countries that allow interest to be\ndeducted for tax purposes.\n(Choice C) An increase in the price of the company's preferred stock would result in a\ndecrease in its cost of preferred equity and, therefore, its WACC.\nThings to remember:\nA company's cost of equity is commonly calculated through the capital asset pricing model\n(CAPM), which uses the company's equity beta to measure risk. An increase in the company's\nbeta results in investors demanding a greater return to be compensated for that risk, leading\nto an increased cost of equity and weighted average cost of capital (WACC) for the company.\nCalculate and interpret the weighted-average cost of capital for a company\nLOS", "qhtml": null}, {"n": 12, "q": "An analyst collects the following data:\nSharpe Standard\nReturn\nRatio Deviation\nPortfolio A 1.06 13%\nMarket 12% 9%\nThe risk-free rate is 2%. The M-squared value of Portfolio A is closest to:", "opts": ["11.5%", "12.0%", "15.8%"], "ans": "A", "expl": "Portfolio returns are compared to a benchmark to determine whether the portfolio manager\noutperformed the benchmark. However, simply comparing returns is not useful without\nknowing how much risk the manager assumed.\nM2)\nM-squared (or is an investment performance tool that takes risk, as measured by\nstandard deviation, into account. It measures the risk-adjusted excess return of the\nportfolio using the ratio of the market's standard deviation to the portfolio's standard\ndeviation. If the M-squared value is greater than the market return, it indicates that the\nportfolio outperformed the market on a risk-adjusted basis.\nRearranging terms in the equation results in:\nThe blue-shaded terms represent the Sharpe ratio, so the M-squared formula simplifies to:\nSharpe ratio × σ + Risk-free rate\nm\n= (1.06 × 0.09) + 0.02 = 0.1154 = 11.54%\nNote that the difference between a portfolio's M-squared and the market return is known\nas M-squared alpha.\n(Choice B) 12.0% is the market's M-squared value. Since M-squared\nmeasures excess return, there is no excess return between the market's return and itself.\n(Choice C) 15.78% is obtained by incorrectly multiplying the portfolio's Sharpe ratio by its\nstandard deviation instead of the market's standard deviation.\nThings to remember:\nM-squared is a risk-adjusted performance evaluation metric that measures excess portfolio\nreturn relative to the excess market return. It is calculated by multiplying the portfolio's\nSharpe ratio by the market standard deviation and then adding the risk-free rate to that\nresult.\nCalculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen’s alpha\nLOS", "qhtml": "<p>An analyst collects the following data:</p><table class=\"qtable\"><thead><tr><th></th><th>Sharpe Ratio</th><th>Return</th><th>Standard Deviation</th></tr></thead><tbody><tr><td>Portfolio A</td><td>1.06</td><td>—</td><td>13%</td></tr><tr><td>Market</td><td>—</td><td>12%</td><td>9%</td></tr></tbody></table><p>The risk-free rate is 2%. The M-squared value of Portfolio A is closest to:</p>"}, {"n": 13, "q": "When establishing a company's investment decision-making process, which of the following\nrecommendations would be most appropriate ?", "opts": ["Ignore sunk costs as part of the investment analysis.", "Use ROE as a key determinant in investment decisions.", "Rely primarily on allocation templates to improve turnaround."], "ans": "A", "expl": "Common pitfalls in capital allocation\nImproper discount rates\nAccounting errors\nCalculation mistakes\nPoor estimates of overhead cost\nMisuse or overuse of allocation templates\nFavoring IRR for investments with uneven cash\nflows\nProcess deficiencies\nIncluding sunk costs\nIgnoring opportunity costs\nFailing to capture competitor response to\ninvestments\nLack of scrutiny around pet projects\nFlawed managerial decision-\nReliance on short-term metrics (ie, EPS, ROE)\nmaking Overspending or underspending allocation\nbudgets\nFailing to consider investment alternatives\nThe general principles of capital allocation (ie, investment decision-making) are often very\ndifficult to apply since:\nsome decisions are subjective, requiring a manager's judgment, and\ncertain risks may be hard to capture in capital allocation models.\nA robust capital allocation process does not include sunk costs (ie, unrecoverable costs\nincurred in the past). Only costs that directly affect or are affected by the investment decision\nshould be considered; therefore, sunk costs should be disregarded.\n(Choice B) Focusing on ROE instead of NPV may not lead to investments that improve long-\nterm shareholder wealth. Often, companies focus on ROE to boost short-term performance;\ninvestments with large NPVs may take time to become profitable and would not improve\nshort-term performance.\n(Choice C) Investment allocation templates might improve efficiency in the decision-making\nprocess, but the characteristics of investment opportunities that do not fit into the\nstandardized template may be inadvertently ignored. Instead of quick turnaround, a strong\ncapital allocation process should focus primarily on properly capturing investment\ncharacteristics.\nThings to remember:\nThere are several common pitfalls that companies may face when making investment\ndecisions. Investment analysts should disregard sunk costs, avoid relying on allocation\ntemplates, and focus on NPV instead of metrics like ROE, which typically has a short-term\nfocus.\nDescribe principles of capital allocation and common capital allocation pitfalls\nLOS", "qhtml": null}, {"n": 14, "q": "A company is evaluating the production of a new product that requires an initial outlay of CHF\n1 billion. The product is expected to produce after-tax cash flows of CHF 250 million for six\nyears. The company anticipates that the new product will reduce existing product sales, net of\nvariable costs, by CHF 50 million each year the new product is sold. Based on only this\ninformation, the project's IRR is closest to:", "opts": ["5.5%", "7.9%", "13.0%"], "ans": "A", "expl": "The internal rate of return (IRR) is one measure companies use to gauge a project's\nprofitability. It is the discount rate that sets a project's net present value ( NPV ) to zero . If\nthe IRR is greater (less) than the project's actual discount rate (ie, required rate of return\nor WACC), the project is expected to be profitable (unprofitable) since the return on the\nproject exceeds (is exceeded by) its opportunity cost of capital.\nA project's total cash flows (CFs) should account for the effects of externalities (eg,\ncannibalization, incremental brand recognition). In this scenario, since the new product is\nexpected to cannibalize existing product net sales by 50 each period, net CFs of 200 (instead\nof 250) should be used. The timeline for the investment and CFs is shown below:\nUsing a financial calculator and these inputs, the IRR for this project is closest to 5.5%.\n(Choice B) 7.9% results from shifting the timing of the CFs up by a year and combining the\nfirst year of CFs with the initial investment.\n(Choice C) 13.0% results from not accounting for the externality and leaving the project's\nCFs at CHF 250 million.\nThings to remember:\nThe internal rate of return (IRR) is the discount rate that sets a project's net present value to\nzero. If the IRR is greater (less) than the project's actual discount rate, the project is\nexpected to be profitable (unprofitable). A project's cash flows should account for the effects\nof externalities.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return\n(IRR), and return on invested capital (ROIC), and contrast their use in capital allocation\nLOS", "qhtml": null}, {"n": 15, "q": "A company that relies heavily on secondary liquidity sources is most likely to:", "opts": ["reduce its credit risk.", "experience financial instability.", "receive an audit request from regulators."], "ans": "B", "expl": "Primary and secondary liquidity sources\nCash and marketable securities on hand\nLoans from banks, bondholders, or\nPrimary suppliers' trade credit\nOperating cash flow\nSuspended or reduced dividends\nDelayed or reduced capital expenditures\nNew equity\nSecondary\nRenegotiated contract terms\nDisposal of assets\nBankruptcy protection and reorganization\nAn issuer's liquidity pertains to its capacity to meet short-term financial obligations : how\neasily the issuer can convert its assets into cash or secure other liquid assets to cover\nimmediate liabilities. Sources of liquidity can be categorized as primary or secondary.\nPrimary liquidity sources are preferred since they typically do not\nimpact ongoing operations ; however, resorting to secondary sources may become\nnecessary. Secondary liquidity sources may incur greater costs, disrupt the company's\noperations, affect growth potential, and/or signal poor performance to shareholders and\ncreditors. The use of secondary liquidity sources may suggest that the company's financial\nstability is deteriorating.\n(Choice A) If a company relies heavily on secondary liquidity sources, it may reduce its\ncreditworthiness with lenders, who will perceive the company as a greater credit risk. This\nperception could result in worse credit terms and/or higher interest rates on loans.\n(Choice C) Audit requests from regulators are not based on sources of liquidity. These\nrequests are routine regulatory compliance checks or are performed in response to specific\nconcerns or suspicions of accounting irregularities.\nThings to remember:\nAn issuer's liquidity pertains to its capacity to fulfill short-term financial obligations. Primary\nliquidity sources are preferred since they typically do not impact ongoing operations.\nSecondary liquidity sources may incur greater costs, disrupt the company's operations, affect\ngrowth potential, and/or signal poor performance to shareholders and creditors. The use of\nsecondary liquidity sources may indicate the company's financial stability is deteriorating.\nExplain liquidity and compare issuers’ liquidity levels\nLOS", "qhtml": null}, {"n": 16, "q": "When developing the constraints for an Investment Policy Statement, which of the following\nwould most appropriately be considered a \"unique circumstance\"?", "opts": ["An insurance company has more uncertain cash flows than its peers.", "An individual's retirement plan is heavily invested in employer common stock.", "A pension fund is legally restricted from holding more than 50% of its assets in equities."], "ans": "B", "expl": "Investment constraints\nLength of investment objective\nTime horizon\nStatus, treatment of application\nTaxes\nNeed for cash during the time\nLiquidity\nhorizon\nAll laws in the jurisdiction\nSpecial legal status (eg,\nLegal\npension)\nSpecial\nA special aspect of the client\ncircumstances\nWhen constructing an investment policy statement (IPS), an advisor will have to consider\nmultiple investment constraints that influence how the client's assets should be\ninvested. Unique circumstances refer to any aspect of the client's situation that is not\ncovered by one of the other investment constraints. Unique circumstances include:\nA client's beliefs and values (eg, religious, ethical)\nEnvironmental, social, and governance (ESG) practices\nPortions of a client's wealth not included in the manager's portfolio and thus not under its\ncontrol\nThe advisor must consider all a client's assets , even those outside the advisor's control ,\nwhen constructing an IPS . Specifically, the assets should be included in planning to meet\nrisk and return objectives using diversification.\nFor example, if a client's retirement plan is heavily invested in the stock of that client's\nemployer, the client is exposed to the risk of that employer twice: both through the stock\nvalue and through a source of income. The advisor must include this unique\ncircumstance in the client's IPS in order to meet the client's risk objective.\n(Choice A) An insurance company having more uneven and uncertain cash flow than its\npeers is a factor affecting the company's cash needs and therefore would be a liquidity\nconstraint.\n(Choice C) A pension fund being legally restricted from holding more than 50% of its assets\nin equities is a legal restriction on the pension's investments and therefore would be a legal\nand regulatory constraint.\nThings to remember:\nUnique circumstances refer to any aspect of the client's situation that is not covered in one of\nthe other investment constraints. When a client has other assets or wealth that are outside of\nthe control of the advisor, these must still be considered when constructing an IPS in order to\nmeet the client's risk and return objectives.\nDescribe the investment constraints of liquidity, time horizon, tax concerns, legal and regulatory\nfactors, and unique circumstances and their implications for the choice of portfolio assets\nLOS", "qhtml": null}, {"n": 17, "q": "The covariance of a security return's with the market's return is 0.065, and the market's\nreturns have a standard deviation of 0.23. The security's systematic risk is most likely :", "opts": ["less than market risk.", "equal to market risk.", "greater than market risk."], "ans": "C", "expl": "A security's beta reflects its degree of systematic risk—the sensitivity of its returns to market\nfluctuations. The market itself has a beta of 1. When the security's beta:\nhas an absolute value > |1|, the security has greater risk than the market's risk.\nhas an absolute value < |1|, the security has less risk than the market's risk.\nis positive (ie, > 0), the security generally moves in the same direction as the market.\nis negative (ie, < 0), the security generally moves in the opposite direction from the\nmarket.\nBeta is calculated using the standard deviations of both the security and the market as well as\nthe correlation between the security and the market or, alternatively, using the market's\nvariance and the covariance between the security and the market.\nIn this scenario, the beta of the security can be calculated as follows:\nSince the beta of the security has an absolute value greater than 1, this indicates that the\nsecurity's systematic risk is greater than the market's risk (Choices A and B) .\nThings to remember:\nBeta measures systematic risk, indicating how sensitive a security's returns are to changes in\nthe market. The market beta = 1. A beta with an absolute value greater (less) than 1\nindicates that a security's risk is greater (less) than the market's risk. Beta is calculated using\nthe standard deviations of both the security and the market as well as the correlation between\nthe security and the market or, alternatively, using the market's variance and the covariance\nbetween the security and the market.\nCalculate and interpret beta\nLOS", "qhtml": null}, {"n": 18, "q": "A company is evaluating two projects. Project A has an IRR of 6.4%, and Project B has an\nIRR of 7.5%. The company has the following information:\nNext year's dividend ¥40\nDividend growth rate 2.5%\nStock price ¥500\nAfter-tax cost of debt 5.0%\nDebt-to-equity ratio 80%\nAssuming average risk and no capital constraints, the company should most likely invest in:", "opts": ["both projects.", "only Project B.", "neither project."], "ans": "C", "expl": "A company's weighted average cost of capital (WACC) measures its cost to raise additional\ncapital, assuming new projects are funded by the same proportions of capital. WACC is often\nused to evaluate the potential profitability of new projects. When projects have average\nrisk, an internal rate of return ( IRR ) that is less (greater) than the company's WACC means\nthe project is deemed unprofitable (profitable) since its return is less (greater) than the\ncompany's opportunity cost of capital.\nIn this question, to calculate the WACC the cost of equity component must be derived via\nthe Gordon growth model, then the weights of debt and equity must be derived from the\ncompany's debt-to-equity (D/E) ratio. This can be done as follows:\nThe company's WACC is 8.06%. Since both projects have IRRs that are less than the\ncompany's WACC, the company should invest in neither project.\n(Choice A) The company would invest in both projects if the D/E ratio were misinterpreted\nas the percentage of the company's capital financed by debt when calculating the WACC. This\nwould result in a WACC of 6.1%.\n(Choice B) The company would invest only in Project B if the dividend growth rate were not\nadded to ( D / V ) when calculating the cost of equity (8%). This would result in a WACC of\n1 0\n6.67%.\nThings to remember:\nA company's weighted average cost of capital (WACC) measures its cost to raise additional\ncapital. When projects have average risk, an internal rate of return (IRR) less than the\ncompany's WACC means the project is deemed unprofitable since its return is less than the\ncompany's opportunity cost of capital.\nCalculate and interpret the weighted-average cost of capital for a company\nLOS", "qhtml": null}, {"n": 19, "q": "The security market line is best described as:", "opts": ["the graphical representation of the CAPM.", "relating to only portfolios on the efficient frontier.", "intersecting the y-axis at the market risk premium."], "ans": "A", "expl": "The capital asset pricing model (CAPM) allows investors to estimate a security's expected\nreturn given that security's beta, the market's return, and the risk-free rate. Beta calculates\nthe security's expected return based on only its systematic risk.\nThe security market line (SML) is the graphical representation of the CAPM , displaying\nthe linear relationship between a security's expected return (y-axis) and its beta (x-axis).\nThe SML allows investors to identify the relative value of a security. Securities located on the\nSML are deemed to be fairly valued. In contrast:\nSecurities that plot above the SML are undervalued (ie, greater return than expected for\nthe amount of risk), so the value should rise and the expected return should decrease.\nSecurities that plot below the SML are overvalued (ie, less return than expected for the\namount of risk), so the value should fall and the expected return should increase.\n(Choice B) The capital market line relates to only portfolios on the efficient frontier. The SML\nrelates to any security or asset.\n(Choice C) The SML intersects the y-axis at the risk-free rate. The market risk premium is\nthe slope of the SML.\nThings to remember:\nThe capital asset pricing model (CAPM) allows investors to estimate a security's expected\nreturn given that security's beta, the market's return, and the risk-free rate. The security\nmarket line is the graphical representation of the CAPM, displaying the linear relationship\nbetween a security's expected return and its beta.\nExplain the capital asset pricing model (CAPM), including its assumptions, and the security market\nline (SML)\nLOS", "qhtml": null}, {"n": 20, "q": "A company's current financial information includes the following data:\nUnlevered value (AUD millions) 1.75\nDebt (AUD millions) 0\nCost of equity (%) 8\nTax rate (%) 30\nIf the company borrows AUD 1 million at a rate of 4% for a stock buyback, then after the\nbuyback and based on the Modigliani-Miller propositions (with taxes), the company's WACC\nis closest to:", "opts": ["5.71%", "6.83%", "8.00%"], "ans": "B", "expl": "The Modigliani-Miller (MM) propositions hold that, assuming perfectly efficient capital\nmarkets, a company's value and WACC are unaffected by capital structure changes. However,\nif the perfectly efficient market assumption is relaxed to acknowledge corporate taxes, all else\nequal, then according to the MM propositions:\nThe market value of a levered company is greater than that of an unlevered but\notherwise identical company due to the debt tax shield.\nSince the value of the levered company is greater , its WACC must be lower .\nThe cost of equity moves in proportion to the levered company's tax-\nadjusted D/E ratio.\nIn this case, the company currently has no debt, so its WACC equals the cost of equity. After\nadding leverage, the company's WACC is calculated as follows:\nThe levered WACC is approximately 6.83%. All else equal, with leverage , the\ncompany's WACC is less than its unlevered WACC (8.00%); the benefit of the tax shield\nincreases the company's value, decreasing its WACC (Choice C) .\n(Choice A) 5.71% is the result of using the company's unlevered value to find the levered\ncost of equity.\nThings to remember:\nThe Modigliani-Miller propositions hold that, in perfectly efficient capital markets, capital\nstructure does not affect a company's value. All else equal, if taxes are considered, a levered\ncompany likely has a greater value, greater cost of equity, and lower WACC than an unlevered\nbut otherwise identical company.\nExplain the Modigliani–Miller propositions regarding capital structure\nLOS", "qhtml": null}, {"n": 21, "q": "In a corporation, shareholder voting rights most appropriately may be used to:", "opts": ["replace the board of directors.", "make decisions on daily operations.", "change the executive-level management."], "ans": "A", "expl": "Key characteristics of corporations\nSeparate legal entity, distinct from its owners\nLegal identity\nIncorporated under the laws of a regulatory authority\nShareholders delegate operations to an elected board of directors,\nOwner-manager\nwhich hires management\nseparation\nShareholders have limited liability\nOwner liability\nRisk distributed in proportion to share ownership\nEasier access\nExternal financing\nMore flexible: number of owners and transfer of shares\nAll profits taxable for the corporation\nDistributed profits (dividends) taxable for shareholders (double\nTaxation\ntaxation) in some jurisdictions\nAn important characteristic of corporations, public or private, is\nthe separation of ownership and management : owners elect a board of directors to hire\nand oversee professional managers, who are in charge of daily operations.\nThe board of directors is elected by shareholders, primarily to represent shareholder\ninterests. The board supervises the executives of the company on behalf of shareholders.\nShareholders may use their voting rights to decide on matters of corporate governance and\ncorporate transactions and to promote strategic changes in the company. For example, voting\nrights may be used to replace the board or some of its members with individuals who will lead\nthe company in a desired direction.\nGiven the separation of owners and management, shareholders' voting powers typically do not\nextend to decisions regarding daily operations or the replacement of executives (Choices B\nand C) . In some cases, large and/or activist shareholders may seek to influence the\ncompany, but they must do so by controlling seats on the board.\nThings to remember:\nA corporation is characterized by the separation of ownership and management: daily\noperations are typically run by a team of professional managers, who are supervised by a\nshareholder-elected board of directors. Shareholders may use their voting rights to promote\nstrategic changes, such as replacing directors, but not to manage daily operations or choose\nmanagers directly.\nDescribe key features of corporate issuers\nLOS", "qhtml": null}, {"n": 22, "q": "For a firm that is financed with equity and debt, which of the following statements best\ndescribes the firm's optimal capital structure?", "opts": ["With less debt than is optimal, tax benefits outweigh financial distress costs.", "At the optimal capital structure, the unlevered value of the firm is maximized.", "At the optimal capital structure, the investors' required rate of return is maximized."], "ans": "A", "expl": "A mature firm typically includes debt (ie, financial leverage) in its capital structure since the\ncost of debt is generally cheaper than the cost of equity. Additionally, interest expense\ndeductions create a tax shield that enhances earnings and firm value. However, increasing\ndebt can also increase the levered firm's risk of encountering financial distress or bankruptcy.\nSo when the firm uses debt financing, there is a tradeoff between tax benefits and the costs of\nfinancial distress/bankruptcy.\nAs the firm adds debt, up to the optimal level of debt (ie, optimal capital structure), the tax\nbenefits outweigh the financial distress costs , increasing firm value. At its optimal capital\nstructure, the firm value is maximized. If the firm uses more debt than is optimal, the value\nof the levered firm will be lowered as the costs of the risk of distress outweigh the additional\ntax benefits.\nThis (theoretical) optimal capital structure produces the greatest difference between tax\nbenefits and financial distress/bankruptcy costs, thus maximizing the levered firm's value.\n(Choice B) The unlevered firm value is unaffected by debt since an unlevered firm has only\nequity in its capital structure. It is the levered firm value that is maximized at the optimal\ncapital structure.\n(Choice C) The required rate of return for investors is the weighted average cost of capital\n(WACC) for the firm. At the optimal capital structure, WACC is minimized and firm value is\nmaximized.\nThings to remember:\nAs the firm adds debt, up to the optimal level of debt, the tax benefits outweigh the financial\ndistress costs, increasing firm value. At its optimal capital structure, the firm value is\nmaximized, and investors' required return is minimized. If the firm uses more debt than is\noptimal, the value of the levered firm will be lowered as the costs of the risk of distress\noutweigh the additional tax benefits.\nDescribe optimal and target capital structures\nLOS", "qhtml": null}, {"n": 23, "q": "A trader at an investment management firm mistakenly buys 10,000 shares of stock instead\nof the intended 1,000 shares. The types of risks that interact as a result are best\ncategorized as:", "opts": ["operational and market.", "compliance, legal, and liquidity.", "operational, settlement, and credit."], "ans": "A", "expl": "Nonfinancial risks\nSource Example\nUncertainty from transaction\nBankruptcy prior to\nflow\nSettlement\nshipping goods\nTime zone differences\nPotential for lawsuits\nArbitration to resolve a\nFailure to uphold contract\nLegal\ncommercial dispute\nterms\nNoncompliance with\nCompliance regulations\n(eg, regulatory, Restatement of earnings\nChanges in accounting\naccounting, tax)\nstandards\nUse of incorrect model\nUnderstated risk from\nModel Use of correct model\nincorrectly assuming\n(includes tail risk)\nincorrectly\nnormal distribution\nEmployee errors or fraud\nOperational Rogue trader activity\nInsufficient policies\nLack of control over events\nExternal Hurricane damage\nDifficulty in predicting events\nDepletion of cash\nSolvency Bankruptcy or liquidation\nInability to fulfill obligations\nWithin the risk management framework, enterprise level risks are categorized as\neither financial or nonfinancial based on the source rather than the consequence of the\nrisk. As a result, some risks that pose financial consequences are classified as nonfinancial\nrisks.\nNonfinancial risks can originate from within a firm (eg, employees, systems) or from external\nsources (eg, regulators, natural disaster) but are outside the financial markets. Financial risks\noriginate from the financial markets .\nFinancial risks\nSource Example\nMarket Market rate movements Central bank raises interest rates\nFailure to pay/deliver as agreed Corporation defaults on bond\nCredit\n(eg, counterparty risk, default risk) payment\nHaving to significantly discount Company needs to raise cash\nLiquidity\nprice to sell assets quickly\nIn this case, two risks interacted when a nonfinancial operational risk (ie, employee\nerror) created financial market risk : the firm is now subject to the risk of market fluctuation\ndue to the additional 9,000 shares purchased by mistake.\n(Choice B) There is nothing in this scenario that indicates risks categorized\nas compliance (eg, regulatory issue), legal (eg, contract breach), or liquidity (eg, inability to\nsell at fair market prices).\n(Choice C) An operational risk has occurred, but risks categorized as settlement (ie, timing\nof payment) and credit (ie, default), which are often related, are not involved in this case.\nThings to remember:\nNonfinancial risks can originate from within a firm or from external sources but are outside the\nfinancial markets. Financial risks originate from the financial markets. The two risks can\ninteract when a nonfinancial risk also becomes a financial risk.\nIdentify financial and non-financial sources of risk and describe how they may interact\nLOS", "qhtml": null}, {"n": 24, "q": "This question has been deactivated. Please do not rely on the content/concept discussed in this\nquestion as it might be outdated or inaccurate. Due to the volume of feedback, it is not possible for\nus to discuss the reason for deactivation in detail.\nIn capital budget decisions, which of the following best describes a project sequencing\ninteraction?", "opts": ["Ranking investment selections based on projects' net present values", "Choosing projects with shorter payback periods to speed reinvestment of capital", "Investing in a project today to create the option to invest in another, future projects"], "ans": "C", "expl": "Companies regularly evaluate the potential profitability of projects based on their expected\ncash flows. With no constraints, companies could take on every project that has a positive net\npresent value (NPV). However, companies are often forced to make choices since constraints\nprevent them from pursuing all profitable projects or can mandate a specific order of project\ncompletion. Depending on the circumstances, these project interactions include:\nproject sequencing,\ncapital rationing, and\nmutually exclusive projects.\nWith project sequencing , the ability to undertake one project is dependent\non the completion of another . For example, the successful completion of one project may\ncreate the option to invest in future contingent projects, assuming favorable economic\nconditions at that time.\n(Choice A) Ordering investment selections based on projects' net present values is a\ncommon criterion for making investment decisions but is not related to project sequencing.\n(Choice B) Choosing projects with shorter payback periods to speed the reinvestment of\nfunds is one criterion for making investment decisions, but it not related to project\nsequencing. The payback period is deemed an inferior criterion to NPV since it does not\naccount for performance over the entire life of the investment.\nThings to remember:\nProject sequencing, capital rationing, or mutual exclusivity are constraints that can prevent\ncompanies from pursuing all profitable projects or mandate a specific order of project\ncompletion. With project sequencing, the ability to undertake one project is contingent on the\nsuccessful completion of another.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return\n(IRR), and return on invested capital (ROIC), and contrast their use in capital allocation\nLOS", "qhtml": null}, {"n": 25, "q": "A company has the following balance sheet (in SGD millions):\nCash 1,900\nMarketable securities 200\nAccounts receivable 2,500\nInventory 3,100\nProperty, plant & equipment 12,300\nTotal assets 20,000\nAccounts payable 2,600\nAccrued expenses 400\nShort-term debt 2,300\nLong-term debt 5,300\nShareholders' equity 9,400\nTotal liabilities and equity 20,000\nThe company's net working capital (in SGD millions) is closest to:", "opts": ["2,400", "2,600", "2,800"], "ans": "B", "expl": "In addition to evaluating a firm's cash conversion cycle, analysts assess its operational\nefficiency based on working capital , the amount of capital available to support the\nfirm's daily operations . Working capital can be defined and calculated in different ways, as\neither:\nTotal working capital, which is the difference between current assets and current\nliabilities\nNet working capital , which excludes cash and marketable securities (assets)\nand short-term and current portion of long-term debt (liabilities)\nThe concepts are similar, but net working capital excludes items that are not directly\nassociated with the cash conversion cycle. Analysts typically evaluate total or net working\ncapital as a percentage of annual sales, which enables them to compare companies of\ndifferent sizes.\nIn this scenario, the metrics are calculated as follows:\nTherefore, the issuer's total working capital is SGD 2,400 million (Choice A) . Net working\ncapital is SGD 2,600 million, which differs from total working capital since it excludes cash\n(1,900) and marketable securities (200) from current assets and excludes short-term debt\n(2,300) from current liabilities. Note that, as in this scenario, total working capital may be\nless than net working capital.\n(Choice C) 2,800 (= 5,800 − 3,000) results from subtracting only cash (ie, failing to\nsubtract marketable securities) from current assets when calculating net working capital.\nThings to remember:\nWorking capital measures the capital available to support a firm's daily operations. Total\nworking capital is the difference between current assets and current liabilities. Net working\ncapital excludes cash and marketable securities (assets) and short-term and current portion of\nlong-term debt (liabilities) from that difference since those items do not relate directly to the\ncash conversion cycle.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles\nLOS", "qhtml": null}, {"n": 26, "q": "Investors should not expect additional returns for taking on nonsystematic risk since this\nrisk most likely is:", "opts": ["minimized in a well-diversified portfolio.", "the same for every asset in a given market.", "already included in an asset's systematic risk."], "ans": "A", "expl": "Systematic vs. nonsystematic risk\nTotal risk = Systematic risk + Nonsystematic risk\nSystematic risk Nonsystematic risk\nAlso known as market risk or Also known as nonmarket risk\nnondiversifiable risk or firm-specific risk\nInherent in the market Specific to firm or industry\nCannot be eliminated by Can be eliminated by\ndiversification diversification\nExamples: interest rate shifts, Examples: business litigation,\nstock market crashes cyberattacks\nSystematic risk (ie, market risk) is the financial system's inherent risk that affects all\nsecurities in a market. It is associated with macroeconomic factors (eg, recessions, interest\nrates) and cannot be avoided. Nonsystematic risk (ie, firm-specific risk) is the set of\nspecific risks inherent to an individual company or industry .\nSince systematic risk is unavoidable, rational investors expect compensation for taking on this\nrisk. However, nonsystematic risk from any one asset can be minimized in a portfolio\nby adding other, diverse assets . Nonsystematic risk can be minimized to near zero in a well-\ndiversified portfolio, so investors should not expect additional return for accepting it.\n(Choice B) Nonsystematic risk is unique to each company or industry and therefore not\nshared by every asset in a given market.\n(Choice C) Nonsystematic risk is not included in an asset's systematic risk.\nThings to remember:\nNonsystematic risk is a set of specific risks inherent to an individual company or industry.\nRational investors expect compensation for taking on systematic risk. Nonsystematic risk can\nbe minimized to near zero in a well-diversified portfolio, so investors should not expect\nadditional returns for accepting this risk.\nExplain systematic and nonsystematic risk, including why an investor should not expect to receive\nadditional return for bearing nonsystematic risk\nLOS", "qhtml": null}, {"n": 27, "q": "Which of the following best describes an advantage of a conservative approach to working\ncapital management?", "opts": ["Avoiding rollover risk", "Borrowing only as needed", "Refinancing quickly if rates decline"], "ans": "A", "expl": "Range of working capital approaches: conservative to aggressive\nConservative Aggressive\nGreatest ratio of current\nSmallest ratio of current assets to\nassets to sales\nsales\nMore use of long-term\nDescription\nLess use of long-term funding and\nfunding and fewer current\nmore current liabilities\nliabilities\nReduces rollover risk\nReduces short-term cash\nBorrows only as needed; reduces\nneeds for debt service\ntotal debt\nGreater flexibility from larger\nMain\nLower cost of debt and equity\n\"cash cushion\"\nadvantages\nMore opportunity to refinance\nGreater certainty of financing\nFewer restrictions on operations\ncosts and working capital\nneeds\nInability to borrow only as\nRollover risk increases bankruptcy\nneeded; increases total debt\nrisk\nHigher cost of debt and\nLess flexibility from smaller \"cash\nequity\ncushion\"\nMain Building financing position\nMay need to use more costly trade\ndisadvantages\ntakes longer\ncredit, restrict customer credit, or\nLess opportunity to refinance\nsell receivables\nLong-term debt may raise\nMore uncertain financing costs\nrestrictions on operations\nWorking capital and liquidity management aim to enhance the value of a company by\nensuring adequate funds for daily operations and obligations. Firms can take different\napproaches to the financing structure to support current assets , ranging from\nconservative to aggressive.\nA conservative approach combines a larger amount of current assets and less dependence\non short-term financing. This approach can be pursued by:\nfirms in the early-growth phase, lacking access to short-term debt, and\nmature companies, with the ability to shift higher financing costs to clients.\nLong-term debt increases financial stability and flexibility by limiting exposure to market\ndisruptions, providing more predictable costs , and reducing uncertainties of working capital\nneeds. This permanent funding also reduces rollover risk : being forced to refinance short-\nterm debt in periods of market turbulence and thus incurring higher rates.\nHowever, a more conservative approach tends to be more expensive since longer-term debt\ntypically carries higher interest rates. Also, the firm does not have the ability to borrow only\nas needed
