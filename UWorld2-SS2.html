 of applying business cycle sensitivity analysis to global industries\nEconomic performance can vary significantly across countries and regions\nIndustry classification schemes are relative descriptions along a continuum\nInvestors sometimes group companies based on the relative sensitivity of their revenues and\nprofits to the business cycle. However, such groupings have limitations, especially for\ncompanies with operations in multiple countries or regions. Two of the\nprimary limitations of business cycle sensitivity classification are:\nPhases of the business cycle occur at different times in different countries .\nTherefore, a multinational company may be exposed simultaneously to different phases\n(eg, economic expansion in one country, recession in another). For that reason, creating\nan industry benchmark of combined company financials to measure business cycle\nsensitivity would be misleading .\nThe classification labels are discrete (cyclical or noncyclical), but not all companies\nexhibit the same degree of revenue and profit fluctuation in response to business cycle\nchanges. Instead, sensitivity runs along a continuum. For example, some cyclical\nindustries may face larger revenue and profit variations than others with the same\nlabel (Choice C) .\n(Choice B) Although certain companies grow revenue during all phases of the business cycle,\nthis is not a limitation of the groupings since it does not affect the sensitivity of a company's\nrevenue and profits to the cycle. For example, both cyclical and noncyclical companies can be\nconsidered growth companies.\nThings to remember:\nInvestors sometimes group companies based on the sensitivity of their revenues and profits to\nthe business cycle. One factor limiting such groupings is the exposure of multinational\ncompanies to different phases of the business cycle occurring simultaneously in countries\nwhere they have operations (eg, economic expansion in one country, recession in another).\nAnalyze an industry’s structure and external influences using Porter’s Five Forces and PESTLE\nframeworks\nLOS", "qhtml": null}, {"n": 64, "q": "Which of the following statements best describes the underlying basis of price discovery in the\nfutures market?", "opts": ["The futures price is a forecasted value of the underlying.", "The ability to hedge positions allows for the most efficient prices.", "Lower capital requirements allow for information to flow into the market faster."], "ans": "C", "expl": "Purpose and benefits of the derivative markets\nRisk transfer Improves risk allocation and management\nInformation\nReveals the price to avoid uncertainty\ndiscovery\nMarket Requires less capital, transaction costs are\nefficiency lower, and selling (ie, shorting) is easier\nDerivative markets (eg, futures , forwards) are often based on knowledge that has not yet\nbeen absorbed by the spot markets. This is due to the inherent efficiency of derivative\nmarkets, which require less capital, have lower transaction costs, and offer easier\nopportunities to sell (ie, short). Due to those factors:\ncapital (ie, information) often flows faster into these markets,\nprices adjust rapidly, and\nthis price discovery informs the spot markets.\nDerivatives also reveal the price at which a negative outcome (ie, risk) could be avoided.\nThis information discovery is valuable to investors, allowing for better risk transfer decisions.\n(Choice A) A futures price is not an explicit forecast of the future value of the underlying\nasset. The futures price is a function of the known price of that asset, the risk-free rate, and\nother carrying costs, less any benefit or income received by holding the underlying. For\nexample, gold futures prices reflect the underlying costs and benefits of holding gold but do\nnot necessarily forecast what the gold price will be at some point in the future.\n(Choice B) The ability to hedge positions allows investors to transfer risk at a known price.\nHowever, this ability is not directly related to price discovery.\nThings to remember:\nDerivative markets provide price discovery and inherent efficiency by offering lower capital\nrequirements, lower transaction costs, and easier opportunities to sell. These factors allow\ninformation and capital to flow faster into derivative markets than spot markets.\nDescribe benefits and risks of derivative instruments\nLOS", "qhtml": null}, {"n": 65, "q": "An investor purchases a call option on a stock with a strike price of 120 for a premium of 6\nwhen the stock is trading at 118. If the stock is trading at 124 at the option's exercise, the\ninvestor's profit is closest to:", "opts": ["−2", "0", "4"], "ans": "A", "expl": "Call options are contingent claims that give holders (ie, buyers or long parties) the right, but\nnot the obligation, to buy an underlying asset for a fixed price at a future date. The profit or\nloss on a long call is the option's payoff less the premium paid by the buyer.\nThe payoff or exercise value is determined by the underlying asset's market price relative to\nthe strike price at exercise. If the asset's price is:\ngreater than the strike price, the call option is in the money and the call will be\nexercised. The holder's payoff is the difference between the underlying price and the\nstrike price.\nat or below the strike price, the option is at or out of the money and the call will not be\nexercised. Therefore, the holder's payoff is 0.\nSince the underlying asset is trading at 124 (ie, greater than the strike price of 120), the call\nis in the money and the payoff is 4 (124 market price − 120 strike price). The holder's profit\nis −2 (4 payoff − 6 premium).\n(Choice B) 0 is the increase in the underlying asset's price minus the option premium: (124\n− 118) − 6.\n(Choice C) 4 is the payoff of the option. To calculate the profit (loss), the premium must be\nsubtracted from the payoff.\nThings to remember:\nThe profit or loss on a call is the option's payoff less the premium. If the call is at or out of\nthe money, the option will not be exercised; therefore, the holder's loss equals the premium.\nIf the option is in the money, the option will be exercised; therefore, the holder's gain or loss\nequals the payoff minus the premium.\nDetermine the value at expiration and profit from a long or a short position in a call or put option\nLOS", "qhtml": null}, {"n": 66, "q": "An analyst has compiled the following data points from a forward curve:\nPeriod Forward Rate (%)\n0y1y 0.90\n1y1y 1.35\n2y1y 2.89\n3y1y 3.42\nBased on these rates, the price of a 3-year bond with 2.5% annual coupon is closest to:", "opts": ["102.34", "104.01", "104.57"], "ans": "A", "expl": "The present value of a bond is equal to the sum of the bond's discounted cash flows . The\ndiscounting calculation usually relies on spot rates. However, the bond's value also can be\ncalculated using the forward curve , in which each cash flow is discounted using the\ncombination of forward rates that is equivalent to the appropriate spot rate.\nForward rates and spot rates are related and each can be derived from the other (as shown in\nthe image above). However, solving for spot rates is not required to calculate a bond's value.\nInstead, the forward rates can be applied directly to solve the discount rates at each cash flow\nand, subsequently, the present value.\nIn this scenario, since each coupon is 2.50 (100 × 0.025):\n(Choice B) 104.01 is the bond's price if 1y1y (not 0y1y) is used as the starting point of the\ndiscounting calculations.\n(Choice C) 104.57 is the bond's price if each forward rate is applied individually to each cash\nflow, as if they were spot rates.\nThings to remember:\nThe present value of a bond is equal to the sum of the bond's discounted cash flows. Each\ncash flow can be discounted using the combination of forward rates that is equivalent to the\nappropriate spot rate.\nDefine par and forward rates, and calculate par rates, forward rates from spot rates, spot rates\nfrom forward rates, and the price of a bond using forward rates.\nLOS", "qhtml": null}, {"n": 67, "q": "A hedge fund's fees are calculated independently, and the fund does not collect an incentive\nfee on assets that have already been subject to that fee. Which of the following best\ndescribes this fee structure?", "opts": ["Management and incentive fees are on a net basis, subject to a hurdle rate", "Management fees are on a gross basis and incentive fees are on a net basis", "Management and incentive fees are on a gross basis, subject to a high-water mark"], "ans": "C", "expl": "Typical hedge fund fee structure\nFee Basis for calculation Specific details\nTypically 1%−3% of AUM annually\nAssets under\nDoes not depend on fund's profitability\nManagement\nmanagement (AUM)\nAlways calculated before incentive fee\nCan be net or gross of management fee\nCan be subject to hurdle rate and/or\nPerformance or incentive Annual returns\nhigh-water mark\nHedge funds often levy both a management fee and an incentive fee. If fees are calculated\nindependently , calculations are on a gross basis . An incentive fee is often contingent on:\nprofits being greater than a hurdle rate, which is the minimum performance that a fund\nmust achieve before earning a performance fee, and/or\nAssets under management (AUM) being above a high-water mark (HWM), which is the\nbase asset value used to calculate the incentive fee. The HWM represents the\nfund's previous peak value of AUM at which incentive fees have been paid .\nIn this case, the fee structure's management and incentive fees are on a gross basis (ie,\nindependently), subject to a high-water mark, since the fund does not collect an incentive fee\non assets that have already been subject to that fee (Choices A and B) .\nThings to remember:\nHedge funds often levy both a management fee and an incentive fee. If fees are calculated\nindependently, calculations are on a gross basis. The high-water mark represents the fund's\nprevious peak value of assets under management (AUM) at which incentive fees have been\npaid.\nCalculate and interpret alternative investment returns both before and after fees\nLOS", "qhtml": null}, {"n": 68, "q": "An analyst expects a company to pay its first dividend of SGD 5 per share in 4 years and\nexpects this dividend to grow at a rate of 4% thereafter. The required rate of return is 9%\nand the expected market return is 10%. If the stock is currently trading at SGD 73.68, then\nbased on the dividend discount model, the analyst should most appropriately classify the stock\nas:", "opts": ["undervalued.", "fairly valued.", "overvalued."], "ans": "A", "expl": "The Gordon growth model (GGM) is a dividend discount model that estimates a stock's\nintrinsic value as the present value of its future cash flows, a stream of dividends that grow at\na constant rate. To calculate the present value of this perpetuity, discount the next\ndividend by the required rate of return ( r ) adjusted for the constant dividend growth\nrate ( g ).\nIn this scenario, the analyst expects the stock to begin paying a dividend of SGD 5 per share\nin Year 4. Therefore, using the GGM, the stock's intrinsic value at the end of Year 4 is\ncalculated as the present value of the dividend in Year 5. The dividend in Year 4 is added\nseparately as part of the company's future cash flows but not accounted for in the constant\ngrowth value.\nBased on the GGM, the stock's intrinsic value is SGD 77.22 . Since the market price of SGD\n73.68 is lower than the intrinsic value , the stock is undervalued .\n(Choice B) A conclusion that the stock is fairly valued results from omitting the Year 4\ndividend to arrive at an intrinsic value of SGD 73.68, equal to the market price.\n(Choice C) A conclusion that the stock is overvalued results from using the expected market\nreturn (10%) instead of the required rate of return (9%) to arrive at an intrinsic value of SGD\n62.68.\nThings to remember:\nThe Gordon growth model estimates a stock's intrinsic value as the present value of its future\ncash flows, a stream of dividends that grow at a constant rate. To calculate the present value\nof this perpetuity, discount the next dividend by the required rate of return adjusted for the\nconstant dividend growth rate.\nCalculate and interpret the intrinsic value of an equity security based on the Gordon (constant)\ngrowth dividend discount model or a two-stage dividend discount model, as appropriate\nLOS", "qhtml": null}, {"n": 69, "q": "An equity call option is most likely in the money when the stock price is greater than the:", "opts": ["strike price.", "strike price plus the premium.", "present value of the strike price."], "ans": "A", "expl": "Moneyness\nCall Condition Put\nIn the money Spot price > Strike price Out of the money\nAt the money Spot price = Strike price At the money\nOut of the money Spot price < Strike price In the money\nOptions are contingent claims that give holders (ie, buyer or long party) the right to trade an\nunderlying asset at a fixed price (ie, strike or exercise price) at a future date. In the\nmoney means that an option has value if exercised: the option allows the holder to trade the\nunderlying at a better price than its current market price.\nCalls are in the money when the asset's market price is > the option's exercise price.\nPuts are in the money when the asset's market price is < the option's exercise price.\nIf an equity call is in the money , the option holder can buy the underlying stock through\nexercise of the option at a lower price than it would cost to buy the shares in the open\nmarket .\n(Choice B) The underlying stock price needs to be above a call's strike price plus premium\n(ie, breakeven point) for the call buyer to earn a profit. However, moneyness is determined\nby the relationship of the underlying asset's price to the exercise price, regardless of the\npremium paid.\n(Choice C) The present value of the strike price is used in option valuation (eg, put-call\nparity) but is not a factor in determining an option's moneyness.\nThings to remember:\nCall options give holders the right to buy an underlying asset for a specified price at a future\ndate. In the money means that an option has value if exercised. A call is in the money when\nthe underlying asset's price is greater than the option's strike price.\nExplain the exercise value, moneyness, and time value of an option\nLOS", "qhtml": null}, {"n": 70, "q": "An analyst has gathered the following forward rates:\nPeriod Forward Rate\n0y,1y 2.23%\n1y,1y 2.49%\n2y,1y 2.61%\nIf the rates are based on a periodicity of one, the implied two-year spot rate is closest to:", "opts": ["2.36%", "2.44%", "2.75%"], "ans": "A", "expl": "A spot rate is the YTM on a zero-coupon bond. A forward rate is a future period interest rate\nthat reflects the differences between spot rates of different maturities. Arbitrage-free\npricing ensures that two investment strategies of equivalent risk covering the same time\nhorizon earn the same return . Therefore, a spot rate for a given term must be consistent\nwith a series of forward rates over the same horizon , and that series of forward rates can\nbe used to find the implied spot rate for that term.\nFor this scenario, the two investment strategies reflecting the series of forward rates are:\nBuy a two-year zero-coupon bond and hold to maturity\nBuy a one-year zero-coupon bond and hold to maturity, then reinvest the proceeds in\nanother one-year zero-coupon bond\nThese two strategies are illustrated on a timeline:\nThe implied two-year spot rate can be computed using the given equation:\nNote the forward rate notation used: The second numeral denotes the term of the forward\nrate, and the first numeral denotes its starting point . For example, \"2y,1y\" should be read as a\none-year rate beginning 2 years from today.\n(Choice B) 2.44% is an arithmetic average of the three forward rates.\n(Choice C) 2.75% results from incorrectly applying the formula for calculating a forward rate\n[(1+1y,1y)2 0y,1y)1]\ngiven spot rates of different maturities: / (1+ − 1.\nThings to remember:\nArbitrage-free pricing ensures that two investment strategies of equivalent risk covering the\nsame time horizon earn the same return. Therefore, a spot rate for a given term must be\nconsistent with a series of forward rates over the same horizon, and that series of forward\nrates can be used to find the implied spot rate.\nDefine par and forward rates, and calculate par rates, forward rates from spot rates, spot rates\nfrom forward rates, and the price of a bond using forward rates.\nLOS", "qhtml": null}, {"n": 71, "q": "Which of the following most likely combines an estimate based on a present value model with\na fundamental variable?", "opts": ["Justified forward price-to-earnings ratio", "Trailing 12-month price-to-earnings ratio", "Cross-sectional comparison of price-to-earnings ratios"], "ans": "A", "expl": "Price-to-earnings (P/E) ratios\nTrailing P/E Forward P/E Justified forward P/E\nJustified by future flows\nNumerator Current price\n(free cash flow, dividends)\nDenominator Past earnings Future earnings Future earnings\nIn general, a price multiple is a ratio that expresses the relationship between a stock's price\nand a fundamental variable (eg, earnings). This form of relative valuation can help investors\ngauge whether the stock is fairly valued compared with similar stocks. The price-to-earnings\n(P/E) ratio is a common price multiple that relates stock price to earnings per share (EPS).\nWhen a price multiple is justified (eg, justified forward P/E ratio), the price in\nthe numerator is typically based on a present value calculation (eg, discounted free cash\nflow, discounted dividends) and the denominator is based on a near-term estimate of the\nfundamental variable (eg, next year's forecasted EPS). In this scenario, a justified forward\nP/E ratio combines a present value model with a fundamental variable.\n(Choice B) A trailing 12-month P/E ratio (Current stock price / Earnings of the previous 12\nmonths) uses the current stock price (not the justified price) in the numerator.\n(Choice C) The cross-sectional method of comparison involves comparing several price\nmultiple values (eg, P/E ratios of several companies). This method relies on the law of one\nprice, not on justified values. The law of one price states that the stocks of similar companies\nshould be similarly valued using current market prices and relative to their respective current\nfundamentals.\nThings to remember:\nWhen a price multiple is justified (eg, justified forward price-to-earnings ratio), the stock price\n(numerator) is typically based on a present value calculation (eg, discounted cash flow model)\nand the fundamental variable (denominator) is based on a near-term estimate (eg, next year's\nforecasted earnings per share).\nExplain the rationale for using price multiples to value equity, how the price to earnings multiple\nrelates to fundamentals, and the use of multiples based on comparables\nLOS", "qhtml": null}, {"n": 72, "q": "Level I sponsored ADRs are most likely :", "opts": ["to trade over-the-counter (OTC).", "used to raise new US equity capital.", "subject to the most stringent SEC filing requirements."], "ans": "A", "expl": "American depository receipt (ADR) overview\nRule 144A Level I Level II Level III\nYes, but only\nRaise new US capital No No Yes, public offering\nQIB private placement\nYes, more robust\nSEC registration None Yes, basic Yes, basic\nfiling required\nOver-the- NYSE, NYSE, NASDAQ,\nTrading venues Unlisted\ncounter NASDAQ, AMEX AMEX\nListing fees Low Low High High\nSize/earnings\nNone None Yes Yes\nrequirements\nQIB = Qualified institutional buyers\nForeign companies can access US investors and broaden their equity investor base by\ncreating American depository receipts (ADR). In a sponsored ADR, a foreign company\ndeposits shares of its stock with certain banks that create dollar-denominated certificates (ie,\nADRs), which will usually be listed on an exchange. An ADR trades just like a stock and\ngenerally tracks the underlying value of the company's shares that trade on a foreign\nexchange.\nThere are four primary types of ADR listings , each\nwith progressively more stringent listing and corporate governance requirements :\nRule 144A ADR: unregistered and privately sold only to qualified investors, with resale\nrestrictions\nLevel I : SEC-registered and trades over-the-counter (OTC) with basic access to US\ninvestors\nLevel II: SEC-registered and exchange-traded with better investor access but higher\ncost and more requirements\nLevel III: most stringent SEC registration requirements; can be used by foreign-listed\nfirms to raise new equity capital and for acquisitions\n(Choices B and C) Level I ADRs give foreign-listed firms the most basic access to US\nmarkets and investors. SEC filing requirements are less stringent, and these ADRs may not be\nsold to raise new equity capital in the US.\nThings to remember:\nLevel I American depository receipts (ADRs) give foreign-listed firms the most basic access to\nUS markets and investors. Level I ADRs trade over-the-counter, have less stringent SEC filing\nrequirements, and may not be sold to raise new equity capital in the US.\nDescribe methods for investing in non-domestic equity securities\nLOS", "qhtml": null}, {"n": 73, "q": "Regarding equity valuation, which of the following most likely relies on the law of one price?", "opts": ["A year-on-year comparison of a company's stock price.", "A cross-sectional comparison of P/E ratios across automobile manufacturers.", "A comparison between a justified P/E ratio and a trailing 12-month P/E ratio for a stock."], "ans": "B", "expl": "Price multiples, such as the P/E ratio, typically express the relationship between a company's\nstock price and a fundamental variable, such as earnings. The method of comparables\ncommonly entails comparing price multiples across companies in the same industry (ie, cross-\nsectional analysis) to gauge whether a company is fairly valued relative to its competitors\nbased on the law of one price.\nIn theory, the law of one price implies that similar companies should be priced\nsimilarly relative to their fundamentals. For example, if the median P/E ratio in an industry is\n10, then a fairly priced company would be priced at 10 times its EPS. If a company's stock\nprice is more (less) than 10 times its EPS, then it may be overvalued (undervalued) relative to\nits industry peers.\n(Choice A) A year-on-year comparison of stock price measures growth for shareholders.\nUnless the stock price is compared to a fundamental variable, the law of one price does not\napply.\n(Choice C) A trailing 12-month P/E ratio is based on current price and historical earnings,\nwhereas a justified forward P/E ratio is based on forecasted stock price and earnings.\nComparing the two P/E ratios (justified versus trailing) does not rely on the law of one price.\nThings to remember:\nThe method of comparables commonly entails comparing price multiples across companies in\nthe same industry (ie, cross-sectional analysis) to gauge whether a company is fairly valued\nrelative to its competitors based on the law of one price. In theory, the law of one price\nstipulates that similar companies should be priced similarly relative to their fundamentals.\nExplain the rationale for using price multiples to value equity, how the price to earnings multiple\nrelates to fundamentals, and the use of multiples based on comparables\nLOS", "qhtml": null}, {"n": 74, "q": "Which of the following best replicates the cash flows of an interest rate swap? A series of:", "opts": ["interest rate futures.", "interest rate call options.", "forward rate agreements."], "ans": "C", "expl": "Fixed-for-floating interest rate swaps are over-the-counter (OTC) derivatives in which\ncounterparties agree to exchange a series of fixed payments for a series of floating payments.\nAt each swap payment date:\nthe floating payer owes cash to the fixed payer if the reference interest rate is greater\nthan the swap's fixed rate, or\nthe fixed payer owes cash to the floating payer if the reference interest rate is less than\nthe swap's fixed rate.\nSwap cash flows are similar to forward rate agreements' (FRAs') cash flows (at expiration)\nsince:\nthe FRA seller (ie, short) pays the buyer (ie, long) if the reference interest rate is greater\nthan the agreed rate, and\nthe FRA buyer (ie, long) pays the seller (ie, short) if the reference rate is less than the\nagreed rate.\nGiven this similarity, the swap's cash flows can be replicated by a portfolio of FRAs with\nexpirations matching each swap payment date, all having agreed interest rates equal to the\nswap's fixed rate.\n(Choice A) Unlike FRAs, futures are exchange-traded derivatives that generate daily cash\nflows since they are marked to market every trading session. Although a portfolio of interest\nrate futures could create similar market exposure to that of an interest rate swap, a portfolio\nof futures could not replicate a swap's cash flows.\n(Choice B) Holders of interest rate calls never incur negative cash flows at expiration.\nHolders receive either the in-the-money call value in cash or nothing. In contrast, swaps may\nhave positive or negative cash flows on the payment dates.\nThings to remember:\nA swap is equivalent to a portfolio of forward contracts. The portfolio consists of a forward\ncontract for each swap payment date, each with an expiration coinciding with a swap payment\ndate.\nDescribe how swap contracts are similar to but different from a series of forward contracts\nLOS", "qhtml": null}, {"n": 75, "q": "In credit analysis, the size of the notching adjustment for the rating on a corporate bond issue\nis most likely :", "opts": ["unrelated to the issuer's reference credit rating.", "directly related to the issuer's reference credit rating.", "inversely related to the issuer's reference credit rating."], "ans": "C", "expl": "Notching guidelines relative to credit rating\nSecurity class Seniority ranking Ba2 or higher Ba3 or lower\nSecured debt Secured bonds +1 +1\nSenior unsecured bonds 0 0*\nSenior subordinated bonds −1 −2\nUnsecured debt\nSubordinated bonds −1 −2\nJunior subordinated bonds −1 −2 or −3\nEquity Preferred stock −2 −3 or −4\n*The reference rate for issuers rated Ba3 or lower may be either the senior\nunsecured debt rating or the corporate family credit rating.\nSource: Moody's Investors Service\nBond credit ratings are based on expected losses from default, which reflect estimates of\ndefault probability and the severity of loss in case of default. A bond's rating reflects both the\ngeneral creditworthiness of the issuer and issue-specific factors (eg, collateral,\nsubordination). Notching is the rating agencies' process for determining the rating on\nindividual issues relative to the issuer's reference credit rating, which is typically the\nrating on the issuer's senior unsecured debt or the corporate family credit rating.\nThe image above illustrates the notching guidelines and shows how notching adjustments are\ninversely related to a company's reference credit rating. The smaller notching\nadjustments for issuers with higher credit ratings reflect the much lower probability of\ndefault. The probability of default by lower-rated issuers is much higher, so their issues\nrequire larger notching adjustments to capture the greater risk exposure (Choices A and B) .\nThings to remember:\nBond credit ratings are based on expected losses resulting from default, which reflect both the\ngeneral creditworthiness of the issuer and issue-specific factors. Notching adjustments are\ninversely related to an issuer's reference credit rating. Therefore, the debt of issuers with\nhigher credit ratings will have smaller notching adjustments due to the lower exposure to\ncredit risk.\nDescribe the uses of ratings from credit rating agencies and their limitations.\nLOS", "qhtml": null}, {"n": 76, "q": "When analyzing the credit risk of a bond issue, the expected loss can most likely be estimated\nknowing only the bond's:", "opts": ["spread risk and loss severity.", "downgrade risk and recovery rate.", "default probability and loss severity."], "ans": "C", "expl": "Rating agencies' assessments of credit risk reflect the expected loss that results from a\nborrower (ie, bond issuer) default. The two elements of credit risk are default probability and\nloss severity:\nDefault probability is the estimated likelihood of a default occurring.\nLoss severity is an estimate of the decrease in value of the bondholder's claim (ie,\nprincipal and any past-due coupons) in the event of a default.\nExpected loss is estimated as the product of two factors: default probability and loss\nseverity , where loss severity equals 1 − Recovery rate. The terms loss severity, loss given\ndefault, and loss severity given default are used interchangeably, and whichever expression is\nused is equal to 1 − Recovery rate.\n(Choices A and B) Spread risk (ie, change in the difference of a bond's YTM versus\na benchmark yield) and downgrade risk (ie, potential of a bond's credit rating being reduced)\nreflect possible changes in a bond's credit quality, but neither directly measures default\nprobability.\nThings to remember:\nThe two elements of credit risk are the probability of a default and the severity of loss if a\ndefault occurs. Bondholder losses from default are estimated by multiplying default\nprobability by loss severity (1 − Recovery rate).\nDescribe credit risk and its components, probability of default and loss given default.\nLOS", "qhtml": null}, {"n": 77, "q": "Which of the following exposes a counterparty lending to a bank to the least amount of credit\nrisk?", "opts": ["Central bank funds", "Repurchase agreements", "Negotiable certificates of deposit"], "ans": "B", "expl": "Short-term bank funding alternatives\nFunds deposited by individual and commercial customers\nChecking (ie, demand), savings, and money market\nRetail deposits\naccounts\nCommercial bank deposits (usually required) at central\nbank\nCentral bank\nExcess over required minimum may be lent to other\n(reserve) funds\nbanks\nMarket for deposits and loans between banks\nInterbank funds\nLarge denomination deposits with penalties for early\nNegotiable\nwithdrawal\ncertificates\nWithdrawal penalty avoided by sale of deposit to another\nof deposit (CDs)\ninvestor\nSecurity sale paired with later repurchase of same\nRepurchase\nsecurity\nagreements (repos)\nCombined transactions equivalent to a collateralized loan\nA repurchase agreement (repo) is structured as a pair of transactions:\nAt initiation securities are sold for cash, and at the same time\nthe counterparties agree to a second trade in which the seller will repurchase those\nsecurities at maturity at a higher price.\nThe required repurchase makes repos economically equivalent to collateralized loans. The\nrepo buyer (ie, lender ) has securities that can be sold to recover the amount owed if the\nrepo seller (ie, borrower) fails to repurchase them. The amount borrowed in a repo is less\nthan the value of the collateral , thus minimizing the lender's exposure to credit risk .\n(Choices A and C) Loans of central bank funds and negotiable certificates of deposit are not\ncollateralized, so the lenders are exposed to more credit risk than in a repo.\nThings to remember:\nRepurchase agreements (repos) consist of an initial sale of securities and the subsequent\nrepurchase of those securities. Repos are a type of collateralized loan since the buyers are\nprotected from default by possessing the securities. Loans of central bank funds and\nnegotiable certificates of deposit are not collateralized and therefore expose the lenders to\nmore credit risk.\nCompare short-term funding alternatives available to corporations and financial institutions.\nLOS", "qhtml": null}, {"n": 78, "q": "The I-spread is most appropriately defined as the difference between a bond's yield and:", "opts": ["a swap rate.", "the spot curve.", "a government bond's yield."], "ans": "A", "expl": "A yield spread is the difference between a bond's YTM and a benchmark yield. The\nbond's yield can be expressed as the sum of\nthe benchmark rate, which represents factors that affect all bonds , and\nthe spread , which represents factors that are more specific to a bond or issuer .\nDifferent yield spreads result from the use of different benchmarks. Bond yields are often\nused as a benchmark, but benchmarks can also be derived from an interest rate swap\ncurve. The I-spread is defined as the spread that a bond earns versus a swap rate of\nthe same tenor.\n(Choice B) The spot curve is used to derive the Z-spread, which is a spread applied across\nthe benchmark curve that allows the bond's discounted cash flows to equal the bond's price.\n(Choice C) The excess yield a bond earns over a government bond is the G-spread.\nThings to remember:\nA yield spread is the difference between a bond's YTM and a benchmark yield. The I-spread is\ndefined as the difference in yields between a bond and a swap rate of the same tenor.\nCompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds.\nLOS", "qhtml": null}, {"n": 79, "q": "Regarding alternative investments, which of the following is most likely characteristic of co-\ninvesting? Alternative investment managers:", "opts": ["are offered private deals from their fund investors.", "have better access to private deals than direct investors.", "bring in other investors on the most attractive private deals."], "ans": "B", "expl": "Co-investing in alternative investments\nAdvantages Disadvantages\nOffers direct investing experience Requires more resources and\nLeverages the investment firm's expertise than fund investing\nprocess and expertise Direct investing opportunities are\nReduced management fees dependent on the investment firm\nMore active approach Potential adverse selection bias\nThe three most common methods of engaging in alternative investments, ordered by the\nincreasing level of involvement or expertise required, are:\nFund investing : The fund (eg, hedge fund) makes all the investment decisions. Fund\ninvesting is an indirect method of investing.\nCo-investing : An investor in an alternative fund (eg, private equity fund) can invest\ndirectly (ie, privately and outside the fund structure) by committing additional capital to\nspecific investments along with the fund manager who introduced the idea (ie, as an\nintermediary).\nDirect investing : An investor makes a direct investment in an asset (eg, takes a\nposition in a private company directly, without using an intermediary).\nCertain fund managers enjoy reputational benefits that make them desirable\npartners in private deals. The involvement of such managers, like well-known hedge funds,\ncreates an aura of legitimacy that boosts the chances of a successful offering for the issuer.\nTherefore, issuers seek out these managers, giving them better access to the best\ndeals than other direct investors. Adverse selection bias is possible, however, since the\nmanagers may choose to keep those deals for themselves (Choice C) .\n(Choice A) Alternative investment managers offer private deals to their fund investors, not\nthe other way around.\nThings to remember:\nCertain fund managers enjoy reputational benefits that make them desirable partners in\nprivate deals. The involvement of such managers creates an aura of legitimacy, boosting the\nchances of a successful offering. Therefore, issuers seek out these managers, which gives the\nmanagers better access to the best deals but could lead to adverse selection bias if they\nchoose to keep those deals for themselves.\nCompare direct investment, co-investment, and fund investment methods for alternative\ninvestments\nLOS", "qhtml": null}, {"n": 80, "q": "A swap contract is priced so that it has a value of zero at initiation. If the value of the\nunderlying changes during the life of a swap contract, the most likely impact is that:", "opts": ["only the price of the swap changes.", "only the value of the swap changes.", "both the value and price of the swap change."], "ans": "B", "expl": "Swaps: pricing vs. valuation\nDefinition Method Time horizon\nSetting terms so contract Set fixed rate so present values of\nFull length of contract\nPricing has an initial value of payments from counterparties are\nfrom initiation\nzero equal\nDetermine difference between Remaining life of\nDetermining contract's\nValuation present values of fixed and floating contract from\nvalue after initiation\npayments valuation date\nAlthough the terms pricing and valuation are used interchangeably in some contexts, they\nhave distinct meanings when used in regard to swaps.\nSwap pricing refers to setting contract terms at initiation, and\nvalue refers to determining the value of a swap after initiation.\nBoth counterparties are paying and receiving, so the value of the swap is simply the difference\nin the present value of the future cash flow streams. Most swaps are priced to have an initial\nvalue of zero since both sides enter into the swap to exchange cash flows of equivalent value.\nThe swap's value at any time after initiation is affected by changes in market\nconditions and by the fluctuating value of the underlying . As these changes and\nfluctuations occur, the values of the cash flow streams change for each counterparty. The\ndifference is reflected in the swap's value, which is the net difference in the present values of\nits cash flows (Choices A and C) .\nThings to remember:\nSwap pricing refers to setting contract terms at initiation, when the swap value is typically\nzero. At any time after initiation, the value is the net difference in the present value of the\nswap's cash flows.\nContrast the value and price of swaps\nLOS", "qhtml": null}, {"n": 81, "q": "A hedge fund manager wants the power to liquidate positions in a well-organized way\nwhenever necessary and plans to impose restrictions on investors' ability to redeem capital.\nWhich of the following restrictions would be most appropriate ?", "opts": ["Notice period", "Lockup period", "Redemption fee"], "ans": "A", "expl": "Investor redemptions can significantly impact the performance of hedge funds. Unplanned\nredemption requests may force the fund manager to sell illiquid or volatile assets at\nunfavorable prices. This may harm fund performance and result in losses for the remaining\ninvestors.\nHedge funds often impose restrictions on investors, discouraging or prohibiting redemptions\nduring specific periods:\nA lockup period is the minimum time an investor is committed to a fund after the\ninitial investment . This restriction should give the fund manager a reasonable time\nframe to select and acquire assets that optimize the fund's strategy. Withdrawals\nare not allowed during this period, but nothing restricts redemptions after the\nlockup period ends (Choice B) .\nA notice period is the length of time an investor is required to wait to receive a\nredemption after requesting it. This restriction gives the fund manager more time to\nconvert assets into cash, which reduces the risk of forced selling and makes the notice\nperiod the most appropriate choice for fund managers concerned about liquidity.\nRedemption fees are paid by investors when redeeming their capital and are generally\nadded back to the fund. The fees compensate the remaining investors for losses the\nfund may eventually suffer when liquidating positions in an accelerated way. Redemption\nfees discourage but do not prohibit redemptions at any time (Choice C) .\nThings to remember:\nHedge funds often impose restrictions on redemptions. These restrictions may prohibit\ninvestors from redeeming for a period after the initial investment (lockup period) and/or\nrequire advance notice for processing redemptions (notice period). Funds may also impose\nredemption fees, which discourage—but do not prohibit—redemptions and generally\ncompensate the remaining investors for any resulting losses.\nDescribe the performance appraisal of alternative investments\nLOS", "qhtml": null}, {"n": 82, "q": "All else equal, if the actual return from investing in a company's stock is less than the\ninvestors' minimum required rate of return, which of the following is most likely to increase?\nThe company's:", "opts": ["cost of debt.", "cost of equity.", "return on equity."], "ans": "B", "expl": "The investors' minimum required rate of return for providing equity capital to a company can\nbe thought of as the company's cost of equity ( r ). If a stock's actual return is less than the\ne\ninvestors' minimum required rate of return, then:\n1. investors will sell the stock and invest the proceeds elsewhere, thus decreasing the\ncompany's stock price.\n2. If company fundamentals do not change (eg, future earnings or cash flow expectations),\n3. the expected return from buying the stock increases as the baseline stock price\ndecreases .\nThis causes an increase in the minimum required rate of return (ie, cost of equity).\n(Choice A) The cost of debt is based on the return expectations of creditors (ie, bondholders,\nlenders), not equity investors.\n(Choice C) ROE (ie, Net income / Average shareholders' equity) is an accounting measure\nbased on a company's reported financial results and thus is backward looking. As such, ROE\nis not impacted by the actual stock returns, which are based on market values.\nThings to remember:\nIf a stock's return is not greater than r in the capital markets, then investors will sell the\ne\ncompany's stock and invest the proceeds elsewhere, thus decreasing the company's stock\nprice. Holding all else equal, as the stock price decreases, the expected return from buying\nthe stock and, consequently, the company's cost of equity increase.\nCompare a company’s cost of equity, its (accounting) return on equity, and investors’ required\nrates of return\nLOS", "qhtml": null}, {"n": 83, "q": "If a country's security markets are semi-strong form efficient, an investor would most likely be\nable to generate abnormal returns using:", "opts": ["only technical analysis.", "only fundamental analysis.", "neither technical nor fundamental analysis."], "ans": "C", "expl": "The efficient market hypothesis (EMH) stipulates that markets are efficient when asset prices\nfully reflect all relevant information. If a market is efficient, abnormal returns cannot be\nconsistently achieved in that market with information obtained from sources specified by the\nEMH.\nIn the semi-strong form of market efficiency, asset prices are assumed to reflect all\nhistorical market data plus all publicly available information (eg, financial statements,\nearnings calls). Historical data and public information are both completely assimilated into\nprices, so an investor cannot achieve abnormal returns using those resources. An investor\ncould achieve abnormal returns only by using insider information.\nTwo analytical methods are used to estimate the relative value of investments and develop\ninvestment decisions:\nTechnical analysis (eg, charting techniques) uses a market's historical trading and\nvolume data.\nFundamental analysis (eg, free cash flow valuation) uses publicly available data to derive\nan asset's intrinsic value.\nTherefore, in a semi-strong form efficient market, neither technical nor fundamental analysis\nwould be able to generate abnormal returns (Choices A and B) .\nThings to remember:\nUnder the semi-strong form efficient market hypothesis, all historical market data and publicly\navailable information are reflected in asset prices. To develop investment decisions, technical\nanalysis uses historical market data while fundamental analysis uses publicly available data.\nTherefore, in a market with semi-strong form efficiency, neither technical nor fundamental\nanalysis would be able to generate abnormal returns.\nExplain the implications of each form of market efficiency for fundamental analysis, technical\nanalysis, and the choice between active and passive portfolio management\nLOS", "qhtml": null}, {"n": 84, "q": "An enterprise value (EV) multiple least appropriately measures a company's EV relative to its:", "opts": ["EBITDA.", "Net income.", "Operating income."], "ans": "B", "expl": "Enterprise value vs. equity value multiples\nEV / EBITDA\nEV / Revenue\nEnterprise value (EV) multiples EV / Operating Income\nEV / FCFF (free cash flow to the firm)\nP/E (price-to-earnings)\nPEG (price/earnings-to-growth)\nEquity value multiples\nP/B (price-to-book)\nEnterprise value (EV) multiples are relative valuation metrics that gauge a firm's EV\nrelative to a fundamental variable.\nThe ratio's numerator, the EV, measures the value of a firm's entire operation, which is\nfinanced by all sources of capital (ie, common equity, debt, preferred stock).\nThe ratio's denominator , the fundamental variable, is typically a financial metric (eg,\nrevenue, EBITDA, operating income) that represents funds generated by the firm that\nare available to all capital providers (ie, before any interest and/or dividends are paid).\nSince EV encompasses the entire firm, it is most appropriate to compare it to a metric that\nrepresents funds available to all capital providers , such as EBITDA or operating\nincome (Choices A and C) . In contrast, net income is net of interest owed to debt providers\nand represents remaining funds available only to shareholders. Net income is appropriate for\ncomparisons involving equity value (eg, P/E ratio).\nThings to remember:\nEnterprise value (EV) multiples are relative valuation metrics that gauge a firm's EV relative to\na fundamental variable. EV measures the value of a firm's entire operation, which is financed\nby all sources of capital. The fundamental variable is typically revenue, EBITDA, operating\nincome, or any metric that represents funds generated by the firm that are available to all\ncapital providers (ie, before any interest and/or dividends are paid).\nDescribe enterprise value multiples and their use in estimating equity value\nLOS", "qhtml": null}, {"n": 85, "q": "If a company issued a senior subordinated bond with a B2 rating, which of the following\nis most likely to be its issuer rating?", "opts": ["Ba3", "B2", "B3"], "ans": "A", "expl": "Rating agencies consider priority of claims , along with other criteria, when rating\nborrowers' bond issues . Ratings on senior unsecured bonds reflect the issuer's\ncreditworthiness, so they generally have the same rating as the bond issuer . Other issues\nare typically subordinated and their ratings are lower, reflecting their lower priority.\nRating agencies use notching to set issue ratings. The issuer rating is the starting point ,\nand the bond ratings are \"notched\" (ie, adjusted ) based on where each issue ranks in the\npriority of claims. Lower-rated issuers have a greater default risk, so agencies apply larger\nadjustments to reflect the higher risk in their subordinated issues.\nIn this question, the subordinated bond has a B2 rating. Due to priority of claim, the rating\nagency would have adjusted down from the rating of the senior unsecured debt to arrive at\nthis rating. Therefore, the issuer rating is most likely higher. Therefore, the issuer rating\nwould be Ba3.\n(Choice B) B2 is the same rating as the subordinated debt, but the issuer rating is most\nlikely higher in this case.\n(Choice C) B3 is lower than the current rating for the subordinated debt. The issuer rating is\ntypically rated higher, not lower, than subordinated debt.\nThings to remember:\nRating agencies use a process called notching to set issue ratings. This relies on using issuer\nratings as a starting point and adjusting based on priority of claims to rate bonds. The\nadjustment varies according to the issuer's creditworthiness, with larger adjustments typically\napplied to the subordinated debt of lower-quality issuers.\nDescribe the uses of ratings from credit rating agencies and their limitations.\nLOS", "qhtml": null}, {"n": 86, "q": "With regards to credit analysis, management's strategy and execution most likely affects:", "opts": ["capacity.", "collateral.", "character."], "ans": "A", "expl": "4 Cs of credit analysis\nCapacity Ability to make debt payments on time\nCollateral Value of assets supporting debt\nCovenants Terms and conditions in debt contracts\nCharacter Track record of management\nCapacity is a borrower's ability to service debt . Evaluating capacity requires a\ncomprehensive analysis of the stability and predictability of all revenues and\nexpenditures. Assessment of a company's capacity should include:\nindustry structure and fundamentals to determine the competitive environment and\nprospects for growth,\ncompany fundamentals to understand its competitive position and operating history,\nratio analysis to evaluate profitability, leverage, and debt service coverage, and\ncorporate liquidity to assess future flexibility for financing operations and funding\ninvestment.\nAssessing management's strategy and execution is a crucial aspect of analyzing a\ncompany's capacity to service its debt. Analysts must evaluate management's ability\nto design strategies appropriate for the operating environment and its capability\nto successfully execute those strategies to achieve targeted growth and profitability.\n(Choice B) Collateral refers to the value of a borrower's assets relative to the amount of its\ndebt.\n(Choice C) Character refers to management's openness and honesty with regards to\nfinancial reporting and public communications.\nThings to remember:\nIn traditional credit analysis, capacity is a borrower's ability to service debt. Management's\nability to design appropriate strategies and successfully execute them is a crucial aspect of\nevaluating capacity.\nDescribe the qualitative and quantitative factors used to evaluate a corporate borrower’s\ncreditworthiness.\nLOS", "qhtml": null}, {"n": 87, "q": "A bond indenture is least likely to include:", "opts": ["Covenants", "Credit ratings", "Contingency provisions"], "ans": "B", "expl": "Bond indentures\nObligations of issuers\nContracts\nRights of bondholders\nDue dates of interest and principal\nCash flows\nAmounts due or method of determination\nAffirmative: Actions the issuer must take\nCovenants\nNegative: Actions the issuer is prohibited from taking\nSeniority of bond issue\nCredit protections\nAssets pledged as collateral or credit enhancements\nBondholder options: Put or conversion provisions\nContingency provisions\nIssuer options: Call provisions\nIndentures (eg, bond indentures, trust deeds) are contracts that specify the terms and\nconditions regarding repayment of debt securities. A bond indenture identifies:\nthe rights of bondholders ,\nthe obligations of the issuer , and\na trustee to monitor and enforce the issuer's compliance with the contract.\nBond indentures also specify the amount and timing of the interest and principal repayments\nalong with the source(s) of funds to meet those obligations. Credit ratings reflect a rating\nagency's assessment of the bond issuer's ability to make the payments in accordance with the\nterms stated in the indenture. Appraising a bond's creditworthiness involves assessing any\nprotective provisions included in the indenture, but the credit rating itself is not an element\nof the indenture .\n(Choice A) Most indentures include covenants that protect bondholders by placing\nrestrictions (eg, limits on dividends) and/or requirements (eg, maintain minimum net worth)\non the issuer.\n(Choice C) Many indentures include contingency provisions granting the issuer and/or the\nbondholders options to take some action (eg, allowing the issuer to retire bonds prior to\nmaturity).\nThings to remember:\nBond indentures are contracts that specify the terms and conditions regarding repayment of\ndebt. An indenture identifies the rights of bondholders, the obligations of the bond issuer, and\na trustee to monitor and enforce the issuer's compliance with the contract. It may also\ninclude protective covenants or contingency provisions. Credit ratings are not an element of\nbond indentures.\nDescribe the contents of a bond indenture and contrast affirmative and negative covenants.\nLOS", "qhtml": null}, {"n": 88, "q": "All else being equal, for an issuer selling 10-year bonds, which of the following most\nlikely requires the highest yield at issuance? A bond that is:", "opts": ["putable.", "callable.", "convertible."], "ans": "B", "expl": "Bonds with contingency provisions combine the cash flows of a debt contract with an option\nreferred to as an embedded option. Three common examples are:\ncallable bonds, which issuers can retire prior to maturity,\nputable bonds, which holders can force issuers to repurchase prior to maturity, and\nconvertible bonds, which holders can exchange for issuers' common stock.\nOwning an option provides an advantage, so the effective price of such bonds reflects\nwhichever counterparty is implicitly \"paying\" for the embedded option. Since issuers must\npay for the right to retire bonds early , the issuer compensates investors by selling the\nbonds at a lower effective price and at a higher yield than equivalent noncallable (eg,\nputable, convertible) bonds .\n(Choices A and C) In putable and convertible bonds, investors own the option. Investors\nmust pay the issuer a higher effective price for those rights, which is reflected in a lower yield\ncompared with bonds not containing such options.\nThings to remember:\nThe effective price of a bond with an embedded option reflects the counterparty implicitly\n\"paying\" for the embedded option. For a callable bond, the issuer must pay bondholders for\nthe call option, which results in a lower effective bond price and a higher yield on callable\nbonds compared with similar noncallable putable or convertible bonds.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow\ncontingency provisions that benefit issuers and investors.\nLOS", "qhtml": null}, {"n": 89, "q": "Arbitrage most likely contributes to market efficiency by reducing:", "opts": ["price differences from relative fair value.", "the amount of speculative trading activity.", "risk so expected profits converge with the risk-free rate."], "ans": "A", "expl": "Types of arbitrage\nArbitrage\nNo-arbitrage price\ntrades\nBuy in one\nAsset prices No difference market and sell in\nanother\nAsset price Price difference equals Opposite\nversus costs/benefits of positions in asset\nderivative price holding asset and derivative\nArbitrage trading earns a profit by taking advantage of price differences between related\ninstruments (eg, futures and the underlying asset). Arbitrage trading shrinks those\ndifferences, causing prices to reflect relative fair value and ensuring that markets are\nreasonably efficient.\nThis riskless arbitrage profit is locked in by simultaneously entering offsetting (eg, long and\nshort) positions in equivalent portfolios. Examples include:\nbuying and selling the same asset trading in different markets at different prices, or\nbuying (short selling) an asset and shorting (buying) the synthetic equivalent in\nthe derivatives market.\nRelative fair value should not be confused with intrinsic value. Divergence between price and\nintrinsic value, driven by investor sentiment or differing estimates of future returns, does not\nindicate an arbitrage opportunity.\n(Choice B) Speculators are motivated by the perception of prices diverging from intrinsic\nvalue. As such, the amount of speculative trading is generally unaffected by arbitrage.\nFurthermore, market efficiency is generally enhanced by increased speculative activity, so\nreducing speculation reduces market efficiency.\n(Choice C) Assets priced at relative fair value are not risk-free investments. Trading at fair\nvalue means an asset's expected return is fair compensation for the risk assumed. For most\nassets, this is not the risk-free rate.\nThings to remember:\nArbitrage contributes to market efficiency by forcing asset prices to converge on their relative\nfair value. Efficient markets are those in which assets' expected returns represent fair\ncompensation for the risk of holding them.\nCompare the use of derivatives among issuers and investors\nLOS", "qhtml": null}, {"n": 90, "q": "A private equity fund operates with a hard hurdle of 6% and a 20% performance fee. The\nfirm draws down its €200 million initial investment to purchase a portfolio company. Three\nyears later, the portfolio company is sold for €280 million. If the firm operated with a soft\nhurdle instead of a hard hurdle, the additional performance fees (in € millions) that the GP\nwould earn is closest to:", "opts": ["2.4", "7.6", "12.8"], "ans": "B", "expl": "Alternative asset funds can use many structures to calculate fees. One option is for funds to\nset a hurdle rate , which is a minimum rate of return that fund managers must achieve for\ninvestors before they start earning performance fees .\nHard hurdle rates allow fund managers to earn performance fees on only returns\nthat are greater than the hurdle rate .\nSoft hurdle rates allow fund managers to earn performance fees on entire returns .\nThey also allow fund managers to catch up their fees after the limited partners (LPs)\nhave been paid.\nIn this question, the fund achieved an €80 million (= €280 million − €200 million), or 40%\n1.063\ngain. This exceeds the hurdle rate of 19.1% (= − 1), so the general partner (GP) is\nentitled to a performance fee. To find the difference between performance fees under hard\nand soft hurdle rates, both must be calculated:\nAlternatively, the performance fee under the soft hurdle can be calculated as 80.0 × 0.2 (=\n16.0). The difference between the soft hurdle and hard hurdle is 7.6 million (= 16.0 − 8.4)\n(Choice A) 2.4 incorrectly sets the hurdle rate at 6%, not accounting for three years of\nreturns.\n(Choice C) 12.8 incorrectly calculates the catch-up fee earned under the soft hurdle rate as\nthe performance fee on the whole gain.\nThings to remember:\nA hurdle rate is a minimum rate of return that fund managers much achieve for investors\nbefore they start earning performance fees. Hard hurdle rates allow fund managers to earn\nperformance fees on only returns greater than the hurdle rate. Soft hurdle rates allow fund\nmanagers to earn performance fees on entire returns.\nCalculate and interpret alternative investment returns both before and after fees\nLOS", "qhtml": null}];
const CFG = {"title": "UWorld Mock Exam 2 — Session 2", "subtitle": "UWorld · CFA Level I · 90 câu · 2h15p", "minutes": 135, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const day = new Date().toISOString().slice(0,10);
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    document.querySelectorAll('.opt.correct').forEach(function(o){ addMark(o,'✅'); });
    document.querySelectorAll('.opt.wrong').forEach(function(o){ addMark(o,'❌'); });
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#6d5efc','#9d8bff','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>
</body>
