hiện bất kỳ lệnh nào trừ khi có thể thực hiện toàn bộ lệnh\n.\n(Lựa chọn A và B) Lệnh dừng mua, tất cả hoặc không có gì chứa cả hướng dẫn thực thi và hợp lệ\n.\nNhững điều cần nhớ:\nLệnh giao dịch chứng khoán có thể có cả hướng dẫn thực hiện và hiệu lực. Các hướng dẫn thực thi\nliên quan đến giá mua hoặc bán và số lượng của lệnh. Hiệu lực\nhướng dẫn liên quan đến thời điểm giao dịch có thể xảy ra. Lệnh dừng, chỉ có thể được thực thi\nsau khi giao dịch diễn ra ở một mức giá xác định, là một loại lệnh hợp lệ.\nSo sánh các hướng dẫn thực hiện, tính hợp lệ và thanh toán bù trừ\nLOS","qhtml":null},{"n":61,"q":"Which of the following is most likely a feature of preference shares?","opts":["Call features allow issuers the right to buy back shares from investors.","Convertible shares allow shareholders to convert shares into subordinated debt.","Participating shares provide shareholders the same voting rights as common shares."],"ans":"A","expl":"Các loại cổ phiếu ưu đãi (cổ phiếu ưu đãi)\nTích lũy cổ tức chưa được thanh toán trong quá khứ\nKhông tích lũy Không tích lũy cổ tức chưa được khai báo và chưa được thanh toán trong các kỳ trước\nCho phép thanh toán cổ tức bổ sung nếu lợi nhuận của công ty vượt quá một mức\nTham gia\nngưỡng\nKhông tham gia Cổ tức cố định; không thanh toán bổ sung dựa trên hiệu quả hoạt động của công ty\nCó thể chuyển đổi Có thể chuyển đổi thành một số lượng cổ phiếu phổ thông nhất định\nCó thể gọi được Cho phép nhà phát hành mua lại cổ phiếu từ các nhà đầu tư với một mức giá xác định\nPutable Cho phép nhà đầu tư bán lại cổ phiếu cho nhà phát hành với một mức giá xác định\nCổ phiếu ưu đãi (tức là cổ phiếu ưu đãi) là một loại chứng khoán vốn cổ phần. So với cổ phiếu phổ thông,\ncổ phiếu ưu đãi thường có cổ tức lớn hơn (nhưng cố định), cũng như có mức độ ưu tiên cao hơn\ncác khoản thanh toán cổ tức và các yêu cầu còn lại đối với tài sản của công ty.\nCó một số loại cổ phiếu ưu đãi (được hiển thị trong bảng trên). Nếu cổ phiếu ưu đãi\ncó thể mua lại được , thì chúng có tùy chọn mua kèm theo cho phép công ty phát hành (tức là nhà phát hành)\nquyền mua lại cổ phiếu từ các nhà đầu tư với giá mua lại được xác định trước.\n(Lựa chọn B) Cổ phiếu chuyển đổi cho phép các cổ đông chuyển đổi cổ phiếu của họ thành cổ phiếu phổ thông,\nkhông phải nợ cấp dưới.\n(Lựa chọn C) Tham gia cổ phiếu mang lại cho các cổ đông cơ hội kiếm thêm\ncổ tức nếu lợi nhuận của công ty vượt quá ngưỡng xác định trước. Họ không\ncung cấp quyền biểu quyết.\nNhững điều cần nhớ:\nCổ phiếu ưu đãi (tức là được ưu tiên) là một loại chứng khoán vốn cổ phần. Cổ phiếu có thể gọi được có\ntùy chọn mua được nhúng cho phép công ty phát hành có quyền mua lại cổ phiếu từ\ncác nhà đầu tư với mức giá mua lại được xác định trước.\nMô tả sự khác biệt về quyền biểu quyết và các đặc điểm sở hữu khác giữa các loại vốn chủ sở hữu khác nhau\ncác loại\nLOS","qhtml":null},{"n":62,"q":"An investor holds a company's stock, believing its price will increase based on forecasts\nproduced by a proprietary model. Following the latest earnings release, the investor updates\nthe model and believes that the stock is overvalued and the price will decrease. However, the\nstock rises following earnings. Seeing this, the investor decides to hold the stock. The\ninvestor's behavior is best described as:","opts":["herding.","loss aversion.","conservatism."],"ans":"A","expl":"Những thành kiến tài chính hành vi phổ biến\nTác động tâm lý của được và mất là không đối xứng\nLiên quan đến phản ứng thái quá của thị trường\nÁc cảm mất mát\nLo sợ thua lỗ tiếp tục buộc nhà đầu tư phải bán\nNhà đầu tư tạo ra những “thùng” tâm lý riêng biệt\nKế toán tinh thần\nCác nhà đầu tư suy nghĩ và hành động khác nhau trong những nhóm này\nCác nhà đầu tư đánh giá quá cao nghiên cứu, phân tích và\nkhả năng lựa chọn cổ phiếu\nquá tự tin\nPhổ biến với cổ phiếu tăng trưởng cao\nCác quyết định mua bán chủ yếu dựa vào\ntheo đám đông\nChăn nuôi\nHành vi phân cụm, không nhất thiết phải dựa trên thông tin\nTài chính hành vi cố gắng giải thích việc ra quyết định đầu tư bằng cách nghiên cứu hành vi của nhà đầu tư\nhành vi. Một phần, nó liên quan đến việc hiểu rõ những thành kiến khác nhau khiến nhà đầu tư hành động\nmột cách phi lý, có thể dẫn đến sự bất thường về giá cả. Xu hướng bầy đàn cho thấy\nrằng các nhà đầu tư có thể bỏ qua phân tích của chính họ một cách phi lý và thay vào đó giao dịch trên cùng một\nphía thị trường và/hoặc chứng khoán như các nhà đầu tư khác . Điều này có thể dẫn đến phản ứng thái quá\nhoặc phản ứng kém trên thị trường.\nTrong kịch bản này, nhà đầu tư thể hiện khuynh hướng bầy đàn. Dựa trên nghiên cứu, nhà đầu tư bắt đầu\ntin rằng một cổ phiếu đầu tư được định giá quá cao và giá của nó sẽ giảm, và do đó có ý định\nbán cổ phiếu. Tuy nhiên, thay vào đó, nhà đầu tư quyết định giữ cổ phiếu sau khi thấy rằng\nnhà đầu tư đang mua hoặc nắm giữ nó.\n(Lựa chọn B) Ác cảm thua lỗ đề cập đến xu hướng của nhà đầu tư không thích thua lỗ nhiều hơn mức họ muốn\nlợi ích có độ lớn như nhau. Vì nhà đầu tư này tin rằng cổ phiếu được định giá quá cao nên ác cảm thua lỗ\nrất có thể sẽ khiến nhà đầu tư bán cổ phiếu.\n(Lựa chọn C) Chủ nghĩa bảo thủ đề cập đến xu hướng của các nhà đầu tư trì hoãn việc cập nhật quan điểm và\ndự báo dựa trên thông tin mới và thay vào đó duy trì quan điểm và dự báo trước đó. Cái này\nnhà đầu tư đã cập nhật mô hình độc quyền với thông tin mới, một hành động không thể hiện\nchủ nghĩa bảo thủ.\nNhững điều cần nhớ:\nTài chính hành vi nghiên cứu cách các nhà đầu tư hành xử để hiểu rõ hơn về việc ra quyết định của họ,\nbao gồm cả những thành kiến khiến họ hành động phi lý. Xu hướng bầy đàn cho thấy rằng các nhà đầu tư\ncó thể bỏ qua phân tích của chính họ một cách phi lý và thay vào đó giao dịch trên cùng một phía của thị trường\nvà/hoặc chứng khoán như các nhà đầu tư khác.\nMô tả tài chính hành vi và mối liên quan tiềm tàng của nó với việc hiểu những bất thường của thị trường\nLOS","qhtml":null},{"n":63,"q":"Which of the following is most likely a limitation of grouping companies based on their\nsensitivity to the business cycle?","opts":["Some countries will be in recession while others are expanding","Certain companies grow revenue during all phases of the business cycle","Classifications run along a continuum although business cycle sensitivity is discrete"],"ans":"A","expl":"Hạn chế của việc áp dụng phân tích độ nhạy chu kỳ kinh doanh cho các ngành toàn cầu\nHiệu quả kinh tế có thể khác nhau đáng kể giữa các quốc gia và khu vực\nCác sơ đồ phân loại ngành là những mô tả tương đối theo một chuỗi liên tục\nCác nhà đầu tư đôi khi phân nhóm các công ty dựa trên mức độ nhạy cảm tương đối của doanh thu và\nlợi nhuận cho chu kỳ kinh doanh. Tuy nhiên, các nhóm như vậy có những hạn chế, đặc biệt đối với\ncác công ty có hoạt động ở nhiều quốc gia hoặc khu vực. Hai trong số\nNhững hạn chế chính của việc phân loại độ nhạy cảm với chu kỳ kinh doanh là:\nCác giai đoạn của chu kỳ kinh doanh xảy ra ở những thời điểm khác nhau ở các quốc gia khác nhau.\nDo đó, một công ty đa quốc gia có thể phải đối mặt đồng thời với các giai đoạn khác nhau.\n(ví dụ: tăng trưởng kinh tế ở một quốc gia, suy thoái ở một quốc gia khác). Vì lý do đó, việc tạo\nmột tiêu chuẩn ngành về tài chính công ty kết hợp để đo lường chu kỳ kinh doanh\nsự nhạy cảm sẽ gây hiểu lầm.\nCác nhãn phân loại là rời rạc (theo chu kỳ hoặc không theo chu kỳ), nhưng không phải tất cả các công ty đều\ncó cùng mức độ biến động về doanh thu và lợi nhuận theo chu kỳ kinh doanh\nnhững thay đổi. Thay vào đó, sự nhạy cảm diễn ra liên tục. Ví dụ, một số chu kỳ\ncác ngành có thể phải đối mặt với sự thay đổi về doanh thu và lợi nhuận lớn hơn các ngành khác có cùng\nnhãn (Lựa chọn C) .\n(Lựa chọn B) Mặc dù một số công ty nhất định tăng doanh thu trong tất cả các giai đoạn của chu kỳ kinh doanh,\nđây không phải là hạn chế của các nhóm vì nó không ảnh hưởng đến độ nhạy cảm của công ty\ndoanh thu và lợi nhuận theo chu kỳ. Ví dụ, cả các công ty có tính chu kỳ và không có tính chu kỳ đều có thể\nđược coi là công ty tăng trưởng.\nNhững điều cần nhớ:\nCác nhà đầu tư đôi khi phân nhóm các công ty dựa trên mức độ nhạy cảm của doanh thu và lợi nhuận của họ đối với\nchu kỳ kinh doanh. Một yếu tố hạn chế các nhóm như vậy là sự tiếp xúc của các công ty đa quốc gia\ncông ty vào các giai đoạn khác nhau của chu kỳ kinh doanh xảy ra đồng thời ở các quốc gia\nnơi họ hoạt động (ví dụ: mở rộng kinh tế ở một quốc gia, suy thoái ở một quốc gia khác).\nPhân tích cấu trúc của một ngành và những ảnh hưởng bên ngoài bằng cách sử dụng Năm lực lượng và PESTLE của Porter\nkhuôn khổ\nLOS","qhtml":null},{"n":64,"q":"Which of the following statements best describes the underlying basis of price discovery in the\nfutures market?","opts":["The futures price is a forecasted value of the underlying.","The ability to hedge positions allows for the most efficient prices.","Lower capital requirements allow for information to flow into the market faster."],"ans":"C","expl":"Mục đích và lợi ích của thị trường phái sinh\nChuyển giao rủi ro Cải thiện việc phân bổ và quản lý rủi ro\nThông tin\nTiết lộ giá để tránh sự không chắc chắn\nkhám phá\nThị trường Cần ít vốn hơn, chi phí giao dịch cao hơn\nhiệu quả thấp hơn và việc bán (tức là bán khống) dễ dàng hơn\nThị trường phái sinh (ví dụ: hợp đồng tương lai, kỳ hạn) thường dựa trên kiến thức chưa có\nđã được thị trường giao ngay hấp thụ. Điều này là do tính hiệu quả vốn có của việc phái sinh\nthị trường đòi hỏi ít vốn hơn, có chi phí giao dịch thấp hơn và cung cấp dịch vụ dễ dàng hơn.\ncơ hội để bán (tức là bán khống). Do những yếu tố đó:\nvốn (tức là thông tin) thường chảy nhanh hơn vào các thị trường này,\ngiá cả điều chỉnh nhanh chóng và\nviệc phát hiện giá này sẽ thông báo cho thị trường giao ngay.\nCác công cụ phái sinh cũng tiết lộ mức giá mà tại đó có thể tránh được kết quả tiêu cực (tức là rủi ro).\nViệc khám phá thông tin này có giá trị đối với các nhà đầu tư, cho phép đưa ra các quyết định chuyển giao rủi ro tốt hơn.\n(Lựa chọn A) Giá tương lai không phải là một dự báo rõ ràng về giá trị tương lai của tài sản cơ sở\ntài sản. Giá tương lai là một hàm số của giá đã biết của tài sản đó, lãi suất phi rủi ro và\ncác chi phí lưu trữ khác, trừ đi bất kỳ lợi ích hoặc thu nhập nào nhận được khi nắm giữ tài sản cơ sở. cho\nVí dụ, giá vàng tương lai phản ánh chi phí và lợi ích cơ bản của việc nắm giữ vàng nhưng\nkhông nhất thiết phải dự báo giá vàng sẽ như thế nào vào một thời điểm nào đó trong tương lai.\n(Lựa chọn B) Khả năng phòng ngừa rủi ro cho phép các nhà đầu tư chuyển rủi ro ở một mức giá đã biết.\nTuy nhiên, khả năng này không liên quan trực tiếp đến việc khám phá giá.\nNhững điều cần nhớ:\nThị trường phái sinh cung cấp khả năng khám phá giá và hiệu quả vốn có bằng cách cung cấp vốn thấp hơn\nyêu cầu, chi phí giao dịch thấp hơn và cơ hội bán hàng dễ dàng hơn. Những yếu tố này cho phép\nthông tin và vốn chảy vào thị trường phái sinh nhanh hơn thị trường giao ngay.\nMô tả lợi ích và rủi ro của các công cụ phái sinh\nLOS","qhtml":null},{"n":65,"q":"An investor purchases a call option on a stock with a strike price of 120 for a premium of 6\nwhen the stock is trading at 118. If the stock is trading at 124 at the option's exercise, the\ninvestor's profit is closest to:","opts":["−2","0","4"],"ans":"A","expl":"Quyền chọn mua là các quyền sở hữu ngẫu nhiên mang lại cho chủ sở hữu (tức là người mua hoặc bên mua) quyền, nhưng\nkhông phải nghĩa vụ, mua một tài sản cơ bản với mức giá cố định vào một ngày trong tương lai. Lợi nhuận hoặc lỗ\ntrong lệnh mua dài hạn là khoản hoàn trả của quyền chọn trừ đi phí bảo hiểm mà người mua phải trả.\nGiá trị hoàn trả hoặc thực hiện được xác định bởi giá thị trường của tài sản cơ bản so với\ngiá thực hiện khi thực hiện. Nếu giá của nội dung:\nlớn hơn giá thực hiện thì quyền chọn mua sẽ có lãi và quyền chọn mua sẽ được thực hiện\n. Phần thưởng của chủ sở hữu là chênh lệch giữa giá cơ bản và\ngiá thực hiện.\nở mức giá thực hiện hoặc thấp hơn giá thực hiện, quyền chọn ở mức bằng hoặc hết tiền và quyền chọn mua sẽ không được thực hiện\n. Do đó, mức hoàn trả của chủ sở hữu là 0.\nVì tài sản cơ bản đang giao dịch ở mức 124 (tức là lớn hơn giá thực hiện là 120), quyền chọn mua\nlà tiền và mức hoàn trả là 4 (giá thị trường 124 - giá thực hiện 120). Lợi nhuận của chủ sở hữu\nlà −2 (4 khoản hoàn trả − 6 phí bảo hiểm).\n(Lựa chọn B) 0 là mức tăng giá của tài sản cơ bản trừ đi phí bảo hiểm quyền chọn: (124\n− 118) − 6.\n(Lựa chọn C) 4 là tiền lãi của quyền chọn. Để tính lãi (lỗ), phí quyền chọn phải được\ntrừ vào tiền lãi.\nNhững điều cần nhớ:\nLãi hoặc lỗ trên một quyền chọn mua là số tiền hoàn trả của quyền chọn trừ đi phí bảo hiểm. Nếu cuộc gọi có giá trị hoặc bằng\nsố tiền, quyền chọn sẽ không được thực hiện; do đó, khoản lỗ của người nắm giữ bằng với phí bảo hiểm.\nNếu quyền chọn được trả bằng tiền thì quyền chọn đó sẽ được thực hiện; do đó, lãi hoặc lỗ của chủ sở hữu\nbằng số tiền hoàn trả trừ đi phí bảo hiểm.\nXác định giá trị khi hết hạn và thu lợi nhuận từ vị thế mua hoặc bán trong quyền chọn mua hoặc bán\nLOS","qhtml":null},{"n":66,"q":"An analyst has compiled the following data points from a forward curve:\nPeriod Forward Rate (%)\n0y1y 0.90\n1y1y 1.35\n2y1y 2.89\n3y1y 3.42\nBased on these rates, the price of a 3-year bond with 2.5% annual coupon is closest to:","opts":["102.34","104.01","104.57"],"ans":"A","expl":"Giá trị hiện tại của trái phiếu bằng tổng dòng tiền chiết khấu của trái phiếu . Việc tính toán chiết khấu\nthường dựa vào tỷ giá giao ngay. Tuy nhiên, giá trị của trái phiếu cũng có thể được\ntính toán bằng cách sử dụng đường cong kỳ hạn , trong đó mỗi dòng tiền được chiết khấu bằng cách sử dụng\nkết hợp các tỷ giá kỳ hạn tương đương với tỷ giá giao ngay thích hợp.\nTỷ giá kỳ hạn và tỷ giá giao ngay có liên quan với nhau và mỗi tỷ giá có thể bắt nguồn từ nhau (như được hiển thị trong\nhình ảnh ở trên). Tuy nhiên, không cần phải giải tỷ giá giao ngay để tính giá trị trái phiếu.\nThay vào đó, tỷ giá kỳ hạn có thể được áp dụng trực tiếp để giải tỷ lệ chiết khấu ở mỗi dòng tiền\nvà sau đó là giá trị hiện tại.\nTrong trường hợp này, vì mỗi phiếu giảm giá là 2,50 (100 × 0,025):\n(Lựa chọn B) 104,01 là giá trái phiếu nếu 1y1y (không phải 0y1y) được sử dụng làm điểm bắt đầu của\ntính toán chiết khấu.\n(Lựa chọn C) 104,57 là giá trái phiếu nếu mỗi tỷ giá kỳ hạn được áp dụng riêng cho từng dòng tiền\n, như thể chúng là tỷ giá giao ngay.\nNhững điều cần nhớ:\nGiá trị hiện tại của trái phiếu bằng tổng dòng tiền chiết khấu của trái phiếu. Mỗi\ndòng tiền có thể được chiết khấu bằng cách sử dụng kết hợp các tỷ giá kỳ hạn tương đương với\ntỷ giá giao ngay thích hợp.\nXác định tỷ giá ngang bằng và tỷ giá kỳ hạn, đồng thời tính lãi suất ngang bằng, tỷ giá kỳ hạn từ tỷ giá giao ngay, tỷ giá giao ngay\ntừ tỷ giá kỳ hạn và giá của trái phiếu sử dụng tỷ giá kỳ hạn.\nLOS","qhtml":null},{"n":67,"q":"A hedge fund's fees are calculated independently, and the fund does not collect an incentive\nfee on assets that have already been subject to that fee. Which of the following best\ndescribes this fee structure?","opts":["Management and incentive fees are on a net basis, subject to a hurdle rate","Management fees are on a gross basis and incentive fees are on a net basis","Management and incentive fees are on a gross basis, subject to a high-water mark"],"ans":"C","expl":"Cấu trúc phí quỹ phòng hộ điển hình\nCơ sở tính phí Chi tiết cụ thể\nThường là 1%−3% AUM hàng năm\nTài sản trong\nKhông phụ thuộc vào lợi nhuận của quỹ\nQuản lý\nquản lý (AUM)\nLuôn được tính trước phí khuyến khích\nCó thể là phí quản lý ròng hoặc tổng phí quản lý\nCó thể phải chịu tỷ lệ vượt rào và/hoặc\nHiệu suất hoặc khuyến khích Lợi nhuận hàng năm\nmức cao\nCác quỹ phòng hộ thường thu cả phí quản lý và phí khuyến khích. Nếu phí được tính\nđộc lập , thì các phép tính sẽ được tính trên cơ sở tổng . Phí khuyến khích thường phụ thuộc vào:\nlợi nhuận lớn hơn tỷ lệ vượt ngưỡng, là hiệu suất tối thiểu mà quỹ\nphải đạt được trước khi nhận được phí hiệu suất và/hoặc\nTài sản được quản lý (AUM) cao hơn mức cao nhất (HWM), là\ngiá trị tài sản cơ sở dùng để tính phí khuyến khích. HWM đại diện cho\ngiá trị AUM cao nhất trước đây của quỹ mà tại đó phí khuyến khích đã được thanh toán .\nTrong trường hợp này, phí khuyến khích và quản lý của cơ cấu phí dựa trên cơ sở gộp (tức là\nđộc lập), chịu mức cao do quỹ không thu phí khuyến khích\nđối với các tài sản đã phải chịu khoản phí đó (Lựa chọn A và B) .\nNhững điều cần nhớ:\nCác quỹ phòng hộ thường thu cả phí quản lý và phí khuyến khích. Nếu các khoản phí được tính\nmột cách độc lập thì các phép tính sẽ được tính trên cơ sở tổng. Dấu nước cao thể hiện\ngiá trị đỉnh cao trước đó của tài sản được quản lý (AUM) mà tại đó phí khuyến khích đã được\ntrả.\nTính toán và giải thích lợi nhuận đầu tư thay thế cả trước và sau phí\nLOS","qhtml":null},{"n":68,"q":"An analyst expects a company to pay its first dividend of SGD 5 per share in 4 years and\nexpects this dividend to grow at a rate of 4% thereafter. The required rate of return is 9%\nand the expected market return is 10%. If the stock is currently trading at SGD 73.68, then\nbased on the dividend discount model, the analyst should most appropriately classify the stock\nas:","opts":["undervalued.","fairly valued.","overvalued."],"ans":"A","expl":"Mô hình tăng trưởng Gordon (GGM) là mô hình chiết khấu cổ tức ước tính\ngiá trị nội tại của một cổ phiếu là giá trị hiện tại của dòng tiền trong tương lai, một dòng cổ tức tăng trưởng với tốc độ\nkhông đổi. Để tính giá trị hiện tại của khoảng thời gian vĩnh viễn này, hãy chiết khấu\ncổ tức tiếp theo theo tỷ suất lợi nhuận yêu cầu ( r ) được điều chỉnh theo mức tăng trưởng cổ tức không đổi\ntỷ lệ ( g ).\nTrong kịch bản này, nhà phân tích kỳ vọng cổ phiếu sẽ bắt đầu trả cổ tức 5 SGD trên mỗi cổ phiếu\nvào Năm thứ 4. Do đó, sử dụng GGM, giá trị nội tại của cổ phiếu vào cuối năm của Năm 4 được\ntính bằng giá trị hiện tại của cổ tức trong Năm 5. Cổ tức trong Năm 4 được cộng\nriêng biệt như một phần của dòng tiền trong tương lai của công ty nhưng không được tính vào giá trị tăng trưởng không đổi\n.\nDựa trên GGM, giá trị nội tại của cổ phiếu là 77,22 SGD . Vì giá thị trường của SGD\n73,68 thấp hơn giá trị nội tại , nên cổ phiếu bị định giá thấp .\n(Lựa chọn B) Kết luận rằng cổ phiếu được định giá khá cao là kết quả của việc bỏ qua cổ tức Năm 4\nđể đạt đến giá trị nội tại là 73,68 SGD, bằng với giá thị trường.\n(Lựa chọn C) Kết luận rằng cổ phiếu được định giá quá cao là kết quả của việc sử dụng lợi nhuận kỳ vọng của thị trường\n(10%) thay vì tỷ suất lợi nhuận yêu cầu (9%) để đạt được giá trị nội tại là SGD\n62,68.\nNhững điều cần nhớ:\nMô hình tăng trưởng Gordon ước tính giá trị nội tại của cổ phiếu là giá trị hiện tại của dòng tiền trong tương lai\n, một dòng tiền cổ tức tăng trưởng với tốc độ không đổi. Để tính giá trị hiện tại\ncủa khoảng thời gian vĩnh viễn này, hãy chiết khấu cổ tức tiếp theo theo tỷ lệ lợi nhuận yêu cầu được điều chỉnh cho\ntốc độ tăng trưởng cổ tức không đổi.\nTính toán và giải thích giá trị nội tại của chứng khoán vốn dựa trên mô hình chiết khấu cổ tức tăng trưởng Gordon (không đổi)\n hoặc mô hình chiết khấu cổ tức hai giai đoạn, nếu phù hợp\nLOS","qhtml":null},{"n":69,"q":"An equity call option is most likely in the money when the stock price is greater than the:","opts":["strike price.","strike price plus the premium.","present value of the strike price."],"ans":"A","expl":"Tính tiền\nĐiều kiện cuộc gọi Đặt\nBằng tiền Giá giao ngay > Giá thực hiện Hết tiền\nGiá giao ngay = Giá thực hiện Đang có tiền\nHết tiền Giá giao ngay < Giá thực hiện Đang có tiền\nQuyền chọn là các yêu cầu ngẫu nhiên cung cấp cho chủ sở hữu (tức là người mua hoặc bên mua) quyền giao dịch một\ntài sản cơ bản ở một mức giá cố định (tức là giá thực hiện hoặc giá thực hiện) vào một ngày trong tương lai. Trong\ntiền có nghĩa là một quyền chọn có giá trị nếu được thực hiện: quyền chọn này cho phép chủ sở hữu giao dịch\ncơ bản ở mức giá tốt hơn giá thị trường hiện tại của nó.\nCác quyền chọn sẽ có giá trị khi giá thị trường của tài sản > giá thực hiện của quyền chọn.\nCác quyền chọn bán sẽ có lãi khi giá thị trường của tài sản đó là < giá thực hiện của quyền chọn.\nNếu quyền chọn mua cổ phiếu có lãi , chủ sở hữu quyền chọn có thể mua cổ phiếu cơ bản thông qua\nthực hiện quyền chọn ở mức giá thấp hơn chi phí mua cổ phiếu trên thị trường mở\n .\n(Lựa chọn B) Giá cổ phiếu cơ bản cần phải cao hơn giá thực hiện quyền chọn mua cộng với phí bảo hiểm\n(tức là điểm hòa vốn) đối với người mua quyền chọn mua để kiếm được lợi nhuận. Tuy nhiên, mức độ thanh toán được xác định\nbởi mối quan hệ giữa giá của tài sản cơ bản với giá thực hiện, bất kể\nphí bảo hiểm đã trả.\n(Lựa chọn C) Giá trị hiện tại của giá thực hiện được sử dụng trong định giá quyền chọn (ví dụ: quyền chọn bán\nchẵn lẻ) nhưng không phải là yếu tố xác định mức độ kiếm tiền của một quyền chọn.\nNhững điều cần làm hãy nhớ:\nQuyền chọn mua cung cấp cho chủ sở hữu quyền mua một tài sản cơ bản với mức giá được chỉ định vào một ngày\ntrong tương lai. Đang có tiền có nghĩa là một quyền chọn có giá trị nếu được thực hiện. Cuộc gọi có lợi khi\ngiá của tài sản cơ bản lớn hơn giá thực hiện của quyền chọn.\nGiải thích giá trị thực hiện, số tiền và giá trị thời gian của một quyền chọn\nLOS","qhtml":null},{"n":70,"q":"An analyst has gathered the following forward rates:\nPeriod Forward Rate\n0y,1y 2.23%\n1y,1y 2.49%\n2y,1y 2.61%\nIf the rates are based on a periodicity of one, the implied two-year spot rate is closest to:","opts":["2.36%","2.44%","2.75%"],"ans":"A","expl":"Tỷ giá giao ngay là YTM trên trái phiếu không trả lãi định kỳ. Tỷ giá kỳ hạn là lãi suất kỳ hạn trong tương lai\nphản ánh sự khác biệt giữa tỷ giá giao ngay của các kỳ hạn khác nhau. Định giá không có chênh lệch giá\nđảm bảo rằng hai chiến lược đầu tư có rủi ro tương đương với cùng thời gian\nhorizon kiếm được lợi nhuận như nhau . Do đó, tỷ giá giao ngay cho một kỳ hạn nhất định phải nhất quán\nvới một loạt tỷ giá kỳ hạn trong cùng một khoảng thời gian và có thể sử dụng chuỗi tỷ giá kỳ hạn đó\nđể tìm tỷ giá giao ngay ngụ ý cho kỳ hạn đó.\nĐối với kịch bản này, hai chiến lược đầu tư phản ánh chuỗi tỷ giá kỳ hạn là:\nMua trái phiếu không trả lãi định kỳ hai năm và giữ đến ngày đáo hạn\nMua trái phiếu không trả lãi định kỳ một năm và giữ đến khi đáo hạn, sau đó tái đầu tư số tiền thu được vào\nmột trái phiếu không trả lãi định kỳ một năm khác\nHai chiến lược này được minh họa theo dòng thời gian:\nTỷ giá giao ngay hai năm ngụ ý có thể được tính bằng phương trình đã cho:\nLưu ý ký hiệu tỷ giá kỳ hạn được sử dụng: Chữ số thứ hai biểu thị thuật ngữ của tốc độ chuyển tiếp\n và chữ số đầu tiên biểu thị điểm bắt đầu của nó . Ví dụ: \"2y,1y\" phải được đọc dưới dạng a\nlãi suất một năm bắt đầu từ 2 năm kể từ hôm nay.\n(Lựa chọn B) 2,44% là trung bình số học của ba tỷ giá kỳ hạn.\n(Lựa chọn C) 2,75% là kết quả của việc áp dụng sai công thức tính tỷ giá kỳ hạn\n[(1+1y,1y)2 ... của tỷ giá kỳ hạn trong cùng một khoảng thời gian và chuỗi tỷ giá kỳ hạn\ncó thể được sử dụng để tìm tỷ giá giao ngay ngụ ý.\nXác định tỷ giá kỳ hạn và mệnh giá, đồng thời tính tỷ giá ngang bằng, tỷ giá kỳ hạn từ tỷ giá giao ngay, tỷ giá giao ngay\ntừ tỷ giá kỳ hạn và giá của trái phiếu sử dụng tỷ giá kỳ hạn.\nLOS","qhtml":null},{"n":71,"q":"Which of the following most likely combines an estimate based on a present value model with\na fundamental variable?","opts":["Justified forward price-to-earnings ratio","Trailing 12-month price-to-earnings ratio","Cross-sectional comparison of price-to-earnings ratios"],"ans":"A","expl":"Tỷ lệ giá trên thu nhập (P/E)\nP/E dự phóng P/E dự phóng P/E dự phóng hợp lý\nĐược chứng minh bằng dòng chảy tương lai\nTử số Giá hiện tại\n(dòng tiền tự do, cổ tức)\nMẫu số Thu nhập trong quá khứ Thu nhập trong tương lai Thu nhập trong tương lai\nNói chung, bội số giá là tỷ lệ thể hiện mối quan hệ giữa giá cổ phiếu\nvà một biến cơ bản (ví dụ: thu nhập). Hình thức định giá tương đối này có thể giúp các nhà đầu tư\nđánh giá liệu cổ phiếu có được định giá hợp lý so với các cổ phiếu tương tự hay không. Giá trên thu nhập\nTỷ lệ (P/E) là bội số giá chung liên quan đến giá cổ phiếu với thu nhập trên mỗi cổ phiếu (EPS).\nKhi bội số giá hợp lý (ví dụ: tỷ lệ P/E kỳ hạn hợp lý), giá trong\ntử số thường dựa trên phép tính giá trị hiện tại (ví dụ: tiền mặt miễn phí được chiết khấu\ndòng chảy, cổ tức chiết khấu) và mẫu số được dựa trên ước tính ngắn hạn của\nbiến cơ bản (ví dụ: EPS dự báo của năm tới). Trong kịch bản này, một chuyển tiếp hợp lý\nTỷ lệ P/E kết hợp mô hình giá trị hiện tại với một biến cơ bản.\n(Lựa chọn B) Tỷ lệ P/E kéo dài 12 tháng (Giá cổ phiếu hiện tại / Thu nhập của 12 tháng trước đó\ntháng) sử dụng giá cổ phiếu hiện tại (không phải giá hợp lý) làm tử số.\n(Lựa chọn C) Phương pháp so sánh chéo liên quan đến việc so sánh một số mức giá\nnhiều giá trị (ví dụ: tỷ lệ P/E của một số công ty). Phương pháp này dựa vào định luật một\ngiá, không dựa trên giá trị hợp lý. Luật một giá quy định rằng cổ phiếu của các công ty tương tự\nnên được định giá tương tự bằng cách sử dụng giá thị trường hiện tại và liên quan đến giá trị hiện tại tương ứng của chúng.\ncơ bản.\nNhững điều cần nhớ:\nKhi bội số giá hợp lý (ví dụ: tỷ lệ giá trên thu nhập kỳ hạn hợp lý), giá cổ phiếu\n(tử số) thường dựa trên phép tính giá trị hiện tại (ví dụ: mô hình dòng tiền chiết khấu)\nvà biến cơ bản (mẫu số) dựa trên ước tính ngắn hạn (ví dụ: năm tới\nthu nhập dự kiến trên mỗi cổ phiếu).\nGiải thích cơ sở lý luận của việc sử dụng bội số giá để định giá vốn chủ sở hữu, cách bội số giá trên thu nhập\nliên quan đến các nguyên tắc cơ bản và việc sử dụng bội số dựa trên các so sánh\nLOS","qhtml":null},{"n":72,"q":"Level I sponsored ADRs are most likely :","opts":["to trade over-the-counter (OTC).","used to raise new US equity capital.","subject to the most stringent SEC filing requirements."],"ans":"A","expl":"Tổng quan về biên lai lưu ký Hoa Kỳ (ADR)\nQuy tắc 144A Cấp I Cấp II Cấp III\nCó, nhưng chỉ\nTăng vốn mới của Hoa Kỳ Không Không Có, chào bán ra công chúng\nVua riêng lẻ QIB\nCó, mạnh mẽ hơn\nđăng ký SEC Không Có, cơ bản Có, cơ bản\nyêu cầu nộp hồ sơ\nTrên- NYSE, NYSE, NASDAQ,\nĐịa điểm giao dịch Chưa niêm yết\nbộ đếm NASDAQ, AMEX AMEX\nPhí niêm yết Thấp Thấp Cao Cao\nQuy mô/thu nhập\nKhông Không Có Có\nyêu cầu\nQIB = Người mua tổ chức đủ điều kiện\nCác công ty nước ngoài có thể tiếp cận các nhà đầu tư Hoa Kỳ và mở rộng cơ sở nhà đầu tư vốn cổ phần của họ bằng\ntạo biên lai lưu ký của Mỹ (ADR). Trong ADR được tài trợ, một công ty nước ngoài\ngửi cổ phiếu của mình với một số ngân hàng nhất định để tạo ra chứng chỉ bằng đô la (tức là\nADR), thường sẽ được niêm yết trên sàn giao dịch. ADR giao dịch giống như cổ phiếu và\nthường theo dõi giá trị cơ bản của cổ phiếu của công ty được giao dịch trên sàn giao dịch\nnước ngoài.\nCó bốn loại danh sách ADR chính, mỗi loại\nvới các yêu cầu về niêm yết và quản trị doanh nghiệp ngày càng nghiêm ngặt hơn:\nQuy tắc 144A ADR: chưa đăng ký và chỉ bán riêng cho các nhà đầu tư đủ điều kiện, với các hạn chế bán lại\nCấp I: Đã đăng ký với SEC và giao dịch không cần kê đơn (OTC) với quyền truy cập cơ bản vào các nhà đầu tư\nHoa Kỳ\nCấp II: Đã đăng ký với SEC và giao dịch trao đổi với quyền truy cập tốt hơn của nhà đầu tư nhưng\nchi phí cao hơn và nhiều yêu cầu hơn\nCấp III: hầu hết yêu cầu đăng ký nghiêm ngặt của SEC; có thể được sử dụng bởi các công ty\nniêm yết nước ngoài để huy động vốn cổ phần mới và để mua lại\n(Lựa chọn B và C) ADR cấp I mang lại cho các công ty niêm yết nước ngoài quyền truy cập cơ bản nhất vào các thị trường và nhà đầu tư\nHoa Kỳ. Yêu cầu nộp hồ sơ của SEC ít nghiêm ngặt hơn và các ADR này không được bán để huy động vốn cổ phần mới ở Hoa Kỳ.\nNhững điều cần nhớ:\nBiên lai lưu ký (ADR) cấp I của Mỹ mang lại cho các công ty niêm yết nước ngoài quyền truy cập cơ bản nhất vào\nthị trường và nhà đầu tư Hoa Kỳ. ADR cấp I giao dịch không cần kê đơn, có yêu cầu nộp hồ sơ SEC ít nghiêm ngặt hơn\n và không được bán để huy động vốn cổ phần mới ở Hoa Kỳ.\nMô tả các phương pháp đầu tư vào chứng khoán vốn cổ phần ngoài nước\nLOS","qhtml":null},{"n":73,"q":"Regarding equity valuation, which of the following most likely relies on the law of one price?","opts":["A year-on-year comparison of a company's stock price.","A cross-sectional comparison of P/E ratios across automobile manufacturers.","A comparison between a justified P/E ratio and a trailing 12-month P/E ratio for a stock."],"ans":"B","expl":"Các bội số giá, chẳng hạn như tỷ lệ P/E, thường thể hiện mối quan hệ giữa\ngiá cổ phiếu của một công ty và một biến cơ bản, chẳng hạn như thu nhập. Phương pháp so sánh\nthường đòi hỏi phải so sánh bội số giá giữa các công ty trong cùng ngành (tức là,\nphân tích theo từng phần) để đánh giá liệu một công ty có được định giá hợp lý so với các đối thủ cạnh tranh\ndựa trên quy luật một giá hay không.\nVề lý thuyết, luật một giá ngụ ý rằng các công ty tương tự nên được định giá\ntương tự như các nguyên tắc cơ bản của chúng. Ví dụ: nếu tỷ lệ P/E trung bình trong một ngành là\n10 thì một công ty được định giá hợp lý sẽ có giá gấp 10 lần EPS của nó. Nếu giá cổ phiếu\ncủa một công ty cao hơn (thấp hơn) 10 lần EPS của nó thì công ty đó có thể bị định giá quá cao (được định giá thấp) so với\ncác công ty cùng ngành.\n(Lựa chọn A) So sánh giá cổ phiếu hàng năm đo lường sự tăng trưởng của các cổ đông.\nTrừ khi giá cổ phiếu được so sánh với một biến cơ bản, quy luật một giá không\náp dụng.\n(Lựa chọn C) Tỷ lệ P/E kéo dài 12 tháng dựa trên giá hiện tại và thu nhập trước đây,\ntrong khi tỷ lệ P/E dự phóng hợp lý dựa trên giá cổ phiếu và thu nhập dự báo.\nSo sánh hai tỷ lệ P/E (điều chỉnh so với cuối cùng) không dựa vào quy luật một mức giá.\nNhững điều cần nhớ:\nPhương pháp so sánh thường đòi hỏi phải so sánh bội số giá giữa các công ty trong\ntrong cùng ngành (tức là phân tích chéo) để đánh giá xem một công ty có được định giá hợp lý\nso với các đối thủ cạnh tranh dựa trên quy luật một giá hay không. Về lý thuyết, luật một giá\nquy định rằng các công ty tương tự phải được định giá tương tự so với các yếu tố cơ bản của họ.\nGiải thích cơ sở lý luận về việc sử dụng bội số giá để định giá vốn chủ sở hữu, giá của bội số thu nhập\nliên quan như thế nào đến các yếu tố cơ bản và việc sử dụng bội số dựa trên các giá trị có thể so sánh\nLOS","qhtml":null},{"n":74,"q":"Which of the following best replicates the cash flows of an interest rate swap? A series of:","opts":["interest rate futures.","interest rate call options.","forward rate agreements."],"ans":"C","expl":"Hợp đồng hoán đổi lãi suất cố định cho thả nổi là các công cụ phái sinh không cần kê đơn (OTC) trong đó\ncác bên đối tác đồng ý trao đổi một loạt các khoản thanh toán cố định để lấy một loạt các khoản thanh toán thả nổi.\nTại mỗi ngày thanh toán hoán đổi:\nngười trả tiền thả nổi nợ người trả tiền cố định nếu lãi suất tham chiếu lớn hơn\nlãi suất cố định của hoán đổi hoặc\nngười trả tiền cố định nợ tiền mặt của người trả tiền thả nổi nếu lãi suất tham chiếu nhỏ hơn\nlãi suất cố định của hoán đổi.\nDòng tiền hoán đổi tương tự như dòng tiền của các thỏa thuận tỷ giá kỳ hạn (FRA') (khi hết hạn)\nvì:\nngười bán FRA (tức là bán khống) thanh toán cho người mua (tức là mua) nếu lãi suất tham chiếu lớn hơn\nso với lãi suất đã thỏa thuận và\nngười mua FRA (tức là mua) thanh toán cho người bán (tức là bán) nếu tỷ giá tham chiếu thấp hơn\ntỷ lệ thỏa thuận.\nVới sự giống nhau này, dòng tiền của hợp đồng hoán đổi có thể được sao chép bằng một danh mục đầu tư gồm các FRA có\nthời gian hết hạn khớp với mỗi ngày thanh toán hợp đồng hoán đổi, tất cả đều có lãi suất được thỏa thuận bằng với\nlãi suất cố định của hợp đồng hoán đổi.\n(Lựa chọn A) Không giống như FRA, hợp đồng tương lai là các công cụ phái sinh được giao dịch trao đổi tạo ra dòng tiền\nhàng ngày vì chúng được đánh dấu để tiếp thị trong mỗi phiên giao dịch. Mặc dù danh mục đầu tư tương lai lãi suất\ncó thể tạo ra rủi ro thị trường tương tự như hợp đồng hoán đổi lãi suất, nhưng danh mục đầu tư\ntương lai không thể sao chép dòng tiền của hợp đồng hoán đổi.\n(Lựa chọn B) Người nắm giữ quyền chọn mua lãi suất không bao giờ phải gánh chịu dòng tiền âm khi hết hạn.\nNgười nắm giữ nhận được giá trị quyền chọn mua bằng tiền mặt hoặc không nhận được gì. Ngược lại, các giao dịch hoán đổi có thể\ncó dòng tiền dương hoặc âm vào ngày thanh toán.\nNhững điều cần nhớ:\nMột giao dịch hoán đổi tương đương với một danh mục đầu tư gồm các hợp đồng kỳ hạn. Danh mục đầu tư bao gồm một hợp đồng kỳ hạn\ncho mỗi ngày thanh toán hoán đổi, mỗi ngày hết hạn trùng với ngày thanh toán hoán đổi\n.\nMô tả các hợp đồng hoán đổi tương tự nhưng khác với một loạt hợp đồng kỳ hạn\nLOS","qhtml":null},{"n":75,"q":"In credit analysis, the size of the notching adjustment for the rating on a corporate bond issue\nis most likely :","opts":["unrelated to the issuer's reference credit rating.","directly related to the issuer's reference credit rating.","inversely related to the issuer's reference credit rating."],"ans":"C","expl":"Các nguyên tắc khía cạnh liên quan đến xếp hạng tín dụng\nLớp bảo mật Xếp hạng thâm niên Ba2 trở lên Ba3 hoặc thấp hơn\nNợ có bảo đảm Trái phiếu có bảo đảm +1 +1\nTrái phiếu không có bảo đảm cao cấp 0 0*\nTrái phiếu cấp cao −1 −2\nNợ không có bảo đảm\nTrái phiếu cấp cao −1 −2\nTrái phiếu cấp cao −1 −2 hoặc −3\nVốn cổ phần Cổ phiếu ưu đãi −2 −3 hoặc −4\n*Tỷ lệ tham chiếu cho các tổ chức phát hành được xếp hạng Ba3 hoặc thấp hơn có thể là xếp hạng nợ không có bảo đảm\ncấp cao hoặc xếp hạng tín dụng gia đình doanh nghiệp.\nNguồn: Moody's Investor Service\nXếp hạng tín dụng trái phiếu dựa trên tổn thất dự kiến do vỡ nợ, phản ánh ước tính về\nxác suất vỡ nợ và mức độ nghiêm trọng của tổn thất trong trường hợp vỡ nợ. Xếp hạng trái phiếu phản ánh cả\nmức độ tin cậy chung của tổ chức phát hành và các yếu tố cụ thể của vấn đề (ví dụ: tài sản thế chấp,\nphụ thuộc). Notting là quy trình của các cơ quan xếp hạng nhằm xác định xếp hạng về\ncác vấn đề riêng lẻ liên quan đến xếp hạng tín dụng tham chiếu của nhà phát hành, thường là\nxếp hạng đối với khoản nợ không có bảo đảm cao cấp của nhà phát hành hoặc xếp hạng tín dụng gia đình doanh nghiệp.\nHình ảnh trên minh họa các nguyên tắc khía và cho thấy việc điều chỉnh khía có liên quan nghịch như thế nào\n với xếp hạng tín dụng tham chiếu của một công ty. Việc điều chỉnh\ncác mức điều chỉnh nhỏ hơn đối với các tổ chức phát hành có xếp hạng tín dụng cao hơn phản ánh xác suất vỡ nợ\nthấp hơn nhiều. Xác suất vỡ nợ của các tổ chức phát hành được xếp hạng thấp hơn cao hơn nhiều, do đó, vấn đề của họ\nđòi hỏi những điều chỉnh lớn hơn để nắm bắt mức độ rủi ro lớn hơn (Lựa chọn A và B).\nNhững điều cần nhớ:\nXếp hạng tín dụng trái phiếu dựa trên tổn thất dự kiến ​​do vỡ nợ, phản ánh cả\nmức độ tín nhiệm chung của tổ chức phát hành và các yếu tố cụ thể của vấn đề. Các điều chỉnh khía cạnh\ncó liên quan nghịch với xếp hạng tín dụng tham chiếu của tổ chức phát hành. Do đó, khoản nợ của các tổ chức phát hành có\nxếp hạng tín dụng cao hơn sẽ có mức điều chỉnh nhỏ hơn do ít gặp phải\nrủi ro tín dụng hơn.\nMô tả cách sử dụng xếp hạng của các tổ chức xếp hạng tín dụng và những hạn chế của họ.\nLOS","qhtml":null},{"n":76,"q":"When analyzing the credit risk of a bond issue, the expected loss can most likely be estimated\nknowing only the bond's:","opts":["spread risk and loss severity.","downgrade risk and recovery rate.","default probability and loss severity."],"ans":"C","expl":"Đánh giá của các cơ quan xếp hạng về rủi ro tín dụng phản ánh tổn thất dự kiến do vỡ nợ của\nngười vay (tức là nhà phát hành trái phiếu). Hai yếu tố của rủi ro tín dụng là xác suất vỡ nợ và\nmức độ nghiêm trọng của tổn thất:\nXác suất vỡ nợ là khả năng ước tính xảy ra vỡ nợ.\nMức độ nghiêm trọng của tổn thất là ước tính mức giảm giá trị yêu cầu bồi thường của chủ trái phiếu (tức là\ntiền gốc và mọi phiếu giảm giá quá hạn) trong trường hợp vỡ nợ.\nTổn thất dự kiến được ước tính là tích của hai yếu tố: xác suất vỡ nợ và mức độ nghiêm trọng của tổn thất\n, trong đó mức độ nghiêm trọng của tổn thất bằng 1 − Tỷ lệ phục hồi. Các thuật ngữ mức độ nghiêm trọng của tổn thất, tổn thất được đưa ra\nmặc định và mức độ nghiêm trọng của tổn thất được đưa ra mặc định được sử dụng thay thế cho nhau và bất kỳ biểu thức nào được sử dụng\n đều bằng 1 − Tỷ lệ phục hồi.\n(Lựa chọn A và B) Rủi ro chênh lệch (nghĩa là sự thay đổi chênh lệch giữa YTM của trái phiếu so với\nlợi suất chuẩn) và rủi ro hạ cấp (tức là khả năng xếp hạng tín dụng của trái phiếu bị giảm đã giảm)\nphản ánh những thay đổi có thể có về chất lượng tín dụng của trái phiếu, nhưng không trực tiếp đo lường xác suất vỡ nợ\nxác suất vỡ nợ.\nNhững điều cần nhớ:\nHai yếu tố của rủi ro tín dụng là xác suất vỡ nợ và mức độ nghiêm trọng của tổn thất nếu xảy ra\nvỡ nợ. Tổn thất của trái chủ do vỡ nợ được ước tính bằng cách nhân xác suất vỡ nợ\nvới mức độ nghiêm trọng của tổn thất (1 − Tỷ lệ thu hồi).\nMô tả rủi ro tín dụng và các thành phần của nó, xác suất vỡ nợ và tổn thất do vỡ nợ.\nLOS","qhtml":null},{"n":77,"q":"Which of the following exposes a counterparty lending to a bank to the least amount of credit\nrisk?","opts":["Central bank funds","Repurchase agreements","Negotiable certificates of deposit"],"ans":"B","expl":"Các lựa chọn thay thế tài trợ ngân hàng ngắn hạn\nTiền gửi của khách hàng cá nhân và thương mại\nKiểm tra (tức là nhu cầu), tiết kiệm và thị trường tiền tệ\nTiền gửi bán lẻ\ntài khoản\nTiền gửi ngân hàng thương mại (thường được yêu cầu) tại ngân hàng trung ương\nngân hàng\nNgân hàng trung ương\nVượt quá mức tối thiểu bắt buộc có thể được cho vay\n(dự trữ) quỹ\nngân hàng\nThị trường gửi tiền và cho vay giữa các ngân hàng\nQuỹ liên ngân hàng\nTiền gửi có mệnh giá lớn kèm theo hình phạt khi nộp sớm\nCó thể thương lượng\nrút\nchứng chỉ\nTránh phạt rút tiền bằng cách bán tiền gửi cho người khác\ntiền gửi (CD)\nnhà đầu tư\nBán chứng khoán kết hợp với mua lại sau này của cùng một\nMua lại\nbảo mật\ncác thỏa thuận (repos)\nCác giao dịch kết hợp tương đương với một khoản vay thế chấp\nThỏa thuận mua lại (repo) được cấu trúc như một cặp giao dịch:\nKhi bắt đầu, chứng khoán được bán để lấy tiền mặt, đồng thời\ncác đối tác đồng ý với giao dịch thứ hai trong đó người bán sẽ mua lại những\nchứng khoán đó khi đáo hạn với giá cao hơn.\nViệc mua lại bắt buộc làm cho các hợp đồng repo tương đương về mặt kinh tế với các khoản vay được thế chấp.\nngười mua repo (tức là người cho vay) có chứng khoán có thể được bán để thu hồi số tiền còn nợ nếu\nngười bán repo (tức là người đi vay) không mua lại chúng. Số tiền được vay trong một hợp đồng repo ít hơn\ngiá trị của tài sản thế chấp , do đó giảm thiểu rủi ro tín dụng của người cho vay .\n(Lựa chọn A và C) Các khoản vay bằng quỹ ngân hàng trung ương và chứng chỉ tiền gửi có thể chuyển nhượng không được\nthế chấp, vì vậy người cho vay gặp nhiều rủi ro tín dụng hơn so với hợp đồng repo.\nNhững điều cần nhớ:\nThỏa thuận mua lại (repos) bao gồm việc bán chứng khoán ban đầu và\nmua lại những chứng khoán đó sau đó. Repos là một loại khoản vay có thế chấp vì người mua\nđược bảo vệ khỏi vỡ nợ bằng cách sở hữu chứng khoán. Các khoản vay từ quỹ ngân hàng trung ương và\nchứng chỉ tiền gửi có thể thương lượng không được thế chấp và do đó khiến người cho vay gặp nhiều rủi ro tín dụng hơn\n.\nSo sánh các lựa chọn tài trợ ngắn hạn có sẵn cho các tập đoàn và tổ chức tài chính.\nLOS","qhtml":null},{"n":78,"q":"The I-spread is most appropriately defined as the difference between a bond's yield and:","opts":["a swap rate.","the spot curve.","a government bond's yield."],"ans":"A","expl":"Chênh lệch lợi suất là chênh lệch giữa YTM của trái phiếu và lợi suất chuẩn.\nLợi suất trái phiếu có thể được biểu thị bằng tổng của\ntỷ lệ chuẩn, đại diện cho các yếu tố ảnh hưởng đến tất cả trái phiếu và\nchênh lệch, đại diện cho các yếu tố cụ thể hơn đối với trái phiếu hoặc tổ chức phát hành .\nChênh lệch lợi suất khác nhau là kết quả của việc sử dụng các điểm chuẩn khác nhau. Lợi suất trái phiếu thường\nđược sử dụng làm điểm chuẩn, nhưng điểm chuẩn cũng có thể được bắt nguồn từ đường cong hoán đổi lãi suất\n. Mức chênh lệch I được định nghĩa là mức chênh lệch mà trái phiếu kiếm được so với tỷ lệ hoán đổi của\ncùng kỳ hạn.\n(Lựa chọn B) Đường cong giao ngay được sử dụng để tính mức chênh lệch Z, là mức chênh lệch áp dụng trên\nđường chuẩn cho phép dòng tiền chiết khấu của trái phiếu bằng với giá trái phiếu.\n(Lựa chọn C) Lợi suất vượt mức mà trái phiếu kiếm được trên một trái phiếu chính phủ là mức chênh lệch G.\nNhững điều cần nhớ:\nChênh lệch lợi suất là chênh lệch giữa YTM của trái phiếu và lợi suất chuẩn. Mức chênh lệch I được\nđịnh nghĩa là chênh lệch lợi suất giữa trái phiếu và tỷ giá hoán đổi có cùng kỳ hạn.\nSo sánh, tính toán và diễn giải các thước đo lợi suất và chênh lệch lợi suất đối với trái phiếu có lãi suất cố định.\nLOS","qhtml":null},{"n":79,"q":"Regarding alternative investments, which of the following is most likely characteristic of co-\ninvesting? Alternative investment managers:","opts":["are offered private deals from their fund investors.","have better access to private deals than direct investors.","bring in other investors on the most attractive private deals."],"ans":"B","expl":"Cùng đầu tư vào các khoản đầu tư thay thế\nƯu điểm Nhược điểm\nCung cấp trải nghiệm đầu tư trực tiếp Đòi hỏi nhiều nguồn lực hơn và\nTận dụng chuyên môn của công ty đầu tư hơn là đầu tư vào quỹ\nquy trình và chuyên môn Cơ hội đầu tư trực tiếp là\nGiảm phí quản lý phụ thuộc vào công ty đầu tư\nCách tiếp cận tích cực hơn Xu hướng lựa chọn bất lợi tiềm ẩn\nBa phương pháp phổ biến nhất để tham gia vào các khoản đầu tư thay thế, được sắp xếp theo\nmức độ tham gia hoặc chuyên môn ngày càng cần thiết, là:\nĐầu tư quỹ : Quỹ (ví dụ: quỹ phòng hộ) đưa ra tất cả các quyết định đầu tư. Quỹ\nđầu tư là một phương pháp đầu tư gián tiếp.\nĐồng đầu tư : Một nhà đầu tư vào một quỹ thay thế (ví dụ: quỹ đầu tư tư nhân) có thể đầu tư\ntrực tiếp (tức là tư nhân và bên ngoài cấu trúc quỹ) bằng cách cam kết bổ sung vốn cho\ncác khoản đầu tư cụ thể cùng với người quản lý quỹ đã đưa ra ý tưởng (tức là với tư cách\ntrung gian).\nĐầu tư trực tiếp : Một nhà đầu tư thực hiện đầu tư trực tiếp vào một tài sản (ví dụ: trực tiếp nắm giữ\nvị trí trong một công ty tư nhân mà không thông qua trung gian).\nMột số nhà quản lý quỹ nhất định được hưởng những lợi ích danh tiếng khiến họ trở thành đối tác\ntrong các giao dịch tư nhân đáng mơ ước. Sự tham gia của những nhà quản lý như vậy, chẳng hạn như các quỹ phòng hộ nổi tiếng,\ntạo ra bầu không khí hợp pháp giúp tăng cơ hội chào bán thành công cho nhà phát hành.\nDo đó, các nhà phát hành tìm kiếm những nhà quản lý này, giúp họ tiếp cận tốt hơn với các giao dịch\ntốt nhất so với các nhà đầu tư trực tiếp khác. Tuy nhiên, có thể xảy ra sai lệch lựa chọn bất lợi vì\nngười quản lý có thể chọn giữ các giao dịch đó cho riêng mình (Lựa chọn C).\n(Lựa chọn A) Các nhà quản lý đầu tư thay thế cung cấp các giao dịch riêng tư cho các nhà đầu tư quỹ của họ chứ không phải\nngược lại.\nNhững điều cần nhớ:\nMột số nhà quản lý quỹ nhất định được hưởng những lợi ích danh tiếng khiến họ trở thành đối tác mong muốn trong\ngiao dịch riêng tư. Sự tham gia của những nhà quản lý như vậy tạo ra bầu không khí hợp pháp, nâng cao\ncơ hội chào bán thành công. Do đó, các tổ chức phát hành tìm kiếm những người quản lý này, điều này giúp người quản lý\ntiếp cận tốt hơn với các giao dịch tốt nhất nhưng có thể dẫn đến sai lệch lựa chọn bất lợi nếu họ\nchọn giữ các giao dịch đó cho riêng mình.\nSo sánh đầu tư trực tiếp, đồng đầu tư và các phương thức đầu tư cấp vốn cho các hình thức đầu tư\nthay thế\nLOS","qhtml":null},{"n":80,"q":"A swap contract is priced so that it has a value of zero at initiation. If the value of the\nunderlying changes during the life of a swap contract, the most likely impact is that:","opts":["only the price of the swap changes.","only the value of the swap changes.","both the value and price of the swap change."],"ans":"B","expl":"Hoán đổi: định giá so với định giá\nĐịnh nghĩa Phương pháp Khoảng thời gian\nĐặt điều khoản theo hợp đồng Đặt tỷ giá cố định sao cho giá trị hiện tại của\nĐộ dài đầy đủ của hợp đồng\nGiá có giá trị thanh toán ban đầu từ các đối tác là\ntừ khi bắt đầu\nkhông bằng\nXác định sự khác biệt giữa Thời gian còn lại của\nXác định giá trị hiện tại của hợp đồng\nĐịnh giá giá trị hiện tại của hợp đồng cố định và thả nổi từ\ngiá trị sau khi bắt đầu\nngày định giá thanh toán\nMặc dù các thuật ngữ định giá và định giá được sử dụng thay thế cho nhau trong một số ngữ cảnh, nhưng chúng\ncó ý nghĩa riêng biệt khi sử dụng liên quan đến giao dịch hoán đổi.\nĐịnh giá hoán đổi đề cập đến việc thiết lập các điều khoản hợp đồng khi bắt đầu và\ngiá trị đề cập đến việc xác định giá trị của giao dịch hoán đổi sau khi bắt đầu.\nCả hai đối tác đều đang thanh toán và nhận, vì vậy giá trị của hợp đồng hoán đổi chỉ đơn giản là sự khác biệt\ntrong giá trị hiện tại của dòng tiền trong tương lai. Hầu hết các giao dịch hoán đổi đều được định giá để có giá trị\nban đầu bằng 0 vì cả hai bên tham gia hoán đổi để trao đổi dòng tiền có giá trị tương đương.\nGiá trị của giao dịch hoán đổi bất kỳ lúc nào sau khi bắt đầu bị ảnh hưởng bởi những thay đổi trong điều kiện thị trường\nvà bởi giá trị dao động của tài sản cơ sở . Khi những thay đổi này và\nbiến động xảy ra, giá trị của dòng tiền sẽ thay đổi đối với từng đối tác. Sự khác biệt\nđược phản ánh trong giá trị của hợp đồng hoán đổi, là chênh lệch ròng trong giá trị hiện tại của\ndòng tiền của nó (Lựa chọn A và C).\nNhững điều cần nhớ:\nĐịnh giá hoán đổi đề cập đến việc đặt các điều khoản hợp đồng khi bắt đầu, khi giá trị hoán đổi thường là\n0. Tại bất kỳ thời điểm nào sau khi bắt đầu, giá trị là chênh lệch ròng trong giá trị hiện tại của\ndòng tiền của giao dịch hoán đổi.\nĐối chiếu giá trị và giá của giao dịch hoán đổi\nLOS","qhtml":null},{"n":81,"q":"A hedge fund manager wants the power to liquidate positions in a well-organized way\nwhenever necessary and plans to impose restrictions on investors' ability to redeem capital.\nWhich of the following restrictions would be most appropriate ?","opts":["Notice period","Lockup period","Redemption fee"],"ans":"A","expl":"Việc mua lại của nhà đầu tư có thể tác động đáng kể đến hiệu suất của các quỹ phòng hộ. Các yêu cầu mua lại\nngoài kế hoạch có thể buộc người quản lý quỹ bán tài sản kém thanh khoản hoặc dễ bay hơi với\ngiá bất lợi. Điều này có thể gây tổn hại đến hiệu suất của quỹ và dẫn đến thua lỗ cho các nhà đầu tư\ncòn lại.\nCác quỹ phòng hộ thường áp đặt các hạn chế đối với các nhà đầu tư, không khuyến khích hoặc cấm mua lại\ntrong các khoảng thời gian cụ thể:\nThời gian khóa là khoảng thời gian tối thiểu mà nhà đầu tư cam kết với quỹ sau\nđầu tư ban đầu. Hạn chế này sẽ cung cấp cho người quản lý quỹ một khoảng thời gian hợp lý\nđể lựa chọn và mua lại các tài sản giúp tối ưu hóa chiến lược của quỹ. Việc rút tiền\nkhông được phép trong thời gian này, nhưng không có gì hạn chế việc rút lại sau khi\nthời gian khóa kết thúc (Lựa chọn B).\nThời hạn thông báo là khoảng thời gian mà nhà đầu tư phải đợi để nhận được\nviệc chuộc lại sau khi yêu cầu. Hạn chế này giúp người quản lý quỹ có thêm thời gian để\nchuyển đổi tài sản thành tiền mặt, giúp giảm rủi ro buộc phải bán và khiến khoảng thời gian thông báo\nlà lựa chọn thích hợp nhất cho những nhà quản lý quỹ lo ngại về tính thanh khoản.\nPhí mua lại được các nhà đầu tư trả khi mua lại vốn của họ và thường\nđược thêm trở lại quỹ. Các khoản phí này sẽ bồi thường cho các nhà đầu tư còn lại những tổn thất mà quỹ\ncuối cùng có thể phải gánh chịu khi thanh lý các vị thế một cách nhanh chóng. Phí quy đổi\nkhông khuyến khích nhưng không cấm việc quy đổi bất cứ lúc nào (Lựa chọn C).\nNhững điều cần nhớ:\nCác quỹ phòng hộ thường áp đặt các hạn chế đối với việc quy đổi. Những hạn chế này có thể cấm\nnhà đầu tư mua lại trong một khoảng thời gian sau khoản đầu tư ban đầu (thời gian khóa) và/hoặc\nyêu cầu thông báo trước để xử lý việc mua lại (thời gian thông báo). Các quỹ cũng có thể áp dụng\nphí hoàn lại, điều này không khuyến khích—nhưng không cấm—việc hoàn lại và thường\nbồi thường cho các nhà đầu tư còn lại về mọi tổn thất phát sinh.\nMô tả việc đánh giá hiệu suất của các khoản đầu tư thay thế\nLOS","qhtml":null},{"n":82,"q":"All else equal, if the actual return from investing in a company's stock is less than the\ninvestors' minimum required rate of return, which of the following is most likely to increase?\nThe company's:","opts":["cost of debt.","cost of equity.","return on equity."],"ans":"B","expl":"Tỷ suất lợi nhuận yêu cầu tối thiểu của nhà đầu tư để cung cấp vốn cổ phần cho một công ty có thể\nđược coi là chi phí vốn chủ sở hữu của công ty ( r ). Nếu lợi nhuận thực tế của một cổ phiếu nhỏ hơn\ne\nTỷ suất lợi nhuận yêu cầu tối thiểu của nhà đầu tư thì:\n1. nhà đầu tư sẽ bán cổ phiếu và đầu tư số tiền thu được vào nơi khác, do đó làm giảm lợi nhuận\ngiá cổ phiếu của công ty.\n2. Nếu các nguyên tắc cơ bản của công ty không thay đổi (ví dụ: thu nhập trong tương lai hoặc kỳ vọng về dòng tiền),\n3. lợi nhuận kỳ vọng từ việc mua cổ phiếu tăng khi giá cổ phiếu cơ sở\ngiảm đi.\nĐiều này gây ra sự gia tăng tỷ suất lợi nhuận yêu cầu tối thiểu (tức là chi phí vốn cổ phần).\n(Lựa chọn A) Chi phí nợ dựa trên kỳ vọng thu hồi vốn của các chủ nợ (tức là người sở hữu trái phiếu,\nngười cho vay), chứ không phải nhà đầu tư cổ phần.\n(Lựa chọn C) ROE (tức là Thu nhập ròng / Vốn chủ sở hữu trung bình) là thước đo kế toán\ndựa trên kết quả tài chính được báo cáo của công ty và do đó có tính lạc hậu. Như vậy, ROE\nkhông bị ảnh hưởng bởi lợi nhuận thực tế của cổ phiếu, dựa trên giá trị thị trường.\nNhững điều cần nhớ:\nNếu lợi nhuận của một cổ phiếu không lớn hơn r trên thị trường vốn thì nhà đầu tư sẽ bán cổ phiếu đó.\ne\ncổ phiếu của công ty và đầu tư số tiền thu được vào nơi khác, do đó làm giảm cổ phiếu của công ty\ngiá cả. Giữ tất cả các yếu tố khác bằng nhau, khi giá cổ phiếu giảm, lợi nhuận kỳ vọng từ việc mua\ncổ phiếu và do đó, chi phí vốn cổ phần của công ty tăng lên.\nSo sánh chi phí vốn cổ phần của một công ty, lợi nhuận trên vốn chủ sở hữu (kế toán) và yêu cầu của nhà đầu tư\ntỷ lệ hoàn vốn\nLOS","qhtml":null},{"n":83,"q":"If a country's security markets are semi-strong form efficient, an investor would most likely be\nable to generate abnormal returns using:","opts":["only technical analysis.","only fundamental analysis.","neither technical nor fundamental analysis."],"ans":"C","expl":"Giả thuyết thị trường hiệu quả (EMH) quy định rằng thị trường hiệu quả khi giá tài sản\nphản ánh đầy đủ tất cả thông tin liên quan. Nếu một thị trường hiệu quả, lợi nhuận bất thường không thể đạt được\nmột cách nhất quán trong thị trường đó với thông tin thu được từ các nguồn do\nEMH chỉ định.\nỞ dạng thị trường hiệu quả ở mức độ vừa phải, giá tài sản được giả định phản ánh tất cả\ndữ liệu lịch sử thị trường cộng với tất cả thông tin có sẵn công khai (ví dụ: báo cáo tài chính,\ncác báo cáo thu nhập). Cả dữ liệu lịch sử và thông tin công khai đều được đồng hóa hoàn toàn vào giá\n, vì vậy nhà đầu tư không thể đạt được lợi nhuận bất thường khi sử dụng những nguồn lực đó. Một nhà đầu tư\nchỉ có thể đạt được lợi nhuận bất thường bằng cách sử dụng thông tin nội bộ.\nHai phương pháp phân tích được sử dụng để ước tính giá trị tương đối của các khoản đầu tư và phát triển\ncác quyết định đầu tư:\nPhân tích kỹ thuật (ví dụ: kỹ thuật biểu đồ) sử dụng dữ liệu giao dịch lịch sử và\nkhối lượng của thị trường.\nPhân tích cơ bản (ví dụ: tiền mặt miễn phí) định giá dòng chảy) sử dụng dữ liệu có sẵn công khai để rút ra\ngiá trị nội tại của tài sản.\nDo đó, trong một thị trường hiệu quả ở dạng bán mạnh, cả phân tích kỹ thuật lẫn phân tích cơ bản\nsẽ không thể tạo ra lợi nhuận bất thường (Lựa chọn A và B) .\nNhững điều cần nhớ:\nTheo giả thuyết thị trường hiệu quả ở dạng bán mạnh, tất cả dữ liệu thị trường lịch sử đều được công khai\nthông tin có sẵn được phản ánh trong giá tài sản. Để đưa ra các quyết định đầu tư, phân tích\nkỹ thuật sử dụng dữ liệu lịch sử thị trường trong khi phân tích cơ bản sử dụng dữ liệu có sẵn công khai.\nDo đó, trong một thị trường có hiệu quả ở dạng khá mạnh, cả phân tích kỹ thuật và phân tích cơ bản\nsẽ không thể tạo ra lợi nhuận bất thường.\nGiải thích ý nghĩa của từng dạng hiệu quả thị trường đối với phân tích cơ bản, phân tích\nkỹ thuật và lựa chọn giữa chủ động và thụ động quản lý danh mục đầu tư\nLOS","qhtml":null},{"n":84,"q":"An enterprise value (EV) multiple least appropriately measures a company's EV relative to its:","opts":["EBITDA.","Net income.","Operating income."],"ans":"B","expl":"Giá trị doanh nghiệp so với bội số giá trị vốn chủ sở hữu\nEV / EBITDA\nEV / Doanh thu\nGiá trị doanh nghiệp (EV) bội số EV / Thu nhập hoạt động\nEV / FCFF (dòng tiền tự do cho công ty)\nP/E (giá trên thu nhập)\nPEG (giá/thu nhập trên tăng trưởng)\nBội số giá trị vốn chủ sở hữu\nP/B (giá trên sổ sách)\nGiá trị doanh nghiệp Bội số (EV) là số liệu định giá tương đối đánh giá EV\ncủa một công ty so với một biến cơ bản.\nTử số của tỷ lệ, EV, đo lường giá trị của toàn bộ hoạt động của một công ty, được\ntài trợ bởi tất cả các nguồn vốn (tức là vốn cổ phần phổ thông, nợ, cổ phiếu ưu đãi).\nMẫu số của tỷ lệ , biến cơ bản, thường là một số liệu tài chính (ví dụ:\ndoanh thu, EBITDA, thu nhập hoạt động) đại diện cho số tiền do công ty tạo ra\ncó sẵn cho tất cả các nhà cung cấp vốn (tức là trước khi trả bất kỳ khoản lãi và/hoặc cổ tức nào).\nVì EV bao gồm toàn bộ công ty nên cách thích hợp nhất là so sánh nó với số liệu\nthể hiện số tiền có sẵn cho tất cả các nhà cung cấp vốn , chẳng hạn như EBITDA hoặc hoạt động\nthu nhập (Lựa chọn A và C) . Ngược lại, thu nhập ròng là khoản tiền lãi ròng mà các nhà cung cấp nợ phải trả\nvà thể hiện số tiền còn lại chỉ dành cho các cổ đông. Thu nhập ròng thích hợp cho\nso sánh liên quan đến giá trị vốn chủ sở hữu (ví dụ: tỷ lệ P/E).\nNhững điều cần nhớ:\nBội số giá trị doanh nghiệp (EV) là số liệu định giá tương đối đánh giá EV của một công ty so với\nmột biến cơ bản. EV đo lường giá trị của toàn bộ hoạt động của một công ty, được tài trợ\nbởi tất cả các nguồn vốn. Biến cơ bản thường là doanh thu, EBITDA, thu nhập\nhoạt động hoặc bất kỳ số liệu nào đại diện cho số tiền do công ty tạo ra có sẵn cho tất cả\nnhà cung cấp vốn (tức là trước khi trả bất kỳ khoản lãi và/hoặc cổ tức nào).\nMô tả bội số giá trị doanh nghiệp và cách sử dụng chúng trong việc ước tính giá trị vốn chủ sở hữu\nLOS","qhtml":null},{"n":85,"q":"If a company issued a senior subordinated bond with a B2 rating, which of the following\nis most likely to be its issuer rating?","opts":["Ba3","B2","B3"],"ans":"A","expl":"Các cơ quan xếp hạng xem xét mức độ ưu tiên của các yêu cầu bồi thường, cùng với các tiêu chí khác, khi xếp hạng\ncác vấn đề về trái phiếu của người vay . Xếp hạng về trái phiếu không có bảo đảm cao cấp phản ánh độ tin cậy\ncủa tổ chức phát hành, do đó, chúng thường có cùng mức xếp hạng như tổ chức phát hành trái phiếu . Các vấn đề khác\nthường được xếp thứ cấp và xếp hạng của chúng thấp hơn, phản ánh mức độ ưu tiên thấp hơn của chúng.\nCác cơ quan xếp hạng sử dụng notch để đặt xếp hạng vấn đề. Xếp hạng nhà phát hành là điểm bắt đầu ,\nvà xếp hạng trái phiếu được \"chấm\" (tức là đã điều chỉnh ) dựa trên vị trí của mỗi đợt phát hành được xếp hạng theo\nưu tiên của các yêu cầu bồi thường. Các tổ chức phát hành được xếp hạng thấp hơn có rủi ro vỡ nợ lớn hơn, vì vậy các cơ quan áp dụng các điều chỉnh\nlớn hơn để phản ánh rủi ro cao hơn trong các vấn đề cấp dưới của họ.\nTrong câu hỏi này, trái phiếu cấp dưới có xếp hạng B2. Do mức độ ưu tiên của yêu cầu bồi thường, cơ quan xếp hạng\n lẽ ra đã điều chỉnh giảm mức xếp hạng của khoản nợ không có bảo đảm cấp cao để đạt được\nxếp hạng này. Do đó, xếp hạng của nhà phát hành rất có thể cao hơn. Do đó, xếp hạng của tổ chức phát hành\nsẽ là Ba3.\n(Lựa chọn B) B2 có cùng mức xếp hạng với khoản nợ cấp dưới, nhưng xếp hạng của tổ chức phát hành\ncó nhiều khả năng cao hơn trong trường hợp này.\n(Lựa chọn C) B3 thấp hơn xếp hạng hiện tại cho khoản nợ cấp dưới. Xếp hạng của tổ chức phát hành\nthường được xếp hạng cao hơn chứ không phải thấp hơn nợ thứ cấp.\nNhững điều cần nhớ:\nCác cơ quan xếp hạng sử dụng một quy trình gọi là notch để đặt xếp hạng vấn đề. Điều này phụ thuộc vào việc sử dụng xếp hạng\ncủa tổ chức phát hành làm điểm khởi đầu và điều chỉnh dựa trên mức độ ưu tiên của các yêu cầu xếp hạng trái phiếu. Việc điều chỉnh\nthay đổi tùy theo mức độ tin cậy của tổ chức phát hành, với những điều chỉnh lớn hơn thường\náp dụng cho khoản nợ thứ cấp của các tổ chức phát hành có chất lượng thấp hơn.\nMô tả việc sử dụng xếp hạng từ các tổ chức xếp hạng tín dụng và những hạn chế của chúng.\nLOS","qhtml":null},{"n":86,"q":"With regards to credit analysis, management's strategy and execution most likely affects:","opts":["capacity.","collateral.","character."],"ans":"A","expl":"4 Cs phân tích tín dụng\nKhả năng thanh toán nợ đúng hạn\nGiá trị tài sản thế chấp của tài sản hỗ trợ nợ\nCác điều khoản và điều kiện trong hợp đồng nợ\nNhân vật Hồ sơ theo dõi quản lý\nNăng lực là khả năng trả nợ của người vay . Việc đánh giá năng lực đòi hỏi\nphân tích toàn diện về tính ổn định và khả năng dự đoán của tất cả các khoản thu và\nchi tiêu. Đánh giá năng lực của một công ty phải bao gồm:\ncấu trúc và nguyên tắc cơ bản của ngành để xác định môi trường cạnh tranh và\ntriển vọng tăng trưởng,\ncác nguyên tắc cơ bản của công ty để hiểu vị thế cạnh tranh và lịch sử hoạt động của nó,\nphân tích tỷ lệ để đánh giá lợi nhuận, đòn bẩy và khả năng trả nợ và\ncông ty để đánh giá tính linh hoạt trong tương lai đối với hoạt động cấp vốn và cấp vốn\ninvestment.\nĐánh giá chiến lược và việc thực hiện của ban quản lý là một khía cạnh quan trọng trong việc phân tích\nkhả năng trả nợ của công ty. Các nhà phân tích phải đánh giá khả năng của ban quản lý\ntrong việc thiết kế các chiến lược phù hợp với môi trường hoạt động và khả năng của ban quản lý\nđể thực hiện thành công các chiến lược đó nhằm đạt được mức tăng trưởng và lợi nhuận mục tiêu.\n(Lựa chọn B) Tài sản thế chấp đề cập đến giá trị tài sản của người đi vay so với số tiền nợ\ncủa họ.\n(Lựa chọn C) Ký tự đề cập đến sự cởi mở và minh bạch của ban quản lý trung thực liên quan đến\nbáo cáo tài chính và truyền thông đại chúng.\nNhững điều cần nhớ:\nTrong phân tích tín dụng truyền thống, năng lực là khả năng trả nợ của người vay. Khả năng\ncủa ban quản lý trong việc thiết kế các chiến lược phù hợp và thực hiện thành công chúng là một khía cạnh quan trọng của\nnăng lực đánh giá.\nMô tả các yếu tố định tính và định lượng được sử dụng để đánh giá\nmức độ tin cậy của người đi vay là doanh nghiệp.\nLOS","qhtml":null},{"n":87,"q":"A bond indenture is least likely to include:","opts":["Covenants","Credit ratings","Contingency provisions"],"ans":"B","expl":"Khế ước trái phiếu\nNghĩa vụ của tổ chức phát hành\nHợp đồng\nQuyền của chủ sở hữu trái phiếu\nNgày đáo hạn lãi và gốc\nDòng tiền\nSố tiền đến hạn hoặc phương pháp xác định\nKhẳng định: Các hành động mà nhà phát hành phải thực hiện\nCác giao ước\nTiêu cực: Các hành động mà nhà phát hành bị cấm thực hiện\nThời hạn phát hành trái phiếu\nBảo vệ tín dụng\nTài sản được cầm cố làm tài sản thế chấp hoặc tăng cường tín dụng\nTùy chọn trái chủ: Điều khoản bán hoặc chuyển đổi\nĐiều khoản dự phòng\nTùy chọn nhà phát hành: Điều khoản mua lại\nThỏa thuận (ví dụ: khế ước trái phiếu, chứng thư ủy thác) là những hợp đồng chỉ rõ các điều khoản và\nđiều kiện liên quan đến hoàn trả chứng khoán nợ. Khế ước trái phiếu xác định:\nquyền của người sở hữu trái phiếu ,\nnghĩa vụ của nhà phát hành và\nngười được ủy thác giám sát và thực thi việc tuân thủ hợp đồng của nhà phát hành.\nKhế ước trái phiếu cũng chỉ định số tiền và thời gian trả lãi và nợ gốc\ncùng với (các) nguồn vốn để đáp ứng những điều đó nghĩa vụ. Xếp hạng tín dụng phản ánh đánh giá của cơ quan xếp hạng\nvề khả năng thanh toán của nhà phát hành trái phiếu theo các điều khoản\nđược nêu trong khế ước. Đánh giá độ tin cậy của trái phiếu bao gồm việc đánh giá bất kỳ\nđiều khoản bảo vệ nào có trong khế ước, nhưng bản thân xếp hạng tín dụng không phải là một yếu tố\ncủa khế ước .\n(Lựa chọn A) Hầu hết các khế ước bao gồm các giao ước bảo vệ người sở hữu trái phiếu bằng cách đặt ra\nhạn chế (ví dụ: giới hạn về cổ tức) và/hoặc các yêu cầu (ví dụ: duy trì giá trị ròng tối thiểu)\nvề tổ chức phát hành.\n(Lựa chọn C) Nhiều khế ước bao gồm các điều khoản dự phòng cho phép tổ chức phát hành và/hoặc\ncác chủ sở hữu trái phiếu lựa chọn thực hiện một số hành động (ví dụ: cho phép tổ chức phát hành rút lại trái phiếu trước\nngày đáo hạn).\nNhững điều cần nhớ:\nKhế ước trái phiếu là những hợp đồng nêu rõ các điều khoản và điều kiện liên quan đến việc hoàn trả khoản nợ\n. Một khế ước xác định quyền của người sở hữu trái phiếu, nghĩa vụ của người phát hành trái phiếu và\nngười được ủy thác để giám sát và thực thi việc tuân thủ hợp đồng của người phát hành. Nó cũng có thể\nbao gồm các giao ước bảo vệ hoặc các điều khoản dự phòng. Xếp hạng tín dụng không phải là một yếu tố của\nkhế ước trái phiếu.\nMô tả nội dung của khế ước trái phiếu và đối chiếu các giao ước khẳng định và phủ định.\nLOS","qhtml":null},{"n":88,"q":"All else being equal, for an issuer selling 10-year bonds, which of the following most\nlikely requires the highest yield at issuance? A bond that is:","opts":["putable.","callable.","convertible."],"ans":"B","expl":"Trái phiếu có điều khoản dự phòng kết hợp dòng tiền của hợp đồng nợ với quyền chọn\nđược gọi là một tùy chọn nhúng. Ba ví dụ phổ biến là:\ntrái phiếu có thể thu hồi, mà người phát hành có thể thu hồi trước khi đáo hạn,\ntrái phiếu có thể bán lại mà người nắm giữ có thể buộc nhà phát hành mua lại trước khi đáo hạn và\ntrái phiếu chuyển đổi mà người nắm giữ có thể đổi lấy cổ phiếu phổ thông của tổ chức phát hành.\nViệc sở hữu một quyền chọn mang lại lợi thế, do đó giá thực tế của trái phiếu đó phản ánh\nbất kỳ đối tác nào đang ngầm \"trả tiền\" cho tùy chọn được nhúng. Vì tổ chức phát hành phải\ntrả quyền thu hồi trái phiếu sớm thì tổ chức phát hành sẽ bồi thường cho nhà đầu tư bằng cách bán trái phiếu\ntrái phiếu ở mức giá thực tế thấp hơn và lãi suất cao hơn trái phiếu không thể thu hồi tương đương (ví dụ:\ntrái phiếu có thể chuyển đổi, có thể chuyển đổi).\n(Lựa chọn A và C) Trong trái phiếu chuyển đổi và trái phiếu có thể chuyển đổi, nhà đầu tư sở hữu quyền chọn. Nhà đầu tư\nphải trả cho người phát hành một mức giá thực tế cao hơn cho những quyền đó, điều này được phản ánh bằng lợi tức thấp hơn\nso với trái phiếu không chứa các quyền chọn đó.\nNhững điều cần nhớ:\nGiá thực tế của trái phiếu có kèm theo quyền chọn phản ánh ngầm đối tác\n\"trả tiền\" cho tùy chọn được nhúng. Đối với trái phiếu có thể thu hồi, tổ chức phát hành phải trả cho người nắm giữ trái phiếu số tiền\nquyền chọn mua, dẫn đến giá trái phiếu hiệu quả thấp hơn và lợi tức trái phiếu có thể mua lại cao hơn\ntrái phiếu được so sánh với các trái phiếu chuyển đổi hoặc trái phiếu có thể chuyển đổi không thể thu hồi tương tự.\nMô tả cấu trúc dòng tiền chung của các công cụ có thu nhập cố định và dòng tiền tương phản\ndự phòng có lợi cho tổ chức phát hành và nhà đầu tư.\nLOS","qhtml":null},{"n":89,"q":"Arbitrage most likely contributes to market efficiency by reducing:","opts":["price differences from relative fair value.","the amount of speculative trading activity.","risk so expected profits converge with the risk-free rate."],"ans":"A","expl":"Các loại chênh lệch giá\nChuyên chênh lệch giá\nGiá không chênh lệch giá\ngiao dịch\nMua một cái\nGiá tài sản Không có sự khác biệt Thị trường và bán ở\ncái khác\nGiá tài sản Chênh lệch giá bằng Đối lập\nso với chi phí/lợi ích của các vị thế trong tài sản\ngiá phái sinh nắm giữ tài sản và công cụ phái sinh\nGiao dịch chênh lệch giá kiếm được lợi nhuận bằng cách tận dụng chênh lệch giá giữa các công cụ\ncó liên quan (ví dụ: hợp đồng tương lai và tài sản cơ bản). Giao dịch chênh lệch giá thu hẹp\nnhững khác biệt đó, khiến giá phản ánh giá trị hợp lý tương đối và đảm bảo rằng thị trường\nhiệu quả ở mức hợp lý.\nLợi nhuận chênh lệch giá không rủi ro này được khóa bằng cách đồng thời nhập các vị thế bù trừ (ví dụ: mua và\nbán) trong các danh mục đầu tư tương đương. Các ví dụ bao gồm:\nmua và bán cùng một tài sản giao dịch ở các thị trường khác nhau với các mức giá khác nhau hoặc\nmua (bán khống) một tài sản và bán khống (mua) giá trị tổng hợp tương đương trong\nthị trường phái sinh.\nKhông nên nhầm lẫn giá trị hợp lý tương đối với giá trị nội tại. Sự khác biệt giữa giá và\ngiá trị nội tại, được thúc đẩy bởi tâm lý nhà đầu tư hoặc các ước tính khác nhau về lợi nhuận trong tương lai, không\ncho thấy cơ hội kinh doanh chênh lệch giá.\n(Lựa chọn B) Các nhà đầu cơ được thúc đẩy bởi nhận thức về giá khác với giá trị nội tại\n. Do đó, lượng giao dịch đầu cơ thường không bị ảnh hưởng bởi hoạt động kinh doanh chênh lệch giá.\nHơn nữa, hiệu quả thị trường thường được nâng cao nhờ hoạt động đầu cơ tăng lên, do đó\ngiảm đầu cơ sẽ làm giảm hiệu quả thị trường.\n(Lựa chọn C) Tài sản được định giá theo giá trị hợp lý tương đối không phải là khoản đầu tư không có rủi ro. Giao dịch ở mức\ngiá trị hợp lý có nghĩa là lợi nhuận kỳ vọng của một tài sản là khoản bù đắp hợp lý cho rủi ro đã gánh chịu. Đối với hầu hết tài sản\n, đây không phải là tỷ lệ không có rủi ro.\nNhững điều cần nhớ:\nChuyên đăng quảng cáo góp phần nâng cao hiệu quả thị trường bằng cách buộc giá tài sản hội tụ về giá trị hợp lý\ntương đối của chúng. Thị trường hiệu quả là thị trường trong đó lợi nhuận kỳ vọng của tài sản thể hiện sự đền bù công bằng\ncho rủi ro khi nắm giữ chúng.\nSo sánh việc sử dụng công cụ phái sinh giữa các tổ chức phát hành và nhà đầu tư\nLOS","qhtml":null},{"n":90,"q":"A private equity fund operates with a hard hurdle of 6% and a 20% performance fee. The\nfirm draws down its €200 million initial investment to purchase a portfolio company. Three\nyears later, the portfolio company is sold for €280 million. If the firm operated with a soft\nhurdle instead of a hard hurdle, the additional performance fees (in € millions) that the GP\nwould earn is closest to:","opts":["2.4","7.6","12.8"],"ans":"B","expl":"Quỹ tài sản thay thế có thể sử dụng nhiều cấu trúc để tính phí. Một lựa chọn là các quỹ nên\nđặt tỷ lệ vượt rào , là tỷ suất lợi nhuận tối thiểu mà các nhà quản lý quỹ phải đạt được cho\nnhà đầu tư trước khi họ bắt đầu kiếm được phí hiệu suất .\nTỷ lệ vượt rào cứng cho phép các nhà quản lý quỹ kiếm được phí hiệu suất chỉ trên lợi nhuận\nlớn hơn tỷ lệ ngưỡng .\nTỷ lệ vượt rào mềm cho phép nhà quản lý quỹ kiếm được phí hiệu suất trên toàn bộ lợi nhuận .\nChúng cũng cho phép các nhà quản lý quỹ thu hồi phí sau khi các đối tác hữu hạn (LP)\nđã được thanh toán.\nTrong câu hỏi này, quỹ đã đạt được 80 triệu euro (= 280 triệu euro − 200 triệu euro), hoặc 40%\n1,063\nlợi nhuận. Con số này vượt quá ngưỡng cản 19,1% (= − 1), do đó, đối tác chung (GP)\nđược hưởng phí hiệu suất. Để tìm ra sự khác biệt giữa phí hiệu suất theo tỷ lệ rào cản cứng\nvà rào cản mềm, cả hai đều phải được tính toán:\nNgoài ra, phí hiệu suất theo rào cản mềm có thể được tính là 80,0 × 0,2 (=\n16,0). Chênh lệch giữa rào cản mềm và rào cản cứng là 7,6 triệu (= 16,0 − 8,4)\n(Lựa chọn A) 2.4 đặt sai tỷ lệ rào cản ở mức 6%, không tính đến\nlợi nhuận trong ba năm.\n(Lựa chọn C) 12.8 tính sai phí bắt kịp kiếm được theo tỷ lệ rào cản mềm như\nphí hiệu suất trên toàn bộ lợi nhuận.\nNhững điều cần nhớ:\nTỷ suất lợi nhuận vượt ngưỡng là tỷ suất lợi nhuận tối thiểu mà các nhà quản lý quỹ đạt được nhiều cho các nhà đầu tư\ntrước khi họ bắt đầu kiếm được phí hiệu suất. Tỷ lệ vượt rào cản cứng cho phép các nhà quản lý quỹ kiếm được\nphí thực hiện chỉ với lợi nhuận lớn hơn tỷ lệ vượt rào. Tỷ lệ rào cản mềm cho phép người quản lý quỹ\nthu được phí hiệu suất trên toàn bộ lợi nhuận.\nTính toán và diễn giải lợi nhuận đầu tư thay thế cả trước và sau phí\nLOS","qhtml":null}];
const CFG = {"title": "UWorld Mock Exam 2 — Session 2", "subtitle": "UWorld · CFA Level I · 90 câu · 2h15p", "minutes": 135, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  return sections;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
