ổ sung khi chấp nhận nó.\n(Lựa chọn B) Rủi ro phi hệ thống là duy nhất đối với mỗi công ty hoặc ngành và do đó\nkhông được chia sẻ bởi mọi tài sản trong một thị trường nhất định.\n(Lựa chọn C) Rủi ro phi hệ thống không được bao gồm trong hệ thống của tài sản rủi ro.\nNhững điều cần nhớ:\nRủi ro phi hệ thống là một tập hợp các rủi ro cụ thể vốn có của một công ty hoặc ngành riêng lẻ.\nCác nhà đầu tư hợp lý mong đợi được đền bù khi chấp nhận rủi ro hệ thống. Rủi ro phi hệ thống có thể\nđược giảm thiểu xuống gần bằng 0 trong một danh mục đầu tư được đa dạng hóa tốt, vì vậy các nhà đầu tư không nên mong đợi\nlợi nhuận bổ sung khi chấp nhận rủi ro này.\nGiải thích rủi ro hệ thống và phi hệ thống, bao gồm cả lý do tại sao nhà đầu tư không nên kỳ vọng nhận được\nlợi nhuận bổ sung khi chịu rủi ro phi hệ thống\nLOS","qhtml":null},{"n":27,"q":"Which of the following best describes an advantage of a conservative approach to working\ncapital management?","opts":["Avoiding rollover risk","Borrowing only as needed","Refinancing quickly if rates decline"],"ans":"A","expl":"Phạm vi tiếp cận vốn lưu động: thận trọng đến tích cực\nBảo thủ hung hăng\nTỷ lệ lớn nhất của dòng điện\nTỷ lệ tài sản lưu động nhỏ nhất so với\ntài sản để bán\nbán hàng\nSử dụng lâu dài hơn\nMô tả\nÍt sử dụng nguồn vốn dài hạn hơn và\ntài trợ và ít hiện tại hơn\nthêm các khoản nợ ngắn hạn\nnợ phải trả\nGiảm rủi ro tái đầu tư\nGiảm tiền mặt ngắn hạn\nChỉ vay khi cần thiết; giảm\nnhu cầu dịch vụ nợ\ntổng nợ\nTính linh hoạt cao hơn từ kích thước lớn hơn\nChính\nChi phí nợ và vốn cổ phần thấp hơn\n\"đệm tiền mặt\"\nlợi thế\nThêm cơ hội tái cấp vốn\nSự chắc chắn hơn về tài chính\nÍt hạn chế hơn trong hoạt động\nchi phí và vốn lưu động\nnhu cầu\nKhông có khả năng vay chỉ như\nRủi ro tái đầu tư làm tăng nguy cơ phá sản\ncần thiết; tăng tổng nợ\nrủi ro\nChi phí nợ cao hơn và\nÍt linh hoạt hơn từ \"tiền mặt\" nhỏ hơn\nvốn chủ sở hữu\nđệm\"\nVị thế tài chính của tòa nhà chính\nCó thể cần sử dụng giao dịch tốn kém hơn\nnhược điểm\nmất nhiều thời gian hơn\ntín dụng, hạn chế tín dụng của khách hàng, hoặc\nÍt cơ hội tái cấp vốn\nbán các khoản phải thu\nNợ dài hạn có thể tăng\nChi phí tài chính không chắc chắn hơn\nhạn chế hoạt động\nQuản lý vốn lưu động và thanh khoản nhằm mục đích nâng cao giá trị của một công ty bằng cách\nđảm bảo đủ kinh phí cho các hoạt động và nghĩa vụ hàng ngày. Các doanh nghiệp có thể thực hiện khác nhau\ncác cách tiếp cận cơ cấu tài chính để hỗ trợ tài sản ngắn hạn , từ\nbảo thủ đến hung hăng.\nCách tiếp cận thận trọng kết hợp số lượng tài sản lưu động lớn hơn và ít phụ thuộc hơn\nvề tài trợ ngắn hạn. Cách tiếp cận này có thể được theo đuổi bởi:\ncác công ty đang trong giai đoạn đầu tăng trưởng, thiếu khả năng tiếp cận nợ ngắn hạn và\ncác công ty trưởng thành, có khả năng chuyển chi phí tài chính cao hơn sang khách hàng.\nNợ dài hạn làm tăng tính ổn định và linh hoạt tài chính bằng cách hạn chế tiếp xúc với thị trường\ngián đoạn, cung cấp chi phí dễ dự đoán hơn và giảm bớt sự không chắc chắn về vốn lưu động\nnhu cầu. Nguồn tài trợ lâu dài này cũng làm giảm rủi ro tái đầu tư: bị buộc phải tái cấp vốn ngắn hạn\nnợ có kỳ hạn trong thời kỳ thị trường hỗn loạn và do đó phát sinh lãi suất cao hơn.\nTuy nhiên, cách tiếp cận thận trọng hơn có xu hướng tốn kém hơn vì nợ dài hạn\nthường có lãi suất cao hơn. Ngoài ra, công ty không chỉ có khả năng vay\nkhi cần thiết và có thể phải chịu mức nợ lớn hơn nguồn vốn thực tế của nó\nnhu cầu (Lựa chọn B).\n(Lựa chọn C) Khả năng tái cấp vốn nhanh chóng gắn liền với các phương pháp tích cực,\ndựa nhiều vào nguồn tài trợ ngắn hạn và có thể tận dụng việc giảm lãi suất bằng cách\nchuyển đổi công cụ nợ\nNhững điều cần nhớ:\nMột cách tiếp cận thận trọng để quản lý vốn lưu động kết hợp một lượng lớn vốn lưu động hiện tại\ntài sản và ít phụ thuộc hơn vào nguồn tài chính ngắn hạn. Cách tiếp cận này làm tăng tài chính\nổn định trong thời gian gián đoạn và giảm rủi ro tái đầu tư, nhưng nó cũng đắt hơn và không\nkhông cho phép công ty chỉ vay khi cần thiết.\nMô tả mục tiêu của tổ chức phát hành và so sánh các phương pháp quản lý vốn lưu động và thanh khoản\nLOS","qhtml":null},{"n":28,"q":"Shares are least likely to be bought on margin for:","opts":["exchange-traded funds.","open-end mutual funds.","closed-end mutual funds."],"ans":"B","expl":"Giao dịch trao đổi mở\nĐặc điểm Quỹ đóng\nquỹ tương hỗ (ETF)\nPhát hành liên tục Số lượng cố định Phát hành liên tục\nCổ phiếu\nvà cổ phiếu mua lại phát hành và mua lại\nMua và mua lại Giao dịch trao đổi Giao dịch trao đổi Nhà tài trợ quỹ giao dịch trao đổi\nĐịnh giá liên tục Liên tục Cuối ngày\nGiao dịch tại NAV Thường gần bằng NAV Thường giảm giá Có\nĐủ điều kiện để bán khống Có Có Không\nCó thể mua ký quỹ Có Có Không\nNAV = giá trị tài sản ròng\nMua chứng khoán ký quỹ có nghĩa là nhà đầu tư đang vay một phần giá mua\ntừ nhà môi giới. Nếu chứng khoán giảm giá trị dưới một điểm nhất định, nhà môi giới sẽ\nđưa ra lệnh gọi ký quỹ, yêu cầu nhà đầu tư ngay lập tức gửi thêm tiền mặt hoặc tài sản thế chấp\nkhác để bảo vệ khoản vay ký quỹ của nhà môi giới. Nếu nhà đầu tư không làm như vậy, người môi giới có thể bán\nchứng khoán trong ngày giao dịch và sử dụng số tiền thu được để đáp ứng khoản vay.\nQuy trình này không thể áp dụng với cổ phiếu của quỹ tương hỗ mở. Những cổ phiếu này được giao dịch\ntrực tiếp giữa nhà đầu tư và quỹ và chúng chỉ giao dịch một lần mỗi ngày sau khi thị trường\nđóng cửa và quỹ đã tính giá từng cổ phiếu. Cổ phiếu không thể được\nbán trong ngày giao dịch nếu chúng đang mất giá trị và yêu cầu thanh lý để đáp ứng yêu cầu ký quỹ\n. Do đó, cổ phiếu quỹ tương hỗ mở không thể được mua ký quỹ.\n(Lựa chọn A và C) Cổ phiếu của quỹ giao dịch trao đổi và quỹ tương hỗ đóng được\nmua và bán giữa các nhà đầu tư và giao dịch trên các sàn giao dịch giống như cổ phiếu riêng lẻ và\ntrái phiếu. Vì chúng có thể được giao dịch trong ngày giao dịch nên chúng có thể được mua ký quỹ.\nNhững điều cần nhớ:\nMua chứng khoán ký quỹ có nghĩa là nhà đầu tư đang vay một phần giá mua\ntừ nhà môi giới. Nếu cần, người môi giới có thể bán chứng khoán trong ngày giao dịch nếu chúng\ngiảm giá trị. Vì cổ phiếu quỹ tương hỗ mở chỉ được mua và bán sau khi\nngày giao dịch kết thúc nên chúng không thể được mua ký quỹ.\nMô tả các quỹ tương hỗ và so sánh chúng với các sản phẩm đầu tư gộp khác\nLOS","qhtml":null},{"n":29,"q":"A company is analyzing two mutually exclusive three-year projects with conventional cash\nflows:\nCash Flows (£ millions)\nYear 0 1 2 3 IRR\nProject A −60 12 30 55 22.2%\nProject B −80 60 45 5 24.3%\nIf the hurdle rate is 8% and there are no other cash flows, then based on the IRR and NPV\ncriteria, the best investment decision is to invest in:","opts":["A only.","B only.","both A and B."],"ans":"A","expl":"Tiêu chí NPV và IRR thường được sử dụng để đưa ra quyết định đầu tư vốn. Quy tắc chung\nlà chấp nhận một dự án nếu :\nNPV của dự án dương hoặc\nIRR của dự án lớn hơn tỷ suất lợi nhuận yêu cầu (tức là tỷ lệ vượt rào).\nĐối với các dự án độc lập có dòng tiền thông thường, NPV và IRR dẫn đến quyết định đầu tư\ngiống nhau. Khi một dự án có NPV dương, IRR sẽ luôn lớn hơn\ntỷ suất lợi nhuận yêu cầu của dự án và ngược lại.\nIRR và NPV có thể tạo ra thứ hạng xung đột khi các dự án loại trừ lẫn nhau (tức là\ncông ty chỉ có thể chấp nhận một dự án). NPV là tiêu chí tốt hơn IRR vì mô hình NPV:\nhiển thị lượng giá trị gia tăng cho công ty, trong khi IRR chỉ hiển thị tỷ suất lợi nhuận,\nkhông hiển thị giá trị gia tăng thực tế. Trong trường hợp này, Dự án B có IRR cao hơn (24,3%)\nchuyển thành NPV thấp hơn là 18,10 triệu bảng Anh (theo tính toán bên dưới).\nNPV càng lớn thì giá trị gia tăng cho công ty càng nhiều.\nsử dụng tỷ lệ tái đầu tư thận trọng hơn. Phân tích dòng tiền chiết khấu ngầm\ngiả định dòng tiền được tái đầu tư ở tỷ lệ chiết khấu, là tỷ lệ hoàn vốn\n(đối với NPV) hoặc IRR yêu cầu. Tỷ suất lợi nhuận yêu cầu là lợi nhuận có thể kiếm được từ\ndự án tương đương, do đó NPV phản ánh giả định tái đầu tư thực tế hơn.\nCông ty nên chọn Dự án A vì các dự án này loại trừ lẫn nhau và Dự án A\ncó NPV lớn hơn Dự án B.\n(Lựa chọn B) Dự án B có IRR cao hơn Dự án A nhưng NPV nhỏ hơn và NPV\nnên được sử dụng khi các dự án loại trừ lẫn nhau.\n(Lựa chọn C) Các dự án loại trừ lẫn nhau; do đó, chỉ có thể chọn một dự án.\nNhững điều cần nhớ:\nTiêu chí NPV và IRR được sử dụng để đưa ra quyết định đầu tư vốn, nhưng các tiêu chí này có thể\ntạo ra thứ hạng xung đột cho các dự án loại trừ lẫn nhau. Các công ty nên chọn\ndự án có NPV lớn nhất vì nó mang lại nhiều giá trị nhất cho công ty. Ngoài ra, phân tích NPV\nlà một tiêu chí tốt hơn vì nó sử dụng tỷ lệ tái đầu tư thận trọng hơn IRR.\nMô tả quy trình phân bổ vốn, tính giá trị hiện tại ròng (NPV), tỷ suất hoàn vốn nội bộ\n(IRR) và lợi tức trên vốn đầu tư (ROIC), đồng thời đối chiếu việc sử dụng chúng trong phân bổ vốn\nLOS","qhtml":null},{"n":30,"q":"If securities are issued in the structured finance sector, which of the following is most\nlikely the issuer?","opts":["A special legal entity holding a collateral pool of securitized assets.","A nonsovereign government imposing a special tax to repay a bond.","A business pledging operating assets it owns as collateral on a debt issue."],"ans":"A","expl":"Một cách để xác định các lĩnh vực thị trường có thu nhập cố định là theo loại tổ chức phát hành. Hầu hết các lĩnh vực phát hành\nbao gồm trái phiếu được bán bởi các tổ chức hiện có (ví dụ: chính phủ, tập đoàn) để tài trợ cho\ncác khoản đầu tư hoặc hoạt động đang diễn ra.\nTài chính có cấu trúc đề cập đến chứng khoán do các pháp nhân đặc biệt (SLE) phát hành để tài trợ cho việc mua\nmột danh mục tài sản. Dòng tiền của danh mục tài sản được sử dụng để trả\nlãi và gốc của chứng khoán do SLE phát hành.\nMột nhà tài trợ tổ chức SLE (ví dụ: quỹ tín thác) và sắp xếp việc chuyển tài sản (ví dụ:\nthế chấp, khoản vay mua ô tô) vào SLE để tạo ra một nhóm tài sản thế chấp (tức là danh mục tài sản). Đây là\nquy trình chứng khoán hóa tài sản; chứng khoán do SLE phát hành được gọi là chứng khoán\nđược bảo đảm bằng tài sản (ABS). Sau khi tài sản được chuyển sang SLE, SLE trở thành chủ sở hữu hợp pháp\nvà người cho vay ban đầu không còn có lợi ích kinh tế đối với tài sản đó nữa.\n(Lựa chọn B) Trái phiếu chính phủ không có chủ quyền được hoàn trả bằng doanh thu từ thuế đặc biệt là\nmột loại trái phiếu doanh thu. Những chứng khoán này là một loại công cụ nợ truyền thống và không phải\nthuộc lĩnh vực tài chính có cấu trúc.\n(Lựa chọn C) Nợ công ty với tài sản hoạt động được cầm cố làm tài sản thế chấp là một loại trái phiếu được bảo đảm\n. Trái phiếu có bảo đảm là một phần của khu vực doanh nghiệp vì chúng là nghĩa vụ trực tiếp của\ntập đoàn phát hành.\nNhững điều cần nhớ:\nTài chính có cấu trúc đề cập đến chứng khoán do một pháp nhân đặc biệt (SLE) phát hành để nắm giữ danh mục tài sản\n. Dòng tiền của danh mục tài sản được sử dụng để trả lãi và gốc cho\nchứng khoán do SLE phát hành. Những chứng khoán như vậy được gọi là chứng khoán đảm bảo bằng tài sản (ABS).\nMô tả các đặc điểm của chứng khoán có thu nhập cố định.\nLOS","qhtml":null},{"n":31,"q":"A feature of spot curves is that bond yields-to-maturity most likely assume that bonds are:","opts":["priced at par.","coupon bonds.","free of default risk."],"ans":"C","expl":"Các đường cong lợi suất khác nhau\nYTM của đường cong lợi tứcLợi suất cơ bản\nYTM của đường cong giao ngay trên trái phiếu không trả lãi định kỳ\nYTM của đường cong ngang giá nếu trái phiếu được định giá bằng mệnh giá\nYTM là lãi suất kỳ hạn ngụ ý liên kết lợi tức trái phiếu kỳ hạn ngắn hơn,\nLợi suất trái phiếu kỳ hạn 0 phiếu lãi với kỳ hạn dài hơn, không lãi suất\nlợi suất\nĐường cong lợi suất được xây dựng lý tưởng bằng cách sử dụng trái phiếu có cùng đặc điểm, chẳng hạn như\nnhư kỳ hạn, lãi suất và tần suất phiếu giảm giá, rủi ro tín dụng, thanh khoản, trạng thái thuế, v.v. Rất ít khả năng những trái phiếu phù hợp với tất cả các tiêu chí này sẽ có sẵn, vì vậy giải pháp thực tế nhất\nlà tạo đường cong giao ngay bằng cách sử dụng một loạt phiếu giảm giá không lãi suất của chính phủ trái phiếu có\nkỳ hạn khác nhau.\nĐây là giải pháp ưu tiên vì những trái phiếu này có nhiều đặc điểm chung: cùng một tổ chức phát hành,\ntính thanh khoản và trạng thái thuế. Vì là trái phiếu chính phủ nên chúng được giả định là không có rủi ro vỡ nợ và là trái phiếu không trả lãi định kỳ nên chúng không có rủi ro tái đầu tư.\nLưu ý rằng trái phiếu do bất kỳ chính phủ nào phát hành luôn có một số rủi ro vỡ nợ và một số\ntổ chức phát hành có chủ quyền có rủi ro cao hơn những tổ chức khác, nhưng người ta thường giả định rằng trái phiếu do\nchính phủ của một số quốc gia phát hành thực sự không có rủi ro vỡ nợ .\n(Lựa chọn A) Đường cong mệnh giá được thiết kế sao cho các trái phiếu được biểu thị bằng YTM tại mọi điểm\ncủa đường cong có giá ngang bằng. Giả định này không áp dụng cho các đường cong giao ngay.\n(Lựa chọn B) Đường cong giao ngay được biên soạn bằng cách sử dụng YTM của trái phiếu chính phủ không trả lãi.\nNhững điều cần nhớ:\nĐường cong giao ngay được bắt nguồn từ YTM của một loạt trái phiếu chính phủ không trả lãi.\nkhông chịu rủi ro vỡ nợ hoặc tái đầu tư. Không giống như đường cong mệnh giá, đường cong giao ngay không đưa ra bất kỳ\ngiả định nào về giá trái phiếu.\nSo sánh đường cong giao ngay, đường cong mệnh giá và đường cong kỳ hạn.\nLOS","qhtml":null},{"n":32,"q":"A company targeted for a private equity leveraged buyout (LBO) is most likely to be a:","opts":["public company with a depressed stock price.","private company with significant intangible assets.","private company that is efficiently managed and operated."],"ans":"A","expl":"Đặc điểm của các công ty mục tiêu LBO hấp dẫn\nGiá cổ phiếu bị suy giảm/bị định giá thấp\nBan quản lý và các cổ đông dễ chịu\nHoạt động kém hiệu quả\nDòng tiền mạnh mẽ và có thể dự đoán được\nĐòn bẩy thấp\nTài sản vật chất không bị cản trở\nViệc mua lại bằng đòn bẩy (LBO) xảy ra khi một công ty cổ phần tư nhân (PE) mua phần lớn cổ phiếu đang lưu hành của một công ty tư nhân hoặc công ty đại chúng và việc mua lại là\nđược tài trợ bằng một khoản nợ đáng kể . Bên đi vay là công ty\nđược mua lại, không phải công ty PE. Tài sản của công ty đóng vai trò là tài sản thế chấp cho khoản vay và dòng tiền\ncủa công ty trả lãi và gốc cho khoản nợ.\nDo tính chất đòn bẩy cao của giao dịch, việc lựa chọn công ty thận trọng là rất quan trọng đối với sự thành công của LBO. Bên mua lại tìm kiếm các công ty có thể:\ntrả nợ,\ncải thiện hiệu suất của họ và\ntăng giá trị của họ.\nCác công ty đại chúng thường là mục tiêu của LBO . Bằng cách nhắm mục tiêu vào các công ty có\ngiá cổ phiếu thấp (tức là cổ phiếu bị định giá thấp), công ty PE có thể cơ cấu thỏa thuận ở mức\ncao hơn giá thị trường hiện tại, do đó lôi kéo các cổ đông hiện hữu bán trong khi vẫn\ntrả ít hơn giá trị nội tại cho công ty. Khi hiệu suất của công ty được cải thiện\nvà giá trị của nó tăng lên, công ty sẽ được bán lại trên thị trường đại chúng hoặc cho những người mua chiến lược.\n(Lựa chọn B) Tài sản vô hình rất khó định giá và sử dụng làm tài sản thế chấp. Tài sản vật chất\nkhông bị cản trở (tức là không phải tài sản vô hình) có thể được sử dụng làm tài sản thế chấp cho khoản vay làm cho công ty\nhấp dẫn hơn với tư cách là mục tiêu LBO.\n(Lựa chọn C) Các công ty PE gia tăng giá trị bằng cách cải thiện hiệu quả của các công ty được quản lý\nkém hiệu quả, do đó nâng cao giá trị của họ.\nNhững điều cần nhớ:\nAn Công ty mục tiêu hấp dẫn trong một thương vụ mua lại có đòn bẩy là công ty có thể trả nợ, cải thiện\nkết quả hoạt động và tăng giá trị của nó. Các đặc điểm chính là giá cổ phiếu bị định giá thấp,\nquản lý và cổ đông dễ chịu, hoạt động kém hiệu quả, dòng tiền\nmạnh mẽ và có thể dự đoán được, đòn bẩy thấp và tài sản vật chất không bị cản trở.\nGiải thích các đặc điểm của vốn cổ phần tư nhân và các đặc điểm đầu tư của nó\nLOS","qhtml":null},{"n":33,"q":"A trader buys a company's stock on margin and sells it after one year, with the following\nrelevant information:\nShares purchased 100\nPurchase price $45\nSale price $60\nDividend $1\nCommission (per share, on both purchases and sales) $0.05\nMargin requirement 50%\nIgnoring interest costs, and assuming dividends were paid on the sale date, the return on the\ntransaction is closest to:","opts":["36%","67%","71%"],"ans":"C","expl":"Các nhà giao dịch thường vay tiền (tức là mua bằng tiền ký quỹ) để tài trợ cho việc mua tài sản .\nKhoản vay ký quỹ là số tiền được vay, được kết hợp với vốn riêng của nhà giao dịch\ncung cấp sự công bằng. Lợi nhuận đòn bẩy của vị thế là lợi nhuận ròng (lỗ), được biểu thị bằng\nphần trăm của số tiền chi ban đầu .\nLợi nhuận ròng (lỗ) là sự thay đổi về giá sau khi tính đến cổ tức, tiền lãi và\nchi phí giao dịch, bao gồm hoa hồng mua hàng và hoa hồng bán hàng.\nChi phí ban đầu bao gồm khoản đầu tư vốn cổ phần của nhà giao dịch vào vị thế đòn bẩy, cộng với\nchi phí giao dịch (ví dụ: hoa hồng khi mua hàng).\nTrong trường hợp này, tỷ lệ ký quỹ là 50% do nhà giao dịch trả một nửa tổng số tiền đầu tư.\nđiều này dẫn đến tỷ lệ đòn bẩy là 2, do đó nhà giao dịch có được một vị thế có giá trị gấp đôi số vốn sở hữu\nđã đầu tư. Lợi nhuận từ cổ phiếu, chia cho chi phí ban đầu, dẫn đến lợi nhuận có đòn bẩy là 71%.\nĐiều này minh họa sức mạnh của đòn bẩy: nếu nhà giao dịch đã đóng góp toàn bộ chi phí đầu tư\n, thì lợi nhuận sẽ chỉ là 1.590 / 4.500 ≈ 35,3% (Lựa chọn A) .\n(Lựa chọn B) Lợi nhuận của 67% là kết quả của việc loại trừ cổ tức và chi phí giao dịch khỏi\ntính toán.\nNhững điều cần nhớ:\nLợi tức của nhà đầu tư đối với giao dịch ký quỹ là lợi nhuận ròng (lỗ), được biểu thị bằng phần trăm của\nchi tiêu ban đầu của chính nhà đầu tư. Lợi nhuận (lỗ) ròng là lợi nhuận (lỗ) của nhà đầu tư sau khi hạch toán\ncổ tức, lãi và chi phí giao dịch. Chi phí ban đầu là vốn đầu tư\ncủa nhà đầu tư cộng với mọi khoản hoa hồng khi mua hàng.\nTính toán và diễn giải tỷ lệ đòn bẩy, tỷ suất lợi nhuận trên một giao dịch ký quỹ và\ngiá chứng khoán mà nhà đầu tư sẽ nhận được lệnh gọi ký quỹ\nLOS","qhtml":null},{"n":34,"q":"An index starts with a value of 100 and has the following returns over 3 years:\nPrice Appreciation Income\nYear 1 4.0% 2.0%\nYear 2 8.0% 1.5%\nYear 3 −4.0% 2.0%\nIf the index value is based on its total return, then its value at the end of Year 3 is closest to:","opts":["113.50","113.75","113.87"],"ans":"B","expl":"Giá trị ban đầu của chỉ mục được quyết định khi bắt đầu chỉ mục. Theo thời gian , giá trị\ncủa chỉ mục sẽ thay đổi theo kết quả trả về của nó . Lợi nhuận của một chỉ số có thể được tính bằng cách sử dụng lợi nhuận giá\nhoặc tổng lợi nhuận của nó.\nLợi nhuận về giá phản ánh sự thay đổi giá của từng chứng khoán cấu thành.\nTổng lợi nhuận phản ánh cả sự thay đổi giá và thu nhập từ cổ tức hoặc lãi của từng\nchứng khoán cấu thành.\nGiá trị của một chỉ số sau nhiều kỳ lợi nhuận được tính bằng\nthe Lợi nhuận được liên kết hình học (tức là gộp), vì giá trị của nó trong mỗi kỳ\nphụ thuộc vào giá trị của nó và lợi nhuận trong các kỳ trước. Khi tính toán tổng lợi nhuận, mức tăng giá\nvà thu nhập được cộng thêm (không gộp) trong một khoảng thời gian nhất định vì chúng xảy ra\ntrong cùng khoảng thời gian.\nTrong câu hỏi này, giá trị của chỉ số vào cuối Năm 3 là 113,75: 100(1,06)(1,095)\n(0,98). Giá trị theo thời gian được hiển thị trong hình ảnh bên dưới:\n(Lựa chọn A) 113,50 là kết quả của việc tính tổng, thay vì gộp, lợi nhuận hàng năm.\n(Lựa chọn C) 113,87 là kết quả của việc gộp, thay vì cộng, lợi nhuận hàng năm từ\nsự tăng giá và thu nhập.\nNhững điều cần nhớ:\nThe giá trị của một chỉ mục theo sau nhiều giai đoạn trả về phải được tính dưới dạng kết quả trả về\nđược liên kết hình học (tức là gộp). Chỉ số tổng lợi nhuận phản ánh cả lợi nhuận\ntừ việc tăng giá và thu nhập. Các khoản này được cộng chứ không phải gộp trong một khoảng thời gian nhất định\nvì chúng xảy ra trong cùng một khoảng thời gian.\nTính toán và giải thích giá trị, lợi nhuận của giá và tổng lợi nhuận của một chỉ số\nLOS","qhtml":"<p>An index starts with a value of 100 and has the following returns over 3 years:</p><table class=\"qtable\"><thead><tr><th></th><th>Price Appreciation</th><th>Income</th></tr></thead><tbody><tr><td>Year 1</td><td>4.0%</td><td>2.0%</td></tr><tr><td>Year 2</td><td>8.0%</td><td>1.5%</td></tr><tr><td>Year 3</td><td>−4.0%</td><td>2.0%</td></tr></tbody></table><p>If the index value is based on its total return, then its value at the end of Year 3 is closest to:</p>"},{"n":35,"q":"Derivative pricing uses the assumption of risk neutrality since derivatives:","opts":["can be replicated.","are expected to return the risk-free rate.","are priced at a discount to the underlying asset to offset the derivatives' greater risk."],"ans":"A","expl":"Khái niệm định giá phái sinh\nNhà giao dịch lợi dụng bất kỳ hành vi định giá sai nào của\nphái sinh\nCác chiến lược không rủi ro được tạo ra từ việc bù đắp\ncác vị trí không có chênh lệch giá\ntrong các công cụ phái sinh và tài sản cơ bản\nCác chiến lược được theo đuổi cho đến khi lợi nhuận không có rủi ro được\nloại bỏ (tức là định giá không có chênh lệch giá)\nCác công cụ phái sinh có thể được tạo tổng hợp từ\ntài sản cơ bản và không có rủi ro\nSao chép\nCác vị thế tương đương phải có cùng kỳ vọng\nlợi nhuận\nGiá phái sinh phản ánh giá trị của chiến lược sao chép\n\nCác vị trí không rủi ro được tạo từ mua/bán\nTrung lập rủi ro\ncác chiến lược phái sinh và sao chép\nCác vị thế không rủi ro kiếm được tỷ suất lợi nhuận không rủi ro;\ndòng tiền được chiết khấu ở mức lãi suất không rủi ro\nSao chép và kinh doanh chênh lệch giá là nền tảng của định giá phái sinh. Các nhà đầu tư có thể tái tạo tài sản\nbằng cách kết hợp các vị thế trong công cụ phái sinh và tài sản không rủi ro. Các vị thế\ntương đương về mặt kinh tế nên giao dịch ở mức giá mang lại lợi nhuận như nhau. Nếu điều kiện đó không được giữ, thì hoạt động chênh lệch giá sẽ xảy ra cho đến khi giá điều chỉnh để không thể kiếm được lợi nhuận phi rủi ro nữa.\nDo đó, các công cụ phái sinh giao dịch ở mức giá không có chênh lệch giá.\nTrong các điều kiện định giá này, nhà đầu tư có thể tạo các vị thế không rủi ro (ví dụ: chỉ số chứng khoán mua\nvà hợp đồng tương lai chỉ số cổ phiếu bán khống), kiếm được tỷ suất lợi nhuận không rủi ro. Khả năng tạo\ncác vị thế không rủi ro và định giá không có chênh lệch giá có nghĩa là việc tránh rủi ro không có vai trò gì trong việc định giá\nphái sinh. Do đó, tính trung lập rủi ro của nhà đầu tư được giả định trong việc định giá phái sinh .\n(Lựa chọn B) Vì vị thế mua hoặc bán trong chứng khoán phái sinh không phải là không có rủi ro nên lợi nhuận kỳ vọng của nó\nsẽ không bằng lãi suất phi rủi ro. Chứng khoán không có rủi ro (ví dụ: tín phiếu kho bạc của chính phủ) có\nlợi nhuận kỳ vọng bằng lãi suất không có rủi ro.\n(Lựa chọn C) Các công cụ phái sinh có thể giao dịch ở mức chiết khấu hoặc cao hơn so với tài sản cơ sở và vẫn\nđược định giá khá cao. Bất kỳ sự khác biệt nào giữa giá cơ bản và giá phái sinh đều phản ánh chi phí thực hiện\nđịnh giá chênh lệch giá, chứ không phải sự điều chỉnh cho mức độ rủi ro tương đối.\nNhững điều cần nhớ:\nNhà đầu tư có thể tái tạo tài sản bằng cách sử dụng các công cụ phái sinh và tài sản không rủi ro, đồng thời họ cũng có thể\ntạo các vị thế không rủi ro bằng cách sử dụng các công cụ phái sinh và tài sản cơ bản. Do đó, việc định giá\nphái sinh dựa trên việc định giá không có chênh lệch giá. Vì chiến lược chênh lệch giá là không có rủi ro nên nhà đầu tư\ntính trung lập với rủi ro được giả định khi định giá phái sinh.\nGiải thích cách sử dụng các khái niệm chênh lệch giá và sao chép trong định giá phái sinh\nLOS","qhtml":null},{"n":36,"q":"According to the Efficient Market Hypothesis, if a market is semi-strong form efficient, active\nmanagement's net-of-fees returns to investors are most likely :","opts":["less than passive management's.","equivalent to passive management's.","greater than passive management's."],"ans":"A","expl":"Giả thuyết Thị trường Hiệu quả (EMH) chỉ ra ba dạng hiệu quả của thị trường: yếu, bán\nmạnh và mạnh. Hiệu quả của thị trường được xác định bằng mức độ nhanh chóng và đầy đủ\nthông tin được phản ánh trong giá tài sản. Nếu thị trường thực sự hiệu quả, thì không thể đạt được lợi nhuận bất thường\ntrên cơ sở nhất quán với thông tin có sẵn.\nDạng hiệu quả bán mạnh giả định rằng giá tài sản phản ánh tất cả dữ liệu thị trường trong lịch sử\ncộng với tất cả thông tin có sẵn công khai (ví dụ: thông tin báo cáo tài chính). Thông tin công khai\nmới nhanh chóng được tính vào giá cả, do đó, nhà quản lý đầu tư không thể\ntận dụng các sự kiện như thu nhập bất ngờ để đạt được lợi nhuận bất thường.\nQuản lý danh mục đầu tư chủ động thường sử dụng giao dịch thường xuyên hơn để khai thác những sự thiếu hiệu quả\nđược nhận thấy. Do đó, quản lý tích cực phải chịu chi phí giao dịch và thu thập thông tin\ncao hơn so với quản lý thụ động, thay vào đó tìm cách tái tạo hiệu suất của thị trường\nhoặc một chỉ số. Kết quả là, khi một thị trường thực sự ở dạng bán mạnh ở dạng hiệu quả, lợi nhuận ròng\nthu nhập từ quản lý thụ động trung bình sẽ tốt hơn\nquản lý danh mục đầu tư chủ động với chi phí cao hơn (Lựa chọn B và C).\nNhững điều cần nhớ:\nDưới dạng bán mạnh của Giả thuyết thị trường hiệu quả (EMH), tất cả đều có sẵn công khai\nthông tin được phản ánh trong giá thị trường tài sản. EMH dạng bán mạnh ngụ ý rằng vì\nquản lý chủ động phải chịu chi phí giao dịch cao hơn nên quản lý thụ động sẽ hoạt động tốt hơn\nphí ròng.\nGiải thích ý nghĩa của từng hình thức hiệu quả thị trường đối với phân tích cơ bản, phân tích kỹ thuật\n và lựa chọn giữa quản lý danh mục đầu tư chủ động và thụ động\nLOS","qhtml":null},{"n":37,"q":"An incumbent company with strong pricing power is most likely to be in an industry that\nexhibits a:","opts":["low degree of industry concentration and stable market share.","high degree of industry concentration and stable market share.","high degree of industry concentration and unstable market share."],"ans":"B","expl":"Các nhà đầu tư sử dụng phân tích chiến lược ngành để hiểu và đánh giá khả năng cạnh tranh của một ngành\n. Phân tích chiến lược ngành bao gồm phân tích những yếu tố sau:\nRào cản gia nhập: mức độ dễ dàng đối với các đối thủ mới gia nhập ngành\nSự tập trung: số lượng người chơi trong một ngành và thị phần tương đối của họ\nNăng lực: số lượng hàng hóa hoặc dịch vụ có thể được cung cấp dựa trên khoản đầu tư\nhiện tại so với nhu cầu của ngành\nSự ổn định của thị phần: mức độ biến động trong thị phần của đối thủ cạnh tranh\nSức mạnh định giá mạnh của các công ty hiện tại có liên quan nhiều nhất (với các ngoại lệ) với các ngành\ncó rào cản gia nhập lớn hơn, mức độ tập trung ngành cao , năng lực ngành hạn chế,\nvà phân phối thị phần ổn định.\nTrong các ngành tập trung cao độ (ví dụ: nước giải khát), đối thủ cạnh tranh thường có khả năng\nđiều phối các biến động giá tốt hơn và mất nhiều hơn là thu được từ giá cả cạnh tranh. Sự phân bổ thị phần\nổn định thường cho thấy rằng các đối thủ cạnh tranh có các sản phẩm khác biệt hoặc\ncơ sở khách hàng \"dính\" do lòng trung thành với thương hiệu hoặc chi phí chuyển đổi khách hàng cao (ví dụ: các nhà cung cấp dịch vụ viễn thông\nkhông dây). Điều này cho phép các đối thủ cạnh tranh duy trì giá.\n(Lựa chọn A) Các ngành có mức độ tập trung ngành thấp thường có sự cạnh tranh khốc liệt\n(đặc biệt là giữa các công ty nhỏ hơn đang tìm cách giành thị phần), điều này làm suy yếu\nsức mạnh định giá của các công ty truyền thống.\n(Lựa chọn C) Thị phần không ổn định thường cho thấy chi phí chuyển đổi khách hàng thấp, điều này\nbuộc các công ty truyền thống phải phù hợp giá của đối thủ cạnh tranh hoặc mối đe dọa cao từ những người mới tham gia với\nlợi thế công nghệ. Những phẩm chất này làm suy yếu sức mạnh định giá của các công ty truyền thống.\nNhững điều cần nhớ:\nCác nhà đầu tư sử dụng phân tích chiến lược ngành để hiểu và đánh giá khả năng cạnh tranh của một ngành\n. Quyền định giá lớn hơn của các doanh nghiệp hoạt động chủ yếu gắn liền với các ngành có\nrào cản gia nhập lớn hơn, mức độ tập trung ngành cao, năng lực ngành thấp và thị phần ổn định.\nPhân tích cấu trúc của một ngành và những ảnh hưởng bên ngoài bằng cách sử dụng Năm lực lượng và PESTLE\nkhuôn khổ\nLOS","qhtml":null},{"n":38,"q":"An analyst has compiled the following pricing data on a commodity:\nPrices in ¥\nSpot 700\n1-month futures 750\n2-month futures 800\n3-month futures 870\n4-month futures 930\n5-month futures 950\n6-month futures 990\nThe commodity's forward curve is best described as:","opts":["being in backwardation.","having negative roll yield.","reflecting a convenience yield that exceeds storage costs."],"ans":"B","expl":"Ba nguồn lợi nhuận cho hợp đồng tương lai hàng hóa là lãi suất cuộn, lãi suất tài sản thế chấp và\nsự thay đổi của giá giao ngay. Lợi suất cuộn là lợi nhuận (dương hoặc âm) xảy ra khi\ngiá tương lai của hàng hóa hội tụ với giá giao ngay (hoặc hợp đồng tương lai tiếp theo) khi\nhợp đồng sắp hết hạn. Hình dạng của đường cong kỳ hạn của hàng hóa đóng\nvai trò quan trọng trong việc xác định lợi nhuận cuộn.\nContango xảy ra khi đường cong kỳ hạn dốc lên vì giá tương lai\nlớn hơn giá giao ngay. Khi hợp đồng tương lai \"giảm\" xuống mức giá giao ngay thấp hơn,\nlợi suất cuộn là âm đối với một nhà giao dịch có vị thế mua tương lai, như trong trường hợp này.\nSự bù trừ xảy ra khi đường cong kỳ hạn dốc xuống do giá tương lai\nthấp hơn giá giao ngay. Khi hợp đồng tương lai \"tăng\" lên mức giá giao ngay cao hơn,\nlợi suất cuộn là dương đối với một nhà giao dịch có vị thế mua tương lai (Lựa chọn A) .\n(Lựa chọn C) Đường cong kỳ hạn trong contango là kết quả của lợi tức tiện lợi thấp hơn\nso với chi phí lưu trữ.\nNhững điều cần nhớ:\nLợi suất cuộn là lợi nhuận (dương) hoặc âm) xảy ra khi giá tương lai hội tụ với\ngiá giao ngay khi hợp đồng tương lai sắp hết hạn. Khi đường cong kỳ hạn hướng lên\ndốc và trong tình trạng bù hoãn mua, lợi nhuận cuộn là âm đối với một nhà giao dịch có vị thế mua tương lai.\nGiải thích các đặc điểm của đất thô, đất rừng và đất nông nghiệp cũng như đặc điểm đầu tư của chúng\nLOS","qhtml":null},{"n":39,"q":"For European options, the difference between put-call parity and put-call-forward parity\nis most likely that the forward contract:","opts":["replaces the risk-free bond.","replaces the strike price of the call option.","is combined with a risk-free bond to replace the asset."],"ans":"C","expl":"Tính chẵn lẻ của cuộc gọi đặt trước tạo thành nền tảng của tính chẵn lẻ của cuộc gọi chuyển tiếp. Tính chẵn lẻ của quyền chọn bán khẳng định rằng\nmột quyền chọn bán bảo vệ và quyền chọn ủy thác được xây dựng bằng các quyền chọn Châu Âu trên cùng một tài sản\ncơ bản và có cùng giá thực hiện và ngày hết hạn sẽ có cùng mức hoàn trả; do đó, tại bất kỳ thời điểm nào\ntrước ngày đáo hạn, các giá trị của quyền chọn bán bảo vệ và quyền chọn ủy thác đều bằng nhau.\nTrong tính chẵn lẻ của quyền chọn bán chuyển tiếp, danh mục đầu tư quyền chọn bán bảo vệ được tạo bằng cách thay thế\ncơ bản bằng một tài sản tổng hợp tương đương ( S ). Tài sản tổng hợp bao gồm một hợp đồng kỳ hạn\nvà một trái phiếu không lãi suất không rủi ro có mệnh giá bằng với giá kỳ hạn\ncủa tài sản. Việc ký kết hợp đồng kỳ hạn không tốn phí gì, vì vậy giá trị của tài sản\ntổng hợp tại Thời điểm 0 chỉ đơn giản là giá trị hiện tại của trái phiếu kỳ hạn.\nKhi hết hạn, giá trị của trái phiếu kỳ hạn không trả lãi có thể được sử dụng để mua\ntài sản cơ bản bằng cách thực hiện hợp đồng kỳ hạn.\n(Lựa chọn A) Hợp đồng kỳ hạn không thay thế trái phiếu không rủi ro. Trên thực tế, nó yêu cầu\nbổ sung trái phiếu không rủi ro vào danh mục đầu tư bảo vệ.\n(Lựa chọn B) Hợp đồng kỳ hạn là một phần của danh mục đầu tư quyền chọn bán bảo vệ, không phải danh mục quyền chọn mua ủy thác\n. Do đó, hợp đồng kỳ hạn không thay thế giá thực hiện của quyền chọn mua.\nNhững điều cần nhớ:\nTính chẵn lẻ của cuộc gọi chuyển tiếp có thể được bắt nguồn từ sự ngang giá của cuộc gọi thỏa thuận bằng cách thay thế tài sản cơ bản\nbằng một tài sản tổng hợp tương đương: một hợp đồng kỳ hạn dài và trái phiếu không lãi suất không rủi ro\nvới mệnh giá bằng giá kỳ hạn của tài sản. Việc ký kết hợp đồng kỳ hạn\nkhông tốn phí gì, vì vậy giá trị của tài sản tổng hợp tại Thời điểm 0 chỉ đơn giản là\ngiá trị hiện tại của trái phiếu không trả lãi.\nGiải thích tính chẵn lẻ của giao dịch mua bán kỳ hạn cho các quyền chọn Châu Âu\nLOS","qhtml":null},{"n":40,"q":"The following table shows a series of annual spot rates:\nMaturity (years) Spot Rate (%)\n1 1.05\n2 2.33\n3 2.90\nThe 1-year rate available in 2 years is closest to:","opts":["3.47%","4.05%","6.04%"],"ans":"B","expl":"Tỷ giá kỳ hạn cho một kỳ có thể được tính bằng cách sử dụng:\ntỷ giá kỳ hạn từ các kỳ trước hoặc\nhai tỷ giá giao ngay từ một đường cong giao ngay (tức là chuỗi tỷ giá giao ngay lãi suất).\nTỷ giá kỳ hạn có thể được hiểu là lợi nhuận biên sẽ khiến\ncác nhà đầu tư mở rộng tầm nhìn của họ thêm một khoảng thời gian (ví dụ: 1 năm). Trong trường hợp này, lợi tức của\ntrái phiếu kỳ hạn 3 năm tương đương với lợi tức của trái phiếu kỳ hạn 2 năm cộng với lợi tức biên của việc\ngia hạn trái phiếu thêm 1 năm. Lợi nhuận biên đó là lãi suất 1 năm có sẵn trong 2 năm\n(tức là 2y1y ) và có thể được tính bằng lãi suất giao ngay kỳ hạn 2 năm và 3 năm.\nTỷ giá tính theo 2 năm được giải như sau:\nBiểu thị dưới dạng phần trăm, 2 năm 1 năm là 4,05%.\n(Lựa chọn A) 3,47% là do sử dụng tỷ giá giao ngay chính xác nhưng áp dụng số mũ của 1 và\n2.\n(Lựa chọn C) 6,04% là do sử dụng tỷ giá giao ngay 1 năm và 2 năm.\nNhững điều cần nhớ:\nTỷ giá kỳ hạn cho một kỳ có thể được tính bằng cách tính tỷ giá kỳ hạn cho các kỳ trước hoặc\nbằng cách sử dụng hai tỷ giá giao ngay từ một đường cong giao ngay. Tỷ giá kỳ hạn thể hiện lợi nhuận cận biên\ntăng thêm sẽ khiến các nhà đầu tư mở rộng tầm nhìn của họ đến kỳ hạn sau này.\nXác định tỷ giá ngang bằng và tỷ giá kỳ hạn, đồng thời tính lãi suất mệnh giá, tỷ giá kỳ hạn từ tỷ giá giao ngay, tỷ giá giao ngay\ntừ tỷ giá kỳ hạn và giá của trái phiếu sử dụng tỷ giá kỳ hạn.\nLOS","qhtml":null},{"n":41,"q":"A bond that matures in four years has a 5% annual coupon rate with interest paid\nsemiannually. If the market discount rate for the bond is 4.50%, the price of the bond per\n100 of par is closest to:","opts":["98.2075","101.7938","101.8118"],"ans":"C","expl":"Giá của trái phiếu là giá trị hiện tại của trái phiếu: tổng giá trị hiện tại của phiếu giảm giá\nvà các khoản thanh toán gốc (tức là mệnh giá) trong thời gian còn lại cho đến khi đáo hạn. Mỗi dòng tiền được\nchiết khấu theo lợi suất thị trường đến khi đáo hạn (YTM), được biểu thị bằng lãi suất định kỳ, theo\nsố khoảng thời gian từ ngày định giá đến ngày đến hạn của mỗi luồng tiền.\nGiải pháp nhanh nhất cho vấn đề này có được bằng máy tính tài chính, sử dụng\nđầu vào sau:\nSố kỳ (N) n × m = 4 × 2 = 8\nTỷ lệ chiết khấu định kỳ (i) r ÷ m = 4,50% ÷ 2 = 2,25(%)\nThanh toán định kỳ (PMT) ( c × FV ) thua m = (0,05 × 100) 2 = 2,5\nMệnh giá (FV) 100\nc = lãi suất trái phiếu; FV = mệnh giá\nĐối với trái phiếu có tần suất gộp ( m ) nhiều hơn một lần mỗi năm, số\nkỳ ( N ), thanh toán lãi coupon (PMT) và lãi suất chiết khấu thị trường ( i ) phải được điều chỉnh từ\ngiá trị hàng năm đã cho thành giá trị định kỳ. Tỷ lệ chiết khấu thị trường còn được gọi là\nlợi suất yêu cầu hoặc tỷ suất lợi nhuận yêu cầu.\n(Lựa chọn A) 98.2075 là kết quả của việc sử dụng tỷ lệ chiết khấu thị trường để xác định các khoản thanh toán phiếu\nvà sử dụng lãi suất phiếu giảm giá để chiết khấu dòng tiền. Lưu ý rằng vì\nlãi suất coupon của trái phiếu lớn hơn lãi suất của nó nên hiện tại nó được định giá ở mức cao hơn: giá phải\nlớn hơn mệnh giá. Do đó, bất kỳ lựa chọn trả lời nào nhỏ hơn mệnh giá đều không chính xác .\n(Lựa chọn B) 101.7938 sẽ là giá nếu trái phiếu trả phiếu giảm giá một lần mỗi năm.\nNhững điều cần nhớ:\nGiá của một trái phiếu là giá trị hiện tại của phiếu lãi và các khoản thanh toán gốc trong\nthời gian còn lại cho đến khi đáo hạn. Đối với trái phiếu có tần suất gộp nhiều hơn một lần mỗi\nnăm, số kỳ, thanh toán lãi trái phiếu và tỷ lệ chiết khấu thị trường phải được điều chỉnh\ntừ các giá trị hàng năm nhất định sang các giá trị định kỳ.\nTính giá trái phiếu khi biết lãi suất đến ngày đáo hạn vào hoặc giữa các ngày phiếu lãi.\nLOS","qhtml":null},{"n":42,"q":"Which of the following positions is most likely equivalent to selling a 90-day forward rate\nagreement on a 180-day interest rate?","opts":["Simultaneously going long a 270-day deposit and going short a 90-day deposit","Simultaneously going long a 180-day deposit and going short a 90-day deposit","Going long a 90-day deposit and, when that deposit matures, going long a 180-day deposit"],"ans":"A","expl":"Thỏa thuận tỷ giá kỳ hạn (FRA) là hợp đồng kỳ hạn về lãi suất. FRA có\nlãi suất tham chiếu (ví dụ: LIBOR 180 ngày) thay vì tài sản cơ bản.\nNgười mua (tức là các bên mua) khóa lãi suất mà họ sẽ trả trong một khoảng thời gian trong tương lai.\nNgười bán (tức là các bên bán khống) khóa lãi suất mà họ sẽ nhận được trong một khoảng thời gian trong tương lai.\nFRA được bán để phòng ngừa lãi suất đối với một khoản đầu tư trong tương lai (ví dụ: khi thực hiện một khoản vay) hoặc\nđể đầu cơ khi lãi suất giảm và kiếm lợi nhuận nếu lãi suất tham chiếu khi hết hạn\nthấp hơn tỷ lệ được đặt trong thỏa thuận.\nFRA ngắn tổng hợp được tạo bằng cách:\nmua tiền gửi có kỳ hạn dài hơn (để nhận lãi suất) và\nbán tiền gửi có kỳ hạn ngắn hơn (để trả lãi) rate).\nTrong trường hợp này, việc mua (tức là mua) một khoản tiền gửi có thời hạn 270 ngày sẽ ấn định mức lãi suất nhận được cho kỳ hạn\n. Đồng thời bán (tức là bán khống) khoản tiền gửi 90 ngày sẽ yêu cầu thanh toán\nmột mức lãi suất cố định, do đó bù đắp tiền lãi nhận được trong 90 ngày đầu tiên cho khoản tiền gửi 270 ngày\n. Sự kết hợp của hai khoản tiền gửi dẫn đến lãi suất cố định cho kỳ hạn a\n là 180 ngày, bắt đầu từ 90 ngày trong tương lai . Điều đó tương đương với việc bán FRA 90 ngày\nvới lãi suất 180 ngày.\n(Lựa chọn B) Mua khoản tiền gửi 180 ngày và bán khống khoản tiền gửi 90 ngày tương đương với việc bán\nFRA 90 ngày với lãi suất 90 ngày.\n(Lựa chọn C) Không giống như bán FRA, mua khoản tiền gửi có kỳ hạn 90 ngày và mua khoản tiền gửi có kỳ hạn 180 ngày\n90 ngày sau đó không ảnh hưởng đến lãi suất trong tương lai. Lãi suất của khoản tiền gửi sau là\nlãi suất thị trường khi mua nó.\nNhững điều cần nhớ:\nThỏa thuận tỷ giá kỳ hạn (FRA) là hợp đồng kỳ hạn về lãi suất. Bán một FRA khóa\ntheo lãi suất sẽ nhận được trong một khoảng thời gian trong tương lai. FRA ngắn hạn tổng hợp được tạo bằng cách\nmua tiền gửi có kỳ hạn dài hơn và bán tiền gửi có kỳ hạn ngắn hơn.\nGiải thích cách xác định tỷ giá kỳ hạn cho hợp đồng kỳ hạn lãi suất và mô tả cách sử dụng\ncủa các tỷ giá kỳ hạn này.\nLOS","qhtml":null},{"n":43,"q":"A stock has a spot price of £120 and pays dividends over the next year that have a present\nvalue of £5.71. Assuming there are no other costs or benefits of holding the asset and a risk-\nfree rate of 5%, the 1-year forward price (in £) of the stock is closest to:","opts":["114","120","132"],"ans":"B","expl":"Nhà đầu tư có thể sở hữu một tài sản trong tương lai bằng cách mua tài sản đó ngay hôm nay hoặc mua hợp đồng kỳ hạn\nđể có được tài sản đó trong tương lai. Định giá chênh lệch giá đảm bảo rằng giá kỳ hạn khác với\ngiá giao ngay ở chi phí ròng để vận chuyển tài sản cơ bản cho đến khi hết hạn kỳ hạn. A\ngiá của hợp đồng kỳ hạn được tăng lên nhờ mọi chi phí tránh được và giảm đi bởi bất kỳ lợi ích nào\nbỏ qua bằng cách giữ hợp đồng kỳ hạn thay vì tài sản.\nĐể giữ giá chênh lệch giá, giá kỳ hạn phải bằng:\nT\ngiá trị tương lai của giá giao ngay [ S (1 + r ) ]\n0\nT\ntrừ đi giá trị tương lai của bất kỳ lợi ích nào (ví dụ: cổ tức) [− γ (1 + r ) ]\nT\ncộng với giá trị tương lai của mọi chi phí [ θ (1 + r ) ].\nTrong trường hợp này, giá kỳ hạn bằng giá trị tương lai của giá giao ngay trừ đi giá trị tương lai\ngiá trị của cổ tức:\n(1,05)1 (1,05)1\nF ( T ) = 120 − 5,71 = 120\n0\n(Lựa chọn A) £114 là kết quả của việc lấy giá trị hiện tại trừ đi giá trị tương lai của cổ tức\ngiá giao ngay.\n(Lựa chọn C) £132 là kết quả của việc cộng, thay vì trừ, giá trị tương lai của\ncổ tức từ giá trị tương lai của giá giao ngay.\nNhững điều cần nhớ:\nMua hợp đồng kỳ hạn thay vì tài sản cơ bản sẽ tránh được chi phí và bỏ qua mọi\nlợi ích của việc nắm giữ tài sản. Định giá chênh lệch giá thực thi mối quan hệ giữa giá kỳ hạn và\ngiá giao ngay: giá kỳ hạn phải khác với giá giao ngay ở chi phí ròng để nắm giữ\ntài sản cơ bản.\nGiải thích sự khác biệt giữa giá giao ngay và giá tương lai dự kiến ​​của một tài sản cơ sở và chi phí của\nvận chuyển liên quan đến việc nắm giữ tài sản cơ bản\nLOS","qhtml":null},{"n":44,"q":"Which of the following is most appropriate to measure the interest rate risk of a bond with an\nembedded call option? A measure of:","opts":["yield duration.","curve duration.","modified duration."],"ans":"B","expl":"Thời hạn trái phiếu\nLoại biện pháp Trái phiếu áp dụng\nThời gian trung bình tính theo giá trị hiện tại để\nMacaulay Không nhúng tùy chọn\nbiên lai phiếu giảm giá và tiền gốc\nPhần trăm thay đổi về giá của một trái phiếu nhất định\nĐã sửa đổi Không có tùy chọn nhúng\nthay đổi lợi suất trái phiếu đến ngày đáo hạn\nPhần trăm thay đổi về giá do\nHiệu quả Tất cả\nsự thay đổi song song của lợi suất chuẩn đường cong\nPhần trăm thay đổi về giá do sự thay đổi\nTỷ lệ chính trong một phần của lợi suất chuẩn Tất cả\nđường cong\nThay đổi giá theo đơn vị tiền tệ dựa trên\nTiền Tất cả\nthay đổi về lợi suất hoặc đường cong thích hợp\nTrái phiếu được định giá theo giá trị hiện tại của dòng tiền cho đến khi đáo hạn, sử dụng\nYTM làm tỷ lệ chiết khấu. Khi trái phiếu được phát hành kèm theo quyền chọn mua kèm theo,\nkhả năng thực hiện quyền chọn khiến dòng tiền không chắc chắn. Điều này dẫn đến\nliên kết thiếu YTM được xác định rõ ràng. Do đó, cách thích hợp nhất là đo lường\nrủi ro lãi suất của trái phiếu có thể mua lại bằng cách sử dụng thời hạn hiệu dụng , là một thống kê đường cong\nthời hạn .\nĐể đo lường rủi ro lãi suất, thời hạn hiệu dụng sẽ dịch chuyển đường cong lợi suất chuẩn lên\nvới cùng một số điểm cơ bản, thay vì thay đổi một\nYTM cụ thể. Phương pháp này nắm bắt tốt hơn cách dòng tiền thay đổi trong\ncác kịch bản lãi suất khác nhau đối với trái phiếu không có YTM được xác định rõ ràng (ví dụ: trái phiếu có thể mua lại).\n(Lựa chọn A và C) Thời hạn lợi nhuận (ví dụ: thời hạn Macaulay, thời hạn sửa đổi)\nđo lường rủi ro lãi suất dựa trên một lãi suất duy nhất, YTM của trái phiếu. Lợi suất\nthời hạn phù hợp với trái phiếu không có quyền chọn kèm theo vì những trái phiếu đó\ncó YTM được xác định rõ ràng.\nNhững điều cần nhớ:\nKhi trái phiếu được phát hành với quyền chọn mua được nhúng, dòng tiền của nó không chắc chắn,\nvà do đó YTM của nó không được xác định rõ. Thời hạn hiệu lực đo lường những thay đổi của giá trái phiếu\nliên quan đến sự thay đổi trong đường cong lợi suất chuẩn, thay vì thay đổi\ntrong một YTM cụ thể. Do đó, sẽ phù hợp hơn với những trái phiếu không có\nYTM được xác định rõ ràng (ví dụ: trái phiếu có tùy chọn mua kèm theo).\nGiải thích tại sao thời lượng hiệu dụng và độ lồi hiệu quả là những thước đo thích hợp nhất\nvề rủi ro lãi suất đối với trái phiếu có tùy chọn nhúng.\nLOS","qhtml":null},{"n":45,"q":"The general partner of a private equity fund will most likely earn an incentive fee once the:","opts":["clawback provision has been invoked.","committed capital has been fully drawn down.","limited partners' initial investment has been paid back."],"ans":"C","expl":"Cấu trúc phí vốn cổ phần tư nhân so với quỹ phòng hộ\nPhí Vốn cổ phần tư nhân Quỹ phòng hộ\nTỷ lệ hoàn vốn nội bộ (IRR) của một danh mục đầu tư,\ntài khoản cho tất cả các khoản đóng góp và Dựa hoàn toàn vào AUM\nrút \"Vốn cam kết\"\nQuản lý\nChuyển sang % tài sản được quản lý không áp dụng cho các quỹ phòng hộ\n(AUM) sau khi đầu tư toàn bộ vốn cam kết\nDựa trên % lợi nhuận nhận được khi bán Luôn dựa trên % của\nquỹ nắm giữ lợi nhuận (đã thực hiện hay không)\nLợi nhuận khuyến khích không được phân phối (và phí khuyến khích Quỹ có toàn quyền quyết định\nkhông kiếm được) cho đến khi cổ phần được bán để phân phối lợi nhuận thực hiện\nQuỹ vốn cổ phần tư nhân (PE) tính cả phí quản lý hàng năm và phí khuyến khích.\nPhí ưu đãi dựa trên lợi nhuận thực tế từ việc bán các khoản đầu tư của quỹ. Đối tác chung\n(GP) (tức là người quản lý quỹ) đủ điều kiện nhận phí ưu đãi khi các đối tác\n hạn chế (tức là nhà đầu tư) đã nhận được khoản phân phối bằng với khoản đầu tư ban đầu của họ .\n(Lựa chọn A) Nếu phí khuyến khích được thanh toán trong suốt thời gian hoạt động của quỹ khi các khoản đầu tư được bán,\nGP có thể nhận được nhiều hơn phần lợi nhuận đã thỏa thuận theo hợp đồng do thua lỗ\ntrên các tài sản khác. Trong trường hợp này, điều khoản thu hồi vốn yêu cầu GP phải hoàn trả một phần\nphí ưu đãi hoặc bị mất phí ưu đãi trong tương lai.\n(Lựa chọn B) Vốn cam kết đề cập đến số tiền mà các đối tác hữu hạn đã đồng ý\ncung cấp quỹ PE theo yêu cầu tài trợ cho một khoản đầu tư mới. Quỹ PE sẽ rút ra\ncác cam kết vốn này, thường trong vòng 3 đến 5 năm. Phí ưu đãi dựa trên\nkết quả hoạt động của quỹ và không phụ thuộc vào việc rút toàn bộ vốn cam kết.\nNhững điều cần nhớ:\nPhí ưu đãi dựa trên lợi nhuận thực tế từ việc bán các khoản đầu tư của quỹ. Khi\nnhà đầu tư đã nhận được khoản phân phối bằng khoản đầu tư ban đầu của họ, đối tác chung có thể\nđược trả một khoản phí khuyến khích.\nTính toán và giải thích lợi nhuận đầu tư thay thế cả trước và sau phí\nLOS","qhtml":null},{"n":46,"q":"An analyst estimates a company's ratio of enterprise value (EV) to EBITDA to be 10 based on\npeer analysis. The analyst gathers the following company information:\nINR millions\nCash and cash equivalents 80\nBook value of debt 800\nMarket value of debt 725\nShort-term investments 25\nIf the company is expected to report EBITDA of INR 200 million this year, its market\ncapitalization (in INR millions) is closest to:","opts":["1,305","1,355","1,380"],"ans":"C","expl":"Giá trị doanh nghiệp (EV) đo lường tổng giá trị của một công ty (tức là vốn cổ phần phổ thông, nợ ròng). EV\ncũng được coi là giá trị tiếp quản, số tiền mà bên mua sẽ trả cho một công ty mục tiêu ít hơn\ntiền mặt của mục tiêu (vì tiền mặt có thể được sử dụng để trả nợ).\nHệ số EV cho phép đánh giá giá trị tương đối của một công ty theo thời gian hoặc so sánh với các công ty\nkhác. Khi kết hợp với nợ ròng, ước tính EV thu được từ bội số EV cũng có thể được sử dụng để ước tính vốn hóa thị trường của công ty (tức là giá trị vốn chủ sở hữu).\nTrong trường hợp này, nhà phân tích đang ước tính vốn hóa thị trường của công ty dựa trên\ntỷ lệ EV trên EBITDA của nó. Công thức tính tỷ lệ EV trên EBITDA có thể được sắp xếp lại để giải\nvốn hóa thị trường như sau:\nVốn hóa thị trường = (10 × 200) – 725 + (80 + 25) = 1.380\n(Lựa chọn A) Vốn hóa thị trường 1.305 là kết quả của việc sử dụng giá trị sổ sách của công ty\nnợ thay vì giá trị thị trường. Giá trị sổ sách của trái phiếu của một công ty trên bảng cân đối kế toán\ncó thể khác với giá trị thị trường của trái phiếu, đây là mức định giá hiện tại hơn.\n(Lựa chọn B) Vốn hóa thị trường 1.355 là kết quả của việc không trừ đi các khoản đầu tư\nngắn hạn.\nNhững điều cần nhớ:\nGiá trị doanh nghiệp (EV) đo lường tổng giá trị của một chắc chắn. Khi kết hợp với nợ ròng,\nước tính EV thu được từ bội số EV cũng có thể được sử dụng để ước tính vốn hóa thị trường của công ty\nvốn hóa.\nMô tả bội số giá trị doanh nghiệp và cách sử dụng chúng trong việc ước tính giá trị vốn chủ sở hữu\nLOS","qhtml":null},{"n":47,"q":"A style index would most likely contain which of the following constituents?","opts":["The smallest 200 stocks in a region","All consumer goods companies within a country","A representation of indexes from countries deemed emerging markets"],"ans":"A","expl":"Các loại chỉ số vốn chủ sở hữu\nHầu hết các chứng khoán của toàn bộ vốn chủ sở hữu\nBroad Russell 3000, Wilshire 5000\nthị trường\nthị trường (cả hai đều bao gồm chứng khoán Hoa Kỳ)\nKết hợp các chỉ mục từ các quốc gia\ncác quốc gia khác nhau\nMSCI All Country World\nĐa thị trường\nProxy cho khu vực hoặc toàn cầu\nChỉ số và chỉ số MSCI EAFE\nđầu tư\nDựa trên cùng một lĩnh vực (ví dụ:\ntài chính, chăm sóc sức khỏe)\nCó thể có quy mô khác nhau (ví dụ: lớn\ngiới hạn, vốn hóa nhỏ) và\nChỉ số năng lượng ngành Châu Âu\nkiểu khác nhau (tức là giá trị so với tăng trưởng)\nCó thể quốc gia, khu vực hoặc\ntoàn cầu\nCó thể là các ngành khác nhau\nDựa trên cùng quy mô (ví dụ:\ngiới hạn lớn) hoặc kiểu (ví dụ: giá trị so với\nChỉ số vốn hóa lớn kiểu Châu Á\ntăng trưởng)\nCó thể là quốc gia, khu vực hoặc\nglobal\nChỉ số vốn chủ sở hữu là tập hợp các cổ phiếu dựa trên một yếu tố chung như phong cách,\nngành hoặc vị trí địa lý. Các chỉ số đa thị trường cũng có thể dựa trên các chỉ số khác. Chỉ mục\ncó mục đích biểu thị hiệu suất tổng hợp của danh mục mà nó đánh giá.\nChỉ số kiểu chứa các cổ phiếu có một yếu tố đầu tư duy nhất (ví dụ: tăng trưởng, giá trị), quy mô\ntương tự (ví dụ: vốn hóa lớn, vốn hóa nhỏ) hoặc kết hợp cả hai (ví dụ: tăng trưởng vốn hóa nhỏ). Các chỉ số\nnày có thể mang tính khu vực hoặc toàn cầu và nhằm mục đích tái tạo các phong cách đầu tư phổ biến.\nCác chỉ số kiểu dựa trên quy mô có thể sử dụng quy mô tuyệt đối (ví dụ: giới hạn thị trường dưới 1 tỷ euro) hoặc quy mô tương đối (ví dụ: 100 công ty đại chúng nhỏ nhất ở khu vực đồng euro). Trong câu hỏi này, chỉ số kiểu\nsẽ chứa 200 cổ phiếu nhỏ nhất trong một khu vực một cách thích hợp nhất vì đó là\nthành phần duy nhất dựa trên quy mô hoặc yếu tố đầu tư.\n(Lựa chọn B) Tất cả các công ty hàng tiêu dùng trong một quốc gia sẽ thuộc một chỉ số ngành , trong đó\nbao gồm các công ty hoạt động hoặc cạnh tranh trong cùng một loại hình kinh doanh chung.\n(Lựa chọn C) Sự thể hiện các chỉ mục từ các quốc gia được coi là thị trường mới nổi sẽ là\ntrong một chỉ mục đa thị trường . Các chỉ mục loại này có thể dựa trên các khu vực địa lý cụ thể,\ncác giai đoạn phát triển kinh tế (ví dụ: thị trường mới nổi) hoặc thị trường tài chính toàn cầu.\nNhững điều cần nhớ:\nChỉ số kiểu chứa các cổ phiếu có một yếu tố đầu tư duy nhất, quy mô tương tự hoặc kết hợp cả hai yếu tố. Các chỉ số này nhằm mục đích tái tạo các phong cách đầu tư phổ biến. Chỉ mục kiểu dựa trên\nkích thước có thể sử dụng kích thước tuyệt đối hoặc tương đối.\nMô tả các loại chỉ mục vốn chủ sở hữu\nLOS","qhtml":null},{"n":48,"q":"The ex-dividend date is best described as the date when:","opts":["the company pays the dividend.","the company declares the amount and timing of the dividend.","the stock trades for the first time without the right to the dividend."],"ans":"C","expl":"Ngày giao dịch không hưởng quyền (tức là ngày hết hạn) là ngày đầu tiên cổ phiếu của công ty được giao dịch mà không có\nquyền nhận cổ tức . Vì cổ phiếu được mua vào hoặc sau ngày hết hạn không chuyển tải\nquyền nhận cổ tức nên giá cổ phiếu thường giảm theo số tiền cổ tức vào\nngày hết hạn.\nNgày không hưởng cổ tức gắn liền trực tiếp với quá trình thanh toán (ví dụ: T + 2) vì cổ phiếu\nđược mua vào hoặc sau ngày hết hạn được thanh toán sau ngày hết hạn cổ tức ngày lưu giữ hồ sơ (tức là, ghi\nngày).\n(Lựa chọn A) Ngày thanh toán cổ tức được công bố khi công ty tuyên bố\ncổ tức và là ngày công ty sẽ thực sự chuyển tiền cho những người được hưởng\ncổ tức.\n(Lựa chọn B) Ngày kê khai là ngày công ty công bố chi tiết cụ thể của\ncổ tức (ví dụ: quy mô, ngày thanh toán). Vì ngày kê khai thường là vài tuần hoặc vài tháng trước\nngày đăng ký, nên cổ phiếu vẫn có thể được mua với quyền nhận cổ tức.\nNhững điều cần nhớ:\nNgày giao dịch không hưởng quyền là ngày đầu tiên cổ phiếu của công ty được giao dịch mà không có quyền đối với\ncổ tức. Ngày không hưởng cổ tức gắn trực tiếp với quá trình thanh toán vì cổ phiếu\nđược mua vào hoặc sau ngày không hưởng cổ tức được thanh toán sau ngày nắm giữ hồ sơ.\nMô tả trình tự thời gian thanh toán cổ tức\nLOS","qhtml":null},{"n":49,"q":"A recently launched hedge fund that is subject to a prime broker's margin call will most\nlikely benefit from a:","opts":["drawdown.","lockup period.","committed capital drawdown."],"ans":"B","expl":"Hạn chế mua lại nhà đầu tư quỹ phòng hộ\nThời gian tối thiểu nhà đầu tư cam kết\nvào quỹ trước khi rút tiền\nThời gian khóa\nđược phép\nThường dưới 2 năm\nYêu cầu nhà đầu tư thông báo cho quỹ\nkế hoạch mua lại\nThời hạn thông báo đổi thưởng\nThông thường 30−90 ngày\nCác quỹ phòng hộ thường sử dụng đòn bẩy để thực hiện chiến lược đầu tư bằng cách vay từ\nmột nhà môi giới chính. Nếu giá trị vốn chủ sở hữu của tài khoản giảm xuống dưới mức tối thiểu, mức ký quỹ\ncuộc gọi được phát ra. Quỹ sau đó buộc phải giảm đòn bẩy, thường bằng cách thanh lý các khoản hiện có.\ncác vị trí.\nLệnh gọi ký quỹ có thể làm tăng tổn thất cho một quỹ phòng hộ vì việc thanh lý bắt buộc tạo ra một khoản lỗ lớn.\nvòng phản hồi tiêu cực: việc bán do lệnh gọi ký quỹ ép buộc khiến giá giảm nhiều hơn,\ndẫn đến việc nhà đầu tư phải mua lại, buộc phải bán nhiều hơn, v.v.\nThông báo mua lại và thời gian khóa giúp bảo vệ quỹ phòng hộ khỏi nhà đầu tư\nsự chuộc lại sẽ làm xấu đi vị thế của nó. Trong kịch bản này, hầu hết nếu không phải tất cả các nhà đầu tư\ntrong quỹ phòng hộ mới ra mắt gần đây sẽ phải chịu thời gian khóa, hạn chế rút tiền\nngay sau khoản đầu tư ban đầu của họ.\n(Lựa chọn A) Rút vốn là việc giảm giá trị tài sản ròng của quỹ phòng hộ xuống dưới mức cao nhất\ndấu nước, không phải là một sự phát triển hữu ích trong cuộc gọi ký quỹ.\n(Lựa chọn C) Vốn cam kết đề cập đến số tiền mà các đối tác hữu hạn trong vốn cổ phần tư nhân\n(PE) (tức là không phải quỹ phòng hộ), đồng ý cung cấp quỹ theo yêu cầu để tài trợ cho một quỹ mới\nđầu tư. Quỹ PE sẽ rút vốn cam kết này, thường là trong vòng 3 đến 5 năm.\nNhững điều cần nhớ:\nQuỹ phòng hộ được hưởng lợi từ thời gian khóa, hạn chế việc nhà đầu tư rút tiền trong một khoảng thời gian\nthời gian ngay sau lần đầu tư ban đầu. Nếu quỹ phòng hộ nhận được lệnh gọi ký quỹ\nvà phải bán bớt các vị thế để thỏa mãn mức ký quỹ, thời gian khóa sẽ bảo vệ quỹ khỏi\nnhững tổn thất tiếp theo.\nGiải thích các đặc điểm đầu tư của các quỹ phòng hộ và so sánh chúng với các loại tài sản khác\nLOS","qhtml":null},{"n":50,"q":"Commodity indexes are most likely :","opts":["subject to backfill and survivorship bias.","directly comparable since weighting methods are standardized.","to have performance differences versus the underlying commodities."],"ans":"C","expl":"Chỉ số hàng hóa\nTiếp xúc với hàng hóa cơ bản đạt được\nthông qua các công cụ phái sinh\nHiệu suất giá phái sinh có thể thay đổi đáng kể\ntừ giá hàng hóa vật chất\nMức độ tiếp xúc với hàng hóa cơ bản có thể khác nhau\nđáng kể giữa các chỉ số\nĐược xem rộng rãi như một biện pháp phòng ngừa lạm phát\nTương quan thấp trong lịch sử với các loại tài sản khác\nCác chỉ số hàng hóa sử dụng hợp đồng tương lai hoặc các hợp đồng phái sinh khác để tiếp cận\nhàng hóa cơ bản trong mỗi chỉ số. Điều này làm cho các chỉ số trở nên dễ đầu tư hơn và\ndễ nhân rộng hơn với tính minh bạch về giá cao hơn so với đầu tư trực tiếp vào hàng hóa.\nMột chỉ số có thể tiếp xúc với nhiều mặt hàng và mỗi mặt hàng trong chỉ số\ncó thể có trọng lượng khác. Giá kỳ hạn, trong khi chắc chắn bị ảnh hưởng bởi những thay đổi trong\nhàng hóa cơ bản cũng bị ảnh hưởng bởi chi phí lưu trữ và lợi nhuận trên tài sản thế chấp\ncần thiết cho hoạt động đầu tư tương lai. Những yếu tố này có nghĩa là giá của chỉ số gần như\nchắc chắn khác với giá tương lai của hàng hóa. Tương tự như vậy, một hàng hóa cơ bản\nlợi nhuận được đo bằng sự thay đổi trong giá giao ngay gần như chắc chắn khác với\nlợi nhuận của chỉ số hàng hóa được đo bằng sự thay đổi trong giá tương lai của nó.\n(Lựa chọn A) Không giống như các chỉ số đầu tư thay thế khác (ví dụ: quỹ phòng hộ, vốn cổ phần tư nhân),\nchỉ số hàng hóa dựa trên giá thị trường có thể quan sát được của các sản phẩm phái sinh hàng hóa và\ndo đó không phải tuân theo báo cáo có chọn lọc dẫn đến sai lệch san lấp và sống sót.\n(Lựa chọn B) Các phương pháp xác định trọng lượng và tiếp xúc với hàng hóa cơ bản có thể khác nhau đáng kể\ngiữa các chỉ mục và do đó không được chuẩn hóa.\nNhững điều cần nhớ:\nCác chỉ số hàng hóa sử dụng hợp đồng tương lai hoặc các hợp đồng phái sinh khác để tiếp cận với\nhàng hóa cơ bản trong mỗi chỉ số. Vì giá tương lai của hàng hóa cơ bản là\ngần như chắc chắn khác với giá giao ngay của nó, lợi nhuận của chỉ số được đo bằng sự thay đổi trong giá giao ngay của nó.\ngiá tương lai gần như chắc chắn khác với lợi nhuận của hàng hóa được đo bằng sự thay đổi\ntheo giá giao ngay của nó.\nGiải thích đặc điểm của đất thô, đất rừng, đất nông nghiệp và đặc điểm đầu tư của chúng\nLOS","qhtml":null},{"n":51,"q":"An analyst obtains the following information on a government bond:\nBond Data\nAnnual coupon rate 4.00%\nYTM 5.00%\nPayment frequency Semiannual\nPayment dates 15 January, 15 July\nMaturity date 15 January 2030\nDay-count convention Actual/actual\nAssuming a trade settlement date of 9 November 2020, the amount of accrued interest per\n100 of par value is closest to:","opts":["1.27","1.59","2.54"],"ans":"A","expl":"Trái phiếu sinh lãi hàng ngày nhưng chỉ trả lãi định kỳ. Vào ngày thanh toán, chủ sở hữu\ntrái phiếu sẽ nhận được toàn bộ khoản thanh toán lãi trái phiếu cho kỳ trước. Nếu trái phiếu được giao dịch\ngiữa các ngày của phiếu lãi , người mua sẽ nhận được toàn bộ phiếu lãi. Do đó, người mua\nphải bồi thường cho người bán phần phiếu giảm giá kiếm được (tức là được tích lũy) kể từ\nthanh toán phiếu giảm giá cuối cùng.\nSố tiền lãi tích lũy được xác định bởi mệnh giá, lãi suất phiếu giảm giá và\nkhoảng thời gian mà lãi tích lũy. Một số phương pháp, được gọi là quy ước đếm ngày\n, có thể được sử dụng để đo khoảng thời gian đó. Đối với nhiều trái phiếu chính phủ,\nphương pháp thực tế/thực tế được sử dụng như sau:\nXác định số ngày theo lịch thực tế mà lãi được tích lũy (tức là số ngày\nlãi tích lũy), bắt đầu từ ngày thanh toán phiếu lãi cuối cùng và tiếp tục nhưng không\nkể cả ngày thanh toán.\nXác định số ngày thực tế trong kỳ phiếu lãi theo đếm số ngày kể từ\nngày thanh toán cho đến nhưng không bao gồm ngày phiếu lãi tiếp theo (tức là số dư kỳ hạn),\nsau đó cộng số đó vào số ngày lãi tích lũy.\nSố ngày lãi tích lũy = 117 Số dư trong kỳ = 67\nTháng # ngày Tháng # ngày\n17 tháng 7* Tháng 11 22\nNgày 31 tháng 8 Ngày 31 tháng 12\nNgày 30 tháng 9 Ngày 14 tháng 1**\nNgày 31 tháng 10\nNgày 8 tháng 11\n*Bao gồm ngày 15 đến ngày 31 **Không bao gồm ngày thanh toán\nNhập các giá trị đó cùng với lãi suất phiếu giảm giá và mệnh giá vào công thức sau:\n(Lựa chọn B) 1,59 là kết quả của việc sử dụng YTM thay vì lãi suất trong phép tính.\n(Lựa chọn C) 2,54 là do không chia lãi suất cho 2.\nNhững điều cần nhớ:\nTrái phiếu kiếm lãi hàng ngày nhưng chỉ trả lãi định kỳ. Khi trái phiếu được giao dịch giữa\nngày phiếu lãi, người bán sẽ nhận được phần của phiếu lãi tiếp theo đã tích lũy kể từ\nthanh toán phiếu lãi cuối cùng.\nTính giá trái phiếu dựa trên lợi tức đến ngày đáo hạn vào hoặc giữa các ngày phiếu lãi.\nLOS","qhtml":null},{"n":52,"q":"For asset securitization, credit tranching is most likely used:","opts":["as a waterfall structure.","for mitigation of prepayment risk.","as a method of overcollateralization."],"ans":"A","expl":"Cải thiện và sử dụng tín dụng trái phiếu\nSử dụng nâng cao\nCác đợt cấp dưới được ưu tiên hơn các đợt cấp dưới\nNhà phát hành cầm cố tài sản có giá trị lớn hơn số tiền đã vay\nNội bộ\nTiền mặt dư thừa nhận được từ tài sản được tài trợ gửi vào a\nTài khoản dự trữ\ntài khoản riêng\nTrái phiếu đảm bảo Bảo đảm thanh toán do các công ty bảo hiểm phát hành\nBảo lãnh từ các tổ chức tài chính không phải là tổ chức tài chính bảo hiểm\nThư tín dụng\nCác công ty bên ngoài\nTài sản thế chấp bằng tiền mặt\nTiền mặt do người bảo lãnh gửi mà người phát hành có thể vay\ntài khoản\nQuy trình chứng khoán hóa tài sản gộp mang đến cho các nhà đầu tư cơ hội đầu tư vào\ncác mức độ rủi ro phù hợp và tỷ lệ được chỉ định trở lại. Rủi ro tín dụng của nhà đầu tư được giảm bớt\nbằng các cải tiến hoặc các tính năng được thiết kế để phân phối lại rủi ro bằng cách hấp thụ hoặc\nphân bổ lại các khoản lỗ tiềm ẩn.\nMột đặc điểm chung là phân chia tín dụng, trong đó tài sản gộp được phân chia thành các phân đoạn\nvà mỗi phân đoạn được phát hành dưới dạng chứng khoán riêng biệt, đại diện cho một yêu cầu ưu tiên khác nhau trên\nbảo mật dòng tiền của. Các khoản lỗ được phân bổ vào các đợt theo cách xác định trước,\nvới các đợt được xếp hạng thấp hơn sẽ hấp thụ các khoản lỗ trước tiên . Cấu trúc này chủ yếu được sử dụng\nđể bảo vệ các nhà đầu tư ở các đợt cấp cao hơn khỏi rủi ro vỡ nợ. Nó còn được gọi là\ncấu trúc thác nước do cách thanh toán được phân bổ theo các đợt.\n(Lựa chọn B) Phân áp theo thời gian, không phải phân áp tín dụng, chủ yếu được sử dụng để giảm thiểu rủi ro thanh toán trước\nvì nó dựa vào việc phân chia nhóm tài sản bằng cách sử dụng chứng khoán có kỳ hạn khác nhau.\n(Lựa chọn C) Việc thế chấp vượt mức có thể được sử dụng ngoài phân ngạch tín dụng. Nói chung,\ncác khoản lỗ được hấp thụ trước tiên cần phải sử dụng hết toàn bộ số tiền thế chấp quá mức trước khi cấu trúc phân chia tín dụng\nđược áp dụng.\nNhững điều cần nhớ:\nPhân chia tín dụng (tức là cấu trúc thác nước) là một loại hình nâng cao được sử dụng để bảo vệ các nhà đầu tư\nkhỏi rủi ro vỡ nợ. Cấu trúc thác nước trước tiên phân bổ tổn thất cho các đợt được xếp hạng thấp hơn, do đó\nbảo vệ các nhà đầu tư ở các đợt cấp cao hơn khỏi rủi ro vỡ nợ.\nMô tả các cấu trúc tăng cường tín dụng điển hình được sử dụng trong chứng khoán hóa.\nLOS","qhtml":null},{"n":53,"q":"A floating-rate note has a quoted margin of 35 basis points (bps) and a discount margin of\n−15 bps. If the relevant reference rate is 3.25% on the bond's reset date, the new coupon\nrate is most likely :","opts":["3.10%","3.45%","3.60%"],"ans":"C","expl":"Tỷ lệ phiếu giảm giá của trái phiếu lãi suất thả nổi (tức là FRN hoặc trái phiếu thả nổi) dựa trên tỷ giá\ntham chiếu (ví dụ: LIBOR). Biên độ niêm yết là lợi suất được cộng vào tỷ giá tham chiếu để\nxác định lãi suất coupon của từng kỳ. Biên độ định giá thường không thay đổi trong suốt thời gian\ncủa trái phiếu. Lãi suất phiếu giảm giá của FRN trong trường hợp này là lãi suất LIBOR cộng với 35 điểm cơ bản\n(bps), hoặc 3,25% + 0,35% = 3,60%.\nBiên độ chiết khấu của FRN (còn gọi là mức ký quỹ bắt buộc) là sự điều chỉnh tỷ lệ\nđược sử dụng để chiết khấu dòng tiền của trái phiếu. Biên độ chiết khấu thể hiện lợi nhuận\nbổ sung cần thiết dựa trên rủi ro của FRN. Khi trái phiếu được phát hành, biên độ chiết khấu\ngiống như biên độ niêm yết, nhưng những thay đổi về rủi ro của trái phiếu khiến biên độ chiết khấu\nthay đổi. Bất kỳ thay đổi nào về biên độ chiết khấu đều ảnh hưởng đến giá trị hiện tại của trái phiếu , chứ không phải\nlãi suất trái phiếu của nó.\n(Lựa chọn A) 3,10% là kết quả của việc thêm biên độ chiết khấu (−15 bps), thay vì\nký quỹ niêm yết, vào lãi suất tham chiếu.\n(Lựa chọn C) 3,45% là kết quả của việc cộng tổng biên độ chiết khấu một cách không thích hợp và\nbiên độ chiết khấu (20 bps) so với tỷ giá tham chiếu.\nNhững điều cần nhớ:\nBiên độ chiết khấu là lượng lợi suất được thêm vào tỷ giá tham chiếu (ví dụ: LIBOR) để tính ra\nlãi suất phiếu giảm giá của trái phiếu lãi suất thả nổi (FRN). Biên độ định giá thường không thay đổi\ntrong suốt thời gian tồn tại của trái phiếu. Biên độ chiết khấu, đại diện cho lợi suất bổ sung\n mà các nhà đầu tư yêu cầu để bù đắp cho rủi ro của FRN, sẽ thay đổi nếu rủi ro thay đổi. Bất kỳ\nthay đổi nào về biên độ chiết khấu đều ảnh hưởng đến giá trị hiện tại của trái phiếu chứ không phải lãi suất coupon của nó.\nTính toán và giải thích các thước đo chênh lệch lãi suất cho các công cụ lãi suất thả nổi.\nLOS","qhtml":null},{"n":54,"q":"The current value of an option determined using a one-period binomial model is best\ndescribed as its values in one period weighted by the:","opts":["risk-neutral up and down probabilities.","probabilities of up and down moves discounted by the risk-free rate.","risk-neutral up and down probabilities discounted by the risk-free rate."],"ans":"C","expl":"Trong mô hình nhị thức, giá trị của một tùy chọn là giá trị hiện tại của trung bình có trọng số của\ngiá trị của nó ở trạng thái tăng và giảm, hai kết quả có thể xảy ra cho mỗi giai đoạn chuyển tiếp trong thời gian\n. Bắt đầu từ giá tài sản cơ bản hiện tại ( S ), giá trị của tài sản sẽ là\n0\n+) −).\ngiá tài sản cơ bản có xu hướng đi lên ( S hoặc chuyển động đi xuống ( S In\n+, −,\nmô hình một kỳ, độ dài của một khoảng thời gian là thời gian đến khi hết hạn. S S và\ntùy chọn ( X ) được sử dụng để định giá giá mua của tùy chọn khi:\n+), +\nchuyển động đi lên ( c sao cho c = max(0, S − X ), hoặc\n−), − −\nchuyển động đi xuống ( c sao cho c = max(0, S − X ).\nGiống như các công cụ phái sinh nói chung, các mô hình nhị thức giả định việc định giá không có chênh lệch giá giữ nguyên cho\ncác quyền chọn, sao cho có thể tạo ra các chiến lược phòng ngừa rủi ro không rủi ro. Điều này ảnh hưởng đến cả trọng số\nvà tỷ lệ chiết khấu được sử dụng để xác định các giá trị quyền chọn:\nXác suất trung tính rủi ro được sử dụng để tính trọng số các giá trị quyền chọn ở trạng thái tăng và giảm.\nKhông có rủi ro. tỷ lệ này là tỷ lệ chiết khấu thích hợp vì các vị thế không rủi ro sẽ kiếm được\ntỷ suất lợi nhuận phi rủi ro.\n(Lựa chọn A) Xác suất trung hòa rủi ro được sử dụng để tìm mức trung bình có trọng số của các giá trị tùy chọn\nmột khoảng thời gian trong tương lai, nhưng giá trị đó phải được chiết khấu để thu được giá trị hiện tại.\n(Lựa chọn B) Xác suất của chuyển động lên hoặc xuống không được sử dụng trong mô hình nhị thức\nvà không giống với xác suất trung hòa rủi ro.\nNhững điều cần nhớ:\nMô hình nhị thức một giai đoạn được sử dụng để ước tính giá trị tùy chọn là\ntrung bình có trọng số của xác suất trung tính rủi ro của các giá trị của nó ở trạng thái tăng và giảm\nđược chiết khấu bởi rủi ro không có rủi ro. rate.\nGiải thích cách định giá đạo hàm bằng mô hình nhị thức một kỳ\nLOS","qhtml":null},{"n":55,"q":"All else equal, an increase in storage costs on a physical commodity will most likely :","opts":["increase forward prices and increase the value of existing forward contracts.","increase forward prices and decrease the value of existing forward contracts.","decrease forward prices and decrease the value of existing forward contracts."],"ans":"A","expl":"Các nhà đầu tư nắm giữ hợp đồng kỳ hạn, thay vì tài sản cơ bản, tránh được chi phí nhưng cũng\ntừ bỏ mọi lợi ích của việc nắm giữ tài sản. Hợp đồng kỳ hạn thường được bắt đầu ở giá trị\n0; do đó, giá kỳ hạn khác với giá giao ngay ở chi phí ròng để giữ tài sản\ncơ bản cho đến khi hợp đồng kỳ hạn hết hạn.\nChi phí ròng để giữ một vị thế trong tài sản hoặc hàng hóa cơ bản được gọi là chi phí mang theo\n, phản ánh:\nchi phí như lưu trữ, bảo hiểm hoặc chi phí cơ hội của vốn và\nlợi ích như thu nhập hoặc sự tiện lợi lợi nhuận.\nKhi chi phí nắm giữ tài sản lớn hơn lợi ích, giá kỳ hạn sẽ lớn hơn\nso với giá cơ bản. Sự khác biệt là số tiền ròng được tiết kiệm bằng cách giữ chuyển tiếp\nchứ không phải số tiền cơ bản. Tất cả những điều khác đều bằng nhau, nếu chi phí lưu trữ tăng , thì giá kỳ hạn\ntăng do chi phí tránh được tăng lên (Lựa chọn C) .\nMột lợi ích tương tự sẽ dành cho những người nắm giữ hợp đồng kỳ hạn hiện tại, những người nhận ra lợi thế\ntương tự là tránh được chi phí vận chuyển cao hơn. Khi định giá các hợp đồng kỳ hạn, chi phí nắm giữ\nđược cộng vào giá giao ngay, do đó, việc tăng chi phí lưu trữ sẽ làm tăng\ngiá trị của các hợp đồng kỳ hạn hiện tại (Lựa chọn B) .\nNhững điều cần nhớ:\nGiá kỳ hạn khác với giá giao ngay bởi chi phí ròng của việc nắm giữ tài sản cơ sở cho đến khi\nhết hạn. Tất cả đều như nhau, chi phí nắm giữ tăng dẫn đến giá kỳ hạn cao hơn và\ngiá trị lớn hơn cho các hợp đồng kỳ hạn hiện tại do lợi thế lớn hơn của việc giữ\nkỳ hạn thay vì giá cơ bản.\nGiải thích sự khác biệt giữa giá giao ngay và giá tương lai dự kiến ​​của một tài sản cơ sở và chi phí\nvận chuyển liên quan đến việc nắm giữ tài sản cơ sở\nLOS","qhtml":null},{"n":56,"q":"An analyst has gathered the following information on zero-coupon government bond yields:\nMaturity Spot Rate\n1 year 2.42%\n2 years 3.05%\n3 years 3.48%\n4 years 3.65%\nIf the rates are based on a periodicity of 1, the one-year forward rate 2 years in the future\n(2y1y) is closest to:","opts":["3.72%","4.16%","4.35%"],"ans":"C","expl":"Tỷ giá kỳ hạn (hoặc tỷ giá kỳ hạn ngụ ý [IFR]) là lãi suất kỳ hạn trong tương lai. Tỷ giá kỳ hạn\nkhông phải là kỳ vọng về tỷ giá giao ngay trong tương lai; thay vào đó, chúng là lãi suất trong tương lai phản ánh\nsự khác biệt giữa tỷ giá giao ngay của các kỳ hạn khác nhau (tức là kỳ hạn), dựa trên\ngiả định rằng các chiến lược đầu tư bao trùm cùng một khoảng thời gian và mang lại giá trị tương đương\nrủi ro phải có cùng mức lợi nhuận. Trên thực tế, tỷ giá kỳ hạn là khoản tái đầu tư hòa vốn\ntỷ giá tạo ra kết quả đó. Định giá không có chênh lệch giá đảm bảo tính nhất quán của tỷ giá kỳ hạn\nvới chênh lệch tỷ giá giao ngay.\nTrong trường hợp này, số tiền đầu tư bằng nhau vào một chiến lược ngày hôm nay sẽ có cùng kết quả trong tương lai\ngiá trị vào cuối 3 năm. Để trả lời câu hỏi này, có thể áp dụng hai chiến lược đầu tư\nso sánh như sau:\nMua một trái phiếu không trả lãi định kỳ 3 năm và giữ nó cho đến khi đáo hạn (tức là bên phải của trái phiếu đầu tiên).\nphương trình trên).\nMua một trái phiếu không trả lãi định kỳ hai năm và giữ nó cho đến khi đáo hạn; khi đáo hạn, tái đầu tư\ntiền thu được từ trái phiếu không trả lãi định kỳ một năm (tức là vế trái của phương trình đầu tiên ở trên).\nHai chiến lược này được minh họa theo dòng thời gian sau:\nIFR cho lãi suất kỳ hạn 1 năm bắt đầu từ 2 năm trong tương lai (IFR ) được tính như sau:\n2,3−2\nsau:\n(Lựa chọn A) 3,72% là kết quả của việc tính toán IFR không chính xác là [(1 + giao ngay ba năm\ntỷ lệ)3\n− 1] / 2.\n(Lựa chọn B) 4,16% là lãi suất kỳ hạn 1 năm bắt đầu từ 3 năm tới.\nNhững điều cần nhớ:\nTỷ giá kỳ hạn là lãi suất kỳ hạn trong tương lai phản ánh sự chênh lệch giữa tỷ giá giao ngay của\ncác kỳ hạn khác nhau. Trên thực tế, tỷ giá kỳ hạn là tỷ lệ tái đầu tư hòa vốn dẫn đến hai\nchiến lược đầu tư có rủi ro tương đương, trong cùng khoảng thời gian và thu nhập như nhau\ntrở lại.\nXác định tỷ giá ngang giá và tỷ giá kỳ hạn, đồng thời tính tỷ giá mệnh giá, tỷ giá kỳ hạn từ tỷ giá giao ngay, tỷ giá giao ngay\ntừ tỷ giá kỳ hạn và giá trái phiếu sử dụng tỷ giá kỳ hạn.\nLOS","qhtml":null},{"n":57,"q":"A company's bonds are currently trading at a lower YTM than bonds with similar maturities but\nhave the same credit rating as those other bonds. Based only on this information, the most\nappropriate conclusion by market participants is that rating agencies are:","opts":["underestimating the company's probability of default.","overestimating the bonds' recovery rate in event of default.","slower to recognize the company's improving credit quality."],"ans":"C","expl":"Giá trị thị trường trái phiếu có thể điều chỉnh ngay lập tức khi các nhà giao dịch phản ứng với thông tin mới.\nDo đó, những thay đổi về chất lượng tín dụng của tổ chức phát hành nhanh chóng được phản ánh trong YTM trái phiếu. Ngược lại,\nxếp hạng tín dụng của cơ quan là kết quả của một quy trình nhiều bước, chậm hơn nhiều, liên quan đến việc\nxếp hạng trái phiếu bởi một nhóm các nhà phân tích và được ủy ban xếp hạng phê duyệt.\nSự khác biệt về thời gian này có nghĩa là những thay đổi về chất lượng tín dụng có thể được thị trường\nnhận ra rõ ràng trước khi được phản ánh trong xếp hạng tín dụng sửa đổi. Lợi tức trái phiếu\ncủa công ty thấp hơn so với các trái phiếu khác có cùng mức xếp hạng tín dụng và thời gian đáo hạn rất có thể có nghĩa là\nchất lượng tín dụng của công ty đã được cải thiện. Rủi ro tín dụng giảm được phản ánh bởi\nYTM thấp hơn trên thị trường trước khi nó được ghi nhận trong nâng cấp xếp hạng tín dụng.\n(Lựa chọn A) Nếu các cơ quan xếp hạng đánh giá thấp xác suất vỡ nợ thì thị trường kỳ vọng\nxác suất vỡ nợ cao hơn và yêu cầu YTM cao hơn (không thấp hơn) so với các trái phiếu\ntương tự, để bù đắp cho rủi ro lớn hơn.\n(Lựa chọn B) Nếu các cơ quan xếp hạng đánh giá quá cao tỷ lệ phục hồi (và do đó\nđánh giá thấp mức độ nghiêm trọng của tổn thất), thì thị trường dự kiến tổn thất do vỡ nợ sẽ lớn hơn\nđược phản ánh trong xếp hạng tín dụng. Khoản lỗ dự kiến ​​lớn hơn khiến trái phiếu trở nên kém giá trị hơn và dẫn đến\nYTM cao hơn (không thấp hơn) so với các trái phiếu tương tự.\nNhững điều cần nhớ:\nThị trường có thể ngay lập tức định giá lại trái phiếu và điều chỉnh YTM của chúng để đáp ứng với thông tin\nmới. Xếp hạng tín dụng chỉ thay đổi sau một quy trình chính thức, bao gồm cả việc đánh giá lại\nmức độ tin cậy. Do đó, những thay đổi về xếp hạng tín dụng có xu hướng khiến thị trường chậm trễ trong việc nhận biết\nnhững thay đổi về chất lượng tín dụng.\nMô tả cách sử dụng xếp hạng của các cơ quan xếp hạng tín dụng và những hạn chế của chúng.\nLOS","qhtml":null},{"n":58,"q":"Which of the following would most likely be a red flag when performing hedge fund due\ndiligence?","opts":["The fund's benchmark is the risk-free rate plus 200 basis points.","The fund has three unique investment strategies, all run by a single individual.","The fund has a 12-month lockup period and a 90-day redemption notice policy."],"ans":"B","expl":"Danh sách kiểm tra thẩm định đầu tư thay thế\nKinh nghiệm của nhóm, rủi ro của người chủ chốt và danh tiếng\nDanh tiếng của các nhà cung cấp dịch vụ bên thứ ba (ví dụ:\nTổ chức\nkiểm toán viên, nhà môi giới chính)\nHồ sơ theo dõi gần đây và dài hạn\ndanh mục đầu tư\nChiến lược, quy trình đầu tư và hình thành ý tưởng\nquản lý\nKiểm soát nội bộ, báo cáo tài chính đã được kiểm toán,\ntần suất báo cáo\nHoạt động\nPhương pháp định giá và kiểm soát\nSự độc lập của giám đốc rủi ro với danh mục đầu tư\nra quyết định\nChính sách rủi ro\nGiới hạn quỹ/vị thế, đòn bẩy, chính sách phòng ngừa rủi ro\nCơ cấu quỹ và đăng ký pháp lý\nVụ kiện tụng hiện tại hoặc trước đây chống lại quỹ hoặc\nRủi ro pháp lý\nhiệu trưởng\nPhí, khóa, thời gian thông báo quy đổi\nĐiều khoản của\nChính sách lãi suất, phân phối\nđầu tư\nViệc thực hiện thẩm định đối với các nhà quản lý đầu tư thay thế đòi hỏi một quy trình chặt chẽ vì\ncác khoản đầu tư thường phải chịu rủi ro hoạt động, tài chính và đối tác gia tăng\nso với các công ty đầu tư và quản lý tiền truyền thống.\nCác yếu tố chính của quá trình thẩm định quỹ phòng hộ bao gồm việc đánh giá rằng người quản lý:\ncó thể thực hiện hiệu quả chiến lược đầu tư,\ncó chiều sâu tổ chức, cơ cấu và chính sách phù hợp, và\ncó các điều khoản quỹ hợp lý trong bối cảnh của chiến lược.\nTrong trường hợp này, một cá nhân quản lý cả ba khoản đầu tư của công ty\nchiến lược tạo thành một lá cờ đỏ. Tình huống này đặt ra mối lo ngại nghiêm trọng đối với người chủ chốt\nrủi ro, sự cống hiến các nguồn lực thích hợp cho từng sản phẩm và sự quan tâm của người quản lý.\nkhối lượng công việc tổng thể.\n(Lựa chọn A) Tiêu chuẩn mà quỹ phòng hộ sẽ đánh giá phải luôn là\ncó sẵn. Nhiều quỹ phòng hộ cố gắng đạt được lợi nhuận tuyệt đối dương, do đó, một chuẩn mực gắn liền với\nlãi suất phi rủi ro cộng với phần bù rủi ro có thể phù hợp.\n(Lựa chọn C) Chính sách khóa và thông báo mua lại là phổ biến trong các quỹ phòng hộ, và những chính sách này\ncác điều khoản không nằm ngoài quy định của ngành.\nNhững điều cần nhớ:\nCác yếu tố chính của quá trình thẩm định quỹ phòng hộ bao gồm việc đánh giá liệu người quản lý (1) có thể\nthực hiện hiệu quả chiến lược đầu tư, (2) có chiều sâu tổ chức phù hợp,\ncơ cấu và chính sách, và (3) có các điều khoản quỹ hợp lý trong bối cảnh\nchiến lược.\nSo sánh các phương thức đầu tư trực tiếp, đồng đầu tư và huy động vốn để thay thế\nđầu tư\nLOS","qhtml":null},{"n":59,"q":"Which of the following is least likely to benefit from distributed ledger technology (DLT)?","opts":["Algorithmic trading","Compliance processes","Post-trade clearing and settlement"],"ans":"A","expl":"Công nghệ sổ cái phân tán (DLT): Ứng dụng quản lý đầu tư\nỨng dụng\nXác nhận việc tạo và giao dịch tiền kỹ thuật số; cho phép\nTiền điện tử\nxác minh quyền sở hữu\nMã thông báo vật lý Gán một \"mã thông báo\" quyền sở hữu cho tài sản vật chất; cho phép\nchuyển giao tài sản và xác minh quyền sở hữu\nThanh toán sau giao dịch và\nHợp lý hóa việc xác nhận, thanh toán bù trừ và thanh toán giao dịch\nthanh toán\nCho phép truy cập gần như theo thời gian thực vào dữ liệu giao dịch và vị trí;\nTuân thủ\nhợp lý hóa các quy trình\nCông nghệ sổ cái phân tán (DLT) là một phương pháp lưu giữ hồ sơ phi tập trung bằng cách sử dụng\nsổ cái điện tử chứa các giao dịch được chia sẻ giữa nhiều người dùng trong mạng. Trong\nngành quản lý đầu tư, DLT được áp dụng để hợp lý hóa nhiều nhiệm vụ lặp đi lặp lại và tốn nhiều công sức\n, chẳng hạn như các quy trình thanh toán, thanh toán và tuân thủ sau giao dịch (Lựa chọn\nB và C).\nVới DLT, tất cả người dùng trong mạng được kết nối với tất cả người dùng khác, có một bản sao giống hệt của\nsổ cái và có thể xem tất cả giao dịch. Các giao dịch không được thực hiện bởi cơ quan trung ương\nchẳng hạn như cơ quan thanh toán bù trừ. Thay vào đó, mỗi người dùng nhập các giao dịch của riêng mình, sau đó\nthông báo cho tất cả những người dùng khác, những người này xác nhận và xác thực giao dịch cũng như phê duyệt\nsổ cái được cập nhật.\nGiao dịch thuật toán (AT) đề cập đến chứng khoán giao dịch dựa trên các tiêu chí định trước\nđược lập trình thành một thuật toán hoạt động mà không cần sự tương tác của con người. Thuật toán phải\nthích ứng với điều kiện thị trường thay đổi thông qua việc sử dụng trí tuệ nhân tạo (AI). AT là một\nví dụ về fintech trong quản lý đầu tư nhưng không phải là công nghệ\nhưởng lợi trực tiếp hoặc sử dụng DLT .\nNhững điều cần nhớ:\nCông nghệ sổ cái phân tán đề cập đến sổ cái điện tử phi tập trung của các giao dịch được\nchia sẻ giữa nhiều người dùng trong một mạng. Trong ngành quản lý đầu tư, DLT\nđược áp dụng để hợp lý hóa nhiều nhiệm vụ lặp đi lặp lại và tốn nhiều công sức, chẳng hạn như thanh toán bù trừ sau giao dịch,\nquyết toán và các quy trình tuân thủ.\nMô tả các ứng dụng tài chính của công nghệ sổ cái phân tán\nLOS","qhtml":null},{"n":60,"q":"An investor places a buy-stop, all-or-nothing order for a security. The type of instruction(s)\nrelating to this order is (are) best described as:","opts":["validity instructions only.","execution instructions only.","both validity and execution instructions."],"ans":"C","expl":"Hướng dẫn thực hiện so với hướng dẫn hợp lệ\nCác loại lệnh thị trường Ví dụ\nThị trường: lệnh được thực hiện ngay lập tức ở mức giá tốt nhất hiện có\nGiới hạn: lệnh được khớp ở mức giá ngưỡng hoặc cao hơn\nHướng dẫn thực hiện\nTất cả hoặc không (AON): toàn bộ lệnh được khớp hoặc bị hủy\nNgày: hết hạn vào cuối ngày giao dịch\nDừng: tùy thuộc vào một mức giá được chỉ định để kích hoạt hành động\nHướng dẫn về hiệu lực Good-till-canceled (GTC): lệnh có hiệu lực cho đến khi bị hủy\nThị trường đóng cửa (MOC): lệnh được thực hiện ở giá đóng cửa trong ngày\nLệnh mua hoặc bán chứng khoán có thể bao gồm cả hướng dẫn thực thi và hiệu lực\n. Hướng dẫn thực thi giải quyết cách thực hiện một đơn đặt hàng liên quan đến:\nGiá mua hoặc bán.\nKích thước (tức là số lượng) của đơn đặt hàng.\nHướng dẫn về hiệu lực đề cập đến thời điểm có thể thực hiện một đơn hàng, cũng như thời gian mà một đơn hàng\nkhông được thực hiện sẽ vẫn mở trước khi hết hạn. Lệnh dừng là một loại lệnh hợp lệ. Lệnh dừng\nkhông thể thực thi được cho đến khi chứng khoán được giao dịch ở mức giá kích hoạt\nđược chỉ định trước (tức là giá dừng). Lệnh dừng mua không thể được thực hiện cho đến khi chứng khoán được giao dịch ở mức giá\nbằng hoặc cao hơn giá dừng .\n\"Tất cả hoặc không có gì\" đề cập đến số lượng chứng khoán được mua hoặc bán ; do đó, nó\nlà một loại lệnh thực thi. Nhà đầu tư trong câu hỏi này lẽ ra phải cho biết số lượng\ncổ phiếu sẽ được mua theo lệnh dừng mua. Tuy nhiên, bằng cách thêm lệnh tất cả hoặc\nkhông có gì, bên trung gian không thể thực
