and may have to incur levels of debt that are greater than its actual funding\nneeds (Choice B) .\n(Choice C) The ability to refinance quickly is associated with aggressive approaches, which\nrely heavily on short-term financing and can take advantage of decreases in interest rates by\nswitching debt instruments.\nThings to remember:\nA conservative approach to working capital management combines a larger amount of current\nassets and less dependence on short-term financing. This approach increases financial\nstability during disruptions and reduces rollover risk, but it is also more expensive and does\nnot allow the firm to borrow only as needed.\nDescribe issuers’ objectives and compare methods for managing working capital and liquidity\nLOS", "qhtml": null}, {"n": 28, "q": "Shares are least likely to be bought on margin for:", "opts": ["exchange-traded funds.", "open-end mutual funds.", "closed-end mutual funds."], "ans": "B", "expl": "Exchange-traded Open-end\nCharacteristics Closed-end fund\nfund (ETF) mutual fund\nContinuously issued Fixed quantity of Continuously issued\nShares\nand redeemed shares issued and redeemed\nPurchases and redemptions Exchange traded Exchange traded Fund sponsor\nPricing Continuously Continuously End of day\nTrades at NAV Usually close to NAV Usually at a discount Yes\nEligible for short sale Yes Yes No\nCan be purchased on margin Yes Yes No\nNAV = net asset value\nBuying securities on margin means that the investor is borrowing part of the purchase\nprice from the broker. If the securities decline in value below a certain point, the broker will\nissue a margin call, demanding that the investor immediately post additional cash or other\ncollateral to protect the broker's margin loan. If the investor fails to do so, the broker can sell\nthe securities during the trading day and apply the proceeds toward satisfying the loan.\nThis process cannot work with shares of an open-end mutual fund. These shares are traded\ndirectly between the investor and the fund, and they trade only once per day after the\nmarkets have closed and the fund has calculated each share's price. The shares cannot be\nsold during the trading day if they are losing value and require liquidation to meet a margin\ncall. Therefore, open-end mutual fund shares cannot be bought on margin.\n(Choices A and C) Shares of exchange-traded funds and closed-end mutual funds are\nbought and sold between investors and traded on exchanges just like individual stocks and\nbonds. Since they can be traded during the trading day, they can be bought on margin.\nThings to remember:\nBuying securities on margin means that the investor is borrowing part of the purchase price\nfrom the broker. If necessary, the broker can sell the securities during the trading day if they\ndecline in value. Since open-end mutual fund shares are bought and sold only after the\ntrading day has ended, they cannot be bought on margin.\nDescribe mutual funds and compare them with other pooled investment products\nLOS", "qhtml": null}, {"n": 29, "q": "A company is analyzing two mutually exclusive three-year projects with conventional cash\nflows:\nCash Flows (£ millions)\nYear 0 1 2 3 IRR\nProject A −60 12 30 55 22.2%\nProject B −80 60 45 5 24.3%\nIf the hurdle rate is 8% and there are no other cash flows, then based on the IRR and NPV\ncriteria, the best investment decision is to invest in:", "opts": ["A only.", "B only.", "both A and B."], "ans": "A", "expl": "NPV and IRR criteria are commonly used to make capital investment decisions. The general\nrule is to accept a project if :\nthe project's NPV is positive or\nthe project's IRR is greater than the required rate of return (ie, hurdle rate).\nFor independent projects with conventional cash flows, the NPV and IRR lead to the same\ninvestment decision. When a project has a positive NPV, IRR will always be greater than the\nproject's required rate of return, and vice versa.\nIRR and NPV can produce conflicting rankings when projects are mutually exclusive (ie, the\nfirm can accept only one project). NPV is a better criterion than IRR since the NPV model:\nshows the amount of value added to the firm, whereas IRR shows only the rate of return,\nnot the actual value added. In this case, Project B has a higher IRR (24.3%) that\ntranslates into a lower NPV of £18.10 million (as per the calculations below). The\ngreater the NPV, the more value added to the firm.\nuses a more conservative reinvestment rate. The discounted cash flow analysis implicitly\nassumes cash flows are reinvested at the discount rate, which is the required rate of\nreturn (for NPV) or the IRR. Required rates of return are returns that could be earned on\nequivalent projects, so NPV reflects a more realistic reinvestment assumption.\nThe company should choose Project A since the projects are mutually exclusive and Project A\nhas a greater NPV than Project B.\n(Choice B) Project B has a higher IRR than Project A but a smaller NPV, and the NPV\ncriterion should be used when projects are mutually exclusive.\n(Choice C) The projects are mutually exclusive; therefore, only one project can be selected.\nThings to remember:\nNPV and IRR criteria are used to make capital investment decisions, but these criteria can\nproduce conflicting rankings for mutually exclusive projects. Companies should select the\nproject with the greatest NPV, since it adds the most value to the firm. In addition, NPV\nanalysis is a better criterion since it uses a more conservative reinvestment rate than IRR.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return\n(IRR), and return on invested capital (ROIC), and contrast their use in capital allocation\nLOS", "qhtml": null}, {"n": 30, "q": "If securities are issued in the structured finance sector, which of the following is most\nlikely the issuer?", "opts": ["A special legal entity holding a collateral pool of securitized assets.", "A nonsovereign government imposing a special tax to repay a bond.", "A business pledging operating assets it owns as collateral on a debt issue."], "ans": "A", "expl": "One way to define fixed-income market sectors is by the type of issuer. Most issuer sectors\nconsist of bonds sold by existing organizations (eg, governments, corporations) to fund\ninvestments or ongoing operations.\nStructured finance refers to securities issued by special legal entities (SLEs) to fund the\npurchase of an asset portfolio. The asset portfolio's cash flows are used to pay the\ninterest and principal on the securities issued by the SLE.\nA sponsor organizes the SLE (eg, trust) and arranges for the transfer of assets (eg,\nmortgages, auto loans) into the SLE to create a collateral pool (ie, asset portfolio). This is the\nprocess of asset securitization; the securities issued by the SLE are known as asset-backed\nsecurities (ABS). Once assets are transferred to an SLE, the SLE becomes the legal owner,\nand the original lender no longer has an economic interest in the assets.\n(Choice B) Nonsovereign government bonds to be repaid by revenues from a special tax are\na type of revenue bond. Such securities are a type of traditional debt instrument and are not\npart of the structured finance sector.\n(Choice C) Company debt with operating assets pledged as collateral is a type of secured\nbond. Secured bonds are part of the corporate sector since they are direct obligations of the\nissuing corporation.\nThings to remember:\nStructured finance refers to securities issued by a special legal entity (SLE) created to hold an\nasset portfolio. The asset portfolio's cash flows are used to pay the interest and principal on\nthe securities issued by the SLE. Such securities are known as asset-backed securities (ABS).\nDescribe the features of a fixed-income security.\nLOS", "qhtml": null}, {"n": 31, "q": "A feature of spot curves is that bond yields-to-maturity most likely assume that bonds are:", "opts": ["priced at par.", "coupon bonds.", "free of default risk."], "ans": "C", "expl": "Different yield curves\nYield curve Underlying Yields\nSpot curve YTMs on zero-coupon bonds\nPar curve YTMs if the bonds are priced at par\nYTM are implied forward rates that link shorter-term,\nForward curve zero-coupon bond yields to longer-term, zero-coupon\nyields\nYield curves are ideally constructed using bonds with the same characteristics, such\nas maturity, coupon rate and frequency, credit risk, liquidity, tax status , etc. It is\nunlikely that bonds fitting all these criteria will be readily available, so the most practical\nsolution is to create a spot curve using a series of government zero-coupon bonds with various\nmaturities.\nThis is the preferred solution since these bonds have many common features: the same issuer,\nliquidity, and tax status. Since they are government bonds, they are assumed to have\nno default risk and as zero-coupon bonds, they have no reinvestment risk.\nNote that bonds issued by any government always have some risk of default and that some\nsovereign issuers are riskier than others, but it is generally assumed that bonds issued by\ngovernments of certain nations are effectively free of default risk .\n(Choice A) A par curve is designed so that the bonds represented by the YTMs at every point\nof the curve are priced at par. This assumption does not apply to spot curves.\n(Choice B) A spot curve is compiled using YTMs of zero-coupon government bonds.\nThings to remember:\nA spot curve is derived from the YTMs of a series of zero-coupon government bonds, which do\nnot bear default or reinvestment risk. Unlike par curves, spot curves do not make any\nassumption about bond price.\nCompare the spot curve, par curve, and forward curve.\nLOS", "qhtml": null}, {"n": 32, "q": "A company targeted for a private equity leveraged buyout (LBO) is most likely to be a:", "opts": ["public company with a depressed stock price.", "private company with significant intangible assets.", "private company that is efficiently managed and operated."], "ans": "A", "expl": "Characteristics of attractive LBO target companies\nDepressed/undervalued stock price\nAgreeable management and shareholders\nInefficient operations\nRobust and predictable cash flow\nLow leverage\nUnencumbered physical assets\nA leveraged buyout (LBO) occurs when a private equity (PE) firm purchases a controlling\nmajority of the outstanding shares of a private or public company and the purchase is\nfinanced with a significant amount of debt . The borrower is the company being\nacquired, not the PE firm. The company's assets serve as collateral for the loan, and its cash\nflows pay the interest and principal on the debt.\nDue to the highly leveraged nature of the transaction, prudent company selection is critical to\nan LBO's success. Acquirers look for firms that can:\nservice the debt financing,\nimprove their performance, and\nincrease their value.\nPublic companies are often the target of an LBO . By targeting companies with\na depressed stock price (ie, undervalued stock), the PE firm can structure the deal at a\npremium to the current market price, thus enticing existing shareholders to sell while still\npaying less than intrinsic value for the company. Once the company's performance improves\nand its value increases, the company is sold again in the public markets or to strategic buyers.\n(Choice B) Intangible assets are difficult to appraise and use as collateral. Unencumbered\nphysical assets (ie, not intangible assets) that can be used as loan collateral make a company\nmore attractive as an LBO target.\n(Choice C) PE firms add value by improving the efficiency of inefficiently\nmanaged companies, thus raising their value.\nThings to remember:\nAn attractive target company in a leveraged buyout is one that can service the debt, improve\nits performance, and increase its value. Key characteristics are an undervalued stock price,\nagreeable management and shareholders, inefficient operations, robust and predictable cash\nflow, low leverage, and unencumbered physical assets.\nExplain features of private equity and its investment characteristics\nLOS", "qhtml": null}, {"n": 33, "q": "A trader buys a company's stock on margin and sells it after one year, with the following\nrelevant information:\nShares purchased 100\nPurchase price $45\nSale price $60\nDividend $1\nCommission (per share, on both purchases and sales) $0.05\nMargin requirement 50%\nIgnoring interest costs, and assuming dividends were paid on the sale date, the return on the\ntransaction is closest to:", "opts": ["36%", "67%", "71%"], "ans": "C", "expl": "Traders often borrow money (ie, buy on margin) to finance an asset purchase .\nThe margin loan is the borrowed amount, which is combined with the trader's own funds that\nprovide equity. The position's leveraged return is the net profit (loss) , expressed as\na percentage of the initial outlay .\nNet profit (loss) is the change in price after accounting for dividends, interest, and\ntransaction costs, including purchase commissions and sales commissions.\nThe initial outlay consists of the trader's equity investment in the leveraged position, plus\ntransaction costs (eg, commissions on the purchase).\nIn this scenario, the margin is 50% since the trader pays half of the total investment. This\nresults in a leverage ratio of 2, so the trader acquires a position worth twice the invested\nequity. The gain in the stock, divided by the initial outlay, results in a 71% leveraged return.\nThis illustrates the power of leverage: if the trader had contributed the entire cost of the\ninvestment, the return would have been only 1,590 / 4,500 ≈ 35.3% (Choice A) .\n(Choice B) A return of 67% results from excluding the dividend and transaction costs from\nthe calculation.\nThings to remember:\nAn investor's return on a margin trade is the net profit (loss), expressed as a percentage of\nthe investor's own initial outlay. Net profit (loss) is the investor's profit (loss) after accounting\nfor dividends, interest, and transaction costs. The initial outlay is the investor's equity\ninvestment plus any commissions on the purchase.\nCalculate and interpret the leverage ratio, the rate of return on a margin transaction, and the\nsecurity price at which the investor would receive a margin call\nLOS", "qhtml": null}, {"n": 34, "q": "An index starts with a value of 100 and has the following returns over 3 years:\nPrice Appreciation Income\nYear 1 4.0% 2.0%\nYear 2 8.0% 1.5%\nYear 3 −4.0% 2.0%\nIf the index value is based on its total return, then its value at the end of Year 3 is closest to:", "opts": ["113.50", "113.75", "113.87"], "ans": "B", "expl": "The initial value of an index is decided at the index's initiation. Over time , the index's\nvalue will change with its returns . The return on an index can be calculated using its price\nreturn or total return.\nPrice return reflects the price change of each constituent security.\nTotal return reflects both the price change and dividend or interest income of each\nconstituent security.\nThe value of an index following multiple periods of returns is calculated as\nthe geometrically linked (ie, compounded) return, since its value in each period is\ndependent on its value and return in prior periods. When calculating total return, price\nappreciation and income are added (not compounded) for a given period since they occur\nover the same period.\nIn this question, the value of the index at the end of Year 3 is 113.75: 100(1.06)(1.095)\n(0.98). The value over time is shown in the image below:\n(Choice A) 113.50 results from summing, instead of compounding, the annual returns.\n(Choice C) 113.87 results from compounding, instead of adding, the annual returns from\nprice appreciation and income.\nThings to remember:\nThe value of an index following multiple periods of returns must be calculated as the\ngeometrically linked (ie, compounded) return. A total return index reflects both the returns\nfrom price appreciation and income. These are added, not compounded, for a given period\nsince they occur over the same period.\nCalculate and interpret the value, price return, and total return of an index\nLOS", "qhtml": "<p>An index starts with a value of 100 and has the following returns over 3 years:</p><table class=\"qtable\"><thead><tr><th></th><th>Price Appreciation</th><th>Income</th></tr></thead><tbody><tr><td>Year 1</td><td>4.0%</td><td>2.0%</td></tr><tr><td>Year 2</td><td>8.0%</td><td>1.5%</td></tr><tr><td>Year 3</td><td>−4.0%</td><td>2.0%</td></tr></tbody></table><p>If the index value is based on its total return, then its value at the end of Year 3 is closest to:</p>"}, {"n": 35, "q": "Derivative pricing uses the assumption of risk neutrality since derivatives:", "opts": ["can be replicated.", "are expected to return the risk-free rate.", "are priced at a discount to the underlying asset to offset the derivatives' greater risk."], "ans": "A", "expl": "Derivative pricing concepts\nTraders take advantage of any mispricing of\nderivatives\nRiskless strategies are created from offsetting\nArbitrage-free\npositions in derivatives and underlying assets\nStrategies are pursued until risk-free profits are\neliminated (ie, no-arbitrage pricing)\nDerivatives can be created synthetically from\nunderlying and risk-free assets\nReplication\nEquivalent positions must have the same expected\nreturns\nDerivative price reflects the value of the replicating\nstrategy\nRiskless positions are created from long/short\nRisk-neutral\nderivatives and replication strategies\nRiskless positions earn a risk-free rate of return;\ncash flows are discounted at the risk-free rate\nReplication and arbitrage are the foundations of derivative pricing. Investors can replicate\nassets by combining positions in derivatives and the risk-free asset. Economically equivalent\npositions should trade at prices that result in equal returns. If that condition does not\nhold, arbitrage occurs until prices adjust so that risk-free profits can no longer be earned.\nTherefore, derivatives trade at arbitrage-free prices.\nUnder these pricing conditions, investors can create riskless positions (eg, long stock index\nand short stock index futures), which earn a risk-free rate of return. The ability to create\nriskless positions and arbitrage-free pricing means that risk aversion has no role in derivative\npricing. Therefore, investor risk neutrality is assumed in derivative pricing .\n(Choice B) Since a long or short position in derivatives is not risk free, its expected returns\nwould not be equal to the risk-free rate. Risk-free securities (eg, government T-bills) have\nexpected returns equal to the risk-free rate.\n(Choice C) Derivatives can trade at either a discount or premium to the underlying and still\nbe fairly valued. Any difference between underlying and derivative prices reflects cost of carry\narbitrage pricing, not an adjustment for the relative riskiness.\nThings to remember:\nInvestors can replicate assets using derivatives and the risk-free asset and they can also\ncreate riskless positions using derivatives and the underlying asset. Therefore, derivative\nvaluation is based on arbitrage-free pricing. Since arbitrage strategies are riskless, investor\nrisk neutrality is assumed in derivative pricing.\nExplain how the concepts of arbitrage and replication are used in pricing derivatives\nLOS", "qhtml": null}, {"n": 36, "q": "According to the Efficient Market Hypothesis, if a market is semi-strong form efficient, active\nmanagement's net-of-fees returns to investors are most likely :", "opts": ["less than passive management's.", "equivalent to passive management's.", "greater than passive management's."], "ans": "A", "expl": "The Efficient Market Hypothesis (EMH) specifies three forms of market efficiency: weak, semi-\nstrong, and strong. Market efficiency is determined by how quickly and completely\ninformation is reflected in asset prices. If a market is truly efficient, abnormal returns cannot\nbe achieved on a consistent basis with the information available.\nThe semi-strong form of efficiency assumes that asset prices reflect all historical market\ndata plus all publicly available information (eg, financial statement information). New\npublic information is quickly assimilated into prices, so an investment manager cannot\ncapitalize on events such as earnings surprises to achieve abnormal returns.\nActive portfolio management normally uses more frequent trading to exploit perceived\ninefficiencies. Active management therefore incurs higher trading and information acquisition\ncosts than passive management, which instead seeks to replicate the performance of the\nmarket or an index. As a result, when a market is truly semi-strong form efficient, net-of-fees\nreturns from passive management will, on average, outperform\nactive portfolio management with its higher costs (Choices B and C) .\nThings to remember:\nUnder the semi-strong form of the Efficient Market Hypothesis (EMH), all publicly available\ninformation is reflected in asset market prices. Semi-strong form EMH implies that since\nactive management incurs higher transaction costs, passive management will outperform net\nof fees.\nExplain the implications of each form of market efficiency for fundamental analysis, technical\nanalysis, and the choice between active and passive portfolio management\nLOS", "qhtml": null}, {"n": 37, "q": "An incumbent company with strong pricing power is most likely to be in an industry that\nexhibits a:", "opts": ["low degree of industry concentration and stable market share.", "high degree of industry concentration and stable market share.", "high degree of industry concentration and unstable market share."], "ans": "B", "expl": "Investors use strategic industry analysis to understand and assess the competitiveness of an\nindustry. Strategic industry analysis includes analyzing the following:\nBarriers to entry: how easy it is for new competitors to enter the industry\nConcentration: number of players in an industry and their relative market shares\nCapacity: quantity of goods or services that can be delivered based on existing\ninvestment compared with industry demand\nMarket share stability: degree of fluctuation in competitors' market shares\nStrong pricing power for incumbents is most associated (with exceptions) with industries\nthat exhibit greater barriers to entry, high industry concentration , limited industry capacity,\nand stable market share distribution.\nIn highly concentrated industries (eg, soft drinks), competitors typically are better able to\ncoordinate pricing movements and have more to lose than gain from price competition. Stable\nmarket share distribution typically indicates that competitors have differentiated products or\n\"sticky\" customer bases due to brand loyalty or high customer switching costs (eg, wireless\ntelecom carriers). This allows competitors to maintain prices.\n(Choice A) Industries with low degrees of industry concentration typically have fierce\ncompetition (especially among smaller firms looking to gain market shares), which weakens\nincumbents' pricing power.\n(Choice C) Unstable market shares typically indicate low customer switching costs, which\nforce incumbents to match competitors' prices, or a high threat of new entrants with\ntechnological advantages. These qualities weaken incumbents' pricing power.\nThings to remember:\nInvestors use strategic industry analysis to understand and assess the competitiveness of an\nindustry. Greater pricing power for incumbents is most associated with industries with greater\nbarriers to entry, high industry concentration, low industry capacity, and stable market shares.\nAnalyze an industry’s structure and external influences using Porter’s Five Forces and PESTLE\nframeworks\nLOS", "qhtml": null}, {"n": 38, "q": "An analyst has compiled the following pricing data on a commodity:\nPrices in ¥\nSpot 700\n1-month futures 750\n2-month futures 800\n3-month futures 870\n4-month futures 930\n5-month futures 950\n6-month futures 990\nThe commodity's forward curve is best described as:", "opts": ["being in backwardation.", "having negative roll yield.", "reflecting a convenience yield that exceeds storage costs."], "ans": "B", "expl": "The three sources of return for commodity futures contracts are roll yield, collateral yield, and\nthe change in the spot price. Roll yield is the return (positive or negative) that occurs when\na commodity's futures prices converge with the spot price (or the next futures contract) as\nthe contract approaches expiration. The shape of the commodity's forward curve plays a\ncritical role in determining roll yield.\nContango occurs when the forward curve is upward sloping since the futures price\nis greater than the spot price. When the futures contract \"rolls down\" to the lower spot price,\nthe roll yield is negative for a trader with a long futures position, as in this scenario.\nBackwardation occurs when the forward curve is downward sloping since the futures price\nis less than the spot price. When the futures contract \"rolls up\" to the higher spot price, the\nroll yield is positive for a trader with a long futures position (Choice A) .\n(Choice C) A forward curve in contango results from the convenience yield being less\nthan storage costs.\nThings to remember:\nRoll yield is the return (positive or negative) that occurs when futures prices converge with the\nspot price as a futures contract approaches expiration. When the forward curve is upward\nsloping and in contango, the roll yield is negative for a trader with a long futures position.\nExplain features of raw land, timberland, and farmland and their investment characteristics\nLOS", "qhtml": null}, {"n": 39, "q": "For European options, the difference between put-call parity and put-call-forward parity\nis most likely that the forward contract:", "opts": ["replaces the risk-free bond.", "replaces the strike price of the call option.", "is combined with a risk-free bond to replace the asset."], "ans": "C", "expl": "Put-call parity forms the foundation of put-call-forward parity. Put-call parity asserts that\na protective put and fiduciary call constructed with European options on the same underlying\nasset and with the same strike price and expiration have the same payoff; therefore, at any\ntime prior to maturity the values of the protective put and fiduciary call are equal.\nIn put-call-forward parity the protective put portfolio is created by replacing the\nunderlying with an equivalent synthetic asset ( S ). The synthetic asset consists of a long\nforward contract and a risk-free zero-coupon bond with a face value equal to the asset's\nforward price . Entering into a forward contract costs nothing, so the value of the synthetic\nasset at Time 0 is simply the zero-coupon bond's present value.\nAt expiration, the value of the maturing zero-coupon bond could be used to purchase the\nunderlying asset by exercising the forward contract.\n(Choice A) The forward contract does not replace the risk-free bond. In fact, it requires the\naddition of a risk-free bond to the protective put portfolio.\n(Choice B) The forward contract is part of the protective put portfolio, not the fiduciary call\nportfolio. Therefore, the forward contract does not replace the strike price of the call option.\nThings to remember:\nPut-call-forward parity can be derived from put-call parity by replacing the underlying asset\nwith an equivalent synthetic asset: a long forward contract and a long risk-free zero-coupon\nbond with a face value equal to the asset's forward price. Entering into a forward contract\ncosts nothing, so the value of the synthetic asset at Time 0 is simply the zero-coupon bond's\npresent value.\nExplain put–call forward parity for European options\nLOS", "qhtml": null}, {"n": 40, "q": "The following table shows a series of annual spot rates:\nMaturity (years) Spot Rate (%)\n1 1.05\n2 2.33\n3 2.90\nThe 1-year rate available in 2 years is closest to:", "opts": ["3.47%", "4.05%", "6.04%"], "ans": "B", "expl": "A forward rate for a period can be derived by using:\nthe forward rates from prior periods or\ntwo spot rates from a spot curve (ie, series of spot rates).\nA forward rate can be interpreted as a marginal return that would make\ninvestors extend their horizons by one period (eg, 1 year). In this instance, the return on\na 3-year bond is equivalent to the return on a 2-year bond plus the marginal return of\nextending the bond for 1 year. That marginal return is a 1-year rate available in 2 years\n(ie, 2y1y ) and can be calculated using 2-year and 3-year spot rates.\nThe rate given as 2y1y is solved as follows:\nExpressed as a percentage, 2y1y is 4.05%.\n(Choice A) 3.47% results from using the correct spot rates but applying exponents of 1 and\n2.\n(Choice C) 6.04% results from using the 1-year and 2-year spot rates.\nThings to remember:\nA forward rate for a period can be derived by calculating the forward rates for prior periods or\nby using two spot rates from a spot curve. The forward rate represents the added marginal\nreturn that would make investors extend their horizons to a later maturity.\nDefine par and forward rates, and calculate par rates, forward rates from spot rates, spot rates\nfrom forward rates, and the price of a bond using forward rates.\nLOS", "qhtml": null}, {"n": 41, "q": "A bond that matures in four years has a 5% annual coupon rate with interest paid\nsemiannually. If the market discount rate for the bond is 4.50%, the price of the bond per\n100 of par is closest to:", "opts": ["98.2075", "101.7938", "101.8118"], "ans": "C", "expl": "The price of a bond is the bond's present value: the sum of the present values of its coupon\nand principal (ie, par value) payments over the remaining time to maturity. Each cash flow is\ndiscounted by the market yield to maturity (YTM), expressed as a periodic rate, over the\nnumber of periods between the pricing date and the date each cash flow is due.\nThe quickest solution to the problem is obtained with a financial calculator, using the following\ninputs:\nNumber of periods (N) n × m = 4 × 2 = 8\nPeriodic discount rate (i) r ÷ m = 4.50% ÷ 2 = 2.25(%)\nPeriodic payments (PMT) ( c × FV ) ÷ m = (0.05 × 100) ÷ 2 = 2.5\nPar value (FV) 100\nc = coupon rate; FV = par value\nFor bonds with a compounding frequency ( m ) of more than once per year, the number of\nperiods ( N ), coupon payments (PMT), and market discount rate ( i ) must be adjusted from the\ngiven annual values to the periodic values. The market discount rate is also called the\nrequired yield or the required rate of return.\n(Choice A) 98.2075 results from using the market discount rate to determine the coupon\npayments and using the coupon rate to discount the cash flows. Note that since the bond's\ncoupon rate is greater than its yield, it is currently priced at a premium: the price must be\ngreater than the par value. Thus, any answer choice less than par value is incorrect .\n(Choice B) 101.7938 would be the price if the bond paid coupons once per year.\nThings to remember:\nThe price of a bond is the present value of its coupon and principal payments over the\nremaining time to maturity. For bonds with a compounding frequency of more than once per\nyear, the number of periods, coupon payments, and market discount rate must be adjusted\nfrom the given annual values to the periodic values.\nCalculate a bond’s price given a yield-to-maturity on or between coupon dates.\nLOS", "qhtml": null}, {"n": 42, "q": "Which of the following positions is most likely equivalent to selling a 90-day forward rate\nagreement on a 180-day interest rate?", "opts": ["Simultaneously going long a 270-day deposit and going short a 90-day deposit", "Simultaneously going long a 180-day deposit and going short a 90-day deposit", "Going long a 90-day deposit and, when that deposit matures, going long a 180-day deposit"], "ans": "A", "expl": "A forward rate agreement (FRA) is a forward contract on an interest rate. An FRA has\na reference interest rate (eg, 180-day LIBOR) instead of an underlying asset.\nBuyers (ie, long parties) lock in the interest rate they will pay in a future period.\nSellers (ie, short parties) lock in the interest rate they will receive in a future period.\nAn FRA is sold to hedge the interest rate on a future investment (eg, when making a loan) or\nto speculate on falling interest rates and earn a profit if the reference rate at expiration is\nbelow the rate set in the agreement.\nSynthetic short FRAs are created by:\nbuying longer maturity deposits (to receive an interest rate) and\nselling shorter maturity deposits (to pay an interest rate).\nIn this case, buying (ie, going long) a 270-day deposit would fix the interest rate received for\nthe term. Simultaneously selling (ie, going short) a 90-day deposit would require payment of\na fixed interest rate, thereby offsetting the interest received for the first 90 days on the 270-\nday deposit. The combination of the two deposits results in a fixed rate of interest for a\nterm of 180 days, starting 90 days in the future . That is the equivalent of selling a 90-day\nFRA on a 180-day rate.\n(Choice B) Going long a 180-day deposit and short a 90-day deposit is equivalent to selling\na 90-day FRA on a 90-day interest rate.\n(Choice C) Unlike selling an FRA, going long a 90-day deposit and buying a 180-day deposit\n90 days later does not lock in a future interest rate. The interest rate on the latter deposit is\nthe market interest rate at its purchase.\nThings to remember:\nForward rate agreements (FRAs) are forward contracts on interest rates. Selling an FRA locks\nin an interest rate to be received in a future period. Synthetic short FRAs are created by\nbuying longer maturity deposits and selling shorter maturity deposits.\nExplain how forward rates are determined for interest rate forward contracts and describe the uses\nof these forward rates.\nLOS", "qhtml": null}, {"n": 43, "q": "A stock has a spot price of £120 and pays dividends over the next year that have a present\nvalue of £5.71. Assuming there are no other costs or benefits of holding the asset and a risk-\nfree rate of 5%, the 1-year forward price (in £) of the stock is closest to:", "opts": ["114", "120", "132"], "ans": "B", "expl": "Investors can own an asset in the future either by buying it today or buying a forward contract\nto acquire the asset in the future. Arbitrage pricing guarantees that forward prices differ from\nspot prices by the net cost of carry for the underlying asset until the forward expiration. A\nforward contract's price is increased by any costs avoided and reduced by any benefits\nforegone by holding the forward contract rather than the asset.\nFor the arbitrage pricing to hold, a forward price must equal:\nT\nthe future value of the spot price [ S (1 + r ) ]\n0\nT\nless the future value of any benefits (eg, dividends) [− γ (1 + r ) ]\nT\nplus the future value of any costs [ θ (1 + r ) ].\nIn this scenario, the forward price equals the future value of the spot price less the future\nvalue of the dividend:\n(1.05)1 (1.05)1\nF ( T ) = 120 − 5.71 = 120\n0\n(Choice A) £114 results from subtracting the future value of the dividend from the current\nspot price.\n(Choice C) £132 results from adding, rather than subtracting, the future value of the\ndividend from the future value of the spot price.\nThings to remember:\nBuying a forward contract rather than the underlying asset avoids the costs and forgoes any\nbenefits of holding the asset. Arbitrage pricing enforces the relationship between forward and\nspot prices: forward prices must differ from spot prices by the net cost of holding the\nunderlying asset.\nExplain the difference between the spot and expected future price of an underlying and the cost of\ncarry associated with holding the underlying asset\nLOS", "qhtml": null}, {"n": 44, "q": "Which of the following is most appropriate to measure the interest rate risk of a bond with an\nembedded call option? A measure of:", "opts": ["yield duration.", "curve duration.", "modified duration."], "ans": "B", "expl": "Bond duration\nType Measures Applicable bonds\nPresent-value-weighted average time to\nMacaulay No embedded options\nreceipt of coupon and principal\nPercentage change in price for a given\nModified No embedded options\nchange in bond's yield-to-maturity\nPercentage change in price due to\nEffective All\nparallel shift of benchmark yield curve\nPercentage change in price due to a shift\nKey rate within a portion of benchmark yield All\ncurve\nPrice change in currency units given a\nMoney All\nchange in the appropriate yield or curve\nBonds are valued at the present value of their cash flows until maturity, using the\nYTM as the discount rate. When a bond is issued with an embedded call option,\nthe possibility of option exercise makes the cash flows uncertain. This results in\nthe bond lacking a well-defined YTM. Therefore, it is most appropriate to measure\na callable bond's interest rate risk using effective duration , which is a curve\nduration statistic .\nTo measure interest rate risk, effective duration shifts a benchmark yield curve up\nand down by the same number of basis points, rather than changing a specific\nYTM. This method better captures the way cash flows vary under different\ninterest rate scenarios for bonds without well-defined YTMs (eg, callable bonds).\n(Choices A and C) Yield durations (eg, Macaulay duration, modified duration)\nmeasure interest rate risk based on a single interest rate, the bond's YTM. Yield\ndurations are appropriate for bonds without embedded options since such bonds\nhave well-defined YTMs.\nThings to remember:\nWhen a bond is issued with an embedded call option, its cash flows are uncertain,\nand thus its YTM is not well-defined. Effective duration measures bond price\nchanges relative to a change in the benchmark yield curve, rather than a change\nin a specific YTM. Therefore, it is more appropriate for bonds without well-defined\nYTMs (eg, a bond with an embedded call option).\nExplain why effective duration and effective convexity are the most appropriate\nmeasures of interest rate risk for bonds with embedded options.\nLOS", "qhtml": null}, {"n": 45, "q": "The general partner of a private equity fund will most likely earn an incentive fee once the:", "opts": ["clawback provision has been invoked.", "committed capital has been fully drawn down.", "limited partners' initial investment has been paid back."], "ans": "C", "expl": "Private equity vs. hedge fund fee structures\nFee Private equity Hedge funds\nInternal rate of return (IRR) of a portfolio,\naccounts for all contributions and Based totally on AUM\nwithdrawals \"Committed capital\"\nManagement\nSwitches to % of assets under management inapplicable to hedge funds\n(AUM) after investing all committed capital\nBased on % of profits realized on sale of Always based on % of\nfund holdings profits (realized or not)\nIncentive Profits are not distributed (and incentive fee Fund has discretion on\nis not earned) until holdings are sold distributing realized profits\nPrivate equity (PE) funds charge both an annual management fee and an incentive fee. The\nincentive fee is based on realized profits from the sale of the fund's investments. The general\npartner (GP) (ie, fund manager) is eligible for the incentive fee once the limited\npartners (ie, investors) have received distributions equal to their initial investments .\n(Choice A) If incentive fees are paid throughout the life of the fund as investments are sold,\nthe GP may receive more than the contractually agreed upon portion of profits due to losses\non other holdings. In this situation, a clawback provision requires the GP to repay a portion of\nthe incentive fee or forfeit future incentive fees.\n(Choice B) Committed capital refers to the amount the limited partners have agreed to\nprovide the PE fund upon request to finance a new investment. A PE fund will draw down\nthese capital commitments, usually over three to five years. The incentive fee is based on\nfund performance and is not contingent on the full draw down of committed capital.\nThings to remember:\nThe incentive fee is based on realized profits from the sale of the fund's investments. Once\ninvestors have received distributions equal to their initial investment, the general partner can\nbe paid an incentive fee.\nCalculate and interpret alternative investment returns both before and after fees\nLOS", "qhtml": null}, {"n": 46, "q": "An analyst estimates a company's ratio of enterprise value (EV) to EBITDA to be 10 based on\npeer analysis. The analyst gathers the following company information:\nINR millions\nCash and cash equivalents 80\nBook value of debt 800\nMarket value of debt 725\nShort-term investments 25\nIf the company is expected to report EBITDA of INR 200 million this year, its market\ncapitalization (in INR millions) is closest to:", "opts": ["1,305", "1,355", "1,380"], "ans": "C", "expl": "Enterprise value (EV) measures the total value of a firm (ie, common equity, net debt). EV\nis also considered the takeover value, the amount an acquirer would pay for a target firm less\nthe target's cash (since cash can be used to pay down debt).\nEV multiples allow for evaluating a firm's relative value over time or compared with other\nfirms. When combined with net debt, the estimate of EV derived from the EV multiple can\nalso be used to estimate the firm's market capitalization (ie, equity value).\nIn this scenario, the analyst is estimating the market capitalization of the company based on\nits EV-to-EBITDA ratio. The formula for the EV-to-EBITDA ratio can be rearranged to solve for\nmarket capitalization as follows:\nMarket capitalization = (10 × 200) – 725 + (80 + 25) = 1,380\n(Choice A) Market capitalization of 1,305 results from using the book value of the company's\ndebt instead of the market value. The book value of a company's bonds on its balance sheet\nmay differ from the bonds' market value, which is a more current valuation.\n(Choice B) Market capitalization of 1,355 results from not subtracting short-term\ninvestments.\nThings to remember:\nEnterprise value (EV) measures the total value of a firm. When combined with net debt, the\nestimate of EV derived from the EV multiple can also be used to estimate the firm's market\ncapitalization.\nDescribe enterprise value multiples and their use in estimating equity value\nLOS", "qhtml": null}, {"n": 47, "q": "A style index would most likely contain which of the following constituents?", "opts": ["The smallest 200 stocks in a region", "All consumer goods companies within a country", "A representation of indexes from countries deemed emerging markets"], "ans": "A", "expl": "Categories of equity indexes\nMost securities of an entire equity\nBroad Russell 3000, Wilshire 5000\nmarket\nmarket (both cover US equities)\nBlends indexes from different\ncountries\nMSCI All Country World\nMulti-market\nProxy for regional or global\nIndex and MSCI EAFE Index\ninvesting\nBased on same sector (eg,\nfinance, health care)\nCan be different sizes (eg, large\ncap, small cap) and different\nSector European energy index\nstyles (ie, value vs. growth)\nCan be national, regional, or\nglobal\nCan be different sectors\nBased on same size (eg, large\ncap) or style (ie, value vs.\nStyle Asian large-cap index\ngrowth)\nCan be national, regional, or\nglobal\nAn equity index is a collection of stocks based on a common element such as their style,\nsector, or geographical location. Multimarket indexes can also be based on other indexes. An\nindex is intended to indicate the aggregate performance of the category that it benchmarks.\nStyle indexes contain stocks of a single investment factor (eg, growth, value), similar\nsize (eg, large cap, small cap), or combination of the two (eg, small-cap growth). These\nindexes can be regional or global and are intended to replicate common investing styles.\nStyle indexes based on size can use either an absolute size (eg, less than €1 billion market\ncap) or relative size (eg, smallest 100 public companies in the eurozone). In this question, a\nstyle index would most appropriately contain the smallest 200 stocks in a region since that is\nthe only constituent based on size or investment factor.\n(Choice B) All consumer goods companies within a country would be in a sector index , which\nis composed of companies that operate or compete in the same general type of business.\n(Choice C) A representation of indexes from countries deemed emerging markets would be\nin a multimarket index . Indexes of this type can be based on specific geographic zones,\nstages of economic development (eg, emerging market), or global financial markets.\nThings to remember:\nStyle indexes contain stocks of a single investment factor, similar size, or combination of the\ntwo. These indexes are intended to replicate common investing styles. Style indexes based\non size can use either absolute or relative size.\nDescribe types of equity indexes\nLOS", "qhtml": null}, {"n": 48, "q": "The ex-dividend date is best described as the date when:", "opts": ["the company pays the dividend.", "the company declares the amount and timing of the dividend.", "the stock trades for the first time without the right to the dividend."], "ans": "C", "expl": "The ex-dividend date (ie, ex-date) is the first day that a company's shares trade without\nrights to the dividend . Since shares purchased on or after the ex-date do not convey the\nright to receive the dividend, the share price typically falls by the amount of the dividend on\nthe ex-date.\nThe ex-dividend date is directly tied to the settlement process (eg, T + 2) since shares\npurchased on or after the ex-dividend date settle after the holder-of-record date (ie, record\ndate).\n(Choice A) The dividend payment date is announced when the company declares the\ndividend and is the day the company will actually transfer funds to those entitled to the\ndividend.\n(Choice B) The declaration date is the date the company announces the specifics of the\ndividend (eg, size, payment date). Since the declaration date is often weeks or months before\nthe record date, the shares can still be bought with rights to the dividend.\nThings to remember:\nThe ex-dividend date is the first day that a company's shares trade without rights to the\ndividend. The ex-dividend date is directly tied to the settlement process since shares\npurchased on or after the ex-dividend date settle after the holder-of-record date.\nDescribe dividend payment chronology\nLOS", "qhtml": null}, {"n": 49, "q": "A recently launched hedge fund that is subject to a prime broker's margin call will most\nlikely benefit from a:", "opts": ["drawdown.", "lockup period.", "committed capital drawdown."], "ans": "B", "expl": "Hedge fund investor redemption restrictions\nMinimum time an investor is committed\nto the fund before withdrawals are\nLockup period\nallowed\nUsually less than 2 years\nRequires investor to notify the fund of\nplanned redemption\nRedemption notice period\nUsually 30−90 days\nHedge funds commonly use leverage to implement investment strategies by borrowing from\na prime broker. If the equity value of the account drops below a minimum level, a margin\ncall is issued. The fund is then forced to reduce its leverage, usually by liquidating existing\npositions.\nMargin calls can magnify losses for a hedge fund since the forced liquidation creates a\nnegative feedback loop: the selling forced by the margin call drives the price down even more,\nleading to investor redemptions, which force more selling, etc.\nRedemption notices and lockup periods help protect a hedge fund from investor\nredemptions that would further worsen its position. In this scenario, most if not all investors\nin the recently launched hedge fund will be subject to a lockup period, restricting withdrawals\nimmediately following their initial investments.\n(Choice A) A drawdown is a reduction in a hedge fund's net asset value below the high-\nwater mark, not a helpful development during a margin call.\n(Choice C) Committed capital refers to an amount the limited partners in a private equity\n(PE) fund (ie, not a hedge fund), agree to provide the fund upon request to finance a new\ninvestment. The PE fund will draw down this capital commitment, usually over 3 to 5 years.\nThings to remember:\nA hedge fund benefits from a lockup period, which restricts investor withdrawals for a period\nof time immediately following an initial investment. If the hedge fund receives a margin call\nand must sell off positions to satisfy the margin, the lockup period protects the fund from\nfurther losses.\nExplain investment features of hedge funds and contrast them with other asset classes\nLOS", "qhtml": null}, {"n": 50, "q": "Commodity indexes are most likely :", "opts": ["subject to backfill and survivorship bias.", "directly comparable since weighting methods are standardized.", "to have performance differences versus the underlying commodities."], "ans": "C", "expl": "Commodity indexes\nExposure to underlying commodities gained\nthrough derivatives\nDerivative price performance can vary significantly\nfrom physical commodity price\nUnderlying commodity exposure can vary\nsubstantially between indexes\nWidely viewed as an inflation hedge\nHistorically low correlations to other asset classes\nCommodity indexes use futures or other derivative contracts to gain exposure to\nthe underlying commodities in each index. This makes the indexes more investable and\neasier to replicate with greater price transparency than direct commodity investments.\nAn index may have exposure to more than one commodity, and each commodity in the index\nmay have a different weight. Futures prices, while certainly affected by changes in the\nunderlying commodity, are also affected by carrying costs and returns on the collateral\nrequired for futures investments. These factors mean that the price of the index is almost\ncertain to differ from the commodity's futures price. Likewise, an underlying commodity's\nreturn as measured by a change in its spot price is almost certain to differ from the\ncommodity index's return as measured by a change in its futures price .\n(Choice A) Unlike other alternative investment indexes (eg, hedge funds, private equities),\ncommodity indexes are based on observable market prices of commodity derivatives and\ntherefore not subject to the selective reporting that leads to backfill and survivorship bias.\n(Choice B) Underlying commodity exposure and weighting methods can vary substantially\nbetween indexes and therefore are not standardized.\nThings to remember:\nCommodity indexes use futures or other derivative contracts to gain exposure to the\nunderlying commodities in each index. Since the futures price of an underlying commodity is\nalmost certain to differ from its spot price, the index's return as measured by a change in its\nfutures price is almost certain to differ from the commodity's return as measured by a change\nin its spot price.\nExplain features of raw land, timberland, and farmland and their investment characteristics\nLOS", "qhtml": null}, {"n": 51, "q": "An analyst obtains the following information on a government bond:\nBond Data\nAnnual coupon rate 4.00%\nYTM 5.00%\nPayment frequency Semiannual\nPayment dates 15 January, 15 July\nMaturity date 15 January 2030\nDay-count convention Actual/actual\nAssuming a trade settlement date of 9 November 2020, the amount of accrued interest per\n100 of par value is closest to:", "opts": ["1.27", "1.59", "2.54"], "ans": "A", "expl": "Bonds earn interest daily but pay interest only periodically. On the payment date, the owner\nof the bond receives the full coupon payment for the preceding period. If a bond trades\nbetween coupon dates , the buyer will receive the entire coupon. Therefore, the buyer\nmust compensate the seller for the portion of the coupon earned (ie, accrued) since the\nlast coupon payment.\nThe amount of accrued interest is determined by the par value, the coupon rate, and the\nperiod of time over which interest accrued. Several methods, known as day-count\nconventions, can be used to measure that period. For many government bonds, the\nactual/actual method is used as follows:\nDetermine the number of actual calendar days over which interest accrued (ie, days of\naccrued interest), starting on the last coupon payment date and continuing to but not\nincluding the settlement date.\nDetermine the actual number of days in the coupon period by counting the days from the\nsettlement date up to but not including the next coupon date (ie, balance of period),\nthen adding that number to the days of accrued interest.\nDays of accrued interest = 117 Balance of period = 67\nMonth # of days Month # of days\nJuly 17* November 22\nAugust 31 December 31\nSeptember 30 January 14**\nOctober 31\nNovember 8\n*15th–31st inclusive **Does not include payment date\nEnter those values along with the coupon rate and par value into the following formula:\n(Choice B) 1.59 results from using the YTM rather than the coupon rate in the calculation.\n(Choice C) 2.54 results from failing to divide the coupon rate by 2.\nThings to remember:\nBonds earn interest daily but pay interest only periodically. When a bond is traded between\ncoupon dates, the seller receives the portion of the next coupon that has accrued since the\nlast coupon payment.\nCalculate a bond’s price given a yield-to-maturity on or between coupon dates.\nLOS", "qhtml": null}, {"n": 52, "q": "For asset securitization, credit tranching is most likely used:", "opts": ["as a waterfall structure.", "for mitigation of prepayment risk.", "as a method of overcollateralization."], "ans": "A", "expl": "Bond credit enhancements and uses\nEnhancement Use\nSubordination Senior tranches have priority over junior tranches\nOvercollateralization Issuer pledges assets worth more than the amount borrowed\nInternal\nExcess cash received from financed asset deposited in a\nReserve accounts\nseparate account\nSurety bonds Payment guarantees issued by insurance companies\nGuarantees from financial institutions other than insurance\nLetters of credit\nExternal companies\nCash collateral\nCash deposited by guarantor that issuer can borrow\naccounts\nThe process of securitizing pooled assets provides investors the opportunity to invest in\ntailored risk exposures and specified rates of returns. Investors' exposure to credit risk is\nreduced with enhancements, or features designed to redistribute risk by absorbing or\nreallocating potential losses.\nA common feature is credit tranching , in which pooled assets are segmented into tranches\nand each tranche is issued as a separate security, representing a different priority claim on the\nsecurity's cash flows. Losses are allocated to tranches in a predetermined manner,\nwith lower-rated tranches absorbing losses first . This structure is primarily used\nto shield investors in more senior tranches from default risk. It is also known as\na waterfall structure due to how payments are allocated across tranches.\n(Choice B) Time tranching, not credit tranching, is primarily used to mitigate prepayment\nrisk since it relies on segmenting the asset pool by using securities with different maturities.\n(Choice C) Overcollateralization may be used in addition to credit tranching. Generally,\nabsorbed losses need to first exhaust the full amount of overcollateralization before the credit\ntranching structure applies.\nThings to remember:\nCredit tranching (ie, waterfall structure) is a type of enhancement used to protect investors\nfrom default risk. A waterfall structure allocates losses to lower-rated tranches first, thus\nshielding investors in more senior tranches from default risk.\nDescribe typical credit enhancement structures used in securitizations.\nLOS", "qhtml": null}, {"n": 53, "q": "A floating-rate note has a quoted margin of 35 basis points (bps) and a discount margin of\n−15 bps. If the relevant reference rate is 3.25% on the bond's reset date, the new coupon\nrate is most likely :", "opts": ["3.10%", "3.45%", "3.60%"], "ans": "C", "expl": "The coupon rate of a floating-rate note (ie, FRN or floater) is based on a reference\nrate (eg, LIBOR). The quoted margin is the yield that is added to the reference rate to\ndetermine each period's coupon rate. The quoted margin typically does not change during the\nlife of the bond. The coupon rate of the FRN in this scenario is the LIBOR rate plus 35 basis\npoints (bps), or 3.25% + 0.35% = 3.60%.\nThe discount margin of an FRN (also called the required margin) is an adjustment to the rate\nused to discount the bond's cash flows. The discount margin represents the additional\nyield required given the risks of an FRN. When the bond is issued, the discount margin is the\nsame as the quoted margin, but changes in the bond's risks cause the discount margin to\nchange. Any change in the discount margin affects the bond's present value , not its\ncoupon rate.\n(Choice A) 3.10% results from adding the discount margin (−15 bps), rather than the\nquoted margin, to the reference rate.\n(Choice C) 3.45% results from inappropriately adding the sum of the quoted margin and\ndiscount margin (20 bps) to the reference rate.\nThings to remember:\nThe quoted margin is an amount of yield added to a reference rate (eg, LIBOR) to derive the\ncoupon rate of a floating-rate note (FRN). The quoted margin typically does not change\nduring the life of the bond. The discount margin, which represents the additional yield\ninvestors require to compensate for the risks of an FRN, will change if the risks change. Any\nchange in the discount margin affects the bond's present value, not its coupon rate.\nCalculate and interpret yield spread measures for floating-rate instruments.\nLOS", "qhtml": null}, {"n": 54, "q": "The current value of an option determined using a one-period binomial model is best\ndescribed as its values in one period weighted by the:", "opts": ["risk-neutral up and down probabilities.", "probabilities of up and down moves discounted by the risk-free rate.", "risk-neutral up and down probabilities discounted by the risk-free rate."], "ans": "C", "expl": "In binomial models , an option's value is the present value of the weighted average of\nits values in the up and down states, the two possible outcomes for each period forward in\ntime. Starting from the current underlying asset price ( S ), the asset's value will be either the\n0\n+) −).\nunderlying asset price given an upward movement ( S or a downward movement ( S In\n+, −,\none-period models, the length of a period is the time to expiration. S S and the\noption's strike price ( X ) are used to value the option's call price given either:\n+), + +\nan upward movement ( c so that c = max(0, S − X ), or\n−), − −\na downward movement ( c so that c = max(0, S − X ).\nAs with derivatives in general, binomial models assume arbitrage-free pricing holds for\noptions, such that risk-free hedging strategies can be created. This affects both the weighting\nand discount rate used in determining option values:\nRisk-neutral probabilities are used to weight the option values in the up and down states.\nThe risk-free rate is the appropriate discount rate since riskless positions should earn a\nrisk-free rate of return.\n(Choice A) Risk-neutral probabilities are used to find the weighted average of the option\nvalues one period in the future, but that value must be discounted to obtain a present value.\n(Choice B) Probabilities of the up or down movements are not used in the binomial model\nand are not the same as risk-neutral probabilities.\nThings to remember:\nOne-stage binomial models are used to estimate option values. An option's value is the\nweighted average of the risk-neutral probabilities of its values in the up and down states\ndiscounted by the risk-free rate.\nExplain how to value a derivative using a one-period binomial model\nLOS", "qhtml": null}, {"n": 55, "q": "All else equal, an increase in storage costs on a physical commodity will most likely :", "opts": ["increase forward prices and increase the value of existing forward contracts.", "increase forward prices and decrease the value of existing forward contracts.", "decrease forward prices and decrease the value of existing forward contracts."], "ans": "A", "expl": "Investors holding forward contracts, rather than the underlying asset, avoid the costs but also\nforgo any benefits of holding the asset. Forward contracts are usually initiated at a value of\nzero; therefore, forward prices differ from spot prices by the net cost of holding the underlying\nasset until the forward's expiration.\nThe net cost of holding a position in the underlying asset or commodity is called the cost of\ncarry, which reflects:\ncosts such as storage, insurance, or the opportunity cost of capital and\nbenefits such as income or convenience yield.\nWhen the costs of holding the asset are greater than the benefits, the forward price is greater\nthan the underlying price. The difference is the net amount saved by holding the forward\nrather than the underlying. All else equal, if storage costs increase , the forward price\nincreases due to the increase in costs avoided (Choice C) .\nA similar benefit accrues to existing forward contract holders, who realize the same\nadvantage of avoiding the higher cost of carry. In valuing forward contracts, the holding\ncosts are added to the spot price, so an increase in storage costs increases the\nvalue of existing forward contracts (Choice B) .\nThings to remember:\nForward prices differ from spot prices by the net cost of holding the underlying until\nexpiration. All else equal, an increase in holding costs results in higher forward prices and\ngreater value for existing forward contracts due to the greater advantage of holding the\nforward rather than the underlying.\nExplain the difference between the spot and expected future price of an underlying and the cost of\ncarry associated with holding the underlying asset\nLOS", "qhtml": null}, {"n": 56, "q": "An analyst has gathered the following information on zero-coupon government bond yields:\nMaturity Spot Rate\n1 year 2.42%\n2 years 3.05%\n3 years 3.48%\n4 years 3.65%\nIf the rates are based on a periodicity of 1, the one-year forward rate 2 years in the future\n(2y1y) is closest to:", "opts": ["3.72%", "4.16%", "4.35%"], "ans": "C", "expl": "A forward rate (or implied forward rate [IFR]) is a future period interest rate. Forward rates\nare not expectations of future spot rates; instead, they are future interest rates that reflect\nthe difference between spot rates of different maturities (ie, tenors), based on the\nassumption that investment strategies covering the same time horizon and carrying equivalent\nrisk should have the same return. In effect, forward rates are the breakeven reinvestment\nrates that produce that result. Arbitrage-free pricing enforces the consistency of forward rates\nwith spot rate differences.\nIn this scenario, equal amounts invested in a strategy today should have the same future\nvalue at the end of 3 years. To answer this question, two investment strategies can be\ncompared as follows:\nBuy a three-year zero-coupon bond and hold it to maturity (ie, right side of the first\nequation above).\nBuy a two-year zero-coupon bond and hold it to maturity; at maturity, reinvest the\nproceeds in a one-year zero-coupon bond (ie, left side of the first equation above).\nThese two strategies are illustrated on the following timeline:\nThe IFR for the one-year forward rate starting 2 years in the future (IFR ) is calculated as\n2,3−2\nfollows:\n(Choice A) 3.72% results from incorrectly calculating the IFR as [(1 + Three-year spot\nrate)3\n− 1] / 2.\n(Choice B) 4.16% is the one-year forward rate starting 3 years in the future.\nThings to remember:\nA forward rate is a future period interest rate that reflects the difference between spot rates of\ndifferent tenors. In effect, forward rates are breakeven reinvestment rates that result in two\ninvestment strategies of equivalent risk, covering the same time horizon and earning the same\nreturn.\nDefine par and forward rates, and calculate par rates, forward rates from spot rates, spot rates\nfrom forward rates, and the price of a bond using forward rates.\nLOS", "qhtml": null}, {"n": 57, "q": "A company's bonds are currently trading at a lower YTM than bonds with similar maturities but\nhave the same credit rating as those other bonds. Based only on this information, the most\nappropriate conclusion by market participants is that rating agencies are:", "opts": ["underestimating the company's probability of default.", "overestimating the bonds' recovery rate in event of default.", "slower to recognize the company's improving credit quality."], "ans": "C", "expl": "Bond market values can adjust immediately as traders react to new information.\nTherefore, changes in issuer credit quality are quickly reflected in bond YTMs. Conversely,\nagency credit ratings result from a much slower, multistep process , involving the bond's\nrating by a team of analysts and approval by a rating committee.\nThis timing difference means that credit quality changes are likely to be recognized by the\nmarket well before being reflected in a revised credit rating. A lower yield on a company's\nbonds compared to other bonds of the same credit rating and maturity most likely means that\nthe company's credit quality has improved. The reduced credit risk is reflected by the lower\nYTM in the market before it is recognized in a credit rating upgrade.\n(Choice A) If rating agencies underestimate the default probability, then the market expects\na greater probability of default and demands higher (not lower) YTMs, compared to similar\nbonds, to compensate for the greater risk.\n(Choice B) If rating agencies overestimate the recovery rate (and consequently\nunderestimate loss severity), then the market expects larger losses from default than is\nreflected in the credit rating. Larger expected losses make bonds less valuable and result in\nhigher (not lower) YTMs, compared to similar bonds.\nThings to remember:\nMarkets can immediately revalue bonds and adjust their YTMs in response to new\ninformation. Credit ratings change only after a formal process, including revaluation of\ncreditworthiness. Consequently, credit rating changes tend to lag the market in recognizing\nchanges in credit quality.\nDescribe the uses of ratings from credit rating agencies and their limitations.\nLOS", "qhtml": null}, {"n": 58, "q": "Which of the following would most likely be a red flag when performing hedge fund due\ndiligence?", "opts": ["The fund's benchmark is the risk-free rate plus 200 basis points.", "The fund has three unique investment strategies, all run by a single individual.", "The fund has a 12-month lockup period and a 90-day redemption notice policy."], "ans": "B", "expl": "Alternative investment due diligence checklist\nTeam experience, key person risk, and reputation\nReputation of third-party service providers (eg,\nOrganization\nauditors, prime broker)\nRecent and long-term track record\nPortfolio\nStrategy, investment process, and idea generation\nmanagement\nInternal controls, audited financial statements,\nreporting frequency\nOperations\nValuation methodology and controls\nChief risk officer's independence from portfolio\ndecision-making\nRisk policies\nFund/position limits, leverage, hedging policies\nFund structure and legal registrations\nExisting or prior litigation against fund or\nLegal risks\nprincipals\nFees, lockouts, redemption notice period\nTerms of\nCarried interest, distribution policy\ninvestment\nPerforming due diligence on alternative investment managers requires a robust process since\nthe investments are usually subject to increased operational, financial, and counterparty risks\ncompared to traditional investments and money management firms.\nThe key elements of hedge fund due diligence include assessing that the manager:\ncan effectively implement the investment strategy,\nhas appropriate organizational depth, structure, and policies, and\nhas fund terms that are reasonable within the context of the strategy.\nIn this case, a single individual managing all three of the firm's investment\nstrategies constitutes a red flag. This situation raises serious concerns regarding key person\nrisk, dedication of appropriate resources to each product, and the manager's\noverall workload .\n(Choice A) The benchmark that the hedge fund will be judged by should always be\navailable. Many hedge funds strive for positive absolute returns, so a benchmark tied to\nthe risk-free rate plus a risk premium could be appropriate.\n(Choice C) Lockups and redemption notice policies are common in hedge funds, and these\nterms are not out of line with industry norms.\nThings to remember:\nThe key elements of hedge fund due diligence include assessing whether the manager (1) can\neffectively implement the investment strategy, (2) has appropriate organizational depth,\nstructure, and policies, and (3) has fund terms that are reasonable within the context of the\nstrategy.\nCompare direct investment, co-investment, and fund investment methods for alternative\ninvestments\nLOS", "qhtml": null}, {"n": 59, "q": "Which of the following is least likely to benefit from distributed ledger technology (DLT)?", "opts": ["Algorithmic trading", "Compliance processes", "Post-trade clearing and settlement"], "ans": "A", "expl": "Distributed ledger technology (DLT): Investment management applications\nApplication\nConfirms creation and trade of digital currency; allows for\nCryptocurrencies\nverification of ownership\nTokenization of physical Assigns a \"token\" of ownership to physical assets; allows for\nassets transfer and verification of ownership\nPost-trade clearing and\nStreamlines trade confirmation, clearing, and settlement\nsettlement\nAllows near-real-time access to transaction and position data;\nCompliance\nstreamlines processes\nDistributed ledger technology (DLT) is a method of decentralized record keeping using\nan electronic ledger of transactions that is shared among multiple users in a network. In\nthe investment management industry, DLT is applied to streamline many repetitive and labor-\nintensive tasks, such as post-trade clearing, settlement, and compliance processes (Choices\nB and C) .\nWith DLT, all users in the network are connected to all other users, have an identical copy of\nthe ledger, and can view all transactions. Transactions are not entered by a central authority,\nsuch as a clearinghouse. Instead, each user enters its own transactions, which are then\ncommunicated to all other users, who confirm and validate the transaction and approve the\nupdated ledger.\nAlgorithmic trading (AT) refers to trading securities based on predetermined criteria\nprogrammed into an algorithm that functions without human interaction. The algorithm must\nadapt to changing market conditions through the use of artificial intelligence (AI). AT is an\nexample of fintech in investment management but is not a technology that\ndirectly benefits from or uses DLT .\nThings to remember:\nDistributed ledger technology refers to a decentralized electronic ledger of transactions that is\nshared among multiple users in a network. In the investment management industry, DLT is\napplied to streamline many repetitive and labor-intensive tasks, such as post-trade clearing,\nsettlement, and compliance processes.\nDescribe financial applications of distributed ledger technology\nLOS", "qhtml": null}, {"n": 60, "q": "An investor places a buy-stop, all-or-nothing order for a security. The type of instruction(s)\nrelating to this order is (are) best described as:", "opts": ["validity instructions only.", "execution instructions only.", "both validity and execution instructions."], "ans": "C", "expl": "Execution instructions vs. validity instructions\nMarket order types Examples\nMarket: order is immediately filled at the best available price\nLimit: order is filled at a threshold price or better\nExecution instructions\nAll-or-none (AON): entire order is filled or canceled\nDay: expires at the end of the trading day\nStop: contingent on a specified price to trigger action\nValidity instructions Good-till-canceled (GTC): order is good until canceled\nMarket-on-close (MOC): order filled at the day's closing price\nOrders to buy or sell securities can include both execution and validity\ninstructions. Execution instructions address how to fill an order with respect to:\nThe price at which to buy or sell.\nThe size (ie, quantity) of the order.\nValidity instructions refer to when an order can be filled, as well as how long an unfilled\norder should remain open before it expires. A stop order is a type of validity instruction. A\nstop order does not become executable until the security has traded at a prespecified trigger\nprice (ie, stop price). A buy-stop order cannot be filled until the security has traded at a\nprice equal to or higher than the stop price .\n\"All-or-nothing\" refers to the quantity of the security to be bought or sold ; therefore, it is\na type of execution instruction. The investor in this question would have indicated the number\nof shares that would be purchased in the buy-stop order. However, by adding the all-or-\nnothing instruction, the intermediary cannot fill any of the order unless the entire order can\nbe filled.\n(Choices A and B) A buy-stop, all-or-nothing order contains both execution and validity\ninstructions.\nThings to remember:\nOrders to trade securities can have both execution and validity instructions. Execution\ninstructions relate to the price to purchase or sell and the quantity of the order. Validity\ninstructions relate to when the trade can occur. A stop order, which becomes executable only\nafter a trade has occurred at a specified price, is a type of validity instruction.\nCompare execution, validity, and clearing instructions\nLOS", "qhtml": null}, {"n": 61, "q": "Which of the following is most likely a feature of preference shares?", "opts": ["Call features allow issuers the right to buy back shares from investors.", "Convertible shares allow shareholders to convert shares into subordinated debt.", "Participating shares provide shareholders the same voting rights as common shares."], "ans": "A", "expl": "Types of preference shares (preferred stock)\nCumulative Accrues for past dividends that are unpaid\nNoncumulative Does not accrue dividends that are undeclared and unpaid in past periods\nAllows for additional dividend payments if company profits exceed a certain\nParticipating\nthreshold\nNonparticipating Fixed dividend; no additional payments based on company performance\nConvertible Can convert into a specified number of common shares\nCallable Allows issuer to buy back shares from investors for a specified price\nPutable Allows investors to sell shares back to issuer for a specified price\nPreference (ie, preferred) shares are a type of equity security. Compared to common shares,\npreference shares often have larger (but fixed) dividends, as well as higher priority over\ndividend payments and residual claims on a company's assets.\nThere are several types of preference shares (shown in the table above). If preference shares\nare callable , they have an embedded call option that gives the issuing company (ie, issuer)\nthe right to buy back shares from investors at a predetermined call price.\n(Choice B) Convertible shares allow shareholders to convert their shares into common stock,\nnot subordinated debt.\n(Choice C) Participating shares provide shareholders the opportunity to earn additional\ndividend payments if a company's profits exceed a predetermined threshold. They do not\nprovide voting rights.\nThings to remember:\nPreference (ie, preferred) shares are a type of equity security. Callable shares have an\nembedded call option that gives the issuing company the right to buy back shares from\ninvestors at a predetermined call price.\nDescribe differences in voting rights and other ownership characteristics among different equity\nclasses\nLOS", "qhtml": null}, {"n": 62, "q": "An investor holds a company's stock, believing its price will increase based on forecasts\nproduced by a proprietary model. Following the latest earnings release, the investor updates\nthe model and believes that the stock is overvalued and the price will decrease. However, the\nstock rises following earnings. Seeing this, the investor decides to hold the stock. The\ninvestor's behavior is best described as:", "opts": ["herding.", "loss aversion.", "conservatism."], "ans": "A", "expl": "Common behavioral finance biases\nPsychological impact of gains and losses is asymmetric\nAssociated with market overreaction\nLoss aversion\nFear of continued losses compels investors to sell\nInvestors create separate psychological \"buckets\"\nMental accounting\nInvestors think and act differently within these buckets\nInvestors overestimate their own research, analysis, and\nstock selection abilities\nOverconfidence\nPrevalent with high-growth stocks\nBuying and selling decisions are based primarily on\nfollowing the crowd\nHerding\nClustering behavior, not necessarily based on information\nBehavioral finance attempts to explain investment decision making by studying investors'\nbehaviors. In part, it involves understanding various biases that cause investors to act\nirrationally, which can lead to pricing anomalies. The herding bias suggests\nthat investors may irrationally ignore their own analysis and instead trade on the same\nside of the market and/or securities as other investors . This can lead to either overreaction\nor under-reaction in the market.\nIn this scenario, the investor exhibits the herding bias. Based on research, the investor begins\nto believe that an invested stock is overvalued and its price will decrease, and so intends to\nsell the stock. However, the investor instead decides to hold the stock after seeing that other\ninvestors are buying or holding it.\n(Choice B) Loss aversion refers to investors' tendencies to dislike losses more than they like\ngains of equal magnitude. Since this investor believes the stock is overvalued, loss aversion\nwould most likely drive the investor to sell the stock.\n(Choice C) Conservatism refers to investors' tendencies to delay updating their views and\nforecasts based on new information and instead maintain prior views and forecasts. This\ninvestor updated the proprietary model with new information, an action that does not exhibit\nconservatism.\nThings to remember:\nBehavioral finance studies how investors behave to better understand their decision making,\nincluding biases that cause them to act irrationally. The herding bias suggests that investors\nmay irrationally ignore their own analysis and instead trade on the same side of the market\nand/or securities as other investors.\nDescribe behavioral finance and its potential relevance to understanding market anomalies\nLOS", "qhtml": null}, {"n": 63, "q": "Which of the following is most likely a limitation of grouping companies based on their\nsensitivity to the business cycle?", "opts": ["Some countries will be in recession while others are expanding", "Certain companies grow revenue during all phases of the business cycle", "Classifications run along a continuum although business cycle sensitivity is discrete"], "ans": "A", "expl": "Limitations
