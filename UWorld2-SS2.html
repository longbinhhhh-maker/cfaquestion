<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n":1,"q":"If a company uses a surety bond, it is most likely :","opts":["self-insuring.","transferring risk.","pledging collateral for a debt obligation."],"ans":"B","expl":"Các phương pháp sửa đổi rủi ro\nVí dụ về phương pháp\nKhông hoạt động ở một quốc gia không ổn định về chính trị\nTránh thu thập/lưu trữ khách hàng nhạy cảm\nTránh hoặc ngăn chặn\ndữ liệu\nDành vốn để hấp thụ tổn thất\nChấp nhận rủi ro:\nSử dụng nhiều vị trí địa lý\ntự bảo hiểm hoặc đa dạng hóa\nMua bảo hiểm\nChuyển giao rủi ro\nNhận trái phiếu đảm bảo\nSử dụng các công cụ phái sinh (ví dụ: hợp đồng kỳ hạn hoặc\nChuyển đổi rủi ro\ntùy chọn)\nĐo lường và giám sát rủi ro là các chức năng quản lý rủi ro chính. Việc định lượng rủi ro cho phép công ty\nxác định xem lợi ích dự kiến ​​từ một hoạt động tiềm năng có lớn hơn chi phí hay không.\nTrong quá trình kinh doanh thông thường, các công ty thường phải quyết định có nên chấp nhận hay\ntránh rủi ro hay không.\nChuyển giao rủi ro xảy ra khi một công ty chọn chấp nhận rủi ro và sau đó chuyển một số\nrủi ro đó cho một bên khác bằng cách mua bảo hiểm . Bằng cách chuyển giao rủi ro cho công ty bảo hiểm,\nngười được bảo hiểm đã giới hạn tổn thất tiềm ẩn ở mức chi phí của hợp đồng bảo hiểm cộng với bất kỳ\nkhấu trừ và/hoặc chia sẻ tổn thất liên quan nào.\nTrái phiếu đảm bảo là một hình thức bảo hiểm, chuyển rủi ro rằng bên thứ ba sẽ không\nhoàn thành nghĩa vụ hợp đồng của mình. Ví dụ: một nhà phát triển bất động sản có thể mua một trái phiếu đảm bảo\nđể đảm bảo rằng nhà thầu được thuê xây dựng một tòa nhà hoàn thành tốt công việc\n.\n(Lựa chọn A) Tự bảo hiểm là một hình thức chấp nhận rủi ro . Các công ty có thể quyết định tự bảo hiểm nếu\ncác phương pháp sửa đổi rủi ro của bên thứ ba như chuyển giao rủi ro hoặc chuyển đổi rủi ro là chi phí\nbị cấm hoặc không có sẵn.\n(Lựa chọn C) Trái phiếu đảm bảo không phải là một loại nghĩa vụ nợ.\nNhững điều cần nhớ:\nPhương pháp chuyển giao rủi ro bằng cách sửa đổi rủi ro chuyển phần lớn hoặc toàn bộ rủi ro sang bên thứ ba party.\nPhương pháp này thuận lợi khi các tùy chọn khác có chi phí quá cao hoặc không có sẵn. A\ntrái phiếu bảo đảm là một hình thức bảo hiểm, chuyển giao rủi ro khi bên thứ ba không thực hiện\nnghĩa vụ hợp đồng của họ.\nMô tả các phương pháp đo lường và sửa đổi mức độ rủi ro cũng như các yếu tố cần cân nhắc khi lựa chọn\ntrong số các phương pháp\nLOS","qhtml":null},{"n":2,"q":"Which function is least likely a responsibility of the audit committee?","opts":["Recommending an external auditor","Providing oversight of the application of accounting policies","Monitoring company-wide compliance with all relevant laws and regulations"],"ans":"C","expl":"Trách nhiệm của ủy ban kiểm toán\nGiám sát hệ thống kiểm toán và kiểm soát\nGiám sát quá trình báo cáo tài chính và đảm bảo tính chính xác tài chính\nGiám sát việc áp dụng chính sách kế toán\nĐảm bảo tính trung thực của báo cáo tài chính\nChức năng giám sát kiểm toán nội bộ\nĐề xuất kiểm toán viên bên ngoài\nTrình bày báo cáo kiểm toán hàng năm cho hội đồng quản trị\nCác thành viên hội đồng quản trị phục vụ trong các ủy ban chức năng, giám sát các lĩnh vực khác nhau của công ty.\nCác ủy ban này bao gồm nhưng không giới hạn ở quản trị, rủi ro và đầu tư.\ncác ủy ban. Ủy ban quản trị chứ không phải ủy ban kiểm toán chịu trách nhiệm về\nduy trì sự tuân thủ pháp luật và các quy định.\nỦy ban kiểm toán là một trong những ủy ban phổ biến nhất trong hội đồng quản trị công ty. trong\nNgoài chức năng chính là giám sát quá trình báo cáo của công ty, kiểm toán\nủy ban có trách nhiệm giảm thiểu rủi ro gian lận hoặc sai sót trong cả kế toán\nvà thông tin tài chính. Ủy ban duy trì sự độc lập với công ty\nquản lý và thiết lập các chính sách và thủ tục để đảm bảo tính liêm chính về tài chính.\n(Lựa chọn A và B) Trách nhiệm của ủy ban kiểm toán bao gồm giám sát cả hoạt động kiểm toán\n(ví dụ, đề xuất kiểm toán viên bên ngoài) và việc áp dụng các chính sách kế toán.\nNhững điều cần nhớ:\nỦy ban kiểm toán duy trì sự độc lập với ban quản lý vì nó giám sát hoạt động của công ty.\nhệ thống kiểm toán và kiểm soát, đồng thời thiết lập các chính sách và thủ tục để đảm bảo tính liêm chính về tài chính\n(ví dụ: giảm thiểu rủi ro gian lận hoặc sai sót). Ủy ban quản trị, không phải kiểm toán\nủy ban, chịu trách nhiệm giám sát việc tuân thủ luật pháp và quy định của toàn công ty.\nMô tả quản trị doanh nghiệp và cơ chế quản lý mối quan hệ với các bên liên quan và giảm thiểu\nrủi ro liên quan\nLOS","qhtml":null},{"n":3,"q":"Based on the pecking order theory, when a company issues equity, management is most\nlikely signaling that:","opts":["the stock is overvalued.","the company can pay larger dividends.","they have confidence in meeting future commitments."],"ans":"A","expl":"Sự bất cân xứng thông tin xuất phát từ thực tế là các nhà quản lý của công ty biết nhiều về\ncông ty và triển vọng của công ty hơn các nhà đầu tư của công ty. Các nhà đầu tư nhận ra điều này và cố gắng\ndiễn giải các tín hiệu dựa trên cách ban quản lý tiến hành kinh doanh, bao gồm cả việc huy động vốn.\nLý thuyết trật tự phân hạng cho thấy rằng các nhà quản lý thích huy động vốn thông qua\ncác phương pháp đòi hỏi ít tiết lộ nhất, do đó cung cấp cho nhà đầu tư\nlượng thông tin cần thiết ít nhất. Dựa trên lý thuyết này, phát hành vốn cổ phần là phương pháp\nít được ưa thích nhất vì nó yêu cầu tiết lộ thông tin đáng kể và được các nhà đầu tư\nxem xét kỹ lưỡng. Các vấn đề về vốn chủ sở hữu có thể cho thấy các nhà quản lý tin rằng:\ntriển vọng của công ty không đáng khích lệ . Nếu triển vọng tốt hơn, các nhà quản lý\nsẽ ngần ngại giảm quyền sở hữu của họ.\ncổ phiếu được định giá quá cao và do đó là một hình thức tài trợ tốt để tài trợ cho các dự án hoặc\nmua lại. Các nhà quản lý sẽ miễn cưỡng phát hành cổ phiếu nếu họ cho rằng nó\nbị định giá thấp.\n(Lựa chọn B) Lý thuyết trật tự phân hạng không liên kết phương thức tài trợ với việc thanh toán cổ tức\n. Tuy nhiên, vì các vấn đề về vốn cổ phần cho thấy triển vọng trong tương lai không đáng khích lệ nên chúng\nkhông có khả năng cho thấy rằng công ty có thể trả cổ tức lớn hơn.\n(Lựa chọn C) Việc phát hành nợ sẽ cho thấy rằng ban quản lý tin tưởng vào việc đáp ứng\ncác cam kết trong tương lai vì khoản nợ bổ sung buộc công ty phải thực hiện các nghĩa vụ trong tương lai.\nNhững điều cần nhớ:\nLý thuyết trật tự phân hạng cho thấy rằng các nhà quản lý thích huy động vốn hơn thông qua các phương pháp\ncung cấp cho nhà đầu tư ít thông tin cần thiết nhất. Phát hành vốn cổ phần là phương pháp\nít được ưa thích nhất vì nó cho các nhà đầu tư biết rằng ban quản lý tin rằng\ntriển vọng của công ty không đáng khích lệ hoặc cổ phiếu được định giá quá cao.\nGiải thích các yếu tố ảnh hưởng đến cấu trúc vốn và chi phí vốn bình quân gia quyền\nLOS","qhtml":null},{"n":4,"q":"The capital asset pricing model (CAPM) assumes that all investors can most likely :","opts":["influence security prices.","invest any amount in an asset.","plan for a multiple-period holding period."],"ans":"B","expl":"Các giả định của mô hình định giá tài sản vốn\n(CAPM)\nCác nhà đầu tư không thích rủi ro, tập trung vào tiện ích và hợp lý\nNhà đầu tư có khoảng thời gian trong một khoảng thời gian\nNhà đầu tư là người chấp nhận giá\nNhà đầu tư có những kỳ vọng đồng nhất vì họ\nphân tích chứng khoán một cách thống nhất bằng các phương pháp giống hệt nhau\nvà dữ liệu\nCác khoản đầu tư có thể phân chia vô hạn\nKhông có chi phí giao dịch và thuế, không có hạn chế về\nbán khống và các nhà đầu tư có thể cho vay và vay\nsố tiền không giới hạn với lãi suất phi rủi ro\nMô hình định giá tài sản vốn (CAPM) thiết lập mối quan hệ tuyến tính trực tiếp giữa\nlợi nhuận kỳ vọng của một tài sản và hệ số beta của nó, vốn là thước đo rủi ro hệ thống.\nbeta cho biết mức độ nhạy cảm của lợi nhuận của tài sản với diễn biến chung của thị trường.\nCAPM giả định rằng các khoản đầu tư có thể phân chia vô hạn, ngụ ý rằng các nhà đầu tư có thể\nđầu tư bất kỳ số vốn nào vào một tài sản hoặc khoản đầu tư cụ thể và do đó tối đa hóa một cách hợp lý\ntiện ích và tối ưu hóa danh mục đầu tư của họ. Giả định này cũng cho phép dễ dàng mô hình hóa\ntoán học. Bằng cách giả sử khả năng chia hết vô hạn, mô hình có thể sử dụng các hàm liên tục, mượt mà hơn và dễ điều chỉnh về mặt toán học hơn các hàm nhảy rời rạc.\n(Lựa chọn A) CAPM giả định rằng các nhà đầu tư là người chấp nhận giá. Do đó, các hành động riêng lẻ\ncủa bất kỳ nhà đầu tư nào không có tác động đáng kể đến giá thị trường của chứng khoán.\n(Lựa chọn C) CAPM giả định rằng các nhà đầu tư lập kế hoạch cho cùng một khoảng thời gian nắm giữ,\nsao cho tất cả các nhà đầu tư có cùng khoảng thời gian. Vì lý do này, mô hình giả định rằng\ntất cả các nhà đầu tư đều hành động hợp lý trong cùng một khoảng thời gian đầu tư.\nNhững điều cần nhớ:\nCAPM giả định rằng các khoản đầu tư có thể phân chia vô hạn, cho phép các nhà đầu tư\ntối đa hóa tiện ích và tối ưu hóa danh mục đầu tư của họ một cách hợp lý. Giả định này cũng cho phép dễ dàng thực hiện\nmô hình toán học.\nGiải thích mô hình định giá tài sản vốn (CAPM), bao gồm các giả định của nó và thị trường chứng khoán\ndòng (SML)\nLOS","qhtml":null},{"n":5,"q":"Which of the following is most likely a responsibility of a board of director's governance\ncommittee?","opts":["Defining performance criteria for management.","Overseeing risk and capital management policies.","Evaluating candidates for executive management positions."],"ans":"C","expl":"Ban giám đốc của một công ty có nhiều vai trò và thường được tổ chức thành các ủy ban\ntập trung vào các chức năng riêng biệt. Ủy ban quản trị , còn được gọi là\nủy ban đề cử, thực hiện các biện pháp thực hành tốt nhất trong các chính sách và quy trình\ncủa công ty. Ủy ban quản trị:\nĐánh giá các ứng cử viên cho các vị trí quản lý điều hành và hội đồng quản trị\nĐặt quy trình đề cử cho thành viên hội đồng quản trị\nThực thi các chính sách của công ty, chẳng hạn như quy tắc quản trị và quy tắc đạo đức\nĐảm bảo tuân thủ luật pháp và quy định hiện hành\nĐề xuất các hành động khắc phục các vi phạm pháp luật\n(Lựa chọn A) Xác định tiêu chí hiệu suất để quản lý là một chức năng của ủy ban thù lao\n, chịu trách nhiệm chính về đánh giá hiệu suất và các chính sách bồi thường\nliên quan đến các nhà quản lý của công ty.\n(Lựa chọn B) Giám sát các chính sách quản lý rủi ro (vốn) là một chức năng của ủy ban rủi ro\n(đầu tư), thường dành riêng cho ngành dịch vụ tài chính (bảo hiểm).\nNhững điều cần nhớ:\nỦy ban quản trị thực hiện các phương pháp thực hành tốt nhất có trong chính sách và quy trình\ncủa công ty. Ủy ban đánh giá các ứng cử viên cho các vị trí trong hội đồng quản trị và quản lý,\nđảm bảo tuân thủ các quy định và đề xuất các biện pháp khắc phục các vi phạm pháp luật,\ntrong số các chức năng khác.\nMô tả quản trị doanh nghiệp và các cơ chế để quản lý mối quan hệ với các bên liên quan và giảm thiểu\nrủi ro liên quan\nLOS","qhtml":null},{"n":6,"q":"A manufacturer with industry-average financial leverage is issuing debt to fund expansion of\nproduction capacity. All else equal, the stakeholder group most likely to benefit from the\nincrease in financial leverage is the company's:","opts":["bondholders.","common shareholders.","preferred shareholders."],"ans":"B","expl":"Mức đòn bẩy tài chính cao hơn làm tăng khả năng xảy ra xung đột lợi ích giữa\ncác cổ đông và các bên liên quan khác. Các công ty sử dụng đòn bẩy (ví dụ: nợ) để tăng\nlợi nhuận kỳ vọng cho các cổ đông thông qua các hành động như mở rộng công suất hoặc\nmua lại cổ phiếu. Tuy nhiên, tiềm năng thu được lợi nhuận cao hơn đi kèm với\nxác suất kiệt quệ tài chính và/hoặc phá sản cao hơn vì các khoản thanh toán cho chủ nợ vẫn là nghĩa vụ\ncủa công ty ngay cả khi hoạt động thua lỗ.\nNói chung, không có bên liên quan nào được hưởng lợi từ một công ty phá sản. Tuy nhiên, sự đánh đổi giữa rủi ro và lợi nhuận\ncủa đòn bẩy tài chính lớn hơn sẽ mang lại lợi ích cho các cổ đông phổ thông do hồ sơ lợi nhuận\nkhông đối xứng của họ. Việc sử dụng thành công đòn bẩy có thể mang lại lợi nhuận cho cổ đông bằng bội số\nđầu tư ban đầu của họ, trong khi tổn thất của họ thường không thể vượt quá 100% khoản đầu tư\n.\n(Lựa chọn A và C) Tất cả các yếu tố khác đều như nhau, khi một công ty tăng đòn bẩy tài chính bằng cách phát hành nợ,\nkhả năng phá sản tăng lên. Điều này làm giảm khả năng công ty đáp ứng được các cam kết tài chính\nvới những người nắm giữ chứng khoán cấp cao. Do đó, các trái chủ và cổ đông ưu tiên\nkhông được hưởng lợi từ việc tăng đòn bẩy tài chính.\nNhững điều cần nhớ:\nMức đòn bẩy tài chính cao hơn có thể làm tăng lợi nhuận kỳ vọng cho các cổ đông phổ thông nhưng\ncũng làm tăng khả năng phá sản công ty. Tất cả các yếu tố khác đều bằng nhau, đòn bẩy tài chính lớn hơn\nmang lại lợi ích cho cổ đông phổ thông nhưng không mang lại lợi ích cho người sở hữu trái phiếu và cổ đông ưu đãi.\nGiải thích các yếu tố ảnh hưởng đến cấu trúc vốn và chi phí vốn bình quân gia quyền\nLOS","qhtml":null},{"n":7,"q":"With regard to environmental, social, and governance (ESG) investing, full integration can\nbe best described as:","opts":["investment in assets related to specific ESG factors or themes.","explicit inclusion of ESG factors in a fundamental analysis of individual stocks.","inclusion of certain sectors or companies that have favorable ESG factors in a fund."],"ans":"B","expl":"Triển khai môi trường, xã hội và quản trị (ESG)\ncác phương pháp tiếp cận\nMô tả\nKhông bao gồm các công ty hoặc lĩnh vực mà hoạt động diễn ra\nSàng lọc tiêu cực\nchống lại niềm tin của nhà đầu tư\nSàng lọc tích cực Chọn các công ty có thuộc tính ESG thuận lợi\nTốt nhất trong lớp Sử dụng hệ thống tính điểm ESG để xếp hạng các công ty\nKết hợp các yếu tố ESG định tính với định lượng\nTích hợp ESG\ndata\nTập trung vào một chủ đề hoặc thuộc tính ESG cụ thể trong\nĐầu tư theo chủ đề\ncần đầu tư\nTìm cách đạt được các mục tiêu ESG được nhắm mục tiêu cùng với\nĐầu tư tác động\nkết quả tài chính có thể đo lường được\nCác nhà đầu tư ngày càng quan tâm đến môi trường, các yếu tố xã hội và quản trị (ESG)\nkhi đánh giá các công ty. Đổi lại, các công ty đã tăng cường báo cáo ESG.\nBáo cáo này cho phép các nhà đầu tư thực hiện các cách tiếp cận khác nhau khi sàng lọc các khoản đầu tư tiềm năng\nvà sử dụng những hiểu biết sâu sắc đó trong chiến lược đầu tư của họ.\nMột phương pháp triển khai ESG là tích hợp đầy đủ (tức là tích hợp ESG): các nhà đầu tư\nrõ ràng đưa các yếu tố ESG vào phân tích cơ bản truyền thống về các công ty (ví dụ:\nkhi đưa ra dự báo dòng tiền). Tích hợp đầy đủ cho phép các nhà phân tích hiểu được\ncác cơ hội và rủi ro phát sinh từ việc quản lý tài nguyên ESG của công ty.\n(Lựa chọn A) Đầu tư vào tài sản liên quan đến các yếu tố hoặc chủ đề ESG cụ thể mô tả việc đầu tư\ntheo chủ đề.\n(Lựa chọn C) Bao gồm một số ngành hoặc công ty nhất định có yếu tố ESG thuận lợi trong quỹ\nmô tả tích cực sàng lọc.\nNhững điều cần nhớ:\nTích hợp hoàn toàn là một phương pháp triển khai môi trường, xã hội và quản trị (ESG)\ntrong đó các nhà đầu tư đưa rõ ràng các yếu tố ESG vào phân tích cơ bản truyền thống của họ về\ncác công ty. Tích hợp đầy đủ cho phép các nhà phân tích hiểu được các cơ hội và rủi ro phát sinh\ntừ việc quản lý tài nguyên ESG của công ty và cách quản lý đó ảnh hưởng đến\ngiá trị của công ty.\nMô tả các yếu tố môi trường, xã hội và quản trị của các tổ chức phát hành doanh nghiệp được\nnhà đầu tư\nLOS","qhtml":null},{"n":8,"q":"A portfolio consists of two assets:\nExpected standard\nAsset Asset weight (%)\ndeviation (%)\nA 15 75\nB 8 25\nIf the expected standard deviation of the portfolio is 10%, then the two assets can be best\ndescribed as having:","opts":["no correlation.","positive correlation.","negative correlation."],"ans":"C","expl":"Hệ số tương quan đánh giá mức độ lợi nhuận của hai tài sản thay đổi hoặc dự kiến\ndi chuyển trong mối quan hệ với nhau. Nó đo lường cả mức độ và hướng của mối quan hệ\ngiữa hai nội dung. Lợi nhuận của tài sản có tương quan dương thường di chuyển trong\ntheo cùng một cách , trong khi lợi nhuận của tài sản có tương quan tiêu cực có xu hướng di chuyển theo hướng ngược lại.\nHệ số tương quan càng gần −1 hoặc 1 thì mối quan hệ\ntiêu cực hoặc tích cực tương ứng càng mạnh.\nHệ số tương quan được sử dụng để tính toán độ lệch chuẩn dự kiến ​​của lợi nhuận danh mục đầu tư\n. Mức độ và hướng của sự khác biệt giữa lợi nhuận tài sản ảnh hưởng đến rủi ro tổng thể của danh mục đầu tư\n. Nếu hai tài sản ít có mối tương quan hoàn hảo, việc kết hợp chúng\nsẽ tạo ra một danh mục đầu tư có độ lệch chuẩn thấp hơn mức bình quân gia quyền của độ lệch chuẩn\ncủa tài sản. Hệ số tương quan càng gần −1 thì rủi ro\ndanh mục đầu tư càng thấp.\nMối quan hệ giữa độ lệch chuẩn của danh mục đầu tư hai tài sản và trọng số, độ lệch chuẩn\nvà mối tương quan của các tài sản thành phần của nó được hiển thị bên dưới.\nTrong trường hợp này, vì tất cả các thông tin khác đều được cung cấp nên các mối quan hệ trên có thể được sử dụng để\ngiải quyết vấn đề mối tương quan của tài sản như sau:\nHệ số tương quan của tài sản A và B là −0,6792, do đó chúng có mối tương quan âm\n(Lựa chọn A và B).\nNhững điều cần nhớ\nHệ số tương quan của hai tài sản biểu thị mức lợi nhuận dự kiến của chúng sẽ thay đổi như thế nào trong mối quan hệ\nvới nhau. Hệ số càng gần 1 hoặc −1 thì mối tương quan càng mạnh. Nếu\nhai tài sản ít có mối tương quan hoàn hảo thì việc kết hợp chúng sẽ làm giảm độ lệch chuẩn\ncủa danh mục đầu tư thu được, phản ánh rủi ro thấp hơn của các tài sản kết hợp.\nTính toán và giải thích giá trị trung bình, phương sai và hiệp phương sai (hoặc tương quan) của lợi nhuận tài sản dựa trên\ndựa trên dữ liệu lịch sử\nLOS","qhtml":null},{"n":9,"q":"An institutional investor has an above average willingness to take risk and a below average\nability to bear risk. The institution's investment adviser should most reasonably conclude that\nthe institution's risk tolerance is:","opts":["below average.","average.","above average."],"ans":"A","expl":"Cũng như các nhà đầu tư cá nhân, mức độ chấp nhận rủi ro của các nhà đầu tư tổ chức được xác định bởi\nkhả năng chịu rủi ro và sẵn sàng chấp nhận rủi ro của họ. Đối với nhà đầu tư tổ chức:\nkhả năng chấp nhận rủi ro dựa trên các tiêu chí khách quan như giá trị hiện tại của tài sản\n(ví dụ: quỹ kế hoạch lương hưu) so với các nghĩa vụ trong tương lai (ví dụ: thanh toán cho người về hưu) và\nsự sẵn sàng chấp nhận rủi ro dựa trên các yếu tố chủ quan (ví dụ: thái độ của nhà đầu tư\nđối với rủi ro).\nNhiệm vụ của cố vấn là dễ dàng nhất khi khả năng chịu rủi ro và sẵn sàng chấp nhận rủi ro của nhà đầu tư\nlà nhất quán với nhau. Các cố vấn có thể đề xuất một cách thích hợp các danh mục đầu tư có nhiều\n(ít) rủi ro hơn và lợi nhuận kỳ vọng cao hơn (thấp hơn) nếu cả khả năng và mức độ sẵn lòng\ncao (thấp). Những khuyến nghị như vậy sẽ khó khăn hơn nếu khả năng và sự sẵn sàng không\nđồng nhất.\nNói chung, khi khả năng và sự sẵn lòng không nhất quán , thì cách thận trọng là\nxác định mức độ chấp nhận rủi ro phản ánh mức thấp hơn trong hai yếu tố . Do đó, đối với\nmột khách hàng tổ chức có mức độ sẵn sàng chấp nhận rủi ro trên mức trung bình và khả năng chịu rủi ro\ndưới mức trung bình, cố vấn sẽ kết luận một cách thích hợp nhất khả năng chấp nhận rủi ro của khách hàng là\ndưới mức trung bình (Lựa chọn B và C).\nNhững điều cần nhớ:\nKhả năng chịu đựng rủi ro của nhà đầu tư tổ chức được xác định bởi khả năng chịu rủi ro, có thể được\nđánh giá một cách khách quan và sự sẵn lòng chấp nhận rủi ro, mang tính chủ quan (ví dụ: dựa trên\nthái độ của nhà đầu tư đối với rủi ro). Khi khả năng và sự sẵn sàng không đồng nhất,\nmức độ chấp nhận rủi ro sẽ phản ánh mức thấp hơn trong hai yếu tố.\nMô tả các thành phần chính của IPS\nLOS","qhtml":null},{"n":10,"q":"Management wishes to limit a company's use of debt since its operating cash flows are\nunpredictable, despite the company's current lenders offering low rates. The company is most\nlikely in its:","opts":["mature phase.","growth phase.","start-up phase."],"ans":"B","expl":"Giai đoạn vòng đời:\nĐặc điểm tài chính và nợ\nGiai đoạn vòng đời Đặc điểm tài chính Đặc điểm nợ\nTăng trưởng doanh thu: Thấp Tính sẵn sàng: Ít hoặc không có\nDòng tiền: Chi phí âm: Cao\nKhởi nghiệp\nRủi ro kinh doanh: Cao Cơ cấu vốn: ~0% nợ\nKhả năng sử dụng: Trung bình\nTăng trưởng doanh thu: Cao\nChi phí: Trung bình\nDòng tiền: Tăng\nTăng trưởng\nLoại nợ: Bảo đảm\nRủi ro kinh doanh: Trung bình\nCơ cấu vốn: Nợ 0%–20%\nTính sẵn có: Cao\nTăng trưởng doanh thu: Chậm lại\nChi phí: Thấp\nDòng tiền: Tích cực/có thể dự đoán\nTrưởng thành\nLoại nợ: Không có bảo đảm\nRủi ro kinh doanh: Thấp\nCơ cấu vốn: > 20% nợ\nTỷ lệ nợ trong cơ cấu vốn của một công ty thường tăng khi công ty di chuyển\ntrong suốt vòng đời của nó giai đoạn.\nTrong giai đoạn khởi nghiệp, ban lãnh đạo muốn vay nợ để tránh bị pha loãng vốn chủ sở hữu\nnhưng công ty không có khả năng tiếp cận nợ do rủi ro cao. Một công ty trong giai đoạn này thường không\ncó đủ tài sản để đảm bảo nợ hoặc đủ dòng tiền để trả nợ.\nTrong giai đoạn tăng trưởng , nợ có sẵn nhiều hơn nhưng ban quản lý thường chọn\nsử dụng nợ một cách thận trọng . Một công ty trong giai đoạn này thường bắt đầu tạo ra\ndòng tiền dương, nhưng ưu tiên là duy trì tính linh hoạt trong hoạt động và\ngiảm thiểu rủi ro tài chính.\nTrong giai đoạn trưởng thành, công ty đang tạo ra dòng tiền liên tục và giảm đòn bẩy tài chính theo thời gian\nnhưng ban quản lý cố gắng duy trì mức nợ gần với mức cấu trúc vốn\ntối ưu của công ty. Một công ty trưởng thành thường sẽ sử dụng việc mua lại cổ phần, được tài trợ bằng nợ, để\ntăng tỷ lệ nợ trong cơ cấu vốn của mình.\nCơ cấu vốn của một công ty cũng có thể được quyết định bởi ngành mà công ty đó hoạt động. Trong kịch bản\nnày, công ty được tận dụng đòn bẩy và có khả năng tiếp cận các khoản nợ chi phí thấp, nhưng ban quản lý\nđang cố gắng giảm thiểu rủi ro kiệt quệ tài chính. Những cân nhắc này cho thấy rằng\ncông ty đang trong giai đoạn tăng trưởng.\n(Lựa chọn A) Trong giai đoạn trưởng thành, một công ty có dòng tiền dương và ít nhu cầu vay nợ hơn.\n(Lựa chọn C) Các công ty khởi nghiệp gặp rủi ro cao hơn đối với các nhà cung cấp vốn; do đó người cho vay sẽ không\ncung cấp lãi suất cho vay thấp cho một công ty khởi nghiệp.\nNhững điều cần nhớ:\nTỷ lệ nợ trong cơ cấu vốn của một công ty thường tăng lên khi công ty chuyển đổi\nqua các giai đoạn trong vòng đời của nó. Trong giai đoạn tăng trưởng, nợ ngày càng sẵn có hơn, nhưng\nban quản lý thường sử dụng nó một cách thận trọng để duy trì tính linh hoạt trong hoạt động và giảm thiểu\nrủi ro tài chính.\nGiải thích các yếu tố ảnh hưởng đến cấu trúc vốn và chi phí vốn bình quân gia quyền\nLOS","qhtml":null},{"n":11,"q":"A company's WACC increased from 4.8% to 5.2%. All else equal, which of the following\nis most likely the reason? The company's:","opts":["equity beta increased.","effective tax rate increased.","preferred stock price increased."],"ans":"A","expl":"Một công ty có thể huy động vốn từ nhiều nguồn khác nhau (ví dụ: nợ, vốn cổ phần phổ thông, vốn cổ phần ưu đãi\nvốn chủ sở hữu), mỗi nguồn có chi phí vốn thành phần khác nhau. Chi phí vốn bình quân gia quyền\n(WACC) của một công ty là bình quân gia quyền của các chi phí thành phần này, được tính theo\ntỷ lệ của từng loại vốn mà công ty hiện sử dụng để hỗ trợ các hoạt động kinh doanh\ncủa mình.\nChi phí vốn cổ phần của một công ty có thể được tính theo nhiều cách, nhưng cách phổ biến nhất là sử dụng\nmô hình định giá tài sản vốn (CAPM). CAPM ước tính chi phí vốn chủ sở hữu\ncủa công ty là lợi nhuận kỳ vọng dựa trên lãi suất phi rủi ro, lợi nhuận kỳ vọng của thị trường,\nvà hệ số beta vốn chủ sở hữu của công ty, vốn đo lường rủi ro. Việc\nbeta của công ty tăng lên hàm ý rủi ro lớn hơn, dẫn đến việc các nhà đầu tư yêu cầu lợi nhuận cao hơn để\nđược bù đắp cho rủi ro đó. Lợi nhuận kỳ vọng lớn hơn này dẫn đến chi phí vốn chủ sở hữu\ntăng và WACC tăng cho công ty.\n(Lựa chọn B) Việc tăng thuế suất hiệu dụng của công ty sẽ làm giảm chi phí sau thuế\ncủa nợ và do đó, WACC của công ty. Điều này chỉ áp dụng ở các quốc gia cho phép khấu trừ lãi suất\nvì mục đích thuế.\n(Lựa chọn C) Việc tăng giá cổ phiếu ưu đãi của công ty sẽ dẫn đến\nchi phí vốn cổ phần ưu đãi và do đó giảm WACC của công ty.\nNhững điều cần nhớ:\nChi phí vốn cổ phần của một công ty thường được tính thông qua vốn mô hình định giá tài sản\n(CAPM), sử dụng phiên bản beta vốn chủ sở hữu của công ty để đo lường rủi ro. Sự gia tăng\nbeta của công ty dẫn đến việc các nhà đầu tư yêu cầu lợi nhuận cao hơn để bù đắp cho rủi ro đó, dẫn đến\nchi phí vốn cổ phần và chi phí vốn bình quân gia quyền (WACC) của công ty tăng lên.\nTính toán và diễn giải chi phí vốn bình quân gia quyền của một công ty\nLOS","qhtml":null},{"n":12,"q":"An analyst collects the following data:\nSharpe Standard\nReturn\nRatio Deviation\nPortfolio A 1.06 13%\nMarket 12% 9%\nThe risk-free rate is 2%. The M-squared value of Portfolio A is closest to:","opts":["11.5%","12.0%","15.8%"],"ans":"A","expl":"Lợi nhuận danh mục đầu tư được so sánh với điểm chuẩn để xác định xem người quản lý danh mục đầu tư\ncó vượt trội hơn điểm chuẩn hay không. Tuy nhiên, chỉ so sánh lợi nhuận sẽ không hữu ích nếu không có\nbiết mức độ rủi ro mà người quản lý phải chịu.\nM2)\nM-squared (hoặc là một công cụ hiệu suất đầu tư có tính đến rủi ro, được đo bằng\nđộ lệch chuẩn. Nó đo lường lợi nhuận vượt mức được điều chỉnh theo rủi ro của danh mục đầu tư\nbằng cách sử dụng tỷ lệ giữa độ lệch chuẩn của thị trường với giá trị độ lệch chuẩn\ncủa danh mục đầu tư. Nếu giá trị M bình phương lớn hơn lợi nhuận thị trường, điều đó cho thấy rằng\ndanh mục đầu tư hoạt động tốt hơn thị trường trên cơ sở điều chỉnh rủi ro.\nViệc sắp xếp lại các số hạng trong phương trình sẽ dẫn đến:\nCác số hạng được tô màu xanh lam biểu thị tỷ lệ Sharpe, vì vậy công thức M bình phương đơn giản hóa thành:\nTỷ lệ sắc nét × σ + Lãi suất phi rủi ro\nm\n= (1,06 × 0,09) + 0,02 = 0,1154 = 11,54%\nLưu ý rằng sự khác biệt giữa M-bình phương của danh mục đầu tư và lợi nhuận thị trường được biết\nlà M-bình phương alpha.\n(Lựa chọn B) 12,0% là giá trị M bình phương của thị trường. Vì M-squared\n đo lường lợi nhuận vượt trội nên không có lợi nhuận vượt mức giữa lợi nhuận của thị trường và chính nó.\n(Lựa chọn C) 15,78% có được bằng cách nhân sai tỷ lệ Sharpe của danh mục đầu tư với\nđộ lệch chuẩn thay vì độ lệch chuẩn của nó. độ lệch chuẩn của thị trường.\nNhững điều cần nhớ:\nM-squared là thước đo đánh giá hiệu suất được điều chỉnh theo rủi ro để đo lường lợi nhuận vượt mức của danh mục đầu tư\nso với lợi nhuận vượt quá của thị trường. Nó được tính bằng cách nhân tỷ lệ Sharpe của danh mục đầu tư với độ lệch chuẩn thị trường và sau đó cộng lãi suất phi rủi ro vào kết quả\n đó.\nTính toán và diễn giải tỷ lệ Sharpe, tỷ lệ Treynor, M2 và alpha\nLOS","qhtml":"<p>An analyst collects the following data:</p><table class=\"qtable\"><thead><tr><th></th><th>Sharpe Ratio</th><th>Return</th><th>Standard Deviation</th></tr></thead><tbody><tr><td>Portfolio A</td><td>1.06</td><td>—</td><td>13%</td></tr><tr><td>Market</td><td>—</td><td>12%</td><td>9%</td></tr></tbody></table><p>The risk-free rate is 2%. The M-squared value of Portfolio A is closest to:</p>"},{"n":13,"q":"When establishing a company's investment decision-making process, which of the following\nrecommendations would be most appropriate ?","opts":["Ignore sunk costs as part of the investment analysis.","Use ROE as a key determinant in investment decisions.","Rely primarily on allocation templates to improve turnaround."],"ans":"A","expl":"Những cạm bẫy thường gặp trong phân bổ vốn\nTỷ lệ chiết khấu không đúng\nLỗi kế toán\nTính toán sai lầm\nƯớc tính kém về chi phí chung\nLạm dụng hoặc lạm dụng các mẫu phân bổ\nƯu tiên IRR cho các khoản đầu tư có dòng tiền không đồng đều\ndòng\nKhiếm khuyết trong quy trình\nBao gồm chi phí chìm\nBỏ qua chi phí cơ hội\nKhông nắm bắt được đối thủ cạnh tranh phản hồi với\nđầu tư\nThiếu xem xét kỹ lưỡng xung quanh các dự án thú cưng\nQuyết định quản lý sai lầm-\nSự phụ thuộc vào các số liệu ngắn hạn (ví dụ: EPS, ROE)\ngây ra việc phân bổ bội chi hoặc chi tiêu dưới mức\nngân sách\nKhông xem xét các lựa chọn đầu tư thay thế\nCác nguyên tắc chung về phân bổ vốn (tức là ra quyết định đầu tư) thường rất\nkhó áp dụng vì:\nmột số quyết định mang tính chủ quan, cần có sự phán đoán của người quản lý và\nmột số rủi ro nhất định có thể khó nắm bắt trong các mô hình phân bổ vốn.\nQuy trình phân bổ vốn hiệu quả không bao gồm các chi phí chìm (tức là các chi phí không thể thu hồi được\nđã phát sinh trong quá khứ). Chỉ nên xem xét những chi phí ảnh hưởng trực tiếp hoặc bị ảnh hưởng bởi quyết định đầu tư\n; do đó, nên bỏ qua chi phí chìm.\n(Lựa chọn B) Tập trung vào ROE thay vì NPV có thể không dẫn đến các khoản đầu tư cải thiện sự giàu có của cổ đông dài hạn\n. Thông thường, các công ty tập trung vào ROE để tăng hiệu suất ngắn hạn;\ncác khoản đầu tư có NPV lớn có thể mất thời gian để sinh lãi và sẽ không cải thiện\nhiệu suất ngắn hạn.\n(Lựa chọn C) Các mẫu phân bổ đầu tư có thể cải thiện hiệu quả trong quá trình ra quyết định\nnhưng các đặc điểm của cơ hội đầu tư không phù hợp với\nmẫu chuẩn hóa có thể là vô tình bị bỏ qua. Thay vì quay vòng nhanh chóng, một\nquy trình phân bổ vốn hiệu quả nên tập trung chủ yếu vào việc nắm bắt đúng các đặc điểm\nđầu tư.\nNhững điều cần nhớ:\nCó một số cạm bẫy phổ biến mà các công ty có thể gặp phải khi đưa ra quyết định đầu tư\n. Các nhà phân tích đầu tư nên bỏ qua chi phí chìm, tránh dựa vào các mẫu\nphân bổ và tập trung vào NPV thay vì các số liệu như ROE, vốn thường tập trung\nngắn hạn.\nMô tả các nguyên tắc phân bổ vốn và những cạm bẫy phân bổ vốn phổ biến\nLOS","qhtml":null},{"n":14,"q":"A company is evaluating the production of a new product that requires an initial outlay of CHF\n1 billion. The product is expected to produce after-tax cash flows of CHF 250 million for six\nyears. The company anticipates that the new product will reduce existing product sales, net of\nvariable costs, by CHF 50 million each year the new product is sold. Based on only this\ninformation, the project's IRR is closest to:","opts":["5.5%","7.9%","13.0%"],"ans":"A","expl":"Tỷ suất hoàn vốn nội bộ (IRR) là một thước đo mà các công ty sử dụng để đánh giá khả năng sinh lời\ncủa dự án. Chính tỷ lệ chiết khấu sẽ đặt giá trị hiện tại ròng (NPV) của dự án về 0. Nếu\nIRR lớn hơn (thấp hơn) tỷ lệ chiết khấu thực tế của dự án (tức là tỷ suất lợi nhuận yêu cầu\nhoặc WACC), thì dự án được kỳ vọng là có lãi (không có lãi) vì lợi tức của\ndự án vượt quá (vượt quá) chi phí cơ hội của vốn.\nTổng dòng tiền (CF) của dự án phải tính đến tác động của các yếu tố bên ngoài (ví dụ:\nsự ăn thịt người, nhận diện thương hiệu gia tăng). Trong kịch bản này, vì sản phẩm mới\ndự kiến ​​sẽ chiếm 50 doanh thu thuần của sản phẩm hiện tại mỗi kỳ, nên nên sử dụng CF ròng là 200 (thay vì\n250). Tiến trình đầu tư và CF được hiển thị bên dưới:\nSử dụng máy tính tài chính và những dữ liệu đầu vào này, IRR cho dự án này gần nhất với 5,5%.\n(Lựa chọn B) 7,9% là kết quả của việc thay đổi thời gian của CF lên một năm và kết hợp\nnăm đầu tiên của CF với khoản đầu tư ban đầu.\n(Lựa chọn C) 13,0% là do không tính đến các yếu tố bên ngoài và để lại\nCF của dự án ở mức 250 triệu CHF.\nNhững điều cần nhớ:\nTỷ lệ hoàn vốn nội bộ (IRR) là tỷ lệ chiết khấu đặt giá trị hiện tại ròng của dự án về\n0. Nếu IRR lớn hơn (nhỏ hơn) tỷ lệ chiết khấu thực tế của dự án thì dự án\ndự kiến ​​sẽ có lãi (không có lãi). Dòng tiền của dự án phải tính đến tác động\ncủa các yếu tố bên ngoài.\nMô tả quá trình phân bổ vốn, tính giá trị hiện tại ròng (NPV), tỷ suất hoàn vốn nội bộ\n(IRR) và lợi tức trên vốn đầu tư (ROIC), đồng thời đối chiếu việc sử dụng chúng trong phân bổ vốn\nLOS","qhtml":null},{"n":15,"q":"A company that relies heavily on secondary liquidity sources is most likely to:","opts":["reduce its credit risk.","experience financial instability.","receive an audit request from regulators."],"ans":"B","expl":"Các nguồn thanh khoản sơ cấp và thứ cấp\nTiền mặt và chứng khoán có thể bán được\nCác khoản vay từ ngân hàng, trái chủ hoặc\nTín dụng thương mại của nhà cung cấp chính\nDòng tiền hoạt động\nCổ tức bị đình chỉ hoặc giảm\nChi phí vốn bị trì hoãn hoặc giảm\nVốn chủ sở hữu mới\nThứ cấp\nCác điều khoản hợp đồng được thương lượng lại\nXử lý tài sản\nBảo vệ phá sản và tổ chức lại\nTính thanh khoản của tổ chức phát hành gắn liền với khả năng đáp ứng các nghĩa vụ tài chính ngắn hạn của tổ chức đó: làm thế nào\nnhà phát hành có thể dễ dàng chuyển đổi tài sản của mình thành tiền mặt hoặc bảo đảm các tài sản lưu động khác để trang trải\ncác khoản nợ trước mắt. Các nguồn thanh khoản có thể được phân loại thành sơ cấp hoặc thứ cấp.\nCác nguồn thanh khoản sơ cấp được ưa thích hơn vì chúng thường không\ntác động đến các hoạt động đang diễn ra ; tuy nhiên, việc sử dụng các nguồn thứ cấp có thể trở nên\ncần thiết. Các nguồn thanh khoản thứ cấp có thể phải gánh chịu chi phí lớn hơn, làm gián đoạn hoạt động\ncủa công ty, ảnh hưởng đến tiềm năng tăng trưởng và/hoặc báo hiệu hiệu quả hoạt động kém đối với các cổ đông và\nchủ nợ. Việc sử dụng các nguồn thanh khoản thứ cấp có thể cho thấy rằng sự ổn định tài chính\ncủa công ty đang xấu đi.\n(Lựa chọn A) Nếu một công ty phụ thuộc nhiều vào các nguồn thanh khoản thứ cấp, nó có thể làm giảm\nuy tín tín dụng của nó với người cho vay, những người sẽ coi công ty là rủi ro tín dụng lớn hơn. Nhận thức\nnày có thể dẫn đến điều khoản tín dụng tồi tệ hơn và/hoặc lãi suất cho vay cao hơn.\n(Lựa chọn C) Yêu cầu kiểm toán từ cơ quan quản lý không dựa trên nguồn thanh khoản. Những\nyêu cầu này là các hoạt động kiểm tra tuân thủ quy định định kỳ hoặc được thực hiện để đáp lại những mối quan ngại hoặc nghi ngờ cụ thể\n về những sai phạm trong kế toán.\nNhững điều cần nhớ:\nTính thanh khoản của tổ chức phát hành liên quan đến khả năng thực hiện các nghĩa vụ tài chính ngắn hạn của tổ chức đó. Các nguồn thanh khoản chính\nđược ưu tiên vì chúng thường không ảnh hưởng đến các hoạt động đang diễn ra.\nCác nguồn thanh khoản thứ cấp có thể phải gánh chịu chi phí lớn hơn, làm gián đoạn hoạt động của công ty, ảnh hưởng đến\ntiềm năng tăng trưởng và/hoặc báo hiệu hiệu quả hoạt động kém đối với các cổ đông và chủ nợ. Việc sử dụng\ncác nguồn thanh khoản thứ cấp có thể cho thấy sự ổn định tài chính của công ty đang xấu đi.\nGiải thích tính thanh khoản và so sánh mức thanh khoản của các tổ chức phát hành\nLOS","qhtml":null},{"n":16,"q":"When developing the constraints for an Investment Policy Statement, which of the following\nwould most appropriately be considered a \"unique circumstance\"?","opts":["An insurance company has more uncertain cash flows than its peers.","An individual's retirement plan is heavily invested in employer common stock.","A pension fund is legally restricted from holding more than 50% of its assets in equities."],"ans":"B","expl":"Hạn chế đầu tư\nChiều dài mục tiêu đầu tư\nChân trời thời gian\nTình trạng, xử lý hồ sơ\nThuế\nCần tiền mặt trong thời gian\nThanh khoản\nchân trời\nTất cả các luật trong khu vực pháp lý\nTình trạng pháp lý đặc biệt (ví dụ,\npháp lý\nlương hưu)\nĐặc biệt\nMột khía cạnh đặc biệt của khách hàng\nhoàn cảnh\nKhi xây dựng một tuyên bố chính sách đầu tư (IPS), một cố vấn sẽ phải xem xét\nnhiều hạn chế đầu tư ảnh hưởng đến tài sản của khách hàng sẽ như thế nào\nđược đầu tư. Các trường hợp đặc biệt đề cập đến bất kỳ khía cạnh nào trong tình huống của khách hàng mà không\nđược bao phủ bởi một trong những hạn chế đầu tư khác. Các trường hợp đặc biệt bao gồm:\nNiềm tin và giá trị của khách hàng (ví dụ: tôn giáo, đạo đức)\nThực hành môi trường, xã hội và quản trị (ESG)\nMột phần tài sản của khách hàng không có trong danh mục đầu tư của người quản lý và do đó không nằm trong danh mục đầu tư của người quản lý.\nkiểm soát\nCố vấn phải xem xét tất cả tài sản của khách hàng, ngay cả những tài sản nằm ngoài tầm kiểm soát của cố vấn,\nkhi xây dựng một IPS. Cụ thể, tài sản cần được đưa vào kế hoạch để đáp ứng\nmục tiêu rủi ro và lợi nhuận bằng cách sử dụng đa dạng hóa.\nVí dụ: nếu kế hoạch nghỉ hưu của khách hàng được đầu tư nhiều vào cổ phiếu của khách hàng đó\nngười sử dụng lao động, khách hàng phải đối mặt với rủi ro của người sử dụng lao động đó hai lần: cả hai đều thông qua cổ phiếu\ngiá trị và thông qua một nguồn thu nhập. Người cố vấn phải bao gồm điều duy nhất này\nhoàn cảnh trong IPS của khách hàng để đáp ứng mục tiêu rủi ro của khách hàng.\n(Lựa chọn A) Một công ty bảo hiểm có dòng tiền không đều và không chắc chắn hơn công ty bảo hiểm\ncác công ty cùng ngành là một yếu tố ảnh hưởng đến nhu cầu tiền mặt của công ty và do đó sẽ là một yếu tố thanh khoản\nhạn chế.\n(Lựa chọn C) Một quỹ hưu trí bị pháp luật hạn chế nắm giữ hơn 50% tài sản của mình\ntrong cổ phiếu là một hạn chế pháp lý đối với các khoản đầu tư lương hưu và do đó sẽ là một hạn chế pháp lý\nvà hạn chế về quy định.\nNhững điều cần nhớ:\nCác trường hợp đặc biệt đề cập đến bất kỳ khía cạnh nào trong tình huống của khách hàng không được đề cập ở một trong các\nnhững hạn chế đầu tư khác. Khi khách hàng có tài sản hoặc của cải khác nằm ngoài\nsự kiểm soát của cố vấn, những điều này vẫn phải được xem xét khi xây dựng IPS để\nđáp ứng các mục tiêu về rủi ro và lợi nhuận của khách hàng.\nMô tả những hạn chế đầu tư về tính thanh khoản, thời gian, mối quan tâm về thuế, pháp lý và quy định\ncác yếu tố, hoàn cảnh đặc biệt và ý nghĩa của chúng đối với việc lựa chọn tài sản danh mục đầu tư\nLOS","qhtml":null},{"n":17,"q":"The covariance of a security return's with the market's return is 0.065, and the market's\nreturns have a standard deviation of 0.23. The security's systematic risk is most likely :","opts":["less than market risk.","equal to market risk.","greater than market risk."],"ans":"C","expl":"Beta của chứng khoán phản ánh mức độ rủi ro hệ thống của nó - độ nhạy cảm của lợi nhuận của nó đối với thị trường\nbiến động. Bản thân thị trường có hệ số beta là 1. Khi hệ số beta của chứng khoán:\ncó giá trị tuyệt đối > |1| thì chứng khoán đó có rủi ro lớn hơn rủi ro của thị trường.\ncó giá trị tuyệt đối < |1| thì chứng khoán có ít rủi ro hơn rủi ro của thị trường.\nlà dương (tức là > 0), chứng khoán thường di chuyển cùng hướng với thị trường.\nlà âm (tức là < 0), chứng khoán thường di chuyển theo hướng ngược lại với\nthị trường.\nBeta được tính bằng cách sử dụng độ lệch chuẩn của cả chứng khoán và thị trường cũng như\nmối tương quan giữa chứng khoán và thị trường hoặc, cách khác, sử dụng\nphương sai và hiệp phương sai giữa chứng khoán và thị trường.\nTrong trường hợp này, phiên bản beta của bảo mật có thể được tính như sau:\nVì phiên bản beta của chứng khoán có giá trị tuyệt đối lớn hơn 1, điều này cho thấy rằng\nrủi ro hệ thống của chứng khoán lớn hơn rủi ro của thị trường (Lựa chọn A và B).\nNhững điều cần nhớ:\nBeta đo lường rủi ro hệ thống, cho biết mức độ nhạy cảm của lợi nhuận của chứng khoán đối với những thay đổi trong\nthị trường. Beta thị trường = 1. Beta có giá trị tuyệt đối lớn hơn (nhỏ hơn) 1\nchỉ ra rằng rủi ro của chứng khoán lớn hơn (ít hơn) rủi ro của thị trường. Beta được tính bằng cách sử dụng\nđộ lệch chuẩn của cả chứng khoán và thị trường cũng như mối tương quan giữa\nchứng khoán và thị trường hoặc, cách khác, sử dụng phương sai của thị trường và hiệp phương sai\ngiữa chứng khoán và thị trường.\nTính toán và giải thích beta\nLOS","qhtml":null},{"n":18,"q":"A company is evaluating two projects. Project A has an IRR of 6.4%, and Project B has an\nIRR of 7.5%. The company has the following information:\nNext year's dividend ¥40\nDividend growth rate 2.5%\nStock price ¥500\nAfter-tax cost of debt 5.0%\nDebt-to-equity ratio 80%\nAssuming average risk and no capital constraints, the company should most likely invest in:","opts":["both projects.","only Project B.","neither project."],"ans":"C","expl":"Chi phí vốn bình quân gia quyền (WACC) của một công ty đo lường chi phí huy động vốn\nbổ sung, giả sử các dự án mới được tài trợ bởi cùng một tỷ lệ vốn. WACC thường\nđược sử dụng để đánh giá khả năng sinh lời của các dự án mới. Khi các dự án có\nrủi ro trung bình, tỷ suất hoàn vốn nội bộ ( IRR ) nhỏ hơn (lớn hơn) WACC của công ty có nghĩa là\ndự án được coi là không sinh lời (có lãi) vì lợi nhuận của nó thấp hơn (lớn hơn) so với\nchi phí cơ hội vốn của công ty.\nTrong câu hỏi này, để tính WACC, chi phí vốn cổ phần phải được tính qua\nmô hình tăng trưởng Gordon, thì trọng số của nợ và vốn chủ sở hữu phải được tính từ\ntỷ lệ nợ trên vốn chủ sở hữu (D/E) của công ty. Điều này có thể được thực hiện như sau:\nWACC của công ty là 8,06%. Vì cả hai dự án đều có IRR nhỏ hơn\nWACC của công ty nên công ty không nên đầu tư vào dự án nào.\n(Lựa chọn A) Công ty sẽ đầu tư vào cả hai dự án nếu tỷ lệ D/E bị hiểu sai\nlà tỷ lệ phần trăm vốn của công ty được tài trợ bằng nợ khi tính WACC. Điều này\nsẽ dẫn đến WACC là 6,1%.\n(Lựa chọn B) Công ty sẽ chỉ đầu tư vào Dự án B nếu tốc độ tăng trưởng cổ tức không được\nthêm vào ( D / V ) khi tính chi phí vốn cổ phần (8%). Điều này sẽ dẫn đến WACC là\n1 0\n6,67%.\nNhững điều cần nhớ:\nChi phí vốn bình quân gia quyền (WACC) của một công ty đo lường chi phí huy động vốn\nthêm. Khi các dự án có rủi ro trung bình, tỷ suất hoàn vốn nội bộ (IRR) thấp hơn\nWACC của công ty có nghĩa là dự án được coi là không có lãi vì lợi nhuận của nó thấp hơn\nchi phí cơ hội vốn của công ty.\nTính toán và diễn giải chi phí vốn bình quân gia quyền của một công ty\nLOS","qhtml":null},{"n":19,"q":"The security market line is best described as:","opts":["the graphical representation of the CAPM.","relating to only portfolios on the efficient frontier.","intersecting the y-axis at the market risk premium."],"ans":"A","expl":"Mô hình định giá tài sản vốn (CAPM) cho phép các nhà đầu tư ước tính lợi nhuận dự kiến\ncủa chứng khoán dựa trên phiên bản beta của chứng khoán đó, lợi nhuận của thị trường và lãi suất phi rủi ro. Beta tính toán\nlợi nhuận kỳ vọng của chứng khoán chỉ dựa trên rủi ro hệ thống của nó.\nĐường thị trường chứng khoán (SML) là biểu diễn đồ họa của CAPM , hiển thị\nmối quan hệ tuyến tính giữa lợi nhuận kỳ vọng (trục y) và beta (trục x) của chứng khoán.\nSML cho phép nhà đầu tư xác định giá trị tương đối của chứng khoán. Chứng khoán nằm trên\nSML được coi là có giá trị khá cao. Ngược lại:\nChứng khoán biểu thị trên SML bị định giá thấp (nghĩa là lợi nhuận lớn hơn dự kiến đối với\nmức độ rủi ro), do đó giá trị sẽ tăng và lợi tức kỳ vọng sẽ giảm.\nChứng khoán có biểu đồ dưới SML được định giá quá cao (nghĩa là lợi nhuận ít hơn mong đợi đối với\nlượng rủi ro), do đó giá trị sẽ giảm và lợi tức kỳ vọng sẽ giảm tăng.\n(Lựa chọn B) Đường thị trường vốn chỉ liên quan đến các danh mục đầu tư trên đường biên hiệu quả. SML\nliên quan đến bất kỳ chứng khoán hoặc tài sản nào.\n(Lựa chọn C) SML giao với trục y ở lãi suất không có rủi ro. Phần bù rủi ro thị trường là\nđộ dốc của SML.\nNhững điều cần nhớ:\nMô hình định giá tài sản vốn (CAPM) cho phép các nhà đầu tư ước tính lợi nhuận kỳ vọng\ncủa một chứng khoán dựa trên beta của chứng khoán đó, lợi nhuận của thị trường và lãi suất phi rủi ro. Đường thị trường chứng khoán\nlà biểu diễn đồ họa của CAPM, hiển thị mối quan hệ tuyến tính\ngiữa lợi nhuận kỳ vọng của chứng khoán và phiên bản beta của nó.\nGiải thích mô hình định giá tài sản vốn (CAPM), bao gồm các giả định của nó và đường thị trường chứng khoán\n(SML)\nLOS","qhtml":null},{"n":20,"q":"A company's current financial information includes the following data:\nUnlevered value (AUD millions) 1.75\nDebt (AUD millions) 0\nCost of equity (%) 8\nTax rate (%) 30\nIf the company borrows AUD 1 million at a rate of 4% for a stock buyback, then after the\nbuyback and based on the Modigliani-Miller propositions (with taxes), the company's WACC\nis closest to:","opts":["5.71%","6.83%","8.00%"],"ans":"B","expl":"Các đề xuất của Modigliani-Miller (MM) cho rằng, giả sử thị trường vốn\nhiệu quả hoàn hảo, giá trị của công ty và WACC không bị ảnh hưởng bởi những thay đổi về cơ cấu vốn. Tuy nhiên,\nnếu giả định thị trường hiệu quả hoàn hảo được nới lỏng để thừa nhận thuế doanh nghiệp, thì tất cả các yếu tố khác\nbằng nhau, thì theo mệnh đề MM:\nGiá trị thị trường của một công ty có vay nợ lớn hơn giá trị thị trường của một công ty không có nợ vay nhưng\nvề mặt khác do lá chắn thuế nợ.\nVì giá trị của công ty có vay nợ lớn hơn , WACC của nó phải thấp hơn .\nChi phí vốn cổ phần thay đổi tỷ lệ với thuế-\ntỷ lệ D/E điều chỉnh của công ty có vốn vay.\nTrong trường hợp này, công ty hiện không có nợ nên WACC của nó bằng chi phí vốn chủ sở hữu. Sau\nthêm đòn bẩy, WACC của công ty được tính như sau:\nWACC có đòn bẩy là khoảng 6,83%. Tất cả các yếu tố khác đều bằng nhau, với đòn bẩy , WACC\ncủa công ty thấp hơn WACC không có đòn bẩy tài chính (8,00%); lợi ích của lá chắn thuế\nlàm tăng giá trị của công ty, giảm WACC (Lựa chọn C) .\n(Lựa chọn A) 5,71% là kết quả của việc sử dụng giá trị không có đòn bẩy tài chính của công ty để tính chi phí vốn cổ phần có đòn bẩy\n.\nNhững điều cần nhớ:\nMiller Modigliani-Miller các mệnh đề cho rằng, trong các thị trường vốn hiệu quả hoàn hảo, cấu trúc vốn\nkhông ảnh hưởng đến giá trị của công ty. Tất cả các yếu tố khác đều như nhau, nếu xem xét thuế, thì một công ty\ncó vay nợ có thể có giá trị lớn hơn, chi phí vốn cổ phần lớn hơn và WACC thấp hơn so với một công ty\nkhông có nợ vay nhưng lại giống hệt nhau.\nGiải thích các mệnh đề Modigliani–Miller liên quan đến cấu trúc vốn\nLOS","qhtml":null},{"n":21,"q":"In a corporation, shareholder voting rights most appropriately may be used to:","opts":["replace the board of directors.","make decisions on daily operations.","change the executive-level management."],"ans":"A","expl":"Đặc điểm chính của tập đoàn\nThực thể pháp lý riêng biệt, khác biệt với chủ sở hữu\nNhận dạng pháp lý\nĐược hợp nhất theo luật của một cơ quan quản lý\nCổ đông ủy quyền hoạt động cho một ban giám đốc được bầu,\nChủ sở hữu-người quản lý\nthuê quản lý\ntách\nCổ đông có trách nhiệm hữu hạn\nTrách nhiệm chủ sở hữu\nRủi ro được phân bổ theo tỷ lệ sở hữu cổ phần\nTruy cập dễ dàng hơn\nTài chính bên ngoài\nLinh hoạt hơn: số lượng chủ sở hữu và chuyển nhượng cổ phần\nTất cả lợi nhuận chịu thuế đối với tập đoàn\nLợi nhuận phân phối (cổ tức) chịu thuế cho các cổ đông (gấp đôi\nThuế\nthuế) ở một số khu vực pháp lý\nMột đặc điểm quan trọng của các tập đoàn, công hay tư, là\nsự tách biệt giữa quyền sở hữu và quản lý : chủ sở hữu bầu ra một ban giám đốc để thuê\nvà giám sát các nhà quản lý chuyên nghiệp, những người phụ trách hoạt động hàng ngày.\nHội đồng quản trị được các cổ đông bầu ra, chủ yếu đại diện cho lợi ích của cổ đông\n. Hội đồng quản trị thay mặt cho các cổ đông giám sát các giám đốc điều hành của công ty.\nCác cổ đông có thể sử dụng quyền biểu quyết của mình để quyết định các vấn đề về quản trị doanh nghiệp và\ncác giao dịch của công ty cũng như thúc đẩy những thay đổi chiến lược trong công ty. Ví dụ: quyền biểu quyết\ncó thể được sử dụng để thay thế hội đồng quản trị hoặc một số thành viên hội đồng quản trị bằng những cá nhân sẽ lãnh đạo\ncông ty theo hướng mong muốn.\nDo sự tách biệt giữa chủ sở hữu và người quản lý, quyền biểu quyết của cổ đông thường không\nmở rộng đến các quyết định liên quan đến hoạt động hàng ngày hoặc việc thay thế các giám đốc điều hành (Lựa chọn B\nvà C) . Trong một số trường hợp, các cổ đông lớn và/hoặc các cổ đông hoạt động tích cực có thể tìm cách gây ảnh hưởng đến công ty\n, nhưng họ phải làm như vậy bằng cách kiểm soát các ghế trong hội đồng quản trị.\nNhững điều cần nhớ:\nMột công ty có đặc điểm là sự tách biệt giữa quyền sở hữu và quản lý: các hoạt động hàng ngày\nthường được điều hành bởi một nhóm các nhà quản lý chuyên nghiệp, được giám sát bởi một\nban giám đốc do cổ đông bầu ra. Các cổ đông có thể sử dụng quyền biểu quyết của mình để thúc đẩy\nnhững thay đổi chiến lược, chẳng hạn như thay thế giám đốc, nhưng không thể quản lý hoạt động hàng ngày hoặc trực tiếp chọn\nngười quản lý.\nMô tả các đặc điểm chính của các tổ chức phát hành doanh nghiệp\nLOS","qhtml":null},{"n":22,"q":"For a firm that is financed with equity and debt, which of the following statements best\ndescribes the firm's optimal capital structure?","opts":["With less debt than is optimal, tax benefits outweigh financial distress costs.","At the optimal capital structure, the unlevered value of the firm is maximized.","At the optimal capital structure, the investors' required rate of return is maximized."],"ans":"A","expl":"Một công ty trưởng thành thường đưa nợ (tức là đòn bẩy tài chính) vào cấu trúc vốn của mình kể từ khi\nchi phí nợ thường rẻ hơn chi phí vốn cổ phần. Ngoài ra, chi phí lãi vay\ncác khoản khấu trừ tạo ra một lá chắn thuế giúp nâng cao thu nhập và giá trị công ty. Tuy nhiên, ngày càng tăng\nnợ cũng có thể làm tăng nguy cơ gặp khó khăn về tài chính hoặc phá sản của công ty có vốn vay.\nVì vậy, khi công ty sử dụng vốn vay, sẽ có sự cân bằng giữa lợi ích về thuế và chi phí\nkiệt quệ tài chính/phá sản.\nKhi công ty tăng thêm nợ, cho đến mức nợ tối ưu (tức là cơ cấu vốn tối ưu), thuế\nlợi ích lớn hơn chi phí kiệt quệ tài chính, làm tăng giá trị công ty. Ở mức vốn tối ưu\ncấu trúc, giá trị công ty được tối đa hóa. Nếu công ty sử dụng nhiều nợ hơn mức tối ưu thì giá trị\ncủa công ty có vay nợ sẽ giảm xuống do chi phí cho rủi ro kiệt quệ lớn hơn chi phí bổ sung\nlợi ích về thuế.\nCơ cấu vốn tối ưu (lý thuyết) này tạo ra sự khác biệt lớn nhất giữa thuế\nlợi ích và chi phí kiệt quệ tài chính/phá sản, từ đó tối đa hóa giá trị của công ty có vay nợ.\n(Lựa chọn B) Giá trị công ty không có nợ vay không bị ảnh hưởng bởi nợ vì một công ty không có nợ chỉ có\nvốn chủ sở hữu trong cơ cấu vốn của nó. Giá trị công ty có vay nợ sẽ được tối đa hóa ở mức tối ưu\ncơ cấu vốn.\n(Lựa chọn C) Tỷ suất lợi nhuận yêu cầu đối với nhà đầu tư là chi phí vốn bình quân gia quyền\n(WACC) cho công ty. Ở cơ cấu vốn tối ưu, WACC được giảm thiểu và giá trị công ty là\ntối đa hóa.\nNhững điều cần nhớ:\nKhi công ty tăng thêm nợ, cho đến mức nợ tối ưu, lợi ích về thuế sẽ lớn hơn lợi ích tài chính.\nchi phí kiệt quệ, tăng giá trị doanh nghiệp. Ở mức cơ cấu vốn tối ưu, giá trị doanh nghiệp là\nđược tối đa hóa và lợi nhuận yêu cầu của nhà đầu tư được giảm thiểu. Nếu công ty sử dụng nhiều nợ hơn mức hiện có\ntối ưu, giá trị của công ty có vay nợ sẽ giảm xuống do chi phí của rủi ro kiệt quệ\nlớn hơn những lợi ích về thuế bổ sung.\nMô tả cấu trúc vốn tối ưu và mục tiêu\nLOS","qhtml":null},{"n":23,"q":"A trader at an investment management firm mistakenly buys 10,000 shares of stock instead\nof the intended 1,000 shares. The types of risks that interact as a result are best\ncategorized as:","opts":["operational and market.","compliance, legal, and liquidity.","operational, settlement, and credit."],"ans":"A","expl":"Rủi ro phi tài chính\nVí dụ về nguồn\nSự không chắc chắn từ giao dịch\nPhá sản trước\nflow\nGiải quyết\nvận chuyển hàng hóa\nSự khác biệt về múi giờ\nKhả năng xảy ra các vụ kiện\nTrọng tài để giải quyết a\nKhông duy trì hợp đồng\nPháp lý\ntranh chấp thương mại\nđiều khoản\nKhông tuân thủ\nQuy định tuân thủ\n(ví dụ: quy định, Báo cáo lại thu nhập\nThay đổi trong kế toán\nkế toán, thuế)\ntiêu chuẩn\nSử dụng mô hình không chính xác\nRủi ro được đánh giá thấp từ\nMô hình Sử dụng mô hình chính xác\ngiả định không chính xác\n(bao gồm rủi ro đuôi)\nkhông chính xác\nphân phối bình thường\nLỗi nhân viên hoặc gian lận\nHoạt động Hoạt động của kẻ giao dịch lừa đảo\nKhông đủ các chính sách\nThiếu kiểm soát các sự kiện\nThiệt hại do cơn bão bên ngoài\nKhó khăn trong việc dự đoán các sự kiện\nCạn kiệt tiền mặt\nKhả năng thanh toán Phá sản hoặc thanh lý\nKhông có khả năng thực hiện nghĩa vụ\nTrong khuôn khổ quản lý rủi ro, rủi ro ở cấp doanh nghiệp được phân loại là\ntài chính hoặc phi tài chính dựa trên nguồn chứ không phải là hậu quả của rủi ro\n. Do đó, một số rủi ro gây ra hậu quả tài chính được phân loại là rủi ro\nphi tài chính.\nRủi ro phi tài chính có thể bắt nguồn từ bên trong một công ty (ví dụ: nhân viên, hệ thống) hoặc từ\nnguồn bên ngoài (ví dụ: cơ quan quản lý, thiên tai) nhưng nằm ngoài thị trường tài chính. Rủi ro tài chính\nbắt nguồn từ thị trường tài chính .\nRủi ro tài chính\nVí dụ nguồn\nBiến động lãi suất thị trường Ngân hàng trung ương tăng lãi suất\nKhông thanh toán/giao hàng như đã thỏa thuận Công ty vỡ nợ trái phiếu\nTín dụng\n(ví dụ: rủi ro đối tác, rủi ro vỡ nợ) thanh toán\nPhải giảm giá đáng kể Công ty cần tăng tiền mặt\nTính thanh khoản\ngiá để bán tài sản nhanh chóng\nTrong trường hợp này, hai rủi ro tương tác khi rủi ro hoạt động phi tài chính (tức là lỗi nhân viên\n) tạo ra rủi ro thị trường tài chính: công ty hiện phải chịu rủi ro biến động thị trường\ndo bổ sung 9.000 cổ phiếu được mua do nhầm lẫn.\n(Lựa chọn B) Không có gì trong kịch bản này cho thấy rủi ro được phân loại\nlà tuân thủ (ví dụ: vấn đề quy định), pháp lý (ví dụ: vi phạm hợp đồng) hoặc thanh khoản (ví dụ: không thể\nbán với giá thị trường hợp lý).\n(Lựa chọn C) Rủi ro hoạt động đã xảy ra, nhưng rủi ro được phân loại là giải quyết (tức là thời gian\nthanh toán) và tín dụng (tức là vỡ nợ), thường có liên quan với nhau, không liên quan đến trường hợp này.\nNhững điều cần nhớ:\nRủi ro phi tài chính có thể bắt nguồn từ bên trong một công ty hoặc từ các nguồn bên ngoài nhưng nằm ngoài\nthị trường tài chính. Rủi ro tài chính bắt nguồn từ thị trường tài chính. Hai rủi ro này có thể\ntương tác với nhau khi rủi ro phi tài chính cũng trở thành rủi ro tài chính.\nXác định các nguồn rủi ro tài chính và phi tài chính và mô tả cách chúng có thể tương tác\nLOS","qhtml":null},{"n":24,"q":"This question has been deactivated. Please do not rely on the content/concept discussed in this\nquestion as it might be outdated or inaccurate. Due to the volume of feedback, it is not possible for\nus to discuss the reason for deactivation in detail.\nIn capital budget decisions, which of the following best describes a project sequencing\ninteraction?","opts":["Ranking investment selections based on projects' net present values","Choosing projects with shorter payback periods to speed reinvestment of capital","Investing in a project today to create the option to invest in another, future projects"],"ans":"C","expl":"Các công ty thường xuyên đánh giá khả năng sinh lời của các dự án dựa trên\ndòng tiền dự kiến ​​của họ. Không có ràng buộc nào, các công ty có thể đảm nhận mọi dự án có giá trị hiện tại ròng\nròng (NPV) dương. Tuy nhiên, các công ty thường buộc phải đưa ra lựa chọn vì những ràng buộc\nngăn cản họ theo đuổi tất cả các dự án có lợi nhuận hoặc có thể yêu cầu một trình tự cụ thể để hoàn thành dự án\n. Tùy thuộc vào hoàn cảnh, các tương tác dự án này bao gồm:\ntrình tự dự án,\nphân bổ vốn và\ncác dự án loại trừ lẫn nhau.\nVới trình tự dự án, khả năng thực hiện một dự án phụ thuộc\nvào việc hoàn thành một dự án khác . Ví dụ: việc hoàn thành thành công một dự án có thể\ntạo ra lựa chọn đầu tư vào các dự án ngẫu nhiên trong tương lai, giả định các điều kiện kinh tế thuận lợi\ntại thời điểm đó.\n(Lựa chọn A) Việc ra lệnh lựa chọn đầu tư dựa trên giá trị hiện tại ròng của dự án là một\ntiêu chí chung để đưa ra quyết định đầu tư nhưng không liên quan đến trình tự dự án.\n(Lựa chọn B) Chọn dự án với thời gian hoàn vốn ngắn hơn để tăng tốc độ tái đầu tư của quỹ\nlà một tiêu chí để đưa ra quyết định đầu tư, nhưng nó không liên quan đến trình tự dự án\n. Thời gian hoàn vốn được coi là tiêu chí kém hơn so với NPV vì nó không\ntính đến hiệu suất trong toàn bộ thời gian đầu tư.\nNhững điều cần nhớ:\nTrình tự dự án, phân bổ vốn hoặc tính độc quyền lẫn nhau là những hạn chế có thể ngăn cản các công ty\ntheo đuổi tất cả các dự án sinh lời hoặc yêu cầu một thứ tự cụ thể để hoàn thành dự án\n. Với trình tự dự án, khả năng thực hiện một dự án phụ thuộc vào\nsự hoàn thành thành công của một dự án khác.\nMô tả quy trình phân bổ vốn, tính giá trị hiện tại ròng (NPV), tỷ suất hoàn vốn nội bộ\n(IRR) và lợi tức trên vốn đầu tư (ROIC), đồng thời đối chiếu việc sử dụng chúng trong phân bổ vốn\nLOS","qhtml":null},{"n":25,"q":"A company has the following balance sheet (in SGD millions):\nCash 1,900\nMarketable securities 200\nAccounts receivable 2,500\nInventory 3,100\nProperty, plant & equipment 12,300\nTotal assets 20,000\nAccounts payable 2,600\nAccrued expenses 400\nShort-term debt 2,300\nLong-term debt 5,300\nShareholders' equity 9,400\nTotal liabilities and equity 20,000\nThe company's net working capital (in SGD millions) is closest to:","opts":["2,400","2,600","2,800"],"ans":"B","expl":"Ngoài việc đánh giá chu kỳ chuyển đổi tiền mặt của một công ty, các nhà phân tích còn đánh giá hiệu quả hoạt động của nó dựa trên vốn lưu động, lượng vốn sẵn có để hỗ trợ\nhoạt động hàng ngày của công ty . Vốn lưu động có thể được xác định và tính toán theo nhiều cách khác nhau, như\n:\nTổng vốn lưu động, là sự khác biệt giữa tài sản hiện tại và\nnợ ngắn hạn\nVốn lưu động ròng , không bao gồm tiền mặt và chứng khoán thị trường (tài sản)\ncũng như phần nợ ngắn hạn và hiện tại của nợ dài hạn (nợ)\nCác khái niệm này tương tự nhau, nhưng vốn lưu động ròng loại trừ các khoản mục không liên quan trực tiếp\nvới chu kỳ chuyển đổi tiền mặt. Các nhà phân tích thường đánh giá tổng vốn lưu động hoặc tổng vốn lưu động ròng\ntheo tỷ lệ phần trăm của doanh thu hàng năm, điều này cho phép họ so sánh các công ty có\nquy mô khác nhau.\nTrong trường hợp này, các số liệu được tính như sau:\nDo đó, tổng vốn lưu động của nhà phát hành là 2.400 triệu SGD (Lựa chọn A) . Vốn lưu động ròng\nlà 2.600 triệu SGD, khác với tổng vốn lưu động vì nó không bao gồm tiền mặt\n(1.900) và chứng khoán có thể bán được (200) khỏi tài sản lưu động và không bao gồm nợ ngắn hạn\n(2.300) khỏi nợ ngắn hạn. Lưu ý rằng, như trong kịch bản này, tổng vốn lưu động có thể\nthấp hơn vốn lưu động ròng.\n(Lựa chọn C) 2.800 (= 5.800 − 3.000) là kết quả của việc chỉ trừ tiền mặt (tức là không\ntrừ chứng khoán có thể bán được) khỏi tài sản hiện tại khi tính vốn lưu động ròng.\nNhững điều cần nhớ:\nVốn lưu động đo lường nguồn vốn sẵn có để hỗ trợ hoạt động hàng ngày của một công ty. Tổng\nvốn lưu động là chênh lệch giữa tài sản ngắn hạn và nợ ngắn hạn. Vốn lưu động ròng\nkhông bao gồm tiền mặt và chứng khoán có thể bán được (tài sản) cũng như phần ngắn hạn và ngắn hạn của\nnợ dài hạn (nợ) khỏi chênh lệch đó vì những khoản mục đó không liên quan trực tiếp đến\nchu kỳ chuyển đổi tiền mặt.\nGiải thích chu kỳ chuyển đổi tiền mặt và so sánh chu kỳ chuyển đổi tiền mặt của các nhà phát hành\nLOS","qhtml":null},{"n":26,"q":"Investors should not expect additional returns for taking on nonsystematic risk since this\nrisk most likely is:","opts":["minimized in a well-diversified portfolio.","the same for every asset in a given market.","already included in an asset's systematic risk."],"ans":"A","expl":"Rủi ro hệ thống và phi hệ thống\nRủi ro tổng cộng = Rủi ro hệ thống + Rủi ro phi hệ thống\nRủi ro hệ thống Rủi ro phi hệ thống\nCòn được gọi là rủi ro thị trường hoặc Còn được gọi là rủi ro phi thị trường\nrủi ro không thể đa dạng hóa hoặc rủi ro đặc thù của công ty\nVốn có trên thị trường Cụ thể đối với công ty hoặc ngành\nKhông thể bị loại bỏ bởi Có thể được loại bỏ bởi\nđa dạng hóa đa dạng hóa\nVí dụ: thay đổi lãi suất, Ví dụ: kiện tụng kinh doanh,\nthị trường chứng khoán gặp sự cố do các cuộc tấn công mạng\nRủi ro hệ thống (tức là rủi ro thị trường) là rủi ro cố hữu của hệ thống tài chính ảnh hưởng đến tất cả\nchứng khoán trên thị trường. Nó liên quan đến các yếu tố kinh tế vĩ mô (ví dụ: suy thoái, lãi suất\n) và không thể tránh khỏi. Rủi ro phi hệ thống (tức là rủi ro cụ thể của công ty) là tập hợp\nrủi ro cụ thể vốn có của một công ty hoặc ngành riêng lẻ .\nVì rủi ro hệ thống là không thể tránh khỏi, các nhà đầu tư hợp lý mong đợi được đền bù khi chấp nhận\nrủi ro này. Tuy nhiên, rủi ro phi hệ thống từ bất kỳ tài sản nào có thể được giảm thiểu trong danh mục đầu tư\nbằng cách thêm các tài sản đa dạng khác. Rủi ro phi hệ thống có thể được giảm thiểu xuống gần bằng 0 trong một danh mục đầu tư được đa dạng hóa tốt\n, vì vậy các nhà đầu tư không nên mong đợi lợi nhuận b
