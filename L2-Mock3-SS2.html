<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

ague, Jack Lockhart, makes a recommendation to Sawyer:<\/p><div class=\"tbl\"><table><tr><td>Recommendation:<\/td><td>My research indicates that the slope coefficients of your regression changed significantly after the passage of Regulation Fair Disclosure, which took place in the middle of your 3-year sample period. Your regression pools across two distinct sample periods. Therefore, I recommend correcting your current regression equation for model misspecification.<\/td><\/tr><\/table><\/div><p>In her conversation with Lockhart, Sawyer explains that she is concerned that her regression equation (1) may ignore other important determinants of performance for the Progressive Fund. Sawyer explains that she is aware that the omission of important independent variables affects the quality of the parameter estimates of the regression. She makes the following claims, assuming the omitted variables are correlated with the included variables:<\/p><div class=\"tbl\"><table><tr><td>Claim 1:<\/td><td>The parameter estimates of equation (1) are unbiased.<\/td><\/tr><tr><td>Claim 2:<\/td><td>The parameter estimates of equation (1) are inconsistent.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Of the slopes for the two independent variables, RM and VMG, determine which are statistically significant at the 0.05 level?<\/p><\/div>","subj":"quant"},{"n":46,"q":"Sawyer decides to test regression equation (1) for the existence of conditional heteroskedasticity. Sawyer is likely to conclude that her regression does not exhibit 2 conditional heteroskedasticity if the R from equation (2) is:","opts":["close to 0.","close to 1.","close to 0.80."],"ans":"A","expl":"Conditional heteroskedasticity refers to regression errors whose variance is not constant. If there is conditional heteroskedasticity, the variance changes as function of the independent variables. The squared residual (i.e., residual is the estimated 2 error) is used to proxy the error variance. A low R in equation (2) indicates that the slopes in equation (2) are very close to zero, indicating that the error variance is unaffected by the independent variables. For instance, if all the slopes in equation (2) equal zero, then the error variance equals the intercept (a0, which is constant over time). (Module 1.3, LOS 1.h)","explhtml":"<p>Conditional heteroskedasticity refers to regression errors whose variance is not constant. If there is conditional heteroskedasticity, the variance changes as function of the independent variables. The squared residual (i.e., residual is the estimated <sup>2<\/sup> error) is used to proxy the error variance. A low R in equation (2) indicates that the slopes in equation (2) are very close to zero, indicating that the error variance is unaffected by the independent variables. For instance, if all the slopes in equation (2) equal zero, then the error variance equals the intercept (a0, which is constant over time). (Module 1.3, LOS 1.h)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 45–48 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Research associate Kate Sawyer is responsible for identifying the determinants of performance for her firm&#x27;s Progressive Fund (PF). All tests performed at Sawyer&#x27;s firm are examined at the 0.05 level of significance. Sawyer examines the following regressions using monthly data observed for a 36-month period:<\/p><p>(1) RPF,t = b0 + b1RM,t + b2VMGt + ePF,t<\/p><img class=\"pimg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAlgCWAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wgARCABHAFADAREAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAQFBgMHAQL/xAAUAQEAAAAAAAAAAAAAAAAAAAAA/9oADAMBAAIQAxAAAAH1QA+H4OgAAMCTi+MwbAkgAGZJBaGQNyAAZQiFCbo4l0dgAeeHI5HoBNAABUGJOhu nts of performance for the Progressive Fund. Sawyer explains that she is aware that the omission of important independent variables affects the quality of the parameter estimates of the regression. She makes the following claims, assuming the omitted variables are correlated with the included variables:<\/p><div class=\"tbl\"><table><tr><td>Claim 1:<\/td><td>The parameter estimates of equation (1) are unbiased.<\/td><\/tr><tr><td>Claim 2:<\/td><td>The parameter estimates of equation (1) are inconsistent.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Sawyer decides to test regression equation (1) for the existence of conditional heteroskedasticity. Sawyer is likely to conclude that her regression does not exhibit <sup>2<\/sup> conditional heteroskedasticity if the R from equation (2) is:<\/p><\/div>","subj":"quant"},{"n":47,"q":"Regarding Lockhart's recommendation, the most likely form of model misspecification to which he refers is:","opts":["stationarity model misspecification.","time-series model misspecification.","functional form model misspecification."],"ans":"C","expl":"According to the recommendation, the data should not be pooled across all 36 months. The sample clearly is split into two parts: pre-Reg FD and post-Reg FD. Sawyer should run separate regressions for each subperiod, or should employ dummy variables to control for the structural shift related to the passage of Reg FD. In either case, by pooling across the two very different sample periods, Sawyer's regression is an example of a misspecified functional form. (Module 1.3, LOS 1.g)","explhtml":"<p>According to the recommendation, the data should not be pooled across all 36 months. The sample clearly is split into two parts: pre-Reg FD and post-Reg FD. Sawyer should run separate regressions for each subperiod, or should employ dummy variables to control for the structural shift related to the passage of Reg FD. In either case, by pooling across the two very different sample p dth:min(100%,57px)\" alt=\"\"><p>= the estimated squared regression errors derived from (1)<\/p><p>Exhibit 1: Equation (1) Regression Results<\/p><div class=\"tbl\"><table><tr><td>Variable<\/td><td>Coefficient<\/td><td>p-values<\/td><\/tr><tr><td>Constant<\/td><td>–0.005<\/td><td>0.030<\/td><\/tr><tr><td>RM<\/td><td>1.250<\/td><td>0.001<\/td><\/tr><tr><td>VMG<\/td><td>0.200<\/td><td>0.980<\/td><\/tr><\/table><\/div><p><sup>2<\/sup> The R from equation (1) equals 0.80. A colleague, Jack Lockhart, makes a recommendation to Sawyer:<\/p><div class=\"tbl\"><table><tr><td>Recommendation:<\/td><td>My research indicates that the slope coefficients of your regression changed significantly after the passage of Regulation Fair Disclosure, which took place in the middle of your 3-year sample period. Your regression pools across two distinct sample periods. Therefore, I recommend correcting your current regression equation for model misspecification.<\/td><\/tr><\/table><\/div><p>In her conversation with Lockhart, Sawyer explains that she is concerned that her regression equation (1) may ignore other important determinants of performance for the Progressive Fund. Sawyer explains that she is aware that the omission of important independent variables affects the quality of the parameter estimates of the regression. She makes the following claims, assuming the omitted variables are correlated with the included variables:<\/p><div class=\"tbl\"><table><tr><td>Claim 1:<\/td><td>The parameter estimates of equation (1) are unbiased.<\/td><\/tr><tr><td>Claim 2:<\/td><td>The parameter estimates of equation (1) are inconsistent.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding Lockhart&#x27;s recommendation, the most likely form of model misspecification to which he refers is:<\/p><\/div>","subj":"quant"},{"n":48,"q":"Regarding Claim 1 and Claim 2 made by Sawyer about the effects of omitted variables, which claims are correct?","opts":["Claim 1 only.","Claim 2 only.","Both Claim 1 and Claim 2."],"ans":"B","expl":"Sawyer is incorrect with respect to Claim 1 and is correct with respect to Claim 2. If the omitted variables are correlated with the included variables, then the omitted variable regression parameter estimates [i.e., from equation (1)] will be biased and inconsistent. Desirable properties, on the other hand, are unbiasedness and consistency. An estimator is unbiased if the expected value of the estimate equals the true population value. An estimator is consistent if the estimate approaches the true population value as the sample size increases. The existence of omitted variables (that are correlated with the included variables) destroys both of these desirable properties. (Module 1.3, LOS 1.g)","explhtml":"<p>Sawyer is incorrect with respect to Claim 1 and is correct with respect to Claim 2. If the omitted variables are correlated with the included variables, then the omitted variable regression parameter estimates [i.e., from equation (1)] will be biased and inconsistent. Desirable properties, on the other hand, are unbiasedness and consistency. An estimator is unbiased if the expected value of the estimate equals the true population value. An estimator is consistent if the estimate approaches the true population value as the sample size increases. The existence of omitted variables (that are correlated with the included variables) destroys both of these desirable properties. (Module 1.3, LOS 1.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 45–48 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Research associate Kate Sawyer is responsible for identifying the determinants of performance for her firm&#x27;s Progressive Fund (PF). All tests performed at Sawyer&#x27;s firm are examined at the 0.05 level of significance. Sawyer examines the following regressions using monthly data observed for a 36-mont he slope coefficients of your regression changed significantly after the passage of Regulation Fair Disclosure, which took place in the middle of your 3-year sample period. Your regression pools across two distinct sample periods. Therefore, I recommend correcting your current regression equation for model misspecification.<\/td><\/tr><\/table><\/div><p>In her conversation with Lockhart, Sawyer explains that she is concerned that her regression equation (1) may ignore other important determinants of performance for the Progressive Fund. Sawyer explains that she is aware that the omission of important independent variables affects the quality of the parameter estimates of the regression. She makes the following claims, assuming the omitted variables are correlated with the included variables:<\/p><div class=\"tbl\"><table><tr><td>Claim 1:<\/td><td>The parameter estimates of equation (1) are unbiased.<\/td><\/tr><tr><td>Claim 2:<\/td><td>The parameter estimates of equation (1) are inconsistent.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding Claim 1 and Claim 2 made by Sawyer about the effects of omitted variables, which claims are correct?<\/p><\/div>","subj":"quant"},{"n":49,"q":"Based on Renner's comments defending Voyager's acquisition of The Daily, indicate whether his comments about net income and elimination of inefficiencies are most likely correct.","opts":["Only Renner’s comment that unused tax losses will immediately translate into higher net income is correct.","Only Renner’s comment that the elimination of inefficiencies within the internet operations will create additional value is correct.","Both comments are correct."],"ans":"A","expl":"If the target of a merger has unused tax losses accumulated, the merged company can use the tax losses to immediately lower its tax liability, thus increasing its net income (Correct). The internet operation of The Daily is insignificant compared to the overall merger value. Any improvement in the cost structure of the internet operation will not have a significant impact on overall earnings. In addition, the high-growth characteristics of the internet segment would not warrant a cost restructuring of the operations (Incorrect).\n(Module 18.1, LOS 18.a)","explhtml":"<p>If the target of a merger has unused tax losses accumulated, the merged company can use the tax losses to immediately lower its tax liability, thus increasing its net income (Correct). The internet operation of The Daily is insignificant compared to the overall merger value. Any improvement in the cost structure of the internet operation will not have a significant impact on overall earnings. In addition, the high-growth characteristics of the internet segment would not warrant a cost restructuring of the operations (Incorrect).<\/p><p>(Module 18.1, LOS 18.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Corporate Issuers<\/summary><div class=\"vig-body\"><p>Michael Bennet is evaluating the recent announcements made by Voyaager and Gaarding, two of the stocks held in his portfolio. Voyager, Inc., a primarily internet-based media company, is buying The Daily, a media company with exposure to newspapers, television, and the internet.<\/p><p>Company Descriptions<\/p><p>Voyager, Inc., is organized into two segments: internet and newspaper publishing. The internet segment operates websites that offer news, entertainment, and advertising content in text and video format. The internet segment represents 75% of the company&#x27;s total revenues. The newspaper publishing segment publishes 10 daily newspapers. The newspaper publishing segment represents 25% of the company&#x27;s total revenues.<\/p><p>The Daily is organized into three segments: newspaper publishing (60% of revenues), broadcasting (37% of revenues), and internet (3% of revenues). The newspaper publishing segment publishes 101 daily newspapers. The broadcasting segment owns and operates 25 television stations. The internet segment consists of an internet advertising service. The Daily&#x27;s newspaper publishing and broadcasting segments cover the 20 largest markets in the United States.<\/p><div class=\"tbl\"><table><tr><td>(in millions)<\/td><td>Voyager, Inc. (before merger)<\/td><td>The Daily (before merger)<\/td><\/tr><tr><td>Revenues<\/td><td>$1,800<\/td><td>$600<\/td><\/tr><tr><td>EBITDA<\/td><td>$300<\/td><td>$62<\/td><\/tr><tr><td>Debt<\/td><td>$200<\/td><td>$50<\/td><\/tr><tr><td>Number of shares<\/td><td>11<\/td><td>2<\/td><\/tr><tr><td>Stock price per share<\/td><td>$68<\/td><td>$35<\/td><\/tr><\/table><\/div><p>The acquistion terms call for an exchange of all outstanding shares of Daily for 1 million newly issued shares of Voyager. Michael Renner, the CFO of Voyager, defended the acquisition by stating that The Daily has accumulated a large amount of tax losses and that the combined company can benefit by immediately increasing net income after the merger. In addition, Renner states that the new Voyager will eliminate the inefficiencies of its internet operations and thereby boost future earnings.<\/p><p>Bennet is curious about the recent spate of acquisitions in the industry.<\/p><p>Gaarding operates in the industrial fittings business and has made an agreement with a private equity company to sell its factory. Under the terms of the agreement, the factory will be leased back for a period of 15 years. The proceeds from the sale will be used to retire the firm&#x27;s secured debentures.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Renner&#x27;s comments defending Voyager&#x27;s acquisition of The Daily, indicate whether his comments about net income and elimination of inefficiencies are most likely correct.<\/p><\/div>","subj":"corporate"},{"n":50,"q":"For this question only, assume that there is no change in Voyager's stock price and there are no synergies as a result of the acquistion. As compared to its pre-acquisition value, Voyager's post acquistion EV/EBITDA ratio is most likely to be:","opts":["higher.","lower.","remain the same."],"ans":"B","expl":"Voyager's pre-acquistion EV = value of equity + value of debt = (11 × 68) + 200 = 948 Voyager's pre-acquistion EV/EBITDA ratio = 948 / 300 = 3.16 Voyager's post-acquisition EV = (12 × 68) + (200 + 50) = 1,066 Voyager's post-acquisition EV/EBITDA = 1066 / (300 + 62) = 2.94 (Module 18.1, LOS 18.a)","explhtml":"<p>Voyager&#x27;s pre-acquistion EV = value of equity + value of debt = (11 × 68) + 200 = 948 Voyager&#x27;s pre-acquistion EV/EBITDA ratio = 948 / 300 = 3.16 Voyager&#x27;s post-acquisition EV = (12 × 68) + (200 + 50) = 1,066 Voyager&#x27;s post-acquisition EV/EBITDA = 1066 / (300 + 62) = 2.94 (Module 18.1, LOS 18.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Michael Bennet is evaluating the recent announcements made by Voyaager and Gaarding, two of the stocks held in his portfolio. Voyager, Inc., a primarily internet-based media company, is buying The Daily, a media company with exposure to newspapers, television, and the internet.<\/p><p>Company Descriptions<\/p><p>Voyager, Inc., is organized into two segments: internet and newspaper publishing. The internet segment operates websites that offer news, entertainment, and advertising content in text and video format. The internet segment represents 75% of the company&#x27;s total revenues. The newspaper publishing segment publishes 10 daily newspapers. The newspaper publishing segment represents 25% of the company&#x27;s total revenues.<\/p><p>The Daily is organized into three segments: newspaper publishing (60% of revenues), broadcasting (37% of revenues), and internet (3% of revenues). The newspaper publishing segment publishes 101 daily newspapers. The broadcasting segment owns and operates 25 television stations. The internet segment consists of an internet advertising service. The Daily&#x27;s newspaper publishing and broadcasting segments cover the 20 largest markets in the United States.<\/p><div class=\"tbl\"><table><tr><td>(in millions)<\/td><td>Voyager, Inc. (before merger)<\/td><td>The Daily (before merger)<\/td><\/tr><tr><td>Revenues<\/td><td>$1,800<\/td><td>$600<\/td><\/tr><tr><td>EBITDA<\/td><td>$300<\/td><td>$62<\/td><\/tr><tr><td>Debt<\/td><td>$200<\/td><td>$50<\/td><\/tr><tr><td>Number of shares<\/td><td>11<\/td><td>2<\/td><\/tr><tr><td>Stock price per share<\/td><td>$68<\/td><td>$35<\/td><\/tr><\/table><\/div><p>The acquistion terms call for an exchange of all outstanding shares of Daily for 1 million newly issued shares of Voyager. Michael Renner, the CFO of Voyager, defended the acquisition by stating that The Daily has accumulated a large amount of tax losses and that the combined company can benefit by immediately increasing net income after the merger. In addition, Renner states that the new Voyager will eliminate the inefficiencies of its internet operations and thereby boost future earnings.<\/p><p>Bennet is curious about the recent spate of acquisitions in the industry.<\/p><p>Gaarding operates in the industrial fittings business and has made an agreement with a private equity company to sell its factory. Under the terms of the agreement, the factory will be leased back for a period of 15 years. The proceeds from the sale will be used to retire the firm&#x27;s secured debentures.<\/p><\/div><\/details><div class=\"qtext\"><p>For this question only, assume that there is no change in Voyager&#x27;s stock price and there are no synergies as a result of the acquistion. As compared to its pre-acquisition value, Voyager&#x27;s post acquistion EV/EBITDA ratio is most likely to be:<\/p><\/div>","subj":"corporate"},{"n":51,"q":"Which of the following reasons is least likely to support Bennet's observation about increased acquisition activity
