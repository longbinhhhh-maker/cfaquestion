, Inc.&#x27;s controller at the event. Frapco is a national grocery chain. Savin informed Dutt that the new layout in the stores has been a hit, and that he expects revenues and earnings for the current quarter to be well above consensus forecast.<\/p><p>The next day, Dutt placed a large order for Sandhirst stock for her fund. Dutt also placed a large order for a retail ETF. Dutt is a member of an online forum where she discusses investments under a pseudonym. Dutt has formed a very loyal following over time as others realized that her posts were very articulate and, therefore, the work of a professional. Dutt recommended Frapco stock in the forum but attributed the recommendation to a general uptick in grocery store margins nationwide—a known fact based on recent earnings announcements of other grocers. The following week at a charity golf tournament, Vakil met with Bob Snead, his college roommate. Snead was a very successful hedge fund manager. Both of the funds run by Smead were currently closed to new investment, though Snead was considering reopening the investments in the near future. At Vakil&#x27;s insistence, Snead agreed to allow new investments into the two funds using a newly started intermediary fund as long as Vakil is the fund&#x27;s manager. Vakil quickly convinced his bosses at Patarsby to open an intermediary fund and marketed the fund to existing Patarsby clients as a way into Snead hedge funds. Not knowing how long the deal with Snead would hold up, and wanting to quickly ramp up assets under management, Vakil accepted deposits from all Patarsby clients, even some that were relatively new accounts.<\/p><\/div><\/details><div class=\"qtext\"><p>With regards to investments in Sandhirst stock and retail ETF, Dutt most likely violated:<\/p><\/div>","subj":"ethics"},{"n":83,"q":"Dutt's recommendation of Frapco stock in the online forum is most likely:","opts":["a violation of Standard II(A) − Material and Nonpublic Information even though she attributed the recommendation to publicly available information.","not a violation under Standard II(A) − Material and Nonpublic Information.","violation of Standard III(E) − Preservation of Confidentiality."],"ans":"A","expl":"Trading for oneself or causing others to trade based on material nonpublic information is a violation under Standard II(A) − Material and Nonpublic Information. (Module 42.3, LOS 42.a)(Module 42.3, LOS 42.b)","explhtml":"<p>Trading for oneself or causing others to trade based on material nonpublic information is a violation under Standard II(A) − Material and Nonpublic Information. (Module 42.3, LOS 42.a)(Module 42.3, LOS 42.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 81–84 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Paul Vakil, CFA, joined the equity research department of Patarsby and Singly, a brokerage firm. Vakil, with the help of a quant specialist at Patarsby, developed advanced forecasting models based on machine learning algorithms and started using them in his new role. Things turned out very well for Vakil at Patarsby, and clients waited eagerly for release of his monthly recommendations. During a society event, Vakil ran into Alia Dutt, CFA, one of the fund managers who had worked with Vakil at a prior job. Dutt congratulated Vakil. Later in the evening, Vakil spoke to Dutt about one of the companies he is following—Sandhirst, Inc. Vakil stated that his preliminary research indicates that the short-term outlook for Sandhirst is very promising. Dutt also met Neil Savin, Frapco, Inc.&#x27;s controller at the event. Frapco is a national grocery chain. Savin informed Dutt that the new layout in the stores has been a hit, and that he expects revenues and earnings for the current quarter to be well above consensus forecast.<\/p><p>The next day, Dutt placed a large order for Sandhirst stock for her fund. Dutt also placed a large order for a retail ETF. Dutt is a member of an online forum where she discusses investments under a pseudonym. Dutt has formed a very loyal following over time as others realized that her posts were very articulate and, therefore, the work of a professional. Dutt recommended Frapco stock in the forum but attributed the recommendation to a general uptick in grocery store margins nationwide—a known fact based on recent earnings announcements of other grocers. The following week at a charity golf tournament, Vakil met with Bob Snead, his college roommate. Snead was a very successful hedge fund manager. Both of the funds run by Smead were currently closed to new investment, though Snead was considering reopening the investments in the near future. At Vakil&#x27;s insistence, Snead agreed to allow new investments into the two funds using a newly started intermediary fund as long as Vakil is the fund&#x27;s manager. Vakil quickly convinced his bosses at Patarsby to open an intermediary fund and marketed the fund to existing Patarsby clients as a way into Snead hedge funds. Not knowing how long the deal with Snead would hold up, and wanting to quickly ramp up assets under management, Vakil accepted deposits from all Patarsby clients, even some that were relatively new accounts.<\/p><\/div><\/details><div class=\"qtext\"><p>Dutt&#x27;s recommendation of Frapco stock in the online forum is most likely:<\/p><\/div>","subj":"ethics"},{"n":84,"q":"Vakil's conduct regarding the intermediary fund to channel investments into Snead funds is most likely a violation under:","opts":["Standard II(B) − Integrity of Capital Markets: Market Manipulation.","Standard III(D) − Duties to Clients: Suitability.","Standard III(D) − Duties to Clients: Fair Dealing."],"ans":"B","expl":"Because the Snead hedge funds may not be suitable for all clients, Vakil violated Standard III(D) − Duties to Clients: Suitability. No clients were treated unfairly and there was no market manipulation. (Module 42.3, LOS 42.b)(Module 42.3, LOS 42.a)","explhtml":"<p>Because the Snead hedge funds may not be suitable for all clients, Vakil violated Standard III(D) − Duties to Clients: Suitability. No clients were treated unfairly and there was no market manipulation. (Module 42.3, LOS 42.b)(Module 42.3, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 81–84 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Paul Vakil, CFA, joined the equity research department of Patarsby and Singly, a brokerage firm. Vakil, with the help of a quant specialist at Patarsby, developed advanced forecasting models based on machine learning algorithms and started using them in his new role. Things turned out very well for Vakil at Patarsby, and clients waited eagerly for release of his monthly recommendations. During a society event, Vakil ran into Alia Dutt, CFA, one of the fund managers who had worked with Vakil at a prior job. Dutt congratulated Vakil. Later in the evening, Vakil spoke to Dutt about one of the companies he is following—Sandhirst, Inc. Vakil stated that his preliminary research indicates that the short-term outlook for Sandhirst is very promising. Dutt also met Neil Savin, Frapco, Inc.&#x27;s controller at the event. Frapco is a national grocery chain. Savin informed Dutt that the new layout in the stores has been a hit, and that he expects revenues and earnings for the current quarter to be well above consensus forecast.<\/p><p>The next day, Dutt placed a large order for Sandhirst stock for her fund. Dutt also placed a large order for a retail ETF. Dutt is a member of an online forum where she discusses investments under a pseudonym. Dutt has formed a very loyal following over time as others realized that her posts were very articulate and, therefore, the work of a professional. Dutt recommended Frapco stock in the forum but attributed the recommendation to a general uptick in grocery store margins nationwide—a known fact based on recent earnings announcements of other grocers. The following week at a charity golf tournament, Vakil met with Bob Snead, his college roommate. Snead was a very successful hedge fund manager. Both of the funds run by Smead were currently closed to new investment, though Snead was considering reopening the investments in the near future. At Vakil&#x27;s insistence, Snead agreed to allow new investments into the two funds using a newly started intermediary fund as long as Vakil is the fund&#x27;s manager. Vakil quickly convinced his bosses at Patarsby to open an intermediary fund and marketed the fund to existing Patarsby clients as a way into Snead hedge funds. Not knowing how long the deal with Snead would hold up, and wanting to quickly ramp up assets under management, Vakil accepted deposits from all Patarsby clients, even some that were relatively new accounts.<\/p><\/div><\/details><div class=\"qtext\"><p>Vakil&#x27;s conduct regarding the intermediary fund to channel investments into Snead funds is most likely a violation under:<\/p><\/div>","subj":"ethics"},{"n":85,"q":"Regarding her reference to Xeta fund's performance in her employment applications, Duff is most likely to have violated the CFA Institute Standard of Professional Conduct related to:","opts":["Standard III(D) − Performance Presentation.","Standard IV(A) − Duties to Employer: Loyalty.","Standard III(D) − Performance Presentation as well as Standard IV(A) − Duties to Employer: Loyalty."],"ans":"A","expl":"Duff obtained permission from Blue Lotus to use the past performance and, therefore, is not violating Standard IV(A) − Duties to Employer: Loyalty. However, by not crediting the entire team in the management of Xeta fund, Duff violated Standard III(D) − Performance Presentation. (Module 42.6, LOS 42.a)(Module 42.6, LOS 42.b)","explhtml":"<p>Duff obtained permission from Blue Lotus to use the past performance and, therefore, is not violating Standard IV(A) − Duties to Employer: Loyalty. However, by not crediting the entire team in the management of Xeta fund, Duff violated Standard III(D) − Performance Presentation. (Module 42.6, LOS 42.a)(Module 42.6, LOS 42.b)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 85–88 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Mikale Natschavin, CFA, is the managing director of Blue Lotus LP, a boutique investment bank specializing in M&amp;A consulting in the professional services arena. Blue Lotus also manages a fund (Xeta fund) for several institutional clients. The fund was run by a team of four managers. During the recent economic downturn, commensurate with the decline in the size of the fund, Blue Lotus downsized the staff.<\/p><p>Sandra Duff, CFA, one of the managers of Xeta, was laid off by Blue Lotus. During her exit interview Natschavin wished Duff well and, on behalf of the firm, gave her permission to use Xeta fund&#x27;s past performance when seeking new employment opportunities. Duff did not mention to Natschavin or the personnel manager that she was still in possession of a company-issued laptop. On that laptop&#x27;s hard disk, Duff had stored several models the team had developed to pursue investment strategies. In later job applications to potential employers, Duff included the performance of the fund to demonstrate her success, but did not give any indication of a team approach.<\/p><p>After several weeks of interviews, Duff accepts employment in the currency trading department of Sario, a large hedge fund. Duff begins to use some of the models from her Blue Lotus laptop at her new job. Duff&#x27;s supervisor at Sario, Steve Howlett, CFA, regularly reviews employees&#x27; personal trading to detect violations of Sario&#x27;s written policies regarding trading in personal accounts. Howlett finds two instances where he believes Duff has engaged in front-running of Sario&#x27;s clients.<\/p><p>One of the currency trading strategies employed by Sario is based on interest rate parity. Sario traders monitor spot exchange rates, forward rates, and short-term government interest rates. On the rare occasions when the forward rates do not accurately reflect the interest differential between two countries, Sario employees place trades to take advantage of the riskless arbitrage opportunity.<\/p><p>Because Sario is such a large player in the currency exchange markets, its transactions costs are very low, and Sario is often able to take advantage of mispricings that are too small for other firms to capitalize on. In describing these trading opportunities to clients, Sario staff suggest that &quot;Clients willing to participate in this type of arbitrage strategy are guaranteed riskless profits until the market pricing returns to equilibrium.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding her reference to Xeta fund&#x27;s performance in her employment applications, Duff is most likely to have violated the CFA Institute Standard of Professional Conduct related to:<\/p><\/div>","subj":"ethics"},{"n":86,"q":"Duff's use of the Blue Lotus models at Sario is least likely to be a violation of:","opts":["Standard I(C) − Professionalism: Misrepresentation.","Standard II(A) − Integrity of Capital Markets: Material Nonpublic Information.","Standard IV(A) − Duties to Employer: Loyalty."],"ans":"B","expl":"By taking Blue Lotus's models without permission from her past employer, Duff violated Standard IV(A) − Duties to Employer: Loyalty. Duff also failed to disclose using her past employer's model, violating Standard I(C) − Professionalism: Misrepresentation. The models are proprietary, but unlikely to constitute material nonpublic information. (Module 42.7, LOS 42.a)(Module 42.7, LOS 42.b)","explhtml":"<p>By taking Blue Lotus&#x27;s models without permission from her past employer, Duff violate s regarding trading in personal accounts. Howlett finds two instances where he believes Duff has engaged in front-running of Sario&#x27;s clients.<\/p><p>One of the currency trading strategies employed by Sario is based on interest rate parity. Sario traders monitor spot exchange rates, forward rates, and short-term government interest rates. On the rare occasions when the forward rates do not accurately reflect the interest differential between two countries, Sario employees place trades to take advantage of the riskless arbitrage opportunity.<\/p><p>Because Sario is such a large player in the currency exchange markets, its transactions costs are very low, and Sario is often able to take advantage of mispricings that are too small for other firms to capitalize on. In describing these trading opportunities to clients, Sario staff suggest that &quot;Clients willing to participate in this type of arbitrage strategy are guaranteed riskless profits until the market pricing returns to equilibrium.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Duff&#x27;s use of the Blue Lotus models at Sario is least likely to be a violation of:<\/p><\/div>","subj":"ethics"},{"n":87,"q":"Based on the information given, and according to CFA Institute Standards, which of the following statements best describes Sario's compliance procedures relating to personal trading in foreign currencies? The compliance procedures:","opts":["appear adequate because Howlett was successful in identifying potential violations.","appear adequate, but Howlett’s monitoring of Duff’s trades indicates poor supervisory responsibility.","should include both duplicate confirmations of transactions and preclearance procedures for personal trades."],"ans":"C","expl":"Standard VI(B). The main problem in this situation is that there is no system to identify potential front-running violations before they occur. Standard VI(B) – Conflicts of Interest: Priority of Transactions recommends both preclearance of trades ario, Steve Howlett, CFA, regularly reviews employees&#x27; personal trading to detect violations of Sario&#x27;s written policies regarding trading in personal accounts. Howlett finds two instances where he believes Duff has engaged in front-running of Sario&#x27;s clients.<\/p><p>One of the currency trading strategies employed by Sario is based on interest rate parity. Sario traders monitor spot exchange rates, forward rates, and short-term government interest rates. On the rare occasions when the forward rates do not accurately reflect the interest differential between two countries, Sario employees place trades to take advantage of the riskless arbitrage opportunity.<\/p><p>Because Sario is such a large player in the currency exchange markets, its transactions costs are very low, and Sario is often able to take advantage of mispricings that are too small for other firms to capitalize on. In describing these trading opportunities to clients, Sario staff suggest that &quot;Clients willing to participate in this type of arbitrage strategy are guaranteed riskless profits until the market pricing returns to equilibrium.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the information given, and according to CFA Institute Standards, which of the following statements best describes Sario&#x27;s compliance procedures relating to personal trading in foreign currencies? The compliance procedures:<\/p><\/div>","subj":"ethics"},{"n":88,"q":"Regarding Sario's arbitrage trading strategies, has Sario's staff violated CFA Institute Standards of Professional Conduct with respect to the firm's trading strategy or the guarantee of results?","opts":["The trading strategy and guarantee of results are both violations of CFA Institute Standards.","The trading strategy is legitimate and does not violate CFA Institute Standards, but the guarantee of investment return is a violation of Standards.","Both the trading strategy and the guarantee statement comply with CFA Institute Standards."],"ans":"C","expl":"Standards II(B) and V(B). The strategy based on interest rate parity will provide riskless profits, until the prices move into equilibrium and the forward rates accurately reflect the interest rate differentials. Sario's guarantee is therefore accurate. The low transaction costs available to Sario are a competitive advantage that can be exploited without violating Standard II(B). (Module 42.3, LOS 42.a)","explhtml":"<p>Standards II(B) and V(B). The strategy based on interest rate parity will provide riskless profits, until the prices move into equilibrium and the forward rates accurately reflect the interest rate differentials. Sario&#x27;s guarantee is therefore accurate. The low transaction costs available to Sario are a competitive advantage that can be exploited without violating Standard II(B). (Module 42.3, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 85–88 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mikale Natschavin, CFA, is the managing director of Blue Lotus LP, a boutique investment bank specializing in M&amp;A consulting in the professional services arena. Blue Lotus also manages a fund (Xeta fund) for several institutional clients. The fund was run by a team of four managers. During the recent economic downturn, commensurate with the decline in the size of the fund, Blue Lotus downsized the staff.<\/p><p>Sandra Duff, CFA, one of the managers of Xeta, was laid off by Blue Lotus. During her exit interview Natschavin wished Duff well and, on behalf of the firm, gave her permission to use Xeta fund&#x27;s past performance when seeking new employment opportunities. Duff did not mention to Natschavin or the personnel manager that she was still in possession of a company-issued laptop. On that laptop&#x27;s hard disk, Duff had stored several models the team had developed to pursue investment strategies. In later job applications to potential employers, Duff included the performance of the fund to demonstrate her success, but did not give any indication of a team approach.<\/p><p>After several weeks of interviews, Duff accepts employment in the currency trading department of Sario, a large hedge fund. Duff begins to use some of the models from her Blue Lotus laptop at her new job. Duff&#x27;s supervisor at Sario, Steve Howlett, CFA, regularly reviews employees&#x27; personal trading to detect violations of Sario&#x27;s written policies regarding trading in personal accounts. Howlett finds two instances where he believes Duff has engaged in front-running of Sario&#x27;s clients.<\/p><p>One of the currency trading strategies employed by Sario is based on interest rate parity. Sario traders monitor spot exchange rates, forward rates, and short-term government interest rates. On the rare occasions when the forward rates do not accurately reflect the interest differential between two countries, Sario employees place trades to take advantage of the riskless arbitrage opportunity.<\/p><p>Because Sario is such a large player in the currency exchange markets, its transactions costs are very low, and Sario is often able to take advantage of mispricings that are too small for other firms to capitalize on. In describing these trading opportunities to clients, Sario staff suggest that &quot;Clients willing to participate in this type of arbitrage strategy are guaranteed riskless profits until the market pricing returns to equilibrium.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Sario&#x27;s arbitrage trading strategies, has Sario&#x27;s staff violated CFA Institute Standards of Professional Conduct with respect to the firm&#x27;s trading strategy or the guarantee of results?<\/p><\/div>","subj":"ethics"}];
const CFG = {"title": "Schweser Mock 3 (2025) — Session 2", "subtitle": "CFA Level II · 44 câu · 2h12p", "minutes": 132, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");

function togglePause(){

  paused = !paused;

    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");

function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");

    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";

const CFA_SESSION_SUBJECT_RANGES = {
  1:{ethics:[27,27],quant:[11,17],economics:[11,17],fsa:[20,25],corporate:[10,16]},
  2:{equity:[20,25],fixed:[20,25],derivatives:[9,14],alternatives:[11,16],portfolio:[14,22]}
};
const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,
  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,
  fsa:/financial statement|financial reporting|accounting|income statement|balance sheet|cash flow|revenue|expense|inventory|cost of sales|gross profit|gross margin|shareholders?['’]? equity|earnings per share|\beps\b|audit|gaap|ifrs|taxable income|deferred tax|temporary difference|intangible|long-lived|revaluation|impairment|amortization|depreciation|pension|financial ratio|receivables turnover|payables turnover|cash conversion|fixed charge coverage|normalized earnings|management['’]?s commentary/g,

  fixed:/fixed-income|fixed income|bond|debt|credit rating|credit spread|yield|spot rate|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|repo|covenant|accrued interest|priority of claims|default|extension risk|interest coverage/g,
  derivatives:/derivative|forward|future|swap|option|call buyer|call seller|put buyer|put seller|strike price|premium|put-call|binomial|contingent claim|moneyness|expiration|arbitrage|replication/g,
  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,
  portfolio:/portfolio|asset allocation|investment policy|\bips\b|behavioral|cognitive error|risk aversion|utility|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation|covariance|sharpe|treynor|jensen|information ratio|two-fund|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral/g
};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
