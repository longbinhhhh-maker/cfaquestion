><td>The Daily (before merger)<\/td><\/tr><tr><td>Revenues<\/td><td>$1,800<\/td><td>$600<\/td><\/tr><tr><td>EBITDA<\/td><td>$300<\/td><td>$62<\/td><\/tr><tr><td>Debt<\/td><td>$200<\/td><td>$50<\/td><\/tr><tr><td>Number of shares<\/td><td>11<\/td><td>2<\/td><\/tr><tr><td>Stock price per share<\/td><td>$68<\/td><td>$35<\/td><\/tr><\/table><\/div><p>The acquistion terms call for an exchange of all outstanding shares of Daily for 1 million newly issued shares of Voyager. Michael Renner, the CFO of Voyager, defended the acquisition by stating that The Daily has accumulated a large amount of tax losses and that the combined company can benefit by immediately increasing net income after the merger. In addition, Renner states that the new Voyager will eliminate the inefficiencies of its internet operations and thereby boost future earnings.<\/p><p>Bennet is curious about the recent spate of acquisitions in the industry.<\/p><p>Gaarding operates in the industrial fittings business and has made an agreement with a private equity company to sell its factory. Under the terms of the agreement, the factory will be leased back for a period of 15 years. The proceeds from the sale will be used to retire the firm&#x27;s secured debentures.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following reasons is least likely to support Bennet&#x27;s observation about increased acquisition activity in the industry?<\/p><\/div>","subj":"corporate"},{"n":52,"q":"Gaarding's announcement is most likely a:","opts":["balance sheet restructuring.","cost restructuring.","divestment."],"ans":"A","expl":"Gaarding's sale-and-leaseback transaction is an example of a balance sheet restructuring.\n(Module 18.1, LOS 18.a)","explhtml":"<p>Gaarding&#x27;s sale-and-leaseback transaction is an example of a balance sheet restructuring.<\/p><p>(Module 18.1, LOS 18.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Michael Bennet is evaluating the recent announcements made by Voyaager and Gaarding, two of the stocks held in his portfolio. Voyager, Inc., a primarily internet-based media company, is buying The Daily, a media company with exposure to newspapers, television, and the internet.<\/p><p>Company Descriptions<\/p><p>Voyager, Inc., is organized into two segments: internet and newspaper publishing. The internet segment operates websites that offer news, entertainment, and advertising content in text and video format. The internet segment represents 75% of the company&#x27;s total revenues. The newspaper publishing segment publishes 10 daily newspapers. The newspaper publishing segment represents 25% of the company&#x27;s total revenues.<\/p><p>The Daily is organized into three segments: newspaper publishing (60% of revenues), broadcasting (37% of revenues), and internet (3% of revenues). The newspaper publishing segment publishes 101 daily newspapers. The broadcasting segment owns and operates 25 television stations. The internet segment consists of an internet advertising service. The Daily&#x27;s newspaper publishing and broadcasting segments cover the 20 largest markets in the United States.<\/p><div class=\"tbl\"><table><tr><td>(in millions)<\/td><td>Voyager, Inc. (before merger)<\/td><td>The Daily (before merger)<\/td><\/tr><tr><td>Revenues<\/td><td>$1,800<\/td><td>$600<\/td><\/tr><tr><td>EBITDA<\/td><td>$300<\/td><td>$62<\/td><\/tr><tr><td>Debt<\/td><td>$200<\/td><td>$50<\/td><\/tr><tr><td>Number of shares<\/td><td>11<\/td><td>2<\/td><\/tr><tr><td>Stock price per share<\/td><td>$68<\/td><td>$35<\/td><\/tr><\/table><\/div><p>The acquistion terms call for an exchange of all outstanding shares of Daily for 1 million newly issued shares of Voyager. Michael Renner, the CFO of Voyager, defended the acquisition by stating that The Daily has accumulated a large amount of tax losses and that the combined company can benefit by immediately increasing net income after the merger. In addition, Renner states that the new Voyager will eliminate the inefficiencies of its internet operations and thereby boost future earnings.<\/p><p>Bennet is curious about the recent spate of acquisitions in the industry.<\/p><p>Gaarding operates in the industrial fittings business and has made an agreement with a private equity company to sell its factory. Under the terms of the agreement, the factory will be leased back for a period of 15 years. The proceeds from the sale will be used to retire the firm&#x27;s secured debentures.<\/p><\/div><\/details><div class=\"qtext\"><p>Gaarding&#x27;s announcement is most likely a:<\/p><\/div>","subj":"corporate"},{"n":53,"q":"Calculate the percent change in YTC net income shown on the WMC financial statements from 2015 to 2016.","opts":["–52.0%.","–55.2%.","–56.9%."],"ans":"C","expl":"Because YTC operates independently and makes its own financing decisions, the local currency (AUD) should be the functional currency. When the local currency is the functional currency, the subsidiary's financial statements are consolidated with the parent's financial statements using the current rate method. Under the current rate method, all of the income statement items are translated using the average rate for the year. To calculate the percent change in net income, we must translate these items for 2016 and 2015 and then calculate the rate of change.\n2015 translated net income = 25 / 1.30 = 19.23\n2016 translated net income = 12 / 1.45 = 8.28\ngrowth in net income = (8.28 / 19.23) − 1 = –56.94%\n(Module 10.4, LOS 10.d)","explhtml":"<p>Because YTC operates independently and makes its own financing decisions, the local currency (AUD) should be the functional currency. When the local currency is the functional currency, the subsidiary&#x27;s financial statements are consolidated with the parent&#x27;s financial statements using the current rate method. Under the current rate method, all of the income statement items are translated using the average rate for the year. To calculate the percent change in net income, we must translate these items for 2016 and 2015 and then calculate the rate of change.<\/p><p>2015 translated net income = 25 / 1.30 = 19.23<\/p><p>2016 translated net income = 12 / 1.45 = 8.28<\/p><p>growth in net income = (8.28 / 19.23) − 1 = –56.94%<\/p><p>(Module 10.4, LOS 10.d)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 53–56 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Gary Smith, CFA, has been hired to analyze a specialty tool and machinery manufacturer, Whitmore Corporation (WMC). WMC is a leading producer of specialty machinery in the United States. At the end of 2014, WMC purchased York Tool Company (YTC), an Australian firm in a similar line of business. YTC has partially integrated its marketing functions within WMC but still maintains control of its operations and secures its own financing. Following is a summary of the income statement and balance sheet for YTC (in millions of Australian dollars – AUD) for the past three years as well as exchange rate data over the same period.<\/p><div class=\"tbl\"><table><tr><td>Income Statement (AUD millions)<\/td><td>2014<\/td><td>2015<\/td><td>2016<\/td><\/tr><tr><td>Revenues<\/td><td>765<\/td><td>820<\/td><td>870<\/td><\/tr><tr><td>COGS<\/td><td>484<\/td><td>520<\/td><td>580<\/td><\/tr><tr><td>SG&amp;A<\/td><td>171<\/td><td>183<\/td><td>200<\/td><\/tr><tr><td>Depreciation expense<\/td><td>50<\/td><td>50<\/td><td>50<\/td><\/tr><tr><td>Interest expense<\/td><td>18<\/td><td>17<\/td><td>16<\/td><\/tr><tr><td>Income before tax<\/td><td>42<\/td><td>50<\/td><td>24<\/td><\/tr><tr><td>Taxes<\/td><td>21<\/td><td>25<\/td><td>12<\/td><\/tr><tr><td>Net income<\/td><td>21<\/td><td>25<\/td><td>12<\/td><\/tr><\/table><\/div><p>Balance Sheet (AUD millions)<\/p><div class=\"tbl\"><table><tr><td>2014<\/td><td>2015<\/td><td>2016<\/td><td>2014<\/td><td>2015<\/td><td>2016<\/td><td><\/td><td><\/td><\/tr><tr><td>Cash<\/td><td>22<\/td><td>25<\/td><td>20<\/td><td>Current liabilities<\/td><td>616<\/td><td>593<\/td><td>584<\/td><\/tr><tr><td>Accounts receivable<\/td><td>400<\/td><td>422<\/td><td>460<\/td><td>Long-term debt<\/td><td>180<\/td><td>170<\/td><td>160<\/td><\/tr><tr><td>Inventories<\/td><td>20<\/td><td>25<\/td><td>30<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Prepaid expenses<\/td><td>8<\/td><td>20<\/td><td>25<\/td><td>Common stock<\/td><td>50<\/td><td>50<\/td><td>50<\/td><\/tr><tr><td>Net fixed assets<\/td><td>500<\/td><td>450<\/td><td>400<\/td><td>Retained earnings<\/td><td>104<\/td><td>129<\/td><td>141<\/td><\/tr><tr><td>Total assets<\/td><td>950<\/td><td>942<\/td><td>935<\/td><td>Total liabilities &amp; equity<\/td><td>950<\/td><td>942<\/td><td>935<\/td><\/tr><tr><td>Exchange rates (AUD / USD)<\/td><td>2014<\/td><td>2015<\/td><td>2016<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Average exchange rate<\/td><td>1.40<\/td><td>1.30<\/td><td>1.45<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Year-end exchange rate<\/td><td>1.20<\/td><td>1.40<\/td><td>1.50<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Historical exchange rate<\/td><td>1.20<\/td><td>1.20<\/td><td>1.20<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Calculate the percent change in YTC net income shown on the WMC financial statements from 2015 to 2016.<\/p><\/div>","subj":"fsa"},{"n":54,"q":"If WMC uses the temporal method, YTC's net monetary liabilities leave WMC exposed to loss in the event of:","opts":["currency (AUD) depreciation.","currency (AUD) appreciation.","either currency depreciation or currency appreciation."],"ans":"B","expl":"Under the temporal method, the nonmonetary assets and liabilities are remeasured at historical rates. Thus, only the monetary assets and liabilities are exposed to changing exchange rates. Therefore, under the temporal method, exposure is defined as the subsidiary's net monetary asset or net monetary liability position. A firm has net monetary assets if its monetary assets exceed its monetary liabilities. If the monetary liabilities exceed the monetary assets, the firm has a net monetary liability exposure.\nSince very few assets are considered to be monetary (mainly cash and receivables), most firms have net monetary liability exposures. If the parent has a net monetary liability exposure when the foreign currency (AUD) is appreciating, the result is a loss. Conversely, a net monetary liability exposure coupled with a depreciating currency will result in a gain. (Module 10.3, LOS 10.d)","explhtml":"<p>Under the temporal method, the nonmonetary assets and liabilities are remeasured at historical rates. Thus, only the monetary assets and liabilities are exposed to changing exchange rates. Therefore, under the temporal method, exposure is defined as the subsidiary&#x27;s net monetary asset or net monetary liability position. A firm has net monetary assets if its monetary assets exceed its monetary liabilities. If the monetary liabilities exceed the monetary assets, the firm has a net monetary liability exposure.<\/p><p>Since very few assets are considered to be monetary (mainly cash and receivables), most firms have net monetary liability exposures. If the parent has a net monetary liability exposure when the foreign currency (AUD) is appreciating, the result is a loss. Conversely, a net monetary liability exposure coupled with a depreciating currency will result in a gain. (Module 10.3, LOS 10.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 53–56 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gary Smith, CFA, has been hired to analyze a specialty tool and machinery manufacturer, Whitmore Corporation (WMC). WMC is a leading producer of specialty machinery in the United States. At the end of 2014, WMC purchased York Tool Company (YTC), an Australian firm in a similar line of business. YTC has partially integrated its marketing functions within WMC but still maintains control of its operations and secures its own financing. Following is a summary of the income statement and balance sheet for YTC (in millions of Australian dollars – AUD) for the past three years as well as exchange rate data over the same period.<\/p><div class=\"tbl\"><table><tr><td>Income Statement (AUD millions)<\/td><td>2014<\/td><td>2015<\/td><td>2016<\/td><\/tr><tr><td>Revenues<\/td><td>765<\/td><td>820<\/td><td>870<\/td><\/tr><tr><td>COGS<\/td><td>484<\/td><td>520<\/td><td>580<\/td><\/tr><tr><td>SG&amp;A<\/td><td>171<\/td><td>183<\/td><td>200<\/td><\/tr><tr><td>Depreciation expense<\/td><td>50<\/td><td>50<\/td><td>50<\/td><\/tr><tr><td>Interest expense<\/td><td>18<\/td><td>17<\/td><td>16<\/td><\/tr><tr><td>Income before tax<\/td><td>42<\/td><td>50<\/td><td>24<\/td><\/tr><tr><td>Taxes<\/td><td>21<\/td><td>25<\/td><td>12<\/td><\/tr><tr><td>Net income<\/td><td>21<\/td><td>25<\/td><td>12<\/td><\/tr><\/table><\/div><p>Balance Sheet (AUD millions)<\/p><div class=\"tbl\"><table><tr><td>2014<\/td><td>2015<\/td><td>2016<\/td><td>2014<\/td><td>2015<\/td><td>2016<\/td><td><\/td><td><\/td><\/tr><tr><td>Cash<\/td><td>22<\/td><td>25<\/td><td>20<\/td><td>Current liabilities<\/td><td>616<\/td><td>593<\/td><td>584<\/td><\/tr><tr><td>Accounts receivable<\/td><td>400<\/td><td>422<\/td><td>460<\/td><td>Long-term debt<\/td><td>180<\/td><td>170<\/td><td>160<\/td><\/tr><tr><td>Inventories<\/td><td>20<\/td><td>25<\/td><td>30<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Prepaid expenses<\/td><td>8<\/td><td>20<\/td><td>25<\/td><td>Common stock<\/td><td>50<\/td><td>50<\/td><td>50<\/td><\/tr><tr><td>Net fixed assets<\/td><td>500<\/td><td>450<\/td><td>400<\/td><td>Retained earnings<\/td><td>104<\/td><td>129<\/td><td>141<\/td><\/tr><tr><td>Total assets<\/td><td>950<\/td><td>942<\/td><td>935<\/td><td>Total liabilities &amp; equity<\/td><td>950<\/td><td>942<\/td><td>935<\/td><\/tr><tr><td>Exchange rates (AUD / USD)<\/td><td>2014<\/td><td>2015<\/td><td>2016<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Average exchange rate<\/td><td>1.40<\/td><td>1.30<\/td><td>1.45<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Year-end exchange rate<\/td><td>1.20<\/td><td>1.40<\/td><td>1.50<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Historical exchange rate<\/td><td>1.20<\/td><td>1.20<\/td><td>1.20<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>If WMC uses the temporal method, YTC&#x27;s net monetary liabilities leave WMC exposed to loss in the event of:<\/p><\/div>","subj":"fsa"},{"n":55,"q":"Determine whether the translated total asset turnover for YTC for 2016 would be higher under the current rate method or under the temporal method.","opts":["Temporal method.","Current rate method.","No difference between temporal and current rate methods."],"ans":"B","expl":"Note that no calculations are necessary to answer this question. Revenues are translated using the same average exchange rate in the temporal and current rate methods. The only difference in the total asset turnover ratio must therefore be in the denominator (i.e., total assets). Under the current rate method, assets are translated using the current rate. Under the temporal method, monetary assets are translated using the current rate, and nonmonetary assets are translated using the historical rate. Because the historical rate is lower than the current rate, the nonmonetary assets (and therefore total assets) will have a higher value under the temporal method. A higher asset value means a lower total asset turnover ratio under the temporal method. The calculation of the total asset turnover ratio using both methods is provided for reference below:\ntotal asset turnover = revenue / total assets\nTemporal | Current Rate\nCash | 20 / 1.50 = | 13.33 | 20 / 1.50 = | 13.33\nAccounts receivable | 460 / 1.50 = | 306.67 | 460 / 1.50 = | 306.67\nInventories | 30 / 1.20 = | 25.00 | 30 / 1.50 = | 20.00\nPrepaid expenses | 25 / 1.20 = | 20.83 | 25 / 1.50 = | 16.67\nFixed assets | 400 / 1.20 = | 333.33 | 400 / 1.50 = | 266.67\nTotal assets | 699.16 | 623.34\nRevenues | 870 / 1.45 = | 600.00 | 870 / 1.45 = | 600.00\nTotal asset turnover | 600.00 / 699.16 = | 0.86 | 600.00 / 623.34 = | 0.96\n(Module 10.5, LOS 10.d)","explhtml":"<p>Note that no calculations are necessary to answer this question. Revenues are translated using the same average exchange rate in the temporal and current rate methods. The only difference in the total asset turnover ratio must therefore be in the denominator (i.e., total assets). Under the current rate method, assets are translated using the current rate. Under the temporal method, monetary assets are translated using the current rate, and nonmonetary assets are translated using the historical rate. Because the historical rate is lower than the current rate, the nonmonetary assets (and therefore total assets) will have a higher value under the temporal method. A higher asset value means a lower total asset turnover ratio under the temporal method. The calculation of the total asset turnover ratio using both methods is provided for reference below:<\/p><p>total asset turnover = revenue / total assets<\/p><div class=\"tbl\"><table><tr><td>Temporal<\/td><td>Current Rate<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Cash<\/td><td>20 / 1.50 =<\/td><td>13.33<\/td><td>20 / 1.50 =<\/td><td>13.33<\/td><\/tr><tr><td>Accounts receivable<\/td><td>460 / 1.50 =<\/td><td>306.67<\/td><td>460 / 1.50 =<\/td><td>306.67<\/td><\/tr><tr><td>Inventories<\/td><td>30 / 1.20 =<\/td><td>25.00<\/td><td>30 / 1.50 =<\/td><td>20.00<\/td><\/tr><tr><td>Prepaid expenses<\/td><td>25 / 1.20 =<\/td><td>20.83<\/td><td>25 / 1.50 =<\/td><td>16.67<\/td><\/tr><tr><td>Fixed assets<\/td><td>400 / 1.20 =<\/td><td>333.33<\/td><td>400 / 1.50 =<\/td><td>266.67<\/td><\/tr><tr><td>Total assets<\/td><td>699.16<\/td><td>623.34<\/td><td><\/td><td><\/td><\/tr><tr><td>Revenues<\/td><td>870 / 1.45 =<\/td><td>600.00<\/td><td>870 / 1.45 =<\/td><td>600.00<\/td><\/tr><tr><td>Total asset turnover<\/td><td>600.00 / 699.16 =<\/td><td>0.86<\/td><td>600.00 / 623.34 =<\/td><td>0.96<\/td><\/tr><\/table><\/div><p>(Module 10.5, LOS 10.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 53–56 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gary Smith, CFA, has been hired to analyze a specialty tool and machinery manufacturer, Whitmore Corporation (WMC). WMC is a leading producer of specialty machinery in the United States. At the end of 2014, WMC purchased York Tool Company (YTC), an Australian firm in a similar line of business. YTC has partially integrated its marketing functions within WMC but still maintains control of its operations and secures its own financing. Following is a summary of the income statement and balance sheet for YTC (in millions of Australian dollars – AUD) for the past three years as well as exchange rate data over the same period.<\/p><div class=\"tbl\"><table><tr><td>Income Statement (AUD millions)<\/td><td>2014<\/td><td>2015<\/td><td>2016<\/td><\/tr><tr><td>Revenues<\/td><td>765<\/td><td>820<\/td><td>870<\/td><\/tr><tr><td>COGS<\/td><td>484<\/td><td>520<\/td><td>580<\/td><\/tr><tr><td>SG&amp;A<\/td><td>171<\/td><td>183<\/td><td>200<\/td><\/tr><tr><td>Depreciation expense<\/td><td>50<\/td><td>50<\/td><td>50<\/td><\/tr><tr><td>Interest expense<\/td><td>18<\/td><td>17<\/td><td>16<\/td><\/tr><tr><td>Income before tax<\/td><td>42<\/td><td>50<\/td><td>24<\/td><\/tr><tr><td>Taxes<\/td><td>21<\/td><td>25<\/td><td>12<\/td><\/tr><tr><td>Net income<\/td><td>21<\/td><td>25<\/td><td>12<\/td><\/tr><\/table><\/div><p>Balance Sheet (AUD millions)<\/p><div class=\"tbl\"><table><tr><td>2014<\/td><td>2015<\/td><td>2016<\/td><td>2014<\/td><td>2015<\/td><td>2016<\/td><td><\/td><td><\/td><\/tr><tr><td>Cash<\/td><td>22<\/td><td>25<\/td><td>20<\/td><td>Current liabilities<\/td><td>616<\/td><td>593<\/td><td>584<\/td><\/tr><tr><td>Accounts receivable<\/td><td>400<\/td><td>422<\/td><td>460<\/td><td>Long-term debt<\/td><td>180<\/td><td>170<\/td><td>160<\/td><\/tr><tr><td>Inventories<\/td><td>20<\/td><td>25<\/td><td>30<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Prepaid expenses<\/td><td>8<\/td><td>20<\/td><td>25<\/td><td>Common stock<\/td><td>50<\/td><td>50<\/td><td>50<\/td><\/tr><tr><td>Net fixed assets<\/td><td>500<\/td><td>450<\/td><td>400<\/td><td>Retained earnings<\/td><td>104<\/td><td>129<\/td><td>141<\/td><\/tr><tr><td>Total assets<\/td><td>950<\/td><td>942<\/td><td>935<\/td><td>Total liabilities &amp; equity<\/td><td>950<\/td><td>942<\/td><td>935<\/td><\/tr><tr><td>Exchange rates (AUD / USD)<\/td><td>2014<\/td><td>2015<\/td><td>2016<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Average exchange rate<\/td><td>1.40<\/td><td>1.30<\/td><td>1.45<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Year-end exchange rate<\/td><td>1.20<\/td><td>1.40<\/td><td>1.50<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Historical exchange rate<\/td><td>1.20<\/td><td>1.20<\/td><td>1.20<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Determine whether the translated total asset turnover for YTC for 2016 would be higher under the current rate method or under the temporal method.<\/p><\/div>","subj":"fsa"},{"n":56,"q":"For the period 2014–2016, WMC's annual USD revenue growth rate attributable to its Australian subsidiary is most likely:","opts":["1.85% lower than the local currency revenue growth rate.","3.62% higher than the local currency revenue growth rate.","3.45% lower than the local currency revenue growth rate."],"ans":"A","expl":"1/2\nAUD revenue growth rate = (870 / 765) | − 1 = 6.64%\nRevenues are translated at average rate:\n2014 USD revenues = 765 / 1.40 = 546.43; 2016 USD revenues = 870 / 1.45 = 600 1/2\nUSD revenue growth rate = (600 / 546.43) | − 1 = 4.79%\nThe USD revenue growth rate is 1.85% lower than the local currency (AUD) revenue growth rate. (Module 10.8, LOS 10.i)","explhtml":"<p><sup>1/2<\/sup><\/p><div class=\"tbl\"><table><tr><td>AUD revenue growth rate = (870 / 765)<\/td><td> − 1 = 6.64%<\/td><\/tr><\/table><\/div><p>Revenues are translated at average rate:<\/p><p>2014 USD revenues = 765 / 1.40 = 546.43; 2016 USD revenues = 870 / 1.45 = 600 <sup>1/2<\/sup><\/p><div class=\"tbl\"><table><tr><td>USD revenue growth rate = (600 / 546.43)<\/td><td> − 1 = 4.79%<\/td><\/tr><\/table><\/div><p>The USD revenue growth rate is 1.85% lower than the local currency (AUD) revenue growth rate. (Module 10.8, LOS 10.i)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 53–56 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gary Smith, CFA, has been hired to analyze a specialty tool and machinery manufacturer, Whitmore Corporation (WMC). WMC is a leading producer of specialty machinery in the United States. At the end of 2014, WMC purchased York Tool Company (YTC), an Australian firm in a similar line of business. YTC has partially integrated its marketing functions within WMC but still maintains control of its operations and secures its own financing. Following is a summary of the income statement and balance sheet for YTC (in millions of Australian dollars – AUD) for the past three years as well as exchange rate data over the same period.<\/p><div class=\"tbl\"><table><tr><td>Income Statement (AUD millions)<\/td><td>2014<\/td><td>2015<\/td><td>2016<\/td><\/tr><tr><td>Revenues<\/td><td>765<\/td><td>820<\/td><td>870<\/td><\/tr><tr><td>COGS<\/td><td>484<\/td><td>520<\/td><td>580<\/td><\/tr><tr><td>SG&amp;A<\/td><td>171<\/td><td>183<\/td><td>200<\/td><\/tr><tr><td>Depreciation expense<\/td><td>50<\/td><td>50<\/td><td>50<\/td><\/tr><tr><td>Interest expense<\/td><td>18<\/td><td>17<\/td><td>16<\/td><\/tr><tr><td>Income before tax<\/td><td>42<\/td><td>50<\/td><td>24<\/td><\/tr><tr><td>Taxes<\/td><td>21<\/td><td>25<\/td><td>12<\/td><\/tr><tr><td>Net income<\/td><td>21<\/td><td>25<\/td><td>12<\/td><\/tr><\/table><\/div><p>Balance Sheet (AUD millions)<\/p><div class=\"tbl\"><table><tr><td>2014<\/td><td>2015<\/td><td>2016<\/td><td>2014<\/td><td>2015<\/td><td>2016<\/td><td><\/td><td><\/td><\/tr><tr><td>Cash<\/td><td>22<\/td><td>25<\/td><td>20<\/td><td>Current liabilities<\/td><td>616<\/td><td>593<\/td><td>584<\/td><\/tr><tr><td>Accounts receivable<\/td><td>400<\/td><td>422<\/td><td>460<\/td><td>Long-term debt<\/td><td>180<\/td><td>170<\/td><td>160<\/td><\/tr><tr><td>Inventories<\/td><td>20<\/td><td>25<\/td><td>30<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Prepaid expenses<\/td><td>8<\/td><td>20<\/td><td>25<\/td><td>Common stock<\/td><td>50<\/td><td>50<\/td><td>50<\/td><\/tr><tr><td>Net fixed assets<\/td><td>500<\/td><td>450<\/td><td>400<\/td><td>Retained earnings<\/td><td>104<\/td><td>129<\/td><td>141<\/td><\/tr><tr><td>Total assets<\/td><td>950<\/td><td>942<\/td><td>935<\/td><td>Total liabilities &amp; equity<\/td><td>950<\/td><td>942<\/td><td>935<\/td><\/tr><tr><td>Exchange rates (AUD / USD)<\/td><td>2014<\/td><td>2015<\/td><td>2016<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Average exchange rate<\/td><td>1.40<\/td><td>1.30<\/td><td>1.45<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Year-end exchange rate<\/td><td>1.20<\/td><td>1.40<\/td><td>1.50<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Historical exchange rate<\/td><td>1.20<\/td><td>1.20<\/td><td>1.20<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>For the period 2014–2016, WMC&#x27;s annual USD revenue growth rate attributable to its Australian subsidiary is most likely:<\/p><\/div>","subj":"fsa"},{"n":57,"q":"Calculate the market conversion premium per share for MediSoft's convertible bonds.","opts":["$2.61.","$2.95.","$5.56."],"ans":"A","expl":"First, calculate the conversion ratio:\npar value | 1,000\nconversion ratio = | = | = 18\nconversion price | 55.56\nNow, calculate market conversion price:\nmarket bond price | 947\nmarket conversion price = | = | = 52.61\nconversion ratio | 18\nFinally, calculate the market conversion premium per share as the difference between the market conversion price and the market price of the stock: market conversion premium = 52.61 − 50.00 = 2.61 (Module 27.8, LOS 27.o)","explhtml":"<p>First, calculate the conversion ratio:<\/p><div class=\"tbl\"><table><tr><td>par value<\/td><td>1,000<\/td><td><\/td><\/tr><tr><td>conversion ratio =<\/td><td>=<\/td><td>= 18<\/td><\/tr><tr><td>conversion price<\/td><td>55.56<\/td><td><\/td><\/tr><\/table><\/div><p>Now, calculate market conversion price:<\/p><div class=\"tbl\"><table><tr><td>market bond price<\/td><td>947<\/td><td><\/td><\/tr><tr><td>market conversion price =<\/td><td>=<\/td><td>= 52.61<\/td><\/tr><tr><td>conversion ratio<\/td><td>18<\/td><td><\/td><\/tr><\/table><\/div><p>Finally, calculate the market conversion premium per share as the difference between the market conversion price and the market price of the stock: market conversion premium = 52.61 − 50.00 = 2.61 (Module 27.8, LOS 27.o)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 57–60 · Fixed Income<\/summary><div class=\"vig-body\"><p>MediSoft, Inc., develops and distributes high-tech medical software used in hospitals and clinics across the United States and Canada. The firm&#x27;s software provides an integrated solution to monitoring, analyzing, and managing output from a variety of diagnostic medical equipment including MRIs, CT scans, and EKG machines. MediSoft has grown rapidly since its inception 10 years ago, averaging 25% growth in sales over the past decade. Twelve months after its IPO, MediSoft made two bond offerings, the first of which was a convertible bond.<\/p><p>At the time of issuance, the convertible bond had a coupon rate of 7.25%, a par value of $1,000, a conversion price of $55.56, and 10 years until maturity. Two years after issuance, the bond became callable at 102% of par value. Soon after the issuance of the convertible bond, the company issued another series of bonds, which were putable but contained no conversion or call features. The putable bonds were issued with a coupon of 8.0%, a par value of $1,000, and 15 years until maturity. The putable bond has a European-style option exercisable 10 years after issuance at par. The bonds were issued three years ago.<\/p><p>MediSoft&#x27;s convertible bonds are now trading in the market for a price of $947 with an estimated straight value of $917. The company&#x27;s putable bonds are trading at a price of $1,052. Volatility in the price of MediSoft&#x27;s common stock has been relatively high over the past few months. Currently, the stock is priced at $50 on the New York Stock Exchange and is expected to continue its annual dividend in the amount of $1.80 per share.<\/p><p>High-tech industry analysts for Brown &amp; Associates, a money management firm specializing in fixed-income investments, have been closely following MediSoft ever since it went public three years ago. In general, portfolio managers at Brown &amp; Associates do not participate in initial offerings of debt investments, preferring instead to see how the issue trades before considering taking a position in the issue. Because MediSoft&#x27;s bonds have had ample time to trade in the marketplace, analysts and portfolio managers have taken an interest in the company&#x27;s bonds. At a meeting to discuss the merits of MediSoft&#x27;s bonds, the following comment was made by a portfolio manager at Brown &amp; Associates:<\/p><p>&quot;Choosing to invest in MediSoft&#x27;s convertible bond would benefit our portfolios in many ways, but the primary benefit is the limited downside risk associated with the bond. Because the straight value will provide a floor for the value of the convertible bond, downside risk is limited to the difference between the market price of the bond and the straight value.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Calculate the market conversion premium per share for MediSoft&#x27;s convertible bonds.<\/p><\/div>","subj":"fixed"},{"n":58,"q":"The minimum value of the convertible bond today is closest to:","opts":["$900.","$917.","$947."],"ans":"B","expl":"Minimum value of a convertible = Max (straight value, conversion value) Straight value = $917 (given) Conversion value = 18 × $50 = $900 Minimum value of the convertible = $917 (Module 27.8, LOS 27.o)","explhtml":"<p>Minimum value of a convertible = Max (straight value, conversion value) Straight value = $917 (given) Conversion value = 18 × $50 = $900 Minimum value of the convertible = $917 (Module 27.8, LOS 27.o)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 57–60 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>MediSoft, Inc., develops and distributes high-tech medical software used in hospitals and clinics across the United States and Canada. The firm&#x27;s software provides an integrated solution to monitoring, analyzing, and managing output from a variety of diagnostic medical equipment including MRIs, CT scans, and EKG machines. MediSoft has grown rapidly since its inception 10 years ago, averaging 25% growth in sales over the past decade. Twelve months after its IPO, MediSoft made two bond offerings, the first of which was a convertible bond.<\/p><p>At the time of issuance, the convertible bond had a coupon rate of 7.25%, a par value of $1,000, a conversion price of $55.56, and 10 years until maturity. Two years after issuance, the bond became callable at 102% of par value. Soon after the issuance of the convertible bond, the company issued another series of bonds, which were putable but contained no conversion or call features. The putable bonds were issued with a coupon of 8.0%, a par value of $1,000, and 15 years until maturity. The putable bond has a European-style option exercisable 10 years after issuance at par. The bonds were issued three years ago.<\/p><p>MediSoft&#x27;s convertible bonds are now trading in the market for a price of $947 with an estimated straight value of $917. The company&#x27;s putable bonds are trading at a price of $1,052. Volatility in the price of MediSoft&#x27;s common stock has been relatively high over the past few months. Currently, the stock is priced at $50 on the New York Stock Exchange and is expected to continue its annual dividend in the amount of $1.80 per share.<\/p><p>High-tech industry analysts for Brown &amp; Associates, a money management firm specializing in fixed-income investments, have been closely following MediSoft ever since it went public three years ago. In general, portfolio managers at Brown &amp; Associates do not participate in initial offerings of debt investments, preferring instead to see how the issue trades before considering taking a position in the issue. Because MediSoft&#x27;s bonds have had ample time to trade in the marketplace, analysts and portfolio managers have taken an interest in the company&#x27;s bonds. At a meeting to discuss the merits of MediSoft&#x27;s bonds, the following comment was made by a portfolio manager at Brown &amp; Associates:<\/p><p>&quot;Choosing to invest in MediSoft&#x27;s convertible bond would benefit our portfolios in many ways, but the primary benefit is the limited downside risk associated with the bond. Because the straight value will provide a floor for the value of the convertible bond, downside risk is limited to the difference between the market price of the bond and the straight value.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>The minimum value of the convertible bond today is closest to:<\/p><\/div>","subj":"fixed"},{"n":59,"q":"Suppose that MediSoft wants to issue new bonds but wants to issue the bonds at-or-above par value. Which of the following bonds would most closely match their criteria?","opts":["7-year, 7.25% convertible bond with a conversion price of $56.","7-year, 7.25% callable bond, callable in two years at 102% of par.","7-year, 8% coupon bond extendible for five years at the same coupon rate."],"ans":"C","expl":"The 7-year, 7.25% convertible bond has a market price of $947 (given) and, therefore, does not qualify (as it is below par). A similar option-free bond would be worth less (given in the case as $917). A similar callable bond would be worth even less. This value is not given but would be below $917 and, therefore, below par. A 7-year bond extendible by five years would be valued the same as an equivalent 12-year putable bond with an European put option that is exercisable in seven years. The value of the putable bond is given as $1,052; this bond meets the criteria. (Module 27.1, LOS 27.a)","explhtml":"<p>The 7-year, 7.25% convertible bond has a market price of $947 (given) and, therefore, does not qualify (as it is below par). A similar option-free bond would be worth less (given in the case as $917). A similar callable bond would be worth even less. This value is not given but would be below $917 and, therefore, below par. A 7-year bond extendible by five years would be valued the same as an equivalent 12-year putable bond with an European put option that is exercisable in seven years. The value of the putable bond is given as $1,052; this bond meets the criteria. (Module 27.1, LOS 27.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 57–60 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>MediSoft, Inc., develops and distributes high-tech medical software used in hospitals and clinics across the United States and Canada. The firm&#x27;s software provides an integrated solution to monitoring, analyzing, and managing output from a variety of diagnostic medical equipment including MRIs, CT scans, and EKG machines. MediSoft has grown rapidly since its inception 10 years ago, averaging 25% growth in sales over the past decade. Twelve months after its IPO, MediSoft made two bond offerings, the first of which was a convertible bond.<\/p><p>At the time of issuance, the convertible bond had a coupon rate of 7.25%, a par value of $1,000, a conversion price of $55.56, and 10 years until maturity. Two years after issuance, the bond became callable at 102% of par value. Soon after the issuance of the convertible bond, the company issued another series of bonds, which were putable but contained no conversion or call features. The putable bonds were issued with a coupon of 8.0%, a par value of $1,000, and 15 years until maturity. The putable bond has a European-style option exercisable 10 years after issuance at par. The bonds were issued three years ago.<\/p><p>MediSoft&#x27;s convertible bonds are now trading in the market for a price of $947 with an estimated straight value of $917. The company&#x27;s putable bonds are trading at a price of $1,052. Volatility in the price of MediSoft&#x27;s common stock has been relatively high over the past few months. Currently, the stock is priced at $50 on the New York Stock Exchange and is expected to continue its annual dividend in the amount of $1.80 per share.<\/p><p>High-tech industry analysts for Brown &amp; Associates, a money management firm specializing in fixed-income investments, have been closely following MediSoft ever since it went public three years ago. In general, portfolio managers at Brown &amp; Associates do not participate in initial offerings of debt investments, preferring instead to see how the issue trades before considering taking a position in the issue. Because MediSoft&#x27;s bonds have had ample time to trade in the marketplace, analysts and portfolio managers have taken an interest in the company&#x27;s bonds. At a meeting to discuss the merits of MediSoft&#x27;s bonds, the following comment was made by a portfolio manager at Brown &amp; Associates:<\/p><p>&quot;Choosing to invest in MediSoft&#x27;s convertible bond would benefit our portfolios in many ways, but the primary benefit is the limited downside risk associated with the bond. Because the straight value will provide a floor for the value of the convertible bond, downside risk is limited to the difference between the market price of the bond and the straight value.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Suppose that MediSoft wants to issue new bonds but wants to issue the bonds at-or-above par value. Which of the following bonds would most closely match their criteria?<\/p><\/div>","subj":"fixed"},{"n":60,"q":"Under what circumstances will the portfolio manager's comments regarding the limited downside risk of MediSoft's convertible bonds be accurate?","opts":["Short-term and long-term interest rates are expected to remain the same.","The Federal Reserve Bank decides to pursue a restrictive monetary policy.","The convertible bond is trading in the market as a common stock equivalent."],"ans":"A","expl":"If interest rates are not expected to change then the straight value of the bond will not change (ignoring the change in value resulting from the passage of time). If the straight value does not change, then downside risk is indeed limited to the difference between the price paid for the bond and the straight value. If, however, interest rates rise as the price of the common stock falls, the conversion value will fall and the straight value will fall, exposing the holder of the convertible bond to more downside risk. (Module 27.8, LOS 27.q)","explhtml":"<p>If interest rates are not expected to change then the straight value of the bond will not change (ignoring the change in value resulting from the passage of time). If the straight value does not change, then downside risk is indeed limited to the difference between the price paid for the bond and the straight value. If, however, interest rates rise as the price of the common stock falls, the conversion value will fall and the straight value will fall, exposing the holder of the convertible bond to more downside risk. (Module 27.8, LOS 27.q)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 57–60 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>MediSoft, Inc., develops and distributes high-tech medical software used in hospitals and clinics across the United States and Canada. The firm&#x27;s software provides an integrated solution to monitoring, analyzing, and managing output from a variety of diagnostic medical equipment including MRIs, CT scans, and EKG machines. MediSoft has grown rapidly since its inception 10 years ago, averaging 25% growth in sales over the past decade. Twelve months after its IPO, MediSoft made two bond offerings, the first of which was a convertible bond.<\/p><p>At the time of issuance, the convertible bond had a coupon rate of 7.25%, a par value of $1,000, a conversion price of $55.56, and 10 years until maturity. Two years after issuance, the bond became callable at 102% of par value. Soon after the issuance of the convertible bond, the company issued another series of bonds, which were putable but contained no conversion or call features. The putable bonds were issued with a coupon of 8.0%, a par value of $1,000, and 15 years until maturity. The putable bond has a European-style option exercisable 10 years after issuance at par. The bonds were issued three years ago.<\/p><p>MediSoft&#x27;s convertible bonds are now trading in the market for a price of $947 with an estimated straight value of $917. The company&#x27;s putable bonds are trading at a price of $1,052. Volatility in the price of MediSoft&#x27;s common stock has been relatively high over the past few months. Currently, the stock is priced at $50 on the New York Stock Exchange and is expected to continue its annual dividend in the amount of $1.80 per share.<\/p><p>High-tech industry analysts for Brown &amp; Associates, a money management firm specializing in fixed-income investments, have been closely following MediSoft ever since it went public three years ago. In general, portfolio managers at Brown &amp; Associates do not participate in initial offerings of debt investments, preferring instead to see how the issue trades before considering taking a position in the issue. Because MediSoft&#x27;s bonds have had ample time to trade in the marketplace, analysts and portfolio managers have taken an interest in the company&#x27;s bonds. At a meeting to discuss the merits of MediSoft&#x27;s bonds, the following comment was made by a portfolio manager at Brown &amp; Associates:<\/p><p>&quot;Choosing to invest in MediSoft&#x27;s convertible bond would benefit our portfolios in many ways, but the primary benefit is the limited downside risk associated with the bond. Because the straight value will provide a floor for the value of the convertible bond, downside risk is limited to the difference between the market price of the bond and the straight value.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Under what circumstances will the portfolio manager&#x27;s comments regarding the limited downside risk of MediSoft&#x27;s convertible bonds be accurate?<\/p><\/div>","subj":"fixed"},{"n":61,"q":"Reese's statement about credit valuation adjustment is most likely:","opts":["correct.","incorrect about the use of risk-neutral probability of default.","incorrect about the sum of expected losses."],"ans":"C","expl":"Credit valuation adjustment (CVA) is the sum of the present value of the expected loss for each period (and not simply just the sum of the expected losses). (Module 28.1, LOS 28.a)","explhtml":"<p>Credit valuation adjustment (CVA) is the sum of the present value of the expected loss for each period (and not simply just the sum of the expected losses). (Module 28.1, LOS 28.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 61–64 · Fixed Income<\/summary><div class=\"vig-body\"><p>Michael Thomas, CFA, is a fixed-income portfolio manager for TFC Investments. As part of his portfolio strategy for the Prosperity Fund, Thomas seeks out bonds that he expects to be upgraded or downgraded. Potential upgrades that Thomas identifies are added to the portfolio (or, if already in the portfolio, are increased in proportion to other holdings). Potential downgrades are sold from the portfolio. Thomas&#x27;s portfolio&#x27;s current holdings include several bonds issued by companies in the oil and gas exploration and refining industries. Year-end rating updates are expected to occur in a few days, and Thomas is preparing to adjust his portfolio in advance of expected changes in credit ratings.<\/p><p>Thomas has been discussing his fixed-income strategies with fellow portfolio manager Shawna Reese. Reese suggests that while Thomas&#x27;s general approach is suitable, the overall credit-analysis strategy could be improved. Reese recommends using the credit valuation adjustment as a metric in credit analysis.<\/p><p>Reese makes the following statement to Thomas:<\/p><div class=\"tbl\"><table><tr><td>Reese&#x27;s<\/td><td>&quot;Credit valuation adjustment is the sum of the expected loss for<\/td><\/tr><tr><td>statement:<\/td><td>each period based on the risk-neutral probability of default.&quot;<\/td><\/tr><\/table><\/div><p>Reese provides information about 4% Pistar, Inc., bonds, which are currently rated AA with a negative outlook. The bonds have a modified duration of 7.8, and the credit spread on the bonds is expected to be the same as the average for that rating category. Reese wants to calculate the impact of a downgrade on Pistar, Inc.&#x27;s bonds given the information in Exhibit 1.<\/p><p>Exhibit 1: Average Credit Spreads by Ratings Category<\/p><div class=\"tbl\"><table><tr><td>AAA<\/td><td>AA<\/td><td>A<\/td><td>BBB<\/td><td>BB<\/td><td>B<\/td><td>CCC<\/td><\/tr><tr><td>0.24%<\/td><td>0.29%<\/td><td>0.39%<\/td><td>0.58%<\/td><td>0.89%<\/td><td>1.12%<\/td><td>1.78%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Reese&#x27;s statement about credit valuation adjustment is most likely:<\/p><\/div>","subj":"fixed"},{"n":62,"q":"Under the option analogy of the structural model, owning a company's debt is economically equivalent to owning a riskless bond and simultaneously:","opts":["buying an American put option on the assets of the company.","selling a European put option on the assets of the company.","buying a European put option on the assets of the company."],"ans":"B","expl":"Under the structural model's debt option analogy, owning a company's debt is economically equivalent to owning a riskless bond that pays K dollars at time T, plus simultaneously selling a European put option on the assets of the company with maturity T and strike price K. (Module 28.4, LOS 28.d)","explhtml":"<p>Under the structural model&#x27;s debt option analogy, owning a company&#x27;s debt is economically equivalent to owning a riskless bond that pays K dollars at time T, plus simultaneously selling a European put option on the assets of the company with maturity T and strike price K. (Module 28.4, LOS 28.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 61–64 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summar io containing a long bond position and a short futures position.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding Statements 3 and 4 made by Widby, it would be most accurate to state that:<\/p><\/div>","subj":"derivatives"},{"n":69,"q":"Regarding Shepard's Statements 1 and 2:","opts":["only one statement is correct.","neither statement is correct.","both statements are correct."],"ans":"C","expl":"Asset return distributions often exhibit skewness and excess kurtosis (i.e., fat tails). Since scenario analysis and simulations do not require specification of a multivariate normal distribution of asset returns, they can provide a more complete picture of investment strategy performance. Scenario analysis can be used to analyze the performance and risk of investment strategies in different structural regimes.\n(Module 38.4, LOS 38.e)","explhtml":"<p>Asset return distributions often exhibit skewness and excess kurtosis (i.e., fat tails). Since scenario analysis and simulations do not require specification of a multivariate normal distribution of asset returns, they can provide a more complete picture of investment strategy performance. Scenario analysis can be used to analyze the performance and risk of investment strategies in different structural regimes.<\/p><p>(Module 38.4, LOS 38.e)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 69–72 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Millennium Investments (MI), an investment advisory firm, provides asset allocation<\/p><p>recommendations for its clients. Prior to making such recommendations, Millennium&#x27;s<\/p><p>staff routinely evaluates its models using backtesting. Sam Shepard, Senior Manager,<\/p><p>makes the following statements:<\/p><p>If asset returns do not follow a multivariate normal distribution, Statement scenario analysis and simulation can provide a more complete picture 1:<\/p><p>of investment strategy performance.<\/p><div class=\"tbl\"><table><tr><td>Statement<\/td><td>Scenario analysis can be used to analyze the performance and risk of<\/td><\/tr><tr><td>2:<\/td><td>investment strategies in different structural regimes.<\/td><\/tr><tr><td>Statement<\/td><td>Conventional rolling-window backtesting may not fully account for the<\/td><\/tr><tr><td>3:<\/td><td>dynamic nature of financial markets or possible extreme downside risk.<\/td><\/tr><\/table><\/div><p>Compared to a historical simulation approach, Monte Carlo simulation Statement is a more appropriate method to account for skewness, excess kurtosis, 4:<\/p><p>and tail dependence in a return distributions.<\/p><p>Shepard is also looking at evaluating three portfolios using a single-factor model.<\/p><p>Information about the three portfolios is shown in  Exhibit 1.<\/p><p>Exhibit 1: Portfolio Factor Sensitivity and Expected Return<\/p><div class=\"tbl\"><table><tr><td>Portfolio<\/td><td>Expected Return<\/td><td>Factor Sensitivity<\/td><\/tr><tr><td>X<\/td><td>0.10<\/td><td>1.00<\/td><\/tr><tr><td>Y<\/td><td>0.12<\/td><td>1.25<\/td><\/tr><tr><td>Z<\/td><td>0.15<\/td><td>1.50<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding Shepard&#x27;s Statements 1 and 2:<\/p><\/div>","subj":"portfolio"},{"n":70,"q":"Regarding Shepard's Statements 3 and 4:","opts":["both statements are correct.","only one statement is correct.","neither statement is correct."],"ans":"B","expl":"Asset return distributions often exhibit skewness and excess kurtosis (i.e., fat tails). Also, conventional rolling-window backtesting may not fully account for the dynamic nature of financial markets or possible extreme downside risk. Scenario analysis and simulation can provide a more thorough portrayal of investment strategy performance.\nBoth Monte Carlo and historical simulation approaches are methods used to account for skewness, excess kurtosis, and tail dependence.\n(Module 38.4, LOS 38.f)\n(Module 38.4, LOS 38.e)", ios using a single-factor model.<\/p><p>Information about the three portfolios is shown in  Exhibit 1.<\/p><p>Exhibit 1: Portfolio Factor Sensitivity and Expected Return<\/p><div class=\"tbl\"><table><tr><td>Portfolio<\/td><td>Expected Return<\/td><td>Factor Sensitivity<\/td><\/tr><tr><td>X<\/td><td>0.10<\/td><td>1.00<\/td><\/tr><tr><td>Y<\/td><td>0.12<\/td><td>1.25<\/td><\/tr><tr><td>Z<\/td><td>0.15<\/td><td>1.50<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding Shepard&#x27;s Statements 3 and 4:<\/p><\/div>","subj":"portfolio"},{"n":71,"q":"Another stock (not in the portfolio), PSL, has a factor sensitivity of –0.9 to inflation and +1 .2 to GDP growth rate. Last year, PSL's actual return was 8% (0.5% unexplained by the model). Inflation surprise, as well as GDP growth rate surprise, was +0.5%. PSL's expected return was closest to:","opts":["7.35%.","7.50%.","8.50%."],"ans":"A","expl":"8 = E(R) + (–0.9 × 0.5) + (1.2 × 0.5) + (0.5) E(R) = 7.35% (Module 36.2, LOS 36.d)","explhtml":"<p>8 = E(R) + (–0.9 × 0.5) + (1.2 × 0.5) + (0.5) E(R) = 7.35% (Module 36.2, LOS 36.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 69–72 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Millennium Investments (MI), an investment advisory firm, provides asset allocation<\/p><p>recommendations for its clients. Prior to making such recommendations, Millennium&#x27;s<\/p><p>staff routinely evaluates its models using backtesting. Sam Shepard, Senior Manager,<\/p><p>makes the following statements:<\/p><p>If asset returns do not follow a multivariate normal distribution, Statement scenario analysis and simulation can provide a more complete picture 1:<\/p><p>of investment strategy performance.<\/p><div class=\"tbl\"><table><tr><td>Statement<\/td><td>Scenario analysis can be used to analyze the performance and risk of<\/td><\/tr><tr><td>2:<\/td><td>investment td><td>0.12<\/td><td>1.25<\/td><\/tr><tr><td>Z<\/td><td>0.15<\/td><td>1.50<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Using information in  Exhibit 1, taking advantage of an arbitrage opportunity would most likely require shorting:<\/p><\/div>","subj":"portfolio"},{"n":73,"q":"To address the client's concerns about extreme stress events on the portfolio value, Yeung is most likely to communicate the portfolio's:","opts":["VaR.","relative VaR.","conditional VaR."],"ans":"C","expl":"Yeung should present the portfolio's conditional VaR, which is the expected loss in the tail (given that VaR is exceeded). VaR just communicates the maximum loss a certain percentage of the time. Relative VaR is appropriate only for clients concerned about performance relative to a benchmark. (Module 37.2, LOS 37.e)","explhtml":"<p>Yeung should present the portfolio&#x27;s conditional VaR, which is the expected loss in the tail (given that VaR is exceeded). VaR just communicates the maximum loss a certain percentage of the time. Relative VaR is appropriate only for clients concerned about performance relative to a benchmark. (Module 37.2, LOS 37.e)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 73–76 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Hong Zhou, Jianguo Yeung, and Jm Leor Joeng work for Pearl Asset Management, a large private wealth advisory firm. During lunch they discuss various unique client situations they face and how they plan to resolve them.<\/p><p>Yeung mentions that yesterday, he met one of his clients who was very concerned about current market volatility and its impact on his portfolio. Specifically, the client is concerned about the impact of extreme stress events.<\/p><p>Zhou, Yeung, and Joeng are all developing multifactor models to attempt to explain asset price returns. Zhou has built his model based on standardized sensitivities of asset returns to intrinsic valuation model inputs. When Zhou asks Yeung about factors that his model uses to explain the differences in returns of different asset classes, Yeung replies that he can&#x27;t define exactly what the factors are but insists that his model uses statistical relationships that have been proven to hold over time. Joeng discounts both Zhou and Yeung&#x27;s approaches and instead insists that surprises cause stock prices to move. Hence, he has built his model based on surprises rather than sensitivities to absolute factors.<\/p><p>Zhou wishes to combine the actively managed Lincoln investment fund with a passively managed fund that tracks the Russell 2000 (which is the benchmark for the Lincoln fund). Expected risk and return data is as follows:<\/p><div class=\"tbl\"><table><tr><td>Lincoln Fund<\/td><td>Russell 2000<\/td><td><\/td><\/tr><tr><td>Expected annual return<\/td><td>7.6%<\/td><td>6.5%<\/td><\/tr><tr><td>Return standard deviation<\/td><td>19.0%<\/td><td>11.0%<\/td><\/tr><tr><td>Active risk<\/td><td>5.0%<\/td><td>0.0%<\/td><\/tr><\/table><\/div><p>The risk-free rate is 3.0%<\/p><\/div><\/details><div class=\"qtext\"><p>To address the client&#x27;s concerns about extreme stress events on the portfolio value, Yeung is most likely to communicate the portfolio&#x27;s:<\/p><\/div>","subj":"portfolio"},{"n":74,"q":"Regarding the use of multifactor models, which of the following statements is most likely to be correct?","opts":["Zhou is using a macroeconomic model, Yeung is using a fundamental factor model, and Joeng is using principal component analysis.","Zhou is using a fundamental factor model, Yeung is using principal component analysis, and Joeng is using a macroeconomic model.","Zhou is using principal component analysis, Yeung is using a macroeconomic model, and Joeng is using a fundamental factor model."],"ans":"B","expl":"Macroeconomic models are based on surprises in macroeconomic data. Principal component analysis is used to identify the factors of a statistical factor model, which cannot necessarily be described using conventional economic variables. Fundamental factor models use firm-specific valuation metrics such as PE with standardized sensitivities. (Module 36.2, LOS 36.d)","explhtml":"<p>Macroeconomic models are based on surprises in macroeconomic data. Principal component analysis is used to identify the factors of a statistical factor model, which cannot necessarily be described using conventional economic variables. Fundamental factor models use firm-specific valuation metrics such as PE with standardized sensitivities. (Module 36.2, LOS 36.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 73–76 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Hong Zhou, Jianguo Yeung, and Jm Leor Joeng work for Pearl Asset Management, a large private wealth advisory firm. During lunch they discuss various unique client situations they face and how they plan to resolve them.<\/p><p>Yeung mentions that yesterday, he met one of his clients who was very concerned about current market volatility and its impact on his portfolio. Specifically, the client is concerned about the impact of extreme stress events.<\/p><p>Zhou, Yeung, and Joeng are all developing multifactor models to attempt to explain asset price returns. Zhou has built his model based on standardized sensitivities of asset returns to intrinsic valuation model inputs. When Zhou asks Yeung about factors that his model uses to explain the differences in returns of different asset classes, Yeung replies that he can&#x27;t define exactly what the factors are but insists that his model uses statistical relationships that have been proven to hold over time. Joeng discounts both Zhou and Yeung&#x27;s approaches and instead insists that surprises cause stock prices to move. Hence, he has built his model based on surprises rather than sensitivities to absolute factors.<\/p><p>Zhou wishes to combine the actively managed Lincoln investment fund with a passively managed fund that tracks the Russell 2000 (which is the benchmark for the Lincoln fund). Expected risk and return data is as follows:<\/p><div class=\"tbl\"><table><tr><td>Lincoln Fund<\/td><td>Russell 2000<\/td><td><\/td><\/tr><tr><td>Expected annual return<\/td><td>7.6%<\/td><td>6.5%<\/td><\/tr><tr><td>Return standard deviation<\/td><td>19.0%<\/td><td>11.0%<\/td><\/tr><tr><td>Active risk<\/td><td>5.0%<\/td><td>0.0%<\/td><\/tr><\/table><\/div><p>The risk-free rate is 3.0%<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding the use of multifactor models, which of the following statements is most likely to be correct?<\/p><\/div>","subj":"portfolio"},{"n":75,"q":"To achieve the optimal level of active risk, what proportion of funds would Zhou allocate to the Lincoln fund?","opts":["53%.","82%.","151%."],"ans":"C","expl":"Information ratio for Lincoln fund = IR = active return/active risk = (7.6% − 6.5%) / 5% = 0.22 Sharpe ratio of benchmark = SRB = (6.5% − 3%) / 11% = 0.32 The optimal amount of active risk can be calculated as: σ*A = (IR/SRB) × σB = (0.22 / 0.32) × 11.0% = 7.56% The weight of the active Lincoln portfolio should be 7.56% / 5.0% = 1.51, and the weight on the benchmark portfolio would be 1 − 1.51 = –0.51. (Module 40.3, LOS 40.d)","explhtml":"<p>Information ratio for Lincoln fund = IR = active return/active risk = (7.6% − 6.5%) / 5% = 0.22 Sharpe ratio of benchmark = SRB = (6.5% − 3%) / 11% = 0.32 The optimal amount of active risk can be calculated as: σ*A = (IR/SRB) × σB = (0.22 / 0.32) × 11.0% = 7.56% The weight of the active Lincoln portfolio should be 7.56% / 5.0% = 1.51, and the weight on the benchmark portfolio would be 1 − 1.51 = –0.51. (Module 40.3, LOS 40.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 73–76 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Hong Zhou, Jianguo Yeung, and Jm Leor Joeng work for Pearl Asset Management, a large private wealth advisory firm. During lunch they discuss various unique client situations they face and how they plan to resolve them.<\/p><p>Yeung mentions that yesterday, he met one of his clients who was very concerned about current market volatility and its impact on his portfolio. Specifically, the client is concerned about the impact of extreme stress events.<\/p><p>Zhou, Yeung, and Joeng are all developing multifactor models to attempt to explain asset price returns. Zhou has built his model based on standardized sensitivities of asset returns to intrinsic valuation model inputs. When Zhou asks Yeung about factors that his model uses to explain the differences in returns of different asset classes, Yeung replies that he can&#x27;t define exactly what the factors are but insists that his model uses statistical relationships that have been proven to hold over time. Joeng discounts both Zhou and Yeung&#x27;s approaches and instead insists that surprises cause stock prices to move. Hence, he has built his model based on surprises rather than sensitivities to absolute factors.<\/p><p>Zhou wishes to combine the actively managed Lincoln investment fund with a passively managed fund that tracks the Russell 2000 (which is the benchmark for the Lincoln fund). Expected risk and return data is as follows:<\/p><div class=\"tbl\"><table><tr><td>Lincoln Fund<\/td><td>Russell 2000<\/td><td><\/td><\/tr><tr><td>Expected annual return<\/td><td>7.6%<\/td><td>6.5%<\/td><\/tr><tr><td>Return standard deviation<\/td><td>19.0%<\/td><td>11.0%<\/td><\/tr><tr><td>Active risk<\/td><td>5.0%<\/td><td>0.0%<\/td><\/tr><\/table><\/div><p>The risk-free rate is 3.0%<\/p><\/div><\/details><div class=\"qtext\"><p>To achieve the optimal level of active risk, what proportion of funds would Zhou allocate to the Lincoln fund?<\/p><\/div>","subj":"portfolio"},{"n":76,"q":"The highest Sharpe ratio that Zhou ca odel uses to explain the differences in returns of different asset classes, Yeung replies that he can&#x27;t define exactly what the factors are but insists that his model uses statistical relationships that have been proven to hold over time. Joeng discounts both Zhou and Yeung&#x27;s approaches and instead insists that surprises cause stock prices to move. Hence, he has built his model based on surprises rather than sensitivities to absolute factors.<\/p><p>Zhou wishes to combine the actively managed Lincoln investment fund with a passively managed fund that tracks the Russell 2000 (which is the benchmark for the Lincoln fund). Expected risk and return data is as follows:<\/p><div class=\"tbl\"><table><tr><td>Lincoln Fund<\/td><td>Russell 2000<\/td><td><\/td><\/tr><tr><td>Expected annual return<\/td><td>7.6%<\/td><td>6.5%<\/td><\/tr><tr><td>Return standard deviation<\/td><td>19.0%<\/td><td>11.0%<\/td><\/tr><tr><td>Active risk<\/td><td>5.0%<\/td><td>0.0%<\/td><\/tr><\/table><\/div><p>The risk-free rate is 3.0%<\/p><\/div><\/details><div class=\"qtext\"><p>The highest Sharpe ratio that Zhou can achieve by combining the Lincoln fund and the Russell 2000 is closest to:<\/p><\/div>","subj":"portfolio"},{"n":77,"q":"With regard to West's question about correlation, Bautista should reply that the risk premium is most likely to be:","opts":["lower due to the negative correlation.","higher due to the negative correlation.","unimpacted by the negative correlation."],"ans":"B","expl":"An asset with value that is negatively correlated to the investor's utility from future consumption provides a poor hedge against bad consumption outcomes. This is because the asset pays off more when the investor's utility is low. Such assets should command a higher risk premium. (Module 39.1, LOS 39.c)","explhtml":"<p>An asset with value that is negatively correlated to the investor&#x27;s utility from future consumption provides a poor hedge against bad consumption outcomes. This is because the asset pays off more when the investor&#x27;s utility is low. Such assets should command a higher risk premium. (Module 39.1, LOS 39.c)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 77–80 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Thomas West is the managing partner at Crystal Advisors, a boutique wealth management firm. West has scheduled a meeting with Ramil Bautista, the firm&#x27;s chief economist.<\/p><p>West asks Bautista about risk premiums on assets; and specifically the impact on the risk premium if an asset&#x27;s future value is negatively correlated with investors&#x27; utility from future consumption. West would also like to learn about the relationship between a country&#x27;s growth rate and the real risk-free rate.<\/p><p>West is meeting with a client to discuss inclusion of actively managed funds in that client&#x27;s portfolio. To prepare for the meeting, West creates a presentation to illustrate the merits and risks of this change. West cannot recall the term that is used to capture the sum of active factor risk and active specific risk (where these two terms refer to variances rather than standard deviations).<\/p><p>West feels that the economy is finally coming out of recession and poised for growth over the next three to five years.<\/p><\/div><\/details><div class=\"qtext\"><p>With regard to West&#x27;s question about correlation, Bautista should reply that the risk premium is most likely to be:<\/p><\/div>","subj":"portfolio"},{"n":78,"q":"For countries with high expected economic growth, it is most likely that:","opts":["real risk-free rates will be low.","the inter-temporal rate of substitution will be low.","investors will save more."],"ans":"B","expl":"For countries with high expected economic growth rates, real rates will be high. Investors will be less concerned about the future, and the inter-temporal rate of substitution will be low. Also, investors will want to increase current consumption and, hence, will borrow more and save less. (Module 39.1, LOS 39.c)","explhtml":"<p>For countries with high expected economic growth rates, real rates will be high. Investors will be less concerned about the future, and the inter-temporal rate of substitution will be low. Also, investors will want to increase current consumption and, hence, will borrow more and save less. (Module 39.1, LOS 39.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 77–80 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Thomas West is the managing partner at Crystal Advisors, a boutique wealth management firm. West has scheduled a meeting with Ramil Bautista, the firm&#x27;s chief economist.<\/p><p>West asks Bautista about risk premiums on assets; and specifically the impact on the risk premium if an asset&#x27;s future value is negatively correlated with investors&#x27; utility from future consumption. West would also like to learn about the relationship between a country&#x27;s growth rate and the real risk-free rate.<\/p><p>West is meeting with a client to discuss inclusion of actively managed funds in that client&#x27;s portfolio. To prepare for the meeting, West creates a presentation to illustrate the merits and risks of this change. West cannot recall the term that is used to capture the sum of active factor risk and active specific risk (where these two terms refer to variances rather than standard deviations).<\/p><p>West feels that the economy is finally coming out of recession and poised for growth over the next three to five years.<\/p><\/div><\/details><div class=\"qtext\"><p>For countries with high expected economic growth, it is most likely that:<\/p><\/div>","subj":"portfolio"},{"n":79,"q":"The term that West cannot recall is most likely:","opts":["active total risk.","active risk squared.","alpha risk."],"ans":"B","expl":"Active risk squared = active factor risk + active specific risk. (Note that the terms in this equation \"active specific risk\" and \"active factor risk\" refer to variances rather than standard deviations.)\n(Module 36.3, LOS 36.g)","explhtml":"<p>Active risk squared = active factor risk + active specific risk. (Note that the terms in this equation &quot;active specific risk&quot; and &quot;active factor risk&quot; refer to variances rather than standard deviations.)<\/p><p>(Module 36.3, LOS 36.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 77–80 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Thomas West is the managing partner at Crystal Advisors, a boutique wealth management firm. West has scheduled a meeting with Ramil Bautista, the firm&#x27;s chief economist.<\/p><p>West asks Bautista about risk premiums on assets; and specifically the impact on the risk premium if an asset&#x27;s future value is negatively correlated with investors&#x27; utility from future consumption. West would also like to learn about the relationship between a country&#x27;s growth rate and the real risk-free rate.<\/p><p>West is meeting with a client to discuss inclusion of actively managed funds in that client&#x27;s portfolio. To prepare for the meeting, West creates a presentation to illustrate the merits and risks of this change. West cannot recall the term that is used to capture the sum of active factor risk and active specific risk (where these two terms refer to variances rather than standard deviations).<\/p><p>West feels that the economy is finally coming out of recession and poised for growth over the next three to five years.<\/p><\/div><\/details><div class=\"qtext\"><p>The term that West cannot recall is most likely:<\/p><\/div>","subj":"portfolio"},{"n":80,"q":"Based on West's economic outlook, it would be most appropriate to conclude that:","opts":["government bonds will outperform corporate bonds.","higher-rated corporate bonds will outperform lower-rated corporate bonds.","lower-rated corporate bonds will outperform higher-rated corporate bonds."],"ans":"C","expl":"Credit spreads tighten during times of economic expansions. During such times, lower-rated bonds outperform higher-rated bonds. (Module 39.1, LOS 39.f)","explhtml":"<p>Credit spreads tighten during times of economic expansions. During such times, lower-rated bonds outperform higher-rated bonds. (Module 39.1, LOS 39.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 77–80 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Thomas West is the managing partner at Crystal Advisors, a boutique wealth management firm. West has scheduled a meeting with Ramil Bautista, the firm&#x27;s chief economist.<\/p><p>West asks Bautista about risk premiums on assets; and specifically the impact on the risk premium if an asset&#x27;s future value is negatively correlated with investors&#x27; utility from future consumption. West would also like to learn about the relationship between a country&#x27;s growth rate and the real risk-free rate.<\/p><p>West is meeting with a client to discuss inclusion of actively managed funds in that client&#x27;s portfolio. To prepare for the meeting, West creates a presentation to illustrate the merits and risks of this change. West cannot recall the term that is used to capture the sum of active factor risk and active specific risk (where these two terms refer to variances rather than standard deviations).<\/p><p>West feels that the economy is finally coming out of recession and poised for growth over the next three to five years.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on West&#x27;s economic outlook, it would be most appropriate to conclude that:<\/p><\/div>","subj":"portfolio"},{"n":81,"q":"Vakil's conversation with Dutt regarding Sandhirst stock is most likely a violation of:","opts":["Standard IV(A) - Duties to Employer: Loyalty.","Standard II(A) - Integrity of Capital Markets: Material Nonpublic Information.","Standard III(C) - Duties to Clients: Suitability."],"ans":"A","expl":"By discussing his research with Dutt, including recommending a specific stock, Vakil violated his duty to his employer by disclosing sensitive business information to outsiders. However, the information is not material nonpublic information and, thus, is not a violation under Standard II(A) – Integrity of Capital Markets: Material Nonpublic Information. (Module 42.3, LOS 42.a)(Module 42.3, LOS 42.b)","explhtml":"<p>By discussing his research with Dutt, including recommending a specific stock, Vakil violated his duty to his employer by disclosing sensitive business information to outsiders. However, the information is not material nonpublic information and, thus, is not a violation under Standard II(A) – Integrity of Capital Markets: Material Nonpublic Information. (Module 42.3, LOS 42.a)(Module 42.3, LOS 42.b)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 81–84 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Paul Vakil, CFA, joined the equity research department of Patarsby and Singly, a brokerage firm. Vakil, with the help of a quant specialist at Patarsby, developed advanced forecasting models based on machine learning algorithms and started using them in his new role. Things turned out very well for Vakil at Patarsby, and clients waited eagerly for release of his monthly recommendations. During a society event, Vakil ran into Alia Dutt, CFA, one of the fund managers who had worked with Vakil at a prior job. Dutt congratulated Vakil. Later in the evening, Vakil spoke to Dutt about one of the companies he is following—Sandhirst, Inc. Vakil stated that his preliminary research indicates that the short-term outlook for Sandhirst is very promising. Dutt also met Neil Savin, Frapco, Inc.&#x27;s controller at the event. Frapco is a national grocery chain. Savin informed Dutt that the new layout in the stores has been a hit, and that he expects revenues and earnings for the current quarter to be well above consensus forecast.<\/p><p>The next day, Dutt placed a large order for Sandhirst stock for her fund. Dutt also placed a large order for a retail ETF. Dutt is a member of an online forum where she discusses investments under a pseudonym. Dutt has formed a very loyal following over time as others realized that her posts were very articulate and, therefore, the work of a professional. Dutt recommended Frapco stock in the forum but attributed the recommendation to a general uptick in grocery store margins nationwide—a known fact based on recent earnings announcements of other grocers. The following week at a charity golf tournament, Vakil met with Bob Snead, his college roommate. Snead was a very successful hedge fund manager. Both of the funds run by Smead were currently closed to new investment, though Snead was considering reopening the investments in the near future. At Vakil&#x27;s insistence, Snead agreed to allow new investments into the two funds using a newly started intermediary fund as long as Vakil is the fund&#x27;s manager. Vakil quickly convinced his bosses at Patarsby to open an intermediary fund and marketed the fund to existing Patarsby clients as a way into Snead hedge funds. Not knowing how long the deal with Snead would hold up, and wanting to quickly ramp up assets under management, Vakil accepted deposits from all Patarsby clients, even some that were relatively new accounts.<\/p><\/div><\/details><div class=\"qtext\"><p>Vakil&#x27;s conversation with Dutt regarding Sandhirst stock is most likely a violation of:<\/p><\/div>","subj":"ethics"},{"n":82,"q":"With regards to investments in Sandhirst stock and retail ETF, Dutt most likely violated:","opts":["Standard II(A) − Material
