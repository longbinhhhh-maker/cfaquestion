rly optimistic projections, or failure to apply\nCapital allocation error\ninvestments proper project analyses\nCapital projects are classified as replacement projects, expansion projects, or introductions of new products and services. All else equal,\ninvestments in new products and services are riskier, so a company would require a higher expected return. This results in a higher discount\nrate for NPV analysis compared with other types of projects. The greater uncertainty of success may mean more difficulty in estimating both the:\ncosts, since the firm has no experience developing the product or service, or acquiring and managing the operations it requires, and\nrevenues, since it is difficult to estimate either the size of the market for a product or service that did not previously exist or the potential\nmarket share for a product introduced amid existing competition.\n(Choice A) Expansion projects enlarge or replicate existing facilities, so the firm could estimate the investment's cost based on experience and\nforecast revenues from existing operations. Therefore, all else equal, expansion projects are less risky, which allows for a lower discount rate.\n(Choice B) Replacement projects replace operating assets to maintain a company's existing size. In general, such projects do not affect revenue\nforecasts, and the firm can base cost estimates on experience; therefore, all else equal, replacement projects are the least risky and use the\nlowest discount rate.\nThings to remember:\nCapital projects are classified as replacement projects, expansion projects, or introductions of new products and services. All else equal,\ninvestments to develop, make, and sell new products and services are riskier than other types of projects and therefore require higher discount\nrates.\nDescribe types of capital investments", "qhtml": null, "explfigs": null}, {"n": 28, "q": "A company invests in Project X in 20X8 and plans to invest in Project Y in 20X9 only if Project X is financially successful. This project interaction is best described as:", "opts": ["capital rationing.", "mutually exclusive.", "project sequencing."], "ans": "C", "expl": "Companies often make choices among possible projects since there are constraints that prevent them from pursuing all net present value (NPV)\npositive projects. Depending on the circumstances, these project interactions include:\nproject sequencing,\ncapital rationing, or\nmutually exclusive projects.\nWith project sequencing, projects are lined up sequentially through time, so that investing in Project X creates the option to invest in Project Y.\nThe decision to invest in Project Y (or other future projects) will be based on the completion and success of Project X. For example, a company\nmay begin delivery services in a new region. Depending on the success of the delivery service, the company will decide whether to build a\ndistribution center in that region.\n(Choice A) Capital rationing is the process of allocating limited resources (at any one time) to the most profitable combination of projects. This\noccurs when a company has more positive NPV projects than its resources will allow it to pursue.\n(Choice B) Mutually exclusive projects are those that compete directly with each other, so only one project can be selected. This is usually due to\na resource constraint.\nThings to remember:\nProject sequencing is the process of lining up projects sequentially through time. A company invests in a project and bases the decision to pursue\nfuture projects on the success of the previous project.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6gAAAH1CAIAAAB0rER/AABNzklEQVR42u3dv47jVpr//0dG2wO4YWyzgJ7IwMyyLmADKd8NpHwSMfYmVLqZdAniJYjJ7qbiJYjBTF4EZi6g9J0BOnIDxV400IHHcP2Cz88PjkmJoqpKV \nbut it not related to project sequencing. The payback period is deemed an inferior criterion to NPV since it does not account for performance over\nthe entire life of the investment.\nThings to remember:\nProject sequencing, capital rationing, or mutual exclusivity are constraints that can prevent companies from pursuing all profitable projects or\nmandate a specific order of project completion. With project sequencing, the ability to undertake one project is contingent on the successful\ncompletion of another.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6gAAAH1CAIAAAB0rER/AABNzklEQVR42u3dv47jVpr//0dG2wO4YWyzgJ7IwMyyLmADKd8NpHwSMfYmVLqZdAniJYjJ7qbiJYjBTF4EZi6g9J0BOnIDxV400IHHcP2Cz88PjkmJoqpKVaqq9yswymqJfw7PQz48POdwcHt7awAAAMBL9xVFAAAAABJfAAAAgMQXAAAAIPEFAAAASHwBAAAAEl8AAACAxBcAAAAg8QUAAABIfAEAAEDiCwAAAJD4AgAAACS+AAAAAIkvAAAAQOILAAAAkPgCAAAAJL4AAAAAiS8AAABA4gsAAAASXwAAAIDEFwAAACDxBQAAAEh8AQAAABJfAAAAgMQXAAAAIPEFAAAASHwBAAAAEl8AAACQ+AIAAAAkvgAAAACJLwAAAEDiC7xIeZ4PjpRlWZZlFN1OVVVVVTWZTBqFps/Pf/u32+12u/XNnkwmk8nkSbakKIqyLMuy7PPly8vLy8vLh93guq7run55Vb0oCpXtvoNOgAMkvgAAAMC5eEMRAHhys9nMzJ5F4+6Zl2Ge55vN5qm2oSxLbUYcx/P5/CWVbZ7nZvaEZQuAxBfAC1HXtf4YDodmdnV19by2P45jM7u9vX2qdFMp77E/vL6+ftgtybJsu916gbwAHWX7tAcdgNHVAQAAANjrFsBD2Gw24WPQ1Wrl/7RarVarlf/Ter1er9ftJURRFEWRmU2n0+l0ent7Ox6Px+Ox2pbiON5sNsPhUG2iMp/P5/P5vk1arVa+TEnT9Pr6+vr6eueXV6tVu6FuPp/v+0m35XLZWPt4PFYp7Su0hvF43L385XLpX9aiptOpf6JibGx82MapJaiEzUxbe3Nz41/WkQoLXMdCZRVujNYSbnlj4/WFcPN0TNuLcldXV1dXV9qLxhHRQfFysP0Nut0HTtvQ3uBGxWtvhpet/2TfNqRpmqZpWA6NRXk5tCtkGE2qnDu3VseocZi0kftKoH1kdfSXy+W+CrazbNvVKVzLzc3Nzc1Nu8uHyqS9YY01Xl1d6Vj7J8PhsBFBAI5Fiy8AAACMPr4AHoDatxaLhZnVda0hXGGjV1EUYT9Xb4O033aBbU84pemTqqpqtJtqXe3JlfI817rUeBwuRz+xXb029RP1uw1bcPfRdrZn1PJpttSYl6bpAxZykiRhGXqpqrQ3m027MVvlE/4k3MF9ZbLdbn0oXtgqaZ2TnY1 : "C", "expl": "A company's management uses the capital allocation process when making capital investment decisions. One important assumption of this\nprocess is that financing costs are ignored when estimating the project cash flows since they are already reflected in the discount rate. The\nappropriate discount rate is the required rate of return, which is:\nthe minimum return an investor will accept when undertaking a project,\na risk-adjusted discount rate, and\nproject-specific, so riskier projects will require a higher rate.\nThe required rate of return is also called the opportunity cost of capital since the company estimates returns of comparable projects and selects\nthe best alternative(s) to invest. All undertaken projects become part of the company's portfolio, which is financed by a mix of equity and\ndebt instruments. Equity investors' required rate of return is defined by this capital structure, adjusted by the risk profile of each project.\nEven for an average-risk project, the cost of debt will always be lower than this required rate of return, which reflects the greater risk to equity\ninvestors (ie, cost of equity). Therefore, discounting the cash flows by the cost of debt underestimates the required return and overestimates\nthe project's NPV.\n(Choice A) Incorrectly estimating overhead costs generated by the project is a common capital allocation mistake. Overestimating overhead\nwould result in an underestimated NPV.\n(Choice B) ROE is a short-run accounting number and should not be included in the investment decision, which should be based on cash flow\nanalysis and focused on the long-term interest of shareholders.\nThings to remember:\nA project's cash flow should be discounted by the proper risk-adjusted discount rate, the required rate of return. Discounting it by only the cost of\ndebt is a mistake that will result in an overestimated NPV.\nDescribe principles of capital allocation and common capital allocation pitfalls", "qhtml": null, " cash flows: If the required rate of return is 15%, the net present value (in CNY millions) is closest to:", "opts": ["Overestimating overhead costs", "Disregarding ROE when analyzing the project", "Using the cost of debt to discount the projected cash flows"], "ans": "C", "expl": "A company's management uses the capital allocation process when making capital investment decisions. One important assumption of this\nprocess is that financing costs are ignored when estimating the project cash flows since they are already reflected in the discount rate. The\nappropriate discount rate is the required rate of return, which is:\nthe minimum return an investor will accept when undertaking a project,\na risk-adjusted discount rate, and\nproject-specific, so riskier projects will require a higher rate.\nThe required rate of return is also called the opportunity cost of capital since the company estimates returns of comparable projects and selects\nthe best alternative(s) to invest. All undertaken projects become part of the company's portfolio, which is financed by a mix of equity and\ndebt instruments. Equity investors' required rate of return is defined by this capital structure, adjusted by the risk profile of each project.\nEven for an average-risk project, the cost of debt will always be lower than this required rate of return, which reflects the greater risk to equity\ninvestors (ie, cost of equity). Therefore, discounting the cash flows by the cost of debt underestimates the required return and overestimates\nthe project's NPV.\n(Choice A) Incorrectly estimating overhead costs generated by the project is a common capital allocation mistake. Overestimating overhead\nwould result in an underestimated NPV.\n(Choice B) ROE is a short-run accounting number and should not be included in the investment decision, which should be based on cash flow\nanalysis and focused on the long-term interest of shareholders.\nThings to remember:\nA project's cash flow should be discounted by is\nprocess is that financing costs are ignored when estimating the project cash flows since they are already reflected in the discount rate. The\nappropriate discount rate is the required rate of return, which is:\nthe minimum return an investor will accept when undertaking a project,\na risk-adjusted discount rate, and\nproject-specific, so riskier projects will require a higher rate.\nThe required rate of return is also called the opportunity cost of capital since the company estimates returns of comparable projects and selects\nthe best alternative(s) to invest. All undertaken projects become part of the company's portfolio, which is financed by a mix of equity and\ndebt instruments. Equity investors' required rate of return is defined by this capital structure, adjusted by the risk profile of each project.\nEven for an average-risk project, the cost of debt will always be lower than this required rate of return, which reflects the greater risk to equity\ninvestors (ie, cost of equity). Therefore, discounting the cash flows by the cost of debt underestimates the required return and overestimates\nthe project's NPV.\n(Choice A) Incorrectly estimating overhead costs generated by the project is a common capital allocation mistake. Overestimating overhead\nwould result in an underestimated NPV.\n(Choice B) ROE is a short-run accounting number and should not be included in the investment decision, which should be based on cash flow\nanalysis and focused on the long-term interest of shareholders.\nThings to remember:\nA project's cash flow should be discounted by the proper risk-adjusted discount rate, the required rate of return. Discounting it by only the cost of\ndebt is a mistake that will result in an overestimated NPV.\nDescribe principles of capital allocation and common capital allocation pitfalls", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABB0AAANJCAIAAADP39OmAAD8bElEQVR42uz9bWyVZ3rvDR/sPaPdzr2HtebZU92aPsJrhbYf2sTYrmZLnSTGy0qq roduction facility can be calculated as follows:\nProduction facility's NPV = NPV without option − Cost of option + Value of option\n= 30 million − 10 million + 20 million\n= SEK 40 million\n(Choice A) SEK 20 million results from considering only the project's initial NPV and the option cost. When calculating total project value, the\noption value should also be considered.\n(Choice B) SEK 30 million results from incorrectly multiplying the option value by the probability of demand rising (ie, probability of the option\nbeing exercised).\nThings to remember:\nWhen evaluating investment projects, management should consider whether any real options are embedded in or linked to a project, as well as\nthe value of the option(s). The investment decision will then be based on total project NPV, which considers both the cost and the value of the\noption(s).\nDescribe types of real options relevant to capital investments", "qhtml": "<p>A company considers whether it should increase its production capacity based on a 50% probability that export restrictions will be lifted and demand will increase. Managers gather the following data (in SEK millions):<\/p><img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAtcAAACjCAIAAADOwKX0AAANF0lEQVR42u3d27KjKhAAUJPK//9yzsOek0oZxQYaL8laT1MZtwIitIh4ez6fEwDA7u6KAAAQhQAAohAAAFEIACAKAQAQhQAAohAAAFEIACAKAQAQhQAAohAAgH8e6Xu83W6zX3yq5livM7Lzifg77rFn/702jkjJZx4jvxxyihe3+bxay1duVV06QwUA0lvs3D7lMTT++MrG6Ha7aVgvUSzlLlZxNbRKz+czWKpnLnxg7VItRxiLG3c2ZY/RN52v37+j89a2XqVYjhoBOra42q6ywpjH2j6DBxKvw1Wa7r+rtdA6zRrVrHbsnt7iz9qd91904T/lszL8Zh53LoeUq+z5v7Z9utLhou3Y2lX/eV/3+qvO6/3+3TedQHqDlb4lMJ1mULZw5Y64qB/TXi1X8HnSZ0zz2rLqv+LzE99TUth4NkYdnAy4udusXFTFhfHCjz9xWxuv23y4GElkW/YLmZ1tE5nUWT53wdkVa8UVKavIoMvfxolPPwsTQUyQgi+4o4iMZGxu09MaPHa7Q+pssAoPqtf+67Pgyn3GiHk3i2nY7Jibc7E2hpaeheaSadhb7nlZLJNIpHLsPOvgQUcEIuZOgdHNhhuVnaKQPVucqmGiwnuJa7PtCo/EIvf3kZSXe4jOXKyNFaVPOn5PQFWx1J6UyHnZDPAXA9bNt1U3M95/89E85fPwkCLS7hgmgcnbBtMXrVrW9qTqc6psuW0Nbtmc8s0oZ1Aucudg const CFG = {"title": "Wiley · Capital Investments and Capital Allocation", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Corporate Issuers · 33 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      if(q.explfigs){q.explfigs.forEach(function(u){var im=document.createElement("img");im.className="qfig";im.src=u;im.alt="exhibit";e.appendChild(im);});}
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<!--qnote-feature-start-->
<style id="qnote-css">
  main#quiz{max-width:1180px}
  .qrow{display:flex;gap:16px;align-items:flex-start;margin:0 0 16px}
  .qrow > .card{flex:1 1 auto;min-width:0;margin:0}
  .qnote{flex:0 0 300px;align-self:stretch;display:flex;flex-direction:column;
    border-radius:12px;border:1px solid var(--line);
    background:color-mix(in srgb, var(--pin) 9%, var(--panel2));padding:10px}
  .qnote-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;
    font-size:12.5px;font-weight:600;color:var(--muted)}
  .qnote-head .dot{color:var(--pin)}
  .qnote-saved{margin-left:auto;font-size:11.5px;color:var(--ok);opacity:0;
    transition:opacity .25s}
  .qnote-saved.show{opacity:1}
  .qnote textarea{flex:1 1 auto;width:100%;resize:vertical;min-height:96px;display:block;
    font:inherit;font-size:14px;line-height:1.5;color:var(--txt);
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;outline:none}
  .qnote textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 1.5px var(--accent) inset}
  .qnote textarea::placeholder{color:var(--muted);opacity:.7}
  @media (max-width:860px){
    .qrow{flex-direction:column;gap:10px}
    .qnote{flex-basis:auto;width:100%;align-self:auto}
    .qnote textarea{min-height:52px}
  }
</style>
<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnote-feature-end-->
</body>
</html>
