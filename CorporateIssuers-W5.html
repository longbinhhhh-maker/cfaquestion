timates of overhead cost\nMisuse or overuse of allocation templates\nFavoring IRR for investments with uneven cash flows\nProcess deficiencies\nIncluding sunk costs\nIgnoring opportunity costs\nFailing to capture competitor response to investments\nLack of scrutiny around pet projects\nFlawed managerial decision-making Reliance on short-term metrics (ie, EPS, ROE)\nOverspending or underspending allocation budgets\nFailing to consider investment alternatives\nThe general principles of capital allocation (ie, investment decision-making) are often very difficult to apply since:\nsome decisions are subjective, requiring a manager's judgment, and\ncertain risks may be hard to capture in capital allocation models.\nA robust capital allocation process does not include sunk costs (ie, unrecoverable costs incurred in the past). Only costs that directly affect or are\naffected by the investment decision should be considered; therefore, sunk costs should be disregarded.\n(Choice B) Focusing on ROE instead of NPV may not lead to investments that improve long-term shareholder wealth. Often, companies focus\non ROE to boost short-term performance; investments with large NPVs may take time to become profitable and would not improve short-term\nperformance.\n(Choice C) Investment allocation templates might improve efficiency in the decision-making process, but the characteristics of investment\nopportunities that do not fit into the standardized template may be inadvertently ignored. Instead of quick turnaround, a strong capital allocation\nprocess should focus primarily on properly capturing investment characteristics.\nThings to remember:\nThere are several common pitfalls that companies may face when making investment decisions. Investment analysts should disregard sunk\ncosts, avoid relying on allocation templates, and focus on NPV instead of metrics like ROE, which typically has a short-term focus.\nDescribe principles of capital allocation and common capital allocation pitfalls", "qhtml": null}, {"n": 24, "q": "A company has spent $2 million on market research to determine whether to sell or renovate an existing building. If the company sells the building, it will receive $500 million today. If the company renovates the building, it will have to invest $100 million immediately. The company also will have to borrow the $100 million at a 6% annual interest rate. If the company decides to renovate, the project's initial cash outlay ($ millions) is closest to: ", "opts": ["600", "602", "606"], "ans": "A", "expl": "Cash flows $ in millions Include in cash flow?\nMarket research 2 No, sunk cost\nOpportunity cost of not selling building 500 Yes, opportunity cost\nRenovation costs 100 Yes, initial investment\nInterest cost on loan 6 No, financing cost\nCapital budgeting is the process companies use to select the most profitable capital projects; projected cash flows are useful for evaluating\neach potential project. Capital projects usually involve an initial cash outlay followed by a series of cash inflows. In addition to direct inflows and\noutflows, opportunity costs should be considered when estimating a project's cash flows.\nIn this scenario, if the company uses the building instead of selling it, the sale offer represents opportunity cost. This cost should be included in\nthe net cash flow for Year 0 along with the renovation costs, resulting in an initial cash outlay of $600 million ($500 million + $100 million).\n(Choice B) $602 million includes the market research, a sunk cost that is irrelevant to future investment decisions.\n(Choice C) $606 million includes the interest cost for the loan. Financing costs are not included in cash flows since they are implicitly reflected in\nthe required rate of return.\nThings to remember:\nIn capital budgeting, some cash flows that are not directly part of a project represent an opportunity cost and should be included in the investment\ndecision. Sunk costs are not relevant to the investment decision. Financing costs are not included in cash flows since they are implicit in the\nrequired rate of return.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null}, {"n": 25, "q": "A corporation is investing in a three-year project that generates the following after-tax cash flows: Year 0 1 2 3 Cash flow (€) −20,000 10,000 15,000 17,000 If the weighted average cost of capital (WACC) is 10%, the net present value (NPV) is closest to: ", "opts": ["Project A", "Project B", "Project C"], "ans": "C", "expl": "Capital rationing is the process of allocating limited funds to the most profitable project(s). When projects are mutually exclusive, only one\nproject can be selected. Net present value (NPV) is the best profitability indicator for project selection. NPV is calculated as the sum of the\nproject's discounted cash flows minus the initial outlay. Positive NPV is the best measure of profitability; therefore, the manager should choose\nProject C.\nThe internal rate of return (IRR) is another commonly used measure of profitability. IRR is the discount rate that equates the present value of the\nfuture cash flows to the initial outlay, effectively causing NPV to be zero. Project A has the highest IRR, but it is not the optimal selection (Choice\nA).\nNPV is better than the IRR due to more conservative reinvestment assumptions. NPV assumes reinvestment of cash flows at the weighted\naverage cost of capital, which is frequently lower than the IRR. Furthermore, NPV is preferred since gains are measured in currency amounts, not\nin percentage terms.\n(Choice B) The discounted payback period is a measure of liquidity. The drawback to liquidity measures is that they consider how quickly an\ninvestment can be recovered but fail to consider the profitability of the investment. Project B has the lowest (best) discounted payback period, yet\nit has the worst profitability as indicated by both NPV and IRR.\nThings to remember:\nWhen projects are mutually exclusive, select the project with the highest net present value (NPV). NPV is the best metric for determining the most\nprofitable project.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null}, {"n": 26, "q": "A finance manager collects the following data on three projects: The weighted average cost of capital is 11%. The company has limited capital and the projects are mutually exclusive. Which project is the company's best choice?", "opts": ["Project A", "Project B", "Project C"], "ans": "C", "expl": "Capital rationing is the process of allocating limited funds to the most profitable project(s). When projects are mutually exclusive, only one\nproject can be selected. Net present value (NPV) is the best profitability indicator for project selection. NPV is calculated as the sum of the\nproject's discounted cash flows minus the initial outlay. Positive NPV is the best measure of profitability; therefore, the manager should choose\nProject C.\nThe internal rate of return (IRR) is another commonly used measure of profitability. IRR is the discount rate that equates the present value of the\nfuture cash flows to the initial outlay, effectively causing NPV to be zero. Project A has the highest IRR, but it is not the optimal selection (Choice\nA).\nNPV is better than the IRR due to more conservative reinvestment assumptions. NPV assumes reinvestment of cash flows at the weighted\naverage cost of capital, which is frequently lower than the IRR. Furthermore, NPV is preferred since gains are measured in currency amounts, not\nin percentage terms.\n(Choice B) The discounted payback period is a measure of liquidity. The drawback to liquidity measures is that they consider how quickly an\ninvestment can be recovered but fail to consider the profitability of the investment. Project B has the lowest (best) discounted payback period, yet\nit has the worst profitability as indicated by both NPV and IRR.\nThings to remember:\nWhen projects are mutually exclusive, select the project with the highest net present value (NPV). NPV is the best metric for determining the most\nprofitable project.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null}, {"n": 27, "q": "All else equal, the net present value (NPV) analysis for which of the following types of projects correctly uses the highest discount rate?", "opts": ["Expansion projects", "Replacement projects", "New products and services"], "ans": "C", "expl": "Categories of capital projects\nRationale Decision considerations\nMost accurate cash flow projections, greatest\nReplacement Worn, broken, or inefficient assets\ncertainty of decisions\nGreater uncertainties over cost and revenues\nExpansion Add capacity for existing products\ncompared with replacement projects\nNew products and Research and development, and investment in Greater uncertainties than expansion projects,\nservices products not yet offered by the company most complex investment decisions\nRegulatory, safety, and Driven by external party (eg, government, insurance Necessary to stay in business, not directly profit-\nenvironmental company) driven like other categories\nPet projects or high-risk Overly optimistic projections, or failure to apply\nCapital allocation error\ninvestments proper project analyses\nCapital projects are classified as replacement projects, expansion projects, or introductions of new products and services. All else equal,\ninvestments in new products and services are riskier, so a company would require a higher expected return. This results in a higher discount\nrate for NPV analysis compared with other types of projects. The greater uncertainty of success may mean more difficulty in estimating both the:\ncosts, since the firm has no experience developing the product or service, or acquiring and managing the operations it requires, and\nrevenues, since it is difficult to estimate either the size of the market for a product or service that did not previously exist or the potential\nmarket share for a product introduced amid existing competition.\n(Choice A) Expansion projects enlarge or replicate existing facilities, so the firm could estimate the investment's cost based on experience and\nforecast revenues from existing operations. Therefore, all else equal, expansion projects are less risky, which allows for a lower discount rate.\n(Choice B) Replacement projects replace operating assets to maintain a company's existing size. In general, such projects do not affect revenue\nforecasts, and the firm can base cost estimates on experience; therefore, all else equal, replacement projects are the least risky and use the\nlowest discount rate.\nThings to remember:\nCapital projects are classified as replacement projects, expansion projects, or introductions of new products and services. All else equal,\ninvestments to develop, make, and sell new products and services are riskier than other types of projects and therefore require higher discount\nrates.\nDescribe types of capital investments", "qhtml": null}, {"n": 28, "q": "A company invests in Project X in 20X8 and plans to invest in Project Y in 20X9 only if Project X is financially successful. This project interaction is best described as:", "opts": ["capital rationing.", "mutually exclusive.", "project sequencing."], "ans": "C", "expl": "Companies often make choices among possible projects since there are constraints that prevent them from pursuing all net present value (NPV)\npositive projects. Depending on the circumstances, these project interactions include:\nproject sequencing,\ncapital rationing, or\nmutually exclusive projects.\nWith project sequencing, projects are lined up sequentially through time, so that investing in Project X creates the option to invest in Project Y.\nThe decision to invest in Project Y (or other future projects) will be based on the completion and success of Project X. For example, a company\nmay begin delivery services in a new region. Depending on the success of the delivery service, the company will decide whether to build a\ndistribution center in that region.\n(Choice A) Capital rationing is the process of allocating limited resources (at any one time) to the most profitable combination of projects. This\noccurs when a company has more positive NPV projects than its resources will allow it to pursue.\n(Choice B) Mutually exclusive projects are those that compete directly with each other, so only one project can be selected. This is usually due to\na resource constraint.\nThings to remember:\nProject sequencing is the process of lining up projects sequentially through time. A company invests in a project and bases the decision to pursue\nfuture projects on the success of the previous project.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null}, {"n": 29, "q": "In capital budget decisions, which of the following best describes a project sequencing interaction?", "opts": ["Ranking investment selections based on projects' net present values", "Choosing projects with shorter payback periods to speed reinvestment of capital", "Investing in a project today to create the option to invest in another, future projects"], "ans": "C", "expl": "Companies regularly evaluate the potential profitability of projects based on their expected cash flows. With no constraints, companies could take\non every project that has a positive net present value (NPV). However, companies are often forced to make choices since constraints prevent\nthem from pursuing all profitable projects or can mandate a specific order of project completion. Depending on the circumstances, these project\ninteractions include:\nproject sequencing,\ncapital rationing, and\nmutually exclusive projects.\nWith project sequencing, the ability to undertake one project is dependent on the completion of another. For example, the successful\ncompletion of one project may create the option to invest in future contingent projects, assuming favorable economic conditions at that time.\n(Choice A) Ordering investment selections based on projects' net present values is a common criterion for making investment decisions but is not\nrelated to project sequencing.\n(Choice B) Choosing projects with shorter payback periods to speed the reinvestment of funds is one criterion for making investment decisions,\nbut it not related to project sequencing. The payback period is deemed an inferior criterion to NPV since it does not account for performance over\nthe entire life of the investment.\nThings to remember:\nProject sequencing, capital rationing, or mutual exclusivity are constraints that can prevent companies from pursuing all profitable projects or\nmandate a specific order of project completion. With project sequencing, the ability to undertake one project is contingent on the successful\ncompletion of another.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null}, {"n": 30, "q": "A company is evaluating the production of a new product that requires an initial outlay of CHF 1 billion. The product is expected to produce after-tax cash flows of CHF 250 million for six years. The company anticipates that the new product will reduce existing product sales, net of variable costs, by CHF 50 million each year the new product is sold. Based on only this information, the project's IRR is closest to:", "opts": ["Overestimating overhead costs", "Disregarding ROE when analyzing the project", "Using the cost of debt to discount the projected cash flows"], "ans": "C", "expl": "A company's management uses the capital allocation process when making capital investment decisions. One important assumption of this\nprocess is that financing costs are ignored when estimating the project cash flows since they are already reflected in the discount rate. The\nappropriate discount rate is the required rate of return, which is:\nthe minimum return an investor will accept when undertaking a project,\na risk-adjusted discount rate, and\nproject-specific, so riskier projects will require a higher rate.\nThe required rate of return is also called the opportunity cost of capital since the company estimates returns of comparable projects and selects\nthe best alternative(s) to invest. All undertaken projects become part of the company's portfolio, which is financed by a mix of equity and\ndebt instruments. Equity investors' required rate of return is defined by this capital structure, adjusted by the risk profile of each project.\nEven for an average-risk project, the cost of debt will always be lower than this required rate of return, which reflects the greater risk to equity\ninvestors (ie, cost of equity). Therefore, discounting the cash flows by the cost of debt underestimates the required return and overestimates\nthe project's NPV.\n(Choice A) Incorrectly estimating overhead costs generated by the project is a common capital allocation mistake. Overestimating overhead\nwould result in an underestimated NPV.\n(Choice B) ROE is a short-run accounting number and should not be included in the investment decision, which should be based on cash flow\nanalysis and focused on the long-term interest of shareholders.\nThings to remember:\nA project's cash flow should be discounted by the proper risk-adjusted discount rate, the required rate of return. Discounting it by only the cost of\ndebt is a mistake that will result in an overestimated NPV.\nDescribe principles of capital allocation and common capital allocation pitfalls", "qhtml": null}, {"n": 31, "q": "A project with an initial investment of CNY 7.0 million generates the following after-tax cash flows: If the required rate of return is 15%, the net present value (in CNY millions) is closest to: ", "opts": ["Overestimating overhead costs", "Disregarding ROE when analyzing the project", "Using the cost of debt to discount the projected cash flows"], "ans": "C", "expl": "A company's management uses the capital allocation process when making capital investment decisions. One important assumption of this\nprocess is that financing costs are ignored when estimating the project cash flows since they are already reflected in the discount rate. The\nappropriate discount rate is the required rate of return, which is:\nthe minimum return an investor will accept when undertaking a project,\na risk-adjusted discount rate, and\nproject-specific, so riskier projects will require a higher rate.\nThe required rate of return is also called the opportunity cost of capital since the company estimates returns of comparable projects and selects\nthe best alternative(s) to invest. All undertaken projects become part of the company's portfolio, which is financed by a mix of equity and\ndebt instruments. Equity investors' required rate of return is defined by this capital structure, adjusted by the risk profile of each project.\nEven for an average-risk project, the cost of debt will always be lower than this required rate of return, which reflects the greater risk to equity\ninvestors (ie, cost of equity). Therefore, discounting the cash flows by the cost of debt underestimates the required return and overestimates\nthe project's NPV.\n(Choice A) Incorrectly estimating overhead costs generated by the project is a common capital allocation mistake. Overestimating overhead\nwould result in an underestimated NPV.\n(Choice B) ROE is a short-run accounting number and should not be included in the investment decision, which should be based on cash flow\nanalysis and focused on the long-term interest of shareholders.\nThings to remember:\nA project's cash flow should be discounted by the proper risk-adjusted discount rate, the required rate of return. Discounting it by only the cost of\ndebt is a mistake that will result in an overestimated NPV.\nDescribe principles of capital allocation and common capital allocation pitfalls", "qhtml": null}, {"n": 32, "q": "A company undertakes an average-risk project, which is 100% financed with debt and generates relevant overhead costs. One year later, the CFO realizes that the project's NPV had been significantly overestimated. Which of the following capital allocation mistakes would most appropriately explain this overestimation?", "opts": ["Overestimating overhead costs", "Disregarding ROE when analyzing the project", "Using the cost of debt to discount the projected cash flows"], "ans": "C", "expl": "A company's management uses the capital allocation process when making capital investment decisions. One important assumption of this\nprocess is that financing costs are ignored when estimating the project cash flows since they are already reflected in the discount rate. The\nappropriate discount rate is the required rate of return, which is:\nthe minimum return an investor will accept when undertaking a project,\na risk-adjusted discount rate, and\nproject-specific, so riskier projects will require a higher rate.\nThe required rate of return is also called the opportunity cost of capital since the company estimates returns of comparable projects and selects\nthe best alternative(s) to invest. All undertaken projects become part of the company's portfolio, which is financed by a mix of equity and\ndebt instruments. Equity investors' required rate of return is defined by this capital structure, adjusted by the risk profile of each project.\nEven for an average-risk project, the cost of debt will always be lower than this required rate of return, which reflects the greater risk to equity\ninvestors (ie, cost of equity). Therefore, discounting the cash flows by the cost of debt underestimates the required return and overestimates\nthe project's NPV.\n(Choice A) Incorrectly estimating overhead costs generated by the project is a common capital allocation mistake. Overestimating overhead\nwould result in an underestimated NPV.\n(Choice B) ROE is a short-run accounting number and should not be included in the investment decision, which should be based on cash flow\nanalysis and focused on the long-term interest of shareholders.\nThings to remember:\nA project's cash flow should be discounted by the proper risk-adjusted discount rate, the required rate of return. Discounting it by only the cost of\ndebt is a mistake that will result in an overestimated NPV.\nDescribe principles of capital allocation and common capital allocation pitfalls", "qhtml": null}, {"n": 33, "q": "A company considers whether it should increase its production capacity based on a 50% probability that export restrictions will be lifted and demand will increase. Managers gather the following data (in SEK millions): Current production facility NPV 30 Cost of license to expand production facility 10 Value of option to expand 20 The value of the production facility with the option (in SEK millions) is closest to:", "opts": ["20", "30", "40"], "ans": "C", "expl": "Real option classifications\nReal option type Flexibility offered to:\nTiming Delay an investment decision until more information becomes available (eg, project sequencing)\nFundamental Undertake projects only when fundamentals of underlying asset are favorable (eg, oil refineries)\nAbandon a project (ie, abandonment option)\nSizing\nExpand (ie, growth option)\nPrice-setting Increase prices with demand\nChange output volume\nProduction-flexibility Use alternative input\nProduce different output\nA real option arises during normal business activities or operations when management has some flexibility in the investment decision process.\nWhen evaluating investment projects, management should consider whether any real options are embedded in or linked to a project and the\nvalue they add to the project.\nA production-flexibility option allows management to alter production to manage demand-supply mismatches. It offers flexibility to:\nuse alternative inputs,\nchange output volume, and\nproduce different outputs.\nIn this scenario, the option gives the firm flexibility to increase production as demand increases. The option value takes into account that the\noption will be exercised only under favorable conditions and reflects the probability of those conditions. Firms typically use the NPV criterion to\nevaluate a capital investment with a real option. The NPV of the production facility can be calculated as follows:\nProduction facility's NPV = NPV without option − Cost of option + Value of option\n= 30 million − 10 million + 20 million\n= SEK 40 million\n(Choice A) SEK 20 million results from considering only the project's initial NPV and the option cost. When calculating total project value, the\noption value should also be considered.\n(Choice B) SEK 30 million results from incorrectly multiplying the option value by the probability of demand rising (ie, probability of the option\nbeing exercised).\nThings to remember:\nWhen evaluating investment projects, management should consider whether any real options are embedded in or linked to a project, as well as\nthe value of the option(s). The investment decision will then be based on total project NPV, which considers both the cost and the value of the\noption(s).\nDescribe types of real options relevant to capital investments", "qhtml": null}];
const CFG = {"title": "Wiley · Capital Investments and Capital Allocation", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Corporate Issuers · 33 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
