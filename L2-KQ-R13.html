<script>
const DATA = [{"n": 1, "q": "A periodic payment to shareholders in the form of additional shares of stock instead of cash is a:", "opts": ["stock repurchase", "dividend reinvestment plan", "stock dividend"], "ans": "C", "expl": "Stock dividends are dividends paid out in new shares of stock instead of cash. Unlike stock dividends, dividend reinvestment plans are at the discretion of individual shareholders. In the case of stock repurchases, the company is buying back shares so the number of shares in the investment public's hands is declining.", "explhtml": "<p>Stock dividends are dividends paid out in new shares of stock instead of cash. Unlike stock dividends, dividend reinvestment plans are at the discretion of individual shareholders. In the case of stock repurchases, the company is buying back shares so the number of shares in the investment public&#x27;s hands is declining.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.1, LOS 13.a<\/div><div class=\"qtext\"><p>A periodic payment to shareholders in the form of additional shares of stock instead of cash is a:<\/p><\/div>", "subj": "corporate"}, {"n": 2, "q": "Stock splits:", "opts": ["increase firm value.", "do not in and of themselves affect firm value.", "are less common than stock dividends."], "ans": "B", "expl": "Stock splits divide up each existing share into multiple shares. The price of each share will drop correspondingly to the number of shares created, so there is no change in the owner's wealth. Empirical research has shown that in the absence of a dividend yield increase, the stock price falls to the stock split ratio of the original price (i.e., to 25% of the original price in a 4-for-1 stock split). This makes sense, given that the investor's percentage ownership of the company has not changed.", "explhtml": "<p>Stock splits divide up each existing share into multiple shares. The price of each share will drop correspondingly to the number of shares created, so there is no change in the owner&#x27;s wealth. Empirical research has shown that in the absence of a dividend yield increase, the stock price falls to the stock split ratio of the original price (i.e., to 25% of the original price in a 4-for-1 stock split). This makes sense, given that the investor&#x27;s percentage ownership of the company has not changed.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.1, LOS 13.a<\/div><div class=\"qtext\"><p>Stock splits:<\/p><\/div>", "subj": "corporate"}, {"n": 3, "q": "Laura's Chocolates Inc. (LC) is a maker of nut-based toffees. LC is considering a cash dividend, but is concerned about the \"double taxation\" effect on their shareholders. If the corporate tax rate is 35%, and the tax on dividends is 20%, what is the effective tax rate on a dollar of corporate earnings?", "opts": ["42%.", "55%.", "48%."], "ans": "C", "expl": "0.35 + (1 − 0.35)(0.20) = 48%", "explhtml": "<p>0.35 + (1 − 0.35)(0.20) = 48%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.1, LOS 13.f<\/div><div class=\"qtext\"><p>Laura&#x27;s Chocolates Inc. (LC) is a maker of nut-based toffees. LC is considering a cash dividend, but is concerned about the &quot;double taxation&quot; effect on their shareholders. If the corporate tax rate is 35%, and the tax on dividends is 20%, what is the effective tax rate on a dollar of corporate earnings?<\/p><\/div>", "subj": "corporate"}, {"n": 4, "q": "Sinclair Construction Company's Board of Directors is considering repurchasing $30,000,000 worth of common stock. Sinclair assumes that the stock can be repurchased at the market price of $50 per share. After much discussion Sinclair decides to borrow $30 million that it will use to repurchase shares. Sinclair's Chief Executive Officer (CEO) has compiled the following information regarding the repurchase of the firm's common stock: Share price at the time of buyback = $50 Shares outstanding before buyback = 30,600,000 EPS before buyback = $3.33 Earnings yield = $3.33 / $50 = 6.7% After-tax cost of borrowing = 8.0% Planned buyback = 600,000 shares Based on the information above, Sinclair's earnings per share (EPS) after the repurchase of its common stock will be closest to:", "opts": ["$3.32.", "$3.23.", "$3.18."], "ans": "A", "expl": "Total earnings = $3.33 × 30,600,000 = $101,898,000 total earnings - after-tax cost of funds EPS after buyback = shares outstanding after buyback $101,898,000  - (600,000 shares x  $50 x  0.08) = (30,600,000 - 600,000) shares $101,898,000 -  $2,400,000 = 30,000,000 shares $99,498,000 = 30,000,000 shares = $3.32 Since the 8.0% after-tax cost of borrowing is greater than the 6.7% earnings yield (E/P) of the shares, the share repurchase reduces Sinclair's EPS.", "explhtml": "<p>Total earnings = $3.33 × 30,600,000 = $101,898,000<\/p><p>total earnings - after-tax cost of funds<\/p><p>EPS after buyback =<\/p><p>shares outstanding after buyback<\/p><p>$101,898,000  - (600,000 shares x  $50 x  0.08)<\/p><p>=<\/p><p>(30,600,000 - 600,000) shares<\/p><p>$101,898,000 -  $2,400,000<\/p><p>=<\/p><p>30,000,000 shares<\/p><p>$99,498,000<\/p><p>=<\/p><p>30,000,000 shares<\/p><p>= $3.32<\/p><p>Since the 8.0% after-tax cost of borrowing is greater than the 6.7% earnings yield (E/P) of the shares, the share repurchase reduces Sinclair&#x27;s EPS.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.2, LOS 13.j<\/div><div class=\"qtext\"><p>Sinclair Construction Company&#x27;s Board of Directors is considering repurchasing $30,000,000 worth of common stock. Sinclair assumes that the stock can be repurchased at the market price of $50 per share. After much discussion Sinclair decides to borrow $30 million that it will use to repurchase shares. Sinclair&#x27;s Chief Executive Officer (CEO) has compiled the following information regarding the repurchase of the firm&#x27;s common stock:<\/p><p>Share price at the time of buyback = $50 Shares outstanding before buyback = 30,600,000 EPS before buyback = $3.33 Earnings yield = $3.33 / $50 = 6.7% After-tax cost of borrowing = 8.0% Planned buyback = 600,000 shares<\/p><p>Based on the information above, Sinclair&#x27;s earnings per share (EPS) after the repurchase of its common stock will be closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 5, "q": "Financial managers utilize stock splits and stock dividends because they perceive that:", "opts": ["an optimal trading range exists.", "investors will double the share price if there is a 20% stock dividend.", "brokerage fees paid by shareholders will be reduced."], "ans": "A", "expl": "Although there is little empirical evidence to support the contention, there is nevertheless a widespread belief in financial circles that an optimal price range exists for stocks. \"Optimal\" means that if the price is within this range, the price/earnings ratio, price/sales and other relevant ratios will be maximized. Hence, the value of the firm will be maximized.", "explhtml": "<p>Although there is little empirical evidence to support the contention, there is nevertheless a widespread belief in financial circles that an optimal price range exists for stocks. &quot;Optimal&quot; means that if the price is within this range, the price/earnings ratio, price/sales and other relevant ratios will be maximized. Hence, the value of the firm will be maximized.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.1, LOS 13.a<\/div><div class=\"qtext\"><p>Financial managers utilize stock splits and stock dividends because they perceive that:<\/p><\/div>", "subj": "corporate"}, {"n": 6, "q": "Which of the following statements about a stock repurchase is least accurate?", "opts": ["Disgruntled stockholders are forced to sell their shares, improving management's position.", "A stock repurchase occurs when a large block of stock is removed from the marketplace.", "Management can distribute cash to shareholders at a favorable after-tax rate."], "ans": "A", "expl": "A repurchase gives stockholders a choice. They can sell or not sell. Stock repurchase is also more tax-efficient as only those shareholders that choose to sell their shares would potentially have a tax liability.", "explhtml": "<p>A repurchase gives stockholders a choice. They can sell or not sell. Stock repurchase is also more tax-efficient as only those shareholders that choose to sell their shares would potentially have a tax liability.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.2, LOS 13.i<\/div><div class=\"qtext\"><p>Which of the following statements about a stock repurchase is least accurate?<\/p><\/div>", "subj": "corporate"}, {"n": 7, "q": "When a firm pays a cash dividend, the dividend payment is most likely to:", "opts": ["cause financial leverage ratios to increase.", "cause liquidity ratios to increase.", "have no impact on financial leverage ratios and liquidity ratios."], "ans": "A", "expl": "All else equal, the result of a cash dividend is that financial leverage ratios (such as the debt-to-equity ratio) should increase, while liquidity ratios (such as the cash ratio) should decrease. Cash dividends reduce assets (as cash is paid out) and reduce shareholders' equity (by lowering retained earnings). (Stock dividends, on the other hand, do not impact liquidity ratios or financial leverage ratios.)", "explhtml": "<p>All else equal, the result of a cash dividend is that financial leverage ratios (such as the debt-to-equity ratio) should increase, while liquidity ratios (such as the cash ratio) should decrease. Cash dividends reduce assets (as cash is paid out) and reduce shareholders&#x27; equity (by lowering retained earnings). (Stock dividends, on the other hand, do not impact liquidity ratios or financial leverage ratios.)<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.1, LOS 13.a<\/div><div class=\"qtext\"><p>When a firm pays a cash dividend, the dividend payment is most likely to:<\/p><\/div>", "subj": "corporate"}, {"n": 8, "q": "Paying a cash dividend is most likely to result in:", "opts": ["the same impact on liquidity and leverage ratios as a stock dividend.", "an increase in financial leverage ratios.", "an increase in liquidity ratios."], "ans": "B", "expl": "A cash dividend will increase leverage ratios such as debt-to-equity and debt-to-assets, reflecting a decrease in the denominator. A cash dividend should decrease liquidity ratios such as the current ratio and cash ratio, due to the decrease in cash in the numerator. Unlike a cash dividend, a stock dividend or a stock split has no impact on liquidity or financial leverage ratios.", "explhtml": "<p>A cash dividend will increase leverage ratios such as debt-to-equity and debt-to-assets, reflecting a decrease in the denominator. A cash dividend should decrease liquidity ratios such as the current ratio and cash ratio, due to the decrease in cash in the numerator. Unlike a cash dividend, a stock dividend or a stock split has no impact on liquidity or financial leverage ratios.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.1, LOS 13.a<\/div><div class=\"qtext\"><p>Paying a cash dividend is most likely to result in:<\/p><\/div>", "subj": "corporate"}, {"n": 9, "q": "Which of the following statements about a stock repurchase is least accurate?", "opts": ["A stock repurchase occurs when a large block of stock is removed from the marketplace.", "Management can distribute cash to shareholders at a favorable after-tax rate.", "Disgruntled stockholders are forced to sell their shares, improving management's position."], "ans": "C", "expl": "A repurchase gives stockholders a choice. They can sell or not sell. Stock repurchase is also more tax-efficient as only those shareholders that choose to sell their shares would potentially have a tax liability.", "explhtml": "<p>A repurchase gives stockholders a choice. They can sell or not sell. Stock repurchase is also more tax-efficient as only those shareholders that choose to sell their shares would potentially have a tax liability.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.2, LOS 13.l<\/div><div class=\"qtext\"><p>Which of the following statements about a stock repurchase is least accurate?<\/p><\/div>", "subj": "corporate"}, {"n": 10, "q": "Jim Davis and Thurgood Owen, two equity analysts at Ferguson Capital Management, were reviewing the financial statements of Peregrine Foodstuffs Ltd. Davis and Owen noticed that Peregrine has been repurchasing its common shares in the market over the past three years. Owen thought this was an important issue to look into in greater detail. Upon completion of his review, Owen made the following two statements: Peregrine has bought back shares in the open market during its repurchase Statement 1  program. This method of repurchase gave the company the flexibility to choose the timing of the transaction. Peregrine plans to buy back shares by making tender offers during the Statement 2  coming year. By making tender offers, the company will be able to repurchase shares at a discount to the prevailing market price. With respect to Owen's statements:", "opts": ["both are incorrect.", "only one is correct.", "both are correct."], "ans": "B", "expl": "Buying in the open market gives the company the flexibility to choose the timing of the transaction. Thus, Statement 1 is correct. A second way is to buy a fixed number of shares at a fixed price. A company may repurchase stock by making a tender offer to repurchase a specific number of shares at a price that is at a premium to the current market price. They would not be willing to tender their shares for less than the prevailing market price, so Statement 2 is incorrect.", "explhtml": "<p>Buying in the open market gives the company the flexibility to choose the timing of the transaction. Thus, Statement 1 is correct. A second way is to buy a fixed number of shares at a fixed price. A company may repurchase stock by making a tender offer to repurchase a specific number of shares at a price that is at a premium to the current market price. They would not be willing to tender their shares for less than the prevailing market price, so Statement 2 is incorrect.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.2, LOS 13.i<\/div><div class=\"qtext\"><p>Jim Davis and Thurgood Owen, two equity analysts at Ferguson Capital Management, were reviewing the financial statements of Peregrine Foodstuffs Ltd. Davis and Owen noticed that Peregrine has been repurchasing its common shares in the market over the past three years. Owen thought this was an important issue to look into in greater detail. Upon completion of his review, Owen made the following two statements:<\/p><p>Peregrine has bought back shares in the open market during its repurchase Statement 1 &nbsp; program. This method of repurchase gave the company the flexibility to<\/p><p>choose the timing of the transaction.<\/p><p>Peregrine plans to buy back shares by making tender offers during the Statement 2 &nbsp; coming year. By making tender offers, the company will be able to<\/p><p>repurchase shares at a discount to the prevailing market price.<\/p><p>With respect to Owen&#x27;s statements:<\/p><\/div>", "subj": "corporate"}, {"n": 11, "q": "Pants R Us Inc.'s Board of Directors is considering repurchasing $30,000,000 worth of common stock. Pants R Us assumes that the stock can be repurchased at the market price of $50 per share. After much discussion Pants R Us decides to borrow $30 million that it will use to repurchase shares. Pants R Us' Chief Investment Officer (CIO) has compiled the following information regarding the repurchase of the firm's common stock: Share price at the time of buyback = $50 Shares outstanding before buyback = 30,600,000 EPS before buyback = $3.33 Earnings yield = $3.33 / $50 = 6.7% After-tax cost of borrowing = 6.7% Planned buyback = 600,000 shares Based on the information above, what will be Pants R Us' earnings per share (EPS) after the repurchase of its common stock?", "opts": ["$3.40.", "$3.33.", "$3.28."], "ans": "B", "expl": "Total earnings = $3.33 × 30,600,000 = $101,898,000 total earnings - after-tax cost of funds EPS after buyback = shares outstanding after buyback $101,898,000  - (600,000 shares x  $50 x  0.067) = (30,600,000 - 600,000) shares $101,898,000 -  $2,010,000 = 30,000,000 shares $99,888,000 = 30,000,000 shares = $3.33 Since the after-tax cost of borrowing of 6.7%% is equal to the 6.7% earnings yield (E/P) of the shares, the share repurchase has no effect on Pants R Us' EPS.", "explhtml": "<p>Total earnings = $3.33 × 30,600,000 = $101,898,000<\/p><p>total earnings - after-tax cost of funds<\/p><p>EPS after buyback =<\/p><p>shares outstanding after buyback<\/p><p>$101,898,000  - (600,000 shares x  $50 x  0.067)<\/p><p>=<\/p><p>(30,600,000 - 600,000) shares<\/p><p>$101,898,000 -  $2,010,000<\/p><p>=<\/p><p>30,000,000 shares<\/p><p>$99,888,000<\/p><p>=<\/p><p>30,000,000 shares<\/p><p>= $3.33<\/p><p>Since the after-tax cost of borrowing of 6.7%% is equal to the 6.7% earnings yield (E/P) of the shares, the share repurchase has no effect on Pants R Us&#x27; EPS.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.2, LOS 13.j<\/div><div class=\"qtext\"><p>Pants R Us Inc.&#x27;s Board of Directors is considering repurchasing $30,000,000 worth of common stock. Pants R Us assumes that the stock can be repurchased at the market price of $50 per share. After much discussion Pants R Us decides to borrow $30 million that it will use to repurchase shares. Pants R Us&#x27; Chief Investment Officer (CIO) has compiled the following information regarding the repurchase of the firm&#x27;s common stock:<\/p><p>Share price at the time of buyback = $50 Shares outstanding before buyback = 30,600,000 EPS before buyback = $3.33 Earnings yield = $3.33 / $50 = 6.7% After-tax cost of borrowing = 6.7% Planned buyback = 600,000 shares<\/p><p>Based on the information above, what will be Pants R Us&#x27; earnings per share (EPS) after the repurchase of its common stock?<\/p><\/div>", "subj": "corporate"}, {"n": 12, "q": "Armsware Industries' board is debating whether to issue a cash dividend or a stock dividend. Director Jones states, \"We should issue a cash dividend because our liquidity ratios will improve and the credit rating agencies will love it.\" Director Beane states, \"A stock dividend will improve our leverage ratios by increasing contributed capital, which is what the rating agencies are looking for.\" Are the statements by Jones and Beane accurate? Jones  Beane", "opts": ["Yes No", "Yes Yes", "No No"], "ans": "C", "expl": "Neither statement is accurate. Cash dividends will decrease both assets and equity, causing liquidity ratios to decline (assets fall, while liabilities stay the same). Stock dividends do not affect the firm's leverage ratios. Total equity remains unchanged because a stock dividend neither raises capital nor distributes earnings to shareholders.", "explhtml": "<p>Neither statement is accurate. Cash dividends will decrease both assets and equity, causing liquidity ratios to decline (assets fall, while liabilities stay the same). Stock dividends do not affect the firm&#x27;s leverage ratios. Total equity remains unchanged because a stock dividend neither raises capital nor distributes earnings to shareholders.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.1, LOS 13.a<\/div><div class=\"qtext\"><p>Armsware Industries&#x27; board is debating whether to issue a cash dividend or a stock dividend. Director Jones states, &quot;We should issue a cash dividend because our liquidity ratios will improve and the credit rating agencies will love it.&quot; Director Beane states, &quot;A stock dividend will improve our leverage ratios by increasing contributed capital, which is what the rating agencies are looking for.&quot; Are the statements by Jones and Beane accurate? Jones &nbsp; Beane<\/p><\/div>", "subj": "corporate"}, {"n": 13, "q": "Which of the following is most likely to be a symptom of a company that is able to sustain its cash dividend?", "opts": ["A low dividend yield compared to the company's historic average.", "A high dividend payout ratio compared to the industry average.", "Issuing new debt to fund projects and cover capital expenditures."], "ans": "A", "expl": "High dividend yields compared to the company's record suggest that investors are expecting dividends to be cut. Net borrowings are not sustainable, and will eventually require a cut in share repurchases and dividends. A higher-than-average dividend payout ratio creates the risk that dividends may be cut if earnings decline.", "explhtml": "<p>High dividend yields compared to the company&#x27;s record suggest that investors are expecting dividends to be cut. Net borrowings are not sustainable, and will eventually require a cut in share repurchases and dividends. A higher-than-average dividend payout ratio creates the risk that dividends may be cut if earnings decline.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.2, LOS 13.n<\/div><div class=\"qtext\"><p>Which of the following is most likely to be a symptom of a company that is able to sustain its cash dividend?<\/p><\/div>", "subj": "corporate"}, {"n": 14, "q": "Dan Bridges, head of equity strategies for Paca Inc. a consultant to institutional investors makes the following statement: Globally, the developed markets have seen a decline in proportion of companies paying cash dividends. Lately, we have also seen an increase in the proportion of companies engaging in share repurchases. Bridges' statement is most likely:", "opts": ["Correct.", "Incorrect as to dividend payout ratios.", "Incorrect as to companies engaging in share repurchases."], "ans": "A", "expl": "Bridges' statement is correct.", "explhtml": "<p>Bridges&#x27; statement is correct.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.2, LOS 13.h<\/div><div class=\"qtext\"><p>Dan Bridges, head of equity strategies for Paca Inc. a consultant to institutional investors makes the following statement:<\/p><p>Globally, the developed markets have seen a decline in proportion of companies paying cash dividends. Lately, we have also seen an increase in the proportion of companies engaging in share repurchases.<\/p><p>Bridges&#x27; statement is most likely:<\/p><\/div>", "subj": "corporate"}, {"n": 15, "q": "Which of the following is least likely a method by which firms repurchase their shares?", "opts": ["Direct negotiation.", "Tender offer.", "Exercise a call provision."], "ans": "C", "expl": "Call provisions are not relevant to common stock and are not considered a repurchase in any case. There are three repurchase methods. The first is to buy in the open market. A company may repurchase stock by making a tender offer to repurchase a specific number of shares at a price that is usually at a premium to the current market price. The third way is to repurchase by direct negotiation. Companies may negotiate directly with a large shareholder to buy back a block of shares, usually at a premium to the market price.", "explhtml": "<p>Call provisions are not relevant to common stock and are not considered a repurchase in any case. There are three repurchase methods. The first is to buy in the open market. A company may repurchase stock by making a tender offer to repurchase a specific number of shares at a price that is usually at a premium to the current market price. The third way is to repurchase by direct negotiation. Companies may negotiate directly with a large shareholder to buy back a block of shares, usually at a premium to the market price.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.2, LOS 13.i<\/div><div class=\"qtext\"><p>Which of the following is least likely a method by which firms repurchase their shares?<\/p><\/div>", "subj": "corporate"}, {"n": 16, "q": "Hikaru Takei is the portfolio manager for the Reliant Dividend Focused Fund. Takei wants to add a firm to his portfolio that follows a stable dividend policy. Takei is considering investing in one of three companies: Kirk Beauty Supplies maintains a constant dividend payout of 25 to 30%. Kelley Medical Devices increases its dividend each year in accordance with the company's long run growth rate of 4%. Barrett Satellite Systems has maintained a dividend of $2.00 per share over the last 6 years. Which stock best meets Takei's criteria?", "opts": ["Kirk Beauty Supplies.", "Kelley Medical Devices.", "Barrett Satellite Systems."], "ans": "B", "expl": "Due to inflation considerations, a company with a stable dividend policy will have stability in the rate of increase for its dividend each year. This typically means aligning the company's dividend growth rate with its long-term growth rate. Although the company with the fixed per share dividend is a tempting choice, once inflation is considered, a fixed $2.00 per share dividend is actually declining each year in terms of spending power.", "explhtml": "<p>Due to inflation considerations, a company with a stable dividend policy will have stability in the rate of increase for its dividend each year. This typically means aligning the company&#x27;s dividend growth rate with its long-term growth rate. Although the company with the fixed per share dividend is a tempting choice, once inflation is considered, a fixed $2.00 per share dividend is actually declining each year in terms of spending power.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.2, LOS 13.g<\/div><div class=\"qtext\"><p>Hikaru Takei is the portfolio manager for the Reliant Dividend Focused Fund. Takei wants to add a firm to his portfolio that follows a stable dividend policy. Takei is considering investing in one of three companies:<\/p><p>Kirk Beauty Supplies maintains a constant dividend payout of 25 to 30%. Kelley Medical Devices increases its dividend each year in accordance with the company&#x27;s long run growth rate of 4%. Barrett Satellite Systems has maintained a dividend of $2.00 per share over the last 6 years.<\/p><p>Which stock best meets Takei&#x27;s criteria?<\/p><\/div>", "subj": "corporate"}, {"n": 17, "q": "The share prices of Solar Automotive Industries and Winnipeg Auto Unlimited are both $50 per share, and each company has 50 million shares outstanding. On September 30, both companies announced a $10 million stock buyback. Solar has a book value of $500 million, while Winnipeg has a book value of $900 million. How much did the book value per share (BVPS) of each company increase or decrease after the share repurchase? Solar Automotive Industries  Winnipeg Auto Unlimited", "opts": ["Decrease by $0.16 Decrease by $0.13", "Increase by $0.13 Increase by $0.16", "Decrease by $0.13 Decrease by $0.13"], "ans": "A", "expl": "The share buyback for each company is $10 million / $50 per share = 200,000 shares. Remaining shares for each company = 50 million − 200,000 = 49.8 million shares. For Solar Automotive Industries: Solar Automotive Industries' current BVPS = $500 million / 50 million = $10. The market price per share of $50 is greater than the BVPS of $10. Book value after repurchase = $500 million – $10 million = $490 million BVPS = $490 million / 49.8 million = $9.84 BVPS decreased by $0.16 For Winnipeg Auto Unlimited: Winnipeg Auto Unlimited's current BVPS = $900 million / 50 million = $18. The market price per share of $50 is greater than the BVPS of $18. Book value after repurchase = $900 million – $10 million = $890 million BVPS = $890 million / 49.8 million = $17.87 BVPS decreased by $0.13. In the case of both Solar Automotive Industries and Winnipeg Auto Unlimited, book value per share (BVPS) decreased because the share price is greater than the original BVPS. If the share prices were less than the original BVPS, then the BVPS after the repurchase for each firm would have increased.", "explhtml": "<p>The share buyback for each company is $10 million / $50 per share = 200,000 shares.<\/p><p>Remaining shares for each company = 50 million − 200,000 = 49.8 million shares.<\/p><p>For Solar Automotive Industries:<\/p><p>Solar Automotive Industries&#x27; current BVPS = $500 million / 50 million = $10.<\/p><p>The market price per share of $50 is greater than the BVPS of $10.<\/p><p>Book value after repurchase = $500 million – $10 million = $490 million<\/p><p>BVPS = $490 million / 49.8 million = $9.84<\/p><p>BVPS decreased by $0.16<\/p><p>For Winnipeg Auto Unlimited:<\/p><p>Winnipeg Auto Unlimited&#x27;s current BVPS = $900 million / 50 million = $18.<\/p><p>The market price per share of $50 is greater than the BVPS of $18.<\/p><p>Book value after repurchase = $900 million – $10 million = $890 million<\/p><p>BVPS = $890 million / 49.8 million = $17.87<\/p><p>BVPS decreased by $0.13.<\/p><p>In the case of both Solar Automotive Industries and Winnipeg Auto Unlimited, book value per share (BVPS) decreased because the share price is greater than the original BVPS. If the share prices were less than the original BVPS, then the BVPS after the repurchase for each firm would have increased.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.2, LOS 13.k<\/div><div class=\"qtext\"><p>The share prices of Solar Automotive Industries and Winnipeg Auto Unlimited are both $50 per share, and each company has 50 million shares outstanding. On September 30, both companies announced a $10 million stock buyback. Solar has a book value of $500 million, while Winnipeg has a book value of $900 million. How much did the book value per share (BVPS) of each company increase or decrease after the share repurchase? Solar Automotive Industries &nbsp; Winnipeg Auto Unlimited<\/p><\/div>", "subj": "corporate"}, {"n": 18, "q": "Laura's Chocolates, Inc. (LC), is a maker of nut-based toffees. LC is considering a share repurchase and prefers the \"tender offer\" method. Which of the following is also known as a \"tender offer\"?", "opts": ["Buying in the open market.", "Buying a fixed number of shares at a fixed price.", "Repurchasing by direct negotiation."], "ans": "B", "expl": "A tender offer refers to buying a fixed number of shares at a fixed price (usually at a premium to the current market price).", "explhtml": "<p>A tender offer refers to buying a fixed number of shares at a fixed price (usually at a premium to the current market price).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.2, LOS 13.i<\/div><div class=\"qtext\"><p>Laura&#x27;s Chocolates, Inc. (LC), is a maker of nut-based toffees. LC is considering a share repurchase and prefers the &quot;tender offer&quot; method. Which of the following is also known as a &quot;tender offer&quot;?<\/p><\/div>", "subj": "corporate"}, {"n": 19, "q": "The share price of Winnipeg Auto Unlimited is $5 per share. There are 50 million shares outstanding, and Winnipeg has a book value of $900 million. What is the book value per share (BVPS) after the share repurchase of $10 million?", "opts": ["$14.76.", "$21.24.", "$18.54."], "ans": "C", "expl": "The share buyback is $10 million / $5 per share = 2,000,000 shares. Remaining shares: 50 million − 2 million = 48 million shares. Winnipeg Auto Unlimited's current BVPS = $900 million / 50 million = $18. Book value after repurchase: $900 million − $10 million = $890 million. BVPS = $890 million / 48.0 million = $18.54. BVPS increased by $0.54. Book value per share (BVPS) increased because the share price is less than the original BVPS. If the share prices were more than the original BVPS, then the BVPS after the repurchase would have decreased.", "explhtml": "<p>The share buyback is $10 million / $5 per share = 2,000,000 shares.<\/p><p>Remaining shares: 50 million − 2 million = 48 million shares.<\/p><p>Winnipeg Auto Unlimited&#x27;s current BVPS = $900 million / 50 million = $18.<\/p><p>Book value after repurchase: $900 million − $10 million = $890 million.<\/p><p>BVPS = $890 million / 48.0 million = $18.54.<\/p><p>BVPS increased by $0.54.<\/p><p>Book value per share (BVPS) increased because the share price is less than the original BVPS. If the share prices were more than the original BVPS, then the BVPS after the repurchase would have decreased.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.2, LOS 13.k<\/div><div class=\"qtext\"><p>The share price of Winnipeg Auto Unlimited is $5 per share. There are 50 million shares outstanding, and Winnipeg has a book value of $900 million. What is the book value per share (BVPS) after the share repurchase of $10 million?<\/p><\/div>", "subj": "corporate"}, {"n": 20, "q": "Which of the following is least likely to discourage a company from making high dividend payouts? The company's:", "opts": ["bondholders are protected by strong debt covenants.", "shareholders are primarily tax-exempt institutions.", "flotation costs are high."], "ans": "B", "expl": "Taxes on dividends are one factor that sometimes discourages companies from paying dividends, however if most shareholders are tax exempt, tax considerations are unlikely to discourage a company from making dividend payouts. A company with high flotation costs is less likely to pay out high dividends, to ensure that projects can be financed through earnings and to thus avoid the expense of issuing new shares. Bondholders are often contractually protected from high dividend payouts; strong debt covenants are likely to prevent the company from making high dividend payouts.", "explhtml": "<p>Taxes on dividends are one factor that sometimes discourages companies from paying dividends, however if most shareholders are tax exempt, tax considerations are unlikely to discourage a company from making dividend payouts. A company with high flotation costs is less likely to pay out high dividends, to ensure that projects can be financed through earnings and to thus avoid the expense of issuing new shares. Bondholders are often contractually protected from high dividend payouts; strong debt covenants are likely to prevent the company from making high dividend payouts.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.1, LOS 13.e<\/div><div class=\"qtext\"><p>Which of the following is least likely to discourage a company from making high dividend payouts? The company&#x27;s:<\/p><\/div>", "subj": "corporate"}, {"n": 21, "q": "Dividend payments are most likely to be associated with:", "opts": ["increased agency conflict between bondholders and shareholders.", "increased agency conflict between bondholders and managers.", "increased agency conflict between shareholders and managers."], "ans": "A", "expl": "Paying dividends can be helpful in reducing agency conflicts between shareholders and managers because dividend payouts constrain managers' ability to invest in negative NPV projects that benefit the managers at the expense of shareholders. Paying dividends is likely to intensify the agency conflict between bondholders and shareholders, as it represents a transfer of wealth from bondholders to shareholders. There is no agency conflict between bondholders and managers.", "explhtml": "<p>Paying dividends can be helpful in reducing agency conflicts between shareholders and managers because dividend payouts constrain managers&#x27; ability to invest in negative NPV projects that benefit the managers at the expense of shareholders.<\/p><p>Paying dividends is likely to intensify the agency conflict between bondholders and shareholders, as it represents a transfer of wealth from bondholders to shareholders.<\/p><p>There is no agency conflict between bondholders and managers.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.1, LOS 13.d<\/div><div class=\"qtext\"><p>Dividend payments are most likely to be associated with:<\/p><\/div>", "subj": "corporate"}, {"n": 22, "q": "The share price of Solar Automotive Industries is $50 per share. It has a book value of $500 million and 50 million shares outstanding. What is the book value per share (BVPS) after a share repurchase of $10 million?", "opts": ["$9.84.", "$10.12.", "$10.00."], "ans": "A", "expl": "The share buyback is $10 million / $50 per share = 200,000 shares. Remaining shares: 50 million − 200,000 = 49.8 million shares. Solar Automotive Industries' current BVPS = $500 million / 50 million = $10. Book value after repurchase: $500 million − $10 million = $490 million. BVPS = $490 million / 49.8 million = $9.84. BVPS decreased by $0.16. Book value per share (BVPS) decreased because the share price is greater than the original BVPS. If the share prices were less than the original BVPS, then the BVPS after the repurchase would have increased.", "explhtml": "<p>The share buyback is $10 million / $50 per share = 200,000 shares.<\/p><p>Remaining shares: 50 million − 200,000 = 49.8 million shares.<\/p><p>Solar Automotive Industries&#x27; current BVPS = $500 million / 50 million = $10.<\/p><p>Book value after repurchase: $500 million − $10 million = $490 million.<\/p><p>BVPS = $490 million / 49.8 million = $9.84.<\/p><p>BVPS decreased by $0.16.<\/p><p>Book value per share (BVPS) decreased because the share price is greater than the original BVPS. If the share prices were less than the original BVPS, then the BVPS after the repurchase would have increased.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.2, LOS 13.k<\/div><div class=\"qtext\"><p>The share price of Solar Automotive Industries is $50 per share. It has a book value of $500 million and 50 million shares outstanding. What is the book value per share (BVPS) after a share repurchase of $10 million?<\/p><\/div>", "subj": "corporate"}, {"n": 23, "q": "At a recent conference, \"Dividends − Are They Increasing?\", several lecturers were discussing the signaling effect and their opinions on how changes in a company's dividend policy are often viewed by investors. Linda Travis, an equity analyst at Girthmore Capital Management and one of the guest lecturers at the conference, made the following observations: Observation 1: A dividend initiation is always viewed as a positive signal by investors. It\nis an indication that the company has so much cash at its disposal that it\ncan afford to pay it out to shareholders. Observation 2: A dividend decrease is typically a positive signal by a company's\nmanagement to its shareholders. It indicates that management has a\nvariety of positive NPV projects in its capital budget and would like to\nfinance as many of them as possible with retained earnings. With respect to Travis' observations:", "opts": ["only one is correct.", "both are correct.", "both are incorrect."], "ans": "C", "expl": "A dividend initiation is often viewed differently by different investors. On one hand, a dividend initiation could mean that a company is sharing its wealth with shareholders – a positive signal. On the other hand, initiating a dividend could mean that a company has a lack of profitable reinvestment opportunities – a negative signal. Dividend decreases or omissions are typically negative signals that current and future earnings prospects are not good and that management does not think the current dividend payment can be maintained.", "explhtml": "<p>A dividend initiation is often viewed differently by different investors. On one hand, a dividend initiation could mean that a company is sharing its wealth with shareholders – a positive signal. On the other hand, initiating a dividend could mean that a company has a lack of profitable reinvestment opportunities – a negative signal. Dividend decreases or omissions are typically negative signals that current and future earnings prospects are not good and that management does not think the current dividend payment can be maintained.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.1, LOS 13.c<\/div><div class=\"qtext\"><p>At a recent conference, &quot;Dividends − Are They Increasing?&quot;, several lecturers were discussing the signaling effect and their opinions on how changes in a company&#x27;s dividend policy are often viewed by investors. Linda Travis, an equity analyst at Girthmore Capital Management and one of the guest lecturers at the conference, made the following observations:<\/p><div class=\"tbl\"><table><tr><td>Observation 1:<\/td><td>A dividend initiation is always viewed as a positive signal by investors. It<br>is an indication that the company has so much cash at its disposal that it<br>can afford to pay it out to shareholders.<\/td><\/tr><tr><td>Observation 2:<\/td><td>A dividend decrease is typically a positive signal by a company&#x27;s<br>management to its shareholders. It indicates that management has a<br>variety of positive NPV projects in its capital budget and would like to<br>finance as many of them as possible with retained earnings.<\/td><\/tr><\/table><\/div><p>With respect to Travis&#x27; observations:<\/p><\/div>", "subj": "corporate"}, {"n": 24, "q": "David Drakar and Leslie O'Rourke both own 100 shares of stock in a German corporation that makes €1.00 per share in pre-tax income. The corporation pays out all of its income as dividends. Drakar is in the 30% individual tax bracket while O'Rourke is in the 40% individual tax bracket. The tax rate applicable to the corporation is 30%. Drakar and O'Rourke live in the United Kingdom, which uses an imputation tax system for corporate dividends. What is the effective tax rate on the dividend for each shareholder, assuming no effects from the exchange rate? Drakar  O'Rourke", "opts": ["38% 44%", "30% 40%", "40% 48%"], "ans": "B", "expl": "Under an imputation tax system, taxes are paid at the corporate level, but are attributed to the shareholder, so that all taxes are effectively paid at the shareholder rate.", "explhtml": "<p>Under an imputation tax system, taxes are paid at the corporate level, but are attributed to the shareholder, so that all taxes are effectively paid at the shareholder rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.1, LOS 13.f<\/div><div class=\"qtext\"><p>David Drakar and Leslie O&#x27;Rourke both own 100 shares of stock in a German corporation that makes €1.00 per share in pre-tax income. The corporation pays out all of its income as dividends. Drakar is in the 30% individual tax bracket while O&#x27;Rourke is in the 40% individual tax bracket. The tax rate applicable to the corporation is 30%. Drakar and O&#x27;Rourke live in the United Kingdom, which uses an imputation tax system for corporate dividends. What is the effective tax rate on the dividend for each shareholder, assuming no effects from the exchange rate? Drakar &nbsp; O&#x27;Rourke<\/p><\/div>", "subj": "corporate"}, {"n": 25, "q": "When a firm pays a stock dividend, the dividend is most likely to:", "opts": ["cause liquidity ratios to decrease.", "have no impact on financial leverage ratios and liquidity ratios.", "cause financial leverage ratios to increase."], "ans": "B", "expl": "Stock dividends do not affect assets or shareholders' equity, and financial leverage ratios and liquidity ratios are unaffected. Stock dividends have no economic impact on a company and do not affect a company's capital structure. (Cash dividends, on the other hand, decrease liquidity ratios and increase financial leverage ratios.)", "explhtml": "<p>Stock dividends do not affect assets or shareholders&#x27; equity, and financial leverage ratios and liquidity ratios are unaffected. Stock dividends have no economic impact on a company and do not affect a company&#x27;s capital structure. (Cash dividends, on the other hand, decrease liquidity ratios and increase financial leverage ratios.)<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.1, LOS 13.a<\/div><div class=\"qtext\"><p>When a firm pays a stock dividend, the dividend is most likely to:<\/p><\/div>", "subj": "corporate"}, {"n": 26, "q": "Global Development expects to earn $6 million next year. 40% of this amount, or $2.4 million, has been allocated for distribution to common shareholders. There are 2.4 million shares outstanding, and the market price is $30 a share. If Global uses the $2.4 million to repurchase shares at the current price of $30 per share, its share price after the repurchase will be closest to:", "opts": ["$30.00.", "$31.00.", "$29.00."], "ans": "A", "expl": "Market value of equity before the repurchase is $30 × 2.4 million = $72 million. Shares Repurchased = $2.4 million / $30 = 80,000 shares. Shares remaining = Shares outstanding − Shares repurchased = 2,400,000 − 80,000 = 2,320,000. Share price after the repurchase = ($72 million − $2.4 million) / 2,320,000 = $30.", "explhtml": "<p>Market value of equity before the repurchase is $30 × 2.4 million = $72 million.<\/p><p>Shares Repurchased = $2.4 million / $30 = 80,000 shares.<\/p><p>Shares remaining = Shares outstanding − Shares repurchased = 2,400,000 − 80,000 = 2,320,000.<\/p><p>Share price after the repurchase = ($72 million − $2.4 million) / 2,320,000 = $30.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.2, LOS 13.l<\/div><div class=\"qtext\"><p>Global Development expects to earn $6 million next year. 40% of this amount, or $2.4 million, has been allocated for distribution to common shareholders. There are 2.4 million shares outstanding, and the market price is $30 a share. If Global uses the $2.4 million to repurchase shares at the current price of $30 per share, its share price after the repurchase will be closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 27, "q": "If Modigliani and Miller's dividend irrelevancy theory is correct, what is the impact on a firm's cost of capital and stockholder wealth if its dividend payout increases? Stockholder Cost of Capital wealth", "opts": ["None None", "An increase A decrease", "None A decrease"], "ans": "A", "expl": "If investors do not consider dividends to be relevant, the dividend payout will not affect the required rate of return. If the required rate of return does not change, stockholder wealth will be unchanged despite the change in its dividend payout rate.", "explhtml": "<p>If investors do not consider dividends to be relevant, the dividend payout will not affect the required rate of return. If the required rate of return does not change, stockholder wealth will be unchanged despite the change in its dividend payout rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.1, LOS 13.b<\/div><div class=\"qtext\"><p>If Modigliani and Miller&#x27;s dividend irrelevancy theory is correct, what is the impact on a firm&#x27;s cost of capital and stockholder wealth if its dividend payout increases?<\/p><p>Stockholder<\/p><p>Cost of Capital<\/p><p>wealth<\/p><\/div>", "subj": "corporate"}, {"n": 28, "q": "Francis Investment Inc.'s Board of Directors is considering repurchasing $30,000,000 worth of common stock. Francis assumes that the stock can be repurchased at the market price of $50 per share. After much discussion Francis decides to borrow $30 million that it will use to repurchase shares. Francis' Chief Financial Officer (CFO) has compiled the following information regarding the repurchase of the firm's common stock: Share price at the time of buyback = $50 Shares outstanding before buyback = 30,600,000 EPS before buyback = $3.33 Earnings yield = $3.33 / $50 = 6.7% After-tax cost of borrowing = 4.0% Planned buyback = 600,000 shares Based on the information above, after the repurchase of its common stock, Francis' EPS will be closest to:", "opts": ["$3.39.", "$3.41.", "$3.36."], "ans": "C", "expl": "Total earnings = $3.33 × 30,600,000 = $101,898,000 total earnings - after-tax cost of funds EPS after buyback = shares outstanding after buyback $101,898,000  - (600,000 shares x  $50 x  0.04) = (30,600,000 - 600,000) shares $101,898,000 -  $1,200,000 = 30,000,000 shares $100,698,000 = 30,000,000 shares = $3.36 Since the after-tax cost of borrowing of 4% is less than the 6.7% earnings yield (E/P) of the shares, the share repurchase will increase Francis's EPS.", "explhtml": "<p>Total earnings = $3.33 × 30,600,000 = $101,898,000<\/p><p>total earnings - after-tax cost of funds<\/p><p>EPS after buyback =<\/p><p>shares outstanding after buyback<\/p><p>$101,898,000  - (600,000 shares x  $50 x  0.04)<\/p><p>=<\/p><p>(30,600,000 - 600,000) shares<\/p><p>$101,898,000 -  $1,200,000<\/p><p>=<\/p><p>30,000,000 shares<\/p><p>$100,698,000<\/p><p>=<\/p><p>30,000,000 shares<\/p><p>= $3.36<\/p><p>Since the after-tax cost of borrowing of 4% is less than the 6.7% earnings yield (E/P) of the shares, the share repurchase will increase Francis&#x27;s EPS.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.2, LOS 13.j<\/div><div class=\"qtext\"><p>Francis Investment Inc.&#x27;s Board of Directors is considering repurchasing $30,000,000 worth of common stock. Francis assumes that the stock can be repurchased at the market price of $50 per share. After much discussion Francis decides to borrow $30 million that it will use to repurchase shares. Francis&#x27; Chief Financial Officer (CFO) has compiled the following information regarding the repurchase of the firm&#x27;s common stock:<\/p><p>Share price at the time of buyback = $50 Shares outstanding before buyback = 30,600,000 EPS before buyback = $3.33 Earnings yield = $3.33 / $50 = 6.7% After-tax cost of borrowing = 4.0% Planned buyback = 600,000 shares<\/p><p>Based on the information above, after the repurchase of its common stock, Francis&#x27; EPS will be closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 29, "q": "Grommetco produces plastic insulators for the electrical appliance industry. Excerpts from Grommetco's financial results for 2010 are as follows: Net Income (earnings) $10 Free Cash Flow to Equity $8 Dividends Paid $1 Stock Repurchases $3 Which of the following statements is most accurate? Grommetco's:", "opts": ["FCFE coverage ratio is 2.0.", "dividend coverage ratio is 2.5.", "dividend payout ratio is 0.4."], "ans": "A", "expl": "Dividend coverage ratio = Net Income / Dividends = $10 / $1 = 10. FCFE coverage ratio = FCFE / (dividends + share repurchases) = $8 / ($1 + $3) = 2.0. Dividend payout ratio = Dividends / Net Income = $1 / $10 = 0.1.", "explhtml": "<p>Dividend coverage ratio = Net Income / Dividends = $10 / $1 = 10.<\/p><p>FCFE coverage ratio = FCFE / (dividends + share repurchases) = $8 / ($1 + $3) = 2.0.<\/p><p>Dividend payout ratio = Dividends / Net Income = $1 / $10 = 0.1.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.2, LOS 13.m<\/div><div class=\"qtext\"><p>Grommetco produces plastic insulators for the electrical appliance industry. Excerpts from Grommetco&#x27;s financial results for 2010 are as follows:<\/p><div class=\"tbl\"><table><tr><td>Net Income (earnings)<\/td><td>$10<\/td><\/tr><tr><td>Free Cash Flow to Equity<\/td><td>$8<\/td><\/tr><tr><td>Dividends Paid<\/td><td>$1<\/td><\/tr><tr><td>Stock Repurchases<\/td><td>$3<\/td><\/tr><\/table><\/div><p>Which of the following statements is most accurate? Grommetco&#x27;s:<\/p><\/div>", "subj": "corporate"}, {"n": 30, "q": "Belden Engineering Corporation (BEC) is considering a share repurchase program. David Gudzanski, the firm's executive vice president prepares a memo to the board of directors detailing reasons why a share repurchase would be favorable at this time. Reasons listed in the memo are as follows: Reason 1: The resulting capital structure from the share repurchase would be more\nfavorable for investors in BEC's bonds. Reason 2: BEC's stock is currently selling at $37 in the marketplace. Our discounted\ncash flow analysis values the company at $48 per share. Reason 3: The share repurchase could be used to offset dilution caused by the exercise\nof employee stock options. Reason 4: BEC can use the repurchase to send a signal to investors that management\nhas a positive future outlook for the company. Reason 5: The share repurchase could be used as an alternative to a cash dividend,\nthat does not create the expectation of continuance in the future. Which of Gudzanski's reasons in favor of the share repurchase is most accurate?", "opts": ["Reasons 2 and 3 only.", "Reasons 2, 3, 4, and 5.", "Reasons 1 and 3 only."], "ans": "B", "expl": "A share repurchase would decrease the percentage of equity in a firm's capital structure, which would in turn increase the percentage of debt. An increase in debt would add more leverage to the firm which would be negative for the firm's bondholders. The other reasons listed are all rationales for a share repurchase.", "explhtml": "<p>A share repurchase would decrease the percentage of equity in a firm&#x27;s capital structure, which would in turn increase the percentage of debt. An increase in debt would add more leverage to the firm which would be negative for the firm&#x27;s bondholders. The other reasons listed are all rationales for a share repurchase.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.2, LOS 13.l<\/div><div class=\"qtext\"><p>Belden Engineering Corporation (BEC) is considering a share repurchase program. David Gudzanski, the firm&#x27;s executive vice president prepares a memo to the board of directors detailing reasons why a share repurchase would be favorable at this time. Reasons listed in the memo are as follows:<\/p><div class=\"tbl\"><table><tr><td>Reason 1:<\/td><td>The resulting capital structure from the share repurchase would be more<br>favorable for investors in BEC&#x27;s bonds.<\/td><\/tr><tr><td>Reason 2:<\/td><td>BEC&#x27;s stock is currently selling at $37 in the marketplace. Our discounted<br>cash flow analysis values the company at $48 per share.<\/td><\/tr><tr><td>Reason 3:<\/td><td>The share repurchase could be used to offset dilution caused by the exercise<br>of employee stock options.<\/td><\/tr><tr><td>Reason 4:<\/td><td>BEC can use the repurchase to send a signal to investors that management<br>has a positive future outlook for the company.<\/td><\/tr><tr><td>Reason 5:<\/td><td>The share repurchase could be used as an alternative to a cash dividend,<br>that does not create the expectation of continuance in the future.<\/td><\/tr><\/table><\/div><p>Which of Gudzanski&#x27;s reasons in favor of the share repurchase is most accurate?<\/p><\/div>", "subj": "corporate"}, {"n": 31, "q": "Pearl City Breweries has 8 million shares outstanding that are currently trading at $34 per share. The company is choosing whether to distribute $22 million as dividends or to use the same amount to repurchase its shares. Ignoring tax effects, what will be the amount of total wealth from owning one share of Pearl City Breweries under each of these alternatives? Share Cash dividend repurchase", "opts": ["$31.25 $34.00", "$31.25 $37.00", "$34.00 $34.00"], "ans": "C", "expl": "If the company pays a cash dividend, the dividend per share will be $22 million/8 million = $2.75. The value of its shares will be: 8,000,000 ($34) −$22,000,000  $250,000,000 | =  = $31.25 | 8,000,000  8,000,000 So the total wealth from owning one share will be $31.25 + $2.75 = $34.00. If the company repurchases shares, it can buy $22 million/$34 = 647,058 shares. The value of one share would then be: 8,000,000 ($34) −$22,000,000  $250,000,000 | =  = $34.00 7,352,942 8,000,000 −647,058 If you remember that both a cash dividend and a share repurchase for cash leave shareholder wealth unchanged, this question does not require calculations of the amounts.", "explhtml": "<p>If the company pays a cash dividend, the dividend per share will be $22 million/8 million = $2.75. The value of its shares will be:<\/p><div class=\"tbl\"><table><tr><td>8,000,000 ($34) −$22,000,000<\/td><td>$250,000,000<\/td><\/tr><tr><td>=<\/td><td>= $31.25<\/td><\/tr><tr><td>8,000,000<\/td><td>8,000,000<\/td><\/tr><\/table><\/div><p>So the total wealth from owning one share will be $31.25 + $2.75 = $34.00.<\/p><p>If the company repurchases shares, it can buy $22 million/$34 = 647,058 shares. The value of one share would then be:<\/p><div class=\"tbl\"><table><tr><td>8,000,000 ($34) −$22,000,000<\/td><td>$250,000,000<\/td><\/tr><tr><td>=<\/td><td>= $34.00<\/td><\/tr><\/table><\/div><p>7,352,942<\/p><p>8,000,000 −647,058<\/p><p>If you remember that both a cash dividend and a share repurchase for cash leave shareholder wealth unchanged, this question does not require calculations of the amounts.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.2, LOS 13.l<\/div><div class=\"qtext\"><p>Pearl City Breweries has 8 million shares outstanding that are currently trading at $34 per share. The company is choosing whether to distribute $22 million as dividends or to use the same amount to repurchase its shares. Ignoring tax effects, what will be the amount of total wealth from owning one share of Pearl City Breweries under each of these alternatives?<\/p><p>Share<\/p><p>Cash dividend<\/p><p>repurchase<\/p><\/div>", "subj": "corporate"}, {"n": 32, "q": "According to Modigliani and Miller's dividend irrelevancy theory, an investor in a firm that does not pay a dividend can still earn a \"dividend\" on that company by:", "opts": ["slowly liquidating the fixed income portion of the investor’s portfolio.", "writing covered call options on the underlying stock.", "selling a portion of the company's stock each year."], "ans": "C", "expl": "Miller and Modigliani's dividend irrelevancy theory states that shareholders can create their own dividend policy. If a firm does not pay dividends, a shareholder who wants a 4% dividend can \"create\" it by selling 4% of his or her stock. Note that Modigliani and Miller's theory assumes zero transaction costs or taxes. In actual practice, shareholders will have to pay transaction costs, and tax on any capital gains.", "explhtml": "<p>Miller and Modigliani&#x27;s dividend irrelevancy theory states that shareholders can create their own dividend policy. If a firm does not pay dividends, a shareholder who wants a 4% dividend can &quot;create&quot; it by selling 4% of his or her stock. Note that Modigliani and Miller&#x27;s theory assumes zero transaction costs or taxes. In actual practice, shareholders will have to pay transaction costs, and tax on any capital gains.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.1, LOS 13.b<\/div><div class=\"qtext\"><p>According to Modigliani and Miller&#x27;s dividend irrelevancy theory, an investor in a firm that does not pay a dividend can still earn a &quot;dividend&quot; on that company by:<\/p><\/div>", "subj": "corporate"}, {"n": 33, "q": "According to Gordon, Litner, and Graham, what will be the impact of the dividend initiation on the cost of equity of Rainham Inc.?", "opts": ["Unchanged.", "It will decrease.", "It will increase."], "ans": "B", "expl": "According to the dividend preference theory (bird-in-the-hand argument), dividends are perceived to be of a lower risk than potential capital gains from reinvested earnings. Dividends have certainly, whereas future capital gains do not. A company that pays dividends will, therefore, have a lower cost of equity compared to a similar non-dividend paying firm.", "explhtml": "<p>According to the dividend preference theory (bird-in-the-hand argument), dividends are perceived to be of a lower risk than potential capital gains from reinvested earnings. Dividends have certainly, whereas future capital gains do not. A company that pays dividends will, therefore, have a lower cost of equity compared to a similar non-dividend paying firm.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 33–36<\/div> <div class=\"pp-topic\">Module 13.1, LOS 13.b<\/div><div class=\"kq-note\">Câu thuộc item set (câu 33–36). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>According to Gordon, Litner, and Graham, what will be the impact of the dividend initiation on the cost of equity of Rainham Inc.?<\/p><\/div>", "subj": "corporate"}, {"n": 34, "q": "Which of the following dividend policy is consistent with the Rainham Inc.'s proposed dividend policy of setting an initial dividend payout ratio to 30% and then increase this over the following five years to 70%?", "opts": ["Target payout ratio.", "Dividend stability.", "Residual dividend model."], "ans": "A", "expl": "Target payout ratio is consistent with the proposed dividend policy of Rainham Inc. Under the target payout ratio approach, the management would define a target payout ratio and move toward the target payout ratio over time.", "explhtml": "<p>Target payout ratio is consistent with the proposed dividend policy of Rainham Inc. Under the target payout ratio approach, the management would define a target payout ratio and move toward the target payout ratio over time.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 33–36<\/div> <div class=\"pp-topic\">Module 13.2, LOS 13.g<\/div><div class=\"qtext\"><p>Which of the following dividend policy is consistent with the Rainham Inc.&#x27;s proposed dividend policy of setting an initial dividend payout ratio to 30% and then increase this over the following five years to 70%?<\/p><\/div>", "subj": "corporate"}, {"n": 35, "q": "The Commercial Director has mentioned four out of six factors that influence dividend policy. Which of the following is least likely to be one of the remaining two factors not mentioned?", "opts": ["Taxation.", "Clientele effect.", "Financial flexibility."], "ans": "B", "expl": "The six factors that affect dividend policy are: Availability of investment opportunities Future earnings volatility Financial flexibility Tax considerations Flotation costs Contractual and legal restrictions", "explhtml": "<p>The six factors that affect dividend policy are:<\/p><p>Availability of investment opportunities Future earnings volatility Financial flexibility Tax considerations Flotation costs Contractual and legal restrictions<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 33–36<\/div> <div class=\"pp-topic\">Module 13.1, LOS 13.e<\/div><div class=\"qtext\"><p>The Commercial Director has mentioned four out of six factors that influence dividend policy. Which of the following is least likely to be one of the remaining two factors not mentioned?<\/p><\/div>", "subj": "corporate"}, {"n": 36, "q": "Rainham Inc. pays 35% taxes based on the U.S. tax laws and pays a dividend of $0.90 a share. Assuming that the investor who receives Rainham Inc.'s dividend is in the 15% tax bracket. The effective tax rate on a dollar of earnings paid out as dividends will be:", "opts": ["Equal to the investor’s tax bracket of 15%.", "Equal to the corporate tax rate of 35%.", "Higher than 35%."], "ans": "C", "expl": "U.S. tax rules are based on a double taxation system. As such, the effective tax rate will be higher than just the corporate tax rate of 35% as taxes paid would include both corporate tax and the tax paid on the dividend.", "explhtml": "<p>U.S. tax rules are based on a double taxation system. As such, the effective tax rate will be higher than just the corporate tax rate of 35% as taxes paid would include both corporate tax and the tax paid on the dividend.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 33–36<\/div> <div class=\"pp-topic\">Module 13.1, LOS 13.f<\/div><div class=\"qtext\"><p>Rainham Inc. pays 35% taxes based on the U.S. tax laws and pays a dividend of $0.90 a share. Assuming that the investor who receives Rainham Inc.&#x27;s dividend is in the 15% tax bracket. The effective tax rate on a dollar of earnings paid out as dividends will be:<\/p><\/div>", "subj": "corporate"}, {"n": 37, "q": "Which type of cash dividend is most likely to be declared by a cyclical firm during good times?", "opts": ["Liquidating dividend.", "Stock dividend.", "Special dividend."], "ans": "C", "expl": "Special dividends are used when favorable circumstances allow the firm to make a one-time cash payment to shareholders, in addition to any regular dividends the firm pays. Many cyclical firms (e.g., automakers) will use a special dividend to share profits with shareholders when times are good but maintain the flexibility to conserve cash when profits are down. Other names for special dividends include extra dividends and irregular dividends. Liquidating dividends occur when a company ceases to operate and distributes any equity proceeds to shareholders. Stock dividends are paid out in shares of stock rather than cash and are similar to stock splits.", "explhtml": "<p>Special dividends are used when favorable circumstances allow the firm to make a one-time cash payment to shareholders, in addition to any regular dividends the firm pays. Many cyclical firms (e.g., automakers) will use a special dividend to share profits with shareholders when times are good but maintain the flexibility to conserve cash when profits are down. Other names for special dividends include extra dividends and irregular dividends.<\/p><p>Liquidating dividends occur when a company ceases to operate and distributes any equity proceeds to shareholders. Stock dividends are paid out in shares of stock rather than cash and are similar to stock splits.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.1, LOS 13.a<\/div><div class=\"qtext\"><p>Which type of cash dividend is most likely to be declared by a cyclical firm during good times?<\/p><\/div>", "subj": "corporate"}, {"n": 38, "q": "Compared to a Dutch auction tender offer, when a firm uses a fixed price tender offer it is more likely that the fixed price tender offer will:", "opts": ["result in a lower buyback price.", "send a positive signal to investors.", "require a greater amount of time to complete."], "ans": "B", "expl": "The premium offered in a fixed price tender offer provides a positive signal to investors about management's view of the stock's value. Dutch auctions can be accomplished quickly, but usually not as quickly as fixed price tender offers. Dutch auctions generally enable a company to do the buyback at a lower price than with a fixed price tender offer.", "explhtml": "<p>The premium offered in a fixed price tender offer provides a positive signal to investors about management&#x27;s view of the stock&#x27;s value. Dutch auctions can be accomplished quickly, but usually not as quickly as fixed price tender offers. Dutch auctions generally enable a company to do the buyback at a lower price than with a fixed price tender offer.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.2, LOS 13.i<\/div><div class=\"qtext\"><p>Compared to a Dutch auction tender offer, when a firm uses a fixed price tender offer it is more likely that the fixed price tender offer will:<\/p><\/div>", "subj": "corporate"}, {"n": 39, "q": "Dividend safety is most likely evidenced by:", "opts": ["Increase in FCFE coverage ratio but not be dividend coverage ratio.", "Increase in dividend and FCFE coverage ratios.", "Increase in dividend coverage ratio but not by FCFE coverage ratio."], "ans": "B", "expl": "Both dividend and FCFE coverage ratios are indicators of dividend safety. FCFE coverage is simply more comprehensive measure and takes into account all cash distributed to shareholders.", "explhtml": "<p>Both dividend and FCFE coverage ratios are indicators of dividend safety. FCFE coverage is simply more comprehensive measure and takes into account all cash distributed to shareholders.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.2, LOS 13.m<\/div><div class=\"qtext\"><p>Dividend safety is most likely evidenced by:<\/p><\/div>", "subj": "corporate"}, {"n": 40, "q": "Which of the following would be least likely to prompt a decline in a company's overall payout ratio?", "opts": ["A permanent decrease in company profitability.", "A decrease in the capital gains tax rate.", "An increase in interest rates."], "ans": "A", "expl": "A permanent decrease in profits is expected to result in a decrease in the dividend payment level; however this would probably not lead to a decrease in the payout ratio. If interest rates were to increase, it would make retained earnings a more attractive way of financing new investment; as a result, the payout ratio would be more likely to decline. A decrease in the capital gains tax rate would (for investors that pay tax) make capital gains more appealing; accordingly, aggregate payout ratios would be expected to decline.", "explhtml": "<p>A permanent decrease in profits is expected to result in a decrease in the dividend payment level; however this would probably not lead to a decrease in the payout ratio. If interest rates were to increase, it would make retained earnings a more attractive way of financing new investment; as a result, the payout ratio would be more likely to decline. A decrease in the capital gains tax rate would (for investors that pay tax) make capital gains more appealing; accordingly, aggregate payout ratios would be expected to decline.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.1, LOS 13.e<\/div><div class=\"qtext\"><p>Which of the following would be least likely to prompt a decline in a company&#x27;s overall payout ratio?<\/p><\/div>", "subj": "corporate"}, {"n": 41, "q": "In a world with taxes and brokerage costs:", "opts": ["Modigliani and Miller say that dividend policy is relevant.", "dividend policy may be relevant.", "Modigliani and Miller say that dividend policy is irrelevant."], "ans": "B", "expl": "Modigliani and Miller assume a world without taxes and transaction costs. They (correctly) claim that the validity of their theory should be judged on empirical tests, not the realism of their assumptions. Myron Gordon and John Lintner have championed the \"bird-in-the-hand\" theory, which gives greater value to firms with high dividend yields because investors perceive dividends to be less risky than capital gains.", "explhtml": "<p>Modigliani and Miller assume a world without taxes and transaction costs. They (correctly) claim that the validity of their theory should be judged on empirical tests, not the realism of their assumptions. Myron Gordon and John Lintner have championed the &quot;bird-in-the-hand&quot; theory, which gives greater value to firms with high dividend yields because investors perceive dividends to be less risky than capital gains.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.1, LOS 13.b<\/div><div class=\"qtext\"><p>In a world with taxes and brokerage costs:<\/p><\/div>", "subj": "corporate"}, {"n": 42, "q": "Which of the following statements about dividend policy is most accurate?", "opts": ["A person who believes in the agency cost effect and a proponent of the \"bird-inhand\" theory would have opposite views on dividend payout policy.", "A person who believes in bird-in-hand theory would have the same view as one that subscribes to the clientele theory.", "Investors view a stock repurchase as a positive signal and a stock issue as a negative signal."], "ans": "C", "expl": "Investors view a stock repurchase as a positive signal and a stock issue as a negative signal. A repurchase may mean that management believes the stock is undervalued. The other statements are false. A person who believes in the clientele effect and a proponent of the \"bird-in-hand\" theory would not have similar views on dividend policy. Clientele theory argues that different customers have different tax and other concerns and therefore will gravitate toward companies with payout policies that address those concerns. Under the agency cost theory, dividends reduce free cash flow that managers can use for empire building and hence, a high payout is preferred. According to the \"bird-in-hand\" theory, investors prefer dividends to capital appreciation because they view the former (D₁ / P₀) as less risky than the latter (g, or growth rate). Both approaches have similar (and not opposite) views on dividend policy.", "explhtml": "<p>Investors view a stock repurchase as a positive signal and a stock issue as a negative signal. A repurchase may mean that management believes the stock is undervalued.<\/p><p>The other statements are false. A person who believes in the clientele effect and a proponent of the &quot;bird-in-hand&quot; theory would not have similar views on dividend policy. Clientele theory argues that different customers have different tax and other concerns and therefore will gravitate toward companies with payout policies that address those concerns. Under the agency cost theory, dividends reduce free cash flow that managers can use for empire building and hence, a high payout is preferred. According to the &quot;bird-in-hand&quot; theory, investors prefer dividends to capital appreciation because they view the former (D<sub>1<\/sub> / P<sub>0<\/sub>) as less risky than the latter (g, or growth rate). Both approaches have similar (and not opposite) views on dividend policy.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.1, LOS 13.d<\/div><div class=\"qtext\"><p>Which of the following statements about dividend policy is most accurate?<\/p><\/div>", "subj": "corporate"}, {"n": 43, "q": "What is the impact on shareholder wealth of a share repurchase versus cash dividend of equal amount when the tax treatment of the two alternatives is the same?", "opts": ["A share repurchase will always lead to higher total shareholder wealth than a cash dividend of an equal amount.", "A share repurchase will sometimes lead to higher total shareholder wealth than a cash dividend of an equal amount.", "A share repurchase is equivalent to a cash dividend of an equal amount, so total shareholder wealth will be the same."], "ans": "C", "expl": "Assuming that the tax treatment of a share repurchase and a cash dividend of equal amount is the same, a share repurchase is equivalent to a cash dividend payment, and shareholder wealth will be the same.", "explhtml": "<p>Assuming that the tax treatment of a share repurchase and a cash dividend of equal amount is the same, a share repurchase is equivalent to a cash dividend payment, and shareholder wealth will be the same.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.2, LOS 13.l<\/div><div class=\"qtext\"><p>What is the impact on shareholder wealth of a share repurchase versus cash dividend of equal amount when the tax treatment of the two alternatives is the same?<\/p><\/div>", "subj": "corporate"}, {"n": 44, "q": "Last year, Calfee Multimedia had earnings of $4.00 per share and paid a dividend of $0.30. In the current year, the company expects to earn $5.20 per share. Calfee has a 30% target payout ratio. If the expected dividend for this year is $0.51, what time period is Calfee most likely using in order to bring its dividend up to the target payout?", "opts": ["5 years.", "6 years.", "4 years."], "ans": "B", "expl": "The formula to determine the expected dividend increase in a target payout approach is: Expected increase in dividends = [(expected earnings × target payout ratio) - previous dividend] × adjustment factor where the adjustment factor is 1 / number of years over which the adjustment will take place. Using the numbers given: $0.51 − $0.30 = [($5.20 × 0.30) − $0.30] × (1 / n) $0.21 = [$1.26] × (1 / n) $0.21 / $1.26 = 1 / n n = $1.26 / $0.21 n = 6", "explhtml": "<p>The formula to determine the expected dividend increase in a target payout approach is:<\/p><p>Expected increase in dividends = [(expected earnings × target payout ratio) - previous dividend] × adjustment factor<\/p><p>where the adjustment factor is 1 / number of years over which the adjustment will take place.<\/p><p>Using the numbers given:<\/p><p>$0.51 − $0.30 = [($5.20 × 0.30) − $0.30] × (1 / n)<\/p><p>$0.21 = [$1.26] × (1 / n)<\/p><p>$0.21 / $1.26 = 1 / n<\/p><p>n = $1.26 / $0.21<\/p><p>n = 6<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.2, LOS 13.g<\/div><div class=\"qtext\"><p>Last year, Calfee Multimedia had earnings of $4.00 per share and paid a dividend of $0.30. In the current year, the company expects to earn $5.20 per share. Calfee has a 30% target payout ratio. If the expected dividend for this year is $0.51, what time period is Calfee most likely using in order to bring its dividend up to the target payout?<\/p><\/div>", "subj": "corporate"}, {"n": 45, "q": "Which of the following statements about differences observed in ends—is a benefit. A company that foresees few profitable investment opportunities tends to pay out more in dividends, since these opportunities would otherwise be funded with cash flows from earnings.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.1, LOS 13.e<\/div><div class=\"qtext\"><p>Which of the following is most likely to prompt a company to increase dividend payments? A company&#x27;s management foresees:<\/p><\/div>", "subj": "corporate"}, {"n": 50, "q": "International Pulp, a Swiss-based paper company, has annual pretax earnings (in Swiss francs) of SF 600. The corporate tax rate on retained earnings is 55%, and the corporate tax rate that applies to earnings paid out as dividends is 30%. Furthermore, International Pulp pays out 30% of its earnings as dividends, and the individual tax rate that applies to dividends is 40%. What is the effective tax rate on corporate earnings paid out as dividends?", "opts": ["70%.", "58%.", "48%."], "ans": "B", "expl": "This is an example of a split-rate corporate tax system. The calculation of the effective tax rate on a Swiss franc of corporate income distributed as dividends is based on the corporate tax rate for distributed income. The effective tax rate on income distributed as dividends = 30% + [(1 − 30%) × 40%] = 58%.", "explhtml": "<p>This is an example of a split-rate corporate tax system. The calculation of the effective tax rate on a Swiss franc of corporate income distributed as dividends is based on the corporate tax rate for distributed income.<\/p><p>The effective tax rate on income distributed as dividends = 30% + [(1 − 30%) × 40%] = 58%.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 13.1, LOS 13.f<\/div><div class=\"qtext\"><p>International Pulp, a Swiss-based paper company, has annual pretax earnings (in Swiss francs) of SF 600. The corporate tax rate on retained earnings is 55%, and the corporate tax rate that applies to earnings paid out as dividends is 30%. Furthermore, International Pulp pays o const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){

})();

      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);

    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);

      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));

}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
