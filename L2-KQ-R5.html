<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 5 — Currency Exchange Rates - Understanding Equilibrium Value · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>

  .back-btn{font-weight:600}

  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));

    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);

    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>

<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>

<script>
const DATA = [{"n": 1, "q": "Zimbaya is a developed economy with high capital mobility. Deborah Isaccson is evaluating the Zim (Z$), the national currency of Zimbaya. Which of the following is most likely to lead to appreciation of Z$? If Zimbaya starts following:", "opts": ["an expansionary fiscal policy.", "a restrictive fiscal policy.", "a loose monetary policy."], "ans": "A", "expl": "If Zimbaya follows an expansionary fiscal policy, government borrowing will increase leading to an increase in interest rates. This increase in interest rates will attract capital inflows to Zimbaya, leading to an appreciation of the Z$. Either an expansionary (\"loose\") monetary policy or a restrictive fiscal policy should lead to lower interest rates and to depreciation of Z$.", "explhtml": "<p>If Zimbaya follows an expansionary fiscal policy, government borrowing will increase leading to an increase in interest rates. This increase in interest rates will attract capital inflows to Zimbaya, leading to an appreciation of the Z$. Either an expansionary (&quot;loose&quot;) monetary policy or a restrictive fiscal policy should lead to lower interest rates and to depreciation of Z$.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.3, LOS 5.k<\/div><div class=\"qtext\"><p>Zimbaya is a developed economy with high capital mobility. Deborah Isaccson is evaluating the Zim (Z$), the national currency of Zimbaya. Which of the following is most likely to lead to appreciation of Z$? If Zimbaya starts following:<\/p><\/div>", "subj": "economics"}, {"n": 2, "q": "Donna Ackerman, CFA, is an analyst in the currency trading department at State Bank. Ackerman is training a new hire, Fred Bos, a recent college graduate with a BA in economics. Ackerman and Bos have the following information available to them: Spot Rates    Bid Price Ask Price EUR/USD €1.0000 €1.0015 GBP/USD £2.0000 £2.0100 EUR/GBP €0.3985 €0.4000 Ackerman and Bos are interested in pursuing profitable arbitrage opportunities for State Bank. What will be the profits from triangular arbitrage, starting with $1,000?", "opts": ["$248.46.", "$245.65.", "$243.78."], "ans": "C", "expl": "The EUR/USD and GBP/USD rates imply that the arbitrage free cross rates for the EUR/GBP are: bid = €1.000/₤2.0100 = €0.4975 ask = €1.0015/₤2.0000 = €0.5008 Since the cross rates given (€0.3985 − €0.4000) are outside of the arbitrage-free cross rates, profitable arbitrage is available. It takes too few euros to buy 1 pound, so we want our arbitrage trades to go in the direction that will cause us to sell overvalued euros for pounds at the ask rate of €0.4000. Start with $1,000. Use the $1,000 to buy euros ($1,000 × €1.000/$) = €1,000. Use the €1,000 to buy sterling (€1,000 / €0.4000/₤) = ₤2,500. Use the ₤2,500 to buy dollars (₤2,500 / ₤2.0100/$) = $1,243.78.", "explhtml": "<p>The EUR/USD and GBP/USD rates imply that the arbitrage free cross rates for the EUR/GBP are: bid = €1.000/₤2.0100 = €0.4975<\/p><p>ask = €1.0015/₤2.0000 = €0.5008<\/p><p>Since the cross rates given (€0.3985 − €0.4000) are outside of the arbitrage-free cross rates, profitable arbitrage is available.<\/p><p>It takes too few euros to buy 1 pound, so we want our arbitrage trades to go in the direction that will cause us to sell overvalued euros for pounds at the ask rate of €0.4000.<\/p><p>Start with $1,000.<\/p><p>Use the $1,000 to buy euros ($1,000 × €1.000/$) = €1,000. Use the €1,000 to buy sterling (€1,000 / €0.4000/₤) = ₤2,500.<\/p><p>Use the ₤2,500 to buy dollars (₤2,500 / ₤2.0100/$) = $1,243.78.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.1, LOS 5.b<\/div><div class=\"qtext\"><p>Donna Ackerman, CFA, is an analyst in the currency trading department at State Bank. Ackerman is training a new hire, Fred Bos, a recent college graduate with a BA in economics.<\/p><p>Ackerman and Bos have the following information available to them:<\/p><div class=\"tbl\"><table><tr><td colspan=3>Spot Rates<\/td><\/tr><tr><td><\/td><td>Bid Price<\/td><td>Ask Price<\/td><\/tr><tr><td>EUR/USD<\/td><td>€1.0000<\/td><td>€1.0015<\/td><\/tr><tr><td>GBP/USD<\/td><td>£2.0000<\/td><td>£2.0100<\/td><\/tr><tr><td>EUR/GBP<\/td><td>€0.3985<\/td><td>€0.4000<\/td><\/tr><\/table><\/div><p>Ackerman and Bos are interested in pursuing profitable arbitrage opportunities for State Bank. What will be the profits from triangular arbitrage, starting with $1,000?<\/p><\/div>", "subj": "economics"}, {"n": 3, "q": "Ninety days ago, Marc Samuelson entered into a 180-day forward contract to purchase 1 million CHF at an all-in rate of $1.0225/CHF. The following USD/CHF quotes are currently available in the market: Spot 1.0301/1.0302 30 days –12.3/–11.9 90 days –16.0/–14.8 180 days –18.9/–17.8 Interest rates: 90-day CHF 1.02% 180-day CHF 1.03% 90-day USD 1.00% 180-day USD 0.99% The mark-to-market value of Samuelson's position is closest to:", "opts": ["$5,985.", "$7,585.", "–$6,735."], "ans": "A", "expl": "Samuelson is currently long CHF in the forward market. Closing or offsetting that position requires a short forward contract in CHF (i.e., A contract to convert CHF into USD). To calculate the mark-to-market value, we first need to have the forward all-in bid price: 1.0301 – (16.0/10,000) = 1.0285. Mark-to-market value = (FPₜ-FP)(contract size)  (1.0285−1.0225)(1,000,000) | =  = $5, 985 | days  90 | (1+(0.01(  )) | (1+R  ) 360 360", "explhtml": "<p>Samuelson is currently long CHF in the forward market. Closing or offsetting that position requires a short forward contract in CHF (i.e., A contract to convert CHF into USD). To calculate the mark-to-market value, we first need to have the forward all-in bid price: 1.0301 – (16.0/10,000) = 1.0285.<\/p><p>Mark-to-market value =<\/p><div class=\"tbl\"><table><tr><td>(FP<sub>t<\/sub>-FP)(contract size)<\/td><td>(1.0285−1.0225)(1,000,000)<\/td><\/tr><tr><td>=<\/td><td>= $5, 985<\/td><\/tr><tr><td>days<\/td><td>90<\/td><\/tr><tr><td>(1+(0.01(<\/td><td>))<\/td><\/tr><tr><td>(1+R<\/td><td>)<\/td><\/tr><\/table><\/div><p>360<\/p><p>360<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.2, LOS 5.d<\/div><div class=\"qtext\"><p>Ninety days ago, Marc Samuelson entered into a 180-day forward contract to purchase 1 million CHF at an all-in rate of $1.0225/CHF.<\/p><p>The following USD/CHF quotes are currently available in the market:<\/p><div class=\"tbl\"><table><tr><td>Spot<\/td><td>1.0301/1.0302<\/td><\/tr><tr><td>30 days<\/td><td>–12.3/–11.9<\/td><\/tr><tr><td>90 days<\/td><td>–16.0/–14.8<\/td><\/tr><tr><td>180 days<\/td><td>–18.9/–17.8<\/td><\/tr><\/table><\/div><p>Interest rates:<\/p><div class=\"tbl\"><table><tr><td>90-day CHF<\/td><td>1.02%<\/td><\/tr><tr><td>180-day CHF<\/td><td>1.03%<\/td><\/tr><tr><td>90-day USD<\/td><td>1.00%<\/td><\/tr><tr><td>180-day USD<\/td><td>0.99%<\/td><\/tr><\/table><\/div><p>The mark-to-market value of Samuelson&#x27;s position is closest to:<\/p><\/div>", "subj": "economics"}, {"n": 4, "q": "Given currency quotes in DC/FC, if: 1 + rDC < (1 + rFC) × (forward rate/ spot rate) funds will:", "opts": ["flow into the domestic country.", "flow out of the domestic country.", "flow in and out of the domestic country."], "ans": "B", "expl": "This equation is Interest Rate Parity rearranged! If the term on the left (1 + rDC), is less than the term on the right, it means that the domestic rate is low relative to the hedged foreign rate. Therefore, there is a profitable arbitrage from borrowing the domestic currency and lending at the foreign interest rate. Because we lend in the foreign market, we say that the funds flow out of the domestic economy.", "explhtml": "<p>This equation is Interest Rate Parity rearranged! If the term on the left (1 + r<sub>DC<\/sub>), is less than the term on the right, it means that the domestic rate is low relative to the hedged foreign rate. Therefore, there is a profitable arbitrage from borrowing the domestic currency and lending at the foreign interest rate. Because we lend in the foreign market, we say that the funds flow out of the domestic economy.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.2, LOS 5.e<\/div><div class=\"qtext\"><p>Given currency quotes in DC/FC, if: 1 + r<sub>DC<\/sub> &lt; (1 + r<sub>FC<\/sub>) × (forward rate/ spot rate) funds will:<\/p><\/div>", "subj": "economics"}, {"n": 5, "q": "The following information is gathered for three countries: Country Comment A Current account deficit is very large relative to GDP B Imports highly price-elastic goods C Exports global commodities Which country will most likely see its current account deficit restored to sustainable level more rapidly under the flows mechanism of balance of payments?", "opts": ["Country A.", "Country C.", "Country B."], "ans": "C", "expl": "Countries with lower initial current account deficits, with import and export prices sensitive to exchange rate movements and with imports and exports with high price elasticity of demand would see their current account deficits quickly restored to sustainable level due to depreciation of their currency. Country B imports goods that have high price elasticity. Country A has large current account deficit and hence will take time to adjust to sustainable level. Country C exports commodities whose global prices are not sensitive to their own currency's values.", "explhtml": "<p>Countries with lower initial current account deficits, with import and export prices sensitive to exchange rate movements and with imports and exports with high price elasticity of demand would see their current account deficits quickly restored to sustainable level due to depreciation of their currency. Country B imports goods that have high price elasticity. Country A has large current account deficit and hence will take time to adjust to sustainable level. Country C exports commodities whose global prices are not sensitive to their own currency&#x27;s values.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.3, LOS 5.j<\/div><div class=\"qtext\"><p>The following information is gathered for three countries:<\/p><div class=\"tbl\"><table><tr><td>Country<\/td><td>Comment<\/td><\/tr><tr><td>A<\/td><td>Current account deficit is very large relative to GDP<\/td><\/tr><tr><td>B<\/td><td>Imports highly price-elastic goods<\/td><\/tr><tr><td>C<\/td><td>Exports global commodities<\/td><\/tr><\/table><\/div><p>Which country will most likely see its current account deficit restored to sustainable level more rapidly under the flows mechanism of balance of payments?<\/p><\/div>", "subj": "economics"}, {"n": 6, "q": "Ashok Jain is assessing the currency value of Lutina. Jain believes that prices are sticky in the short term and, hence, do not immediately reflect changes in monetary policy. If Lutina announces a change to a restrictive monetary policy, Jain would most likely conclude that Lutina's currency would:", "opts": ["excessively appreciate in the short-term.", "excessively depreciate in the long-term.", "excessively appreciate in the long-term."], "ans": "A", "expl": "Dornbusch overshooting model. This model assumes that prices are sticky (inflexible) in the short term and, hence, do not immediately reflect changes in monetary policy. The model concludes that exchange rates will overshoot the long-run PPP value in the short term. A restrictive monetary policy leads to excessive appreciation of the domestic currency in the short term and then a slow depreciation toward the long-term PPP value.", "explhtml": "<p>Dornbusch overshooting model. This model assumes that prices are sticky (inflexible) in the short term and, hence, do not immediately reflect changes in monetary policy.<\/p><p>The model concludes that exchange rates will overshoot the long-run PPP value in the short term. A restrictive monetary policy leads to excessive appreciation of the domestic currency in the short term and then a slow depreciation toward the long-term PPP value.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.3, LOS 5.k<\/div><div class=\"qtext\"><p>Ashok Jain is assessing the currency value of Lutina. Jain believes that prices are sticky in the short term and, hence, do not immediately reflect changes in monetary policy. If Lutina announces a change to a restrictive monetary policy, Jain would most likely conclude that Lutina&#x27;s currency would:<\/p><\/div>", "subj": "economics"}, {"n": 7, "q": "Which of the following is least likely a warning sign of an impending currency crisis?", "opts": ["Official foreign exchange reserves decline dramatically.", "Floating exchange rates.", "Currency value is substantially higher than the mean-reverting level."], "ans": "B", "expl": "Warning sign of an impending currency crisis is when exchange rates are fixed or partially fixed (and not floating).", "explhtml": "<p>Warning sign of an impending currency crisis is when exchange rates are fixed or partially fixed (and not floating).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.3, LOS 5.m<\/div><div class=\"qtext\"><p>Which of the following is least likely a warning sign of an impending currency crisis?<\/p><\/div>", "subj": "economics"}, {"n": 8, "q": "Under high capital mobility, the Mundell-Fleming model to determine exchange rate focuses on the impact of:", "opts": ["inflation.", "trade balance.", "interest rates."], "ans": "C", "expl": "Mundell-Fleming approach focuses on the role of interest rate in exchange rate determination. Mundell-Fleming model does not explicitly take into account the role of inflation.", "explhtml": "<p>Mundell-Fleming approach focuses on the role of interest rate in exchange rate determination. Mundell-Fleming model does not explicitly take into account the role of inflation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.3, LOS 5.k<\/div><div class=\"qtext\"><p>Under high capital mobility, the Mundell-Fleming model to determine exchange rate focuses on the impact of:<\/p><\/div>", "subj": "economics"}, {"n": 9, "q": "An investor has entered into a 90-day forward contract to purchase 2 million GBP at an all-in rate of USD 1.4612. In 30 days, the following quotes were available:  USD/GBP spot rate 1.4522−24 30-day forward rate 1.4618−21 60-day forward rate 1.4621−25 90-day forward rate 1.4632−36 Interest rate information: Interest rates When contract was initiated  Currently (t=30)   USD GBP USD GBP 30-day 0.20% 0.32% 0.20% 0.32% 60-day 0.21% 0.32% 0.21% 0.32% 90-day 0.21% 0.33% 0.21% 0.33% The mark-to-market value of the forward contract is closest to:", "opts": ["USD 2599.", "USD 1999.", "USD 1800."], "ans": "C", "expl": "To unwind the forward contract, the investor would enter into a 60-day forward contract to sell GBP. The relevant exchange rate is 1.4621. The value obtained will be in price currency (USD) and would be discounted at USD interest rate for 60 days (at t=30). (FPₜ−FP)(contract size)  (1.4621−1.4612)(2,000,000) | Vₜ =  =  = 1799 days [1+R(  )]  [1+0.0021(  )] 60 360  360", "explhtml": "<p>To unwind the forward contract, the investor would enter into a 60-day forward contract to sell GBP. The relevant exchange rate is 1.4621. The value obtained will be in price currency (USD) and would be discounted at USD interest rate for 60 days (at t=30).<\/p><div class=\"tbl\"><table><tr><td>(FP<sub>t<\/sub>−FP)(contract size)<\/td><td>(1.4621−1.4612)(2,000,000)<\/td><\/tr><tr><td>V<sub>t<\/sub> =<\/td><td>=<\/td><td>= 1799<\/td><\/tr><\/table><\/div><p>days [1+R( &nbsp; )] &nbsp; [1+0.0021( &nbsp; )]<\/p><p>60 360 &nbsp; 360<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.2, LOS 5.d<\/div><div class=\"qtext\"><p>An investor has entered into a 90-day forward contract to purchase 2 million GBP at an all-in rate of USD 1.4612. In 30 days, the following quotes were available:<\/p><div class=\"tbl\"><table><tr><td><\/td><td>USD/GBP<\/td><\/tr><tr><td>spot rate<\/td><td>1.4522−24<\/td><\/tr><tr><td>30-day forward rate<\/td><td>1.4618−21<\/td><\/tr><tr><td>60-day forward rate<\/td><td>1.4621−25<\/td><\/tr><tr><td>90-day forward rate<\/td><td>1.4632−36<\/td><\/tr><\/table><\/div><p>Interest rate information:<\/p><div class=\"tbl\"><table><tr><td>Interest rates<\/td><td colspan=2>When contract was initiated<\/td><td colspan=2>Currently (t=30)<\/td><\/tr><tr><td><\/td><td>USD<\/td><td>GBP<\/td><td>USD<\/td><td>GBP<\/td><\/tr><tr><td>30-day<\/td><td>0.20%<\/td><td>0.32%<\/td><td>0.20%<\/td><td>0.32%<\/td><\/tr><tr><td>60-day<\/td><td>0.21%<\/td><td>0.32%<\/td><td>0.21%<\/td><td>0.32%<\/td><\/tr><tr><td>90-day<\/td><td>0.21%<\/td><td>0.33%<\/td><td>0.21%<\/td><td>0.33%<\/td><\/tr><\/table><\/div><p>The mark-to-market value of the forward contract is closest to:<\/p><\/div>", "subj": "economics"}, {"n": 10, "q": "Assume an investor living in Japan can borrow in the domestic yen (JPY) or in the foreign U.S. dollar (USD). Given the following information, determine whether an arbitrage opportunity exists. If so, how much would the investor profit by borrowing JPY 58,175,000 or the equivalent in USD? (Assume a period of one year.) Spot rate (JPY/USD) 116.35 Forward rate (JPY/USD) 112.99 Domestic (Japanese) interest rate (%) 1.50 Foreign (U.S.) interest rate (%) 4.00", "opts": ["An arbitrage opportunity results in a profit of JPY 27,963.", "An arbitrage opportunity results in a profit of JPY 292,825.", "An arbitrage opportunity results in a profit of JPY 25,170."], "ans": "B", "expl": "Step 1: Determine whether an arbitrage opportunity exists. F = S0 (1 + rJPY) / (1 + rUS) = 116.35 (1.015) / (1.04) = 113.55, which is greater than market forward price of 112.99 (i.e., USD is undervalued in the forward market). Step 2: Borrow Domestic or Foreign? The sign on the result of step 1 is positive, so borrow foreign. (rd − rf)  (Forward − Spot) / Spot (0.01500 − 0.04000)  (112.99000 − 116.35000) / 116.35000 -0.02500 > -0.02888 Step 3: Arbitrage Process Description Rate Calculation Result Calculate foreign equivalent &\nborrow this amount. Spot JPY 58,175,000 /\n116.35000JPY/USD USD 500,000 Invest Domestic at Domestic\ninterest rate*  JPY 58,175,000 × (1 +\n0.01500) JPY 59,047,625 * This is the amount you will\nhave available to repay the loan.        Calculate loan payoff (foreign\ncurrency)  500,000USD × (1 +\n0.04000) USD (520,000) Calculate payoff in Domestic\ncurrency** Fwd 520,000USD ×\n112.99000JPY/USD JPY\n(58,754,800) **This is the amount you need\nto repay.    Calculate Arbitrage Profit  JPY 59,047,625 − JPY\n58,754,800 JPY 292,825", "explhtml": "<p>Step 1: Determine whether an arbitrage opportunity exists.<\/p><p>F = S0 (1 + r<sub>JPY<\/sub>) / (1 + r<sub>US<\/sub>) = 116.35 (1.015) / (1.04) = 113.55, which is greater than market forward price of 112.99 (i.e., USD is undervalued in the forward market).<\/p><p>Step 2: Borrow Domestic or Foreign?<\/p><p>The sign on the result of step 1 is positive, so borrow foreign.<\/p><div class=\"tbl\"><table><tr><td>(rd − rf)<\/td><td><\/td><td>(Forward − Spot) / Spot<\/td><\/tr><tr><td>(0.01500 − 0.04000)<\/td><td><\/td><td>(112.99000 − 116.35000) / 116.35000<\/td><\/tr><tr><td>-0.02500<\/td><td>&gt;<\/td><td>-0.02888<\/td><\/tr><\/table><\/div><p>Step 3: Arbitrage Process<\/p><div class=\"tbl\"><table><tr><td>Description<\/td><td>Rate<\/td><td>Calculation<\/td><td>Result<\/td><\/tr><tr><td>Calculate foreign equivalent &amp;<br>borrow this amount.<\/td><td>Spot<\/td><td>JPY 58,175,000 /<br>116.35000JPY/USD<\/td><td>USD 500,000<\/td><\/tr><tr><td>Invest Domestic at Domestic<br>interest rate*<\/td><td><\/td><td>JPY 58,175,000 × (1 +<br>0.01500)<\/td><td>JPY 59,047,625<\/td><\/tr><tr><td>* This is the amount you will<br>have available to repay the loan.<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Calculate loan payoff (foreign<br>currency)<\/td><td><\/td><td>500,000USD × (1 +<br>0.04000)<\/td><td>USD (520,000)<\/td><\/tr><tr><td>Calculate payoff in Domestic<br>currency**<\/td><td>Fwd<\/td><td>520,000USD ×<br>112.99000JPY/USD<\/td><td>JPY<br>(58,754,800)<\/td><\/tr><tr><td>**This is the amount you need<br>to repay.<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Calculate Arbitrage Profit<\/td><td><\/td><td>JPY 59,047,625 − JPY<br>58,754,800<\/td><td>JPY 292,825<\/td><\/tr><\/table><\/div>", "qhtml": "<div class=\"pp-topic\">Module 5.2, LOS 5.e<\/div><div class=\"qtext\"><p>Assume an investor living in Japan can borrow in the domestic yen (JPY) or in the foreign U.S. dollar (USD). Given the following information, determine whether an arbitrage opportunity exists. If so, how much would the investor profit by borrowing JPY 58,175,000 or the equivalent in USD? (Assume a period of one year.)<\/p><div class=\"tbl\"><table><tr><td>Spot rate (JPY/USD)<\/td><td>116.35<\/td><\/tr><tr><td>Forward rate (JPY/USD)<\/td><td>112.99<\/td><\/tr><tr><td>Domestic (Japanese) interest rate (%)<\/td><td>1.50<\/td><\/tr><tr><td>Foreign (U.S.) interest rate (%)<\/td><td>4.00<\/td><\/tr><\/table><\/div><\/div>", "subj": "economics"}, {"n": 11, "q": "Assume that the domestic nominal rate of return is 4% and the foreign nominal rate of return is 5%. If the current exchange rate is DC/FC 0.400, the forward rate consistent with covered interest rate parity is:", "opts": ["0.400.", "0.396.", "0.318."], "ans": "B", "expl": "F/S = (1 + rD) / (1 + rF) where the currency is quoted as DC/FC F = (1.04/1.05)(0.400) = 0.396", "explhtml": "<p>F/S = (1 + r<sub>D<\/sub>) / (1 + r<sub>F<\/sub>) where the currency is quoted as DC/FC<\/p><p>F = (1.04/1.05)(0.400) = 0.396<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.2, LOS 5.g<\/div><div class=\"qtext\"><p>Assume that the domestic nominal rate of return is 4% and the foreign nominal rate of return is 5%. If the current exchange rate is DC/FC 0.400, the forward rate consistent with covered interest rate parity is:<\/p><\/div>", "subj": "economics"}, {"n": 12, "q": "Ackerman explains to Bos that a theoretical relationship exists between forward rates and future spot rates, called the forward rate parity. This relation suggests that:", "opts": ["the forward rate is an unbiased predictor of the expected future spot rate, and uncovered interest rate parity would not hold.", "the forward rate is a biased predictor of the expected future spot rate, and uncovered interest rate parity would not hold.", "the forward rate is an unbiased predictor of the expected future spot rate, and uncovered interest rate parity would hold."], "ans": "C", "expl": "The forward rate parity is F = E(S1), meaning that the forward rate is an unbiased predictor of the expected future spot rate. If this is the case, uncovered interest rate parity would be same as covered interest rate parity and since covered interest rate parity holds (by arbitrage), uncovered interest rate parity would also hold.", "explhtml": "<p>The forward rate parity is F = E(S1), meaning that the forward rate is an unbiased predictor of the expected future spot rate. If this is the case, uncovered interest rate parity would be same as covered interest rate parity and since covered interest rate parity holds (by arbitrage), uncovered interest rate parity would also hold.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.2, LOS 5.f<\/div><div class=\"qtext\"><p>Ackerman explains to Bos that a theoretical relationship exists between forward rates and future spot rates, called the forward rate parity. This relation suggests that:<\/p><\/div>", "subj": "economics"}, {"n": 13, "q": "The return distribution of FX carry trade is characterized by:", "opts": ["negative skewness and negative excess kurtosis.", "positive skewness and positive excess kurtosis.", "negative skewness and positive excess kurtosis."], "ans": "C", "expl": "FX carry trade return distribution exhibits negative skewness and positive excess kurtosis.", "explhtml": "<p>FX carry trade return distribution exhibits negative skewness and positive excess kurtosis.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.3, LOS 5.i<\/div><div class=\"qtext\"><p>The return distribution of FX carry trade is characterized by:<\/p><\/div>", "subj": "economics"}, {"n": 14, "q": "Assume an investor living in Mauritius can borrow in $ or in Mauritius Rupee (MUR). Given the following information, determine whether an arbitrage opportunity exists. If so, how much would the arbitrageur profit by borrowing MUR 1,000,000 or the equivalent in $? (Assume a period of one year and state the profit in domestic currency terms.) Spot rate (MUR/$) 30.73000 Forward rate (MUR/$) 31.50000 Domestic (MUR) interest rate (%) 6.50% Foreign ($) interest rate (%) 5.20% Which of the following is closest to the correct answer?", "opts": ["Borrow domestic. Arbitrage profits are $39,685.", "Borrow $. Arbitrage profits are $13,340.", "Borrow MUR. Arbitrage profits are MUR 13,340."], "ans": "C", "expl": "Step 1: Determine whether an arbitrage opportunity exists. Using CIRP, F = S x (1+rMUR)/(1+r$) = 30.73 (1.065)/(1.052) = 31.11 which is less than the market forward price of 31.50. Hence, $ is overpriced in forward market. We sell $ forward and purchase $ in spot market Step 2: Borrow/Lend which currency? Rule: Lend the currency that you are buying in the spot market and borrow the countercurrency Step 3: Conduct Arbitrage and Calculate Profits. Step Description Rate Calculation Result a Borrow MUR  MUR 1,000,000 MUR 1,000,000 b Exchange MUR for $ Spot = MUR 1,000,000 /\n30.73000 MUR/$ $32,541 c Lend $ at (U.S.) Rate  = $32,541 × (1.05200) $34,233 d Contract to sell proceeds\nfwd1 Fwd = $34,233 × 31.50000\nMUR/$ MUR 1,078,340 e Calculate loan payoff2  = MUR 1,000,000 ×\n(1.06500) MUR 1,065,000 f Calculate profit (d-e)   MUR 13,340 Note: ¹ This is the amount you will have available to repay the loan. ² This is the amount you need to repay.", "explhtml": "<p>Step 1: Determine whether an arbitrage opportunity exists.<\/p><p>Using CIRP, F = S x (1+r<sub>MUR<\/sub>)/(1+r<sub>$<\/sub>) = 30.73 (1.065)/(1.052) = 31.11 which is less than the market forward price of 31.50. Hence, $ is overpriced in forward market. We sell $ forward and purchase $ in spot market<\/p><p>Step 2: Borrow/Lend which currency?<\/p><p>Rule: Lend the currency that you are buying in the spot market and borrow the countercurrency<\/p><p>Step 3: Conduct Arbitrage and Calculate Profits.<\/p><div class=\"tbl\"><table><tr><td>Step<\/td><td>Description<\/td><td>Rate<\/td><td>Calculation<\/td><td>Result<\/td><\/tr><tr><td>a<\/td><td>Borrow MUR<\/td><td><\/td><td>MUR 1,000,000<\/td><td>MUR 1,000,000<\/td><\/tr><tr><td>b<\/td><td>Exchange MUR for $<\/td><td>Spot<\/td><td>= MUR 1,000,000 /<br>30.73000 MUR/$<\/td><td>$32,541<\/td><\/tr><tr><td>c<\/td><td>Lend $ at (U.S.) Rate<\/td><td><\/td><td>= $32,541 × (1.05200)<\/td><td>$34,233<\/td><\/tr><tr><td>d<\/td><td>Contract to sell proceeds<br>fwd1<\/td><td>Fwd<\/td><td>= $34,233 × 31.50000<br>MUR/$<\/td><td>MUR 1,078,340<\/td><\/tr><tr><td>e<\/td><td>Calculate loan payoff2<\/td><td><\/td><td>= MUR 1,000,000 ×<br>(1.06500)<\/td><td>MUR 1,065,000<\/td><\/tr><tr><td>f<\/td><td>Calculate profit (d-e)<\/td><td><\/td><td><\/td><td>MUR 13,340<\/td><\/tr><\/table><\/div><p>Note: <sup>1<\/sup> This is the amount you will have available to repay the loan. <sup>2<\/sup> This is the amount you need to repay.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.2, LOS 5.e<\/div><div class=\"qtext\"><p>Assume an investor living in Mauritius can borrow in $ or in Mauritius Rupee (MUR). Given the following information, determine whether an arbitrage opportunity exists. If so, how much would the arbitrageur profit by borrowing MUR 1,000,000 or the equivalent in $? (Assume a period of one year and state the profit in domestic currency terms.)<\/p><div class=\"tbl\"><table><tr><td>Spot rate (MUR/$)<\/td><td>30.73000<\/td><\/tr><tr><td>Forward rate (MUR/$)<\/td><td>31.50000<\/td><\/tr><tr><td>Domestic (MUR) interest rate (%)<\/td><td>6.50%<\/td><\/tr><tr><td>Foreign ($) interest rate (%)<\/td><td>5.20%<\/td><\/tr><\/table><\/div><p>Which of the following is closest to the correct answer?<\/p><\/div>", "subj": "economics"}, {"n": 15, "q": "Given spot exchange rate of CAD/EUR 1.425-1.435, The spread is closest to:", "opts": ["CAD 0.010", "10 pips EUR", "CAD 0.0010"], "ans": "A", "expl": "Spread = CAD 1.4350 − 1.4250 = CAD 0.010", "explhtml": "<p>Spread = CAD 1.4350 − 1.4250 = CAD 0.010<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.1, LOS 5.a<\/div><div class=\"qtext\"><p>Given spot exchange rate of CAD/EUR 1.425-1.435, The spread is closest to:<\/p><\/div>", "subj": "economics"}, {"n": 16, "q": "Today, the spot rate on pounds sterling is $0.6960 and 90-day forward pounds are priced at $0.6925. The forward discount/premium is:", "opts": ["premium of $0.0035.", "discount of $0.0035.", "premium of $0.0005."], "ans": "B", "expl": "Premium (discount) = F-S = 0.6925-0.696 = -0.0035 (i.e., a discount).", "explhtml": "<p>Premium (discount) = F-S = 0.6925-0.696 = -0.0035 (i.e., a discount).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.1, LOS 5.a<\/div><div class=\"qtext\"><p>Today, the spot rate on pounds sterling is $0.6960 and 90-day forward pounds are priced at $0.6925. The forward discount/premium is:<\/p><\/div>", "subj": "economics"}, {"n": 17, "q": "Which of the following statements about foreign currency bid-ask spreads is least accurate? Foreign currency bid-ask spreads:", "opts": ["increase as the size of the transaction decreases.", "are a function of transaction volume and volatility.", "are influenced by time window in a trading day."], "ans": "A", "expl": "Bid-ask spreads are size related in that the larger the transaction the larger the spread.", "explhtml": "<p>Bid-ask spreads are size related in that the larger the transaction the larger the spread.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.1, LOS 5.a<\/div><div class=\"qtext\"><p>Which of the following statements about foreign currency bid-ask spreads is least accurate? Foreign currency bid-ask spreads:<\/p><\/div>", "subj": "economics"}, {"n": 18, "q": "The domestic interest rate is 9% and the foreign interest rate is 7%. If the forward exchange rate is DC/FC 5.00, what spot exchange rate is consistent with covered interest parity?", "opts": ["5.09.", "4.83.", "4.91."], "ans": "C", "expl": "ForwardDC/FC / SpotDC/FC = (1 + rdomestic) / (1 + rforeign). SpotDC/FC = ForwardDC/FC (1 + rforeign) / (1 + rdomestic) = (5.00)(1.07) / (1.09) = 4.908", "explhtml": "<p>Forward<sub>DC/FC<\/sub> / Spot<sub>DC/FC<\/sub> = (1 + r<sub>domestic<\/sub>) / (1 + r<sub>foreign<\/sub>).<\/p><p>Spot<sub>DC/FC<\/sub> = Forward<sub>DC/FC<\/sub> (1 + r<sub>foreign<\/sub>) / (1 + r<sub>domestic<\/sub>) = (5.00)(1.07) / (1.09) = 4.908<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.2, LOS 5.e<\/div><div class=\"qtext\"><p>The domestic interest rate is 9% and the foreign interest rate is 7%. If the forward exchange rate is DC/FC 5.00, what spot exchange rate is consistent with covered interest parity?<\/p><\/div>", "subj": "economics"}, {"n": 19, "q": "Which of the following statements regarding relative purchasing power parity is most accurate? Relative purchasing power states that exchange rates:", "opts": ["will change to reflect differences in nominal interest rates between countries.", "will change to reflect differences in real interest rates between countries.", "will change to reflect differences in inflation between countries."], "ans": "C", "expl": "Purchasing power parity states that exchange rates will change to reflect differences in inflation between countries. Interest rate parity states that exchange rates must change so that risk-adjusted returns on investments in any currency will be equal.", "explhtml": "<p>Purchasing power parity states that exchange rates will change to reflect differences in inflation between countries. Interest rate parity states that exchange rates must change so that risk-adjusted returns on investments in any currency will be equal.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.2, LOS 5.e<\/div><div class=\"qtext\"><p>Which of the following statements regarding relative purchasing power parity is most accurate? Relative purchasing power states that exchange rates:<\/p><\/div>", "subj": "economics"}, {"n": 20, "q": "Professor Imada Suzaken made the following statement to his economics class: \"If you can earn 8% on A-rated bonds in the U.S. but only 6% on similar bonds in Canada, Canadian investors may want to buy those bonds in the U.S. for the excess return. However, after collecting the extra dollars, the investors would lose those profits when they converted their gains into their home currency.\" Suzaken's statement most accurately describes:", "opts": ["purchasing-power parity.", "uncovered interest-rate parity.", "covered interest rate parity."], "ans": "B", "expl": "Uncovered interest-rate parity is the concept that exchange rates must change so that the return on investments with identical risk will be the same in any currency. Suzaken's statement reflects uncovered interest rate parity. Covered interest rate parity would be applicable if the investor hedges the foreign exchange risk via a forward exchange rate contract.", "explhtml": "<p>Uncovered interest-rate parity is the concept that exchange rates must change so that the return on investments with identical risk will be the same in any currency. Suzaken&#x27;s statement reflects uncovered interest rate parity. Covered interest rate parity would be applicable if the investor hedges the foreign exchange risk via a forward exchange rate contract.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.2, LOS 5.f<\/div><div class=\"qtext\"><p>Professor Imada Suzaken made the following statement to his economics class: &quot;If you can earn 8% on A-rated bonds in the U.S. but only 6% on similar bonds in Canada, Canadian investors may want to buy those bonds in the U.S. for the excess return. However, after collecting the extra dollars, the investors would lose those profits when they converted their gains into their home currency.&quot; Suzaken&#x27;s statement most accurately describes:<\/p><\/div>", "subj": "economics"}, {"n": 21, "q": "Which of the following is least likely the objective of central bank intervention?", "opts": ["reduce excessive inflow of foreign capital.", "have ability to pursue an independent monetary policy.", "prevent appreciation of domestic currency."], "ans": "C", "expl": "Central bank objectives include prevention of excessive appreciation of domestic currency, reduction of excessive foreign capital inflows and pursuit of independent monetary policy.", "explhtml": "<p>Central bank objectives include prevention of excessive appreciation of domestic currency, reduction of excessive foreign capital inflows and pursuit of independent monetary policy.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.3, LOS 5.l<\/div><div class=\"qtext\"><p>Which of the following is least likely the objective of central bank intervention?<\/p><\/div>", "subj": "economics"}, {"n": 22, "q": "If the one-year forward exchange rate is DC/FC 2 and the spot rate is DC/FC 1.9 when the foreign rate of return is 12% and the domestic return is 10%, which of the following statements would be most accurate?", "opts": ["Arbitrage is possible here, investors should borrow foreign, lend domestic.", "The arbitrage possibilities cannot be determined with the data given.", "Arbitrage is possible here, investors should borrow domestic, lend foreign."], "ans": "C", "expl": "Question 1: Is there an arbitrage opportunity? If the result of the following formula (derived from rearranging the interest rate parity condition) is not equal to 0, there is an arbitrage opportunity. (1 + rdomestic) − [((1 + rforeign) × ForwardDC/FC)) / SpotDC/FC] = ? Here, ( 1 + 0.10 ) − [ (( 1 + 0.12 ) × 2.0DC/FC) / 1.9DC/FC] = ( 1.10 − 1.18 ) = −0.08, which is not equal to 0. Arbitrage opportunities exist. Question 2: Borrow Domestic (local) or Foreign? Here are some \"rules\" regarding where to start the arbitrage (where to borrow). These rules only work if there are no transaction costs and only if the currency is quoted in DC/FC terms. Rule 1: If the sign on the result of question 1 is negative, borrow domestic. If the sign is positive, borrow foreign. Here, the sign is negative, so borrow domestic. Rule 2: (rd − rf) < (Forward − Spot) / Spot then Borrow Domestic (rd − rf) > (Forward − Spot) / Spot then Borrow Foreign Here, borrow domestic: (rd − rf) = ( 0.10 − 0.12 ) = −0.02 < (Forward − Spot) / Spot = ( 2.0DC/FC − 1.9DC/FC ) / 1.9DC/FC = 0.05 −0.02 < 0.05 Summary: To take advantage of arbitrage opportunities, borrow domestic and lend foreign.", "explhtml": "<p>Question 1: Is there an arbitrage opportunity?<\/p><p>If the result of the following formula (derived from rearranging the interest rate parity condition) is not equal to 0, there is an arbitrage opportunity.<\/p><p>(1 + r<sub>domestic<\/sub>) − [((1 + r<sub>foreign<\/sub>) × Forward<sub>DC/FC<\/sub>)) / Spot<sub>DC/FC<\/sub>] = ?<\/p><p>Here, ( 1 + 0.10 ) − [ (( 1 + 0.12 ) × 2.0<sub>DC/FC<\/sub>) / 1.9<sub>DC/FC<\/sub>] = ( 1.10 − 1.18 ) = −0.08, which is not equal to 0. Arbitrage opportunities exist.<\/p><p>Question 2: Borrow Domestic (local) or Foreign?<\/p><p>Here are some &quot;rules&quot; regarding where to start the arbitrage (where to borrow). These rules only work if there are no transaction costs and only if the currency is quoted in DC/FC terms.<\/p><p>Rule 1: If the sign on the result of question 1 is negative, borrow domestic. If the sign is positive, borrow foreign. Here, the sign is negative, so borrow domestic.<\/p><p>Rule 2:<\/p><p>(r<sub>d<\/sub> − r<sub>f<\/sub>) &lt; (Forward − Spot) / Spot then Borrow Domestic<\/p><p>(r<sub>d<\/sub> − r<sub>f<\/sub>) &gt; (Forward − Spot) / Spot then Borrow Foreign<\/p><p>Here, borrow domestic:<\/p><p>(r<sub>d<\/sub> − r<sub>f<\/sub>) = ( 0.10 − 0.12 ) = −0.02 &lt; (Forward − Spot) / Spot = ( 2.0<sub>DC/FC<\/sub> − 1.9<sub>DC/FC<\/sub> ) / 1.9<sub>DC/FC<\/sub> = 0.05<\/p><p>−0.02 &lt; 0.05<\/p><p>Summary: To take advantage of arbitrage opportunities, borrow domestic and lend foreign.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.2, LOS 5.e<\/div><div class=\"qtext\"><p>If the one-year forward exchange rate is DC/FC 2 and the spot rate is DC/FC 1.9 when the foreign rate of return is 12% and the domestic return is 10%, which of the following statements would be most accurate?<\/p><\/div>", "subj": "economics"}, {"n": 23, "q": "Given the following information, what is the forward exchange rate implied by interest rate parity? U.S. interest rate = 9%. North Korea interest rate = 10%. Spot rate = 1.65 KPW/$.", "opts": ["1.635 KPW/$.", "1.665 KPW/$.", "0.612 KPW/$."], "ans": "B", "expl": "Forward rate (DC/FC) = Spot Rate (DC/FC) × [(1 + domestic rate) / (1 + foreign rate)], Forward rate = 1 / 1.65 (KPW/$) × (1.09 / 1.10) = 0.60055 $/KPW, or 1.665 KPW/$. Alternatively, forward rate = 1.65 (KPW/$) × (1.10 / 1.09) = 1.665 (KPW/$).", "explhtml": "<p>Forward rate (DC/FC) = Spot Rate (DC/FC) × [(1 + domestic rate) / (1 + foreign rate)],<\/p><p>Forward rate = 1 / 1.65 (KPW/$) × (1.09 / 1.10) = 0.60055 $/KPW, or 1.665 KPW/$.<\/p><p>Alternatively, forward rate = 1.65 (KPW/$) × (1.10 / 1.09) = 1.665 (KPW/$).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.2, LOS 5.g<\/div><div class=\"qtext\"><p>Given the following information, what is the forward exchange rate implied by interest rate parity?<\/p><p>U.S. interest rate = 9%. North Korea interest rate = 10%. Spot rate = 1.65 KPW/$.<\/p><\/div>", "subj": "economics"}, {"n": 24, "q": "One-year interest rates are 7.5% in the U.S. and 6.0% in New Zealand. The current spot exchange rate is USD/NZD 0.5500. If uncovered interest rate parity holds, the expected spot rate in one year must be closest to:", "opts": ["USD/NZD 0.56675.", "USD/NZD 0.55825.", "USD/NZD 0.54233."], "ans": "B", "expl": "USD interest rate is 1.5% higher hence, NZD will appreciate by 1.5% under the uncovered interest rate parity. Expected Spot = 0.5500 × (1.015) = USD/NZD 0.55825", "explhtml": "<p>USD interest rate is 1.5% higher hence, NZD will appreciate by 1.5% under the uncovered interest rate parity.<\/p><p>Expected Spot = 0.5500 × (1.015) = USD/NZD 0.55825<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.2, LOS 5.e<\/div><div class=\"qtext\"><p>One-year interest rates are 7.5% in the U.S. and 6.0% in New Zealand. The current spot exchange rate is USD/NZD 0.5500. If uncovered interest rate parity holds, the expected spot rate in one year must be closest to:<\/p><\/div>", "subj": "economics"}, {"n": 25, "q": "Country P has high capital mobility and has recently switched from balanced fiscal policy to an expansionary fiscal policy. Over time this expansionary is expected to lead to an increase in government debt to GDP ratio. If we simultaneously consider both the Mundell-Fleming and the portfolio balance model, in the long run country P's currency is most likely to:", "opts": ["remain stable.", "depreciate.", "appreciate."], "ans": "B", "expl": "Under the portfolio balance model, as the ratio of government debt to GDP increases over time and the level of government debt becomes unsustainable, the currency of country P should depreciate. (Under the Mundell-Fleming model, country P's currency should appreciate in the short-term as fiscal deficits push interest rates higher, however this question is specifically asking about the long-run effect).", "explhtml": "<p>Under the portfolio balance model, as the ratio of government debt to GDP increases over time and the level of government debt becomes unsustainable, the currency of country P should depreciate. (Under the Mundell-Fleming model, country P&#x27;s currency should appreciate in the short-term as fiscal deficits push interest rates higher, however this question is specifically asking about the long-run effect).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.3, LOS 5.k<\/div><div class=\"qtext\"><p>Country P has high capital mobility and has recently switched from balanced fiscal policy to an expansionary fiscal policy. Over time this expansionary is expected to lead to an increase in government debt to GDP ratio.<\/p><p>If we simultaneously consider both the Mundell-Fleming and the portfolio balance model, in the long run country P&#x27;s currency is most likely to:<\/p><\/div>", "subj": "economics"}, {"n": 26, "q": "Which of the following is least likely a warning sign of an impending currency crisis?", "opts": ["Terms of trade deteriorate.", "Money supply relative to bank reserves shrinks.", "Liberalized capital markets that allow for a free flow of capital."], "ans": "B", "expl": "Warning sign of an impending currency crisis is when money supply relative to bank reserves grows (not shrinks).", "explhtml": "<p>Warning sign of an impending currency crisis is when money supply relative to bank reserves grows (not shrinks).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.3, LOS 5.m<\/div><div class=\"qtext\"><p>Which of the following is least likely a warning sign of an impending currency crisis?<\/p><\/div>", "subj": "economics"}, {"n": 27, "q": "Which of the following statements regarding purchasing power parity (PPP) is least accurate?", "opts": ["Absolute PPP is similar to the law of one price, except it concerns a basket of goods rather than a single good.", "Under absolute PPP the foreign price level expressed in domestic currency terms should be equal to the domestic country’s price level.", "Relative PPP states that prices for goods and services are the same whether it is for one good or for a basket of goods."], "ans": "C", "expl": "Relative PPP does not state that prices for goods and services are the same, only that the rate of change in the FX rate is a function of the inflation differentials between the two countries.", "explhtml": "<p>Relative PPP does not state that prices for goods and services are the same, only that the rate of change in the FX rate is a function of the inflation differentials between the two countries.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.2, LOS 5.e<\/div><div class=\"qtext\"><p>Which of the following statements regarding purchasing power parity (PPP) is least accurate?<\/p><\/div>", "subj": "economics"}, {"n": 28, "q": "Terrance Burnhart, a junior analyst at Wertheim Investments Inc., was discussing the concepts of purchasing power parity (PPP) and uncovered interest rate parity (UIRP) with his colleague, Francis Ferngood. During the conversation Burnhart made the following statements: Absolute PPP is based on a number of unrealistic assumptions that limits its real-world usefulness. These assumptions are: that all goods and services Statement 1: can be transported among countries at no cost; and all countries use the same basket of goods and services to measure their price levels. UIRP rests on the idea of equal real interest rates across international borders. Real interest rate differentials would result in capital flows to the Statement 2:  higher real interest rate country, equalizing the rates over time. Another way to say this is that differences in interest rates are equal to differences in expected changes in exchange rates. With respect to these statements:", "opts": ["both are correct.", "only statement 1 is correct.", "only statement 2 is correct."], "ans": "A", "expl": "UIRP means that interest rates and exchange rates will adjust so the risk adjusted return on assets between any two countries and their associated currencies will be the same. PPP is based on the idea that a given basket of goods should cost the same in different countries after taking into account the changes in exchange rates. PPP does not hold due to transportation costs and other factors.", "explhtml": "<p>UIRP means that interest rates and exchange rates will adjust so the risk adjusted return on assets between any two countries and their associated currencies will be the same. PPP is based on the idea that a given basket of goods should cost the same in different countries after taking into account the changes in exchange rates. PPP does not hold due to transportation costs and other factors.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.2, LOS 5.f<\/div><div class=\"qtext\"><p>Terrance Burnhart, a junior analyst at Wertheim Investments Inc., was discussing the concepts of purchasing power parity (PPP) and uncovered interest rate parity (UIRP) with his colleague, Francis Ferngood. During the conversation Burnhart made the following statements:<\/p><p>Absolute PPP is based on a number of unrealistic assumptions that limits its real-world usefulness. These assumptions are: that all goods and services<\/p><p>Statement 1:<\/p><p>can be transported among countries at no cost; and all countries use the same basket of goods and services to measure their price levels.<\/p><p>UIRP rests on the idea of equal real interest rates across international borders. Real interest rate differentials would result in capital flows to the Statement 2: &nbsp; higher real interest rate country, equalizing the rates over time. Another way<\/p><p>to say this is that differences in interest rates are equal to differences in expected changes in exchange rates.<\/p><p>With respect to these statements:<\/p><\/div>", "subj": "economics"}, {"n": 29, "q": "Country P has high capital mobility and has recently switched from a balanced fiscal policy to an expansionary fiscal policy. Over time this expansionary fiscal policy is expected to lead to an increase in the government debt-to-GDP ratio. If we simultaneously consider both the Mundell-Fleming and the portfolio balance model, in the short term country P's currency is most likely to:", "opts": ["appreciate.", "remain stable.", "depreciate."], "ans": "A", "expl": "Under the Mundell-Fleming model, country P's currency should appreciate in the short-term as fiscal deficits push interest rates higher. Under the portfolio balance model, such a government that runs a large budget deficit should over time see a decline in the country's currency value – however, this is a long-run rather than short-run effect.", "explhtml": "<p>Under the Mundell-Fleming model, country P&#x27;s currency should appreciate in the short-term as fiscal deficits push interest rates higher. Under the portfolio balance model, such a government that runs a large budget deficit should over time see a decline in the country&#x27;s currency value – however, this is a long-run rather than short-run effect.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.3, LOS 5.k<\/div><div class=\"qtext\"><p>Country P has high capital mobility and has recently switched from a balanced fiscal policy to an expansionary fiscal policy. Over time this expansionary fiscal policy is expected to lead to an increase in the government debt-to-GDP ratio.<\/p><p>If we simultaneously consider both the Mundell-Fleming and the portfolio balance model, in the short term country P&#x27;s currency is most likely to:<\/p><\/div>", "subj": "economics"}, {"n": 30, "q": "Under the Mundell-Fleming model and the portfolio balance approach to exchange rate determination, a country following sustained expansionary fiscal policy would see its currency:", "opts": ["depreciate in the short-run and depreciate in the long-run.", "appreciate in the short-run and appreciate in the long-run.", "appreciate in the short-run and depreciate in the long-run."], "ans": "C", "expl": "Under Mundell-Fleming model, a country running expansionary fiscal policy (i.e., running fiscal deficits) would attract foreign capital due to high interest rates and will see its currency appreciate in the short-run. Under the asset market approach, in the long-run sustained deficits will increase the risk of the country's debt and lead to a currency depreciation.", "explhtml": "<p>Under Mundell-Fleming model, a country running expansionary fiscal policy (i.e., running fiscal deficits) would attract foreign capital due to high interest rates and will see its currency appreciate in the short-run. Under the asset market approach, in the long-run sustained deficits will increase the risk of the country&#x27;s debt and lead to a currency depreciation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.3, LOS 5.k<\/div><div class=\"qtext\"><p>Under the Mundell-Fleming model and the portfolio balance approach to exchange rate determination, a country following sustained expansionary fiscal policy would see its currency:<\/p><\/div>", "subj": "economics"}, {"n": 31, "q": "The carry trade is most likely to be profitable when:", "opts": ["uncovered interest rate parity holds.", "the forward rate is biased estimator of future spot rate.", "the Fisher relation is violated."], "ans": "B", "expl": "The carry trade is premised on uncovered interest rate parity not holding. When the forward rate is an unbiased predictor of the future spot rate, uncovered interest rate parity will hold and hence the carry trade will not be profitable. When the forward rate is a biased predictor of future spot rate, uncovered interest rate parity will not hold and the carry trade may be profitable.", "explhtml": "<p>The carry trade is premised on uncovered interest rate parity not holding. When the forward rate is an unbiased predictor of the future spot rate, uncovered interest rate parity will hold and hence the carry trade will not be profitable. When the forward rate is a biased predictor of future spot rate, uncovered interest rate parity will not hold and the carry trade may be profitable.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 5.3, LOS 5.i<\/div><div class=\"qtext\"><p>The carry trade is most likely to be profitable when:<\/p><\/div>", "subj": "economics"}, {"n": 32, "q": "The current mark-to-market value of the EUR forward contract is closest to:", "opts": ["–USD 15,889,620.", "USD 15,976,000.", "–USD 15,973,205."], "ans": "C", "expl": "The contract calls for purchase of 200 million EUR in 30 days. To compute the mark-to-market value, we would have to use the quote on 30-da // ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;

function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}
