arcia's friendship with the professional athlete.", "that Sharp Brokerage is a market maker of Kicks."], "ans": "C", "expl": "\"Members and Candidates must make full and fair disclosure of all matters that could reasonably be expected to impair their\nindependence and objectivity or interfere with respective duties to their clients, prospective clients, and employer. Members and\nCandidates must ensure that such disclosures are prominent, are delivered in plain language, and communicate the relevant\ninformation effectively.\"\nStandard VI(A) Disclosure of Conflicts aims to protect employers and clients by promoting transparency, allowing them to evaluate whether a\nMember or Candidate is acting independently and objectively when offering investment advice or recommendations. When a conflict can be\nreasonably viewed as interfering with a Member's or Candidate's ability to conduct unbiased investment evaluations, the employer and\nclients must be informed on all pertinent details of the conflict.\nIn this instance, it is the broker/dealer (ie, Sharp Brokerage) who must notify clients that the firm is a market maker in the securities included in\nthe report. This disclosure alerts the client that the firm may have a potential conflict in that it likely holds shares of Kicks in its own account for\nmarket-making purposes.\n(Choice A) Garcia's involvement in the IPO of Kicks two years ago with a previous employer does not create an ongoing or perpetual conflict.\nGarcia does not have a disclosable relationship with the company currently.\n(Choice B) The fact that Garcia has a friend who is a professional athlete who occasionally receives free Kicks apparel is too tangential (indirect)\nand minor to cause a conflict.\nThings to remember:\nStandard VI(A) Disclosure of Conflicts addresses the responsibility of members and candidates to disclose actual and potential conflicts of\ninterests to clients, prospective clients, and employers so they can determine whether the conflict might influence a candidate's or member's\nobjectivity.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 54, "q": "Ivan Petrovich, CFA, manages the Emerging Markets Private Equity Fund. Twelve of the fund's 87 holdings may go a week or more without a quoted price. Petrovich believes that this is normal for some private equity holdings, so when reporting performance he uses the last available market price for the holdings that do not price daily. According to Standard III(D) Performance Presentation, Petrovich should:", "opts": ["provide only GIPS-compliant performance reports to potential clients.", "inform current and potential clients about the fund's pricing methodology.", "remove unpriced securities from the fund's public performance reports."], "ans": "B", "expl": "\"When communicating investment performance information, Members and Candidates must make reasonable\nefforts to ensure that it is fair, accurate, and complete.\"\nStandard III(D) Performance Presentation stipulates that Members and Candidates must use credible performance data to assess performance\nand present a fair and complete report. Therefore, Members and Candidates must disclose information that can help clients evaluate a firm's\nperformance. In this scenario, if Ivan Petrovich does not inform clients about the fund's pricing methodology, he violates the Standard.\n(Choice A) Petrovich is not required to show potential clients only GIPS-compliant reports. Firms may elect to comply with GIPS, but Standard\nIII(D) does not require GIPS compliance.\n(Choice C) Since reports must be as complete as possible, excluding some securities would violate the Standard.\nThings to remember:\nAccording to Standard III(D), Members and Candidates must communicate fair and accurate performance data to all clients and disclose\ninformation (eg, pricing methodology) that can help clients evaluate a firm's performance. Firms may elect to comply with GIPS, but the Standard\ndoes not require GIPS compliance. Performance reports must include all securities.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 55, "q": "Matthew Beck, CFA, recently joined an investment management firm as a senior analyst after many years of working in the same role for a competitor. Beck's spouse is a director of a publicly traded company that Beck will cover for his new employer. His spouse has been a director for several years, and Beck wrote analyst reports about the company for his previous employer. Beck also serves as a trustee for the youth soccer association in his town. Part of his responsibilities as a trustee is to coordinate the association's fundraising efforts, but Beck does not directly solicit money. The association is a relatively new entity, and Beck anticipates a significant time commitment for the next several months. Standard VI(A) Disclosure of Conflicts most likely requires Beck to disclose to his new employer:", "opts": ["his spouse's directorship only.", "both his spouse's directorship and his soccer trusteeship.", "neither his spouse's directorship nor his soccer trusteeship."], "ans": "B", "expl": "\"Members and Candidates must make full and fair disclosure of all matters that could reasonably be expected to\nimpair their independence and objectivity or interfere with respective duties to their clients, prospective clients,\nand employer. Members and Candidates must ensure that such disclosures are prominent, are delivered in plain\nlanguage, and communicate the relevant information effectively.\"\nStandard VI(A) Disclosure of Conflicts defines a conflict as a matter that reasonably could be expected to \"impair [members' or candidates']\nindependence or objectivity or interfere with their respective duties….\" Beck's spouse serves as a director of a company that Beck will be covering\nas an analyst. This must be disclosed since it potentially interferes with Beck's objectivity. It is irrelevant that Beck wrote reports on the company\nfor his previous employer since he cannot assume the new employer is aware of the relevant facts.\nThe Standard includes all conflicts, not just financial conflicts. Beck's soccer trusteeship is a potential conflict since Beck will have to devote\nsignificant time to the association in the coming months. This could interfere with his duties to his employer as well as to his clients. The Standard\ndoes not require an actual conflict to exist to trigger disclosure, only that one could \"reasonably be expected\" to occur (Choice A).\n(Choice C) Both Beck's spouse serving as a trustee of a company that Beck will be covering as an analyst and his soccer trusteeship pose actual\nor potential conflicts of interest, which Standard VI(A) requires him to disclose to his new employer.\nThings to remember:\nStandard VI(A) Disclosure of Conflicts requires members (and candidates) to disclose actual and potential conflicts of interest to clients, potential\nclients, and employers. A conflict is a matter that either impairs (or potentially impairs) objectivity or independence or interferes with the member's\nduties to a client, potential client, or employer.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 56, "q": "Geetha Patel, CFA, is a gaming company analyst at a large investment bank. Red Tiger Gaming, one of the companies she analyzes, opens a new casino and hotel in Macau and invites gaming analysts from several firms to take a tour and meet the CEO. Red Tiger offers to pay for the analysts' commercial flights to Macau. It also offers to pay for all of the analysts' accommodations in the new hotel's luxury suites, which are closest to the conference hall where they will meet the CEO, although other accommodations are available nearby. According to Standard I(B) Independence and Objectivity, if other flights and hotels are available, Patel's most appropriate course of action is to decline the:", "opts": ["flight and hotel accommodations.", "flight but accept the hotel accommodations.", "hotel accommodations but accept the flight."], "ans": "A", "expl": "\"Members and Candidates must use reasonable care and judgment to achieve and maintain independence and objectivity in their professional\nactivities. Members and Candidates must not offer, solicit, or accept any gift, benefit, compensation, or consideration that reasonably could be\nexpected to compromise their own or another's independence and objectivity.\"\nStandard I(B) Independence and Objectivity focuses on ensuring that Members and Candidates who are investment professionals avoid any\nactions that compromise their independence and objectivity. The Standard also pertains to actions that could create a conflict of interest.\nAccepting travel arrangements or accommodations from a company being analyzed should be avoided whenever possible since clients or\ncolleagues could perceive it as compromising the analyst's objecivity. If there are reasonable alternatives for travel and accommodations,\naccepting those offered by the subject company violates Standard I(B).\nBest practice is to use\ncommercial transportation and modest accommodations\nat the expense of the analyst or the analyst's employer.\nIf other commercial transportation or lodging is unavailable, travel can be accepted from the subject company.\nIn this scenario, since other flights and hotels are available, Patel's best course of action is to decline the flight and hotel accommodations and pay\nfor both herself (or have her employer pay). Accepting the accommodations from Red Tiger would be especially inappropriate since best practice\nsuggests accepting only modest accommodations (and only if necessary)—not a luxury suite (Choices B and C).\nThings to remember:\nAccording to Standard I(B) Independence and Objectivity, investment analysts should avoid accepting any offer that could create the perception\nthat their independence and objectivity are compromised. Whenever possible, recommendations call for using commercial transportation and\naccommodations paid for by the analyst or the analyst's employer.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 57, "q": "Donota Rosa, CFA, currently works with her best friend and supervisor Maria Danek, CFA, at Broadwick Investment Partners (BIP). BIP is a private equity firm with award-winning funds. Each of BIP's funds has a $20 million investment minimum for new investors. After working with Danek for two years, Rosa leaves BIP to start her own firm. Six months later, Danek helps Rosa by convincing BIP's management to waive the $20 million investment minimum exclusively for Rosa's clients, but the exclusivity will last for only one month. Rosa clearly remembers how well BIP managed its funds and, based on her memory, is convinced it is an ideal investment for clients. Grateful for this assistance and to meet the one-month deadline, she quickly jumps at the opportunity and immediately recommends BIP's funds. With respect to the Standard V(A) Diligence and Reasonable Basis, does Rosa most likely violate the Standard?", "opts": ["No.", "Yes, since she has a personal relationship with Danek.", "Yes, since she relies on her memory to make an investment decision."], "ans": "C", "expl": "\"Members and Candidates must:\nExercise diligence, independence, and thoroughness in analyzing investments, making investment\nrecommendations, and taking investment actions.\nHave a reasonable and adequate basis, supported by appropriate research and investigation, for any\ninvestment analysis, recommendation, or action.\"\nStandard V(A) Diligence and Reasonable Basis requires members and candidates to exercise diligence and thoroughness when making\ninvestment decisions. While there is no exact policy or procedure that the Standard demands, appropriate and diligent research must be\ncompleted.\nHere, Rosa believes that the funds of Broadwick Investment Partners (BIP) are an ideal investment based on her memory and experience while\nworking at BIP. However, BIP may have changed its investment process or the funds' underlying securities over the last six months; based on\ncurrent research, she might have a different investment recommendation.\nTo comply with the Standard, regardless of limited time or personal relationships, Rosa must exercise diligence by conducting her own thorough\nreview of the funds. Memory or past experiences are inadequate justifications and are not reasonable bases to make investment decisions\n(Choice A).\n(Choice B) Rosa does not violate the Standard by having a personal relationship with another investment manager. While Danek does assist\nRosa, Rosa must do her own work in making an investment recommendation.\nThings to remember:\nStandard V(A) Diligence and Reasonable Basis requires members and candidates to exercise diligence when making investment decisions.\nWhile there is no specific procedure that the Standard demands, proper research should be completed in a thorough and diligent manner. Merely\nrelying on memory and experience is not a reasonable basis for making investment decisions.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 58, "q": "According to Standard II(A) Material Nonpublic Information, which of the following best describes the concept of mosaic theory? A manager complies with the Standards by recommending an investment using:", "opts": ["material nonpublic information.", "public and nonpublic material facts.", "material public and nonmaterial nonpublic data."], "ans": "C", "expl": "\"Member and Candidates who possess material nonpublic information that could affect the value of an investment\nmust not act or cause others to act on the information.\"\nInformation is deemed material if it is likely to change the price of a security or if a reasonable investor would use it to evaluate an investment.\nInformation is considered nonpublic until it is widely disseminated. Analysts may not act on material nonpublic information but may act on\nmaterial public data or nonmaterial nonpublic data.\nThe mosaic theory is a research approach that recognizes that analysts form conclusions from various sources of information. Analysts may\nresearch collections of public and nonmaterial nonpublic data to piece together information (ie, a mosaic), leading to a conclusion. An analyst\nusing various sources of public and nonmaterial nonpublic information does not violate the Standard, even if the analyst reaches a conclusion\nthat could have been reached using material nonpublic information.\n(Choices A and B) An analyst acting on material nonpublic information would be in violation of Standard II(A). Such action is an inappropriate\napplication of the mosaic theory.\nThings to remember:\nThe mosaic theory is a research approach in which analysts piece together bits of information using material public or nonmaterial nonpublic data.\nAn analyst using various sources of public and nonmaterial nonpublic information does not violate Standard II(A) Material Nonpublic Information,\neven if the analyst reaches a conclusion that could have been reached using material nonpublic information.\nRecommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 59, "q": "Patricia Murphy, CFA, is asked by her manager at the hedge fund firm Star Capital to create a marketing brochure for prospective clients. The firm has achieved the following returns: Star Capital Star Capital Market (actual) (risk-adjusted) 20X3 5% 2% −4% 20X4 13% 12% 8% 20X5 24% 22% 13% 20X6 5% 5% 4% 20X7 16% 14% 6% In the brochure, Murphy writes, \"Star Capital has consistently outperformed its benchmark on a risk-adjusted basis and has yet to have a loss in any year. Clients can expect more of the same next year.\" Which part of Murphy's statements most likely violates Standard I(C) Misrepresentation? Stating that:", "opts": ["\"Star Capital…has yet to have a loss in any year.\"", "\"Clients can expect more of the same next year.\"", "\"Star Capital has consistently outperformed its benchmark...\""], "ans": "B", "expl": "\"Members and Candidates must not knowingly make any misrepresentations relating to investment\nanalysis, recommendations, actions, or other professional activities.\"\nStandard I(C) Misrepresentation focuses on avoiding both the use of false or misleading statements and the omission of facts, which can\nundermine investor trust. This includes statements that guarantee clients a level of future performance or a specific return on risky investments\n(eg, stocks). The Standard applies to information prepared\nas a verbal or published statement that is intended\nfor clients, colleagues, or the public.\nIn the marketing brochure, Murphy violates the Standard by implying that clients of Star Capital can expect to receive positive returns and to\noutperform the market next year. Since the hedge fund's investments consist of risky assets, it is impossible for Murphy to know whether Star\nCapital can achieve these targets. Past results are not guarantees of future performance and should not be presented as such.\n(Choice A) Stating that Star Capital has not had a loss is not misrepresentation since it is a factual statement with no omissions.\n(Choice C) Stating that returns have consistently outperformed the benchmark on a risk-adjusted basis is not misrepresentation since it, too, is a\nfactual statement with no omissions.\nThings to remember:\nStandard I(C) Misrepresentation prohibits both the use of false or misleading statements and the omission of facts in any verbal or published\nstatement to clients, colleagues, or the public. This includes statements that guarantee clients a specific performance on risky investments.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 60, "q": "Jessica Meyer, CFA, is a portfolio manager at a large life insurance company. Meyer is a member of the investment committee, which collectively makes investment decisions for the company's investment portfolio. Meyer is the team's emerging market specialist and was recently assigned to analyze the investment prospects of a high-yield debt offering backed by oil export revenues in an emerging market country. Meyer was tasked with this assignment as she is the most qualified to do the analysis, but she personally believes the insurance portfolio should not invest in energy companies for environmental reasons. After considering all factors, in her final report to the committee, Meyer recommends not investing due to the considerable risk involved. After long and thorough deliberation, the committee votes to invest in the debt offering, despite the acknowledged risk. A report is created detailing the discussion and listing all committee members present for the due diligence file. Based on Standard V(A) Diligence and Reasonable Basis, Meyer should most likely: ", "opts": ["do nothing.", "disassociate herself from the report, as it does not align with her personal beliefs.", "disassociate herself from the report, as it does not reflect her true investment opinion."], "ans": "A", "expl": "\"Members and Candidates must:\n1. Exercise diligence, independence, and thoroughness in analyzing investments, making\ninvestment recommendations, and taking investment actions.\n2. Have a reasonable and adequate basis, supported by appropriate research and\ninvestigation, for any investment analysis, recommendation, or action.\"\nStandard V(A) Diligence and Reasonable Basis requires all investment analysis done by Members and Candidates to be diligent and thorough.\nReasonable efforts must be made to ensure all pertinent issues are considered when issuing recommendations.\nWhen investment analysis and recommendations are done by a group, not all members of the group must agree on the conclusion. Those with\ndissenting opinions:\nmay keep their names on the report, and\nare not required to disassociate if they disagree with colleagues so long as they believe the group's conclusion has a reasonable and\nadequate basis.\nIn this scenario, although Jessica Meyer does not agree with its conclusion, the group's process was reasonable and adequate (ie, \"long and\nthorough deliberation\"). The fact that the group's decision conflicts with her personal beliefs is an inadequate basis for disassociating. As such,\nthere is no need for Meyer to disassociate (Choices B and C).\nThings to remember:\nStandard V(A) Diligence and Reasonable Basis requires all investment analysis done by Members and Candidates to be researched thoroughly.\nWhen investment analysis and recommendations are done by a group, those with dissenting opinions do not need to disassociate if they believe\nthe group's conclusion has a reasonable and adequate basis.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 61, "q": "Leslie Gutkowski, CFA, specializes in managing US equity portfolios at Sawa Investments. She adds a new Sawa Emerging Markets Portfolio and decides to outsource its management. She knows many external managers but selects Akiko Investments since they manage emerging markets portfolios for the lowest cost. She dismisses other factors since she strongly believes that the lowest cost is the most important consideration. With respect to Standard V(A) Diligence and Reasonable Basis, Gutkowski most likely: ", "opts": ["violates the Standard by basing the selection of Akiko only on its fee structure.", "violates the Standard by relying on Akiko to provide external portfolio management.", "does not violate the Standard since selecting the least expensive manager is in her clients' best interest."], "ans": "A", "expl": "\"Members and Candidates must:\n1. Exercise diligence, independence, and thoroughness in analyzing investments, making investment\nrecommendations, and taking investment actions.\n2. Have a reasonable and adequate basis, supported by appropriate research and investigation, for any\ninvestment analysis, recommendation, or action.\"\nStandard V(A) Diligence and Reasonable Basis requires members and candidates to exercise diligence and thoroughness when making\ninvestment decisions. An example of an investment decision is a review of external managers. Managers commonly hire external managers (ie,\noutsource) but must conduct a diligent review before doing so.\nHere, Gutkowski selects Akiko by considering only the fee structure and dismisses all other factors (eg, risk and return, manager tenure).\nGutkowski fails to exercise diligence and thoroughness in taking an investment action; this violates the Standard (Choice C).\n(Choice B) The Standard does not preclude members and candidates from hiring external managers; in fact, this practice is common. When it\ndoes occur, the hiring manager must conduct a diligent review of the external manager.\nThings to remember:\nMembers and candidates must exercise diligence and thoroughness in taking investment actions. One example of an investment action is the\nselection of an external manager. Using only one investment criteria to evaluate an external manager fails to demonstrate diligence and\nthoroughness.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 62, "q": "Michael Woods, CFA, is a sell-side analyst at a large brokerage firm. Woods previously published a \"buy\" rating on Mira Medical but believes the stock is now overvalued and submits a downgrade report to his compliance department for approval. Sally Silva, an influential buy-side portfolio manager at a large investment firm, calls Woods to discuss Mira's investment prospects. Woods does not mention the impending downgrade, but the tone of the conversation leads Silva to suspect he is likely to downgrade Mira. Silva comments that Mira is her largest holding and that \"it would be very unfortunate\" if the stock were downgraded before year end. She mentions conversations with other sell-side analysts that support higher price targets on Mira. Silva then says that a downgrade might shake her confidence in Woods, that others might be doing a better job, and she might take her business elsewhere. After this conversation, Woods postpones his downgrade, preferring to think for a while and carefully consider all the relevant factors. Woods downgrades Mira Medical a few weeks later, during the first week of the new year. According to Standard I(B) Independence and Objectivity, Woods:", "opts": ["did not violate the Standard.", "violated the Standard by delaying publication of the downgrade.", "violated the Standard by tipping off the portfolio manager that a downgrade was coming."], "ans": "B", "expl": "\"Members and Candidates must use reasonable care and judgment to achieve and maintain independence and objectivity in\ntheir professional activities. Members and Candidates must not offer, solicit, or accept any gift, benefit, compensation, or\nconsideration that reasonably could be expected to compromise their own or another's independence and objectivity.\"\nStandard I(B) Independence and Objectivity focuses on avoiding any actions that would compromise the independence and objectivity of\nan investment professional. A sell-side analyst is often pressured by buy-side analysts and portfolio managers to express views or take actions\ninconsistent with the sell-side analyst's honest opinion. Since buy-side firms are the \"customer,\" they wield considerable influence over sell-side\nanalysts, who are often directly compensated based on the amount of trading revenue they generate for their firms.\nIn this scenario, Michael Woods has decided to downgrade Mira Medical and submitted his report for compliance approval. A buy-side manager,\nSally Silva, threatens to send business elsewhere, which would likely affect Woods' compensation. By acquiescing to Silva's remarks and\ndelaying the downgrade until the new year, Woods compromises his independence and objectivity and violates the Standard (Choice A).\n(Choice C) As Wood did not disclose the impending downgrade, he did not violate the Standards. In such situations, a sell-side analyst must be\ncareful not to disclose any current opinions that may differ from what has been published and disseminated fairly to all clients.\nThings to remember:\nStandard I(B) Independence and Objectivity mandates that Members and Candidates avoid actions that might compromise their own or another's\nindependence and objectivity. A sell-side analyst is often pressured by buy-side analysts and portfolio managers to express views or take actions\ninconsistent with the sell-side analyst's honest opinion.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 63, "q": "Oscar Serrano, CFA, supervises an analyst team and has the following conversations about the company's compliance efforts with two team members: To Arthur Canto, he says, \"As your supervisor, I should make a reasonable effort to detect unethical behavior, since if I failed to detect such behavior, I would have violated the CFA Standards of Professional Conduct.\" To Maria Alverez, he says, \"I must have an effective compliance system that helps us prevent and detect ethical violations. This will also allow you to better understand your responsibilities.\" According to Standard IV(C) Responsibilities of Supervisors, which of Serrano's conversations best describes a requirement for supervisors managing the employees under their authority? Serrano's conversation with:", "opts": ["only Canto", "only Alverez", "both Canto and Alverez"], "ans": "B", "expl": "\"Members and Candidates must make reasonable efforts to ensure that anyone subject to their supervision or authority complies with applicable\nlaws, rules, regulations, and the Code and Standards.\"\nStandard IV(C) Responsibilities of Supervisors notes that members and candidates with supervisory responsibilities must understand the\ncharacteristics of an effective compliance system. An acceptable system has comprehensive procedures and policies that are:\nproperly documented and\nappropriately conveyed to all pertinent employees.\nAlso, employees' conduct should be reviewed regularly to ensure the rules are followed.\nSupervisors' responsibilities include detecting and preventing violations and developing effective compliance systems to improve their\nsubordinates' understanding of ethical behavior. Promoting education and training is one way to fulfill this responsibility.\n(Choices A and C) Supervisors should make reasonable efforts to detect unethical behavior; however, failing to do so does not constitute a\nviolation of the Standards of Professional Conduct or its recommendations.\nThings to remember:\nThe Standards of Professional Conduct (Standards) require supervisors to actively assist employees' compliance with laws, regulations, the Code\nof Ethics, and the Standards. Supervisors' responsibilities include detecting and preventing violations and developing effective compliance\nsystems to improve their subordinates' understanding of ethical behavior.\nRecommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 64, "q": "Win Minjun is a CFA candidate preparing for the Level I exam. On the morning of the exam, before taking the test, Minjun receives an email from a close friend who already took the test, stating that \"I studied so much and still couldn't pass this ridiculous test. I didn't even finish in the afternoon.\" After entering the exam room, Minjun wishes the other candidates good luck. During the exam, Minjun says aloud, in frustration, \"NPV is always better than IRR,\" which is a correct answer. After the exam, Minjun posts on a public blog, \"There were numerous questions regarding Priority of Transactions in the Ethics section. Make sure to know those topics well.\" According to Standard VII(A) Responsibilities, as a CFA Institute Member or a CFA Candidate, Minjun most likely violated the Standard: ", "opts": ["during and after the exam.", "before and after the exam.", "before and during the exam."], "ans": "A", "expl": "\"Members and Candidates must not engage in any conduct that compromises the reputation or integrity of CFA Institute or the CFA designation or\nthe integrity, validity, or security of CFA Institute programs.\"\nStandard VII(A) Responsibilities as a CFA Institute Member or a CFA Candidate identifies conduct that damages the public's trust. Any behavior\n(eg, cheating) that would discredit the CFA Program violates this Standard.\nCandidates taking the exam must sign the Candidate Pledge, which identifies behaviors that are prohibited before, during, and after the test,\nincluding:\nsharing actual exam information about questions, broad topic areas, or formulas, and\nnot following the exam rules or the proctors' instructions.\nIn this scenario, Minjun violates the Standard by talking during the exam and giving test information to other candidates. This compromises the\nexam's validity for all candidates in the room with Minjun. Also, Minjun violates the Standard by sharing actual exam information about the Ethics\ntopic area after the exam.\n(Choices B and C) Reading an opinion about the exam's difficulty before taking the exam does not violate the Standard. Candidates may\nexpress their opinions about the exam since opinions are not considered actual exam information.\nThings to remember:\nStandard VII(A) Responsibilities as a CFA Institute Member or a CFA Candidate identifies behavior that discredits the CFA Program. Candidates\nmust sign the Candidate Pledge before taking the exam, attesting that they have not shared and will not share confidential exam materials before,\nduring, or after the test.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 65, "q": "Julia Steinhardt, CFA, manages clients' assets as sole proprietor at Steinhardt Capital Advisors (SCA). Steinhardt is generally conservative in her approach, investing only in traditional asset classes of domestic stocks, bonds, and cash. During a recent annual portfolio review, one of Steinhardt's high-net-worth clients with a large account states he wants to add a more aggressive investing option to his portfolio, given his ample risk tolerance. Alarmed about potentially losing the client's business, Steinhardt updates the client's investment policy statement (IPS) and agrees to allocate a portion of the client's portfolio to investments in derivatives. At their next meeting, Steinhardt explains that she developed a new strategy that equally weights her ten best ideas using long-term call options, and then back-tested the new strategy's performance over the past five years. As the stock market has been in a consistent uptrend during the back-test period, Steinhardt emphasizes the spectacular pro forma performance of the model portfolio and stresses how this investment would make a great addition to the client's portfolio. According to Standard V(B) Communication with Clients and Prospective Clients, Steinhardt most likely violated the Standard by failing to:", "opts": ["sufficiently describe how the new strategy works.", "discuss the limitations and risks associated with the strategy.", "communicate that the original investment policy statement was more appropriate."], "ans": "B", "expl": "\"Members and Candidates must:\nDisclose to clients and prospective clients significant limitations and risks associated with the investment\nprocess.\"\nStandard V(B) Communication with Clients and Prospective Clients requires Members and Candidates to discuss the limitations and risks of\nrecommendations of an investment strategy or process. This is especially imperative when the investments are in new or unusual financial\ninstruments with which the client may be unfamiliar.\nTo comply with the Standard, Members and Candidates must communicate with clients in plain language. The communication must also convey\nenough information that clients can recognize the risks and limitations of the recommendation. When explaining key attributes of an investment\nrecommendation, Members and Candidates must use reasonable judgment in providing the appropriate level of transparency without unnecessary\nor confusing details of the strategy.\nIn this scenario, Steinhardt communicated the positive pro forma performance data, but she failed to discuss the significant risks of the strategy. A\nstrategy consisting of only long-term options is aggressive and the risk of loss is very high, particularly in a different market environment (eg, bear\nmarket).\n(Choice A) The basic format, structure, and security selection process of the investment was sufficiently described, meeting the Standard.\n(Choice C) Advisors must not impose their own biases (ie, conservatism) on the client. In this instance, after discussion with Steinhardt, the client\nspecifically requested an IPS with a greater risk/reward profile. Since the high-net-worth client can be assumed to have adequate risk tolerance,\nthere is no indication that the original IPS was more appropriate.\nThings to remember:\nStandard V(B) Communication with Clients and Prospective Clients requires Members and Candidates to discuss the limitations and risks of\nrecommendations of an investment strategy or process.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 66, "q": "Hiroshi Tanaka, CFA, is a research analyst for Fuji Investments and covers the insurance sector. Due to client demand, Tanaka's manager asks him to initiate coverage on insurance brokers. Tanaka owns stock in Union Insurance, the country's second-largest public insurance broker, in a long-term investment account for his daughter's education. He cannot sell shares from the account since it is managed by a third party. Tanaka's wife is on the Union board of directors. To comply with the Code and Standards, Tanaka should most appropriately disclose to Fuji:", "opts": ["only his stock holdings in Union.", "only his wife's board position with Union.", "both his stock holdings and his wife's board position."], "ans": "C", "expl": "\"Members and Candidates must make full and fair disclosure of all matters that could reasonably be expected to\nimpair their independence and objectivity or interfere with respective duties to their clients, prospective clients,\nand employer. Members and Candidates must ensure that such disclosures are prominent, are delivered in plain\nlanguage, and communicate the relevant information effectively.\"\nStandard VI(A) Disclosure of Conflicts aims to protect employers and clients by promoting transparency, allowing them to evaluate whether a\nMember or Candidate is acting independently and objectively when offering investment advice or recommendations. When a conflict can be\nreasonably viewed as interfering with a Member's or Candidate's ability to conduct unbiased investment evaluations, the employer and\nclients must be informed on all pertinent details of the conflict.\nFor employers, disclosure provides the opportunity to decide whether the Member's or Candidate's objectivity might be impaired and then take\nproper actions to limit or prevent conflicts of interest. Both financial and nonfinancial conflicts must be disclosed.\nIn this scenario, Hiroshi Tanaka's ownership of Union Insurance stock represents a conflict of interest. Even though he cannot sell the stock, he\nstill benefits from the capital appreciation; thus, the holdings must be disclosed to Fuji Investments. Tanaka's wife's position on the Union board of\ndirectors represents a potential conflict of interest. Even though he is not on the board, his wife's role gives him incentive to see Union succeed;\nthus, her position also must be disclosed to Fuji (Choices A and B).\nThings to remember:\nWhen a conflict can be reasonably viewed as interfering with a Member's or Candidate's ability to conduct unbiased investment evaluations, the\nemployer and clients must be informed of the conflict. For employers, disclosure provides the opportunity to decide whether the Member's or\nCandidate's objectivity might be impaired and take proper actions to limit or prevent conflicts of interest.\nRecommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 67, "q": "Aisha Nazari, CFA, manages a small-cap stock portfolio for Sanctuary Capital. As the portfolio has grown, Nazari has noticed that trading costs are increasing due to low liquidity in small-cap stocks. To reduce these costs, she adds derivatives that mimic the returns of the small-cap stocks she invests in. Nazari updates the portfolio's information on Sanctuary's social media page, which is used for marketing to prospective clients. Existing clients can access the social media page, but it generally is not used to communicate with them. Nazari does not use any other communication to tell existing clients about these changes. Nazari:", "opts": ["does not violate the Standards.", "violates the Standards by not communicating separately with existing clients.", "violates the Standards by using social media to communicate an investment strategy."], "ans": "B", "expl": "\"Members and Candidates must:\n1. Disclose to clients and prospective clients the basic format and general principles of the investment\nprocesses they use to analyze investments, select securities, and construct portfolios and must promptly\ndisclose any changes that might materially affect those processes.\n2. Disclose to clients and prospective clients significant limitations and risks associated with the investment\nprocess.\"\nStandard V(B) Communication with Clients and Prospective Clients requires Members and Candidates to inform both clients and prospective\nclients about the limitations and risks of an asset or investment process. The communications must use language that is easy for clients to\nunderstand but that also conveys enough information for them to recognize the relevant risks and limitations.\nFurther, any changes in the general characteristics of an asset or investment process (eg, strategies, risks) also must be disclosed.\nCommunications about changes allow clients to decide whether the asset or process still aligns with their risk and return objectives after the\nchanges are made. The addition of derivatives to a portfolio changes its risk profile; this is important information for all clients to know.\nCommunicating investment details or changes in investment characteristics through social media is not a violation of Standard V(B) (Choice C).\nHowever, if a social media platform is used, special care must be taken to ensure all clients receive the communications and are treated fairly.\nIn this scenario, since Sanctuary Capital and Aisha Nazari do not generally use the company's social media page to communicate with existing\nclients, just updating that page is insufficient disclosure of important information. Additional communication is needed to ensure all clients are\naware of the change. Nazari violates the Standard by failing to provide the additional information (Choice A).\nThings to remember:\nStandard V(B) requires Members and Candidates to inform both clients and prospective clients about the limitations and risks of an investment\nasset. Any changes to the components, risks, or investment strategy of the asset must also be disclosed. If a social media platform is used,\nspecial care must be taken to ensure all clients receive the communications.\nRecommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 68, "q": "Bethany Crystal, CFA, manages a firm's European small-cap fund. The fund's investment policy statement mandates that all holdings at the time of purchase must have: at least a 20% potential price return and market capitalizations (ie, market caps) between €300 million and €3 billion. Crystal considers purchasing Investment A, a €200 million retailer, since it has been a proven market disrupter. She is also reviewing Investment B, a €2.9 billion health care stock, which is an attractive acquisition target for several companies. Crystal contends that Investment A's market cap could appreciate to well over €300 million in less than a year and that Investment B's market cap could rise beyond €4 billion if a bidding war occurs. She argues that, regardless of the small-cap fund's constraints, the potential appreciation in both stocks is so great that shareholders should not miss out on these extraordinary expected returns. To comply with Standard III(C) Suitability, Crystal should most appropriately purchase:", "opts": ["neither investment.", "one investment.", "both investments."], "ans": "B", "expl": "\"When Members and Candidates are responsible for managing a portfolio to a specific mandate, strategy, or style, they must\nmake only investment recommendations or take only investment actions that are consistent with the stated objectives and\nconstraints of the portfolio.\"\nAccording to Standard III(C) Suitability, managers must invest according to the detailed investment objectives and constraints of a specific\nmandate (eg, a fund's restrictions). This is crucial since a manager might otherwise purchase a security inconsistent with the objectives and\nconstraints, leaving investors exposed to different risks and returns than those stated in the mandate.\nThe mandate in this scenario has two constraints: a minimum potential price return of 20% and market capitalizations between €300 million and €3\nbillion. Investment A's potential price return of 50% [(300 − 200) ÷ 200] is greater than the 20% minimum, but its present market cap of €200\nmillion is less than the fund's €300 million minimum.\nInvestment B's potential price return of 37.9% [(4.0 − 2.9) ÷ 2.9] and its current market cap of €2.9 billion both pass the fund's constraints.\nTherefore, Crystal complies with Standard III(C) Suitability by purchasing only Investment B. The investment's market capitalization after\npurchase is not a constraint of the fund (Choices A and C).\nThings to remember:\nAccording to Standard III(C) Suitability, managers of a fund must adhere to its specific investment objectives and constraints. If a manager\npurchases securities in a manner inconsistent with the constraints, the fund is mispresented to investors. The investors are then exposed to\ndifferent risks and returns than intended.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 69, "q": "Jiang Shuang, CFA, is working on a new quantitative model for her employer, Qiao Ventures. Halfway through the project, Jiang decides to leave for another hedge fund, Green Tide Partners. Before leaving, Jiang confirms that she has not signed a noncompete agreement with Qiao. She also confirms that Qiao does not plan on continuing work on her model. Without informing Qiao, Jiang decides to take copies of documents on the project to finish the work at Green Tide. Once at Green Tide, her new manager asks for her help completing another project. Jiang uses knowledge learned at Qiao to help her complete that project. Jiang has most likely violated the Standard IV(A) Loyalty by:", "opts": ["taking documents from Qiao.", "using knowledge gained at Qiao.", "both taking documents from and using knowledge gained at Qiao."], "ans": "A", "expl": "\"In matters related to their employment, Members and Candidates must act for the benefit of their employer and not deprive their\nemployer of the advantage of their skills and abilities, divulge confidential information, or otherwise cause harm to their\nemployer.\"\nStandard IV(A) Loyalty requires Members and Candidates that are employees to protect their employers and to refrain from any conduct that\ncould:\nInjure the firm\nDeprive the firm of profit\nDeprive the firm of the Member or Candidate's skills and abilities\nThe Standard indicates that Members and Candidates must continue to act in the best interest of their current employer when planning to leave.\nThis includes not appropriating confidential documentation and information. Documents and records are the property of the employer and\ncannot be taken from that employer without written permission. Any documents or records stored by an employee (eg, files on a hard drive)\nshould be erased or returned to the employer. However, skills, knowledge, and experiences gained while at a previous employer are not\nconfidential and may continue to be used.\nIn this scenario, Jiang Shuang violates the Standard by taking documents related to the quantitative model she was working on at Qiao Ventures\nwithout permission. Even though Qiao was not planning to continue the work, it does not release Jiang from her duty to her employer since all of\nJiang's work products created at Qiao, including the documents, still belong to Qiao. However, the Standard allows Jiang to use knowledge and\nskills gained while working at Qiao, so using this knowledge to help the manager of Green Tide Partners finish that project does not violate the\nStandard (Choices B and C).\nThings to remember:\nStandard IV(A) Loyalty notes that Members and Candidates must try to protect the interests of their employers. This includes refraining from\ntaking confidential information and documentation from an employer when leaving. However, knowledge gained while working at that employer is\nnot confidential and may continue to be used.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 70, "q": "Pierre Bellefont, CFA, is an analyst at a wealth advisory firm. In the last year, Bellefont has been in court twice. The first time, the charge stemmed from his refusal to testify as a witness to a colleague's illegal insider trading. Bellefont did not participate in the illegal trading activity and claimed that he refused to testify only out of loyalty to his employer and to protect his firm's reputation. The second time, he declared personal bankruptcy as the result of a large penalty for evading income taxes. Which of Bellefont's actions most likely indicate that he violated Standard I(D) Misconduct?", "opts": ["Evading taxes and refusing to testify", "Declaring bankruptcy and evading taxes", "Refusing to testify and declaring bankruptcy"], "ans": "A", "expl": "\"Members and Candidates must not engage in any professional conduct involving dishonesty, fraud, or deceit or\ncommit any act that reflects adversely on their professional reputation, integrity, or competence.\"\nStandard I(D) Misconduct focuses on conduct, whether legal or illegal, that reflects poorly on the professional competence, reputation, and\nintegrity of members or candidates. In this case, Bellefont's refusal to cooperate with the enforcement of insider trading laws reflects poorly on\nhis professional integrity. His refusal to testify is a refusal to protect the integrity of the capital markets from illegal insider trading and, ultimately, is\na refusal to protect clients from this colleague. In fact, this diminishes the professional reputation of his firm as well as himself.\nBankruptcy by itself is not a violation of the Standard (Choices B and C). However, the action that led to this bankruptcy—attempting to deceive\nand defraud the government by evading taxes—does violate the Standard.\nThings to remember:\nStandard I(D) Misconduct focuses on conduct that, whether legal or illegal, results from fraud, deceit, or dishonesty or may compromise the\ncompetence, reputation, and professional integrity of any member or candidate.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 71, "q": "To develop her investment theses, Quan Yan, CFA, a leading technology sector analyst, uses several sources, including the following: Personal written notes from earnings calls Twitter posts Text messages from other analysts Historical price feeds To comply with Standard V(C) Record Retention, Yan must keep a record of her:", "opts": ["personal notes, Twitter posts, and price feeds.", "price feeds, personal notes, and text messages.", "Twitter posts, text messages, and personal notes."], "ans": "C", "expl": "\"Members and Candidates must develop and maintain appropriate records to support their investment analyses, recommendations, actions, and\nother investment-related communications with clients and prospective clients.\"\nStandard V(C) Record Retention states that Members and Candidates must keep their own records to support investment research, actions, and\nconclusions. The exact records that must be maintained vary by the Member's role. Records include the following:\nClient conversations\nNotes from earnings calls\nStatistical analyses (ie, spreadsheets)\nWritten reports\nElectronic communications (eg, texts, emails)\nNew media communications (eg, Twitter feeds, blogs)\nRecords may be maintained electronically or as hard copies. Since firms' record retention policies may lag behind developments in new media\nstorage, Members and Candidates are obligated to store their own records of content from nontraditional media sources (eg, blogs, Twitter\nfeeds).\nIn this scenario, to adhere to the Standard, Yan must retain her written notes and keep records of Twitter feeds and text messages (even from\nher personal phone). Since historical price feeds are publicly available data that are easily reproduced, Yan is not required to record them as part\nof her investment research (Choices A and B).\nThings to remember:\nStandard V(C) Record Retention states that Members and Candidates must keep their own records, including client conversations, written reports,\nand new media (eg, blogs, Twitter feeds), to support investment research, actions, and conclusions. Using new media channels obligates analysts\nto properly record and store new media data.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 72, "q": "Ricardo Stevenson, CFA, regularly documents research to substantiate his investment decisions. Stevenson's firm has no mandatory policy regarding its record retention; however, the laws of the country where Stevenson's firm is located require that documents be maintained for at least three years. To comply with the Code and Standards, the minimum number of years he is required to maintain his research records is:", "opts": ["3", "7", "10"], "ans": "A", "expl": "\"Members and Candidates must develop and maintain appropriate records to support their investment analyses, recommendations, actions,\nand other investment-related communications with clients and prospective clients.\"\nRegulators often have minimum standards for investment-related records retention. In addition, investment organizations may have more\nstringent policies than local regulators. These may identify different periods of retention for different types of investment data (eg, earnings\nreports, client conversations).\nMembers and Candidates comply with Standard V(C) Record Retention if they follow the local country regulations and their firms' policies. If local\nregulations are silent and a firm does not have a record retention policy, CFA Institute recommends that Members and Candidates maintain\nrecords for at least 7 years. However, that is a recommendation of the Code and Standards, but not a requirement. So even though local laws\nare less strict than the recommendation of the Standards, as in this case, following the local laws complies with the Standard.\nIn this scenario, Ricardo Stevenson's firm has no record retention policy, but local law requires a minimum of 3 years' retention, so Stevenson\nshould maintain records for at least 3 years. If there were no local regulations, Stevenson should follow the Standard's recommendation of 7\nyears' retention (Choices B and C).\nThings to remember:\nFollowing firm and regulatory requirements meets the Standard. In the absence of both firm policies and local regulations, the Standards\nrecommend maintaining records for at least seven years.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 73, "q": "Stephen Cutler, State Treasurer, is responsible for overseeing the teachers' pension plan. Cutler hires Louise Gartner, a consultant, to advise the state on investments. Gartner hires Valarie Norton, CFA to manage the pension plan. Norton delivers investment reports to Cutler and Gartner on a semiannual basis. Under Standard III(A) Loyalty, Prudence, and Care, the client(s) to whom Norton most likely owes a duty of loyalty is (are):", "opts": ["Only Cutler", "Only the teachers", "Gartner and the teachers"], "ans": "B", "expl": "\"Members and Candidates have a duty of loyalty to their clients and must act with reasonable care and exercise\nprudent judgment. Members and Candidates must act for the benefit of their clients and place their clients'\ninterests before their employer's or their own interests.\"\nTo comply with Standard III(A) Loyalty, Prudence, and Care, members and candidates must identify the client to whom they owe loyalty. When\nan individual investor hires a manager to invest personal assets, the client is self-evidently the individual. However, when an institution hires an\ninvestment manager, it does so to benefit others. For institutional engagements, the plan beneficiaries are the clients, not the person or firm\nwho hires the manager.\nIn this scenario, Norton, as the hired manager, interacts with and reports to Cutler and Gartner; however, under Standard III(A), Cutler and Gartner\nare not considered her clients, even if they retain control over Norton's appointment as manager. The teachers are the beneficiaries of the\npension plan; therefore, it is to them that Norton owes a duty of loyalty (Choices A and C).\nThings to remember:\nMembers and candidates must identify the client to whom they owe loyalty. When an institution (eg, pension plan) hires an investment manager,\nthe plan's beneficiaries are the manager's clients; therefore, the manager owes the beneficiaries a duty of loyalty.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 74, "q": "Sami Sharifi, CFA, is the portfolio manager for high-net-worth clients at High Peak Capital. During his quarterly client review, he notices signs of potential tax fraud by one of his clients, Ibrahim Khan. Local law stipulates that illegal acts be reported to the authorities. However, Sharifi has only partial access to Khan's accounts, so he is not certain whether Khan's acts were illegal and so is unable to confirm any misdeeds. To comply with III(E) Preservation of Confidentiality, it would be most appropriate for Sharifi to:", "opts": ["keep Khan's information confidential but confront him about the activities.", "confer with High Peak's compliance officer and legal counsel on next steps.", "turn Khan's information over to local authorities on suspicion of illegal activity."], "ans": "B", "expl": "\"Members and Candidates must keep information about current, former, and prospective clients confidential\nunless:\n1. The information concerns illegal activities on the part of the client or prospective client,\n2. Disclosure is required by law, or\n3. The client or prospective client permits disclosure of the information.\"\nStandard III(E) Preservation of Confidentiality addresses the protection of client information. Members and Candidates are required to keep\nconfidential any relevant information about a client that is received during the course of business.\nHowever, information must be disclosed to authorities if the information is required to be disclosed by law or if the information regards illegal\nactivity. In these cases, dissemination would not violate the Standard. When in doubt about whether activities are illegal or violate applicable\nlaws, Members and Candidates should consult with their firms' compliance officer or seek legal counsel.\nSince Sami Sharifi noticed signs of a client's potential tax fraud by a client but is uncertain of any illegality, his best course of action would be to\nseek advice from the firm's compliance officer or legal counsel. Counsel can add clarity to the activities, so to avoid unnecessary disclosure of a\nclient's confidential information, such advice should be solicited before disclosing any relevant information to the authorities (Choice C). The\nStandard does not require Members or Candidates to confront the client about any potentially illegal activities (Choice A).\nThings to remember:\nStandard III(E) requires that relevant information about a client be kept confidential. However, information must be disclosed if required by law or\nif the information regards illegal activity. When in doubt about whether activities are illegal or violate applicable laws, Members and Candidates\nshould consult with their firms' compliance officer or seek legal counsel before deciding.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}];
const CFG = {"title": "Wiley · Guidance For Standards I–VII", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Ethical & Professional Standards · 74 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
</html>
