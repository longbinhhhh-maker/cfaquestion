<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Alexander Petrov, CFA, regularly posts investment ideas and videos on several popular social media investment forums. Petrov has developed a sizable following that often immediately reacts to his recommendations. Petrov buys a significant number of shares in a micro-cap mining stock. He then posts to his followers on several social media platforms that he has a large position in this stock. Petrov then starts a rumor stating that \"the company is likely to be acquired at a substantial premium to the current price in the near future.\" The stock immediately jumps 20% and Petrov sells most of his shares over the rest of the trading day. According to Standard II(B) Market Manipulation, Petrov most likely violated the Standard by: ", "opts": ["starting a rumor.", "selling his shares.", "buying before his followers."], "ans": "A", "expl": "\"Members and Candidates must not engage in practices that distort prices or artificially inflate\ntrading volume with the intent to mislead market participants.\"\nStandard II(B) Market Manipulation prohibits activities by Members or Candidates that distort securities prices. Manipulation can occur\nthrough:\ninformation-based activities, such as spreading false rumors, or\ntransaction-based activities, such as exaggerated trading between two accounts.\nManipulation can lead to a loss of trust in the fairness and integrity of the markets. The Member's or Candidate's intent determines whether he or\nshe has violated the Standard. Actions that move security prices but were not intended to deceive market participants do not violate the\nStandard.\nIn this scenario, Alexander Petrov violated the Standard by intentionally spreading false rumors to manipulate the price of the stock. Petrov's\nbehavior is a classic example of a \"pump and dump\" scheme, in which someone accumulates a thinly traded and therefore easily manipulated\nstock, fabricates a story to boost the price, and then sells those shares to the new investors who \"buy\" the story and the stock.\n(Choices B and C) It is not a violation to buy securities ahead of publicly announcing a position or selling shares after a stock appreciates. The\nviolation centered around Petrov's intent to manipulate by specifically spreading a rumor to artificially boost the stock price.\nThings to remember:\nStandard II(B) Market Manipulation prohibits information-based and transaction-based activities that distort security prices. The intent of the action\nis the factor that determines whether a Member or Candidate violated the Standard.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 2, "q": "Seth Farleigh, CFA, manages the Australian Mid-Cap Fund. After conducting his review, Farleigh prepares a shareholder report for current and prospective clients. The report is dated December 31, 20X7, and Farleigh believes he has identified all risks to which investors are exposed. On January 31, 20X8, one country changes its tax code, which significantly benefits Australian companies, and causes the fund to experience a significant gain. Despite the gain, however, Farleigh believes this event creates a new risk for the fund. To comply with the Standard V(B) Communication with Clients and Prospective Clients, Farleigh most likely is:", "opts": ["required to communicate the new risk to clients immediately.", "not required to communicate the new risk to clients since they benefited", "required to communicate the new risk to clients in the future if the clients are harmed."], "ans": "A", "expl": "\"Members and Candidates must:\n1. Disclose to clients and prospective clients the basic format and general principles of the investment\nprocesses they use to analyze investments, select securities, and construct portfolios and must promptly\ndisclose any changes that might materially affect those processes.\n2. Disclose to clients and prospective clients significant limitations and risks associated with the investment\nprocess.\"\nUnder Standard V(B) Communication with Clients and Prospective Clients, members and candidates must communicate all pertinent investment\nrisks to existing and prospective clients. All pertinent risks are only those identified at a point in time. If new risks are identified after an\ninvestment recommendation is made, that does not signify a violation of the Standard.\nHere, Farleigh could not have known in December about tax codes being changed in another country in the following January, so he did not violate\nthe Standard in failing to report it in his 20X7 report. However, once he determined that the tax change posed a new risk, the Standard obliged\nhim to immediately disclose it to clients regardless of its impact (ie, gain or loss) (Choices B and C).\nThings to remember:\nStandard V(B) requires members and candidates to communicate to clients all pertinent investment risks. If new risks are identified after an\ninvestment is recommended, it is not a violation of the Standard. Only the reasonable and identifiable risks at the time the investment action is\nmade must be communicated.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 3, "q": "Miguel Flores, CFA, is responsible for allocating shares for the firm's participation in an initial public offering (IPO) to discretionary client accounts. He asks his colleagues for advice. Marcia Sanz suggests Flores review each client's investment policy statement before allocating shares. Lorenzo Torres instructs Flores to allocate shares on a prorated basis based to each client's assets under management. Matias Jimenez tells Flores to make sure equal shares of the IPO are allocated to each client. Which advisor's suggestion most likely complies with Standard III(B) Fair Dealing? ", "opts": ["Sanz", "Torres", "Jimenez"], "ans": "A", "expl": "\"Members and Candidates must deal fairly and objectively with all clients when providing investment analysis, making investment\nrecommendations, taking investment action, or engaging in other professional activities.\"\nStandard III(B) Fair Dealing focuses on managers' responsibility to treat all clients fairly and objectively, specifically in terms of information\ndistribution and investment actions. For example, a manager must allocate an initial public offering (IPO) trade that allows each client a fair\nopportunity to act on the information. Managers who treat clients fairly uphold the ethical principles of the Code and Standards and the profession.\nSanz seeks to ensure that the IPO allocation will be completed fairly and objectively with adherence to each client's investment policy statement,\nwhich states the client's investment objectives and constraints. Even clients that participate in IPOs may have certain constraints that make a\nprorated allocation approach inappropriate (Choice B).\n(Choice C) Jimenez is incorrect since the Standards require that all clients be treated fairly, not equally. Since clients and their goals differ, equal\ntreatment (eg, the same IPO allocation) would not be appropriate for all clients.\nThings to remember:\nStandard III(B) Fair Dealing focuses on managers' responsibility to treat all clients fairly and objectively. This means that managers should have a\nfair process for making investment decisions such as the allocation of trades. All clients should be given a fair opportunity to act on investment\nrecommendations.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 4, "q": "Himari Sato just got home from taking Level I of the CFA exam. She goes onto a popular online forum and writes, \"Just got back from Level I. Definitely a hard exam, much harder than I expected based on my studying, but I think I passed! However, I still disagree with CFA Institute's policy of providing ranges for the weights of each subject on the exam. Just tell us what to expect! I studied way too hard for derivatives, but the number of questions was at the bottom of the range. I wasted so much time on this.\" Sato violated the Standards by:", "opts": ["disagreeing with CFA Institute's exam policies.", "expressing an opinion on the difficulty of the exam.", "providing information about topics tested on the exam."], "ans": "C", "expl": "\"Members and Candidates must not engage in any conduct that compromises the reputation or integrity of CFA Institute or the\nCFA designation or the integrity, validity, or security of CFA Institute programs.\"\nStandard VII(A) Conduct as Participants in CFA Institute Programs mandates that Members and Candidates maintain the reputation, integrity,\nvalidity, and security of CFA Institute exams and programs. The Standard prohibits behavior that would compromise the public's confidence in\nthe level of merit needed to achieve a CFA charter.\nCandidates taking the exam must sign the Candidate Pledge, which identifies behaviors that are prohibited before, during, and after the test.\nThese behaviors include:\ngiving or receiving information about the exam before or during the exam, and\nproviding information about the exam to others after the exam, including broad topic areas tested, until it is publicly released by CFA\nInstitute.\nIn this scenario, Himari Sato violates the Standard by disclosing information about the exam. Even though she did not disclose information about\nspecific questions, she did disclose that the number of questions about derivatives was at the bottom of the given range. Learning this could give\nthose who have not yet taken the exam an unfair advantage.\n(Choice A) The Standard allows Members and Candidates to share opinions that disagree with CFA Institute policies (eg, allowing only two types\nof calculators) and stances on key issues (eg, advocacy articles).\n(Choice B) Members and Candidates are allowed to share opinions about the exams or CFA Institute as long as the opinions do not reveal\nspecific information about the exams.\nThings to remember:\nStandard VII(A) requires Members and Candidates to refrain from engaging in conduct that undermines the integrity of the CFA exam process.\nThis includes disclosing confidential information, including specific details about questions or broad topic areas tested on the exam, until it is\npublicly released by CFA Institute.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 5, "q": "Bernard Logan, CFA, manages a small-cap growth exchange-traded fund (ETF) for Firefly Capital. Logan's boss is concerned that the ETF's trading volume is low compared to that of peers. He directs Logan to determine which of the firm's largest investors the ETF would be suitable for, and then ask those investors to agree to purchase fixed amounts of the ETF at regular intervals over the next month. Investors that agree to do so will pay reduced commissions. The boss expects that the larger number of trades will support market liquidity for the ETF and create greater interest among potential investors, which will benefit the existing clients who invest in the ETF. The boss asks that Logan not disclose this arrangement to the general investing public. To comply with Standard II(B) Market Manipulation, Logan's best course of action is to: ", "opts": ["suggest Firefly disclose the agreements before proceeding.", "proceed with his boss's request without disclosing the agreements.", "tell his boss that such agreements violate the Standards even if they are disclosed."], "ans": "A", "expl": "\"Members and Candidates must not engage in practices that distort prices or artificially inflate trading volume with the intent to\nmislead market participants.\"\nStandard II(B) Market Manipulation prohibits activities by Members or Candidates that distort securities prices. Manipulation can occur\nthrough:\ninformation-based activities (eg, spreading false rumors) and\ntransaction-based activities (eg, exaggerated trading between two accounts).\nThe key element in determining whether the Standard is violated is that the Member or Candidate must intend to deceive market participants that\nrely on market information. If the Member's or Candidate's intent is to deceive investors, the Standard is violated. Intent is inferred from the\ncircumstances on a case-by-case basis.\nIn this scenario, Logan's boss has the intent of making market participants believe the ETF's liquidity is greater than it really is by distorting trading\nvolume, which would be a violation of the Standard (Choice B). Once the agreements with Firefly Capital's largest customers have ended,\nliquidity is likely to fall.\nHowever, disclosing the agreements provides information that investors need to interpret market data and make informed decisions. Therefore,\nFirefly may make such agreements with customers without violating the Standard provided the agreements are disclosed (Choice C). To comply\nwith the Standard, Logan should educate his boss on or remind his boss about the Standards and suggest disclosing the agreements.\nThings to remember:\nStandard II(B) Market Manipulation prohibits information-based and transaction-based activities that distort securities prices. The Member's or\nCandidate's intent is the determining factor in deciding whether the Standard is violated.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 6, "q": "Haley Jarwin, CFA, lives in Country Z. She recently joined a new investment bank located in Country X. Country X's securities require that the laws of a client's home country shall govern if the client is not located in Country X. Jarwin is assigned to work on a large IPO for a client that is located in Country Y, whose securities laws are less strict than those of Country X. Jarwin believes some of the client's confidential financial information is fraudulent and may be evidence of criminal activity. Country X's laws require that she report her suspicions to securities regulators, but Country Y's laws prohibit reporting unless the client is first requested to remedy the fraud and refuses to act. Country Z has no laws that apply to this situation. Under Standard I(A) Knowledge of the Law, Jarwin's least appropriate course of action is to:", "opts": ["report the fraud to the Country X regulators.", "do nothing since Country Z has no laws that apply.", "request that the client amend the financial information so that it is not fraudulent."], "ans": "B", "expl": "\"Members and Candidates must understand and comply with all applicable laws, rules, and regulations (including\nthe CFA Institute Code of Ethics and Standards of Professional Conduct) of any government, regulatory\norganization, licensing agency, or professional association governing their professional activities. In the event of\nconflict, Members and Candidates must comply with the more strict law, rule, or regulation….\"\nInvestment professionals often work with clients located in different countries with laws and regulations that might conflict with local laws.\nStandard I(A) Knowledge of the Law mandates that Members and Candidates resolve conflicts that arise when laws of different countries require\ndifferent actions in a given situation.\nIn the CFA Code and Standards, the basic rule for \"choice-of-law\" issues is that the Member (or Candidate) must always adhere to the strictest\ngiven law. However, if the Code and Standards impose stricter requirements than the law of the Member's home country or the country where the\nMember is doing business, the member must follow the Code and Standards.\nIn this scenario, Countries X and Y both require her to take some action, so she would not be acting appropriately by doing nothing even though\nher own country's laws are silent on the issue (Choices A and C).\nThings to remember:\nWhen there are differences between a country's laws and CFA Institute's Code and Standards, Members and Candidates are required to adhere to\nwhichever is the most strict.\nRecommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 7, "q": "Hella Flosadottir, CFA, resides in Country A and works for an investment bank located there. Her clients include a pension fund located in Country B. Flosadottir routinely checks the monthly statements of all her clients, and the statement for the pension fund leads her to suspect that somebody may be embezzling from the fund. However, the statement does not contain enough information for her to be sure that embezzlement is occurring. The relevant laws of each country are shown below: Country Requirements of country's laws Comparative strictness to Code and Standards Country A Notify client of possible embezzlement Less strict Country B Notify police in Country B More strict To comply with Standard I(A) Knowledge of the Law, which of the following is Flosadottir's most appropriate action? ", "opts": ["Contact the police in Country B", "Advise the client of the possible embezzlement", "Inform her firm's compliance officer of the situation"], "ans": "A", "expl": "\"Members and Candidates must understand and comply with all applicable laws, rules, and regulations (including\nthe CFA Institute Code of Ethics and Standards of Professional Conduct) of any government, regulatory\norganization, licensing agency, or professional association governing their professional activities. In the event of\nconflict, Members and Candidates must comply with the more strict law, rule, or regulation....\"\nStandard I(A) Knowledge of the Law prescribes how Members and Candidates resolve conflicts when the applicable laws of a jurisdiction conflict\nwith behaviors required by the CFA Institute Code and Standards. The general rule is that Members and Candidates must adhere to the stricter\nof:\nthe laws and regulations in their home country and\nthe Code and Standards.\nIn this scenario, the laws of Hella Flosadottir's country (Country A) are less strict than both the Code and Standards and the laws of Country B.\nCountry B's laws are stricter than the Code and Standards, so Flosadottir's most appropriate action is to contact the Country B police.\n(Choices B and C) Country A's laws would require Flosadottir to notify the client; the Code and Standards require her to seek guidance from her\nfirm's compliance officer. However, since both options are less strict than the laws of Country B, Country B's laws apply.\nThings to remember:\nMembers and Candidates are required to follow the laws of the country in which they live or conduct business, whichever is stricter. However, if\nthose laws are less strict than the CFA Institute Code and Standards, Members and Candidates must follow the Code and Standards.\nRecommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 8, "q": "Latha Mani, CFA, manages an index fund with a small-cap growth mandate. The fund is owned by Alpha Investments and has thousands of investors. Mani's primary duty of loyalty is to:", "opts": ["the investors in the fund.", "operate the fund to its mandate.", "Alpha Investments' shareholders."], "ans": "B", "expl": "\"Members and Candidates have a duty of loyalty to their clients and must act with reasonable care and exercise\nprudent judgment. Members and Candidates must act for the benefit of their clients and place their client's\ninterests before their employer's or their own interests.\"\nStandard III(A) Loyalty, Prudence, and Care requires Members and Candidates to be loyal to their clients and to use prudence and care when\nmaking investment decisions on a client's behalf. This first step is properly identifying the client. For Members and Candidates in an advisory role,\nthe client is the service's investors or beneficiaries. In cases where the Member or Candidate is a fund manager, the client is not an investor or\nbeneficiary but the investment fund and its mandate.\nIn this scenario, Latha Mani manages an index fund with a specific mandate. Although the fund has investors, those investors may enter and exit\nthe fund of their own accord. Mani is not their advisor and therefore does not owe them her loyalty (Choice A). Mani must be loyal to managing\nthe fund to its mandate since investors have made investment decisions based on the expectation of using Mani's fund to gain exposure to small\ncap growth stocks. Deviating from that mandate would breach clients' trust.\n(Choice C) Although Mani owes loyalty to her employer and its shareholders, clients or fund investors take precedence before employers.\nTherefore, Mani's primary duty of loyalty is owed to managing the fund to its mandate.\nThings to remember:\nStandard III(A) Loyalty, Prudence, and Care requires Members and Candidates to be loyal to their clients, which first requires identifying the client.\nIn cases where the Member or Candidate is not an advisor, the client may not be an entity but an investment mandate. In those cases, the loyalty\nis owed to investing the fund to that mandate.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 9, "q": "Jacqueline Dumont, CFA, is an adviser to high-net-worth clients. For over 20 years, she advised Marc and Denise Paraguet, who divorced three years ago. As a condition of the divorce, all of their joint accounts were closed, and their assets were divided between them. After the divorce was settled at the end of 20X1, Denise Paraguet remained Dumont's client for one year, then ended their advisory relationship and moved her investments to another firm. Marc Paraguet, who remains a client of Dumont's, recently asked Dumont for information about Denise's investment activities during 20X2, when she was still Dumont's client. To comply with Standard III(E) Preservation of Confidentiality, which of the following is Dumont's best course of action?", "opts": ["Share the information since Marc is her client.", "Do not share the information since Denise was her client.", "Share the information since Denise is no longer her client."], "ans": "B", "expl": "\"Members and Candidates must keep information about current, former, and prospective clients confidential\nunless:\n1. The information concerns illegal activities on the part of the client or prospective client,\n2. Disclosure is required by law, or\n3. The client or prospective client permits disclosure of the information.\"\nStandard III(E) Preservation of Confidentiality addresses confidentiality of client information. Just as members and candidates have a duty to be\nloyal to clients, they have a duty to maintain confidentiality of client information. Confidential information may be disclosed only if the client\nauthorizes it, if applicable law requires it, or if it involves a client's illegal activities.\nMembers and candidates have the same duty of confidentiality with regard to prospective clients, current clients, and former clients. Members\nand candidates must maintain confidentiality even when the client relationship no longer exists (Choice C).\n(Choice A) Although Dumont has a duty of loyalty to Marc as her client, she also still has a duty to Denise as her former client, and she must\nmaintain the confidentiality of Denise's information.\nThings to remember:\nMembers and candidates have a duty to maintain confidentiality of client information. The same duty of confidentiality applies to prospective\nclients, current clients, and former clients. Members and candidates are expected to abide by applicable laws and should share confidential\ninformation if required by law or if it concerns a client's illegal activities.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 10, "q": "Grace Kim, CFA, has been an adviser to clients at Keundon Investments for 10 years. Kim negotiates with Keundon to cut back her hours to 20 per week (from 50) to allow her to manage her father's care. Kim agrees to give up her advising role and work in the firm's back office. She will be paid 25% of her usual salary, but she hopes to eventually return to full-time advising. Kim informs clients of her new role and that they will have a new adviser at the firm. The next day, one of her clients offers to pay her to confidentially review any recommendations he receives from another adviser, as he trusts her judgment. To comply with Standard IV(B) Additional Compensation Arrangements, which of the following actions is most likely required of Kim?", "opts": ["Refuse the client's offer", "Accept the offer and inform her employer in writing", "Obtain written permission from her employer before accepting the offer"], "ans": "C", "expl": "\"Members and Candidates must not accept gifts, benefits, compensation, or consideration that competes with or\nmight reasonably be expected to create a conflict of interest with their employer's interest unless they obtain\nwritten consent from all parties involved.\"\nStandard IV(B) Additional Compensation Arrangements notes that third-party, additional compensation is allowed. However, if the\narrangement could be reasonably seen as creating a conflict with the employer, the Member or Candidate must obtain written permission from\nall parties involved.\nIn this case, continuing her advising activities could reasonably be seen as presenting a conflict with Kim's agreed-upon, diminished role at the\nfirm. Kim would be required to obtain written permission from both the client and her employer.\n(Choice A) Kim's duty of loyalty does not require her to refuse the offer; she may accept it if she first obtains written permission from all parties.\n(Choice B) Merely informing her employer is not quite enough; Kim must get the employer's written permission as an involved party before she\ncan accept the offer.\nThings to remember:\nStandard IV(B) Additional Compensation Arrangements allows for third-party, additional compensation as long as all involved parties provide\nwritten permission.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 11, "q": "Ajay Patel, CFA, is a financial adviser for Eclipse Financial. At a party, Patel discusses financial advisory services with Nira Jain. Jain asks Patel to be her adviser, but Patel states that he cannot accept new clients. Patel recommends Eclipse and states that he has faith in all the company's advisers. Jain agrees to become a client of Eclipse if Patel agrees to meet with her quarterly over dinner, paid for by Jain, to discuss her portfolio allocation. Which of the following best describes Patel's options under the Code and Standards?", "opts": ["Patel must reject the offer", "Patel can accept the offer but then must disclose it immediately to Eclipse in writing", "Patel can accept the offer only after disclosing it in writing to Eclipse and receiving approval in writing"], "ans": "C", "expl": "\"Members and Candidates must not accept gifts, benefits, compensation, or consideration that\ncompetes with or might reasonably be expected to create a conflict of interest with their employer's\ninterest unless they obtain written consent from all parties involved.\"\nStandard IV(B) Additional Compensation Arrangements requires Members and Candidates to obtain written permission when third-party,\nadditional compensation agreements could be reasonably seen as creating a conflict with their employers. Permission must be received from\nall parties before the agreement can be accepted. The Standard applies to both monetary and nonmonetary (eg, gifts, benefits) compensation.\nIn this scenario, accepting Jain's offer to pay for quarterly dinners to discuss portfolio allocation could be perceived as a conflict of interest since\nPatel's actions can be perceived as giving Jain preferential treatment. His advice could be viewed as favoring Jain over his own clients and may\nrun counter to advice given by Eclipse's other advisers. To comply with the Standard, Patel would be required to obtain written permission from\nboth Jain and Eclipse before accepting the offer so Eclipse can monitor his actions.\n(Choice A) Patel is not required to reject the offer so long as he obtains written permission from all parties involved so his employer can monitor\nfor conflicts.\n(Choice B) Informing Eclipse after accepting the offer is a violation of the Standard. Patel must receive permission before agreeing so Eclipse\ncan decide if the agreement presents a conflict.\nThings to remember:\nStandard IV(B) requires Members and Candidates to obtain written permission when third-party, additional compensation agreements could be\nreasonably seen as creating a conflict with their employers. Permission must be received from all parties before an agreement can be accepted.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 12, "q": "Champion Partners is an asset management firm that employs both Charterholders and non-Charterholders as portfolio managers. Lorraine Dubois, CFA, is a portfolio manager for Champion who wishes to use third-party research reports in her investment process. Champion's portfolio managers are allowed to use third-party research only from firms whose research is vetted by the firm's senior managers. Dubois receives a report from Dominion Financial, one of the third-party research firms approved by Champion's senior managers. To comply with the Standards, most likely Dubois:", "opts": ["cannot use any third-party research in her process.", "can use the research report without further due diligence.", "must conduct her own due diligence on the third-party research."], "ans": "B", "expl": "\"Members and Candidates must:\n1. Exercise diligence, independence, and thoroughness in analyzing investments, making investment recommendations, and\ntaking investment actions.\n2. Have a reasonable and adequate basis, supported by appropriate research and investigation, for any investment analysis,\nrecommendation, or action.\"\nStandard V(A) Diligence and Reasonable Basis requires Members and Candidates who are managers or advisors to conduct thorough and\ndiligent analysis on all investments made on behalf of their clients. As long as they ascertain the soundness of the research, Member or\nCandidate managers or advisors may use research from:\nsecondary sources (analysis completed by another member of the same firm), or\nthird-party sources (analysis completed outside the firm) (Choice A).\nMembers or Candidates may trust others in the same firm to determine if such research is reliable.\nIn this scenario, Lorraine Dubois can use the third-party research she received without further due diligence since the vetting was already done by\nthe firm's senior managers. The Standard allows her to trust the due diligence done, so she does not need to do her own due diligence before\nusing it (Choice C).\nThings to remember:\nStandard V(A) requires Members and Candidates who are managers or advisors to conduct thorough and diligent analysis of all investments\nmade on behalf of their clients. Using secondary and third-party research is allowed. Members or Candidates may trust others within the same\nfirm to determine if such research is reliable.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 13, "q": "Naomi Jorgensen, CFA, a broker at Belton Financial, Inc., currently has a sell rating on Alpha Pharmaceuticals, Inc. (API) due to its lackluster pipeline of therapeutics. Derek DiGravio, CFA, an investment banker at Belton, is helping API with its next round of funding and believes that if API receives an additional cash infusion, it will be very successful. DiGravio suggests to Jorgensen that she should reconsider her rating. To comply with Standard I(B) Independence and Objectively, Jorgenson's best course of action is to:", "opts": ["request reassignment of security coverage.", "rate API only as a hold until corroborating public information is available.", "update clients with publicly available information but abstain from giving API a rating."], "ans": "C", "expl": "\"Members and Candidates must use reasonable care and judgment to achieve and maintain independence and\nobjectivity in their professional activities. Members and Candidates must not offer, solicit, or accept any gift,\nbenefit, compensation, or consideration that reasonably could be expected to compromise their own or another's\nindependence and objectivity.\"\nInternal and external influencers may interfere with a Member's independent analysis. For example, teammates in other departments may\npressure analysts to give a certain opinion, as DiGravio does in this scenario by trying to influence Jorgensen's rating due to Belton Financial,\nInc.'s investment banking business.\nTo maintain her objectivity, Jorgensen should give clients factual updates based only upon publicly available information regarding Alpha\nPharmaceuticals, Inc (API). Furthermore, to avoid any appearance of a conflict, she should issue no recommendation (Choice B).\n(Choice A) Transferring the responsibility of providing a recommendation on API to another individual does not eliminate the conflict of interest\nbetween investment banking and brokerage personnel.\nThings to remember:\nSince others may attempt to influence an independent analysis, Members and Candidates should avoid circumstances in which a loss of\nobjectivity is likely. If such circumstances are unavoidable, the Member or Candidate should issue no recommendation, and clients should receive\nonly publicly available information.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 14, "q": "Hans Mohr, CFA, manages the Matrix European Stock Index Fund at Matrix Ltd. In his personal accounts, Mohr actively trades stocks, bonds, and mutual funds, but he does not invest in any fund that he manages. Matrix does not require any disclosures regarding personal trading, and Mohr makes no disclosures. Has Mohr violated Standard VI(A) Disclosure of Conflicts?", "opts": ["Yes.", "No, since Matrix does not have any disclosure requirements.", "No, since Mohr does not invest in any fund that he manages."], "ans": "A", "expl": "\"Members and Candidates must make full and fair disclosure of all matters that could reasonably be expected to impair their\nindependence and objectivity or interfere with respective duties to their clients, prospective clients, and employer. Members and\nCandidates must ensure that such disclosures are prominent, are delivered in plain language, and communicate the relevant\ninformation effectively.\"\nConflicts of interest between investment professionals and their clients or employers may create the perception of compromised independence\nand objectivity. One focus of Standard VI(A) is personal trading by investment personnel. When analysts trade securities for a personal\naccount, it may create incentives that bias them in their dealings with employers and/or clients.\nTo address this concern, Members and Candidates should disclose to their employers any securities held in accounts in which they have a\nbeneficial interest; once informed, employers may take appropriate steps to limit or prevent any conflicts of interest and to provide disclosure to\nclients.\n(Choices B) Matrix should establish disclosure policies and require disclosure of employee trading in personal accounts. As a charterholder, Mohr\nshould urge his employer do so to avoid even the appearance of conflicts.\n(Choices C) Mohr should disclose all securities held in his personal account, regardless of whether he manages the investment.\nThings to remember:\nWhen analysts trade securities for a personal account, it may create incentives that bias them in their dealings with employers and/or clients. To\naddress this concern, Members and Candidates should disclose to their employers any securities held in accounts in which they have a beneficial\ninterest; once informed, employers may take appropriate steps to limit or prevent any conflicts of interest and to provide disclosure to clients.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 15, "q": "Zhao Fen, CFA, is an independent investor. She holds a large position of Formula Industries, a lightly traded stock with low liquidity, in one of her two personal accounts. If Zhao wishes to exit the position, which of the following would most likely violate the Standards?", "opts": ["Using an intermediary to sell the position outside of the market to avoid price impacts.", "Selling her holdings as one position, which would likely cause a large drop in the price.", "Trading the stock between personal accounts to attract interest from other market participants."], "ans": "C", "expl": "\"Members and Candidates must not engage in practices that distort prices or artificially inflate trading volume with\nthe intent to mislead market participants.\"\nStandard II(B) Market Manipulation prohibits activities by Members or Candidates that deceive market participants by distorting securities\nprices or volumes. Manipulation can occur through:\ninformation-based activities (eg, issuing false or misleading information) and/or\ntransaction-based activities (eg, exaggerated trading between two accounts).\nThe Standard does not prevent the use of legitimate trading strategies, even if they cause price movements or are designed to purposefully limit\nthe impact on the market. The key element in determining whether the Standard is violated is intent: if the strategy is intended to deceive\ninvestors, it violates the Standard.\nIn this scenario, if Zhao Fen traded Formula Industries stock between her personal accounts, it would give market participants a false impression\nof higher trading volume since the trading is not done between unique market participants. Deceiving participants through transaction-based\nmanipulation violates the Standard.\n(Choice A) Using an intermediary (eg, block house) to sell the position outside the market or break the order into smaller batches is a legitimate\ntrading strategy. This practice aims to reduce a sale's impact on the market, but the resulting trades are done with other market participants and\ntherefore do not violate the Standard.\n(Choice B) While selling all the holdings in one position might drive down the price, Zhao may do so without intending to manipulate market\nparticipants; therefore, it is not the action most likely to violate the Standard. The Standards do not require Members or Candidates to\ndisadvantage themselves to uphold market integrity, so this strategy can be used if cash is needed quickly.\nThings to remember:\nStandard II(B) prohibits activities by Members or Candidates that deceive market participants to distort securities prices or volumes. The Standard\nallows the use of legitimate trading strategies, even if they impact security prices. The key element in determining whether the Standard is\nviolated is intent.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 16, "q": "Ethan Clarke, CFA, is the Director of Research at Hogan Securities Ltd. Clarke hires an outside firm, Perkins Analytics Company (PAC), for external research. PAC maintains that the accuracy of its research is reliable since its source is publicly available data. Clarke believes this claim since PAC has an excellent reputation. Without further assessment, he communicates by email to all employees at Hogan Securities that the research is \"good to use.\" Victoria Wheeler, CFA, makes recommendations to her clients based on PAC's investment research. In good faith, Wheeler relies on Clarke's approval that PAC's research is sound. Wheeler has no reason to question the process and procedures of third-party research since Clarke oversees Wheeler. With respect to Standard V(A) Diligence and Reasonable Basis, the Standard was most likely violated by:", "opts": ["both Clarke and Wheeler.", "Clarke only, by not performing due diligence on Perkins' research.", "Wheeler only, by accepting Clarke's assessment of Perkins' research."], "ans": "B", "expl": "\"Members and Candidates must:\n1. Exercise diligence, independence, and thoroughness in analyzing investments, making investment\nrecommendations, and taking investment actions.\n2. Have a reasonable and adequate basis, supported by appropriate research and investigation, for any\ninvestment analysis, recommendation, or action.\"\nAccording to Standard V(A) Diligence and Reasonable Basis, when members or candidates use secondary (ie, analysis completed at the same\nfirm) or third-party (outside the firm) research they must take reasonable and diligent steps to ascertain the soundness of the research. If their\nown investigation leads them to conclude that the secondary or third-party research is reliable, then they may use it; otherwise, they should ignore\nit.\nHere, Clarke has a responsibility to perform due diligence on PAC's research irrespective of his belief in PAC's reputation. A recommended\nsolution is to establish a process that details how third-party research should be evaluated before it can be used. Clarke violated the Standard\nsince, without further assessment, he communicated that the research was \"good to use.\"\nMembers or candidates may trust others within the same firm to determine if research is reliable. Wheeler trusts Clarke's statement that it is\n\"good to use.\" Even though Clarke did not conduct due diligence on PAC, his communication implied that he did. Wheeler may assume that\nClarke conducted thorough due diligence on PAC. Wheeler did not violate the Standard since she, in good faith, relied on Clarke's statement\n(Choices A and C).\nThings to remember:\nMembers and candidates may use secondary or third-party research if they diligently carry out steps to ascertain the soundness of the research.\nThey may trust fellow employees to determine if external research is reliable.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 17, "q": "Karl Mahler, CFA, creates a mutual fund in Country A, where he is a resident. Mahler intends to sell the security in both Country A and Country B. The laws of Country A are more strict than the laws of Country B, and the laws of both countries are more strict than the Code and Standards. When selling the mutual fund in Country B, Mahler must adhere to the:", "opts": ["laws of Country A.", "laws of Country B.", "Code and Standards."], "ans": "A", "expl": "\"Members and Candidates must understand and comply with all applicable laws, rules, and regulations (including the CFA\nInstitute Code of Ethics and Standards of Professional Conduct) of any government, regulatory organization, licensing agency, or\nprofessional association governing their professional activities. In the event of conflict, Members and Candidates must comply\nwith the more strict law, rule, or regulation. Members and Candidates must not knowingly participate or assist in and must\ndissociate from any violation of such laws, rules, or regulations.\"\nTo abide by Standard I(A) Knowledge of the Law, Members and Candidates who create financial products that will be sold in more than one\ncountry must comply with each country's laws and regulations. When the laws conflict, Members and Candidates must comply with the stricter\nlaw. However, if the Code and Standards are stricter than the country's laws, then Members and Candidates must adhere to the Code and\nStandards.\nIn this scenario, Karl Mahler must compare the laws in the country where the product originated with the laws in the additional country where it will\nbe sold and compare both with the Code and Standards.\nThe laws in Country A, the country of origin, are stricter than the Code and Standards, so when Mahler sells the mutual fund in Country A,\nhe must adhere to the laws of Country A.\nThe laws in Country B, the additional country of sale, also are more strict than the Code and Standards, so Country B's laws take\nprecedence (Choice C).\nHowever, the laws in Country B are less strict than those in Country A, so Mahler must adhere to Country A's laws when he sells the mutual\nfund in Country B. Country A's laws are the most strict of the three possibilities (Choice B).\nThings to remember:\nMembers and Candidates who create and sell investment products in their home countries and different countries must adhere to the laws of\nwhichever country has the strictest laws. However, if the Code and Standards are stricter than all the countries' laws, then Members and\nCandidates must adhere to the Code and Standards.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 18, "q": "Kathy Lee Wayne, CFA, is a portfolio manager who supervises a team at a large investment firm. Since the firm has adopted CFA Institute Code and Standards, Wayne assumes its compliance policies and procedures are adequate for monitoring her team. During her annual performance review, her supervisor tells Wayne that annual bonuses will be based only on hitting investment performance targets \"no matter what it takes.\" Wayne replies, \"That sounds fine. I'll let my team know, and my team will hit its targets!\" Some months later, a member of Wayne's team admits to falsifying reports in order to make it appear that the team hit its performance targets. During the subsequent internal investigation, investigators conclude that Wayne did not participate in the falsification and could not be expected to have been aware of it. According to Standard IV(C) Responsibilities of Supervisors, which of the following best describes how Wayne has not complied with recommended practice?", "opts": ["Only by failing to detect her employee's unethical activity", "Only by readily accepting the incentive structure of the firm", "Both by failing to detect her employee's unethical activity and by readily accepting the incentive structure of the firm"], "ans": "C", "expl": "\"Members and Candidates must make reasonable efforts to ensure that anyone subject to their supervision or authority complies\nwith applicable laws, rules, regulations, and the Code and Standards.\"\nRecommendations for compliance with the Standard IV(C) Responsibilities of Supervisors acknowledge that a supervisor may not be able to\ndictate the ethical standards, culture, or compliance efforts of an entire firm, but should work with management to encourage the adoption of\neffective compliance tools. One effective compliance tool is an incentive structure that supports ethical behavior.\nHere, Wayne should have recognized the firm's incentive structure as not supportive of ethical behavior and, in fact, perhaps as actually\nencouraging unethical behavior. She should have brought this weakness to her supervisor's attention rather than accepting it without question.\nThe guidance for Standard IV(C) is very clear that failing to detect unethical behavior does not mean that the supervisor violated the Standard or\nignored its recommendations. However, in this case, there is no evidence that Wayne ever investigated the firm's policies and procedures to\ndetermine if they were adequate to prevent the type of unethical behavior that occurred. As a Charterholder, Wayne cannot assume, without\ninvestigation, that the existing policies are sufficient.\nThings to remember:\nAccording to Standard IV(C) Responsibilities of Supervisors, supervisors must make efforts to ensure compliance with ethical codes, laws, and\nregulations. A supervisor should work with management to encourage the adoption of effective compliance tools, such as an incentive structure\nthat supports ethical behavior, and to alert management to weaknesses in the compliance structure.\nRecommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 19, "q": "Ishani Gupta works in the manufacturing industry and wants to transition into a financial services role. She believes a CFA charter can help with this transition. Gupta recently sat for Level III of the CFA exam and is excited to update her resume to send to potential employers, although she has not yet received her results. Which of the following statements can she most appropriately use on her resume to adhere to the Standards?", "opts": ["\"The knowledge gained from the CFA program makes me a superior candidate.\"", "\"I will be eligible for a CFA charter after completing my required work experience.\"", "\"My studies in the CFA program have enhanced my knowledge and skills in finance.\""], "ans": "C", "expl": "\"When referring to CFA Institute, CFA Institute membership, the CFA designation, or candidacy in the CFA Program, Members\nand Candidates must not misrepresent or exaggerate the meaning or implications of membership in CFA Institute, holding the\nCFA designation, or candidacy in the CFA Program.\"\nStandard VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program regulates how Members and Candidates may use the\nCFA designation. Stating objective facts about the benefits of achieving the CFA designation or the intensity and rigor of the CFA program is\nallowed. This includes statements about knowledge and skills gained.\nHowever, the Standard forbids Members and Candidates from exaggerating the meaning or implication of their CFA charters, such as declaring\nsuperior competency as an investment professional or suggesting charter holders are more qualified than non–charter holders (Choice A).\n(Choice B) Gupta sat for the Level III exam but has not yet received her results. She does not yet know if she passed, and therefore saying that\nshe will be eligible for the charter after completing the required work experience is a violation of the Standard.\nThings to remember:\nStandard VII(B) forbids Members and Candidates from exaggerating the meaning or implication of their CFA charters. Stating facts about the CFA\ndesignation and program is allowed, including statements about knowledge or skills gained. However, the Standard does not allow statements\nthat tie the CFA designation to an ability to achieve superior performance.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 20, "q": "Andrei Ostrovsky, CFA has been employed as an advisor at Bolshoi Investments Inc. (BII) for several years. His employment agreement does not include a \"noncompete\" clause or termination policies. Ostrovsky decides to leave BII and start a new advisory firm. Prior to giving notice to his employer, Ostrovsky spends a few weekends setting up his new office. There he \"connects\" with as many of his clients as he can on social media, which is easy as he knows their names. Before leaving BII, he does not mention his departure from BII or his plans for his new firm to any client, on or off social media. One day after leaving BII, he posts a notice on a social media site that he has left BII and that he would be happy to continue to advise his former clients at his new firm. With regards to Standard IV(A) Loyalty, has Ostrovsky most likely violated the Standard? ", "opts": ["No", "Yes, by soliciting business from BII's clients", "Yes, by \"connecting\" with BII's clients while still employed by BII"], "ans": "A", "expl": "\"In matters related to their employment, Members and Candidates must act for the benefit of their employer and\nnot deprive their employer of the advantage of their skills and abilities, divulge confidential information, or\notherwise cause harm to their employer.\"\nStandard IV Duties to Employers addresses the Member or Candidate's responsibilities as an employee. Standard IV(A) Loyalty notes that\nMembers and Candidates must try to protect the interests of their employer and avoid actions that may harm those interests.\nBefore leaving an employer, a Member or Candidate must follow its policies and procedures for notifying clients and must not make any attempt to\nsolicit clients for another firm. After leaving an employer, the Member or Candidate can solicit former clients as long as the contact information\nused is not the property of the former employer.\nIn this case, Ostrovsky did not mention either his departure from BII or his future plans to his BII clients before leaving BII, and he did not use BII's\nproprietary data to contact them, so he has not violated the Standard (Choices B and C).\nThings to remember:\nStandard IV(A) Loyalty notes that Members and Candidates must try to protect the interests of their employer. Before leaving an employer, a\nMember or Candidate must not make any attempt to solicit clients for another firm. After leaving a firm, the Member or Candidate can solicit\nformer clients as long as the contact information used is not the property of the former employer.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 21, "q": "Elise Berger, CFA, is sell-side analyst for Brick Wall Bank (BWB). Based on BWB's process, Berger sends her research reports through email to all clients simultaneously. BWB's largest client, Standard Capital, offers to pay higher commissions to BWB for follow-up phone calls from Berger when she releases new research. BWB and Berger agree to this arrangement. Berger plans to offer this deal only to BWB's next nine largest clients since only they do enough business with BWB to afford the new service at the new, higher level of commission. Which of the following best describes Berger's options under the Code and Standards?", "opts": ["Offer the higher level of service as planned", "Not offer different levels of service to her customers", "Offer the higher level of service only if it is offered to all clients"], "ans": "C", "expl": "\"Members and Candidates must deal fairly and objectively with all clients when providing\ninvestment analysis, making investment recommendations, taking investment action, or engaging\nin other professional activities.\"\nStandard III(B) Fair Dealing requires Members and Candidates to treat all clients fairly when recommending investments or undertaking\ninvestment actions on their behalf. Members and Candidates must ensure their investment recommendations are disseminated in a way that\nprovides all clients the fair opportunity to act on every recommendation.\nHowever, \"fair\" does not mean \"equal.\" The Standard allows firms and analysts to offer higher levels of service to clients willing to pay a\npremium (Choice B). These services:\nmust not disadvantage or negatively affect other clients and\nmust be disclosed and available to all clients and prospective clients.\nIn this scenario, Berger plans to offer the higher level of service (ie, follow-up calls) only to Brick Wall Bank's (BWB's) ten largest clients. Since\nshe does not plan to offer this service to other clients, she violates the Standard. Although other clients do not currently do enough business with\nBWB to afford the service, they might wish to do more business with BWB or pay higher commissions if the additional service were offered to them\n(Choice A). Not disclosing the service to them gives them no choice.\nThings to remember:\nStandard III(B) Fair Dealing requires Members and Candidates that are analysts to ensure their investment recommendations are fairly\ndisseminated. Different levels of service to clients are allowed if those services do not disadvantage or negatively affect other clients and are\ndisclosed and available to all clients and prospective clients.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 22, "q": "Kalim Emara, Level I CFA Candidate, works for a national nonprofit charity and is responsible for investing the organization's surplus funds. Due to the recent retirement of the charity's chief financial officer, Emara has been assigned to temporarily take on some additional responsibilities regarding management accounting and internal auditing. These additional responsibilities have reduced the amount of time Emara can devote to investment research. To comply with the equity allocation guidelines of his organization's investment policy, Emara invests in a popular broad- based equity index fund without performing any specific evaluation of the fund. Emara is also an activist with a community group that opposes a regional hospital's plan to close down its local emergency services. Emara has been arrested twice while participating in weekend protests of the hospital's plans. Based on this information, has Emara most likely violated Standard I(D)? ", "opts": ["No.", "Yes, by engaging in illegal activity that led to his arrest.", "Yes, by failing to research the broad-based equity index fund."], "ans": "A", "expl": "\"Members and Candidates must not engage in any professional conduct involving dishonesty, fraud, or deceit or commit any act that reflects\nadversely on their professional reputation, integrity, or competence.\"\nStandard I(D) Misconduct is primarily concerned with the professional activities of a Member or Candidate, which covers all conduct that may\nnegatively impact the Member's or Candidate's trustworthiness, reputation, or ability to perform their duties. Examples include acts that involve\nlying, cheating, theft, fraud, or other dishonest behavior. However, violations of Standard I(D) are not limited to actions specifically prohibited by\nthe Standard.\nFailure to take appropriate action or lack of sufficient effort may also constitute a violation. However, there are other Standards that\nspecifically address Emara's adding the broad-based equity fund (eg, V(A) – Diligence and Reasonable Basis; III(C) – Suitability). Standard I(D)\naddresses fraud and misconduct that erode public trust in the profession. Nothing in Emara's actions suggests that he committed fraud or\ndeception, and asserting that Emara also violated Standard I(D) is an overbroad reading of the Standard (Choice C).\n(Choice B) Being arrested and jailed for acts of civil disobedience does not in itself constitute a violation of Standard I(D). In this case, Emara's\nprotest activities are a form of civil disobedience that does not reflect poorly on his professional capacities.\nThings to remember:\nStandard I(D) focuses on actions (eg, fraud, deceit), whether legal or illegal, that may call into question the competence, reputation, and\nprofessional integrity of any Member or Candidate. In addition, failure to take appropriate action (eg, due diligence) may violate Standard I(D).\nSome illegal activities, such as civil disobedience, are not violations as long as the activities do not reflect poorly on a Member's or Candidate's\nprofessional integrity.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 23, "q": "Joanna Krakowski, CFA, is the chief compliance officer (CCO) at Universal Investment Managers (UIM). Krakowski recently hired John Smith, CFA, as a compliance manager. Smith will report directly to Krakowski, who believes the current compliance systems and procedures are adequate. As Smith settles into his new position, he discovers numerous deficiencies including outdated software, excessive manual processes, a compliance manual that has not been updated in four years, and inadequately trained and understaffed compliance personnel. Smith meets with Krakowski to address these shortcomings, as he does not believe he can adequately perform his duties given the circumstances. Krakowski informs Smith that there is no money in the budget for new software or additional employees. Smith's most appropriate action is to:", "opts": ["improve the compliance program using his best efforts, given his duty is to his employer.", "decline his supervisory responsibilities in writing until the compliance systems are improved.", "immediately submit a written resignation from UIM, since the compliance program is deficient."], "ans": "B", "expl": "\"Members and Candidates must make reasonable efforts to ensure that anyone subject to their supervision or authority complies\nwith applicable laws, rules, regulations, and the Code and Standards.\"\nStandard IV(C) Responsibilities of Supervisors requires Members and Candidates who supervise employees to encourage behavior that complies\nwith local laws, rules established by their firms, and the Code and Standards. They also must take reasonable steps to detect and prevent\nviolations. A Member or Candidate who encounters an inadequate compliance system should bring the shortcomings of the system to the\nattention of the company's managers and make recommendations for corrective actions.\nAny Member or Candidate who cannot perform supervisory responsibilities due to these shortcomings should decline to accept supervisory\nresponsibility, in writing, until the compliance system is improved and allows for adequate controls. Accepting a supervisory role when the\ncompliance system is inadequate would not allow the Member or Candidate to adequately monitor compliance by subordinates, and thus would\nviolate the Standard.\n(Choice A) Smith has a duty to his employer to improve the compliance program using his best efforts but must decline the supervisory\nresponsibilities of the job until the firm has committed to investing appropriate resources into the compliance program.\n(Choice C) The Standard does not require the Member or Candidate to resign but to decline the supervisory responsibilities of the job until the\ncompliance program is sufficiently improved.\nThings to remember:\nWhen Members or Candidates encounter an inadequate compliance system, they should bring the shortcomings of the system to the attention of\ncompany managers and make recommendations for corrective actions. Members and Candidates should decline to take on supervisory\nresponsibility in writing until the compliance system is fixed and allows for adequate controls.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 24, "q": "Hashimoto, CFA, is a personal wealth advisor at a large brokerage firm that offers fee-based, tiered client services to all clients. The firm has just published an updated and in-depth analysis of a global oil producer. The analysis notes that the firm is changing its recommendation on the oil company's stock from \"sell\" to \"buy,\" despite an announcement that the producer is cutting its dividend amid greater volatility in the global oil markets. Hashimoto writes a one-page summary of the analysis, which omits any mention of the recommendation change. Hashimoto sends the in-depth analysis to Ueda, who is his largest client by assets under management. She receives the highest level of the firm's tiered services. He sends only the brief summary to his client Yamaguchi, who has a smaller account and receives a lower tier of service. He decides not to send anything to a third client, Fujita, who is retired and dependent on the income from her small portfolio, and who receives the lowest tier of service. With respect to Standard III(B) on Fair Dealing, Hashimoto most likely violated the Standard by not distributing:", "opts": ["the recommendation change to Yamaguchi only.", "the in-depth analysis to both Fujita and Yamaguchi.", "the recommendation change to both Fujita and Yamaguchi."], "ans": "C", "expl": "\"Members and Candidates must deal fairly and objectively with all clients when providing investment analysis,\nmaking investment recommendations, taking investment action, or engaging in other professional activities.\"\nStandard III(B) Fair Dealing focuses on a Member's and Candidate's responsibility to treat all clients fairly, specifically in terms of information\ndistribution and investment actions. Advisers must distribute information on a change in recommendation so that each client has an\nappropriate and fair opportunity to act on the information.\nIn this case, Hashimoto has an obligation to inform all clients about the change of recommendation, regardless of whether it is accompanied by\nmore detailed research and analysis. Although the investment seems unsuitable for Fujita, and both Fujita and Yamaguchi receive lower tiers of\nservice, they should both be informed of any change in the recommendation and be given an opportunity to act (Choice A).\n(Choice B) Differentiated client services based on fees or levels of client activity are fair if they are offered to all clients. In this case, Hashimoto\nhas not violated the Standard by sending one client a more detailed analysis, since that client has chosen to receive a higher level of service.\nHowever, all clients should be notified of
