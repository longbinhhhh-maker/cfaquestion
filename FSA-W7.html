tml": null}, {"n": 28, "q": "A company reporting under IFRS elects to use the revaluation model for its equipment. The company purchases equipment for €10 million during 20X3. At the end of 20X3, the fair value of the equipment is €11 million. The company most likely records a €1 million: ", "opts": ["increase in equity.", "gain on the income statement.", "decrease in depreciation expense."], "ans": "A", "expl": "Financial statement treatment of revaluation of noncurrent assets—IFRS only\nUpward revaluation Downward revaluation\nGain recognized in other comprehensive income (OCI) as\nInitial Loss recognized on income statement\nrevaluation surplus\nRecognized on income statement to the extent of previous\nReduces revaluation surplus\nrecognized losses\nSubsequent If revaluation surplus = 0, recognized on income\nGain in excess of previous losses recognized as revaluation\nstatement as loss\nsurplus\nIFRS, but not US GAAP, allow companies to choose between the cost model and the revaluation model for valuing long-lived assets. Using the\nrevaluation model, an asset's carrying value is adjusted based on the asset's fair value. Revaluations adjust an asset's carrying value upward\nor downward. These adjustments may be made during the initial year of ownership and/or subsequently over the equipment's useful life.\nAn initial upward revaluation means that the company reports the asset at a higher value than its original cost. For an initial upward revaluation,\nthe increase in value bypasses the income statement and is reported as part of other comprehensive income; it is not recorded as a gain and\nhas no impact on expenses or net income (Choices B and C). The revaluation bypasses the income statement since the higher valuation is\noutside of management's control and so the company should not report increased profits from it.\nThe company may record an increase in profits only if there is a subsequent increase in fair value following previous reductions in value. Then the\nincrease in fair value—and profit—is limited to previous decreases in value. Any increase in value above previous losses is also recorded in other\ncomprehensive income.\nThings to remember:\nRevaluation of noncurrent assets is permitted under IFRS but not under US GAAP. Initial upward revaluations are recorded in other\ncomprehensive income; they bypass the income statement and do not impact expense or profit.\nAnalyze and interpret financial statement disclosures regarding property, plant, and equipment and intangible assets", "qhtml": null}, {"n": 29, "q": "A decision to capitalize the purchase of a long-lived asset instead of expensing it will most likely result in a company reporting:", "opts": ["less net income in the first year.", "greater cash flow from investing activities in the first year.", "greater cash flow from operating activities in the first year."], "ans": "C", "expl": "Each method of recording an asset purchase (ie, capitalizing or expensing) initially impacts the company's reported financial results differently, but\nthe cumulative impact under either method is the same over the course of time. A comparison of capitalization versus expensing is shown:\nWhen a buyer capitalizes an expenditure, long-term assets increase by the amount capitalized on the balance sheet; that amount will then be\ndepreciated over the asset's useful life. Since the initial expenditure bypasses the income statement, net income will be greater initially compared\nwith expensing an asset, but will be less in future periods due to depreciation. Furthermore, capitalizing produces greater cash from operating\nactivities since the initial cash expenditure is classified as a cash outflow under investing activities (Choice B).\nWhen a company expenses an asset, the initial expenditure appears as an operating expense on the income statement, which produces a lower\nnet income initially and less cash from operating activities compared with capitalizing the asset (Choice A). However, since no long-term asset is\nrecognized on the balance sheet, there is no periodic depreciation, which leads to higher net income in future periods.\nAnalyze and interpret financial statement disclosures regarding property, plant, and equipment and intangible assets\n30. Company A purchases a patent from Company B and acquires Company C along with its customer list. The most appropriate way for\nCompany A to account for these purchases would be to:\n\nA. capitalize both the patent and the customer list.\nB. capitalize the patent and expense the customer list.\nC. expense the patent and capitalize the customer list.\nExplanation\nTreatment for intangible assets\nAcquisition method Treatment of costs\nPurchased on a stand-alone basis Fair value of assets capitalized on balance sheet\nResearch costs expensed immediately on income statement\nDeveloped internally through research\nDevelopment costs capitalized on balance sheet if product is developed for internal use (US\nand development\nGAAP) or has demonstrated technical feasibility (IFRS)\nAcquired through a business Fair value of assets capitalized on balance sheet\ncombination (eg, merger) Additional goodwill created on balance sheet\nIntangible assets (eg, patents, customer lists) lack physical form but are still expected to grant the holder future economic benefit. These assets\ncan be obtained through a stand-alone purchase, the acquisition of another company, or internal development.\nCompanies are required to account for these assets in different ways, depending on the means of acquisition. If intangible assets are acquired\nthrough a stand-alone purchase or as part of a larger business combination (eg, acquisition), both IFRS and US GAAP require capitalizing\nthe asset: recognizing its fair value on the company's balance sheet and subsequently amortizing that value over the asset's useful life. Note that\ngoodwill, although considered an intangible asset, is not identifiable and therefore not amortized but rather periodically tested for impairment.\nIn this scenario, one company acquires a customer list as a part of its acquisition of another company and also purchases a stand-alone patent.\nUnder IFRS and US GAAP, both intangible assets should be capitalized (Choices B and C).\nThings to remember:\nA company can obtain intangible assets through stand-alone purchases, the acquisition of other companies, or internal development. Under both\nIFRS and US GAAP, if an intangible asset is acquired through a stand-alone purchase or business combination (eg, acquisition), it is capitalized.\nCompare the financial reporting of the following types of intangible assets: purchased, internally developed, and acquired in a business\ncombination", "qhtml": null}, {"n": 30, "q": "Company A purchases a patent from Company B and acquires Company C along with its customer list. The most appropriate way for Company A to account for these purchases would be to: ", "opts": ["capitalize both the patent and the customer list.", "capitalize the patent and expense the customer list.", "expense the patent and capitalize the customer list."], "ans": "A", "expl": "Treatment for intangible assets\nAcquisition method Treatment of costs\nPurchased on a stand-alone basis Fair value of assets capitalized on balance sheet\nResearch costs expensed immediately on income statement\nDeveloped internally through research\nDevelopment costs capitalized on balance sheet if product is developed for internal use (US\nand development\nGAAP) or has demonstrated technical feasibility (IFRS)\nAcquired through a business Fair value of assets capitalized on balance sheet\ncombination (eg, merger) Additional goodwill created on balance sheet\nIntangible assets (eg, patents, customer lists) lack physical form but are still expected to grant the holder future economic benefit. These assets\ncan be obtained through a stand-alone purchase, the acquisition of another company, or internal development.\nCompanies ar const CFG = {"title": "Wiley · Analysis of Long-Term Assets", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Financial Statement Analysis · 32 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
