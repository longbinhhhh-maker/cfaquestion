<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 37 — Using Multifactor Models · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}

    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>

  .expl-shell{display:flex;flex-direction:column}

</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

<script>
const DATA = [{"n": 1, "q": "Janice Barefoot, CFA, has been managing a portfolio for a client who has asked Barefoot to use the Dow Jones Industrial Average (DJIA) as a benchmark. In her first year Barefoot managed the portfolio by choosing 29 of the 30 DJIA stocks. She selected a non-DJIA stock in the same industry as the omitted stock to replace that stock. Compared to the DJIA, Barefoot has placed a higher weight on the financial stocks and a lower weight on the other stocks still in the portfolio. Over that year, the non-DJIA stock in the portfolio had a negative return while the omitted DJIA stock had a positive return. The portfolio managed by Barefoot outperformed the DJIA. Based on this we can say that the return from factor tilts and asset selection were:", "opts": ["positive and negative respectively.", "both positive.", "negative and positive respectively."], "ans": "A", "expl": "Since the replacement of the asset obviously had a negative effect, the tilting towards financial stocks must have been positive to not only compensate for the loss but produce a portfolio return greater than the DJIA.", "explhtml": "<p>Since the replacement of the asset obviously had a negative effect, the tilting towards financial stocks must have been positive to not only compensate for the loss but produce a portfolio return greater than the DJIA.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.3, LOS 37.f<\/div><div class=\"qtext\"><p>Janice Barefoot, CFA, has been managing a portfolio for a client who has asked Barefoot to use the Dow Jones Industrial Average (DJIA) as a benchmark. In her first year Barefoot managed the portfolio by choosing 29 of the 30 DJIA stocks. She selected a non-DJIA stock in the same industry as the omitted stock to replace that stock. Compared to the DJIA, Barefoot has placed a higher weight on the financial stocks and a lower weight on the other stocks still in the portfolio. Over that year, the non-DJIA stock in the portfolio had a negative return while the omitted DJIA stock had a positive return. The portfolio managed by Barefoot outperformed the DJIA. Based on this we can say that the return from factor tilts and asset selection were:<\/p><\/div>", "subj": "portfolio"}, {"n": 2, "q": "Which of the following is not an assumption of the arbitrage pricing theory (APT)?", "opts": ["The market contains enough stocks so that unsystematic risk can be diversified away.", "Security returns are normally distributed.", "Returns on assets can be described by a multi-factor process."], "ans": "B", "expl": "APT does not require that security returns be normally distributed.", "explhtml": "<p>APT does not require that security returns be normally distributed.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.1, LOS 37.a<\/div><div class=\"qtext\"><p>Which of the following is not an assumption of the arbitrage pricing theory (APT)?<\/p><\/div>", "subj": "portfolio"}, {"n": 3, "q": "A common strategy in bond portfolio management is enhanced indexing by matching primary risk factors. This strategy could be implemented by forming:", "opts": ["a portfolio with factor sensitivities equal to that of the index.", "a portfolio with factor sensitivities that sum to one.", "a portfolio with asset portfolio weights equal to that of the index."], "ans": "A", "expl": "Enhanced indexing by matching primary risk factors could be implemented by creating a tracking portfolio with the same factor sensitivities as the index but with a different set of bonds. Then any differences in performance between the portfolio and the benchmark index will be the result of bond selection ability and not from different exposures to macroeconomic factors like GDP, inflation, and interest rates.", "explhtml": "<p>Enhanced indexing by matching primary risk factors could be implemented by creating a tracking portfolio with the same factor sensitivities as the index but with a different set of bonds. Then any differences in performance between the portfolio and the benchmark index will be the result of bond selection ability and not from different exposures to macroeconomic factors like GDP, inflation, and interest rates.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.3, LOS 37.f<\/div><div class=\"qtext\"><p>A common strategy in bond portfolio management is enhanced indexing by matching primary risk factors. This strategy could be implemented by forming:<\/p><\/div>", "subj": "portfolio"}, {"n": 4, "q": "A multi-factor model that uses unexpected changes (surprises) in macroeconomic variables (e.g., inflation and gross domestic product) as the factors to explain asset returns is called a:", "opts": ["statistical factor model.", "fundamental factor model.", "macroeconomic factor model."], "ans": "C", "expl": "Macroeconomic factor models use unexpected changes (surprises) in macroeconomic variables as the factors to explain asset returns. One example of a factor in this type of model is the unexpected change in gross domestic product (GDP) growth. In fundamental factor models, the factors are characteristics of the stock or the company that have been shown to affect asset returns, such as book-to-market or price-to-earnings ratios. A statistical factor model identifies the portfolios that best explain the historical cross-sectional returns or covariances among assets. The returns on these portfolios represent the factors.", "explhtml": "<p>Macroeconomic factor models use unexpected changes (surprises) in macroeconomic variables as the factors to explain asset returns. One example of a factor in this type of model is the unexpected change in gross domestic product (GDP) growth. In fundamental factor models, the factors are characteristics of the stock or the company that have been shown to affect asset returns, such as book-to-market or price-to-earnings ratios. A statistical factor model identifies the portfolios that best explain the historical cross-sectional returns or covariances among assets. The returns on these portfolios represent the factors.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.2, LOS 37.d<\/div><div class=\"qtext\"><p>A multi-factor model that uses unexpected changes (surprises) in macroeconomic variables (e.g., inflation and gross domestic product) as the factors to explain asset returns is called a:<\/p><\/div>", "subj": "portfolio"}, {"n": 5, "q": "Which of the following is NOT an underlying assumption of the arbitrage pricing theory (APT)?", "opts": ["Asset returns are described by a K factor model.", "There are a sufficient number of assets for investors to create diversified portfolios in which firm-specific risk is eliminated.", "A market portfolio exists that contains all risky assets and is mean-variance efficient."], "ans": "C", "expl": "The APT makes no assumption about a market portfolio.", "explhtml": "<p>The APT makes no assumption about a market portfolio.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.1, LOS 37.a<\/div><div class=\"qtext\"><p>Which of the following is NOT an underlying assumption of the arbitrage pricing theory (APT)?<\/p><\/div>", "subj": "portfolio"}, {"n": 6, "q": "A tracking portfolio is a portfolio with:", "opts": ["a specific set of factor sensitivities designed to replicate the factor exposures of a benchmark index.", "a factor sensitivity of one to a particular factor in a multi-factor model and zero to all other factors.", "factor sensitivities of zero to all factors, positive expected net cash flow, and an initial investment of zero."], "ans": "A", "expl": "A tracking portfolio is a portfolio with a specific set of factor sensitivities designed to replicate the factor exposures of a benchmark index. A factor portfolio is a portfolio with a factor sensitivity of one to a particular factor and zero to all other factors. An arbitrage portfolio is a portfolio with factor sensitivities of zero to all factors, positive expected net cash flow, and an initial investment of zero.", "explhtml": "<p>A tracking portfolio is a portfolio with a specific set of factor sensitivities designed to replicate the factor exposures of a benchmark index. A factor portfolio is a portfolio with a factor sensitivity of one to a particular factor and zero to all other factors. An arbitrage portfolio is a portfolio with factor sensitivities of zero to all factors, positive expected net cash flow, and an initial investment of zero.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.3, LOS 37.f<\/div><div class=\"qtext\"><p>A tracking portfolio is a portfolio with:<\/p><\/div>", "subj": "portfolio"}, {"n": 7, "q": "Arbitrage pricing models assume which risk is priced?", "opts": ["Both systematic and unsystematic.", "Unsystematic.", "Systematic."], "ans": "C", "expl": "Unsystematic risk can be diversified away. Thus, arbitrage pricing reflects only systematic risk. It is assumed that the portfolio manager will take steps to diversify and reduce risk.", "explhtml": "<p>Unsystematic risk can be diversified away. Thus, arbitrage pricing reflects only systematic risk. It is assumed that the portfolio manager will take steps to diversify and reduce risk.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.1, LOS 37.a<\/div><div class=\"qtext\"><p>Arbitrage pricing models assume which risk is priced?<\/p><\/div>", "subj": "portfolio"}, {"n": 8, "q": "A portfolio with a specific set of factor sensitivities designed to replicate the factor exposures of a benchmark index is called a:", "opts": ["factor portfolio.", "tracking portfolio.", "arbitrage portfolio."], "ans": "B", "expl": "A tracking portfolio is a portfolio with a specific set of factor sensitivities designed to replicate the factor exposures of a benchmark index. A factor portfolio is a portfolio with a factor sensitivity of one to a particular factor and zero to all other factors. An arbitrage portfolio is a portfolio with factor sensitivities of zero to all factors, positive expected net cash flow, and an initial investment of zero.", "explhtml": "<p>A tracking portfolio is a portfolio with a specific set of factor sensitivities designed to replicate the factor exposures of a benchmark index. A factor portfolio is a portfolio with a factor sensitivity of one to a particular factor and zero to all other factors. An arbitrage portfolio is a portfolio with factor sensitivities of zero to all factors, positive expected net cash flow, and an initial investment of zero.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.3, LOS 37.f<\/div><div class=\"qtext\"><p>A portfolio with a specific set of factor sensitivities designed to replicate the factor exposures of a benchmark index is called a:<\/p><\/div>", "subj": "portfolio"}, {"n": 9, "q": "Given a three-factor arbitrage pricing theory (APT) model, what is the expected return on the Premium Dividend Yield Fund? The factor risk premiums to factors 1, 2 and 3 are 8%, 12% and 5%, respectively. The fund has sensitivities to the factors 1, 2, and 3 of 2.0, 1.0 and 1.0, respectively. The risk-free rate is 3.0%.", "opts": ["33.0%.", "36.0%.", "50.0%."], "ans": "B", "expl": "The expected return on the Premium Dividend Yield Fund is 3% + (8.0%)(2.0) + (12.0%)(1.0) + (5.0%)(1.0) = 36.0%.", "explhtml": "<p>The expected return on the Premium Dividend Yield Fund is 3% + (8.0%)(2.0) + (12.0%)(1.0) + (5.0%)(1.0) = 36.0%.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.1, LOS 37.c<\/div><div class=\"qtext\"><p>Given a three-factor arbitrage pricing theory (APT) model, what is the expected return on the Premium Dividend Yield Fund?<\/p><p>The factor risk premiums to factors 1, 2 and 3 are 8%, 12% and 5%, respectively. The fund has sensitivities to the factors 1, 2, and 3 of 2.0, 1.0 and 1.0, respectively. The risk-free rate is 3.0%.<\/p><\/div>", "subj": "portfolio"}, {"n": 10, "q": "Rob Tanner, portfolio manager at Alpha Inc. meets his old college friend Del Torres for lunch. Torres excitedly tells Tanner about his latest work with tracking and factor portfolios. Torres says he has developed a tracking portfolio to aid in speculating on oil prices and is working on a factor portfolio with a specific set of factor sensitivities to the Russell 2000. Did Torres correctly describe tracking and factor portfolios? Tracking  Factor", "opts": ["Yes No", "No Yes", "No No"], "ans": "C", "expl": "Torres reversed the concepts and is thus incorrect on both counts. A factor portfolio is a portfolio with a factor sensitivity of 1 to a particular factor and zero to all other factors. It represents a pure bet on one factor, and can be used for speculation or hedging purposes. A tracking portfolio is a portfolio with a specific set of factor sensitivities. Tracking portfolios are often designed to replicate the factor exposures of a benchmark index like the Russell 2000.", "explhtml": "<p>Torres reversed the concepts and is thus incorrect on both counts. A factor portfolio is a portfolio with a factor sensitivity of 1 to a particular factor and zero to all other factors. It represents a pure bet on one factor, and can be used for speculation or hedging purposes. A tracking portfolio is a portfolio with a specific set of factor sensitivities. Tracking portfolios are often designed to replicate the factor exposures of a benchmark index like the Russell 2000.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.3, LOS 37.f<\/div><div class=\"qtext\"><p>Rob Tanner, portfolio manager at Alpha Inc. meets his old college friend Del Torres for lunch. Torres excitedly tells Tanner about his latest work with tracking and factor portfolios. Torres says he has developed a tracking portfolio to aid in speculating on oil prices and is working on a factor portfolio with a specific set of factor sensitivities to the Russell 2000.<\/p><p>Did Torres correctly describe tracking and factor portfolios? Tracking &nbsp; Factor<\/p><\/div>", "subj": "portfolio"}, {"n": 11, "q": "The macroeconomic factor models for the returns on Omni, Inc., (OM) and Garbo Manufacturing (GAR) are: ROM = 20.0% +1.0(FGDP) + 1.4(FQS) + εOM RGAR = 15.0% +0.5(FGDP) + 0.8 (FQS) + εGAR What is the expected return on a portfolio invested 60% in Omni and 40% in Garbo?", "opts": ["18.0%.", "20.96%.", "19.96%."], "ans": "A", "expl": "In the macroeconomic model, the intercept is the expected return. The expected return of the portfolio is the weighted average of the expected return of the 2 stocks: RP = [(0.6)(20.0%) + (0.4)(15.0%)] = 18%", "explhtml": "<p>In the macroeconomic model, the intercept is the expected return. The expected return of the portfolio is the weighted average of the expected return of the 2 stocks:<\/p><p>R<sub>P<\/sub> = [(0.6)(20.0%) + (0.4)(15.0%)] = 18%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.2, LOS 37.d<\/div><div class=\"qtext\"><p>The macroeconomic factor models for the returns on Omni, Inc., (OM) and Garbo Manufacturing (GAR) are:<\/p><p>R<sub>OM<\/sub> = 20.0% +1.0(F<sub>GDP<\/sub>) + 1.4(F<sub>QS<\/sub>) + ε<sub>OM<\/sub><\/p><p>R<sub>GAR<\/sub> = 15.0% +0.5(F<sub>GDP<\/sub>) + 0.8 (F<sub>QS<\/sub>) + ε<sub>GAR<\/sub><\/p><p>What is the expected return on a portfolio invested 60% in Omni and 40% in Garbo?<\/p><\/div>", "subj": "portfolio"}, {"n": 12, "q": "The Arbitrage Pricing Theory (APT) has all of the following characteristics EXCEPT it:", "opts": ["assumes that asset returns are described by a factor model.", "assumes that arbitrage opportunities are available to investors.", "is an equilibrium pricing model."], "ans": "B", "expl": "The APT assumes that no arbitrage opportunities are available to investors.", "explhtml": "<p>The APT assumes that no arbitrage opportunities are available to investors.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.1, LOS 37.a<\/div><div class=\"qtext\"><p>The Arbitrage Pricing Theory (APT) has all of the following characteristics EXCEPT it:<\/p><\/div>", "subj": "portfolio"}, {"n": 13, "q": "A portfolio manager uses a two-factor model to manage her portfolio. The two factors are confidence risk and time-horizon risk. If she wants to bet on an unexpected increase in the confidence risk factor (which has a positive risk premium), but hedge away her exposure to time-horizon risk (which has a negative risk premium), she should create a portfolio with a sensitivity of:", "opts": ["1.0 to the confidence risk factor and 0.0 to the time-horizon factor.", "1.0 to the confidence risk factor and -1.0 to the time-horizon factor.", "−1.0 to the confidence risk factor and 1.0 to the time-horizon factor."], "ans": "A", "expl": "She wants to create a confidence risk factor portfolio, which has a sensitivity of 1.0 to the confidence risk factor and 0.0 to the time horizon factor. Because the risk premium on the confidence risk factor is positive, an unexpected increase in this factor will increase the returns on her portfolio. The exposure to the time-horizon risk factor has been hedged away, because the sensitivity to that factor is zero.", "explhtml": "<p>She wants to create a confidence risk factor portfolio, which has a sensitivity of 1.0 to the confidence risk factor and 0.0 to the time horizon factor. Because the risk premium on the confidence risk factor is positive, an unexpected increase in this factor will increase the returns on her portfolio. The exposure to the time-horizon risk factor has been hedged away, because the sensitivity to that factor is zero.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.3, LOS 37.g<\/div><div class=\"qtext\"><p>A portfolio manager uses a two-factor model to manage her portfolio. The two factors are confidence risk and time-horizon risk. If she wants to bet on an unexpected increase in the confidence risk factor (which has a positive risk premium), but hedge away her exposure to time-horizon risk (which has a negative risk premium), she should create a portfolio with a sensitivity of:<\/p><\/div>", "subj": "portfolio"}, {"n": 14, "q": "A portfolio with a factor sensitivity of one to a particular factor in a multi-factor model and zero to all other factors is called a(n):", "opts": ["factor portfolio.", "tracking portfolio.", "arbitrage portfolio."], "ans": "A", "expl": "A factor portfolio is a portfolio with a factor sensitivity of one to a particular factor and zero to all other factors. An arbitrage portfolio is a portfolio with factor sensitivities of zero to all factors, positive expected net cash flow, and an initial investment of zero. A tracking portfolio is a portfolio with a specific set of factor sensitivities designed to replicate the factor exposures of a benchmark index.", "explhtml": "<p>A factor portfolio is a portfolio with a factor sensitivity of one to a particular factor and zero to all other factors. An arbitrage portfolio is a portfolio with factor sensitivities of zero to all factors, positive expected net cash flow, and an initial investment of zero. A tracking portfolio is a portfolio with a specific set of factor sensitivities designed to replicate the factor exposures of a benchmark index.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.3, LOS 37.f<\/div><div class=\"qtext\"><p>A portfolio with a factor sensitivity of one to a particular factor in a multi-factor model and zero to all other factors is called a(n):<\/p><\/div>", "subj": "portfolio"}, {"n": 15, "q": "Pierre's answer to Belair's first request regarding the equally weighted portfolio, is closest to:", "opts": ["1.75%.", "2.13%.", "2.63%."], "ans": "C", "expl": "The combined sensitivity of the GDP factor is 0.5 × 1.2 + 0.5 × 2.3 = 1.75. The change for 1.5% surprise is 1.5 × 1.75 = 2.625%.", "explhtml": "<p>The combined sensitivity of the GDP factor is 0.5 × 1.2 + 0.5 × 2.3 = 1.75.<\/p><p>The change for 1.5% surprise is 1.5 × 1.75 = 2.625%.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 15–18<\/summary><div class=\"vig-body\"><p>Marianne Belair, CFA, is a wealth manager for a well-known company in Paris, France. She has developed macroeconomic factor models on portfolios Alpha and Bravo.<\/p><p>Equations for the two portfolios:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r37/v001.webp\" style=\"max-width:min(100%,243px)\" alt=\"RAlpha = 0.08 - 0.7 FINFL + 1.2 FGDP\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r37/v002.webp\" style=\"max-width:min(100%,245px)\" alt=\"RBravo = 0.13 + 0.6 FinfL + 2.3 FGDP\"><p>Belair has asked her colleague Pierre Louboutin to calculate the return attributable to a 1.5% surprise in GDP for an equally weighted portfolio comprising Alpha and Bravo.<\/p><p>Meanwhile, Belair is looking at Merci, a beauty stock for which she has developed a macroeconomic factor model. The arbitrage-pricing model shows a required return of 10% and the company-specific surprise for the year was 2%. Exhibit 1 shows additional information on the model:<\/p><p>Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r37/v003.webp\" style=\"max-width:min(100%,667px)\" alt=\"Actual Value (%) Expected Value (%) Factor Sensitivity Variable 3.5% -0.3 2.5% Interest rates 6.5% 5.5% -0.7 Unemployment level Emily Grant, a senior manager at the firm, asks Louboutin to analyze the performance of three managers using the information in Exhibit 2. Exhibit 2: Decomposing Active Risk Active factor Active risk Active specific Active Active Active risk (% of risk (% of Total Portfolio factor specific squared Total Active risk (%) Active Risk) risk (%) risk (%) (%) Risk) 50 0.5 50 EM 1 0.5 1 25.2 10.8 30 EC 36 70 6 60 EV 40 36 21.6 14.4 6\"><p>Finally, Belair would like to capitalize on her expectation that real business activity will increase over the next year. As a separate concern, she has some existing positive exposure to inflation risk, which she would like to hedge. To achieve her goals she can use the portfolios in the Exhibit 3 which show the five relevant factors and respective factor sensitivities:<\/p><p>Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r37/v004.webp\" style=\"max-width:min(100%,323px)\" alt=\"Risk Factor E A D 0.10 1.00 0.00 0.70 0.00 Confidence 0.00 0.00 0.00 0.50 0.00 Time horizon 1.00 0.00 0.00 0.30 1.00 Inflation\"><p>Business cycle 0.90 1.00 1.00 0.00 0.00 Market timing 1.00 0.00 0.00 0.90 0.00<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r37/v005.webp\" style=\"max-width:min(100%,323px)\" alt=\"\"><\/div><\/details><div class=\"pp-topic\">Module 37.2, LOS 37.d<\/div><div class=\"qtext\"><p>Pierre&#x27;s answer to Belair&#x27;s first request regarding the equally weighted portfolio, is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 16, "q": "The actual return of Merci is closest to:", "opts": ["9%.", "10%.", "11%."], "ans": "C", "expl": "Key things to remember are to start with the APT required / expected return, then use surprises rather than actual values for each factor (i.e., actual minus expected), and finally to also add/subtract the company-specific surprise. actual return = 10 – 0.3 × (3.5 – 2.5) – 0.7 × (6.5 – 5.5) + 2 = 11%", "explhtml": "<p>Key things to remember are to start with the APT required / expected return, then use surprises rather than actual values for each factor (i.e., actual minus expected), and finally to also add/subtract the company-specific surprise.<\/p><p>actual return = 10 – 0.3 × (3.5 – 2.5) – 0.7 × (6.5 – 5.5) + 2 = 11%<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 15–18<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marianne Belair, CFA, is a wealth manager for a well-known company in Paris, France. She has developed macroeconomic factor models on portfolios Alpha and Bravo.<\/p><p>Equations for the two portfolios:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r37/v001.webp\" style=\"max-width:min(100%,243px)\" alt=\"RAlpha = 0.08 - 0.7 FINFL + 1.2 FGDP\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r37/v002.webp\ ly. A short position in portfolio E would eliminate the inflation risk.", "explhtml": "<p>This question is about factor portfolios (i.e., a portfolio that has a sensitivity of one to a particular factor and zero to all other factors). The only two factor portfolios in Exhibit 3 are C and E having exposure to the business cycle and inflation respectively. A short position in portfolio E would eliminate the inflation risk.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 15–18<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marianne Belair, CFA, is a wealth manager for a well-known company in Paris, France. She has developed macroeconomic factor models on portfolios Alpha and Bravo.<\/p><p>Equations for the two portfolios:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r37/v001.webp\" style=\"max-width:min(100%,243px)\" alt=\"RAlpha = 0.08 - 0.7 FINFL + 1.2 FGDP\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r37/v002.webp\" style=\"max-width:min(100%,245px)\" alt=\"RBravo = 0.13 + 0.6 FinfL + 2.3 FGDP\"><p>Belair has asked her colleague Pierre Louboutin to calculate the return attributable to a 1.5% surprise in GDP for an equally weighted portfolio comprising Alpha and Bravo.<\/p><p>Meanwhile, Belair is looking at Merci, a beauty stock for which she has developed a macroeconomic factor model. The arbitrage-pricing model shows a required return of 10% and the company-specific surprise for the year was 2%. Exhibit 1 shows additional information on the model:<\/p><p>Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r37/v003.webp\" style=\"max-width:min(100%,667px)\" alt=\"Actual Value (%) Expected Value (%) Factor Sensitivity Variable 3.5% -0.3 2.5% Interest rates 6.5% 5.5% -0.7 Unemployment level Emily Grant, a senior manager at the firm, asks Louboutin to analyze the performance of three managers using the information in Exhibit 2. Exhibit 2: Decomposing Active Risk Active factor Active risk Active specific Active Active Active risk (% of risk (% of Total Portfolio factor specific squared Total Active risk (%) Active Risk) risk (%) risk (%) (%) Risk) 50 0.5 50 EM 1 0.5 1 25.2 10.8 30 EC 36 70 6 60 EV 40 36 21.6 14.4 6\"><p>Finally, Belair would like to capitalize on her expectation that real business activity will increase over the next year. As a separate concern, she has some existing positive exposure to inflation risk, which she would like to hedge. To achieve her goals she can use the portfolios in the Exhibit 3 which show the five relevant factors and respective factor sensitivities:<\/p><p>Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r37/v004.webp\" style=\"max-width:min(100%,323px)\" alt=\"Risk Factor E A D 0.10 1.00 0.00 0.70 0.00 Confidence 0.00 0.00 0.00 0.50 0.00 Time horizon 1.00 0.00 0.00 0.30 1.00 Inflation\"><p>Business cycle 0.90 1.00 1.00 0.00 0.00 Market timing 1.00 0.00 0.00 0.90 0.00<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r37/v005.webp\" style=\"max-width:min(100%,323px)\" alt=\"\"><\/div><\/details><div class=\"pp-topic\">Module 37.3, LOS 37.f<\/div><div class=\"qtext\"><p>Which two portfolios from Exhibit 3 best achieve Belair&#x27;s goals in relation to business activity and inflation risk?<\/p><\/div>", "subj": "portfolio"}, {"n": 19, "q": "Assume you are considering forming a common stock portfolio consisting of 25% Stonebrook Corporation (Stone) and 75% Rockway Corporation (Rock). As expressed in the two-factor returns models presented below, both of these stocks' returns are affected by two common factors: surprises in interest rates and surprises in the unemployment rate. RStone = 0.11 + 1.0FInt + 1.2FUn + εStone RRock = 0.13 + 0.8FInt + 3.5FUn + εRock Assume that at the beginning of the year, interest rates were expected to be 5.1% and unemployment was expected to be 6.8%. Further, assume that at the end of the year, interest rates were actually 5.3%, the actual unemployment rate was 7.2%, and there were no company-specific surprises in returns. This information is summarized in Table 1 below: Table 1: Expected versus Actual Interest Rates and Unemployment Rates  Actual Expected Company-specific returns\nsurprises Interest Rate 0.053 0.051 0.0 Unemployment Rate 0.072 0.068 0.0 What is the portfolio's sensitivity to interest rate surprises?", "opts": ["0.85.", "0.25.", "0.95."], "ans": "A", "expl": "The portfolio composition is 25% Stonebrook and 75% Rockway. The interest rate sensitivities for Stonebrook and Rockway are 1.0 and 0.8, respectively. Thus, the portfolio's sensitivity to interest rate surprises is: (0.25)(1.0) + (0.75)(0.8) = 0.85.", "explhtml": "<p>The portfolio composition is 25% Stonebrook and 75% Rockway. The interest rate sensitivities for Stonebrook and Rockway are 1.0 and 0.8, respectively. Thus, the portfolio&#x27;s sensitivity to interest rate surprises is: (0.25)(1.0) + (0.75)(0.8) = 0.85.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.2, LOS 37.d<\/div><div class=\"qtext\"><p>Assume you are considering forming a common stock portfolio consisting of 25% Stonebrook Corporation (Stone) and 75% Rockway Corporation (Rock). As expressed in the two-factor returns models presented below, both of these stocks&#x27; returns are affected by two common factors: surprises in interest rates and surprises in the unemployment rate.<\/p><p>R<sub>Stone<\/sub> = 0.11 + 1.0F<sub>Int<\/sub> + 1.2F<sub>Un<\/sub> + ε<sub>Stone<\/sub><\/p><p>R<sub>Rock<\/sub> = 0.13 + 0.8F<sub>Int<\/sub> + 3.5F<sub>Un<\/sub> + ε<sub>Rock<\/sub><\/p><p>Assume that at the beginning of the year, interest rates were expected to be 5.1% and unemployment was expected to be 6.8%. Further, assume that at the end of the year, interest rates were actually 5.3%, the actual unemployment rate was 7.2%, and there were no company-specific surprises in returns. This information is summarized in Table 1 below:<\/p><p>Table 1: Expected versus Actual Interest Rates and Unemployment Rates<\/p><div class=\"tbl\"><table><tr><td><\/td><td>Actual<\/td><td>Expected<\/td><td>Company-specific returns<br>surprises<\/td><\/tr><tr><td>Interest Rate<\/td><td>0.053<\/td><td>0.051<\/td><td>0.0<\/td><\/tr><tr><td>Unemployment Rate<\/td><td>0.072<\/td><td>0.068<\/td><td>0.0<\/td><\/tr><\/table><\/div><p>What is the portfolio&#x27;s sensitivity to interest rate surprises?<\/p><\/div>", "subj": "portfolio"}, {"n": 20, "q": "Which of the following does NOT describe the arbitrage pricing theory (APT)?", "opts": ["It requires a weaker set of assumptions than the CAPM to derive.", "It is an equilibrium-pricing model like the CAPM.", "There are assumed to be at least five factors that explain asset returns."], "ans": "C", "expl": "APT is a k-factor model, in which the number of factors, k, is assumed to be a lot smaller than the number of assets; no specific number of factors is assumed.", "explhtml": "<p>APT is a k-factor model, in which the number of factors, k, is assumed to be a lot smaller than the number of assets; no specific number of factors is assumed.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.1, LOS 37.a<\/div><div class=\"qtext\"><p>Which of the following does NOT describe the arbitrage pricing theory (APT)?<\/p><\/div>", "subj": "portfolio"}, {"n": 21, "q": "Given a three-factor arbitrage pricing theory APT model, what is the expected return on the Freedom Fund? The factor risk premiums to factors 1, 2, and 3 are 10%, 7% and 6%, respectively. The Freedom Fund has sensitivities to the factors 1, 2, and 3 of 1.0, 2.0 and 0.0, respectively. The risk-free rate is 6.0%.", "opts": ["33.0%.", "30.0%.", "24.0%."], "ans": "B", "expl": "The expected return on the Freedom Fund is 6% + (10.0%)(1.0) + (7.0%)(2.0) + (6.0%)(0.0) = 30.0%.", "explhtml": "<p>The expected return on the Freedom Fund is 6% + (10.0%)(1.0) + (7.0%)(2.0) + (6.0%)(0.0) = 30.0%.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.1, LOS 37.c<\/div><div class=\"qtext\"><p>Given a three-factor arbitrage pricing theory APT model, what is the expected return on the Freedom Fund?<\/p><p>The factor risk premiums to factors 1, 2, and 3 are 10%, 7% and 6%, respectively. The Freedom Fund has sensitivities to the factors 1, 2, and 3 of 1.0, 2.0 and 0.0, respectively. The risk-free rate is 6.0%.<\/p><\/div>", "subj": "portfolio"}, {"n": 22, "q": "Assume you are considering forming a common stock portfolio consisting of 25% Stonebrook Corporation (Stone) and 75% Rockway Corporation (Rock). As expressed in the two-factor returns models presented below, both of these stocks' returns are affected by two common factors: surprises in interest rates and surprises in the unemployment rate. RStone = 0.11 + 1.0FInt + 1.2FUn + εStone RRock = 0.13 + 0.8FInt + 3.5FUn + εRock Assume that at the beginning of the year, interest rates were expected to be 5.1% and unemployment was expected to be 6.8%. Further, assume that at the end of the year, interest rates were actually 5.3%, the actual unemployment rate was 7.2%, and there were no company-specific surprises in returns. This information is summarized in Table 1 below: Table 1: Expected versus Actual Interest Rates and Unemployment Rates  Actual Expected Company-specific returns\nsurprises Interest Rate 0.053 0.051 0.0 Unemployment Rate 0.072 0.068 0.0 What is the expected return for Stonebrook in the absence of surprises?", "opts": ["13.2%.", "13.0%.", "11.0%."], "ans": "C", "expl": "The expected return for Stonebrook is simply the intercept return (aᵢ) of 0.11, or = 11.0%.", "explhtml": "<p>The expected return for Stonebrook is simply the intercept return (a<sub>i<\/sub>) of 0.11, or = 11.0%.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.2, LOS 37.d<\/div><div class=\"qtext\"><p>Assume you are considering forming a common stock portfolio consisting of 25% Stonebrook Corporation (Stone) and 75% Rockway Corporation (Rock). As expressed in the two-factor returns models presented below, both of these stocks&#x27; returns are affected by two common factors: surprises in interest rates and surprises in the unemployment rate.<\/p><p>R<sub>Stone<\/sub> = 0.11 + 1.0F<sub>Int<\/sub> + 1.2F<sub>Un<\/sub> + ε<sub>Stone<\/sub><\/p><p>R<sub>Rock<\/sub> = 0.13 + 0.8F<sub>Int<\/sub> + 3.5F<sub>Un<\/sub> + ε<sub>Rock<\/sub><\/p><p>Assume that at the beginning of the year, interest rates were expected to be 5.1% and unemployment was expected to be 6.8%. Further, assume that at the end of the year, interest rates were actually 5.3%, the actual unemployment rate was 7.2%, and there were no company-specific surprises in returns. This information is summarized in Table 1 below:<\/p><p>Table 1: Expected versus Actual Interest Rates and Unemployment Rates<\/p><div class=\"tbl\"><table><tr><td><\/td><td>Actual<\/td><td>Expected<\/td><td>Company-specific returns<br>surprises<\/td><\/tr><tr><td>Interest Rate<\/td><td>0.053<\/td><td>0.051<\/td><td>0.0<\/td><\/tr><tr><td>Unemployment Rate<\/td><td>0.072<\/td><td>0.068<\/td><td>0.0<\/td><\/tr><\/table><\/div><p>What is the expected return for Stonebrook in the absence of surprises?<\/p><\/div>", "subj": "portfolio"}, {"n": 23, "q": "Portfolios A and B have an expected return of 4.4% and 5.3% respectively. Assume that a one-factor APT model is appropriate and the factor sensitivities of portfolios A and B are 0.8 and 1.1 respectively. The risk-free rate and factor risk premium are closest to: Factor Risk Risk Free Rate Premium", "opts": ["2.00% 3.00%", "3.00% 2.00%", "2.50% 3.00%"], "ans": "A", "expl": "Expected return = risk free rate + factor sensitivity x risk premium For portfolio A: 0.044 = Rf + 0.8λ Hence Rf = 0.044 – 0.8λ Substituting Rf = (0.04 – 0.8λ) for portfolio B, 0.053 = (0.044 – 0.8λ) + 1.1λ λ = 0.03 or 3% and Rf = 2%.", "explhtml": "<p>Expected return = risk free rate + factor sensitivity x risk premium<\/p><p>For portfolio A: 0.044 = R<sub>f<\/sub> + 0.8λ Hence R<sub>f<\/sub> = 0.044 – 0.8λ<\/p><p>Substituting R<sub>f<\/sub> = (0.04 – 0.8λ) for portfolio B, 0.053 = (0.044 – 0.8λ) + 1.1λ<\/p><p>λ = 0.03 or 3% and R<sub>f<\/sub> = 2%.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.1, LOS 37.c<\/div><div class=\"qtext\"><p>Portfolios A and B have an expected return of 4.4% and 5.3% respectively. Assume that a one-factor APT model is appropriate and the factor sensitivities of portfolios A and B are 0.8 and 1.1 respectively. The risk-free rate and factor risk premium are closest to:<\/p><p>Factor Risk<\/p><p>Risk Free Rate<\/p><p>Premium<\/p><\/div>", "subj": "portfolio"}, {"n": 24, "q": "Michael Paul, a portfolio manager, is screening potential investments and suspects that an arbitrage opportunity may be available. The three portfolios that meet his screening criteria are detailed below: Portfolio Expected Return Beta X 12% 1.0 Y 16% 1.3 Z 8% 0.9 Which of the following portfolio combinations produces the highest return while maintaining a beta of 1.00? Portfolio X  Portfolio Y  Portfolio Z", "opts": ["25% 25% 50%", "100% 0% 0%", "50% 12% 38%"], "ans": "B", "expl": "Portfolio Weights   Expected Return Beta X Y Z   25% 50% 25% 13.00% 1.13 50% 12% 38% 10.96% 1.00 100% 0% 0% 12.00% 1.00 Portfolio weights of 25%, 50%, and 25% yield the highest return, but at a beta of 1.13. Investing 100% in Portfolio X yields the highest return for this risk level (i.e., beta = 1.00).", "explhtml": "<div class=\"tbl\"><table><tr><td colspan=3>Portfolio Weights<\/td><td>Expected Return<\/td><td>Beta<\/td><\/tr><tr><td>X<\/td><td>Y<\/td><td colspan=3>Z<\/td><\/tr><tr><td>25%<\/td><td>50%<\/td><td>25%<\/td><td>13.00%<\/td><td>1.13<\/td><\/tr><tr><td>50%<\/td><td>12%<\/td><td>38%<\/td><td>10.96%<\/td><td>1.00<\/td><\/tr><tr><td>100%<\/td><td>0%<\/td><td>0%<\/td><td>12.00%<\/td><td>1.00<\/td><\/tr><\/table><\/div><p>Portfolio weights of 25%, 50%, and 25% yield the highest return, but at a beta of 1.13. Investing 100% in Portfolio X yields the highest return for this risk level (i.e., beta = 1.00).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.1, LOS 37.b<\/div><div class=\"qtext\"><p>Michael Paul, a portfolio manager, is screening potential investments and suspects that an arbitrage opportunity may be available. The three portfolios that meet his screening criteria are detailed below:<\/p><div class=\"tbl\"><table><tr><td>Portfolio<\/td><td>Expected Return<\/td><td>Beta<\/td><\/tr><tr><td>X<\/td><td>12%<\/td><td>1.0<\/td><\/tr><tr><td>Y<\/td><td>16%<\/td><td>1.3<\/td><\/tr><tr><td>Z<\/td><td>8%<\/td><td>0.9<\/td><\/tr><\/table><\/div><p>Which of the following portfolio combinations produces the highest return while maintaining a beta of 1.00? Portfolio X &nbsp; Portfolio Y &nbsp; Portfolio Z<\/p><\/div>", "subj": "portfolio"}, {"n": 25, "q": "Assume you are considering forming a common stock portfolio consisting of 25% Stonebrook Corporation (Stone) and 75% Rockway Corporation (Rock). As expressed in the two-factor returns models presented below, both of these stocks' returns are affected by two common factors: surprises in interest rates and surprises in the unemployment rate. RStone = 0.11 + 1.0FInt + 1.2FUn + εStone RRock = 0.13 + 0.8FInt + 3.5FUn + εRock Assume that at the beginning of the year, interest rates were expected to be 5.1% and unemployment was expected to be 6.8%. Further, assume that at the end of the year, interest rates were actually 5.3%, the actual unemployment rate was 7.2%, and there were no company-specific surprises in returns. This information is summarized in Table 1 below: Table 1: Expected versus Actual Interest Rates and Unemployment Rates  Actual Expected Company-specific returns\nsurprises Interest Rate 0.053 0.051 0.0 Unemployment Rate 0.072 0.068 0.0 What is the predicted return for Stonebrook if the return unexplained by the model was -1%?", "opts": ["12.00%.", "10.68%.", "1.40%."], "ans": "B", "expl": "The actual return uses the unemployment and interest rate surprises as follows: The returns for a stock that are correlated with surprises in interest rates and unemployment rates can be expressed using a two-factor model as: Rᵢ = aᵢ+ bi,1FInt + bi,2FUn + εᵢ where: Rᵢ = the return on stock i ai = the expected return on stock i bi,1 = the factor sensitivity of stock i to unexpected changes in interest rates FInt = unexpected changes in interest rates (the interest factor) = .053 − .051 = .002 bi,2 = the factor sensitivity of stock i to unexpected changes in the unemployment rate FUn = unexpected changes in the unemployment rate (the unemployment rate factor) = .072 − .068 = .004 εᵢ = a mean-zero error term that represents the part of asset i's return not explained by the two factors. Thus the actual return is: 0.11 + (1.0)(0.002) + (1.2)(0.004) – 0.01 = 0.1068 or 10.68%", "explhtml": "<p>The actual return uses the unemployment and interest rate surprises as follows:<\/p><p>The returns for a stock that are correlated with surprises in interest rates and unemployment rates can be expressed using a two-factor model as:<\/p><p>R<sub>i<\/sub> = a<sub>i<\/sub>+ b<sub>i,1<\/sub>F<sub>Int<\/sub> + b<sub>i,2<\/sub>F<sub>Un<\/sub> + ε<sub>i<\/sub><\/p><p>where:<\/p><p>R<sub>i<\/sub> = the return on stock i<\/p><p>ai = the expected return on stock i<\/p><p>b<sub>i,1<\/sub> = the factor sensitivity of stock i to unexpected changes in interest rates<\/p><p>F<sub>Int<\/sub> = unexpected changes in interest rates (the interest factor) = .053 − .051 = .002<\/p><p>b<sub>i,2<\/sub> = the factor sensitivity of stock i to unexpected changes in the unemployment rate<\/p><p>F<sub>Un<\/sub> = unexpected changes in the unemployment rate (the unemployment rate factor) = .072 − .068 = .004<\/p><p>ε<sub>i<\/sub> = a mean-zero error term that represents the part of asset i&#x27;s return not explained by the two factors.<\/p><p>Thus the actual return is: 0.11 + (1.0)(0.002) + (1.2)(0.004) – 0.01 = 0.1068 or 10.68%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.2, LOS 37.d<\/div><div class=\"qtext\"><p>Assume you are considering forming a common stock portfolio consisting of 25% Stonebrook Corporation (Stone) and 75% Rockway Corporation (Rock). As expressed in the two-factor returns models presented below, both of these stocks&#x27; returns are affected by two common factors: surprises in interest rates and surprises in the unemployment rate.<\/p><p>R<sub>Stone<\/sub> = 0.11 + 1.0F<sub>Int<\/sub> + 1.2F<sub>Un<\/sub> + ε<sub>Stone<\/sub><\/p><p>R<sub>Rock<\/sub> = 0.13 + 0.8F<sub>Int<\/sub> + 3.5F<sub>Un<\/sub> + ε<sub>Rock<\/sub><\/p><p>Assume that at the beginning of the year, interest rates were expected to be 5.1% and unemployment was expected to be 6.8%. Further, assume that at the end of the year, interest rates were actually 5.3%, the actual unemployment rate was 7.2%, and there were no company-specific surprises in returns. This information is summarized in Table 1 below:<\/p><p>Table 1: Expected versus Actual Interest Rates and Unemployment Rates<\/p><div class=\"tbl\"><table><tr><td><\/td><td>Actual<\/td><td>Expected<\/td><td>Company-specific returns<br>surprises<\/td><\/tr><tr><td>Interest Rate<\/td><td>0.053<\/td><td>0.051<\/td><td>0.0<\/td><\/tr><tr><td>Unemployment Rate<\/td><td>0.072<\/td><td>0.068<\/td><td>0.0<\/td><\/tr><\/table><\/div><p>What is the predicted return for Stonebrook if the return unexplained by the model was -1%?<\/p><\/div>", "subj": "portfolio"}, {"n": 26, "q": "Identify the most accurate statement regarding multifactor models from among the following.", "opts": ["Macroeconomic factor models include explanatory variables such as the business cycle, interest rates, and inflation, and fundamental factor models include explanatory variables such as firm size and the price-to-earnings ratio.", "Macroeconomic factor models include explanatory variables such as real GDP growth and the price-to-earnings ratio and fundamental factor models include explanatory variables such as firm size and unexpected inflation.", "Macroeconomic factor models include explanatory variables such as firm size and the price-to-earnings ratio and fundamental factor models include explanatory variables such as real GDP growth and unexpected inflation."], "ans": "A", "expl": "Macroeconomic factor models include multiple risk factors such as the business cycle, interest rates, and inflation. Fundamental factor models include specific characteristics of the securities themselves such as firm size and the price-to-earnings ratio.", "explhtml": "<p>Macroeconomic factor models include multiple risk factors such as the business cycle, interest rates, and inflation. Fundamental factor models include specific characteristics of the securities themselves such as firm size and the price-to-earnings ratio.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.2, LOS 37.d<\/div><div class=\"qtext\"><p>Identify the most accurate statement regarding multifactor models from among the following.<\/p><\/div>", "subj": "portfolio"}, {"n": 27, "q": "Which of the following is an equilibrium-pricing model?", "opts": ["Fundamental factor model.", "Macroeconomic factor model.", "The arbitrage pricing theory (APT)."], "ans": "C", "expl": "The APT is an equilibrium-pricing model; multi-factor models are \"ad-hoc,\" meaning the factors in these models are not derived directly from an equilibrium theory. Rather they are identified empirically by looking for macroeconomic variables that best fit the data.", "explhtml": "<p>The APT is an equilibrium-pricing model; multi-factor models are &quot;ad-hoc,&quot; meaning the factors in these models are not derived directly from an equilibrium theory. Rather they are identified empirically by looking for macroeconomic variables that best fit the data.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.1, LOS 37.a<\/div><div class=\"qtext\"><p>Which of the following is an equilibrium-pricing model?<\/p><\/div>", "subj": "portfolio"}, {"n": 28, "q": "Diversification can reduce:", "opts": ["macroeconomic risks.", "unsystematic risk.", "systematic risk."], "ans": "B", "expl": "Systematic risk reflects factors that have a general effect on the security markets as a whole, and cannot be diversified away. Macroeconomic risk comes in many forms, and it is usually considered systematic risk. Unsystematic risk can be reduced through diversification.", "explhtml": "<p>Systematic risk reflects factors that have a general effect on the security markets as a whole, and cannot be diversified away. Macroeconomic risk comes in many forms, and it is usually considered systematic risk. Unsystematic risk can be reduced through diversification.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.1, LOS 37.a<\/div><div class=\"qtext\"><p>Diversification can reduce:<\/p><\/div>", "subj": "portfolio"}, {"n": 29, "q": "In the context of multi-factor models, investors with lower-than-average exposure to recession risk (e.g. those without labor income) can earn a risk premium for holding dimensions of risk unrelated to market movements by creating equity portfolios with:", "opts": ["less-than-average exposure to the recession risk factor.", "greater-than-average market risk exposure.", "greater-than-average exposure to the recession risk factor."], "ans": "C", "expl": "Multifactor models allow us to capture other dimensions of risk besides overall market risk. Investors with unique circumstances different than the average investor may want to hold portfolios tilted away from the market portfolio in order to hedge or speculate on factors like recession risk, interest rate risk or inflation risk. An investor with lower-than-average exposure to recession risk can earn a premium by creating greater-than-average exposure to the recession risk factor. In effect, he earns a risk premium determined by the average investor by taking on a risk he doesn't care about as much as the average investor does.", "explhtml": "<p>Multifactor models allow us to capture other dimensions of risk besides overall market risk. Investors with unique circumstances different than the average investor may want to hold portfolios tilted away from the market portfolio in order to hedge or speculate on factors like recession risk, interest rate risk or inflation risk. An investor with lower-than-average exposure to recession risk can earn a premium by creating greater-than-average exposure to the recession risk factor. In effect, he earns a risk premium determined by the average investor by taking on a risk he doesn&#x27;t care about as much as the average investor does.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.3, LOS 37.g<\/div><div class=\"qtext\"><p>In the context of multi-factor models, investors with lower-than-average exposure to recession risk (e.g. those without labor income) can earn a risk premium for holding dimensions of risk unrelated to market movements by creating equity portfolios with:<\/p><\/div>", "subj": "portfolio"}, {"n": 30, "q": "Janice Barefoot, CFA, has managed a portfolio where she used the Dow Jones Industrial Average (DJIA) as a benchmark. In the past two years the average monthly return on her portfolio has been higher than that of the DJIA. To get a measure of active return per unit of active risk Barefoot should compute the:", "opts": ["information ratio, which is the average excess portfolio return over the benchmark divided by the standard deviation of the differences between the portfolio and benchmark returns.", "Sharpe ratio, which is the standard deviation of the differences between the portfolio and benchmark returns divided into the average of those differences.", "information ratio, which is the standard deviation of the differences between the portfolio and benchmark returns divided by the average of those differences."], "ans": "A", "expl": "The information ratio is the measure of active return per unit of active risk. If we let X = (monthly portfolio return − the benchmark return), then the information ratio = (the average of X / the standard deviation of X). It is similar to the Sharpe ratio, which defines the random variable Y as Y = (monthly portfolio return − the risk-free rate). The Sharpe ratio = (the average of Y / the standard deviation of the portfolio return) = the standard deviation of Y if the risk-free rate is constant.", "explhtml": "<p>The information ratio is the measure of active return per unit of active risk. If we let X = (monthly portfolio return − the benchmark return), then the information ratio = (the average of X / the standard deviation of X). It is similar to the Sharpe ratio, which defines the random variable Y as Y = (monthly portfolio return − the risk-free rate). The Sharpe ratio = (the average of Y / the standard deviation of the portfolio return) = the standard deviation of Y if the risk-free rate is constant.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.3, LOS 37.e<\/div><div class=\"qtext\"><p>Janice Barefoot, CFA, has managed a portfolio where she used the Dow Jones Industrial Average (DJIA) as a benchmark. In the past two years the average monthly return on her portfolio has been higher than that of the DJIA. To get a measure of active return per unit of active risk Barefoot should compute the:<\/p><\/div>", "subj": "portfolio"}, {"n": 31, "q": "Summer Vista decides to develop a fundamental factor model. She establishes a proxy for the market portfolio, and then considers the importance of various factors in determining stock returns. She decides to use the following factors in her model: Changes in payout ratios. Credit rating changes. Companies' position in the business cycle. Management tenure and qualifications. Which of the following factors is least appropriate for Vista's factor model?", "opts": ["Changes in payout ratios.", "Management tenure and qualifications.", "Companies’ position in the business cycle."], "ans": "C", "expl": "Fundamental factors are factors measured by characteristics of the companies themselves, like price-to-earnings (P/E) ratios or growth rates. Macroeconomic factors are economic influences on security returns. A company's position in the business cycle is dependent on the cycle itself, and cannot be accurately measured by looking at a company's fundamentals – business cycle is a macroeconomic factor. Payout ratios and management tenure are pieces of company-specific data suitable for use in a fundamental factor model.", "explhtml": "<p>Fundamental factors are factors measured by characteristics of the companies themselves, like price-to-earnings (P/E) ratios or growth rates. Macroeconomic factors are economic influences on security returns. A company&#x27;s position in the business cycle is dependent on the cycle itself, and cannot be accurately measured by looking at a company&#x27;s fundamentals – business cycle is a macroeconomic factor. Payout ratios and management tenure are pieces of company-specific data suitable for use in a fundamental factor model.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.2, LOS 37.d<\/div><div class=\"qtext\"><p>Summer Vista decides to develop a fundamental factor model. She establishes a proxy for the market portfolio, and then considers the importance of various factors in determining stock returns. She decides to use the following factors in her model:<\/p><p>Changes in payout ratios. Credit rating changes. Companies&#x27; position in the business cycle. Management tenure and qualifications.<\/p><p>Which of the following factors is least appropriate for Vista&#x27;s factor model?<\/p><\/div>", "subj": "portfolio"}, {"n": 32, "q": "Marcie Deiner is an investment manager with G&G Investment Corporation. She works with a variety of clients who differ in terms of experience, risk aversion and wealth. Deiner recently attended a seminar on multifactor analysis. Among other things, the seminar taught how the assumptions concerning the Arbitrage Pricing Theory (APT) model are different from those of the Capital Asset Pricing Model (CAPM). One of the examples used in the seminar is below. E(Rᵢ) = Rf + f1 Bi,1 + f₂ Bi,2 + f₃ Bi,3. where: f₁ =3.0%, f₂ = −40.0%, and f₃ =50.0%. Beta estimates for Growth and Value funds for a three factor model     Factor 1 Factor 2 Factor 3 Betas for Growth 0.5 0.7 1.2 Betas for Value 0.2 1.8 0.6 For the model used as an example in the seminar, if the T-bill rate is 3.5%, what are the expected returns for the Growth and Value Funds? E(RGrowth)  E(RValue)", "opts": ["33.5% −41.4%", "3.1% −3.16%", "37.0% −37.9%"], "ans": "C", "expl": "E(RGrowth)= 0.035 + 0.03(0.5) − 0.4(0.7) + 0.5(1.2) = 0.035 + 0.015 − 0.28 + 0.6 = 0.37 or 37.0% E(RValue)= 0.035 + 0.03(0.2) − 0.4(1.8) + 0.5(0.6) = 0.035 + 0.006 − 0.72 + 0.30 = −0.379 or −37.9%", "explhtml": "<p>E(R<sub>Growth<\/sub>)= 0.035 + 0.03(0.5) − 0.4(0.7) + 0.5(1.2) = 0.035 + 0.015 − 0.28 + 0.6 = 0.37 or 37.0%<\/p><p>E(R<sub>Value<\/sub>)= 0.035 + 0.03(0.2) − 0.4(1.8) + 0.5(0.6) = 0.035 + 0.006 − 0.72 + 0.30 = −0.379 or −37.9%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.1, LOS 37.a<\/div><div class=\"qtext\"><p>Marcie Deiner is an investment manager with G&amp;G Investment Corporation. She works with a variety of clients who differ in terms of experience, risk aversion and wealth. Deiner recently attended a seminar on multifactor analysis. Among other things, the seminar taught how the assumptions concerning the Arbitrage Pricing Theory (APT) model are different from those of the Capital Asset Pricing Model (CAPM). One of the examples used in the seminar is below.<\/p><p>E(R<sub>i<\/sub>) = R<sub>f<\/sub> + f1 B<sub>i,1<\/sub> + f<sub>2<\/sub> B<sub>i,2<\/sub> + f<sub>3<\/sub> B<sub>i,3<\/sub>. where: f<sub>1<\/sub> =3.0%, f<sub>2<\/sub> = −40.0%, and f<sub>3<\/sub> =50.0%.<\/p><div class=\"tbl\"><table><tr><td colspan=4>Beta estimates for Growth and Value funds for a three factor model<\/td><\/tr><tr><td><\/td><td>Factor 1<\/td><td>Factor 2<\/td><td>Factor 3<\/td><\/tr><tr><td>Betas for Growth<\/td><td>0.5<\/td><td>0.7<\/td><td>1.2<\/td><\/tr><tr><td>Betas for Value<\/td><td>0.2<\/td><td>1.8<\/td><td>0.6<\/td><\/tr><\/table><\/div><p>For the model used as an example in the seminar, if the T-bill rate is 3.5%, what are the expected returns for the Growth and Value Funds? E(RGrowth) &nbsp; E(RValue)<\/p><\/div>", "subj": "portfolio"}, {"n": 33, "q": "The Real Value Fund is designed to have zero exposure to inflation. However its current inflation factor sensitivity is 0.30. To correct for this, the portfolio manager should take a:", "opts": ["30% long position in the inflation factor portfolio.", "30% short position in the inflation factor portfolio.", "30% short position in the inflation tracking portfolio."], "ans": "B", "expl": "To hedge inflation, the fund should take a 30% short position in the inflation factor portfolio. This short position will fully offset the fund's positive exposure to inflation. Tracking portfolios are typically used for active asset selection and have multiple factor exposures which would prevent them from adequately hedging the inflation exposure of the fund.", "explhtml": "<p>To hedge inflation, the fund should take a 30% short position in the inflation factor portfolio. This short position will fully offset the fund&#x27;s positive exposure to inflation. Tracking portfolios are typically used for active asset selection and have multiple factor exposures which would prevent them from adequately hedging the inflation exposure of the fund.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.3, LOS 37.f<\/div><div class=\"qtext\"><p>The Real Value Fund is designed to have zero exposure to inflation. However its current inflation factor sensitivity is 0.30. To correct for this, the portfolio manager should take a:<\/p><\/div>", "subj": "portfolio"}, {"n": 34, "q": "Which of the following is NOT an assumption necessary to derive the arbitrage pricing theory (APT)?", "opts": ["Asset returns are described by a k-factor model.", "The priced factors risks can be hedged without taking short positions in any portfolios.", "A large number of assets are available to investors."], "ans": "B", "expl": "APT does not prohibit short positions.", "explhtml": "<p>APT does not prohibit short positions.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.1, LOS 37.a<\/div><div class=\"qtext\"><p>Which of the following is NOT an assumption necessary to derive the arbitrage pricing theory (APT)?<\/p><\/div>", "subj": "portfolio"}, {"n": 35, "q": "Janice Barefoot, CFA, has been managing a portfolio for a client who has asked Barefoot to use the Dow Jones Industrial Average (DJIA) as a benchmark. In her second year, Barefoot used 29 of the 30 DJIA stocks. She selected a non-DJIA stock in the same industry as the omitted DJIA stock to replace that stock. Compared to the DJIA, Barefoot placed a lower weight on the communication stocks and a higher weight on the other stocks still in the portfolio. Over that year, the non-DJIA stock in the portfolio had a positive and higher return than the omitted DJIA stock. The communication stocks had a negative return while all of the other stocks had a positive return. The portfolio managed by Barefoot outperformed the DJIA. Based on this we can say that the return from factor tilts and asset selection were:", "opts": ["both positive.", "positive and negative respectively.", "negative and positive respectively."], "ans": "A", "expl": "Since the communications stocks had a negative return while all the other stocks had a positive return, Barefoot's underweighting of those stocks produced a positive tilt return. Since the asset chosen to replace the DJIA stock outperformed the omitted stock, the asset selection return was positive.", "explhtml": "<p>Since the communications stocks had a negative return while all the other stocks had a positive return, Barefoot&#x27;s underweighting of those stocks produced a positive tilt return. Since the asset chosen to replace the DJIA stock outperformed the omitted stock, the asset selection return was positive.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.3, LOS 37.f<\/div><div class=\"qtext\"><p>Janice Barefoot, CFA, has been managing a portfolio for a client who has asked Barefoot to use the Dow Jones Industrial Average (DJIA) as a benchmark. In her second year, Barefoot used 29 of the 30 DJIA stocks. She selected a non-DJIA stock in the same industry as the omitted DJIA stock to replace that stock. Compared to the DJIA, Barefoot placed a lower weight on the communication stocks and a higher weight on the other stocks still in the portfolio. Over that year, the non-DJIA stock in the portfolio had a positive and higher return than the omitted DJIA stock. The communication stocks had a negative return while all of the other stocks had a positive return. The portfolio managed by Barefoot outperformed the DJIA. Based on this we can say that the return from factor tilts and asset selection were:<\/p><\/div>", "subj": "portfolio"}, {"n": 36, "q": "Assume you are attempting to estimate the equilibrium expected return for a portfolio using a two-factor arbitrage pricing theory (APT) model. Assume that you have estimated the risk premium for factor 1 to be 0.02, and the risk premium for factor 2 to be 0.03. The sensitivity of the portfolio to factor 1 is –1.2 and the portfolios sensitivity to factor 2 is 0.80. Given a risk free rate equal to 0.03, what is the expected return for the asset?", "opts": ["2.4%.", "5.0%.", "3.0%."], "ans": "C", "expl": "The general form of the two-factor APT model is: E(RPort) = RF = λ₁β₁ + λ₂β₂, where the λ's are the factor risk premiums and the β's are the portfolio's factor sensitivities. Substituting the appropriate values, we have: RPort = 0.03 + 0.02(−1.2) + 0.03(0.80) = 3.0%", "explhtml": "<p>The general form of the two-factor APT model is: E(R<sub>Port<\/sub>) = RF = λ<sub>1<\/sub>β<sub>1<\/sub> + λ<sub>2<\/sub>β<sub>2<\/sub>, where the λ&#x27;s are the factor risk premiums and the β&#x27;s are the portfolio&#x27;s factor sensitivities. Substituting the appropriate values, we have:<\/p><p>R<sub>Port<\/sub> = 0.03 + 0.02(−1.2) + 0.03(0.80) = 3.0%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.1, LOS 37.c<\/div><div class=\"qtext\"><p>Assume you are attempting to estimate the equilibrium expected return for a portfolio using a two-factor arbitrage pricing theory (APT) model. Assume that you have estimated the risk premium for factor 1 to be 0.02, and the risk premium for factor 2 to be 0.03. The sensitivity of the portfolio to factor 1 is –1.2 and the portfolios sensitivity to factor 2 is 0.80. Given a risk free rate equal to 0.03, what is the expected return for the asset?<\/p><\/div>", "subj": "portfolio"}, {"n": 37, "q": "One of the assumptions of the arbitrage pricing theory (APT) is that there are no arbitrage opportunities available. An arbitrage opportunity is:", "opts": ["a portfolio with factor exposures that sum to one.", "a factor portfolio with a positive expected risk premium.", "an investment that has an expected positive net cash flow but requires no initial investment."], "ans": "C", "expl": "One of the three assumptions of the APT is that there are no arbitrage opportunities available to investors among these well-diversified portfolios. An arbitrage opportunity is an investment that has an expected positive net cash flow but requires no initial investment. All factor portfolios will have positive risk premiums equal to the factor price for that factor. An arbitrage opportunity does not necessarily require a return equal to the risk-free rate, and the factor exposures for an arbitrage portfolio are all equal to zero.", "explhtml": "<p>One of the three assumptions of the APT is that there are no arbitrage opportunities available to investors among these well-diversified portfolios. An arbitrage opportunity is an investment that has an expected positive net cash flow but requires no initial investment.<\/p><p>All factor portfolios will have positive risk premiums equal to the factor price for that factor. An arbitrage opportunity does not necessarily require a return equal to the risk-free rate, and the factor exposures for an arbitrage portfolio are all equal to zero.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 37.1, LOS 37.a<\/div><div class=\"qtext\"><p>One of the assumptions of the arbitrage pricing theory (APT) is that there are no arbitrage opportunities available. An arbitrage opportunity is:<\/p><\/div>", "subj": "portfolio"}];

      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
