<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .stem .qtable{width:100%;border-collapse:collapse;margin:12px 0 2px;font-size:14.5px;
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stem .qtable th,.stem .qtable td{border:1px solid var(--line);padding:8px 11px;
    text-align:left;vertical-align:top}
  .stem .qtable thead th{background:var(--panel2);font-weight:700;color:var(--accent2)}
  .stem .qtable tbody td:first-child{font-weight:600}
  .stem .qtable td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
  .stem .qtable tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
  @media (max-width:520px){.stem .qtable{font-size:13px}.stem .qtable th,.stem .qtable td{padding:6px 8px}}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n":1,"q":"An investor purchased 725 shares of stock at $40 per share and posted initial margin of 60%.\nHe subsequently sold the shares at $50 per share. Based only on this information, the\ninvestor's holding period return is closest to:","opts":["20%.","25%.","40%."],"ans":"C","expl":"(50 – 40) / (40 × 0,6) = 41,67%.\n(Mô-đun 39.2, LOS 39.f)"},{"n":2,"q":"Becky Kirk contacted her broker and placed an order to purchase 1,000 shares of Bricko\nCorp. stock at a price of $60 per share. Kirk wishes to buy on margin. Assuming the margin\nrequirement is 40%, how much money does Kirk have to pay up front to make the purchase?","opts":["$60,000.","$36,000.","$24,000."],"ans":"C","expl":"Yêu cầu ký quỹ thể hiện số tiền mà nhà đầu tư phải bỏ ra khi mua\n. Vì vậy, Kirk phải đặt cọc 24.000 đô la (60.000 đô la × 0,40 = 24.000 đô la) và có thể vay\nsố dư.\n(Mô-đun 39.2, LOS 39.f)"},{"n":3,"q":"Financial intermediaries that issue securities which represent interests in a pool of similar\nfinancial assets are best characterized as:","opts":["arbitrageurs.","block brokers.","securitizers."],"ans":"C","expl":"Các nhà chứng khoán hóa là các trung gian tài chính tập hợp các nhóm lớn các nguồn tài chính tương tự\ntài sản, chẳng hạn như thế chấp hoặc cho vay, và phát hành chứng khoán đại diện cho lợi ích trong\nbể bơi. Các nhà môi giới khối hỗ trợ khách hàng của họ với các giao dịch chứng khoán lớn. Nhà kinh doanh chênh lệch giá\nđồng thời mua và bán cùng một tài sản ở các thị trường khác nhau để tận dụng lợi thế\ngiá khác nhau cho cùng một tài sản.\n(Học ​​phần 39.1, LOS 39.d)"},{"n":4,"q":"A market that directs capital to its most productive use is best described as:","opts":["allocationally efficient.","operationally efficient.","informationally efficient."],"ans":"A","expl":"Thị trường được cho là có hiệu quả phân bổ khi vốn được hướng vào những mục đích sử dụng\nhiệu quả nhất. Thị trường hoạt động hiệu quả là thị trường có chi phí giao dịch thấp.\nThị trường hiệu quả về mặt thông tin là thị trường trong đó giá chứng khoán phản ánh tất cả thông tin\nliên quan đến giá trị cơ bản một cách kịp thời.\n(Module 39.3, LOS 39.k)"},{"n":5,"q":"A primary market transaction involves:","opts":["the sale of new securities to investors.","investment-grade bonds or preferred stocks.","direct trading of securities between institutional investors."],"ans":"A","expl":"Thị trường sơ cấp là thị trường cho các đợt phát hành chứng khoán mới.\n(Mô-đun 39.3, LOS 39.i)"},{"n":6,"q":"Byron Campbell purchased 300 shares of Crescent, Inc., stock at a price of $80 per share.\nThe purchase was made on margin with an initial margin requirement of 50%. Assuming the\nmaintenance margin is 25%, the stock price of Crescent, Inc. has to fall below what level for\nCampbell to receive a margin call?","opts":["$20.00.","$40.00.","$53.33."],"ans":"C","expl":"Giá kích hoạt (mua ký quỹ) = P (1 – ký quỹ ban đầu) / (1 – ký quỹ duy trì).\no\n$80(1 - .5) / (1 - .25) = 40 / .75 = $53,33.\nP = $53,33\nNếu Crescent, Inc. giảm xuống dưới $53,33 thì Campbell sẽ nhận được yêu cầu ký quỹ.\n(Module 39.2, LOS 39.f)"},{"n":7,"q":"Mark Ritchie purchased, on margin, 200 shares of TMX Corp. stock at a price of $35 per\nshare. The margin requirement was 50%. The stock price has increased to $42 per share.\nWhat is Ritchie's return on investment before commissions and interest if he decides to sell\nhis TMX holdings now?","opts":["40%.","20%.","10%."],"ans":"A","expl":"200 cổ phiếu × $35 = $7000 Giá trị thị trường ban đầu\n$7000 × .50 = $3500 thanh toán bằng tiền mặt và $3500 đã vay.\nGiá trị thị trường mới của cổ phiếu sau khi tăng giá là (200 × $42) = $8400. Nếu Ritchie\nbán cổ phần của mình thì anh ta sẽ còn lại $4900 ($8400 – $3500) sau khi khoản vay được trả. Vì vậy\nLợi nhuận của Ritchie trên khoản đầu tư $3500 ban đầu của anh ấy là:\n$4900/3500 – 1 = 1,4 – 1,0 = 0,40 = 40%.\n(Mô-đun 39.2, LOS 39.f)"},{"n":8,"q":"Compared to a market order to sell, a limit order to sell will specify:","opts":["a maximum price above the current market price.","a price that can be higher or lower than the current market price.","a minimum price equal to or less than the current market price."],"ans":"B","expl":"Giới hạn giá cho lệnh mua hoặc bán có thể cao hơn, bằng hoặc thấp hơn giá thị trường hiện tại.\n(Mô-đun 39.3, LOS 39.h)"},{"n":9,"q":"Markets for financial assets with maturities of one year or less are best characterized as:","opts":["primary markets.","money markets.","forward markets."],"ans":"B","expl":"\"Thị trường tiền tệ\" thường đề cập đến thị trường chứng khoán nợ đáo hạn trong một năm hoặc ít hơn\n. Thị trường kỳ hạn đề cập đến các hợp đồng trao đổi tài sản trong tương lai ở mức giá\nđược xác lập ngày hôm nay. Thị trường sơ cấp là thị trường dành cho chứng khoán mới phát hành.\n(Module 39.1, LOS 39.b)"},{"n":10,"q":"A buy limit order is said to be \"inside the market\" when:","opts":["the limit is between the best bid and the best ask.","the order can be executed.","the order is entered in the limit book."],"ans":"A","expl":"Lệnh giới hạn có giá giới hạn nằm trong khoảng từ giá chào mua tốt nhất đến câu hỏi hay nhất được cho là \"bên trong\nthị trường\" hoặc \"tạo ra một thị trường mới\". Lệnh giới hạn chưa được thực thi là a\n\"lệnh giới hạn thường trực\".\n(Mô-đun 39.3, LOS 39.h)"},{"n":11,"q":"Which of the following statements regarding primary and secondary markets is least\naccurate?","opts":["New issues of government securities can be sold on the primary market.","Prevailing market prices are determined by primary market transactions and are used in pricing new issues.","Secondary market transactions occur between two investors and do not involve the firm that originally issued the security."],"ans":"B","expl":"Giá thị trường hiện tại được xác định bởi các giao dịch diễn ra trên\nthị trường thứ cấp. Thông tin này được dùng để xác định giá của các đợt phát hành mới được bán trên\nthị trường sơ cấp.\n(Mô-đun 39.3, LOS 39.i)"},{"n":12,"q":"Shares in a publicly traded company that owns gold mines and mining operations are\nconsidered:","opts":["financial assets.","physical assets.","real assets."],"ans":"A","expl":"Tài sản tài chính, chẳng hạn như cổ phiếu trong một công ty, là các khiếu nại đối với tài sản vật chất hoặc thực\n.\n(Mô-đun 39.1, LOS 39.c)"},{"n":13,"q":"The main functions of the financial system least likely include:","opts":["allocating financial resources to their most productive uses.","bringing together savers and borrowers.","preventing investors from generating abnormal profits by trading on information."],"ans":"C","expl":"Một trong những mục đích của hệ thống tài chính là cho phép các nhà đầu tư giao dịch dựa trên thông tin (công khai)\n. Các mục đích khác của hệ thống tài chính bao gồm phân bổ vốn tài chính cho\nnhững mục đích sử dụng hiệu quả nhất của nó và tập hợp những người muốn tiết kiệm với những người\nmuốn vay.\n(Module 39.1, LOS 39.a)"},{"n":14,"q":"Which of the following statements about financial intermediaries is most accurate?","opts":["Arbitrageurs buy securities with the anticipation that they will be able to sell the securities in the future at higher prices.","Brokers seek out traders that are willing to take the opposite sides of their clients’ orders.","Dealers buy a security in one market and simultaneously sell the same security in a different market."],"ans":"B","expl":"Các nhà môi giới tìm kiếm những nhà giao dịch sẵn sàng chấp nhận lệnh ngược lại của khách hàng.\nNhà kinh doanh chênh lệch giá mua một công cụ ở một thị trường và đồng thời bán công cụ đó\ninstrument ở thị trường khác với mức giá cao hơn. Các đại lý mua chứng khoán từ khách hàng với\nkỳ vọng rằng họ sẽ có thể bán chứng khoán cho các khách hàng khác trong tương lai với\ngiá cao hơn.\n(Module 39.1, LOS 39.d)"},{"n":15,"q":"An objective of financial market regulation is to:","opts":["ensure that inside information is made public in a timely manner.","prevent uninformed investors from participating in financial markets.","reduce information gathering costs by requiring common financial reporting standards."],"ans":"C","expl":"Một trong những mục tiêu của quy định thị trường là yêu cầu các công ty báo cáo kết quả hoạt động tài chính\ntheo một bộ tiêu chuẩn duy nhất, chẳng hạn như tiêu chuẩn của IASB hoặc FASB,\ndo đó làm giảm chi phí thu thập thông tin của người tham gia thị trường. Quy định thị trường\nkhông được thiết kế để ngăn chặn các nhà đầu tư thiếu hiểu biết giao dịch mà để bảo vệ các nhà đầu tư\nkhông tinh vi và do đó duy trì niềm tin vào thị trường tài chính. Mục tiêu của quy định\nthị trường là ngăn chặn những người có thông tin không công khai thu lợi từ\ncác nhà đầu tư khác, nhưng không nhất thiết phải công khai tất cả thông tin nội bộ.\n(Module 39.3, LOS 39.l)"},{"n":16,"q":"In contrast with a typical forward contract, futures contracts have:","opts":["greater counterparty risk.","standardized terms.","less liquidity."],"ans":"B","expl":"Hợp đồng tương lai là hợp đồng kỳ hạn giao dịch trên các sàn giao dịch và có các điều khoản được chuẩn hóa, trái ngược với\nhợp đồng kỳ hạn là các công cụ tùy chỉnh. Cơ quan thanh toán bù trừ\ntương lai giảm rủi ro đối tác bằng cách đảm bảo hiệu quả hoạt động của người mua và người bán\n. Hợp đồng tương lai được giao dịch trên các sàn giao dịch có tổ chức và có tính thanh khoản cao hơn hợp đồng kỳ hạn\n.\n(Mô-đun 39.1, LOS 39.c)"},{"n":17,"q":"Which of the following statements about selling a stock short is least likely accurate?","opts":["The seller must return the securities at the request of the lender.","The seller must inform their broker that the order is a short sale before completing the transaction.","The short seller may withdraw the proceeds of the short sale."],"ans":"C","expl":"Tiền thu được từ việc bán khống phải vẫn còn trong tài khoản môi giới cùng với\ntiền ký quỹ bắt buộc.\n(Mô-đun 39.2, LOS 39.e)"},{"n":18,"q":"Which of the following statements about the maintenance margin requirement is least\naccurate?","opts":["Generally the maintenance margin requirement is lower than the initial margin requirement.","The Federal Reserve sets the maximum maintenance margin.","The purpose of the maintenance margin requirement is to protect the broker in the event of a large stock decline."],"ans":"B","expl":"Cục Dự trữ Liên bang đặt ra mức ký quỹ duy trì tối thiểu và khoản đầu tư cá nhân\ncác công ty có thể đặt tỷ suất lợi nhuận cao hơn nếu họ muốn.\n(Mô-đun 39.2, LOS 39.f)"},{"n":19,"q":"Lynne Hampton purchased 100 shares of $75 stock on margin. The margin requirement set\nby the Federal Reserve Board was 40%, but Hampton's brokerage firm requires a total\nmargin of 50%. Currently the stock is selling at $62 per share. What is Hampton's return on\ninvestment before commission and interest if she sells the stock now?","opts":["-17%.","-35%.","-40%."],"ans":"B","expl":"Hampton ban đầu mua 100 cổ phiếu với giá 75 USD với tổng giá trị là $7500. Một nửa giá trị\n ($3750) đã được vay và Hampton trả tiền mặt cho nửa còn lại. Tổng giá trị thị trường\nhiện tại của cổ phiếu là $6200. Nếu Hampton bán cổ phần của mình, cô ấy sẽ còn lại $2450\nsau khi trả hết khoản vay. Lợi tức đầu tư ban đầu của Hampton là:\n$2450/3750 – 1 = 0,65 – 1 = -0,35 = -35%.\n(Mô-đun 39.2, LOS 39.f)"},{"n":20,"q":"Using the following assumptions, calculate the rate of return on a margin transaction for an\ninvestor who purchases the stock and the stock price at which the investor would have\nreceived a margin call.\nMarket Price Per Share: $32\nNumber of Shares Purchased: 1,000\nHolding Period: 1 year\nEnding Share Price: $34\nInitial Margin Requirement: 40%\nMaintenance margin: 25%\nTransaction and borrowing costs: $0\nThe company pays no dividends\nMargin ReturnMargin Call Price","opts":["6.3% | $25.60","15.6% | $25.60","15.6% | $17.07"],"ans":"B","expl":"Phần 1: Tính lợi nhuận ký quỹ:\nTỷ suất lợi nhuận ký quỹ %\n= [((Giá trị cuối cùng – Khoản thanh toán khoản vay) / Vị trí vốn chủ sở hữu bắt đầu) – 1] × 100\n= [(([$34 × 1.000] – [$32 × 1.000 × 0,60]) / ($32 × 0,40 × 1.000)) – 1] × 100\n= 15,6%\nThay thế (Séc): Tính toán tất cả tiền lãi và nhân với tỷ lệ đòn bẩy ký quỹ\nhệ số.\n[(34.000 – 32.000) / 32.000] × [1 / 0,40] = 6,35% × 2,5 = 15,6%\nPhần 2: Tính giá yêu cầu ký quỹ:\nCông thức tính giá yêu cầu ký quỹ là:\nGọi ký quỹ = (giá gốc) × (1 - ký quỹ ban đầu) / (1 - ký quỹ duy trì)\n= $32 × (1 - 0,40) / (1 - 0,25) = khoảng $25,60\n(Mô-đun 39.2, LOS 39.f)","qhtml":"<p>Using the following assumptions, calculate the rate of return on a margin transaction for an investor who purchases the stock and the stock price at which the investor would have received a margin call.</p><table class=\"qtable\"><thead><tr><th>Item</th><th>Value</th></tr></thead><tbody><tr><td>Market Price Per Share</td><td>$32</td></tr><tr><td>Number of Shares Purchased</td><td>1,000</td></tr><tr><td>Holding Period</td><td>1 year</td></tr><tr><td>Ending Share Price</td><td>$34</td></tr><tr><td>Initial Margin Requirement</td><td>40%</td></tr><tr><td>Maintenance margin</td><td>25%</td></tr><tr><td>Transaction and borrowing costs</td><td>$0</td></tr><tr><td>Dividends</td><td>None</td></tr></tbody></table><p><em>Options show → <strong>Margin Return</strong> | <strong>Margin Call Price</strong></em></p>"},{"n":21,"q":"Which of the following assets are best characterized as contracts?","opts":["Commercial paper.","Currency swaps.","Depository receipts."],"ans":"B","expl":"Hợp đồng bao gồm hợp đồng kỳ hạn, hợp đồng tương lai, hợp đồng quyền chọn, hợp đồng hoán đổi và hợp đồng bảo hiểm. Giấy tờ thương mại\nlà một chứng khoán nợ. Biên nhận lưu ký là cổ phiếu trong một phương tiện đầu tư gộp,\nchẳng hạn như quỹ tương hỗ hoặc quỹ giao dịch trao đổi.\n(Mô-đun 39.1, LOS 39.c)"},{"n":22,"q":"Which of the following statements about securities exchanges is NOT correct?","opts":["In call markets, there is only one negotiated price set to clear the market for a given stock.","In continuous markets, prices are set only by the auction process.","Securities exchanges may be structured as call markets or continuous markets."],"ans":"B","expl":"Trong các thị trường liên tục, giá được đặt theo quy trình đấu giá hoặc theo giá thầu của đại lý\nbáo giá.\n(Mô-đun 39.3, LOS 39.j)"},{"n":23,"q":"Which of the following orders is said to be \"behind the market\"?","opts":["Market sell order when the best bid is 38 and the best ask is 39.","Limit sell order at 38 when the best ask is 39.","Limit buy order at 38 when the best bid is 39."],"ans":"C","expl":"Lệnh mua giới hạn sẽ kém thị trường nếu giá giới hạn của nó thấp hơn giá thầu tốt nhất. Lệnh bán giới hạn\ncó giá trị thấp hơn thị trường nếu giá giới hạn của nó cao hơn giá chào bán tốt nhất. Lệnh thị trường không bao giờ\nđược cho là đứng sau thị trường.\n(Mô-đun 39.3, LOS 39.h)"},{"n":24,"q":"An electronic crossing network is best described as:","opts":["a price-driven market.","a quote-driven market.","an order-driven market."],"ans":"C","expl":"Mạng chéo là một ví dụ về thị trường theo đơn đặt hàng. Các lệnh được nhóm lại với nhau\nvà được ghép lại (khớp) vào những thời điểm cụ thể trong ngày giao dịch với mức giá dựa trên giá của\nsàn giao dịch khác. Thị trường định hướng theo giá và thị trường định hướng báo giá là những thuật ngữ khác dành cho\nthị trường đại lý hoặc thị trường không cần kê đơn.\n(Mô-đun 39.3, LOS 39.j)"},{"n":25,"q":"Which of the following statements about short sales is least accurate?","opts":["The short seller is required to replace the borrowed securities within six months of a short sale.","The short seller must pay the lender of the stock any dividends paid by the company.","Proceeds from short sales cannot be withdrawn from the account."],"ans":"A","expl":"Không có thời gian tối đa để có thể mượn chứng khoán. Nó phải được trả lại\nbất cứ khi nào người cho vay yêu cầu.\n(Mô-đun 39.2, LOS 39.e)"},{"n":26,"q":"A trader pays $100 per share to buy 500 shares of a non-dividend-paying firm. The purchase\nis done on margin, and the leverage ratio at purchase is 3.0X. Three months later, the trader\nsells the shares for $90 per share. Ignoring transaction costs and interest paid on the margin\nloan, the trader's 3-month return was closest to:","opts":["–30%.","–10%.","–40%."],"ans":"A","expl":"Với tỷ lệ đòn bẩy là 3 và giá trị cổ phiếu giảm 10%, lợi nhuận của nhà đầu tư là 3 × –\n10% = –30%.\n(Module 39.2, LOS 39.f)"},{"n":27,"q":"An investor buys 400 shares of a stock on margin for $25 a share. The initial margin\nrequirement is 50%, and the maintenance margin requirement is 25%. At what price would\nthe investor receive a margin call?","opts":["$21.88.","$16.67.","$6.25."],"ans":"B","expl":"Giá kích hoạt lệnh gọi ký quỹ = $25 × [(1 – 0,5)] / (1 – 0,25)] = $16,67.\n(Mô-đun 39.2, LOS 39.f)"},{"n":28,"q":"An order placed to protect a short position is called a:","opts":["protective call.","stop loss buy.","stop loss sell."],"ans":"B","expl":"Vị thế bán kiếm lợi từ việc giá cổ phiếu giảm và chịu lỗ theo giá\ntăng lên. Mua dừng lỗ là lệnh giới hạn được đặt cao hơn giá thị trường. Khi giá cổ phiếu\nđạt đến giá dừng, lệnh giới hạn sẽ được thực thi để hạn chế thua lỗ thêm.\n(Mô-đun 39.3, LOS 39.g)"},{"n":29,"q":"An investor sold a stock short and is worried about rising prices. To protect himself from\nrising prices he would place a:","opts":["limit order to buy.","stop order to buy.","stop order to sell."],"ans":"B","expl":"Lệnh giới hạn mua được đặt thấp hơn giá thị trường hiện tại.\nLệnh giới hạn bán được đặt cao hơn giá thị trường hiện tại.\nLệnh dừng (mất) để mua được đặt cao hơn giá thị trường hiện tại.\nLệnh dừng (lỗ) để bán được đặt thấp hơn giá thị trường hiện tại.\nLệnh dừng trở thành lệnh thị trường nếu giá đạt được.\n(Mô-đun 39.3, LOS 39.g)"},{"n":30,"q":"A securities exchange where traders buy and sell long-term government bonds from and to\nother traders would best be described as part of the:","opts":["capital market.","money market.","primary market."],"ans":"A","expl":"Sàn giao dịch này có thể được mô tả như một phần của thị trường vốn thứ cấp. Chứng khoán trước tiên\nđược phát hành trên thị trường sơ cấp, sau đó được giao dịch giữa các nhà đầu tư trên thị trường thứ cấp.\nThị trường tiền tệ đề cập đến thị trường của các công cụ nợ ngắn hạn (thường có\nthời gian đáo hạn dưới một năm) chẳng hạn như tín phiếu kho bạc.\n(Mô-đun 39.1, LOS 39.b)"},{"n":31,"q":"An order to sell a security at the best price available is a:","opts":["market order.","limit order.","stop order."],"ans":"A","expl":"Lệnh thị trường là lệnh mua hoặc bán chứng khoán ngay lập tức ở mức giá tốt nhất hiện có.\nLệnh giới hạn là lệnh mua ở mức giá giới hạn được chỉ định hoặc thấp hơn hoặc bán ở mức giới hạn\ngiá hoặc cao hơn. Lệnh dừng là lệnh mua nếu giá thị trường tăng đến\ngiá dừng được chỉ định hoặc bán nếu giá thị trường giảm đến giá dừng.\n(Mô-đun 39.3, LOS 39.h)"},{"n":32,"q":"An investor buys 200 shares of ABC at the market price of $100 on full margin. The initial\nmargin requirement is 40% and the maintenance margin requirement is 25%.\nIf the shares of stock later sold for $200 per share, what is the rate of return on the margin\ntransaction?","opts":["100%.","250%.","400%."],"ans":"B","expl":"Một cách nhanh chóng (và ít chuyên sâu hơn) để tính câu trả lời cho câu hỏi này trong bài kiểm tra\n(và điều rất quan trọng là tiết kiệm thời gian làm bài kiểm tra) là trước tiên hãy tính kết quả nếu\ntất cả tiền mặt, sau đó tính hệ số đòn bẩy ký quỹ và cuối cùng, nhân hệ số đòn bẩy\n với tổng lợi nhuận bằng tiền mặt để có được lợi nhuận ký quỹ.\nTính toán:\nBước 1: Tính toán toàn bộ tiền lãi:\nLợi nhuận tiền mặt % = [(Giá trị cuối kỳ / Vị thế vốn sở hữu đầu kỳ) – 1] × 100\n= [(($200 × 200) / ($100 × 200)) – 1] × 100 = 100%\nBước 2: Tính hệ số đòn bẩy:\nHệ số đòn bẩy = 1 / Ký quỹ ban đầu % = 1 / 0,40 = 2,50\nBước 3: Tính toán Lợi nhuận ký quỹ:\nLợi nhuận giao dịch ký quỹ = Tất cả tiền mặt × Hệ số đòn bẩy = 100% × 2,50 =\n250%\nLưu ý: Bạn có thể xác minh lợi nhuận ký quỹ như sau:\nTỷ suất lợi nhuận ký quỹ % = [((Giá trị cuối cùng – Khoản thanh toán khoản vay) / Vị thế vốn chủ sở hữu bắt đầu) – 1]\n× 100\n= [(([$200 × 200] – [$100 × 200 × 0,60]) / ($100 × 0,40 × 200)) – 1] × 100\n= [((40.000 – 12.000) / 8.000) – 1] × 100 = 250%\n(Mô-đun 39.2, LOS 39.f)"},{"n":33,"q":"Which of the following option positions is said to be a long position?","opts":["Writer of a put option.","Writer of a call option.","Buyer of a put option."],"ans":"C","expl":"Người mua quyền chọn (gọi hoặc bán) được cho biết là tùy chọn mua và người viết\nan tùy chọn được cho là tùy chọn bán ngắn. Lưu ý rằng với quyền chọn bán, người nắm giữ quyền chọn mua (put option\n) được hưởng lợi khi giá của tài sản cơ bản giảm, trong khi người nắm giữ quyền chọn bán (put\noption) được hưởng lợi khi giá của tài sản cơ bản tăng. Chúng tôi nói rằng người mua\ncó quyền chọn mua nhưng có khả năng tiếp xúc ngắn hạn với giá tài sản cơ bản.\n(Mô-đun 39.2, LOS 39.e)"},{"n":34,"q":"A trader enters a limit order to buy 10,000 shares as a day order. The \"day order\" instruction\nis most accurately referred to as:","opts":["a validity instruction.","a clearing instruction.","an execution instruction."],"ans":"A","expl":"Hướng dẫn hợp lệ chỉ định thời điểm thực hiện giao dịch. Đặc điểm của lệnh trong ngày (vì\nngược lại với lệnh có hiệu lực cho đến khi bị hủy) là một hướng dẫn có hiệu lực. (Mô-đun 39.3, LOS 39.g)"},{"n":35,"q":"Which of the following limit orders is least likely to be filled?","opts":["Aggressively priced limit buy order.","Behind-the-market limit buy order.","Inside-the-market limit sell order."],"ans":"B","expl":"\"Phía sau thị trường\" đề cập đến lệnh mua có giá giới hạn thấp hơn giá thầu tốt nhất hoặc bán\norder với giá giới hạn cao hơn mức giá yêu cầu tốt nhất. Lệnh giới hạn nằm sau thị trường\n(tức là lệnh mua với giá thấp hơn giá thị trường hoặc bán với giá cao hơn giá thị trường)\nsẽ không được thực hiện trừ khi giá thị trường di chuyển đến giá giới hạn của lệnh. \"Bên trong\nmarket\" đề cập đến các đơn đặt hàng có mức giá giới hạn giữa giá thầu tốt nhất và giá chào bán tốt nhất. \"Được định giá\n\" là lệnh mua có giá giới hạn cao hơn giá chào bán tốt nhất hoặc lệnh bán có\ngiá giới hạn thấp hơn giá thầu tốt nhất. Các lệnh giới hạn có mức giá linh hoạt có nhiều khả năng được thực hiện\nngay lập tức.\n(Mô-đun 39.3, LOS 39.h)"},{"n":36,"q":"An investor purchases 100 shares of Lloyd Computer at $26 a share. The initial margin\nrequirement is 50%, and the maintenance margin requirement is 25%. The price below\nwhich the investor would receive a margin call is closest to:","opts":["17.33.","15.25.","19.45."],"ans":"A","expl":"26 × (1 - 0,5)/(1 - 0,25) = $17,33.\n(Mô-đun 39.2, LOS 39.f)"},{"n":37,"q":"Which of the following is least likely a characteristic of a well-functioning market?","opts":["Prices adjust quickly when new information becomes available.","Prices change significantly from one transaction to the next.","Reliable information is available on price and volume."],"ans":"B","expl":"Trong một thị trường hoạt động tốt, giá thường không thay đổi nhiều từ một giao dịch\nsang giao dịch tiếp theo vì nhiều người mua và người bán sẵn sàng giao dịch ở mức giá gần với giá\nhiện tại. Đặc điểm của một thị trường hoạt động tốt bao gồm sự sẵn có của thông tin\nđáng tin cậy về giá cả và khối lượng giao dịch; tính thanh khoản (khả năng tiếp thị và giá\ntính liên tục); giá phản ứng nhanh với thông tin mới; và chi phí giao dịch thấp.\n(Mô-đun 39.3, LOS 39.k)"},{"n":38,"q":"Stop loss sell orders are:","opts":["executed on an uptick only.","placed to protect a short position.","placed to protect the gains on a long position."],"ans":"C","expl":"Lệnh bán dừng lỗ là lệnh bán giới hạn được đặt dưới giá thị trường. Khi\ngiá cổ phiếu giảm xuống mức giá được chỉ định, lệnh bán sẽ được thực thi để bảo vệ nhà đầu tư\nkhông bị giảm thêm.\n(Mô-đun 39.3, LOS 39.g)"},{"n":39,"q":"A stock's limit order book is as follows:\nBid SizeLimit Price (£)Offer Size\n70025.25\n30025.30\n10025.40\n25.50500\n25.55200\n25.75500\nA new sell limit order is placed for 250 shares at £25.45. This limit order is said to be:","opts":["an iceberg order.","behind the market.","making a new market."],"ans":"C","expl":"Lệnh đang được đặt nằm giữa giá thầu tốt nhất và giá chào bán tốt nhất. Nó tạo ra một thị trường mới với\ngiá chào mua mới là £25,40 – £25,45.\n(Mô-đun 39.3, LOS 39.h)","qhtml":"<p>A stock's limit order book is as follows:</p><table class=\"qtable\"><thead><tr><th>Bid Size</th><th>Limit Price (£)</th><th>Offer Size</th></tr></thead><tbody><tr><td>700</td><td>25.25</td><td></td></tr><tr><td>300</td><td>25.30</td><td></td></tr><tr><td>100</td><td>25.40</td><td></td></tr><tr><td></td><td>25.50</td><td>500</td></tr><tr><td></td><td>25.55</td><td>200</td></tr><tr><td></td><td>25.75</td><td>500</td></tr></tbody></table><p>A new sell limit order is placed for 250 shares at £25.45. This limit order is said to be:</p>"},{"n":40,"q":"Which of the following statements about primary and secondary markets is least accurate?","opts":["The proceeds from a sale in the secondary market go to the issuer.","A primary market is a market in which new securities are sold.","The primary market benefits from the liquidity provided by the secondary market."],"ans":"A","expl":"Tiền thu được từ thị trường sơ cấp sẽ được chuyển đến công ty phát hành. Tiền thu được từ việc bán chứng khoán trên thị trường thứ cấp\nsẽ được chuyển đến chủ sở hữu hiện tại đang bán chứng khoán.\n(Mô-đun 39.3, LOS 39.i)"},{"n":41,"q":"A trading system that matches buyers and sellers based on price and time precedence is\nmost likely a(n):","opts":["quote-driven market.","order-driven market.","brokered market."],"ans":"B","expl":"Trong thị trường theo lệnh, lệnh mua và lệnh bán được khớp với nhau bởi sàn giao dịch\ntheo quy tắc khớp lệnh. Trong thị trường định hướng theo báo giá, khách hàng giao dịch với các đại lý\ntheo giá chào mua và chào bán do các đại lý đặt ra. Trong thị trường được môi giới, người môi giới tổ chức các giao dịch\ngiữa các khách hàng của họ.\n(Mô-đun 39.3, LOS 39.j)"},{"n":42,"q":"The prospectus for the Horizon Fund states that it invests only in real assets. Which of the\nfollowing would the Horizon Fund most likely include in its portfolio?","opts":["Common stock of a technology company.","Foreign currencies.","An apartment complex."],"ans":"C","expl":"Tài sản thực là tài sản có sự hiện diện vật chất như bất động sản hoặc thiết bị và\nmáy móc. Khoản đầu tư vào khu chung cư là một khoản đầu tư bất động sản và\ndo đó sẽ được coi là tài sản thực sự.\n(Mô-đun 39.1, LOS 39.b)"},{"n":43,"q":"Which of the following statements about securities exchanges is most accurate?","opts":["Call markets are markets in which the stock is only traded at specific times.","Continuous markets are markets where trades occur 24 hours per day.","Setting a negotiated price to clear the market is a method used to set the closing price in major continuous markets."],"ans":"A","expl":"Thị trường liên tục là thị trường nơi giao dịch diễn ra bất cứ lúc nào thị trường mở cửa (tức là\nthị trường không cần mở cửa 24 giờ mỗi ngày). Đặt một mức giá thương lượng là phương pháp\nđược sử dụng trong các thị trường lớn liên tục để đặt giá mở cửa.\n(Mô-đun 39.3, LOS 39.j)"},{"n":44,"q":"Which of the following is most likely an objective of market regulation?","opts":["Preserve trust in financial markets.","Limit downside risk to investors.","Educate unsophisticated investors."],"ans":"A","expl":"Các quy tắc chống lại giao dịch nội gián và việc thực thi luật liên quan đến gian lận và trộm cắp của\ncác nhà quản lý doanh nghiệp nhằm mục đích duy trì niềm tin vào thị trường của các nhà đầu tư đại chúng.\nTrong khi việc tiết lộ và ngăn chặn gian lận rõ ràng và trung thực là mục tiêu, hạn chế rủi ro giảm giá\ncủa thị trường chứng khoán không phải là mục tiêu của quy định tài chính.\nviệc giáo dục các nhà đầu tư không tinh vi cũng không phải vậy.\n(Module 39.3, LOS 39.l)"},{"n":45,"q":"Peg Fisk, CFA, states that two of the objectives of market regulation which CFA Institute\nattempts to address are minimum standards of competence among investment\nprofessionals and ease of performance evaluation for investors. Fisk is accurate with regard\nto:","opts":["both of these objectives.","neither of these objectives.","only one of these objectives."],"ans":"A","expl":"CFA Viện cố gắng giải quyết cả hai mục tiêu này của quy định thị trường. Chương trình CFA\nlà một phần trong nỗ lực khuyến khích các tiêu chuẩn năng lực tối thiểu của các chuyên gia tài chính\n. Tiêu chuẩn Hiệu suất Đầu tư Toàn cầu là một phần trong nỗ lực\ngiúp các nhà đầu tư đánh giá hiệu suất dễ dàng hơn.\n(Mô-đun 39.3, LOS 39.l)"},{"n":46,"q":"With respect to a well-functioning securities market, a market that exhibits operational\nefficiency will have:","opts":["price continuity.","low transaction costs.","rapid price reactions to new information."],"ans":"B","expl":"Thị trường hoạt động hiệu quả là thị trường trong đó chi phí của mỗi giao dịch là\ntối thiểu. Hiệu quả thông tin có nghĩa là giá cả trên thị trường phản ánh tất cả thông tin\nhiện có sẵn cho người tham gia. Tính liên tục của giá có nghĩa là giá không điều chỉnh nhiều\ntừ giao dịch này sang giao dịch tiếp theo trừ khi có được\nthông tin mới về giá trị công ty.\n(Module 39.3, LOS 39.k)"},{"n":47,"q":"Which of the following conditions is most likely necessary for capital to be allocated to its\nmost valuable uses?","opts":["Financial markets are frictionless (i.e., free of taxes or transactions costs).","Investors are well informed about the risk and return of various investments.","There are no barriers to the flow of complete information to the financial markets."],"ans":"B","expl":"Vốn sẽ chảy vào những mục đích sử dụng có giá trị nhất nếu thị trường hoạt động tốt và các nhà đầu tư được thông tin rõ ràng\nvề đặc điểm rủi ro và lợi nhuận của các khoản đầu tư khác nhau. Việc phân bổ\nvốn cho những mục đích sử dụng có giá trị nhất không yêu cầu tất cả các nhà đầu tư phải có thông tin\nđầy đủ hoặc thị trường tài chính không có ma sát.\n(Mô-đun 39.1, LOS 39.a)"},{"n":48,"q":"Sonia Fennell purchases 1,000 shares of Xpressoh Inc. for $35 per share. One year later, she\nsells the stock for $42 per share. Xpressoh Inc. pays no dividends. The initial margin\nrequirement is 50%. Fennell's one-year return assuming an all-cash transaction, and if she\nbuys on margin (assume she pays no transaction or borrowing costs and has not had to post\nadditional margin), are closest to:\nAll-cash50% margin","opts":["20% | 40%","40% | 80%","20% | 80%"],"ans":"A","expl":"Hoàn trả toàn bộ tiền mặt = 42/35 – 1 = 20%\nLợi nhuận ký quỹ = (42 – 35)/[(35)(0,5)] = 40%\n(Mô-đun 39.2, LOS 39.f)","qhtml":"<p>Sonia Fennell purchases 1,000 shares of Xpressoh Inc. for $35 per share. One year later, she sells the stock for $42 per share. Xpressoh Inc. pays no dividends. The initial margin requirement is 50%. Fennell’s one-year return assuming an all-cash transaction, and if she buys on margin (assume she pays no transaction or borrowing costs and has not had to post additional margin), are closest to:</p><p><em>Options show → <strong>All-cash</strong> | <strong>50% margin</strong></em></p>"},{"n":49,"q":"An investor buys 200 shares of ABC at the market price of $100 and posts the required initial\nmargin of $8,000. The maintenance margin requirement is 25%.\nAt what share price will the investor's account balance be reduced to the maintenance\nmargin level?","opts":["$48.","$112.","$80."],"ans":"C","expl":"Yêu cầu ký quỹ ban đầu là 8.000 USD / (200 × 100 USD) = 0,40. Ở vị thế mua cổ phiếu,\nphương trình để xác định giá yêu cầu ký quỹ là:\nlong = [(giá gốc)(1 – ký quỹ ban đầu %)] / [1 – ký quỹ duy trì %]\n= $100(1 – 0,4) / (1 – 0,25) = $80\nNgoài ra, khoản vay ký quỹ là (200 × 100 USD) – 8.000 USD = 12.000 USD. Giá trị tối thiểu của\nvị thế mua đáp ứng yêu cầu ký quỹ duy trì là 12.000 USD / (1 – 0,25) =\n16.000 USD. Giá cổ phiếu mà vị thế mua có giá trị này là $16.000 / 200 = $80.\n(Module 39.2, LOS 39.f)"},{"n":50,"q":"An investor purchases 200 shares of Rubble, Inc. on margin. The shares are trading at $40.\nInitial and maintenance margins are 50% and 25%. If the company pays a dividend of $0.75\nand the investor sells the stock at year-end for $50 per share, the return on the investment\nwould be closest to:","opts":["15.75%.","39.55%.","53.75%."],"ans":"C","expl":"Thu nhập cổ tức = 0,75 × 200 = $150\nLợi nhuận = 10.000 – 8.000 + 150 = 2.150\nTrả về = 2.150 / 4.000 = 53,75%\n(Mô-đun 39.2, LOS 39.f)"},{"n":51,"q":"Which of the following statements regarding margin accounts is most accurate?","opts":["Maintenance margin refers to the amount of funds the investor can borrow.","Margin accounts can be used to purchase securities by borrowing part of the purchase price.","The total equity in the margin account cannot fall below the initial margin requirement."],"ans":"B","expl":"Tài khoản ký quỹ là tài khoản môi giới cho phép nhà đầu tư vay một phần\ngiá mua từ nhà môi giới.\n(Mô-đun 39.2, LOS 39.f)"},{"n":52,"q":"An investor purchases 200 shares of Mertz, Inc. on margin. The shares are trading at $40.\nInitial and maintenance margins are 50% and 25%. If the investor sells the stock when the\nprice rises to $50 at year-end, the return on the investment would be closest to:","opts":["25%.","20%.","50%."],"ans":"C","expl":"Lợi nhuận = 10.000 – 8.000 = 2.000\nLợi nhuận = 2.000 / 4.000 = 50%\n(Mô-đun 39.2, LOS 39.f)"},{"n":53,"q":"Austin Bruno, CFA, places a fill or kill, limit buy order at 92 for a stock. Bruno's order\nspecifies:","opts":["clearing and validity instructions.","validity and execution instructions.","execution and clearing instructions."],"ans":"B","expl":"Điền hoặc hủy là một hướng dẫn hợp lệ vì nó cho biết thời điểm có thể thực hiện đơn hàng (tức là\nngay lập tức hoặc hủy đơn hàng). Lệnh mua giới hạn là một hướng dẫn thực hiện vì nó\ncho biết cách thực hiện lệnh (ví dụ: mua ở mức $92 trở xuống). Hướng dẫn xóa\ncho biết cách thanh toán giao dịch (tức là cách thức và thời điểm chuyển tiền mặt và chứng khoán).\n(Mô-đun 39.3, LOS 39.g)"},{"n":54,"q":"An investor bought a stock on margin. The margin requirement was 60%, the current price of\nthe stock is $80, and the stock price was $50 one year ago. If margin interest is 5%, how\nmuch equity did the investor have in the investment at year-end?","opts":["67.7%.","60.6%.","73.8%."],"ans":"C","expl":"Nợ ký quỹ = 40% × $50 = $20; Tiền lãi = $20 × 0,05 = $1.\nVốn chủ sở hữu % = [Giá trị – (nợ ký quỹ + tiền lãi)] / Giá trị\n$80 - $21 / $80 = 73,8%\n(Mô-đun 39.2, LOS 39.f)"},{"n":55,"q":"The main functions of the financial system most likely include:","opts":["allocating capital to its most productive uses and determining the supply of money.","determining equilibrium interest rates and allocating capital to its most productive uses.","determining the supply of money and determining equilibrium interest rates."],"ans":"B","expl":"Chức năng chính của hệ thống tài chính là cho phép các cá nhân và tổ chức\ntiết kiệm, vay, huy động vốn và quản lý rủi ro; để xác định tỷ lệ lợi nhuận cân bằng\nlàm cân bằng số tiền cho vay và đi vay; và phân bổ vốn cho những mục đích sử dụng\nhiệu quả nhất. Nguồn cung tiền thường được kiểm soát bởi ngân hàng trung ương của các quốc gia.\n(Mô-đun 39.1, LOS 39.a)"},{"n":56,"q":"Which of the following statements regarding secondary markets is least accurate? Secondary\nmarkets are important because they provide:","opts":["investors with liquidity.","regulators with information about market participants.","firms with greater access to external capital."],"ans":"B","expl":"Thị trường thứ cấp rất quan trọng vì chúng cung cấp tính thanh khoản và thông tin\nliên tục cho các nhà đầu tư. Tính thanh khoản của thị trường thứ cấp làm tăng thêm giá trị cho cả\nnhà đầu tư và công ty vì ngày càng có nhiều nhà đầu tư sẵn sàng mua trái phiếu phát hành trên thị trường sơ cấp,\nkhi họ biết những trái phiếu này sau này sẽ trở nên thanh khoản trên thị trường thứ cấp. Do đó,\nthị trường thứ cấp giúp các doanh nghiệp huy động vốn bên ngoài dễ dàng hơn.\n(Mô-đun 39.3, LOS 39.i)"},{"n":57,"q":"An investor sells a stock short. To protect against a large loss on this position, the investor is\nmost likely to:","opts":["place a stop buy order.","buy a put option.","set a limit price on the order to sell short."],"ans":"A","expl":"Lệnh dừng mua cao hơn giá thị trường hiện tại sẽ được thực thi nếu giá thị trường\ntăng đến giá dừng được chỉ định. Điều này sẽ hạn chế tổn thất của người bán khống nếu giá cổ phiếu\ntăng.\nViệc mua quyền chọn bán sẽ làm tăng khả năng nắm giữ vị thế bán khống của nhà đầu tư đối với giá cổ phiếu.\nViệc đặt giá giới hạn cho lệnh bán khống sẽ ảnh hưởng đến mức giá mà giao dịch bán khống\ncó thể thực hiện, nhưng sẽ không hạn chế khoản lỗ tiềm ẩn của người bán khống.\n(Mô-đun 39.2, LOS 39.e)"},{"n":58,"q":"A unique item such as fine art is most likely to be exchanged in a(n):","opts":["brokered market.","order-driven market.","quote-driven market."],"ans":"A","expl":"Thị trường môi giới thường là cấu trúc thị trường tốt nhất cho các mặt hàng độc đáo. Nhà môi giới tăng thêm\ngiá trị bằng cách định vị một đối tác để thực hiện giao dịch ngược lại đối với mặt hàng đó.\n(Mô-đun 39.3, LOS 39.j)"},{"n":59,"q":"Regarding the technical points affecting the short sales of a stock, which of the following\nstatements is most accurate?","opts":["Stocks can only be shorted in a down market.","The lender must deposit margin to guarantee the eventual return of the stock.","The short seller must pay all dividends due to the lender of the shorted stock."],"ans":"C","expl":"Người bán khống phải trả bất kỳ cổ tức nào trên cổ phiếu cho chủ sở hữu cổ phiếu đã vay.\nNgười bán khống cũng phải đặt cọc tiền ký quỹ để đảm bảo việc mua lại\ncuối cùng security.\n(Mô-đun 39.2, LOS 39.e)"},{"n":60,"q":"An investor buys 1,000 shares of a non-dividend-paying stock for $18. The initial margin\nrequirement is 40% and the maintenance margin is 30%. After one year the investor sells the\nstock for $24 per share. The investor's rate of return on this investment (ignoring borrowing\nand transactions costs and taxes), and the price at which the investor would receive a\nmargin call, are closest to:\nRate of returnMargin call","opts":["33% | $15.43","83% | $21.00","83% | $15.43"],"ans":"C","expl":"Để nhận được kết quả:\nPhần 1: Tính toán ký quỹ Trả về:\nTỷ lệ hoàn vốn ký quỹ % = [((Giá trị cuối cùng - Khoản thanh toán khoản vay) / Vị trí vốn chủ sở hữu bắt đầu) – 1] * 100 =\n= [(([$24 × 1.000] – [$18 × 1.000 × 0,60]) / ($18 × 0,40 × 1.000)) – 1] × 100 =\n= 83,33%\nThay thế (Kiểm tra):\nTính toàn bộ tiền lãi và nhân với hệ số đòn bẩy ký quỹ.\n= [(24.000 – 18.000)/18.000] × [1 / 0,40] = 33,33% × 2,5 = 83,33%\nPhần 2: Tính giá yêu cầu ký quỹ:\nVì nhà đầu tư mua cổ phiếu nên công thức cho giá yêu cầu ký quỹ là:\nGọi ký quỹ = (giá gốc) × (1 – ký quỹ ban đầu) / (1 – ký quỹ duy trì)\n= $18 × (1 – 0,40) / (1 – 0,30) = $15,43\n(Mô-đun 39.2, LOS 39.f)","qhtml":"<p>An investor buys 1,000 shares of a non-dividend-paying stock for $18. The initial margin requirement is 40% and the maintenance margin is 30%. After one year the investor sells the stock for $24 per share. The investor's rate of return on this investment (ignoring borrowing and transactions costs and taxes), and the price at which the investor would receive a margin call, are closest to:</p><p><em>Options show → <strong>Rate of Return</strong> | <strong>Margin Call</strong></em></p>"},{"n":61,"q":"A financial system in which transactions have low costs is said to exhibit:","opts":["allocational efficiency.","informational efficiency.","operational efficiency."],"ans":"C","expl":"Hiệu suất hoạt động ở mức thấp chi phí giao dịch. Một hệ thống tài chính thể hiện\nhiệu quả thông tin nếu giá phản ánh nhanh chóng tất cả thông tin liên quan đến giá trị\ncơ bản. Thị trường thể hiện hiệu quả phân bổ nếu nó khiến vốn được chuyển đến\nnhững mục đích sử dụng hiệu quả nhất.\n(Module 39.3, LOS 39.k)"},{"n":62,"q":"Which of the following statements about securities markets is least accurate?","opts":["Characteristics of a well-functioning securities market include: many buyers and sellers, low bid-ask spreads, timely information on price and volume of past transactions, and accurate information on supply and demand.","Secondary markets, such as the over-the-counter (OTC) market, provide liquidity and price continuity.","A limit buy order and a stop buy order are both placed below the current market price."],"ans":"C","expl":"Mua giới hạn được đặt dưới giá thị trường hiện tại, nhưng lệnh dừng mua được đặt cao hơn\ngiá thị trường hiện tại (lệnh dừng mua thường được đặt để bảo vệ việc bán khống từ\nthị trường đang phát triển).\nCác lựa chọn khác đều đúng. Một thị trường chứng khoán hoạt động tốt bao gồm\ncác đặc điểm sau:\nthông tin kịp thời và chính xác về giá và khối lượng của các giao dịch trong quá khứ.\nthông tin kịp thời và chính xác về cung và cầu cho các giao dịch hiện tại.\nkhả năng thanh khoản (được biểu thị bằng chênh lệch giá mua-bán thấp).\nkhả năng tiếp thị.\ngiá tính liên tục.\nđộ sâu (nhiều người mua và người bán).\nhiệu quả hoạt động (chi phí giao dịch thấp).\nhiệu quả thông tin (điều chỉnh giá nhanh chóng).\n(Mô-đun 39.3, LOS 39.h)"},{"n":63,"q":"When using margin to invest in equities, which of the following defines initial margin and\nwhat level will the margin be brought back to in the event of a margin call?\nInitial MarginMargin Call Action","opts":["the amount of borrowed funds in the transaction | a deposit must be made to bring the margin back to the maintenance margin","the minimum amount of equity required of the investor | a deposit must be made to bring the margin back to the maintenance margin","the minimum amount of equity required of the investor | a deposit must be made to bring the margin back to the initial margin"],"ans":"B","expl":"Yêu cầu ký quỹ ban đầu đề cập đến số vốn sở hữu tối thiểu mà nhà đầu tư cần có.\nVới cổ phiếu, nếu tỷ lệ ký quỹ giảm xuống dưới mức ký quỹ duy trì thì tiền phải được đã gửi\nđể đưa nó trở lại mức ký quỹ duy trì.\n(Mô-đun 39.2, LOS 39.f)","qhtml":"<p>When using margin to invest in equities, which of the following defines initial margin and what level will the margin be brought back to in the event of a margin call?</p><p><em>Options show → <strong>Initial Margin</strong> | <strong>Margin Call Action</strong></em></p>"},{"n":64,"q":"An investor purchases stock on 25% initial margin, posting $10 of the original stock price of\n$40 as equity. The position has a required maintenance margin of 20%. The investor later\nsells the stock for $45. Ignoring transaction costs and margin loan interest, which of the\nfollowing statements is most accurate?","opts":["Leverage ratio is 3:1.","Margin call price is $36.","Return on investment is 50%."],"ans":"C","expl":"Lợi tức vốn đầu tư là ($45 – $40) / $10 = 50%.\nTỷ lệ đòn bẩy là giá mua / vốn chủ sở hữu = $40 / $10 = 4.\nGiá yêu cầu ký quỹ là $40 × [(1 – 0,25) / (1 – 0,20)] = $37,50.\n(Mô-đun 39.2, LOS 39.f)"},{"n":65,"q":"If an investor buys 100 shares of a $50 stock on margin when the initial margin requirement\nis 40%, how much money must she borrow from her broker?","opts":["$2,000.","$3,000.","$4,000."],"ans":"B","expl":"Yêu cầu ký quỹ ban đầu là 40% có nghĩa là nhà đầu tư phải đặt cọc 40%\nquỹ và công ty môi giới có thể cho vay số dư 60%. Do đó, trong ví dụ này (100\nshares) * ($50) = tổng chi phí là $5.000. 5.000 USD * 0,60 = 3.000 USD.\n(Mô-đun 39.2, LOS 39.f)"},{"n":66,"q":"A short seller:","opts":["does not receive the dividends.","loses if the price of the stock sold short decreases.","often also places a stop loss sell order."],"ans":"A","expl":"Người bán khống trả tất cả cổ tức cho người cho vay, thua nếu giá cổ phiếu tăng và được yêu cầu\ngửi tài khoản ký quỹ. Người bán khống thường đặt lệnh dừng mua để bảo vệ vị thế bán khống\ntrước thị trường đang lên.\n(Mô-đun 39.2, LOS 39.e)"},{"n":67,"q":"Jerry Slotz enters an exchange-traded contract that obligates him to purchase a specific\namount of an asset on a future date. The contract is most likely:","opts":["a forward contract.","a futures contract.","an option contract."],"ans":"B","expl":"Hợp đồng tương lai là hợp đồng tiêu chuẩn được giao dịch trên sàn giao dịch bắt buộc một\nmột bên phải mua và một bên phải bán một lượng tài sản cụ thể ở một mức giá xác định\nvào một ngày xác định trong tương lai. Hợp đồng kỳ hạn tương tự như hợp đồng tương lai nhưng\ncó thể tùy chỉnh (tức là không được chuẩn hóa) và được giao dịch không cần kê đơn (tức là không được giao dịch trên Exchange-\n). Quyền chọn mua có thể được giao dịch trên sàn giao dịch; tuy nhiên, chúng trao cho chủ sở hữu quyền\nquyền chứ không phải nghĩa vụ mua tài sản vào một ngày trong tương lai.\n(Mô-đun 39.1, LOS 39.a)"},{"n":68,"q":"Among the classifications of investment assets, \"real assets\" most likely include:","opts":["industrial stocks.","foreign currencies.","durable equipment."],"ans":"C","expl":"Tài sản thực bao gồm bất động sản, thiết bị lâu bền và các tài sản vật chất khác. Vốn chủ sở hữu\nchứng khoán chẳng hạn như cổ phiếu công nghiệp được phân loại là tài sản tài chính. Tiền tệ là một\nphân loại tài sản đầu tư riêng biệt.\n(Mô-đun 39.1, LOS 39.b)"},{"n":69,"q":"The initial margin is the:","opts":["amount of cash that an investor must maintain in his/her margin account.","equity represented in the margin account at any time.","minimum amount of funds that must be supplied when purchasing a security on margin."],"ans":"C","expl":"Ký quỹ là số vốn sở hữu trong tài khoản tại một thời điểm nhất định. Ký quỹ ban đầu là số tiền\nvốn chủ sở hữu cần thiết ban đầu để thực hiện một lệnh.\n(Mô-đun 39.2, LOS 39.f)"},{"n":70,"q":"Evelyn Stram, CFA, places a good-till-cancelled limit buy order at 86 for a stock. Stram's order\nspecifies:","opts":["clearing and validity instructions.","validity and execution instructions.","execution and clearing instructions."],"ans":"B","expl":"Tốt cho đến khi bị hủy là hướng dẫn hợp lệ, cho biết thời điểm một lệnh có thể được thực hiện.\nHướng dẫn thực hiện bao gồm lệnh giới hạn và lệnh thị trường cũng như hướng dẫn\nliên quan đến quy mô giao dịch và khả năng hiển thị. Hướng dẫn thanh toán bù trừ cho biết cách sắp xếp việc thanh toán\ncuối cùng của giao dịch.\n(Mô-đun 39.3, LOS 39.g)"},{"n":71,"q":"An investor purchases 100 shares at $75 per share with an initial margin of 50%. Assume\nthere is no interest on the call loan and no transactions fees. If the stock price rises to\n$112.50, the rate of return to the investor is:","opts":["100%.","200%.","50%."],"ans":"A","expl":"$75/cổ phiếu × 100 cổ phiếu = $7.500.\nBiên lợi nhuận 50% nghĩa là nhà đầu tư chỉ trả một nửa trong số 7.500 USD bằng tiền mặt, hoặc $3.750 và vay\n$3.750 còn lại.\nTỷ lệ hoàn vốn = (giá trị thị trường – khoản đầu tư ban đầu – hoàn trả khoản vay ký quỹ) / vốn chủ sở hữu ban đầu\n= ($11.250 – $3.750 – $3.750) / $3.750 = 100%.\n(Module 39.2, LOS 39.f)"},{"n":72,"q":"Equity securities most likely include:","opts":["preferred stock and certificates of deposit.","common stock and warrants.","exchange-traded funds."],"ans":"B","expl":"Cổ phiếu phổ thông, cổ phiếu ưu đãi và chứng quyền là chứng khoán vốn. Chứng chỉ tiền gửi\nlà chứng khoán nợ. Các quỹ giao dịch trao đổi là các phương tiện đầu tư gộp.\n(Mô-đun 39.1, LOS 39.c)"},{"n":73,"q":"Toby Jensen originally purchased 400 shares of CSC stock on margin at a price of $60 per\nshare. The initial margin requirement is 50% and the maintenance margin is 25%. CSC stock\nprice has fallen dramatically in recent months and it closed today with a sharp decline\nbringing the closing price to $40 per share. Will Jensen receive a margin call?","opts":["Yes, he does not meet the minimum maintenance margin requirement.","No, he meets the minimum initial margin requirement.","No, he meets the minimum maintenance margin requirement."],"ans":"C","expl":"Tổng giá trị ban đầu mà Jensen nắm giữ là 400 × $60 = $24.000.\nSố vốn sở hữu là 50% ($24.000) = $12.000.\nTổng giá trị hiện tại là 400 × $40 = $16.000.\nVậy vốn chủ sở hữu của Jensen là $16.000 - $12.000 = 4.000 USD tức là 4.000/16.000 = 25% tổng giá trị thị trường\n.\n(Học phần 39.2, LOS 39.f)"}];
const CFG = {"title": "Market Organization and Structure", "subtitle": "CFA · Equity Investments · Reading 39 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem";
    if(q.qhtml){ stem.innerHTML = q.qhtml; } else { stem.textContent = q.q; }
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
