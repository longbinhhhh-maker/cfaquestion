<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "An investor purchased 725 shares of stock at $40 per share and posted initial margin of 60%.\nHe subsequently sold the shares at $50 per share. Based only on this information, the\ninvestor's holding period return is closest to:", "opts": ["20%.", "25%.", "40%."], "ans": "C", "expl": "(50 – 40) / (40 × 0.6) = 41.67%.\n(Module 39.2, LOS 39.f)"}, {"n": 2, "q": "Becky Kirk contacted her broker and placed an order to purchase 1,000 shares of Bricko\nCorp. stock at a price of $60 per share. Kirk wishes to buy on margin. Assuming the margin\nrequirement is 40%, how much money does Kirk have to pay up front to make the purchase?", "opts": ["$60,000.", "$36,000.", "$24,000."], "ans": "C", "expl": "The margin requirement represents the amount of money an investor must put down on\nthe purchase. So Kirk must put $24,000 down ($60,000 × .40 = $24,000) and can borrow\nthe balance.\n(Module 39.2, LOS 39.f)"}, {"n": 3, "q": "Financial intermediaries that issue securities which represent interests in a pool of similar\nfinancial assets are best characterized as:", "opts": ["arbitrageurs.", "block brokers.", "securitizers."], "ans": "C", "expl": "Securitizers are financial intermediaries that assemble large pools of similar financial\nassets, such as mortgages or loans, and issue securities that represent interests in the\npool. Block brokers assist their clients with large trades of securities. Arbitrageurs\nsimultaneously buy and sell the same asset in different markets to take advantage of\ndifferent prices for the same asset.\n(Module 39.1, LOS 39.d)"}, {"n": 4, "q": "A market that directs capital to its most productive use is best described as:", "opts": ["allocationally efficient.", "operationally efficient.", "informationally efficient."], "ans": "A", "expl": "Markets are said to be allocationally efficient when capital is directed to its most\nproductive uses. Operationally efficient markets are those that have low trading costs.\nInformationally efficient markets are those in which security prices reflect all information\nassociated with fundamental value in a timely fashion.\n(Module 39.3, LOS 39.k)"}, {"n": 5, "q": "A primary market transaction involves:", "opts": ["the sale of new securities to investors.", "investment-grade bonds or preferred stocks.", "direct trading of securities between institutional investors."], "ans": "A", "expl": "A primary market is a market for new issues of securities.\n(Module 39.3, LOS 39.i)"}, {"n": 6, "q": "Byron Campbell purchased 300 shares of Crescent, Inc., stock at a price of $80 per share.\nThe purchase was made on margin with an initial margin requirement of 50%. Assuming the\nmaintenance margin is 25%, the stock price of Crescent, Inc. has to fall below what level for\nCampbell to receive a margin call?", "opts": ["$20.00.", "$40.00.", "$53.33."], "ans": "C", "expl": "Trigger price (margin purchases) = P (1 – initial margin) / (1 – maintenance margin).\no\n$80(1 - .5) / (1 - .25) = 40 / .75 = $53.33.\nP = $53.33\nIf Crescent, Inc. falls below $53.33 then Campbell will get a margin call.\n(Module 39.2, LOS 39.f)"}, {"n": 7, "q": "Mark Ritchie purchased, on margin, 200 shares of TMX Corp. stock at a price of $35 per\nshare. The margin requirement was 50%. The stock price has increased to $42 per share.\nWhat is Ritchie's return on investment before commissions and interest if he decides to sell\nhis TMX holdings now?", "opts": ["40%.", "20%.", "10%."], "ans": "A", "expl": "200 shares × $35 = $7000 Initial Market Value\n$7000 × .50 = $3500 cash payment and $3500 borrowed.\nThe new market value of the stock after price increase is (200 × $42) = $8400. If Ritchie\nsold his holdings he would have $4900 ($8400 – $3500) left after the loan was paid. So\nRitchie's return on his original $3500 investment is:\n$4900/3500 – 1 = 1.4 – 1.0 = 0.40 = 40%.\n(Module 39.2, LOS 39.f)"}, {"n": 8, "q": "Compared to a market order to sell, a limit order to sell will specify:", "opts": ["a maximum price above the current market price.", "a price that can be higher or lower than the current market price.", "a minimum price equal to or less than the current market price."], "ans": "B", "expl": "Price limits on buy or sell orders can be above, at, or below the current market price.\n(Module 39.3, LOS 39.h)"}, {"n": 9, "q": "Markets for financial assets with maturities of one year or less are best characterized as:", "opts": ["primary markets.", "money markets.", "forward markets."], "ans": "B", "expl": "\"Money markets\" generally refers to markets for debt securities maturing in one year or\nless. Forward markets refer to contracts for the future exchange of an asset at a price\nestablished today. Primary markets are the markets for newly issued securities.\n(Module 39.1, LOS 39.b)"}, {"n": 10, "q": "A buy limit order is said to be \"inside the market\" when:", "opts": ["the limit is between the best bid and the best ask.", "the order can be executed.", "the order is entered in the limit book."], "ans": "A", "expl": "A limit order with a limit price between the best bid and the best ask is said to be \"inside\nthe market\" or \"making a new market.\" A limit order that has not yet been executed is a\n\"standing limit order.\"\n(Module 39.3, LOS 39.h)"}, {"n": 11, "q": "Which of the following statements regarding primary and secondary markets is least\naccurate?", "opts": ["New issues of government securities can be sold on the primary market.", "Prevailing market prices are determined by primary market transactions and are used in pricing new issues.", "Secondary market transactions occur between two investors and do not involve the firm that originally issued the security."], "ans": "B", "expl": "Prevailing market prices are determined by the transactions that take place on the\nsecondary market. This information is used to determine the price of new issues sold on\nprimary markets.\n(Module 39.3, LOS 39.i)"}, {"n": 12, "q": "Shares in a publicly traded company that owns gold mines and mining operations are\nconsidered:", "opts": ["financial assets.", "physical assets.", "real assets."], "ans": "A", "expl": "Financial assets, such as shares of stock in a company, are claims against physical or real\nassets.\n(Module 39.1, LOS 39.c)"}, {"n": 13, "q": "The main functions of the financial system least likely include:", "opts": ["allocating financial resources to their most productive uses.", "bringing together savers and borrowers.", "preventing investors from generating abnormal profits by trading on information."], "ans": "C", "expl": "One of the purposes of the financial system is to allow investors to trade on (public)\ninformation. Other purposes of the financial system include allocating financial capital to\nits most productive uses, and bringing together those who wish to save with those who\nwish to borrow.\n(Module 39.1, LOS 39.a)"}, {"n": 14, "q": "Which of the following statements about financial intermediaries is most accurate?", "opts": ["Arbitrageurs buy securities with the anticipation that they will be able to sell the securities in the future at higher prices.", "Brokers seek out traders that are willing to take the opposite sides of their clients’ orders.", "Dealers buy a security in one market and simultaneously sell the same security in a different market."], "ans": "B", "expl": "Brokers seek out traders that are willing to take the opposite side of their clients' orders.\nArbitrageurs buy an instrument in one market and simultaneously sell the same\ninstrument in a different market at a higher price. Dealers buy securities from clients, with\nthe expectation that they will be able to sell the securities to other clients in the future at\nhigher prices.\n(Module 39.1, LOS 39.d)"}, {"n": 15, "q": "An objective of financial market regulation is to:", "opts": ["ensure that inside information is made public in a timely manner.", "prevent uninformed investors from participating in financial markets.", "reduce information gathering costs by requiring common financial reporting standards."], "ans": "C", "expl": "One of the objectives of market regulation is to require firms to report their financial\nperformance according to a single set of standards, such as those of the IASB or FASB,\nthereby reducing market participants' cost of gathering information. Market regulation is\nnot designed to prevent uninformed investors from trading, but to protect unsophisticated\ninvestors and thereby preserve trust in the financial markets. An objective of market\nregulation is to prevent those with non-public information from profiting at the expense of\nother investors, but not necessarily to make all inside information public.\n(Module 39.3, LOS 39.l)"}, {"n": 16, "q": "In contrast with a typical forward contract, futures contracts have:", "opts": ["greater counterparty risk.", "standardized terms.", "less liquidity."], "ans": "B", "expl": "Futures are forward contracts that trade on exchanges and have standardized terms, in\ncontrast with forward contracts, which are customized instruments. A futures\nclearinghouse reduces counterparty risk by guaranteeing the performance of buyers and\nsellers. Futures contracts trade on organized exchanges and are more liquid than forward\ncontracts.\n(Module 39.1, LOS 39.c)"}, {"n": 17, "q": "Which of the following statements about selling a stock short is least likely accurate?", "opts": ["The seller must return the securities at the request of the lender.", "The seller must inform their broker that the order is a short sale before completing the transaction.", "The short seller may withdraw the proceeds of the short sale."], "ans": "C", "expl": "Proceeds from the short sale must remain in the brokerage account along with the\nrequired margin deposit.\n(Module 39.2, LOS 39.e)"}, {"n": 18, "q": "Which of the following statements about the maintenance margin requirement is least\naccurate?", "opts": ["Generally the maintenance margin requirement is lower than the initial margin requirement.", "The Federal Reserve sets the maximum maintenance margin.", "The purpose of the maintenance margin requirement is to protect the broker in the event of a large stock decline."], "ans": "B", "expl": "The Federal Reserve sets the minimum maintenance margin and individual investment\ncompanies may set higher margins if they wish.\n(Module 39.2, LOS 39.f)"}, {"n": 19, "q": "Lynne Hampton purchased 100 shares of $75 stock on margin. The margin requirement set\nby the Federal Reserve Board was 40%, but Hampton's brokerage firm requires a total\nmargin of 50%. Currently the stock is selling at $62 per share. What is Hampton's return on\ninvestment before commission and interest if she sells the stock now?", "opts": ["-17%.", "-35%.", "-40%."], "ans": "B", "expl": "Hampton originally purchased 100 shares at $75 for a total value of $7500. Half of the\nvalue ($3750) was borrowed and Hampton paid cash for the other half. The current total\nmarket value of the stock is $6200. If Hampton sells her holdings she will have $2450 left\nafter she pays off the loan. Hampton's return on her original investment is:\n$2450/3750 – 1 = 0.65 – 1 = -0.35 = -35%.\n(Module 39.2, LOS 39.f)"}, {"n": 20, "q": "Using the following assumptions, calculate the rate of return on a margin transaction for an\ninvestor who purchases the stock and the stock price at which the investor would have\nreceived a margin call.\nMarket Price Per Share: $32\nNumber of Shares Purchased: 1,000\nHolding Period: 1 year\nEnding Share Price: $34\nInitial Margin Requirement: 40%\nMaintenance margin: 25%\nTransaction and borrowing costs: $0\nThe company pays no dividends\nMargin ReturnMargin Call Price", "opts": ["6.3%$25.60", "15.6%$25.60", "15.6%$17.07"], "ans": "B", "expl": "Part 1: Calculate Margin Return:\nMargin Return %\n= [((Ending Value – Loan Payoff) / Beginning Equity Position) – 1] × 100\n= [(([$34 × 1,000] – [$32 × 1,000 × 0.60]) / ($32 × 0.40 × 1,000)) – 1] × 100\n= 15.6%\nAlternative (Check): Calculate the all cash return and multiply by the margin leverage\nfactor.\n[(34,000 – 32,000) / 32,000] × [1 / 0.40] = 6.35% × 2.5 = 15.6%\nPart 2: Calculate Margin Call Price:\nThe formula for the margin call price is:\nMargin Call = (original price) × (1 - initial margin) / (1 - maintenance margin)\n= $32 × (1 - 0.40) / (1 - 0.25) = approximately $25.60\n(Module 39.2, LOS 39.f)", "qhtml": "<p>Using the following assumptions, calculate the rate of return on a margin transaction for an investor who purchases the stock and the stock price at which the investor would have received a margin call.</p><table class=\"qtable\"><thead><tr><th>Item</th><th>Value</th></tr></thead><tbody><tr><td>Market Price Per Share</td><td>$32</td></tr><tr><td>Number of Shares Purchased</td><td>1,000</td></tr><tr><td>Holding Period</td><td>1 year</td></tr><tr><td>Ending Share Price</td><td>$34</td></tr><tr><td>Initial Margin Requirement</td><td>40%</td></tr><tr><td>Maintenance margin</td><td>25%</td></tr><tr><td>Transaction and borrowing costs</td><td>$0</td></tr><tr><td>Dividends</td><td>None</td></tr></tbody></table><p><em>Options show → <strong>Margin Return</strong> | <strong>Margin Call Price</strong></em></p>"}, {"n": 21, "q": "Which of the following assets are best characterized as contracts?", "opts": ["Commercial paper.", "Currency swaps.", "Depository receipts."], "ans": "B", "expl": "Contracts include forwards, futures, options, swaps, and insurance contracts. Commercial\npaper is a debt security. Depository receipts are shares in a pooled investment vehicle,\nsuch as a mutual fund or an exchange-traded fund.\n(Module 39.1, LOS 39.c)"}, {"n": 22, "q": "Which of the following statements about securities exchanges is NOT correct?", "opts": ["In call markets, there is only one negotiated price set to clear the market for a given stock.", "In continuous markets, prices are set only by the auction process.", "Securities exchanges may be structured as call markets or continuous markets."], "ans": "B", "expl": "In continuous markets, the price is set by either the auction process or by dealer bid-ask\nquotes.\n(Module 39.3, LOS 39.j)"}, {"n": 23, "q": "Which of the following orders is said to be \"behind the market\"?", "opts": ["Market sell order when the best bid is 38 and the best ask is 39.", "Limit sell order at 38 when the best ask is 39.", "Limit buy order at 38 when the best bid is 39."], "ans": "C", "expl": "A limit buy order is behind the market if its limit price is below the best bid. A limit sell\norder is behind the market if its limit price is above the best ask. Market orders are never\nsaid to be behind the market.\n(Module 39.3, LOS 39.h)"}, {"n": 24, "q": "An electronic crossing network is best described as:", "opts": ["a price-driven market.", "a quote-driven market.", "an order-driven market."], "ans": "C", "expl": "A crossing network is an example of an order-driven market. Orders are batched together\nand crossed (matched) at specific times during the trading day at prices based on those of\nanother exchange. Price-driven markets and quote-driven markets are other terms for\ndealer or over-the-counter markets.\n(Module 39.3, LOS 39.j)"}, {"n": 25, "q": "Which of the following statements about short sales is least accurate?", "opts": ["The short seller is required to replace the borrowed securities within six months of a short sale.", "The short seller must pay the lender of the stock any dividends paid by the company.", "Proceeds from short sales cannot be withdrawn from the account."], "ans": "A", "expl": "There is no maximum time for which a security can be borrowed. It must be returned\nwhenever the lender requires it to be.\n(Module 39.2, LOS 39.e)"}, {"n": 26, "q": "A trader pays $100 per share to buy 500 shares of a non-dividend-paying firm. The purchase\nis done on margin, and the leverage ratio at purchase is 3.0X. Three months later, the trader\nsells the shares for $90 per share. Ignoring transaction costs and interest paid on the margin\nloan, the trader's 3-month return was closest to:", "opts": ["–30%.", "–10%.", "–40%."], "ans": "A", "expl": "With a leverage ratio of 3 and a 10% decrease in share value, the investor's return is 3 × –\n10% = –30%.\n(Module 39.2, LOS 39.f)"}, {"n": 27, "q": "An investor buys 400 shares of a stock on margin for $25 a share. The initial margin\nrequirement is 50%, and the maintenance margin requirement is 25%. At what price would\nthe investor receive a margin call?", "opts": ["$21.88.", "$16.67.", "$6.25."], "ans": "B", "expl": "Margin call trigger price = $25 × [(1 – 0.5)] / (1 – 0.25)] = $16.67.\n(Module 39.2, LOS 39.f)"}, {"n": 28, "q": "An order placed to protect a short position is called a:", "opts": ["protective call.", "stop loss buy.", "stop loss sell."], "ans": "B", "expl": "A short position profits from declines in stock price and experiences losses as the price\nrises. A stop loss buy is a limit order that is placed above the market price. When the stock\nprice reaches the stop price, the limit order is executed curtailing further loses.\n(Module 39.3, LOS 39.g)"}, {"n": 29, "q": "An investor sold a stock short and is worried about rising prices. To protect himself from\nrising prices he would place a:", "opts": ["limit order to buy.", "stop order to buy.", "stop order to sell."], "ans": "B", "expl": "A limit order to buy is placed below the current market price.\nA limit order to sell is placed above the current market price.\nA stop (loss) order to buy is placed above the current market price.\nA stop (loss) order to sell is placed below the current market price.\nA stop order becomes a market order if the price is hit.\n(Module 39.3, LOS 39.g)"}, {"n": 30, "q": "A securities exchange where traders buy and sell long-term government bonds from and to\nother traders would best be described as part of the:", "opts": ["capital market.", "money market.", "primary market."], "ans": "A", "expl": "The exchange can be described as part of the secondary capital markets. A security is first\nissued in the primary market, and then it trades among investors in the secondary market.\nThe money market refers to the market for short-term debt instruments (usually with\nmaturities of less than one year) such as T-bills.\n(Module 39.1, LOS 39.b)"}, {"n": 31, "q": "An order to sell a security at the best price available is a:", "opts": ["market order.", "limit order.", "stop order."], "ans": "A", "expl": "A market order is an order to buy or sell a security immediately at the best available price.\nA limit order is an order to buy at the specified limit price or lower, or to sell at the limit\nprice or higher. A stop order is an order to buy if the market price increases to the\nspecified stop price, or to sell if the market price decreases to the stop price.\n(Module 39.3, LOS 39.h)"}, {"n": 32, "q": "An investor buys 200 shares of ABC at the market price of $100 on full margin. The initial\nmargin requirement is 40% and the maintenance margin requirement is 25%.\nIf the shares of stock later sold for $200 per share, what is the rate of return on the margin\ntransaction?", "opts": ["100%.", "250%.", "400%."], "ans": "B", "expl": "One quick (and less than intensive) way to calculate the answer to this on the examination\n(and it is very important to save time on the examination) is to first calculate the return if\nall cash, then calculate the margin leverage factor and then finally, multiply the leverage\nfactor times the all cash return to obtain the margin return.\nCalculations:\nStep 1: Calculate All Cash Return:\nCash Return % = [(Ending Value / Beginning Equity Position) – 1] × 100\n= [(($200 × 200) / ($100 × 200)) – 1] × 100 = 100%\nStep 2: Calculate Leverage Factor:\nLeverage Factor = 1 / Initial Margin % = 1 / 0.40 = 2.50\nStep 3: Calculate Margin Return:\nMargin Transaction Return = All cash return × Leverage Factor = 100% × 2.50 =\n250%\nNote: You can verify the margin return as follows:\nMargin Return % = [((Ending Value – Loan Payoff) / Beginning Equity Position) – 1]\n× 100\n= [(([$200 × 200] – [$100 × 200 × 0.60]) / ($100 × 0.40 × 200)) – 1] × 100\n= [((40,000 – 12,000) / 8,000) – 1] × 100 = 250%\n(Module 39.2, LOS 39.f)"}, {"n": 33, "q": "Which of the following option positions is said to be a long position?", "opts": ["Writer of a put option.", "Writer of a call option.", "Buyer of a put option."], "ans": "C", "expl": "The buyer of an option (either a call or put) is said to be long the option and the writer of\nan option is said to be short the option. Note that with put options, the long (put option\nholder) benefits when the price of the underlying asset decreases, while the short (put\noption writer) benefits when the price of the underlying asset increases. We say that a put\nbuyer is long the option but has short exposure to the underlying asset price.\n(Module 39.2, LOS 39.e)"}, {"n": 34, "q": "A trader enters a limit order to buy 10,000 shares as a day order. The \"day order\" instruction\nis most accurately referred to as:", "opts": ["a validity instruction.", "a clearing instruction.", "an execution instruction."], "ans": "A", "expl": "Validity instructions specify when a trade is to be executed. Specification of a day order (as\nopposed to a good-til-canceled order) is a validity instruction. (Module 39.3, LOS 39.g)"}, {"n": 35, "q": "Which of the following limit orders is least likely to be filled?", "opts": ["Aggressively priced limit buy order.", "Behind-the-market limit buy order.", "Inside-the-market limit sell order."], "ans": "B", "expl": "\"Behind the market\" refers to a buy order with a limit price less than the best bid, or a sell\norder with a limit price higher than the best ask. A limit order that is behind the market\n(i.e., an order to buy for less than the market price or sell for more than the market price)\nwill not be filled unless the market price moves to the order's limit price. \"Inside the\nmarket\" refers to orders with limit prices between the best bid and best ask. \"Aggressively\npriced\" refers to a buy order with limit prices higher than the best ask or a sell order with\na limit price lower than the best bid. Aggressively priced limit orders are most likely to be\nfilled immediately.\n(Module 39.3, LOS 39.h)"}, {"n": 36, "q": "An investor purchases 100 shares of Lloyd Computer at $26 a share. The initial margin\nrequirement is 50%, and the maintenance margin requirement is 25%. The price below\nwhich the investor would receive a margin call is closest to:", "opts": ["17.33.", "15.25.", "19.45."], "ans": "A", "expl": "26 × (1 - 0.5)/(1 - 0.25) = $17.33.\n(Module 39.2, LOS 39.f)"}, {"n": 37, "q": "Which of the following is least likely a characteristic of a well-functioning market?", "opts": ["Prices adjust quickly when new information becomes available.", "Prices change significantly from one transaction to the next.", "Reliable information is available on price and volume."], "ans": "B", "expl": "In a well-functioning market, prices should not typically change much from one transaction\nto the next because many buyers and sellers are willing to trade at prices near the current\nprice. Characteristics of a well-functioning market include availability of reliable\ninformation on prices and transaction volume; liquidity (marketability and price\ncontinuity); prices that react quickly to new information; and low transactions costs.\n(Module 39.3, LOS 39.k)"}, {"n": 38, "q": "Stop loss sell orders are:", "opts": ["executed on an uptick only.", "placed to protect a short position.", "placed to protect the gains on a long position."], "ans": "C", "expl": "Stop loss sell orders are limit sell orders that are placed below market price. When the\nshare price drops to the designated price, a sell order is executed protecting the investor\nfrom further declines.\n(Module 39.3, LOS 39.g)"}, {"n": 39, "q": "A stock's limit order book is as follows:\nBid SizeLimit Price (£)Offer Size\n70025.25\n30025.30\n10025.40\n25.50500\n25.55200\n25.75500\nA new sell limit order is placed for 250 shares at £25.45. This limit order is said to be:", "opts": ["an iceberg order.", "behind the market.", "making a new market."], "ans": "C", "expl": "The order being placed is between the best bid and best ask. It makes a new market with\nthe new bid-ask of £25.40 – £25.45.\n(Module 39.3, LOS 39.h)", "qhtml": "<p>A stock's limit order book is as follows:</p><table class=\"qtable\"><thead><tr><th>Bid Size</th><th>Limit Price (£)</th><th>Offer Size</th></tr></thead><tbody><tr><td>700</td><td>25.25</td><td></td></tr><tr><td>300</td><td>25.30</td><td></td></tr><tr><td>100</td><td>25.40</td><td></td></tr><tr><td></td><td>25.50</td><td>500</td></tr><tr><td></td><td>25.55</td><td>200</td></tr><tr><td></td><td>25.75</td><td>500</td></tr></tbody></table><p>A new sell limit order is placed for 250 shares at £25.45. This limit order is said to be:</p>"}, {"n": 40, "q": "Which of the following statements about primary and secondary markets is least accurate?", "opts": ["The proceeds from a sale in the secondary market go to the issuer.", "A primary market is a market in which new securities are sold.", "The primary market benefits from the liquidity provided by the secondary market."], "ans": "A", "expl": "Proceeds in a primary market go to the issuing firm. Proceeds from a sale in the secondary\nmarket go to the current owner who is selling the securities.\n(Module 39.3, LOS 39.i)"}, {"n": 41, "q": "A trading system that matches buyers and sellers based on price and time precedence is\nmost likely a(n):", "opts": ["quote-driven market.", "order-driven market.", "brokered market."], "ans": "B", "expl": "In an order-driven market, buy orders and sell orders are matched up by the exchange\naccording to order matching rules. In a quote-driven market, customers trade with dealers\nat bid and ask prices set by the dealers. In a brokered market, brokers organize trades\namong their clients.\n(Module 39.3, LOS 39.j)"}, {"n": 42, "q": "The prospectus for the Horizon Fund states that it invests only in real assets. Which of the\nfollowing would the Horizon Fund most likely include in its portfolio?", "opts": ["Common stock of a technology company.", "Foreign currencies.", "An apartment complex."], "ans": "C", "expl": "Real assets are assets with a physical presence such as real estate or equipment and\nmachinery. An investment in an apartment complex is a real estate investment and\ntherefore would be considered a real asset.\n(Module 39.1, LOS 39.b)"}, {"n": 43, "q": "Which of the following statements about securities exchanges is most accurate?", "opts": ["Call markets are markets in which the stock is only traded at specific times.", "Continuous markets are markets where trades occur 24 hours per day.", "Setting a negotiated price to clear the market is a method used to set the closing price in major continuous markets."], "ans": "A", "expl": "Continuous markets are markets where trades occur at any time the market is open (i.e.,\nthey do not need to be open 24 hours per day). Setting one negotiated price is a method\nused in major continuous markets to set the opening price.\n(Module 39.3, LOS 39.j)"}, {"n": 44, "q": "Which of the following is most likely an objective of market regulation?", "opts": ["Preserve trust in financial markets.", "Limit downside risk to investors.", "Educate unsophisticated investors."], "ans": "A", "expl": "Rules against insider trading and enforcement of laws regarding fraud and theft by\ncorporate managers are intended to preserve trust in the markets of public investors.\nWhile clear and honest disclosure and fraud prevention are goals, limiting the downside\nrisk of equities markets is not a likely objective of financial regulation. Neither is the\neducation of unsophisticated investors.\n(Module 39.3, LOS 39.l)"}, {"n": 45, "q": "Peg Fisk, CFA, states that two of the objectives of market regulation which CFA Institute\nattempts to address are minimum standards of competence among investment\nprofessionals and ease of performance evaluation for investors. Fisk is accurate with regard\nto:", "opts": ["both of these objectives.", "neither of these objectives.", "only one of these objectives."], "ans": "A", "expl": "CFA Institute attempts to address both of these objectives of market regulation. The CFA\nProgram is part of the effort to encourage minimum standards of competency among\nfinance professionals. Global Investment Performance Standards are part of the effort to\nmake performance evaluation easier for investors.\n(Module 39.3, LOS 39.l)"}, {"n": 46, "q": "With respect to a well-functioning securities market, a market that exhibits operational\nefficiency will have:", "opts": ["price continuity.", "low transaction costs.", "rapid price reactions to new information."], "ans": "B", "expl": "An operationally efficient market is a market in which the cost of each transaction is\nminimal. Informational efficiency means prices in the market reflect all information\ncurrently available to participants. Price continuity means that prices do not adjust much\nfrom one transaction to the next unless new information about firm value becomes\navailable.\n(Module 39.3, LOS 39.k)"}, {"n": 47, "q": "Which of the following conditions is most likely necessary for capital to be allocated to its\nmost valuable uses?", "opts": ["Financial markets are frictionless (i.e., free of taxes or transactions costs).", "Investors are well informed about the risk and return of various investments.", "There are no barriers to the flow of complete information to the financial markets."], "ans": "B", "expl": "Capital will flow to its most valuable uses if markets function well and investors are well\ninformed about the risk and return characteristics of various investments. Allocation of\ncapital to its most valuable uses does not require that all investors have complete\ninformation or that financial markets are frictionless.\n(Module 39.1, LOS 39.a)"}, {"n": 48, "q": "Sonia Fennell purchases 1,000 shares of Xpressoh Inc. for $35 per share. One year later, she\nsells the stock for $42 per share. Xpressoh Inc. pays no dividends. The initial margin\nrequirement is 50%. Fennell's one-year return assuming an all-cash transaction, and if she\nbuys on margin (assume she pays no transaction or borrowing costs and has not had to post\nadditional margin), are closest to:\nAll-cash50% margin", "opts": ["20%40%", "40%80%", "20%80%"], "ans": "A", "expl": "All-cash return = 42/35 – 1 = 20%\nMargin return = (42 – 35)/[(35)(0.5)] = 40%\n(Module 39.2, LOS 39.f)"}, {"n": 49, "q": "An investor buys 200 shares of ABC at the market price of $100 and posts the required initial\nmargin of $8,000. The maintenance margin requirement is 25%.\nAt what share price will the investor's account balance be reduced to the maintenance\nmargin level?", "opts": ["$48.", "$112.", "$80."], "ans": "C", "expl": "The initial margin requirement is $8,000 / (200 × $100) = 0.40. In a long stock position, the\nequation to determine the margin call price is:\nlong = [(original price)(1 – initial margin %)] / [1 – maintenance margin %]\n= $100(1 – 0.4) / (1 – 0.25) = $80\nAlternatively, the margin loan is (200 × $100) – $8,000 = $12,000. The minimum value of\nthe long position that meets the maintenance margin requirement is $12,000 / (1 – 0.25) =\n$16,000. The share price at which the long position has this value is $16,000 / 200 = $80.\n(Module 39.2, LOS 39.f)"}, {"n": 50, "q": "An investor purchases 200 shares of Rubble, Inc. on margin. The shares are trading at $40.\nInitial and maintenance margins are 50% and 25%. If the company pays a dividend of $0.75\nand the investor sells the stock at year-end for $50 per share, the return on the investment\nwould be closest to:", "opts": ["15.75%.", "39.55%.", "53.75%."], "ans": "C", "expl": "Dividend income = 0.75 × 200 = $150\nProfit = 10,000 – 8,000 + 150 = 2,150\nReturn = 2,150 / 4,000 = 53.75%\n(Module 39.2, LOS 39.f)"}, {"n": 51, "q": "Which of the following statements regarding margin accounts is most accurate?", "opts": ["Maintenance margin refers to the amount of funds the investor can borrow.", "Margin accounts can be used to purchase securities by borrowing part of the purchase price.", "The total equity in the margin account cannot fall below the initial margin requirement."], "ans": "B", "expl": "Margin accounts are brokerage accounts that allow investors to borrow part of the\npurchase price from the broker.\n(Module 39.2, LOS 39.f)"}, {"n": 52, "q": "An investor purchases 200 shares of Mertz, Inc. on margin. The shares are trading at $40.\nInitial and maintenance margins are 50% and 25%. If the investor sells the stock when the\nprice rises to $50 at year-end, the return on the investment would be closest to:", "opts": ["25%.", "20%.", "50%."], "ans": "C", "expl": "Profit = 10,000 – 8,000 = 2,000\nReturn = 2,000 / 4,000 = 50%\n(Module 39.2, LOS 39.f)"}, {"n": 53, "q": "Austin Bruno, CFA, places a fill or kill, limit buy order at 92 for a stock. Bruno's order\nspecifies:", "opts": ["clearing and validity instructions.", "validity and execution instructions.", "execution and clearing instructions."], "ans": "B", "expl": "Fill or kill is a validity instruction as it indicates when the order can be filled (i.e.\nimmediately or cancel the order). A limit buy order is an execution instruction as it\nindicates how the order should be filled (e.g. buy at $92 or less). Clearing instructions\nindicate how to settle the trade (i.e., how and when to transfer the cash and the security).\n(Module 39.3, LOS 39.g)"}, {"n": 54, "q": "An investor bought a stock on margin. The margin requirement was 60%, the current price of\nthe stock is $80, and the stock price was $50 one year ago. If margin interest is 5%, how\nmuch equity did the investor have in the investment at year-end?", "opts": ["67.7%.", "60.6%.", "73.8%."], "ans": "C", "expl": "Margin debt = 40% × $50 = $20; Interest = $20 × 0.05 = $1.\nEquity % = [Value – (margin debt + interest)] / Value\n$80 - $21 / $80 = 73.8%\n(Module 39.2, LOS 39.f)"}, {"n": 55, "q": "The main functions of the financial system most likely include:", "opts": ["allocating capital to its most productive uses and determining the supply of money.", "determining equilibrium interest rates and allocating capital to its most productive uses.", "determining the supply of money and determining equilibrium interest rates."], "ans": "B", "expl": "The main functions of the financial system are to allow individuals and organizations to\nsave, borrow, raise capital, and manage risks; to determine equilibrium rates of return\nthat equate the amounts of lending and borrowing; and to allocate capital to its most\nproductive uses. The money supply is typically controlled by countries' central banks.\n(Module 39.1, LOS 39.a)"}, {"n": 56, "q": "Which of the following statements regarding secondary markets is least accurate? Secondary\nmarkets are important because they provide:", "opts": ["investors with liquidity.", "regulators with information about market participants.", "firms with greater access to external capital."], "ans": "B", "expl": "Secondary markets are important because they provide liquidity and continuous\ninformation to investors. The liquidity of the secondary markets adds value to both the\ninvestor and firm because more investors are willing to buy issues in the primary market,\nwhen they know these issues will later become liquid in the secondary market. Therefore,\nthe secondary market makes it easier for firms to raise external capital.\n(Module 39.3, LOS 39.i)"}, {"n": 57, "q": "An investor sells a stock short. To protect against a large loss on this position, the investor is\nmost likely to:", "opts": ["place a stop buy order.", "buy a put option.", "set a limit price on the order to sell short."], "ans": "A", "expl": "A stop buy order above the current market price would execute if the market price\nincreased to the specified stop price. This would limit the short seller's losses if the stock\nprice increased.\nBuying a put option would increase the investor's short exposure to the stock price.\nSetting a limit price on the order to sell short would affect the price at which the short sale\ncould execute, but it would not limit the short seller's potential losses.\n(Module 39.2, LOS 39.e)"}, {"n": 58, "q": "A unique item such as fine art is most likely to be exchanged in a(n):", "opts": ["brokered market.", "order-driven market.", "quote-driven market."], "ans": "A", "expl": "Brokered markets are typically the best market structure for unique items. A broker adds\nvalue by locating a counterparty to take the opposite side of a trade of such an item.\n(Module 39.3, LOS 39.j)"}, {"n": 59, "q": "Regarding the technical points affecting the short sales of a stock, which of the following\nstatements is most accurate?", "opts": ["Stocks can only be shorted in a down market.", "The lender must deposit margin to guarantee the eventual return of the stock.", "The short seller must pay all dividends due to the lender of the shorted stock."], "ans": "C", "expl": "The short seller must pay any dividends on the stock to the owner of the borrowed shares.\nThe short seller must also deposit margin money to guarantee the eventual repurchase of\nthe security.\n(Module 39.2, LOS 39.e)"}, {"n": 60, "q": "An investor buys 1,000 shares of a non-dividend-paying stock for $18. The initial margin\nrequirement is 40% and the maintenance margin is 30%. After one year the investor sells the\nstock for $24 per share. The investor's rate of return on this investment (ignoring borrowing\nand transactions costs and taxes), and the price at which the investor would receive a\nmargin call, are closest to:\nRate of returnMargin call", "opts": ["33%$15.43", "83%$21.00", "83%$15.43"], "ans": "C", "expl": "To obtain the result:\nPart 1: Calculate Margin Return:\nMargin Return % = [((Ending Value  - Loan Payoff) / Beginning Equity Position) – 1] * 100 =\n= [(([$24 × 1,000] – [$18 × 1,000 × 0.60]) /  ($18 × 0.40 × 1,000)) – 1] × 100 =\n= 83.33%\nAlternative (Check):\nCalculate the all cash return and multiply by the margin leverage factor.\n= [(24,000 – 18,000)/18,000] × [1 / 0.40] = 33.33% × 2.5 = 83.33%\nPart 2: Calculate Margin Call Price:\nSince the investor is long (purchased the stock), the formula for the margin call price is:\nMargin Call = (original price) × (1 – initial margin) / (1 – maintenance margin)\n= $18 × (1 – 0.40) / (1 – 0.30) = $15.43\n(Module 39.2, LOS 39.f)", "qhtml": "<p>An investor buys 1,000 shares of a non-dividend-paying stock for $18. The initial margin requirement is 40% and the maintenance margin is 30%. After one year the investor sells the stock for $24 per share. The investor's rate of return on this investment (ignoring borrowing and transactions costs and taxes), and the price at which the investor would receive a margin call, are closest to:</p><p><em>Options show → <strong>Rate of Return</strong> | <strong>Margin Call</strong></em></p>"}, {"n": 61, "q": "A financial system in which transactions have low costs is said to exhibit:", "opts": ["allocational efficiency.", "informational efficiency.", "operational efficiency."], "ans": "C", "expl": "Operational efficiency refers to low transactions costs. A financial system exhibits\ninformational efficiency if prices quickly reflect all information relevant to fundamental\nvalue. A market exhibits allocational efficiency if it results in capital being directed to its\nmost productive uses.\n(Module 39.3, LOS 39.k)"}, {"n": 62, "q": "Which of the following statements about securities markets is least accurate?", "opts": ["Characteristics of a well-functioning securities market include: many buyers and sellers, low bid-ask spreads, timely information on price and volume of past transactions, and accurate information on supply and demand.", "Secondary markets, such as the over-the-counter (OTC) market, provide liquidity and price continuity.", "A limit buy order and a stop buy order are both placed below the current market price."], "ans": "C", "expl": "A limit buy is placed below the current market price, but a stop buy order is placed above\nthe current market price (stop buy orders are often placed to protect a short sale from a\nrising market).\nThe other choices are true. A well-functioning securities market includes the following\ncharacteristics:\ntimely and accurate information on price and volume of past transactions.\ntimely and accurate information on the supply and demand for current transactions.\nliquidity (as indicated by low bid-ask spreads).\nmarketability.\nprice continuity.\ndepth (many buyers and sellers).\noperational efficiency (low transaction costs).\ninformational efficiency (rapidly adjusting prices).\n(Module 39.3, LOS 39.h)"}, {"n": 63, "q": "When using margin to invest in equities, which of the following defines initial margin and\nwhat level will the margin be brought back to in the event of a margin call?\nInitial MarginMargin Call Action", "opts": ["a deposit must be made to amount of borrowed funds in bring the margin back to the the transactions maintenance margin", "a deposit must be made to minimum amount of equity bring the margin back to the required of the investor maintenance margin", "a deposit must be made to minimum amount of equity bring the margin back to the required of the investor initial margin"], "ans": "B", "expl": "The initial margin requirement refers to the minimum amount of equity required of the\ninvestor.\nWith equities, if the margin falls below the maintenance margin, funds must be deposited\nto bring it back up to the maintenance margin level.\n(Module 39.2, LOS 39.f)", "qhtml": "<p>When using margin to invest in equities, which of the following defines initial margin and what level will the margin be brought back to in the event of a margin call?</p><p><em>Options show → <strong>Initial Margin</strong> | <strong>Margin Call Action</strong></em></p>"}, {"n": 64, "q": "An investor purchases stock on 25% initial margin, posting $10 of the original stock price of\n$40 as equity. The position has a required maintenance margin of 20%. The investor later\nsells the stock for $45. Ignoring transaction costs and margin loan interest, which of the\nfollowing statements is most accurate?", "opts": ["Leverage ratio is 3:1.", "Margin call price is $36.", "Return on investment is 50%."], "ans": "C", "expl": "Return on invested equity is ($45 – $40) / $10 = 50%.\nThe leverage ratio is purchase price / equity = $40 / $10 = 4.\nMargin call price is $40 × [(1 – 0.25) / (1 – 0.20)] = $37.50.\n(Module 39.2, LOS 39.f)"}, {"n": 65, "q": "If an investor buys 100 shares of a $50 stock on margin when the initial margin requirement\nis 40%, how much money must she borrow from her broker?", "opts": ["$2,000.", "$3,000.", "$4,000."], "ans": "B", "expl": "An initial margin requirement of 40% would mean that the investor must put up 40% of\nthe funds and brokerage firm may lend the 60% balance. Therefore, for this example (100\nshares) * ($50) = $5,000 total cost. $5,000 * 0.60 = $3,000.\n(Module 39.2, LOS 39.f)"}, {"n": 66, "q": "A short seller:", "opts": ["does not receive the dividends.", "loses if the price of the stock sold short decreases.", "often also places a stop loss sell order."], "ans": "A", "expl": "The short seller pays all dividends to the lender, loses if stock prices rise, and is required\nto post a margin account. A short seller often places a stop buy order to protect the short\nsale position from a rising market.\n(Module 39.2, LOS 39.e)"}, {"n": 67, "q": "Jerry Slotz enters an exchange-traded contract that obligates him to purchase a specific\namount of an asset on a future date. The contract is most likely:", "opts": ["a forward contract.", "a futures contract.", "an option contract."], "ans": "B", "expl": "Futures contracts are standardized contracts traded on an exchange that obligate one\nparty to purchase and one party to sell a specific amount of an asset at a specified price\non a specified future date. Forward contracts are similar to futures contracts but are\ncustomizable (i.e., not standardized) and traded over-the-counter (i.e., not exchange-\ntraded). Call options can be traded on an exchange; however, they give the holder the\nright, not the obligation, to purchase the asset at a future date.\n(Module 39.1, LOS 39.a)"}, {"n": 68, "q": "Among the classifications of investment assets, \"real assets\" most likely include:", "opts": ["industrial stocks.", "foreign currencies.", "durable equipment."], "ans": "C", "expl": "Real assets include real estate, durable equipment, and other physical assets. Equity\nsecurities such as industrial stocks are classified as financial assets. Currencies are a\nseparate classification of investment assets.\n(Module 39.1, LOS 39.b)"}, {"n": 69, "q": "The initial margin is the:", "opts": ["amount of cash that an investor must maintain in his/her margin account.", "equity represented in the margin account at any time.", "minimum amount of funds that must be supplied when purchasing a security on margin."], "ans": "C", "expl": "Margin is the amount of equity in the account at a given time. Initial margin is the amount\nof equity required initially to execute an order.\n(Module 39.2, LOS 39.f)"}, {"n": 70, "q": "Evelyn Stram, CFA, places a good-till-cancelled limit buy order at 86 for a stock. Stram's order\nspecifies:", "opts": ["clearing and validity instructions.", "validity and execution instructions.", "execution and clearing instructions."], "ans": "B", "expl": "Good-till-cancelled is a validity instruction, which indicates when an order may be filled.\nExecution instructions include limit orders and market orders, as well as instructions\nregarding trade size and visibility. A clearing instruction indicates how to arrange final\nsettlement of the trade.\n(Module 39.3, LOS 39.g)"}, {"n": 71, "q": "An investor purchases 100 shares at $75 per share with an initial margin of 50%. Assume\nthere is no interest on the call loan and no transactions fees. If the stock price rises to\n$112.50, the rate of return to the investor is:", "opts": ["100%.", "200%.", "50%."], "ans": "A", "expl": "$75/share × 100 shares = $7,500.\n50% margin means investor only pays half of the $7,500 in cash, or $3,750, and borrows\nthe remaining $3,750.\nRate of return = (market value – initial investment – margin loan repayment) / initial equity\n= ($11,250 – $3,750 – $3,750) / $3,750 = 100%.\n(Module 39.2, LOS 39.f)"}, {"n": 72, "q": "Equity securities most likely include:", "opts": ["preferred stock and certificates of deposit.", "common stock and warrants.", "exchange-traded funds."], "ans": "B", "expl": "Common stock, preferred stock, and warrants are equity securities. Certificates of deposit\nare debt securities. Exchange-traded funds are pooled investment vehicles.\n(Module 39.1, LOS 39.c)"}, {"n": 73, "q": "Toby Jensen originally purchased 400 shares of CSC stock on margin at a price of $60 per\nshare. The initial margin requirement is 50% and the maintenance margin is 25%. CSC stock\nprice has fallen dramatically in recent months and it closed today with a sharp decline\nbringing the closing price to $40 per share. Will Jensen receive a margin call?", "opts": ["Yes, he does not meet the minimum maintenance margin requirement.", "No, he meets the minimum initial margin requirement.", "No, he meets the minimum maintenance margin requirement."], "ans": "C", "expl": "Total original value held by Jensen is 400 × $60 = $24,000.\nAmount of equity is 50% ($24,000) = $12,000.\nCurrent total value is 400 × $40 = $16,000.\nSo Jensen's equity is $16,000 - $12,000 = $4,000 which is 4,000/16,000 = 25% of the total\nmarket value.\n(Module 39.2, LOS 39.f)"}];
const CFG = {"title": "Market Organization and Structure", "subtitle": "CFA · Equity Investments · Reading 39 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; stem.textContent = q.q;
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>
</body>
