<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 29 — Valuation of Contingent Claims · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>

  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->

<script>
const DATA = [{"n": 1, "q": "Given the information regarding the various Reston stock options, which option will increase the most relative to an increase in the underlying Reston stock price?", "opts": ["American call.", "American put.", "European call."], "ans": "C", "expl": "Using its delta in Potter presents Fairfax with the prices of various options as shown in Table 3, if the Reston stock increases by a dollar the European call on the stock will increase by 0.5977.", "explhtml": "<p>Using its delta in Potter presents Fairfax with the prices of various options as shown in Table 3, if the Reston stock increases by a dollar the European call on the stock will increase by 0.5977.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 1–4<\/div> <div class=\"pp-topic\">Module 29.7, LOS 29.l<\/div><div class=\"kq-note\">Câu thuộc item set (câu 1–4). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Given the information regarding the various Reston stock options, which option will increase the most relative to an increase in the underlying Reston stock price?<\/p><\/div>", "subj": "derivatives"}, {"n": 2, "q": "Fairfax would like to consider neutralizing his Reston equity position from changes in the stock price of Reston. Using the information in Table 3 how many standard Reston European options would have to be either bought or sold in order to create a delta neutral portfolio?", "opts": ["Buy 300,703 put options.", "Sell 334,616 call options.", "Sell 334,616 put options."], "ans": "B", "expl": "Number of call options = (Reston Portfolio Value / Stock PriceReston)(1 / Deltacall). Number of call options = ($10,000,000 / $50.00/sh)(1 / 0.5977) = 334,616.", "explhtml": "<p>Number of call options = (Reston Portfolio Value / Stock PriceReston)(1 / Deltacall).<\/p><p>Number of call options = ($10,000,000 / $50.00/sh)(1 / 0.5977) = 334,616.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 1–4<\/div> <div class=\"pp-topic\">Module 29.7, LOS 29.l<\/div><div class=\"qtext\"><p>Fairfax would like to consider neutralizing his Reston equity position from changes in the stock price of Reston. Using the information in Table 3 how many standard Reston European options would have to be either bought or sold in order to create a delta neutral portfolio?<\/p><\/div>", "subj": "derivatives"}, {"n": 3, "q": "Fairfax remembers Potter explaining something about how options are not like futures and swaps because their risk-return profiles are non-linear. Which of the following option sensitivity measures does Fairfax need to consider to completely hedge his equity position in Reston from changes in the price of Reston stock?", "opts": ["Delta and Gamma.", "Gamma and Theta.", "Delta and Vega."], "ans": "A", "expl": "Vega measures the sensitivity relative to changes in volatility. Theta measures sensitivity relative to changes in time to expiration.", "explhtml": "<p>Vega measures the sensitivity relative to changes in volatility. Theta measures sensitivity relative to changes in time to expiration.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 1–4<\/div> <div class=\"pp-topic\">Module 29.7, LOS 29.l<\/div><div class=\"qtext\"><p>Fairfax remembers Potter explaining something about how options are not like futures and swaps because their risk-return profiles are non-linear. Which of the following option sensitivity measures does Fairfax need to consider to completely hedge his equity position in Reston from changes in the price of Reston stock?<\/p><\/div>", "subj": "derivatives"}, {"n": 4, "q": "Fairfax has heard people talking about \"making a portfolio delta neutral.\" What does it mean to make a portfolio delta neutral? The portfolio:", "opts": ["is insensitive to volatility changes in the returns on the underlying equity.", "is insensitive to interest rate changes.", "is insensitive to stock price changes."], "ans": "C", "expl": "The delta of the option portfolio is the change in value of the portfolio if the stock price changes. A delta neutral option portfolio has a delta of zero.", "explhtml": "<p>The delta of the option portfolio is the change in value of the portfolio if the stock price changes. A delta neutral option portfolio has a delta of zero.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 1–4<\/div> <div class=\"pp-topic\">Module 29.7, LOS 29.l<\/div><div class=\"qtext\"><p>Fairfax has heard people talking about &quot;making a portfolio delta neutral.&quot; What does it mean to make a portfolio delta neutral? The portfolio:<\/p><\/div>", "subj": "derivatives"}, {"n": 5, "q": "Which of the following is least likely one of the assumptions of the Black-Scholes-Merton option pricing model?", "opts": ["Changes in volatility are known and predictable.", "The options are European.", "The risk-free rate of interest is known and does not change over the term of the option."], "ans": "A", "expl": "The BSM model assumes that volatility of the return is known and constant (i.e., not changing). Other assumptions of the BSM model include the continuously compounded risk-free interest rate is known and constant and the options are European (meaning that early exercise is not allowed).", "explhtml": "<p>The BSM model assumes that volatility of the return is known and constant (i.e., not changing). Other assumptions of the BSM model include the continuously compounded risk-free interest rate is known and constant and the options are European (meaning that early exercise is not allowed).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.6, LOS 29.f<\/div><div class=\"qtext\"><p>Which of the following is least likely one of the assumptions of the Black-Scholes-Merton option pricing model?<\/p><\/div>", "subj": "derivatives"}, {"n": 6, "q": "The price of a June call option with an exercise price of $50 falls by $0.50 when the underlying non-dividend paying stock price falls by $2.00. The delta of a June put option with an exercise price of $50 closest to:", "opts": ["0.25.", "–0.75.", "–0.25."], "ans": "B", "expl": "The call option delta is: $0.50 deltacall =  = 0.25 $2.00 The put option delta is 0.25 – 1 = –0.75.", "explhtml": "<p>The call option delta is:<\/p><p>$0.50 delta<sub>call<\/sub> = &nbsp; = 0.25<\/p><p>$2.00<\/p><p>The put option delta is 0.25 – 1 = –0.75.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.7, LOS 29.l<\/div><div class=\"qtext\"><p>The price of a June call option with an exercise price of $50 falls by $0.50 when the underlying non-dividend paying stock price falls by $2.00. The delta of a June put option with an exercise price of $50 closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 7, "q": "The delta of an option is equal to the:", "opts": ["percentage change in option price divided by the percentage change in the asset price.", "dollar change in the stock price divided by the dollar change in the option price.", "dollar change in the option price divided by the dollar change in the stock price."], "ans": "C", "expl": "The delta of an option is the dollar change in option price per $1 change in the price of the underlying asset.", "explhtml": "<p>The delta of an option is the dollar change in option price per $1 change in the price of the underlying asset.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.7, LOS 29.k<\/div><div class=\"qtext\"><p>The delta of an option is equal to the:<\/p><\/div>", "subj": "derivatives"}, {"n": 8, "q": "Using the information about the interest rate put and the spot and forward rates in Exhibit 1, which of the following is closest to the value of the put? Assume that the option cash settle at time 2.", "opts": ["$44,250.", "$64,250.", "$84,250."], "ans": "B", "expl": "Step 1: At the expiry of the option at T₂ consider whether the option will be exercised in each of the forward scenarios. Remember an interest rate put option allows the holder the right but not obligation to pay floating and receive fixed. The strike price (in this case 4.5%) is the fixed rate in an interest rate option. The put will be exercised in the forward rate is less than the fixed rate. Forward rate 6.8% – option lapses Forward rate 4.12% – option exercised Forward rate 2.5% – option exercised Step 2: We now calculate the pay off on the option at the options expiry given each interest rate scenario. This assumes the payoff on the option is at T₂, which is technically incorrect as in reality the payoff is at the end of the borrowing and lending period (T₃) rather than the expiry of the option (T₂). If we exercise the interest rate option we then enter pay floating receive fixed until the end of the borrowing and lending period. Calculate the payoff on the put at T₂ in each scenario: (interest rate received – interest rate paid) × days / 360 × notional principal forward rate 6.8% – option lapses payoff zero forward rate 4.12% = (0.045 – 0.0412) × 360 / 360 × $10m = $38,000 forward rate 2.5% = (0.045 – 0.025) × 360 / 360 × $10m = $200,000 Step 3: Discount the payoffs back through the binomial interest rate tree to T₀. Note that in a binomial interest rate tree we always have a 50% chance of an up move and a 50% chance of a down move. Discount the probability weighted amounts from T₂ back to T₁ at the relevant forward rate. Value at T₁ upper node: [($0 + $38,000) ½] / 1.0495 = $18,103.86 Value at T1 lower node: [($38,000 + $200,000) ½] / 1.03 = $115,533.98 Discount the probability weighted amounts back from T1 to T0 at the 1 period spot rate to arrive that the price (premium) on the interest rate put. [($18,103.86 + $115,533.98) ½] / 1.04 = $64,248.96 Diagrammatically:", "explhtml": "<p>Step 1:<\/p><p>At the expiry of the option at T<sub>2<\/sub> consider whether the option will be exercised in each of the forward scenarios.<\/p><p>Remember an interest rate put option allows the holder the right but not obligation to pay floating and receive fixed. The strike price (in this case 4.5%) is the fixed rate in an interest rate option. The put will be exercised in the forward rate is less than the fixed rate.<\/p><p>Forward rate 6.8% – option lapses<\/p><p>Forward rate 4.12% – option exercised<\/p><p>Forward rate 2.5% – option exercised<\/p><p>Step 2:<\/p><p>We now calculate the pay off on the option at the options expiry given each interest rate scenario. This assumes the payoff on the option is at T<sub>2<\/sub>, which is technically incorrect as in reality the payoff is at the end of the borrowing and lending period (T<sub>3<\/sub>) rather than the expiry of the option (T<sub>2<\/sub>).<\/p><p>If we exercise the interest rate option we then enter pay floating receive fixed until the end of the borrowing and lending period.<\/p><p>Calculate the payoff on the put at T<sub>2<\/sub> in each scenario:<\/p><p>(interest rate received – interest rate paid) × days / 360 × notional principal<\/p><p>forward rate 6.8% – option lapses payoff zero<\/p><p>forward rate 4.12% = (0.045 – 0.0412) × 360 / 360 × $10m = $38,000<\/p><p>forward rate 2.5% = (0.045 – 0.025) × 360 / 360 × $10m = $200,000<\/p><p>Step 3:<\/p><p>Discount the payoffs back through the binomial interest rate tree to T<sub>0<\/sub>. Note that in a binomial interest rate tree we always have a 50% chance of an up move and a 50% chance of a down move. Discount the probability weighted amounts from T<sub>2<\/sub> back to T<sub>1<\/sub> at the relevant forward rate.<\/p><p>Value at T<sub>1<\/sub> upper node:<\/p><p>[($0 + $38,000) ½] / 1.0495 = $18,103.86<\/p><p>Value at T1 lower node:<\/p><p>[($38,000 + $200,000) ½] / 1.03 = $115,533.98<\/p><p>Discount the probability weighted amounts back from T1 to T0 at the 1 period spot rate to arrive that the price (premium) on the interest rate put.<\/p><p>[($18,103.86 + $115,533.98) ½] / 1.04 = $64,248.96<\/p><p>Diagrammatically:<\/p><img class=\"pimg\" src=\"l2img/kq/r29-d48325425b.jpeg\" style=\"max-width:min(100%,600px)\" loading=\"lazy\" alt=\"\">", "qhtml": "<div class=\"pp-topic set\">Item set · câu 8–11<\/div> <div class=\"pp-topic\">Module 29.5, LOS 29.e<\/div><div class=\"kq-note\">Câu thuộc item set (câu 8–11). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Using the information about the interest rate put and the spot and forward rates in Exhibit 1, which of the following is closest to the value of the put? Assume that the option cash settle at time 2.<\/p><\/div>", "subj": "derivatives"}, {"n": 9, "q": "How many of Wood's notes regarding the Black model used to value interest options are correct?", "opts": ["All three notes are correct.", "Only two of the notes are correct.", "Only one of the notes is correct."], "ans": "A", "expl": "Note 1: Correct The payoff is not at the expiration of the option and FRA. Once exercised into the FRA the payoff occurs at the end of the pay fixed receive floating period (FRA maturity). Note 2: Correct Long FRA represents pay fixed and receive floating from the expiry of the FRA until the end of the borrowing and lending period. Long FRAs will increase in value as interest rates rise as the forward rate on a new FRA with the same expiry and borrowing and lending period will be higher. Given the underlying in an interest rate option is a long FRA the call option will increase in value as the FRA gains value. As with all options the call will increase in value as the underlying increases. Note 3: Correct In the Black model used to value interest rate option the FRA rate and strike price are annualized rates. Given the time between FRA expiry and the end of borrowing and lending is unlikely to be a year the present value of the payoff will need to be unannualized.", "explhtml": "<p>Note 1: Correct<\/p><p>The payoff is not at the expiration of the option and FRA. Once exercised into the FRA the payoff occurs at the end of the pay fixed receive floating period (FRA maturity).<\/p><p>Note 2: Correct<\/p><p>Long FRA represents pay fixed and receive floating from the expiry of the FRA until the end of the borrowing and lending period. Long FRAs will increase in value as interest rates rise as the forward rate on a new FRA with the same expiry and borrowing and lending period will be higher. Given the underlying in an interest rate option is a long FRA the call option will increase in value as the FRA gains value. As with all options the call will increase in value as the underlying increases.<\/p><p>Note 3: Correct<\/p><p>In the Black model used to value interest rate option the FRA rate and strike price are annualized rates. Given the time between FRA expiry and the end of borrowing and lending is unlikely to be a year the present value of the payoff will need to be unannualized.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 8–11<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"qtext\"><p>How many of Wood&#x27;s notes regarding the Black model used to value interest options are correct?<\/p><\/div>", "subj": "derivatives"}, {"n": 10, "q": "Newman's Comment 1 is best described as:", "opts": ["correct.", "incorrect as to the strike price of the options.", "incorrect as to the equivalence to a long FRA."], "ans": "A", "expl": "Newman has replicated a long FRA position (pay fixed receive floating). Long call, short put with same strike and expiry = Long FRA Short call, long put with same strike and expiry = Short FRA", "explhtml": "<p>Newman has replicated a long FRA position (pay fixed receive floating).<\/p><p>Long call, short put with same strike and expiry = Long FRA<\/p><p>Short call, long put with same strike and expiry = Short FRA<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 8–11<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"qtext\"><p>Newman&#x27;s Comment 1 is best described as:<\/p><\/div>", "subj": "derivatives"}, {"n": 11, "q": "Newman's Comment 2 is best described as:", "opts": ["correct.", "incorrect as buying a floor is not equivalent to buying interest rate put options.", "incorrect as long floor, short cap would create a pay floating, receive fixed interest rate swap."], "ans": "C", "expl": "Pay fixed, receive floating swap (payer swap) can be created by going long an interest rate cap and short an interest rate put. A cap comprises of caplets where each caplet is in effect a call option on a FRA. A floor represents a series of floorlets where each floorlet is an interest rate put option. Long floor and short cap with identical strike prices will create receiver swap (i.e., pay floating and receive fixed).", "explhtml": "<p>Pay fixed, receive floating swap (payer swap) can be created by going long an interest rate cap and short an interest rate put.<\/p><p>A cap comprises of caplets where each caplet is in effect a call option on a FRA. A floor represents a series of floorlets where each floorlet is an interest rate put option.<\/p><p>Long floor and short cap with identical strike prices will create receiver swap (i.e., pay floating and receive fixed).<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 8–11<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"qtext\"><p>Newman&#x27;s Comment 2 is best described as:<\/p><\/div>", "subj": "derivatives"}, {"n": 12, "q": "In order to compute the implied asset price volatility for a particular option, an investor:", "opts": ["must have a series of asset prices.", "does not need to know the risk-free rate.", "must have the market price of the option."], "ans": "C", "expl": "In order to compute the implied volatility we need the risk-free rate, the current asset price, the time to expiration, the exercise price, and the market price of the option.", "explhtml": "<p>In order to compute the implied volatility we need the risk-free rate, the current asset price, the time to expiration, the exercise price, and the market price of the option.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.7, LOS 29.n<\/div><div class=\"qtext\"><p>In order to compute the implied asset price volatility for a particular option, an investor:<\/p><\/div>", "subj": "derivatives"}, {"n": 13, "q": "A cap on a floating rate note, from the bondholder's perspective, is equivalent to:", "opts": ["writing a series of interest rate puts.", "writing a series of puts on fixed income securities.", "owning a series of calls on fixed income securities."], "ans": "B", "expl": "For a bondholder, a cap, which puts a maximum on floating rate interest payments, is equivalent to writing a series of puts on fixed income securities. These would require the buyer to pay when rates rise and bond prices fall, negating interest rate increases above the cap rate. Writing a series of interest rate calls, not puts, would be an equivalent strategy. Calls on fixed income securities would pay when rates decrease, not when they increase.", "explhtml": "<p>For a bondholder, a cap, which puts a maximum on floating rate interest payments, is equivalent to writing a series of puts on fixed income securities. These would require the buyer to pay when rates rise and bond prices fall, negating interest rate increases above the cap rate. Writing a series of interest rate calls, not puts, would be an equivalent strategy. Calls on fixed income securities would pay when rates decrease, not when they increase.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"qtext\"><p>A cap on a floating rate note, from the bondholder&#x27;s perspective, is equivalent to:<\/p><\/div>", "subj": "derivatives"}, {"n": 14, "q": "Given the following interest rate tree: The value of a 2-period European put option with strike rate of 2% and notional principal of $1 million is closest to:", "opts": ["$2,020", "$3,109", "$2,230"], "ans": "C", "expl": "Given the exercise rate of 2.00%, the put option has a positive payoff for nodes P–– and P–+. The payoff at node P–– can be calculated as: [Max (0, 0.02 – 0.0128)] × $ 1,000,000 = $7,200. The payoff at node P–+ can be calculated as: [Max (0, 0.02 – 0.019)] × $ 1,000,000 = $ 1,000. Value at node P– = [(0.5 × 7,200) + (0.5 × 1,000)] / (1.0155) = $4,037 Value at node P⁺ = [(0.5 × 0) + (0.5 × 1,000)] / (1.0231) = $489 And the value at node P = [(0.5 × 4,037) + (0.5 × 489)] / (1.015) = $2,230.", "explhtml": "<p>Given the exercise rate of 2.00%, the put option has a positive payoff for nodes P<sup>––<\/sup> and P<sup>–+<\/sup>.<\/p><p>The payoff at node P<sup>––<\/sup> can be calculated as:<\/p><p>[Max (0, 0.02 – 0.0128)] × $ 1,000,000 = $7,200.<\/p><p>The payoff at node P<sup>–+<\/sup> can be calculated as:<\/p><p>[Max (0, 0.02 – 0.019)] × $ 1,000,000 = $ 1,000.<\/p><p>Value at node P<sup>–<\/sup> = [(0.5 × 7,200) + (0.5 × 1,000)] / (1.0155) = $4,037<\/p><p>Value at node P<sup>+<\/sup> = [(0.5 × 0) + (0.5 × 1,000)] / (1.0231) = $489<\/p><p>And the value at node P = [(0.5 × 4,037) + (0.5 × 489)] / (1.015) = $2,230.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.5, LOS 29.e<\/div><div class=\"qtext\"><p>Given the following interest rate tree:<\/p><img class=\"pimg\" src=\"l2img/kq/r29-f9be395306.png\" style=\"max-width:min(100%,514px)\" loading=\"lazy\" alt=\"\"><p>The value of a 2-period European put option with strike rate of 2% and notional principal of $1 million is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 15, "q": "Suppose a forward rate agreement (FRA) calls for us to receive the six-month MRR two years from now for a payment of a fixed rate of interest of 6%. Which of the following structures is equivalent to this long FRA? A long:", "opts": ["call on MRR with a strike rate of 6% and eighteen months to expiration.", "call and a short put on MRR with a strike rate of 6% and two years to expiration.", "put and a short call on MRR with a strike rate of 6% and two years to expiration."], "ans": "B", "expl": "A long FRA is replicated by a long IR call and short IR put with expiration corresponding to the FRA settlement date.", "explhtml": "<p>A long FRA is replicated by a long IR call and short IR put with expiration corresponding to the FRA settlement date.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"qtext\"><p>Suppose a forward rate agreement (FRA) calls for us to receive the six-month MRR two years from now for a payment of a fixed rate of interest of 6%. Which of the following structures is equivalent to this long FRA? A long:<\/p><\/div>", "subj": "derivatives"}, {"n": 16, "q": "Which of the following statements concerning vega is most accurate? Vega is greatest when an option is:", "opts": ["far in the money.", "far out of the money.", "at the money."], "ans": "C", "expl": "When the option is at the money, changes in volatility will have the greatest effect on the option value.", "explhtml": "<p>When the option is at the money, changes in volatility will have the greatest effect on the option value.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.7, LOS 29.k<\/div><div class=\"qtext\"><p>Which of the following statements concerning vega is most accurate? Vega is greatest when an option is:<\/p><\/div>", "subj": "derivatives"}, {"n": 17, "q": "DTK Inc stock (current price $55) has 1-year call options with an exercise price of $55 trading at $4.92. The stock can increase by 20% or decrease by 15% over the next year and the risk-free rate is 5%. Arbitrage profits are most likely:", "opts": ["possible by purchasing 57 shares and writing 100 calls.", "not possible.", "possible by purchasing 100 calls and short selling 57 shares."], "ans": "C", "expl": "S⁺ = 55(1.20) = 66; S- = 55 (0.85) = 46.75. C⁺ = 66 – 55 = 11, C⁻ = 0. H = (11 – 0) / (66 – 46.75) = 0.5714 (−hS⁺+C⁺) C₀ = hS₀ + (1+Rf) = (0.571×55) + [ ((-0.571×66) + 11) / 1.05 ] = 5.99 Since the call price of $4.92 < $5.99, an arbitrage profit can be earned by buying calls and short selling 0.571 shares per call bought.", "explhtml": "<p>S<sup>+<\/sup> = 55(1.20) = 66; S- = 55 (0.85) = 46.75. C<sup>+<\/sup> = 66 – 55 = 11, C<sup>-<\/sup> = 0.<\/p><p>H = (11 – 0) / (66 – 46.75) = 0.5714<\/p><p>(−hS<sup>+<\/sup>+C<sup>+<\/sup>)<\/p><p>C<sub>0<\/sub> = hS<sub>0<\/sub> +<\/p><p>(1+R<sub>f<\/sub>)<\/p><p>= (0.571×55) + [ ((-0.571×66) + 11) / 1.05 ] = 5.99<\/p><p>Since the call price of $4.92 &lt; $5.99, an arbitrage profit can be earned by buying calls and short selling 0.571 shares per call bought.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.4, LOS 29.c<\/div><div class=\"qtext\"><p>DTK Inc stock (current price $55) has 1-year call options with an exercise price of $55 trading at $4.92. The stock can increase by 20% or decrease by 15% over the next year and the risk-free rate is 5%. Arbitrage profits are most likely:<\/p><\/div>", "subj": "derivatives"}, {"n": 18, "q": "Given the following interest rate tree: The value of a 2-period European call option with strike rate of 2% and notional principal of $1 million is closest to:", "opts": ["$4,122", "$3,549", "$2,022"], "ans": "C", "expl": "Given the exercise rate of 2.00%, the call option has a positive payoff for node C⁺⁺ only. The payoff at node C⁺⁺ can be calculated as: [Max (0, 0.0284 – 0.02)] × $ 1,000,000 = $ 8,400. Value at node C⁺ = [(0.5 × 8,400) + (0.5 × 0)] / (1.0231) = $4,105 Value at node C⁻ = 0 And the value at node C = [(0.5 × 4,105) + (0.5 × 0)] / (1.015) = $2,022", "explhtml": "<p>Given the exercise rate of 2.00%, the call option has a positive payoff for node C<sup>++<\/sup> only.<\/p><p>The payoff at node C<sup>++<\/sup> can be calculated as:<\/p><p>[Max (0, 0.0284 – 0.02)] × $ 1,000,000 = $ 8,400.<\/p><p>Value at node C<sup>+<\/sup> = [(0.5 × 8,400) + (0.5 × 0)] / (1.0231) = $4,105<\/p><p>Value at node C<sup>-<\/sup> = 0<\/p><p>And the value at node C = [(0.5 × 4,105) + (0.5 × 0)] / (1.015) = $2,022<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.5, LOS 29.e<\/div><div class=\"qtext\"><p>Given the following interest rate tree:<\/p><img class=\"pimg\" src=\"l2img/kq/r29-f9be395306.png\" style=\"max-width:min(100%,514px)\" loading=\"lazy\" alt=\"\"><p>The value of a 2-period European call option with strike rate of 2% and notional principal of $1 million is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 19, "q": "Which of the following option sensitivities measures the change in the price of the option with respect to a decrease in the time to expiration?", "opts": ["Delta.", "Gamma.", "Theta."], "ans": "C", "expl": "Theta describes the change in option price in response to the passage of time. Since option holders would prefer that value not decay too quickly, an option with a low theta value is desirable.", "explhtml": "<p>Theta describes the change in option price in response to the passage of time. Since option holders would prefer that value not decay too quickly, an option with a low theta value is desirable.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.7, LOS 29.k<\/div><div class=\"qtext\"><p>Which of the following option sensitivities measures the change in the price of the option with respect to a decrease in the time to expiration?<\/p><\/div>", "subj": "derivatives"}, {"n": 20, "q": "If we use four of the inputs into the Black-Scholes-Merton option-pricing model and solve for the asset price volatility that will make the model price equal to the market price of the option, we have found the:", "opts": ["implied volatility.", "historical volatility.", "option volatility."], "ans": "A", "expl": "The question describes the process for finding the expected volatility implied by the market price of the option.", "explhtml": "<p>The question describes the process for finding the expected volatility implied by the market price of the option.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.7, LOS 29.n<\/div><div class=\"qtext\"><p>If we use four of the inputs into the Black-Scholes-Merton option-pricing model and solve for the asset price volatility that will make the model price equal to the market price of the option, we have found the:<\/p><\/div>", "subj": "derivatives"}, {"n": 21, "q": "Which of the following most accurately describes when the call option delta reaches its minimum bound? The call option reaches its minimum bound when call option is:", "opts": ["the option's delta has no minimum bound.", "far out of the money.", "at the money."], "ans": "B", "expl": "When a call option is far out of the money its value is insensitive to changes in value of the underlying. This is because the chances that it is going to end up in the money at expiration are very small.", "explhtml": "<p>When a call option is far out of the money its value is insensitive to changes in value of the underlying. This is because the chances that it is going to end up in the money at expiration are very small.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 21–24<\/div> <div class=\"pp-topic\">Module 29.7, LOS 29.l<\/div><div class=\"kq-note\">Câu thuộc item set (câu 21–24). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Which of the following most accurately describes when the call option delta reaches its minimum bound? The call option reaches its minimum bound when call option is:<\/p><\/div>", "subj": "derivatives"}, {"n": 22, "q": "If the portfolio has 10,000 shares of the underlying stock and he wants to completely hedge the price risk using options, what kind of options should Franklin buy?", "opts": ["Call and put options.", "Put options.", "Call options."], "ans": "B", "expl": "Buying put options will allow Franklin to completely hedge the stock price risk.", "explhtml": "<p>Buying put options will allow Franklin to completely hedge the stock price risk.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 21–24<\/div> <div class=\"pp-topic\">Module 29.7, LOS 29.l<\/div><div class=\"qtext\"><p>If the portfolio has 10,000 shares of the underlying stock and he wants to completely hedge the price risk using options, what kind of options should Franklin buy?<\/p><\/div>", "subj": "derivatives"}, {"n": 23, "q": "Compute the number of shares of stock necessary to create a delta neutral portfolio consisting of 100 long put options in Exhibit 2 and the stock.", "opts": ["32.64.", "67.36.", "−32.64."], "ans": "A", "expl": "This is simply −100 times the put option delta. Since each share has a delta of 1, we only need 32.64 shares (long) to create a delta neutral portfolio.", "explhtml": "<p>This is simply −100 times the put option delta. Since each share has a delta of 1, we only need 32.64 shares (long) to create a delta neutral portfolio.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 21–24<\/div> <div class=\"pp-topic\">Module 29.7, LOS 29.l<\/div><div class=\"qtext\"><p>Compute the number of shares of stock necessary to create a delta neutral portfolio consisting of 100 long put options in Exhibit 2 and the stock.<\/p><\/div>", "subj": "derivatives"}, {"n": 24, "q": "Compute the number of shares of stock necessary to create a delta neutral portfolio consisting of 100 long call options in Exhibit 2 and the stock.", "opts": ["67.36.", "−32.64.", "−67.36."], "ans": "C", "expl": "This is simply −100 times the call option delta. Since each share has a delta of 1, we only need −67.36 (short) shares to create a delta neutral portfolio.", "explhtml": "<p>This is simply −100 times the call option delta. Since each share has a delta of 1, we only need −67.36 (short) shares to create a delta neutral portfolio.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 21–24<\/div> <div class=\"pp-topic\">Module 29.7, LOS 29.l<\/div><div class=\"qtext\"><p>Compute the number of shares of stock necessary to create a delta neutral portfolio consisting of 100 long call options in Exhibit 2 and the stock.<\/p><\/div>", "subj": "derivatives"}, {"n": 25, "q": "Which of the following is closest to the no-arbitrage price of the 5-month T-Bond futures contract?", "opts": ["$867.20.", "$877.47.", "$976.02."], "ans": "A", "expl": "The no-arbitrage price for T-Bond futures is given by the formula: QFP = {(full price) × (1 + Rf)T – AIT – FVC)(1 / CF) The full price of the bond = clean price + accrued interest. Since the bond pays semi-annual coupons, and four months have passed since the last coupon, there are two months until the next coupon. Accrued interest (AI) = (days since last coupon / days between coupons) × $ semiannual coupon. In this question we have not been told days but instead have months. AIT in the formulae represents the accrued interest at the maturity of the futures contract. Given the last coupon was 4 months ago the next coupon of $23 will be in two months' time. At the maturity of the futures contract in five months we will be 3 months through the coupon period, hence: AIT = (3 months / 6 months) × $23 = $11.5 The next coupon will be in two months' time (four months' ago, plus six months) and will equal $23. FVC in the above formula is this coupon compounded up to the futures maturity, three months later, so FVC = $23 × 1.02993 / 12 = $23.17. Thus, QFP = [($1,002.33 × 1.02995 / 12) – $11.5 – $23.17] / 1.13 = $867.20", "explhtml": "<p>The no-arbitrage price for T-Bond futures is given by the formula:<\/p><p>QFP = {(full price) × (1 + R<sub>f<\/sub>)<sup>T<\/sup> – AI<sub>T<\/sub> – FVC)(1 / CF)<\/p><p>The full price of the bond = clean price + accrued interest. Since the bond pays semi-annual coupons, and four months have passed since the last coupon, there are two months until the next coupon.<\/p><p>Accrued interest (AI) = (days since last coupon / days between coupons) × $ semiannual coupon. In this question we have not been told days but instead have months.<\/p><p>AI<sub>T<\/sub> in the formulae represents the accrued interest at the maturity of the futures contract. Given the last coupon was 4 months ago the next coupon of $23 will be in two months&#x27; time. At the maturity of the futures contract in five months we will be 3 months through the coupon period, hence:<\/p><p>AI<sub>T<\/sub> = (3 months / 6 months) × $23 = $11.5<\/p><p>The next coupon will be in two months&#x27; time (four months&#x27; ago, plus six months) and will equal $23. FVC in the above formula is this coupon compounded up to the futures maturity, three months later, so FVC = $23 × 1.02993 / 12 = $23.17.<\/p><p>Thus, QFP = [($1,002.33 × 1.02995 / 12) – $11.5 – $23.17] / 1.13 = $867.20<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 25–28<\/div> <div class=\"pp-topic\">Module 28.3, LOS 28.d<\/div><div class=\"kq-note\">Câu thuộc item set (câu 25–28). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Which of the following is closest to the no-arbitrage price of the 5-month T-Bond futures contract?<\/p><\/div>", "subj": "derivatives"}, {"n": 26, "q": "Comment 1 is best described as:", "opts": ["correct.", "incorrect as long an interest rate floor should be short an interest rate floor.", "incorrect as long an interest rate floor should be long an interest rate cap."], "ans": "A", "expl": "For a long call option on a bond, when interest rates decrease, bond prices rise hence call value increases. Similarly, for an interest rate put, when interest rate decreases, the long put value increases.", "explhtml": "<p>For a long call option on a bond, when interest rates decrease, bond prices rise hence call value increases. Similarly, for an interest rate put, when interest rate decreases, the long put value increases.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 25–28<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"qtext\"><p>Comment 1 is best described as:<\/p><\/div>", "subj": "derivatives"}, {"n": 27, "q": "Comment 2 is best described as:", "opts": ["correct.", "incorrect as it should be buying an interest rate floor and selling an interest rate cap.", "incorrect as it should be the floor that sets the maximum interest rate payable by the borrower."], "ans": "A", "expl": "Interest rate cap pays when the reference rate exceeds the strike rate. As such, the borrower can use the payment from the interest rate cap to offset the higher interest payment on the floating rate loan. Hence the strike rate on the cap is the maximum interest rate that the borrower has to pay. By selling the floor, the premium received on the floor will help to offset some of the premium paid on the cap. In addition, the collar also hedged the interest rate exposure of the loan through the strike rate of the cap and floor.", "explhtml": "<p>Interest rate cap pays when the reference rate exceeds the strike rate. As such, the borrower can use the payment from the interest rate cap to offset the higher interest payment on the floating rate loan. Hence the strike rate on the cap is the maximum interest rate that the borrower has to pay. By selling the floor, the premium received on the floor will help to offset some of the premium paid on the cap. In addition, the collar also hedged the interest rate exposure of the loan through the strike rate of the cap and floor.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 25–28<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"qtext\"><p>Comment 2 is best described as:<\/p><\/div>", "subj": "derivatives"}, {"n": 28, "q": "Comment 3 can be best described as:", "opts": ["correct.", "incorrect as it is describing a receiver swaption, not a payer swaption.", "incorrect as a payer swaption is more valuable if an equivalent swap at the market rate is lower than the strike rate."], "ans": "A", "expl": "Comment 3 is a correct description of a payer swaption.", "explhtml": "<p>Comment 3 is a correct description of a payer swaption.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 25–28<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"qtext\"><p>Comment 3 can be best described as:<\/p><\/div>", "subj": "derivatives"}, {"n": 29, "q": "Which of the following is the best approximation of the gamma of an option if its delta is equal to 0.6 when the price of the underlying security is 100 and 0.7 when the price of the underlying security is 110?", "opts": ["0.01.", "1.00.", "0.10."], "ans": "A", "expl": "The gamma of an option is computed as follows: Gamma = change in delta/change in the price of the underlying = (0.7 – 0.6)/(110 – 100) = 0.01", "explhtml": "<p>The gamma of an option is computed as follows:<\/p><p>Gamma = change in delta/change in the price of the underlying = (0.7 – 0.6)/(110 – 100) = 0.01<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.7, LOS 29.k<\/div><div class=\"qtext\"><p>Which of the following is the best approximation of the gamma of an option if its delta is equal to 0.6 when the price of the underlying security is 100 and 0.7 when the price of the underlying security is 110?<\/p><\/div>", "subj": "derivatives"}, {"n": 30, "q": "Combining a short position in a stock with a long position in a call option on the stock will produce a payoff pattern equivalent to a:", "opts": ["risk-free security.", "short position in a put option on the stock.", "long position in a put option on the stock."], "ans": "C", "expl": "The combined payoff pattern of a short position in a stock and a long call option on the stock is the same as the payoff pattern of a long put option on the stock.", "explhtml": "<p>The combined payoff pattern of a short position in a stock and a long call option on the stock is the same as the payoff pattern of a long put option on the stock.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.2, LOS 29.c<\/div><div class=\"qtext\"><p>Combining a short position in a stock with a long position in a call option on the stock will produce a payoff pattern equivalent to a:<\/p><\/div>", "subj": "derivatives"}, {"n": 31, "q": "Which of the following best explains a delta-neutral portfolio? A delta-neutral portfolio is perfectly hedged against:", "opts": ["small price changes in the underlying asset.", "small price decreases in the underlying asset.", "all price changes in the underlying asset."], "ans": "A", "expl": "A delta-neutral portfolio is perfectly hedged against small price changes in the underlying asset. This is true both for price increases and decreases. That is, the portfolio value will not change significantly if the asset price changes by a small amount. However, large changes in the underlying will cause the hedge to become imperfect. This means that overall portfolio value can change by a significant amount if the price change in the underlying asset is large.", "explhtml": "<p>A delta-neutral portfolio is perfectly hedged against small price changes in the underlying asset. This is true both for price increases and decreases. That is, the portfolio value will not change significantly if the asset price changes by a small amount. However, large changes in the underlying will cause the hedge to become imperfect. This means that overall portfolio value can change by a significant amount if the price change in the underlying asset is large.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 31–34<\/div> <div class=\"pp-topic\">Module 29.7, LOS 29.l<\/div><div class=\"kq-note\">Câu thuộc item set (câu 31–34). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Which of the following best explains a delta-neutral portfolio? A delta-neutral portfolio is perfectly hedged against:<\/p><\/div>", "subj": "derivatives"}, {"n": 32, "q": "After discussing the concept of a delta-neutral portfolio, Washington determines that he needs to further explain the concept of delta. Washington draws the payoff diagram for an option as a function of the underlying stock price. Using this diagram, how is delta interpreted? Delta is the:", "opts": ["slope in the option price diagram.", "curvature of the option price graph.", "level in the option price diagram."], "ans": "A", "expl": "Delta is the change in the option price for a given instantaneous change in the stock price. The change is equal to the slope of the option price diagram.", "explhtml": "<p>Delta is the change in the option price for a given instantaneous change in the stock price. The change is equal to the slope of the option price diagram.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 31–34<\/div> <div class=\"pp-topic\">Module 29.7, LOS 29.l<\/div><div class=\"qtext\"><p>After discussing the concept of a delta-neutral portfolio, Washington determines that he needs to further explain the concept of delta. Washington draws the payoff diagram for an option as a function of the underlying stock price. Using this diagram, how is delta interpreted? Delta is the:<\/p><\/div>", "subj": "derivatives"}, {"n": 33, "q": "Washington is trying to determine the value of a call option. When the slope of the at expiration curve is close to zero, the call option is:", "opts": ["in-the-money.", "at-the-money.", "out-of-the-money."], "ans": "C", "expl": "When a call option is deep out-of-the-money, the slope of the at expiration curve is close to zero, which means the delta will be close to zero.", "explhtml": "<p>When a call option is deep out-of-the-money, the slope of the at expiration curve is close to zero, which means the delta will be close to zero.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 31–34<\/div> <div class=\"pp-topic\">Module 29.7, LOS 29.l<\/div><div class=\"qtext\"><p>Washington is trying to determine the value of a call option. When the slope of the at expiration curve is close to zero, the call option is:<\/p><\/div>", "subj": "derivatives"}, {"n": 34, "q": "BIC owns 51,750 shares of Smith & Oates. The shares are currently priced at $69. A call option on Smith & Oates with a strike price of $70 is selling at $3.50, and has a delta of 0.69 What is the number of call options necessary to create a delta-neutral hedge?", "opts": ["75,000.", "0.", "14,785."], "ans": "A", "expl": "The number of call options necessary to delta hedge is = 51,750 / 0.69 = 75,000 options or 750 option contracts, each covering 100 shares. Since these are call options, the options should be sold short.", "explhtml": "<p>The number of call options necessary to delta hedge is = 51,750 / 0.69 = 75,000 options or 750 option contracts, each covering 100 shares. Since these are call options, the options should be sold short.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 31–34<\/div> <div class=\"pp-topic\">Module 29.7, LOS 29.l<\/div><div class=\"qtext\"><p>BIC owns 51,750 shares of Smith &amp; Oates. The shares are currently priced at $69. A call option on Smith &amp; Oates with a strike price of $70 is selling at $3.50, and has a delta of 0.69 What is the number of call options necessary to create a delta-neutral hedge?<\/p><\/div>", "subj": "derivatives"}, {"n": 35, "q": "Barlow notices that the stock in Exhibit 1 does not pay dividends. If the stock begins to pay a dividend, how will the price of a call option on that stock be affected? The price of the call option:", "opts": ["may either increase or decrease.", "will decrease.", "will increase."], "ans": "B", "expl": "The call option value will decrease since the payment of dividends reduces the value of the underlying, and the value of a call is positively related to the value of the underlying.", "explhtml": "<p>The call option value will decrease since the payment of dividends reduces the value of the underlying, and the value of a call is positively related to the value of the underlying.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 35–38<\/div> <div class=\"pp-topic\">Module 29.1, LOS 29.a<\/div><div class=\"kq-note\">Câu thuộc item set (câu 35–38). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Barlow notices that the stock in Exhibit 1 does not pay dividends. If the stock begins to pay a dividend, how will the price of a call option on that stock be affected? The price of the call option:<\/p><\/div>", "subj": "derivatives"}, {"n": 36, "q": "Barlow calculated the value of an American call option on the stock shown in Exhibit 2. Which of the following is closest to the value of this call option?", "opts": ["$15.12.", "$15.41.", "$14.84."], "ans": "C", "expl": "The value of the American-style call option is the same as the value of the equivalent European-style call option. Since the underlying stock does not pay a dividend, it is never optimal to exercise the American option early. Hence the early-exercise option embedded in the American-style call has no value in this case. This makes the American option worth exactly the same as the European option.", "explhtml": "<p>The value of the American-style call option is the same as the value of the equivalent European-style call option. Since the underlying stock does not pay a dividend, it is never optimal to exercise the American option early. Hence the early-exercise option embedded in the American-style call has no value in this case. This makes the American option worth exactly the same as the European option.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 35–38<\/div> <div class=\"pp-topic\">Module 29.1, LOS 29.a<\/div><div class=\"qtext\"><p>Barlow calculated the value of an American call option on the stock shown in Exhibit 2. Which of the following is closest to the value of this call option?<\/p><\/div>", "subj": "derivatives"}, {"n": 37, "q": "Using the information in Exhibit 2, Barlow computes the value of a European put option. Which of the following is closest to the value of this option?", "opts": ["$1.41.", "$4.84.", "$1.97."], "ans": "A", "expl": "Using the information in Exhibit 2, this value can be determined from put-call parity as follows: Put = Call + Xe−rt − S So we have Put = $14.8445 + $100.00e(−7.00% × 0.5) − $110.00 = $1.4050", "explhtml": "<p>Using the information in Exhibit 2, this value can be determined from put-call parity as follows:<\/p><p>Put = Call + Xe<sup>−rt<\/sup> − S<\/p><p>So we have Put = $14.8445 + $100.00e<sup>(−7.00% × 0.5)<\/sup> − $110.00 = $1.4050<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 35–38<\/div> <div class=\"pp-topic\">Module 29.1, LOS 29.a<\/div><div class=\"qtext\"><p>Using the information in Exhibit 2, Barlow computes the value of a European put option. Which of the following is closest to the value of this option?<\/p><\/div>", "subj": "derivatives"}, {"n": 38, "q": "Barlow notices that the stock in Exhibit 2 does not pay dividends. If the stock starts to pay a dividend, how will the price of a put option on that stock be affected?", "opts": ["Increase or decrease.", "Increase.", "Decrease."], "ans": "B", "expl": "The put option value will increase since the payment of dividends reduces the value of the underlying, and the value of a put is negatively related to the value of the underlying.", "explhtml": "<p>The put option value will increase since the payment of dividends reduces the value of the underlying, and the value of a put is negatively related to the value of the underlying.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 35–38<\/div> <div class=\"pp-topic\">Module 29.1, LOS 29.a<\/div><div class=\"qtext\"><p>Barlow notices that the stock in Exhibit 2 does not pay dividends. If the stock starts to pay a dividend, how will the price of a put option on that stock be affected?<\/p><\/div>", "subj": "derivatives"}, {"n": 39, "q": "Bower is a bit puzzled about how to use caps and floors. He wonders how he could benefit both from increasing and decreasing interest rates. Which of the following trades would most likely profit from this interest rate scenario?", "opts": ["Buy at the money cap and at the money floor.", "Sell at the money cap and at the money floor.", "Buy at the money cap and sell at the money floor."], "ans": "A", "expl": "This is a straddle on interest rates. The cap provides a positive payoff when interest rates rise and the floor provides a positive payoff when interest rates fall.", "explhtml": "<p>This is a straddle on interest rates. The cap provides a positive payoff when interest rates rise and the floor provides a positive payoff when interest rates fall.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 39–42<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"kq-note\">Câu thuộc item set (câu 39–42). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Bower is a bit puzzled about how to use caps and floors. He wonders how he could benefit both from increasing and decreasing interest rates. Which of the following trades would most likely profit from this interest rate scenario?<\/p><\/div>", "subj": "derivatives"}, {"n": 40, "q": "Bower has studied swaps extensively. However, he is not sure which of the following is the swap fixed rate for a one-year interest rate swap based on 90-day LIBOR with quarterly payments. Using the information in Table 1 and the formula below, what is the most appropriate swap fixed rate for this swap? 1 −Z₄ C= Z₁ + Z₂ + Z₃ + Z₄ where 1 Zₙ =  price of n − zero − coupon bond per $ of principal 1 + RN", "opts": ["6.01%.", "5.75%.", "5.65%."], "ans": "B", "expl": "The swap fixed rate is computed as follows: 1 Z90−day = 1+(0.055×90/360) = 0.98644 1 Z180−day = 1+(0.05625×180/360) = 0.97264 1 Z270−day = 1+(0.57499×270/360) = 0.95866 1 Z360−day = 1+(0.058749×360/360) = 0.94451 1−0.94451 The quarterly fixed rate on the swap = 0.98644+0.97264+0.95866+0.94451 = 0.05549/3.86225 = 0.01437 = 1.437% The fixed rate on the swap in annual terms is: 1.437% × 360 / 90 = 5.75%", "explhtml": "<p>The swap fixed rate is computed as follows:<\/p><p>1<\/p><p>Z90−day =<\/p><p>1+(0.055×90/360)<\/p><p>= 0.98644<\/p><p>1<\/p><p>Z180−day =<\/p><p>1+(0.05625×180/360)<\/p><p>= 0.97264<\/p><p>1<\/p><p>Z270−day =<\/p><p>1+(0.57499×270/360)<\/p><p>= 0.95866<\/p><p>1<\/p><p>Z360−day =<\/p><p>1+(0.058749×360/360)<\/p><p>= 0.94451<\/p><p>1−0.94451<\/p><p>The quarterly fixed rate on the swap =<\/p><p>0.98644+0.97264+0.95866+0.94451<\/p><p>= 0.05549/3.86225 = 0.01437 = 1.437%<\/p><p>The fixed rate on the swap in annual terms is:<\/p><p>1.437% × 360 / 90 = 5.75%<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 39–42<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.f<\/div><div class=\"qtext\"><p>Bower has studied swaps extensively. However, he is not sure which of the following is the swap fixed rate for a one-year interest rate swap based on 90-day LIBOR with quarterly payments. Using the information in Table 1 and the formula below, what is the most appropriate swap fixed rate for this swap?<\/p><p>1 −Z<sub>4<\/sub><\/p><p>C=<\/p><p>Z<sub>1<\/sub> + Z<sub>2<\/sub> + Z<sub>3<\/sub> + Z<sub>4<\/sub><\/p><p>where<\/p><p>1 Z<sub>n<\/sub> = &nbsp; price of n − zero − coupon bond per $ of principal<\/p><p>1 + R<sub>N<\/sub><\/p><\/div>", "subj": "derivatives"}, {"n": 41, "q": "Bower computes the implied volatility of a one year caplet on the 90-day LIBOR forward rates to be 18.5%. Using the given information what does this mean for the caplet's market price relative to its theoretical price? The caplet's market price is:", "opts": ["overvalued.", "undervalued or overvalued.", "undervalued."], "ans": "C", "expl": "Volatility and option prices are always positively related. Therefore, since the option implied volatility is lower than the estimated volatility, this implies that the caplet is undervalued relative to its theoretical value.", "explhtml": "<p>Volatility and option prices are always positively related. Therefore, since the option implied volatility is lower than the estimated volatility, this implies that the caplet is undervalued relative to its theoretical value.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 39–42<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.f<\/div><div class=\"qtext\"><p>Bower computes the implied volatility of a one year caplet on the 90-day LIBOR forward rates to be 18.5%. Using the given information what does this mean for the caplet&#x27;s market price relative to its theoretical price? The caplet&#x27;s market price is:<\/p><\/div>", "subj": "derivatives"}, {"n": 42, "q": "For this question only, assume Bower expects the currently positively sloped LIBOR curve to shift upward in a parallel manner. Using a plain vanilla interest rate swap, which of the following will allow Bower to best take advantage of his expectations? Purchase a:", "opts": ["receive fixed interest rate swap.", "pay fixed interest rate swap.", "floating rate bond and enter into a receive fixed swap."], "ans": "B", "expl": "Since the interest rates are expected to rise for all maturities, one can benefit from this rise by receiving a floating rate (LIBOR) and borrowing at a fixed rate (i.e. a pay fixed swap).", "explhtml": "<p>Since the interest rates are expected to rise for all maturities, one can benefit from this rise by receiving a floating rate (LIBOR) and borrowing at a fixed rate (i.e. a pay fixed swap).<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 39–42<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.f<\/div><div class=\"qtext\"><p>For this question only, assume Bower expects the currently positively sloped LIBOR curve to shift upward in a parallel manner. Using a plain vanilla interest rate swap, which of the following will allow Bower to best take advantage of his expectations? Purchase a:<\/p><\/div>", "subj": "derivatives"}, {"n": 43, "q": "Consider a stock currently trading at $40. The periodically compounded interest rate is 5%. Suppose that U = 1.25 and D = 0.8. The value of a two-period, at-the-money American-style put option is closest to:", "opts": ["$3.35.", "$2.53.", "$1.22."], "ans": "A", "expl": "Probability of up-move = (1 + 0.05 – 0.80) / (1.25 – 0.80) = 0.56 Probability of down-move = 1 – 0.56 = 0.44 We are given that the option is at-the-money and hence X = S₀ = 40. Binomial tree is shown S⁺ = 40 x 1.25 = 50 S⁻ = 40 x 0.80 = 32 S⁺⁺ = 50 x 1.25 = 62.50 S⁺⁻ = S-+ = 50 x 1.25 x 0.80 = 50 S⁻⁻ = 32 x 0.80 = 25.60 For period 2, the put option is in the money only for the down-down node and the intrinsic value = 40 – 25.60 = 14.40 P⁺ = (0 x 0.56 + 0 x 0.44) / 1.05 = 0 P⁻ = (0 x 0.56 + 14.40 x 0.44) / 1.05 = 6.03 However, since it is an American put, early exercise at t=1 will provide a payoff of $40 - $32 = $8. We use the higher expected value of $8 for P- P = (0 x 0.56 + 8 x 0.44) / 1.05 = 3.35", "explhtml": "<p>Probability of up-move = (1 + 0.05 – 0.80) / (1.25 – 0.80) = 0.56<\/p><p>Probability of down-move = 1 – 0.56 = 0.44<\/p><p>We are given that the option is at-the-money and hence X = S<sub>0<\/sub> = 40.<\/p><p>Binomial tree is shown<\/p><p>S<sup>+<\/sup> = 40 x 1.25 = 50<\/p><p>S<sup>-<\/sup> = 40 x 0.80 = 32<\/p><p>S<sup>++<\/sup> = 50 x 1.25 = 62.50<\/p><p>S<sup>+-<\/sup> = S-+ = 50 x 1.25 x 0.80 = 50<\/p><p>S<sup>--<\/sup> = 32 x 0.80 = 25.60<\/p><p>For period 2, the put option is in the money only for the down-down node and the intrinsic value = 40 – 25.60 = 14.40<\/p><p>P<sup>+<\/sup> = (0 x 0.56 + 0 x 0.44) / 1.05 = 0<\/p><p>P<sup>-<\/sup> = (0 x 0.56 + 14.40 x 0.44) / 1.05 = 6.03<\/p><p>However, since it is an American put, early exercise at t=1 will provide a payoff of $40 - $32 = $8. We use the higher expected value of $8 for P-<\/p><p>P = (0 x 0.56 + 8 x 0.44) / 1.05 = 3.35<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.1, LOS 29.d<\/div><div class=\"qtext\"><p>Consider a stock currently trading at $40. The periodically compounded interest rate is 5%. Suppose that U = 1.25 and D = 0.8. The value of a two-period, at-the-money American-style put option is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 44, "q": "When an option's gamma is higher:", "opts": ["delta will be higher.", "a delta hedge will be more effective.", "a delta hedge will perform more poorly over time."], "ans": "C", "expl": "Gamma measures the rate of change of delta (a high gamma could mean that delta will be higher or lower) as the asset price changes and, graphically, is the curvature of the option price as a function of the stock price. Delta measures the slope of the function at a point. The greater gamma is (the more delta changes as the asset price changes), the worse a delta hedge will perform over time.", "explhtml": "<p>Gamma measures the rate of change of delta (a high gamma could mean that delta will be higher or lower) as the asset price changes and, graphically, is the curvature of the option price as a function of the stock price. Delta measures the slope of the function at a point. The greater gamma is (the more delta changes as the asset price changes), the worse a delta hedge will perform over time.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.7, LOS 29.m<\/div><div class=\"qtext\"><p>When an option&#x27;s gamma is higher:<\/p><\/div>", "subj": "derivatives"}, {"n": 45, "q": "Which of the following best describes the implied volatility method for estimated volatility inputs for the Black-Scholes model? Implied volatility is found:", "opts": ["by solving the Black-Scholes model for the volatility using market values for the stock price, exercise price, interest rate, time until expiration, and option price.", "using historical stock price data.", "using the most current stock price data."], "ans": "A", "expl": "Implied volatility is found by \"backing out\" the volatility estimate using the current option price and all other values in the Black-Scholes model.", "explhtml": "<p>Implied volatility is found by &quot;backing out&quot; the volatility estimate using the current option price and all other values in the Black-Scholes model.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.7, LOS 29.n<\/div><div class=\"qtext\"><p>Which of the following best describes the implied volatility method for estimated volatility inputs for the Black-Scholes model? Implied volatility is found:<\/p><\/div>", "subj": "derivatives"}, {"n": 46, "q": "Dividends on a stock can be incorporated into the valuation model of an option on the stock by:", "opts": ["subtracting the future value of the dividend from the current stock price.", "adding the present value of the dividend to the current stock price.", "subtracting the present value of the dividend from the current stock price."], "ans": "C", "expl": "The option pricing formulas can be adjusted for dividends by subtracting the present value of the expected dividend(s) from the current asset price.", "explhtml": "<p>The option pricing formulas can be adjusted for dividends by subtracting the present value of the expected dividend(s) from the current asset price.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.1, LOS 29.d<\/div><div class=\"qtext\"><p>Dividends on a stock can be incorporated into the valuation model of an option on the stock by:<\/p><\/div>", "subj": "derivatives"}, {"n": 47, "q": "Using the information in Exhibit 1, Franklin wants to compute the value of the corresponding European call option. Which of the following is the closest to Franklin's answer?", "opts": ["$5.55.", "$4.78.", "$11.54."], "ans": "C", "expl": "This result can be obtained using put-call parity in the following way: Call Value = Put Value − Xe−rt + S = $4.78 − $100.00e(−0.07 × 1.0) + 100 = $11.54 The incorrect value of $4.78 does not discount the strike price in the put-call parity formula.", "explhtml": "<p>This result can be obtained using put-call parity in the following way:<\/p><p>Call Value = Put Value − Xe<sup>−rt<\/sup> + S = $4.78 − $100.00e<sup>(−0.07 × 1.0)<\/sup> + 100 = $11.54<\/p><p>The incorrect value of $4.78 does not discount the strike price in the put-call parity formula.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 47–50<\/div> <div class=\"pp-topic\">Module 29.1, LOS 29.a<\/div><div class=\"kq-note\">Câu thuộc item set (câu 47–50). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Using the information in Exhibit 1, Franklin wants to compute the value of the corresponding European call option. Which of the following is the closest to Franklin&#x27;s answer?<\/p><\/div>", "subj": "derivatives"}, {"n": 48, "q": "Franklin wants to know how the put option in Exhibit 1 behaves when all the parameters are held constant except the delta. Which of the following is the best estimate of the change in the put option's price when the underlying equity increases by $1?", "opts": ["−$3.61.", "−$0.37.", "−$0.33."], "ans": "C", "expl": "The correct value is simply the delta of the put option in Exhibit 2. The incorrect value −$3.61 represents the change due to the volatility divided by 10 multiplied by −1. The incorrect value −$0.37 calculates the change by dividing the short-term interest rate divided by 100.", "explhtml": "<p>The correct value is simply the delta of the put option in Exhibit 2.<\/p><p>The incorrect value −$3.61 represents the change due to the volatility divided by 10 multiplied by −1.<\/p><p>The incorrect value −$0.37 calculates the change by dividing the short-term interest rate divided by 100.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 47–50<\/div> <div class=\"pp-topic\">Module 29.1, LOS 29.a<\/div><div class=\"qtext\"><p>Franklin wants to know how the put option in Exhibit 1 behaves when all the parameters are held constant except the delta. Which of the following is the best estimate of the change in the put option&#x27;s price when the underlying equity increases by $1?<\/p><\/div>", "subj": "derivatives"}, {"n": 49, "q": "Franklin computes the rate of change in the European put option delta value, given a $1 increase in the underlying equity. Using the information in Exhibit 1 and Exhibit 2, which of the following is the closest to Franklin's answer?", "opts": ["0.0180.", "−0.3264.", "0.6736."], "ans": "A", "expl": "The correct value 0.0180 is referred to as the put option's Gamma. The incorrect value −0.3264 is the delta of the put option. The incorrect value 0.6736 is the call option's delta.", "explhtml": "<p>The correct value 0.0180 is referred to as the put option&#x27;s Gamma.<\/p><p>The incorrect value −0.3264 is the delta of the put option.<\/p><p>The incorrect value 0.6736 is the call option&#x27;s delta.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 47–50<\/div> <div class=\"pp-topic\">Module 29.1, LOS 29.a<\/div><div class=\"qtext\"><p>Franklin computes the rate of change in the European put option delta value, given a $1 increase in the underlying equity. Using the information in Exhibit 1 and Exhibit 2, which of the following is the closest to Franklin&#x27;s answer?<\/p><\/div>", "subj": "derivatives"}, {"n": 50, "q": "Franklin wants to know if the option sensitivities shown in Exhibit 2 have minimum or maximum bounds. Which of the following are the minimum and maximum bounds, respectively, for the put option delta?", "opts": ["−1 and 1.", "There are no minimum or maximum bounds.", "−1 and 0."], "ans": "C", "expl": "The lower bound is achieved when the put option is far in the money so that it moves exactly in the opposite direction as the stock price. When the put option is far out of the money, the option delta is zero. Thus, the option price does not move even if the stock price moves since there is almost no chance that the option is going to be worth something at expiration.", "explhtml": "<p>The lower bound is achieved when the put option is far in the money so that it moves exactly in the opposite direction as the stock price. When the put option is far out of the money, the option delta is zero. Thus, the option price does not move even if the stock price moves since there is almost no chance that the option is going to be worth something at expiration.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 47–50<\/div> <div class=\"pp-topic\">Module 29.1, LOS 29.a<\/div><div class=\"qtext\"><p>Franklin wants to know if the option sensitivities shown in Exhibit 2 have minimum or maximum bounds. Which of the following are the minimum and maximum bounds, respectively, for the put option delta?<\/p><\/div>", "subj": "derivatives"}, {"n": 51, "q": "How is the gamma of an option defined? Gamma is the change in the:", "opts": ["option price as the underlying security changes.", "delta as the price of the underlying security changes.", "vega as the option price changes."], "ans": "B", "expl": "Gamma is the rate of change in delta. It measures how fast the price sensitivity changes as the underlying asset price changes.", "explhtml": "<p>Gamma is the rate of change in delta. It measures how fast the price sensitivity changes as the underlying asset price changes.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.7, LOS 29.k<\/div><div class=\"qtext\"><p>How is the gamma of an option defined? Gamma is the change in the:<\/p><\/div>", "subj": "derivatives"}, {"n": 52, "q": "The one-year call option on Dale Corporation:", "opts": ["is underpriced.", "may be over or underpriced. The given information is not sufficient to give an answer.", "is overpriced."], "ans": "C", "expl": "The up movement parameter U=1.20, and the down movement parameter D=0.833. We calculate the probability of an up move πU = (1 + 0.04 – 0.833)/(1.2 – 0.833) = 0.564. The call is out of the money in the event of a down movement, and has an intrinsic value of $20 in the event of an up movement. Therefore, the estimated value of
