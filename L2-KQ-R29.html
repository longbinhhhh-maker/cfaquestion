 the call is C = (0.564) × $20 / (1.04) = $10.85. Thus, the price of $11.11 is too high and the call is overpriced.", "explhtml": "<p>The up movement parameter U=1.20, and the down movement parameter D=0.833. We calculate the probability of an up move π<sub>U<\/sub> = (1 + 0.04 – 0.833)/(1.2 – 0.833) = 0.564. The call is out of the money in the event of a down movement, and has an intrinsic value of $20 in the event of an up movement. Therefore, the estimated value of the call is C = (0.564) × $20 / (1.04) = $10.85. Thus, the price of $11.11 is too high and the call is overpriced.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 52–55<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.f<\/div><div class=\"kq-note\">Câu thuộc item set (câu 52–55). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>The one-year call option on Dale Corporation:<\/p><\/div>", "subj": "derivatives"}, {"n": 53, "q": "Bingly's sentiments towards the Black-Scholes-Merton (BSM) model regarding a lognormal distribution of prices and a variable risk-free rate are:", "opts": ["incorrect for both reasons.", "correct concerning the distribution of stocks but incorrect concerning the risk-free rate.", "correct for both reasons."], "ans": "B", "expl": "The model requires many assumptions, e.g., the distribution of stock prices is lognormal and the risk-free rate is known and constant. Other assumptions are frictionless markets, the options are European, and the volatility is known and constant.", "explhtml": "<p>The model requires many assumptions, e.g., the distribution of stock prices is lognormal and the risk-free rate is known and constant. Other assumptions are frictionless markets, the options are European, and the volatility is known and constant.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 52–55<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.f<\/div><div class=\"qtext\"><p>Bingly&#x27;s sentiments towards the Black-Scholes-Merton (BSM) model regarding a lognormal distribution of prices and a variable risk-free rate are:<\/p><\/div>", "subj": "derivatives"}, {"n": 54, "q": "If Bingly forecasts the volatility for a stock and find that it is significantly greater than that implied by the prices of the puts and calls of the stock, he would conclude that:", "opts": ["puts and calls are underpriced.", "the puts are overpriced and the calls are underpriced.", "puts and calls are overpriced."], "ans": "A", "expl": "There is a positive relationship between the volatility of the stock and the price of both puts and calls. A higher estimate of volatility implies that the prices of both puts and calls should be higher.", "explhtml": "<p>There is a positive relationship between the volatility of the stock and the price of both puts and calls. A higher estimate of volatility implies that the prices of both puts and calls should be higher.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 52–55<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.f<\/div><div class=\"qtext\"><p>If Bingly forecasts the volatility for a stock and find that it is significantly greater than that implied by the prices of the puts and calls of the stock, he would conclude that:<\/p><\/div>", "subj": "derivatives"}, {"n": 55, "q": "All else being equal, the greater the dividend paid by a stock the:", "opts": ["higher the call price and the lower the put price.", "lower the call price and the lower the put price.", "lower the call price and the higher the put price."], "ans": "C", "expl": "When dividend payments occur during the life of the option, the price of the underlying stock is reduced (on the ex-dividend date). All else being equal, the lower price reduces the value of call options and increases the value of put options.", "explhtml": "<p>When dividend payments occur during the life of the option, the price of the underlying stock is reduced (on the ex-dividend date). All else being equal, the lower price reduces the value of call options and increases the value of put options.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 52–55<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.f<\/div><div class=\"qtext\"><p>All else being equal, the greater the dividend paid by a stock the:<\/p><\/div>", "subj": "derivatives"}, {"n": 56, "q": "In order to create a delta-neutral hedge using put option contracts, Davalos would most accurately need to:", "opts": ["buy 2,000 contracts.", "sell 510,271 contracts.", "buy 5,103 contracts."], "ans": "C", "expl": "The delta of a put option is the delta of the corresponding call option minus- 1. The delta of a QJX put option is thus –0.3919. The number of put options needed is 200,000 / –0.3919 = – 510,334 options or approximately 5,103 contracts per 100 shares. Gier is long the stock, to hedge with puts Davalos should also take a long position in the puts.", "explhtml": "<p>The delta of a put option is the delta of the corresponding call option minus- 1. The delta of a QJX put option is thus –0.3919. The number of put options needed is 200,000 / –0.3919 = – 510,334 options or approximately 5,103 contracts per 100 shares. Gier is long the stock, to hedge with puts Davalos should also take a long position in the puts.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 56–59<\/div> <div class=\"pp-topic\">Module 29.7, LOS 29.l<\/div><div class=\"kq-note\">Câu thuộc item set (câu 56–59). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>In order to create a delta-neutral hedge using put option contracts, Davalos would most accurately need to:<\/p><\/div>", "subj": "derivatives"}, {"n": 57, "q": "An equity swap to hedge the equity risk for Gier would result in a net return on the portfolio of a:", "opts": ["variable rate based on the total return of QJX stock.", "fixed rate of 1.5% per quarter.", "fixed rate of 4.5% for the year."], "ans": "B", "expl": "To offset the equity risk, Gier would pay a variable rate based on the total return of QJX and receive a fixed rate. The quoted rate is an annualized rate and since the swap is for three quarters or nine months, the full 6.0% will not be realized. The 6.0% annualized rate is equivalent to 1.5% per quarter. Any return on the portfolio would be passed on to the swap counterparty and Gier will be immune to equity market movements.", "explhtml": "<p>To offset the equity risk, Gier would pay a variable rate based on the total return of QJX and receive a fixed rate. The quoted rate is an annualized rate and since the swap is for three quarters or nine months, the full 6.0% will not be realized. The 6.0% annualized rate is equivalent to 1.5% per quarter. Any return on the portfolio would be passed on to the swap counterparty and Gier will be immune to equity market movements.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 56–59<\/div> <div class=\"pp-topic\">Module 29.7, LOS 29.l<\/div><div class=\"qtext\"><p>An equity swap to hedge the equity risk for Gier would result in a net return on the portfolio of a:<\/p><\/div>", "subj": "derivatives"}, {"n": 58, "q": "If the equity swap is implemented and after 3 months the stock price has increased to $106.00, the net cash flow for the swap is:", "opts": ["zero.", "a gain of $900,000.", "a loss of $900,000."], "ans": "C", "expl": "The equity swap requires Gier to pay a variable rate of total return on QJX and receive a fixed rate. If the stock appreciates, the swap results in a positive cash flow of 6.0%/4 × $20,000,000 = $300,000 and a negative cash flow of $20,000,000 × ($106/$100 – 1) = $1,200,000, summing to a net of outflow of $900,000. The swap plus the equity position result in an overall gain, as the gain on the stock more than offsets the loss on the equity swap.", "explhtml": "<p>The equity swap requires Gier to pay a variable rate of total return on QJX and receive a fixed rate. If the stock appreciates, the swap results in a positive cash flow of 6.0%/4 × $20,000,000 = $300,000 and a negative cash flow of $20,000,000 × ($106/$100 – 1) = $1,200,000, summing to a net of outflow of $900,000. The swap plus the equity position result in an overall gain, as the gain on the stock more than offsets the loss on the equity swap.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 56–59<\/div> <div class=\"pp-topic\">Module 29.7, LOS 29.l<\/div><div class=\"qtext\"><p>If the equity swap is implemented and after 3 months the stock price has increased to $106.00, the net cash flow for the swap is:<\/p><\/div>", "subj": "derivatives"}, {"n": 59, "q": "Based on the futures information, an arbitrage opportunity can be exploited by:", "opts": ["buying the stock QJX, and selling the futures.", "selling the stock QJX and buying the futures.", "buying the futures and buying the stock QJX."], "ans": "A", "expl": "The calculated fair value of the futures contract is $100 ×(1+0.05)0.75 = $103.73. The asset is relatively underpriced and the futures contract is overpriced. By buying the stock and selling the futures we can lock in a profit greater than the risk-free rate with no risk.", "explhtml": "<p>The calculated fair value of the futures contract is $100 ×(1+0.05)<sup>0.75<\/sup> = $103.73. The asset is relatively underpriced and the futures contract is overpriced. By buying the stock and selling the futures we can lock in a profit greater than the risk-free rate with no risk.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 56–59<\/div> <div class=\"pp-topic\">Module 29.7, LOS 29.l<\/div><div class=\"qtext\"><p>Based on the futures information, an arbitrage opportunity can be exploited by:<\/p><\/div>", "subj": "derivatives"}, {"n": 60, "q": "To the issuer of a floating rate note, a cap is equivalent to:", "opts": ["writing a series of interest rate calls.", "owning a series of calls on a fixed income security.", "owning a series of interest rate calls."], "ans": "C", "expl": "The issuer of the note is borrowing at a floating rate, and will have higher interest expenses if rates increase. A cap is equivalent to owning a series of interest rate calls at the cap rate that will pay the difference between the market rate and the cap rate. If interest rates increase, the payoff from the calls will compensate the borrower for the higher interest expenses.", "explhtml": "<p>The issuer of the note is borrowing at a floating rate, and will have higher interest expenses if rates increase. A cap is equivalent to owning a series of interest rate calls at the cap rate that will pay the difference between the market rate and the cap rate. If interest rates increase, the payoff from the calls will compensate the borrower for the higher interest expenses.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"qtext\"><p>To the issuer of a floating rate note, a cap is equivalent to:<\/p><\/div>", "subj": "derivatives"}, {"n": 61, "q": "A payer swaption gives its holder:", "opts": ["an obligation to enter a swap in the future as the fixed-rate payer.", "the right to enter a swap in the future as the floating-rate payer.", "the right to enter a swap in the future as the fixed-rate payer."], "ans": "C", "expl": "A payer swaption give its holder the right to enter a swap in the future as the fixed-rate payer.", "explhtml": "<p>A payer swaption give its holder the right to enter a swap in the future as the fixed-rate payer.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"qtext\"><p>A payer swaption gives its holder:<\/p><\/div>", "subj": "derivatives"}, {"n": 62, "q": "Compared to the delta of a long position in a stock, the delta of an at-the-money call option on the stock is most likely to be:", "opts": ["the same.", "less.", "greater."], "ans": "B", "expl": "The delta of an at-the-money call option is typically close to 0.5. The delta of a long position in the underlying stock is 1.0 by definition.", "explhtml": "<p>The delta of an at-the-money call option is typically close to 0.5. The delta of a long position in the underlying stock is 1.0 by definition.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.7, LOS 29.k<\/div><div class=\"qtext\"><p>Compared to the delta of a long position in a stock, the delta of an at-the-money call option on the stock is most likely to be:<\/p><\/div>", "subj": "derivatives"}, {"n": 63, "q": "Which of the following is NOT one of the assumptions of the Black-Scholes-Merton option-pricing model?", "opts": ["The yield curve for risk-free assets is fixed over the term of the option.", "There are no taxes and transactions costs are zero for options and arbitrage portfolios.", "Early exercise is not allowed."], "ans": "A", "expl": "The yield curve is assumed to be flat so that the risk-free rate of interest is known and constant over the term of the option. Having a fixed yield curve does not necessarily imply that the yield curve is flat. BSM assumptions include that markets are frictionless (no taxes, transactions costs) and that the options are European-style, meaning that early exercise is not allowed.", "explhtml": "<p>The yield curve is assumed to be flat so that the risk-free rate of interest is known and constant over the term of the option. Having a fixed yield curve does not necessarily imply that the yield curve is flat. BSM assumptions include that markets are frictionless (no taxes, transactions costs) and that the options are European-style, meaning that early exercise is not allowed.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.6, LOS 29.f<\/div><div class=\"qtext\"><p>Which of the following is NOT one of the assumptions of the Black-Scholes-Merton option-pricing model?<\/p><\/div>", "subj": "derivatives"}, {"n": 64, "q": "Cal Smart wrote a 90-day receiver swaption on a 1-year MRR-based semiannual-pay $10 million swap with an exercise rate of 3.8%. At expiration, the market rate and MRR yield curve are: Fixed rate 3.763% 180-days 3.6% 360-days 3.8% The payoff to the writer of the receiver swaption at expiration is closest to:", "opts": ["-$3,600.", "$0.", "$3,600."], "ans": "A", "expl": "At expiration, the fixed rate is 3.763% which is below the exercise rate of 3.8%. The purchaser of the receiver swaption will exercise the option which allows them to receive a fixed rate of 3.8% from the writer of the option and pay the current rate of 3.763%. The equivalent of two payments of (0.038 - 0.03763) × (180/360) × (10,000,000) will be made to the receiver swaption. One payment would have been received in 6 months and will be discounted back to the present at the 6-month rate. One payment would have been received in 12 months and will be discounted back to the present at the 12-month rate The first payment, discounted to the present is (0.038 - 0.03763) × (180/360) × (10,000,000) × ( 1/1.018) = $1,817.28. The second payment, discounted to the present is (0.038 - 0.03763) × (180/360) × (10,000,000) × ( 1/1.038) = $1,782.27 The total payoff for the writer is -$3,599.55.", "explhtml": "<p>At expiration, the fixed rate is 3.763% which is below the exercise rate of 3.8%. The purchaser of the receiver swaption will exercise the option which allows them to receive a fixed rate of 3.8% from the writer of the option and pay the current rate of 3.763%.<\/p><p>The equivalent of two payments of (0.038 - 0.03763) × (180/360) × (10,000,000) will be made to the receiver swaption. One payment would have been received in 6 months and will be discounted back to the present at the 6-month rate. One payment would have been received in 12 months and will be discounted back to the present at the 12-month rate<\/p><p>The first payment, discounted to the present is (0.038 - 0.03763) × (180/360) × (10,000,000) × ( 1/1.018) = $1,817.28.<\/p><p>The second payment, discounted to the present is (0.038 - 0.03763) × (180/360) × (10,000,000) × ( 1/1.038) = $1,782.27<\/p><p>The total payoff for the writer is -$3,599.55.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"qtext\"><p>Cal Smart wrote a 90-day receiver swaption on a 1-year MRR-based semiannual-pay $10 million swap with an exercise rate of 3.8%. At expiration, the market rate and MRR yield curve are:<\/p><p>Fixed rate 3.763%<\/p><p>180-days 3.6%<\/p><p>360-days 3.8%<\/p><p>The payoff to the writer of the receiver swaption at expiration is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 65, "q": "A bond analyst decides to use the BSM model to price options on bond prices. This model will most likely be inadequate because:", "opts": ["the risk free rate must be constant and known.", "the price of the underlying asset follows a lognormal distribution.", "BSM cannot be modified to deal with cash flows like coupon payments."], "ans": "A", "expl": "The BSM model is not useful for pricing options on bond prices and interest rates. In those cases, interest rate volatility is a key factor in determining the value of the option. BSM can be modified to deal with cash flows like coupon payments. The assumption that \"the price of the underlying asset follows a lognormal distribution\" is not applicable.", "explhtml": "<p>The BSM model is not useful for pricing options on bond prices and interest rates. In those cases, interest rate volatility is a key factor in determining the value of the option. BSM can be modified to deal with cash flows like coupon payments. The assumption that &quot;the price of the underlying asset follows a lognormal distribution&quot; is not applicable.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.6, LOS 29.f<\/div><div class=\"qtext\"><p>A bond analyst decides to use the BSM model to price options on bond prices. This model will most likely be inadequate because:<\/p><\/div>", "subj": "derivatives"}, {"n": 66, "q": "Which of the following best describes an interest rate cap? An interest rate cap is a package or portfolio of interest rate options that provide a positive payoff to the buyer if the:", "opts": ["T-Bond futures exceeds the strike price.", "reference rate exceeds the strike rate.", "reference rate is below the strike rate."], "ans": "B", "expl": "An interest rate cap is a package of European-type call options (called caplets) on a reference interest rate.", "explhtml": "<p>An interest rate cap is a package of European-type call options (called caplets) on a reference interest rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"qtext\"><p>Which of the following best describes an interest rate cap? An interest rate cap is a package or portfolio of interest rate options that provide a positive payoff to the buyer if the:<\/p><\/div>", "subj": "derivatives"}, {"n": 67, "q": "The value of a European call option on an asset with no cash flows is positively related to all of the following EXCEPT:", "opts": ["risk-free rate.", "exercise price.", "time to exercise."], "ans": "B", "expl": "The value of a call option decreases as the exercise price increases.", "explhtml": "<p>The value of a call option decreases as the exercise price increases.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.7, LOS 29.k<\/div><div class=\"qtext\"><p>The value of a European call option on an asset with no cash flows is positively related to all of the following EXCEPT:<\/p><\/div>", "subj": "derivatives"}, {"n": 68, "q": "The value of a put option will be higher if, all else equal, the:", "opts": ["underlying asset has positive cash flows.", "underlying asset has less volatility.", "exercise price is lower."], "ans": "A", "expl": "Positive cash flows in the form of dividends will lower the price of the stock making it closer to being \"in the money\" which increases the value of the option as the stock price gets closer to the strike price.", "explhtml": "<p>Positive cash flows in the form of dividends will lower the price of the stock making it closer to being &quot;in the money&quot; which increases the value of the option as the stock price gets closer to the strike price.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.7, LOS 29.k<\/div><div class=\"qtext\"><p>The value of a put option will be higher if, all else equal, the:<\/p><\/div>", "subj": "derivatives"}, {"n": 69, "q": "Zetion Inc stock (current price $28) has 1-year call options with an exercise price of $30 trading at $2.07. The stock can increase by 15% or decrease by 13% over the next year and the risk-free rate is 3%. Arbitrage profits are most likely:", "opts": ["possible by purchasing 100 calls and short selling 28 shares.", "not possible.", "possible by purchasing 28 shares and writing 100 calls."], "ans": "C", "expl": "S⁺ = 28(1.15) = 32.20; S⁻ = 28(0.87) = 24.36. C⁺ = 32.20 – 30 = 2.20, C⁻ = 0. H = (2.20 – 0) / (32.20 – 24.36) = 0.281 (−hS⁺+C⁺) C₀ = hS₀ + (1+Rf) = 0.281 x 28 + [ (- 0.281 x 32.20 + 2.20) / 1.03] = 1.22 Since the call price of $2.07 > 1.22, an arbitrage profit can be earned by writing calls and purchasing 0.281 shares per call written.", "explhtml": "<p>S<sup>+<\/sup> = 28(1.15) = 32.20; S<sup>-<\/sup> = 28(0.87) = 24.36. C<sup>+<\/sup> = 32.20 – 30 = 2.20, C<sup>-<\/sup> = 0.<\/p><p>H = (2.20 – 0) / (32.20 – 24.36) = 0.281<\/p><p>(−hS<sup>+<\/sup>+C<sup>+<\/sup>)<\/p><p>C<sub>0<\/sub> = hS<sub>0<\/sub> +<\/p><p>(1+R<sub>f<\/sub>)<\/p><p>= 0.281 x 28 + [ (- 0.281 x 32.20 + 2.20) / 1.03] = 1.22<\/p><p>Since the call price of $2.07 &gt; 1.22, an arbitrage profit can be earned by writing calls and purchasing 0.281 shares per call written.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.4, LOS 29.c<\/div><div class=\"qtext\"><p>Zetion Inc stock (current price $28) has 1-year call options with an exercise price of $30 trading at $2.07. The stock can increase by 15% or decrease by 13% over the next year and the risk-free rate is 3%. Arbitrage profits are most likely:<\/p><\/div>", "subj": "derivatives"}, {"n": 70, "q": "For a change in which of the following inputs into the Black-Scholes-Merton option pricing model will the direction of the change in a put's value and the direction of the change in a call's value be the same?", "opts": ["Exercise price.", "Risk-free rate.", "Volatility."], "ans": "C", "expl": "A decrease/increase in the volatility of the price of the underlying asset will decrease/increase both put values and call values. A change in the values of the other inputs will have opposite effects on the values of puts and calls.", "explhtml": "<p>A decrease/increase in the volatility of the price of the underlying asset will decrease/increase both put values and call values. A change in the values of the other inputs will have opposite effects on the values of puts and calls.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.7, LOS 29.k<\/div><div class=\"qtext\"><p>For a change in which of the following inputs into the Black-Scholes-Merton option pricing model will the direction of the change in a put&#x27;s value and the direction of the change in a call&#x27;s value be the same?<\/p><\/div>", "subj": "derivatives"}, {"n": 71, "q": "Two call options have the same delta but option A has a higher gamma than option B. When the price of the underlying asset increases, the number of option A calls necessary to hedge the price risk in 100 shares of stock, compared to the number of option B calls, is a:", "opts": ["larger (negative) number.", "larger positive number.", "smaller (negative) number."], "ans": "C", "expl": "For call options larger gamma means that as the asset price increases, the delta of option A increases more than the delta of option B. Since the number of calls to hedge is (– 1/delta)x(number of shares), the number of calls necessary for the hedge is a smaller (negative) number for option A than for option B.", "explhtml": "<p>For call options larger gamma means that as the asset price increases, the delta of option A increases more than the delta of option B. Since the number of calls to hedge is (– 1/delta)x(number of shares), the number of calls necessary for the hedge is a smaller (negative) number for option A than for option B.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.7, LOS 29.l<\/div><div class=\"qtext\"><p>Two call options have the same delta but option A has a higher gamma than option B. When the price of the underlying asset increases, the number of option A calls necessary to hedge the price risk in 100 shares of stock, compared to the number of option B calls, is a:<\/p><\/div>", "subj": "derivatives"}, {"n": 72, "q": "Compared to the value of a call option on a stock with no dividends, a call option on an identical stock expected to pay a dividend during the term of the option will have a:", "opts": ["higher value only if it is an American style option.", "lower value only if it is an American style option.", "lower value in all cases."], "ans": "C", "expl": "An expected dividend during the term of an option will decrease the value of a call option.", "explhtml": "<p>An expected dividend during the term of an option will decrease the value of a call option.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.6, LOS 29.h<\/div><div class=\"qtext\"><p>Compared to the value of a call option on a stock with no dividends, a call option on an identical stock expected to pay a dividend during the term of the option will have a:<\/p><\/div>", "subj": "derivatives"}, {"n": 73, "q": "Which of the following statements regarding an option's price is CORRECT? An option's price is:", "opts": ["a decreasing function of the underlying asset's volatility.", "a decreasing function of the underlying asset's volatility when it has a long time remaining until expiration and an increasing function of its volatility if the option is close to expiration.", "an increasing function of the underlying asset's volatility."], "ans": "C", "expl": "Since an option has limited risk but significant upside potential, its value always increases when the volatility of the underlying asset increases.", "explhtml": "<p>Since an option has limited risk but significant upside potential, its value always increases when the volatility of the underlying asset increases.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.7, LOS 29.k<\/div><div class=\"qtext\"><p>Which of the following statements regarding an option&#x27;s price is CORRECT? An option&#x27;s price is:<\/p><\/div>", "subj": "derivatives"}, {"n": 74, "q": "The value of a put option is positively related to all of the following EXCEPT:", "opts": ["time to maturity.", "exercise price.", "risk-free rate."], "ans": "C", "expl": "The value of a put option is negatively related to increases in the risk-free rate.", "explhtml": "<p>The value of a put option is negatively related to increases in the risk-free rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.7, LOS 29.k<\/div><div class=\"qtext\"><p>The value of a put option is positively related to all of the following EXCEPT:<\/p><\/div>", "subj": "derivatives"}, {"n": 75, "q": "Mark Roberts anticipates utilizing a floating rate line of credit in 90 days to purchase $10 million of raw materials. To get protection against any increase in the expected MRR yield curve, Roberts should:", "opts": ["buy a receiver swaption.", "write a receiver swaption.", "buy a payer swaption."], "ans": "C", "expl": "A payer swaption will give Roberts the right to pay a fixed rate below market if rates rise.", "explhtml": "<p>A payer swaption will give Roberts the right to pay a fixed rate below market if rates rise.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"qtext\"><p>Mark Roberts anticipates utilizing a floating rate line of credit in 90 days to purchase $10 million of raw materials. To get protection against any increase in the expected MRR yield curve, Roberts should:<\/p><\/div>", "subj": "derivatives"}, {"n": 76, "q": "Early exercise of in-the-money American options on:", "opts": ["futures is sometimes worthwhile but never is for options on forwards.", "both futures and forwards is sometimes worthwhile.", "forwards is sometimes worthwhile but never is for options on futures."], "ans": "A", "expl": "Early exercise of in-the-money American options on futures is sometimes worthwhile because the immediate mark to market upon exercise will generate funds that can earn interest. It is never worthwhile for options on forwards because no funds are generated until the settlement date of the forward contract.", "explhtml": "<p>Early exercise of in-the-money American options on futures is sometimes worthwhile because the immediate mark to market upon exercise will generate funds that can earn interest. It is never worthwhile for options on forwards because no funds are generated until the settlement date of the forward contract.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.1, LOS 29.d<\/div><div class=\"qtext\"><p>Early exercise of in-the-money American options on:<\/p><\/div>", "subj": "derivatives"}, {"n": 77, "q": "Calculate the USD swap fixed rate.", "opts": ["3.16%.", "6.20%.", "6.32%."], "ans": "C", "expl": "For a swap with n settlement periods, the semi-annual fixed payment per $1 of notional principal is calculated as: 1−PV factor for last cash flow  1−0.8826 | =  = 0.0316 0.9716+0.9430+0.9180+0.8826 ∑ PV factor for ith cash flow i=1 to n The annualized fixed payment per $1 of notional principal is therefore: 360 0.0316 ×  = 0.0632   or 6.32% 180", "explhtml": "<p>For a swap with n settlement periods, the semi-annual fixed payment per $1 of notional principal is calculated as:<\/p><div class=\"tbl\"><table><tr><td>1−PV factor for last cash flow<\/td><td>1−0.8826<\/td><\/tr><tr><td>=<\/td><td>= 0.0316<\/td><\/tr><\/table><\/div><p>0.9716+0.9430+0.9180+0.8826<\/p><p>∑<\/p><p>PV factor for ith cash flow<\/p><p>i=1 to n<\/p><p>The annualized fixed payment per $1 of notional principal is therefore:<\/p><p>360 0.0316 × &nbsp; = 0.0632 &nbsp;  or 6.32%<\/p><p>180<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 77–80<\/div> <div class=\"pp-topic\">Module 28.6, LOS 28.e<\/div><div class=\"kq-note\">Câu thuộc item set (câu 77–80). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Calculate the USD swap fixed rate.<\/p><\/div>", "subj": "derivatives"}, {"n": 78, "q": "Using the information in Exhibits 1 and 2, which of the following is closest to the amount of the British pound paid on the first settlement date?", "opts": ["£165,000.", "£187,234.", "£264,000."], "ans": "A", "expl": "The semi-annual fixed payment per pound of notional principal is calculated as: 1−PV factor for last cash flow  1−0.9007 | =  = 0.0264 0.9759+0.9519+0.9278+0.9057 ∑ PV factor for ith cash flow i=1 to n Given the dollar notional principal of $10 million, the notional principal in British pounds (using the exchange rate on the date the swap is initiated) will be: $10 million = $6.25m $1.60 Hence the payment made every 6 months will be £6.25m × 0.0264 = £165,000.", "explhtml": "<p>The semi-annual fixed payment per pound of notional principal is calculated as:<\/p><div class=\"tbl\"><table><tr><td>1−PV factor for last cash flow<\/td><td>1−0.9007<\/td><\/tr><tr><td>=<\/td><td>= 0.0264<\/td><\/tr><\/table><\/div><p>0.9759+0.9519+0.9278+0.9057<\/p><p>∑<\/p><p>PV factor for ith cash flow<\/p><p>i=1 to n<\/p><p>Given the dollar notional principal of $10 million, the notional principal in British pounds (using the exchange rate on the date the swap is initiated) will be:<\/p><p>$10 million<\/p><p>= $6.25m<\/p><p>$1.60<\/p><p>Hence the payment made every 6 months will be £6.25m × 0.0264 = £165,000.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 77–80<\/div> <div class=\"pp-topic\">Module 28.7, LOS 28.f<\/div><div class=\"qtext\"><p>Using the information in Exhibits 1 and 2, which of the following is closest to the amount of the British pound paid on the first settlement date?<\/p><\/div>", "subj": "derivatives"}, {"n": 79, "q": "Which of the following would create a synthetic call?", "opts": ["Buy the put and the underlying.", "Sell the put, buy the underlying.", "Sell the put and the underlying."], "ans": "A", "expl": "When dealing with questions based on synthetics the solution can be arrived at by using put call parity. Recall put + share = call + present value of bond PV(X) The European put-call parity states that the payoffs of a fiduciary call (long zero coupon bond and long call) are equivalent to the payoffs of a protective put (long underlying and long put). So a synthetic call = put + stock – PV(X) We can then ignore the value of the pure discount bond PV(X) because its value is unaffected by the stock's price, leaving us with put + stock.", "explhtml": "<p>When dealing with questions based on synthetics the solution can be arrived at by using put call parity.<\/p><p>Recall put + share = call + present value of bond PV(X)<\/p><p>The European put-call parity states that the payoffs of a fiduciary call (long zero coupon bond and long call) are equivalent to the payoffs of a protective put (long underlying and long put).<\/p><p>So a synthetic call = put + stock – PV(X)<\/p><p>We can then ignore the value of the pure discount bond PV(X) because its value is unaffected by the stock&#x27;s price, leaving us with put + stock.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 77–80<\/div> <div class=\"pp-topic\">Module 29.1, LOS 29.a<\/div><div class=\"qtext\"><p>Which of the following would create a synthetic call?<\/p><\/div>", "subj": "derivatives"}, {"n": 80, "q": "How many of Nathan's comments are correct?", "opts": ["Neither comment is correct.", "Only one statement is correct.", "Both statements are correct."], "ans": "B", "expl": "N(d₂) in both BSM and the Black model is the probability of the underlying asset being greater than the strike price at expiry. In the case of a swaption this would be the rate on a payer swap at expiry of the swaption being greater than the strike price (fixed rate) of the payer swaption. N(d₁) is a little more complicated than N(d₂). It adjusts the current value of the underlying asset to represent the expected value of the underlying at expiry ignoring any values less that the strike price and factor in the probability of exercise. In practice this makes N(d₁), a conditional probability, slightly bigger than N(d₂) and unconditional probability. For the exam you should focus on knowing that N(d₂) is the probability of exercise and that N(d₁) is slightly higher. Do not waste too much time trying to understand exactly what N(d₁) is doing. If the N(d₂) is the probability that ST > X at expiry (i.e., a call option is exercised) then 1 – N(d₂) must be the probability that ST < X at expiry (i.e., the probability that a put option is exercised). It is common to write N(–d₂) rather than 1 – (Nd₂).", "explhtml": "<p>N(d<sub>2<\/sub>) in both BSM and the Black model is the probability of the underlying asset being greater than the strike price at expiry. In the case of a swaption this would be the rate on a payer swap at expiry of the swaption being greater than the strike price (fixed rate) of the payer swaption.<\/p><p>N(d<sub>1<\/sub>) is a little more complicated than N(d<sub>2<\/sub>). It adjusts the current value of the underlying asset to represent the expected value of the underlying at expiry ignoring any values less that the strike price and factor in the probability of exercise. In practice this makes N(d<sub>1<\/sub>), a conditional probability, slightly bigger than N(d<sub>2<\/sub>) and unconditional probability. For the exam you should focus on knowing that N(d<sub>2<\/sub>) is the probability of exercise and that N(d<sub>1<\/sub>) is slightly higher. Do not waste too much time trying to understand exactly what N(d<sub>1<\/sub>) is doing.<\/p><p>If the N(d<sub>2<\/sub>) is the probability that ST &gt; X at expiry (i.e., a call option is exercised) then 1 – N(d<sub>2<\/sub>) must be the probability that ST &lt; X at expiry (i.e., the probability that a put option is exercised). It is common to write N(–d<sub>2<\/sub>) rather than 1 – (Nd<sub>2<\/sub>).<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 77–80<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"qtext\"><p>How many of Nathan&#x27;s comments are correct?<\/p><\/div>", "subj": "derivatives"}, {"n": 81, "q": "Assume that a three-year semi-annually settled floor with a strike rate of 8% and a notional amount of $100 million is being analyzed. The reference rate is six-month London Interbank Offered Rate (LIBOR). Suppose that LIBOR for the next four semi-annual periods is as follows: Period LIBOR 1 7.5% 2 8.2% 3 8.1% 4 8.7% What is the payoff for the floor for period 1?", "opts": ["$500,000.", "$0.", "$250,000."], "ans": "C", "expl": "The payoff for each semi-annual period is computed as follows: Payoff = notional amount × (floor rate − six-month LIBOR) / 2 so for period 1: = $100 million × (8.0% − 7.5%) / 2 = $250,000", "explhtml": "<p>The payoff for each semi-annual period is computed as follows:<\/p><p>Payoff = notional amount × (floor rate − six-month LIBOR) / 2<\/p><p>so for period 1:<\/p><p>= $100 million × (8.0% − 7.5%) / 2 = $250,000<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 81–84<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"kq-note\">Câu thuộc item set (câu 81–84). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Assume that a three-year semi-annually settled floor with a strike rate of 8% and a notional amount of $100 million is being analyzed. The reference rate is six-month London Interbank Offered Rate (LIBOR). Suppose that LIBOR for the next four semi-annual periods is as follows:<\/p><div class=\"tbl\"><table><tr><td>Period<\/td><td>LIBOR<\/td><\/tr><tr><td>1<\/td><td>7.5%<\/td><\/tr><tr><td>2<\/td><td>8.2%<\/td><\/tr><tr><td>3<\/td><td>8.1%<\/td><\/tr><tr><td>4<\/td><td>8.7%<\/td><\/tr><\/table><\/div><p>What is the payoff for the floor for period 1?<\/p><\/div>", "subj": "derivatives"}, {"n": 82, "q": "Which of the following best explains the difference between an interest rate put option and a put option on a fixed income security? The interest rate put option value:", "opts": ["decreases if interest rates increase while the value of a put option on a fixed income security increases if interest rates increase.", "decreases if interest rates increase just as the value of a put option on a fixed income security decreases.", "increases if interest rates increase just as the value of a put option on a fixed income security increases."], "ans": "A", "expl": "An interest rate put option pays off the difference between the strike rate and the current interest rate if that difference is positive. So the value of the interest rate option will be high if interest rates decrease below the strike rate. In contrast, a put option on a fixed income security has a high value if interest rates increase because then the fixed-income security's price decreases below the value based strike price.", "explhtml": "<p>An interest rate put option pays off the difference between the strike rate and the current interest rate if that difference is positive. So the value of the interest rate option will be high if interest rates decrease below the strike rate. In contrast, a put option on a fixed income security has a high value if interest rates increase because then the fixed-income security&#x27;s price decreases below the value based strike price.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 81–84<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"qtext\"><p>Which of the following best explains the difference between an interest rate put option and a put option on a fixed income security? The interest rate put option value:<\/p><\/div>", "subj": "derivatives"}, {"n": 83, "q": "A LIBOR based floating rate bond combined with a LIBOR based collar (a short position in an interest rate cap and a long position in an interest rate floor both at the same strike rate) is equivalent to a:", "opts": ["pay-fixed swap position.", "call option on a bond.", "fixed-rate bond."], "ans": "C", "expl": "The effective rate above the cap strike and below the floor strike, when combined with the floating rate on a bond, is constant.", "explhtml": "<p>The effective rate above the cap strike and below the floor strike, when combined with the floating rate on a bond, is constant.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 81–84<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"qtext\"><p>A LIBOR based floating rate bond combined with a LIBOR based collar (a short position in an interest rate cap and a long position in an interest rate floor both at the same strike rate) is equivalent to a:<\/p><\/div>", "subj": "derivatives"}, {"n": 84, "q": "Which of the following is most likely a reason why dynamic riskless arbitrage is difficult in real markets?", "opts": ["Continuous rebalancing.", "Short sale constraints exist.", "Securities are subject to insider trading."], "ans": "A", "expl": "The continuous rebalancing required with dynamic riskless arbitrage is not practical. For one thing, it leads to significant transaction costs.", "explhtml": "<p>The continuous rebalancing required with dynamic riskless arbitrage is not practical. For one thing, it leads to significant transaction costs.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 81–84<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"qtext\"><p>Which of the following is most likely a reason why dynamic riskless arbitrage is difficult in real markets?<\/p><\/div>", "subj": "derivatives"}, {"n": 85, "q": "The writer of a receiver swaption has:", "opts": ["the right to enter a swap in the future as the floating-rate payer.", "an obligation to enter a swap in the future as the floating-rate payer.", "an obligation to enter a swap in the future as the fixed-rate payer."], "ans": "C", "expl": "A receiver swaption gives its owner the right to receive fixed, the writer has an obligation to pay fixed.", "explhtml": "<p>A receiver swaption gives its owner the right to receive fixed, the writer has an obligation to pay fixed.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"qtext\"><p>The writer of a receiver swaption has:<\/p><\/div>", "subj": "derivatives"}, {"n": 86, "q": "To create a synthetic short position in a stock, an investor can buy:", "opts": ["a put option on the stock and sell a call option on the stock.", "both a call option on the stock and a put option on the stock.", "a call option on the stock and sell a put option on the stock."], "ans": "A", "expl": "Buying a put option and writing a call option results in a payoff pattern similar to that of a short position in the underlying stock.", "explhtml": "<p>Buying a put option and writing a call option results in a payoff pattern similar to that of a short position in the underlying stock.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.2, LOS 29.c<\/div><div class=\"qtext\"><p>To create a synthetic short position in a stock, an investor can buy:<\/p><\/div>", "subj": "derivatives"}, {"n": 87, "q": "Which of the following best describes how a payer swap could be replicated using a package of interest rate options?", "opts": ["The swap can be replicated by buying a package of interest rate call options and selling a package of interest rate put options at different strikes.", "The swap can be replicated by selling a package of interest rate call options and buying a package of interest rate put options at the same strikes.", "The swap can be replicated by buying a package of interest rate call options and selling a package of interest rate put options at the same strikes."], "ans": "C", "expl": "The pay-fixed party in an interest rate swap receives a net payment if the floating rate is above the fixed rate and pays when the floating rate is below the fixed rate. This payoff characteristic is similar to buying a package of interest rate call options (receive payment when reference rate is above the strike rate) and selling a package of interest rate put options (pays when the reference rate is below the strike rate) at the same strikes.", "explhtml": "<p>The pay-fixed party in an interest rate swap receives a net payment if the floating rate is above the fixed rate and pays when the floating rate is below the fixed rate. This payoff characteristic is similar to buying a package of interest rate call options (receive payment when reference rate is above the strike rate) and selling a package of interest rate put options (pays when the reference rate is below the strike rate) at the same strikes.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 87–90<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"kq-note\">Câu thuộc item set (câu 87–90). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Which of the following best describes how a payer swap could be replicated using a package of interest rate options?<\/p><\/div>", "subj": "derivatives"}, {"n": 88, "q": "Which of the following best describes how a payer swap could be replicated using interest rate swaptions?", "opts": ["The swap can be replicated by selling a payer swaption and buying a receiver swaption at the same strike.", "The swap can be replicated by buying a payer swaption and selling a receiver swaption at the same strike.", "The swap can be replicated by buying a payer swaption and selling a receiver swaption at different strikes."], "ans": "B", "expl": "The swap can be replicated by buying a payer swaption and selling a receiver swaption at the same strikes. Payer swaption is the right to enter the swap as the fixed-rate payer and receiver swaption is the right to enter as fixed-rate receiver. Payer swaption increases in value when the floating rate increases, similar to that for the pay-fixed party in an interest rate swap. Receiver swaption increases in value when the floating rate decreases. To replicate the negative value suffered by the pay-fixed interest rate party when floating rate decreases, the swap can be replicated by selling a receiver swaption as the negative value increases when rates fall.", "explhtml": "<p>The swap can be replicated by buying a payer swaption and selling a receiver swaption at the same strikes.<\/p><p>Payer swaption is the right to enter the swap as the fixed-rate payer and receiver swaption is the right to enter as fixed-rate receiver. Payer swaption increases in value when the floating rate increases, similar to that for the pay-fixed party in an interest rate swap. Receiver swaption increases in value when the floating rate decreases. To replicate the negative value suffered by the pay-fixed interest rate party when floating rate decreases, the swap can be replicated by selling a receiver swaption as the negative value increases when rates fall.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 87–90<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"qtext\"><p>Which of the following best describes how a payer swap could be replicated using interest rate swaptions?<\/p><\/div>", "subj": "derivatives"}, {"n": 89, "q": "With regards to Lucy's comments regarding the PVA in the Black model and the offsetting of floating rates at expiry of the swaption, which of the following is most accurate?", "opts": ["Lucy is correct about the definition of the PVA and the offsetting of floating rates.", "Lucy is correct about the offsetting of the floating rates but not the PVA.", "Lucy is correct about the PVA but not the offsetting of floating rates."], "ans": "A", "expl": "Wang is correct about both parts. Exercise of a payer swaption results in a swap with fixed payments equal to the strike price on the swaption and the receipt of floating payments. The payoff on a swaption is the difference between the fixed swap rate that can be achieved by exercising the option and the market fixed rate on a swap at expiry. This payoff will be received at every settlement date over the swaps life. The PVA is therefore an annuity factor, which will discount all the payoffs back to the current period. The market swap at expiry of the swaption is pay fixed at the market rate and receive floating payments. The swaption can be exercised into a pay fixed (at swaption strike) and receive floating swap. The floating payments are identical on the two swaps and therefore can be ignored for valuation purposes.", "explhtml": "<p>Wang is correct about both parts.<\/p><p>Exercise of a payer swaption results in a swap with fixed payments equal to the strike price on the swaption and the receipt of floating payments.<\/p><p>The payoff on a swaption is the difference between the fixed swap rate that can be achieved by exercising the option and the market fixed rate on a swap at expiry. This payoff will be received at every settlement date over the swaps life. The PVA is therefore an annuity factor, which will discount all the payoffs back to the current period.<\/p><p>The market swap at expiry of the swaption is pay fixed at the market rate and receive floating payments. The swaption can be exercised into a pay fixed (at swaption strike) and receive floating swap. The floating payments are identical on the two swaps and therefore can be ignored for valuation purposes.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 87–90<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"qtext\"><p>With regards to Lucy&#x27;s comments regarding the PVA in the Black model and the offsetting of floating rates at expiry of the swaption, which of the following is most accurate?<\/p><\/div>", "subj": "derivatives"}, {"n": 90, "q": "Which of the following comments relating to the Black model valuation of a swaption is the most accurate?", "opts": ["SFR in the formula identified by Lucy is the market swap fixed rate at the expiration of the swaption.", "N(d₂) is likely to be greater than N(d₁).", "A payer swaption will only be exercised in the market swap fixed rate at expiry is greater than the swaption’s strike price."], "ans": "C", "expl": "SFR in the Black formula represents the current market swap fixed rate not the fixed rate at expiration. Both the Black and BSM formulas use the current price of the underlying asset. The Black formula, like BSM computes the expected value of what you will receive less the present value of what you will pay given assumptions such as volatility. N(d₂) = only considers probability that the option is exercised (i.e., the probability of the market SFR being greater than the strike at expiration). N(d₁) has to adjust the current SFR to the expected SFR at expiration given that the option will only be exercised if the market SFR > strike rate. The result is that in the Black and BSM formulas that N(d₁) is slightly higher than N(d₂). A payer swaption will only be exercised if the strike rate is lower than the market rate on a pay fixed swap at expiry. When a swaption is exercised the holder will pay fixed at the strike price and receive floating. This will be attractive when the fixed rate on a pay fixed swap in the market is higher. The floating payments can be ignored as the rate on swaption when exercised and the rate on a new swap at expiry would be identical.", "explhtml": "<p>SFR in the Black formula represents the current market swap fixed rate not the fixed rate at expiration. Both the Black and BSM formulas use the current price of the underlying asset.<\/p><p>The Black formula, like BSM computes the expected value of what you will receive less the present value of what you will pay given assumptions such as volatility.<\/p><p>N(d<sub>2<\/sub>) = only considers probability that the option is exercised (i.e., the probability of the market SFR being greater than the strike at expiration). N(d<sub>1<\/sub>) has to adjust the current SFR to the expected SFR at expiration given that the option will only be exercised if the market SFR &gt; strike rate. The result is that in the Black and BSM formulas that N(d<sub>1<\/sub>) is slightly higher than N(d<sub>2<\/sub>).<\/p><p>A payer swaption will only be exercised if the strike rate is lower than the market rate on a pay fixed swap at expiry. When a swaption is exercised the holder will pay fixed at the strike price and receive floating. This will be attractive when the fixed rate on a pay fixed swap in the market is higher. The floating payments can be ignored as the rate on swaption when exercised and the rate on a new swap at expiry would be identical.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 87–90<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"qtext\"><p>Which of the following comments relating to the Black model valuation of a swaption is the most accurate?<\/p><\/div>", "subj": "derivatives"}, {"n": 91, "q": "Which of the following is NOT one of the assumptions of the Black-Scholes-Merton (BSM) option-pricing model?", "opts": ["The options valued are European style (early exercise is not allowed).", "There are no transaction costs, regulatory constraints, or taxes.", "The yield on the underlying has a known and constant volatility."], "ans": "C", "expl": "Assumptions of BSM include: The volatility of the return on the underlying is known and constant. If the underlying instrument pays a yield, it is expressed as a continuous known and constant yield at an annualized rate.", "explhtml": "<p>Assumptions of BSM include:<\/p><p>The volatility of the return on the underlying is known and constant. If the underlying instrument pays a yield, it is expressed as a continuous known and constant yield at an annualized rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.6, LOS 29.f<\/div><div class=\"qtext\"><p>Which of the following is NOT one of the assumptions of the Black-Scholes-Merton (BSM) option-pricing model?<\/p><\/div>", "subj": "derivatives"}, {"n": 92, "q": "Regarding options on a stock without dividends, it is:", "opts": ["sometimes worthwhile to exercise calls early but not puts.", "sometimes worthwhile to exercise puts early but not calls.", "never worthwhile to exercise puts or calls early."], "ans": "B", "expl": "After early exercise of a put, and in particular a deep in-the-money put, the sale proceeds can be invested at the risk-free rate and may earn interest worth more than the time value of the put option. The same is not true for call options: early exercise of call options on non-dividend-paying stock is never optimal.", "explhtml": "<p>After early exercise of a put, and in particular a deep in-the-money put, the sale proceeds can be invested at the risk-free rate and may earn interest worth more than the time value of the put option. The same is not true for call options: early exercise of call options on non-dividend-paying stock is never optimal.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.6, LOS 29.i<\/div><div class=\"qtext\"><p>Regarding options on a stock without dividends, it is:<\/p><\/div>", "subj": "derivatives"}, {"n": 93, "q": "A stock is priced at 38 and the periodic risk-free rate of interest is 6%. What is the value of a two-period European put option with a strike price of 35 on a share of stock using a binomial model with an up factor of 1.15, a down factor of 0.87 and a risk-neutral up probability of 68%?", "opts": ["$0.57.", "$2.58.", "$0.64."], "ans": "A", "expl": "Two down moves produce a stock price of 38 × 0.87² = 28.76 and a put value at the end of two periods of 6.24. An up and a down move, as well as two up moves leave the put option out of the money. You are directly given the probability of up = 0.68. Hence, the down probability = 0.32. The value of the put option is [0.32² × 6.24] / 1.06² = $0.57.", "explhtml": "<p>Two down moves produce a stock price of 38 × 0.87<sup>2<\/sup> = 28.76 and a put value at the end of two periods of 6.24. An up and a down move, as well as two up moves leave the put option out of the money. You are directly given the probability of up = 0.68. Hence, the down probability = 0.32. The value of the put option is [0.32<sup>2<\/sup> × 6.24] / 1.06<sup>2<\/sup> = $0.57.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.1, LOS 29.b<\/div><div class=\"qtext\"><p>A stock is priced at 38 and the periodic risk-free rate of interest is 6%. What is the value of a two-period European put option with a strike price of 35 on a share of stock using a binomial model with an up factor of 1.15, a down factor of 0.87 and a risk-neutral up probability of 68%?<\/p><\/div>", "subj": "derivatives"}, {"n": 94, "q": "Suppose a forward rate agreement (FRA) requires us to exchange six-month MRR one year from now for a fixed rate of interest of 8%. In other words, we will pay floating and receive fixed. Which of the following structures is equivalent to this FRA? A long:", "opts": ["call and a short put on MRR with a strike rate of 8% and twelve months to expiration.", "call and a short put on MRR with a strike rate of 8% and six months to expiration.", "put and a short call on MRR with a strike rate of 8% and twelve months to expiration."], "ans": "C", "expl": "Interest rate swaps can be replicated with a series of put and call positions with expiration dates on the payment dates of the swap. For a receiver swap (where we pay floating and receive fixed), we need an option position that pays when floating rates fall and that requires a payment to be made when rates increase. A long interest rate put plus a short interest rate call would accomplish this. The strike rate of the options corresponds to the fixed rate of the FRA. The expiration of the option coincides with the MRR determination date.", "explhtml": "<p>Interest rate swaps can be replicated with a series of put and call positions with expiration dates on the payment dates of the swap. For a receiver swap (where we pay floating and receive fixed), we need an option position that pays when floating rates fall and that requires a payment to be made when rates increase. A long interest rate put plus a short interest rate call would accomplish this. The strike rate of the options corresponds to the fixed rate of the FRA. The expiration of the option coincides with the MRR determination date.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"qtext\"><p>Suppose a forward rate agreement (FRA) requires us to exchange six-month MRR one year from now for a fixed rate of interest of 8%. In other words, we will pay floating and receive fixed. Which of the following structures is equivalent to this FRA? A long:<\/p><\/div>", "subj": "derivatives"}, {"n": 95, "q": "Referring to put-call parity, which one of the following alternatives would allow you to create a synthetic European call option?", "opts": ["Buy the stock; sell a European put option on the same stock with the same exercise price and the same maturity; short an amount equal to the present value of the exercise price worth of a pure-discount riskless bond.", "Sell the stock; buy a European put option on the same stock with the same exercise price and the same maturity; invest an amount equal to the present value of the exercise price in a pure-discount riskless bond.", "Buy the stock; buy a European put option on the same stock with the same exercise price and the same maturity; short an amount equal to the present value of the exercise price worth of a pure-discount riskless bond."], "ans": "C", "expl": "According to put-call parity we can write a European call as: C₀ = P₀ + S₀ – X/(1+Rf)T We can then read off the right-hand side of the equation to create a synthetic position in the call. We would need to buy the European put, buy the stock, and short or issue a riskless pure-discount bond equal in value to the present value of the exercise price.", "explhtml": "<p>According to put-call parity we can write a European call as: C<sub>0<\/sub> = P<sub>0<\/sub> + S<sub>0<\/sub> – X/(1+R<sub>f<\/sub>)<sup>T<\/sup><\/p><p>We can then read off the right-hand side of the equation to create a synthetic position in the call. We would need to buy the European put, buy the stock, and short or issue a riskless pure-discount bond equal in value to the present value of the exercise price.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.1, LOS 29.a<\/div><div class=\"qtext\"><p>Referring to put-call parity, which one of the following alternatives would allow you to create a synthetic European call option?<\/p><\/div>", "subj": "derivatives"}, {"n": 96, "q": "Referring to put-call parity, which one of the following alternatives would allow you to create a synthetic stock position?", "opts": ["Buy a European call option; short a European put option; invest the present value of the exercise price in a riskless pure-discount bond.", "Sell a European call option; buy a European put option; short the present value of the exercise price worth of a riskless pure-discount bond.", "Buy a European call option; buy a European put option; invest the present value of the exercise price in a riskless pure-discount bond."], "ans": "A", "expl": "According to put-call parity we can write a stock position as: S₀ = C₀ – P₀ + X/(1+Rf)T We can then read off the right-hand side of the equation to create a synthetic position in the stock. We would need to buy the European call, sell the European put, and invest the present value of the exercise price in a riskless pure-discount bond.", "explhtml": "<p>According to put-call parity we can write a stock position as: S<sub>0<\/sub> = C<sub>0<\/sub> – P<sub>0<\/sub> + X/(1+R<sub>f<\/sub>)<sup>T<\/sup><\/p><p>We can then read off the right-hand side of the equation to create a synthetic position in the stock. We would need to buy the European call, sell the European put, and invest the present value of the exercise price in a riskless pure-discount bond.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.1, LOS 29.a<\/div><div class=\"qtext\"><p>Referring to put-call parity, which one of the following alternatives would allow you to create a synthetic stock position?<\/p><\/div>", "subj": "derivatives"}, {"n": 97, "q": "Bob Dilla, CFA makes the following statement about call options: \"Call options on stock can be thought of as leveraged stock investment where N(d₁) units of stock is purchased using e-rTXN(-d₂) of borrowed funds.\" Dilla is most likely:", "opts": ["incorrect about use of e-rTXN(-d₂) borrowed funds.", "correct.", "incorrect about N(d₁) units of stock."], "ans": "A", "expl": "Dilla is correct about calls being similar to a leveraged investment in N(d₁) units of stock but is incorrect about the quantity of borrowed funds. It should be e-rTXN(d₂).", "explhtml": "<p>Dilla is correct about calls being similar to a leveraged investment in N(d<sub>1<\/sub>) units of stock but is incorrect about the quantity of borrowed funds. It should be e<sup>-rT<\/sup>XN(d<sub>2<\/sub>).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.6, LOS 29.g<\/div><div class=\"qtext\"><p>Bob Dilla, CFA makes the following statement about call options:<\/p><p>&quot;Call options on stock can be thought of as leveraged stock investment where N(d<sub>1<\/sub>) units of stock is purchased using e<sup>-rT<\/sup>XN(-d<sub>2<\/sub>) of borrowed funds.&quot;<\/p><p>Dilla is most likely:<\/p><\/div>", "subj": "derivatives"}, {"n": 98, "q": "Williamson would like to consider neutralizing his Reston equity position from changes in Reston's stock price. Using the information in Tables 3 and 4 how many standard Reston European options would have to be bought/sold in order to create a delta neutral portfolio?", "opts": ["Buy 497,141 put options.", "Sell 370,300 call options.", "Sell 497,141 put options."], "ans": "A", "expl": "Number of put options = (Reston Portfolio Value / Stock PriceReston) / −DeltaPut Number of put options = ($10,000,000 / $50.00) / −0.4023 = −497,141 meaning buy 497,141 put options.", "explhtml": "<p>Number of put options = (Reston Portfolio Value / Stock Price<sub>Reston<\/sub>) / −DeltaPut<\/p><p>Number of put options = ($10,000,000 / $50.00) / −0.4023 = −497,141 meaning buy 497,141 put options.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 98–101<\/div> <div class=\"pp-topic\">Module 29.7, LOS 29.l<\/div><div class=\"kq-note\">Câu thuộc item set (câu 98–101). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Williamson would like to consider neutralizing his Reston equity position from changes in Reston&#x27;s stock price. Using the information in Tables 3 and 4 how many standard Reston European options would have to be bought/sold in order to create a delta neutral portfolio?<\/p><\/div>", "subj": "derivatives"}, {"n": 99, "q": "Williamson is very interested in the total return swap. He asks Potter how much it would cost to enter into this transaction. Which of the following is the most likely cost of the swap at inception?", "opts": ["$0.", "$45,007.", "$340,885."], "ans": "A", "expl": "Swaps are priced so that their value at inception is zero.", "explhtml": "<p>Swaps are priced so that their value at inception is zero.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 98–101<\/div> <div class=\"pp-topic\">Module 28.8, LOS 28.g<\/div><div class=\"qtext\"><p>Williamson is very interested in the total return swap. He asks Potter how much it would cost to enter into this transaction. Which of the following is the most likely cost of the swap at inception?<\/p><\/div>", "subj": "derivatives"}, {"n": 100, "q": "Potter analyzes alternative hedging strategies to address the risk of the bank's large floating-rate liability. Which of the following is the most appropriate transaction to efficiently hedge the interest rate risk for the floating rate liability without sacrificing potential gains from interest rate decreases?", "opts": ["Sell an interest rate cap.", "Sell an interest rate floor and buy an interest rate cap.", "Buy an interest rate cap."], "ans": "C", "expl": "Buying a cap, combined with a floating rate liability, limits the exposure to interest rate increases (i.e., no exposure to interest rate increases above strike rate). The floating rate borrower will still benefit from interest rate decreases.", "explhtml": "<p>Buying a cap, combined with a floating rate liability, limits the exposure to interest rate increases (i.e., no exposure to interest rate increases above strike rate). The floating rate borrower will still benefit from interest rate decreases.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 98–101<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"qtext\"><p>Potter analyzes alternative hedging strategies to address the risk of the bank&#x27;s large floating-rate liability. Which of the following is the most appropriate transaction to efficiently hedge the interest rate risk for the floating rate liability without sacrificing potential gains from interest rate decreases?<\/p><\/div>", "subj": "derivatives"}, {"n": 101, "q": "Potter is now considering some of the bank's floating rate assets. Which of the following transactions is the most appropriate to minimize the interest rate risk of these assets without sacrificing upside gains?", "opts": ["Buy a collar.", "Buy a cap.", "Buy a floor."], "ans": "C", "expl": "Buying a floor combined with a floating rate assets limits the exposure to interest rate decreases (i.e., no exposure to interest rate decreases below strike rate) while the floating rate holder is still able to benefit from interest rate increases. Ideally, Potter should consider matching the bank's asset position against the bank's liability position.", "explhtml": "<p>Buying a floor combined with a floating rate assets limits the exposure to interest rate decreases (i.e., no exposure to interest rate decreases below strike rate) while the floating rate holder is still able to benefit from interest rate increases. Ideally, Potter should consider matching the bank&#x27;s asset position against the bank&#x27;s liability position.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 98–101<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"qtext\"><p>Potter is now considering some of the bank&#x27;s floating rate assets. Which of the following transactions is the most appropriate to minimize the interest rate risk of these assets without sacrificing upside gains?<\/p><\/div>", "subj": "derivatives"}, {"n": 102, "q": "Using information in Exhibit 1, the value of $60 strike put option is closest to:", "opts": ["$4.99.", "$5.86.", "$7.27."], "ans": "C", "expl": "The put-call parity equation is: C + X / (1 + r)t = P + S Hence P = C – S + X / (1 + r)t = 1.14 – 53 + 60 / (1.06)91/365 = $7.27", "explhtml": "<p>The put-call parity equation is: C + X / (1 + r)<sup>t<\/sup> = P + S<\/p><p>Hence P = C – S + X / (1 + r)<sup>t<\/sup> = 1.14 – 53 + 60 / (1.06)<sup>91/365<\/sup> = $7.27<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 102–105<\/div> <div class=\"pp-topic\">Module 29.1, LOS 29.a<\/div><div class=\"kq-note\">Câu thuộc item set (câu 102–105). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Using information in Exhibit 1, the value of $60 strike put option is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 103, "q": "Susan discovers that the fair value for the $55 strike put is in fact $3.85. Which of the following is the most appropriate set of transactions to exploit the mispricing (ignore transaction costs)?", "opts": ["Write a call option, buy a put option, buy one share, borrow the PV of strike.", "Buy a call option, write a put option, buy one share, borrow the PV of strike.", "Buy a call option, write a put option, sell short one share, put on deposit the PV of strike."], "ans": "A", "expl": "The $55-strike put is currently underpriced compared to its synthetic ($3.33 < $3.85). We therefore will want to go long the underpriced put and short the overpriced synthetic to make an arbitrage profit. Susan will be obliged to sell the shares at $55, so she also needs to buy the stock (so that she has it to deliver) and borrow the PV of the $55 strike ($55 / (1.06)91/365 = $54.21). The net result will be a receipt of $2.64 – $3.33 – $53 + 54.21 = $0.52 per share. Thus: Write a call option, buy a put option, buy one share, and borrow the PV of strike.", "explhtml": "<p>The $55-strike put is currently underpriced compared to its synthetic ($3.33 &lt; $3.85).<\/p><p>We therefore will want to go long the underpriced put and short the overpriced synthetic to make an arbitrage profit.<\/p><p>Susan will be obliged to sell the shares at $55, so she also needs to buy the stock (so that she has it to deliver) and borrow the PV of the $55 strike ($55 / (1.06)<sup>91/365<\/sup> = $54.21). The net result will be a receipt of $2.64 – $3.33 – $53 + 54.21 = $0.52 per share. Thus:<\/p><p>Write a call option, buy a put option, buy one share, and borrow the PV of strike.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 102–105<\/div> <div class=\"pp-topic\">Module 29.1, LOS 29.a<\/div><div class=\"qtext\"><p>Susan discovers that the fair value for the $55 strike put is in fact $3.85. Which of the following is the most appropriate set of transactions to exploit the mispricing (ignore transaction costs)?<\/p><\/div>", "subj": "derivatives"}, {"n": 104, "q": "Using information in Exhibit 2, which of the following statements about assumptions 1 and 2 is most accurate?", "opts": ["Both assumptions are correct.", "Only one of the two assumptions is correct.", "Both assumptions are incorrect."], "ans": "B", "expl": "The assumptions used by the basic BSM model include: The underlying asset price follows a geometric Brownian motion process. The continuously compounded return is normally distributed. Under this framework, change in asset price is continuous: there are no abrupt jumps. The (continuously compounded) risk-free rate is constant and known. Borrowing and lending are both at the risk-free rate. The volatility of the returns on the underlying asset is constant and known. Markets are \"frictionless.\" There are no taxes, no transactions costs, and no restrictions on short sales or the use of short-sale proceeds. Continuous trading is possible, and there are no arbitrage opportunities in the marketplace. The (continuously compounded) yield on the underlying asset is constant. The options are European options (i.e., they can only be exercised at expiration). Assumption 1 is incorrect. Asset prices are lognormally distributed and asset returns are normally distributed. Assumption 2 is correct.", "explhtml": "<p>The assumptions used by the basic BSM model include:<\/p><p>The underlying asset price follows a geometric Brownian motion process. The continuously compounded return is normally distributed. Under this framework, change in asset price is continuous: there are no abrupt jumps. The (continuously compounded) risk-free rate is constant and known. Borrowing and lending are both at the risk-free rate. The volatility of the returns on the underlying asset is constant and known. Markets are &quot;frictionless.&quot; There are no taxes, no transactions costs, and no restrictions on short sales or the use of short-sale proceeds. Continuous trading is possible, and there are no arbitrage opportunities in the marketplace. The (continuously compounded) yield on the underlying asset is constant. The options are European options (i.e., they can only be exercised at expiration).<\/p><p>Assumption 1 is incorrect. Asset prices are lognormally distributed and asset returns are normally distributed.<\/p><p>Assumption 2 is correct.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 102–105<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.f<\/div><div class=\"qtext\"><p>Using information in Exhibit 2, which of the following statements about assumptions 1 and 2 is most accurate?<\/p><\/div>", "subj": "derivatives"}, {"n": 105, "q": "Using Exhibit 3, which of the following statements about implications 1 and 2 is most accurate?", "opts": ["Both implications are correct.", "Both implications are incorrect.", "Only one of the two implications is correct."], "ans": "C", "expl": "Implication 1 is incorrect. The BSM model assumes a constant risk-free interest rate but interest rate volatility is a key factor that determines the value of options on bonds and interest rate related contracts. Hence BSM is not useful for pricing options on bond prices and interest based derivatives. Implication 2 is correct. BSM allows for constant continuously compounded dividend yield (i.e., cash flow on the underlying) by adjusting the asset value by the present value of the expected cash flows.", "explhtml": "<p>Implication 1 is incorrect. The BSM model assumes a constant risk-free interest rate but interest rate volatility is a key factor that determines the value of options on bonds and interest rate related contracts. Hence BSM is not useful for pricing options on bond prices and interest based derivatives.<\/p><p>Implication 2 is correct. BSM allows for constant continuously compounded dividend yield (i.e., cash flow on the underlying) by adjusting the asset value by the present value of the expected cash flows.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 102–105<\/div> <div class=\"pp-topic\">Module 29.6, LOS 29.f<\/div><div class=\"qtext\"><p>Using Exhibit 3, which of the following statements about implications 1 and 2 is most accurate?<\/p><\/div>", "subj": "derivatives"}, {"n": 106, "q": "A non-dividend-paying option on a stock is most likely to be exercised early if the option is a(n):", "opts": ["call option.", "put option.", "European option."], "ans": "B", "expl": "After exercising a deep in-the-money put early, the sale proceeds can be invested at the risk-free rate, and in this way the investor may earn interest worth more than the time value of the put. Non-dividend-paying call options on stock will never be exercised early because the minimum price of the option always exceeds its exercise value. European options cannot be exercised early.", "explhtml": "<p>After exercising a deep in-the-money put early, the sale proceeds can be invested at the risk-free rate, and in this way the investor may earn interest worth more than the time value of the put. Non-dividend-paying call options on stock will never be exercised early because the minimum price of the option always exceeds its exercise value. European options cannot be exercised early.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.1, LOS 29.d<\/div><div class=\"qtext\"><p>A non-dividend-paying option on a stock is most likely to be exercised early if the option is a(n):<\/p><\/div>", "subj": "derivatives"}, {"n": 107, "q": "Referring to put-call parity, which one of the following alternatives would allow you to create a synthetic riskless pure-discount bond?", "opts": ["Buy a European put option; sell the same stock; sell a European call option.", "Sell a European put option; sell the same stock; buy a European call option.", "Buy a European put option; buy the same stock; sell a European call option."], "ans": "C", "expl": "According to put-call parity we can write a riskless pure-discount bond position as: X/(1+Rf)T = P₀ + S₀ – C₀ We can then read off the right-hand side of the equation to create a synthetic position in the riskless pure-discount bond. We would need to buy the European put, buy the same underlying stock, and sell the European call.", "explhtml": "<p>According to put-call parity we can write a riskless pure-discount bond position as:<\/p><p>X/(1+R<sub>f<\/sub>)<sup>T<\/sup> = P<sub>0<\/sub> + S<sub>0<\/sub> – C<sub>0<\/sub><\/p><p>We can then read off the right-hand side of the equation to create a synthetic position in the riskless pure-discount bond. We would need to buy the European put, buy the same underlying stock, and sell the European call.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.1, LOS 29.a<\/div><div class=\"qtext\"><p>Referring to put-call parity, which one of the following alternatives would allow you to create a synthetic riskless pure-discount bond?<\/p><\/div>", "subj": "derivatives"}, {"n": 108, "q": "A stock is priced at 40 and the periodic risk-free rate of interest is 8%. The value of a two-period European call option with a strike price of 37 on a share of stock using a binomial model with an up factor of 1.20 and down factor of 0.833 is closest to:", "opts": ["$9.25.", "$3.57.", "$9.13."], "ans": "C", "expl": "First, calculate the probability of an up move or a down move: Pᵤ = (1 + 0.08 − 0.833) / (1.20 − 0.833) = 0.673 Pd = 1 − 0.673 = 0.327 Two up moves produce a stock price of 40 × 1.44 = 57.60 and a call value at the end of two periods of 20.60. An up and a down move leave the stock price unchanged at 40 and produce a call value of 3. Two down moves result in the option being out of the money. The value of the call option is discounted back one year and then discounted back again to today. The calculations are as follows: C⁺ = [20.6(0.673) + 3(0.327)] / 1.08 = 13.745 C⁻ = [3(0.673) + 0 (0.327)] / 1.08 = 1.869 Call value today = [13.745(0
