"ans": "B", "expl": "Swap rate curves are typically determined by dollar denominated borrowing based on MRR. These rates are determined by market participants and are not regulated by governments. Swap rate curves are not affected by technical market factors that affect the yields on government bonds. The swap rate curve is also not subject to sovereign credit risk (potential government default on debt) that is unique to each country.", "explhtml": "<p>Swap rate curves are typically determined by dollar denominated borrowing based on MRR. These rates are determined by market participants and are not regulated by governments. Swap rate curves are not affected by technical market factors that affect the yields on government bonds. The swap rate curve is also not subject to sovereign credit risk (potential government default on debt) that is unique to each country.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 23.3, LOS 23.e<\/div><div class=\"qtext\"><p>Which of the following is NOT a reason why market participants prefer the swap rate curve over a government bond yield curve? The swap market:<\/p><\/div>", "subj": "fixed"}, {"n": 57, "q": "According to the pure expectations theory, which of the following statements is most accurate? Forward rates:", "opts": ["exclusively represent expected future spot rates.", "always overestimate future spot rates.", "are biased estimates of market expectations."], "ans": "A", "expl": "The pure expectations theory, also referred to as the unbiased expectations theory, purports that forward rates are solely a function of expected future spot rates. Under the pure expectations theory, a yield curve that is upward (downward) sloping, means that short-term rates are expected to rise (fall). A flat yield curve implies that the market expects short-term rates to remain constant.", "explhtml": "<p>The pure expectations theory, also referred to as the unbiased expectations theory, purports that forward rates are solely a function of expected future spot rates. Under the pure expectations theory, a yield curve that is upward (downward) sloping, means that short-term rates are expected to rise (fall). A flat yield curve implies that the market expects short-term rates to remain constant.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 23.5, LOS 23.h<\/div><div class=\"qtext\"><p>According to the pure expectations theory, which of the following statements is most accurate? Forward rates:<\/p><\/div>", "subj": "fixed"}, {"n": 58, "q": "7.5%, 15-year, annual pay option-free Xeleon Corp bond trades at a market price of $95.72 per $100 par. The government spot rate curve is flat at 5%. The Z-spread on Xeleon Corp bond is closest to:", "opts": ["300 bps", "325 bps", "250 bps"], "ans": "A", "expl": "Since the spot rate curve is flat, we can simply compute the yield on the bond and subtract the spot rate from it to obtain the Z-spread. PV = - 95.72; N = 15; PMT = 7.50; FV = 100; I/Y=?=8%. Z-spread = 8% - 5% = 3% or 300bps", "explhtml": "<p>Since the spot rate curve is flat, we can simply compute the yield on the bond and subtract the spot rate from it to obtain the Z-spread.<\/p><p>PV = - 95.72; N = 15; PMT = 7.50; FV = 100; I/Y=?=8%.<\/p><p>Z-spread = 8% - 5% = 3% or 300bps<\/p>", "qhtml": "<div class=\"pp-topic\">Module 23.4, LOS 23.g<\/div><div class=\"qtext\"><p>7.5%, 15-year, annual pay option-free Xeleon Corp bond trades at a market price of $95.72 per $100 par. The government spot rate curve is flat at 5%.<\/p><p>The Z-spread on Xeleon Corp bond is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 59, "q": "Compared to a yield curve based on government bonds, swap rate curves are:", "opts": ["more comparable across countries and have a greater number of yields at various maturities.", "more comparable across countries and have a smaller number of yields at various maturities.", "less comparable across countries and have a greater number of yields at various maturities."], "ans": "A", "expl": "Swap rate curves are typically determined by dollar denominated borrowing based on MRR. These rates are determined by market participants and are not regulated by governments. Swap rate curves are not affected by technical market factors that affect the yields on government bonds. Swap rate curves are also not subject to sovereign credit risk (potential government default on debt) that is unique to government debt in each country. Thus swap rate curves are more comparable across countries because they reflect similar levels of credit risk. There is also a wider variety of maturities available for swap rate curves, relative to a yield curve based on US Treasury securities, which has only four on-the-run maturities of two years or more. Swap rate curves typically have 11 quotes for maturities between 2 and 30 years.", "explhtml": "<p>Swap rate curves are typically determined by dollar denominated borrowing based on MRR. These rates are determined by market participants and are not regulated by governments. Swap rate curves are not affected by technical market factors that affect the yields on government bonds. Swap rate curves are also not subject to sovereign credit risk (potential government default on debt) that is unique to government debt in each country. Thus swap rate curves are more comparable across countries because they reflect similar levels of credit risk. There is also a wider variety of maturities available for swap rate curves, relative to a yield curve based on US Treasury securities, which has only four on-the-run maturities of two years or more. Swap rate curves typically have 11 quotes for maturities between 2 and 30 years.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 23.3, LOS 23.e<\/div><div class=\"qtext\"><p>Compared to a yield curve based on government bonds, swap rate curves are:<\/p><\/div>", "subj": "fixed"}, {"n": 60, "q": "Z-spread is most accurately described as the constant spread that is:", "opts": ["equal to the difference between a bond’s yield and the yield on a government bond.", "added to the spot rate curve to generate discount rates for each of the bond’s cash flows such that the present value of the cash flows is exactly equal to the market price of the bond.", "added to the zero volatility binomial tree such that an option-free bond is correctly valued."], "ans": "B", "expl": "Z-spread is the constant spread added to the spot rate curve to generate discount rates which then value the bond at its current market price. The difference between yields of a risky and government bond will be same as the Z-spread only when the yield curve is flat. A Zero-volatility binomial tree does not exist!", "explhtml": "<p>Z-spread is the constant spread added to the spot rate curve to generate discount rates which then value the bond at its current market price. The difference between yields of a risky and government bond will be same as the Z-spread only when the yield curve is flat. A Zero-volatility binomial tree does not exist!<\/p>", "qhtml": "<div class=\"pp-topic\">Module 23.4, LOS 23.g<\/div><div class=\"qtext\"><p>Z-spread is most accurately described as the constant spread that is:<\/p><\/div>", "subj": "fixed"}, {"n": 61, "q": "Prices of zero-coupon, $1 par bonds is shown below: Maturity (years) Price 1 $0.9615 2 $0.9070 3 $0.8396 4 $0.7629 The default risk of these bonds is similar to the default risk of surveyed banks based on which the swap rate is determined. Government yield curve is given below: Maturity (years) Rate 1 3.05% 2 4.10% 3 5.25% 4 6.45% The three-year swap spread is closest to:", "opts": ["110 bps.", "78 bps.", "67 bps."], "ans": "C", "expl": "The 3-year swap fixed rate SFR3 is determined by solving: SFR₃ (P₁ + P₂ + P₃) + P₃ = 1 or SFR₃ (0.9615 + 0.9070 + 0.8396) + 0.8396 = 1 SFR₃ (2.7081) = 0.1604 SFR₃ = 0.1604/2.7081 = 5.92% Swap spread = SFR₃ – 3-year government bond yield = 5.92% - 5.25% = 0.67% or 67 bps", "explhtml": "<p>The 3-year swap fixed rate SFR3 is determined by solving lowing?", "opts": ["Bearish flattening.", "Bullish flattening.", "Bearish steepening."], "ans": "B", "expl": "During periods of market turmoil, a flight to safety may reduce long-term government bond yields resulting in a bullish flattening of the yield curve.", "explhtml": "<p>During periods of market turmoil, a flight to safety may reduce long-term government bond yields resulting in a bullish flattening of the yield curve.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 23.6, LOS 23.k<\/div><div class=\"qtext\"><p>Investors may rotating money out of risky investments and into relatively safe investments during a financial crisis would most likely lead to which of the following?<\/p><\/div>", "subj": "fixed"}, {"n": 64, "q": "When the yield curve is downward sloping, the TED spread is most likely to be:", "opts": ["positive.", "zero.", "negative."], "ans": "A", "expl": "TED spread is defined as MRR minus T-bill yield and is expected to be positive to reflect the higher credit risk implied in MRR relative to T-bills. This would hold true regardless of the slope of the yield curve.", "explhtml": "<p>TED spread is defined as MRR minus T-bill yield and is expected to be positive to reflect the higher credit risk implied in MRR relative to T-bills. This would hold true regardless of the slope of the yield curve.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 23.4, LOS 23.g<\/div><div class=\"qtext\"><p>When the yield curve is downward sloping, the TED spread is most likely to be:<\/p><\/div>", "subj": "fixed"}, {"n": 65, "q": "What are the implications for the shape of the yield curve according to the liquidity theory? The yield curve:", "opts": ["may have any shape.", "is always flat.", "must be upward sloping."], "ans": "A", "expl": "The liquidity theory holds that investors demand a premium to compensate them to interest rate exposure and the premium increases with maturity. Even after adding the premium to a steep downward sloping yield curve the result will still be downward sloping.", "explhtml": "<p>The liquidity theory holds that investors demand a premium to compensate them to interest rate exposure and the premium increases with maturity. Even after adding the premium to a steep downward sloping yield curve the result will still be downward sloping.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 23.5, LOS 23.h<\/div><div class=\"qtext\"><p>What are the implications for the shape of the yield curve according to the liquidity theory? The yield curve:<\/p><\/div>", "subj": "fixed"}, {"n": 66, "q": "A bond portfolio has the following key rate durations: D₂ = 0.50; D₅ = 2.70 and D₁₅ = 7.23. Suppose that the change in yield curve results in changes in the following par rates: p₁ = +50bps; p₂= +100bps; p₅ = +25 bps; p₁₀ = -75bps; p₁₅ = −100bps. The change in the value of the portfolio will be closest to:", "opts": ["4.75%", "-2.80%", "6.06%"], "ans": "C", "expl": "%△P = −(0.50)(1.0) − (2.70)(0.25) − (7.23)(−1) = 6.06%", "explhtml": "<p>%△P = −(0.50)(1.0) − (2.70)(0.25) − (7.23)(−1) = 6.06%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 23.6, LOS 23.i<\/div><div class=\"qtext\"><p>A bond portfolio has the following key rate durations:<\/p><p>D<sub>2<\/sub> = 0.50; D<sub>5<\/sub> = 2.70 and D<sub>15<\/sub> = 7.23.<\/p><p>Suppose that the change in yield curve results in changes in the following par rates:<\/p><p>p<sub>1<\/sub> = +50bps; p<sub>2<\/sub>= +100bps; p<sub>5<\/sub> = +25 bps; p<sub>10<\/sub> = -75bps; p<sub>15<\/sub> = −100bps.<\/p><p>The change in the value of the portfolio will be closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 67, "q": "During the recent credit crises in the country of Maltovia, several money market funds reported large losses. Subsequently, the Maltovian regulatory body imposed strict restrictions on maturity of securities that money market funds could invest in. The reaction of Maltovian regulatory body was most likely based on a belief in:", "opts": ["market segmentation theory.", "local expectations theory.", "preferred habitat theory."], "ans": "C", "expl": "Money market funds generally invest in short-term securities. Their inclination to chase higher yields in the longer maturity spectrum is consistent with the preferred habitat theory whereby investors will leave their preferred habitat if they are compensated with higher returns. If Market segmentation theory held, investors would not have left their market segment and therefore no regulatory action would be necessary.", "explhtml": "<p>Money market funds generally invest in short-term securities. Their inclination to chase higher yields in the longer maturity spectrum is consistent with the preferred habitat theory whereby investors will leave their preferred habitat if they are compensated with higher returns. If Market segmentation theory held, investors would not have left their market segment and therefore no regulatory action would be necessary.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 23.5, LOS 23.h<\/div><div class=\"qtext\"><p>During the recent credit crises in the country of Maltovia, several money market funds reported large losses. Subsequently, the Maltovian regulatory body imposed strict restrictions on maturity of securities that money market funds could invest in. The reaction of Maltovian regulatory body was most likely based on a belief in:<\/p><\/div>", "subj": "fixed"}, {"n": 68, "q": "Which theory explains the shape of the yield curve by considering the relative demands for various maturities?", "opts": ["The segmentation theory.", "The pure expectations theory.", "The liquidity premium theory."], "ans": "A", "expl": "The market segmentation theory contends that lenders and borrowers have preferred maturity ranges, and that supply and demand forces in each maturity range determines yields. This theory relies on the idea that some investors have restrictions (either legal or practical) on their preferred maturity structure and that they are unwilling or unable to move out of their preferred ranges.", "explhtml": "<p>The market segmentation theory contends that lenders and borrowers have preferred maturity ranges, and that supply and demand forces in each maturity range determines yields. This theory relies on the idea that some investors have restrictions (either legal or practical) on their preferred maturity structure and that they are unwilling or unable to move out of their preferred ranges.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 23.5, LOS 23.h<\/div><div class=\"qtext\"><p>Which theory explains the shape of the yield curve by considering the relative demands for various maturities?<\/p><\/div>", "subj": "fixed"}, {"n": 69, "q": "With respect to local expectations theory, which of the following statements is most consistent with market evidence?", "opts": ["Short-term holding period return of long-maturity bonds and the short-term holding period return of short-maturity bonds is the same.", "Short-term holding period return of short-maturity bonds exceeds the short-term holding period returns of long-maturity bonds.", "Short-term holding period return of long-maturity bonds exceeds the short-term holding period returns of short-maturity bonds."], "ans": "C", "expl": "Market evidence shows that short-term holding period returns from investing in long-maturity bonds exceed the short-term holding period returns from investing in short-maturity bonds.", "explhtml": "<p>Market evidence shows that short-term holding period returns from investing in long-maturity bonds exceed the short-term holding period returns from investing in short-maturity bonds.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 23.5, LOS 23.h<\/div><div class=\"qtext\"><p>With respect to local expectations theory, which of the following statements is most consistent with market evidence?<\/p><\/div>", "subj": "fixed"}, {"n": 70, "q": "Which one of the following is least likely a reason to use the swap rate curve?", "opts": ["The swap market is not regulated by any government.", "Swap rates are less volatile than government bond yields.", "Swap rates reflect credit risk of commercial banks and not government."], "ans": "B", "expl": "Lower volatility of swap rates relative to government bond yields as a generalization is an incorrect statement.", "explhtml": "<p>Lower volatility of swap rates relative to government bond yields as a generalization is an incorrect statement.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 23.3, LOS 23.e<\/div><div class=\"qtext\"><p>Which one of the following is least likely a reason to use the swap rate curve?<\/p><\/div>", "subj": "fixed"}, {"n": 71, "q": "Which of the following best describes key rate duration? Key rate duration is determined by:", "opts": ["shifting the whole yield curve in a parallel manner.", "changing the yield of a specific maturity.", "changing the curvature of the entire yield curve."], "ans": "B", "expl": "Key rate duration can be defined as the approximate percentage change in the value of a bond or bond portfolio in response to a 100 basis point change in a key rate, holding all other rates constant, where every security or portfolio has a set of key rate durations, one for each key rate maturity point.", "explhtml": "<p>Key rate duration can be defined as the approximate percentage change in the value of a bond or bond portfolio in response to a 100 basis point change in a key rate, holding all other rates constant, where every security or portfolio has a set of key rate durations, one for each key rate maturity point.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 23.6, LOS 23.i<\/div><div class=\"qtext\"><p>Which of the following best describes key rate duration? Key rate duration is determined by:<\/p><\/div>", "subj": "fixed"}, {"n": 72, "q": "A portfolio manager who believed in the liquidity premium theory would expect:", "opts": ["short-term rates to be lower than investors’ expectations of short-term rates, because of the liquidity premium.", "long-term securities to offer higher returns than short-term securities.", "long-term rates to be higher than investors’ expectations of future rates, because of the liquidity premium."], "ans": "C", "expl": "The liquidity theory of the term structure proposes that forward rates reflect investors' expectations of future rates plus a liquidity premium to compensate them for exposure to interest rate risk, and this liquidity premium is positively related to maturity. The implication of the liquidity theory is that forward rates, since they include a liquidity premium, are a biased estimate of the market's expectation of future spot rates.", "explhtml": "<p>The liquidity theory of the term structure proposes that forward rates reflect investors&#x27; expectations of future rates plus a liquidity premium to compensate them for exposure to interest rate risk, and this liquidity premium is positively related to maturity. The implication of the liquidity theory is that forward rates, since they include a liquidity premium, are a biased estimate of the market&#x27;s expectation of future spot rates.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 23.5, LOS 23.h<\/div><div class=\"qtext\"><p>A portfolio manager who believed in the liquidity premium theory would expect:<\/p><\/div>", "subj": "fixed"}, {"n": 73, "q": "Independence Bank is a small retail bank that specializes in demand deposits and invests in CMO tranches. For the purpose of valuation of Independence Bank's assets and liabilities, the most appropriate reference yield curve would be:", "opts": ["government spot curve.", "swap rate curve.", "MRR-OIS curve."], "ans": "A", "expl": "While wholesale banks extensively hedge their assets and/or liabilities using the swap market, retail banks typically have very little exposure to the swap market. Accordingly, the government spot curve is most appropriate for retail banks while the swap rate curve may be most appropriate for wholesale banks.", "explhtml": "<p>While wholesale banks extensively hedge their assets and/or liabilities using the swap market, retail banks typically have very little exposure to the swap market. Accordingly, the government spot curve is most appropriate for retail banks while the swap rate curve may be most appropriate for wholesale banks.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 23.3, LOS 23.e<\/div><div class=\"qtext\"><p>Independence Bank is a small retail bank that specializes in demand deposits and invests in CMO tranches. For the purpose of valuation of Independence Bank&#x27;s assets and liabilities, the most appropriate reference yield curve would be:<\/p><\/div>", "subj": "fixed"}, {"n": 74, "q": "7.5%, 15-year, annual pay option-free Xeleon Corp bond trades at a market price of $95.72 per $100 par. The government spot rate curve is flat at 5%. Suppose that the Xeleon bond was callable in 10 years at par and an analyst computed the Z-spread on the bond ignoring the embedded option. Relative to the Z-spread on an option-free bond, the calculated Z-spread will most likely be:", "opts": ["lower.", "the same.", "higher."], "ans": "C", "expl": "Since a bond with an embedded call option would trade at a lower price than a comparable option-free bond (i.e., its market price would be lower), the additional spread needed to force the model value to the (lower) market price will be higher. Because the Z-spread would inadvertently include compensation for option risk as well as for credit and liquidity risks, it is not appropriate for valuing bonds with embedded options.", "explhtml": "<p>Since a bond with an embedded call option would trade at a lower price than a comparable option-free bond (i.e., its market price would be lower), the additional spread needed to force the model value to the (lower) market price will be higher. Because the Z-spread would inadvertently include compensation for option risk as well as for credit and liquidity risks, it is not appropriate for valuing bonds with embedded options.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 23.4, LOS 23.g<\/div><div class=\"qtext\"><p>7.5%, 15-year, annual pay option-free Xeleon Corp bond trades at a market price of $95.72 per $100 par. The government spot rate curve is flat at 5%.<\/p><p>Suppose that the Xeleon bond was callable in 10 years at par and an analyst computed the Z-spread on the bond ignoring the embedded option. Relative to the Z-spread on an option-free bond, the calculated Z-spread will most likely be:<\/p><\/div>", "subj": "fixed"}, {"n": 75, "q": "A swap spread is the difference between:", "opts": ["MRR and the fixed rate on the swap.", "the fixed rate on an interest rate swap and the rate on a Treasury bond of maturity equal to that of the swap.", "the fixed-rate and floating-rate payment rates at the inception of the swap."], "ans": "B", "expl": "A swap spread is the difference between the fixed rate on an interest rate swap and a Treasury bond of maturity equal to that of the swap.", "explhtml": "<p>A swap spread is the difference between the fixed rate on an interest rate swap and a Treasury bond of maturity equal to that of the swap.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 23.4, LOS 23.f<\/div><div class=\"qtext\"><p>A swap spread is the difference between:<\/p><\/div>", "subj": "fixed"}, {"n": 76, "q": "According to the liquidity theory, how are forward rates interpreted? Forward rates are:", "opts": ["expected future spot rate plus a rate exposure premium.", "equal to futures rates.", "expected future spot rates."], "ans": "A", "expl": "The liquidity theory of the term structure proposes that forward rates reflect investors' expectations of future rates plus a liquidity premium to compensate them for exposure to interest rate risk, and this liquidity premium is positively related to maturity. The implication of the liquidity theory is that forward rates are a biased estimate of the market's expectation of future rates, since they include a liquidity premium.", "explhtml": "<p>The liquidity theory of the term structure proposes that forward rates reflect investors&#x27; expectations of future rates plus a liquidity premium to compensate them for exposure to interest rate risk, and this liquidity premium is positively related to maturity. The implication of the liquidity theory is that forward rates are a biased estimate of the market&#x27;s expectation of future rates, since they include a liquidity premium.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 23.5, LOS 23.h<\/div><div class=\"qtext\"><p>According to the liquidity theory, how are forward rates interpreted? Forward rates are:<\/p><\/div>", "subj": "fixed"}, {"n": 77, "q": "Under the liquidity preference theory, expected future spot rates will most likely be:", "opts": ["Less than the current forward rate.", "More than the current forward rate.", "Equal to the current forward rate."], "ans": "A", "expl": "Existence of a liquidity premium under the liquidity preference theory implies that the current forward rate is an upwardly biased estimate of the future spot rate.", "explhtml": "<p>Existence of a liquidity premium under the liquidity preference theory implies that the current forward rate is an upwardly biased estimate of the future spot rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 23.5, LOS 23.h<\/div><div class=\"qtext\"><p>Under the liquidity preference theory, expected future spot rates will most likely be:<\/p><\/div>", "subj": "fixed"}, {"n": 78, "q": "Don McGuire, fixed income specialist at MCB bank makes the following statement: \"In the very short-term, the expected rate of return from investing in any bond, including risky bonds, is the risk-free rate of return\". McGuire's statement is most consistent with:", "opts": ["liquidity preference theory.", "unbiased expectations theory.", "local expectations theory."], "ans": "C", "expl": "Local expectations theory asserts that in the very short term, the expected return for every bond is the risk-free rate but does not extend the risk-neutrality assumption to every maturity strategy like the unbiased expectations theory.", "explhtml": "<p>Local expectations theory asserts that in the very short term, the expected return for every bond is the risk-free rate but does not extend the risk-neutrality assumption to every maturity strategy like the unbiased expectations theory.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 23.5, LOS 23.h<\/div><div class=\"qtext\"><p>Don McGuire, fixed income specialist at MCB bank makes the following statement: &quot;In the very short-term, the expected rate of return from investing in any bond, including risky bonds, is the risk-free rate of return&quot;.<\/p><p>McGuire&#x27;s statement is most consistent with:<\/p><\/div>", "subj": "fixed"}, {"n": 79, "q": "Which one of the following actions is most consistent with the strategy of riding an upward sloping the yield curve? Buying bonds with a maturity:", "opts": ["shorter than the investor’s horizon.", "longer than the investor’s horizon.", "equal to the investor’s horizon."], "ans": "B", "expl": "If the yield curve is upward sloping and is expected to remain the same, higher returns can be obtained by riding the yield curve, i.e., buying bonds with a longer maturity than the investor's horizon.", "explhtml": "<p>If the yield curve is upward sloping and is expected to remain the same, higher returns can be obtained by riding the yield curve, i.e., buying bonds with a longer maturity than the investor&#x27;s horizon.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 23.2, LOS 23.d<\/div><div class=\"qtext\"><p>Which one of the following actions is most consistent with the strategy of riding an upward sloping the yield curve? Buying bonds with a maturity:<\/p><\/div>", "subj": "fixed"}];

    let tbase = prev.tbase;

      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}

// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

  if(/alternative investment|private capital|private equity|private debt|hedge fund|real estate|\breit\b|\breits\b|infrastructure|natural resources|commodit(?:y|ies)|digital assets?|cryptocurrenc|bitcoin|collectibles|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption regime|pooled investment product|timberland|farmland/.test(prompt)) return "alternatives";
  if(/fixed-income|fixed income|bond\b|bonds\b|debt rating|corporate debt|credit rating|credit spread|creditworthiness|yield curve|yield spread|spot rate|forward rate|yield-to-maturity|yield to maturity|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|\bcds\b|repo market|central bank funds|covenant|accrued interest|priority of claims|default risk|extension risk/.test(prompt)) return "fixed";
  if(/portfolio|asset allocation|investment policy statement|\bips\b|behavioral finance|behavioral bias|cognitive error|risk aversion|utility function|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation between|covariance between|portfolio standard deviation|sharpe ratio|treynor ratio|jensen['’]?s alpha|information ratio|two-fund separation|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral investor/.test(prompt)) return "portfolio";
  return "equity";
}

const CFA_SESSION_SUBJECT_RANGES = {
  1:{ethics:[27,27],quant:[11,17],economics:[11,17],fsa:[20,25],corporate:[10,16]},
  2:{equity:[20,25],fixed:[20,25],derivatives:[9,14],alternatives:[11,16],portfolio:[14,22]}
};
const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,
  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,
  fsa:/financial statement|financial reporting|accounting|income statement|balance sheet|cash flow|revenue|expense|inventory|cost of sales|gross profit|gross margin|shareholders?['’]? equity|earnings per share|\beps\b|audit|gaap|ifrs|taxable income|deferred tax|temporary difference|intangible|long-lived|revaluation|impairment|amortization|depreciation|pension|financial ratio|receivables turnover|payables turnover|cash conversion|fixed charge coverage|normalized earnings|management['’]?s commentary/g,
  corporate:/corporate|company lifecycle|start-up|startup|early-stage|business model|franchise|board of directors|proxy voting|stakeholder|shareholder|creditor|governance|capital budgeting|capital investment|project|real option|\bnpv\b|internal rate of return|\birr\b|cost of debt|cost of capital|capital structure|weight of debt|modigliani|dividend policy|double taxation|principal-agent|working capital|liquidity|compensation|competitive strategy|porter|economies of scale|information asymmetry|agency relationship/g,
  equity:/equity|common share|preferred share|stock|market index|index weighting|market efficiency|efficient market|security market|buy order|sell order|limit order|dealer|margin requirement|leverage ratio|industry classification|company analysis|enterprise value|price-to|free cash flow to equity|\bfcfe\b|dividend discount|earnings multiplier|book value per share|intrinsic value|voting|ex-dividend/g,
  fixed:/fixed-income|fixed income|bond|debt|credit rating|credit spread|yield|spot rate|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|repo|covenant|accrued interest|priority of claims|default|extension risk|interest coverage/g,
  derivatives:/derivative|forward|future|swap|option|call buyer|call seller|put buyer|put seller|strike price|premium|put-call|binomial|contingent claim|moneyness|expiration|arbitrage|replication/g,
  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,
  portfolio:/portfolio|asset allocation|investment policy|\bips\b|behavioral|cognitive error|risk aversion|utility|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation|covariance|sharpe|treynor|jensen|information ratio|two-fund|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral/g
};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>

(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
