first 3 years and 5% thereafter, what is the value of UC stock?", "opts": ["$53.81.", "$46.89.", "$50.87."], "ans": "C", "expl": "D₁ = 2(1.10) = 2.20 D₂ = 2.20(1.10) = 2.42 D₃ = 2.42(1.10) = 2.662 D₄ = 2.662(1.05) = 2.795 V₃ = D₄ / (r − g) = (2.795) / (0.0972 − 0.05) = 59.22 V₀ = [2.20 / 1.0972] + [2.42 / (1.0972)²] + [(2.662 + 59.22) / (1.0972)³] = $50.87", "explhtml": "<p>D<sub>1<\/sub> = 2(1.10) = 2.20<\/p><p>D<sub>2<\/sub> = 2.20(1.10) = 2.42<\/p><p>D<sub>3<\/sub> = 2.42(1.10) = 2.662<\/p><p>D<sub>4<\/sub> = 2.662(1.05) = 2.795<\/p><p>V<sub>3<\/sub> = D<sub>4<\/sub> / (r − g)<\/p><p>= (2.795) / (0.0972 − 0.05)<\/p><p>= 59.22<\/p><p>V<sub>0<\/sub> = [2.20 / 1.0972] + [2.42 / (1.0972)<sup>2<\/sup>] + [(2.662 + 59.22) / (1.0972)<sup>3<\/sup>]<\/p><p>= $50.87<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 108–113<\/div> <div class=\"pp-topic\">Module 18.2, LOS 18.c<\/div><div class=\"qtext\"><p>Assuming a beta of 1.12, if UC is expected to have a growth rate of 10% for the first 3 years and 5% thereafter, what is the value of UC stock?<\/p><\/div>", "subj": "equity"}, {"n": 111, "q": "Assuming a beta of 1.12, if UC's growth rate is 10% initially and is expected to decline steadily to a stable rate of 5% over the next three years, what is the price of UC stock?", "opts": ["$47.67.", "$47.82.", "$46.61."], "ans": "A", "expl": "Given: D₀ = 2.00; gL = 0.05; gS = 0.10; H = (3 / 2) = 1.50; and r = 0.0972 V₀ = {[D₀(1 + gL)] + [D₀ × H × (gS − gL)]} / (r − gL) V₀ = [2(1.05) + 2(1.50)(0.10 − 0.05)] / (0.0972 − 0.05) = 2.25 / 0.0472 = $47.67", "explhtml": "<p>Given: D<sub>0<\/sub> = 2.00; g<sub>L<\/sub> = 0.05; g<sub>S<\/sub> = 0.10; H = (3 / 2) = 1.50; and r = 0.0972<\/p><p>V<sub>0<\/sub> = {[D<sub>0<\/sub>(1 + g<sub>L<\/sub>)] + [D<sub>0<\/sub> × H × (g<sub>S<\/sub> − g<sub>L<\/sub>)]} / (r − g<sub>L<\/sub>)<\/p><p>V<sub>0<\/sub> = [2(1.05) + 2(1.50)(0.10 − 0.05)] / (0.0972 − 0.05)<\/p><p>= 2.25 / 0.0472 = $47.67<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 108–113<\/div> <div class=\"pp-topic\">Module 18.2, LOS 18.c<\/div><div class=\"qtext\"><p>Assuming a beta of 1.12, if UC&#x27;s growth rate is 10% initially and is expected to decline steadily to a stable rate of 5% over the next three years, what is the price of UC stock?<\/p><\/div>", "subj": "equity"}, {"n": 112, "q": "The discounted dividend approach that we have used to value UC Inc. is most appropriate for valuing dividend-paying stocks in which:", "opts": ["free cash flow is negative.", "dividends differ substantially from FCFE.", "the investor takes a minority ownership perspective."], "ans": "C", "expl": "The discounted dividend approach is most appropriate for valuing dividend-paying stocks in a company that has an rational dividend policy with a clear relationship to the company's profitability, and where the investor takes a minority ownership (non-control) perspective. A free cash flow approach may be appropriate when a company's dividends differ significantly from FCFE. The residual income approach is most useful when a company's free cash flow is negative.", "explhtml": "<p>The discounted dividend approach is most appropriate for valuing dividend-paying stocks in a company that has an rational dividend policy with a clear relationship to the company&#x27;s profitability, and where the investor takes a minority ownership (non-control) perspective. A free cash flow approach may be appropriate when a company&#x27;s dividends differ significantly from FCFE. The residual income approach is most useful when a company&#x27;s free cash flow is negative.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 108–113<\/div> <div class=\"pp-topic\">Module 18.2, LOS 18.c<\/div><div class=\"qtext\"><p>The discounted dividend approach that we have used to value UC Inc. is most appropriate for valuing dividend-paying stocks in which:<\/p><\/div>", "subj": "equity"}, {"n": 113, "q": "UC Inc. had earnings of $3.00/share last year and a justified trailing P/E of 15.0. Is the stock currently overvalued, undervalued, or fairly valued if we consider a security trading within a band of ±10 percent of intrinsic value to be within a \"fair value range\"? At a market price of $40.38, UC Inc. is best described as:", "opts": ["fairly valued.", "undervalued.", "overvalued."], "ans": "B", "expl": "The justified trailing P/E or P₀/E₀ is V₀/E₀, where V₀ is the fair value based on the stock's fundamentals. The justified trailing P/E is given as 15, so the fair value V₀ based on an E₀ of $3.00 can be computed as 15 × 3.00 = $45.00. Thus at a market price of $40.38, UC Inc. is undervalued by slightly more than 10%.", "explhtml": "<p>The justified trailing P/E or P<sub>0<\/sub>/E<sub>0<\/sub> is V<sub>0<\/sub>/E<sub>0<\/sub>, where V<sub>0<\/sub> is the fair value based on the stock&#x27;s fundamentals. The justified trailing P/E is given as 15, so the fair value V<sub>0<\/sub> based on an E<sub>0<\/sub> of $3.00 can be computed as 15 × 3.00 = $45.00. Thus at a market price of $40.38, UC Inc. is undervalued by slightly more than 10%.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 108–113<\/div> <div class=\"pp-topic\">Module 18.2, LOS 18.c<\/div><div class=\"qtext\"><p>UC Inc. had earnings of $3.00/share last year and a justified trailing P/E of 15.0. Is the stock currently overvalued, undervalued, or fairly valued if we consider a security trading within a band of ±10 percent of intrinsic value to be within a &quot;fair value range&quot;? At a market price of $40.38, UC Inc. is best described as:<\/p><\/div>", "subj": "equity"}, {"n": 114, "q": "Jax, Inc., pays a current dividend of $0.52 and is projected to grow at 12%. If the required rate of return is 11%, what is the current value based on the Gordon growth model?", "opts": ["$58.24.", "unable to determine value using Gordon model.", "$39.47."], "ans": "B", "expl": "The Gordon growth model cannot be used if the growth rate exceeds the required rate of return.", "explhtml": "<p>The Gordon growth model cannot be used if the growth rate exceeds the required rate of return.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.c<\/div><div class=\"qtext\"><p>Jax, Inc., pays a current dividend of $0.52 and is projected to grow at 12%. If the required rate of return is 11%, what is the current value based on the Gordon growth model?<\/p><\/div>", "subj": "equity"}, {"n": 115, "q": "If an asset was fairly priced from an investor's point of view, the holding period return (HPR) would be:", "opts": ["equal to the alpha returns.", "the same as the required return.", "lower than the required return."], "ans": "B", "expl": "A fairly priced asset would be one that has an expected HPR just equal to the investor's required return.", "explhtml": "<p>A fairly priced asset would be one that has an expected HPR just equal to the investor&#x27;s required return.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.1, LOS 18.a<\/div><div class=\"qtext\"><p>If an asset was fairly priced from an investor&#x27;s point of view, the holding period return (HPR) would be:<\/p><\/div>", "subj": "equity"}, {"n": 116, "q": "Multi-stage dividend discount models can be used to estimate the value of shares:", "opts": ["only under a limited number of scenarios.", "only when the growth rate exceeds the required rate of return.", "under an almost infinite variety of scenarios."], "ans": "C", "expl": "Multi-stage dividend discount models are very flexible, allowing their use with an almost infinite variety of growth scenarios.", "explhtml": "<p>Multi-stage dividend discount models are very flexible, allowing their use with an almost infinite variety of growth scenarios.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.1, LOS 18.a<\/div><div class=\"qtext\"><p>Multi-stage dividend discount models can be used to estimate the value of shares:<\/p><\/div>", "subj": "equity"}, {"n": 117, "q": "Which of the following groups of statistics provides enough data to calculate an implied return for a stock using the two-stage DDM?", "opts": ["Short-term growth rate, long-term growth rate, stock price, trailing 12-month profits.", "P/E ratio, trailing 12-month profits, short-term PEG ratio, long-term PEG ratio, yield.", "Yield, stock price, historical dividend-growth rate, historical profit-growth rate."], "ans": "B", "expl": "To calculate an implied return using the two-stage DDM, we need the stock price, the dividend, a short-term growth rate, and a long-term growth rate. In the correct answer, we can derive the stock price from the P/E ratio and profits, then derive the dividend from the price and the yield. Given the P/E ratio, we can also distill growth rates using the PEG ratios. Admittedly, earnings-growth rates aren't the same as dividend-growth rates, but analysts routinely use either in their models. More to the point, this is the only answer in which we can come up with even imperfect data for all the needed variables. One choice does not provide us with a way to find the dividend. The other option does not give us the needed short-term and long-term growth rates.", "explhtml": "<p>To calculate an implied return using the two-stage DDM, we need the stock price, the dividend, a short-term growth rate, and a long-term growth rate. In the correct answer, we can derive the stock price from the P/E ratio and profits, then derive the dividend from the price and the yield. Given the P/E ratio, we can also distill growth rates using the PEG ratios. Admittedly, earnings-growth rates aren&#x27;t the same as dividend-growth rates, but analysts routinely use either in their models. More to the point, this is the only answer in which we can come up with even imperfect data for all the needed variables. One choice does not provide us with a way to find the dividend. The other option does not give us the needed short-term and long-term growth rates.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.i<\/div><div class=\"qtext\"><p>Which of the following groups of statistics provides enough data to calculate an implied return for a stock using the two-stage DDM?<\/p><\/div>", "subj": "equity"}, {"n": 118, "q": "Multi-stage growth models can become computationally intensive. For this reason they are often referred to as:", "opts": ["spreadsheet models.", "R-squared models.", "quadratic models."], "ans": "A", "expl": "The computationally intensive nature of these models make them a perfect application for a spreadsheet program, hence the name spreadsheet models.", "explhtml": "<p>The computationally intensive nature of these models make them a perfect application for a spreadsheet program, hence the name spreadsheet models.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.1, LOS 18.a<\/div><div class=\"qtext\"><p>Multi-stage growth models can become computationally intensive. For this reason they are often referred to as:<\/p><\/div>", "subj": "equity"}, {"n": 119, "q": "Which of the following dividend discount models assumes a high growth rate with a linear decline to a lower stable growth rate?", "opts": ["Three-stage dividend discount model.", "H model.", "Gordon growth model."], "ans": "B", "expl": "The H model assumes a high growth rate during the initial stage, followed by a linear decline to a lower stable growth rate. It also assumes that the payout ratio is constant over time.", "explhtml": "<p>The H model assumes a high growth rate during the initial stage, followed by a linear decline to a lower stable growth rate. It also assumes that the payout ratio is constant over time.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.l<\/div><div class=\"qtext\"><p>Which of the following dividend discount models assumes a high growth rate with a linear decline to a lower stable growth rate?<\/p><\/div>", "subj": "equity"}, {"n": 120, "q": "Which of the following dividend discount models (DDMs) is most appropriate for modeling a mature company?", "opts": ["H-model.", "Gordon growth model.", "Two-stage DDM."], "ans": "B", "expl": "The Gordon growth model assumes that dividends grow at a constant rate forever. It is most suited for mature companies with low to moderate growth rates and well-established dividend payout policies.", "explhtml": "<p>The Gordon growth model assumes that dividends grow at a constant rate forever. It is most suited for mature companies with low to moderate growth rates and well-established dividend payout policies.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.e<\/div><div class=\"qtext\"><p>Which of the following dividend discount models (DDMs) is most appropriate for modeling a mature company?<\/p><\/div>", "subj": "equity"}, {"n": 121, "q": "What is the difference between a standard two-stage growth model and the H-model?", "opts": ["The H-model assumes a terminal value, while the standard two-stage model does not.", "The H-model assumes that earnings will dip in the middle of each stage and return to the previous rate by the period's end.", "In the standard two-stage model, a fixed rate of growth is assumed for each stage, while the H-model assumes a linearly declining rate of growth in one stage."], "ans": "C", "expl": "The H-model provides an estimate of the firm's value based on the assumption that the rate of growth will change linearly over the initial stage.", "explhtml": "<p>The H-model provides an estimate of the firm&#x27;s value based on the assumption that the rate of growth will change linearly over the initial stage.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.l<\/div><div class=\"qtext\"><p>What is the difference between a standard two-stage growth model and the H-model?<\/p><\/div>", "subj": "equity"}, {"n": 122, "q": "If the value of an 8%, fixed-rate, perpetual preferred share is $134, the risk free rate is 3%, and the par value is $100, the required rate of return is closest to:", "opts": ["6%.", "7%.", "9%."], "ans": "A", "expl": "The required rate of return is 6%: V₀ = ($100par × 8%) / r = $134, r = 5.97%", "explhtml": "<p>The required rate of return is 6%: V<sub>0<\/sub> = ($100par × 8%) / r = $134, r = 5.97%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.d<\/div><div class=\"qtext\"><p>If the value of an 8%, fixed-rate, perpetual preferred share is $134, the risk free rate is 3%, and the par value is $100, the required rate of return is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 123, "q": "The volatility of equity returns requires us to use data from long time periods to compute mean returns. One problem that this causes is that:", "opts": ["inflation alters the value of the past returns.", "the past is rarely an indication of the future.", "equity premiums vary over time with perceived risk."], "ans": "C", "expl": "The primary problem with using returns gathered over a long time period is that equity premiums vary over time with the market's perception of risk and relative risk.", "explhtml": "<p>The primary problem with using returns gathered over a long time period is that equity premiums vary over time with the market&#x27;s perception of risk and relative risk.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.1, LOS 18.a<\/div><div class=\"qtext\"><p>The volatility of equity returns requires us to use data from long time periods to compute mean returns. One problem that this causes is that:<\/p><\/div>", "subj": "equity"}, {"n": 124, "q": "Demonstrate the use of the DuPont analysis of return on equity in conjunction with the sustainable growth rate expression. The following statistics are selected from Kyle Star Partners (Kyle) financial statements: Sales $100 million Net Income $15 million Dividends $5 million Total Assets $150 million Total Equity $50 million What is Kyle's sustainable growth rate?", "opts": ["20.0%.", "33.3%.", "24.5%."], "ans": "A", "expl": "SGR = ROE × [(net income − dividends) / net income] = (15 million / 50 million) × (15 million − 5 million) / 15 million = 20.0%", "explhtml": "<p>SGR<\/p><p>= ROE × [(net income − dividends) / net income]<\/p><p>= (15 million / 50 million) × (15 million − 5 million) / 15 million<\/p><p>= 20.0%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.p<\/div><div class=\"qtext\"><p>Demonstrate the use of the DuPont analysis of return on equity in conjunction with the sustainable growth rate expression.<\/p><p>The following statistics are selected from Kyle Star Partners (Kyle) financial statements:<\/p><div class=\"tbl\"><table><tr><td>Sales<\/td><td>$100 million<\/td><\/tr><tr><td>Net Income<\/td><td>$15 million<\/td><\/tr><tr><td>Dividends<\/td><td>$5 million<\/td><\/tr><tr><td>Total Assets<\/td><td>$150 million<\/td><\/tr><tr><td>Total Equity<\/td><td>$50 million<\/td><\/tr><\/table><\/div><p>What is Kyle&#x27;s sustainable growth rate?<\/p><\/div>", "subj": "equity"}, {"n": 125, "q": "The Gordon growth model is most likely to produce useful results when the dividend growth rate is:", "opts": ["greater than the required rate of return.", "equal to the required rate of return.", "negative."], "ans": "C", "expl": "The Gordon growth model P₀ = DPS₁/ (r - g) will not work if the growth rate is greater than or equal to the required rate of return. Negative growth rates are acceptable in the Gordon growth model.", "explhtml": "<p>The Gordon growth model P<sub>0<\/sub> = DPS<sub>1<\/sub>/ (r - g) will not work if the growth rate is greater than or equal to the required rate of return. Negative growth rates are acceptable in the Gordon growth model.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.e<\/div><div class=\"qtext\"><p>The Gordon growth model is most likely to produce useful results when the dividend growth rate is:<\/p><\/div>", "subj": "equity"}, {"n": 126, "q": "Q-Partners is expected to have earnings in ten years of $12 per share, a dividend payout ratio of 50%, and a required return of 11%. At that time, ROE is expected to fall to 8% in perpetuity and the traili wth would result in:<\/p><\/div>", "subj": "equity"}, {"n": 130, "q": "GreenGrow, Inc., has current dividends of $2.00, current earnings of $4.00 and a return on equity of 16%. What is GreenGrow's sustainable growth rate?", "opts": ["8%.", "6%.", "9%."], "ans": "A", "expl": "GreenGrow's sustainable growth rate is 8%. g = [1 – ($2/$4)](0.16) = 8%", "explhtml": "<p>GreenGrow&#x27;s sustainable growth rate is 8%.<\/p><p>g = [1 – ($2/$4)](0.16) = 8%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.p<\/div><div class=\"qtext\"><p>GreenGrow, Inc., has current dividends of $2.00, current earnings of $4.00 and a return on equity of 16%. What is GreenGrow&#x27;s sustainable growth rate?<\/p><\/div>", "subj": "equity"}, {"n": 131, "q": "A firm has the following characteristics: Current share price $100.00. Next year's earnings $3.50. Next year's dividend $0.75. Growth rate 11%. Required return 13%. Based on this information and the Gordon growth model, what is the firm's justified leading price to earnings (P/E) ratio?", "opts": ["11.3.", "8.7.", "10.7."], "ans": "C", "expl": "The justified leading P/E is 10.7: P₀ / E₁ = (D₁ / E₁) / (r−g) = ($0.75 / $3.50) / (0.13 – 0.11) = 10.71", "explhtml": "<p>The justified leading P/E is 10.7:<\/p><p>P<sub>0<\/sub> / E<sub>1<\/sub> = (D<sub>1<\/sub> / E<sub>1<\/sub>) / (r−g) = ($0.75 / $3.50) / (0.13 – 0.11) = 10.71<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.h<\/div><div class=\"qtext\"><p>A firm has the following characteristics:<\/p><p>Current share price $100.00. Next year&#x27;s earnings $3.50. Next year&#x27;s dividend $0.75. Growth rate 11%. Required return 13%.<\/p><p>Based on this information and the Gordon growth model, what is the firm&#x27;s justified leading price to earnings (P/E) ratio?<\/p><\/div>", "subj": "equity"}, {"n": 132, "q": "If Cantel, Inc., has current earnings of $17, dividends of $3.50, and a sustainable growth rate of 11%, what is its return on equity (ROE)?", "opts": ["11.91%.", nt model ROE = (NI/EBT)(EBT/EBIT)(EBIT/sales)(sales/assets)(assets/equity), the product of the first three terms is:<\/p><\/div>", "subj": "equity"}, {"n": 135, "q": "The H model will NOT be very useful when:", "opts": ["a firm is growing rapidly.", "a firm has low or no dividends currently.", "a firm has a constant payout policy."], "ans": "B", "expl": "The H model is useful for firms that are growing rapidly but the growth is expected to decline gradually over time as the firm gets larger and faces increased competition. The assumption of constant payout ratio makes the model inappropriate for firms that have low or no dividend currently.", "explhtml": "<p>The H model is useful for firms that are growing rapidly but the growth is expected to decline gradually over time as the firm gets larger and faces increased competition. The assumption of constant payout ratio makes the model inappropriate for firms that have low or no dividend currently.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.1, LOS 18.a<\/div><div class=\"qtext\"><p>The H model will NOT be very useful when:<\/p><\/div>", "subj": "equity"}];
const CFG = {"title": "Reading 18 — Discounted Dividend Valuation", "subtitle": "CFA Level II · 135 câu · Kaplan Schweser QBank 2025 (109 câu đơn · 26 câu item set)", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";

  renderSubjectBreakdown();
  setSubmitButtonMode(true);

const CFA_SESSION_SUBJECT_RANGES = {

  2:{equity:[20,25],fixed:[20,25],derivatives:[9,14],alternatives:[11,16],portfolio:[14,22]}
};
const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,
  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,
  fsa:/financial statement|financial reporting|accounting|income statement|balance sheet|cash flow|revenue|expense|inventory|cost of sales|gross profit|gross margin|shareholders?['’]? equity|earnings per share|\beps\b|audit|gaap|ifrs|taxable income|deferred tax|temporary difference|intangible|long-lived|revaluation|impairment|amortization|depreciation|pension|financial ratio|receivables turnover|payables turnover|cash conversion|fixed charge coverage|normalized earnings|management['’]?s commentary/g,

  fixed:/fixed-income|fixed income|bond|debt|credit rating|credit spread|yield|spot rate|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|repo|covenant|accrued interest|priority of claims|default|extension risk|interest coverage/g,
  derivatives:/derivative|forward|future|swap|option|call buyer|call seller|put buyer|put seller|strike price|premium|put-call|binomial|contingent claim|moneyness|expiration|arbitrage|replication/g,
  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,

};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();

    el.appendChild(s);
  }
  function showResult(pass, badgeText, celebrate){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      if(celebrate){ fetchEmoji('face-positive', emoji); confetti(); }
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  if(graded) window.showGradedResult();

  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">

    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
