rces of competition begin to deny it opportunities to earn greater than the required return. Faced with this situation, most earnings are distributed to shareholders as dividends. An alternate way of returning capital is through stock repurchases.", "explhtml": "<p>As a firm matures, the forces of competition begin to deny it opportunities to earn greater than the required return. Faced with this situation, most earnings are distributed to shareholders as dividends. An alternate way of returning capital is through stock repurchases.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.k<\/div><div class=\"qtext\"><p>In which of the following stages is a firm most likely to distribute the highest proportion of its earnings in the form of dividends?<\/p><\/div>", "subj": "equity"}, {"n": 54, "q": "Using the Gordon growth model (GGM), what is the equity risk premium?", "opts": ["2.75%.", "3.25%.", "5.50%."], "ans": "A", "expl": "The GGM calculates the risk premium using forward-looking or expectational data. The equity risk premium is estimated as the one-year forecasted dividend yield on market index, plus the consensus long-term earnings growth rate, minus the long-term government bond yield. Note that because equities are assumed to have a long duration, the long-term government bond yield serves as the proxy for the risk-free rate. Equity risk premium = 1.75% + 5.25% − 4.25% = 2.75%", "explhtml": "<p>The GGM calculates the risk premium using forward-looking or expectational data. The equity risk premium is estimated as the one-year forecasted dividend yield on market index, plus the consensus long-term earnings growth rate, minus the long-term government bond yield. Note that because equities are assumed to have a long duration, the long-term government bond yield serves as the proxy for the risk-free rate.<\/p><p>Equity risk premium = 1.75% + 5.25% − 4.25% = 2.75%<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 54–57<\/div> <div class=\"pp-topic\">Module 18.1, LOS 18.a<\/div><div class=\"kq-note\">Câu thuộc item set (câu 54–57). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Using the Gordon growth model (GGM), what is the equity risk premium?<\/p><\/div>", "subj": "equity"}, {"n": 55, "q": "Davidson needs to determine if the shares of Wellborn are currently undervalued or overvalued in the market relative to the shares' fundamental value. The estimated fair value of Wellborn shares, using a two-period dividend discount model (DDM), is:", "opts": ["$27.69.", "$27.58.", "$25.29."], "ans": "C", "expl": "The value of Wellborn using a two-period DDM is: ($1.25 / 1.095) + (($1.45 + $27.50) / 1.095²) = $25.29", "explhtml": "<p>The value of Wellborn using a two-period DDM is:<\/p><p>($1.25 / 1.095) + (($1.45 + $27.50) / 1.095<sup>2<\/sup>) = $25.29<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 54–57<\/div> <div class=\"pp-topic\">Module 18.1, LOS 18.a<\/div><div class=\"qtext\"><p>Davidson needs to determine if the shares of Wellborn are currently undervalued or overvalued in the market relative to the shares&#x27; fundamental value. The estimated fair value of Wellborn shares, using a two-period dividend discount model (DDM), is:<\/p><\/div>", "subj": "equity"}, {"n": 56, "q": "As a part of her analysis, Davidson needs to calculate return on equity for both potential investments. What is last year's return on equity (ROE) for Samson shares?", "opts": ["6.5%.", "3.5%.", "9.5%."], "ans": "C", "expl": "ROE can be calculated using the DuPont formula, which is: ROE = Net Income / Stockholder's Equity ROE = (net income / sales) × (sales / total assets) × (total assets / stockholders' equity) Therefore: ROE = (5,700,000 / 75,000,000) × (75,000,000 / 135,000,000) × (135,000,000 / 60,000,000) = (0.076) × (0.556) × (2.25) = 0.095 = 9.5%.", "explhtml": "<p>ROE can be calculated using the DuPont formula, which is:<\/p><p>ROE = Net Income / Stockholder&#x27;s Equity<\/p><p>ROE = (net income / sales) × (sales / total assets) × (total assets / stockholders&#x27; equity)<\/p><p>Therefore: ROE = (5,700,000 / 75,000,000) × (75,000,000 / 135,000,000) × (135,000,000 / 60,000,000) = (0.076) × (0.556) × (2.25) = 0.095 = 9.5%.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 54–57<\/div> <div class=\"pp-topic\">Module 18.1, LOS 18.a<\/div><div class=\"qtext\"><p>As a part of her analysis, Davidson needs to calculate return on equity for both potential investments. What is last year&#x27;s return on equity (ROE) for Samson shares?<\/p><\/div>", "subj": "equity"}, {"n": 57, "q": "Davidson determines that over the past three years, Samson has maintained an average net profit margin of 8 percent, a total asset turnover of 1.6, and a leverage ratio (equity multiplier) of 1.39. Assuming Samson continues to distribute 35 percent of its earnings as dividends, Samson's estimated sustainable growth rate (SGR) is:", "opts": ["6.2%.", "17.8%.", "11.6%."], "ans": "C", "expl": "Utilizing the PRAT model, where SGR is a function of profit margin (P), the retention rate (R), asset turnover (A) and financial leverage (T): g = P × R × A × T g = 0.08 × (1 − 0.35) × 1.6 × 1.39 = 0.116 = 11.6%.", "explhtml": "<p>Utilizing the PRAT model, where SGR is a function of profit margin (P), the retention rate (R), asset turnover (A) and financial leverage (T):<\/p><p>g = P × R × A × T<\/p><p>g = 0.08 × (1 − 0.35) × 1.6 × 1.39 = 0.116 = 11.6%.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 54–57<\/div> <div class=\"pp-topic\">Module 18.1, LOS 18.a<\/div><div class=\"qtext\"><p>Davidson determines that over the past three years, Samson has maintained an average net profit margin of 8 percent, a total asset turnover of 1.6, and a leverage ratio (equity multiplier) of 1.39. Assuming Samson continues to distribute 35 percent of its earnings as dividends, Samson&#x27;s estimated sustainable growth rate (SGR) is:<\/p><\/div>", "subj": "equity"}, {"n": 58, "q": "Given an equity risk premium of 3.5%, a forecasted dividend yield of 2.5% on the market index and a U.S. government bond yield of 4.5%, what is the consensus long-term earnings growth estimate?", "opts": ["10.5%.", "8.0%.", "5.5%."], "ans": "C", "expl": "Equity risk premium = forecasted dividend yield + consensus long term earnings growth rate – long-term government bond yield. Therefore, Consensus long term earnings growth rate = Equity risk premium - forecasted dividend yield + long-term government bond yield Consensus long term earnings growth rate = 3.5% - 2.5% + 4.5% = 5.5%", "explhtml": "<p>Equity risk premium = forecasted dividend yield + consensus long term earnings growth rate – long-term government bond yield.<\/p><p>Therefore,<\/p><p>Consensus long term earnings growth rate =<\/p><p>Equity risk premium - forecasted dividend yield + long-term government bond yield<\/p><p>Consensus long term earnings growth rate = 3.5% - 2.5% + 4.5% = 5.5%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.i<\/div><div class=\"qtext\"><p>Given an equity risk premium of 3.5%, a forecasted dividend yield of 2.5% on the market index and a U.S. government bond yield of 4.5%, what is the consensus long-term earnings growth estimate?<\/p><\/div>", "subj": "equity"}, {"n": 59, "q": "Relative to traditional financial models like the dividend discount model, the biggest advantage of spreadsheet modeling is:", "opts": ["accuracy of computations.", "simplicity of computations.", "quantity of computations."], "ans": "C", "expl": "Computations are no simpler or more complicated on a spreadsheet as opposed to a calculator. Accuracy tends to be improved with the use of a spreadsheet, because you don't have to punch numbers into a calculator at any stage. However, someone truly concerned with accuracy can do a fine job with a calculator. The spreadsheet stands out when it comes to quantity. Analysts can program many permutations and scenarios into a spreadsheet, using minutes to do what would take hours or even days or weeks with a calculator.", "explhtml": "<p>Computations are no simpler or more complicated on a spreadsheet as opposed to a calculator. Accuracy tends to be improved with the use of a spreadsheet, because you don&#x27;t have to punch numbers into a calculator at any stage. However, someone truly concerned with accuracy can do a fine job with a calculator. The spreadsheet stands out when it comes to quantity. Analysts can program many permutations and scenarios into a spreadsheet, using minutes to do what would take hours or even days or weeks with a calculator.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.o<\/div><div class=\"qtext\"><p>Relative to traditional financial models like the dividend discount model, the biggest advantage of spreadsheet modeling is:<\/p><\/div>", "subj": "equity"}, {"n": 60, "q": "Supergro has current dividends of $1, current earnings of $3, and a return on equity of 16%, what is its sustainable growth rate?", "opts": ["12.2%.", "10.7%.", "8.9%."], "ans": "B", "expl": "g = (1 – 1/3)(0.16) = 0.107", "explhtml": "<p>g = (1 – 1/3)(0.16) = 0.107<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.p<\/div><div class=\"qtext\"><p>Supergro has current dividends of $1, current earnings of $3, and a return on equity of 16%, what is its sustainable growth rate?<\/p><\/div>", "subj": "equity"}, {"n": 61, "q": "Zephraim Axelrod, CFA, is trying to determine whether Allegheny Mining is a good investment. He decides to use the Gordon Growth model to calculate how much dividend growth shareholders can expect. To that end, he determines the following: Share price: $18.12. Dividend: $0.32 per share. Beta: 1.94. Industry average estimated returns: 15%. Risk-free rate: 5.5%. Equity risk premium: 6.3% Based only on the information above, the implied dividend growth rate is closest to:", "opts": ["15.68%.", "19.89%.", "10.27%."], "ans": "A", "expl": "We have the price and dividend. We need the required rate of return to use the Gordon Growth model to calculate implied dividend growth. Using the capital asset pricing model, the required return = risk-free rate + (beta × equity risk premium) = 17.72%. Price = [dividend × (1 + dividend growth rate)] / [required return − growth rate] 18.12 = [0.32 × (1 + dividend growth rate)] / [0.1772 − dividend growth rate] 18.12 × [0.1772 − dividend growth rate] = 0.32 + 0.32 × dividend growth rate 3.2112 − 18.12 × dividend growth rate = 0.32 + 0.32 × dividend growth rate 2.8912 = 18.44 × dividend growth rate 1 = 6.3779 × dividend growth rate Dividend growth rate = 15.68%", "explhtml": "<p>We have the price and dividend. We need the required rate of return to use the Gordon Growth model to calculate implied dividend growth. Using the capital asset pricing model, the required return = risk-free rate + (beta × equity risk premium) = 17.72%.<\/p><p>Price = [dividend × (1 + dividend growth rate)] / [required return − growth rate]<\/p><p>18.12 = [0.32 × (1 + dividend growth rate)] / [0.1772 − dividend growth rate]<\/p><p>18.12 × [0.1772 − dividend growth rate] = 0.32 + 0.32 × dividend growth rate<\/p><p>3.2112 − 18.12 × dividend growth rate = 0.32 + 0.32 × dividend growth rate<\/p><p>2.8912 = 18.44 × dividend growth rate<\/p><p>1 = 6.3779 × dividend growth rate<\/p><p>Dividend growth rate = 15.68%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.f<\/div><div class=\"qtext\"><p>Zephraim Axelrod, CFA, is trying to determine whether Allegheny Mining is a good investment. He decides to use the Gordon Growth model to calculate how much dividend growth shareholders can expect. To that end, he determines the following:<\/p><p>Share price: $18.12. Dividend: $0.32 per share. Beta: 1.94. Industry average estimated returns: 15%. Risk-free rate: 5.5%. Equity risk premium: 6.3%<\/p><p>Based only on the information above, the implied dividend growth rate is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 62, "q": "Which of the following models would be most appropriate for a firm that is expected to grow at an initial rate of 10%, declining steadily to 6% over a period of five years, and to remain steady at 6% thereafter?", "opts": ["The H-model.", "The Gordon growth model.", "A two-stage model."], "ans": "A", "expl": "The H-model is the best answer, as it avoids an immediate drop to 6% like a two-stage would. The Gordon growth model would not be appropriate.", "explhtml": "<p>The H-model is the best answer, as it avoids an immediate drop to 6% like a two-stage would. The Gordon growth model would not be appropriate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.l<\/div><div class=\"qtext\"><p>Which of the following models would be most appropriate for a firm that is expected to grow at an initial rate of 10%, declining steadily to 6% over a period of five years, and to remain steady at 6% thereafter?<\/p><\/div>", "subj": "equity"}, {"n": 63, "q": "Calculate the value of a share of Jakzach equity on 31 December 20x6, using the Gordon growth dividend model and the capital asset pricing model.", "opts": ["$20.00.", "$22.40.", "$211.68."], "ans": "B", "expl": "The value of a share of Jakzach equity using the Gordon growth model and the capital asset pricing model is $22.40. The value is calculated as follows: Calculate the required rate of return using the capital asset pricing model. = Rf + beta × (E(Rₘ) – Rf) r Rf  = 4.0% E(Rₘ) = 9.0% Beta  = 1.8 r  = 4.0% + 1.8 × (9.0% – 4.0%) r  = 13.0% Calculate the share value using the Gordon growth model. D₀ = $0.20 g  = 12.0% r  = 13.0% V₀  = (D₀ × (1 + g)) / (r – g) V₀  = ($0.20 × (1 + 0.12)) / (0.13 – 0.12) V₀  = $22.40 Professor's Note: You are given the dividend per share ($0.20) in Exhibit 4, but you are also given total dividends in millions of $ ($3.20). It would have been very easy to mistake total dividends for dividends per share and arrive at the wrong answer.", "explhtml": "<p>The value of a share of Jakzach equity using the Gordon growth model and the capital asset pricing model is $22.40.<\/p><p>The value is calculated as follows:<\/p><p>Calculate the required rate of return using the capital asset pricing model.<\/p><p>= R<sub>f<\/sub> + beta × (E(R<sub>m<\/sub>) – R<sub>f<\/sub>)<\/p><p>r R<sub>f<\/sub> &nbsp; = 4.0%<\/p><p>E(R<sub>m<\/sub>) = 9.0% Beta &nbsp; = 1.8 r &nbsp; = 4.0% + 1.8 × (9.0% – 4.0%) r &nbsp; = 13.0%<\/p><p>Calculate the share value using the Gordon growth model.<\/p><p>D<sub>0<\/sub> = $0.20 g &nbsp; = 12.0% r &nbsp; = 13.0% V<sub>0<\/sub> &nbsp; = (D<sub>0<\/sub> × (1 + g)) / (r – g) V<sub>0<\/sub> &nbsp; = ($0.20 × (1 + 0.12)) / (0.13 – 0.12) V<sub>0<\/sub> &nbsp; = $22.40<\/p><p>Professor&#x27;s Note: You are given the dividend per share ($0.20) in Exhibit 4, but you are also given total dividends in millions of $ ($3.20). It would have been very easy to mistake total dividends for dividends per share and arrive at the wrong answer.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 63–66<\/div> <div class=\"pp-topic\">Module 18.2, LOS 18.c<\/div><div class=\"kq-note\">Câu thuộc item set (câu 63–66). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Calculate the value of a share of Jakzach equity on 31 December 20x6, using the Gordon growth dividend model and the capital asset pricing model.<\/p><\/div>", "subj": "equity"}, {"n": 64, "q": "Calculate the profit margin component of Jakzach's return on equity for the year 20x6.", "opts": ["8.70%.", "10.03%.", "19.91%."], "ans": "B", "expl": "See answer 3.", "explhtml": "<p>See answer 3.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 63–66<\/div> <div class=\"pp-topic\">Module 18.3, LOS 18.p<\/div><div class=\"qtext\"><p>Calculate the profit margin component of Jakzach&#x27;s return on equity for the year 20x6.<\/p><\/div>", "subj": "equity"}, {"n": 65, "q": "Calculate the asset turnover component of Jakzach's return on equity for the year 20x6. Note: Your calculations should use 20x6 beginning-of-year balance sheet values.", "opts": ["0.53.", "0.56.", "0.94."], "ans": "B", "expl": "The three components of Jakzach's return on equity, using the DuPont model and net income, are: Profit margin  = 10.03% Asset turnover  = 0.56 Financial leverage = 2.00 The components are calculated as follows: Net income  = $30.16 million Sales  = $300.80 million Total assets  = $541.40 million Beginning equity = $270.35 million Profit margin = net income / sales = $30.16 / $300.80 = 10.03% Asset turnover = sales / total assets = $300.80 / $541.40 = 0.56 Financial leverage = total assets / beginning equity = $541.40 / $270.35 = 2.00 Professor's Note: The default position when calculating ROE is to use opening balance sheet values in equity analysis. This contrasts with the use of average in financial reporting analysis. In equity analysis, we are concerned with the return generated on the net assets in place at the start of the year.", "explhtml": "<p>The three components of Jakzach&#x27;s return on equity, using the DuPont model and net income, are: Profit margin &nbsp; = 10.03% Asset turnover &nbsp; = 0.56<\/p><p>Financial leverage = 2.00<\/p><p>The components are calculated as follows: Net income &nbsp; = $30.16 million Sales &nbsp; = $300.80 million Total assets &nbsp; = $541.40 million<\/p><p>Beginning equity = $270.35 million<\/p><p>Profit margin = net income / sales = $30.16 / $300.80 = 10.03%<\/p><p>Asset turnover = sales / total assets = $300.80 / $541.40 = 0.56<\/p><p>Financial leverage = total assets / beginning equity = $541.40 / $270.35 = 2.00<\/p><p>Professor&#x27;s Note: The default position when calculating ROE is to use opening balance sheet values in equity analysis. This contrasts with the use of average in financial reporting analysis. In equity analysis, we are concerned with the return generated on the net assets in place at the start of the year.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 63–66<\/div> <div class=\"pp-topic\">Module 18.3, LOS 18.p<\/div><div class=\"qtext\"><p>Calculate the asset turnover component of Jakzach&#x27;s return on equity for the year 20x6. Note: Your calculations should use 20x6 beginning-of-year balance sheet values.<\/p><\/div>", "subj": "equity"}, {"n": 66, "q": "Calculate the sustainable growth rate of Jakzach on 31 December 20x6. Note: Your calculations should use 20x6 beginning-of-year balance sheet values.", "opts": ["1%.", "9%.", "10%."], "ans": "C", "expl": "The sustainable growth rate of Jakzach is 9.97%, calculated as follows: g = b × ROE = earnings retention rate × ROE = (1 – payout ratio) × ROE = (1 – dividends / net income) × (net income / beginning equity) = (1 – ($3.20 / $30.16)) × ($30.16 / $270.35) = 0.0997 g = 9.97% Using DuPont model results from above and per share data provided in question: Payout ratio = $0.20 / $1.89= 10.58% ROE  = 10.03% × 0.56 × 2.00 = 11.23% g  = (1 – 0.1058) × 11.23% = 10.04% g  = 10.04%", "explhtml": "<p>The sustainable growth rate of Jakzach is 9.97%, calculated as follows:<\/p><p>g = b × ROE = earnings retention rate × ROE<\/p><p>= (1 – payout ratio) × ROE<\/p><p>= (1 – dividends / net income) × (net income / beginning equity)<\/p><p>= (1 – ($3.20 / $30.16)) × ($30.16 / $270.35)<\/p><p>= 0.0997<\/p><p>g = 9.97%<\/p><p>Using DuPont model results from above and per share data provided in question:<\/p><p>Payout ratio = $0.20 / $1.89= 10.58% ROE &nbsp; = 10.03% × 0.56 × 2.00 = 11.23% g &nbsp; = (1 – 0.1058) × 11.23% = 10.04% g &nbsp; = 10.04%<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 63–66<\/div> <div class=\"pp-topic\">Module 18.3, LOS 18.p<\/div><div class=\"qtext\"><p>Calculate the sustainable growth rate of Jakzach on 31 December 20x6. Note: Your calculations should use 20x6 beginning-of-year balance sheet values.<\/p><\/div>", "subj": "equity"}, {"n": 67, "q": "The current market price per share for Burton, Inc. is $33.33, and an analyst is using the Gordon Growth model to determine whether this is a fair price. The company paid a dividend of $2.00 last year on earnings of $2.50 a share. If the required rate of return is 12.00% and the expected grown rate in earnings and in dividends is 6%, the current market price is most likely:", "opts": ["undervalued.", "correctly valued.", "overvalued."], "ans": "A", "expl": "The value per share using the estimates is $35.33 = [$2.00(1.06) / 0.12 − 0.06)]. This is higher than the current share price.", "explhtml": "<p>The value per share using the estimates is $35.33 = [$2.00(1.06) / 0.12 − 0.06)]. This is higher than the current share price.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.j<\/div><div class=\"qtext\"><p>The current market price per share for Burton, Inc. is $33.33, and an analyst is using the Gordon Growth model to determine whether this is a fair price. The company paid a dividend of $2.00 last year on earnings of $2.50 a share. If the required rate of return is 12.00% and the expected grown rate in earnings and in dividends is 6%, the current market price is most likely:<\/p><\/div>", "subj": "equity"}, {"n": 68, "q": "An analyst has compiled the following financial data for ABC, Inc. ABC, Inc. Valuation Scenarios     Item Scenario 1 Scenario 2 Scenario 3 Scenario 4 Year 0 Dividends\nper Share $1.50 $1.50 $1.50 $1.50 Long-term\nTreasury Bond\nRate 4.0% 4.0% 5.0% 5.0% Expected Return\non the S&P 500 12.0% 12.0% 12.0% 12.0% Beta 1.4 1.4 1.4 1.4 g (growth rate in\ndividends) 0.0% 3.0% Years 1-3,\ng=12.0%\nAfter Year 3,\ng=3.0% Year 1, g=20%\nYear 2, g=18%\nYear 3, g=16%\nYear 4, g=9%\nYear 5, g=8%\nYear 6, g=7%\nAfter Year 6, g=4% What is the value of ABC, Inc.'s stock price using the assumptions contained in Scenario 4?", "opts": ["$26.66.", "$18.52.", "$22.22."], "ans": "C", "expl": "The required rate of return is (r) = 0.05 + 1.4(0.12 − 0.05) = 0.148 The future dividends are predicted as the following: Year Dividend 0 1.50 1 1.50 × 1.2 = 1.80 2 1.80 × 1.18 =2.124 3 2.124 × 1.16 = 2.464 4 2.464 × 1.09 = 2.686 5 2.686 × 1.08 = 2.900 6 2.901 × 1.07 = 3.103 7 3.103 × 1.04 = 3.227 Now discount the dividend stream to get the value per share. Use the Gordon growth model to discount the constant growth after period 6. Value per share = (1.8 / 1.148) + (2.124 / 1.148²) + (2.464 / 1.148³) + (2.686 / 1.148⁴) + (2.900 / 1.148⁵) + (3.103 / 1.148⁶) + (3.227 / 1.148⁶(0.148 − 0.04)) = 22.22.", "explhtml": "<p>The required rate of return is (r) = 0.05 + 1.4(0.12 − 0.05) = 0.148<\/p><p>The future dividends are predicted as the following:<\/p><div class=\"tbl\"><table><tr><td>Year<\/td><td>Dividend<\/td><\/tr><tr><td>0<\/td><td>1.50<\/td><\/tr><tr><td>1<\/td><td>1.50 × 1.2 = 1.80<\/td><\/tr><tr><td>2<\/td><td>1.80 × 1.18 =2.124<\/td><\/tr><tr><td>3<\/td><td>2.124 × 1.16 = 2.464<\/td><\/tr><tr><td>4<\/td><td>2.464 × 1.09 = 2.686<\/td><\/tr><tr><td>5<\/td><td>2.686 × 1.08 = 2.900<\/td><\/tr><tr><td>6<\/td><td>2.901 × 1.07 = 3.103<\/td><\/tr><tr><td>7<\/td><td>3.103 × 1.04 = 3.227<\/td><\/tr><\/table><\/div><p>Now discount the dividend stream to get the value per share. Use the Gordon growth model to discount the constant growth after period 6. Value per share = (1.8 / 1.148) + (2.124 / 1.148<sup>2<\/sup>) + (2.464 / 1.148<sup>3<\/sup>) + (2.686 / 1.148<sup>4<\/sup>) + (2.900 / 1.148<sup>5<\/sup>) + (3.103 / 1.148<sup>6<\/sup>) + (3.227 / 1.148<sup>6<\/sup>(0.148 − 0.04)) = 22.22.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.1, LOS 18.b<\/div><div class=\"qtext\"><p>An analyst has compiled the following financial data for ABC, Inc.<\/p><div class=\"tbl\"><table><tr><td colspan=5>ABC, Inc. Valuation Scenarios<\/td><\/tr><tr><td>Item<\/td><td>Scenario 1<\/td><td>Scenario 2<\/td><td>Scenario 3<\/td><td>Scenario 4<\/td><\/tr><tr><td>Year 0 Dividends<br>per Share<\/td><td>$1.50<\/td><td>$1.50<\/td><td>$1.50<\/td><td>$1.50<\/td><\/tr><tr><td>Long-term<br>Treasury Bond<br>Rate<\/td><td>4.0%<\/td><td>4.0%<\/td><td>5.0%<\/td><td>5.0%<\/td><\/tr><tr><td>Expected Return<br>on the S&amp;P 500<\/td><td>12.0%<\/td><td>12.0%<\/td><td>12.0%<\/td><td>12.0%<\/td><\/tr><tr><td>Beta<\/td><td>1.4<\/td><td>1.4<\/td><td>1.4<\/td><td>1.4<\/td><\/tr><tr><td>g (growth rate in<br>dividends)<\/td><td>0.0%<\/td><td>3.0%<\/td><td>Years 1-3,<br>g=12.0%<br>After Year 3,<br>g=3.0%<\/td><td>Year 1, g=20%<br>Year 2, g=18%<br>Year 3, g=16%<br>Year 4, g=9%<br>Year 5, g=8%<br>Year 6, g=7%<br>After Year 6, g=4%<\/td><\/tr><\/table><\/div><p>What is the value of ABC, Inc.&#x27;s stock price using the assumptions contained in Scenario 4?<\/p><\/div>", "subj": "equity"}, {"n": 69, "q": "Judging by the data in Table 1, the most appropriate method for valuing Flyaweight would be:", "opts": ["residual income because the firm is likely to have high capital demands and negative cash flow for the foreseeable future.", "justified P/E because it is a high-growth company.", "the DDM because the firm has a history of dividend growth."], "ans": "A", "expl": "A residual income model is appropriate for firms with long term negative free cash flow due to high capital demands. A DDM would not be appropriate since the dividend payout ratio is fluctuating widely. Justified P/E is not a preferred valuation method for high-growth companies because it assumes a constant growth rate in perpetuity.", "explhtml": "<p>A residual income model is appropriate for firms with long term negative free cash flow due to high capital demands. A DDM would not be appropriate since the dividend payout ratio is fluctuating widely. Justified P/E is not a preferred valuation method for high-growth companies because it assumes a constant growth rate in perpetuity.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 69–72<\/div> <div class=\"pp-topic\">Module 18.1, LOS 18.a<\/div><div class=\"kq-note\">Câu thuộc item set (câu 69–72). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Judging by the data in Table 1, the most appropriate method for valuing Flyaweight would be:<\/p><\/div>", "subj": "equity"}, {"n": 70, "q": "With respect to their statements about the use of the GGM and the H-model:", "opts": ["both are correct.", "only Moskowitz is correct.", "only Sharpless is correct."], "ans": "B", "expl": "Moskowitz is correct that an H-model assumes a linear slowdown in growth until a constant growth rate is achieved. Sharpless is incorrect that the GGM would be an appropriate technique for valuing Flyaweight because the GGM assumes a constant rate of growth in perpetuity and Flyaweight has not yet reached a constant growth rate.", "explhtml": "<p>Moskowitz is correct that an H-model assumes a linear slowdown in growth until a constant growth rate is achieved. Sharpless is incorrect that the GGM would be an appropriate technique for valuing Flyaweight because the GGM assumes a constant rate of growth in perpetuity and Flyaweight has not yet reached a constant growth rate.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 69–72<\/div> <div class=\"pp-topic\">Module 18.1, LOS 18.a<\/div><div class=\"qtext\"><p>With respect to their statements about the use of the GGM and the H-model:<\/p><\/div>", "subj": "equity"}, {"n": 71, "q": "Which of the following is least likely to be a characteristic of a company in the initial growth phase?", "opts": ["Return on equity equal to the required rate of return.", "High profit margin.", "Low dividend payout ratio."], "ans": "A", "expl": "Companies in the initial growth phase tend to have a return on equity higher than the required rate of return, along with high profit margins and a low dividend payout.", "explhtml": "<p>Companies in the initial growth phase tend to have a return on equity higher than the required rate of return, along with high profit margins and a low dividend payout.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 69–72<\/div> <div class=\"pp-topic\">Module 18.1, LOS 18.a<\/div><div class=\"qtext\"><p>Which of the following is least likely to be a characteristic of a company in the initial growth phase?<\/p><\/div>", "subj": "equity"}, {"n": 72, "q": "Based on the forecast data in Table 3, Flyaweight's sustainable growth rate (SGR) is closest to which value? If asset turnover were to rise from the forecast level, what would be the impact on SGR? SGR  Impact on SGR", "opts": ["22% Decline", "22% Increase", "24% Increase"], "ans": "B", "expl": "Note that total assets for the firm must equal total liabilities plus owners' equity, so assets are ($14.40 + $12.70) = $27.10. Thus the Return on Equity (ROE) of the firm equals: ROE = profit margin × asset turnover × financial leverage ROE = (0.29) × ($10.70 / $27.10) × ($27.10 / $12.70) ROE = 0.244 = 24.4% ROE will rise as asset turnover rises. The SGR of the firm equals: SGR = retention rate × ROE SGR = (1 – 0.10) × 0.244 SGR = 0.90 × 0.244 SGR = 0.22 The SGR of the firm is approximately 22%. SGR will increase as rising asset turnover increases ROE.", "explhtml": "<p>Note that total assets for the firm must equal total liabilities plus owners&#x27; equity, so assets are ($14.40 + $12.70) = $27.10.<\/p><p>Thus the Return on Equity (ROE) of the firm equals:<\/p><p>ROE = profit margin × asset turnover × financial leverage<\/p><p>ROE = (0.29) × ($10.70 / $27.10) × ($27.10 / $12.70)<\/p><p>ROE = 0.244 = 24.4%<\/p><p>ROE will rise as asset turnover rises.<\/p><p>The SGR of the firm equals:<\/p><p>SGR = retention rate × ROE<\/p><p>SGR = (1 – 0.10) × 0.244<\/p><p>SGR = 0.90 × 0.244<\/p><p>SGR = 0.22<\/p><p>The SGR of the firm is approximately 22%.<\/p><p>SGR will increase as rising asset turnover increases ROE.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 69–72<\/div> <div class=\"pp-topic\">Module 18.1, LOS 18.a<\/div><div class=\"qtext\"><p>Based on the forecast data in Table 3, Flyaweight&#x27;s sustainable growth rate (SGR) is closest to which value? If asset turnover were to rise from the forecast level, what would be the impact on SGR? SGR &nbsp; Impact on SGR<\/p><\/div>", "subj": "equity"}, {"n": 73, "q": "Financial models such as the DDM represent a cornerstone of equity valuation from an academic standpoint. But in the real life, many analysts do not use the DDM. The least likely reason for this is:", "opts": ["the model lacks the flexibility required to model values in the real world.", "some of the assumptions required are impractical.", "modern research has shown that many of the old standbys do not work."], "ans": "C", "expl": "The DDM requires assumptions that many analysts find impractical. In addition, the model lacks the flexibility to adapt to changing circumstances. Both of these problems can be overcome, to a large extent, by using spreadsheet modeling to forecast cash flows and other variables.", "explhtml": "<p>The DDM requires assumptions that many analysts find impractical. In addition, the model lacks the flexibility to adapt to changing circumstances. Both of these problems can be overcome, to a large extent, by using spreadsheet modeling to forecast cash flows and other variables.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.o<\/div><div class=\"qtext\"><p>Financial models such as the DDM represent a cornerstone of equity valuation from an academic standpoint. But in the real life, many analysts do not use the DDM. The least likely reason for this is:<\/p><\/div>", "subj": "equity"}, {"n": 74, "q": "JAD just paid a dividend of $0.80. Analysts expect dividends to grow at 25% in the next two years, 15% in years three and four, and 8% for year five and after. The market required rate of return is 10%, and Treasury bills are yielding 4%. JAD has a beta of 1.4. The estimated current price of JAD is closest to:", "opts": ["$45.91.", "$25.42.", "$29.34."], "ans": "C", "expl": "JAD's stock price today can be calculated using the three-stage model. Start by finding the value of the dividends for the next four years with the two different dividend growth rates. D₁ = D₀(1+g) = $0.80(1.25) = $1.00 D₂ = D₁(1+g) = $1.00(1.25) = $1.25 D₃ = D₂(1+g) = $1.25(1.15) = $1.4375 D₄ = D₃(1+g) = $1.4375(1.15) = $1.6531 (Alternatively, you could use your financial calculators to solve for the future value to find D1, D2, D3, and D4.) Next find the value of the stock at the beginning of the constant growth period using the constant dividend discount model: D₅ P₄ = r −g CAPM  : r = 0.04 + [1.4 × (0.10 −0.04)] = 0.124 D₅ = D₄ × (1 + g) = $1.6531 × 1.08 = $1.785 D₅  $1.785 | P₄ =  =  = $40.57 | r −g  0.124 −0.08 The easiest way to proceed is to use the NPV function in the financial calculator. CF₀ = 0; CF₁ = 1.00; CF₂ = 1.25; CF₃ = 1.4375; CF₄ = 1.6531 + 40.57 = 42.22 I = 12.4; NPV = 29.34 The value of the firm today is $29.34 per share.", "explhtml": "<p>JAD&#x27;s stock price today can be calculated using the three-stage model. Start by finding the value of the dividends for the next four years with the two different dividend growth rates.<\/p><p>D<sub>1<\/sub> = D<sub>0<\/sub>(1+g) = $0.80(1.25) = $1.00<\/p><p>D<sub>2<\/sub> = D<sub>1<\/sub>(1+g) = $1.00(1.25) = $1.25<\/p><p>D<sub>3<\/sub> = D<sub>2<\/sub>(1+g) = $1.25(1.15) = $1.4375<\/p><p>D<sub>4<\/sub> = D<sub>3<\/sub>(1+g) = $1.4375(1.15) = $1.6531<\/p><p>(Alternatively, you could use your financial calculators to solve for the future value to find D1, D2, D3, and D4.)<\/p><p>Next find the value of the stock at the beginning of the constant growth period using the constant dividend discount model:<\/p><p>D<sub>5<\/sub><\/p><p>P<sub>4<\/sub> =<\/p><p>r −g<\/p><p>CAPM  : r = 0.04 + [1.4 × (0.10 −0.04)] = 0.124<\/p><p>D<sub>5<\/sub> = D<sub>4<\/sub> × (1 + g) = $1.6531 × 1.08 = $1.785<\/p><div class=\"tbl\"><table><tr><td>D<sub>5<\/sub><\/td><td>$1.785<\/td><\/tr><tr><td>P<sub>4<\/sub> =<\/td><td>=<\/td><td>= $40.57<\/td><\/tr><tr><td>r −g<\/td><td>0.124 −0.08<\/td><\/tr><\/table><\/div><p>The easiest way to proceed is to use the NPV function in the financial calculator.<\/p><p>CF<sub>0<\/sub> = 0; CF<sub>1<\/sub> = 1.00; CF<sub>2<\/sub> = 1.25; CF<sub>3<\/sub> = 1.4375; CF<sub>4<\/sub> = 1.6531 + 40.57 = 42.22<\/p><p>I = 12.4; NPV = 29.34<\/p><p>The value of the firm today is $29.34 per share.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.1, LOS 18.b<\/div><div class=\"qtext\"><p>JAD just paid a dividend of $0.80. Analysts expect dividends to grow at 25% in the next two years, 15% in years three and four, and 8% for year five and after. The market required rate of return is 10%, and Treasury bills are yielding 4%. JAD has a beta of 1.4. The estimated current price of JAD is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 75, "q": "James Malone, CFA, covers GNTX stock, which is currently trading at $45.00 and just paid a dividend of $1.40. Malone expects the dividend growth rate to decline linearly over the next six years from 25% in the short run to 6% in the long run. Malone estimates the required return on GNTX to be 13%. Using the H-model, the value of GNTX is closest to:", "opts": ["$17.55.", "$33.40.", "$32.60."], "ans": "C", "expl": "The estimated value of GNTX using the H-model is calculated as follows: V₀ = [ D₀ × (1+gL) / (r −gL) ] + [ D₀  × H × (gS−gL) / (r−gL) ] V₀ = [ ($1.40×1.06) / (0.13-0.06) ] + [ $1.40×(6/2)×(0.25-0.06) / (0.13-0.06) ] = $32.60", "explhtml": "<p>The estimated value of GNTX using the H-model is calculated as follows:<\/p><p>V<sub>0<\/sub> = [ D<sub>0<\/sub> × (1+g<sub>L<\/sub>) / (r −g<sub>L<\/sub>) ] + [ D<sub>0<\/sub>  × H × (g<sub>S<\/sub>−g<sub>L<\/sub>) / (r−g<sub>L<\/sub>) ]<\/p><p>V<sub>0<\/sub> = [ ($1.40×1.06) / (0.13-0.06) ] + [ $1.40×(6/2)×(0.25-0.06) / (0.13-0.06) ] = $32.60<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.n<\/div><div class=\"qtext\"><p>James Malone, CFA, covers GNTX stock, which is currently trading at $45.00 and just paid a dividend of $1.40. Malone expects the dividend growth rate to decline linearly over the next six years from 25% in the short run to 6% in the long run. Malone estimates the required return on GNTX to be 13%. Using the H-model, the value of GNTX is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 76, "q": "An analyst for a small European investment bank is interested in valuing stocks by calculating the present value of its future dividends. He has compiled the following financial data for Ski, Inc.:  Earnings per Share (EPS) Year 0 $4.00 Year 1 $6.00 Year 2 $9.00 Year 3 $13.50 Note: Shareholders of Ski, Inc., require a 20% return on their investment in the high growth stage compared to 12% in the stable growth stage. The dividend payout ratio of Ski, Inc., is expected to be 40% for the next three years. After year 3, the dividend payout ratio is expected to increase to 80% and the expected earnings growth will be 2%. Using the information contained in the table, what is the value of Ski, Inc.'s, stock?", "opts": ["$71.38.", "$39.50.", "$43.04."], "ans": "A", "expl": "The dividends in the next four years are: Year 1: 6 × 0.4 = 2.4 Year 2: 9 × 0.4 = 3.6 Year 3: 13.5 × 0.4 = 5.4 Year 4: (13.5 × 1.02) × 0.8 = 11.016 The terminal value of the firm (in year 3) is 11.016 / (0.12 − 0.02) = 110.16. Value per share = 2.4 / (1.2)¹ + 3.6 / (1.2)²+ 5.4 / (1.2)³ + 110.16 / (1.2)³ = $71.38.", "explhtml": "<p>The dividends in the next four years are:<\/p><p>Year 1: 6 × 0.4 = 2.4<\/p><p>Year 2: 9 × 0.4 = 3.6<\/p><p>Year 3: 13.5 × 0.4 = 5.4<\/p><p>Year 4: (13.5 × 1.02) × 0.8 = 11.016<\/p><p>The terminal value of the firm (in year 3) is 11.016 / (0.12 − 0.02) = 110.16. Value per share = 2.4 / (1.2)<sup>1<\/sup> + 3.6 / (1.2)<sup>2<\/sup>+ 5.4 / (1.2)<sup>3<\/sup> + 110.16 / (1.2)<sup>3<\/sup> = $71.38.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.n<\/div><div class=\"qtext\"><p>An analyst for a small European investment bank is interested in valuing stocks by calculating the present value of its future dividends. He has compiled the following financial data for Ski, Inc.:<\/p><div class=\"tbl\"><table><tr><td><\/td><td>Earnings per Share (EPS)<\/td><\/tr><tr><td>Year 0<\/td><td>$4.00<\/td><\/tr><tr><td>Year 1<\/td><td>$6.00<\/td><\/tr><tr><td>Year 2<\/td><td>$9.00<\/td><\/tr><tr><td>Year 3<\/td><td>$13.50<\/td><\/tr><\/table><\/div><p>Note: Shareholders of Ski, Inc., require a 20% return on their investment in the high growth stage compared to 12% in the stable growth stage. The dividend payout ratio of Ski, Inc., is expected to be 40% for the next three years. After year 3, the dividend payout ratio is expected to increase to 80% and the expected earnings growth will be 2%. Using the information contained in the table, what is the value of Ski, Inc.&#x27;s, stock?<\/p><\/div>", "subj": "equity"}, {"n": 77, "q": "Ambiance Company has a current market price of $42, a current dividend of $1.25 and a required rate of return of 12%. All earnings are paid out as dividends. What is the present value of Ambiance's growth opportunities (PVGO)?", "opts": ["$16.71.", "$31.58.", "$38.85."], "ans": "B", "expl": "The PVGO is $31.58: PVGO = $42 – ($1.25 / 0.12) = $31.58", "explhtml": "<p>The PVGO is $31.58:<\/p><p>PVGO = $42 – ($1.25 / 0.12) = $31.58<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.g<\/div><div class=\"qtext\"><p>Ambiance Company has a current market price of $42, a current dividend of $1.25 and a required rate of return of 12%. All earnings are paid out as dividends. What is the present value of Ambiance&#x27;s growth opportunities (PVGO)?<\/p><\/div>", "subj": "equity"}, {"n": 78, "q": "Jand, Inc., currently pays a dividend of $1.22, which is expected to grow at 5%. If the current value of Jand's shares based on the Gordon model is $32.03, what is the required rate of return?", "opts": ["9%.", "7%.", "8%."], "ans": "A", "expl": "The required return is 9%: r = [$1.22(1 + 0.05) / $32.03] + 0.05 = 0.09 or 9%.", "explhtml": "<p>The required return is 9%: r = [$1.22(1 + 0.05) / $32.03] + 0.05 = 0.09 or 9%.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.c<\/div><div class=\"qtext\"><p>Jand, Inc., currently pays a dividend of $1.22, which is expected to grow at 5%. If the current value of Jand&#x27;s shares based on the Gordon model is $32.03, what is the required rate of return?<\/p><\/div>", "subj": "equity"}, {"n": 79, "q": "Most firms follow a pattern of growth that includes several stages. The second stage is most likely to be referred to as the:", "opts": ["transitional stage.", "decline stage.", "maturity stage."], "ans": "A", "expl": "The second stage is often referred to as the transitional stage. During the transitional stage, the firm's growth begins to slow as competitive forces build.", "explhtml": "<p>The second stage is often referred to as the transitional stage. During the transitional stage, the firm&#x27;s growth begins to slow as competitive forces build.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.k<\/div><div class=\"qtext\"><p>Most firms follow a pattern of growth that includes several stages. The second stage is most likely to be referred to as the:<\/p><\/div>", "subj": "equity"}, {"n": 80, "q": "The current market price per share for High-on-the-Hog, Inc. is $52.50, and an analyst is using the Gordon Growth model to determine whether this is a fair price. The company paid a dividend of $3.00 last year on earnings of $4.50 a share. If the required rate of return is 11.00% and the expected grown rate in earnings and in dividends is 5%, the current market price is most likely:", "opts": ["overvalued.", "undervalued.", "correctly valued."], "ans": "C", "expl": "The value per share using the estimates is $52.50 = [$3.00(1.05) / 0.11 − 0.05)].", "explhtml": "<p>The value per share using the estimates is $52.50 = [$3.00(1.05) / 0.11 − 0.05)].<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.j<\/div><div class=\"qtext\"><p>The current market price per share for High-on-the-Hog, Inc. is $52.50, and an analyst is using the Gordon Growth model to determine whether this is a fair price. The company paid a dividend of $3.00 last year on earnings of $4.50 a share. If the required rate of return is 11.00% and the expected grown rate in earnings and in dividends is 5%, the current market price is most likely:<\/p><\/div>", "subj": "equity"}, {"n": 81, "q": "In its most recent quarterly earnings report, Smith Brothers Garden Supplies said it planned to increase its dividend at an annual rate of 5% for the foreseeable future. Analyst Anton Spears is using a required return of 9.5% for Smith Brothers stock. Smith Brothers stock trades for $52.17 per share and earned $3.01 per share over the last 12 months. The company paid a dividend of $2.15 per share during the last 12-month period, and its dividend-growth rate for the last five years was 9.2%. Using the Gordon Growth model, the share price for Smith Brothers stock is most likely:", "opts": ["correctly valued.", "overvalued.", "undervalued."], "ans": "B", "expl": "The Gordon Growth model is as follows: Value = [dividend × (1 + dividend growth rate)] / [required return − growth rate] Value = [2.15 × 1.05] / [0.095 − 0.05] = 2.2575 / [0.095 − 0.05] = 50.17", "explhtml": "<p>The Gordon Growth model is as follows:<\/p><p>Value = [dividend × (1 + dividend growth rate)] / [required return − growth rate]<\/p><p>Value = [2.15 × 1.05] / [0.095 − 0.05]<\/p><p>= 2.2575 / [0.095 − 0.05]<\/p><p>= 50.17<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.j<\/div><div class=\"qtext\"><p>In its most recent quarterly earnings report, Smith Brothers Garden Supplies said it planned to increase its dividend at an annual rate of 5% for the foreseeable future. Analyst Anton Spears is using a required return of 9.5% for Smith Brothers stock. Smith Brothers stock trades for $52.17 per share and earned $3.01 per share over the last 12 months. The company paid a dividend of $2.15 per share during the last 12-month period, and its dividend-growth rate for the last five years was 9.2%. Using the Gordon Growth model, the share price for Smith Brothers stock is most likely:<\/p><\/div>", "subj": "equity"}, {"n": 82, "q": "In computing the sustainable growth rate of a firm, the earnings retention rate is equal to:", "opts": ["Dividends / required rate of return.", "1 − (dividends / assets).", "1 − (dividends / earnings)."], "ans": "C", "expl": "Earnings retention rate = 1 − (dividends / earnings).", "explhtml": "<p>Earnings retention rate = 1 − (dividends / earnings).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.p<\/div><div class=\"qtext\"><p>In computing the sustainable growth rate of a firm, the earnings retention rate is equal to:<\/p><\/div>", "subj": "equity"}, {"n": 83, "q": "An analyst has forecasted dividend growth for Triple Crown, Inc., to be 8% for the next two years, declining to 5% over the following three years, and then remaining at 5% thereafter. If the current dividend is $4.00, and the required return is 10%, what is the current value of Triple Crown shares based on a three-stage model?", "opts": ["$92.23.", "$73.68.", "$91.11."], "ans": "A", "expl": "D₁ = Year 1 dividend (after one year of 8% growth) = $4 × (1 + 0.08) = $4.32 PV(D₁) = $4.32/(1+10%) = $3.93 D₂ = Year 2 dividend (after two years of 8% growth) = $4 × (1 + 0.08)² = $4.67 PV(D₂) = $4.67/(1 + 10%)² = $3.86 H-Model value as of the end of year 2 = D₀ × (1 + gL)/(r − gL) + D₀ × H ×(gS − gL)/r − gL = $4.67 × (1 + 5%)/(10% − 5%) + $4.67 × (3/2) × (8% − 5%)/(10% − 5%) = $102.18 PV(H-model) = 102.17664/(1.10)² = $84.44 Total current value of Triple Crown shares: V₀ = PV(D₁) + PV(D₂) + PV(H-model) = $3.93 + $3.86 + $84.44 = $92.23", "explhtml": "<p>D<sub>1<\/sub> = Year 1 dividend (after one year of 8% growth) = $4 × (1 + 0.08) = $4.32<\/p><p>PV(D<sub>1<\/sub>) = $4.32/(1+10%) = $3.93<\/p><p>D<sub>2<\/sub> = Year 2 dividend (after two years of 8% growth) = $4 × (1 + 0.08)<sup>2<\/sup> = $4.67<\/p><p>PV(D<sub>2<\/sub>) = $4.67/(1 + 10%)<sup>2<\/sup> = $3.86<\/p><p>H-Model value as of the end of year 2<\/p><p>= D<sub>0<\/sub> × (1 + g<sub>L<\/sub>)/(r − g<sub>L<\/sub>) + D<sub>0<\/sub> × H ×(g<sub>S<\/sub> − g<sub>L<\/sub>)/r − g<sub>L<\/sub><\/p><p>= $4.67 × (1 + 5%)/(10% − 5%) + $4.67 × (3/2) × (8% − 5%)/(10% − 5%)<\/p><p>= $102.18<\/p><p>PV(H-model) = 102.17664/(1.10)<sup>2<\/sup> = $84.44<\/p><p>Total current value of Triple Crown shares:<\/p><p>V<sub>0<\/sub> = PV(D<sub>1<\/sub>) + PV(D<sub>2<\/sub>) + PV(H-model) = $3.93 + $3.86 + $84.44 = $92.23<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.n<\/div><div class=\"qtext\"><p>An analyst has forecasted dividend growth for Triple Crown, Inc., to be 8% for the next two years, declining to 5% over the following three years, and then remaining at 5% thereafter. If the current dividend is $4.00, and the required return is 10%, what is the current value of Triple Crown shares based on a three-stage model?<\/p><\/div>", "subj": "equity"}, {"n": 84, "q": "An analyst has compiled the following financial data for ABC, Inc.: ABC, Inc. Valuation Scenarios     Item Scenario 1 Scenario 2 Scenario 3 Scenario 4 Year 0 Dividends per\nShare $1.50 $1.50 $1.50 $1.50 Long-term Treasury\nBond Rate 4.0% 4.0% 5.0% 5.0% Expected Return on the\nS&P 500 12.0% 12.0% 12.0% 12.0% Beta 1.4 1.4 1.4 1.4 g (growth rate in\ndividends) 0.0% 3.0% Years 1-3,\ng=12.0%\nAfter Year 3,\ng=3.0% Year 1, g=20%\nYear 2, g=18%\nYear 3, g=16%\nYear 4, g=9%\nYear 5, g=8%\nYear 6, g=7%\nAfter Year 6,\ng=4% If year 0 dividend is $1.50 per share, the required rate of return of shareholders is 15.2%, what is the value of ABC, Inc.'s stock price using the H-Model? Assume that the growth in dividends has been 20% for the last 8 years, but is expected to decline 3% per year for the next 5 years to a stable growth rate of 5%.", "opts": ["$19.85.", "$20.95.", "$24.26."], "ans": "B", "expl": "Use the H-Model to value the firm. The H-Model assumes that the initial growth rate (gₐ) will decline linearly to the stable growth rate (gₙ). The high growth period is assumed to last 2H years. Hence, the value per share = DPSₒ(1 + gₙ) / (r − gₙ) + DPSₒ × H × (gₐ − gₙ) / (r − gₙ) (1.5 × 1.05) / (0.152 − 0.05) + [1.5 × (5 / 2) × (0.20 − 0.05)] / (0.152 − 0.05) 1.575 / 0.102 + 0.5625 / 0.102 15.44 + 5.51 = $20.95", "explhtml": "<p>Use the H-Model to value the firm. The H-Model assumes that the initial growth rate (g<sub>a<\/sub>) will decline linearly to the stable growth rate (g<sub>n<\/sub>). The high growth period is assumed to last 2H years. Hence, the value per share = DPS<sub>o<\/sub>(1 + g<sub>n<\/sub>) / (r − g<sub>n<\/sub>) + DPS<sub>o<\/sub> × H × (g<sub>a<\/sub> − g<sub>n<\/sub>) / (r − g<sub>n<\/sub>)<\/p><p>(1.5 × 1.05) / (0.152 − 0.05) + [1.5 × (5 / 2) × (0.20 − 0.05)] / (0.152 − 0.05)<\/p><p>1.575 / 0.102 + 0.5625 / 0.102<\/p><p>15.44 + 5.51 = $20.95<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.n<\/div><div class=\"qtext\"><p>An analyst has compiled the following financial data for ABC, Inc.:<\/p><div class=\"tbl\"><table><tr><td colspan=5>ABC, Inc. Valuation Scenarios<\/td><\/tr><tr><td>Item<\/td><td>Scenario 1<\/td><td>Scenario 2<\/td><td>Scenario 3<\/td><td>Scenario 4<\/td><\/tr><tr><td>Year 0 Dividends per<br>Share<\/td><td>$1.50<\/td><td>$1.50<\/td><td>$1.50<\/td><td>$1.50<\/td><\/tr><tr><td>Long-term Treasury<br>Bond Rate<\/td><td>4.0%<\/td><td>4.0%<\/td><td>5.0%<\/td><td>5.0%<\/td><\/tr><tr><td>Expected Return on the<br>S&amp;P 500<\/td><td>12.0%<\/td><td>12.0%<\/td><td>12.0%<\/td><td>12.0%<\/td><\/tr><tr><td>Beta<\/td><td>1.4<\/td><td>1.4<\/td><td>1.4<\/td><td>1.4<\/td><\/tr><tr><td>g (growth rate in<br>dividends)<\/td><td>0.0%<\/td><td>3.0%<\/td><td>Years 1-3,<br>g=12.0%<br>After Year 3,<br>g=3.0%<\/td><td>Year 1, g=20%<br>Year 2, g=18%<br>Year 3, g=16%<br>Year 4, g=9%<br>Year 5, g=8%<br>Year 6, g=7%<br>After Year 6,<br>g=4%<\/td><\/tr><\/table><\/div><p>If year 0 dividend is $1.50 per share, the required rate of return of shareholders is 15.2%, what is the value of ABC, Inc.&#x27;s stock price using the H-Model? Assume that the growth in dividends has been 20% for the last 8 years, but is expected to decline 3% per year for the next 5 years to a stable growth rate of 5%.<\/p><\/div>", "subj": "equity"}, {"n": 85, "q": "The required rate of return for an asset is often difficult to determine, but if we know the growth prospects and the current earnings of a firm we can determine the implied required rate of return from the:", "opts": ["earnings retention rate.", "market price.", "dividend rate."], "ans": "B", "expl": "The required rate of return is implicit in the asset's market price and can be determined with the present value of growth opportunities.", "explhtml": "<p>The required rate of return is implicit in the asset&#x27;s market price and can be determined with the present value of growth opportunities.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.g<\/div><div class=\"qtext\"><p>The required rate of return for an asset is often difficult to determine, but if we know the growth prospects and the current earnings of a firm we can determine the implied required rate of return from the:<\/p><\/div>", "subj": "equity"}, {"n": 86, "q": "Xerxes, Inc. forecasts earnings to be permanently fixed at $4.00 per share. Current market price is $35 and required return is 10%. Assuming the shares are properly priced, the present value of growth opportunities is closest to:", "opts": ["+$5.00.", "+$3.50.", "-$5.00."], "ans": "C", "expl": "Share price = (no-growth earnings / required return) + PVGO 35 = (4 / 0.10) + PVGO PVGO = -$5.00", "explhtml": "<p>Share price = (no-growth earnings / required return) + PVGO<\/p><p>35 = (4 / 0.10) + PVGO<\/p><p>PVGO = -$5.00<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.g<\/div><div class=\"qtext\"><p>Xerxes, Inc. forecasts earnings to be permanently fixed at $4.00 per share. Current market price is $35 and required return is 10%. Assuming the shares are properly priced, the present value of growth opportunities is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 87, "q": "If the risk-free rate is 6%, the equity premium of the chosen index is 4%, and the asset's beta is 0.8, what is the discount rate to be used in applying the dividend discount model?", "opts": ["7.80%.", "10.80%.", "9.20%."], "ans": "C", "expl": "The discount rate = risk-free rate + beta (return expected on equity market less the risk-free rate). Here, discount rate = 0.06 + (0.8 × 0.04) = 0.092, or 9.2%.", "explhtml": "<p>The discount rate = risk-free rate + beta (return expected on equity market less the risk-free rate). Here, discount rate = 0.06 + (0.8 × 0.04) = 0.092, or 9.2%.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.i<\/div><div class=\"qtext\"><p>If the risk-free rate is 6%, the equity premium of the chosen index is 4%, and the asset&#x27;s beta is 0.8, what is the discount rate to be used in applying the dividend discount model?<\/p><\/div>", "subj": "equity"}, {"n": 88, "q": "The most appropriate model for analyzing a profitable high-tech firm is the:", "opts": ["zero growth cash flow model.", "three-stage dividend discount model (DDM).", "H-model."], "ans": "B", "expl": "Most of high-tech firms grow at very high rates and are expected to grow at those rates for an initial period. These rates are expected to decline as the firm grows in size and loses its competitive advantage. Of the models provided, the three-stage DDM is most appropriate to analyze high-tech firms because of its flexibility. H-model may not be appropriate, because a linear decline from the high growth rate to the constant growth rate cannot be assumed and the dividend payout ratio is fixed.", "explhtml": "<p>Most of high-tech firms grow at very high rates and are expected to grow at those rates for an initial period. These rates are expected to decline as the firm grows in size and loses its competitive advantage. Of the models provided, the three-stage DDM is most appropriate to analyze high-tech firms because of its flexibility. H-model may not be appropriate, because a linear decline from the high growth rate to the constant growth rate cannot be assumed and the dividend payout ratio is fixed.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.l<\/div><div class=\"qtext\"><p>The most appropriate model for analyzing a profitable high-tech firm is the:<\/p><\/div>", "subj": "equity"}, {"n": 89, "q": "An analyst has forecast that Hapex Company, which currently pays a dividend of $6.00, will grow at a rate of 8%, declining to 5% over the next two years, and remain at that rate thereafter. If the required return is 10%, based on an H-model what is the current value of Hapex shares?", "opts": ["$126.24.", "$131.17.", "$129.60."], "ans": "C", "expl": "The current value of Hapex shares is $129.60: V₀ = [$6(1 + 0.05) + $6(2/2)(0.08 – 0.05)] / (0.10 – 0.05) = $129.60", "explhtml": "<p>The current value of Hapex shares is $129.60:<\/p><p>V<sub>0<\/sub> = [$6(1 + 0.05) + $6(2/2)(0.08 – 0.05)] / (0.10 – 0.05) = $129.60<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.n<\/div><div class=\"qtext\"><p>An analyst has forecast that Hapex Company, which currently pays a dividend of $6.00, will grow at a rate of 8%, declining to 5% over the next two years, and remain at that rate thereafter. If the required return is 10%, based on an H-model what is the current value of Hapex shares?<\/p><\/div>", "subj": "equity"}, {"n": 90, "q": "Deployment Specialists pays a current (annual) dividend of $1.00 and is expected to grow at 20% for two years and then at 4% thereafter. If the required return for Deployment Specialists is 8.5%, the current value of Deployment Specialists is closest to:", "opts": ["$25.39.", "$33.28.", "$30.60."], "ans": "C", "expl": "First estimate the amount of each of the next two dividends and the terminal value. The current value is the sum of the present value of these cash flows, discounted at 8.5%. 1.04(1.44) 1.20  1.44 | V₀ =    +    +  1.085 (1.085)²  (0.085−0.04)(1.085)² V₀ = 30.60", "explhtml": "<p>First estimate the amount of each of the next two dividends and the terminal value. The current value is the sum of the present value of these cash flows, discounted at 8.5%.<\/p><p>1.04(1.44)<\/p><div class=\"tbl\"><table><tr><td>1.20<\/td><td>1.44<\/td><\/tr><tr><td>V<sub>0<\/sub> = <\/td><td> + <\/td><td> + <\/td><\/tr><\/table><\/div><p>1.085 (1.085)<sup>2<\/sup> &nbsp; (0.085−0.04)(1.085)<sup>2<\/sup><\/p><p>V<sub>0<\/sub> = 30.60<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.1, LOS 18.b<\/div><div class=\"qtext\"><p>Deployment Specialists pays a current (annual) dividend of $1.00 and is expected to grow at 20% for two years and then at 4% thereafter. If the required return for Deployment Specialists is 8.5%, the current value of Deployment Specialists is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 91, "q": "If the growth rate in dividends is too high, it should be replaced with:", "opts": ["the average growth rate of the industry.", "a growth rate closer to that of gross domestic product (GDP).", "the growth rate in earnings per share."], "ans": "B", "expl": "A firm cannot, in the long term, grow at a rate significantly greater than the growth rate of the economy in which it operates. If the growth rate in dividends is too high, then it is best replaced by a growth rate closer to that of GDP.", "explhtml": "<p>A firm cannot, in the long term, grow at a rate significantly greater than the growth rate of the economy in which it operates. If the growth rate in dividends is too high, then it is best replaced by a growth rate closer to that of GDP.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.e<\/div><div class=\"qtext\"><p>If the growth rate in dividends is too high, it should be replaced with:<\/p><\/div>", "subj": "equity"}, {"n": 92, "q": "Sustainable growth is the rate that earnings can grow:", "opts": ["with the current assets.", "without additional purchase of equipment.", "indefinitely without altering the firm's capital structure."], "ans": "C", "expl": "Sustainable growth is the rate of earnings growth that can be maintained indefinitely without the addition of new equity capital.", "explhtml": "<p>Sustainable growth is the rate of earnings growth that can be maintained indefinitely without the addition of new equity capital.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.p<\/div><div class=\"qtext\"><p>Sustainable growth is the rate that earnings can grow:<\/p><\/div>", "subj": "equity"}, {"n": 93, "q": "The debate over whether to use the arithmetic mean or geometric mean of market returns for the capital asset pricing model (CAPM):", "opts": ["has little practical effect because they are both very close.", "was settled by the work of Harry Markowitz in 1972.", "limits its usefulness in estimating the required return of an asset."], "ans": "C", "expl": "There are several characteristics of the CAPM that limit its usefulness in determining the required returns, including the uncertainty whether we should use arithmetic or geometric means as the appropriate measure of long-term average returns.", "explhtml": "<p>There are several characteristics of the CAPM that limit its usefulness in determining the required returns, including the uncertainty whether we should use arithmetic or geometric means as the appropriate measure of long-term average returns.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 15.2, LOS 15.c<\/div><div class=\"qtext\"><p>The debate over whether to use the arithmetic mean or geometric mean of market returns for the capital asset pricing model (CAPM):<\/p><\/div>", "subj": "equity"}, {"n": 94, "q": "Historical information used to determine the long-term average returns from equity markets may suffer from survivorship bias, resulting in:", "opts": ["unpredictable results.", "inflating the mean return.", "deflating the mean return."], "ans": "B", "expl": "Survivorship bias refers to the weeding out of underperforming firms, resulting in an inflated value for the mean return.", "explhtml": "<p>Survivorship bias refers to the weeding out of underperforming firms, resulting in an inflated value for the mean return.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.1, LOS 18.a<\/div><div class=\"qtext\"><p>Historical information used to determine the long-term average returns from equity markets may suffer from survivorship bias, resulting in:<\/p><\/div>", "subj": "equity"}, {"n": 95, "q": "Using Shotput's financial statements and Jeff Cape's estimates, calculate an equity value for Shotput using the constant growth DDM:", "opts": ["$60.0m.", "$61.2m.", "$66.7m."], "ans": "B", "expl": "P₀ = D₀ (1 + g) / (r – g) g = RR × ROE = ($4m / $10m) × ($10m / $200m) = 0.4 × 0.05 = 0.02 Using information re: Discuss and rearranging the DDM: r = d₀(1 + g) / P₀ + g r = $5.5m(1.03) / $62.94m + 0.03 = 0.12 P₀ = $6m(1.02) / (0.12 – 0.02) = $61.2m", "explhtml": "<p>P<sub>0<\/sub> = D<sub>0<\/sub> (1 + g) / (r – g)<\/p><p>g = RR × ROE = ($4m / $10m) × ($10m / $200m) = 0.4 × 0.05 = 0.02<\/p><p>Using information re: Discuss and rearranging the DDM:<\/p><p>r = d<sub>0<\/sub>(1 + g) / P<sub>0<\/sub> + g<\/p><p>r = $5.5m(1.03) / $62.94m + 0.03 = 0.12<\/p><p>P<sub>0<\/sub> = $6m(1.02) / (0.12 – 0.02) = $61.2m<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 95–98<\/div> <div class=\"pp-topic\">Module 18.2, LOS 18.f<\/div><div class=\"kq-note\">Câu thuộc item set (câu 95–98). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Using Shotput&#x27;s financial statements and Jeff Cape&#x27;s estimates, calculate an equity value for Shotput using the constant growth DDM:<\/p><\/div>", "subj": "equity"}, {"n": 96, "q": "Calculate an equity value using the assumptions made by Karlson (to the nearest $m):", "opts": ["$73m.", "$79m.", "$87m."], "ans": "C", "expl": "This is three-stage growth with linear decline during the second stage. Step 1: Calculate the H model at T₃: P₃ = [D₃ × (1 + gₗ)] / (r – gₗ) + [3₀ × H × (gₕ – gₗ)] / (r – gₗ) P₃ = [$6m(1.07)³ × (1.02)] / (0.11 – 0.02) + [$6m(1.07)³ × 3 × (0.07 0.02)] / (0.11 – 0.02) P₃ = $83.3m + $12.25m P₃ = $95.55m Step 2: Discount H model value back to T₀: $95.55m / 1.11³ = $69.87m Step 3: Discount the dividends relating to the first stage: Dividend stream = 6(1.07) + 6(1.07)² + 6(1.07)³ Dividend stream = 6.42 + 6.87 + 7.35 PV = 6.42 / 1.11 + 6.87 / 1.11² + 7.35 / 1.11³ PV = 5.78 + 5.58 + 5.37 PV = $16.73m Adding Step 2 and Step 3 together: P₀ = $69.87m + $16.73m P₀ = $86.6m ($87m to the nearest $m)", "explhtml": "<p>This is three-stage growth with linear decline during the second stage.<\/p><p>Step 1: Calculate the H model at T<sub>3<\/sub>:<\/p><p>P<sub>3<\/sub> = [D<sub>3<\/sub> × (1 + g<sub>l<\/sub>)] / (r – g<sub>l<\/sub>) + [3<sub>0<\/sub> × H × (g<sub>h<\/sub> – g<sub>l<\/sub>)] / (r – g<sub>l<\/sub>)<\/p><p>P<sub>3<\/sub> = [$6m(1.07)<sup>3<\/sup> × (1.02)] / (0.11 – 0.02) + [$6m(1.07)<sup>3<\/sup> × 3 × (0.07 0.02)] / (0.11 – 0.02)<\/p><p>P<sub>3<\/sub> = $83.3m + $12.25m<\/p><p>P<sub>3<\/sub> = $95.55m<\/p><p>Step 2: Discount H model value back to T<sub>0<\/sub>:<\/p><p>$95.55m / 1.11<sup>3<\/sup> = $69.87m<\/p><p>Step 3: Discount the dividends relating to the first stage:<\/p><p>Dividend stream = 6(1.07) + 6(1.07)<sup>2<\/sup> + 6(1.07)<sup>3<\/sup><\/p><p>Dividend stream = 6.42 + 6.87 + 7.35<\/p><p>PV = 6.42 / 1.11 + 6.87 / 1.11<sup>2<\/sup> + 7.35 / 1.11<sup>3<\/sup><\/p><p>PV = 5.78 + 5.58 + 5.37<\/p><p>PV = $16.73m<\/p><p>Adding Step 2 and Step 3 together:<\/p><p>P<sub>0<\/sub> = $69.87m + $16.73m<\/p><p>P<sub>0<\/sub> = $86.6m ($87m to the nearest $m)<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 95–98<\/div> <div class=\"pp-topic\">Module 18.3, LOS 18.n<\/div><div class=\"qtext\"><p>Calculate an equity value using the assumptions made by Karlson (to the nearest $m):<\/p><\/div>", "subj": "equity"}, {"n": 97, "q": "Is Savickas correct in his comments regarding the DDM?", "opts": ["He is correct about the minority perspective, but not the sensitivity to the required rate of return assumption.", "He is correct about the minority perspective and the required rate of return assumption.", "He is incorrect in both statements."], "ans": "A", "expl": "The DDM is more appropriate for a minority shareholder. After a takeover, the acquirer will have control over the dividend policy and hence a FCF model is more appropriate. However, a DDM valuation is very sensitive to changes in the input assumptions.", "explhtml": "<p>The DDM is more appropriate for a minority shareholder. After a takeover, the acquirer will have control over the dividend policy and hence a FCF model is more appropriate. However, a DDM valuation is very sensitive to changes in the input assumptions.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 95–98<\/div> <div class=\"pp-topic\">Module 18.1, LOS 18.b<\/div><div class=\"qtext\"><p>Is Savickas correct in his comments regarding the DDM?<\/p><\/div>", "subj": "equity"}, {"n": 98, "q": "What adjustment to his calculation method does Capes need to make in to correctly calculate PVGO?", "opts": ["The value of assets in place is given by the previous dividend multiplied by one plus the sustainable growth rate divided by the required rate of return.", "The value of assets in place is given by earnings divided by the required rate of return.", "The value of assets in place is given by earnings divided by the required rate of return minus the sustainable growth rate."], "ans": "B", "expl": "The value of assets in place is E / r. The difference between this value and the fundamental value is PVGO.", "explhtml": "<p>The value of assets in place is E / r. The difference between this value and the fundamental value is PVGO.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 95–98<\/div> <div class=\"pp-topic\">Module 18.2, LOS 18.g<\/div><div class=\"qtext\"><p>What adjustment to his calculation method does Capes need to make in to correctly calculate PVGO?<\/p><\/div>", "subj": "equity"}, {"n": 99, "q": "Kyle Star Partners is expected to have earnings in year five of $6.00 per share, a dividend payout ratio of 50%, and a required rate of return of 11%. For year 6 and beyond the dividend growth rate is expected to fall to 3% in perpetuity. Estimate the terminal value at the end of year five using the Gordon growth model.", "opts": ["$27.27.", "$37.50.", "$38.63."], "ans": "C", "expl": "The dividend for year 5 is expected to be $3 ($6 times 50%). The dividend for year 6 is then expected to be $3.00 × 1.03 = $3.09. The terminal value using the Gordon growth model is therefore: terminal value = 3.09 / (0.11 − 0.03) = $38.625 P₅ = D₆ / (k − g)", "explhtml": "<p>The dividend for year 5 is expected to be $3 ($6 times 50%). The dividend for year 6 is then expected to be $3.00 × 1.03 = $3.09. The terminal value using the Gordon growth model is therefore:<\/p><p>terminal value = 3.09 / (0.11 − 0.03) = $38.625<\/p><p>P<sub>5<\/sub> = D<sub>6<\/sub> / (k − g)<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.m<\/div><div class=\"qtext\"><p>Kyle Star Partners is expected to have earnings in year five of $6.00 per share, a dividend payout ratio of 50%, and a required rate of return of 11%. For year 6 and beyond the dividend growth rate is expected to fall to 3% in perpetuity. Estimate the terminal value at the end of year five using the Gordon growth model.<\/p><\/div>", "subj": "equity"}, {"n": 100, "q": "Stan Bellton, CFA, is preparing a report on TWR, Inc. Bellton's supervisor has requested that Bellton include a justified trailing price-to-earnings (P/E) ratio based on the following information: Current earnings per share (EPS) = $3.50. Dividend Payout Ratio = 0.60. Required return for TRW = 0.15. Expected constant growth rate for dividends = 0.05. TWR's justified trailing P/E ratio is closest to:", "opts": ["6.3.", "6.0.", "4.0."], "ans": "A", "expl": "The dividend payout ratio (1 – b) is 0.60, so the retention ratio (b) is 0.4. (0.60) (1 + 0.05) = 6.30 0.15 −0.05", "explhtml": "<p>The dividend payout ratio (1 – b) is 0.60, so the retention ratio (b) is 0.4.<\/p><p>(0.60) (1 + 0.05)<\/p><p>= 6.30<\/p><p>0.15 −0.05<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.h<\/div><div class=\"qtext\"><p>Stan Bellton, CFA, is preparing a report on TWR, Inc. Bellton&#x27;s supervisor has requested that Bellton include a justified trailing price-to-earnings (P/E) ratio based on the following information:<\/p><p>Current earnings per share (EPS) = $3.50.<\/p><p>Dividend Payout Ratio = 0.60.<\/p><p>Required return for TRW = 0.15.<\/p><p>Expected constant growth rate for dividends = 0.05.<\/p><p>TWR&#x27;s justified trailing P/E ratio is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 101, "q": "A firm has the following characteristics: Current share price $100.00. Current earnings $3.50. Current dividend $0.75. Growth rate 11%. Required return 13%. Based on this information and the Gordon growth model, what is the firm's justified trailing price to earnings (P/E) ratio?", "opts": ["8.9.", "11.9.", "11.3."], "ans": "B", "expl": "The justified trailing P/E is 11.9: P₀ / E₀ = [($0.75)(1 + 0.11)/$3.50] / (0.13 – 0.11) = 11.8929", "explhtml": "<p>The justified trailing P/E is 11.9:<\/p><p>P<sub>0<\/sub> / E<sub>0<\/sub> = [($0.75)(1 + 0.11)/$3.50] / (0.13 – 0.11) = 11.8929<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.h<\/div><div class=\"qtext\"><p>A firm has the following characteristics:<\/p><p>Current share price $100.00. Current earnings $3.50. Current dividend $0.75. Growth rate 11%. Required return 13%.<\/p><p>Based on this information and the Gordon growth model, what is the firm&#x27;s justified trailing price to earnings (P/E) ratio?<\/p><\/div>", "subj": "equity"}, {"n": 102, "q": "Heather Callaway, CFA, is concerned about the accuracy of her valuation of Crimson Gate, a fast-growing telecommunications-equipment company that her firm rates as a top buy. Crimson currently trades at $134 per share, and Callaway has put together the following information about the stock: Most recent dividend per share $0.55 Growth rate, next 2 years 30% Growth rate, after 2 years 12% Trailing P/E 25.6 Financial leverage 3.4 Sales $1198 per share Asset turnover 11.2 Estimated market rate of return 13.2% Callaway's employer, Bates Investments, likes to use a company's sustainable growth rate as a key input to obtaining the required rate of return for the company's stock. Crimson's sustainable growth rate is closest to:", "opts": ["14.8%.", "16.6%.", "13.2%."], "ans": "A", "expl": "Sustainable growth rate = ROE × retention rate Earnings per share = price / (P/E) = $134 / 25.6 = $5.23 The retention rate represents the portion of earnings not paid out in dividends. = (5.23 − 0.55) / 5.23 = 0.89 or 89% ROE = profit margin × asset turnover × financial leverage ROE = 5.23 / 1198 × 11.2 × 3.4 = 16.6% Sustainable growth rate = 89% × 16.6% = 14.8%", "explhtml": "<p>Sustainable growth rate = ROE × retention rate<\/p><p>Earnings per share = price / (P/E) = $134 / 25.6 = $5.23<\/p><p>The retention rate represents the portion of earnings not paid out in dividends. = (5.23 − 0.55) / 5.23 = 0.89 or 89%<\/p><p>ROE = profit margin × asset turnover × financial leverage<\/p><p>ROE = 5.23 / 1198 × 11.2 × 3.4 = 16.6%<\/p><p>Sustainable growth rate = 89% × 16.6% = 14.8%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.p<\/div><div class=\"qtext\"><p>Heather Callaway, CFA, is concerned about the accuracy of her valuation of Crimson Gate, a fast-growing telecommunications-equipment company that her firm rates as a top buy. Crimson currently trades at $134 per share, and Callaway has put together the following information about the stock:<\/p><div class=\"tbl\"><table><tr><td>Most recent dividend per share<\/td><td>$0.55<\/td><\/tr><tr><td>Growth rate, next 2 years<\/td><td>30%<\/td><\/tr><tr><td>Growth rate, after 2 years<\/td><td>12%<\/td><\/tr><tr><td>Trailing P/E<\/td><td>25.6<\/td><\/tr><tr><td>Financial leverage<\/td><td>3.4<\/td><\/tr><tr><td>Sales<\/td><td>$1198 per share<\/td><\/tr><tr><td>Asset turnover<\/td><td>11.2<\/td><\/tr><tr><td>Estimated market rate of return<\/td><td>13.2%<\/td><\/tr><\/table><\/div><p>Callaway&#x27;s employer, Bates Investments, likes to use a company&#x27;s sustainable growth rate as a key input to obtaining the required rate of return for the company&#x27;s stock.<\/p><p>Crimson&#x27;s sustainable growth rate is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 103, "q": "An investor projects that a firm will pay a dividend of $1.25 next year, $1.35 the second year, and $1.45 the third year. At the end of the third year, she expects the asset to be priced at $36.50. If the required return is 12%, what is the current value of the shares?", "opts": ["$32.78.", "$31.16.", "$29.21."], "ans": "C", "expl": "The current value of the shares is $29.21: V₀ = ($1.25 / 1.12) + ($1.35 / (1.12)²) + ($1.45 / (1.12)³) + ($36.50 / (1 + 0.12)³) = $29.21", "explhtml": "<p>The current value of the shares is $29.21: V<sub>0<\/sub> = ($1.25 / 1.12) + ($1.35 / (1.12)<sup>2<\/sup>) + ($1.45 / (1.12)<sup>3<\/sup>) + ($36.50 / (1 + 0.12)<sup>3<\/sup>) = $29.21<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.1, LOS 18.b<\/div><div class=\"qtext\"><p>An investor projects that a firm will pay a dividend of $1.25 next year, $1.35 the second year, and $1.45 the third year. At the end of the third year, she expects the asset to be priced at $36.50. If the required return is 12%, what is the current value of the shares?<\/p><\/div>", "subj": "equity"}, {"n": 104, "q": "CAB Inc. just paid a current dividend of $3.00, the forecasted growth is 9%, declining over four years to a stable 6% thereafter, and the current value of the firm's shares is $50, what is the required rate of return?", "opts": ["9.8%.", "12.7%.", "10.5%."], "ans": "B", "expl": "The required rate of return is 12.7%. r = ($3 / $50)[(1 + 0.06) + (4 / 2)(0.09 − 0.06)] + 0.06 = 12.7% Since the H-model is an approximation model, it is possible to solve for r directly without iteration.", "explhtml": "<p>The required rate of return is 12.7%.<\/p><p>r = ($3 / $50)[(1 + 0.06) + (4 / 2)(0.09 − 0.06)] + 0.06 = 12.7%<\/p><p>Since the H-model is an approximation model, it is possible to solve for r directly without iteration.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.i<\/div><div class=\"qtext\"><p>CAB Inc. just paid a current dividend of $3.00, the forecasted growth is 9%, declining over four years to a stable 6% thereafter, and the current value of the firm&#x27;s shares is $50, what is the required rate of return?<\/p><\/div>", "subj": "equity"}, {"n": 105, "q": "A firm pays a current dividend of $1.00 which is expected to grow at a rate of 5% indefinitely. If current value of the firm's shares is $35.00, what is the required return applicable to the investment based on the Gordon dividend discount model (DDM)?", "opts": ["7.86%.", "8.00%.", "8.25%."], "ans": "B", "expl": "The Gordon DDM uses the dividend for the period (t + 1) which would be $1.05. $35 = $1.05 / (required return – 0.05) Required return = 0.08 or 8.00%", "explhtml": "<p>The Gordon DDM uses the dividend for the period (t + 1) which would be $1.05.<\/p><p>$35 = $1.05 / (required return – 0.05)<\/p><p>Required return = 0.08 or 8.00%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.i<\/div><div class=\"qtext\"><p>A firm pays a current dividend of $1.00 which is expected to grow at a rate of 5% indefinitely. If current value of the firm&#x27;s shares is $35.00, what is the required return applicable to the investment based on the Gordon dividend discount model (DDM)?<\/p><\/div>", "subj": "equity"}, {"n": 106, "q": "Obsidian Glass Company has current earnings of $2.22, a required return of 8%, and the present value of growth opportunities (PVGO) of $8.72. What is the current value of Obsidian's shares?", "opts": ["$10.94.", "$36.47.", "$27.75."], "ans": "B", "expl": "The current value is $36.47. V₀ = ($2.22 / 0.08) + $8.72 = $36.47", "explhtml": "<p>The current value is $36.47. V<sub>0<\/sub> = ($2.22 / 0.08) + $8.72 = $36.47<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.g<\/div><div class=\"qtext\"><p>Obsidian Glass Company has current earnings of $2.22, a required return of 8%, and the present value of growth opportunities (PVGO) of $8.72. What is the current value of Obsidian&#x27;s shares?<\/p><\/div>", "subj": "equity"}, {"n": 107, "q": "Given that a firm's current dividend is $2.00, the forecasted growth is 7% for the next two years and 5% thereafter, and the current value of the firm's shares is $54.50, what is the required rate of return?", "opts": ["9%.", "Can’t be determined.", "10%."], "ans": "A", "expl": "The equation to determine the required rate of return is solved through iteration. $54.50 = $2(1.07) / (1 + r) + $2(1.07)² / (1 + r)² + {[$2(1.07)²(1.05)] / (r - 0.05)} / [(1 + r)² Through iteration, r = 9%", "explhtml": "<p>The equation to determine the required rate of return is solved through iteration.<\/p><p>$54.50 = $2(1.07) / (1 + r) + $2(1.07)<sup>2<\/sup> / (1 + r)<sup>2<\/sup> + {[$2(1.07)<sup>2<\/sup>(1.05)] / (r - 0.05)} / [(1 + r)<sup>2<\/sup><\/p><p>Through iteration, r = 9%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.n<\/div><div class=\"qtext\"><p>Given that a firm&#x27;s current dividend is $2.00, the forecasted growth is 7% for the next two years and 5% thereafter, and the current value of the firm&#x27;s shares is $54.50, what is the required rate of return?<\/p><\/div>", "subj": "equity"}, {"n": 108, "q": "What is the beta implied by a market price of $40.38?", "opts": ["1.02.", "1.20.", "1.16."], "ans": "B", "expl": "40.38 = 2.10 / (r − 0.05) r = 2.10 / 40.38 + 0.05 = 0.1020 From CAPM: r = 0.03 + b(0.09 − 0.03) 0.1020 = 0.03 + 0.06b b = 1.20", "explhtml": "<p>40.38 = 2.10 / (r − 0.05)<\/p><p>r = 2.10 / 40.38 + 0.05 = 0.1020<\/p><p>From CAPM:<\/p><p>r = 0.03 + b(0.09 − 0.03)<\/p><p>0.1020 = 0.03 + 0.06b<\/p><p>b = 1.20<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 108–113<\/div> <div class=\"pp-topic\">Module 18.2, LOS 18.c<\/div><div class=\"kq-note\">Câu thuộc item set (câu 108–113). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>What is the beta implied by a market price of $40.38?<\/p><\/div>", "subj": "equity"}, {"n": 109, "q": "Based on CAPM and the Gordon growth model, what is the value of the UC stock if the firm's retention ratio is 0.7, its tax rate is 40%, and its beta is 1.12?", "opts": ["$20.79.", "$9.72.", "$44.49."], "ans": "C", "expl": "From CAPM: r = 0.03 + (0.09 − 0.03) r = 0.03 + 1.12(0.06) r = 0.0972 V₀ = D₁ / (r − g) = 2.00(1 + 0.05) / (0.0972 − 0.05) = 2.10 / 0.0472 = $44.49", "explhtml": "<p>From CAPM:<\/p><p>r = 0.03 + (0.09 − 0.03)<\/p><p>r = 0.03 + 1.12(0.06)<\/p><p>r = 0.0972<\/p><p>V<sub>0<\/sub> = D<sub>1<\/sub> / (r − g)<\/p><p>= 2.00(1 + 0.05) / (0.0972 − 0.05)<\/p><p>= 2.10 / 0.0472 = $44.49<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 108–113<\/div> <div class=\"pp-topic\">Module 18.2, LOS 18.c<\/div><div class=\"qtext\"><p>Based on CAPM and the Gordon growth model, what is the value of the UC stock if the firm&#x27;s retention ratio is 0.7, its tax rate is 40%, and its beta is 1.12?<\/p><\/div>", "subj": "equity"}, {"n": 110, "q": "Assuming a beta of 1.12, if UC is expected to have a growth rate of 10% for the
