<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 18 — Discounted Dividend Valuation · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}

  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}

    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>

  .expl{padding:0!important;white-space:normal!important;overflow:hidden;

    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}

<style id="l2-css">

</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->

<script>
const DATA = [{"n": 1, "q": "An investor buys shares of a firm at $10.00. A year later she receives a dividend of $0.96 and sells the shares at $9.00. What is her holding period return on this investment?", "opts": ["+1.2%.", "-0.8%.", "-0.4%."], "ans": "C", "expl": "The holding period return = ($0.96 + $9.00 / $10.00) – 1 = – 0.004 or – 0.4%", "explhtml": "<p>The holding period return = ($0.96 + $9.00 / $10.00) – 1 = – 0.004 or – 0.4%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.i<\/div><div class=\"qtext\"><p>An investor buys shares of a firm at $10.00. A year later she receives a dividend of $0.96 and sells the shares at $9.00. What is her holding period return on this investment?<\/p><\/div>", "subj": "equity"}, {"n": 2, "q": "The sustainable growth rate, g, equals:", "opts": ["earnings retention rate times the return on equity.", "dividend payout rate times the return on assets.", "pretax margin divided by working capital."], "ans": "A", "expl": "The formula for sustainable growth is: g = b × ROE, where g = sustainable growth, b = the earnings retention rate, and ROE equals return on equity.", "explhtml": "<p>The formula for sustainable growth is: g = b × ROE, where g = sustainable growth, b = the earnings retention rate, and ROE equals return on equity.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.p<\/div><div class=\"qtext\"><p>The sustainable growth rate, g, equals:<\/p><\/div>", "subj": "equity"}, {"n": 3, "q": "In using the capital asset pricing model (CAPM) to determine the appropriate discount rate for discounted cash flow models (DCFs), the asset's beta is used to determine the amount of:", "opts": ["the expected return in addition to the return required by the risk of the position.", "risk-free rate applicable to the time period of the investment.", "equity premium."], "ans": "C", "expl": "Beta measures the correlation between the equity market or index for which the market risk premium is calculated and the particular asset being valued. Beta is used to approximate the proportion of the equity risk premium applicable to the asset (in relation to the market or index used).", "explhtml": "<p>Beta measures the correlation between the equity market or index for which the market risk premium is calculated and the particular asset being valued. Beta is used to approximate the proportion of the equity risk premium applicable to the asset (in relation to the market or index used).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.i<\/div><div class=\"qtext\"><p>In using the capital asset pricing model (CAPM) to determine the appropriate discount rate for discounted cash flow models (DCFs), the asset&#x27;s beta is used to determine the amount of:<\/p><\/div>", "subj": "equity"}, {"n": 4, "q": "Which of the following would NOT be appropriate to value a firm with two expected growth stages? A(an):", "opts": ["H-model.", "Gordon growth model.", "free cash flow model."], "ans": "B", "expl": "The Gordon growth model would not be appropriate for a firm with two stages of growth but is useful to value a firm with steady slow growth.", "explhtml": "<p>The Gordon growth model would not be appropriate for a firm with two stages of growth but is useful to value a firm with steady slow growth.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.e<\/div><div class=\"qtext\"><p>Which of the following would NOT be appropriate to value a firm with two expected growth stages? A(an):<\/p><\/div>", "subj": "equity"}, {"n": 5, "q": "Which of the following actions will be least helpful for an analyst attempting to improve the predictive power of his scenario analysis?", "opts": ["Limiting deviations from the core model.", "Acquiring more precise inputs.", "Using a spreadsheet rather than a calculator."], "ans": "A", "expl": "The whole point of scenario analysis is the flexibility to modify the inputs to see how changes in one factor affect others. In order to perform scenario analysis, you must deviate from the core model. Increased precision on the inputs will increase the predictive power of almost any model. Spreadsheets reduce the likelihood of computational inaccuracies and allow analysts to more easily modify models to reflect many scenarios.", "explhtml": "<p>The whole point of scenario analysis is the flexibility to modify the inputs to see how changes in one factor affect others. In order to perform scenario analysis, you must deviate from the core model. Increased precision on the inputs will increase the predictive power of almost any model. Spreadsheets reduce the likelihood of computational inaccuracies and allow analysts to more easily modify models to reflect many scenarios.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.o<\/div><div class=\"qtext\"><p>Which of the following actions will be least helpful for an analyst attempting to improve the predictive power of his scenario analysis?<\/p><\/div>", "subj": "equity"}, {"n": 6, "q": "Analyst Kelvin Strong is arguing with fellow analyst Martha Hatchett. Strong insists that the dividend discount model can be used to calculate the required return for a stock, though only if the growth rate remains constant. Hatchett maintains that while such models are useful for calculating the value of a stock, they should not be used to calculate required returns. Who is CORRECT? Strong  Hatchett", "opts": ["Incorrect Correct", "Incorrect Incorrect", "Correct Incorrect"], "ans": "B", "expl": "Dividend discount models can be used to calculate required returns, assuming you have the stock price, dividends, and dividend-growth rates, so Hatchett is wrong. Strong is right about the fact that a DDM can calculate required returns, but wrong about the growth rate assumption. Multistage dividend discount models can account for expected changes in the growth rate.", "explhtml": "<p>Dividend discount models can be used to calculate required returns, assuming you have the stock price, dividends, and dividend-growth rates, so Hatchett is wrong. Strong is right about the fact that a DDM can calculate required returns, but wrong about the growth rate assumption. Multistage dividend discount models can account for expected changes in the growth rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.i<\/div><div class=\"qtext\"><p>Analyst Kelvin Strong is arguing with fellow analyst Martha Hatchett. Strong insists that the dividend discount model can be used to calculate the required return for a stock, though only if the growth rate remains constant. Hatchett maintains that while such models are useful for calculating the value of a stock, they should not be used to calculate required returns. Who is CORRECT? Strong &nbsp; Hatchett<\/p><\/div>", "subj": "equity"}, {"n": 7, "q": "A firm has the following characteristics: Current share price $100.00. One-year earnings $3.50 One-year dividend $0.75. Required return 13%. Justified leading price to earnings 10. Based on the dividend discount model, what is the firm's assumed growth rate?", "opts": ["10.9%.", "8.6%.", "12.4%."], "ans": "A", "expl": "The assumed growth rate is 10.9%: P₀ / E₁ = ($0.75/$3.50) / (0.13 – g) = 10, g = 10.86%", "explhtml": "<p>The assumed growth rate is 10.9%:<\/p><p>P<sub>0<\/sub> / E<sub>1<\/sub> = ($0.75/$3.50) / (0.13 – g) = 10, g = 10.86%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.h<\/div><div class=\"qtext\"><p>A firm has the following characteristics:<\/p><p>Current share price $100.00. One-year earnings $3.50 One-year dividend $0.75. Required return 13%. Justified leading price to earnings 10.<\/p><p>Based on the dividend discount model, what is the firm&#x27;s assumed growth rate?<\/p><\/div>", "subj": "equity"}, {"n": 8, "q": "Suppose the equity required rate of return is 10%, the dividend just paid is $1.00 and dividends are expected to grow at an annual rate of 6% forever. What is the expected price at the end of year 2?", "opts": ["$29.78.", "$27.07.", "$28.09."], "ans": "A", "expl": "The terminal value is $29.78, and that is the price an investor should be willing to pay at the end of year 2. The correct answer is shown below. Year Dividend 1 $1.0600 2 $1.1236 3 $1.1910 V₂: $1.191/(0.10 – 0.06) = $29.78", "explhtml": "<p>The terminal value is $29.78, and that is the price an investor should be willing to pay at the end of year 2. The correct answer is shown below.<\/p><div class=\"tbl\"><table><tr><td>Year<\/td><td>Dividend<\/td><\/tr><tr><td>1<\/td><td>$1.0600<\/td><\/tr><tr><td>2<\/td><td>$1.1236<\/td><\/tr><tr><td>3<\/td><td>$1.1910<\/td><\/tr><\/table><\/div><p>V<sub>2<\/sub>: $1.191/(0.10 – 0.06) = $29.78<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.c<\/div><div class=\"qtext\"><p>Suppose the equity required rate of return is 10%, the dividend just paid is $1.00 and dividends are expected to grow at an annual rate of 6% forever. What is the expected price at the end of year 2?<\/p><\/div>", "subj": "equity"}, {"n": 9, "q": "What is the value of a fixed-rate perpetual preferred share (par value $100) with a dividend rate of 7.0% and a required return of 9.0%?", "opts": ["$71.", "$56.", "$78."], "ans": "C", "expl": "The value of the preferred is $78: V₀ = ($100par × 7%) / 9% = $77.78", "explhtml": "<p>The value of the preferred is $78:<\/p><p>V<sub>0<\/sub> = ($100par × 7%) / 9% = $77.78<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.d<\/div><div class=\"qtext\"><p>What is the value of a fixed-rate perpetual preferred share (par value $100) with a dividend rate of 7.0% and a required return of 9.0%?<\/p><\/div>", "subj": "equity"}, {"n": 10, "q": "Which of the following dividend discount models has the limitation that a sudden decrease to the lower growth rate in the second stage may NOT be realistic?", "opts": ["H model.", "Two-stage dividend discount model.", "Gordon growth model."], "ans": "B", "expl": "The two-stage DDM has the limitation that a sudden decrease to the lower growth rate in the second stage may not be realistic. Further, the model has the difficulty in trying to estimate the length of the high-growth stage.", "explhtml": "<p>The two-stage DDM has the limitation that a sudden decrease to the lower growth rate in the second stage may not be realistic. Further, the model has the difficulty in trying to estimate the length of the high-growth stage.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.1, LOS 18.a<\/div><div class=\"qtext\"><p>Which of the following dividend discount models has the limitation that a sudden decrease to the lower growth rate in the second stage may NOT be realistic?<\/p><\/div>", "subj": "equity"}, {"n": 11, "q": "Free cash flow to equity models (FCFE) are most appropriate when estimating the value of the firm:", "opts": ["to equity holders.", "to creditors of the firm.", "only for non-dividend paying firms."], "ans": "A", "expl": "FCFE models attempt to estimate the value of the firm to equity holders. The models take in to account future cash flows due to others, including debt and taxes, and amounts required for reinvestment to continue the firm's operations.", "explhtml": "<p>FCFE models attempt to estimate the value of the firm to equity holders. The models take in to account future cash flows due to others, including debt and taxes, and amounts required for reinvestment to continue the firm&#x27;s operations.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.1, LOS 18.a<\/div><div class=\"qtext\"><p>Free cash flow to equity models (FCFE) are most appropriate when estimating the value of the firm:<\/p><\/div>", "subj": "equity"}, {"n": 12, "q": "If a firm has a return on equity of 15%, a current dividend of $1.00, and a sustainable growth rate of 9%, what are the firm's current earnings?", "opts": ["$1.75.", "$1.50.", "$2.50."], "ans": "C", "expl": "The earnings can be determined by solving for earnings in the sustainable growth formula: 9% = [1 − ($1 / $Earnings)] × 0.15 or $1 / 0.4 = $Earnings = $2.50", "explhtml": "<p>The earnings can be determined by solving for earnings in the sustainable growth formula:<\/p><p>9% = [1 − ($1 / $Earnings)] × 0.15 or $1 / 0.4 = $Earnings = $2.50<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.p<\/div><div class=\"qtext\"><p>If a firm has a return on equity of 15%, a current dividend of $1.00, and a sustainable growth rate of 9%, what are the firm&#x27;s current earnings?<\/p><\/div>", "subj": "equity"}, {"n": 13, "q": "Which of the following is least likely a limitation of the two-stage dividend discount model (DDM)?", "opts": ["Terminal value estimate is most sensitive to estimates of future dividends.", "most of the value is due to the terminal value.", "the length of the high-growth stage is difficult to measure."], "ans": "A", "expl": "The Terminal value in two-stage DDM is most sensitive to estimates of growth and required rate of return.", "explhtml": "<p>The Terminal value in two-stage DDM is most sensitive to estimates of growth and required rate of return.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.1, LOS 18.a<\/div><div class=\"qtext\"><p>Which of the following is least likely a limitation of the two-stage dividend discount model (DDM)?<\/p><\/div>", "subj": "equity"}, {"n": 14, "q": "An investor computes the current value of a firm's shares to be $34.34, based on an expected dividend of $2.80 in one year and an expected price of the share in one year to be $36.00. What is the investor's required rate of return on this investment?", "opts": ["13%.", "10%.", "11%."], "ans": "A", "expl": "The required return = [($36.00 + $2.80) / $34.34 ] – 1 = 0.13 or 13%.", "explhtml": "<p>The required return = [($36.00 + $2.80) / $34.34 ] – 1 = 0.13 or 13%.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.i<\/div><div class=\"qtext\"><p>An investor computes the current value of a firm&#x27;s shares to be $34.34, based on an expected dividend of $2.80 in one year and an expected price of the share in one year to be $36.00. What is the investor&#x27;s required rate of return on this investment?<\/p><\/div>", "subj": "equity"}, {"n": 15, "q": "In what stage of growth would a firm most likely NOT pay dividends?", "opts": ["Declining stage.", "Initial growth stage.", "Transition stage."], "ans": "B", "expl": "During the initial growth stage, the firm is able to exploit opportunities to earn greater than the required return. During this stage, earnings are reinvested in the growth opportunities rather than returned to the investors.", "explhtml": "<p>During the initial growth stage, the firm is able to exploit opportunities to earn greater than the required return. During this stage, earnings are reinvested in the growth opportunities rather than returned to the investors.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.k<\/div><div class=\"qtext\"><p>In what stage of growth would a firm most likely NOT pay dividends?<\/p><\/div>", "subj": "equity"}, {"n": 16, "q": "A company reports January 1, 2002, retained earnings of $8,000,000, December 31, 2002, retained earnings of $10,000,000, and 2002 net income of $5,000,000. The company has 1,000,000 shares outstanding and dividends are expected to grow at a rate of 5% per year. What is the expected dividend at the end of 2003?", "opts": ["$13.65.", "$3.00.", "$3.15."], "ans": "C", "expl": "The first step is to determine 2002 dividends paid as ($8,000,000 + $5,000,000 − 10,000,000) = $3,000,000. The next step is to find the dividend per share ($3,000,000 / 1,000,000 shares) = $3.00 per share. Applying the 5% growth rate, next year's expected dividend is $3.15, or $3.00 × 1.05.", "explhtml": "<p>The first step is to determine 2002 dividends paid as ($8,000,000 + $5,000,000 − 10,000,000) = $3,000,000. The next step is to find the dividend per share ($3,000,000 / 1,000,000 shares) = $3.00 per share. Applying the 5% growth rate, next year&#x27;s expected dividend is $3.15, or $3.00 × 1.05.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.c<\/div><div class=\"qtext\"><p>A company reports January 1, 2002, retained earnings of $8,000,000, December 31, 2002, retained earnings of $10,000,000, and 2002 net income of $5,000,000. The company has 1,000,000 shares outstanding and dividends are expected to grow at a rate of 5% per year. What is the expected dividend at the end of 2003?<\/p><\/div>", "subj": "equity"}, {"n": 17, "q": "Recent surveys of analysts report long-term earnings growth estimates as 5.5% and a forecasted dividend yield of 2.0% on the market index. At the time of the survey, the 20-year U.S. government bond yielded 4.8%. According to the Gordon growth model, what is the equity risk premium?", "opts": ["7.5%.", "0.4%.", "2.7%."], "ans": "C", "expl": "Equity risk premium = 2.0% + 5.5% – 4.8% = 2.7%", "explhtml": "<p>Equity risk premium = 2.0% + 5.5% – 4.8% = 2.7%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.i<\/div><div class=\"qtext\"><p>Recent surveys of analysts report long-term earnings growth estimates as 5.5% and a forecasted dividend yield of 2.0% on the market index. At the time of the survey, the 20-year U.S. government bond yielded 4.8%. According to the Gordon growth model, what is the equity risk premium?<\/p><\/div>", "subj": "equity"}, {"n": 18, "q": "Tri-coat Paints has a current market value of $41 per share with an earnings of $3.64. What is the present value of its growth opportunities (PVGO) if the required return is 9%?", "opts": ["$0.56.", "$3.92.", "$1.27."], "ans": "A", "expl": "The PVGO is $0.56: PVGO = $41 – ($3.64 / 0.09) = $0.56", "explhtml": "<p>The PVGO is $0.56:<\/p><p>PVGO = $41 – ($3.64 / 0.09) = $0.56<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.g<\/div><div class=\"qtext\"><p>Tri-coat Paints has a current market value of $41 per share with an earnings of $3.64. What is the present value of its growth opportunities (PVGO) if the required return is 9%?<\/p><\/div>", "subj": "equity"}, {"n": 19, "q": "If the expected return on the equity market is 10% and the risk-free rate is 3%, the required return on an asset with beta of 0.6 is closest to:", "opts": ["9.0%.", "7.2%.", "6.0%."], "ans": "B", "expl": "The required return on an asset is equal to the current expected risk-free return, plus the asset's beta times the difference between the expected return on the equity market and the risk-free rate. Required return = 0.03 + 0.6(0.10 - 0.03) = 0.072 or 7.2%.", "explhtml": "<p>The required return on an asset is equal to the current expected risk-free return, plus the asset&#x27;s beta times the difference between the expected return on the equity market and the risk-free rate. Required return = 0.03 + 0.6(0.10 - 0.03) = 0.072 or 7.2%.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.i<\/div><div class=\"qtext\"><p>If the expected return on the equity market is 10% and the risk-free rate is 3%, the required return on an asset with beta of 0.6 is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 20, "q": "Dynamite, Inc., has current earnings of $26, current dividend of $2, and a returned on equity of 18%. What is its sustainable growth?", "opts": ["14.99%.", "16.62%.", "13.37%."], "ans": "B", "expl": "g = [1 − ($2 / $26)]0.18 = 16.62%", "explhtml": "<p>g = [1 − ($2 / $26)]0.18 = 16.62%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.p<\/div><div class=\"qtext\"><p>Dynamite, Inc., has current earnings of $26, current dividend of $2, and a returned on equity of 18%. What is its sustainable growth?<\/p><\/div>", "subj": "equity"}, {"n": 21, "q": "If an asset's beta is 0.8, the expected return on the equity market is 10%, the retention ratio is 0.7, the dividend growth rate is 5%, and the appropriate discount rate for the Gordon model is 9%, the risk-free rate must be closest to:", "opts": ["2.5%.", "5.0%.", "3.8%."], "ans": "B", "expl": "Required return = risk-free rate + beta (expected equity market return – risk-free rate) 9% = risk-free rate + 0.8(0.10 – risk-free rate) 9% = 0.08 + 0.2(risk-free rate) 1% / 0.2 = risk-free rate = 0.05 or 5%", "explhtml": "<p>Required return = risk-free rate + beta (expected equity market return – risk-free rate)<\/p><p>9% = risk-free rate + 0.8(0.10 – risk-free rate)<\/p><p>9% = 0.08 + 0.2(risk-free rate)<\/p><p>1% / 0.2 = risk-free rate = 0.05 or 5%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.h<\/div><div class=\"qtext\"><p>If an asset&#x27;s beta is 0.8, the expected return on the equity market is 10%, the retention ratio is 0.7, the dividend growth rate is 5%, and the appropriate discount rate for the Gordon model is 9%, the risk-free rate must be closest to:<\/p><\/div>", "subj": "equity"}, {"n": 22, "q": "A firm currently has earnings of $3.14, and pays a dividend of $1.00, which is expected to grow at a rate of 10%. If the required return is 15%, what is the current value of the shares using the Gordon growth model?", "opts": ["$69.08.", "$38.98.", "$22.00."], "ans": "C", "expl": "The Gordon growth model is used to value stocks based on a future series of dividends that grow at a constant rate. The current value of the shares is $22.00: V₀ = D₀×(1+g) / (r-g) = [$1.00(1 + 0.10)] / (0.15 - 0.10)] = $22.00", "explhtml": "<p>The Gordon growth model is used to value stocks based on a future series of dividends that grow at a constant rate.<\/p><p>The current value of the shares is $22.00:<\/p><p>V<sub>0<\/sub> = D<sub>0<\/sub>×(1+g) / (r-g) = [$1.00(1 + 0.10)] / (0.15 - 0.10)] = $22.00<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.c<\/div><div class=\"qtext\"><p>A firm currently has earnings of $3.14, and pays a dividend of $1.00, which is expected to grow at a rate of 10%. If the required return is 15%, what is the current value of the shares using the Gordon growth model?<\/p><\/div>", "subj": "equity"}, {"n": 23, "q": "Which of the following statements is least accurate? The two-stage DDM is most suited for analyzing firms that:", "opts": ["are in an industry with low barriers to entry.", "are expected to grow at a normalized rate after a fixed period of time.", "own patents for a very profitable product."], "ans": "A", "expl": "The two-stage DDM is well suited to firms that have high growth and are expected to maintain it for a specific period. The assumption that the growth rate drops sharply from high-growth in the initial phase to a stable rate makes this model appropriate for firms that have a competitive advantage, such as a patent, that is expected to exist for a fixed period of time. The model is not useful in analyzing a firm that is in an industry with low barriers to entry. Low barriers to entry are likely to result in increased competition. Therefore, the length of the initial phase of the growth period is indeterminate and probably uneven.", "explhtml": "<p>The two-stage DDM is well suited to firms that have high growth and are expected to maintain it for a specific period. The assumption that the growth rate drops sharply from high-growth in the initial phase to a stable rate makes this model appropriate for firms that have a competitive advantage, such as a patent, that is expected to exist for a fixed period of time. The model is not useful in analyzing a firm that is in an industry with low barriers to entry. Low barriers to entry are likely to result in increased competition. Therefore, the length of the initial phase of the growth period is indeterminate and probably uneven.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 23–26<\/div> <div class=\"pp-topic\">Module 18.3, LOS 18.n<\/div><div class=\"kq-note\">Câu thuộc item set (câu 23–26). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Which of the following statements is least accurate? The two-stage DDM is most suited for analyzing firms that:<\/p><\/div>", "subj": "equity"}, {"n": 24, "q": "What is the implied required rate of return for Reality Productions?", "opts": ["12.50%.", "11.00%.", "11.75%."], "ans": "B", "expl": "The H-model applies to firms where the dividend growth rate is expected to decline linearly over the high-growth stage until it reaches its long-run average growth rate. This most closely matches the anticipated pattern of growth for Reality Productions. The H-model can be rewritten in terms of r and used to solve for r given the other model inputs: r = D₀ / P₀ × [(1 + gL) × [H × (gS - gL)] + gL Here, r = 1.5 / 30 × [(1 + 0.05) + [(6.0 / 2) × (0.10 − 0.05)] + 0.05 = 0.11", "explhtml": "<p>The H-model applies to firms where the dividend growth rate is expected to decline linearly over the high-growth stage until it reaches its long-run average growth rate. This most closely matches the anticipated pattern of growth for Reality Productions.<\/p><p>The H-model can be rewritten in terms of r and used to solve for r given the other model inputs:<\/p><p>r = D<sub>0<\/sub> / P<sub>0<\/sub> × [(1 + g<sub>L<\/sub>) × [H × (g<sub>S<\/sub> - g<sub>L<\/sub>)] + g<sub>L<\/sub><\/p><p>Here, r = 1.5 / 30 × [(1 + 0.05) + [(6.0 / 2) × (0.10 − 0.05)] + 0.05 = 0.11<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 23–26<\/div> <div class=\"pp-topic\">Module 18.3, LOS 18.n<\/div><div class=\"qtext\"><p>What is the implied required rate of return for Reality Productions?<\/p><\/div>", "subj": "equity"}, {"n": 25, "q": "Based upon its current market value, what is the implied long-term sustainable growth rate of Turbo Financial Advisors?", "opts": ["4.0%.", "0.3%.", "19.0%."], "ans": "A", "expl": "The implied long-term rate is the rate that will cause the present value of expected dividends to equal its current market value. Since Ancis provides specific growth rates for Turbo over the next three years, we can use a multi-stage dividend discount model and solve for the long-term growth rate that makes the present value equal to the current market value. First, we calculate Turbo's expected dividends. D₀ = $10.00 current EPS times the dividend payout ratio of 40% D₀ = $4.00 dividend per share in year 0. Note that the 19% historical dividend growth rate is irrelevant to the current value of the firm. Since the dividend payout ratio is expected to remain constant at 40%, we can use the expected growth rate in earnings to estimate future dividends. EPS growth is forecast at 20% in year 1, 15% in year 2, and 10% in year 3. Multiplying each year's expected dividend times the relevant forecast growth rate, we calculate: D₁ = ($4.00 dividend in year 0) × (1.20) = $4.80 D₂ = ($4.80 dividend in year 1) × (1.15) = $5.52 D₃ = ($5.52 dividend in year 2) × (1.10) = $6.07 Discounting these back to their present value in year 0 using the cost of equity (the WACC is irrelevant), we find: Present Value (D₁ + D₂ + D₃) = ($4.80 / 1.14¹) + ($5.52 / 1.14²) + ($6.07 / 1.14³) = $4.21 + $4.25 + $4.10 = $12.56 Thus, we know that $12.56 of the current $55.18 market value represents the present value of the expected dividends in years 1, 2 and 3. Therefore, the present value of the firm's dividends for years 4 and beyond must equal ($55.18 - $12.56) = $42.62. Since the present value of the firm's dividends beginning in year 4 equals $42.62, the future value in year four will equal ($42.62 × 1.14³) = $63.14. Now that we know the value in year 4 of the future stream of steady-growth dividends, we can solve for the growth rate using the Gordon Growth Model: P₃ = [($6.07)(1 + x)] / (0.14 − x ) = $63.14 63.14 (0.14 − x) = 6.07 (1+x) 8.84 − 63.14x = 6.07 + 6.07x 2.77 = 69.21x x = 0.04 The long-term growth rate that makes Turbo fairly valued is 4% per year. We can check our calculation by plugging the 4% growth rate we just solved for into the Gordon Growth Model and then plugging that result into the basic multi-stage dividend discount model: P₃ = [($6.07)(1 + 0.04)] / (0.14 − 0.04) P₃ = 6.313 / (.10) P₃ = 63.13 (Note that this value varies from the previous calculation by 0.01 because of rounding error.) P₀ = ($4.80 / 1.14¹) + ($5.52 / 1.14²) + ($6.07 / 1.14³) + ($63.13 / 1.14³) = $55.18, which is the current market value. At a 4% growth rate, Turbo is fairly valued. Note that on the exam, it may be faster to plug each growth rate into the Gordon Growth Model and then plug each of those terminal values into the basic multi-stage formula than to solve for the growth rate. This trial and error method is especially effective if you start with the \"middle\" growth rate and then decide which value to test next depending on the results of the first calculation. For example, if the first growth rate gives a value for the firm that is too high, you can eliminate all the higher growth rates and try the next lower one.", "explhtml": "<p>The implied long-term rate is the rate that will cause the present value of expected dividends to equal its current market value. Since Ancis provides specific growth rates for Turbo over the next three years, we can use a multi-stage dividend discount model and solve for the long-term growth rate that makes the present value equal to the current market value.<\/p><p>First, we calculate Turbo&#x27;s expected dividends.<\/p><p>D<sub>0<\/sub> = $10.00 current EPS times the dividend payout ratio of 40%<\/p><p>D<sub>0<\/sub> = $4.00 dividend per share in year 0.<\/p><p>Note that the 19% historical dividend growth rate is irrelevant to the current value of the firm. Since the dividend payout ratio is expected to remain constant at 40%, we can use the expected growth rate in earnings to estimate future dividends. EPS growth is forecast at 20% in year 1, 15% in year 2, and 10% in year 3.<\/p><p>Multiplying each year&#x27;s expected dividend times the relevant forecast growth rate, we calculate:<\/p><p>D<sub>1<\/sub> = ($4.00 dividend in year 0) × (1.20) = $4.80<\/p><p>D<sub>2<\/sub> = ($4.80 dividend in year 1) × (1.15) = $5.52<\/p><p>D<sub>3<\/sub> = ($5.52 dividend in year 2) × (1.10) = $6.07<\/p><p>Discounting these back to their present value in year 0 using the cost of equity (the WACC is irrelevant), we find:<\/p><p>Present Value (D<sub>1<\/sub> + D<sub>2<\/sub> + D<sub>3<\/sub>) = ($4.80 / 1.14<sup>1<\/sup>) + ($5.52 / 1.14<sup>2<\/sup>) + ($6.07 / 1.14<sup>3<\/sup>)<\/p><p>= $4.21 + $4.25 + $4.10<\/p><p>= $12.56<\/p><p>Thus, we know that $12.56 of the current $55.18 market value represents the present value of the expected dividends in years 1, 2 and 3. Therefore, the present value of the firm&#x27;s dividends for years 4 and beyond must equal ($55.18 - $12.56) = $42.62.<\/p><p>Since the present value of the firm&#x27;s dividends beginning in year 4 equals $42.62, the future value in year four will equal ($42.62 × 1.14<sup>3<\/sup>) = $63.14.<\/p><p>Now that we know the value in year 4 of the future stream of steady-growth dividends, we can solve for the growth rate using the Gordon Growth Model:<\/p><p>P<sub>3<\/sub> = [($6.07)(1 + x)] / (0.14 − x ) = $63.14<\/p><p>63.14 (0.14 − x) = 6.07 (1+x)<\/p><p>8.84 − 63.14x = 6.07 + 6.07x<\/p><p>2.77 = 69.21x<\/p><p>x = 0.04<\/p><p>The long-term growth rate that makes Turbo fairly valued is 4% per year.<\/p><p>We can check our calculation by plugging the 4% growth rate we just solved for into the Gordon Growth Model and then plugging that result into the basic multi-stage dividend discount model:<\/p><p>P<sub>3<\/sub> = [($6.07)(1 + 0.04)] / (0.14 − 0.04)<\/p><p>P<sub>3<\/sub> = 6.313 / (.10)<\/p><p>P<sub>3<\/sub> = 63.13<\/p><p>(Note that this value varies from the previous calculation by 0.01 because of rounding error.)<\/p><p>P<sub>0<\/sub> = ($4.80 / 1.14<sup>1<\/sup>) + ($5.52 / 1.14<sup>2<\/sup>) + ($6.07 / 1.14<sup>3<\/sup>) + ($63.13 / 1.14<sup>3<\/sup>) = $55.18, which is the current market value. At a 4% growth rate, Turbo is fairly valued.<\/p><p>Note that on the exam, it may be faster to plug each growth rate into the Gordon Growth Model and then plug each of those terminal values into the basic multi-stage formula than to solve for the growth rate. This trial and error method is especially effective if you start with the &quot;middle&quot; growth rate and then decide which value to test next depending on the results of the first calculation. For example, if the first growth rate gives a value for the firm that is too high, you can eliminate all the higher growth rates and try the next lower one.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 23–26<\/div> <div class=\"pp-topic\">Module 18.3, LOS 18.n<\/div><div class=\"qtext\"><p>Based upon its current market value, what is the implied long-term sustainable growth rate of Turbo Financial Advisors?<\/p><\/div>", "subj": "equity"}, {"n": 26, "q": "What is the present value of Aultman's future investment opportunities as a percentage of the market price?", "opts": ["13.9%.", "8.1%.", "36.9%."], "ans": "C", "expl": "The present value of the company's future investment opportunities is also known as PVGO, which can be calculated using the formula: Value = (E / r) + PVGO where E = earnings per share r = required return (E / r) is the value of the assets in place Here, $22 = ($2.5 / 0.18) + PVGO PVGO = $8.11 The PVGO as a percentage of the market price equals ($8.11 / $22.00) = 36.9%.", "explhtml": "<p>The present value of the company&#x27;s future investment opportunities is also known as PVGO, which can be calculated using the formula: Value = (E / r) + PVGO<\/p><p>where<\/p><p>E = earnings per share<\/p><p>r = required return<\/p><p>(E / r) is the value of the assets in place<\/p><p>Here, $22 = ($2.5 / 0.18) + PVGO<\/p><p>PVGO = $8.11<\/p><p>The PVGO as a percentage of the market price equals ($8.11 / $22.00) = 36.9%.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 23–26<\/div> <div class=\"pp-topic\">Module 18.3, LOS 18.n<\/div><div class=\"qtext\"><p>What is the present value of Aultman&#x27;s future investment opportunities as a percentage of the market price?<\/p><\/div>", "subj": "equity"}, {"n": 27, "q": "Which of the following is least likely a valid approach to determining the appropriate discount rate for a firm's dividends?", "opts": ["Free cash flow to firm (FCFF).", "Arbitrage pricing theory (APT).", "Capital asset pricing model (CAPM)."], "ans": "A", "expl": "FCFF is another discounted cash flow model, not a method to determine required returns. Each of the other answers is a valid approach to determining an appropriate discount rate.", "explhtml": "<p>FCFF is another discounted cash flow model, not a method to determine required returns. Each of the other answers is a valid approach to determining an appropriate discount rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.i<\/div><div class=\"qtext\"><p>Which of the following is least likely a valid approach to determining the appropriate discount rate for a firm&#x27;s dividends?<\/p><\/div>", "subj": "equity"}, {"n": 28, "q": "The Gordon growth model is well suited for:", "opts": ["biotech firms.", "telecom companies.", "utilities."], "ans": "C", "expl": "Gordon growth model is best suited to firms that have a stable growth comparable to or lower than the nominal growth rate in the economy and have well established dividend payout policies. Utilities, with their regulated prices, stable growth and high dividends, are particularly well suited for this model.", "explhtml": "<p>Gordon growth model is best suited to firms that have a stable growth comparable to or lower than the nominal growth rate in the economy and have well established dividend payout policies. Utilities, with their regulated prices, stable growth and high dividends, are particularly well suited for this model.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.e<\/div><div class=\"qtext\"><p>The Gordon growth model is well suited for:<\/p><\/div>", "subj": "equity"}, {"n": 29, "q": "Which of the following would be least appropriate to value using the Gordon growth model?", "opts": ["Broad-based equity indices.", "Profitable rapidly-growing companies.", "Water utility companies."], "ans": "B", "expl": "A discounted dividend approach is suitable for valuing a dividend-paying stock where there is a clear and direct relationship between the company's dividends and its profitability. Analysts also sometimes use the Gordon growth model to value broad developed-market equity indexes. The Gordon growth model is generally inappropriate for valuing a profitable rapidly-growing firm, which is likely to not pay a dividend, or which may possess supernormal growth that cannot be expected to continue. A firm that does not pay a dividend is likely to be valued based on free cash flow.", "explhtml": "<p>A discounted dividend approach is suitable for valuing a dividend-paying stock where there is a clear and direct relationship between the company&#x27;s dividends and its profitability. Analysts also sometimes use the Gordon growth model to value broad developed-market equity indexes. The Gordon growth model is generally inappropriate for valuing a profitable rapidly-growing firm, which is likely to not pay a dividend, or which may possess supernormal growth that cannot be expected to continue. A firm that does not pay a dividend is likely to be valued based on free cash flow.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.e<\/div><div class=\"qtext\"><p>Which of the following would be least appropriate to value using the Gordon growth model?<\/p><\/div>", "subj": "equity"}, {"n": 30, "q": "Given that a firm's current dividend is $2.00, the forecasted growth is 7%, declining over three years to a stable 5% thereafter, and the current value of the firm's shares is $45, what is the required rate of return?", "opts": ["7.8%.", "10.5%.", "9.8%."], "ans": "C", "expl": "The required rate of return is 9.8%. r = ($2/$45) [(1 + 0.05) + (3/2)(0.07 – 0.05)] + 0.05 = 0.0980 Since the H-model is an approximation model, it is possible to solve for r directly without iteration.", "explhtml": "<p>The required rate of return is 9.8%.<\/p><p>r = ($2/$45) [(1 + 0.05) + (3/2)(0.07 – 0.05)] + 0.05 = 0.0980<\/p><p>Since the H-model is an approximation model, it is possible to solve for r directly without iteration.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.i<\/div><div class=\"qtext\"><p>Given that a firm&#x27;s current dividend is $2.00, the forecasted growth is 7%, declining over three years to a stable 5% thereafter, and the current value of the firm&#x27;s shares is $45, what is the required rate of return?<\/p><\/div>", "subj": "equity"}, {"n": 31, "q": "Supergro has current dividends of $1, current earnings of $3, and a sustainable growth rate of 10%. What is Supergro's return on equity?", "opts": ["15%.", "20%.", "12%."], "ans": "A", "expl": "The ROE for Supergro can be determined by solving for ROE in the sustainable growth formula: ROE = 10% / [1 – ($1/$3)] = 15%", "explhtml": "<p>The ROE for Supergro can be determined by solving for ROE in the sustainable growth formula:<\/p><p>ROE = 10% / [1 – ($1/$3)] = 15%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.p<\/div><div class=\"qtext\"><p>Supergro has current dividends of $1, current earnings of $3, and a sustainable growth rate of 10%. What is Supergro&#x27;s return on equity?<\/p><\/div>", "subj": "equity"}, {"n": 32, "q": "The value per share for Burton, Inc. is $32.00 using the Gordon Growth model. The company paid a dividend of $2.00 last year. The estimates used to calculate the value have changed. If the new required rate of return is 12.00% and expected growth rate in dividends is 6%, the value per share will increase by:", "opts": ["4.17%.", "10.42%.", "9.51%."], "ans": "B", "expl": "The value per share using the new estimates is $35.33 = [$2.0(1.06) / 0.12 - 0.06)] and the percentage increase in the value per share will be 10.42% = [(35.33 - 32.00) / 32.00] × 100%.", "explhtml": "<p>The value per share using the new estimates is $35.33 = [$2.0(1.06) / 0.12 - 0.06)] and the percentage increase in the value per share will be 10.42% = [(35.33 - 32.00) / 32.00] × 100%.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.c<\/div><div class=\"qtext\"><p>The value per share for Burton, Inc. is $32.00 using the Gordon Growth model. The company paid a dividend of $2.00 last year. The estimates used to calculate the value have changed. If the new required rate of return is 12.00% and expected growth rate in dividends is 6%, the value per share will increase by:<\/p><\/div>", "subj": "equity"}, {"n": 33, "q": "If an investor were attempting to capture an asset's alpha returns, the expected holding period return (HPR) would be:", "opts": ["the same as the required return.", "higher than the required return.", "lower than the required return."], "ans": "B", "expl": "Alpha returns are returns in addition to the required returns, so the expected HPR would be higher than the required return.", "explhtml": "<p>Alpha returns are returns in addition to the required returns, so the expected HPR would be higher than the required return.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.1, LOS 18.a<\/div><div class=\"qtext\"><p>If an investor were attempting to capture an asset&#x27;s alpha returns, the expected holding period return (HPR) would be:<\/p><\/div>", "subj": "equity"}, {"n": 34, "q": "Methods for estimating the terminal value in a DDM are least likely to include:", "opts": ["PVGO.", "the market multiple approach.", "the Gordon Growth Model."], "ans": "A", "expl": "No matter which dividend discount model we use, we have to estimate a terminal value at some point in the future. There are two ways to do this: using the Gordon growth model and the market multiple approach (i.e., a P/E ratio).", "explhtml": "<p>No matter which dividend discount model we use, we have to estimate a terminal value at some point in the future. There are two ways to do this: using the Gordon growth model and the market multiple approach (i.e., a P/E ratio).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.m<\/div><div class=\"qtext\"><p>Methods for estimating the terminal value in a DDM are least likely to include:<\/p><\/div>", "subj": "equity"}, {"n": 35, "q": "Which of the following is NOT a component of the sustainable growth rate formula using the DuPont model?", "opts": ["Earnings retention ratio.", "Net income/sales.", "EBIT/interest expense."], "ans": "C", "expl": "SGR = b × ROE where: b = earnings retention rate = (1 − dividend payout rate) ROE = return on equity The SGR is important because it tells us how quickly a firm can grow with internally generated funds. A firm's rate of growth is a function of both its earnings retention and its return on equity. ROE can be estimated with the DuPont formula, which presents the relationship between margin, sales, and leverage as determinants of ROE. In the 3-part version of the DuPont model: ROE = (NI/sales)(sales/assets)(assets/equity)", "explhtml": "<p>SGR = b × ROE<\/p><p>where:<\/p><p>b = earnings retention rate = (1 − dividend payout rate)<\/p><p>ROE = return on equity<\/p><p>The SGR is important because it tells us how quickly a firm can grow with internally generated funds. A firm&#x27;s rate of growth is a function of both its earnings retention and its return on equity. ROE can be estimated with the DuPont formula, which presents the relationship between margin, sales, and leverage as determinants of ROE. In the 3-part version of the DuPont model: ROE = (NI/sales)(sales/assets)(assets/equity)<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.p<\/div><div class=\"qtext\"><p>Which of the following is NOT a component of the sustainable growth rate formula using the DuPont model?<\/p><\/div>", "subj": "equity"}, {"n": 36, "q": "In its most recent quarterly earnings report, Smith Brothers Garden Supplies said it planned to increase its dividend at an annual rate of 13% for the foreseeable future. Analyst Clinton Spears has an annual return target of 15.5% for Smith Brothers stock. He decides to use the dividend-growth rate to back out another return estimate to test against his. Smith Brothers stock trades for $55 per share and earned $3.01 per share over the last 12 months. The company paid a dividend of $2.15 per share during the 12-month period, and its dividend-growth rate for the last five years was 9.2%. Using the Gordon Growth model, the required annual return for Smith Brothers stock is closest to:", "opts": ["13.47%.", "17.42%.", "19.18%."], "ans": "B", "expl": "The Gordon Growth model is as follows: Price = [dividend × (1 + dividend growth rate)] / [required return − growth rate] 55 = [2.15 × 1.13] / [required return − 0.13] 55 = 2.4295 / [required return − 0.13] 22.6384 = 1 / [required return − 0.13] [Required return − 0.13] = 0.04417 Required return = 0.17417 = 17.42%", "explhtml": "<p>The Gordon Growth model is as follows:<\/p><p>Price = [dividend × (1 + dividend growth rate)] / [required return − growth rate]<\/p><p>55 = [2.15 × 1.13] / [required return − 0.13]<\/p><p>55 = 2.4295 / [required return − 0.13]<\/p><p>22.6384 = 1 / [required return − 0.13]<\/p><p>[Required return − 0.13] = 0.04417<\/p><p>Required return = 0.17417 = 17.42%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.f<\/div><div class=\"qtext\"><p>In its most recent quarterly earnings report, Smith Brothers Garden Supplies said it planned to increase its dividend at an annual rate of 13% for the foreseeable future. Analyst Clinton Spears has an annual return target of 15.5% for Smith Brothers stock. He decides to use the dividend-growth rate to back out another return estimate to test against his. Smith Brothers stock trades for $55 per share and earned $3.01 per share over the last 12 months. The company paid a dividend of $2.15 per share during the 12-month period, and its dividend-growth rate for the last five years was 9.2%.<\/p><p>Using the Gordon Growth model, the required annual return for Smith Brothers stock is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 37, "q": "A company's stock beta is 0.76, the market return is 10%, and the risk-free rate is 4%. The stock will pay no dividends for the first two years, followed by a $1 dividend and $2 dividend, respectively. An investor expects to sell the stock for $10 at the end of four years. What price is an investor willing to pay for this stock?", "opts": ["$9.42.", "$10.16.", "$11.03."], "ans": "A", "expl": "The first step is to determine the required rate of return as 4% + [(10% – 4%) × 0.76] or 8.56% per year. The second step is to determine the present value of all future expected cash flows, including the terminal $10 stock price, discounted back four years to today. The solution is shown below. Year CF 1 0 2 0 3 1 4 2 4 10 0/1.0856 + 0/(1.0856)² + 1/(1.0856)³ + (2 + 10)/(1.0856)⁴ = $9.42", "explhtml": "<p>The first step is to determine the required rate of return as 4% + [(10% – 4%) × 0.76] or 8.56% per year. The second step is to determine the present value of all future expected cash flows, including the terminal $10 stock price, discounted back four years to today. The solution is shown below.<\/p><div class=\"tbl\"><table><tr><td>Year<\/td><td>CF<\/td><\/tr><tr><td>1<\/td><td>0<\/td><\/tr><tr><td>2<\/td><td>0<\/td><\/tr><tr><td>3<\/td><td>1<\/td><\/tr><tr><td>4<\/td><td>2<\/td><\/tr><tr><td>4<\/td><td>10<\/td><\/tr><\/table><\/div><p>0/1.0856 + 0/(1.0856)<sup>2<\/sup> + 1/(1.0856)<sup>3<\/sup> + (2 + 10)/(1.0856)<sup>4<\/sup> = $9.42<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.n<\/div><div class=\"qtext\"><p>A company&#x27;s stock beta is 0.76, the market return is 10%, and the risk-free rate is 4%. The stock will pay no dividends for the first two years, followed by a $1 dividend and $2 dividend, respectively. An investor expects to sell the stock for $10 at the end of four years. What price is an investor willing to pay for this stock?<\/p><\/div>", "subj": "equity"}, {"n": 38, "q": "One of the limitations of the dividend discount models (DDMs) is that they:", "opts": ["are conceptually difficult.", "are very sensitive to growth and required return assumptions.", "can only be used for companies that are experiencing stable growth."], "ans": "B", "expl": "DDMs are very sensitive to the growth and required return assumptions, and it is often wise to interpret the value as a range rather than a precise dollar amount. There are versions of DDM models that can be applied to companies transitioning from rapid growth to moderate growth, etc.", "explhtml": "<p>DDMs are very sensitive to the growth and required return assumptions, and it is often wise to interpret the value as a range rather than a precise dollar amount. There are versions of DDM models that can be applied to companies transitioning from rapid growth to moderate growth, etc.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.1, LOS 18.a<\/div><div class=\"qtext\"><p>One of the limitations of the dividend discount models (DDMs) is that they:<\/p><\/div>", "subj": "equity"}, {"n": 39, "q": "An analyst has collected the following data on two companies:  Middle Hickory Co. Lower Elm Inc. FCFE Negative Positive and growing Capital investment Significant Decreasing Which dividend-discount model is the best option for valuing the two companies? Middle Hickory  Lower Elm", "opts": ["Two-stage Gordon Growth", "Three-stage Two-stage", "Gordon Three-stage Growth"], "ans": "B", "expl": "Middle Hickory is in the initial-growth phase, while Lower Elm is in the transition phase. The three-stage model is appropriate for new, fast-growing companies. The two-stage model is appropriate for companies in the transitional phase.", "explhtml": "<p>Middle Hickory is in the initial-growth phase, while Lower Elm is in the transition phase. The three-stage model is appropriate for new, fast-growing companies. The two-stage model is appropriate for companies in the transitional phase.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.l<\/div><div class=\"qtext\"><p>An analyst has collected the following data on two companies:<\/p><div class=\"tbl\"><table><tr><td><\/td><td>Middle Hickory Co.<\/td><td>Lower Elm Inc.<\/td><\/tr><tr><td>FCFE<\/td><td>Negative<\/td><td>Positive and growing<\/td><\/tr><tr><td>Capital investment<\/td><td>Significant<\/td><td>Decreasing<\/td><\/tr><\/table><\/div><p>Which dividend-discount model is the best option for valuing the two companies? Middle Hickory &nbsp; Lower Elm<\/p><\/div>", "subj": "equity"}, {"n": 40, "q": "An analyst has forecast that Apex Company, which currently pays a dividend of $6.00, will continue to grow at 8% for the next two years and then at a rate of 5% thereafter. If the required return is 10%, based on a two-stage model what is the current value of Apex shares?", "opts": ["$126.24.", "$133.13.", "$127.78."], "ans": "B", "expl": "The current value of Apex shares is $133.13: V₀ = [($6 × 1.08) / 1.10] + [($6 × (1.08)²) / 1.10²] + [ ($6 × (1.08)² × 1.05) / (1.10² × (0.10 – 0.05))] = $133.13", "explhtml": "<p>The current value of Apex shares is $133.13:<\/p><p>V<sub>0<\/sub> = [($6 × 1.08) / 1.10] + [($6 × (1.08)<sup>2<\/sup>) / 1.10<sup>2<\/sup>] + [ ($6 × (1.08)<sup>2<\/sup> × 1.05) / (1.10<sup>2<\/sup> × (0.10 – 0.05))]<\/p><p>= $133.13<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.n<\/div><div class=\"qtext\"><p>An analyst has forecast that Apex Company, which currently pays a dividend of $6.00, will continue to grow at 8% for the next two years and then at a rate of 5% thereafter. If the required return is 10%, based on a two-stage model what is the current value of Apex shares?<\/p><\/div>", "subj": "equity"}, {"n": 41, "q": "A firm's dividend per share in the most recent year is $4 and is expected to grow at 6% per year forever. If its shareholders require a return of 14%, the value of the firm's stock (per share) using the single-stage dividend discount model (DDM) is:", "opts": ["$28.57.", "$50.00.", "$53.00."], "ans": "C", "expl": "The value of the firm's stock is: $4 × [1.06 / (0.14 − 0.06)] = $53.00", "explhtml": "<p>The value of the firm&#x27;s stock is: $4 × [1.06 / (0.14 − 0.06)] = $53.00<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.c<\/div><div class=\"qtext\"><p>A firm&#x27;s dividend per share in the most recent year is $4 and is expected to grow at 6% per year forever. If its shareholders require a return of 14%, the value of the firm&#x27;s stock (per share) using the single-stage dividend discount model (DDM) is:<\/p><\/div>", "subj": "equity"}, {"n": 42, "q": "IAM, Inc. has a current stock price of $40.00 and expects to pay a dividend in one year of $1.80. The dividend is expected to grow at a constant rate of 6% annually. IAM has a beta of 0.95, the market is expected to return 11%, and the risk-free rate of interest is 4%. The expected stock price two years from today is closest to:", "opts": ["$43.49.", "$41.03.", "$43.94."], "ans": "A", "expl": "CAPM  : r = 0.04 + [0.95 × (0.11 −0.04)] = 0.1065 D₃ = D₁ × (1 + g)² = $1.80 × 1.06² = $2.0225 D₃  $2.0225 | P₂ =  =  = $43.49 | r −g  0.1065 −0.06", "explhtml": "<p>CAPM  : r = 0.04 + [0.95 × (0.11 −0.04)] = 0.1065 D<sub>3<\/sub> = D<sub>1<\/sub> × (1 + g)<sup>2<\/sup> = $1.80 × 1.06<sup>2<\/sup> = $2.0225<\/p><div class=\"tbl\"><table><tr><td>D<sub>3<\/sub><\/td><td>$2.0225<\/td><\/tr><tr><td>P<sub>2<\/sub> =<\/td><td>=<\/td><td>= $43.49<\/td><\/tr><tr><td>r −g<\/td><td>0.1065 −0.06<\/td><\/tr><\/table><\/div>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.c<\/div><div class=\"qtext\"><p>IAM, Inc. has a current stock price of $40.00 and expects to pay a dividend in one year of $1.80. The dividend is expected to grow at a constant rate of 6% annually. IAM has a beta of 0.95, the market is expected to return 11%, and the risk-free rate of interest is 4%. The expected stock price two years from today is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 43, "q": "Analyst Louise Dorgan has put together a short fact sheet on two companies, Benson Orchards and Terra Firma Development.  Benson Orchards Terra Firma Development Price/earnings ratio 18.5  Most recent dividend $0.56 per share $1.67 per share Estimated stock return 15%  Estimated market return  13% Beta 1.2 1.7 Trailing profits $5.16 per share  Stock-market value $123 million $1.678 billion Shares outstanding  875 million The risk-free rate is 3.6%, and Dorgan estimates the stock market's equity risk premium as 7.5%. Using only the data presented above, can Dorgan create a Gordon Growth model for: Benson  Terra Firm | Orchards  Development", "opts": ["Yes Yes", "Yes No", "No No"], "ans": "A", "expl": "To calculate a growth rate using the Gordon Growth model, we use four variables (one being the growth rate itself). If we have any three of the variables, we can solve for the fourth. The four variables are: stock price, dividend, required return, and dividend growth rate. The data presented are sufficient for the calculation of three of the variables for both companies. Benson Orchards We know the most recent dividend and the estimate stock return. From the P/E ratio and the trailing profits, we can determine the stock price. From those three pieces of data, we can calculate the dividend growth rate. Terra Firma We have the dividend. We can determine the stock price by dividing market value by shares outstanding. We can derive the estimated stock return using the capital asset pricing model. From those three statistics, we can create a Gordon Growth model and solve for the dividend-growth rate.", "explhtml": "<p>To calculate a growth rate using the Gordon Growth model, we use four variables (one being the growth rate itself). If we have any three of the variables, we can solve for the fourth. The four variables are: stock price, dividend, required return, and dividend growth rate. The data presented are sufficient for the calculation of three of the variables for both companies.<\/p><p>Benson Orchards<\/p><p>We know the most recent dividend and the estimate stock return. From the P/E ratio and the trailing profits, we can determine the stock price. From those three pieces of data, we can calculate the dividend growth rate.<\/p><p>Terra Firma<\/p><p>We have the dividend. We can determine the stock price by dividing market value by shares outstanding. We can derive the estimated stock return using the capital asset pricing model. From those three statistics, we can create a Gordon Growth model and solve for the dividend-growth rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.f<\/div><div class=\"qtext\"><p>Analyst Louise Dorgan has put together a short fact sheet on two companies, Benson Orchards and Terra Firma Development.<\/p><div class=\"tbl\"><table><tr><td><\/td><td>Benson Orchards<\/td><td>Terra Firma Development<\/td><\/tr><tr><td>Price/earnings ratio<\/td><td>18.5<\/td><td><\/td><\/tr><tr><td>Most recent dividend<\/td><td>$0.56 per share<\/td><td>$1.67 per share<\/td><\/tr><tr><td>Estimated stock return<\/td><td>15%<\/td><td><\/td><\/tr><tr><td>Estimated market return<\/td><td><\/td><td>13%<\/td><\/tr><tr><td>Beta<\/td><td>1.2<\/td><td>1.7<\/td><\/tr><tr><td>Trailing profits<\/td><td>$5.16 per share<\/td><td><\/td><\/tr><tr><td>Stock-market value<\/td><td>$123 million<\/td><td>$1.678 billion<\/td><\/tr><tr><td>Shares outstanding<\/td><td><\/td><td>875 million<\/td><\/tr><\/table><\/div><p>The risk-free rate is 3.6%, and Dorgan estimates the stock market&#x27;s equity risk premium as 7.5%.<\/p><p>Using only the data presented above, can Dorgan create a Gordon Growth model for:<\/p><div class=\"tbl\"><table><tr><td>Benson<\/td><td>Terra Firm<\/td><\/tr><tr><td>Orchards<\/td><td>Development<\/td><\/tr><\/table><\/div><\/div>", "subj": "equity"}, {"n": 44, "q": "A $100 par, perpetual preferred share pays a fixed dividend of 5.0%. If the required rate of return is 6.5%, what is the current value of the shares?", "opts": ["$76.92.", "$88.64.", "$100.00."], "ans": "A", "expl": "The current value of the shares is $76.92: V₀ = ($100 × 0.05) / 0.065 = $76.92", "explhtml": "<p>The current value of the shares is $76.92:<\/p><p>V<sub>0<\/sub> = ($100 × 0.05) / 0.065 = $76.92<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.d<\/div><div class=\"qtext\"><p>A $100 par, perpetual preferred share pays a fixed dividend of 5.0%. If the required rate of return is 6.5%, what is the current value of the shares?<\/p><\/div>", "subj": "equity"}, {"n": 45, "q": "The three-stage dividend discount model (DDM) allows for an initial period of:", "opts": ["high growth, a transitional period of declining growth and a final stable growth phase.", "stable growth, a transitional period of high growth and a final declining growth phase.", "high growth, a transitional period of stable growth and a final declining growth phase."], "ans": "A", "expl": "The three-stage DDM combines the features of the two-stage DDM and the H model. It allows for an initial period of high growth, a transitional period of declining growth and a final stable growth phase.", "explhtml": "<p>The three-stage DDM combines the features of the two-stage DDM and the H model. It allows for an initial period of high growth, a transitional period of declining growth and a final stable growth phase.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.l<\/div><div class=\"qtext\"><p>The three-stage dividend discount model (DDM) allows for an initial period of:<\/p><\/div>", "subj": "equity"}, {"n": 46, "q": "If we know the forecast growth rates for a firm's dividends and the current dividends and current value, we can determine the:", "opts": ["net margin of the firm.", "required rate of return.", "sustainable growth rate."], "ans": "B", "expl": "Just as we can determine the current value of the shares from the current dividends, growth forecasts and required return, we can solve for any one of them if we know the other three factors.", "explhtml": "<p>Just as we can determine the current value of the shares from the current dividends, growth forecasts and required return, we can solve for any one of them if we know the other three factors.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.i<\/div><div class=\"qtext\"><p>If we know the forecast growth rates for a firm&#x27;s dividends and the current dividends and current value, we can determine the:<\/p><\/div>", "subj": "equity"}, {"n": 47, "q": "What is the value of a fixed-rate perpetual preferred share (par value $100) with a dividend rate of 11.0% and a required return of 7.5%?", "opts": ["$147.", "$138.", "$152."], "ans": "A", "expl": "The value of the preferred is $147: V₀ = ($100par × 11%) / 7.5% = $146.67", "explhtml": "<p>The value of the preferred is $147:<\/p><p>V<sub>0<\/sub> = ($100par × 11%) / 7.5% = $146.67<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.2, LOS 18.d<\/div><div class=\"qtext\"><p>What is the value of a fixed-rate perpetual preferred share (par value $100) with a dividend rate of 11.0% and a required return of 7.5%?<\/p><\/div>", "subj": "equity"}, {"n": 48, "q": "If a stock expects to pay dividends of $2.30 per share next year, what is the value of the stock if the required rate of return is 12% and the expected growth rate in dividends is 4%?", "opts": ["$19.17.", "$29.90.", "$28.75."], "ans": "C", "expl": "Using the Gordon growth model, the value per share = DPS₁ / (r − g) = 2.30 / (0.12 − 0.04) = $28.75.", "explhtml": "<p>Using the Gordon growth model, the value per share = DPS<sub>1<\/sub> / (r − g) = 2.30 / (0.12 − 0.04) = $28.75.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.1, LOS 18.b<\/div><div class=\"qtext\"><p>If a stock expects to pay dividends of $2.30 per share next year, what is the value of the stock if the required rate of return is 12% and the expected growth rate in dividends is 4%?<\/p><\/div>", "subj": "equity"}, {"n": 49, "q": "The H-model is more flexible than the two-stage dividend discount model (DDM) because:", "opts": ["payout ratio changes to adjust the changes in growth estimates.", "terminal value is not sensitive to the estimates of growth rates.", "initial high growth rate declines linearly to the level of stable growth rate."], "ans": "C", "expl": "A sudden decline in high growth rate in two-stage DDM may not be realistic. This problem is solved in the H-model, as the initial high growth rate is not constant, but declines linearly over time to reach the stable-growth rate.", "explhtml": "<p>A sudden decline in high growth rate in two-stage DDM may not be realistic. This problem is solved in the H-model, as the initial high growth rate is not constant, but declines linearly over time to reach the stable-growth rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.1, LOS 18.a<\/div><div class=\"qtext\"><p>The H-model is more flexible than the two-stage dividend discount model (DDM) because:<\/p><\/div>", "subj": "equity"}, {"n": 50, "q": "If we increase the required rate of return used in a dividend discount model, the estimate of value produced by the model will:", "opts": ["increase.", "decrease.", "remain the same."], "ans": "B", "expl": "The required rate of return is used in the denominator of the equation. Increasing this factor will decrease the resulting value.", "explhtml": "<p>The required rate of return is used in the denominator of the equation. Increasing this factor will decrease the resulting value.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.i<\/div><div class=\"qtext\"><p>If we increase the required rate of return used in a dividend discount model, the estimate of value produced by the model will:<\/p><\/div>", "subj": "equity"}, {"n": 51, "q": "Which of the following models would be most appropriate for a firm that is expected to grow at 8% for the next three years, and at 6% thereafter?", "opts": ["A two-stage model.", "The Gordon growth model.", "The H-model."], "ans": "A", "expl": "A firm that is expected to experience two growth stages with a fixed rate of growth for each stage should be evaluated with a two-stage dividend discount model.", "explhtml": "<p>A firm that is expected to experience two growth stages with a fixed rate of growth for each stage should be evaluated with a two-stage dividend discount model.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.3, LOS 18.l<\/div><div class=\"qtext\"><p>Which of the following models would be most appropriate for a firm that is expected to grow at 8% for the next three years, and at 6% thereafter?<\/p><\/div>", "subj": "equity"}, {"n": 52, "q": "Which of the following is least likely a potential problem associated with the three-stage dividend discount model (DDM)? The:", "opts": ["high-growth and transitional periods are too long, resulting in an extremely high stock value.", "beta in the stable period is too high, resulting in an extremely low stock value.", "stable period payout ratio may be too high resulting in an extremely low value."], "ans": "C", "expl": "If the stable period payout ratio is too low it may result in an extremely low value because the terminal value will be lower due to the smaller dividends being paid out.", "explhtml": "<p>If the stable period payout ratio is too low it may result in an extremely low value because the terminal value will be lower due to the smaller dividends being paid out.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 18.1, LOS 18.a<\/div><div class=\"qtext\"><p>Which of the following is least likely a potential problem associated with the three-stage dividend discount model (DDM)? The:<\/p><\/div>", "subj": "equity"}, {"n": 53, "q": "In which of the following stages is a firm most likely to distribute the highest proportion of its earnings in the form of dividends?", "opts": ["Mature stage.", "Transition stage.", "Initial growth stage."], "ans": "A", "expl": "As a firm matures, the fo
