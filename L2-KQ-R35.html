<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 35 — Analysis of Active Portfolio Management · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>

<style id="ui-polish">

  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";

eturns. It captures the skill of the manager.", "explhtml": "<p>Information coefficient is the ex-ante correlation between forecasted active returns and actual active returns. It captures the skill of the manager.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 35.3, LOS 35.c<\/div><div class=\"qtext\"><p>Which of the following terms is the ex-ante risk weighted correlation between forecasted active returns and actual active returns?<\/p><\/div>", "subj": "portfolio"}, {"n": 3, "q": "When choosing an active manager, an investor with a high level of risk aversion:", "opts": ["will choose the manager with the highest active return.", "will choose the manager with the highest information ratio.", "will choose a manager with the lowest active risk."], "ans": "B", "expl": "Value added is independent of the level of risk aversion. All investors will choose the manager with the highest information ratio. Those with higher levels of risk aversion will implement the strategy less aggressively (i.e., invest a larger proportion in the benchmark portfolio).", "explhtml": "<p>Value added is independent of the level of risk aversion. All investors will choose the manager with the highest information ratio. Those with higher levels of risk aversion will implement the strategy less aggressively (i.e., invest a larger proportion in the benchmark portfolio).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 35.3, LOS 35.d<\/div><div class=\"qtext\"><p>When choosing an active manager, an investor with a high level of risk aversion:<\/p><\/div>", "subj": "portfolio"}, {"n": 4, "q": "An active manager makes quarterly bets on the stocks in the Russell 2000 index and uses the index as the benchmark. The manager claims a modest IC of 0.02 using a stock screening model. Sam Fox, CFA makes the following two statements: I. The bets on the 2000 stocks in the index is not independent as the screens by definition introduce dependency in the decision process. II. The quarterly bets are likely to be independent. How many of Fox's statements are correct:", "opts": ["Neither statement is correct.", "Only one statement is correct.", "Both statements are correct."], "ans": "B", "expl": "Fox is correct that screens (e.g., minimum dividend yield) would pass stocks with similar attributes and hence would introduce dependency in the decision making process. Fox is incorrect that the decisions over time are independent. Those stocks that pass the screen in one quarter are probably more likely to pass the same screen in the next quarter and hence the decisions are not truly independent.", "explhtml": "<p>Fox is correct that screens (e.g., minimum dividend yield) would pass stocks with similar attributes and hence would introduce dependency in the decision making process. Fox is incorrect that the decisions over time are independent. Those stocks that pass the screen in one quarter are probably more likely to pass the same screen in the next quarter and hence the decisions are not truly independent.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 35.4, LOS 35.f<\/div><div class=\"qtext\"><p>An active manager makes quarterly bets on the stocks in the Russell 2000 index and uses the index as the benchmark. The manager claims a modest IC of 0.02 using a stock screening model. Sam Fox, CFA makes the following two statements:<\/p><p>I. The bets on the 2000 stocks in the index is not independent as the screens by definition introduce dependency in the decision process. II. The quarterly bets are likely to be independent.<\/p><p>How many of Fox&#x27;s statements are correct:<\/p><\/div>", "subj": "portfolio"}, {"n": 5, "q": "The expected level of active return expected to be achieved by the Ranger fund is closest to:", "opts": ["–9.00%.", "–0.09%.", "+3.49%."], "ans": "B", "expl": "The expected active return achieved by a portfolio are calculated as the difference between the expected return on the portfolio and the expected return on the benchmark: E(RA)=∑wPi × E(RPi) − ∑wBi × ["Saltire.", "Dragon.", "Rose."], "ans": "C", "expl": "A closet index fund is a fund, which is presented as being actively managed but covertly tracks the underlying benchmark index. It will achieve little active return and be exposed to little active risk, will have a low information ratio, and will have a Sharpe ratio close to the Sharpe ratio of the underlying benchmark. The Sharpe ratio is calculated as excess return over the risk-free asset per unit of portfolio risk: (RP – RF) / σP. Sharpe ratios for each fund's benchmark are calculated below (RB – RF) / σB: Saltire: (5.80% – 2%) / (4.50%) = 0.84 Dragon: (11.56% – 2%) / (5.15%) = 1.86 Rose: (11.37% – 2%) / (11.14%) = 0.84 The Rose fund has the lowest information ratio of the three funds, and its Sharpe ratio (0.85) is very close to that of its benchmark (0.84). It is therefore most likely to be a closet index fund.", "explhtml": "<p>A closet index fund is a fund, which is presented as being actively managed but covertly tracks the underlying benchmark index. It will achieve little active return and be exposed to little active risk, will have a low information ratio, and will have a Sharpe ratio close to the Sharpe ratio of the underlying benchmark. The Sharpe ratio is calculated as excess return over the risk-free asset per unit of portfolio risk: (R<sub>P<\/sub> – R<sub>F<\/sub>) / σ<sub>P<\/sub>. Sharpe ratios for each fund&#x27;s benchmark are calculated below (R<sub>B<\/sub> – R<sub>F<\/sub>) / σ<sub>B<\/sub>:<\/p><p>Saltire: (5.80% – 2%) / (4.50%) = 0.84<\/p><p>Dragon: (11.56% – 2%) / (5.15%) = 1.86<\/p><p>Rose: (11.37% – 2%) / (11.14%) = 0.84<\/p><p>The Rose fund has the lowest information ratio of the three funds, and its Sharpe ratio (0.85) is very close to that of its benchmark (0.84). It is therefore most likely to be a closet index fund.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 5–8<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ufton Wealth Management's Ranger fund has proved popular with clients. An extract from the prospectus of the Ranger fund is shown in Exhibit 1. Exhibit 1: Ranger Fund<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v001.webp\" style=\"max-width:min(100%,667px)\" alt=\"Portfolio Expected Expected Benchmark Asset weight portfolio return benchmark return weight 15% 11% U.S. equities 9% 20%\"><p>U.S. corporate<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v002.webp\" style=\"max-width:min(100%,592px)\" alt=\"35% 8% 7% 35%\"><p>bonds International<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v003.webp\" style=\"max-width:min(100%,595px)\" alt=\"8% 14% 10% 40%\"><p>equities<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v004.webp\" style=\"max-width:min(100%,667px)\" alt=\"7% 5% 7% 42% U.S. real estate Ufton awards its best performing fund manager with a large cash bonus each year. Details of the performance of three funds is shown in Exhibit 2. Risk-free rate is 2%. Exhibit 2: Selected Fund Performance Portfolio Benchmark Portfolio Benchmark Sharpe Tracking standard standard Fund ratio return return error deviation deviation 8.46% 6.13% Saltire 5.80% 4.50% 1.58% 1.05 5.15% 11.56% 7.64% Dragon 13.01% 2.12% 1.44 11.14% 11.37% 11.39% Rose 0.21% 0.85 11.01%\"><\/div><\/details><div class=\"pp-topic\">Module 35.2, LOS 35.b<\/div><div class=\"qtext\"><p>Of the three funds described in Exhibit 2, the most likely to be a closet index fund is:<\/p><\/div>", "subj": "portfolio"}, {"n": 9, "q": "Which of the following statements is least accurate?", "opts": ["Investors can take active risk that is suitable for them by investing in a combination of actively managed portfolio and benchmark portfolio.", "A closet index fund has a low Sharpe ratio.", "The Sharpe ratio of a portfolio is unaffected by addition of cash or leverage in the portfolio."], "ans": "B", "expl": "A closet index fund will have Sharpe ratio close to the benchmark's Sharpe ratio. The Sharpe ratio is for a portfolio is indeed unaffected by addition of cash or leverage to the portfolio. However, information ratio does change as we add cash or leverage to the actively managed portfolio. Investors can combine benchmark portfolio and active portfolio to obtain optimal level of active risk for them.", "explhtml": "<p>A closet index fund will have Sharpe ratio close to the benchmark&#x27;s Sharpe ratio. The Sharpe ratio is for a portfolio is indeed unaffected by addition of cash or leverage to the portfolio. However, information ratio does change as we add cash or leverage to the actively managed portfolio. Investors can combine benchmark portfolio and active portfolio to obtain optimal level of active risk for them.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 35.2, LOS 35.b<\/div><div class=\"qtext\"><p>Which of the following statements is least accurate?<\/p><\/div>", "subj": "portfolio"}, {"n": 10, "q": "Which of the following terms is the number of independent bets per year made by an active manager?", "opts": ["Transfer Coefficient", "Breadth", "Information Coefficient"], "ans": "B", "expl": "Breadth is the number of independent bets (based on unique information) made per year by the active manager.", "explhtml": "<p>Breadth is the number of independent bets (based on unique information) made per year by the active manager.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 35.3, LOS 35.c<\/div><div class=\"qtext\"><p>Which of the following terms is the number of independent bets per year made by an active manager?<\/p><\/div>", "subj": "portfolio"}, {"n": 11, "q": "Pamela Grieve claims that her information coefficient is 0.20 on monthly bets on 10 stocks in the healthcare industry. Assuming unconstrained optimization, the reduction in her information ratio if her bets have a correlation coefficient of 0.45 as opposed to being truly independent is closest to:", "opts": ["45%", "22%", "86%"], "ans b>Ri<\/sub>) = 11.70%<\/p><p>Benchmark return = R<sub>B<\/sub> = ∑(w<sub>Bi<\/sub>) x E(R<sub>i<\/sub>) = 10.44%<\/p><p>Active return = R<sub>P<\/sub> - R<sub>B<\/sub> = 11.70% – 10.44% = 1.26<\/p>", "qhtml": "<div class=\"pp-topic\">Module 35.1, LOS 35.a<\/div><div class=\"qtext\"><p>Susan Thomas is evaluating the holdings of Primus fund. Based on the information below, the estimated active return is closest to:<\/p><div class=\"tbl\"><table><tr><td>Security (i)<\/td><td>Portfolio<br>Weight (wPi)<\/td><td>Benchmark<br>Weight (wBi)<\/td><td>ReturnE<br>(Ri)<\/td><\/tr><tr><td>X<\/td><td>30%<\/td><td>40%<\/td><td>11.20%<\/td><\/tr><tr><td>y<\/td><td>15%<\/td><td>25%<\/td><td>4.25%<\/td><\/tr><tr><td>z<\/td><td>55%<\/td><td>35%<\/td><td>14.00%<\/td><\/tr><tr><td>Total<\/td><td>100%<\/td><td>100%<\/td><td><\/td><\/tr><\/table><\/div><\/div>", "subj": "portfolio"}, {"n": 13, "q": "Tom Grenkin is a market timer with an information ratio of 0.75. He makes a prediction of the movement in the market each quarter. Jane Fortina is a stock selector who follows 50 companies and revises her assessment each quarter. She also has an information ratio of 0.75. Assuming both managers have unconstrained portfolios, which of the following statements regarding the two managers is most accurate?", "opts": ["As Fortina’s strategy has a much larger breadth, she must have a larger information coefficient than Grenkin.", "As both managers have the same information ratio, they must also have the same information coefficient.", "As Grenkin makes fewer bets per year, he requires a higher information coefficient on each bet than Fortina to achieve the same information ratio."], "ans": "C", "expl": "√BR (IR) = IC ×  As a stock selector, Fortina makes many more bets per period and has a much larger breadth. She therefore requires a lower information coefficient than Grenkin to achieve the same information ratio. Grenkin requires a higher coefficient. Grenkin 0.75 = IC × 4½  IC = 0.75/2  = 0.375 | Fontina 0.75 = IC × 200½  IC = 0.75/14.14  = 0.053 (Note: Calculations are not required)", "explhtml": "<p>√BR<\/p><p>(IR) = IC × <\/p><p>As a stock selector, Fortina makes many more bets per period and has a much larger breadth. She therefore requires a lower information coefficient than Grenkin to achieve the same information ratio. Grenkin requires a higher coefficient.<\/p><div class=\"tbl\"><table><tr><td>Grenkin 0.75 = IC × 4<sup>½<\/sup><\/td><td>IC = 0.75/2<\/td><td>= 0.375<\/td><\/tr><tr><td>Fontina 0.75 = IC × 200<sup>½<\/sup><\/td><td>IC = 0.75/14.14<\/td><td>= 0.053<\/td><\/tr><\/table><\/div><p>(Note: Calculations are not required)<\/p>", "qhtml": "<div class=\"pp-topic\">Module 35.4, LOS 35.e<\/div><div class=\"qtext\"><p>Tom Grenkin is a market timer with an information ratio of 0.75. He makes a prediction of the movement in the market each quarter. Jane Fortina is a stock selector who follows 50 companies and revises her assessment each quarter. She also has an information ratio of 0.75. Assuming both managers have unconstrained portfolios, which of the following statements regarding the two managers is most accurate?<\/p><\/div>", "subj": "portfolio"}, {"n": 14, "q": "Zeta fund has active return and active risk of 1.6% and 8% respectively. Benchmark portfolio has a Sharpe ratio of 0.35 and standard deviation of benchmark returns is 10.5%. What is the weight of benchmark portfolio in a portfolio consisting of Zeta fund and the benchmark portfolio assuming that the portfolio is constructed to have optimal active risk?", "opts": ["0.2", "0.1667", "0.25"], "ans": "C", "expl": "Information Ratio = active return / active risk = 1.6% / 8% = 0.2 IR  0.2 | Optimal level of active risk = σ∗A =  σB =  (10.5) = 6% 0.35 SRB Active risk of Zeta fund = 8% Weight of Zeta fund = 6% / 8% = 0.75 Weight of benchmark = 0.25", "explhtml": "<p>Information Ratio = active return / active risk = 1.6% / 8% = 0.2<\/p><div class=\"tbl\"><table><tr><td>IR<\/td><td>0.2<\/td><\/tr><tr><td>Optimal level of active risk = σ<sup>∗<\/sup><sub>A<\/sub> =<\/td><td>σ<sub>B<\/sub> =<\/td><td>(10.5) = 6%<\/td><\/tr><\/table><\/div><p>0.35<\/p><p>SR<sub>B<\/sub><\/p><p>Active risk of Zeta fund = 8%<\/p><p>Weight of Zeta fund = 6% / 8% = 0.75<\/p><p>Weight of benchmark = 0.25<\/p>", "qhtml": "<div class=\"pp-topic\">Module 35.2, LOS 35.b<\/div><div class=\"qtext\"><p>Zeta fund has active return and active risk of 1.6% and 8% respectively. Benchmark portfolio has a Sharpe ratio of 0.35 and standard deviation of benchmark returns is 10.5%.<\/p><p>What is the weight of benchmark portfolio in a portfolio consisting of Zeta fund and the benchmark portfolio assuming that the portfolio is constructed to have optimal active risk?<\/p><\/div>", "subj": "portfolio"}, {"n": 15, "q": "Which of the following is correct for an unconstrained active portfolio?", "opts": ["TC>1", "TC=1", "TC<1"], "ans": "B", "expl": "TC=1 if the active portfolio has no constraints.", "explhtml": "<p>TC=1 if the active portfolio has no constraints.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 35.3, LOS 35.c<\/div><div class=\"qtext\"><p>Which of the following is correct for an unconstrained active portfolio?<\/p><\/div>", "subj": "portfolio"}, {"n": 16, "q": "Which of the following terms is the cross-sectional correlation between forecasted active returns and actual active weights adjusted for risk?", "opts": ["Breadth", "Information Coefficient", "Transfer Coefficient"], "ans": "C", "expl": "Transfer coefficient = TC = CORR (μᵢ/σᵢ, Δ wᵢσᵢ)", "explhtml": "<p>Transfer coefficient = TC = CORR (μ<sub>i<\/sub>/σ<sub>i<\/sub>, Δ w<sub>i<\/sub>σ<sub>i<\/sub>)<\/p>", "qhtml": "<div class=\"pp-topic\">Module 35.3, LOS 35.c<\/div><div class=\"qtext\"><p>Which of the following terms is the cross-sectional correlation between forecasted active returns and actual active weights adjusted for risk?<\/p><\/div>", "subj": "portfolio"}, {"n": 17, "q": "Alisa Darent is evaluating several active portfolio managers with the same style and benchmark portfolio. Manager Active return Active risk Alfred 3.00% 12.00% Brad 2.20% 11.00% Charles 2.00% 10.50% Benchmark return is expected to be 11%. What will be the maximum expected return for Darent's portfolio assuming that she wants to limit her active risk to 11%?", "opts": ["13.75%", "2.75%", "2.20%"], "ans": "A", "expl": "Darent will select the manager with the highest information ratio – or Alfred. IR (Alfred) = 3/12 = 0.25 IR(Brad) = 2.2/11 = 0.20 IR(Charles) = 2.0/10.50 = 0.19 Expected active return = E(RA) = IR x σA =0.25 x 11 = 2.75%. Expected return = E(RB) + E(RA) = 11% + 2.75% = 13.75%", "explhtml": "<p>Darent will select the manager with the highest information ratio – or Alfred.<\/p><p>IR (Alfred) = 3/12 = 0.25<\/p><p>IR(Brad) = 2.2/11 = 0.20<\/p><p>IR(Charles) = 2.0/10.50 = 0.19<\/p><p>Expected active return = E(R<sub>A<\/sub>) = IR x σ<sub>A<\/sub> =0.25 x 11 = 2.75%.<\/p><p>Expected return = E(R<sub>B<\/sub>) + E(R<sub>A<\/sub>) = 11% + 2.75% = 13.75%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 35.3, LOS 35.d<\/div><div class=\"qtext\"><p>Alisa Darent is evaluating several active portfolio managers with the same style and benchmark portfolio.<\/p><div class=\"tbl\"><table><tr><td>Manager<\/td><td>Active return<\/td><td>Active risk<\/td><\/tr><tr><td>Alfred<\/td><td>3.00%<\/td><td>12.00%<\/td><\/tr><tr><td>Brad<\/td><td>2.20%<\/td><td>11.00%<\/td><\/tr><tr><td>Charles<\/td><td>2.00%<\/td><td>10.50%<\/td><\/tr><\/table><\/div><p>Benchmark return is expected to be 11%. What will be the maximum expected return for Darent&#x27;s portfolio assuming that she wants to limit her active risk to 11%?<\/p><\/div>", "subj": "portfolio"}, {"n": 18, "q": "Which of the following is correct for a constrained active portfolio?", "opts": ["TC=1", "TC<1", "TC>1"], "ans": "B", "expl": "When we impose constraints on portfolios, the actual active weights (Δwᵢ) will differ from optimal active weights (Δwᵢ*) and TC<1.", "explhtml": "<p>When we impose constraints on portfolios, the actual active weights (Δw<sub>i<\/sub>) will differ from optimal active weights (Δw<sub>i<\/sub>*) and TC&lt;1.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 35.3, LOS 35.c<\/div><div class=\"qtext\"><p>Which of the following is correct for a constrained active portfolio?<\/p><\/div>", "subj": "portfolio"}, {"n": 19, "q": "Helen Wilde is trying to estimate the active return of Optimal fund. A comparison of Optimal's holdings and that of the benchmark are shown below: Asset Class (i) Optimal\nWeight (wPi) Benchmark\nWeight (wBi) Optimal\nReturn E(RPi) Benchmark\nReturn\nE(RBi) Industrials 30% 40% 11% 12% Financials 50% 30% 6% 5% Utilities 20% 30% 14% 12% The expected active return due to asset allocation for Optimal is closest to:", "opts": ["– 0.86%.", "– 1.40%.", "-0.44%."], "ans": "B", "expl": "Asset Class\n(i) Portfolio\nWeight (wPi) Benchmark\nWeight (wBi) Benchmark\nReturn\nE(RBi) Active\nReturn\nWeight\n(Δwi) (Δwi)\n(E(RBi)) Industrials 30% 40% 12% -10% -1.20% Financials 50% 30% 5% 20% 1.00% Utilities 20% 30% 12% -10% -1.20%", "explhtml": "<div class=\"tbl\"><table><tr><td>Asset Class<br>(i)<\/td><td>Portfolio<br>Weight (wPi)<\/td><td>Benchmark<br>Weight (wBi)<\/td><td>Benchmark<br>Return<br>E(RBi)<\/td><td>Active<br>Return<br>Weight<br>(Δwi)<\/td><td>(Δwi)<br>(E(RBi))<\/td><\/tr><tr><td>Industrials<\/td><td>30%<\/td><td>40%<\/td><td>12%<\/td><td>-10%<\/td><td>-1.20%<\/td><\/tr><tr><td>Financials<\/td><td>50%<\/td><td>30%<\/td><td>5%<\/td><td>20%<\/td><td>1.00%<\/td><\/tr><tr><td>Utilities<\/td><td>20%<\/td><td>30%<\/td><td>12%<\/td><td>-10%<\/td><td>-1.20%<\/td><\/tr><\/table><\/div>", "qhtml": "<div class=\"pp-topic\">Module 35.1, LOS 35.a<\/div><div class=\"qtext\"><p>Helen Wilde is trying to estimate the active return of Optimal fund. A comparison of Optimal&#x27;s holdings and that of the benchmark are shown below:<\/p><div class=\"tbl\"><table><tr><td>Asset Class (i)<\/td><td>Optimal<br>Weight (wPi)<\/td><td>Benchmark<br>Weight (wBi)<\/td><td>Optimal<br>Return E(RPi)<\/td><td>Benchmark<br>Return<br>E(RBi)<\/td><\/tr><tr><td>Industrials<\/td><td>30%<\/td><td>40%<\/td><td>11%<\/td><td>12%<\/td><\/tr><tr><td>Financials<\/td><td>50%<\/td><td>30%<\/td><td>6%<\/td><td>5%<\/td><\/tr><tr><td>Utilities<\/td><td>20%<\/td><td>30%<\/td><td>14%<\/td><td>12%<\/td><\/tr><\/table><\/div><p>The expected active return due to asset allocation for Optimal is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 20, "q": "An active manager has an information coefficient of 0.05 and makes 36 independent bets per year. What is the manager's information ratio given a transfer coefficient of 0.75?", "opts": ["0.45", "0.23", "1.35"], "ans": "B", "expl": "Information ratio = IR = (TC) IC√BR = (0.75) (0.05) √36 = 0.225", "explhtml": "<p>Information ratio =<\/p><p>IR = (TC) IC√BR = (0.75) (0.05) √36 = 0.225<\/p>", "qhtml": "<div class=\"pp-topic\">Module 35.3, LOS 35.c<\/div><div class=\"qtext\"><p>An active manager has an information coefficient of 0.05 and makes 36 independent bets per year. What is the manager&#x27;s information ratio given a transfer coefficient of 0.75?<\/p><\/div>", "subj": "portfolio"}, {"n": 21, "q": "An active manager expects his information coefficient to drop from 0.08 to 0.02 in the coming period due to extremely volatile and unpredictable markets. As a response he intends to increase his breadth by a factor of 4. Which of the following statements is most accurately describes the impact on the information ratio?", "opts": ["The information ratio will increase", "The information ratio will remain constant", "The information ratio will decrease"], "ans": "C", "expl": "√BR Information ratio (IR) = IC ×  If breadth is increased by a factor of 4, this would increase the information ratio by a factor of 2. As the information coefficient is decreasing by a factor of 4, the information ratio will decrease.", "explhtml": "<p>√BR<\/p><p>Information ratio (IR) = IC × <\/p><p>If breadth is increased by a factor of 4, this would increase the information ratio by a factor of 2. As the information coefficient is decreasing by a factor of 4, the information ratio will decrease.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 35.3, LOS 35.c<\/div><div class=\"qtext\"><p>An active manager expects his information coefficient to drop from 0.08 to 0.02 in the coming period due to extremely volatile and unpredictable markets. As a response he intends to increase his breadth by a factor of 4. Which of the following statements is most accurately describes the impact on the information ratio?<\/p><\/div>", "subj": "portfolio"}, {"n": 22, "q": "An active manager has an information coefficient of 0.07, transfer coefficient of 0.90, and makes 49 independent bets per year. Benchmark portfolio has a Sharpe ratio of 0.40 and standard deviation of benchmark returns is 12%. The optimal amount of active risk is closest to:", "opts": ["14%", "8%", "6%"], "ans": "A", "expl": "IR = ( TC ) IC √BR = ( 0.90 ) ( 0.07 ) √49 = 0.441 For a constrained portfolio, the optimal level of residual risk can be computed as: σ*A =(IR / SBB)σB = (0.441 / 0.40)(0.12) = 13.23%", "explhtml": "<p>IR = ( TC ) IC √BR = ( 0.90 ) ( 0.07 ) √49 = 0.441<\/p><p>For a constrained portfolio, the optimal level of residual risk can be computed as:<\/p><p>σ*<sub>A<\/sub> =(IR / SB<sub>B<\/sub>)σ<sub>B<\/sub> = (0.441 / 0.40)(0.12) = 13.23%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 35.3, LOS 35.c<\/div><div class=\"qtext\"><p>An active manager has an information coefficient of 0.07, transfer coefficient of 0.90, and makes 49 independent bets per year. Benchmark portfolio has a Sharpe ratio of 0.40 and standard deviation of benchmark returns is 12%. The optimal amount of active risk is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 23, "q": "Charles Griffith makes quarterly bets between stocks of industrial and utility sectors. Griffith's strategy has an annualized active risk of 18%. Based on the information below, If Griffith wants to limit his active risk to 6%, what is the allocation to Utility sector when Griffith is bullish about Industrial stocks? Benchmark Sector  Weight | Industrial  80% | Utility  20%", "opts": ["5%", "14%", "-13%"], "ans": "C", "expl": "If active risk is limited to 6%, the deviation from the benchmark weights of 80% and 20% is limited to 6%/18% or 33%. Hence when Griffith is bullish about industrials, the weight to that sector will be 80% + 33% or 113% and the weight to utility sector will be 20% - 33% or -13%.", "explhtml": "<p>If active risk is limited to 6%, the deviation from the benchmark weights of 80% and 20% is limited to 6%/18% or 33%. Hence when Griffith is bullish about industrials, the weight to that sector will be 80% + 33% or 113% and the weight to utility sector will be 20% - 33% or -13%.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 35.4, LOS 35.e<\/div><div class=\"qtext\"><p>Charles Griffith makes quarterly bets between stocks of industrial and utility sectors. Griffith&#x27;s strategy has an annualized active risk of 18%. Based on the information below, If Griffith wants to limit his active risk to 6%, what is the allocation to Utility sector when Griffith is bullish about Industrial stocks?<\/p><p>Benchmark<\/p><div class=\"tbl\"><table><tr><td>Sector<\/td><td>Weight<\/td><\/tr><tr><td>Industrial<\/td><td>80%<\/td><\/tr><tr><td>Utility<\/td><td>20%<\/td><\/tr><\/table><\/div><\/div>", "subj": "portfolio"}, {"n": 24, "q": "Zeta fund has active return and active risk of 1.6% and 8% respectively. Benchmark portfolio has a Sharpe ratio of 0.35 and standard deviation of benchmark returns is 10.5%. The maximum possible Sharpe ratio of a portfolio consisting of Zeta fund and the benchmark portfolio is closest to:", "opts": ["0.5", "0.55", "0.4"], "ans": "C", "expl": "² + IR²]1/2 = [0.35² + 0.20²]1/2 = 0.4031 SRP = [SRB", "explhtml": "<p><sup>2<\/sup> + IR<sup>2<\/sup>]<sup>1/2<\/sup> = [0.35<sup>2<\/sup> + 0.20<sup>2<\/sup>]<sup>1/2<\/sup> = 0.4031<\/p><p>SR<sub>P<\/sub> = [SR<sub>B<\/sub><\/p>", "qhtml": "<div class=\"pp-topic\">Module 35.2, LOS 35.b<\/div><div class=\"qtext\"><p>Zeta fund has active return and active risk of 1.6% and 8% respectively. Benchmark portfolio has a Sharpe ratio of 0.35 and standard deviation of benchmark returns is 10.5%.<\/p><p>The maximum possible Sharpe ratio of a portfolio consisting of Zeta fund and the benchmark portfolio is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 25, "q": "According to the fundamental law of active management, how many forecasts is Galab making per month?", "opts": ["3.", "10.", "36."], "ans": "B", "expl": "The extended law states that: active return = TC × IC × √(BR) × active risk 10.8% = 0.8 × 0.22 × √(BR) × 5.6% BR = 120 (annual), Galab is making 10 bets per month.", "explhtml": "<p>The extended law states that:<\/p><p>active return = TC × IC × √(BR) × active risk<\/p><p>10.8% = 0.8 × 0.22 × √(BR) × 5.6%<\/p><p>BR = 120 (annual), Galab is making 10 bets per month.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 25–28<\/summary><div class=\"vig-body\"><p>Sundar Mithai, CFA, is a fund manager for Pearl Investments and makes a monthly report to the firm's partners. Mithai mentions two active managers in his report, Galab and Phasar. Exhibit 1 provides additional information on the two managers:<\/p><p>Exhibit 1: Selected Information on Galab and Phasar<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v005.webp\" style=\"max-width:min(100%,517px)\" alt=\"Galab Phasar Information coefficient 0.22 0.37 Transfer coefficient 0.73 0.8 Active risk 5.6% 6.6% 10.8% 9.2% Active return\"><p>Mithai makes the following comments regarding the two active managers:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v006.webp\" style=\"max-width:min(100%,630px)\" alt=\"Comment The investment mandate of Phasar appears to be less constrained relative to 1: Galab. Comment Galab appears to have better skill at predicting returns.\"><p>Mithai recently decided to give all the analysts at the firm a refresher on the fundamental law of active portfolio management. Details of a hypothetical unconstrained fund is shown in Exhibit Exhibit 2: Hypothetical Fund Information coefficient 0.14<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v007.webp\" style=\"max-width:min(100%,219px)\" alt=\"Monthly active bets 5 4.32% Active risk\"><\/div><\/details><div class=\"pp-topic\">Module 35.4, LOS 35.e<\/div><div class=\"qtext\"><p>According to the fundamental law of active management, how many forecasts is Galab making per month?<\/p><\/div>", "subj": "portfolio"}, {"n": 26, "q": "How many of Mithai's comments are correct in relation to the comparison between Galab and Phasar?", "opts": ["One.", "Both.", "None."], "ans": "C", "expl": "Both comments are incorrect. Phasar has higher information coefficient, which indicates better skill at predicting results. Phasar has also a lower transfer coefficient, which indicates that it is a more restrained fund.", "explhtml": "<p>Both comments are incorrect. Phasar has higher information coefficient, which indicates better skill at predicting results. Phasar has also a lower transfer coefficient, which indicates that it is a more restrained fund.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 25–28<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sundar Mithai, CFA, is a fund manager for Pearl Investments and makes a monthly report to the firm's partners. Mithai mentions two active managers in his report, Galab and Phasar. Exhibit 1 provides additional information on the two managers:<\/p><p>Exhibit 1: Selected Information on Galab and Phasar<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v005.webp\" style=\"max-width:min(100%,517px)\" alt=\"Galab Phasar Information coefficient 0.22 0.37 Transfer coefficient 0.73 0.8 Active risk 5.6% 6.6% 10.8% 9.2% Active return\"><p>Mithai makes the following comments regarding the two active managers:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v006.webp\" style=\"max-width:min(100%,630px)\" alt=\"Comment The investment mandate of Phasar appears to be less constrained relative to 1: Galab. Comment Galab appears to have better skill at predicting returns.\"><p>Mithai recently decided to give all the analysts at the firm a refresher on the fundamental law of active portfolio management. Details of a hypothetical unconstrained fund is shown in Exhibit Exhibit 2: Hypothetical Fund Information coefficient 0.14<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v007.webp\" style=\"max-width:min(100%,219px)\" alt=\"Monthly active bets 5 4.32% Active risk\"><\/div><\/details><div class=\"pp-topic\">Module 35.3, LOS 35.c<\/div><div class=\"qtext\"><p>How many of Mithai&#x27;s comments are correct in relation to the comparison between Galab and Phasar?<\/p><\/div>", "subj": "portfolio"}, {"n": 27, "q": "The expected active return generated by the hypothetical fund described in Exhibit 2 is:", "opts": ["3.12%.", "4.68%.", "8.20%."], "ans": "B", "expl": "The expected level of active return achieved by a portfolio is calculated as follows: E(RA) = TC(IC) √(BR) σA where: TC = transfer co-efficient IC = information co-efficient BR = number of independent active bets taken per year σA = active risk In an unconstrained portfolio, the transfer co-efficient is equal to 1. Therefore the active return generated by the fund will be: E(RA) = 1 × 0.14 × √60 × 4.32% = 4.68%", "explhtml": "<p>The expected level of active return achieved by a portfolio is calculated as follows:<\/p><p>E(R<sub>A<\/sub>) = TC(IC) √(BR) σ<sub>A<\/sub><\/p><p>where:<\/p><p>TC = transfer co-efficient<\/p><p>IC = information co-efficient<\/p><p>BR = number of independent active bets taken per year<\/p><p>σ<sub>A<\/sub> = active risk<\/p><p>In an unconstrained portfolio, the transfer co-efficient is equal to 1. Therefore the active return generated by the fund will be:<\/p><p>E(R<sub>A<\/sub>) = 1 × 0.14 × √60 × 4.32% = 4.68%<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 25–28<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sundar Mithai, CFA, is a fund manager for Pearl Investments and makes a monthly report to the firm's partners. Mithai mentions two active managers in his report, Galab and Phasar. Exhibit 1 provides additional information on the two managers:<\/p><p>Exhibit 1: Selected Information on Galab and Phasar<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v005.webp\" style=\"max-width:min(100%,517px)\" alt=\"Galab Phasar Information coefficient 0.22 0.37 Transfer coefficient 0.73 0.8 Active risk 5.6% 6.6% 10.8% 9.2% Active return\"><p>Mithai makes the following comments regarding the two active managers:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v006.webp\" style=\"max-width:min(100%,630px)\" alt=\"Comment The investment mandate of Phasar appears to be less constrained relative to 1: Galab. Comment Galab appears to have better skill at predicting returns.\"><p>Mithai recently decided to give all the analysts at the firm a refresher on the fundamental law of active portfolio management. Details of a hypothetical unconstrained fund is shown in Exhibit Exhibit 2: Hypothetical Fund Information coefficient 0.14<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v007.webp\" style=\"max-width:min(100%,219px)\" alt=\"Monthly active bets 5 4.32% Active risk\"><\/div><\/details><div class=\"pp-topic\">Module 35.3, LOS 35.c<\/div><div class=\"qtext\"><p>The expected active return generated by the hypothetical fund described in Exhibit 2 is:<\/p><\/div>", "subj": "portfolio"}, {"n": 28, "q": "If the hypothetical fund described in Exhibit 2 was subject to investment constraints, its expected active return would be expected to:", "opts": ["rise.", "fall.", "remain unchanged."], "ans": "B", "expl": "If an actively managed portfolio is not subject to investment constraints, its transfer co-efficient will be equal to 1, reflecting the manager's ability to achieve optimal active weight in the portfolio. If constraints are imposed, the transfer co-efficient will be between 0 and 1. Given active return is positively related to the transfer co-efficient, the imposition of constraints must lead to a reduction in expected active return.", "explhtml": "<p>If an actively managed portfolio is not subject to investment constraints, its transfer co-efficient will be equal to 1, reflecting the manager&#x27;s ability to achieve optimal active weight in the portfolio. If constraints are imposed, the transfer co-efficient will be between 0 and 1. Given active return is positively related to the transfer co-efficient, the imposition of constraints must lead to a reduction in expected active return.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 25–28<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sundar Mithai, CFA, is a fund manager for Pearl Investments and makes a monthly report to the firm's partners. Mithai mentions two active managers in his report, Galab and Phasar. Exhibit 1 provides additional information on the two managers:<\/p><p>Exhibit 1: Selected Information on Galab and Phasar<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v005.webp\" style=\"max-width:min(100%,517px)\" alt=\"Galab Phasar Information coefficient 0.22 0.37 Transfer coefficient 0.73 0.8 Active risk 5.6% 6.6% 10.8% 9.2% Active return\"><p>Mithai makes the following comments regarding the two active managers:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v006.webp\" style=\"max-width:min(100%,630px)\" alt=\"Comment The investment mandate of Phasar appears to be less constrained relative to 1: Galab. Comment Galab appears to have better skill at predicting returns.\"><p>Mithai recently decided to give all the analysts at the firm a refresher on the fundamental law of active portfolio management. Details of a hypothetical unconstrained fund is shown in Exhibit Exhibit 2: Hypothetical Fund Information coefficient 0.14<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v007.webp\" style=\"max-width:min(100%,219px)\" alt=\"Monthly active bets 5 4.32% Active risk\"><\/div><\/details><div class=\"pp-topic\">Module 35.3, LOS 35.c<\/div><div class=\"qtext\"><p>If the hypothetical fund described in Exhibit 2 was subject to investment constraints, its expected active return would be expected to:<\/p><\/div>", "subj": "portfolio"}, {"n": 29, "q": "In relation to funds Alpha, Bankso, and Crystal, the highest achievable Sharpe ratio is closest to:", "opts": ["0.85.", "0.90.", "0.95."], "ans": "C", "expl": "First, find out which fund has the highest information ratio (IR) as IR = active return / active risk. This would be Crystal with an IR of 0.806. Then apply the following formula to discover the combined Sharpe ratio (SR): SR²  P = SR²  B + IR² ² = 0.52 + 0.8062 = 0.8996, SRP = 0.9485 SRP", "explhtml": "<p>First, find out which fund has the highest information ratio (IR) as IR = active return / active risk. This would be Crystal with an IR of 0.806. Then apply the following formula to discover the combined Sharpe ratio (SR): SR<sup>2<\/sup> &nbsp; <sub>P<\/sub> = SR<sup>2<\/sup> &nbsp; <sub>B<\/sub> + IR<sup>2<\/sup><\/p><p><sup>2<\/sup> = 0.52 + 0.8062 = 0.8996, SR<sub>P<\/sub> = 0.9485<\/p><p>SR<sub>P<\/sub><\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 29–32<\/summary><div class=\"vig-body\"><p>Radina Radichkava, CFA, is considering investing in one of three actively managed funds whose benchmark is the FTSE 100. The Sharpe ratio and standard deviation of the benchmark are 0.50 and 15%, respectively.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v008.webp\" style=\"max-width:min(100%,293px)\" alt=\"Alpha Bankso Crystal 2.8% 12.5% Active return 3.2% 15.5% 3.6% 4.1% Active risk\"><p>Radichkova is also analyzing an actively managed portfolio consisting of financials and pharmaceuticals. The following table shows the weights and returns of the benchmark and portfolio:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v009.webp\" style=\"max-width:min(100%,312px)\" alt=\"Sector WB WPRB RP 50% 70% 9.2% 17.8% Financials Pharmaceuticals 50% 30% 8.1% 6.3%\"><p>Radichkova makes the following comments about the two-sector portfolio:<\/p><p>Comment 1: The value added is 5.7%.<\/p><p>Comment 2: The asset allocation decision only accounts for 0.22% of the value added.<\/p><p>Radichkova is writing a summary of the fundamental law of active management. In that section of the report, she states that the transfer coefficient can be viewed as the correlation between:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v010.webp\" style=\"max-width:min(100%,546px)\" alt=\"1. ex-ante active returns and actual active weights 2. risk-weighted optimal active weights and risk-weighted actual active weights 3. ex-ante active returns and realized active returns\"><\/div><\/details><div class=\"pp-topic\">Module 35.2, LOS 35.b<\/div><div class=\"qtext\"><p>In relation to funds Alpha, Bankso, and Crystal, the highest achievable Sharpe ratio is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 30, "q": "If the FTSE 100 and Crystal fund are combined in an optimal portfolio, what proportion should be invested in Crystal?", "opts": ["136%.", "146%.", "156%."], "ans": "C", "expl": "We first compute the optimal level of risk: IR  0.806 | σA =  σB  σA =  0.15 = 0.242 , therefore,  0.5 SRB This implies a weight in Crystal of 0.242 / 0.155 = 156%.", "explhtml": "<p>We first compute the optimal level of risk:<\/p><div class=\"tbl\"><table><tr><td>IR<\/td><td>0.806<\/td><\/tr><tr><td>σ<sub>A<\/sub> =<\/td><td>σ<sub>B<\/sub><\/td><td>σ<sub>A<\/sub> =<\/td><td>0.15 = 0.242<\/td><\/tr><\/table><\/div><p>, therefore, <\/p><p>0.5<\/p><p>SR<sub>B<\/sub><\/p><p>This implies a weight in Crystal of 0.242 / 0.155 = 156%.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 29–32<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Radina Radichkava, CFA, is considering investing in one of three actively managed funds whose benchmark is the FTSE 100. The Sharpe ratio and standard deviation of the benchmark are 0.50 and 15%, respectively.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v008.webp\" style=\"max-width:min(100%,293px)\" alt=\"Alpha Bankso Crystal 2.8% 12.5% Active return 3.2% 15.5% 3.6% 4.1% Active risk\"><p>Radichkova is also analyzing an actively managed portfolio consisting of financials and pharmaceuticals. The following table shows the weights and returns of the benchmark and portfolio:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v009.webp\" style=\"max-width:min(100%,312px)\" alt=\"Sector WB WPRB RP 50% 70% 9.2% 17.8% Financials Pharmaceuticals 50% 30% 8.1% 6.3%\"><p>Radichkova makes the following comments about the two-sector portfolio:<\/p><p>Comment 1: The value added is 5.7%.<\/p><p>Comment 2: The asset allocation decision only accounts for 0.22% of the value added.<\/p><p>Radichkova is writing a summary of the fundamental law of active management. In that section of the report, she states that the transfer coefficient can be viewed as the correlation between:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v010.webp\" style=\"max-width:min(100%,546px)\" alt=\"1. ex-ante active returns and actual active weights 2. risk-weighted optimal active weights and risk-weighted actual active weights 3. ex-ante active returns and realized active returns\"><\/div><\/details><div class=\"pp-topic\">Module 35.2, LOS 35.b<\/div><div class=\"qtext\"><p>If the FTSE 100 and Crystal fund are combined in an optimal portfolio, what proportion should be invested in Crystal?<\/p><\/div>", "subj": "portfolio"}, {"n": 31, "q": "How many of Radichkova's comments are correct in relation to the two-sector portfolio?", "opts": ["One.", "Both.", "None."], "ans": "B", "expl": "Both comments are correct. The return of the portfolio is 70% × 17.8 + 30% × 6.3% = 14.35%. The return of the benchmark is 50% × 9.2% + 50% × 8.1% = 8.65%. Value added = 14.35 – 8.65 = 5.7%. Return from asset allocation is (70% – 50%) × 9.2% + (30% – 50%) × 8.1% = 0.22% (i.e., active weights times benchmark returns). This implies that return from stock selection is 5.7 – 0.22 = 5.48%. Let us check that: 70% × (17.8% – 9.2%) + 30% × (6.3% – 8.1%) = 5.48% (i.e., portfolio weights times active returns).", "explhtml": "<p>Both comments are correct.<\/p><p>The return of the portfolio is 70% × 17.8 + 30% × 6.3% = 14.35%.<\/p><p>The return of the benchmark is 50% × 9.2% + 50% × 8.1% = 8.65%.<\/p><p>Value added = 14.35 – 8.65 = 5.7%.<\/p><p>Return from asset allocation is (70% – 50%) × 9.2% + (30% – 50%) × 8.1% = 0.22% (i.e., active weights times benchmark returns).<\/p><p>This implies that return from stock selection is 5.7 – 0.22 = 5.48%.<\/p><p>Let us check that:<\/p><p>70% × (17.8% – 9.2%) + 30% × (6.3% – 8.1%) = 5.48% (i.e., portfolio weights times active returns).<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 29–32<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Radina Radichkava, CFA, is considering investing in one of three actively managed funds whose benchmark is the FTSE 100. The Sharpe ratio and standard deviation of the benchmark are 0.50 and 15%, respectively.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v008.webp\" style=\"max-width:min(100%,293px)\" alt=\"Alpha Bankso Crystal 2.8% 12.5% Active return 3.2% 15.5% 3.6% 4.1% Active risk\"><p>Radichkova is also analyzing an actively managed portfolio consisting of financials and pharmaceuticals. The following table shows the weights and returns of the benchmark and portfolio:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v009.webp\" style=\"max-width:min(100%,312px)\" alt=\"Sector WB WPRB RP 50% 70% 9.2% 17.8% Financials Pharmaceuticals 50% 30% 8.1% 6.3%\"><p>Radichkova makes the following comments about the two-sector portfolio:<\/p><p>Comment 1: The value added is 5.7%.<\/p><p>Comment 2: The asset allocation decision only accounts for 0.22% of the value added.<\/p><p>Radichkova is writing a summary of the fundamental law of active management. In that section of the report, she states that the transfer coefficient can be viewed as the correlation between:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v010.webp\" style=\"max-width:min(100%,546px)\" alt=\"1. ex-ante active returns and actual active weights 2. risk-weighted optimal active weights and risk-weighted actual active weights 3. ex-ante active returns and realized active returns\"><\/div><\/details><div class=\"pp-topic\">Module 35.1, LOS 35.a<\/div><div class=\"qtext\"><p>How many of Radichkova&#x27;s comments are correct in relation to the two-sector portfolio?<\/p><\/div>", "subj": "portfolio"}, {"n": 32, "q": "Which are the correct definitions of the transfer coefficient included in Radichkova's report?", "opts": ["1 and 2.", "2 and 3.", "1 and 3."], "ans": "A", "expl": "The first two are correct definitions whereas number 3 is the definition of the information coefficient.", "explhtml": "<p>The first two are correct definitions whereas number 3 is the definition of the information coefficient.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 29–32<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Radina Radichkava, CFA, is considering investing in one of three actively managed funds whose benchmark is the FTSE 100. The Sharpe ratio and standard deviation of the benchmark are 0.50 and 15%, respectively.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v008.webp\" style=\"max-width:min(100%,293px)\" alt=\"Alpha Bankso Crystal 2.8% 12.5% Active return 3.2% 15.5% 3.6% 4.1% Active risk\"><p>Radichkova is also analyzing an actively managed portfolio consisting of financials and pharmaceuticals. The following table shows the weights and returns of the benchmark and portfolio:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v009.webp\" style=\"max-width:min(100%,312px)\" alt=\"Sector WB WPRB RP 50% 70% 9.2% 17.8% Financials Pharmaceuticals 50% 30% 8.1% 6.3%\"><p>Radichkova makes the following comments about the two-sector portfolio:<\/p><p>Comment 1: The value added is 5.7%.<\/p><p>Comment 2: The asset allocation decision only accounts for 0.22% of the value added.<\/p><p>Radichkova is writing a summary of the fundamental law of active management. In that section of the report, she states that the transfer coefficient can be viewed as the correlation between:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r35/v010.webp\" style=\"max-width:min(100%,546px)\" alt=\"1. ex-ante active returns and actual active weights 2. risk-weighted optimal active weights and risk-weighted actual active weights 3. ex-ante active returns and realized active returns\"><\/div><\/details><div class=\"pp-topic\">Module 35.3, LOS 35.c<\/div><div class=\"qtext\"><p>Which are the correct definitions of the transfer coefficient included in Radichkova&#x27;s report?<\/p><\/div>", "subj": "portfolio"}, {"n": 33, "q": "Charles Griffith makes quarterly bets between stocks of industrial and utility sectors. The historical correlation between the returns of the two sectors is -0.20 and Griffith's bets have been correct 55% of the time. Further information is as below: Benchmark σ Sector  E (R)  Weight | Industrial  12.00%  13.0%  80% | Utility  5.2%  2.5%  20% The expected annualized active return of Griffith's sector rotation strategy is closest to:", "opts": ["5.48%", "13.72%", "10.64%"], "ans": "A", "expl": "IC = 2(0.55) – 1 = 0.10 ² -2σIσUrIU+ σU  2]1/2 Combined active risk = σC = [σI = [0.13² + 0.025² – 2 (0.13)(0.025)(-0.20)]1/2 = 0.1372 or 13.72% Annualized active risk = 0.1372 x (4)1/2 = 0.2744 or 24.44% √BR   x σA = 0.10 x (4)1/2 x 0.2744 = 0.0548 or 5.48% Annualized active return = IC x  Alternatively, Active return from this strategy using a probability weighted average (given Griffith makes correct calls 55% of time) of combined risk is: (0.55)(0.1372) + (0.45)(-0.1372) = 0.0137 or 1.37% per quarter. Annual active return = 1.37% x 4 = 5.48%.", "explhtml": "<p>IC = 2(0.55) – 1 = 0.10 <sup>2<\/sup> -2σ<sub>I<\/sub>σ<sub>U<\/sub>r<sub>IU<\/sub>+ σ<sub>U<\/sub> &nbsp; 2]1/2<\/p><p>Combined active risk = σ<sub>C<\/sub> = [σ<sub>I<\/sub><\/p><p>= [0.13<sup>2<\/sup> + 0.025<sup>2<\/sup> – 2 (0.13)(0.025)(-0.20)]<sup>1/2<\/sup> = 0.1372 or 13.72%<\/p><p>Annualized active risk = 0.1372 x (4)<sup>1/2<\/sup> = 0.2744 or 24.44% √BR &nbsp;  x σ<sub>A<\/sub> = 0.10 x (4)<sup>1/2<\/sup> x 0.2744 = 0.0548 or 5.48%<\/p><p>Annualized active return = IC x <\/p><p>Alternatively,<\/p><p>Active return from this strategy using a probability weighted average (given Griffith makes correct calls 55% of time) of combined risk is:<\/p><p>(0.55)(0.1372) + (0.45)(-0.1372) = 0.0137 or 1.37% per quarter.<\/p><p>Annual active return = 1.37% x 4 = 5.48%.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 35.4, LOS 35.e<\/div><div class=\"qtext\"><p>Charles Griffith makes quarterly bets between stocks of industrial and utility sectors. The historical correlation between the returns of the two sectors is -0.20 and Griffith&#x27;s bets have been correct 55% of the time. Further information is as below:<\/p><p>  calculation is not required. Given that IR changes with the square root of breadth, a 50% drop in breadth must cause a less than 50% drop in IR. Note that it does not matter if the portfolio is constrained or unconstrained.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 35.3, LOS 35.c<\/div><div class=\"qtext\"><p>An active manager currently covers 40 stocks and makes a forecast for each of them every quarter. Next year he intends to cover the same stocks but only once every 6 months. Assuming the manager&#x27;s skill, measured in terms of the correlation of each forecast with actual returns doesn&#x27;t change, which of the following statements is most accurate?<\/p><\/div>", "subj": "portfolio"}, {"n": 35, "q": "An active manager has an information coefficient of 0.08, transfer coefficient of 0.50, and makes 100 independent bets per year. What is the expected active return for an active risk constraint of 5%?", "opts": ["2.0%", "2.4%", "1.8%"], "ans": "A", "expl": "E (RA) = (TC) IC√BRσA = (0.50) (0.08) √100 (0.05) = 0.02 or 2%", "explhtml": "<p>E (R<sub>A<\/sub>) = (TC) IC√BRσ<sub>A<\/sub> = (0.50) (0.08) √100 (0.05) = 0.02 or 2%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 35.3, LOS 35.c<\/div><div class=\"qtext\"><p>An active manager has an information coefficient of 0.08, transfer coefficient of 0.50, and makes 100 independent bets per year. What is the expected active return for an active risk constraint of 5%?<\/p><\/div>", "subj": "portfolio"}, {"n": 36, "q": "Jon Gamlin is comparing a market timing strategy with a stock selection strategy. He draws the following two conclusions for unconstrained active managers: Conclusion 1 To achieve the same information ratio, a market timer making weekly forecasts on the movement of the market needs to have a higher skill level than a stock selector following 25 stocks and updating the forecast semi-annually Conclusion 2 A specialist following only 4 stocks who revises his forecast 100 times per year will achieve t "n": 37, "q": "Helen Wilde is trying to estimate the active return of Optimal fund. A comparison of Optimal's holdings and that of the benchmark are shown below: Asset Class (i) Optimal\nWeight (wPi) Benchmark\nWeight (wBi) Optimal\nReturn E(RPi) Benchmark\nReturn\nE(RBi) Industrials 30% 40% 11% 12% Financials 50% 30% 6% 5% Utilities 20% 30% 14% 12% The expected active return for Optimal is closest to:", "opts": ["– 1.40%", "– 0.80%", "-0.44%"], "ans": "B", "expl": "Portfolio return = RP = ∑(wPi) x E(RPi) = 9.10% Benchmark return = RB = ∑(wBi) x E(RBi) = 9.90% Active return = RP - RB = 9.10% – 9.90% = -0.80%", "explhtml": "<p>Portfolio return = R<sub>P<\/sub> = ∑(w<sub>Pi<\/sub>) x E(R<sub>Pi<\/sub>) = 9.10%<\/p><p>Benchmark return = R<sub>B<\/sub> = ∑(w<sub>Bi<\/sub>) x E(R<sub>Bi<\/sub>) = 9.90%<\/p><p>Active return = R<sub>P<\/sub> - R<sub>B<\/sub> = 9.10% – 9.90% = -0.80%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 35.1, LOS 35.a<\/div><div class=\"qtext\"><p>Helen Wilde is trying to estimate the active return of Optimal fund. A comparison of Optimal&#x27;s holdings and that of the benchmark are shown below:<\/p><div class=\"tbl\"><table><tr><td>Asset Class (i)<\/td><td>Optimal<br>Weight (wPi)<\/td><td>Benchmark<br>Weight (wBi)<\/td><td>Optimal<br>Return E(RPi)<\/td><td>Benchmark<br>Return<br>E(RBi)<\/td><\/tr><tr><td>Industrials<\/td><td>30%<\/td><td>40%<\/td><td>11%<\/td><td>12%<\/td><\/tr><tr><td>Financials<\/td><td>50%<\/td><td>30%<\/td><td>6%<\/td><td>5%<\/td><\/tr><tr><td>Utilities<\/td><td>20%<\/td><td>30%<\/td><td>14%<\/td><td>12%<\/td><\/tr><\/table><\/div><p>The expected active return for Optimal is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 38, "q": "Zeta fund has active return and active risk of 1.6% and 8% respectively. Benchmark portfolio has a Sharpe ratio of 0.35 and standard deviation of benchmark returns is 10.5%. What is the level of active risk that an investor would need to take to maximize the Sharpe ratio of a portfolio consisting of Zeta fund and the benchmark portfolio?", "opts": ["6%", "8%", "7%"], "ans": "A", "expl": "Information ratio (IR) = 1.6% /8% = 0.2 IR  0.2 | Optimal level of active risk = σ∗A =  σB =  (10.5) = 6% 0.35 SRB Active risk of Zeta fund = 8% Weight of Zeta fund = 6% / 8% = 0.75 Weight of benchmark = 0.25", "explhtml": "<p>Information ratio (IR) = 1.6% /8% = 0.2<\/p><div class=\"tbl\"><table><tr><td>IR<\/td><td>0.2<\/td><\/tr><tr><td>Optimal level of active risk = σ<sup>∗<\/sup><sub>A<\/sub> =<\/td><td>σ<sub>B<\/sub> =<\/td><td>(10.5) = 6%<\/td><\/tr><\/table><\/div><p>0.35<\/p><p>SR<sub>B<\/sub><\/p><p>Active risk of Zeta fund = 8%<\/p><p>Weight of Zeta fund = 6% / 8% = 0.75<\/p><p>Weight of benchmark = 0.25<\/p>", "qhtml": "<div class=\"pp-topic\">Module 35.2, LOS 35.b<\/div><div class=\"qtext\"><p>Zeta fund has active return and active risk of 1.6% and 8% respectively. Benchmark portfolio has a Sharpe ratio of 0.35 and standard deviation of benchmark returns is 10.5%.<\/p><p>What is the level of active risk that an investor would need to take to maximize the Sharpe ratio of a portfolio consisting of Zeta fund and the benchmark portfolio?<\/p><\/div>", "subj": "portfolio"}, {"n": 39, "q": "Which of the following statements regarding the information ratio of an unconstrained portfolio is most likely correct?", "opts": ["A market timer who uses independent information to make predictions about market movements on a monthly basis and has an information ratio of 0.20 must have an information coefficient higher than a stock selector with the same information ratio who follows 10 stocks and revises his forecast quarterly", "A market timer who uses independent information to make predictions about market movements on a monthly basis and has an information ratio of 0.20 must have an information coefficient lower than a stock selector with the same information ratio who follows 10 stocks and revises his forecast quarterly", "A market timer who uses independent information to make predictions about market movements on a monthly basis and has an information ratio of 0.20 must have an information coefficient equal to a stock selector with the same information ratio who follows 10 stocks and revises his forecast quarterly"], "ans": "A", "expl": "√BR Unconstrained Information ratio (IR) = IC ×  0.20 = IC × 12½ Market timer:  IC = 0.20 / 3.464  IC = 0.058 0.20 = IC × 40½ Selector:  IC = 0.20 / 6.325  IC = 0.032 The market timer has a lower breadth. In order to achieve the same information ratio he must have a higher information coefficient. Note calculations not required.", "explhtml": "<p>√BR<\/p><p>Unconstrained Information ratio (IR) = IC × <\/p><p>0.20 = IC × 12<sup>½<\/sup> Market timer: &nbsp; IC = 0.20 / 3.464 &nbsp; IC = 0.058<\/p><p>0.20 = IC × 40<sup>½<\/sup> Selector: &nbsp; IC = 0.20 / 6.325 &nbsp; IC = 0.032<\/p><p>The market timer has a lower breadth. In order to achieve the same information ratio he must have a higher information coefficient. Note calculations not required.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 35.4, LOS 35.e<\/div><div class=\"qtext\"><p>Which of the following statements regarding the information ratio of an unconstrained portfolio is most likely correct?<\/p><\/div>", "subj": "portfolio"}, {"n": 40, "q": "Which of the following statements is least accurate?", "opts": ["Sharpe ratio of a portfolio consisting of a combination of benchmark and actively managed portfolio with positive active return will be higher than the Sharpe ratio of the benchmark.", "The information ratio of a constrained active portfolio is unaffected by aggressiveness of the active weights.", "Unlike Sharpe ratio, information ratio is affected due to addition of cash or leverage."], "ans": "B", "expl": "Information ratio of an unconstrained active portfolio is unaffected by aggressiveness of the active weights. Sharpe ratio is unaffected by addition of cash or leverage but information ratio would be. A portfolio consisting of a combination of benchmark and an actively managed portfolio is calculated as: ² = SRB  ² + IR² SRP If the active return is positive, IR>0 and SRP>SRB.", "explhtml": "<p>Information ratio of an unconstrained active portfolio is unaffected by aggressiveness of the active weights. Sharpe ratio is unaffected by addition of cash or leverage but information ratio would be. A portfolio consisting of a combination of benchmark and an actively managed portfolio is calculated as: <sup>2<\/sup> = SR<sub>B<\/sub> &nbsp; <sup>2<\/sup> + IR<sup>2<\/sup><\/p><p>SR<sub>P<\/sub><\/p><p>If the active return is positive, IR&gt;0 and SR<sub>P<\/sub>&gt;SR<sub>B<\/sub>.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 35.2, LOS 35.b<\/div><div class=\"qtext\"><p>Which of the following statements is least accurate?<\/p><\/div>", "subj": "portfolio"}];
const CFG = {"title": "Reading 35 — Analysis of Active Portfolio Management", "subtitle": "CFA Level II · 40 câu · Kaplan Schweser QBank 2025 (28 câu đơn · 12 câu item set)", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}
