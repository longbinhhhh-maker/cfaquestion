s the call price\nplus the present value of the exercise price.\nThe verbal description of the equation in this answer choice is incorrect as it incorrectly rearranges\nterms of the put-call-forward parity.\nDerivatives: explain put-call forward parity for European options", "qhtml": null}, {"n": 48, "q": "Consider a put option selling for $2 in which the exercise price is $45. What is the profit\nfor a put buyer if the price of the underlying at expiration is $41?", "opts": ["-$2", "$2", "$4"], "ans": "B", "expl": "A. Incorrect because this is the put seller's profit. The put's value at expiration = -p =-Max(0,X-S ),\nT T\nwhere p, is the value of the put at expiration, X is the exercise price, and S, is the price of the\nunderlying at expiration. In this case, -Max(0,45-41)=-$4. The put seller's profit=П=-p +p , (where p,\nT 0\nis the price of the put at time 0), or - 4+2=-$2.\nB. Correct because the put's value at expiration = p = Max(0,X-S ), where p is the value of the put at\nT T T\nexpiration, X is the exercise price, and ST is the price of the underlying at expiration. In this case,\nMax(0,45-41) = $4. The put buyer's profit = П = -p -p₁ (where p, is the price of the put at time 0), or 4\nT\n- 2 = $2.\nC. Incorrect because this is the put's value at expiration. The put's value at expiration = -p = Max(S -\nT T\n0,X), where p is the value of the put at expiration, X is the exercise price, and S is the price of the\nT T\nunderlying at expiration. In this case, Max(0,45-41)= $4.\nDerivatives: determine the value at expiration and profit from a long or a short position in a call or\nput option", "qhtml": null}, {"n": 49, "q": "Q. Based on put-call parity, which of the following is equivalent to a long position in the\nunderlying asset?", "opts": ["Long call, long put, and short bond", "Long put, short call, and long bond", "Long call, short put, and long bond"], "ans": "C", "expl": "A. Incorrect because as described in the rationale for the correct answer, the payoff on a long asset\ncan be mimicked using a long call, short put, and a long bond.\nB. Incorrect because as described in the rationale for the correct answer, the payoff on a long asset\ncan be mimicked using a long call, short put, and a long bond.\nC. Correct because the put-call parity relationship implies S = c -p +X/(1+r)T which implies that a long\n0 0 0\nasset = long call, short put, long bond.\nDerivatives: explain put-call parity for European options", "qhtml": null}, {"n": 50, "q": "An analyst gathers the following information about an underlying:\n● Current price of underlying asset $16.0\n● End of period upward price $22.0\n● End of period downward price $12.0\n● Risk-free rate 4.0%\nQ. Using a one-period binomial model, the risk-neutral probability of a price increase is\nclosest to:", "opts": ["0.38.", "0.46.", "0.54."], "ans": "B", "expl": "A. Incorrect because this is the expected return of an upward price move, i.e. S u/S0-1= $22/$16-\n1\n1=1.375-1 = 0.375 0.38. Instead, the risk neutral probability is equal to 0.46, as described in the\nresponse rationale for the correct answer.\nB. Correct because the risk-neutral probability (𝜋) is the computed probability used in binomial\noption pricing by which the discounted weighted sum of expected values of the underlying, S u =R S ,\n1 u 0\nand S d= R S , equal the current option price. Specifically, this probability is computed using the risk-\n1 d 0\nfree rate and assumed up gross return and down gross return of the underlying as in Equation 7.\nπ=1+r-R /Ru-R\nd d\nMore specifically, π , is the risk-neutral probability of an increase in the underlying price to S u =R S ,\n1 u 0\nand (1 - π) is that of a decrease, S d= R S\n1 d 0\nThus, An increase from $16 to $22 or a decrease from $16 to $12 corresponds to:\nRu=$22/$16=1.375 and Rd = $12/$16=0.75.\nUsing the risk-neutral probability (m) of a price increase:\nπ=1+r-Rd/Ru-Rd= (1+0.04 -0.75)/(1.375-0.75)=0.29/0.625 = 0.464≈0.45.\nC. Incorrect because this is the risk-neutral probability of a price decrease (1 - π) = 1 -0.46 = 0.54.\nInstead, the risk neutral probability is equal to 0.46, as described in the response rationale for the\ncorrect answer.\nDerivatives: explain how to value a derivative using a one-period binomial model", "qhtml": null}, {"n": 51, "q": "An investor expects an underlying to go up or down by 25% over the next year. If the risk-\nfree rate is 5%, the risk- neutral probability of a decrease in the underlying price is closest to:", "opts": ["0.25.", "0.40.", "0.60."], "ans": "B", "expl": "A. Incorrect because 0.25 is simply the expected reduction in percent (down move) of the underlying\nafter one year. Instead, the risk-neutral probability (𝜋) is the computed probability used in binomial\noption pricing with 𝜋 = (1+r-Rd)/(Ru-Rd), where π is the risk-neutral probability of an increase in the\nunderlying price, r is the risk-free rate and Rd and Ru represent the underlying asset volatility, i.e.,\nexpected up and down moves of the underlying after the period. Here, r = 0.05, Ru is (1 +0.25)= 1.25\nand Rd is (1-0.25)=0.75. Substituting in yields (1+0.05- 0.75)/(1.25-0.75) = 0.60. Since the risk-neutral\nprobability of a decrease in the underlying price is 1 - π we get 1-0.60 = 0.40.\nB. Correct because the risk-neutral probability (m) is the computed probability used in binomial\noption pricing with π =(1+r-Rd)/(Ru-Rd ),where π is the risk-neutral probability of an increase in the\nunderlying price, r is the risk- free rate and R and R\" represent the underlying asset volatility. i.e.,\nexpected up and down moves of the underlying after the period. Here, r = 0.05, Ru is (1+0.25)=1.25\nand Rd is (1-0.25)=0.75 Substituting in yields (1+0.05 -0.75)/(1.25-0.75)=0.60. Since the risk-neutral\nprobability of a decrease in the underlying price is 1-π we get 1-0.60 = 0.40.\nC. Incorrect because 0.60 is the risk-neutral probability of an increase in the underlying price, not\ndecrease. The risk- neutral probability (π) is the computed probability used in binomial option\npricing with π =(1+r-Rd)/(Ru-Rd ), where π is the risk-neutral probability of an increase in the\nunderlying price, r is the risk-free rate and R° and R° represent the underlying asset volatility. i.e.,\nexpected up and down moves of the underlying after the period. Here, r = 0.05, Ru is (1 +0.25)=1.25\nand Rd is (1 -0.25)=0.75. Substituting in yields (1+0.05 -0.75)/(1.25- 0.75)=0.60. Since the risk-neutral\nprobability of a decrease in the underlying price is 1-π we get 1 -0.60 = 0.40.\nDerivatives: describe the concept of risk neutrality in derivatives pricing", "qhtml": null}, {"n": 52, "q": "Which of the following factors affects the option price when using a binomial model? The:", "opts": ["risk-free rate.", "level of investors' risk aversion.", "expected return of the underlying."], "ans": "A", "expl": "A. Correct because the value of the call option today, c , is computed as the expected value of the\n0\noption at expiration, c u and c d discounted at the risk-free rate, r. Also, this no-arbitrage derivative\n1 1\nvalue established separately from investor views on risk is referred to as risk-neutral pricing.\nB. Incorrect because the value of the call option today, c0, is computed as the expected value of the\noption at expiration, c u and c d discounted at the risk-free rate, r. Also, this no-arbitrage derivative\n1 1\nvalue established separately from investor views on risk is referred to as risk-neutral pricing.\nC. Incorrect because the value of the call option today, c , is computed as the expected value of the\n0\noption at expiration, c u and c d ,discounted at the risk-free rate, r. Also, only the expected\n1 1\nvolatility—that is, gross returns Ru and Rd -and not the expected return are required to price an\noption.\nDerivatives: describe the concept of risk neutrality in derivatives pricing", "qhtml": null}, {"n": 53, "q": "An end user seeking to hedge a specific underlying exposure having non-standard size and\nsettlement dates would most likely trade on a(n):", "opts": ["futures market.", "over-the-counter derivative market.", "exchange-traded derivative market."], "ans": "B", "expl": "A. Incorrect because futures contracts are forward contracts with standardized sizes, dates, and\nunderlyings that trade on futures exchanges. Therefore, they are inappropriate for the non-standard\nsize and settlement dates required by the end user.\nB. Correct because the terms of OTC (over-the-counter) contracts can be customized to match a\ndesired risk exposure profile. This flexibility is important to end users seeking to hedge a specific\nexisting or anticipated underlying exposure based upon non-standard terms.\nC. Incorrect because ETD (exchange-traded derivative) contracts are more formal and standardized,\nwhich facilitates a more liquid and transparent market. Terms and conditions-such as the size of\neach contract, type, quality, and location of underlying for commodities and maturity date are set by\nthe exchange.\nDerivatives: describe the basic features of derivative markets, and contrast over-the-counter and\nexchange-traded derivative markets", "qhtml": null}, {"n": 54, "q": "All else being equal, if the up gross return increases in a one-period binomial model, the\nrisk-neutral probability of an upward price movement of the asset will:", "opts": ["decrease.", "remain the same.", "increase."], "ans": "A", "expl": "A. Correct because the risk-neutral probability (𝜋) is the computed probability used in binomial\noption pricing by which the discounted weighted sum of expected values of the underlying, S u= R S ,\n1 0 0\nand S d= RdS ,. equal the current option price. Specifically, this probability is computed using the risk-\n1 0\nfree rate and assumed up gross return and down gross return of the underlying as in π= (1+r-R )/(R -\nd u\nR ). So, if the up gross return increases in a one-period binomial model, the denominator will\nd\nincrease. Therefore, the risk-neutral probability of an upward price movement of the asset, (π),\ndecreases.\nB. Incorrect because the risk-neutral probability (π) is the computed probability used in binomial\noption pricing by which the discounted weighted sum of expected values of the underlying, S u= RuS\n1 0\nand S d= RdS , equal the current option price. Specifically, this probability is computed using the risk-\n1 0\nfree rate and assumed up gross return and down gross return of the underlying as in π= (1+r-R )/(R -\nd u\nR ). So, if the up gross return increases in a one- period binomial model, the denominator will\nd\nincrease. Therefore, the risk-neutral probability of an upward price movement of the asset, (π),\ndecreases.\nC. Incorrect because the risk-neutral probability (π) is the computed probability used in binomial\noption pricing by which the discounted weighted sum of expected values of the underlying, S u= RuS\n1 0\nand S d= RdS , equal the current option price. Specifically, this probability is computed using the risk-\n1 0\nfree rate and assumed up gross return and down gross return of the underlying as in π= (1+r-R )/(R -\nd u\nR ). So, if the up gross return increases in a one- period binomial model, the denominator will\nd\nincrease. Therefore, the risk-neutral probability of an upward price movement of the asset, (π),\ndecreases.\nDerivatives: describe the concept of risk neutrality in derivatives pricing", "qhtml": null}, {"n": 55, "q": "A forward agreement has the following terms:\n● Spot price at inception $275\n● Forward price $285\n● Number of shares 2,000\nAt expiration, if the spot price is $282, the value to the seller is:", "opts": ["-$6,000.", "$6,000.", "$14,000."], "ans": "B", "expl": "A. Incorrect because this is the value at expiration for the buyer.\n=S -F (T) = $282 - $285=-$3.\nT 0\nHence total value is -$3 x 2,000 shares = -$6,000.\nB. Correct because the value at expiration for the seller:\n= F (T)-S =$285 - $282 = $3.\n0 T\nHence the total value is $3 x 2,000 shares = $6,000.\nC. Incorrect because the spot price at inception is used instead of at settlement:\n≠ F (T)-S = $282 - $275 = $7.\n0 0\nHence the total value is $7 x 2,000 shares = $14,000.\nDerivatives: Explain how the value and price of a forward contract are determined at initiation,\nduring the life of the contract, and at expiration", "qhtml": null}, {"n": 56, "q": "A trader sells a call option on a stock index with a strike price of 2,400 for $25. The value\nof a one-point move in the index is $1. At expiration, the stock index is trading at 2,450. The\ntrader's profit is:", "opts": ["-$50.", "-$25.", "$25."], "ans": "B", "expl": "A. Incorrect because this represents the value, not the profit, to the call seller, which is -\nMax(0,$2,450-$2,400)=- $50, as described in response rationale for the correct answer.\nB. Correct because the writer of a call is the seller of the call: An option is a derivative contract in\nwhich one party. the the buyer, pays a sum of money to the other party, the seller or writer, and\nreceives the right to either buy or sell an underlying asset at a fixed price either on a specific\nexpiration date or at any time prior to the expiration date The profit to the seller of the call is -\nMax(0,S -X) + C . Where X is the exercise price, S is the value of the underlying at expiration and C is\nT 0 T 0\nthe call premium received by the seller. Since one point is equal to one dollar the profit to the call\nseller is: -Max(0,$2,450-$2,400) + $25-$50 + $25 = -$25.\nC. Incorrect because $25 represents the profit to the buyer, not to the seller of the call option. The\nprofit to a call buyer is defined as Max(0,S -X)-co, where X is the exercise price, ,S is the value of the\nT T\nunderlying at expiration and co is the call premium paid by the buyer. Therefore, Max(0,$2,450-\n$2,400)-$25 = $50-$25 = $25.\nDerivatives: determine the value at expiration and profit from a long or a short position in a call or\nput op s the\nopportunity cost of a cash position and lowers the present value of the forward price The present\nvalue of the forward price has decreased, increasing the value to the buyer. If S is the spot price of\nt\nthe underlying asset at time t, [the equation] shows the forward contract MTM value at time t, V(T),\nt\nfrom the long forward position's perspective: 𝑉(𝑇)= 𝑆 −𝐹 (𝑇)(1+𝑟)−(𝑇−𝑡)\n𝑡 𝑡 𝑜\nDerivatives: Explain how the value and price of a forward contract are determined at initiation,\nduring the life of the contract, and at expiration.", "qhtml": null}];
const CFG = {"title": "Derivatives", "subtitle": "Ngân hàng câu hỏi CFA chính thức — Level I", "minutes": 130, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("resumeNote").classList.remove("show");
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    document.querySelectorAll('.opt.correct').forEach(function(o){ addMark(o,'✅'); });
    document.querySelectorAll('.opt.wrong').forEach(function(o){ addMark(o,'❌'); });
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#d86413','#f0a05a','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>
</body>
</html>
