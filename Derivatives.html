<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#d86413; --accent2:#f0a05a;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#d86413; --accent2:#a8500e;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#d86413; --accent2:#f0a05a;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#d86413; --accent2:#a8500e;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(216,100,19,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(240,160,90,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(216,100,19,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(216,100,19,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#d86413,secondary:#f0a05a"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#d86413,secondary:#f0a05a"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#d86413,secondary:#f0a05a"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#d86413,secondary:#f0a05a"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

IFR )3-2= (1.024485)³\n2,3-2\n(1+IFR )= (1.024485)3/(1.020621)2\n2,1\n(1+IFR ) = (1.075269/1.041667)\n2,1\n1+IFR = 1.032258\n2,1\nIFR = 1.032258-13.2258% ≈3.23%.\n2,1\nC. Incorrect because the implied forward rate is calculated as follows:\nDF =0.96=1/(1+z )², and z₂ = 2.0621%\n2 2\nDF = 0.93=1/(1+ z )3; and z = 2.4485%\n3 3 3\nAccordingly,\nIFR = (1.024485)³- (1.020621)2\n2,1\nIFR = (1.075269 - 1.041667)\n2,1\nIFR = 0.033602 = 3.3602% ~~ 3.36%\n2,1\nDerivatives: Explain how forward rates are determined for interest rate forward contracts and\ndescribe the uses of these forward rates.", "qhtml": null}, {"n": 7, "q": "According to put-call parity, the payoff of a European put option is equivalent to a payoff of\na portfolio consisting of.", "opts": ["a long asset, a short call and a long risk-free bond.", "a short asset, a long call and a long risk-free bond.", "a short asset, a short call and a short risk-free bond."], "ans": "B", "expl": "A. Incorrect because according to put-call parity. P =c – S +X/(1+r)T, long put = long call, short asset,\n0 0 0\nlong bond. Therefore, the payoff of a European put option is not equal to a payoff of a portfolio\nconsisting of a long asset, a short call and a long risk-free bond.\nB. Correct because according to put-call parity. P =c – S +X/(1+r)T , long put = long call, short asset,\n0 0 0\nlong bond. Therefore, the payoff of a European put option is equal to a payoff of a portfolio\nconsisting of a short asset, a long call and a long risk-free bond.\nC. Incorrect because according to put-call parity. P =c – S +X/(1+r)T long put = long call, short asset,\n0 0 0\nlong bond. Therefore, the payoff of a European put option is not equal to a payoff of a portfolio\nconsisting of a short asset, a short call and a short risk-free bond.\nDerivatives: explain put-call parity for European options", "qhtml": null}, {"n": 8, "q": "An investor takes a long position in a risk-free bond and in a forward contract on a non-\ndividend-paying stock. The forward contract is priced at £50. The annual risk-free rate is 10%.\nA nine-month put option on the stock with an exercise price of £47 trades at £4. The price of\na nine-month call option on the stock with an exercise price of £47 is closest to:", "opts": ["£6.79.", "£7.22.", "£7.30."], "ans": "A", "expl": "A. Correct because a long put and a short call are equivalent to a long risk-free bond and short\nforward position: p –c =[X-F (T)](1+r)-T as calculated below:\n0 0 0\np –c =[X-F (T)](1+r)-T (4)\n0 0 0\nRearranging for c0\np –c =[X-F (T)](1+r)-T\n0 0 0\np = put = £4\n0\nX = exercise price = £47\nF (T) = forward = £50\n0\nr = risk-free rate = 10%\np –c =[X-F (T)](1+r)-T = c\n0 0 0 0\nThus, c = £4-[£47-£50](1.10)-075 = £6.79\n0\nB. Incorrect as calculated the exponent of * is mistakenly used without a negative sign.\np –c =[X-F (T)](1+r)+T\n0 0 0\np –c =[X-F (T)](1+r)-T =c\n0 0 0 0\np = put = £4\n0\nX = exercise price = £47\nF (T) = forward = £50\n0\nr = risk-free rate = 10%\n£4-[£47-£50] (1.10) = £7.22\n+0.75\nThe correct answer should be:\np –c =[X-F (T)](1+r)-T (4)\n0 0 0\np =[X-F (T)](1+r)-T –c\n0 0 0\nc =£4-[£47-£501](1.10)-0.75 = £6.79\n0\nC. Incorrect as calculated the exponent of * is missed entirely.\np –c =[X-F (T)](1+r)\n0 0 0\np –[X-F (T)](1+r)+T = c\n0 0 0\np = put = £4\n0\nX = exercise price = £47\nF (T) = forward = £50\n0\nr = risk-free rate = 10%\n£4-[£47-£50](1.10) = £7.30\nThe correct answer should be:\np –c =[X-F (T)](1+r)-T (4)\n0 0 0\np –[X-F (T)](1+r)+T = c\n0 0 0\nc =£4-[£47-£50](1.10)-0.75= £6.79\n0\nDerivatives: explain put-call forward parity for European options", "qhtml": null}, {"n": 9, "q": "Which of the following is most accurate?", "opts": ["A forward contract is traded on an organized exchange.", "Forward contracts are more transparent than futures contracts.", "The buyer of a forward contract agrees to buy the underlying asset at a fixed price on a future date."], "ans": "C", "expl": "A. Incorrect because this is a characteristic of a futures contract and not a forward contract. A\nfutures contract is a standardized derivative contract created and traded on a futures exchange in\nwhich two parties agree that one party, the buyer, will purchase an underlying asset from the other\nparty, the seller, at a later date and at a price agreed on by the two parties when the contract is\ninitiated and in which there is a daily settling of gains and losses and a credit guarantee by the\nfutures exchange through its clearinghouse.\nB. Incorrect because it is actually the opposite and futures contracts are more transparent than\nforward contracts. Futures markets are far more transparent than forward markets.\nC. Correct because a forward contracts is an over-the-counter derivative contract in which two\nparties agree that one party, the buyer, will purchase an underlying asset from the other party, the\nseller, at a later date at a fixed price they agree on when the contract is signed.\nopposite and futures contracts are transparent than forward markets contract is signed.\nDerivatives: define forward contracts, futures contracts, swap, options (calls and puts), and credit\nderivatives and compare their basic characteristics", "qhtml": null}, {"n": 10, "q": "A commodities producer selling its inventory forward in anticipation of lower prices in the\nfuture is an example of a:", "opts": ["fair value hedge.", "cash flow hedge.", "net investment hedge."], "ans": "A", "expl": "A. Correct because a fair value hedge designation applies when a derivative is deemed to offset the\nfluctuation in fair value of an asset or liability. A commodities producer might sell its inventory\nforward in anticipation of lower future prices.\nB. Incorrect because derivatives designated as absorbing the variable cash flow of a floating-rate\nasset or liability such as foreign exchange, interest rates, or commodities are referred to as cash flow\nhedges. A swap to a fixed rate for a floating-rate debt liability is another example of a cash flow\nhedge.\nC. Incorrect because net investment hedges occur when either a foreign currency bond or a\nderivative such as an FX swap or forward is used to offset the exchange rate risk of the equity of a\nforeign operation.\nDerivatives: compare the use of derivatives among issuers and investors", "qhtml": null}, {"n": 11, "q": "Which of the following is equal to the greater of zero or the present value of the exercise\nprice minus the spot price?", "opts": ["The lower bound of a put option", "The lower bound of a call option", "The upper bound of a put option"], "ans": "A", "expl": "A. Correct because a put option buyer will exercise only if the spot price, S is below X at maturity.\nT\nThe exercise price, X, therefore represents the upper bound on the put value. The lower bound is\nthe present value of the exercise price minus the spot price or zero, whichever is greater.\nB. Incorrect because this is the description of the lower bound of a put option. A call option buyer\nwill exercise only if the spot price, S exceeds the exercise price (X) at maturity. The lower bound of a\nT\ncall price is therefore the underlying's price minus the present value of its exercise price or zero,\nwhichever is greater.\nC. Incorrect because this is the description of the at maturity. The exercise price, X, therefore\nrepresents the upper bound on the put the spot price, S is below X\nT\nDerivatives: contrast the use of arbitrage and replication concepts in pricing forward commitments\nand contingent claims", "qhtml": null}, {"n": 12, "q": "Which of the following most likely has an embedded derivative in its structure?", "opts": ["A put option", "A callable bond", "A futures contract"], "ans": "B", "expl": "A. Incorrect because a stand-alone derivative, is a distinct derivative contract, such as a derivative on\na stock or bond. A put option is therefore a stand-alone derivative not an embedded derivative.\nB. Correct because an embedded derivative is a derivative within an underlying, such as a callable,\nputtable, or convertible bond.\nC. Incorrect because a stand-alone derivative, is a distinct derivative contract, such as a derivative on\na stock or bond. A futures contract is also a distinct derivative contract as it is not embedded in the\nunderlying asset.\nDerivatives: define a derivative and describe basic features of a derivative instrument", "qhtml": null}, {"n": 13, "q": "Which of the following derivatives most likely requires a payment to be made at the\ninitiation of the contract? A(n):", "opts": ["swap", "option", "forward"], "ans": "B", "expl": "A. Incorrect because as with futures and forwards, no money changes hands at the start, thus, the\nvalue of a swap when initiated must be zero.\nB. Correct because an option is a derivative contract in which one party, the buyer, pays a sum of\nmoney to the other party, the seller or writer, and receives the right to either buy or sell an\nunderlying asset at a fixed price either on a specific expiration date or at any time prior to the\nexpiration date\nC. Incorrect because as with futures and forwards, no money changes hands at the start, thus, the\nvalue of a swap when initiated must be zero.\nDerivatives: define forward contracts, futures contracts, swaps, options (calls and puts), and credit\nderivatives and compare their basic characteristics", "qhtml": null}, {"n": 14, "q": "Basis risk is best described as a(n):", "opts": ["investor's inability to meet a margin call due to a lack of funds.", "potential divergence between the expected value of a derivative and its underlying.", "divergence in the cash flow timing of a derivative versus that of an underlying transaction."], "ans": "B", "expl": "A. Incorrect because a related risk that can arise for both hedgers and risk takers is liquidity risk, or a\ndivergence in the cash flow timing of a derivative versus that of an underlying transaction. The daily\nsettlement of gains and losses in the futures market can give rise to liquidity risk. If an investor or\nissuer using a futures contract to hedge an underlying transaction is unable to meet a margin call\ndue to a lack of funds, the counterparty's position is closed out and the investor or issuer must cover\nany losses on the derivative trade\nB. Correct because basis risk is the potential divergence between the expected value of a derivative\ninstrument versus an underlying or hedged transaction.\nC. Incorrect because a related risk that can arise for both hedgers and risk takers is liquidity risk, or a\ndivergence in the cash flow timing of a derivative versus that of an underlying transaction.\nDerivatives: describe benefits and risks of derivative instruments", "qhtml": null}, {"n": 15, "q": "Which of the following derivative contracts is best described as a contingent claim?", "opts": ["A swap contract", "A forward contract", "An option contract"], "ans": "C", "expl": "A. Incorrect because derivative contracts can be classified as either firm commitments or contingent\nclaims.\nFirm commitments include forward contracts, futures contracts, and swaps involving a periodic\nexchange of cash flows and an option is the primary contingent claim.\nB. Incorrect because derivative contracts can be classified as either firm commitments or contingent\nclaims.\nFirm commitments include forward contracts, futures contracts, and swaps involving a periodic\nexchange of cash flows\" and an option is the primary contingent claim.\nC. Correct because another type of derivative is a contingent claim, in which one of the\ncounterparties determines whether and when the trade will settle. An option is the primary\ncontingent claim.\nDerivatives: define a derivative and describe basic features of a derivative instrument", "qhtml": null}, {"n": 16, "q": "An investor buys a call option for $4 that has an exercise price of $27. At expiration, if the\nstock price is $22, the call option payoff is:", "opts": ["negative.", "zero.", "positive."], "ans": "B", "expl": "A. Incorrect because it is the call buyer's profit, not the payoff. That is, П = Max(0, S -X)-c . where c\nT 0 0\nis the premium, S is the stock price at expiration, and X is the strike (or exercise) price. In this case,\nT\nП= Max(0,$22 - $27) - $4= -$4, and thus negative.\nB. Correct because c = Max(0,S -X), where c is the value of the call option, or the payoff to the call\nT T T\nbuyer, X is the strike (or exercise) price, and S is the stock price at expiration. In this case, c =\nT T\nMax(0.$22 - $27) = 0.\nC. Incorrect because it is the payoff to the put option buyer. That is, p Max(0,X- S ), where X is the\nT T\nstrike (or exercise) price, and S is the stock price at expiration. In this case, p = Max(0,$27 - $22) =\nT T\n$5.\nDerivatives: determine the value at expiration and profit from a long or a short position in a call or\nput option", "qhtml": null}, {"n": 17, "q": "Which of the following derivatives have a non-linear payoff?", "opts": ["Contingent claims only", "Forward commitments only", "Both contingent claims and forward commitments"], "ans": "A", "expl": "A. Correct because asymmetric payoff profile is a common feature of contingent claims, which are\nsometimes referred to as non-linear derivatives.\nB. Incorrect because since the derivative price is a linear function of the underlying, firm [forward]\ncommitments are also referred to as linear derivatives.\nC. Incorrect because since the derivative price is a linear function of the underlying, firm [forward]\ncommitments are also referred to as linear derivatives.\nDerivatives: contrast forward commitments with contingent claims", "qhtml": null}, {"n": 18, "q": "The potential divergence between the expected value of a derivative instrument versus\nan underlying or hedged transaction best describes:", "opts": ["basis risk.", "liquidity risk.", "systemic risk."], "ans": "A", "expl": "A. Correct because basis risk is the potential divergence between the expected value of a derivative\ninstrument versus an underlying or hedged transaction.\nB. Incorrect because liquidity risk is the potential divergence between the cash flow timing of a\nderivative instrument versus an underlying or hedged transaction.\nC. Incorrect because systemic risk relates to excessive risk taking and use of leverage in derivative\nmarkets.\nDerivatives: Describe benefits and risks of derivative instruments", "qhtml": null}, {"n": 19, "q": "With respect to hedge accounting designation types, a:", "opts": ["foreign exchange forward to hedge forecasted sales is an example of a fair value hedge.", "commodity futures contract used to hedge inventory is an example of a cash flow hedge.", "currency forward to offset the foreign exchange risk of equity of a foreign operation is an example of a net investment hedge."], "ans": "C", "expl": "A. Incorrect because FX forward to hedge forecasted sales absorbs variable cash flow of floating-rate\nasset or liability (forecasted transaction) and is an example of a cash flow hedge.\nB. Incorrect because commodity futures used to hedge inventory offsets fluctuation in fair value of\nan asset or liability and is an example of a fair value hedge.\nC. Correct because currency forward designated as offsetting the FX risk of the equity of a foreign\noperation is an example of a net investment hedge.\nDerivatives: compare the use of derivatives among issuers and investors", "qhtml": null}, {"n": 20, "q": "Which of the following statements about derivatives is most accurate?", "opts": ["Derivatives reduce the efficiency of price discovery for the underlying.", "Transaction cost of derivatives are greater than the transaction cost of the underlying", "Excessive risk taking and use of leverage in derivative markets may contribute to market stress"], "ans": "C", "expl": "A. Incorrect because derivative instrument prices serve a price discovery function beyond the\nunderlying cash or spot market. For example, futures prices are often seen as revealing information\nabout the direction of cash markets in the future, although they cannot be strictly considered an\nunbiased forecast of future spot prices. Therefore, derivatives improve. not reduce, the efficiency of\nprice discovery for the underlying\nB. Incorrect because when prices deviate from fundamental values, derivative markets offer less\ncostly ways to exploit the mispricing. As noted earlier, less capital is required, transaction costs are\nlower, and short selling is easier. Also, derivatives offer the following Operational Advantages:\nReduced cash outlay, lower transaction costs versus the underlying, increased liquidity and ability to\n'short'\nC. Correct because excessive risk taking and use of leverage in derivative markets may contribute to\nmarket stress, as in the 2008 financial crisis.\nDerivatives: describe benefits and risks of derivative instruments", "qhtml": null}, {"n": 21, "q": "Which of the following asset classes is most likely to have a convenience yield?", "opts": ["Commodities", "Interest rates", "Foreign exchange"], "ans": "A", "expl": "A. Correct because convenience yield is a non-cash benefit associated with physical assets. In\ncontrast to securities or cash stored electronically, commodities usually involve known costs\nassociated with the storage insurance, transportation, and potential spoilage (in the case of soft\ncommodities) of these physical assets. A non-cash benefit of holding a physical commodity versus a\nderivative is known as a convenience yield.\nB. Incorrect because a convenience yield is a non-cash benefit associated with physical assets in\ncontrast to securities or cash stored electronically, commodities usually involve known costs\nassociated with the storage insurance, transportation, and potential spoilage (in the case of soft\ncommodities) of these physical assets. A non-cash benefit of holding a physical commodity versus a\nderivative is known as a convenience yield.\nC. Incorrect because a convenience yield is a non-cash benefit associated with physical assets. In\ncontrast to securities or cash stored electronically, commodities usually involve known costs\nassociated with the storage, insurance, transportation, and potential spoilage (in the case of soft\ncommodities) of these physical assets. A non- cash benefit of holding a physical commodity versus a\nderivative is known as a convenience yield.\nDerivatives: explain the difference between the spot and expected future price of an underlying and\nthe cost of carry associated with holding the underlying asset", "qhtml": null}, {"n": 22, "q": "Counterparty default risk is most likely lowest for which of the following types of\nderivatives?", "opts": ["Swaps", "Futures", "Forwards"], "ans": "B", "expl": "A. Incorrect because swap credit terms are privately negotiated between counterparties in an over-\nthe-counter agreement and may range from uncollateralized exposure, where each counterparty\nbears the full default risk of the other. Therefore, swaps do not have the lowest counterparty default\nrisk.\nB. Correct because exchange-traded derivatives (ETD) are standardized contracts traded on an\norganized exchange which requires collateral on deposit to protect against counterparty default and\na futures contract is an exchange-traded derivative (ETD) with standardized terms set by the\nexchange. Therefore, futures has lowest counterparty default risk.\nC. Incorrect because a forward contract is an over-the-counter (OTC) derivative and OTC instruments\nhave less transparency, usually involve more counterparty risk. Therefore, forwards do not have the\nlowest counterparty risk.\nDerivatives: define forward contracts, futures contracts, swaps, options (calls and puts), and credit\nderivatives and compare their basic characteristics", "qhtml": null}, {"n": 23, "q": "When the strike price of a call option is lower, the likelihood of the option expiring in-the-\nmoney is:", "opts": ["lower.", "unchanged.", "higher."], "ans": "C", "expl": "A. Incorrect because for a call option, a lower exercise price has two benefits. One is that there are\nmore values of the underlying at expiration that are above the exercise price, meaning that there are\nmore outcomes in which the call expires in-the-money. Therefore, the likelihood is higher and not\nlower.\nB. Incorrect because for a call option, a lower exercise price has two benefits. One is that there are\nmore values of the underlying at expiration that are above the exercise price, meaning that there are\nmore outcomes in which the call expires in-the-money. Therefore, the likelihood is higher and not\nunchanged.\nC. Correct because for a call option, a lower exercise price has two benefits. One is that there are\nmore values of the underlying at expiration that are above the exercise price, meaning that there are\nmore outcomes in which the call expires in-the-money.\nDerivatives: explain the exercise value, moneyness, and time value of an option", "qhtml": null}, {"n": 24, "q": "Derivatives are typically priced by forming a hedge involving the underlying asset and a\nderivative such that the combination must pay the:", "opts": ["risk-free rate.", "dividend yield.", "convenience yield."], "ans": "A", "expl": "A. Correct because Derivatives are typically priced by forming a hedge involving the underlying asset\nand a derivative such that the combination must pay the risk-free rate and do so for only one\nderivative price.\nB. Incorrect because Derivatives are typically priced by forming a hedge involving the underlying\nasset and a derivative such that the combination must pay the risk-free rate and do so for only one\nderivative price. Therefore, it is the risk-free rate and not the dividend yield a hedge involving the\nunderlying asset and a derivative must pay.\nC. Incorrect because Derivatives are typically priced by forming a hedge involving the underlying\nasset and a derivative such that the combination must pay the risk-free rate and do so for only one\nderivative price. Also, some commodities generate a benefit that is somewhat opaque and difficult\nto measure. This benefit is called the convenience yield. It represents a nonmonetary advantage of\nholding the asset. Therefore, it is the risk- free rate and not the convenience yield a hedge involving\nthe underlying asset and a derivative must pay\nDerivatives: explain how the concepts of arbitrage and replication are used in pricing derivatives", "qhtml": null}, {"n": 25, "q": "The potential divergence between the cash flow timing of a derivative instrument versus\nits underlying best describes:", "opts": ["basis risk.", "liquidity risk.", "systemic risk."], "ans": "B", "expl": "A. Incorrect because basis risk is described as the potential divergence between the expected value\nof a derivative instrument versus an underlying or hedged transaction.\nB. Correct because liquidity risk is described as potential divergence between the cash flow timing of\na derivative instrument versus an underlying or hedged transaction.\nC. Incorrect because systemic risk results from excessive risk taking and use of leverage in derivative\nmarkets that may contribute to market stress.\nDerivatives: describe benefits and risks of derivative instruments", "qhtml": null}, {"n": 26, "q": "Before expiration, if the price of the underlying is above the exercise price, the European\nput option has a positive:", "opts": ["time value.", "intrinsic value.", "exercise value."], "ans": "A", "expl": "A. Correct because if the underlying is equal to or worth more than the exercise price at expiration\n(S,2X), the put will simply expire with no value. So, the put is worth the greater of either zero or the\nexercise price minus the price of the underlying at expiration. Also, the time value of an option is the\ndifference between the market price of the option and its intrinsic value. As the price of the\nunderlying is above the exercise price the put has a zero exercise value and only a positive time\nvalue.\nB. Incorrect because if the underlying is equal to or worth more than the exercise price at expiration\n(S, 2X), me pot will simply expire with no value. So, the put is worth the greater of either zero or the\nexercise price minus the price of the underlying at expiration. Also, the time value of an option is the\ndifference between the market price of the option and its intrinsic value. As the price of the\nunderlying is above the exercise price the put has a zero intrinsic (or exercise) value and only a\npositive time value\nC. Incorrect because if the underlying is equal to or worth more than the exercise price at expiration\n(S,>X), the put will simply expire with no value. So, the put is worth the greater of either zero or the\nexercise price minus the price of the underlying at expiration. Also, the time value of an option is the\ndifference between the market price of the option and its intrinsic value. As the price of the\nunderlying is above the exercise price the put has a zero exercise (or intrinsic) value and only a\npositive time value\nDerivatives: explain the exercise value, moneyness, and time value of an option", "qhtml": null}, {"n": 27, "q": "According to put-call-forward parity, the payoff on a fiduciary call is equivalent to the\npayoff on a portfolio consisting of:", "opts": ["a long call and a short risk-free bond.", "a long put, a long forward contract and a long risk-free bond.", "a short call, a long forward contract and a long risk-free bond."], "ans": "B", "expl": "A. Incorrect because recall our put-call parity discussion and assume that Investor A creates his\nprotective put in a slightly different manner. Instead of buying the asset, he buys a forward contract\nand a risk-free bond in which the face value is the forward price. This strategy is a synthetic\nprotective put. Because we showed that the fiduciary call is equivalent to the protective put, a\nfiduciary call has to be equivalent to a protective put with a forward contract. Therefore, the payoff\non a fiduciary call is not equal to the payoff on a portfolio consisting of a long call and a short risk-\nfree bond.\nB. Correct because recall our put-call parity discussion and assume that investor A creates riis\nprotective put in a slightly different manner. Instead of buying the asset, he buys a forward contract\nand a risk-free bond in which the face value is the forward price. This strategy is a synthetic\nprotective put Because we showed that the fiduciary call is equivalent to the protective put, a\nfiduciary call nas to be equivalent to a protective put with a forward contract Therefore, the payoff\non a fiduciary call = the payoff on a synthetic protective put, fiduciary call = long call + long risk-free\nbond = long risk-free bond + long forward contract + long put\nC. Incorrect because recall our put-call parity discussion and assume that Investor A creates his\nprotective put in a slightly different manner. Instead of buying the asset, he buys a forward contract\nand a risk-free bond in which the face value is the forward price. This strategy is a synthetic\nprotective put. Because we showed that the fiduciary call is equivalent to the protective put, a\nfiduciary call has to be equivalent to a protective put with a forward contract. Therefore, the payoff\non a fiduciary call is not equal to the payoff on a portfolio consisting of a short call, a long forward\ncontract and a long risk-free bond.\nDerivatives: explain put-call forward parity for European options", "qhtml": null}, {"n": 28, "q": "Compared to over-the-counter derivatives, exchange-traded derivatives:", "opts": ["are less standardized.", "provide less transparency.", "have lower transaction costs."], "ans": "C", "expl": "A. Incorrect because OTC and ETD markets differ in several ways, including that ETD contracts are\nmore standardized.\nB. Incorrect because OTC and ETD markets differ in several ways, including that OTC instruments\nhave less transparency, whereas ETD markets have transparency.\nC. Correct because OTC and ETD markets differ in several ways, including that ETD contracts have\nlower trading and transaction costs.\nDerivatives: describe the basic features of derivative markets, and contrast over-the-counter and\nexchange-traded derivative markets", "qhtml": null}, {"n": 29, "q": "A series of forward rate agreements and an interest rate swap contract covering the same\nperiods and using the same market reference rate will most likely have the same:", "opts": ["fixed rates.", "cash flows upfront.", "settlement cash flows."], "ans": "B", "expl": "A. Incorrect because different FRA fixed rates usually exist for different times to maturity. In\ncontrast, a standard interest rate swap has a constant fixed rate over its life, which includes multiple\nperiods.\nB. Correct because similarities between interest rate forwards and swaps include the symmetric\npayoff profile and exchanged upfront.\nC.Incorrect because different FRA fixed rates usually exist for different times to maturity. In contrast,\na standard interest rate swap has a constant fixed rate over its life, which includes multiple periods\nand the FRA has a single settlement, which occurs at the beginning of an interest period, while a\nstandard swap has periodic settlements. which occur at the end of each respective period.\nDerivatives: describe how swap contracts are similar to but different from a series of forward\ncontracts", "qhtml": null}, {"n": 30, "q": "The value of a forward contract at initiation is most likely equal to:", "opts": ["zero.", "the spot price minus the forward price.", "the forward price minus the spot price."], "ans": "A", "expl": "A. Correct because neither the long nor the short pays anything to the other at the initiation date of\na forward contract when initiated is zero.\nB. Incorrect because the value of a forward contract at expiration is the spot price of the underlying\nminus the forward price agreed to in the contract. Because neither the long nor the short pays\nanything to the other at the initiation date of a forward contract, the value of a forward contract\nwhen initiation is zero. Therefore, the value of a forward contract at initiation is not equal to the\nspot price minus the forward price.\nC. Incorrect because the value of a forward contract at expiration is the spot price of the underlying\nminus the forward price agreed to in the contract. because neither the long nor the short pays\nanything to the other at the initiation date of a forward contract, the value of a forward contract\nwhen initiation is zero. Therefore, the value of a forward contract at initiation is not equal to the\nforward price minus the spot price.\nDerivatives: explain how the value and price of a forward contract are determined at initiation,\nduring the life of the contract, and at expiration.", "qhtml": null}, {"n": 31, "q": "Which of the following derivatives realize a gain as the market reference rate rises above\nthe initial fixed rate?", "opts": ["Long forward rate agreements only", "Short interest rate futures contracts only", "Both long forward rate agreements and short interest rate futures contracts"], "ans": "C", "expl": "A. Incorrect because short interest rate futures contracts also gain from a rising market reference\nrate.\nB. Incorrect because long forward rate agreements also gain from a rising market reference rate.\nC. Correct because realizing a gain on the FRA contract as rates rise. Note that this would be\nequivalent to taking a short position on a CNY MRR futures contract if one were available. A long FRA\n(ie., FRA floating-rate receiver (fixed-rate payer)) position realizes a gain as MRR rises. A short\nfutures contract price is based on (100- yield). which gains as yield-to-maturity (MRR) rises.\nDerivatives: compare the value and price of forward and futures contracts", "qhtml": null}, {"n": 32, "q": "In the over-the-counter derivatives market, most transactions occur between end users\nand:", "opts": ["dealers.", "other end users.", "a central counterparty."], "ans": "A", "expl": "A. Correct because OTC (over-the-counter) derivative markets involve contracts entered between\nderivatives end users and dealers, or financial intermediaries, such as commercial banks or\ninvestment banks.\nB. Incorrect because end users do not generally trade with other end users. OTC derivative markets\ninvolve contracts entered between derivatives end users and dealers, or financial intermediaries,\nsuch as commercial banks or investment banks.\nC. Incorrect because the central counterparty provides clearing and settlement functions rather than\ntrading derivatives. A central counterparty (CCP) assumes the credit risk between derivative\ncounterparties, one of which is typically a financial intermediary. CCPS provide clearing and\nsettlement for most derivative contracts\nDerivatives: describe the basic features of derivative markets, and contrast over-the-counter and\nexchange-traded derivative markets", "qhtml": null}, {"n": 33, "q": "Which of the following statements is most accurate? A standard interest rate swap has:", "opts": ["a symmetric payoff profile.", "the principal cash flow exchanged upfront.", "periodic settlements that occur at the beginning of each period."], "ans": "A", "expl": "A. Correct because other similarities between interest rate forwards and swaps include the\nsymmetric payoff profile and the fact that no cash flow is exchanged upfront. The symmetric payoff\nprofile of a swap has zero value to both parties means that the swap at contract inception.\nB. Incorrect because other similarities between interest rate forwards and swaps include the\nsymmetric payoff profile and the fact that no cash flow is exchanged upfront.\nC. Incorrect because an FRA (forward rate agreement) has a single settlement, which occurs at the\nbeginning of an interest period, while a standard swap has periodic settlements, which occur at the\nend of each respective period. So, while a standard swap does have periodic settlements, these\noccur at the end of the period, not the beginning.\nDerivatives: describe how swap contracts are similar to but different from a series of forward\ncontracts", "qhtml": null}, {"n": 34, "q": "Q. The upper bound of a call price is the:", "opts": ["exercise price.", "price of the underlying.", "underlying's price minus the present value of the exercise price."], "ans": "B", "expl": "A. Incorrect because this distractor is the upper bound of a put value and not a call price. The\nexercise price, X, therefore represents the upper bound on the put value.\nB. Correct because call buyer will not pay more for the right to purchase an underlying than the price\nof that underlying, which is the upper bound.\nC. Incorrect because this answer choice represents the lower bound of a call price and not the upper\nbound. The lower bound of a call price is therefore the underlying's price minus the present value of\nits exercise price or zero, whichever is greater.\nDerivatives: contrast the use of arbitrage and replication concepts in pricing forward commitments\nand contingent claims", "qhtml": null}, {"n": 35, "q": "The following portfolios contain a company's stock and a derivative on the stock:\nPortfolio Securities\n1 Stock and a short futures position\n2 Stock and a short call option position\n3 Stock and a short warrant position\nThe portfolio containing a derivative acting as a firm commitment to hedge the stock is most\nlikely.", "opts": ["Portfolio 1.", "Portfolio 2.", "Portfolio 3."], "ans": "A", "expl": "A. Correct because the buyer of a derivative enters a contract whose value changes in a way similar\nto a long position in the underlying. Thus a short futures position hedges the exposure to the\nunderlying: Use of a derivative to offset or neutralize existing or anticipated exposure to an\nunderlying is referred to as hedging, with the derivative itself commonly described as a hedge of the\nunderlying transaction. In addition, a futures position is a firm commitment: Firm commitments\ninclude forward contracts, futures contracts, and swaps involving a periodic exchange of cash flows.\nB. Incorrect because an option is an example of a contingent claim rather than a firm commitment.\nFirm commitments include forward contracts, futures contracts, and swaps involving a periodic\nexchange of cash flows. Another type of derivative is a contingent claim, in which one of the\ncounterparties determines whether and when the trade will settle. An option is the primary\ncontingent claim\nC. Incorrect because a warrant is a type of option and an option is an example of a contingent claim\nrather than a firm commitment. Firm commitments include forward contracts, futures contracts, and\nswaps involving a periodic exchange of cash flows. Another type of derivative is a contingent claim,\nin which one of the counterparties determines whether and when the trade will settle. An option is\nthe primary contingent claim, Companies may also issue warrants, which are options granted to\nemployees or sold to the public that allow holders to purchase shares at a fixed price in the future\ndirectly from the issuer.\nDerivatives: define a derivative and describe basic features of a derivative instrument", "qhtml": null}, {"n": 36, "q": "A futures contract's:", "opts": ["mark-to-market is not settled until maturity.", "price remains fixed until the contract matures.", "variation margin reduces counterparty credit risk."], "ans": "C", "expl": "A. Incorrect because forward (not future) contract MTM is not settled until maturity.\nB. Incorrect because the forward price, F (T), is constant until the contract matures, whereas the\n0\nfutures price, f (T), fluctuates daily based upon market changes.\n0\nC. Correct because the daily settlement mechanism resets the futures MTM to zero, and variation\nmargin is exchanged to settle the difference, reducing counterparty credit risk.\nDerivatives: compare the value and price of forward and futures contracts", "qhtml": null}, {"n": 37, "q": "Q. A stock with a dividend yield of 3% is trading in the spot market at $50. If the annual\nrisk-free rate is 5%, the 6- month forward price of the stock is closest to:", "opts": ["$49.50.", "$50.50.", "$51.27."], "ans": "B", "expl": "A. Incorrect because the risk-free rate and the dividend yield were reversed.\n≠ F (T) = $50e(0.03-0.05)0.5\n0\n= $49.50249 ≈$49.50\nB. Correct because the forward price is: F (T) = S0e(f-i)T where r is the risk-free rate, is the dividend\n0\nyield, and T is the time period.\nF (T) = $50e(0.05 -0.03)0.5\n0\n= $50.50251≈$50.50.\nC. Incorrect because the dividend was excluded from the calculation.\n≠ F (T) = $50e(0.05)0.5\n0\n= $51.26576 ≈ $51.27.\nDerivatives: explain how the concepts of arbitrage and replication are used in pricing derivatives", "qhtml": null}, {"n": 38, "q": "If the net cost of carry is zero, the forward price of a commodity is most likely.", "opts": ["less than the commodity's spot price compounded at the risk-free rate over the life of the contract.", "equal to the commodity's spot price compounded at the risk-free rate over the life of the contract.", "greater than the commodity's spot price compounded at the risk-free rate over the life of the contract."], "ans": "B", "expl": "A. Incorrect because when benefits exceed the costs, then the forward transaction would return less\nthan the spot transaction. The formula adjusts the forward price downward by the expression -(𝛾-\n𝜃)(1+r)T to reflect this net loss over the spot transaction. In other words, acquiring the asset in the\nforward market would be cheaper because it forgoes benefits that exceed the costs. Therefore,\nforward price of a commodity will be less than the commodity's spot price compounded at the risk-\nfree rate over the life of the contract when net cost of carry (𝛾-𝜃),is positive, not when it is zero.\nB. Correct because The forward price of an asset with benefits and/or costs is the spot price\ncompounded at the risk-free rate over the life of the contract minus the future value of those\nbenefits and costs. That is. F (T) = S (1+r)T-(𝛾-𝜃)(1+r)T, where the net cost of carry consists of the\n0 0\nbenefits, denoted as 𝛾, (dividends or interest plus convenience yield), minus the costs, denoted as 𝜃\nWhen net cost of carry is zero, the term (𝛾-𝜃) is zero, resulting in (𝛾-𝜃)(1+r)T being zero. Then, F (T) =\n0\nS (1+r)T .Hence, the forward price of a commodity is equal to the commodity's spot price\n0\ncompounded at the risk-free rate over the life of the contract when the net cost of carry is zero\nC. Incorrect because if the costs exceeded the benefits, the forward price would be higher because\nthe forward contract avoids the costs at the expense of the lesser benefits. Then, the term (𝛾-\n𝜃)(1+r)T will be negative. adding to S (1+r)T in absolute terms (due to preceding negative sign),\n0\nresulting in a forward price that is higher than the spot price compounded at the risk-free rate.\nTherefore, the forward price of a commodity will be greater than the commodity's spot price\ncompounded at the risk-free rate over the life of the contract when the net cost of carry, (𝛾-𝜃), is\nnegative, not when it is zero.\nDerivatives: explain the difference between the spot and expected future price of an underlying and\nthe cost of carry associated with holding the underlying asset", "qhtml": null}, {"n": 39, "q": "Long futures contracts are more attractive than long forward positions for the same\nunderlying and maturity when\nfutures prices and interest rates are:", "opts": ["negatively correlated.", "uncorrelated.", "positively correlated."], "ans": "C", "expl": "A. Incorrect because the different patterns of cash flows for forwards and futures can lead to a\ndifference in the pricing of forwards versus futures and if futures prices are positively correlated\nwith interest rates, long futures contracts are more attractive than long forward positions for the\nsame underlying and maturity. The reason is because rising prices lead to futures profits that are\nreinvested in periods of rising interest rates, and falling prices lead to losses that occur in periods of\nfalling interest rates the more desirable contract will tend to have the higher price.\nB. Incorrect because the different patterns of cash flows for forwards and futures can lead to a\ndifference in the pricing of forwards versus futures and if futures prices are positively correlated\nwith interest rates, long futures contracts are more attractive than long forward positions for the\nsame underlying and maturity. The reason is because rising prices lead to futures profits that are\nreinvested in periods of rising interest rates, and falling prices lead to losses that occur in periods of\nfalling interest rates the more desirable contract will tend to have the higher price.\nC. Correct because the different patterns of cash flows for forwards and futures can lead to a\ndifference in the pricing of forwards versus futures and if futures prices are positively correlated\nwith interest rates, long futures contracts are more attractive than long forward positions for the\nsame underlying and maturity. The reason is because rising prices lead to futures profits that are\nreinvested in periods of rising interest rates, and falling prices lead to losses that occur in periods of\nfalling interest rates the more desirable contract will tend to have the higher price\nDerivatives: explain why forward and futures prices differ", "qhtml": null}, {"n": 40, "q": "The differential between forward and futures prices is determined by which of the\nfollowing?", "opts": ["Interest rate volatility only", "The correlation between futures prices and interest rates only", "Both interest rate volatility and the correlation between futures prices and interest rates"], "ans": "C", "expl": "A. Incorrect because the differential between forward and futures prices is determined by both the\ncorrelation between futures prices and interest rates, and by interest rate volatility, as described in\nthe response rationale for the correct answer.\nB. Incorrect because the differential between forward and futures prices is determined by both the\ncorrelation between futures prices and interest rates, and by interest rate volatility, as described in\nthe response rationale for the correct answer.\nC. Correct because the different patterns of cash flows for forwards and futures can lead to a\ndifference in the pricing of forwards versus futures. Forward and futures prices are identical under\ncertain conditions, namely: if interest rates are constant, or if futures prices and interest rates are\nuncorrelated. On the other hand, violations of these assumptions can give rise to differences in\npricing between these two contracts. For example, if futures prices are positively correlated with\ninterest rates, long futures contracts are more attractive than long forward positions for the same\nunderlying and maturity. The reason is because rising prices lead to futures profits that are\nreinvested in periods of rising interest rates, and falling prices lead to losses that occur in periods of\nfalling interest rates. The price differential will also vary with the volatility of interest rates.\nTherefore, the differential between forward and futures prices is determined by both interest rate\nvolatility and the correlation between futures prices and interest rates.\nDerivatives: explain why forward and futures prices differ", "qhtml": null}, {"n": 41, "q": "Q. From the fixed-rate receiver's perspective, if the market reference rate increases, the\nvalue of a swap contract:", "opts": ["decreases.", "stays the same.", "increases."], "ans": "A", "expl": "A. Correct because the fixed-rate receiver pays the market reference rate and receives the par swap\npar rate. If the market reference rate increases, they are paying more and the value of the contract\ndecreases to them. Another interpretation of an interest rate swap is that the fixed-rate payer\n(floating-rate receiver) is long a floating-rate note (FRN) priced at the MIRR and short a fixed-rate\nbond with a coupon equal to the fixed swap rate. Similarly the fixed-rate receiver (floating-rate\npavers is tong a fixed-rate bond with a coupon equal to the swap rate and short a floating-rate note\npriced at the MRR Anse the expected forward rates after inception will increase the present value of\nfloating payments, while the fixed swap rate will remain the same\nB. Incorrect because the fixed-rate receiver pays the market reference rate and receives the swap\npar rate. If the market reference rate increases, they are paying more and the value of the contract\ndecreases to them, not stays the same Another interpretation of an interest rate swap is that the\nfixed-rate payer (floating-rate receiver) is long a floating-rate note (FRN) priced at the MARR and\nshort a fixed-rate bond with a coupon equal to the fixed swap rate SimBath, the fixed-rate receiver\n(floating rate payer is long a fixed-rate bond with a ocalpon equal to the swap rate and short a\nmoating-rate note priced at the MRR A rise in the expected forward rates after inception will\nincrease the present value of floating payments, while the fixed-swap rate wall remain the second\nC. Incorrect because the fixed-rate receiver pays the market reference rate and receives the swap\npar rate. If the market reference rate increases, they are paying more and the value of the contract\ndecreases, not increases, to them. Another interpretation of an interest rate swap is that the fixed-\nrate payer (Bloating-rate receiver) is long a floating-rate note (FRN) priced at the MRR and short a\nfixed-rate bond with a coupon equal to the fored swap rate. Similarly, the fixed-rate receiver\n(floating rate payer) is long a fixed-rate bond with a coupon equal to the swap rate and short a\nfloating rate note priced at the MRR. A rise in the expected forward rates after inception will\nincrease the present value of floating payments, while the mixed-swap rate will remain the same.\nDerivatives: contrast the value and price of swaps", "qhtml": null}, {"n": 42, "q": "An analyst gathers the following information:\n● The current spot price of crude oil is $120 per barrel.\n● The risk-free rate is 3% with annual compounding.\n● A futures contract has 182 days until settlement.\n● The storage cost is $5 per barrel, payable at the end of the futures contract.\nBased on 365 days per year, the futures price per barrel of crude oil is closest to:", "opts": ["$126.78.", "$126.86.", "$126.93."], "ans": "A", "expl": "A. Correct because the futures price for a commodity with known storage cost amounts may be\ndetermined [as ...]: f (T) = [S + PV (C)] × (1+r)T.\n0 0 0\nPV (C)=$5x(1+3%)-182/365\n0\nF (T) = [$120 + $5x(1+3%)-182/365]x(1 + 3%)182/365 = $126 781768 ≈ $126.78\n0\nB. Incorrect because it doesn't discount the storage cost from settlement day to today to find its\npresent value since the futures price for a commodity with known storage cost amounts may be\ndetermined as: f (T) = [S + PV (C)] × (1+r)T .\n0 0 0\nIf no discounting is applied to the storage cost, it would be incorrectly assumed to be PV (C) = $5.\n0\nF0(T) = [$120 + $5] × (1+3%) 182/365 = $126.856008≈ $126.86.\nC. Incorrect because it compounds the storage cost from today to settlement instead of discounting\nto find its present value since the futures price for a commodity with known storage cost amounts\nmay be determined as: f (T) = [S + PV (C)] × (1+r)T\n0 0 0\nIf compounding is applied to the storage cost, it would be incorrectly assumed to be PV (C) = $5 x\n0\n(1+3%)182/365\nf (T) = [$120+ $5] x (1+3%)182/365 x (1+3%)182/365 =$126.931351 ≈$126.93\n0\nDerivatives: compare the value and price of forward and futures contracts", "qhtml": null}, {"n": 43, "q": "Most derivatives pricing models are established on the foundation that:", "opts": ["arbitrage opportunities exist.", "only one price for a derivative exists.", "the underlying asset price is inferred to determine the derivative price."], "ans": "B", "expl": "A. Incorrect because the principle of no arbitrage and replication can be used to value and price\nderivatives. In other words, arbitrage opportunities can be exploited using derivatives, but for the\npricing of derivatives the no-arbitrage condition is assumed to hold, ie, no arbitrage opportunities\nexist.\nB. Correct because the law of one price can be used to value a derivative security since there is a\none-to-one relationship between the derivative and its underlying asset at maturity. Therefore,\nthere exists only one price for each derivative.\nC. Incorrect because the law of one price can be used to value a derivative security since there is a\none-to-one relationship between the derivative and its underlying asset at maturity. Further, the\none-period binomial model determines the value of a derivative using the underlying's price at t = 0\nas an input for the calculation. For example, the price of a call option is \"c = h x S -V₁(1+r)-1,\" where\n0 0\nc is the call option value at t = 0 and S is the price of the underlying at t=0. Therefore, the price of\n0 0\nthe underlying asset is not inferred when determining the derivative's price. Instead, the price of the\nunderlying asset is considered a given and used as an input in the calculation.\nDerivatives: explain how to value a derivative using a one-period binomial model", "qhtml": null}, {"n": 44, "q": "Q. Which of the following is most accurate regarding a call option replication strategy?", "opts": ["The strategy requires adjustment over the life of the option contract based on the likelihood of exercise", "If the call option is exercised, the strategy requires purchasing the underlying from the proceeds of the loan", "At inception, the strategy requires buying long a forward contract on the underlying and borrowing at the risk free rate"], "ans": "A", "expl": "A. Correct because the non-linear payoff profile of an option requires that the replicating transaction\nbe adjusted as this likelihood changes, while the replicating trades for a forward commitment\nremain constant. Also, as in the case of the call option, the asymmetric payoff profile requires\nadjustment over time based on the likelihood of exercise.\nB. Incorrect because this is a put option replication strategy if exercised. A call option replication\nstrategy if exercised, requires to sell the underlying and use the proceeds to repay the loan. In order\nto replicate the call option at contract inception (t = 0), we also must borrow at the risk-free rate, r,\nand use the proceeds to purchase the underlying at a price of S, At option expiration (t = T), unlike in\nthe case of the forward commitment, there are two possible replication outcomes:\nExercise (S >X): Sell the underlying for Stand use the proceeds to repay X.\nT\nNo exercise (S <X): No settlement is required.\nT\nIn order to replicate the put option at contract inception (t = 0), we must sell the underlying short at\na price of SO and lend the proceeds at the risk-free rate, r. At option expiration (t=T), unlike in the\ncase of the forward commitment, there are two possible replication outcomes.\nExercise (S <X): Purchase the underlying for ST from the proceeds of the risk-free loan.\nT\nNo exercise (S > X): No settlement is required.\nT\nC. Incorrect because a call option replication strategy does not require the long purchase of a\nforward contract. In order to replicate the call option at contract inception (t = 0), we also must\nborrow at the risk-free rate, r, and use the proceeds to purchase the underlying at a price of S\n0\nDerivatives: contrast the use of arbitrage and replication concepts in pricing forward commitments\nand contingent claims", "qhtml": null}, {"n": 45, "q": "An analyst collects the following information:\n● Current stock price €26\n● Gross return from an up move 1.10\n● Gross return from a down move 0.75\n● Call and put exercise price €22\nBased on a one-period binomial pricing model, which of the following has the largest payoff?", "opts": ["Put option following an up move", "Put option following a down move", "Call option following a down move"], "ans": "B", "expl": "A. Incorrect because the payoff of a put option following an up move is p u= Max (0,X-S u) where X is\n1 1\nthe exercise price and S u is the price after an up move. In this case, S u = €26(1.10)= €28.60. So, p u =\n1 1 1\nMax(0, €22 -€28.60)= €0, which is less than the payoff of a put option following a down move, as\ndescribed in the response rationale for the correct answer.\nB. Correct because the payoff of a put option following a down move is p d= Max (0, X-S d) where X is\n1 1\nthe exercise price and S d is the price after a down move. In this case, S d = €26(0.75)= €19.50. So,\n1 1\np₁d= Max (0, €22 - €19.50) = €2.50, which is greater than the payoffs of other two responses\nC. Incorrect because the payoff of a call option following an a down move is c₁d = Max (0, S d -X)\n1\nwhere X is the exercise price and S d is the price after a down move. In this case, S d = €26(0.75)=\n1 1\n€19.50. So, c d = Max (0,€19.50 - €22) = €0, which is less than the payoff of a put option following a\n1\ndown move, as described in the response rationale for the correct answer.\nDerivatives: explain how to value a derivative using a one-period binomial model", "qhtml": null}, {"n": 46, "q": "A $10 million interest rate swap with annual payments has a fixed swap rate of 1.95%.\nThe implied forward rates are:\nYear implied Forward Rate (%)\n1 0.50\n2 1.15\n3 1.35\nThe periodic settlement value in Year 3 for the fixed-rate payer is expected to be closest to:", "opts": ["-$95,000.", "-$60,000.", "$60,000."], "ans": "B", "expl": "A. Incorrect because an average of the first
