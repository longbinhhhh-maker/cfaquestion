a\ncơ bản khi hết hạn. Trong trường hợp này, -Max(0,45-41)=-$4. Lợi nhuận của người bán quyền chọn bán=П=-p +p , (trong đó p,\nT 0\nlà giá của quyền chọn bán tại thời điểm 0), hoặc - 4+2=-$2.\nB. Đúng vì giá trị quyền chọn bán khi hết hạn = p = Max(0,X-S ), trong đó p là giá trị quyền chọn bán tại\nT T T\nexpiration, X là giá thực hiện và ST là giá của tài sản cơ sở khi hết hạn. Trong trường hợp này,\nTối đa(0,45-41) = $4. Lợi nhuận của người mua quyền chọn bán = П = -p -p₁ (trong đó p, là giá của quyền chọn bán tại thời điểm 0), hoặc 4\nT\n- 2 = $2.\nC. Không chính xác vì đây là giá trị của quyền chọn bán khi hết hạn. Giá trị quyền chọn bán khi hết hạn = -p = Max(S -\nT T\n0,X), trong đó p là giá trị quyền chọn khi hết hạn, X là giá thực hiện và S là giá của\nT T\ncơ bản khi hết hạn. Trong trường hợp này, Max(0,45-41)= $4.\nCông cụ phái sinh: xác định giá trị khi hết hạn và thu lợi nhuận từ một vị thế mua hoặc bán trong một quyền chọn mua hoặc\nquyền chọn bán","qhtml":null},{"n":49,"q":"Q. Based on put-call parity, which of the following is equivalent to a long position in the\nunderlying asset?","opts":["Long call, long put, and short bond","Long put, short call, and long bond","Long call, short put, and long bond"],"ans":"C","expl":"A. Không chính xác vì như được mô tả trong phần cơ bản cho câu trả lời đúng, khoản hoàn trả trên tài sản mua\ncó thể được bắt chước bằng cách sử dụng quyền chọn mua dài hạn, quyền chọn bán ngắn hạn và trái phiếu dài hạn.\nB. Không chính xác vì như được mô tả trong phần lý do cho câu trả lời đúng, khoản hoàn trả trên tài sản mua\ncó thể được bắt chước bằng cách sử dụng quyền chọn mua dài hạn, quyền chọn bán ngắn hạn và trái phiếu dài hạn.\nC. Đúng vì mối quan hệ ngang giá giữa quyền chọn bán ngụ ý S = c -p +X/(1+r)T ngụ ý rằng một vị thế mua\n0 0 0\nasset = quyền chọn mua, quyền chọn bán ngắn, trái phiếu dài hạn.\nCác công cụ phái sinh: giải thích tính chẵn lẻ của quyền chọn bán cho các quyền chọn Châu Âu","qhtml":null},{"n":50,"q":"An analyst gathers the following information about an underlying:\n● Current price of underlying asset $16.0\n● End of period upward price $22.0\n● End of period downward price $12.0\n● Risk-free rate 4.0%\nQ. Using a one-period binomial model, the risk-neutral probability of a price increase is\nclosest to:","opts":["0.38.","0.46.","0.54."],"ans":"B","expl":"A. Không chính xác vì đây là lợi nhuận kỳ vọng khi giá tăng lên, tức là S u/S0-1= $22/$16-\n1=1.375-1 = 0,375 0,38. Thay vào đó, xác suất trung hòa rủi ro bằng 0,46, như được mô tả trong\ncơ sở phản hồi cho câu trả lời đúng.\nB. Đúng vì xác suất trung tính rủi ro (𝜋) là xác suất được tính toán được sử dụng trong định giá quyền chọn nhị thức\ntrong đó tổng trọng số đã chiết khấu của các giá trị kỳ vọng của tài sản cơ sở, S u =R S ,\n1 u 0\nvà S d= R S , bằng giá quyền chọn hiện tại. Cụ thể, xác suất này được tính toán bằng cách sử dụng tỷ lệ không có rủi ro-\n1 d 0\nvà giả định lợi nhuận gộp và lợi nhuận gộp giảm dần của tài sản cơ sở như trong Công thức 7.\nπ=1+r-R /Ru-R\nd d\nCụ thể hơn, π , là xác suất trung hòa rủi ro của việc tăng lãi suất giá cơ bản đối với S u =R S ,\n1 u 0\nvà (1 - π) là giá giảm, S d= R S\n1 d 0\nDo đó, Mức tăng từ $16 lên $22 hoặc giảm từ $16 xuống $12 tương ứng với:\nRu=$22/$16=1,375 và Rd = $12/$16=0,75.\nSử dụng xác suất trung tính rủi ro (m) của việc tăng giá:\nπ=1+r-Rd/Ru-Rd= (1+0,04 -0,75)/(1,375-0,75)=0,29/0,625 = 0,464≈0,45.\nC. Không chính xác vì đây là xác suất giảm giá trung tính rủi ro (1 - π) = 1 -0,46 = 0,54.\nThay vào đó, xác suất trung hòa rủi ro bằng 0,46, như được mô tả trong phần cơ sở phản hồi cho\ncâu trả lời đúng.\nCông cụ phái sinh: giải thích cách định giá một đạo hàm bằng mô hình nhị thức một kỳ","qhtml":null},{"n":51,"q":"An investor expects an underlying to go up or down by 25% over the next year. If the risk-\nfree rate is 5%, the risk- neutral probability of a decrease in the underlying price is closest to:","opts":["0.25.","0.40.","0.60."],"ans":"B","expl":"A. Không chính xác vì 0,25 chỉ đơn giản là mức giảm phần trăm dự kiến (di chuyển xuống) của giá cơ bản\nsau một năm. Thay vào đó, xác suất trung tính rủi ro (𝜋) là xác suất được tính toán sử dụng trong nhị thức\nđịnh giá quyền chọn với 𝜋 = (1+r-Rd)/(Ru-Rd), trong đó π là xác suất trung tính rủi ro của việc tăng\ngiá cơ bản, r là lãi suất phi rủi ro và Rd và Ru thể hiện sự biến động của tài sản cơ bản, tức là\nnhững biến động lên xuống dự kiến của tài sản cơ sở sau kỳ. Ở đây, r = 0,05, Ru là (1 +0,25)= 1,25\nvà Rd là (1-0,25)=0,75. Thay thế bằng năng suất (1+0,05- 0,75)/(1,25-0,75) = 0,60. Vì tính trung lập về rủi ro\nxác suất giảm giá cơ bản là 1 - π chúng ta nhận được 1-0,60 = 0,40.\nB. Đúng vì xác suất trung tính rủi ro (m) là xác suất tính toán được sử dụng trong nhị thức\nđịnh giá quyền chọn với π =(1+r-Rd)/(Ru-Rd ), trong đó π là xác suất trung hòa rủi ro của việc tăng\ngiá cơ bản, r là lãi suất phi rủi ro và R và R\" thể hiện sự biến động của tài sản cơ bản. tức là,\nnhững biến động lên xuống dự kiến của cơ sở sau kỳ. Ở đây, r = 0,05, Ru là (1+0,25)=1,25\nvà Rd là (1-0,25)=0,75 Thay thế bằng hiệu suất (1+0,05 -0,75)/(1,25-0,75)=0,60. Vì tính trung lập về rủi ro\nxác suất giảm giá cơ bản là 1-π, chúng ta nhận được 1-0,60 = 0,40.\nC. Không chính xác vì 0,60 là xác suất trung tính rủi ro của việc tăng giá cơ bản, không phải\ngiảm đi. Xác suất trung tính rủi ro (π) là xác suất tính toán được sử dụng trong quyền chọn nhị thức\nđịnh giá với π =(1+r-Rd)/(Ru-Rd ), trong đó π là xác suất trung tính rủi ro của việc tăng\ngiá cơ bản, r là lãi suất phi rủi ro và R° và R° thể hiện sự biến động của tài sản cơ bản. tức là,\nnhững biến động lên xuống dự kiến của cơ sở sau kỳ. Ở đây, r = 0,05, Ru là (1 +0,25)=1,25\nvà Rd là (1 -0,25)=0,75. Thay thế bằng năng suất (1+0,05 -0,75)/(1,25- 0,75)=0,60. Vì tính trung lập về rủi ro\nxác suất giảm giá cơ bản là 1-π, chúng ta nhận được 1 -0,60 = 0,40.\nCông cụ phái sinh: mô tả khái niệm trung lập rủi ro trong định giá phái sinh","qhtml":null},{"n":52,"q":"Which of the following factors affects the option price when using a binomial model? The:","opts":["risk-free rate.","level of investors' risk aversion.","expected return of the underlying."],"ans":"A","expl":"A. Đúng vì giá trị của quyền chọn mua hôm nay, c , là được tính là giá trị kỳ vọng của\n0\ntùy chọn khi hết hạn, c u và c d được chiết khấu ở mức lãi suất phi rủi ro, r. Ngoài ra, giá trị phái sinh không chênh lệch giá\n1 1\nđược thiết lập riêng biệt với quan điểm của nhà đầu tư về rủi ro được gọi là định giá trung tính rủi ro.\nB. Không chính xác vì giá trị của quyền chọn mua ngày hôm nay, c0, được tính là giá trị kỳ vọng của quyền chọn\nkhi hết hạn, cu và c d được chiết khấu ở mức lãi suất phi rủi ro, r. Ngoài ra, giá trị phái sinh không chênh lệch giá\n1 1\nđược thiết lập riêng biệt với quan điểm của nhà đầu tư về rủi ro được gọi là định giá trung tính rủi ro.\nC. Không chính xác vì giá trị của quyền chọn mua ngày hôm nay, c , được tính là giá trị kỳ vọng của\n0\ntùy chọn khi hết hạn, c u và c d ,được chiết khấu ở mức lãi suất không có rủi ro, r. Ngoài ra, chỉ có biến động dự kiến\n1 1\ntức là, tổng lợi nhuận Ru và Rd - chứ không phải lợi nhuận kỳ vọng mới được yêu cầu để định giá một\ntùy chọn.\nCông cụ phái sinh: mô tả khái niệm trung lập rủi ro trong định giá phái sinh","qhtml":null},{"n":53,"q":"An end user seeking to hedge a specific underlying exposure having non-standard size and\nsettlement dates would most likely trade on a(n):","opts":["futures market.","over-the-counter derivative market.","exchange-traded derivative market."],"ans":"B","expl":"A. Không chính xác vì hợp đồng tương lai là hợp đồng kỳ hạn có quy mô, ngày tháng và cơ sở\nđược tiêu chuẩn hóa, giao dịch trên các sàn giao dịch tương lai. Do đó, chúng không phù hợp với kích thước\nkhông chuẩn và ngày thanh toán mà người dùng cuối yêu cầu.\nB. Đúng vì các điều khoản của hợp đồng OTC (không kê đơn) có thể được tùy chỉnh để phù hợp với\nhồ sơ rủi ro mong muốn. Tính linh hoạt này rất quan trọng đối với người dùng cuối đang tìm cách phòng ngừa rủi ro cụ thể\nhiện tại hoặc dự đoán dựa trên các điều khoản không chuẩn.\nC. Không chính xác vì các hợp đồng ETD (phái sinh giao dịch trao đổi) chính thức và được tiêu chuẩn hóa hơn,\ntạo điều kiện cho thị trường thanh khoản và minh bạch hơn. Các điều khoản và điều kiện-chẳng hạn như quy mô của\nmỗi hợp đồng, loại, chất lượng và vị trí cơ sở cho hàng hóa cũng như ngày đáo hạn được ấn định bởi\nsàn giao dịch.\nCác công cụ phái sinh: mô tả các đặc điểm cơ bản của thị trường phái sinh và so sánh thị trường phái sinh phi tập trung và\ntrao đổi trên sàn","qhtml":null},{"n":54,"q":"All else being equal, if the up gross return increases in a one-period binomial model, the\nrisk-neutral probability of an upward price movement of the asset will:","opts":["decrease.","remain the same.","increase."],"ans":"A","expl":"A. Đúng vì xác suất trung tính rủi ro (𝜋) là xác suất được tính toán được sử dụng trong định giá quyền chọn nhị thức\ntheo đó tổng trọng số đã chiết khấu của các giá trị kỳ vọng của cơ sở, S u= R S ,\n1 0 0\nvà S d= RdS ,. bằng giá quyền chọn hiện tại. Cụ thể, xác suất này được tính toán bằng cách sử dụng lãi suất không có rủi ro-\n1 0\nvà giả định lợi nhuận gộp và lợi nhuận gộp giảm dần của tài sản cơ sở như trong π= (1+r-R )/(R -\nd u\nR ). Vì vậy, nếu tổng lợi nhuận tăng lên trong mô hình nhị thức một kỳ thì mẫu số sẽ\nd\ntăng. Do đó, xác suất trung tính rủi ro của biến động giá tăng của tài sản, (π),\ngiảm.\nB. Không chính xác vì xác suất trung tính rủi ro (π) là xác suất được tính toán được sử dụng trong định giá quyền chọn nhị thức\ntrong đó tổng trọng số đã chiết khấu của các giá trị kỳ vọng của tài sản cơ sở, S u= RuS\n1 0\nvà S d= RdS, bằng giá quyền chọn hiện tại. Cụ thể, xác suất này được tính toán bằng cách sử dụng lãi suất không có rủi ro-\n1 0\nvà giả định lợi nhuận gộp và lợi nhuận gộp giảm dần của tài sản cơ sở như trong π= (1+r-R )/(R -\nd u\nR ). Vì vậy, nếu tổng lợi nhuận tăng lên trong mô hình nhị thức một kỳ thì mẫu số sẽ\nd\ntăng. Do đó, xác suất trung hòa rủi ro của biến động giá tăng của tài sản, (π),\ngiảm.\nC. Không chính xác vì xác suất trung tính rủi ro (π) là xác suất được tính toán được sử dụng trong định giá quyền chọn nhị thức\ntrong đó tổng trọng số đã chiết khấu của các giá trị kỳ vọng của tài sản cơ sở, S u= RuS\n1 0\nvà S d= RdS, bằng giá quyền chọn hiện tại. Cụ thể, xác suất này được tính toán bằng cách sử dụng lãi suất không có rủi ro-\n1 0\nvà giả định lợi nhuận gộp và lợi nhuận gộp giảm dần của tài sản cơ sở như trong π= (1+r-R )/(R -\nd u\nR ). Vì vậy, nếu tổng lợi nhuận tăng lên trong mô hình nhị thức một kỳ thì mẫu số sẽ\nd\ntăng. Do đó, xác suất trung hòa rủi ro của biến động tăng giá của tài sản, (π),\ngiảm.\nCông cụ phái sinh: mô tả khái niệm trung lập rủi ro trong định giá phái sinh","qhtml":null},{"n":55,"q":"A forward agreement has the following terms:\n● Spot price at inception $275\n● Forward price $285\n● Number of shares 2,000\nAt expiration, if the spot price is $282, the value to the seller is:","opts":["-$6,000.","$6,000.","$14,000."],"ans":"B","expl":"A. Không chính xác vì đây là giá trị khi hết hạn đối với người mua.\n=S -F (T) = $282 - $285=-$3.\nT 0\nDo đó tổng giá trị là -$3 x 2.000 cổ phiếu = -$6.000.\nB. Đúng vì giá trị khi hết hạn của người bán:\n= F (T)-S =$285 - $282 = $3.\n0 T\nDo đó tổng giá trị là $3 x 2.000 cổ phiếu = $6.000.\nC. Không chính xác vì giá giao ngay lúc bắt đầu được sử dụng thay vì lúc thanh toán:\n≠ F (T)-S = $282 - $275 = $7.\n0 0\nDo đó tổng giá trị là $7 x 2.000 cổ phiếu = $14.000.\nCông cụ phái sinh: Giải thích giá trị và giá của một cổ phiếu như thế nào hợp đồng kỳ hạn được xác định khi bắt đầu,\ntrong thời hạn của hợp đồng và khi hết hạn","qhtml":null},{"n":56,"q":"A trader sells a call option on a stock index with a strike price of 2,400 for $25. The value\nof a one-point move in the index is $1. At expiration, the stock index is trading at 2,450. The\ntrader's profit is:","opts":["-$50.","-$25.","$25."],"ans":"B","expl":"A. Không chính xác vì giá trị này thể hiện giá trị chứ không phải lợi nhuận đối với người bán cuộc gọi, tức là -\nMax(0,$2,450-$2,400)=- $50, như được mô tả trong cơ sở phản hồi cho câu trả lời đúng.\nB. Đúng vì người viết cuộc gọi là người bán cuộc gọi: Quyền chọn là một hợp đồng phái sinh trong\ncủa một bên nào. người mua trả một khoản tiền cho bên kia, người bán hoặc người viết và\nnhận được quyền mua hoặc bán một tài sản cơ bản ở mức giá cố định vào một\nngày hết hạn cụ thể hoặc bất kỳ lúc nào trước ngày hết hạn. Lợi nhuận mà người bán quyền chọn mua là -\nMax(0,S -X) + C . Trong đó X là giá thực hiện, S là giá trị của tài sản cơ sở khi đáo hạn và C là\nT 0 T 0\nphí quyền chọn mua mà người bán nhận được. Vì một điểm tương đương với một đô la nên lợi nhuận đối với người bán cuộc gọi\nlà: -Max(0,$2,450-$2,400) + $25-$50 + $25 = -$25.\nC. Không chính xác vì 25 USD thể hiện lợi nhuận của người mua chứ không phải của người bán quyền chọn mua.\nlợi nhuận đối với người mua quyền chọn mua được xác định là Max(0,S -X)-co, trong đó X là giá thực hiện, ,S là giá trị của\nT T\ncơ bản khi hết hạn và co là phí quyền chọn mua do người mua thanh toán. Do đó, Max(0,$2,450-\n$2,400)-$25 = $50-$25 = $25.\nCông cụ phái sinh: xác định giá trị khi hết hạn và kiếm lợi nhuận từ một vị thế mua hoặc bán trong lệnh mua hoặc\ntùy chọn bán","qhtml":null},{"n":57,"q":"An investor buys a call for $5.75 that has a strike price of $130. If the value at expiration\nfor this call is $17.80, the price of the underlying at expiration is closest to:","opts":["$112.20.","$142.05","$147.80."],"ans":"C","expl":"A. Không chính xác vì $112,20 là giá trị cơ sở giả định rằng đây là quyền chọn bán\nthay vì quyền chọn mua. \"Tiền hoàn trả cho người mua quyền chọn bán\" khi hết hạn là p = Max(0, X-S ), trong đó X là\nT T\ngiá thực hiện và S , là giá của tài sản cơ sở khi hết hạn. Dựa vào thông tin trong phần gốc\nT\nchúng ta nhận được $17,80= Max(0,$130 - S ) mang lại S = $130-$17,80 $112,20. Ngược lại, giá trị or\nT T\n\"tiền hoàn trả cho người mua cuộc gọi\" khi hết hạn là c = Max(0,S -X). Dựa vào thông tin trong phần thân, chúng ta nhận được\nT T\n$17,80= Max(0, S -$130). (tr. 407-408) Do đó, S = 130+ 17,80= 147,80, không phải $112,20.\nT T\nB. Không chính xác vì 142,05 USD là lợi nhuận từ vị thế quyền chọn được thêm vào giá thực hiện. Nó được\ntính như (c - c ) + X trong đó c là giá trị của quyền chọn khi hết hạn, c là giá mua của\nT 0 T 0\ncủa quyền chọn và X là giá thực hiện. Dựa vào thông tin trong phần thân, chúng tôi nhận được ($17,80 - $5,75)+ $130\n= $142,05. Ngược lại, giá trị hoặc \"tiền hoàn trả cho người mua quyền chọn mua\" khi hết hạn là c = Max(0,S -X) trong đó\nT T\nX là giá thực hiện, S là giá của tài sản cơ sở khi hết hạn. Dựa vào thông tin trong phần thân\nT\nchúng ta nhận được $17,80= Max(0,S -$130). Do đó, S =$ 130 +$17,80 = $147,80, không phải $142,05.\nT T\nC. Đúng vì giá trị hoặc \"tiền hoàn trả cho người mua quyền chọn mua\" khi hết hạn là c, = Max(0,S -X) trong đó X là\nT\ngiá thực hiện, ,S là giá của tài sản cơ sở khi hết hạn. Với thông tin ở phần thân, chúng ta\nT\nnhận được $17,80= Max(0,S - $130). Do đó, S, $ 130 +$17,80 = $147,80.\nT\nCông cụ phái sinh: xác định giá trị khi hết hạn và thu lợi nhuận từ một vị thế mua hoặc bán trong một lệnh mua hoặc\ntùy chọn bán","qhtml":null},{"n":58,"q":"An investor sells a European put option with the following characteristics:\n● Put price 30\n● Exercise price 1,320\nIf the price of the underlying at expiration is 1,340, the profit for the seller is:","opts":["10.","20.","30."],"ans":"C","expl":"A. Không chính xác vì nó biểu thị giá bán p trừ đi chênh lệch giữa giá thực hiện X\n0\nvà giá của S cơ bản khi hết hạn: 30-(1.340-1.320)= 10. Đây sẽ là lợi nhuận cho\nT\nngười bán quyền chọn mua, П =-Max(0,S -X) + C . với cùng giá thực hiện và giá bán như nhau.\nT 0\nNgược lại, đối với người bán quyền chọn bán, lợi nhuận là П=-Max(0,X-S ) + p . Do đó, П=-Max(0,(1,320-\nT 0\n1,340))+30= 30.\nB. Không chính xác vì nó thể hiện khoản hoàn trả cho người mua quyền chọn mua c = Max(0,S -X), trong đó S là giá\nT T T\ncủa tài sản cơ sở khi hết hạn và X là giá thực hiện. Do đó, c = Max(0,(1,340 - 1,320)) = 20.\nNgược lại, đối với người bán quyền chọn bán, lợi nhuận là П=-Max(0,X-S ) + p , trong đó p, là giá quyền chọn bán. Do đó,\nT 0\nП=-Max(0,(1,320 - 1,340))+30= 30.\nC. Đúng vì đối với người bán quyền chọn bán, lợi nhuận là П= -Max(0.X-S ) + p . trong đó X là giá thực hiện,\nT 0\nS là giá của tài sản cơ sở khi hết hạn và p , là giá bán. Do đó, П = -Max(0,(1,320 -\nT 0\n1.340))+30= 30.\nCông cụ phái sinh: xác định giá trị khi hết hạn và kiếm lợi nhuận từ một vị thế mua hoặc bán trong lệnh gọi hoặc\ntùy chọn bán","qhtml":null},{"n":59,"q":"An analyst gathers the following information about three portfolios each consisting of\ntwo derivatives on the same underlying:\nForward PositionOption Position\n● Portfolio 1 Long Long Call\n● Portfolio 2 Long Long Put\n● Portfolio 3 Short Long Call\nAll else being equal, which portfolio will benefit from an increase in price of the underlying?","opts":["Portfolio 1","Portfolio 2","Portfolio 3"],"ans":"A","expl":"A. Đúng vì cả vị trí kỳ hạn mua và vị trí quyền chọn mua sẽ thu được lợi từ việc\ntăng giá cơ bản.\nB. Không chính xác vì một yêu cầu ngẫu nhiên được hưởng lợi từ việc tăng giá cơ bản là quyền chọn bán\nbán [không phải quyền chọn mua đã mua].\nC. Không chính xác vì cả vị thế mua kỳ hạn và vị thế quyền chọn mua [không bán khống] sẽ thu được\ntừ việc tăng giá cơ bản.\nCông cụ phái sinh: đối chiếu các cam kết kỳ hạn với các yêu cầu dự phòng","qhtml":"<p>An analyst gathers the following information about three portfolios each consisting of two derivatives on the same underlying:</p><table class=\"qtable\"><thead><tr><th></th><th>Forward Position</th><th>Option Position</th></tr></thead><tbody><tr><td>Portfolio 1</td><td>Long</td><td>Long Call</td></tr><tr><td>Portfolio 2</td><td>Long</td><td>Long Put</td></tr><tr><td>Portfolio 3</td><td>Short</td><td>Long Call</td></tr></tbody></table><p>All else being equal, which portfolio will benefit from an increase in price of the underlying?</p>"},{"n":60,"q":"All else being equal, the cost of carry on a dividend-paying stock is:","opts":["lower than the cost of carry on a stock with no dividends.","the same as the cost of carry on a stock with no dividends.","higher than the cost of carry on a stock with no dividends."],"ans":"A","expl":"A. Đúng vì lợi ích của cổ tức làm giảm chi phí liên quan đến việc lưu giữ cổ phiếu.\nChi phí lưu trữ là tổng của chi phí và lợi ích liên quan đến việc sở hữu một tài sản cơ bản trong một khoảng thời gian cụ thể. Chi phí thực hiện là chi phí cơ hội cộng với các chi phí sở hữu khác trừ đi lợi ích\ncủa quyền sở hữu và cổ tức bằng cổ phiếu hoặc phiếu giảm giá trái phiếu là ví dụ về lợi ích của dòng tiền.\nB. Không chính xác vì lợi ích từ cổ tức làm giảm chi phí liên quan đến việc lưu giữ cổ phiếu.\nChi phí lưu giữ là tổng của chi phí và lợi ích liên quan đến việc sở hữu một tài sản cơ bản trong một khoảng thời gian cụ thể. Chi phí thực hiện là chi phí cơ hội cộng với các chi phí sở hữu khác trừ đi lợi ích\ncủa quyền sở hữu và cổ tức bằng cổ phiếu hoặc phiếu giảm giá trái phiếu là ví dụ về lợi ích của dòng tiền.\nC. Không chính xác vì lợi ích từ cổ tức làm giảm chi phí liên quan đến việc lưu giữ cổ phiếu.\nChi phí lưu giữ là tổng của chi phí và lợi ích liên quan đến việc sở hữu một tài sản cơ bản trong một khoảng thời gian cụ thể. Chi phí thực hiện là chi phí cơ hội cộng với các chi phí sở hữu khác trừ đi lợi ích\nquyền sở hữu và cổ tức bằng cổ phiếu hoặc phiếu giảm giá trái phiếu là ví dụ về lợi ích của dòng tiền.\nCông cụ phái sinh: giải thích sự khác biệt giữa giá giao ngay và giá tương lai dự kiến của một tài sản cơ sở và\nchi phí nắm giữ liên quan đến việc nắm giữ tài sản cơ bản","qhtml":null},{"n":61,"q":"An investor collects the following information about a put option:\n● Stock price at initiation $220\n● Strike price $210\n● Option premium $9\nAt expiration, if the price of the stock is $200, the investor's profit from buying the put is:","opts":["-$19.","-$9.","$1."],"ans":"C","expl":"A. Không chính xác vì lợi nhuận của người mua quyền chọn bán (𝜋) không bằng S –S0 + Max(0,X-S )- p trong đó S\nT T 0 T\nlà giá giao ngay của tài sản cơ sở, S là giá của tài sản cơ sở khi hết hạn, X là giá thực hiện\nT\nvà p là phí quyền chọn. Do đó, phép tính không chính xác mang lại: -$19 $200-$220+\n0\nMax(0,$210-$200)-$9, bao gồm khoản lỗ $20 của tài sản cơ sở. Thay vào đó, công thức đúng\nlà П= Max(0,X-S )-p , (lợi nhuận cho người mua quyền chọn bán) mang lại: $1 = Max(0,$210 - $200) - $9.\nT 0\nB. Không chính xác vì lợi nhuận của người mua quyền chọn bán không bằng -p , phí quyền chọn đã trả hoặc -$9,\no\nvì quyền chọn bán hết hạn trong số tiền đó. Thay vào đó, công thức đúng là П = Max(0,X-S )-Po (profit\nT\ncho người mua quyền chọn bán), trong đó S là giá của tài sản cơ sở khi đáo hạn, X là giá thực hiện và p , là\nT 0\nphí quyền chọn. Do đó, phép tính đúng mang lại: $1 = Max(0,$210 - $200) - $9.\nC. Đúng vì П = Max(0,X-S )-p (lợi nhuận cho người mua quyền chọn bán), trong đó S là giá của\nT 0 T\ncơ bản khi hết hạn, X là giá thực hiện và p , là phí quyền chọn. Do đó, phép tính\n0\nđúng mang lại: $1 = Max(0,$210-$200)-$9.\nPhái sinh: xác định giá trị khi hết hạn và kiếm lợi nhuận từ một vị thế mua hoặc bán trong lệnh mua hoặc\ntùy chọn bán","qhtml":null},{"n":62,"q":"Which of the following interest rate derivatives most likely has the largest convexity bias?","opts":["Forward rate agreement on a 1-month market reference rate","Forward rate agreement on a 3-month market reference rate","Interest rate futures contract on a 3-month market reference rate"],"ans":"B","expl":"A. Không chính xác vì tính năng chiết khấu của FRA, không có trong hợp đồng tương lai,\ndẫn đến độ lệch lồi lớn hơn trong thời gian chiết khấu dài hơn. Vì độ dài của thời gian chiết khấu\nphụ thuộc vào thời gian đáo hạn của tỷ giá tham chiếu thị trường cơ bản, tỷ giá tham chiếu thị trường 1 tháng\ndẫn đến thời gian chiết khấu ngắn hơn lãi suất 3 tháng. Do đó, nó\nsẽ có độ lệch lồi nhỏ hơn.\nB. Đúng vì tính năng chiết khấu của FRA, không có trong hợp đồng tương lai,\ndẫn đến độ lệch lồi lớn hơn trong thời gian chiết khấu dài hơn. Vì độ dài của thời gian chiết khấu\nphụ thuộc vào thời gian đáo hạn của tỷ giá tham chiếu thị trường cơ bản, tỷ giá tham chiếu thị trường 3 tháng\ndẫn đến thời gian chiết khấu dài hơn lãi suất 1 tháng.\nC. Không chính xác vì độ lệch lồi không tồn tại trong hợp đồng tương lai lãi suất vì giá của chúng\nkhông dựa trên chiết khấu. Hợp đồng tương lai có cấu hình thanh toán tuyến tính cố định cho một sự thay đổi điểm cơ bản nhất định\n. Mặt khác, tính năng chiết khấu của FRA không có trong\nhợp đồng tương lai, dẫn đến độ lệch lồi lớn hơn trong thời gian chiết khấu dài hơn.\nCông cụ phái sinh: giải thích tại sao giá kỳ hạn và giá kỳ hạn lại khác nhau","qhtml":null},{"n":63,"q":"The upper bound of a call value is the:","opts":["underlying's price.","underlying's price plus the present value of its exercise price or zero, whichever is greater.","underlying's price minus the present value of its exercise price or zero, whichever is greater."],"ans":"A","expl":"A. Đúng vì giới hạn không chênh lệch giá trên của giá quyền chọn mua là giá giao ngay của cơ sở.\nB. Không chính xác vì giới hạn dưới [không phải trên] của giá quyền chọn mua là giá cơ sở trừ [không\ncộng] giá trị hiện tại của giá thực hiện hoặc bằng 0, tùy theo giá trị nào lớn hơn. Thay vào đó, giới hạn chênh lệch giá no-\ntrên của giá quyền chọn mua là giá giao ngay của cơ sở.\nC. Không chính xác vì giới hạn dưới [không phải trên] của giá quyền chọn mua là giá cơ sở trừ đi\ngiá trị hiện tại của giá thực hiện hoặc bằng 0, tùy theo giá trị nào lớn hơn. Thay vào đó, giới hạn trên của không có chênh lệch giá\ncủa giá quyền chọn mua là giá giao ngay của cơ sở.\nCác công cụ phái sinh: đối chiếu việc sử dụng chênh lệch giá và các khái niệm nhân rộng trong các cam kết định giá kỳ hạn\nvà các yêu cầu dự phòng","qhtml":null},{"n":64,"q":"Q. Which party in an option contract has the right to sell the underlying stock at the\nexercise price?","opts":["The buyer of a call option","The buyer of a put option","The seller of a put option"],"ans":"B","expl":"A. Không chính xác vì tùy chọn là hợp đồng phái sinh trong đó một bên, người mua, trả một khoản tiền\ncho bên kia, người bán hoặc người viết và nhận quyền mua hoặc bán\ntài sản cơ bản ở mức giá cố định vào ngày hết hạn cụ thể hoặc bất kỳ lúc nào trước ngày hết hạn\n. Quyền mua là một loại quyền chọn, được gọi là quyền chọn mua hoặc quyền chọn mua. Người mua\nquyền chọn mua có quyền mua cổ phiếu cơ bản.\nB. Đúng vì quyền chọn là hợp đồng phái sinh trong đó một bên, người mua, trả một khoản tiền\ncho bên kia, người bán hoặc người viết và nhận quyền mua hoặc bán\ntài sản cơ bản ở một mức giá cố định vào ngày hết hạn cụ thể hoặc bất kỳ lúc nào trước ngày hết hạn\n. Quyền bán là một loại quyền chọn (khác), được gọi là quyền chọn bán hoặc quyền chọn bán.\nC. Không chính xác vì tùy chọn là hợp đồng phái sinh trong đó một bên, người mua, trả một khoản tiền\ncho bên kia, người bán hoặc người viết và nhận quyền mua hoặc bán\ntài sản cơ bản ở mức giá cố định vào ngày hết hạn cụ thể hoặc bất kỳ lúc nào trước ngày hết hạn\n. Quyền bán là một loại quyền chọn (khác), được gọi là quyền chọn bán hoặc quyền chọn bán. Người\nngười bán quyền chọn bán có nghĩa vụ mua tài sản cơ sở nếu người mua thực hiện quyền chọn đó.\nCác công cụ phái sinh: xác định hợp đồng kỳ hạn, hợp đồng tương lai, giao dịch hoán đổi, quyền chọn (gọi và bán) và tín dụng\ncác công cụ phái sinh và so sánh các đặc điểm cơ bản của chúng","qhtml":null},{"n":65,"q":"All else being equal, if the risk-free rate increases immediately after the inception of a\nforward contract, the value of the contract to the forward buyer will:","opts":["decrease.","stay the same.","increase."],"ans":"C","expl":"A. Không chính xác vì vì, từ ví dụ về Hợp đồng Bloman, lãi suất phi rủi ro cao hơn sẽ làm tăng\nchi phí cơ hội của một vị thế tiền mặt và làm giảm giá trị hiện tại của giá kỳ hạn.\ngiá trị hiện tại của giá kỳ hạn đã giảm, làm tăng giá trị cho người mua. Nếu S, là giá giao ngay\ncủa tài sản cơ sở tại thời điểm t, [giá trị MTM của hợp đồng kỳ hạn tại thời điểm t, V(T), từ\nt\nquan điểm của vị thế mua kỳ hạn: 𝑉(𝑇)= 𝑆 −𝐹 (𝑇)(1+𝑟)−(𝑇−𝑡)\n𝑡 𝑡 𝑜\nB. Không chính xác vì vì, từ ví dụ về Hợp đồng Bioman, lãi suất phi rủi ro cao hơn sẽ làm tăng\nchi phí cơ hội của một vị thế tiền mặt và làm giảm giá trị hiện tại của giá kỳ hạn.\ngiá trị hiện tại của giá kỳ hạn đã giảm, làm tăng giá trị cho người mua. Nếu S là giá giao ngay\nt\ncủa tài sản cơ sở tại thời điểm t, thì [phương trình] hiển thị giá trị MTM của hợp đồng kỳ hạn tại thời điểm\nt, V(T), từ góc nhìn của vị thế mua kỳ hạn: 𝑉(𝑇)= 𝑆 −𝐹 (𝑇)(1+𝑟)−(𝑇−𝑡)\nt 𝑡 𝑡 𝑜\nC. Đúng vì vì, từ ví dụ về Hợp đồng Bioman, lãi suất phi rủi ro cao hơn làm tăng\nchi phí cơ hội của một vị thế tiền mặt và làm giảm giá trị hiện tại của giá kỳ hạn. Giá trị hiện tại\ncủa giá kỳ hạn đã giảm, làm tăng giá trị cho người mua. Nếu S là giá giao ngay của\nt\ntài sản cơ bản tại thời điểm t, [phương trình] hiển thị giá trị MTM của hợp đồng kỳ hạn tại thời điểm t, V(T),\nt\ntừ quan điểm của vị thế mua kỳ hạn: 𝑉(𝑇)= 𝑆 −𝐹 (𝑇)(1+𝑟)−(𝑇−𝑡)\n𝑡 𝑡 𝑜\nCông cụ phái sinh: Giải thích cách xác định giá trị và giá của hợp đồng kỳ hạn khi bắt đầu,\ntrong thời hạn của hợp đồng và khi hết hạn.","qhtml":null}];
const CFG = {"title": "Derivatives", "subtitle": "Ngân hàng câu hỏi CFA chính thức — Level I", "minutes": 130, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  return sections;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("resumeNote").classList.remove("show");
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script id="qnotes-panel-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("qnotesPanel");}
  window.qnotesOpen=function(){
    var fr=document.getElementById("qnotesFrame");
    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.qnotesClose=function(){
    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
