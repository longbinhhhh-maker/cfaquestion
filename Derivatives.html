<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>

<script>

+IFR ) = (1.075269/1.041667)\n2,1\n1+IFR = 1,032258\n2,1\nIFR = 1,032258-13,2258% ≈3,23%.\n2,1\nC. Không chính xác vì tỷ giá kỳ hạn ngụ ý được tính như sau:\nDF =0,96=1/(1+z )² và z₂ = 2,0621%\n2 2\nDF = 0,93=1/(1+ z )3; và z = 2,4485%\n3 3 3\nTheo đó,\nIFR = (1.024485)³- (1.020621)2\n2,1\nIFR = (1.075269 - 1.041667)\n2,1\nIFR = 0,033602 = 3,3602% ~~ 3,36%\n2,1\nCác công cụ phái sinh: Giải thích cách xác định tỷ giá kỳ hạn cho các hợp đồng kỳ hạn lãi suất và\nmô tả cách sử dụng các hợp đồng kỳ hạn này giá.","qhtml":null},{"n":7,"q":"According to put-call parity, the payoff of a European put option is equivalent to a payoff of\na portfolio consisting of.","opts":["a long asset, a short call and a long risk-free bond.","a short asset, a long call and a long risk-free bond.","a short asset, a short call and a short risk-free bond."],"ans":"B","expl":"A. Không chính xác vì theo tính chẵn lẻ của cuộc gọi. P =c – S +X/(1+r)T, quyền chọn mua = quyền chọn mua, tài sản ngắn,\n0 0 0\ntrái phiếu dài hạn. Do đó, lợi tức của một quyền chọn bán kiểu Châu Âu không bằng lợi tức của một danh mục đầu tư\nbao gồm một tài sản dài hạn, một quyền chọn mua ngắn hạn và một trái phiếu dài hạn không có rủi ro.\nB. Đúng vì theo tính chẵn lẻ của cuộc gọi. P =c – S +X/(1+r)T , quyền chọn mua = quyền chọn mua, tài sản bán,\n0 0 0\ntrái phiếu dài hạn. Do đó, lợi tức của một quyền chọn bán kiểu Châu Âu tương đương với lợi tức của một danh mục đầu tư\nbao gồm một tài sản ngắn, quyền chọn mua dài hạn và trái phiếu dài hạn không có rủi ro.\nC. Không chính xác vì theo tính chẵn lẻ của cuộc gọi. P =c – S +X/(1+r)T quyền chọn bán dài hạn = quyền chọn mua dài hạn, tài sản ngắn hạn,\n0 0 0\ntrái phiếu dài hạn. Do đó, lợi tức của một quyền chọn bán kiểu Châu Âu không bằng lợi tức của một danh mục đầu tư\nbao gồm một tài sản ngắn hạn, một quyền chọn mua ngắn hạn và một trái phiếu ngắn hạn không có rủi ro.\nCông cụ phái sinh: giải thích tính chẵn lẻ của quyền chọn bán kiểu Châu Âu","qhtml":null},{"n":8,"q":"An investor takes a long position in a risk-free bond and in a forward contract on a non-\ndividend-paying stock. The forward contract is priced at £50. The annual risk-free rate is 10%.\nA nine-month put option on the stock with an exercise price of £47 trades at £4. The price of\na nine-month call option on the stock with an exercise price of £47 is closest to:","opts":["£6.79.","£7.22.","£7.30."],"ans":"A","expl":"A. Đúng vì quyền chọn mua và quyền chọn bán tương đương với trái phiếu dài hạn không có rủi ro và quyền chọn bán\nvị trí thuận: p –c =[X-F (T)](1+r)-T như được tính dưới đây:\n0 0 0\np –c =[X-F (T)](1+r)-T (4)\n0 0 0\nSắp xếp lại cho c0\np –c =[X-F (T)](1+r)-T\n0 0 0\np = đặt = £4\n0\nX = giá thực hiện = £47\nF(T) = chuyển tiếp = £50\n0\nr = lãi suất phi rủi ro = 10%\np –c =[X-F (T)](1+r)-T = c\n0 0 0 0\nDo đó, c = £4-[£47-£50](1,10)-075 = £6,79\n0\nB. Không chính xác vì khi tính toán số mũ của * bị sử dụng nhầm mà không có dấu âm.\np –c =[X-F (T)](1+r)+T\n0 0 0\np –c =[X-F (T)](1+r)-T =c\n0 0 0 0\np = đặt = £4\n0\nX = giá thực hiện = £47\nF(T) = chuyển tiếp = £50\n0\nr = lãi suất phi rủi ro = 10%\n£4-[£47- £50] (1,10) = £7,22\n+0,75\nCâu trả lời đúng phải là:\np –c =[X-F (T)](1+r)-T (4)\n0 0 0\np =[X-F (T)](1+r)-T –c\n0 0 0\nc =£4-[£47-£501](1,10)-0,75 = £6,79\n0\nC. Không chính xác vì khi tính toán, số mũ của * bị bỏ sót hoàn toàn.\np –c =[X-F (T)](1+r)\n0 0 0\np –[X-F (T)](1+r)+T = c\n0 0 0\np = đặt = £4\n0\nX = giá thực hiện = £47\nF(T) = chuyển tiếp = £50\n0\nr = lãi suất phi rủi ro = 10%\n£4-[£47- £50](1,10) = £7,30\nCâu trả lời đúng phải là:\np –c =[X-F (T)](1+r)-T (4)\n0 0 0\np –[X-F (T)](1+r)+T = c\n0 0 0\nc =£4-[£47-£50](1,10)-0,75= £6,79\n0\nCông cụ phái sinh: giải thích tính chẵn lẻ kỳ hạn của lệnh bán cho các quyền chọn kiểu Châu Âu","qhtml":null},{"n":9,"q":"Which of the following is most accurate?","opts":["A forward contract is traded on an organized exchange.","Forward contracts are more transparent than futures contracts.","The buyer of a forward contract agrees to buy the underlying asset at a fixed price on a future date."],"ans":"C","expl":"A. Không chính xác vì đây là đặc điểm của hợp đồng tương lai chứ không phải hợp đồng kỳ hạn. Hợp đồng tương lai A\nlà một hợp đồng phái sinh được tiêu chuẩn hóa được tạo và giao dịch trên sàn giao dịch tương lai trong\nmà hai bên đồng ý rằng một bên, người mua, sẽ mua một tài sản cơ bản từ bên\nbên kia, người bán, vào một ngày sau đó và với mức giá được hai bên thỏa thuận khi hợp đồng được bắt đầu\nvà trong đó có sự giải quyết lãi lỗ hàng ngày và bảo lãnh tín dụng bởi\ntrao đổi hợp đồng tương lai thông qua trung tâm thanh toán bù trừ của nó.\nB. Không chính xác vì thực tế nó ngược lại và hợp đồng tương lai minh bạch hơn\nhợp đồng kỳ hạn. Thị trường tương lai minh bạch hơn nhiều so với thị trường kỳ hạn.\nC. Đúng vì hợp đồng kỳ hạn là hợp đồng phái sinh không cần kê đơn, trong đó hai\nđồng ý rằng một bên, người mua, sẽ mua tài sản cơ bản từ bên kia,\nngười bán, vào một ngày sau đó với mức giá cố định mà họ đồng ý khi ký hợp đồng.\nhợp đồng tương lai và ngược lại minh bạch hơn so với hợp đồng thị trường kỳ hạn được ký kết.\nDerivatives: định nghĩa hợp đồng kỳ hạn, hợp đồng tương lai, hoán đổi, quyền chọn (gọi và bán) và tín dụng\ncác công cụ phái sinh và so sánh các đặc điểm cơ bản của chúng","qhtml":null},{"n":10,"q":"A commodities producer selling its inventory forward in anticipation of lower prices in the\nfuture is an example of a:","opts":["fair value hedge.","cash flow hedge.","net investment hedge."],"ans":"A","expl":"A. Đúng vì chỉ định phòng ngừa rủi ro giá trị hợp lý được áp dụng khi một công cụ phái sinh được coi là bù đắp cho\nsự biến động về giá trị hợp lý của một tài sản hoặc nợ phải trả. Một nhà sản xuất hàng hóa có thể bán hàng tồn kho của mình\nvới dự đoán giá trong tương lai sẽ thấp hơn.\nB. Không chính xác vì các công cụ phái sinh được chỉ định là hấp thụ dòng tiền biến đổi của tài sản hoặc nợ phải trả lãi suất thả nổi chẳng hạn như ngoại hối, lãi suất hoặc hàng hóa được gọi là dòng tiền\nphòng ngừa rủi ro. Việc hoán đổi sang lãi suất cố định cho khoản nợ lãi suất thả nổi là một ví dụ khác về dòng tiền\nphòng hộ.\nC. Không chính xác vì các biện pháp phòng ngừa đầu tư ròng xảy ra khi trái phiếu bằng ngoại tệ hoặc công cụ phái sinh\nnhư hoán đổi ngoại hối hoặc kỳ hạn được sử dụng để bù đắp rủi ro tỷ giá hối đoái của vốn chủ sở hữu của một\nhoạt động nước ngoài.\nCông cụ phái sinh: so sánh việc sử dụng công cụ phái sinh giữa các tổ chức phát hành và nhà đầu tư","qhtml":null},{"n":11,"q":"Which of the following is equal to the greater of zero or the present value of the exercise\nprice minus the spot price?","opts":["The lower bound of a put option","The lower bound of a call option","The upper bound of a put option"],"ans":"A","expl":"A. Đúng vì người mua quyền chọn bán sẽ chỉ thực hiện nếu giá giao ngay S thấp hơn X khi đáo hạn.\nT\nDo đó, giá thực hiện X đại diện cho giới hạn trên của giá trị quyền chọn bán. Giới hạn dưới là\ngiá trị hiện tại của giá thực hiện trừ đi giá giao ngay hoặc bằng 0, tùy theo giá trị nào lớn hơn.\nB. Không chính xác vì đây là mô tả về giới hạn dưới của quyền chọn bán. Người mua quyền chọn mua\nsẽ chỉ thực hiện nếu giá giao ngay S vượt quá giá thực hiện (X) khi đáo hạn. Do đó, giới hạn dưới của giá mua a\nT\nlà giá cơ sở trừ đi giá trị hiện tại của giá thực hiện hoặc bằng 0,\ntùy theo giá trị nào lớn hơn.\nC. Không chính xác vì đây là mô tả về thời điểm đáo hạn. Do đó, giá thực hiện, X,\nđại diện cho giới hạn trên của giá giao ngay, S nằm dưới X\nT\nCông cụ phái sinh: đối lập với việc sử dụng chênh lệch giá và các khái niệm nhân rộng trong các cam kết định giá kỳ hạn\nvà các yêu cầu dự phòng","qhtml":null},{"n":12,"q":"Which of the following most likely has an embedded derivative in its structure?","opts":["A put option","A callable bond","A futures contract"],"ans":"B","expl":"A. Không chính xác vì một công cụ phái sinh độc lập là một hợp đồng phái sinh riêng biệt, chẳng hạn như công cụ phái sinh trên\nmột cổ phiếu hoặc trái phiếu. Do đó, quyền chọn bán là một công cụ phái sinh độc lập chứ không phải là một công cụ phái sinh được nhúng.\nB. Đúng vì một công cụ phái sinh nhúng là một công cụ phái sinh bên trong một tài sản cơ sở, chẳng hạn như trái phiếu có thể mua lại,\ncó thể bán lại hoặc trái phiếu chuyển đổi.\nC. Không chính xác vì một công cụ phái sinh độc lập là một hợp đồng phái sinh riêng biệt, chẳng hạn như công cụ phái sinh trên\nmột cổ phiếu hoặc trái phiếu. Hợp đồng tương lai cũng là một hợp đồng phái sinh riêng biệt vì nó không được gắn vào\ntài sản cơ bản.\nCông cụ phái sinh: xác định một công cụ phái sinh và mô tả các tính năng cơ bản của một công cụ phái sinh","qhtml":null},{"n":13,"q":"Which of the following derivatives most likely requires a payment to be made at the\ninitiation of the contract? A(n):","opts":["swap","option","forward"],"ans":"B","expl":"A. Không chính xác vì cũng giống như hợp đồng tương lai và hợp đồng kỳ hạn, tiền không được trao tay khi bắt đầu, do đó, giá trị\ncủa giao dịch hoán đổi khi bắt đầu phải bằng 0.\nB. Đúng vì quyền chọn là hợp đồng phái sinh trong đó một bên, người mua, trả một khoản tiền\ncho bên kia, người bán hoặc người viết và nhận quyền mua hoặc bán\ntài sản cơ bản ở một mức giá cố định vào ngày hết hạn cụ thể hoặc bất kỳ lúc nào trước\nngày hết hạn\nC. Không chính xác vì cũng giống như hợp đồng tương lai và hợp đồng kỳ hạn, tiền không được trao tay ngay từ đầu, do đó, giá trị\ncủa hợp đồng hoán đổi khi bắt đầu phải bằng 0.\nCông cụ phái sinh: xác định hợp đồng kỳ hạn, hợp đồng tương lai, hợp đồng hoán đổi, quyền chọn (gọi và bán) và tín dụng\ncác sản phẩm phái sinh và so sánh các đặc điểm cơ bản của chúng","qhtml":null},{"n":14,"q":"Basis risk is best described as a(n):","opts":["investor's inability to meet a margin call due to a lack of funds.","potential divergence between the expected value of a derivative and its underlying.","divergence in the cash flow timing of a derivative versus that of an underlying transaction."],"ans":"B","expl":"A. Không chính xác vì rủi ro liên quan có thể phát sinh đối với cả người phòng ngừa rủi ro và người chấp nhận rủi ro là rủi ro thanh khoản hoặc sự khác biệt\ntrong thời gian dòng tiền của một công cụ phái sinh so với giao dịch cơ bản. Việc\nthanh toán lãi và lỗ hàng ngày trên thị trường tương lai có thể làm tăng rủi ro thanh khoản. Nếu nhà đầu tư hoặc\nnhà phát hành sử dụng hợp đồng tương lai để phòng ngừa rủi ro cho một giao dịch cơ bản không thể đáp ứng lệnh gọi ký quỹ\ndo thiếu vốn, thì vị thế của đối tác sẽ bị đóng và nhà đầu tư hoặc nhà phát hành phải bù đắp\nmọi tổn thất trong giao dịch phái sinh\nB. Đúng vì rủi ro cơ bản là sự khác biệt tiềm tàng giữa giá trị kỳ vọng của một công cụ\nphái sinh so với một giao dịch cơ bản hoặc được phòng ngừa rủi ro.\nC. Không chính xác vì rủi ro liên quan có thể phát sinh đối với cả người phòng ngừa rủi ro và người chấp nhận rủi ro là rủi ro thanh khoản hoặc\nsự khác biệt về thời điểm dòng tiền của một công cụ phái sinh so với giao dịch cơ bản.\nCông cụ phái sinh: mô tả lợi ích và rủi ro của các công cụ phái sinh","qhtml":null},{"n":15,"q":"Which of the following derivative contracts is best described as a contingent claim?","opts":["A swap contract","A forward contract","An option contract"],"ans":"C","expl":"A. Không chính xác vì hợp đồng phái sinh có thể được phân loại là cam kết chắc chắn hoặc yêu cầu bồi thường tiềm ẩn\n.\nCam kết chắc chắn bao gồm hợp đồng kỳ hạn, hợp đồng tương lai và giao dịch hoán đổi liên quan đến việc trao đổi dòng tiền định kỳ\nvà một quyền chọn là yêu cầu dự phòng chính.\nB. Không chính xác vì hợp đồng phái sinh có thể được phân loại là cam kết chắc chắn hoặc yêu cầu bồi thường tiềm ẩn\n.\nCam kết của công ty bao gồm hợp đồng kỳ hạn, hợp đồng tương lai và giao dịch hoán đổi liên quan đến việc\ntrao đổi dòng tiền định kỳ\" và một quyền chọn là yêu cầu dự phòng chính.\nC. Đúng vì một loại công cụ phái sinh khác là yêu cầu ngẫu nhiên, trong đó một trong các\ncác bên đối tác xác định liệu giao dịch có được giải quyết hay không và khi nào tùy chọn là\nyêu cầu ngẫu nhiên chính.\nCông cụ phái sinh: xác định công cụ phái sinh và mô tả các tính năng cơ bản của một công cụ phái sinh","qhtml":null},{"n":16,"q":"An investor buys a call option for $4 that has an exercise price of $27. At expiration, if the\nstock price is $22, the call option payoff is:","opts":["negative.","zero.","positive."],"ans":"B","expl":"A. Không chính xác vì đó là lợi nhuận của người mua, không phải là khoản hoàn trả, tức là П = Max(0, S -X)-c . 0\nlà phí bảo hiểm, S là giá cổ phiếu khi hết hạn và X là giá thực hiện (hoặc giá thực hiện). Trong trường hợp này,\nT\nП= Max(0,$22 - $27) - $4= -$4, và do đó âm.\nB. Đúng vì c = Max(0,S -X), trong đó c là giá trị của quyền chọn mua, hoặc khoản hoàn trả cho cuộc gọi\nT T T\nngười mua, X là giá thực hiện (hoặc giá thực hiện) và S là giá cổ phiếu khi hết hạn. Trong trường hợp này, c =\nT T\nMax(0.$22 - $27) = 0.\nC. Không chính xác vì đó là khoản hoàn trả cho người mua quyền chọn bán. là, p Max(0,X- S ), trong đó X là\nT T\ngiá thực hiện (hoặc thực hiện) và S là giá cổ phiếu khi hết hạn. Trong trường hợp này, p = Max(0,$27 - $22) =\nT T\n$5.\nCông cụ phái sinh: xác định giá trị khi hết hạn và lợi nhuận. từ một vị thế mua hoặc bán trong một cuộc gọi hoặc\ntùy chọn bán","qhtml":null},{"n":17,"q":"Which of the following derivatives have a non-linear payoff?","opts":["Contingent claims only","Forward commitments only","Both contingent claims and forward commitments"],"ans":"A","expl":"A. Đúng vì cấu hình thanh toán không đối xứng là đặc điểm chung của các yêu cầu dự phòng, đó là\nđôi khi được gọi là phái sinh phi tuyến tính.\nB. Không chính xác vì giá phái sinh là một hàm tuyến tính của tài sản cơ sở, nên các cam kết [forward]\ncũng được gọi là phái sinh tuyến tính.\nC. Không chính xác vì vì giá phái sinh là một hàm tuyến tính của tài sản cơ sở nên các cam kết [forward]\ncũng được gọi là tuyến tính. các công cụ phái sinh.\nCác công cụ phái sinh: đối chiếu các cam kết trong tương lai với các yêu cầu dự phòng","qhtml":null},{"n":18,"q":"The potential divergence between the expected value of a derivative instrument versus\nan underlying or hedged transaction best describes:","opts":["basis risk.","liquidity risk.","systemic risk."],"ans":"A","expl":"A. Đúng vì rủi ro cơ bản là sự khác biệt tiềm tàng giữa giá trị kỳ vọng của một công cụ\nphái sinh so với một giao dịch cơ bản hoặc được phòng ngừa rủi ro.\nB. Không chính xác vì rủi ro thanh khoản là sự khác biệt tiềm tàng giữa thời điểm dòng tiền của một công cụ phái sinh\n so với giao dịch cơ bản hoặc giao dịch được phòng ngừa rủi ro.\nC. Không chính xác vì rủi ro hệ thống liên quan đến việc chấp nhận rủi ro quá mức và sử dụng đòn bẩy trong\nthị trường phái sinh.\nCông cụ phái sinh: Mô tả lợi ích và rủi ro của các công cụ phái sinh","qhtml":null},{"n":19,"q":"With respect to hedge accounting designation types, a:","opts":["foreign exchange forward to hedge forecasted sales is an example of a fair value hedge.","commodity futures contract used to hedge inventory is an example of a cash flow hedge.","currency forward to offset the foreign exchange risk of equity of a foreign operation is an example of a net investment hedge."],"ans":"C","expl":"A. Không chính xác vì doanh thu dự kiến ​​chuyển tiếp FX để phòng ngừa rủi ro hấp thụ dòng tiền biến đổi của tài sản hoặc nợ phải trả lãi suất thả nổi\n (giao dịch dự báo) và là một ví dụ về phòng ngừa rủi ro dòng tiền.\nB. Không chính xác vì hợp đồng tương lai hàng hóa được sử dụng để phòng ngừa rủi ro hàng tồn kho bù đắp cho sự biến động về giá trị hợp lý của\nmột tài sản hoặc nợ phải trả và là một ví dụ về phòng ngừa rủi ro giá trị hợp lý.\nC. Đúng vì kỳ hạn tiền tệ được chỉ định là bù đắp rủi ro ngoại hối của vốn sở hữu trong hoạt động\nnước ngoài là một ví dụ về phòng ngừa rủi ro đầu tư ròng.\nCông cụ phái sinh: so sánh việc sử dụng công cụ phái sinh giữa các tổ chức phát hành và nhà đầu tư","qhtml":null},{"n":20,"q":"Which of the following statements about derivatives is most accurate?","opts":["Derivatives reduce the efficiency of price discovery for the underlying.","Transaction cost of derivatives are greater than the transaction cost of the underlying","Excessive risk taking and use of leverage in derivative markets may contribute to market stress"],"ans":"C","expl":"A. Không chính xác vì giá công cụ phái sinh phục vụ chức năng khám phá giá ngoài\ntiền mặt cơ bản hoặc thị trường giao ngay. Ví dụ, giá tương lai thường được coi là thông tin tiết lộ\nvề hướng đi của thị trường tiền mặt trong tương lai, mặc dù chúng không thể được coi là một\ndự báo khách quan về giá giao ngay trong tương lai. Do đó, các công cụ phái sinh được cải thiện. không giảm, hiệu quả của\nkhám phá giá cho cơ sở\nB. Không chính xác vì khi giá lệch khỏi giá trị cơ bản, thị trường phái sinh cung cấp ít hơn\nnhững cách tốn kém để khai thác việc định giá sai. Như đã lưu ý trước đó, cần ít vốn hơn, chi phí giao dịch thấp hơn.\nthấp hơn và việc bán khống dễ dàng hơn. Ngoài ra, các công cụ phái sinh còn mang lại những Ưu điểm Hoạt động sau:\nGiảm chi tiêu tiền mặt, giảm chi phí giao dịch so với tài sản cơ sở, tăng tính thanh khoản và khả năng\n'ngắn'\nC. Đúng vì việc chấp nhận rủi ro quá mức và sử dụng đòn bẩy trong thị trường phái sinh có thể góp phần gây ra\ncăng thẳng thị trường, như trong cuộc khủng hoảng tài chính năm 2008.\nCông cụ phái sinh: mô tả lợi ích và rủi ro của các công cụ phái sinh","qhtml":null},{"n":21,"q":"Which of the following asset classes is most likely to have a convenience yield?","opts":["Commodities","Interest rates","Foreign exchange"],"ans":"A","expl":"A. Đúng vì lợi tức tiện lợi là lợi ích phi tiền mặt gắn liền với tài sản vật chất. Ngược lại\ntrái ngược với chứng khoán hoặc tiền mặt được lưu trữ điện tử, hàng hóa thường liên quan đến chi phí đã biết\nliên quan đến bảo hiểm lưu trữ, vận chuyển và khả năng hư hỏng (trong trường hợp hàng hóa mềm\n) của những tài sản vật chất này. Lợi ích phi tiền mặt của việc nắm giữ hàng hóa vật chất so với hàng hóa phái sinh\nđược gọi là lợi suất tiện lợi.\nB. Không chính xác vì lợi tức tiện lợi là lợi ích không dùng tiền mặt liên quan đến tài sản vật chất\nngược lại với chứng khoán hoặc tiền mặt được lưu trữ điện tử, hàng hóa thường liên quan đến chi phí đã biết\nliên quan đến bảo hiểm lưu trữ, vận chuyển và khả năng hư hỏng tiềm ẩn (trong trường hợp hàng hóa mềm\n) của những tài sản vật chất này. Lợi ích phi tiền mặt của việc nắm giữ hàng hóa vật chất so với hàng hóa phái sinh\nđược gọi là lợi suất tiện lợi.\nC. Không chính xác vì lợi tức tiện lợi là lợi ích phi tiền mặt gắn liền với tài sản vật chất. Ngược lại\ntrái ngược với chứng khoán hoặc tiền mặt được lưu trữ điện tử, hàng hóa thường liên quan đến các chi phí đã biết\nliên quan đến việc lưu trữ, bảo hiểm, vận chuyển và khả năng hư hỏng (trong trường hợp hàng hóa mềm\n) của các tài sản vật chất này. Lợi ích phi tiền mặt của việc nắm giữ một hàng hóa vật chất so với hàng hóa phái sinh\nđược gọi là lợi tức tiện lợi.\nCác công cụ phái sinh: giải thích sự khác biệt giữa giá giao ngay và giá tương lai dự kiến của một hàng hóa cơ bản và\nchi phí vận chuyển liên quan đến việc nắm giữ tài sản cơ bản","qhtml":null},{"n":22,"q":"Counterparty default risk is most likely lowest for which of the following types of\nderivatives?","opts":["Swaps","Futures","Forwards"],"ans":"B","expl":"A. Không chính xác vì các điều khoản tín dụng hoán đổi được đàm phán riêng giữa các đối tác trong một thỏa thuận không cần kê đơn và có thể bao gồm rủi ro không được thế chấp, trong đó mỗi đối tác\nchịu toàn bộ rủi ro vỡ nợ của bên kia. Do đó, giao dịch hoán đổi không có rủi ro\nđối tác thấp nhất.\nB. Đúng vì các công cụ phái sinh giao dịch trao đổi (ETD) là các hợp đồng được tiêu chuẩn hóa được giao dịch trên một sàn giao dịch có tổ chức\n yêu cầu tài sản thế chấp để ký gửi để bảo vệ khỏi trường hợp vỡ nợ của đối tác và\nhợp đồng tương lai là một công cụ phái sinh giao dịch trao đổi (ETD) với các điều khoản được tiêu chuẩn hóa do sàn giao dịch\nđặt ra. Do đó, hợp đồng tương lai có rủi ro vỡ nợ đối tác thấp nhất.\nC. Không chính xác vì hợp đồng kỳ hạn là một công cụ phái sinh không cần kê đơn (OTC) và các công cụ OTC\ncó độ minh bạch kém hơn, thường có nhiều rủi ro đối tác hơn. Do đó, hợp đồng kỳ hạn không có\nrủi ro đối tác thấp nhất.\nCác công cụ phái sinh: xác định hợp đồng kỳ hạn, hợp đồng tương lai, giao dịch hoán đổi, quyền chọn (gọi và bán) và tín dụng\ncác sản phẩm phái sinh và so sánh các đặc điểm cơ bản của chúng","qhtml":null},{"n":23,"q":"When the strike price of a call option is lower, the likelihood of the option expiring in-the-\nmoney is:","opts":["lower.","unchanged.","higher."],"ans":"C","expl":"A. Không chính xác vì đối với quyền chọn mua, giá thực hiện thấp hơn có hai lợi ích. Một là có\nnhiều giá trị cơ sở khi hết hạn cao hơn giá thực hiện, nghĩa là có\nnhiều kết quả hơn trong đó quyền chọn mua hết hạn có lãi. Do đó, khả năng xảy ra là cao hơn chứ không\nthấp hơn.\nB. Không chính xác vì đối với quyền chọn mua, giá thực hiện thấp hơn có hai lợi ích. Một là có\nnhiều giá trị cơ sở khi hết hạn cao hơn giá thực hiện, nghĩa là có\nnhiều kết quả hơn trong đó quyền chọn mua hết hạn có lãi. Do đó, khả năng xảy ra sẽ cao hơn và không\nkhông thay đổi.\nC. Đúng vì đối với quyền chọn mua, giá thực hiện thấp hơn có hai lợi ích. Một là có\nnhiều giá trị cơ bản khi hết hạn cao hơn giá thực hiện, nghĩa là có\nnhiều kết quả hơn trong đó quyền chọn mua hết hạn có lãi.\nCác công cụ phái sinh: giải thích giá trị thực hiện, số tiền và giá trị thời gian của một quyền chọn","qhtml":null},{"n":24,"q":"Derivatives are typically priced by forming a hedge involving the underlying asset and a\nderivative such that the combination must pay the:","opts":["risk-free rate.","dividend yield.","convenience yield."],"ans":"A","expl":"A. Đúng vì Công cụ phái sinh thường được định giá bằng cách hình thành một hàng rào bảo hiểm liên quan đến tài sản cơ bản\nvà một công cụ phái sinh sao cho sự kết hợp phải trả lãi suất phi rủi ro và chỉ trả một\ngiá phái sinh.\nB. Không chính xác vì Công cụ phái sinh thường được định giá bằng cách hình thành một hàng rào liên quan đến tài sản\ncơ bản và một công cụ phái sinh sao cho sự kết hợp phải trả lãi suất phi rủi ro và chỉ trả một\ngiá phái sinh. Do đó, đây là lãi suất phi rủi ro chứ không phải lợi tức cổ tức mà hàng rào liên quan đến\ntài sản cơ bản và chứng khoán phái sinh phải trả.\nC. Không chính xác vì Công cụ phái sinh thường được định giá bằng cách hình thành một hàng rào liên quan đến tài sản\ncơ bản và một công cụ phái sinh sao cho sự kết hợp phải trả lãi suất phi rủi ro và chỉ trả một\ngiá phái sinh. Ngoài ra, một số mặt hàng tạo ra lợi ích có phần không rõ ràng và khó\nđo lường. Lợi ích này được gọi là lợi tức thuận tiện. Nó thể hiện lợi thế phi tiền tệ của việc\nnắm giữ tài sản. Do đó, lãi suất phi rủi ro chứ không phải lợi nhuận thuận tiện mà hàng rào liên quan đến\ntài sản cơ bản và công cụ phái sinh phải trả\nCông cụ phái sinh: giải thích cách sử dụng các khái niệm chênh lệch giá và sao chép trong định giá các công cụ phái sinh","qhtml":null},{"n":25,"q":"The potential divergence between the cash flow timing of a derivative instrument versus\nits underlying best describes:","opts":["basis risk.","liquidity risk.","systemic risk."],"ans":"B","expl":"A. Không chính xác vì rủi ro cơ bản được mô tả là sự khác biệt tiềm ẩn giữa giá trị kỳ vọng\ncủa một công cụ phái sinh so với một giao dịch cơ bản hoặc được phòng ngừa rủi ro.\nB. Đúng vì rủi ro thanh khoản được mô tả là sự khác biệt tiềm ẩn giữa thời điểm dòng tiền của\nmột công cụ phái sinh so với giao dịch cơ bản hoặc giao dịch phòng ngừa rủi ro.\nC. Không chính xác vì rủi ro hệ thống là kết quả của việc chấp nhận rủi ro quá mức và sử dụng đòn bẩy trong các thị trường phái sinh\ncó thể góp phần gây căng thẳng cho thị trường.\nCông cụ phái sinh: mô tả lợi ích và rủi ro của các công cụ phái sinh","qhtml":null},{"n":26,"q":"Before expiration, if the price of the underlying is above the exercise price, the European\nput option has a positive:","opts":["time value.","intrinsic value.","exercise value."],"ans":"A","expl":"A. Đúng vì nếu cơ sở bằng hoặc có giá trị cao hơn giá thực hiện khi hết hạn\n(S,2X), thì quyền chọn bán sẽ hết hạn mà không có giá trị. Vì vậy, quyền chọn bán có giá trị lớn hơn giá trị thực hiện bằng 0 hoặc\ntrừ đi giá của tài sản cơ sở khi hết hạn. Ngoài ra, giá trị thời gian của một quyền chọn là\nsự khác biệt giữa giá thị trường của quyền chọn và giá trị nội tại của nó. Vì giá của\ncơ bản cao hơn giá thực hiện nên quyền chọn bán có giá trị thực hiện bằng 0 và chỉ có giá trị thời gian\ndương.\nB. Không chính xác vì nếu cơ sở bằng hoặc có giá trị cao hơn giá thực hiện khi hết hạn\n(S, 2X), nồi của tôi sẽ hết hạn mà không có giá trị. Vì vậy, quyền chọn bán có giá trị lớn hơn giá trị thực hiện bằng 0 hoặc\ntrừ đi giá của tài sản cơ sở khi hết hạn. Ngoài ra, giá trị thời gian của một quyền chọn là\nsự khác biệt giữa giá thị trường của quyền chọn và giá trị nội tại của nó. Vì giá của\ncơ bản cao hơn giá thực hiện nên quyền chọn bán có giá trị nội tại (hoặc giá trị thực hiện) bằng 0 và chỉ có giá trị thời gian dương\nC. Không chính xác vì nếu cơ sở bằng hoặc có giá trị cao hơn giá thực hiện khi hết hạn\n(S,>X), quyền chọn bán sẽ hết hạn mà không có giá trị. Vì vậy, quyền chọn bán có giá trị lớn hơn giá trị thực hiện bằng 0 hoặc\ntrừ đi giá của tài sản cơ sở khi hết hạn. Ngoài ra, giá trị thời gian của một quyền chọn là\nsự khác biệt giữa giá thị trường của quyền chọn và giá trị nội tại của nó. Vì giá của\ncơ bản cao hơn giá thực hiện nên quyền chọn bán có giá trị thực hiện (hoặc nội tại) bằng 0 và chỉ có\ngiá trị thời gian dương\nPhiên bản phái sinh: giải thích giá trị thực hiện, giá trị tiền bạc và giá trị thời gian của một quyền chọn","qhtml":null},{"n":27,"q":"According to put-call-forward parity, the payoff on a fiduciary call is equivalent to the\npayoff on a portfolio consisting of:","opts":["a long call and a short risk-free bond.","a long put, a long forward contract and a long risk-free bond.","a short call, a long forward contract and a long risk-free bond."],"ans":"B","expl":"A. Không chính xác vì hãy nhớ lại cuộc thảo luận về ngang giá quyền chọn bán của chúng ta và giả định rằng Nhà đầu tư A tạo quyền chọn bán bảo vệ\ncủa mình theo một cách hơi khác. Thay vì mua tài sản, anh ta mua một hợp đồng kỳ hạn\nvà một trái phiếu không rủi ro trong đó mệnh giá là giá kỳ hạn. Chiến lược này là một quyền chọn bán bảo vệ\ntổng hợp. Bởi vì chúng tôi đã chỉ ra rằng quyền chọn mua ủy thác tương đương với quyền chọn bán bảo vệ, nên\nquyền chọn mua ủy thác phải tương đương với quyền chọn bán bảo vệ có hợp đồng kỳ hạn. Do đó, lợi ích\ncủa một quyền chọn ủy thác không bằng lợi ích của một danh mục đầu tư bao gồm quyền chọn mua dài hạn và một trái phiếu không rủi ro\nngắn.\nB. Đúng vì hãy nhớ lại cuộc thảo luận về ngang giá quyền chọn bán của chúng ta và giả định rằng nhà đầu tư A tạo quyền chọn bán bảo vệ riis\ntheo một cách hơi khác. Thay vì mua tài sản, anh ta mua một hợp đồng kỳ hạn\nvà một trái phiếu không rủi ro trong đó mệnh giá là giá kỳ hạn. Chiến lược này là một quyền chọn bán bảo vệ\ntổng hợp Bởi vì chúng tôi đã chỉ ra rằng quyền chọn mua ủy thác tương đương với quyền chọn bán bảo vệ, nên một\nlệnh gọi quyền chọn ủy thác nas tương đương với một quyền chọn bán bảo vệ có hợp đồng kỳ hạn Do đó, số tiền hoàn trả\ncủa quyền chọn mua ủy thác = tiền hoàn trả của quyền chọn bán bảo vệ tổng hợp, quyền chọn mua ủy thác = quyền chọn mua + trái phiếu dài hạn không rủi ro\n = mua trái phiếu không rủi ro + hợp đồng kỳ hạn mua + quyền chọn bán\nC. Không chính xác vì hãy nhớ lại cuộc thảo luận về ngang giá quyền chọn bán của chúng ta và giả định rằng Nhà đầu tư A tạo quyền chọn bán bảo vệ\ncủa mình theo một cách hơi khác. Thay vì mua tài sản, anh ta mua một hợp đồng kỳ hạn\nvà một trái phiếu không rủi ro trong đó mệnh giá là giá kỳ hạn. Chiến lược này là một quyền chọn bán bảo vệ\ntổng hợp. Bởi vì chúng tôi đã chỉ ra rằng quyền chọn mua ủy thác tương đương với quyền chọn bán bảo vệ, nên\nquyền chọn mua ủy thác phải tương đương với quyền chọn bán bảo vệ có hợp đồng kỳ hạn. Do đó, lợi ích\ncủa quyền chọn ủy thác không bằng lợi ích của danh mục đầu tư bao gồm quyền chọn mua ngắn hạn, hợp đồng kỳ hạn dài hạn\nvà trái phiếu dài hạn không có rủi ro.\nCông cụ phái sinh: giải thích tính chẵn lẻ kỳ hạn của quyền chọn mua đối với quyền chọn Châu Âu","qhtml":null},{"n":28,"q":"Compared to over-the-counter derivatives, exchange-traded derivatives:","opts":["are less standardized.","provide less transparency.","have lower transaction costs."],"ans":"C","expl":"A. Không chính xác vì thị trường OTC và ETD khác nhau ở một số điểm, bao gồm cả việc hợp đồng ETD\nchuẩn hóa hơn.\nB. Không chính xác vì thị trường OTC và ETD khác nhau ở một số điểm, bao gồm cả việc các công cụ OTC\ncó độ minh bạch kém hơn, trong khi thị trường ETD có tính minh bạch.\nC. Đúng vì thị trường OTC và ETD khác nhau ở một số điểm, bao gồm cả việc hợp đồng ETD có\nchi phí giao dịch và giao dịch thấp hơn.\nCông cụ phái sinh: mô tả các đặc điểm cơ bản của thị trường phái sinh và so sánh thị trường phái sinh giao dịch tự do và\ntrao đổi ngoại hối","qhtml":null},{"n":29,"q":"A series of forward rate agreements and an interest rate swap contract covering the same\nperiods and using the same market reference rate will most likely have the same:","opts":["fixed rates.","cash flows upfront.","settlement cash flows."],"ans":"B","expl":"A. Không chính xác vì các mức lãi suất cố định FRA khác nhau thường tồn tại ở những thời điểm đáo hạn khác nhau. Ngược lại\n, hợp đồng hoán đổi lãi suất tiêu chuẩn có lãi suất cố định không đổi trong suốt thời gian sử dụng, bao gồm nhiều\ngiai đoạn.\nB. Đúng vì những điểm tương đồng giữa hợp đồng kỳ hạn lãi suất và hợp đồng hoán đổi bao gồm hồ sơ thanh toán\nđối xứng và trả trước được trao đổi.\nC. Không chính xác vì các lãi suất cố định FRA khác nhau thường tồn tại cho các thời điểm đáo hạn khác nhau. Ngược lại,\nhoán đổi lãi suất tiêu chuẩn có lãi suất cố định không đổi trong suốt thời gian sử dụng, bao gồm nhiều kỳ\nvà FRA có một khoản thanh toán duy nhất, xảy ra vào đầu kỳ lãi, trong khi đó\nhoán đổi tiêu chuẩn có các khoản thanh toán định kỳ. xảy ra vào cuối mỗi kỳ tương ứng.\nCông cụ phái sinh: mô tả cách các hợp đồng hoán đổi giống nhưng khác với một loạt các hợp đồng kỳ hạn","qhtml":null},{"n":30,"q":"The value of a forward contract at initiation is most likely equal to:","opts":["zero.","the spot price minus the forward price.","the forward price minus the spot price."],"ans":"A","expl":"A. Đúng vì cả bên mua và bên bán đều không trả bất kỳ khoản nào cho bên kia vào ngày bắt đầu\nmột hợp đồng kỳ hạn khi được bắt đầu bằng 0.\nB. Không chính xác vì giá trị của hợp đồng kỳ hạn khi hết hạn là giá giao ngay của\ncơ bản trừ đi giá kỳ hạn đã thỏa thuận trong hợp đồng. Bởi vì cả vị thế mua và vị thế bán đều không trả\nbất cứ điều gì cho bên kia vào ngày bắt đầu hợp đồng kỳ hạn, giá trị của hợp đồng kỳ hạn\nkhi bắt đầu bằng 0. Do đó, giá trị của hợp đồng kỳ hạn khi bắt đầu không bằng\ngiá giao ngay trừ đi giá kỳ hạn.\nC. Không chính xác vì giá trị của hợp đồng kỳ hạn khi hết hạn là giá giao ngay của\ncơ bản trừ đi giá kỳ hạn đã thỏa thuận trong hợp đồng. bởi vì cả vị thế mua và vị thế bán đều không trả\nbất cứ thứ gì cho bên kia vào ngày bắt đầu hợp đồng kỳ hạn, giá trị của hợp đồng kỳ hạn\nkhi bắt đầu bằng 0. Do đó, giá trị của hợp đồng kỳ hạn khi bắt đầu không bằng\ngiá kỳ hạn trừ đi giá giao ngay.\nCông cụ phái sinh: giải thích cách xác định giá trị và giá của hợp đồng kỳ hạn khi bắt đầu,\ntrong thời hạn của hợp đồng và khi hết hạn.","qhtml":null},{"n":31,"q":"Which of the following derivatives realize a gain as the market reference rate rises above\nthe initial fixed rate?","opts":["Long forward rate agreements only","Short interest rate futures contracts only","Both long forward rate agreements and short interest rate futures contracts"],"ans":"C","expl":"A. Không chính xác vì các hợp đồng tương lai lãi suất ngắn cũng được hưởng lợi từ tỷ lệ tham chiếu thị trường đang tăng\nrate.\nB. Không chính xác vì các thỏa thuận tỷ giá kỳ hạn dài cũng được hưởng lợi từ tỷ giá tham chiếu thị trường tăng.\nC. Đúng vì nhận ra lợi nhuận từ hợp đồng FRA khi lãi suất tăng. Lưu ý rằng điều này sẽ\ntương đương với việc nắm giữ một vị thế bán trên hợp đồng tương lai MRR CNY nếu có. Vị trí FRA\n(tức là người nhận lãi suất thả nổi FRA (người trả lãi suất cố định)) dài sẽ nhận được lợi nhuận khi MRR tăng. Giá hợp đồng tương lai ngắn hạn\nđược dựa trên (100- lợi nhuận). tăng khi năng suất đến ngày đáo hạn (MRR) tăng.\nCông cụ phái sinh: so sánh giá trị và giá của hợp đồng kỳ hạn và hợp đồng tương lai","qhtml":null},{"n":32,"q":"In the over-the-counter derivatives market, most transactions occur between end users\nand:","opts":["dealers.","other end users.","a central counterparty."],"ans":"A","expl":"A. Đúng vì thị trường phái sinh OTC (không cần kê đơn) bao gồm các hợp đồng được ký giữa\nngười dùng cuối và đại lý phái sinh hoặc các trung gian tài chính, chẳng hạn như ngân hàng thương mại hoặc\nngân hàng đầu tư.\nB. Không chính xác vì người dùng cuối thường không giao dịch với những người dùng cuối khác. Thị trường phái sinh OTC\nliên quan đến các hợp đồng được ký kết giữa người dùng cuối và đại lý phái sinh hoặc các trung gian tài chính,\nchẳng hạn như ngân hàng thương mại hoặc ngân hàng đầu tư.\nC. Không chính xác vì đối tác trung tâm cung cấp chức năng thanh toán bù trừ và thanh toán thay vì\ngiao dịch phái sinh. Một đối tác trung tâm (CCP) chịu rủi ro tín dụng giữa các đối tác\n phái sinh, một trong số đó thường là một trung gian tài chính. CCPS cung cấp khả năng thanh toán bù trừ và\ncho hầu hết các hợp đồng phái sinh\nPhiên bản phái sinh: mô tả các đặc điểm cơ bản của thị trường phái sinh và so sánh thị trường phái sinh giao dịch qua sàn và\ntrao đổi ngoại tệ","qhtml":null},{"n":33,"q":"Which of the following statements is most accurate? A standard interest rate swap has:","opts":["a symmetric payoff profile.","the principal cash flow exchanged upfront.","periodic settlements that occur at the beginning of each period."],"ans":"A","expl":"A. Đúng vì những điểm tương đồng khác giữa hợp đồng kỳ hạn lãi suất và hợp đồng hoán đổi bao gồm hồ sơ hoàn trả đối xứng\n và thực tế là không có dòng tiền nào được trao đổi trả trước. Hồ sơ thanh toán đối xứng\ncủa một giao dịch hoán đổi có giá trị bằng 0 đối với cả hai bên có nghĩa là giao dịch hoán đổi đó khi bắt đầu hợp đồng.\nB. Không chính xác vì những điểm tương đồng khác giữa hợp đồng kỳ hạn lãi suất và hợp đồng hoán đổi bao gồm\nhồ sơ hoàn trả đối xứng và thực tế là không có dòng tiền nào được trao đổi trả trước.\nC. Không chính xác vì FRA (thỏa thuận tỷ giá kỳ hạn) có một khoản thanh toán duy nhất xảy ra vào lúc\nbắt đầu kỳ lãi, trong khi hợp đồng hoán đổi tiêu chuẩn có các khoản thanh toán định kỳ xảy ra vào cuối mỗi kỳ tương ứng. Vì vậy, mặc dù hợp đồng hoán đổi tiêu chuẩn có các khoản thanh toán định kỳ, nhưng\nnhững điều này xảy ra vào cuối kỳ chứ không phải đầu kỳ.\nCông cụ phái sinh: mô tả cách các hợp đồng hoán đổi tương tự nhưng khác với một loạt hợp đồng kỳ hạn","qhtml":null},{"n":34,"q":"Q. The upper bound of a call price is the:","opts":["exercise price.","price of the underlying.","underlying's price minus the present value of the exercise price."],"ans":"B","expl":"A. Không chính xác vì yếu tố phân tâm này là giới hạn trên của giá trị quyền chọn bán chứ không phải giá quyền chọn mua. Do đó,\ngiá thực hiện, X, đại diện cho giới hạn trên của giá trị quyền chọn bán.\nB. Đúng vì người mua cuộc gọi sẽ không trả nhiều tiền hơn cho quyền mua cơ sở so với giá\ncủa cơ sở đó, là giới hạn trên.\nC. Không chính xác vì lựa chọn câu trả lời này thể hiện giới hạn dưới của giá mua chứ không phải giới hạn trên\n. Do đó, giới hạn dưới của giá quyền chọn mua là giá cơ sở trừ đi giá trị hiện tại của\ngiá thực hiện của nó hoặc bằng 0, tùy theo giá trị nào lớn hơn.\nCông cụ phái sinh: đối chiếu việc sử dụng chênh lệch giá và các khái niệm nhân rộng trong các cam kết định giá kỳ hạn\nvà các yêu cầu dự phòng","qhtml":null},{"n":35,"q":"The following portfolios contain a company's stock and a derivative on the stock:\nPortfolio Securities\n1 Stock and a short futures position\n2 Stock and a short call option position\n3 Stock and a short warrant position\nThe portfolio containing a derivative acting as a firm commitment to hedge the stock is most\nlikely.","opts":["Portfolio 1.","Portfolio 2.","Portfolio 3."],"ans":"A","expl":"A. Đúng vì người mua chứng khoán phái sinh ký kết một hợp đồng có giá trị thay đổi theo cách tương tự\nđến một vị trí dài trong cơ sở. Do đó, một vị thế bán khống trong tương lai sẽ phòng ngừa rủi ro đối với\ncơ bản: Việc sử dụng công cụ phái sinh để bù đắp hoặc vô hiệu hóa rủi ro hiện tại hoặc dự kiến đối với một\ncơ sở được gọi là phòng ngừa rủi ro, với bản thân công cụ phái sinh thường được mô tả là phòng ngừa rủi ro của\ngiao dịch cơ bản. Ngoài ra, vị thế hợp đồng tương lai là một cam kết chắc chắn: Cam kết chắc chắn\nbao gồm các hợp đồng kỳ hạn, hợp đồng tương lai và hợp đồng hoán đổi liên quan đến việc trao đổi dòng tiền định kỳ.\nB. Không chính xác vì quyền chọn là ví dụ về yêu cầu dự phòng thay vì cam kết chắc chắn.\nCam kết của công ty bao gồm các hợp đồng kỳ hạn, hợp đồng tương lai và hợp đồng hoán đổi liên quan đến một kỳ hạn định kỳ.\ntrao đổi dòng tiền. Một loại công cụ phái sinh khác là yêu cầu bồi thường ngẫu nhiên, trong đó một trong những\ncác đối tác xác định xem liệu giao dịch có được giải quyết hay không và khi nào. Một lựa chọn là chính\nyêu cầu ngẫu nhiên\nC. Không chính xác vì chứng quyền là một loại quyền chọn và quyền chọn là một ví dụ về yêu cầu bồi thường ngẫu nhiên\nhơn là một cam kết chắc chắn. Các cam kết chắc chắn bao gồm hợp đồng kỳ hạn, hợp đồng tương lai và\ncác giao dịch hoán đổi liên quan đến việc trao đổi định kỳ các dòng tiền. Một loại phái sinh khác là yêu cầu bồi thường ngẫu nhiên,\ntrong đó một trong các đối tác xác định liệu giao dịch có được giải quyết hay không và khi nào. Một lựa chọn là\nyêu cầu bồi thường tiềm tàng chính, các Công ty cũng có thể phát hành chứng quyền, là các quyền chọn được cấp cho\nnhân viên hoặc bán ra công chúng cho phép người nắm giữ mua cổ phiếu ở mức giá cố định trong tương lai\ntrực tiếp từ nhà phát hành.\nCông cụ phái sinh: định nghĩa đạo hàm và mô tả các tính năng cơ bản của công cụ phái sinh","qhtml":null},{"n":36,"q":"A futures contract's:","opts":["mark-to-market is not settled until maturity.","price remains fixed until the contract matures.","variation margin reduces counterparty credit risk."],"ans":"C","expl":"A. Không chính xác vì hợp đồng kỳ hạn (không phải hợp đồng tương lai) MTM không được thanh toán cho đến khi đáo hạn.\nB. Không chính xác vì giá kỳ hạn F (T) không đổi cho đến khi hợp đồng đáo hạn, trong khi\n0\ngiá tương lai, f (T), dao động hàng ngày dựa trên những thay đổi của thị trường.\n0\nC. Đúng vì cơ chế thanh toán hàng ngày đặt lại MTM tương lai về 0 và biến thể\nký quỹ được trao đổi để giải quyết chênh lệch, giảm rủi ro tín dụng đối tác.\nCông cụ phái sinh: so sánh giá trị và giá của hợp đồng kỳ hạn và hợp đồng tương lai","qhtml":null},{"n":37,"q":"Q. A stock with a dividend yield of 3% is trading in the spot market at $50. If the annual\nrisk-free rate is 5%, the 6- month forward price of the stock is closest to:","opts":["$49.50.","$50.50.","$51.27."],"ans":"B","expl":"A. Không chính xác vì lãi suất phi rủi ro và lợi tức cổ tức bị đảo ngược.\n≠ F (T) = $50e(0,03-0,05)0,5\n0\n= $49,50249 ≈$49,50\nB. Đúng vì giá kỳ hạn là: F (T) = S0e(f-i)T trong đó r là lãi suất phi rủi ro, là cổ tức\n0\nsản lượng và T là khoảng thời gian.\nF (T) = $50e(0,05 -0,03)0,5\n0\n= $50,50251≈$50,50.\nC. Không chính xác vì cổ tức đã bị loại khỏi phép tính.\n≠ F (T) = $50e(0,05)0,5\n0\n= $51,26576 ≈ $51,27.\nCông cụ phái sinh: giải thích cách sử dụng các khái niệm chênh lệch giá và sao chép trong định giá phái sinh","qhtml":null},{"n":38,"q":"If the net cost of carry is zero, the forward price of a commodity is most likely.","opts":["less than the commodity's spot price compounded at the risk-free rate over the life of the contract.","equal to the commodity's spot price compounded at the risk-free rate over the life of the contract.","greater than the commodity's spot price compounded at the risk-free rate over the life of the contract."],"ans":"B","expl":"A. Không chính xác vì khi lợi ích vượt quá chi phí thì giao dịch kỳ hạn sẽ mang lại ít\nso với giao dịch giao ngay. Công thức điều chỉnh giá kỳ hạn giảm xuống theo biểu thức -(𝛾-\n𝜃)(1+r)T để phản ánh khoản lỗ ròng này trong giao dịch giao ngay. Nói cách khác, việc mua tài sản trên thị trường kỳ hạn\nsẽ rẻ hơn vì nó bỏ qua những lợi ích vượt quá chi phí. Do đó,\ngiá kỳ hạn của một hàng hóa sẽ thấp hơn giá giao ngay của hàng hóa đó được cộng dồn theo lãi suất phi rủi ro-\ntrong suốt thời hạn của hợp đồng khi chi phí vận chuyển ròng (𝛾-𝜃),là dương chứ không phải khi nó bằng 0.\nB. Đúng vì Giá kỳ hạn của một tài sản kèm theo lợi ích và/hoặc chi phí là giá giao ngay\nđược gộp theo lãi suất phi rủi ro trong suốt thời hạn của hợp đồng trừ đi giá trị tương lai của những\nlợi ích và chi phí đó. Đó là. F (T) = S (1+r)T-(𝛾-𝜃)(1+r)T, trong đó chi phí thực hiện ròng bao gồm\n0 0\nlợi ích, ký hiệu là 𝛾, (cổ tức hoặc tiền lãi cộng với lợi tức tiện ích), trừ đi chi phí, ký hiệu là 𝜃\nKhi chi phí thực hiện ròng bằng 0, thuật ngữ này (𝛾-𝜃) bằng 0, dẫn đến (𝛾-𝜃)(1+r)T bằng 0. Khi đó, F (T) =\n0\nS (1+r)T .Do đó, giá kỳ hạn của một hàng hóa bằng giá giao ngay của hàng hóa\n0\nđược gộp theo lãi suất phi rủi ro trong suốt thời hạn của hợp đồng khi chi phí vận chuyển ròng bằng 0\nC. Không chính xác vì nếu chi phí vượt quá lợi ích thì giá kỳ hạn sẽ cao hơn vì\nhợp đồng kỳ hạn sẽ tránh được chi phí do phải trả những lợi ích ít hơn. Khi đó, số hạng (𝛾-\n𝜃)(1+r)T sẽ âm. thêm vào S (1+r)T theo số tuyệt đối (do dấu âm trước đó),\n0\ndẫn đến giá kỳ hạn cao hơn giá giao ngay cộng lãi suất phi rủi ro.\nDo đó, giá kỳ hạn của một hàng hóa sẽ lớn hơn giá giao ngay của hàng hóa\nđược gộp theo lãi suất phi rủi ro trong suốt thời hạn của hợp đồng khi chi phí ròng của giá trị thực hiện, (𝛾-𝜃),\nâm, không phải khi nó bằng 0.\nCác công cụ phái sinh: giải thích sự khác biệt giữa giá giao ngay và giá dự kiến trong tương lai của một tài sản cơ sở và\nchi phí nắm giữ liên quan đến việc nắm giữ tài sản cơ bản","qhtml":null},{"n":39,"q":"Long futures contracts are more attractive than long forward positions for the same\nunderlying and maturity when\nfutures prices and interest rates are:","opts":["negatively correlated.","uncorrelated.","positively correlated."],"ans":"C","expl":"A. Không chính xác vì các mô hình dòng tiền khác nhau cho hợp đồng kỳ hạn và hợp đồng tương lai có thể dẫn đến sự khác biệt\ntrong việc định giá hợp đồng kỳ hạn so với hợp đồng tương lai và nếu giá hợp đồng tương lai có mối tương quan dương\nvới lãi suất, hợp đồng tương lai mua sẽ hấp dẫn hơn so với các vị thế mua kỳ hạn đối với cùng một cơ sở và thời gian đáo hạn. Lý do là vì giá tăng dẫn đến lợi nhuận tương lai được\ntái đầu tư trong thời kỳ lãi suất tăng và giá giảm dẫn đến thua lỗ xảy ra trong thời kỳ\nlãi suất giảm nên hợp đồng được mong muốn hơn sẽ có xu hướng có giá cao hơn.\nB. Không chính xác vì các mô hình dòng tiền khác nhau cho hợp đồng kỳ hạn và hợp đồng tương lai có thể dẫn đến sự khác biệt\ntrong việc định giá hợp đồng kỳ hạn so với hợp đồng tương lai và nếu giá hợp đồng tương lai có mối tương quan dương\nvới lãi suất, hợp đồng tương lai mua sẽ hấp dẫn hơn so với các vị thế mua kỳ hạn đối với cùng một cơ sở và thời gian đáo hạn. Lý do là vì giá tăng dẫn đến lợi nhuận tương lai được\ntái đầu tư trong thời kỳ lãi suất tăng và giá giảm dẫn đến thua lỗ xảy ra trong thời kỳ\nlãi suất giảm nên hợp đồng được mong muốn hơn sẽ có xu hướng có giá cao hơn.\nC. Đúng vì các mô hình dòng tiền khác nhau cho hợp đồng kỳ hạn và hợp đồng tương lai có thể dẫn đến sự khác biệt\ntrong việc định giá hợp đồng kỳ hạn so với hợp đồng tương lai và nếu giá hợp đồng tương lai có mối tương quan dương\nvới lãi suất, hợp đồng tương lai mua sẽ hấp dẫn hơn so với các vị thế mua kỳ hạn đối với cùng cơ sở và thời gian đáo hạn. Lý do là vì giá tăng dẫn đến lợi nhuận tương lai được\ntái đầu tư trong thời kỳ lãi suất tăng và giá giảm dẫn đến thua lỗ xảy ra trong thời kỳ\nlãi suất giảm, hợp đồng được mong muốn hơn sẽ có xu hướng có giá cao hơn\nPhiên bản phái sinh: giải thích tại sao giá kỳ hạn và giá tương lai lại khác nhau","qhtml":null},{"n":40,"q":"The differential between forward and futures prices is determined by which of the\nfollowing?","opts":["Interest rate volatility only","The correlation between futures prices and interest rates only","Both interest rate volatility and the correlation between futures prices and interest rates"],"ans":"C","expl":"A. Không chính xác vì sự khác biệt giữa giá kỳ hạn và giá tương lai được xác định bởi cả\nmối tương quan giữa giá tương lai và lãi suất cũng như bởi sự biến động của lãi suất, như được mô tả trong\ncơ sở phản hồi cho câu trả lời đúng.\nB. Không chính xác vì sự khác biệt giữa giá kỳ hạn và giá tương lai được xác định bởi cả\nmối tương quan giữa giá tương lai và lãi suất cũng như bởi sự biến động của lãi suất, như được mô tả trong\ncơ sở phản hồi cho câu trả lời đúng.\nC. Đúng vì các mô hình dòng tiền khác nhau cho hợp đồng kỳ hạn và hợp đồng tương lai có thể dẫn đến sự khác biệt trong việc định giá hợp đồng kỳ hạn so với hợp đồng tương lai. Giá kỳ hạn và giá tương lai giống hệt nhau theo\ncác điều kiện nhất định, cụ thể là: nếu lãi suất không đổi hoặc nếu giá tương lai và lãi suất\nkhông tương quan. Mặt khác, việc vi phạm các giả định này có thể làm phát sinh sự khác biệt về\ngiá giữa hai hợp đồng này. Ví dụ: nếu giá tương lai có tương quan thuận với\nlãi suất, thì hợp đồng tương lai mua sẽ hấp dẫn hơn so với các vị thế mua kỳ hạn đối với cùng\ncơ bản và thời gian đáo hạn. Lý do là vì giá tăng dẫn đến lợi nhuận tương lai\nđược tái đầu tư trong thời kỳ lãi suất tăng và giá giảm dẫn đến thua lỗ xảy ra trong thời kỳ\nlãi suất giảm. Chênh lệch giá cũng sẽ thay đổi theo sự biến động của lãi suất.\nDo đó, sự khác biệt giữa giá kỳ hạn và giá tương lai được xác định bởi cả biến động lãi suất\nvà mối tương quan giữa giá tương lai và lãi suất.\nCông cụ phái sinh: giải thích tại sao giá kỳ hạn và giá tương lai lại khác nhau","qhtml":null},{"n":41,"q":"Q. From the fixed-rate receiver's perspective, if the market reference rate increases, the\nvalue of a swap contract:","opts":["decreases.","stays the same.","increases."],"ans":"A","expl":"A. Đúng vì người nhận lãi suất cố định thanh toán theo tỷ giá tham chiếu thị trường và nhận hoán đổi mệnh giá\nmệnh giá. Nếu tỷ giá tham chiếu thị trường tăng lên, họ sẽ phải trả nhiều tiền hơn và giá trị hợp đồng sẽ tăng lên.\ngiảm dần đối với họ. Một cách giải thích khác về hoán đổi lãi suất là người trả lãi suất cố định\n(người nhận lãi suất thả nổi) mua trái phiếu lãi suất thả nổi (FRN) có giá bằng MIRR và bán trái phiếu lãi suất cố định\ntrái phiếu có lãi suất bằng lãi suất hoán đổi cố định. Tương tự, người nhận lãi suất cố định (lãi suất thả nổi\npavers đang bán một trái phiếu có lãi suất cố định với lãi suất coupon bằng lãi suất hoán đổi và bán khống trái phiếu lãi suất thả nổi\nđược định giá theo MRR Anse, tỷ giá kỳ hạn dự kiến sau khi thành lập sẽ làm tăng giá trị hiện tại của\nthanh toán thả nổi, trong khi tỷ giá hoán đổi cố định sẽ giữ nguyên\nB. Không chính xác vì người nhận lãi suất cố định thanh toán theo tỷ giá tham chiếu thị trường và nhận hợp đồng hoán đổi\nmệnh giá. Nếu tỷ giá tham chiếu thị trường tăng lên, họ sẽ phải trả nhiều tiền hơn và giá trị hợp đồng sẽ tăng lên.\ngiảm dần chứ không giữ nguyên Một cách giải thích khác về hoán đổi lãi suất là\nngười trả lãi suất cố định (người nhận lãi suất thả nổi) mua trái phiếu lãi suất thả nổi (FRN) có giá theo MARR và\nbán khống trái phiếu có lãi suất cố định với lãi suất bằng lãi suất hoán đổi cố định\n(người trả lãi suất thả nổi là mua trái phiếu có lãi suất cố định với ocalpon bằng lãi suất hoán đổi và bán khống\ntrái phiếu lãi suất thả nổi được định giá theo MRR Việc tăng lãi suất kỳ hạn kỳ vọng sau khi thành lập sẽ\ntăng giá trị hiện tại của các khoản thanh toán thả nổi, trong khi bức tường tỷ giá hoán đổi cố định vẫn là biện pháp thứ hai\nC. Không chính xác vì người nhận lãi suất cố định thanh toán theo tỷ giá tham chiếu thị trường và nhận hợp đồng hoán đổi\nmệnh giá. Nếu tỷ giá tham chiếu thị trường tăng lên, họ sẽ phải trả nhiều tiền hơn và giá trị hợp đồng sẽ tăng lên.\nđối với họ giảm chứ không tăng. Một cách giải thích khác về hoán đổi lãi suất là lãi suất cố định\nngười trả lãi suất (người nhận lãi suất thả nổi) mua trái phiếu lãi suất thả nổi (FRN) được định giá theo MRR và bán khống trái phiếu lãi suất thả nổi (FRN)\ntrái phiếu có lãi suất cố định với lãi suất bằng lãi suất hoán đổi giả mạo. Tương tự, người nhận lãi suất cố định\n(người trả lãi suất thả nổi) mua trái phiếu có lãi suất cố định với lãi suất bằng lãi suất hoán đổi và bán khống trái phiếu\nphiếu lãi suất thả nổi có giá bằng MRR. Sự gia tăng tỷ giá kỳ hạn dự kiến sau khi bắt đầu sẽ\ntăng giá trị hiện tại của các khoản thanh toán thả nổi, trong khi tỷ giá hoán đổi hỗn hợp sẽ giữ nguyên.\nCông cụ phái sinh: so sánh giá trị và giá của giao dịch hoán đổi","qhtml":null},{"n":42,"q":"An analyst gathers the following information:\n● The current spot price of crude oil is $120 per barrel.\n● The risk-free rate is 3% with annual compounding.\n● A futures contract has 182 days until settlement.\n● The storage cost is $5 per barrel, payable at the end of the futures contract.\nBased on 365 days per year, the futures price per barrel of crude oil is closest to:","opts":["$126.78.","$126.86.","$126.93."],"ans":"A","expl":"A. Đúng vì giá tương lai của một mặt hàng với lượng chi phí lưu trữ đã biết có thể được\nxác định [dưới dạng ...]: f (T) = [S + PV (C)] × (1+r)T.\n0 0 0\nPV (C)=$5x(1+3%)-182/365\n0\nF (T) = [$120 + $5x(1+3%)-182/365]x(1 + 3%)182/365 = $126 781768 ≈ $126,78\n0\nB. Không chính xác vì nó không chiết khấu chi phí lưu trữ từ ngày thanh toán đến hôm nay để tìm\ngiá trị hiện tại của nó vì giá tương lai của một mặt hàng với số chi phí lưu trữ đã biết có thể được xác định\nnhư sau: f (T) = [S + PV (C)] × (1+r)T .\n0 0 0\nNếu không áp dụng chiết khấu cho chi phí lưu trữ thì điều đó sẽ không chính xác giả định là PV (C) = $5.\n0\nF0(T) = [$120 + $5] × (1+3%) 182/365 = $126,856008≈ $126,86.\nC. Không chính xác vì nó gộp chi phí lưu trữ từ hôm nay đến khi thanh toán thay vì chiết khấu\nđể tìm giá trị hiện tại của nó vì giá tương lai của một mặt hàng với số chi phí lưu trữ đã biết\ncó thể được xác định là: f (T) = [S + PV (C)] × (1+r)T\n0 0 0\nNếu áp dụng tính gộp cho chi phí lưu trữ, nó sẽ được giả định không chính xác là PV (C) = $5 x\n0\n(1+3%)182/365\nf (T) = [$120+ $5] x (1+3%)182/365 x (1+3%)182/365 =$126,931351 ≈$126,93\n0\nCông cụ phái sinh: so sánh giá trị và giá của hợp đồng kỳ hạn và hợp đồng tương lai","qhtml":null},{"n":43,"q":"Most derivatives pricing models are established on the foundation that:","opts":["arbitrage opportunities exist.","only one price for a derivative exists.","the underlying asset price is inferred to determine the derivative price."],"ans":"B","expl":"A. Không chính xác vì nguyên tắc không chênh lệch giá và sao chép có thể được sử dụng để định giá và định giá\ncác sản phẩm phái sinh. Nói cách khác, cơ hội chênh lệch giá có thể được khai thác bằng cách sử dụng công cụ phái sinh, nhưng đối với\nviệc định giá các công cụ phái sinh, điều kiện không có chênh lệch giá được giả định là có, tức là không tồn tại cơ hội chênh lệch giá\n.\nB. Đúng vì luật một giá có thể được sử dụng để định giá chứng khoán phái sinh vì có mối quan hệ một-một giữa chứng khoán phái sinh và tài sản cơ sở của nó khi đáo hạn. Do đó,\nchỉ tồn tại một mức giá cho mỗi công cụ phái sinh.\nC. Không chính xác vì luật một giá có thể được sử dụng để định giá chứng khoán phái sinh vì có mối quan hệ một-một giữa chứng khoán phái sinh và tài sản cơ sở của nó khi đáo hạn. Hơn nữa,\nmô hình nhị thức một kỳ xác định giá trị của đạo hàm bằng cách sử dụng giá cơ sở tại t = 0\nlàm đầu vào cho phép tính. Ví dụ: giá của một quyền chọn mua là \"c = h x S -V₁(1+r)-1,\" trong đó\n0 0\nc là giá trị quyền chọn mua tại t = 0 và S là giá của tài sản cơ sở tại t=0. Do đó, giá của\n0 0\ntài sản cơ bản không được suy ra khi xác định giá phái sinh. Thay vào đó, giá của\ntài sản cơ bản được coi là giá trị nhất định và được sử dụng làm đầu vào trong phép tính.\nCông cụ phái sinh: giải thích cách định giá một công cụ phái sinh bằng mô hình nhị thức một kỳ","qhtml":null},{"n":44,"q":"Q. Which of the following is most accurate regarding a call option replication strategy?","opts":["The strategy requires adjustment over the life of the option contract based on the likelihood of exercise","If the call option is exercised, the strategy requires purchasing the underlying from the proceeds of the loan","At inception, the strategy requires buying long a forward contract on the underlying and borrowing at the risk free rate"],"ans":"A","expl":"A. Đúng vì hồ sơ thanh toán phi tuyến tính của một tùy chọn yêu cầu giao dịch sao chép\nđược điều chỉnh khi khả năng này thay đổi, trong khi các giao dịch sao chép cho một cam kết kỳ hạn\nvẫn không đổi. Ngoài ra, như trong trường hợp quyền chọn mua, hồ sơ thanh toán bất đối xứng yêu cầu\nđiều chỉnh theo thời gian dựa trên khả năng tập thể dục.\nB. Không chính xác vì đây là chiến lược nhân rộng quyền chọn bán nếu được thực hiện. Bản sao tùy chọn cuộc gọi\nchiến lược nếu được thực hiện, yêu cầu bán tài sản cơ sở và sử dụng số tiền thu được để trả khoản vay. theo thứ tự\nđể tái tạo quyền chọn mua khi bắt đầu hợp đồng (t = 0), chúng ta cũng phải vay với lãi suất phi rủi ro, r,\nvà sử dụng số tiền thu được để mua cơ sở ở mức giá S, Khi quyền chọn hết hạn (t = T), không giống như ở\nTrong trường hợp cam kết kỳ hạn, có hai kết quả có thể được nhân rộng:\nBài tập (S >X): Bán tài sản cơ sở cho Stand và sử dụng số tiền thu được để trả X.\nT\nKhông bài tập (S <X): Không cần giải quyết.\nT\nĐể lặp lại quyền chọn bán khi bắt đầu hợp đồng (t = 0), chúng ta phải bán khống cơ sở ở mức giá\ngiá SO và cho vay số tiền thu được với lãi suất phi rủi ro r. Khi quyền chọn hết hạn (t=T), không giống như trong\nTrong trường hợp cam kết chuyển tiếp, có hai kết quả có thể xảy ra trong việc nhân rộng.\nBài tập (S <X): Mua tài sản cơ sở cho ST từ số tiền thu được từ khoản vay không rủi ro.\nT\nKhông bài tập (S > X): Không cần giải quyết.\nT\nC. Không chính xác vì chiến lược nhân rộng quyền chọn mua không yêu cầu mua thời gian dài\nhợp đồng kỳ hạn. Để nhân rộng quyền chọn mua khi bắt đầu hợp đồng (t = 0), chúng ta cũng phải\nvay với lãi suất phi rủi ro r và sử dụng số tiền thu được để mua tài sản cơ sở với mức giá S\n0\nCông cụ phái sinh: đối chiếu việc sử dụng các khái niệm chênh lệch giá và nhân rộng trong các cam kết định giá kỳ hạn\nvà các yêu cầu ngẫu nhiên","qhtml":null},{"n":45,"q":"An analyst collects the following information:\n● Current stock price €26\n● Gross return from an up move 1.10\n● Gross return from a down move 0.75\n● Call and put exercise price €22\nBased on a one-period binomial pricing model, which of the following has the largest payoff?","opts":["Put option following an up move","Put option following a down move","Call option following a down move"],"ans":"B","expl":"A. Không chính xác vì lợi nhuận của quyền chọn bán sau một xu hướng tăng là p u= Max (0,X-S u) trong đó X là\n1 1\ngiá thực hiện và S u là giá sau một xu hướng tăng. Trong trường hợp này, S u = €26(1,10)= €28,60. Vì vậy, p u =\n1 1 1\nMax(0, €22 -€28,60)= €0, nhỏ hơn mức hoàn trả của quyền chọn bán sau một đợt giảm giá, như\nđược mô tả trong phần lý do phản hồi cho câu trả lời đúng.\nB. Đúng vì lợi nhuận của một quyền chọn bán sau một đợt giảm giá là p d= Max (0, X-S d) trong đó X là\n1 1\ngiá thực hiện và S d là giá sau một đợt giảm giá. Trong trường hợp này, S d = €26(0,75)= €19,50. Vì vậy,\n1 1\np₁d= Max (0, €22 - €19,50) = €2,50, lớn hơn số tiền hoàn trả của hai phản hồi còn lại\nC. Không chính xác vì lợi ích của một quyền chọn mua sau một đợt giảm giá là c₁d = Max (0, S d -X)\ntrong đó X là giá thực hiện và S d là giá sau một đợt giảm giá. Trong trường hợp này, S d = €26(0,75)=\n1 1\n€19,50. Vì vậy, c d = Max (0,€19,50 - €22) = €0, nhỏ hơn mức hoàn trả của quyền chọn bán sau một\ndi chuyển xuống, như được mô tả trong cơ sở phản hồi cho câu trả lời đúng.\nĐạo hàm: giải thích cách định giá đạo hàm bằng mô hình nhị thức một kỳ","qhtml":null},{"n":46,"q":"A $10 million interest rate swap with annual payments has a fixed swap rate of 1.95%.\nThe implied forward rates are:\nYear implied Forward Rate (%)\n1 0.50\n2 1.15\n3 1.35\nThe periodic settlement value in Year 3 for the fixed-rate payer is expected to be closest to:","opts":["-$95,000.","-$60,000.","$60,000."],"ans":"B","expl":"A. Không chính xác vì trung bình của 3 giá trị quyết toán hàng năm đầu tiên được sử dụng:\n= (MRR-s ) x Số tiền danh nghĩa x Khoảng thời gian\nN\n≠([0,0050 + 0,0115+0,0135]/3-0,0195) x 10.000.000 USD x 1\n= (0,0100-0,0195) x 10.000.000 USD × 1 = -95.000 USD.\nB. Đúng vì giá trị quyết toán định kỳ = (MRR - s ) x Số tiền danh nghĩa x Kỳ.\nN\ntỷ lệ tham chiếu thị trường (MMR) cho Năm 3 là 1,35%, do đó:\n= (0,0195-0,0135) x 10.000.000 USD x 1 = 60.000 USD.\nC. Không chính xác vì đây là giá trị quyết toán định kỳ cho người trả lãi suất thả nổi, không phải người trả lãi suất cố định\n\n≠ (SN-MRR) x Số tiền danh nghĩa x Kỳ hạn\n= (0,0195-0,0135) x 10.000.000 USD x 1 = 60.000 USD.\nCông cụ phái sinh: so sánh giá trị và giá của các giao dịch hoán đổi","qhtml":null},{"n":47,"q":"Which of the following best describes put-call-forward parity?","opts":["The present value of the exercise price plus the call price equals the put price plus the underlying price. value of the exercise price plus the put price.","The underlying price plus the call price equals the present value of the exercise price plus the put price.","The call price minus the put price equals the present value of the exercise price minus the underlying price."],"ans":"A","expl":"A. Đúng vì giá bán cộng với giá cơ bản bằng giá mua lại cộng với giá trị hiện tại\ncủa giá thực hiện. Được sắp xếp lại như sau: Giá trị hiện tại của giá thực hiện cộng với\ngiá mua bằng giá bán cộng với giá cơ bản.\nB. Không chính xác vì vì, như được mô tả trong phần cơ sở phản hồi cho câu trả lời đúng, lệnh gọi-\nNgang giá kỳ hạn được mô tả như sau: Giá bán cộng với giá cơ sở bằng giá mua lại.\ncộng với giá trị hiện tại của giá thực hiện.\nMô tả bằng lời của phương trình trong lựa chọn trả lời này không chính xác vì nó sắp xếp lại không chính xác\ncác điều khoản của tính chẵn lẻ đặt cuộc gọi chuyển tiếp\nC. Không chính xác vì bởi vì, như được mô tả trong phần cơ sở phản hồi cho câu trả lời đúng, lệnh gọi điện-\ntính chẵn lẻ về phía trước được mô tả như sau. Giá quyền chọn cộng với giá cơ bản bằng giá quyền chọn mua\ncộng với giá trị hiện tại của giá thực hiện.\nMô tả bằng lời của phương trình trong lựa chọn trả lời này không chính xác vì nó sắp xếp lại không chính xác\ncác điều khoản của tính chẵn lẻ đặt-gọi-chuyển tiếp.\nCông cụ phái sinh: giải thích tính chẵn lẻ kỳ hạn của lệnh bán cho các quyền chọn kiểu Châu Âu","qhtml":null},{"n":48,"q":"Consider a put option selling for $2 in which the exercise price is $45. What is the profit\nfor a put buyer if the price of the underlying at expiration is $41?","opts":["-$2","$2","$4"],"ans":"B","expl":"A. Không chính xác vì đây là lợi nhuận của người bán quyền chọn bán. Giá trị quyền chọn bán khi hết hạn = -p =-Max(0,X-S ),\nT T\ntrong đó p, là giá trị quyền chọn bán khi hết hạn, X là giá thực hiện và S, là giá củ
