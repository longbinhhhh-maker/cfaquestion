<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
</style>
</head>
<body>
<header>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Which of the following statements best explains how automatic stabilizers work? Even\nwithout a change in fiscal policy, automatic stabilizers tend to promote:", "opts": ["a budget surplus during a recession and a budget deficit during an inflationary expansion.", "a budget deficit during a recession and a budget surplus during an inflationary expansion.", "a budget deficit during a recession but do not promote a budget surplus during an inflationary expansion."], "ans": "B", "expl": "Automatic stabilizers such as unemployment compensation, corporate profits tax, and the\nprogressive income tax run a deficit during a business slowdown but run a surplus during\nan economic expansion. Therefore, they automatically implement countercyclical fiscal\npolicy without the delays associated with policy changes that require legislative action.\n(Module 14.1, LOS 14.b)"}, {"n": 2, "q": "The time it takes for policy makers to enact a fiscal policy action is best described as:", "opts": ["legislative lag.", "implementation lag.", "action lag."], "ans": "C", "expl": "The time it takes for fiscal policy actions to be proposed, approved, and implemented is\nreferred to as action lag.\n(Module 14.2, LOS 14.d)"}, {"n": 3, "q": "Robert Necco and Nelson Packard are economists at Economic Research Associates. ERA\nasks Necco and Packard for their opinions about the effects of fiscal policy on real GDP for\nan economy currently experiencing a recession. Necco states that real GDP is likely to\nincrease if both government spending and taxes are increased by the same amount. Packard\nstates that if both government spending and taxes are increased by the same amount, there\nis no expected net effect on real GDP.\nAre the statements made by Necco and Packard CORRECT?", "opts": ["Necco: Correct  |  Packard: Incorrect", "Necco: Incorrect  |  Packard: Correct", "Necco: Incorrect  |  Packard: Incorrect"], "ans": "A", "expl": "Necco is correct because the multiplier effect is stronger for government expenditures\nversus government taxes. All of the increase in government spending enters the economy\nas increased expenditure, whereas only a portion of the tax increase results in lessened\nexpenditure (determined by the marginal propensity to consume), because part of the tax\nincrease will come from the savings of the taxpayer (determined by the marginal\npropensity to save). Packard is incorrect; the effect on real GDP of an increase in\ngovernment spending combined with equal increase in taxes will be positive because the\nmultiplier effect is stronger for government spending versus the tax increase.\n(Module 14.2, LOS 14.c)"}, {"n": 4, "q": "Promoting economic growth and price stability are the goals of:", "opts": ["both fiscal and monetary policy.", "fiscal policy, but not monetary policy.", "monetary policy, but not fiscal policy."], "ans": "A", "expl": "Both monetary and fiscal policies are used by policymakers with the goals of maintaining\nstable prices and producing positive economic growth.\n(Module 14.1, LOS 14.a)"}, {"n": 5, "q": "Arguments for being concerned about the size of a fiscal deficit least likely include:", "opts": ["a reduction in long-term economic growth.", "Ricardian equivalence.", "the crowding-out effect."], "ans": "B", "expl": "If Ricardian equivalence holds, private savings will increase in anticipation of the future\ntaxes required by a fiscal deficit. The crowding-out effect of government borrowing on\nprivate investment and the reduction in long-term economic growth due to higher future\ntaxes argue in favor of being concerned about the size of a fiscal deficit.\n(Module 14.1, LOS 14.b)"}, {"n": 6, "q": "A government that is implementing a contractionary fiscal policy is most likely to:", "opts": ["decrease transfer payments to households.", "increase spending on public works.", "decrease income tax rates."], "ans": "A", "expl": "Decreasing spending or increasing taxes are contractionary fiscal policy actions. Increasing\nspending or decreasing taxes are expansionary.\n(Module 14.2, LOS 14.d)"}, {"n": 7, "q": "The crowding-out effect suggests that:", "opts": ["as government spending increases, so will incomes and taxes, and the higher taxes will reduce both aggregate demand and output.", "government borrowing will lead to an increase in private savings.", "greater government deficits will drive up interest rates, thereby reducing private investment."], "ans": "C", "expl": "The crowding-out effect refers to a reduction in private borrowing and investment as a\nresult of higher interest rates generated by budget deficits that are financed by borrowing\nin the private loanable funds market. (Module 14.1, LOS 14.b)"}, {"n": 8, "q": "Attempting to influence economic growth and inflation by changing tax rates and\ngovernment spending is best described as:", "opts": ["fiscal policy.", "a combination of fiscal and monetary policy.", "monetary policy."], "ans": "A", "expl": "Fiscal policy refers to actions by a government to influence economic activity through\nchanges in taxes and government spending.\n(Module 14.1, LOS 14.a)"}, {"n": 9, "q": "When an economy dips into a recession, automatic stabilizers will tend to alter government\nspending and taxation so as to:", "opts": ["reduce interest rates, thus stimulating aggregate demand.", "reduce the budget deficit (or increase the surplus).", "enlarge the budget deficit (or reduce the surplus)."], "ans": "C", "expl": "During a recession unemployment is high, so the government will pay out more in\nunemployment compensation at the exact time that tax receipts from corporations and\nindividuals are low. This will increase the size of the deficit and also maintain aggregate\ndemand during recessionary periods.\n(Module 14.1, LOS 14.b)"}, {"n": 10, "q": "Which of the following statements about achieving proper timing in fiscal policy is least\naccurate?", "opts": ["Improvements in quantitative methods have made the occurrence of recessions or expansions quite predictable.", "Policy errors are inevitable due to unpredictable events.", "There is usually a time lag between when a change in policy is needed and when the need is recognized by policy makers."], "ans": "A", "expl": "One problem in achieving proper timing in fiscal policy is the inability to accurately predict\na recession or expansion.\n(Module 14.2, LOS 14.d)"}, {"n": 11, "q": "The country of Zurkistan is experiencing both high interest rates and high inflation. The\ngovernment passes laws that reduce government spending and increase taxes. It takes\nmany months before interest rates fall and inflation is reduced. This is an example of:", "opts": ["action lag and automatic stabilizers.", "impact lag in discretionary fiscal policy.", "recognition lag in discretionary fiscal policy."], "ans": "B", "expl": "This is an example of discretionary fiscal policy involving impact lag because it takes time\nfor the impact of the change in taxing and spending to be felt throughout the economy.\n(Module 14.2, LOS 14.d)"}, {"n": 12, "q": "Policies used with the goal of maintaining stable prices and producing economic growth\ninclude:", "opts": ["fiscal policy only.", "monetary policy only.", "both fiscal policy and monetary policy."], "ans": "C", "expl": "Both fiscal and monetary policies are used to maintain stable prices and produce\neconomic growth. Fiscal policy does so by mechanisms that involve spending and taxation,\nand monetary policy uses central bank tools to modify the availability of money and credit.\n(Module 14.1, LOS 14.a)"}, {"n": 13, "q": "Assuming the federal government maintains a balanced budget, the most likely effects of a\ntax increase on government expenditures and real GDP are:", "opts": ["Government Expenditures: Decrease  |  Real GDP: Decrease", "Government Expenditures: Increase  |  Real GDP: Decrease", "Government Expenditures: Increase  |  Real GDP: Increase"], "ans": "C", "expl": "The amount of the spending program exactly offsets the amount of the tax increase,\nleaving the budget unaffected (balanced budget). The multiplier effect is stronger for\ngovernment spending versus the tax increase. Therefore, the balanced budget multiplier\nwill be positive. All of the government spending enters the economy as increased\nexpenditure, whereas only a portion of the tax increase results in lessened expenditure\n(determined by the marginal propensity to consume), because part of the tax increase will\ncome from the savings of the taxpayer (determined by the marginal propensity to save).\n(Module 14.2, LOS 14.c)"}, {"n": 14, "q": "Arguments for being concerned with the size of a fiscal deficit relative to GDP least likely\ninclude:", "opts": ["a likely need for higher future taxes.", "higher interest rates due to government borrowing.", "a high proportion of government debt owed to the country’s citizens."], "ans": "C", "expl": "That a government owes its own citizens much of its outstanding debt is an argument\nagainst being concerned about fiscal deficits. Arguments for being concerned about fiscal\ndeficits include the need for higher future taxes and the potential for government\nborrowing to increase interest rates and crowd out private investment. (Module 14.1, LOS\n14.b)"}, {"n": 15, "q": "The government budget deficit of Country M is increasing. At the same time, the government\nbudget surplus of Country N is decreasing. Are the fiscal policies of these countries\nexpansionary or contractionary?", "opts": ["Both are contractionary.", "Both are expansionary.", "One is expansionary and one is contractionary."], "ans": "B", "expl": "Expansionary fiscal policy increases a budget deficit or decreases a budget surplus.\nContractionary fiscal policy decreases a budget deficit or increases a budget surplus.\n(Module 14.2, LOS 14.d)"}, {"n": 16, "q": "When the central bank increases short-term interest rates, its monetary policy is best\ndescribed as:", "opts": ["contractionary.", "expansionary.", "accommodative."], "ans": "A", "expl": "When the central bank increases short-term interest rates, it is attempting to decrease the\ngrowth rate of money and credit in an economy, and policy is said to be contractionary,\nrestrictive, or tight. Accommodative or expansionary monetary policy attempts to increase\nthe growth rate of money and credit (e.g., by decreasing short-term interest rates).\n(Module 14.1, LOS 14.a)"}, {"n": 17, "q": "Discretionary fiscal policy refers to:", "opts": ["buying or selling securities in the open market to influence interest rates.", "active decisions regarding spending and taxing to affect economic growth.", "government spending programs that counteract the business cycle without the intervention of policymakers."], "ans": "B", "expl": "Discretionary fiscal policy, in contrast to automatic stabilizers, refers to active decisions by\nthe government to affect economic growth through changes in government spending and\ntaxation. Buying or selling securities in the open market is an example of monetary policy.\n(Module 14.1, LOS 14.b)"}, {"n": 18, "q": "Unemployment compensation is an example of:", "opts": ["an automatic monetary policy stabilizer.", "an automatic fiscal policy stabilizer.", "a discretionary fiscal policy stabilizer."], "ans": "B", "expl": "Unemployment compensation automatically rises and falls with the business cycle,\ntherefore it is an example of an automatic fiscal policy stabilizer.\n(Module 14.1, LOS 14.b)"}, {"n": 19, "q": "The crowding-out model implies that a:", "opts": ["budget deficit will increase the real interest rate and thereby retard private investment.", "budget surplus will retard aggregate demand and trigger an economic downturn.", "budget deficit will stimulate aggregate demand and trigger a multiplier effect which will lead to inflation."], "ans": "A", "expl": "Increased budget deficits will increase the demand for loanable funds and lead to higher\ninterest rates and thus lower private investment. Crowding-out implies that an increase in\ngovernment spending will choke off private investment and reduce the intended impact of\nfiscal policy changes on aggregate demand.\n(Module 14.1, LOS 14.b)"}, {"n": 20, "q": "Arguments against being concerned about the size of a fiscal deficit include:", "opts": ["higher future taxes.", "Ricardian equivalence.", "the crowding-out effect."], "ans": "B", "expl": "Ricardian equivalence suggests that it does not matter whether a government finances its\nspending with debt or a tax increase because the effect on the total level of demand in the\neconomy is the same. Arguments for being concerned about the size of the fiscal deficit\ninclude the crowding-out effect of government borrowing taking the place of private sector\nborrowing and the negative effects on work incentives and entrepreneurship from higher\nfuture taxes.\n(Module 14.1, LOS 14.b)"}, {"n": 21, "q": "The time it takes for policy makers to determine that the economy requires a fiscal policy\naction is best described as:", "opts": ["action lag.", "impact lag.", "recognition lag."], "ans": "C", "expl": "Recognition lag refers to the time it takes for fiscal policy makers to determine the need\nfor a policy action. Action lag is the time it takes policymakers to discuss, enact, and\nimplement fiscal policy measures. Impact lag is the time it takes for a fiscal policy measure\nto have its effect on the economy.\n(Module 14.2, LOS 14.d)"}, {"n": 22, "q": "Monetary policy is most accurately described as actions that influence economic activity by\nincreasing or decreasing:", "opts": ["the supply of money and credit.", "tax rates on income and consumption.", "currency exchange rates."], "ans": "A", "expl": "Monetary policy attempts to influence economic growth and inflation by increasing or\ndecreasing the money supply and the availability of credit in the economy. Taxes and\ngovernment spending are tools of fiscal policy. Monetary and fiscal policy can both\ninfluence currency exchange rates, but this is not typically their primary goal or tool.\n(Module 14.1, LOS 14.a)"}, {"n": 23, "q": "A distinction between fiscal policy and monetary policy is that fiscal policy:", "opts": ["is typically expansionary, while monetary policy is typically contractionary.", "is aimed at promoting economic growth, while monetary policy is aimed at promoting price stability.", "concerns taxes and government spending, while monetary policy concerns the money supply."], "ans": "C", "expl": "The distinction between fiscal and monetary policy is that a country's government\ndetermines fiscal policy through taxes and spending, but its central bank determines\nmonetary policy by controlling the money supply. Both fiscal and monetary policy can be\nused to promote economic growth and price stability. Either fiscal policy or monetary\npolicy can be expansionary or contractionary.\n(Module 14.1, LOS 14.a)"}, {"n": 24, "q": "The time it takes for a fiscal policy action to affect the economy is best described as:", "opts": ["recognition lag.", "impact lag.", "action lag."], "ans": "B", "expl": "The time it takes for a fiscal policy action, once implemented, to have its effect on the\neconomy is referred to as impact lag. Recognition lag is the time it takes policymakers to\nrealize a fiscal policy response is needed. Action lag is the time it takes policymakers to\ndiscuss, enact, and implement fiscal policy measures.\n(Module 14.2, LOS 14.d)"}, {"n": 25, "q": "Assuming the economy currently is experiencing high inflation, an example of appropriate\ndiscretionary fiscal policy is:", "opts": ["increase the federal funds target rate.", "reduce government expenditures on major government construction projects.", "reduce the money supply."], "ans": "B", "expl": "Discretionary fiscal policy refers to the federal government's decisions regarding\ngovernment spending and taxing. A reduction in government spending on major\ngovernment construction projects is likely to lead to a reduction in aggregate demand and\nless pressure on prices, reducing inflation.\n(Module 14.2, LOS 14.c)"}, {"n": 26, "q": "Policies that can be used as tools for redistribution of wealth and income include:", "opts": ["both fiscal policy and monetary policy.", "fiscal policy only.", "monetary policy only."], "ans": "B", "expl": "Fiscal policy can be used as a tool for redistribution of income and wealth, through a\nvariety of taxation and spending policies.\n(Module 14.1, LOS 14.a)"}, {"n": 27, "q": "An example of a contractionary fiscal policy change is a(n):", "opts": ["increase in a fiscal deficit.", "decrease in a fiscal surplus.", "increase in a fiscal surplus."], "ans": "C", "expl": "An increase in a fiscal surplus or a decrease in a fiscal deficit is contractionary. An increase\nin a fiscal deficit or a decrease in a fiscal surplus is expansionary.\n(Module 14.2, LOS 14.d)"}, {"n": 28, "q": "Which of the following statements best explains the importance of the timing of changes in\ndiscretionary fiscal policy? Changes in discretionary fiscal policy must be timed properly if\nthey are going to:", "opts": ["enable the government to control the money supply.", "exert a stabilizing influence on an economy.", "help the government achieve a balanced budget."], "ans": "B", "expl": "Proper timing of discretional policy is needed to reduce economic instability. If timed\nincorrectly, the fiscal policy change could increase rather than reduce economic instability.\n(Module 14.2, LOS 14.d)"}, {"n": 29, "q": "An argument against being concerned with the size of a fiscal deficit is that a deficit can:", "opts": ["lead to higher future taxes that will increase government revenues.", "aid in increasing GDP and employment if the economy is operating at less than potential GDP.", "cause government borrowing to crowd out private borrowing."], "ans": "B", "expl": "One potential argument against being concerned about the size of fiscal deficits is that a\ndeficit can help increase GDP and employment if output is below potential GDP and the\nspending does not divert capital from productive uses. Higher deficits that lead to\ncrowding out or higher future taxes that result in lower long-term economic growth are\narguments for concern about the size of fiscal deficits.\n(Module 14.1, LOS 14.b)"}, {"n": 30, "q": "The term \"automatic stabilizers\" refers to:", "opts": ["changes in taxes and expenditure programs legislators automatically enact in response to changes the level of economic activity in order to smooth economic cycles.", "increases in transfer payments and decreases in tax revenues that result from an economic contraction without new legislation.", "government expenditures and tax receipts that are required to balance over the course of the business cycle, although they may be out of balance in any single year."], "ans": "B", "expl": "Automatic stabilizers refers the increase (decrease) in transfer payments such as\nunemployment compensation and the decrease (increase) in tax revenue that result from\na decrease (increase) in the level of economic activity. These effects tend to move the fiscal\nbudget toward a deficit when economic activity decreases and toward surplus when\neconomic activity increases, and tend to dampen economic cycles.\n(Module 14.1, LOS 14.b)"}];
const CFG = {"title": "Fiscal Policy", "subtitle": "CFA · Economics · Reading 14 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + (location.pathname.split("/").pop() || CFG.title || "quiz");
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; stem.textContent = q.q;
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  answers[i] = L;
  const card = $("q-"+i);
  card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
  $("opt-"+i+"-"+L).classList.add("sel");
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
</html>
