lly, converting to common stock. The only accounting entry required is transferring amounts from the share-based compensation reserve account to common stock and paid-in capital accounts on the balance sheet.","explhtml":"<p>A is Correct because when restricted stock units (RSUs) vest, settlement occurs automatically, converting to common stock. The only accounting entry required is transferring amounts from the share-based compensation reserve account to common stock and paid-in capital accounts on the balance sheet.<\/p>","qhtml":"<div class=\"pp-topic\">Employee Compensation: Post-Employment and Share-Based<\/div><div class=\"qtext\"><p>When restricted stock units vest, the accounting entries include:<\/p><\/div>","subj":"fsa"},{"n":35,"q":"On the date that stock options are exercised, is the transaction recorded on the statement of cash flows?","opts":["No","Yes, as a decrease to financing activities","Yes, as an increase to financing activities"],"ans":"C","expl":"C is Correct because when options vest, settlement does not occur until the options are exercised, which is at the employee’s discretion and depends on the share price. At settlement, a cash inflow is recorded in financing activities on the statement of cash flows for the number of options exercised multiplied by the strike price.","explhtml":"<p>C is Correct because when options vest, settlement does not occur until the options are exercised, which is at the employee’s discretion and depends on the share price. At settlement, a cash inflow is recorded in financing activities on the statement of cash flows for the number of options exercised multiplied by the strike price.<\/p>","qhtml":"<div class=\"pp-topic\">Employee Compensation: Post-Employment and Share-Based<\/div><div class=\"qtext\"><p>On the date that stock options are exercised, is the transaction recorded on the statement of cash flows?<\/p><\/div>","subj":"fsa"},{"n":36,"q":"An analyst gathers the following information about a company: For use in a discounted cash flow model, the most appropriate estimate of free cash flow per share is closest to:","opts":["$15.99.","$16.58.","$17.30."],"ans":"A","expl":"A is Correct because the model should deduct share-based compensation from free cash flow and use diluted shares. In this case, ($32,340 – $1,147) / 1,951 ≈ $15.99. Since share-based compensation is non-cash, discounted cash flow models used to value companies and their equity do not account for it by default. Accordingly, we need to modify the model to account for the effect of dilution from outstanding but unvested share-based awards and dilution from future share-based awards. Accounting for the first effect is straightforward: use diluted shares outstanding. The most pragmatic method to account for the second effect, dilution from expected future share-based awards, in a discounted cash flow valuation is to deduct share- based compensation from free cash flow.","explhtml":"<p>A is Correct because the model should deduct share-based compensation from free cash flow and use diluted shares. In this case, ($32,340 – $1,147) / 1,951 ≈ $15.99. Since share-based compensation is non-cash, discounted cash flow models used to value companies and their equity do not account for it by default. Accordingly, we need to modify the model to account for the effect of dilution from outstanding but unvested share-based awards and dilution from future share-based awards. Accounting for the first effect is straightforward: use diluted shares outstanding. The most pragmatic method to account for the second effect, dilution from expected future share-based awards, in a discounted cash flow valuation is to deduct share- based compensation from free cash flow.<\/p>","qhtml":"<div class=\"pp-topic\">Employee Compensation: Post-Employment and Share-Based<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp181.webp\" style=\"max-width:min(100%,547px)\" alt=\"\"><p>For use in a discounted cash flow model, the most appropriate estimate of free cash flow per share is closest to:<\/p><\/div>","subj":"fsa"},{"n":37,"q":"An analyst adjusts the dilution impact of future share-based awards on valuation. The most appropriate way to model this impact is to:","opts":["exclude the future awards from valuation until granted and vested.","deduct the expense of future share-based awards from future free cash flows.","decrease the number of shares outstanding by the number of unvested shares awarded when computing diluted EPS."],"ans":"B","expl":"B is Correct because the most pragmatic method to account for the second effect, dilution from expected future share-based awards, in a discounted cash flow valuation is to deduct share-based compensation from free cash flow.","explhtml":"<p>B is Correct because the most pragmatic method to account for the second effect, dilution from expected future share-based awards, in a discounted cash flow valuation is to deduct share-based compensation from free cash flow.<\/p>","qhtml":"<div class=\"pp-topic\">Employee Compensation: Post-Employment and Share-Based<\/div><div class=\"qtext\"><p>An analyst adjusts the dilution impact of future share-based awards on valuation. The most appropriate way to model this impact is to:<\/p><\/div>","subj":"fsa"},{"n":38,"q":"An analyst gathers the following information about a company's defined benefit pension plan: If no plan contributions were made during the financial year, the year-end financial statements recognize:","opts":["an operating expense of £10 million.","an operating cash outflow of £12 million.","other comprehensive income of £14 million."],"ans":"A","expl":"A is Correct because the pension expense has three components, two recognized on the income statement and one recognized in other comprehensive income (OCI). 1.Service costs, recognized as an operating expense on the income statement 2.Net interest expense/income, calculated by multiplying the net pension liability or net pension asset at the beginning of the period by the discount rate. Net interest expense/income is recognized below the operating income line on the income statement, along with other financing costs like interest cost on debt 3.Remeasurements, recognized in OCI, not in earnings. Thus, the amount recognized as an operating expense equals the service costs. Pension expense = Service costs + Net interest expense + Remeasurements Net interest expense = Net pension liability at the beginning of the period × discount rate = 100 × 5% = 5. Rearranging, Service costs = Pension expense – Net interest expense – Remeasurements = 12 – 5 – (–3) = 12 – 5 + 3 = 10.","explhtml":"<p>A is Correct because the pension expense has three components, two recognized on the income statement and one recognized in other comprehensive income (OCI). 1.Service costs, recognized as an operating expense on the income statement 2.Net interest expense/income, calculated by multiplying the net pension liability or net pension asset at the beginning of the period by the discount rate. Net interest expense/income is recognized below the operating income line on the income statement, along with other financing costs like interest cost on debt 3.Remeasurements, recognized in OCI, not in earnings. Thus, the amount recognized as an operating expense equals the service costs. Pension expense = Service costs + Net interest expense + Remeasurements<\/p><p>Net interest expense = Net pension liability at the beginning of the period × discount rate = 100 × 5% = 5. Rearranging, Service costs = Pension expense – Net interest expense – Remeasurements = 12 – 5 – (–3) = 12 – 5 + 3 = 10.<\/p>","qhtml":"<div class=\"pp-topic\">Employee Compensation: Post-Employment and Share-Based<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company&#x27;s defined benefit pension plan:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp182.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>If no plan contributions were made during the financial year, the year-end financial statements recognize:<\/p><\/div>","subj":"fsa"},{"n":39,"q":"When conducting a discounted cash flow valuation of a company that has a defined benefit pension plan, it is most appropriate to:","opts":["add the funded status of an underfunded plan to debt.","subtract the funded status of an overfunded plan from debt.","subtract future service and interest costs from free cash flow."],"ans":"A","expl":"A is Correct because to account for the first impact, analysts apply an asymmetrical treatment of underfunded and overfunded plans. The funded status for an underfunded plan is considered debt in an enterprise value calculation and/or bridge from enterprise value to equity value. An overfunded plan is ignored in valuation.","explhtml":"<p>A is Correct because to account for the first impact, analysts apply an asymmetrical treatment of underfunded and overfunded plans. The funded status for an underfunded plan is considered debt in an enterprise value calculation and/or bridge from enterprise value to equity value. An overfunded plan is ignored in valuation.<\/p>","qhtml":"<div class=\"pp-topic\">Employee Compensation: Post-Employment and Share-Based<\/div><div class=\"qtext\"><p>When conducting a discounted cash flow valuation of a company that has a defined benefit pension plan, it is most appropriate to:<\/p><\/div>","subj":"fsa"},{"n":40,"q":"An analyst is building a financial model for a company. With respect to the company’s defined benefit plans, the analyst should adjust:","opts":["free cash flow by adding back service cost.","free cash flow by subtracting net interest expense.","enterprise value by subtracting the net pension liability."],"ans":"C","expl":"C is Correct because the funded status for an underfunded plan is considered debt in an enterprise value calculation.","explhtml":"<p>C is Correct because the funded status for an underfunded plan is considered debt in an enterprise value calculation.<\/p>","qhtml":"<div class=\"pp-topic\">Employee Compensation: Post-Employment and Share-Based<\/div><div class=\"qtext\"><p>An analyst is building a financial model for a company. With respect to the company’s defined benefit plans, the analyst should adjust:<\/p><\/div>","subj":"fsa"},{"n":41,"q":"An analyst is evaluating the financial reports of three GAAP-compliant companies and makes the following observations: • Company 1's earnings are affected by biased accounting choices. • Company 2's earnings do not provide an adequate level of return. • Company 3's earnings appear to be managed to result in lower earnings volatility. Which company should be considered to offer the highest financial reporting quality?","opts":["Company 1","Company 2","Company 3"],"ans":"B","expl":"B is Correct because the hierarchy of financial reporting quality is: 1.GAAP-compliant, decision useful, sustainable and adequate returns 2.GAAP, decision useful, but unsustainable or inadequate earnings (Company 3.Within GAAP, but biased accounting choices (Company 1) 4.Within GAAP, but \"earnings management\" (Company 3) 5.Non-compliant accounting 6.Fictitious transactions","explhtml":"<p>B is Correct because the hierarchy of financial reporting quality is:<\/p><p>1.GAAP-compliant, decision useful, sustainable and adequate returns 2.GAAP, decision useful, but unsustainable or inadequate earnings (Company 3.Within GAAP, but biased accounting choices (Company 1) 4.Within GAAP, but &quot;earnings management&quot; (Company 3) 5.Non-compliant accounting 6.Fictitious transactions<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Quality of Financial Reports<\/div><div class=\"qtext\"><p>An analyst is evaluating the financial reports of three GAAP-compliant companies and makes the following observations: • Company 1&#x27;s earnings are affected by biased accounting choices. • Company 2&#x27;s earnings do not provide an adequate level of return. • Company 3&#x27;s earnings appear to be managed to result in lower earnings volatility. Which company should be considered to offer the highest financial reporting quality?<\/p><\/div>","subj":"fsa"},{"n":42,"q":"Decisions in financial reporting that increase earnings in the current period and are likely to decrease earnings in subsequent periods are best described as:","opts":["aggressive choices.","conservative choices.","earnings management."],"ans":"A","expl":"A is Correct because choices are deemed to be “aggressive” if they increase the company’s reported performance and financial position in the current period. Aggressive choices may decrease the company’s reported performance and financial position in later periods.","explhtml":"<p>A is Correct because choices are deemed to be “aggressive” if they increase the company’s reported performance and financial position in the current period. Aggressive choices may decrease the company’s reported performance and financial position in later periods.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Quality of Financial Reports<\/div><div class=\"qtext\"><p>Decisions in financial reporting that increase earnings in the current period and are likely to decrease earnings in subsequent periods are best described as:<\/p><\/div>","subj":"fsa"},{"n":43,"q":"Understatement of contingent liabilities is most likely associated in the current period with understated:","opts":["equity.","expenses.","other comprehensive income."],"ans":"B","expl":"B is Correct because following are some examples of choices—accounting choices that comply with GAAP, accounting choices that depart from GAAP, and operating choices—and their effects in the current period. Understatement of contingent liabilities is associated with overstated equity resulting from understated expenses and overstated income or overstated other comprehensive income.","explhtml":"<p>B is Correct because following are some examples of choices—accounting choices that comply with GAAP, accounting choices that depart from GAAP, and operating choices—and their effects in the current period. Understatement of contingent liabilities is associated with overstated equity resulting from understated expenses and overstated income or overstated other comprehensive income.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Quality of Financial Reports<\/div><div class=\"qtext\"><p>Understatement of contingent liabilities is most likely associated in the current period with understated:<\/p><\/div>","subj":"fsa"},{"n":44,"q":"A portfolio manager analyzes a company by taking the following actions: • Action 1: Learn about the company's management • Action 2: Comparing the company’s accounting policies with those of its closest competitors Which of the above actions is useful for evaluating the quality of a company’s financial reports?","opts":["Action 1 only","Action 2 only","Both Action 1 and Action 2"],"ans":"C","expl":"C is Correct because both Action 1 and Action 2 are useful for evaluating the quality of a company's financial reports. General Steps to evaluate the quality of financial reports include learning about management, evaluating whether the company's management has any particular incentive to misreport, and reviewing disclosures about compensation and insider transactions, especially insider sales of the company's stock. When reviewing the disclosures concerning related party transactions, make comparisons by comparing the company’s accounting policies with those of its closest competitors and determine if there are significant differences. If so, determine the directional effect of the differences. Therefore, both Action 1 and Action 2 are useful for evaluating the quality of a company’s financial reports.","explhtml":"<p>C is Correct because both Action 1 and Action 2 are useful for evaluating the quality of a company&#x27;s financial reports. General Steps to evaluate the quality of financial reports include learning about management, evaluating whether the company&#x27;s management has any particular incentive to misreport, and reviewing disclosures about compensation and insider transactions, especially insider sales of the company&#x27;s stock. When reviewing the disclosures concerning related party transactions, make comparisons by comparing the company’s accounting policies with those of its closest competitors and determine if there are significant differences. If so, determine the directional effect of the differences. Therefore, both Action 1 and Action 2 are useful for evaluating the quality of a company’s financial reports.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Quality of Financial Reports<\/div><div class=\"qtext\"><p>A portfolio manager analyzes a company by taking the following actions: • Action 1: Learn about the company&#x27;s management • Action 2: Comparing the company’s accounting policies with those of its closest competitors Which of the above actions is useful for evaluating the quality of a company’s financial reports?<\/p><\/div>","subj":"fsa"},{"n":45,"q":"An analyst gathers the Beneish model M- scores below and uses a −1.78 M-score cutoff. Based on this information, which company has the highest probability of earnings manipulation?","opts":["Company 1","Company 2","Company 3"],"ans":"B","expl":"B is Correct because Company 2's M-score of −1.50 is higher than −1.78. Higher M- scores (i.e., less negative numbers) indicate an increased probability of earnings manipulation. Therefore, using a −1.78 M-score cutoff, Company 2 shows an increased probability of manipulation. Compared to Company 1 and 3, which have M-scores below the cutoff, Company 2 has the highest probability of earnings manipulation.","explhtml":"<p>B is Correct because Company 2&#x27;s M-score of −1.50 is higher than −1.78. Higher M- scores (i.e., less negative numbers) indicate an increased probability of earnings manipulation. Therefore, using a −1.78 M-score cutoff, Company 2 shows an increased probability of manipulation. Compared to Company 1 and 3, which have M-scores below the cutoff, Company 2 has the highest probability of earnings manipulation.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Quality of Financial Reports<\/div><div class=\"qtext\"><p>An analyst gathers the Beneish model M- scores below and uses a −1.78 M-score cutoff.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp183.webp\" style=\"max-width:min(100%,550px)\" alt=\"\"><p>Based on this information, which company has the highest probability of earnings manipulation?<\/p><\/div>","subj":"fsa"},{"n":46,"q":"Which of the following best explains why the predictive power of the Beneish model is declining over time?","opts":["The model using accounting numbers is a partial representation of economic reality","Earnings manipulators are aware of the power of the model to screen possible cases of earnings manipulation","Financial models based on accounting numbers are only capable of establishing associations between variables"],"ans":"B","expl":"B is Correct because earnings manipulators are just as aware as analysts of the power of quantitative models to screen for possible cases of earnings manipulation. The predictive power of the Beneish model is declining over time. Undoubtedly, many managers have learned to test the detectability of earnings manipulation tactics by using the model to anticipate analysts’ perceptions.","explhtml":"<p>B is Correct because earnings manipulators are just as aware as analysts of the power of quantitative models to screen for possible cases of earnings manipulation. The predictive power of the Beneish model is declining over time. Undoubtedly, many managers have learned to test the detectability of earnings manipulation tactics by using the model to anticipate analysts’ perceptions.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Quality of Financial Reports<\/div><div class=\"qtext\"><p>Which of the following best explains why the predictive power of the Beneish model is declining over time?<\/p><\/div>","subj":"fsa"},{"n":47,"q":"Based on the Beneish model M-scores below, which company has the highest probability of earnings manipulation?","opts":["Company X","Company Y","Company Z"],"ans":"C","expl":"C is Correct because higher M-scores (i.e., less negative numbers) indicate an increased probability of earnings manipulation. The probability is given by the amount in the left side of the distribution. Beneish considered that the likely relevant cutoff for investors is a probability of earnings manipulation of 3.8% (an M-score exceeding −1.78). The company with the highest M-score in the current year is Company Z, with an M-score of −1.50. Company X has the lowest M-score at −2.01, and Company Y also has a lower M-score at −1.86. The M-score for Company Z is above the relevant cutoff of −1.78.","explhtml":"<p>C is Correct because higher M-scores (i.e., less negative numbers) indicate an increased probability of earnings manipulation. The probability is given by the amount in the left side of the distribution. Beneish considered that the likely relevant cutoff for investors is a probability of earnings manipulation of 3.8% (an M-score exceeding −1.78). The company with the highest M-score in the current year is Company Z, with an M-score of −1.50. Company X has the lowest M-score at −2.01, and Company Y also has a lower M-score at −1.86. The M-score for Company Z is above the relevant cutoff of −1.78.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Quality of Financial Reports<\/div><div class=\"qtext\"><p>Based on the Beneish model M-scores below, which company has the highest probability of earnings manipulation?<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp184.webp\" style=\"max-width:min(100%,552px)\" alt=\"\"><\/div>","subj":"fsa"},{"n":48,"q":"The only factor expected to give rise to normal accruals in a company’s earnings is the growth in credit sales. If there is no residual when total accruals are regressed on the growth in credit sales, total accruals are most likely equal to:","opts":["zero.","the abnormal accruals.","the non-discretionary accruals."],"ans":"C","expl":"C is Correct because a company’s normal accruals are modeled as a function of economic factors, such as growth in credit sales and the amount of depreciable assets. Growth in credit sales would be expected to result in accounts receivable growth, and depreciable assets would be associated with the amount of depreciation. To apply this approach, total accruals are regressed on the factors expected to give rise to normal accruals, and the residual of the regression would be considered a proxy for abnormal accruals. If the residual of the regression is zero, the total accruals would equal the normal accruals (also called “non-discretionary” accruals). An important distinction is between accruals that arise from normal transactions in the period (called “non-discretionary”) and accruals that result from transactions or accounting choices outside the normal, which are possibly made with the intent to distort reported earnings (called “discretionary accruals”).","explhtml":"<p>C is Correct because a company’s normal accruals are modeled as a function of economic factors, such as growth in credit sales and the amount of depreciable assets. Growth in credit sales would be expected to result in accounts receivable growth, and depreciable assets would be associated with the amount of depreciation. To apply this approach, total accruals are regressed on the factors expected to give rise to normal accruals, and the residual of the regression would be considered a proxy for abnormal accruals. If the residual of the regression is zero, the total accruals would equal the normal accruals (also called “non-discretionary” accruals). An important distinction is between accruals that arise from normal transactions in the period (called “non-discretionary”) and accruals that result from transactions or accounting choices outside the normal, which are possibly made with the intent to distort reported earnings (called “discretionary accruals”).<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Quality of Financial Reports<\/div><div class=\"qtext\"><p>The only factor expected to give rise to normal accruals in a company’s earnings is the growth in credit sales. If there is no residual when total accruals are regressed on the growth in credit sales, total accruals are most likely equal to:<\/p><\/div>","subj":"fsa"},{"n":49,"q":"An analyst assesses the earnings of three companies using a regression model, Earningst+1 = α + β1 × Earningst + ε. The analyst determines the following parameters: The company showing the highest earnings persistence is most likely:","opts":["Company 1.","Company 2.","Company 3."],"ans":"A","expl":"A is Correct because persistence can be expressed as the coefficient on current earnings in a simple model: Earningst+1 = α + β1Earningst + ε A higher coefficient (β1) represents more persistent earnings. Company 1 has the highest β1 (0.8) among the 3 companies thus showing the highest earnings persistence.","explhtml":"<p>A is Correct because persistence can be expressed as the coefficient on current earnings in a simple model: Earningst+1 = α + β1Earningst + ε A higher coefficient (β1) represents more persistent earnings. Company 1 has the highest β1 (0.8) among the 3 companies thus showing the highest earnings persistence.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Quality of Financial Reports<\/div><div class=\"qtext\"><p>An analyst assesses the earnings of three companies using a regression model, Earningst+1 = α + β1 × Earningst + ε. The analyst determines the following parameters:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp185.webp\" style=\"max-width:min(100%,552px)\" alt=\"\"><p>The company showing the highest earnings persistence is most likely:<\/p><\/div>","subj":"fsa"},{"n":50,"q":"Which of the following is considered as an after-the-fact confirmation of poor earnings quality?","opts":["Restatements related to earnings management only","Enforcement actions related to earnings management only","Both restatements and enforcement actions related to earnings management"],"ans":"C","expl":"C is Correct because enforcement actions and restatements are after-the-fact confirmations of poor-quality earnings. From an analyst’s perspective, after-the-fact evidence of earnings management is not particularly useful for anticipating issues with earnings quality.","explhtml":"<p>C is Correct because enforcement actions and restatements are after-the-fact confirmations of poor-quality earnings. From an analyst’s perspective, after-the-fact evidence of earnings management is not particularly useful for anticipating issues with earnings quality.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Quality of Financial Reports<\/div><div class=\"qtext\"><p>Which of the following is considered as an after-the-fact confirmation of poor earnings quality?<\/p><\/div>","subj":"fsa"},{"n":51,"q":"An analyst gathers the following information about a company: The company’s recurring or core pretax earnings is:","opts":["$2.5 billion.","$3.0 billion.","$3.5 billion."],"ans":"B","expl":"B is Correct because recurring or core pre-tax earnings would be $3.0 billion, which is calculated as follows: Profit before tax + non-recurring expenses = $2.0 billion + acquisitions and divestiture expenses + restructuring expenses = $2.0 billion + $0.6 billion + $0.4 billion = $3.0 billion","explhtml":"<p>B is Correct because recurring or core pre-tax earnings would be $3.0 billion, which is calculated as follows: Profit before tax + non-recurring expenses = $2.0 billion + acquisitions and divestiture expenses + restructuring expenses = $2.0 billion + $0.6 billion + $0.4 billion = $3.0 billion<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Quality of Financial Reports<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp186.webp\" style=\"max-width:min(100%,555px)\" alt=\"\"><p>The company’s recurring or core pretax earnings is:<\/p><\/div>","subj":"fsa"},{"n":52,"q":"Earnings most likely show the fastest reversion to the mean if:","opts":["earnings have a significant accruals component and the accrual elements are normal.","earnings have a significant accruals component and the accrual elements are outliers.","earnings are dominated by the cash flow component and the accruals component is insignificant."],"ans":"B","expl":"B is Correct because if earnings have a significant accruals component, it may hasten the earnings’ reversion to the mean, even more so when the accrual elements are outliers relative to the normal amount of accruals in a company’s earnings.","explhtml":"<p>B is Correct because if earnings have a significant accruals component, it may hasten the earnings’ reversion to the mean, even more so when the accrual elements are outliers relative to the normal amount of accruals in a company’s earnings.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Quality of Financial Reports<\/div><div class=\"qtext\"><p>Earnings most likely show the fastest reversion to the mean if:<\/p><\/div>","subj":"fsa"},{"n":53,"q":"Which of the following practices involve inappropriate transfers of resources between public companies and private entities owned by their managers?","opts":["Propping only","Tunneling only","Both propping and tunnelling"],"ans":"C","expl":"C is Correct because both propping and tunnelling are practices involving inappropriate transfer of resources between public companies and private entities owned by their managers. The manager-owned entity could transfer resources to the public company to ensure its economic viability and thus preserve the option to misappropriate or to participate in profits in the future. These practices are often referred to as propping. Dealings between a public company and the manager-owned entity might take place at prices that are unfavorable for the public company in order to transfer wealth from the public company to the manager-owned entity. These practices are often referred to as tunneling.","explhtml":"<p>C is Correct because both propping and tunnelling are practices involving inappropriate transfer of resources between public companies and private entities owned by their managers. The manager-owned entity could transfer resources to the public company to ensure its economic viability and thus preserve the option to misappropriate or to participate in profits in the future. These practices are often referred to as propping. Dealings between a public company and the manager-owned entity might take place at prices that are unfavorable for the public company in order to transfer wealth from the public company to the manager-owned entity. These practices are often referred to as tunneling.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Quality of Financial Reports<\/div><div class=\"qtext\"><p>Which of the following practices involve inappropriate transfers of resources between public companies and private entities owned by their managers?<\/p><\/div>","subj":"fsa"},{"n":54,"q":"An analyst gathers the following information about a company's software sales in the beginning of the most recent year: What is the most appropriate revenue to be recognized in the most recent year?","opts":["$3.6 million","$4.4 million","$6.0 million"],"ans":"B","expl":"B is Correct because for multiple-deliverable arrangements, product revenue is usually recognized immediately whereas service revenue is recognized as the services are provided. Following the principle, the calculation for the year of sale is: Software license component + Support service component / Contract period = $3.6 million + $2.4 million / 3 years = $3.6 million + $0.8 million = $4.4 million For multiple-deliverable arrangements, recognition of revenue on a software delivery is only permitted if the software sale could be separated from the service portion of the contract.","explhtml":"<p>B is Correct because for multiple-deliverable arrangements, product revenue is usually recognized immediately whereas service revenue is recognized as the services are provided. Following the principle, the calculation for the year of sale is: Software license component + Support service component / Contract period = $3.6 million + $2.4 million / 3 years = $3.6 million + $0.8 million = $4.4 million For multiple-deliverable arrangements, recognition of revenue on a software delivery is only permitted if the software sale could be separated from the service portion of the contract.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Quality of Financial Reports<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company&#x27;s software sales in the beginning of the most recent year:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp187.webp\" style=\"max-width:min(100%,556px)\" alt=\"\"><p>What is the most appropriate revenue to be recognized in the most recent year?<\/p><\/div>","subj":"fsa"},{"n":55,"q":"An analyst gathers information about two companies to assess the quality of their cash flow: Which company shows a potentially poor reporting quality?","opts":["Company 1 only","Company 2 only","Both Company 1 and Company 2"],"ans":"B","expl":"B is Correct because Company 2 shows evidence of potential earnings manipulation which is a misrepresentation of reality and thus an example of poor reporting quality. Cash flow can be described as low quality either because the reported information correctly represents bad economic performance (poor results quality) or because the reported information misrepresents economic reality (poor reporting quality). Large differences between earnings and operating cash flow or increases in such differences can be an indication of earnings manipulation.","explhtml":"<p>B is Correct because Company 2 shows evidence of potential earnings manipulation which is a misrepresentation of reality and thus an example of poor reporting quality. Cash flow can be described as low quality either because the reported information correctly represents bad economic performance (poor results quality) or because the reported information misrepresents economic reality (poor reporting quality). Large differences between earnings and operating cash flow or increases in such differences can be an indication of earnings manipulation.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Quality of Financial Reports<\/div><div class=\"qtext\"><p>An analyst gathers information about two companies to assess the quality of their cash flow:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp188.webp\" style=\"max-width:min(100%,721px)\" alt=\"\"><p>Which company shows a potentially poor reporting quality?<\/p><\/div>","subj":"fsa"},{"n":56,"q":"Management can choose to inflate operating cash flows by:","opts":["decreasing accrued expenses.","decreasing accounts receivable.","reclassifying interest paid from financing to operating."],"ans":"B","expl":"B is Correct because quality issues with cash flow reporting can exist. One issue that arises with regard to cash flow reporting quality is timing. For example, by selling receivables to a third party (decreasing accounts receivable) and/or by delaying paying its payables, a company can boost operating cash flow. Thus, an analyst can potentially detect management choices to decrease current assets or increase current liabilities, choices that will increase operating cash flow, by looking at asset utilization (activity) ratios, changes in balance sheet accounts, and disclosures in notes to the financial statements.","explhtml":"<p>B is Correct because quality issues with cash flow reporting can exist. One issue that arises with regard to cash flow reporting quality is timing. For example, by selling receivables to a third party (decreasing accounts receivable) and/or by delaying paying its payables, a company can boost operating cash flow. Thus, an analyst can potentially detect management choices to decrease current assets or increase current liabilities, choices that will increase operating cash flow, by looking at asset utilization (activity) ratios, changes in balance sheet accounts, and disclosures in notes to the financial statements.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Quality of Financial Reports<\/div><div class=\"qtext\"><p>Management can choose to inflate operating cash flows by:<\/p><\/div>","subj":"fsa"},{"n":57,"q":"Which of the following reclassifications is most likely to increase the operating cash flows of a company reporting under IFRS? • Reclassification 1: Reclassifying interest received from operating to investing • Reclassification 2: Reclassifying interest paid from operating to financing","opts":["Reclassification 1 only","Reclassification 2 only","Both Reclassification 1 and Reclassification 2"],"ans":"B","expl":"B is Correct because if an IFRS-reporting company that changed its classification of interest paid from operating to financing, the company’s operating cash flow would appear higher than the prior period even if no other activities occurred in the period.","explhtml":"<p>B is Correct because if an IFRS-reporting company that changed its classification of interest paid from operating to financing, the company’s operating cash flow would appear higher than the prior period even if no other activities occurred in the period.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Quality of Financial Reports<\/div><div class=\"qtext\"><p>Which of the following reclassifications is most likely to increase the operating cash flows of a company reporting under IFRS? • Reclassification 1: Reclassifying interest received from operating to investing • Reclassification 2: Reclassifying interest paid from operating to financing<\/p><\/div>","subj":"fsa"},{"n":58,"q":"Which of the following is most likely to positively affect operating cash flows?","opts":["Increasing days of payables only","Increasing days sales outstanding only","Both increasing days of payables and increasing days sales outstanding"],"ans":"A","expl":"A is Correct because by delaying paying its payables, a company can boost operating cash flow (OCF). An increase in such activities would be reflected as an increase in the company’s days of payables.","explhtml":"<p>A is Correct because by delaying paying its payables, a company can boost operating cash flow (OCF). An increase in such activities would be reflected as an increase in the company’s days of payables.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Quality of Financial Reports<\/div><div class=\"qtext\"><p>Which of the following is most likely to positively affect operating cash flows?<\/p><\/div>","subj":"fsa"},{"n":59,"q":"A company understating the valuation allowance for deferred tax assets:","opts":["overstates both tax expenses and the value of the deferred tax assets.","overstates tax expenses and understates the value of the deferred tax assets.","understates tax expenses and overstates the value of the deferred tax assets."],"ans":"C","expl":"C is Correct because the understatement of valuation allowance for deferred tax assets would understate tax expenses and overstate the value of the assets on the balance sheet.","explhtml":"<p>C is Correct because the understatement of valuation allowance for deferred tax assets would understate tax expenses and overstate the value of the assets on the balance sheet.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Quality of Financial Reports<\/div><div class=\"qtext\"><p>A company understating the valuation allowance for deferred tax assets:<\/p><\/div>","subj":"fsa"},{"n":60,"q":"An analyst gathers the following information about a take-or-pay contract disclosed by a company in the notes to its financial statements: To properly reflect the company's leverage, using constructive capitalization, the analyst should adjust the company's reported financial statements by:","opts":["adding €8,000,000 to the assets and adding €8,000,000 to the liabilities.","adding €10,000,000 to the assets and adding €10,000,000 to the liabilities.","adding €8,000,000 to the assets, adding €10,000,000 to the liabilities and subtracting €2,000,000 from equity."],"ans":"A","expl":"A is Correct because one common source of off-balance-sheet obligation is purchase contracts, which may be structured as take-or-pay contracts. Analysts typically adjust reported financial statement information by constructively capitalizing, where material, purchase obligations. Constructive capitalization means that the analyst estimates the amount of the obligation as the present value of future purchase obligation payments and then adds the amount of the obligation to the company’s reported assets and liabilities. In this case, the analyst should add €8,000,000 to the company’s reported assets and liabilities.","explhtml":"<p>A is Correct because one common source of off-balance-sheet obligation is purchase contracts, which may be structured as take-or-pay contracts. Analysts typically adjust reported financial statement information by constructively capitalizing, where material, purchase obligations. Constructive capitalization means that the analyst estimates the amount of the obligation as the present value of future purchase obligation payments and then adds the amount of the obligation to the company’s reported assets and liabilities. In this case, the analyst should add €8,000,000 to the company’s reported assets and liabilities.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Quality of Financial Reports<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a take-or-pay contract disclosed by a company in the notes to its financial statements:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp189.webp\" style=\"max-width:min(100%,556px)\" alt=\"\"><p>To properly reflect the company&#x27;s leverage, using constructive capitalization, the analyst should adjust the company&#x27;s reported financial statements by:<\/p><\/div>","subj":"fsa"},{"n":61,"q":"A company has a substantial portion of its assets valued using non-observable inputs. Which of the following aspects of financial reporting quality is most likely to be adversely impacted?","opts":["Completeness","Clear presentation","Unbiased measurement"],"ans":"C","expl":"C is Correct because an important aspect of financial reporting quality for the balance sheet is unbiased measurement. The balance sheet of a company with a substantial portion of its assets valued using non-observable inputs likely warrants closer scrutiny.","explhtml":"<p>C is Correct because an important aspect of financial reporting quality for the balance sheet is unbiased measurement. The balance sheet of a company with a substantial portion of its assets valued using non-observable inputs likely warrants closer scrutiny.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Quality of Financial Reports<\/div><div class=\"qtext\"><p>A company has a substantial portion of its assets valued using non-observable inputs. Which of the following aspects of financial reporting quality is most likely to be adversely impacted?<\/p><\/div>","subj":"fsa"},{"n":62,"q":"Which of the following bankruptcy prediction models best addresses the issue of the going-concern assumption in using historical financial statements?","opts":["Hazard models","Market-based models","Accounting-based models"],"ans":"B","expl":"B is Correct because another shortcoming of the Altman model, and other accounting- based bankruptcy prediction models, is that financial statements measure past performance and incorporate the going-concern assumption. The reported values on a company’s balance sheet assume that the company is a going concern rather than one that might be failing. An alternative is to use market-based bankruptcy prediction models.","explhtml":"<p>B is Correct because another shortcoming of the Altman model, and other accounting- based bankruptcy prediction models, is that financial statements measure past performance and incorporate the going-concern assumption. The reported values on a company’s balance sheet assume that the company is a going concern rather than one that might be failing. An alternative is to use market-based bankruptcy prediction models.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Quality of Financial Reports<\/div><div class=\"qtext\"><p>Which of the following bankruptcy prediction models best addresses the issue of the going-concern assumption in using historical financial statements?<\/p><\/div>","subj":"fsa"},{"n":63,"q":"Based on the Altman model Z-scores below, which company is most likely to have the highest probability of bankruptcy?","opts":["Company A","Company B","Company C"],"ans":"A","expl":"A is Correct because the interpretation of the score is that a higher Z-score is better. In Altman’s application of the model, scores of less than 1.81 indicated a high probability of bankruptcy, scores greater than 3.00 indicated a low probability of bankruptcy, and scores between 1.81 and 3.00 were not clear indicators. The company with the lowest Z-score in the current year is Company A, with a Z-score of 1.6. Company C has the highest Z-score at 3.2, and Company B also has a higher Z-score at 2.4. The Z-score for Company A is below the relevant cutoff of 1.81 which indicates a high probability of bankruptcy.","explhtml":"<p>A is Correct because the interpretation of the score is that a higher Z-score is better. In Altman’s application of the model, scores of less than 1.81 indicated a high probability of bankruptcy, scores greater than 3.00 indicated a low probability of bankruptcy, and scores between 1.81 and 3.00 were not clear indicators. The company with the lowest Z-score in the current year is Company A, with a Z-score of 1.6. Company C has the highest Z-score at 3.2, and Company B also has a higher Z-score at 2.4. The Z-score for Company A is below the relevant cutoff of 1.81 which indicates a high probability of bankruptcy.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Quality of Financial Reports<\/div><div class=\"qtext\"><p>Based on the Altman model Z-scores below, which company is most likely to have the highest probability of bankruptcy?<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp190.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><\/div>","subj":"fsa"},{"n":64,"q":"An analyst gathers the following information about three companies: Possible reporting problems are least likely signaled in relation to:","opts":["Company 1.","Company 2.","Company 3."],"ans":"C","expl":"C is Correct because as long as mandatory rotation rules are complied with, maintaining the same auditor is not a red flag by itself but the other way around a change in the auditor (especially multiple changes in the auditor) can signal possible reporting problems.","explhtml":"<p>C is Correct because as long as mandatory rotation rules are complied with, maintaining the same auditor is not a red flag by itself but the other way around a change in the auditor (especially multiple changes in the auditor) can signal possible reporting problems.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Quality of Financial Reports<\/div><div class=\"qtext\"><p>An analyst gathers the following information about three companies:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp191.webp\" style=\"max-width:min(100%,684px)\" alt=\"\"><p>Possible reporting problems are least likely signaled in relation to:<\/p><\/div>","subj":"fsa"},{"n":65,"q":"An analyst makes the following statements about disadvantages of using the audit opinion as a source of information about reporting risk: Statement 1: The audit opinion is unlikely to provide timely information Statement 2: Internal controls over financial reporting are out of scope of audit opinions Which of the above statements is most accurate?","opts":["Statement 1 only","Statement 2 only","Both Statement 1 and Statement 2"],"ans":"A","expl":"A is Correct because an audit opinion(s) covering financial statements (and internal controls over financial reporting, where required) can provide some information about reporting risk. However, the content of an audit opinion is unlikely to be a timely source of information about risk.","explhtml":"<p>A is Correct because an audit opinion(s) covering financial statements (and internal controls over financial reporting, where required) can provide some information about reporting risk. However, the content of an audit opinion is unlikely to be a timely source of information about risk.<\/p>","qhtml":"<div class=\"pp-topic\">Evaluating Quality of Financial Reports<\/div><div class=\"qtext\"><p>An analyst makes the following statements about disadvantages of using the audit opinion as a source of information about reporting risk: Statement 1: The audit opinion is unlikely to provide timely information Statement 2: Internal controls over financial reporting are out of scope of audit opinions Which of the above statements is most accurate?<\/p><\/div>","subj":"fsa"},{"n":66,"q":"An analyst gathers the following information about a company: Which of the company's accruals ratios have improved?","opts":["Cash flow accruals ratio only","Balance sheet accruals ratio only","Both the cash flow accruals ratio and the balance sheet accruals ratio"],"ans":"A","expl":"A is Correct because when examining accruals ratios, it would be a concern if the absolute levels of the accruals ratio were high and if they were consistently trending higher. The cash flow accruals ratio improved from –6.7% to –1.4% with a lower absolute value, while the balance sheet accruals ratio deteriorated from 1.3% to 9.8% with a higher absolute value.","explhtml":"<p>A is Correct because when examining accruals ratios, it would be a concern if the absolute levels of the accruals ratio were high and if they were consistently trending higher. The cash flow accruals ratio improved from –6.7% to –1.4% with a lower absolute value, while the balance sheet accruals ratio deteriorated from 1.3% to 9.8% with a higher absolute value.<\/p>","qhtml":"<div class=\"pp-topic\">Integration of Financial Statement Analysis Techniques<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp192.webp\" style=\"max-width:min(100%,563px)\" alt=\"\"><p>Which of the company&#x27;s accruals ratios have improved?<\/p><\/div>","subj":"fsa"},{"n":67,"q":"An analyst gathers the following information (in € thousands) about a company: Which of the following is the most appropriate measure of profit generated by the company's own asset base?","opts":["8,994","9,979","10,792"],"ans":"A","expl":"A is Correct because it exclude income from associates and joint ventures only, i.e., €15,080 – €6,086 = €8,994. The necessary modifications to the reported financial data to isolate these effects includes subtracting income from associates from the net income (profit for the year) gives the profits generated by its own asset base. With this information, the analyst can assess the profitability and returns of the largest and most relevant part of the entire entity: the core company. The provisions and impairment charges should not be excluded, as provisions and impairment charges involve decisions by management, they recur regularly, and they affect the returns to shareholders. In assessing the company’s prospects. These charges are important variables that should not to be ignored. Subtracting income from associates from the net income (profit for the year) gives the profits generated by Nestlé’s own asset base.","explhtml":"<p>A is Correct because it exclude income from associates and joint ventures only, i.e., €15,080 – €6,086 = €8,994. The necessary modifications to the reported financial data to isolate these effects includes subtracting income from associates from the net income (profit for the year) gives the profits generated by its own asset base. With this information, the analyst can assess the profitability and returns of the largest and most relevant part of the entire entity: the core company. The provisions and impairment charges should not be excluded, as provisions and impairment charges involve decisions by management, they recur regularly, and they affect the returns to shareholders. In assessing the company’s prospects. These charges are important variables that should not to be ignored. Subtracting income from associates from the net income (profit for the year) gives the profits generated by Nestlé’s own asset base.<\/p>","qhtml":"<div class=\"pp-topic\">Integration of Financial Statement Analysis Techniques<\/div><div class=\"qtext\"><p>An analyst gathers the following information (in € thousands) about a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp193.webp\" style=\"max-width:min(100%,552px)\" alt=\"\"><p>Which of the following is the most appropriate measure of profit generated by the company&#x27;s own asset base?<\/p><\/div>","subj":"fsa"},{"n":68,"q":"An analyst gathers the following information about a company (in € millions): When adjusting financial statements to analyze the performance of core operations, the best practice is to use a profit before taxes (in € millions) of:","opts":["26.","38.","88."],"ans":"A","expl":"A is Correct because unlike the core operations and resources, the returns earned by associates are not under the direct control of management. To avoid making incorrect inferences about the profitability of operations, the analyst wants to remove the effects of the investments in associates from the balance sheet and income statement. In this case, the best measure of performance of operations is determined by adjusting the profit before taxes with the income from associates and joint ventures = Profit before taxes – Income from associates and joint ventures = 76 – 50 = 26 (also equal to the Profit before taxes, associates, and joint ventures).","explhtml":"<p>A is Correct because unlike the core operations and resources, the returns earned by associates are not under the direct control of management. To avoid making incorrect inferences about the profitability of operations, the analyst wants to remove the effects of the investments in associates from the balance sheet and income statement. In this case, the best measure of performance of operations is determined by adjusting the profit before taxes with the income from associates and joint ventures = Profit before taxes – Income from associates and joint ventures = 76 – 50 = 26 (also equal to the Profit before taxes, associates, and joint ventures).<\/p>","qhtml":"<div class=\"pp-topic\">Integration of Financial Statement Analysis Techniques<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company (in € millions):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp194.webp\" style=\"max-width:min(100%,585px)\" alt=\"\"><p>When adjusting financial statements to analyze the performance of core operations, the best practice is to use a profit before taxes (in € millions) of:<\/p><\/div>","subj":"fsa"},{"n":69,"q":"An analyst gathers the following information about a company's financial reporting quality: Which of the above ratios shows an improvement?","opts":["Cash-flow-based accruals ratio only","Balance-sheet-based accruals ratio only","Both cash-flow-based accruals and balance-sheet-based accruals ratios"],"ans":"C","expl":"C is Correct because both balance-sheet-based and cash-flow-based accruals are insignificant and they are improving in absolute levels from 3% in the prior year to 1% in the current year. The cash-flow-based accruals are negative and increasing but it is their absolute level that is relevant in this case. It would be a concern if the absolute levels of the accruals ratio were high; even more worrisome would have been if they were consistently trending higher which is not the case here.","explhtml":"<p>C is Correct because both balance-sheet-based and cash-flow-based accruals are insignificant and they are improving in absolute levels from 3% in the prior year to 1% in the current year. The cash-flow-based accruals are negative and increasing but it is their absolute level that is relevant in this case. It would be a concern if the absolute levels of the accruals ratio were high; even more worrisome would have been if they were consistently trending higher which is not the case here.<\/p>","qhtml":"<div class=\"pp-topic\">Integration of Financial Statement Analysis Techniques<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company&#x27;s financial reporting quality:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp195.webp\" style=\"max-width:min(100%,555px)\" alt=\"\"><p>Which of the above ratios shows an improvement?<\/p><\/div>","subj":"fsa"},{"n":70,"q":"An analyst gathers the following information (in € thousands) about a company: The company's cash flow accruals ratio is closest to:","opts":["0.5%.","2.2%.","4.0%."],"ans":"C","expl":"C is Correct because this is the correct calculation for the cash flow accruals ratio. Cash flow accruals ratio for time t = [NIt − (CFOt + CFIt)] / [(NOAt + NOAt−1)/2] where [NOA is net operating assets,] NI is net income, CFO is cash flow from operations, and CFI is cash flow from investing. Cash flow accruals ratio for time t = [NIt − (CFOt + CFIt)] / [(NOAt + NOAt−1)/2] = [15,200 − (14,800 – 2,900)] / 82,500 = 3,300 / 82,500 = 4%","explhtml":"<p>C is Correct because this is the correct calculation for the cash flow accruals ratio. Cash flow accruals ratio for time t = [NIt − (CFOt + CFIt)] / [(NOAt + NOAt−1)/2] where [NOA is net operating assets,] NI is net income, CFO is cash flow from operations, and CFI is cash flow from investing. Cash flow accruals ratio for time t = [NIt − (CFOt + CFIt)] / [(NOAt + NOAt−1)/2] = [15,200 − (14,800 – 2,900)] / 82,500 = 3,300 / 82,500 = 4%<\/p>","qhtml":"<div class=\"pp-topic\">Integration of Financial Statement Analysis Techniques<\/div><div class=\"qtext\"><p>An analyst gathers the following information (in € thousands) about a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp196.webp\" style=\"max-width:min(100%,550px)\" alt=\"\"><p>The company&#x27;s cash flow accruals ratio is closest to:<\/p><\/div>","subj":"fsa"},{"n":71,"q":"An analyst gathers the following information (in € millions) about a company: The company's balance sheet accruals ratio for the most recent year is closest to:","opts":["9.0%.","9.5%.","10.0%."],"ans":"C","expl":"C is Correct because this is the correct calculation for the balance sheet accruals ratio. Balance sheet accruals ratio for time t = (NOAt − NOAt −1) / [(NOAt + NOAt−1) / 2] where NOA is Net Operating Assets. = (84 − 76) / [(84 + 76) / 2] = 8 / 80 =10%","explhtml":"<p>C is Correct because this is the correct calculation for the balance sheet accruals ratio. Balance sheet accruals ratio for time t = (NOAt − NOAt −1) / [(NOAt + NOAt−1) / 2] where NOA is Net Operating Assets. = (84 − 76) / [(84 + 76) / 2] = 8 / 80 =10%<\/p>","qhtml":"<div class=\"pp-topic\">Integration of Financial Statement Analysis Techniques<\/div><div class=\"qtext\"><p>An analyst gathers the following information (in € millions) about a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp197.webp\" style=\"max-width:min(100%,555px)\" alt=\"\"><p>The company&#x27;s balance sheet accruals ratio for the most recent year is closest to:<\/p><\/div>","subj":"fsa"},{"n":72,"q":"An analyst gathers the following information about a company (in € millions): The adjusted profit before tax that best reflects the company's core performance (in € millions) is:","opts":["20.","24.","27."],"ans":"B","expl":"B is Correct because the analyst is interested in the ongoing operations of the company unaffected by non-repeating types of gains or losses (such as One-off income from associates and joint ventures and One-off revaluation loss). Accordingly, the Adjusted profit before tax of core operations = Profit before tax – One-off income from associates and joint ventures + One- off revaluation loss = 30 – 10 + 4 = 24. Recurring yearly provisions for restructuring activities are already reflected in Profit before tax and no adjustment is needed. Provisions involve decisions by management, they recur regularly, and they affect the returns to shareholders. In assessing the company’s prospects, these charges are important variables that should not to be ignored.","explhtml":"<p>B is Correct because the analyst is interested in the ongoing operations of the company unaffected by non-repeating types of gains or losses (such as One-off income from associates and joint ventures and One-off revaluation loss). Accordingly, the Adjusted profit before tax of core operations = Profit before tax – One-off income from associates and joint ventures + One- off revaluation loss = 30 – 10 + 4 = 24. Recurring yearly provisions for restructuring activities are already reflected in Profit before tax and no adjustment is needed. Provisions involve decisions by management, they recur regularly, and they affect the returns to shareholders. In assessing the company’s prospects, these charges are important variables that should not to be ignored.<\/p>","qhtml":"<div class=\"pp-topic\">Integration of Financial Statement Analysis Techniques<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company (in € millions):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp198.webp\" style=\"max-width:min(100%,552px)\" alt=\"\"><p>The adjusted profit before tax that best reflects the company&#x27;s core performance (in € millions) is:<\/p><\/div>","subj":"fsa"},{"n":73,"q":"An analyst gathers the following information (in € millions) about a company: The company classifies its interest expenses as financing cash flows. The ratio of operating cash flow before interest and taxes to EBIT is closest to:","opts":["1.0.","1.4.","1.8."],"ans":"B","expl":"B is Correct because net operating cash flows has to be adjusted for interest and taxes in order to be comparable to EBIT. As the company classifies interest expenses as financing cash flows, the only necessary adjustment is for taxes. The operating cash flow before interest and taxes = 97 + 17 = 114. Dividing this by EBIT of 80 yields 1.425 ≈ 1.4.","explhtml":"<p>B is Correct because net operating cash flows has to be adjusted for interest and taxes in order to be comparable to EBIT. As the company classifies interest expenses as financing cash flows, the only necessary adjustment is for taxes. The operating cash flow before interest and taxes = 97 + 17 = 114. Dividing this by EBIT of 80 yields 1.425 ≈ 1.4.<\/p>","qhtml":"<div class=\"pp-topic\">Integration of Financial Statement Analysis Techniques<\/div><div class=\"qtext\"><p>An analyst gathers the following information (in € millions) about a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp199.webp\" style=\"max-width:min(100%,560px)\" alt=\"\"><p>The company classifies its interest expenses as financing cash flows. The ratio of operating cash flow before interest and taxes to EBIT is closest to:<\/p><\/div>","subj":"fsa"},{"n":74,"q":"An analyst gathers the following information about a company: Which of the segments is the company most likely growing?","opts":["Segment A","Segment B","Segment C"],"ans":"C","expl":"C is Correct because for Segment C, its percentage of total capital expenditures is 36% while its percentage of total assets is 30%, yielding a ratio of 36% / 30% = 1.20. When comparing a segment's proportion of capital expenditures to its proportion of total assets. A ratio of greater than 1 indicates the company is growing the segment; the segment is receiving a “growth allocation” of capital spending.","explhtml":"<p>C is Correct because for Segment C, its percentage of total capital expenditures is 36% while its percentage of total assets is 30%, yielding a ratio of 36% / 30% = 1.20. When comparing a segment&#x27;s proportion of capital expenditures to its proportion of total assets. A ratio of greater than 1 indicates the company is growing the segment; the segment is receiving a “growth allocation” of capital spending.<\/p>","qhtml":"<div class=\"pp-topic\">Integration of Financial Statement Analysis Techniques<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp200.webp\" style=\"max-width:min(100%,555px)\" alt=\"\"><p>Which of the segments is the company most likely growing?<\/p><\/div>","subj":"fsa"},{"n":75,"q":"Which of the following statements is most accurate about assets on the balance sheets of commercial banks for financial reporting purposes? The assets of commercial banks:","opts":["predominantly include insured deposits.","are often measured at fair market value for financial reporting.","are adjusted with regulatory risk-weights when reporting total assets on balance sheet."],"ans":"B","expl":"B is Correct because a distinctive feature of financial institutions is that their assets are predominantly financial assets, such as loans and securities. In contrast, the assets of most non-financial companies are predominantly tangible assets. Unlike many tangible assets, financial assets are often measured at fair market value for financial reporting.","explhtml":"<p>B is Correct because a distinctive feature of financial institutions is that their assets are predominantly financial assets, such as loans and securities. In contrast, the assets of most non-financial companies are predominantly tangible assets. Unlike many tangible assets, financial assets are often measured at fair market value for financial reporting.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Financial Institutions<\/div><div class=\"qtext\"><p>Which of the following statements is most accurate about assets on the balance sheets of commercial banks for financial reporting purposes? The assets of commercial banks:<\/p><\/div>","subj":"fsa"},{"n":76,"q":"Which of the following entities is most likely considered systemically important by government and regulators?","opts":["A large commercial bank","A multinational manufacturing company","An international property and casualty insurer"],"ans":"A","expl":"A is Correct because a distinctive feature of financial institutions, in particular, banks, is their systemic importance, which means that their smooth functioning is essential to the overall health of an economy. The network of inter-linkages across entities means that the failure of one bank will negatively affect other financial and non-financial entities. The larger the bank and the more widespread its inter-linkages, the greater its potential impact on the entire financial system.","explhtml":"<p>A is Correct because a distinctive feature of financial institutions, in particular, banks, is their systemic importance, which means that their smooth functioning is essential to the overall health of an economy. The network of inter-linkages across entities means that the failure of one bank will negatively affect other financial and non-financial entities. The larger the bank and the more widespread its inter-linkages, the greater its potential impact on the entire financial system.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Financial Institutions<\/div><div class=\"qtext\"><p>Which of the following entities is most likely considered systemically important by government and regulators?<\/p><\/div>","subj":"fsa"},{"n":77,"q":"An analyst is evaluating three different funding sources with similar residual maturities between six months and one year. Which of the following is considered to be the most stable funding source under Basel III?","opts":["Funding provided by central banks and financial institutions","Less stable non-maturity and term deposits provided by retail and small business customers","Funding from sovereigns, public sector entities, and multilateral and national development banks"],"ans":"B","expl":"B is Correct because Basel III requires a bank to have a minimum amount of stable funding relative to the bank’s liquidity needs over a one-year horizon. Stability of funding is based on the tenor of deposits (e.g., longer-term deposits are more stable than shorter-term deposits) and the type of depositor (e.g., funds from consumers’ deposits are considered more stable than funds raised in the interbank markets). Under Basel III, the available stable funding is determined by assigning a bank’s capital and liabilities to one of five categories. The amount assigned to each category is then multiplied by an available stable funding (ASF) factor, and the total available stable funding is the sum of the weighted amounts. Less stable non-maturity deposits and term deposits with residual maturity of less than one year provided by retail and small business customers has an ASF factor of 90%, which is the highest among the three choices.","explhtml":"<p>B is Correct because Basel III requires a bank to have a minimum amount of stable funding relative to the bank’s liquidity needs over a one-year horizon. Stability of funding is based on the tenor of deposits (e.g., longer-term deposits are more stable than shorter-term deposits) and the type of depositor (e.g., funds from consumers’ deposits are considered more stable than funds raised in the interbank markets). Under Basel III, the available stable funding is determined by assigning a bank’s capital and liabilities to one of five categories. The amount assigned to each category is then multiplied by an available stable funding (ASF) factor, and the total available stable funding is the sum of the weighted amounts. Less stable non-maturity deposits and term deposits with residual maturity of less than one year provided by retail and small business customers has an ASF factor of 90%, which is the highest among the three choices.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Financial Institutions<\/div><div class=\"qtext\"><p>An analyst is evaluating three different funding sources with similar residual maturities between six months and one year. Which of the following is considered to be the most stable funding source under Basel III?<\/p><\/div>","subj":"fsa"},{"n":78,"q":"Which of the following requirements under Basel III most likely ensures a bank’s liquidity needs are met over a 1-year horizon?","opts":["Stable funding requirement","Minimum capital requirement","Minimum liquidity requirement"],"ans":"A","expl":"A is Correct because the minimum amount of stable funding is relative to the bank’s liquidity needs over a one-year horizon","explhtml":"<p>A is Correct because the minimum amount of stable funding is relative to the bank’s liquidity needs over a one-year horizon<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Financial Institutions<\/div><div class=\"qtext\"><p>Which of the following requirements under Basel III most likely ensures a bank’s liquidity needs are met over a 1-year horizon?<\/p><\/div>","subj":"fsa"},{"n":79,"q":"With respect to a bank's sensitivity to market risk, covariance adjustment reflects that its total VaR on a given day is:","opts":["less than the sum of the VaRs relating to each individual risk type.","equal to the sum of the VaRs relating to each individual risk type.","greater than the sum of the VaRs relating to each individual risk type."],"ans":"A","expl":"A is Correct because covariance adjustment reflects the fact that the risks within each and across risk types are not perfectly correlated and, consequently, the total VaR on a given day will be lower than the sum of the VARs relating to each individual risk type.","explhtml":"<p>A is Correct because covariance adjustment reflects the fact that the risks within each and across risk types are not perfectly correlated and, consequently, the total VaR on a given day will be lower than the sum of the VARs relating to each individual risk type.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Financial Institutions<\/div><div class=\"qtext\"><p>With respect to a bank&#x27;s sensitivity to market risk, covariance adjustment reflects that its total VaR on a given day is:<\/p><\/div>","subj":"fsa"},{"n":80,"q":"An analyst gathers the following information regarding a bank's capital ratios: The Tier 2 capital ratio is:","opts":["1.1%.","2.2%.","3.3%."],"ans":"B","expl":"B is Correct because Total Capital Ratio equals Tier 1 Capital plus Tier 2 Capital. Rearranging the above formula, Tier 2 Capital Ratio = Total Capital Ratio – Tier 1 Capital Ratio = 7.9% – 5.7% = 2.2%","explhtml":"<p>B is Correct because Total Capital Ratio equals Tier 1 Capital plus Tier 2 Capital. Rearranging the above formula, Tier 2 Capital Ratio = Total Capital Ratio – Tier 1 Capital Ratio = 7.9% – 5.7% = 2.2%<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Financial Institutions<\/div><div class=\"qtext\"><p>An analyst gathers the following information regarding a bank&#x27;s capital ratios:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp201.webp\" style=\"max-width:min(100%,550px)\" alt=\"\"><p>The Tier 2 capital ratio is:<\/p><\/div>","subj":"fsa"},{"n":81,"q":"An analyst gathers the following information about three banks: Which of the above banks is most likely to have a culture that is risk averse and cautious?","opts":["Bank 1","Bank 2","Bank 3"],"ans":"C","expl":"C is Correct because a bank’s culture may be very risk averse and cautious and make only loans perceived to be low risk, or alternatively, it may be risk seeking and willing to take risk in pursuit of high returns on investment. A bank investor can qualitatively assess a bank’s cultural environment by considering factors such as the bank’s experience with loss reserves and if the bank has been frequently slow to provide for losses, and only to record large asset write-downs later. A bank showing a risk seeking culture is slow to provide for losses by postponing recognition of bad loans to maximize performance, incentives in the short run and also hoping that conditions would improve in the future and decrease the need for loss recognition. When expectations fail to come true, large asset write-downs occur. The opposite applies for risk averse and cautious risk cultures.","explhtml":"<p>C is Correct because a bank’s culture may be very risk averse and cautious and make only loans perceived to be low risk, or alternatively, it may be risk seeking and willing to take risk in pursuit of high returns on investment. A bank investor can qualitatively assess a bank’s cultural environment by considering factors such as the bank’s experience with loss reserves and if the bank has been frequently slow to provide for losses, and only to record large asset write-downs later. A bank showing a risk seeking culture is slow to provide for losses by postponing recognition of bad loans to maximize performance, incentives in the short run and also hoping that conditions would improve in the future and decrease the need for loss recognition. When expectations fail to come true, large asset write-downs occur. The opposite applies for risk averse and cautious risk cultures.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Financial Institutions<\/div><div class=\"qtext\"><p>An analyst gathers the following information about three banks:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp202.webp\" style=\"max-width:min(100%,721px)\" alt=\"\"><p>Which of the above banks is most likely to have a culture that is risk averse and cautious?<\/p><\/div>","subj":"fsa"},{"n":82,"q":"An analyst gathers the following information about a bank: The bank's liquidity position has most likely:","opts":["declined.","remained unchanged.","improved."],"ans":"C","expl":"C is Correct because to assess the bank's liquidity position, the Net Stable Funding Ratio (which improved) is most relevant, and not the Tier 1 Capital Ratio (which remained unchanged) or the Provision for loan losses to net loan charge-offs (which declined). Net Stable Funding Ratio is higher than 100% in all 3 years and increasing. The second Basel III liquidity standard is the Net Stable Funding Ratio: a minimum percentage of required stable funding that must be sourced from available stable funding. As with the Liquidity Coverage Ratio, a ratio of 100% is the minimum acceptable threshold.","explhtml":"<p>C is Correct because to assess the bank&#x27;s liquidity position, the Net Stable Funding Ratio (which improved) is most relevant, and not the Tier 1 Capital Ratio (which remained unchanged) or the Provision for loan losses to net loan charge-offs (which declined). Net Stable Funding Ratio is higher than 100% in all 3 years and increasing. The second Basel III liquidity standard is the Net Stable Funding Ratio: a minimum percentage of required stable funding that must be sourced from available stable funding. As with the Liquidity Coverage Ratio, a ratio of 100% is the minimum acceptable threshold.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Financial Institutions<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a bank:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp203.webp\" style=\"max-width:min(100%,614px)\" alt=\"\"><p>The bank&#x27;s liquidity position has most likely:<\/p><\/div>","subj":"fsa"},{"n":83,"q":"An analyst gathers the following information about Which of the following statements best describes the efficiency of money spent in obtaining new premiums?","opts":["Insurer A is more efficient than Insurer B","Insurer B is more efficient than Insurer A","Both Insurer A and Insurer B are equally efficient"],"ans":"C","expl":"C is Correct because the underwriting expense ratios for Insurer A and Insurer B are equal, at 40%. Therefore, they are equally efficient. Underwriting expense ratio = Underwriting expense/Net premiums written. This ratio measures the efficiency of money spent in obtaining new premiums. A lower ratio indicates higher success. Since the ratios are equal, both Insurer A and Insurer B are equally efficient in terms of money spent in obtaining new premiums.","explhtml":"<p>C is Correct because the underwriting expense ratios for Insurer A and Insurer B are equal, at 40%. Therefore, they are equally efficient. Underwriting expense ratio = Underwriting expense/Net premiums written. This ratio measures the efficiency of money spent in obtaining new premiums. A lower ratio indicates higher success. Since the ratios are equal, both Insurer A and Insurer B are equally efficient in terms of money spent in obtaining new premiums.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp208.webp\" style=\"max-width:min(100%,539px)\" alt=\"\">","qhtml":"<div class=\"pp-topic\">Analysis of Financial Institutions<\/div><div class=\"qtext\"><p>An analyst gathers the following information about Which of the following statements best describes the efficiency of money spent in<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp204.webp\" style=\"max-width:min(100%,555px)\" alt=\"\"><p>obtaining new premiums?<\/p><\/div>","subj":"fsa"},{"n":84,"q":"An analyst gathers the following information (in $ millions) of an insurer and evaluates the overall efficiency of its operation: The insurer's combined ratio is:","opts":["64%.","80%.","120%."],"ans":"C","expl":"C is Correct because 120% is the combined ratio of the insurer. Combined r
