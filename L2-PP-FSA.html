<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>
<body>
<header>

<script>
const DATA = [{"n":1,"q":"A company reporting under IFRS initially classified its holdings of debt and equity instruments as fair value through profit and loss. The company's business model has changed, and if it bought the same securities today, it would classify them as fair value through other comprehensive income. The company is permitted to reclassify:","opts":["debt instruments only.","equity instruments only.","both debt instruments and equity instruments."],"ans":"A","expl":"A is Correct because reclassification of debt instruments is only permitted if the business model for the financial assets (objective for holding the financial assets) has changed in a way that significantly affects operations. Changes to the business model will require judgment and are expected to be very infrequent.","explhtml":"<p>A is Correct because reclassification of debt instruments is only permitted if the business model for the financial assets (objective for holding the financial assets) has changed in a way that significantly affects operations. Changes to the business model will require judgment and are expected to be very infrequent.<\/p>","qhtml":"<div class=\"pp-topic\">Intercorporate Investments<\/div><div class=\"qtext\"><p>A company reporting under IFRS initially classified its holdings of debt and equity instruments as fair value through profit and loss. The company&#x27;s business model has changed, and if it bought the same securities today, it would classify them as fair value through other comprehensive income. The company is permitted to reclassify:<\/p><\/div>","subj":"fsa"},{"n":2,"q":"When 100% of the shares in a target company are acquired for a purchase price that is less than the fair value of its net identifiable assets, the acquiring company should recognize:","opts":["goodwill.","a gain on the income statement.","a gain reflected in other comprehensive income."],"ans":"B","expl":"B is Correct because in an acquisition of such a company, where the purchase price is less than the fair value of the target’s (acquiree’s) net assets, the acquisition is considered to be a “bargain purchase” acquisition. IFRS and US GAAP require the difference between the fair value of the acquired net assets and the purchase price to be recognized immediately as a gain in profit or loss.","explhtml":"<p>B is Correct because in an acquisition of such a company, where the purchase price is less than the fair value of the target’s (acquiree’s) net assets, the acquisition is considered to be a “bargain purchase” acquisition. IFRS and US GAAP require the difference between the fair value of the acquired net assets and the purchase price to be recognized immediately as a gain in profit or loss.<\/p>","qhtml":"<div class=\"pp-topic\">Intercorporate Investments<\/div><div class=\"qtext\"><p>When 100% of the shares in a target company are acquired for a purchase price that is less than the fair value of its net identifiable assets, the acquiring company should recognize:<\/p><\/div>","subj":"fsa"},{"n":3,"q":"A US company reporting under US GAAP forms a joint venture with a European company reporting under IFRS. The two companies have joint control of this venture. When reporting the venture's results, it is most likely that:","opts":["each company will present its proportionate share of each financial statement line item.","each company will present a single line item on its income statement and balance sheet.","the US company will present a single line item and the European company will present its proportionate share of each line item."],"ans":"B","expl":"B is Correct because both IFRS and US GAAP require the equity method of accounting for joint ventures. Only under rare circumstances will joint ventures be allowed to use proportionate consolidation under IFRS and US GAAP. The equity method is often referred to as “one-line consolidation” because the investor’s proportionate ownership interest in the assets and liabilities of the investee is disclosed as a single line item (net assets) on its balance sheet, and the investor’s share of the revenues and expenses of the investee is disclosed as a single line item on its income statement.","explhtml":"<p>B is Correct because both IFRS and US GAAP require the equity method of accounting for joint ventures. Only under rare circumstances will joint ventures be allowed to use proportionate consolidation under IFRS and US GAAP. The equity method is often referred to as “one-line consolidation” because the investor’s proportionate ownership interest in the assets and liabilities of the investee is disclosed as a single line item (net assets) on its balance sheet, and the investor’s share of the revenues and expenses of the investee is disclosed as a single line item on its income statement.<\/p>","qhtml":"<div class=\"pp-topic\">Intercorporate Investments<\/div><div class=\"qtext\"><p>A US company reporting under US GAAP forms a joint venture with a European company reporting under IFRS. The two companies have joint control of this venture. When reporting the venture&#x27;s results, it is most likely that:<\/p><\/div>","subj":"fsa"},{"n":4,"q":"A US company reporting under US GAAP forms a joint venture with a European company reporting under IFRS. The two companies have joint control of this venture. When reporting the venture's results, it is most likely that: Using the partial goodwill method, the company will report goodwill (in € millions) of:","opts":["21.","35.","50."],"ans":"B","expl":"B is Correct because the fair value of identifiable net assets is adjusted for the percent of the company acquired, and the goodwill recognized is the difference between that acquisition price and the adjusted fair value of identifiable net assets. Goodwill recognized = €280 – 70% × €350 = €35, or (€400 – €350) × 70% = €35. Under IFRS, the parent can measure the non-controlling interest at either its fair value (full goodwill method) or at the non-controlling interest’s proportionate share of the acquiree’s identifiable net assets (partial goodwill method).","explhtml":"<p>B is Correct because the fair value of identifiable net assets is adjusted for the percent of the company acquired, and the goodwill recognized is the difference between that acquisition price and the adjusted fair value of identifiable net assets. Goodwill recognized = €280 – 70% × €350 = €35, or (€400 – €350) × 70% = €35.<\/p><p>Under IFRS, the parent can measure the non-controlling interest at either its fair value (full goodwill method) or at the non-controlling interest’s proportionate share of the acquiree’s identifiable net assets (partial goodwill method).<\/p>","qhtml":"<div class=\"pp-topic\">Intercorporate Investments<\/div><div class=\"qtext\"><p>A US company reporting under US GAAP forms a joint venture with a European company reporting under IFRS. The two companies have joint control of this venture. When reporting the venture&#x27;s results, it is most likely that:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp168.webp\" style=\"max-width:min(100%,457px)\" alt=\"\"><p>Using the partial goodwill method, the company will report goodwill (in € millions) of:<\/p><\/div>","subj":"fsa"},{"n":5,"q":"Compared to using the equity method of accounting for joint ventures, the proportionate consolidation method results in the recognition of higher:","opts":["income.","liabilities.","net assets."],"ans":"B","expl":"B is Correct because proportionate consolidation requires the venturer’s share of the assets, liabilities, income, and expenses of the joint venture to be combined or shown on a line-by-line basis with similar items under its sole control. In contrast, the equity method results in a single line item (equity in income of the joint venture) on the income statement and a single line item (investment in joint venture) on the balance sheet. Accordingly, the company's share in the joint venture's liabilities is added to the liabilities under the company's sole control resulting in higher liabilities compared to the equity method that results in a single line item on the balance sheet.","explhtml":"<p>B is Correct because proportionate consolidation requires the venturer’s share of the assets, liabilities, income, and expenses of the joint venture to be combined or shown on a line-by-line basis with similar items under its sole control. In contrast, the equity method results in a single line item (equity in income of the joint venture) on the income statement and a single line item (investment in joint venture) on the balance sheet. Accordingly, the company&#x27;s share in the joint venture&#x27;s liabilities is added to the liabilities under the company&#x27;s sole control resulting in higher liabilities compared to the equity method that results in a single line item on the balance sheet.<\/p>","qhtml":"<div class=\"pp-topic\">Intercorporate Investments<\/div><div class=\"qtext\"><p>Compared to using the equity method of accounting for joint ventures, the proportionate consolidation method results in the recognition of higher:<\/p><\/div>","subj":"fsa"},{"n":6,"q":"Compared to reporting a business consolidation under US GAAP, which of the following will be higher if reporting under IFRS using the partial goodwill method?","opts":["Return on assets","Noncontrolling interests","Consolidated net income"],"ans":"A","expl":"A is Correct because the partial goodwill method will result in less goodwill being recognized and reported, and lower total asset value being reported. Since income is the same under either method, the partial goodwill method will result in a higher return on assets ratio compared to the full goodwill method.","explhtml":"<p>A is Correct because the partial goodwill method will result in less goodwill being recognized and reported, and lower total asset value being reported. Since income is the same under either method, the partial goodwill method will result in a higher return on assets ratio compared to the full goodwill method.<\/p>","qhtml":"<div class=\"pp-topic\">Intercorporate Investments<\/div><div class=\"qtext\"><p>Compared to reporting a business consolidation under US GAAP, which of the following will be higher if reporting under IFRS using the partial goodwill method?<\/p><\/div>","subj":"fsa"},{"n":7,"q":"A Chinese company opens a manufacturing subsidiary in Mexico that generates most of its cash in the United States. This subsidiary's functional currency is most likely the:","opts":["US dollar.","Mexican peso.","Chinese yuan."],"ans":"A","expl":"A is correct because the functional currency is the currency in which an entity primarily generates and expends cash.","explhtml":"<p>A is correct because the functional currency is the currency in which an entity primarily generates and expends cash.<\/p>","qhtml":"<div class=\"pp-topic\">Multinational Operations<\/div><div class=\"qtext\"><p>A Chinese company opens a manufacturing subsidiary in Mexico that generates most of its cash in the United States. This subsidiary&#x27;s functional currency is most likely the:<\/p><\/div>","subj":"fsa"},{"n":8,"q":"A foreign subsidiary is located in the UK and its parent is located in the US. The subsidiary primarily conducts business in EUR but reports in GBP. The subsidiary's functional currency is most likely:","opts":["GBP.","EUR.","USD."],"ans":"B","expl":"B is Correct because the functional currency, is the currency of the primary economic environment in which an entity operates. Normally, the functional currency is the currency in which an entity primarily generates and expends cash.","explhtml":"<p>B is Correct because the functional currency, is the currency of the primary economic environment in which an entity operates. Normally, the functional currency is the currency in which an entity primarily generates and expends cash.<\/p>","qhtml":"<div class=\"pp-topic\">Multinational Operations<\/div><div class=\"qtext\"><p>A foreign subsidiary is located in the UK and its parent is located in the US. The subsidiary primarily conducts business in EUR but reports in GBP. The subsidiary&#x27;s functional currency is most likely:<\/p><\/div>","subj":"fsa"},{"n":9,"q":"A US-based multinational corporation has a UK subsidiary with primary activities in Europe. The financial statements of the subsidiary for local regulators are most likely presented in:","opts":["EUR.","GBP.","USD."],"ans":"B","expl":"B is Correct because the subsidiary's presentation currency is most likely GBP. The currency in which financial statement amounts are presented is known as the presentation currency. In most cases, a company’s presentation currency will be the currency of the country where the company is located.","explhtml":"<p>B is Correct because the subsidiary&#x27;s presentation currency is most likely GBP. The currency in which financial statement amounts are presented is known as the presentation currency. In most cases, a company’s presentation currency will be the currency of the country where the company is located.<\/p>","qhtml":"<div class=\"pp-topic\">Multinational Operations<\/div><div class=\"qtext\"><p>A US-based multinational corporation has a UK subsidiary with primary activities in Europe. The financial statements of the subsidiary for local regulators are most likely presented in:<\/p><\/div>","subj":"fsa"},{"n":10,"q":"An analyst gathers the following information about a company’s transactions occurring on 15 December: • USD 50,000 export, invoiced and paid on the same day; and • USD 200,000 import, invoiced and will be paid in 30 days. The company’s functional and presentation currency is EUR and the spot exchange rates are: Note: EUR/USD is the amount of EUR per 1 USD. If the company's year end is 31 December, the company would report as a result of these transactions:","opts":["no foreign currency gain or loss.","a EUR 825 foreign currency gain.","a EUR 1,100 foreign currency gain."],"ans":"C","expl":"C is Correct because transaction exposure related to imports and exports can be summarized as follows: Import purchase - A transaction exposure arises when the importer is obligated to pay in foreign currency and is allowed to defer payment until sometime after the purchase date. Export sale - A transaction exposure arises when the exporter agrees to be paid in foreign currency and allows payment to be made sometime after the purchase date. Also, a foreign currency payable resulting from an import purchase creates a liability exposure to foreign exchange risk. If the foreign currency weakens, the foreign currency payable loses value in terms of the functional currency and a gain exists. In addition, for foreign currency transactions whose settlement dates fall in subsequent accounting periods, both IFRS and US GAAP require adjustments to reflect intervening changes in currency exchange rates. In this case: Transaction 1: the export is cashed the same day the invoice is issued, thus it does not lead to foreign exchange exposure Transaction 2: the import leads to foreign exchange exposure since payment is deferred for 30 days. Considering the foreign currency, USD, weakens, the company reports a gain equal to Import value × (Spot rate as of December 15 – Spot rate as of December 31) = USD 200,000 × (0.9525 EUR/USD – 0.9470 EUR/USD) = USD 200,000 × 0.0055 EUR/USD = EUR 1,100.","explhtml":"<p>C is Correct because transaction exposure related to imports and exports can be summarized as follows: Import purchase - A transaction exposure arises when the importer is obligated to pay in foreign currency and is allowed to defer payment until sometime after the purchase date. Export sale - A transaction exposure arises when the exporter agrees to be paid in foreign currency and allows payment to be made sometime after the purchase date. Also, a foreign currency payable resulting from an import purchase creates a liability exposure to foreign exchange risk. If the foreign currency weakens, the foreign currency payable loses value in terms of the functional currency and a gain exists. In addition, for foreign currency transactions whose settlement dates fall in subsequent accounting periods, both IFRS and US GAAP require adjustments to reflect intervening changes in currency exchange rates. In this case: Transaction 1: the export is cashed the same day the invoice is issued, thus it does not lead to foreign exchange exposure Transaction 2: the import leads to foreign exchange exposure since payment is deferred for 30 days. Considering the foreign currency, USD, weakens, the company reports a gain equal to Import value × (Spot rate as of December 15 – Spot rate as of December 31) = USD 200,000 × (0.9525 EUR/USD – 0.9470 EUR/USD) = USD 200,000 × 0.0055 EUR/USD = EUR 1,100.<\/p>","qhtml":"<div class=\"pp-topic\">Multinational Operations<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company’s transactions occurring on 15 December: • USD 50,000 export, invoiced and paid on the same day; and • USD 200,000 import, invoiced and will be paid in 30 days. The company’s functional and presentation currency is EUR and the spot exchange rates are:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp169.webp\" style=\"max-width:min(100%,460px)\" alt=\"\"><p>Note: EUR/USD is the amount of EUR per 1 USD. If the company&#x27;s year end is 31 December, the company would report as a result of these transactions:<\/p><\/div>","subj":"fsa"},{"n":11,"q":"A company entered into a foreign currency transaction whose settlement date falls in a subsequent accounting period. Will the unrealized gain or loss on this foreign currency transaction be reported on the financial statements for the current period?","opts":["No","Yes, it will be reported on the income statement","Yes, it will be reported in other comprehensive income"],"ans":"B","expl":"B is Correct because for foreign currency transactions whose settlement dates fall in subsequent accounting periods, both IFRS and US GAAP require adjustments to reflect intervening changes in currency exchange rates. Foreign currency transaction gains and losses are reported on the income statement, creating one of the few situations in which accounting rules allow, indeed require, companies to include (recognize) a gain or loss in income before it has been realized.","explhtml":"<p>B is Correct because for foreign currency transactions whose settlement dates fall in subsequent accounting periods, both IFRS and US GAAP require adjustments to reflect intervening changes in currency exchange rates. Foreign currency transaction gains and losses are reported on the income statement, creating one of the few situations in which accounting rules allow, indeed require, companies to include (recognize) a gain or loss in income before it has been realized.<\/p>","qhtml":"<div class=\"pp-topic\">Multinational Operations<\/div><div class=\"qtext\"><p>A company entered into a foreign currency transaction whose settlement date falls in a subsequent accounting period. Will the unrealized gain or loss on this foreign currency transaction be reported on the financial statements for the current period?<\/p><\/div>","subj":"fsa"},{"n":12,"q":"A company has both realized and unrealized foreign currency transaction gains. The company should report the:","opts":["realized and unrealized gains on the income statement.","realized gains on the income statement and not report the unrealized gains.","realized gains on the income statement and unrealized gains on the balance sheet."],"ans":"A","expl":"A is Correct because both IFRS and US GAAP require foreign currency transaction gains and losses to be reported in net income even if the gains and losses have not yet been realized.","explhtml":"<p>A is Correct because both IFRS and US GAAP require foreign currency transaction gains and losses to be reported in net income even if the gains and losses have not yet been realized.<\/p>","qhtml":"<div class=\"pp-topic\">Multinational Operations<\/div><div class=\"qtext\"><p>A company has both realized and unrealized foreign currency transaction gains. The company should report the:<\/p><\/div>","subj":"fsa"},{"n":13,"q":"Acme Manufacturing forms a foreign subsidiary and translates its results using the temporal method. The subsidiary operates with a net monetary liability and the foreign currency has depreciated against Acme's currency during the most recent accounting period. As a result of the subsidiary's balance sheet exposure, Acme will report a:","opts":["gain on the consolidated income statement.","positive adjustment included in its cumulative translation adjustment account.","negative adjustment included in its cumulative translation adjustment account."],"ans":"A","expl":"A is Correct because under both international and US accounting standards, when the temporal method is used, the translation adjustment needed to keep the translated balance sheet in balance is reported as a gain or loss in net income. The sign (positive or negative) of the current period's translation adjustment is a function of two factors: (1) the nature of the balance sheet exposure (asset or liability) and (2) the direction of change in the exchange rate (strengthens or weakens). If there is a net liability balance sheet exposure, and the foreign currency weakens, a positive translation adjustment will occur.","explhtml":"<p>A is Correct because under both international and US accounting standards, when the temporal method is used, the translation adjustment needed to keep the translated balance sheet in balance is reported as a gain or loss in net income. The sign (positive or negative) of the current period&#x27;s translation adjustment is a function of two factors: (1) the nature of the balance sheet exposure (asset or liability) and (2) the direction of change in the exchange rate (strengthens or weakens). If there is a net liability balance sheet exposure, and the foreign currency weakens, a positive translation adjustment will occur.<\/p>","qhtml":"<div class=\"pp-topic\">Multinational Operations<\/div><div class=\"qtext\"><p>Acme Manufacturing forms a foreign subsidiary and translates its results using the temporal method. The subsidiary operates with a net monetary liability and the foreign currency has depreciated against Acme&#x27;s currency during the most recent accounting period. As a result of the subsidiary&#x27;s balance sheet exposure, Acme will report a:<\/p><\/div>","subj":"fsa"},{"n":14,"q":"A company will record a positive translation adjustment due to a change in exchange rates when it has a subsidiary with:","opts":["a net asset balance sheet exposure and the foreign currency weakens.","a net asset balance sheet exposure and the foreign currency strengthens.","a net liability balance sheet exposure and the foreign currency strengthens."],"ans":"B","expl":"B is Correct because a net asset balance sheet exposure occurs when a company has more assets exposed to a translation at the current exchange rate than liabilities. As a result of the foreign currency increasing (strengthening), there will be a higher translated amount of assets than liabilities resulting in a positive translation adjustment (gain) for the the parent company.","explhtml":"<p>B is Correct because a net asset balance sheet exposure occurs when a company has more assets exposed to a translation at the current exchange rate than liabilities. As a result of the foreign currency increasing (strengthening), there will be a higher translated amount of assets than liabilities resulting in a positive translation adjustment (gain) for the the parent company.<\/p>","qhtml":"<div class=\"pp-topic\">Multinational Operations<\/div><div class=\"qtext\"><p>A company will record a positive translation adjustment due to a change in exchange rates when it has a subsidiary with:<\/p><\/div>","subj":"fsa"},{"n":15,"q":"A foreign subsidiary has the parents' presentation currency as its functional currency. The subsidiary's PP&E will be translated at the:","opts":["current rate.","average rate.","historical rate."],"ans":"C","expl":"C is Correct because non-monetary assets and liabilities measured at historical cost such as property, plant & equipment are translated at historical rates when the temporal method is used. A foreign entity might have the parent’s presentation currency as its functional currency. In that situation, the subsidiary’s presentation currency financial statements must be translated into the parent's presentation currency as if the subsidiary’s transactions had originally been recorded in the functional currency. IFRS describe this situation as reporting foreign currency transactions in the functional currency. To achieve the objective of translating to the parent’s presentation currency as if the subsidiary’s transactions had been recorded in that currency, the following procedures are used: Non-monetary assets and liabilities measured at historical cost [e.g., property, plant & equipment] are translated at historical exchange rates. These procedures essentially describe the temporal method. These procedures essentially describe the temporal method.","explhtml":"<p>C is Correct because non-monetary assets and liabilities measured at historical cost such as property, plant &amp; equipment are translated at historical rates when the temporal method is used. A foreign entity might have the parent’s presentation currency as its functional currency. In that situation, the subsidiary’s presentation currency financial statements must be translated into the parent&#x27;s presentation currency as if the subsidiary’s transactions had originally been recorded in the functional currency. IFRS describe this situation as reporting foreign currency transactions in the functional currency. To achieve the objective of translating to the parent’s presentation currency as if the subsidiary’s transactions had been recorded in that currency, the following procedures are used: Non-monetary assets and liabilities measured at historical cost [e.g., property, plant &amp; equipment] are translated at historical exchange rates. These procedures essentially describe the temporal method. These procedures essentially describe the temporal method.<\/p>","qhtml":"<div class=\"pp-topic\">Multinational Operations<\/div><div class=\"qtext\"><p>A foreign subsidiary has the parents&#x27; presentation currency as its functional currency. The subsidiary&#x27;s PP&amp;E will be translated at the:<\/p><\/div>","subj":"fsa"},{"n":16,"q":"A foreign subsidiary's functional currency is the parent company's presentation currency. The subsidiary's PP&E will be translated at:","opts":["current exchange rates with gains and losses from translation reported in the equity section.","current exchange rates with gains and losses from translation reported on the income statement.","historical exchange rates with gains and losses from translation reported on the income statement."],"ans":"C","expl":"C is Correct because if the functional currency and presentation currency are the same, the temporal method of translation should be used. Under the temporal method, non-monetary assets are translated at historical exchange rates. When the temporal method is used, the translation adjustment needed to keep the translated balance sheet in balance is reported as a gain or loss in net income.","explhtml":"<p>C is Correct because if the functional currency and presentation currency are the same, the temporal method of translation should be used. Under the temporal method, non-monetary assets are translated at historical exchange rates. When the temporal method is used, the translation adjustment needed to keep the translated balance sheet in balance is reported as a gain or loss in net income.<\/p>","qhtml":"<div class=\"pp-topic\">Multinational Operations<\/div><div class=\"qtext\"><p>A foreign subsidiary&#x27;s functional currency is the parent company&#x27;s presentation currency. The subsidiary&#x27;s PP&amp;E will be translated at:<\/p><\/div>","subj":"fsa"},{"n":17,"q":"Masswell corporation opens a foreign subsidiary and elects to report the subsidiary's results using the current rate method. During the first year of operations, the foreign currency depreciates against Masswell's home currency. Did the choice of reporting method affect Masswell's reported operating income?","opts":["No","Yes, operating income was lower than it would have been under the temporal method","Yes, operating income was higher than it would have been under the temporal method"],"ans":"C","expl":"C is Correct because under the current rate method revenues and expenses are translated at the exchange rate that existed when the transactions took place. Under the temporal method expenses related to non-monetary assets, such as cost of goods sold (inventory), depreciation (fixed assets), and amortization (intangible assets), are translated at the exchange rates used to translate the related assets. The depreciating foreign currency means that under the current rate method these non- monetary expenses would be translated at the lower average exchange rate causing operating income to be higher under the current rate method than under the temporal method.","explhtml":"<p>C is Correct because under the current rate method revenues and expenses are translated at the exchange rate that existed when the transactions took place. Under the temporal method expenses related to non-monetary assets, such as cost of goods sold (inventory), depreciation (fixed assets), and amortization (intangible assets), are translated at the exchange rates used to translate the related assets. The depreciating foreign currency means that under the current rate method these non- monetary expenses would be translated at the lower average exchange rate causing operating income to be higher under the current rate method than under the temporal method.<\/p>","qhtml":"<div class=\"pp-topic\">Multinational Operations<\/div><div class=\"qtext\"><p>Masswell corporation opens a foreign subsidiary and elects to report the subsidiary&#x27;s results using the current rate method. During the first year of operations, the foreign currency depreciates against Masswell&#x27;s home currency. Did the choice of reporting method affect Masswell&#x27;s reported operating income?<\/p><\/div>","subj":"fsa"},{"n":18,"q":"An analyst gathers the following information (in GBP) as of 31 December about the UK subsidiary of a German company that purchased property and equipment on 1 January: The following exchange rate information was gathered: Note: EUR/GBP is the amount of EUR per 1 GBP. The functional currency of the subsidiary is GBP. After translating the UK subsidiary's balance sheet into the parent company's currency (EUR), the UK subsidiary would recognize total assets of:","opts":["EUR 8,088,150.","EUR 8,121,900.","EUR 8,137,500."],"ans":"C","expl":"C is Correct because the functional currency of the subsidiary is GBP, the local currency, and thus, the current rate method is used. Thus, assets and liabilities are translated at the current exchange rate on the balance sheet date of 31 December. Alternatively, Total assets = GBP 7,000,000 × EUR/GBP 1.1625 = EUR 8,137,500.","explhtml":"<p>C is Correct because the functional currency of the subsidiary is GBP, the local currency, and thus, the current rate method is used. Thus, assets and liabilities are translated at the current exchange rate on the balance sheet date of 31 December.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp206.webp\" style=\"max-width:min(100%,721px)\" alt=\"\"><p>Alternatively, Total assets = GBP 7,000,000 × EUR/GBP 1.1625 = EUR 8,137,500.<\/p>","qhtml":"<div class=\"pp-topic\">Multinational Operations<\/div><div class=\"qtext\"><p>An analyst gathers the following information (in GBP) as of 31 December about the UK subsidiary of a German company that purchased property and equipment on 1 January:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp170.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>The following exchange rate information was gathered:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp171.webp\" style=\"max-width:min(100%,550px)\" alt=\"\"><p>Note: EUR/GBP is the amount of EUR per 1 GBP.<\/p><p>The functional currency of the subsidiary is GBP. After translating the UK subsidiary&#x27;s balance sheet into the parent company&#x27;s currency (EUR), the UK subsidiary would recognize total assets of:<\/p><\/div>","subj":"fsa"},{"n":19,"q":"The foreign currency of a subsidiary has consistently depreciated against the parent's presentation currency. The subsidiary does not have any non-monetary liabilities, but does have long-term debt issued five years ago. Compared to the current rate method, the temporal method of translation most likely results in:","opts":["lower reported assets.","higher reported equity.","higher reported liabilities."],"ans":"B","expl":"B is Correct because the temporal method will result in higher reported assets since some of the assets will be reported at a higher historical exchange rate. The liabilities will be the same as all liabilities will be translated at the same current exchange rate under both methods. As a result, the temporal method will result in a higher equity balance so that the balance sheet will balance. The current rate method will have a negative translation adjustment due to the depreciation of the foreign currency that will be reported in the equity section.","explhtml":"<p>B is Correct because the temporal method will result in higher reported assets since some of the assets will be reported at a higher historical exchange rate. The liabilities will be the same as all liabilities will be translated at the same current exchange rate under both methods. As a result, the temporal method will result in a higher equity balance so that the balance sheet will balance. The current rate method will have a negative translation adjustment due to the depreciation of the foreign currency that will be reported in the equity section.<\/p>","qhtml":"<div class=\"pp-topic\">Multinational Operations<\/div><div class=\"qtext\"><p>The foreign currency of a subsidiary has consistently depreciated against the parent&#x27;s presentation currency. The subsidiary does not have any non-monetary liabilities, but does have long-term debt issued five years ago. Compared to the current rate method, the temporal method of translation most likely results in:<\/p><\/div>","subj":"fsa"},{"n":20,"q":"The UK subsidiary of a US parent company has GBP as its functional currency. To translate the subsidiary's GBP financial statements into USD for consolidation purposes, the following exchange rate information was gathered: Note: USD/GBP is the amount of USD per 1 GBP The subsidiary reports total assets of GBP 5 million on its balance sheet at fiscal year end. The subsidiary's total assets reported on the parent's consolidated balance sheet are:","opts":["USD 6.50 million.","USD 6.75 million.","USD 7.00 million."],"ans":"C","expl":"C is Correct when the subsidiary's functional currency is different from the parent's presentation currency, the current rate method is being used and assets are translated at the balance-sheet-date exchange rate. Therefore, the calculation is: Total assets (translated) = Total assets in GBP × Year-end exchange rate = GBP 5 million × 1.4 USD/GBP = USD 7 million. When a foreign entity has a functional currency that differs from the parent’s presentation currency, the foreign entity’s foreign currency financial statements are translated into the parent’s presentation currency. All assets and liabilities are translated at the current exchange rate at the balance sheet date. Essentially, the current rate method.","explhtml":"<p>C is Correct when the subsidiary&#x27;s functional currency is different from the parent&#x27;s presentation currency, the current rate method is being used and assets are translated at the balance-sheet-date exchange rate. Therefore, the calculation is: Total assets (translated) = Total assets in GBP × Year-end exchange rate = GBP 5 million × 1.4 USD/GBP = USD 7 million. When a foreign entity has a functional currency that differs from the parent’s presentation currency, the foreign entity’s foreign currency financial statements are translated into the parent’s presentation currency. All assets and liabilities are translated at the current exchange rate at the balance sheet date. Essentially, the current rate method.<\/p>","qhtml":"<div class=\"pp-topic\">Multinational Operations<\/div><div class=\"qtext\"><p>The UK subsidiary of a US parent company has GBP as its functional currency. To translate the subsidiary&#x27;s GBP financial statements into USD for consolidation purposes, the following exchange rate information was gathered:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp172.webp\" style=\"max-width:min(100%,550px)\" alt=\"\"><p>Note: USD/GBP is the amount of USD per 1 GBP The subsidiary reports total assets of GBP 5 million on its balance sheet at fiscal year end. The subsidiary&#x27;s total assets reported on the parent&#x27;s consolidated balance sheet are:<\/p><\/div>","subj":"fsa"},{"n":21,"q":"Copacabana SA is the Brazilian subsidiary of a US corporation and its results are translated into USD using the current rate method. In recent years, the Brazilian real has generally depreciated against the US dollar. Does the translation process affect Copacabana's reported gross profit margin?","opts":["No","Yes, after translation the gross profit margin is lower than it was before translation","Yes, after translation the gross profit margin is higher than it was before translation"],"ans":"A","expl":"A is Correct because under the current rate method both revenue and cost of revenue are reported using the average exchange rate for the period. As a result, gross margins are not affected by the translation process. Revenues and expenses are translated at the exchange rate that existed when the transactions took place. For practical reasons, a rate that approximates the exchange rates at the dates of the transactions, such as an average exchange rate, may be used. The current ratio, the leverage ratios (debt-to-assets and debt-to-equity ratios), the interest coverage ratio, and the profit margins (gross profit margin, operating profit margin, and net profit margin) are the same in the local currency and parent currency. This result occurs because each of the ratios is calculated using information from either the balance sheet or the income statement, but not both.","explhtml":"<p>A is Correct because under the current rate method both revenue and cost of revenue are reported using the average exchange rate for the period. As a result, gross margins are not affected by the translation process. Revenues and expenses are translated at the exchange rate that existed when the transactions took place. For practical reasons, a rate that approximates the exchange rates at the dates of the transactions, such as an average exchange rate, may be used. The current ratio, the leverage ratios (debt-to-assets and debt-to-equity ratios), the interest coverage ratio, and the profit margins (gross profit margin, operating profit margin, and net profit margin) are the same in the local currency and parent currency. This result occurs because each of the ratios is calculated using information from either the balance sheet or the income statement, but not both.<\/p>","qhtml":"<div class=\"pp-topic\">Multinational Operations<\/div><div class=\"qtext\"><p>Copacabana SA is the Brazilian subsidiary of a US corporation and its results are translated into USD using the current rate method. In recent years, the Brazilian real has generally depreciated against the US dollar. Does the translation process affect Copacabana&#x27;s reported gross profit margin?<\/p><\/div>","subj":"fsa"},{"n":22,"q":"An analyst gathers the following information (in EUR) about a subsidiary's balance sheet at fiscal year-end: During the fiscal year, EUR strengthens against USD. Using the temporal method when translating the subsidiary's financial statements into USD, the company recognizes:","opts":["a translation loss on the income statement.","a translation gain on the income statement.","a positive translation adjustment to shareholders' equity."],"ans":"A","expl":"A is Correct because the company has a net monetary liability exposure equal to Cash + Accounts receivable – Accounts payable – Long term debt = 400,000 + 280,000 – 200,000 – 1,400,000 = –920,000. Because the subsidiary has a net monetary liability exposure to changes in the exchange rate, a stronger EUR results in a translation loss when the temporal method is used. Also, IFRS and US GAAP require the resulting translation loss to be included in net income when the temporal method is used.","explhtml":"<p>A is Correct because the company has a net monetary liability exposure equal to Cash + Accounts receivable – Accounts payable – Long term debt = 400,000 + 280,000 – 200,000 – 1,400,000 = –920,000. Because the subsidiary has a net monetary liability exposure to changes in the exchange rate, a stronger EUR results in a translation loss when the temporal method is used. Also, IFRS and US GAAP require the resulting translation loss to be included in net income when the temporal method is used.<\/p>","qhtml":"<div class=\"pp-topic\">Multinational Operations<\/div><div class=\"qtext\"><p>An analyst gathers the following information (in EUR) about a subsidiary&#x27;s balance sheet at fiscal year-end:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp173.webp\" style=\"max-width:min(100%,550px)\" alt=\"\"><p>During the fiscal year, EUR strengthens against USD. Using the temporal method when translating the subsidiary&#x27;s financial statements into USD, the company recognizes:<\/p><\/div>","subj":"fsa"},{"n":23,"q":"Mandel Corp. reports under US GAAP and has a subsidiary located in a country that may become hyperinflationary. If this happens, Mandel must report the subsidiary's results using the:","opts":["temporal method after restating them for inflation.","temporal method without restating them for inflation.","current rate method after restating them for inflation."],"ans":"B","expl":"B is Correct because US GAAP simply require the foreign currency financial statements of such an entity to be translated as if the parent’s currency is the functional currency (i.e., the temporal method must be used with the resulting translation gain or loss reported in net income).","explhtml":"<p>B is Correct because US GAAP simply require the foreign currency financial statements of such an entity to be translated as if the parent’s currency is the functional currency (i.e., the temporal method must be used with the resulting translation gain or loss reported in net income).<\/p>","qhtml":"<div class=\"pp-topic\">Multinational Operations<\/div><div class=\"qtext\"><p>Mandel Corp. reports under US GAAP and has a subsidiary located in a country that may become hyperinflationary. If this happens, Mandel must report the subsidiary&#x27;s results using the:<\/p><\/div>","subj":"fsa"},{"n":24,"q":"A subsidiary of a European based parent company operates in a foreign country experiencing hyperinflation. The general price level and exchange rates for the country were reported as: If the subsidiary reported a capital stock of 100,000 (in foreign currency units) at the beginning of the year, the reported value at the end of the year is closest to:","opts":["€16,000.","€27,000.","€40,000."],"ans":"C","expl":"C is Correct because under IFRS, capital stock is first restated in terms of general price level and then translated at the current exchange rate at the end of the period. The restatement factor using the general price index is 2.5 (= 375/150). Therefore the inflation adjusted foreign currency value is 100,000 × 2.5 = 250,000. The ending exchange rate is 0.160 so the reported value is 250,000 × 0.160 = 40,000.","explhtml":"<p>C is Correct because under IFRS, capital stock is first restated in terms of general price level and then translated at the current exchange rate at the end of the period. The restatement factor using the general price index is 2.5 (= 375/150). Therefore the inflation adjusted foreign currency value is 100,000 × 2.5 = 250,000. The ending exchange rate is 0.160 so the reported value is 250,000 × 0.160 = 40,000.<\/p>","qhtml":"<div class=\"pp-topic\">Multinational Operations<\/div><div class=\"qtext\"><p>A subsidiary of a European based parent company operates in a foreign country experiencing hyperinflation. The general price level and exchange rates for the country were reported as:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp174.webp\" style=\"max-width:min(100%,550px)\" alt=\"\"><p>If the subsidiary reported a capital stock of 100,000 (in foreign currency units) at the beginning of the year, the reported value at the end of the year is closest to:<\/p><\/div>","subj":"fsa"},{"n":25,"q":"An analyst gathers the following information about a company's tax disclosures: Compared to Year T – 2, in Year T – 1 the company most likely generated:","opts":["a lower share of its profit in countries with higher marginal tax rates.","the same proportion of profit in countries with higher marginal tax rates.","a higher share of its profit in countries with higher marginal tax rates."],"ans":"C","expl":"C is correct because the effect of tax rates in foreign jurisdictions rose from 2% to 4%. This greater impact could indicate that profit mix shifted to countries with higher marginal tax rates. The change could also indicate that the marginal tax rates increased in the countries in which it earns profits.","explhtml":"<p>C is correct because the effect of tax rates in foreign jurisdictions rose from 2% to 4%. This greater impact could indicate that profit mix shifted to countries with higher marginal tax rates. The change could also indicate that the marginal tax rates increased in the countries in which it earns profits.<\/p>","qhtml":"<div class=\"pp-topic\">Multinational Operations<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company&#x27;s tax disclosures:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp175.webp\" style=\"max-width:min(100%,603px)\" alt=\"\"><p>Compared to Year T – 2, in Year T – 1 the company most likely generated:<\/p><\/div>","subj":"fsa"},{"n":26,"q":"An analyst gathers the following information from a company's notes to the consolidated financial statements: If there is no change in applicable tax rates, compared to Year T – 2, in Year T – 1 the company's mix of profits earned most likely:","opts":["shifted to countries with lower marginal tax rates.","remained unchanged.","shifted to countries with higher marginal tax rates."],"ans":"C","expl":"C is correct because \"[c]hanges in the effective tax rate impact of foreign taxes could be caused by changes in the applicable tax rates and/or changes in the mix of profits earned in different jurisdictions.\" The effect of tax rates in foreign jurisdictions increased from 1.8% in Year T – 2 to 2.3% in Year T – 1. If the applicable tax rates remained unchanged, the mix of profits earned is shifting to countries with higher marginal tax rates.","explhtml":"<p>C is correct because &quot;[c]hanges in the effective tax rate impact of foreign taxes could be caused by changes in the applicable tax rates and/or changes in the mix of profits earned in different jurisdictions.&quot; The effect of tax rates in foreign jurisdictions increased from 1.8% in Year T – 2 to 2.3% in Year T – 1. If the applicable tax rates remained unchanged, the mix of profits earned is shifting to countries with higher marginal tax rates.<\/p>","qhtml":"<div class=\"pp-topic\">Multinational Operations<\/div><div class=\"qtext\"><p>An analyst gathers the following information from a company&#x27;s notes to the consolidated financial statements:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp176.webp\" style=\"max-width:min(100%,550px)\" alt=\"\"><p>If there is no change in applicable tax rates, compared to Year T – 2, in Year T – 1 the company&#x27;s mix of profits earned most likely:<\/p><\/div>","subj":"fsa"},{"n":27,"q":"A company reported the following information related to its sales growth in the most recent year: The best estimate of its sustainable growth for the year is:","opts":["6%.","7%.","9%."],"ans":"C","expl":"C is Correct because volume and price increases are 7% + 2% = 9%. Growth in sales that comes from changes in volume or price is more sustainable than growth in sales that comes from changes in exchange rates. Further, management arguably has greater control over growth in sales resulting from greater volume or higher price than from changes in exchange rates.","explhtml":"<p>C is Correct because volume and price increases are 7% + 2% = 9%. Growth in sales that comes from changes in volume or price is more sustainable than growth in sales that comes from changes in exchange rates. Further, management arguably has greater control over growth in sales resulting from greater volume or higher price than from changes in exchange rates.<\/p>","qhtml":"<div class=\"pp-topic\">Multinational Operations<\/div><div class=\"qtext\"><p>A company reported the following information related to its sales growth in the most recent year:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp177.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>The best estimate of its sustainable growth for the year is:<\/p><\/div>","subj":"fsa"},{"n":28,"q":"An analyst gathers the following information about three multinational companies' sales growth drivers: The company with the highest sustainable sales growth is most likely:","opts":["Company 1.","Company 2.","Company 3."],"ans":"A","expl":"A is Correct because the main sales growth is from volume and price growth, which are considered more sustainable than growth that comes from changes in foreign exchange rates. The sales growth from volume and price for the companies are as follows: Hence, Company 1 has the highest sustainable growth from volume and price. For a multinational company, sales growth is driven not only by changes in volume and price but also by changes in the exchange rates between the reporting currency and the currency in which sales are made. Arguably, growth in sales that comes from changes in volume or price is more sustainable than growth in sales that comes from changes in exchange rates. Further, management arguably has greater control over growth in sales resulting from greater volume or higher price than from changes in exchange rates.","explhtml":"<p>A is Correct because the main sales growth is from volume and price growth, which are considered more sustainable than growth that comes from changes in foreign exchange rates. The sales growth from volume and price for the companies are as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp207.webp\" style=\"max-width:min(100%,721px)\" alt=\"\"><p>Hence, Company 1 has the highest sustainable growth from volume and price. For a multinational company, sales growth is driven not only by changes in volume and price but also by changes in the exchange rates between the reporting currency and the currency in which sales are made. Arguably, growth in sales that comes from changes in volume or price is more sustainable than growth in sales that comes from changes in exchange rates. Further, management arguably has greater control over growth in sales resulting from greater volume or higher price than from changes in exchange rates.<\/p>","qhtml":"<div class=\"pp-topic\">Multinational Operations<\/div><div class=\"qtext\"><p>An analyst gathers the following information about three multinational companies&#x27; sales growth drivers:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp178.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>The company with the highest sustainable sales growth is most likely:<\/p><\/div>","subj":"fsa"},{"n":29,"q":"A company based in the United Kingdom has significant operations in the United States and in Europe. It presents the following sensitivity analysis as part of its financial disclosures. The potential negative impact of an unfavorable change in the USD exchange rate is:","opts":["lower than the impact of an unfavorable change in the EUR exchange rate.","the same as the impact of an unfavorable change in the EUR exchange rate.","greater than the impact of an unfavorable change in the EUR exchange rate."],"ans":"A","expl":"A is Correct because the cash flow at risk is less for the USD than it is for the EUR. Total exposure is the starting point for analysis. In the next stage, these exposures are compared to all hedges that are in place. The net cash flow surplus represents an uncovered risk position. The cash-flow-at-risk approach involves allocating the impact of potential exchange rate fluctuations to operating cash flows on the basis of probability distributions. Volatilities and correlations serve as input factors to assess the relevant probability distributions.","explhtml":"<p>A is Correct because the cash flow at risk is less for the USD than it is for the EUR. Total exposure is the starting point for analysis. In the next stage, these exposures are compared to all hedges that are in place. The net cash flow surplus represents an uncovered risk position. The cash-flow-at-risk approach involves allocating the impact of potential exchange rate fluctuations to operating cash flows on the basis of probability distributions. Volatilities and correlations serve as input factors to assess the relevant probability distributions.<\/p>","qhtml":"<div class=\"pp-topic\">Multinational Operations<\/div><div class=\"qtext\"><p>A company based in the United Kingdom has significant operations in the United States and in Europe. It presents the following sensitivity analysis as part of its financial disclosures.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp179.webp\" style=\"max-width:min(100%,547px)\" alt=\"\"><p>The potential negative impact of an unfavorable change in the USD exchange rate is:<\/p><\/div>","subj":"fsa"},{"n":30,"q":"An analyst gathers the following information about a multinational company's additional disclosures section of the notes for a given fiscal year: EUR/USD is the amount of EUR per 1 USD. EUR/GBP is the amount of EUR per 1 GBP. The potential negative impact on earnings from exchange rate fluctuations is:","opts":["lower for USD than for GBP.","the same for both USD and GBP.","higher for USD than GBP."],"ans":"C","expl":"C is Correct because the cash flow at risk is higher for the USD exposure (being €40 million) compared to GBP exposure (being €30 million). Principal exposures are compared to all hedges that are in place. The net cash flow surplus represents an uncovered risk position. The cash-flow-at-risk approach involves allocating the impact of potentialexchange rate fluctuations to operating cash flows on the basis of probability distributions.","explhtml":"<p>C is Correct because the cash flow at risk is higher for the USD exposure (being €40 million) compared to GBP exposure (being €30 million). Principal exposures are compared to all hedges that are in place. The net cash flow surplus represents an uncovered risk position. The cash-flow-at-risk approach involves allocating the impact of potentialexchange rate fluctuations to operating cash flows on the basis of probability distributions.<\/p>","qhtml":"<div class=\"pp-topic\">Multinational Operations<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a multinational company&#x27;s additional disclosures section of the notes for a given fiscal year:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp180.webp\" style=\"max-width:min(100%,552px)\" alt=\"\"><p>EUR/USD is the amount of EUR per 1 USD. EUR/GBP is the amount of EUR per 1 GBP. The potential negative impact on earnings from exchange rate fluctuations is:<\/p><\/div>","subj":"fsa"},{"n":31,"q":"A US-based company has significant operations in Europe. If EUR strengthens relative to USD, after translating the European revenues into USD, the company's reported revenues most likely:","opts":["decrease.","remain unchanged.","increase."],"ans":"C","expl":"C is Correct because if the Euro strengthens relative to USD, the European revenues in EUR will be translated into an higher amount of USD revenues and hence overall increase the company's reported revenues. For a multinational company, sales growth is driven not only by changes in volume and price but also by changes in the exchange rates between the reporting currency and the currency in which sales are made.","explhtml":"<p>C is Correct because if the Euro strengthens relative to USD, the European revenues in EUR will be translated into an higher amount of USD revenues and hence overall increase the company&#x27;s reported revenues. For a multinational company, sales growth is driven not only by changes in volume and price but also by changes in the exchange rates between the reporting currency and the currency in which sales are made.<\/p>","qhtml":"<div class=\"pp-topic\">Multinational Operations<\/div><div class=\"qtext\"><p>A US-based company has significant operations in Europe. If EUR strengthens relative to USD, after translating the European revenues into USD, the company&#x27;s reported revenues most likely:<\/p><\/div>","subj":"fsa"},{"n":32,"q":"Share-based compensation with a multi-year vesting period is:","opts":["not recognized as an expense.","recognized as an expense equal to the present value of the estimated share value at settlement date.","measured at the fair value as of the grant date and recognized as an expense over the vesting period"],"ans":"C","expl":"C is Correct because for a given share-based compensation, the amount recognized over the vesting period equals the fair value, measured on the grant date. Also, for share-based compensation, fair value is measured only once, at the grant date. Any subsequent change in the fair value has no effect.","explhtml":"<p>C is Correct because for a given share-based compensation, the amount recognized over the vesting period equals the fair value, measured on the grant date. Also, for share-based compensation, fair value is measured only once, at the grant date. Any subsequent change in the fair value has no effect.<\/p>","qhtml":"<div class=\"pp-topic\">Employee Compensation: Post-Employment and Share-Based<\/div><div class=\"qtext\"><p>Share-based compensation with a multi-year vesting period is:<\/p><\/div>","subj":"fsa"},{"n":33,"q":"Which of the following is classified as short-term employee compensation?","opts":["Stock options","Sabbatical paid leave","Contributions to social security"],"ans":"C","expl":"C is Correct because contributions to social security schemes are considered short- term benefits.","explhtml":"<p>C is Correct because contributions to social security schemes are considered short- term benefits.<\/p>","qhtml":"<div class=\"pp-topic\">Employee Compensation: Post-Employment and Share-Based<\/div><div class=\"qtext\"><p>Which of the following is classified as short-term employee compensation?<\/p><\/div>","subj":"fsa"},{"n":34,"q":"When restricted stock units vest, the accounting entries include:","opts":["a transfer between two balance sheet accounts.","a compensation charge on the income statement.","an adjustment on the statement of cash flows when using the direct method."],"ans":"A","expl":"A is Correct because when restricted stock units (RSUs) vest, settlement occurs automatica
