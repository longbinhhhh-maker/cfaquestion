<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .stem .qtable{width:100%;border-collapse:collapse;margin:12px 0 2px;font-size:14.5px;
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stem .qtable th,.stem .qtable td{border:1px solid var(--line);padding:8px 11px;
    text-align:left;vertical-align:top}
  .stem .qtable thead th{background:var(--panel2);font-weight:700;color:var(--accent2)}
  .stem .qtable tbody td:first-child{font-weight:600}
  .stem .qtable td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
  .stem .qtable tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
  @media (max-width:520px){.stem .qtable{font-size:13px}.stem .qtable th,.stem .qtable td{padding:6px 8px}}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Jorge Fullen is evaluating a 7%, 10-year bond that is callable at par in 5 years. Coupon\npayments can be reinvested at an annual rate of 7%, and the current price of the bond is\n$1,065.00 per $1,000 of face value. The bond pays interest semiannually. Should Fullen\nconsider the yield to first call (YTC) or the yield to maturity (YTM) in making his purchase\ndecision?", "opts": ["YTM, since YTM is greater than YTC.", "YTC, since YTC is less than YTM.", "YTC, since YTC is greater than YTM."], "ans": "B", "expl": "The bond is trading at a premium, and if the bond is called at par that premium would be\namortized over a shorter period, resulting in a lower return. The lower return is the more\nconservative number, so the YTC should be used. You could use your financial calculator to\nsolve for YTC assuming 10 semiannual coupon payments of $35 (FV = 1,000; PMT = 35; PV =\n–1,065; N = 10; solve for i = 2.75; × 2 to get annual YTC = 5.5%). Calculation of YTM would\nuse the same inputs except N = 20, to get YTM = 6.12%\n(Module 53.1, LOS 53.a)"}, {"n": 2, "q": "A stated interest rate of 9% compounded quarterly results in an effective annual rate closest\nto:", "opts": ["9.2%.", "9.4%.", "9.3%."], "ans": "C", "expl": "Quarterly rate = 0.09 / 4 = 0.0225.\n4\nEffective annual rate = (1 + 0.0225) – 1 = 0.09308, or 9.308%.\n(Module 53.1, LOS 53.a)"}, {"n": 3, "q": "An interpolated spread (I-spread) for a bond is a yield spread relative to:", "opts": ["benchmark spot rates.", "risk-free bond yields.", "swap rates."], "ans": "C", "expl": "Spreads relative to swap rates are referred to as Interpolated or I-spreads.\n(Module 53.1, LOS 53.b)"}, {"n": 4, "q": "A 20-year, 9% annual coupon bond selling for $1,098.96 offers a yield of:", "opts": ["10%.", "8%.", "9%."], "ans": "B", "expl": "N = 20, PMT = 90, PV = -1,098.96, FV = 1,000, CPT I/Y\n(Module 53.1, LOS 53.a)"}, {"n": 5, "q": "An investor purchases a 5-year, A-rated, 7.95% coupon, semiannual-pay corporate bond at a\nyield to maturity of 8.20%. The bond is callable at 102 in three years. The bond's yield to call\nis closest to:", "opts": ["8.3%.", "8.9%.", "8.6%."], "ans": "B", "expl": "First determine the price paid for the bond:>\nN = 5 × 2 = 10; I/Y = 8.20 / 2 = 4.10; PMT = 7.95 / 2 = 3.975; FV = 100; CPT PV = –\n98.99\nThen use this value and the call price and date to determine the yield to call:\nN = 3 × 2 = 6; PMT = 7.95 / 2 = 3.975; PV = –98.99; FV = 102; CPT I/Y = 4.4686 × 2 =\n8.937%\n(Module 53.1, LOS 53.a)"}, {"n": 6, "q": "A 20-year, 9% semi-annual coupon bond selling for $914.20 offers a yield to maturity of:", "opts": ["8%.", "10%.", "9%."], "ans": "B", "expl": "N = 40; PMT = 45; PV = -914.20; FV = 1,000; CPT  I/Y = 5%\n→\nYTM = 5% × 2 = 10%\n(Module 53.1, LOS 53.a)"}, {"n": 7, "q": "A local bank advertises that it will pay interest at the rate of 4.5%, compounded monthly, on\nregular savings accounts. What is the effective rate of interest that the bank is paying on\nthese accounts?", "opts": ["4.65%.", "4.59%.", "4.50%."], "ans": "B", "expl": "12\n(1 + 0.045 / 12) – 1 = 1.0459 – 1 = 0.0459.\n(Module 53.1, LOS 53.a)"}, {"n": 8, "q": "For a bond trading at a discount, the current yield will most likely be:", "opts": ["lower than the yield to maturity.", "higher than the yield to maturity.", "the same as the yield to maturity."], "ans": "A", "expl": "The current yield (unlike the YTM) ignores movements toward par value along the\nconstant-yield price trajectory, and therefore will not capture the return attributable to a\ndiscount bond's increase in price toward par as maturity approaches.\n(Module 53.1, LOS 53.a)"}, {"n": 9, "q": "The bonds of Grinder Corp. trade at a G-spread of 150 basis points above comparable\nmaturity U.S. Treasury securities. The option adjusted spread (OAS) on the Grinder bonds is\n75 basis points. Using this information, and assuming that the Treasury yield curve is flat:", "opts": ["the option cost is 75 basis points.", "the zero-volatility spread is 225 basis points.", "the zero-volatility spread is 75 basis points."], "ans": "A", "expl": "The option cost is the difference between the zero volatility spread and the OAS, or 150 −\n75 = 75 bp. With a flat yield curve, the G-spread and zero volatility spread will be the same.\n(Module 53.1, LOS 53.b)"}, {"n": 10, "q": "Consider a bond selling for $1,150. This bond has 28 years to maturity, pays a 12% annual\ncoupon, and is callable in 8 years for $1,100. The yield to call is closest to:", "opts": ["10.05%.", "10.55%.", "9.25%."], "ans": "A", "expl": "N = 8; PMT = 120; PV = -1,150; FV = 1,100; CPT I/Y = 10.0554.\n(Module 53.1, LOS 53.a)"}, {"n": 11, "q": "Which of the following adjustments is most likely to be made to the day count convention\nwhen calculating corporate bond yield spreads to government bond yields?", "opts": ["Adjust the corporate bond yield to actual months and years.", "Adjust the government bond yield to actual months and years.", "Adjust both the corporate and government bond yields to actual months and years."], "ans": "A", "expl": "Corporate bond yields are typically based on a 30/360 day count. When calculating\nspreads, corporate yields are often restated to the actual/actual basis typically used to\nstate government bond yields.\n(Module 53.1, LOS 53.a)"}, {"n": 12, "q": "A local bank offers an account that pays 8%, compounded quarterly, for any deposits of\n$10,000 or more that are left in the account for a period of 5 years. The effective annual rate\nof interest on this account is:", "opts": ["4.65%.", "8.24%.", "9.01%."], "ans": "B", "expl": "m4\n(1 + periodic rate) – 1 = (1.02) – 1 = 8.24%.\n(Module 53.1, LOS 53.a)"}, {"n": 13, "q": "A stated annual interest rate of 9% compounded semiannually results in an effective annual\nrate closest to:", "opts": ["18.81%.", "9.2%.", "8.81%."], "ans": "B", "expl": "If the stated rate is 9% then the effective six month (period) rate is 9% / 2 = 4.5%\n# Periods in a year\nThe effective annual rate is, therefore, (1 + period rate) – 1\n2\nEAR = (1 + 4.5%) – 1 = 9.2%\n(Module 53.1, LOS 53.a)"}, {"n": 14, "q": "A $1,000 par value, 10% annual coupon bond with 15 years to maturity is priced at $951. The\nbond's yield to maturity is:", "opts": ["less than its current yield.", "greater than its current yield.", "equal to its current yield."], "ans": "B", "expl": "The bond's YTM is:\nN = 15; PMT = 100; PV = –951; FV = 1,000; CPT I/Y = 10.67%\nCurrent Yield = annual coupon payment / bond price\nCY = 100 / $951 = 0.1051 or 10.51%\n(Module 53.1, LOS 53.a)"}, {"n": 15, "q": "A $1,000 par value, 10%, semiannual, 20-year debenture bond is currently selling for $1,100.\nWhat is this bond's current yield and will the current yield be higher or lower than the yield\nto maturity?\nCurrent YieldCurrent Yield vs. YTM", "opts": ["8.9%higher", "8.9%lower", "9.1%higher"], "ans": "C", "expl": "Current yield = annual coupon payment/price of the bond\nCY = 100/1,100 = 0.0909\nThe current yield will be between the coupon rate and the yield to maturity. The bond is\nselling at a premium, so the YTM must be less than the coupon rate, and therefore the\ncurrent yield is greater than the YTM.\nThe YTM is calculated as: FV = 1,000; PV = -1,100; N = 40; PMT = 50; CPT  I = 4.46 × 2 =\n→\n8.92\n(Module 53.1, LOS 53.a)", "qhtml": "<p>A $1,000 par value, 10%, semiannual, 20-year debenture bond is currently selling for $1,100. What is this bond's current yield and will the current yield be higher or lower than the yield to maturity?</p><p><em>Options show → <strong>Current Yield</strong> | <strong>Current Yield vs. YTM</strong></em></p>"}, {"n": 16, "q": "What is the yield to call on a bond that has an 8% coupon paid annually, $1,000 face value,\n10 years to maturity and is first callable in 6 years? The current market price is $1,100. The\ncall price is the face value plus 1-year's interest.", "opts": ["7.02%.", "6.00%.", "7.14%."], "ans": "A", "expl": "N = 6; PV = -1,100.00; PMT = 80; FV = 1,080; Compute I/Y = 7.02%.\n(Module 53.1, LOS 53.a)"}, {"n": 17, "q": "Harmon Moving has a 13.25% coupon semiannual coupon bond currently trading in the\nmarket at $1,229.50. The bond has eight years remaining until maturity, but only two years\nuntil first call on the issue at 107.50% of $1,000 par value. Which of the following is closest to\nthe yield to first call on the bond?", "opts": ["4.72%.", "9.14%.", "5.16%."], "ans": "A", "expl": "To compute yield to first call, enter: FV = $1,075; N = 2 × 2 = 4; PMT = $66.25; PV = –\n1,229.50, CPT  I/Y = 2.36%, annualized as (2.36)(2) = 4.72%.\n→\n(Module 53.1, LOS 53.a)"}, {"n": 18, "q": "A Treasury bond due in one-year has a yield of 8.5%. A Treasury bond due in 5 years has a\nyield of 9.3%. A bond issued by Galaxy Motors due in 5 years has a yield of 9.9%. A bond\nissued by Exe due in one year has a yield of 9.4%. The yield spreads on the bonds issued by\nExe and Galaxy Motors are:\nExeGalaxy Motors", "opts": ["0.1%0.6%", "0.1%1.4%", "0.9%0.6%"], "ans": "C", "expl": "9.4 – 8.5 = 0.9\n9.9 – 9.3 = 0.6\n(Module 53.1, LOS 53.b)", "qhtml": "<p>A Treasury bond due in one-year has a yield of 8.5%. A Treasury bond due in 5 years has a yield of 9.3%. A bond issued by Galaxy Motors due in 5 years has a yield of 9.9%. A bond issued by Exe due in one year has a yield of 9.4%. The yield spreads on the bonds issued by Exe and Galaxy Motors are:</p><p><em>Options show → <strong>Exe</strong> | <strong>Galaxy Motors</strong></em></p>"}, {"n": 19, "q": "Consider a bond selling for $1,150. This bond has 28 years to maturity, pays a 12% annual\ncoupon, and is callable in 8 years for $1,100. The yield to maturity is closest to:", "opts": ["10.34%.", "10.55%.", "9.26%."], "ans": "A", "expl": "N = 28; PMT = 120; PV = –1,150; FV = 1,000; CPT I/Y = 10.3432.\n(Module 53.1, LOS 53.a)"}, {"n": 20, "q": "A single yield used to discount all of a bond's cash flows when calculating its price is most\naccurately described as the bond's:", "opts": ["yield to maturity.", "simple yield.", "current yield."], "ans": "A", "expl": "Yield to maturity is the discount rate used to discount each of a bond's cash flows when\ncalculating the bond's price. Current yield is a bond's annual coupon payment divided by\nits price. Simple yield is a bond's annual coupon payment plus amortization of a discount\nor minus amortization of a premium.\n(Module 53.1, LOS 53.a)"}, {"n": 21, "q": "A 20 year, 8% semi-annual coupon, $1,000 par value bond is selling for $1,100. The bond is\ncallable in 4 years at $1,080. What is the bond's yield to call?", "opts": ["6.87.", "7.21.", "8.13."], "ans": "A", "expl": "n = 4(2) = 8; PMT = 80/2 = 40; PV = -1,100; FV = 1,080\nCompute YTC = 3.435(2) = 6.87%\n(Module 53.1, LOS 53.a)"}, {"n": 22, "q": "A 6% bond paying coupons semi-annually has 10 years until maturity. The bond currently\ntrades at 111.5. Its yield to maturity is closest to:", "opts": ["4.529%.", "4.543.", "4.556%."], "ans": "C", "expl": "N = 10 × 2 = 20; PV = –111.5; PMT = 6 / 2 = 3; FV = 100.\nCompute I/Y = 2.2777 (semiannual) × 2 = 4.5554%.\n(Module 53.1, LOS 53.a)"}, {"n": 23, "q": "What is the effective annual rate if the stated rate is 12% compounded quarterly?", "opts": ["57.35%.", "11.49%.", "12.55%."], "ans": "C", "expl": "If the stated rate is 12%, then the effective quarterly (period) rate is 12% / 4 = 3%\n# periods in a year\nThe effective annual rate is, therefore, (1 + period rate) – 1\n4\nEAR = [1 + (0.12 / 4)] – 1 = 12.55%\n(Module 53.1, LOS 53.a)"}, {"n": 24, "q": "What is the equivalent annual-pay yield for a bond with a semiannual-bond basis yield of\n5.6%?", "opts": ["5.52%.", "5.60%.", "5.68%."], "ans": "C", "expl": "The annual-pay yield is computed as follows:\n2\nAnnual-pay yield = [(1 + 0.056 / 2) – 1 = 5.68%\n(Module 53.1, LOS 53.a)"}, {"n": 25, "q": "A 20-year, 10% semi-annual coupon bond selling for $925 has a yield to maturity (YTM) of:", "opts": ["9.23%.", "10.93%.", "11.23%."], "ans": "B", "expl": "N = 40, PMT = 50, PV = -925, FV = 1,000, CPT I/Y = 5.4653 × 2 = 10.9305.\n(Module 53.1, LOS 53.a)"}, {"n": 26, "q": "A 15-year, 10% annual coupon bond is sold for $1,150. It can be called at the end of 5 years\nfor $1,100. What is the bond's yield to call (YTC)?", "opts": ["8.0%.", "8.4%.", "9.2%."], "ans": "A", "expl": "Input into your calculator:\nN = 5; FV = 1,100; PMT = 100; PV = -1,150; CPT  I/Y = 7.95%.\n→\n(Module 53.1, LOS 53.a)"}, {"n": 27, "q": "A coupon bond pays annual interest, has a par value of $1,000, matures in 4 years, has a\ncoupon rate of $100, and a yield to maturity of 12%. The current yield on this bond is:", "opts": ["10.65%.", "11.25%.", "9.50%."], "ans": "A", "expl": "FV = 1,000; N = 4; PMT = 100; I = 12; CPT  PV = 939.25.\n→\nCurrent yield = coupon / current price\n100 / 939.25 × 100 = 10.65\n(Module 53.1, LOS 53.a)"}, {"n": 28, "q": "A 10% annual coupon, $1,000 par value bond that matures in 5 years is priced at 92.8. Its\nyield to maturity is closest to:", "opts": ["12%.", "10%.", "11%."], "ans": "A", "expl": "The YTM can be calculated using money values or percent-of par values.\nUsing percent of par: N = 5; FV = 100; PMT = 10; PV = –92.8; CPT I/Y = 11.9972.\nUsing money values: N = 5; FV = 1,000; PMT = 100; PV = –928; CPT I/Y = 11.9972.\n(Module 53.1, LOS 53.a)"}, {"n": 29, "q": "Consider a 5-year, semiannual, 10% coupon bond with a maturity value of 1,000 selling for\n$1,081.11. The first call date is 3 years from now and the call price is $1,030. What is the\nyield-to-call?", "opts": ["3.91%.", "7.28%.", "7.82%."], "ans": "C", "expl": "N = 6; PMT = 50; FV = 1,030; PV = –1,081.11; CPT  I = 3.91054\n→\n3.91054 × 2 = 7.82\n(Module 53.1, LOS 53.a)"}, {"n": 30, "q": "A 20-year bond pays an annual coupon of 6% and has a par value of $1,000. If its current\nyield is 7%, its yield to maturity is closest to:", "opts": ["7.0%.", "8.6%.", "7.4%."], "ans": "C", "expl": "We are given N, FV, and PMT, but to calculate the yield to maturity I/Y we also need the\nbond's current price (PV). We can use the given current yield to determine the price:\nBecause current yield = annual interest / price, we can state:\nPrice = annual interest / current yield\n= $60 /0.07%\n= $857.143\nTherefore: N = 20; FV = 1,000; PMT = 60; PV = –857.143; CPT  I/Y = 7.3896%\n→\n(Module 53.1, LOS 53.a)"}, {"n": 31, "q": "A major brokerage house is currently selling an investment product that offers an 8% rate of\nreturn, compounded monthly. Based on this information, it follows that this investment has:", "opts": ["a periodic interest rate of 0.667%.", "a stated rate of 0.830%.", "an effective annual rate of 8.00%."], "ans": "A", "expl": "Periodic rate = 8.0 / 12 = 0.667. Stated rate is 8.0% and effective rate is 8.30%.\n(Module 53.1, LOS 53.a)"}, {"n": 32, "q": "Other things equal, as the number of compounding periods increases, what is the effect on\nthe effective annual rate (EAR)?", "opts": ["EAR remains the same.", "EAR increases.", "EAR decreases."], "ans": "B", "expl": "The EAR increases with the frequency of compounding.\n(Module 53.1, LOS 53.a)"}, {"n": 33, "q": "If an investment has an APR of 18% and is compounded quarterly, its effective annual rate\n(EAR) is closest to:", "opts": ["18.00%.", "18.81%.", "19.25%."], "ans": "C", "expl": "Because this investment is compounded quarterly, we need to divide the APR by four\n4\ncompounding periods: 18 / 4 = 4.5%. EAR = (1.045) – 1 = 0.1925, or 19.25%.\n(Module 53.1, LOS 53.a)"}, {"n": 34, "q": "A 12% coupon bond with semiannual payments is callable in 5 years. The call price is $1,120.\nIf the bond is selling today for $1,110, what is the yield-to-call?", "opts": ["10.25%.", "10.95%.", "11.25%."], "ans": "B", "expl": "PMT = 60; N = 10; FV = 1,120; PV = –1,110; CPT  I = 5.47546\n→\n(5.47546)(2) = 10.95\n(Module 53.1, LOS 53.a)"}, {"n": 35, "q": "Tony Ly is a Treasury Manager with Deeter Holdings, a large consumer products holding\ncompany. The Assistant Treasurer has asked Ly to calculate the current yield and the Yield-\nto-first Call on a bond the company holds that has the following characteristics:\n7 years to maturity\n$1,000 face value\n7.0% semi-annual coupon\nPriced to yield 9.0%\nCallable at $1,060 in two years\nIf Ly calculates correctly, the current yield and yield to call are approximately:\nCYYTC", "opts": ["7.78%15.82%", "7.80%15.72%", "7.80%15.82%"], "ans": "C", "expl": "To calculate the CY and YTC, we first need to calculate the present value of the bond: FV =\n1,000, N = 14 = 7 × 2, PMT = 35 = (1000 × 0.07)/2, I/Y = 4.5 (9 / 2), Compute PV = -897.77\n(negative sign because we entered the FV and payment as positive numbers).\nThen, CY = (Face value × Coupon) / PV of bond = (1,000 × 0.07) / 897.77 = 7.80%.\nAnd finally, YTC  calculation: FV = 1,060 (price at first call), N = 4 (2 × 2), PMT = 35 (same as\nabove), PV = -897.77 (negative sign because we entered the FV and payment as positive\nnumbers), Compute I/Y = 7.91 (semi-annual rate, need to multiply by 2) = 15.82%.\n(Module 53.1, LOS 53.a)"}, {"n": 36, "q": "What is the yield to maturity (YTM) on a semiannual-bond basis of a 20-year, U.S. zero-\ncoupon bond selling for $300?", "opts": ["3.06%.", "6.11%.", "7.20%."], "ans": "B", "expl": "N = 40; PV = –300; FV = 1,000; CPT  I = 3.055 × 2 = 6.11.\n→\n(Module 53.1, LOS 53.a)"}, {"n": 37, "q": "An 11% coupon bond with annual payments and 10 years to maturity is callable in 3 years at\na call price of $1,100. If the bond is selling today for 975, the yield to call is:", "opts": ["10.26%.", "14.97%.", "9.25%."], "ans": "B", "expl": "PMT = 110, N = 3, FV = 1,100, PV = 975\nCompute I = 14.97\n(Module 53.1, LOS 53.a)"}, {"n": 38, "q": "Which of the following is the most accurate statement about stated and effective annual\ninterest rates?", "opts": ["So long as interest is compounded more than once a year, the stated annual rate will always be more than the effective rate.", "The stated annual interest rate is used to find the effective annual rate.", "The stated rate adjusts for the frequency of compounding."], "ans": "B", "expl": "The effective annual rate, not the stated rate, adjusts for the frequency of compounding.\nThe nominal, stated, and stated annual rates are all the same thing.\n(Module 53.1, LOS 53.a)"}, {"n": 39, "q": "A semiannual-pay bond is callable in five years at $1,080. The bond has an 8% coupon and\n15 years to maturity. If an investor pays $895 for the bond today, the yield to call is closest\nto:", "opts": ["10.2%.", "12.1%.", "9.3%."], "ans": "B", "expl": "YTC: N = 10; PV = –895; PMT = 80 / 2 = 40; FV = 1080; CPT  I/Y = 6.035 × 2 = 12.07%.\n→\n(Module 53.1, LOS 53.a)"}, {"n": 40, "q": "Which of the following describes the yield to worst? The:", "opts": ["yield given default on the bond.", "lowest of all possible yields to call.", "lowest of all possible prices on the bond."], "ans": "B", "expl": "Yield to worst involves the calculation of yield to call for every possible call date, and\ndetermining which of these results in the lowest expected return.\n(Module 53.1, LOS 53.a)"}, {"n": 41, "q": "A $1,000 bond with an annual coupon rate of 10% has 10 years to maturity and is currently\npriced at $800. The bond's yield-to-maturity is closest to:", "opts": ["12.6%.", "13.8%.", "11.7%."], "ans": "B", "expl": "FV = 1,000, PMT = 100, N = 10, PV = -800; Compute I/Y = 13.8\n(Module 53.1, LOS 53.a)"}, {"n": 42, "q": "What is the current yield for a 5% three-year bond whose price is $93.19?", "opts": ["2.68%.", "5.00%.", "5.37%."], "ans": "C", "expl": "The current yield is computed as follows:\nCurrent yield = 5% x 100 / $93.19 = 5.37%\n(Module 53.1, LOS 53.a)"}, {"n": 43, "q": "A disadvantage of G-spreads and I-spreads is that they are theoretically correct only if the\nspot yield curve is:", "opts": ["downward sloping.", "flat.", "upward sloping."], "ans": "B", "expl": "G-spreads and I-spreads are only correct when the spot yield curve is flat (yields are about\nthe same across maturities).\n(Module 53.1, LOS 53.b)"}, {"n": 44, "q": "A bond with a 12% semiannual coupon is currently trading at 102.25 per 100 of face value\nand has seven years to maturity. Which of the following is closest to the yield to maturity\n(YTM) on the bond?", "opts": ["11.21%.", "11.52%.", "11.91%."], "ans": "B", "expl": "To find the YTM, enter PV = –$1,022.50; PMT = $60; N = 14; FV = $1,000; CPT  I/Y = 5.76%.\n→\nNow multiply by 2 for the semiannual coupon payments: (5.76)(2) = 11.52%.\n(Module 53.1, LOS 53.a)"}, {"n": 45, "q": "If a $1,000 bond has a 14% coupon rate and a current price of 950, what is the current yield?", "opts": ["14.00%.", "14.74%.", "15.36%."], "ans": "B", "expl": "(0.14)(1,000) = $140 coupon\n140/950 × 100 = 14.74\n(Module 53.1, LOS 53.a)"}, {"n": 46, "q": "A fixed coupon callable bond issued by Protohype Inc. is trading with a yield to maturity of\n6.4%. Compared to this YTM, the bond's option-adjusted yield will be:", "opts": ["higher.", "lower.", "the same."], "ans": "B", "expl": "The option-adjusted yield is the yield a bond with an embedded option would have if it\nwere option-free. For a callable bond, the option-adjusted yield is lower than the YTM. This\nis because the call option may be exercised by the issuer, rather than the bondholder.\nBond investors require a higher yield to invest in a callable bond than they would require\non an otherwise identical option-free bond.\n(Module 53.1, LOS 53.b)"}, {"n": 47, "q": "Bond X is a noncallable corporate bond maturing in ten years. Bond Y is also a corporate\nbond maturing in ten years, but Bond Y is callable at any time beginning three years from\nnow. Both bonds carry a credit rating of AA. Based on this information:", "opts": ["Bond Y will have a higher zero-volatility spread than Bond X.", "The option adjusted spread of Bond Y will be greater than its zero-volatility spread.", "The zero-volatility spread of Bond X will be greater than its option-adjusted spread."], "ans": "A", "expl": "Bond Y will have the higher Z-spread due to the call option embedded in the bond. This\noption benefits the issuer, and investors will demand a higher yield to compensate for this\nfeature. The option-adjusted spread removes the value of the option from the spread\ncalculation, and would always be less than the Z-spread for a callable bond. Since Bond X\nis noncallable, the Z-spread and the OAS will be the same.\n(Module 53.1, LOS 53.b)"}, {"n": 48, "q": "A five-year bond with a 7.75% semiannual coupon currently trades at 101.245% of a par\nvalue of $1,000. Which of the following is closest to the current yield on the bond?", "opts": ["7.53%.", "7.65%.", "7.75%."], "ans": "B", "expl": "The current yield is computed as: (Annual Cash Coupon Payment) / (Current Bond Price).\nThe annual coupon is: ($1,000)(0.0775) = $77.50. The current yield is then: ($77.50) /\n($1,012.45) = 0.0765 = 7.65%.\n(Module 53.1, LOS 53.a)"}, {"n": 49, "q": "If a callable bond has an option-adjusted spread (OAS) of 75 basis points, this most likely\nsuggests:", "opts": ["the implied cost of the call option is the bond’s nominal spread minus 75 basis points.", "the bond has a zero-volatility spread greater than 75 basis points.", "the 75 basis points represent the investor’s compensation for credit risk, liquidity risk, and volatility risk."], "ans": "B", "expl": "For a bond with an embedded call option, the OAS is less than its zero-volatility spread by\nthe option cost. Therefore, the zero-volatility spread is greater than the OAS for callable\nbonds. If the embedded call option has any value to the issuer, a callable bond with an\nOAS of 75 basis points will have a Z-spread that is greater than 75 basis points.\nBecause the OAS represents the bond's spread to the spot yield curve excluding the effect\nof the embedded option, it does not include any compensation for the volatility risk\nrelated to the option. The implied cost of an embedded option is the difference between\nthe bond's zero-volatility spread (not the nominal spread) and its OAS.\n(Module 53.1, LOS 53.b)"}, {"n": 50, "q": "The zero volatility spread (Z-spread) is the spread that:", "opts": ["is added to each spot rate on the government yield curve that will cause the present value of the bond's cash flows to equal its market price.", "is added to the yield to maturity of a similar maturity government bond to equal the yield to maturity of the risky bond.", "results when the cost of the call option in percent is subtracted from the option adjusted spread."], "ans": "A", "expl": "The zero volatility spread (Z-spread) is the interest rate that is added to each zero-coupon\nbond spot rate that will cause the present value of the risky bond's cash flows to equal its\nmarket value. The nominal spread is the spread that is added to the YTM of a similar\nmaturity government bond that will then equal the YTM of the risky bond. The zero\nvolatility spread (Z-spread) is the spread that results when the cost of the call option in\npercent is added to the option adjusted spread.\n(Module 53.1, LOS 53.b)"}, {"n": 51, "q": "For a callable bond, the option-adjusted spread (OAS):", "opts": ["is less than the zero-volatility spread.", "is greater than the zero-volatility spread.", "can be greater than or equal to the zero-volatility spread."], "ans": "A", "expl": "For a callable bond, the OAS is less than the zero-volatility spread because of the extra\nyield required to compensate the bondholder for the call option.\n(Module 53.1, LOS 53.b)"}, {"n": 52, "q": "Neuman Company has bonds outstanding with five years to maturity that trade at a spread\nof +240 basis points above the five-year government bond yield. Neuman also has five-year\nbonds outstanding that are identical in all respects except that they are convertible into 30\nshares of Neuman common stock. At which of the following spreads are the convertible\nbonds most likely to trade?", "opts": ["+210 basis points.", "+270 basis points.", "+330 basis points."], "ans": "A", "expl": "Because a conversion option is favorable for the bondholder, the convertible bonds should\ntrade at a lower spread than otherwise identical non-convertible bonds.\n(Module 53.1, LOS 53.b)"}, {"n": 53, "q": "Venenata Foods has a 10-year bond outstanding with an annual coupon of 6.5%. If the bond\nis currently priced at $1,089.25, which of the following is closest to the semiannual-bond\nbasis yield?", "opts": ["5.33%.", "5.26%.", "5.42%."], "ans": "B", "expl": "First, find the annual yield to maturity of the bond as: FV = $1,000; PMT = $65; N = 10; PV =\n–1,089.25; CPT  I/Y = 5.33%. Then, find the semiannual-bond basis yield as: 2 × [(1 +\n→\n0.5\n0.0533) – 1] = 0.0526 = 5.26%.\n(Module 53.1, LOS 53.a)"}, {"n": 54, "q": "Calculate the current yield and the yield-to-first call on a bond with the following\ncharacteristics:\n5 years to maturity\n$1,000 face value\n8.75% semi-annual coupon\nPriced to yield 9.25%\nCallable at $1,025 in two years\nCurrent YieldYield-to-Call", "opts": ["8.93%11.02%", "8.93%5.51%", "9.83%19.80%"], "ans": "A", "expl": "To calculate the CY and YTC, we first need to calculate the present value of the bond: FV =\n1,000; N = 5 × 2 = 10; PMT = (1000 × 0.0875) / 2 = 43.75; I/Y = (9.25 / 2) = 4.625; CPT  PV =\n→\n-980.34 (negative sign because we entered the FV and payment as positive numbers).\nThen, CY = (Face value × Coupon) / PV of bond = (1,000 × 0.0875) / 980.34 = 8.93%.\nAnd the YTC calculation is: FV = 1,025 (price at first call); N = (2 × 2) = 4; PMT = 43.75 (same\nas above); PV = –980.34 (negative sign because we entered the FV and payment as positive\nnumbers); CPT  I/Y = 5.5117 (semi-annual rate, need to multiply by 2) = 11.02%.\n→\n(Module 53.1, LOS 53.a)", "qhtml": "<p>Calculate the current yield and the yield-to-first call on a bond with the following characteristics:</p><table class=\"qtable\"><thead><tr><th>Item</th><th>Value</th></tr></thead><tbody><tr><td>Years to maturity</td><td>5</td></tr><tr><td>Face value</td><td>$1,000</td></tr><tr><td>Coupon</td><td>8.75% semi-annual</td></tr><tr><td>Priced to yield</td><td>9.25%</td></tr><tr><td>Callable at</td><td>$1,025 in two years</td></tr></tbody></table><p><em>Options show → <strong>Current Yield</strong> | <strong>Yield-to-Call</strong></em></p>"}, {"n": 55, "q": "A 30-year, 10% annual coupon bond is sold at par. It can be called at the end of 10 years for\n$1,100. What is the bond's yield to call (YTC)?", "opts": ["10.6%.", "8.9%.", "10.0%."], "ans": "A", "expl": "N = 10; PMT = 100; PV = –1,000; FV = 1,100; CPT  I = 10.6.\n→\n(Module 53.1, LOS 53.a)"}, {"n": 56, "q": "McClintock 8% coupon bonds maturing in 10 years are currently trading at 97.55. These\nbonds are option-free and pay coupons semiannually. The McClintock bonds have a:", "opts": ["current yield less than 8.0%.", "true yield greater than the street convention.", "yield to maturity greater than 8.0%."], "ans": "C", "expl": "A bond trading at a discount will have a YTM greater than its coupon. The current yield is 8\n/ 97.55 = 8.2%. True yield is adjusted for payments delayed by weekends and holidays and\nis equal to or slightly less than the yield on a street convention basis.\n(Module 53.1, LOS 53.a)"}, {"n": 57, "q": "A 20-year, $1,000 face value, 10% semi-annual coupon bond is selling for $875. The bond's\nyield to maturity is:", "opts": ["11.62%.", "5.81%.", "11.43%."], "ans": "A", "expl": "N = 40 (2 × 20 years); PMT = 50 (0.10 × 1,000) / 2; PV = -875; FV = 1,000; CPT  I/Y = 5.811 ×\n→\n2 (for annual rate) = 11.62%.\n(Module 53.1, LOS 53.a)"}];
const CFG = {"title": "Yield and Yield Spread Measures for Fixed-Rate Bonds", "subtitle": "CFA · Fixed Income · Reading 53 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem";
    if(q.qhtml){ stem.innerHTML = q.qhtml; } else { stem.textContent = q.q; }
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>
</body>
