<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .stem .qtable{width:100%;border-collapse:collapse;margin:12px 0 2px;font-size:14.5px;
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stem .qtable th,.stem .qtable td{border:1px solid var(--line);padding:8px 11px;
    text-align:left;vertical-align:top}
  .stem .qtable thead th{background:var(--panel2);font-weight:700;color:var(--accent2)}
  .stem .qtable tbody td:first-child{font-weight:600}
  .stem .qtable td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
  .stem .qtable tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
  @media (max-width:520px){.stem .qtable{font-size:13px}.stem .qtable th,.stem .qtable td{padding:6px 8px}}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n":1,"q":"Jorge Fullen is evaluating a 7%, 10-year bond that is callable at par in 5 years. Coupon\npayments can be reinvested at an annual rate of 7%, and the current price of the bond is\n$1,065.00 per $1,000 of face value. The bond pays interest semiannually. Should Fullen\nconsider the yield to first call (YTC) or the yield to maturity (YTM) in making his purchase\ndecision?","opts":["YTM, since YTM is greater than YTC.","YTC, since YTC is less than YTM.","YTC, since YTC is greater than YTM."],"ans":"B","expl":"Trái phiếu đang giao dịch ở mức giá cao hơn và nếu trái phiếu được mua ở mức ngang bằng thì phí bảo hiểm đó sẽ được\nkhấu hao trong thời gian ngắn hơn, dẫn đến lợi nhuận thấp hơn. Lợi nhuận thấp hơn là số\nbảo thủ hơn, vì vậy nên sử dụng YTC. Bạn có thể sử dụng máy tính tài chính của mình để\ngiải YTC giả sử 10 khoản thanh toán phiếu giảm giá nửa năm một lần là $35 (FV = 1.000; PMT = 35; PV =\n–1.065; N = 10; giải i = 2,75; × 2 để có YTC hàng năm = 5,5%). Việc tính toán YTM sẽ\nsử dụng cùng các đầu vào ngoại trừ N = 20, để có được YTM = 6,12%\n(Mô-đun 53.1, LOS 53.a)"},{"n":2,"q":"A stated interest rate of 9% compounded quarterly results in an effective annual rate closest\nto:","opts":["9.2%.","9.4%.","9.3%."],"ans":"C","expl":"Lãi suất hàng quý = 0,09 / 4 = 0,0225.\n4\nLãi suất hiệu quả hàng năm = (1 + 0,0225) – 1 = 0,09308 hoặc 9,308%.\n(Mô-đun 53.1, LOS 53.a)"},{"n":3,"q":"An interpolated spread (I-spread) for a bond is a yield spread relative to:","opts":["benchmark spot rates.","risk-free bond yields.","swap rates."],"ans":"C","expl":"Chênh lệch so với tỷ giá hoán đổi được gọi là Chênh lệch nội suy hoặc Chênh lệch I.\n(Mô-đun 53.1, LOS 53.b)"},{"n":4,"q":"A 20-year, 9% annual coupon bond selling for $1,098.96 offers a yield of:","opts":["10%.","8%.","9%."],"ans":"B","expl":"N = 20, PMT = 90, PV = -1.098,96, FV = 1.000, CPT I/Y\n(Mô-đun 53.1, LOS 53.a)"},{"n":5,"q":"An investor purchases a 5-year, A-rated, 7.95% coupon, semiannual-pay corporate bond at a\nyield to maturity of 8.20%. The bond is callable at 102 in three years. The bond's yield to call\nis closest to:","opts":["8.3%.","8.9%.","8.6%."],"ans":"B","expl":"Trước tiên hãy xác định giá thanh toán cho trái phiếu:>\nN = 5 × 2 = 10; I/Y = 8,20 / 2 = 4,10; PMT = 7,95 / 2 = 3,975; FV = 100; CPT PV = –\n98,99\nSau đó, sử dụng giá trị này cũng như giá và ngày gọi để xác định lợi tức để gọi:\nN = 3 × 2 = 6; PMT = 7,95 / 2 = 3,975; PV = –98,99; FV = 102; CPT I/Y = 4,4686 × 2 =\n8,937%\n(Mô-đun 53.1, LOS 53.a)"},{"n":6,"q":"A 20-year, 9% semi-annual coupon bond selling for $914.20 offers a yield to maturity of:","opts":["8%.","10%.","9%."],"ans":"B","expl":"N = 40; PMT = 45; PV = -914,20; FV = 1.000; CPT I/Y = 5%\n→\nYTM = 5% × 2 = 10%\n(Mô-đun 53.1, LOS 53.a)"},{"n":7,"q":"A local bank advertises that it will pay interest at the rate of 4.5%, compounded monthly, on\nregular savings accounts. What is the effective rate of interest that the bank is paying on\nthese accounts?","opts":["4.65%.","4.59%.","4.50%."],"ans":"B","expl":"12\n(1 + 0,045 / 12) – 1 = 1,0459 – 1 = 0,0459.\n(Mô-đun 53.1, LOS 53.a)"},{"n":8,"q":"For a bond trading at a discount, the current yield will most likely be:","opts":["lower than the yield to maturity.","higher than the yield to maturity.","the same as the yield to maturity."],"ans":"A","expl":"Lợi suất hiện tại (không giống YTM) bỏ qua các chuyển động hướng tới mệnh giá dọc theo\nquỹ đạo giá lãi suất không đổi và do đó sẽ không nắm bắt được lợi nhuận do\ntrái phiếu chiết khấu tăng giá về ngang giá khi ngày đáo hạn đến gần.\n(Mô-đun 53.1, LOS 53.a)"},{"n":9,"q":"The bonds of Grinder Corp. trade at a G-spread of 150 basis points above comparable\nmaturity U.S. Treasury securities. The option adjusted spread (OAS) on the Grinder bonds is\n75 basis points. Using this information, and assuming that the Treasury yield curve is flat:","opts":["the option cost is 75 basis points.","the zero-volatility spread is 225 basis points.","the zero-volatility spread is 75 basis points."],"ans":"A","expl":"Chi phí quyền chọn là chênh lệch giữa chênh lệch biến động bằng 0 và OAS hoặc 150 −\n75 = 75 bp. Với đường cong lãi suất phẳng, chênh lệch G và chênh lệch biến động bằng 0 sẽ giống nhau.\n(Mô-đun 53.1, LOS 53.b)"},{"n":10,"q":"Consider a bond selling for $1,150. This bond has 28 years to maturity, pays a 12% annual\ncoupon, and is callable in 8 years for $1,100. The yield to call is closest to:","opts":["10.05%.","10.55%.","9.25%."],"ans":"A","expl":"N = 8; PMT = 120; PV = -1.150; FV = 1.100; CPT I/Y = 10,0554.\n(Mô-đun 53.1, LOS 53.a)"},{"n":11,"q":"Which of the following adjustments is most likely to be made to the day count convention\nwhen calculating corporate bond yield spreads to government bond yields?","opts":["Adjust the corporate bond yield to actual months and years.","Adjust the government bond yield to actual months and years.","Adjust both the corporate and government bond yields to actual months and years."],"ans":"A","expl":"Lợi suất trái phiếu doanh nghiệp thường dựa trên số lượng 30/360 ngày. Khi tính toán\nchênh lệch lợi suất doanh nghiệp thường được điều chỉnh lại theo cơ sở thực tế/thực tế thường được sử dụng để\nlợi suất trái phiếu chính phủ tiểu bang.\n(Mô-đun 53.1, LOS 53.a)"},{"n":12,"q":"A local bank offers an account that pays 8%, compounded quarterly, for any deposits of\n$10,000 or more that are left in the account for a period of 5 years. The effective annual rate\nof interest on this account is:","opts":["4.65%.","8.24%.","9.01%."],"ans":"B","expl":"m4\n(1 + tỷ lệ định kỳ) – 1 = (1,02) – 1 = 8,24%.\n(Mô-đun 53.1, LOS 53.a)"},{"n":13,"q":"A stated annual interest rate of 9% compounded semiannually results in an effective annual\nrate closest to:","opts":["18.81%.","9.2%.","8.81%."],"ans":"B","expl":"Nếu lãi suất đã nêu là 9% thì lãi suất sáu tháng (kỳ) hiệu lực là 9% / 2 = 4,5%\n# Khoảng thời gian trong một năm\nDo đó, tỷ lệ hiệu quả hàng năm là (1 + tỷ lệ kỳ) – 1\n2\nEAR = (1 + 4,5%) – 1 = 9,2%\n(Mô-đun 53.1, LOS 53.a)"},{"n":14,"q":"A $1,000 par value, 10% annual coupon bond with 15 years to maturity is priced at $951. The\nbond's yield to maturity is:","opts":["less than its current yield.","greater than its current yield.","equal to its current yield."],"ans":"B","expl":"YTM của trái phiếu là:\nN = 15; PMT = 100; PV = –951; FV = 1.000; CPT I/Y = 10,67%\nLợi suất hiện tại = thanh toán lãi trái phiếu hàng năm / giá trái phiếu\nCY = 100 / $951 = 0,1051 hoặc 10,51%\n(Mô-đun 53.1, LOS 53.a)"},{"n":15,"q":"A $1,000 par value, 10%, semiannual, 20-year debenture bond is currently selling for $1,100.\nWhat is this bond's current yield and will the current yield be higher or lower than the yield\nto maturity?\nCurrent YieldCurrent Yield vs. YTM","opts":["8.9% | higher","8.9% | lower","9.1% | higher"],"ans":"C","expl":"Lợi suất hiện tại = thanh toán phiếu lãi hàng năm/giá của trái phiếu\nCY = 100/1.100 = 0,0909\nLợi suất hiện tại sẽ nằm trong khoảng từ lãi suất coupon và lợi suất đến ngày đáo hạn. Trái phiếu được\nbán với giá cao hơn, do đó YTM phải thấp hơn lãi suất trái phiếu và do đó\nlợi suất hiện tại lớn hơn YTM.\nYTM được tính như sau: FV = 1.000; PV = -1.100; N = 40; PMT = 50; CPT I = 4,46 × 2 =\n→\n8,92\n(Mô-đun 53.1, LOS 53.a)","qhtml":"<p>A $1,000 par value, 10%, semiannual, 20-year debenture bond is currently selling for $1,100. What is this bond's current yield and will the current yield be higher or lower than the yield to maturity?</p><p><em>Options show → <strong>Current Yield</strong> | <strong>Current Yield vs. YTM</strong></em></p>"},{"n":16,"q":"What is the yield to call on a bond that has an 8% coupon paid annually, $1,000 face value,\n10 years to maturity and is first callable in 6 years? The current market price is $1,100. The\ncall price is the face value plus 1-year's interest.","opts":["7.02%.","6.00%.","7.14%."],"ans":"A","expl":"N = 6; PV = -1.100,00; PMT = 80; FV = 1.080; Tính I/Y = 7,02%.\n(Mô-đun 53.1, LOS 53.a)"},{"n":17,"q":"Harmon Moving has a 13.25% coupon semiannual coupon bond currently trading in the\nmarket at $1,229.50. The bond has eight years remaining until maturity, but only two years\nuntil first call on the issue at 107.50% of $1,000 par value. Which of the following is closest to\nthe yield to first call on the bond?","opts":["4.72%.","9.14%.","5.16%."],"ans":"A","expl":"Để tính lợi nhuận cho cuộc gọi đầu tiên, hãy nhập: FV = $1,075; N = 2 × 2 = 4; PMT = $66,25; PV = –\n1.229,50, CPT I/Y = 2,36%, được tính hàng năm là (2,36)(2) = 4,72%.\n→\n(Mô-đun 53.1, LOS 53.a)"},{"n":18,"q":"A Treasury bond due in one-year has a yield of 8.5%. A Treasury bond due in 5 years has a\nyield of 9.3%. A bond issued by Galaxy Motors due in 5 years has a yield of 9.9%. A bond\nissued by Exe due in one year has a yield of 9.4%. The yield spreads on the bonds issued by\nExe and Galaxy Motors are:\nExeGalaxy Motors","opts":["0.1% | 0.6%","0.1% | 1.4%","0.9% | 0.6%"],"ans":"C","expl":"9,4 – 8,5 = 0,9\n9,9 – 9,3 = 0,6\n(Mô-đun 53.1, LOS 53.b)","qhtml":"<p>A Treasury bond due in one-year has a yield of 8.5%. A Treasury bond due in 5 years has a yield of 9.3%. A bond issued by Galaxy Motors due in 5 years has a yield of 9.9%. A bond issued by Exe due in one year has a yield of 9.4%. The yield spreads on the bonds issued by Exe and Galaxy Motors are:</p><p><em>Options show → <strong>Exe</strong> | <strong>Galaxy Motors</strong></em></p>"},{"n":19,"q":"Consider a bond selling for $1,150. This bond has 28 years to maturity, pays a 12% annual\ncoupon, and is callable in 8 years for $1,100. The yield to maturity is closest to:","opts":["10.34%.","10.55%.","9.26%."],"ans":"A","expl":"N = 28; PMT = 120; PV = –1.150; FV = 1.000; CPT I/Y = 10,3432.\n(Mô-đun 53.1, LOS 53.a)"},{"n":20,"q":"A single yield used to discount all of a bond's cash flows when calculating its price is most\naccurately described as the bond's:","opts":["yield to maturity.","simple yield.","current yield."],"ans":"A","expl":"Lợi nhuận đến ngày đáo hạn là lãi suất chiết khấu được sử dụng để chiết khấu từng dòng tiền của trái phiếu khi\ntính giá trái phiếu. Lợi tức hiện tại là khoản thanh toán lãi hàng năm của trái phiếu chia cho\ngiá của nó. Lợi tức đơn giản là khoản thanh toán lãi hàng năm của trái phiếu cộng với khấu hao chiết khấu\nhoặc trừ đi khấu hao phần bù.\n(Mô-đun 53.1, LOS 53.a)"},{"n":21,"q":"A 20 year, 8% semi-annual coupon, $1,000 par value bond is selling for $1,100. The bond is\ncallable in 4 years at $1,080. What is the bond's yield to call?","opts":["6.87.","7.21.","8.13."],"ans":"A","expl":"n = 4(2) = 8; PMT = 80/2 = 40; PV = -1.100; FV = 1.080\nTính YTC = 3,435(2) = 6,87%\n(Mô-đun 53.1, LOS 53.a)"},{"n":22,"q":"A 6% bond paying coupons semi-annually has 10 years until maturity. The bond currently\ntrades at 111.5. Its yield to maturity is closest to:","opts":["4.529%.","4.543.","4.556%."],"ans":"C","expl":"N = 10 × 2 = 20; PV = –111,5; PMT = 6/2 = 3; FV = 100.\nTính I/Y = 2,2777 (nửa năm) × 2 = 4,5554%.\n(Mô-đun 53.1, LOS 53.a)"},{"n":23,"q":"What is the effective annual rate if the stated rate is 12% compounded quarterly?","opts":["57.35%.","11.49%.","12.55%."],"ans":"C","expl":"Nếu lãi suất đã nêu là 12% thì lãi suất (kỳ) hàng quý hiệu quả là 12% / 4 = 3%\n# kỳ trong một năm\nDo đó, lãi suất hiệu dụng hàng năm là (1 + lãi suất theo kỳ) – 1\n4\nEAR = [1 + (0,12 / 4)] – 1 = 12,55%\n(Mô-đun 53.1, LOS 53.a)"},{"n":24,"q":"What is the equivalent annual-pay yield for a bond with a semiannual-bond basis yield of\n5.6%?","opts":["5.52%.","5.60%.","5.68%."],"ans":"C","expl":"Tiền lương hàng năm được tính như sau:\n2\nLợi suất trả hàng năm = [(1 + 0,056 / 2) – 1 = 5,68%\n(Mô-đun 53.1, LOS 53.a)"},{"n":25,"q":"A 20-year, 10% semi-annual coupon bond selling for $925 has a yield to maturity (YTM) of:","opts":["9.23%.","10.93%.","11.23%."],"ans":"B","expl":"N = 40, PMT = 50, PV = -925, FV = 1.000, CPT I/Y = 5,4653 × 2 = 10,9305.\n(Mô-đun 53.1, LOS 53.a)"},{"n":26,"q":"A 15-year, 10% annual coupon bond is sold for $1,150. It can be called at the end of 5 years\nfor $1,100. What is the bond's yield to call (YTC)?","opts":["8.0%.","8.4%.","9.2%."],"ans":"A","expl":"Nhập vào máy tính của bạn:\nN = 5; FV = 1.100; PMT = 100; PV = -1.150; CPT I/Y = 7,95%.\n→\n(Mô-đun 53.1, LOS 53.a)"},{"n":27,"q":"A coupon bond pays annual interest, has a par value of $1,000, matures in 4 years, has a\ncoupon rate of $100, and a yield to maturity of 12%. The current yield on this bond is:","opts":["10.65%.","11.25%.","9.50%."],"ans":"A","expl":"FV = 1.000; N = 4; PMT = 100; tôi = 12; CPT PV = 939,25.\n→\nLợi suất hiện tại = phiếu giảm giá / giá hiện tại\n100 / 939,25 × 100 = 10,65\n(Mô-đun 53.1, LOS 53.a)"},{"n":28,"q":"A 10% annual coupon, $1,000 par value bond that matures in 5 years is priced at 92.8. Its\nyield to maturity is closest to:","opts":["12%.","10%.","11%."],"ans":"A","expl":"YTM có thể được tính bằng cách sử dụng giá trị tiền hoặc phần trăm của giá trị mệnh giá.\nSử dụng phần trăm mệnh giá: N = 5; FV = 100; PMT = 10; PV = –92,8; CPT I/Y = 11,9972.\nSử dụng giá trị tiền: N = 5; FV = 1.000; PMT = 100; PV = –928; CPT I/Y = 11,9972.\n(Mô-đun 53.1, LOS 53.a)"},{"n":29,"q":"Consider a 5-year, semiannual, 10% coupon bond with a maturity value of 1,000 selling for\n$1,081.11. The first call date is 3 years from now and the call price is $1,030. What is the\nyield-to-call?","opts":["3.91%.","7.28%.","7.82%."],"ans":"C","expl":"N = 6; PMT = 50; FV = 1.030; PV = –1.081,11; CPT I = 3.91054\n→\n3.91054 × 2 = 7.82\n(Mô-đun 53.1, LOS 53.a)"},{"n":30,"q":"A 20-year bond pays an annual coupon of 6% and has a par value of $1,000. If its current\nyield is 7%, its yield to maturity is closest to:","opts":["7.0%.","8.6%.","7.4%."],"ans":"C","expl":"Chúng ta có N, FV và PMT, nhưng để tính lãi suất đáo hạn I/Y, chúng ta cũng cần\ngiá hiện tại của trái phiếu (PV). Chúng ta có thể sử dụng lợi suất hiện tại nhất định để xác định giá:\nVì lợi suất hiện tại = lãi suất hàng năm / giá nên chúng ta có thể nêu:\nGiá = lãi suất hàng năm / lợi suất hiện tại\n= $60 /0,07%\n= $857,143\nDo đó: N = 20; FV = 1.000; PMT = 60; PV = –857.143; CPT I/Y = 7,3896%\n→\n(Mô-đun 53.1, LOS 53.a)"},{"n":31,"q":"A major brokerage house is currently selling an investment product that offers an 8% rate of\nreturn, compounded monthly. Based on this information, it follows that this investment has:","opts":["a periodic interest rate of 0.667%.","a stated rate of 0.830%.","an effective annual rate of 8.00%."],"ans":"A","expl":"Tỷ lệ định kỳ = 8,0 / 12 = 0,667. Tỷ lệ đã nêu là 8,0% và tỷ lệ hiệu quả là 8,30%.\n(Mô-đun 53.1, LOS 53.a)"},{"n":32,"q":"Other things equal, as the number of compounding periods increases, what is the effect on\nthe effective annual rate (EAR)?","opts":["EAR remains the same.","EAR increases.","EAR decreases."],"ans":"B","expl":"EAR tăng theo tần suất gộp.\n(Mô-đun 53.1, LOS 53.a)"},{"n":33,"q":"If an investment has an APR of 18% and is compounded quarterly, its effective annual rate\n(EAR) is closest to:","opts":["18.00%.","18.81%.","19.25%."],"ans":"C","expl":"Vì khoản đầu tư này được gộp hàng quý nên chúng ta cần chia APR cho 4\n4\nthời gian gộp: 18/4 = 4,5%. EAR = (1,045) – 1 = 0,1925 hoặc 19,25%.\n(Mô-đun 53.1, LOS 53.a)"},{"n":34,"q":"A 12% coupon bond with semiannual payments is callable in 5 years. The call price is $1,120.\nIf the bond is selling today for $1,110, what is the yield-to-call?","opts":["10.25%.","10.95%.","11.25%."],"ans":"B","expl":"PMT = 60; N = 10; FV = 1.120; PV = –1.110; CPT I = 5.47546\n→\n(5.47546)(2) = 10,95\n(Mô-đun 53.1, LOS 53.a)"},{"n":35,"q":"Tony Ly is a Treasury Manager with Deeter Holdings, a large consumer products holding\ncompany. The Assistant Treasurer has asked Ly to calculate the current yield and the Yield-\nto-first Call on a bond the company holds that has the following characteristics:\n7 years to maturity\n$1,000 face value\n7.0% semi-annual coupon\nPriced to yield 9.0%\nCallable at $1,060 in two years\nIf Ly calculates correctly, the current yield and yield to call are approximately:\nCYYTC","opts":["7.78% | 15.82%","7.80% | 15.72%","7.80% | 15.82%"],"ans":"C","expl":"Để tính CY và YTC, trước tiên chúng ta cần tính giá trị hiện tại của trái phiếu: FV =\n1.000, N = 14 = 7 × 2, PMT = 35 = (1000 × 0,07)/2, I/Y = 4,5 (9 / 2), Tính PV = -897,77\n(dấu âm vì chúng ta đã nhập FV và thanh toán dưới dạng số dương).\nSau đó, CY = (Mệnh giá × Phiếu giảm giá) / PV của trái phiếu = (1.000 × 0,07) / 897,77 = 7,80%.\nVà cuối cùng, tính toán YTC: FV = 1.060 (giá ở cuộc gọi đầu tiên), N = 4 (2 × 2), PMT = 35 (giống như\nở trên), PV = -897,77 (dấu âm vì chúng tôi đã nhập FV và thanh toán dưới dạng số dương\n), Tính toán I/Y = 7,91 (lãi suất nửa năm, cần nhân với 2) = 15,82%.\n(Mô-đun 53.1, LOS 53.a)","qhtml":"<p>Tony Ly is a Treasury Manager with Deeter Holdings, a large consumer products holding company. The Assistant Treasurer has asked Ly to calculate the current yield and the Yield- to-first Call on a bond the company holds that has the following characteristics:</p><p>7 years to maturity $1,000 face value 7.0% semi-annual coupon Priced to yield 9.0% Callable at $1,060 in two years If Ly calculates correctly, the current yield and yield to call are approximately:</p><p><em>Options show → <strong>Current Yield</strong> | <strong>Yield-to-Call</strong></em></p>"},{"n":36,"q":"What is the yield to maturity (YTM) on a semiannual-bond basis of a 20-year, U.S. zero-\ncoupon bond selling for $300?","opts":["3.06%.","6.11%.","7.20%."],"ans":"B","expl":"N = 40; PV = –300; FV = 1.000; CPT I = 3,055 × 2 = 6,11.\n→\n(Mô-đun 53.1, LOS 53.a)"},{"n":37,"q":"An 11% coupon bond with annual payments and 10 years to maturity is callable in 3 years at\na call price of $1,100. If the bond is selling today for 975, the yield to call is:","opts":["10.26%.","14.97%.","9.25%."],"ans":"B","expl":"PMT = 110, N = 3, FV = 1.100, PV = 975\nTính I = 14,97\n(Mô-đun 53.1, LOS 53.a)"},{"n":38,"q":"Which of the following is the most accurate statement about stated and effective annual\ninterest rates?","opts":["So long as interest is compounded more than once a year, the stated annual rate will always be more than the effective rate.","The stated annual interest rate is used to find the effective annual rate.","The stated rate adjusts for the frequency of compounding."],"ans":"B","expl":"Lãi suất thực tế hàng năm, không phải lãi suất đã nêu, điều chỉnh theo tần suất gộp.\nLãi suất danh nghĩa, lãi suất đã nêu và lãi suất hàng năm đã nêu đều giống nhau.\n(Mô-đun 53.1, LOS 53.a)"},{"n":39,"q":"A semiannual-pay bond is callable in five years at $1,080. The bond has an 8% coupon and\n15 years to maturity. If an investor pays $895 for the bond today, the yield to call is closest\nto:","opts":["10.2%.","12.1%.","9.3%."],"ans":"B","expl":"YTC: N = 10; PV = –895; PMT = 80/2 = 40; FV = 1080; CPT I/Y = 6,035 × 2 = 12,07%.\n→\n(Mô-đun 53.1, LOS 53.a)"},{"n":40,"q":"Which of the following describes the yield to worst? The:","opts":["yield given default on the bond.","lowest of all possible yields to call.","lowest of all possible prices on the bond."],"ans":"B","expl":"Lợi suất đến mức tồi tệ nhất liên quan đến việc tính toán lợi nhuận cho mỗi ngày gọi có thể xảy ra và\nxác định kết quả nào trong số này mang lại lợi nhuận kỳ vọng thấp nhất.\n(Mô-đun 53.1, LOS 53.a)"},{"n":41,"q":"A $1,000 bond with an annual coupon rate of 10% has 10 years to maturity and is currently\npriced at $800. The bond's yield-to-maturity is closest to:","opts":["12.6%.","13.8%.","11.7%."],"ans":"B","expl":"FV = 1.000, PMT = 100, N = 10, PV = -800; Tính toán I/Y = 13,8\n(Mô-đun 53.1, LOS 53.a)"},{"n":42,"q":"What is the current yield for a 5% three-year bond whose price is $93.19?","opts":["2.68%.","5.00%.","5.37%."],"ans":"C","expl":"Sản lượng hiện tại được tính như sau:\nLợi suất hiện tại = 5% x 100 / $93,19 = 5,37%\n(Mô-đun 53.1, LOS 53.a)"},{"n":43,"q":"A disadvantage of G-spreads and I-spreads is that they are theoretically correct only if the\nspot yield curve is:","opts":["downward sloping.","flat.","upward sloping."],"ans":"B","expl":"Chênh lệch G và chênh lệch I chỉ đúng khi đường cong lãi suất giao ngay bằng phẳng (lợi suất\ngiống nhau ở các kỳ hạn).\n(Mô-đun 53.1, LOS 53.b)"},{"n":44,"q":"A bond with a 12% semiannual coupon is currently trading at 102.25 per 100 of face value\nand has seven years to maturity. Which of the following is closest to the yield to maturity\n(YTM) on the bond?","opts":["11.21%.","11.52%.","11.91%."],"ans":"B","expl":"Để tìm YTM, hãy nhập PV = –$1.022,50; PMT = $60; N = 14; FV = $1.000; CPT I/Y = 5,76%.\n→\nBây giờ nhân với 2 cho các khoản thanh toán phiếu lãi nửa năm: (5,76)(2) = 11,52%.\n(Mô-đun 53.1, LOS 53.a)"},{"n":45,"q":"If a $1,000 bond has a 14% coupon rate and a current price of 950, what is the current yield?","opts":["14.00%.","14.74%.","15.36%."],"ans":"B","expl":"(0,14)(1.000) = phiếu giảm giá $140\n140/950 × 100 = 14,74\n(Mô-đun 53.1, LOS 53.a)"},{"n":46,"q":"A fixed coupon callable bond issued by Protohype Inc. is trading with a yield to maturity of\n6.4%. Compared to this YTM, the bond's option-adjusted yield will be:","opts":["higher.","lower.","the same."],"ans":"B","expl":"Lợi suất được điều chỉnh theo tùy chọn là lợi suất mà một trái phiếu có tùy chọn nhúng sẽ có nếu nó\nkhông có tùy chọn. Đối với trái phiếu có thể mua lại, lợi suất điều chỉnh theo quyền chọn thấp hơn YTM. Điều này\nlà do quyền chọn mua có thể được thực hiện bởi tổ chức phát hành chứ không phải chủ sở hữu trái phiếu.\nCác nhà đầu tư trái phiếu yêu cầu lợi suất cao hơn để đầu tư vào một trái phiếu có thể mua lại so với mức họ yêu cầu\ntrên một trái phiếu không có quyền chọn giống hệt nhau.\n(Mô-đun 53.1, LOS 53.b)"},{"n":47,"q":"Bond X is a noncallable corporate bond maturing in ten years. Bond Y is also a corporate\nbond maturing in ten years, but Bond Y is callable at any time beginning three years from\nnow. Both bonds carry a credit rating of AA. Based on this information:","opts":["Bond Y will have a higher zero-volatility spread than Bond X.","The option adjusted spread of Bond Y will be greater than its zero-volatility spread.","The zero-volatility spread of Bond X will be greater than its option-adjusted spread."],"ans":"A","expl":"Trái phiếu Y sẽ có mức chênh lệch Z cao hơn do quyền chọn mua được nhúng trong trái phiếu. Tùy chọn\nnày mang lại lợi ích cho nhà phát hành và các nhà đầu tư sẽ yêu cầu lợi suất cao hơn để bù đắp cho tính năng\nnày. Chênh lệch được điều chỉnh theo quyền chọn sẽ loại bỏ giá trị của quyền chọn khỏi phép tính chênh lệch\n và sẽ luôn nhỏ hơn mức chênh lệch Z đối với trái phiếu có thể thu hồi được. Vì Bond X\nkhông thể gọi được nên mức chênh lệch Z và OAS sẽ giống nhau.\n(Mô-đun 53.1, LOS 53.b)"},{"n":48,"q":"A five-year bond with a 7.75% semiannual coupon currently trades at 101.245% of a par\nvalue of $1,000. Which of the following is closest to the current yield on the bond?","opts":["7.53%.","7.65%.","7.75%."],"ans":"B","expl":"Lợi suất hiện tại được tính là: (Thanh toán phiếu giảm giá tiền mặt hàng năm) / (Giá trái phiếu hiện tại).\nPhiếu giảm giá hàng năm là: ($1.000)(0,0775) = $77,50. Khi đó lợi suất hiện tại là: ($77,50) /\n($1.012,45) = 0,0765 = 7,65%.\n(Mô-đun 53.1, LOS 53.a)"},{"n":49,"q":"If a callable bond has an option-adjusted spread (OAS) of 75 basis points, this most likely\nsuggests:","opts":["the implied cost of the call option is the bond’s nominal spread minus 75 basis points.","the bond has a zero-volatility spread greater than 75 basis points.","the 75 basis points represent the investor’s compensation for credit risk, liquidity risk, and volatility risk."],"ans":"B","expl":"Đối với trái phiếu có quyền chọn mua được nhúng, OAS thấp hơn mức chênh lệch biến động bằng 0 của\nchi phí quyền chọn. Do đó, mức chênh lệch không biến động bằng 0 lớn hơn OAS đối với trái phiếu\ncó thể gọi được. Nếu quyền chọn mua được nhúng có bất kỳ giá trị nào đối với nhà phát hành, một trái phiếu có thể mua lại với\nOAS là 75 điểm cơ bản sẽ có mức chênh lệch Z lớn hơn 75 điểm cơ bản.\nVì OAS thể hiện chênh lệch của trái phiếu đối với đường cong lãi suất giao ngay không bao gồm ảnh hưởng\ncủa quyền chọn được nhúng nên nó không bao gồm bất kỳ khoản bồi thường nào cho rủi ro biến động\nliên quan đến tùy chọn. Chi phí ngụ ý của một quyền chọn nhúng là chênh lệch giữa\nchênh lệch không biến động của trái phiếu (không phải chênh lệch danh nghĩa) và OAS của nó.\n(Mô-đun 53.1, LOS 53.b)"},{"n":50,"q":"The zero volatility spread (Z-spread) is the spread that:","opts":["is added to each spot rate on the government yield curve that will cause the present value of the bond's cash flows to equal its market price.","is added to the yield to maturity of a similar maturity government bond to equal the yield to maturity of the risky bond.","results when the cost of the call option in percent is subtracted from the option adjusted spread."],"ans":"A","expl":"Chênh lệch biến động bằng 0 (chênh lệch Z) là lãi suất được thêm vào mỗi lãi suất giao ngay trái phiếu không phiếu giảm giá\nsẽ khiến giá trị hiện tại của dòng tiền của trái phiếu rủi ro bằng với\ngiá trị thị trường. Chênh lệch danh nghĩa là chênh lệch được thêm vào YTM của một trái phiếu chính phủ có kỳ hạn\ntương tự, khi đó sẽ bằng YTM của trái phiếu rủi ro. Chênh lệch biến động bằng 0\n(Chênh lệch Z) là chênh lệch xảy ra khi chi phí của quyền chọn mua tính theo\nphần trăm được thêm vào chênh lệch đã điều chỉnh của quyền chọn.\n(Mô-đun 53.1, LOS 53.b)"},{"n":51,"q":"For a callable bond, the option-adjusted spread (OAS):","opts":["is less than the zero-volatility spread.","is greater than the zero-volatility spread.","can be greater than or equal to the zero-volatility spread."],"ans":"A","expl":"Đối với một trái phiếu có thể mua lại, OAS thấp hơn mức chênh lệch không biến động bằng 0 do lợi tức\nthêm cần thiết để bù đắp cho trái chủ đối với quyền chọn mua.\n(Mô-đun 53.1, LOS 53.b)"},{"n":52,"q":"Neuman Company has bonds outstanding with five years to maturity that trade at a spread\nof +240 basis points above the five-year government bond yield. Neuman also has five-year\nbonds outstanding that are identical in all respects except that they are convertible into 30\nshares of Neuman common stock. At which of the following spreads are the convertible\nbonds most likely to trade?","opts":["+210 basis points.","+270 basis points.","+330 basis points."],"ans":"A","expl":"Vì quyền chọn chuyển đổi có lợi cho người nắm giữ trái phiếu nên trái phiếu chuyển đổi nên\ngiao dịch với mức chênh lệch thấp hơn so với các trái phiếu không chuyển đổi giống hệt nhau.\n(Mô-đun 53.1, LOS 53.b)"},{"n":53,"q":"Venenata Foods has a 10-year bond outstanding with an annual coupon of 6.5%. If the bond\nis currently priced at $1,089.25, which of the following is closest to the semiannual-bond\nbasis yield?","opts":["5.33%.","5.26%.","5.42%."],"ans":"B","expl":"Đầu tiên, hãy tìm lợi tức đến ngày đáo hạn hàng năm của trái phiếu là: FV = $1.000; PMT = $65; N = 10; PV =\n–1.089,25; CPT I/Y = 5,33%. Sau đó, tìm lợi suất cơ sở trái phiếu nửa năm là: 2 × [(1 +\n→\n0,5\n0,0533) – 1] = 0,0526 = 5,26%.\n(Module 53.1, LOS 53.a)"},{"n":54,"q":"Calculate the current yield and the yield-to-first call on a bond with the following\ncharacteristics:\n5 years to maturity\n$1,000 face value\n8.75% semi-annual coupon\nPriced to yield 9.25%\nCallable at $1,025 in two years\nCurrent YieldYield-to-Call","opts":["8.93% | 11.02%","8.93% | 5.51%","9.83% | 19.80%"],"ans":"A","expl":"Để tính CY và YTC, trước tiên chúng ta cần tính giá trị hiện tại của trái phiếu: FV =\n1.000; N = 5 × 2 = 10; PMT = (1000 × 0,0875) / 2 = 43,75; I/Y = (9,25 / 2) = 4,625; CPT PV =\n→\n-980,34 (dấu âm vì chúng tôi đã nhập FV và thanh toán dưới dạng số dương).\nSau đó, CY = (Mệnh giá × Phiếu giảm giá) / PV của trái phiếu = (1.000 × 0,0875) / 980,34 = 8,93%.\nVà phép tính YTC là: FV = 1.025 (giá gọi lần đầu); N = (2 × 2) = 4; PMT = 43,75 (tương tự\nnhư trên); PV = –980,34 (dấu âm vì chúng tôi đã nhập FV và thanh toán dưới dạng số dương\n); CPT I/Y = 5,5117 (tỷ lệ nửa năm, cần nhân với 2) = 11,02%.\n→\n(Mô-đun 53.1, LOS 53.a)","qhtml":"<p>Calculate the current yield and the yield-to-first call on a bond with the following characteristics:</p><table class=\"qtable\"><thead><tr><th>Item</th><th>Value</th></tr></thead><tbody><tr><td>Years to maturity</td><td>5</td></tr><tr><td>Face value</td><td>$1,000</td></tr><tr><td>Coupon</td><td>8.75% semi-annual</td></tr><tr><td>Priced to yield</td><td>9.25%</td></tr><tr><td>Callable at</td><td>$1,025 in two years</td></tr></tbody></table><p><em>Options show → <strong>Current Yield</strong> | <strong>Yield-to-Call</strong></em></p>"},{"n":55,"q":"A 30-year, 10% annual coupon bond is sold at par. It can be called at the end of 10 years for\n$1,100. What is the bond's yield to call (YTC)?","opts":["10.6%.","8.9%.","10.0%."],"ans":"A","expl":"N = 10; PMT = 100; PV = –1.000; FV = 1.100; CPT I = 10,6.\n→\n(Mô-đun 53.1, LOS 53.a)"},{"n":56,"q":"McClintock 8% coupon bonds maturing in 10 years are currently trading at 97.55. These\nbonds are option-free and pay coupons semiannually. The McClintock bonds have a:","opts":["current yield less than 8.0%.","true yield greater than the street convention.","yield to maturity greater than 8.0%."],"ans":"C","expl":"Một giao dịch trái phiếu ở mức chiết khấu sẽ có YTM lớn hơn phiếu giảm giá của nó. Sản lượng hiện tại là 8\n/ 97,55 = 8,2%. Lợi suất thực được điều chỉnh đối với các khoản thanh toán bị trì hoãn vào cuối tuần và ngày lễ và\nbằng hoặc thấp hơn một chút so với lợi nhuận trên cơ sở hội nghị đường phố.\n(Mô-đun 53.1, LOS 53.a)"},{"n":57,"q":"A 20-year, $1,000 face value, 10% semi-annual coupon bond is selling for $875. The bond's\nyield to maturity is:","opts":["11.62%.","5.81%.","11.43%."],"ans":"A","expl":"N = 40 (2 × 20 năm); PMT = 50 (0,10 × 1.000)/2; PV = -875; FV = 1.000; CPT I/Y = 5,811 ×\n→\n2 (đối với lãi suất hàng năm) = 11,62%.\n(Mô-đun 53.1, LOS 53.a)"}];

function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");

  DATA.forEach((q,i)=>{

    pin.onclick = ()=>togglePin(i);

      else { grade(true); }

// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  return sections;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>

/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>

    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script id="qnotes-panel-js">
(function(){

    var fr=document.getElementById("qnotesFrame");
    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.qnotesClose=function(){
    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;

    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;

  });
  head.addEventListener("pointermove",function(e){

    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);

    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
