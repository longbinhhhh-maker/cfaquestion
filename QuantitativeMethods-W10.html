<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "An investor receives a research report that analyzes two securities through a simple linear regression. The study discloses the coefficient of determination (R2) and the sum of squares error (SSE). To estimate the accuracy of the model using an absolute measure of the errors, the investor will most likely need to know the:", "opts": ["sample size.", "regression coefficients.", "correlation between the securities."], "ans": "A", "expl": "The standard error of the estimate (s ) is an absolute (ie, not relative) measure of the accuracy of the regression, as reflected by the average\ne\ndistance between each predicted (Ŷ) and observed (Y) values of the dependent variable. Since s is the square root of the mean square error\ne\n(MSE) , it is presented in the same units as Y. Smaller values of s mean that the regression line is a better fit of the data.\ne\nIn this scenario, s is the correct statistic to use since the investor wants an absolute measure of the accuracy of the model. Other measures of\ne\ngoodness of fit, such as the coefficient of determination (R2) and the F-statistic, provide a relative measure and are not appropriate for this case.\nSince this scenario does not provide the MSE, it must be calculated as the ratio of:\nthe sum of squares error (SSE), or residual sum of squares, to\nthe degrees of freedom, derived from the sample size (n) and the number of variables.\nSince there are two variables and SSE is known, the investor will need to know n to calculate s .\ne\n(Choices B and C) The regression coefficients (ie, the intercept and the slope, and the correlation between the variables are not necessary to\ncalculate s .\ne\nThings to remember:\nThe standard error of the estimate (s ) is an absolute (ie, not relative) measure of the accuracy of the regression, presented in the same data units\ne\nas the dependent variable. s is the square root of the mean square error (MSE), which is the ratio of the residual sum of squares to the degrees\ne\nof freedom.\nDescribe the use of analysis of variance (ANOVA) in regression analysis, interpret ANOVA results, and calculate and interpret the standard error\nof Estimate in a simple linear regression", "qhtml": null}, {"n": 2, "q": "An economist runs the following regression models between two macroeconomic datasets with variable transformations: Regression M1 M2 Model lnY = b + b X + ε lnY = b + b lnX + ε 0 1 0 1 Intercept 5.723 5.338 Slope 0.233 1.184 Coefficient of determination (R2) 0.830 0.573 Standard error of the estimate (s ) 0.415 0.658 e F-statistic 137.001 37.624 Based only on this data, which of the following functional forms is the most appropriate fit for the sample data?", "opts": ["Lin-log", "Log-lin", "Log-log"], "ans": "B", "expl": "Linearity is one of the four key assumptions of a simple linear regression. However, even if data sets do not have a linear relationship, a simple\nlinear regression can be used by transforming one or both variables by using, for example, the square, the reciprocal, or the log of the variable.\nThis results in distinct functional forms, allowing the regression to better fit a curvature. These transformed models have linear parameters (ie,\nthe intercept b and the slope b ), although the variables are not linear.\n0 1\nIn this scenario:\nM1 is a log-lin model, with a logarithmic dependent variable (lnY) and a linear independent variable (X), and\nM2 is a log-log model, with both variables in their logarithmic forms.\nThe study show that M1 has the largest coefficient of determination and F-statistic, and the smallest standard error of the estimate. Therefore, the\nlog-lin model displays the best fit for the data (Choice C).\nIt is important to remember that regression statistics can be compared for regressions only when each regression's dependent variable has\nthe same form. For instance, linear and lin-log models can be compared since the dependent variable for each is linear, but a lin-log model\ncannot be directly compared with a log-log model. In this question, M1 and M2 can be compared since both use lnY as the dependent variable.\n(Choice A) Neither regression is in the lin-log functional form, which has a linear dependent variable (Y) and a logarithmic independent variable\n(lnX).\nThings to remember:\nSimple linear regressions may have different functional forms, including logarithmic transformations of one or both variables (ie, lin-log, log-lin, log-\nlog). These transformed models have linear parameters, although the variables are not linear. The statistics of models with different forms of\ndependent variable (eg, Y and lnY) are not comparable.\nDescribe different functional forms of simple linear regressions", "qhtml": null}, {"n": 3, "q": "An economist runs a linear regression and analyzes the regression's residual plot: The most appropriate conclusion is that the pattern of the residual plot indicates the presence of:", "opts": ["outliers.", "nonlinearity.", "heteroskedasticity."], "ans": "B", "expl": "A residual is the difference between the observed value of a dependent variable Y and the value predicted by a regression. In a simple linear\nregression (SLR), residuals are the vertical distance between the actual observations and the regression line, which is the straight line that\nminimizes the sum of the squares of all residuals (ie, the sum of squares error).\nThe residual plot ideally should be scattered randomly; the presence of a pattern often indicates the violation of one or more assumptions\nunderlying the SLR model.\nIn this residual plot (graph on the right), there is a pattern: a concentration of positive residuals in the lower and upper ranges of the independent\nvariable X and of negative residuals in the middle range. This indicates a violation of linearity, which assumes that X and Y have a linear\nrelationship. This violation is called nonlinearity and is evident in the scatterplot of Y against X (graph on the left).\nThings to remember:\nThe presence of a pattern in a residual plot often indicates a violation of the assumptions of a linear regression model. If the residual plot shows a\nconcentration of positive residuals in a range and of negative residuals in other range(s), then the relationship cannot be displayed as a straight\nline and the linearity assumption is violated. This is called nonlinearity.\nExplain the assumptions underlying the simple linear regression model, and describe how residuals and residual plots indicate if these\nassumptions may have been violated", "qhtml": null}, {"n": 4, "q": "A linear regression analysis generates the following ANOVA (analysis of variance) table: ANOVA Table Degrees of Sum of Mean F- Source freedom squares squares statistic Regression 1 9.5231 9.5231 163.4274 Residual 78 4.5452 0.0583 Total 79 14.0683 Based on this data, the standard error of the estimate (s ) is closest to: e ", "opts": ["0.241", "0.323", "0.677"], "ans": "A", "expl": "The standard error of the estimate (s ) measures the accuracy of the regression as reflected by the average distance between each predicted\ne\nŶ and observed Y. It is the square root of the mean square error (MSE) and is presented in the same units as Y. In this scenario:\nSmaller s values mean that a regression has smaller errors, so the regression line is a better fit for the data. This important measure of\ne\ngoodness of fit can be derived from the ANOVA table for a simple linear regression since the table includes the MSE.\n(Choice B) 0.323 results from dividing the sum of squares error (SSE) by the sum of squares total (SST) (1 − R2); it is the proportion of the\nchange in the dependent variable Y not explained by the model.\n(Choice C) 0.677 is the coefficient of determination (R2) that measures the proportion of the change in Y explained by the independent variable\nX. R2 = sum of squares regression (SSR) / SST.\nThings to remember:\nThe standard error of the estimate (s ), derived from the ANOVA table, is a key measure to evaluate how the regression fits the data. It quantifies\ne\nthe accuracy of the regression (ie, the average error) and is measured in the same units as the dependent variable. It is the square root of the\nmean square error (MSE); smaller s values mean that a regression has smaller errors, so the regression line is a better fit for the data.\ne\nDescribe the use of analysis of variance (ANOVA) in regression analysis, interpret ANOVA results, and calculate and interpret the standard error\nof Estimate in a simple linear regression", "qhtml": null}, {"n": 5, "q": "An analyst runs a linear regression on crude oil prices (in USD per barrel) and a company's gross margin (in %), with the following results: The analyst forecasts an average oil price of USD 66 in the following quarter. Considering t-values of ±2.228, the 95% prediction interval for the company's gross margin is closest to:", "opts": ["40.6% to 52.1%.", "42.3% to 50.5%.", "44.2% to 48.6%."], "ans": "A", "expl": "Simple linear regressions are commonly used to predict a dependent variable (Ŷ) based on a forecasted value of the independent variable (X).\nf f\nThe forecast's prediction interval is the expected range of values around Ŷ given a certain level of significance (α). For example, if α = 5%,\nf\nthere is a 95% probability that the actual value of Y will be within the prediction interval.\nThe width of the range is a function of two components: the critical t-value (t ), which is a reliability factor, and the standard error of the forecast,\nc\nwhich is a measure of the regression's accuracy. In this scenario, the prediction interval is calculated as follows:\n6.An analyst runs a simple linear regression (SLR) and plots the resulting residuals:\nThe regression's residuals are presented on the vertical axis of each graph. In the left graph, residuals are plotted against the regression's\nindependent variable, and in the right graph, they are plotted in chronological order. Based only on the graphs, the model most likely violates\nwhich of the following linear regression assumptions?\nA. Linearity\n B. Independence\nC. Homoskedasticity\nExplanation\nA residual is the difference between the observed value of the dependent variable and the value predicted by the regression. In a simple linear\nregression (SLR), residuals are the vertical distance between the actual observations and the regression line, which is the straight line that\nminimizes the sum of the squares of all residuals (ie, the sum of squares error).\nIdeally, the residual plot is randomly scattered. Therefore, the presence of patterns often indicates the violation of one or more assumptions\nunderlying the SLR model. In this scenario, when the residuals are plotted against the independent variable (X), it does not display any visible\npattern.\nWhen the residuals are plotted against time (ie, chronological order), there is a pattern: Neighboring (ie, succeeding and preceding) residuals\nhave similar signs and magnitudes. This indicates a violation of the independence assumption, which assumes that observations (and\nresiduals) are uncorrelated; it is called autocorrelation.\nThings to remember:\nIndependence assumes that observations (and residuals) are uncorrelated. Autocorrelation, the violation of this assumption, is often recognized\nby plotting the residuals against time (ie, chronological order) and identifying that neighboring residuals have similar signs and magnitudes.\nExplain the assumptions underlying the simple linear regression model, and describe how residuals and residual plots indicate if these\nassumptions may have been violated LOS\n7.The following table summarizes the relationship between two exchange rates, USD/GBP and USD/EUR for the last 12 months:\nStatistic Data\nStandard deviation of USD/GBP 1.389\nStandard deviation of USD/EUR 1.208\nCorrelation of USD/GBP and USD/EUR 0.781\nAn analyst runs a linear regression to test if USD/GBP explains changes in USD/EUR. The slope of this regression model is closest to:\nA. 0.405\n\nB. 0.679\nC. 0.898\nExplanation\nThis regression model examines how well USD/GBP explains USD/EUR. Therefore, USD/GBP is the explanatory or independent variable (X),\nwhile USD/EUR is the explained or dependent variable (Y). Since there is only one independent variable, this is a simple linear regression, and\nthe slope coefficient is the ratio of the covariance (Y, X) to the variance of X.\nIn this scenario, the covariance (Y, X) can be obtained using the correlation of Y and X and the standard deviations of X and Y. After obtaining the\ncovariance, the slope coefficient is calculated as follows:\n(Choice A) 0.405 results from incorrectly using the correlation instead of covariance in the slope formula (ie, 0.781 / (1.389)2).\n(Choice C) 0.898 results from incorrectly swapping the variables (ie, using USD/GBP as the dependent variable and USD/EUR as the\nindependent variable [0.781 × 1.389 / 1.208]).\nThings to remember:\nIn a simple linear regression, the independent variable (X) explains the dependent variable (Y). The slope coefficient is the ratio of the covariance\n(Y, X) to the variance of X. It can also be calculated as the product of the correlation (Y, X) and the ratio of the standard deviations of Y and X.\nDescribe a simple linear regression model, how the least squares criterion is used to estimate regression coefficients, and the interpretation of\nthese coefficients", "qhtml": null}, {"n": 6, "q": "An analyst runs a simple linear regression (SLR) and plots the resulting residuals: The regression's residuals are presented on the vertical axis of each graph. In the left graph, residuals are plotted against the regression's independent variable, and in the right graph, they are plotted in chronological order. Based only on the graphs, the model most likely violates which of the following linear regression assumptions?", "opts": ["Linearity", "Independence", "Homoskedasticity"], "an nes if changes in the stock index are explained by the unemployment rate. In this model, the stock index is the dependent\nvariable (ie, explained variable), which is usually named Y. The goal of the model is to predict trends in the stock index based on the\nexpected unemployment rate.\nModel 2 examines if changes in the stock index explain changes in GDP. In this model, the stock index is the independent variable (ie,\nexplanatory variable), which is usually named X. The goal of the model is to predict trends in GDP based on the expected stock index\n(Choices A and C).\nA linear regression model has only one dependent variable, but it may have several independent variables. In this case, the model is known as a\nsimple linear regression since it has only one independent variable.\nThings to remember:\nA linear regression tests if independent variables explain changes in a dependent variable, quantifying their relationship in a linear equation.\nLinear regressions have only one dependent variable but may have several independent variables. When there is only one independent variable,\nthe model is known as a simple linear regression.\nDescribe a simple linear regression model, how the least squares criterion is used to estimate regression coefficients, and the interpretation of\nthese coefficients", "qhtml": null}, {"n": 9, "q": "A portfolio manager uses a regression model to evaluate how a company's debt-to-equity ratio influences its beta. The analysis of variance (ANOVA) for the regression model is: ANOVA Table Degrees of Sum of Mean F- Source Freedom Squares Squares statistic Regression 1 0.1426 0.1426 ? Residual 8 0.2986 0.0373 Total 9 0.4413 The manager formulates the null hypothesis (H ) that the slope coefficient is zero. If the critical F-value at a 5% significance is 5.32, the manager's 0 most appropriate decision is to:", "opts": ["reject H since the F-statistic is less than 5.32 0", "reject H since the F-statistic is greater than 5.32. 0", "fail to reje y testing whether results are random. In the F-test for a simple\nlinear regression, if the F-statistic is greater than the critical F-value, there is evidence that the single independent variable (X) helps to explain\nchanges in the dependent variable (Y) (ie, results are not random).\nThe F-statistic is the ratio of the mean square regression (MSR) to the mean square error (MSE) and can be interpreted as the ratio of the\nexplained variance to the unexplained variance. The greater (smaller) the F-statistic, the more (less) of the variation is explained by the\nregression. In the current scenario:\nNote that the denominators used to calculate MSR and MSE are the degrees of freedom (df) in each case:\ndf(model), denominator of MSR, is the number of independent variables, which is 1 in a simple linear regression.\ndf(residual), denominator of MSE, is the difference between the sample size (n) and the number of parameters (2 in a simple linear\nregression), so 10 = 12 − 2.\ndf(total) is the sum of df(model) and df(residual), or 11.\n(Choice B) 27.22 is obtained by incorrectly using total df in the denominator of MSE [20.601 / (8.326 / 11)].\n(Choice C) 29.69 is obtained by incorrectly using the total observations in the denominator of MSE [20.601 / (8.326 / 12)].\nThings to remember:\nThe F-statistic is used to test the statistical significance of a linear regression (ie, test if results are random). The F-statistic is a ratio of two\nvariances, the mean square regression (MSR) and the mean square error (MSE). The greater (smaller) the F-statistic, the more (less) of the\nvariation is explained by the regression.\nCalculate and interpret measures of fit and formulate and evaluate tests of fit and of regression coefficients in a simple linear regression", "qhtml": null}, {"n": 10, "q": "An analyst runs a regression to determine whether the value of Stock Index A is a good predictor of the value of Stock Index B. Selected data are presented below: Coefficient Standard E stical significance of a linear regression (ie, test if results are random). The F-statistic is a ratio of two\nvariances, the mean square regression (MSR) and the mean square error (MSE). The greater (smaller) the F-statistic, the more (less) of the\nvariation is explained by the regression.\nCalculate and interpret measures of fit and formulate and evaluate tests of fit and of regression coefficients in a simple linear regression", "qhtml": null}, {"n": 12, "q": "A fixed income analyst runs a linear regression to evaluate the relationship between the price of two bonds. Selected data is presented below: ANOVA Table Degrees of Sum of Mean Source freedom squares squares Regression 1 20.032 20.032 Residual 28 159.371 5.692 Total 29 179.404 At a 5% significance level, the critical F-value is 4.196. Based only on the data, the most appropriate conclusion is that the:", "opts": ["coefficient of determination (R2) is 12.6%.", "standard error of the estimate (s ) is 2.386. e", "model is statistically significant since the F-statistic is 3.52."], "ans": "B", "expl": "There are different ways to evaluate how well a regression model explains the relationship between the dependent (Y) and the independent (X)\nvariables in a simple linear regression:\nThe coefficient of determination (R2) measures the proportion of the change in Y explained by X.\nThe standard error of the estimate (s ) measures the accuracy of the regression.\ne\nThe F-statistic is used to test whether the regression results are random or statistically significant.\nThese statistics are three key measures of goodness of fit; they are usually analyzed together since they have different specific interpretations and\nlimitations (ie, each statistic explains only a part of the regression). The ANOVA table supplies the required information to calculate all three\nmeasures. The calculations are:\nDescribe the use of analysis of variance (ANOVA) in regression analysis, interpret ANOVA results, and calculate and interpret the standard error\nof Estimate in a simple linear regression LOS\n13.An analyst runs a simple linear regression using a sample of 10 observations. To assess the validity of the regression statistics, the analyst\nrandomly draws 20 observations from the same data. The results of both regression analyses are:\nSum of Sum of\nSample size squares squares\ntotal (SST) errors (SSE)\nRegression 1 10 167.00 47.75\nRegression 2 20 334.00 95.50\nBased on this information, the analyst should most likely conclude that:\nA. Regression 1 has a larger F-statistic.\nB. both regressions have the same F-statistic.\n\nC. Regression 2 has a larger F-statistic.\nExplanation\nSum of squares total\nSum of squares total (SST) = Sum of squares regression (SSR) + Sum of squares error (SSE)\nA simple linear regression (SLR) can be used to assess the degree to which variations in a dependent variable are explained by variations in an\nindependent variable. Outputs of a regression analysis include the:\nsum of squares total (SST), the variation in the observed values of the dependent variable versus its average value,\nsum of squares regression (SSR), the proportion of variation of the dependent variable explained by changes in the independent variable,\nand\nsum of squares error (SSE), the proportion of variation of the dependent variable unexplained by changes in the independent variable.\nF-statistics are used to evaluate the goodness of fit (ie, how well the regression model fits the data). F-statistics reflect the explained versus\nthe unexplained variation in the dependent variable, adjusted for sample size and degrees of freedom (ie, mean square regression [MSR] /\nmean square error [MSE]). For a given data set, both the SSR and SSE increase as sample size increases:\nIn this scenario, both the SST and SSE double when the sample size doubles. This indicates the same relative variance is exhibited by both\nsamples. Since the divisor in calculating the F-statistic is inversely related to sample size, other things equal, a larger sample size exhibiting the\nsame relative variation results in a greater value for the F-statistic (Choices A and B).\nA larger sample size that exhibits the same relative variation of the dependent variable should give an analyst greater confidence regarding the\nexplanatory power of the independent variable.\nCalculate and interpret measures of fit and formulate and evaluate tests of fit and of regression coefficients in a simple linear regression\n14.A foreign exchange trader runs a linear regression with 24 observations in which BRL/USD is the independent variable and MXN/USD is the\ndependent variable and compiles the following results:\nThe standard error of the estimate is closest to:\nA. 0.418\n\nB. 0.436\nC. 0.473\nExplanation\nThe standard error of the estimate (s ) measures the accuracy of a regression as the average distance between each predicted and observed\ne\nindependent variable (Y). It is also known as the standard error of the regression or the root mean square error (MSE). It is an absolute\nmeasure presented in the same units as Y. Smaller values of s mean that the regression has smaller errors; therefore, the regression line is a\ne\nbetter fit for the data.\nSince this scenario does not provide the MSE, it must be calculated as the ratio of the sum of squares error (SSE), or residual sum of squares, to\nthe degrees of freedom (df). Note that the df(residual) is the difference between the sample size (n = 24) and the number of variables (X and Y)\n(ie, 24 − 2 = 22).\n(Choice A) 0.418 is obtained by incorrectly using the number of observations (ie, sample size) in the denominator instead of the df, n − 2 (ie,\nsquare root of 4.190 / 24).\n(Choice C) 0.473 is obtained by incorrectly using the sum of squares total (SST), or total sum of squares, in the numerator instead of SSE (ie,\nsquare root of 4.932 / 22).\nThings to remember:\nThe standard error of the estimate (s ), or square root of the mean square error, quantifies the accuracy of the regression (ie, the average error). It\ne\nis an absolute measure of how well the regression line fits the data, presented in the same units as the dependent variable. Smaller values of s\ne\nmean that the regression has a smaller error and better precision.\nDescribe the use of analysis of variance (ANOVA) in regression analysis, interpret ANOVA results, and calculate and interpret the standard error\nof Estimate in a simple linear regression", "qhtml": null}, {"n": 13, "q": "An analyst runs a simple linear regression using a sample of 10 observations. To assess the validity of the regression statistics, the analyst randomly draws 20 observations from the same data. The results of both regression analyses are: Sum of Sum of Sample size squares squares total (SST) errors (SSE) Regression 1 10 167.00 47.75 Regression 2 20 334.00 95.50 Based on this information, the analyst should most likely conclude that:", "opts": ["Regression 1 has a larger F-statistic.", "both regressions have the same F-statistic.", "Regression 2 has a larger F-statistic."], "ans": "C", "expl": "Sum of squares total\nSum of squares total (SST) = Sum of squares regression (SSR) + Sum of squares error (SSE)\nA simple linear regression (SLR) can be used to assess the degree to which variations in a dependent variable are explained by variations in an\nindependent variable. Outputs of a regression analysis include the:\nsum of squares total (SST), the variation in the observed values of the dependent variable versus its average value,\nsum of squares regression (SSR), the proportion of variation of the dependent variable explained by changes in the independent variable,\nand\nsum of squares error (SSE), the proportion of variation of the dependent variable unexplained by changes in the independent variable.\nF-statistics are used to evaluate the goodness of fit (ie, how well the regression model fits the data). F-statistics reflect the explained versus\nthe unexplained variation in the dependent variable, adjusted for sample size and degrees of freedom (ie, mean square regression [MSR] /\nmean square error [MSE]). For a given data set, both the SSR and SSE increase as sample size increases:\nIn this scenario, both the SST and SSE double when the sample size doubles. This indicates the same relative variance is exhibited by both\nsamples. Since the divisor in calculating the F-statistic is inversely related to sample size, other things equal, a larger sample size exhibiting the\nsame relative variation results in a greater value for the F-statistic (Choices A and B).\nA larger sample size that exhibits the same relative variation of the dependent variable should give an analyst greater confidence regarding the\nexplanatory power of the independent variable.\nCalculate and interpret measures of fit and formulate and evaluate tests of fit and of regression coefficients in a simple linear regression\n14.A foreign exchange trader runs a linear regression with 24 observations in which BRL/USD is the independent variable and MXN/USD is the\ndependent variable and compiles the following results:\nThe standard error of the estimate is closest to:\nA. 0.418\n\nB. 0.436\nC. 0.473\nExplanation\nThe standard error of the estimate (s ) measures the accuracy of a regression as the average distance between each predicted and observed\ne\nindependent variable (Y). It is also known as the standard error of the regression or the root mean square error (MSE). It is an absolute\nmeasure presented in the same units as Y. Smaller values of s mean that the regression has smaller errors; therefore, the regression line is a\ne\nbetter fit for the data.\nSince this scenario does not provide the MSE, it must be calculated as the ratio of the sum of squares error (SSE), or residual sum of squares, to\nthe degrees of freedom (df). Note that the df(residual) is the difference between the sample size (n = 24) and the number of variables (X and Y)\n(ie, 24 − 2 = 22).\n(Choice A) 0.418 is obtained by incorrectly using the number of observations (ie, sample size) in the denominator instead of the df, n − 2 (ie,\nsquare root of 4.190 / 24).\n(Choice C) 0.473 is obtained by incorrectly using the sum of squares total (SST), or total sum of squares, in the numerator instead of SSE (ie,\nsquare root of 4.932 / 22).\nThings to remember:\nThe standard error of the estimate (s ), or square root of the mean square error, quantifies the accuracy of the regression (ie, the average error). It\ne\nis an absolute measure of how well the regression line fits the data, presented in the same units as the dependent variable. Smaller values of s\ne\nmean that the regression has a smaller error and better precision.\nDescribe the use of analysis of variance (ANOVA) in regression analysis, interpret ANOVA results, and calculate and interpret the standard error\nof Estimate in a simple linear regression", "qhtml": null}, {"n": 14, "q": "A foreign exchange trader runs a linear regression with 24 observations in which BRL/USD is the independent variable and MXN/USD is the dependent variable and compiles the following results: The standard error of the estimate is closest to:", "opts": ["0.418", "0.436", "0.473"], "ans": "B", "expl": "The standard error of the estimate (s ) measures the accuracy of a regression as the average distance between each predicted and observed\ne\nindependent variable (Y). It is also known as the standard error of the regression or the root mean square error (MSE). It is an absolute\nmeasure presented in the same units as Y. Smaller values of s mean that the regression has smaller errors; therefore, the regression line is a\ne\nbetter fit for the data.\nSince this scenario does not provide the MSE, it must be calculated as the ratio of the sum of squares error (SSE), or residual sum of squares, to\nthe degrees of freedom (df). Note that the df(residual) is the difference between the sample size (n = 24) and the number of variables (X and Y)\n(ie, 24 − 2 = 22).\n(Choice A) 0.418 is obtained by incorrectly using the number of observations (ie, sample size) in the denominator instead of the df, n − 2 (ie,\nsquare root of 4.190 / 24).\n(Choice C) 0.473 is obtained by incorrectly using the sum of squares total (SST), or total sum of squares, in the numerator instead of SSE (ie,\nsquare root of 4.932 / 22).\nThings to remember:\nThe standard error of the estimate (s ), or square root of the mean square error, quantifies the accuracy of the regression (ie, the average error). It\ne\nis an absolute measure of how well the regression line fits the data, presented in the same units as the dependent variable. Smaller values of s\ne\nmean that the regression has a smaller error and better precision.\nDescribe the use of analysis of variance (ANOVA) in regression analysis, interpret ANOVA results, and calculate and interpret the standard error\nof Estimate in a simple linear regression", "qhtml": null}, {"n": 15, "q": "Given that the goal of a linear regression is to explain the variation of the dependent variable Y, the sum of squares regression (SSR) is best described as the:", "opts": ["total variation of Y.", "explained variation of Y.", "unexplained variation of Y."], "ans": "B", "expl": "A linear regression evaluates the relationship between two or more variables, plotting a straight line that best fits the data. The more the model\nexplains the variation of the dependent variable Y, the greater its goodness of fit.\nThe variation of Y is often called the sum of squares total (SST). SST is the total squared difference between each observed Y and the average\nvalue Ῡ, based on the results from the sample data (ie, independent of the regression model). Then, the regression model can help to explain\nSST based on the changes of one or more independent variables. The model breaks the SST into two measures of total squared differences:\nSum of squares regression (SSR) measures differences between Ῡ and Ŷ (the value of Y predicted by the regression model). Since Ῡ can\nbe interpreted as the expected value of Y without a regression model, SSR quantifies how much of SST is explained by the model.\nSum of squares error (SSE) measures differences between Y and Ŷ. Since this is a measure of the prediction error, SSE quantifies how\nmuch of SST is unexplained by the model (Choice C).\nTherefore, SST equals the total variation of Y (ie, the sum of the explained variation and the unexplained variation) (Choice A).\nThings to remember:\nThe variation of Y is known as the sum of squares total (SST), the total squared difference between each observed Y and the average value Ῡ,\nbased on the results from the sample data. The regression model can help to explain SST as two components: the sum of squares regression\n(SSR), the variation explained by the regression model; and the sum of squares error (SSE), the variation unexplained by the model.\nDescribe a simple linear regression model, how the least squares criterion is used to estimate regression coefficients, and the interpretation of\nthese coefficients", "qhtml": null}, {"n": 16, "q": "After running a simple linear regression, a trader analyzes the resulting residual plot: Based on only the residual plot, this regression model most likely violated which of the following linear regression assumptions?", "opts": ["Linearity", "Independence", "Homoskedasticity"], "ans": "C", "expl": "A residual is the difference between the observed value of the dependent variable and the value predicted by the regression. In a simple linear\nregression (SLR), residuals are the vertical distance between the actual observations and the regression line, which is the straight line that\nminimizes the sum of the squares of all residuals (ie, the sum of squares error).\nIdeally, the residual plot is randomly scattered; the presence of a pattern often indicates the violation of one or more assumptions underlying\nthe simple linear regression model.\nIn this scenario, there is a pattern: the variance increases as the value of the independent variable increases. This indicates a violation of\nhomoskedasticity, which assumes that observations have a similar dispersion and residuals have constant variance. That violation is called\nheteroskedasticity.\n(Choice A) Linearity assumes that the variables have a linear relationship. Nonlinearity, the violation of this assumption, is indicated by a\nconcentration of positive residuals in a range (or ranges) of the plot and of negative residuals in other range(s). No concentration exists in this\nscenario's residual plot.\n(Choice B) Independence assumes that observations are uncorrelated. Autocorrelation, the violation of this assumption, is often indicated by\nplotting the residuals against time (ie, observation order), and identifying that neighboring residuals have similar signs and magnitudes. There is\nno evidence of autocorrelation in this residual plot.\nThings to remember:\nThe presence of patterns in residual plots often indicates a violation of the assumptions of a linear regression. If the residual plot shows changes\nin variance across observations, the homoskedasticity assumption is violated and the linear regression will be less accurate for part of the\npopulation. This is called heteroskedasticity.\nExplain the assumptions underlying the simple linear regression model, and describe how residuals and residual plots indicate if these\nassumptions may have been violated", "qhtml": null}, {"n": 17, "q": "An analyst runs a linear regression between two variables but infers that they have a nonlinear relationship. Which of the following approaches would be most appropriate to address this issue? ", "opts": ["Transform one or both variables", "Use an indicator (dummy) variable", "Increase the number of observations"], "ans": "A", "expl": "Linearity is one of the four key assumptions of a simple linear regression. However, even if data sets do not have a linear relationship, it is\npossible to transform one or both variables by using the square, the reciprocal, or the log and then employing a linear regression with the\ntransformed variable(s).\nA common solution to nonlinearity is to use a log transformation. This results in distinct functional forms, allowing the regression line to better fit\na curvature. In the graphs, it is evident that the linear functional form does not depict a linear relationship but the log-lin functional form\nprovides a much better fit, resulting in a stronger regression model. Although the graphs indicate this improvement, the statistics of both\nregression models cannot be compared directly since they use different forms of the dependent variable.\n(Choice B) An indicator variable (ie, dummy variable) is used in specific situations (eg, when there is seasonal data indicating autocorrelation) but\nnot as a solution to nonlinearity.\n(Choice C) Increasing the sample size reduces a regression's uncertainty but does not resolve the nonlinear relationship between variables.\nThings to remember:\nThe transformation (eg, the square, the reciprocal, or the log) of one or both variables in a simple linear regression is often used when there is a\nnonlinear relationship. This results in distinct functional forms, allowing the regression line to better fit a curvature.\nDescribe different functional forms of simple linear regressions", "qhtml": null}, {"n": 18, "q": "A linear regression will most likely provide valid conclusions even if:", "opts": ["the independent variable is not normally distributed.", "there is a strong seasonal pattern in a time series data.", "the dispersion of the dependent variable changes as the independent variable increases."], "ans": "A", "expl": "Assumptions of a simple linear regression\nLinearity Relationship between X and Y is linear\nResiduals for all observations have constant\nHomoskedasticity\nvariance\nObservations are independent and residuals are\nIndependence\nuncorrelated\nNormality Residuals are normally distributed\nX = Independent variable (explanatory)\nY = Dependent variable (explained)\nResiduals = Predicted Y − Observed Y\nNormality is one of the key assumptions of simple linear regression. It does not refer to a normal distribution of the variables (ie, the independent\nvariable, X, or the dependent variable, Y); however, the residuals must be normally distributed.\nThe residuals are the difference between the observed and predicted dependent variable (Y). The nonnormality of residuals compromises some\nuses of the regression model (eg, prediction intervals), but it does not affect the estimated coefficients (ie, slope and intercept), and thus the\nvariables. As the number of observations increases, this assumption becomes less relevant, according to the central limit theorem.\n(Choice B) A strong seasonal pattern in time series data is an indicator of autocorrelation (ie, correlation between sequential values of the same\nvariable), violating the independence assumption. This harms the independence of the residuals and biases the variance of the estimated\ncoefficients, invalidating any significance test of the coefficients.\n(Choice C) If the dispersion of Y changes as X increases, there is heteroskedasticity, violating the homoskedasticity assumption. The variance of\nthe residuals also changes and the regression model will be a less precise predictor for part of the population (ie, not a good fit).\nThings to remember:\nNormality is the assumption that the residuals of a linear regression are normally distributed. It does not require a normal distribution of the\nvariables. A violation of normality compromises some uses of the regression (eg, prediction intervals), but not the estimation of coefficients. This\nassumption becomes irrelevant when there are many observations due to the central limit theorem.\nExplain the assumptions underlying the simple linear regression model, and describe how residuals and residual plots indicate if these\nassumptions may have been violated", "qhtml": null}, {"n": 19, "q": "The following table summarizes performance data for a mutual fund and its benchmark for the last 50 months: Fund Benchmark Return (Y) Return (X) Mean 1.48 1.20 Variance 5.60 5.07 Covariance (Y,X) 4.78 Based on this data, if an investor expects a 0% return for the benchmark next month, the predicted return of the mutual fund will be closest to: ", "opts": ["0.35%", "0.94%", "1.48%"], "ans": "A", "expl": "The coefficients of a linear regression (ie, slope and intercept) can be estimated based on common statistical measures, as given in this\nscenario. When the expected benchmark return (the independent variable, X) equals zero, the predicted return of the mutual fund (the predicted\ndependent variable, Ŷ) equals the value of the intercept.\nBased on the information given, find the intercept using the return means as the independent and dependent variable values and the slope of the\nregression line. The slope is the ratio of the covariance of Y and X to the variance of X. This is derived from the least squares criterion that drives\nthe goal of the linear regression: to minimize the sum of the squared residuals so that the regression line is the best fit for the data.\nIt is important to note that 0.35% is the predicted mutual fund return, not the observed (ie, actual) return, and that the data set is just a sample of\nthe population, so the calculated coefficients will always be estimates of the population parameters.\n(Choice B) 0.94% is the slope, or the change in the predicted return of the mutual fund for every unit change in the expected return of the\nbenchmark.\n(Choice C) 1.48% is the mean (ie, average) return of the mutual fund. It is the expected return when there is no information about the\nbenchmark.\nThings to remember:\nRegression coefficients can be estimated using common statistical measures. This results from the least squares criterion that drives the linear\nregression's goal of minimizing the sum of the squared residuals (ie, the difference between observed Y and predicted Y) so that the estimated\nregression line is the best fit for the data.\nDescribe a simple linear regression model, how the least squares criterion is used to estimate regression coefficients, and the interpretation of\nthese coefficients", "qhtml": null}, {"n": 20, "q": "An equity analyst evaluates how the percentage change in cotton prices affects the percentage change in the stock price of an apparel company. The analyst prepares a linear regression, resulting in an intercept of 0.3 and a slope of −0.7. According to this regression, the predicted change in stock price given a 2% increase in cotton prices is closest to:", "opts": ["−1.4%", "−1.1%", "−0.1%"], "ans": "B", "expl": "This linear equation represents the current scenario. The intercept is 0.3, so if the change in cotton price is zero, the predicted monthly change in\nstock price is 0.3%. The slope is −0.7, meaning that every 1% increase in cotton prices would make the stock price decrease by an incremental\n0.7%.\nTherefore, a 2% increase in cotton prices results in a predicted decrease of 1.1% [0.3 − (0.7 × 2)] in the stock price. It is important to note that\nthis is a predicted variation, not the observed (ie, actual) stock price change.\nA linear regression with one independent variable has two coefficients and is presented as a scatterplot, where the:\nIntercept is the value of the dependent variable when the independent variable equals zero (ie, the expected variation in the estimate that\nis unrelated to the independent variable).\nSlope is the change in the dependent variable for every unit change in the independent variable.\n(Choice A) −1.4% results from ignoring the intercept, but the regression model includes the intercept as the variation unrelated to changes in the\nindependent variable.\n(Choice C) −0.1% results from misplacing both coefficients and multiplying the 2% variation by the intercept instead of the slope [(0.3 × 2) − 0.7].\nThings to remember:\nIn a linear regression, the intercept is the value of the dependent variable Y when the independent variable X equals zero (ie, the expected change\nin the dependent variable regardless of the change in the independent variable). The slope is the change in the dependent variable for every unit\nchange in the independent variable. These coefficients and the independent variable explain the variations in the dependent variable.\nDescribe a simple linear regression model, how the least squares criterion is used to estimate regression coefficients, and the interpretation of\nthese coefficients", "qhtml": null}, {"n": 21, "q": "A trader runs a linear regression model and calculates a prediction interval. The trader reviews the results, then runs a second model based on the same data set and calculates a significantly narrower prediction interval. Based only on this information, the trader most likely:", "opts": ["decreased the sample size.", "increased the level of significance.", "assumed the forecasted independent variable is farther from the sample mean."], "ans": "B", "expl": "Simple linear regressions can be used to predict a dependent variable (Ŷ) based on a forecasted value of the independent variable (X). The\nf f\nforecast's prediction interval is the expected range of values around Ŷ for a given level of significance (α).\nf\nThe range (ie, the width) of the interval is a function of two components: the critical t-value, which is a reliability factor, and the standard error of\nthe forecast (s), which measures the accuracy of the forecast (for a given value of X). Factors that can affect this range, when comparing the first\nf f\nmodel to the second, are:\nDecreasing the number of observations (ie, sample size) results in a less reliable model. The prediction interval is wider to reflect the\ngreater uncertainty (Choice A).\nIncreasing the significance level decreases the confidence level (ie, the probability that the actual value of Y lies within the prediction\ninterval) and narrows the interval.\nIf the forecasted independent variable is farther from the sample mean independent variable, it decreases accuracy and increases\nuncertainty, thus widening the prediction interval (Choice C).\nThings to remember:\nThe prediction interval of a forecast is the expected range of values around the predicted dependent variable, resulting from factors such as the\nnumber of observations, the significance level, and the forecasted independent variable. The smaller (greater) the number of observations and the\nsignificance level and the farther (closer) the forecasted independent variable from the sample mean, the wider (narrower) the interval.\nCalculate and Interpret the predicted value for the dependent variable, and a prediction interval for it, given an estimated linear regression model\nand a value for the independent variable", "qhtml": null}];
const CFG = {"title": "Wiley · Simple Linear Regression", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Quantitative Methods · 21 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
</html>
