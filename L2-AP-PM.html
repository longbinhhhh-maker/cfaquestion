<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnalystPrep — Portfolio Management</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}

  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
  .expl-html .los{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:12px}
  .expl-html b{color:var(--txt)}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);

t the home&#x27;s value to keep pace with the annual inflation of 3%. The Diegos plan to purchase a motorhome to travel when they both retire. The expected cost of the vehicle is EUR 200,000, which they plan to purchase with cash. To maintain their lifestyles after retirement, they believe they will need EUR 80,000 for the first year of retirement. Jose Diego is very risk-averse and only makes very calculated investment decisions. The Diegos do not want to draw from their savings, and instead, rely entirely on investment income. Their expected effective tax rate when they retire is 25%.<\/p><p>Gustavo’s college classmate, Pedro Hernandez, CFA, works for the small endowment fund of a local college. Hernandez also has a small independent wealth-advisory firm with only a few clients. The endowment fund is currently valued at EUR 45,000,000. The primary purpose of the endowment fund is to provide EUR 2,500,000 in academic scholarships annually to students in need. Over the past several years, donations from various alumni have averaged EUR 1,000,000 per year, with similar funds pledged for the upcoming year. The college dean and alumni relations committee believe this will continue. The operating costs for the endowment fund will be EUR 550,000 for the next year.<\/p><p>Hernandez reviews the endowment’s returns and variance for the past several years and notices the covariance of the fund’s returns with the market returns is 0.0033. The standard deviation of the market return is 0.0755. The endowment also outperformed the market by 250 bps annually for the past several years. The college’s board of directors is very pleased with Hernandez’s performance. One of the board members, Anna Santiago, approaches Hernandez about the possibility of her becoming his client.<\/p><p>Santiago has been investing on her own because she has been a bit cautious about handing money over to an investment manager. She says the following:<\/p><p>Statement 1: Developing an individual policy statement is a waste of time because many one-size-fits-all approaches to selecting investment products meet the same objectives.<\/p><p>Statement 2: A long-term investment approach is unwise because it prevents the ability to shift in and out of positions and sectors that may generate additional returns.<\/p><\/div><\/details><div class=\"qtext\"><p>The liquidity requirement for the endowment fund is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 3, "q": "The estimated beta for the endowment fund is closest to:", "opts": ["0.0057.", "0.044.", "0.579."], "ans": "C", "expl": "We need to follow the formula for calculating beta, which is the covariance of the fund's returns with the market returns divided by the variance of the market returns. The covariance given is 0.0033, and the variance of the market returns is calculated by squaring the standard deviation of the market, which is 0.0755. Thus, the variance is 0.07552 = 0.0057. Using these values, the beta is calculated as follows: A is incorrect. This is the variance of the market returns (0.0057), not the beta. Beta requires dividing covariance by variance, so selecting this value indicates a misunderstanding of the formula, where one might mistakenly assume variance alone represents beta. B is incorrect. This results from an incorrect calculation where covariance is divided by the standard deviation of market returns (0.0033 / 0.0755, ≈ 0.0437, ≈ 0.044) instead of the variance. This error misapplies the beta formula, as beta requires variance in the denominator, not standard deviation. ", "explhtml": "<p>We need to follow the formula for calculating beta, which is the covariance of the fund&#x27;s returns with the market returns divided by the variance of the market returns. The covariance given is 0.0033, and the variance of the market returns is calculated by squaring the standard deviation of the market, which is 0.0755. Thus, the variance is 0.0755<sup>2<\/sup> = 0.0057. Using these values, the beta is calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0014.webp\" style=\"max-width:min(100%,481px)\" alt=\"Covariance 0.0033 Estimated Beta = Variance of Market Returns = 0.0057 ≈0.5789\"><p><b>A is incorrect<\/b>. This is the variance of the market returns (0.0057), not the beta. Beta requires dividing covariance by variance, so selecting this value indicates a misunderstanding of the formula, where one might mistakenly assume variance alone represents beta.<\/p><p><b>B is incorrect<\/b>. This results from an incorrect calculation where covariance is divided by the standard deviation of market returns (0.0033 / 0.0755, ≈ 0.0437, ≈ 0.044) instead of the variance. This error misapplies the beta formula, as beta requires variance in the denominator, not standard deviation. <\/p><p class=\"los\">Portfolio Management, Learning Module 3: Measuring and Managing Market Risk, LOS 3(g): Demonstrate how equity, fixed-income, and options exposure measures may be used in measuring and managing market risk and volatility risk<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Roberto Gustavo<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Roberto Gustavo, CFA, works at a wealth-planning firm where he advises families and institutions to help them achieve their investment goals. He is currently working with Jose and Maria Diego, both 62 years old. They both expect to retire at 67 years old. They have both been working on an automotive assembly line for over 50 years and will receive a total annual pension of EUR 45,000. By maintaining a modest lifestyle and setting aside ample savings, they expect to have EUR 1,100,000 saved for retirement.<\/p><p>The Diegos also have a house worth EUR 300,000 with no outstanding mortgage. They plan to sell the home when they retire in five years, and in the meantime, they expect the home&#x27;s value to keep pace with the annual inflation of 3%. The Diegos plan to purchase a motorhome to travel when they both retire. The expected cost of the vehicle is EUR 200,000, which they plan to purchase with cash. To maintain their lifestyles after retirement, they believe they will need EUR 80,000 for the first year of retirement. Jose Diego is very risk-averse and only makes very calculated investment decisions. The Diegos do not want to draw from their savings, and instead, rely entirely on investment income. Their expected effective tax rate when they retire is 25%.<\/p><p>Gustavo’s college classmate, Pedro Hernandez, CFA, works for the small endowment fund of a local college. Hernandez also has a small independent wealth-advisory firm with only a few clients. The endowment fund is currently valued at EUR 45,000,000. The primary purpose of the endowment fund is to provide EUR 2,500,000 in academic scholarships annually to students in need. Over the past several years, donations from various alumni have averaged EUR 1,000,000 per year, with similar funds pledged for the upcoming year. The college dean and alumni relations committee believe this will continue. The operating costs for the endowment fund will be EUR 550,000 for the next year.<\/p><p>Hernandez reviews the endowment’s returns and variance for the past several years and notices the covariance of the fund’s returns with the market returns is 0.0033. The standard deviation of the market return is 0.0755. The endowment also outperformed the market by 250 bps annually for the past several years. The college’s board of directors is very pleased with Hernandez’s performance. One of the board members, Anna Santiago, approaches Hernandez about the possibility of her becoming his client.<\/p><p>Santiago has been investing on her own because she has been a bit cautious about handing money over to an investment manager. She says the following:<\/p><p>Statement 1: Developing an individual policy statement is a waste of time because many one-size-fits-all approaches to selecting investment products meet the same objectives.<\/p><p>Statement 2: A long-term investment approach is unwise because it prevents the ability to shift in and out of positions and sectors that may generate additional returns.<\/p><\/div><\/details><div class=\"qtext\"><p>The estimated beta for the endowment fund is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 4, "q": "Which of Santiago’s statements would be most accurate?", "opts": ["Statement 1.", "Statement 2.", "Neither Statement 1 nor Statement 2."], "ans": "C", "expl": "Both statements made by Santiago reflect common misconceptions about investment strategies. Statement 1 is incorrect because it underestimates the importance of an individual policy statement (IPS). An IPS is not merely a formality; it is a fundamental tool in financial planning that helps in customizing investment strategies according to the unique needs and goals of an individual. Contrary to the belief that one-size-fits-all investment products can meet the same objectives, these products often fail to consider specific investor circumstances, such as risk tolerance, time horizon, and financial goals. Without an IPS, investors may find themselves in investments that are ill-suited to their financial situation, potentially leading to suboptimal outcomes. Statement 2 is incorrect as it dismisses the value of a long-term investment approach by incorrectly assuming that frequent trading and sector shifting yield higher returns. A long-term investment strategy is generally more beneficial for individual investors because it is focused on achieving sustained growth and mitigating risks through market cycles. Frequent trading often incurs higher transaction costs and taxes, and it requires precise market timing, which is extremely difficult to achieve consistently. Moreover, a long-term perspective helps in capitalizing on the power of compounding, ultimately aiding in the accumulation of wealth over time. " stitutions to help them achieve their investment goals. He is currently working with Jose and Maria Diego, both 62 years old. They both expect to retire at 67 years old. They have both been working on an automotive assembly line for over 50 years and will receive a total annual pension of EUR 45,000. By maintaining a modest lifestyle and setting aside ample savings, they expect to have EUR 1,100,000 saved for retirement.<\/p><p>The Diegos also have a house worth EUR 300,000 with no outstanding mortgage. They plan to sell the home when they retire in five years, and in the meantime, they expect the home&#x27;s value to keep pace with the annual inflation of 3%. The Diegos plan to purchase a motorhome to travel when they both retire. The expected cost of the vehicle is EUR 200,000, which they plan to purchase with cash. To maintain their lifestyles after retirement, they believe they will need EUR 80,000 for the first year of retirement. Jose Diego is very risk-averse and only makes very calculated investment decisions. The Diegos do not want to draw from their savings, and instead, rely entirely on investment income. Their expected effective tax rate when they retire is 25%.<\/p><p>Gustavo’s college classmate, Pedro Hernandez, CFA, works for the small endowment fund of a local college. Hernandez also has a small independent wealth-advisory firm with only a few clients. The endowment fund is currently valued at EUR 45,000,000. The primary purpose of the endowment fund is to provide EUR 2,500,000 in academic scholarships annually to students in need. Over the past several years, donations from various alumni have averaged EUR 1,000,000 per year, with similar funds pledged for the upcoming year. The college dean and alumni relations committee believe this will continue. The operating costs for the endowment fund will be EUR 550,000 for the next year.<\/p><p>Hernandez reviews the endowment’s returns and variance for the past several years and notices the covariance of the fund’s returns with the market returns is 0.0033. The standard deviation of the market return is 0.0755. The endowment also outperformed the market by 250 bps annually for the past several years. The college’s board of directors is very pleased with Hernandez’s performance. One of the board members, Anna Santiago, approaches Hernandez about the possibility of her becoming his client.<\/p><p>Santiago has been investing on her own because she has been a bit cautious about handing money over to an investment manager. She says the following:<\/p><p>Statement 1: Developing an individual policy statement is a waste of time because many one-size-fits-all approaches to selecting investment products meet the same objectives.<\/p><p>Statement 2: A long-term investment approach is unwise because it prevents the ability to shift in and out of positions and sectors that may generate additional returns.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Santiago’s statements would be most accurate?<\/p><\/div>", "subj": "portfolio"}, {"n": 5, "q": "Will Note 1 have an impact on Redel’s time horizon?", "opts": ["Yes.", "No, an increase in wealth represents a decrease in liquidity requirements.", "No, the length of time to the receipt of $0.5 million is too short to constitute a time horizon stage."], "ans": "A", "expl": "The receipt of $0.5 million from her deceased father's estate represents a significant change in Redel's financial situation, which directly impacts her investment time horizon. A time horizon in investment terms refers to the period during which an investor expects to hold an investment before taking out money. The addition of a substantial amount such as $0.5 million, which is 25% of her current $2 million portfolio, is not just a minor adjustment but a substantial influx of funds. This increase in her assets may lead her to reconsider her current investment strategy, potentially taking on more or different types of investments, or altering her risk profile given the increased capital base. Furthermore, this event could lead to the establishment of new financial goals or the acceleration of existing ones, such as higher future expenditures or increased savings for retirement, thus extending or modifying the investment time horizon. B is incorrect. The statement that an increase in wealth represents a decrease in liquidity requirements is misleading in this context. While it is true that more wealth can lead to lower relative liquidity needs in terms of percentage of assets, this does not directly relate to the impact on the investment time horizon. In fact, an increase in wealth can lead to a reevaluation of investment goals and risk tolerance, potentially resulting in a longer or more complex time horizon as new investment opportunities and needs are considered. The liquidity aspect is only one dimension of how wealth impacts an investment strategy, and it does not negate the potential for a new time horizon stage. C is incorrect. The statement that the length of time to the receipt of $0.5 million is too short to constitute a time horizon stage overlooks the significance of the amount involved relative to the total portfolio. The key factor is not just the time until receipt but the impact of the funds once received. A substantial addition to one's investment portfolio, such as 25% of the current portfolio value, is likely to significantly influence an investor's strategy and objectives. This can lead to a reassessment of the investment time horizon, regardless of the short time frame within which the funds will be received. The impact of the inheritance is substantial enough to potentially introduce a new phase in the investment lifecycle, necessitating a review and possible adjustment of the investment plan. ", "explhtml": "<p>The receipt of $0.5 million from her deceased father&#x27;s estate represents a significant change in Redel&#x27;s financial situation, which directly impacts her investment time horizon. A time horizon in investment terms refers to the period during which an investor expects to hold an investment before taking out money. The addition of a substantial amount such as $0.5 million, which is 25% of her current $2 million portfolio, is not just a minor adjustment but a substantial influx of funds. This increase in her assets may lead her to reconsider her current investment strategy, potentially taking on more or different types of investments, or altering her risk profile given the increased capital base. Furthermore, this event could lead to the establishment of new financial goals or the acceleration of existing ones, such as higher future expenditures or increased savings for retirement, thus extending or modifying the investment time horizon.<\/p><p><b>B is incorrect<\/b>. The statement that an increase in wealth represents a decrease in liquidity requirements is misleading in this context. While it is true that more wealth can lead to lower relative liquidity needs in terms of percentage of assets, this does not directly relate to the impact on the investment time horizon. In fact, an increase in wealth can lead to a reevaluation of investment goals and risk tolerance, potentially resulting in a longer or more complex time horizon as new investment opportunities and needs are considered. The liquidity aspect is only one dimension of how wealth impacts an investment strategy, and it does not negate the potential for a new time horizon stage.<\/p><p><b>C is incorrect<\/b>. The statement that the length of time to the receipt of $0.5 million is too short to constitute a time horizon stage overlooks the significance of the amount involved relative to the total portfolio. The key factor is not just the time until receipt but the impact of the funds once received. A substantial addition to one&#x27;s investment portfolio, such as 25% of the current portfolio value, is likely to significantly influence an investor&#x27;s strategy and objectives. This can lead to a reassessment of the investment time horizon, regardless of the short time frame within which the funds will be received. The impact of the inheritance is substantial enough to potentially introduce a new phase in the investment lifecycle, necessitating a review and possible adjustment of the investment plan. <\/p><p class=\"los\">Portfolio Management, Learning Module 5: Economic And Investment Markets, LOS 5(c): Explain the relationship between the long-term growth rate of the economy, the volatility of the growth rate, and the average level of real short-term interest rates<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Clementine Associates<\/summary><div class=\"vig-body\"><p>Clementine Associates is an asset management firm that caters to individuals and institutions. Arthur Knight is the company&#x27;s senior investment manager, managing the investment accounts of wealthy individuals. Knight&#x27;s oldest client, Sun Redel, is a self-employed individual. Redel’s $2 million investment portfolio is allocated among equity, fixed income, commodities, and real estate. Redel accumulated her wealth over 15 years using a combination of savings and investments. Her business earnings exactly meet her living expenses.<\/p><p>Each year, Knight holds an annual meeting with Redel in which the client’s IPS and portfolio performance are reviewed and discussed. During his current meeting with the client, Knight takes note of the following items, which are marked for further investigation:<\/p><p>Note 1: Redel is expected to receive $0.5 million from her deceased father’s estate in two weeks.<\/p><p>Note 2: The annual inflation rate is expected to increase at the end of the current year.<\/p><p>Note 3: The proposed increase in capital gains and current income tax rates will be enacted at the beginning of the upcoming fiscal quarter.<\/p><p>Note 4: Redel will need to withdraw $500,000 from her portfolio to pay for purchasing a private boat in three months.<\/p><p>During the meeting, Redel makes the following statements:<\/p><p>Statement 1: I would like to request more frequent portfolio reviews.<\/p><p>Statement 2: I would like you to avoid including the shares of tobacco company stocks.<\/p><p>Statement 3: I would prefer for my portfolio manager to commit to the highest standards of professional competence and ethical conduct.<\/p><p>Lindsay Abdul is a senior portfolio manager who oversees institutional client accounts, such as the investment account of Sportex’s defined benefit pension plan. During a meeting with Sportex’s chief operating officer, Abdul takes down the following notes:<\/p><p>Note 5: Ten percent of the employees, originally covered by the plan, have elected to exercise their right to early retirement.<\/p><p>Note 6: The plan has reported a deficit of $0.8 million in the current year.<\/p><p>Note 7: Recently enacted local regulations restrict total investment in equities to no more than 30% of the net asset base. The plan’s financial asset base will need to be rebalanced as a consequence.<\/p><p>Abdul also overlooks the investment account of the Horizon Foundation, an institute providing university study scholarships to students in developing countries. The foundation requires an annual real return of 3.5% to fund its grant-making activities. Investment expenses amount to 0.9% while the expected long-term inflation rate equals 1.3%.<\/p><\/div><\/details><div class=\"qtext\"><p>Will Note 1 have an impact on Redel’s time horizon?<\/p><\/div>", "subj": "portfolio"}, {"n": 6, "q": "Which of the following notes contains the most likely information indicating a significant impact on Redel’s ability to take risk?", "opts": ["Note 1", "Note 2", "Note 3"], "ans": "A", "expl": "Receiving an inheritance of $0.5 million from her deceased father's estate significantly impacts Redel's financial situation by increasing her total asset base. This influx of cash provides her with additional financial security and flexibility, allowing her to potentially take on more risk in her investment portfolio. With a larger asset base, she can diversify into riskier investments without jeopardizing her overall financial stability. This is because the relative impact of potential losses on riskier investments is mitigated by the increased size of her portfolio. Furthermore, the additional funds might reduce her need to withdraw from her investments for liquidity purposes, thereby affording her the capacity to invest in assets with potentially higher returns but longer lock-up periods. This change directly influences her ability to tolerate and possibly seek higher volatility for potentially greater returns. B is incorrect. While an increase in the annual inflation rate affects the real value of money and could influence investment decisions, it does not directly impact Redel's ability to take on risk. Inflation primarily affects the purchasing power of her returns and might necessitate adjustments in the investment strategy to preserve the real value of the portfolio. However, this economic change does not alter her financial capacity or risk tolerance, which are derived from her personal financial situation. It is more related to how the existing assets are managed rather than changing her ability to take on additional risk. C is incorrect. The proposed increase in capital gains and current income tax rates indeed affects the net returns from investments, making some investment options less attractive after taxes. However, this change primarily necessitates a review of the tax efficiency of the investment strategy rather than directly influencing Redel's ability to take risks. While tax considerations are crucial in financial planning, they do not alter her fundamental financial capacity or risk tolerance. Instead, they impact the selection of investment vehicles and strategies to optimize after-tax returns, which is a separate aspect of investment planning from risk capacity. ", "explhtml": "<p>Receiving an inheritance of $0.5 million from her deceased father&#x27;s estate significantly impacts Redel&#x27;s financial situation by increasing her total asset base. This influx of cash provides her with additional financial security and flexibility, allowing her to potentially take on more risk in her investment portfolio. With a larger asset base, she can diversify into riskier investments without jeopardizing her overall financial stability. This is because the relative impact of potential losses on riskier investments is mitigated by the increased size of her portfolio. Furthermore, the additional funds might reduce her need to withdraw from her investments for liquidity purposes, thereby affording her the capacity to invest in assets with potentially higher returns but longer lock-up periods. This change directly influences her ability to tolerate and possibly seek higher volatility for potentially greater returns.<\/p><p><b>B is incorrect<\/b>. While an increase in the annual inflation rate affects the real value of money and could influence investment decisions, it does not directly impact Redel&#x27;s ability to take on risk. Inflation primarily affects the purchasing power of her returns and might necessitate adjustments in the investment strategy to preserve the real value of the portfolio. However, this economic change does not alter her financial capacity or risk tolerance, which are derived from her personal financial situation. It is more related to how the existing assets are managed rather than changing her ability to take on additional risk.<\/p><p><b>C is incorrect<\/b>. The proposed increase in capital gains and current income tax rates indeed affects the net returns from investments, making some investment options less attractive after taxes. However, this change primarily necessitates a review of the tax efficiency of the investment strategy rather than directly influencing Redel&#x27;s ability to take risks. While tax considerations are crucial in financial planning, they do not alter her fundamental financial capacity or risk tolerance. Instead, they impact the selection of investment vehicles and strategies to optimize after-tax returns, which is a separate aspect of investment planning from risk capacity. <\/p><p class=\"los\">Portfolio Management, Learning Module 5: Economic And Investment Markets, LOS 5(g): Explain how the characteristics of the markets for a company’s products affect the company’s credit quality<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Clementine Associates<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Clementine Associates is an asset management firm that caters to individuals and institutions. Arthur Knight is the company&#x27;s senior investment manager, managing the investment accounts of wealthy individuals. Knight&#x27;s oldest client, Sun Redel, is a self-employed individual. Redel’s $2 million investment portfolio is allocated among equity, fixed income, commodities, and real estate. Redel accumulated her wealth over 15 years using a combination of savings and investments. Her business earnings exactly meet her living expenses.<\/p><p>Each year, Knight holds an annual meeting with Redel in which the client’s IPS and portfolio performance are reviewed and discussed. During his current meeting with the client, Knight takes note of the following items, which are marked for further investigation:<\/p><p>Note 1: Redel is expected to receive $0.5 million from her deceased father’s estate in two weeks.<\/p><p>Note 2: The annual inflation rate is expected to increase at the end of the current year.<\/p><p>Note 3: The proposed increase in capital gains and current income tax rates will be enacted at the beginning of the upcoming fiscal quarter.<\/p><p>Note 4: Redel will need to withdraw $500,000 from her portfolio to pay for purchasing a private boat in three months.<\/p><p>During the meeting, Redel makes the following statements:<\/p><p>Statement 1: I would like to request more frequent portfolio reviews.<\/p><p>Statement 2: I would like you to avoid including the shares of tobacco company stocks.<\/p><p>Statement 3: I would prefer for my portfolio manager to commit to the highest standards of professional competence and ethical conduct.<\/p><p>Lindsay Abdul is a senior portfolio manager who oversees institutional client accounts, such as the investment account of Sportex’s defined benefit pension plan. During a meeting with Sportex’s chief operating officer, Abdul takes down the following notes:<\/p><p>Note 5: Ten percent of the employees, originally covered by the plan, have elected to exercise their right to early retirement.<\/p><p>Note 6: The plan has reported a deficit of $0.8 million in the current year.<\/p><p>Note 7: Recently enacted local regulations restrict total investment in equities to no more than 30% of the net asset base. The plan’s financial asset base will need to be rebalanced as a consequence.<\/p><p>Abdul also overlooks the investment account of the Horizon Foundation, an institute providing university study scholarships to students in developing countries. The foundation requires an annual real return of 3.5% to fund its grant-making activities. Investment expenses amount to 0.9% while the expected long-term inflation rate equals 1.3%.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following notes contains the most likely information indicating a significant impact on Redel’s ability to take risk?<\/p><\/div>", "subj": "portfolio"}, {"n": 7, "q": "Do notes 1 and 4 mostly likely indicate that a revision in Redel’s liquidity requirements is warranted?", "opts": ["Yes.", "No, the receipt of the inheritance sum reflects a unique circumstance.", "No, the inheritance sum will increase the asset base and have no direct impact on portfolio liquidity."], "ans": "A", "expl": "Note 1 indicates that Redel is expected to receive $0.5 million from her deceased father’s estate in two weeks. While this inflow does increase her liquidity in the short term, Note 4 reveals that Redel will need to withdraw $500,000 from her portfolio to pay for a private boat in three months. This upcoming large expenditure is critical because Redel's business earnings only cover her living expenses, implying she has no additional cash flow to cover large, unplanned, or discretionary expenses. Therefore, the inheritance, while temporarily boosting liquidity, will be quickly offset by the boat purchase. This situation necessitates a revision of her liquidity requirements to ensure that her portfolio can accommodate this significant outflow without disrupting her investment strategy or incurring excessive transaction costs. B is incorrect. It misinterprets the impact of the inheritance as a unique circumstance that does not affect overall liquidity needs. While the inheritance is indeed a one-time event, its timing and the planned use of these funds directly influence Redel's short-term liquidity requirements. The receipt of the inheritance is closely followed by a large withdrawal for the boat purchase, indicating that the liquidity provided by the inheritance is not a surplus but rather a necessary buffer to meet an upcoming financial obligation. Failing to consider this in liquidity planning could lead to potential cash flow issues or the need to sell other investments in unfavorable market conditions to raise the required funds. C is incorrect. It overlooks the immediate liquidity impact on Redel's portfolio due to the boat purchase. While it is true that the inheritance increases the asset base, this increase is effectively neutralized by the simultaneous demand for cash. The statement fails to address the critical timing and use of the inherited funds, focusing instead on the overall asset base, which does not provide a complete picture of liquidity management. Proper liquidity management must account for the timing of cash flows in and out of the portfolio, ensuring that sufficient funds are available to meet all planned expenditures without adversely affecting the portfolio's overall performance. ", "explhtml": "<p>Note 1 indicates that Redel is expected to receive $0.5 million from her deceased father’s estate in two weeks. While this inflow does increase her liquidity in the short term, Note 4 reveals that Redel will need to withdraw $500,000 from her portfolio to pay for a private boat in three months. This upcoming large expenditure is critical because Redel&#x27;s business earnings only cover her living expenses, implying she has no additional cash flow to cover large, unplanned, or discretionary expenses. Therefore, the inheritance, while temporarily boosting liquidity, will be quickly offset by the boat purchase. This situation necessitates a revision of her liquidity requirements to ensure that her portfolio can accommodate this significant outflow without disrupting her investment strategy or incurring excessive transaction costs.<\/p><p><b>B is incorrect.<\/b> It misinterprets the impact of the inheritance as a unique circumstance that does not affect overall liquidity needs. While the inheritance is indeed a one-time event, its timing and the planned use of these funds directly influence Redel&#x27;s short-term liquidity requirements. The receipt of the inheritance is closely followed by a large withdrawal for the boat purchase, indicating that the liquidity provided by the inheritance is not a surplus but rather a necessary buffer to meet an upcoming financial obligation. Failing to consider this in liquidity planning could lead to potential cash flow issues or the need to sell other investments in unfavorable market conditions to raise the required funds.<\/p><p><b>C is incorrect.<\/b> It overlooks the immediate liquidity impact on Redel&#x27;s portfolio due to the boat purchase. While it is true that the inheritance increases the asset base, this increase is effectively neutralized by the simultaneous demand for cash. The statement fails to address the critical timing and use of the inherited funds, focusing instead on the overall asset base, which does not provide a complete picture of liquidity management. Proper liquidity management must account for the timing of cash flows in and out of the portfolio, ensuring that sufficient funds are available to meet all planned expenditures without adversely affecting the portfolio&#x27;s overall performance. <\/p><p class=\"los\">Portfolio Management, Learning Module 5: Economic And Investment Markets, LOS 5(g): Explain how the characteristics of the markets for a company&#x27;s products affect the company&#x27;s credit quality<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Clementine Associates<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Clementine Associates is an asset management firm that caters to individuals and institutions. Arthur Knight is the company&#x27;s senior investment manager, managing the investment accounts of wealthy individuals. Knight&#x27;s oldest client, Sun Redel, is a self-employed individual. Redel’s $2 million investment portfolio is allocated among equity, fixed income, commodities, and real estate. Redel accumulated her wealth over 15 years using a combination of savings and investments. Her business earnings exactly meet her living expenses.<\/p><p>Each year, Knight holds an annual meeting with Redel in which the client’s IPS and portfolio performance are reviewed and discussed. During his current meeting with the client, Knight takes note of the following items, which are marked for further investigation:<\/p><p>Note 1: Redel is expected to receive $0.5 million from her deceased father’s estate in two weeks.<\/p><p>Note 2: The annual inflation rate is expected to increase at the end of the current year.<\/p><p>Note 3: The proposed increase in capital gains and current income tax rates will be enacted at the beginning of the upcoming fiscal quarter.<\/p><p>Note 4: Redel will need to withdraw $500,000 from her portfolio to pay for purchasing a private boat in three months.<\/p><p>During the meeting, Redel makes the following statements:<\/p><p>Statement 1: I would like to request more frequent portfolio reviews.<\/p><p>Statement 2: I would like you to avoid including the shares of tobacco company stocks.<\/p><p>Statement 3: I would prefer for my portfolio manager to commit to the highest standards of professional competence and ethical conduct.<\/p><p>Lindsay Abdul is a senior portfolio manager who oversees institutional client accounts, such as the investment account of Sportex’s defined benefit pension plan. During a meeting with Sportex’s chief operating officer, Abdul takes down the following notes:<\/p><p>Note 5: Ten percent of the employees, originally covered by the plan, have elected to exercise their right to early retirement.<\/p><p>Note 6: The plan has reported a deficit of $0.8 million in the current year.<\/p><p>Note 7: Recently enacted local regulations restrict total investment in equities to no more than 30% of the net asset base. The plan’s financial asset base will need to be rebalanced as a consequence.<\/p><p>Abdul also overlooks the investment account of the Horizon Foundation, an institute providing university study scholarships to students in developing countries. The foundation requires an annual real return of 3.5% to fund its grant-making activities. Investment expenses amount to 0.9% while the expected long-term inflation rate equals 1.3%.<\/p><\/div><\/details><div class=\"qtext\"><p>Do notes 1 and 4 mostly likely indicate that a revision in Redel’s liquidity requirements is warranted?<\/p><\/div>", "subj": "portfolio"}, {"n": 8, "q": "Which of the following statements most likely reflects a unique circumstances constraint?", "opts": ["Statement 1", "Statement 2", "Statement 3"], "ans": "B", "expl": "Statement 2, which requests the exclusion of tobacco company stocks from the investment portfolio, most accurately reflects a unique circumstances constraint. Unique circumstances constraints are specific preferences or restrictions that a client imposes which directly affect the management of their investment portfolio. These constraints are typically not related to standard financial considerations such as liquidity, risk tolerance, or time horizon, but rather reflect personal, ethical, or situational preferences. In this case, Redel's request to exclude tobacco stocks is likely based on personal or ethical reasons, which imposes a specific limitation on the investment choices available to the portfolio manager. This type of constraint is significant because it can exclude potentially profitable investments from the portfolio, thereby affecting the portfolio's overall performance and composition. A is incorrect. Statement 1, where Redel requests more frequent portfolio reviews, does not represent a unique circumstances constraint but rather a service request. More frequent reviews might be driven by a desire for closer communication or more active management, but it does not impose any specific limitations on the investment choices or strategies that can be employed by the portfolio manager. This request is more about the management process and frequency of interaction rather than a constraint on how the portfolio is actually managed. C is incorrect. Statement 3, expressing a preference for the portfolio manager to commit to the highest standards of professional competence and ethical conduct, is also not a unique circumstances constraint. This statement reflects a general expectation towards the professional and ethical standards of the portfolio manager, which should ideally be a basic requirement in any client-manager relationship. It does not impose any specific investment constraints or preferences that would limit or dictate the choice of investments within the portfolio. ", "explhtml": "<p>Statement 2, which requests the exclusion of tobacco company stocks from the investment portfolio, most accurately reflects a unique circumstances constraint. Unique circumstances constraints are specific preferences or restrictions that a client imposes which directly affect the management of their investment portfolio. These constraints are typically not related to standard financial considerations such as liquidity, risk tolerance, or time horizon, but rather reflect personal, ethical, or situational preferences. In this case, Redel&#x27;s request to exclude tobacco stocks is likely based on personal or ethical reasons, which imposes a specific limitation on the investment choices available to the portfolio manager. This type of constraint is significant because it can exclude potentially profitable investments from the portfolio, thereby affecting the portfolio&#x27;s overall performance and composition.<\/p><p><b>A is incorrect<\/b>. Statement 1, where Redel requests more frequent portfolio reviews, does not represent a unique circumstances constraint but rather a service request. More frequent reviews might be driven by a desire for closer communication or more active management, but it does not impose any specific limitations on the investment choices or strategies that can be employed by the portfolio manager. This request is more about the management process and frequency of interaction rather than a constraint on how the portfolio is actually managed.<\/p><p><b>C is incorrect<\/b>. Statement 3, expressing a preference for the portfolio manager to commit to the highest standards of professional competence and ethical conduct, is also not a unique circumstances constraint. This statement reflects a general expectation towards the professional and ethical standards of the portfolio manager, which should ideally be a basic requirement in any client-manager relationship. It does not impose any specific investment constraints or preferences that would limit or dictate the choice of investments within the portfolio. <\/p><p class=\"los\">Portfolio Management, Learning Module 2: Using Multifactor Models, LOS 2(f): Describe uses of multifactor models and interpret the output of analyses based on multifactor models<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Clementine Associates<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Clementine Associates is an asset management firm that caters to individuals and institutions. Arthur Knight is the company&#x27;s senior investment manager, managing the investment accounts of wealthy individuals. Knight&#x27;s oldest client, Sun Redel, is a self-employed individual. Redel’s $2 million investment portfolio is allocated among equity, fixed income, commodities, and real estate. Redel accumulated her wealth over 15 years using a combination of savings and investments. Her business earnings exactly meet her living expenses.<\/p><p>Each year, Knight holds an annual meeting with Redel in which the client’s IPS and portfolio performance are reviewed and discussed. During his current meeting with the client, Knight takes note of the following items, which are marked for further investigation:<\/p><p>Note 1: Redel is expected to receive $0.5 million from her deceased father’s estate in two weeks.<\/p><p>Note 2: The annual inflation rate is expected to increase at the end of the current year.<\/p><p>Note 3: The proposed increase in capital gains and current income tax rates will be enacted at the beginning of the upcoming fiscal quarter.<\/p><p>Note 4: Redel will need to withdraw $500,000 from her portfolio to pay for purchasing a private boat in three months.<\/p><p>During the meeting, Redel makes the following statements:<\/p><p>Statement 1: I would like to request more frequent portfolio reviews.<\/p><p>Statement 2: I would like you to avoid including the shares of tobacco company stocks.<\/p><p>Statement 3: I would prefer for my portfolio manager to commit to the highest standards of professional competence and ethical conduct.<\/p><p>Lindsay Abdul is a senior portfolio manager who oversees institutional client accounts, such as the investment account of Sportex’s defined benefit pension plan. During a meeting with Sportex’s chief operating officer, Abdul takes down the following notes:<\/p><p>Note 5: Ten percent of the employees, originally covered by the plan, have elected to exercise their right to early retirement.<\/p><p>Note 6: The plan has reported a deficit of $0.8 million in the current year.<\/p><p>Note 7: Recently enacted local regulations restrict total investment in equities to no more than 30% of the net asset base. The plan’s financial asset base will need to be rebalanced as a consequence.<\/p><p>Abdul also overlooks the investment account of the Horizon Foundation, an institute providing university study scholarships to students in developing countries. The foundation requires an annual real return of 3.5% to fund its grant-making activities. Investment expenses amount to 0.9% while the expected long-term inflation rate equals 1.3%.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following statements most likely reflects a unique circumstances constraint?<\/p><\/div>", "subj": "portfolio"}, {"n": 9, "q": "The most appropriate response to Question 1 is the bond issue:", "opts": ["A.", "B.", "C."], "ans": "C", "expl": "A risk premium is essentially the extra return that an investor demands for taking on additional risk. According to the data provided, bond C has a negative discount for risk (-0.034), which indicates a negative covariance between the inter-temporal rate of substitution and the future price of the bond. In financial theory, particularly in the context of the Capital Asset Pricing Model (CAPM), a negative covariance with the market (or economic condition proxy) suggests that the asset (bond, in this case) provides a hedge against adverse movements in the market or economy. This hedging characteristic makes the bond more valuable during economic downturns, thereby commanding a higher expected return or risk premium. This is contrary to typical positive risk premiums where higher risk correlates with higher returns. In bond C's case, the negative risk factor inversely contributes to a positive risk premium because it lowers the risk exposure during downturns, thus increasing its desirability and required return. A is incorrect. Bond A, with a discount for risk of 0.045, indicates a positive covariance with the market or economic conditions. This suggests that bond A's price is likely to move in tandem with the market. In typical scenarios, a positive risk discount would imply a compensation for higher risk, but it does not inherently indicate a positive risk premium as it does not offer hedging benefits against market downturns. The risk premium in this context is not enhanced by any hedging benefit, which is a crucial factor in determining the most suitable bond under conditions where a positive risk premium is derived from hedging capabilities rather than just compensation for risk. B is incorrect. Similar to bond A, bond B also has a positive discount for risk (0.061), which is higher than that of bond A. This indicates even stronger positive covariance with the market compared to bond A. While this might suggest a higher risk and consequently a higher nominal risk premium, it does not align with the specific financial characteristic that would result in a positive risk premium due to hedging against economic downturns. Bond B, therefore, while potentially offering a higher return for higher risk, does not fit the criteria for having a positive risk premium in the context of providing economic downturn protection. ", "explhtml": "<p>A risk premium is essentially the extra return that an investor demands for taking on additional risk. According to the data provided, bond C has a negative discount for risk (-0.034), which indicates a negative covariance between the inter-temporal rate of substitution and the future price of the bond. In financial theory, particularly in the context of the Capital Asset Pricing Model (CAPM), a negative covariance with the market (or economic condition proxy) suggests that the asset (bond, in this case) provides a hedge against adverse movements in the market or economy. This hedging characteristic makes the bond more valuable during economic downturns, thereby commanding a higher expected return or risk premium. This is contrary to typical positive risk premiums where higher risk correlates with higher returns. In bond C&#x27;s case, the negative risk factor inversely contributes to a positive risk premium because it lowers the risk exposure during downturns, thus increasing its desirability and required return.<\/p><p><b>A is incorrect<\/b>. Bond A, with a discount for risk of 0.045, indicates a positive covariance with the market or economic conditions. This suggests that bond A&#x27;s price is likely to move in tandem with the market. In typical scenarios, a positive risk discount would imply a compensation for higher risk, but it does not inherently indicate a positive risk premium as it does not offer hedging benefits against market downturns. The risk premium in this context is not enhanced by any hedging benefit, which is a crucial factor in determining the most suitable bond under conditions where a positive risk premium is derived from hedging capabilities rather than just compensation for risk.<\/p><p><b>B is incorrect<\/b>. Similar to bond A, bond B also has a positive discount for risk (0.061), which is higher than that of bond A. This indicates even stronger positive covariance with the market compared to bond A. While this might suggest a higher risk and consequently a higher nominal risk premium, it does not align with the specific financial characteristic that would result in a positive risk premium due to hedging against economic downturns. Bond B, therefore, while potentially offering a higher return for higher risk, does not fit the criteria for having a positive risk premium in the context of providing economic downturn protection. <\/p><p class=\"los\">Portfolio Management, Learning Module 5: Economic And Investment Markets, LOS 5(b): Explain the role of expectations and changes in expectations in market valuation<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Dave Gilbert<\/summary><div class=\"vig-body\"><p>Dave Gilbert is a portfolio manager and economic analyst at Western Alliance, a wealth management firm operating in Regine, a country with an emerging market. In an effort to diversify his clients’ holdings, Gilbert has decided to allocate fixed-income securities to their portfolios. He decides to consider risky corporate bonds as potential asset classes and identifies four bond issues, each with a different maturity (Exhibit 1). Prior to allocation, Gilbert decomposes the value of each issue into two components: the risk-neutral present value and the discount for risk. The latter represents the covariance between the inter-temporal rate of substitution and the future price of the investment one year from today.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0015.webp\" style=\"max-width:min(100%,440px)\" alt=\"Exhibit: Potential Bond Issues for Client Portfolios\"><p>Bond Issue Risk Neutral Present Value* Discount for Risk*<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0016.webp\" style=\"max-width:min(100%,425px)\" alt=\"A 0.8943 0.045 B 0.9021 0.061 C 0.7654 -0.034 D 0.8993 0.000\"><p>*Per $1 of Par Value<\/p><p>After collecting the data in the exhibit, Gilbert aims to address the following questions:<\/p><p>Question 1: Which bond issue carries a positive risk premium?<\/p><p>Question 2: Which bond issue can be classified as a one-period default-free bond?<\/p><p>Question 3: Which bond issue will be least suitable for those investors who expect their labor income to shrink in the future due to poor economic conditions?<\/p><p>After making the allocations, Gilbert proceeds to explore the relationship between the real GDP growth and the real default-free interest rate in Regine’s economy. In the current year, Regine’s stocks have been included in a global emerging market index following significant technological progress. In a few years, the country’s economic growth is expected to converge with its steady-state projected growth. The current real GDP growth rate exceeds that observed in developed markets such as the U.S. and Japan.<\/p><p>Gilbert concludes his study by exploring the factors that help to explain the observed upward-sloping nominal yield curve. He believes the slope may indicate a preference for one bond maturity over the other.<\/p><\/div><\/details><div class=\"qtext\"><p>The most appropriate response to Question 1 is the bond issue:<\/p><\/div>", "subj": "portfolio"}, {"n": 10, "q": "The most appropriate response to Question 2 is bond issue:", "opts": ["A.", "C.", "D."], "ans": "C", "expl": "A one-period default-free bond is characterized by having no risk of default and thus no discount for risk. The discount for risk is essentially the covariance between the inter-temporal rate of substitution and the future price of the bond. If this covariance is zero, it indicates that the future price of the bond is certain and does not vary with economic conditions, making it default-free. According to the data provided in the exhibit, Bond D has a discount for risk of 0.000, which means there is no covariance and thus no risk associated with changes in economic conditions. This makes Bond D the only bond among the options that fits the definition of a one-period default-free bond. A is incorrect. Bond A has a discount for risk of 0.045, which indicates a positive covariance between the inter-temporal rate of substitution and the future price of the bond. This positive covariance suggests that the future price of Bond A is not certain and can vary depending on economic conditions, which introduces a risk of default. Therefore, Bond A cannot be classified as a one-period default-free bond because it does not meet the criterion of having zero covariance, which is essential for a bond to be considered default-free. C is incorrect. Although Bond C has a negative discount for risk (-0.034), it still indicates a relationship between the inter-temporal rate of substitution and the future price of the bond. The negative covariance suggests that the bond's price inversely varies with economic conditions, which still introduces uncertainty and risk. The requirement for a bond to be classified as one-period default-free is a zero covariance, indicating no variation or risk associated with economic changes. ", "explhtml": "<p>A one-period default-free bond is characterized by having no risk of default and thus no discount for risk. The discount for risk is essentially the covariance between the inter-temporal rate of substitution and the future price of the bond. If this covariance is zero, it indicates that the future price of the bond is certain and does not vary with economic conditions, making it default-free. According to the data provided in the exhibit, Bond D has a discount for risk of 0.000, which means there is no covariance and thus no risk associated with changes in economic conditions. This makes Bond D the only bond among the options that fits the definition of a one-period default-free bond.<\/p><p><b>A is incorrect<\/b>. Bond A has a discount for risk of 0.045, which indicates a positive covariance between the inter-temporal rate of substitution and the future price of the bond. This positive covariance suggests that the future price of Bond A is not certain and can vary depending on economic conditions, which introduces a risk of default. Therefore, Bond A cannot be classified as a one-period default-free bond because it does not meet the criterion of having zero covariance, which is essential for a bond to be considered default-free.<\/p><p><b>C is incorrect<\/b>. Although Bond C has a negative discount for risk (-0.034), it still indicates a relationship between the inter-temporal rate of substitution and the future price of the bond. The negative covariance suggests that the bond&#x27;s price inversely varies with economic conditions, which still introduces uncertainty and risk. The requirement for a bond to be classified as one-period default-free is a zero covariance, indicating no variation or risk associated with economic changes. <\/p><p class=\"los\">Portfolio Management, Learning Module 5: Economic And Investment Markets, LOS 5(c): Explain the relationship between the long-term growth rate of the economy, the volatility of the growth rate, and the average level of real short-term interest rates<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Dave Gilbert<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dave Gilbert is a portfolio manager and economic analyst at Western Alliance, a wealth management firm operating in Regine, a country with an emerging market. In an effort to diversify his clients’ holdings, Gilbert has decided to allocate fixed-income securities to their portfolios. He decides to consider risky corporate bonds as potential asset classes and identifies four bond issues, each with a different maturity (Exhibit 1). Prior to allocation, Gilbert decomposes the value of each issue into two components: the risk-neutral present value and the discount for risk. The latter represents the covariance between the inter-temporal rate of substitution and the future price of the investment one year from today.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0015.webp\" style=\"max-width:min(100%,440px)\" alt=\"Exhibit: Potential Bond Issues for Client Portfolios\"><p>Bond Issue Risk Neutral Present Value* Discount for Risk*<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0016.webp\" style=\"max-width:min(100%,425px)\" alt=\"A 0.8943 0.045 B 0.9021 0.061 C 0.7654 -0.034 D 0.8993 0.000\"><p>*Per $1 of Par Value<\/p><p>After collecting the data in the exhibit, Gilbert aims to address the following questions:<\/p><p>Question 1: Which bond issue carries a positive risk premium?<\/p><p>Question 2: Which bond issue can be classified as a one-period default-free bond?<\/p><p>Question 3: Which bond issue will be least suitable for those investors who expect their labor income to shrink in the future due to poor economic conditions?<\/p><p>After making the allocations, Gilbert proceeds to explore the relationship between the real GDP growth and the real default-free interest rate in Regine’s economy. In the current year, Regine’s stocks have been included in a global emerging market index following significant technological progress. In a few years, the country’s economic growth is expected to converge with its steady-state projected growth. The current real GDP growth rate exceeds that observed in developed markets such as the U.S. and Japan.<\/p><p>Gilbert concludes his study by exploring the factors that help to explain the observed upward-sloping nominal yield curve. He believes the slope may indicate a preference for one bond maturity over the other.<\/p><\/div><\/details><div class=\"qtext\"><p>The most appropriate response to Question 2 is bond issue:<\/p><\/div>", "subj": "portfolio"}, {"n": 11, "q": "The most appropriate response to Question 3 is the bond issue:", "opts": ["B.", "C.", "D."], "ans": "B", "expl": "Bond C is the least suitable for investors anticipating reduced labor income during economic downturns due to
