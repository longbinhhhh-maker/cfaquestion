ross Domestic Product<\/p><p>F<sub>INF<\/sub>= Inflation<\/p><p>F<sub>CAP<\/sub>= Manufacturing Capacity Utilization<\/p><p>F<sub>UNEM<\/sub>= Unemployment Rate<\/p><p>In her review, May assumes the error term when using the model is zero. She also uses inputs<\/p><p>and estimates from historical monthly returns dating 5 years, as presented in Exhibit 1.<\/p><p><b>Exhibit 1: Estimates From and Inputs for The Current Macroeconomic Model<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0060.webp\" style=\"max-width:min(100%,680px)\" alt=\"Intercept Coefficients and Factor Sensitivities Factor Benchmark Factor Portfolio A Portfolio B Portfolio C Surprise (%) Intercept (%) 4.33 3.30 2.76 FGDP 0.6 0.82 0.82 0.00 0.34 FINF −1.02 0.6 −0.32 1.01 −1.67 FCAP 1.20 3.1 1.32 0.00 0.6 FUNEM −0.32 1.6 −0.16 0.00 −0.06 Most Recent Year Annual Retu\"><p>May also calculates the mean active return and tracking error using the macroeconomic model.<\/p><p>The results are calculated in Exhibit 2.<\/p><p><b>Exhibit 2: Macroeconomic Factor Model Mean Active Return and Tracking Error<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0061.webp\" style=\"max-width:min(100%,406px)\" alt=\"Portfolio Mean Active Return Tracking Error Portfolio A 2.6% 1.80% Portfolio B −0.6% 1.42% Portfolio C 0.62% 1.08%\"><p>May constructs a fundamental factor model with four factors:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0062.webp\" style=\"max-width:min(100%,385px)\" alt=\"Ri = ai + bi1FLEV + bi2FLIQ + bi3FVAR + bi4FEGR + εi\"><p>Where,<\/p><p>F<sub>LEV<\/sub>= Financial leverage<\/p><p>F<sub>LIQ<\/sub>= Liquidity<\/p><p>F<sub>VAR<\/sub>= Revenue Variability<\/p><p>F<sub>EGR<\/sub>= Earnings Growth<\/p><p>During lunch, Meng and May discussed the advantages and disadvantages of fundamental,<\/p><p>macroeconomic, and statistical factor models. May mentions the following to Meng, “An edge<\/p><p>that statistical factor models have over macroeconomic and fundamental ones is their<\/p><p>adaptability. Statistical models can quickly adjust to changes in data patterns without being tied<\/p><p>to specific economic theories or fundamental principles. This flexibility allows for more timely<\/p><p>and relevant insights, especially in rapidly changing market conditions.”<\/p><\/div><\/details><div class=\"qtext\"><p>Surprises most likely explain the active risk for Portfolio B in: ( Use Exhibit 1)<\/p><\/div>", "subj": "portfolio"}, {"n": 47, "q": "Using information from Exhibit 2, the portfolio with the worst information ratio is most likely to be:", "opts": ["Portfolio A", "Portfolio B", "Portfolio C"], "ans": "B", "expl": "A is incorrect. Portfolio A has the best information ratio C is incorrect. Portfolio C comes second after Portfolio A.", "explhtml": "<img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0063.webp\" style=\"max-width:min(100%,169px)\" alt=\"¯¯¯¯RP + ¯¯¯¯ RB IR = RP −RB −0.6% IR = = −0.42 1.42%\"><p><b>A is incorrect.<\/b> Portfolio A has the best information ratio<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0064.webp\" style=\"max-width:min(100%,146px)\" alt=\"2.6% IR = = 1.44 1.8%\"><p><b>C is incorrect.<\/b> Portfolio C comes second after Portfolio A.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0065.webp\" style=\"max-width:min(100%,151px)\" alt=\"0.62% IR = = 0.57 1.08%\"><p class=\"los\">Portfolio Management, Learning Module 2: Using Multifactor Models, LOS 2(c): Calculate the expected return on an asset given an asset’s factor sensitivities and the factor risk premiums<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 45–48 · Susan Meng<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Susan Meng is a portfolio manager at the Great Walls Fund. Meng works closely with Anne May,<\/p><p>CFA, an associate at the firm. Meng asked May to consider a fundamental factor model in place<\/p><p>of the macroeconomic factor model that the Fund currently uses. The four-factor macroeconomic<\/p><p>model:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0059.webp\" style=\"max-width:min(100%,400px)\" alt=\"Ri = ai + bi1FGDP + bi2FINF + bi3FCAP + bi4FUNEM + εi\"><p>Where:<\/p><p>F<sub>GDP<\/sub>= Gross Domestic Product<\/p><p>F<sub>INF<\/sub>= Inflation<\/p><p>F<sub>CAP<\/sub>= Manufacturing Capacity Utilization<\/p><p>F<sub>UNEM<\/sub>= Unemployment Rate<\/p><p>In her review, May assumes the error term when using the model is zero. She also uses inputs<\/p><p>and estimates from historical monthly returns dating 5 years, as presented in Exhibit 1.<\/p><p><b>Exhibit 1: Estimates From and Inputs for The Current Macroeconomic Model<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0060.webp\" style=\"max-width:min(100%,680px)\" alt=\"Intercept Coefficients and Factor Sensitivities Factor Benchmark Factor Portfolio A Portfolio B Portfolio C Surprise (%) Intercept (%) 4.33 3.30 2.76 FGDP 0.6 0.82 0.82 0.00 0.34 FINF −1.02 0.6 −0.32 1.01 −1.67 FCAP 1.20 3.1 1.32 0.00 0.6 FUNEM −0.32 1.6 −0.16 0.00 −0.06 Most Recent Year Annual Retu\"><p>May also calculates the mean active return and tracking error using the macroeconomic model.<\/p><p>The results are calculated in Exhibit 2.<\/p><p><b>Exhibit 2: Macroeconomic Factor Model Mean Active Return and Tracking Error<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0061.webp\" style=\"max-width:min(100%,406px)\" alt=\"Portfolio Mean Active Return Tracking Error Portfolio A 2.6% 1.80% Portfolio B −0.6% 1.42% Portfolio C 0.62% 1.08%\"><p>May constructs a fundamental factor model with four factors:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0062.webp\" style=\"max-width:min(100%,385px)\" alt=\"Ri = ai + bi1FLEV + bi2FLIQ + bi3FVAR + bi4FEGR + εi\"><p>Where,<\/p><p>F<sub>LEV<\/sub>= Financial leverage<\/p><p>F<sub>LIQ<\/sub>= Liquidity<\/p><p>F<sub>VAR<\/sub>= Revenue Variability<\/p><p>F<sub>EGR<\/sub>= Earnings Growth<\/p><p>During lunch, Meng and May discussed the advantages and disadvantages of fundamental,<\/p><p>macroeconomic, and statistical factor models. May mentions the following to Meng, “An edge<\/p><p>that statistical factor models have over macroeconomic and fundamental ones is their<\/p><p>adaptability. Statistical models can quickly adjust to changes in data patterns without being tied<\/p><p>to specific economic theories or fundamental principles. This flexibility allows for more timely<\/p><p>and relevant insights, especially in rapidly changing market conditions.”<\/p><\/div><\/details><div class=\"qtext\"><p>Using information from Exhibit 2, the portfolio with the worst information ratio is most likely to be:<\/p><\/div>", "subj": "portfolio"}, {"n": 48, "q": "Is May’s comment regarding statistical factor models correct?", "opts": ["No", "Yes", "No, because of the assumptions"], "ans": "B", "expl": "She highlights their adaptability, which is a significant advantage. Unlike macroeconomic and fundamental models, which rely on specific economic theories or fundamental principles, statistical factor models can adjust more swiftly to changes in data patterns. This flexibility allows them to provide timely and relevant insights, which are particularly useful in rapidly changing market conditions. May's observation underscores that statistical factor models do not require rigid assumptions, making them more versatile in handling diverse and evolving datasets. A is incorrect. May's comment about the adaptability of statistical factor models is accurate. Statistical models adjust quickly to changes in data patterns without the constraints of economic theories or fundamental principles. So, saying \"No\" would dismiss the validity of her point. C is incorrect. It presents misleading reasoning. The issue isn't with any specific assumptions made by statistical factor models; the point is that they benefit from their flexibility and adaptability. They operate without the strict assumptions tied to economic or fundamental principles, making them more responsive to changing data patterns.", "explhtml": "<p>She highlights their adaptability, which is a significant advantage. Unlike macroeconomic and fundamental models, which rely on specific economic theories or fundamental principles, statistical factor models can adjust more swiftly to changes in data patterns. This flexibility allows them to provide timely and relevant insights, which are particularly useful in rapidly changing market conditions.<\/p><p>May&#x27;s observation underscores that statistical factor models do not require rigid assumptions, making them more versatile in handling diverse and evolving datasets.<\/p><p><b>A is incorrect.<\/b> May&#x27;s comment about the adaptability of statistical factor models is accurate. Statistical models adjust quickly to changes in data patterns without the constraints of economic theories or fundamental principles.<\/p><p>So, saying &quot;No&quot; would dismiss the validity of her point.<\/p><p><b>C is incorrect.<\/b> It presents misleading reasoning. The issue isn&#x27;t with any specific assumptions made by statistical factor models; the point is that they benefit from their flexibility and adaptability. They operate without the strict assumptions tied to economic or fundamental principles, making them more responsive to changing data patterns.<\/p><p class=\"los\">Portfolio Management, Learning Module 2: Using Multifactor Models, LOS 2(c): Calculate the expected return on an asset given an asset’s factor sensitivities and the factor risk premiums<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 45–48 · Susan Meng<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Susan Meng is a portfolio manager at the Great Walls Fund. Meng works closely with Anne May,<\/p><p>CFA, an associate at the firm. Meng asked May to consider a fundamental factor model in place<\/p><p>of the macroeconomic factor model that the Fund currently uses. The four-factor macroeconomic<\/p><p>model:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0059.webp\" style=\"max-width:min(100%,400px)\" alt=\"Ri = ai + bi1FGDP + bi2FINF + bi3FCAP + bi4FUNEM + εi\"><p>Where:<\/p><p>F<sub>GDP<\/sub>= Gross Domestic Product<\/p><p>F<sub>INF<\/sub>= Inflation<\/p><p>F<sub>CAP<\/sub>= Manufacturing Capacity Utilization<\/p><p>F<sub>UNEM<\/sub>= Unemployment Rate<\/p><p>In her review, May assumes the error term when using the model is zero. She also uses inputs<\/p><p>and estimates from historical monthly returns dating 5 years, as presented in Exhibit 1.<\/p><p><b>Exhibit 1: Estimates From and Inputs for The Current Macroeconomic Model<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0060.webp\" style=\"max-width:min(100%,680px)\" alt=\"Intercept Coefficients and Factor Sensitivities Factor Benchmark Factor Portfolio A Portfolio B Portfolio C Surprise (%) Intercept (%) 4.33 3.30 2.76 FGDP 0.6 0.82 0.82 0.00 0.34 FINF −1.02 0.6 −0.32 1.01 −1.67 FCAP 1.20 3.1 1.32 0.00 0.6 FUNEM −0.32 1.6 −0.16 0.00 −0.06 Most Recent Year Annual Retu\"><p>May also calculates the mean active return and tracking error using the macroeconomic model.<\/p><p>The results are calculated in Exhibit 2.<\/p><p><b>Exhibit 2: Macroeconomic Factor Model Mean Active Return and Tracking Error<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0061.webp\" style=\"max-width:min(100%,406px)\" alt=\"Portfolio Mean Active Return Tracking Error Portfolio A 2.6% 1.80% Portfolio B −0.6% 1.42% Portfolio C 0.62% 1.08%\"><p>May constructs a fundamental factor model with four factors:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0062.webp\" style=\"max-width:min(100%,385px)\" alt=\"Ri = ai + bi1FLEV + bi2FLIQ + bi3FVAR + bi4FEGR + εi\"><p>Where,<\/p><p>F<sub>LEV<\/sub>= Financial leverage<\/p><p>F<sub>LIQ<\/sub>= Liquidity<\/p><p>F<sub>VAR<\/sub>= Revenue Variability<\/p><p>F<sub>EGR<\/sub>= Earnings Growth<\/p><p>During lunch, Meng and May discussed the advantages and disadvantages of fundamental,<\/p><p>macroeconomic, and statistical factor models. May mentions the following to Meng, “An edge<\/p><p>that statistical factor models have over macroeconomic and fundamental ones is their<\/p><p>adaptability. Statistical models can quickly adjust to changes in data patterns without being tied<\/p><p>to specific economic theories or fundamental principles. This flexibility allows for more timely<\/p><p>and relevant insights, especially in rapidly changing market conditions.”<\/p><\/div><\/details><div class=\"qtext\"><p>Is May’s comment regarding statistical factor models correct?<\/p><\/div>", "subj": "portfolio"}, {"n": 49, "q": "Which of the following is most likely to be included in Paine’s report to management concerning the use of risk measures in capital allocation decisions?", "opts": ["VaR measures capture the increased liquidity risk during stress periods.", "Scenario analysis cannot be used to evaluate the effect of outlier events on each line of business.", "VaR approaches that can accommodate a non-normal distribution are critical to understanding relative risk across lines of business."], "ans": "C", "expl": "Traditional VaR models often assume a normal distribution of returns, which may not accurately capture the risk in financial markets where returns can be skewed or have fat tails. By using VaR approaches that can accommodate non-normal distributions, the bank can better understand and manage the relative risk across different lines of business, especially those with non-standard risk profiles. A is incorrect. VaR measures do not inherently capture liquidity risk, particularly during stress periods. VaR primarily measures market risk and does not account for the potential difficulty in liquidating assets under stressed market conditions. B is incorrect. Scenario analysis is specifically designed to evaluate the effect of outlier events on each line of business. It allows the bank to assess the impact of extreme but plausible events, providing valuable insights into potential vulnerabilities and helping develop mitigation strategies.", "explhtml": "<p>Traditional VaR models often assume a normal distribution of returns, which may not accurately capture the risk in financial markets where returns can be skewed or have fat tails. By using VaR approaches that can accommodate non-normal distributions, the bank can better understand and manage the relative risk across different lines of business, especially those with non-standard risk profiles.<\/p><p><b>A is incorrect.<\/b> VaR measures do not inherently capture liquidity risk, particularly during stress periods. VaR primarily measures market risk and does not account for the potential difficulty in liquidating assets under stressed market conditions.<\/p><p><b>B is incorrect.<\/b> Scenario analysis is specifically designed to evaluate the effect of outlier events on each line of business. It allows the bank to assess the impact of extreme but plausible events, providing valuable insights into potential vulnerabilities and helping develop mitigation strategies.<\/p><p class=\"los\">Portfolio Management, Learning Module 3: Measuring and Managing Market Risk, LOS 3(c) Estimate and interpret VaR under the parametric, historical simulation, and Monte Carlo simulation methods.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 49–52 · Theodore Gonzalez<\/summary><div class=\"vig-body\"><p>Theodore Gonzalez, Head of the Risk Department at Glenrock Investment Solution LTD (GIS),<\/p><p>and his assistant, Richard Paine, are carrying out a risk assessment of the financial institution’s<\/p><p>investment wing and the overall risk exposure of the company. The investment wing manages an<\/p><p>equity fund and a fixed-income portfolio.<\/p><p>The bank wants to implement a forward-looking risk assessment with the current historical risk<\/p><p>characteristics. Gonzalez needs to establish which other risk metrics to include when<\/p><p>implementing the forward-looking risk assessment and decides to focus on tail risk to evaluate<\/p><p>the financial institution’s capital allocation in certain risky business lines. Gonzalez requests that<\/p><p>Paine add a section in his report highlighting the adequacy of risk measures when making asset<\/p><p>allocation decisions.<\/p><p>GIS’s fixed income portfolio is structured as a barbell portfolio, with 50% of the portfolio<\/p><p>invested in 10 to 15-year zero-coupon treasury bonds and the remaining 50% invested in 2 to 5-<\/p><p>year zero-coupon treasury bonds. Juliet Mendez, the portfolio manager, must remain fully<\/p><p>invested throughout the period until maturity and can allocate 35% and 65% of the assets to<\/p><p>each maturity bucket. The details of the portfolio are in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0066.webp\" style=\"max-width:min(100%,535px)\" alt=\"Exhibit 1: Fixed Income Portfolio 2-5 years Portfolio(A) 10-15 years Portfolio(B) Market Value $83.3 Million $86.2 Million Average YTM 1.52% 2.30% Average Duration 2.50 10.6\"><p>GIS manages an equity fund called the Gen X Fund that tracks the S&amp;P 500 Index price return<\/p><p>and generates a return that is two times that of the S&amp;P 500. The Gen X Fund has $ 456 million<\/p><p>in assets under management. To adjust the risk exposure of some of their clients, GIS’s chief<\/p><p>financial officer (CFO) uses calls and puts options on S&amp;P index futures. One of its clients, a 65-<\/p><p>year-old Veteran, has a low-risk tolerance, primarily concerned with minimizing costs and<\/p><p>avoiding any upfront premium payments. The CFO has asked Charles Jenkins, his associate, to<\/p><p>create an options strategy to ensure the portfolio’s delta is 0.80 without incurring any net debit,<\/p><p>as the client has explicitly ruled out strategies that require paying an option premium. The Gen X Fund’s value at risk (VaR) is $ 8.6 million at 6% for a day.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following is most likely to be included in Paine’s report to management concerning the use of risk measures in capital allocation decisions?<\/p><\/div>", "subj": "portfolio"}, {"n": 50, "q": "Suppose Mendez expects a 75 bp yield increase at all points along the yield curve. What trades is she most likely to carry out to reduce her risk?", "opts": ["Increase the duration of Portfolio A to 3 years and reduce the duration of Portfolio B to 10 years.", "Sell $ 20 million of Portfolio B and reinvest the proceeds in two-year bonds.", "Sell $ 60 million of Portfolio B and reinvest the proceeds in two-year bonds."], "ans": "B", "expl": "Bond duration measures how sensitive a bond's price is to interest rate changes. A higher duration indicates greater sensitivity to interest rate changes. When anticipating an increase in interest rates, reducing the portfolio’s duration helps mitigate the risk of price declines. Shorter-duration bonds are less sensitive to interest rate increases. Mendez is limited in how much he can shift from Portfolio A to B due to allocation constraints (35%-65%). Selling $20 million of B brings it to the lower end of the permitted range. By reinvesting the proceeds in shorter-maturity bonds (two-year bonds), Mendez substantially reduces the portfolio’s overall duration, aligning with the strategy to mitigate interest rate risk. A is incorrect. This option involves increasing the duration of Portfolio A, which is counterproductive when expecting an increase in interest rates. Increasing duration would increase sensitivity to interest rate changes, thereby increasing risk. C is incorrect. While this option also involves reinvesting in shorter-duration bonds, selling $60 million might be excessive and could disrupt the portfolio’s balance or exceed permissible limits.", "explhtml": "<p>Bond duration measures how sensitive a bond&#x27;s price is to interest rate changes. A higher duration indicates greater sensitivity to interest rate changes. When anticipating an increase in interest rates, reducing the portfolio’s duration helps mitigate the risk of price declines. Shorter-duration bonds are less sensitive to interest rate increases.<\/p><p>Mendez is limited in how much he can shift from Portfolio A to B due to allocation constraints (35%-65%). Selling $20 million of B brings it to the lower end of the permitted range. By reinvesting the proceeds in shorter-maturity bonds (two-year bonds), Mendez substantially reduces the portfolio’s overall duration, aligning with the strategy to mitigate interest rate risk.<\/p><p><b>A is incorrect.<\/b> This option involves increasing the duration of Portfolio A, which is counterproductive when expecting an increase in interest rates. Increasing duration would increase sensitivity to interest rate changes, thereby increasing risk.<\/p><p><b>C is incorrect.<\/b> While this option also involves reinvesting in shorter-duration bonds, selling $60 million might be excessive and could disrupt the portfolio’s balance or exceed permissible limits.<\/p><p class=\"los\">Portfolio Management, Learning Module 3: Measuring and Managing Market Risk, LOS 3(g) Demonstrate how equity, fixed-income, and options exposure measures may be used in measuring and managing market risk and volatility risk.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 49–52 · Theodore Gonzalez<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Theodore Gonzalez, Head of the Risk Department at Glenrock Investment Solution LTD (GIS),<\/p><p>and his assistant, Richard Paine, are carrying out a risk assessment of the financial institution’s<\/p><p>investment wing and the overall risk exposure of the company. The investment wing manages an<\/p><p>equity fund and a fixed-income portfolio.<\/p><p>The bank wants to implement a forward-looking risk assessment with the current historical risk<\/p><p>characteristics. Gonzalez needs to establish which other risk metrics to include when<\/p><p>implementing the forward-looking risk assessment and decides to focus on tail risk to evaluate<\/p><p>the financial institution’s capital allocation in certain risky business lines. Gonzalez requests that<\/p><p>Paine add a section in his report highlighting the adequacy of risk measures when making asset<\/p><p>allocation decisions.<\/p><p>GIS’s fixed income portfolio is structured as a barbell portfolio, with 50% of the portfolio<\/p><p>invested in 10 to 15-year zero-coupon treasury bonds and the remaining 50% invested in 2 to 5-<\/p><p>year zero-coupon treasury bonds. Juliet Mendez, the portfolio manager, must remain fully<\/p><p>invested throughout the period until maturity and can allocate 35% and 65% of the assets to<\/p><p>each maturity bucket. The details of the portfolio are in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0066.webp\" style=\"max-width:min(100%,535px)\" alt=\"Exhibit 1: Fixed Income Portfolio 2-5 years Portfolio(A) 10-15 years Portfolio(B) Market Value $83.3 Million $86.2 Million Average YTM 1.52% 2.30% Average Duration 2.50 10.6\"><p>GIS manages an equity fund called the Gen X Fund that tracks the S&amp;P 500 Index price return<\/p><p>and generates a return that is two times that of the S&amp;P 500. The Gen X Fund has $ 456 million<\/p><p>in assets under management. To adjust the risk exposure of some of their clients, GIS’s chief<\/p><p>financial officer (CFO) uses calls and puts options on S&amp;P index futures. One of its clients, a 65-<\/p><p>year-old Veteran, has a low-risk tolerance, primarily concerned with minimizing costs and<\/p><p>avoiding any upfront premium payments. The CFO has asked Charles Jenkins, his associate, to<\/p><p>create an options strategy to ensure the portfolio’s delta is 0.80 without incurring any net debit,<\/p><p>as the client has explicitly ruled out strategies that require paying an option premium. The Gen X Fund’s value at risk (VaR) is $ 8.6 million at 6% for a day.<\/p><\/div><\/details><div class=\"qtext\"><p>Suppose Mendez expects a 75 bp yield increase at all points along the yield curve. What trades is she most likely to carry out to reduce her risk?<\/p><\/div>", "subj": "portfolio"}, {"n": 51, "q": "Which of the following options strategies is The CFO most likely to recommend for the Veteran’s portfolio?", "opts": ["Short put", "Long put", "Short calls"], "ans": "C", "expl": "This involves selling call options, which can generate premium income and provide some downside protection. For a client with a low-risk tolerance, this strategy can help reduce the portfolio’s overall risk by capping potential gains and limiting exposure to significant losses. Ensuring the portfolio’s delta is 0.80 means the portfolio is less sensitive to changes in the underlying asset’s price. Selling calls can help achieve this by reducing the portfolio’s delta, making it less responsive to market movements, which aligns with the Veteran’s low-risk tolerance. Short calls can effectively hedge against potential declines in the S&P 500 Index. This is crucial for a client who prefers stability and lower risk. A is incorrect. Selling put options increases the portfolio’s risk since it obligates the seller to purchase the underlying asset if its price falls below the strike price. This strategy is unsuitable for a client with a low-risk tolerance. B is incorrect. Buying put options can provide downside protection but involves paying a premium, which might not align to maintain a delta of 0.80. While it reduces risk, it also incurs a cost that might not be ideal for the client’s strategy.", "explhtml": "<p>This involves selling call options, which can generate premium income and provide some downside protection. For a client with a low-risk tolerance, this strategy can help reduce the portfolio’s overall risk by capping potential gains and limiting exposure to significant losses. Ensuring the portfolio’s delta is 0.80 means the portfolio is less sensitive to changes in the underlying asset’s price. Selling calls can help achieve this by reducing the portfolio’s delta, making it less responsive to market movements, which aligns with the Veteran’s low-risk tolerance. Short calls can effectively hedge against potential declines in the S&amp;P 500 Index. This is crucial for a client who prefers stability and lower risk.<\/p><p><b>A is incorrect.<\/b> Selling put options increases the portfolio’s risk since it obligates the seller to purchase the underlying asset if its price falls below the strike price. This strategy is unsuitable for a client with a low-risk tolerance.<\/p><p><b>B is incorrect.<\/b> Buying put options can provide downside protection but involves paying a premium, which might not align to maintain a delta of 0.80. While it reduces risk, it also incurs a cost that might not be ideal for the client’s strategy.<\/p><p class=\"los\">Portfolio Management, Learning Module 3: Measuring and Managing Market Risk, LOS 3(g) Demonstrate how equity, fixed-income, and options exposure measures may be used in measuring and managing market risk and volatility risk.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 49–52 · Theodore Gonzalez<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Theodore Gonzalez, Head of the Risk Department at Glenrock Investment Solution LTD (GIS),<\/p><p>and his assistant, Richard Paine, are carrying out a risk assessment of the financial institution’s<\/p><p>investment wing and the overall risk exposure of the company. The investment wing manages an<\/p><p>equity fund and a fixed-income portfolio.<\/p><p>The bank wants to implement a forward-looking risk assessment with the current historical risk<\/p><p>characteristics. Gonzalez needs to establish which other risk metrics to include when<\/p><p>implementing the forward-looking risk assessment and decides to focus on tail risk to evaluate<\/p><p>the financial institution’s capital allocation in certain risky business lines. Gonzalez requests that<\/p><p>Paine add a section in his report highlighting the adequacy of risk measures when making asset<\/p><p>allocation decisions.<\/p><p>GIS’s fixed income portfolio is structured as a barbell portfolio, with 50% of the portfolio<\/p><p>invested in 10 to 15-year zero-coupon treasury bonds and the remaining 50% invested in 2 to 5-<\/p><p>year zero-coupon treasury bonds. Juliet Mendez, the portfolio manager, must remain fully<\/p><p>invested throughout the period until maturity and can allocate 35% and 65% of the assets to<\/p><p>each maturity bucket. The details of the portfolio are in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0066.webp\" style=\"max-width:min(100%,535px)\" alt=\"Exhibit 1: Fixed Income Portfolio 2-5 years Portfolio(A) 10-15 years Portfolio(B) Market Value $83.3 Million $86.2 Million Average YTM 1.52% 2.30% Average Duration 2.50 10.6\"><p>GIS manages an equity fund called the Gen X Fund that tracks the S&amp;P 500 Index price return<\/p><p>and generates a return that is two times that of the S&amp;P 500. The Gen X Fund has $ 456 million<\/p><p>in assets under management. To adjust the risk exposure of some of their clients, GIS’s chief<\/p><p>financial officer (CFO) uses calls and puts options on S&amp;P index futures. One of its clients, a 65-<\/p><p>year-old Veteran, has a low-risk tolerance, primarily concerned with minimizing costs and<\/p><p>avoiding any upfront premium payments. The CFO has asked Charles Jenkins, his associate, to<\/p><p>create an options strategy to ensure the portfolio’s delta is 0.80 without incurring any net debit,<\/p><p>as the client has explicitly ruled out strategies that require paying an option premium. The Gen X Fund’s value at risk (VaR) is $ 8.6 million at 6% for a day.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following options strategies is The CFO most likely to recommend for the Veteran’s portfolio?<\/p><\/div>", "subj": "portfolio"}, {"n": 52, "q": "Which of the following statements concerning the VaR of the Gen X Fund is most likely correct?", "opts": ["6% of the time, the portfolio is expected to experience a loss of $ 8.6 million.", "The maximum loss for the portfolio is expected to be $ 8.6 million.", "94% of the time, the portfolio is expected to experience a loss of $ 8.6 million."], "ans": "A", "expl": "Using a certain confidence level, Value at Risk (VaR) estimates a portfolio's maximum loss over a specific period. For instance, a VaR of $8.6 million at 6% for one day indicates there is a 6% chance that the portfolio could lose $8.6 million or more in a single day. B is incorrect. VaR does not represent the maximum possible loss. It only estimates the potential loss at a certain confidence level. Losses beyond the VaR threshold can and do occur, especially in extreme market conditions. C is incorrect. It misinterprets the confidence level. A 6% VaR implies that 94% of the time, the portfolio is expected to experience a loss of less than $8.6 million, not that it will experience a loss of $8.6 million 94% of the time.", "explhtml": "<p>Using a certain confidence level, Value at Risk (VaR) estimates a portfolio&#x27;s maximum loss over a specific period. For instance, a VaR of $8.6 million at 6% for one day indicates there is a 6% chance that the portfolio could lose $8.6 million or more in a single day.<\/p><p><b>B is incorrect.<\/b> VaR does not represent the maximum possible loss. It only estimates the potential loss at a certain confidence level. Losses beyond the VaR threshold can and do occur, especially in extreme market conditions.<\/p><p><b>C is incorrect.<\/b> It misinterprets the confidence level. A 6% VaR implies that 94% of the time, the portfolio is expected to experience a loss of less than $8.6 million, not that it will experience a loss of $8.6 million 94% of the time.<\/p><p class=\"los\">Portfolio Management, Learning Module 3: Measuring and Managing Market Risk, LOS 3(c) Estimate and interpret VaR under the parametric, historical simulation, and Monte Carlo simulation methods.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 49–52 · Theodore Gonzalez<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Theodore Gonzalez, Head of the Risk Department at Glenrock Investment Solution LTD (GIS),<\/p><p>and his assistant, Richard Paine, are carrying out a risk assessment of the financial institution’s<\/p><p>investment wing and the overall risk exposure of the company. The investment wing manages an<\/p><p>equity fund and a fixed-income portfolio.<\/p><p>The bank wants to implement a forward-looking risk assessment with the current historical risk<\/p><p>characteristics. Gonzalez needs to establish which other risk metrics to include when<\/p><p>implementing the forward-looking risk assessment and decides to focus on tail risk to evaluate<\/p><p>the financial institution’s capital allocation in certain risky business lines. Gonzalez requests that<\/p><p>Paine add a section in his report highlighting the adequacy of risk measures when making asset<\/p><p>allocation decisions.<\/p><p>GIS’s fixed income portfolio is structured as a barbell portfolio, with 50% of the portfolio<\/p><p>invested in 10 to 15-year zero-coupon treasury bonds and the remaining 50% invested in 2 to 5-<\/p><p>year zero-coupon treasury bonds. Juliet Mendez, the portfolio manager, must remain fully<\/p><p>invested throughout the period until maturity and can allocate 35% and 65% of the assets to<\/p><p>each maturity bucket. The details of the portfolio are in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0066.webp\" style=\"max-width:min(100%,535px)\" alt=\"Exhibit 1: Fixed Income Portfolio 2-5 years Portfolio(A) 10-15 years Portfolio(B) Market Value $83.3 Million $86.2 Million Average YTM 1.52% 2.30% Average Duration 2.50 10.6\"><p>GIS manages an equity fund called the Gen X Fund that tracks the S&amp;P 500 Index price return<\/p><p>and generates a return that is two times that of the S&amp;P 500. The Gen X Fund has $ 456 million<\/p><p>in assets under management. To adjust the risk exposure of some of their clients, GIS’s chief<\/p><p>financial officer (CFO) uses calls and puts options on S&amp;P index futures. One of its clients, a 65-<\/p><p>year-old Veteran, has a low-risk tolerance, primarily concerned with minimizing costs and<\/p><p>avoiding any upfront premium payments. The CFO has asked Charles Jenkins, his associate, to<\/p><p>create an options strategy to ensure the portfolio’s delta is 0.80 without incurring any net debit,<\/p><p>as the client has explicitly ruled out strategies that require paying an option premium. The Gen X Fund’s value at risk (VaR) is $ 8.6 million at 6% for a day.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following statements concerning the VaR of the Gen X Fund is most likely correct?<\/p><\/div>", "subj": "portfolio"}, {"n": 53, "q": "Using Exhibit 1, Westborough's portfolio is most likely to experience:", "opts": ["Over one month, 5% of the time, there is a loss equal to or exceeding £6.56 million.", "Over the next year, there will be a minimum daily loss of £2.20 million.", "Expect an average daily loss of £2.20 million on 5% of the days over the next 250 trading days."], "ans": "A", "expl": "Under the assumed market conditions, VaR is the minimum loss that can be expected at a certain percentage of the time over a certain period. As an equivalent, a 95% level of confidence is often expressed as a 5% VaR. Accordingly, the monthly VaR in Exhibit 1 indicates that, 5% of the time, a loss of £6.56 million can occur over a one-month period. Alternatively, 95% of the time, a loss exceeding £6.56 million is unlikely. B is incorrect. VaR (Value at Risk) measures the potential loss over a specific period, such as one day or a month, at a given confidence level. It doesn't guarantee a minimum daily loss. A statement like this misinterprets the concept of VaR, which is about assessing risk over a set period, not predicting a daily minimum loss over a year. C is incorrect. It confuses the average loss with the concept of VaR. VaR indicates a threshold loss amount that won't be exceeded with a certain confidence level, not an average daily loss. An average daily loss calculation would involve a different statistical approach and interpretation, distinct from how VaR is used to measure risk.", "explhtml": "<p>Under the assumed market conditions, VaR is the minimum loss that can be expected at a certain percentage of the time over a certain period. As an equivalent, a 95% level of confidence is often expressed as a 5% VaR. Accordingly, the monthly VaR in Exhibit 1 indicates that, 5% of the time, a loss of £6.56 million can occur over a one-month period. Alternatively, 95% of the time, a loss exceeding £6.56 million is unlikely.<\/p><p><b>B is incorrect.<\/b> VaR (Value at Risk) measures the potential loss over a specific period, such as one day or a month, at a given confidence level. It doesn&#x27;t guarantee a minimum daily loss. A statement like this misinterprets the concept of VaR, which is about assessing risk over a set period, not predicting a daily minimum loss over a year.<\/p><p><b>C is incorrect.<\/b> It confuses the average loss with the concept of VaR. VaR indicates a threshold loss amount that won&#x27;t be exceeded with a certain confidence level, not an average daily loss. An average daily loss calculation would involve a different statistical approach and interpretation, distinct from how VaR is used to measure risk.<\/p><p class=\"los\">Portfolio Management, Learning Module 3: Measuring and Managing Market Risk, LOS 3(c) Estimate and interpret VaR under the parametric, historical simulation, and Monte Carlo simulation methods.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 53–56 · Constantine Audra<\/summary><div class=\"vig-body\"><p>Constantine Audra, CFA, is a portfolio manager at Westborough Pension Fund. The fund&#x27;s<\/p><p>portfolio comprises fixed-income instruments that are structured in such a way that it will match<\/p><p>the fund&#x27;s liabilities. Audra works closely with Annie Peng, the fund&#x27;s risk analyst, to achieve<\/p><p>this.<\/p><p>During lunch, Audra and Peng discuss the latest risk report. Using the historical method, Peng<\/p><p>calculated the entire portfolio&#x27;s VaR, assuming 250 trading days per year, during a 3-year<\/p><p>lookback period. The VaR Results are presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0067.webp\" style=\"max-width:min(100%,403px)\" alt=\"Exhibit 1: Westborough Portfolio VaR (in £ millions) Daily VaR Monthly VaR Confidence Level 2.20 6.56 95%\"><p>After going through the report, Audra noticed that despite the portfolio accumulating a<\/p><p>substantial loss over the last year, the number of daily VaR breaches is zero. Audra also asks<\/p><p>Peng to carry out the following two risk analyses on Westborough&#x27;s portfolio:<\/p><p>Analysis 1: With 95% confidence, estimate how much Westborough&#x27;s assets will underperform its<\/p><p>liabilities over one year.<\/p><p>Analysis 2: Assess the risk and return of a repeat of the last financial crisis using scenario<\/p><p>analysis.<\/p><\/div><\/details><div class=\"qtext\"><p>Using Exhibit 1, Westborough&#x27;s portfolio is most likely to experience:<\/p><\/div>", "subj": "portfolio"}, {"n": 54, "q": "What is most likely causing the number of VaR breaches?", "opts": ["The lookback period is too long to reflect recent market volatility", "The confidence level used is 95% instead of 98%.", "The use of a standard normal distribution in the VaR model."], "ans": "A", "expl": "Westborough encountered no daily VaR breaches over the past year but faced significant losses. This highlights a fundamental limitation of VaR: its sensitivity to varying volatility conditions. A portfolio may stay within its VaR threshold daily yet incur losses close to this limit each day. When market volatility is lower than the average of the lookback period, the portfolio can experience considerable cumulative losses without technically breaching the VaR. This reveals how VaR can underestimate risk in specific volatility regimes. B is incorrect. This choice is incorrect because using a 95% confidence level versus a 98% confidence level does not fundamentally address the issue of cumulative losses. A higher confidence level would reduce the frequency of breaches, but does not tackle the sensitivity to changing volatility conditions, which is the core issue here. C is incorrect. Using a standard normal distribution in the VaR model does not directly relate to the problem of experiencing losses while not breaching VaR limits. Although using a different distribution might adjust the risk assessment, it does not inherently resolve the issue of volatility sensitivity, which is why the correct answer focuses on the lookback period relative to market volatility.", "explhtml": "<p>Westborough encountered no daily VaR breaches over the past year but faced significant losses. This highlights a fundamental limitation of VaR: its sensitivity to varying volatility conditions. A portfolio may stay within its VaR threshold daily yet incur losses close to this limit each day. When market volatility is lower than the average of the lookback period, the portfolio can experience considerable cumulative losses without technically breaching the VaR. This reveals how VaR can underestimate risk in specific volatility regimes.<\/p><p><b>B is incorrect.<\/b> This choice is incorrect because using a 95% confidence level versus a 98% confidence level does not fundamentally address the issue of cumulative losses. A higher confidence level would reduce the frequency of breaches, but does not tackle the sensitivity to changing volatility conditions, which is the core issue here.<\/p><p><b>C is incorrect. <\/b>Using a standard normal distribution in the VaR model does not directly relate to the problem of experiencing losses while not breaching VaR limits. Although using a different distribution might adjust the risk assessment, it does not inherently resolve the issue of volatility sensitivity, which is why the correct answer focuses on the lookback period relative to market volatility.<\/p><p class=\"los\">Portfolio Management, Learning Module 3: Measuring and Managing Market Risk, LOS 3(c) Estimate and interpret VaR under the parametric, historical simulation, and Monte Carlo simulation methods.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 53–56 · Constantine Audra<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Constantine Audra, CFA, is a portfolio manager at Westborough Pension Fund. The fund&#x27;s<\/p><p>portfolio comprises fixed-income instruments that are structured in such a way that it will match<\/p><p>the fund&#x27;s liabilities. Audra works closely with Annie Peng, the fund&#x27;s risk analyst, to achieve<\/p><p>this.<\/p><p>During lunch, Audra and Peng discuss the latest risk report. Using the historical method, Peng<\/p><p>calculated the entire portfolio&#x27;s VaR, assuming 250 trading days per year, during a 3-year<\/p><p>lookback period. The VaR Results are presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0067.webp\" style=\"max-width:min(100%,403px)\" alt=\"Exhibit 1: Westborough Portfolio VaR (in £ millions) Daily VaR Monthly VaR Confidence Level 2.20 6.56 95%\"><p>After going through the report, Audra noticed that despite the portfolio accumulating a<\/p><p>substantial loss over the last year, the number of daily VaR breaches is zero. Audra also asks<\/p><p>Peng to carry out the following two risk analyses on Westborough&#x27;s portfolio:<\/p><p>Analysis 1: With 95% confidence, estimate how much Westborough&#x27;s assets will underperform its<\/p><p>liabilities over one year.<\/p><p>Analysis 2: Assess the risk and return of a repeat of the last financial crisis using scenario<\/p><p>analysis.<\/p><\/div><\/details><div class=\"qtext\"><p>What is most likely causing the number of VaR breaches?<\/p><\/div>", "subj": "portfolio"}, {"n": 55, "q": "Analysis 1 is best described as:", "opts": ["Maximum drawdown", "Surplus at risk", "Liquidity gap"], "ans": "B", "expl": "Surplus at risk precisely captures the essence of estimating how much assets will underperform liabilities over one year with 95% confidence, making it the accurate descriptor for Analysis 1. A is incorrect. Maximum drawdown measures the peak-to-trough decline during a specific period, focusing on the most significant loss from a high to a low point. It's about the worst loss rather than the risk of underperformance relative to liabilities, which is the essence of \"Surplus at risk.\" C is incorrect. Liquidity gap refers to the mismatch between assets and liabilities that can impact a firm's ability to meet its short-term obligations. It focuses on cash flow and liquidity issues rather than the comparison of asset performance against liabilities over a specified period with a certain confidence level.", "explhtml": "<p>Surplus at risk precisely captures the essence of estimating how much assets will underperform liabilities over one year with 95% confidence, making it the accurate descriptor for Analysis 1.<\/p><p><b>A is incorrect.<\/b> Maximum drawdown measures the peak-to-trough decline during a specific period, focusing on the most significant loss from a high to a low point. It&#x27;s about the worst loss rather than the risk of underperformance relative to liabilities, which is the essence of &quot;Surplus at risk.&quot;<\/p><p><b>C is incorrect.<\/b> Liquidity gap refers to the mismatch between assets and liabilities that can impact a firm&#x27;s ability to meet its short-term obligations. It focuses on cash flow and liquidity issues rather than the comparison of asset performance against liabilities over a specified period with a certain confidence level.<\/p><p class=\"los\">Portfolio Management, Learning Module 3: Measuring and Managing Market Risk, LOS 3(l) Describe risk measures used by banks, asset managers, pension funds, and insurers.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 53–56 · Constantine Audra<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Constantine Audra, CFA, is a portfolio manager at Westborough Pension Fund. The fund&#x27;s<\/p><p>portfolio comprises fixed-income instruments that are structured in such a way that it will match<\/p><p>the fund&#x27;s liabilities. Audra works closely with Annie Peng, the fund&#x27;s risk analyst, to achieve<\/p><p>this.<\/p><p>During lunch, Audra and Peng discuss the latest risk report. Using the historical method, Peng<\/p><p>calculated the entire portfolio&#x27;s VaR, assuming 250 trading days per year, during a 3-year<\/p><p>lookback period. The VaR Results are presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0067.webp\" style=\"max-width:min(100%,403px)\" alt=\"Exhibit 1: Westborough Portfolio VaR (in £ millions) Daily VaR Monthly VaR Confidence Level 2.20 6.56 95%\"><p>After going through the report, Audra noticed that despite the portfolio accumulating a<\/p><p>substantial loss over the last year, the number of daily VaR breaches is zero. Audra also asks<\/p><p>Peng to carry out the following two risk analyses on Westborough&#x27;s portfolio:<\/p><p>Analysis 1: With 95% confidence, estimate how much Westborough&#x27;s assets will underperform its<\/p><p>liabilities over one year.<\/p><p>Analysis 2: Assess the risk and return of a repeat of the last financial crisis using scenario<\/p><p>analysis.<\/p><\/div><\/details><div class=\"qtext\"><p>Analysis 1 is best described as:<\/p><\/div>", "subj": "portfolio"}, {"n": 56, "q": "A limitation of Analysis 2 is most likely.", "opts": ["Removes asset correlations.", "Presumes historical market events remain unchanged.", "Excludes the actions of portfolio managers."], "ans": "B", "expl": "Analysis 2 assumes that historical market events will repeat precisely in the future, which is a limitation. This approach overlooks the dynamic nature of markets, including changing economic conditions, regulatory environments, and investor behaviors, which can lead to potential inaccuracies in risk and return assessments. It overlooks the possibility that future events could unfold differently due to various evolving factors. A is incorrect. Scenario analysis generally incorporates asset correlations to model the potential outcomes based on historical events. The limitation here is not about asset correlations but rather about assuming that past events perfectly predict future ones. C is incorrect. While excluding the actions of portfolio managers could be a limitation, the primary issue with Analysis 2 is its reliance on past market events to predict future outcomes. Scenario analysis often overlooks the dynamic actions portfolio managers might take to mitigate risks during a crisis.", "explhtml": "<p>Analysis 2 assumes that historical market events will repeat precisely in the future, which is a limitation. This approach overlooks the dynamic nature of markets, including changing economic conditions, regulatory environments, and investor behaviors, which can lead to potential inaccuracies in risk and return assessments. It overlooks the possibility that future events could unfold differently due to various evolving factors.<\/p><p><b>A is incorrect.<\/b> Scenario analysis generally incorporates asset correlations to model the potential outcomes based on historical events. The limitation here is not about asset correlations but rather about assuming that past events perfectly predict future ones.<\/p><p><b>C is incorrect. <\/b>While excluding the actions of portfolio managers could be a limitation, the primary issue with Analysis 2 is its reliance on past market events to predict future outcomes. Scenario analysis often overlooks the dynamic actions portfolio managers might take to mitigate risks during a crisis.<\/p><p class=\"los\">Portfolio Management, Learning Module 3: Measuring and Managing Market Risk, LOS 3(l) Describe risk measures used by banks, asset managers, pension funds, and insurers.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 53–56 · Constantine Audra<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Constantine Audra, CFA, is a portfolio manager at Westborough Pension Fund. The fund&#x27;s<\/p><p>portfolio comprises fixed-income instruments that are structured in such a way that it will match<\/p><p>the fund&#x27;s liabilities. Audra works closely with Annie Peng, the fund&#x27;s risk analyst, to achieve<\/p><p>this.<\/p><p>During lunch, Audra and Peng discuss the latest risk report. Using the historical method, Peng<\/p><p>calculated the entire portfolio&#x27;s VaR, assuming 250 trading days per year, during a 3-year<\/p><p>lookback period. The VaR Results are presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0067.webp\" style=\"max-width:min(100%,403px)\" alt=\"Exhibit 1: Westborough Portfolio VaR (in £ millions) Daily VaR Monthly VaR Confidence Level 2.20 6.56 95%\"><p>After going through the report, Audra noticed that despite the portfolio accumulating a<\/p><p>substantial loss over the last year, the number of daily VaR breaches is zero. Audra also asks<\/p><p>Peng to carry out the following two risk analyses on Westborough&#x27;s portfolio:<\/p><p>Analysis 1: With 95% confidence, estimate how much Westborough&#x27;s assets will underperform its<\/p><p>liabilities over one year.<\/p><p>Analysis 2: Assess the risk and return of a repeat of the last financial crisis using scenario<\/p><p>analysis.<\/p><\/div><\/details><div class=\"qtext\"><p>A limitation of Analysis 2 is most likely.<\/p><\/div>", "subj": "portfolio"}, {"n": 57, "q": "From statement 1, Philips implies that the portfolio:", "opts": ["Value will decline by $ 250,000 or more in 20 trading days.", "IS expected to lose $ 12,500 each trading day.", "It has a 5% chance of falling in value by a maximum of $ 250,000 on a single trading day."], "ans": "A", "expl": "Value at Risk (VaR) represents the minimum expected loss over a specified period, given a certain confidence level. Statement 1 indicates a 5% probability that the portfolio will decrease by $250,000 (2.5% of $10,000,000) or more in a single day. When VaR is calculated daily, and considering a typical month has 20–22 business days, this 5% probability translates to approximately one day per month or once every 20 trading days. B is incorrect. This statement implies a consistent daily loss, not what Value at Risk (VaR) measures. VaR indicates the minimum expected loss over a specified period at a given confidence level, not a daily expected loss. Therefore, this interpretation of VaR is incorrect. C is incorrect. This statement misinterprets the concept of VaR. VaR represents the minimum loss expected with a certain confidence level, not the maximum loss. In this case, a 5% chance of falling in value by $250,000 or more means that on 5% of the days, the loss could be $250,000 or greater, not capped at $250,000. Hence, this option is also incorrect.", "explhtml": "<p>Value at Risk (VaR) represents the minimum expected loss over a specified period, given a certain confidence level. Statement 1 indicates a 5% probability that the portfolio will decrease by $250,000 (2.5% of $10,000,000) or more in a single day. When VaR is calculated daily, and considering a typical month has 20–22 business days, this 5% probability translates to approximately one day per month or once every 20 trading days.<\/p><p><b>B is incorrect.<\/b> This statement implies a consistent daily loss, not what Value at Risk (VaR) measures. VaR indicates the minimum expected loss over a specified period at a given confidence level, not a daily expected loss. Therefore, this interpretation of VaR is incorrect.<\/p><p><b>C is incorrect.<\/b> This statement misinterprets the concept of VaR. VaR represents the minimum loss expected with a certain confidence level, not the maximum loss. In this case, a 5% chance of falling in value by $250,000 or more means that on 5% of the days, the loss could be $250,000 or greater, not capped at $250,000. Hence, this option is also incorrect.<\/p><p class=\"los\">Portfolio Management, Learning Module 3: Measuring and Managing Market Risk, LOS 3(c) Estimate and interpret VaR under the parametric, historical simulation, and Monte Carlo simulation methods.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 57–60 · Tiffany Philips<\/summary><div class=\"vig-body\"><p>Tiffany Philips is the head of risk at Investment and Mergers Limited (IML). Philips meets with<\/p><p>the investment advisers and portfolio management team to discuss tactics for managing and<\/p><p>measuring risk, and client reports present risk metrics. The most popular investment products<\/p><p>offered by IML are the Balanced Fixed Income, Millennial Equity Fund, and Maximillan Equity.<\/p><p>The Millennial Equity Fund comprises two ETFs: One in the pharmaceutical sector and the other<\/p><p>that tracks the S&amp;P 500 index. Philips makes the following statements regarding the risk<\/p><p>management strategies used in the Millennial Equity Fund:<\/p><p>Statement 1: In last year’s annual client performance report, IML indicated that a hypothetical<\/p><p>$10 million Millennial Equity Fund account had a daily 5% VaR of about 2.5% of the portfolio’s<\/p><p>value.<\/p><p>Statement 2: IMA prefers to model value at risk (VaR) by estimating expected returns,<\/p><p>volatilities, and correlations, assuming a normal distribution. The risk management department<\/p><p>recently updated the model that estimated the Millennial Equity Fund’s VaR based on the<\/p><p>information presented in Exhibit 1.<\/p><p><b>Exhibit 1: Millennial Equity Fund- VaR Model Input Assumptions<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0068.webp\" style=\"max-width:min(100%,538px)\" alt=\"Pharmaceutical S&amp;P 500 Total ETF index ETF Portfolio Expected annual return 23.1% 14% 19% Portfolio weight 40% 60% 100% Standard deviation 14.97% 13.17% 14.5% Number of trading days 250 Correlation between ETFs 0.8\"><\/div><\/details><div class=\"qtext\"><p>From statement 1, Philips implies that the portfolio:<\/p><\/div>", "subj": "portfolio"}, {"n": 58, "q": "Based solely on statement 1, the approach of risk measurement:", "opts": ["Provides an accurate risk estimate in both volatile and trending regimes.", "It is the same as the Sharpe ratio since it is backward-looking.", "Overlooks events in the right tail of the return distribution"], "ans": "C", "expl": "Statement 1 reveals that the Equity Opportunities Fund reported a daily VaR value. A key limitation of VaR is its heavy emphasis on left-tail events (losses), often neglecting right-tail events (potential gains). A is incorrect. VaR does not necessarily provide an accurate risk estimate in all market conditions. VaR is limited in its ability to predict risk during extreme market volatility or trending regimes, as it primarily focuses on historical data and may not account for sudden market shifts or trends. B is incorrect. VaR and the Sharpe ratio measure different aspects of risk. While both are backward-looking, the Sharpe ratio evaluates risk-adjusted returns by comparing the portfolio’s excess return to its standard deviation. In contrast, VaR estimates the potential loss in value over a specified period at a given confidence level. They are not the same and serve different purposes in risk measurement.", "explhtml": "<p>Statement 1 reveals that the Equity Opportunities Fund reported a daily VaR value. A key limitation of VaR is its heavy emphasis on left-tail events (losses), often neglecting right-tail events (potential gains).<\/p><p><b>A is incorrect. <\/b>VaR does not necessarily provide an accurate risk estimate in all market conditions. VaR is limited in its ability to predict risk during extreme market volatility or trending regimes, as it primarily focuses on historical data and may not account for sudden market shifts or trends.<\/p><p><b>B is incorrect. <\/b>VaR and the Sharpe ratio measure different aspects of risk. While both are backward-looking, the Sharpe ratio evaluates risk-adjusted returns by comparing the portfolio’s excess return to its standard deviation. In contrast, VaR estimates the potential loss in value over a specified period at a given confidence level. They are not the same and serve different purposes in risk measurement.<\/p><p class=\"los\">Portfolio Management, Learning Module 3: Measuring and Managing Market Risk, LOS 3(c) Estimate and interpret VaR under the parametric, historical simulation, and Monte Carlo simulation methods.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 57–60 · Tiffany Philips<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tiffany Philips is the head of risk at Investment and Mergers Limited (IML). Philips meets with<\/p><p>the investment advisers and portfolio management team to discuss tactics for managing and<\/p><p>measuring risk, and client reports present risk metrics. The most popular investment products<\/p><p>offered by IML are the Balanced Fixed Income, Millennial Equity Fund, and Maximillan Equity.<\/p><p>The Millennial Equity Fund comprises two ETFs: One in the pharmaceutical sector and the other<\/p><p>that tracks the S&amp;P 500 index. Philips makes the following statements regarding the risk<\/p><p>management strategies used in the Millennial Equity Fund:<\/p><p>Statement 1: In last year’s annual client performance report, IML indicated that a hypothetical<\/p><p>$10 million Millennial Equity Fund account had a daily 5% VaR of about 2.5% of the portfolio’s<\/p><p>value.<\/p><p>Statement 2: IMA prefers to model value at risk (VaR) by estimating expected returns,<\/p><p>volatilities, and correlations, assuming a normal distribution. The risk management department<\/p><p>recently updated the model that estimated the Millennial Equity Fund’s VaR based on the<\/p><p>information presented in Exhibit 1.<\/p><p><b>Exhibit 1: Millennial Equity Fund- VaR Model Input Assumptions<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0068.webp\" style=\"max-width:min(100%,538px)\" alt=\"Pharmaceutical S&amp;P 500 Total ETF index ETF Portfolio Expected annual return 23.1% 14% 19% Portfolio weight 40% 60% 100% Standard deviation 14.97% 13.17% 14.5% Number of trading days 250 Correlation between ETFs 0.8\"><\/div><\/details><div class=\"qtext\"><p>Based solely on statement 1, the approach of risk measurement:<\/p><\/div>", "subj": "portfolio"}, {"n": 59, "q": "From statement 2, IML’s VaR estimation approach is closest to:", "opts": ["Monte Carlo simulation.", "Parametric method.", "Historical method."], "ans": "B", "expl": "Value at Risk (VaR) estimates the loss likely to be exceeded with a certain probability over a specified time frame. The parametric method generally assumes that the return distributions of the portfolio’s risk factors follow a normal distribution. It then calculates VaR using the expected return, standard deviation of return for each risk factor, and their correlations. A is incorrect. The Monte Carlo simulation method generates many random scenarios for the risk factors based on their statistical properties. It does not assume a normal return distribution but uses these simulated scenarios to estimate the potential losses. Statement 2 does not describe this process. C is incorrect. This is incorrect because the historical method uses actual historical returns to estimate VaR. It does not assume any specific distribution for the returns but relies on past data to determine the potential losses. Statement 2 does not mention using historical data in this manner.", "explhtml": "<p>Value at Risk (VaR) estimates the loss likely to be exceeded with a certain probability over a specified time frame. The parametric method generally assumes that the return distributions of the portfolio’s risk factors follow a normal distribution. It then calculates VaR using the expected return, standard deviation of return for each risk factor, and their correlations.<\/p><p><b>A is incorrect.<\/b> The Monte Carlo simulation method generates many random scenarios for the risk factors based on their statistical properties. It does not assume a normal return distribution but uses these simulated scenarios to estimate the potential losses. Statement 2 does not describe this process.<\/p><p><b>C is incorrect.<\/b> This is incorrect because the historical method uses actual historical returns to estimate VaR. It does not assume any specific distribution for the returns but relies on past data to determine the potential losses. Statement 2 does not mention using historical data in this manner.<\/p><p class=\"los\">Portfolio Management, Learning Module 3: Measuring and Managing Market Risk, LOS 3(c) Estimate and interpret n approach is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 60, "q": "Using Exhibit 1, the daily 5% VaR estimate is closest to:", "opts": ["1.39%", "2.76%", "3.54%"], "ans": "A", "expl": "From Exhibit 1, the standard deviation is 14.5%, and the expected annual portfolio return is 19%. Annual values need to be adjusted to get their daily counterparts. Assuming 250 trading days in a year, the expected annual return is adjusted by dividing by 250, and the standard deviation is adjusted by dividing by the square root of 250. Thus, the daily expected return is  02.5109 == 0.00076, and the volatility is 0√2.15405 == 0.00917. 5% Daily VaR = E(Rp) −1.60σp = 0.00076 −1.60(0.00917) = −0.0139 = 1.39% B and C are incorrect. The correct answer is 1.39%, as shown in the calculation above.", "explhtml": "<p>From Exhibit 1, the standard deviation is 14.5%, and the expected annual portfolio return is 19%. Annual values need to be adjusted to get their daily counterparts. Assuming 250 trading days in a year, the expected annual return is adjusted by dividing by 250, and the standard deviation is adjusted by dividing by the square root of 250. Thus, the daily expected return is  <sup>0<\/sup><sub>2<\/sub><sup>.<\/sup><sub>5<\/sub><sup>1<\/sup><sub>0<\/sub><sup>9<\/sup> == 0.00076, and the volatility is <sup>0<\/sup><sub>√2<\/sub><sup>.1<\/sup><sub>5<\/sub><sup>4<\/sup><sub>0<\/sub><sup>5<\/sup> == 0.00917.<\/p><p>5% Daily VaR = E(R<sup>p<\/sup>) −1.60σ<sup>p<\/sup> = 0.00076 −1.60(0.00917) = −0.0139 = 1.39%<\/p><p><b>B and C are incorrect.<\/b> The correct answer is 1.39%, as shown in the calculation above.<\/p><p class=\"los\">Portfolio Management, Learning Module 3: Measuring and Managing Market Risk, LOS 3(c) Estimate and interpret VaR under the parametric, historical simulation, and Monte Carlo simulation methods.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 57–60 · Tiffany Philips<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tiffany Philips is the head of risk at Investment and Mergers Limited (IML). Philips meets with<\/p><p>the investment advisers and portfolio management team to discuss tactics for managing and<\/p><p>measuring risk, and client reports present risk metrics. The most popular investment products<\/p><p>offered by IML are the Balanced Fixed Income, Millennial Equity Fund, and Maximillan Equity.<\/p><p>The Millennial Equity Fund comprises two ETFs: One in the pharmaceutical sector and the other<\/p><p>that tracks the S&amp;P 500 index. Philips makes the following statements regarding the risk<\/p><p>management strategies used in the Millennial Equity Fund:<\/p><p>Statement 1: In last year’s annual client performance report, IML indicated that a hypothetical<\/p><p>$10 million Millennial Equity Fund account had a daily 5% VaR of about 2.5% of the portfolio’s<\/p><p>value.<\/p><p>Statement 2: IMA prefers to model value at risk (VaR) by estimating expected returns,<\/p><p>volatilities, and correlations, assuming a normal distribution. The risk management department<\/p><p>recently updated the model that estimated the Millennial Equity Fund’s VaR based on the<\/p><p>information presented in Exhibit 1.<\/p><p><b>Exhibit 1: Millennial Equity Fund- VaR Model Input Assumptions<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0068.webp\" style=\"max-width:min(100%,538px)\" alt=\"Pharmaceutical S&amp;P 500 Total ETF index ETF Portfolio Expected annual return 23.1% 14% 19% Portfolio weight 40% 60% 100% Standard deviation 14.97% 13.17% 14.5% Number of trading days 250 Correlation between ETFs 0.8\"><\/div><\/details><div class=\"qtext\"><p>Using Exhibit 1, the daily 5% VaR estimate is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 61, "q": "Which of Ross's statements regarding backtesting is correct?", "opts": ["Only Statement 1", "Both Statements 1 and 2", "Only Statement 2"], "ans": "C", "expl": "Backtesting involves using historical data to simulate how an investment strategy would have performed in the past. This process helps in understanding the risk-return tradeoff of the proposed strategy by providing a real-world scenario analysis using historical performance data. A is incorrect. Statement 1 is not entirely accurate. While it is true that quantitative investment managers predominantly use backtesting to validate their models, it is seldom used by fundamental investment managers. Fundamental managers may also employ backtesting to verify certain aspects of their investment strategies, such as the historical performance of companies with similar fundamental characteristics. B is incorrect. Statement 2 is correct, but Statement 1 is not. Hence, neither statement can be correct simultaneously.", "explhtml": "<p>Backtesting involves using historical data to simulate how an investment strategy would have performed in the past. This process helps in understanding the risk-return tradeoff of the proposed strategy by providing a real-world scenario analysis using historical performance data.<\/p><p><b>A is incorrect.<\/b> Statement 1 is not entirely accurate. While it is true that quantitative investment managers predominantly use backtesting to validate their models, it is seldom used by fundamental investment managers. Fundamental managers may also employ backtesting to verify certain aspects of their investment strategies, such as the historical performance of companies with similar fundamental characteristics.<\/p><p><b>B is incorrect.<\/b> Statement 2 is correct, but Statement 1 is not. Hence, neither statement can be correct simultaneously.<\/p><p class=\"los\">Portfolio Management, Learning Module 4: Backtesting and Simulation, LOS 4(b): Describe and contrast steps and procedures in backtesting an investment strategy.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 61–64 · Kate Ross<\/summary><div class=\"vig-body\"><p>Kate Ross is an equity analyst working for Goldberg Wealth Managers (GWM). Ross meets with<\/p><p>Van Niekerk, a wealth client based in South Africa, to explain their investment strategies for<\/p><p>generating portfolio alpha.<\/p><p>Ross mentions that GWM has a track record in factor-based value portfolios and how they use<\/p><p>backtesting. Ross makes the following statements.<\/p><p>Statement 1: Backtesting is predominantly employed by quantitative investment managers and is<\/p><p>seldom used by fundamental investment managers, who focus more on forward estimates of<\/p><p>company earnings, macroeconomic factors, and intrinsic values.<\/p><p>Statement 2: By utilizing historical data, backtesting simulates a real-world investment process<\/p><p>to demonstrate the risk-return tradeoff of a specific proposed investment strategy.<\/p><p>As a 65-year-old, Niekerk allocates £ 6 million (12% of his net worth) to an account with GWM<\/p><p>and requests Ross to restrict portfolio assets to domestic securities. Despite its track record,<\/p><p>GWM has only backtested its strategies using an international index that comprises domestic<\/p><p>securities. Ross creates a three-factor portfolio and presents it to Niekerk. Niekerk inquires of<\/p><p>Ross, &quot;What if future events don&#x27;t align with past occurrences?&quot;<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0069.webp\" style=\"max-width:min(100%,436px)\" alt=\"Exhibit 1: Downside Risk Measures for Model Factors Risk Measure Factor 1 Factor 2 Factor 3 Maximum drawdown 46.89% 33.21% 37.87% Conditional VaR (95%) 4.2% 16% 6.5% VaR (95%) 2.8% 5.5% 1.1%\"><\/div><\/details><div class=\"qtext\"><p>Which of Ross&#x27;s statements regarding backtesting is correct?<\/p><\/div>", "subj": "portfolio"}, {"n": 62, "q": "To include Niekerk's restrictions, what are the most likely to change for the new backtest?", "opts": ["Duration", "Transaction costs", "Investment universe"], "ans": "C", "expl": "The investment universe encompasses the securities in which a strategy can potentially invest. Niekerk's restriction to exclusively own domestic securities means the investment universe for a backtest on Niekerk's account should be confined to a domestic, rather than a global, investment universe. A is incorrect. The duration of the backtest is not impacted by Niekerk's restriction to only domestic securities. Duration would relate to the period over which the backtest is conducted, which isn't affected by the geographical scope of the securities in the investment universe. B is incorrect. The restriction to domestic securities does not directly change transaction costs. Transaction costs are determined by trading volume, liquidity, and broker fees rather than the domestic or global nature of the traded securities.", "explhtml": "<p>The investment universe encompasses the securities in which a strategy can potentially invest. Niekerk&#x27;s restriction to exclusively own domestic securities means the investment universe for a backtest on Niekerk&#x27;s account should be confined to a domestic, rather than a global, investment universe.<\/p><p><b>A is incorrect.<\/b> The duration of the backtest is not impacted by Niekerk&#x27;s restriction to only domestic securities. Duration would relate to the period over which the backtest is conducted, which isn&#x27;t affected by the geographical scope of the securities in the investment universe.<\/p><p><b>B is incorrect.<\/b> The restriction to domestic securities does not directly change transaction costs. Transaction costs are determined by trading volume, liquidity, and broker fees rather than the domestic or global nature of the traded securities.<\/p><p class=\"los\">Portfolio Management, Learning Module 4: Backtesting and Simulation, LOS 4(b): Describe and contrast steps and procedures in backtesting an investment strategy.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 61–64 · Kate Ross<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Kate Ross is an equity analyst working for Goldberg Wealth Managers (GWM). Ross meets with<\/p><p>Van Niekerk, a wealth client based in South Africa, to explain their investment strategies for<\/p><p>generating portfolio alpha.<\/p><p>Ross mentions that GWM has a track record in factor-based value portfolios and how they use<\/p><p>backtesting. Ross makes the following statements.<\/p><p>Statement 1: Backtesting is predominantly employed by quantitative investment managers and is<\/p><p>seldom used by fundamental investment managers, who focus more on forward estimates of<\/p><p>company earnings, macroeconomic factors, and intrinsic values.<\/p><p>Statement 2: By utilizing historical data, backtesting simulates a real-world investment process<\/p><p>to demonstrate the risk-return tradeoff of a specific proposed investment strategy.<\/p><p>As a 65-year-old, Niekerk allocates £ 6 million (12% of his net worth) to an account with GWM<\/p><p>and requests Ross to restrict portfolio assets to domestic securities. Despite its track record,<\/p><p>GWM has only backtested its strategies using an international index that comprises domestic<\/p><p>securities. Ross creates a three-factor portfolio and presents it to Niekerk. Niekerk inquires of<\/p><p>Ross, &quot;What if future events don&#x27;t align with past occurrences?&quot;<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0069.webp\" style=\"max-width:min(100%,436px)\" alt=\"Exhibit 1: Downside Risk Measures for Model Factors Risk Measure Factor 1 Factor 2 Factor 3 Maximum drawdown 46.89% 33.21% 37.87% Conditional VaR (95%) 4.2% 16% 6.5% VaR (95%) 2.8% 5.5% 1.1%\"><\/div><\/details><div class=\"qtext\"><p>To include Niekerk&#x27;s restrictions, what are the most likely to change for the new backtest?<\/p><\/div>", "subj": "portfolio"}, {"n": 63, "q": "Niekerk's concern embedded in the question, \"What if future events don't align with past occurrences?\" is a drawback closely related to which investment strategy appraisal method?", "opts": ["Scenario analysis", "Backtesting", "Sensitivity analysis"], "ans": "B", "expl": "Niekerk's concern about future events not aligning with past occurrences directly relates to a key limitation of backtesting. Backtesting involves using historical data to simulate how an investment strategy would have performed in the past. While useful, it assumes that historical market conditions will repeat in the future, which may not always be the case. This makes backtesting less reliable if future market conditions differ significantly from past ones. A is incorrect. Scenario analysis evaluates how an investment strategy performs under various hypothetical future scenarios, including potential changes in market conditions. Scenario analysis inherently accounts for the possibility that future events might not align with past occurrences, making it less vulnerable to Niekerk's concern. C is incorrect. Sensitivity analysis examines how changes in specific variables impact the outcomes of an investment strategy. Sensitivity analysis is focused on assessing the impact of different assumptions and does not necessarily rely on past data patterns. It is designed to understand the potential range of outcomes based on varying inputs, which addresses Niekerk's concern more directly than backtesting.", "explhtml": "<p>Niekerk&#x27;s concern about future events not aligning with past occurrences directly relates to a key limitation of backtesting. Backtesting involves using historical data to simulate how an investment strategy would have performed in the past. While useful, it assumes that historical market conditions will repeat in the future, which may not always be the case. This makes backtesting less reliable if future market conditions differ significantly from past ones.<\/p><p><b>A is incorrect.<\/b> Scenario analysis evaluates how an investment strategy performs under various hypothetical future scenarios, including potential changes in market conditions. Scenario analysis inherently accounts for the possibility that future events might not align with past occurrences, making it less vulnerable to Niekerk&#x27;s concern.<\/p><p><b>C is incorrect.<\/b> Sensitivity analysis examines how changes in specific variables impact the outcomes of an investment strategy. Sensitivity analysis is focused on assessing the impact of different assumptions and does not necessarily rely on past data patterns. It is designed to understand the potential range of outcomes based on varying inputs, which addresses Niekerk&#x27;s concern more directly than backtesting.<\/p><p class=\"los\">Portfolio Management, Learning Module 4: Backtesting and Simulation, LOS 4(g): explain inputs and decisions in simulation and interpret a simulation.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 61–64 · Kate Ross<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Kate Ross is an equity analyst working for Goldberg Wealth Managers (GWM). Ross meets with<\/p><p>Van Niekerk, a wealth client based in South Africa, to explain their investment strategies for<\/p><p>generating portfolio alpha.<\/p><p>Ross mentions that GWM has a track record in factor-based value portfolios and how they use<\/p><p>backtesting. Ross makes the following statements.<\/p><p>Statement 1: Backtesting is predominantly employed by quantitative investment managers and is<\/p><p>seldom used by fundamental investment managers, who focus more on forward estimates of<\/p><p>company earnings, macroeconomic factors, and intrinsic values.<\/p><p>Statement 2: By utilizing historical data, backtesting simulates a real-world investment process<\/p><p>to demonstrate the risk-return tradeoff of a specific proposed investment strategy.<\/p><p>As a 65-year-old, Niekerk allocates £ 6 million (12%
