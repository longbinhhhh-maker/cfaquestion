f, suggest an increase in the expected level of inflation  (θ<sub>t,s<\/sub>).<\/p><p><b>C is incorrect.<\/b> The inflation risk premium (π<sub>t,s<\/sub>) is a specific component of the break-even rate. A change in inflation uncertainty directly affects this premium and, therefore, the break-even rate.<\/p><p class=\"los\">Portfolio Management, Learning Module 1: Economics and Investment Markets, LOS 1 (e): Describe the factors that affect yield spreads between non-inflation-adjusted and inflation-indexed bonds.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 77–80 · Jessica Eseberre<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jessica Eseberre, CFA, a Portfolio Analyst at Selman Investment Partners, a UK-based private<\/p><p>equity fund, is preparing for a quarterly strategy meeting. The fund is considering a significant<\/p><p>investment in infrastructure projects, whose long-term returns are often linked to inflation. A key<\/p><p>part of the discussion will focus on interpreting current market signals about future inflation, as<\/p><p>these will directly affect the discount rates and return assumptions for the potential investment.<\/p><p>In the meeting, the Chief Investment Officer (CIO) presents data on UK government bonds. The<\/p><p>yield on a 10-year nominal gilt is 4.5%. The yield on a 10-year index-linked gilt is 1.2%. The team<\/p><p>calculates the break-even inflation (BEI) rate as 3.3%. The CIO emphasizes that this BEI rate is a<\/p><p>market-based measure but is not a pure reflection of inflation expectations. He notes that the<\/p><p>Bank of England’s inflation target is 2.0%, and recent economic data shows inflation is currently<\/p><p>running at 3.0%. He explains that the BEI also includes a risk premium that investors demand<\/p><p>for the uncertainty surrounding future inflation.<\/p><p>After the meeting, Eseberre discusses the topic with Alex Gamble, an intern. Gamble is trying to<\/p><p>solidify his understanding and makes the following statements. Statement 1: “The break-even<\/p><p>inflation rate of 3.3% is the market&#x27;s exact forecast for average inflation over the next decade. If<\/p><p>inflation averages 3.5%, investors in index-linked gilts will have underperformed.”<\/p><p>Statement 2: “If investors were to become more uncertain about the future path of inflation,<\/p><p>perhaps due to fiscal policy changes, we would expect the break-even inflation rate to widen,<\/p><p>even if the median inflation expectation remained unchanged.”<\/p><p>Statement 3: “A significant improvement in the UK’s trend rate of real economic growth would<\/p><p>likely lead to a decrease in the yield on index-linked gilts, causing the break-even inflation rate to<\/p><p>rise.”<\/p><p>Later that day, Eseberre refines her investment memo. She notes that the current high BEI rate<\/p><p>relative to the BoE’s target suggests the market is pricing in either persistently high inflation<\/p><p>expectations, a significant inflation risk premium, or both. This analysis will be critical for the<\/p><p>fund’s final investment committee decision on the infrastructure deal, as it affects the real return<\/p><p>they can expect to capture.<\/p><\/div><\/details><div class=\"qtext\"><p>Suppose the Bank of England credibly commits to a new policy framework that is universally expected to reduce the long-run volatility of inflation. All else equal, the yield spread between nominal and index-linked gilts would most likely:<\/p><\/div>", "subj": "portfolio"}, {"n": 80, "q": "In her investment memo, Eseberre is considering the consumption-hedging properties of different assets for the fund’s portfolio. Which of the following assets would most likely have the lowest expected return, assuming the UK government issues all of them?", "opts": ["A 3-month treasury bill", "A 10-year nominal government bond", "A 10-year index-linked government bond"], "ans": "A", "expl": "Investors value assets that pay off more in bad economic times when the marginal utility of consumption is high. Short-term, default-free instruments like T-bills are a good hedge against poor consumption outcomes because their nominal payoffs are certain over a short horizon. This high demand and low correlation with bad times drive down their expected return relative to riskier assets. Longer-dated bonds, both nominal and index-linked, carry more risk (e.g., inflation uncertainty for nominal bonds, real rate uncertainty for index-linked bonds) and are less perfect hedges, so investors demand a higher expected return. B is incorrect. A 10-year nominal bond carries inflation uncertainty risk and typically a positive term premium, leading to a higher expected return than a T-bill. C is incorrect. A 10-year index-linked bond, while protected from inflation, is still exposed to uncertainty about the real default-free rate relative to the expected return of a risk-free T-bill.", "explhtml": "<p>Investors value assets that pay off more in bad economic times when the marginal utility of consumption is high. Short-term, default-free instruments like T-bills are a good hedge against poor consumption outcomes because their nominal payoffs are certain over a short horizon. This high demand and low correlation with bad times drive down their expected return relative to riskier assets. Longer-dated bonds, both nominal and index-linked, carry more risk (e.g., inflation uncertainty for nominal bonds, real rate uncertainty for index-linked bonds) and are less perfect hedges, so investors demand a higher expected return.<\/p><p><b>B is incorrect.<\/b> A 10-year nominal bond carries inflation uncertainty risk and typically a positive term premium, leading to a higher expected return than a T-bill.<\/p><p><b>C is incorrect.<\/b> A 10-year index-linked bond, while protected from inflation, is still exposed to uncertainty about the real default-free rate relative to the expected return of a risk-free T-bill.<\/p><p class=\"los\">Portfolio Management, Learning Module 1: Economics and Investment Markets, LOS (h): Explain the relationship between the consumption hedging properties of equity and the equity risk premium.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 77–80 · Jessica Eseberre<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jessica Eseberre, CFA, a Portfolio Analyst at Selman Investment Partners, a UK-based private<\/p><p>equity fund, is preparing for a quarterly strategy meeting. The fund is considering a significant<\/p><p>investment in infrastructure projects, whose long-term returns are often linked to inflation. A key<\/p><p>part of the discussion will focus on interpreting current market signals about future inflation, as<\/p><p>these will directly affect the discount rates and return assumptions for the potential investment.<\/p><p>In the meeting, the Chief Investment Officer (CIO) presents data on UK government bonds. The<\/p><p>yield on a 10-year nominal gilt is 4.5%. The yield on a 10-year index-linked gilt is 1.2%. The team<\/p><p>calculates the break-even inflation (BEI) rate as 3.3%. The CIO emphasizes that this BEI rate is a<\/p><p>market-based measure but is not a pure reflection of inflation expectations. He notes that the<\/p><p>Bank of England’s inflation target is 2.0%, and recent economic data shows inflation is currently<\/p><p>running at 3.0%. He explains that the BEI also includes a risk premium that investors demand<\/p><p>for the uncertainty surrounding future inflation.<\/p><p>After the meeting, Eseberre discusses the topic with Alex Gamble, an intern. Gamble is trying to<\/p><p>solidify his understanding and makes the following statements. Statement 1: “The break-even<\/p><p>inflation rate of 3.3% is the market&#x27;s exact forecast for average inflation over the next decade. If<\/p><p>inflation averages 3.5%, investors in index-linked gilts will have underperformed.”<\/p><p>Statement 2: “If investors were to become more uncertain about the future path of inflation,<\/p><p>perhaps due to fiscal policy changes, we would expect the break-even inflation rate to widen,<\/p><p>even if the median inflation expectation remained unchanged.”<\/p><p>Statement 3: “A significant improvement in the UK’s trend rate of real economic growth would<\/p><p>likely lead to a decrease in the yield on index-linked gilts, causing the break-even inflation rate to<\/p><p>rise.”<\/p><p>Later that day, Eseberre refines her investment memo. She notes that the current high BEI rate<\/p><p>relative to the BoE’s target suggests the market is pricing in either persistently high inflation<\/p><p>expectations, a significant inflation risk premium, or both. This analysis will be critical for the<\/p><p>fund’s final investment committee decision on the infrastructure deal, as it affects the real return<\/p><p>they can expect to capture.<\/p><\/div><\/details><div class=\"qtext\"><p>In her investment memo, Eseberre is considering the consumption-hedging properties of different assets for the fund’s portfolio. Which of the following assets would most likely have the lowest expected return, assuming the UK government issues all of them?<\/p><\/div>", "subj": "portfolio"}, {"n": 81, "q": "Based on the 2023 data and Exhibit 1, which of the following best describes the active return of the CL Global Alpha Fund for 2023?", "opts": ["0.91%", "1.09%", "1.47%"], "ans": "B", "expl": "The active return is calculated as the portfolio return minus the benchmark return. RA = Rp − RB. We start by first calculating the portfolio return (Rp) and the benchmark return (RB) using the respective weights and the regional returns provided. Rp = 0.60 × 12.5% + 0.25 × 18.2% + 0.03 × 2.1% + 0.12 × 9.0% = 13.193% RB = 0.65 × 12.5% + 0.15 × 18.2% + 0.08 × 2.1% + 0.12 × 9.0% = 12.103% RA = 13.193% −12.103% = 1.09% A is incorrect. 0.91% is too low and would result from a significant underestimation, such as incorrectly calculating only a portion of the active contributions. C is incorrect. 1.47% is too high and likely reflects an overestimation, potentially due to incorrectly omitting the negative contribution from the underweight in Japan.", "explhtml": "<p>The active return is calculated as the portfolio return minus the benchmark return. R<sub>A<\/sub> = R<sub>p<\/sub> − R<sub>B<\/sub>. We start by first calculating the portfolio return (R<sub>p<\/sub>) and the benchmark return (R<sub>B<\/sub>) using the respective weights and the regional returns provided.<\/p><p>R<sup>p<\/sup> = 0.60 × 12.5% + 0.25 × 18.2% + 0.03 × 2.1% + 0.12 × 9.0% = 13.193% R<sup>B<\/sup> = 0.65 × 12.5% + 0.15 × 18.2% + 0.08 × 2.1% + 0.12 × 9.0% = 12.103% R<sup>A<\/sup> = 13.193% −12.103% = 1.09%<\/p><p><b>A is incorrect.<\/b> 0.91% is too low and would result from a significant underestimation, such as incorrectly calculating only a portion of the active contributions.<\/p><p><b>C is incorrect.<\/b> 1.47% is too high and likely reflects an overestimation, potentially due to incorrectly omitting the negative contribution from the underweight in Japan.<\/p><p class=\"los\">Portfolio Management, Learning Module 2: Analysis of Active Portfolio Management, LOS 2 (a): Describe how value added by active management is measured.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 81–84 · Abraham Lamb<\/summary><div class=\"vig-body\"><p>Abraham Lamb, CFA, is a senior portfolio manager at Caesar Limited (CL), a US-based hedge<\/p><p>fund specializing in global equities. In 2023, Lamb managed the “CL Global Alpha Fund,” which<\/p><p>uses the MSCI World Index as its primary benchmark. At the beginning of the year, Lamb and his<\/p><p>team formulated explicit return forecasts for major regional equity markets. Based on a belief<\/p><p>that European equities would outperform and Japanese equities would underperform, Lamb<\/p><p>strategically adjusted the fund’s regional allocations away from the benchmark weights.<\/p><p>The fund does not engage in individual security selection; all value added is intended to come<\/p><p>from these regional allocation decisions. The benchmark weights, CL fund weights, and the<\/p><p>actual realized returns for 2023 for key regions are summarized below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0073.webp\" style=\"max-width:min(100%,508px)\" alt=\"Exhibit 1: 2023 Benchmark Weights and Actual Realized Returns Region Benchmark CL Fund  2023 Total Weight (WB) Weight (wp) Return (R) United States 65.0% 60.0% 12.5% Europe ex UK 15.0% 25.0% 18.2% Japan 8.0% 3.0% 2.1% Other 12.0% 12.0% 9.0%\"><p>Lamb is now preparing his year-end performance report for the fund’s investors. He calculates<\/p><p>that the total return for the MSCI World Index (his benchmark) for 2023 was 11.04%.<\/p><p>Concurrently, the average annualized yield on 3-month US Treasury bills for the year was 4.50%.<\/p><p>Over a more extended, five-year period (2019-2023), the CL Global Alpha Fund has shown<\/p><p>consistent active management results.<\/p><p>The annualized standard deviation of the fund’s return (total risk) over this period was 16.8%.<\/p><p>The annualized standard deviation of the fund’s active return was 4.2%. The fund’s average<\/p><p>annualized active return over this period was 1.68%. For the MSCI World Index benchmark, the<\/p><p>annualized standard deviation (total risk) over the same five-year period was 16.0%. The Sharpe<\/p><p>ratio over the same period was 0.50.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the 2023 data and Exhibit 1, which of the following best describes the active return of the CL Global Alpha Fund for 2023?<\/p><\/div>", "subj": "portfolio"}, {"n": 82, "q": "Based on the five-year performance statistics provided in the vignette, the ex post information ratio for the CL Global Alpha Fund is closest to:", "opts": ["0.10", "0.40", "0.70"], "ans": "B", "expl": "The information ratio (IR) is calculated as the average annualized active return divided by the annualized active risk. A is incorrect. This would result from incorrectly using total risk as the denominator. C is incorrect. This would result from an arithmetic error.", "explhtml": "<p>The information ratio (IR) is calculated as the average annualized active return divided by the annualized active risk.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0074.webp\" style=\"max-width:min(100%,151px)\" alt=\"1.68% IR = = 0.40 4.2%\"><p><b>A is incorrect.<\/b> This would result from incorrectly using total risk as the denominator.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0075.webp\" style=\"max-width:min(100%,151px)\" alt=\"1.68% IR = = 0.10 16.8%\"><p><b>C is incorrect.<\/b> This would result from an arithmetic error.<\/p><p class=\"los\">Portfolio Management, Learning Module 2: Analysis of Active Portfolio Management, LOS 2 (b): Calculate and interpret the information ratio (ex post and ex ante) and contrast it to the Sharpe ratio.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 81–84 · Abraham Lamb<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Abraham Lamb, CFA, is a senior portfolio manager at Caesar Limited (CL), a US-based hedge<\/p><p>fund specializing in global equities. In 2023, Lamb managed the “CL Global Alpha Fund,” which<\/p><p>uses the MSCI World Index as its primary benchmark. At the beginning of the year, Lamb and his<\/p><p>team formulated explicit return forecasts for major regional equity markets. Based on a belief<\/p><p>that European equities would outperform and Japanese equities would underperform, Lamb<\/p><p>strategically adjusted the fund’s regional allocations away from the benchmark weights.<\/p><p>The fund does not engage in individual security selection; all value added is intended to come<\/p><p>from these regional allocation decisions. The benchmark weights, CL fund weights, and the<\/p><p>actual realized returns for 2023 for key regions are summarized below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0073.webp\" style=\"max-width:min(100%,508px)\" alt=\"Exhibit 1: 2023 Benchmark Weights and Actual Realized Returns Region Benchmark CL Fund  2023 Total Weight (WB) Weight (wp) Return (R) United States 65.0% 60.0% 12.5% Europe ex UK 15.0% 25.0% 18.2% Japan 8.0% 3.0% 2.1% Other 12.0% 12.0% 9.0%\"><p>Lamb is now preparing his year-end performance report for the fund’s investors. He calculates<\/p><p>that the total return for the MSCI World Index (his benchmark) for 2023 was 11.04%.<\/p><p>Concurrently, the average annualized yield on 3-month US Treasury bills for the year was 4.50%.<\/p><p>Over a more extended, five-year period (2019-2023), the CL Global Alpha Fund has shown<\/p><p>consistent active management results.<\/p><p>The annualized standard deviation of the fund’s return (total risk) over this period was 16.8%.<\/p><p>The annualized standard deviation of the fund’s active return was 4.2%. The fund’s average<\/p><p>annualized active return over this period was 1.68%. For the MSCI World Index benchmark, the<\/p><p>annualized standard deviation (total risk) over the same five-year period was 16.0%. The Sharpe<\/p><p>ratio over the same period was 0.50.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the five-year performance statistics provided in the vignette, the ex post information ratio for the CL Global Alpha Fund is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 83, "q": "Based on the five-year statistics and under the assumption that the benchmark portfolio’s annualized Sharpe ratio over the same period was 0.50, which of the following statements is most likely correct regarding the potential for optimal combined portfolio construction?", "opts": ["Combining the fund with the benchmark in an optimal mix could potentially achieve a Sharpe ratio of approximately 0.64.", "The fund’s information ratio is too low to improve upon the benchmark’s Sharpe ratio.", "To maximize the combined portfolio Sharpe ratio, the active risk of the investment in the fund should be scaled to approximately 3.0%."], "ans": "A", "expl": "From the fundamental law of active management, the maximum possible Sharpe ratio (SR) of an optimally combined portfolio is given by This represents a potential improvement from the benchmark’s Sharpe ratio of 0.5. This improvement relies on two key conditions: the information ratio (IR) must be positive, and the active risk of the investment must be scaled to its optimal level, not merely held at its historical level. B is incorrect. A positive information ratio (0.40) can continually improve the benchmark’s Sharpe ratio. C is incorrect. The optimal active risk depends on the benchmark’s risk and the IR/SRb ratio, not an arbitrary 3.0%.", "explhtml": "<p>From the fundamental law of active management, the maximum possible Sharpe ratio (SR) of an optimally combined portfolio is given by<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0076.webp\" style=\"max-width:min(100%,325px)\" alt=\"SR2P = SR2B + IR2 SR2 P = 0.502 + 0.402 = 0.25 + 0.16 = 0.41 SRp = √0.41 = 0.64\"><p>This represents a potential improvement from the benchmark’s Sharpe ratio of 0.5. This improvement relies on two key conditions: the information ratio (IR) must be positive, and the active risk of the investment must be scaled to its optimal level, not merely held at its historical level.<\/p><p><b>B is incorrect.<\/b> A positive information ratio (0.40) can continually improve the benchmark’s Sharpe ratio.<\/p><p><b>C is incorrect.<\/b> The optimal active risk depends on the benchmark’s risk and the IR/SRb ratio, not an arbitrary 3.0%.<\/p><p class=\"los\">Portfolio Management, Learning Module 2: Analysis of Active Portfolio Management, LOS 2 (b): Calculate and interpret the information ratio (ex post and ex ante) and contrast it to the Sharpe ratio.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 81–84 · Abraham Lamb<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Abraham Lamb, CFA, is a senior portfolio manager at Caesar Limited (CL), a US-based hedge<\/p><p>fund specializing in global equities. In 2023, Lamb managed the “CL Global Alpha Fund,” which<\/p><p>uses the MSCI World Index as its primary benchmark. At the beginning of the year, Lamb and his<\/p><p>team formulated explicit return forecasts for major regional equity markets. Based on a belief<\/p><p>that European equities would outperform and Japanese equities would underperform, Lamb<\/p><p>strategically adjusted the fund’s regional allocations away from the benchmark weights.<\/p><p>The fund does not engage in individual security selection; all value added is intended to come<\/p><p>from these regional allocation decisions. The benchmark weights, CL fund weights, and the<\/p><p>actual realized returns for 2023 for key regions are summarized below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0073.webp\" style=\"max-width:min(100%,508px)\" alt=\"Exhibit 1: 2023 Benchmark Weights and Actual Realized Returns Region Benchmark CL Fund  2023 Total Weight (WB) Weight (wp) Return (R) United States 65.0% 60.0% 12.5% Europe ex UK 15.0% 25.0% 18.2% Japan 8.0% 3.0% 2.1% Other 12.0% 12.0% 9.0%\"><p>Lamb is now preparing his year-end performance report for the fund’s investors. He calculates<\/p><p>that the total return for the MSCI World Index (his benchmark) for 2023 was 11.04%.<\/p><p>Concurrently, the average annualized yield on 3-month US Treasury bills for the year was 4.50%.<\/p><p>Over a more extended, five-year period (2019-2023), the CL Global Alpha Fund has shown<\/p><p>consistent active management results.<\/p><p>The annualized standard deviation of the fund’s return (total risk) over this period was 16.8%.<\/p><p>The annualized standard deviation of the fund’s active return was 4.2%. The fund’s average<\/p><p>annualized active return over this period was 1.68%. For the MSCI World Index benchmark, the<\/p><p>annualized standard deviation (total risk) over the same five-year period was 16.0%. The Sharpe<\/p><p>ratio over the same period was 0.50.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the five-year statistics and under the assumption that the benchmark portfolio’s annualized Sharpe ratio over the same period was 0.50, which of the following statements is most likely correct regarding the potential for optimal combined portfolio construction?<\/p><\/div>", "subj": "portfolio"}, {"n": 84, "q": "Using the five-year statistics and the fundamental law of active management, the optimal level of active risk for the CL Global Alpha Fund to maximize the Sharpe ratio of a combined portfolio is closest to:", "opts": ["4.2%", "12.8%", "16.0%"], "ans": "B", "expl": "First, we calculate the information ratio: The optimal level of active risk is given by: A is incorrect. 4.2% is the fund’s current active risk, not the optimal level derived from the fundamental law. C is incorrect. 16.0% is the benchmark’s total risk, which is not the optimal active risk.", "explhtml": "<p>First, we calculate the information ratio:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0077.webp\" style=\"max-width:min(100%,151px)\" alt=\"1.68% IR = = 0.40 4.2%\"><p>The optimal level of active risk is given by:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0078.webp\" style=\"max-width:min(100%,286px)\" alt=\"σ ∗ A = SRB IR × σB σ ∗ A = 0.40 0.50 × 16.0% = 0.128 = 12.8%\"><p><b>A is incorrect.<\/b> 4.2% is the fund’s current active risk, not the optimal level derived from the fundamental law.<\/p><p><b>C is incorrect.<\/b> 16.0% is the benchmark’s total risk, which is not the optimal active risk.<\/p><p class=\"los\">Portfolio Management, Learning Module 2: Analysis of Active Portfolio Management, LOS 2 (b): Calculate and interpret the information ratio (ex post and ex ante) and contrast it to the Sharpe ratio.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 81–84 · Abraham Lamb<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Abraham Lamb, CFA, is a senior portfolio manager at Caesar Limited (CL), a US-based hedge<\/p><p>fund specializing in global equities. In 2023, Lamb managed the “CL Global Alpha Fund,” which<\/p><p>uses the MSCI World Index as its primary benchmark. At the beginning of the year, Lamb and his<\/p><p>team formulated explicit return forecasts for major regional equity markets. Based on a belief<\/p><p>that European equities would outperform and Japanese equities would underperform, Lamb<\/p><p>strategically adjusted the fund’s regional allocations away from the benchmark weights.<\/p><p>The fund does not engage in individual security selection; all value added is intended to come<\/p><p>from these regional allocation decisions. The benchmark weights, CL fund weights, and the<\/p><p>actual realized returns for 2023 for key regions are summarized below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0073.webp\" style=\"max-width:min(100%,508px)\" alt=\"Exhibit 1: 2023 Benchmark Weights and Actual Realized Returns Region Benchmark CL Fund  2023 Total Weight (WB) Weight (wp) Return (R) United States 65.0% 60.0% 12.5% Europe ex UK 15.0% 25.0% 18.2% Japan 8.0% 3.0% 2.1% Other 12.0% 12.0% 9.0%\"><p>Lamb is now preparing his year-end performance report for the fund’s investors. He calculates<\/p><p>that the total return for the MSCI World Index (his benchmark) for 2023 was 11.04%.<\/p><p>Concurrently, the average annualized yield on 3-month US Treasury bills for the year was 4.50%.<\/p><p>Over a more extended, five-year period (2019-2023), the CL Global Alpha Fund has shown<\/p><p>consistent active management results.<\/p><p>The annualized standard deviation of the fund’s return (total risk) over this period was 16.8%.<\/p><p>The annualized standard deviation of the fund’s active return was 4.2%. The fund’s average<\/p><p>annualized active return over this period was 1.68%. For the MSCI World Index benchmark, the<\/p><p>annualized standard deviation (total risk) over the same five-year period was 16.0%. The Sharpe<\/p><p>ratio over the same period was 0.50.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the five-year statistics and the fundamental law of active management, the optimal level of active risk for the CL Global Alpha Fund to maximize the Sharpe ratio of a combined portfolio is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 85, "q": "Based on the fundamental law of active management and the data from Ramesh’s current market timing strategy, the expected ex-ante information ratio for the strategy is closest to:", "opts": ["0.40", "0.32", "1.28"], "ans": "B", "expl": "The fundamental law states that the expected information ratio is approximated by  IR ≈IC × √BR × TC This result indicates that for every unit of active risk taken, the strategy is expected to generate 0.32 units of active return. A is incorrect. This value results from omitting the transfer coefficient in the calculation  IR ≈ 0.10 × √16 = 0.40. This mistake ignores the real-world impact of portfolio constraints (like leverage limits at EL), which reduce the strategy's efficiency and thus its expected IR. C is incorrect. This would result from incorrectly using, The law uses the square root of breadth because the benefits of independent decisions diversify away risk at a rate proportional to the square root of the number of decisions, not linearly.", "explhtml": "<p>The fundamental law states that the expected information ratio is approximated by  IR ≈IC × √BR × TC<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0080.webp\" style=\"max-width:min(100%,239px)\" alt=\"IR ≈0.10 × √16 × 0.80 = 0.32\"><p>This result indicates that for every unit of active risk taken, the strategy is expected to generate 0.32 units of active return.<\/p><p><b>A is incorrect.<\/b> This value results from omitting the transfer coefficient in the calculation  IR ≈ 0.10 × √16 = 0.40. This mistake ignores the real-world impact of portfolio constraints (like leverage limits at EL), which reduce the strategy&#x27;s efficiency and thus its expected IR.<\/p><p><b>C is incorrect.<\/b> This would result from incorrectly using,<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0081.webp\" style=\"max-width:min(100%,211px)\" alt=\"IR ≈IC × BR × TC IR ≈0.1 × 16 × 0.8 = 1.28\"><p>The law uses the square root of breadth because the benefits of independent decisions diversify away risk at a rate proportional to the square root of the number of decisions, not linearly.<\/p><p class=\"los\">Portfolio Management, Learning Module 2: Analysis of Active Portfolio Management, LOS 2(c): Describe and interpret the fundamental law of active portfolio management, including its component terms—transfer coefficient, information coefficient, breadth, and active risk (aggressiveness)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 23 · Câu 85–88 · George Ramesh<\/summary><div class=\"vig-body\"><p>George Ramesh, CFA, is a senior portfolio manager at Endres Limited (EL), an Australian hedge<\/p><p>fund specializing in global macro and equity strategies. Ramesh currently manages the “EL<\/p><p>Global Tactical Fund,” which employs a top-down market-timing strategy across four major<\/p><p>equity regions: Australia, Japan, Europe, and North America. The fund uses the MSCI World<\/p><p>Index as its primary benchmark. For the current year, Ramesh formulated return forecasts for<\/p><p>each region. Based on his analysis, he implemented a set of active weights to reflect his<\/p><p>convictions. The relevant data for the year is summarized in Exhibit 1.<\/p><p>Exhibit 1: Benchmark Weight &amp; Active Weight Data Across Four Major Regions<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0079.webp\" style=\"max-width:min(100%,571px)\" alt=\"Region Benchmark Active Realized Ramesh’s Forecasted Weight Weight Return Return Australia 2.0% +3.0% 15.0% 12.0% Japan 8.0% −4.0% 5.0% 7.0% Europe 15.0% −5.0% 10.0% 9.0% North America 75.0% +6.0% 8.0% 8.5%\"><p>Ramesh is reviewing the performance of his market timing strategy over the past five years.<\/p><p>Backtesting indicates that his annual forecasts have an information coefficient of 0.10. His<\/p><p>strategy makes four independent regional allocation decisions each quarter, giving it a breadth<\/p><p>of 16 decisions per year. Due to internal risk constraints and leverage limits at EL, the transfer<\/p><p>coefficient is estimated at 0.80. The fund is currently targeted and has maintained an active risk<\/p><p>of 4.0%. For the MSCI World Index benchmark, the annualized Sharpe ratio over the same period<\/p><p>was 0.30, and its annualized standard deviation was 12.0%.<\/p><p>The fund’s senior partners are encouraging Ramesh to consider shifting resources from his top-<\/p><p>down market-timing strategy to a bottom-up security-selection strategy in the Australian equity<\/p><p>market. Preliminary research on this proposed strategy suggests it could achieve an information<\/p><p>coefficient of 0.05 on individual stock forecasts. The Australian equity team could analyze and<\/p><p>take active positions in approximately 80 stocks per year.<\/p><p>However, due to stricter compliance and liquidity constraints for individual securities, the<\/p><p>transfer coefficient for this security selection strategy is expected to be lower, at 0.60. The team<\/p><p>proposes running this strategy at an active risk level of 3.0%. While the fundamental law provides a structured framework for evaluating these strategies, Ramesh is mindful of its<\/p><p>practical limitations. He notes that the law assumes forecast independence across decisions,<\/p><p>which may not hold if common global macroeconomic factors influence his regional views.<\/p><p>Furthermore, both the IC and TC are difficult to estimate accurately in advance and are unlikely<\/p><p>to remain constant over time, especially during different market regimes. The assumption of a<\/p><p>known, constant breadth is also a simplification, as the number of truly independent investment<\/p><p>opportunities can vary.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the fundamental law of active management and the data from Ramesh’s current market timing strategy, the expected ex-ante information ratio for the strategy is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 86, "q": "According to the fundamental law of active management, the optimal level of active risk for Ramesh’s market timing strategy is closest to:", "opts": ["3.8%", "12.0%", "12.8%"], "ans": "C", "expl": "First, we calculate the information ratio, The optimal level of active risk is given by, This means that to maximize the combined portfolio's risk-adjusted return, Ramesh should scale his strategy to an active risk level of 12.8%, not its current level of 4.0%. A is incorrect. This would result from mistakenly calculating. IR × σB = 0.32 × 12% = 3.84%, which is the expected active return. B is incorrect. This is the benchmark standard deviation. Choosing this would imply the optimal active risk equals the benchmark's total risk, which is not supported by the fundamental law unless the Information Ratio equals the benchmark's Sharpe Ratio.", "explhtml": "<p>First, we calculate the information ratio,<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0082.webp\" style=\"max-width:min(100%,239px)\" alt=\"IR ≈0.10 × √16 × 0.80 = 0.32\"><p>The optimal level of active risk is given by,<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0083.webp\" style=\"max-width:min(100%,208px)\" alt=\"IR σ ∗ A = SRB × σB σ ∗ A = 0.32 0.30 × 12% = 12.8%\"><p>This means that to maximize the combined portfolio&#x27;s risk-adjusted return, Ramesh should scale his strategy to an active risk level of 12.8%, not its current level of 4.0%.<\/p><p><b>A is incorrect.<\/b> This would result from mistakenly calculating. IR × σ<sub>B<\/sub> = 0.32 × 12% = 3.84%, which is the expected active return.<\/p><p><b>B is incorrect.<\/b> This is the benchmark standard deviation. Choosing this would imply the optimal active risk equals the benchmark&#x27;s total risk, which is not supported by the fundamental law unless the Information Ratio equals the benchmark&#x27;s Sharpe Ratio.<\/p><p class=\"los\">Portfolio Management, Learning Module 2: Analysis of Active Portfolio Management, LOS 2(d): Explain how the information ratio may be useful in investment manager selection and choosing the level of active portfolio risk.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 23 · Câu 85–88 · George Ramesh<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>George Ramesh, CFA, is a senior portfolio manager at Endres Limited (EL), an Australian hedge<\/p><p>fund specializing in global macro and equity strategies. Ramesh currently manages the “EL<\/p><p>Global Tactical Fund,” which employs a top-down market-timing strategy across four major<\/p><p>equity regions: Australia, Japan, Europe, and North America. The fund uses the MSCI World<\/p><p>Index as its primary benchmark. For the current year, Ramesh formulated return forecasts for<\/p><p>each region. Based on his analysis, he implemented a set of active weights to reflect his<\/p><p>convictions. The relevant data for the year is summarized in Exhibit 1.<\/p><p>Exhibit 1: Benchmark Weight &amp; Active Weight Data Across Four Major Regions<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0079.webp\" style=\"max-width:min(100%,571px)\" alt=\"Region Benchmark Active Realized Ramesh’s Forecasted Weight Weight Return Return Australia 2.0% +3.0% 15.0% 12.0% Japan 8.0% −4.0% 5.0% 7.0% Europe 15.0% −5.0% 10.0% 9.0% North America 75.0% +6.0% 8.0% 8.5%\"><p>Ramesh is reviewing the performance of his market timing strategy over the past five years.<\/p><p>Backtesting indicates that his annual forecasts have an information coefficient of 0.10. His<\/p><p>strategy makes four independent regional allocation decisions each quarter, giving it a breadth<\/p><p>of 16 decisions per year. Due to internal risk constraints and leverage limits at EL, the transfer<\/p><p>coefficient is estimated at 0.80. The fund is currently targeted and has maintained an active risk<\/p><p>of 4.0%. For the MSCI World Index benchmark, the annualized Sharpe ratio over the same period<\/p><p>was 0.30, and its annualized standard deviation was 12.0%.<\/p><p>The fund’s senior partners are encouraging Ramesh to consider shifting resources from his top-<\/p><p>down market-timing strategy to a bottom-up security-selection strategy in the Australian equity<\/p><p>market. Preliminary research on this proposed strategy suggests it could achieve an information<\/p><p>coefficient of 0.05 on individual stock forecasts. The Australian equity team could analyze and<\/p><p>take active positions in approximately 80 stocks per year.<\/p><p>However, due to stricter compliance and liquidity constraints for individual securities, the<\/p><p>transfer coefficient for this security selection strategy is expected to be lower, at 0.60. The team<\/p><p>proposes running this strategy at an active risk level of 3.0%. While the fundamental law provides a structured framework for evaluating these strategies, Ramesh is mindful of its<\/p><p>practical limitations. He notes that the law assumes forecast independence across decisions,<\/p><p>which may not hold if common global macroeconomic factors influence his regional views.<\/p><p>Furthermore, both the IC and TC are difficult to estimate accurately in advance and are unlikely<\/p><p>to remain constant over time, especially during different market regimes. The assumption of a<\/p><p>known, constant breadth is also a simplification, as the number of truly independent investment<\/p><p>opportunities can vary.<\/p><\/div><\/details><div class=\"qtext\"><p>According to the fundamental law of active management, the optimal level of active risk for Ramesh’s market timing strategy is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 87, "q": "When comparing the proposed security selection strategy to the current market timing strategy in terms of the fundamental law of active management, the proposed strategy’s expected information ratio is most likely:", "opts": ["Lower, primarily due to a lower transfer coefficient and information coefficient.", "Higher, primarily due to a significant increase in breadth.", "Roughly equivalent, as the product of IC,&sqrt;BR, and TC is similar for both strategies."], "ans": "A", "expl": "We start by calculating the IR for both strategies. Current strategy Proposed strategy The proposed strategy's IR(0.27) is lower than the current strategy's IR(0.32). This is primarily because its information coefficient (0.05 vs. 0.10) and transfer coefficient (0.60 vs. 0.80) are both lower. Although the proposed strategy has much greater breadth, it is insufficient to offset the reductions in IC and TC fully. B and C are incorrect. The proposed IR strategy is actually lower, not higher or the same, despite the increase in breadth.", "explhtml": "<p>We start by calculating the IR for both strategies.<\/p><p>Current strategy<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0084.webp\" style=\"max-width:min(100%,239px)\" alt=\"IR ≈0.10 × √16 × 0.80 = 0.32\"><p>Proposed strategy<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0085.webp\" style=\"max-width:min(100%,240px)\" alt=\"IR ≈0.05 × √80 × 0.60 = 0.27\"><p>The proposed strategy&#x27;s IR(0.27) is lower than the current strategy&#x27;s IR(0.32). This is primarily because its information coefficient (0.05 vs. 0.10) and transfer coefficient (0.60 vs. 0.80) are both lower. Although the proposed strategy has much greater breadth, it is insufficient to offset the reductions in IC and TC fully.<\/p><p><b>B and C are incorrect.<\/b> The proposed IR strategy is actually lower, not higher or the same, despite the increase in breadth.<\/p><p class=\"los\">Portfolio Management, Learning Module 2: Analysis of Active Portfolio Management, LOS 2(e): Compare active management strategies, including market timing and security selection, and evaluate strategy changes in terms of the fundamental law of active management.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 23 · Câu 85–88 · George Ramesh<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>George Ramesh, CFA, is a senior portfolio manager at Endres Limited (EL), an Australian hedge<\/p><p>fund specializing in global macro and equity strategies. Ramesh currently manages the “EL<\/p><p>Global Tactical Fund,” which employs a top-down market-timing strategy across four major<\/p><p>equity regions: Australia, Japan, Europe, and North America. The fund uses the MSCI World<\/p><p>Index as its primary benchmark. For the current year, Ramesh formulated return forecasts for<\/p><p>each region. Based on his analysis, he implemented a set of active weights to reflect his<\/p><p>convictions. The relevant data for the year is summarized in Exhibit 1.<\/p><p>Exhibit 1: Benchmark Weight &amp; Active Weight Data Across Four Major Regions<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0079.webp\" style=\"max-width:min(100%,571px)\" alt=\"Region Benchmark Active Realized Ramesh’s Forecasted Weight Weight Return Return Australia 2.0% +3.0% 15.0% 12.0% Japan 8.0% −4.0% 5.0% 7.0% Europe 15.0% −5.0% 10.0% 9.0% North America 75.0% +6.0% 8.0% 8.5%\"><p>Ramesh is reviewing the performance of his market timing strategy over the past five years.<\/p><p>Backtesting indicates that his annual forecasts have an information coefficient of 0.10. His<\/p><p>strategy makes four independent regional allocation decisions each quarter, giving it a breadth<\/p><p>of 16 decisions per year. Due to internal risk constraints and leverage limits at EL, the transfer<\/p><p>coefficient is estimated at 0.80. The fund is currently targeted and has maintained an active risk<\/p><p>of 4.0%. For the MSCI World Index benchmark, the annualized Sharpe ratio over the same period<\/p><p>was 0.30, and its annualized standard deviation was 12.0%.<\/p><p>The fund’s senior partners are encouraging Ramesh to consider shifting resources from his top-<\/p><p>down market-timing strategy to a bottom-up security-selection strategy in the Australian equity<\/p><p>market. Preliminary research on this proposed strategy suggests it could achieve an information<\/p><p>coefficient of 0.05 on individual stock forecasts. The Australian equity team could analyze and<\/p><p>take active positions in approximately 80 stocks per year.<\/p><p>However, due to stricter compliance and liquidity constraints for individual securities, the<\/p><p>transfer coefficient for this security selection strategy is expected to be lower, at 0.60. The team<\/p><p>proposes running this strategy at an active risk level of 3.0%. While the fundamental law provides a structured framework for evaluating these strategies, Ramesh is mindful of its<\/p><p>practical limitations. He notes that the law assumes forecast independence across decisions,<\/p><p>which may not hold if common global macroeconomic factors influence his regional views.<\/p><p>Furthermore, both the IC and TC are difficult to estimate accurately in advance and are unlikely<\/p><p>to remain constant over time, especially during different market regimes. The assumption of a<\/p><p>known, constant breadth is also a simplification, as the number of truly independent investment<\/p><p>opportunities can vary.<\/p><\/div><\/details><div class=\"qtext\"><p>When comparing the proposed security selection strategy to the current market timing strategy in terms of the fundamental law of active management, the proposed strategy’s expected information ratio is most likely:<\/p><\/div>", "subj": "portfolio"}, {"n": 88, "q": "Which of the following practical limitations of the fundamental law of active management is most accurately illustrated by Ramesh’s consideration of the two strategies?", "opts": ["The assumption that breadth is known and the varying number of independent opportunities in different strategies challenge the constant.", "The law fails to account for transaction costs, which are typically higher for security selection than for market timing.", "The transfer coefficient is difficult to estimate and may be unstable, especially when changing strategy types."], "ans": "A", "expl": "From the vignette, Ramesh provides two precise breadth figures for the strategies: 16 decisions per year for the market-timing strategy and 80 decisions per year for the security-selection strategy. We are then told, “ The assumption of a known, constant breadth is also a simplification, as the number of truly independent investment opportunities can vary.” This statement is a critique of the fundamental law’s assumption. Ramesh’s work illustrates this limitation because his analysis depends on plugging these specific breadth numbers into the law  IR ≈IC × √BR × TC , yet the vignette cautions that quantifying “truly independent” opportunities is complex, and the figure may not be stable. B is incorrect. This is a valid real-world limitation, but it is not mentioned or alluded to anywhere in the case study. The comparison of strategies in the text is based solely on IC, BR, and TC. C is incorrect. While the case does mention that \"the IC and TC are difficult to estimate accurately in advance,\" this point is made as a general observation about the law's inputs. The illustration comparing the two strategies centers on the differing, quantifiable BR values (16 vs. 80) and subsequent commentary on breadth, not on an analysis of TC instability between the strategies.", "explhtml": "<p>From the vignette, Ramesh provides two precise breadth figures for the strategies: 16 decisions per year for the market-timing strategy and 80 decisions per year for the security-selection strategy. We are then told, “ The assumption of a known, constant breadth is also a simplification, as the number of truly independent investment opportunities can vary.” This statement is a critique of the fundamental law’s assumption. Ramesh’s work illustrates this limitation because his analysis depends on plugging these specific breadth numbers into the law  IR ≈IC × √BR × TC<\/p><p>, yet the vignette cautions that quantifying “truly independent” opportunities is complex, and the figure may not be stable.<\/p><p><b>B is incorrect.<\/b> This is a valid real-world limitation, but it is not mentioned or alluded to anywhere in the case study. The comparison of strategies in the text is based solely on IC, BR, and TC.<\/p><p><b>C is incorrect.<\/b> While the case does mention that &quot;the IC and TC are difficult to estimate accurately in advance,&quot; this point is made as a general observation about the law&#x27;s inputs. The illustration comparing the two strategies centers on the differing, quantifiable BR values (16 vs. 80) and subsequent commentary on breadth, not on an analysis of TC instability between the strategies.<\/p><p class=\"los\">Portfolio Management, Learning Module 2: Analysis of Active Portfolio Management, LOS 2(f): Describe the practical strengths and limitations of the fundamental law of active management.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 23 · Câu 85–88 · George Ramesh<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>George Ramesh, CFA, is a senior portfolio manager at Endres Limited (EL), an Australian hedge<\/p><p>fund specializing in global macro and equity strategies. Ramesh currently manages the “EL<\/p><p>Global Tactical Fund,” which employs a top-down market-timing strategy across four major<\/p><p>equity regions: Australia, Japan, Europe, and North America. The fund uses the MSCI World<\/p><p>Index as its primary benchmark. For the current year, Ramesh formulated return forecasts for<\/p><p>each region. Based on his analysis, he implemented a set of active weights to reflect his<\/p><p>convictions. The relevant data for the year is summarized in Exhibit 1.<\/p><p>Exhibit 1: Benchmark Weight &amp; Active Weight Data Across Four Major Regions<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0079.webp\" style=\"max-width:min(100%,571px)\" alt=\"Region Benchmark Active Realized Ramesh’s Forecasted Weight Weight Return Return Australia 2.0% +3.0% 15.0% 12.0% Japan 8.0% −4.0% 5.0% 7.0% Europe 15.0% −5.0% 10.0% 9.0% North America 75.0% +6.0% 8.0% 8.5%\"><p>Ramesh is reviewing the performance of his market timing strategy over the past five years.<\/p><p>Backtesting indicates that his annual forecasts have an information coefficient of 0.10. His<\/p><p>strategy makes four independent regional allocation decisions each quarter, giving it a breadth<\/p><p>of 16 decisions per year. Due to internal risk constraints and leverage limits at EL, the transfer<\/p><p>coefficient is estimated at 0.80. The fund is currently targeted and has maintained an active risk<\/p><p>of 4.0%. For the MSCI World Index benchmark, the annualized Sharpe ratio over the same period<\/p><p>was 0.30, and its annualized standard deviation was 12.0%.<\/p><p>The fund’s senior partners are encouraging Ramesh to consider shifting resources from his top-<\/p><p>down market-timing strategy to a bottom-up security-selection strategy in the Australian equity<\/p><p>market. Preliminary research on this proposed strategy suggests it could achieve an information<\/p><p>coefficient of 0.05 on individual stock forecasts. The Australian equity team could analyze and<\/p><p>take active positions in approximately 80 stocks per year.<\/p><p>However, due to stricter compliance and liquidity constraints for individual securities, the<\/p><p>transfer coefficient for this security selection strategy is expected to be lower, at 0.60. The team<\/p><p>proposes running this strategy at an active risk level of 3.0%. While the fundamental law provides a structured framework for evaluating these strategies, Ramesh is mindful of its<\/p><p>practical limitations. He notes that the law assumes forecast independence across decisions,<\/p><p>which may not hold if common global macroeconomic factors influence his regional views.<\/p><p>Furthermore, both the IC and TC are difficult to estimate accurately in advance and are unlikely<\/p><p>to remain constant over time, especially during different market regimes. The assumption of a<\/p><p>known, constant breadth is also a simplification, as the number of truly independent investment<\/p><p>opportunities can vary.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following practical limitations of the fundamental law of active management is most accurately illustrated by Ramesh’s consideration of the two strategies?<\/p><\/div>", "subj": "portfolio"}, {"n": 89, "q": "Based on Moore’s explanation of the creation process, if an Authorized Participant (AP) wants to create 100,000 shares of a Canadian ETF with a current NAV per share of $50, which of the following actions is the AP most likely to take?", "opts": ["Deliver $ 5 million in cash to the ETF issuer.", "Deliver a basket of underlying stocks valued at approximately $ 5 million to the ETF issuer.", "Buy 100,000 shares on the open market and deliver them to the ETF issuer."], "ans": "B", "expl": "APs create new ETF shares by assembling and delivering a specified portfolio of securities known as a creation basket. To the ETF issuer. The value of this basket equals the NAV of the shares to be created, This in-kind transfer is central to the ETF structure, as it minimizes transaction costs for the fund, enhances tax efficiency by avoiding capital gains realization, and facilitates the arbitrage mechanism that keeps the market price in line with the NAV. A is incorrect. While cash creation is possible (especially in fixed income or international ETFs), the primary and most efficient mechanism for domestic equity ETFs is in-kind. Cash creation would force the fund to incur trading costs and potential market impact. C is incorrect. This confuses primary and secondary market activity. The creation process involves the primary market transaction between the AP and the ETF issuer. Delivering already-issued ETF shares back to the issuer would be a redemption, not a creation, and would not increase the share count.", "explhtml": "<p>APs create new ETF shares by assembling and delivering a specified portfolio of securities known as a creation basket. To the ETF issuer. The value of this basket equals the NAV of the shares to be created,<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0086.webp\" style=\"max-width:min(100%,296px)\" alt=\"100,000 shares × $50 = $5, 000, 000.\"><p>This in-kind transfer is central to the ETF structure, as it minimizes transaction costs for the fund, enhances tax efficiency by avoiding capital gains realization, and facilitates the arbitrage mechanism that keeps the market price in line with the NAV.<\/p><p><b>A is incorrect.<\/b> While cash creation is possible (especially in fixed income or international ETFs), the primary and most efficient mechanism for domestic equity ETFs is in-kind. Cash creation would force the fund to incur trading costs and potential market impact.<\/p><p><b>C is incorrect.<\/b> This confuses primary and secondary market activity. The creation process involves the primary market transaction between the AP and the ETF issuer. Delivering already-issued ETF shares back to the issuer would be a redemption, not a creation, and would not increase the share count.<\/p><p class=\"los\">Portfolio Management, Learning Module 3: Exchange-Traded Funds: Mechanics and Applications, LOS 3(a): Explain the creation/redemption process of ETFs and the function of authorized participants<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 24 · Câu 89–92 · Dalia Moore<\/summary><div class=\"vig-body\"><p>Dalia Moore, CFA, is the Chief Financial Officer at McGill &amp; Solomon Partners, a Toronto-based<\/p><p>hedge fund. The fund is finalizing a new multi-asset strategy that will rely heavily on Exchange-<\/p><p>Traded Funds (ETFs) for efficient implementation. In a portfolio review meeting, Dalia explains<\/p><p>the core mechanics to her team. She details the creation/redemption process, emphasizing the<\/p><p>role of Authorized Participant (APs). “APS are pivotal,” she notes. “They are the only entities that<\/p><p>can interact directly with the ETF issuer to create new shares by delivering a basket of specified<\/p><p>securities, or redeem shares by returning that basket. This in-kind transfer mechanism is what<\/p><p>keeps the ETF&#x27;s market price aligned with its NAV and provides the fund with its tax efficiency.”<\/p><p>She instructs her trading desk that when establishing large positions, they should be mindful of<\/p><p>contacting Aps to create new shares to avoid excessive market impact, potentially. Later, while<\/p><p>reviewing execution costs for the strategy, Moore and a junior analyst, Liam Chan, discuss<\/p><p>trading ETFs in the secondary market. Moore states, “Remember, our orders interact with the<\/p><p>consolidated tape on an exchange just like stocks. Liquidity is derived from both the volume of<\/p><p>ETF shares traded and the underlying liquidity of the portfolio securities, as Aps can create or<\/p><p>redeem to facilitate large trades.”<\/p><p>Chan is tasked with analyzing potential tracking error for the chosen ETFs. He made three<\/p><p>statements:<\/p><p>Statement 1: “A key source of tracking error is the ETF’s total expense ratio, which created a<\/p><p>persistent drag versus the index.”<\/p><p>Statement 2: “Sampling or optimization strategies used by the ETF manager to replicate an<\/p><p>index can lead to divergence.”<\/p><p>Statement 3: “The bid-ask spread of the underlying securities is a primary factor, but the timing<\/p><p>difference between the fund&#x27;s portfolio valuation (using closing prices) and the real-time<\/p><p>calculation of the ETF&#x27;s NAV is not a material source of tracking error for domestic, transparent<\/p><p>equity ETFs.”<\/p><p>Finally, in the risk committee meeting, Moore outlines the factors that will affect the ETF bid-ask<\/p><p>spreads the fund will encounter. “The spread we pay isn’t arbitrary,” she explains. “It’s primarily a function of the AP’s cost to hedge their creation basket activity. This includes the bid-ask<\/p><p>spreads of the underlying securities, any brokerage commissions, and carrying costs. For a<\/p><p>domestic equity ETF with highly liquid constituents, we should expect tight spreads, often just a<\/p><p>penny or two.”<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Moore’s explanation of the creation process, if an Authorized Participant (AP) wants to create 100,000 shares of a Canadian ETF with a current NAV per share of $50, which of the following actions is the AP most likely to take?<\/p><\/div>", "subj": "portfolio"}, {"n": 90, "q": "Referring to the data in the table, which of the following best explains why the bond ETF's secondary market liquidity assessment might differ from its daily trading volume?", "opts": ["It is derived from the liquidity of the underlying securities and the arbitrage mechanism involving Aps.", "It is determined primarily by the trading volume of the ETF shares on the exchange, as shown by the lower volume for the bond ETF.", "The ETF's market makers set it based on the fund's total net assets, which are lower for the bond ETF, resulting in higher spreads."], "ans": "A", "expl": "An ETF possesses a two-tiered liquidity structure. The first tier is the ETFs' on-exchange trading volume. The second, and often more significant, tier is the implicit liquidity provided by the underlying basket of securities through the creation/redemption mechanism. Because Aps can arbitrage price discrepancies by creating or redeeming shares directly with the issuer, the effective liquidity available to a large trader can be much greater than its secondary market trading volume suggests. B is incorrect. This is a frequent misconception. While on-exchange volume is a visible metric, it does not represent the full depth of liquidity. An ETF with low daily volume can still be highly liquid if its underlying assets are liquid and the arbitrage mechanism is functioning efficiently. C is incorrect. The ETF issuer does not control or set secondary market bid-ask spreads or liquidity. Competitive market makers and APs determine these based on the costs and risks of providing liquidity, primarily driven by the factors in the correct answer.", "explhtml": "<p>An ETF possesses a two-tiered liquidity structure. The first tier is the ETFs&#x27; on-exchange trading volume. The second, and often more significant, tier is the implicit liquidity provided by the underlying basket of securities through the creation/redemption mechanism. Because Aps can arbitrage price discrepancies by creating or redeeming shares directly with the issuer, the effective liquidity available to a large trader can be much greater than its secondary market trading volume suggests.<\/p><p><b>B is incorrect.<\/b> This is a frequent misconception. While on-exchange volume is a visible metric, it does not represent the full depth of liquidity. An ETF with low daily volume can still be highly liquid if its underlying assets are liquid and the arbitrage mechanism is functioning efficiently.<\/p><p><b>C is incorrect.<\/b> The ETF issuer does not control or set secondary market bid-ask spreads or liquidity. Competitive market makers and APs determine these based on the costs and risks of providing liquidity, primarily driven by the factors in the correct answer.<\/p><p class=\"los\">Portfolio Management, Learning Module 3: Exchange-Traded Funds: Mechanics and Applications, LOS 3(b): Describe how ETFs are traded in secondary markets<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 24 · Câu 89–92 · Dalia Moore<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dalia Moore, CFA, is the Chief Financial Officer at McGill &amp; Solomon Partners, a Toronto-based<\/p><p>hedge fund. The fund is finalizing a new multi-asset strategy that will rely heavily on Exchange-<\/p><p>Traded Funds (ETFs) for efficient implementation. In a portfolio review meeting, Dalia explains<\/p><p>the core mechanics to her team. She details the creation/redemption process, emphasizing the<\/p><p>role of Authorized Participant (APs). “APS are pivotal,” she notes. “They are the only entities that<\/p><p>can interact directly with the ETF issuer to create new shares by delivering a basket of specified<\/p><p>securities, or redeem shares by returning that basket. This in-kind transfer mechanism is what<\/p><p>keeps the ETF&#x27;s market price aligned with its NAV and provides the fund with its tax efficiency.”<\/p><p>She instructs her trading desk that when establishing large positions, they should be mindful of<\/p><p>contacting Aps to create new shares to avoid excessive market impact, potentially. Later, while<\/p><p>reviewing execution costs for the strategy, Moore and a junior analyst, Liam Chan, discuss<\/p><p>trading ETFs in the secondary market. Moore states, “Remember, our orders interact with the<\/p><p>consolidated tape on an exchange just like stocks. Liquidity is derived from both the volume of<\/p><p>ETF shares traded and the underlying liquidity of the portfolio securities, as Aps can create or<\/p><p>redeem to facilitate large trades.”<\/p><p>Chan is tasked with analyzing potential tracking error for the chosen ETFs. He made three<\/p><p>statements:<\/p><p>Statement 1: “A key source of tracking error is the ETF’s total expense ratio, which created a<\/p><p>persistent drag versus the index.”<\/p><p>Statement 2: “Sampling or optimization strategies used by the ETF manager to replicate an<\/p><p>index can lead to divergence.”<\/p><p>Statement 3: “The bid-ask spread of the underlying securities is a primary factor, but the timing<\/p><p>difference between the fund&#x27;s portfolio valuation (using closing prices) and the real-time<\/p><p>calculation of the ETF&#x27;s NAV is not a material source of tracking error for domestic, transparent<\/p><p>equity ETFs.”<\/p><p>Finally, in the risk committee meeting, Moore outlines the factors that will affect the ETF bid-ask<\/p><p>spreads the fund will encounter. “The spread we pay isn’t arbitrary,” she explains. “It’s primarily a function of the AP’s cost to hedge their creation basket activity. This includes the bid-ask<\/p><p>spreads of the underlying securities, any brokerage commissions, and carrying costs. For a<\/p><p>domestic equity ETF with highly liquid constituents, we should expect tight spreads, often just a<\/p><p>penny or two.”<\/p><\/div><\/details><div class=\"qtext\"><p>Referring to the data in the table, which of the following best explains why the bond ETF&#x27;s secondary market liquidity assessment might differ from its daily trading volume?<\/p><\/div>", "subj": "portfolio"}, {"n": 91, "q": "Which of Liam’s statements regarding sources of ETF tracking is least likely correct?", "opts": ["Statement 1.", "Statement 2.", "Statement 3."], "ans": "C", "expl": "The timing of portfolio valuation is a recognized source of tracking error. An ETF’s official NAV is typically calculated once per day using closing prices of its holdings. However, the ETF trades at a market price throughout the day. This mismatch, coupled with the fact that the underlying index may be calculated in real time or at the close, can create intraday premiums or discounts and contribute to tracking differences over time. For international ETFs in which the underlying markets are closed while the ETF trades, this timing difference is a major contributor to tracking error. A is incorrect. This statement is correct. The management fee and other expenses are deducted from the fund’s assets, creating a guaranteed, ongoing performance lag relative to the gross-of-fee index return. B is incorrect. This statement is correct. Many ETFs, particularly those tracking broad or illiquid benchmarks, use representative sampling or optimization techniques rather than full replication. This introduces representation error or modeling risk, as the performance of the selected sample may differ from that of the full index.", "explhtml": "<p>The timing of portfolio valuation is a recognized source of tracking error. An ETF’s official NAV is typically calculated once per day using closing prices of its holdings. However, the ETF trades at a market price throughout the day. This mismatch, coupled with the fact that the underlying index may be calculated in real time or at the close, can create intraday premiums or discounts and contribute to tracking differences over time. For international ETFs in which the underlying markets are closed while the ETF trades, this timing difference is a major contributor to tracking error.<\/p><p><b>A is incorrect.<\/b> This statement is correct. The management fee and other expenses are deducted from the fund’s assets, creating a guaranteed, ongoing performance lag relative to the gross-of-fee index return.<\/p><p><b>B is incorrect.<\/b> This statement is correct. Many ETFs, particularly those tracking broad or illiquid benchmarks, use representative sampling or optimization techniques rather than full replication. This introduces representation error or modeling risk, as the performance of the selected sample may differ from that of the full index.<\/p><p class=\"los\">Portfolio Management, Learning Module 3: Exchange-Traded Funds: Mechanics and Applications, LOS 3(c): Describe sources of tracking error for ETFs.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 24 · Câu 89–92 · Dalia Moore<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dalia Moore, CFA, is the Chief Financial Officer at McGill &amp; Solomon Partners, a Toronto-based<\/p><p>hedge fund. The fund is finalizing a new multi-asset strategy that will rely heavily on Exchange-<\/p><p>Traded Funds (ETFs) for efficient implementation. In a portfolio review meeting, Dalia explains<\/p><p>the core mechanics to her team. She details the creation/redemption process, emphasizing the<\/p><p>role of Authorized Participant (APs). “APS are pivotal,” she notes. “They are the only entities that<\/p><p>can interact directly with the ETF issuer to create new shares by delivering a basket of specified<\/p><p>securities, or redeem shares by returning that basket. This in-kind transfer mechanism is what<\/p><p>keeps the ETF&#x27;s market price aligned with its NAV and provides the fund with its tax efficiency.”<\/p><p>She instructs her trading desk that when establishing large positions, they should be mindful of<\/p><p>contacting Aps to create new shares to avoid excessive market impact, potentially. Later, while<\/p><p>reviewing execution costs for the strategy, Moore and a junior analyst, Liam Chan, discuss<\/p><p>trading ETFs in the secondary market. Moore states, “Remember, our orders interact with the<\/p><p>consolidated tape on an exchange just like stocks. Liquidity is derived from both the volume of<\/p><p>ETF shares traded and the underlying liquidity of the portfolio securities, as Aps can create or<\/p><p>redeem to facilitate large trades.”<\/p><p>Chan is tasked with analyzing potential tracking error for the chosen ETFs. He made three<\/p><p>statements:<\/p><p>Statement 1: “A key source of tracking error is the ETF’s total expense ratio, which created a<\/p><p>persistent drag versus the index.”<\/p><p>Statement 2: “Sampling or optimization strategies used by the ETF manager to replicate an<\/p><p>index can lead to divergence.”<\/p><p>Statement 3: “The bid-ask spread of the underlying securities is a primary factor, but the timing<\/p><p>difference between the fund&#x27;s portfolio valuation (using closing prices) and the real-time<\/p><p>calculation of the ETF&#x27;s NAV is not a material source of tracking error for domestic, transparent<\/p><p>equity ETFs.”<\/p><p>Finally, in the risk committee meeting, Moore outlines the factors that will affect the ETF bid-ask<\/p><p>spreads the fund will encounter. “The spread we pay isn’t arbitrary,” she explains. “It’s primarily a function of the AP’s cost to hedge their creation basket activity. This includes the bid-ask<\/p><p>spreads of the underlying securities, any brokerage commissions, and carrying costs. For a<\/p><p>domestic equity ETF with highly liquid constituents, we should expect tight spreads, often just a<\/p><p>penny or two.”<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Liam’s statements regarding sources of ETF tracking is least likely correct?<\/p><\/div>", "subj": "portfolio"}, {"n": 92, "q": "Referring to the table data and Moore's explanation, which of the following factors would most likely be the primary reason for the wider bid-ask spread of the bond ETF compared to the equity ETF?", "opts": ["The lower daily trading volume of the bond ETF shares.", "The higher carrying costs and dealer market spreads in the underlying bond market.", "The higher total net assets of the equity ETF allow for greater economies of scale."], "ans": "B", "expl": "Moore's explanation establishes that ETF bid-ask spreads primarily compensate APs for the costs of hedging creation/redemption activity. The table data shows the bond ETF has both a wider ETF spread ($0.15 vs. $0.01) and a wider average underlying security spread ($0.12 vs. $0.008). Bond markets are primarily dealer markets with several characteristics that increase AP hedging costs: 1. Wider dealer spreads due to lower transparency and higher inventory risk 2. Higher carrying costs related to financing bond inventory (interest rate risk, repo costs) 3. Lower trading frequency requires APs to hold positions longer, increasing risk exposure These factors directly translate into wider ETF bid-ask spreads, as APs build these costs into their quotes. The equity ETFs' underlying securities trade on highly liquid exchanges with narrow spreads and minimal carrying costs, enabling tighter ETF spreads. A is incorrect. While the bond ETF does have lower daily trading volume (250,000 vs. 1.2 million shares), this is a secondary effect or symptom rather than the primary driver. Trading volume correlates with spreads but doesn't causally determine them in the ETF context. The low volume itself results from the same underlying market illiquidity that causes wide spreads. More importantly, ETF liquidity derives not just from secondary-market trading but also from the creation/redemption mechanism. An ETF with low on-exchange volume can still have tight spreads if the underlying securities are liquid and APs can hedge efficiently—conversely, as shown here, the bond ETF's wide spreads persist despite some trading volume because the fundamental hedging costs remain high. C is incorrect. Total net assets (TNA) have minimal direct impact on bid-ask spreads in the secondary market. While larger funds may benefit from economies of scale in management fees, this doesn't translate to narrower bid-ask spreads. Market makers and APs determine ETF spreads based on real-time transaction costs and hedging risks, not fund size. A large bond ETF can still have wide spreads if its underlying market is illiquid. The table provides no TNA data, making this option unsupported. Even if the equity ETF were larger, it wouldn't be the primary driver of spread differences.", "explhtml": "<p>Moore&#x27;s explanation establishes that ETF bid-ask spreads primarily compensate APs for the costs of hedging creation/redemption activity. The table data shows the bond ETF has both a wider ETF spread ($0.15 vs. $0.01) and a wider average underlying security spread ($0.12 vs. $0.008).<\/p><p>Bond markets are primarily dealer markets with several characteristics that increase AP hedging costs:<\/p><p>1. <b>Wider dealer spreads<\/b> due to lower transparency and higher inventory risk 2. <b>Higher carrying costs<\/b> related to financing bond inventory (interest rate risk, repo<\/p><p>costs)<\/p><p>3. <b>Lower trading frequency<\/b> requires APs to hold positions longer, increasing risk<\/p><p>exposure<\/p><p>These factors directly translate into wider ETF bid-ask spreads, as APs build these costs into their quotes. The equity ETFs&#x27; underlying securities trade on highly liquid exchanges with narrow spreads and minimal carrying costs, enabling tighter ETF spreads.<\/p><p><b>A is incorrect.<\/b> While the bond ETF does have lower daily trading volume (250,000 vs. 1.2 million shares), this is a secondary effect or symptom rather than the primary driver.<\/p><p>Trading volume correlates with spreads but doesn&#x27;t causally determine them in the ETF context. The low volume itself results from the same underlying market illiquidity that causes wide spreads. More importantly, ETF liquidity derives not just from secondary-market trading but also from the creation/redemption mechanism. An ETF with low on-exchange volume can still have tight spreads if the underlying securities are liquid and APs can hedge efficiently—conversely, as shown here, the bond ETF&#x27;s wide spreads persist despite some trading volume because the fundamental hedging costs remain high.<\/p><p><b>C is incorrect.<\/b> Total net assets (TNA) have minimal direct impact on bid-ask spreads in the secondary market. While larger funds may benefit from economies of scale in management fees, this doesn&#x27;t translate to narrower bid-ask spreads. Market makers and APs determine ETF spreads based on real-time transaction costs and hedging risks, not fund size. A large bond ETF can still have wide spreads if its underlying market is illiquid. The table provides no TNA data, making this option unsupported. Even if the equity ETF were larger, it wouldn&#x27;t be the primary driver of spread differences.<\/p><p class=\"los\">Portfolio Management, Learning Module 3: Exchange-Traded Funds: Mechanics and Applications, LOS 3(d): Describe factors affecting ETF bid-ask spreads<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 24 · Câu 89–92 · Dalia Moore<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dalia Moore, CFA, is the Chief Financial Officer at McGill &amp; Solomon Partners, a Toronto-based<\/p><p>hedge fund. The fund is finalizing a new multi-asset strategy that will rely heavily on Exchange-<\/p><p>Traded Funds (ETFs) for efficient implementation. In a portfolio review meeting, Dalia explains<\/p><p>the core mechanics to her team. She details the creation/redemption process, emphasizing the<\/p><p>role of Authorized Participant (APs). “APS are pivotal,” she notes. “They are the only entities that<\/p><p>can interact directly with the ETF issuer to create new shares by delivering a basket of specified<\/p><p>securities, or redeem shares by returning that basket. This in-kind transfer mechanism is what<\/p><p>keeps the ETF&#x27;s market price aligned with its NAV and provides the fund with its tax efficiency.”<\/p><p>She instructs her trading desk that when establishing large positions, they should be mindful of<\/p><p>contacting Aps to create new shares to avoid excessive market impact, potentially. Later, while<\/p><p>reviewing execution costs for the strategy, Moore and a junior analyst, Liam Chan, discuss<\/p><p>trading ETFs in the secondary market. Moore states, “Remember, our orders interact with the<\/p><p>consolidated tape on an exchange just like stocks. Liquidity is derived from both the volume of<\/p><p>ETF shares traded and the underlying liquidity of the portfolio securities, as Aps can create or<\/p><p>redeem to facilitate large trades.”<\/p><p>Chan is tasked with analyzing potential tracking error for the chosen ETFs. He made three<\/p><p>statements:<\/p><p>Statement 1: “A key source of tracking error is the ETF’s total expense ratio, which created a<\/p><p>persistent drag versus the index.”<\/p><p>Statement 2: “Sampling or optimization strategies used by the ETF manager to replicate an<\/p><p>index can lead to divergence.”<\/p><p>Statement 3: “The bid-ask spread of the underlying securities is a primary factor, but the timing<\/p><p>difference between the fund&#x27;s portfolio valuation (using closing prices) and the real-time<\/p><p>calculation of the ETF&#x27;s NAV is not a material source of tracking error for domestic, transparent<\/p><p>equity ETFs.”<\/p><p>Finally, in the risk committee meeting, Moore outlines the factors that will affect the ETF bid-ask<\/p><p>spreads the fund will encounter. “The spread we pay isn’t arbitrary,” she explains. “It’s primarily a function of the AP’s cost to hedge their creation basket activity. This includes the bid-ask<\/p><p>spreads of the underlying securities, any brokerage commissions, and carrying costs. For a<\/p><p>domestic equity ETF with highly liquid constituents, we should expect tight spreads, often just a<\/p><p>penny or two.”<\/p><\/div><\/details><div class=\"qtext\"><p>Referring to the table data and Moore&#x27;s explanation, which of the following factors would most likely be the primary reason for the wider bid-ask spread of the bond ETF compared to the equity ETF?<\/p><\/div>", "subj": "portfolio"}];
const CFG = {"title": "AnalystPrep — Portfolio Management", "subtitle": "CFA Level II · 92 câu · 24 item sets · AnalystPrep 2026", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left
