m goals. Both steps are accurately described and implemented in the portfolio management process, making option B incorrect. C is incorrect. It indicates that steps 2 and 4 have been least accurately identified. While step 4's description could be seen as somewhat lacking in detail, step 2, which involves formulating the Investment Policy Statement (IPS), is accurately captured. The IPS is a critical document that outlines the investment strategies, reporting requirements, rebalancing guidelines, and other managerial aspects. It serves as a blueprint for managing the portfolio in line with the client's expectations and the manager's investment philosophy. Therefore, asserting that both steps 2 and 4 are inaccurately identified is incorrect, as step 2 is well addressed in the portfolio management process. ", "explhtml": "<p>The correct answer is option A, which states that step 4 has been least accurately identified in the planning stage of the portfolio management process. The planning stage is crucial as it sets the foundation for how the portfolio will be managed. Step 4 specifically involves determining the strategic asset allocation, which is a critical component. This step should ideally combine the Investment Policy Statement (IPS) and capital market expectations to set target asset class weights along with maximum and minimum permissible weights for each asset class. However, the newsletter&#x27;s description of this step seems to simplify or overlook the complexity and importance of accurately aligning the IPS with market expectations to establish a robust asset allocation strategy. This misrepresentation can lead to suboptimal asset allocation, which might not truly reflect the client&#x27;s objectives and constraints as outlined in the IPS.<\/p><p><b>B is incorrect<\/b>. It suggests that steps 1 and 3 have been least accurately identified. However, both steps are correctly outlined and crucial in the planning stage. Step 1 involves defining the client&#x27;s objectives and constraints, which is fundamental to tailoring the portfolio to the specific needs and limitations of the client. Step 3 involves formulating long-run forecasts for asset class risk and returns, which is essential for setting realistic expectations and preparing the portfolio to meet the client&#x27;s long-term goals. Both steps are accurately described and implemented in the portfolio management process, making option B incorrect.<\/p><p><b>C is incorrect<\/b>. It indicates that steps 2 and 4 have been least accurately identified. While step 4&#x27;s description could be seen as somewhat lacking in detail, step 2, which involves formulating the Investment Policy Statement (IPS), is accurately captured. The IPS is a critical document that outlines the investment strategies, reporting requirements, rebalancing guidelines, and other managerial aspects. It serves as a blueprint for managing the portfolio in line with the client&#x27;s expectations and the manager&#x27;s investment philosophy. Therefore, asserting that both steps 2 and 4 are inaccurately identified is incorrect, as step 2 is well addressed in the portfolio management process. <\/p><p class=\"los\">Portfolio Management, Learning Module 6: Analysis of Active Portfolio Management, LOS 6(e): Compare active management strategies (including market timing and security selection) and evaluate strategy changes in terms of the fundamental law of active management<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Tee-Side Asset Management<\/summary><div class=\"vig-body\"><p>Tee-Side Asset Management is a small, family-owned and operated firm. Several clients of the firm are individuals and institutions. A separate department serves each client category within the firm. <\/p><p>To ensure firm clients are aware of its commitment to serve, the firm has circulated a newsletter highlighting the process it undertakes while managing portfolios. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0030.webp\" style=\"max-width:min(100%,397px)\" alt=\"Excerpt – Tee-Side Asset Management Newsletter\"><p><b>Portfolio Management Process<\/b> The portfolio management process encompasses three general stages: planning; execution; and feedback. Each of these stages is discussed briefly below.<\/p><p><b>Planning<\/b> The planning stage incorporates the following steps:<\/p><p>1. Define client objectives and constraints 2. Formulate the Investment Policy Statement (IPS) – amongst other issues this statement<\/p><p>highlights the manager’s investment strategies, namely active, passive, or risk-controlled active strategies.<\/p><p>3. Determine long-run forecasts for asset class risk and returns. 4. Combine the IPS with the manager’s investment style to determine target asset class<\/p><p>weights.<\/p><p><b>Execution<\/b> The execution stage incorporates the following steps:<\/p><p>1. Select specific assets for the client portfolio. 2. Use trading and other analytical data to implement portfolio management decisions. 3. Revise the portfolio on an annual basis.<\/p><p><b>Feedback<\/b>  The feedback stage incorporates the following steps:<\/p><p>1. Monitor performance and rebalance portfolios as necessary. 2. Evaluate managerial performance using various measures.<\/p><p>Concerning managing investor profiles, senior investment officer Victor Gutierrez believes the return requirements and risk tolerances depend on the type of portfolio being managed. Gutierrez has made the following two assertions:<\/p><p>Assertion 1: The risk tolerance of pension plans depends on the risk tolerance of individual participants whereas participants state return requirements in terms of the ability to cover retirement obligations on an inflation-adjusted basis.<\/p><p>Assertion 2: The individual investor category is the sole investor category whose risk tolerance varies following the type of investor. <\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following planning stage steps have been least accurate identified?<\/p><\/div>", "subj": "portfolio"}, {"n": 22, "q": "Which of the following ‘execution’ stage steps is most accurate?", "opts": ["1, 2 and 3.", "1 and 2.", "3 only."], "ans": "B", "expl": "It accurately reflects the first two steps of the execution stage as outlined in the Tee-Side Asset Management newsletter. The first step involves selecting specific assets for the client's portfolio, a critical component of portfolio management that directly impacts the achievement of the client's financial goals, based on their risk tolerance and return expectations. The second step involves using trading and other analytical data to implement portfolio management decisions. This step is crucial for the practical application of the investment strategy, ensuring that the portfolio aligns with both the client's Investment Policy Statement (IPS) and the manager's investment style. A is incorrect. It includes the third step of the execution stage, which involves revising the portfolio on an annual basis. This inclusion is inaccurate as portfolio revisions should not be rigidly fixed to an annual schedule. Instead, revisions should be more flexible and responsive to changes in client circumstances or market conditions. The need for frequent adjustments is particularly important in dynamic financial markets where conditions can change rapidly, necessitating more immediate responses to maintain portfolio alignment with client goals and market realities. C is incorrect. It isolates the third step of the execution stage, suggesting that revising the portfolio is the only action taken during this phase. This is misleading as the execution stage encompasses a broader range of activities essential for effective portfolio management, including asset selection and the implementation of management decisions. Focusing solely on portfolio revision ignores the critical steps of asset selection and implementation that are necessary for achieving the strategic objectives set out in the planning stage. ", "explhtml": "<p>It accurately reflects the first two steps of the execution stage as outlined in the Tee-Side Asset Management newsletter. The first step involves selecting specific assets for the client&#x27;s portfolio, a critical component of portfolio management that directly impacts the achievement of the client&#x27;s financial goals, based on their risk tolerance and return expectations. The second step involves using trading and other analytical data to implement portfolio management decisions. This step is crucial for the practical application of the investment strategy, ensuring that the portfolio aligns with both the client&#x27;s Investment Policy Statement (IPS) and the manager&#x27;s investment style.<\/p><p><b>A is incorrect.<\/b> It includes the third step of the execution stage, which involves revising the portfolio on an annual basis. This inclusion is inaccurate as portfolio revisions should not be rigidly fixed to an annual schedule. Instead, revisions should be more flexible and responsive to changes in client circumstances or market conditions. The need for frequent adjustments is particularly important in dynamic financial markets where conditions can change rapidly, necessitating more immediate responses to maintain portfolio alignment with client goals and market realities.<\/p><p><b>C is incorrect.<\/b> It isolates the third step of the execution stage, suggesting that revising the portfolio is the only action taken during this phase. This is misleading as the execution stage encompasses a broader range of activities essential for effective portfolio management, including asset selection and the implementation of management decisions. Focusing solely on portfolio revision ignores the critical steps of asset selection and implementation that are necessary for achieving the strategic objectives set out in the planning stage. <\/p><p class=\"los\">Portfolio Management, Learning Module 2: Using Multifactor Models, LOS 2(g): Describe the potential benefits for investors in considering multiple risk dimensions when modeling asset returns<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Tee-Side Asset Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tee-Side Asset Management is a small, family-owned and operated firm. Several clients of the firm are individuals and institutions. A separate department serves each client category within the firm. <\/p><p>To ensure firm clients are aware of its commitment to serve, the firm has circulated a newsletter highlighting the process it undertakes while managing portfolios. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0030.webp\" style=\"max-width:min(100%,397px)\" alt=\"Excerpt – Tee-Side Asset Management Newsletter\"><p><b>Portfolio Management Process<\/b> The portfolio management process encompasses three general stages: planning; execution; and feedback. Each of these stages is discussed briefly below.<\/p><p><b>Planning<\/b> The planning stage incorporates the following steps:<\/p><p>1. Define client objectives and constraints 2. Formulate the Investment Policy Statement (IPS) – amongst other issues this statement<\/p><p>highlights the manager’s investment strategies, namely active, passive, or risk-controlled active strategies.<\/p><p>3. Determine long-run forecasts for asset class risk and returns. 4. Combine the IPS with the manager’s investment style to determine target asset class<\/p><p>weights.<\/p><p><b>Execution<\/b> The execution stage incorporates the following steps:<\/p><p>1. Select specific assets for the client portfolio. 2. Use trading and other analytical data to implement portfolio management decisions. 3. Revise the portfolio on an annual basis.<\/p><p><b>Feedback<\/b>  The feedback stage incorporates the following steps:<\/p><p>1. Monitor performance and rebalance portfolios as necessary. 2. Evaluate managerial performance using various measures.<\/p><p>Concerning managing investor profiles, senior investment officer Victor Gutierrez believes the return requirements and risk tolerances depend on the type of portfolio being managed. Gutierrez has made the following two assertions:<\/p><p>Assertion 1: The risk tolerance of pension plans depends on the risk tolerance of individual participants whereas participants state return requirements in terms of the ability to cover retirement obligations on an inflation-adjusted basis.<\/p><p>Assertion 2: The individual investor category is the sole investor category whose risk tolerance varies following the type of investor. <\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following ‘execution’ stage steps is most accurate?<\/p><\/div>", "subj": "portfolio"}, {"n": 23, "q": "Which of the following circumstances will least likely trigger rebalancing of investor portfolios?", "opts": ["Changes in asset prices.", "Frequent portfolio manager changes.", "Deviations from tolerance levels set by the IPS."], "ans": "B", "expl": "Option B is the correct answer because frequent changes in portfolio managers do not inherently necessitate the rebalancing of investor portfolios. Rebalancing is typically triggered by factors that directly affect the asset allocation relative to the investor's goals and risk tolerance as outlined in the Investment Policy Statement (IPS). These factors include significant changes in asset prices, which might alter the risk-return profile of the portfolio, or deviations from the risk tolerance levels set by the IPS. Changes in portfolio managers, while potentially impactful in terms of management style or focus, do not directly alter the fundamental investment objectives or constraints of the portfolio. Therefore, unless the new manager decides to change the investment strategy or the IPS itself, the mere change of managers does not typically trigger a rebalance of the portfolio. A is incorrect. Changes in asset prices can significantly affect the composition and balance of a portfolio. For instance, if the equity component of a portfolio increases in value significantly compared to the fixed income component, the portfolio might become more heavily weighted towards equities than intended, increasing the portfolio’s risk profile beyond the investor's risk tolerance. This misalignment would necessitate a rebalancing to realign the portfolio with the target asset allocation specified in the IPS, ensuring that the portfolio continues to meet the predefined risk and return objectives. C is incorrect. Deviations from tolerance levels set by the IPS are a primary trigger for rebalancing a portfolio. The IPS defines the risk tolerance and investment objectives of the investor. If the actual portfolio deviates from these parameters (due to market movements or other factors), it may no longer reflect the investor's financial goals or risk appetite. Rebalancing in this context is crucial to bring the portfolio back within the acceptable limits defined in the IPS, thereby maintaining the alignment with the investor’s financial goals and risk tolerance. ", "explhtml": "<p>Option B is the correct answer because frequent changes in portfolio managers do not inherently necessitate the rebalancing of investor portfolios. Rebalancing is typically triggered by factors that directly affect the asset allocation relative to the investor&#x27;s goals and risk tolerance as outlined in the Investment Policy Statement (IPS). These factors include significant changes in asset prices, which might alter the risk-return profile of the portfolio, or deviations from the risk tolerance levels set by the IPS. Changes in portfolio managers, while potentially impactful in terms of management style or focus, do not directly alter the fundamental investment objectives or constraints of the portfolio. Therefore, unless the new manager decides to change the investment strategy or the IPS itself, the mere change of managers does not typically trigger a rebalance of the portfolio.<\/p><p><b>A is incorrect<\/b>. Changes in asset prices can significantly affect the composition and balance of a portfolio. For instance, if the equity component of a portfolio increases in value significantly compared to the fixed income component, the portfolio might become more heavily weighted towards equities than intended, increasing the portfolio’s risk profile beyond the investor&#x27;s risk tolerance. This misalignment would necessitate a rebalancing to realign the portfolio with the target asset allocation specified in the IPS, ensuring that the portfolio continues to meet the predefined risk and return objectives.<\/p><p><b>C is incorrect<\/b>. Deviations from tolerance levels set by the IPS are a primary trigger for rebalancing a portfolio. The IPS defines the risk tolerance and investment objectives of the investor. If the actual portfolio deviates from these parameters (due to market movements or other factors), it may no longer reflect the investor&#x27;s financial goals or risk appetite. Rebalancing in this context is crucial to bring the portfolio back within the acceptable limits defined in the IPS, thereby maintaining the alignment with the investor’s financial goals and risk tolerance. <\/p><p class=\"los\">Portfolio Management, Learning Module 6: Analysis of Active Portfolio Management, LOS 6(e): Compare active management strategies (including market timing and security selection) and evaluate strategy changes in terms of the fundamental law of active management<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Tee-Side Asset Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tee-Side Asset Management is a small, family-owned and operated firm. Several clients of the firm are individuals and institutions. A separate department serves each client category within the firm. <\/p><p>To ensure firm clients are aware of its commitment to serve, the firm has circulated a newsletter highlighting the process it undertakes while managing portfolios. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0030.webp\" style=\"max-width:min(100%,397px)\" alt=\"Excerpt – Tee-Side Asset Management Newsletter\"><p><b>Portfolio Management Process<\/b> The portfolio management process encompasses three general stages: planning; execution; and feedback. Each of these stages is discussed briefly below.<\/p><p><b>Planning<\/b> The planning stage incorporates the following steps:<\/p><p>1. Define client objectives and constraints 2. Formulate the Investment Policy Statement (IPS) – amongst other issues this statement<\/p><p>highlights the manager’s investment strategies, namely active, passive, or risk-controlled active strategies.<\/p><p>3. Determine long-run forecasts for asset class risk and returns. 4. Combine the IPS with the manager’s investment style to determine target asset class<\/p><p>weights.<\/p><p><b>Execution<\/b> The execution stage incorporates the following steps:<\/p><p>1. Select specific assets for the client portfolio. 2. Use trading and other analytical data to implement portfolio management decisions. 3. Revise the portfolio on an annual basis.<\/p><p><b>Feedback<\/b>  The feedback stage incorporates the following steps:<\/p><p>1. Monitor performance and rebalance portfolios as necessary. 2. Evaluate managerial performance using various measures.<\/p><p>Concerning managing investor profiles, senior investment officer Victor Gutierrez believes the return requirements and risk tolerances depend on the type of portfolio being managed. Gutierrez has made the following two assertions:<\/p><p>Assertion 1: The risk tolerance of pension plans depends on the risk tolerance of individual participants whereas participants state return requirements in terms of the ability to cover retirement obligations on an inflation-adjusted basis.<\/p><p>Assertion 2: The individual investor category is the sole investor category whose risk tolerance varies following the type of investor. <\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following circumstances will least likely trigger rebalancing of investor portfolios?<\/p><\/div>", "subj": "portfolio"}, {"n": 24, "q": "Which of the following assertions, outlined by Gutierrez, are least likely reflect the respective return requirements and risk tolerances of the specified investors?", "opts": ["1", "2", "Both Assertions."], "ans": "C", "expl": "Assertion 1 inaccurately generalizes the risk tolerance and return requirements of pension plans without distinguishing between defined benefit and defined contribution plans. Defined benefit plans, which guarantee a specific retirement benefit, base their return requirements on the need to fund liabilities adjusted for inflation and have a risk tolerance influenced by the plan's funding status and the characteristics of the plan sponsor. Conversely, defined contribution plans, where benefits depend on contributions and investment performance, tailor their return requirements to the life stages of individual participants, and their risk tolerance reflects the risk preferences of these individuals. Therefore, Assertion 1 fails to capture these nuances, incorrectly suggesting a uniform approach to risk tolerance and return requirements across all pension plans. Assertion 2 is incorrect because it claims that only individual investors have varying risk tolerances depending on the type of investor. This assertion overlooks the fact that risk tolerance also varies among other categories of investors, such as institutional investors, including banks and defined contribution plans. These entities adjust their risk tolerance based on specific investment objectives, financial conditions, and the regulatory environments in which they operate. By stating that only individual investors exhibit variability in risk tolerance, Assertion 2 incorrectly excludes other investor categories that also demonstrate diverse risk tolerances. Both assertions are incorrect as they fail to accurately reflect the complexities and variations in risk tolerances and return requirements among different types of investors. Assertion 1 does not differentiate between the structured approaches of defined benefit and defined contribution pension plans, while Assertion 2 erroneously isolates individual investors as the sole group with varying risk tolerances, ignoring the similar characteristics present in institutional investors. This comprehensive misunderstanding in both assertions leads to the conclusion that option C, stating both assertions are least likely to reflect the respective return requirements and risk tolerances, is the correct answer. ", "explhtml": "<p>Assertion 1 inaccurately generalizes the risk tolerance and return requirements of pension plans without distinguishing between defined benefit and defined contribution plans. Defined benefit plans, which guarantee a specific retirement benefit, base their return requirements on the need to fund liabilities adjusted for inflation and have a risk tolerance influenced by the plan&#x27;s funding status and the characteristics of the plan sponsor. Conversely, defined contribution plans, where benefits depend on contributions and investment performance, tailor their return requirements to the life stages of individual participants, and their risk tolerance reflects the risk preferences of these individuals. Therefore, Assertion 1 fails to capture these nuances, incorrectly suggesting a uniform approach to risk tolerance and return requirements across all pension plans.<\/p><p><b>Assertion 2 is incorrect<\/b> because it claims that only individual investors have varying risk tolerances depending on the type of investor. This assertion overlooks the fact that risk tolerance also varies among other categories of investors, such as institutional investors, including banks and defined contribution plans. These entities adjust their risk tolerance based on specific investment objectives, financial conditions, and the regulatory environments in which they operate. By stating that only individual investors exhibit variability in risk tolerance, Assertion 2 incorrectly excludes other investor categories that also demonstrate diverse risk tolerances.<\/p><p><b>Both assertions are incorrect<\/b> as they fail to accurately reflect the complexities and variations in risk tolerances and return requirements among different types of investors. Assertion 1 does not differentiate between the structured approaches of defined benefit and defined contribution pension plans, while Assertion 2 erroneously isolates individual investors as the sole group with varying risk tolerances, ignoring the similar characteristics present in institutional investors. This comprehensive misunderstanding in both assertions leads to the conclusion that option C, stating both assertions are least likely to reflect the respective return requirements and risk tolerances, is the correct answer. <\/p><p class=\"los\">Portfolio Management, Learning Module 3: Measuring and Managing Market Risk, LOS 3 (l): Describe risk measures used by banks, asset managers, pension funds, and insurers<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Tee-Side Asset Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tee-Side Asset Management is a small, family-owned and operated firm. Several clients of the firm are individuals and institutions. A separate department serves each client category within the firm. <\/p><p>To ensure firm clients are aware of its commitment to serve, the firm has circulated a newsletter highlighting the process it undertakes while managing portfolios. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0030.webp\" style=\"max-width:min(100%,397px)\" alt=\"Excerpt – Tee-Side Asset Management Newsletter\"><p><b>Portfolio Management Process<\/b> The portfolio management process encompasses three general stages: planning; execution; and feedback. Each of these stages is discussed briefly below.<\/p><p><b>Planning<\/b> The planning stage incorporates the following steps:<\/p><p>1. Define client objectives and constraints 2. Formulate the Investment Policy Statement (IPS) – amongst other issues this statement<\/p><p>highlights the manager’s investment strategies, namely active, passive, or risk-controlled active strategies.<\/p><p>3. Determine long-run forecasts for asset class risk and returns. 4. Combine the IPS with the manager’s investment style to determine target asset class<\/p><p>weights.<\/p><p><b>Execution<\/b> The execution stage incorporates the following steps:<\/p><p>1. Select specific assets for the client portfolio. 2. Use trading and other analytical data to implement portfolio management decisions. 3. Revise the portfolio on an annual basis.<\/p><p><b>Feedback<\/b>  The feedback stage incorporates the following steps:<\/p><p>1. Monitor performance and rebalance portfolios as necessary. 2. Evaluate managerial performance using various measures.<\/p><p>Concerning managing investor profiles, senior investment officer Victor Gutierrez believes the return requirements and risk tolerances depend on the type of portfolio being managed. Gutierrez has made the following two assertions:<\/p><p>Assertion 1: The risk tolerance of pension plans depends on the risk tolerance of individual participants whereas participants state return requirements in terms of the ability to cover retirement obligations on an inflation-adjusted basis.<\/p><p>Assertion 2: The individual investor category is the sole investor category whose risk tolerance varies following the type of investor. <\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following assertions, outlined by Gutierrez, are least likely reflect the respective return requirements and risk tolerances of the specified investors?<\/p><\/div>", "subj": "portfolio"}, {"n": 25, "q": "Breeze defines ETFs as baskets of securities that are traded through a broker on an exchange. When ETFs are bought and sold on exchanges, they are most likely considered to be trading in the:", "opts": ["Primary market", "Secondary market", "Both primary and secondary markets"], "ans": "B", "expl": "ETFs, or exchange-traded funds, are traded on exchanges similar to individual stocks, which categorizes their trading environment as the secondary market. The secondary market is where securities are traded after the company has sold its initial offering in the primary market. This is a crucial distinction because it affects how ETFs are priced and traded throughout the trading day. Unlike mutual funds, which are priced at the end of the trading day, ETFs are traded throughout the day with prices fluctuating based on supply and demand. This trading characteristic of ETFs aligns with the operations of the secondary market, where transactions occur between investors without the direct involvement of the issuing companies. A is incorrect. The primary market is where new securities are issued and sold for the first time. This market involves direct transactions between issuing entities and investors. ETFs, however, are not typically issued in the primary market; instead, they are created and redeemed by authorized participants, which is a different process. The primary market is involved during the creation of new ETF shares, but the regular buying and selling of ETFs by individual and institutional investors occur in the secondary market. Therefore, stating that ETFs are traded in the primary market when bought and sold on exchanges is incorrect. C is incorrect. While it's true that the creation and redemption process of ETFs involves the primary market, the regular trading of ETFs by investors takes place exclusively in the secondary market. The option suggesting that ETFs are traded in both the primary and secondary markets when bought and sold on exchanges can be misleading. The primary market's role in ETFs specifically involves the creation and redemption of ETF shares by authorized participants, and it does not typically involve the typical investor. Regular investors engage with ETFs on the secondary market, making the statement that ETFs are traded in both markets inaccurate for the context of the question. ", "explhtml": "<p>ETFs, or exchange-traded funds, are traded on exchanges similar to individual stocks, which categorizes their trading environment as the secondary market. The secondary market is where securities are traded after the company has sold its initial offering in the primary market. This is a crucial distinction because it affects how ETFs are priced and traded throughout the trading day. Unlike mutual funds, which are priced at the end of the trading day, ETFs are traded throughout the day with prices fluctuating based on supply and demand. This trading characteristic of ETFs aligns with the operations of the secondary market, where transactions occur between investors without the direct involvement of the issuing companies.<\/p><p><b>A is incorrect<\/b>. The primary market is where new securities are issued and sold for the first time. This market involves direct transactions between issuing entities and investors. ETFs, however, are not typically issued in the primary market; instead, they are created and redeemed by authorized participants, which is a different process. The primary market is involved during the creation of new ETF shares, but the regular buying and selling of ETFs by individual and institutional investors occur in the secondary market. Therefore, stating that ETFs are traded in the primary market when bought and sold on exchanges is incorrect.<\/p><p><b>C is incorrect<\/b>. While it&#x27;s true that the creation and redemption process of ETFs involves the primary market, the regular trading of ETFs by investors takes place exclusively in the secondary market. The option suggesting that ETFs are traded in both the primary and secondary markets when bought and sold on exchanges can be misleading. The primary market&#x27;s role in ETFs specifically involves the creation and redemption of ETF shares by authorized participants, and it does not typically involve the typical investor. Regular investors engage with ETFs on the secondary market, making the statement that ETFs are traded in both markets inaccurate for the context of the question. <\/p><p class=\"los\">Portfolio Management, Learning Module 1: Exchange-Traded Funds: Mechanics and Applications, LOS 1(b): describe how ETFs are traded in secondary markets<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 25–28 · <\/summary><div class=\"vig-body\"><p>Consider an ETF with a share price of $50.50. The net asset value of the ETF is $50.00.<\/p><p>In this case, the ETF is said to be trading at a premium because it has a higher market value relative to the net asset value.<\/p><p><b>Fund Manager A:<\/b><\/p><p>How will we know that the ETFs will deliver on their promises, including low investment costs,<\/p><p>the lowest possible tax exposure, and closely track the indexes on which they are based?<\/p><p><b>Breeze:<\/b><\/p><p>To understand how well an ETF delivers on its mandate, it is vital to assess the ETF’s ability to<\/p><p>track its underlying index.<\/p><p>Some of the sources of ETF’s tracking error you should pay close attention to include:<\/p><p><b>Source 1:<\/b><\/p><p>Fees and expenses<\/p><p><b>Source 2:<\/b><\/p><p>Representative sampling<\/p><p><b>Source 3:<\/b><\/p><p>Index changes<\/p><p><b>Fund Manager B<\/b><\/p><p>Please clarify the bid/ask spread of ETFs.<\/p><p><b>Breeze:<\/b><\/p><p>The bid-ask spread represents the market maker’s price for taking the other side of the ETF<\/p><p>transaction, which includes the costs and risks to carry the position on his or her books or to<\/p><p>hedge the position using underlying securities, closely related ETFs, or derivatives.<\/p><p>The following factors influence it:<\/p><p><b>Factor 1:<\/b><\/p><p>The desired profit spread of the authorized participants<\/p><p><b>Factor 2:<\/b><\/p><p>Discount related to the likelihood of receiving an offsetting ETF order in a short time frame.<\/p><p><b>Factor 3:<\/b><\/p><p>Creation/redemption fees and other direct trading costs<\/p><p><b>Fund Manager C:<\/b><\/p><p>What are some of the costs related to owning an ETF?<\/p><p><b>Breeze:<\/b><\/p><p>ETF-related cost factors can either be implicit, e.g., tracking error, bid-ask spread, or explicit,<\/p><p>e.g., management fees, commissions, and taxable profits/losses to traders. The effect of<\/p><p>management and trading costs can be assessed by calculating the round-trip and holding period<\/p><p>costs.<\/p><p>Let me demonstrate this using the following example:<\/p><p><b>Case 2<\/b><\/p><p>An investor pays a commission of $5 on a $20,000 trade. Further, he pays a 0.20% bid-ask<\/p><p>spread. I will illustrate how to compute the round-trip and holding period costs with this<\/p><p>information at the end of this session.<\/p><\/div><\/details><div class=\"qtext\"><p>Breeze defines ETFs as baskets of securities that are traded through a broker on an exchange. When ETFs are bought and sold on exchanges, they are most likely considered to be trading in the:<\/p><\/div>", "subj": "portfolio"}, {"n": 26, "q": "Based on Case 1, the end of day premium is closest to:", "opts": ["0.01", "0.99", "1.01"], "ans": "A", "expl": "The correct answer is option A, which calculates the end-of-day premium as 0.01 or 1%. To determine the premium or discount at which an ETF is trading relative to its net asset value (NAV), the formula used is: In Case 1, the ETF price is given as $50.50 and the NAV per share is $50.00. Plugging these values into the formula gives: This calculation shows that the ETF is trading at a 1% premium to its NAV, which corresponds to option A. B is incorrect. It suggests that the premium is 0.99 or 99%, which is a significant misinterpretation of the calculation. The error in this option likely arises from a misunderstanding of the formula for calculating the premium. The correct approach is to subtract the NAV from the ETF price and then divide by the NAV, as shown in the correct calculation. A 99% premium would imply a much higher ETF price relative to the NAV, which is not supported by the given data. C is incorrect. It suggests a premium of 1.01 or 101%, which again significantly misrepresents the relationship between the ETF price and the NAV. This option may result from adding the ETF price to the NAV instead of subtracting it, or from misunderstanding the percentage calculation. The correct calculation clearly shows that the premium is only 1%, indicating that the ETF price is slightly above the NAV, but not nearly to the extent suggested by a 101% premium.  Portfolio Management, Learning Module 1: Exchange-Traded Funds: Mechanics and Applications, LOS 1(e): describe sources of ETF premiums and discounts to NAV", "explhtml": "<p>The correct answer is option A, which calculates the end-of-day premium as 0.01 or 1%. To determine the premium or discount at which an ETF is trading relative to its net asset value (NAV), the formula used is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0031.webp\" style=\"max-width:min(100%,507px)\" alt=\"ETF price −NAV per share End of day premium or discount(%) = NAV per share\"><p>In Case 1, the ETF price is given as $50.50 and the NAV per share is $50.00. Plugging these values into the formula gives:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0032.webp\" style=\"max-width:min(100%,220px)\" alt=\"$50.50 −$50.00 = 0.01 = 1% $50.00\"><p>This calculation shows that the ETF is trading at a 1% premium to its NAV, which corresponds to option A.<\/p><p><b>B is incorrect<\/b>. It suggests that the premium is 0.99 or 99%, which is a significant misinterpretation of the calculation. The error in this option likely arises from a misunderstanding of the formula for calculating the premium. The correct approach is to subtract the NAV from the ETF price and then divide by the NAV, as shown in the correct calculation. A 99% premium would imply a much higher ETF price relative to the NAV, which is not supported by the given data.<\/p><p><b>C is incorrect<\/b>. It suggests a premium of 1.01 or 101%, which again significantly misrepresents the relationship between the ETF price and the NAV. This option may result from adding the ETF price to the NAV instead of subtracting it, or from misunderstanding the percentage calculation. The correct calculation clearly shows that the premium is only 1%, indicating that the ETF price is slightly above the NAV, but not nearly to the extent suggested by a 101% premium.  Portfolio Management, Learning Module 1: Exchange-Traded Funds: Mechanics and Applications, LOS 1(e): describe sources of ETF premiums and discounts to NAV<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 25–28 · <span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Consider an ETF with a share price of $50.50. The net asset value of the ETF is $50.00.<\/p><p>In this case, the ETF is said to be trading at a premium because it has a higher market value relative to the net asset value.<\/p><p><b>Fund Manager A:<\/b><\/p><p>How will we know that the ETFs will deliver on their promises, including low investment costs,<\/p><p>the lowest possible tax exposure, and closely track the indexes on which they are based?<\/p><p><b>Breeze:<\/b><\/p><p>To understand how well an ETF delivers on its mandate, it is vital to assess the ETF’s ability to<\/p><p>track its underlying index.<\/p><p>Some of the sources of ETF’s tracking error you should pay close attention to include:<\/p><p><b>Source 1:<\/b><\/p><p>Fees and expenses<\/p><p><b>Source 2:<\/b><\/p><p>Representative sampling<\/p><p><b>Source 3:<\/b><\/p><p>Index changes<\/p><p><b>Fund Manager B<\/b><\/p><p>Please clarify the bid/ask spread of ETFs.<\/p><p><b>Breeze:<\/b><\/p><p>The bid-ask spread represents the market maker’s price for taking the other side of the ETF<\/p><p>transaction, which includes the costs and risks to carry the position on his or her books or to<\/p><p>hedge the position using underlying securities, closely related ETFs, or derivatives.<\/p><p>The following factors influence it:<\/p><p><b>Factor 1:<\/b><\/p><p>The desired profit spread of the authorized participants<\/p><p><b>Factor 2:<\/b><\/p><p>Discount related to the likelihood of receiving an offsetting ETF order in a short time frame.<\/p><p><b>Factor 3:<\/b><\/p><p>Creation/redemption fees and other direct trading costs<\/p><p><b>Fund Manager C:<\/b><\/p><p>What are some of the costs related to owning an ETF?<\/p><p><b>Breeze:<\/b><\/p><p>ETF-related cost factors can either be implicit, e.g., tracking error, bid-ask spread, or explicit,<\/p><p>e.g., management fees, commissions, and taxable profits/losses to traders. The effect of<\/p><p>management and trading costs can be assessed by calculating the round-trip and holding period<\/p><p>costs.<\/p><p>Let me demonstrate this using the following example:<\/p><p><b>Case 2<\/b><\/p><p>An investor pays a commission of $5 on a $20,000 trade. Further, he pays a 0.20% bid-ask<\/p><p>spread. I will illustrate how to compute the round-trip and holding period costs with this<\/p><p>information at the end of this session.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Case 1, the end of day premium is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 27, "q": "Which of the factors outlined by Breeze is least likely to influence the bid-ask spread for very liquid, high-volume ETFs:", "opts": ["Factor 1", "Factor 2", "Factor 3"], "ans": "C", "expl": "The correct answer is option C, which states that creation/redemption fees and other direct trading costs are least likely to influence the bid-ask spread for very liquid, high-volume ETFs. This conclusion is drawn from understanding the nature of liquid, high-volume ETFs where trading activities are frequent and voluminous, ensuring a continuous matching of buy and sell orders throughout the trading day. In such scenarios, the impact of creation/redemption fees and other direct trading costs on the bid-ask spread is minimized because these fees are more relevant to the process of creating or redeeming ETF shares, which is less frequent in highly liquid markets. The rapid trading environment of these ETFs means that the market makers' inventory risks are lower, and the need for adjustments in prices due to these specific costs is reduced. Therefore, these costs do not significantly widen the bid-ask spread in very liquid, high-volume ETFs. A is incorrect. It suggests that the desired profit spread of the authorized participants is least likely to influence the bid-ask spread for very liquid, high-volume ETFs. This is incorrect because the desired profit spread is a fundamental component of the bid-ask spread in any trading scenario, including highly liquid markets. Market makers and authorized participants consistently strive to maintain a profit margin for their services, which directly impacts the bid-ask spread, regardless of the ETF's trading volume. The profit spread compensates market makers for the risks and costs associated with providing liquidity, making it a persistent factor in determining bid-ask spreads. B is incorrect. It refers to the discount related to the likelihood of receiving an offsetting ETF order in a short time frame, is also an influential factor in determining the bid-ask spread, especially in very liquid, high-volume ETFs. In such markets, the high frequency of trading increases the probability of quickly matching buy and sell orders, which can lead to narrower bid-ask spreads. However, this factor still plays a role in the spread calculation as it affects how market makers price the risk of holding an unmatched position, albeit for a potentially shorter period. Thus, this factor cannot be considered the least influential as it directly impacts the market maker's pricing strategy and risk assessment in active markets.", "explhtml": "<p>The correct answer is option C, which states that creation/redemption fees and other direct trading costs are least likely to influence the bid-ask spread for very liquid, high-volume ETFs. This conclusion is drawn from understanding the nature of liquid, high-volume ETFs where trading activities are frequent and voluminous, ensuring a continuous matching of buy and sell orders throughout the trading day. In such scenarios, the impact of creation/redemption fees and other direct trading costs on the bid-ask spread is minimized because these fees are more relevant to the process of creating or redeeming ETF shares, which is less frequent in highly liquid markets. The rapid trading environment of these ETFs means that the market makers&#x27; inventory risks are lower, and the need for adjustments in prices due to these specific costs is reduced. Therefore, these costs do not significantly widen the bid-ask spread in very liquid, high-volume ETFs.<\/p><p><b>A is incorrect<\/b>. It suggests that the desired profit spread of the authorized participants is least likely to influence the bid-ask spread for very liquid, high-volume ETFs. This is incorrect because the desired profit spread is a fundamental component of the bid-ask spread in any trading scenario, including highly liquid markets. Market makers and authorized participants consistently strive to maintain a profit margin for their services, which directly impacts the bid-ask spread, regardless of the ETF&#x27;s trading volume. The profit spread compensates market makers for the risks and costs associated with providing liquidity, making it a persistent factor in determining bid-ask spreads.<\/p><p><b>B is incorrect<\/b>. It refers to the discount related to the likelihood of receiving an offsetting ETF order in a short time frame, is also an influential factor in determining the bid-ask spread, especially in very liquid, high-volume ETFs. In such markets, the high frequency of trading increases the probability of quickly matching buy and sell orders, which can lead to narrower bid-ask spreads. However, this factor still plays a role in the spread calculation as it affects how market makers price the risk of holding an unmatched position, albeit for a potentially shorter period. Thus, this factor cannot be considered the least influential as it directly impacts the market maker&#x27;s pricing strategy and risk assessment in active markets.<\/p><p class=\"los\">Portfolio Management, Learning Module 1: Exchange-Traded Funds: Mechanics and Applications, LOS 1(f): Describe costs of owning an ETF<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 25–28 · <span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Consider an ETF with a share price of $50.50. The net asset value of the ETF is $50.00.<\/p><p>In this case, the ETF is said to be trading at a premium because it has a higher market value relative to the net asset value.<\/p><p><b>Fund Manager A:<\/b><\/p><p>How will we know that the ETFs will deliver on their promises, including low investment costs,<\/p><p>the lowest possible tax exposure, and closely track the indexes on which they are based?<\/p><p><b>Breeze:<\/b><\/p><p>To understand how well an ETF delivers on its mandate, it is vital to assess the ETF’s ability to<\/p><p>track its underlying index.<\/p><p>Some of the sources of ETF’s tracking error you should pay close attention to include:<\/p><p><b>Source 1:<\/b><\/p><p>Fees and expenses<\/p><p><b>Source 2:<\/b><\/p><p>Representative sampling<\/p><p><b>Source 3:<\/b><\/p><p>Index changes<\/p><p><b>Fund Manager B<\/b><\/p><p>Please clarify the bid/ask spread of ETFs.<\/p><p><b>Breeze:<\/b><\/p><p>The bid-ask spread represents the market maker’s price for taking the other side of the ETF<\/p><p>transaction, which includes the costs and risks to carry the position on his or her books or to<\/p><p>hedge the position using underlying securities, closely related ETFs, or derivatives.<\/p><p>The following factors influence it:<\/p><p><b>Factor 1:<\/b><\/p><p>The desired profit spread of the authorized participants<\/p><p><b>Factor 2:<\/b><\/p><p>Discount related to the likelihood of receiving an offsetting ETF order in a short time frame.<\/p><p><b>Factor 3:<\/b><\/p><p>Creation/redemption fees and other direct trading costs<\/p><p><b>Fund Manager C:<\/b><\/p><p>What are some of the costs related to owning an ETF?<\/p><p><b>Breeze:<\/b><\/p><p>ETF-related cost factors can either be implicit, e.g., tracking error, bid-ask spread, or explicit,<\/p><p>e.g., management fees, commissions, and taxable profits/losses to traders. The effect of<\/p><p>management and trading costs can be assessed by calculating the round-trip and holding period<\/p><p>costs.<\/p><p>Let me demonstrate this using the following example:<\/p><p><b>Case 2<\/b><\/p><p>An investor pays a commission of $5 on a $20,000 trade. Further, he pays a 0.20% bid-ask<\/p><p>spread. I will illustrate how to compute the round-trip and holding period costs with this<\/p><p>information at the end of this session.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the factors outlined by Breeze is least likely to influence the bid-ask spread for very liquid, high-volume ETFs:<\/p><\/div>", "subj": "portfolio"}, {"n": 28, "q": "Based on case 2, the investor's round-trip trading cost is closest to?", "opts": ["0.225", "0.25%", "0.45%"], "ans": "B", "expl": "The correct answer is option B, which states that the round-trip trading cost is 0.25%. To understand why this is the correct answer, we need to calculate the total cost incurred by the investor during the round-trip trade. The round-trip trading cost includes both the commission costs and the bid-ask spread costs, each incurred twice (once for buying and once for selling). The commission for each transaction is calculated as a percentage of the trade amount, which in this case is $20,000. The one-way commission percentage is therefore calculated as follows: Since the trade is a round-trip (buying and selling), this commission is incurred twice: The bid-ask spread for each transaction is given as 0.20%, and since this cost also applies to both buying and selling, the total cost from the bid-ask spread is: However, since the bid-ask spread is divided equally between the buy and sell, we take half of this total for the round-trip calculation: Adding these together gives the total round-trip trading cost: This calculation confirms that option B is correct. A is incorrect. It suggests that the round-trip trading cost is 0.225%. This calculation error likely arises from an incorrect handling of the bid-ask spread or commission calculations. As detailed above, the correct calculations show that the commission contributes 0.05% and the effective bid-ask spread contributes 0.20% to the round-trip cost, totaling 0.25%. Therefore, option A underestimates the total trading cost by not accurately accounting for these components. C is incorrect. It estimates the round-trip trading cost as 0.45%. This overestimation could result from doubling the bid-ask spread without considering that the spread cost should be halved for the purpose of calculating the round-trip cost. The correct approach, as shown, splits the total bid-ask spread across both transactions (buy and sell), leading to a lower effective cost. Thus, option C incorrectly doubles the impact of the bid-ask spread on the round-trip trading cost.", "explhtml": "<p>The correct answer is option B, which states that the round-trip trading cost is 0.25%. To understand why this is the correct answer, we need to calculate the total cost incurred by the investor during the round-trip trade. The round-trip trading cost includes both the commission costs and the bid-ask spread costs, each incurred twice (once for buying and once for selling). The commission for each transaction is calculated as a percentage of the trade amount, which in this case is $20,000. The one-way commission percentage is therefore calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0033.webp\" style=\"max-width:min(100%,331px)\" alt=\"$5 One-way commission = = 0.025% $20, 000\"><p>Since the trade is a round-trip (buying and selling), this commission is incurred twice:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0034.webp\" style=\"max-width:min(100%,356px)\" alt=\"Total commission cost = 0.025% × 2 = 0.05%\"><p>The bid-ask spread for each transaction is given as 0.20%, and since this cost also applies to both buying and selling, the total cost from the bid-ask spread is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0035.webp\" style=\"max-width:min(100%,368px)\" alt=\"Total bid-ask spread cost = 0.20% × 2 = 0.40%\"><p>However, since the bid-ask spread is divided equally between the buy and sell, we take half of this total for the round-trip calculation:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0036.webp\" style=\"max-width:min(100%,368px)\" alt=\"0.40% Effective bid-ask spread cost = = 0.20% 2\"><p>Adding these together gives the total round-trip trading cost:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0037.webp\" style=\"max-width:min(100%,395px)\" alt=\"Round-trip trading cost = 0.05% + 0.20% = 0.25%\"><p>This calculation confirms that option B is correct.<\/p><p><b>A is incorrect<\/b>. It suggests that the round-trip trading cost is 0.225%. This calculation error likely arises from an incorrect handling of the bid-ask spread or commission calculations. As detailed above, the correct calculations show that the commission contributes 0.05% and the effective bid-ask spread contributes 0.20% to the round-trip cost, totaling 0.25%. Therefore, option A underestimates the total trading cost by not accurately accounting for these components.<\/p><p><b>C is incorrect<\/b>. It estimates the round-trip trading cost as 0.45%. This overestimation could result from doubling the bid-ask spread without considering that the spread cost should be halved for the purpose of calculating the round-trip cost. The correct approach, as shown, splits the total bid-ask spread across both transactions (buy and sell), leading to a lower effective cost. Thus, option C incorrectly doubles the impact of the bid-ask spread on the round-trip trading cost.<\/p><p class=\"los\">Portfolio Management, Learning Module 1: Exchange-Traded Funds: Mechanics and Applications, LOS 1(f): Describe costs of owning an ETF<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 25–28 · <span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Consider an ETF with a share price of $50.50. The net asset value of the ETF is $50.00.<\/p><p>In this case, the ETF is said to be trading at a premium because it has a higher market value relative to the net asset value.<\/p><p><b>Fund Manager A:<\/b><\/p><p>How will we know that the ETFs will deliver on their promises, including low investment costs,<\/p><p>the lowest possible tax exposure, and closely track the indexes on which they are based?<\/p><p><b>Breeze:<\/b><\/p><p>To understand how well an ETF delivers on its mandate, it is vital to assess the ETF’s ability to<\/p><p>track its underlying index.<\/p><p>Some of the sources of ETF’s tracking error you should pay close attention to include:<\/p><p><b>Source 1:<\/b><\/p><p>Fees and expenses<\/p><p><b>Source 2:<\/b><\/p><p>Representative sampling<\/p><p><b>Source 3:<\/b><\/p><p>Index changes<\/p><p><b>Fund Manager B<\/b><\/p><p>Please clarify the bid/ask spread of ETFs.<\/p><p><b>Breeze:<\/b><\/p><p>The bid-ask spread represents the market maker’s price for taking the other side of the ETF<\/p><p>transaction, which includes the costs and risks to carry the position on his or her books or to<\/p><p>hedge the position using underlying securities, closely related ETFs, or derivatives.<\/p><p>The following factors influence it:<\/p><p><b>Factor 1:<\/b><\/p><p>The desired profit spread of the authorized participants<\/p><p><b>Factor 2:<\/b><\/p><p>Discount related to the likelihood of receiving an offsetting ETF order in a short time frame.<\/p><p><b>Factor 3:<\/b><\/p><p>Creation/redemption fees and other direct trading costs<\/p><p><b>Fund Manager C:<\/b><\/p><p>What are some of the costs related to owning an ETF?<\/p><p><b>Breeze:<\/b><\/p><p>ETF-related cost factors can either be implicit, e.g., tracking error, bid-ask spread, or explicit,<\/p><p>e.g., management fees, commissions, and taxable profits/losses to traders. The effect of<\/p><p>management and trading costs can be assessed by calculating the round-trip and holding period<\/p><p>costs.<\/p><p>Let me demonstrate this using the following example:<\/p><p><b>Case 2<\/b><\/p><p>An investor pays a commission of $5 on a $20,000 trade. Further, he pays a 0.20% bid-ask<\/p><p>spread. I will illustrate how to compute the round-trip and holding period costs with this<\/p><p>information at the end of this session.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on case 2, the investor&#x27;s round-trip trading cost is closest to?<\/p><\/div>", "subj": "portfolio"}, {"n": 29, "q": "How should Renee most appropriately address Concern 1 while designing Method 2?", "opts": ["She should model the factors or assets on their own.", "She should use a multivariate distribution instead of analyzing each factor or asset independently.", "To calibrate the model, she needs to compute the 10 covariance matrix fundamentals."], "ans": "B", "expl": "Renee should use a multivariate distribution to address Concern 1 while designing Method 2, which involves Monte Carlo simulation. This approach is crucial because it allows for the modeling of dependencies between the factors. Since five out of the seven factors are correlated, using a multivariate distribution ensures that these correlations are appropriately accounted for in the simulation. Modeling each factor independently, as suggested in option A, would ignore these correlations and could lead to inaccurate simulation results. The multivariate distribution captures the joint behavior of the factors, reflecting more realistic and complex interactions that are critical for accurate portfolio simulation and risk assessment. A is incorrect. Modeling each factor or asset independently in the context of Monte Carlo simulation (Method 2) would not adequately address the correlation among five of the seven factors. This approach would treat each factor as if it operates in isolation, disregarding any interaction between them. In financial markets, assets and factors often influence each other, and their returns can be interdependent. Ignoring these dependencies can lead to a misrepresentation of risk and performance in the simulation outcomes. Therefore, an independent model would not capture the true dynamics of the factor portfolios, potentially leading to suboptimal investment decisions. C is incorrect. While it is important to compute the covariance matrix to capture the relationships among the factors, the statement that only 10 covariance matrix fundamentals need to be computed is incorrect. For seven factors, the number of unique elements in the covariance matrix is given by the formula This calculation represents the number of unique pairwise covariances among the factors. Therefore, all 21 elements must be considered to capture the interdependencies among the seven factors fully. The mention of 10 elements might refer to the subset of five correlated factors, but in the context of the entire model with seven factors, all 21 elements are necessary for a comprehensive analysis. ", "explhtml": "<p>Renee should use a multivariate distribution to address Concern 1 while designing Method 2, which involves Monte Carlo simulation. This approach is crucial because it allows for the modeling of dependencies between the factors. Since five out of the seven factors are correlated, using a multivariate distribution ensures that these correlations are appropriately accounted for in the simulation. Modeling each factor independently, as suggested in option A, would ignore these correlations and could lead to inaccurate simulation results. The multivariate distribution captures the joint behavior of the factors, reflecting more realistic and complex interactions that are critical for accurate portfolio simulation and risk assessment.<\/p><p><b>A is incorrect.<\/b> Modeling each factor or asset independently in the context of Monte Carlo simulation (Method 2) would not adequately address the correlation among five of the seven factors. This approach would treat each factor as if it operates in isolation, disregarding any interaction between them. In financial markets, assets and factors often influence each other, and their returns can be interdependent. Ignoring these dependencies can lead to a misrepresentation of risk and performance in the simulation outcomes. Therefore, an independent model would not capture the true dynamics of the factor portfolios, potentially leading to suboptimal investment decisions.<\/p><p><b>C is incorrect.<\/b> While it is important to compute the covariance matrix to capture the relationships among the factors, the statement that only 10 covariance matrix fundamentals need to be computed is incorrect. For seven factors, the number of unique elements in the covariance matrix is given by the formula<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0039.webp\" style=\"max-width:min(100%,135px)\" alt=\"7 × (7 −1) = 21. 2\"><p>This calculation represents the number of unique pairwise covariances among the factors. Therefore, all 21 elements must be considered to capture the interdependencies among the seven factors fully. The mention of 10 elements might refer to the subset of five correlated factors, but in the context of the entire model with seven factors, all 21 elements are necessary for a comprehensive analysis. <\/p><p class=\"los\">Portfolio Management, Learning Module 1: Backtesting and Simulation, LOS 1(g): explain inputs and decisions in simulation and interpret a simulation.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 29–32 · Renee Adams and Doug Jones<\/summary><div class=\"vig-body\"><p>Renee Adams is a senior analyst at Kyle and Myles Associates, a consulting company that<\/p><p>conducts backtesting and simulations to assess equity strategies. The growth style of investing is<\/p><p>based on seven factors. These factors have developed the basis for a multifactor portfolio<\/p><p>strategy that she is working on with her assistant, Doug Jones.<\/p><p>Doug&#x27;s task is to stipulate the investment creation and confirm whether vendor records have<\/p><p>acceptable reporting data. Doug adapts the records to get point-in-time data from a vendor<\/p><p>record. Such data provides fundamental stock data with a reporting interval of three months.<\/p><p>Renee and Doug then calculate key measurement systems and execute primary backtests on<\/p><p>each seven-factor portfolio. Note that portfolio rebalancing is executed monthly for backtesting<\/p><p>over a 30-year limit over a rolling window.<\/p><p>To assess the results of factor portfolio backtests, Renee and Doug use various key measurement<\/p><p>systems. The following table summarizes three of the factor strategies from which Renee asked<\/p><p>Doug to draw conclusions.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0038.webp\" style=\"max-width:min(100%,472px)\" alt=\"Factor 1 Factor 2 Factor 3 VaR(95%) −6.20% −2.80% −1.80% Returns standard deviation 3.50% 1.40% 2.20% Maximum drawdown 42.80% 18.40% 6.40%\"><p>Doug&#x27;s summary indicates the following:<\/p><p>Summary 1: A standard deviation satisfactorily defines risk. This explains why there is no need to<\/p><p>contemplate maximum drawdown.<\/p><p>Summary 2: The downside risk is highest for factor 3, compared to the other two factors.<\/p><p>To recognize institutions and high-net-worth clients who desire standard and risk parity factor<\/p><p>portfolios, Renee weighs the factors and the risk factors equally.<\/p><p>Both Renee and Doug design a standard portfolio (X) and a risk parity portfolio (Y) to generate<\/p><p>data on the performance of these investment strategies grounded on the primary factor<\/p><p>portfolios. They both adopt 1,000 simulation trials for every strategy to create investment performance data:<\/p><p>Method 1: Historical simulation.<\/p><p>Method 2: Monte Carlo simulation.<\/p><p>Together, Renee and Doug outline the alterations between the two methods and design<\/p><p>simulations, making key conclusions at numerous points along the way. Renee expresses the<\/p><p>following concerns during the process:<\/p><p>Concern 1: Among the seven factors, five returns are correlated.<\/p><p>Concern 2: Excess kurtosis and negative skewness characterize the Factor 2 return distribution.<\/p><p>Concern 3: Method 1 involves a greater amount of simulations than the size of the historical<\/p><p>data.<\/p><p>Renee and Doug run 1,000 tests for each method to determine 1,000 returns for Portfolio X and<\/p><p>Y.<\/p><p>Doug proposes simulation of 1000-factor returns with a multivariate skewed student&#x27;s t-<\/p><p>distribution, then repeating method 2 simulation. This will help clarify the skewness and excess<\/p><p>kurtosis detected in Factor 3 returns Portfolios X and Y.<\/p><\/div><\/details><div class=\"qtext\"><p>How should Renee most appropriately address Concern 1 while designing Method 2?<\/p><\/div>", "subj": "portfolio"}, {"n": 30, "q": "Which of Doug's summaries is least accurate?", "opts": ["Summary 1.", "Summary 2.", "Both summary 1 and 2."], "ans": "C", "expl": "Option C is the correct answer because both summaries provided by Doug contain inaccuracies regarding the interpretation of risk measures. Summary 1 inaccurately suggests that the standard deviation alone is sufficient to define risk, disregarding the importance of maximum drawdown. Maximum drawdown represents the largest single drop from peak to bottom in the value of a portfolio before a new peak is achieved, and it is crucial for understanding the worst-case scenario for investments. This measure provides a different perspective on risk compared to standard deviation, which measures the average deviation of returns from the mean and does not fully capture tail risks or the risk of extreme losses. Therefore, considering both measures is essential for a comprehensive risk assessment. A is incorrect. Summary 1 is indeed inaccurate, but it is not the only summary with issues. While it correctly identifies standard deviation as a measure of volatility, it incorrectly dismisses the relevance of maximum drawdown. Maximum drawdown is a critical risk measure, especially for assessing the potential for severe losses in a portfolio. It provides valuable information that standard deviation does not, particularly regarding the resilience and recovery of the portfolio from lows, which can significantly affect investor confidence and decision-making. B is incorrect. Summary 2 is also flawed as it claims that the downside risk is highest for Factor 3, which is contrary to the data presented. The table shows that Factor 3 has the lowest VaR at 95% and the smallest maximum drawdown among the factors, indicating it actually has the least downside risk, not the highest. VaR and maximum drawdown are both used to assess the risk of losses in investments; lower values in these metrics indicate lower risk. Therefore, stating that Factor 3 has the highest downside risk misrepresents the statistical data provided. ", "explhtml": "<p>Option C is the correct answer because both summaries provided by Doug contain inaccuracies regarding the interpretation of risk measures. Summary 1 inaccurately suggests that the standard deviation alone is sufficient to define risk, disregarding the importance of maximum drawdown. Maximum drawdown represents the largest single drop from peak to bottom in the value of a portfolio before a new peak is achieved, and it is crucial for understanding the worst-case scenario for investments. This measure provides a different perspective on risk compared to standard deviation, which measures the average deviation of returns from the mean and does not fully capture tail risks or the risk of extreme losses. Therefore, considering both measures is essential for a comprehensive risk assessment.<\/p><p><b>A is incorrect.<\/b> Summary 1 is indeed inaccurate, but it is not the only summary with issues. While it correctly identifies standard deviation as a measure of volatility, it incorrectly dismisses the relevance of maximum drawdown. Maximum drawdown is a critical risk measure, especially for assessing the potential for severe losses in a portfolio. It provides valuable information that standard deviation does not, particularly regarding the resilience and recovery of the portfolio from lows, which can significantly affect investor confidence and decision-making.<\/p><p><b>B is incorrect.<\/b> Summary 2 is also flawed as it claims that the downside risk is highest for Factor 3, which is contrary to the data presented. The table shows that Factor 3 has the lowest VaR at 95% and the smallest maximum drawdown among the factors, indicating it actually has the least downside risk, not the highest. VaR and maximum drawdown are both used to assess the risk of losses in investments; lower values in these metrics indicate lower risk. Therefore, stating that Factor 3 has the highest downside risk misrepresents the statistical data provided. <\/p><p class=\"los\">Portfolio Management, Learning Module 4: Backtesting and Simulation, LOS 4(g): explain inputs and decisions in simulation and interpret .<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 29–32 · Renee Adams and Doug Jones<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Renee Adams is a senior analyst at Kyle and Myles Associates, a consulting company that<\/p><p>conducts backtesting and simulations to assess equity strategies. The growth style of investing is<\/p><p>based on seven factors. These factors have developed the basis for a multifactor portfolio<\/p><p>strategy that she is working on with her assistant, Doug Jones.<\/p><p>Doug&#x27;s task is to stipulate the investment creation and confirm whether vendor records have<\/p><p>acceptable reporting data. Doug adapts the records to get point-in-time data from a vendor<\/p><p>record. Such data provides fundamental stock data with a reporting interval of three months.<\/p><p>Renee and Doug then calculate key measurement systems and execute primary backtests on<\/p><p>each seven-factor portfolio. Note that portfolio rebalancing is executed monthly for backtesting<\/p><p>over a 30-year limit over a rolling window.<\/p><p>To assess the results of factor portfolio backtests, Renee and Doug use various key measurement<\/p><p>systems. The following table summarizes three of the factor strategies from which Renee asked<\/p><p>Doug to draw conclusions.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0038.webp\" style=\"max-width:min(100%,472px)\" alt=\"Factor 1 Factor 2 Factor 3 VaR(95%) −6.20% −2.80% −1.80% Returns standard deviation 3.50% 1.40% 2.20% Maximum drawdown 42.80% 18.40% 6.40%\"><p>Doug&#x27;s summary indicates the following:<\/p><p>Summary 1: A standard deviation satisfactorily defines risk. This explains why there is no need to<\/p><p>contemplate maximum drawdown.<\/p><p>Summary 2: The downside risk is highest for factor 3, compared to the other two factors.<\/p><p>To recognize institutions and high-net-worth clients who desire standard and risk parity factor<\/p><p>portfolios, Renee weighs the factors and the risk factors equally.<\/p><p>Both Renee and Doug design a standard portfolio (X) and a risk parity portfolio (Y) to generate<\/p><p>data on the performance of these investment strategies grounded on the primary factor<\/p><p>portfolios. They both adopt 1,000 simulation trials for every strategy to create investment performance data:<\/p><p>Method 1: Historical simulation.<\/p><p>Method 2: Monte Carlo simulation.<\/p><p>Together, Renee and Doug outline the alterations between the two methods and design<\/p><p>simulations, making key conclusions at numerous points along the way. Renee expresses the<\/p><p>following concerns during the process:<\/p><p>Concern 1: Among the seven factors, five returns are correlated.<\/p><p>Concern 2: Excess kurtosis and negative skewness characterize the Factor 2 return distribution.<\/p><p>Concern 3: Method 1 involves a greater amount of simulations than the size of the historical<\/p><p>data.<\/p><p>Renee and Doug run 1,000 tests for each method to determine 1,000 returns for Portfolio X and<\/p><p>Y.<\/p><p>Doug proposes simulation of 1000-factor returns with a multivariate skewed student&#x27;s t-<\/p><p>distribution, then repeating method 2 simulation. This will help clarify the skewness and excess<\/p><p>kurtosis detected in Factor 3 returns Portfolios X and Y.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Doug&#x27;s summaries is least accurate?<\/p><\/div>", "subj": "portfolio"}, {"n": 31, "q": "Doug's process for examining how the distribution of returns on Factor 2 impacts the performance of Portfolios X and Y using Method 2 is best described as:", "opts": ["Reporting lag.", "Sensitivity analysis.", "Look-ahead bias."], "ans": "B", "expl": "Doug's approach to examining the impact of the distribution of returns on Factor 2 for the performance of Portfolios X and Y using Method 2 is best described as sensitivity analysis. Sensitivity analysis is a technique used to determine how different values of an independent variable will impact a particular dependent variable under a given set of assumptions. This method is used here to analyze how changes in the distribution characteristics of Factor 2, specifically its skewness and excess kurtosis, affect the outcomes of the portfolios. By employing a Monte Carlo simulation, Doug is able to simulate various scenarios of Factor 2's return distribution, which is modeled using a multivariate skewed student's t-distribution to account for its non-normal characteristics. This allows for a comprehensive examination of how sensitive the portfolio returns are to changes in the underlying distribution of Factor 2, making sensitivity analysis the most appropriate description of Doug's process. A is incorrect. Reporting lag refers to the delay between the end of a reporting period and the publication of the data from that period. It often involves issues related to the timeliness and potential revision of data after its initial release. In the context of Doug's task, the focus is not on the timing or delay of receiving data, but rather on analyzing the impact of the statistical properties of the data (like skewness and kurtosis) on portfolio performance. Therefore, reporting lag does not accurately describe Doug's analytical process in this scenario. C is incorrect. Look-ahead bias occurs when a model or simulation uses information that would not have been available at the time of the investment decision, thus inadvertently incorporating future information into past analysis. In Doug's case, he is not using future data but is instead analyzing the impact of known characteristics of Factor 2's distribution on portfolio outcomes. His use of historical and simulated data does not involve incorporating unknown future information at the time of the investment decisions, thereby ruling out look-ahead bias as a correct description of his method. ", "explhtml": "<p>Doug&#x27;s approach to examining the impact of the distribution of returns on Factor 2 for the performance of Portfolios X and Y using Method 2 is best described as sensitivity analysis. Sensitivity analysis is a technique used to determine how different values of an independent variable will impact a particular dependent variable under a given set of assumptions. This method is used here to analyze how changes in the distribution characteristics of Factor 2, specifically its skewness and excess kurtosis, affect the outcomes of the portfolios. By employing a Monte Carlo simulation, Doug is able to simulate various scenarios of Factor 2&#x27;s return distribution, which is modeled using a multivariate skewed student&#x27;s t-distribution to account for its non-normal characteristics. This allows for a comprehensive examination of how sensitive the portfolio returns are to changes in the underlying distribution of Factor 2, making sensitivity analysis the most appropriate description of Doug&#x27;s process.<\/p><p><b>A is incorrect.<\/b> Reporting lag refers to the delay between the end of a reporting period and the publication of the data from that period. It often involves issues related to the timeliness and potential revision of data after its initial release. In the context of Doug&#x27;s task, the focus is not on the timing or delay of receiving data, but rather on analyzing the impact of the statistical properties of the data (like skewness and kurtosis) on portfolio performance. Therefore, reporting lag does not accurately describe Doug&#x27;s analytical process in this scenario.<\/p><p><b>C is incorrect.<\/b> Look-ahead bias occurs when a model or simulation uses information that would not have been available at the time of the investment decision, thus inadvertently incorporating future information into past analysis. In Doug&#x27;s case, he is not using future data but is instead analyzing the impact of known characteristics of Factor 2&#x27;s distribution on portfolio outcomes. His use of historical and simulated data does not involve incorporating unknown future information at the time of the investment decisions, thereby ruling out look-ahead bias as a correct description of his method. <\/p><p class=\"los\">Portfolio Management, Learning Module 4: Backtesting and Simulation, LOS 4(h): demonstrate the use of sensitivity analysis.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 29–32 · Renee Adams and Doug Jones<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Renee Adams is a senior analyst at Kyle and Myles Associates, a consulting company that<\/p><p>conducts backtesting and simulations to assess equity strategies. The growth style of investing is<\/p><p>based on seven factors. These factors have developed the basis for a multifactor portfolio<\/p><p>strategy that she is working on with her assistant, Doug Jones.<\/p><p>Doug&#x27;s task is to stipulate the investment creation and confirm whether vendor records have<\/p><p>acceptable reporting data. Doug adapts the records to get point-in-time data from a vendor<\/p><p>record. Such data provides fundamental stock data with a reporting interval of three months.<\/p><p>Renee and Doug then calculate key measurement systems and execute primary backtests on<\/p><p>each seven-factor portfolio. Note that portfolio rebalancing is executed monthly for backtesting<\/p><p>over a 30-year limit
