over a rolling window.<\/p><p>To assess the results of factor portfolio backtests, Renee and Doug use various key measurement<\/p><p>systems. The following table summarizes three of the factor strategies from which Renee asked<\/p><p>Doug to draw conclusions.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0038.webp\" style=\"max-width:min(100%,472px)\" alt=\"Factor 1 Factor 2 Factor 3 VaR(95%) −6.20% −2.80% −1.80% Returns standard deviation 3.50% 1.40% 2.20% Maximum drawdown 42.80% 18.40% 6.40%\"><p>Doug&#x27;s summary indicates the following:<\/p><p>Summary 1: A standard deviation satisfactorily defines risk. This explains why there is no need to<\/p><p>contemplate maximum drawdown.<\/p><p>Summary 2: The downside risk is highest for factor 3, compared to the other two factors.<\/p><p>To recognize institutions and high-net-worth clients who desire standard and risk parity factor<\/p><p>portfolios, Renee weighs the factors and the risk factors equally.<\/p><p>Both Renee and Doug design a standard portfolio (X) and a risk parity portfolio (Y) to generate<\/p><p>data on the performance of these investment strategies grounded on the primary factor<\/p><p>portfolios. They both adopt 1,000 simulation trials for every strategy to create investment performance data:<\/p><p>Method 1: Historical simulation.<\/p><p>Method 2: Monte Carlo simulation.<\/p><p>Together, Renee and Doug outline the alterations between the two methods and design<\/p><p>simulations, making key conclusions at numerous points along the way. Renee expresses the<\/p><p>following concerns during the process:<\/p><p>Concern 1: Among the seven factors, five returns are correlated.<\/p><p>Concern 2: Excess kurtosis and negative skewness characterize the Factor 2 return distribution.<\/p><p>Concern 3: Method 1 involves a greater amount of simulations than the size of the historical<\/p><p>data.<\/p><p>Renee and Doug run 1,000 tests for each method to determine 1,000 returns for Portfolio X and<\/p><p>Y.<\/p><p>Doug proposes simulation of 1000-factor returns with a multivariate skewed student&#x27;s t-<\/p><p>distribution, then repeating method 2 simulation. This will help clarify the skewness and excess<\/p><p>kurtosis detected in Factor 3 returns Portfolios X and Y.<\/p><\/div><\/details><div class=\"qtext\"><p>Doug&#x27;s process for examining how the distribution of returns on Factor 2 impacts the performance of Portfolios X and Y using Method 2 is best described as:<\/p><\/div>", "subj": "portfolio"}, {"n": 32, "q": "The most likely difference between historical simulation and Monte Carlo simulation is that:", "opts": ["Historical simulation tends to be deterministic.", "Monte Carlo simulation uses bootstrapping as an analysis method.", "Historical simulation assumes that estimating future asset returns by sampling returns from the actual data provides sufficient guidance."], "ans": "C", "expl": "Historical simulation is a method that relies on the assumption that past market data can be indicative of future outcomes. This method uses actual historical returns to estimate the probability distribution of future returns. By sampling from historical returns, it assumes that the historical conditions will replicate themselves in the future. This approach is particularly useful when dealing with financial markets where historical patterns and trends can often provide insights into future behaviors. However, it is important to note that historical simulation does not account for structural changes in the market or unforeseen events, which can limit its effectiveness in predicting future returns under significantly changed conditions. A is incorrect. Historical simulation, like Monte Carlo simulation, is inherently stochastic, meaning it involves elements of randomness and uncertainty. It is not deterministic because it does not produce a single, definite outcome but rather a range of possible outcomes based on the historical data used. Each simulation run can yield different results due to the random selection of data points from the historical dataset. This randomness is a fundamental characteristic of historical simulations, distinguishing it from deterministic models, which would always produce the same outcome from the same initial conditions. B is incorrect. Monte Carlo simulation does not inherently use bootstrapping as its analysis method. Instead, Monte Carlo simulation involves generating a large number of potential future outcomes for an asset's price or portfolio's value by random sampling from a probability distribution of possible inputs. This method is used to understand the likelihood of different outcomes under uncertainty. While bootstrapping can be a component of some Monte Carlo simulations, especially in resampling techniques, it is not a defining characteristic of Monte Carlo simulations in general. Bootstrapping is more commonly associated with historical simulation, where it is used to create thousands of possible sequences of returns by resampling from historical returns data. ", "explhtml": "<p>Historical simulation is a method that relies on the assumption that past market data can be indicative of future outcomes. This method uses actual historical returns to estimate the probability distribution of future returns. By sampling from historical returns, it assumes that the historical conditions will replicate themselves in the future. This approach is particularly useful when dealing with financial markets where historical patterns and trends can often provide insights into future behaviors. However, it is important to note that historical simulation does not account for structural changes in the market or unforeseen events, which can limit its effectiveness in predicting future returns under significantly changed conditions.<\/p><p><b>A is incorrect<\/b>. Historical simulation, like Monte Carlo simulation, is inherently stochastic, meaning it involves elements of randomness and uncertainty. It is not deterministic because it does not produce a single, definite outcome but rather a range of possible outcomes based on the historical data used. Each simulation run can yield different results due to the random selection of data points from the historical dataset. This randomness is a fundamental characteristic of historical simulations, distinguishing it from deterministic models, which would always produce the same outcome from the same initial conditions.<\/p><p><b>B is incorrect<\/b>. Monte Carlo simulation does not inherently use bootstrapping as its analysis method. Instead, Monte Carlo simulation involves generating a large number of potential future outcomes for an asset&#x27;s price or portfolio&#x27;s value by random sampling from a probability distribution of possible inputs. This method is used to understand the likelihood of different outcomes under uncertainty. While bootstrapping can be a component of some Monte Carlo simulations, especially in resampling techniques, it is not a defining characteristic of Monte Carlo simulations in general. Bootstrapping is more commonly associated with historical simulation, where it is used to create thousands of possible sequences of returns by resampling from historical returns data. <\/p><p class=\"los\">Portfolio Management, Learning Module 4: Backtesting and Simulation, LOS 4(f): contrast Monte Carlo and historical simulation approaches.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 29–32 · Renee Adams and Doug Jones<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Renee Adams is a senior analyst at Kyle and Myles Associates, a consulting company that<\/p><p>conducts backtesting and simulations to assess equity strategies. The growth style of investing is<\/p><p>based on seven factors. These factors have developed the basis for a multifactor portfolio<\/p><p>strategy that she is working on with her assistant, Doug Jones.<\/p><p>Doug&#x27;s task is to stipulate the investment creation and confirm whether vendor records have<\/p><p>acceptable reporting data. Doug adapts the records to get point-in-time data from a vendor<\/p><p>record. Such data provides fundamental stock data with a reporting interval of three months.<\/p><p>Renee and Doug then calculate key measurement systems and execute primary backtests on<\/p><p>each seven-factor portfolio. Note that portfolio rebalancing is executed monthly for backtesting<\/p><p>over a 30-year limit over a rolling window.<\/p><p>To assess the results of factor portfolio backtests, Renee and Doug use various key measurement<\/p><p>systems. The following table summarizes three of the factor strategies from which Renee asked<\/p><p>Doug to draw conclusions.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0038.webp\" style=\"max-width:min(100%,472px)\" alt=\"Factor 1 Factor 2 Factor 3 VaR(95%) −6.20% −2.80% −1.80% Returns standard deviation 3.50% 1.40% 2.20% Maximum drawdown 42.80% 18.40% 6.40%\"><p>Doug&#x27;s summary indicates the following:<\/p><p>Summary 1: A standard deviation satisfactorily defines risk. This explains why there is no need to<\/p><p>contemplate maximum drawdown.<\/p><p>Summary 2: The downside risk is highest for factor 3, compared to the other two factors.<\/p><p>To recognize institutions and high-net-worth clients who desire standard and risk parity factor<\/p><p>portfolios, Renee weighs the factors and the risk factors equally.<\/p><p>Both Renee and Doug design a standard portfolio (X) and a risk parity portfolio (Y) to generate<\/p><p>data on the performance of these investment strategies grounded on the primary factor<\/p><p>portfolios. They both adopt 1,000 simulation trials for every strategy to create investment performance data:<\/p><p>Method 1: Historical simulation.<\/p><p>Method 2: Monte Carlo simulation.<\/p><p>Together, Renee and Doug outline the alterations between the two methods and design<\/p><p>simulations, making key conclusions at numerous points along the way. Renee expresses the<\/p><p>following concerns during the process:<\/p><p>Concern 1: Among the seven factors, five returns are correlated.<\/p><p>Concern 2: Excess kurtosis and negative skewness characterize the Factor 2 return distribution.<\/p><p>Concern 3: Method 1 involves a greater amount of simulations than the size of the historical<\/p><p>data.<\/p><p>Renee and Doug run 1,000 tests for each method to determine 1,000 returns for Portfolio X and<\/p><p>Y.<\/p><p>Doug proposes simulation of 1000-factor returns with a multivariate skewed student&#x27;s t-<\/p><p>distribution, then repeating method 2 simulation. This will help clarify the skewness and excess<\/p><p>kurtosis detected in Factor 3 returns Portfolios X and Y.<\/p><\/div><\/details><div class=\"qtext\"><p>The most likely difference between historical simulation and Monte Carlo simulation is that:<\/p><\/div>", "subj": "portfolio"}, {"n": 33, "q": "The liquidity of the endowment fund is closest to:", "opts": ["$1,000,000.00", "$400,000.00", "$3,400,000.00"], "ans": "A", "expl": "The liquidity of the endowment fund is calculated by considering the total financial obligations the fund must meet in the upcoming year and subtracting any anticipated income. In this case, the endowment fund has committed to providing $1,600,000 in scholarships and will incur $600,000 in operating costs. This totals $2,200,000 in outflows. The fund expects to receive $1,200,000 from alumni contributions. Therefore, the liquidity needed to cover the net outflows is calculated as follows: This calculation shows that the fund needs $1,000,000 in liquid assets to meet its obligations after accounting for expected income, confirming that option A is correct. B is incorrect. This option considers only the scholarships and the anticipated contributions, omitting the operating costs. The calculation provided in option B is: This calculation incorrectly ignores the $600,000 that the fund needs for operating expenses. Operating costs are a crucial part of the fund's financial obligations and must be included in the liquidity calculation to ensure the fund can continue its operations without financial distress. C is incorrect. This option incorrectly adds the anticipated contributions to the total of scholarships and operating costs, rather than subtracting it. The calculation for option C is: This results in an inflated figure that does not represent the fund's liquidity needs but rather the total of expenses and income, which is not relevant to the calculation of liquidity requirements. Liquidity is concerned with the availability of funds to cover expenses, not the sum of expenses and income. ", "explhtml": "<p>The liquidity of the endowment fund is calculated by considering the total financial obligations the fund must meet in the upcoming year and subtracting any anticipated income. In this case, the endowment fund has committed to providing $1,600,000 in scholarships and will incur $600,000 in operating costs. This totals $2,200,000 in outflows. The fund expects to receive $1,200,000 from alumni contributions. Therefore, the liquidity needed to cover the net outflows is calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0040.webp\" style=\"max-width:min(100%,418px)\" alt=\"$1, 600, 000 + $600, 000 −$1, 200, 000 = $1, 000, 000\"><p>This calculation shows that the fund needs $1,000,000 in liquid assets to meet its obligations after accounting for expected income, confirming that option A is correct.<\/p><p><b>B is incorrect<\/b>. This option considers only the scholarships and the anticipated contributions, omitting the operating costs. The calculation provided in option B is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0041.webp\" style=\"max-width:min(100%,308px)\" alt=\"$1, 600, 000 −$1, 200, 000 = $400,000\"><p>This calculation incorrectly ignores the $600,000 that the fund needs for operating expenses. Operating costs are a crucial part of the fund&#x27;s financial obligations and must be included in the liquidity calculation to ensure the fund can continue its operations without financial distress.<\/p><p><b>C is incorrect<\/b>. This option incorrectly adds the anticipated contributions to the total of scholarships and operating costs, rather than subtracting it. The calculation for option C is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0042.webp\" style=\"max-width:min(100%,418px)\" alt=\"$1, 600, 000 + $600, 000 + $1, 200, 000 = $3, 400, 000\"><p>This results in an inflated figure that does not represent the fund&#x27;s liquidity needs but rather the total of expenses and income, which is not relevant to the calculation of liquidity requirements. Liquidity is concerned with the availability of funds to cover expenses, not the sum of expenses and income. <\/p><p class=\"los\">Portfolio Management, Learning Module 3: Measuring and Managing Market Risk, LOS 3(l) describe risk measures used by banks, asset managers, pension funds, and insurers.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 33–36 · Juan Pablo<\/summary><div class=\"vig-body\"><p>Juan Pablo, CFA, works for Louis Grant Investment as a wealth manager. His scope of work<\/p><p>includes advising institutions and families on how to actualize their investment goals. One of his<\/p><p>clients, Jose Sancho, aged 58, is looking to retire at the age of 63. Sancho has worked at a Ship<\/p><p>repair yard for 38 years and will receive an annual pension of $ 60,000. By the time he retires,<\/p><p>he hopes to save $ 1,200,000 by saving actively and living a modest life.<\/p><p>Sancho owns an $ 800,000 house with no outstanding mortgage, and he hopes to sell it in five<\/p><p>years. He anticipates the house&#x27;s value will keep up with the 5% inflation. After retirement,<\/p><p>Sancho plans to buy a beach house worth $600,000 and a $100,000 Sailboat at the Gulf of<\/p><p>Mexico. He believes he will need $ 90,000 annually in his first retirement year to maintain his<\/p><p>lifestyle. Sancho is risk-averse and makes calculated investments. He expects a 30% effective tax<\/p><p>rate upon retirement.<\/p><p>Juan&#x27;s Colleague, Roberto Carlos, CFA, recently moved to a firm that deals in college endowment<\/p><p>funds. The company set up the fund to offer $ 1,600,000 worth of scholarships to needy students.<\/p><p>Currently, the endowment fund is valued at $ 60,000,000. Over the past six years, alumni<\/p><p>contributions averaged $1,200,000 annually, expected to increase by 2% in the coming year. The<\/p><p>operating costs for the endowment fund in the next year will be $600,000.<\/p><p>Carlos reviews the endowment fund&#x27;s returns and variance for the past several years and notices<\/p><p>that the covariance of the fund&#x27;s returns with the market returns is 0.0028. The standard<\/p><p>deviation of the market return is 0.08. The endowment fund has also outperformed the market by<\/p><p>300 bps annually for several years. The college&#x27;s board of directors is very pleased with Carlos&#x27;<\/p><p>performance, and one of the board members, Maria Castano, approaches Carlos about the<\/p><p>possibility of her becoming his client. Roberto refers her to Juan Pablo, who gladly takes her as<\/p><p>his client.<\/p><p>During their first meeting, Maria Castano says that she has tried several investments but has lost<\/p><p>a lot of money because she buys into what everyone else is investing in. Juan Pablo conducts a<\/p><p>risk assessment and establishes that Castano is a risk-taker. He asks Castano if she has ever<\/p><p>considered writing an individual policy statement.<\/p><p>Castano makes the following statements:<\/p><p>Statement 1: “ An individual policy statement wastes time because many one-size-fits-all<\/p><p>approaches to selecting investment products meet the same objectives.”<\/p><p>Statement 2: “A short investment horizon is the best when approaching retirement.”<\/p><\/div><\/details><div class=\"qtext\"><p>The liquidity of the endowment fund is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 34, "q": "Jose Sancho's return objective at the time of retirement is closest to:", "opts": ["9.96%.", "1.97%.", "5.00%."], "ans": "A", "expl": "Jose Sancho's financial situation at retirement requires a detailed analysis to determine his return objective. Initially, we calculate the future value of his house, which is expected to appreciate at an annual inflation rate of 5%. Using the formula for compound interest, the future value of the house is calculated as follows: Upon retirement, Sancho plans to purchase a beach house and a sailboat, costing \\$600,000 and \\$100,000 respectively. Subtracting these costs from the future value of his current house gives: Adding this amount to his savings of \\$1,200,000, his total wealth at retirement is: Sancho's annual pension is \\$60,000, but he estimates needing $90,000 annually to maintain his lifestyle. The additional amount needed from his investments is: The required return on his total wealth to generate this additional income is: However, this rate must be adjusted for a 30% tax rate and a 5% inflation rate. The adjusted return is calculated using the formula: Thus, the closest return objective for Jose Sancho at the time of retirement is approximately 9.96%. B is incorrect. It suggests a return of 1.97%, which represents the basic required return from his investments to meet the additional annual expense of \\$30,000, without considering the effects of taxes and inflation. This calculation does not provide a complete picture of the return needed to maintain his lifestyle in a real-world scenario where both taxes and inflation reduce the effective value of investment returns. Therefore, while mathematically correct in a vacuum, it fails to account for practical financial factors that significantly impact net income and purchasing power. C is incorrect. The 5.00% mentioned in Option C corresponds to the annual inflation rate expected for the house's value appreciation. This rate does not represent the total return needed on Sancho's investments to meet his retirement expenses. It only indicates the growth rate of one asset (the house) and does not encompass the comprehensive financial requirements, including tax effects and additional income needed to sustain his desired retirement lifestyle. Thus, using the inflation rate as a proxy for the required investment return is misleading and insufficient for retirement planning. ", "explhtml": "<p>Jose Sancho&#x27;s financial situation at retirement requires a detailed analysis to determine his return objective. Initially, we calculate the future value of his house, which is expected to appreciate at an annual inflation rate of 5%. Using the formula for compound interest, the future value of the house is calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0043.webp\" style=\"max-width:min(100%,271px)\" alt=\"$800,000 × (1.05)5 = $1, 021, 025\"><p>Upon retirement, Sancho plans to purchase a beach house and a sailboat, costing \\$600,000 and \\$100,000 respectively. Subtracting these costs from the future value of his current house gives:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0044.webp\" style=\"max-width:min(100%,385px)\" alt=\"$1,021, 025 −$600,000 −$100, 000 = $321, 025\"><p>Adding this amount to his savings of \\$1,200,000, his total wealth at retirement is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0045.webp\" style=\"max-width:min(100%,308px)\" alt=\"$1, 200, 000 + $321, 025 = $1, 521,025\"><p>Sancho&#x27;s annual pension is \\$60,000, but he estimates needing $90,000 annually to maintain his lifestyle. The additional amount needed from his investments is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0046.webp\" style=\"max-width:min(100%,247px)\" alt=\"$90, 000 −$60, 000 = $30, 000\"><p>The required return on his total wealth to generate this additional income is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0047.webp\" style=\"max-width:min(100%,234px)\" alt=\"$30, 000 = 0.0197 = 1.97% $1, 521, 025\"><p>However, this rate must be adjusted for a 30% tax rate and a 5% inflation rate. The adjusted return is calculated using the formula:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0048.webp\" style=\"max-width:min(100%,247px)\" alt=\"0.0197 + 0.05 1 −0.3 = 0.0995 = 9.95%\"><p>Thus, the closest return objective for Jose Sancho at the time of retirement is approximately 9.96%.<\/p><p><b>B is incorrect<\/b>. It suggests a return of 1.97%, which represents the basic required return from his investments to meet the additional annual expense of \\$30,000, without considering the effects of taxes and inflation. This calculation does not provide a complete picture of the return needed to maintain his lifestyle in a real-world scenario where both taxes and inflation reduce the effective value of investment returns. Therefore, while mathematically correct in a vacuum, it fails to account for practical financial factors that significantly impact net income and purchasing power.<\/p><p><b>C is incorrect<\/b>. The 5.00% mentioned in Option C corresponds to the annual inflation rate expected for the house&#x27;s value appreciation. This rate does not represent the total return needed on Sancho&#x27;s investments to meet his retirement expenses. It only indicates the growth rate of one asset (the house) and does not encompass the comprehensive financial requirements, including tax effects and additional income needed to sustain his desired retirement lifestyle. Thus, using the inflation rate as a proxy for the required investment return is misleading and insufficient for retirement planning. <\/p><p class=\"los\">Portfolio Management, Learning Module 5: Economics and Investment Markets, LOS 5(e) describe the factors that affect yield spreads between non-inflation-adjusted and inflation-indexed bonds.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 33–36 · Juan Pablo<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Juan Pablo, CFA, works for Louis Grant Investment as a wealth manager. His scope of work<\/p><p>includes advising institutions and families on how to actualize their investment goals. One of his<\/p><p>clients, Jose Sancho, aged 58, is looking to retire at the age of 63. Sancho has worked at a Ship<\/p><p>repair yard for 38 years and will receive an annual pension of $ 60,000. By the time he retires,<\/p><p>he hopes to save $ 1,200,000 by saving actively and living a modest life.<\/p><p>Sancho owns an $ 800,000 house with no outstanding mortgage, and he hopes to sell it in five<\/p><p>years. He anticipates the house&#x27;s value will keep up with the 5% inflation. After retirement,<\/p><p>Sancho plans to buy a beach house worth $600,000 and a $100,000 Sailboat at the Gulf of<\/p><p>Mexico. He believes he will need $ 90,000 annually in his first retirement year to maintain his<\/p><p>lifestyle. Sancho is risk-averse and makes calculated investments. He expects a 30% effective tax<\/p><p>rate upon retirement.<\/p><p>Juan&#x27;s Colleague, Roberto Carlos, CFA, recently moved to a firm that deals in college endowment<\/p><p>funds. The company set up the fund to offer $ 1,600,000 worth of scholarships to needy students.<\/p><p>Currently, the endowment fund is valued at $ 60,000,000. Over the past six years, alumni<\/p><p>contributions averaged $1,200,000 annually, expected to increase by 2% in the coming year. The<\/p><p>operating costs for the endowment fund in the next year will be $600,000.<\/p><p>Carlos reviews the endowment fund&#x27;s returns and variance for the past several years and notices<\/p><p>that the covariance of the fund&#x27;s returns with the market returns is 0.0028. The standard<\/p><p>deviation of the market return is 0.08. The endowment fund has also outperformed the market by<\/p><p>300 bps annually for several years. The college&#x27;s board of directors is very pleased with Carlos&#x27;<\/p><p>performance, and one of the board members, Maria Castano, approaches Carlos about the<\/p><p>possibility of her becoming his client. Roberto refers her to Juan Pablo, who gladly takes her as<\/p><p>his client.<\/p><p>During their first meeting, Maria Castano says that she has tried several investments but has lost<\/p><p>a lot of money because she buys into what everyone else is investing in. Juan Pablo conducts a<\/p><p>risk assessment and establishes that Castano is a risk-taker. He asks Castano if she has ever<\/p><p>considered writing an individual policy statement.<\/p><p>Castano makes the following statements:<\/p><p>Statement 1: “ An individual policy statement wastes time because many one-size-fits-all<\/p><p>approaches to selecting investment products meet the same objectives.”<\/p><p>Statement 2: “A short investment horizon is the best when approaching retirement.”<\/p><\/div><\/details><div class=\"qtext\"><p>Jose Sancho&#x27;s return objective at the time of retirement is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 35, "q": "Jose Sancho's ability and willingness to accept risk is most likely:", "opts": ["Below average and above average, respectively.", "Both are below average.", "Above average and below average, respectively."], "ans": "C", "expl": "Jose Sancho's financial situation and personal characteristics indicate that his ability to accept risk is above average. This is evidenced by his substantial asset base, including a fully paid-off house valued at $800,000 and his anticipated retirement savings of $1,200,000. Additionally, he will receive a stable annual pension of $60,000, which significantly covers more than half of his expected annual expenditure of $90,000 in his first retirement year. The combination of these assets and income streams ensures that Sancho has a strong financial cushion, allowing him to absorb potential financial shocks or underperformance in investment returns without jeopardizing his standard of living. Furthermore, his long-term employment and consistent saving behavior demonstrate financial stability and prudence, enhancing his capacity to take on investment risks if necessary. A is incorrect. The statement that Sancho's ability to accept risk is below average contradicts the evidence provided by his financial stability and substantial asset base. His pension and savings provide a significant safety net, which typically enables a higher risk tolerance. Additionally, the claim that his willingness to accept risk is above average is unsupported. Sancho's risk-averse nature and preference for calculated decisions, as described, suggest a conservative approach to risk-taking, rather than an above-average willingness to engage in risky investments. B is incorrect. While it might seem plausible that Sancho's conservative nature and risk aversion could lead to a below-average willingness to accept risk, stating that both his ability and willingness to accept risk are below average overlooks the financial robustness provided by his assets and pension. These financial resources inherently increase his ability to tolerate risk, even if his personal inclination might be to avoid it. Therefore, it is inaccurate to categorize his ability to accept risk as below average when his financial situation provides substantial risk-bearing capacity. ", "explhtml": "<p>Jose Sancho&#x27;s financial situation and personal characteristics indicate that his ability to accept risk is above average. This is evidenced by his substantial asset base, including a fully paid-off house valued at $800,000 and his anticipated retirement savings of $1,200,000. Additionally, he will receive a stable annual pension of $60,000, which significantly covers more than half of his expected annual expenditure of $90,000 in his first retirement year. The combination of these assets and income streams ensures that Sancho has a strong financial cushion, allowing him to absorb potential financial shocks or underperformance in investment returns without jeopardizing his standard of living. Furthermore, his long-term employment and consistent saving behavior demonstrate financial stability and prudence, enhancing his capacity to take on investment risks if necessary.<\/p><p><b>A is incorrect<\/b>. The statement that Sancho&#x27;s ability to accept risk is below average contradicts the evidence provided by his financial stability and substantial asset base. His pension and savings provide a significant safety net, which typically enables a higher risk tolerance. Additionally, the claim that his willingness to accept risk is above average is unsupported. Sancho&#x27;s risk-averse nature and preference for calculated decisions, as described, suggest a conservative approach to risk-taking, rather than an above-average willingness to engage in risky investments.<\/p><p><b>B is incorrect<\/b>. While it might seem plausible that Sancho&#x27;s conservative nature and risk aversion could lead to a below-average willingness to accept risk, stating that both his ability and willingness to accept risk are below average overlooks the financial robustness provided by his assets and pension. These financial resources inherently increase his ability to tolerate risk, even if his personal inclination might be to avoid it. Therefore, it is inaccurate to categorize his ability to accept risk as below average when his financial situation provides substantial risk-bearing capacity. <\/p><p class=\"los\">Portfolio Management, Learning Module 3: Measuring and Managing Market Risk, LOS 3(j) explain constraints used in managing market risks, including risk budgeting, position limits, scenario limits, and stop-loss limits.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 33–36 · Juan Pablo<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Juan Pablo, CFA, works for Louis Grant Investment as a wealth manager. His scope of work<\/p><p>includes advising institutions and families on how to actualize their investment goals. One of his<\/p><p>clients, Jose Sancho, aged 58, is looking to retire at the age of 63. Sancho has worked at a Ship<\/p><p>repair yard for 38 years and will receive an annual pension of $ 60,000. By the time he retires,<\/p><p>he hopes to save $ 1,200,000 by saving actively and living a modest life.<\/p><p>Sancho owns an $ 800,000 house with no outstanding mortgage, and he hopes to sell it in five<\/p><p>years. He anticipates the house&#x27;s value will keep up with the 5% inflation. After retirement,<\/p><p>Sancho plans to buy a beach house worth $600,000 and a $100,000 Sailboat at the Gulf of<\/p><p>Mexico. He believes he will need $ 90,000 annually in his first retirement year to maintain his<\/p><p>lifestyle. Sancho is risk-averse and makes calculated investments. He expects a 30% effective tax<\/p><p>rate upon retirement.<\/p><p>Juan&#x27;s Colleague, Roberto Carlos, CFA, recently moved to a firm that deals in college endowment<\/p><p>funds. The company set up the fund to offer $ 1,600,000 worth of scholarships to needy students.<\/p><p>Currently, the endowment fund is valued at $ 60,000,000. Over the past six years, alumni<\/p><p>contributions averaged $1,200,000 annually, expected to increase by 2% in the coming year. The<\/p><p>operating costs for the endowment fund in the next year will be $600,000.<\/p><p>Carlos reviews the endowment fund&#x27;s returns and variance for the past several years and notices<\/p><p>that the covariance of the fund&#x27;s returns with the market returns is 0.0028. The standard<\/p><p>deviation of the market return is 0.08. The endowment fund has also outperformed the market by<\/p><p>300 bps annually for several years. The college&#x27;s board of directors is very pleased with Carlos&#x27;<\/p><p>performance, and one of the board members, Maria Castano, approaches Carlos about the<\/p><p>possibility of her becoming his client. Roberto refers her to Juan Pablo, who gladly takes her as<\/p><p>his client.<\/p><p>During their first meeting, Maria Castano says that she has tried several investments but has lost<\/p><p>a lot of money because she buys into what everyone else is investing in. Juan Pablo conducts a<\/p><p>risk assessment and establishes that Castano is a risk-taker. He asks Castano if she has ever<\/p><p>considered writing an individual policy statement.<\/p><p>Castano makes the following statements:<\/p><p>Statement 1: “ An individual policy statement wastes time because many one-size-fits-all<\/p><p>approaches to selecting investment products meet the same objectives.”<\/p><p>Statement 2: “A short investment horizon is the best when approaching retirement.”<\/p><\/div><\/details><div class=\"qtext\"><p>Jose Sancho&#x27;s ability and willingness to accept risk is most likely:<\/p><\/div>", "subj": "portfolio"}, {"n": 36, "q": "Jose Sancho's time horizon can be best described as:", "opts": ["Short-term and single-stage.", "Long-term and multistage.", "Long-term and single-stage."], "ans": "B", "expl": "Jose Sancho's time horizon can be best described as long-term and multistage. This classification is due to several factors that extend and vary his financial planning needs over different phases of his life. Firstly, at 58 years old, Sancho is approaching retirement but is not there yet, indicating a remaining working period where he will continue to save and invest. This period until he retires at 63 is the first stage. Post-retirement, he plans to change his living situation by selling his current house and purchasing a beach house and a sailboat, which marks the beginning of a new lifestyle and financial demands. Additionally, his retirement phase will involve managing his pension, savings, and possibly other investments to sustain his lifestyle, which includes an anticipated annual expense of $90,000. These considerations clearly show that Sancho's financial planning spans multiple stages: pre-retirement savings and investment, immediate post-retirement adjustments, and long-term retirement income management. A is incorrect. The option suggesting that Sancho's time horizon is short-term and single-stage fails to capture the complexity and length of his financial planning needs. Sancho is not merely planning for an immediate financial goal but rather for a series of interconnected financial stages that span several years. The term \"short-term\" is typically associated with time horizons that last less than three years, which does not apply to Sancho's situation, as he is planning at least five years ahead just to retirement, not to mention the years of managing his retirement funds thereafter. Additionally, the \"single-stage\" descriptor ignores the transitions Sancho will undergo from active saving for retirement to managing his finances during retirement. C is incorrect. Describing Sancho's time horizon as long-term and single-stage is partially correct but ultimately misleading. While it is true that his planning extends over a long period, categorizing it as single-stage disregards the distinct phases of financial decisions and lifestyle changes he anticipates. These include his active employment period, the transition to retirement, and the long-term management of his retirement funds and lifestyle. Each stage has unique financial needs and risks associated with it, which necessitate a multistage approach in financial planning to prepare for and address these changes adequately. ", "explhtml": "<p>Jose Sancho&#x27;s time horizon can be best described as long-term and multistage. This classification is due to several factors that extend and vary his financial planning needs over different phases of his life. Firstly, at 58 years old, Sancho is approaching retirement but is not there yet, indicating a remaining working period where he will continue to save and invest. This period until he retires at 63 is the first stage. Post-retirement, he plans to change his living situation by selling his current house and purchasing a beach house and a sailboat, which marks the beginning of a new lifestyle and financial demands. Additionally, his retirement phase will involve managing his pension, savings, and possibly other investments to sustain his lifestyle, which includes an anticipated annual expense of $90,000. These considerations clearly show that Sancho&#x27;s financial planning spans multiple stages: pre-retirement savings and investment, immediate post-retirement adjustments, and long-term retirement income management.<\/p><p><b>A is incorrect<\/b>. The option suggesting that Sancho&#x27;s time horizon is short-term and single-stage fails to capture the complexity and length of his financial planning needs. Sancho is not merely planning for an immediate financial goal but rather for a series of interconnected financial stages that span several years. The term &quot;short-term&quot; is typically associated with time horizons that last less than three years, which does not apply to Sancho&#x27;s situation, as he is planning at least five years ahead just to retirement, not to mention the years of managing his retirement funds thereafter. Additionally, the &quot;single-stage&quot; descriptor ignores the transitions Sancho will undergo from active saving for retirement to managing his finances during retirement.<\/p><p><b>C is incorrect<\/b>. Describing Sancho&#x27;s time horizon as long-term and single-stage is partially correct but ultimately misleading. While it is true that his planning extends over a long period, categorizing it as single-stage disregards the distinct phases of financial decisions and lifestyle changes he anticipates. These include his active employment period, the transition to retirement, and the long-term management of his retirement funds and lifestyle. Each stage has unique financial needs and risks associated with it, which necessitate a multistage approach in financial planning to prepare for and address these changes adequately. <\/p><p class=\"los\">Portfolio Management, Learning Module 3: Measuring and Managing Market Risk, LOS 3(a) explain the use of value at risk (VaR) in measuring portfolio risk.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 33–36 · Juan Pablo<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Juan Pablo, CFA, works for Louis Grant Investment as a wealth manager. His scope of work<\/p><p>includes advising institutions and families on how to actualize their investment goals. One of his<\/p><p>clients, Jose Sancho, aged 58, is looking to retire at the age of 63. Sancho has worked at a Ship<\/p><p>repair yard for 38 years and will receive an annual pension of $ 60,000. By the time he retires,<\/p><p>he hopes to save $ 1,200,000 by saving actively and living a modest life.<\/p><p>Sancho owns an $ 800,000 house with no outstanding mortgage, and he hopes to sell it in five<\/p><p>years. He anticipates the house&#x27;s value will keep up with the 5% inflation. After retirement,<\/p><p>Sancho plans to buy a beach house worth $600,000 and a $100,000 Sailboat at the Gulf of<\/p><p>Mexico. He believes he will need $ 90,000 annually in his first retirement year to maintain his<\/p><p>lifestyle. Sancho is risk-averse and makes calculated investments. He expects a 30% effective tax<\/p><p>rate upon retirement.<\/p><p>Juan&#x27;s Colleague, Roberto Carlos, CFA, recently moved to a firm that deals in college endowment<\/p><p>funds. The company set up the fund to offer $ 1,600,000 worth of scholarships to needy students.<\/p><p>Currently, the endowment fund is valued at $ 60,000,000. Over the past six years, alumni<\/p><p>contributions averaged $1,200,000 annually, expected to increase by 2% in the coming year. The<\/p><p>operating costs for the endowment fund in the next year will be $600,000.<\/p><p>Carlos reviews the endowment fund&#x27;s returns and variance for the past several years and notices<\/p><p>that the covariance of the fund&#x27;s returns with the market returns is 0.0028. The standard<\/p><p>deviation of the market return is 0.08. The endowment fund has also outperformed the market by<\/p><p>300 bps annually for several years. The college&#x27;s board of directors is very pleased with Carlos&#x27;<\/p><p>performance, and one of the board members, Maria Castano, approaches Carlos about the<\/p><p>possibility of her becoming his client. Roberto refers her to Juan Pablo, who gladly takes her as<\/p><p>his client.<\/p><p>During their first meeting, Maria Castano says that she has tried several investments but has lost<\/p><p>a lot of money because she buys into what everyone else is investing in. Juan Pablo conducts a<\/p><p>risk assessment and establishes that Castano is a risk-taker. He asks Castano if she has ever<\/p><p>considered writing an individual policy statement.<\/p><p>Castano makes the following statements:<\/p><p>Statement 1: “ An individual policy statement wastes time because many one-size-fits-all<\/p><p>approaches to selecting investment products meet the same objectives.”<\/p><p>Statement 2: “A short investment horizon is the best when approaching retirement.”<\/p><\/div><\/details><div class=\"qtext\"><p>Jose Sancho&#x27;s time horizon can be best described as:<\/p><\/div>", "subj": "portfolio"}, {"n": 37, "q": "Nelson is most likely correct regarding:", "opts": ["Statement 1", "Statement 2", "Statement 3"], "ans": "C", "expl": "Statement 3 is correct. The authorized participants will incur security transaction cost for the ETF’s portfolio during the ETF creation process. These costs will then be passed to the investors in the ETFs bid-ask spread. A is incorrect. ETFs are traded in both the primary and secondary markets. Investors typically buy and sell ETFs in the secondary market, like stocks, on exchanges. B is incorrect. ETFs can be shorted just like individual stocks, allowing investors to bet against the price of the ETF.", "explhtml": "<p><b>Statement 3 is correct.<\/b> The authorized participants will incur security transaction cost for the ETF’s portfolio during the ETF creation process. These costs will then be passed to the investors in the ETFs bid-ask spread.<\/p><p><b>A is incorrect.<\/b> ETFs are traded in both the primary and secondary markets. Investors typically buy and sell ETFs in the secondary market, like stocks, on exchanges.<\/p><p><b>B is incorrect.<\/b> ETFs can be shorted just like individual stocks, allowing investors to bet against the price of the ETF.<\/p><p class=\"los\">Portfolio Management, Learning Module 1: Exchange-Traded Funds: Mechanics and Applications, LOS 1(b): Describe how ETFs are traded in secondary markets<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 37–40 · Sven Ragnarson<\/summary><div class=\"vig-body\"><p>Sven Ragnarson is a portfolio manager for a pension fund. Ragnarson has a meeting with Barney<\/p><p>Nelson, a trainee at the fund, to brief him on the fund’s holdings. Nelson asks the portfolio<\/p><p>manager why they do not have any exchange-traded funds in the fund. Nelson goes ahead and<\/p><p>shares a few mechanics of exchange-traded funds.<\/p><p>Statement 1: ETFs are only traded in the primary markets.<\/p><p>Statement 2: ETF shares cannot be shorted like equity stocks.<\/p><p>Statement 3: The authorized participants will incur security transaction costs for the ETF’s<\/p><p>portfolio during the ETF creation process.<\/p><p>Ragnarson and Nelson discuss factors that could influence ETF bid-ask spreads. Nelson<\/p><p>mentions that for a particular transaction, the bid-ask spread are:<\/p><p>1. The structure of the market and liquidity of the underlying securities held. 2. The amount of competition among ETF market makers. 3. Negatively correlated to the ongoing ETF order flow amount.<\/p><p>Ragnarson notes that ETF A is trading at an ETF price of $16, and the NAV per share at the end<\/p><p>of the day is $18. Ragnarson asks Nelson to evaluate three potential ETF investments. He<\/p><p>cautions Nelson that each ETF has a different portfolio characteristic with varying tracking<\/p><p>errors. Exhibit 1 presents a summary of the ETF characteristics.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0049.webp\" style=\"max-width:min(100%,682px)\" alt=\"Exhibit 1: ETFs Tracking Error ETF G ETF C ETF X Involved in Securities Lending No Yes Yes Portfolio Construction Approach Full Representative Full Replication Sampling Replication Type of Foreign Holding American American Local Depository Depository Shares Receipts Receipts\"><\/div><\/details><div class=\"qtext\"><p>Nelson is most likely correct regarding:<\/p><\/div>", "subj": "portfolio"}, {"n": 38, "q": "ETF 1’s End-of-day ETF premium/discount is closest to:", "opts": ["-11.11%", "11.12%", "12%"], "ans": "A", "expl": "B and C is incorrect. This value comes from the formula for premium or discount, but the incorrect sign might have been used. In this case, if the ETF price is lower than the NAV, it's a discount, not a premium.", "explhtml": "<img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0050.webp\" style=\"max-width:min(100%,550px)\" alt=\"ETF price −NAV per Share End-of-day ETF premium or Discount = NAV per Share 16 −18 End-of-day ETF premium or Discount = = −0.1111 = −11.11% 18\"><p><b>B and C is incorrect.<\/b> This value comes from the formula for premium or discount, but the incorrect sign might have been used. In this case, if the ETF price is lower than the NAV, it&#x27;s a discount, not a premium.<\/p><p class=\"los\">Portfolio Management, Learning Module 1: Exchange-Traded Funds: Mechanics and Applications, LOS 1(e): Describe sources of ETF premiums and discounts to NAV<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 37–40 · Sven Ragnarson<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sven Ragnarson is a portfolio manager for a pension fund. Ragnarson has a meeting with Barney<\/p><p>Nelson, a trainee at the fund, to brief him on the fund’s holdings. Nelson asks the portfolio<\/p><p>manager why they do not have any exchange-traded funds in the fund. Nelson goes ahead and<\/p><p>shares a few mechanics of exchange-traded funds.<\/p><p>Statement 1: ETFs are only traded in the primary markets.<\/p><p>Statement 2: ETF shares cannot be shorted like equity stocks.<\/p><p>Statement 3: The authorized participants will incur security transaction costs for the ETF’s<\/p><p>portfolio during the ETF creation process.<\/p><p>Ragnarson and Nelson discuss factors that could influence ETF bid-ask spreads. Nelson<\/p><p>mentions that for a particular transaction, the bid-ask spread are:<\/p><p>1. The structure of the market and liquidity of the underlying securities held. 2. The amount of competition among ETF market makers. 3. Negatively correlated to the ongoing ETF order flow amount.<\/p><p>Ragnarson notes that ETF A is trading at an ETF price of $16, and the NAV per share at the end<\/p><p>of the day is $18. Ragnarson asks Nelson to evaluate three potential ETF investments. He<\/p><p>cautions Nelson that each ETF has a different portfolio characteristic with varying tracking<\/p><p>errors. Exhibit 1 presents a summary of the ETF characteristics.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0049.webp\" style=\"max-width:min(100%,682px)\" alt=\"Exhibit 1: ETFs Tracking Error ETF G ETF C ETF X Involved in Securities Lending No Yes Yes Portfolio Construction Approach Full Representative Full Replication Sampling Replication Type of Foreign Holding American American Local Depository Depository Shares Receipts Receipts\"><\/div><\/details><div class=\"qtext\"><p>ETF 1’s End-of-day ETF premium/discount is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 39, "q": "With the current price of $16 for ETF A, which transaction is least likely to occur is:", "opts": ["The authorized participants will receive redemption baskets from the ETF sponsor.", "The retail investors will purchase and sell ETF shares.", "The authorized participant will create new ETF shares."], "ans": "C", "expl": "The share price is trading at a discount to its end of day NAV and arbitrage cost are high, thus APs will not take advantage of the arbitrage as this will result in a loss. If it was a premium to the end of day NAV the APs would purchase the creation basket and exchange it with the ETF sponsor for a creation unit. A is incorrect. This process typically occurs when there’s a discount, as the authorized participants (APs) may redeem shares for underlying securities. Since the ETF is trading at a discount, this scenario is plausible. B is incorrect. Retail investors frequently buy and sell ETFs regardless of the price being at a premium or discount, making this option likely.", "explhtml": "<p>The share price is trading at a discount to its end of day NAV and arbitrage cost are high, thus APs will not take advantage of the arbitrage as this will result in a loss. If it was a premium to the end of day NAV the APs would purchase the creation basket and exchange it with the ETF sponsor for a creation unit.<\/p><p><b>A is incorrect.<\/b> This process typically occurs when there’s a discount, as the authorized participants (APs) may redeem shares for underlying securities. Since the ETF is trading at a discount, this scenario is plausible.<\/p><p><b>B is incorrect.<\/b> Retail investors frequently buy and sell ETFs regardless of the price being at a premium or discount, making this option likely.<\/p><p class=\"los\">Portfolio Management, Learning Module 1: Exchange-Traded Funds: Mechanics and Applications, LOS 1(e): Describe sources of ETF premiums and discounts to NAV<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 37–40 · Sven Ragnarson<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sven Ragnarson is a portfolio manager for a pension fund. Ragnarson has a meeting with Barney<\/p><p>Nelson, a trainee at the fund, to brief him on the fund’s holdings. Nelson asks the portfolio<\/p><p>manager why they do not have any exchange-traded funds in the fund. Nelson goes ahead and<\/p><p>shares a few mechanics of exchange-traded funds.<\/p><p>Statement 1: ETFs are only traded in the primary markets.<\/p><p>Statement 2: ETF shares cannot be shorted like equity stocks.<\/p><p>Statement 3: The authorized participants will incur security transaction costs for the ETF’s<\/p><p>portfolio during the ETF creation process.<\/p><p>Ragnarson and Nelson discuss factors that could influence ETF bid-ask spreads. Nelson<\/p><p>mentions that for a particular transaction, the bid-ask spread are:<\/p><p>1. The structure of the market and liquidity of the underlying securities held. 2. The amount of competition among ETF market makers. 3. Negatively correlated to the ongoing ETF order flow amount.<\/p><p>Ragnarson notes that ETF A is trading at an ETF price of $16, and the NAV per share at the end<\/p><p>of the day is $18. Ragnarson asks Nelson to evaluate three potential ETF investments. He<\/p><p>cautions Nelson that each ETF has a different portfolio characteristic with varying tracking<\/p><p>errors. Exhibit 1 presents a summary of the ETF characteristics.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0049.webp\" style=\"max-width:min(100%,682px)\" alt=\"Exhibit 1: ETFs Tracking Error ETF G ETF C ETF X Involved in Securities Lending No Yes Yes Portfolio Construction Approach Full Representative Full Replication Sampling Replication Type of Foreign Holding American American Local Depository Depository Shares Receipts Receipts\"><\/div><\/details><div class=\"qtext\"><p>With the current price of $16 for ETF A, which transaction is least likely to occur is:<\/p><\/div>", "subj": "portfolio"}, {"n": 40, "q": "Based on Exhibit 1, the ETF that is likely to have the lowest tracking error?", "opts": ["ETF G", "ETF C", "ETF X"], "ans": "C", "expl": "Compared to full replication, ETFs using representative sampling/optimization often have higher tracking errors due to trading hour differences and ADR discrepancies. These ETFs earn fees and interest from securities lending, which can reduce tracking error if income is less than expenses. ETF X, using full replication and local shares, likely has the lowest tracking error. A is incorrect. ETF C is expected to have higher tracking error than ETF X due to its representative sampling approach and investment in depositary receipts instead of local shares. B is incorrect. ETF G is likely to have higher tracking error than ETF X because it also invests in depositary receipts and does not participate in securities lending.", "explhtml": "<p>Compared to full replication, ETFs using representative sampling/optimization often have higher tracking errors due to trading hour differences and ADR discrepancies. These ETFs earn fees and interest from securities lending, which can reduce tracking error if income is less than expenses. ETF X, using full replication and local shares, likely has the lowest tracking error.<\/p><p><b>A is incorrect.<\/b> ETF C is expected to have higher tracking error than ETF X due to its representative sampling approach and investment in depositary receipts instead of local shares.<\/p><p><b>B is incorrect.<\/b> ETF G is likely to have higher tracking error than ETF X because it also invests in depositary receipts and does not participate in securities lending.<\/p><p class=\"los\">Portfolio Management, Learning Module 1: Exchange-Traded Funds: Mechanics and Applications, LOS 1(c): Describe sources of tracking error for ETFs<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 37–40 · Sven Ragnarson<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sven Ragnarson is a portfolio manager for a pension fund. Ragnarson has a meeting with Barney<\/p><p>Nelson, a trainee at the fund, to brief him on the fund’s holdings. Nelson asks the portfolio<\/p><p>manager why they do not have any exchange-traded funds in the fund. Nelson goes ahead and<\/p><p>shares a few mechanics of exchange-traded funds.<\/p><p>Statement 1: ETFs are only traded in the primary markets.<\/p><p>Statement 2: ETF shares cannot be shorted like equity stocks.<\/p><p>Statement 3: The authorized participants will incur security transaction costs for the ETF’s<\/p><p>portfolio during the ETF creation process.<\/p><p>Ragnarson and Nelson discuss factors that could influence ETF bid-ask spreads. Nelson<\/p><p>mentions that for a particular transaction, the bid-ask spread are:<\/p><p>1. The structure of the market and liquidity of the underlying securities held. 2. The amount of competition among ETF market makers. 3. Negatively correlated to the ongoing ETF order flow amount.<\/p><p>Ragnarson notes that ETF A is trading at an ETF price of $16, and the NAV per share at the end<\/p><p>of the day is $18. Ragnarson asks Nelson to evaluate three potential ETF investments. He<\/p><p>cautions Nelson that each ETF has a different portfolio characteristic with varying tracking<\/p><p>errors. Exhibit 1 presents a summary of the ETF characteristics.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0049.webp\" style=\"max-width:min(100%,682px)\" alt=\"Exhibit 1: ETFs Tracking Error ETF G ETF C ETF X Involved in Securities Lending No Yes Yes Portfolio Construction Approach Full Representative Full Replication Sampling Replication Type of Foreign Holding American American Local Depository Depository Shares Receipts Receipts\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the ETF that is likely to have the lowest tracking error?<\/p><\/div>", "subj": "portfolio"}, {"n": 41, "q": "Which of the following is least likely an assumption of APT that Nguyen uses to manage risks and evaluate strategies?", "opts": ["Asset returns are linearly related to multiple macroeconomic factors.", "Each asset has different sensitivities (betas) to various risk factors.", "Arbitrage opportunities exist among well-diversified portfolios."], "ans": "C", "expl": "Under the Arbitrage Pricing Theory (APT), arbitrage opportunities should not exist in equilibrium for well-diversified portfolios. If they do, market forces would correct them, making the opportunity vanish. A is incorrect. APT assumes that asset returns are linearly related to multiple macroeconomic factors. B is incorrect. APT assumes that different assets have different sensitivities (betas) to these risk factors, which drive their returns.", "explhtml": "<p>Under the <b>Arbitrage Pricing Theory (APT)<\/b>, arbitrage opportunities should not exist in equilibrium for well-diversified portfolios. If they do, market forces would correct them, making the opportunity vanish.<\/p><p><b>A is incorrect.<\/b> APT assumes that asset returns are linearly related to multiple macroeconomic factors.<\/p><p><b>B is incorrect.<\/b> APT assumes that different assets have different sensitivities (betas) to these risk factors, which drive their returns.<\/p><p class=\"los\">Portfolio Management, Learning Module 2: Using Multifactor Models, LOS 2(a): Describe arbitrage pricing theory (APT), including its underlying assumptions and its relation to multifactor models<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 41–44 · David Castellano<\/summary><div class=\"vig-body\"><p>David Castellano is a finance manager at Fibonacci Investments LTD. Fibonacci Investments LTD<\/p><p>is a manager-for-manager that uses quantitative models in its portfolio management. Castellano<\/p><p>is looking to construct a portfolio using some funds from the firm that other portfolio managers<\/p><p>manage. To manage the risks and evaluate strategies, Castellano uses the arbitrage pricing<\/p><p>theory (APT).<\/p><p>Castillano asks Christina Nguyen, an associate at the firm, to analyze three funds that will be<\/p><p>part of the portfolio. Nguyen presented the results of the analysis here in Exhibit 1.<\/p><p><b>Exhibit 1: Factor Sensitivities and Expected Returns (One Factor Model)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0051.webp\" style=\"max-width:min(100%,358px)\" alt=\"Fund Factor Sensitivity Expected Return X 0.6 0.03 Y 0.8 0.02 Z 1.4 0.04\"><p>Nguyen estimates the three funds’ sensitivity to GDP growth and inflation using a two-factor<\/p><p>model. Nguyen assumes the error terms have a zero value when working with the two-factor<\/p><p>model. The results are presented in Exhibit 2 below.<\/p><p><b>Exhibit 2: Factor Sensitivities and Expected Return (Two-Factor Model)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0052.webp\" style=\"max-width:min(100%,404px)\" alt=\"Factor Sensitivity Fund GDP Growth Inflation Expected Return X 1.1 0.7 0.03 Y 1.3 1.1 0.02 Z 0.1 1.8 0.04\"><p>Nguyen then calculates the return of Portfolio XZ, whose allocation includes 45% of Fund X and<\/p><p>55% of Fund Z. She incorporates the GDP and inflation surprises shown in Exhibit 3 below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0053.webp\" style=\"max-width:min(100%,623px)\" alt=\"Exhibit 3: Selected Factor Data Factor Research Department Forecast Actual Value GDP Growth 1.4% 0.95% Inflation 2.2% 2.4%\"><\/div><\/details><div class=\"qtext\"><p>Which of the following is least likely an assumption of APT that Nguyen uses to manage risks and evaluate strategies?<\/p><\/div>", "subj": "portfolio"}, {"n": 42, "q": "Which of the following surprises had the least effect on fund returns?", "opts": ["GDP Growth on Fund X", "Inflation on Fund Z", "Inflation on Fund Y"], "ans": "C", "expl": "The effect of inflation surprise on Fund Y had the most negligible effect on fund returns at 0.22%. A and B are incorrect. The effect of inflation surprise on Fund Y had the most negligible effect on fund returns at 0.22%.", "explhtml": "<img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0054.webp\" style=\"max-width:min(100%,457px)\" alt=\"Portfolio Return Change Due to Surprise In: Fund GDP Growth Inflation Fund X 1.1 × −0.45% = −0.495% 0.7 × 0.2% = 0.14% Fund Y 1.3 × −0.45% = −0.585% 1.1 × 0.2% = 0.22% Fund Z 0.1 × −0.45% = −0.045% 1.8 × 0.2% = 0.36%\"><p>The effect of inflation surprise on Fund Y had the most negligible effect on fund returns at 0.22%.<\/p><p><b>A and B are incorrect.<\/b> The effect of inflation surprise on Fund Y had the most negligible effect on fund returns at 0.22%.<\/p><p class=\"los\">Portfolio Management, Learning Module 2: Using Multifactor Models, LOS 2(c): Calculate the expected return on an asset given an asset’s factor sensitivities and the factor risk premiums<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 41–44 · David Castellano<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>David Castellano is a finance manager at Fibonacci Investments LTD. Fibonacci Investments LTD<\/p><p>is a manager-for-manager that uses quantitative models in its portfolio management. Castellano<\/p><p>is looking to construct a portfolio using some funds from the firm that other portfolio managers<\/p><p>manage. To manage the risks and evaluate strategies, Castellano uses the arbitrage pricing<\/p><p>theory (APT).<\/p><p>Castillano asks Christina Nguyen, an associate at the firm, to analyze three funds that will be<\/p><p>part of the portfolio. Nguyen presented the results of the analysis here in Exhibit 1.<\/p><p><b>Exhibit 1: Factor Sensitivities and Expected Returns (One Factor Model)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0051.webp\" style=\"max-width:min(100%,358px)\" alt=\"Fund Factor Sensitivity Expected Return X 0.6 0.03 Y 0.8 0.02 Z 1.4 0.04\"><p>Nguyen estimates the three funds’ sensitivity to GDP growth and inflation using a two-factor<\/p><p>model. Nguyen assumes the error terms have a zero value when working with the two-factor<\/p><p>model. The results are presented in Exhibit 2 below.<\/p><p><b>Exhibit 2: Factor Sensitivities and Expected Return (Two-Factor Model)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0052.webp\" style=\"max-width:min(100%,404px)\" alt=\"Factor Sensitivity Fund GDP Growth Inflation Expected Return X 1.1 0.7 0.03 Y 1.3 1.1 0.02 Z 0.1 1.8 0.04\"><p>Nguyen then calculates the return of Portfolio XZ, whose allocation includes 45% of Fund X and<\/p><p>55% of Fund Z. She incorporates the GDP and inflation surprises shown in Exhibit 3 below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0053.webp\" style=\"max-width:min(100%,623px)\" alt=\"Exhibit 3: Selected Factor Data Factor Research Department Forecast Actual Value GDP Growth 1.4% 0.95% Inflation 2.2% 2.4%\"><\/div><\/details><div class=\"qtext\"><p>Which of the following surprises had the least effect on fund returns?<\/p><\/div>", "subj": "portfolio"}, {"n": 43, "q": "Based on Exhibit 2,3 and the surprises in GDP Growth and inflation, the return for Portfolio XZ is closest to?", "opts": ["3.55%", "2.0%", "-0.45%"], "ans": "A", "expl": "Where ai= Expected return on asset i. FINF= Surprise in inflation FGDP=Surprise in GDP growth Using data provided in Exhibit 2, we get: The surprise in GDP Growth = 0.95% − 1.4% = −0.45% The surprise in Inflation = 2.4% − 2.2% = 0.2% Portfolio XZ comprises a 45% allocation to Fund X and 55% to Fund Z. B is incorrect. This is the surprise in Inflation. C is incorrect. This is the surprise in GDP Growth.", "explhtml": "<img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0055.webp\" style=\"max-width:min(100%,232px)\" alt=\"Ri = ai + bilFINF + bilFGDP + εi\"><p>Where<\/p><p>a<sub>i<\/sub>= Expected return on asset i.<\/p><p>F<sub>INF<\/sub>= Surprise in inflation<\/p><p>F<sub>GDP<\/sub>=Surprise in GDP growth<\/p><p>Using data provided in Exhibit 2, we get:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0056.webp\" style=\"max-width:min(100%,271px)\" alt=\"RX = 0.03 + 0.7FINF + 1.1FGDP + εi RZ = 0.04 + 1.8FINF + 0.1FGDP + εi\"><p>The surprise in GDP Growth = 0.95% − 1.4% = −0.45%<\/p><p>The surprise in Inflation = 2.4% − 2.2% = 0.2%<\/p><p>Portfolio XZ comprises a 45% allocation to Fund X and 55% to Fund Z.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0057.webp\" style=\"max-width:min(100%,527px)\" alt=\"RXZ = (0.45)(0.03) + (0.55)(0.04) + [(0.45)(0.7) + (0.55)(1.8)](0.002) + [(0.45)(1.1) + (0.55)(0.1)](−0.0045) + 0.45(0) + 0.55(0) RXZ = 0.0356 = 3.55%\"><p><b>B is incorrect.<\/b> This is the surprise in Inflation.<\/p><p><b>C is incorrect.<\/b> This is the surprise in GDP Growth.<\/p><p class=\"los\">Portfolio Management, Learning Module 2: Using Multifactor Models, LOS 2(c): Calculate the expected return on an asset given an asset’s factor sensitivities and the factor risk premiums<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 41–44 · David Castellano<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>David Castellano is a finance manager at Fibonacci Investments LTD. Fibonacci Investments LTD<\/p><p>is a manager-for-manager that uses quantitative models in its portfolio management. Castellano<\/p><p>is looking to construct a portfolio using some funds from the firm that other portfolio managers<\/p><p>manage. To manage the risks and evaluate strategies, Castellano uses the arbitrage pricing<\/p><p>theory (APT).<\/p><p>Castillano asks Christina Nguyen, an associate at the firm, to analyze three funds that will be<\/p><p>part of the portfolio. Nguyen presented the results of the analysis here in Exhibit 1.<\/p><p><b>Exhibit 1: Factor Sensitivities and Expected Returns (One Factor Model)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0051.webp\" style=\"max-width:min(100%,358px)\" alt=\"Fund Factor Sensitivity Expected Return X 0.6 0.03 Y 0.8 0.02 Z 1.4 0.04\"><p>Nguyen estimates the three funds’ sensitivity to GDP growth and inflation using a two-factor<\/p><p>model. Nguyen assumes the error terms have a zero value when working with the two-factor<\/p><p>model. The results are presented in Exhibit 2 below.<\/p><p><b>Exhibit 2: Factor Sensitivities and Expected Return (Two-Factor Model)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0052.webp\" style=\"max-width:min(100%,404px)\" alt=\"Factor Sensitivity Fund GDP Growth Inflation Expected Return X 1.1 0.7 0.03 Y 1.3 1.1 0.02 Z 0.1 1.8 0.04\"><p>Nguyen then calculates the return of Portfolio XZ, whose allocation includes 45% of Fund X and<\/p><p>55% of Fund Z. She incorporates the GDP and inflation surprises shown in Exhibit 3 below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0053.webp\" style=\"max-width:min(100%,623px)\" alt=\"Exhibit 3: Selected Factor Data Factor Research Department Forecast Actual Value GDP Growth 1.4% 0.95% Inflation 2.2% 2.4%\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2,3 and the surprises in GDP Growth and inflation, the return for Portfolio XZ is closest to?<\/p><\/div>", "subj": "portfolio"}, {"n": 44, "q": "Using Exhibits 2 and 3, which fund is most sensitive to the combined surprise of GDP Growth and Inflation?", "opts": ["Fund X", "Fund Y", "Fund Z"], "ans": "B", "expl": "Combined effects Fund X: −0.495% + 0.14% = −0.355% Fund Y: −0.585% + 0.22% = −0.365% Fund Z: −0.045% + 0.36% = 0.315% A and C are incorrect. The most sensitive to surprises in GDP growth and Inflation is Fund Y.", "explhtml": "<img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0058.webp\" style=\"max-width:min(100%,457px)\" alt=\"Portfolio Return Change due to Surprise In: Fund GDP Growth Inflation Fund X 1.1 × −0.45% = −0.495% 0.7 × 0.2% = 0.14% Fund Y 1.3 × −0.45% = −0.585% 1.1 × 0.2% = 0.22% Fund Z 0.1 × −0.45% = −0.045% 1.8x0.2% = 0.36%\"><p>Combined effects<\/p><p>Fund X: −0.495% + 0.14% = −0.355%<\/p><p>Fund Y: −0.585% + 0.22% = −0.365%<\/p><p>Fund Z: −0.045% + 0.36% = 0.315%<\/p><p><b>A and C are incorrect.<\/b> The most sensitive to surprises in GDP growth and Inflation is Fund Y.<\/p><p class=\"los\">Portfolio Management, Learning Module 2: Using Multifactor Models, LOS 2(c): Calculate the expected return on an asset given an asset’s factor sensitivities and the factor risk premiums<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 41–44 · David Castellano<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>David Castellano is a finance manager at Fibonacci Investments LTD. Fibonacci Investments LTD<\/p><p>is a manager-for-manager that uses quantitative models in its portfolio management. Castellano<\/p><p>is looking to construct a portfolio using some funds from the firm that other portfolio managers<\/p><p>manage. To manage the risks and evaluate strategies, Castellano uses the arbitrage pricing<\/p><p>theory (APT).<\/p><p>Castillano asks Christina Nguyen, an associate at the firm, to analyze three funds that will be<\/p><p>part of the portfolio. Nguyen presented the results of the analysis here in Exhibit 1.<\/p><p><b>Exhibit 1: Factor Sensitivities and Expected Returns (One Factor Model)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0051.webp\" style=\"max-width:min(100%,358px)\" alt=\"Fund Factor Sensitivity Expected Return X 0.6 0.03 Y 0.8 0.02 Z 1.4 0.04\"><p>Nguyen estimates the three funds’ sensitivity to GDP growth and inflation using a two-factor<\/p><p>model. Nguyen assumes the error terms have a zero value when working with the two-factor<\/p><p>model. The results are presented in Exhibit 2 below.<\/p><p><b>Exhibit 2: Factor Sensitivities and Expected Return (Two-Factor Model)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0052.webp\" style=\"max-width:min(100%,404px)\" alt=\"Factor Sensitivity Fund GDP Growth Inflation Expected Return X 1.1 0.7 0.03 Y 1.3 1.1 0.02 Z 0.1 1.8 0.04\"><p>Nguyen then calculates the return of Portfolio XZ, whose allocation includes 45% of Fund X and<\/p><p>55% of Fund Z. She incorporates the GDP and inflation surprises shown in Exhibit 3 below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0053.webp\" style=\"max-width:min(100%,623px)\" alt=\"Exhibit 3: Selected Factor Data Factor Research Department Forecast Actual Value GDP Growth 1.4% 0.95% Inflation 2.2% 2.4%\"><\/div><\/details><div class=\"qtext\"><p>Using Exhibits 2 and 3, which fund is most sensitive to the combined surprise of GDP Growth and Inflation?<\/p><\/div>", "subj": "portfolio"}, {"n": 45, "q": "Using the information from Exhibit 1, the expected return for portfolio B is closest to:", "opts": ["2.76%", "4.33%", "3.30%"], "ans": "C", "expl": "The intercept coefficient is the expected return when using a macroeconomic factor model. The intercept for portfolio B is 3.30%. Thus, the expected return is 3.30%. A is incorrect. This is the expected return for Portfolio C. B is incorrect. This is the expected return for Portfolio A.", "explhtml": "<p>The intercept coefficient is the expected return when using a macroeconomic factor model. The intercept for portfolio B is 3.30%. Thus, the expected return is 3.30%.<\/p><p><b>A is incorrect.<\/b> This is the expected return for Portfolio C.<\/p><p><b>B is incorrect.<\/b> This is the expected return for Portfolio A.<\/p><p class=\"los\">Portfolio Management, Learning Module 2: Using Multifactor Models, LOS 2(c): Calculate the expected return on an asset given an asset’s factor sensitivities and the factor risk premiums<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 45–48 · Susan Meng<\/summary><div class=\"vig-body\"><p>Susan Meng is a portfolio manager at the Great Walls Fund. Meng works closely with Anne May,<\/p><p>CFA, an associate at the firm. Meng asked May to consider a fundamental factor model in place<\/p><p>of the macroeconomic factor model that the Fund currently uses. The four-factor macroeconomic<\/p><p>model:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0059.webp\" style=\"max-width:min(100%,400px)\" alt=\"Ri = ai + bi1FGDP + bi2FINF + bi3FCAP + bi4FUNEM + εi\"><p>Where:<\/p><p>F<sub>GDP<\/sub>= Gross Domestic Product<\/p><p>F<sub>INF<\/sub>= Inflation<\/p><p>F<sub>CAP<\/sub>= Manufacturing Capacity Utilization<\/p><p>F<sub>UNEM<\/sub>= Unemployment Rate<\/p><p>In her review, May assumes the error term when using the model is zero. She also uses inputs<\/p><p>and estimates from historical monthly returns dating 5 years, as presented in Exhibit 1.<\/p><p><b>Exhibit 1: Estimates From and Inputs for The Current Macroeconomic Model<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0060.webp\" style=\"max-width:min(100%,680px)\" alt=\"Intercept Coefficients and Factor Sensitivities Factor Benchmark Factor Portfolio A Portfolio B Portfolio C Surprise (%) Intercept (%) 4.33 3.30 2.76 FGDP 0.6 0.82 0.82 0.00 0.34 FINF −1.02 0.6 −0.32 1.01 −1.67 FCAP 1.20 3.1 1.32 0.00 0.6 FUNEM −0.32 1.6 −0.16 0.00 −0.06 Most Recent Year Annual Retu\"><p>May also calculates the mean active return and tracking error using the macroeconomic model.<\/p><p>The results are calculated in Exhibit 2.<\/p><p><b>Exhibit 2: Macroeconomic Factor Model Mean Active Return and Tracking Error<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0061.webp\" style=\"max-width:min(100%,406px)\" alt=\"Portfolio Mean Active Return Tracking Error Portfolio A 2.6% 1.80% Portfolio B −0.6% 1.42% Portfolio C 0.62% 1.08%\"><p>May constructs a fundamental factor model with four factors:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0062.webp\" style=\"max-width:min(100%,385px)\" alt=\"Ri = ai + bi1FLEV + bi2FLIQ + bi3FVAR + bi4FEGR + εi\"><p>Where,<\/p><p>F<sub>LEV<\/sub>= Financial leverage<\/p><p>F<sub>LIQ<\/sub>= Liquidity<\/p><p>F<sub>VAR<\/sub>= Revenue Variability<\/p><p>F<sub>EGR<\/sub>= Earnings Growth<\/p><p>During lunch, Meng and May discussed the advantages and disadvantages of fundamental,<\/p><p>macroeconomic, and statistical factor models. May mentions the following to Meng, “An edge<\/p><p>that statistical factor models have over macroeconomic and fundamental ones is their<\/p><p>adaptability. Statistical models can quickly adjust to changes in data patterns without being tied<\/p><p>to specific economic theories or fundamental principles. This flexibility allows for more timely<\/p><p>and relevant insights, especially in rapidly changing market conditions.”<\/p><\/div><\/details><div class=\"qtext\"><p>Using the information from Exhibit 1, the expected return for portfolio B is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 46, "q": "Surprises most likely explain the active risk for Portfolio B in: ( Use Exhibit 1)", "opts": ["All four factors", "Inflation", "Unemployment"], "ans": "A", "expl": "Active risk, also known as tracking risk or tracking error, refers to the sample standard deviation of the time series of active returns. These active returns are the differences between the portfolio and benchmark returns. For Portfolio B, while Inflation is the only non-zero sensitivity, its contribution to the portfolio’s active return is determined by the sum of the differences between the portfolio’s and the benchmark’s sensitivities, multiplied by the factor return. Since all four-factor sensitivities of Portfolio B differ from those of the benchmark, each factor contributes to the portfolio’s active risk and return. B and C are incorrect. All four factors contribute to both the portfolio’s active risk and return.", "explhtml": "<p>Active risk, also known as tracking risk or tracking error, refers to the sample standard deviation of the time series of active returns. These active returns are the differences between the portfolio and benchmark returns. For Portfolio B, while Inflation is the only non-zero sensitivity, its contribution to the portfolio’s active return is determined by the sum of the differences between the portfolio’s and the benchmark’s sensitivities, multiplied by the factor return. Since all four-factor sensitivities of Portfolio B differ from those of the benchmark, each factor contributes to the portfolio’s active risk and return.<\/p><p><b>B and C are incorrect.<\/b> All four factors contribute to both the portfolio’s active risk and return.<\/p><p class=\"los\">Portfolio Management, Learning Module 2: Using Multifactor Models, LOS 2(c): Calculate the expected return on an asset given an asset’s factor sensitivities and the factor risk premiums<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 45–48 · Susan Meng<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Susan Meng is a portfolio manager at the Great Walls Fund. Meng works closely with Anne May,<\/p><p>CFA, an associate at the firm. Meng asked May to consider a fundamental factor model in place<\/p><p>of the macroeconomic factor model that the Fund currently uses. The four-factor macroeconomic<\/p><p>model:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0059.webp\" style=\"max-width:min(100%,400px)\" alt=\"Ri = ai + bi1FGDP + bi2FINF + bi3FCAP + bi4FUNEM + εi\"><p>Where:<\/p><p>F<sub>GDP<\/sub>= G
