its negative discount for risk (-0.034). This negative value implies: Bond C has positive covariance with the marginal utility of consumption (high when consumption is scarce). It pays more in bad times (e.g., recessions) and less in good times, acting as an \"insurance\" asset. While this hedge might seem beneficial, investors facing shrinking labor income already bear high exposure to economic risk. Bond C forces them to overpay for insurance (via its negative risk premium), reducing long-term returns without addressing their core need: assets that generate supplemental income outside downturns.Bonds with positive risk premiums (A/B) offer higher yields to compensate for underperformance in bad times. This aligns better with investors needing income growth to offset future labor income declines. A is incorrect. Bond issue B is the most suitable choice for investors expecting a decrease in their future labor income due to poor economic conditions. This bond has a higher discount for risk at 0.061, indicating a higher risk premium. In economic downturns, when investors expect their income to shrink, they are likely to be more risk-averse. Bond B, with its higher risk premium, compensates for this increased risk aversion by offering potentially higher returns to offset the increased risk. This makes it more attractive compared to bonds with lower or negative risk premiums, as it provides a cushion against the expected decrease in income. C is incorrect. Bond issue D, with a discount for risk of 0.000, indicates no additional risk premium over the risk-free rate. For investors anticipating a reduction in their future income, this bond does not offer any additional compensation for taking on more risk. In uncertain economic times, investors typically look for securities that can offer higher returns to compensate for increased risks, which Bond D fails to provide, making it a less favorable option compared to Bond B. ", "explhtml": "<p>Bond C is the least suitable for investors anticipating reduced labor income during economic downturns due to its negative discount for risk (-0.034). This negative value implies:<\/p><p>Bond C has positive covariance with the marginal utility of consumption (high when consumption is scarce). It pays more in bad times (e.g., recessions) and less in good times, acting as an &quot;insurance&quot; asset.<\/p><p>While this hedge might seem beneficial, investors facing shrinking labor income already bear high exposure to economic risk. Bond C forces them to overpay for insurance (via its negative risk premium), reducing long-term returns without addressing their core need: assets that generate supplemental income outside downturns.Bonds with positive risk premiums (A/B) offer higher yields to compensate for underperformance in bad times. This aligns better with investors needing income growth to offset future labor income declines.<\/p><p><b>A is incorrect<\/b>. Bond issue B is the most suitable choice for investors expecting a decrease in their future labor income due to poor economic conditions. This bond has a higher discount for risk at 0.061, indicating a higher risk premium. In economic downturns, when investors expect their income to shrink, they are likely to be more risk-averse. Bond B, with its higher risk premium, compensates for this increased risk aversion by offering potentially higher returns to offset the increased risk. This makes it more attractive compared to bonds with lower or negative risk premiums, as it provides a cushion against the expected decrease in income.<\/p><p><b>C is incorrect<\/b>. Bond issue D, with a discount for risk of 0.000, indicates no additional risk premium over the risk-free rate. For investors anticipating a reduction in their future income, this bond does not offer any additional compensation for taking on more risk. In uncertain economic times, investors typically look for securities that can offer higher returns to compensate for increased risks, which Bond D fails to provide, making it a less favorable option compared to Bond B. <\/p><p class=\"los\">Portfolio Management, Learning Module 5: Economic And Investment Markets, LOS 5(a): Explain the notion that to affect market values, economic factors must affect one or more of the following: 1) default-free interest rates across maturities, 2) the timing and/or magnitude of expected cash flows, and 3) risk premiums<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Dave Gilbert<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dave Gilbert is a portfolio manager and economic analyst at Western Alliance, a wealth management firm operating in Regine, a country with an emerging market. In an effort to diversify his clients’ holdings, Gilbert has decided to allocate fixed-income securities to their portfolios. He decides to consider risky corporate bonds as potential asset classes and identifies four bond issues, each with a different maturity (Exhibit 1). Prior to allocation, Gilbert decomposes the value of each issue into two components: the risk-neutral present value and the discount for risk. The latter represents the covariance between the inter-temporal rate of substitution and the future price of the investment one year from today.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0015.webp\" style=\"max-width:min(100%,440px)\" alt=\"Exhibit: Potential Bond Issues for Client Portfolios\"><p>Bond Issue Risk Neutral Present Value* Discount for Risk*<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0016.webp\" style=\"max-width:min(100%,425px)\" alt=\"A 0.8943 0.045 B 0.9021 0.061 C 0.7654 -0.034 D 0.8993 0.000\"><p>*Per $1 of Par Value<\/p><p>After collecting the data in the exhibit, Gilbert aims to address the following questions:<\/p><p>Question 1: Which bond issue carries a positive risk premium?<\/p><p>Question 2: Which bond issue can be classified as a one-period default-free bond?<\/p><p>Question 3: Which bond issue will be least suitable for those investors who expect their labor income to shrink in the future due to poor economic conditions?<\/p><p>After making the allocations, Gilbert proceeds to explore the relationship between the real GDP growth and the real default-free interest rate in Regine’s economy. In the current year, Regine’s stocks have been included in a global emerging market index following significant technological progress. In a few years, the country’s economic growth is expected to converge with its steady-state projected growth. The current real GDP growth rate exceeds that observed in developed markets such as the U.S. and Japan.<\/p><p>Gilbert concludes his study by exploring the factors that help to explain the observed upward-sloping nominal yield curve. He believes the slope may indicate a preference for one bond maturity over the other.<\/p><\/div><\/details><div class=\"qtext\"><p>The most appropriate response to Question 3 is the bond issue:<\/p><\/div>", "subj": "portfolio"}, {"n": 12, "q": "Based on the real GDP growth information presented with respect to Regine’s economy, the analyst should most likely expect:", "opts": ["A negative relationship between real GDP growth and real default-free interest rates.", "Real default-free interest rates to be higher in Regine relative to developed economies.", "Real default-free interest rates to be lower in Regine relative to developed economies."], "ans": "B", "expl": "Given the context of Regine's economy, which is currently experiencing a higher real GDP growth rate compared to developed economies like the U.S. and Japan, it is reasonable to expect that real default-free interest rates would be higher in Regine. This expectation stems from the economic principle that higher economic growth rates often lead to higher interest rates. As Regine is still below its steady-state growth, it is likely to experience rapid economic expansion as it catches up. This rapid growth typically increases the demand for capital, pushing up interest rates. Additionally, higher economic growth often leads to higher inflation expectations, which central banks may counteract by raising interest rates to prevent the economy from overheating. A is incorrect. The statement that there is a negative relationship between real GDP growth and real default-free interest rates contradicts typical economic behavior. Generally, an increase in real GDP growth signifies an expanding economy, which increases demand for capital and leads to higher interest rates. Furthermore, higher GDP growth often raises expectations of future income, which can reduce the immediate need for saving; thus, it requires higher interest rates to incentivize saving. Therefore, a positive relationship between real GDP growth and real default-free interest rates is more commonly observed. C is incorrect. The suggestion that real default-free interest rates would be lower in Regine compared to developed economies overlooks the impact of rapid economic growth on interest rates. In emerging markets like Regine, which are experiencing significant economic expansion, the demand for capital is typically high to support growth initiatives, leading to higher interest rates. Additionally, emerging markets often have higher inflation rates compared to developed economies, which further contributes to higher nominal and real interest rates, thereby maintaining the purchasing power of money. ", "explhtml": "<p>Given the context of Regine&#x27;s economy, which is currently experiencing a higher real GDP growth rate compared to developed economies like the U.S. and Japan, it is reasonable to expect that real default-free interest rates would be higher in Regine. This expectation stems from the economic principle that higher economic growth rates often lead to higher interest rates. As Regine is still below its steady-state growth, it is likely to experience rapid economic expansion as it catches up. This rapid growth typically increases the demand for capital, pushing up interest rates. Additionally, higher economic growth often leads to higher inflation expectations, which central banks may counteract by raising interest rates to prevent the economy from overheating.<\/p><p><b>A is incorrect<\/b>. The statement that there is a negative relationship between real GDP growth and real default-free interest rates contradicts typical economic behavior. Generally, an increase in real GDP growth signifies an expanding economy, which increases demand for capital and leads to higher interest rates. Furthermore, higher GDP growth often raises expectations of future income, which can reduce the immediate need for saving; thus, it requires higher interest rates to incentivize saving. Therefore, a positive relationship between real GDP growth and real default-free interest rates is more commonly observed.<\/p><p><b>C is incorrect<\/b>. The suggestion that real default-free interest rates would be lower in Regine compared to developed economies overlooks the impact of rapid economic growth on interest rates. In emerging markets like Regine, which are experiencing significant economic expansion, the demand for capital is typically high to support growth initiatives, leading to higher interest rates. Additionally, emerging markets often have higher inflation rates compared to developed economies, which further contributes to higher nominal and real interest rates, thereby maintaining the purchasing power of money. <\/p><p class=\"los\">Portfolio Management, Learning Module 5: Economic And Investment Markets, LOS 5(c): Explain the relationship between the long-term growth rate of the economy, the volatility of the growth rate, and the average level of real short-term interest rates<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Dave Gilbert<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dave Gilbert is a portfolio manager and economic analyst at Western Alliance, a wealth management firm operating in Regine, a country with an emerging market. In an effort to diversify his clients’ holdings, Gilbert has decided to allocate fixed-income securities to their portfolios. He decides to consider risky corporate bonds as potential asset classes and identifies four bond issues, each with a different maturity (Exhibit 1). Prior to allocation, Gilbert decomposes the value of each issue into two components: the risk-neutral present value and the discount for risk. The latter represents the covariance between the inter-temporal rate of substitution and the future price of the investment one year from today.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0015.webp\" style=\"max-width:min(100%,440px)\" alt=\"Exhibit: Potential Bond Issues for Client Portfolios\"><p>Bond Issue Risk Neutral Present Value* Discount for Risk*<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0016.webp\" style=\"max-width:min(100%,425px)\" alt=\"A 0.8943 0.045 B 0.9021 0.061 C 0.7654 -0.034 D 0.8993 0.000\"><p>*Per $1 of Par Value<\/p><p>After collecting the data in the exhibit, Gilbert aims to address the following questions:<\/p><p>Question 1: Which bond issue carries a positive risk premium?<\/p><p>Question 2: Which bond issue can be classified as a one-period default-free bond?<\/p><p>Question 3: Which bond issue will be least suitable for those investors who expect their labor income to shrink in the future due to poor economic conditions?<\/p><p>After making the allocations, Gilbert proceeds to explore the relationship between the real GDP growth and the real default-free interest rate in Regine’s economy. In the current year, Regine’s stocks have been included in a global emerging market index following significant technological progress. In a few years, the country’s economic growth is expected to converge with its steady-state projected growth. The current real GDP growth rate exceeds that observed in developed markets such as the U.S. and Japan.<\/p><p>Gilbert concludes his study by exploring the factors that help to explain the observed upward-sloping nominal yield curve. He believes the slope may indicate a preference for one bond maturity over the other.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the real GDP growth information presented with respect to Regine’s economy, the analyst should most likely expect:<\/p><\/div>", "subj": "portfolio"}, {"n": 13, "q": "Using the data in Exhibit 1, Emerson will most likely conclude that an arbitrage opportunity:", "opts": ["Does not exist.", "Exists and a profit (per dollar) of $0.0428 can be earned.", "Exists and a profit (per dollar) of $0.0510 can be earned."], "ans": "B", "expl": "Based on the one-factor model equation provided, the expected returns for the portfolios can be calculated as follows: Comparing these calculated expected returns with the actual expected returns given in Exhibit 1, we observe that Portfolio B's actual expected return of 0.0924 is significantly lower than the calculated 0.13520. This discrepancy suggests that Portfolio B is overvalued, and an arbitrage opportunity exists. By selling Portfolio B and buying a combination of Portfolios A and C, an investor can exploit this mispricing. The arbitrage profit per dollar can be calculated as the difference between the calculated and actual returns of Portfolio B, which is $0.13520 - 0.0924 = $0.0428. A is incorrect. The statement that no arbitrage opportunity exists is incorrect because the calculated expected return for Portfolio B (0.13520) is higher than its listed expected return (0.0924). This mispricing indicates that Portfolio B is overvalued, providing a clear arbitrage opportunity by short selling Portfolio B and investing in Portfolios A and C, thereby generating a profit of $0.0428 per dollar, which contradicts the premise of no arbitrage. C is incorrect. The claim that an arbitrage opportunity exists with a profit of $0.0510 per dollar is incorrect because the correct arbitrage profit, as calculated, is $0.0428 per dollar. The error in option C likely arises from a miscalculation or misinterpretation of the expected returns or the arbitrage strategy. The correct calculation based on the one-factor model and the given data in Exhibit 1 clearly shows the arbitrage profit to be $0.0428 per dollar, not $0.0510. ", "explhtml": "<p>Based on the one-factor model equation provided, the expected returns for the portfolios can be calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0021.webp\" style=\"max-width:min(100%,532px)\" alt=\"Portfolio A (Expected Return) = 0.0764 + (0.0560 × 0.18) = 0.08648 Portfolio B (Expected Return) = 0.0764 + (0.0560 × 1.05) = 0.13520 Portfolio C (Expected Return) = 0.0764 + (0.0560 × 1.96) = 0.18616\"><p>Comparing these calculated expected returns with the actual expected returns given in Exhibit 1, we observe that Portfolio B&#x27;s actual expected return of 0.0924 is significantly lower than the calculated 0.13520. This discrepancy suggests that Portfolio B is overvalued, and an arbitrage opportunity exists. By selling Portfolio B and buying a combination of Portfolios A and C, an investor can exploit this mispricing. The arbitrage profit per dollar can be calculated as the difference between the calculated and actual returns of Portfolio B, which is $0.13520 - 0.0924 = $0.0428.<\/p><p><b>A is incorrect<\/b>. The statement that no arbitrage opportunity exists is incorrect because the calculated expected return for Portfolio B (0.13520) is higher than its listed expected return (0.0924). This mispricing indicates that Portfolio B is overvalued, providing a clear arbitrage opportunity by short selling Portfolio B and investing in Portfolios A and C, thereby generating a profit of $0.0428 per dollar, which contradicts the premise of no arbitrage.<\/p><p><b>C is incorrect<\/b>. The claim that an arbitrage opportunity exists with a profit of $0.0510 per dollar is incorrect because the correct arbitrage profit, as calculated, is $0.0428 per dollar. The error in option C likely arises from a miscalculation or misinterpretation of the expected returns or the arbitrage strategy. The correct calculation based on the one-factor model and the given data in Exhibit 1 clearly shows the arbitrage profit to be $0.0428 per dollar, not $0.0510. <\/p><p class=\"los\">Portfolio Management, Learning Module 2: Using Multifactor Models, LOS 2(b): Define arbitrage opportunity and determine whether an arbitrage opportunity exists<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Orion Wealth Management<\/summary><div class=\"vig-body\"><p>Orion Wealth Management is an investment management firm housing a research division. The firm manages two equity funds, Alpha and Gamma. Alpha is concentrated in U.S. domestic equities and has a large-cap value mandate. Gamma is more diversified, comprising foreign and domestic equities.<\/p><p>Alpha is managed by Raul Boyle, an equity fund manager at Orion. Boyle believes that any portfolio constructed from Alpha will be highly sensitive to GDP growth and inflation. He intends to test the sensitivity of portfolio returns solely based on the inflation factor and constructs a one-factor model for this purpose. He estimates the expected return of three hypothetical portfolios constructed using fund assets, with each having a distinct sensitivity to inflation (Exhibit 1). For his analysis, Boyle assumes an absence of arbitrage opportunities.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0017.webp\" style=\"max-width:min(100%,550px)\" alt=\"Exhibit 1: One Factor Portfolios and Returns Estimation* Portfolio Expected Return Factor Sensitivity A 0.0865 0.18 B 0.0924 1.05 C 0.1862 1.96 *Equation for one-factor model: E(Rp) = 0.0764 + 0.0560βp,1\"><p>When asked about the assumptions that were undertaken to derive the one-factor model by Victoria Hower, his subordinate, Boyle, responds that in addition to the assumption of zero arbitrage opportunities, he has undertaken two further assumptions:<\/p><p>Assumption 1: There are ample buyers and sellers willing to trade in the market.<\/p><p>Assumption 2: Asset specific risk is minimal to negligible.<\/p><p>Hower then asks Boyle to explain the model&#x27;s variables, particularly factor sensitivities. Boyle responds by stating, “Factor sensitivities represent factor surprises or the difference between realized and historical values of the variables.”<\/p><p>Sasha Emmerson is Orion’s performance appraisal analyst. Emerson is evaluating Boyle’s performance and believes that a one-factor model is highly unsuitable for evaluating the sources of the fund’s active returns and for determining whether Boyle has followed the stated investment mandate. Emerson relies on Orion’s research division which builds a four-factor model including the factors: overall market risk (RMRF), momentum (WML), value (HML), and size (SMB).<\/p><p>The developed model is as follows:<\/p><p>R<sub>p<\/sub> – R<sub>f<\/sub> = a<sub>p<\/sub> + b<sub>p1<\/sub>RMRF + b<sub>p2<\/sub>SMB + b<sub>p3<\/sub>HML + b<sub>p4<\/sub>WML + ε<sub>p<\/sub><\/p><p>Emerson decomposes fund returns achieved during the year using the model and Boyle’s performance benchmark. The results of her analysis are presented below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0018.webp\" style=\"max-width:min(100%,496px)\" alt=\"Exhibit 2: Four-Factor Model Factor Portfolio Benchmark Factor Return RMRF 0.90 1.70 0.105 SMB - 1.85 - 2.50 0.258 HML 0.08 1.00 - 0.095 WML 0.60 0.60 0.008\"><p>Tamara Smith is Gamma’s fund manager. Gamma fund comprises of four stocks. analysiTo conduct a risk attribution analysis, Emerson employs a global fundamental factor model using industry and country membership as dummy variables and style factors. Emerson aims to determine how much each source of active exposure contributed to the manager’s overall tracking error. The results of her analysis are presented in the exhibit below (Exhibit 3): <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0019.webp\" style=\"max-width:min(100%,757px)\" alt=\"Exhibit 3: Risk Attribution Analysis for Gamma Fund Active Factor Value in Portfolio Style Active Stock Country Industry (in $ Millions) Factor Specific A 1.0 15.70 5.78 25.00 20.10 B 0.4 1.89 19.08 29.40 15.40 C 0.5 1.05 0.63 1.30 1.30 D 0.1 0.06 5.40 12.50 6.10 The column labeled “Industry” gives \"><p>industry exposures of its holdings.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0020.webp\" style=\"max-width:min(100%,757px)\" alt=\"The column labeled “country” gives the portfolio’s active factor risk associated with the\"><p>country exposures of its holdings.<\/p><p>Emerson concludes her analysis by meeting with the two fund managers to discuss the performance results. <\/p><\/div><\/details><div class=\"qtext\"><p>Using the data in Exhibit 1, Emerson will most likely conclude that an arbitrage opportunity:<\/p><\/div>", "subj": "portfolio"}, {"n": 14, "q": "Concerning the assumptions presented, Emerson is most likely incorrect regarding:", "opts": ["Assumption 1 only.", "Assumption 2 only.", "Both assumptions."], "ans": "A", "expl": "Emerson's incorrectness regarding Assumption 1 stems from a misunderstanding of the Arbitrage Pricing Theory (APT) requirements. APT, a multifactor model used to determine asset prices, assumes no arbitrage opportunities, meaning that the prices of securities will adjust to prevent arbitrage. This theory does not inherently require a highly liquid market, as liquidity pertains to the ease with which assets can be bought or sold in the market without affecting the asset's price. Assumption 1, which suggests ample buyers and sellers, implies high liquidity. However, APT's focus is on the relationships between asset returns and various macroeconomic factors, not on market liquidity. Therefore, Emerson's assumption that APT requires a liquid market is misplaced. The theory primarily requires that there are no arbitrage opportunities, allowing the law of one price to hold, which differs from requiring a liquid market. B is incorrect. Emerson's alignment with Assumption 2 is accurate within the context of APT. APT posits that asset-specific risks can be diversified away in large portfolios, focusing instead on systematic risks that affect all securities. Assumption 2, which states that asset-specific risk is minimal to negligible, aligns well with APT's principle that in a well-diversified portfolio, unsystematic risks, which are unique to individual assets, are nearly eliminated. This leaves only the systematic components that are relevant in the APT model. Thus, Emerson's adherence to this assumption is correctly placed as it reflects one of the core tenets of APT. C is incorrect. Since Emerson is correct about Assumption 2 and incorrect about Assumption 1, the statement that both assumptions are incorrect is false. Assumption 2 is a valid assumption under APT, as it deals with the diversification of unsystematic risks, which is a fundamental aspect of the theory. Therefore, stating that both assumptions are incorrect would misrepresent the accuracy of Emerson's understanding of APT's assumptions regarding systematic and unsystematic risks. ", "explhtml": "<p>Emerson&#x27;s incorrectness regarding Assumption 1 stems from a misunderstanding of the Arbitrage Pricing Theory (APT) requirements. APT, a multifactor model used to determine asset prices, assumes no arbitrage opportunities, meaning that the prices of securities will adjust to prevent arbitrage. This theory does not inherently require a highly liquid market, as liquidity pertains to the ease with which assets can be bought or sold in the market without affecting the asset&#x27;s price. Assumption 1, which suggests ample buyers and sellers, implies high liquidity. However, APT&#x27;s focus is on the relationships between asset returns and various macroeconomic factors, not on market liquidity. Therefore, Emerson&#x27;s assumption that APT requires a liquid market is misplaced. The theory primarily requires that there are no arbitrage opportunities, allowing the law of one price to hold, which differs from requiring a liquid market.<\/p><p><b>B is incorrect<\/b>. Emerson&#x27;s alignment with Assumption 2 is accurate within the context of APT. APT posits that asset-specific risks can be diversified away in large portfolios, focusing instead on systematic risks that affect all securities. Assumption 2, which states that asset-specific risk is minimal to negligible, aligns well with APT&#x27;s principle that in a well-diversified portfolio, unsystematic risks, which are unique to individual assets, are nearly eliminated. This leaves only the systematic components that are relevant in the APT model. Thus, Emerson&#x27;s adherence to this assumption is correctly placed as it reflects one of the core tenets of APT.<\/p><p><b>C is incorrect<\/b>. Since Emerson is correct about Assumption 2 and incorrect about Assumption 1, the statement that both assumptions are incorrect is false. Assumption 2 is a valid assumption under APT, as it deals with the diversification of unsystematic risks, which is a fundamental aspect of the theory. Therefore, stating that both assumptions are incorrect would misrepresent the accuracy of Emerson&#x27;s understanding of APT&#x27;s assumptions regarding systematic and unsystematic risks. <\/p><p class=\"los\">Portfolio Management, Learning Module 2: Using Multifactor Models, LOS 2(a): Describe arbitrage pricing theory (APT), including its underlying assumptions and its relation to multifactor models<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Orion Wealth Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Orion Wealth Management is an investment management firm housing a research division. The firm manages two equity funds, Alpha and Gamma. Alpha is concentrated in U.S. domestic equities and has a large-cap value mandate. Gamma is more diversified, comprising foreign and domestic equities.<\/p><p>Alpha is managed by Raul Boyle, an equity fund manager at Orion. Boyle believes that any portfolio constructed from Alpha will be highly sensitive to GDP growth and inflation. He intends to test the sensitivity of portfolio returns solely based on the inflation factor and constructs a one-factor model for this purpose. He estimates the expected return of three hypothetical portfolios constructed using fund assets, with each having a distinct sensitivity to inflation (Exhibit 1). For his analysis, Boyle assumes an absence of arbitrage opportunities.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0017.webp\" style=\"max-width:min(100%,550px)\" alt=\"Exhibit 1: One Factor Portfolios and Returns Estimation* Portfolio Expected Return Factor Sensitivity A 0.0865 0.18 B 0.0924 1.05 C 0.1862 1.96 *Equation for one-factor model: E(Rp) = 0.0764 + 0.0560βp,1\"><p>When asked about the assumptions that were undertaken to derive the one-factor model by Victoria Hower, his subordinate, Boyle, responds that in addition to the assumption of zero arbitrage opportunities, he has undertaken two further assumptions:<\/p><p>Assumption 1: There are ample buyers and sellers willing to trade in the market.<\/p><p>Assumption 2: Asset specific risk is minimal to negligible.<\/p><p>Hower then asks Boyle to explain the model&#x27;s variables, particularly factor sensitivities. Boyle responds by stating, “Factor sensitivities represent factor surprises or the difference between realized and historical values of the variables.”<\/p><p>Sasha Emmerson is Orion’s performance appraisal analyst. Emerson is evaluating Boyle’s performance and believes that a one-factor model is highly unsuitable for evaluating the sources of the fund’s active returns and for determining whether Boyle has followed the stated investment mandate. Emerson relies on Orion’s research division which builds a four-factor model including the factors: overall market risk (RMRF), momentum (WML), value (HML), and size (SMB).<\/p><p>The developed model is as follows:<\/p><p>R<sub>p<\/sub> – R<sub>f<\/sub> = a<sub>p<\/sub> + b<sub>p1<\/sub>RMRF + b<sub>p2<\/sub>SMB + b<sub>p3<\/sub>HML + b<sub>p4<\/sub>WML + ε<sub>p<\/sub><\/p><p>Emerson decomposes fund returns achieved during the year using the model and Boyle’s performance benchmark. The results of her analysis are presented below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0018.webp\" style=\"max-width:min(100%,496px)\" alt=\"Exhibit 2: Four-Factor Model Factor Portfolio Benchmark Factor Return RMRF 0.90 1.70 0.105 SMB - 1.85 - 2.50 0.258 HML 0.08 1.00 - 0.095 WML 0.60 0.60 0.008\"><p>Tamara Smith is Gamma’s fund manager. Gamma fund comprises of four stocks. analysiTo conduct a risk attribution analysis, Emerson employs a global fundamental factor model using industry and country membership as dummy variables and style factors. Emerson aims to determine how much each source of active exposure contributed to the manager’s overall tracking error. The results of her analysis are presented in the exhibit below (Exhibit 3): <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0019.webp\" style=\"max-width:min(100%,757px)\" alt=\"Exhibit 3: Risk Attribution Analysis for Gamma Fund Active Factor Value in Portfolio Style Active Stock Country Industry (in $ Millions) Factor Specific A 1.0 15.70 5.78 25.00 20.10 B 0.4 1.89 19.08 29.40 15.40 C 0.5 1.05 0.63 1.30 1.30 D 0.1 0.06 5.40 12.50 6.10 The column labeled “Industry” gives \"><p>industry exposures of its holdings.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0020.webp\" style=\"max-width:min(100%,757px)\" alt=\"The column labeled “country” gives the portfolio’s active factor risk associated with the\"><p>country exposures of its holdings.<\/p><p>Emerson concludes her analysis by meeting with the two fund managers to discuss the performance results. <\/p><\/div><\/details><div class=\"qtext\"><p>Concerning the assumptions presented, Emerson is most likely incorrect regarding:<\/p><\/div>", "subj": "portfolio"}, {"n": 15, "q": "Using the data in Exhibit 2 and assuming a security selection return of – 6.40%, which factor contributed most to the active return generated by Alpha?", "opts": ["SMB", "HML", "WML"], "ans": "A", "expl": "The question requires us to determine which factor contributed the most to the active return generated by Alpha using the data from Exhibit 2 and considering a security selection return of -6.40%. To solve this, we calculate the contribution of each factor to the active return using the formula: Breaking down the contributions: Adding the security selection return: From the calculations, SMB has the highest positive contribution to the active return, amounting to 0.1683. This is significantly higher than the contributions from other factors, making SMB the factor that contributed most to the active return of Alpha. B is incorrect. The contribution of HML to the active return is calculated as 0.0871, which is lower than the contribution from SMB (0.1683). Although HML does contribute positively to the active return, its impact is less significant compared to SMB, thus making it incorrect to state that HML contributed the most to the active return. C is incorrect. The contribution of WML to the active return is 0, as the sensitivities of the portfolio and the benchmark to WML are equal, resulting in no differential impact on the active return. Therefore, WML did not contribute to the active return at all, making it incorrect to consider it as the factor contributing the most to the active return. ", "explhtml": "<p>The question requires us to determine which factor contributed the most to the active return generated by Alpha using the data from Exhibit 2 and considering a security selection return of -6.40%. To solve this, we calculate the contribution of each factor to the active return using the formula:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0022.webp\" style=\"max-width:min(100%,758px)\" alt=\"k Total Active Return = ∑ [(Portfolio Sensitivityi −Benchmark Sensitivityi) × Factor Returni] + Secu i=1\"><p>Breaking down the contributions:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0023.webp\" style=\"max-width:min(100%,461px)\" alt=\"Contribution from RMRF = (0.90 −1.70) × 0.105 = −0.084 Contribution from SMB = (−1.85 + 2.50) × 0.258 = 0.1683 Contribution from HML = (0.08 −1.00) × −0.095 = 0.0871 Contribution from WML = (0.60 −0.60) × 0.008 = 0\"><p>Adding the security selection return:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0024.webp\" style=\"max-width:min(100%,545px)\" alt=\"Total Active Return = −0.084 + 0.1683 + 0.0871 + 0 −0.064 = 0.1074\"><p>From the calculations, SMB has the highest positive contribution to the active return, amounting to 0.1683. This is significantly higher than the contributions from other factors, making SMB the factor that contributed most to the active return of Alpha.<\/p><p><b>B is incorrect<\/b>. The contribution of HML to the active return is calculated as 0.0871, which is lower than the contribution from SMB (0.1683). Although HML does contribute positively to the active return, its impact is less significant compared to SMB, thus making it incorrect to state that HML contributed the most to the active return.<\/p><p><b>C is incorrect<\/b>. The contribution of WML to the active return is 0, as the sensitivities of the portfolio and the benchmark to WML are equal, resulting in no differential impact on the active return. Therefore, WML did not contribute to the active return at all, making it incorrect to consider it as the factor contributing the most to the active return. <\/p><p class=\"los\">Portfolio Management, Learning Module 2: Using Multifactor Models, LOS 2(e): Explain sources of active risk and interpret tracking risk and the information ratio<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Orion Wealth Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Orion Wealth Management is an investment management firm housing a research division. The firm manages two equity funds, Alpha and Gamma. Alpha is concentrated in U.S. domestic equities and has a large-cap value mandate. Gamma is more diversified, comprising foreign and domestic equities.<\/p><p>Alpha is managed by Raul Boyle, an equity fund manager at Orion. Boyle believes that any portfolio constructed from Alpha will be highly sensitive to GDP growth and inflation. He intends to test the sensitivity of portfolio returns solely based on the inflation factor and constructs a one-factor model for this purpose. He estimates the expected return of three hypothetical portfolios constructed using fund assets, with each having a distinct sensitivity to inflation (Exhibit 1). For his analysis, Boyle assumes an absence of arbitrage opportunities.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0017.webp\" style=\"max-width:min(100%,550px)\" alt=\"Exhibit 1: One Factor Portfolios and Returns Estimation* Portfolio Expected Return Factor Sensitivity A 0.0865 0.18 B 0.0924 1.05 C 0.1862 1.96 *Equation for one-factor model: E(Rp) = 0.0764 + 0.0560βp,1\"><p>When asked about the assumptions that were undertaken to derive the one-factor model by Victoria Hower, his subordinate, Boyle, responds that in addition to the assumption of zero arbitrage opportunities, he has undertaken two further assumptions:<\/p><p>Assumption 1: There are ample buyers and sellers willing to trade in the market.<\/p><p>Assumption 2: Asset specific risk is minimal to negligible.<\/p><p>Hower then asks Boyle to explain the model&#x27;s variables, particularly factor sensitivities. Boyle responds by stating, “Factor sensitivities represent factor surprises or the difference between realized and historical values of the variables.”<\/p><p>Sasha Emmerson is Orion’s performance appraisal analyst. Emerson is evaluating Boyle’s performance and believes that a one-factor model is highly unsuitable for evaluating the sources of the fund’s active returns and for determining whether Boyle has followed the stated investment mandate. Emerson relies on Orion’s research division which builds a four-factor model including the factors: overall market risk (RMRF), momentum (WML), value (HML), and size (SMB).<\/p><p>The developed model is as follows:<\/p><p>R<sub>p<\/sub> – R<sub>f<\/sub> = a<sub>p<\/sub> + b<sub>p1<\/sub>RMRF + b<sub>p2<\/sub>SMB + b<sub>p3<\/sub>HML + b<sub>p4<\/sub>WML + ε<sub>p<\/sub><\/p><p>Emerson decomposes fund returns achieved during the year using the model and Boyle’s performance benchmark. The results of her analysis are presented below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0018.webp\" style=\"max-width:min(100%,496px)\" alt=\"Exhibit 2: Four-Factor Model Factor Portfolio Benchmark Factor Return RMRF 0.90 1.70 0.105 SMB - 1.85 - 2.50 0.258 HML 0.08 1.00 - 0.095 WML 0.60 0.60 0.008\"><p>Tamara Smith is Gamma’s fund manager. Gamma fund comprises of four stocks. analysiTo conduct a risk attribution analysis, Emerson employs a global fundamental factor model using industry and country membership as dummy variables and style factors. Emerson aims to determine how much each source of active exposure contributed to the manager’s overall tracking error. The results of her analysis are presented in the exhibit below (Exhibit 3): <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0019.webp\" style=\"max-width:min(100%,757px)\" alt=\  option A is not accurate. C is incorrect. It estimates the total residual risk at 16.07%, which is drastically higher than the actual calculated risk. This overestimation could result from a misunderstanding of the weights or specific risks, or an incorrect application of the formula for total residual risk. The precise calculation using the correct formula and values from Exhibit 3 demonstrates that the total residual risk is only 1.199%, making option C incorrect. ", "explhtml": "<p>We need to calculate the total residual risk using the active specific risks provided in Exhibit 3. The total residual risk is calculated by summing the squared products of the active weights and their corresponding specific risks for each stock in the portfolio. The formula for calculating the total residual risk is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0025.webp\" style=\"max-width:min(100%,316px)\" alt=\"Total Residual Risk = ∑ n ( W a i ) 2 × (ϵi)2 i=1 Wtotal\"><p>Where W<sub>i<\/sub><sup>a<\/sup> is the active weight of stock i in the portfolio, W<sub>total<\/sub> is the total active weight of the portfolio, and ϵ<sub>i<\/sub> is the active specific risk of stock i. Using the data from Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0026.webp\" style=\"max-width:min(100%,756px)\" alt=\"Total Residual Risk = ( 1.0 ) 2 × (0.2010)2 + ( 0.4 ) 2 × (0.1540)2 + ( 0.5 ) 2 × (0.0130)2 + ( 0.1 ) 2 × (0.061 2.0 2.0 2.0 2.0\"><p><b>A is incorrect<\/b>. It suggests that the total residual risk is 4.36%, which is significantly higher than the calculated value. This discrepancy arises because the calculation for option A likely includes incorrect assumptions or errors in the computation of the weights or specific risks. The detailed calculation provided above clearly shows that the correct total residual risk is much lower, confirming that option A is not accurate.<\/p><p><b>C is incorrect<\/b>. It estimates the total residual risk at 16.07%, which is drastically higher than the actual calculated risk. This overestimation could result from a misunderstanding of the weights or specific risks, or an incorrect application of the formula for total residual risk. The precise calculation using the correct formula and values from Exhibit 3 demonstrates that the total residual risk is only 1.199%, making option C incorrect. <\/p><p class=\"los\">Portfolio Management, Learning Module 2: Using Multifactor Models, LOS 2(e): Explain sources of active risk and interpret tracking risk and the information ratio<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Orion Wealth Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Orion Wealth Management is an investment management firm housing a research division. The firm manages two equity funds, Alpha and Gamma. Alpha is concentrated in U.S. domestic equities and has a large-cap value mandate. Gamma is more diversified, comprising foreign and domestic equities.<\/p><p>Alpha is managed by Raul Boyle, an equity fund manager at Orion. Boyle believes that any portfolio constructed from Alpha will be highly sensitive to GDP growth and inflation. He intends to test the sensitivity of portfolio returns solely based on the inflation factor and constructs a one-factor model for this purpose. He estimates the expected return of three hypothetical portfolios constructed using fund assets, with each having a distinct sensitivity to inflation (Exhibit 1). For his analysis, Boyle assumes an absence of arbitrage opportunities.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0017.webp\" style=\"max-width:min(100%,550px)\" alt=\"Exhibit 1: One Factor Portfolios and Returns Estimation* Portfolio Expected Return Factor Sensitivity A 0.0865 0.18 B 0.0924 1.05 C 0.1862 1.96 *Equation for one-factor model: E(Rp) = 0.0764 + 0.0560βp,1\"><p>When asked about the assumptions that were undertaken to derive the one-factor model by Victoria Hower, his subordinate, Boyle, responds that in addition to the assumption of zero arbitrage opportunities, he has undertaken two further assumptions:<\/p><p>Assumption 1: There are ample buyers and sellers willing to trade in the market.<\/p><p>Assumption 2: Asset specific risk is minimal to negligible.<\/p><p>Hower then asks Boyle to explain the model&#x27;s variables, particularly factor sensitivities. Boyle responds by stating, “Factor sensitivities represent factor surprises or the difference between realized and historical values of the variables.”<\/p><p>Sasha Emmerson is Orion’s performance appraisal analyst. Emerson is evaluating Boyle’s performance and believes that a one-factor model is highly unsuitable for evaluating the sources of the fund’s active returns and for determining whether Boyle has followed the stated investment mandate. Emerson relies on Orion’s research division which builds a four-factor model including the factors: overall market risk (RMRF), momentum (WML), value (HML), and size (SMB).<\/p><p>The developed model is as follows:<\/p><p>R<sub>p<\/sub> – R<sub>f<\/sub> = a<sub>p<\/sub> + b<sub>p1<\/sub>RMRF + b<sub>p2<\/sub>SMB + b<sub>p3<\/sub>HML + b<sub>p4<\/sub>WML + ε<sub>p<\/sub><\/p><p>Emerson decomposes fund returns achieved during the year using the model and Boyle’s performance benchmark. The results of her analysis are presented below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0018.webp\" style=\"max-width:min(100%,496px)\" alt=\"Exhibit 2: Four-Factor Model Factor Portfolio Benchmark Factor Return RMRF 0.90 1.70 0.105 SMB - 1.85 - 2.50 0.258 HML 0.08 1.00 - 0.095 WML 0.60 0.60 0.008\"><p>Tamara Smith is Gamma’s fund manager. Gamma fund comprises of four stocks. analysiTo conduct a risk attribution analysis, Emerson employs a global fundamental factor model using industry and country membership as dummy variables and style factors. Emerson aims to determine how much each source of active exposure contributed to the manager’s overall tracking error. The results of her analysis are presented in the exhibit below (Exhibit 3): <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0019.webp\" style=\"max-width:min(100%,757px)\" alt=\"Exhibit 3: Risk Attribution Analysis for Gamma Fund Active Factor Value in Portfolio Style Active Stock Country Industry (in $ Millions) Factor Specific A 1.0 15.70 5.78 25.00 20.10 B 0.4 1.89 19.08 29.40 15.40 C 0.5 1.05 0.63 1.30 1.30 D 0.1 0.06 5.40 12.50 6.10 The column labeled “Industry” gives \"><p>industry exposures of its holdings.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0020.webp\" style=\"max-width:min(100%,757px)\" alt=\"The column labeled “country” gives the portfolio’s active factor risk associated with the\"><p>country exposures of its holdings.<\/p><p>Emerson concludes her analysis by meeting with the two fund managers to discuss the performance results. <\/p><\/div><\/details><div class=\"qtext\"><p>Using the data in Exhibit 3, the total residual risk is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 17, "q": "Does the ‘Ethical Responsibilities’ excerpt most accurately presents the concept?", "opts": ["Only with respect to I.", "Only with respect to I and II.", "Yes, with respect to all three points."], "ans": "C", "expl": "The 'Ethical Responsibilities' excerpt from the recruitment policy of Scale Asset Management (SAM) comprehensively covers the fundamental principles necessary for ethical portfolio management. Firstly, it emphasizes that ethical conduct is the cornerstone of managing investor portfolios. This is crucial because ethical behavior ensures transparency, fairness, and integrity in financial management, which are essential for maintaining investor trust and confidence. Secondly, the policy highlights the importance of portfolio managers prioritizing the well-being of their clients. This aligns with the fiduciary duty of managers to act in the best interests of their clients, making decisions that benefit the clients rather than personal gains. Lastly, the excerpt emphasizes the importance of managers upholding their position of trust by adhering to the CFA Institute Code of Ethics and Standards of Professional Conduct. This is vital as it binds the managers to a high standard of professional behavior, ensuring they conduct their duties with honesty and diligence. A is incorrect. It suggests that the 'Ethical Responsibilities' excerpt only accurately presents the concept with respect to the first point about ethical conduct being foundational. However, this view is too narrow, as it overlooks the comprehensive nature of the excerpt, which also effectively addresses the importance of caring for client welfare and upholding a position of trust, as mandated by professional ethical standards. These additional points are integral to the holistic approach to ethical responsibilities in portfolio management, making Option A an incomplete representation of the excerpt's coverage. B is incorrect. It indicates that the excerpt accurately presents the concept with respect to the first two points: ethical conduct and looking after client welfare. While this option recognizes more aspects than Option A, it still falls short by not acknowledging the third point, which involves upholding a position of trust in accordance with the CFA Institute's ethical standards. This omission overlooks the comprehensive scope of ethical responsibilities outlined in the excerpt, which includes upholding a high standard of trust and integrity, essential for effective ethical portfolio management. ", "explhtml": "<p>The &#x27;Ethical Responsibilities&#x27; excerpt from the recruitment policy of Scale Asset Management (SAM) comprehensively covers the fundamental principles necessary for ethical portfolio management. Firstly, it emphasizes that ethical conduct is the cornerstone of managing investor portfolios. This is crucial because ethical behavior ensures transparency, fairness, and integrity in financial management, which are essential for maintaining investor trust and confidence. Secondly, the policy highlights the importance of portfolio managers prioritizing the well-being of their clients. This aligns with the fiduciary duty of managers to act in the best interests of their clients, making decisions that benefit the clients rather than personal gains. Lastly, the excerpt emphasizes the importance of managers upholding their position of trust by adhering to the CFA Institute Code of Ethics and Standards of Professional Conduct. This is vital as it binds the managers to a high standard of professional behavior, ensuring they conduct their duties with honesty and diligence.<\/p><p><b>A is incorrect<\/b>. It suggests that the &#x27;Ethical Responsibilities&#x27; excerpt only accurately presents the concept with respect to the first point about ethical conduct being foundational. However, this view is too narrow, as it overlooks the comprehensive nature of the excerpt, which also effectively addresses the importance of caring for client welfare and upholding a position of trust, as mandated by professional ethical standards. These additional points are integral to the holistic approach to ethical responsibilities in portfolio management, making Option A an incomplete representation of the excerpt&#x27;s coverage.<\/p><p><b>B is incorrect<\/b>. It indicates that the excerpt accurately presents the concept with respect to the first two points: ethical conduct and looking after client welfare. While this option recognizes more aspects than Option A, it still falls short by not acknowledging the third point, which involves upholding a position of trust in accordance with the CFA Institute&#x27;s ethical standards. This omission overlooks the comprehensive scope of ethical responsibilities outlined in the excerpt, which includes upholding a high standard of trust and integrity, essential for effective ethical portfolio management. <\/p><p class=\"los\">Portfolio Management, Learning Module 2: Using Multifactor Models, LOS 2(d): Describe risk measures used by banks, asset managers, pension funds, and insurers<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Scale Asset Management<\/summary><div class=\"vig-body\"><p>Scale Asset Management (SAM) is an investment advisory firm that caters exclusively to individual high-net-worth clients. As part of the firm’s recruitment policy, each investment advisor is educated about the importance of taking a portfolio perspective and upholding their ethical responsibilities. Relevant excerpts from the recruitment policy are summarized as follows:<\/p><p>Portfolio Perspective:<\/p><p>Each security should be evaluated based on its risk and return characteristics when making investment decisions on client portfolios. Securities with an attractive risk-return tradeoff should be selected for investment. <\/p><p>Ethical Responsibilities:<\/p><p>I. Ethical conduct is the foundation for managing investor portfolios. II. Portfolio managers should look after the well-being of their clients as their actions<\/p><p>directly influence the welfare of clients.<\/p><p>III. Managers should uphold their position of trust as mandated by the CFA Institute Code of<\/p><p>Ethics and Standards of Professional Conduct.<\/p><p>Rubin Hector, CFA, is a senior portfolio manager for SAM and manages the investment portfolio of Charles Lee, a 65-year-old army veteran who retired 25 years ago. He has entrusted Hector with managing his $1.0 million investment portfolio, which another asset advisor previously managed. Lee began accumulating his asset base from the day of his retirement, starting with an asset base of $95,000. Lee withdrew $25,000 each year to finance his living expenses. Investment returns were taxed at a rate of 30%,and the current portfolio value incorporates expected inflation.<\/p><p>During his meeting with Hector, Lee shares two concerns that he would like his portfolio manager to address:<\/p><p>Concern 1: “I have a serious medical condition which requires me to keep emergency cash at all times. My current portfolio is invested in highly risky, illiquid asset classes, making it difficult for me to rely on it as a source of liquidity.”<\/p><p>Concern 2: “I keep myself up-to-date with tax laws and have read that estate tax rates are shortly due for an upward revision. I intend to transfer my portfolio to my granddaughter upon my death and would like to determine the most efficient method for doing so.”<\/p><p>After addressing Lee’s concerns, Hector arranges a second meeting with Lee to discuss SAM’s performance appraisal policy details.<\/p><p>Performance Appraisal Policy:<\/p><p>Each manager’s performance is judged in terms of:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0027.webp\" style=\"max-width:min(100%,192px)\" alt=\"I. absolute returns and\"><p>II. relative to a designated benchmark.<\/p><p>There are primarily three sources of returns:<\/p><p>1. strategic policy risk, 2. market timing risk (returns due to active security selection), and 3. residual return.<\/p><\/div><\/details><div class=\"qtext\"><p>Does the ‘Ethical Responsibilities’ excerpt most accurately presents the concept?<\/p><\/div>", "subj": "portfolio"}, {"n": 18, "q": "Based on the information provided on Lee, his pre-tax required rate of return at the time of retirement was closest to:", "opts": ["14.10%.", "26.97%.", "38.53%."], "ans": "C", "expl": "It accurately reflects the pre-tax required rate of return for Charles Lee's investment portfolio. To determine this, we start by understanding that Lee needed to grow his initial investment of $95,000 to $1 million over 25 years while withdrawing $25,000 annually for living expenses. The post-tax required rate of return, which is the rate of return after accounting for taxes, was calculated to be 26.97%. Since the investment returns were taxed at a rate of 30%, the pre-tax required rate of return can be calculated using the formula Plugging in the values, we get This calculation shows that to achieve the financial goals set by Lee, considering the tax implications, the investments needed to yield a pre-tax return of 38.53% annually. A is incorrect. It suggests a pre-tax required rate of return of 14.10%, which significantly underestimates the actual required growth rate of the portfolio. Given Lee's financial needs and the tax rate, a 14.10% return would have been insufficient to increase the portfolio from $95,000 to $1 million over 25 years while also allowing for annual withdrawals of $25,000. This option does not account for the compounded growth needed annually to reach the target portfolio size, especially after considering the impact of taxes and withdrawals. B is incorrect. It proposes a pre-tax required rate of return of 26.97%, which is actually the post-tax rate of return. This option fails to consider the tax impact on the investment returns. Without adjusting for the 30% tax rate, this rate would not suffice to meet the financial objectives of growing the portfolio adequately after accounting for annual withdrawals and tax deductions. It is crucial to calculate the pre-tax return to understand the gross growth rate needed to achieve the net financial requirements. ", "explhtml": "<p>It accurately reflects the pre-tax required rate of return for Charles Lee&#x27;s investment portfolio. To determine this, we start by understanding that Lee needed to grow his initial investment of $95,000 to $1 million over 25 years while withdrawing $25,000 annually for living expenses. The post-tax required rate of return, which is the rate of return after accounting for taxes, was calculated to be 26.97%. Since the investment returns were taxed at a rate of 30%, the pre-tax required rate of return can be calculated using the formula<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0028.webp\" style=\"max-width:min(100%,508px)\" alt=\"Post-tax required rate of return Pre-tax required rate of return = 1 −Tax rate .\"><p>Plugging in the values, we get<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0029.webp\" style=\"max-width:min(100%,409px)\" alt=\"26.97% Pre-tax required rate of return = 1 −0.30 = 38.53%.\"><p>This calculation shows that to achieve the financial goals set by Lee, considering the tax implications, the investments needed to yield a pre-tax return of 38.53% annually.<\/p><p><b>A is incorrect<\/b>. It suggests a pre-tax required rate of return of 14.10%, which significantly underestimates the actual required growth rate of the portfolio. Given Lee&#x27;s financial needs and the tax rate, a 14.10% return would have been insufficient to increase the portfolio from $95,000 to $1 million over 25 years while also allowing for annual withdrawals of $25,000. This option does not account for the compounded growth needed annually to reach the target portfolio size, especially after considering the impact of taxes and withdrawals.<\/p><p><b>B is incorrect<\/b>. It proposes a pre-tax required rate of return of 26.97%, which is actually the post-tax rate of return. This option fails to consider the tax impact on the investment returns. Without adjusting for the 30% tax rate, this rate would not suffice to meet the financial objectives of growing the portfolio adequately after accounting for annual withdrawals and tax deductions. It is crucial to calculate the pre-tax return to understand the gross growth rate needed to achieve the net financial requirements. <\/p><p class=\"los\">Portfolio Management, Learning Module 5: Economic And Investment Markets, LOS 5(f): Explain how the phase of the business cycle affects credit spreads and the performance of credit-sensitive fixed-income instruments<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Scale Asset Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Scale Asset Management (SAM) is an investment advisory firm that caters exclusively to individual high-net-worth clients. As part of the firm’s recruitment policy, each investment advisor is educated about the importance of taking a portfolio perspective and upholding their ethical responsibilities. Relevant excerpts from the recruitment policy are summarized as follows:<\/p><p>Portfolio Perspective:<\/p><p>Each security should be evaluated based on its risk and return characteristics when making investment decisions on client portfolios. Securities with an attractive risk-return tradeoff should be selected for investment. <\/p><p>Ethical Responsibilities:<\/p><p>I. Ethical conduct is the foundation for managing investor portfolios. II. Portfolio managers should look after the well-being of their clients as their actions<\/p><p>directly influence the welfare of clients.<\/p><p>III. Managers should uphold their position of trust as mandated by the CFA Institute Code of<\/p><p>Ethics and Standards of Professional Conduct.<\/p><p>Rubin Hector, CFA, is a senior portfolio manager for SAM and manages the investment portfolio of Charles Lee, a 65-year-old army veteran who retired 25 years ago. He has entrusted Hector with managing his $1.0 million investment portfolio, which another asset advisor previously managed. Lee began accumulating his asset base from the day of his retirement, starting with an asset base of $95,000. Lee withdrew $25,000 each year to finance his living expenses. Investment returns were taxed at a rate of 30%,and the current portfolio value incorporates expected inflation.<\/p><p>During his meeting with Hector, Lee shares two concerns that he would like his portfolio manager to address:<\/p><p>Concern 1: “I have a serious medical condition which requires me to keep emergency cash at all times. My current portfolio is invested in highly risky, illiquid asset classes, making it difficult for me to rely on it as a source of liquidity.”<\/p><p>Concern 2: “I keep myself up-to-date with tax laws and have read that estate tax rates are shortly due for an upward revision. I intend to transfer my portfolio to my granddaughter upon my death and would like to determine the most efficient method for doing so.”<\/p><p>After addressing Lee’s concerns, Hector arranges a second meeting with Lee to discuss SAM’s performance appraisal policy details.<\/p><p>Performance Appraisal Policy:<\/p><p>Each manager’s performance is judged in terms of:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0027.webp\" style=\"max-width:min(100%,192px)\" alt=\"I. absolute returns and\"><p>II. relative to a designated benchmark.<\/p><p>There are primarily three sources of returns:<\/p><p>1. strategic policy risk, 2. market timing risk (returns due to active security selection), and 3. residual return.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the information provided on Lee, his pre-tax required rate of return at the time of retirement was closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 19, "q": "To address Lee’s first concern, Hector should most likely :", "opts": ["Liquidate all risky holdings.", "Employ a derivatives strategy.", "Educate him on the benefits of holding highly risky asset classes."], "ans": "B", "expl": "To address Lee's first concern effectively, Hector should employ a derivatives strategy. This approach allows for the modification of the payoff structure of the existing risky portfolio to better meet liquidity needs without necessitating the complete liquidation of the assets. Derivatives such as options and futures can be used to hedge against downside risks or to create positions that can be liquidated or adjusted more readily than the underlying assets themselves. This strategy aligns with the portfolio perspective that emphasizes selecting securities based on their risk-return tradeoff, as it allows for the retention of high-potential assets while managing their associated risks through derivatives. A is incorrect. Liquidating all risky holdings would not be a prudent decision in this context. Such a drastic measure would ignore the fundamental investment principle of maintaining a diversified portfolio that balances risk and return. Completely liquidating risky assets could potentially reduce the portfolio's ability to achieve higher returns, which are necessary for compensating for inflation and tax impacts over time. Furthermore, this action could lead to significant transaction costs and tax implications, ultimately harming the portfolio's overall performance and growth potential. C is incorrect. While educating clients about the benefits of holding risky asset classes is an important aspect of a portfolio manager's role, it does not directly address Lee's immediate concern about liquidity. Lee's need for emergency cash due to his medical condition requires a solution that provides quick access to funds. Understanding the benefits of risky investments does not necessarily solve the problem of liquidity, as these assets are typically less liquid and may not be readily convertible to cash in times of need. Therefore, focusing solely on education in this scenario would not fulfill the portfolio manager's ethical responsibility to prioritize the client's well-being and specific financial needs. ", "explhtml": "<p>To address Lee&#x27;s first concern effectively, Hector should employ a derivatives strategy. This approach allows for the modification of the payoff structure of the existing risky portfolio to better meet liquidity needs without necessitating the complete liquidation of the assets. Derivatives such as options and futures can be used to hedge against downside risks or to create positions that can be liquidated or adjusted more readily than the underlying assets themselves. This strategy aligns with the portfolio perspective that emphasizes selecting securities based on their risk-return tradeoff, as it allows for the retention of high-potential assets while managing their associated risks through derivatives.<\/p><p><b>A is incorrect<\/b>. Liquidating all risky holdings would not be a prudent decision in this context. Such a drastic measure would ignore the fundamental investment principle of maintaining a diversified portfolio that balances risk and return. Completely liquidating risky assets could potentially reduce the portfolio&#x27;s ability to achieve higher returns, which are necessary for compensating for inflation and tax impacts over time. Furthermore, this action could lead to significant transaction costs and tax implications, ultimately harming the portfolio&#x27;s overall performance and growth potential.<\/p><p><b>C is incorrect<\/b>. While educating clients about the benefits of holding risky asset classes is an important aspect of a portfolio manager&#x27;s role, it does not directly address Lee&#x27;s immediate concern about liquidity. Lee&#x27;s need for emergency cash due to his medical condition requires a solution that provides quick access to funds. Understanding the benefits of risky investments does not necessarily solve the problem of liquidity, as these assets are typically less liquid and may not be readily convertible to cash in times of need. Therefore, focusing solely on education in this scenario would not fulfill the portfolio manager&#x27;s ethical responsibility to prioritize the client&#x27;s well-being and specific financial needs. <\/p><p class=\"los\">Portfolio Management, Learning Module 2: Using Multifactor Models, LOS 2 (d): Describe advantages and limitations of VaR<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Scale Asset Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Scale Asset Management (SAM) is an investment advisory firm that caters exclusively to individual high-net-worth clients. As part of the firm’s recruitment policy, each investment advisor is educated about the importance of taking a portfolio perspective and upholding their ethical responsibilities. Relevant excerpts from the recruitment policy are summarized as follows:<\/p><p>Portfolio Perspective:<\/p><p>Each security should be evaluated based on its risk and return characteristics when making investment decisions on client portfolios. Securities with an attractive risk-return tradeoff should be selected for investment. <\/p><p>Ethical Responsibilities:<\/p><p>I. Ethical conduct is the foundation for managing investor portfolios. II. Portfolio managers should look after the well-being of their clients as their actions<\/p><p>directly influence the welfare of clients.<\/p><p>III. Managers should uphold their position of trust as mandated by the CFA Institute Code of<\/p><p>Ethics and Standards of Professional Conduct.<\/p><p>Rubin Hector, CFA, is a senior portfolio manager for SAM and manages the investment portfolio of Charles Lee, a 65-year-old army veteran who retired 25 years ago. He has entrusted Hector with managing his $1.0 million investment portfolio, which another asset advisor previously managed. Lee began accumulating his asset base from the day of his retirement, starting with an asset base of $95,000. Lee withdrew $25,000 each year to finance his living expenses. Investment returns were taxed at a rate of 30%,and the current portfolio value incorporates expected inflation.<\/p><p>During his meeting with Hector, Lee shares two concerns that he would like his portfolio manager to address:<\/p><p>Concern 1: “I have a serious medical condition which requires me to keep emergency cash at all times. My current portfolio is invested in highly risky, illiquid asset classes, making it difficult for me to rely on it as a source of liquidity.”<\/p><p>Concern 2: “I keep myself up-to-date with tax laws and have read that estate tax rates are shortly due for an upward revision. I intend to transfer my portfolio to my granddaughter upon my death and would like to determine the most efficient method for doing so.”<\/p><p>After addressing Lee’s concerns, Hector arranges a second meeting with Lee to discuss SAM’s performance appraisal policy details.<\/p><p>Performance Appraisal Policy:<\/p><p>Each manager’s performance is judged in terms of:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0027.webp\" style=\"max-width:min(100%,192px)\" alt=\"I. absolute returns and\"><p>II. relative to a designated benchmark.<\/p><p>There are primarily three sources of returns:<\/p><p>1. strategic policy risk, 2. market timing risk (returns due to active security selection), and 3. residual return.<\/p><\/div><\/details><div class=\"qtext\"><p>To address Lee’s first concern, Hector should most likely :<\/p><\/div>", "subj": "portfolio"}, {"n": 20, "q": "Concern 2 best addresses:", "opts": ["A tax constraint only.", "A unique circumstances constraint only.", "Both a tax and unique circumstances constraint."], "ans": "A", "expl": "Concern 2 primarily addresses a tax constraint. Charles Lee is concerned about the potential increase in estate tax rates, which directly impacts the financial strategy for transferring his assets to his granddaughter upon his death. This concern is rooted in the tax implications of estate planning, which is a critical aspect of financial management for individuals looking to optimize the transfer of wealth to future generations. The focus here is on understanding and mitigating the financial burden that may arise from changes in tax legislation. By addressing this, Lee aims to ensure that the maximum possible value of his estate can be preserved and passed on to his granddaughter, which is a clear indication of a tax-related constraint influencing investment decisions. B is incorrect. The option suggesting that Concern 2 addresses a unique circumstances constraint only is incorrect because the unique circumstances typically refer to personal or non-financial factors that might influence investment decisions, such as health issues, family situations, or personal values. In this scenario, Lee's concern is specifically about the financial implications of tax laws on his estate, which is a straightforward financial planning issue rather than a reflection of unique personal circumstances affecting his investment choices. C is incorrect. While it may seem that estate planning involves unique personal circumstances, in this context, the concern raised by Lee is strictly related to the financial and tax implications of transferring his estate. There is no indication that his concern about estate taxes is linked to any personal or unique circumstances beyond the financial scope. Therefore, stating that Concern 2 addresses both tax and unique circumstances constraints dilutes the primary focus, which is clearly on the impending financial impact of tax law changes on estate planning. ", "explhtml": "<p>Concern 2 primarily addresses a tax constraint. Charles Lee is concerned about the potential increase in estate tax rates, which directly impacts the financial strategy for transferring his assets to his granddaughter upon his death. This concern is rooted in the tax implications of estate planning, which is a critical aspect of financial management for individuals looking to optimize the transfer of wealth to future generations. The focus here is on understanding and mitigating the financial burden that may arise from changes in tax legislation. By addressing this, Lee aims to ensure that the maximum possible value of his estate can be preserved and passed on to his granddaughter, which is a clear indication of a tax-related constraint influencing investment decisions.<\/p><p><b>B is incorrect<\/b>. The option suggesting that Concern 2 addresses a unique circumstances constraint only is incorrect because the unique circumstances typically refer to personal or non-financial factors that might influence investment decisions, such as health issues, family situations, or personal values. In this scenario, Lee&#x27;s concern is specifically about the financial implications of tax laws on his estate, which is a straightforward financial planning issue rather than a reflection of unique personal circumstances affecting his investment choices.<\/p><p><b>C is incorrect<\/b>. While it may seem that estate planning involves unique personal circumstances, in this context, the concern raised by Lee is strictly related to the financial and tax implications of transferring his estate. There is no indication that his concern about estate taxes is linked to any personal or unique circumstances beyond the financial scope. Therefore, stating that Concern 2 addresses both tax and unique circumstances constraints dilutes the primary focus, which is clearly on the impending financial impact of tax law changes on estate planning. <\/p><p class=\"los\">Portfolio Management, Learning Module 5: Economic And Investment Markets, LOS 5(f): Explain how the phase of the business cycle affects credit spreads and the performance of credit-sensitive fixed-income instruments<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Scale Asset Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Scale Asset Management (SAM) is an investment advisory firm that caters exclusively to individual high-net-worth clients. As part of the firm’s recruitment policy, each investment advisor is educated about the importance of taking a portfolio perspective and upholding their ethical responsibilities. Relevant excerpts from the recruitment policy are summarized as follows:<\/p><p>Portfolio Perspective:<\/p><p>Each security should be evaluated based on its risk and return characteristics when making investment decisions on client portfolios. Securities with an attractive risk-return tradeoff should be selected for investment. <\/p><p>Ethical Responsibilities:<\/p><p>I. Ethical conduct is the foundation for managing investor portfolios. II. Portfolio managers should look after the well-being of their clients as their actions<\/p><p>directly influence the welfare of clients.<\/p><p>III. Managers should uphold their position of trust as mandated by the CFA Institute Code of<\/p><p>Ethics and Standards of Professional Conduct.<\/p><p>Rubin Hector, CFA, is a senior portfolio manager for SAM and manages the investment portfolio of Charles Lee, a 65-year-old army veteran who retired 25 years ago. He has entrusted Hector with managing his $1.0 million investment portfolio, which another asset advisor previously managed. Lee began accumulating his asset base from the day of his retirement, starting with an asset base of $95,000. Lee withdrew $25,000 each year to finance his living expenses. Investment returns were taxed at a rate of 30%,and the current portfolio value incorporates expected inflation.<\/p><p>During his meeting with Hector, Lee shares two concerns that he would like his portfolio manager to address:<\/p><p>Concern 1: “I have a serious medical condition which requires me to keep emergency cash at all times. My current portfolio is invested in highly risky, illiquid asset classes, making it difficult for me to rely on it as a source of liquidity.”<\/p><p>Concern 2: “I keep myself up-to-date with tax laws and have read that estate tax rates are shortly due for an upward revision. I intend to transfer my portfolio to my granddaughter upon my death and would like to determine the most efficient method for doing so.”<\/p><p>After addressing Lee’s concerns, Hector arranges a second meeting with Lee to discuss SAM’s performance appraisal policy details.<\/p><p>Performance Appraisal Policy:<\/p><p>Each manager’s performance is judged in terms of:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0027.webp\" style=\"max-width:min(100%,192px)\" alt=\"I. absolute returns and\"><p>II. relative to a designated benchmark.<\/p><p>There are primarily three sources of returns:<\/p><p>1. strategic policy risk, 2. market timing risk (returns due to active security selection), and 3. residual return.<\/p><\/div><\/details><div class=\"qtext\"><p>Concern 2 best addresses:<\/p><\/div>", "subj": "portfolio"}, {"n": 21, "q": "Which of the following planning stage steps have been least accurate identified?", "opts": ["4 only.", "1 and 3.", "2 and 4."], "ans": "A", "expl": "The correct answer is option A, which states that step 4 has been least accurately identified in the planning stage of the portfolio management process. The planning stage is crucial as it sets the foundation for how the portfolio will be managed. Step 4 specifically involves determining the strategic asset allocation, which is a critical component. This step should ideally combine the Investment Policy Statement (IPS) and capital market expectations to set target asset class weights along with maximum and minimum permissible weights for each asset class. However, the newsletter's description of this step seems to simplify or overlook the complexity and importance of accurately aligning the IPS with market expectations to establish a robust asset allocation strategy. This misrepresentation can lead to suboptimal asset allocation, which might not truly reflect the client's objectives and constraints as outlined in the IPS. B is incorrect. It suggests that steps 1 and 3 have been least accurately identified. However, both steps are correctly outlined and crucial in the planning stage. Step 1 involves defining the client's objectives and constraints, which is fundamental to tailoring the portfolio to the specific needs and limitations of the client. Step 3 involves formulating long-run forecasts for asset class risk and returns, which is essential for setting realistic expectations and preparing the portfolio to meet the client's long-ter
