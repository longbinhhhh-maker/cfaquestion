of his net worth) to an account with GWM<\/p><p>and requests Ross to restrict portfolio assets to domestic securities. Despite its track record,<\/p><p>GWM has only backtested its strategies using an international index that comprises domestic<\/p><p>securities. Ross creates a three-factor portfolio and presents it to Niekerk. Niekerk inquires of<\/p><p>Ross, &quot;What if future events don&#x27;t align with past occurrences?&quot;<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0069.webp\" style=\"max-width:min(100%,436px)\" alt=\"Exhibit 1: Downside Risk Measures for Model Factors Risk Measure Factor 1 Factor 2 Factor 3 Maximum drawdown 46.89% 33.21% 37.87% Conditional VaR (95%) 4.2% 16% 6.5% VaR (95%) 2.8% 5.5% 1.1%\"><\/div><\/details><div class=\"qtext\"><p>Niekerk&#x27;s concern embedded in the question, &quot;What if future events don&#x27;t align with past occurrences?&quot; is a drawback closely related to which investment strategy appraisal method?<\/p><\/div>", "subj": "portfolio"}, {"n": 64, "q": "Which of the following conclusions of Exhibit 1 is most likely correct?", "opts": ["When VaR is greater in Factor 2, an average gain of 16% is expected.", "5% of the time, gains from Factor 3 would be at least 6.5%", "5% of the time, gains from Factor 1 are likely to be worse than losses from Factor 3"], "ans": "C", "expl": "Conditional VaR (CVaR) at the 95% confidence level indicates the average loss that can be expected if the loss exceeds the VaR threshold. For Factor 1, the CVaR is 4.2%, meaning that in the worst 5% of scenarios, the average loss is 4.2%. For Factor 3, the CVaR is 6.5%, indicating a more severe average loss in the worst 5% of scenarios. Hence, it is correct to say that 5% of the time, losses from Factor 3 (6.5%) are likely to be worse than gains from Factor 1 (4.2%). A is incorrect. It misinterprets the concept of VaR (Value at Risk). VaR measures the potential loss, not gain. For Factor 2, the 95% confidence level VaR is 5.5%, indicating potential loss, not an average gain of 16%. B is incorrect. It confuses CVaR with gains. The CVaR of 6.5% for Factor 3 indicates the average loss in the worst 5% of scenarios, not gains. It reflects downside risk, not potential positive returns.", "explhtml": "<p>Conditional VaR (CVaR) at the 95% confidence level indicates the average loss that can be expected if the loss exceeds the VaR threshold. For Factor 1, the CVaR is 4.2%, meaning that in the worst 5% of scenarios, the average loss is 4.2%. For Factor 3, the CVaR is 6.5%, indicating a more severe average loss in the worst 5% of scenarios. Hence, it is correct to say that 5% of the time, losses from Factor 3 (6.5%) are likely to be worse than gains from Factor 1 (4.2%).<\/p><p><b>A is incorrect.<\/b> It misinterprets the concept of VaR (Value at Risk). VaR measures the potential loss, not gain. For Factor 2, the 95% confidence level VaR is 5.5%, indicating potential loss, not an average gain of 16%.<\/p><p><b>B is incorrect.<\/b> It confuses CVaR with gains. The CVaR of 6.5% for Factor 3 indicates the average loss in the worst 5% of scenarios, not gains. It reflects downside risk, not potential positive returns.<\/p><p class=\"los\">Portfolio Management, Learning Module 4: Backtesting and Simulation, LOS 4(g): explain inputs and decisions in simulation and interpret a simulation.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 61–64 · Kate Ross<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Kate Ross is an equity analyst working for Goldberg Wealth Managers (GWM). Ross meets with<\/p><p>Van Niekerk, a wealth client based in South Africa, to explain their investment strategies for<\/p><p>generating portfolio alpha.<\/p><p>Ross mentions that GWM has a track record in factor-based value portfolios and how they use<\/p><p>backtesting. Ross makes the following statements.<\/p><p>Statement 1: Backtesting is predominantly employed by quantitative investment managers and is<\/p><p>seldom used by fundamental investment managers, who focus more on forward estimates of<\/p><p>company earnings, macroeconomic factors, and intrinsic values.<\/p><p>Statement 2: By utilizing historical data, backtesting simulates a real-world investment process<\/p><p>to demonstrate the risk-return tradeoff of a specific proposed investment strategy.<\/p><p>As a 65-year-old, Niekerk allocates £ 6 million (12% of his net worth) to an account with GWM<\/p><p>and requests Ross to restrict portfolio assets to domestic securities. Despite its track record,<\/p><p>GWM has only backtested its strategies using an international index that comprises domestic<\/p><p>securities. Ross creates a three-factor portfolio and presents it to Niekerk. Niekerk inquires of<\/p><p>Ross, &quot;What if future events don&#x27;t align with past occurrences?&quot;<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0069.webp\" style=\"max-width:min(100%,436px)\" alt=\"Exhibit 1: Downside Risk Measures for Model Factors Risk Measure Factor 1 Factor 2 Factor 3 Maximum drawdown 46.89% 33.21% 37.87% Conditional VaR (95%) 4.2% 16% 6.5% VaR (95%) 2.8% 5.5% 1.1%\"><\/div><\/details><div class=\"qtext\"><p>Which of the following conclusions of Exhibit 1 is most likely correct?<\/p><\/div>", "subj": "portfolio"}, {"n": 65, "q": "After Croft adjusted the vendor database, the backtested returns are subject to:", "opts": ["Data snooping", "Bias", "Stale data"], "ans": "C", "expl": "The vendor database has a reporting lag of 5 months. This delay means that the data used for backtesting might not be current, leading to potential inaccuracies in assessing the investment strategy's performance. When data isn't updated in real-time or near real-time, it is considered \"stale,\" which can affect the validity of backtesting results. A is incorrect. Data snooping refers to the misuse of data mining techniques to discover patterns in data that may be spurious or non-representative of future performance. It involves excessive searching through data to find statistically significant patterns, which can lead to overfitting. There is no indication that Croft was improperly mining or excessively searching through the data. B is incorrect. Bias in backtesting typically refers to systematic errors introduced into the simulation using flawed assumptions, models, or data. While using stale data can introduce bias, the primary issue highlighted in the context is the lag in the data, making \"stale data\" the more accurate and specific problem.", "explhtml": "<p>The vendor database has a reporting lag of 5 months. This delay means that the data used for backtesting might not be current, leading to potential inaccuracies in assessing the investment strategy&#x27;s performance. When data isn&#x27;t updated in real-time or near real-time, it is considered &quot;stale,&quot; which can affect the validity of backtesting results.<\/p><p><b>A is incorrect.<\/b> Data snooping refers to the misuse of data mining techniques to discover patterns in data that may be spurious or non-representative of future performance. It involves excessive searching through data to find statistically significant patterns, which can lead to overfitting. There is no indication that Croft was improperly mining or excessively searching through the data.<\/p><p><b>B is incorrect.<\/b> Bias in backtesting typically refers to systematic errors introduced into the simulation using flawed assumptions, models, or data. While using stale data can introduce bias, the primary issue highlighted in the context is the lag in the data, making &quot;stale data&quot; the more accurate and specific problem.<\/p><p class=\"los\">Portfolio Management, Learning Module 4: Backtesting and Simulation, LOS 4(b): Describe and contrast steps and procedures in backtesting an investment strategy.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 65–68 · Casper Smalls<\/summary><div class=\"vig-body\"><p>Casper Smalls is a senior analyst at Smithson Consulting. The firm specializes in equity<\/p><p>strategies assessment with the help of backtesting and simulation techniques. Smalls is currently<\/p><p>developing a nine-factor portfolio strategy with the help of his assistant, Peter Croft. Smalls<\/p><p>requests Croft determine data availability from vendor databases and select the investment<\/p><p>universe. The most reliable vendor database does not give point-in-time data. Thus, a reporting<\/p><p>lag of 5 months and an adjustment to include point-in-time will need to be carried out.<\/p><p>Next, an initial backtest on the nine-factor portfolio is conducted, calculating key metrics and<\/p><p>performance statistics. Using a rolling window procedure, the portfolio will be rebalanced<\/p><p>monthly over a 20-year time horizon for the purpose of backtesting. Croft considers a range of<\/p><p>metrics to assess the outcome of the factor portfolio backtest and presents the result of three of<\/p><p>the nine-factor strategies in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0070.webp\" style=\"max-width:min(100%,526px)\" alt=\"Exhibit 1: Metrics for Factor Strategies Factor A Factor B Factor C Maximum drawdown 30.2% 10.2% 50.6% VaR (95%) 2.5% −1.8% 7.6% The standard deviation of returns 3.1% 1.7% 5.2%\"><p>Croft makes the following statement:<\/p><p>Statement 1: Factor B has the highest downside risk.<\/p><p>Statement 2: We need to consider maximum drawdown and standard deviation.<\/p><p>From experience, Smalls knows that risk parity factors and benchmark portfolios are popular<\/p><p>with high-net-worth clients and institutions. Smalls requests Croft to design a risk parity<\/p><p>portfolio (E) and a benchmark portfolio (X) and run two simulations that generate investment<\/p><p>performance data, assuming 500 simulation trials for each of the following approaches:<\/p><p>Approach 1: Monte Carlo simulation<\/p><p>Approach 2: Historical Simulation.<\/p><\/div><\/details><div class=\"qtext\"><p>After Croft adjusted the vendor database, the backtested returns are subject to:<\/p><\/div>", "subj": "portfolio"}, {"n": 66, "q": "Using Exhibit 1, Croft is likely to conclude that:", "opts": ["Factor Strategy B has the highest return.", "Factor Strategy C has the highest portfolio turnover.", "Factor Strategy A has less downside risk than Strategy C."], "ans": "C", "expl": "Maximum drawdown and VaR are downside risk measures and are lower in Strategy A than in Strategy C. A and B are incorrect. It is difficult to derive portfolio turnover and return based on the maximum drawdown, VaR, and standard deviation provided in Exhibit 1.", "explhtml": "<p>Maximum drawdown and VaR are downside risk measures and are lower in Strategy A than in Strategy C.<\/p><p><b>A and B are incorrect.<\/b> It is difficult to derive portfolio turnover and return based on the maximum drawdown, VaR, and standard deviation provided in Exhibit 1.<\/p><p class=\"los\">Portfolio Management, Learning Module 4: Backtesting and Simulation, LOS 4(g): explain inputs and decisions in simulation and interpret a simulation.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 65–68 · Casper Smalls<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Casper Smalls is a senior analyst at Smithson Consulting. The firm specializes in equity<\/p><p>strategies assessment with the help of backtesting and simulation techniques. Smalls is currently<\/p><p>developing a nine-factor portfolio strategy with the help of his assistant, Peter Croft. Smalls<\/p><p>requests Croft determine data availability from vendor databases and select the investment<\/p><p>universe. The most reliable vendor database does not give point-in-time data. Thus, a reporting<\/p><p>lag of 5 months and an adjustment to include point-in-time will need to be carried out.<\/p><p>Next, an initial backtest on the nine-factor portfolio is conducted, calculating key metrics and<\/p><p>performance statistics. Using a rolling window procedure, the portfolio will be rebalanced<\/p><p>monthly over a 20-year time horizon for the purpose of backtesting. Croft considers a range of<\/p><p>metrics to assess the outcome of the factor portfolio backtest and presents the result of three of<\/p><p>the nine-factor strategies in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0070.webp\" style=\"max-width:min(100%,526px)\" alt=\"Exhibit 1: Metrics for Factor Strategies Factor A Factor B Factor C Maximum drawdown 30.2% 10.2% 50.6% VaR (95%) 2.5% −1.8% 7.6% The standard deviation of returns 3.1% 1.7% 5.2%\"><p>Croft makes the following statement:<\/p><p>Statement 1: Factor B has the highest downside risk.<\/p><p>Statement 2: We need to consider maximum drawdown and standard deviation.<\/p><p>From experience, Smalls knows that risk parity factors and benchmark portfolios are popular<\/p><p>with high-net-worth clients and institutions. Smalls requests Croft to design a risk parity<\/p><p>portfolio (E) and a benchmark portfolio (X) and run two simulations that generate investment<\/p><p>performance data, assuming 500 simulation trials for each of the following approaches:<\/p><p>Approach 1: Monte Carlo simulation<\/p><p>Approach 2: Historical Simulation.<\/p><\/div><\/details><div class=\"qtext\"><p>Using Exhibit 1, Croft is likely to conclude that:<\/p><\/div>", "subj": "portfolio"}, {"n": 67, "q": "Which of Croft's statements regarding Exhibit 1 is correct?", "opts": ["Both Statement 1 and Statement 2.", "Only Statement 2.", "Neither Statement 1 nor Statement 2."], "ans": "B", "expl": "Both maximum drawdown and standard deviation are essential metrics for assessing the risk of a factor strategy. Maximum drawdown measures the greatest peak-to-trough decline, providing insight into potential losses. Standard deviation measures the volatility of returns, indicating how much the returns can vary. Together, these metrics offer a comprehensive view of risk. A and C are incorrect. Statement 1 is not correct. While Statement 2 is correct, Statement 1 falsely claims that Factor B has the highest downside risk. According to Exhibit 1, Factor B has the lowest maximum drawdown (10.2%) and the lowest standard deviation of returns (1.7%). The highest downside risk is seen in Factor C, which has the highest maximum drawdown (50.6%) and the highest VaR (7.6%).", "explhtml": "<p>Both maximum drawdown and standard deviation are essential metrics for assessing the risk of a factor strategy. Maximum drawdown measures the greatest peak-to-trough decline, providing insight into potential losses. Standard deviation measures the volatility of returns, indicating how much the returns can vary. Together, these metrics offer a comprehensive view of risk.<\/p><p><b>A and C are incorrect.<\/b> Statement 1 is not correct. While Statement 2 is correct, Statement 1 falsely claims that Factor B has the highest downside risk.<\/p><p>According to Exhibit 1, Factor B has the lowest maximum drawdown (10.2%) and the lowest standard deviation of returns (1.7%). The highest downside risk is seen in Factor C, which has the highest maximum drawdown (50.6%) and the highest VaR (7.6%).<\/p><p class=\"los\">Portfolio Management, Learning Module 4: Backtesting and Simulation, LOS 4(g): explain inputs and decisions in simulation and interpret a simulation.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 65–68 · Casper Smalls<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Casper Smalls is a senior analyst at Smithson Consulting. The firm specializes in equity<\/p><p>strategies assessment with the help of backtesting and simulation techniques. Smalls is currently<\/p><p>developing a nine-factor portfolio strategy with the help of his assistant, Peter Croft. Smalls<\/p><p>requests Croft determine data availability from vendor databases and select the investment<\/p><p>universe. The most reliable vendor database does not give point-in-time data. Thus, a reporting<\/p><p>lag of 5 months and an adjustment to include point-in-time will need to be carried out.<\/p><p>Next, an initial backtest on the nine-factor portfolio is conducted, calculating key metrics and<\/p><p>performance statistics. Using a rolling window procedure, the portfolio will be rebalanced<\/p><p>monthly over a 20-year time horizon for the purpose of backtesting. Croft considers a range of<\/p><p>metrics to assess the outcome of the factor portfolio backtest and presents the result of three of<\/p><p>the nine-factor strategies in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0070.webp\" style=\"max-width:min(100%,526px)\" alt=\"Exhibit 1: Metrics for Factor Strategies Factor A Factor B Factor C Maximum drawdown 30.2% 10.2% 50.6% VaR (95%) 2.5% −1.8% 7.6% The standard deviation of returns 3.1% 1.7% 5.2%\"><p>Croft makes the following statement:<\/p><p>Statement 1: Factor B has the highest downside risk.<\/p><p>Statement 2: We need to consider maximum drawdown and standard deviation.<\/p><p>From experience, Smalls knows that risk parity factors and benchmark portfolios are popular<\/p><p>with high-net-worth clients and institutions. Smalls requests Croft to design a risk parity<\/p><p>portfolio (E) and a benchmark portfolio (X) and run two simulations that generate investment<\/p><p>performance data, assuming 500 simulation trials for each of the following approaches:<\/p><p>Approach 1: Monte Carlo simulation<\/p><p>Approach 2: Historical Simulation.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Croft&#x27;s statements regarding Exhibit 1 is correct?<\/p><\/div>", "subj": "portfolio"}, {"n": 68, "q": "Approach 1(Monte Carlo simulation) is different from Approach 2 (historical simulation) in that:", "opts": ["Monte Carlo simulation uses historical data to predict future outcomes, while historical simulation uses random samples to model different scenarios.", "Monte Carlo simulation can incorporate various probability distributions, while historical simulation relies solely on past data.", "Monte Carlo simulation is less flexible in modeling complex scenarios than historical simulation, which can easily handle various distributions."], "ans": "B", "expl": "Monte Carlo simulation is a versatile approach that incorporates various probability distributions to model uncertainty and variability in different scenarios. It generates random samples based on these distributions to predict future outcomes. On the other hand, historical simulation is limited to using past data without involving different probability distributions, relying solely on historical returns or changes to project future performance. A is incorrect. This statement is incorrect because it mischaracterizes the two approaches. In reality, historical simulation uses historical data to predict future outcomes, while Monte Carlo simulation uses random samples generated from specified probability distributions. C is incorrect. This statement is incorrect because it reverses the flexibility of the two methods. Monte Carlo simulation is more flexible in modeling complex scenarios as it can incorporate various probability distributions, unlike historical simulation, which is limited to past data and cannot handle multiple distributions as effectively.", "explhtml": "<p>Monte Carlo simulation is a versatile approach that incorporates various probability distributions to model uncertainty and variability in different scenarios. It generates random samples based on these distributions to predict future outcomes. On the other hand, historical simulation is limited to using past data without involving different probability distributions, relying solely on historical returns or changes to project future performance.<\/p><p><b>A is incorrect.<\/b> This statement is incorrect because it mischaracterizes the two approaches. In reality, historical simulation uses historical data to predict future outcomes, while Monte Carlo simulation uses random samples generated from specified probability distributions.<\/p><p><b>C is incorrect.<\/b> This statement is incorrect because it reverses the flexibility of the two methods. Monte Carlo simulation is more flexible in modeling complex scenarios as it can incorporate various probability distributions, unlike historical simulation, which is limited to past data and cannot handle multiple distributions as effectively.<\/p><p class=\"los\">Portfolio Management, Learning Module 4: Backtesting and Simulation, LOS 4(g): explain inputs and decisions in simulation and interpret a simulation.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 65–68 · Casper Smalls<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Casper Smalls is a senior analyst at Smithson Consulting. The firm specializes in equity<\/p><p>strategies assessment with the help of backtesting and simulation techniques. Smalls is currently<\/p><p>developing a nine-factor portfolio strategy with the help of his assistant, Peter Croft. Smalls<\/p><p>requests Croft determine data availability from vendor databases and select the investment<\/p><p>universe. The most reliable vendor database does not give point-in-time data. Thus, a reporting<\/p><p>lag of 5 months and an adjustment to include point-in-time will need to be carried out.<\/p><p>Next, an initial backtest on the nine-factor portfolio is conducted, calculating key metrics and<\/p><p>performance statistics. Using a rolling window procedure, the portfolio will be rebalanced<\/p><p>monthly over a 20-year time horizon for the purpose of backtesting. Croft considers a range of<\/p><p>metrics to assess the outcome of the factor portfolio backtest and presents the result of three of<\/p><p>the nine-factor strategies in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0070.webp\" style=\"max-width:min(100%,526px)\" alt=\"Exhibit 1: Metrics for Factor Strategies Factor A Factor B Factor C Maximum drawdown 30.2% 10.2% 50.6% VaR (95%) 2.5% −1.8% 7.6% The standard deviation of returns 3.1% 1.7% 5.2%\"><p>Croft makes the following statement:<\/p><p>Statement 1: Factor B has the highest downside risk.<\/p><p>Statement 2: We need to consider maximum drawdown and standard deviation.<\/p><p>From experience, Smalls knows that risk parity factors and benchmark portfolios are popular<\/p><p>with high-net-worth clients and institutions. Smalls requests Croft to design a risk parity<\/p><p>portfolio (E) and a benchmark portfolio (X) and run two simulations that generate investment<\/p><p>performance data, assuming 500 simulation trials for each of the following approaches:<\/p><p>Approach 1: Monte Carlo simulation<\/p><p>Approach 2: Historical Simulation.<\/p><\/div><\/details><div class=\"qtext\"><p>Approach 1(Monte Carlo simulation) is different from Approach 2 (historical simulation) in that:<\/p><\/div>", "subj": "portfolio"}, {"n": 69, "q": "To tackle Concern 3 in the design of Approach 1, Webster should:", "opts": ["Use a multivariate distribution instead of modelling each Factor or asset individually.", "Determine the 18 elements of the covariance matrix necessary for model calibration.", "Treat each Factor or asset independently in the modelling process."], "ans": "A", "expl": "In the context of Monte Carlo simulation, when returns from multiple factors are correlated (as indicated by Concern 3), it is essential to use a multivariate distribution. This approach captures the dependencies and relationships between the factors, ensuring that the correlations among the returns are accurately reflected in the simulation. Modelling each Factor or asset individually would ignore these correlations, potentially leading to inaccurate and misleading simulation results. B is incorrect. While determining the covariance matrix elements is crucial for understanding the relationships between factors, it is a step within the broader process of specifying a multivariate distribution. Determining the covariance matrix does not directly address the need to model the correlations during simulation. C is incorrect. Treating each Factor or asset independently ignores the existing correlations between the factors. Since the returns of seven of the ten factors are correlated, modeling them independently would fail to capture these relationships, leading to inaccurate simulation outcomes. This approach directly contradicts the need to account for the correlations highlighted in Concern 3.", "explhtml": "<p>In the context of Monte Carlo simulation, when returns from multiple factors are correlated (as indicated by Concern 3), it is essential to use a multivariate distribution. This approach captures the dependencies and relationships between the factors, ensuring that the correlations among the returns are accurately reflected in the simulation. Modelling each Factor or asset individually would ignore these correlations, potentially leading to inaccurate and misleading simulation results.<\/p><p><b>B is incorrect.<\/b> While determining the covariance matrix elements is crucial for understanding the relationships between factors, it is a step within the broader process of specifying a multivariate distribution. Determining the covariance matrix does not directly address the need to model the correlations during simulation.<\/p><p><b>C is incorrect.<\/b> Treating each Factor or asset independently ignores the existing correlations between the factors. Since the returns of seven of the ten factors are correlated, modeling them independently would fail to capture these relationships, leading to inaccurate simulation outcomes. This approach directly contradicts the need to account for the correlations highlighted in Concern 3.<\/p><p class=\"los\">Portfolio Management, Learning Module 4: Backtesting and Simulation, LOS 4(b): Describe and contrast steps and procedures in backtesting an investment strategy.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 69–72 · Maxwell Webster<\/summary><div class=\"vig-body\"><p>Maxwell Webster is a senior analyst at Caspian Consulting. The firm specializes in equity<\/p><p>strategies assessment with the help of backtesting and simulation techniques. Smalls is currently<\/p><p>developing a ten-factor portfolio strategy with the help of his assistant, Laura Cooks. Webster<\/p><p>requests Cooks to determine data availability from vendor databases and select the investment<\/p><p>universe. The most reliable vendor database does not give point-in-time data. Thus, a reporting<\/p><p>lag of 5 months and an adjustment to include point-in-time will need to be carried out.<\/p><p>Next, an initial backtest on the nine-factor portfolio is conducted, calculating key metrics and<\/p><p>performance statistics. Using a rolling window procedure, the portfolio will be rebalanced<\/p><p>monthly over a 20-year time horizon for backtesting. Cooks considers a range of metrics to<\/p><p>assess the outcome of the factor portfolio backtest and presents the result of three of the nine-<\/p><p>factor strategies in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0071.webp\" style=\"max-width:min(100%,643px)\" alt=\"Exhibit 1: Metrics for Factor Strategies Factor A Factor B Factor C Maximum drawdown 29.2% 11.2% 50.6% VaR (95%) −3.5% −2.8% −8.6% The standard deviation of returns 4.1% 1.8% 6.2%\"><p>From experience, Webster knows that risk parity factors and benchmark portfolios are popular<\/p><p>with high-net-worth clients and institutions. Webster requests Cooks to design a risk parity<\/p><p>portfolio (X) and a benchmark portfolio (Y)and run two simulations that generate investment<\/p><p>performance data, assuming 500 simulation trials for each of the following approaches:<\/p><p>Approach 1: Monte Carlo simulation<\/p><p>Approach 2: Historical Simulation.<\/p><p>Webster and Cooks point out the differences between Monte Carlo and historical simulations and<\/p><p>design both simulations. At different stages, critical decisions are made, but Webster has some<\/p><p>concerns:<\/p><p>Concern 1: Approach 2 needs more simulations due to the historical dataset size Concern 2: Negative skewness and excess kurtosis are exhibited in the distribution of Factor A<\/p><p>Concern 3: Returns from seven of the ten factors are correlated.<\/p><p>Webster and Cooks run 2,000 trials and get 2,000 returns for portfolios X and Y. To understand<\/p><p>excess kurtosis and the effect of skewness observed in Factor A returns on portfolios A and Y,<\/p><p>Cooks recommends generating an additional 1,000 factor returns utilizing a multivariate skewed<\/p><p>Student&#x27;s t-distribution, then rerunning the Approach 1 simulation.<\/p><\/div><\/details><div class=\"qtext\"><p>To tackle Concern 3 in the design of Approach 1, Webster should:<\/p><\/div>", "subj": "portfolio"}, {"n": 70, "q": "Considering Concern 2, the Factor A strategy is most likely to:", "opts": ["Resulting in unexpected negative returns.", "Exhibit return data that closely follows a trend line.", "Appeal to risk-averse investors."], "ans": "A", "expl": "The distribution of Factor A returns exhibits excess kurtosis and negative skewness. Excess kurtosis suggests that the returns are prone to extreme values, implying a higher probability of significant surprises. Negative skewness indicates that these surprises are more likely to be negative. Hence, the Factor A strategy will likely lead to unexpected negative returns. B is incorrect. The distribution of Factor A returns lacks properties that align closely around a trend line. Excess kurtosis and negative skewness imply that the returns have fat tails and outliers, disrupting the consistency and predictability of a trend line. C is incorrect. Risk-averse investors prefer distributions with positive skew (greater likelihood of positive returns) and lower to moderate kurtosis (lower probability of extreme negative surprises). The excess kurtosis and negative skewness in Factor A's returns make it less appealing to risk-averse investors due to the higher likelihood of significant negative returns.", "explhtml": "<p>The distribution of Factor A returns exhibits excess kurtosis and negative skewness. Excess kurtosis suggests that the returns are prone to extreme values, implying a higher probability of significant surprises. Negative skewness indicates that these surprises are more likely to be negative. Hence, the Factor A strategy will likely lead to unexpected negative returns.<\/p><p><b>B is incorrect.<\/b> The distribution of Factor A returns lacks properties that align closely around a trend line. Excess kurtosis and negative skewness imply that the returns have fat tails and outliers, disrupting the consistency and predictability of a trend line.<\/p><p><b>C is incorrect.<\/b> Risk-averse investors prefer distributions with positive skew (greater likelihood of positive returns) and lower to moderate kurtosis (lower probability of extreme negative surprises). The excess kurtosis and negative skewness in Factor A&#x27;s returns make it less appealing to risk-averse investors due to the higher likelihood of significant negative returns.<\/p><p class=\"los\">CFA Level II, Study Session 15, Reading 41: Backtesting and Simulation, LOS 41(b): Describe and contrast steps and procedures in backtesting an investment strategy.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 69–72 · Maxwell Webster<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Maxwell Webster is a senior analyst at Caspian Consulting. The firm specializes in equity<\/p><p>strategies assessment with the help of backtesting and simulation techniques. Smalls is currently<\/p><p>developing a ten-factor portfolio strategy with the help of his assistant, Laura Cooks. Webster<\/p><p>requests Cooks to determine data availability from vendor databases and select the investment<\/p><p>universe. The most reliable vendor database does not give point-in-time data. Thus, a reporting<\/p><p>lag of 5 months and an adjustment to include point-in-time will need to be carried out.<\/p><p>Next, an initial backtest on the nine-factor portfolio is conducted, calculating key metrics and<\/p><p>performance statistics. Using a rolling window procedure, the portfolio will be rebalanced<\/p><p>monthly over a 20-year time horizon for backtesting. Cooks considers a range of metrics to<\/p><p>assess the outcome of the factor portfolio backtest and presents the result of three of the nine-<\/p><p>factor strategies in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0071.webp\" style=\"max-width:min(100%,643px)\" alt=\"Exhibit 1: Metrics for Factor Strategies Factor A Factor B Factor C Maximum drawdown 29.2% 11.2% 50.6% VaR (95%) −3.5% −2.8% −8.6% The standard deviation of returns 4.1% 1.8% 6.2%\"><p>From experience, Webster knows that risk parity factors and benchmark portfolios are popular<\/p><p>with high-net-worth clients and institutions. Webster requests Cooks to design a risk parity<\/p><p>portfolio (X) and a benchmark portfolio (Y)and run two simulations that generate investment<\/p><p>performance data, assuming 500 simulation trials for each of the following approaches:<\/p><p>Approach 1: Monte Carlo simulation<\/p><p>Approach 2: Historical Simulation.<\/p><p>Webster and Cooks point out the differences between Monte Carlo and historical simulations and<\/p><p>design both simulations. At different stages, critical decisions are made, but Webster has some<\/p><p>concerns:<\/p><p>Concern 1: Approach 2 needs more simulations due to the historical dataset size Concern 2: Negative skewness and excess kurtosis are exhibited in the distribution of Factor A<\/p><p>Concern 3: Returns from seven of the ten factors are correlated.<\/p><p>Webster and Cooks run 2,000 trials and get 2,000 returns for portfolios X and Y. To understand<\/p><p>excess kurtosis and the effect of skewness observed in Factor A returns on portfolios A and Y,<\/p><p>Cooks recommends generating an additional 1,000 factor returns utilizing a multivariate skewed<\/p><p>Student&#x27;s t-distribution, then rerunning the Approach 1 simulation.<\/p><\/div><\/details><div class=\"qtext\"><p>Considering Concern 2, the Factor A strategy is most likely to:<\/p><\/div>", "subj": "portfolio"}, {"n": 71, "q": "To tackle Concern 1 in designing Approach 2, Webster should:", "opts": ["Incorporate monthly return observations into the dataset through interpolation.", "Employ random sampling with replacement from the historical returns.", "Select the multivariate normal distribution as the initial functional form."], "ans": "B", "expl": "Random sampling with replacement, or bootstrapping, is commonly used in historical simulations when the dataset size is insufficient for the number of simulations required. For Approach 2, a historical simulation, Concern 1 highlights the need for more simulations than the available historical data can support. Bootstrapping effectively addresses this by allowing repeated sampling from the existing dataset, thus generating the necessary number of simulations while maintaining the integrity of historical data. A is incorrect. Interpolation would create synthetic data points that do not exist in the historical record. Historical simulations rely on actual observed data, and introducing fabricated observations through interpolation would compromise the accuracy and authenticity of the simulation. C is incorrect. Choosing a distribution model, such as the multivariate normal distribution, is used in Monte Carlo simulations (Approach 1) rather than historical simulations (Approach 2). Historical simulation involves random sampling from the historical dataset using a uniform probability distribution, and selecting an initial functional form does not address the issue of the dataset size.", "explhtml": "<p>Random sampling with replacement, or bootstrapping, is commonly used in historical simulations when the dataset size is insufficient for the number of simulations required. For Approach 2, a historical simulation, Concern 1 highlights the need for more simulations than the available historical data can support. Bootstrapping effectively addresses this by allowing repeated sampling from the existing dataset, thus generating the necessary number of simulations while maintaining the integrity of historical data.<\/p><p><b>A is incorrect.<\/b> Interpolation would create synthetic data points that do not exist in the historical record. Historical simulations rely on actual observed data, and introducing fabricated observations through interpolation would compromise the accuracy and authenticity of the simulation.<\/p><p><b>C is incorrect.<\/b> Choosing a distribution model, such as the multivariate normal distribution, is used in Monte Carlo simulations (Approach 1) rather than historical simulations (Approach 2). Historical simulation involves random sampling from the historical dataset using a uniform probability distribution, and selecting an initial functional form does not address the issue of the dataset size.<\/p><p class=\"los\">Portfolio Management, Learning Module 4: Backtesting and Simulation, LOS 4(f): Contrast Monte Carlo and historical simulation approaches.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 69–72 · Maxwell Webster<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Maxwell Webster is a senior analyst at Caspian Consulting. The firm specializes in equity<\/p><p>strategies assessment with the help of backtesting and simulation techniques. Smalls is currently<\/p><p>developing a ten-factor portfolio strategy with the help of his assistant, Laura Cooks. Webster<\/p><p>requests Cooks to determine data availability from vendor databases and select the investment<\/p><p>universe. The most reliable vendor database does not give point-in-time data. Thus, a reporting<\/p><p>lag of 5 months and an adjustment to include point-in-time will need to be carried out.<\/p><p>Next, an initial backtest on the nine-factor portfolio is conducted, calculating key metrics and<\/p><p>performance statistics. Using a rolling window procedure, the portfolio will be rebalanced<\/p><p>monthly over a 20-year time horizon for backtesting. Cooks considers a range of metrics to<\/p><p>assess the outcome of the factor portfolio backtest and presents the result of three of the nine-<\/p><p>factor strategies in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0071.webp\" style=\"max-width:min(100%,643px)\" alt=\"Exhibit 1: Metrics for Factor Strategies Factor A Factor B Factor C Maximum drawdown 29.2% 11.2% 50.6% VaR (95%) −3.5% −2.8% −8.6% The standard deviation of returns 4.1% 1.8% 6.2%\"><p>From experience, Webster knows that risk parity factors and benchmark portfolios are popular<\/p><p>with high-net-worth clients and institutions. Webster requests Cooks to design a risk parity<\/p><p>portfolio (X) and a benchmark portfolio (Y)and run two simulations that generate investment<\/p><p>performance data, assuming 500 simulation trials for each of the following approaches:<\/p><p>Approach 1: Monte Carlo simulation<\/p><p>Approach 2: Historical Simulation.<\/p><p>Webster and Cooks point out the differences between Monte Carlo and historical simulations and<\/p><p>design both simulations. At different stages, critical decisions are made, but Webster has some<\/p><p>concerns:<\/p><p>Concern 1: Approach 2 needs more simulations due to the historical dataset size Concern 2: Negative skewness and excess kurtosis are exhibited in the distribution of Factor A<\/p><p>Concern 3: Returns from seven of the ten factors are correlated.<\/p><p>Webster and Cooks run 2,000 trials and get 2,000 returns for portfolios X and Y. To understand<\/p><p>excess kurtosis and the effect of skewness observed in Factor A returns on portfolios A and Y,<\/p><p>Cooks recommends generating an additional 1,000 factor returns utilizing a multivariate skewed<\/p><p>Student&#x27;s t-distribution, then rerunning the Approach 1 simulation.<\/p><\/div><\/details><div class=\"qtext\"><p>To tackle Concern 1 in designing Approach 2, Webster should:<\/p><\/div>", "subj": "portfolio"}, {"n": 72, "q": "The process Cooks recommends to understand how the performance of Portfolios X and Y using Approach 1 is influenced by the distribution of Factor A returns can be best described as:", "opts": ["Sensitivity Analysis", "Inverse transformation", "P-hacking"], "ans": "A", "expl": "Sensitivity analysis determines how different variables impact a particular outcome or performance. In this context, Cooks' recommendation to generate additional factor returns and rerun the simulation aligns with sensitivity analysis. This process helps to understand how variations in the distribution of Factor A returns affect the performance of Portfolios X and Y. By examining these changes, Webster and Cooks can identify the potential impact of negative skewness and excess kurtosis on the portfolios. B is incorrect. Inverse transformation involves mathematical techniques to transform a distribution or data set. It is not related to analyzing how variable changes impact performance, which is the goal of Cooks\" suggestion. The context does not indicate the need to transform the data; instead, it is crucial to understand the impact of its existing characteristics. C is incorrect. P-hacking refers to manipulating data or statistical analysis until significant results are found, which is not a valid or ethical research practice. Ruckey's recommendation focuses on a legitimate method (sensitivity analysis) to understand performance impacts rather than manipulating data to achieve desired outcomes.", "explhtml": "<p>Sensitivity analysis determines how different variables impact a particular outcome or performance. In this context, Cooks&#x27; recommendation to generate additional factor returns and rerun the simulation aligns with sensitivity analysis. This process helps to understand how variations in the distribution of Factor A returns affect the performance of Portfolios X and Y. By examining these changes, Webster and Cooks can identify the potential impact of negative skewness and excess kurtosis on the portfolios.<\/p><p><b>B is incorrect.<\/b> Inverse transformation involves mathematical techniques to transform a distribution or data set. It is not related to analyzing how variable changes impact performance, which is the goal of Cooks&quot; suggestion. The context does not indicate the need to transform the data; instead, it is crucial to understand the impact of its existing characteristics.<\/p><p><b>C is incorrect.<\/b> P-hacking refers to manipulating data or statistical analysis until significant results are found, which is not a valid or ethical research practice. Ruckey&#x27;s recommendation focuses on a legitimate method (sensitivity analysis) to understand performance impacts rather than manipulating data to achieve desired outcomes.<\/p><p class=\"los\">Portfolio Management, Learning Module 4: Backtesting and Simulation, LOS 4(h): Demonstrate the use of sensitivity analysis.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 69–72 · Maxwell Webster<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Maxwell Webster is a senior analyst at Caspian Consulting. The firm specializes in equity<\/p><p>strategies assessment with the help of backtesting and simulation techniques. Smalls is currently<\/p><p>developing a ten-factor portfolio strategy with the help of his assistant, Laura Cooks. Webster<\/p><p>requests Cooks to determine data availability from vendor databases and select the investment<\/p><p>universe. The most reliable vendor database does not give point-in-time data. Thus, a reporting<\/p><p>lag of 5 months and an adjustment to include point-in-time will need to be carried out.<\/p><p>Next, an initial backtest on the nine-factor portfolio is conducted, calculating key metrics and<\/p><p>performance statistics. Using a rolling window procedure, the portfolio will be rebalanced<\/p><p>monthly over a 20-year time horizon for backtesting. Cooks considers a range of metrics to<\/p><p>assess the outcome of the factor portfolio backtest and presents the result of three of the nine-<\/p><p>factor strategies in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0071.webp\" style=\"max-width:min(100%,643px)\" alt=\"Exhibit 1: Metrics for Factor Strategies Factor A Factor B Factor C Maximum drawdown 29.2% 11.2% 50.6% VaR (95%) −3.5% −2.8% −8.6% The standard deviation of returns 4.1% 1.8% 6.2%\"><p>From experience, Webster knows that risk parity factors and benchmark portfolios are popular<\/p><p>with high-net-worth clients and institutions. Webster requests Cooks to design a risk parity<\/p><p>portfolio (X) and a benchmark portfolio (Y)and run two simulations that generate investment<\/p><p>performance data, assuming 500 simulation trials for each of the following approaches:<\/p><p>Approach 1: Monte Carlo simulation<\/p><p>Approach 2: Historical Simulation.<\/p><p>Webster and Cooks point out the differences between Monte Carlo and historical simulations and<\/p><p>design both simulations. At different stages, critical decisions are made, but Webster has some<\/p><p>concerns:<\/p><p>Concern 1: Approach 2 needs more simulations due to the historical dataset size Concern 2: Negative skewness and excess kurtosis are exhibited in the distribution of Factor A<\/p><p>Concern 3: Returns from seven of the ten factors are correlated.<\/p><p>Webster and Cooks run 2,000 trials and get 2,000 returns for portfolios X and Y. To understand<\/p><p>excess kurtosis and the effect of skewness observed in Factor A returns on portfolios A and Y,<\/p><p>Cooks recommends generating an additional 1,000 factor returns utilizing a multivariate skewed<\/p><p>Student&#x27;s t-distribution, then rerunning the Approach 1 simulation.<\/p><\/div><\/details><div class=\"qtext\"><p>The process Cooks recommends to understand how the performance of Portfolios X and Y using Approach 1 is influenced by the distribution of Factor A returns can be best described as:<\/p><\/div>", "subj": "portfolio"}, {"n": 73, "q": "Based on the macroeconomic conditions described in the vignette, the flattening of the US Treasury yield curve is most likely a signal that bond market participants anticipate:", "opts": ["A period of sustained high inflation.", "That the Federal Reserve will continue to aggressively raise short-term rates.", "A future economic slowdown and potentially lower future short-term interest rates."], "ans": "C", "expl": "A significant flattening of the yield curve during the late expansion phase, coupled with softening leading indicators, typically signals that bond market participants anticipate an economic slowdown. This expectation leads to the forecast that the central bank will cut future short-term rates, which pulls down longer-term yields and flattens the curve. A is incorrect. Sustained high inflation expectations would typically lead to a steeper yield curve. B is incorrect. While aggressive rate hikes can also flatten the curve, the context of softening indicators points to an expectation of the cycle ending, not continuing.", "explhtml": "<p>A significant flattening of the yield curve during the <b>late expansion phase<\/b>, coupled with softening leading indicators, typically signals that bond market participants anticipate an <b>economic slowdown<\/b>. This expectation leads to the forecast that the central bank will <b>cut<\/b> <b>future short-term rates<\/b>, which pulls down longer-term yields and flattens the curve.<\/p><p><b>A is incorrect.<\/b> Sustained high inflation expectations would typically lead to a steeper yield curve.<\/p><p><b>B is incorrect.<\/b> While aggressive rate hikes can also flatten the curve, the context of softening indicators points to an expectation of the cycle ending, not continuing.<\/p><p class=\"los\">Portfolio Management, Learning Module 1: Economics and Investment Markets, LOS 1(d): Explain how the phase of the business cycle affects policy and short-term interest rates, the slope of the term structure of interest rates, and the relative performance of bonds of differing maturities.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 73–76 · Max Cutler<\/summary><div class=\"vig-body\"><p>Max Cutler, CFA, is a portfolio manager at Marrius Partners Limited, a US-based hedge fund. He<\/p><p>is preparing the firm&#x27;s quarterly tactical asset allocation review amidst a complex<\/p><p>macroeconomic backdrop. The US economy is in the late expansion phase of the business cycle.<\/p><p>The Federal Reserve has been raising its policy rate to combat inflation, which is currently<\/p><p>running at 3.5% and is above its 2.0% target. The current real short-term policy rate is estimated<\/p><p>at 1.0%. Cutler observes that the US Treasury yield curve, which was upward sloping a year ago,<\/p><p>has now flattened significantly. The 10-year/2-year term spread has narrowed from +150 basis<\/p><p>points (bps) to just +25 bps. Cutler notes that while the headline unemployment rate remains<\/p><p>low, leading economic indicators have begun to soften.<\/p><p>In his analysis of fixed-income markets, Cutler turns his attention to inflation-linked bonds. He<\/p><p>observes that the yield on a 10-year US Treasury Inflation-Protected Security (TIPS) is 1.8%. The<\/p><p>yield on a standard 10-year US Treasury note is 4.3%. This implies a break-even inflation (BEI)<\/p><p>rate of 2.5%. Cutler recalls that this BEI rate is not a pure measure of inflation expectations; it<\/p><p>also contains a risk premium for inflation uncertainty.<\/p><p>Next, Cutler analyzes the corporate bond market. Marrius Partners holds a portfolio of corporate<\/p><p>bonds across various ratings and sectors. He is particularly concerned about holdings in<\/p><p>&quot;Cyclico,&quot; a Baa-rated consumer discretionary company, and &quot;StapleCorp,&quot; an A-rated consumer<\/p><p>staples company. The spread on Cyclico&#x27;s 5-year bond is currently 285 bps over the 5-year<\/p><p>Treasury, while StapleCorp&#x27;s spread is 120 bps. Cutler is evaluating the potential impact of an<\/p><p>economic downturn on these positions.<\/p><p>Finally, Cutler reviews the firm&#x27;s equity portfolio. The S&amp;P 500 is currently trading at a trailing<\/p><p>Price-to-Earnings (P/E) ratio of 20.5, which is above its 15-year historical average of 17.0. A<\/p><p>junior analyst argues that this high P/E is unjustified. However, Cutler believes there are<\/p><p>macroeconomic factors that could support a higher equilibrium P/E. He considers the recent<\/p><p>decline in the volatility of US GDP growth, a decrease in the equity risk premium due to<\/p><p>persistent demand for equities, and the current, relatively high inflation environment.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the macroeconomic conditions described in the vignette, the flattening of the US Treasury yield curve is most likely a signal that bond market participants anticipate:<\/p><\/div>", "subj": "portfolio"}, {"n": 74, "q": "Based on the data provided in the vignette, and assuming the risk premium for inflation uncertainty embedded in the 10-year break-even inflation rate is 0.4%, the market's true expectation for average annual inflation over the next 10 years is closest to:", "opts": ["2.1%.", "2.5%.", "2.9%."], "ans": "A", "expl": "The break-even inflation (BEI) rate is the difference between the yield on a nominal default-free bond and the yield on a real default-free bond of the same maturity. It consists of two components: investors' inflation expectations θt,s and a risk premium for uncertainty about future inflation πt,s. The formula is: We are given: BEI = 4.3% −1.8% = 2.5% πt,s = 0.4% Therefore, the inflation expectation is:θt,s = BEI − πt,s = 2.5% − 0.4% = 2.1%. B is incorrect. 2.5% is the raw BEI, not the market's pure inflation expectation. C is incorrect. 2.9% results from adding instead of subtracting the risk premium.", "explhtml": "<p>The break-even inflation (BEI) rate is the difference between the yield on a nominal default-free bond and the yield on a real default-free bond of the same maturity. It consists of two components: investors&#x27; inflation expectations θ<sub>t,s<\/sub> and a risk premium for uncertainty about future inflation π<sub>t,s<\/sub>.<\/p><p>The formula is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap09/f0072.webp\" style=\"max-width:min(100%,127px)\" alt=\"BEI = θt,s + πt,s\"><p>We are given:<\/p><p>BEI = 4.3% −1.8% = 2.5%<\/p><p>π<sub>t,s<\/sub> = 0.4%<\/p><p>Therefore, the inflation expectation is:θ<sub>t,s<\/sub> = BEI − π<sub>t,s<\/sub> = 2.5% − 0.4% = 2.1%.<\/p><p><b>B is incorrect.<\/b> 2.5% is the raw BEI, not the market&#x27;s pure inflation expectation.<\/p><p><b>C is incorrect.<\/b> 2.9% results from adding instead of subtracting the risk premium.<\/p><p class=\"los\">Portfolio Management, Learning Module 1: Economics and Investment Markets, LOS 1(e): Describe the factors that affect yield spreads between non-inflation-adjusted and inflation-indexed bonds.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 73–76 · Max Cutler<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Max Cutler, CFA, is a portfolio manager at Marrius Partners Limited, a US-based hedge fund. He<\/p><p>is preparing the firm&#x27;s quarterly tactical asset allocation review amidst a complex<\/p><p>macroeconomic backdrop. The US economy is in the late expansion phase of the business cycle.<\/p><p>The Federal Reserve has been raising its policy rate to combat inflation, which is currently<\/p><p>running at 3.5% and is above its 2.0% target. The current real short-term policy rate is estimated<\/p><p>at 1.0%. Cutler observes that the US Treasury yield curve, which was upward sloping a year ago,<\/p><p>has now flattened significantly. The 10-year/2-year term spread has narrowed from +150 basis<\/p><p>points (bps) to just +25 bps. Cutler notes that while the headline unemployment rate remains<\/p><p>low, leading economic indicators have begun to soften.<\/p><p>In his analysis of fixed-income markets, Cutler turns his attention to inflation-linked bonds. He<\/p><p>observes that the yield on a 10-year US Treasury Inflation-Protected Security (TIPS) is 1.8%. The<\/p><p>yield on a standard 10-year US Treasury note is 4.3%. This implies a break-even inflation (BEI)<\/p><p>rate of 2.5%. Cutler recalls that this BEI rate is not a pure measure of inflation expectations; it<\/p><p>also contains a risk premium for inflation uncertainty.<\/p><p>Next, Cutler analyzes the corporate bond market. Marrius Partners holds a portfolio of corporate<\/p><p>bonds across various ratings and sectors. He is particularly concerned about holdings in<\/p><p>&quot;Cyclico,&quot; a Baa-rated consumer discretionary company, and &quot;StapleCorp,&quot; an A-rated consumer<\/p><p>staples company. The spread on Cyclico&#x27;s 5-year bond is currently 285 bps over the 5-year<\/p><p>Treasury, while StapleCorp&#x27;s spread is 120 bps. Cutler is evaluating the potential impact of an<\/p><p>economic downturn on these positions.<\/p><p>Finally, Cutler reviews the firm&#x27;s equity portfolio. The S&amp;P 500 is currently trading at a trailing<\/p><p>Price-to-Earnings (P/E) ratio of 20.5, which is above its 15-year historical average of 17.0. A<\/p><p>junior analyst argues that this high P/E is unjustified. However, Cutler believes there are<\/p><p>macroeconomic factors that could support a higher equilibrium P/E. He considers the recent<\/p><p>decline in the volatility of US GDP growth, a decrease in the equity risk premium due to<\/p><p>persistent demand for equities, and the current, relatively high inflation environment.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the data provided in the vignette, and assuming the risk premium for inflation uncertainty embedded in the 10-year break-even inflation rate is 0.4%, the market&#x27;s true expectation for average annual inflation over the next 10 years is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 75, "q": "Considering the characteristics of the corporate bonds held by Marrius Partners, if Cutler's forecast for an economic downturn is realized, which bond is most likely to experience the most significant widening of its credit spread?", "opts": ["The StapleCorp bond, because its higher rating makes it more sensitive to systemic economic risk.", "The Cyclico bond, due to its combination of lower credit rating and higher business cycle sensitivity.", "The Cyclico bond, but only if the recovery rate for consumer discretionary firms is expected to be higher than average."], "ans": "B", "expl": "Credit spreads are most sensitive to economic downturns for issuers with lower credit ratings (higher default probability) and higher cyclicality (greater sensitivity to the business cycle). Cyclico (Baa-rated, Consumer Discretionary) combines both characteristics, making its spread likely to widen more significantly than that of StapleCorp (A-rated, Consumer Staples). A is incorrect. Higher-rated bonds in defensive sectors are less sensitive to systemic economic risk than lower-rated cyclical bonds. C is incorrect. The recovery rate is a secondary consideration; the primary driver of spread widening is the increased probability of default. Recovery rates for cyclical firms are typically lower in downturns, which would exacerbate, not mitigate, spread widening.", "explhtml": "<p>Credit spreads are most sensitive to economic downturns for issuers with <b>lower credit ratings<\/b> (higher default probability) and <b>higher cyclicality<\/b> (greater sensitivity to the business cycle). Cyclico (Baa-rated, Consumer Discretionary) combines both characteristics, making its spread likely to widen more significantly than that of StapleCorp (A-rated, Consumer Staples).<\/p><p><b>A is incorrect.<\/b> Higher-rated bonds in defensive sectors are less sensitive to systemic economic risk than lower-rated cyclical bonds.<\/p><p><b>C is incorrect.<\/b> The recovery rate is a secondary consideration; the primary driver of spread widening is the increased probability of default. Recovery rates for cyclical firms are typically lower in downturns, which would exacerbate, not mitigate, spread widening.<\/p><p class=\"los\">Portfolio Management, Learning Module 1: Economic and Investment Markets, LOS 1(f): Explain how the phase of the business cycle affects credit spreads and the performance of credit-sensitive fixed-income instruments.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 73–76 · Max Cutler<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Max Cutler, CFA, is a portfolio manager at Marrius Partners Limited, a US-based hedge fund. He<\/p><p>is preparing the firm&#x27;s quarterly tactical asset allocation review amidst a complex<\/p><p>macroeconomic backdrop. The US economy is in the late expansion phase of the business cycle.<\/p><p>The Federal Reserve has been raising its policy rate to combat inflation, which is currently<\/p><p>running at 3.5% and is above its 2.0% target. The current real short-term policy rate is estimated<\/p><p>at 1.0%. Cutler observes that the US Treasury yield curve, which was upward sloping a year ago,<\/p><p>has now flattened significantly. The 10-year/2-year term spread has narrowed from +150 basis<\/p><p>points (bps) to just +25 bps. Cutler notes that while the headline unemployment rate remains<\/p><p>low, leading economic indicators have begun to soften.<\/p><p>In his analysis of fixed-income markets, Cutler turns his attention to inflation-linked bonds. He<\/p><p>observes that the yield on a 10-year US Treasury Inflation-Protected Security (TIPS) is 1.8%. The<\/p><p>yield on a standard 10-year US Treasury note is 4.3%. This implies a break-even inflation (BEI)<\/p><p>rate of 2.5%. Cutler recalls that this BEI rate is not a pure measure of inflation expectations; it<\/p><p>also contains a risk premium for inflation uncertainty.<\/p><p>Next, Cutler analyzes the corporate bond market. Marrius Partners holds a portfolio of corporate<\/p><p>bonds across various ratings and sectors. He is particularly concerned about holdings in<\/p><p>&quot;Cyclico,&quot; a Baa-rated consumer discretionary company, and &quot;StapleCorp,&quot; an A-rated consumer<\/p><p>staples company. The spread on Cyclico&#x27;s 5-year bond is currently 285 bps over the 5-year<\/p><p>Treasury, while StapleCorp&#x27;s spread is 120 bps. Cutler is evaluating the potential impact of an<\/p><p>economic downturn on these positions.<\/p><p>Finally, Cutler reviews the firm&#x27;s equity portfolio. The S&amp;P 500 is currently trading at a trailing<\/p><p>Price-to-Earnings (P/E) ratio of 20.5, which is above its 15-year historical average of 17.0. A<\/p><p>junior analyst argues that this high P/E is unjustified. However, Cutler believes there are<\/p><p>macroeconomic factors that could support a higher equilibrium P/E. He considers the recent<\/p><p>decline in the volatility of US GDP growth, a decrease in the equity risk premium due to<\/p><p>persistent demand for equities, and the current, relatively high inflation environment.<\/p><\/div><\/details><div class=\"qtext\"><p>Considering the characteristics of the corporate bonds held by Marrius Partners, if Cutler&#x27;s forecast for an economic downturn is realized, which bond is most likely to experience the most significant widening of its credit spread?<\/p><\/div>", "subj": "portfolio"}, {"n": 76, "q": "According to the present value model of equity valuation, which of the macroeconomic factors cited by Cutler in the vignette would most likely support a justified increase in the equilibrium P/E ratio?", "opts": ["A decrease in the equity risk premium.", "A decrease in the volatility of GDP growth.", "The current, relatively high inflation environment."], "ans": "A", "expl": "In the present value model P = ∑ E(1(+CrF))n the P/E ratio is positively related to cash flow growth and inversely related to the discount rate (r). The discount rate r includes the equity risk premium (ERP). A decrease in the ERP directly lowers r, raising the present value of future cash flows and thus justifying a higher P/E ratio. B is incorrect. Lower GDP growth volatility could lower the real risk-free rate component of r, potentially supporting a higher P/E. However, a direct decrease in the ERP has a more potent and certain effect on lowering the discount rate for equities. C is incorrect. A high inflation environment would likely increase the nominal risk-free rate and potentially increase inflation uncertainty, raising r and putting downward pressure on P/E ratios.", "explhtml": "<p>In the present value model P = ∑<sup> E<\/sup><sub>(1<\/sub><sup>(<\/sup><sub>+<\/sub><sup>C<\/sup><sub>r<\/sub><sup>F<\/sup><sub>)<\/sub><sup>)<\/sup><sub>n<\/sub> the P/E ratio is positively related to cash flow growth and<\/p><p>inversely related to the discount rate (r). The discount rate r includes the equity risk premium (ERP). A <b>decrease in the ERP<\/b> directly <b>lowers r<\/b>, raising the present value of future cash flows and thus <b>justifying a higher P/E ratio<\/b>.<\/p><p><b>B is incorrect.<\/b> Lower GDP growth volatility could lower the real risk-free rate component of r, potentially supporting a higher P/E. However, a direct decrease in the ERP has a more potent and certain effect on lowering the discount rate for equities.<\/p><p><b>C is incorrect.<\/b> A high inflation environment would likely <b>increase<\/b> the nominal risk-free rate and potentially increase inflation uncertainty, raising r and putting downward pressure on P/E ratios.<\/p><p class=\"los\">Portfolio Management, Learning Module 1: Economics and Investment Markets, LOS 1(j): Describe cyclical effects on valuation multiples.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 73–76 · Max Cutler<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Max Cutler, CFA, is a portfolio manager at Marrius Partners Limited, a US-based hedge fund. He<\/p><p>is preparing the firm&#x27;s quarterly tactical asset allocation review amidst a complex<\/p><p>macroeconomic backdrop. The US economy is in the late expansion phase of the business cycle.<\/p><p>The Federal Reserve has been raising its policy rate to combat inflation, which is currently<\/p><p>running at 3.5% and is above its 2.0% target. The current real short-term policy rate is estimated<\/p><p>at 1.0%. Cutler observes that the US Treasury yield curve, which was upward sloping a year ago,<\/p><p>has now flattened significantly. The 10-year/2-year term spread has narrowed from +150 basis<\/p><p>points (bps) to just +25 bps. Cutler notes that while the headline unemployment rate remains<\/p><p>low, leading economic indicators have begun to soften.<\/p><p>In his analysis of fixed-income markets, Cutler turns his attention to inflation-linked bonds. He<\/p><p>observes that the yield on a 10-year US Treasury Inflation-Protected Security (TIPS) is 1.8%. The<\/p><p>yield on a standard 10-year US Treasury note is 4.3%. This implies a break-even inflation (BEI)<\/p><p>rate of 2.5%. Cutler recalls that this BEI rate is not a pure measure of inflation expectations; it<\/p><p>also contains a risk premium for inflation uncertainty.<\/p><p>Next, Cutler analyzes the corporate bond market. Marrius Partners holds a portfolio of corporate<\/p><p>bonds across various ratings and sectors. He is particularly concerned about holdings in<\/p><p>&quot;Cyclico,&quot; a Baa-rated consumer discretionary company, and &quot;StapleCorp,&quot; an A-rated consumer<\/p><p>staples company. The spread on Cyclico&#x27;s 5-year bond is currently 285 bps over the 5-year<\/p><p>Treasury, while StapleCorp&#x27;s spread is 120 bps. Cutler is evaluating the potential impact of an<\/p><p>economic downturn on these positions.<\/p><p>Finally, Cutler reviews the firm&#x27;s equity portfolio. The S&amp;P 500 is currently trading at a trailing<\/p><p>Price-to-Earnings (P/E) ratio of 20.5, which is above its 15-year historical average of 17.0. A<\/p><p>junior analyst argues that this high P/E is unjustified. However, Cutler believes there are<\/p><p>macroeconomic factors that could support a higher equilibrium P/E. He considers the recent<\/p><p>decline in the volatility of US GDP growth, a decrease in the equity risk premium due to<\/p><p>persistent demand for equities, and the current, relatively high inflation environment.<\/p><\/div><\/details><div class=\"qtext\"><p>According to the present value model of equity valuation, which of the macroeconomic factors cited by Cutler in the vignette would most likely support a justified increase in the equilibrium P/E ratio?<\/p><\/div>", "subj": "portfolio"}, {"n": 77, "q": "Regarding the statements about the break-even inflation rate, Gamble is least accurate concerning?", "opts": ["Statement 1", "Statement 2", "Statement 3"], "ans": "B", "expl": "Statement 1 is inaccurate. The BEI is the sum of expected inflation and an inflation risk premium. It is not the market's \"exact forecast.\" If actual inflation equals the BEI, investors in nominal bonds are compensated for both expectation and risk, not just expectation. B is incorrect: Statement 2 is accurate. Increased uncertainty raises the inflation risk premium, widening the BEI. C is incorrect. Statement 2 is accurate. An improvement in real growth increases real yields, causing BEI to narrow.", "explhtml": "<p>Statement 1 is inaccurate. The BEI is the sum of <b>expected inflation<\/b> and an <b>inflation risk<\/b> <b>premium<\/b>. It is not the market&#x27;s &quot;exact forecast.&quot; If actual inflation equals the BEI, investors in nominal bonds are compensated for both expectation and risk, not just expectation.<\/p><p><b>B is incorrect:<\/b> Statement 2 is accurate. Increased uncertainty raises the inflation risk premium, widening the BEI.<\/p><p><b>C is incorrect.<\/b> Statement 2 is accurate. An improvement in real growth increases real yields, causing BEI to narrow.<\/p><p class=\"los\">Portfolio Management, Learning Module 1: Economics and Investment Markets, LOS 1 (e): Describe the factors that affect yield spreads between non-inflation-adjusted and inflation-indexed bonds.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 77–80 · Jessica Eseberre<\/summary><div class=\"vig-body\"><p>Jessica Eseberre, CFA, a Portfolio Analyst at Selman Investment Partners, a UK-based private<\/p><p>equity fund, is preparing for a quarterly strategy meeting. The fund is considering a significant<\/p><p>investment in infrastructure projects, whose long-term returns are often linked to inflation. A key<\/p><p>part of the discussion will focus on interpreting current market signals about future inflation, as<\/p><p>these will directly affect the discount rates and return assumptions for the potential investment.<\/p><p>In the meeting, the Chief Investment Officer (CIO) presents data on UK government bonds. The<\/p><p>yield on a 10-year nominal gilt is 4.5%. The yield on a 10-year index-linked gilt is 1.2%. The team<\/p><p>calculates the break-even inflation (BEI) rate as 3.3%. The CIO emphasizes that this BEI rate is a<\/p><p>market-based measure but is not a pure reflection of inflation expectations. He notes that the<\/p><p>Bank of England’s inflation target is 2.0%, and recent economic data shows inflation is currently<\/p><p>running at 3.0%. He explains that the BEI also includes a risk premium that investors demand<\/p><p>for the uncertainty surrounding future inflation.<\/p><p>After the meeting, Eseberre discusses the topic with Alex Gamble, an intern. Gamble is trying to<\/p><p>solidify his understanding and makes the following statements. Statement 1: “The break-even<\/p><p>inflation rate of 3.3% is the market&#x27;s exact forecast for average inflation over the next decade. If<\/p><p>inflation averages 3.5%, investors in index-linked gilts will have underperformed.”<\/p><p>Statement 2: “If investors were to become more uncertain about the future path of inflation,<\/p><p>perhaps due to fiscal policy changes, we would expect the break-even inflation rate to widen,<\/p><p>even if the median inflation expectation remained unchanged.”<\/p><p>Statement 3: “A significant improvement in the UK’s trend rate of real economic growth would<\/p><p>likely lead to a decrease in the yield on index-linked gilts, causing the break-even inflation rate to<\/p><p>rise.”<\/p><p>Later that day, Eseberre refines her investment memo. She notes that the current high BEI rate<\/p><p>relative to the BoE’s target suggests the market is pricing in either persistently high inflation<\/p><p>expectations, a significant inflation risk premium, or both. This analysis will be critical for the<\/p><p>fund’s final investment committee decision on the infrastructure deal, as it affects the real return<\/p><p>they can expect to capture.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding the statements about the break-even inflation rate, Gamble is least accurate concerning?<\/p><\/div>", "subj": "portfolio"}, {"n": 78, "q": "Based on the fundamental relationship in the present value model, if the UK were to experience a period of sustained higher volatility in its real GDP growth, the immediate impact on the components of the discount rate for a nominal government bond would most likely be:", "opts": ["An increase in the real default-free rate and an increase in the inflation risk premium.", "A decrease in the real default-free rate and a decrease in the inflation risk premium.", "An increase in the real default-free rate and a decrease in expected inflation."], "ans": "A", "expl": "A positive relationship exists between the volatility of real GDP growth and the level of default-free real interest rates. Investors require a higher return to defer consumption in a more uncertain economic environment, raising the real rate. Furthermore, higher macroeconomic volatility is often associated with greater uncertainty about future inflation, thereby increasing the inflation risk premium that investors demand to hold nominal bonds. B is incorrect. It suggests both components would decrease, which is the opposite of the theoretical relationship. Higher volatility increases required returns. C is incorrect. While it correctly identifies a potential increase in the real rate, it incorrectly links higher GDP volatility to lower expected inflation. There is no direct, established negative relationship; inflation expectations may be unaffected or even rise due to policy uncertainty.", "explhtml": "<p>A positive relationship exists between the volatility of real GDP growth and the level of default-free real interest rates. Investors require a higher return to defer consumption in a more uncertain economic environment, raising the real rate. Furthermore, higher macroeconomic volatility is often associated with greater uncertainty about future inflation, thereby increasing the inflation risk premium that investors demand to hold nominal bonds.<\/p><p><b>B is incorrect.<\/b> It suggests both components would decrease, which is the opposite of the theoretical relationship. Higher volatility increases required returns.<\/p><p><b>C is incorrect.<\/b> While it correctly identifies a potential increase in the real rate, it incorrectly links higher GDP volatility to lower expected inflation. There is no direct, established negative relationship; inflation expectations may be unaffected or even rise due to policy uncertainty.<\/p><p class=\"los\">Portfolio Management, Learning Module 1: Economics and Investment Markets, LOS 1 (c): Explain the relationship between the long-term growth rate of the economy, the volatility of the growth rate, and the average level of real short-term interest rates.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 77–80 · Jessica Eseberre<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jessica Eseberre, CFA, a Portfolio Analyst at Selman Investment Partners, a UK-based private<\/p><p>equity fund, is preparing for a quarterly strategy meeting. The fund is considering a significant<\/p><p>investment in infrastructure projects, whose long-term returns are often linked to inflation. A key<\/p><p>part of the discussion will focus on interpreting current market signals about future inflation, as<\/p><p>these will directly affect the discount rates and return assumptions for the potential investment.<\/p><p>In the meeting, the Chief Investment Officer (CIO) presents data on UK government bonds. The<\/p><p>yield on a 10-year nominal gilt is 4.5%. The yield on a 10-year index-linked gilt is 1.2%. The team<\/p><p>calculates the break-even inflation (BEI) rate as 3.3%. The CIO emphasizes that this BEI rate is a<\/p><p>market-based measure but is not a pure reflection of inflation expectations. He notes that the<\/p><p>Bank of England’s inflation target is 2.0%, and recent economic data shows inflation is currently<\/p><p>running at 3.0%. He explains that the BEI also includes a risk premium that investors demand<\/p><p>for the uncertainty surrounding future inflation.<\/p><p>After the meeting, Eseberre discusses the topic with Alex Gamble, an intern. Gamble is trying to<\/p><p>solidify his understanding and makes the following statements. Statement 1: “The break-even<\/p><p>inflation rate of 3.3% is the market&#x27;s exact forecast for average inflation over the next decade. If<\/p><p>inflation averages 3.5%, investors in index-linked gilts will have underperformed.”<\/p><p>Statement 2: “If investors were to become more uncertain about the future path of inflation,<\/p><p>perhaps due to fiscal policy changes, we would expect the break-even inflation rate to widen,<\/p><p>even if the median inflation expectation remained unchanged.”<\/p><p>Statement 3: “A significant improvement in the UK’s trend rate of real economic growth would<\/p><p>likely lead to a decrease in the yield on index-linked gilts, causing the break-even inflation rate to<\/p><p>rise.”<\/p><p>Later that day, Eseberre refines her investment memo. She notes that the current high BEI rate<\/p><p>relative to the BoE’s target suggests the market is pricing in either persistently high inflation<\/p><p>expectations, a significant inflation risk premium, or both. This analysis will be critical for the<\/p><p>fund’s final investment committee decision on the infrastructure deal, as it affects the real return<\/p><p>they can expect to capture.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the fundamental relationship in the present value model, if the UK were to experience a period of sustained higher volatility in its real GDP growth, the immediate impact on the components of the discount rate for a nominal government bond would most likely be:<\/p><\/div>", "subj": "portfolio"}, {"n": 79, "q": "Suppose the Bank of England credibly commits to a new policy framework that is universally expected to reduce the long-run volatility of inflation. All else equal, the yield spread between nominal and index-linked gilts would most likely:", "opts": ["Narrow due to a decline in the inflation risk premium.", "Widen due to an increase in expected inflation.", "Remain unchanged, as this does not affect the components of the break-even rate."], "ans": "A", "expl": "The break-even inflation rate is composed of expected inflation and the inflation risk premium. A credible commitment to reducing the long-run volatility of inflation directly reduces investors' uncertainty about future inflation. This reduction in uncertainty lowers the inflation risk premium that investors demand. If expected inflation remains unchanged, a decrease in it will narrow the overall break-even rate. B is incorrect. The scenario describes a change in inflation volatility, not the level of inflation. A reduction in volatility does not, by itself, suggest an increase in the expected level of inflation  (θt,s). C is incorrect. The inflation risk premium (πt,s) is a specific component of the break-even rate. A change in inflation uncertainty directly affects this premium and, therefore, the break-even rate.", "explhtml": "<p>The break-even inflation rate is composed of expected inflation and the inflation risk premium. A credible commitment to reducing the long-run volatility of inflation directly reduces investors&#x27; uncertainty about future inflation. This reduction in uncertainty lowers the inflation risk premium that investors demand. If expected inflation remains unchanged, a decrease in it will narrow the overall break-even rate.<\/p><p><b>B is incorrect.<\/b> The scenario describes a change in inflation volatility, not the level of inflation. A reduction in volatility does not, by itsel
