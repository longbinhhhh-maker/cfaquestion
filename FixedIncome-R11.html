<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Consider a 25-year, $1,000 par semiannual-pay bond with a 7.5% coupon and a 9.25% YTM.\nBased on a yield change of 50 basis points, the approximate modified duration of the bond\nis closest to:", "opts": ["10.03.", "12.50.", "8.73."], "ans": "A", "expl": "Calculate the new bond prices at the 50 basis point change in rates both up or down and\nthen plug into the approximate modified duration equation:\nCurrent price: N = 50; FV = 1,000; PMT = (0.075/2) × 1,000 = 37.50; I/Y = 4.625; CPT\n PV = $830.54.\n→\n+50 basis pts: N = 50; FV = 1,000; PMT = (0.075/2)1,000 = 37.50; I/Y = 4.875; CPT\n→\nPV = $790.59.\n–50 basis pts: N = 50; FV = 1,000; PMT = (0.075/2)1,000 = 37.50; I/Y = 4.375; CPT\n→\nPV = $873.93.\nApproximate modified duration = (873.93 – 790.59) / (2 × 830.54 × 0.005) = 10.03.\n(Module 57.1, LOS 57.a)"}, {"n": 2, "q": "What happens to bond durations when coupon rates increase and maturities increase?\nAs coupon rates increase, duration:As maturities increase, duration:", "opts": ["decreasesdecreases", "decreasesincreases", "increasesincreases"], "ans": "B", "expl": "As coupon rates increase the duration on the bond will decrease because investors are\nreceiving more cash flow sooner. As maturity increases, duration will increase because the\npayments are spread out over a longer period of time.\n(Module 57.1, LOS 57.b)"}, {"n": 3, "q": "In comparing the price volatility of putable bonds to that of option-free bonds, a putable\nbond will have:", "opts": ["less price volatility at higher yields.", "less price volatility at low yields.", "more price volatility at higher yields."], "ans": "A", "expl": "The only true statement is that putable bonds will have less price volatility at higher yields.\nAt higher yields the put becomes more valuable and reduces the decline in price of the\nputable bond relative to the option-free bond. On the other hand, when yields are low, the\nput option has little or no value and the putable bond will behave much like an option-free\nbond. Therefore at low yields a putable bond will not have more price volatility nor will it\nhave less price volatility than a similar option-free bond.\n(Module 57.1, LOS 57.b)"}, {"n": 4, "q": "Suppose the term structure of interest rates makes an instantaneous parallel upward shift\nof 100 basis points. Which of the following securities experiences the largest change in\nvalue? A five-year:", "opts": ["coupon bond with a coupon rate of 5%.", "floating rate bond.", "zero-coupon bond."], "ans": "C", "expl": "The duration of a zero-coupon bond is equal to its time to maturity since the only cash\nflows made is the principal payment at maturity of the bond. Therefore, it has the highest\ninterest rate sensitivity among the four securities.\nA floating rate bond is incorrect because the duration, which is the interest rate sensitivity,\nis equal to the time until the next coupon is paid. So this bond has a very low interest rate\nsensitivity.\nA coupon bond with a coupon rate of 5% is incorrect because the duration of a coupon\npaying bond is lower than a zero-coupon bond since cash flows are made before maturity\nof the bond. Therefore, its interest rate sensitivity is lower.\n(Module 57.1, LOS 57.b)"}, {"n": 5, "q": "All other things being equal, which of the following bonds has the greatest duration?", "opts": ["5-year, 8% coupon bond.", "15-year, 8% coupon bond.", "15-year, 12% coupon bond."], "ans": "B", "expl": "If bonds are identical except for maturity and coupon, the one with the longest maturity\nand lowest coupon will have the greatest duration. The later the cash flows are received,\nthe greater the duration.\n(Module 57.1, LOS 57.b)"}, {"n": 6, "q": "For large changes in yield, which of the following statements about using duration to\nestimate price changes is most accurate? Duration alone:", "opts": ["overestimates the increase in price for decreases in yield.", "overestimates the increase in price for increases in yield.", "underestimates the increase in price for decreases in yield."], "ans": "C", "expl": "For large changes in yield, duration underestimates the increase in price when yield\ndecreases and overestimates the decrease in price when yield increases. This is because\nduration is a linear estimate that does not account for the convexity (curvature) in the\nprice/yield relationship.\n(Module 57.1, LOS 57.a)"}, {"n": 7, "q": "All else equal, which of the following is least likely to increase the interest rate risk of a\nbond?", "opts": ["A decrease in the YTM.", "A longer maturity.", "Inclusion of a call feature."], "ans": "C", "expl": "Inclusion of a call feature will decrease the duration of a fixed income security. The other\nchoices increase duration.\n(Module 57.1, LOS 57.b)"}, {"n": 8, "q": "A bond with a yield to maturity of 8.0% is priced at 96.00. If its yield increases to 8.3% its\nprice will decrease to 94.06. If its yield decreases to 7.7% its price will increase to 98.47. The\nmodified duration of the bond is closest to:", "opts": ["7.66.", "2.75.", "4.34."], "ans": "A", "expl": "The change in the yield is 30 basis points.\nApproximate modified duration = (98.47 − 94.06) / (2 × 96.00 × 0.003) = 7.6563.\n(Module 57.1, LOS 57.a)"}, {"n": 9, "q": "An investor finds that for a 1% increase in yield to maturity, a bond's price will decrease by\n4.21% compared to a 4.45% increase in value for a 1% decline in YTM. If the bond is currently\ntrading at par value, the bond's approximate modified duration is closest to:", "opts": ["4.33.", "43.30.", "8.66."], "ans": "A", "expl": "Modified duration is a measure of a bond's sensitivity to changes in interest rates.\nApproximate modified duration = (V – V) / [2V(change in required\n-+0\nyield)] where:\nV = estimated price if yield decreases by a given amount\n-\nV = estimated price if yield increases by a given amount\n+\nV = initial observed bond price\n0\nThus, duration = (104.45 – 95.79)/(2 × 100 × 0.01) = 4.33. Remember that the change in\ninterest rates must be in decimal form.\n(Module 57.1, LOS 57.a)"}, {"n": 10, "q": "A 30-year semi-annual coupon bond issued today with market rates at 6.75% pays a 6.75%\ncoupon. If the market yield declines by 30 basis points, the price increases to $1,039.59. If\nthe market yield rises by 30 basis points, the price decreases to $962.77. The bond's\napproximate modified duration is closest to:", "opts": ["1.3%.", "12.8%.", "3.9%."], "ans": "B", "expl": "Approximate modified duration =\n(price if yield down − price if yield up) / (2 × initial price × yield change expressed\nas a decimal).\nHere, the initial price is par, or $1,000 because we are told the bond was issued today at\npar. So, the calculation is: (1039.59 − 962.77) / (2 × 1000 × 0.003) = 76.82 / 6.00 = 12.80.\n(Module 57.1, LOS 57.a)"}, {"n": 11, "q": "The price value of a basis point (PVBP) for a 18 year, 8% annual pay bond with a par value of\n$1,000 and yield of 9% is closest to:", "opts": ["$0.44.", "$0.80.", "$0.82."], "ans": "C", "expl": "PVBP = initial price – price if yield changed by 1 bps.\nInitial price:Price with change:\nFV = 1000FV = 1000\nPMT = 80PMT = 80\nN = 18N = 18\nI/Y = 9%I/Y = 9.01\nCPT PV = 912.44375CPT PV = 911.6271\nPVBP = 912.44375 – 911.6271 = 0.82\n(Module 57.1, LOS 57.a)"}, {"n": 12, "q": "Assume that the current price of an annual-pay bond is 102.50 per 100 of face value. If its\nYTM increases by 0.5% the value of the bond decreases to 100 and if its YTM decreases by\n0.5% the price of the bond increases to 105.5. What is the approximate modified duration of\nthe bond?", "opts": ["5.37.", "5.48.", "5.50."], "ans": "A", "expl": "Approximate modified duration is computed as follows:\n105.50−100\nDuration==5.37\n2×102.50×0.005\n(Module 57.1, LOS 57.a)"}, {"n": 13, "q": "When interest rates increase, the modified duration of a 30-year bond selling at a discount:", "opts": ["decreases.", "does not change.", "increases."], "ans": "A", "expl": "The higher the yield on a bond the lower the price volatility (duration) will be. When\ninterest rates increase the price of the bond will decrease and the yield will increase\nbecause the current yield = (annual cash coupon payment) / (bond price). As the bond\nprice decreases the yield increases and the price volatility (duration) will decrease.\n(Module 57.1, LOS 57.b)"}, {"n": 14, "q": "Which of the following five year bonds has the highest interest rate sensitivity?", "opts": ["Zero-coupon bond.", "Floating rate bond.", "Option-free 5% coupon bond."], "ans": "A", "expl": "The Macaulay duration of a zero-coupon bond is equal to its time to maturity. Its price is\ngreatly affected by changes in interest rates because its only cash-flow is at maturity and is\ndiscounted from the time at maturity until the present.\n(Module 57.1, LOS 57.b)"}, {"n": 15, "q": "Which of the following bonds has the shortest duration? A bond with a:", "opts": ["20-year maturity, 6% coupon rate.", "10-year maturity, 10% coupon rate.", "10-year maturity, 6% coupon rate."], "ans": "B", "expl": "All else constant, a bond with a longer maturity will be more sensitive to changes in\ninterest rates. All else constant, a bond with a lower coupon will have greater interest rate\nrisk.\n(Module 57.1, LOS 57.b)"}, {"n": 16, "q": "Which of the following is most likely to be the money duration of newly issued 360-day\neurocommercial paper?", "opts": ["360 days.", "4.3%.", "€25 million."], "ans": "C", "expl": "Money duration is expressed in currency units.\n(Module 57.1, LOS 57.a)"}, {"n": 17, "q": "The current price of a $1,000 par value, 6-year, 4.2% semiannual coupon bond is $958.97.\nThe bond's price value of a basis point is closest to:", "opts": ["$4.20.", "$0.50.", "$5.01."], "ans": "B", "expl": "First we compute the yield to maturity of the bond. PV = –$958.97, FV = $1,000, PMT = $21,\nN = 12, CPT I/Y = 2.5%, multiply by 2 since it is a semiannual bond to get an annualized\nyield to maturity of 5.0%. Now compute the price of the bond at using yield one basis point\nhigher, or 5.01%. FV = $1,000, PMT = 21, N = 12, I/Y = (5.01 / 2 =) 2.505, CPT PV = –$958.47.\nThe price changes from $958.97 to $958.47, or $0.50.\n(Module 57.1, LOS 57.a)"}, {"n": 18, "q": "An option-free 5-year 6% annual-pay bond is selling $979.22 per $1,000 of par value and has\na Macaulay duration of 4.4587. The bond's modified duration is closest to:", "opts": ["4.187.", "4.206.", "4.246."], "ans": "A", "expl": "The YTM on the bond is 6.5%. N=5, PV = −979.22, PMT = 60, FV=1,000, CPT I/Y = 6.5%\nModified duration = Macaulay duration / (1 + YTM) = 4.4587 / 1.065 = 4.187.\n(Module 57.1, LOS 57.a)"}, {"n": 19, "q": "Which of the following bonds is most likely to exhibit the greatest volatility due to interest\nrate changes? A bond with a:", "opts": ["high coupon and a long maturity.", "low coupon and a long maturity.", "low coupon and a short maturity."], "ans": "B", "expl": "Other things equal, a bond with a low coupon and long maturity will have the greatest\nprice volatility.\n(Module 57.1, LOS 57.b)"}, {"n": 20, "q": "Given the three bonds listed here, which bond has the most interest rate risk?", "opts": ["8-year maturity, 5.5% coupon.", "24-year maturity, 5.0% coupon.", "8-year maturity, 12.0% coupon."], "ans": "B", "expl": "Interest rate risk (or price volatility) increases at longer maturities and with lower coupons.\n(Module 57.1, LOS 57.b)"}, {"n": 21, "q": "A $100,000 par value bond has a full price of $99,300, a Macaulay duration of 6.5, and an\nannual modified duration of 6.1. The bond's money duration per $100 par value is closest to:", "opts": ["$606.", "$645.", "$6.06."], "ans": "A", "expl": "Money duration per $100 par value = annual modified duration × full price per $100 par\nvalue = 6.1 × $99.30 = $605.73\n(Module 57.1, LOS 57.a)"}, {"n": 22, "q": "A non-callable bond with 10 years remaining maturity has an annual coupon of 5.5% and a\n$1,000 par value. The yield to maturity on the bond is 4.7%. Which of the following is closest\nto the estimated price change of the bond using duration if rates rise by 75 basis points?", "opts": ["-$47.34.", "-$5.68.", "-$61.10."], "ans": "C", "expl": "First, compute the current price of the bond as: FV = 1,000; PMT = 55; N = 10; I/Y = 4.7; CPT\n PV = –1,062.68. Then compute the price of the bond if rates rise by 75 basis points to\n→\n5.45% as: FV = 1,000; PMT = 55; N = 10; I/Y = 5.45; CPT  PV = –1,003.78. Then compute the\n→\nprice of the bond if rates fall by 75 basis points to 3.95% as: FV = 1,000; PMT = 55; N = 10;\nI/Y = 3.95; CPT  PV = –1,126.03.\n→\nThe formula for approximate modified duration is: (V–V) / (2VΔy). Therefore, modified\n-+0\nduration is: ($1,126.03 – $1,003.78) / (2 × $1,062.68 × 0.0075) = 7.67.\nThe formula for the percentage price change is then: –(duration)(ΔYTM). Therefore, the\nestimated percentage price change using duration is: –(7.67)(0.75%) = –5.75%. The\nestimated price change is then: (–0.0575)($1,062.68) = –$61.10\n(Module 57.1, LOS 57.a)"}, {"n": 23, "q": "Holding other factors constant, the interest rate risk of a coupon bond is higher when the\nbond's:", "opts": ["coupon rate is higher.", "current yield is higher.", "yield to maturity is lower."], "ans": "C", "expl": "In this case the only determinant that will cause higher interest rate risk is having a low\nyield to maturity. A higher coupon rate and a higher current yield will result in lower\ninterest rate risk.\n(Module 57.1, LOS 57.b)"}, {"n": 24, "q": "Compared to a bond's Macaulay duration, its modified duration:", "opts": ["is higher.", "is lower.", "may be lower or higher."], "ans": "B", "expl": "Modified duration = Macaulay duration / (1 + YTM). Modified duration is lower than\nMacaulay duration unless YTM equals zero.\n(Module 57.1, LOS 57.a)"}, {"n": 25, "q": "Which of the following bonds has the highest interest rate sensitivity? A:", "opts": ["five year, 5% coupon bond callable in one year.", "ten year, option-free 4% coupon bond.", "ten year, option-free 6% coupon bond."], "ans": "B", "expl": "If two bonds are identical in all respects except their term to maturity, the longer term\nbond will be more sensitive to changes in interest rates. All else the same, if a bond has a\nlower coupon rate when compared with another, it will have greater interest rate risk.\nTherefore, for the option-free bonds, the 10 year 4% coupon is the longest term and has\nthe lowest coupon rate. The call feature does not make a bond more sensitive to changes\nin interest rates, because it places a ceiling on the maximum price investors will be willing\nto pay. If interest rates decrease enough the bonds will be called.\n(Module 57.1, LOS 57.b)"}, {"n": 26, "q": "An analyst has stated that, holding all else constant, an increase in the maturity of a coupon\nbond will typically increase its interest rate risk, and that a decrease in the coupon rate of a\ncoupon bond will typically decrease its interest rate risk. The analyst is correct with respect\nto:", "opts": ["only one of these effects.", "both of these effects.", "neither of these effects."], "ans": "A", "expl": "The analyst is incorrect with respect to coupon rate. As the coupon rate decreases, the\ninterest rate risk of a bond increases. Lower coupons cause greater relative weight to be\nplaced on the principal repayment. Because this cash flow occurs farther out in time, its\npresent value is much more sensitive to changes in interest rates. As the coupon rate goes\nto zero (i.e., a zero-coupon bond), all of the bond's return relies on the return of principal\nwhich as stated before is highly sensitive to interest rate changes.\nThe analyst is correct with respect to maturity. As the maturity of a bond increases, an\ninvestor must wait longer for the eventual repayment of the bond principal. As the length\nof time until principal payment increases, the probability that interest rates will change\nincreases. If interest rates increase, the present value of the final payment (which is the\nlargest cash flow of the bond) decreases. At longer maturities, the present value decreases\nby greater amounts. Thus, interest rate risk typically increases as the maturity of the bond\nincreases. (The exception is for long-term discount bonds, which may exhibit a range of\nlong maturities over which an increase in maturity decreases interest rate risk.)\n(Module 57.1, LOS 57.b)"}, {"n": 27, "q": "On Monday, the yield curve is upward sloping with yields of 3%, 4%, and 5.5% on 1-year, 5-\nyear, and 10-year government bonds, respectively. The following day, the yield curve\nexperiences an upward parallel shift equal to 50 basis points. Other things equal, which of\nthe following noncallable 6% coupon bonds is likely to experience the smallest percent\nchange in price as a result of the yield curve shift?", "opts": ["Zero coupon government bond maturing in five years.", "Par value government bond maturing in five years.", "Par value government bond maturing in ten years."], "ans": "B", "expl": "The bond with the least percentage price change will be the bond with the lowest interest\nrate risk. Higher coupons or shorter maturities decrease interest rate risk. The coupon\npaying bond with only five years to maturity will have the lowest interest rate risk.\n(Module 57.1, LOS 57.b)"}, {"n": 28, "q": "The approximate modified duration of an option-free 20-year 7% annual-pay par bond based\non a 25 basis point change in yield is closest to:", "opts": ["5.3.", "10.6.", "13.7."], "ans": "B", "expl": "If the yield on the bond were 7.25%, the price would be 97.402 and would be 102.701 if the\nyield were 6.75%. The approximate modified duration for this bond based on a 25 basis\npoint change in yield is calculated as:\n102.701−97.402\n=10.5976\n2(100)(0.0025)\n(Module 57.1, LOS 57.a)"}, {"n": 29, "q": "Martina Whittaker runs a fixed-income portfolio that contains a $12 million full price position\nin the corporate bonds of Dewey Treadmills. Whittaker is concerned that interest rates are\nlikely to rise and has calculated an annual modified duration of 8.0 for the Dewey bonds. The\nmoney duration of the position in Dewey bonds is closest to:", "opts": ["$9.6 million.", "$48.0 million.", "$96.0 million."], "ans": "C", "expl": "Money duration = annual modified duration × portfolio value = 8 × $12 million =\n$96,000,000.\n(Module 57.1, LOS 57.a)"}, {"n": 30, "q": "An international bond investor has gathered the following information on a 10-year, annual-\npay U.S. corporate bond:\nCurrently trading at par value\nAnnual coupon of 10%\nEstimated price if rates increase 50 basis points is 96.99%\nEstimated price is rates decrease 50 basis points is 103.14%\nThe bond's approximate modified duration is closest to:", "opts": ["3.14.", "6.15.", "6.58."], "ans": "B", "expl": "Duration is a measure of a bond's sensitivity to changes in interest rates.\nModified duration = (V – V) / [2V(change in required yield)] where:\n-+0\nV = estimated price if yield decreases by a given amount\n-\nV = estimated price if yield increases by a given amount\n+\nV = initial observed bond price\n0\nThus, modified duration = (103.14 − 96.99) / (2 × 100 × 0.005) = 6.15. Remember that the\nchange in interest rates must be in decimal form.\n(Module 57.1, LOS 57.a)"}, {"n": 31, "q": "The price value of a basis point (PVBP) for a 7-year, 10% semiannual pay bond with a par\nvalue of $1,000 and yield of 6% is closest to:", "opts": ["$0.64.", "$0.92.", "$0.28."], "ans": "A", "expl": "PVBP = initial price – price if yield changed by 1 bps.\nInitial price:Price with change:\nFV = 1000FV = 1000\nPMT = 50PMT = 50\nN = 14N = 14\nI/Y = 3%I/Y = 3.005\nCPT PV = 1225.92CPT PV = 1225.28\nPVBP = 1,225.92 – 1,225.28 = 0.64\n(Module 57.1, LOS 57.a)"}, {"n": 32, "q": "Which of the following statements concerning the price volatility of bonds is most accurate?", "opts": ["Bonds with longer maturities have lower interest rate risk.", "Bonds with higher coupons have lower interest rate risk.", "As the yield on callable bonds approaches the coupon rate, the bond's price will approach a \"floor\" value."], "ans": "B", "expl": "Other things equal, bonds with higher coupons have lower interest rate risk. Note that the\nother statements are false. Bonds with longer maturities have higher interest rate risk.\nCallable bonds have a ceiling value as yields decline.\n(Module 57.1, LOS 57.b)"}, {"n": 33, "q": "Which of the following statements about an embedded call feature in a bond is least\naccurate? The call feature:", "opts": ["reduces the bond's capital appreciation potential.", "increases the bond's duration, increasing price risk.", "exposes investors to additional reinvestment rate risk."], "ans": "B", "expl": "A call provision decreases the bond's duration because a call provision introduces\nprepayment risk that should be factored in the calculation.\nFor the investor, one of the most significant risks of callable (or prepayable) bonds is that\nthey can be called/retired prematurely. Because bonds are nearly always called for\nprepayment after interest rates have decreased significantly, the investor will find it nearly\nimpossible to find comparable investment vehicles. Thus, investors have to replace their\nhigh-yielding bonds with much lower-yielding issues. From the bondholder's perspective, a\ncalled bond means not only a disruption in cash flow but also a sharply reduced rate of\nreturn.\nGenerally speaking, the following conditions apply to callable bonds:\nThe cash flows associated with callable bonds become unpredictable, since the life\nof the bond could be much shorter than its term to maturity, due to the call\nprovision.\nThe bondholder is exposed to the risk of investing the proceeds of the bond at\nlower interest rates after the bond is called. This is known as reinvestment risk.\nThe potential for price appreciation is reduced, because the possibility of a call\nlimits or caps the price of the bond near the call price if interest rates fall.\n(Module 57.1, LOS 57.b)"}];
const CFG = {"title": "Yield-Based Bond Duration Measures and Properties", "subtitle": "CFA · Fixed Income · Reading 57 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; stem.textContent = q.q;
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>
