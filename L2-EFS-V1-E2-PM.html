 following information for 2018 is provided:<\/p><p>EP/BM<\/p><div class=\"tbl\"><table><tr><td>In Millions, Year-End 2018<\/td><td>EPI<\/td><td><\/td><\/tr><tr><td>LLC<\/td><td><\/td><td><\/td><\/tr><tr><td>Revenue<\/td><td>$3,115<\/td><td>$421<\/td><\/tr><tr><td>Cost of goods sold<\/td><td>$2,580<\/td><td>$295<\/td><\/tr><tr><td>SG&amp;A<\/td><td>$316<\/td><td>$50<\/td><\/tr><tr><td>Interest expense<\/td><td>$47<\/td><td>$8<\/td><\/tr><tr><td>Equity in earnings of EP/BM<\/td><td>$22<\/td><td><\/td><\/tr><tr><td>Pretax income<\/td><td>$194<\/td><td>$68<\/td><\/tr><tr><td>Income tax<\/td><td>$60<\/td><td>$24<\/td><\/tr><tr><td> Net income<\/td><td>$134<\/td><td>$44<\/td><\/tr><tr><td>In Millions, December 31, 2018<\/td><td>EPI<\/td><td>EP/BM<\/td><\/tr><tr><td>LLC<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Assets<\/p><div class=\"tbl\"><table><tr><td>Cash<\/td><td>$118<\/td><td>$13<\/td><\/tr><tr><td>Accounts receivable<\/td><td>$390<\/td><td>$50<\/td><\/tr><tr><td>Inventory<\/td><td>$314<\/td><td>$41<\/td><\/tr><tr><td>Property<\/td><td>$1,007<\/td><td>$131<\/td><\/tr><tr><td>Investment<\/td><td>$38<\/td><td><\/td><\/tr><tr><td> Total<\/td><td>$1,867<\/td><td>$235<\/td><\/tr><tr><td>Liabilities and Equity<\/td><td>EPI<\/td><td>EP/BM LLC<\/td><\/tr><tr><td>Accounts payable<\/td><td>$274<\/td><td>$35<\/td><\/tr><tr><td>Long-term debt<\/td><td>$719<\/td><td>$125<\/td><\/tr><tr><td>Equity<\/td><td>$874<\/td><td>$75<\/td><\/tr><tr><td> Total<\/td><td>$1,867<\/td><td>$235<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>For this question only, assume that EPI accounts for its investment in EP/BM LLC using the acquisition method with partial goodwill. As compared to the acquisition method, the return on ending equity under proportionate consolidation will most likely be:<\/p><\/div>", "subj": "fsa"}, {"n": 25, "q": "Assuming that working capital will be recaptured at the end of the project, which of the following is closest to the final period after- tax cash flow for the Tera Project?", "opts": ["$196,467.", "$210,267.", "$219,467."], "ans": "B", "expl": "The final period cash flow will include the project cash flows, the return of net working capital, and the after-tax sale of fixed capital used in the project. Because Tera is a replacement project, the incremental cash flows must be calculated. In other words, we are concerned with the additional sales and costs derived from the new equipment. incremental sales = 708,000 − 523,000 = $185,000 incremental cash expenses = 440,000 − 352,000 = $88,000 incremental depreciation = 110,667 − 40,000 = $70,667 incremental project cash flows = (185,000 – 88,000 − 70,667) × (1 − 0.40) + 70,667 = $86,467 return of incremental net working capital = $110,000 In the final year, the book value of the old machine (if not replaced) = 120,000 − 3 × 40,000 = 0. Similarly, the book value of the new machine (if replaced) = 332,000 − 3 × 110,667 = 0. incremental cash flow from after-tax sale of equipment = (113,000 − 90,000) − 0.40[(113,000 − 90,000) − (0 − 0)] = $13,800 total cash flow in final period = 86,467 + 110,000 + 13,800 = $210,267 For Further Reference: (Study Session 7, Module 19.1, LOS 19.a)", "explhtml": "<p>The final period cash flow will include the project cash flows, the return of net working capital, and the after-tax sale of fixed capital used in the project. Because Tera is a replacement project, the incremental cash flows must be calculated. In other words, we are concerned with the additional sales and costs derived from the new equipment.<\/p><p>incremental sales = 708,000 − 523,000 = $185,000<\/p><p>incremental cash expenses = 440,000 − 352,000 = $88,000<\/p><p>incremental depreciation = 110,667 − 40,000 = $70,667<\/p><p>incremental project cash flows = (185,000 – 88,000 − 70,667) × (1 − 0.40) + 70,667 = $86,467<\/p><p>return of incremental net working capital = $110,000<\/p><p>In the final year, the book value of the old machine (if not replaced) = 120,000 − 3 × 40,000 = 0. Similarly, the book value of the new machine (if replaced) = 332,000 − 3 × 110,667 = 0.<\/p><p>incremental cash flow from after-tax sale of equipment = (113,000 − 90,000) − 0.40[(113,000 − 90,000) − (0 − 0)] = $13,800<\/p><p>total cash flow in final period = 86,467 + 110,000 + 13,800 = $210,267<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 7, Module 19.1, LOS 19.a)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Corporate Issuers<\/summary><div class=\"vig-body\"><p>GigaTech, Inc., is a large U.S.-based technology conglomerate. The firm has business units in three primary categories: (1) hardware manufacturing, (2) software development, and (3) consulting services. Because of the rapid pace of technological innovation, GigaTech must make capital investments every two to four years. The company has identified several potential investment opportunities for its hardware manufacturing division. The first of these opportunities, Tera Project, would replace a portion of GigaTech&#x27;s microprocessor assembly equipment with new machinery expected to last three years. The current machinery has a book value of $120,000 and a market value of $195,000. The Tera Project would require purchasing machinery for $332,000, increasing current assets by $190,000, and increasing current liabilities by $80,000. GigaTech has a tax rate of 40%. Additional pro forma information related to the Tera Project is provided in the following table:<\/p><p>Existing Equipment Tera Project<\/p><div class=\"tbl\"><table><tr><td>Annual sales<\/td><td>$523,000<\/td><td>$708,000<\/td><\/tr><tr><td>Cash operating expenses<\/td><td>$352,000<\/td><td>$440,000<\/td><\/tr><tr><td>Annual depreciation<\/td><td>$40,000<\/td><td>$110,667<\/td><\/tr><tr><td>Accounting salvage value<\/td><td>$0<\/td><td>$0<\/td><\/tr><tr><td>Expected salvage value (after three years)<\/td><td>$90,000<\/td><td>$113,000<\/td><\/tr><\/table><\/div><p>Analysts at GigaTech have noted that investment in the Tera Project can be delayed for up to nine months if managers at the company decide this is necessary. However, once the capital investment is made, the project will be necessary to maintain continuing operations. Tera Project can be scaled up with more equipment requiring less capital than the original investment if results are meeting expectations. In addition, the equipment used in Tera Project can be used in shift work if brief excess demand is expected.<\/p><p>GigaTech is also considering expanding its software development operations in India. Software development equipment must be continually replaced to maintain efficiency as newer and faster technology is developed. The company has identified two mutually exclusive potential expansion projects, Zeta and Sigma. Zeta requires investing in equipment with a 3-year life, while Sigma requires investing in equipment with a 2-year life. GigaTech has estimated real capital costs for the two projects at 10.58%. GigaTech expects inflation to be approximately 4.0% for the foreseeable future. Nominal cash flows and net present values for the Zeta and Sigma projects are provided in the following table:<\/p><p>Annual Cash Flows<\/p><div class=\"tbl\"><table><tr><td>Project<\/td><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>NPV<\/td><\/tr><tr><td>Zeta<\/td><td>–$360,000 $250,000 $220,000 $190,000 $148,671<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Sigma<\/td><td>–$470,000 $330,000 $390,000<\/td><td>$0<\/td><td>$111,853<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Assuming that working capital will be recaptured at the end of the project, which of the following is closest to the final period after- tax cash flow for the Tera Project?<\/p><\/div>", "subj": "corporate"}, {"n": 26, "q": "Which of the following best describes how GigaTech should implement scenario analysis to analyze the Tera Project?", "opts": ["Generate a base case, high, and low estimate of NPV by changing only the most sensitive cash flow variable.", "Generate a base case, high, and low estimate of NPV by changing only the discount rate applicable to the project.", "Generate a base case, high, and low estimate of NPV by simultaneously changing sales, expense, and discount rate assumptions for each case."], "ans": "C", "expl": "In scenario analysis, the analyst simultaneously changes several key variables to generate several different scenarios. Generally, three scenarios are created: (1) worst case, (2) most likely, and (3) optimistic. For the worst case scenario, for example, the analyst will use the slowest growth in sales, highest growth in expenses, and highest discount rate to derive an NPV under the worst of all possible situations. A similar approach is used to generate the optimistic scenario, but the best possible growth in each of the variables is used. The most likely is simply what the analyst thinks are the most reasonable assumptions for the discounted cash flow forecast under normal conditions. Using the different cases, the analyst can assess the risk of the project. For Further Reference: (Study Session 7, Module 19.2, LOS 19.d)", "explhtml": "<p>In scenario analysis, the analyst simultaneously changes several key variables to generate several different scenarios. Generally, three scenarios are created: (1) worst case, (2) most likely, and (3) optimistic. For the worst case scenario, for example, the analyst will use the slowest growth in sales, highest growth in expenses, and highest discount rate to derive an NPV under the worst of all possible situations. A similar approach is used to generate the optimistic scenario, but the best possible growth in each of the variables is used. The most likely is simply what the analyst thinks are the most reasonable assumptions for the discounted cash flow forecast under normal conditions. Using the different cases, the analyst can assess the risk of the project.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 7, Module 19.2, LOS 19.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>GigaTech, Inc., is a large U.S.-based technology conglomerate. The firm has business units in three primary categories: (1) hardware manufacturing, (2) software development, and (3) consulting services. Because of the rapid pace of technological innovation, GigaTech must make capital investments every two to four years. The company has identified several potential investment opportunities for its hardware manufacturing division. The first of these opportunities, Tera Project, would replace a portion of GigaTech&#x27;s microprocessor assembly equipment with new machinery expected to last three years. The current machinery has a book value of $120,000 and a market value of $195,000. The Tera Project would require purchasing machinery for $332,000, increasing current assets by $190,000, and increasing current liabilities by $80,000. GigaTech has a tax rate of 40%. Additional pro forma information related to the Tera Project is provided in the following table:<\/p><p>Existing Equipment Tera Project<\/p><div class=\"tbl\"><table><tr><td>Annual sales<\/td><td>$523,000<\/td><td>$708,000<\/td><\/tr><tr><td>Cash operating expenses<\/td><td>$352,000<\/td><td>$440,000<\/td><\/tr><tr><td>Annual depreciation<\/td><td>$40,000<\/td><td>$110,667<\/td><\/tr><tr><td>Accounting salvage value<\/td><td>$0<\/td><td>$0<\/td><\/tr><tr><td>Expected salvage value (after three years)<\/td><td>$90,000<\/td><td>$113,000<\/td><\/tr><\/table><\/div><p>Analysts at GigaTech have noted that investment in the Tera Project can be delayed for up to nine months if managers at the company decide this is necessary. However, once the capital investment is made, the project will be necessary to maintain continuing operations. Tera Project can be scaled up with more equipment requiring less capital than the original investment if results are meeting expectations. In addition, the equipment used in Tera Project can be used in shift work if brief excess demand is expected.<\/p><p>GigaTech is also considering expanding its software development operations in India. Software development equipment must be continually replaced to maintain efficiency as newer and faster technology is developed. The company has identified two mutually exclusive potential expansion projects, Zeta and Sigma. Zeta requires investing in equipment with a 3-year life, while Sigma requires investing in equipment with a 2-year life. GigaTech has estimated real capital costs for the two projects at 10.58%. GigaTech expects inflation to be approximately 4.0% for the foreseeable future. Nominal cash flows and net present values for the Zeta and Sigma projects are provided in the following table:<\/p><p>Annual Cash Flows<\/p><div class=\"tbl\"><table><tr><td>Project<\/td><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>NPV<\/td><\/tr><tr><td>Zeta<\/td><td>–$360,000 $250,000 $220,000 $190,000 $148,671<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Sigma<\/td><td>–$470,000 $330,000 $390,000<\/td><td>$0<\/td><td>$111,853<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following best describes how GigaTech should implement scenario analysis to analyze the Tera Project?<\/p><\/div>", "subj": "corporate"}, {"n": 27, "q": "Which of the following is least likely to be a real option available to GigaTech with regard to the Tera Project?", "opts": ["Abandonment option.", "Expansion option.", "Flexibility option."], "ans": "A", "expl": "Once the Tera Project is begun, the project will be necessary for continuing operations. This is likely a result of the replacement nature of the project. If the equipment necessary for GigaTech's operations is replaced with newer equipment, abandoning the project is not really an option. Management does have the option of scaling up the project after initiation, which is known as an expansion option. Management can also wait up to nine months to make a decision on the Tera Project, giving them a timing option (note that this is not one of the answer choices). Finally, the equipment used in the Tera Project can support additional shifts if demand for GigaTech's products temporarily exceeds supply, giving them a flexibility option (specifically a production-flexibility option). For Further Reference: (Study Session 7, Module 19.3, LOS 19.f)", "explhtml": "<p>Once the Tera Project is begun, the project will be necessary for continuing operations. This is likely a result of the replacement nature of the project. If the equipment necessary for GigaTech&#x27;s operations is replaced with newer equipment, abandoning the project is not really an option. Management does have the option of scaling up the project after initiation, which is known as an expansion option. Management can also wait up to nine months to make a decision on the Tera Project, giving them a timing option (note that this is not one of the answer choices). Finally, the equipment used in the Tera Project can support additional shifts if demand for GigaTech&#x27;s products temporarily exceeds supply, giving them a flexibility option (specifically a production-flexibility option).<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 7, Module 19.3, LOS 19.f)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>GigaTech, Inc., is a large U.S.-based technology conglomerate. The firm has business units in three primary categories: (1) hardware manufacturing, (2) software development, and (3) consulting services. Because of the rapid pace of technological innovation, GigaTech must make capital investments every two to four years. The company has identified several potential investment opportunities for its hardware manufacturing division. The first of these opportunities, Tera Project, would replace a portion of GigaTech&#x27;s microprocessor assembly equipment with new machinery expected to last three years. The current machinery has a book value of $120,000 and a market value of $195,000. The Tera Project would require purchasing machinery for $332,000, increasing current assets by $190,000, and increasing current liabilities by $80,000. GigaTech has a tax rate of 40%. Additional pro forma information related to the Tera Project is provided in the following table:<\/p><p>Existing Equipment Tera Project<\/p><div class=\"tbl\"><table><tr><td>Annual sales<\/td><td>$523,000<\/td><td>$708,000<\/td><\/tr><tr><td>Cash operating expenses<\/td><td>$352,000<\/td><td>$440,000<\/td><\/tr><tr><td>Annual depreciation<\/td><td>$40,000<\/td><td>$110,667<\/td><\/tr><tr><td>Accounting salvage value<\/td><td>$0<\/td><td>$0<\/td><\/tr><tr><td>Expected salvage value (after three years)<\/td><td>$90,000<\/td><td>$113,000<\/td><\/tr><\/table><\/div><p>Analysts at GigaTech have noted that investment in the Tera Project can be delayed for up to nine months if managers at the company decide this is necessary. However, once the capital investment is made, the project will be necessary to maintain continuing operations. Tera Project can be scaled up with more equipment requiring less capital than the original investment if results are meeting expectations. In addition, the equipment used in Tera Project can be used in shift work if brief excess demand is expected.<\/p><p>GigaTech is also considering expanding its software development operations in India. Software development equipment must be continually replaced to maintain efficiency as newer and faster technology is developed. The company has identified two mutually exclusive potential expansion projects, Zeta and Sigma. Zeta requires investing in equipment with a 3-year life, while Sigma requires investing in equipment with a 2-year life. GigaTech has estimated real capital costs for the two projects at 10.58%. GigaTech expects inflation to be approximately 4.0% for the foreseeable future. Nominal cash flows and net present values for the Zeta and Sigma projects are provided in the following table:<\/p><p>Annual Cash Flows<\/p><div class=\"tbl\"><table><tr><td>Project<\/td><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>NPV<\/td><\/tr><tr><td>Zeta<\/td><td>–$360,000 $250,000 $220,000 $190,000 $148,671<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Sigma<\/td><td>–$470,000 $330,000 $390,000<\/td><td>$0<\/td><td>$111,853<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following is least likely to be a real option available to GigaTech with regard to the Tera Project?<\/p><\/div>", "subj": "corporate"}, {"n": 28, "q": "Using the least common multiple of lives approach, determine whether the Zeta Project or the Sigma Project will increase the value of GigaTech by a greater amount.", "opts": ["Zeta Project.", "Sigma Project.", "Both projects increase GigaTech’s value by the same amount."], "ans": "B", "expl": "The least common multiple of lives approach requires estimating the least common denominator between two mutually exclusive projects with unequal lives. Since the Zeta and Sigma projects have lives of 3 and 2, the least common multiple is 6. The cash flows must be stated over a 6-year period, repeating the cash flow pattern as often as necessary (two times for Zeta and three times for Sigma). The cash flows are then discounted to find the net present value (NPV). The project with the highest NPV is selected. The cash flows are as follows: Year 0 1 2 3 4 5 6 Zeta Project –360,000 250,000 220,000 190,000 –360,000 250,000 220,000 190,000 Total –360,000 250,000 220,000 –170,000 250,000 220,000 190,000 Sigma Project –470,000 330,000 390,000 –470,000 330,000 390,000 –470,000 330,000 390,000 Total –470,000 330,000 -80,000 330,000 –80,000 330,000 390,000 Before calculating the NPV of each project, the cost of capital must be restated in nominal terms since the cash flow projections are stated in nominal terms. The nominal cost of capital is equal to 15.0% = (1 + 0.1058)(1 + 0.04). The NPV of each project is calculated as follows: Since its NPV is greater, GigaTech should select the Sigma project. For Further Reference: (Study Session 7, Module 19.2, LOS 19.c)", "explhtml": "<p>The least common multiple of lives approach requires estimating the least common denominator between two mutually exclusive projects with unequal lives. Since the Zeta and Sigma projects have lives of 3 and 2, the least common multiple is 6. The cash flows must be stated over a 6-year period, repeating the cash flow pattern as often as necessary (two times for Zeta and three times for Sigma). The cash flows are then discounted to find the net present value (NPV). The project with the highest NPV is selected. The cash flows are as follows:<\/p><p>Year<\/p><div class=\"tbl\"><table><tr><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><td>6<\/td><\/tr><tr><td>Zeta Project<\/td><td>–360,000 250,000<\/td><td>220,000<\/td><td>190,000<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>–360,000<\/td><td>250,000 220,000 190,000<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Total<\/td><td>–360,000 250,000<\/td><td>220,000 –170,000<\/td><td>250,000 220,000 190,000<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Sigma Project –470,000 330,000<\/td><td>390,000<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>–470,000<\/td><td>330,000<\/td><td>390,000<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>–470,000 330,000 390,000<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Total<\/td><td>–470,000 330,000<\/td><td>-80,000<\/td><td>330,000<\/td><td>–80,000 330,000 390,000<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Before calculating the NPV of each project, the cost of capital must be restated in nominal terms since the cash flow projections are stated in nominal terms. The nominal cost of capital is equal to 15.0% = (1 + 0.1058)(1 + 0.04). The NPV of each project is calculated as follows:<\/p><p>Since its NPV is greater, GigaTech should select the Sigma project.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 7, Module 19.2, LOS 19.c)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>GigaTech, Inc., is a large U.S.-based technology conglomerate. The firm has business units in three primary categories: (1) hardware manufacturing, (2) software development, and (3) consulting services. Because of the rapid pace of technological innovation, GigaTech must make capital investments every two to four years. The company has identified several potential investment opportunities for its hardware manufacturing division. The first of these opportunities, Tera Project, would replace a portion of GigaTech&#x27;s microprocessor assembly equipment with new machinery expected to last three years. The current machinery has a book value of $120,000 and a market value of $195,000. The Tera Project would require purchasing machinery for $332,000, increasing current assets by $190,000, and increasing current liabilities by $80,000. GigaTech has a tax rate of 40%. Additional pro forma information related to the Tera Project is provided in the following table:<\/p><p>Existing Equipment Tera Project<\/p><div class=\"tbl\"><table><tr><td>Annual sales<\/td><td>$523,000<\/td><td>$708,000<\/td><\/tr><tr><td>Cash operating expenses<\/td><td>$352,000<\/td><td>$440,000<\/td><\/tr><tr><td>Annual depreciation<\/td><td>$40,000<\/td><td>$110,667<\/td><\/tr><tr><td>Accounting salvage value<\/td><td>$0<\/td><td>$0<\/td><\/tr><tr><td>Expected salvage value (after three years)<\/td><td>$90,000<\/td><td>$113,000<\/td><\/tr><\/table><\/div><p>Analysts at GigaTech have noted that investment in the Tera Project can be delayed for up to nine months if managers at the company decide this is necessary. However, once the capital investment is made, the project will be necessary to maintain continuing operations. Tera Project can be scaled up with more equipment requiring less capital than the original investment if results are meeting expectations. In addition, the equipment used in Tera Project can be used in shift work if brief excess demand is expected.<\/p><p>GigaTech is also considering expanding its software development operations in India. Software development equipment must be continually replaced to maintain efficiency as newer and faster technology is developed. The company has identified two mutually exclusive potential expansion projects, Zeta and Sigma. Zeta requires investing in equipment with a 3-year life, while Sigma requires investing in equipment with a 2-year life. GigaTech has estimated real capital costs for the two projects at 10.58%. GigaTech expects inflation to be approximately 4.0% for the foreseeable future. Nominal cash flows and net present values for the Zeta and Sigma projects are provided in the following table:<\/p><p>Annual Cash Flows<\/p><div class=\"tbl\"><table><tr><td>Project<\/td><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>NPV<\/td><\/tr><tr><td>Zeta<\/td><td>–$360,000 $250,000 $220,000 $190,000 $148,671<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Sigma<\/td><td>–$470,000 $330,000 $390,000<\/td><td>$0<\/td><td>$111,853<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Using the least common multiple of lives approach, determine whether the Zeta Project or the Sigma Project will increase the value of GigaTech by a greater amount.<\/p><\/div>", "subj": "corporate"}, {"n": 29, "q": "Regarding the statements in the board of directors' memo related to Superior's capital rationing system and its method of projecting project cash flows:", "opts": ["only the statement regarding capital rationing is correct.", "only the statement regarding cash flow projections is correct.", "neither the statement regarding capital rationing nor the statement regarding cash flow projections is correct."], "ans": "C", "expl": "The comments in the memo from Superior's board of directors are both incorrect. Earnings per share (EPS) is not a suitable criteria to evaluate capital budgeting projects. Under capital rationing, a firm selects the projects that increase the value of the firm by the greatest amount (i.e., have the highest NPV) subject to the capital constraints of the firm's budget. It is perfectly possible that projects that increase EPS will not get selected. For example, if a project has an NPV of $80 and increases EPS by $0.50 and a second project has an NPV of $200 but will initially reduce EPS by $0.20, the firm should select the second project (if its capital budget will allow it) since it adds more value. The capital budgeting process should not consider sunk costs (i.e., past costs that do not affect the cash flows of the project) such as costs to find investment projects. The cash flow projections should consider the economic impact from increased competition resulting from highly profitable investment projects. For Further Reference: (Study Session 7, Module 19.2, LOS 19.c)", "explhtml": "<p>The comments in the memo from Superior&#x27;s board of directors are both incorrect. Earnings per share (EPS) is not a suitable criteria to evaluate capital budgeting projects. Under capital rationing, a firm selects the projects that increase the value of the firm by the greatest amount (i.e., have the highest NPV) subject to the capital constraints of the firm&#x27;s budget. It is perfectly possible that projects that increase EPS will not get selected. For example, if a project has an NPV of $80 and increases EPS by $0.50 and a second project has an NPV of $200 but will initially reduce EPS by $0.20, the firm should select the second project (if its capital budget will allow it) since it adds more value. The capital budgeting process should not consider sunk costs (i.e., past costs that do not affect the cash flows of the project) such as costs to find investment projects. The cash flow projections should consider the economic impact from increased competition resulting from highly profitable investment projects.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 7, Module 19.2, LOS 19.c)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Corporate Issuers<\/summary><div class=\"vig-body\"><p>Dave Johnson, CFA is an equity analyst at DJ Advisors. Currently, Johnson is analyzing Superior Products, Inc., a consumer durables manufacturer. Recently, Superior&#x27;s board of directors has become concerned with the firm&#x27;s capital budgeting decisions and has asked management to provide a detailed explanation of the capital budgeting process. After reviewing the report from management, the board makes the following comments in a memo:<\/p><p>The capital rationing system being utilized is fundamentally flawed since, in some instances, projects that do not increase earnings per share are selected over projects that do increase earnings per share. The cash flow projections are flawed since they fail to include costs incurred in the search for projects or the economic consequences of increased competition resulting from highly profitable projects. We are making inappropriate investment decisions since the discount rate used to evaluate all potential projects is the firm&#x27;s weighted average cost of capital.<\/p><p>Superior is in the preliminary stages of starting a new division focusing on energy efficient and environment-friendly appliances. Superior&#x27;s investment banker suggests that the company raise capital for the new division via specially labeled debt securities. Superior also needs to refinance existing debentures coming due over the next year and contemplates a single issue to cover both the capital needs of the new division and refinancing of maturing debentures.<\/p><p>Johnson is concerned about interlocking directorships and asks Jennifer Mogan, corporate governance specialist at DJ, about them. Mogan makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Family control of a corporation is beneficial because it reduces the principal-agent problem.<\/td><\/tr><tr><td>Statement 2: <\/td><td>An advantage of family ownership of a corporation is that it is easier to attract quality talent for<\/td><\/tr><tr><td>management positions.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding the statements in the board of directors&#x27; memo related to Superior&#x27;s capital rationing system and its method of projecting project cash flows:<\/p><\/div>", "subj": "corporate"}, {"n": 30, "q": "Which of the following would most effectively correct Superior's discount rate problem described in the board of directors' memo?", "opts": ["Use the firm’s marginal cost of capital to evaluate all potential projects.", "Use a beta specific to each potential project to determine the appropriate discount rate.", "Use the cost of the firm’s equity capital to discount the cash flows of all potential projects."], "ans": "B", "expl": "When evaluating potential capital investment projects, the discount rate should be adjusted for the risk of the project under consideration. This is frequently accomplished by determining a project beta and using this beta in the CAPM security market line equation: r = R + β [E(R ) − R ]. Project betas can be determined in a number of ways including using proxy firms with i F i M F operations similar to the project under consideration, estimating an accounting beta, or through cross-sectional regression analysis. Whatever method used to determine the discount rate, it should be clear that the weighted average cost of capital (WACC) is only appropriate for projects with risk similar to the overall firm. If a project is more (less) risky than the overall firm, the discount rate used to evaluate the project should be greater (less) than the firm's WACC. For Further Reference: (Study Session 7, Module 19.2, LOS 19.e)", "explhtml": "<p>When evaluating potential capital investment projects, the discount rate should be adjusted for the risk of the project under consideration. This is frequently accomplished by determining a project beta and using this beta in the CAPM security market line equation: r  = R  + β [E(R ) − R ]. Project betas can be determined in a number of ways including using proxy firms with<\/p><div class=\"tbl\"><table><tr><td>i<\/td><td>F<\/td><td>i<\/td><td>M<\/td><td>F<\/td><\/tr><\/table><\/div><p>operations similar to the project under consideration, estimating an accounting beta, or through cross-sectional regression analysis. Whatever method used to determine the discount rate, it should be clear that the weighted average cost of capital (WACC) is only appropriate for projects with risk similar to the overall firm. If a project is more (less) risky than the overall firm, the discount rate used to evaluate the project should be greater (less) than the firm&#x27;s WACC.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 7, Module 19.2, LOS 19.e)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dave Johnson, CFA is an equity analyst at DJ Advisors. Currently, Johnson is analyzing Superior Products, Inc., a consumer durables manufacturer. Recently, Superior&#x27;s board of directors has become concerned with the firm&#x27;s capital budgeting decisions and has asked management to provide a detailed explanation of the capital budgeting process. After reviewing the report from management, the board makes the following comments in a memo:<\/p><p>The capital rationing system being utilized is fundamentally flawed since, in some instances, projects that do not increase earnings per share are selected over projects that do increase earnings per share. The cash flow projections are flawed since they fail to include costs incurred in the search for projects or the economic consequences of increased competition resulting from highly profitable projects. We are making inappropriate investment decisions since the discount rate used to evaluate all potential projects is the firm&#x27;s weighted average cost of capital.<\/p><p>Superior is in the preliminary stages of starting a new division focusing on energy efficient and environment-friendly appliances. Superior&#x27;s investment banker suggests that the company raise capital for the new division via specially labeled debt securities. Superior also needs to refinance existing debentures coming due over the next year and contemplates a single issue to cover both the capital needs of the new division and refinancing of maturing debentures.<\/p><p>Johnson is concerned about interlocking directorships and asks Jennifer Mogan, corporate governance specialist at DJ, about them. Mogan makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Family control of a corporation is beneficial because it reduces the principal-agent problem.<\/td><\/tr><tr><td>Statement 2: <\/td><td>An advantage of family ownership of a corporation is that it is easier to attract quality talent for<\/td><\/tr><tr><td>management positions.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following would most effectively correct Superior&#x27;s discount rate problem described in the board of directors&#x27; memo?<\/p><\/div>", "subj": "corporate"}, {"n": 31, "q": "Which of the following would most accurately describe (1) the debt security envisioned by Superior's investment banker to finance the new division, and (2) Superior's intention to channel some of the proceeds of the new debt securities to refinance existing debentures? New debt security Use of proceeds for other purposes", "opts": ["climate bonds lower cost financing", "ESG bonds diversion", "green bonds greenwashing"], "ans": "C", "expl": "Green bonds are bonds issued to finance green projects. Greenwashing is the diversion of the proceeds from green bonds to purposes other than what the bonds were originally purported to finance. For Further Reference: (Study Session 8, Module 22.2, LOS 22.d)", "explhtml": "<p>Green bonds are bonds issued to finance green projects. Greenwashing is the diversion of the proceeds from green bonds to purposes other than what the bonds were originally purported to finance.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 8, Module 22.2, LOS 22.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dave Johnson, CFA is an equity analyst at DJ Advisors. Currently, Johnson is analyzing Superior Products, Inc., a consumer durables manufacturer. Recently, Superior&#x27;s board of directors has become concerned with the firm&#x27;s capital budgeting decisions and has asked management to provide a detailed explanation of the capital budgeting process. After reviewing the report from management, the board makes the following comments in a memo:<\/p><p>The capital rationing system being utilized is fundamentally flawed since, in some instances, projects that do not increase earnings per share are selected over projects that do increase earnings per share. The cash flow projections are flawed since they fail to include costs incurred in the search for projects or the economic consequences of increased competition resulting from highly profitable projects. We are making inappropriate investment decisions since the discount rate used to evaluate all potential projects is the firm&#x27;s weighted average cost of capital.<\/p><p>Superior is in the preliminary stages of starting a new division focusing on energy efficient and environment-friendly appliances. Superior&#x27;s investment banker suggests that the company raise capital for the new division via specially labeled debt securities. Superior also needs to refinance existing debentures coming due over the next year and contemplates a single issue to cover both the capital needs of the new division and refinancing of maturing debentures.<\/p><p>Johnson is concerned about interlocking directorships and asks Jennifer Mogan, corporate governance specialist at DJ, about them. Mogan makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Family control of a corporation is beneficial because it reduces the principal-agent problem.<\/td><\/tr><tr><td>Statement 2: <\/td><td>An advantage of family ownership of a corporation is that it is easier to attract quality talent for<\/td><\/tr><tr><td>management positions.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following would most accurately describe (1) the debt security envisioned by Superior&#x27;s investment banker to finance the new division, and (2) Superior&#x27;s intention to channel some of the proceeds of the new debt securities to refinance existing debentures?<\/p><div class=\"tbl\"><table><tr><td>New debt security<\/td><td>Use of proceeds for other purposes<\/td><\/tr><\/table><\/div><\/div>", "subj": "corporate"}, {"n": 32, "q": "Which of Mogan's statements are correct?", "opts": ["Statement 1 only.", "Statement 2 only.", "Both statements are correct."], "ans": "A", "expl": "Only statement 1 is correct. One advantage of family control is that principal-agent issues may be reduced. On the other hand, family ownership can make it difficult to recruit quality outsiders for management, and often leads to lack of concern for minority shareholders, as well as minimal transparency and low accountability by management. For Further Reference: (Study Session 8, Module 22.1, LOS 22.a)", "explhtml": "<p>Only statement 1 is correct. One advantage of family control is that principal-agent issues may be reduced. On the other hand, family ownership can make it difficult to recruit quality outsiders for management, and often leads to lack of concern for minority shareholders, as well as minimal transparency and low accountability by management.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 8, Module 22.1, LOS 22.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dave Johnson, CFA is an equity analyst at DJ Advisors. Currently, Johnson is analyzing Superior Products, Inc., a consumer durables manufacturer. Recently, Superior&#x27;s board of directors has become concerned with the firm&#x27;s capital budgeting decisions and has asked management to provide a detailed explanation of the capital budgeting process. After reviewing the report from management, the board makes the following comments in a memo:<\/p><p>The capital rationing system being utilized is fundamentally flawed since, in some instances, projects that do not increase earnings per share are selected over projects that do increase earnings per share. The cash flow projections are flawed since they fail to include costs incurred in the search for projects or the economic consequences of increased competition resulting from highly profitable projects. We are making inappropriate investment decisions since the discount rate used to evaluate all potential projects is the firm&#x27;s weighted average cost of capital.<\/p><p>Superior is in the preliminary stages of starting a new division focusing on energy efficient and environment-friendly appliances. Superior&#x27;s investment banker suggests that the company raise capital for the new division via specially labeled debt securities. Superior also needs to refinance existing debentures coming due over the next year and contemplates a single issue to cover both the capital needs of the new division and refinancing of maturing debentures.<\/p><p>Johnson is concerned about interlocking directorships and asks Jennifer Mogan, corporate governance specialist at DJ, about them. Mogan makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Family control of a corporation is beneficial because it reduces the principal-agent problem.<\/td><\/tr><tr><td>Statement 2: <\/td><td>An advantage of family ownership of a corporation is that it is easier to attract quality talent for<\/td><\/tr><tr><td>management positions.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of Mogan&#x27;s statements are correct?<\/p><\/div>", "subj": "corporate"}, {"n": 33, "q": "If Broadstore proceeded with Scenario 3, it is most likely that:", "opts": ["Sagan Termett’s shareholders would not have to pay tax on any capital gains on the transaction.", "the transaction may be subject to approval by Sagan Termett’s shareholders.", "Broadstore would be required to assume the liabilities of Sagan Termett."], "ans": "A", "expl": "If assets are purchased rather than shares, payment is made to the target company; the company will pay tax on any capital gains, not the shareholders. Purchasing assets instead of the share capital is a way to avoid assumption of liabilities, and when less than 50% of a target's assets are sold, shareholder approval is not normally required. For Further Reference: (Study Session 8, Module 23.2, LOS 23.e)", "explhtml": "<p>If assets are purchased rather than shares, payment is made to the target company; the company will pay tax on any capital gains, not the shareholders. Purchasing assets instead of the share capital is a way to avoid assumption of liabilities, and when less than 50% of a target&#x27;s assets are sold, shareholder approval is not normally required.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 8, Module 23.2, LOS 23.e)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Corporate Issuers<\/summary><div class=\"vig-body\"><p>Broadstore, Inc., is a retailer operating in urban areas in the eastern and mid- western United States. Currently, Broadstore operates 120 retail outlets, but its executives seek to expand significantly. In order to achieve the rapid expansion, the board has identified two acquisition targets they believe could add value for Broadstore&#x27;s shareholders.<\/p><p>The first target is retailer Sagan Termett, Inc., (Sagan). Sagan&#x27;s store locations are geographically distributed in a way that would complement Broadstore without too much overlap; Sagan&#x27;s stores are primarily on the west coast. Broadstore&#x27;s board believes the company may be receptive to a bid at the right price.<\/p><p>Jackson Torrelle, CFA, works for Broadstore and has been asked to look at the details of a possible share-for-share exchange. The board believes that synergies of $2.3 million per year in perpetuity would be realized if the companies merged.<\/p><p>Broadstore currently has 20 million shares outstanding with a market price of $19.20 per share. Sagan Termett has 15.75 million shares outstanding with a market price of $16.20 per share. Torrelle has been asked to consider the following three scenarios for a possible merger:<\/p><div class=\"tbl\"><table><tr><td>Scenario 1: <\/td><td>Broadstore offers to acquire 100% of Sagan Termett&#x27;s shares in exchange for 13 million newly<\/td><\/tr><tr><td>issued shares in the merged entity.<\/td><td><\/td><\/tr><tr><td>Scenario 2: <\/td><td>Broadstore offers to purchase 100% of Sagan Termett&#x27;s shares for $270 million.<\/td><\/tr><tr><td>Scenario 3: <\/td><td>Broadstore offers to purchase approximately 30% of Sagan Termett&#x27;s stores for cash.<\/td><\/tr><\/table><\/div><p>Torrelle intends to calculate the present value of any synergies using a discount rate of 8%. However, he has concerns as to whether any synergies will be realized and has sent an email to the CFO outlining the consequences of the synergies not being realized. An extract from the email is shown in Exhibit 1.<\/p><p><b>Exhibit 1: Torrelle Email (Extract)<\/b><\/p><p>&quot;…the assumed synergies arise primarily from the synchronization of accounting systems. I believe the estimate of the annual savings excludes significant one-off costs of training and the costs of running the systems in parallel. I estimate that these costs would reduce the present value of synergies by $8 million.&quot;<\/p><p>The second target is Exellara, Inc., a company that offers logistical solutions to retailers. Exellara already works with Broadstore, providing most of its distribution network.<\/p><p>Broadstore has only recently identified Exellara as a target and has yet to calculate a value for the company. As part of a preliminary review, the board has obtained a recently published research report that contains a comparable company analysis for Exellara. An extract from the report is shown in Exhibit 2.<\/p><p><b>Exhibit 2: Exellara Research Report (Extract)<\/b><\/p><div class=\"tbl\"><table><tr><td>Relative Valuation<\/td><td>Company I Company II Company III<\/td><\/tr><\/table><\/div><p>Ratio<\/p><div class=\"tbl\"><table><tr><td>P/E<\/td><td>12.3<\/td><td>15.8<\/td><td>9.9<\/td><\/tr><tr><td>P/S<\/td><t lass=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Sentinel News is a publisher of more than 100 newspapers around the country, with the exception of the Midwestern states. The company&#x27;s CFO, Harry Miller, has been reviewing a number of potential candidates (both public and private companies) that would provide Sentinel News entrance into the Midwestern market. Recently, the founder of Midwest News, a private newspaper company, passed away. The founder&#x27;s family members are inclined to sell their 80% controlling interest. The family members are concerned that Midwest News&#x27;s declining newspaper circulation is not cyclical, but rather permanent. The family members would reinvest the cash proceeds from the sale of Midwest News into a diversified portfolio of stocks and bonds. Miller&#x27;s staff collects the financial information shown in Exhibit 1.<\/p><p><b>Exhibit 1: Midwest News&#x27;s Financial Information<\/b><\/p><div class=\"tbl\"><table><tr><td>Total assets<\/td><td>$92.5 million<\/td><\/tr><tr><td>Total debt<\/td><td>$0<\/td><\/tr><tr><td>Total equity<\/td><td>$79.5 million<\/td><\/tr><tr><td>Shares outstanding<\/td><td>1.5 million<\/td><\/tr><tr><td>Revenues<\/td><td>$251.5 million<\/td><\/tr><tr><td>Net income (next year&#x27;s forecast)<\/td><td>$19.5 million<\/td><\/tr><\/table><\/div><p>Miller noted that Midwest News does not pay a dividend, nor does the company have any debt. The most comparable publicly traded stock is Freedom Corporation. Freedom, however, has significant radio and television operations. Freedom&#x27;s estimated beta is 0.90, and 40% of the company&#x27;s capital structure is debt. Freedom is expected to maintain a payout ratio of 40%. Analysts are forecasting the company will earn $3.00 per share next year and grow their earnings by 6% per year. Freedom has a current market capitalization of $15 billion and 375 million shares outstanding. Freedom&#x27;s current market value equals its intrinsic value.<\/p><p>Miller&#x27;s staff uses current expectations to develop the appropriate equity risk premium for Midwest News. The staff uses the Gordon growth model to estimate Midwest&#x27;s equity risk premium. The equity risk premium calculated by the staff is provided in Exhibit 2.<\/p><p>Miller believes the best method to estimate the required return on equity of Midwest News is the build-up method. All relevant information to determine Midwest News&#x27;s required return on equity is presented in Exhibit 2.<\/p><p><b>Exhibit 2: Required Return Estimate Factors<\/b><\/p><div class=\"tbl\"><table><tr><td>Risk-free rate<\/td><td>3.5%<\/td><\/tr><tr><td>Equity risk premium<\/td><td>4.0%<\/td><\/tr><tr><td>Small size premium<\/td><td>3.5%<\/td><\/tr><\/table><\/div><p>Specific-company premium 2.0%<\/p><div class=\"tbl\"><table><tr><td>Beta<\/td><td>1.2<\/td><\/tr><tr><td>Growth rate<\/td><td>3.0%<\/td><\/tr><\/table><\/div><p>The specific-company premium reflects concerns about future industry performance and business risk in Midwest News. Miller makes two statements concerning the valuation methodology used to value Midwest News&#x27;s equity.<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>The required return estimate that is calculated from Exhibit 2 reflects all adjustments needed to<\/td><\/tr><tr><td>make an accurate valuation of Midwest News.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>It is better to use the free cash flow model to value Midwest News than a dividend discount<\/td><\/tr><tr><td>model.<\/td><td><\/td><\/tr><\/table><\/div><p>Miller considered two different valuation models to determine the price of Midwest News&#x27;s equity: a single-stage free cash flow model and a single-stage residual income model.<\/p><\/div><\/details><div class=\"qtext\"><p>Using Freedom Corporation as a comparable, the estimated beta for Midwest News is most likely:<\/p><\/div>", "subj": "equity"}, {"n": 38, "q": "The est News&#x27;s equity.<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>The required return estimate that is calculated from Exhibit 2 reflects all adjustments needed to<\/td><\/tr><tr><td>make an accurate valuation of Midwest News.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>It is better to use the free cash flow model to value Midwest News than a dividend discount<\/td><\/tr><tr><td>model.<\/td><td><\/td><\/tr><\/table><\/div><p>Miller considered two different valuation models to determine the price of Midwest News&#x27;s equity: a single-stage free cash flow model and a single-stage residual income model.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2 and using the build-up method, Midwest News&#x27;s required return on equity is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 41, "q": "Using the single-stage residual income model and assuming the required return on equity is 15%, the value of Midwest News is closest to (use information in Exhibits 1 and 2):", "opts": ["$75 per share.", "$95 per share.", "$115 per share."], "ans": "B", "expl": "ROE = $19.5 million / $79.5 million = 0.245 r = 0.15 (given in problem) g = 0.03 (given in Exhibit 2) For Further Reference: (Study Session 11, Module 30.2, LOS 30.d)", "explhtml": "<p>ROE = $19.5 million / $79.5 million = 0.245<\/p><p>r = 0.15 (given in problem)<\/p><p>g = 0.03 (given in Exhibit 2)<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 11, Module 30.2, LOS 30.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sentinel News is a publisher of more than 100 newspapers around the country, with the exception of the Midwestern states. The company&#x27;s CFO, Harry Miller, has been reviewing a number of potential candidates (both public and private companies) that would provide Sentinel News entrance into t
