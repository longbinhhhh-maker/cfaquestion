td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Holding firm size and consensus earnings growth forecasts constant, the estimated average difference in stock returns between neglected and non-neglected firms equals:<\/p><\/div>", "subj": "quant"}, {"n": 11, "q": "Pilchard derives the ANOVA table for her regression. In her ANOVA table, the degrees of freedom for the regression sum of squares and total sum of squares should equal:", "opts": ["3 and 30, respectively.", "4 and 29, respectively.", "3 and 29, respectively."], "ans": "C", "expl": "The ANOVA (Analysis of Variance) Table provides data on the sources of variation in the dependent variable (stock returns). The degrees of freedom for the regression sum of squares (a.k.a., the explained sum of squares) equals k, the number of independent variables: k = 3 in Pilchard's regression. The total sum of squares equals the numerator of the sample variance formula for the dependent variable. Recall from Level I Quantitative Methods that the denominator of a sample variance equals N − 1. The denominator in the sample variance equals the degrees of freedom for the numerator (the total sum of squares). Therefore, the degrees of freedom for the total sum of squares in Pilchard's regression equals 30 − 1 = 29. For Further Reference: (Study Session 2, Module 4.4, LOS 4.g, Module 5.3, LOS 5.g)", "explhtml": "<p>The ANOVA (Analysis of Variance) Table provides data on the sources of variation in the dependent variable (stock returns). The degrees of freedom for the regression sum of squares (a.k.a., the explained sum of squares) equals k, the number of independent variables: k = 3 in Pilchard&#x27;s regression. The total sum of squares equals the numerator of the sample variance formula for the dependent variable. Recall from Level I Quantitative Methods that the denominator of a sample variance equals N − 1. The denominator in the sample variance equals the degrees of freedom for the numerator (the total sum of squares). Therefore, the degrees of freedom for the total sum of squares in Pilchard&#x27;s regression equals 30 − 1 = 29.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 2, Module 4.4, LOS 4.g, Module 5.3, LOS 5.g)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lena Pilchard, research associate for Eiffel Investments, is attempting to measure the value added to the Eiffel Investments portfolio from the use of 1-year earnings growth forecasts developed by professional analysts.<\/p><p>Pilchard&#x27;s supervisor, Edna Wilrus, recommends a portfolio allocation strategy that overweights neglected firms. Wilrus cites studies of the &quot;neglected firm effect,&quot; in which companies followed by a small number of professional analysts are associated with higher returns than firms followed by a larger number of analysts. Wilrus considers a company covered by three or fewer analysts to be &quot;neglected.&quot;<\/p><p>Pilchard also is aware of research indicating that, on average, stock returns for small firms have been higher than those earned by large firms. Pilchard develops a model to predict stock returns based on analyst coverage, firm size, and analyst growth forecasts. She runs the following cross-sectional regression using data for the 30 stocks included in the Eiffel Investments portfolio:<\/p><p>R  = b  + b COVERAGE  + b  LN(SIZE ) + b (FORECAST ) + e<\/p><div class=\"tbl\"><table><tr><td>i<\/td><td>0<\/td><td>1<\/td><td>i<\/td><td>2<\/td><td>i<\/td><td>3<\/td><td>i<\/td><td>i<\/td><\/tr><tr><td>where:<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>R  = the rate of return on stock i<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>i<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>COVERAGE  = one if there are three or fewer analysts covering stock i, and equals zero otherwise<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>i<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>LN(SIZE ) = the natural logarithm of the market capitalization (stock price times shares outstanding) for stock i, units in<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>i<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>millions<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>FORECAST  = the 1-year consensus earnings growth rate forecast for stock i<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>i<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Pilchard derives the following results from her cross-sectional regression:<\/p><p><b>Exhibit 1: Results of Pilchard&#x27;s Cross-Sectional Regression<\/b><\/p><div class=\"tbl\"><table><tr><td>Variable<\/td><td>Coefficient t-Statistic<\/td><td><\/td><\/tr><tr><td>Constant<\/td><td>0.060<\/td><td>1.56<\/td><\/tr><tr><td>COVERAGE<\/td><td>0.050<\/td><td>3.20<\/td><\/tr><tr><td>LN(SIZE)<\/td><td>–0.003<\/td><td>–2.50<\/td><\/tr><tr><td>FORECAST<\/td><td>0.200<\/td><td>2.85<\/td><\/tr><\/table><\/div><p>The standard error of estimate in Pilchard&#x27;s regression equals 1.96 and the regression sum of squares equals 400.<\/p><p>Wilrus provides Pilchard with the following values for analyst coverage, firm size, and earnings growth forecast for Eggmann Enterprises, a company that Eiffel Investments is evaluating.<\/p><p><b>Exhibit 2: Coverage, Firm Size, and Earnings Growth Forecast for Eggmann Enterpris edicted return for Eggmann Enterprises equals:<\/p><p>return = 0.06 + 0 − 0.003LN(500) + 0.20(0.50)<\/p><p>return = 14.14%<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 2, Module 4.3, LOS 4.e, Module 5.2, LOS 5.e)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lena Pilchard, research associate for Eiffel Investments, is attempting to measure the value added to the Eiffel Investments portfolio from the use of 1-year earnings growth forecasts developed by professional analysts.<\/p><p>Pilchard&#x27;s supervisor, Edna Wilrus, recommends a portfolio allocation strategy that overweights neglected firms. Wilrus cites studies of the &quot;neglected firm effect,&quot; in which companies followed by a small number of professional analysts are associated with higher returns than firms followed by a larger number of analysts. Wilrus considers a company covered by three or fewer analysts to be &quot;neglected.&quot;<\/p><p>Pilchard also is aware of research indicating that, on average, stock returns for small firms have been higher than those earned by large firms. Pilchard develops a model to predict stock returns based on analyst coverage, firm size, and analyst growth forecasts. She runs the following cross-sectional regression using data for the 30 stocks included in the Eiffel Investments portfolio:<\/p><p>R  = b  + b COVERAGE  + b  LN(SIZE ) + b (FORECAST ) + e<\/p><div class=\"tbl\"><table><tr><td>i<\/td><td>0<\/td><td>1<\/td><td>i<\/td><td>2<\/td><td>i<\/td><td>3<\/td><td>i<\/td><td>i<\/td><\/tr><tr><td>where:<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>R  = the rate of return on stock i<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>i<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>COVERAGE  = one if there are three or fewer analysts covering stock i, and equals zero otherwise<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>i<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>LN(SIZE ) = the natural logarithm of the market capitalization (stock price times shares outstanding) for stock i, units in<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>i<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>millions<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>FORECAST  = the 1-year consensus earnings growth rate forecast for stock i<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>i<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Pilchard derives the following results from her cross-sectional regression:<\/p><p><b>Exhibit 1: Results of Pilchard&#x27;s Cross-Sectional Regression<\/b><\/p><div class=\"tbl\"><table><tr><td>Variable<\/td><td>Coefficient t-Statistic<\/td><td><\/td><\/tr><tr><td>Constant<\/td><td>0.060<\/td><td>1.56<\/td><\/tr><tr><td>COVERAGE<\/td><td>0.050<\/td><td>3.20<\/td><\/tr><tr><td>LN(SIZE)<\/td><td>–0.003<\/td><td>–2.50<\/td><\/tr><tr><td>FORECAST<\/td><td>0.200<\/td><td>2.85<\/td><\/tr><\/table><\/div><p>The standard error of estimate in Pilchard&#x27;s regression equals 1.96 and the regression sum of squares equals 400.<\/p><p>Wilrus provides Pilchard with the following values for analyst coverage, firm size, and earnings growth forecast for Eggmann Enterprises, a company that Eiffel Investments is evaluating.<\/p><p><b>Exhibit 2: Coverage, Firm Size, and Earnings Growth Forecast for Eggmann Enterprises<\/b><\/p><div class=\"tbl\"><table><tr><td>Number of analysts<\/td><td>5<\/td><\/tr><tr><td>Firm size<\/td><td>$500 million<\/td><\/tr><\/table><\/div><p>Earnings growth forecast 50%<\/p><p>Pilchard uses the following table to conduct some of her hypothesis tests.<\/p><p><b>Exhibit 3: Critical Values for Student t-Distribution<\/b><\/p><p>Area in Upper Tail Degrees of Freedom<\/p><div class=\"tbl\"><table><tr><td>0.10<\/td><td>0.05<\/td><td>0.025<\/td><td>0.01<\/td><td>0.005<\/td><\/tr><tr><td>1.315 1.706 2.056 2.479 2.779<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>1.314 1.703 2.052 2.473 2.771<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>28<\/td><td>1.313 1.701 2.048 2.467 2.763<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>29<\/td><td>1.311<\/td><td>1.699 2.045 2.462 2.756<\/td><td><\/td><td><\/td><\/tr><tr><td>30<\/td><td>1.310 1.697 2.042 2.457 2.750<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Using the inputs for Eggmann Enterprises provided in Exhibit 2, the predicted stock return for Eggmann Enterprises is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 13, "q": "Using Angle's analysis, what is the nominal 1-year interest rate in Canada?", "opts": ["Less than 7%.", "Between 7% and 13%.", "Greater than 13%."], "ans": "C", "expl": "Angle uses the uncovered interest rate parity relationship to forecast future spot rates. If the Canadian dollar is expected to depreciate relative to the U.S. dollar and the Mexican peso, then nominal interest rates in Canada must be higher than those in the United States and Mexico. The 13% nominal interest rate in Mexico is higher than the nominal interest rate in the U.S., so the nominal interest rate in Canada must be greater than 13%. For Further Reference: (Study Session 4, Module 10.2, LOS 10.e)", "explhtml": "<p>Angle uses the uncovered interest rate parity relationship to forecast future spot rates. If the Canadian dollar is expected to depreciate relative to the U.S. dollar and the Mexican peso, then nominal interest rates in Canada must be higher than those in the United States and Mexico. The 13% nominal interest rate in Mexico is higher than the nominal interest rate in the U.S., so the nominal interest rate in Canada must be greater than 13%.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 4, Module 10.2, LOS 10.e)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Economics<\/summary><div class=\"vig-body\"><p>Debbie Angle and Craig Hohlman are analysts for a large commercial bank, Arbutus National Bank. Arbutus has extensive dealings in both the spot and forward foreign exchange markets. Angle and Hohlman are providing a refresher course on foreign exchange relationships for its traders.<\/p><p>Angle uses a three country example from North America to illustrate foreign exchange parity relations. In it, the Canadian dollar is expected to depreciate relative to the U.S. dollar and the Mexican peso. Nominal, 1-year interest rates are 7% in the United States and 13% in Mexico. From this data and using the uncovered interest rate parity relationship, Angle forecasts future spot rates.<\/p><p>During their presentation, Hohlman discusses the effect of monetary and fiscal policies on exchange rates. He cites a historical example from the United States, where the Federal Reserve shifted to an expansionary monetary policy to stimulate economic growth. This shift was largely unanticipated by the financial markets because the markets thought the Federal Reserve was more concerned with inflationary pressures. Hohlman states that the effect of this policy was an increase in economic growth and an increase in inflation. The cumulative effect on the dollar was unchanged, however, because, according to the Mundell-Fleming model, an expansionary monetary policy would strengthen the dollar whereas under relative purchasing power parity, an increase in inflation would weaken the dollar.<\/p><p>Regarding U.S. fiscal policies, Hohlman states that if these were unexpectedly expansionary, real interest rates would increase, which would produce an appreciation of the dollar. Hohlman adds that a sustained increase in the federal budget would attract foreign capital such that the long-run effect would be an increase in the value of the dollar.<\/p><p>Hohlman makes the following statements about parity conditions:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>If relative purchasing power parity holds, we can say that uncovered interest rate parity also<\/td><\/tr><tr><td>holds under certain conditions.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>For uncovered interest rate parity to hold, the forward rate must be an unbiased predictor of the<\/td><\/tr><tr><td>future spot rate.<\/td><td><\/td><\/tr><\/table><\/div><p>Angle next discusses the foreign exchange expectations. While examining Great Britain and Japan, she states that it appears the 1-year forward rate, which is currently ¥200/£, is an accurate predictor of the expected future spot rate. Furthermore, she states that uncovered interest rate parity and relative purchasing power parity hold. In the example for her presentation, she uses the following figures for the two countries.<\/p><p>Great Britain Japan<\/p><div class=\"tbl\"><table><tr><td>Expected GDP growth<\/td><td>2.50%<\/td><td>1.80%<\/td><\/tr><tr><td>Nominal 1-year interest rates<\/td><td>9.70%<\/td><td>6.40%<\/td><\/tr><tr><td>Growth in exports<\/td><td>3.90%<\/td><td>5.70%<\/td><\/tr><\/table><\/div><p>As a follow-up to Angle&#x27;s example, Hohlman discusses the use and evidence for purchasing power parity. He makes the following statements.<\/p><div class=\"tbl\"><table><tr><td>Statement 3: <\/td><td>Absolute purchasing power parity extends the law of one price and states that a basket of goods<\/td><\/tr><tr><td>should have the same price throughout the world. Absolute purchasing power parity is not widely<\/td><td><\/td><\/tr><tr><td>used in practice to forecast exchange rates.<\/td><td><\/td><\/tr><tr><td>Statement 4: <\/td><td>Although relative purchasing power parity is useful as an input for long-run exchange rate<\/td><\/tr><tr><td>forecasts, it is not useful for predicting short-run currency values.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Using Angle&#x27;s analysis, what is the nominal 1-year interest rate in Canada?<\/p><\/div>", "subj": "economics"}, {"n": 14, "q": "Are Hohlman's statements regarding the effect of monetary policies on the dollar correct?", "opts": ["Yes, they are correct.", "No, under the Mundell-Fleming model, expansionary monetary policy in the U.S. would weaken the dollar.", "No, the dollar value would be unchanged, but under the asset market model and not the Mundell-Fleming model."], "ans": "B", "expl": "Hohlman is incorrect regarding the implications of an expansionary monetary policy in the U.S. under the Mundell-Fleming model, which predicts a depreciation of the dollar. The asset market approach focuses on fiscal policy—not monetary policy. For Further Reference: (Study Session 4, Module 10.3, LOS 10.k)", "explhtml": "<p>Hohlman is incorrect regarding the implications of an expansionary monetary policy in the U.S. under the Mundell-Fleming model, which predicts a depreciation of the dollar. The asset market approach focuses on fiscal policy—not monetary policy.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 4, Module 10.3, LOS 10.k)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Debbie Angle and Craig Hohlman are analysts for a large commercial bank, Arbutus National Bank. Arbutus has extensive dealings in both the spot and forward foreign exchange markets. Angle and Hohlman are providing a refresher course on foreign exchange relationships for its traders.<\/p><p>Angle uses a three country example from North America to illustrate foreign exchange parity relations. In it, the Canadian dollar is expected to depreciate relative to the U.S. dollar and the Mexican peso. Nominal, 1-year interest rates are 7% in the United States and 13% in Mexico. From this data and using the uncovered interest rate parity relationship, Angle forecasts future spot rates.<\/p><p>During their presentation, Hohlman discusses the effect of monetary and fiscal policies on exchange rates. He cites a historical example from the United States, where the Federal Reserve shifted to an expansionary monetary policy to stimulate economic growth. This shift was largely unanticipated by the financial markets because the markets thought the Federal Reserve was more concerned with inflationary pressures. Hohlman states that the effect of this policy was an increase in economic growth and an increase in inflation. The cumulative effect on the dollar was unchanged, however, because, according to the Mundell-Fleming model, an expansionary monetary policy would strengthen the dollar whereas under relative purchasing power parity, an increase in inflation would weaken the dollar.<\/p><p>Regarding U.S. fiscal policies, Hohlman states that if these were unexpectedly expansionary, real interest rates would increase, which would produce an appreciation of the dollar. Hohlman adds that a sustained increase in the federal budget would attract foreign capital such that the long-run effect would be an increase in the value of the dollar.<\/p><p>Hohlman makes the following statements about parity conditions:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>If relative purchasing power parity holds, we can say that uncovered interest rate parity also<\/td><\/tr><tr><td>holds under certain conditions.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>For uncovered interest rate parity to hold, the forward rate must be an unbiased predictor of the<\/td><\/tr><tr><td>future spot rate.<\/td><td><\/td><\/tr><\/table><\/div><p>Angle next discusses the foreign exchange expectations. While examining Great Britain and Japan, she states that it appears the 1-year forward rate, which is currently ¥200/£, is an accurate predictor of the expected future spot rate. Furthermore, she states that uncovered interest rate parity and relative purchasing power parity hold. In the example for her presentation, she uses the following figures for the two countries.<\/p><p>Great Britain Japan<\/p><div class=\"tbl\"><table><tr><td>Expected GDP growth<\/td><td>2.50%<\/td><td>1.80%<\/td><\/tr><tr><td>Nominal 1-year interest rates<\/td><td>9.70%<\/td><td>6.40%<\/td><\/tr><tr><td>Growth in exports<\/td><td>3.90%<\/td><td>5.70%<\/td><\/tr><\/table><\/div><p>As a follow-up to Angle&#x27;s example, Hohlman discusses the use and evidence for purchasing power parity. He makes the following statements.<\/p><div class=\"tbl\"><table><tr><td>Statement 3: <\/td><td>Absolute purchasing power parity extends the law of one price and states that a basket of goods<\/td><\/tr><tr><td>should have the same price throughout the world. Absolute purchasing power parity is not widely<\/td><td><\/td><\/tr><tr><td>used in practice to forecast exchange rates.<\/td><td><\/td><\/tr><tr><td>Statement 4: <\/td><td>Although relative purchasing power parity is useful as an input for long-run exchange rate<\/td><\/tr><tr><td>forecasts, it is not useful for predicting short-run currency values.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Are Hohlman&#x27;s statements regarding the effect of monetary policies on the dollar correct?<\/p><\/div>", "subj": "economics"}, {"n": 15, "q": "What additional condition must be satisfied for Hohlman's Statement 1 to be valid?", "opts": ["Covered interest parity must hold.", "Fisher effect must hold.", "The international Fisher relation must hold."], "ans": "C", "expl": "If relative purchasing power parity holds, then inflation differentials drive future exchange rates. If the international Fisher relationship holds, then inflation differentials will be equal to interest rate differentials. Hence, when both relative purchasing power parity and the international Fisher relationship hold, uncovered interest rate parity should also hold. Covered interest rate parity always holds (by arbitrage) and is not a necessary additional condition. Real interest rate parity links the Fisher effect to the international Fisher relationship. For Further Reference: (Study Session 4, Module 10.2, LOS 10.f)", "explhtml": "<p>If relative purchasing power parity holds, then inflation differentials drive future exchange rates. If the international Fisher relationship holds, then inflation differentials will be equal to interest rate differentials. Hence, when both relative purchasing power parity and the international Fisher relationship hold, uncovered interest rate parity should also hold. Covered interest rate parity always holds (by arbitrage) and is not a necessary additional condition. Real interest rate parity links the Fisher effect to the international Fisher relationship.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 4, Module 10.2, LOS 10.f)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Debbie Angle and Craig Hohlman are analysts for a large commercial bank, Arbutus National Bank. Arbutus has extensive dealings in both the spot and forward foreign exchange markets. Angle and Hohlman are providing a refresher course on foreign exchange relationships for its traders.<\/p><p>Angle uses a three country example from North America to illustrate foreign exchange parity relations. In it, the Canadian dollar is expected to depreciate relative to the U.S. dollar and the Mexican peso. Nominal, 1-year interest rates are 7% in the United States and 13% in Mexico. From this data and using the uncovered interest rate parity relationship, Angle forecasts future spot rates.<\/p><p>During their presentation, Hohlman discusses the effect of monetary and fiscal policies on exchange rates. He cites a historical example from the United States, where the Federal Reserve shifted to an expansionary monetary policy to stimulate economic growth. This shift was largely unanticipated by the financial markets because the markets thought the Federal Reserve was more concerned with inflationary pressures. Hohlman states that the effect of this policy was an increase in economic growth and an increase in inflation. The cumulative effect on the dollar was unchanged, however, because, according to the Mundell-Fleming model, an expansionary monetary policy would strengthen the dollar whereas under relative purchasing power parity, an increase in inflation would weaken the dollar.<\/p><p>Regarding U.S. fiscal policies, Hohlman states that if these were unexpectedly expansionary, real interest rates would increase, which would produce an appreciation of the dollar. Hohlman adds that a sustained increase in the federal budget would attract foreign capital such that the long-run effect would be an increase in the value of the dollar.<\/p><p>Hohlman makes the following statements about parity conditions:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>If relative purchasing power parity holds, we can say that uncovered interest rate parity also<\/td><\/tr><tr><td>holds under certain conditions.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>For uncovered interest rate parity to hold, the forward rate must be an unbiased predictor of the<\/td><\/tr><tr><td>future spot rate.<\/td><td><\/td><\/tr><\/table><\/div><p>Angle next discusses the foreign exchange expectations. While examining Great Britain and Japan, she states that it appears the 1-year forward rate, which is currently ¥200/£, is an accurate predictor of the expected future spot rate. Furthermore, she states that uncovered interest rate parity and relative purchasing power parity hold. In the example for her presentation, she uses the following figures for the two countries.<\/p><p>Great Britain Japan<\/p><div class=\"tbl\"><table><tr><td>Expected GDP growth<\/td><td>2.50%<\/td><td>1.80%<\/td><\/tr><tr><td>Nominal 1-year interest rates<\/td><td>9.70%<\/td><td>6.40%<\/td><\/tr><tr><td>Growth in exports<\/td><td>3.90%<\/td><td>5.70%<\/td><\/tr><\/table><\/div><p>As a follow-up to Angle&#x27;s example, Hohlman discusses the use and evidence for purchasing power parity. He makes the following statements.<\/p><div class=\"tbl\"><table><tr><td>Statement 3: <\/td><td>Absolute purchasing power parity extends the law of one price and states that a basket of goods<\/td><\/tr><tr><td>should have the same price throughout the world. Absolute purchasing power parity is not widely<\/td><td><\/td><\/tr><tr><td>used in practice to forecast exchange rates.<\/td><td><\/td><\/tr><tr><td>Statement 4: <\/td><td>Although relative purchasing power parity is useful as an input for long-run exchange rate<\/td><\/tr><tr><td>forecasts, it is not useful for predicting short-run currency values.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>What additional condition must be satisfied for Hohlman&#x27;s Statement 1 to be valid?<\/p><\/div>", "subj": "economics"}, {"n": 16, "q": "Hohlman's Statement 2 is:", "opts": ["correct.", "incorrect as uncovered interest rate parity holds only if real interest rate parity holds.", "incorrect as uncovered interest rate parity holds only if covered interest rate parity holds."], "ans": "A", "expl": "When the expected future spot rate is equal to the forward rate (and covered interest parity holds—by arbitrage), uncovered interest rate parity should hold as well. The international Fisher relationship links relative purchasing power parity to uncovered interest rate parity. Real interest rate parity links the Fisher effect to the international Fisher relationship. For Further Reference: (Study Session 4, Module 10.2, LOS 10.f)", "explhtml": "<p>When the expected future spot rate is equal to the forward rate (and covered interest parity holds—by arbitrage), uncovered interest rate parity should hold as well. The international Fisher relationship links relative purchasing power parity to uncovered interest rate parity. Real interest rate parity links the Fisher effect to the international Fisher relationship.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 4, Module 10.2, LOS 10.f)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Debbie Angle and Craig Hohlman are analysts for a large commercial bank, Arbutus National Bank. Arbutus has extensive dealings in both the spot and forward foreign exchange markets. Angle and Hohlman are providing a refresher course on foreign exchange relationships for its traders.<\/p><p>Angle uses a three country example from North America to illustrate foreign exchange parity relations. In it, the Canadian dollar is expected to depreciate relative to the U.S. dollar and the Mexican peso. Nominal, 1-year interest rates are 7% in the United States and 13% in Mexico. From this data and using the uncovered interest rate parity relationship, Angle forecasts future spot rates.<\/p><p>During their presentation, Hohlman discusses the effect of monetary and fiscal policies on exchange rates. He cites a historical example from the United States, where the Federal Reserve shifted to an expansionary monetary policy to stimulate economic growth. This shift was largely unanticipated by the financial markets because the markets thought the Federal Reserve was more concerned with inflationary pressures. Hohlman states that the effect of this policy was an increase in economic growth and an increase in inflation. The cumulative effect on the dollar was unchanged, however, because, according to the Mundell-Fleming model, an expansionary monetary policy would strengthen the dollar whereas under relative purchasing power parity, an increase in inflation would weaken the dollar.<\/p><p>Regarding U.S. fiscal policies, Hohlman states that if these were unexpectedly expansionary, real interest rates would increase, which would produce an appreciation of the dollar. Hohlman adds that a sustained increase in the federal budget would attract foreign capital such that the long-run effect would be an increase in the value of the dollar.<\/p><p>Hohlman makes the following statements about parity conditions:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>If relative purchasing power parity holds, we can say that uncovered interest rate parity also<\/td><\/tr><tr><td>holds under certain conditions.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>For uncovered interest rate parity to hold, the forward rate must be an unbiased predictor of the<\/td><\/tr><tr><td>future spot rate.<\/td><td><\/td><\/tr><\/table><\/div><p>Angle next discusses the foreign exchange expectations. While examining Great Britain and Japan, she states that it appears the 1-year forward rate, which is currently ¥200/£, is an accurate predictor of the expected future spot rate. Furthermore, she states that uncovered interest rate parity and relative purchasing power parity hold. In the example for her presentation, she uses the following figures for the two countries.<\/p><p>Great Britain Japan<\/p><div class=\"tbl\"><table><tr><td>Expected GDP growth<\/td><td>2.50%<\/td><td>1.80%<\/td><\/tr><tr><td>Nominal 1-year interest rates<\/td><td>9.70%<\/td><td>6.40%<\/td><\/tr><tr><td>Growth in exports<\/td><td>3.90%<\/td><td>5.70%<\/td><\/tr><\/table><\/div><p>As a follow-up to Angle&#x27;s example, Hohlman discusses the use and evidence for purchasing power parity. He makes the following statements.<\/p><div class=\"tbl\"><table><tr><td>Statement 3: <\/td><td>Absolute purchasing power parity extends the law of one price and states that a basket of goods<\/td><\/tr><tr><td>should have the same price throughout the world. Absolute purchasing power parity is not widely<\/td><td><\/td><\/tr><tr><td>used in practice to forecast exchange rates.<\/td><td><\/td><\/tr><tr><td>Statement 4: <\/td><td>Although relative purchasing power parity is useful as an input for long-run exchange rate<\/td><\/tr><tr><td>forecasts, it is not useful for predicting short-run currency values.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Hohlman&#x27;s Statement 2 is:<\/p><\/div>", "subj": "economics"}, {"n": 17, "q": "Which of the following is closest to the current ¥/£ spot rate?", "opts": ["¥194/£.", "¥200/£.", "¥206/£."], "ans": "C", "expl": "Angle assumes the forward rate is an accurate predictor of the expected future spot rate, so we will use ¥200/£ as the future spot rate. Angle states that uncovered interest rate parity holds. Given a quote structure of ¥/£, S (1 + Yen interest rate) / (1 + GBP interest rate) = E(S ) 0 1 S (1.064 / 1.097) = 200 0 S = 206.20 0 Notice that the exchange rate will move from ¥206/£ to ¥200/£. So it takes fewer yen to buy one pound (i.e., the yen has strengthened), which uncovered interest rate parity predicts because the Japanese interest rate is lower. For Further Reference: (Study Session 4, Module 10.2, LOS 10.e, 10.f)", "explhtml": "<p>Angle assumes the forward rate is an accurate predictor of the expected future spot rate, so we will use ¥200/£ as the future spot rate.<\/p><p>Angle states that uncovered interest rate parity holds.<\/p><p>Given a quote structure of ¥/£,<\/p><p>S  (1 + Yen interest rate) / (1 + GBP interest rate) = E(S )<\/p><div class=\"tbl\"><table><tr><td>0<\/td><td>1<\/td><\/tr><tr><td>S (1.064 / 1.097) = 200<\/td><td><\/td><\/tr><tr><td>0<\/td><td><\/td><\/tr><tr><td>S  = 206.20<\/td><td><\/td><\/tr><tr><td>0<\/td><td><\/td><\/tr><\/table><\/div><p>Notice that the exchange rate will move from ¥206/£ to ¥200/£. So it takes fewer yen to buy one pound (i.e., the yen has strengthened), which uncovered interest rate parity predicts because the Japanese interest rate is lower.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 4, Module 10.2, LOS 10.e, 10.f)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Debbie Angle and Craig Hohlman are analysts for a large commercial bank, Arbutus National Bank. Arbutus has extensive dealings in both the spot and forward foreign exchange markets. Angle and Hohlman are providing a refresher course on foreign exchange relationships for its traders.<\/p><p>Angle uses a three country example from North America to illustrate foreign exchange parity relations. In it, the Canadian dollar is expected to depreciate relative to the U.S. dollar and the Mexican peso. Nominal, 1-year interest rates are 7% in the United States and 13% in Mexico. From this data and using the uncovered interest rate parity relationship, Angle forecasts future spot rates.<\/p><p>During their presentation, Hohlman discusses the effect of monetary and fiscal policies on exchange rates. He cites a historical example from the United States, where the Federal Reserve shifted to an expansionary monetary policy to stimulate economic growth. This shift was largely unanticipated by the financial markets because the markets thought the Federal Reserve was more concerned with inflationary pressures. Hohlman states that the effect of this policy was an increase in economic growth and an increase in inflation. The cumulative effect on the dollar was unchanged, however, because, according to the Mundell-Fleming model, an expansionary monetary policy would strengthen the dollar whereas under relative purchasing power parity, an increase in inflation would weaken the dollar.<\/p><p>Regarding U.S. fiscal policies, Hohlman states that if these were unexpectedly expansionary, real interest rates would increase, which would produce an appreciation of the dollar. Hohlman adds that a sustained increase in the federal budget would attract foreign capital such that the long-run effect would be an increase in the value of the dollar.<\/p><p>Hohlman makes the following statements about parity conditions:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>If relative purchasing power parity holds, we can say that uncovered interest rate parity also<\/td><\/tr><tr><td>holds under certain conditions.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>For uncovered interest rate parity to hold, the forward rate must be an unbiased predictor of the<\/td><\/tr><tr><td>future spot rate.<\/td><td><\/td><\/tr><\/table><\/div><p>Angle next discusses the foreign exchange expectations. While examining Great Britain and Japan, she states that it appears the 1-year forward rate, which is currently ¥200/£, is an accurate predictor of the expected future spot rate. Furthermore, she states that uncovered interest rate parity and relative purchasing power parity hold. In the example for her presentation, she uses the following figures for the two countries.<\/p><p>Great Britain Japan<\/p><div class=\"tbl\"><table><tr><td>Expected GDP growth<\/td><td>2.50%<\/td><td>1.80%<\/td><\/tr><tr><td>Nominal 1-year interest rates<\/td><td>9.70%<\/td><td>6.40%<\/td><\/tr><tr><td>Growth in exports<\/td><td>3.90%<\/td><td>5.70%<\/td><\/tr><\/table><\/div><p>As a follow-up to Angle&#x27;s example, Hohlman discusses the use and evidence for purchasing power parity. He makes the following statements.<\/p><div class=\"tbl\"><table><tr><td>Statement 3: <\/td><td>Absolute purchasing power parity extends the law of one price and states that a basket of goods<\/td><\/tr><tr><td>should have the same price throughout the world. Absolute purchasing power parity is not widely<\/td><td><\/td><\/tr><tr><td>used in practice to forecast exchange rates.<\/td><td><\/td><\/tr><tr><td>Statement 4: <\/td><td>Although relative purchasing power parity is useful as an input for long-run exchange rate<\/td><\/tr><tr><td>forecasts, it is not useful for predicting short-run currency values.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following is closest to the current ¥/£ spot rate?<\/p><\/div>", "subj": "economics"}, {"n": 18, "q": "Regarding the statements made by Hohlman on purchasing power parity, are both statements correct?", "opts": ["Yes.", "No, only Statement 4 is correct.", "No, both statements are incorrect."], "ans": "A", "expl": "Statement 3: Hohlman is correct regarding absolute purchasing power parity. It is based on the law of one price, which states that the price of goods should not differ internationally. Absolute purchasing power parity is not used to predict exchange rates. Statement 4: Hohlman is correct regarding relative purchasing power parity. It does not hold in the short-run and therefore is not useful for predicting short-run currency values. It does tend to hold in the long run, however, and is therefore useful for long-run exchange rate forecasts. For Further Reference: (Study Session 4, Module 10.2, LOS 10.e)", "explhtml": "<p>Statement 3: Hohlman is correct regarding absolute purchasing power parity. It is based on the law of one price, which states that the price of goods should not differ internationally. Absolute purchasing power parity is not used to predict exchange rates.<\/p><p>Statement 4: Hohlman is correct regarding relative purchasing power parity. It does not hold in the short-run and therefore is not useful for predicting short-run currency values. It does tend to hold in the long run, however, and is therefore useful for long-run exchange rate forecasts.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 4, Module 10.2, LOS 10.e)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Debbie Angle and Craig Hohlman are analysts for a large commercial bank, Arbutus National Bank. Arbutus has extensive dealings in both the spot and forward foreign exchange markets. Angle and Hohlman are providing a refresher course on foreign exchange relationships for its traders.<\/p><p>Angle uses a three country example from North America to illustrate foreign exchange parity relations. In it, the Canadian dollar is expected to depreciate relative to the U.S. dollar and the Mexican peso. Nominal, 1-year interest rates are 7% in the United States and 13% in Mexico. From this data and using the uncovered interest rate parity relationship, Angle forecasts future spot rates.<\/p><p>During their presentation, Hohlman discusses the effect of monetary and fiscal policies on exchange rates. He cites a historical example from the United States, where the Federal Reserve shifted to an expansionary monetary policy to stimulate economic growth. This shift was largely unanticipated by the financial markets because the markets thought the Federal Reserve was more concerned with inflationary pressures. Hohlman states that the effect of this policy was an increase in economic growth and an increase in inflation. The cumulative effect on the dollar was unchanged, however, because, according to the Mundell-Fleming model, an expansionary monetary policy would strengthen the dollar whereas under relative purchasing power parity, an increase in inflation would weaken the dollar.<\/p><p>Regarding U.S. fiscal policies, Hohlman states that if these were unexpectedly expansionary, real interest rates would increase, which would produce an appreciation of the dollar. Hohlman adds that a sustained increase in the federal budget would attract foreign capital such that the long-run effect would be an increase in the value of the dollar.<\/p><p>Hohlman makes the following statements about parity conditions:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>If relative purchasing power parity holds, we can say that uncovered interest rate parity also<\/td><\/tr><tr><td>holds under certain conditions.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>For uncovered interest rate parity to hold, the forward rate must be an unbiased predictor of the<\/td><\/tr><tr><td>future spot rate.<\/td><td><\/td><\/tr><\/table><\/div><p>Angle next discusses the foreign exchange expectations. While examining Great Britain and Japan, she states that it appears the 1-year forward rate, which is currently ¥200/£, is an accurate predictor of the expected future spot rate. Furthermore, she states that uncovered interest rate parity and relative purchasing power parity hold. In the example for her presentation, she uses the following figures for the two countries.<\/p><p>Great Britain Japan<\/p><div class=\"tbl\"><table><tr><td>Expected GDP growth<\/td><td>2.50%<\/td><td>1.80%<\/td><\/tr><tr><td>Nominal 1-year interest rates<\/td><td>9.70%<\/td><td>6.40%<\/td><\/tr><tr><td>Growth in exports<\/td><td>3.90%<\/td><td>5.70%<\/td><\/tr><\/table><\/div><p>As a follow-up to Angle&#x27;s example, Hohlman discusses the use and evidence for purchasing power parity. He makes the following statements.<\/p><div class=\"tbl\"><table><tr><td>Statement 3: <\/td><td>Absolute purchasing power parity extends the law of one price and states that a basket of goods<\/td><\/tr><tr><td>should have the same price throughout the world. Absolute purchasing power parity is not widely<\/td><td><\/td><\/tr><tr><td>used in practice to forecast exchange rates.<\/td><td><\/td><\/tr><tr><td>Statement 4: <\/td><td>Although relative purchasing pow
