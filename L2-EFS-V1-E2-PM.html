<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>
<body>
<header>

<script>
const DATA = [{"n": 1, "q": "According to CFA Institute Standards of Professional Conduct, which of the following statements is most accurate with regard to the investment report on BlueNote, Inc.? The report:", "opts": ["complies with the Standards.", "should not have included a price target as it makes an implicit guarantee of investment performance.", "does not comply with the Standards due to improper risk analysis."], "ans": "C", "expl": "Under Standard V(A), specification of a price target is acceptable as long as the risk is appropriately disclosed. A research report can specify VaR as an appropriate risk metric, but the report should clarify that the quality of the VaR estimate depends on the quality of model inputs. For Further Reference: (Study Session 1, Module 2.8, LOS 2.a)", "explhtml": "<p>Under Standard V(A), specification of a price target is acceptable as long as the risk is appropriately disclosed. A research report can specify VaR as an appropriate risk metric, but the report should clarify that the quality of the VaR estimate depends on the quality of model inputs.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.8, LOS 2.a)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<\/summary><div class=\"vig-body\"><p>Pat Wilson, CFA, is the chief compliance officer for Excess Investments, a global asset management and investment banking services company. Wilson is reviewing two investment reports written by Peter Holly, CFA, an analyst and portfolio manager who has worked for Excess for four years. Holly&#x27;s first report under compliance review is a strong buy recommendation for BlueNote, Inc., a musical instrument manufacturer. The report states that the buy recommendation is applicable for the next 6 to 12 months with an average level of risk and a sustainable price target of $24 for the entire time period. Further, the report states that the risk analysis is based on 95% VaR (calculated using the parametric method) and that price declines over the investment horizon should thus be limited to 5% of the current price.<\/p><p>Holly informs Wilson that he determined his conclusions primarily from an intensive review of BlueNote&#x27;s filings with the SEC but also from a call to one of BlueNote&#x27;s suppliers who informed Holly that their new inventory processing system would allow for more efficiency in supplying BlueNote with raw materials. Holly explains to Wilson that he is the only analyst covering BlueNote who is aware of this information and that he believes the new inventory processing system will allow BlueNote to reduce costs and increase overall profitability for several years to come.<\/p><p>Wilson must also review Holly&#x27;s report on BigTime, Inc., a musical promotion and distribution company. In the report, Holly provides a very optimistic analysis of BigTime&#x27;s fundamentals. The analysis supports a buy recommendation for the company. Wilson finds one problem with Holly&#x27;s report on BigTime related to Holly&#x27;s former business relationship with BigTime, Inc. Two years before joining Excess, Holly worked as an investment banker and received 1,000 restricted shares of BigTime as a result of his participation in taking the company public. These facts are not disclosed in the report but are disclosed on Excess Investment&#x27;s website.<\/p><p>Just before the report is issued, Holly mentions to Wilson that BigTime unknowingly disclosed to him and a few other analysts who were waiting for a conference call to begin that the company is planning to restructure both its sales staff and sales strategy and may sell one of its poorly performing business units next year.<\/p><p>Three days after issuing his report on BigTime, which caused a substantial rise in the price of BigTime shares, Holly sells all of the BigTime shares out of both his performance fee-based accounts and flat-fee accounts and then proceeds to sell all of the BigTime shares out of his own account on the following day. Holly obtained approval from Wilson before making the trades.<\/p><p>Just after selling his shares in BigTime, Holly receives a call from the CEO of BlueNote who wants to see if Holly received the desk pen engraved with the BlueNote company logo that he sent last week and also to offer two front row tickets plus limousine service to a sold-out concert for a popular band that uses BlueNote&#x27;s instruments. Holly confirms that the desk pen arrived and thanks the CEO for the gift and tells him that before he accepts the concert tickets, he will have to check his calendar to see if he will be able to attend. Holly declines the use of the limousine service should he decide to attend the concert.<\/p><p>After speaking with the CEO of BlueNote, Holly constructs a letter that he plans to send by email to all of his clients and prospects with email addresses and by regular mail to all of his clients and prospects without email addresses. The letter details changes to an equity valuation model that Holly and several other analysts at Excess use to analyze potential investment recommendations. Holly&#x27;s letter explains that the new model, which will be put into use next month, will utilize Monte Carlo simulations to create a distribution of stock values, a sharp contrast to the existing model which uses static valuations combined with sensitivity analysis. Relevant details of the new model are included in the letter, but similar details about the existing model are not included. The letter also explains that management at Excess has decided to exclude alcohol and tobacco company securities from the research coverage universe. Holly&#x27;s letter concludes by stating that no other significant changes that would affect the investment recommendation process have occurred or are expected to occur in the near future.<\/p><\/div><\/details><div class=\"qtext\"><p>According to CFA Institute Standards of Professional Conduct, which of the following statements is most accurate with regard to the investment report on BlueNote, Inc.? The report:<\/p><\/div>", "subj": "ethics"}, {"n": 2, "q": "Did Holly violate any CFA Institute Standards of Professional Conduct with respect to his report on BlueNote or BigTime, as it relates to potential use of material nonpublic information?", "opts": ["Holly has violated Standard on material nonpublic information in the case of both reports.", "There is a violation regarding the BlueNote report, but no violation with the BigTime report.", "There is a violation regarding the BigTime report, but no violation with the BlueNote report."], "ans": "C", "expl": "Standard II(A). Holly has utilized public information to conduct an intensive analysis of BlueNote and has also utilized information obtained from a supplier that, while nonpublic, is not by itself material. When combined with his knowledge of BlueNote's material public information, however, the information from the supplier allows Holly to make a significant and material conclusion that would not be known to the public in general. This situation falls under the Mosaic Theory. Holly is free to make recommendations based on her material nonpublic conclusion on BlueNote since the conclusion was formed using material public information combined with nonmaterial nonpublic information. Thus, the BlueNote report did not violate Standard II(A) Integrity of Capital Markets – Material Nonpublic Information, and since there appears to be a reasonable and adequate basis, does not appear to violate any other Standards either. Holly's report on BigTime, however, is based in part on a conversation that he overheard between executives at BigTime. The information he overheard related to the sale of one of BigTime's business units was both material and nonpublic. The fact that several other analysts overheard the conversation as well does not make the information public. Because Holly is in possession of material nonpublic information, he is prohibited by Standard II(A) from acting or causing others to act on the information. Therefore, his report on BigTime violates the Standard. For Further Reference: (Study Session 1, Module 2.3, LOS 2.a, 2.b)", "explhtml": "<p>Standard II(A). Holly has utilized public information to conduct an intensive analysis of BlueNote and has also utilized information obtained from a supplier that, while nonpublic, is not by itself material. When combined with his knowledge of BlueNote&#x27;s material public information, however, the information from the supplier allows Holly to make a significant and material conclusion that would not be known to the public in general. This situation falls under the Mosaic Theory. Holly is free to make recommendations based on her material nonpublic conclusion on BlueNote since the conclusion was formed using material public information combined with nonmaterial nonpublic information. Thus, the BlueNote report did not violate Standard II(A) Integrity of Capital Markets – Material Nonpublic Information, and since there appears to be a reasonable and adequate basis, does not appear to violate any other Standards either. Holly&#x27;s report on BigTime, however, is based in part on a conversation that he overheard between executives at BigTime. The information he overheard related to the sale of one of BigTime&#x27;s business units was both material and nonpublic. The fact that several other analysts overheard the conversation as well does not make the information public. Because Holly is in possession of material nonpublic information, he is prohibited by Standard II(A) from acting or causing others to act on the information. Therefore, his report on BigTime violates the Standard.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.3, LOS 2.a, 2.b)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pat Wilson, CFA, is the chief compliance officer for Excess Investments, a global asset management and investment banking services company. Wilson is reviewing two investment reports written by Peter Holly, CFA, an analyst and portfolio manager who has worked for Excess for four years. Holly&#x27;s first report under compliance review is a strong buy recommendation for BlueNote, Inc., a musical instrument manufacturer. The report states that the buy recommendation is applicable for the next 6 to 12 months with an average level of risk and a sustainable price target of $24 for the entire time period. Further, the report states that the risk analysis is based on 95% VaR (calculated using the parametric method) and that price declines over the investment horizon should thus be limited to 5% of the current price.<\/p><p>Holly informs Wilson that he determined his conclusions primarily from an intensive review of BlueNote&#x27;s filings with the SEC but also from a call to one of BlueNote&#x27;s suppliers who informed Holly that their new inventory processing system would allow for more efficiency in supplying BlueNote with raw materials. Holly explains to Wilson that he is the only analyst covering BlueNote who is aware of this information and that he believes the new inventory processing system will allow BlueNote to reduce costs and increase overall profitability for several years to come.<\/p><p>Wilson must also review Holly&#x27;s report on BigTime, Inc., a musical promotion and distribution company. In the report, Holly provides a very optimistic analysis of BigTime&#x27;s fundamentals. The analysis supports a buy recommendation for the company. Wilson finds one problem with Holly&#x27;s report on BigTime related to Holly&#x27;s former business relationship with BigTime, Inc. Two years before joining Excess, Holly worked as an investment banker and received 1,000 restricted shares of BigTime as a result of his participation in taking the company public. These facts are not disclosed in the report but are disclosed on Excess Investment&#x27;s website.<\/p><p>Just before the report is issued, Holly mentions to Wilson that BigTime unknowingly disclosed to him and a few other analysts who were waiting for a conference call to begin that the company is planning to restructure both its sales staff and sales strategy and may sell one of its poorly performing business units next year.<\/p><p>Three days after issuing his report on BigTime, which caused a substantial rise in the price of BigTime shares, Holly sells all of the BigTime shares out of both his performance fee-based accounts and flat-fee accounts and then proceeds to sell all of the BigTime shares out of his own account on the following day. Holly obtained approval from Wilson before making the trades.<\/p><p>Just after selling his shares in BigTime, Holly receives a call from the CEO of BlueNote who wants to see if Holly received the desk pen engraved with the BlueNote company logo that he sent last week and also to offer two front row tickets plus limousine service to a sold-out concert for a popular band that uses BlueNote&#x27;s instruments. Holly confirms that the desk pen arrived and thanks the CEO for the gift and tells him that before he accepts the concert tickets, he will have to check his calendar to see if he will be able to attend. Holly declines the use of the limousine service should he decide to attend the concert.<\/p><p>After speaking with the CEO of BlueNote, Holly constructs a letter that he plans to send by email to all of his clients and prospects with email addresses and by regular mail to all of his clients and prospects without email addresses. The letter details changes to an equity valuation model that Holly and several other analysts at Excess use to analyze potential investment recommendations. Holly&#x27;s letter explains that the new model, which will be put into use next month, will utilize Monte Carlo simulations to create a distribution of stock values, a sharp contrast to the existing model which uses static valuations combined with sensitivity analysis. Relevant details of the new model are included in the letter, but similar details about the existing model are not included. The letter also explains that management at Excess has decided to exclude alcohol and tobacco company securities from the research coverage universe. Holly&#x27;s letter concludes by stating that no other significant changes that would affect the investment recommendation process have occurred or are expected to occur in the near future.<\/p><\/div><\/details><div class=\"qtext\"><p>Did Holly violate any CFA Institute Standards of Professional Conduct with respect to his report on BlueNote or BigTime, as it relates to potential use of material nonpublic information?<\/p><\/div>", "subj": "ethics"}, {"n": 3, "q": "According to CFA Institute Standards of Professional Conduct, which of the following statements is most accurate with regard to Holly's disclosure of his ownership of BigTime restricted shares and past investment banking relationship with BigTime? The disclosure:", "opts": ["is neither required nor recommended by the Standards since the shares are restricted.", "complies with the Standards' recommended procedures for disclosing conflicts of interest.", "does not comply with Standard VI(A) Disclosure of Conflicts because the disclosure is not reflected in the research report."], "ans": "C", "expl": "Standard VI(A) requires disclosures of conflicts of interest such as beneficial ownership of securities of a covered firm. Holly owns shares of BigTime that may potentially benefit from his recommendation. His best course of action would be to disclose the conflict in the report. For Further Reference: (Study Session 1, Module 2.9, LOS 2.a, 2.b)", "explhtml": "<p>Standard VI(A) requires disclosures of conflicts of interest such as beneficial ownership of securities of a covered firm. Holly owns shares of BigTime that may potentially benefit from his recommendation. His best course of action would be to disclose the conflict in the report.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.9, LOS 2.a, 2.b)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pat Wilson, CFA, is the chief compliance officer for Excess Investments, a global asset management and investment banking services company. Wilson is reviewing two investment reports written by Peter Holly, CFA, an analyst and portfolio manager who has worked for Excess for four years. Holly&#x27;s first report under compliance review is a strong buy recommendation for BlueNote, Inc., a musical instrument manufacturer. The report states that the buy recommendation is applicable for the next 6 to 12 months with an average level of risk and a sustainable price target of $24 for the entire time period. Further, the report states that the risk analysis is based on 95% VaR (calculated using the parametric method) and that price declines over the investment horizon should thus be limited to 5% of the current price.<\/p><p>Holly informs Wilson that he determined his conclusions primarily from an intensive review of BlueNote&#x27;s filings with the SEC but also from a call to one of BlueNote&#x27;s suppliers who informed Holly that their new inventory processing system would allow for more efficiency in supplying BlueNote with raw materials. Holly explains to Wilson that he is the only analyst covering BlueNote who is aware of this information and that he believes the new inventory processing system will allow BlueNote to reduce costs and increase overall profitability for several years to come.<\/p><p>Wilson must also review Holly&#x27;s report on BigTime, Inc., a musical promotion and distribution company. In the report, Holly provides a very optimistic analysis of BigTime&#x27;s fundamentals. The analysis supports a buy recommendation for the company. Wilson finds one problem with Holly&#x27;s report on BigTime related to Holly&#x27;s former business relationship with BigTime, Inc. Two years before joining Excess, Holly worked as an investment banker and received 1,000 restricted shares of BigTime as a result of his participation in taking the company public. These facts are not disclosed in the report but are disclosed on Excess Investment&#x27;s website.<\/p><p>Just before the report is issued, Holly mentions to Wilson that BigTime unknowingly disclosed to him and a few other analysts who were waiting for a conference call to begin that the company is planning to restructure both its sales staff and sales strategy and may sell one of its poorly performing business units next year.<\/p><p>Three days after issuing his report on BigTime, which caused a substantial rise in the price of BigTime shares, Holly sells all of the BigTime shares out of both his performance fee-based accounts and flat-fee accounts and then proceeds to sell all of the BigTime shares out of his own account on the following day. Holly obtained approval from Wilson before making the trades.<\/p><p>Just after selling his shares in BigTime, Holly receives a call from the CEO of BlueNote who wants to see if Holly received the desk pen engraved with the BlueNote company logo that he sent last week and also to offer two front row tickets plus limousine service to a sold-out concert for a popular band that uses BlueNote&#x27;s instruments. Holly confirms that the desk pen arrived and thanks the CEO for the gift and tells him that before he accepts the concert tickets, he will have to check his calendar to see if he will be able to attend. Holly declines the use of the limousine service should he decide to attend the concert.<\/p><p>After speaking with the CEO of BlueNote, Holly constructs a letter that he plans to send by email to all of his clients and prospects with email addresses and by regular mail to all of his clients and prospects without email addresses. The letter details changes to an equity valuation model that Holly and several other analysts at Excess use to analyze potential investment recommendations. Holly&#x27;s letter explains that the new model, which will be put into use next month, will utilize Monte Carlo simulations to create a distribution of stock values, a sharp contrast to the existing model which uses static valuations combined with sensitivity analysis. Relevant details of the new model are included in the letter, but similar details about the existing model are not included. The letter also explains that management at Excess has decided to exclude alcohol and tobacco company securities from the research coverage universe. Holly&#x27;s letter concludes by stating that no other significant changes that would affect the investment recommendation process have occurred or are expected to occur in the near future.<\/p><\/div><\/details><div class=\"qtext\"><p>According to CFA Institute Standards of Professional Conduct, which of the following statements is most accurate with regard to Holly&#x27;s disclosure of his ownership of BigTime restricted shares and past investment banking relationship with BigTime? The disclosure:<\/p><\/div>", "subj": "ethics"}, {"n": 4, "q": "According to CFA Institute Standards of Professional Conduct, which of the following statements is most likely correct with regard to Holly's report and subsequent sale of his and his clients' shares of BigTime common stock? Holly has:", "opts": ["violated the Standard by attempting to manipulate the market price of BigTime stock.", "not violated the Standard since he first obtained approval to make the trades from his compliance officer.", "not violated the Standard since he acted in the best interest of his clients by realizing gains on BigTime stock."], "ans": "A", "expl": "Standard II(B) – Market Manipulation. Holly has issued a buy recommendation on BigTime stock. The analysis is based on a very optimistic analysis of the company's fundamentals. Yet, three days after issuing the report, Holly decides to sell all of his clients' holdings as well as his own holdings of BigTime stock after observing a rise in the price of the stock. Holly's report, which caused an increase in the price of BigTime stock, was intended to deceive market participants into believing the company was a good investment when, as indicated by his subsequent sale of the shares, Holly believed otherwise. The combination of actions indicates that Holly is likely attempting to manipulate the price of the stock for his clients', and his own, benefit. Thus, he has likely violated Standard II(B) – Integrity of Capital Markets – Market Manipulation. For Further Reference: (Study Session 1, Module 2.3, LOS 2.a, 2.b)", "explhtml": "<p>Standard II(B) – Market Manipulation. Holly has issued a buy recommendation on BigTime stock. The analysis is based on a very optimistic analysis of the company&#x27;s fundamentals. Yet, three days after issuing the report, Holly decides to sell all of his clients&#x27; holdings as well as his own holdings of BigTime stock after observing a rise in the price of the stock. Holly&#x27;s report, which caused an increase in the price of BigTime stock, was intended to deceive market participants into believing the company was a good investment when, as indicated by his subsequent sale of the shares, Holly believed otherwise. The combination of actions indicates that Holly is likely attempting to manipulate the price of the stock for his clients&#x27;, and his own, benefit. Thus, he has likely violated Standard II(B) – Integrity of Capital Markets – Market Manipulation.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.3, LOS 2.a, 2.b)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pat Wilson, CFA, is the chief compliance officer for Excess Investments, a global asset management and investment banking services company. Wilson is reviewing two investment reports written by Peter Holly, CFA, an analyst and portfolio manager who has worked for Excess for four years. Holly&#x27;s first report under compliance review is a strong buy recommendation for BlueNote, Inc., a musical instrument manufacturer. The report states that the buy recommendation is applicable for the next 6 to 12 months with an average level of risk and a sustainable price target of $24 for the entire time period. Further, the report states that the risk analysis is based on 95% VaR (calculated using the parametric method) and that price declines over the investment horizon should thus be limited to 5% of the current price.<\/p><p>Holly informs Wilson that he determined his conclusions primarily from an intensive review of BlueNote&#x27;s filings with the SEC but also from a call to one of BlueNote&#x27;s suppliers who informed Holly that their new inventory processing system would allow for more efficiency in supplying BlueNote with raw materials. Holly explains to Wilson that he is the only analyst covering BlueNote who is aware of this information and that he believes the new inventory processing system will allow BlueNote to reduce costs and increase overall profitability for several years to come.<\/p><p>Wilson must also review Holly&#x27;s report on BigTime, Inc., a musical promotion and distribution company. In the report, Holly provides a very optimistic analysis of BigTime&#x27;s fundamentals. The analysis supports a buy recommendation for the company. Wilson finds one problem with Holly&#x27;s report on BigTime related to Holly&#x27;s former business relationship with BigTime, Inc. Two years before joining Excess, Holly worked as an investment banker and received 1,000 restricted shares of BigTime as a result of his participation in taking the company public. These facts are not disclosed in the report but are disclosed on Excess Investment&#x27;s website.<\/p><p>Just before the report is issued, Holly mentions to Wilson that BigTime unknowingly disclosed to him and a few other analysts who were waiting for a conference call to begin that the company is planning to restructure both its sales staff and sales strategy and may sell one of its poorly performing business units next year.<\/p><p>Three days after issuing his report on BigTime, which caused a substantial rise in the price of BigTime shares, Holly sells all of the BigTime shares out of both his performance fee-based accounts and flat-fee accounts and then proceeds to sell all of the BigTime shares out of his own account on the following day. Holly obtained approval from Wilson before making the trades.<\/p><p>Just after selling his shares in BigTime, Holly receives a call from the CEO of BlueNote who wants to see if Holly received the desk pen engraved with the BlueNote company logo that he sent last week and also to offer two front row tickets plus limousine service to a sold-out concert for a popular band that uses BlueNote&#x27;s instruments. Holly confirms that the desk pen arrived and thanks the CEO for the gift and tells him that before he accepts the concert tickets, he will have to check his calendar to see if he will be able to attend. Holly declines the use of the limousine service should he decide to attend the concert.<\/p><p>After speaking with the CEO of BlueNote, Holly constructs a letter that he plans to send by email to all of his clients and prospects with email addresses and by regular mail to all of his clients and prospects without email addresses. The letter details changes to an equity valuation model that Holly and several other analysts at Excess use to analyze potential investment recommendations. Holly&#x27;s letter explains that the new model, which will be put into use next month, will utilize Monte Carlo simulations to create a distribution of stock values, a sharp contrast to the existing model which uses static valuations combined with sensitivity analysis. Relevant details of the new model are included in the letter, but similar details about the existing model are not included. The letter also explains that management at Excess has decided to exclude alcohol and tobacco company securities from the research coverage universe. Holly&#x27;s letter concludes by stating that no other significant changes that would affect the investment recommendation process have occurred or are expected to occur in the near future.<\/p><\/div><\/details><div class=\"qtext\"><p>According to CFA Institute Standards of Professional Conduct, which of the following statements is most likely correct with regard to Holly&#x27;s report and subsequent sale of his and his clients&#x27; shares of BigTime common stock? Holly has:<\/p><\/div>", "subj": "ethics"}, {"n": 5, "q": "According to CFA Institute Standards of Professional Conduct, which of the following best describes the actions Holly should take with regard to the desk pen and the concert tickets offered to him by the CEO of BlueNote? Holly:", "opts": ["must not accept the desk pen or the concert tickets.", "may accept both the desk pen and the concert tickets.", "may accept the desk pen but should not accept the concert tickets."], "ans": "C", "expl": "Standard I(B) – Professionalism: Independence and Objectivity. Members and candidates are prohibited from accepting any gift that could reasonably be expected to interfere with their independence and objectivity. The desk pen is a token item with little material value and can be accepted without violating the Standard. However, the concert tickets are likely to have a very substantial amount of material value since the concert is sold out and involves a popular musical act. Best practice dictates that Holly should not accept the concert tickets since they could reasonably be expected to compromise Holly's independence and objectivity. For Further Reference: (Study Session 1, Module 2.1, LOS 2.a, 2.b)", "explhtml": "<p>Standard I(B) – Professionalism: Independence and Objectivity. Members and candidates are prohibited from accepting any gift that could reasonably be expected to interfere with their independence and objectivity. The desk pen is a token item with little material value and can be accepted without violating the Standard. However, the concert tickets are likely to have a very substantial amount of material value since the concert is sold out and involves a popular musical act. Best practice dictates that Holly should not accept the concert tickets since they could reasonably be expected to compromise Holly&#x27;s independence and objectivity.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.1, LOS 2.a, 2.b)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pat Wilson, CFA, is the chief compliance officer for Excess Investments, a global asset management and investment banking services company. Wilson is reviewing two investment reports written by Peter Holly, CFA, an analyst and portfolio manager who has worked for Excess for four years. Holly&#x27;s first report under compliance review is a strong buy recommendation for BlueNote, Inc., a musical instrument manufacturer. The report states that the buy recommendation is applicable for the next 6 to 12 months with an average level of risk and a sustainable price target of $24 for the entire time period. Further, the report states that the risk analysis is based on 95% VaR (calculated using the parametric method) and that price declines over the investment horizon should thus be limited to 5% of the current price.<\/p><p>Holly informs Wilson that he determined his conclusions primarily from an intensive review of BlueNote&#x27;s filings with the SEC but also from a call to one of BlueNote&#x27;s suppliers who informed Holly that their new inventory processing system would allow for more efficiency in supplying BlueNote with raw materials. Holly explains to Wilson that he is the only analyst covering BlueNote who is aware of this information and that he believes the new inventory processing system will allow BlueNote to reduce costs and increase overall profitability for several years to come.<\/p><p>Wilson must also review Holly&#x27;s report on BigTime, Inc., a musical promotion and distribution company. In the report, Holly provides a very optimistic analysis of BigTime&#x27;s fundamentals. The analysis supports a buy recommendation for the company. Wilson finds one problem with Holly&#x27;s report on BigTime related to Holly&#x27;s former business relationship with BigTime, Inc. Two years before joining Excess, Holly worked as an investment banker and received 1,000 restricted shares of BigTime as a result of his participation in taking the company public. These facts are not disclosed in the report but are disclosed on Excess Investment&#x27;s website.<\/p><p>Just before the report is issued, Holly mentions to Wilson that BigTime unknowingly disclosed to him and a few other analysts who were waiting for a conference call to begin that the company is planning to restructure both its sales staff and sales strategy and may sell one of its poorly performing business units next year.<\/p><p>Three days after issuing his report on BigTime, which caused a substantial rise in the price of BigTime shares, Holly sells all of the BigTime shares out of both his performance fee-based accounts and flat-fee accounts and then proceeds to sell all of the BigTime shares out of his own account on the following day. Holly obtained approval from Wilson before making the trades.<\/p><p>Just after selling his shares in BigTime, Holly receives a call from the CEO of BlueNote who wants to see if Holly received the desk pen engraved with the BlueNote company logo that he sent last week and also to offer two front row tickets plus limousine service to a sold-out concert for a popular band that uses BlueNote&#x27;s instruments. Holly confirms that the desk pen arrived and thanks the CEO for the gift and tells him that before he accepts the concert tickets, he will have to check his calendar to see if he will be able to attend. Holly declines the use of the limousine service should he decide to attend the concert.<\/p><p>After speaking with the CEO of BlueNote, Holly constructs a letter that he plans to send by email to all of his clients and prospects with email addresses and by regular mail to all of his clients and prospects without email addresses. The letter details changes to an equity valuation model that Holly and several other analysts at Excess use to analyze potential investment recommendations. Holly&#x27;s letter explains that the new model, which will be put into use next month, will utilize Monte Carlo simulations to create a distribution of stock values, a sharp contrast to the existing model which uses static valuations combined with sensitivity analysis. Relevant details of the new model are included in the letter, but similar details about the existing model are not included. The letter also explains that management at Excess has decided to exclude alcohol and tobacco company securities from the research coverage universe. Holly&#x27;s letter concludes by stating that no other significant changes that would affect the investment recommendation process have occurred or are expected to occur in the near future.<\/p><\/div><\/details><div class=\"qtext\"><p>According to CFA Institute Standards of Professional Conduct, which of the following best describes the actions Holly should take with regard to the desk pen and the concert tickets offered to him by the CEO of BlueNote? Holly:<\/p><\/div>", "subj": "ethics"}, {"n": 6, "q": "In his letter to clients explaining the change in the valuation model, did Holly violate any CFA Institute Standards of Professional Conduct?", "opts": ["No.", "Yes, because he did not treat all clients fairly in his dissemination of the letter.", "Yes, because he failed to include details of the current valuation model to contrast with the new model."], "ans": "A", "expl": "Standard V(B) – Communication With Clients and Prospective Clients. Standard V(B) requires members and candidates to promptly disclose any changes that materially affect investment processes. Holly has provided a detailed description of the new valuation model that will be used to generate investment recommendations and has disclosed the new limitations on the investment universe (i.e., no alcohol or tobacco stocks). Therefore, it does not appear that he has violated Standard V(B). Holly also has not violated any other standards. It is acceptable for him to email those clients with email addresses and send his letter by regular mail to those who do not. Standard III(B) – Fair Dealing does not require that all clients receive investment recommendations or other communications at exactly the same time, only that the system treats clients fairly. For Further Reference: (Study Session 1, Module 2.8, LOS 2.a, 2.b)", "explhtml": "<p>Standard V(B) – Communication With Clients and Prospective Clients. Standard V(B) requires members and candidates to promptly disclose any changes that materially affect investment processes. Holly has provided a detailed description of the new valuation model that will be used to generate investment recommendations and has disclosed the new limitations on the investment universe (i.e., no alcohol or tobacco stocks). Therefore, it does not appear that he has violated Standard V(B). Holly also has not violated any other standards. It is acceptable for him to email those clients with email addresses and send his letter by regular mail to those who do not. Standard III(B) – Fair Dealing does not require that all clients receive investment recommendations or other communications at exactly the same time, only that the system treats clients fairly.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.8, LOS 2.a, 2.b)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pat Wilson, CFA, is the chief compliance officer for Excess Investments, a global asset management and investment banking services company. Wilson is reviewing two investment reports written by Peter Holly, CFA, an analyst and portfolio manager who has worked for Excess for four years. Holly&#x27;s first report under compliance review is a strong buy recommendation for BlueNote, Inc., a musical instrument manufacturer. The report states that the buy recommendation is applicable for the next 6 to 12 months with an average level of risk and a sustainable price target of $24 for the entire time period. Further, the report states that the risk analysis is based on 95% VaR (calculated using the parametric method) and that price declines over the investment horizon should thus be limited to 5% of the current price.<\/p><p>Holly informs Wilson that he determined his conclusions primarily from an intensive review of BlueNote&#x27;s filings with the SEC but also from a call to one of BlueNote&#x27;s suppliers who informed Holly that their new inventory processing system would allow for more efficiency in supplying BlueNote with raw materials. Holly explains to Wilson that he is the only analyst covering BlueNote who is aware of this information and that he believes the new inventory processing system will allow BlueNote to reduce costs and increase overall profitability for several years to come.<\/p><p>Wilson must also review Holly&#x27;s report on BigTime, Inc., a musical promotion and distribution company. In the report, Holly provides a very optimistic analysis of BigTime&#x27;s fundamentals. The analysis supports a buy recommendation for the company. Wilson finds one problem with Holly&#x27;s report on BigTime related to Holly&#x27;s former business relationship with BigTime, Inc. Two years before joining Excess, Holly worked as an investment banker and received 1,000 restricted shares of BigTime as a result of his participation in taking the company public. These facts are not disclosed in the report but are disclosed on Excess Investment&#x27;s website.<\/p><p>Just before the report is issued, Holly mentions to Wilson that BigTime unknowingly disclosed to him and a few other analysts who were waiting for a conference call to begin that the company is planning to restructure both its sales staff and sales strategy and may sell one of its poorly performing business units next year.<\/p><p>Three days after issuing his report on BigTime, which caused a substantial rise in the price of BigTime shares, Holly sells all of the BigTime shares out of both his performance fee-based accounts and flat-fee accounts and then proceeds to sell all of the BigTime shares out of his own account on the following day. Holly obtained approval from Wilson before making the trades.<\/p><p>Just after selling his shares in BigTime, Holly receives a call from the CEO of BlueNote who wants to see if Holly received the desk pen engraved with the BlueNote company logo that he sent last week and also to offer two front row tickets plus limousine service to a sold-out concert for a popular band that uses BlueNote&#x27;s instruments. Holly confirms that the desk pen arrived and thanks the CEO for the gift and tells him that before he accepts the concert tickets, he will have to check his calendar to see if he will be able to attend. Holly declines the use of the limousine service should he decide to attend the concert.<\/p><p>After speaking with the CEO of BlueNote, Holly constructs a letter that he plans to send by email to all of his clients and prospects with email addresses and by regular mail to all of his clients and prospects without email addresses. The letter details changes to an equity valuation model that Holly and several other analysts at Excess use to analyze potential investment recommendations. Holly&#x27;s letter explains that the new model, which will be put into use next month, will utilize Monte Carlo simulations to create a distribution of stock values, a sharp contrast to the existing model which uses static valuations combined with sensitivity analysis. Relevant details of the new model are included in the letter, but similar details about the existing model are not included. The letter also explains that management at Excess has decided to exclude alcohol and tobacco company securities from the research coverage universe. Holly&#x27;s letter concludes by stating that no other significant changes that would affect the investment recommendation process have occurred or are expected to occur in the near future.<\/p><\/div><\/details><div class=\"qtext\"><p>In his letter to clients explaining the change in the valuation model, did Holly violate any CFA Institute Standards of Professional Conduct?<\/p><\/div>", "subj": "ethics"}, {"n": 7, "q": "Wilrus asks Pilchard to derive the lowest possible value for the coefficient on the FORECAST variable using a 99% confidence interval. The appropriate lower bound for the FORECAST coefficient is closest to:", "opts": ["0.0055.", "0.0628.", "0.1300."], "ans": "A", "expl": "The standard error can be determined by knowing the formula for the t-statistic: t-statistic = (slope estimate − hypothesized value) / standard error Therefore, the standard error equals: standard error = (slope estimate − hypothesized value) / t-statistic The null hypothesis associated with each of the t-statistics reported for the slope estimates in Table 1 is: H : slope = zero. So, the o standard error equals the slope estimate divided by its t-statistic: 0.2000 / 2.85 = 0.07. The confidence interval equals: slope estimate ± (t × standard error), where t is the critical t-statistic associated with the crit crit desired confidence interval (as stated in the question, the desired confidence interval equals 99%). Exhibit 3 provides critical values for a portion of the Student t-distribution. The appropriate critical value is found by using the correct significance level and degrees of freedom. The significance level equals 1 minus the confidence level = 1 − 0.99 = 0.01. The degrees of freedom equal N − k − 1, where k is the number of independent variables: 30 − 3 − 1 = 26 degrees of freedom. Note that the table provides critical values for one-tail tests of hypothesis (area in upper tail). Therefore, the appropriate critical value for the 99% confidence interval is found under the column labeled \"0.005,\" indicating that the upper tail comprises 0.5% of the t-distribution, and the lower tail comprises an equivalent 0.5% of the distribution. Therefore, the two tails, combined, take up 1% of the distribution. The correct critical t-statistic for the 0.01 significance level equals 2.779. Therefore, the 99% confidence interval for the FORECAST slope coefficient is: 0.2000 ± 2.779(0.07) = (0.0055, 0.3945) The lower bound equals 0.0055 and the upper bound equals 0.3945. For Further Reference: (Study Session 2, Module 4.2, LOS 4.c, Module 5.2, LOS 5.e)", "explhtml": "<p>The standard error can be determined by knowing the formula for the t-statistic:<\/p><p>t-statistic = (slope estimate − hypothesized value) / standard error<\/p><p>Therefore, the standard error equals:<\/p><p>standard error = (slope estimate − hypothesized value) / t-statistic<\/p><p>The null hypothesis associated with each of the t-statistics reported for the slope estimates in Table 1 is: H : slope = zero. So, the o standard error equals the slope estimate divided by its t-statistic: 0.2000 / 2.85 = 0.07.<\/p><div class=\"tbl\"><table><tr><td>The confidence interval equals: slope estimate ± (t<\/td><td> × standard error), where t<\/td><td> is the critical t-statistic associated with the<\/td><\/tr><tr><td>crit<\/td><td>crit<\/td><td><\/td><\/tr><\/table><\/div><p>desired confidence interval (as stated in the question, the desired confidence interval equals 99%). Exhibit 3 provides critical values for a portion of the Student t-distribution. The appropriate critical value is found by using the correct significance level and degrees of freedom. The significance level equals 1 minus the confidence level = 1 − 0.99 = 0.01. The degrees of freedom equal N − k − 1, where k is the number of independent variables: 30 − 3 − 1 = 26 degrees of freedom. Note that the table provides critical values for one-tail tests of hypothesis (area in upper tail). Therefore, the appropriate critical value for the 99% confidence interval is found under the column labeled &quot;0.005,&quot; indicating that the upper tail comprises 0.5% of the t-distribution, and the lower tail comprises an equivalent 0.5% of the distribution. Therefore, the two tails, combined, take up 1% of the distribution. The correct critical t-statistic for the 0.01 significance level equals 2.779. Therefore, the 99% confidence interval for the FORECAST slope coefficient is:<\/p><p>0.2000 ± 2.779(0.07) = (0.0055, 0.3945)<\/p><p>The lower bound equals 0.0055 and the upper bound equals 0.3945.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 2, Module 4.2, LOS 4.c, Module 5.2, LOS 5.e)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>Lena Pilchard, research associate for Eiffel Investments, is attempting to measure the value added to the Eiffel Investments portfolio from the use of 1-year earnings growth forecasts developed by professional analysts.<\/p><p>Pilchard&#x27;s supervisor, Edna Wilrus, recommends a portfolio allocation strategy that overweights neglected firms. Wilrus cites studies of the &quot;neglected firm effect,&quot; in which companies followed by a small number of professional analysts are associated with higher returns than firms followed by a larger number of analysts. Wilrus considers a company covered by three or fewer analysts to be &quot;neglected.&quot;<\/p><p>Pilchard also is aware of research indicating that, on average, stock returns for small firms have been higher than those earned by large firms. Pilchard develops a model to predict stock returns based on analyst coverage, firm size, and analyst growth forecasts. She runs the following cross-sectional regression using data for the 30 stocks included in the Eiffel Investments portfolio:<\/p><p>R  = b  + b COVERAGE  + b  LN(SIZE ) + b (FORECAST ) + e<\/p><div class=\"tbl\"><table><tr><td>i<\/td><td>0<\/td><td>1<\/td><td>i<\/td><td>2<\/td><td>i<\/td><td>3<\/td><td>i<\/td><td>i<\/td><\/tr><tr><td>where:<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>R  = the rate of return on stock i<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>i<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>COVERAGE  = one if there are three or fewer analysts covering stock i, and equals zero otherwise<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>i<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>LN(SIZE ) = the natural logarithm of the market capitalization (stock price times shares outstanding) for stock i, units in<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>i<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>millions<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>FORECAST  = the 1-year consensus earnings growth rate forecast for stock i<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>i<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Pilchard derives the following results from her cross-sectional regression:<\/p><p><b>Exhibit 1: Results of Pilchard&#x27;s Cross-Sectional Regression<\/b><\/p><div class=\"tbl\"><table><tr><td>Variable<\/td><td>Coefficient t-Statistic<\/td><td><\/td><\/tr><tr><td>Constant<\/td><td>0.060<\/td><td>1.56<\/td><\/tr><tr><td>COVERAGE<\/td><td>0.050<\/td><td>3.20<\/td><\/tr><tr><td>LN(SIZE)<\/td><td>–0.003<\/td><td>–2.50<\/td><\/tr><tr><td>FORECAST<\/td><td>0.200<\/td><td>2.85<\/td><\/tr><\/table><\/div><p>The standard error of estimate in Pilchard&#x27;s regression equals 1.96 and the regression sum of squares equals 400.<\/p><p>Wilrus provides Pilchard with the following values for analyst coverage, firm size, and earnings growth forecast for Eggmann Enterprises, a company that Eiffel Investments is evaluating.<\/p><p><b>Exhibit 2: Coverage, Firm Size, and Earnings Growth Forecast for Eggmann Enterprises<\/b><\/p><div class=\"tbl\"><table><tr><td>Number of analysts<\/td><td>5<\/td><\/tr><tr><td>Firm size<\/td><td>$500 million<\/td><\/tr><\/table><\/div><p>Earnings growth forecast 50%<\/p><p>Pilchard uses the following table to conduct some of her hypothesis tests.<\/p><p><b>Exhibit 3: Critical Values for Student t-Distribution<\/b><\/p><p>Area in Upper Tail Degrees of Freedom<\/p><div class=\"tbl\"><table><tr><td>0.10<\/td><td>0.05<\/td><td>0.025<\/td><td>0.01<\/td><td>0.005<\/td><\/tr><tr><td>1.315 1.706 2.056 2.479 2.779<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>1.314 1.703 2.052 2.473 2.771<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>28<\/td><td>1.313 1.701 2.048 2.467 2.763<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>29<\/td><td>1.311<\/td><td>1.699 2.045 2.462 2.756<\/td><td><\/td><td><\/td><\/tr><tr><td>30<\/td><td>1.310 1.697 2.042 2.457 2.750<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Wilrus asks Pilchard to derive the lowest possible value for the coefficient on the FORECAST variable using a 99% confidence interval. The appropriate lower bound for the FORECAST coefficient is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 8, "q": "Wilrus asks Pilchard to assess the overall significance of her regression. To address the question, Pilchard calculates the R- square. She also decides to run a test of the significance of the regression as a whole. Determine the appropriate test statistic she should use to test the overall significance of the regression.", "opts": ["F-statistic.", "t-statistic.", "Adjusted R-square."], "ans": "A", "expl": "The F-statistic is used to test the overall significance of the regression, which is formulated with the null hypothesis that all three slopes simultaneously equal zero. Note that the adjusted R-square is not a test-statistic. For Further Reference: (Study Session 2, Module 5.3, LOS 5.g)", "explhtml": "<p>The F-statistic is used to test the overall significance of the regression, which is formulated with the null hypothesis that all three slopes simultaneously equal zero. Note that the adjusted R-square is not a test-statistic.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 2, Module 5.3, LOS 5.g)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lena Pilchard, research associate for Eiffel Investments, is attempting to measure the value added to the Eiffel Investments portfolio from the use of 1-year earnings growth forecasts developed by professional analysts.<\/p><p>Pilchard&#x27;s supervisor, Edna Wilrus, recommends a portfolio allocation strategy that overweights neglected firms. Wilrus cites studies of the &quot;neglected firm effect,&quot; in which companies followed by a small number of professional analysts are associated with higher returns than firms followed by a larger number of analysts. Wilrus considers a company covered by three or fewer analysts to be &quot;neglected.&quot;<\/p><p>Pilchard also is aware of research indicating that, on average, stock returns for small firms have been higher than those earned by large firms. Pilchard develops a model to predict stock returns based on analyst coverage, firm size, and analyst growth forecasts. She runs the following cross-sectional regression using data for the 30 stocks included in the Eiffel Investments portfolio:<\/p><p>R  = b  + b COVERAGE  + b  LN(SIZE ) + b (FORECAST ) + e<\/p><div class=\"tbl\"><table><tr><td>i<\/td><td>0<\/td><td>1<\/td><td>i<\/td><td>2<\/td><td>i<\/td><td>3<\/td><td>i<\/td><td>i<\/td><\/tr><tr><td>where:<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>R  = the rate of return on stock i<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>i<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>COVERAGE  = one if there are three or fewer analysts covering stock i, and equals zero otherwise<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>i<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>LN(SIZE ) = the natural logarithm of the market capitalization (stock price times shares outstanding) for stock i, units in<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>i<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>millions<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>FORECAST  = the 1-year consensus earnings growth rate forecast for stock i<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>i<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Pilchard derives the following results from her cross-sectional regression:<\/p><p><b>Exhibit 1: Results of Pilchard&#x27;s Cross-Sectional Regression<\/b><\/p><div class=\"tbl\"><table><tr><td>Variable<\/td><td>Coefficient t-Statistic<\/td><td><\/td><\/tr><tr><td>Constant<\/td><td>0.060<\/td><td>1.56<\/td><\/tr><tr><td>COVERAGE<\/td><td>0.050<\/td><td>3.20<\/td><\/tr><tr><td>LN(SIZE)<\/td><td>–0.003<\/td><td>–2.50<\/td><\/tr><tr><td>FORECAST<\/td><td>0.200<\/td><td>2.85<\/td><\/tr><\/table><\/div><p>The standard error of estimate in Pilchard&#x27;s regression equals 1.96 and the regression sum of squares equals 400.<\/p><p>Wilrus provides Pilchard with the following values for analyst coverage, firm size, and earnings growth forecast for Eggmann Enterprises, a company that Eiffel Investments is evaluating.<\/p><p><b>Exhibit 2: Coverage, Firm Size, and Earnings Growth Forecast for Eggmann Enterprises<\/b><\/p><div class=\"tbl\"><table><tr><td>Number of analysts<\/td><td>5<\/td><\/tr><tr><td>Firm size<\/td><td>$500 million<\/td><\/tr><\/table><\/div><p>Earnings growth forecast 50%<\/p><p>Pilchard uses the following table to conduct some of her hypothesis tests.<\/p><p><b>Exhibit 3: Critical Values for Student t-Distribution<\/b><\/p><p>Area in Upper Tail Degrees of Freedom<\/p><div class=\"tbl\"><table><tr><td>0.10<\/td><td>0.05<\/td><td>0.025<\/td><td>0.01<\/td><td>0.005<\/td><\/tr><tr><td>1.315 1.706 2.056 2.479 2.779<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>1.314 1.703 2.052 2.473 2.771<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>28<\/td><td>1.3 fore, the null hypothesis that small firms do not outperform large firms, after controlling for COVERAGE and FORECAST should be rejected in favor of the alternative hypothesis that small firms outperform large firms (after controlling for COVERAGE and FORECAST). For Further Reference: (Study Session 2, Module 4.2, LOS 4.d, Module 5.2, LOS 5.e)", "explhtml": "<p>Pilchard should test the following null hypothesis: H : b  ≥ 0. The alternative hypothesis is: H : b  &lt; 0 (a negative estimate for b<\/p><div class=\"tbl\"><table><tr><td>o<\/td><td>2<\/td><td>A<\/td><td>2<\/td><td>2<\/td><\/tr><\/table><\/div><p>supports the small firm effect). The test is a one-tail hypothesis test. The critical value at the 0.01 value for a one-tail test equals – 2.479 (area in lower tail equals 0.01; degrees of freedom equal 26). Exhibit 1 indicates that the t-statistic for the b  estimate equals 2 –2.50, which exceeds the critical value. Therefore, the null hypothesis that small firms do not outperform large firms, after controlling for COVERAGE and FORECAST should be rejected in favor of the alternative hypothesis that small firms outperform large firms (after controlling for COVERAGE and FORECAST).<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 2, Module 4.2, LOS 4.d, Module 5.2, LOS 5.e)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lena Pilchard, research associate for Eiffel Investments, is attempting to measure the value added to the Eiffel Investments portfolio from the use of 1-year earnings growth forecasts developed by professional analysts.<\/p><p>Pilchard&#x27;s supervisor, Edna Wilrus, recommends a portfolio allocation strategy that overweights neglected firms. Wilrus cites studies of the &quot;neglected firm effect,&quot; in which companies followed by a small number of professional analysts ar
