dwest News is the build-up method. All relevant information to determine Midwest News&#x27;s required return on equity is presented in Exhibit 2.<\/p><p><b>Exhibit 2: Required Return Estimate Factors<\/b><\/p><div class=\"tbl\"><table><tr><td>Risk-free rate<\/td><td>3.5%<\/td><\/tr><tr><td>Equity risk premium<\/td><td>4.0%<\/td><\/tr><tr><td>Small size premium<\/td><td>3.5%<\/td><\/tr><\/table><\/div><p>Specific-company premium 2.0%<\/p><div class=\"tbl\"><table><tr><td>Beta<\/td><td>1.2<\/td><\/tr><tr><td>Growth rate<\/td><td>3.0%<\/td><\/tr><\/table><\/div><p>The specific-company premium reflects concerns about future industry performance and business risk in Midwest News. Miller makes two statements concerning the valuation methodology used to value Midwest News&#x27;s equity.<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>The required return estimate that is calculated from Exhibit 2 reflects all adjustments needed to<\/td><\/tr><tr><td>make an accurate valuation of Midwest News.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>It is better to use the free cash flow model to value Midwest News than a dividend discount<\/td><\/tr><tr><td>model.<\/td><td><\/td><\/tr><\/table><\/div><p>Miller considered two different valuation models to determine the price of Midwest News&#x27;s equity: a single-stage free cash flow model and a single-stage residual income model.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the single-stage residual income model and assuming the required return on equity is 15%, the value of Midwest News is closest to (use information in Exhibits 1 and 2):<\/p><\/div>", "subj": "equity"}, {"n": 42, "q": "Miller has made two statements, one concerning the required return estimate and the other concerning the relative merits of the free cash flow model versus the dividend discount model. Are Miller's statements correct?", "opts": ["Only Statement 1 is correct.", "Only Statement 2 is correct.", "Both Statements 1 and 2 are correct."], "ans": "B", "expl": "An issue not described in Exhibit 2 is control premium. Any control premium adjustment is normally added directly to a company's value estimate. Statement 1 is not correct. Since Midwest News does not pay a dividend, the free cash flow model would be better suited to compute the company's equity value rather than the dividend discount model. Statement 2 is correct. For Further Reference: (Study Session 9, Module 25.1, LOS 25.c and Study Session 11, Module 28.5, LOS 28.f)", "explhtml": "<p>An issue not described in Exhibit 2 is control premium. Any control premium adjustment is normally added directly to a company&#x27;s value estimate. Statement 1 is not correct. Since Midwest News does not pay a dividend, the free cash flow model would be better suited to compute the company&#x27;s equity value rather than the dividend discount model. Statement 2 is correct.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 9, Module 25.1, LOS 25.c and Study Session 11, Module 28.5, LOS 28.f)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sentinel News is a publisher of more than 100 newspapers around the country, with the exception of the Midwestern states. The company&#x27;s CFO, Harry Miller, has been reviewing a number of potential candidates (both public and private companies) that would provide Sentinel News entrance into the Midwestern market. Recently, the founder of Midwest News, a private newspaper company, passed away. The founder&#x27;s family members are inclined to sell their 80% controlling interest. The family members are concerned that Midwest News&#x27;s declining newspaper circulation is not cyclical, but rather permanent. The family members would reinvest the cash proceeds from the sale of Midwest News into a diversified portfolio of stocks and bonds. Miller&#x27;s staff collects the financial information shown in Exhibit 1.<\/p><p><b>Exhibit 1: Midwest News&#x27;s Financial Information<\/b><\/p><div class=\"tbl\"><table><tr><td>Total assets<\/td><td>$92.5 million<\/td><\/tr><tr><td>Total debt<\/td><td>$0<\/td><\/tr><tr><td>Total equity<\/td><td>$79.5 million<\/td><\/tr><tr><td>Shares outstanding<\/td><td>1.5 million<\/td><\/tr><tr><td>Revenues<\/td><td>$251.5 million<\/td><\/tr><tr><td>Net income (next year&#x27;s forecast)<\/td><td>$19.5 million<\/td><\/tr><\/table><\/div><p>Miller noted that Midwest News does not pay a dividend, nor does the company have any debt. The most comparable publicly traded stock is Freedom Corporation. Freedom, however, has significant radio and television operations. Freedom&#x27;s estimated beta is 0.90, and 40% of the company&#x27;s capital structure is debt. Freedom is expected to maintain a payout ratio of 40%. Analysts are forecasting the company will earn $3.00 per share next year and grow their earnings by 6% per year. Freedom has a current market capitalization of $15 billion and 375 million shares outstanding. Freedom&#x27;s current market value equals its intrinsic value.<\/p><p>Miller&#x27;s staff uses current expectations to develop the appropriate equity risk premium for Midwest News. The staff uses the Gordon growth model to estimate Midwest&#x27;s equity risk premium. The equity risk premium calculated by the staff is provided in Exhibit 2.<\/p><p>Miller believes the best method to estimate the required return on equity of Midwest News is the build-up method. All relevant information to determine Midwest News&#x27;s required return on equity is presented in Exhibit 2.<\/p><p><b>Exhibit 2: Required Return Estimate Factors<\/b><\/p><div class=\"tbl\"><table><tr><td>Risk-free rate<\/td><td>3.5%<\/td><\/tr><tr><td>Equity risk premium<\/td><td>4.0%<\/td><\/tr><tr><td>Small size premium<\/td><td>3.5%<\/td><\/tr><\/table><\/div><p>Specific-company premium 2.0%<\/p><div class=\"tbl\"><table><tr><td>Beta<\/td><td>1.2<\/td><\/tr><tr><td>Growth rate<\/td><td>3.0%<\/td><\/tr><\/table><\/div><p>The specific-company premium reflects concerns about future industry performance and business risk in Midwest News. Miller makes two statements concerning the valuation methodology used to value Midwest News&#x27;s equity.<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>The required return estimate that is calculated from Exhibit 2 reflects all adjustments needed to<\/td><\/tr><tr><td>make an accurate valuation of Midwest News.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>It is better to use the free cash flow model to value Midwest News than a dividend discount<\/td><\/tr><tr><td>model.<\/td><td><\/td><\/tr><\/table><\/div><p>Miller considered two different valuation models to determine the price of Midwest News&#x27;s equity: a single-stage free cash flow model and a single-stage residual income model.<\/p><\/div><\/details><div class=\"qtext\"><p>Miller has made two statements, one concerning the required return estimate and the other concerning the relative merits of the free cash flow model versus the dividend discount model. Are Miller&#x27;s statements correct?<\/p><\/div>", "subj": "equity"}, {"n": 43, "q": "In Exhibit 1, which of the underlying principles outlined by Lowenstadt is most accurate?", "opts": ["Principle 1.", "Principle 2.", "Principle 3."], "ans": "C", "expl": "The expected loss is (the probability of default) × (loss given default), not the recovery rate. Credit valuation adjustment (CVA) is the sum of the present value of the expected loss for each period. In general, given the market price (and hence the credit spread), the estimated risk-neutral probabilities of default and recovery rates are positively correlated. For Further Reference: (Study Session 13, Module 35.1, LOS 35.a)", "explhtml": "<p>The expected loss is (the probability of default) × (loss given default), not the recovery rate. Credit valuation adjustment (CVA) is the sum of the present value of the expected loss for each period. In general, given the market price (and hence the credit spread), the estimated risk-neutral probabilities of default and recovery rates are positively correlated.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 35.1, LOS 35.a)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Fixed Income<\/summary><div class=\"vig-body\"><p>CTT Credit Analysis provides fixed-income credit analysis to fund managers and high net worth individuals. Tam Lowenstadt, CFA, joined the firm recently; one of his first tasks is to provide a new client with an overview of the credit analysis models the firm uses. He begins by outlining some key underlying principles, as shown in Exhibit 1.<\/p><p><b>Exhibit 1: Key Underlying Principles<\/b><\/p><p>1. The probability of default multiplied by the recovery rate given default is equal to the expected loss. 2. The sum of expected losses for each period is equal to the cumulative valuation adjustment. 3. Given the market price of a credit risky bond, the estimated risk-neutral probabilities of default and recovery rates are positively correlated. Lowenstadt also provides an overview of the structural model approach to credit analysis. He starts off by explaining the basic approach of valuing the credit risk by using an option analogy. He makes two key statements regarding this analogy and how it can be used to value equity and debt:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Owning the company&#x27;s debt with a face value of K and a maturity of T is economically equivalent<\/td><\/tr><tr><td>to owning a riskless bond with face value of K and maturity of T and simultaneously purchasing a<\/td><td><\/td><\/tr><tr><td>European put option on the assets of the company with a strike price equal to K and maturing at<\/td><td><\/td><\/tr><tr><td>time T.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>Holding the company&#x27;s equity is economically equivalent to owning a European call option on the<\/td><\/tr><tr><td>company&#x27;s assets.<\/td><td><\/td><\/tr><\/table><\/div><p>CTT Credit Analysis always includes an illustration of the impact of credit migration on the price performance of corporate bonds. As an example, Lowenstadt demonstrates the impact of a credit downgrade of ZT bonds. ZT, Inc., has two bonds outstanding, identical in every respect except that one is callable while the other is not.<\/p><p>CCT does not recommend the use of reduced form models of credit analysis to its clients. Lowenstadt defended this decision based on the firm&#x27;s standard response as shown in Exhibit 2.<\/p><p><b>Exhibit 2: CCT Firm View on Reduced Form Models<\/b><\/p><div class=\"tbl\"><table><tr><td>Point 1: <\/td><td>Unlike the structural model, reduced form models do not explain why default occurs.<\/td><\/tr><tr><td>Point 2: <\/td><td>A key input into the reduced form model is the default intensity, which is the probability of<\/td><\/tr><tr><td>default over the next time period. Default intensity is estimated using option pricing models.<\/td><td><\/td><\/tr><\/table><\/div><p>Finally, Lowenstadt also discussed CCT&#x27;s application of credit analysis to asset-backed securities. Lowenstadt is aware that the client has some collateralized debt obligations in her portfolio. His overview is shown in Exhibit 3.<\/p><p><b>Exhibit 3: ABS Overview<\/b><\/p><p>Section 1 − Collateral<\/p><p>Short-term granular and homogenous structured finance vehicles are evaluated using a portfolio-based approach. Medium-term granular and homogenous obligations are evaluated using a statistical-based approach because the portfolio composition varies over time.<\/p><p>Section 2 − Servicer Quality<\/p><p>Counterparty risk. Operational risk.<\/p><p>Section 3 − Structure<\/p><p>Credit enhancement. Distribution waterfall.<\/p><\/div><\/details><div class=\"qtext\"><p>In Exhibit 1, which of the underlying principles outlined by Lowenstadt is most accurate?<\/p><\/div>", "subj": "fixed"}, {"n": 44, "q": "Lowenstadt's Statement 1 is most likely:", "opts": ["incorrect, as he should have instead stated purchasing a European call option.", "incorrect, as he should have instead stated selling a European put option.", "correct."], "ans": "B", "expl": "The option analogy for debt states that a long position in risky debt is equivalent to a long position in a riskless bond plus a short European put on the company's assets. For Further Reference: (Study Session 13, Module 35.4, LOS 35.d)", "explhtml": "<p>The option analogy for debt states that a long position in risky debt is equivalent to a long position in a riskless bond plus a short European put on the company&#x27;s assets.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 35.4, LOS 35.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>CTT Credit Analysis provides fixed-income credit analysis to fund managers and high net worth individuals. Tam Lowenstadt, CFA, joined the firm recently; one of his first tasks is to provide a new client with an overview of the credit analysis models the firm uses. He begins by outlining some key underlying principles, as shown in Exhibit 1.<\/p><p><b>Exhibit 1: Key Underlying Principles<\/b><\/p><p>1. The probability of default multiplied by the recovery rate given default is equal to the expected loss. 2. The sum of expected losses for each period is equal to the cumulative valuation adjustment. 3. Given the market price of a credit risky bond, the estimated risk-neutral probabilities of default and recovery rates are positively correlated. Lowenstadt also provides an overview of the structural model approach to credit analysis. He starts off by explaining the basic approach of valuing the credit risk by using an option analogy. He makes two key statements regarding this analogy and how it can be used to value equity and debt:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Owning the company&#x27;s debt with a face value of K and a maturity of T is economically equivalent<\/td><\/tr><tr><td>to owning a riskless bond with face value of K and maturity of T and simultaneously purchasing a<\/td><td><\/td><\/tr><tr><td>European put option on the assets of the company with a strike price equal to K and maturing at<\/td><td><\/td><\/tr><tr><td>time T.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>Holding the company&#x27;s equity is economically equivalent to owning a European call option on the<\/td><\/tr><tr><td>company&#x27;s assets.<\/td><td><\/td><\/tr><\/table><\/div><p>CTT Credit Analysis always includes an illustration of the impact of credit migration on the price performance of corporate bonds. As an example, Lowenstadt demonstrates the impact of a credit downgrade of ZT bonds. ZT, Inc., has two bonds outstanding, identical in every respect except that one is callable while the other is not.<\/p><p>CCT does not recommend the use of reduced form models of credit analysis to its clients. Lowenstadt defended this decision based on the firm&#x27;s standard response as shown in Exhibit 2.<\/p><p><b>Exhibit 2: CCT Firm View on Reduced Form Models<\/b><\/p><div class=\"tbl\"><table><tr><td>Point 1: <\/td><td>Unlike the structural model, reduced form models do not explain why default occurs.<\/td><\/tr><tr><td>Point 2: <\/td><td>A key input into the reduced form model is the default intensity, which is the probability of<\/td><\/tr><tr><td>default over the next time period. Default intensity is estimated using option pricing models.<\/td><td><\/td><\/tr><\/table><\/div><p>Finally, Lowenstadt also discussed CCT&#x27;s application of credit analysis to asset-backed securities. Lowenstadt is aware that the client has some collateralized debt obligations in her portfolio. His overview is shown in Exhibit 3.<\/p><p><b>Exhibit 3: ABS Overview<\/b><\/p><p>Section 1 − Collateral<\/p><p>Short-term granular and homogenous structured finance vehicles are evaluated using a portfolio-based approach. Medium-term granular and homogenous obligations are evaluated using a statistical-based approach because the portfolio composition varies over time.<\/p><p>Section 2 − Servicer Quality<\/p><p>Counterparty risk. Operational risk.<\/p><p>Section 3 − Structure<\/p><p>Credit enhancement. Distribution waterfall.<\/p><\/div><\/details><div class=\"qtext\"><p>Lowenstadt&#x27;s Statement 1 is most likely:<\/p><\/div>", "subj": "fixed"}, {"n": 45, "q": "Lowenstadt's Statement 2 is best described as:", "opts": ["incorrect, as he should have instead stated American call option.", "incorrect, as he should have instead stated European put option.", "correct."], "ans": "C", "expl": "European call on assets is the correct analogy for equity under the structural model for credit analysis. For Further Reference: (Study Session 13, Module 35.4, LOS 35.d)", "explhtml": "<p>European call on assets is the correct analogy for equity under the structural model for credit analysis.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 35.4, LOS 35.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>CTT Credit Analysis provides fixed-income credit analysis to fund managers and high net worth individuals. Tam Lowenstadt, CFA, joined the firm recently; one of his first tasks is to provide a new client with an overview of the credit analysis models the firm uses. He begins by outlining some key underlying principles, as shown in Exhibit 1.<\/p><p><b>Exhibit 1: Key Underlying Principles<\/b><\/p><p>1. The probability of default multiplied by the recovery rate given default is equal to the expected loss. 2. The sum of expected losses for each period is equal to the cumulative valuation adjustment. 3. Given the market price of a credit risky bond, the estimated risk-neutral probabilities of default and recovery rates are positively correlated. Lowenstadt also provides an overview of the structural model approach to credit analysis. He starts off by explaining the basic approach of valuing the credit risk by using an option analogy. He makes two key statements regarding this analogy and how it can be used to value equity and debt:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Owning the company&#x27;s debt with a face value of K and a maturity of T is economically equivalent<\/td><\/tr><tr><td>to owning a riskless bond with face value of K and maturity of T and simultaneously purchasing a<\/td><td><\/td><\/tr><tr><td>European put option on the assets of the company with a strike price equal to K and maturing at<\/td><td><\/td><\/tr><tr><td>time T.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>Holding the company&#x27;s equity is economically equivalent to owning a European call option on the<\/td><\/tr><tr><td>company&#x27;s assets.<\/td><td><\/td><\/tr><\/table><\/div><p>CTT Credit Analysis always includes an illustration of the impact of credit migration on the price performance of corporate bonds. As an example, Lowenstadt demonstrates the impact of a credit downgrade of ZT bonds. ZT, Inc., has two bonds outstanding, identical in every respect except that one is callable while the other is not.<\/p><p>CCT does not recommend the use of reduced form models of credit analysis to its clients. Lowenstadt defended this decision based on the firm&#x27;s standard response as shown in Exhibit 2.<\/p><p><b>Exhibit 2: CCT Firm View on Reduced Form Models<\/b><\/p><div class=\"tbl\"><table><tr><td>Point 1: <\/td><td>Unlike the structural model, reduced form models do not explain why default occurs.<\/td><\/tr><tr><td>Point 2: <\/td><td>A key input into the reduced form model is the default intensity, which is the probability of<\/td><\/tr><tr><td>default over the next time period. Default intensity is estimated using option pricing models.<\/td><td><\/td><\/tr><\/table><\/div><p>Finally, Lowenstadt also discussed CCT&#x27;s application of credit analysis to asset-backed securities. Lowenstadt is aware that the client has some collateralized debt obligations in her portfolio. His overview is shown in Exhibit 3.<\/p><p><b>Exhibit 3: ABS Overview<\/b><\/p><p>Section 1 − Collateral<\/p><p>Short-term granular and homogenous structured finance vehicles are evaluated using a portfolio-based approach. Medium-term granular and homogenous obligations are evaluated using a statistical-based approach because the portfolio composition varies over time.<\/p><p>Section 2 − Servicer Quality<\/p><p>Counterparty risk. Operational risk.<\/p><p>Section 3 − Structure<\/p><p>Credit enhancement. Distribution waterfall.<\/p><\/div><\/details><div class=\"qtext\"><p>Lowenstadt&#x27;s Statement 2 is best described as:<\/p><\/div>", "subj": "fixed"}, {"n": 46, "q": "Given Lowenstadt's scenario, relative to the price performance of the straight bond issued by ZT, Inc., the callable bond is most likely to have:", "opts": ["equal or poorer price performance.", "equal or better price performance.", "the same price performance."], "ans": "B", "expl": "Given Lowenstadt's scenario of a ratings downgrade, spreads should widen. Callable bonds have a duration that is lower than (or equal to) the duration of comparable straight bonds. Hence, the decline in price for a callable ZT bond will be less than (or equal to) the decline in price of an equivalent straight ZT bond. For Further Reference: (Study Session 13, Module 34.5, LOS 34.j, Module 35.6, LOS 35.f)", "explhtml": "<p>Given Lowenstadt&#x27;s scenario of a ratings downgrade, spreads should widen. Callable bonds have a duration that is lower than (or equal to) the duration of comparable straight bonds. Hence, the decline in price for a callable ZT bond will be less than (or equal to) the decline in price of an equivalent straight ZT bond.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 34.5, LOS 34.j, Module 35.6, LOS 35.f)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>CTT Credit Analysis provides fixed-income credit analysis to fund managers and high net worth individuals. Tam Lowenstadt, CFA, joined the firm recently; one of his first tasks is to provide a new client with an overview of the credit analysis models the firm uses. He begins by outlining some key underlying principles, as shown in Exhibit 1.<\/p><p><b>Exhibit 1: Key Underlying Principles<\/b><\/p><p>1. The probability of default multiplied by the recovery rate given default is equal to the expected loss. 2. The sum of expected losses for each period is equal to the cumulative valuation adjustment. 3. Given the market price of a credit risky bond, the estimated risk-neutral probabilities of default and recovery rates are positively correlated. Lowenstadt also provides an overview of the structural model approach to credit analysis. He starts off by explaining the basic approach of valuing the credit risk by using an option analogy. He makes two key statements regarding this analogy and how it can be used to value equity and debt:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Owning the company&#x27;s debt with a face value of K and a maturity of T is economically equivalent<\/td><\/tr><tr><td>to owning a riskless bond with face value of K and maturity of T and simultaneously purchasing a<\/td><td><\/td><\/tr><tr><td>European put option on the assets of the company with a strike price equal to K and maturing at<\/td><td><\/td><\/tr><tr><td>time T.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>Holding the company&#x27;s equity is economically equivalent to owning a European call option on the<\/td><\/tr><tr><td>company&#x27;s assets.<\/td><td><\/td><\/tr><\/table><\/div><p>CTT Credit Analysis always includes an illustration of the impact of credit migration on the price performance of corporate bonds. As an example, Lowenstadt demonstrates the impact of a credit downgrade of ZT bonds. ZT, Inc., has two bonds outstanding, identical in every respect except that one is callable while the other is not.<\/p><p>CCT does not recommend the use of reduced form models of credit analysis to its clients. Lowenstadt defended this decision based on the firm&#x27;s standard response as shown in Exhibit 2.<\/p><p><b>Exhibit 2: CCT Firm View on Reduced Form Models<\/b><\/p><div class=\"tbl\"><table><tr><td>Point 1: <\/td><td>Unlike the structural model, reduced form models do not explain why default occurs.<\/td><\/tr><tr><td>Point 2: <\/td><td>A key input into the reduced form model is the default intensity, which is the probability of<\/td><\/tr><tr><td>default over the next time period. Default intensity is estimated using option pricing models.<\/td><td><\/td><\/tr><\/table><\/div><p>Finally, Lowenstadt also discussed CCT&#x27;s application of credit analysis to asset-backed securities. Lowenstadt is aware that the client has some collateralized debt obligations in her portfolio. His overview is shown in Exhibit 3.<\/p><p><b>Exhibit 3: ABS Overview<\/b><\/p><p>Section 1 − Collateral<\/p><p>Short-term granular and homogenous structured finance vehicles are evaluated using a portfolio-based approach. Medium-term granular and homogenous obligations are evaluated using a statistical-based approach because the portfolio composition varies over time.<\/p><p>Section 2 − Servicer Quality<\/p><p>Counterparty risk. Operational risk.<\/p><p>Section 3 − Structure<\/p><p>Credit enhancement. Distribution waterfall.<\/p><\/div><\/details><div class=\"qtext\"><p>Given Lowenstadt&#x27;s scenario, relative to the price performance of the straight bond issued by ZT, Inc., the callable bond is most likely to have:<\/p><\/div>", "subj": "fixed"}, {"n": 47, "q": "Which of Lowenstadt's points in Exhibit 2 is correct?", "opts": ["Only point 1 is accurate.", "Only point 2 is accurate.", "Neither Point is accurate."], "ans": "A", "expl": "While structural models provide economic rationale regarding why default occurs (i.e., when A < K), reduced form models do not. T Default intensity is typically estimated using regression models (not option pricing models). For Further Reference: (Study Session 13, Module 35.4, LOS 35.d)", "explhtml": "<p>While structural models provide economic rationale regarding why default occurs (i.e., when A  &lt; K), reduced form models do not. T Default intensity is typically estimated using regression models (not option pricing models).<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 35.4, LOS 35.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>CTT Credit Analysis provides fixed-income credit analysis to fund managers and high net worth individuals. Tam Lowenstadt, CFA, joined the firm recently; one of his first tasks is to provide a new client with an overview of the credit analysis models the firm uses. He begins by outlining some key underlying principles, as shown in Exhibit 1.<\/p><p><b>Exhibit 1: Key Underlying Principles<\/b><\/p><p>1. The probability of default multiplied by the recovery rate given default is equal to the expected loss. 2. The sum of expected losses for each period is equal to the cumulative valuation adjustment. 3. Given the market price of a credit risky bond, the estimated risk-neutral probabilities of default and recovery rates are positively correlated. Lowenstadt also provides an overview of the structural model approach to credit analysis. He starts off by explaining the basic approach of valuing the credit risk by using an option analogy. He makes two key statements regarding this analogy and how it can be used to value equity and debt:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Owning the company&#x27;s debt with a face value of K and a maturity of T is economically equivalent<\/td><\/tr><tr><td>to owning a riskless bond with face value of K and maturity of T and simultaneously purchasing a<\/td><td><\/td><\/tr><tr><td>European put option on the assets of the company with a strike price equal to K and maturing at<\/td><td><\/td><\/tr><tr><td>time T.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>Holding the company&#x27;s equity is economically equivalent to owning a European call option on the<\/td><\/tr><tr><td>company&#x27;s assets.<\/td><td><\/td><\/tr><\/table><\/div><p>CTT Credit Analysis always includes an illustration of the impact of credit migration on the price performance of corporate bonds. As an example, Lowenstadt demonstrates the impact of a credit downgrade of ZT bonds. ZT, Inc., has two bonds outstanding, identical in every respect except that one is callable while the other is not.<\/p><p>CCT does not recommend the use of reduced form models of credit analysis to its clients. Lowenstadt defended this decision based on the firm&#x27;s standard response as shown in Exhibit 2.<\/p><p><b>Exhibit 2: CCT Firm View on Reduced Form Models<\/b><\/p><div class=\"tbl\"><table><tr><td>Point 1: <\/td><td>Unlike the structural model, reduced form models do not explain why default occurs.<\/td><\/tr><tr><td>Point 2: <\/td><td>A key input into the reduced form model is the default intensity, which is the probability of<\/td><\/tr><tr><td>default over the next time period. Default intensity is estimated using option pricing models.<\/td><td><\/td><\/tr><\/table><\/div><p>Finally, Lowenstadt also discussed CCT&#x27;s application of credit analysis to asset-backed securities. Lowenstadt is aware that the client has some collateralized debt obligations in her portfolio. His overview is shown in Exhibit 3.<\/p><p><b>Exhibit 3: ABS Overview<\/b><\/p><p>Section 1 − Collateral<\/p><p>Short-term granular and homogenous structured finance vehicles are evaluated using a portfolio-based approach. Medium-term granular and homogenous obligations are evaluated using a statistical-based approach because the portfolio composition varies over time.<\/p><p>Section 2 − Servicer Quality<\/p><p>Counterparty risk. Operational risk.<\/p><p>Section 3 − Structure<\/p><p>Credit enhancement. Distribution waterfall.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Lowenstadt&#x27;s points in Exhibit 2 is correct?<\/p><\/div>", "subj": "fixed"}, {"n": 48, "q": "Lowenstadt's overview of asset-backed securities in Exhibit 3 most likely contains an error in:", "opts": ["Section 1, because short-term granular and homogenous structured finance vehicles are evaluated using a statistical-based approach, while medium-term granular and homogenous obligations are evaluated using a portfolio-based approach.", "Section 2, because counterparty risk is not relevant for servicer quality.", "Section 3, because credit enhancement is not relevant for asset-backed securities."], "ans": "A", "expl": "Short-term granular and homogenous structured finance vehicles are evaluated using a statistical-based approach. Medium-term granular and homogenous obligations are evaluated using a portfolio-based approach because the portfolio composition varies over time. All other sections are correct. For Further Reference: (Study Session 13, Module 35.3, LOS 35.h)", "explhtml": "<p>Short-term granular and homogenous structured finance vehicles are evaluated using a statistical-based approach. Medium-term granular and homogenous obligations are evaluated using a portfolio-based approach because the portfolio composition varies over time. All other sections are correct.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 35.3, LOS 35.h)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>CTT Credit Analysis provides fixed-income credit analysis to fund managers and high net worth individuals. Tam Lowenstadt, CFA, joined the firm recently; one of his first tasks is to provide a new client with an overview of the credit analysis models the firm uses. He begins by outlining some key underlying principles, as shown in Exhibit 1.<\/p><p><b>Exhibit 1: Key Underlying Principles<\/b><\/p><p>1. The probability of default multiplied by the recovery rate given default is equal to the expected loss. 2. The sum of expected losses for each period is equal to the cumulative valuation adjustment. 3. Given the market price of a credit risky bond, the estimated risk-neutral probabilities of default and recovery rates are positively correlated. Lowenstadt also provides an overview of the structural model approach to credit analysis. He starts off by explaining the basic approach of valuing the credit risk by using an option analogy. He makes two key statements regarding this analogy and how it can be used to value equity and debt:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Owning the company&#x27;s debt with a face value of K and a maturity of T is economically equivalent<\/td><\/tr><tr><td>to owning a riskless bond with face value of K and maturity of T and simultaneously purchasing a<\/td><td><\/td><\/tr><tr><td>European put option on the assets of the company with a strike price equal to K and maturing at<\/td><td><\/td><\/tr><tr><td>time T.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>Holding the company&#x27;s equity is economically equivalent to owning a European call option on the<\/td><\/tr><tr><td>company&#x27;s assets.<\/td><td><\/td><\/tr><\/table><\/div><p>CTT Credit Analysis always includes an illustration of the impact of credit migration on the price performance of corporate bonds. As an example, Lowenstadt demonstrates the impact of a credit downgrade of ZT bonds. ZT, Inc., has two bonds outstanding, identical in every respect except that one is callable while the other is not.<\/p><p>CCT does not recommend the use of reduced form models of credit analysis to its clients. Lowenstadt defended this decision based on the firm&#x27;s standard response as shown in Exhibit 2.<\/p><p><b>Exhibit 2: CCT Firm View on Reduced Form Models<\/b><\/p><div class=\"tbl\"><table><tr><td>Point 1: <\/td><td>Unlike the structural model, reduced form models do not explain why default occurs.<\/td><\/tr><tr><td>Point 2: <\/td><td>A key input into the reduced form model is the default intensity, which is the probability of<\/td><\/tr><tr><td>default over the next time period. Default intensity is estimated using option pricing models.<\/td><td><\/td><\/tr><\/table><\/div><p>Finally, Lowenstadt also discussed CCT&#x27;s application of credit analysis to asset-backed securities. Lowenstadt is aware that the client has some collateralized debt obligations in her portfolio. His overview is shown in Exhibit 3.<\/p><p><b>Exhibit 3: ABS Overview<\/b><\/p><p>Section 1 − Collateral<\/p><p>Short-term granular and homogenous structured finance vehicles are evaluated using a portfolio-based approach. Medium-term granular and homogenous obligations are evaluated using a statistical-based approach because the portfolio composition varies over time.<\/p><p>Section 2 − Servicer Quality<\/p><p>Counterparty risk. Operational risk.<\/p><p>Section 3 − Structure<\/p><p>Credit enhancement. Distribution waterfall.<\/p><\/div><\/details><div class=\"qtext\"><p>Lowenstadt&#x27;s overview of asset-backed securities in Exhibit 3 most likely contains an error in:<\/p><\/div>", "subj": "fixed"}, {"n": 49, "q": "For the currency swap that Torrey is evaluating, calculate the annual payments that will be required of International Retailers Incorporated.", "opts": ["29.1 million pesos.", "40.7 million pesos.", "56.8 million pesos."], "ans": "C", "expl": "To calculate the fixed payment in pesos, first use the Mexican term structure to derive the present value factors: Z = 1 / [1 + 0.050(360/360)] = 0.9524 360 Z = 1 / [1 + 0.052(720/360)] = 0.9058 720 The annual fixed payment per peso of notional principal would then be: FS(0,2,360) = (1 − 0.9058) / (0.9524 + 0.9058) = 0.0507 The annual fixed payment would be: 0.0507 × $100M / 0.0893 = 56.8 million pesos. For Further Reference: (Study Session 14, Module 37.8, LOS 37.c)", "explhtml": "<p>To calculate the fixed payment in pesos, first use the Mexican term structure to derive the present value factors:<\/p><div class=\"tbl\"><table><tr><td>Z<\/td><td> = 1 / [1 + 0.050(360/360)] = 0.9524<\/td><\/tr><tr><td>360<\/td><td><\/td><\/tr><tr><td>Z<\/td><td> = 1 / [1 + 0.052(720/360)] = 0.9058<\/td><\/tr><tr><td>720<\/td><td><\/td><\/tr><\/table><\/div><p>The annual fixed payment per peso of notional principal would then be:<\/p><p>FS(0,2,360) = (1 − 0.9058) / (0.9524 + 0.9058) = 0.0507<\/p><p>The annual fixed payment would be: 0.0507 × $100M / 0.0893 = 56.8 million pesos.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 37.8, LOS 37.c)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Derivatives<\/summary><div class=\"vig-body\"><p>Rock Torrey, an analyst for International Retailers Incorporated (IRI), has been asked to evaluate the firm&#x27;s swap transactions in general, as well as a 2-year fixed for fixed currency swap involving the U.S. dollar and the Mexican peso in particular. The dollar is Torrey&#x27;s domestic currency, and the exchange rate as of June 1, 2009, was $0.0893 per peso. The swap calls for annual payments and exchange of notional principal at the beginning and end of the swap term and has a notional principal of $100 million. The counterparty to the swap is GHS Bank, a large full-service bank in Mexico.<\/p><p>The current term structure of interest rates for both countries is given in the following table:<\/p><p>Time Period U.S. Interest Rates Mexican Interest Rates<\/p><div class=\"tbl\"><table><tr><td>360 days<\/td><td>4.0%<\/td><td>5.0%<\/td><\/tr><tr><td>720 days<\/td><td>4.5%<\/td><td>5.2%<\/td><\/tr><\/table><\/div><p>Torrey believes the swap will help his firm effectively mitigate its foreign currency exposure in Mexico, which stems mainly from shopping centers in high-end resorts located along the eastern coastline. Having made this conclusion, Torrey begins writing his report for the management of IRI. In the report, Torrey makes the following statements about interest rate derivative instruments:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>A payer swap can be replicated using a long receiver swaption and a short payer swaption with<\/td><\/tr><tr><td>the same exercise rates. If the exercise rate is set such that the premiums of the payer and<\/td><td><\/td><\/tr><tr><td>receiver swaptions are equal, then the exercise rate must be equal to the market swap fixed rate.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>A long callable bond can be replicated using a long option-free bond plus a short receiver<\/td><\/tr><tr><td>swaption.<\/td><td><\/td><\/tr><\/table><\/div><p>Torrey is also evaluating a 2-year European interest rate call option with a strike rate of 5% and a notional principal of $2 million. Torrey wants to use a binomial tree as shown in Exhibit 1 to value the option.<\/p><p><b>Exhibit 1: Two-Period Interest Rate Tree<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/efs/v1exam2pm-001.webp\" style=\"max-width:min(100%,673px)\" alt=\"\"><p>Six months (180 days) have passed since Torrey issued his report to IRI&#x27;s management team, and the current exchange rate is now $0.085 per peso. The new term structure of interest rates is as follows: Time Period U.S. Interest Rates Mexican Interest Rates<\/p><div class=\"tbl\"><table><tr><td>180 days<\/td><td>4.2%<\/td><td>5.0%<\/td><\/tr><tr><td>540 days<\/td><td>4.8%<\/td><td>5.2%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>For the currency swap that Torrey is evaluating, calculate the annual payments that will be required of International Retailers Incorporated.<\/p><\/div>", "subj": "derivatives"}, {"n": 50, "q": "Torrey's Statement 1 is most likely:", "opts": ["correct.", "incorrect about long receiver swaption and short payer swaption.", "incorrect about the exercise rate being equal to the market swap fixed rate if the premiums of the two swaptions are equal."], "ans": "B", "expl": "A payer swap can be replicated using a long payer swaption and short receiver swaption with the same exercise rates. Torrey's Statement 1 about how if the premiums of the two options are equal, the exercise rate must be equal to the market swap fixed rate is correct. For Further Reference: (Study Session 14, Module 38.6, LOS 38.j)", "explhtml": "<p>A payer swap can be replicated using a long payer swaption and short receiver swaption with the same exercise rates. Torrey&#x27;s Statement 1 about how if the premiums of the two options are equal, the exercise rate must be equal to the market swap fixed rate is correct.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 38.6, LOS 38.j)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rock Torrey, an analyst for International Retailers Incorporated (IRI), has been asked to evaluate the firm&#x27;s swap transactions in general, as well as a 2-year fixed for fixed currency swap involving the U.S. dollar and the Mexican peso in Rates<\/p><div class=\"tbl\"><table><tr><td>360 days<\/td><td>4.0%<\/td><td>5.0%<\/td><\/tr><tr><td>720 days<\/td><td>4.5%<\/td><td>5.2%<\/td><\/tr><\/table><\/div><p>Torrey believes the swap will help his firm effectively mitigate its foreign currency exposure in Mexico, which stems mainly from shopping centers in high-end resorts located along the eastern coastline. Having made this conclusion, Torrey begins writing his report for the management of IRI. In the report, Torrey makes the following statements about interest rate derivative instruments:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>A payer swap can be replicated using a long receiver swaption and a short payer swaption with<\/td><\/tr><tr><td>the same exercise rates. If the exercise rate is set such that the premiums of the payer and<\/td><td><\/td><\/tr><tr><td>receiver swaptions are equal, then the exercise rate must be equal to the market swap fixed rate.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>A long callable bond can be replicated using a long option-free bond plus a short receiver<\/td><\/tr><tr><td>swaption.<\/td><td><\/td><\/tr><\/table><\/div><p>Torrey is also evaluating a 2-year European interest rate call option with a strike rate of 5% and a notional principal of $2 million. Torrey wants to use a binomial tree as shown in Exhibit 1 to value the option.<\/p><p><b>Exhibit 1: Two-Period Interest Rate Tree<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/efs/v1exam2pm-001.webp\" style=\"max-width:min(100%,673px)\" alt=\"\"><p>Six months (180 days) have passed since Torrey issued his report to IRI&#x27;s management team, and the current exchange rate is now $0.085 per peso. The new term structure of interest rates is as follows: Time Period U.S. Interest Rates Mexican Interest Rates<\/p><div class=\"tbl\"><table><tr><td>180 days<\/td><td>4.2%<\/td><td>5.0%<\/td><\/tr><tr><td>540 days<\/td><td>4.8%<\/td><td>5.2%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Torrey&#x27;s Statement 2 is most likely:<\/p><\/div>", "subj": "derivatives"}, {"n": 52, "q": "The value of the 2-year interest rate call option is closest to:", "opts": ["$7,717.", "$15,434.", "$18,415."], "ans": "B", "expl": "Given the exercise rate of 5%, the call option has a positive payoff for nodes C++ and C+–. The value of the option at node C++ can be calculated as: [Max (0, 0.083 − 0.05)] × $ 2,000,000 = $ 66,000 Similarly, the value at node C+– can be calculated as: [Max (0, 0.0504 − 0.05)] × $ 2,000,000 = $ 800 Value at node C+ = [(0.5 × 66,000) + (0.5 × 800)] / (1.0531) = $31,716 Value at node C– = [(0.5 × 800) + 0] / (1.0322) = $388 And the value at node C = [(0.5 × 31,716) + (0.5 × 388)] / (1.04) = $15,435 For Further Reference: (Study Session 14, Module 38.5, LOS 38.d)", "explhtml": "<p>Given the exercise rate of 5%, the call option has a positive payoff for nodes C++ and C+–.<\/p><p>The value of the option at node C++ can be calculated as:<\/p><p>[Max (0, 0.083 − 0.05)] × $ 2,000,000 = $ 66,000<\/p><p>Similarly, the value at node C+– can be calculated as:<\/p><p>[Max (0, 0.0504 − 0.05)] × $ 2,000,000 = $ 800<\/p><p>Value at node C+ = [(0.5 × 66,000) + (0.5 × 800)] / (1.0531) = $31,716<\/p><p>Value at node C– = [(0.5 × 800) + 0] / (1.0322) = $388<\/p><p>And the value at node C = [(0.5 × 31,716) + (0.5 × 388)] / (1.04) = $15,435<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 38.5, LOS 38.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rock Torrey, an analyst for International Retailers Incorporated (IRI), has been asked to evaluate the firm&#x27;s swap transactions in general, as well as a 2-year fixed for fixed currency swap involving the U.S. dollar and the Mexican peso in particular. The dollar is Torrey&#x27;s domestic currency, and the exchange rate as of June 1, 2009, was $0.0893 per peso. The swap calls for annual payments and exchange of notional principal at the beginning and end of the swap term and has a notional principal of $100 million. The counterparty to the swap is GHS Bank, a large full-service bank in Mexico.<\/p><p>The current term structure of interest rates for both countries is given in the following table:<\/p><p>Time Period U.S. Interest Rates Mexican Interest Rates<\/p><div class=\"tbl\"><table><tr><td>360 days<\/td><td>4.0%<\/td><td>5.0%<\/td><\/tr><tr><td>720 days<\/td><td>4.5%<\/td><td>5.2%<\/td><\/tr><\/table><\/div><p>Torrey believes the swap will help his firm effectively mitigate its foreign currency exposure in Mexico, which stems mainly from shopping centers in high-end resorts located along the eastern coastline. Having made this conclusion, Torrey begins writing his report for the management of IRI. In the report, Torrey makes the following statements about interest rate derivative instruments:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>A payer swap can be replicated using a long receiver swaption and a short payer swaption with<\/td><\/tr><tr><td>the same exercise rates. If the exercise rate is set such that the premiums of the payer and<\/td><td><\/td><\/tr><tr><td>receiver swaptions are equal, then the exercise rate must be equal to the market swap fixed rate.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>A long callable bond can be replicated using a long option-free bond plus a short receiver<\/td><\/tr><tr><td>swaption.<\/td><td><\/td><\/tr><\/table><\/div><p>Torrey is also evaluating a 2-year European interest rate call option with a strike rate of 5% and a notional principal of $2 million. Torrey wants to use a binomial tree as shown in Exhibit 1 to value the option.<\/p><p><b>Exhibit 1: Two-Period Interest Rate Tree<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/efs/v1exam2pm-001.webp\" style=\"max-width:min(100%,673px)\" alt=\"\"><p>Six months (180 days) have passed since Torrey issued his report to IRI&#x27;s management team, and the current exchange rate is now $0.085 per peso. The new term structure of interest rates is as follows: Time Period U.S. Interest Rates Mexican Interest Rates<\/p><div class=\"tbl\"><table><tr><td>180 days<\/td><td>4.2%<\/td><td>5.0%<\/td><\/tr><tr><td>540 days<\/td><td>4.8%<\/td><td>5.2%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The value of the 2-year interest rate call option is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 53, "q": "Calculate the present value of the dollar fixed payments for the 2-year currency swap six months after Torrey's initial analysis.", "opts": ["$93.28 million.", "$101.69 million.", "$108.80 million."], "ans": "B", "expl": "The fixed dollar payment under the swap using the original yield curve is computed as: Z = 1 / [1 + 0.040(360 / 360)] = 0.9615 Z = 1 / [1 + 0.045(720 / 360)] = 0.9174 The annual fixed payment per dollar of notional principal would then be: FS(0,2,360) = (1 − 0.9174) / (0.9615 + 0.9174) = 0.044 The annual fixed payment would be: 0.044 × $100M = $4.4 million Using the new U.S. term structure to derive the present value factors: Z (360) = 1 / [1 + 0.042(180 / 360)] = 0.9794 180 Z (720) = 1 / [1 + 0.048(540 / 360)] = 0.9328 180 The present value of the fixed payments plus the $100M principal is: $4.4M × (0.9794 + 0.9328) + $100M × 0.9328 = $101.69 million For Further Reference: (Study Session 14, Module 37.8, LOS 37.d)", "explhtml": "<p>The fixed dollar payment under the swap using the original yield curve is computed as:<\/p><div class=\"tbl\"><table><tr><td>Z<\/td><td> = 1 / [1 + 0.040(360 / 360)] = 0.9615<\/td><\/tr><tr><td>Z<\/td><td> = 1 / [1 + 0.045(720 / 360)] = 0.9174<\/td><\/tr><\/table><\/div><p>The annual fixed payment per dollar of notional principal would then be:<\/p><p>FS(0,2,360) = (1 − 0.9174) / (0.9615 + 0.9174) = 0.044<\/p><p>The annual fixed payment would be:<\/p><p>0.044 × $100M = $4.4 million<\/p><p>Using the new U.S. term structure to derive the present value factors:<\/p><div class=\"tbl\"><table><tr><td>Z<\/td><td>(360) = 1 / [1 + 0.042(180 / 360)] = 0.9794<\/td><\/tr><tr><td>180<\/td><td><\/td><\/tr><tr><td>Z<\/td><td>(720) = 1 / [1 + 0.048(540 / 360)] = 0.9328<\/td><\/tr><tr><td>180<\/td><td><\/td><\/tr><\/table><\/div><p>The present value of the fixed payments plus the $100M principal is:<\/p><p>$4.4M × (0.9794 + 0.9328) + $100M × 0.9328 = $101.69 million<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 37.8, LOS 37.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rock Torrey, an analyst for International Retailers Incorporated (IRI), has been asked to evaluate the firm&#x27;s swap transactions in general, as well as a 2-year fixed for fixed currency swap involving the U.S. dollar and the Mexican peso in particular. The dollar is Torrey&#x27;s domestic currency, and the exchange rate as of June 1, 2009, was $0.0893 per peso. The swap calls for annual payments and exchange of notional principal at the beginning and end of the swap term and has a notional principal of $100 million. The counterparty to the swap is GHS Bank, a large full-service bank in Mexico.<\/p><p>The current term structure of interest rates for both countries is given in the following table:<\/p><p>Time Period U.S. Interest Rates Mexican Interest Rates<\/p><div class=\"tbl\"><table><tr><td>360 days<\/td><td>4.0%<\/td><td>5.0%<\/td><\/tr><tr><td>720 days<\/td><td>4.5%<\/td><td>5.2%<\/td><\/tr><\/table><\/div><p>Torrey believes the swap will help his firm effectively mitigate its foreign currency exposure in Mexico, which stems mainly from shopping centers in high-end resorts located along the eastern coastline. Having made this conclusion, Torrey begins writing his report for the management of IRI. In the report, Torrey makes the following statements about interest rate derivative instruments:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>A payer swap can be replicated using a long receiver swaption and a short payer swaption with<\/td><\/tr><tr><td>the same exercise rates. If the exercise rate is set such that the premiums of the payer and<\/td><td><\/td><\/tr><tr><td>receiver swaptions are equal, then the exercise rate must be equal to the market swap fixed rate.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>A long callable bond can be replicated using a long option-free bond plus a short receiver<\/td><\/tr><tr><td>swaption.<\/td><td><\/td><\/tr><\/table><\/div><p>Torrey is also evaluating a 2-year European interest rate call option with a strike rate of 5% and a notional principal of $2 million. Torrey wants to use a binomial tree as shown in Exhibit 1 to value the option.<\/p><p><b>Exhibit 1: Two-Period Interest Rate Tree<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/efs/v1exam2pm-001.webp\" style=\"max-width:min(100%,673px)\" alt=\"\"><p>Six months (180 days) have passed since Torrey issued his report to IRI&#x27;s management team, and the current exchange rate is now $0.085 per peso. The new term structure of interest rates is as follows: Time Period U.S. Interest Rates Mexican Interest Rates<\/p><div class=\"tbl\"><table><tr><td>180 days<\/td><td>4.2%<\/td><td>5.0%<\/td><\/tr><tr><td>540 days<\/td><td>4.8%<\/td><td>5.2%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Calculate the present value of the dollar fixed payments for the 2-year currency swap six months after Torrey&#x27;s initial analysis.<\/p><\/div>", "subj": "derivatives"}, {"n": 54, "q": "Calculate the value of the 2-year currency swap from the perspective of the counterparty paying dollars six months after Torrey's initial analysis.", "opts": ["–$0.72 million.", "–$3.21 million.", "–$4.21 million."], "ans": "C", "expl": "Use the new Mexican term structure to derive the present value factors: Z (360) = 1 / [1 + 0.050(180 / 360)] = 0.9756 180 Z (720) = 1 / [1 + 0.052(540 / 360)] = 0.9276 180 The present value of the fixed payments plus the principal is: 0.0507 × (0.9756 + 0.9276) + 0.9276 = 1.0241 per peso Apply this to notional principal and convert at current exchange rate: 1.0241 × ($100M / 0.0893) × 0.085= $97.48 million The value of the swap is the difference between this value and the pay dollar fixed present value derived in the previous question: $97.48 − $101.69M = –$4.21 million For Further Reference: (Study Session 14, Module 37.8, LOS 37.d)", "explhtml": "<p>Use the new Mexican term structure to derive the present value factors:<\/p><div class=\"tbl\"><table><tr><td>Z<\/td><td>(360) = 1 / [1 + 0.050(180 / 360)] = 0.9756<\/td><\/tr><tr><td>180<\/td><td><\/td><\/tr><tr><td>Z<\/td><td>(720) = 1 / [1 + 0.052(540 / 360)] = 0.9276<\/td><\/tr><tr><td>180<\/td><td><\/td><\/tr><\/table><\/div><p>The present value of the fixed payments plus the principal is:<\/p><p>0.0507 × (0.9756 + 0.9276) + 0.9276 = 1.0241 per peso<\/p><p>Apply this to notional principal and convert at current exchange rate:<\/p><p>1.0241 × ($100M / 0.0893) × 0.085= $97.48 million<\/p><p>The value of the swap is the difference between this value and the pay dollar fixed present value derived in the previous question:<\/p><p>$97.48 − $101.69M = –$4.21 million<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 14, Module 37.8, LOS 37.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–54 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rock Torrey, an analyst for International Retailers Incorporated (IRI), has been asked to evaluate the firm&#x27;s swap transactions in general, as well as a 2-year fixed for fixed currency swap involving the U.S. dollar and the Mexican peso in particular. The dollar is Torrey&#x27;s domestic currency, and the exchange rate as of June 1, 2009, was $0.0893 per peso. The swap calls for annual payments and exchange of notional principal at the beginning and end of the swap term and has a notional principal of $100 million. The counterparty to the swap is GHS Bank, a large full-service bank in Mexico.<\/p><p>The current term structure of interest rates for both countries is given in the following table:<\/p><p>Time Period U.S. Interest Rates Mexican Interest Rates<\/p><div class=\"tbl\"><table><tr><td>360 days<\/td><td>4.0%<\/td><td>5.0%<\/td><\/tr><tr><td>720 days<\/td><td>4.5%<\/td><td>5.2%<\/td><\/tr><\/table><\/div><p>Torrey believes the swap will help his firm effectively mitigate its foreign currency exposure in Mexico, which stems mainly from shopping centers in high-end resorts located along the eastern coastline. Having made this conclusion, Torrey begins writing his report for the management of IRI. In the report, Torrey makes the following statements about interest rate derivative instruments:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>A payer swap can be replicated using a long receiver swaption and a short payer swaption with<\/td><\/tr><tr><td>the same exercise rates. If the exercise rate is set such that the premiums of the payer and<\/td><td><\/td><\/tr><tr><td>receiver swaptions are equal, then the exercise rate must be equal to the market swap fixed rate.<\/td><td><\/td><\/tr><tr><td>Statement 2: <\/td><td>A long callable bond can be replicated using a long option-free bond plus a short receiver<\/td><\/tr><tr><td>swaption.<\/td><td><\/td><\/tr><\/table><\/div><p>Torrey is also evaluating a 2-year European interest rate call option with a strike rate of 5% and a notional principal of $2 million. Torrey wants to use a binomial tree as shown in Exhibit 1 to value the option.<\/p><p><b>Exhibit 1: Two-Period Interest Rate Tree<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/efs/v1exam2pm-001.webp\" style=\"max-width:min(100%,673px)\" alt=\"\"><p>Six months (180 days) have passed since Torrey issued his report to IRI&#x27;s management team, and the current exchange rate is now $0.085 per peso. The new term structure of interest rates is as follows: Time Period U.S. Interest Rates Mexican Interest Rates<\/p><div class=\"tbl\"><table><tr><td>180 days<\/td><td>4.2%<\/td><td>5.0%<\/td><\/tr><tr><td>540 days<\/td><td>4.8%<\/td><td>5.2%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Calculate the value of the 2-year currency swap from the perspective of the counterparty paying dollars six months after Torrey&#x27;s initial analysis.<\/p><\/div>", "subj": "derivatives"}, {"n": 55, "q": "Which of the following risk factors will most likely impact the private equity portion of the IS University Endowment?", "opts": ["Lack of diversification.", "Illiquid investments.", "Taxation risk."], "ans": "B", "expl": "The risk that the private equity portion of the IS University's Endowment Fund would most likely suffer from is illiquidity. It can be difficult to trade the private equity investments because they are usually not listed on secondary securities markets. The private equity investments are diversified in terms of vintage and strategies. The IS endowment fund is exempt from taxation on capital gains or dividends. For Further Reference: (Study Session 15, Module 41.2, LOS 41.f)", "explhtml": "<p>The risk that the private equity portion of the IS University&#x27;s Endowment Fund would most likely suffer from is illiquidity. It can be difficult to trade the private equity investments because they are usually not listed on secondary securities markets. The private equity investments are diversified in terms of vintage and strategies. The IS endowment fund is exempt from taxation on capital gains or dividends.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 15, Module 41.2, LOS 41.f)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 55–60 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Bill Henry, CFA, is the CIO of IS University Endowment Fund located in the United States. The Fund&#x27;s total assets are valued at $3.5 billion. The investment policy uses a total return approach to meet the return objective that includes a spending rate of 5%. In addition, the policy constraints established make tax-exempt instruments an inappropriate investment vehicle. The Fund&#x27;s current asset mix includes an 18% allocation to private equity. The private equity allocation is shown in Exhibit 1.<\/p><p><b>Exhibit 1: IS University Endowment Fund&#x27;s Private Equity Investments<\/b><\/p><div class=\"tbl\"><table><tr><td>Private Equity<\/td><td>Percentage Allocation<\/td><\/tr><tr><td>Venture capital<\/td><td>12%<\/td><\/tr><tr><td>Buyouts<\/td><td>56%<\/td><\/tr><tr><td>Special situations<\/td><td>32%<\/td><\/tr><\/table><\/div><p>The private equity allocation is a mixture of funds with different vintages. For example, within the venture capital category, investments have been made in five different funds. Exhibit 2 provides details about the Alpha Fund with a vintage year of 2014 and committed capital of $195 million. The distribution waterfall calls for 20% carried interest when NAV before distributions exceeds committed capital.<\/p><p><b>Exhibit 2: $195 Million Venture Capital Alpha Fund ($Millions)<\/b><\/p><div class=\"tbl\"><table><tr><td>Year<\/td><td>Called-Down Management Fees Operating Results<\/td><td><\/td><td><\/td><\/tr><tr><td>2014<\/td><td>$30<\/td><td>$0.45<\/td><td>–$10<\/td><\/tr><tr><td>2015<\/td><td>$25<\/td><td>$0.83<\/td><td>$55<\/td><\/tr><tr><td>2016<\/td><td>$75<\/td><td>$1.95<\/td><td>$75<\/td><\/tr><\/table><\/div><p>The Alpha Fund is considering a new investment in Targus Company. Targus is a start-up biotech company seeking $9 million of venture capital financing. Targus&#x27;s founders believe that, based on the company&#x27;s new drug pipeline, a company value of $300 million is reasonable in five years. Management at Alpha Fund views Targus Company as a risky investment (15% risk of failure) and is using a discount rate of 40%.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following risk factors will most likely impact the private equity portion of the IS University Endowment?<\/p><\/div>", "subj": "alternatives"}, {"n": 56, "q": "Using Exhibit 2, calculate the 2016 percentage management fee of the Alpha Fund.", "opts": ["1.5%.", "2.0%.", "2.5%."], "ans": "A", "expl": "Percentage management fee = management fee / paid-in capital paid-in capital = Σ called-down 2016 % management fee = 1.95 / (75 + 25 + 30) = 0.015 For Further Reference: (Study Session 15, Module 41.3, LOS 41.i)", "explhtml": "<p>Percentage management fee = management fee / paid-in capital<\/p><p>paid-in capital = Σ called-down<\/p><p>2016 % management fee = 1.95 / (75 + 25 + 30) = 0.015<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 15, Module 41.3, LOS 41.i)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 55–60 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Bill Henry, CFA, is the CIO of IS University Endowment Fund located in the United States. The Fund&#x27;s total assets are valued at $3.5 billion. The investment policy uses a total return approach to meet the return objective that includes a spending rate of 5%. In addition, the policy constraints established make tax-exempt instruments an inappropriate investment vehicle. The Fund&#x27;s current asset mix includes an 18% allocation to private equity. The private equity allocation is shown in Exhibit 1.<\/p><p><b>Exhibit 1: IS University Endowment Fund&#x27;s Private Equity Investments<\/b><\/p><div class=\"tbl\"><table><tr><td>Private Equity<\/td><td>Percentage Allocation<\/td><\/tr><tr><td>Venture capital<\/td><td>12%<\/td><\/tr><tr><td>Buyouts<\/td><td>56%<\/td><\/tr><tr><td>Special situations<\/td><td>32%<\/td><\/tr><\/table><\/div><p>The private equity allocation is a mixture of funds with different vintages. For example, within the venture capital category, investments have been made in five different funds. Exhibit 2 provides details about the Alpha Fund with a vintage year of 2014 and committed capital of $195 million. The distribution waterfall calls for 20% carried interest when NAV before distributions exceeds committed capital.<\/p><p><b>Exhibit 2: $195 Million Venture Capital Alpha Fund ($Millions)<\/b><\/p><div class=\"tbl\"><table><tr><td>Year<\/td><td>Called-Down Management Fees Operating Results<\/td><td><\/td><td><\/td><\/tr><tr><td>2014<\/td><td>$30<\/td><td>$0.45<\/td><td>–$10<\/td><\/tr><tr><td>2015<\/td><td>$25<\/td><td>$0.83<\/td><td>$55<\/td><\/tr><tr><td>2016<\/td><td>$75<\/td><td>$1.95<\/td><td>$75<\/td><\/tr><\/table><\/div><p>The Alpha Fund is considering a new investment in Targus Company. Targus is a start-up biotech company seeking $9 million of venture capital financing. Targus&#x27;s founders believe that, based on the company&#x27;s new drug pipeline, a company value of $300 million is reasonable in five years. Management at Alpha Fund views Targus Company as a risky investment (15% risk of failure) and is using a discount rate of 40%.<\/p><\/div><\/details><div class=\"qtext\"><p>Using Exhibit 2, calculate the 2016 percentage management fee of the Alpha Fund.<\/p><\/div>", "subj": "alternatives"}, {"n": 57, "q": "Alpha Fund's 2016 dollar amount of carried interest is closest to:", "opts": ["$0 million.", "$10 million.", "$20 million."], "ans": "B", "expl": "$195 million Alpha Fund (all data in millions) Called- Management Operating NAV before Carried NAV after Year Down Fees Results Distributions Interest Distributions Distributions 2014 30 0.45 –10 19.55 0 2015 25 0.83 55 98.72 0 2016 75 1.95 75 246.77 10.35 0 236.42 2014 NAV before distributions = 30 – 0.45 + (–10) = 19.55 2015 NAV before distributions = 19.55 + 25 − 0.83 + 55 = 98.72 2016 NAV before distributions = 98.72 + 75 − 1.95 + 75 = 246.77 When NAV before distribution exceeds committed capital, the 20% carried interest is applied. (246.77 − 195) × 0.2 = 51.77 × 0.2 = 10.35 In years 2017 and beyond, the 20% carried interest is applied to the change in NAV before distributions. For example, if the 2017 NAV before distributions was 296.77, then the carried interest would equal (296.77 − 246.77) × 0.2 = 50 × 0.2 = 10. The NAV after distributions subtracts carried interest and distributions from NAV before distributions. For Further Reference: (Study Session 15, Module 41.3, LOS 41.i)", "explhtml": "<p>$195 million Alpha Fund (all data in millions)<\/p><div class=\"tbl\"><table><tr><td>Called-<\/td><td>Management<\/td><td>Operating<\/td><td>NAV before<\/td><td>Carried<\/td><td>NAV after<\/td><td><\/td><td><\/td><\/tr><tr><td>Year<\/td><td>Down<\/td><td>Fees<\/td><td>Results<\/td><td>Distributions<\/td><td>Interest<\/td><td>Distributions<\/td><td>Distributions<\/td><\/tr><tr><td>2014<\/td><td>30<\/td><td>0.45<\/td><td>–10<\/td><td>19.55<\/td><td>0<\/td><td><\/td><td><\/td><\/tr><tr><td>2015<\/td><td>25<\/td><td>0.83<\/td><td>55<\/td><td>98.72<\/td><td>0<\/td><td><\/td><td><\/td><\/tr><tr><td>2016<\/td><td>75<\/td><td>1.95<\/td><td>75<\/td><td>246.77<\/td><td>10.35<\/td><td>0<\/td><td>236.42<\/td><\/tr><tr><td>2014 NAV before distributions = 30 – 0.45 + (–10) = 19.55<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>2015 NAV before distributions = 19.55 + 25 − 0.83 + 55 = 98.72<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>2016 NAV before distributions = 98.72 + 75 − 1.95 + 75 = 246.77<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>When NAV before distribution exceeds committed capital, the 20
