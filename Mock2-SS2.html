<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

ity and correlations with other investments.\nchallenging; as with hedge funds, which will be discussed later, private equity return indexes typically rely on self-\nreturns. Moreover, prior to the global financial crisis of 2008-2009, in the absence of a liquidity event, private equity\ninvestments due to inherent illiquidity will understate measures of volatility and correlations with other investments.", "qhtml": null}, {"n": 7, "q": "For an institutional investor, the investment committee's approach to appointing\nand reviewing investment managers for the portfolio is most likely set out during the:", "opts": ["portfolio construction process.", "strategic asset allocation decision.", "preparation of the investment policy statement."], "ans": "C", "expl": "B. Incorrect because only once the IPS has been compiled, the investment manager can construct a suitable portfolio.\nallocation is stated in terms of percent allocations to asset classes.The process of formulating a strategic asset\nallocation is based on the IPS and capital market expectations.\nC. Correct because in the case of an institution, such as a pension plan or university endowment, the IPS may set out\ninvestment committee's approach to appointing and reviewing investment managers for the portfolio, and the\ndiscretion that those managers have.\nBasics of Portfolio Planning and Construction\n· describe the reasons for a written investment policy statement (IPS)", "qhtml": null}, {"n": 8, "q": "Financial forecasting using historical base rates and convergence is best suited for\ncompanies that are:", "opts": ["in highly cyclical industries.", "in well-established industries.", "industry leaders by a wide margin."], "ans": "B", "expl": "A. Incorrect because this approach is less appropriate for companies in changing or new industries for which\ncalculating a base rate is difficult or less relevant, for companies in highly cyclical industries for which a longer-term\nB. Correct because historical base rates and convergence may be appropriate for forecasting companies in well-\nretailers, especially when the analyst's industry analysis does not call for material changes in industry structure or\nexternal industry influences.\nleaders by a wide margin and account for a substantial proportion of any industry base rate.\nCompanyAnalysis:Forecasting\n· explain principles and approaches to forecasting a company's financial results and position\nQuestion 8 of 90 ①\nFilter", "qhtml": null}, {"n": 9, "q": "An analyst will most likely put a \"sell\" recommendation on a stock when its:", "opts": ["intrinsic value is positive.", "market value is higher than intrinsic value.", "market value is lower than fundamental value."], "ans": "B", "expl": "A. Incorrect because positive intrinsic value would not warrant a “sell\" recommendation on a stock. An analyst must\ncompare its market value to intrinsic value.\nB. Correct because intrinsic value is the true value so an analyst will put a “sell\" recommendation on a stock when its\nmarket value, the price at which a stock is traded, is higher than intrinsic value.\nC. Incorrect because if a stock's market value is lower than its fundamental (intrinsic) value, a stock is undervalued,\nso an analyst will put a \"buy\" not a “sell\" recommendation on it.\nMarket Efficiency\ncontrast market value and intrinsic value\nDiscuss ①\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 10, "q": "Which of the following is most accurate regarding arbitrage in financial\nmarkets? Arbitrage traders:", "opts": ["rely primarily on fundamental valuation to identify arbitrage opportunities.", "earn returns in excess of those that would be fair compensation for the risk assumed.", "actively take advantage of profit opportunities in spot commodity markets when both storage and selling short become difficult."], "ans": "B", "expl": "A. Incorrect because arbitrage does not tell us the true fundamental value. Arbitrageur he\naccrued interest portion of the full price does not depend on the yield-to-maturity. Therefore, it is only the flat price\nthat is affected by a change in interest rates.\nC. Incorrect because the flat price of the bond is a little below par value, even though the coupon rate and the yield-to-\nmaturity are equal, because the accrued interest does not take into account the time value of money.\nFixed-lncome Bond Valuation: Prices and Yields\nI calculate a bond's price given a yield-to-maturity on or between coupon dates", "qhtml": null}, {"n": 13, "q": "Compared with public equity markets, which of the following statements is most\naccurate about private equity markets? Operating in the private market:", "opts": ["allows more opportunities to raise capital.", "allows management to better adopt a long-term focus.", "offers stronger incentives to improve corporate governance."], "ans": "B", "expl": "A. Incorrect because public equity markets are much larger than private ones.\nB. Correct because the management of a public firm is under pressures to meet shorter-term demands, such as\nmeeting quarterly sales and earnings projections from analysts. Private owners are thus better able to focus on\nlonger-term value creation opportunities.\nOverview of Equity Securities\ncompare and contrast public and private equity securities\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 14, "q": "Which of the following is used by clearinghouses to determine the gain and loss\nto the parties of a futures contract?", "opts": ["Limit up and limit down", "Margin call", "Daily settlement"], "ans": "C", "expl": "A. Incorrect because some futures contracts contain a provision limiting price changes. These rules, called price\nlimits, establish a band relative to the previous day's settlement price, within which all trades must occur. If market\nthe lower band, which is called limit down, no trade can take place until two parties agree to trade at a price above\nthe lower limit. Therefore, limit up and limit down refer to price limits but not to the practice that determines current\ngain and loss positions of futures contract parties.\nB. Incorrect because if the futures price decreases, the long loses money and is charged with that loss, and the\nmoney is transferred to the account of the short. The account is specifically referred to as a margin account. A\nbeen established through the daily settlement or mark to market practice.\nand the arrival of new information to the market. Thus, as the futures price changes, the parties make and lose\nmoney. Rising (falling) prices, of course, benefit (hurt) the long and hurt (benefit) the short. At the end of each day,\nthe clearinghouse engages in a practice called mark to market, also known as the daily settlement.\nForward Commitment and Contingent Claim Features and Instruments\n· define forward contracts, futures contracts, swaps, options (calls and puts), and credit derivatives and compare their\nbasic characteristics", "qhtml": null}, {"n": 15, "q": "Which of the following asset-backed securities most likely utilizes credit\ntranching as a form of credit enhancement?", "opts": ["Covered bond", "Credit card backed security", "Agency mortgage pass-through security"], "ans": "B", "expl": "A. Incorrect because covered bonds usually consist of one bond class per cover pool.\nB. Correct because credit card ABS typically combine various sources of credit enhancements to support the various\ntranches. ABS structures normally provide credit enhancements through subordination.\nor a GSE and therefore does not need credit enhancement. Agency RMBS include securities issued by\nGSEs. RMBS issued by GSEs do not carry the full faith and credit of the government, but rather the GSEs\nguarantee of the timely payment of interest and principal for the securities. The GSE's charge a fee for this\nguarantee.\nAsset-Backed Security (ABS) Instrument and Market Features\n· describe types and characteristics of non-mortgage asset-backed securities, including the cash flows and risks of\neach type\nDiscuss ①\nFilter", "qhtml": null}, {"n": 16, "q": "In an efficient market, it is more likely that fundamental value will be reflected\nin the:", "opts": ["underlying spot market before the derivative market.", "derivatives market before the underlying spot market.", "derivatives market and the underlying spot market at the same time."], "ans": "B", "expl": "A. Incorrect because in an efficient market, the derivatives market (not the underlying spot market) is more likely to\nreflect fundamental value because derivatives contracts require less capital, have lower transaction costs, and are\neasier to sell short.\nB. Correct because in an efficient market, the derivatives market is more likely to reflect fundamental value, even if\nonly for a short period, before the underlying spot market because derivatives contracts require less capital, have\nlower transaction costs, and are easier to sell short.\nC. Incorrect because in an efficient market, the derivatives market is more likely to reflect fundamental value before\nthe underlying spot market because derivatives contracts require less capital, have lower transaction costs, and\nare easier to sell short.\nDerivative Benefits, Risks, and Issuer and Investor Uses\ndescribe benefits and risks of derivative instruments\nDiscuss\nFilter\ni\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 17, "q": "A benefit of risk budgeting is that it:", "opts": ["forces risk trade-offs.", "provides risk oversight.", "defines an organization's risk tolerance."], "ans": null, "expl": "supports a culture in which risk is considered as a part of all key decisions.\nB. Incorrect because it refers to risk governance, not risk budgeting. Good risk governance should include defining an\norganization's risk tolerance and providing risk oversight. Risk budgeting picks up where risk tolerance leaves off.\nWhereas risk tolerance focuses on the appetite for risk and what is and is not acceptable, risk budgeting has a\nmore specific focus on how that risk is taken.\norganization's risk tolerance and providing risk oversight. Risk budgeting picks up where risk tolerance leaves off.\nWhereas risk tolerance focuses on the appetite for risk and what is and is not acceptable, risk budgeting has a\nmore specific focus on how that risk is taken.\nIntroduction to Risk Management\ndescribe risk budgeting and its role in risk governance\nDiscuss\nFilter\nDiscussion", "qhtml": null}, {"n": 18, "q": "Compared with unregulated markets, regulated markets are best characterized\nby:", "opts": ["higher transaction costs.", "lower trading volumes.", "reduced arbitrage opportunities."], "ans": "C", "expl": "A. Incorrect because regulated markets tend to be more operationally efficient, which leads to lower transactions\ncosts.\nB. Incorrect because regulations help to level the playing field for market participants. When participants believe that\nmarkets are fair, they continue to trade in the market, thus increasing trading volumes.\nC. Correct because regulated markets are more informationally efficient, there are fewer arbitrage opportunities.\nMarket Organization and Structure\n1 describe objectives of market regulation\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 19, "q": "All else being equal, a cash dividend most likely has the same effect on\nshareholders' wealth as a:", "opts": ["stock split.", "stock dividend.", "share repurchase."], "ans": "C", "expl": "A. Incorrect because stock splits and reverse stock splits are similar to stock (not cash) dividends in that they have no\neconomic effect on the company or shareholders. A stock split involves an increase in the number of shares\noutstanding with a consequent decrease in share price.\nB. Incorrect because stock splits and reverse stock splits are similar to stock (not cash) dividends in that they have no\neconomic effect on the company or shareholders. A stock dividend involves an increase in the number of shares\noutstanding with a consequent decrease in share price.\nC. Correct because a share repurchase is viewed as equivalent to the payment of cash dividends of equal value in\nterms of the effect on shareholders' wealth, all other things being equal.\nEquity Valuation: Concepts and Basic Tools\ndescribe regular cash dividends, extra dividends, stock dividends, stock splits, reverse stock splits, and share\nrepurchases\nDiscuss ①\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 20, "q": "The value of a swap contract at initiation is most likely equal to:", "opts": ["zero.", "the present value of the fixed payments of the swap.", "average price of a series of forward contracts with each forward contract maturing at each swap payment date."], "ans": "A", "expl": "A. Correct because forwards, futures, and swaps start off with values of zero and swap price is the fixed price or rate\nB. Incorrect because the forward, futures, or swap price is a concept that represents the fixed price or rate at which\nthe underlying will be purchased at a later date. The value of a swap includes all payments, fixed and floating - not\njust fixed payments.\nC. Incorrect because the value and price of a swap are not at all comparable with each other. The above number is a\nprice figure and hence not at all comparable with the value of a swap.\nPricing and Valuation of Interest Rates and Other Swaps\ncontrast the value and price of swaps\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 21, "q": "Which of the following is best categorized as a hard commodity?", "opts": ["Cattle", "Lumber", "Crude oil"], "ans": "C", "expl": "A. Incorrect because commodities are considered either 'hard' (those mined, such as copper, or extracted, such as\noil) or 'soft' (those gro f forward contracts and for an underlying with varying maturities\nexplain how the value and price of a forward contract are determined at initiation, during the life of the contract, and\nat expiration\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss...(required)", "qhtml": null}, {"n": 33, "q": "An example of nonsystematic risk is a(n):", "opts": ["failure of a drug trial.", "increase in the overall rate of inflation.", "change in the central bank's interest rate policy."], "ans": "A", "expl": "A. Correct because nonsystematic risk is risk that is local or limited to a particular asset or industry that need not\naffect assets outside of that asset class. Examples of nonsystematic risk could include the failure of a drug trial,\nmajor oil discoveries, or an airliner crash. All these events will directly affect their respective companies and\npossibly industries, but have no effect on assets that are far removed from these industries. A change in the\nindustry.\nB. Incorrect because a change in the inflation rate is a systematic risk as it cannot be avoided. An increase in inflation\nwill affect the market as a whole and not just a particular industry.\nC. Incorrect because a change in interest rates by the central bank is a systematic risk. Interest rate risk is non-\ndiversifiable because it includes risk factors that are innate within the market and affect the market as a whole.\nPortfolio Risk and Return: Part Il\nexplain systematic and nonsystematic risk, including why an investor should not expect to receive additional return\nfor bearing nonsystematic risk\nDiscuss ①\nFilter", "qhtml": null}, {"n": 34, "q": "Which of the following alternative investment categories most likely provides\nexposure to capital-intensive, long-lived assets that provide essential public services?", "opts": ["Infrastructure", "Venture capital", "Commercial real estate"], "ans": "A", "expl": "A. Correct because infrastructure is a special type of real asset that typically involves land, buildings and other long-\nlived fixed assets that are intended for public use and provide essential services. Also, infrastructure consists of\nassets that are capital intensive and long lived and that are intended to provide essential services for public use.\nB. Incorrect because venture capital is a specialized form of private equity whereby ownership capital is used for non-\noperation or customer base.\nC. Incorrect because commercial real estate includes land and buildings where private business activity is the primary\ncash flow source. Although commercial real estate assets are long-lived, real assets, they typically do not provide\nessentialservices.\nReal Estate Infrastructure\nexplain the investment characteristics of infrastructure investments\nDiscuss\nFilter\nDiscussion", "qhtml": null}, {"n": 35, "q": "Stock 1's weighting in the index is closest to:", "opts": ["20.4%.", "25.0%.", "28.5%."], "ans": "C", "expl": "A. Incorrect because it is the price-weighted weight:\nPrice weight = price / sum of all prices in index\n= 42 / (42 + 69 + 95) = 42 / 206 = ~ 0.204 = 20.4%.\nB. Incorrect because it fails to take into account the float-adjustment:\nMarket-cap weight = market cap / sum of all market caps in index\n= 42 × 8,500 / (42 × 8,500 + 69 × 10,000 + 95 × 4000)\n=357,000 / (357,000 + 690,000 + 380,000) = 357,000 / 1,427,000 ~0.25 = 25.0%.\nC. Correct because Stock 1's float-adjusted market-capitalization weighting is calculated:\nQuestion 35 of 90\nQ. Stock 1's weighting in the index is closest to:\nA. 20.4%.\nB.25.0%.\nC. 28.5%.\nSolution\nA. Incorrect because it is the price-weighted weight:\nPrice weight = price / sum of all prices in index\n= 42 / (42 + 69 + 95) = 42 / 206 = ~ 0.204 = 20.4%.\nB. Incorrect because it fails to take into account the float-adjustment:\nMarket-cap weight = market cap / sum of all market caps in index\n= 42 × 8,500 / (42 × 8,500 + 69 × 10,000 + 95 × 4000)\n=357,000 / (357,000 + 690,000 + 380,000) = 357,000 / 1,427,000 ~0.25 = 25.0%.\nC. Correct because Stock 1's float-adjusted market-capitalization weighting is calculated:\n= Float-adjusted market capitalization / sum of all float-adjusted market caps in index\n= 42 × 8,500 × 100% / (42 x 8,500 × 100% + 69 x 10,000 × 75% + 95 × 4000 x 100%)\n=357,000 / (357,000 + 517,500+ 380,000) = 357,000 / 1,254,500 ~ 0.285 = 28.5%.\nSecurity Market Indexes\ncalculate and analyze the value and return of an index given its weighting method", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6wAAAE3CAIAAAAhZ1u6AACl+klEQVR42uzddVwU2/s48DObsLvE0iEgEiq2Igh6rbuEiN1iYXfrtRO7FbsLbEwsbFFUQEAECelcGhbYnt8f53vnt3cJMe69Xj/P+w9ey+7s7MyZeuac55whSJJEAAAAAAAA/C+hQREAAAAAAAAIgn86FRUVqampsKkAAAAAAMD/UBBcXV0tFAphUwEAAAAAAEiHAAAAAAAAAIJgAAAAAAAAIAgGAAAAAAAAgmAAAAAAAAD+ziB49OjRW7du/XnWUyaTwcYGAAAAAAAY42+ab0RERERExLBhw6ysrP7F1cvMzExNTf306VNVVZWNjU3Xrl11dHT+lSUpKChITU2Vy+VaWlqtWrX6+35IKpWyWKy/dV0kEkleXh4et6579+51TVZcXMzn8wmCqPkRSZISiURDQwOOQAAAAAD8UkEwfhBdv3793N3d/5Uq4fz8/PXr1z9+/Fj1kXgEQZiaml6+fFlPT+/vXoCtW7e+fv0aIbRixYoOHTqEhITs2LGjsrKyWbNmQUFB6O+pfY+OjpbJZARBaGhojBw5cty4cQYGBiUlJevXr3/27Jna9BMmTJg+ffo3BNldunQRiUQIISaTGRMTU3OaXr165efnV1dXEwShra198ODBtm3b4mj42bNne/bsSU5OlslkTCbTzs5uy5Yttra2cCgCAAAAAP0yOcESiSQ4OLiiouKfX7E1a9aoRcA4NM/JyfH396+srPy7FwDXQH/69KmwsBD9I/ke4eHhOOuDJMnq6uozZ85cu3YNIVRWVlZYWFhVg1Qq/YYfEolEOAKuS2BgYFpaWnV1NV6SsrIyPz+/jIwM/OmWLVvi4+Pxcspksri4uDlz5sBxCAAAAAD0a9QEUxQKhZOTU79+/TZv3vyPrVVERMTTp08RQsbGxqNHj54wYQJCKD8/38PDQyKRBAYGJiYmnjt3TqlU5ubmIoSMjIyYTCZCqKSkpKqqCiGkra2tpaWF55adnV1WViaRSPh8vqWlJY32/+8clEplZmZmXl4eSZJ8Pt/MzAx/q6KigspCFolElZWVAwYM6NatG0mSarkKmZmZWVlZCoXC3NxcT0+PytYQCoVyuZzJZOro6OAFYDKZ+Cdqvdnw8PBACI0ePXratGkhISF+fn5SqXTXrl2TJ0/OyMjAq+nt7d2tWzfqWw4ODvXcvaSmppaXlzMYDC0tLTs7O/x+aWlpQUEBfn3r1i0DAwO1L/r5+QUGBuKSDwoKOnjw4KVLl+Li4kaOHBkaGhoVFYWTKEaNGjV27Nht27Y9ePAgJSUlLS2tcePGcDQCAAAA4NcJgrEbN24oFIqZM2f+AynCOPjDr48ePUoFcMbGxqdPnx4zZoxUKo2IiJDJZKWlpQKBACF04sQJFxcXhND8+fPDwsIQQsOHD1+9enVsbOzevXtfvHhBzV  adjustment, mental accounting, framing, and availability.\nThe Behavioral Biases of Individuals\nDiscuss\nFilter", "qhtml": null}, {"n": 38, "q": "A sell order is behind the market at a price of:", "opts": ["€47.70.", "€48.00.", "€48.20."], "ans": "C", "expl": "A. Incorrect because a sell order at 47.70 would not be described as behind the market. Instead it would be the best\noffer at the market. A buy order at 47.70 would be described as behind the market.\nB. Incorrect because the lowest ask in the market is the best offer. A sell order at 48.00 would be the best offer (ask)\nat the market, not behind the market.\nC. Correct because a buy order placed below the best bid is behind the market. Similarly, a sell order that is above\nthe best offer (ask) is said to be behind the market. So any sell order higher than 48.o0 is behind the market.\nMarket Organization and Structure\ncompare market orders with limit orders", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6wAAAE4CAIAAADQMelvAABSr0lEQVR42u3dZ0AU5/o28Ht22V2aFKkiCGJFFCtWoiZiFwtRVPSoEDWJoiZHjbEcYyyJGo1RsCa22Cv2gsaOqFgwgoqIdOksdWF32Zn3w/PPvHtoao4lMdfvEzs7Ozvz7A57zTP3PMMJgkAAAAAAAP8kEjQBAAAAACAEAwAAAAAgBL9rgiDwPI+PCgAAAAD+QSE4Ozs7MjISHxUAAAAAoBwCAAAAAAAhGAAAAAAAIRgAAAAAACEYAAAAAAAhGAAAAAD+kQze0HLbtGmjUCgiIiLe7eZdu3btypUr58+fV6vVrVu3njVrlpOT0ztZk4cPH168eLG0tNTBwcHf3//NvVFxcbGpqWl1z+bk5Jibm8tksv/lLYqKiqKioi5evEhE8+fPr262J0+eNGzYUCKp4kCL5/n8/HxLS0uO47ATAgAAwNvHvaHbJru5uRHRDz/80K9fvypj0MvLyspKSEjo0KEDveLowklJSYMHD1ar1eJEuVw+adKkiRMnvoXspVKptFotEZmamkql0j179vz444/FxcVNmzYNDQ19E+/4+PHj8ePHK5VKuVzu4uKydetWc3NztqU6ne6rr766c+dOZmamoaHhxIkTx4wZY2Ji8ufeaOzYsZGRkYIgyGSy33//vfIMhw8f/vXXX2NjY+Vy+QcffLBq1Soxdmu12pMnT/7444+5ubl2dnbff/+9p6fn//gNAQAAAPhrhWAicnFxOXr0qFwuf8shuF+/fgkJCexvR0dHQ0PDlJQUFog9PT3nzp3bpEmTN9qyn3/++aVLl4jop59+6t279/79+1etWsVC8IEDB1772929e3fUqFFExHH//zP19vYODg6+fPnyd999l5yc/F8fPMedPXv2T/SL5+TkfPDBB0RkYWHh6OhYYVs0Gs28efOOHz+uP9HGxmbx4sVdu3bVarVdu3bNz8/Xf7Z27drh4eHYFQEAAIDe tive, then the\nitsvaluerelative to a market.\nC. Incorrect because security selection is an attempt to generate higher returns than the asset class benchmark by\nselecting securities with a higher expected return. In other words, security selection creates alpha. But it is beta,\nand not alpha that accounts for most of the changes in a portfolio's value over the long term.\nBasics of Portfolio Planning and Construction\n· describe the principles of portfolio construction and the role of asset allocation in relation to the IPS\nDiscuss ①\nFilter", "qhtml": null}, {"n": 40, "q": "Which of the following statements is most accurate? Hedge funds:", "opts": ["may be invested entirely in traditional assets.", "typically invest in early-stage companies with high growth potential.", "typically pursue leveraged buyouts of established profitable and cash-generating companies."], "ans": "A", "expl": "A. Correct because hedge funds are private investment vehicles that may invest in public equities or publicly traded\nfixed-income assets, private capital, and/or real assets, but they are distinguished by their investment approach\ninvestment approach distinguishes the hedge fund.\nB. Incorrect because venture capital is a specialized form of private equity whereby ownership capital is used for non-\npublic companies in the early life cycle or startup phase, where often an idea or business plan exists with a limited\noperation or customer base.\nintent to take them private. In general, private equity is used in the mature life cycle stage or for firms in decline,\nwith leveraged buyouts being a key approach.\nHedgeFunds\n· describe investment forms and vehicles used in hedge fund investments", "qhtml": null}, {"n": 41, "q": "Which company has the lowest price-to-book value per share?", "opts": ["Company 1", "Company 2", "Company 3"], "ans": "A", "expl": "A. Correct because price to book value per share (P/B) = Market price per share / (Book value of shareholders'\nequity / shares outstanding). In Company 1's case, P/B = $34 / ($452 / 45) = 34 / 10.044 = 3.385.\nB. Incorrect because Company 2's P/B = $12 / ($302 / 105) ~ 12 / 2.876 = 4.172, which is higher than Company 1's\nP/B of 3.385. However, a candidate might select this if they incorrectly select Company 2 based on fact it has the\nlowest book value / share (2.876).\nC. Incorrect because Company 3's P/B = $56 / ($98 / 12) = 56 / 8.1667 = 6.857, which is higher than Company 1's\nP/B of 3.385. However, a candidate might select this based on the fact that it has the lowest book value of\nshareholders' equity ($98 million).\nEquity Valuation: Concepts and Basic Tools\ncalculate and interpret the following multiples: price to earnings, price to an estimate of operating cash flow, price to", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6wAAAEzCAIAAAC69hmsAAEAAElEQVR42uz9d5wUVfb/j1fnnKZ7coIZwhAHhpxzBsmooEhGFBOLuoY1KyquuKCuiglBECWpYECCgGSQNDADw+ScOsfqru7fH6+v99fvGXTd/YDr6nn+MY+ZnuqqW7fuvfW6555zrsjr9XIEQRAEQRAE8WdCFAwGqRYIgiAIgiCIP5cIDofDVAsEQRAEQRDEn0sERyIRqgWCIAiCIAjiT4WURDBBEARBEATBkSX4dwLP83K5PBAIKBQK/E5PiyAIgiAIgrguiH+/8lwk+v+XUiymR0UQBEEQBEH8WUSwSCQSBEEQBHpUBEEQBEEQxB9fBMP6K5PJbDZbQ0MDPSqCIAiCIAjieiHlfveWYL/f73a76VERBEEQBEEQ3O/TEuz3+3me5zgOP6OTEP+7CYlFIlE4HA4Gg3K53Gq1/rslCYVCwWDwmn4U/5XUyJFIJBwON7n0/1Zqjsj/BfeC3//lwf/WfwmCIAiCILj/LUuwUqmMRCKCIIhEokgkwoLboJl+y/g2qVSK64ZCoVAoJBaLxWKxRCIRiUS/cZhdKBSCzhOJRBKJJLpaooP//idEMDPPMwUfDAbD4bBMJpNIJNSdCIIgCIL487pDQGVKJBK/369UKqNF8G95Y+FwWCQSiUQiqVTKBDHU+W8s13B1ViqxWBwOhyORiFgs/t8SwSg8m0Kg8JS6jiAIgiAIjtwhOI6D0OQ4TqlUQu0hyi1aC/42cXVNJCYEsVgs9vv9v2VJol0yoIAxSYCV+n+orcCOznwYoquXNt8mCIIgCIL7M1uC/X6/RCKRSCRFRUVqtdpisTAx+t/K9SsIgt/vj0QiKpXqv7Jkzy7apCT/c5ZglJZ5NguCEIlEYOynRM4EQRAEQZBPcCQYDI4fP14QhPfee69///5Op1Mul8Mw/BuoJY/Ho9FoOI5zu91PPPFEbm5ubW1tKBRq27ZtWlraXXfdlZGRwf3krSuVSl0ul06n4/5vpBqTpx6PRyqVymQyiL9rrv7jvphxVBAEJnw9Hg8cMI4ePbp69Wqe51NSUl5//fVgMCgSiQKBAIoaLdmZJ4nH41EqlcyNGKVldQgrMuzrXq9XpVKxYr/33nsul0uv10+dOlUsFuPus ept investments with relatively low expected returns.\nLiquidity is of less concern to life insurance companies given the greater predictability of life insurance payouts.\nan insurer's surplus account is the difference between its assets and liabilities. An insurer's surplus account\nsuch as public and private equities, real estate, infrastructure, and hedge funds.\nPortfolio Management: An Overview\n· describe types of investors and distinctive characteristics and needs of each", "qhtml": null}, {"n": 43, "q": "A Eurodollar bond is:", "opts": ["denominated in USD.", "sold to US investors at issuance.", "underwritten by a syndicate of US-based banks."], "ans": "A", "expl": "A. Correct because Eurodollar bonds are denominated in US dollars.\nB. Incorrect because Eurobonds denominated in US dollars cannot be sold to Us investors at the time of issue\nbecause they are not registered with the US Securities and Exchange Commission (SEC).\nC. Incorrect because Eurobonds are issued outside the jurisdiction of any single country. They are underwritten by an\ninternational syndicate——that is, a group of financial institutions from different jurisdictions——and mostly sold to\ninvestors in\nEurope, the Middle East, and Asia.\nFixed-lncome Cash Flows and Types\ndescribe how legal, regulatory, and tax considerations affect the issuance and trading of fixed-income securities\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 44, "q": "Which of the following statements about market efficiency is most accurate? In\na:", "opts": ["weak-form efficient market, technical analysis generates abnormal returns over the long run.", "semi-strong-form efficient market, active portfolio managers outperform the market on a consistent basis.", "strong-form efficient market, insiders would not be able to earn abnormal returns from trading on private information"], "ans": "C", "expl": "A. Incorrect because securities markets are weak-form efficient, and therefore, investors cannot earn abnormal\nreturns by trading on the basis of past trends in price (using technical analysis).\nB. Incorrect because if securities markets are weak-form and semi-strong-form efficient, the implication is that active\ntrading, whether attempting to exploit price patterns or public information, is not likely to generate abnormal\nreturns. In other words, active portfolio managers cannot beat the market on a consistent basis.\nC. Correct because in the case of a strong-form efficient market, insiders would not be able to earn abnormal returns\nfrom trading on the basis of private information.\nMarket Efficiency\nexplain the implications of each form of market efficiency for fundamental analysis, technical analysis, and the\nchoice between active and passive portfolio management\nDiscuss ①\nFilter", "qhtml": null}, {"n": 45, "q": "The type of developed market bond that most likely has the greatest risk of\ndefault is a:", "opts": ["revenue bond.", "sovereign bond.", "general obligation bond."], "ans": "A", "expl": "A. Correct because revenue bonds have greater risk than both sovereign debt and general obligation bonds.\nGovernment bonds in developed countries have traditionally been viewed as the default risk-free rate off of which\nall other credits are priced. Revenue bonds, which are issued to finance a specific project, have a higher degree of\nrisk than GO (general obligation) bonds because they are dependent on a single source of revenue.\nB. Incorrect because sovereign debt in developed markets is the least risky among bond market segments because\ndeveloped countries have traditionally been viewed as the default risk-free rate off of which all other credits are\npriced.\nC. Incorrect because general obligation bonds are less risky than revenue bonds but more risky than sovereign debt.\nGovernment bonds in developed countries have traditionally been viewed as the default risk-free rate off of which\nall other credits are priced. Revenue bonds, which are issued to finance a specific project, have a higher degree of\nrisk than GO (general obligation) bonds because they are dependent on a single source of revenue.\nCreditAnalysisfor Government Issuers\n· explain special considerations when evaluating the credit of sovereign and non-sovereign government debt issuers\nand issues", "qhtml": null}, {"n": 46, "q": "An increase in which of the following most likely increases the time value of a\nEuropean put option?", "opts": ["The volatility of the underlying only", "The current market interest rate only", "Both the volatility of the underlying and the current market interest rate"], "ans": "A", "expl": "A. Correct because the time value reflects the value of the uncertainty that arises from the volatility in the underlying.\nAlso, time value results in an option price being greater with volatility and time but declining as expiration\napproaches. Therefore, the increase in the volatility of the underlying will increase the time value of a put option. In\ncontrast,thevalue of aEuropeanput isinverselyrelated to the risk-free interestrate.\nB.Incorrect because the value of a European put is inversely (not directly) related to the risk-free interest rate.\nC. Incorrect because the value of a European put is inversely (not directly) related to the risk-free interest rate.\nPricing and Valuation of Options\n· identify the factors that determine the value of an option and describe how each factor affects the value of an option\nDiscuss\nFilter\nDiscussion\nWhat doyou want to discuss... (required)", "qhtml": null}, {"n": 47, "q": "The portfolio's Sharpe ratio is closest to:", "opts": ["0.06.", "0.42.", "0.53."], "ans": "B", "expl": "A. Incorrect because it is the Treynor ratio, not the Sharpe ratio, for the portfolio. Treynor ratio = (R, - Rf)/B, = (8.50%\n-1.75%)/1.10 = 0.0614 ~ 0.06.\nB. Correct because the Sharpe ratio is determined by using the following equation: SR = (Rp, - Rf)/ o, = (8.50% -\n1.75%  Sharpe ratio is closest to:"}, {"n": 48, "q": "If the duration gap is zero, the investment horizon is closest to:", "opts": ["5.2 years.", "5.7 years.", "6.3 years."], "ans": "C", "expl": "A. Incorrect because the candidate calculates the Macaulay duration incorrectly: MacDur ≠ 5.7 / (1 + 10%) = 5.18, or\n5.2. Because the duration gap is equal to the bond's Macaulay duration minus the investment horizon the\ninvestment horizon is incorrectly stated as 5.2 years.\nB. Incorrect because the candidate confuses the Macaulay duration with the modified duration, thus incorrectly\ndetermining the investment horizon as 5.7 years.\nC. Correct because we use the fact that ModDur = MacDur / (1 + r) to calculate the Macaulay duration of the bond:\nMacDur = 5.7 x (1 + 10%) = 6.27, or 6.3. Because the duration gap is equal to the bond's Macaulay duration\nminus the investment horizon the investment horizon is closest to 6.3 years.\nInterest Rate Risk and Return\n· describe the relationships among a bond's holding period return, its Macaulay duration, and the investment horizon;", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6wAAADcCAIAAAD7k7tPAABRfklEQVR42u3dd0BT1/8+8JOEhD0FWaKgMhQQV1Ws2yLuUa21jjpq3XWvVq3Val11761VwS0q4kCciAxFlClgANkzgQzIuvf3x/maX8qqtUv9PK+/QnJzc3NyQ5577vucy5HJZAQAAAAA4H8JR6PRoBUAAAAA4H8rBLMsi1YAAAAAgP8pXDQBAAAAACAEAwAAAAAgBAMAAAAAIAQDAAAAACAEAwAAAAAgBP+tysvL09PT8VEBAAAAwP9QCFYoFKWlpfioAAAAAADlEAAAAAAACMEAAAAAAAjBAAAAAAAIwQAAAAAA/2QILiwslEql78/7ZBgGHzYAAAAAUHr/0Hp79uxJCAkODm7atOl/9d5kMtmPP/6YlpaWkZGhVqvt7Ox69OgxZMiQ1q1b//sbc/v27ePHj8tksmbNmm3atOkffa09e/YQQgwNDfv27Wtvb0/vvHXrVlZWVn5+vqmpaY8ePdq0afPO6w8MDHz8+LFQKOTxeJcvX665QFpaWnR0dHx8vK2trbu7e//+/XUfTU9PDwsLKy4utrOzGzx4cMOGDfE9BAAAgI8kBLMsSwjZsWPHnDlzXFxc/v03VlJSsn379hs3bmj7gAsKCs6ePfvs2bNjx45ZWFj80xtw8ODBp0+fEkJmzZrl5eVVXFycnJwsk8loy/xzkpKS9u/fTwgxMzPz9PSkITghIWHdunVisbiqqorH4925c6dnz57z589/h/WrVKpdu3aVlZURQvh8fq3LrFixQigUSiQSLpdrY2Pj7OzcokULDodDCImOjt6zZ09cXJxCoTA0NIyKilq+fHm ant to discuss... (required)", "qhtml": null}, {"n": 50, "q": "A bond's price sensitivity to a non-parallel shift in the benchmark yield curve is\nbest measured by:", "opts": ["key rate duration.", "effective duration.", "modified duration"], "ans": "A", "expl": "A. Correct because key rate duration (or partial duration) is a measure of a bond's sensitivity to a change in the\nbenchmark yield curve at a specific maturity segment. In contrast to effective duration, key rate durations help\n(e.g., the yield curve becoming steeper or flatter, i.e. a non-parallel shift as opposed to a parallel shift).\nB. Incorrect because effective duration is a curve duration statistic in that it measures interest rate risk in terms of a\nparallel shift in the benchmark yield curve.\nC. Incorrect because approximate modified duration is a yield duration statistic in that it measures interest rate risk in\nyield curve. It also assumes a parallel shift in rates.\nCurve-Based and Empirical Fixed-lncome Risk Measures\n1define key rate duration and describe its use to measure price sensitivity of fixed-income instruments to benchmark\nyield curve changes\nDiscuss ①\nFilter", "qhtml": null}, {"n": 51, "q": "Which of the following financial intermediaries most likely buy and sell similar\ninstruments at different prices in different markets?", "opts": ["Dealers", "Brokers", "Arbitrageurs"], "ans": "C", "expl": "A. Incorrect because dealers connect a buyer who arrived at one point in time with a seller who arrived at another\npoint in time and by trading with another client on the other side of the market, not buyers and sellers in different\nmarkets.\nB. Incorrect because brokers are agents who fill orders for their clients. They do not trade with their clients. Instead,\narrange trades.\nC. Correct because arbitrageurs buy and sell identical or essentially similar instruments at different prices in different\nmarkets.\nMarket Organization and Structure\ndescribe types of financial intermediaries and services that they provide\nQuestion 51 of 90 ①\nFilter", "qhtml": null}, {"n": 52, "q": "An investor buys a call for $24.70 that has a strike price of $650. If the value at\nexpiration for this call is $47.60, the price of the underlying at expiration is closest to:", "opts": ["$602.40.", "$672.90.", "$697.60."], "ans": "C", "expl": "A. Incorrect because $602.40 represents the value or payoff to the put buyer at expiration, which is pt = Max(0, X -\nSt), where X is the exercise price and S is the price of the underlying at expiration. Given the information in the\nstem we get $47.60 = Max(0,$650 - St) which yields S = $650 - $47.60 = $602.40. By contrast, the value or\npayoff to the call buyer at expiration is cT = Max(0,S - X). Given the information in the stem we get $47.60 =\nMax(0,ST - $650). Hence, ST = 650 + 47.60 = 697.60, not $602.40.\nB. Incorrect because $672.90 simply represents the difference between $697.60 and $24.70. By contrast, the value\nor payoff to the call buyer at expiration is ct = Max(0,St - X) where X is the strike price, S is the price of the\n$47.60 = $697.60, not $672.90.\nC. Correct because the value or payoff to the call buyer at expiration is ct = Max(O,St - X) where X is the strike\n$650). Hence, ST =$ 650 + $47.60 = $697.60.\nForward Commitment and Contingent Claim Features and Instruments\n· determine the value at expiration and profit from a long or a short position in a call or put option", "qhtml": null}, {"n": 53, "q": "Prior to expiration, an at-the-money option most likely trades:", "opts": ["below intrinsic value.", "at intrinsic value.", "above intrinsic value."], "ans": "C", "expl": "A. Incorrect because the price of an at-the-money option prior to expiration is above the option's intrinsic value, as\ndescribed in the justification for the correct answer.\nB. Incorrect because the price of an at-the-money option prior to expiration is above the option's intrinsic value, as\ndescribed in the justification for the correct answer.\nC. Correct because the value of a European call at expiration is also sometimes referred to as the exercise value or\nintrinsic value. When the underlying is precisely at the exercise price, the option is said to be at-the-money.\nAmerican options possess every characteristic of European options and one additional trait: they can be exercised\nat any time prior to expiration. Early exercise cannot be required, so the right to exercise early cannot have\nnegative value. Thus, American options cannot sell for less than European options. Therefore, for a European or\nAmerican call or a put option that is at-the-money, the relationship between value or trading price of the option and\ntime is positive, which means that the option has a value or price that exceeds the intrinsic value.\nPricing and Valuation of Options\nexplain the exercise value, moneyness, and time value of an option", "qhtml": null}, {"n": 54, "q": "Using the two-stage dividend discount model, the value per share of this\ncommon stock is closest to:", "opts": ["$28.57.", "$31.57.", "$38.70."], "ans": "B", "expl": "A. Incorrect. The terminal value is discounted for 3 years instead of 2 years.\nV = 1.50*(1.25)/1.12 + 1.50*(1.25)2/1.122 + 1.50*(1.25)2*(1.05)/(0.12-0.05)*(1/1.123)\n= $1.67 + $1.87 + $25.03 = $28.57\nB. Correct. Dividend per share (most recent year) = $2.50(0.6) = $1.50.\nV = 1.50*(1.25)/1.12 + 1.50*(1.25)2/1.122 + 1.50*(1.25)2*(1.05)/(0.12-0.05)*(1/1.122)\n= $1.67 + $1.87 + $28.03 = $31.57\nC. Incorrect. The terminal value is not discounted to the present.\nQuestion 54 of 90\nQ. Using the two-stage dividend discount model, the value per share of this common stock is closest to:\nA. $28.57.\nB. $31.57.\nC. $38.70.\nSolution\nA. Incorrect. The terminal value is discounted for 3 years instead of 2 years.\nV = 1.50*(1.25)/1.12 + 1.50*(1.25)2/1.122 + 1.50*(1.25)2*(1.05)/(0.12-0.05)*(1/1.123)\n= $1.67 + $1.87 + $25.03 = $28.57\nB. Correct. Dividend per share (most recent year) = $2.50(0.6) = $1.50.\nV = 1.50*(1.25)/1.12 + 1.50*(1.25)2/1.122 + 1.50*(1.25)2*(1.05)/(0.12-0.05)*(1/1.122)\n= $1.67 + $1.87 + $28.03 = $31.57\nC. Incorrect. The terminal value is not discounted to the present.\nV = 1.50*(1.25)/1.12 + 1.50*(1.25)2/1.122 + 1.50*(1.25)2*(1.05)/(0.12-0.05)\n= $1.67 + $1.87 + $35.16 = $38.70\nEquity Valuation: Concepts and Basic Tools\ncalculate and interpret the intrinsic value of an equity security based on the Gordon (constant) growth dividend\ndiscount model or a two-stage dividend discount model, as appropriate", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6wAAAE6CAIAAACd+UhkAAEAAElEQVR42uy9d3xUVf7/f6f3lsxk0ntCIJSEmmDoLUDo0pugYAWRxYIVFdeGgIIrgqgUUZAuEEroGFpCQggkoYT0nun9zp37++P983xnE3R3P7vuruz7+QePYXLn3nPPOffc13mf9/t9OA6Hg0IQBEEQBEGQ/yU4NE1jLSAIgiAIgiD/WyLY5/NhLSAIgiAIgiD/WyKYZVmsBQRBEARBEOR/Cj6KYARBEARBEIRCS/B/CR6PRygUut1ukUgEn7G1EARBEARBkH8J3P9eec7h/L9ScrnYVAiCIAiCIMj/igjmcDgMwzAMg02FIAiCIAiCPPwiGKy/AoHAaDS2tLRgUyEIgiAIgiD/KvjUf70l2OVy2Ww2bCoEQRAEQRCE+u+0BLtcLo/HQ1EU/OufhPgfTUjM4XB8Ph9N00Kh0GAw/KMl8Xq9NE0/0I/iP5IamWVZn8/X5tJ/rNQc7F8D9wKf/+bB/9BfEQRBEARBqD+WJVgsFrMsyzAMh8NhWZYEt4Fm+nfGt/H5fLiu1+v1er1cLpfL5fJ4PA6H828Os/N6vaDzOBwOj8fzrxb/4L8/hAgm5nmi4Gma9vl8AoGAx+Ph44QgCIIgyP+uOwSoTB6P53K5xGKxvwj+d96Yz+fjcDgcDofP5xNBDOr83yzX4OqkVFwu1+fzsSzL5XL/WCIYCk+mEFB4TF2HIAiCIAiF7hAURYHQpChKLBaD2oMoN38t+O+Jq2sjMUEQc7lcl8v17yyJv0sGKGCYJICV+g/UV8COTnwY/KsXN99GEARBEIT6X7YEu1wuHo/H4/HKy8ulUqlWqyVi9D+V65dhGJfLxbKsRCL5jyzZk4u2KckfzhIMpSWezQzDsCwLxn5M5IwgCIIgCPoEszRNZ2VlMQyzefPmjIwMi8UiFArBMPxvUEt2u10mk1EUZbPZ3nzzzeLi4sbGRq/X26FDh8jIyGeeeSY2Npb6xVuXz+dbrVaFQkH9daQakad2u53P5wsEAhB/D1z9h/sixlGGYYjwtdvt4IBx8eLFzz77zOPxhIeHr1+/nqZpDofjdruhqP6SnXiS2O12sVhM3IihtKQOwYrs8XikUqnD4WBZdteuXXq93ul0Op1OgUDA4XAaGxsXLVrkf/4LFy5cu3aNpmm9Xj9r1iz/P7ndbj6fDyV3OBwURRFPX7iizWYTiURcLnfjxo03btyoq6uz2+05OTlQAw6HQy6Xm81mlUp15cqVkpKS6upqrVabmJg4ePBguERrayuHw6muri4pKcnPz4+Lixs2bFhQUJBCoYCtAf2rDkEQBEEQ5I+aIu38+fM6na5Dhw6gL/899kLQqSUlJdnZ2T/9 e. Most of her savings are invested in bank\nterm deposits and short-term government securities. In her responses to the standard\nrisk assessment questionnaire, she strongly agrees with the statements that she \"feels\nmore comfortable putting money in a bank account than in the stock market.\" Also,\nshe \"thinks of the word 'risk' as being a 'loss'\". Based on this information, your client's\nability and willingness to take risk can best be described as:", "opts": ["low ability and high willingness.", "high ability and willingness.", "high ability and low willingness."], "ans": "C", "expl": "ss ( o) ai si e  ( o  s    e u   s\nB. Incorrect because her ability to take risk is high, but there is low (not high) willingness to take risk.\nC. Correct. Although the client owns a successful business and has a high income, she exhibits above-average risk\nBasics of Portfolio Planning and Construction\nexplain the difference between the willingness and the ability (capacity) to take risk in analyzing an investor's\nfinancial risk tolerance\nDiscuss ①\nFilter\nDiscussion", "qhtml": null}, {"n": 57, "q": "A $100,000,000 par value bond has a value of $88,500,000 and an annual\nmodified duration of 7.75. If the yield-to-maturity decreases by 100 basis points, the\nchange in value is closest to:", "opts": ["-$6,858,750.", "$6,858,750.", "$7,750,000."], "ans": "B", "expl": "A. Incorrect because the money duration is computed as: MoneyDur = AnnModDur x PVFull = 7.75 x $88,500,000 =\n:  o   so   o  (  t  o\nMoneyDur in the second equation.\nB. Correct because the money duration is computed as: MoneyDur = AnnModDur x PVFull = 7.75 x $88,500,000 =\n$685,875,000. The change in the bond's value is computed as: △PVFull ~ -MoneyDur × △Yield = -$685,875,000 x\n-0.01 = $6,858,750\nC. Incorrect because the money duration is computed using the par value of $100,0o0,000 rather than the full value of\nthe bond: MoneyDur = AnnModDur x PVFull = 7.75 x $100,000,000 = $775,000,000. The change in ou want to discuss... (required)", "qhtml": null}, {"n": 62, "q": "The annual management fee is based on the year-end valuation, and the incentive\nfee is calculated net of the management fee. If the fund return before fees is 10% at\nyear end, the total annual fee earned by the fund manager is closest to:", "opts": ["$3.2 million.", "$3.6 million.", "$3.8 million."], "ans": "A", "expl": "A. Correct because the hurdle rate is a minimum rate of return, typically 8%, that the GP must exceed in order to\nearn the performance fee. GPs typically receive 20% of the total profit of the private equity fund net of any hard\nhurdle rate, in which case the GP earns fees on annual returns in excess of the hurdle rate, or net of the soft hurdle\nrate, in which case the fee is calculated on the entire annual gross return as long as the set hurdle is exceeded.\nManagement fee = $110 million × 2%= $2.2 million.\nAnnual return is 10%; and the hard hurdle rate is 3%. Thus the incentive fee is paid on a 7% return: 7% x $100\nmillion = $7 million\n=  x   o ' -   =  i  s\nTherefore, total fees = management fee + incentive fee = $2.2 million + $0.96 million = $3.16 million, rounded to\nQuestion62of90\nA. Correct because the hurdle rate is a minimum rate of return, typically 8%, that the GP must exceed in order to\nearn the performance fee. GPs typically receive 20% of the total profit of the private equity fund net of any hard\nhurdle rate, in which case the GP earns fees on annual returns in excess of the hurdle rate, or net of the soft hurdle\nrate, in which case the fee is calculated on the entire annual gross return as long as the set hurdle is exceeded.\nManagement fee = $110 million × 2% = $2.2 million.\nAnnual return is 10%; and the hard hurdle rate is 3%. Thus the incentive fee is paid on a 7% return: 7% × $100\nmillion = $7 million\nThus the incentive fee = ($7 million - $.2.2 million management fee) × 20% = $0.96 million\nTherefore, total fees = management fee + incentive fee = $2.2 million + $0.96 million = $3.16 million, rounded to\n$3.2 million.\nB. Incorrect because the incentive fee is calculated gross of management fee.\nAnnual return is 10%; and the hard hurdle rate is 3%. Thus the incentive fee is paid on a 7% return: 7% x $100\nmillion = $7 million.\nThe incentive fee\n≠\n$7 million x 20% = $1.4 million.\nTherefore,totalfees\n≠\nmanagement fee + incentive fee = $2.2 million + $1.4 million = $3.6 million.\nQuestion62of90\nB. Incorrect because the incentive fee is calculated gross of management fee.\nAnnual return is 10%; and the hard hurdle rate is 3%. Thus the incentive fee is paid on a 7% return: 7% x $100\nmillion = $7 million.\nThe incentive fee\n≠\n$7 million x 20% = $1.4 million.\nTherefore, total fees\n≠\nmanagement fee + incentive fee = $2.2 million + $1.4 million = $3.6 million.\nC. Incorrect because a soft hurdle rate is used instead of a hard hurdle rate.\nManagement fee = $110 million × 2% = $2.2 million.\nAs the hurdle rate was exceeded, the incentive fee = ($10 million - $2.2 million) x 20% = $1.56 million.\nTherefore, total fees = management fee + incentive fee ≠ $2.2 million + $1.56 million = $3.76 million, rounded to\n$3.8 million.\nAlternative Investment Performance and Returns\ncalculate and interpret alternative investment returns both before and after fees", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6wAAADzCAIAAAANaQysAACMl0lEQVR42u3ddVwU2/84/jPbCywd0qkYKCoGdmCDgt1id3devepVwbzY3Y3dYoJKCUhLdy6xxC7b8/3j/JzffnaBy433vVfv6/mHD9yZnZ05M3PmNWde5wxBkiQCAAAAAADgv4QGRQAAAAAAACAI/tcpLS0NDw+HXQUAAAAAAKAlGAAAAAAAAAiCAQAAAAAAgCAYAAAAAAAACIIBAAAAAAD4XwbBAoFAIpFA+QIAAAAAgP9QELxkyZJff/3137OdMpkMdjYAAAAAAMAY/6Plfv78+fPnz3w+f/Hixba2tv/IttXU1CxfvjwvL6+goECpVBoaGnbs2HHixIndu3f/+1fm2bNnZ86cEQqFzZs3P3z48P8o0N+3b19+fr5SqdTX11+5cqWJiQk19fbt2zExMdXV1Xp6ep6enn+mEI4dOxYWFlZYWMhgMJ4/f645Q3x8/Js3bxISEgwNDV1dXSdNmqQ6NTEx8e7du3w+39zcfNq0aZaWlnAeAgAAAOAHCYKxoKAggiD8/f3//g0rKSnZsWNHaGgo9Uq8ioqK169fJyUl3b er the investor pays a sales charge (a 'load') to purchase,\nhold, or redeem shares in the fund. In the case of the no-load fund, there is no fee for investing in the fund or for\nredemption but there is an annual fee based on a percentage of the fund's net asset value.\nPortfolioManagement: An Overview", "qhtml": null}, {"n": 70, "q": "An investor buys a stock on margin, posting 60% of the initial $63.00 per share\nprice as equity. All else being equal, if the investor receives a margin call at $33.60\nper share, the maintenance margin on this trade is:", "opts": ["12.5%.", "25.0%.", "40.0%."], "ans": null, "expl": "which isclosestto12.5%.\n( -  +  x ) :s s  (   x)     (  - d m\n$33.60 = ($37.8 + $33.60 - $63) / $33.60 = = $8.40 / $33.60 = 0.2500, which is closest to 25%.\nC. Incorrect because it calculates the margin requirement as 1 - initial equity = 1 - 0.6 = 0.4, which is 40%.\nMarket Organization and Structure\n1 calculate and interpret the leverage ratio, the rate of return on a margin transaction, and the security price at which\nthe investor would receive a margincall\nQuestion70of90①\nFilter", "qhtml": null}, {"n": 71, "q": "Redemption regimes are a feature of:", "opts": ["covered bonds.", "auto loan-backed securities.", "commercial mortgage-backed securities."], "ans": "A", "expl": "A. Correct because covered bonds are similar to ABs, but they differ because of their dual recourse nature, strict\neligibility criteria, dynamic cover pool, and redemption regimes in the event of sponsor default. Redemption\nthe event of default of a covered bond's financial sponsor.\nB. Incorrect because redemption regimes is not a feature of auto loan asset backed securities. In the case of ABS,\nthe financial institution that originates loans transfers securitized assets to a bankruptcy-remote special legal entity.\nbut the pool of underlying assets in a covered bond (or “cover pool\") remains on the financial institution's balance\nsheet, against which covered bondholder
