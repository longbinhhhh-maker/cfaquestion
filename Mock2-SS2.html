: "Which of the following statements is most accurate? US commercial paper\ntypically:", "opts": ["requires the issuer to pledge collateral.", "requires the issuer to have a backup line of credit.", "has a maturity ranging from a few days up to two years."], "ans": "B", "expl": "A. Incorrect because commercial paper is a short-term, unsecured promissory note issued in the public market or via\na private placement that represents a debt obligation of the issuer. Being unsecured, the issuer is not required to\npledge collateral.\nB. Correct because credit rating agencies often require that commercial paper issuers secure a backup line of credit\nfrom banks.\nS    s e     d g   s   s\nFixed-lncome Markets for Corporate Issuers\ncompare short-term funding alternatives available to corporations and financial institutions\nDiscuss ①\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 75, "q": "The binomial option pricing model always:", "opts": ["requires knowledge of the magnitude of possible up and down moves.", "requires knowledge of the actual probabilities of possible up and down moves.", "enables the construction of a risk-free hedge consisting of one unit of each of the option and the underlying."], "ans": "A", "expl": "A. Correct because the binomial model requires knowledge of what the upside case is (represented by S,+) and\nwhat the downside case is (as represented by S,-). We cannot arbitrarily set these values at just anything. We will\nbe required to know the values of S,+ and S,-.\nB. Incorrect because the actual probabilities of the up and down moves do not matter.\nC. Incorrect because, while the binomial model does enable the construction of a risk-free hedge consisting of the\noption and the underlying, the appropriate ratio needs to be calculated. One needs to derive the number of units of\nthe underlying that will perfectly hedge one unit of the short call, and one unit of each is not the appropriate\nbalance.\nValuing a derivative using a one-period binomial model\n1 explain how to value a derivative using a one-period binomial model\nQuestion75of90@\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 76, "q": "A buy-and-hold investor purchases a fixed-rate bond at issuance and holds it\nuntil maturity. With respect to interest rate risk, this investor is exposed to:", "opts": ["market price risk only.", "coupon reinvestment risk only.", "both market price risk and coupon reinvestment risk."], "ans": "B", "expl": "A. Incorrect because market price risk matters more when the investor has a short-term horizon relative to the time-\nrisk.\ntime-to-maturity of the bond. For instance, a buy-and-hold investor only has coupon reinvestment risk.\nC. Incorrect because coupon reinvestment risk matters more when the investor has a long-term horizon relative to the\ntime-to-maturity of the bond. For instance, a buy-and-hold investor only has coupon reinvestment risk.\nInterest Rate Risk and Return\ncalculate and interpret the sources of return from investing in a fixed-rate bond;\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 77, "q": "If 1,000 shares of stock purchased at $30 per share on 75% margin are later sold\nat $26 per share, the return on equity is closest to:", "opts": ["-17.8%.", "-13.3%.", "-10.0%."], "ans": "A", "expl": "A. Correct because it has correctly applied margin requirement and calculated the effect of leverage on the return\ncalculation,accordingly:\nCost of purchase = Shares purchased x Purchase price = 1,000 x $30 = $30,000\n= $30,000 × 75% = $22,500\nProceeds from sale = Shares sold x Sales price = 1,000 x $26 = $26,000\nLoss on the position = Proceeds from Sale - Cost of purchase\n= $26,000 - $30,000 = -$4,000\nReturn on investment = Loss on the position / Initial investment\n-$4,000 / $22,500 = 0.1777... ~ 17.78%.\nAlternatively, it can also be calculated as Return on investment = Loss on the position / Cost of purchase / Margin\nrequirement = (-$4,000 / $30,000) / 75% = -0.1777... ~ -17.78%\nQuestion 77 of 90\nProceeds from sale = Shares sold x Sales price = 1,000 x $26 = $26,000\nLoss on the position = Proceeds from Sale - Cost of purchase\n= $26,000 - $30,000 = -$4,000\nReturn on investment = Loss on the position / Initial investment\n= -$4,000 / $22,500 = 0.1777 ... ~ 17.78%.\nAlternatively, it can also be calculated as Return on investment = Loss on the position / Cost of purchase / Margin\nrequirement = (-$4,000 / $30,000) / 75% = -0.1777... ~ -17.78%\nB. Incorrect because it has omitted the margin requirement and the effect of leverage on the return calculation,\nconsequently:\nCost of purchase = Shares purchased x Purchase price = 1,000 x $30 = $30,000\nInitial investment = Cost of purchase = $30,000\nProceeds from sale = Shares sold × Sales price = 1,000 x $26 = $26,000\nLoss on the position = Proceeds from Sale - Cost of purchase\n= $26,000 - $30,000 = -$4,000\nReturn on investment = Loss on the position / Initial investment\n= -$4,000 / $30,000 = -0.1333... ≈ -13.33%\nC. Incorrect because it has incorrectly applied margin requirement and miscalculated the effect of leverage on the\nreturn calculation, consequently:\nQuestion 77 of 90\nLoss on the position = Proceeds from Sale - Cost of purchase\n= $26,000 - $30,000 = -$4,000\nReturn on investment = Loss on the position / Initial investment\n= -$4,000 / $30,000 = -0.1333... = -13.33%\nC. Incorrect because it has incorrectly applied margin requirement and miscalculated the effect of leverage on the\nreturn calculation, consequently:\nCost of purchase = Shares purchased × Purchase price = 1,000 x $30 = $30,000\nInitial investment = Equity invested = Cost of purchase / Margin requirement\n= $30,000 / 75% = $40,000\nProceeds from sale = Shares sold × Sales price = 1,000 x $26 = $26,000\nLoss on the position = Proceeds from Sale - Cost of purchase\n= $26,000 - $30,000 = -$4,000\nReturn on investment = Loss on the position / Initial investment\n-$4,000 / $40,000 = 0.1 = 10.00%.\nrequirement = -$4,000 / $30,000 x 75% = -10.00%\nMarket Organization and Structure\ncalculate and interpret the leverage ratio, the rate of return on a margin transaction, and the security price at which\nFne", "qhtml": null}, {"n": 78, "q": "Which of the following risk metrics reflects the risk of changes in an option's\ndelta?", "opts": ["Rho", "Vega", "Gamma"], "ans": "C", "expl": "metric. Derivatives are also sensitive to changes in interest rates, which are reflected in a measure called rho.\nSome derivatives, such as options, are also sensitive to changes in the volatility of the underlying. This risk is\ncaptured by a concept called vega, which is a first-order measure of the change in the derivative price for a\nchange in the volatility of the underlying.\nC. Correct because the sensitivity of the derivative price to a small change in the value of the underlying asset is\nsmall changes in the value of the underlying. Large changes are captured by the concept of gamma. Whereas\nIntroduction to Risk Management\n· describe methods for measuring and modifying risk exposures and factors to consider in choosing among the\nmethods", "qhtml": null}, {"n": 79, "q": "An investor purchases a 5% coupon bond maturing in 15 years for par value.\nImmediately after purchase, the yield required by the market increases. The investor\nwould then most likely have to sell the bond at:", "opts": ["par.", "a discount.", "a premium."], "ans": "B", "expl": "A. Incorrect because the yield is now greater than the coupon.\nB. Correct because the bond would sell below par or at a discount if the yield required by the market rises above the\ncoupon rate. Because the bond initially was purchased at par, the coupon rate equals the yield required by the\nmarket. Subsequently, if yields rise above the coupon, the bond's market price would fall below par.\nC. Incorrect because the yield is now greater than the coupon.\nFixed-lncome Bond Valuation: Prices and Yields\n· identify the relationships among a bond's price, coupon rate, maturity, and yield-to-maturity\nDiscuss\nFilter\ni\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 80, "q": "The Markowitz efficient frontier is best described as the part of the\nminimum-variance frontier of risky assets that plots:", "opts": ["to the right of the risk-free asset.", "above the global minimum-variance portfolio.", "above and to the right of the optimal risky portfolio."], "ans": "B", "expl": "A. Incorrect because the minimum-variance frontier gives us portfolios with the minimum variance for a given return.\naverse investors will choose. In fact, all portfolios of the minimum-variance frontier lie to the right of the risk-free\nasset.\nB. Correct because the minimum-variance frontier gives us portfolios with the minimum variance for a given return.\nefficient frontier because it contains all portfolios of risky assets that rational, risk-averse investors will choose.\nThe curve that lies above and to the right of the global minimum-variance portfolio [and not the optimal risky\nportfolio] is referred to as the Markowitz efficient frontier because it contains all portfolios of risky assets that\nand the efficient frontier of risky assets, and thus is not the same as the global minimum-variance portfolio.\nPortfolio Risk and Return: PartI\nportfolio", "qhtml": null}, {"n": 81, "q": "In a declining interest rate environment, an investor would find it most difficult\nto estimate future cash flows for which of the following bonds with similar maturities?", "opts": ["Putable bond", "Floating-rate bond with a floor", "Mortgage pass-through security"], "ans": "C", "expl": "A. Incorrect because if interest rates decline, a putable bond will increase in value to a level above the put price and\nthe bondholder will not put the bond to the issuer (long the option).\nB. Incorrect because even though coupon payments will decline as interest rates decline, the floor sets a minimum\n(and constant) level of payments when rates decline to and below the floor level. In this sense, forecasting cash\nflows is less difficult than for the pass-through security.\nC. Correct because when interest rates decline, borrowers will accelerate their prepayments. Compared to the floater\nare modeled to a benchmark but actual experience may be greater or less than forecast.\n· describe types and characteristics of residential mortgage-backed securities, including mortgage pass-through\nDiscuss\ni\nFilter", "qhtml": null}, {"n": 82, "q": "In the investment policy statement of a pension fund, a countrywide limit on the\nproportion of high-risk assets that can be held in long-term pension portfolios is most\nlikely a:", "opts": ["liquidity constraint.", "time horizon constraint.", "legal and regulatory constraints."], "ans": "C", "expl": "A. Incorrect because the countrywide constraint for pension funds that limits the proportion of high-risk assets in the\nfunds from the portfolio.\npension fund and is therefore not a time horizon constraint. Time horizon constraints state the time horizon over\nwhich the investor is investing.\nC. Correct because the IPS should state any legal and regulatory restrictions that constrain how the portfolio is\ninvested. In some countries, such institutional investors as pension funds are subject to restrictions on the\nthe portfolio, or on the proportion of the portfolio that may be invested overseas.\nBasics of Portfolio Planning and Construction\n· describe the investment constraints of liquidity, time horizon, tax concerns, legal and regulatory factors, and unique\ncircumstances and their implications for the choice of portfolio assets", "qhtml": null}, {"n": 83, "q": "The management and incentive fees are calculated independently. If the hedge\nfund generates a gross return of 25%, the assets under management after fees at the\nend of the period are closest to:", "opts": ["$94.0 million.", "$94.4 million.", "$97.6 million."], "ans": "A", "expl": "A. Correct because management fee = $80 million × (1 + 25%) × 2% = $2 million;\nIncentive fee = ($80 million × 25%) × 20% = $4 million;\not = (o t -   - ( + ) x  ) = s o  ()   ss\nB. Incorrect because incentive fees are considered to be calculated net of management fees.\nManagement fee = $80 million × (1 + 25%) × 2% = $2 million;\nIncentive fee ≠ (($80 million × 25%) - $2 million) × 20% = $3.6 million;\nAssets under management (AUM), net of fees ≠ ($80 million × (1 + 25%) - $2 million - $3.6 million) = $94.4\nmillion.\nC. Incorrect because it is the result of multiplying the total fees plus 1 with the initial investment: Assets under\nmanagement (AUM), net of fees ≠ $80 million × (1 + 20% + 2%) = $97.6 million.\nAlternative Investment Performance and Returns", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6wAAAD6CAIAAAAqZl1kAACSwUlEQVR42u3dd1gT2fcw8DspBELovUkREAVEQETsDdeCvaHYe+/dXXvvCoqKBTuuvYA0FZUO0nuR3ltoIYVk3j/u6zz5AqK76+7+dvd8/vDBZDKZcmdy5sy5dwiSJBEAAAAAAAD/JTTYBAAAAAAAAIJgAAAAAAAAIAgGAAAAAAAAgmAAAAAAAAAgCAYAAAAAAACC4B+qsrIyKioKdhUAAAAAAIBMMAAAAAAAABAEAwAAAAAAAEEwAAAAAAAAEAQDAAAAAAAAQTAAAAAAAIAg+Ae6detWXFzc/5GVJEmSx+PBzgYAAAAAABjjT5rvxYsX2Wz227dv/97Vi46OjoiICAkJ4fP5PXv2XLt2rZ6e3t+yJFlZWaGhoXw+X1tbe/LkyX/eFwkEAhkZGYIgOny3rq5OSUmJRvtDFz9NTU2pqakfP35ECG3evPlrk33+/NnY2LjDJSFJksvlKisrf205AQAAAAD+VARJkn/GfLt3744QMjQ03Lx584gRI9AfGyc4Ly/P0dHxN30qLi5u+/btRUVFbV6n0+mPHj3q1q3bnx1+rVq1Cl8DeHh4DB8+/P79+6dOnWpubrawsHj69Cn6E7LdQ4cOraiooF6xt7ffsWOHpaWlSCR6+vTpnj17pKe3s7O7e/fu7/giHo9nb2+P/2YymUlJSW0maGxs7NevX2trK/XKoUOHXFxcZGRkEELXr1+/dOlSY2MjfovNZh89etTZ2RkORQAAAACgf01NcEFBwZo1a4KDg//itWpsbHRzc8MRsLm5+cmTJ69cueLm5oYQEovFM2bMOHPmzJ+9DBKJBP+Bw8GePXvOnz9/0aJF06ZN+zO+bvv27RUVFaqqqkOGDOnTpw+Tyfz06ZOrqytC6MCBA/v27UMI6enpzZo1y8LCAl8kPHv27PdtW/zH+vXrr1692ubdkJCQIUOGtLa2MhiMyZMn47z7rl27cMK4tLT0xIkTjY2Nenp6Li4umpqaPB5v/fr1UKwCAAAAAPTvKIeQduLECYTQH8wH . Correct because effective duration is suitable for instruments with uncertain future cash flows like callable bonds,\nsince in brief, a callable bond does not have a well-defined internal rate of return (yield-to-maturity). Therefore,\nyield duration statistics, such as modified and Macaulay durations, do not apply; effective duration is the\nappropriatedurationmeasure.\nbonds, since in brief, a callable bond does not have a well-defined internal rate of return (yield-to-maturity).\nTherefore, yield duration statistics, such as modified and Macaulay durations, do not apply; effective duration is\nthe appropriate durationmeasure.\nCurve-Based and Empirical Fixed-lncome Risk Measures\n· explain why effective duration and effective convexity are the most appropriate measures of interest rate risk for\nbonds with embedded options", "qhtml": null}, {"n": 85, "q": "A key motivation for adding alternative investments to a portfolio is most likely\nthe:", "opts": ["potential for diversification.", "ease of selecting portfolio managers.", "high correlation with traditional investments."], "ans": "A", "expl": "A. Correct because alternative investments offer broader diversification (because of their lower correlation with\ntraditional asset classes), opportunities for enhanced returns (by increasing the portfolio's risk-return profile), and\npotentially increased income through higher yields (particularly compared with traditional investments in low-\ninterest rate periods).\nB. Incorrect because challenges to allocating a portion of a portfolio to alternative investments include obtaining\nreliable measures of risk and return and selecting portfolio managers for the alternative investments.\nC. Incorrect because alternative investments typically have low, not high, correlation of returns with more traditional\nasset classes\nAlternative Investment Features, Methods, and Structures\n· describe features and categories of alternative investments\nDiscuss\nFilter\nDiscussion", "qhtml": null}, {"n": 86, "q": "The free-cash-flow-to-equity model:", "opts": ["requires an estimate of future dividend payments.", "can be used to value non-dividend paying stocks.", "treats non-cash expense in the same manner as cash expense."], "ans": "B", "expl": "A. Incorrect because in practice, many analysts prefer to use a free-cash-flow-to-equity (FCFE) valuation model.\nThese analysts assume that dividend-paying capacity should be reflected in the cash flow estimates rather than\nexpected dividends. FCFE is a mea- sure of dividend-paying capacity.\nB. Correct because analysts may also use FCFE valuation models for a non-dividend-paying stock.\nC. Incorrect because the calculation of FCFE starts with the calculation of cash flow from operations (CFO). CFO is\nsimply defined as net income plus non-cash expenses minus investment in working capital. Cash expenses are\nincluded in net income but non-cash expenses are added back in calculating CFO.\nEquity Valuation: Concepts and Basic Tools\nexplain the rationale for using present value models to value equity and describe the dividend discount and free-\ncash-flow-to-equity models\nDiscuss\nFilter\nDiscussion", "qhtml": null}, {"n": 87, "q": "Yield measures for both bonds and money market instruments are most likely:", "opts": ["compounded.", "stated in annual terms.", "based on simple interest."], "ans": "B", "expl": "A. Incorrect because there are several important differences in yield measures between the money market and the\nbond market: Bond yields-to-maturity are compounded (as well as annualized). Yield measure in the money\na simple interest basis.\nB. Correct because bond yields-to-maturity are annualized (and compounded) and yield measures in the money\nmarket are annualized (but not compounded).\nC. Incorrect because bond yields-to-maturity are annualized and compounded. Yield measures in the money market\nare annualized but not compounded. Instead, the rate of return on a money market instrument is stated on a\nsimple interest basis.\ncalculate and interpret yield measures for money market instruments\nDiscuss ①\nFilter", "qhtml": null}, {"n": 88, "q": "A 6% 25-year bond with semiannual payments has a market price of $850.00.\nThe yield to maturity of this bond is closest to:", "opts": ["5.72%.", "7.32%.", "7.91%."], "ans": "B", "expl": "A. Incorrect because this is the YTM found when reversing the price and face value.\nB. Correct. The yield to maturity is the discount rate that equates the price of the bond ($850.oo) with its cash flows\n(49 semiannual cash flows of $30 and a 50th cash flow of $1,030), or\n$850 = $30/(1+YTM/2)1 + $30/(1+YTM/2)2 +..+ $1030/(1+YTM/2)50\nUsing a financial calculator to find the yield to maturity gives 7.32%.\nC. Incorrect because this is the YTM found when setting a calculator for 2 payments per year but inputting only 25\npayments, rather than 50.\nYield and Yield Spread Measures for Fixed-Rate Bonds\ncompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds\nQuestion88of90\nFilter", "qhtml": null}, {"n": 89, "q": "Which of the following contracts is an example of a contingent claim? A(n):", "opts": ["currency option", "interest rate swap", "commodity forward"], "ans": "A", "expl": "A. Correct because there are two general classes of derivatives. Some provide the ability to lock in a price at which\none might buy or sell the underlying. Because they force the two parties to transact in the future at a previously\nagreed-on price, these instruments are called forward commitments. The various types of forward commitments\nversus doing nothing depends on a particular random outcome, these derivatives are called contingent claims.\nclaim.\nB. Incorrect because swaps are forward commitments and not contingent claims.\nC. Incorrect because forward contracts are forward commitments and not contingent claims.\nDerivative Instrument and Derivative Market Features\n· describe the basic features of derivative markets, and contrast over-the-counter and exchange-traded derivative\nmarkets\nDiscuss ①\nFilter", "qhtml": null}, {"n": 90, "q": "An index provider launches a new index that will include value stocks in a\nspecific country. This index will most likely be a:", "opts": ["style index.", "large-capitalization index.", "fundamentally weighted index."], "ans": "A", "expl": "A. Correct because style indexes represent a group of securities classified according to market capitalization, value,\nand growth or a combination of these characteristics. Therefore, the new index will most likely be a style index with\na value classification.\nB. Incorrect because large-capitalization indexes represent and track the largest securities in terms of market\nearnings, dividends, and number of employees to weight the constituent securities. Securities of different styles\nand sectors could be included in the same fundamentally weighted index. Therefore, fundamentally weighted\nindexes do not represent the category of value stocks.\nSecurity Market Indexes\n· describe types of equity indexes\nDiscuss\nFilter", "qhtml": null}];
const CFG = {"title": "Mock Exam 2 — Session 2", "subtitle": "CFA Level I · 90 câu · 2h15p", "minutes": 135, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const day = new Date().toISOString().slice(0,10);
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    document.querySelectorAll('.opt.correct').forEach(function(o){ addMark(o,'✅'); });
    document.querySelectorAll('.opt.wrong').forEach(function(o){ addMark(o,'❌'); });
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#6d5efc','#9d8bff','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>
</body>
