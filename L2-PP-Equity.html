<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button id="submitBtn" class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>

    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>

</aside>

    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>

    </div>

</div>

      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>

</div>

    <p id="rScore" class="r-score"></p>

    <!--subject-breakdown-panel-start-->

    </div>
  </div>
</div>

<script>
const DATA = [{"n":1,"q":"An analyst believes an asset's market price accurately reflects its intrinsic value and the asset's estimated value is less than its intrinsic value. Should the analyst conclude that the asset is mispriced?","opts":["No","Yes, because the market is inefficient","Yes, because of the estimation error of the intrinsic value"],"ans":"C","expl":"C is Correct because the estimation error (difference between the estimated value and the intrinsic value), VE – V, is not zero and is a source of mispricing.","explhtml":"<p>C is Correct because the estimation error (difference between the estimated value and the intrinsic value), VE – V, is not zero and is a source of mispricing.<\/p>","qhtml":"<div class=\"pp-topic\">Equity Valuation: Applications and Processes<\/div><div class=\"qtext\"><p>An analyst believes an asset&#x27;s market price accurately reflects its intrinsic value and the asset&#x27;s estimated value is less than its intrinsic value. Should the analyst conclude that the asset is mispriced?<\/p><\/div>","subj":"equity"},{"n":2,"q":"An analyst's determination that a company has a strong relative competitive position within its industry is best supported by the:","opts":["industry's high barriers to entry.","company's ability to offer unique products.","high level of rivalry between companies in the industry"],"ans":"B","expl":"B is Correct because the level and trend of the company’s market share indicate its relative competitive position within an industry. In general, a company’s value is higher to the extent that it can create and sustain an advantage relative to its competition. One of the generic corporate strategies for achieving above-average performance is a company's ability to offer unique products or services along some dimensions that are widely valued by buyers so that the company can command premium prices.","explhtml":"<p>B is Correct because the level and trend of the company’s market share indicate its relative competitive position within an industry. In general, a company’s value is higher to the extent that it can create and sustain an advantage relative to its competition. One of the generic corporate strategies for achieving above-average performance is a company&#x27;s ability to offer unique products or services along some dimensions that are widely valued by buyers so that the company can command premium prices.<\/p>","qhtml":"<div class=\"pp-topic\">Equity Valuation: Applications and Processes<\/div><div class=\"qtext\"><p>An analyst&#x27;s determination that a company has a strong relative competitive position within its industry is best supported by the:<\/p><\/div>","subj":"equity"},{"n":3,"q":"An investor implements a pairs strategy that she expects to benefit in any market condition. The most appropriate valuation model to use to identify pairs is a:","opts":["relative valuation model.","asset-based valuation model.","free cash flow to the firm model."],"ans":"A","expl":"A is Correct because a relative valuation model estimates an asset’s value relative to that of another asset. The more conservative investing strategies based on relative valuation involve overweighting (underweighting) relatively undervalued (overvalued) assets.","explhtml":"<p>A is Correct because a relative valuation model estimates an asset’s value relative to that of another asset. The more conservative investing strategies based on relative valuation involve overweighting (underweighting) relatively undervalued (overvalued) assets.<\/p>","qhtml":"<div class=\"pp-topic\">Equity Valuation: Applications and Processes<\/div><div class=\"qtext\"><p>An investor implements a pairs strategy that she expects to benefit in any market condition. The most appropriate valuation model to use to identify pairs is a:<\/p><\/div>","subj":"equity"},{"n":4,"q":"An asset-based valuation approach is most appropriate to value a company that:","opts":["owns and operates mines.","has a stable dividend policy.","is being used in a pairs trading strategy."],"ans":"A","expl":"A is Correct because an asset-based valuation approach values a company on the basis of the market value of the assets or resources it controls. For appropriate companies asset-based valuation can provide an independent estimate of value.","explhtml":"<p>A is Correct because an asset-based valuation approach values a company on the basis of the market value of the assets or resources it controls. For appropriate companies asset-based valuation can provide an independent estimate of value.<\/p>","qhtml":"<div class=\"pp-topic\">Equity Valuation: Applications and Processes<\/div><div class=\"qtext\"><p>An asset-based valuation approach is most appropriate to value a company that:<\/p><\/div>","subj":"equity"},{"n":5,"q":"The public market value of a diversified company is lower than its sum-of-the-parts valuation. This difference best describes a:","opts":["relative valuation.","private market value.","conglomerate discount."],"ans":"C","expl":"C is Correct because a conglomerate discount often arises in connection with situations warranting a sum-of-the parts valuation. Conglomerate discount refers to the concept that the market applies a discount to the stock of a company operating in multiple, unrelated businesses compared to the stock of companies with narrower focuses.","explhtml":"<p>C is Correct because a conglomerate discount often arises in connection with situations warranting a sum-of-the parts valuation. Conglomerate discount refers to the concept that the market applies a discount to the stock of a company operating in multiple, unrelated businesses compared to the stock of companies with narrower focuses.<\/p>","qhtml":"<div class=\"pp-topic\">Equity Valuation: Applications and Processes<\/div><div class=\"qtext\"><p>The public market value of a diversified company is lower than its sum-of-the-parts valuation. This difference best describes a:<\/p><\/div>","subj":"equity"},{"n":6,"q":"An analyst's selection of a valuation model should be such that the model is consistent with:","opts":["the characteristics of the company but not the analyst's perspective.","the analyst's perspective but not the characteristics of the company.","both the characteristics of the company and the analyst's perspective."],"ans":"C","expl":"C is Correct because the broad criteria for model selection are that the valuation model be consistent with the characteristics of the company being valued; appropriate given the availability and quality of data; and consistent with the purpose of valuation, including the analyst’s perspective.","explhtml":"<p>C is Correct because the broad criteria for model selection are that the valuation model be consistent with the characteristics of the company being valued; appropriate given the availability and quality of data; and consistent with the purpose of valuation, including the analyst’s perspective.<\/p>","qhtml":"<div class=\"pp-topic\">Equity Valuation: Applications and Processes<\/div><div class=\"qtext\"><p>An analyst&#x27;s selection of a valuation model should be such that the model is consistent with:<\/p><\/div>","subj":"equity"},{"n":7,"q":"A company expects negative free cash flow to equity, but to still pay a constant, stable dividend. The most appropriate model to value the company is the:","opts":["residual income model.","dividend discount model.","free cash flow to equity model."],"ans":"A","expl":"A is Correct because the residual income model can be used for both dividend- paying and non-dividend-paying stocks. Analysts may choose a residual income approach for companies with negative expected free cash flows within their comfortable forecast horizon.","explhtml":"<p>A is Correct because the residual income model can be used for both dividend- paying and non-dividend-paying stocks. Analysts may choose a residual income approach for companies with negative expected free cash flows within their comfortable forecast horizon.<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>A company expects negative free cash flow to equity, but to still pay a constant, stable dividend. The most appropriate model to value the company is the:<\/p><\/div>","subj":"equity"},{"n":8,"q":"An analyst gathers the following information about a company: Based on the Gordon growth model, the stock of this company is most likely:","opts":["undervalued.","fairly valued.","overvalued."],"ans":"A","expl":"A is Correct because based on the Gordon growth model, the value of a company stock is given by V0 = D1/(r – g), where g is the expected constant growth rate in dividends, D1 is the expected dividend payment at time 1 and r is the required return on equity. By applying the information provided the estimated value of the stock is V0 = 1.50/(0.085 – 0.045) = 1.50/0.04 = $37.50, which is higher than the current market value, indicating that the stock is undervalued","explhtml":"<p>A is Correct because based on the Gordon growth model, the value of a company stock is given by V0 = D1/(r – g), where g is the expected constant growth rate in dividends, D1 is the expected dividend payment at time 1 and r is the required return on equity. By applying the information provided the estimated value of the stock is V0 = 1.50/(0.085 – 0.045) = 1.50/0.04 = $37.50, which is higher than the current market value, indicating that the stock is undervalued<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp091.webp\" style=\"max-width:min(100%,545px)\" alt=\"\"><p>Based on the Gordon growth model, the stock of this company is most likely:<\/p><\/div>","subj":"equity"},{"n":9,"q":"The Gordon growth model is most appropriate for valuing a company's stock when the company's:","opts":["earnings are expected to grow faster than the economy.","earnings are expected to include periods of very high or very low growth.","required return on equity is greater than its expected dividend growth rate."],"ans":"C","expl":"C is Correct because the Gordon growth model is most appropriate for valuing a company's stock when the required return on equity is greater than the expected growth rate.","explhtml":"<p>C is Correct because the Gordon growth model is most appropriate for valuing a company&#x27;s stock when the required return on equity is greater than the expected growth rate.<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>The Gordon growth model is most appropriate for valuing a company&#x27;s stock when the company&#x27;s:<\/p><\/div>","subj":"equity"},{"n":10,"q":"An analyst gathers the following information about a company's non-callable, fixed-rate perpetual preferred stock: If the investor's required return is 6%, the preferred stock is:","opts":["undervalued.","fairly valued.","overvalued."],"ans":"B","expl":"B is Correct because the current stock price is equal to the intrinsic value. If the dividend on such preferred stock is D, because payments extend into the indefinite future a perpetuity (a stream of level payments extending to infinity) exists in the constant amount of D. With g = 0, which is true because dividends are fixed for such preferred stock, the Gordon growth model becomes V0 = D/r. Here, D = 7% × $90 = $6.30. Thus V0 = $6.30/.06 = $105.","explhtml":"<p>B is Correct because the current stock price is equal to the intrinsic value. If the dividend on such preferred stock is D, because payments extend into the indefinite future a perpetuity (a stream of level payments extending to infinity) exists in the constant amount of D. With g = 0, which is true because dividends are fixed for such preferred stock, the Gordon growth model becomes V0 = D/r. Here, D = 7% × $90 = $6.30. Thus V0 = $6.30/.06 = $105.<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company&#x27;s non-callable, fixed-rate perpetual preferred stock:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp092.webp\" style=\"max-width:min(100%,545px)\" alt=\"\"><p>If the investor&#x27;s required return is 6%, the preferred stock is:<\/p><\/div>","subj":"equity"},{"n":11,"q":"An analyst gathers the following information about a company's non-callable, fixed-rate perpetual preferred stock: The capitalization rate of the stock is closest to:","opts":["4.8%.","5.0%.","5.2%."],"ans":"C","expl":"C is Correct because with g = 0, which is true because dividends are fixed for such preferred stock, the Gordon growth model becomes V0 = D /r. The discount rate, r, capitalizes the amount D, and for that reason is often called a capitalization rate. If V0 = D /r, then r = D/V0. The dividend is 5% × $50 = $2.50. Thus r = $2.50/$48 = 5.208% ≈ 5.2%","explhtml":"<p>C is Correct because with g = 0, which is true because dividends are fixed for such preferred stock, the Gordon growth model becomes V0 = D /r. The discount rate, r, capitalizes the amount D, and for that reason is often called a capitalization rate. If V0 = D /r, then r = D/V0. The dividend is 5% × $50 = $2.50. Thus r = $2.50/$48 = 5.208% ≈ 5.2%<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company&#x27;s non-callable, fixed-rate perpetual preferred stock:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp093.webp\" style=\"max-width:min(100%,545px)\" alt=\"\"><p>The capitalization rate of the stock is closest to:<\/p><\/div>","subj":"equity"},{"n":12,"q":"A stock priced at $28.45 per share is expected to pay a dividend of $1.23 next year. If the required rate of return is 9.2%, the implied growth rate of dividends is closest to:","opts":["4.32%.","4.67%.","4.88%."],"ans":"C","expl":"C is Correct because it is the implied growth rate of dividends based on the Gordon growth model. Using the Gordon growth model, V0 = D1/(r – g), the implied growth rate of dividends g = r – D1/V0 = 9.2% – $1.23/$28.45 ≈ 4.88%.","explhtml":"<p>C is Correct because it is the implied growth rate of dividends based on the Gordon growth model. Using the Gordon growth model, V0 = D1/(r – g), the implied growth rate of dividends g = r – D1/V0 = 9.2% – $1.23/$28.45 ≈ 4.88%.<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>A stock priced at $28.45 per share is expected to pay a dividend of $1.23 next year. If the required rate of return is 9.2%, the implied growth rate of dividends is closest to:<\/p><\/div>","subj":"equity"},{"n":13,"q":"An analyst gathers the following information about a company: If the required rate of return is 7%, the per share value of the company's stock is closest to:","opts":["$56.","$70.","$81"],"ans":"C","expl":"C is Correct because V0 = E1/r + PVG where: V0 is the value of the stock E1 is next years earnings E0 is previous years earnings V0 = $4.80/0.07 + $12.50 V0 = $81.07 ≈ $81","explhtml":"<p>C is Correct because V0 = E1/r + PVG where: V0 is the value of the stock E1 is next years earnings E0 is previous years earnings V0 = $4.80/0.07 + $12.50 V0 = $81.07 ≈ $81<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp094.webp\" style=\"max-width:min(100%,547px)\" alt=\"\"><p>If the required rate of return is 7%, the per share value of the company&#x27;s stock is closest to:<\/p><\/div>","subj":"equity"},{"n":14,"q":"A company has EPS of $3.50 and a stock price of $72 per share. If the required rate of return is 7.5%, the present value of growth opportunities is closest to:","opts":["$25.33.","$28.83.","$46.67."],"ans":"A","expl":"A is Correct because V0 = E1/r + PVGO where: V0= value per share E1 = expected earnings next year r = the capitalization rate PVGO = the present value of growth opportunities $72 = $3.50/0.075 + PVGO PVGO = $72 – $46.667 = $25.333 ≈ $25.33","explhtml":"<p>A is Correct because V0 = E1/r + PVGO where: V0= value per share E1 = expected earnings next year r = the capitalization rate PVGO = the present value of growth opportunities $72 = $3.50/0.075 + PVGO PVGO = $72 – $46.667 = $25.333 ≈ $25.33<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>A company has EPS of $3.50 and a stock price of $72 per share. If the required rate of return is 7.5%, the present value of growth opportunities is closest to:<\/p><\/div>","subj":"equity"},{"n":15,"q":"An analyst gathers the following information about a company: The justified leading P/E ratio of the company's stock is closest to:","opts":["7.8.","8.3.","1.8."],"ans":"A","expl":"A is Correct because the justified leading P/E ratio using the Gordon growth model is P0/E1= (1 – b)/(r – g) where b is the retention rate, r is the required return on equity and g is the dividend growth rate. The dividend payout ratio is 1 – b = D0/E0 = $1.00/$2.50 = 40% and thus P0/E1 = 0.4/(0.103 – 0.052) ≈ 7.84","explhtml":"<p>A is Correct because the justified leading P/E ratio using the Gordon growth model is P0/E1= (1 – b)/(r – g) where b is the retention rate, r is the required return on equity and g is the dividend growth rate. The dividend payout ratio is 1 – b = D0/E0 = $1.00/$2.50 = 40% and thus P0/E1 = 0.4/(0.103 – 0.052) ≈ 7.84<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp095.webp\" style=\"max-width:min(100%,544px)\" alt=\"\"><p>The justified leading P/E ratio of the company&#x27;s stock is closest to:<\/p><\/div>","subj":"equity"},{"n":16,"q":"An analyst gathers the following information about a company: Based on the Gordon growth model, the stock price of this company is:","opts":["undervalued.","fairly valued.","overvalued."],"ans":"C","expl":"C is Correct because using the Gordon growth model, the justified trailing P/E ratio is P0/E0 = [(1 – b) × (1 + g)]/(r – g), where b is the retention rate, g is the dividend growth rate and r is the required return on equity. The justified trailing P/E ratio is thus estimated as P0/E0 = [(1 – 0.45) × (1 + 0.04)]/(0.088 – 0.04) = (0.55 × 1.04)/0.048 = 0.572/0.048 ≈ 11.9. Comparing this to the actual trailing P/E ratio of 13.9, the stock of this company is overvalued.","explhtml":"<p>C is Correct because using the Gordon growth model, the justified trailing P/E ratio is P0/E0 = [(1 – b) × (1 + g)]/(r – g), where b is the retention rate, g is the dividend growth rate and r is the required return on equity. The justified trailing P/E ratio is thus estimated as P0/E0 = [(1 – 0.45) × (1 + 0.04)]/(0.088 – 0.04) = (0.55 × 1.04)/0.048 = 0.572/0.048 ≈ 11.9. Comparing this to the actual trailing P/E ratio of 13.9, the stock of this company is overvalued.<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp096.webp\" style=\"max-width:min(100%,545px)\" alt=\"\"><p>Based on the Gordon growth model, the stock price of this company is:<\/p><\/div>","subj":"equity"},{"n":17,"q":"An analyst gathers the following information about a company: Is the Gordon growth model an appropriate valuation model to use for valuing this company?","opts":["Yes","No, because the expected future dividend growth rate is negative","No, because the most recent dividend growth exceeds the required return on equity"],"ans":"A","expl":"A is Correct because it must be specified that the required return on equity must be greater than the expected growth rate: r > g. Here the expected future growth rate of dividends is less than the required return. Further, the model is appropriate for a declining dividend. Another case is a declining dividend—a negative growth rate. The Gordon growth model also accommodates this possibility.","explhtml":"<p>A is Correct because it must be specified that the required return on equity must be greater than the expected growth rate: r &gt; g. Here the expected future growth rate of dividends is less than the required return. Further, the model is appropriate for a declining dividend. Another case is a declining dividend—a negative growth rate. The Gordon growth model also accommodates this possibility.<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp097.webp\" style=\"max-width:min(100%,542px)\" alt=\"\"><p>Is the Gordon growth model an appropriate valuation model to use for valuing this company?<\/p><\/div>","subj":"equity"},{"n":18,"q":"A company in its early-stage growth phase of business most likely has:","opts":["negative free cash flow to equity.","above average but declining earnings growth rates.","investment opportunities that just earn the opportunity cost of capital."],"ans":"A","expl":"A is Correct because companies in the early-stage growth phase often have negative free cash flow to equity because the company invests heavily in expanding operations.","explhtml":"<p>A is Correct because companies in the early-stage growth phase often have negative free cash flow to equity because the company invests heavily in expanding operations.<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>A company in its early-stage growth phase of business most likely has:<\/p><\/div>","subj":"equity"},{"n":19,"q":"An analyst gathers the following information about three companies: Company 1: Earnings growth that is above average but declining toward the growth rate for the overall economy Company 2: Return on equity approaching the required return on equity Company 3: Negative free cash flow to equity The Gordon growth model is most appropriate to value:","opts":["Company 1.","Company 2.","Company 3."],"ans":"B","expl":"B is Correct because Company 2 is in its mature phase and the Gordon growth model is therefore appropriate. In the mature phase, the company reaches an equilibrium in which investment opportunities on average just earn their opportunity cost of capital. Return on equity approaches the required return on equity, and earnings growth, the dividend payout ratio, and the return on equity stabilize at levels that can be sustained long term. The dividend and earnings growth rate of this phase is called the mature growth rate. This phase, in fact, reflects the stage in which a company can properly be valued using the Gordon growth model, and that model is one tool for valuing this phase of a current high-growth company’s future.","explhtml":"<p>B is Correct because Company 2 is in its mature phase and the Gordon growth model is therefore appropriate. In the mature phase, the company reaches an equilibrium in which investment opportunities on average just earn their opportunity cost of capital. Return on equity approaches the required return on equity, and earnings growth, the dividend payout ratio, and the return on equity stabilize at levels that can be sustained long term. The dividend and earnings growth rate of this phase is called the mature growth rate. This phase, in fact, reflects the stage in which a company can properly be valued using the Gordon growth model, and that model is one tool for valuing this phase of a current high-growth company’s future.<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>An analyst gathers the following information about three companies: Company 1: Earnings growth that is above average but declining toward the growth rate for the overall economy Company 2: Return on equity approaching the required return on equity Company 3: Negative free cash flow to equity The Gordon growth model is most appropriate to value:<\/p><\/div>","subj":"equity"},{"n":20,"q":"Which of the following DDM models is most appropriate for valuing a company with a high initial dividend growth rate that is expected to steadily decline to a perpetual growth rate?","opts":["The H–model","The general two-stage model","The general three-stage model"],"ans":"A","expl":"A is Correct because in the H-model, the dividend growth rate is assumed to decline from an abnormal rate to the mature growth rate during the course of Stage 1. For example, the growth rate could begin at 15% and decline continuously in Stage 1 until it reaches 7%.","explhtml":"<p>A is Correct because in the H-model, the dividend growth rate is assumed to decline from an abnormal rate to the mature growth rate during the course of Stage 1. For example, the growth rate could begin at 15% and decline continuously in Stage 1 until it reaches 7%.<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>Which of the following DDM models is most appropriate for valuing a company with a high initial dividend growth rate that is expected to steadily decline to a perpetual growth rate?<\/p><\/div>","subj":"equity"},{"n":21,"q":"When using a general two-stage DDM, the terminal value of the stock can be estimated using the last dividend paid and:","opts":["only the short-term dividend growth rate.","only the long-term dividend growth rate.","both the short-term dividend growth rate and the long-term dividend growth rate."],"ans":"C","expl":"C is Correct because the estimate of the terminal value is given by Vn = [D0 × (1 + gS)n × (1+gL)]/(r – gL) where both the short-term dividend growth rate gS as well as the long-term dividend growth rate gL are required.","explhtml":"<p>C is Correct because the estimate of the terminal value is given by Vn = [D0 × (1 + gS)n × (1+gL)]/(r – gL) where both the short-term dividend growth rate gS as well as the long-term dividend growth rate gL are required.<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>When using a general two-stage DDM, the terminal value of the stock can be estimated using the last dividend paid and:<\/p><\/div>","subj":"equity"},{"n":22,"q":"An analyst gathers the following information about a company's common stock: If the required return is 10%, the per share value of the stock is closest to:","opts":["€113.46.","€118.18.","€123.37"],"ans":"C","expl":"C is Correct because this is the stock price from the two-stage model. V0 = t=1Σn D0(1 + gS)t /(1 + r)t + D0(1 + gS)n (1 + gL)/(1 + r)n(r − gL). D1 = €4.00 × (1 + 20%) = €4.80 D2 = €4.80 × (1 + 20%) = €5.76 D3 = €5.76 × (1 + 20%) = €6.912 D4 = €6.912 × (1 + 5%) = €7.2576 P3 = €7.2576/(10% – 5%) = €145.152 V0 = €4.80/(1 + 10%) + €5.76/(1 + 10%)2 + €6.912/(1 + 10%)3 + €145.152/(1 + 10%)3 V0 = €4.3636 + €4.7603 + €5.1931 + €109.0548 ≈ €123.37.","explhtml":"<p>C is Correct because this is the stock price from the two-stage model. V0 = t=1Σn D0(1 + gS)t /(1 + r)t + D0(1 + gS)n (1 + gL)/(1 + r)n(r − gL). D1 = €4.00 × (1 + 20%) = €4.80 D2 = €4.80 × (1 + 20%) = €5.76 D3 = €5.76 × (1 + 20%) = €6.912 D4 = €6.912 × (1 + 5%) = €7.2576 P3 = €7.2576/(10% – 5%) = €145.152 V0 = €4.80/(1 + 10%) + €5.76/(1 + 10%)2 + €6.912/(1 + 10%)3 + €145.152/(1 + 10%)3 V0 = €4.3636 + €4.7603 + €5.1931 + €109.0548 ≈ €123.37.<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company&#x27;s common stock:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp098.webp\" style=\"max-width:min(100%,545px)\" alt=\"\"><p>If the required return is 10%, the per share value of the stock is closest to:<\/p><\/div>","subj":"equity"},{"n":23,"q":"An analyst gathers the following information about a company's common stock: If the required return is 14%, the per share value of the stock is closest to:","opts":["€85.00.","€93.33.","€135.00."],"ans":"A","expl":"A is Correct because this is the stock price from the H-model. V0 = [D0(1 + gL) + D0H(gS − gL)]/(r − gL), where H = half-life in years of the high growth period. Here, H = 12/2 = 6 years. V0 = [€3.00 × (1 + 5%) + €3.00 × 6 × (30% – 5%)]/(14% – 5%) V0 = [€3.15 + €4.50]/.09 = €85.00.","explhtml":"<p>A is Correct because this is the stock price from the H-model. V0 = [D0(1 + gL) + D0H(gS − gL)]/(r − gL), where H = half-life in years of the high growth period. Here, H = 12/2 = 6 years. V0 = [€3.00 × (1 + 5%) + €3.00 × 6 × (30% – 5%)]/(14% – 5%) V0 = [€3.15 + €4.50]/.09 = €85.00.<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company&#x27;s common stock:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp099.webp\" style=\"max-width:min(100%,699px)\" alt=\"\"><p>If the required return is 14%, the per share value of the stock is closest to:<\/p><\/div>","subj":"equity"},{"n":24,"q":"An analyst values a company's stock using different assumed dividend growth patterns with the objective of testing the sensitivity of the stock's value to these assumptions. Is a spreadsheet model appropriate for the analyst to use?","opts":["Yes","No, because a stock's dividend patterns must be stable","No, because a spreadsheet model cannot test sensitivity"],"ans":"A","expl":"A is Correct because DDMs, such as the Gordon growth model and the multistage models, assume stylized patterns of dividend growth. An analyst can use any assumed dividend pattern, however, to create a spreadsheet to value the stock and to test sensitivity of the value to growth and return assumptions.","explhtml":"<p>A is Correct because DDMs, such as the Gordon growth model and the multistage models, assume stylized patterns of dividend growth. An analyst can use any assumed dividend pattern, however, to create a spreadsheet to value the stock and to test sensitivity of the value to growth and return assumptions.<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>An analyst values a company&#x27;s stock using different assumed dividend growth patterns with the objective of testing the sensitivity of the stock&#x27;s value to these assumptions. Is a spreadsheet model appropriate for the analyst to use?<\/p><\/div>","subj":"equity"},{"n":25,"q":"An analyst gathers the following information about a stock: If the short-term growth rate declines gradually over six years to the long-term growth rate, the stock's expected rate of return is closest to:","opts":["9.53%.","0.13%.","10.73%"],"ans":"B","expl":"B is Correct because from the H-model, V0 = D0 (1 + gL)/(r − gL) + D0 H (gS − gL)/(r − gL) the expected return can be calculated as : r = (D0/V0) [(1 + gL) + H(gS – gL)] + gL where:r = the expected rate of return D0 = the current dividend V0 = the stock price gL = the long term growth rate gS = the short term growth rate H = half of the the transition period r = 0.0333[(1 + 0.06) + 3(0.12 – 0.06)] + 0.06 r = 0.0333 [1.06 + 0.18] + 0.06 r = 0.10131 ≈ 10.13%","explhtml":"<p>B is Correct because from the H-model, V0 = D0 (1 + gL)/(r − gL) + D0 H (gS − gL)/(r − gL) the expected return can be calculated as : r = (D0/V0) [(1 + gL) + H(gS – gL)] + gL where:r = the expected rate of return D0 = the current dividend V0 = the stock price gL = the long term growth rate gS = the short term growth rate H = half of the the transition period r = 0.0333[(1 + 0.06) + 3(0.12 – 0.06)] + 0.06 r = 0.0333 [1.06 + 0.18] + 0.06 r = 0.10131 ≈ 10.13%<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a stock:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp100.webp\" style=\"max-width:min(100%,542px)\" alt=\"\"><p>If the short-term growth rate declines gradually over six years to the long-term growth rate, the stock&#x27;s expected rate of return is closest to:<\/p><\/div>","subj":"equity"},{"n":26,"q":"All else being equal, which of the following would increase the expected rate of return when applying the H-model?","opts":["A decrease in the transition period","A decrease in the long-term growth rate","An increase in the short-term growth rate"],"ans":"C","expl":"C is Correct because an increase in the short-term growth rate (Gs) would result in a higher expected return: r = (D0/P0) [(1 + gL) + H(gS – gL)] + gL where: r = the expected rate of return D0 = the current dividend P0 = the stock price gL = the long-term growth rate gS = the short-term growth rate H = half the the transition period","explhtml":"<p>C is Correct because an increase in the short-term growth rate (Gs) would result in a higher expected return: r = (D0/P0) [(1 + gL) + H(gS – gL)] + gL where: r = the expected rate of return D0 = the current dividend P0 = the stock price gL = the long-term growth rate gS = the short-term growth rate H = half the the transition period<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>All else being equal, which of the following would increase the expected rate of return when applying the H-model?<\/p><\/div>","subj":"equity"},{"n":27,"q":"An analyst estimates the following financial ratios for a company: The company's sustainable growth rate is closest to:","opts":["12%.","22%.","33%"],"ans":"B","expl":"B is Correct because growth is a function of profit margin (P), retention rate (R), asset turnover (A), and financial leverage (T). The sustainable growth rate is calculated as g = retention rate × profit margin × asset turnover × financial leverage (equity multiplier) = (1 – dividend payout ratio) × profit margin × asset turnover × financial leverage (equity multiplier) = (1 – 0.35) × 0.08 × 0.8 × 5.2 ≈ 21.6%.","explhtml":"<p>B is Correct because growth is a function of profit margin (P), retention rate (R), asset turnover (A), and financial leverage (T). The sustainable growth rate is calculated as g = retention rate × profit margin × asset turnover × financial leverage (equity multiplier) = (1 – dividend payout ratio) × profit margin × asset turnover × financial leverage (equity multiplier) = (1 – 0.35) × 0.08 × 0.8 × 5.2 ≈ 21.6%.<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>An analyst estimates the following financial ratios for a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp101.webp\" style=\"max-width:min(100%,544px)\" alt=\"\"><p>The company&#x27;s sustainable growth rate is closest to:<\/p><\/div>","subj":"equity"},{"n":28,"q":"A company's sustainable growth rate will increase when there is a decrease in:","opts":["asset turnover.","financial leverage.","dividend payout ratio."],"ans":"C","expl":"C is Correct because the sustainable growth, g = retention rate × profit margin × asset turnover × financial leverage. All else being equal, as dividend payout ratio (1 – retention ratio) decreases, retention rate increases, resulting in a higher sustainable growth rate.","explhtml":"<p>C is Correct because the sustainable growth, g = retention rate × profit margin × asset turnover × financial leverage. All else being equal, as dividend payout ratio (1 – retention ratio) decreases, retention rate increases, resulting in a higher sustainable growth rate.<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>A company&#x27;s sustainable growth rate will increase when there is a decrease in:<\/p><\/div>","subj":"equity"},{"n":29,"q":"An analyst gathers the following information about a company's common stock: The analyst considers a security trading within a band of +/– 10% of her estimate of intrinsic value to be fairly valued. If the required return is 17%, the common stock is:","opts":["undervalued.","fairly valued.","overvalued."],"ans":"C","expl":"C is Correct because based on the two-stage model, V0 = t=1Σn D0(1 + gS)t /(1 + r)t + D0(1 + gS)n (1 + gL)/(1 + r)n(r − gL). D1 = $2.00 × (1 + 20%) = $2.40 D2 = $2.40 × (1 + 20%) = $2.88 D3 = $2.88 × (1 + 20%) = $3.456 D4 = $3.456 × (1 + 6%) = $3.6634 P3 = $3.6634/(17% – 6%) = $33.303 V0 = $2.40/(1 + 17%) + $2.88/(1 + 17%)2 + $3.456/(1 + 17%)3 + $33.303/(1 + 3 17%) V0 = $2.051 + $2.104 + $2.158 + $20.793 ≈ $27.11. The fair value band is +/– 10%. $27.11 × (1 + 10%) ≈ $29.82 high end of band and $27.24 × (1 – 10%) ≈ $24.40 low end of band. The current share price of $31.00 exceeds the fair value band and thus the stock is overvalued.","explhtml":"<p>C is Correct because based on the two-stage model, V0 = t=1Σn D0(1 + gS)t /(1 + r)t + D0(1 + gS)n (1 + gL)/(1 + r)n(r − gL). D1 = $2.00 × (1 + 20%) = $2.40 D2 = $2.40 × (1 + 20%) = $2.88 D3 = $2.88 × (1 + 20%) = $3.456 D4 = $3.456 × (1 + 6%) = $3.6634 P3 = $3.6634/(17% – 6%) = $33.303 V0 = $2.40/(1 + 17%) + $2.88/(1 + 17%)2 + $3.456/(1 + 17%)3 + $33.303/(1 + 3 17%) V0 = $2.051 + $2.104 + $2.158 + $20.793 ≈ $27.11. The fair value band is +/– 10%. $27.11 × (1 + 10%) ≈ $29.82 high end of band and $27.24 × (1 – 10%) ≈ $24.40 low end of band. The current share price of $31.00 exceeds the fair value band and thus the stock is overvalued.<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company&#x27;s common stock:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp102.webp\" style=\"max-width:min(100%,544px)\" alt=\"\"><p>The analyst considers a security trading within a band of +/– 10% of her estimate of intrinsic value to be fairly valued. If the required return is 17%, the common stock is:<\/p><\/div>","subj":"equity"},{"n":30,"q":"An analyst gathers the following information about a company's common stock: The analyst considers a security trading within a band of +/– 10% of her estimate of intrinsic value to be fairly valued. If the required return is 15%, the common stock is:","opts":["undervalued.","fairly valued.","overvalued."],"ans":"B","expl":"B is Correct because the value of the stock using the H-model is V0 = [D0(1 + gL) + D0H(gS − gL)]/(r − gL), where H = half-life in years of the high growth period. Here, H = 8/2 = 4 years. V0 = [€2.00(1 + 5%) + €2.00 × 4(20% - 5%)]/(15% - 5%) V0 = [€2.10 + €1.20]/.10 = €3.30/.10 = €33.00 intrinsic value estimate. The fairly valued band is +/– 10%, or €33.00 × (1 + 10%) = €36.30 on the high end and €33.00 × (1 - 10%) = €29.70 on the low end. The current market price of €33.50 falls within this band.","explhtml":"<p>B is Correct because the value of the stock using the H-model is V0 = [D0(1 + gL) + D0H(gS − gL)]/(r − gL), where H = half-life in years of the high growth period. Here, H = 8/2 = 4 years. V0 = [€2.00(1 + 5%) + €2.00 × 4(20% - 5%)]/(15% - 5%) V0 = [€2.10 + €1.20]/.10 = €3.30/.10 = €33.00 intrinsic value estimate. The fairly valued band is +/– 10%, or €33.00 × (1 + 10%) = €36.30 on the high end and €33.00 × (1 - 10%) = €29.70 on the low end. The current market price of €33.50 falls within this band.<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company&#x27;s common stock:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp103.webp\" style=\"max-width:min(100%,694px)\" alt=\"\"><p>The analyst considers a security trading within a band of +/– 10% of her estimate of intrinsic value to be fairly valued. If the required return is 15%, the common stock is:<\/p><\/div>","subj":"equity"},{"n":31,"q":"An analyst using a free cash flow model estimates a firm's FCFE and WACC to value the firm's equity. Is the analyst using the appropriate inputs?","opts":["Yes","No, the analyst should estimate FCFE and the required rate of return on equity","No, the analyst should estimate FCFF and the required rate of return on equity"],"ans":"B","expl":"B is Correct because the analyst should use the required rate of return to equity instead of the WACC when valuing a firm using the FCFE valuation approach. FCFE is the cash flow remaining for equity holders after all other claims have been satisfied. Discounting FCFE by r (the required rate of return on equity) gives the value of the firm’s equity.","explhtml":"<p>B is Correct because the analyst should use the required rate of return to equity instead of the WACC when valuing a firm using the FCFE valuation approach. FCFE is the cash flow remaining for equity holders after all other claims have been satisfied. Discounting FCFE by r (the required rate of return on equity) gives the value of the firm’s equity.<\/p>","qhtml":"<div class=\"pp-topic\">Free Cash Flow Valuation<\/div><div class=\"qtext\"><p>An analyst using a free cash flow model estimates a firm&#x27;s FCFE and WACC to value the firm&#x27;s equity. Is the analyst using the appropriate inputs?<\/p><\/div>","subj":"equity"},{"n":32,"q":"To estimate the value of a company's equity, FCFE should be discounted by the:","opts":["WACC.","risk-free rate.","required rate of return on equity."],"ans":"C","expl":"C is Correct because the value of equity can also be found by discounting FCFE at the required rate of return on equity, r.","explhtml":"<p>C is Correct because the value of equity can also be found by discounting FCFE at the required rate of return on equity, r.<\/p>","qhtml":"<div class=\"pp-topic\">Free Cash Flow Valuation<\/div><div class=\"qtext\"><p>To estimate the value of a company&#x27;s equity, FCFE should be discounted by the:<\/p><\/div>","subj":"equity"},{"n":33,"q":"An analyst gathers the following information (in $ millions) from a company's financial statements: If the corporate tax rate is 25%, what is the company's FCFF (in $ millions) in Year 2?","opts":["–$237","$163","$174"],"ans":"B","expl":"B is Correct because FCFF = NI + NCC + Int(1 – Tax rate) – FCInv – WCInv. Also, the adjustment for net increases in working capital represents the net investment in current assets (such as accounts receivable) less current liabilities (such as accounts payable). WCInv = change in NWC = 300 – 500 = –$200. FCInv = change in gross fixed assets = $6,800 – $6,000 = $800. FCFF = $330 + 400 + 44 × (1 – 25%) – $800 – (–$200) = $330 + $400 + $33 – $800 + $200 = $163.","explhtml":"<p>B is Correct because FCFF = NI + NCC + Int(1 – Tax rate) – FCInv – WCInv. Also, the adjustment for net increases in working capital represents the net investment in current assets (such as accounts receivable) less current liabilities (such as accounts payable). WCInv = change in NWC = 300 – 500 = –$200. FCInv = change in gross fixed assets = $6,800 – $6,000 = $800. FCFF = $330 + 400 + 44 × (1 – 25%) – $800 – (–$200) = $330 + $400 + $33 – $800 + $200 = $163.<\/p>","qhtml":"<div class=\"pp-topic\">Free Cash Flow Valuation<\/div><div class=\"qtext\"><p>An analyst gathers the following information (in $ millions) from a company&#x27;s financial statements:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp104.webp\" style=\"max-width:min(100%,544px)\" alt=\"\"><p>If the corporate tax rate is 25%, what is the company&#x27;s FCFF (in $ millions) in Year 2?<\/p><\/div>","subj":"equity"},{"n":34,"q":"An analyst gathers the following information (in $ millions) about a company: If the corporate tax rate is 20%, what is the company's free cash flow to equity (in $ millions)?","opts":["$926","$940","$996"],"ans":"B","expl":"B is Correct because FCFE = FCFF – Int(1 – Tax rate) + Net borrowing. FCFE = – $4 – $70(1 – 20%) + $1,000 = $940.","explhtml":"<p>B is Correct because FCFE = FCFF – Int(1 – Tax rate) + Net borrowing. FCFE = – $4 – $70(1 – 20%) + $1,000 = $940.<\/p>","qhtml":"<div class=\"pp-topic\">Free Cash Flow Valuation<\/div><div class=\"qtext\"><p>An analyst gathers the following information (in $ millions) about a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp105.webp\" style=\"max-width:min(100%,545px)\" alt=\"\"><p>If the corporate tax rate is 20%, what is the company&#x27;s free cash flow to equity (in $ millions)?<\/p><\/div>","subj":"equity"},{"n":35,"q":"For a company that reports under US GAAP, an analyst estimates its FCFF by adding back pretax interest expense to cash flow from operating activities and subtracting investment in fixed capital. Is the analyst correct?","opts":["Yes","No, the analyst should add investment in fixed capital","No, the analyst should add back after-tax interest expense"],"ans":"C","expl":"C is Correct because the analyst should calculate the FCFF by adding back after-tax interest expense to cash flow from operations and subtracting investment in fixed capital. The after-tax interest expense is added back because it was previously taken out of net income but must be included in FCFF because it is a component of the total cash flows available to all suppliers of the firm’s capital.","explhtml":"<p>C is Correct because the analyst should calculate the FCFF by adding back after-tax interest expense to cash flow from operations and subtracting investment in fixed capital. The after-tax interest expense is added back because it was previously taken out of net income but must be included in FCFF because it is a component of the total cash flows available to all suppliers of the firm’s capital.<\/p>","qhtml":"<div class=\"pp-topic\">Free Cash Flow Valuation<\/div><div class=\"qtext\"><p>For a company that reports under US GAAP, an analyst estimates its FCFF by adding back pretax interest expense to cash flow from operating activities and subtracting investment in fixed capital. Is the analyst correct?<\/p><\/div>","subj":"equity"},{"n":36,"q":"An analyst estimates a company's FCFF by summing cash flow from operations, depreciation, after-tax interest expense, and then subtracting the investment in fixed capital. An error is made in the computation regarding the treatment of:","opts":["depreciation.","interest expense.","investment in fixed capital."],"ans":"A","expl":"A is Correct because FCFF = Cash flow from operations plus Interest expense × (1 − tax rate) less Investment in fixed capital, or FCFF = CFO + Int(1 – tax rate) – FCInv. Neither depreciation nor the investment in working capital appears in the equation because both are already included in CFO.","explhtml":"<p>A is Correct because FCFF = Cash flow from operations plus Interest expense × (1 − tax rate) less Investment in fixed capital, or FCFF = CFO + Int(1 – tax rate) – FCInv. Neither depreciation nor the investment in working capital appears in the equation because both are already included in CFO.<\/p>","qhtml":"<div class=\"pp-topic\">Free Cash Flow Valuation<\/div><div class=\"qtext\"><p>An analyst estimates a company&#x27;s FCFF by summing cash flow from operations, depreciation, after-tax interest expense, and then subtracting the investment in fixed capital. An error is made in the computation regarding the treatment of:<\/p><\/div>","subj":"equity"},{"n":37,"q":"Compared to the DDM, the FCFE model:","opts":["is less time-consuming to estimate.","is more suitable to value companies that do not pay dividends.","measures the actual cash flow going to the company's shareholders."],"ans":"B","expl":"B is Correct because many analysts have a strong preference for free cash flow valuation models over dividend discount model. First, many corporations pay no, or very low, cash dividends. Using a DDM to value these companies is difficult because they require forecasts about when dividends will be initiated, the level of dividends at initiation, and the growth rate or rates from that point forward.","explhtml":"<p>B is Correct because many analysts have a strong preference for free cash flow valuation models over dividend discount model. First, many corporations pay no, or very low, cash dividends. Using a DDM to value these companies is difficult because they require forecasts about when dividends will be initiated, the level of dividends at initiation, and the growth rate or rates from that point forward.<\/p>","qhtml":"<div class=\"pp-topic\">Free Cash Flow Valuation<\/div><div class=\"qtext\"><p>Compared to the DDM, the FCFE model:<\/p><\/div>","subj":"equity"},{"n":38,"q":"An analyst is evaluating a company for a potential takeover. Which of the following measures is most suitable for this valuation?","opts":["FCFE","Dividends","Cash flow from operations"],"ans":"A","expl":"A is Correct because dividends are the cash flow actually going to shareholders whereas free cash flow to equity (FCFE) is the cash flow available to be distributed to shareholders without impairing the company’s value. If a company is being analyzed because it is a target for takeover, free cash flow is the appropriate cash flow measure; once the company is taken over, the new owners will have discretion over how free cash flow is used including its distribution in the form of dividends. The advantage of FCFF and FCFE over other cash-flow concepts is that they can be used directly in a DCF framework to value the firm or to value equity.","explhtml":"<p>A is Correct because dividends are the cash flow actually going to shareholders whereas free cash flow to equity (FCFE) is the cash flow available to be distributed to shareholders without impairing the company’s value. If a company is being analyzed because it is a target for takeover, free cash flow is the appropriate cash flow measure; once the company is taken over, the new owners will have discretion over how free cash flow is used including its distribution in the form of dividends. The advantage of FCFF and FCFE over other cash-flow concepts is that they can be used directly in a DCF framework to value the firm or to value equity.<\/p>","qhtml":"<div class=\"pp-topic\">Free Cash Flow Valuation<\/div><div class=\"qtext\"><p>An analyst is evaluating a company for a potential takeover. Which of the following measures is most suitable for this valuation?<\/p><\/div>","subj":"equity"},{"n":39,"q":"An analyst calculates FCFE to evaluate a company. Which of the following actions by the company most likely impacts its future FCFE?","opts":["Issuing new shares","Borrowing from a bank","Paying common share dividends"],"ans":"B","expl":"B is Correct because for FCFE, leverage changes, such as the use of more debt financing, have some impact on free cash flow because they increase the interest tax shield (reduce corporate taxes because of the tax deductibility of interest) and reduce the cash flow available to equity. Therefore, borrowing from a bank impacts a company’s FCFE.","explhtml":"<p>B is Correct because for FCFE, leverage changes, such as the use of more debt financing, have some impact on free cash flow because they increase the interest tax shield (reduce corporate taxes because of the tax deductibility of interest) and reduce the cash flow available to equity. Therefore, borrowing from a bank impacts a company’s FCFE.<\/p>","qhtml":"<div class=\"pp-topic\">Free Cash Flow Valuation<\/div><div class=\"qtext\"><p>An analyst calculates FCFE to evaluate a company. Which of the following actions by the company most likely impacts its future FCFE?<\/p><\/div>","subj":"equity"},{"n":40,"q":"A company’s new investments in fixed assets is equal to its depreciation and there are no changes in working capital or net borrowing. The company’s net income is:","opts":["less than its FCFE.","equal to its FCFE.","greater than its FCFE."],"ans":"B","expl":"B is Correct because a special case exists in which net income and FCFE are the same. This case occurs when new investments exactly equal depreciation and the company is not investing in working capital or engaging in any net borrowing.","explhtml":"<p>B is Correct because a special case exists in which net income and FCFE are the same. This case occurs when new investments exactly equal depreciation and the company is not investing in working capital or engaging in any net borrowing.<\/p>","qhtml":"<div class=\"pp-topic\">Free Cash Flow Valuation<\/div><div class=\"qtext\"><p>A company’s new investments in fixed assets is equal to its depreciation and there are no changes in working capital or net borrowing. The company’s net income is:<\/p><\/div>","subj":"equity"},{"n":41,"q":"Which of the following factors causes EBITDA to be a poor proxy for FCFF? Not accounting for:","opts":["after-tax interest cost","depreciation tax shield","cash flow from new borrowings"],"ans":"B","expl":"B is Correct because EBITDA is a poor proxy for free cash flow to the firm because it does not account for the depreciation tax shield and the investment in fixed capital and working capital.","explhtml":"<p>B is Correct because EBITDA is a poor proxy for free cash flow to the firm because it does not account for the depreciation tax shield and the investment in fixed capital and working capital.<\/p>","qhtml":"<div class=\"pp-topic\">Free Cash Flow Valuation<\/div><div class=\"qtext\"><p>Which of the following factors causes EBITDA to be a poor proxy for FCFF? Not accounting for:<\/p><\/div>","subj":"equity"},{"n":42,"q":"An analyst gathers the following information about a company: The firm value is closest to:","opts":["$147 million.","$173 million.","$210 million."],"ans":"C","expl":"C is Correct because the growth rate of 5% is used. Firm value = FCFF0 (1+g) / (WACC – g) = ($10 million × 1.05) / (0.1 – 0.05) = 10.5 / 0.05 = 210 million","explhtml":"<p>C is Correct because the growth rate of 5% is used. Firm value = FCFF0 (1+g) / (WACC – g) = ($10 million × 1.05) / (0.1 – 0.05) = 10.5 / 0.05 = 210 million<\/p>","qhtml":"<div class=\"pp-topic\">Free Cash Flow Valuation<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp106.webp\" style=\"max-width:min(100%,540px)\" alt=\"\"><p>The firm value is closest to:<\/p><\/div>","subj":"equity"},{"n":43,"q":"A portfolio manager analyzes a growing technology company. The portfolio manager expects the company's growth will slow after three years, and there will be no growth after five years. The most appropriate model to value this company is the:","opts":["two-stage FCFF valuation model.","three-stage FCFF valuation model.","stable-growth FCFF valuation model."],"ans":"B","expl":"B is Correct because three-stage models are a straightforward extension of the two-stage models. One common version of a three-stage model is to assume a constant growth rate in each of the three stages. In this case, the first stage of high growth is followed by the second stage of slow growth and a third stage of no growth. Therefore, using a three-stage model is correct.","explhtml":"<p>B is Correct because three-stage models are a straightforward extension of the two-stage models. One common version of a three-stage model is to assume a constant growth rate in each of the three stages. In this case, the first stage of high growth is followed by the second stage of slow growth and a third stage of no growth. Therefore, using a three-stage model is correct.<\/p>","qhtml":"<div class=\"pp-topic\">Free Cash Flow Valuation<\/div><div class=\"qtext\"><p>A portfolio manager analyzes a growing technology company. The portfolio manager expects the company&#x27;s growth will slow after three years, and there will be no growth after five years. The most appropriate model to value this company is the:<\/p><\/div>","subj":"equity"},{"n":44,"q":"An analyst gathers the following information about a company: If the required rate of return for equity is 12%, the company's stock value using FCFE valuation model at Year 0 is closest to:","opts":["$40.","$59.","$70."],"ans":"B","expl":"B is Correct because FCFE = NI – (FCInv – Dep) – WCInv + Net borrowing. Step 1: Calculate the FCFE Step 2: Calculate the terminal value (TV) at Year 3 TVyear 3 = FCFE4 / (r – g) = $4.925 / (12% – 5%) = $70.3571 ≈ $70.357 Step 3: Calculate the present value of the first three years' FCFE + TV: V0 = ($3.4/1.12) + ($3.74/(1.12)2) + ($4.114/(1.12)3) + ($70.3571/(1.12)3) =$59.024 ≈ $59.","explhtml":"<p>B is Correct because FCFE = NI – (FCInv – Dep) – WCInv + Net borrowing. Step 1: Calculate the FCFE<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp129.webp\" style=\"max-width:min(100%,721px)\" alt=\"\"><p>Step 2: Calculate the terminal value (TV) at Year 3 TVyear 3 = FCFE4 / (r – g) = $4.925 / (12% – 5%) = $70.3571 ≈ $70.357 Step 3: Calculate the present value of the first three years&#x27; FCFE + TV: V0 = ($3.4/1.12) + ($3.74/(1.12)2) + ($4.114/(1.12)3) + ($70.3571/(1.12)3) =$59.024 ≈ $59.<\/p>","qhtml":"<div class=\"pp-topic\">Free Cash Flow Valuation<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp107.webp\" style=\"max-width:min(100%,721px)\" alt=\"\"><p>If the required rate of return for equity is 12%, the company&#x27;s stock value using FCFE valuation model at Year 0 is closest to:<\/p><\/div>","subj":"equity"},{"n":45,"q":"An analyst is evaluating a company by using a three- stage FCFF growth model. The analyst has gathered the following information: The total value of the company is closest to:","opts":["$6,942 million.","$7,578 million.","$9,308 million."],"ans":"C","expl":"C is Correct because the firm value = total present value of the first four years of FCFF + present value of the terminal value at year 4. Step 1: Calculate the FCFF Step 2: Calculate the terminal value at the end of Year 4 Terminal Value4 = FCFF5 / (WACC – g) = $665.694 / (10% – 4%) = 11,094.893 ≈ 11,094.89 million. The
