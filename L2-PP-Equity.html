 present value of this amount discounted at 10% for four years is: Present value of Terminal Value4 = 11,094.89 / (1+10%)4 = $7,577.961 ≈ $ 7,577.96 million. Step 3: The value of the firm: $418.18 + $437.19 + $437.19 + $437.19 + $7,577.96 = $9,307.713 ≈ $9,308 million.","explhtml":"<p>C is Correct because the firm value = total present value of the first four years of FCFF + present value of the terminal value at year 4. Step 1: Calculate the FCFF<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp130.webp\" style=\"max-width:min(100%,721px)\" alt=\"\"><p>Step 2: Calculate the terminal value at the end of Year 4 Terminal Value4 = FCFF5 / (WACC – g) = $665.694 / (10% – 4%) = 11,094.893 ≈ 11,094.89 million. The present value of this amount discounted at 10% for four years is: Present value of Terminal Value4 = 11,094.89 / (1+10%)4 = $7,577.961 ≈ $ 7,577.96 million. Step 3: The value of the firm: $418.18 + $437.19 + $437.19 + $437.19 + $7,577.96 = $9,307.713 ≈ $9,308 million.<\/p>","qhtml":"<div class=\"pp-topic\">Free Cash Flow Valuation<\/div><div class=\"qtext\"><p>An analyst is evaluating a company by using a three- stage FCFF growth model. The analyst has gathered the following information:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp108.webp\" style=\"max-width:min(100%,547px)\" alt=\"\"><p>The total value of the company is closest to:<\/p><\/div>","subj":"equity"},{"n":46,"q":"An analyst reviews the following information: Based on this information, the company's value is most sensitive to changes in the:","opts":["cost of debt.","cost of equity.","manufacturing costs."],"ans":"A","expl":"A is Correct because to examine how sensitive the final valuation is to changes in each of a valuation model’s input variables, a sensitivity analysis can be performed. Range = Valuation with Low Estimate minus Valuation with High Estimate Range for cost of debt = $540 million − $240 million = $300 million Range for cost of equity = $370 million − $230 million = $140 million Range for manufacturing costs = $410 million − $300 million = $110 million The valuation is most sensitive to the cost of debt because its range of estimated values is larger than the ranges for the cost of equity and for manufacturing costs.","explhtml":"<p>A is Correct because to examine how sensitive the final valuation is to changes in each of a valuation model’s input variables, a sensitivity analysis can be performed. Range = Valuation with Low Estimate minus Valuation with High Estimate Range for cost of debt = $540 million − $240 million = $300 million Range for cost of equity = $370 million − $230 million = $140 million Range for manufacturing costs = $410 million − $300 million = $110 million The valuation is most sensitive to the cost of debt because its range of estimated values is larger than the ranges for the cost of equity and for manufacturing costs.<\/p>","qhtml":"<div class=\"pp-topic\">Free Cash Flow Valuation<\/div><div class=\"qtext\"><p>An analyst reviews the following information: Based on this information, the company&#x27;s value is most sensitive to changes in the:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp109.webp\" style=\"max-width:min(100%,721px)\" alt=\"\"><\/div>","subj":"equity"},{"n":47,"q":"A company has received a low ESG score. The available ESG-related information about the company is qualitative only. Which of the following is most appropriate when calculating the company's terminal value?","opts":["Adjust the cost of equity by adding a risk premium","Adjust the projected free cash flows to reflect the ESG risks","Make no adjustment because qualitative ESG is difficult to quantify"],"ans":"A","expl":"A is Correct because qualitative ESG-related information is more challenging to integrate. One approach to address this challenge is to adjust the cost of equity by adding a risk premium in a valuation model.","explhtml":"<p>A is Correct because qualitative ESG-related information is more challenging to integrate. One approach to address this challenge is to adjust the cost of equity by adding a risk premium in a valuation model.<\/p>","qhtml":"<div class=\"pp-topic\">Free Cash Flow Valuation<\/div><div class=\"qtext\"><p>A company has received a low ESG score. The available ESG-related information about the company is qualitative only. Which of the following is most appropriate when calculating the company&#x27;s terminal value?<\/p><\/div>","subj":"equity"},{"n":48,"q":"In the two-stage free cash flow model to estimate equity value, the terminal value is determined by using the:","opts":["constant-growth FCFE model.","constant-growth FCFF model.","free cash flow divided by the growth rate."],"ans":"A","expl":"A is Correct because equity value = t=1Σn FCFEt / ( 1 + r )t + (FCFE n+1 / (r – g)) × (1 / (1 + r)n ). The terminal value of the stock at t = n, TVn, is found by using the constant-growth FCFE model.","explhtml":"<p>A is Correct because equity value = t=1Σn FCFEt / ( 1 + r )t + (FCFE n+1 / (r – g)) × (1 / (1 + r)n ). The terminal value of the stock at t = n, TVn, is found by using the constant-growth FCFE model.<\/p>","qhtml":"<div class=\"pp-topic\">Free Cash Flow Valuation<\/div><div class=\"qtext\"><p>In the two-stage free cash flow model to estimate equity value, the terminal value is determined by using the:<\/p><\/div>","subj":"equity"},{"n":49,"q":"An analyst estimates a company's stock value using a residual income model, then divides this value by the company's book value per share. The resulting ratio is subsequently compared to the company's actual P/B ratio. The analyst's approach to valuation is best described as the:","opts":["method of comparables.","method based on forecasted fundamentals.","momentum indicator based on fundamentals."],"ans":"B","expl":"B is Correct because the method based on forecasted fundamentals refers to the use of multiples that are derived from forecasted fundamentals— characteristics of a business related to profitability, growth, or financial strength. An example of a justified multiple based on fundamentals: Suppose that we are using a residual income model and estimate that the value of the stock is $46. Then, the justified P/B based on forecasted fundamentals is $46/$23 ($23 is the current book value per share) = 2.0, which we can again compare with the actual value of the stock’s P/B","explhtml":"<p>B is Correct because the method based on forecasted fundamentals refers to the use of multiples that are derived from forecasted fundamentals— characteristics of a business related to profitability, growth, or financial strength. An example of a justified multiple based on fundamentals: Suppose that we are using a residual income model and estimate that the value of the stock is $46. Then, the justified P/B based on forecasted fundamentals is $46/$23 ($23 is the current book value per share) = 2.0, which we can again compare with the actual value of the stock’s P/B<\/p>","qhtml":"<div class=\"pp-topic\">Market-Based Valuation: Price and Enterprise Value Multiples<\/div><div class=\"qtext\"><p>An analyst estimates a company&#x27;s stock value using a residual income model, then divides this value by the company&#x27;s book value per share. The resulting ratio is subsequently compared to the company&#x27;s actual P/B ratio. The analyst&#x27;s approach to valuation is best described as the:<\/p><\/div>","subj":"equity"},{"n":50,"q":"An analyst gathers the following data for a company: The justified multiple based on the method of comparables indicates that the company is:","opts":["undervalued.","fairly valued.","overvalued."],"ans":"A","expl":"A is Correct because the justified price to book of 2.5 (based on its peers) is larger than the actual price-to-book of 2.0, which is calculated by $50 / $25. The justified price multiple is the estimated fair value of that multiple, which can be justified on the basis of the method of comparables or the method of forecasted fundamentals. If the justified P/B is larger (smaller) than the actual P/B, the stock may be undervalued (overvalued). The justified price to book of 2.5 (based on its peers) is larger than the actual price-to-book of 2.0 (calculated by $50 / $25); therefore, the stock is undervalued based on the data in the table relative to its peers.","explhtml":"<p>A is Correct because the justified price to book of 2.5 (based on its peers) is larger than the actual price-to-book of 2.0, which is calculated by $50 / $25. The justified price multiple is the estimated fair value of that multiple, which can be justified on the basis of the method of comparables or the method of forecasted fundamentals. If the justified P/B is larger (smaller) than the actual P/B, the stock may be undervalued (overvalued). The justified price to book of 2.5 (based on its peers) is larger than the actual price-to-book of 2.0 (calculated by $50 / $25); therefore, the stock is undervalued based on the data in the table relative to its peers.<\/p>","qhtml":"<div class=\"pp-topic\">Market-Based Valuation: Price and Enterprise Value Multiples<\/div><div class=\"qtext\"><p>An analyst gathers the following data for a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp110.webp\" style=\"max-width:min(100%,542px)\" alt=\"\"><p>The justified multiple based on the method of comparables indicates that the company is:<\/p><\/div>","subj":"equity"},{"n":51,"q":"A company's manager is distorting its operating expenses and aggressively capitalizing its research and development expenditures. Which of the following multiples is the least prone to distortion or manipulation?","opts":["P/E ratio","P/B ratio","Price-to-sales (P/S) ratio"],"ans":"C","expl":"C is Correct because analysts have offered the following rationales for using P/S: Sales are generally less subject to distortion or manipulation than are other fundamentals, such as EPS or book value.","explhtml":"<p>C is Correct because analysts have offered the following rationales for using P/S: Sales are generally less subject to distortion or manipulation than are other fundamentals, such as EPS or book value.<\/p>","qhtml":"<div class=\"pp-topic\">Market-Based Valuation: Price and Enterprise Value Multiples<\/div><div class=\"qtext\"><p>A company&#x27;s manager is distorting its operating expenses and aggressively capitalizing its research and development expenditures. Which of the following multiples is the least prone to distortion or manipulation?<\/p><\/div>","subj":"equity"},{"n":52,"q":"An analyst gathers the following information about a company's EPS: The company's trailing EPS is:","opts":["–$0.9.","$0.25.","$1.4."],"ans":"A","expl":"A is Correct because –$0.9 is the trailing EPS. Common alternative definitions of P/E are trailing P/E and forward P/E. A stock’s trailing P/E (sometimes referred to as a current P/E) is its current market price divided by the most recent four quarters’ EPS. In such calculations, EPS is referred to as trailing 12-month (TTM) EPS.","explhtml":"<p>A is Correct because –$0.9 is the trailing EPS. Common alternative definitions of P/E are trailing P/E and forward P/E. A stock’s trailing P/E (sometimes referred to as a current P/E) is its current market price divided by the most recent four quarters’ EPS. In such calculations, EPS is referred to as trailing 12-month (TTM) EPS.<\/p>","qhtml":"<div class=\"pp-topic\">Market-Based Valuation: Price and Enterprise Value Multiples<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company&#x27;s EPS:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp111.webp\" style=\"max-width:min(100%,542px)\" alt=\"\"><p>The company&#x27;s trailing EPS is:<\/p><\/div>","subj":"equity"},{"n":53,"q":"An analyst gathers the following information about a company: The current stock price at the end of Year 1 is $10. The analyst forecasts a 30% revenue growth in Year 2. The trailing dividend yield is:","opts":["10%.","13%.","20%."],"ans":"A","expl":"A is Correct because 10% is the trailing dividend yield. Trailing dividend yield is calculated by using the dividend rate divided by the current market price per share. Trailing dividend yield = Dividend rate / Current stock price = $1.0 / $10.0 = 10%","explhtml":"<p>A is Correct because 10% is the trailing dividend yield. Trailing dividend yield is calculated by using the dividend rate divided by the current market price per share. Trailing dividend yield = Dividend rate / Current stock price = $1.0 / $10.0 = 10%<\/p>","qhtml":"<div class=\"pp-topic\">Market-Based Valuation: Price and Enterprise Value Multiples<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp112.webp\" style=\"max-width:min(100%,540px)\" alt=\"\"><p>The current stock price at the end of Year 1 is $10. The analyst forecasts a 30% revenue growth in Year 2. The trailing dividend yield is:<\/p><\/div>","subj":"equity"},{"n":54,"q":"An analyst gathers the following information about a company: Over the 4-year period, the normalized EPS by the method of average ROE is closest to:","opts":["$3.64.","$4.47.","$4.90."],"ans":"C","expl":"C is Correct because the method of average return on equity, in which normalized EPS is calculated as the average return on equity (ROE) from the most recent full cycle, multiplied by current book value per share. Average ROE is (12% + 7.62% + 12.89% + 8.33%) / 4 = 10.21%. Normalized EPS = Average ROE × current book value per share = 10.21% × $ 48.00 = $4.9008 ≈ $4.90.","explhtml":"<p>C is Correct because the method of average return on equity, in which normalized EPS is calculated as the average return on equity (ROE) from the most recent full cycle, multiplied by current book value per share. Average ROE is (12% + 7.62% + 12.89% + 8.33%) / 4 = 10.21%. Normalized EPS = Average ROE × current book value per share = 10.21% × $ 48.00 = $4.9008 ≈ $4.90.<\/p>","qhtml":"<div class=\"pp-topic\">Market-Based Valuation: Price and Enterprise Value Multiples<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp113.webp\" style=\"max-width:min(100%,545px)\" alt=\"\"><p>Over the 4-year period, the normalized EPS by the method of average ROE is closest to:<\/p><\/div>","subj":"equity"},{"n":55,"q":"An analyst gathers the following information: Which company is ranked highest based on earnings yield?","opts":["Company A","Company B","Company C"],"ans":"B","expl":"B is Correct because the inverse price ratio is earnings to price (E/P), known as the earnings yield. Company B has the highest earnings yield. E/P for Company A = 4 / 32 = 12.5% (third rank) E/P for Company B = 5 / 20 = 25.0% (first rank) E/P for Company C = 12 / 80 = 15.0% (second rank) For P/E, the inverse price ratio is earnings to price (E/P), known as the earnings yield. Ranked by earnings yield from highest to lowest, the securities are correctly ranked from cheapest to most costly. Therefore, Company B is the highest ranked.","explhtml":"<p>B is Correct because the inverse price ratio is earnings to price (E/P), known as the earnings yield. Company B has the highest earnings yield. E/P for Company A = 4 / 32 = 12.5% (third rank) E/P for Company B = 5 / 20 = 25.0% (first rank) E/P for Company C = 12 / 80 = 15.0% (second rank) For P/E, the inverse price ratio is earnings to price (E/P), known as the earnings yield. Ranked by earnings yield from highest to lowest, the securities are correctly ranked from cheapest to most costly. Therefore, Company B is the highest ranked.<\/p>","qhtml":"<div class=\"pp-topic\">Market-Based Valuation: Price and Enterprise Value Multiples<\/div><div class=\"qtext\"><p>An analyst gathers the following information:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp114.webp\" style=\"max-width:min(100%,545px)\" alt=\"\"><p>Which company is ranked highest based on earnings yield?<\/p><\/div>","subj":"equity"},{"n":56,"q":"An analyst is creating a ranking of companies in the same industry. Most of the companies are profitable, but a few have losses and one has zero earnings. Which of the following is most suitable for a comparative analysis?","opts":["Justified P/E","Forward P/E","Earnings yield"],"ans":"C","expl":"C is Correct because one solution applicable to any ratio involving a quantity that can be negative or zero is the use of an inverse price ratio—that is, the reciprocal of the original ratio, which places price in the denominator. The use of inverse price multiples addresses the issue of consistent ranking because price is never negative. In the case of the P/E, the inverse price ratio is earnings to price (E/P), known as the earnings yield. Therefore, he should use the earnings yield ratio","explhtml":"<p>C is Correct because one solution applicable to any ratio involving a quantity that can be negative or zero is the use of an inverse price ratio—that is, the reciprocal of the original ratio, which places price in the denominator. The use of inverse price multiples addresses the issue of consistent ranking because price is never negative. In the case of the P/E, the inverse price ratio is earnings to price (E/P), known as the earnings yield. Therefore, he should use the earnings yield ratio<\/p>","qhtml":"<div class=\"pp-topic\">Market-Based Valuation: Price and Enterprise Value Multiples<\/div><div class=\"qtext\"><p>An analyst is creating a ranking of companies in the same industry. Most of the companies are profitable, but a few have losses and one has zero earnings. Which of the following is most suitable for a comparative analysis?<\/p><\/div>","subj":"equity"},{"n":57,"q":"If the present value of a company's expected future residual earnings is zero, the company’s justified P/B ratio is:","opts":["less than one.","equal to one.","greater than one."],"ans":"B","expl":"B is Correct because if the present value of expected future residual earnings is zero—for example, if the business just earns its required return on investment in every period—the justified P/B is 1.","explhtml":"<p>B is Correct because if the present value of expected future residual earnings is zero—for example, if the business just earns its required return on investment in every period—the justified P/B is 1.<\/p>","qhtml":"<div class=\"pp-topic\">Market-Based Valuation: Price and Enterprise Value Multiples<\/div><div class=\"qtext\"><p>If the present value of a company&#x27;s expected future residual earnings is zero, the company’s justified P/B ratio is:<\/p><\/div>","subj":"equity"},{"n":58,"q":"An analyst makes the following long-term forecasts for a company: The company’s justified price-to-sales (P/S) is closest to:","opts":["0.40.","0.60.","0.67."],"ans":"B","expl":"B is Correct because the justified price-to-sales (P/S) is 0.6, calculated below. The correct calculation is shown below: P0/S1 = [(E1/S1)× (1– b)] / (r – g) Where E1/S1= 10%; b = 40%; r = 15%; and g = 5% P0/S1 = [(E1/S1)(1– b) / (r – g) = [10% (1 – 40%)] / (15% – 5%) = (0.10 × 0.60) / (0.15 – 0.05) = 0.06 / 0.10 = 0.60","explhtml":"<p>B is Correct because the justified price-to-sales (P/S) is 0.6, calculated below. The correct calculation is shown below: P0/S1 = [(E1/S1)× (1– b)] / (r – g) Where E1/S1= 10%; b = 40%; r = 15%; and g = 5% P0/S1 = [(E1/S1)(1– b) / (r – g) = [10% (1 – 40%)] / (15% – 5%) = (0.10 × 0.60) / (0.15 – 0.05) = 0.06 / 0.10 = 0.60<\/p>","qhtml":"<div class=\"pp-topic\">Market-Based Valuation: Price and Enterprise Value Multiples<\/div><div class=\"qtext\"><p>An analyst makes the following long-term forecasts for a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp115.webp\" style=\"max-width:min(100%,550px)\" alt=\"\"><p>The company’s justified price-to-sales (P/S) is closest to:<\/p><\/div>","subj":"equity"},{"n":59,"q":"A portfolio manager gathers the following information about Company A. Company A’s earnings growth and risk profile are generally the same as its peer group. Based on its trailing P/E, Company A is most likely:","opts":["undervalued.","fairly valued.","overvalued."],"ans":"C","expl":"C is Correct because Company A's trailing P0 / E1 of 14 greatly exceeds the peer P/E of 8. Therefore, Company A is most likely overvalued. Company A's training P0 / E1 = (1 – b) / (r – g) Where b = 30%; r = 10%; g = 5% = (1 – 30%) / (10% – 5%) = (1 – 0.30) / (0.10 – 0.05) = 0.70 / 0.05 = 14","explhtml":"<p>C is Correct because Company A&#x27;s trailing P0 / E1 of 14 greatly exceeds the peer P/E of 8. Therefore, Company A is most likely overvalued. Company A&#x27;s training P0 / E1 = (1 – b) / (r – g) Where b = 30%; r = 10%; g = 5% = (1 – 30%) / (10% – 5%) = (1 – 0.30) / (0.10 – 0.05) = 0.70 / 0.05 = 14<\/p>","qhtml":"<div class=\"pp-topic\">Market-Based Valuation: Price and Enterprise Value Multiples<\/div><div class=\"qtext\"><p>A portfolio manager gathers the following information about Company A. Company A’s earnings growth and risk profile are generally the same as its peer group.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp116.webp\" style=\"max-width:min(100%,721px)\" alt=\"\"><p>Based on its trailing P/E, Company A is most likely:<\/p><\/div>","subj":"equity"},{"n":60,"q":"An analyst is valuing a company with a beta of 1.2, a dividend payout ratio of 0.30, and an earnings growth rate of 0.10. The estimated regression for comparable companies is: Predicted P/E = 12 + (5.75 × dividend payout) + (14.35 × earnings growth rate) − (0.60 × beta) If the company's actual trailing P/E is 12, based on the P/E estimated from the cross-sectional regression, the stock is most likely:","opts":["undervalued.","fairly valued.","overvalued."],"ans":"A","expl":"A is Correct because a predicted P/E, which is conceptually similar to a justified P/E, can be estimated from cross-sectional regressions of P/E on the fundamentals believed to drive security valuation. Predicted P/E = 12 + (5.75 × 0.30) + (14.35 × 0.10) – (0.60 × 1.2) = 12 + 1.725 + 1.435 – 0.72 = 14.44. Given that the predicted P/E of 14.64 is higher than the actual P/E of 12, the stock appears to be undervalued.","explhtml":"<p>A is Correct because a predicted P/E, which is conceptually similar to a justified P/E, can be estimated from cross-sectional regressions of P/E on the fundamentals believed to drive security valuation. Predicted P/E = 12 + (5.75 × 0.30) + (14.35 × 0.10) – (0.60 × 1.2) = 12 + 1.725 + 1.435 – 0.72 = 14.44. Given that the predicted P/E of 14.64 is higher than the actual P/E of 12, the stock appears to be undervalued.<\/p>","qhtml":"<div class=\"pp-topic\">Market-Based Valuation: Price and Enterprise Value Multiples<\/div><div class=\"qtext\"><p>An analyst is valuing a company with a beta of 1.2, a dividend payout ratio of 0.30, and an earnings growth rate of 0.10. The estimated regression for comparable companies is: Predicted P/E = 12 + (5.75 × dividend payout) + (14.35 × earnings growth rate) − (0.60 × beta) If the company&#x27;s actual trailing P/E is 12, based on the P/E estimated from the cross-sectional regression, the stock is most likely:<\/p><\/div>","subj":"equity"},{"n":61,"q":"Which of the following statements about the predicted P/E using cross-sectional regressions is most accurate?","opts":["The regression coefficients and explanatory power tend to remain stable over years","The regressions have to be conducted using a standard set of explanatory variables","The regressions are prone to multicollinearity, making it difficult to interpret individual coefficients"],"ans":"C","expl":"C is Correct because the predicted P/E using a cross-sectional regressions is subject to at least three limitations. Because regressions based on this method are prone to the problem of multicollinearity (correlation within linear combinations of the independent variables), interpreting individual regression coefficients is difficult.","explhtml":"<p>C is Correct because the predicted P/E using a cross-sectional regressions is subject to at least three limitations. Because regressions based on this method are prone to the problem of multicollinearity (correlation within linear combinations of the independent variables), interpreting individual regression coefficients is difficult.<\/p>","qhtml":"<div class=\"pp-topic\">Market-Based Valuation: Price and Enterprise Value Multiples<\/div><div class=\"qtext\"><p>Which of the following statements about the predicted P/E using cross-sectional regressions is most accurate?<\/p><\/div>","subj":"equity"},{"n":62,"q":"An analyst makes the following statements to explain the use of fundamentals in comparables: • Statement 1: Insights from the method of comparables based on forecasted fundamentals cannot be incorporated in explaining valuation differences, because we rarely find exact comparables. • Statement 2: We can use the method of comparables based on forecasted fundamentals, which involves forecasting the company’s fundamentals rather than making comparisons with other companies. Which of the above statements is correct?","opts":["Statement 1 only","Statement 2 only","Both Statement 1 and Statement 2"],"ans":"B","expl":"B is Correct because we can approach valuation by using multiples from two perspectives. First, we can use the method of comparables. Second, we can use the method based on forecasted fundamentals, which involves forecasting the company’s fundamentals rather than making comparisons with other companies. The price multiple of an asset should be related to its expected future cash flows. Therefore, Statement 2 is correct.","explhtml":"<p>B is Correct because we can approach valuation by using multiples from two perspectives. First, we can use the method of comparables. Second, we can use the method based on forecasted fundamentals, which involves forecasting the company’s fundamentals rather than making comparisons with other companies. The price multiple of an asset should be related to its expected future cash flows. Therefore, Statement 2 is correct.<\/p>","qhtml":"<div class=\"pp-topic\">Market-Based Valuation: Price and Enterprise Value Multiples<\/div><div class=\"qtext\"><p>An analyst makes the following statements to explain the use of fundamentals in comparables: • Statement 1: Insights from the method of comparables based on forecasted fundamentals cannot be incorporated in explaining valuation differences, because we rarely find exact comparables. • Statement 2: We can use the method of comparables based on forecasted fundamentals, which involves forecasting the company’s fundamentals rather than making comparisons with other companies. Which of the above statements is correct?<\/p><\/div>","subj":"equity"},{"n":63,"q":"Which of the following statements about the PEG ratio is most accurate? The PEG ratio:","opts":["factors in differences in risk when comparing companies.","does not account for differences in the duration of growth.","assumes a non-linear relationship between P/E and growth."],"ans":"B","expl":"B is Correct because the PEG ratio does not account for differences in the duration of growth.","explhtml":"<p>B is Correct because the PEG ratio does not account for differences in the duration of growth.<\/p>","qhtml":"<div class=\"pp-topic\">Market-Based Valuation: Price and Enterprise Value Multiples<\/div><div class=\"qtext\"><p>Which of the following statements about the PEG ratio is most accurate? The PEG ratio:<\/p><\/div>","subj":"equity"},{"n":64,"q":"A portfolio manager manages a fund and reviews the following information about equities held in the fund: The companies are in the same industry with substantially similar operating and financial profiles. Which company is most likely overvalued?","opts":["Company A","Company B","Company C"],"ans":"B","expl":"B is Correct because Company B has the highest PEG ratio of 1.14 and is most likely overvalued. The PEG ratio is calculated as the stock’s P/E divided by the expected earnings growth rate (in percentage terms), as follows:","explhtml":"<p>B is Correct because Company B has the highest PEG ratio of 1.14 and is most likely overvalued. The PEG ratio is calculated as the stock’s P/E divided by the expected earnings growth rate (in percentage terms), as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp131.webp\" style=\"max-width:min(100%,721px)\" alt=\"\">","qhtml":"<div class=\"pp-topic\">Market-Based Valuation: Price and Enterprise Value Multiples<\/div><div class=\"qtext\"><p>A portfolio manager manages a fund and reviews the following information about equities held in the fund:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp117.webp\" style=\"max-width:min(100%,545px)\" alt=\"\"><p>The companies are in the same industry with substantially similar operating and financial profiles. Which company is most likely overvalued?<\/p><\/div>","subj":"equity"},{"n":65,"q":"An analyst gathers the following information about Health-Drinks Inc. The median trailing P/E for companies in the same industry is 10. The analyst expects a constant growth rate of 5% after Year 3. Using industry P/E as the benchmark, Health-Drinks Inc.'s terminal value per share at Year 3 is closest to:","opts":["$76.20.","$152.50.","$160.13."],"ans":"B","expl":"B is Correct, as calculated below: V3 = Benchmark value of trailing terminal P/E × E3 Where P/E = 10 and E3 = $15.25 V3= 10 × $15.25 = $152.50 Analysts have used various choices for the benchmark value, including median industry P/E, average industry P/E, and average of own past P/Es. Having selected a terminal multiple, the expression for terminal value when using a terminal P/E multiple is Vn = Benchmark value of trailing terminal P/E × En or Vn = Benchmark value of forward terminal P/E × En+1, where Vn = Terminal value at time n.”","explhtml":"<p>B is Correct, as calculated below: V3 = Benchmark value of trailing terminal P/E × E3 Where P/E = 10 and E3 = $15.25 V3= 10 × $15.25 = $152.50 Analysts have used various choices for the benchmark value, including median industry P/E, average industry P/E, and average of own past P/Es. Having selected a terminal multiple, the expression for terminal value when using a terminal P/E multiple is Vn = Benchmark value of trailing terminal P/E × En or Vn = Benchmark value of forward terminal P/E × En+1, where Vn = Terminal value at time n.”<\/p>","qhtml":"<div class=\"pp-topic\">Market-Based Valuation: Price and Enterprise Value Multiples<\/div><div class=\"qtext\"><p>An analyst gathers the following information about Health-Drinks Inc. The median trailing P/E for companies in the same industry is 10. The analyst expects a constant growth rate of 5% after Year 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp118.webp\" style=\"max-width:min(100%,544px)\" alt=\"\"><p>Using industry P/E as the benchmark, Health-Drinks Inc.&#x27;s terminal value per share at Year 3 is closest to:<\/p><\/div>","subj":"equity"},{"n":66,"q":"Which of the following is the most appropriate numerator when calculating an EBITDA multiplier for a leveraged firm?","opts":["Equity value","Enterprise value","Market value of debt"],"ans":"B","expl":"B is Correct because EBITDA is a flow to both debt and equity, as noted, defining an EBITDA multiple by using a measure of total company value in the numerator, such as enterprise value (EV), is appropriate.","explhtml":"<p>B is Correct because EBITDA is a flow to both debt and equity, as noted, defining an EBITDA multiple by using a measure of total company value in the numerator, such as enterprise value (EV), is appropriate.<\/p>","qhtml":"<div class=\"pp-topic\">Market-Based Valuation: Price and Enterprise Value Multiples<\/div><div class=\"qtext\"><p>Which of the following is the most appropriate numerator when calculating an EBITDA multiplier for a leveraged firm?<\/p><\/div>","subj":"equity"},{"n":67,"q":"To calculate the enterprise value multiple, an analyst adjusts the net income by adding back interest expenses, taxes, depreciation, and amortization. The resulting figure is best described as:","opts":["FCFF.","EBITDA.","underlying earnings"],"ans":"B","expl":"B is Correct because EBITDA = Net Income plus Interest Expense, plus Taxes, plus Depreciation, plus Amortization.","explhtml":"<p>B is Correct because EBITDA = Net Income plus Interest Expense, plus Taxes, plus Depreciation, plus Amortization.<\/p>","qhtml":"<div class=\"pp-topic\">Market-Based Valuation: Price and Enterprise Value Multiples<\/div><div class=\"qtext\"><p>To calculate the enterprise value multiple, an analyst adjusts the net income by adding back interest expenses, taxes, depreciation, and amortization. The resulting figure is best described as:<\/p><\/div>","subj":"equity"},{"n":68,"q":"An analyst gathers the following information (in $ millions) about a company: The company's EV/EBITDA ratio is:","opts":["11.2.","12.0.","12.8."],"ans":"A","expl":"A is Correct because enterprise value is calculated as follows: Market value of common equity (Number of shares outstanding × Price per share) + Market value of preferred stock (if any) and any minority interest (unless included elsewhere) + Market value of debt – Cash and investments (specifically, cash, cash equivalents, and short-term investments). Enterprise value (EV): $310 million + $290 million – $40 million = $560 million. EV/EBITDA ratio = $560 million / $50 million = 11.2.","explhtml":"<p>A is Correct because enterprise value is calculated as follows: Market value of common equity (Number of shares outstanding × Price per share) + Market value of preferred stock (if any) and any minority interest (unless included elsewhere) + Market value of debt – Cash and investments (specifically, cash, cash equivalents, and short-term investments). Enterprise value (EV): $310 million + $290 million – $40 million = $560 million. EV/EBITDA ratio = $560 million / $50 million = 11.2.<\/p>","qhtml":"<div class=\"pp-topic\">Market-Based Valuation: Price and Enterprise Value Multiples<\/div><div class=\"qtext\"><p>An analyst gathers the following information (in $ millions) about a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp119.webp\" style=\"max-width:min(100%,545px)\" alt=\"\"><p>The company&#x27;s EV/EBITDA ratio is:<\/p><\/div>","subj":"equity"},{"n":69,"q":"An analyst makes the following statements about comparing companies across borders: • Statement 1: Cross-border company comparisons often involve differences in accounting methods, cultural differences, and economic differences • Statement 2: The harmonization of accounting principles eliminates the need for adjusting accounting data when making cross-border comparisons Which of the analyst's statements is correct?","opts":["Statement 1 only","Statement 2 only","Both Statement 1 and Statement 2"],"ans":"A","expl":"A is Correct because comparing companies across borders frequently involves differences in accounting methods, cultural differences, economic differences, and resulting differences in risk and growth opportunities.","explhtml":"<p>A is Correct because comparing companies across borders frequently involves differences in accounting methods, cultural differences, economic differences, and resulting differences in risk and growth opportunities.<\/p>","qhtml":"<div class=\"pp-topic\">Market-Based Valuation: Price and Enterprise Value Multiples<\/div><div class=\"qtext\"><p>An analyst makes the following statements about comparing companies across borders: • Statement 1: Cross-border company comparisons often involve differences in accounting methods, cultural differences, and economic differences • Statement 2: The harmonization of accounting principles eliminates the need for adjusting accounting data when making cross-border comparisons Which of the analyst&#x27;s statements is correct?<\/p><\/div>","subj":"equity"},{"n":70,"q":"An example of a momentum indicator is comparing the:","opts":["price of a stock to a time series of its past value.","stock's price multiple with relevant benchmark multiples.","earnings multiple of a company to earnings multiples of similar companies."],"ans":"A","expl":"A is Correct because momentum indicators relate either price or a fundamental, such as earnings, to the time series of their own past values or, in some cases, to the fundamental’s expected value.","explhtml":"<p>A is Correct because momentum indicators relate either price or a fundamental, such as earnings, to the time series of their own past values or, in some cases, to the fundamental’s expected value.<\/p>","qhtml":"<div class=\"pp-topic\">Market-Based Valuation: Price and Enterprise Value Multiples<\/div><div class=\"qtext\"><p>An example of a momentum indicator is comparing the:<\/p><\/div>","subj":"equity"},{"n":71,"q":"Company A has a lower percentage surprise and a lower standardized unexpected earnings score than Company B. All else being equal, Company A's consensus earnings forecast is most likely:","opts":["less accurate than Company B's.","as accurate as Company B's.","more accurate than Company B's."],"ans":"C","expl":"C is Correct because in standard unexpected earnings (SUE), the magnitude of unexpected earnings is scaled by a measure of the size of historical forecast errors or surprises. The principle is that the smaller (larger) the historical size of forecast errors, the more (less) meaningful a given size of EPS forecast error. Since Company A has a lower SUE, Company A's consensus forecast is more accurate than Company B's.","explhtml":"<p>C is Correct because in standard unexpected earnings (SUE), the magnitude of unexpected earnings is scaled by a measure of the size of historical forecast errors or surprises. The principle is that the smaller (larger) the historical size of forecast errors, the more (less) meaningful a given size of EPS forecast error. Since Company A has a lower SUE, Company A&#x27;s consensus forecast is more accurate than Company B&#x27;s.<\/p>","qhtml":"<div class=\"pp-topic\">Market-Based Valuation: Price and Enterprise Value Multiples<\/div><div class=\"qtext\"><p>Company A has a lower percentage surprise and a lower standardized unexpected earnings score than Company B. All else being equal, Company A&#x27;s consensus earnings forecast is most likely:<\/p><\/div>","subj":"equity"},{"n":72,"q":"Which of the following methods of describing central tendency helps to reduce the impact of large outliers but not the impact of small outliers?","opts":["Median","Harmonic mean","Arithmetic mean"],"ans":"B","expl":"B is Correct because the harmonic mean is sometimes also used to reduce the impact of large outliers—which are typically the major concern in using the arithmetic mean multiple—but not the impact of small outliers (i.e., those close to zero). The harmonic mean tends to mitigate the impact of large outliers. The harmonic mean may aggravate the impact of small outliers, but such outliers are bounded by zero on the downside.","explhtml":"<p>B is Correct because the harmonic mean is sometimes also used to reduce the impact of large outliers—which are typically the major concern in using the arithmetic mean multiple—but not the impact of small outliers (i.e., those close to zero). The harmonic mean tends to mitigate the impact of large outliers. The harmonic mean may aggravate the impact of small outliers, but such outliers are bounded by zero on the downside.<\/p>","qhtml":"<div class=\"pp-topic\">Market-Based Valuation: Price and Enterprise Value Multiples<\/div><div class=\"qtext\"><p>Which of the following methods of describing central tendency helps to reduce the impact of large outliers but not the impact of small outliers?<\/p><\/div>","subj":"equity"},{"n":73,"q":"An analyst forecasts that a company will pay a dividend of $1.50 next year and have a stock price of $73 at the end of the next year. If the required rate of return is 8%, the estimated value of the stock today is closest to:","opts":["$67.59.","$68.98.","$74.50."],"ans":"B","expl":"B is Correct because the present value of the stock based on DDM is: V0 = (D1 + P1)/(1 + r1) where V0 is the value of the stock today D1 is the dividend in year 1 P1 is the stock price in year 1 r is the required rate of return on the stock V0 = (1.50 + 73)/(1 + 0.08) = 74.50/1.08 = 68.9815 ≈ 68.98","explhtml":"<p>B is Correct because the present value of the stock based on DDM is: V0 = (D1 + P1)/(1 + r1) where V0 is the value of the stock today D1 is the dividend in year 1 P1 is the stock price in year 1 r is the required rate of return on the stock V0 = (1.50 + 73)/(1 + 0.08) = 74.50/1.08 = 68.9815 ≈ 68.98<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>An analyst forecasts that a company will pay a dividend of $1.50 next year and have a stock price of $73 at the end of the next year. If the required rate of return is 8%, the estimated value of the stock today is closest to:<\/p><\/div>","subj":"equity"},{"n":74,"q":"An investor estimates the following for a company's stock: If the investor's required rate of return is 10%, the current per share value of the stock is closest to:","opts":["$86.36.","$86.53.","$95.00."],"ans":"B","expl":"B is Correct because the current value of the stock based on the DDM is: V0 = (D1/(1 + r1) + (D2 + P2)/(1 + r2)2 where V0 is the value of the stock today D1 and D2 are the dividend payments in year 1 and 2, respectively P2 is the expected stock price in year 2 r is the required rate of return on the stock V0 = (2/(1 + 0.1)) + (2.50 + 100)/(1 + 0.1)2 = 1.818 + 102.50/1.12 = 1.818 + 84.711 ≈ 86.53.","explhtml":"<p>B is Correct because the current value of the stock based on the DDM is: V0 = (D1/(1 + r1) + (D2 + P2)/(1 + r2)2 where V0 is the value of the stock today D1 and D2 are the dividend payments in year 1 and 2, respectively P2 is the expected stock price in year 2 r is the required rate of return on the stock V0 = (2/(1 + 0.1)) + (2.50 + 100)/(1 + 0.1)2 = 1.818 + 102.50/1.12 = 1.818 + 84.711 ≈ 86.53.<\/p>","qhtml":"<div class=\"pp-topic\">Discounted Dividend Valuation<\/div><div class=\"qtext\"><p>An investor estimates the following for a company&#x27;s stock:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp120.webp\" style=\"max-width:min(100%,540px)\" alt=\"\"><p>If the investor&#x27;s required rate of return is 10%, the current per share value of the stock is closest to:<\/p><\/div>","subj":"equity"},{"n":75,"q":"Company X’s EPS is $2.00. Its closest competitor, Company Y, is trading at a P/E of 18, and both companies have a similar operating and financial profile. If Company X is trading at $33.00 per share, Company X is most likely:","opts":["undervalued compared to Company Y.","fairly valued compared to Company Y.","overvalued compared to Company Y."],"ans":"A","expl":"A is Correct because if Company X’s stock is trading at $33.00, its P/E will be: $33.00/$2.00 = 16.5. Since both companies are similar, this P/E would indicate that Company X is undervalued relative to Company Y.","explhtml":"<p>A is Correct because if Company X’s stock is trading at $33.00, its P/E will be: $33.00/$2.00 = 16.5. Since both companies are similar, this P/E would indicate that Company X is undervalued relative to Company Y.<\/p>","qhtml":"<div class=\"pp-topic\">Market-Based Valuation: Price and Enterprise Value Multiples<\/div><div class=\"qtext\"><p>Company X’s EPS is $2.00. Its closest competitor, Company Y, is trading at a P/E of 18, and both companies have a similar operating and financial profile. If Company X is trading at $33.00 per share, Company X is most likely:<\/p><\/div>","subj":"equity"},{"n":76,"q":"An analyst gathers the following data for a company: The company's residual income is:","opts":["–$90,000.","–$30,000.","$30,000."],"ans":"B","expl":"B is correct Correct because in this second approach to calculating residual income, which takes the perspective of all providers of capital (both debt and equity), a capital charge (the company’s total cost of capital in money terms) is subtracted from the company’s after-tax operating profit. Since after-tax operating profit is given, the formula for the total capital charge is: equity charge + debt charge. In this example the equity charge = cost of equity × equity financing = 0.10 × $6,000,000 = $600,000. The debt charge is = cost of debt (1 – tax rate) × debt financing = 0.06 × (1 – 0.25) × $400,000 = $180,000. The total capital charge = $600,000 + $180,000 = $780,000. Therefore the residual income is equal to $750,000 – $780,000 = –$30,000.","explhtml":"<p>B is correct Correct because in this second approach to calculating residual income, which takes the perspective of all providers of capital (both debt and equity), a capital charge (the company’s total cost of capital in money terms) is subtracted from the company’s after-tax operating profit. Since after-tax operating profit is given, the formula for the total capital charge is: equity charge + debt charge. In this example the equity charge = cost of equity × equity financing = 0.10 × $6,000,000 = $600,000. The debt charge is = cost of debt (1 – tax rate) × debt financing = 0.06 × (1 – 0.25) × $400,000 = $180,000. The total capital charge = $600,000 + $180,000 = $780,000. Therefore the residual income is equal to $750,000 – $780,000 = –$30,000.<\/p>","qhtml":"<div class=\"pp-topic\">Residual Income Valuation<\/div><div class=\"qtext\"><p>An analyst gathers the following data for a company: The company&#x27;s residual income is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp121.webp\" style=\"max-width:min(100%,547px)\" alt=\"\"><\/div>","subj":"equity"},{"n":77,"q":"The least likely use of a residual income model is to determine:","opts":["the value of a stock index.","if a company is creating value.","the opportunity cost of a company's equity capital."],"ans":"C","expl":"C is Correct because a residual income model does not determine the opportunity cost of a company's equity capital. The model requires knowing the opportunity cost in order to calculate the residual income. Conceptually, residual income is net income less a charge (deduction) for common shareholders’ opportunity cost in generating net income.","explhtml":"<p>C is Correct because a residual income model does not determine the opportunity cost of a company&#x27;s equity capital. The model requires knowing the opportunity cost in order to calculate the residual income. Conceptually, residual income is net income less a charge (deduction) for common shareholders’ opportunity cost in generating net income.<\/p>","qhtml":"<div class=\"pp-topic\">Residual Income Valuation<\/div><div class=\"qtext\"><p>The least likely use of a residual income model is to determine:<\/p><\/div>","subj":"equity"},{"n":78,"q":"An analyst gathers the following information about a company: Using a single stage residual income model, the company’s intrinsic value per share is closest to:","opts":["$19.","$25.","$27."],"ans":"A","expl":"A is Correct because a single-stage (or constant-growth) residual income model has the following equation: V0 = B0 + ((ROE – r) / (r – g)) × B0 = $15 + ((12% – 10%) / (10% – 2.5%)) × $15 = $19.","explhtml":"<p>A is Correct because a single-stage (or constant-growth) residual income model has the following equation: V0 = B0 + ((ROE – r) / (r – g)) × B0 = $15 + ((12% – 10%) / (10% – 2.5%)) × $15 = $19.<\/p>","qhtml":"<div class=\"pp-topic\">Residual Income Valuation<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp122.webp\" style=\"max-width:min(100%,544px)\" alt=\"\"><p>Using a single stage residual income model, the company’s intrinsic value per share is closest to:<\/p><\/div>","subj":"equity"},{"n":79,"q":"Residual income reflects a stock's net income:","opts":["plus dividends.","less the cost of equity.","plus the present value of future earnings."],"ans":"B","expl":"B is Correct because residual income is earnings less the cost of equity, or (ROE × B0) − (r × B0).","explhtml":"<p>B is Correct because residual income is earnings less the cost of equity, or (ROE × B0) − (r × B0).<\/p>","qhtml":"<div class=\"pp-topic\">Residual Income Valuation<\/div><div class=\"qtext\"><p>Residual income reflects a stock&#x27;s net income:<\/p><\/div>","subj":"equity"},{"n":80,"q":"In a single-stage residual income model, the estimated value of a company is the:","opts":["replacement cost of the company's total assets.","present value of all the company's future dividends.","company's book value plus the present value of its expected economic profits."],"ans":"C","expl":"C is Correct because under the single-stage residual income model, the estimated value of a share is the book value per share (B0) plus the present value [(ROE − r)B0/(r − g)] of the expected stream of residual income. The second term is the present value of the company’s expected economic profits.","explhtml":"<p>C is Correct because under the single-stage residual income model, the estimated value of a share is the book value per share (B0) plus the present value [(ROE − r)B0/(r − g)] of the expected stream of residual income. The second term is the present value of the company’s expected economic profits.<\/p>","qhtml":"<div class=\"pp-topic\">Residual Income Valuation<\/div><div class=\"qtext\"><p>In a single-stage residual income model, the estimated value of a company is the:<\/p><\/div>","subj":"equity"},{"n":81,"q":"An analyst gathers the following data for a company: Using the single-stage residual income model, the intrinsic value of the company shares is:","opts":["€70.","€75.","€150."],"ans":"C","expl":"C is Correct because the formula for the single-stage residual income model is: V0 = B0 + (ROE – r)/(r-g) ×B0. In this example V0 = 50 + (.016 – 0.12)/(0.12 – 0.10) × 50 = 50 + 100 = €150.","explhtml":"<p>C is Correct because the formula for the single-stage residual income model is: V0 = B0 + (ROE – r)/(r-g) ×B0. In this example V0 = 50 + (.016 – 0.12)/(0.12 – 0.10) × 50 = 50 + 100 = €150.<\/p>","qhtml":"<div class=\"pp-topic\">Residual Income Valuation<\/div><div class=\"qtext\"><p>An analyst gathers the following data for a company: Using the single-stage residual income model, the intrinsic value of the company<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp123.webp\" style=\"max-width:min(100%,544px)\" alt=\"\"><p>shares is:<\/p><\/div>","subj":"equity"},{"n":82,"q":"An analyst gathers the following information about a company: Using a multi-stage residual income model, the per share value of the company's stock is closest to:","opts":["€20.","€45.","€74."],"ans":"B","expl":"B is Correct because the share value = B0 + Present value (PV) of the Residual income (RI) + Present value of the Residual terminal value. Step 1: Calculate the PV of the Residual income (RI) Residual income = Net income per share – (cost of equity × beginning BV) Total present value of the RI = €2.70 + €2.87 = €5.57 Step 2: Calculate the PV of the residual terminal value (PT – BT) Terminal market price of share (PT) at end of year 2: 1.5 × €33.72 = €50.58 Terminal residual value = PT – BT = €50.58 – €33.72 = €16.86 2 PV of (PT – BT) for 2 years at cost of equity: 16.86/(1+0.85)^ = €14.32 Step 3: Calculate the value per share: Current book value + PV of 2 years RI + PV Residual terminal value €25.50 + €5.57 + €14.32 = €45.39≈ €45.00","explhtml":"<p>B is Correct because the share value = B0 + Present value (PV) of the Residual income (RI) + Present value of the Residual terminal value. Step 1: Calculate the PV of the Residual income (RI) Residual income = Net income per share – (cost of equity × beginning BV)<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp132.webp\" style=\"max-width:min(100%,721px)\" alt=\"\"><p>Total present value of the RI = €2.70 + €2.87 = €5.57 Step 2: Calculate the PV of the residual terminal value (PT – BT) Terminal market price of share (PT) at end of year 2: 1.5 × €33.72 = €50.58 Terminal residual value = PT – BT = €50.58 – €33.72 = €16.86 2 PV of (PT – BT) for 2 years at cost of equity: 16.86/(1+0.85)^ = €14.32 Step 3: Calculate the value per share: Current book value + PV of 2 years RI + PV Residual terminal value €25.50 + €5.57 + €14.32 = €45.39≈ €45.00<\/p>","qhtml":"<div class=\"pp-topic\">Residual Income Valuation<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp124.webp\" style=\"max-width:min(100%,617px)\" alt=\"\"><p>Using a multi-stage residual income model, the per share value of the company&#x27;s stock is closest to:<\/p><\/div>","subj":"equity"},{"n":83,"q":"An analyst gathers the following information about a company: According to the single-stage residual income model, the company's implied growth rate is:","opts":["3.50%.","6.75%.","10.50%."],"ans":"B","expl":"B is Correct because a stock’s intrinsic value under the residual income model, assuming constant growth [single-stage residual income mode], can be expressed as: V0 = B0 + ((ROE – r) / ( r – g)) × B0 Hence it is mathematically equivalent to: V0 / B0 = 1 + ( ROE – r) / ( r – g) 3.0 = 1 + (0.12 – 0.085) / (0.085 – g) g = 0.0675 = 6.75%.","explhtml":"<p>B is Correct because a stock’s intrinsic value under the residual income model, assuming constant growth [single-stage residual income mode], can be expressed as: V0 = B0 + ((ROE – r) / ( r – g)) × B0 Hence it is mathematically equivalent to: V0 / B0 = 1 + ( ROE – r) / ( r – g) 3.0 = 1 + (0.12 – 0.085) / (0.085 – g) g = 0.0675 = 6.75%.<\/p>","qhtml":"<div class=\"pp-topic\">Residual Income Valuation<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp125.webp\" style=\"max-width:min(100%,550px)\" alt=\"\"><p>According to the single-stage residual income model, the company&#x27;s implied growth rate is:<\/p><\/div>","subj":"equity"},{"n":84,"q":"A company's ROE is expected to fade toward its cost of equity as competitors enter the industry. When using a multistage residual income model to value the company, an analyst should most likely expect the:","opts":["persistence factor to be equal to one.","continuing residual income to approach zero.","terminal value to represent a large portion of the company's value."],"ans":"B","expl":"B is Correct because continuing residual income is the residual income after the forecast horizon. As ROE approaches the cost of equity, residual income approaches zero. An ROE equal to the cost of equity would result in residual income of zero.","explhtml":"<p>B is Correct because continuing residual income is the residual income after the forecast horizon. As ROE approaches the cost of equity, residual income approaches zero. An ROE equal to the cost of equity would result in residual income of zero.<\/p>","qhtml":"<div class=\"pp-topic\">Residual Income Valuation<\/div><div class=\"qtext\"><p>A company&#x27;s ROE is expected to fade toward its cost of equity as competitors enter the industry. When using a multistage residual income model to value the company, an analyst should most likely expect the:<\/p><\/div>","subj":"equity"},{"n":85,"q":"Compared to the dividend discount model, the residual income model:","opts":["is based on discounting future cash flows.","tends to be more sensitive to terminal value estimation.","attributes most of a stock's value to earnings from earlier periods."],"ans":"C","expl":"C is Correct because in the residual income (RI) model, most of the stock’s total value is attributed to the earnings from the earlier periods. In contrast, in the dividend discount model (DDM), value is derived from the receipt of dividends, and typically, a smaller proportion of value is attributed to the earlier periods.","explhtml":"<p>C is Correct because in the residual income (RI) model, most of the stock’s total value is attributed to the earnings from the earlier periods. In contrast, in the dividend discount model (DDM), value is derived from the receipt of dividends, and typically, a smaller proportion of value is attributed to the earlier periods.<\/p>","qhtml":"<div class=\"pp-topic\">Residual Income Valuation<\/div><div class=\"qtext\"><p>Compared to the dividend discount model, the residual income model:<\/p><\/div>","subj":"equity"},{"n":86,"q":"An analyst believes a company with variable cash flows has been smoothing out earnings and its reported interest expense understates its marginal cost of capital. Which of the following factors best supports using a residual income model for valuation?","opts":["The earnings record","The variability of cash flows","The low marginal cost of capital"],"ans":"B","expl":"B is Correct because the residual income (RI) models rely on accounting data and can be readily applied to companies that do not have positive expected near- term free cash flows. The models can be used when cash flows are unpredictable. The cash flows for the company in this scenario are variable (unpredictable), which would favor a RI model over a FCFE model.","explhtml":"<p>B is Correct because the residual income (RI) models rely on accounting data and can be readily applied to companies that do not have positive expected near- term free cash flows. The models can be used when cash flows are unpredictable. The cash flows for the company in this scenario are variable (unpredictable), which would favor a RI model over a FCFE model.<\/p>","qhtml":"<div class=\"pp-topic\">Residual Income Valuation<\/div><div class=\"qtext\"><p>An analyst believes a company with variable cash flows has been smoothing out earnings and its reported interest expense understates its marginal cost of capital. Which of the following factors best supports using a residual income model for valuation?<\/p><\/div>","subj":"equity"},{"n":87,"q":"If a company aggressively capitalizes an expenditure in the current year rather than expense it, it most likely leads to:","opts":["an increase in its future earnings.","a decrease in its current return on equity.","an overstatement of the company's value in the residual income model."],"ans":"C","expl":"C is Correct because aggressive accounting choices will lead to lower reported future earnings, consider an example in which a company chooses to capitalize an expenditure in the current year rather than expense it. Doing so overstates current-year earnings as well as current book value. If an analyst uses current earnings (or ROE) naively in predicting future residual earnings, the RI model will overestimate the company’s value.","explhtml":"<p>C is Correct because aggressive accounting choices will lead to lower reported future earnings, consider an example in which a company chooses to capitalize an expenditure in the current year rather than expense it. Doing so overstates current-year earnings as well as current book value. If an analyst uses current earnings (or ROE) naively in predicting future residual earnings, the RI model will overestimate the company’s value.<\/p>","qhtml":"<div class=\"pp-topic\">Residual Income Valuation<\/div><div class=\"qtext\"><p>If a company aggressively capitalizes an expenditure in the current year rather than expense it, it most likely leads to:<\/p><\/div>","subj":"equity"},{"n":88,"q":"Compared to public company shareholders, private company shareholders are more likely to experience:","opts":["share sale restrictions.","principal−agent problems.","a greater level of transparency."],"ans":"A","expl":"A is Correct because private company ownership stakes also differ significantly from common shares in publicly traded companies due to their lack of liquidity, concentration of ownership control which may impact some shareholders differently than others, and share sale restrictions, all of which affect company valuation.","explhtml":"<p>A is Correct because private company ownership stakes also differ significantly from common shares in publicly traded companies due to their lack of liquidity, concentration of ownership control which may impact some shareholders differently than others, and share sale restrictions, all of which affect company valuation.<\/p>","qhtml":"<div class=\"pp-topic\">Private Company Valuation<\/div><div class=\"qtext\"><p>Compared to public company shareholders, private company shareholders are more likely to experience:<\/p><\/div>","subj":"equity"},{"n":89,"q":"An analyst identifies the following characteristics that make a private company different from public companies: •The financial statements have limited disclosures •The senior management owns 60% of the shares •The shareholder agreement restricts the ability to sell shares Which characteristic would most likely have a positive effect on the private company valuation?","opts":["Limited financial statement disclosures","Senior management owning a controlling interest in the company","A shareholder agreement that restricts the shareholders' ability to sell shares"],"ans":"B","expl":"B is Correct because when senior management has a controlling interest it reduces the principal-agent problem and gives them more direct control over strategic decisions. Both factors allow managers to take a longer-term perspective in decision-making which would be a positive factor in valuing the company. The senior management of many private firms often has a controlling ownership interest in the company. This feature of private companies greatly reduces the principal-agent problem which may arise when owners and managers are separate allows more direct control over strategic decisions than for public companies. Private company managers can take a longer-term perspective in strategic decision making without pressure from external investors seeking short-term gains on publicly traded shares.","explhtml":"<p>B is Correct because when senior management has a controlling interest it reduces the principal-agent problem and gives them more direct control over strategic decisions. Both factors allow managers to take a longer-term perspective in decision-making which would be a positive factor in valuing the company. The senior management of many private firms often has a controlling ownership interest in the company. This feature of private companies greatly reduces the principal-agent problem which may arise when owners and managers are separate allows more direct control over strategic decisions than for public companies. Private company managers can take a longer-term perspective in strategic decision making without pressure from external investors seeking short-term gains on publicly traded shares.<\/p>","qhtml":"<div class=\"pp-topic\">Private Company Valuation<\/div><div class=\"qtext\"><p>An analyst identifies the following characteristics that make a private company different from public companies: •The financial statements have limited disclosures •The senior management owns 60% of the shares •The shareholder agreement restricts the ability to sell shares Which characteristic would most likely have a positive effect on the private company valuation?<\/p><\/div>","subj":"equity"},{"n":90,"q":"A private company valuation conducted for tax reporting purposes is best classified as which type of valuation?","opts":["Litigation-related","Transaction-related","Compliance-related"],"ans":"C","expl":"C is Correct because compliance-related valuations support actions required by law or regulation and include financial reporting and tax reporting. Tax-related reasons for private company valuations include corporate and individual tax reporting. For example, activities such as corporate restructurings, transfer pricing, and property tax matters may require valuations.","explhtml":"<p>C is Correct because compliance-related valuations support actions required by law or regulation and include financial reporting and tax reporting. Tax-related reasons for private company valuations include corporate and individual tax reporting. For example, activities such as corporate restructurings, transfer pricing, and property tax matters may require valuations.<\/p>","qhtml":"<div class=\"pp-topic\">Private Company Valuation<\/div><div class=\"qtext\"><p>A private company valuation conducted for tax reporting purposes is best classified as which type of valuation?<\/p><\/div>","subj":"equity"},{"n":91,"q":"A fund manager plans to take a majority stake in a private company with the goal of exiting at a higher valuation after improving the efficiency of the company's business practices. The fund is most likely a:","opts":["growth equity fund.","venture capital fund.","leveraged buy-out fund."],"ans":"C","expl":"C is Correct because leveraged buy-out firms acquire majority control and seek to create value through more efficient business practices and optimizing the balance sheet.","explhtml":"<p>C is Correct because leveraged buy-out firms acquire majority control and seek to create value through more efficient business practices and optimizing the balance sheet.<\/p>","qhtml":"<div class=\"pp-topic\">Private Company Valuation<\/div><div class=\"qtext\"><p>A fund manager plans to take a majority stake in a private company with the goal of exiting at a higher valuation after improving the efficiency of the company&#x27;s business practices. The fund is most likely a:<\/p><\/div>","subj":"equity"},{"n":92,"q":"Which of the following adjustments to normalize earnings are most likely needed when valuing a private company?","opts":["Interest expense on a long-term bank loan","Revenue from the annual sale of product to a third party","Above market rent paid to a controlling shareholder for shared office space"],"ans":"C","expl":"C is Correct because ongoing distortions requiring adjustment often result from revenues or expenses which may be considered related-party transactions. A related party transaction is one between parties which share economic or other interests, while an arm’s length transaction is one between independent parties acting in their own self-interest which occur and are recorded at or near fair market value. Private company transactions which may not take place at fair market value include transactions which occur between a private company and its controlling owners and are often related to compensation or non-operating asset.","explhtml":"<p>C is Correct because ongoing distortions requiring adjustment often result from revenues or expenses which may be considered related-party transactions. A related party transaction is one between parties which share economic or other interests, while an arm’s length transaction is one between independent parties acting in their own self-interest which occur and are recorded at or near fair market value. Private company transactions which may not take place at fair market value include transactions which occur between a private company and its controlling owners and are often related to compensation or non-operating asset.<\/p>","qhtml":"<div class=\"pp-topic\">Private Company Valuation<\/div><div class=\"qtext\"><p>Which of the following adjustments to normalize earnings are most likely needed when valuing a private company?<\/p><\/div>","subj":"equity"},{"n":93,"q":"Which of the following statements regarding discount rates for private companies compared to discount rates for public companies is most accurate?","opts":["A size premium is frequently added during the valuation of private companies","Private companies have greater access to debt financing, which tends to decrease their WACC","Private companies typically have a lower required rate of return due to lack of information availability"],"ans":"A","expl":"A is Correct because “[i]n assessing private company valuations, size premiums are frequently used, resulting in a small size discount in private company valuations.”","explhtml":"<p>A is Correct because “[i]n assessing private company valuations, size premiums are frequently used, resulting in a small size discount in private company valuations.”<\/p>","qhtml":"<div class=\"pp-topic\">Private Company Valuation<\/div><div class=\"qtext\"><p>Which of the following statements regarding discount rates for private companies compared to discount rates for public companies is most accurate?<\/p><\/div>","subj":"equity"},{"n":94,"q":"Which of the following is the most comparable data to use for quantifying a lack of marketability discount?","opts":["Block sales of restricted stock","Percentage of ownership concentration","Limitation on the pool of potential buyer"],"ans":"A","expl":"A is Correct because restricted stock is generally identical to freely traded stock of a public company except for the trading restrictions. The sale of blocks of restricted stock that exceed public trading activity in the stock may be the most comparable data for quantifying a lack of marketability discount.","explhtml":"<p>A is Correct because restricted stock is generally identical to freely traded stock of a public company except for the trading restrictions. The sale of blocks of restricted stock that exceed public trading activity in the stock may be the most comparable data for quantifying a lack of marketability discount.<\/p>","qhtml":"<div class=\"pp-topic\">Private Company Valuation<\/div><div class=\"qtext\"><p>Which of the following is the most comparable data to use for quantifying a lack of marketability discount?<\/p><\/div>","subj":"equity"},{"n":95,"q":"A private equity investor purchased a non-controlling interest in a private company several years ago. The valuation included a discount for lack of marketability (DLOM). If the firm expects to go public in the near future, its current DLOM is most likely:","opts":["less than the initial DLOM.","equal to the initial DLOM.","greater than the initial DLOM."],"ans":"A","expl":"A is Correct because the company is expecting to go public in the near future. For many early-stage or high-growth companies approaching an IPO, an increase in value may result from lower risk and uncertainty as a company progresses in its development. The lower risk of realizing predicted cash flows or a narrowing of the ranges of possible future cash flows may lead to a reduction in the implied marketability discount.","explhtml":"<p>A is Correct because the company is expecting to go public in the near future. For many early-stage or high-growth companies approaching an IPO, an increase in value may result from lower risk and uncertainty as a company progresses in its development. The lower risk of realizing predicted cash flows or a narrowing of the ranges of possible future cash flows may lead to a reduction in the implied marketability discount.<\/p>","qhtml":"<div class=\"pp-topic\">Private Company Valuation<\/div><div class=\"qtext\"><p>A private equity investor purchased a non-controlling interest in a private company several years ago. The valuation included a discount for lack of marketability (DLOM). If the firm expects to go public in the near future, its current DLOM is most likely:<\/p><\/div>","subj":"equity"},{"n":96,"q":"An analyst seeks to value a private company using a market-based approach. Which of the following methods is based on pricing multiples derived from acquisitions of entire public or private companies?","opts":["Prior transaction method","Guideline transactions method","Guideline public company method"],"ans":"B","expl":"B is Correct because there are three major variations of the market approach. The guideline transactions method (GTM) establishes a value estimate based on pricing multiples derived from the acquisition of control of entire public or private companies. Unlike the GPCM, the GTM uses pricing multiples derived from acquisitions of public or private companies.","explhtml":"<p>B is Correct because there are three major variations of the market approach. The guideline transactions method (GTM) establishes a value estimate based on pricing multiples derived from the acquisition of control of entire public or private companies. Unlike the GPCM, the GTM uses pricing multiples derived from acquisitions of public or private companies.<\/p>","qhtml":"<div class=\"pp-topic\">Private Company Valuation<\/div><div class=\"qtext\"><p>An analyst seeks to value a private company using a market-based approach. Which of the following methods is based on pricing multiples derived from acquisitions of entire public or private companies?<\/p><\/div>","subj":"equity"},{"n":97,"q":"Which of the following private company valuation approaches corresponds to the discounted cash flow method?","opts":["Market approach","Income approach","Asset-based approach"],"ans":"B","expl":"B is Correct because the income approach corresponds to the discounted cash flow approach to valuation introduced earlier for public companies.","explhtml":"<p>B is Correct because the income approach corresponds to the discounted cash flow approach to valuation introduced earlier for public companies.<\/p>","qhtml":"<div class=\"pp-topic\">Private Company Valuation<\/div><div class=\"qtext\"><p>Which of the following private company valuation approaches corresponds to the discounted cash flow method?<\/p><\/div>","subj":"equity"},{"n":98,"q":"An analyst prepares the following information (all € figures in thousands) to estimate the value of a private company: The equity valuation (in € thousands) of the company, from the perspective of a non-controlling shareholder, is closest to:","opts":["78,859.","92,775.","94,584."],"ans":"A","expl":"A is Correct because as shown below this calculates the present value of 4 years of FCFF plus the terminal value to determine enterprise value (EV), then adjusts the EV for the debt value and DLOM","explhtml":"<p>A is Correct because as shown below this calculates the present value of 4 years of FCFF plus the terminal value to determine enterprise value (EV), then adjusts the EV for the debt value and DLOM<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp133.webp\" style=\"max-width:min(100%,721px)\" alt=\"\">","qhtml":"<div class=\"pp-topic\">Private Company Valuation<\/div><div class=\"qtext\"><p>An analyst prepares the following information (all € figures in thousands) to estimate the value of a private company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp126.webp\" style=\"max-width:min(100%,547px)\" alt=\"\"><p>The equity valuation (in € thousands) of the company, from the perspective of a non-controlling shareholder, is closest to:<\/p><\/div>","subj":"equity"},{"n":99,"q":"An analyst gathers the following information about a private company: Based on the excess earnings method, the company’s value is:","opts":["$818,000.","$1,020,000.","$1,029,500."],"ans":"C","expl":"C is Correct because the excess earning method (EEM) is the fair market value of tangible assets + present value of excess earnings (residual value). First, calculate residual income (RIt) = normalized earnings – (required return on working capital × working capital amount) – (required return on fixed assets × fixed assets amount) = $80,000 – (4% × $300,000) – (10% × $500,000) = $18,000 Second, value intangible assets using the growing perpetuity RVt = (RIt × (1 + g)) / (rRI – g) = ($18,000 × (1 + 2%)) / (10% – 2%) = $229,500 Third, firm value = working capital + fixed assets + present value of intangible = $300,000 + $500,000 + $229,500 = $1,029,500.","explhtml":"<p>C is Correct because the excess earning method (EEM) is the fair market value of tangible assets + present value of excess earnings (residual value). First, calculate residual income (RIt) = normalized earnings – (required return on working capital × working capital amount) – (required return on fixed assets × fixed assets amount) = $80,000 – (4% × $300,000) – (10% × $500,000) = $18,000 Second, value intangible assets using the growing perpetuity RVt = (RIt × (1 + g)) / (rRI – g) = ($18,000 × (1 + 2%)) / (10% – 2%) = $229,500 Third, firm value = working capital + fixed assets + present value of intangible = $300,000 + $500,000 + $229,500 = $1,029,500.<\/p>","qhtml":"<div class=\"pp-topic\">Private Company Valuation<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a private company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp127.webp\" style=\"max-width:min(100%,544px)\" alt=\"\"><p>Based on the excess earnings method, the company’s value is:<\/p><\/div>","subj":"equity"},{"n":100,"q":"An analyst gathers the following information about a private company: •The company's normalized EBITDA is $35,000,000 •The comparable peer multiple for EV/EBITDA is 8.0 •The discount for lack of control is 12% •The discount for lack of marketability is 15% Based on the guideline public company method, the value of the company is:","opts":["$209,440,000.","$246,400,000.","$280,000,000."],"ans":"A","expl":"A is Correct because the guideline public company method (GPCM) establishes a value estimate based on observed multiples from trading activity in the shares of public companies viewed as comparable to the subject private company. The preliminary value estimate for the private company = normalized EBITDA × peer multiple of EV/EBITDA = $35,000,000 × 8.0 = $280,000,000. Adjusting the company’s value to reflect a non-controlling and non-marketable shareholder’s perspective. Total Discount = [1 – (1 – DLOC)×(1 – DLOM)] = [1 – (1 – 12%) × (1 – 15%)] = 0.252.","explhtml":"<p>A is Correct because the guideline public company method (GPCM) establishes a value estimate based on observed multiples from trading activity in the shares of public companies viewed as comparable to the subject private company. The preliminary value estimate for the private company = normalized EBITDA × peer multiple of EV/EBITDA = $35,000,000 × 8.0 = $280,000,000. Adjusting the company’s value to reflect a non-controlling and non-marketable shareholder’s perspective. Total Discount = [1 – (1 – DLOC)×(1 – DLOM)] = [1 – (1 – 12%) × (1 – 15%)] = 0.252.<\/p>","qhtml":"<div class=\"pp-topic\">Private Company Valuation<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a private company: •The company&#x27;s normalized EBITDA is $35,000,000 •The comparable peer multiple for EV/EBITDA is 8.0 •The discount for lack of control is 12% •The discount for lack of marketability is 15% Based on the guideline public company method, the value of the company is:<\/p><\/div>","subj":"equity"},{"n":101,"q":"An analyst collects the following data for a privately held company with no debt outstanding and two lines of business: Using a market approach to estimate the EV of the company, the analyst determines the discount for lack of control to be 10% and the discount for lack of marketability to be 12.5%.The EV for the company from a non-controlling, minority interest shareholder perspective is closest to:","opts":["$16,931,250.","$18,406,250.","$18,703,125."],"ans":"C","expl":"C is Correct because it calculates the EV based on the weighted average multiples of the two lines of business and adjusts it for the discount for lack of control (DLOC) and discount for lack of marketability (DLOM). Weighted average multiple to use: (13.1 × 0.60) + (4.1 × 0.40) = 9.5 EV = $2,000,000 × 9.5 = $23,750,000 The adjustment for the DLOC and DLOM is calculated as follows: [1–((1–DLOC) × (1–DLOM))] = [1 – ((1 – 0.10) × (1 – 0.125))] = 21.25% $23,750,000 × (1–0.2125) = $18,703,125","explhtml":"<p>C is Correct because it calculates the EV based on the weighted average multiples of the two lines of business and adjusts it for the discount for lack of control (DLOC) and discount for lack of marketability (DLOM).<\/p><img cla
