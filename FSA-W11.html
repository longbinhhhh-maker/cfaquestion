<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "An analyst calculates the following data: Which of the three companies most likely has the highest return on equity?", "opts": ["Company A", "Company B", "Company C"], "ans": "C", "expl": "ROE measures the profit a company creates from using its equity. DuPont analysis entails decomposing ROE into different components:\nprofitability, efficiency, and leverage. By understanding the components of ROE, a company can determine more particularly how it can\nimprove its ROE.\nROE is the product of the company's return on assets (ROA) and the amount of leverage it uses. ROA (ie, the ratio of net income to asset value)\ncan also be expressed as the product of profit margin and asset turnover. The more profit the company produces and the more efficiently it uses\nits assets, the higher its ROE. A company can also increase ROE by borrowing, which increases its leverage.\nUsing DuPont analysis, ROE is the product of the net profit margin, total asset turnover, and leverage. Company C has the highest ROE, 27.0%\nsince its low efficiency is offset by a high profit margin (Choices A and B).\nThings to remember:\nReturn on equity (ROE) measures the profit a company creates from using its equity (eg, capital). DuPont analysis decomposes ROE into\ndifferent components: profitability, efficiency, and leverage.\nDemonstrate the application of DuPont analysis of return on equity and calculate and interpret effects of changes in its components", "qhtml": null}, {"n": 2, "q": "An analyst has gathered the following information: € millions 20X5 20X6 20X7 Average assets 117.0 116.0 115.0 Average liabilities 96.0 98.0 100.0 Revenues 40.0 42.5 45.0 Net profit margin 8.6% 8.7% 8.8% Using only this information, the most appropriate conclusion is that over the three-year period:", "opts": ["return on assets has declined.", "return on equity has increased.", "total asset turnover has declined."], "ans": "B", "expl": "Return on equity (ROE) is the ratio of net income to average shareholders' equity. It measures earnings for every dollar of shareholder\ninvestment. Analysts carefully track changes in ROE to determine the growth rate of shareholder return as well as the sources of that growth.\nThe company's net income and average equity can be derived from the information given. Net profit margin is equal to net income divided by\nrevenue; rearranging this equation makes it possible to solve for net income (net income = net profit margin × revenue).\nUsing this formula, the table below demonstrates that the company's net income has increased each year:\nSimilarly, equity equals assets minus liabilities, and the company's equity has declined each year, as shown in the table below:\nROE uses average equity as the denominator. A mathematical rule is that dividing a larger number (in this question, net margin) by a smaller\nnumber always produces a larger number. This means that the company's ROE has increased each year:\nThings to remember:\nReturn on equity equals net income divided by average shareholders' equity. Net income equals net profit margin multiplied by revenue. Average\nequity is the difference between average assets and average liabilities. With any ratio, a higher numerator and/or a lower denominator produces a\nlarger number.\nDemonstrate the application of DuPont analysis of return on equity and calculate and interpret effects of changes in its components", "qhtml": null}, {"n": 3, "q": "The 20X9 financial information for a company is shown below: (In $ Millions) Assets 500 Common stock 280 Retained earnings (cumulative) 100 Treasury stock 60 The company's debt to total capital ratio is closest to:", "opts": ["0.24", "0.36", "0.56"], "ans": "B", "expl": "The debt-to-capital ratio is a solvency ratio. Solvency ratios assess a company's ability to pay its long-term debt obligations. The debt-to-capital\nratio shows the amount of a company's debt relative to its overall capital structure (ie, debt plus equity). A lower ratio indicates lower financial\nrisk and greater solvency.\nOn the exam, questions may not be framed in a straightforward manner. In this question, total debt is not provided although it is necessary for the\nanswer. However, debt can be derived from the information given by rearranging the accounting equation:\nAssets = Liabilities + Equity → Liabilities = Assets − Equity\nThe calculations for obtaining each company's debt-to-capital ratio are shown below:\nThe company's debt-to-capital ratio is 0.36.\n(Choice A) 0.24 results from not subtracting Treasury stock when determining the amount of equity. This causes equity to be incorrectly\ncalculated as 280 + 100 = 380, so liabilities would be 500 − 380 = 120.\n(Choice C) 0.56 is approximately the company's debt-to-equity ratio. Remember that the debt-to-capital ratio measures the amount of debt\nrelative to the company's combined debt plus equity.\nThings to remember:\nThe debt-to-capital ratio measures the amount of a company's debt as a percentage of its capital (ie, debt plus equity). Solvency ratios assess a\ncompany's ability to pay its long-term debt obligations.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 4, "q": "A company uses LIFO to determine the valuation for inventory and reports the following under US GAAP: The company discloses that its LIFO reserve in 20X7 was $277 and in 20X6 was $450. If the company used FIFO instead of LIFO for its inventory valuation, then over the last year, the company's current ratio most likely:", "opts": ["decreased.", "remained the same.", "increased."], "ans": "A", "expl": "Companies that use LIFO (last-in, first-out) to value inventory often report lower inventory and higher expense than companies that use FIFO (first-\nin, first-out). Under US GAAP, companies that use LIFO must report the difference between inventory under LIFO and FIFO as the LIFO reserve.\nWhen preparing comparisons between companies that differ in their use of LIFO and FIFO inventory valuation, add back the LIFO reserve to\nconvert LIFO inventory to FIFO.\nIn this case, to find the company's current ratio as it would be under the FIFO method, add the LIFO reserve to current assets (inventory is a part\nof current assets).\nThe current ratio is current assets divided by current liabilities. Using current assets adjusted for FIFO, the current ratio decreases year over year\nfrom 5.33 to 5.04.\n(Choice B) The current ratio would have remained the same with no adjustment for differences in the accounting method.\n(Choice C) The current ratio would have increased by subtracting the LIFO reserve from current assets. To adjust for differences between LIFO\nand FIFO, add the LIFO reserves to inventory. This increases current assets.\nThings to remember:\nWhen comparing companies, some of which use LIFO and some of which use FIFO for inventory reporting, make their inventory values\ncomparable by adding the LIFO reserve to the LIFO inventory valuation.\nDescribe relationships among ratios and evaluate a company using ratio analysis", "qhtml": null}, {"n": 5, "q": "A company reports the following information: Selected Data (¥ billions) Item 20X5 20X6 Revenue 3.4 3.7 Current assets 5.0 5.2 Current liabilities 4.0 4.4 Based on this data, working capital turnover for 20X6 is closest to:", "opts": ["3.94", "4.11", "4.63"], "ans": "B", "expl": "Activity ratios measure how efficiently a company utilizes its assets. The numerator is commonly an income statement item (eg revenue, COGS);\nthe denominator is commonly a balance sheet item (eg, inventory, accounts payable).\nWorking capital (WC) turnover measures how efficiently a company generates sales (revenue) from its current working capital. Working capital is\ndefined as current assets (eg, accounts receivable, inventory) less current liabilities (eg, accounts payable). A high WC turnover suggests that the\ncompany is more efficient at using its short-term assets and liabilities to support sales. In this question, divide 20X6 revenue by the average\nworking capital values to calculate working capital turnover:\nIt is important to note that income statement items (ie, revenue) reflect what happens throughout a period, whereas balance sheet items\n(inventory) reflect the balance at the end of the period. Therefore, in most ratios that mix income statement with balance sheet items, the\nbalance sheet item is averaged to better capture asset levels throughout the period.\n(Choice A) 3.94 results from incorrectly averaging both years' revenue in the numerator.\n(Choice C) 4.63 results from including only 20X6's working capital in the denominator.\nThings to remember:\nA high working capital turnover ratio suggests that the company is efficiently using its short-term assets and liabilities to support sales. When\ncalculating a financial ratio that includes both an income statement and balance sheet items, it is conventional to take the average of the balance\nsheet item.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 6, "q": "An analyst gathers the following information (in INR billions) for a company, selected from its financial statements: INR billions Current Year Prior Year EBIT 204 197 Net income 150 143 Short-term debt 106 110 Long-term debt 434 451 Shareholders' equity 1,509 1,447 Total assets 2,249 2,183 Based on this data, the current year's return on total capital is closest to:", "opts": ["7.39%", "9.21%", "10.06%"], "ans": "C", "expl": "The return on total capital ratio measures the operating profits generated from a company's invested capital. Higher ratios indicate that capital is\nused more effectively.\nThe numerator is EBIT (earnings before interest and taxes), a proxy for operating profit, which represents profits before accounting for\nnonoperating items such as interest and tax.\nThe denominator is average total capital provided by creditors and shareholders, which includes short-term debt, long-term debt, and\nequity.\nIn this scenario, return on total capital is:\n(Choice A) 7.39% results from using net income instead of EBIT in the numerator. Net income is profits after interest and taxes; it represents\nonly profits available for distribution to shareholders.\n(Choice B) 9.21% results from using total assets instead of total capital. Total assets include items not financed by capital provided from lenders\nand shareholders, such as accounts receivable.\nThings to remember:\nReturn on total capital measures the profits produced from a company's invested capital. The numerator is EBIT (earnings before interest and\ntaxes), which represents profits before accounting for nonoperating items such as interest and tax. The denominator represents total capital\nprovided by creditors and shareholders, which includes short-term debt, long-term debt, and equity.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 7, "q": "An analyst calculates the following data for the year ending 20X9. Using DuPont analysis, the firm's return on equity (ROE) is closest to:", "opts": ["15.1%", "18.9%", "25.2%"], "ans": "B", "expl": "Return on equity (ROE) measures the profitability generated per unit of equity invested. Simply defined, ROE is the ratio of net income to average\nshareholders' equity. DuPont analysis subdivides ROE into five underlying components: tax burden, interest burden, profitability,\nefficiency, and leverage. Each component gauges a different aspect of financial performance that contributes to ROE; that detail helps the\ncompany focus efforts at improvement.\nROE can be calculated as the product of the company's return on assets (ROA) and leverage since profitability can be enhanced through\nleverage. ROA, the ratio of net income to assets, can be expressed as the product of net profit margin, a measure of profitability, and asset\nturnover, a measure of efficiency.\n(Choice A) 15.1% is the product of net profit margin and average total assets less the tax rate. The tax burden has already been factored into the\nnet profit margin, so it is inappropriate to deduct it again.\n(Choice C) 25.2% occurs by inappropriately dividing ROA by the debt-to-equity ratio.\nThings to remember:\nReturn on equity (ROE) measures the profitability generated per unit of equity invested. DuPont analysis subdivides ROE into five underlying\ncomponents: tax burden, interest burden, profitability, efficiency, and leverage. ROE can also be calculated as the product of the company's return\non assets (ROA) and leverage.\nDemonstrate the application of DuPont analysis of return on equity and calculate and interpret effects of changes in its components", "qhtml": null}, {"n": 8, "q": "An analyst prepares the following set of assumptions for a company: The initial forecasted revenue is €1 million. In subsequent years, it is estimated to grow at 5%. The company's forecasted initial net income is closest to:", "opts": ["€200,000.", "€320,000.", "€336,000."], "ans": "B", "expl": "A forecast is a projection of how a company will perform in the future. Analysts often develop forecasts from historical information. Forecasts\nhelp analysts evaluate a company's current valuation or creditworthiness.\nHere, forecasted net income is determined using the forecasted revenue. Calculate COGS and operating expenses as a percent of projected\nrevenue. Find earnings before tax (EBT) as projected revenue less COGS and operating expenses. The amount of taxes is the product of the\nEBT and the tax rate. Net income is the difference between EBT and taxes.\n(Choice A) €200,000 is found by calculating taxes as a percent of projected revenue and not a percent of EBT.\n(Choice C) €336,000 is found by calculating revenue as the product of the revenue growth rate and projected revenue. The projection for\nrevenue is the initial revenue amount. A projection includes a growth rate only after the first year.\nThings to remember:\nForecasts are projections of a company's future performance. Analysts develop forecasts from historical information to evaluate a company's\ncurrent valuation or creditworthiness.\nDescribe how ratio analysis and other techniques can be used to model and forecast earnings", "qhtml": null}, {"n": 9, "q": "An analyst collects the following information on a company: Current Prior Year Year Current ratio 2.00 2.00 Quick ratio 1.58 1.63 The company has no prepaid expenses and current liabilities have a year-end balance of $190,000 for each year. Based on this information, which of the following most likely increased during the current year? ", "opts": ["Inventory", "Quick assets", "Current assets"], "ans": "A", "expl": "The current ratio and the quick ratio are both liquidity metrics for a company's ability to meet short-term obligations (ie, those due within a\nyear). Both ratios express the relationship between current assets (eg, cash, short-term marketable investments, receivables, inventory, prepaid\nexpenses) and current liabilities (eg, accounts payable, accrued liabilities, short-term debt). A higher ratio indicates better liquidity.\nThe quick ratio is the more conservative liquidity measure because it most commonly excludes inventory and prepaid expenses in the\nnumerator. Inventory is the least liquid current asset since it takes longest to convert to cash. Prepaid expenses are frequently not convertible to\ncash.\nIn this scenario, first multiply the current liabilities by the current and quick ratios to determine the current and quick assets. Since there are no\nprepaid expenses, the difference between the quick and current assets is the amount of inventory only.\nCurrent assets remained the same but quick assets decreased by $10,000, so inventory must have increased by $10,000 to account for that\ndifference.\n(Choice B) Quick assets decreased due to the same level of current liabilities but a smaller quick ratio.\n(Choice C) Current assets remained the same due to the same level of current liabilities and the same current ratio.\nThings to remember:\nThe current ratio and the quick ratio express the relationship between current assets (eg, cash, short-term marketable investments, receivables,\ninventory, prepaid expenses) and current liabilities (eg, accounts payable, accrued liabilities, short-term debt). The quick ratio is the more\nconservative liquidity measure because it most commonly excludes inventory and prepaid expenses in the numerator.\nDescribe relationships among ratios and evaluate a company using ratio analysis", "qhtml": null}, {"n": 10, "q": "Which of the following is a limitation of ratio analysis?", "opts": ["Different assumptions result in different forecasts.", "Performance from different divisions are consolidated for reporting.", "Adjustments to reconcile results from different accounting standards distort comparisons."], "ans": "B", "expl": "Ratio analysis limitations\nHeterogeneous operations\nInconsistent results\nRatios alone are incomplete\nAccounting differences\nAnalysts often using ratio analysis to assess a company's financial performance or position. Although ratio analysis may provide useful insight, it\nalso comes with limitations:\nHeterogeneity in operation: If the company's divisions individually operate in distinct industries, then combining performance may\noversimplify data at an aggregate level and not provide insight into divisional performance.\nInconsistent interpretation of results: Different ratios may provide conflicting interpretations of performance for the same company. For\nexample, one ratio can suggest improving liquidity whereas another ratio can suggest worsening liquidity.\nThe need for judgment: Analysts must determine whether ratios are reliable in the context of industry and company history. Ratios are\nstatistical measures with no inherent value and alone are incomplete; it is the analyst's interpretation that creates insight.\nDifferent accounting standards: Differences in accounting methods limit the comparability of ratios across companies. For example, one\ncompany may use FIFO inventory reporting whereas another company uses LIFO inventory reporting. Analysts must adjust company\ninformation to ensure a meaningful comparison.\n(Choice A) Interpretations that vary among analysts are a benefit, not a limitation, of ratio analysis. Multiple forecasts and scenarios capture a\nbroader range of expectations.\n(Choice C) Adjusting results to reconcile differences in accounting standards allows for a more valid comparisons.\nThings to remember:\nLimitations of ratio analysis include heterogeneity of operations, inconsistent results, analyst's judgment, and accounting differences. Analysts\nmust anticipate and prepare for these limitations.\nDescribe tools and techniques used in financial analysis, including their uses and limitations", "qhtml": null}, {"n": 11, "q": "An analyst wants to know if a company has decreased its risk of defaulting on its long-term obligations. An increase in which of the following measures is the most appropriate indicator?", "opts": ["Cash ratio", "Interest coverage ratio", "Financial leverage ratio"], "ans": "B", "expl": "Solvency ratios—both coverage and debt ratios—are used by analysts along with other metrics to identify the risk of companies defaulting on\nlong-term obligations. These ratios typically serve to compare a company to its peers or observe the company's trends over time.\nAn interest coverage ratio measures a company's ability to cover its recurring interest payments with income generated from operations.\nSince EBIT is the numerator, a higher ratio indicates that a company has more operating income to cover the payments and therefore a\ndecreased risk of defaulting on its long-term obligations.\n(Choice A) The cash ratio is a liquidity ratio, which measures a company's ability to cover its short-term, not long-term, obligations.\n(Choice C) The financial leverage ratio, a debt ratio, measures the amount of a company's assets relative to its equity. A higher ratio of assets to\nequity indicates that more of a company's assets are funded by debt, so an increase would indicate a greater risk of default.\nThings to remember:\nSolvency ratios are used by analysts to identify a company's risk of defaulting on long-term obligations. The interest coverage ratio measures a\ncompany's ability to cover its recurring interest payments with income generated from operations. A higher ratio indicates a reduced risk of default.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 12, "q": "An analyst compiles the following data from a company's financial statements: SAR millions 20X6 20X5 20X4 Revenue 1,600 1,400 1,300 Net income 200 100 100 Current assets 550 500 500 Total assets 2,150 1,700 1,600 Current liabilities 350 300 300 Total debt 1,100 800 800 Total liabilities 1,350 1,000 900 Based on only this information, the change in which of the following ratios from 20X5 to 20X6 most likely would be considered an improvement to profitability or solvency?", "opts": ["Debt-to-equity ratio", "Return on equity ratio", "Financial leverage ratio"], "ans": "B", "expl": "Financial ratios can be useful indicators of a company's health and performance and therefore are used extensively in financial analysis. Ratios\ntypically require context, either comparing them to other companies or to the same ratio in prior periods.\nIn this scenario, the level of debt affects all three ratios. The debt-to-equity ratio and financial leverage ratio both measure a company's leverage.\nGreater proportions of debt increase a company's leverage, causing both ratios to increase. Debt also increases a company's interest expense,\ncausing its net income and return on equity (ROE) to be more sensitive to changes in operating income.\nROE is a profitability ratio that measures the return (ie, net income) earned by a company's equity shareholders. Higher ROE ratios indicate a\nhigher rate of return for each dollar of equity invested. In this scenario, equity must be calculated before calculating ROE. Liabilities are used to\ncalculate equity since a company's shareholders have claims on its assets only after all obligations (eg, debt, accounts payable) have been paid.\nSteps 20X6 20X5\nEquity = Equity =\n20X6 20X5\nCalculate year-end equity: 2,150 − 1,350 = 800 1,700 − 1,000 = 700\nAssets − Liabilities Equity = Equity =\n20X5 20X4\n1,700 − 1,000 = 700 1,600 − 900 = 700\nEquity = Equity =\nAvg Avg\nCalculate average equity\n(800 + 700) / 2 = 750 (700 + 700) / 2 = 700\nCalculate ROE: ROE = ROE =\nNet income / Average equity 200 / 750 = 26.7% 100 / 700 = 14.3%\nThe company's ROE increased from 14.3% in 20X5 to 26.7% in 20X6, indicating an improvement of profitability.\n(Choice A) The company's debt-to-equity ratio increased from 1.14 in 20X5 to 1.38 in 20X6, indicating a decline in solvency.\n(Choice C) The company's financial leverage ratio increased from 2.43 in 20X5 to 2.69 in 20X6, indicating a decline in solvency.\nThings to remember:\nReturn on equity is a profitability ratio that measures the return earned by a company's equity shareholders.\nDescribe relationships among ratios and evaluate a company using ratio analysis", "qhtml": null}, {"n": 13, "q": "A company reports the following information (in HKD thousands): Based on this data, the company's defensive interval ratio is closest to:", "opts": ["59 days.", "60 days.", "62 days."], "ans": "B", "expl": "A defensive interval ratio calculates the number of days that a company can cover its expenses with only its existing liquid assets. The\nnumerator consists of quick assets that are readily convertible into cash, which excludes inventory, prepaid assets, and deferred taxes. The\ndenominator includes all daily expenses except noncash items (eg, depreciation, stock-based compensation).\n(Choice A) 59 days results from including stock-based compensation and depreciation, which are both noncash items, in the denominator.\n(Choice C) 62 days results from including inventory in the numerator. Inventory is typically less liquid than other current assets.\nThings to remember:\nA defensive interval ratio calculates the number of days that a company can cover its expenses with only its existing liquid assets. The numerator\nconsists of quick assets that are readily convertible into cash, which excludes inventory, prepaid assets, and deferred taxes. The denominator\nincludes all daily expenses except noncash items (eg, depreciation, stock-based compensation).\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 14, "q": "An analyst collects the following information on three companies: Which company has the highest price-to-book ratio?", "opts": ["Company A", "Company B", "Company C"], "ans": "C", "expl": "Valuation ratios compare a stock price to a value measure, such as book value (BV), earnings, cash flow, or sales. A price-to-book (P/B) ratio\nindicates the price of a company's stock as a multiple of the company's BV of net assets (ie, assets minus liabilities). The price per share is the\nquoted market price.\nThe P/B ratio can be calculated using per-share or total values:\nMarket price per share divided by BV of net assets per share\nTotal market capitalization divided by total BV of net assets\nThe per-share calculation is more common since the market price is quoted on a per-share basis. In this scenario, Company C has a higher P/B\nratio (1.71) than the other two companies (Choices A and B).\nThings to remember:\nA price-to-book (P/B) ratio indicates a company's market value as a multiple of its book value (BV) of net assets. The P/B ratio can be calculated\nusing per-share or total values. The most common approach is to divide the market price per share by the BV of net assets per share.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 15, "q": "Which of the following factors is most likely to cause a low fixed-asset turnover ratio? A company:", "opts": ["has newer fixed assets.", "is a labor-intensive business.", "has a high amount of working capital."], "ans": "A", "expl": "Summary of fixed-asset turnover ratio\nActivity ratio\nRatio = Revenue / Average fixed assets\nHigher ratio is desirable\nIndicates more efficient use of fixed assets\nLower ratio does not always indicate inefficiency\nCompany may have newer fixed assets\nCompany may be capital-intensive\nActivity ratios measure the revenue a company generates relative to its assets. The fixed-asset turnover ratio analyzes revenue relative to the\nbook value of a company's long-term assets (ie, PPE). A high ratio suggests that the company is efficient in using its fixed assets to generate\nrevenue.\nSince assets are the ratio's denominator, a greater amount of PPE results in a lower ratio than a smaller amount of PPE. In general, newer assets\nhave a greater book value due to lower depreciation, which results in a lower fixed-asset turnover ratio.\n(Choice B) A labor-intensive business uses proportionally fewer fixed assets than a capital-intensive business and is more likely to have a\nrelatively high fixed-asset turnover ratio.\n(Choice C) Working capital is the difference between current assets and current liabilities. Since working capital does not impact fixed assets, the\namount of a company's working capital has no bearing on the company's fixed-asset turnover ratio.\nThings to remember:\nThe fixed-asset turnover ratio analyzes revenue relative to the book value of a company's average fixed assets. A high ratio suggests that the\ncompany is efficient in using its fixed assets to generate revenue. Newer fixed assets have a greater book value, which results in a lower fixed-\nasset turnover ratio.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 16, "q": "A consultant gathers the following profitability ratios for a company: Based on this information, over this period the company most likely improved its ability to cover: ", "opts": ["raw material costs.", "operating expenses.", "nonoperating expenses."], "ans": "A", "expl": "Profit margins (profit / revenue) indicate a company's ability to generate adequate sales to cover various costs:\nGross margin measures ability to cover COGS, which are costs directly attributable to producing the goods and services sold (eg, raw\nmaterial costs, production wages, distribution costs).\nOperating margin measures ability to further cover operating expenses such as marketing or research and development.\nPretax margin measures ability to further cover certain nonoperating expenses such as financing costs (eg, interest).\nNet margin measures ability to further cover taxes.\nIn this scenario, gross margin increased over time, which means the company improved its ability to cover COGS, including raw material costs.\n(Choice B) Operating margin decreased over time, which suggests a worsened ability to cover operating expenses.\n(Choice C) Pretax margin remained unchanged, which suggests deterioration or no improvement in the company's ability to cover nonoperating\nexpenses (before taxes).\nThings to remember:\nProfit margin percentages (profit / revenue) indicate a company's ability to generate adequate sales to cover various costs. Gross margin\nmeasures ability to cover COGS; operating margin measures ability to cover operating expenses; pretax margin measures ability to cover\nnonoperating expenses (before taxes); and net margin measures ability to cover taxes.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios\n17.A company's manager collects the following data:\nBased on only this data, the company's interest coverage ratio is closest to:\nA. 2.50\nB. 3.50\n\nC. 4.75\nExplanation\nSolvency ratios convey a company's ability to meet its long-term debt obligations. There are two types of solvency ratios:\nDebt ratios measure a company's debt levels relative to its assets or equity. Declining debt ratios indicate that less asset value is financed\nby debt and, therefore, there is less financial risk and stronger solvency.\nCoverage ratios measure a company's ability to pay its required interest payments, based on income and expenses. Rising coverage\nratios mean the company's solvency is stronger since it has relatively more earnings available to pay interest.\nIn this scenario, the focus is on calculating the interest coverage ratio, defined as EBIT divided by interest payments. Interest payments and taxes\nare added back to net income to w EBIT.\nApplying the interest coverage ratio, the company has interest payments covered 4.75 times by EBIT. Put another way, EBIT is 4.75 times larger\nthan the company's interest obligations.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 17, "q": "A company's manager collects the following data: Based on only this data, the company's interest coverage ratio is closest to:", "opts": ["2.50", "3.50", "4.75"], "ans": "C", "expl": "Solvency ratios convey a company's ability to meet its long-term debt obligations. There are two types of solvency ratios:\nDebt ratios measure a company's debt levels relative to its assets or equity. Declining debt ratios indicate that less asset value is financed\nby debt and, therefore, there is less financial risk and stronger solvency.\nCoverage ratios measure a company's ability to pay its required interest payments, based on income and expenses. Rising coverage\nratios mean the company's solvency is stronger since it has relatively more earnings available to pay interest.\nIn this scenario, the focus is on calculating the interest coverage ratio, defined as EBIT divided by interest payments. Interest payments and taxes\nare added back to net income to w EBIT.\nApplying the interest coverage ratio, the company has interest payments covered 4.75 times by EBIT. Put another way, EBIT is 4.75 times larger\nthan the company's interest obligations.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 18, "q": "An analyst calculates the following from a company's financial statements: Which of the following best describes the change in the company's relative valuation?", "opts": ["It is lower since return on assets decreased.", "It is higher since price to earnings increased.", "It is unchanged since debt-to-equity is constant."], "ans": "B", "expl": "Valuation ratios compare a stock price to a per-share value measure. Value measures include the company's earnings, cash flow, sales, or book\nvalue. The P/E ratio indicates the price an investor pays for one share of the company's earnings. The price per share is the quoted market\nprice. The company's earnings per share is its net income divided by outstanding shares. Here, the P/E ratio increased from 13.3 to 16.9, so\nthe company's value relative to earnings increased.\nHowever, a P/E ratio should be interpreted with caution since net income may distort the P/E ratio. Earnings may be distorted since\nmanagement can manipulate earnings by choosing self-serving accounting methods and accounting conventions require that management\ninclude one-time transactions in net income. Where earnings are subject to such influences, reported net income should be adjusted or\nalternative valuation ratios should be used (eg, price to cash flow).\n(Choice A) Return on assets is a ratio of net income to average total assets. It is a measure of a company's profitability, not its valuation.\n(Choice C) The debt-to-equity ratio gauges a company's relative debt level and is a measure of the company's solvency (eg, leverage), not its\nvaluation.\nThings to remember:\nThe P/E ratio indicates the price an investor pays for a share of the company's profits. The price per share is the quoted market price. The\ncompany's earnings per share is its net income divided by outstanding shares. Net income can be distorted by one-time transactions or\nmanipulated by management.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 19, "q": "An analyst collects the following information about a company: For the year ended 20X5, the company's total asset turnover (TAT) is closest to:", "opts": ["6", "7", "8"], "ans": "C", "expl": "Total asset turnover (TAT) is an activity ratio that measures a company's overall efficiency in using its assets to create revenue. TAT is\ncalculated by dividing current-period revenue by the average amount of total assets over the current period. All else equal, a higher ratio is\npreferred since it indicates that the company can generate more revenue from a relatively small amount of assets.\nIn this scenario, average total assets for 20X5 is CNY 175 million and TAT is 8. This means that the company produces, on average, CNY 8.0 of\nrevenue for each CNY 1.0 of asset values. Put another way, the company's assets generate eight times their value in revenue.\n(Choice A) A TAT of 6 is the result of inappropriately using an average revenue instead of total revenue for 20X5. TAT uses average assets, not\naverage revenue.\n(Choice B) A TAT of 7 is found by using total assets for 20X5 instead of average total assets over the current period.\nThings to remember:\nActivity ratios measure a company's efficiency and indicate its operational performance. Total is a measure of the company's overall efficiency. It\nis calculated by dividing revenue by total average assets.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 20, "q": "A company reports the following information: Based only on this information, which of the following best describes the change in the company's profitability?", "opts": ["Operating profit margin and net profit margin both increased.", "Operating profit margin and net profit margin both decreased.", "Operating profit margin decreased and net profit margin increased."], "ans": "C", "expl": "A company's profit margin, a type of profitability ratio, measures a company's profit relative to its revenue. Different types of profit margins\nincorporate different expenses to determine a company's profitability.\nHere, find the changes in operating profit margin and net profit margin to determine how the company's profitability changed:\nDetermine the operating profit margin by calculating operating income and comparing it to revenue. Operating income is earnings that\nremain after subtracting COGS and operating expenses from revenue.\nDetermine the net profit margin by calculating net income and comparing it to revenue. To calculate net income, subtract all expenses\n(ie, including interest and taxes) from revenue.\nCalculate the two profit margins as follows:\nThe operating profit margin declined from 53.33% to 50.00%. The net profit margin increased from 36.30% to 43.33%.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 21, "q": "An analyst compiles the following information about a company: 20X2 20X3 ROE 16.7% 17.2% Total asset turnover 1.06 1.07 Leverage 1.53 1.61 Based on only this information, the most appropriate conclusion is that:", "opts": ["return on assets increased and net profit margin increased.", "return on assets decreased and net profit margin increased.", "return on assets decreased and net profit margin decreased."], "ans": "C", "expl": "A company's ROE measures the level of profit, as measured by net income, the company can generate with the equity invested by shareholders.\nDuPont analysis breaks down ROE into its component factors to understand which elements are driving the company's returns.\nThe first level of DuPont analysis separates ROE into the return on assets ratio (ROA) and the leverage ratio. ROA is then broken down into the\nnet profit margin and total asset turnover ratios. This process separates ROE into three elements:\nProfitability, measured by the net profit margin ratio\nEfficiency, measured by the asset turnover ratio\nLeverage, measured by the leverage ratio\nThose elements can be broken down by additional levels of DuPont analysis.\nIn this scenario, the company's ROA is determined from the ROE and leverage ratios as follows:\nROE = ROA × Leverage\nROA = ROE / Leverage\nROA = 0.167 / 1.53 ≈ 10.9%\n20X2\nROA = 0.172 / 1.61 ≈ 10.7%\n20X3\nBetween 20X2 and 20X3, the company's ROA declined from 10.9% to 10.7% (Choice A). The calculated ROA can be used to determine the\ncompany's net profit margin as follows:\nROA = Net profit margin × Total asset turnover\nNet profit margin = ROA / Total asset turnover\nNet profit margin = 0.109 / 1.06 ≈ 10.3%\n20X2\nNet profit margin = 0.107 / 1.07 = 10.0%\n20X3\nBetween 20X2 and 20X3, the company's net profit margin declined from 10.3% to 10.0% (Choice B).\nThings to remember:\nDuPont analysis breaks down a company's ROE to identify which of its component factors are driving returns. The first level of DuPont analysis\nseparates ROE into the return on assets ratio (ROA) and the leverage ratio. ROA can then be broken down into the net profit margin and total\nasset turnover ratios.\nDemonstrate the application of DuPont analysis of return on equity and calculate and interpret effects of changes in its components", "qhtml": null}, {"n": 22, "q": "A company reports the following information: ¥ billions 20X8 20X9 Revenue 8.5 9.3 Net income 3.1 3.3 Gross fixed assets 19.5 22.0 Accumulated depreciation (3.0) (3.0) Net fixed assets 16.5 18.5 Based on this data, fixed asset turnover in 20X9 is closest to:", "opts": ["0.19", "0.45", "0.53"], "ans": "C", "expl": "Fixed asset (FA) turnover measures how efficiently a company generates revenue with its net FAs (ie, gross FAs less accumulated\ndepreciation). FAs are used over the long term and typically consist of property, plant & equipment (PPE) and intangible assets.\nHigh FA turnover may indicate that a company is using its FAs efficiently to generate sales (eg, operating machines near capacity).\nLow FA turnover may indicate that a company is not using its FAs efficiently (eg, there is excess capacity) or that the assets are relatively\nnew, and therefore net FA is high due to little depreciation.\nIn this question, divide 20X9 revenue by the average net FA to calculate FA turnover.\nIt should be noted that income statement items (eg, revenue) reflect what happens throughout a period, whereas balance sheet items (eg, net\nFAs) reflect the balance at the end of the period. In most ratios that mix an income statement item with a balance sheet item, the balance sheet\nitem is averaged to better capture changes throughout the period. Therefore, FAs are averaged to better reflect the level of FAs throughout the\nyear.\n(Choice A) 0.19 results from using 20X9 net income instead of revenue in the numerator.\n(Choice B) 0.45 results from using gross FAs instead of net FAs in the denominator. Gross FAs represent the assets' historical cost and do not\ncapture estimated wear and tear on the equipment (ie, depreciation).\nThings to remember:\nFixed asset (FA) turnover measures how efficiently a company generates revenue with its net FAs. High FA turnover may indicate that the\ncompany is efficiently operating near capacity. Low FA turnover may indicate that the company is not using its FAs efficiently or that the assets are\nrelatively new.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 23, "q": "A firm reports the following information (in RUB millions): RUB Millions Current Year Prior Year EBIT 232 216 Net income 186 173 Preferred dividends 10 10 Common equity 3,720 3,460 Based on this data, the current year's return on common equity is closest to: ", "opts": ["4.90%", "5.18%", "6.18%"], "ans": "A", "expl": "Return on common equity (ROCE) gauges the amount of residual net income (after accounting for preferred dividends) generated relative to\ncommon equity. Preferred dividends are subtracted from net income since common shareholders receive distributions only after preferred\nshareholders receive their dividends. Greater ROCE ratios suggest that a company is more effective in using common equity to generate a return\nfor common shareholders.\nROCE should not be confused with ROE (return on equity). ROE measures the return for all equity investors (preferred and common) and is\ncalculated as net income / average total equity.\n(Choice B) 5.18% results from failing to subtract preferred dividends from net income. ROCE measures return for common shareholders only, so\ndistributions to preferred shareholders (ie, preferred dividends) should be taken out.\n(Choice C) 6.18% results from incorrectly using EBIT, instead of net income, in the calculation. EBIT measures profits before interest and taxes,\nwhich reduce income available to common shareholders.\nThings to remember:\nReturn on common equity (ROCE) measures the amount of residual net income (after accounting for preferred dividends) generated relative to\ncommon equity. Greater ROCE ratios suggest that a company is effective in using common equity to generate a return for common shareholders.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 24, "q": "An analyst completes the following DuPont analysis on two companies: Compared with Company Y, Company X mostly likely has a:", "opts": ["lower ROE and is more efficient.", "higher ROE and has a higher profit margin.", "higher ROE and a higher proportion of debt."], "ans": "C", "expl": "DuPont analysis entails decomposing ROE into five components. In this case, multiply the five components together to find the ROE of\nCompanies X and Y, which are 16.20% and 15.55%, respectively. Company X has a higher ROE despite its lower profitability (0.10 vs. 0.18) and\nefficiency (0.90 vs. 1.20) compared with Company Y's. Company X has greater leverage (ie, proportion of debt) than Company Y (3.00 vs 1.20),\nwhich is why Company X's ROE is greater than Company Y's (Choices A and B).\nLeverage is a gauge of solvency as measured by the company's assets relative to its average total equity. The higher the ratio, the more the\ncompany finances its assets with debt.\nThings to remember:\nROE measures the profits a company creates from using its equity (eg, capital). DuPont analysis decomposes ROE into five components: tax\nburden, interest burden, profitability, efficiency, and leverage. It is helpful to identify which specific components contribute to changes in ROE.\nDemonstrate the application of DuPont analysis of return on equity and calculate and interpret effects of changes in its components", "qhtml": null}, {"n": 25, "q": "An analyst gathers the following data for a company: Prior Current (¥ billions) Year Year Sales 540 500 Net income 120 100 Average total assets 2,200 2,100 If return on equity (ROE) was 0.12 in the prior year and 0.14 in the current year, then the increase in ROE is most appropriately attributed to increased: ", "opts": ["leverage.", "efficiency.", "profitability."], "ans": "A", "expl": "Return on equity (ROE) measures the level of net income generated by a company's use of equity. Classic DuPont analysis decomposes ROE\ninto three distinct components: profitability, efficiency, and leverage.\nProfitability, measured by net profit margin, gauges the level of profit from sales.\nEfficiency, measured by total asset turnover, gauges the ability to generate sales by using assets.\nFinancial leverage is the ratio of total assets to equity capital. Firms with higher leverage have a greater percentage of assets financed with\ndebt.\nAn increase to any one component, all else equal, will positively impact ROE.\nIn this scenario, ROE increased from 0.12 to 0.14. To determine the cause of the increase, first calculate the net profit margin and total asset\nturnover, and then plug those values into the overall ROE equation to solve for leverage. Finally, compare the current component values to the\nprior year values. In this case, the increase in ROE is driven by increased leverage.\nNote: Leverage can also be determined based on its relationship to ROE and return on assets (ROA): ROE = ROA × Leverage.\n26.An entrepreneur starts a company by investing $300,000 of equity to fund working capital. The entrepreneur makes the following forecast\nassumptions:\nFirst-year sales $500,000\nAnnual sales growth 8%\nNet profit margin 30%\nWorking capital / Sales 80%\nBased only on this information, the company's cash balance at the end of the second year is closest to:\nA. $32,000\nB. $50,000\n\nC. $180,000\nExplanation\nBusinesses often rely on key assumptions to forecast long-term financial performance. The forecast assumptions often rely on:\nA growth rate to forecast sales\nCost or profit margin as a percent of sales to forecast cost or margin in currency terms\nWorking capital investments\nFixed capital investments\nFinancing from external sources (eg, issuing debt or equity)\nAs shown, at the end of Year 2, the company's net income (at 30% of sales) is $162,000. Working capital investments are $32,000, as reflected in\nthe change in working capital levels from $400,000 to $432,000. Netting Year 2's net income with investments in working capital results in\n$130,000 cash inflow. Since Year 2's beginning cash balance is $50,000, this $130,000 increase in cash results in an ending cash balance of\n$180,000.\n(Choice A) $32,000 is the change in working capital in Year 2.\n(Choice B) $50,000 is the ending balance of cash in Year 1.\nThings to remember:\nBusinesses often rely on key assumptions to forecast long-term financial performance. This change in cash is forecast using assumptions about\nsales growth, profit margin, and working capital investments.\nDescribe how ratio analysis and other techniques can be used to model and forecast earnings", "qhtml": null}, {"n": 26, "q": "An entrepreneur starts a company by investing $300,000 of equity to fund working capital. The entrepreneur makes the following forecast assumptions: First-year sales $500,000 Annual sales growth 8% Net profit margin 30% Working capital / Sales 80% Based only on this information, the company's cash balance at the end of the second year is closest to:", "opts": ["$32,000", "$50,000", "$180,000"], "ans": "C", "expl": "Businesses often rely on key assumptions to forecast long-term financial performance. The forecast assumptions often rely on:\nA growth rate to forecast sales\nCost or profit margin as a percent of sales to forecast cost or margin in currency terms\nWorking capital investments\nFixed capital investments\nFinancing from external sources (eg, issuing debt or equity)\nAs shown, at the end of Year 2, the company's net income (at 30% of sales) is $162,000. Working capital investments are $32,000, as reflected in\nthe change in working capital levels from $400,000 to $432,000. Netting Year 2's net income with investments in working capital results in\n$130,000 cash inflow. Since Year 2's beginning cash balance is $50,000, this $130,000 increase in cash results in an ending cash balance of\n$180,000.\n(Choice A) $32,000 is the change in working capital in Year 2.\n(Choice B) $50,000 is the ending balance of cash in Year 1.\nThings to remember:\nBusinesses often rely on key assumptions to forecast long-term financial performance. This change in cash is forecast using assumptions about\nsales growth, profit margin, and working capital investments.\nDescribe how ratio analysis and other techniques can be used to model and forecast earnings", "qhtml": null}, {"n": 27, "q": "Which of the following is the best use of ratio analysis for a company?", "opts": ["Analyzing historical profitability ratios to make credit decisions", "Analyzing current-year liquidity ratios to confirm the company's stock performance", "Analyzing historical cross-sectional ratio trends to gain insights on the company's relative valuation"], "ans": "C", "expl": "Insights gained from financial ratio analysis\nComprehension of: Helps in assessing:\nInternal economic relationships Projected free cash flow\nCurrent financial status Ability to expand and pay debts\nManagement's strategy execution Reliance on management's claims\nPeer and time-series analysis Absolute and relative performance\nRatio analysis entails reviewing a company's activity, leverage, profitability, and valuation ratios. Detecting important economic connections\nbetween different ratios is crucial in making economic decisions; the ratios alone are just statistics regarding a company's performance.\nAnalysts seek connections between ratios from time-series or cross-sectional analyses. A company's efficiency may impact its profitability, which\nin turn affects its valuation. Analysts must use inferences from ratio analyses to form independent judgments. They then use these judgments to\narrive at economic conclusions (eg, creditworthiness, stock price).\n(Choice A) Historical profitability ratios show the company's ability to generate profit, but since profit is different from cash flow, these ratios are\nnot useful in determining the company's creditworthiness.\n(Choice B) The current year's liquidity ratios are data that may indicate the company's ability to pay short-term debts. Only a comprehensive\nevaluation of all ratios over time can provide an understanding of the company's overall performance, not just its liquidity.\nThings to remember:\nRatio analysis entails reviewing a company's activity, leverage, profitability, and valuation ratios. Detecting important economic connections\nbetween different ratios is crucial in making economic decisions; the ratios alone are just statistics regarding a company's performance. Analysts\nseek connections between ratios from time-series or cross-sectional analyses.\nDescribe tools and techniques used in financial analysis, including their uses and limitations", "qhtml": null}, {"n": 28, "q": "A manager prepares the following data based on a company's financial statements: Which of the following best describes why the return on equity remained constant at 16.8%?", "opts": ["The company's efficiency and profitability both improved.", "The improvement in efficiency is offset by a decline in profitability.", "Improved profitability matches the decline in the company's efficiency."], "ans": "B", "expl": "ROE measures the profits a company creates from using its equity (eg, capital). DuPont analysis entails decomposing ROE into five\ncomponents. Each component gauges a different aspect of the company's performance and provides insight into the company's strengths and\nweaknesses.\nHere, ROE remained constant since a more efficient asset turnover (increased from 0.75 to 1.20) is offset by worsening profitability (the EBIT\nmargin decreased from 0.16 to 0.10). Efficiency is measured by asset turnover or the amount of revenue produced using the firm's assets; when\nmore revenue can be produced using less asset value, the company is more efficient. Profitability is the level of profits before interest and taxes\nrelative to revenue and is considered a profit (ie, EBIT) margin.\n(Choice A) For a company to improve its profitability, the EBIT margin must increase, not decrease.\n(Choice C) The company improved its efficiency with a higher, not lower, asset turnover.\nThings to remember:\nROE measures the profits a company creates from using its equity (eg, capital). DuPont analysis decomposes ROE into five factors: tax burden,\ninterest burden, profitability, efficiency, and leverage.\nDemonstrate the application of DuPont analysis of return on equity and calculate and interpret effects of changes in its components", "qhtml": null}, {"n": 29, "q": "An analyst collects the following annual data for a company: Which of the following best describes how the company's efficiency compares with the industry?", "opts": ["The company has a receivable turnover that is better.", "The company has more effective inventory management.", "The company produces less revenue for a given asset level."], "ans": "B", "expl": "Activity ratios measure how efficient a company is and indicate its operational performance. Days of inventory on hand (DOH), an activity ratio,\nindicates management's effectiveness in overseeing its inventory. DOH is the average number of days it takes a company to convert inventory\n(eg, current assets) into revenue.\nThe ratio is calculated as the number of days in the period divided by the company's inventory turnover (COGS/average inventory). Lower DOH\nsuggests that management has a lower drain on company assets and generates revenue more quickly. Here, it has more effective inventory\nmanagement than its peers since its DOH is less than the industry average (25.42 < 29.77).\n(Choice A) Using the days of sales outstanding formula, the company's receivable turnover of 8.09 (45.10 = 365 / receivable turnover) is lower\nthan the industry's of 12.13 (30.09 = 365/receivable turnover). Its receivable turnover is worse, not better than the industry average. If the days of\nsales outstanding (DSO) is lower than the industry average, so is the receivable turnover since they are effectively the same; DSO converts\nturnover into a time measurement.\n(Choice C) Total asset turnover is a ratio that measures a company's overall efficiency; a higher ratio means the company is more efficient at\ngenerating revenue for a given level of assets. The company produces more revenue for a given asset level than its peers since its total asset\nturnover is greater (1.20 > 1.15) than the industry average.\nThings to remember:\nDays of inventory on hand (DOH) indicates management's effectiveness in overseeing its inventory. It is the average number of days it takes a\ncompany to convert inventory (eg, current assets) into revenue. Lower DOH suggests that management has a lower drain on company assets\nand generates revenue more quickly.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 30, "q": "Using DuPont analysis, an analyst compiles the following data for a company: 20X7 20X6 20X5 Return on equity 16.7% 16.5% 15.9% Return on assets 6.0% 6.2% 6.4% Based only on this information, and assuming revenue and net income were unchanged during this period, the most appropriate conclusion is that the company's: ", "opts": ["leverage increased.", "total asset turnover increased.", "average shareholders' equity increased."], "ans": "A", "expl": "Return on equity (ROE) measures the profitability generated per unit of equity invested. Simply defined, ROE is the ratio of net income to average\nshareholders' equity. DuPont analysis subdivides ROE into five underlying components: tax burden, interest burden, profitability, efficiency, and\nleverage. ROE can be expressed as the product of the company's return on assets (ROA) and leverage since profitability can be enhanced by\nusing leverage.\nROE can be further subdivided using the components of ROA, the product of net profit margin and total asset turnover. This form of ROE\ncalculation is often referred to as the three-factor model.\nIn this instance, ROE increased during the period 20X5 to 20X7. Since ROE is the product of ROA and leverage, and ROA decreased, leverage\nmust have increased to result in an increase of ROE.\nThings to remember:\nReturn on equity (ROE) measures the profitability generated per unit of equity invested. Simply defined, ROE is the ratio of net income to average\nshareholders' equity. DuPont analysis subdivides ROE into five underlying components: tax burden, interest burden, profitability, efficiency, and\nleverage. ROE can be expressed as the product of the company's return on assets and leverage.\nDemonstrate the application of DuPont analysis of return on equity and calculate and interpret effects of changes in its components", "qhtml": null}, {"n": 31, "q": "An analyst gathers the following information on two companies: ($ millions) Company A Company B Cash 100 120 Short-term marketable investments 40 25 Accounts receivable 40 55 Inventory 100 120 Current liabilities 255 275 Based on this information, compared to Company B, Company A most likely has a higher: ", "opts": ["cash ratio.", "quick ratio.", "current ratio."], "ans": "A", "expl": "Analysts use liquidity ratios to assess a company's ability to meet short-term obligations, based on some measure of current assets available\nto fund current liabilities. Three common liquidity ratios are the current ratio, quick ratio, and cash ratio, which differ in how they measure available\ncurrent assets. The denominator of each ratio is current liabilities, but their numerators are as follows:\nCurrent ratio: cash, short-term investments, accounts receivable, inventory, and prepaid expenses\nQuick ratio: assets that can be \"quickly\" liquidated (ie, cash, short-term investments, accounts receivable)\nInventory is excluded since it typically takes longer to convert to cash.\nPrepaid expenses are also excluded since typically they cannot be converted to cash.\nCash ratio: only cash and short-term investments, the most liquid of current assets\nThis makes the cash ratio the most conservative of the three measures with respect to a company's ability to satisfy its current liabilities. In this\nscenario, Company A has a higher cash ratio than Company B since Company A has more cash and short-term marketable investments relative to\nits short-term obligations.\nThings to remember:\nThe current ratio, quick ratio, and cash ratio are common liquidity ratios. All three use current liabilities as the denominator, but each has a\ndifferent numerator: all current assets in the current ratio; cash, short-term marketable investments, and receivables in the quick ratio; and cash\nand short-term marketable investments in the cash ratio. The cash ratio is the most conservative of the three measures since its current assets\nhave the highest liquidity.\nDescribe relationships among ratios and evaluate a company using ratio analysis", "qhtml": null}, {"n": 32, "q": "Company A's management wishes to increase working capital by lowering the company's average receivable collection period to the industry average. Data for Company A is below: (EUR millions) Company A Days sales outstanding (DSO) 23 days 20X7 credit sales 100 20X8 estimated credit sales 125 To match the industry average days sales outstanding (DSO) of 17 days, the change (in €) in the average daily accounts receivable (AR) balance from 20X7 to 20X8 is closest to:", "opts": ["−1,534,527", "−479,452", "1,918,159"], "ans": "B", "expl": "Days sales outstanding and accounts receivable turnover are activity ratios used to measure operational efficiency. The relationship between\ndays sales outstanding (DSO) and accounts receivable (AR) turnover can serve as an important tool for forecasting what is needed to\nreach a company's working capital goals.\nA higher DSO indicates that customers are taking longer to pay, which results in lower liquidity. A lower DSO is preferable since it means the\ncompany is collecting receivables faster, thus improving liquidity. AR turnover indicates management's effectiveness in managing the credit given\nto customers. Higher AR turnover implies greater efficiency in converting receivables to cash.\nTo solve for the change in the average daily AR:\nThings to remember:\nThe relationship between days sales outstanding (DSO) and accounts receivable (AR) turnover can serve as an important tool for forecasting what\nis needed to reach a company's working capital goals. DSO is the ratio of the average AR to the credit sales per day, and AR turnover is the ratio\nof the credit sales for the period to the average AR.\nDescribe how ratio analysis and other techniques can be used to model and forecast earnings", "qhtml": null}, {"n": 33, "q": "An analyst obtains the following information for three companies: Which of the three companies is most likely to meet its daily cash expenditures? ", "opts": ["Company A", "Company B", "Company C"], "ans": "A", "expl": "Liquidity ratios measure a firm's ability to pay its short-term liabilities. A company's defensive interval ratio (DIR) measures the time (eg, days) it\nwould take for the company to exhaust its quick assets (eg, cash + short-term marketable investments + receivables) when paying for its\nongoing expenses. If its DIR is low, the company may not be able to pay its bills.\nSome may understand this ratio as a burn rate (ie, how long it will take the company to burn through its cash and quick assets). To find the\ncompany most likely to meet its daily cash expenditure, first use the quick ratio to find the quick assets; use the quick assets to determine the DIR.\nIn this scenario, since all three companies have the same daily cash expenditures of $50,000 and the same current liabilities of $1,500,000, the\ncompany with the highest quick ratio, Company A, will have the largest amount of quick assets and the largest DIR.\nCompany A is most likely to meet is daily cash expenditures, since it has the highest DIR of 36.\n(Choice B) This choice results from incorrectly using the cash ratio to determine the assets included in the DIR. Doing so excludes accounts\nreceivable, a quick asset, and understates the DIR.\n(Choice C) This choice results from incorrectly using the current ratio to determine assets included in the DIR. This includes inventory, which is\nharder to convert to cash than quick assets and results in an overstatement of the DIR.\nThings to remember:\nA company's defensive interval ratio measures the time it would take for the company to exhaust its quick assets (eg, cash + short-term\nmarketable investments + receivables) when paying for its ongoing expenses (ie, burn through its quick assets).\nCalculate and interpret activity, liquidity, solvency, and profitability ratios", "qhtml": null}, {"n": 34, "q": "An analyst calculates the following ratios for a company to assess performance over time: Ratio 20X4 20X5 20X6 Debt-to-equity 0.42 0.35 0.33 Debt-to-EBITDA 4.12 3.18 3.04 Working-capital turnover 0.64 0.59 0.54 Fixed-asset turnover 0.25 0.18 0.16 Price-to-book 8.41 8.05 7.85 Price-to-earnings 12.52 11.12 10.79 Based on this information only, the analyst can most appropriately conclude that the company's: ", "opts": ["solvency position has improved.", "operation has increased efficiency.", "stock is more expensive relative to fundamentals."], "ans": "A", "expl": "Analysts can use integrated financial ratio analysis to gauge a company's performance over time in terms of its activity or efficiency, liquidity,\nsolvency, profitability, and valuation.\nActivity ratios measure how efficiently a company uses its assets.\nLiquidity ratios measure how well a company can cover its short-term obligations with cash or assets that are easily converted to cash.\nSolvency ratios measure a company's ability to satisfy its long-term obligations.\nProfitability ratios measure a company's return on sales and return on investments.\nValuation ratios measures a company's stock price relative to its fundamentals.\nIn this scenario, solvency, as measured by debt-to-equity (Debt / Equity) and debt-to-EBITDA (Debt / EBITDA), has been improving. The\ndownward trend in both ratios indicates that the company has lowered its outstanding debt relative to its equity and EBITDA.\n(Choice B) Efficiency (ie, activity), as measured by working-capital turnover (Sales / Net working capital) and fixed asset turnover (Sales / Fixed\nassets), has worsened. Both ratios are trending down over time, indicating that the
