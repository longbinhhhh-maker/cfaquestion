 rate tree value of the Hardin bonds from the interest rate tree value of the Bratton bonds. 1 am concerned that the 10% volatility assumption used to develop the interest rate tree might be too low. A higher volatility assumption would result in a lower Statement 2: value for the Hardin bonds.\"><p>After reviewing Diffle's analysis, Puldo notes that Diffle has not included any information on the option adjusted spread (OAS) for the Hardin bonds. Puldo suggests that Diffle should evaluate the OAS in order to get an idea of the liquidity risk of the Hardin bonds. Diffle counters that the OAS may not be very informative in this case, since he is uncertain as to the reliability of the interest rate volatility assumption.<\/p><p>To finish his analysis, Diffle would like to use his binomial model to evaluate the interest rate risk of both the Hardin bonds and the Bratton bonds. Diffle has shocked interest rates by 25 basis points throughout the interest rate tree he has been using to value the two bond issues. Using the new rates, Diffle has calculated values for the bonds assuming a 25-basis-point increase or decrease in rates. He plans to use these values as inputs into the following formulas for duration and convexity:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v025.webp\" style=\"max-width:min(100%,491px)\" alt=\"V--V+ V+ + V- - 2Vo convexity = duration = Vox(Ay)? 2x VoxAy\"><\/div><\/details><div class=\"pp-topic\">Module 25.5, LOS 25.j<\/div><div class=\"qtext\"><p>Puldo notes that the duration estimate for the two bonds is not directly comparable. Assuming that the underlying option is at- or near-the-money, the duration of one of the bonds will be lower than the other one.<\/p><p>Indicate whether the statements made by Diffle in his memo regarding the value of the embedded option and the effect of the volatility assumption are correct.<\/p><\/div>", "subj": "fixed"}, {"n": 67, "q": "A putable bond with a 6.4% annual coupon will mature in two years at par value. The current one-year spot rate is 7.6%. For the second year, the yield volatility model forecasts that the one-year rate will be either 6.8% or 7.6%. The bond is putable in one year at 99. Using a binomial interest rate tree, what is the current price?", "opts": ["98.885.", "98.190.", "98.246."], "ans": "C", "expl": "The tree will have three nodal periods: 0, 1, and 2. The goal is to find the value at node 0. We know the value at all nodes in nodal period 2: V₂=100. In nodal period 1, there will be two possible prices: Vi,U = [(100 + 6.4) / 1.076 + (100+6.4) / 1.076] / 2 = 98.885 Vi,L = [(100 + 6.4) / 1.068 + (100 + 6.4) / 1.068] / 2 = 99.625. Since 98.885 is less than the put price, Vi,U = 99 V₀ = [(99 + 6.4) / 1.076) + (99.625 + 6.4) / 1.076)] / 2 = 98.246.", "explhtml": "<p>The tree will have three nodal periods: 0, 1, and 2. The goal is to find the value at node 0. We know the value at all nodes in nodal period 2: V<sub>2<\/sub>=100. In nodal period 1, there will be two possible prices:<\/p><p>V<sub>i,U<\/sub> = [(100 + 6.4) / 1.076 + (100+6.4) / 1.076] / 2 = 98.885<\/p><p>V<sub>i,L<\/sub> = [(100 + 6.4) / 1.068 + (100 + 6.4) / 1.068] / 2 = 99.625.<\/p><p>Since 98.885 is less than the put price, V<sub>i,U<\/sub> = 99<\/p><p>V<sub>0<\/sub> = [(99 + 6.4) / 1.076) + (99.625 + 6.4) / 1.076)] / 2 = 98.246.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.2, LOS 25.f<\/div><div class=\"qtext\"><p>A putable bond with a 6.4% annual coupon will mature in two years at par value. The current one-year spot rate is 7.6%. For the second year, the yield volatility model forecasts that the one-year rate will be either 6.8% or 7.6%. The bond is putable in one year at 99. Using a binomial interest rate tree, what is the current price?<\/p><\/div>", "subj": "fixed"}, {"n": 68, "q": "Which of the following most accurately explains how the effective convexity is computed using the binomial model. In order to compute the effective convexity the:", "opts": ["binomial tree has to be shifted upward and downward by the same amount for all nodes.", "yield curve has to be shifted upward and downward in a parallel manner and the binomial tree recalculated each time.", "volatility has to be shifted upward and downward and the binomial tree recalculated each time."], "ans": "B", "expl": "Apply parallel shifts to the yield curve and use these curves to compute new forward rates in the interest rate tree. The resulting bond values are then used to compute the effective convexity.", "explhtml": "<p>Apply parallel shifts to the yield curve and use these curves to compute new forward rates in the interest rate tree. The resulting bond values are then used to compute the effective convexity.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.5, LOS 25.i<\/div><div class=\"qtext\"><p>Which of the following most accurately explains how the effective convexity is computed using the binomial model. In order to compute the effective convexity the:<\/p><\/div>", "subj": "fixed"}, {"n": 69, "q": "Joseph Dentice, CFA is evaluating three bonds. All three bonds have a coupon rate of 3%, maturity of five years and are generally identical in every respect except that bond A is an option-free bond, bond B is callable at any time at par and bond C is putable at any time at par. Yield curve is currently flat at 3%. The bond least likely to have the highest one-sided down-duration is:", "opts": ["Bond C.", "Bond B.", "Bond A."], "ans": "B", "expl": "When the underlying option is at (or near) money, callable bonds will have lower one-sided down-duration than one-sided up-duration; the price change of a callable when rates fall is smaller than the price change for an equal increase in rates. In this problem, the coupon rate is given to be equal to the current level of rates and hence the bond should be at par and the underlying option is at-the-money.", "explhtml": "<p>When the underlying option is at (or near) money, callable bonds will have lower one-sided down-duration than one-sided up-duration; the price change of a callable when rates fall is smaller than the price change for an equal increase in rates. In this problem, the coupon rate is given to be equal to the current level of rates and hence the bond should be at par and the underlying option is at-the-money.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.6, LOS 25.k<\/div><div class=\"qtext\"><p>Joseph Dentice, CFA is evaluating three bonds. All three bonds have a coupon rate of 3%, maturity of five years and are generally identical in every respect except that bond A is an option-free bond, bond B is callable at any time at par and bond C is putable at any time at par. Yield curve is currently flat at 3%.<\/p><p>The bond least likely to have the highest one-sided down-duration is:<\/p><\/div>", "subj": "fixed"}, {"n": 70, "q": "A callable bond and an option-free bond have the same coupon, maturity and rating. The callable bond currently trades at par value. Which of the following lists correctly orders the values of the indicated items from lowest to highest?", "opts": ["$0, embedded call, callable bond, option-free bond.", "Embedded call, callable bond, $0, option-free bond.", "Embedded call, $0, callable bond, option-free bond."], "ans": "A", "expl": "The embedded call will always have a positive value prior to expiration, and this is especially true if the callable bond trades at par value. Since investors must be compensated for the call feature, the value of the option-free bond must exceed that of a callable bond with the same coupon and maturity and rating.", "explhtml": "<p>The embedded call will always have a positive value prior to expiration, and this is especially true if the callable bond trades at par value. Since investors must be compensated for the call feature, the value of the option-free bond must exceed that of a callable bond with the same coupon and maturity and rating.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.2, LOS 25.c<\/div><div class=\"qtext\"><p>A callable bond and an option-free bond have the same coupon, maturity and rating. The callable bond currently trades at par value. Which of the following lists correctly orders the values of the indicated items from lowest to highest?<\/p><\/div>", "subj": "fixed"}, {"n": 71, "q": "Using the following interest rate tree, what is the value of a callable bond that has two years remaining to maturity, a call price of 99, and a 2.50% coupon rate? Assume that the call option can be exercised at t=1 year from now.  3.80% 3.18%   2.61%", "opts": ["98.25.", "98.65.", "99.21."], "ans": "A", "expl": "The callable bond price tree is as follows:   100.00  98.75  98.26  100.00  99.00    100.00 The formula for the price at each node is: Price = min{(prob × (Pᵤₚ + coupon) + prob × (Pdown + coupon)) / (1 + rate), call price}. Up Node at t = 0.5: min{(0.5 × (100 + 2.5) + 0.5 × (100 + 2.5)) / (1 + 0.038), 99} = 98.75. Down Node at t = 0.5: min{(0.5 × (100 + 2.5) + 0.5 × (100 + 2.5)) / (1 + 0.026), 99} = 99.00. Node at t = 0.0: min{(0.5 × (98.75 + 2.5) + 0.5 × (99 + 2.5)) / (1 + 0.0318), 99} = 98.25.", "explhtml": "<p>The callable bond price tree is as follows:<\/p><div class=\"tbl\"><table><tr><td><\/td><td><\/td><td>100.00<\/td><\/tr><tr><td><\/td><td>98.75<\/td><td><\/td><\/tr><tr><td>98.26<\/td><td><\/td><td>100.00<\/td><\/tr><tr><td><\/td><td>99.00<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td>100.00<\/td><\/tr><\/table><\/div><p>The formula for the price at each node is: Price = min{(prob × (P<sub>up<\/sub> + coupon) + prob × (P<sub>down<\/sub> + coupon)) / (1 + rate), call price}.<\/p><p>Up Node at t = 0.5: min{(0.5 × (100 + 2.5) + 0.5 × (100 + 2.5)) / (1 + 0.038), 99} = 98.75. Down Node at t = 0.5: min{(0.5 × (100 + 2.5) + 0.5 × (100 + 2.5)) / (1 + 0.026), 99} = 99.00. Node at t = 0.0: min{(0.5 × (98.75 + 2.5) + 0.5 × (99 + 2.5)) / (1 + 0.0318), 99} = 98.25.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.2, LOS 25.f<\/div><div class=\"qtext\"><p>Using the following interest rate tree, what is the value of a callable bond that has two years remaining to maturity, a call price of 99, and a 2.50% coupon rate? Assume that the call option can be exercised at t=1 year from now.<\/p><div class=\"tbl\"><table><tr><td><\/td><td>3.80%<\/td><\/tr><tr><td>3.18%<\/td><td><\/td><\/tr><tr><td><\/td><td>2.61%<\/td><\/tr><\/table><\/div><\/div>", "subj": "fixed"}, {"n": 72, "q": "Which of the following represent the correct values that should be within the tree in the places marked by A and B?", "opts": ["A = 99.041 B = 100.000", "A = 99.041 B = 100.315", "A = 100.000 B = 100.000"], "ans": "A", "expl": "A is 99.041 since the call price is higher at 100 and the issuer will choose the cheapest route. The missing value F = 106.5 ÷ 1.06166 = 100.315 and hence B is 100 since it is cheaper for the issuer to call.", "explhtml": "<p>A is 99.041 since the call price is higher at 100 and the issuer will choose the cheapest route. The missing value F = 106.5 ÷ 1.06166 = 100.315 and hence B is 100 since it is cheaper for the issuer to call.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 72–75<\/summary><div class=\"vig-body\"><p>Company Isla has a four-year, 6.5% bond that is callable under the following schedule:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v026.webp\" style=\"max-width:min(100%,184px)\" alt=\"• 102 in one year&#x27;s time • 101 in two years&#x27; time • 100 in three years&#x27; time\"><p>The binomial interest rate assuming a 10% rate volatility is shown in Exhibit 1.<\/p><p>At each of the nodes:<\/p><p>F the value of the bond obtained by applying the backward induction process (i.e., the expected<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v027.webp\" style=\"max-width:min(100%,649px)\" alt=\"PV of future cash flows from the bond)\"><p>Cthe coupon received at the time of the node = V For the call price depending on whether or not the company is likely to call the bond Exhibit 1: Binomial Interest Rate Tree<\/p><\/div><\/details><div class=\"pp-topic\">Module 25.6, LOS 25.l<\/div><div class=\"qtext\"><p>Which of the following represent the correct values that should be within the tree in the places marked by A and B?<\/p><\/div>", "subj": "fixed"}, {"n": 73, "q": "Which of the following represent the correct value that should be within the tree in the place marked by D?", "opts": ["102.000.", "101.723.", "101.000."], "ans": "C", "expl": "Lower of F (101.723) and the call price in two years' time of 101.", "explhtml": "<p>Lower of F (101.723) and the call price in two years&#x27; time of 101.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 72–75<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Company Isla has a four-year, 6.5% bond that is callable under the following schedule:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v026.webp\" style=\"max-width:min(100%,184px)\" alt=\"• 102 in one year&#x27;s time • 101 in two years&#x27; time • 100 in three years&#x27; time\"><p>The binomial interest rate assuming a 10% rate volatility is shown in Exhibit 1.<\/p><p>At each of the nodes:<\/p><p>F the value of the bond obtained by applying the backward induction process (i.e., the expected<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v027.webp\" style=\"max-width:min(100%,649px)\" alt=\"PV of future cash flows from the bond)\"><p>Cthe coupon received at the time of the node = V For the call price depending on whether or not the company is likely to call the bond Exhibit 1: Binomial Interest Rate Tree<\/p><\/div><\/details><div class=\"pp-topic\">Module 25.2, LOS 25.f<\/div><div class=\"qtext\"><p>Which of the following represent the correct value that should be within the tree in the place marked by D?<\/p><\/div>", "subj": "fixed"}, {"n": 74, "q": "Which of the following is most accurate regarding the use of a binomial tree to calculate the option adjusted spread (OAS) of bonds with embedded options?", "opts": ["The binomial tree can be used to calculate the OAS of a callable corporate bond but not a mortgage backed security (MBS), as the MBS does not contain an option.", "The spot rate curve cannot be used to calculate the OAS of a callable corporate bond but can be used for a mortgage backed security (MBS).", "The binomial tree can be used to calculate the OAS of a callable corporate bond but not a mortgage backed security (MBS), as the MBS value is path dependent."], "ans": "C", "expl": "OAS on callable or putable bonds can be calculated using binomial interest rate trees. MBS has a prepayment risk, and hence has an embedded call option. Binomial interest rate tree cannot be used to value MBS as the prepayment risk (call risk) in MBS is path dependent. Spot rate curve comprises a single rate for each time period and hence cannot be used to value securities with embedded options. If spot rate curve is used, implicitly you would be assuming zero volatility in rates, and therefore end up valuing the time value component of the option value as zero.", "explhtml": "<p>OAS on callable or putable bonds can be calculated using binomial interest rate trees. MBS has a prepayment risk, and hence has an embedded call option. Binomial interest rate tree cannot be used to value MBS as the prepayment risk (call risk) in MBS is path dependent. Spot rate curve comprises a single rate for each time period and hence cannot be used to value securities with embedded options. If spot rate curve is used, implicitly you would be assuming zero volatility in rates, and therefore end up valuing the time value component of the option value as zero.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 72–75<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Company Isla has a four-year, 6.5% bond that is callable under the following schedule:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v026.webp\" style=\"max-width:min(100%,184px)\" alt=\"• 102 in one year&#x27;s time • 101 in two years&#x27; time • 100 in three years&#x27; time\"><p>The binomial interest rate assuming a 10% rate volatility is shown in Exhibit 1.<\/p><p>At each of the nodes:<\/p><p>F the value of the bond obtained by applying the backward induction process (i.e., the expected<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v027.webp\" style=\"max-width:min(100%,649px)\" alt=\"PV of future cash flows from the bond)\"><p>Cthe coupon received at the time of the node = V For the call price depending on whether or not the company is likely to call the bond Exhibit 1: Binomial Interest Rate Tree<\/p><\/div><\/details><div class=\"pp-topic\">Module 25.4, LOS 25.h<\/div><div class=\"qtext\"><p>Which of the following is most accurate regarding the use of a binomial tree to calculate the option adjusted spread (OAS) of bonds with embedded options?<\/p><\/div>", "subj": "fixed"}, {"n": 75, "q": "Which of the following represent the correct value that should be within the tree in the place marked by G?", "opts": ["96.352.", "102.000.", "102.576."], "ans": "C", "expl": "Make sure to use the lower of the call price or calculated value for lower node in year 2 (i.e., $101). G = {(101 + 100.27) / 2 + 6.50} / (1.044448) = 102.57", "explhtml": "<p>Make sure to use the lower of the call price or calculated value for lower node in year 2 (i.e., $101). G = {(101 + 100.27) / 2 + 6.50} / (1.044448) = 102.57<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 72–75<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Company Isla has a four-year, 6.5% bond that is callable under the following schedule:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v026.webp\" style=\"max-width:min(100%,184px)\" alt=\"• 102 in one year&#x27;s time • 101 in two years&#x27; time • 100 in three years&#x27; time\"><p>The binomial interest rate assuming a 10% rate volatility is shown in Exhibit 1.<\/p><p>At each of the nodes:<\/p><p>F the value of the bond obtained by applying the backward induction process (i.e., the expected<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v027.webp\" style=\"max-width:min(100%,649px)\" alt=\"PV of future cash flows from the bond)\"><p>Cthe coupon received at the time of the node = V For the call price depending on whether or not the company is likely to call the bond Exhibit 1: Binomial Interest Rate Tree<\/p><\/div><\/details><div class=\"pp-topic\">Module 25.6, LOS 25.k<\/div><div class=\"qtext\"><p>Which of the following represent the correct value that should be within the tree in the place marked by G?<\/p><\/div>", "subj": "fixed"}, {"n": 76, "q": "The primary benefit of owning a convertible bond over owning the common stock of a corporation is the:", "opts": ["bond has more upside potential.", "bond has lower downside risk.", "conversion premium."], "ans": "B", "expl": "The straight value of the bond forms a floor for the convertible bond's price. This lowers the downside risk. The conversion premium is a disadvantage of owning the convertible bond, and it is the reason the bond has lower upside potential when compared to the stock.", "explhtml": "<p>The straight value of the bond forms a floor for the convertible bond&#x27;s price. This lowers the downside risk. The conversion premium is a disadvantage of owning the convertible bond, and it is the reason the bond has lower upside potential when compared to the stock.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.8, LOS 25.q<\/div><div class=\"qtext\"><p>The primary benefit of owning a convertible bond over owning the common stock of a corporation is the:<\/p><\/div>", "subj": "fixed"}, {"n": 77, "q": "What is the market conversion price of a convertible security?", "opts": ["The value of the security if it is converted immediately.", "The price that an investor pays for the common stock in the market.", "The price that an investor pays for the common stock if the convertible bond is purchased and then converted into the stock."], "ans": "C", "expl": "The market conversion price, or conversion parity price, is the price that the convertible bondholder would effectively pay for the stock if she bought the bond and immediately converted it. market conversion price = market price of convertible bond ÷ conversion ratio.", "explhtml": "<p>The market conversion price, or conversion parity price, is the price that the convertible bondholder would effectively pay for the stock if she bought the bond and immediately converted it.<\/p><p>market conversion price = market price of convertible bond ÷ conversion ratio.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.8, LOS 25.o<\/div><div class=\"qtext\"><p>What is the market conversion price of a convertible security?<\/p><\/div>", "subj": "fixed"}, {"n": 78, "q": "Which of the following is equal to the value of the putable bond? The putable bond value is equal to the:", "opts": ["option-free bond value minus the value of the put option.", "option-free bond value plus the value of the put option.", "callable bond plus the value of the put option."], "ans": "B", "expl": "The value of a putable bond can be expressed as Vputable = Vnonputable + Vₚᵤₜ.", "explhtml": "<p>The value of a putable bond can be expressed as V<sub>putable<\/sub> = V<sub>nonputable<\/sub> + V<sub>put<\/sub>.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.1, LOS 25.b<\/div><div class=\"qtext\"><p>Which of the following is equal to the value of the putable bond? The putable bond value is equal to the:<\/p><\/div>", "subj": "fixed"}, {"n": 79, "q": "Generally speaking, an analyst would like the option adjusted spread (OAS) to be large, controlling for:", "opts": ["Credit and liquidity risk.", "Option risk.", "Credit, liquidity and option risk."], "ans": "A", "expl": "OAS is \"Option-adjusted\" and hence includes no compensation for option risk: OAS is compensation for taking credit and liquidity risk. (Nominal spread, by comparison, includes compensation for liquidity risk, credit risk, and option risk.) Analysts prefer higher OAS, after controlling for credit and liquidity risk.", "explhtml": "<p>OAS is &quot;Option-adjusted&quot; and hence includes no compensation for option risk: OAS is compensation for taking credit and liquidity risk. (Nominal spread, by comparison, includes compensation for liquidity risk, credit risk, and option risk.) Analysts prefer higher OAS, after controlling for credit and liquidity risk.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.4, LOS 25.g<\/div><div class=\"qtext\"><p>Generally speaking, an analyst would like the option adjusted spread (OAS) to be large, controlling for:<\/p><\/div>", "subj": "fixed"}, {"n": 80, "q": "Joseph Dentice, CFA is evaluating three bonds. All three bonds have a coupon rate of 3%, maturity of five years and are generally identical in every respect except that bond A is an option-free bond, bond B is callable in two years and bond C is putable in two years. The bond with the lowest duration is least likely to be:", "opts": ["Bond C.", "Bond B.", "Bond A."], "ans": "C", "expl": "Bond A is option-free and would have a duration that is equal to or greater than the duration of bonds B and C.", "explhtml": "<p>Bond A is option-free and would have a duration that is equal to or greater than the duration of bonds B and C.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.5, LOS 25.j<\/div><div class=\"qtext\"><p>Joseph Dentice, CFA is evaluating three bonds. All three bonds have a coupon rate of 3%, maturity of five years and are generally identical in every respect except that bond A is an option-free bond, bond B is callable in two years and bond C is putable in two years.<\/p><p>The bond with the lowest duration is least likely to be:<\/p><\/div>", "subj": "fixed"}, {"n": 81, "q": "Sharon Rogner, CFA is evaluating three bonds for inclusion in fixed income portfolio for one of her pension fund clients. All three bonds have a coupon rate of 3%, maturity of five years and are generally identical in every respect except that bond A is an option-free bond, bond B is callable in two years and bond C is putable in two years. Rogner computes the OAS of bond A to be 50bps using a binomial tree with an assumed interest rate volatility of 15%. If Rogner revises her estimate of interest rate volatility to 10%, the computed OAS of Bond B would most likely be:", "opts": ["lower than 50bps.", "higher than 50bps.", "equal to 50bps."], "ans": "B", "expl": "The OAS of the three bonds should be same as they are given to be identical bonds except for the embedded options (OAS is after removing the option feature and hence would not be affected by embedded options). Hence the OAS of bond B would be 50 bps absent any changes in assumed level of volatility. When the assumed level of volatility in the tree is decreased, the value of the call option would decrease and the computed value of the callable bond would increase. The constant spread now needed to force the computed value to be equal to the market price is therefore higher than before. Hence a decrease in the volatility estimate increases the computed OAS for a callable bond.", "explhtml": "<p>The OAS of the three bonds should be same as they are given to be identical bonds except for the embedded options (OAS is after removing the option feature and hence would not be affected by embedded options). Hence the OAS of bond B would be 50 bps absent any changes in assumed level of volatility. When the assumed level of volatility in the tree is decreased, the value of the call option would decrease and the computed value of the callable bond would increase. The constant spread now needed to force the computed value to be equal to the market price is therefore higher than before. Hence a decrease in the volatility estimate increases the computed OAS for a callable bond.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.4, LOS 25.h<\/div><div class=\"qtext\"><p>Sharon Rogner, CFA is evaluating three bonds for inclusion in fixed income portfolio for one of her pension fund clients. All three bonds have a coupon rate of 3%, maturity of five years and are generally identical in every respect except that bond A is an option-free bond, bond B is callable in two years and bond C is putable in two years. Rogner computes the OAS of bond A to be 50bps using a binomial tree with an assumed interest rate volatility of 15%.<\/p><p>If Rogner revises her estimate of interest rate volatility to 10%, the computed OAS of Bond B would most likely be:<\/p><\/div>", "subj": "fixed"}, {"n": 82, "q": "Mary Pierce, CFA, has just joined The James Group as a fixed income security analyst. Pierce has taken over for Katy Williams, who left The James Group to start her own investment firm. Pierce has been reviewing Williams's files, which include data on a number of securities that Williams had been reviewing. The first file had information on several different asset-backed securities. A summary schedule that Williams had prepared is shown in Exhibit 1. Exhibit 1: Summary Schedule Security Rating Nominal Spread (bp) GG Auto Loans AA 124 KK Auto Loans AA 118 CC Credit Card Receivables AA 136 HH Home Equity Loans AA 168 LL Home Equity Loans AA 174 The second file included the following schedule of information relating to a specific CMO that Williams had been considering. Exhibit 2 reflects the results of a Monte Carlo simulation based on 15% volatility of interest rates. This security is still available, and Pierce needs to evaluate the investment merit of any or all of the listed tranches. Exhibit 2: Monte Carlo Simulation Based on 15% Interest Rate Volatility Tranche Par Amount ($\nmillion) OAS (bp) Z-Spread (bp) Effective\nDuration (years) PAC A 75.0 40 40 1.5 PAC B 40.0 43 95 4.2 PAC C 25.0 65 117 5.0 PAC D 50.0 72 140 7.9 Support S 100.0 51 142 11.8 A third file contained notes Williams had taken at a seminar a couple of months ago on valuing various types of asset-backed and mortgage-backed securities. These notes included the following comments that Pierce found interesting: \"Cash flow yield (CFY) is one method of valuing mortgage-backed securities. An advantage of the CFY is that it does not rely on any specific prepayment assumptions. An important weakness of CFY is the assumption that interim cash flows will be reinvested at the CFY. This is rarely true for mortgage-backed securities.\" \"Cash flow duration is similar to effective duration, but its weakness is that it fails to fully account for changes in prepayment rates as cash flow yields change. Empirical duration suffers two disadvantages as a measure of interest rate exposure: reliance on theoretical formulas and reliance on historical pricing data that may not exist for many mortgage-backed securities.\" \"The recent increase in the default rate for subprime adjustable rate mortgages can be traced to the structure of these loans. The negative amortization feature of these loans basically gave the borrower an at-the-money call option on their property. Once the property decreased in value, this call option was worthless, and the borrower had no incentive to make any additional payments.\" The OAS in Exhibit 2 most likely reflect:", "opts": ["average spreads over the Treasury spot rate curve.", "average spreads over the Treasury yield curve.", "simple spreads over the Treasury yield curve."], "ans": "A", "expl": "OAS is interpreted as the average spread over the Treasury spot rate curve. The nominal spread is measured relative to the Treasury yield curve.", "explhtml": "<p>OAS is interpreted as the average spread over the Treasury spot rate curve. The nominal spread is measured relative to the Treasury yield curve.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.4, LOS 25.g<\/div><div class=\"qtext\"><p>Mary Pierce, CFA, has just joined The James Group as a fixed income security analyst. Pierce has taken over for Katy Williams, who left The James Group to start her own investment firm. Pierce has been reviewing Williams&#x27;s files, which include data on a number of securities that Williams had been reviewing.<\/p><p>The first file had information on several different asset-backed securities. A summary schedule that Williams had prepared is shown in Exhibit 1.<\/p><p>Exhibit 1: Summary Schedule<\/p><div class=\"tbl\"><table><tr><td>Security<\/td><td>Rating<\/td><td>Nominal Spread (bp)<\/td><\/tr><tr><td>GG Auto Loans<\/td><td>AA<\/td><td>124<\/td><\/tr><tr><td>KK Auto Loans<\/td><td>AA<\/td><td>118<\/td><\/tr><tr><td>CC Credit Card Receivables<\/td><td>AA<\/td><td>136<\/td><\/tr><tr><td>HH Home Equity Loans<\/td><td>AA<\/td><td>168<\/td><\/tr><tr><td>LL Home Equity Loans<\/td><td>AA<\/td><td>174<\/td><\/tr><\/table><\/div><p>The second file included the following schedule of information relating to a specific CMO that Williams had been considering. Exhibit 2 reflects the results of a Monte Carlo simulation based on 15% volatility of interest rates. This security is still available, and Pierce needs to evaluate the investment merit of any or all of the listed tranches.<\/p><p>Exhibit 2: Monte Carlo Simulation Based on 15% Interest Rate Volatility<\/p><div class=\"tbl\"><table><tr><td>Tranche<\/td><td>Par Amount ($<br>million)<\/td><td>OAS (bp)<\/td><td>Z-Spread (bp)<\/td><td>Effective<br>Duration (years)<\/td><\/tr><tr><td>PAC A<\/td><td>75.0<\/td><td>40<\/td><td>40<\/td><td>1.5<\/td><\/tr><tr><td>PAC B<\/td><td>40.0<\/td><td>43<\/td><td>95<\/td><td>4.2<\/td><\/tr><tr><td>PAC C<\/td><td>25.0<\/td><td>65<\/td><td>117<\/td><td>5.0<\/td><\/tr><tr><td>PAC D<\/td><td>50.0<\/td><td>72<\/td><td>140<\/td><td>7.9<\/td><\/tr><tr><td>Support S<\/td><td>100.0<\/td><td>51<\/td><td>142<\/td><td>11.8<\/td><\/tr><\/table><\/div><p>A third file contained notes Williams had taken at a seminar a couple of months ago on valuing various types of asset-backed and mortgage-backed securities. These notes included the following comments that Pierce found interesting:<\/p><p>&quot;Cash flow yield (CFY) is one method of valuing mortgage-backed securities. An advantage of the CFY is that it does not rely on any specific prepayment assumptions. An important weakness of CFY is the assumption that interim cash flows will be reinvested at the CFY. This is rarely true for mortgage-backed securities.&quot;<\/p><p>&quot;Cash flow duration is similar to effective duration, but its weakness is that it fails to fully account for changes in prepayment rates as cash flow yields change. Empirical duration suffers two disadvantages as a measure of interest rate exposure: reliance on theoretical formulas and reliance on historical pricing data that may not exist for many mortgage-backed securities.&quot;<\/p><p>&quot;The recent increase in the default rate for subprime adjustable rate mortgages can be traced to the structure of these loans. The negative amortization feature of these loans basically gave the borrower an at-the-money call option on their property. Once the property decreased in value, this call option was worthless, and the borrower had no incentive to make any additional payments.&quot;<\/p><p>The OAS in Exhibit 2 most likely reflect:<\/p><\/div>", "subj": "fixed"}, {"n": 83, "q": "An analyst has constructed an interest rate tree for an on-the-run Treasury security. The analyst now wishes to use the tree to calculate the convexity of a callable corporate bond with maturity and coupon equal to that of the Treasury security. The usual way to do this is to calculate the option-adjusted spread (OAS):", "opts": ["compute the convexity of the Treasury security, and divide by (1+OAS).", "shift the Treasury yield curve, compute the new forward rates, add the OAS to those forward rates, enter the adjusted values into the interest rate tree, and then use the usual convexity formula.", "compute the convexity of the Treasury security, and add the OAS."], "ans": "B", "expl": "The analyst uses the usual convexity formula, where the upper and lower values of the bonds are determined using the tree.", "explhtml": "<p>The analyst uses the usual convexity formula, where the upper and lower values of the bonds are determined using the tree.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.5, LOS 25.i<\/div><div class=\"qtext\"><p>An analyst has constructed an interest rate tree for an on-the-run Treasury security. The analyst now wishes to use the tree to calculate the convexity of a callable corporate bond with maturity and coupon equal to that of the Treasury security. The usual way to do this is to calculate the option-adjusted spread (OAS):<\/p><\/div>", "subj": "fixed"}, {"n": 84, "q": "Using the binomial tree model, what is the value of the callable bond?", "opts": ["$102.196.", "$95.521.", "$101.735."], "ans": "C", "expl": "The value of this bond at node 0 is V₀ = ½ × [($99.391 + $7) ÷ 1.048755 + ($100.000 + $7) ÷ 1.048755] = $101.735, so the price of the callable bond is $101.735.", "explhtml": "<p>The value of this bond at node 0 is V<sub>0<\/sub> = ½ × [($99.391 + $7) ÷ 1.048755 + ($100.000 + $7) ÷ 1.048755] = $101.735, so the price of the callable bond is $101.735.<\/p><img class=\"pimg\" src=\"l2img/kq/r25-f1387b7959.png\" style=\"max-width:min(100%,418px)\" loading=\"lazy\" alt=\"\">", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 84–87<\/summary><div class=\"vig-body\"><p>Eric Rome works in the back office at Finance Solutions, a limited liability firm that specializes in designing basic and sophisticated financial securities. Most of their clients are commercial and investment banks, and the detection, and control of interest rate risk is Financial Solution's competitive advantage. One of their clients is looking to design a fairly straightforward security: a callable bond. The bond pays interest annually over a two-year life, has a 7% coupon payment, and has a par value of $100. The bond is callable in one year at par ($100).<\/p><p>Rome uses a binomial tree approach to value the callable bond. He's already determined, using a similar approach, that the value of the option-free counterpart is $102.196. This price came from discounting cash flows at on-the-run rates for the issuer. Those discount rates are given below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v028.webp\" style=\"max-width:min(100%,230px)\" alt=\"* і1.u = 7.6559%\"><p>ip = 4.8755%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v029.webp\" style=\"max-width:min(100%,230px)\" alt=\"і1.L = 5.9755%\"><p>Rome is also interested in the 2027 6% convertible bond of Stellar Inc. The bond can be converted into 25 shares of common stock and is trading at $1024. Stellar's current stock price is $32. Comparable nonconvertible bonds currently yield 6%.<\/p><\/div><\/details><div class=\"pp-topic\">Module 25.2, LOS 25.f<\/div><div class=\"qtext\"><p>Using the binomial tree model, what is the value of the callable bond?<\/p><\/div>", "subj": "fixed"}, {"n": 85, "q": "What is the value of the call option embedded in this bond?", "opts": ["$0.461.", "$12.924.", "$6.675."], "ans": "A", "expl": "Given in the problem is the value of the bond's option-free counterpart: $102.196. From Part A we've determined the price of the callable bond to be $101.735. From the relationship: Vcall = Voption-free – Vcallable  We can determine that the value of the call option is $102.196 – $101.735 = $0.461.", "explhtml": "<p>Given in the problem is the value of the bond&#x27;s option-free counterpart: $102.196. From Part A we&#x27;ve determined the price of the callable bond to be $101.735. From the relationship: Vcall = Voption-free – Vcallable <\/p><p>We can determine that the value of the call option is $102.196 – $101.735 = $0.461.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 84–87<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Eric Rome works in the back office at Finance Solutions, a limited liability firm that specializes in designing basic and sophisticated financial securities. Most of their clients are commercial and investment banks, and the detection, and control of interest rate risk is Financial Solution's competitive advantage. One of their clients is looking to design a fairly straightforward security: a callable bond. The bond pays interest annually over a two-year life, has a 7% coupon payment, and has a par value of $100. The bond is callable in one year at par ($100).<\/p><p>Rome uses a binomial tree approach to value the callable bond. He's already determined, using a similar approach, that the value of the option-free counterpart is $102.196. This price came from discounting cash flows at on-the-run rates for the issuer. Those discount rates are given below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v028.webp\" style=\"max-width:min(100%,230px)\" alt=\"* і1.u = 7.6559%\"><p>ip = 4.8755%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v029.webp\" style=\"max-width:min(100%,230px)\" alt=\"і1.L = 5.9755%\"><p>Rome is also interested in the 2027 6% convertible bond of Stellar Inc. The bond can be converted into 25 shares of common stock and is trading at $1024. Stellar's current stock price is $32. Comparable nonconvertible bonds currently yield 6%.<\/p><\/div><\/details><div class=\"pp-topic\">Module 25.2, LOS 25.f<\/div><div class=\"qtext\"><p>What is the value of the call option embedded in this bond?<\/p><\/div>", "subj": "fixed"}, {"n": 86, "q": "If the bond is putable in one year at par, the value of the put is closest to:", "opts": ["$0.461.", "$12.487.", "$0.291."], "ans": "C", "expl": "The value of the bond's option-free counterpart is $102.196 (given). We can calculate the price of the putable bond to be $102.487. From the relationship: Vput = Vputable – Voption-free We can determine that the value of the put option is $102.487 – $102.196 = $0.291.", "explhtml": "<p>The value of the bond&#x27;s option-free counterpart is $102.196 (given). We can calculate the price of the putable bond to be $102.487. From the relationship: Vput = Vputable – Voption-free<\/p><p>We can determine that the value of the put option is $102.487 – $102.196 = $0.291.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 84–87<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Eric Rome works in the back office at Finance Solutions, a limited liability firm that specializes in designing basic and sophisticated financial securities. Most of their clients are commercial and investment banks, and the detection, and control of interest rate risk is Financial Solution's competitive advantage. One of their clients is looking to design a fairly straightforward security: a callable bond. The bond pays interest annually over a two-year life, has a 7% coupon payment, and has a par value of $100. The bond is callable in one year at par ($100).<\/p><p>Rome uses a binomial tree approach to value the callable bond. He's already determined, using a similar approach, that the value of the option-free counterpart is $102.196. This price came from discounting cash flows at on-the-run rates for the issuer. Those discount rates are given below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v028.webp\" style=\"max-width:min(100%,230px)\" alt=\"* і1.u = 7.6559%\"><p>ip = 4.8755%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v029.webp\" style=\"max-width:min(100%,230px)\" alt=\"і1.L = 5.9755%\"><p>Rome is also interested in the 2027 6% convertible bond of Stellar Inc. The bond can be converted into 25 shares of common stock and is trading at $1024. Stellar's current stock price is $32. Comparable nonconvertible bonds currently yield 6%.<\/p><\/div><\/details><div class=\"pp-topic\">Module 25.2, LOS 25.f<\/div><div class=\"qtext\"><p>If the bond is putable in one year at par, the value of the put is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 87, "q": "The market conversion premium ratio for Stellar's convertible bond is closest to:", "opts": ["28%.", "2.40%", "20.6%."], "ans": "A", "expl": "An investor who purchases the convertible bond rather than the underlying stock will pay a premium over the current market price of the stock. This market conversion premium per share is equal to the difference between the market conversion price and the current market price of the stock. Market conversion price = market price of CB ÷ conversion ratio = 1024 / 25 = 40.96 Market conversion premium = conversion price − market price = 40.96 − 32 = 8.96 market conversion premium per share  8.96 | Market conversion premium ratio =    =    = 28% 32 market price of common stock", "explhtml": "<p>An investor who purchases the convertible bond rather than the underlying stock will pay a premium over the current market price of the stock. This market conversion premium per share is equal to the difference between the market conversion price and the current market price of the stock. Market conversion price = market price of CB ÷ conversion ratio = 1024 / 25 = 40.96 Market conversion premium = conversion price − market price = 40.96 − 32 = 8.96<\/p><div class=\"tbl\"><table><tr><td>market conversion premium per share<\/td><td>8.96<\/td><\/tr><tr><td>Market conversion premium ratio = <\/td><td> = <\/td><td> = 28%<\/td><\/tr><\/table><\/div><p>32<\/p><p>market price of common stock<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 84–87<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Eric Rome works in the back office at Finance Solutions, a limited liability firm that specializes in designing basic and sophisticated financial securities. Most of their clients are commercial and investment banks, and the detection, and control of interest rate risk is Financial Solution's competitive advantage. One of their clients is looking to design a fairly straightforward security: a callable bond. The bond pays interest annually over a two-year life, has a 7% coupon payment, and has a par value of $100. The bond is callable in one year at par ($100).<\/p><p>Rome uses a binomial tree approach to value the callable bond. He's already determined, using a similar approach, that the value of the option-free counterpart is $102.196. This price came from discounting cash flows at on-the-run rates for the issuer. Those discount rates are given below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v028.webp\" style=\"max-width:min(100%,230px)\" alt=\"* і1.u = 7.6559%\"><p>ip = 4.8755%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v029.webp\" style=\"max-width:min(100%,230px)\" alt=\"і1.L = 5.9755%\"><p>Rome is also interested in the 2027 6% convertible bond of Stellar Inc. The bond can be converted into 25 shares of common stock and is trading at $1024. Stellar's current stock price is $32. Comparable nonconvertible bonds currently yield 6%.<\/p><\/div><\/details><div class=\"pp-topic\">Module 25.2, LOS 25.f<\/div><div class=\"qtext\"><p>The market conversion premium ratio for Stellar&#x27;s convertible bond is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 88, "q": "Using the following tree of semiannual interest rates what is the value of a 5% callable bond that has one year remaining to maturity, a call price of 99 and pays coupons semiannually?  7.76% 6.20%   5.45%", "opts": ["98.29.", "97.17.", "99.01."], "ans": "A", "expl": "The callable bond price tree is as follows:   100.00  A → 98.67  98.29  100.00  99.00    100.00 As an example, the price at node A is obtained as follows: PriceA = min[(prob × (Pᵤₚ + (coupon / 2)) + prob × (Pdown + (coupon/2)) / (1 + (rate / 2)), call price] = min[(0.5 × (100 + 2.5) + 0.5 × (100 + 2.5)) / (1 + (0.0776 / 2)), 99} = 98.67. The bond values at the other nodes are obtained in the same way.", "explhtml": "<p>The callable bond price tree is as follows:<\/p><div class=\"tbl\"><table><tr><td><\/td><td><\/td><td>100.00<\/td><\/tr><tr><td><\/td><td colspan=2>A → 98.67<\/td><\/tr><tr><td>98.29<\/td><td><\/td><td>100.00<\/td><\/tr><tr><td><\/td><td colspan=2>99.00<\/td><\/tr><tr><td><\/td><td><\/td><td>100.00<\/td><\/tr><\/table><\/div><p>As an example, the price at node A is obtained as follows: Price<sub>A<\/sub> = min[(prob × (P<sub>up <\/sub>+ (coupon / 2)) + prob × (P<sub>down <\/sub>+ (coupon/2)) / (1 + (rate / 2)), call price] = min[(0.5 × (100 + 2.5) + 0.5 × (100 + 2.5)) / (1 + (0.0776 / 2)), 99} = 98.67. The bond values at the other nodes are obtained in the same way.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.2, LOS 25.f<\/div><div class=\"qtext\"><p>Using the following tree of semiannual interest rates what is the value of a 5% callable bond that has one year remaining to maturity, a call price of 99 and pays coupons semiannually?<\/p><div class=\"tbl\"><table><tr><td><\/td><td>7.76%<\/td><\/tr><tr><td>6.20%<\/td><td><\/td><\/tr><tr><td><\/td><td>5.45%<\/td><\/tr><\/table><\/div><\/div>", "subj": "fixed"}, {"n": 89, "q": "For an option-free bond trading at par, it is least likely that:", "opts": ["The spot rate for the maturity of the bond is least important rate affecting the value of the bond.", "The rate durations for all the rates other than the maturity-matched rate are zero.", "Its maturity key rate duration is the same as its effective duration."], "ans": "A", "expl": "If an option-free bond is trading at par, the bond's maturity-matched rate (or the spot rate applicable to its maturity) is the only rate that affects the bond's value. Its maturity key rate duration is the same as its effective duration, and all other key rate durations are zero.", "explhtml": "<p>If an option-free bond is trading at par, the bond&#x27;s maturity-matched rate (or the spot rate applicable to its maturity) is the only rate that affects the bond&#x27;s value. Its maturity key rate duration is the same as its effective duration, and all other key rate durations are zero.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.6, LOS 25.k<\/div><div class=\"qtext\"><p>For an option-free bond trading at par, it is least likely that:<\/p><\/div>", "subj": "fixed"}, {"n": 90, "q": "Which bonds would have its maturity-matched rate as its most critical rate?", "opts": ["Low coupon putable bonds.", "Low coupon callable bonds.", "High coupon callable bonds."], "ans": "B", "expl": "Callable bonds with low coupon rate are unlikely to be called; hence, their maturity-matched rate is their most critical rate (i.e., the highest key rate duration corresponds to the bond's maturity). Similarly, putable bonds with high coupon rates are unlikely to be put and are most sensitive to their maturity-matched rates.", "explhtml": "<p>Callable bonds with low coupon rate are unlikely to be called; hence, their maturity-matched rate is their most critical rate (i.e., the highest key rate duration corresponds to the bond&#x27;s maturity). Similarly, putable bonds with high coupon rates are unlikely to be put and are most sensitive to their maturity-matched rates.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.6, LOS 25.k<\/div><div class=\"qtext\"><p>Which bonds would have its maturity-matched rate as its most critical rate?<\/p><\/div>", "subj": "fixed"}, {"n": 91, "q": "Suppose that the value of an option-free bond is equal to 100.16, the value of the corresponding callable bond is equal to 99.42, and the value of the corresponding putable bond is 101.72. What is the value of the call option?", "opts": ["0.21.", "0.74.", "0.64."], "ans": "B", "expl": "The call option value is just the difference between the value of the option-free bond and the value of the callable bond. Therefore, we have: Call option value = 100.16 – 99.42 = 0.74.", "explhtml": "<p>The call option value is just the difference between the value of the option-free bond and the value of the callable bond. Therefore, we have:<\/p><p>Call option value = 100.16 – 99.42 = 0.74.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.1, LOS 25.b<\/div><div class=\"qtext\"><p>Suppose that the value of an option-free bond is equal to 100.16, the value of the corresponding callable bond is equal to 99.42, and the value of the corresponding putable bond is 101.72. What is the value of the call option?<\/p><\/div>", "subj": "fixed"}, {"n": 92, "q": "Suppose that the stock price of a common stock increases by 10%. Which of the following is most accurate for the price of the recently issued convertible bond? The value of the convertible bond will:", "opts": ["remain unchanged.", "increase by 10%.", "increase by less than 10%."], "ans": "C", "expl": "When the underlying stock price rises, the convertible bond will underperform because of the conversion premium. However, buying convertible bonds in lieu of stocks limits downside risk. The price floor set by the straight bond value causes this downside protection.", "explhtml": "<p>When the underlying stock price rises, the convertible bond will underperform because of the conversion premium. However, buying convertible bonds in lieu of stocks limits downside risk. The price floor set by the straight bond value causes this downside protection.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.8, LOS 25.q<\/div><div class=\"qtext\"><p>Suppose that the stock price of a common stock increases by 10%. Which of the following is most accurate for the price of the recently issued convertible bond? The value of the convertible bond will:<\/p><\/div>", "subj": "fixed"}, {"n": 93, "q": "Value of a capped floater with a cap of 4% is closest to:", "opts": ["$96.71", "$97.38", "$98.70"], "ans": "C", "expl": "The cap will be in the money for nodes 2,UU; 2,UL; and 1,U. V2,UU = 104/1.060512 = 98.07 V2,UL = 104/1.040562 = 99.95 V2,UL = 102.7190/1.027190 = 100 (   + 4) 98.07 + 99.95 2 V1,U   =    = 97.38 1.057798 (   + 3.8743) 100 + 99.95 2 V 1,L   =    = 99.98 1.038743 (   + 2) 97.38 + 99.98 2 V₀   =    = 98.71 1.02", "explhtml": "<p>The cap will be in the money for nodes 2,UU; 2,UL; and 1,U.<\/p><p>V<sub>2,UU<\/sub> = 104/1.060512 = 98.07<\/p><p>V<sub>2,UL<\/sub> = 104/1.040562 = 99.95<\/p><p>V<sub>2,UL<\/sub> = 102.7190/1.027190 = 100 ( &nbsp;  + 4)<\/p><p>98.07 + 99.95<\/p><p>2 V1,U &nbsp;  =  &nbsp;  = 97.38<\/p><p>1.057798 ( &nbsp;  + 3.8743)<\/p><p>100 + 99.95<\/p><p>2 V 1,L &nbsp;  =  &nbsp;  = 99.98<\/p><p>1.038743 ( &nbsp;  + 2)<\/p><p>97.38 + 99.98<\/p><p>2 V<sub>0<\/sub> &nbsp;  =  &nbsp;  = 98.71<\/p><p>1.02<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 93–94<\/summary><div class=\"vig-body\"><p>Alnoor Hudda, CFA, is valuing two floaters issued by Mateo Bank. Both floaters have a par value of $100, three year life and pay based on annual MRR. Hudda has generated the following binomial tree for MRR.<\/p><p>1-year forward rates starting in year:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v030.webp\" style=\"max-width:min(100%,180px)\" alt=\"1 2 2% 5.7798% 6.0512% 3.8743% 4.0562% 2.7190%\"><\/div><\/details><div class=\"pp-topic\">Module 25.7, LOS 25.m<\/div><div class=\"qtext\"><p>Value of a capped floater with a cap of 4% is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 94, "q": "Value of the cap in a capped floater with a cap of 4% is closest to:", "opts": ["$1.23", "$1.29", "$4.41"], "ans": "B", "expl": "value of the cap = $100 – $98.71 = $1.29 The cap will be in the money for nodes 2,UU; 2,UL; and 1,U. V2,UU = 104/1.060512 = 98.07 V2,UL = 104/1.040562 = 99.95 V2,UL = 102 const CFG = {"title": "Reading 25 — Valuation and Analysis of Bonds with Embedded Options", "subtitle": "CFA Level II · 99 câu · Kaplan Schweser QBank 2025 (58 câu đơn · 41 câu item set)", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");

  $("title").textContent = CFG.title || "Quiz";

    head.appendChild(num); head.appendChild(pin);

  if(CFG.minutes>0){

      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

const CFA_SESSION_SUBJECT_RANGES = {

};
const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,
  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,
  fsa:/financial statement|financial reporting|accounting|income statement|balance sheet|cash flow|revenue|expense|inventory|cost of sales|gross profit|gross margin|shareholders?['’]? equity|earnings per share|\beps\b|audit|gaap|ifrs|taxable income|deferred tax|temporary difference|intangible|long-lived|revaluation|impairment|amortization|depreciation|pension|financial ratio|receivables turnover|payables turnover|cash conversion|fixed charge coverage|normalized earnings|management['’]?s commentary/g,
  corporate:/corporate|company lifecycle|start-up|startup|early-stage|business model|franchise|board of directors|proxy voting|stakeholder|shareholder|creditor|governance|capital budgeting|capital investment|project|real option|\bnpv\b|internal rate of return|\birr\b|cost of debt|cost of capital|capital structure|weight of debt|modigliani|dividend policy|double taxation|principal-agent|working capital|liquidity|compensation|competitive strategy|porter|economies of scale|information asymmetry|agency relationship/g,
  equity:/equity|common share|preferred share|stock|market index|index weighting|market efficiency|efficient market|security market|buy order|sell order|limit order|dealer|margin requirement|leverage ratio|industry classification|company analysis|enterprise value|price-to|free cash flow to equity|\bfcfe\b|dividend discount|earnings multiplier|book value per share|intrinsic value|voting|ex-dividend/g,
  fixed:/fixed-income|fixed income|bond|debt|credit rating|credit spread|yield|spot rate|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|repo|covenant|accrued interest|priority of claims|default|extension risk|interest coverage/g,
  derivatives:/derivative|forward|future|swap|option|call buyer|call seller|put buyer|put seller|strike price|premium|put-call|binomial|contingent claim|moneyness|expiration|arbitrage|replication/g,
  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,
  portfolio:/portfolio|asset allocation|investment policy|\bips\b|behavioral|cognitive error|risk aversion|utility|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation|covariance|sharpe|treynor|jensen|information ratio|two-fund|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral/g
};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
