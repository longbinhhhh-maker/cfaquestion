ough the issuance of cash, subordinated notes, common stock, or any combination of these three securities. In contrast, a bond with a hard put is only redeemable using cash.", "explhtml": "<p>A bond with an embedded soft put is redeemable through the issuance of cash, subordinated notes, common stock, or any combination of these three securities. In contrast, a bond with a hard put is only redeemable using cash.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 47–49<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>MediSoft Inc. develops and distributes high-tech medical software used in hospitals and clinics across the United States and Canada. The firm's software provides an integrated solution to monitoring, analyzing, and managing output from a variety of diagnostic medical equipment including MRIs, CT scans, and EKG machines. MediSoft has grown rapidly since its inception ten years ago, averaging 25% growth in sales over the past decade. The company went public three years ago. Twelve months after its IPO, MediSoft made two semiannual coupon bond offerings, the first of which was a convertible bond. At the time of issuance, the convertible bond had a coupon rate of 7.25%, a par value of $1,000, a conversion price of $55.56, and ten years until maturity. Two years after issuance, the bond became callable at 102% of par value. Soon after the issuance of the convertible bond, the company issued another series of bonds, which were putable but contained no conversion or call features. The putable bonds were issued with a coupon of 8.0%, a par value of $1,000, and 15 years until maturity. One year after their issuance, the put feature of the putable bonds became active, allowing the bonds to be put at a price of 95% of par value, and increasing linearly over five years to 100% of par value. MediSoft's convertible bonds are now trading in the market for a price of $947 with an estimated straight value of $917. The company's putable bonds are trading at a price of $1,052. Volatility in the price of MediSoft's common stock has been relatively high over the past few months. Currently, the stock is priced at $50 on the New York Stock Exchange and is expected to continue its annual dividend in the amount of $1.80 per share.<\/p><p>High-tech industry analysts for Brown &amp; Associates, a money management firm specializing in fixed- income investments, have been closely following MediSoft ever since it went public three years ago. In general, portfolio managers at Brown &amp; Associates do not participate in initial offerings of debt investments, preferring instead to see how the issue trades before considering taking a position in the issue, Because MediSoft's bonds have had ample time to trade in the marketplace, analysts and portfolio managers have taken an interest in the company's bonds. At a meeting to discuss the merits of MediSoft's bonds, the following comments were made by various portfolio managers and analysts at Brown &amp; Associates:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v021.webp\" style=\"max-width:min(100%,584px)\" alt=\"&quot;Choosing to invest in MediSoft&#x27;s convertible bond would benefit our portfolios in many ways, but the primary benefit is the limited downside risk associated with the bond. Because the straight value will provide a floor for the value of the convertible bond, downside risk is limited to the difference between the market price of the bond and the straight value.&quot; &quot;Decreasing volatility in the price of MediSoft&#x27;s common stock as well as increasing volatility in the level of interest rates are expected in the near future. The combined effects of these changes in volatilit\"><\/div><\/details><div class=\"pp-topic\">Module 25.1, LOS 25.a<\/div><div class=\"qtext\"><p>Subsequent to purchasing one of the putable bonds for his portfolio, one of the managers at Brown &amp; Associates realized that the bond contained a soft put. Which of the following securities cannot be used to redeem the bond in the event the bond becomes putable?<\/p><\/div>", "subj": "fixed"}, {"n": 50, "q": "Which of the following statements about how interest rate volatility affects the value bond is most accurate? When interest rate volatility increases, the value of a:", "opts": ["callable bond decreases.", "straight bond decreases.", "putable bond decreases."], "ans": "A", "expl": "Option values are positively related to the volatility of the underlying. Thus, when interest rate volatility increases, the values of both call and put options increase. When interest rate volatility increases, the value of a callable bond (where the investor is short the call option) decreases and the value of a putable bond (where the investor is long the put option) increases. The value of a straight bond is unaffected by changes in the volatility of interest rate, though value is affected by changes in the level of interest rate.", "explhtml": "<p>Option values are positively related to the volatility of the underlying. Thus, when interest rate volatility increases, the values of both call and put options increase. When interest rate volatility increases, the value of a callable bond (where the investor is short the call option) decreases and the value of a putable bond (where the investor is long the put option) increases. The value of a straight bond is unaffected by changes in the volatility of interest rate, though value is affected by changes in the level of interest rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.3, LOS 25.d<\/div><div class=\"qtext\"><p>Which of the following statements about how interest rate volatility affects the value bond is most accurate? When interest rate volatility increases, the value of a:<\/p><\/div>", "subj": "fixed"}, {"n": 51, "q": "Woods is most likely resistant to the zero-volatility spread because the spread:", "opts": ["fails to consider price risk, which is uncertainty regarding terminal cash flows.", "does not indicate how much of the spread reflects the significant prepayment risk associated with MBS.", "only considers one path of interest rates, the current Treasury spot rate curve."], "ans": "C", "expl": "Zero-volatility spread is a commonly used measure of relative value for MBS and ABS. However, it only considers one path of interest rates, while OAS considers every spot rate along every interest rate path.", "explhtml": "<p>Zero-volatility spread is a commonly used measure of relative value for MBS and ABS. However, it only considers one path of interest rates, while OAS considers every spot rate along every interest rate path.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 51–54<\/summary><div class=\"vig-body\"><p>Bill Woods, CFA, is a portfolio manager for Matrix Securities Fund, a closed-end bond fund that invests in U.S. Treasuries, mortgage-backed securities (MBS), asset-backed securities (ABS), and MBS derivatives. The fund has assets of approximately $400 million, has a current stock price of $14.50 and a net asset value (NAV) of $16.00. Woods is a member of a four person investment team that is responsible for all aspects of managing the portfolio, including interest rate forecasting, performing basic financial analysis and valuation of the portfolio, and selecting appropriate investments for Matrix. His expertise is in the analysis and valuation of MBS and ABS.<\/p><p>The fund pays a $0.12 monthly dividend that is paid from current income. The basic operating strategy of Matrix is to leverage its capital by investing in fixed income securities, and then financing those assets through repurchase agreements. Matrix then earns the spread between the net coupon of the underlying assets and the cost to finance the asset. Therefore, when evaluating a security for investment, it is critical that Matrix can be reasonably assured that it will earn a positive Spread.<\/p><p>During the course of his analysis, Woods utilizes several methodologies to evaluate current portfolio holdings and potential investments. Valuation methods he uses include nominal spreads, Z-spreads, and option-adjusted spreads (OAS). There is ongoing debate among the investment team as to the merits and shortcomings of each of the methods. Woods believes that the OAS method is by far a superior tool in all circumstances, while his fellow portfolio manager, Yuri Ackerman, feels that each of the methods can at times serve a useful purpose. Wood and Ackerman's current discussion involves two similar FNMA adjustable-rate mortgage (ARM) securities Wood is considering purchasing. Both ARM \"A\" and ARM \"B\" are indexed off of 6-month LIBOR, are new production, and have similar net coupons.<\/p><p>Select Financial Information:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v022.webp\" style=\"max-width:min(100%,623px)\" alt=\"Nominal OAS (bps) ARM WAM Net Coupon Z-spread (bps) Spread 135 360 81 6.27% 98 6.41% 358 95 116 129\"><p>Woods recommends that Matrix purchase ARM \"A\" with the 6.27% net coupon. He has based his conclusion on the calculated OAS of the securities, which he believes indicates that ARM \"A\" is the cheaper of the two securities. Ackerman disagrees with Woods, arguing that OAS is only one component of any analysis, and that a buy or sell recommendation should not be made based upon the OAS spread alone. Ackerman claims that other measures, such as one of the many duration measures and convexity, need to be incorporated into the analysis. He points out that both ARMS have equal convexities, but ARM \"A\" has a duration of 7.2 years and ARM \"B\" has duration of 6.8 years. These characteristics will affect the expected return in any interest rate scenario. Woods admits that he had not considered the differences in the bond's durations, and he acknowledges that others factors should be considered before a recommendation can be made.<\/p><\/div><\/details><div class=\"pp-topic\">Module 25.4, LOS 25.g<\/div><div class=\"qtext\"><p>Woods is most likely resistant to the zero-volatility spread because the spread:<\/p><\/div>", "subj": "fixed"}, {"n": 52, "q": "In general, the investment team at Matrix attempts to buy \"cheap\" securities because they are undervalued on a relative basis. What is a characteristic of a \"cheap\" security for a given Z-spread and effective duration?", "opts": ["Low OAS relative to the required OAS and low option costs.", "High OAS relative to the required OAS and low option costs.", "High OAS relative to the required OAS and high option costs."], "ans": "B", "expl": "A higher OAS indicates a larger risk-adjusted spread, which leads to a lower relative price. The implied cost of the embedded option in a security with a call feature is the option cost, so a buyer would prefer a lower cost.", "explhtml": "<p>A higher OAS indicates a larger risk-adjusted spread, which leads to a lower relative price. The implied cost of the embedded option in a security with a call feature is the option cost, so a buyer would prefer a lower cost.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 51–54<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Bill Woods, CFA, is a portfolio manager for Matrix Securities Fund, a closed-end bond fund that invests in U.S. Treasuries, mortgage-backed securities (MBS), asset-backed securities (ABS), and MBS derivatives. The fund has assets of approximately $400 million, has a current stock price of $14.50 and a net asset value (NAV) of $16.00. Woods is a member of a four person investment team that is responsible for all aspects of managing the portfolio, including interest rate forecasting, performing basic financial analysis and valuation of the portfolio, and selecting appropriate investments for Matrix. His expertise is in the analysis and valuation of MBS and ABS.<\/p><p>The fund pays a $0.12 monthly dividend that is paid from current income. The basic operating strategy of Matrix is to leverage its capital by investing in fixed income securities, and then financing those assets through repurchase agreements. Matrix then earns the spread between the net coupon of the underlying assets and the cost to finance the asset. Therefore, when evaluating a security for investment, it is critical that Matrix can be reasonably assured that it will earn a positive Spread.<\/p><p>During the course of his analysis, Woods utilizes several methodologies to evaluate current portfolio holdings and potential investments. Valuation methods he uses include nominal spreads, Z-spreads, and option-adjusted spreads (OAS). There is ongoing debate among the investment team as to the merits and shortcomings of each of the methods. Woods believes that the OAS method is by far a superior tool in all circumstances, while his fellow portfolio manager, Yuri Ackerman, feels that each of the methods can at times serve a useful purpose. Wood and Ackerman's current discussion involves two similar FNMA adjustable-rate mortgage (ARM) securities Wood is considering purchasing. Both ARM \"A\" and ARM \"B\" are indexed off of 6-month LIBOR, are new production, and have similar net coupons.<\/p><p>Select Financial Information:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v022.webp\" style=\"max-width:min(100%,623px)\" alt=\"Nominal OAS (bps) ARM WAM Net Coupon Z-spread (bps) Spread 135 360 81 6.27% 98 6.41% 358 95 116 129\"><p>Woods recommends that Matrix purchase ARM \"A\" with the 6.27% net coupon. He has based his conclusion on the calculated OAS of the securities, which he believes indicates that ARM \"A\" is the cheaper of the two securities. Ackerman disagrees with Woods, arguing that OAS is only one component of any analysis, and that a buy or sell recommendation should not be made based upon the OAS spread alone. Ackerman claims that other measures, such as one of the many duration measures and convexity, need to be incorporated into the analysis. He points out that both ARMS have equal convexities, but ARM \"A\" has a duration of 7.2 years and ARM \"B\" has duration of 6.8 years. These characteristics will affect the expected return in any interest rate scenario. Woods admits that he had not considered the differences in the bond's durations, and he acknowledges that others factors should be considered before a recommendation can be made.<\/p><\/div><\/details><div class=\"pp-topic\">Module 25.4, LOS 25.g<\/div><div class=\"qtext\"><p>In general, the investment team at Matrix attempts to buy &quot;cheap&quot; securities because they are undervalued on a relative basis. What is a characteristic of a &quot;cheap&quot; security for a given Z-spread and effective duration?<\/p><\/div>", "subj": "fixed"}, {"n": 53, "q": "Which of the two bonds Woods is considering purchasing has the greater interest rate exposure?", "opts": ["ARM A, because it has a larger duration.", "The interest rate exposure cannot determine without a specific measure of convexity.", "ARM B, because it has a smaller duration."], "ans": "A", "expl": "Effective duration is a measure of interest rate risk. All things equal, the larger the duration of a security the greater the interest rate risk.", "explhtml": "<p>Effective duration is a measure of interest rate risk. All things equal, the larger the duration of a security the greater the interest rate risk.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 51–54<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Bill Woods, CFA, is a portfolio manager for Matrix Securities Fund, a closed-end bond fund that invests in U.S. Treasuries, mortgage-backed securities (MBS), asset-backed securities (ABS), and MBS derivatives. The fund has assets of approximately $400 million, has a current stock price of $14.50 and a net asset value (NAV) of $16.00. Woods is a member of a four person investment team that is responsible for all aspects of managing the portfolio, including interest rate forecasting, performing basic financial analysis and valuation of the portfolio, and selecting appropriate investments for Matrix. His expertise is in the analysis and valuation of MBS and ABS.<\/p><p>The fund pays a $0.12 monthly dividend that is paid from current income. The basic operating strategy of Matrix is to leverage its capital by investing in fixed income securities, and then financing those assets through repurchase agreements. Matrix then earns the spread between the net coupon of the underlying assets and the cost to finance the asset. Therefore, when evaluating a security for investment, it is critical that Matrix can be reasonably assured that it will earn a positive Spread.<\/p><p>During the course of his analysis, Woods utilizes several methodologies to evaluate current portfolio holdings and potential investments. Valuation methods he uses include nominal spreads, Z-spreads, and option-adjusted spreads (OAS). There is ongoing debate among the investment team as to the merits and shortcomings of each of the methods. Woods believes that the OAS method is by far a superior tool in all circumstances, while his fellow portfolio manager, Yuri Ackerman, feels that each of the methods can at times serve a useful purpose. Wood and Ackerman's current discussion involves two similar FNMA adjustable-rate mortgage (ARM) securities Wood is considering purchasing. Both ARM \"A\" and ARM \"B\" are indexed off of 6-month LIBOR, are new production, and have similar net coupons.<\/p><p>Select Financial Information:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v022.webp\" style=\"max-width:min(100%,623px)\" alt=\"Nominal OAS (bps) ARM WAM Net Coupon Z-spread (bps) Spread 135 360 81 6.27% 98 6.41% 358 95 116 129\"><p>Woods recommends that Matrix purchase ARM \"A\" with the 6.27% net coupon. He has based his conclusion on the calculated OAS of the securities, which he believes indicates that ARM \"A\" is the cheaper of the two securities. Ackerman disagrees with Woods, arguing that OAS is only one component of any analysis, and that a buy or sell recommendation should not be made based upon the OAS spread alone. Ackerman claims that other measures, such as one of the many duration measures and convexity, need to be incorporated into the analysis. He points out that both ARMS have equal convexities, but ARM \"A\" has a duration of 7.2 years and ARM \"B\" has duration of 6.8 years. These characteristics will affect the expected return in any interest rate scenario. Woods admits that he had not considered the differences in the bond's durations, and he acknowledges that others factors should be considered before a recommendation can be made.<\/p><\/div><\/details><div class=\"pp-topic\">Module 25.4, LOS 25.g<\/div><div class=\"qtext\"><p>Which of the two bonds Woods is considering purchasing has the greater interest rate exposure?<\/p><\/div>", "subj": "fixed"}, {"n": 54, "q": "Matrix also currently has investments in several ABS. Which of the following spread measures is most appropriate in the analysis of ABS backed by credit card receivables?", "opts": ["Monte Carlo simulation model, because representative paths can be utilized.", "Z-spread, because credit card ABS have no prepayment option.", "OAS, because the cash flows are interest rate path dependent."], "ans": "B", "expl": "Credit card receivable-backed ABS have no prepayment option, therefore prepayments are not path dependent and the Z-spread is the most appropriate model.", "explhtml": "<p>Credit card receivable-backed ABS have no prepayment option, therefore prepayments are not path dependent and the Z-spread is the most appropriate model.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 51–54<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Bill Woods, CFA, is a portfolio manager for Matrix Securities Fund, a closed-end bond fund that invests in U.S. Treasuries, mortgage-backed securities (MBS), asset-backed securities (ABS), and MBS derivatives. The fund has assets of approximately $400 million, has a current stock price of $14.50 and a net asset value (NAV) of $16.00. Woods is a member of a four person investment team that is responsible for all aspects of managing the portfolio, including interest rate forecasting, performing basic financial analysis and valuation of the portfolio, and selecting appropriate investments for Matrix. His expertise is in the analysis and valuation of MBS and ABS.<\/p><p>The fund pays a $0.12 monthly dividend that is paid from current income. The basic operating strategy of Matrix is to leverage its capital by investing in fixed income securities, and then financing those assets through repurchase agreements. Matrix then earns the spread between the net coupon of the underlying assets and the cost to finance the asset. Therefore, when evaluating a security for investment, it is critical that Matrix can be reasonably assured that it will earn a positive Spread.<\/p><p>During the course of his analysis, Woods utilizes several methodologies to evaluate current portfolio holdings and potential investments. Valuation methods he uses include nominal spreads, Z-spreads, and option-adjusted spreads (OAS). There is ongoing debate among the investment team as to the merits and shortcomings of each of the methods. Woods believes that the OAS method is by far a superior tool in all circumstances, while his fellow portfolio manager, Yuri Ackerman, feels that each of the methods can at times serve a useful purpose. Wood and Ackerman's current discussion involves two similar FNMA adjustable-rate mortgage (ARM) securities Wood is considering purchasing. Both ARM \"A\" and ARM \"B\" are indexed off of 6-month LIBOR, are new production, and have similar net coupons.<\/p><p>Select Financial Information:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v022.webp\" style=\"max-width:min(100%,623px)\" alt=\"Nominal OAS (bps) ARM WAM Net Coupon Z-spread (bps) Spread 135 360 81 6.27% 98 6.41% 358 95 116 129\"><p>Woods recommends that Matrix purchase ARM \"A\" with the 6.27% net coupon. He has based his conclusion on the calculated OAS of the securities, which he believes indicates that ARM \"A\" is the cheaper of the two securities. Ackerman disagrees with Woods, arguing that OAS is only one component of any analysis, and that a buy or sell recommendation should not be made based upon the OAS spread alone. Ackerman claims that other measures, such as one of the many duration measures and convexity, need to be incorporated into the analysis. He points out that both ARMS have equal convexities, but ARM \"A\" has a duration of 7.2 years and ARM \"B\" has duration of 6.8 years. These characteristics will affect the expected return in any interest rate scenario. Woods admits that he had not considered the differences in the bond's durations, and he acknowledges that others factors should be considered before a recommendation can be made.<\/p><\/div><\/details><div class=\"pp-topic\">Module 25.4, LOS 25.g<\/div><div class=\"qtext\"><p>Matrix also currently has investments in several ABS. Which of the following spread measures is most appropriate in the analysis of ABS backed by credit card receivables?<\/p><\/div>", "subj": "fixed"}, {"n": 55, "q": "For a convertible bond with a call provision, with respect to the bond's convertibility feature and the call feature, the Black-Scholes option model can apply to:", "opts": ["only one feature.", "both features.", "neither features."], "ans": "A", "expl": "The Black-Scholes model applies to the convertibility feature just as it does to the common stock. The Black-Scholes model is not appropriate for the call feature because the volatility of the bond cannot be assumed constant.", "explhtml": "<p>The Black-Scholes model applies to the convertibility feature just as it does to the common stock. The Black-Scholes model is not appropriate for the call feature because the volatility of the bond cannot be assumed constant.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.8, LOS 25.n<\/div><div class=\"qtext\"><p>For a convertible bond with a call provision, with respect to the bond&#x27;s convertibility feature and the call feature, the Black-Scholes option model can apply to:<\/p><\/div>", "subj": "fixed"}, {"n": 56, "q": "For a convertible bond without any other options, the call feature implied by the convertibility feature will do all of the following EXCEPT:", "opts": ["increase the value of the bond over that of a comparable option-free bond.", "place a lower limit on the possible values of the bond.", "cause negative convexity."], "ans": "C", "expl": "Negative convexity is caused by the bond being callable where the issuer has the embedded call option. Negative convexity does not apply to convertible bonds. The convertibility feature gives the bondholder a call option on the shares of common stock of the issuer. This increases the price of the bond and places a lower limit on the possible values of the bond. However, that lower limit will change with the price of the common stock.", "explhtml": "<p>Negative convexity is caused by the bond being callable where the issuer has the embedded call option. Negative convexity does not apply to convertible bonds. The convertibility feature gives the bondholder a call option on the shares of common stock of the issuer. This increases the price of the bond and places a lower limit on the possible values of the bond. However, that lower limit will change with the price of the common stock.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.8, LOS 25.n<\/div><div class=\"qtext\"><p>For a convertible bond without any other options, the call feature implied by the convertibility feature will do all of the following EXCEPT:<\/p><\/div>", "subj": "fixed"}, {"n": 57, "q": "As the volatility of interest rates increases, the value of a callable bond will:", "opts": ["rise.", "decline.", "rise if the interest rate is below the coupon rate, and fall if the interest rate is above the coupon rate."], "ans": "B", "expl": "As volatility increases, so will the option value, which means the value of a callable bond will decline. Remember that with a callable bond, the investor is short the call option.", "explhtml": "<p>As volatility increases, so will the option value, which means the value of a callable bond will decline. Remember that with a callable bond, the investor is short the call option.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.3, LOS 25.d<\/div><div class=\"qtext\"><p>As the volatility of interest rates increases, the value of a callable bond will:<\/p><\/div>", "subj": "fixed"}, {"n": 58, "q": "Joseph Dentice, CFA is evaluating three bonds. All three bonds have a coupon rate of 3%, maturity of five years and are generally identical in every respect except that bond A is an option-free bond, bond B is callable in two years and bond C is putable in two years. If interest rates decrease, the duration of which bond is most likely to decrease?", "opts": ["Bond A.", "Bond B.", "Bond C."], "ans": "B", "expl": "Decrease in rates would increase the likelihood of the call option being exercised and reduce the expected life (and duration) of the callable bond the most.", "explhtml": "<p>Decrease in rates would increase the likelihood of the call option being exercised and reduce the expected life (and duration) of the callable bond the most.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.5, LOS 25.j<\/div><div class=\"qtext\"><p>Joseph Dentice, CFA is evaluating three bonds. All three bonds have a coupon rate of 3%, maturity of five years and are generally identical in every respect except that bond A is an option-free bond, bond B is callable in two years and bond C is putable in two years.<\/p><p>If interest rates decrease, the duration of which bond is most likely to decrease?<\/p><\/div>", "subj": "fixed"}, {"n": 59, "q": "Using the following tree of semiannual interest rates what is the value of a putable semiannual bond that has one year remaining to maturity, a put price of 98 and a 4% coupon rate? The bond is putable today.  7.59% 6.35%   5.33%", "opts": ["97.92.", "98.75.", "98.00."], "ans": "C", "expl": "The putable bond price tree is as follows:  100.00  A ==> 98.27   98.00 100.00   99.35      100.00  As an example, the price at node A is obtained as follows: PriceA = max{(prob × (Pᵤₚ + coupon/2) + prob × (Pdown + coupon/2))/(1 + rate/2), putl price} = max{(0.5 × (100 + 2) + 0.5 × (100 + 2))/(1 + 0.0759/2),98} = 98.27. The bond values at the other nodes are obtained in the same way. The price at node 0 = [0.5 × (98.27+2) + 0.5 × (99.35+2)]/ (1 + 0.0635/2) = $97.71 but since this is less than the put price of $98 the bond price will be $98.", "explhtml": "<p>The putable bond price tree is as follows:<\/p><div class=\"tbl\"><table><tr><td><\/td><td colspan=2>100.00<\/td><\/tr><tr><td colspan=2>A ==&gt; 98.27<\/td><td><\/td><\/tr><tr><td>98.00<\/td><td colspan=2>100.00<\/td><\/tr><tr><td><\/td><td>99.35<\/td><td><\/td><\/tr><tr><td><\/td><td colspan=2>100.00<\/td><\/tr><\/table><\/div><p>As an example, the price at node A is obtained as follows: Price<sub>A<\/sub> = max{(prob × (P<sub>up<\/sub> + coupon/2) + prob × (P<sub>down <\/sub>+ coupon/2))/(1 + rate/2), putl price} = max{(0.5 × (100 + 2) + 0.5 × (100 + 2))/(1 + 0.0759/2),98} = 98.27. The bond values at the other nodes are obtained in the same way. The price at node 0 = [0.5 × (98.27+2) + 0.5 × (99.35+2)]/ (1 + 0.0635/2) = $97.71 but since this is less than the put price of $98 the bond price will be $98.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.2, LOS 25.f<\/div><div class=\"qtext\"><p>Using the following tree of semiannual interest rates what is the value of a putable semiannual bond that has one year remaining to maturity, a put price of 98 and a 4% coupon rate? The bond is putable today.<\/p><div class=\"tbl\"><table><tr><td><\/td><td>7.59%<\/td><\/tr><tr><td>6.35%<\/td><td><\/td><\/tr><tr><td><\/td><td>5.33%<\/td><\/tr><\/table><\/div><\/div>", "subj": "fixed"}, {"n": 60, "q": "For a callable bond, the value of an embedded option is the price of the option-free bond:", "opts": ["minus the price of a callable bond of the same maturity, coupon and rating.", "plus the price of a callable bond of the same maturity, coupon and rating.", "plus the risk-free rate."], "ans": "A", "expl": "The value of the option embedded in a bond is the difference between that bond and an option-free bond of the same maturity, coupon and rating. The callable bond will have a price that is less than the price of a non-callable bond. Thus, the value of the embedded option is the option-free bond's price minus the callable bond's price.", "explhtml": "<p>The value of the option embedded in a bond is the difference between that bond and an option-free bond of the same maturity, coupon and rating. The callable bond will have a price that is less than the price of a non-callable bond. Thus, the value of the embedded option is the option-free bond&#x27;s price minus the callable bond&#x27;s price.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.1, LOS 25.b<\/div><div class=\"qtext\"><p>For a callable bond, the value of an embedded option is the price of the option-free bond:<\/p><\/div>", "subj": "fixed"}, {"n": 61, "q": "Joseph Dentice, CFA is evaluating three bonds. All three bonds have a coupon rate of 3%, maturity of five years and are generally identical in every respect except that bond A is an option-free bond, bond B is callable in two years and bond C is putable in two years. If interest rates increase, the duration of which bond is most likely to decrease?", "opts": ["Bond A.", "Bond C.", "Bond B."], "ans": "B", "expl": "Increase in rates would increase the likelihood of the put option being exercised and reduce the expected life (and duration) of the putable bond the most.", "explhtml": "<p>Increase in rates would increase the likelihood of the put option being exercised and reduce the expected life (and duration) of the putable bond the most.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.5, LOS 25.j<\/div><div class=\"qtext\"><p>Joseph Dentice, CFA is evaluating three bonds. All three bonds have a coupon rate of 3%, maturity of five years and are generally identical in every respect except that bond A is an option-free bond, bond B is callable in two years and bond C is putable in two years.<\/p><p>If interest rates increase, the duration of which bond is most likely to decrease?<\/p><\/div>", "subj": "fixed"}, {"n": 62, "q": "Suppose the market price of a convertible security is $1,050 and the conversion ratio is 26.64. What is the market conversion price?", "opts": ["$26.64.", "$39.41.", "$1,050.00."], "ans": "B", "expl": "The market conversion price is computed as follows: Market conversion price = market price of convertible security/conversion ratio = $1,050/26.64 = $39.41", "explhtml": "<p>The market conversion price is computed as follows:<\/p><p>Market conversion price = market price of convertible security/conversion ratio = $1,050/26.64 = $39.41<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.8, LOS 25.o<\/div><div class=\"qtext\"><p>Suppose the market price of a convertible security is $1,050 and the conversion ratio is 26.64. What is the market conversion price?<\/p><\/div>", "subj": "fixed"}, {"n": 63, "q": "Puldo still believes that Diffle must include the OAS for the Hardin bonds in his report. Puldo points out that a proper benchmark is critical to any OAS analysis. Which of the following statements regarding benchmark interest rates and OAS is most accurate? Since liquidity risk is a critical issue, the OAS calculation for the Hardin bonds should:", "opts": ["use on-the-run U.S. Treasury rates as a benchmark in order to isolate the credit risk of the Hardin bonds.", "use on-the-run interest rates for other callable Hardin bonds as a benchmark in order to isolate the liquidity risk of the 2-year bond issue.", "be based on a benchmark that has no credit risk."], "ans": "B", "expl": "By using on-the-run rates of the issuing company, there will be no difference in credit risk captured in the spread. The only risk left will be liquidity risk. Using on-the-run U.S. Treasury rates is incorrect because using U.S. Treasury rates would not isolate the credit risk since liquidity risk would also be included. Using a benchmark that has no credit risk would not help differentiate the Hardin bonds from the Bratton bonds.", "explhtml": "<p>By using on-the-run rates of the issuing company, there will be no difference in credit risk captured in the spread. The only risk left will be liquidity risk. Using on-the-run U.S. Treasury rates is incorrect because using U.S. Treasury rates would not isolate the credit risk since liquidity risk would also be included. Using a benchmark that has no credit risk would not help differentiate the Hardin bonds from the Bratton bonds.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 63–66<\/summary><div class=\"vig-body\"><p>Mike Diffle has been asked to evaluate the bonds of Hardin, Inc. The specific issue Diffle is considering has an 8% annual coupon and matures in two years. The bonds are currently callable at 101, and beginning in six months, they are callable at par. Bratton Corporation, Hardin's competitor, also has bonds outstanding which are identical to Hardin's except that they are not callable. Diffle believes the AA rating of both bonds is an accurate reflection of their credit risk. Diffle is wondering if the Bratton bonds might be a better investment than the Hardin bonds. Assume that the following 1-year interest rate tree is used to value bonds with a maturity of up to three years (this tree assumes interest rate volatility of 10%).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v023.webp\" style=\"max-width:min(100%,298px)\" alt=\"Year 2 Year 1 Today 9.324% 8.530% 7.634% 7.250% 6.983% 6.250%\"><p>Also, assume that the appropriate spot rates for securities maturing in one, two, and three years are 7.25%, 7.5%, and 7.80%, respectively.<\/p><p>Diffle believes he should begin his analysis with the option-free Bratton bonds. He decides to consider two different approaches to valuing the Bratton Bonds—one that uses the current spot rate curve and another that uses the interest rate tree given above.<\/p><p>For the next step in his analysis, Diffle has decided to calculate the value of the Hardin bonds using the interest rate tree. His assumption is that the bond will be called at any node of the tree where the calculated value exceeds the call price. Diffle summarizes the results of his bond valuation analysis in a memo to his supervisor, Luke Puldo. In this memo, Diffle makes the following statements:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v024.webp\" style=\"max-width:min(100%,648px)\" alt=\"The value of the option embedded in the Hardin bonds can be derived by simply Statement 1: subtracting the interest rate tree value of the Hardin bonds from the interest rate tree value of the Bratton bonds. 1 am concerned that the 10% volatility assumption used to develop the interest rate tree might be too low. A higher volatility assumption would result in a lower Statement 2: value for the Hardin bonds.\"><p>After reviewing Diffle's analysis, Puldo notes that Diffle has not included any information on the option adjusted spread (OAS) for the Hardin bonds. Puldo suggests that Diffle should evaluate the OAS in order to get an idea of the liquidity risk of the Hardin bonds. Diffle counters that the OAS may not be very informative in this case, since he is uncertain as to the reliability of the interest rate volatility assumption.<\/p><p>To finish his analysis, Diffle would like to use his binomial model to evaluate the interest rate risk of both the Hardin bonds and the Bratton bonds. Diffle has shocked interest rates by 25 basis points throughout the interest rate tree he has been using to value the two bond issues. Using the new rates, Diffle has calculated values for the bonds assuming a 25-basis-point increase or decrease in rates. He plans to use these values as inputs into the following formulas for duration and convexity:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v025.webp\" style=\"max-width:min(100%,491px)\" alt=\"V--V+ V+ + V- - 2Vo convexity = duration = Vox(Ay)? 2x VoxAy\"><\/div><\/details><div class=\"pp-topic\">Module 25.4, LOS 25.g<\/div><div class=\"qtext\"><p>Puldo still believes that Diffle must include the OAS for the Hardin bonds in his report. Puldo points out that a proper benchmark is critical to any OAS analysis. Which of the following statements regarding benchmark interest rates and OAS is most accurate? Since liquidity risk is a critical issue, the OAS calculation for the Hardin bonds should:<\/p><\/div>", "subj": "fixed"}, {"n": 64, "q": "Which of the following statements is most accurate regarding Diffle's calculation of duration and convexity?", "opts": ["The duration estimate will be inaccurate since it does not account for any change in cash flows due to the call option embedded in the Hardin bond.", "The estimates for both duration and convexity will be inaccurate because the OAS was not estimated again after the rate shock.", "The duration estimate for the Bratton bonds will reflect the projected percentage change in price for a 100-basis-point change in interest rates."], "ans": "C", "expl": "The duration formula given will calculate the percentage change in price for a 100 basis point change in yield, regardless of the actual change in rates used to derive BV– and BV₊. The standard backward induction process would ensure that the derived values of BV– and BV₊ reflect any potential change in cash flows due to embedded options.", "explhtml": "<p>The duration formula given will calculate the percentage change in price for a 100 basis point change in yield, regardless of the actual change in rates used to derive BV<sub>– <\/sub>and BV<sub>+<\/sub>. The standard backward induction process would ensure that the derived values of BV<sub>– <\/sub>and BV<sub>+<\/sub> reflect any potential change in cash flows due to embedded options.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 63–66<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mike Diffle has been asked to evaluate the bonds of Hardin, Inc. The specific issue Diffle is considering has an 8% annual coupon and matures in two years. The bonds are currently callable at 101, and beginning in six months, they are callable at par. Bratton Corporation, Hardin's competitor, also has bonds outstanding which are identical to Hardin's except that they are not callable. Diffle believes the AA rating of both bonds is an accurate reflection of their credit risk. Diffle is wondering if the Bratton bonds might be a better investment than the Hardin bonds. Assume that the following 1-year interest rate tree is used to value bonds with a maturity of up to three years (this tree assumes interest rate volatility of 10%).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v023.webp\" style=\"max-width:min(100%,298px)\" alt=\"Year 2 Year 1 Today 9.324% 8.530% 7.634% 7.250% 6.983% 6.250%\"><p>Also, assume that the appropriate spot rates for securities maturing in one, two, and three years are 7.25%, 7.5%, and 7.80%, respectively.<\/p><p>Diffle believes he should begin his analysis with the option-free Bratton bonds. He decides to consider two different approaches to valuing the Bratton Bonds—one that uses the current spot rate curve and another that uses the interest rate tree given above.<\/p><p>For the next step in his analysis, Diffle has decided to calculate the value of the Hardin bonds using the interest rate tree. His assumption is that the bond will be called at any node of the tree where the calculated value exceeds the call price. Diffle summarizes the results of his bond valuation analysis in a memo to his supervisor, Luke Puldo. In this memo, Diffle makes the following statements:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v024.webp\" style=\"max-width:min(100%,648px)\" alt=\"The value of the option embedded in the Hardin bonds can be derived by simply Statement 1: subtracting the interest rate tree value of the Hardin bonds from the interest rate tree value of the Bratton bonds. 1 am concerned that the 10% volatility assumption used to develop the interest rate tree might be too low. A higher volatility assumption would result in a lower Statement 2: value for the Hardin bonds.\"><p>After reviewing Diffle's analysis, Puldo notes that Diffle has not included any information on the option adjusted spread (OAS) for the Hardin bonds. Puldo suggests that Diffle should evaluate the OAS in order to get an idea of the liquidity risk of the Hardin bonds. Diffle counters that the OAS may not be very informative in this case, since he is uncertain as to the reliability of the interest rate volatility assumption.<\/p><p>To finish his analysis, Diffle would like to use his binomial model to evaluate the interest rate risk of both the Hardin bonds and the Bratton bonds. Diffle has shocked interest rates by 25 basis points throughout the interest rate tree he has been using to value the two bond issues. Using the new rates, Diffle has calculated values for the bonds assuming a 25-basis-point increase or decrease in rates. He plans to use these values as inputs into the following formulas for duration and convexity:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v025.webp\" style=\"max-width:min(100%,491px)\" alt=\"V--V+ V+ + V- - 2Vo convexity = duration = Vox(Ay)? 2x VoxAy\"><\/div><\/details><div class=\"pp-topic\">Module 25.6, LOS 25.l<\/div><div class=\"qtext\"><p>Which of the following statements is most accurate regarding Diffle&#x27;s calculation of duration and convexity?<\/p><\/div>", "subj": "fixed"}, {"n": 65, "q": "Puldo notes that the duration estimate for the two bonds is not directly comparable. Assuming that the underlying option is at- or near-the-money, the duration of one of the bonds will be lower than the other one. Which of the following most accurately critiques the OAS discussion between Diffle and Puldo? Puldo is:", "opts": ["incorrect that the OAS will provide insight into the liquidity risk of the Hardin Bonds, but Diffle is correct that different volatility assumptions would change the OAS.", "correct that the OAS will provide insight into the liquidity risk of the Hardin Bonds, but Diffle is incorrect since OAS implicitly adjusts for the volatility of interest rates.", "correct that the OAS will provide insight into the liquidity risk of the Hardin bonds, and Diffle is correct that different volatility assumptions would change the OAS."], "ans": "C", "expl": "The OAS accounts for compensation for credit and liquidity risk after the optionality has been removed (i.e., after cash flows have been adjusted). Since in this case the credit risk of the bonds is similar, the OAS could prove helpful in evaluating the relative liquidity risk. OAS will be affected by different assumptions regarding the volatility of interest rates.", "explhtml": "<p>The OAS accounts for compensation for credit and liquidity risk after the optionality has been removed (i.e., after cash flows have been adjusted). Since in this case the credit risk of the bonds is similar, the OAS could prove helpful in evaluating the relative liquidity risk. OAS will be affected by different assumptions regarding the volatility of interest rates.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 63–66<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mike Diffle has been asked to evaluate the bonds of Hardin, Inc. The specific issue Diffle is considering has an 8% annual coupon and matures in two years. The bonds are currently callable at 101, and beginning in six months, they are callable at par. Bratton Corporation, Hardin's competitor, also has bonds outstanding which are identical to Hardin's except that they are not callable. Diffle believes the AA rating of both bonds is an accurate reflection of their credit risk. Diffle is wondering if the Bratton bonds might be a better investment than the Hardin bonds. Assume that the following 1-year interest rate tree is used to value bonds with a maturity of up to three years (this tree assumes interest rate volatility of 10%).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v023.webp\" style=\"max-width:min(100%,298px)\" alt=\"Year 2 Year 1 Today 9.324% 8.530% 7.634% 7.250% 6.983% 6.250%\"><p>Also, assume that the appropriate spot rates for securities maturing in one, two, and three years are 7.25%, 7.5%, and 7.80%, respectively.<\/p><p>Diffle believes he should begin his analysis with the option-free Bratton bonds. He decides to consider two different approaches to valuing the Bratton Bonds—one that uses the current spot rate curve and another that uses the interest rate tree given above.<\/p><p>For the next step in his analysis, Diffle has decided to calculate the value of the Hardin bonds using the interest rate tree. His assumption is that the bond will be called at any node of the tree where the calculated value exceeds the call price. Diffle summarizes the results of his bond valuation analysis in a memo to his supervisor, Luke Puldo. In this memo, Diffle makes the following statements:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v024.webp\" style=\"max-width:min(100%,648px)\" alt=\"The value of the option embedded in the Hardin bonds can be derived by simply Statement 1: subtracting the interest rate tree value of the Hardin bonds from the interest rate tree value of the Bratton bonds. 1 am concerned that the 10% volatility assumption used to develop the interest rate tree might be too low. A higher volatility assumption would result in a lower Statement 2: value for the Hardin bonds.\"><p>After reviewing Diffle's analysis, Puldo notes that Diffle has not included any information on the option adjusted spread (OAS) for the Hardin bonds. Puldo suggests that Diffle should evaluate the OAS in order to get an idea of the liquidity risk of the Hardin bonds. Diffle counters that the OAS may not be very informative in this case, since he is uncertain as to the reliability of the interest rate volatility assumption.<\/p><p>To finish his analysis, Diffle would like to use his binomial model to evaluate the interest rate risk of both the Hardin bonds and the Bratton bonds. Diffle has shocked interest rates by 25 basis points throughout the interest rate tree he has been using to value the two bond issues. Using the new rates, Diffle has calculated values for the bonds assuming a 25-basis-point increase or decrease in rates. He plans to use these values as inputs into the following formulas for duration and convexity:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v025.webp\" style=\"max-width:min(100%,491px)\" alt=\"V--V+ V+ + V- - 2Vo convexity = duration = Vox(Ay)? 2x VoxAy\"><\/div><\/details><div class=\"pp-topic\">Module 25.4, LOS 25.h<\/div><div class=\"qtext\"><p>Puldo notes that the duration estimate for the two bonds is not directly comparable. Assuming that the underlying option is at- or near-the-money, the duration of one of the bonds will be lower than the other one.<\/p><p>Which of the following most accurately critiques the OAS discussion between Diffle and Puldo? Puldo is:<\/p><\/div>", "subj": "fixed"}, {"n": 66, "q": "Puldo notes that the duration estimate for the two bonds is not directly comparable. Assuming that the underlying option is at- or near-the-money, the duration of one of the bonds will be lower than the other one. Indicate whether the statements made by Diffle in his memo regarding the value of the embedded option and the effect of the volatility assumption are correct.", "opts": ["Only the statement regarding the value of the embedded option is correct.", "Only the statement regarding the effect of the volatility assumption is correct.", "Both statements are correct."], "ans": "C", "expl": "Statement 1 is correct. The value of the option would be the difference between the value calculated with no call feature (the Bratton bonds) and the value calculated assuming the bond is callable (the Hardin bonds). Recall that the vignette stated the Bratton and Hardin bonds were identical except for the call feature in the Hardin bonds. The option value would therefore be: 100.915 – 100.472 = 0.443. Statement 2 is also correct. Increased volatility would increase the value of the option, thus lowering the value of the callable bond.", "explhtml": "<p>Statement 1 is correct. The value of the option would be the difference between the value calculated with no call feature (the Bratton bonds) and the value calculated assuming the bond is callable (the Hardin bonds). Recall that the vignette stated the Bratton and Hardin bonds were identical except for the call feature in the Hardin bonds. The option value would therefore be: 100.915 – 100.472 = 0.443. Statement 2 is also correct. Increased volatility would increase the value of the option, thus lowering the value of the callable bond.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 63–66<span class=\"vig-hint\">bấm để xem case<\/span><\
