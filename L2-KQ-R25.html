<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 25 — Valuation and Analysis of Bonds with Embedded Options · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>

  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}

  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>

<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

<script>
const DATA = [{"n": 1, "q": "Which of the following correctly describes one of the basic features of a convertible bond? A convertible bond is a security that can be converted into:", "opts": ["another bond at the option of the issuer.", "common stock at the option of the investor.", "common stock at the option of the issuer."], "ans": "B", "expl": "The owner of a convertible bond can exchange the bond for the common shares of the issuer.", "explhtml": "<p>The owner of a convertible bond can exchange the bond for the common shares of the issuer.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.8, LOS 25.n<\/div><div class=\"qtext\"><p>Which of the following correctly describes one of the basic features of a convertible bond? A convertible bond is a security that can be converted into:<\/p><\/div>", "subj": "fixed"}, {"n": 2, "q": "Which of the following is equal to the value of a noncallable / nonputable convertible bond? The value of the corresponding:", "opts": ["straight bond.", "straight bond plus the value of the call option on the stock.", "callable bond plus the value of the call option on the stock."], "ans": "B", "expl": "The value of a noncallable/nonputable convertible bond can be expressed as: Option-free convertible bond value = straight value + value of the call option on the stock.", "explhtml": "<p>The value of a noncallable/nonputable convertible bond can be expressed as: Option-free convertible bond value = straight value + value of the call option on the stock.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.8, LOS 25.n<\/div><div class=\"qtext\"><p>Which of the following is equal to the value of a noncallable / nonputable convertible bond? The value of the corresponding:<\/p><\/div>", "subj": "fixed"}, {"n": 3, "q": "An analyst has constructed an interest rate tree for an on-the-run Treasury security. The analyst now wishes to use the tree to calculate the duration of the Treasury security. The usual way to do this is to estimate the changes in the bond's price associated with a:", "opts": ["parallel shift up and down of the forward rates implied by the binomial model.", "parallel shift up and down of the yield curve.", "shift up and down in the current one-year spot rate all else held constant."], "ans": "B", "expl": "The usual method is to apply parallel shifts to the yield curve, use those curves to compute new sets of forward rates, and then enter each set of rates into the interest rate tree. The resulting volatility of the present value of the bond is the measure of effective duration.", "explhtml": "<p>The usual method is to apply parallel shifts to the yield curve, use those curves to compute new sets of forward rates, and then enter each set of rates into the interest rate tree. The resulting volatility of the present value of the bond is the measure of effective duration.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.5, LOS 25.i<\/div><div class=\"qtext\"><p>An analyst has constructed an interest rate tree for an on-the-run Treasury security. The analyst now wishes to use the tree to calculate the duration of the Treasury security. The usual way to do this is to estimate the changes in the bond&#x27;s price associated with a:<\/p><\/div>", "subj": "fixed"}, {"n": 4, "q": "Joseph Dentice, CFA is evaluating three bonds. All three bonds have a coupon rate of 3%, maturity of five years and are generally identical in every respect except that bond A is an option-free bond, bond B is callable at any time at par and bond C is putable at any time at par. Yield curve is currently flat at 3%. The bond with the lowest one-sided down-duration is most likely to be:", "opts": ["Bond A.", "Bond C.", "Bond B."], "ans": "C", "expl": "When the underlying option is at (or near) money, callable bonds will have lower one-sided down-duration than one-sided up-duration; the price change of a callable when rates fall is smaller than the price change for an equal increase in rates. In this problem, the coupon rate is given to be equal to the current level of rates and hence the bond should be at par and the underlying option is at-the-money.", "explhtml": "<p>When the underlying option is at (or near) money, callable bonds will have lower one-sided down-duration than one-sided up-duration; the price change of a callable when rates fall is smaller than the price change for an equal increase in rates. In this problem, the coupon rate is given to be equal to the current level of rates and hence the bond should be at par and the underlying option is at-the-money.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.6, LOS 25.k<\/div><div class=\"qtext\"><p>Joseph Dentice, CFA is evaluating three bonds. All three bonds have a coupon rate of 3%, maturity of five years and are generally identical in every respect except that bond A is an option-free bond, bond B is callable at any time at par and bond C is putable at any time at par. Yield curve is currently flat at 3%.<\/p><p>The bond with the lowest one-sided down-duration is most likely to be:<\/p><\/div>", "subj": "fixed"}, {"n": 5, "q": "Are the two observations Berg writes down after the fixed income conference advantages to using the swap rate curve as a benchmark instead of a government bond curve?", "opts": ["Both statements are advantages.", "Only Statement 1 is an advantage.", "Only Statement 2 is an advantage."], "ans": "A", "expl": "Swap rates are fixed rates on plain-vanilla interest rate swaps. The swap rate curve (also known as the LIBOR curve) is the series of swap rates quoted by swap dealers over maturities extending from 2 to 30 years. Both of Berg's observations are advantages to using the swap rate curve instead of a government bond curve as a benchmark rate curve.", "explhtml": "<p>Swap rates are fixed rates on plain-vanilla interest rate swaps. The swap rate curve (also known as the LIBOR curve) is the series of swap rates quoted by swap dealers over maturities extending from 2 to 30 years. Both of Berg&#x27;s observations are advantages to using the swap rate curve instead of a government bond curve as a benchmark rate curve.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 5–8<\/summary><div class=\"vig-body\"><p>Natalia Berg, CFA, has estimated the key rate durations for several maturities in three of her $25 million bond portfolios, as shown in Exhibit 1. Exhibit 1: Key Rate Durations for Three Fixed-Income Portfolios<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v001.webp\" style=\"max-width:min(100%,669px)\" alt=\"Portfolio 3 Portfolio 2 Portfolio 1 Key Rate Maturity 2.45 0.35 1.26 2-year 0.20 0.40 1.27 5-year 4.00 0.15 1.23 10-year 0.25 2.20 1.24 20-year Total 5.00 5.00 5.00\"><p>At a fixed-income conference in London, Berg hears a presentation by a university professor on the increasing use of the swap rate curve as a benchmark instead of the government bond yield curve. When Berg returns from the conference, she realizes she has left her notes from the presentation on the airplane. However, she is very interested in learning more about whether she should consider using the swap rate curve in her work.<\/p><p>As she tries to reconstruct what was said at the conference, she writes down two advantages to using the swap rate curve:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v002.webp\" style=\"max-width:min(100%,648px)\" alt=\"The swap rate curve typically has yield quotes at 11 maturities between 2 and 30 years. The U.S. government bond yield curve, however, has fewer on-the-run Statement 1: issues trading at maturities of at least two years. Swap curves across countries are more comparable than government bond\"><p>Statement 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v003.webp\" style=\"max-width:min(100%,615px)\" alt=\"curves because they reflect similar levels of credit risk.\"><p>Berg also estimates the nominal spread, Z-spread, and option-adjusted spread (OAS) for the Steigers Corporation callable bonds in Portfolio 2. The OAS is estimated from a binomial interest rate tree. The results are shown in Exhibit 2. Exhibit 2: Spread Measures for Steigers Corporation Callable Bonds<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v004.webp\" style=\"max-width:min(100%,656px)\" alt=\"Benchmark Spread Measure Nominal spread Steigers Corp yield curve 25 basis points Z-spread 35 basis points Steigers Corp spot rate curve -20 basis points OAS Steigers Corp spot rate curve Treasury yield curve 120 basis points Nominal spread 40 basis points OAS Treasury spot rate curve\"><p>Berg determines that to obtain an accurate estimate of the effective duration and effective convexity of a callable bond using a binomial model, the specified change in yield (i.e., Ay) must be equal to the OAS.<\/p><p>Berg also observes that the current Treasury bond yield curve is upward sloping. Based on this observation, Berg forecasts that short-term interest rates will increase.<\/p><\/div><\/details><div class=\"pp-topic\">Module 23.3, LOS 23.e<\/div><div class=\"qtext\"><p>Are the two observations Berg writes down after the fixed income conference advantages to using the swap rate curve as a benchmark instead of a government bond curve?<\/p><\/div>", "subj": "fixed"}, {"n": 6, "q": "If the spot-rate curve experiences a parallel downward shift of 50 basis points:", "opts": ["all three portfolios will experience the same price performance.", "Portfolio 1 will experience the best price performance.", "Portfolio 3 will experience the best price performance."], "ans": "A", "expl": "The sum of a portfolio's key rate durations is the effective duration of the portfolio. Each of the portfolios has an effective duration of five, so a parallel shift in the yield curve will have the same effect on each portfolio, and each will experience the same price performance.", "explhtml": "<p>The sum of a portfolio&#x27;s key rate durations is the effective duration of the portfolio. Each of the portfolios has an effective duration of five, so a parallel shift in the yield curve will have the same effect on each portfolio, and each will experience the same price performance.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 5–8<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Natalia Berg, CFA, has estimated the key rate durations for several maturities in three of her $25 million bond portfolios, as shown in Exhibit 1. Exhibit 1: Key Rate Durations for Three Fixed-Income Portfolios<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v001.webp\" style=\"max-width:min(100%,669px)\" alt=\"Portfolio 3 Portfolio 2 Portfolio 1 Key Rate Maturity 2.45 0.35 1.26 2-year 0.20 0.40 1.27 5-year 4.00 0.15 1.23 10-year 0.25 2.20 1.24 20-year Total 5.00 5.00 5.00\"><p>At a fixed-income conference in London, Berg hears a presentation by a university professor on the increasing use of the swap rate curve as a benchmark instead of the government bond yield curve. When Berg returns from the conference, she realizes she has left her notes from the presentation on the airplane. However, she is very interested in learning more about whether she should consider using the swap rate curve in her work.<\/p><p>As she tries to reconstruct what was said at the conference, she writes down two advantages to using the swap rate curve:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v002.webp\" style=\"max-width:min(100%,648px)\" alt=\"The swap rate curve typically has yield quotes at 11 maturities between 2 and 30 years. The U.S. government bond yield curve, however, has fewer on-the-run Statement 1: issues trading at maturities of at least two years. Swap curves across countries are more comparable than government bond\"><p>Statement 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v003.webp\" style=\"max-width:min(100%,615px)\" alt=\"curves because they reflect similar levels of credit risk.\"><p>Berg also estimates the nominal spread, Z-spread, and option-adjusted spread (OAS) for the Steigers Corporation callable bonds in Portfolio 2. The OAS is estimated from a binomial interest rate tree. The results are shown in Exhibit 2. Exhibit 2: Spread Measures for Steigers Corporation Callable Bonds<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v004.webp\" style=\"max-width:min(100%,656px)\" alt=\"Benchmark Spread Measure Nominal spread Steigers Corp yield curve 25 basis points Z-spread 35 basis points Steigers Corp spot rate curve -20 basis points OAS Steigers Corp spot rate curve Treasury yield curve 120 basis points Nominal spread 40 basis points OAS Treasury spot rate curve\"><p>Berg determines that to obtain an accurate estimate of the effective duration and effective convexity of a callable bond using a binomial model, the specified change in yield (i.e., Ay) must be equal to the OAS.<\/p><p>Berg also observes that the current Treasury bond yield curve is upward sloping. Based on this observation, Berg forecasts that short-term interest rates will increase.<\/p><\/div><\/details><div class=\"pp-topic\">Module 23.6, LOS 23.j<\/div><div class=\"qtext\"><p>If the spot-rate curve experiences a parallel downward shift of 50 basis points:<\/p><\/div>", "subj": "fixed"}, {"n": 7, "q": "If the 5- and 10-year key rates increase by 20 basis points, but the 2- and 20-year key rates remain unchanged:", "opts": ["all three portfolios will experience the same price performance.", "Portfolio 1 will experience the best price performance.", "Portfolio 2 will experience the best price performance."], "ans": "B", "expl": "The exposure of each portfolio to changes in the 5- and 10-year rates are equal to the sum of the 5- and 10-year key rate durations: portfolio 1 exposure = 0.20 + 0.15 = 0.35 portfolio 2 exposure = 0.40 + 4.00 = 4.40 Portfolio 2 has the largest exposure, and portfolio 1 has the smallest exposure. If the 5- and 10-year key rates increase, portfolio 1 will fall by the smallest amount and will experience the best price performance (i.e., the smallest decrease in value). You can confirm this by doing the calculations for a 20 basis point increase: % change in\nportfolio 1 = (−0.20 × 0.002 × 100) + (−0.15 × 0.002 ×\n100)  = (−0.35 × 0.002 × 100) = −0.07%   % change in\nportfolio 2 = (−0.40 × 0.002 × 100) + (−4.00 × 0.002 ×\n100)  = (−4.40 × 0.002 × 100) = −0.88%", "explhtml": "<p>The exposure of each portfolio to changes in the 5- and 10-year rates are equal to the sum of the 5- and 10-year key rate durations:<\/p><p>portfolio 1 exposure = 0.20 + 0.15 = 0.35 portfolio 2 exposure = 0.40 + 4.00 = 4.40<\/p><p>Portfolio 2 has the largest exposure, and portfolio 1 has the smallest exposure. If the 5- and 10-year key rates increase, portfolio 1 will fall by the smallest amount and will experience the best price performance (i.e., the smallest decrease in value). You can confirm this by doing the calculations for a 20 basis point increase:<\/p><div class=\"tbl\"><table><tr><td>% change in<br>portfolio 1<\/td><td>= (−0.20 × 0.002 × 100) + (−0.15 × 0.002 ×<br>100)<\/td><\/tr><tr><td><\/td><td>= (−0.35 × 0.002 × 100) = −0.07%<\/td><\/tr><tr><td>% change in<br>portfolio 2<\/td><td>= (−0.40 × 0.002 × 100) + (−4.00 × 0.002 ×<br>100)<\/td><\/tr><tr><td><\/td><td>= (−4.40 × 0.002 × 100) = −0.88%<\/td><\/tr><\/table><\/div>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 5–8<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Natalia Berg, CFA, has estimated the key rate durations for several maturities in three of her $25 million bond portfolios, as shown in Exhibit 1. Exhibit 1: Key Rate Durations for Three Fixed-Income Portfolios<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v001.webp\" style=\"max-width:min(100%,669px)\" alt=\"Portfolio 3 Portfolio 2 Portfolio 1 Key Rate Maturity 2.45 0.35 1.26 2-year 0.20 0.40 1.27 5-year 4.00 0.15 1.23 10-year 0.25 2.20 1.24 20-year Total 5.00 5.00 5.00\"><p>At a fixed-income conference in London, Berg hears a presentation by a university professor on the increasing use of the swap rate curve as a benchmark instead of the government bond yield curve. When Berg returns from the conference, she realizes she has left her notes from the presentation on the airplane. However, she is very interested in learning more about whether she should consider using the swap rate curve in her work.<\/p><p>As she tries to reconstruct what was said at the conference, she writes down two advantages to using the swap rate curve:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v002.webp\" style=\"max-width:min(100%,648px)\" alt=\"The swap rate curve typically has yield quotes at 11 maturities between 2 and 30 years. The U.S. government bond yield curve, however, has fewer on-the-run Statement 1: issues trading at maturities of at least two years. Swap curves across countries are more comparable than government bond\"><p>Statement 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v003.webp\" style=\"max-width:min(100%,615px)\" alt=\"curves because they reflect similar levels of credit risk.\"><p>Berg also estimates the nominal spread, Z-spread, and option-adjusted spread (OAS) for the Steigers Corporation callable bonds in Portfolio 2. The OAS is estimated from a binomial interest rate tree. The results are shown in Exhibit 2. Exhibit 2: Spread Measures for Steigers Corporation Callable Bonds<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v004.webp\" style=\"max-width:min(100%,656px)\" alt=\"Benchmark Spread Measure Nominal spread Steigers Corp yield curve 25 basis points Z-spread 35 basis points Steigers Corp spot rate curve -20 basis points OAS Steigers Corp spot rate curve Treasury yield curve 120 basis points Nominal spread 40 basis points OAS Treasury spot rate curve\"><p>Berg determines that to obtain an accurate estimate of the effective duration and effective convexity of a callable bond using a binomial model, the specified change in yield (i.e., Ay) must be equal to the OAS.<\/p><p>Berg also observes that the current Treasury bond yield curve is upward sloping. Based on this observation, Berg forecasts that short-term interest rates will increase.<\/p><\/div><\/details><div class=\"pp-topic\">Module 23.6, LOS 23.j<\/div><div class=\"qtext\"><p>If the 5- and 10-year key rates increase by 20 basis points, but the 2- and 20-year key rates remain unchanged:<\/p><\/div>", "subj": "fixed"}, {"n": 8, "q": "Is Berg correct about the specified change in yield needed to obtain an accurate estimate of the effective duration and effective convexity of a callable bond using a binomial model?", "opts": ["No, because the specified change in yield must be smaller than the OAS.", "No, because the specified change in yield can be larger than, smaller than, or equal to the OAS.", "No, because the specified change in yield must be larger than the option-adjusted spread (OAS)."], "ans": "B", "expl": "The steps in the process of calculating the effective duration of a callable bond using a binomial tree are as follows: Step 1: Given assumptions about benchmark interest rates, interest rate volatility, and\nthe call and/or put rule, calculate the OAS for the issue using the binomial\nmodel. Step 2: Impose a small parallel shift in the on-the-run yield curve by an amount equal to\n+Δy. Step 3: Build a new binomial interest rate tree using the new yield curve. Step 4: Add the OAS to each of the 1-year forward rates in the interest rate tree to get a\n\"modified\" tree. (We assume that the OAS does not change when interest rates\nchange.) Step 5: Compute BV +Δy using this modified interest rate tree. Step 6: Repeat steps 2 through 5 using a parallel rate shift of −Δy to estimate a value of\nBV -Δy. There is no restriction on the relationship between the assumed change in the yield (Δy) and the OAS.", "explhtml": "<p>The steps in the process of calculating the effective duration of a callable bond using a binomial tree are as follows:<\/p><div class=\"tbl\"><table><tr><td>Step 1:<\/td><td>Given assumptions about benchmark interest rates, interest rate volatility, and<br>the call and/or put rule, calculate the OAS for the issue using the binomial<br>model.<\/td><\/tr><tr><td>Step 2:<\/td><td>Impose a small parallel shift in the on-the-run yield curve by an amount equal to<br>+Δy.<\/td><\/tr><tr><td>Step 3:<\/td><td>Build a new binomial interest rate tree using the new yield curve.<\/td><\/tr><tr><td>Step 4:<\/td><td>Add the OAS to each of the 1-year forward rates in the interest rate tree to get a<br>&quot;modified&quot; tree. (We assume that the OAS does not change when interest rates<br>change.)<\/td><\/tr><tr><td>Step 5:<\/td><td>Compute BV +Δy using this modified interest rate tree.<\/td><\/tr><tr><td>Step 6:<\/td><td>Repeat steps 2 through 5 using a parallel rate shift of −Δy to estimate a value of<br>BV -Δy.<\/td><\/tr><\/table><\/div><p>There is no restriction on the relationship between the assumed change in the yield (Δy) and the OAS.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 5–8<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Natalia Berg, CFA, has estimated the key rate durations for several maturities in three of her $25 million bond portfolios, as shown in Exhibit 1. Exhibit 1: Key Rate Durations for Three Fixed-Income Portfolios<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v001.webp\" style=\"max-width:min(100%,669px)\" alt=\"Portfolio 3 Portfolio 2 Portfolio 1 Key Rate Maturity 2.45 0.35 1.26 2-year 0.20 0.40 1.27 5-year 4.00 0.15 1.23 10-year 0.25 2.20 1.24 20-year Total 5.00 5.00 5.00\"><p>At a fixed-income conference in London, Berg hears a presentation by a university professor on the increasing use of the swap rate curve as a benchmark instead of the government bond yield curve. When Berg returns from the conference, she realizes she has left her notes from the presentation on the airplane. However, she is very interested in learning more about whether she should consider using the swap rate curve in her work.<\/p><p>As she tries to reconstruct what was said at the conference, she writes down two advantages to using the swap rate curve:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v002.webp\" style=\"max-width:min(100%,648px)\" alt=\"The swap rate curve typically has yield quotes at 11 maturities between 2 and 30 years. The U.S. government bond yield curve, however, has fewer on-the-run Statement 1: issues trading at maturities of at least two years. Swap curves across countries are more comparable than government bond\"><p>Statement 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v003.webp\" style=\"max-width:min(100%,615px)\" alt=\"curves because they reflect similar levels of credit risk.\"><p>Berg also estimates the nominal spread, Z-spread, and option-adjusted spread (OAS) for the Steigers Corporation callable bonds in Portfolio 2. The OAS is estimated from a binomial interest rate tree. The results are shown in Exhibit 2. Exhibit 2: Spread Measures for Steigers Corporation Callable Bonds<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v004.webp\" style=\"max-width:min(100%,656px)\" alt=\"Benchmark Spread Measure Nominal spread Steigers Corp yield curve 25 basis points Z-spread 35 basis points Steigers Corp spot rate curve -20 basis points OAS Steigers Corp spot rate curve Treasury yield curve 120 basis points Nominal spread 40 basis points OAS Treasury spot rate curve\"><p>Berg determines that to obtain an accurate estimate of the effective duration and effective convexity of a callable bond using a binomial model, the specified change in yield (i.e., Ay) must be equal to the OAS.<\/p><p>Berg also observes that the current Treasury bond yield curve is upward sloping. Based on this observation, Berg forecasts that short-term interest rates will increase.<\/p><\/div><\/details><div class=\"pp-topic\">Module 25.5, LOS 25.i<\/div><div class=\"qtext\"><p>Is Berg correct about the specified change in yield needed to obtain an accurate estimate of the effective duration and effective convexity of a callable bond using a binomial model?<\/p><\/div>", "subj": "fixed"}, {"n": 9, "q": "Patrick Wall is a new associate at a large international financial institution. His boss, C.D. Johnson, is responsible for familiarizing Wall with the basics of fixed income investing. Johnson asks Wall to evaluate the two otherwise identical bonds shown in Table 1. The callable bond is callable at 100 and exercisable on the coupon dates only. Wall is told to evaluate the bonds with respect to duration and convexity when interest rates decline by 50 basis points at all maturities over the next six months. Johnson supplies Wall with the requisite interest rate tree shown in Figure 1. Johnson explains to Wall that the prices of the bonds in Table 1 were computed using the interest rate lattice. Johnson instructs Wall to try and replicate the information in Table 1 and use his analysis to derive an investment decision for his portfolio. Table 1 Bond Descriptions  Non-callable Bond Callable Bond Price $100.83 $98.79 Time to Maturity (years) 5 5 Time to First Call Date -- 0 Annual Coupon $6.25 $6.25 Interest Payment Semi-annual Semi-annual Yield to Maturity 6.0547% 6.5366% Price Value per Basis Point 428.0360 -- Figure 1          15.44%         14.10%         12.69%  12.46%       11.85%  11.38%       9.75%  10.25%  10.05%     8.95%  9.57%  9.19%     7.91%  7.88%  8.28%  8.11%   7.35%  7.23%  7.74%  7.42%   6.62%  6.40%  6.37%  6.69%  6.54% 6.05%  5.95%  5.85%  6.25%  5.99%   5.36%  5.17%  5.15%  5.40%  5.28%   4.81%  4.73%  5.05%  4.83%     4.18%  4.16%  4.36%  4.26%     3.82%  4 ...............................................................<\/p><p>Given the following relevant part of the interest rate tree, the value of the callable bond at node A is closest to:<\/p><div class=\"tbl\"><table><tr><td><\/td><td><\/td><td>3.44%<\/td><\/tr><tr><td>A<\/td><td>3.15%<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td>2.77%<\/td><\/tr><\/table><\/div><\/div>", "subj": "fixed"}, {"n": 10, "q": "If a bond's key rate durations for maturity points shorter than the bond's maturity are negative, it is most likely that the bond being analyzed is a:", "opts": ["putable bond.", "callable bond.", "zero coupon bond."], "ans": "C", "expl": "If a bond is a zero-coupon bond (or if it has a \"very low\" coupon), key rate durations for maturity points that are shorter than the maturity of the bond being analyzed are generally negative. For example, the five-year key rate duration for a 10-year zero-coupon bond can be expected to be less than zero.", "explhtml": "<p>If a bond is a zero-coupon bond (or if it has a &quot;very low&quot; coupon), key rate durations for maturity points that are shorter than the maturity of the bond being analyzed are generally negative. For example, the five-year key rate duration for a 10-year zero-coupon bond can be expected to be less than zero.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.6, LOS 25.k<\/div><div class=\"qtext\"><p>If a bond&#x27;s key rate durations for maturity points shorter than the bond&#x27;s maturity are negative, it is most likely that the bond being analyzed is a:<\/p><\/div>", "subj": "fixed"}, {"n": 11, "q": "Which of the following statements is most accurate concerning a convertible bond? A convertible bond's value depends:", "opts": ["only on changes in the market price of the stock.", "on both interest rate changes and changes in the market price of the stock.", "only on interest rate changes."], "ans": "B", "expl": "The value of convertible bond includes the value of a straight bond plus an option giving the bondholder the right to buy the common stock of the issuer. Hence, interest rates affect the bond value and the underlying stock price affects the option value.", "explhtml": "<p>The value of convertible bond includes the value of a straight bond plus an option giving the bondholder the right to buy the common stock of the issuer. Hence, interest rates affect the bond value and the underlying stock price affects the option value.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.8, LOS 25.n<\/div><div class=\"qtext\"><p>Which of the following statements is most accurate concerning a convertible bond? A convertible bond&#x27;s value depends:<\/p><\/div>", "subj": "fixed"}, {"n": 12, "q": "The value of a convertible bond is most likely to be calculated as the value of an equivalent straight bond:", "opts": ["minus the value of a put option on the bond.", "plus the value of a call option on the bond.", "plus the value of a call option on the stock."], "ans": "C", "expl": "A traditional convertible bond can be viewed as a straight bond plus a call option on the issuer's common stock. The value of a convertible bond would be increased by an investor put option, and decreased by an issuer call option.", "explhtml": "<p>A traditional convertible bond can be viewed as a straight bond plus a call option on the issuer&#x27;s common stock. The value of a convertible bond would be increased by an investor put option, and decreased by an issuer call option.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.8, LOS 25.p<\/div><div class=\"qtext\"><p>The value of a convertible bond is most likely to be calculated as the value of an equivalent straight bond:<\/p><\/div>", "subj": "fixed"}, {"n": 13, "q": "For a putable bond, callable bond, or putable/callable bond, the nodal-decision process within the backward induction methodology of the interest rate tree framework requires that at each node the possible values will:", "opts": ["be, in number, two plus the number of embedded options.", "not be higher than the call price or lower than the put price.", "include the face value of the bond."], "ans": "B", "expl": "At each node, there will only be two values. At each node, the analyst must determine if the initially calculated values will be below the put price or above the call price. If a calculated value falls below the put price: Vi,U = the put price. Likewise, if a calculated value falls above the call price, then Vi,L = the call price. Thus the put and call price are lower and upper limits, respectively, of the bond's value at a node.", "explhtml": "<p>At each node, there will only be two values. At each node, the analyst must determine if the initially calculated values will be below the put price or above the call price. If a calculated value falls below the put price: V<sub>i,U<\/sub> = the put price. Likewise, if a calculated value falls above the call price, then V<sub>i,L<\/sub> = the call price. Thus the put and call price are lower and upper limits, respectively, of the bond&#x27;s value at a node.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.2, LOS 25.f<\/div><div class=\"qtext\"><p>For a putable bond, callable bond, or putable/callable bond, the nodal-decision process within the backward induction methodology of the interest rate tree framework requires that at each node the possible values will:<\/p><\/div>", "subj": "fixed"}, {"n": 14, "q": "Bill Moxley, CFA is evaluating three bonds for inclusion in fixed income portfolio for one of his pension fund clients. All three bonds have a coupon rate of 3%, maturity of five years and are generally identical in every respect except that bond A is an option-free bond, bond B is callable in two years and bond C is putable in two years. The yield curve is currently flat. If the yield curve becomes upward sloping, the bond least likely to have the highest price impact would be:", "opts": ["Bond A", "Bond C", "Bond B"], "ans": "B", "expl": "Bond C is putable and hence has limited downside potential when rates rise. The other two bonds do not have any such protection.", "explhtml": "<p>Bond C is putable and hence has limited downside potential when rates rise. The other two bonds do not have any such protection.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.3, LOS 25.e<\/div><div class=\"qtext\"><p>Bill Moxley, CFA is evaluating three bonds for inclusion in fixed income portfolio for one of his pension fund clients. All three bonds have a coupon rate of 3%, maturity of five years and are generally identical in every respect except that bond A is an option-free bond, bond B is callable in two years and bond C is putable in two years. The yield curve is currently flat.<\/p><p>If the yield curve becomes upward sloping, the bond least likely to have the highest price impact would be:<\/p><\/div>", "subj": "fixed"}, {"n": 15, "q": "Bill Moxley, CFA is evaluating three bonds for inclusion in fixed income portfolio for one of his pension fund clients. All three bonds have a coupon rate of 3%, maturity of five years and are generally identical in every respect except that bond A is an option-free bond, bond B is callable in two years and bond C is putable in two years. The yield curve is currently flat. If the yield curve becomes downward sloping, the bond with the highest price impact is least likely to be:", "opts": ["Bond A", "Bond C", "Bond B"], "ans": "C", "expl": "Due to the embedded call option, the upside potential of callable bond B is limited.", "explhtml": "<p>Due to the embedded call option, the upside potential of callable bond B is limited.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.3, LOS 25.e<\/div><div class=\"qtext\"><p>Bill Moxley, CFA is evaluating three bonds for inclusion in fixed income portfolio for one of his pension fund clients. All three bonds have a coupon rate of 3%, maturity of five years and are generally identical in every respect except that bond A is an option-free bond, bond B is callable in two years and bond C is putable in two years. The yield curve is currently flat.<\/p><p>If the yield curve becomes downward sloping, the bond with the highest price impact is least likely to be:<\/p><\/div>", "subj": "fixed"}, {"n": 16, "q": "Johnson asks Wall to compute the value of the call option. Using the given information what is the value of the embedded call option?", "opts": ["$2.04.", "$1.21.", "$0.00."], "ans": "A", "expl": "The call option value is simply the difference between the value of the callable and the non-callable bond. Call Option Value = $100.83 − $98.79 = $2.04", "explhtml": "<p>The call option value is simply the difference between the value of the callable and the non-callable bond.<\/p><p>Call Option Value = $100.83 − $98.79 = $2.04<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 16–19<\/summary><div class=\"vig-body\"><p>Patrick Wall is a new associate at a large international financial institution. Wall has recently completed graduate school with a Master's degree in finance, and is also currently a CFA Level | candidate. His previous work experience includes three years as a credit analyst at a small retail bank. Wall's new position is as the assistant to the firm's fixed income portfolio manager. His boss, Charles Johnson, is responsible for getting Wall familiar with the basics of fixed income investing. Johnson asks Wall to evaluate the bonds shown in Table 1. The bonds are otherwise identical except for the call feature present in one of the bonds. The callable bond is callable at par and exercisable on the coupon dates only.<\/p><p>Table 1: Bond Descriptions<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v005.webp\" style=\"max-width:min(100%,630px)\" alt=\"Callable Bond Non-Callable $98.79 $100.83 Price Time to Maturity (years) 5 5 Time to First Call Date $6.25 $6.25 Annual Coupon Semi-annual Semi-annual Interest Payment Yield to Maturity 6.5366% 6.0547% 428.0360 Price Value per Basis Point\"><\/div><\/details><div class=\"pp-topic\">Module 25.2, LOS 25.f<\/div><div class=\"qtext\"><p>Johnson asks Wall to compute the value of the call option. Using the given information what is the value of the embedded call option?<\/p><\/div>", "subj": "fixed"}, {"n": 17, "q": "Wall is a little confused over the relationship between the embedded option and the callable bond. How does the value of the embedded call option change when interest rate volatility increases? The value:", "opts": ["may increase or decrease.", "increases.", "decreases."], "ans": "B", "expl": "All option values increase when the volatility of the underlying asset increases.", "explhtml": "<p>All option values increase when the volatility of the underlying asset increases.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 16–19<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Patrick Wall is a new associate at a large international financial institution. Wall has recently completed graduate school with a Master's degree in finance, and is also currently a CFA Level | candidate. His previous work experience includes three years as a credit analyst at a small retail bank. Wall's new position is as the assistant to the firm's fixed income portfolio manager. His boss, Charles Johnson, is responsible for getting Wall familiar with the basics of fixed income investing. Johnson asks Wall to evaluate the bonds shown in Table 1. The bonds are otherwise identical except for the call feature present in one of the bonds. The callable bond is callable at par and exercisable on the coupon dates only.<\/p><p>Table 1: Bond Descriptions<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v005.webp\" style=\"max-width:min(100%,630px)\" alt=\"Callable Bond Non-Callable $98.79 $100.83 Price Time to Maturity (years) 5 5 Time to First Call Date $6.25 $6.25 Annual Coupon Semi-annual Semi-annual Interest Payment Yield to Maturity 6.5366% 6.0547% 428.0360 Price Value per Basis Point\"><\/div><\/details><div class=\"pp-topic\">Module 25.2, LOS 25.f<\/div><div class=\"qtext\"><p>Wall is a little confused over the relationship between the embedded option and the callable bond. How does the value of the embedded call option change when interest rate volatility increases? The value:<\/p><\/div>", "subj": "fixed"}, {"n": 18, "q": "Wall wonders how the value of the callable bond changes when interest rate volatility increases. How will an increase in volatility affect the value of the callable bond? The value:", "opts": ["may increase or decrease.", "increases.", "decreases."], "ans": "C", "expl": "The value of the callable bond decreases if the interest rate volatility increases because the value of the embedded call option increases. Since the value of the callable bond is the difference between the value of the non-callable bond and the value of the embedded call option, its value has to decrease.", "explhtml": "<p>The value of the callable bond decreases if the interest rate volatility increases because the value of the embedded call option increases. Since the value of the callable bond is the difference between the value of the non-callable bond and the value of the embedded call option, its value has to decrease.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 16–19<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Patrick Wall is a new associate at a large international financial institution. Wall has recently completed graduate school with a Master's degree in finance, and is also currently a CFA Level | candidate. His previous work experience includes three years as a credit analyst at a small retail bank. Wall's new position is as the assistant to the firm's fixed income portfolio manager. His boss, Charles Johnson, is responsible for getting Wall familiar with the basics of fixed income investing. Johnson asks Wall to evaluate the bonds shown in Table 1. The bonds are otherwise identical except for the call feature present in one of the bonds. The callable bond is callable at par and exercisable on the coupon dates only.<\/p><p>Table 1: Bond Descriptions<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v005.webp\" style=\"max-width:min(100%,630px)\" alt=\"Callable Bond Non-Callable $98.79 $100.83 Price Time to Maturity (years) 5 5 Time to First Call Date $6.25 $6.25 Annual Coupon Semi-annual Semi-annual Interest Payment Yield to Maturity 6.5366% 6.0547% 428.0360 Price Value per Basis Point\"><\/div><\/details><div class=\"pp-topic\">Module 25.2, LOS 25.f<\/div><div class=\"qtext\"><p>Wall wonders how the value of the callable bond changes when interest rate volatility increases. How will an increase in volatility affect the value of the callable bond? The value:<\/p><\/div>", "subj": "fixed"}, {"n": 19, "q": "Wall now turns his attention to the value of the embedded call option. How does the value of the embedded call option react to an increase in interest rates? The value of the embedded call is most likely to:", "opts": ["decrease.", "remain the same.", "increase."], "ans": "A", "expl": "There are two different effects that an increase in interest rate will cause in this situation. The first (and primary) impact stems from the relationship between interest rates and bond values: when interest rates increase, bond values decrease. Since the underlying asset to the option (the bond) decreases in value, the option will decrease in value also. The second (and much smaller) effect stems from the fact that when interest rates are higher, call option prices are generally higher because holding a call (rather than the underlying) is more attractive when interest rates are high. However, this secondary effect is likely to be smaller than the impact of the change in bond value.", "explhtml": "<p>There are two different effects that an increase in interest rate will cause in this situation. The first (and primary) impact stems from the relationship between interest rates and bond values: when interest rates increase, bond values decrease. Since the underlying asset to the option (the bond) decreases in value, the option will decrease in value also. The second (and much smaller) effect stems from the fact that when interest rates are higher, call option prices are generally higher because holding a call (rather than the underlying) is more attractive when interest rates are high. However, this secondary effect is likely to be smaller than the impact of the change in bond value.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 16–19<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Patrick Wall is a new associate at a large international financial institution. Wall has recently completed graduate school with a Master's degree in finance, and is also currently a CFA Level | candidate. His previous work experience includes three years as a credit analyst at a small retail bank. Wall's new position is as the assistant to the firm's fixed income portfolio manager. His boss, Charles Johnson, is responsible for getting Wall familiar with the basics of fixed income investing. Johnson asks Wall to evaluate the bonds shown in Table 1. The bonds are otherwise identical except for the call feature present in one of the bonds. The callable bond is callable at par and exercisable on the coupon dates only.<\/p><p>Table 1: Bond Descriptions<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v005.webp\" style=\"max-width:min(100%,630px)\" alt=\"Callable Bond Non-Callable $98.79 $100.83 Price Time to Maturity (years) 5 5 Time to First Call Date $6.25 $6.25 Annual Coupon Semi-annual Semi-annual Interest Payment Yield to Maturity 6.5366% 6.0547% 428.0360 Price Value per Basis Point\"><\/div><\/details><div class=\"pp-topic\">Module 25.2, LOS 25.f<\/div><div class=\"qtext\"><p>Wall now turns his attention to the value of the embedded call option. How does the value of the embedded call option react to an increase in interest rates? The value of the embedded call is most likely to:<\/p><\/div>", "subj": "fixed"}, {"n": 20, "q": "How do the risk-return characteristics of a newly issued convertible bond compare with the risk-return characteristics of ownership of the underlying common stock? The convertible bond has:", "opts": ["lower risk and lower return potential.", "lower risk and higher return potential.", "higher risk and higher return potential."], "ans": "A", "expl": "Buying convertible bonds in lieu of direct stock investing limits downside risk due to the price floor set by the straight bond value. The cost of the risk protection is the reduced upside potential due to the conversion premium.", "explhtml": "<p>Buying convertible bonds in lieu of direct stock investing limits downside risk due to the price floor set by the straight bond value. The cost of the risk protection is the reduced upside potential due to the conversion premium.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.8, LOS 25.q<\/div><div class=\"qtext\"><p>How do the risk-return characteristics of a newly issued convertible bond compare with the risk-return characteristics of ownership of the underlying common stock? The convertible bond has:<\/p><\/div>", "subj": "fixed"}, {"n": 21, "q": "For a convertible bond, which of the following is least accurate?", "opts": ["A convertible bond may be putable.", "The conversion ratio times the price per share of common stock is a lower limit on the bond's price.", "The issuer can decide when to convert the bonds to stock."], "ans": "C", "expl": "All of these are true except the possibility of the issuer to force conversion. The bondholder has the option to convert.", "explhtml": "<p>All of these are true except the possibility of the issuer to force conversion. The bondholder has the option to convert.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.8, LOS 25.n<\/div><div class=\"qtext\"><p>For a convertible bond, which of the following is least accurate?<\/p><\/div>", "subj": "fixed"}, {"n": 22, "q": "Sharon Rogner, CFA is evaluating three bonds for inclusion in fixed income portfolio for one of her pension fund clients. All three bonds have a coupon rate of 3%, maturity of five years and are generally identical in every respect except that bond A is an option-free bond, bond B is callable in two years and bond C is putable in two years. Rogner computes the OAS of bond A to be 50bps using a binomial tree with an assumed interest rate volatility of 15%. If Rogner revises her estimate of interest rate volatility to 10%, the computed OAS of Bond C would most likely be:", "opts": ["lower than 50bps.", "higher than 50bps.", "equal to 50bps."], "ans": "A", "expl": "The OAS of the three bonds should be same as they are given to be identical bonds except for the embedded options (OAS is after removing the option feature and hence would not be affected by embedded options). Hence the OAS of bond C would be 50 bps absent any changes in assumed level of volatility. When the assumed level of volatility in the tree is decreased, the value of the embedded put option would decrease and the computed value of the putable bond would also decrease. The constant spread that is now needed to force the computed value to be equal to the market price is therefore lower than before. Hence a decrease in the volatility estimate reduces the computed OAS for a putable bond.", "explhtml": "<p>The OAS of the three bonds should be same as they are given to be identical bonds except for the embedded options (OAS is after removing the option feature and hence would not be affected by embedded options). Hence the OAS of bond C would be 50 bps absent any changes in assumed level of volatility. When the assumed level of volatility in the tree is decreased, the value of the embedded put option would decrease and the computed value of the putable bond would also decrease. The constant spread that is now needed to force the computed value to be equal to the market price is therefore lower than before. Hence a decrease in the volatility estimate reduces the computed OAS for a putable bond.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.4, LOS 25.h<\/div><div class=\"qtext\"><p>Sharon Rogner, CFA is evaluating three bonds for inclusion in fixed income portfolio for one of her pension fund clients. All three bonds have a coupon rate of 3%, maturity of five years and are generally identical in every respect except that bond A is an option-free bond, bond B is callable in two years and bond C is putable in two years. Rogner computes the OAS of bond A to be 50bps using a binomial tree with an assumed interest rate volatility of 15%.<\/p><p>If Rogner revises her estimate of interest rate volatility to 10%, the computed OAS of Bond C would most likely be:<\/p><\/div>", "subj": "fixed"}, {"n": 23, "q": "Compute V1L, the value of the bond at node 1L.", "opts": ["$103.58.", "$101.05.", "$95.99."], "ans": "A", "expl": "V1L = (½)[(V2LU + C) / (1 + r1L)] + [(V2,LL + C) / (1 + r1L)] V1L = (½)[(99.455 + 8) / (1 + 0.05331)] + [(102.755 + 8) / (1 + 0.05331)] = $103.583", "explhtml": "<p>V<sub>1L<\/sub> = (½)[(V<sub>2LU<\/sub> + C) / (1 + r<sub>1L<\/sub>)] + [(V<sub>2,LL<\/sub> + C) / (1 + r<sub>1L<\/sub>)]<\/p><p>V<sub>1L<\/sub> = (½)[(99.455 + 8) / (1 + 0.05331)] + [(102.755 + 8) / (1 + 0.05331)] = $103.583<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 23–26<\/summary><div class=\"vig-body\"><p>Dawn Adams, CFA, along with her recently hired staff, have responsibilities that require them to be familiar with backward induction methodology as it is used with a binomial valuation model. Adams, however, is concerned that some of her staff, particularly those not enrolled in the CFA program, are a little weak in this area. To assess their understanding of the binomial model and its uses, Adams presented her staff with the first two years of the binomial interest rate tree for an 8% annually compounded bond (shown below). The forward rates and the corresponding values shown in this tree are based on an assumed interest rate volatility of 20%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v006.webp\" style=\"max-width:min(100%,396px)\" alt=\"2-Period Binomial Interest Rate Tree for an 8% Annually Compunded Bond (Assumption: 20% Volatility) Vyuu = 98.565 C= 8 2,UU Viu г. • 7.9529% Vau = 99.455 V.= C = 8 2,UL г, = 4.3912% VL= C=8 г. = 5.3310% VaL= 102.755 2,LL C= 8 Period O Periad 1 Period 2\"><p>A member of Adams' staff has been asked to respond to the following:<\/p><\/div><\/details><div class=\"pp-topic\">Module 25.2, LOS 25.f<\/div><div class=\"qtext\"><p>Compute V<sub>1L<\/sub>, the value of the bond at node 1L.<\/p><\/div>", "subj": "fixed"}, {"n": 24, "q": "Compute V₀, the value of the bond at node 0.", "opts": ["$101.35.", "$99.07.", "$104.76."], "ans": "C", "expl": "V₀ = (½)[(V1U + C) / (1 + r₀)] + [(V1L + C) / (1 + r₀)] From the previous question the value for V1U was determined to be $99.127 V₀ = (½)[(99.127 + 8) / (1 + 0.043912)] + [(103.583 + 8)/(1 + 0.043912)] = $104.755", "explhtml": "<p>V<sub>0<\/sub> = (½)[(V<sub>1U<\/sub> + C) / (1 + r<sub>0<\/sub>)] + [(V<sub>1L<\/sub> + C) / (1 + r<sub>0<\/sub>)]<\/p><p>From the previous question the value for V<sub>1U<\/sub> was determined to be $99.127<\/p><p>V<sub>0<\/sub> = (½)[(99.127 + 8) / (1 + 0.043912)] + [(103.583 + 8)/(1 + 0.043912)] = $104.755<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 23–26<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dawn Adams, CFA, along with her recently hired staff, have responsibilities that require them to be familiar with backward induction methodology as it is used with a binomial valuation model. Adams, however, is concerned that some of her staff, particularly those not enrolled in the CFA program, are a little weak in this area. To assess their understanding of the binomial model and its uses, Adams presented her staff with the first two years of the binomial interest rate tree for an 8% annually compounded bond (shown below). The forward rates and the corresponding values shown in this tree are based on an assumed interest rate volatility of 20%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v006.webp\" style=\"max-width:min(100%,396px)\" alt=\"2-Period Binomial Interest Rate Tree for an 8% Annually Compunded Bond (Assumption: 20% Volatility) Vyuu = 98.565 C= 8 2,UU Viu г. • 7.9529% Vau = 99.455 V.= C = 8 2,UL г, = 4.3912% VL= C=8 г. = 5.3310% VaL= 102.755 2,LL C= 8 Period O Periad 1 Period 2\"><p>A member of Adams' staff has been asked to respond to the following:<\/p><\/div><\/details><div class=\"pp-topic\">Module 25.2, LOS 25.f<\/div><div class=\"qtext\"><p>Compute V<sub>0<\/sub>, the value of the bond at node 0.<\/p><\/div>", "subj": "fixed"}, {"n": 25, "q": "Assume that the bond is putable in one year at par ($100) and that the put will be exercised if the computed value is less than par. What is the value of the putable bond?", "opts": ["$105.17.", "$95.38.", "$103.04."], "ans": "A", "expl": "The relevant value to be discounted using a binomial model and backward induction methodology for a putable bond is the value that will be received if the put option is exercised or the computed value, whichever is greater. In this case, the relevant value at node 1U is the exercise price ($100.000) since it is greater than the computed value of $99.127. At node 1L, the computed value of $103.583 must be used. Therefore, the value of the putable bond is: V₀ = (½)[(100.00 + 8) / (1 + 0.043912)] + [(103.583 + 8) / (1 + 0.043912)] = $105.17314", "explhtml": "<p>The relevant value to be discounted using a binomial model and backward induction methodology for a putable bond is the value that will be received if the put option is exercised or the computed value, whichever is greater. In this case, the relevant value at node 1U is the exercise price ($100.000) since it is greater than the computed value of $99.127. At node 1L, the computed value of $103.583 must be used. Therefore, the value of the putable bond is:<\/p><p>V<sub>0<\/sub> = (½)[(100.00 + 8) / (1 + 0.043912)] + [(103.583 + 8) / (1 + 0.043912)] = $105.17314<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 23–26<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dawn Adams, CFA, along with her recently hired staff, have responsibilities that require them to be familiar with backward induction methodology as it is used with a binomial valuation model. Adams, however, is concerned that some of her staff, particularly those not enrolled in the CFA program, are a little weak in this area. To assess their understanding of the binomial model and its uses, Adams presented her staff with the first two years of the binomial interest rate tree for an 8% annually compounded bond (shown below). The forward rates and the corresponding values shown in this tree are based on an assumed interest rate volatility of 20%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v006.webp\" style=\"max-width:min(100%,396px)\" alt=\"2-Period Binomial Interest Rate Tree for an 8% Annually Compunded Bond (Assumption: 20% Volatility) Vyuu = 98.565 C= 8 2,UU Viu г. • 7.9529% Vau = 99.455 V.= C = 8 2,UL г, = 4.3912% VL= C=8 г. = 5.3310% VaL= 102.755 2,LL C= 8 Period O Periad 1 Period 2\"><p>A member of Adams' staff has been asked to respond to the following:<\/p><\/div><\/details><div class=\"pp-topic\">Module 25.2, LOS 25.f<\/div><div class=\"qtext\"><p>Assume that the bond is putable in one year at par ($100) and that the put will be exercised if the computed value is less than par. What is the value of the putable bond?<\/p><\/div>", "subj": "fixed"}, {"n": 26, "q": "Assume that the bond is putable in one year at par ($100) and that the put will be exercised if the computed value is less than par. What is the value of the put option?", "opts": ["$1.86.", "$0.42.", "$3.70."], "ans": "B", "expl": "Vputable = Vnonputable + Vput Rearranging, the value of the put can be stated as: Vput = Vputable − Vnonputable Vputable was computed to be $105.173 in the previous question, and Vnonputable was determined to be $104.755 in the question prior to that. So the value of the embedded put option for the bond under analysis is: $105.173 − 104.755 = $0.418", "explhtml": "<p>Vputable = Vnonputable + Vput<\/p><p>Rearranging, the value of the put can be stated as:<\/p><p>Vput = Vputable − Vnonputable<\/p><p>V<sub>putable<\/sub> was computed to be $105.173 in the previous question, and V<sub>nonputable<\/sub> was determined to be $104.755 in the question prior to that. So the value of the embedded put option for the bond under analysis is:<\/p><p>$105.173 − 104.755 = $0.418<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 23–26<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dawn Adams, CFA, along with her recently hired staff, have responsibilities that require them to be familiar with backward induction methodology as it is used with a binomial valuation model. Adams, however, is concerned that some of her staff, particularly those not enrolled in the CFA program, are a little weak in this area. To assess their understanding of the binomial model and its uses, Adams presented her staff with the first two years of the binomial interest rate tree for an 8% annually compounded bond (shown below). The forward rates and the corresponding values shown in this tree are based on an assumed interest rate volatility of 20%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v006.webp\" style=\"max-width:min(100%,396px)\" alt=\"2-Period Binomial Interest Rate Tree for an 8% Annually Compunded Bond (Assumption: 20% Volatility) Vyuu = 98.565 C= 8 2,UU Viu г. • 7.9529% Vau = 99.455 V.= C = 8 2,UL г, = 4.3912% VL= C=8 г. = 5.3310% VaL= 102.755 2,LL C= 8 Period O Periad 1 Period 2\"><p>A member of Adams' staff has been asked to respond to the following:<\/p><\/div><\/details><div class=\"pp-topic\">Module 25.2, LOS 25.f<\/div><div class=\"qtext\"><p>Assume that the bond is putable in one year at par ($100) and that the put will be exercised if the computed value is less than par. What is the value of the put option?<\/p><\/div>", "subj": "fixed"}, {"n": 27, "q": "A convertible bond has a conversion ratio of 12 and a straight value of $1,010. The market value of the bond is $1,055, and the market value of the stock is $75. What is the market conversion price and premium over straight value of the bond? Market Premium over conversion straight value price", "opts": ["$87.92 0.0446", "$84.17 0.1222", "$75.00 0.1029"], "ans": "A", "expl": "The market conversion price is: (market price of the bond) / (conversion ratio) = $1,055 / 12 = $87.92. The premium over straight price is: (market price of bond) / (straight value) − 1 = ($1,055 / $1,010) − 1 = 0.0446.", "explhtml": "<p>The market conversion price is:<\/p><p>(market price of the bond) / (conversion ratio) = $1,055 / 12 = $87.92.<\/p><p>The premium over straight price is:<\/p><p>(market price of bond) / (straight value) − 1 = ($1,055 / $1,010) − 1 = 0.0446.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.8, LOS 25.o<\/div><div class=\"qtext\"><p>A convertible bond has a conversion ratio of 12 and a straight value of $1,010. The market value of the bond is $1,055, and the market value of the stock is $75. What is the market conversion price and premium over straight value of the bond?<\/p><p>Market<\/p><p>Premium over<\/p><p>conversion<\/p><p>straight value<\/p><p>price<\/p><\/div>", "subj": "fixed"}, {"n": 28, "q": "A callable bond and an option-free bond have the same coupon, maturity and rating. The callable bond currently trades at par value. Which of the following lists correctly orders the values of the indicated items from lowest to highest?", "opts": ["$0, embedded call, callable bond, option-free bond.", "Embedded call, $0, callable bond, option-free bond.", "Embedded call, callable bond, $0, option-free bond."], "ans": "A", "expl": "The embedded call will always have a positive value prior to expiration, and this is especially true if the callable bond trades at par value. Since investors must be compensated for the call feature, the value of the option-free bond must exceed that of a callable bond with the same coupon and maturity and rating.", "explhtml": "<p>The embedded call will always have a positive value prior to expiration, and this is especially true if the callable bond trades at par value. Since investors must be compensated for the call feature, the value of the option-free bond must exceed that of a callable bond with the same coupon and maturity and rating.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.1, LOS 25.b<\/div><div class=\"qtext\"><p>A callable bond and an option-free bond have the same coupon, maturity and rating. The callable bond currently trades at par value. Which of the following lists correctly orders the values of the indicated items from lowest to highest?<\/p><\/div>", "subj": "fixed"}, {"n": 29, "q": "As the volatility of interest rates increases, the value of a putable bond will:", "opts": ["decline.", "rise.", "rise if the interest rate is below the coupon rate, and fall if the interest rate is above the coupon rate."], "ans": "B", "expl": "As volatility increases, so will the option value, which means the value of a putable bond will rise. Remember that with a putable bond, the investor is long the put option.", "explhtml": "<p>As volatility increases, so will the option value, which means the value of a putable bond will rise. Remember that with a putable bond, the investor is long the put option.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.3, LOS 25.d<\/div><div class=\"qtext\"><p>As the volatility of interest rates increases, the value of a putable bond will:<\/p><\/div>", "subj": "fixed"}, {"n": 30, "q": "How is the value of the embedded call option of a callable bond determined? The value of the embedded call option is:", "opts": ["determined using the standard Black-Scholes model.", "the difference between the value of the option-free bond and the callable bond.", "equal to the amount by which the callable bond value exceeds the option-free bond value."], "ans": "B", "expl": "The callable bond is equivalent to the option-free bond except that the issuer has the option to call the bond at the call price before maturity. Therefore, for the holder of the bond, the bond is worth the same as the option-free bond reduced by the value of the option.", "explhtml": "<p>The callable bond is equivalent to the option-free bond except that the issuer has the option to call the bond at the call price before maturity. Therefore, for the holder of the bond, the bond is worth the same as the option-free bond reduced by the value of the option.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.1, LOS 25.b<\/div><div class=\"qtext\"><p>How is the value of the embedded call option of a callable bond determined? The value of the embedded call option is:<\/p><\/div>", "subj": "fixed"}, {"n": 31, "q": "Which of the following scenarios will lead to a convertible bond underperforming the underlying stock? The:", "opts": ["stock price is stable.", "stock price rises.", "stock price falls."], "ans": "B", "expl": "A convertible bond underperforms the underlying common stock when that stock increases in value. This is because of the conversion premium which means that the bond will increase less than the increase in stock price. If the stock price falls, the convertible bond should outperform the stock because of the floor created by the straight-value. If the stock is stable, the bond is likely to outperform the stock because of the higher current yield of the bond. If the bond is upgraded, the bond should increase in value. There is no reason that upgrading the bond should lead to the bond underperforming the stock.", "explhtml": "<p>A convertible bond underperforms the underlying common stock when that stock increases in value. This is because of the conversion premium which means that the bond will increase less than the increase in stock price. If the stock price falls, the convertible bond should outperform the stock because of the floor created by the straight-value. If the stock is stable, the bond is likely to outperform the stock because of the higher current yield of the bond. If the bond is upgraded, the bond should increase in value. There is no reason that upgrading the bond should lead to the bond underperforming the stock.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.8, LOS 25.q<\/div><div class=\"qtext\"><p>Which of the following scenarios will lead to a convertible bond underperforming the underlying stock? The:<\/p><\/div>", "subj": "fixed"}, {"n": 32, "q": "How does the value of a callable bond compare to a noncallable bond? The callable bond value is:", "opts": ["lower.", "higher.", "lower or higher."], "ans": "A", "expl": "Since the issuer has the option to call the bonds before maturity, he is able to call the bonds when their coupon rate is high relative to the market interest rate and obtain cheaper financing through a new bond issue. This, however, is not in the interest of the bond holders who would like to continue receiving the high coupon rates. Therefore, they will only pay a lower price for callable bonds.", "explhtml": "<p>Since the issuer has the option to call the bonds before maturity, he is able to call the bonds when their coupon rate is high relative to the market interest rate and obtain cheaper financing through a new bond issue. This, however, is not in the interest of the bond holders who would like to continue receiving the high coupon rates. Therefore, they will only pay a lower price for callable bonds.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.1, LOS 25.b<\/div><div class=\"qtext\"><p>How does the value of a callable bond compare to a noncallable bond? The callable bond value is:<\/p><\/div>", "subj": "fixed"}, {"n": 33, "q": "What is the value of the capped floater using Nagy's line manager's binomial tree of interest rate expectations?", "opts": ["$98.80.", "$99.26.", "$101.44."], "ans": "A", "expl": "Value at T₂ Upper = $106.5 / 1.09892 = $96.91 (Note coupon capped at $6.50.) Middle = $106 / 1.06 = $100 Lower = $103.639 / 1.03639 = $100 Value at T₁ Upper = ½($103.41 + $106.50) / 1.07704 = $97.45 (Note coupon capped at $6.) Lower = ½($104.63 + $104.63) / 1.04673 = $100 Value at T₀ Price = ½($103.45 + $106) / 1.06 = $98.80", "explhtml": "<p>Value at T<sub>2<\/sub><\/p><p>Upper = $106.5 / 1.09892 = $96.91 (Note coupon capped at $6.50.) Middle = $106 / 1.06 = $100 Lower = $103.639 / 1.03639 = $100 Value at T<sub>1<\/sub><\/p><p>Upper = ½($103.41 + $106.50) / 1.07704 = $97.45 (Note coupon capped at $6.) Lower = ½($104.63 + $104.63) / 1.04673 = $100 Value at T<sub>0<\/sub><\/p><p>Price = ½($103.45 + $106) / 1.06 = $98.80<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 33–36<\/summary><div class=\"vig-body\"><p>George Nagy is a fixed income manager with Luna Securities. Nagy is analyzing several securities issued by Redna, Inc. First, he is looking at a three-year, annual-pay floating rate note with an embedded cap of 6.5% paying coupons in arrears. Nagy's assistant has provided him with the binomial interest rate tree below (computed with assumed volatility of 25%) to aid in her analysis.<\/p><img
