 class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v007.webp\" style=\"max-width:min(100%,663px)\" alt=\"To T2 T1 9.892% 7.704% 6% 6% 4.673% 3.639%\"><p>A three-year, Redna, Inc., callable bond is currently trading at a price of $102. An otherwise identical straight bond is also trading.<\/p><p>Nagy obtains the report of the firm's chief economist indicating that rates are trending lower.<\/p><\/div><\/details><div class=\"pp-topic\">Module 25.7, LOS 25.m<\/div><div class=\"qtext\"><p>What is the value of the capped floater using Nagy&#x27;s line manager&#x27;s binomial tree of interest rate expectations?<\/p><\/div>", "subj": "fixed"}, {"n": 34, "q": "Which of the following statements is/are correct? The straight bond should trade for less than $102. Statement I: Statement  If interest rate volatility were to increase then the price differential between the two | II:  Redna bonds would widen.", "opts": ["Both statements are correct.", "Statement I is correct but Statement II is incorrect.", "Statement I is incorrect but Statement II is correct."], "ans": "C", "expl": "The straight bond will be priced higher, as the investor will not have the risk of the bond being called. If interest rate volatility rises then the call option will become more valuable, and the price differential will widen.", "explhtml": "<p>The straight bond will be priced higher, as the investor will not have the risk of the bond being called. If interest rate volatility rises then the call option will become more valuable, and the price differential will widen.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 33–36<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>George Nagy is a fixed income manager with Luna Securities. Nagy is analyzing several securities issued by Redna, Inc. First, he is looking at a three-year, annual-pay floating rate note with an embedded cap of 6.5% paying coupons in arrears. Nagy's assistant has provided him with the binomial interest rate tree below (computed with assumed volatility of 25%) to aid in her analysis.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v007.webp\" style=\"max-width:min(100%,663px)\" alt=\"To T2 T1 9.892% 7.704% 6% 6% 4.673% 3.639%\"><p>A three-year, Redna, Inc., callable bond is currently trading at a price of $102. An otherwise identical straight bond is also trading.<\/p><p>Nagy obtains the report of the firm's chief economist indicating that rates are trending lower.<\/p><\/div><\/details><div class=\"pp-topic\">Module 25.1, LOS 25.b<\/div><div class=\"qtext\"><p>Which of the following statements is/are correct?<\/p><p>The straight bond should trade for less than $102.<\/p><p>Statement I:<\/p><div class=\"tbl\"><table><tr><td>Statement<\/td><td>If interest rate volatility were to increase then the price differential between the two<\/td><\/tr><tr><td>II:<\/td><td>Redna bonds would widen.<\/td><\/tr><\/table><\/div><\/div>", "subj": "fixed"}, {"n": 35, "q": "Suppose Redna were to issue a bond that was identical in all respects to the existing callable bond except that instead it was putable. How would a binomial tree valuation be adapted?", "opts": ["The put option becomes an effective floor price at each applicable node, instead of the call’s effective ceiling price.", "The put option becomes an effective floor price at each applicable node, as well as the call’s effective ceiling price.", "The put option becomes an effective ceiling price at each applicable node."], "ans": "A", "expl": "A put option is an effective floor at each node. Call feature would no longer be relevant.", "explhtml": "<p>A put option is an effective floor at each node. Call feature would no longer be relevant.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 33–36<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>George Nagy is a fixed income manager with Luna Securities. Nagy is analyzing several securities issued by Redna, Inc. First, he is looking at a three-year, annual-pay floating rate note with an embedded cap of 6.5% paying coupons in arrears. Nagy's assistant has provided him with the binomial interest rate tree below (computed with assumed volatility of 25%) to aid in her analysis.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v007.webp\" style=\"max-width:min(100%,663px)\" alt=\"To T2 T1 9.892% 7.704% 6% 6% 4.673% 3.639%\"><p>A three-year, Redna, Inc., callable bond is currently trading at a price of $102. An otherwise identical straight bond is also trading.<\/p><p>Nagy obtains the report of the firm's chief economist indicating that rates are trending lower.<\/p><\/div><\/details><div class=\"pp-topic\">Module 25.2, LOS 25.f<\/div><div class=\"qtext\"><p>Suppose Redna were to issue a bond that was identical in all respects to the existing callable bond except that instead it was putable. How would a binomial tree valuation be adapted?<\/p><\/div>", "subj": "fixed"}, {"n": 36, "q": "Using the report of the economist, which of the following order of effective durations (highest to lowest) of otherwise identical bonds is most accurate:", "opts": ["callable, putable, straight.", "straight, callable, putable.", "straight, putable, callable."], "ans": "C", "expl": "Since the rates are trending lower, the call option is likely to be exercised while the put will not. Therefore the effective duration of callable < effective duration of putable. Otherwise identical straight bonds will always have a higher (or same) effective durations than either callables or putables.", "explhtml": "<p>Since the rates are trending lower, the call option is likely to be exercised while the put will not. Therefore the effective duration of callable &lt; effective duration of putable. Otherwise identical straight bonds will always have a higher (or same) effective durations than either callables or putables.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 33–36<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>George Nagy is a fixed income manager with Luna Securities. Nagy is analyzing several securities issued by Redna, Inc. First, he is looking at a three-year, annual-pay floating rate note with an embedded cap of 6.5% paying coupons in arrears. Nagy's assistant has provided him with the binomial interest rate tree below (computed with assumed volatility of 25%) to aid in her analysis.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v007.webp\" style=\"max-width:min(100%,663px)\" alt=\"To T2 T1 9.892% 7.704% 6% 6% 4.673% 3.639%\"><p>A three-year, Redna, Inc., callable bond is currently trading at a price of $102. An otherwise identical straight bond is also trading.<\/p><p>Nagy obtains the report of the firm's chief economist indicating that rates are trending lower.<\/p><\/div><\/details><div class=\"pp-topic\">Module 25.5, LOS 25.j<\/div><div class=\"qtext\"><p>Using the report of the economist, which of the following order of effective durations (highest to lowest) of otherwise identical bonds is most accurate:<\/p><\/div>", "subj": "fixed"}, {"n": 37, "q": "Which of the following is the appropriate \"nodal decision\" within the backward induction methodology of the interest tree framework for a putable bond?", "opts": ["Max(put price, discounted value).", "Max(par value, discounted value).", "Min(put value, discounted value)."], "ans": "A", "expl": "When valuing a putable bond using the backward induction methodology, the relevant cash flow to use at each nodal period is the coupon to be received during that nodal period plus the computed value or exercise price, whichever is greater.", "explhtml": "<p>When valuing a putable bond using the backward induction methodology, the relevant cash flow to use at each nodal period is the coupon to be received during that nodal period plus the computed value or exercise price, whichever is greater.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.2, LOS 25.f<\/div><div class=\"qtext\"><p>Which of the following is the appropriate &quot;nodal decision&quot; within the backward induction methodology of the interest tree framework for a putable bond?<\/p><\/div>", "subj": "fixed"}, {"n": 38, "q": "Sharon Rogner, CFA is evaluating three bonds for inclusion in fixed income portfolio for one of her pension fund clients. All three bonds have a coupon rate of 3%, maturity of five years and are generally identical in every respect except that bond A is an option-free bond, bond B is callable in two years and bond C is putable in two years. Rogner computes the OAS of bond A to be 50bps using a binomial tree with an assumed interest rate volatility of 15%. If Rogner revises her estimate of interest rate volatility to 20%, the computed OAS of Bond B would most likely be:", "opts": ["lower than 50bps.", "higher than 50bps.", "equal to 50bps."], "ans": "A", "expl": "The OAS of the three bonds should be same as they are given to be identical bonds except for the embedded options (OAS is after removing the option feature and hence would not be affected by embedded options). Hence the OAS of bond B would be 50 bps absent any changes in assumed level of volatility. When the assumed level of volatility in the tree is increased, the value of the embedded call option would increase and the computed value of the callable bond would decrease. The constant spread now needed to force the computed value to be equal to the market price is therefore lower than before. Hence an increase in volatility estimate reduces the computed OAS for a callable bond.", "explhtml": "<p>The OAS of the three bonds should be same as they are given to be identical bonds except for the embedded options (OAS is after removing the option feature and hence would not be affected by embedded options). Hence the OAS of bond B would be 50 bps absent any changes in assumed level of volatility. When the assumed level of volatility in the tree is increased, the value of the embedded call option would increase and the computed value of the callable bond would decrease. The constant spread now needed to force the computed value to be equal to the market price is therefore lower than before. Hence an increase in volatility estimate reduces the computed OAS for a callable bond.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.4, LOS 25.h<\/div><div class=\"qtext\"><p>Sharon Rogner, CFA is evaluating three bonds for inclusion in fixed income portfolio for one of her pension fund clients. All three bonds have a coupon rate of 3%, maturity of five years and are generally identical in every respect except that bond A is an option-free bond, bond B is callable in two years and bond C is putable in two years. Rogner computes the OAS of bond A to be 50bps using a binomial tree with an assumed interest rate volatility of 15%.<\/p><p>If Rogner revises her estimate of interest rate volatility to 20%, the computed OAS of Bond B would most likely be:<\/p><\/div>", "subj": "fixed"}, {"n": 39, "q": "Which of the following is the appropriate \"nodal decision\" within the backward induction methodology of the interest tree framework for a callable bond?", "opts": ["Min(par value, discounted value).", "Min(call price, discounted value).", "Max(call price, discounted value)."], "ans": "B", "expl": "When valuing a callable bond using the backward induction methodology, the relevant cash flow to use at each nodal period is the coupon to be received during that nodal period plus the computed value or the call price, whichever is less.", "explhtml": "<p>When valuing a callable bond using the backward induction methodology, the relevant cash flow to use at each nodal period is the coupon to be received during that nodal period plus the computed value or the call price, whichever is less.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.2, LOS 25.f<\/div><div class=\"qtext\"><p>Which of the following is the appropriate &quot;nodal decision&quot; within the backward induction methodology of the interest tree framework for a callable bond?<\/p><\/div>", "subj": "fixed"}, {"n": 40, "q": "How many of Inka's opening statements are correct?", "opts": ["Two.", "One.", "Three."], "ans": "A", "expl": "Statement 1 is true. The value of a callable bond = value of an identical straight bond – value of embedded call. The value of embedded options, (both call and put) will increase in times of higher expected interest rate volatility. Therefore, the value of a callable bond will fall when rate volatility rises. Statement 2 is false. The Z-spread on a callable bond will be affected by credit risk and liquidity risk, relative to benchmark bonds used to calculate the spot rates. Z-spreads are also affected by embedded options. Embedded call (put) option increases (decreases) the Z-spread. The option adjusted spread (AOS) removes the uncertainty of the embedded option feature by modelling the impact on the bonds cash flows. Instead of the Z-spread, a constant OAS should be added to each spot and expected future 1-period rates in a binomial tree such that the backwardly induced price converges with market price. The OAS reflects credit and liquidity risk relative to the benchmark securities only. Statement 3 is true. Callable bonds exhibit negative convexity when yields fall to low levels. This is due to the price compression the bond experiences relative to a straight bond as the option moves towards the money.", "explhtml": "<p>Statement 1 is true. The value of a callable bond = value of an identical straight bond – value of embedded call. The value of embedded options, (both call and put) will increase in times of higher expected interest rate volatility. Therefore, the value of a callable bond will fall when rate volatility rises. Statement 2 is false. The Z-spread on a callable bond will be affected by credit risk and liquidity risk, relative to benchmark bonds used to calculate the spot rates. Z-spreads are also affected by embedded options. Embedded call (put) option increases (decreases) the Z-spread. The option adjusted spread (AOS) removes the uncertainty of the embedded option feature by modelling the impact on the bonds cash flows. Instead of the Z-spread, a constant OAS should be added to each spot and expected future 1-period rates in a binomial tree such that the backwardly induced price converges with market price. The OAS reflects credit and liquidity risk relative to the benchmark securities only. Statement 3 is true. Callable bonds exhibit negative convexity when yields fall to low levels. This is due to the price compression the bond experiences relative to a straight bond as the option moves towards the money.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 40–43<\/summary><div class=\"vig-body\"><p>Kate Inka is a new hire for Maya Incorporated, a fixed income fund manager. On her first week on the job, she is asked to prepare a presentation on valuation and analysis of bonds with embedded options.<\/p><p>Inka starts her presentation with the following three statements:<\/p><p>Statement<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v008.webp\" style=\"max-width:min(100%,616px)\" alt=\"&quot;In times of increased expectations of interest rate volatility the value of callable bonds will fall.&quot;\"><p>Statement \"When trying to analyze the return for credit and liquidity risk on a corporate callable<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v009.webp\" style=\"max-width:min(100%,651px)\" alt=\"bond relative to a government bond, the Z-spread must be calculated. The Z-spread 2: can be viewed as the constant spread added to treasury spot rates such that the present value of the callable bonds coupons and principal equate to its market price.&quot;\"><p>Statement \"When analyzing the interest rate risk of a callable bond it is worth keeping in mind<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v010.webp\" style=\"max-width:min(100%,633px)\" alt=\"3: that its effective convexity will be less than or equal to the equivalent option free bond.&quot;\"><p>Inka is anallyzing a three-year, 6% annual coupon, $100 par callable bond. The bond has a European call feature allowing it to be called at 101% of par in two years' time. Inka uses a binomial tree assuming interest rate volatility of 20% as shown in Exhibit 1.<\/p><p>Exhibit 1: Binomial Lattice<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v011.webp\" style=\"max-width:min(100%,143px)\" alt=\"To Tz T1\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v012.webp\" style=\"max-width:min(100%,100px)\" alt=\"6.34% 5.45%\"><p>3%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v013.webp\" style=\"max-width:min(100%,101px)\" alt=\"3.65% 2.85%\"><p>Inka makes the following three comments about her binomial tree exercise:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v014.webp\" style=\"max-width:min(100%,651px)\" alt=\"&quot;If the spot and expected future 1-period rates in the binomial tree have been derived\"><p>Comment<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v015.webp\" style=\"max-width:min(100%,651px)\" alt=\"from treasury securities we should be aware that the backwardly induced value of a corporate bond would be too high relative to its market price.&quot; &quot;For a corporate callable bond, the option adjusted spread must be added as a fixed\"><p>Comment<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v016.webp\" style=\"max-width:min(100%,640px)\" alt=\"margin to all the treasury spot and expected future 1-period rates so that the\"><p>2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v017.webp\" style=\"max-width:min(100%,640px)\" alt=\"backwardly induced price converges with market price.&quot;\"><p>Comment \"If we were to increase our assumption of interest rate volatility used to create the<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v018.webp\" style=\"max-width:min(100%,629px)\" alt=\"binomial tree, the estimated option adjusted spread would be smaller.&quot; 3:\"><p>Finally, Inka makes three comments on her use of effective duration:<\/p><p>Comment \"Given that a corporate callable bond will exhibit negative convexity when yields are<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v019.webp\" style=\"max-width:min(100%,642px)\" alt=\"low, care must be taken when interpreting effective duration, as essentially the computation averages the impact of the up and down shock on bond price. Perhaps the non-symmetrical price reaction to yield increases and decreases would be better captured by looking at one-sided durations.&quot; &quot;Effective duration is an incomplete measure of interest rate risk as it fails to Comment adequately capture option risk. For example, callable bonds are more sensitive to 2: interest rate risk due to embedded options and as such have a higher effective duration.&quot;\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v020.webp\" style=\"max-width:min(100%,640px)\" alt=\"&quot;One method of capturing shaping risk is to compute one-sided durations. A 20-year Comment 3: bond callable after 10 years with a low coupon is likely to have the highest one-sided duration corresponding to the call date. If the coupon is increased the one-sided duration corresponding to the call date declines but the maturity matched 20-year one-sided duration increases.&quot;\"><\/div><\/details><div class=\"pp-topic\">Module 25.6, LOS 25.l<\/div><div class=\"qtext\"><p>How many of Inka&#x27;s opening statements are correct?<\/p><\/div>", "subj": "fixed"}, {"n": 41, "q": "Which value for the backwardly induced price of the corporate callable bond using the binomial tree in Exhibit 1 is most accurate?", "opts": ["$104.89.", "$105.69.", "$105.20."], "ans": "A", "expl": "First compute the missing rate using the relationship: upper rate = lower rate e2 × volatility = 2.85%e2×0.2 = 4.25% Then use backward induction: Value at T2 Upper: 106 / 1.0634 = 99.68. Value at T2 Middle: 106 / 1.0425 = 101.67. Replace with the call price of $101. Value at T2 Lower: 106 / 1.0285 = 103.06. Replace with the call price of $101. Value at T1 Upper: ((99.68 + 101) / 2 + 6) / 1.0545 = 100.84. Bond is not callable at T1. Value at T1 Lower: ((101 + 101) / 2 + 6) / 1.0365 = 103.23. Bond is not callable at T1. Value at T0 ((100.84 + 103.23) / 2 + 6) / 1.03 = $104.89.", "explhtml": "<p>First compute the missing rate using the relationship:<\/p><p>upper rate = lower rate e<sup>2 × volatility<\/sup> = 2.85%e<sup>2×0.2<\/sup> = 4.25%<\/p><p>Then use backward induction:<\/p><p>Value at T2 Upper: 106 / 1.0634 = 99.68. Value at T2 Middle: 106 / 1.0425 = 101.67. Replace with the call price of $101. Value at T2 Lower: 106 / 1.0285 = 103.06. Replace with the call price of $101. Value at T1 Upper: ((99.68 + 101) / 2 + 6) / 1.0545 = 100.84. Bond is not callable at T1. Value at T1 Lower: ((101 + 101) / 2 + 6) / 1.0365 = 103.23. Bond is not callable at T1. Value at T0 ((100.84 + 103.23) / 2 + 6) / 1.03 = $104.89.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 40–43<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Kate Inka is a new hire for Maya Incorporated, a fixed income fund manager. On her first week on the job, she is asked to prepare a presentation on valuation and analysis of bonds with embedded options.<\/p><p>Inka starts her presentation with the following three statements:<\/p><p>Statement<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v008.webp\" style=\"max-width:min(100%,616px)\" alt=\"&quot;In times of increased expectations of interest rate volatility the value of callable bonds will fall.&quot;\"><p>Statement \"When trying to analyze the return for credit and liquidity risk on a corporate callable<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v009.webp\" style=\"max-width:min(100%,651px)\" alt=\"bond relative to a government bond, the Z-spread must be calculated. The Z-spread 2: can be viewed as the constant spread added to treasury spot rates such that the present value of the callable bonds coupons and principal equate to its market price.&quot;\"><p>Statement \"When analyzing the interest rate risk of a callable bond it is worth keeping in mind<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v010.webp\" style=\"max-width:min(100%,633px)\" alt=\"3: that its effective convexity will be less than or equal to the equivalent option free bond.&quot;\"><p>Inka is anallyzing a three-year, 6% annual coupon, $100 par callable bond. The bond has a European call feature allowing it to be called at 101% of par in two years' time. Inka uses a binomial tree assuming interest rate volatility of 20% as shown in Exhibit 1.<\/p><p>Exhibit 1: Binomial Lattice<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v011.webp\" style=\"max-width:min(100%,143px)\" alt=\"To Tz T1\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v012.webp\" style=\"max-width:min(100%,100px)\" alt=\"6.34% 5.45%\"><p>3%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v013.webp\" style=\"max-width:min(100%,101px)\" alt=\"3.65% 2.85%\"><p>Inka makes the following three comments about her binomial tree exercise:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v014.webp\" style=\"max-width:min(100%,651px)\" alt=\"&quot;If the spot and expected future 1-period rates in the binomial tree have been derived\"><p>Comment<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v015.webp\" style=\"max-width:min(100%,651px)\" alt=\"from treasury securities we should be aware that the backwardly induced value of a corporate bond would be too high relative to its market price.&quot; &quot;For a corporate callable bond, the option adjusted spread must be added as a fixed\"><p>Comment<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v016.webp\" style=\"max-width:min(100%,640px)\" alt=\"margin to all the treasury spot and expected future 1-period rates so that the\"><p>2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v017.webp\" style=\"max-width:min(100%,640px)\" alt=\"backwardly induced price converges with market price.&quot;\"><p>Comment \"If we were to increase our assumption of interest rate volatility used to create the<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v018.webp\" style=\"max-width:min(100%,629px)\" alt=\"binomial tree, the estimated option adjusted spread would be smaller.&quot; 3:\"><p>Finally, Inka makes three comments on her use of effective duration:<\/p><p>Comment \"Given that a corporate callable bond will exhibit negative convexity when yields are<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v019.webp\" style=\"max-width:min(100%,642px)\" alt=\"low, care must be taken when interpreting effective duration, as essentially the computation averages the impact of the up and down shock on bond price. Perhaps the non-symmetrical price reaction to yield increases and decreases would be better captured by looking at one-sided durations.&quot; &quot;Effective duration is an incomplete measure of interest rate risk as it fails to Comment adequately capture option risk. For example, callable bonds are more sensitive to 2: interest rate risk due to embedded options and as such have a higher effective duration.&quot;\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v020.webp\" style=\"max-width:min(100%,640px)\" alt=\"&quot;One method of capturing shaping risk is to compute one-sided durations. A 20-year Comment 3: bond callable after 10 years with a low coupon is likely to have the highest one-sided duration corresponding to the call date. If the coupon is increased the one-sided duration corresponding to the call date declines but the maturity matched 20-year one-sided duration increases.&quot;\"><\/div><\/details><div class=\"pp-topic\">Module 25.2, LOS 25.f<\/div><div class=\"qtext\"><p>Which value for the backwardly induced price of the corporate callable bond using the binomial tree in Exhibit 1 is most accurate?<\/p><\/div>", "subj": "fixed"}, {"n": 42, "q": "How many of Inka's comments about her binomial tree exercise are correct?", "opts": ["Three.", "Two.", "One."], "ans": "A", "expl": "Comment 1 is true. A correctly calibrated (to treasury securities) binomial tree will reflect the credit and liquidity risk of treasury securities. Corporate bonds typically will have greater credit and liquidity risk than government securities and as a result, the rates in the tree are too low. Backward induction using the tree would value the corporate bond too high relative to its market price. Comment 2 is true. The option adjusted spread (OAS) is the constant spread when added to the treasury spot and expected future 1-period rates in the tree, will value the callable corporate bonds equal to its market price. Comment 3 is true. If the analyst increases the volatility assumption used to build the tree the spread between lower and upper forward rates will widen. Backwardly inducing the corporate callable bond will now result in a lower value. It is important to note that this is the analyst changing their assumption used to build the tree which will not impact the bond's actual market price. As the backwardly induced value is now lower but the market price remains unchanged, a smaller OAS needs to be added to force the backwardly induced value to be equal to the market price.", "explhtml": "<p>Comment 1 is true. A correctly calibrated (to treasury securities) binomial tree will reflect the credit and liquidity risk of treasury securities. Corporate bonds typically will have greater credit and liquidity risk than government securities and as a result, the rates in the tree are too low. Backward induction using the tree would value the corporate bond too high relative to its market price. Comment 2 is true. The option adjusted spread (OAS) is the constant spread when added to the treasury spot and expected future 1-period rates in the tree, will value the callable corporate bonds equal to its market price. Comment 3 is true. If the analyst increases the volatility assumption used to build the tree the spread between lower and upper forward rates will widen. Backwardly inducing the corporate callable bond will now result in a lower value. It is important to note that this is the analyst changing their assumption used to build the tree which will not impact the bond&#x27;s actual market price. As the backwardly induced value is now lower but the market price remains unchanged, a smaller OAS needs to be added to force the backwardly induced value to be equal to the market price.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 40–43<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Kate Inka is a new hire for Maya Incorporated, a fixed income fund manager. On her first week on the job, she is asked to prepare a presentation on valuation and analysis of bonds with embedded options.<\/p><p>Inka starts her presentation with the following three statements:<\/p><p>Statement<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v008.webp\" style=\"max-width:min(100%,616px)\" alt=\"&quot;In times of increased expectations of interest rate volatility the value of callable bonds will fall.&quot;\"><p>Statement \"When trying to analyze the return for credit and liquidity risk on a corporate callable<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v009.webp\" style=\"max-width:min(100%,651px)\" alt=\"bond relative to a government bond, the Z-spread must be calculated. The Z-spread 2: can be viewed as the constant spread added to treasury spot rates such that the present value of the callable bonds coupons and principal equate to its market price.&quot;\"><p>Statement \"When analyzing the interest rate risk of a callable bond it is worth keeping in mind<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v010.webp\" style=\"max-width:min(100%,633px)\" alt=\"3: that its effective convexity will be less than or equal to the equivalent option free bond.&quot;\"><p>Inka is anallyzing a three-year, 6% annual coupon, $100 par callable bond. The bond has a European call feature allowing it to be called at 101% of par in two years' time. Inka uses a binomial tree assuming interest rate volatility of 20% as shown in Exhibit 1.<\/p><p>Exhibit 1: Binomial Lattice<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v011.webp\" style=\"max-width:min(100%,143px)\" alt=\"To Tz T1\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v012.webp\" style=\"max-width:min(100%,100px)\" alt=\"6.34% 5.45%\"><p>3%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v013.webp\" style=\"max-width:min(100%,101px)\" alt=\"3.65% 2.85%\"><p>Inka makes the following three comments about her binomial tree exercise:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v014.webp\" style=\"max-width:min(100%,651px)\" alt=\"&quot;If the spot and expected future 1-period rates in the binomial tree have been derived\"><p>Comment<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v015.webp\" style=\"max-width:min(100%,651px)\" alt=\"from treasury securities we should be aware that the backwardly induced value of a corporate bond would be too high relative to its market price.&quot; &quot;For a corporate callable bond, the option adjusted spread must be added as a fixed\"><p>Comment<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v016.webp\" style=\"max-width:min(100%,640px)\" alt=\"margin to all the treasury spot and expected future 1-period rates so that the\"><p>2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v017.webp\" style=\"max-width:min(100%,640px)\" alt=\"backwardly induced price converges with market price.&quot;\"><p>Comment \"If we were to increase our assumption of interest rate volatility used to create the<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v018.webp\" style=\"max-width:min(100%,629px)\" alt=\"binomial tree, the estimated option adjusted spread would be smaller.&quot; 3:\"><p>Finally, Inka makes three comments on her use of effective duration:<\/p><p>Comment \"Given that a corporate callable bond will exhibit negative convexity when yields are<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v019.webp\" style=\"max-width:min(100%,642px)\" alt=\"low, care must be taken when interpreting effective duration, as essentially the computation averages the impact of the up and down shock on bond price. Perhaps the non-symmetrical price reaction to yield increases and decreases would be better captured by looking at one-sided durations.&quot; &quot;Effective duration is an incomplete measure of interest rate risk as it fails to Comment adequately capture option risk. For example, callable bonds are more sensitive to 2: interest rate risk due to embedded options and as such have a higher effective duration.&quot;\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v020.webp\" style=\"max-width:min(100%,640px)\" alt=\"&quot;One method of capturing shaping risk is to compute one-sided durations. A 20-year Comment 3: bond callable after 10 years with a low coupon is likely to have the highest one-sided duration corresponding to the call date. If the coupon is increased the one-sided duration corresponding to the call date declines but the maturity matched 20-year one-sided duration increases.&quot;\"><\/div><\/details><div class=\"pp-topic\">Module 25.4, LOS 25.h<\/div><div class=\"qtext\"><p>How many of Inka&#x27;s comments about her binomial tree exercise are correct?<\/p><\/div>", "subj": "fixed"}, {"n": 43, "q": "How many of Inka's comments about duration are accurate?", "opts": ["One.", "Three.", "Two."], "ans": "A", "expl": "Comment 1 is true. Effective duration calculates sensitivity to a 100 basis point change in yield to maturity by taking the arithmetic mean impact of parallel upwards and downwards shift in a bonds yield on price. Even for option free bonds, this linear estimation approach causes estimation error due to the convex nature of bonds. An embedded option causes greater estimation error. A callable bond will react very differently to upwards and downwards shifts in yield due to the option moving towards or away from the money. A solution to this is to analyze sensitivity to upwards and downwards shifts in yield separately by using one-sided durations. Comment 2 is false. Effective duration of a callable bond will be less than (or equal to) an otherwise identical straight bond. Comment 3 is false. Key rate duration measures the sensitivity of a bond's price to a change in a single par rate, holding all other par rates constant. For an option free bond, the highest key rate duration is the maturity-matched key rate. For callable bonds with low coupons, the greatest key rate duration will be the maturity-matched key rate (due to the low probability of the bond being called). As the coupon rate is increased, the probability of the bond being called increases and as a result the key rate duration relating to the call date will increase while the maturity-matched key rate duration will decrease.", "explhtml": "<p>Comment 1 is true. Effective duration calculates sensitivity to a 100 basis point change in yield to maturity by taking the arithmetic mean impact of parallel upwards and downwards shift in a bonds yield on price. Even for option free bonds, this linear estimation approach causes estimation error due to the convex nature of bonds. An embedded option causes greater estimation error. A callable bond will react very differently to upwards and downwards shifts in yield due to the option moving towards or away from the money. A solution to this is to analyze sensitivity to upwards and downwards shifts in yield separately by using one-sided durations. Comment 2 is false. Effective duration of a callable bond will be less than (or equal to) an otherwise identical straight bond. Comment 3 is false. Key rate duration measures the sensitivity of a bond&#x27;s price to a change in a single par rate, holding all other par rates constant. For an option free bond, the highest key rate duration is the maturity-matched key rate. For callable bonds with low coupons, the greatest key rate duration will be the maturity-matched key rate (due to the low probability of the bond being called). As the coupon rate is increased, the probability of the bond being called increases and as a result the key rate duration relating to the call date will increase while the maturity-matched key rate duration will decrease.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 40–43<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Kate Inka is a new hire for Maya Incorporated, a fixed income fund manager. On her first week on the job, she is asked to prepare a presentation on valuation and analysis of bonds with embedded options.<\/p><p>Inka starts her presentation with the following three statements:<\/p><p>Statement<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v008.webp\" style=\"max-width:min(100%,616px)\" alt=\"&quot;In times of increased expectations of interest rate volatility the value of callable bonds will fall.&quot;\"><p>Statement \"When trying to analyze the return for credit and liquidity risk on a corporate callable<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v009.webp\" style=\"max-width:min(100%,651px)\" alt=\"bond relative to a government bond, the Z-spread must be calculated. The Z-spread 2: can be viewed as the constant spread added to treasury spot rates such that the present value of the callable bonds coupons and principal equate to its market price.&quot;\"><p>Statement \"When analyzing the interest rate risk of a callable bond it is worth keeping in mind<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v010.webp\" style=\"max-width:min(100%,633px)\" alt=\"3: that its effective convexity will be less than or equal to the equivalent option free bond.&quot;\"><p>Inka is anallyzing a three-year, 6% annual coupon, $100 par callable bond. The bond has a European call feature allowing it to be called at 101% of par in two years' time. Inka uses a binomial tree assuming interest rate volatility of 20% as shown in Exhibit 1.<\/p><p>Exhibit 1: Binomial Lattice<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v011.webp\" style=\"max-width:min(100%,143px)\" alt=\"To Tz T1\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v012.webp\" style=\"max-width:min(100%,100px)\" alt=\"6.34% 5.45%\"><p>3%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v013.webp\" style=\"max-width:min(100%,101px)\" alt=\"3.65% 2.85%\"><p>Inka makes the following three comments about her binomial tree exercise:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v014.webp\" style=\"max-width:min(100%,651px)\" alt=\"&quot;If the spot and expected future 1-period rates in the binomial tree have been derived\"><p>Comment<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v015.webp\" style=\"max-width:min(100%,651px)\" alt=\"from treasury securities we should be aware that the backwardly induced value of a corporate bond would be too high relative to its market price.&quot; &quot;For a corporate callable bond, the option adjusted spread must be added as a fixed\"><p>Comment<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v016.webp\" style=\"max-width:min(100%,640px)\" alt=\"margin to all the treasury spot and expected future 1-period rates so that the\"><p>2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v017.webp\" style=\"max-width:min(100%,640px)\" alt=\"backwardly induced price converges with market price.&quot;\"><p>Comment \"If we were to increase our assumption of interest rate volatility used to create the<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v018.webp\" style=\"max-width:min(100%,629px)\" alt=\"binomial tree, the estimated option adjusted spread would be smaller.&quot; 3:\"><p>Finally, Inka makes three comments on her use of effective duration:<\/p><p>Comment \"Given that a corporate callable bond will exhibit negative convexity when yields are<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v019.webp\" style=\"max-width:min(100%,642px)\" alt=\"low, care must be taken when interpreting effective duration, as essentially the computation averages the impact of the up and down shock on bond price. Perhaps the non-symmetrical price reaction to yield increases and decreases would be better captured by looking at one-sided durations.&quot; &quot;Effective duration is an incomplete measure of interest rate risk as it fails to Comment adequately capture option risk. For example, callable bonds are more sensitive to 2: interest rate risk due to embedded options and as such have a higher effective duration.&quot;\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v020.webp\" style=\"max-width:min(100%,640px)\" alt=\"&quot;One method of capturing shaping risk is to compute one-sided durations. A 20-year Comment 3: bond callable after 10 years with a low coupon is likely to have the highest one-sided duration corresponding to the call date. If the coupon is increased the one-sided duration corresponding to the call date declines but the maturity matched 20-year one-sided duration increases.&quot;\"><\/div><\/details><div class=\"pp-topic\">Module 25.6, LOS 25.k<\/div><div class=\"qtext\"><p>How many of Inka&#x27;s comments about duration are accurate?<\/p><\/div>", "subj": "fixed"}, {"n": 44, "q": "Bill Moxley, CFA is evaluating three bonds for inclusion in fixed income portfolio for one of his pension fund clients. All three bonds have a coupon rate of 3%, maturity of five years and are generally identical in every respect except that bond A is an option-free bond, bond B is callable in two years and bond C is putable in two years. The yield curve is currently flat. If the yield curve is expected to have a parallel downward shift, the bond with the highest price appreciation is least likely to be:", "opts": ["Bond B", "Bond C", "Bond A"], "ans": "A", "expl": "Bond B has an embedded call option which limits its upside resulting in negative convexity. Bonds A and C do not have such limits.", "explhtml": "<p>Bond B has an embedded call option which limits its upside resulting in negative convexity. Bonds A and C do not have such limits.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.3, LOS 25.e<\/div><div class=\"qtext\"><p>Bill Moxley, CFA is evaluating three bonds for inclusion in fixed income portfolio for one of his pension fund clients. All three bonds have a coupon rate of 3%, maturity of five years and are generally identical in every respect except that bond A is an option-free bond, bond B is callable in two years and bond C is putable in two years. The yield curve is currently flat.<\/p><p>If the yield curve is expected to have a parallel downward shift, the bond with the highest price appreciation is least likely to be:<\/p><\/div>", "subj": "fixed"}, {"n": 45, "q": "Using the following binomial interest rate tree, calculate the value of a two-year, 2.5% putable bond. The American style embedded put option can be exercised anytime and has a strike price of 99. The value is closest to:  3.75% 3.175%   2.665%", "opts": ["97.92.", "98.75.", "99.00."], "ans": "C", "expl": "The putable bond price tree is as follows:  A ==> 99.00  99.00    99.84  As an example, the price at node A is obtained as follows: PriceA = max[par value + coupon / (1 + rate), put price] = max[ (100 + 2.5) / (1 + 0.0375) ,99] = 99.00. The bond values at the other nodes are obtained in the same way. The calculated price at node 0 = [0.5(99.00 + 2.5) + 0.5(99.84 + 2.5)] / (1 + 0.03175) = $98.78 but since the put price is $99 the price of the bond will not go below $99.", "explhtml": "<p>The putable bond price tree is as follows:<\/p><div class=\"tbl\"><table><tr><td><\/td><td colspan=2>A ==&gt; 99.00<\/td><\/tr><tr><td>99.00<\/td><td colspan=2><\/td><\/tr><tr><td><\/td><td>99.84<\/td><td><\/td><\/tr><\/table><\/div><p>As an example, the price at node A is obtained as follows: PriceA = max[par value + coupon / (1 + rate), put price] = max[ (100 + 2.5) / (1 + 0.0375) ,99] = 99.00. The bond values at the other nodes are obtained in the same way. The calculated price at node 0 = [0.5(99.00 + 2.5) + 0.5(99.84 + 2.5)] / (1 + 0.03175) = $98.78 but since the put price is $99 the price of the bond will not go below $99.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.2, LOS 25.f<\/div><div class=\"qtext\"><p>Using the following binomial interest rate tree, calculate the value of a two-year, 2.5% putable bond. The American style embedded put option can be exercised anytime and has a strike price of 99. The value is closest to:<\/p><div class=\"tbl\"><table><tr><td><\/td><td>3.75%<\/td><\/tr><tr><td>3.175%<\/td><td><\/td><\/tr><tr><td><\/td><td>2.665%<\/td><\/tr><\/table><\/div><\/div>", "subj": "fixed"}, {"n": 46, "q": "A callable bond, a putable bond, and an option-free bond have the same coupon, maturity and rating. The call price and put price are 98 and 102 respectively. The option-free bond trades at par. Which of the following lists correctly orders the values of the three bonds from lowest to highest?", "opts": ["Callable bond, option-free bond, putable bond.", "Option-free bond, putable bond, callable bond.", "Putable bond, option-free bond, callable bond."], "ans": "A", "expl": "The put feature increases the value of a bond and the call feature lowers the value of a bond, when all other things are equal. Thus, the putable bond generally trades higher than a corresponding option-free bond, and the callable bond trades at a lower price.", "explhtml": "<p>The put feature increases the value of a bond and the call feature lowers the value of a bond, when all other things are equal. Thus, the putable bond generally trades higher than a corresponding option-free bond, and the callable bond trades at a lower price.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 25.1, LOS 25.b<\/div><div class=\"qtext\"><p>A callable bond, a putable bond, and an option-free bond have the same coupon, maturity and rating. The call price and put price are 98 and 102 respectively. The option-free bond trades at par. Which of the following lists correctly orders the values of the three bonds from lowest to highest?<\/p><\/div>", "subj": "fixed"}, {"n": 47, "q": "Assuming the common stock of MediSoft underwent a one-for-two reverse split, how would the features of the company's bonds be adjusted? The:", "opts": ["conversion ratio of the convertible bond would be reduced by 50%.", "market conversion price of the convertible bond would be reduced by half.", "conversion value of the convertible bond would be reduced by half."], "ans": "A", "expl": "A stock split would affect the market price of the common stock and the conversion ratio of a convertible bond. Since the split is a one-for-two split, the number of shares outstanding in the marketplace will be reduced by one half. Therefore, the stock price will double, keeping the total market value of the stock the same. Upon a stock split (or a reverse stock split), the conversion ratio is adjusted to reflect the split. In this case, the conversion ratio would be reduced by half. The market conversion price would double (the price of the bond is unchanged, but the conversion ratio decreases by 50%).", "explhtml": "<p>A stock split would affect the market price of the common stock and the conversion ratio of a convertible bond. Since the split is a one-for-two split, the number of shares outstanding in the marketplace will be reduced by one half. Therefore, the stock price will double, keeping the total market value of the stock the same. Upon a stock split (or a reverse stock split), the conversion ratio is adjusted to reflect the split. In this case, the conversion ratio would be reduced by half. The market conversion price would double (the price of the bond is unchanged, but the conversion ratio decreases by 50%).<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 47–49<\/summary><div class=\"vig-body\"><p>MediSoft Inc. develops and distributes high-tech medical software used in hospitals and clinics across the United States and Canada. The firm's software provides an integrated solution to monitoring, analyzing, and managing output from a variety of diagnostic medical equipment including MRIs, CT scans, and EKG machines. MediSoft has grown rapidly since its inception ten years ago, averaging 25% growth in sales over the past decade. The company went public three years ago. Twelve months after its IPO, MediSoft made two semiannual coupon bond offerings, the first of which was a convertible bond. At the time of issuance, the convertible bond had a coupon rate of 7.25%, a par value of $1,000, a conversion price of $55.56, and ten years until maturity. Two years after issuance, the bond became callable at 102% of par value. Soon after the issuance of the convertible bond, the company issued another series of bonds, which were putable but contained no conversion or call features. The putable bonds were issued with a coupon of 8.0%, a par value of $1,000, and 15 years until maturity. One year after their issuance, the put feature of the putable bonds became active, allowing the bonds to be put at a price of 95% of par value, and increasing linearly over five years to 100% of par value. MediSoft's convertible bonds are now trading in the market for a price of $947 with an estimated straight value of $917. The company's putable bonds are trading at a price of $1,052. Volatility in the price of MediSoft's common stock has been relatively high over the past few months. Currently, the stock is priced at $50 on the New York Stock Exchange and is expected to continue its annual dividend in the amount of $1.80 per share.<\/p><p>High-tech industry analysts for Brown &amp; Associates, a money management firm specializing in fixed- income investments, have been closely following MediSoft ever since it went public three years ago. In general, portfolio managers at Brown &amp; Associates do not participate in initial offerings of debt investments, preferring instead to see how the issue trades before considering taking a position in the issue, Because MediSoft's bonds have had ample time to trade in the marketplace, analysts and portfolio managers have taken an interest in the company's bonds. At a meeting to discuss the merits of MediSoft's bonds, the following comments were made by various portfolio managers and analysts at Brown &amp; Associates:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r25/v021.webp\" style=\"max-width:min(100%,584px)\" alt=\"&quot;Choosing to invest in MediSoft&#x27;s convertible bond would benefit our portfolios in many ways, but the primary benefit is the limited downside risk associated with the bond. Because the straight value will provide a floor for the value of the convertible bond, downside risk is limited to the difference between the market price of the bond and the straight value.&quot; &quot;Decreasing volatility in the price of MediSoft&#x27;s common stock as well as increasing volatility in the level of interest rates are expected in the near future. The combined effects of these changes in volatilit\"><\/div><\/details><div class=\"pp-topic\">Module 25.8, LOS 25.o<\/div><div class=\"qtext\"><p>Assuming the common stock of MediSoft underwent a one-for-two reverse split, how would the features of the company&#x27;s bonds be adjusted? The:<\/p><\/div>", "subj": "fixed"}, {"n": 48, "q": "Under what circumstances will the analyst's comments regarding the limited downside risk of MediSoft's convertible bonds be accurate?", "opts": ["Short-term and long-term interest rates are expected to remain the same.", "The convertible bond is trading in the market as a common stock equivalent.", "The Federal Reserve Bank decides to pursue a restrictive monetary policy."], "ans": "A", "expl": "If interest rates are not expected to change then the straight value of the bond will not change (ignoring the change in value resulting from the passage of time). If the straight value does not change, then downside risk is indeed limited to the difference between the price paid for the bond and the straight value. If, however, interest rates rise as the price of the common stock falls, the conversion value will fall and the straight value will fall, exposing the holder of the convertible bond to more downside risk.", "explhtml": "<p>If interest rates are not expected to change then the straight value of the bond will not change (ignoring the change in value resulting from the passage of time). If the straight value does not change, then downside risk is indeed limited to the difference between the price paid for the bond and the straight value. If, however, interest rates rise as the price of the common stock falls, the conversion value will fall and the straight value will fall, exposing the holder of the convertible bond to more downside risk.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 47–49<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div cla
