<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "A credit card provider conducts a consumer preference survey, which reveals that \"Clients are likely to replace their credit cards with digital wallets or cryptocurrencies, which are more versatile and affordable.\" Based only on this survey result, which of Porter's five forces is most likely to weaken the company's pricing power?", "opts": ["Threat of substitutes", "Threat of new entrants", "Bargaining power of customers"], "ans": "A", "expl": "Porter's five forces:\nEffects on prices, costs, and profitability\nPricing power is limited when…\nSubstitutes exist\nThreat of substitutes\nSwitching costs are low\nIndustries are fragmented and have\nLimited growth\nRivalry among incumbents High exit barriers\nHigh fixed costs\nIdentical products\nSupplier is greater in size than buyer\nBargaining power of suppliers* Demand is relatively inelastic\nNo alternatives are available\nThe market is fragmented\nBargaining power of customers Products are nonstandardized\nSwitching costs are low\nThreat of new entrants The threat of new entrants is high (eg, low barriers to entry)\n*Bargaining power of suppliers affects the prices of input costs.\nPorter's five forces framework is commonly used to assess and forecast how the competitive environment of an industry affects prices and costs.\nThe threat of substitutes measures how easily a customer can switch to an existing substitute product, considering factors such as:\nswitching costs (eg, whether a service can be canceled without significant losses),\ncustomer loyalty, and\ncharacteristics of the substitute product(s), such as functionality, performance, and price.\nIn this situation, the survey reveals that clients are likely to switch to digital wallets or cryptocurrencies and that they consider such products more\nversatile and affordable. This leads to the conclusion that the threat of substitutes is high, which restricts the credit card provider's ability to\nraise fees without a negative impact on sales volume (ie, its pricing power).\n(Choice B) Digital wallets and digital assets like cryptocurrencies are examples of substitutes, not new entrants in the credit card industry. The\nthreat of new entrants is driven by low barriers to entry and low switching costs, which were not mentioned in the stem.\n(Choice C) Customers have a positive perception of digital wallets and cryptocurrencies. This increases the threat of substitutes but does not\nincrease customers' bargaining power, which is affected by factors like buyer concentration and volume.\nThings to remember:\nPorter's five forces framework gives analysts valuable insights when forecasting prices and costs. The threat of substitutes measures how easily a\ncustomer can switch to an existing substitute product and considers factors such as switching costs, customer loyalty, and characteristics of the\nsubstitute product(s).\nExplain how the competitive position of a company based on a Porter’s five forces analysis affects prices and costs", "qhtml": null}, {"n": 2, "q": "Three manufacturers dominate the canned fruit market and buy fruits from a fragmented market of many farmers. However, a large agricultural distributor enters the fruit market, sourcing the fruits from the farmers, which forces the manufacturers to buy directly from the distributor. Based only on this information and on Porter's framework, which of the following forces is most likely weakening the manufacturers' competitive position?", "opts": ["Threat of new entrants", "Rivalry among incumbents", "Bargaining power of suppliers"], "ans": "C", "expl": "Porter's five forces:\nEffects on prices, costs, and profitability\nPricing power is limited when…\nSubstitutes exist\nThreat of substitutes\nSwitching costs are low\nIndustries are fragmented and have\nLimited growth\nRivalry among incumbents High exit barriers\nHigh fixed costs\nIdentical products\nSupplier is greater in size than buyer\nBargaining power of suppliers* Demand is relatively inelastic\nNo alternatives are available\nThe market is fragmented\nBargaining power of customers Products are nonstandardized\nSwitching costs are low\nThreat of new entrants The threat of new entrants is high (eg, low barriers to entry)\n*Bargaining power of suppliers affects the prices of input costs.\nPorter's five forces framework is commonly used to assess how the competitive environment of an industry can affect prices and costs. This\nmethodology gives analysts valuable insights when forecasting revenues and margins.\nThe bargaining power of suppliers denotes the level of influence or leverage that suppliers have when negotiating prices, terms, and\nconditions. Suppliers may have stronger bargaining power in an industry when, for example:\nThere are few suppliers, and each is greater in size than the firms in the industry\nSuppliers offer differentiated or specialized products or services\nThere are no readily available substitutes and/or the costs to switch suppliers are high\nIn this situation, the entrance of a large agricultural distributor, an intermediary that consolidates the manufacturers' supply sources, increases\nthe bargaining power of suppliers and weakens the manufacturers' leverage when buying inputs (ie, fruits).\n(Choice A) The threat of new entrants refers to new competitors entering the canned fruit market and directly competing with the food\nmanufacturers. However, the agricultural distributor is a supplier, not a competitor.\n(Choice B) Rivalry among incumbents relates to the competitive landscape (eg, price competition, number and size of competitors, and product\ndifferentiation) in the food manufacturers' market of canned fruits. There is no change in the intensity of competition between the three food\nmanufacturers.\nThings to remember:\nPorter's five forces framework gives analysts valuable insights into prices and costs when forecasting revenues and margins. The bargaining\npower of suppliers denotes the level of influence or leverage that suppliers have when negotiating prices, terms, and conditions with buyers.\nExplain how the competitive position of a company based on a Porter’s five forces analysis affects prices and costs", "qhtml": null}, {"n": 3, "q": "At the beginning of the fiscal year, a CEO provides optimistic annual EPS guidance, citing strong government-sector demand. Throughout the year, unforeseen tariffs significantly increase raw material costs. The CEO declines to revise forecasts, stating that the company's solid fundamentals should be able to offset gross margin compression. Based only on this information, which of the following biases does the CEO least likely exhibit?", "opts": ["Conservatism bias", "Illusion of control bias", "Representativeness bias"], "ans": "C", "expl": "Behavioral biases affecting analyst forecasts and their remedies\nBias Description Remedy\nHaving unjustified faith in own capacity Review past forecasts, assess relative accuracy\nOverconfidence\nand abilities Apply scenario analysis\nOverestimating own ability to control forecast Restrict number of model variables and expert\nIllusion of control\naccuracy opinions\nBeing reluctant to incorporate new information (eg, Regular review of models by an investment team\nConservatism\nanchoring) Flexible models, fewer variables\nClassifying new data based on past For base-rate neglect, consider both outside and\nRepresentativeness\nviews or experience (eg, base-rate neglect) inside information\nSelecting data that confirm beliefs and discarding Seek different perspectives (eg, neutral or negative\nConfirmation\nconflicting data opinions)\nBehavioral biases often lead to forecasting errors. Analysts should recognize that biases exist and account for these biases in their analyses.\nConservatism bias (eg, anchoring) occurs when individuals are reluctant to update a prior forecast to reflect new information.\nIllusion of control bias occurs when individuals overestimate their ability to control an outcome.\nRepresentativeness bias occurs when individuals form opinions based on past experiences or known classifications, dismissing the\nspecifics of the current situation.\nIn this scenario, the CEO exhibits conservatism in upholding the optimistic prior forecast in spite of contradictory evidence of rising costs (Choice\nA). The CEO also exhibits illusion of control by thinking the company can maintain its EPS through its solid fundamentals (Choice B). However,\nthese actions are insufficient to clearly indicate representativeness since there is no indication of the CEO applying past beliefs or known\nclassifications to conclude that the tariffs will not affect EPS.\nThings to remember:\nConservatism bias occurs when individuals are reluctant to update a prior forecast after receiving new information. Illusion of control bias occurs\nwhen individuals overestimate their ability to control an outcome. Representativeness bias occurs when individuals form opinions based on past\nexperiences or known classifications.\nExplain how behavioral factors affect analyst forecasts and recommend remedial actions for analyst biases", "qhtml": null}, {"n": 4, "q": "A surge in the price of cotton and labor costs is increasing input costs in the apparel industry. While most competitors decide to adjust their prices by the full increase in costs, one company decides to pass on only a portion of that increase. As a result, the company would most likely incur a decrease to its:", "opts": ["revenues.", "sales volume.", "gross margin percentage."], "ans": "C", "expl": "Effects of pricing strategy in inflationary and deflationary environments\nInflation Deflation\nPricing strategy Gross margin % Sales volume Gross margin % Sales volume\nAdjust faster than competitors ⇧ ⇩ ⇩ ⇧\nAdjust slower than competitors or partially ⇩ ⇧ ⇧ ⇩\nUnderstanding a company's pricing strategy (eg, preserving margins or increasing market share) is especially critical to forecasting during\nsignificant inflationary or deflationary conditions. Companies can decide whether to pass the total cost variation, or only a portion of it, to prices\nand have the flexibility to adjust prices more rapidly or slowly than their competitors. Analysts need to anticipate companies' reactions to\ncompetitors' strategies and to the economic environment and understand the factors driving those reactions.\nIn this instance, most companies in the apparel industry are raising their prices by the full increase in input costs. However, one company decides\nto pass on only a portion of the increase. This strategy will likely result in a(n):\nincrease in sales volume since the company will be selling its products at a relatively lower price than its competitors. Except in the rare\nsituation where demand is perfectly inelastic, some consumers will likely switch from more expensive to less expensive products (Choice\nB).\nincrease in revenues since both sales volume and prices are increasing (Choice A).\ndecrease in gross margin percentage since input costs are increasing by a higher percentage than prices. Note, however, that the\namount of gross margin (ie, revenues less COGS) may increase if a greater sales volume leads revenue to increase more than COGS.\nThings to remember:\nWhen inflationary or deflationary conditions are present, companies may adjust prices more rapidly or slowly than their competitors and will decide\nthe percentage of cost variations they pass on to prices. These decisions depend on a company's strategic objectives and have distinct impacts\non revenues and margins.\nExplain how to forecast industry and company sales and costs when they are subject to price inflation or deflation", "qhtml": null}, {"n": 5, "q": "Country A is currently in an inflationary environment. A multinational corporation that sources most of its inputs from Country A increases its global prices based on the change in Country A's general consumer price index (CPI). All else equal, this strategy will most likely reduce:", "opts": ["revenues if demand is highly price inelastic.", "market share if competitors in other countries raise prices by a higher rate.", "gross margin percentage if input costs increase more than Country A's CPI."], "ans": "C", "expl": "Factors influencing revenue forecasts with inflation\nInelastic: raising prices increases revenues\nPrice elasticity of demand\nElastic: raising prices may decrease revenues\nGeographic mix of revenues must be considered\nInflation rates in different countries\nDifferences in inflation rates usually affect exchange rates\nInflation does not affect all input costs equally\nChanges in relevant costs\nProper identification of affected relevant costs is essential\nPassing full costs to customers preserves margins\nPricing strategy\nPartial increase in prices may increase market share\nTo forecast revenues and costs, analysts need to understand the following:\nproduct price sensitivity, or the price elasticity of demand,\ndifferences in inflation rates across countries,\nvariation in the company's relevant costs, and\npricing strategies.\nUnderstanding how a company's significant input costs (eg, raw material, products for reselling) are affected by inflation can give the analyst\ninsights into how different strategies of price adjustment may affect margins.\nIn this situation, the company increases its prices in line with the change in Country A's CPI (ie, general inflation), most likely to preserve margins.\nThe final effect of this increase depends on the characteristics of the industry and the company. For example, if the increase in the company's\ncosts exceeds the CPI rate, and therefore exceeds the rate of increase in the company's global prices, then gross margin percentage will most\nlikely decrease.\n(Choice A) If demand for the company's products is highly price inelastic, an increase in price will have little effect on quantity demanded and will\nlikely increase revenues. Therefore, the analyst should predict an increase in revenues in the financial model.\n(Choice B) If competitors in other countries are increasing their prices by more than the inflation in Country A, the company's global prices will be\nrelatively lower than competitors', despite the increase based on the CPI rate. This will likely result in an increase in market share, not a reduction.\nThings to remember:\nTo forecast revenues and costs, analysts need to understand price elasticity of demand, differences in international inflation, and pricing strategy.\nUnderstanding how input costs vary compared with inflation is critical; for example, if input costs increase by more than the change in CPI,\nadjusting prices by the CPI rate will most likely decrease gross margin percentage.\nExplain how to forecast industry and company sales and costs when they are subject to price inflation or deflation", "qhtml": null}, {"n": 6, "q": "A buy-side analyst of a large-cap mutual fund is evaluating an apparel company's stock as a possible addition to the fund. The analyst decides to create a valuation model with a five-year forecast horizon. Which of the following factors would best justify the analyst's decision?", "opts": ["The horizon is greater than the industry's business cycle.", "The average annual portfolio turnover of the large-cap fund is 20%.", "The apparel company expects to make a major acquisition in the next five years."], "ans": "B", "expl": "Forecasting investment performance: factors influencing the forecast horizon\nPortfolio holding period (HP)\nInvestment strategy\nHP ≈ 1 / Portfolio turnover\nLonger cycles → longer horizons\nCyclicality\nExpected mid-cycle levels of sales and profitability\nAcquisitions and restructurings\nCompany-specific factors\nPeriod during which effects impact financials\nEmployer's preferences Parameters established by analyst's employer\nSeveral factors may influence the investment analyst when selecting the forecast time horizon. These include the investment strategy associated\nwith the security, the cyclical nature of the industry, company-specific considerations, and the preferences of the analyst's employer.\nIn keeping with the investment strategy, one approach is to determine the forecast horizon as the reciprocal of the average portfolio turnover.\nFor instance, if a fund has an annual turnover of 10%, it implies that the assets within the portfolio are expected to be sold or replaced every 10 (=\n1 / 0.10) years on average; consequently, a 10-year forecast horizon would be well-suited for this fund. For the apparel company, the analyst uses\na forecast horizon of five years, implying an average annual portfolio turnover of 20% (= 1 / 5).\n(Choice A) The length of the forecast horizon should be sufficient for the company to achieve its mid-cycle level of sales and earnings. The\nforecast horizon does not need to be greater than the business cycle for the industry.\n(Choice C) If the company is planning a major acquisition, the forecast horizon should cover the period during which the effects and benefits of\nthe acquisition will reflect in the company's financial statements. Consequently, if the acquisition is projected to occur within the next five years,\nthe analyst should use a forecast horizon greater than this five-year time frame.\nThings to remember:\nWhen forecasting an investment's performance, an analyst may determine the forecast horizon as the reciprocal of the average portfolio turnover.\nOther factors affecting forecast horizon include the cyclical nature of the industry, company-specific considerations, and the preferences of the\nanalyst's employer.\nExplain considerations in the choice of an explicit forecast horizon and an analyst’s choices in developing projections beyond the short-term\nforecast horizon", "qhtml": null}, {"n": 7, "q": "A financial controller believes that the firm will have poor cash flow performance next year and asks an analyst to forecast free cash flows. While reviewing the analyst's underlying assumptions, the controller focuses on unfavorable factors such as large replacement capital expenditure requirements while ignoring favorable factors such as high sales growth and improved working capital management. This financial controller's behavior when reviewing the analyst's forecast is most accurately described as: ", "opts": ["confirmation bias.", "overconfidence bias.", "representativeness bias."], "ans": "A", "expl": "Behavioral biases affecting analyst forecasts and their remedies\nBias Description Remedy\nHaving unjustified faith in own capacity Review past forecasts, assess relative accuracy\nOverconfidence\nand abilities Apply scenario analysis\nOverestimating own ability to control forecast Restrict number of model variables and expert\nIllusion of control\naccuracy opinions\nBeing reluctant to incorporate new information (eg, Regular review of models by an investment team\nConservatism\nanchoring) Flexible models, fewer variables\nClassifying new data based on past For base-rate neglect, consider both outside and\nRepresentativeness\nviews or experience (eg, base-rate neglect) inside information\nSelecting data that confirm beliefs and discarding Seek different perspectives (eg, neutral or negative\nConfirmation\nconflicting data opinions)\nBehavioral biases often impact decision making and lead to forecasting errors. Confirmation bias arises when individuals selectively accept\ninformation that confirms their existing beliefs and reject information that contradicts these beliefs.\nIn this scenario, the controller believes that the firm will have poor cash flow performance next year. When the analyst presents forecast\nassumptions, the controller actively notices unfavorable factors that support poor cash flow performance. Simultaneously, the controller ignores\nfavorable factors, such as high sales growth and improved working capital management, that contradict expectations of poor cash flow\nperformance.\n(Choice B) Overconfidence bias occurs when individuals are overly confident in their forecasting precision. Although the manager may exhibit\nsome level of overconfidence, selective filtering of new information is best described as confirmation bias.\n(Choice C) Representativeness bias occurs when people make assessments based on views formed from past experiences while ignoring the\nspecifics of the current situation. This question does not explicitly mention any views from past experience.\nThings to remember:\nBehavioral biases often impact decision making and lead to forecasting errors. Confirmation bias occurs when individuals selectively accept\ninformation that confirms their existing beliefs and reject information that contradicts these beliefs.\nExplain how behavioral factors affect analyst forecasts and recommend remedial actions for analyst biases", "qhtml": null}, {"n": 8, "q": "A global clothing company reports the following 20X1 financial results for one of its business units: in € millions 20X1 Revenue 100.00 COGS 30.00 Gross profit 70.00 SG&A 50.00 EBIT 20.00 A forecast of 20X3 operating profits (EBIT) for this business unit assumes that: Volume will contribute 7% to annual sales growth each year. Price/mix will contribute 3% to annual sales growth each year. Net foreign currency fluctuation is expected to reduce annual sales growth by 1% each year. COGS is expected to be 30% of revenue each year. SG&A is expected to be 50% of revenue each year. Sales growth is calculated geometrically. Using these assumptions, the 20X3 EBIT forecast (in € millions) for the business unit is closest to:", "opts": ["21.82", "23.76", "23.81"], "ans": "C", "expl": "The first step when building a sale-based pro forma financial model is to forecast revenue. Revenue growth is typically based on volume\ngrowth, price growth, changes to the product mix, foreign currency fluctuations, and acquisitions. After projected revenues are modeled, analysts\noften determine expenses (eg, COGS, SG&A) based on a percent of revenue. The expense percentages are frequently based on a combination\nof historical average and management guidance.\nCalculate Annual revenue growth\nannual = (1 + Volume growth %)(1 + Price/mix growth %)(1 + Foreign currency change %) − 1\ngrowth = (1 + 0.07)(1 + 0.03)(1 + −0.01) − 1\nrate* = 0.0911 or 9.11%\nCalculate\nRevenue = Revenue × (1 + Growth rate)2\n20X3 20X1\n20X3\n= 100 × (1 + 0.0911)2 = 119.05\nrevenue\n*Revenue growth is calculated geometrically in this scenario\nThen apply COGS and SG&A percentages to 20X3 revenue to determine expenses and operating profit (EBIT):\nin € millions 20X1 20X3\nRevenue 100.00 119.05\nCOGS 30.00 35.71 ← 119.05 × 30%\nGross profit 70.00 83.33\nSG&A 50.00 59.52 ← 119.05 × 50%\nEBIT 20.00 23.81\nThings to remember:\nA sales-based pro forma model is built by first forecasting sales and then determining expenses as a percent of sales. Sales growth is based on\nvolume, price, mix, foreign exchange fluctuations, and acquisitions. Expenses are often calculated by applying a historical percentage to sales.\nDemonstrate the development of a sales-based pro forma company model\n9.A company has annual revenues of $1.5 billion. An analyst forecasting next year's revenues expects volume growth of 6%, a positive forex\nimpact of $90 million, and a positive impact of $111 million from an acquisition. If the analyst expects total revenue growth of 30%, organic growth\nis closest to:\nA. 10.0%\n\nB. 16.6%\nC. 22.6%\nExplanation\nForecasting revenues is the first step of the income statement forecast process. Analysts want to predict a company's organic growth, which is\ndefined as the change in revenue driven by changes in volume (ie, quantity of units sold, or services rendered) and price. Price changes can be\ndriven by variations in prices of individual products or changes to the product mix.\nBesides organic growth, revenue is also affected by changes in foreign exchange (forex) rates (for multinational corporations), and by scope\nchanges (eg, acquisitions or divestitures). In this situation, the company has annual revenue of $1.5 billion, and the analyst expects next year's\ntotal revenues to increase by $450 million (= 1.5 billion × 30%).\nThis projected $450 million increase includes the forex impact ($90 million) and scope change ($111 million), so organic growth can be calculated\nas:\nOrganic growth = Total revenue growth − Forex impact − Scope change = 450 − 90 − 111 = 249\nOrganic growth (%) = 249 / 1,500 = 0.166 ≈ 16.6%\nTherefore, the analyst estimates an organic growth rate of 16.6%. Given that the expected volume growth is 6%, the effect of price changes on\ntotal revenue can be estimated as 10% [= (1.166 / 1.06) − 1] (Choice A).\n(Choice C) 22.6% [= (450 − 111) / 1,500] results from excluding only the scope change from total revenue growth. Therefore, this rate is not the\norganic growth since it includes the forex impact.\nThings to remember:\nOrganic growth is defined as the change in revenue driven by changes in volume and price, including product mix. Total revenue growth is\nestimated as the sum of organic growth, forex impact, and scope changes, such as acquisitions or divestitures.\nDemonstrate the development of a sales-based pro forma company model", "qhtml": null}, {"n": 9, "q": "A company has annual revenues of $1.5 billion. An analyst forecasting next year's revenues expects volume growth of 6%, a positive forex impact of $90 million, and a positive impact of $111 million from an acquisition. If the analyst expects total revenue growth of 30%, organic growth is closest to:", "opts": ["10.0%", "16.6%", "22.6%"], "ans": "B", "expl": "Forecasting revenues is the first step of the income statement forecast process. Analysts want to predict a company's organic growth, which is\ndefined as the change in revenue driven by changes in volume (ie, quantity of units sold, or services rendered) and price. Price changes can be\ndriven by variations in prices of individual products or changes to the product mix.\nBesides organic growth, revenue is also affected by changes in foreign exchange (forex) rates (for multinational corporations), and by scope\nchanges (eg, acquisitions or divestitures). In this situation, the company has annual revenue of $1.5 billion, and the analyst expects next year's\ntotal revenues to increase by $450 million (= 1.5 billion × 30%).\nThis projected $450 million increase includes the forex impact ($90 million) and scope change ($111 million), so organic growth can be calculated\nas:\nOrganic growth = Total revenue growth − Forex impact − Scope change = 450 − 90 − 111 = 249\nOrganic growth (%) = 249 / 1,500 = 0.166 ≈ 16.6%\nTherefore, the analyst estimates an organic growth rate of 16.6%. Given that the expected volume growth is 6%, the effect of price changes on\ntotal revenue can be estimated as 10% [= (1.166 / 1.06) − 1] (Choice A).\n(Choice C) 22.6% [= (450 − 111) / 1,500] results from excluding only the scope change from total revenue growth. Therefore, this rate is not the\norganic growth since it includes the forex impact.\nThings to remember:\nOrganic growth is defined as the change in revenue driven by changes in volume and price, including product mix. Total revenue growth is\nestimated as the sum of organic growth, forex impact, and scope changes, such as acquisitions or divestitures.\nDemonstrate the development of a sales-based pro forma company model", "qhtml": null}, {"n": 10, "q": "Due to a deflationary environment, a company is benefitting from a reduction in the cost of its main inputs. Since the company is in a competitive industry, which of the following strategies would most likely increase sales volume in the short run?", "opts": ["Keeping prices unchanged", "Reducing prices by a smaller percentage than industry rivals", "Passing cost variation to customers faster than its competitors"], "ans": "C", "expl": "Effects of pricing strategy in inflationary and deflationary environments\nInflation Deflation\nPricing strategy Gross margin % Sales volume Gross margin % Sales volume\nAdjust faster than competitors ⇧ ⇩ ⇩ ⇧\nAdjust slower than competitors or partially ⇩ ⇧ ⇧ ⇩\nCompanies may adopt different pricing strategies depending on their strategic objectives, such as preserving margins or increasing market share.\nAnalysts must understand and predict such strategic effects when forecasting revenues, especially in inflationary or deflationary conditions.\nWhen companies face changes in input costs, pricing strategies may differ. A company typically focuses on:\nThe pace at which it changes its prices: faster or slower than competitors\nThe percentage of cost variation transferred to prices: passing on total or partial variation\nIn this situation, a deflationary environment has resulted in a decline in input costs for the company. If the company reduces prices faster than its\ncompetitors, it will be offering its products at a relatively lower price, increasing sales volume in the short run. Note that this benefit is usually\ntemporary since competitors often react quickly, making it difficult for analysts to accurately predict the price-volume trade-off.\n(Choices A and B) The company operates in a competitive market and faces a deflationary environment (ie, prices are falling). Keeping prices\nunchanged or decreasing them less than competitors would make the company's prices higher relative to competitors', resulting in a decrease in\nsales volume and market share.\nThings to remember:\nPricing strategies typically focus on the pace at which a company changes its prices (ie, faster or slower than competitors) and the percentage of\ncost variation transferred to prices (ie, partial or full variation). In a deflationary environment, companies that reduce prices faster than competitors\ntypically increase sales volume in the short run.\nExplain how to forecast industry and company sales and costs when they are subject to price inflation or deflation", "qhtml": null}, {"n": 11, "q": "A company had revenues of €500 million and a gross profit margin of 40% in Year 1. An analyst forecasting revenues for Year 2 estimates an increase of 7% in the average price and sales volume growth of 10%. The analyst also assumes that the company will experience a 2% inflation rate on COGS. The forecasted gross profit (€ million) in Year 2 is closest to:", "opts": ["249.0", "251.9", "282.5"], "ans": "B", "expl": "Forecasting gross profit\nOrganic (revenue) growth = (1 + Volume growth) × (1 + Average price increase) − 1\nCOGS increase = (1 + Volume growth) × (1 + Inflation on costs) − 1\nForecasting revenues is the first step of the income statement forecast process. Revenue forecasts are typically determined by estimates of\nchanges in:\nvolume (ie, quantity of units sold or services rendered),\naverage price, which also accounts for changes in mix (of products), and\nforeign exchange (forex) rates.\nRevenue may also be affected by scope changes, such as acquisitions or divestitures. In this situation, the analyst does not assume any scope\nchange or forex impact, so revenue is calculated as:\nYear 2 revenue = Year 1 revenue × (1 + Organic growth) = 500 × {1 + [(1.10 × 1.07) − 1]} = 588.50\nSince the gross profit margin in Year 1 was 40%, COGS was 300 [= (1 − 0.40) × 500]. COGS grows according to changes in volume and the\ninflation rate. So:\nYear 2 COGS = Year 1 COGS × (1 + COGS increase) = 300 × {1 + [(1.10 × 1.02) −1]} = 336.60\nTherefore, the forecasted gross profit in Year 2 is €251.9 million (= 588.50 − 336.60), a gross profit margin of 42.8%.\n(Choice A) €249.0 million results from calculating organic growth as 17% and COGS increase as 12%, that is, adding the rates instead of\nmultiplying the factors (ie, 1 + Δ%).\n(Choice C) €282.5 million results from increasing COGS only by inflation, which is the average increase in the cost of each unit sold. The 10%\nvolume growth should also be included in the calculation.\nThings to remember:\nRevenue forecasts are typically determined by estimates of changes in volume and average price (ie, organic growth). Revenue may also be\naffected by foreign exchange rates and scope changes, such as acquisitions or divestitures. COGS grows according to changes in volume and\nthe inflation rate.\nDemonstrate the development of a sales-based pro forma company model", "qhtml": null}, {"n": 12, "q": "A supervisor revises the forecasts of her team of analysts. She notices that one of the analysts builds excessively complex financial models, relying on numerous specific assumptions, and seeks the opinions of an uncommonly large number of experts. The analyst most likely displays which of the following behavioral biases?", "opts": ["Confirmation", "Illusion of control", "Representativeness"], "ans": "B", "expl": "Behavioral biases affecting analyst forecasts and their remedies\nBias Description Remedy\nHaving unjustified faith in own capacity Review past forecasts, assess relative accuracy\nOverconfidence\nand abilities Apply scenario analysis\nOverestimating own ability to control forecast Restrict number of model variables and expert\nIllusion of control\naccuracy opinions\nBeing reluctant to incorporate new information (eg, Regular review of models by an investment team\nConservatism\nanchoring) Flexible models, fewer variables\nClassifying new data based on past For base-rate neglect, consider both outside and\nRepresentativeness\nviews or experience (eg, base-rate neglect) inside information\nSelecting data that confirm beliefs and discarding Seek different perspectives (eg, neutral or negative\nConfirmation\nconflicting data opinions)\nAnalysts are vulnerable to behavioral biases that may result in forecasting errors. Analysts should recognize that biases exist and perform\nanalyses that account for these biases. One such bias is known as illusion of control, in which analysts tend to overestimate their own ability to\ncontrol the accuracy of their financial forecasts and, as a result, create unduly complex models compiled with excessive and often immaterial\ninformation.\nIn this situation, the supervisor notices that one analyst builds overly complex financial models. It can be time-consuming and difficult to update\nintricate models, and such models are often overfitted. The analyst also seeks opinions of an unusually large number of experts.\nConstructing models with an excessive number of variables is usually less effective and may lead to misleading results. These are typical\nmanifestations of illusion of control.\n(Choice A) Confirmation bias leads analysts to select data that confirm their beliefs and to discard or overlook conflicting data. In this situation,\nthe analyst is not selecting data but gathering excessive information.\n(Choice C) Representativeness bias leads analysts to classify new data based on past views or experiences. The supervisor does not note this\nin the analyst's behavior.\nThings to remember:\nAnalysts are vulnerable to behavioral biases that may result in forecasting errors. Illusion of control leads analysts to overestimate their own ability\nto control their forecasting accuracy, resulting in building very complex financial models and obtaining excessive information.\nExplain how behavioral factors affect analyst forecasts and recommend remedial actions for analyst biases", "qhtml": null}];
const CFG = {"title": "Wiley · Introduction to Financial Statement Modeling", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Financial Statement Analysis · 12 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
</html>
