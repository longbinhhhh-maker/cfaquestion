<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

ly updated some of the assumptions used to determine the pension obligation; as a result, the obligation has decreased. The previous and updated values of each assumption are presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex001.webp\" style=\"max-width:min(100%,630px)\" alt=\"Exhibit\"><p>MTT also uses assumptions to value stock options offered to its executives as share-based compensation. Ricci recently updated one of these assumptions; she increased the expected volatility of MTT stock from 28% to 33% before recording the stock options granted in the current year. This change impacted the fair value of stock options and had effects on MTT&#x27;s financial statements.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the information gathered by Cooper and using consolidation with full goodwill, the goodwill amount (in € millions) is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss2/q005.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":6,"q":"In contrast to IFRS, the acquisition method reported under US GAAP:","opts":["does not recognize the target's internally developed intangible assets.","recognizes only probable and reasonably estimated contingent liabilities.","records a gain in other comprehensive income if the fair value of net assets exceeds the purchase price."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss2/a006.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/a006.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Matilde Ricci is the chief financial officer of Mille Torri Telecom (MTT), an Italian mobile network operator. MTT acquired an interest in Crescita, a smaller competitor that developed a promising mobile communication technology. Ricci asks Tyler Cooper, a financial analyst who reports to her, to calculate the goodwill from this transaction using consolidation with full goodwill. Cooper gathers the following information:<\/p><p>Interest acquired in Crescita: 85%<\/p><p>Price paid for interest: €17 million<\/p><p>Identifiable net assets: €18 million<\/p><p>After calculating goodwill, Cooper tells Ricci he does not have much experience with business consolidations under IFRS since he has spent most of his career in the United States. He asks if she can list some differences in the acquisition method between US GAAP and IFRS.<\/p><p>Later, Ricci turns her attention to MTT&#x27;s employee compensation plans. The company offers a defined benefit pension plan, which promises retirees a defined periodic payment for life. This amount depends on each employee&#x27;s final compensation and total years of service. Ricci has recently updated some of the assumptions used to determine the pension obligation; as a result, the obligation has decreased. The previous and updated values of each assumption are presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex001.webp\" style=\"max-width:min(100%,630px)\" alt=\"Exhibit\"><p>MTT also uses assumptions to value stock options offered to its executives as share-based compensation. Ricci recently updated one of these assumptions; she increased the expected volatility of MTT stock from 28% to 33% before recording the stock options granted in the current year. This change impacted the fair value of stock options and had effects on MTT&#x27;s financial statements.<\/p><\/div><\/details><div class=\"qtext\"><p>In contrast to IFRS, the acquisition method reported under US GAAP:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss2/q006.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":7,"q":"All else equal and based on Exhibit 1, the decrease in MTT's pension plan obligation most likely results from the change in which assumption?","opts":["Discount rate","Retirement life expectancy","Annual compensation growth"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss2/a007.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/a007.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Matilde Ricci is the chief financial officer of Mille Torri Telecom (MTT), an Italian mobile network operator. MTT acquired an interest in Crescita, a smaller competitor that developed a promising mobile communication technology. Ricci asks Tyler Cooper, a financial analyst who reports to her, to calculate the goodwill from this transaction using consolidation with full goodwill. Cooper gathers the following information:<\/p><p>Interest acquired in Crescita: 85%<\/p><p>Price paid for interest: €17 million<\/p><p>Identifiable net assets: €18 million<\/p><p>After calculating goodwill, Cooper tells Ricci he does not have much experience with business consolidations under IFRS since he has spent most of his career in the United States. He asks if she can list some differences in the acquisition method between US GAAP and IFRS.<\/p><p>Later, Ricci turns her attention to MTT&#x27;s employee compensation plans. The company offers a defined benefit pension plan, which promises retirees a defined periodic payment for life. This amount depends on each employee&#x27;s final compensation and total years of service. Ricci has recently updated some of the assumptions used to determine the pension obligation; as a result, the obligation has decreased. The previous and updated values of each assumption are presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex001.webp\" style=\"max-width:min(100%,630px)\" alt=\"Exhibit\"><p>MTT also uses assumptions to value stock options offered to its executives as share-based compensation. Ricci recently updated one of these assumptions; she increased the expected volatility of MTT stock from 28% to 33% before recording the stock options granted in the current year. This change impacted the fair value of stock options and had effects on MTT&#x27;s financial statements.<\/p><\/div><\/details><div class=\"qtext\"><p>All else equal and based on Exhibit 1, the decrease in MTT&#x27;s pension plan obligation most likely results from the change in which assumption?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss2/q007.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":8,"q":"All else equal, in accounting for the stock options granted, an increase in the expected volatility of MTT stock reduces:","opts":["retained earnings.","shareholders' equity.","compensation expense."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss2/a008.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/a008.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Matilde Ricci is the chief financial officer of Mille Torri Telecom (MTT), an Italian mobile network operator. MTT acquired an interest in Crescita, a smaller competitor that developed a promising mobile communication technology. Ricci asks Tyler Cooper, a financial analyst who repor ing. However, the countries differ when it comes to fiscal policy:<\/p><p>In Susian, government spending is steady, but taxes have been increased to lower the budget deficit.<\/p><p>In Gutium, government spending has increased, but the current tax regime has been maintained.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Yoder&#x27;s statements about international parity conditions is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss2/q011.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"economics"},{"n":12,"q":"Based on the Mundell-Fleming model, which country's currency will most likely appreciate?","opts":["Susian","Gutium","Both Susian and Gutium"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss2/a012.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/a012.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mila Keller is a currency trader at Eiger Bank, a large international bank. Keller is reviewing currency exchange rate quotes in the interbank market and looking for arbitrage opportunities. Keller compiles the quotes from the interbank market and compares them with a dealer quote from F/X Traders:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex002.webp\" style=\"max-width:min(100%,401px)\" alt=\"Exhibit\"><p>Keller is also monitoring the currencies and interest rates in the North American markets and has noticed that uncovered interest rate parity has not held. After reviewing the following data, she executes a carry trade by borrowing CAD 1,000,000 to invest in MXN-denominated bonds.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex003.webp\" style=\"max-width:min(100%,632px)\" alt=\"Exhibit\"><p>Keller has lunch with Karl Yoder, an economist at Eiger Bank. The two discuss international parity conditions, and Yoder states:<\/p><p><b>Statement 1:<\/b> Of the key international parity conditions, only covered interest rate parity is enforced by arbitrage.<\/p><p><b>Statement 2:<\/b> If covered and uncovered interest rate parity hold, then by definition the forward exchange rate will be an accurate predictor of the future spot exchange rate. move based on their countries&#x27; respective monetary and fiscal policies. For example, Susian and Gutium are both emerging market countries that have placed restrictions on capital flows. Both countries experienced a recession several years ago but have had strong GDP growth since, and in both countries, the central bank has increased its policy rate to prevent the economy from overheating. However, the countries differ when it comes to fiscal policy:<\/p><p>In Susian, government spending is steady, but taxes have been increased to lower the budget deficit.<\/p><p>In Gutium, government spending has increased, but the current tax regime has been maintained.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the Mundell-Fleming model, which country&#x27;s currency will most likely appreciate?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss2/q012.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"economics"},{"n":13,"q":"All else being equal and given the Scenario 1 interest rate forecast, which of the following best describes the effect on the value of Bonds 2 and 3? The value of:","opts":["both Bond 2 and Bond 3 increases.","Bond 2 decreases and Bond 3 increases.","Bond 2 increases and Bond 3 decreases."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss2/a013.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/a013.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Fixed Income<\/summary><div class=\"vig-body\"><p>Yuni Torimoto is a senior fixed-income analyst at a global bank supporting the portfolio managers of several bond funds. She is assisted by Darcy Stuponski, a junior analyst at the firm. A portfolio manager asks Torimoto to evaluate the interest rate risk of several government bonds. Exhibit 1 contains information on three fixed-rate sovereign bonds, all of which mature in exactly 5 years, on Oct 1 20X9. The government par bond yield curve is currently flat at 3.00%. Bond 1 is currently priced at 100% of its par value.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex004.webp\" style=\"max-width:min(100%,642px)\" alt=\"Exhibit\"><p>Torimoto obtains an interest rate forecast from the bank&#x27;s economists to use in evaluating the bonds. The economists forecast two potential interest rate environments:<\/p><p><b>Scenario 1:<\/b> The government bond yield curve remains flat at 3.00%, but there is an increase in interest rate volatility.<\/p><p><b>Scenario 2:<\/b> Interest rate volatility remains constant, but there is a significant steepening of the yield curve, with short-term rates staying at about the same level while long-term rates significantly increase.<\/p><p>Torimoto directs Stuponski to assess the impact of these scenarios on the values of Bonds 1, 2, and 3.<\/p><p>One of the bank&#x27;s portfolio managers asks Torimoto to evaluate Bond 4, a noncallable convertible bond issued one year ago by Quantan Corporation. Exhibit 2 contains selected data about Bond 4. Bond 5 is an otherwise identical nonconvertible Quantan Corporation bond currently priced at 93.0000 per 100 of par value.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex005.webp\" style=\"max-width:min(100%,449px)\" alt=\"Exhibit\"><p>Assume all bonds pay coupons once per year and all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>All else being equal and given the Scenario 1 interest rate forecast, which of the following best describes the effect on the value of Bonds 2 and 3? The value of:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss2/q013.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":14,"q":"All else equal and given the Scenario 2 interest rate forecast, which bond's embedded option is most likely to increase in value?","opts":["Only Bond 2","Only Bond 3","Both Bond 2 and Bond 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss2/a014.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/a014.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Yuni Torimoto is a senior fixed-income analyst at a global bank supporting the portfolio managers of several bond funds. She is assisted by Darcy Stuponski, a junior analyst at the firm. A portfolio manager asks Torimoto to evaluate the interest rate risk of several government bonds. Exhibit 1 contains information on three fixed-rate sovereign bonds, all of which mature in exactly 5 years, on Oct 1 20X9. The government par bond yield curve is currently flat at 3.00%. Bond 1 is currently priced at 100% of its par value.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex004.webp\" style=\"max-width:min(100%,642px)\" alt=\"Exhibit\"><p>Torimoto obtains an interest rate forecast from the bank&#x27;s economists to use in evaluating the bonds. The economists forecast two potential interest rate environments:<\/p><p><b>Scenario 1:<\/b> The government bond yield curve remains flat at 3.00%, but there is an increase in interest rate volatility.<\/p><p><b>Scenario 2:<\/b> Interest rate volatility remains constant, but there is a significant steepening of the yield curve, with short-term rates staying at about the same level while long-term rates significantly increase.<\/p><p>Torimoto directs Stuponski to assess the impact of these scenarios on the values of Bonds 1, 2, and 3.<\/p><p>One of the bank&#x27;s portfolio managers asks Torimoto to evaluate Bond 4, a noncallable convertible bond issued one year ago by Quantan Corporation. Exhibit 2 contains selected data about Bond 4. Bond 5 is an otherwise identical nonconvertible Quantan Corporation bond currently priced at 93.0000 per 100 of par value.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex005.webp\" style=\"max-width:min(100%,449px)\" alt=\"Exhibit\"><p>Assume all bonds pay coupons once per year and all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>All else equal and given the Scenario 2 interest rate forecast, which bond&#x27;s embedded option is most likely to increase in value?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss2/q014.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":15,"q":"If the YTM of Bond 1 rises from 3.00% to 4.50%, which bond's effective duration will decrease the most?","opts":["Bond 1","Bond 2","Bond 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss2/a015.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/a015.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Yuni Torimoto is a senior fixed-income analyst at a global bank supporting the portfolio managers of several bond funds. She is assisted by Darcy Stuponski, a junior analyst at the firm. A portfolio manager asks Torimoto to evaluate the interest rate risk of several government bonds. Exhibit 1 contains information on three fixed-rate sovereign bonds, all of which mature in exactly 5 years, on Oct 1 20X9. The government par bond yield curve is currently flat at 3.00%. Bond 1 is currently priced at 100% of its par value.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex004.webp\" style=\"max-width:min(100%,642px)\" alt=\"Exhibit\"><p>Torimoto obtains an interest rate forecast from the bank&#x27;s economists to use in evaluating the bonds. The economists forecast two potential interest rate environments:<\/p><p><b>Scenario 1:<\/b> The government bond yield curve remains flat at 3.00%, but there is an increase in interest rate volatility.<\/p><p><b>Scenario 2:<\/b> Interest rate volatility remains constant, but there is a significant steepening of the yield curve, with short-term rates staying at about the same level while long-term rates significantly increase.<\/p><p>Torimoto directs Stuponski to assess the impact of these scenarios on the values of Bonds 1, 2, and 3.<\/p><p>One of the bank&#x27;s portfolio managers asks Torimoto to evaluate Bond 4, a noncallable convertible bond issued one year ago by Quantan Corporation. Exhibit 2 contains selected data about Bond 4. Bond 5 is an otherwise identical nonconvertible Quantan Corporation bond currently priced at 93.0000 per 100 of par value.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex005.webp\" style=\"max-width:min(100%,449px)\" alt=\"Exhibit\"><p>Assume all bonds pay coupons once per year and all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>If the YTM of Bond 1 rises from 3.00% to 4.50%, which bond&#x27;s effective duration will decrease the most?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss2/q015.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":16,"q":"Based on Exhibit 2 and information provided on Bond 5, as of Oct 1 20X4, the conversion value of Bond 4 is:","opts":["less than the value of Bond 5.","equal to the value of Bond 5.","greater than the value of Bond 5."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss2/a016.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/a016.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Yuni Torimoto is a senior fixed-income analyst at a global bank supporting the portfolio managers of several bond funds. She is assisted by Darcy Stuponski, a junior analyst at the firm. A portfolio manager asks Torimoto to evaluate the interest rate risk of several government bonds. Exhibit 1 contains information on three fixed-rate sovereign bonds, all of which mature in exactly 5 years, on Oct 1 20X9. The government par bond yield curve is currently flat at 3.00%. Bond 1 is currently priced at 100% of its par value.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex004.webp\" style=\"max-width:min(100%,642px)\" alt=\"Exhibit\"><p>Torimoto obtains an interest rate forecast from the bank&#x27;s economists to use in evaluating the bonds. The economists forecast two potential interest rate environments:<\/p><p><b>Scenario 1:<\/b> The government bond yield curve remains flat at 3.00%, but there is an increase in interest rate volatility.<\/p><p><b>Scenario 2:<\/b> Interest rate volatility remains constant, but there is a significant steepening of the yield curve, with short-term rates staying at about the same level while long-term rates significantly increase.<\/p><p>Torimoto directs Stuponski to assess the impact of these scenarios on the values of Bonds 1, 2, and 3.<\/p><p>One of the bank&#x27;s portfolio managers asks Torimoto to evaluate Bond 4, a noncallable convertible bond issued one year ago by Quantan Corporation. Exhibit 2 contains selected data about Bond 4. Bond 5 is an otherwise identical nonconvertible Quantan Corporation bond currently priced at 93.0000 per 100 of par value.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex005.webp\" style=\"max-width:min(100%,449px)\" alt=\"Exhibit\"><p>Assume all bonds pay coupons once per year and all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2 and information provided on Bond 5, as of Oct 1 20X4, the conversion value of Bond 4 is:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss2/q016.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":17,"q":"Based on Exhibits 1 and 2, in 20X7, the model's expected return for IG is closest to:","opts":["1.16%","1.30%","2.66% ж"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss2/a017.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/a017.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Amir Hassan is an analyst at Luxor Advisors, a wealth management firm that caters to high-net-worth individuals. Hassan is developing a macroeconomic factor model to estimate the returns on the Intermediate Investment Grade Bond ETF (IIG), an index-based ETF that tracks the domestic bond market.<\/p><p>Hassan creates a three-factor model using GDP growth, corporate credit spreads, and inflation. The portion of the return not explained by the model is 0.3%. The details of the model are presented in Exhibit 1, and the previous year&#x27;s (20X7) model inputs are in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex006.webp\" style=\"max-width:min(100%,551px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex007.webp\" style=\"max-width:min(100%,485px)\" alt=\"Exhibit\"><p>Hassan is discussing the investment merits of IIG with fellow Luxor analyst Dina Omar. Omar makes the following observations:<\/p><p>Observation 1:IIG&#x27;s annual expense ratio is 0.20%.<\/p><p>Observation 2:Relative to a traditional mutual fund, IIG&#x27;s ETF structure results in a higher tax burden for investors.<\/p><p>Observation 3:IIG uses a representative sampling portfolio construction approach.<\/p><p>Hassan and Omar then compare IIG to the Suez Bond ETF (SBF) and the Nile Income ETF (NIF). Both funds are actively managed, long-only ETFs that are benchmarked to the same index as IIG. Omar compiles the following information net of fund fees and expenses:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex008.webp\" style=\"max-width:min(100%,572px)\" alt=\"Exhibit\"><p>During the discussion of the funds&#x27; investment merits, Hassan states that the information ratio may be useful in the investment manager selection process. Hassan continues by stating:<\/p><p><b>Statement 1:<\/b> The expected information ratio is the single best criterion for assessing active performance among various actively managed funds with the same benchmark.<\/p><p><b>Statement 2:<\/b> Investing with the highest information ratio manager will produce the highest Sharpe ratio for the investor&#x27;s portfolio.<\/p><p><b>Statement 3:<\/b> The optimal unconstrained portfolio is the one with the highest Sharpe ratio.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibits 1 and 2, in 20X7, the model&#x27;s expected return for IG is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss2/q017.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":18,"q":"Based on Omar's observations, the greatest source of tracking error for IIG is most likely attributable to:","opts":["Observation 1","Observation 2","Observation 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss2/a018.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/a018.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Amir Hassan is an analyst at Luxor Advisors, a wealth management firm that caters to high-net-worth individuals. Hassan is developing a macroeconomic factor model to estimate the returns on the Intermediate Investment Grade Bond ETF (IIG), an index-based ETF that tracks the domestic bond market.<\/p><p>Hassan creates a three-factor model using GDP growth, corporate credit spreads, and inflation. The portion of the return not explained by the model is 0.3%. The details of the model are presented in Exhibit 1, and the previous year&#x27;s (20X7) model inputs are in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex006.webp\" style=\"max-width:min(100%,551px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex007.webp\" style=\"max-width:min(100%,485px)\" alt=\"Exhibit\"><p>Hassan is discussing the investment merits of IIG with fellow Luxor analyst Dina Omar. Omar makes the following observations:<\/p><p>Observation 1:IIG&#x27;s annual expense ratio is 0.20%.<\/p><p>Observation 2:Relative to a traditional mutual fund, IIG&#x27;s hat the information ratio may be useful in the investment manager selection process. Hassan continues by stating:<\/p><p><b>Statement 1:<\/b> The expected information ratio is the single best criterion for assessing active performance among various actively managed funds with the same benchmark.<\/p><p><b>Statement 2:<\/b> Investing with the highest information ratio manager will produce the highest Sharpe ratio for the investor&#x27;s portfolio.<\/p><p><b>Statement 3:<\/b> The optimal unconstrained portfolio is the one with the highest Sharpe ratio.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 3, the full fundamental law, and the investment merits of the active bond funds, which of the following is the most appropriate investment for client accounts?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss2/q019.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":20,"q":"Which of Hassan's statements are correct?","opts":["Only Statements 1 and 2","Only Statements 2 and 3","Statements 1, 2, and 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss2/a020.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/a020.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Amir Hassan is an analyst at Luxor Advisors, a wealth management firm that caters to high-net-worth individuals. Hassan is developing a macroeconomic factor model to estimate the returns on the Intermediate Investment Grade Bond ETF (IIG), an index-based ETF that tracks the domestic bond market.<\/p><p>Hassan creates a three-factor model using GDP growth, corporate credit spreads, and inflation. The portion of the return not explained by the model is 0.3%. The details of the model are presented in Exhibit 1, and the previous year&#x27;s (20X7) model inputs are in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex006.webp\" style=\"max-width:min(100%,551px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex007.webp\" style=\"max-width:min(100%,485px)\" alt=\"Exhibit\"><p>Hassan is discussing the investment merits of IIG with fellow Luxor analyst Dina Omar. Omar makes the following observations:<\/p><p>Observation 1:IIG&#x27;s annual expense ratio is 0.20%.<\/p><p>Observation 2:Relative to a traditional mutual fund, IIG&#x27;s ETF structure results in a higher tax burden for investors.<\/p><p>Observation 3:IIG uses a representative sampling portfolio construction approach.<\/p><p>Hassan and Omar then compare IIG to the Suez Bond ETF (SBF) and the Nile Income ETF (NIF). Both funds are actively managed, long-only ETFs that are benchmarked to the same index as IIG. Omar compiles the following information net of fund fees and expenses:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex008.webp\" style=\"max-width:min(100%,572px)\" alt=\"Exhibit\"><p>During the discussion of the funds&#x27; investment merits, Hassan states that the information ratio may be useful in the investment manager selection process. Hassan continues by stating:<\/p><p><b>Statement 1:<\/b> The expected information ratio is the single best criterion for assessing active performance among various actively managed funds with the same benchmark.<\/p><p><b>Statement 2:<\/b> Investing with the highest information ratio manager will produce the highest Sharpe ratio for the investor&#x27;s portfolio.<\/p><p><b>Statement 3:<\/b> The optimal unconstrained portfolio is the one with the highest Sharpe ratio.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Hassan&#x27;s statements are correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss2/q020.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":21,"q":"Based on Exhibit 1, which of the following multiples suggests that Morava may be overvalued relative to Bosona?","opts":["P/E","Price-to-book","Dividend yield"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss2/a021.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/a021.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Antero Virtanen is a senior portfolio manager at an asset management firm. Virtanen has decided to increase the firm&#x27;s exposure to the technology sector and is choosing between Morava Tech and Bosona Industries. He explains to Louise Herrera, a junior equity analyst on his team, that Morava and Bosona are similar companies operating in the same industry. He asks Herrera to compare the companies using market-based valuation. She gathers the financial information shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex009.webp\" style=\"max-width:min(100%,571px)\" alt=\"Exhibit\"><p>Herrera adds that she also calculated multiples based on enterprise value (EV) since EV multiples address some weaknesses of price multiples. Virtanen asks Herrera to be more specific and provide examples of the EV/EBITDA multiple&#x27;s advantages. She explains that, in contrast to P/E, the EV/EBITDA multiple:<\/p><p><b>Advantage 1:<\/b> Adequately accounts for changes in working capital<\/p><p><b>Advantage 2:<\/b> Is suitable to compare capital-intensive businesses<\/p><p><b>Advantage 3:<\/b> Directly reflects a company&#x27;s capital expenditures<\/p><p>Virtanen asks Herrera whether Bosona&#x27;s 20X6 EPS of €10.20 deviated from market expectations. Herrera replies that the mean consensus forecast was €9.90 with a standard deviation of €1.50. She adds that the historical standard deviation of past unexpected earnings is €2.00. Virtanen believes that momentum indicators may provide insights on future trends and asks Herrera to calculate Bosona&#x27;s standardized unexpected earnings (SUE) for 20X6. consists of three stocks with a market value of €200 million. He gives Herrera the position and P/E of each stock, summarized in Exhibit 2, and asks her to estimate the portfolio&#x27;s P/E. Herrera explains that there are different measures of central tendency and that she needs to use the most appropriate measure for this situation.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex010.webp\" style=\"max-width:min(100%,323px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, which of the following multiples suggests that Morava may be overvalued relative to Bosona?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss2/q021.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":22,"q":"When compared with P/E, which of the following advantages of the EV/EBITDA multiple is correct?","opts":["Advantage 1","Advantage 2","Advantage 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss2/a022.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/a022.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Antero Virtanen is a senior portfolio manager at an asset management firm. Virtanen has decided to increase the firm&#x27;s exposure to the technology sector and is choosing between Morava Tech and Bosona Industries. He explains to Louise Herrera, a junior equity analyst on his team, that Morava and Bosona are similar companies operating in the same industry. He asks Herrera to compare the companies using market-based valuation. She gathers the financial information shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex009.webp\" style=\"max-width:min(100%,571px)\" alt=\"Exhibit\"><p>Herrera adds that she also calculated multiples based on enterprise value (EV) since EV multiples address some weaknesses of price multiples. Virtanen asks Herrera to be more specific and provide examples of the EV/EBITDA multiple&#x27;s advantages. She explains that, in contrast to P/E, the EV/EBITDA multiple:<\/p><p><b>Advantage 1:<\/b> Adequately accounts for changes in working capital<\/p><p><b>Advantage 2:<\/b> Is suitable to compare capital-intensive businesses<\/p><p><b>Advantage 3:<\/b> Directly reflects a company&#x27;s capital expenditures<\/p><p>Virtanen asks Herrera whether Bosona&#x27;s 20X6 EPS of €10.20 deviated from market expectations. Herrera replies that the mean consensus forecast was €9.90 with a standard deviation of €1.50. She adds that the historical standard deviation of past unexpected earnings is €2.00. Virtanen believes that momentum indicators may provide insights on future trends and asks Herrera to calculate Bosona&#x27;s standardized unexpected earnings (SUE) for 20X6. consists of three stocks with a market value of €200 million. He gives Herrera the position and P/E of each stock, summarized in Exhibit 2, and asks her to estimate the portfolio&#x27;s P/E. Herrera explains that there are different measures of central tendency and that she needs to use the most appropriate measure for this situation.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex010.webp\" style=\"max-width:min(100%,323px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>When compared with P/E, which of the fo 27;s capital expenditures<\/p><p>Virtanen asks Herrera whether Bosona&#x27;s 20X6 EPS of €10.20 deviated from market expectations. Herrera replies that the mean consensus forecast was €9.90 with a standard deviation of €1.50. She adds that the historical standard deviation of past unexpected earnings is €2.00. Virtanen believes that momentum indicators may provide insights on future trends and asks Herrera to calculate Bosona&#x27;s standardized unexpected earnings (SUE) for 20X6. consists of three stocks with a market value of €200 million. He gives Herrera the position and P/E of each stock, summarized in Exhibit 2, and asks her to estimate the portfolio&#x27;s P/E. Herrera explains that there are different measures of central tendency and that she needs to use the most appropriate measure for this situation.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex010.webp\" style=\"max-width:min(100%,323px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on the information provided by Herrera, Bosona&#x27;s SUE score in 20X6 was closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss2/q023.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":24,"q":"Which of the following central tendency measures most appropriately estimates the portfolio P/E?","opts":["Harmonic mean","Winsorized mean","Weighted harmonic mean"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss2/a024.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/a024.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Antero Virtanen is a senior portfolio manager at an asset management firm. Virtanen has decided to increase the firm&#x27;s exposure to the technology sector and is choosing between Morava Tech and Bosona Industries. He explains to Louise Herrera, a junior equity analyst on his team, that Morava and Bosona are similar companies operating in the same industry. He asks Herrera to compare the companies using market-based valuation. She gathers the financial information shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex009.webp\" style=\"max-width:min(100%,571px)\" alt=\"Exhibit\"><p>Herrera adds that she also calculated multiples based on enterprise value (EV) since EV multiples address some weaknesses of price multiples. Virtanen asks Herrera to be more specific and provide examples of the EV/EBITDA multiple&#x27;s advantages. She explains that, in contrast to P/E, the EV/EBITDA multiple:<\/p><p><b>Advantage 1:<\/b> Adequately accounts for changes in working capital<\/p><p><b>Advantage 2:<\/b> Is suitable to compare capital-intensive businesses<\/p><p><b>Advantage 3:<\/b> Directly reflects a company&#x27;s capital expenditures<\/p><p>Virtanen asks Herrera whether Bosona&#x27;s 20X6 EPS of €10.20 deviated from market expectations. Herrera replies that the mean consensus forecast was €9.90 with a standard deviation of €1.50. She adds that the historical standard deviation of past unexpected earnings is €2.00. Virtanen believes that momentum indicators may provide insights on future trends and asks Herrera to calculate Bosona&#x27;s standardized unexpected earnings (SUE) for 20X6. consists of three stocks with a market value of €200 million. He gives Herrera the position and P/E of each stock, summarized in Exhibit 2, and asks her to estimate the portfolio&#x27;s P/E. Herrera explains that there are different measures of central tendency and that she needs to use the most appropriate measure for this situation.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex010.webp\" style=\"max-width:min(100%,323px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of the following central tendency measures most appropriately estimates the portfolio P/E?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss2/q024.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":25,"q":"Which of Bardot's responses regarding currency swaps is (are) correct?","opts":["Only Response 1","Only Response 2","Both Response 1 and Response 2"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss2/a025.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/a025.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Derivatives<\/summary><div class=\"vig-body\"><p>Jason Kim is a senior derivatives trader for a UK-based hedge fund. Hannah Bardot is a recently hired junior trader working with Kim. Kim wants to assess Bardot&#x27;s familiarity with the pricing and valuation of currency swaps. Kim provides Bardot with information (shown in Exhibit 1) related to a 4-year, GBP/EUR, pay-fixed, receive-floating currency swap initiated one year earlier.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex011.webp\" style=\"max-width:min(100%,671px)\" alt=\"Exhibit\"><p>Kim asks Bardot to describe a method of determining the GBP value of the swap and to identify a portfolio of fixed-income securities that would replicate the cash flows of the hedge fund&#x27;s swap position. She responds:<\/p><p><b>Response 1:<\/b> The GBP value of the swap is the PV of the difference between 3% and the coupon rate for 4-year, at-market, annual pay, GBP fixed rate for floating rate in EUR, having the same notional amounts and the same floating-leg reference interest rate.<\/p><p><b>Response 2:<\/b> A replicating portfolio of the original swap is a long position and a short position in two annual payment bonds that mature in exactly three years:<\/p><p>Short a GBP 40 million par value, 3% fixed-coupon bond<\/p><p>Long a EUR 50 million floating-rate coupon based on the same reference interest rate as the floating leg of the swap.<\/p><p>Kim then asks Bardot to use a two-period binomial model to calculate the value of a 2-year European call on Gondorf Corporation common stock, based on the following information:<\/p><p>exercise price of 50.<\/p><p>The up factor (u) is 1.221, and the down factor (d) is 0.8187.<\/p><p>The risk-free rate is 3% per period, and the company does not pay a common dividend.<\/p><p>Kim is considering using the Black-Scholes-Merton (BSM) model to value equity put options. However, Kim is more familiar with binomial models than with BSM, so he asks Bardot to describe how the BSM model values options.<\/p><p>Kim and Bardot discuss the use of the option Greeks for measuring and managing the risks of option positions. During the discussion, Kim describes two interpretations of deltas:<\/p><p><b>Interpretation 1:<\/b> The hedge ratio<\/p><p><b>Interpretation 2:<\/b> The fraction of one share that creates market exposure equal to one option<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Bardot&#x27;s responses regarding currency swaps is (are) correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss2/q025.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":26,"q":"Based on the information provided by Kim and using the two-period binomial model, the price of the Gondort call is closest to:","opts":["5.61","5.77","5.95"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss2/a026.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/a026.webp\" alt=\"Lời g Black-Scholes-Merton (BSM) model to value equity put options. However, Kim is more familiar with binomial models than with BSM, so he asks Bardot to describe how the BSM model values options.<\/p><p>Kim and Bardot discuss the use of the option Greeks for measuring and managing the risks of option positions. During the discussion, Kim describes two interpretations of deltas:<\/p><p><b>Interpretation 1:<\/b> The hedge ratio<\/p><p><b>Interpretation 2:<\/b> The fraction of one share that creates market exposure equal to one option<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the information provided by Kim and using the two-period binomial model, the price of the Gondort call is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss2/q026.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":27,"q":"Which of the following best describes the BSM model valuation of put options?","opts":["[Stock price × N(d1)] - [PV of the exercise price × N(d2)]","[PV of the exercise price × N(-di)] - [Stock price × N(-d2)]","[PV of the exercise price × N(-d2)] - [Stock price × N(-d,)]"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss2/a027.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/a027.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jason Kim is a senior derivatives trader for a UK-based hedge fund. Hannah Bardot is a recently hired junior trader working with Kim. Kim wants to assess Bardot&#x27;s familiarity with the pricing and valuation of currency swaps. Kim provides Bardot with information (shown in Exhibit 1) related to a 4-year, GBP/EUR, pay-fixed, receive-floating currency swap initiated one year earlier.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex011.webp\" style=\"max-width:min(100%,671px)\" alt=\"Exhibit\"><p>Kim asks Bardot to describe a method of determining the GBP value of the swap and to identify a portfolio of fixed-income securities that would replicate the cash flows of the hedge fund&#x27;s swap position. She responds:<\/p><p><b>Response 1:<\/b> The GBP value of the swap is the PV of the difference between 3% and the coupon rate for 4-year, at-market, annual pay, GBP fixed rate for floating rate in EUR, having the same notional amounts and the same floating-leg reference interest rate.<\/p><p><b>Response 2:<\/b> A replicating portfolio of the original swap is a long position and a short position in two annual payment bonds that mature in exactly three years:<\/p><p>Short a GBP 40 million par value, 3% fixed-coupon bond<\/p><p>Long a EUR 50 million floating-rate coupon based on the same reference interest rate as the floating leg of the swap.<\/p><p>Kim then asks Bardot to use a two-period binomial model to calculate the value of a 2-year European call on Gondorf Corporation common stock, based on the following information:<\/p><p>exercise price of 50.<\/p><p>The up factor (u) is 1.221, and the down factor (d) is 0.8187.<\/p><p>The risk-free rate is 3% per period, and the company does not pay a common dividend.<\/p><p>Kim is considering using the Black-Scholes-Merton (BSM) model to value equity put options. However, Kim is more familiar with binomial models than with BSM, so he asks Bardot to describe how the BSM model values options.<\/p><p>Kim and Bardot discuss the use of the option Greeks for measuring and managing the risks of option positions. During the discussion, Kim describes two interpretations of deltas:<\/p><p><b>Interpretation 1:<\/b> The hedge ratio<\/p><p><b>Interpretation 2:<\/b> The fraction of one share that creates market exposure equal to one option<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following best describes the BSM model valuation of put options?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss2/q027.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":28,"q":"Which of Kim's interpretations of delta is (are) correct?","opts":["Only Interpretation 1","Only Interpretation 2","Both Interpretation 1 and Interpretation 2"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss2/a028.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/a028.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jason Kim is a senior derivatives trader for a UK-based hedge fund. Hannah Bardot is a recently hired junior trader working with Kim. Kim wants to assess Bardot&#x27;s familiarity with the pricing and valuation of currency swaps. Kim provides Bardot with information (shown in Exhibit 1) related to a 4-year, GBP/EUR, pay-fixed, receive-floating currency swap initiated one year earlier.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex011.webp\" style=\"max-width:min(100%,671px)\" alt=\"Exhibit\"><p>Kim asks Bardot to describe a method of determining the GBP value of the swap and to identify a portfolio of fixed-income securities that would replicate the cash flows of the hedge fund&#x27;s swap position. She responds:<\/p><p><b>Response 1:<\/b> The GBP value of the swap is the PV of the difference between 3% and the coupon rate for 4-year, at-market, annual pay, GBP fixed rate for floating rate in EUR, having the same notional amounts and the same floating-leg reference interest rate.<\/p><p><b>Response 2:<\/b> A replicating portfolio of the original swap is a long position and a short position in two annual payment bonds that mature in exactly three years:<\/p><p>Short a GBP 40 million par value, 3% fixed-coupon bond<\/p><p>Long a EUR 50 million floating-rate coupon based on the same reference interest rate as the floating leg of the swap.<\/p><p>Kim then asks Bardot to use a two-period binomial model to calculate the value of a 2-year European call on Gondorf Corporation common stock, based on the following information:<\/p><p>exercise price of 50.<\/p><p>The up factor (u) is 1.221, and the down factor (d) is 0.8187.<\/p><p>The risk-free rate is 3% per period, and the company does not pay a common dividend.<\/p><p>Kim is considering using the Black-Scholes-Merton (BSM) model to value equity put options. However, Kim is more familiar with binomial models than with BSM, so he asks Bardot to describe how the BSM model values options.<\/p><p>Kim and Bardot discuss the use of the option Greeks for measuring and managing the risks of option positions. During the discussion, Kim describes two interpretations of deltas:<\/p><p><b>Interpretation 1:<\/b> The hedge ratio<\/p><p><b>Interpretation 2:<\/b> The fraction of one share that creates market exposure equal to one option<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Kim&#x27;s interpretations of delta is (are) correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss2/q028.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":29,"q":"According to the information provided by Tang, Vela's estimated dividends per share ($ for 20X8 is closest to:","opts":["1.20","1.62","1.65"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss2/a029.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/a029.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Corporate Issuers<\/summary><div class=\"vig-body\"><p>Ismail Tang is the treasurer at Vela Corp., a retailer specializing in sailboat equipment and accessories. Vela, a mature company that has historically distributed a substantial portion of its profits as dividends, is facing increasing competition along with declining revenues and earnings.<\/p><p>Vela&#x27;s dividend policy consists of gradually adjusting dividends to a target payout ratio. Tang provides the following information to Freya Rochester, a junior analyst on his team, and asks her to estimate this year&#x27;s dividends:<\/p><p>In 20X7, Vela had an EPS of $3.20 and paid dividends per share of $1.80.<\/p><p>The expected EPS for 20X8 is $2.00.<\/p><p>The target payout ratio is 60%, with a four-year period to adjust dividends.<\/p><p>Rochester concludes that, according to the dividend policy, Vela would pay less in dividends in 20X8 than in the previous year. She asks Tang how investors and analysts could interpret such a decrease. Tang says:<\/p><p><b>Statement 1:<\/b> Dividend reductions typically send negative signals to investors, assuming perfect capital markets.<\/p><p><b>Statement 2:<\/b> Companies with poor earnings can increase dividends to attract investors and increase share price.<\/p><p><b>Statement 3:<\/b> Cutting dividends may send a positive signal in some situations.<\/p><p>Tang wants to consider the implications of repurchasing Vela&#x27;s shares instead of paying dividends. He is specifically concerned about the impact of a share repurchase on Vela&#x27;s book value per share. He asks Rochester to gather information, summarized in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex012.webp\" style=\"max-width:min(100%,352px)\" alt=\"Exhibit\"><p>Tang then asks Rochester to estimate Vela&#x27;s coverage ratios for 20X8 and assess how these ratios would be affected by changes in vestors, assuming perfect capital markets.<\/p><p><b>Statement 2:<\/b> Companies with poor earnings can increase dividends to attract investors and increase share price.<\/p><p><b>Statement 3:<\/b> Cutting dividends may send a positive signal in some situations.<\/p><p>Tang wants to consider the implications of repurchasing Vela&#x27;s shares instead of paying dividends. He is specifically concerned about the impact of a share repurchase on Vela&#x27;s book value per share. He asks Rochester to gather information, summarized in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex012.webp\" style=\"max-width:min(100%,352px)\" alt=\"Exhibit\"><p>Tang then asks Rochester to estimate Vela&#x27;s coverage ratios for 20X8 and assess how these ratios would be affected by changes in the company&#x27;s payout policy.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following changes in Vela&#x27;s payout policy would most likely increase 20X8&#x27;s FCFE coverage ratio?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss2/q032.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"corporate"},{"n":33,"q":"Based on Exhibits 1 and 2, the translation adjustment (MXN thousands) that Buena Comida will report on its 20X7 translated financial statements due to Euro Comida's operations is closest to:","opts":["-710","80","370"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss2/a033.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/a033.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Buena Comida is a Mexico-based food manufacturing company that operates in Central and South America and has facilities in Brazil, Peru, and Argentina. Buena Comida&#x27;s reporting currency is MXN. On Jan 1 20X7 Buena Comida created a European subsidiary, Euro Comida. All PPE for Euro Comida was purchased on Jan 1 20X7. At the end of 20X7, Euro Comida reported the data shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex013.webp\" style=\"max-width:min(100%,426px)\" alt=\"Exhibit\"><p>Management has elected to use EUR as Euro Comida&#x27;s functional currency. Relevant exchange rates (using the price/base currency convention) are shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex014.webp\" style=\"max-width:min(100%,337px)\" alt=\"Exhibit\"><p>María Vargas, Buena Comida&#x27;s CEO, asks the CFO, Rafael Mendoza, what would happen to the subsidiary&#x27;s return on assets ratio in 20X7 if Euro Comida used MXN as its functional currency instead of EUR.<\/p><p>Vargas also asks about the foreign exchange risks to Buena Comida over the next year. Mendoza explains that Buena Comida hedges most, but not all, of its foreign exchange exposure. He compiles information on cash flows exposed rates over the next year, shown in Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss2/ex015.webp\" style=\"max-width:min(100%,565px)\" alt=\"Exhibit\"><p>In the fourth quarter of 20X7, Buena Comida has the following transactions with a Brazilian company that will be settled in BRL:<\/p><p>Purchases of inventory worth BRL 50,000<\/p><p>Sales of finished products worth BRL 75,000<\/p><p>Both transactions will settle in 20X8.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibits 1 and 2, the translation adjustment (MXN thousands) that Buena Comida will report on its 20X7 translated financial statements due to Euro Comida&#x27;s operations is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss2/q033.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"f
