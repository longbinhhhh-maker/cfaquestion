<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

<header>

<script>
const DATA = [{"n":1,"q":"Which of the following types of dividend distributions does not affect a company's leverage ratios?","opts":["Extra dividends","Stock dividends","Regular cash dividends"],"ans":"B","expl":"B is Correct because neither stock dividends nor stock splits affect liquidity ratios or financial leverage ratios.","explhtml":"<p>B is Correct because neither stock dividends nor stock splits affect liquidity ratios or financial leverage ratios.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>Which of the following types of dividend distributions does not affect a company&#x27;s leverage ratios?<\/p><\/div>","subj":"corporate"},{"n":2,"q":"All else being equal, a stock dividend distribution reduces a company's:","opts":["retained earnings.","financial leverage ratios.","total shareholders' equity."],"ans":"A","expl":"A is Correct because stock dividends do not affect assets or shareholders’ equity. Although retained earnings are reduced by the value of the stock dividends paid (i.e., by the number of shares issued × price per share), contributed capital increases by the same amount (i.e., the value of the shares issued). As a result, total shareholders’ equity does not change.","explhtml":"<p>A is Correct because stock dividends do not affect assets or shareholders’ equity. Although retained earnings are reduced by the value of the stock dividends paid (i.e., by the number of shares issued × price per share), contributed capital increases by the same amount (i.e., the value of the shares issued). As a result, total shareholders’ equity does not change.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>All else being equal, a stock dividend distribution reduces a company&#x27;s:<\/p><\/div>","subj":"corporate"},{"n":3,"q":"With respect to theories of dividend policy, Miller and Modigliani argue that investors:","opts":["are indifferent between cash dividends and share repurchases.","prefer a dollar of dividends to a dollar of potential share capital gains from reinvesting earnings.","prefer a dividend payout ratio that is as low as possible when dividends are taxed at higher rates than capital gains."],"ans":"A","expl":"A is Correct because Miller and Modigliani (MM) argued that under perfect capital market assumptions—a company’s dividend policy should have no impact on its cost of capital or on shareholder wealth. Under the MM assumptions, there is no meaningful distinction between dividends and share repurchases (repurchases of outstanding common shares by the issuing company): They are both ways for a company to return cash to shareholders.","explhtml":"<p>A is Correct because Miller and Modigliani (MM) argued that under perfect capital market assumptions—a company’s dividend policy should have no impact on its cost of capital or on shareholder wealth. Under the MM assumptions, there is no meaningful distinction between dividends and share repurchases (repurchases of outstanding common shares by the issuing company): They are both ways for a company to return cash to shareholders.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>With respect to theories of dividend policy, Miller and Modigliani argue that investors:<\/p><\/div>","subj":"corporate"},{"n":4,"q":"For which of the following companies would a dividend increase most likely be viewed as a positive signal by its shareholders?","opts":["A retailer facing financial pressure","An undervalued manufacturing company","A fast growing tech company planning to raise equity"],"ans":"B","expl":"B is Correct because some researchers have argued that a company’s dividend initiation or increase tends to be associated with share price increases because it attracts more attention to the company. Managers have an incentive to increase the company’s dividend if they believe the company to be undervalued because the increased scrutiny will lead to a positive price adjustment. Therefore, increasing the dividend is a positive signal for shareholders of an undervalued company.","explhtml":"<p>B is Correct because some researchers have argued that a company’s dividend initiation or increase tends to be associated with share price increases because it attracts more attention to the company. Managers have an incentive to increase the company’s dividend if they believe the company to be undervalued because the increased scrutiny will lead to a positive price adjustment. Therefore, increasing the dividend is a positive signal for shareholders of an undervalued company.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>For which of the following companies would a dividend increase most likely be viewed as a positive signal by its shareholders?<\/p><\/div>","subj":"corporate"},{"n":5,"q":"A highly profitable company with excess cash has slowing sales growth due to a lack of investment opportunities. The best way for management to reduce agency costs is to:","opts":["increase the dividend.","eliminate the dividend.","maintain the dividend at its current level."],"ans":"A","expl":"A is Correct because increasing the dividend would reduce agency costs by returning excess cash flows to shareholders rather than being reinvested poorly. The potential overinvestment agency problem might be alleviated by the payment of dividends. In particular, by paying out all free cash flow to equity in dividends, managers would be constrained in their ability to overinvest by taking on negative NPV projects.","explhtml":"<p>A is Correct because increasing the dividend would reduce agency costs by returning excess cash flows to shareholders rather than being reinvested poorly. The potential overinvestment agency problem might be alleviated by the payment of dividends. In particular, by paying out all free cash flow to equity in dividends, managers would be constrained in their ability to overinvest by taking on negative NPV projects.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>A highly profitable company with excess cash has slowing sales growth due to a lack of investment opportunities. The best way for management to reduce agency costs is to:<\/p><\/div>","subj":"corporate"},{"n":6,"q":"Which of the following would best constrain management's ability to overinvest by taking on negative NPV projects?","opts":["Increase stock dividends","Increase internally financed cash dividends EdZebInstitute","Set minimum levels of EBITDA coverage of interest charges as a condition for paying dividends"],"ans":"B","expl":"B is Correct because one managerial incentive of particular concern is the potential private benefit managers may obtain from investment in negative net present value (NPV) projects. The potential overinvestment agency problem might be alleviated by the payment of dividends. In particular, by paying out all free cash flow to equity in dividends, managers would be constrained in their ability to overinvest by taking on negative NPV projects.","explhtml":"<p>B is Correct because one managerial incentive of particular concern is the potential private benefit managers may obtain from investment in negative net present value (NPV) projects. The potential overinvestment agency problem might be alleviated by the payment of dividends. In particular, by paying out all free cash flow to equity in dividends, managers would be constrained in their ability to overinvest by taking on negative NPV projects.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>Which of the following would best constrain management&#x27;s ability to overinvest by taking on negative NPV projects?<\/p><\/div>","subj":"corporate"},{"n":7,"q":"All else equal, which of the following factors is most likely to result in a decrease in the dividend payout ratio?","opts":["A decrease in flotation costs","A decrease in the volatility of earnings","An increase in profitable investment opportunities"],"ans":"C","expl":"C is Correct because a company with many profitable investment opportunities will tend to pay out less in dividends than a company with fewer opportunities because the former company will have more uses for internally generated cash flows.","explhtml":"<p>C is Correct because a company with many profitable investment opportunities will tend to pay out less in dividends than a company with fewer opportunities because the former company will have more uses for internally generated cash flows.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>All else equal, which of the following factors is most likely to result in a decrease in the dividend payout ratio?<\/p><\/div>","subj":"corporate"},{"n":8,"q":"All else being equal, a dividend increase would be most appropriate for which of the following companies?","opts":["A fast-growing tech company","A profitable company with only a few positive NPV projects","A company with volatile earnings that has posted strong profits in the current year"],"ans":"B","expl":"B is Correct because all else equal, a company with many profitable investment opportunities will tend to pay out less in dividends than a company with fewer opportunities because the former company will have more uses for internally EdZebInstitute generated cash flows. Internally generated cash flow is generally a cheaper source of equity funding than new equity issuance.","explhtml":"<p>B is Correct because all else equal, a company with many profitable investment opportunities will tend to pay out less in dividends than a company with fewer opportunities because the former company will have more uses for internally EdZebInstitute<\/p><p>generated cash flows. Internally generated cash flow is generally a cheaper source of equity funding than new equity issuance.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>All else being equal, a dividend increase would be most appropriate for which of the following companies?<\/p><\/div>","subj":"corporate"},{"n":9,"q":"A corporation operates in a jurisdiction that has a corporate tax rate of 25% and uses a dividend imputation tax system. If the corporation distributes all its after-tax income to shareholders, the effective tax rate on dividends of a shareholder whose marginal tax rate is 40% is:","opts":["25%.","40%.","55%."],"ans":"B","expl":"B is Correct because a second major taxation system is the dividend imputation tax system, which effectively ensures that corporate profits distributed as dividends are taxed just once, at the shareholder’s tax rate. In this case, the shareholder's tax rate is the marginal tax rate of 40%.","explhtml":"<p>B is Correct because a second major taxation system is the dividend imputation tax system, which effectively ensures that corporate profits distributed as dividends are taxed just once, at the shareholder’s tax rate. In this case, the shareholder&#x27;s tax rate is the marginal tax rate of 40%.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>A corporation operates in a jurisdiction that has a corporate tax rate of 25% and uses a dividend imputation tax system. If the corporation distributes all its after-tax income to shareholders, the effective tax rate on dividends of a shareholder whose marginal tax rate is 40% is:<\/p><\/div>","subj":"corporate"},{"n":10,"q":"An analyst gathers the following information about income tax rates in a jurisdiction with a split-rate tax system: Assuming a payout ratio of 100%, the effective tax rate on pretax income distributed in dividends is:","opts":["40%.","49%.","58%"],"ans":"B","expl":"B is Correct because under this system, corporate earnings that are distributed as dividends are taxed at a lower rate at the corporate level than earnings that are retained. At the level of the individual investor, dividends are taxed as ordinary income. Earnings distributed as dividends are still taxed twice, but the relatively low corporate tax rate on earnings mitigates that penalty. Effective tax rate on dividends = Corporate tax rate on earnings allocated to dividends + (1 – Corporate tax rate on earnings allocated to dividends) × Shareholder tax rate on dividends = 15% + (1 – 15%) × 40% = 49%","explhtml":"<p>B is Correct because under this system, corporate earnings that are distributed as dividends are taxed at a lower rate at the corporate level than earnings that are retained. At the level of the individual investor, dividends are taxed as ordinary income. Earnings distributed as dividends are still taxed twice, but the relatively low corporate tax rate on earnings mitigates that penalty. Effective tax rate on dividends = Corporate tax rate on earnings allocated to dividends + (1 – Corporate tax rate on earnings allocated to dividends) × Shareholder tax rate on dividends = 15% + (1 – 15%) × 40% = 49%<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>An analyst gathers the following information about income tax rates in a jurisdiction with a split-rate tax system:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp025.webp\" style=\"max-width:min(100%,550px)\" alt=\"\"><p>Assuming a payout ratio of 100%, the effective tax rate on pretax income distributed in dividends is:<\/p><\/div>","subj":"corporate"},{"n":11,"q":"Compared to a stable dividend policy, a constant dividend payout ratio policy would most likely result in:","opts":["gradual adjustment towards a target payout ratio.","dividends fluctuating with earnings in the short term.","less uncertainty for shareholders about future dividends. EdZebInstitute"],"ans":"B","expl":"B is Correct because with this type of dividend policy, dividends fluctuate with earnings in the short term. Constant dividend payout ratio policies are infrequently adopted in practice. In contrast, under a stable dividend policy, dividends over the period were either stable or rising—even while earnings experienced considerable variability.","explhtml":"<p>B is Correct because with this type of dividend policy, dividends fluctuate with earnings in the short term. Constant dividend payout ratio policies are infrequently adopted in practice. In contrast, under a stable dividend policy, dividends over the period were either stable or rising—even while earnings experienced considerable variability.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>Compared to a stable dividend policy, a constant dividend payout ratio policy would most likely result in:<\/p><\/div>","subj":"corporate"},{"n":12,"q":"An analyst gathers the following information about a company with a stable dividend policy: If the company uses a 3-year period to adjust its dividends, the expected increase in the current year dividend per share should be:","opts":["$0.10.","$0.20.","$0.30."],"ans":"A","expl":"A is Correct because Expected increase in dividends = (Expected earnings × Target payout ratio − Previous dividend) × Adjustment factor, where the adjustment factor is equal to 1 / Number of years to adjust dividends. In this case: Adjustment factor = 1/3 Expected increase in dividends = (2.50 × 36% − 2.00 × 30%) × 1/3 = 0.10 = $0.10","explhtml":"<p>A is Correct because Expected increase in dividends = (Expected earnings × Target payout ratio − Previous dividend) × Adjustment factor, where the adjustment factor is equal to 1 / Number of years to adjust dividends. In this case: Adjustment factor = 1/3 Expected increase in dividends = (2.50 × 36% − 2.00 × 30%) × 1/3 = 0.10 = $0.10<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company with a stable dividend policy:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp026.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>If the company uses a 3-year period to adjust its dividends, the expected increase in the current year dividend per share should be:<\/p><\/div>","subj":"corporate"},{"n":13,"q":"Which of the following share repurchase methods most likely has the highest cost for a company?","opts":["Fixed price tender offer","Dutch auction tender offer","Open market share repurchase"],"ans":"A","expl":"A is Correct because a fixed price tender offer can be accomplished quickly, but the company usually has to offer a premium. Obviously, this raises the cost of the buyback.","explhtml":"<p>A is Correct because a fixed price tender offer can be accomplished quickly, but the company usually has to offer a premium. Obviously, this raises the cost of the buyback.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>Which of the following share repurchase methods most likely has the highest cost for a company?<\/p><\/div>","subj":"corporate"},{"n":14,"q":"Which of the following share repurchase methods provides a company with the most flexibility?","opts":["Dutch auction","Fixed price tender offer","Open market repurchase"],"ans":"C","expl":"C is Correct because the open market share repurchase method gives the company maximum flexibility. Open market repurchases are the most flexible option for a company because there is no legal obligation to undertake or complete the repurchase program; a company may not follow through with an announced program for various reasons, such as unexpected cash needs for liquidity, acquisitions, or capital expenditures.","explhtml":"<p>C is Correct because the open market share repurchase method gives the company maximum flexibility. Open market repurchases are the most flexible option for a company because there is no legal obligation to undertake or complete the repurchase program; a company may not follow through with an announced program for various reasons, such as unexpected cash needs for liquidity, acquisitions, or capital expenditures.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>Which of the following share repurchase methods provides a company with the most flexibility?<\/p><\/div>","subj":"corporate"},{"n":15,"q":"An analyst gathers the following information about a company that plans to issue new debt to repurchase shares: As a result of the share repurchase, the company's EPS will:","opts":["decrease.","not change.","increase."],"ans":"C","expl":"C is Correct because in the case of external financing, the effect on EPS is positive if the earnings yield exceeds the after-tax cost of financing the repurchase. The earnings yield, the ratio of earnings per share to share price, is 3/ 40 = 7.5%. Since EdZebInstitute this value is greater than 7%, the after-tax cost of new debt, the share repurchase will have a positive effect on EPS.","explhtml":"<p>C is Correct because in the case of external financing, the effect on EPS is positive if the earnings yield exceeds the after-tax cost of financing the repurchase. The earnings yield, the ratio of earnings per share to share price, is 3/ 40 = 7.5%. Since EdZebInstitute<\/p><p>this value is greater than 7%, the after-tax cost of new debt, the share repurchase will have a positive effect on EPS.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company that plans to issue new debt to repurchase shares:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp027.webp\" style=\"max-width:min(100%,555px)\" alt=\"\"><p>As a result of the share repurchase, the company&#x27;s EPS will:<\/p><\/div>","subj":"corporate"},{"n":16,"q":"An analyst gathers the following information about a company: • Current share price: $100 • Latest reported annual earnings after taxes: $45 million • Shares outstanding: 4.5 million EdZebInstitute • After-tax cost of debt: 7% If the company plans to raise $25 million in debt to repurchase 250,000 shares, its EPS after the share repurchase will be closest to:","opts":["$9.6.","$10.2.","$10.6."],"ans":"B","expl":"B is Correct because EPS after buyback = (After-tax Earnings – After-tax cost of funds)/Shares outstanding after buyback After-tax Earnings minus after-tax cost of funds = $45,000,000 – ($25,000,000 × 7%) = $43,250,000 EPS after buyback = $43,250,000/(4,500,000 – 250,000) = $10.17647 ≈ $10.2.","explhtml":"<p>B is Correct because EPS after buyback = (After-tax Earnings – After-tax cost of funds)/Shares outstanding after buyback After-tax Earnings minus after-tax cost of funds = $45,000,000 – ($25,000,000 × 7%) = $43,250,000 EPS after buyback = $43,250,000/(4,500,000 – 250,000) = $10.17647 ≈ $10.2.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company: • Current share price: $100 • Latest reported annual earnings after taxes: $45 million • Shares outstanding: 4.5 million EdZebInstitute<\/p><p>• After-tax cost of debt: 7% If the company plans to raise $25 million in debt to repurchase 250,000 shares, its EPS after the share repurchase will be closest to:<\/p><\/div>","subj":"corporate"},{"n":17,"q":"An analyst gathers the following information about a company: • Share price: $50 • Shares outstanding: 100 million • Book value of equity: $6,000 million If the company completes a $400 million share buyback at the current market price, the book value per share after the transaction will be closest to:","opts":["$56.","$61.","$65."],"ans":"B","expl":"B is Correct because the number of repurchased (bought back) shares = $400 million/$50 = 8 million. Then the number of outstanding shares = 100 million – 8 million = 92 million. The new equity book value = $6,000 million – $400 million = $5,600 million. New BVPS = $5,600 million/92 million = $60.869565 ≈ $61.","explhtml":"<p>B is Correct because the number of repurchased (bought back) shares = $400 million/$50 = 8 million. Then the number of outstanding shares = 100 million – 8 million = 92 million. The new equity book value = $6,000 million – $400 million = $5,600 million. New BVPS = $5,600 million/92 million = $60.869565 ≈ $61.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a company: • Share price: $50 • Shares outstanding: 100 million • Book value of equity: $6,000 million If the company completes a $400 million share buyback at the current market price, the book value per share after the transaction will be closest to:<\/p><\/div>","subj":"corporate"},{"n":18,"q":"An analyst gathers the following information about the common stock of a company that is planning to buy back shares: After the repurchase of 400 thousand shares at the market price, the company's book value per share will be closest to:","opts":["$18.89.","$19.77.","$20.93."],"ans":"B","expl":"B is Correct because when the market price per share is greater than its book value per share, BVPS will decrease after the share repurchase. After the repurchase, the company will have 8.6 million shares outstanding (9 million pre-buyback shares − 0.4 million repurchased shares = 8.6 million shares). In addition, its shareholders’ equity at book value falls to $170 million ($20 × 9 million − $25 × 0.4 million). As a result, its book value per share decreases to: shareholders’ equity/shares outstanding = $170 million / 8.6 million shares = 19.767442 ≈ $19.77.","explhtml":"<p>B is Correct because when the market price per share is greater than its book value per share, BVPS will decrease after the share repurchase. After the repurchase, the company will have 8.6 million shares outstanding (9 million pre-buyback shares − 0.4 million repurchased shares = 8.6 million shares). In addition, its shareholders’ equity at book value falls to $170 million ($20 × 9 million − $25 × 0.4 million). As a result, its book value per share decreases to: shareholders’ equity/shares outstanding = $170 million / 8.6 million shares = 19.767442 ≈ $19.77.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>An analyst gathers the following information about the common stock of a company that is planning to buy back shares:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp028.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>After the repurchase of 400 thousand shares at the market price, the company&#x27;s book value per share will be closest to:<\/p><\/div>","subj":"corporate"},{"n":19,"q":"Which payout methods are best suited for distributing extraordinary increases in a company's cash flow that are not expected to continue in future years?","opts":["Regular and special cash dividends","Special cash dividends and share repurchases","Regular cash dividends and share repurchases"],"ans":"B","expl":"B is Correct because a company can use both special cash dividends and share repurchases as a supplement to regular cash dividends. These means of distributing cash are often used in years when there are large and extraordinary increases in cash flow that are not expected to continue in future years. In making these types of payments, the company essentially communicates that the distribution, like the increase in cash flow, should not be expected to continue in the future.","explhtml":"<p>B is Correct because a company can use both special cash dividends and share repurchases as a supplement to regular cash dividends. These means of distributing cash are often used in years when there are large and extraordinary increases in cash flow that are not expected to continue in future years. In making these types of payments, the company essentially communicates that the distribution, like the increase in cash flow, should not be expected to continue in the future.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>Which payout methods are best suited for distributing extraordinary increases in a company&#x27;s cash flow that are not expected to continue in future years?<\/p><\/div>","subj":"corporate"},{"n":20,"q":"Which of the following is most likely a motivation for a company using share repurchases rather than cash dividends to distribute earnings to shareholders?","opts":["To decrease the company's financial leverage","To signal that the company's prospects are positive EdZebInstitute","To create the expectation of future share repurchases"],"ans":"B","expl":"B is Correct because the announcement of a share repurchase program is often understood as a positive signal about the company’s prospects and attractiveness as an investment.","explhtml":"<p>B is Correct because the announcement of a share repurchase program is often understood as a positive signal about the company’s prospects and attractiveness as an investment.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>Which of the following is most likely a motivation for a company using share repurchases rather than cash dividends to distribute earnings to shareholders?<\/p><\/div>","subj":"corporate"},{"n":21,"q":"Which of the following statements regarding trends in payout policies is most accurate?","opts":["There is evidence of a positive relationship between dividend initiations and enhanced corporate transparency","Globally, aggregate dividend amounts have generally increased over time while payout ratios have declined","Dividend payers are, on average, larger and more profitable companies that spend less in R&D compared to non-dividend payers"],"ans":"C","expl":"C is Correct because the dividend payers are, on average, larger, more profitable, have fewer growth opportunities, and spend less on R&D compared to the non- dividend payers.","explhtml":"<p>C is Correct because the dividend payers are, on average, larger, more profitable, have fewer growth opportunities, and spend less on R&amp;D compared to the non- dividend payers.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>Which of the following statements regarding trends in payout policies is most accurate?<\/p><\/div>","subj":"corporate"},{"n":22,"q":"Based on global trends in corporate payout policies, which of the following has generally decreased over time?","opts":["Dividend payout ratios","Aggregate dividend amounts paid","Percentage of companies paying dividends"],"ans":"A","expl":"A is Correct because research on dividend behavior globally shows that aggregate dividend amounts as well as payout ratios have generally increased over time.","explhtml":"<p>A is Correct because research on dividend behavior globally shows that aggregate dividend amounts as well as payout ratios have generally increased over time.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>Based on global trends in corporate payout policies, which of the following has generally decreased over time?<\/p><\/div>","subj":"corporate"},{"n":23,"q":"An analyst gathers the following financial statement data of three companies financials for the most recent fiscal year (amounts are in $ millions): Based on the FCFE coverage ratio, the company with the greatest dividend safety is:","opts":["Company A","Company B.","Company C."],"ans":"A","expl":"A is Correct because under the FCFE method Company A has the greatest dividend safety. EdZebInstitute FCFE coverage ratio = FCFE/(Dividends + Share Repurchases) FCFE = Cash flow from operations – Capital expenditures + Net borrowing FCFE Company A = 745 – 315 + (100) = 330 FCFE Company B = 810 – 432 + (250) = 128 FCFE Company C = 295 – 75 + (85) = 135 FCFE Coverage Ratio Company A = 330/(135 + 65) = 1.65 FCFE Coverage Ratio Company B = 128/(40 + 70) = 1.16 FCFE Coverage Ratio Company C = 135/(45 + 50) = 1.42","explhtml":"<p>A is Correct because under the FCFE method Company A has the greatest dividend safety. EdZebInstitute<\/p><p>FCFE coverage ratio = FCFE/(Dividends + Share Repurchases) FCFE = Cash flow from operations – Capital expenditures + Net borrowing FCFE Company A = 745 – 315 + (100) = 330 FCFE Company B = 810 – 432 + (250) = 128 FCFE Company C = 295 – 75 + (85) = 135 FCFE Coverage Ratio Company A = 330/(135 + 65) = 1.65 FCFE Coverage Ratio Company B = 128/(40 + 70) = 1.16 FCFE Coverage Ratio Company C = 135/(45 + 50) = 1.42<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>An analyst gathers the following financial statement data of three companies financials for the most recent fiscal year (amounts are in $ millions):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp029.webp\" style=\"max-width:min(100%,563px)\" alt=\"\"><p>Based on the FCFE coverage ratio, the company with the greatest dividend safety is:<\/p><\/div>","subj":"corporate"},{"n":24,"q":"An analyst gathers the following information (in $ millions) about a company: The company's FCFE coverage ratio is closest to: EdZebInstitute","opts":["1.27x.","2.29x.","2.84x."],"ans":"A","expl":"A is Correct because FCFE coverage ratio = FCFE/[Dividends + Share repurchases]. Based on the provided inputs: FCFE coverage ratio = 492 / (215 + 173) = 1.268041 ≈ 1.27x","explhtml":"<p>A is Correct because FCFE coverage ratio = FCFE/[Dividends + Share repurchases]. Based on the provided inputs: FCFE coverage ratio = 492 / (215 + 173) = 1.268041 ≈ 1.27x<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>An analyst gathers the following information (in $ millions) about a company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp030.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>The company&#x27;s FCFE coverage ratio is closest to: EdZebInstitute<\/p><\/div>","subj":"corporate"},{"n":25,"q":"Which of the following is most likely an early signal that a company might not be able to sustain its cash dividend?","opts":["Dividends being financed by new debt","Dividend yield at the lowest historical level","Dividend coverage ratio consistently increasing"],"ans":"A","expl":"A is Correct because analysts should be particularly alert to companies that support their dividends and stock repurchases by reducing productive capital spending or by adding net debt or by some combination of the two because these neither are sustainable policies.","explhtml":"<p>A is Correct because analysts should be particularly alert to companies that support their dividends and stock repurchases by reducing productive capital spending or by adding net debt or by some combination of the two because these neither are sustainable policies.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>Which of the following is most likely an early signal that a company might not be able to sustain its cash dividend?<\/p><\/div>","subj":"corporate"},{"n":26,"q":"An analyst gathers the following information of three companies in the same industry: If the earnings of all three companies are expected to decline by 20% due to a business downturn, which company has the highest risk of a dividend cut?","opts":["Company A","Company B","Company C"],"ans":"C","expl":"C is Correct because higher dividend payout ratios (or lower dividend coverage ratios) often constitute a risk factor that a dividend may be cut if earnings decline. High dividend payout ratios in relation to those of peer group companies may also point to dividend safety concerns. Company C has the lowest dividend coverage ratio. An earnings decline will likely reduce this ratio so that a dividend cut would be the most likely among the three companies.","explhtml":"<p>C is Correct because higher dividend payout ratios (or lower dividend coverage ratios) often constitute a risk factor that a dividend may be cut if earnings decline. High dividend payout ratios in relation to those of peer group companies may also point to dividend safety concerns. Company C has the lowest dividend coverage ratio. An earnings decline will likely reduce this ratio so that a dividend cut would be the most likely among the three companies.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Dividends and Share Repurchases<\/div><div class=\"qtext\"><p>An analyst gathers the following information of three companies in the same industry:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp031.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>If the earnings of all three companies are expected to decline by 20% due to a business downturn, which company has the highest risk of a dividend cut?<\/p><\/div>","subj":"corporate"},{"n":27,"q":"An analyst believes that a company is undervalued due to a perceived lack of focus on certain business lines. The analyst would most likely recommend that the company consider a(n):","opts":["acquisition.","divestment.","balance sheet restructuring."],"ans":"B","expl":"B is Correct because common issuer-specific motivations to sell include focus, valuation, liquidity, and regulatory requirements. An issuer trading at a valuation lower than the sum of its parts is said to have a conglomerate discount, which is generally the result of diseconomies of scale or scope, owing to a deficit in focus, management effort, or investment; due to incompatible businesses; or because the capital markets have overlooked the business and its prospects a divestment transaction intended to reduce the conglomerate discount and realize that value for its stakeholders.","explhtml":"<p>B is Correct because common issuer-specific motivations to sell include focus, valuation, liquidity, and regulatory requirements. An issuer trading at a valuation lower than the sum of its parts is said to have a conglomerate discount, which is generally the result of diseconomies of scale or scope, owing to a deficit in focus, management effort, or investment; due to incompatible businesses; or because the capital markets have overlooked the business and its prospects a divestment transaction intended to reduce the conglomerate discount and realize that value for its stakeholders.<\/p>","qhtml":"<div class=\"pp-topic\">Corporate Restructuring<\/div><div class=\"qtext\"><p>An analyst believes that a company is undervalued due to a perceived lack of focus on certain business lines. The analyst would most likely recommend that the company consider a(n):<\/p><\/div>","subj":"corporate"},{"n":28,"q":"Which of the following is a type of balance sheet restructuring?","opts":["Franchising","Outsourcing","Sale leaseback"],"ans":"C","expl":"C is Correct because two common balance sheet restructuring transactions are sale leasebacks and dividend recapitalization.","explhtml":"<p>C is Correct because two common balance sheet restructuring transactions are sale leasebacks and dividend recapitalization.<\/p>","qhtml":"<div class=\"pp-topic\">Corporate Restructuring<\/div><div class=\"qtext\"><p>Which of the following is a type of balance sheet restructuring?<\/p><\/div>","subj":"corporate"},{"n":29,"q":"The initial evaluation phase of a corporate restructuring typically includes:","opts":["modeling the pro forma financial statements.","determining the materiality of the restructuring.","conducting a preliminary valuation of the transaction EdZebInstitute"],"ans":"B","expl":"B is Correct because the third question in the initial evaluation step is determining materiality.","explhtml":"<p>B is Correct because the third question in the initial evaluation step is determining materiality.<\/p>","qhtml":"<div class=\"pp-topic\">Corporate Restructuring<\/div><div class=\"qtext\"><p>The initial evaluation phase of a corporate restructuring typically includes:<\/p><\/div>","subj":"corporate"},{"n":30,"q":"With regard to an analyst’s initial evaluation of a corporate restructuring, which of the following are two dimensions of materiality?","opts":["Size and fit","Fit and timing","Size and timing"],"ans":"A","expl":"A is Correct because an analyst’s initial evaluation of a corporate restructuring involves answering four questions: What is happening? Why is it happening? Is it material? When is it happening? The third question in the initial evaluation step is EdZebInstitute determining materiality. Materiality can be defined in this context along two dimensions: size and fit.","explhtml":"<p>A is Correct because an analyst’s initial evaluation of a corporate restructuring involves answering four questions: What is happening? Why is it happening? Is it material? When is it happening? The third question in the initial evaluation step is EdZebInstitute<\/p><p>determining materiality. Materiality can be defined in this context along two dimensions: size and fit.<\/p>","qhtml":"<div class=\"pp-topic\">Corporate Restructuring<\/div><div class=\"qtext\"><p>With regard to an analyst’s initial evaluation of a corporate restructuring, which of the following are two dimensions of materiality?<\/p><\/div>","subj":"corporate"},{"n":31,"q":"A comparable company analysis:","opts":["is sensitive to market mispricing.","estimates a fair takeover price for a target company.","is used more often for valuing acquisition targets rather than for spin offs"],"ans":"A","expl":"A is Correct because a comparable company analysis is sensitive to market mispricing. Suppose that all the comparable companies are currently overvalued by the market. A valuation relative to those companies may suggest a value that is too high, should the values be revised downward upon a correction.","explhtml":"<p>A is Correct because a comparable company analysis is sensitive to market mispricing. Suppose that all the comparable companies are currently overvalued by the market. A valuation relative to those companies may suggest a value that is too high, should the values be revised downward upon a correction.<\/p>","qhtml":"<div class=\"pp-topic\">Corporate Restructuring<\/div><div class=\"qtext\"><p>A comparable company analysis:<\/p><\/div>","subj":"corporate"},{"n":32,"q":"Company X is evaluating the takeover of Company Y. The CFO of Company X analyzes the following data of three comparable companies that were recently acquired. Amounts are in $ per share. Company Y has an EPS of $6.50. Based on comparable transaction analysis using the mean valuation ratio, the fair takeover value of the Company Y is closest to:","opts":["$14.","$50.","$64."],"ans":"C","expl":"C is Correct because this is the value based on the average takeover P/E ratio of the three comparable companies, multiplied by the earnings of the target company. Company 1: 21/2.50 = 8.4 Company 2: 16/1.60 = 10 Company 3: 36/3.20 = 11.25 Average takeover P/E = (8.4 + 10 + 11.25)/3 = 9.8833 Target company EPS of 6.5 × 9.8833 = 64.24 ≈ 64","explhtml":"<p>C is Correct because this is the value based on the average takeover P/E ratio of the three comparable companies, multiplied by the earnings of the target company. Company 1: 21/2.50 = 8.4 Company 2: 16/1.60 = 10 Company 3: 36/3.20 = 11.25 Average takeover P/E = (8.4 + 10 + 11.25)/3 = 9.8833 Target company EPS of 6.5 × 9.8833 = 64.24 ≈ 64<\/p>","qhtml":"<div class=\"pp-topic\">Corporate Restructuring<\/div><div class=\"qtext\"><p>Company X is evaluating the takeover of Company Y. The CFO of Company X analyzes the following data of three comparable companies that were recently acquired. Amounts are in $ per share.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp032.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>Company Y has an EPS of $6.50. Based on comparable transaction analysis using the mean valuation ratio, the fair takeover value of the Company Y is closest to:<\/p><\/div>","subj":"corporate"},{"n":33,"q":"A company acquires another company that has a similar structure. If the acquisition is financed entirely with new equity, and both the cost of debt and the cost of equity of the issuer are not expected to change after the transaction, the WACC of the acquirer would most likely:","opts":["decrease.","not change.","increase."],"ans":"C","expl":"C is Correct because both companies have a similar capital structure, so the combined capital structure should be similar. But considering the new equity raised, the weight of equity in the capital structure of WACC should increase relative to the weight of debt. Because the cost of equity is normally higher than cost of debt, WACC should increase.","explhtml":"<p>C is Correct because both companies have a similar capital structure, so the combined capital structure should be similar. But considering the new equity raised, the weight of equity in the capital structure of WACC should increase relative to the weight of debt. Because the cost of equity is normally higher than cost of debt, WACC should increase.<\/p>","qhtml":"<div class=\"pp-topic\">Corporate Restructuring<\/div><div class=\"qtext\"><p>A company acquires another company that has a similar structure. If the acquisition is financed entirely with new equity, and both the cost of debt and the cost of equity of the issuer are not expected to change after the transaction, the WACC of the acquirer would most likely:<\/p><\/div>","subj":"corporate"},{"n":34,"q":"An analyst gathers the following information about two companies: Company A recently announced its intent to acquire Company B. To fund the acquisition, Company A will issue 50 million new shares, raise $7 billion in new debt, EdZebInstitute and fund the remainder with cash on hand. Company A will also repay Company B's outstanding debt using proceeds from the debt issuance. The book value of Company A's debt is equal to its market value. If the share prices remain unchanged following the acquisition, the weight of debt in Company A's capital structure as a result of the acquisition of Company B is closest to:","opts":["32%.","35%.","38%."],"ans":"B","expl":"B is Correct because following the acquisition, Company's A debt amounts to $22 billion + $7 billion = $29 billion. Its number of shares outstanding will be 500 million + 50 million = 550 million, thus resulting in total equity of 550 million × $100 = $55 billion. The weight of debt is then $29 billion/($29 billion + $55 billion) = 0.3452 ≈ 35%","explhtml":"<p>B is Correct because following the acquisition, Company&#x27;s A debt amounts to $22 billion + $7 billion = $29 billion. Its number of shares outstanding will be 500 million + 50 million = 550 million, thus resulting in total equity of 550 million × $100 = $55 billion. The weight of debt is then $29 billion/($29 billion + $55 billion) = 0.3452 ≈ 35%<\/p>","qhtml":"<div class=\"pp-topic\">Corporate Restructuring<\/div><div class=\"qtext\"><p>An analyst gathers the following information about two companies:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp033.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>Company A recently announced its intent to acquire Company B. To fund the acquisition, Company A will issue 50 million new shares, raise $7 billion in new debt, EdZebInstitute<\/p><p>and fund the remainder with cash on hand. Company A will also repay Company B&#x27;s outstanding debt using proceeds from the debt issuance. The book value of Company A&#x27;s debt is equal to its market value. If the share prices remain unchanged following the acquisition, the weight of debt in Company A&#x27;s capital structure as a result of the acquisition of Company B is closest to:<\/p><\/div>","subj":"corporate"},{"n":35,"q":"A company seeking a modest investment in a complementary and strategic business, along with meaningful operational control, will most likely prefer a(n):","opts":["acquisition.","joint venture.","minority equity investment."],"ans":"B","expl":"B is Correct because a joint venture typically has higher operational control than a minority investment, but a smaller investment than with an acquisition. Joint ventures are technically a type of equity investment (in a newly formed company) but are often larger than equity investments in several respects: size, operational control over joint venture, and time spent by management.","explhtml":"<p>B is Correct because a joint venture typically has higher operational control than a minority investment, but a smaller investment than with an acquisition. Joint ventures are technically a type of equity investment (in a newly formed company) but are often larger than equity investments in several respects: size, operational control over joint venture, and time spent by management.<\/p>","qhtml":"<div class=\"pp-topic\">Corporate Restructuring<\/div><div class=\"qtext\"><p>A company seeking a modest investment in a complementary and strategic business, along with meaningful operational control, will most likely prefer a(n):<\/p><\/div>","subj":"corporate"},{"n":36,"q":"Compared to an acquisition, an equity investment:","opts":["ensures greater control of the target.","requires a smaller capital investment.","results in a larger combined balance sheet."],"ans":"B","expl":"B is Correct because for acquisitions, substantially greater capital investment is required compared to equity investments.","explhtml":"<p>B is Correct because for acquisitions, substantially greater capital investment is required compared to equity investments.<\/p>","qhtml":"<div class=\"pp-topic\">Corporate Restructuring<\/div><div class=\"qtext\"><p>Compared to an acquisition, an equity investment:<\/p><\/div>","subj":"corporate"},{"n":37,"q":"A company has received a $625 million offer for its healthcare division, which has an EBITDA of $45 million. Peer companies are valued at an average EV/EBITDA of 14.5. The company's investment banker suggests that the company can spin off the division at 15 times EBITDA, less 5% in flotation costs. The best option for the company would be to:","opts":["sell the business.","retain the business.","spin off the business."],"ans":"B","expl":"B is Correct because the healthcare division has a higher valuation when compared to peers versus either a spin off or a sale. The offer for the company is 625/45 = 13.89 EV/EBITDA. Comparable companies are valued at 14.5 EV/EBITDA. EdZebInstitute A spinoff would be valued at 15 times less 5% for flotation costs, or 14.25 EV/EBITDA (($45 x 15 x 0.95/$45)).","explhtml":"<p>B is Correct because the healthcare division has a higher valuation when compared to peers versus either a spin off or a sale. The offer for the company is 625/45 = 13.89 EV/EBITDA. Comparable companies are valued at 14.5 EV/EBITDA. EdZebInstitute<\/p><p>A spinoff would be valued at 15 times less 5% for flotation costs, or 14.25 EV/EBITDA (($45 x 15 x 0.95/$45)).<\/p>","qhtml":"<div class=\"pp-topic\">Corporate Restructuring<\/div><div class=\"qtext\"><p>A company has received a $625 million offer for its healthcare division, which has an EBITDA of $45 million. Peer companies are valued at an average EV/EBITDA of 14.5. The company&#x27;s investment banker suggests that the company can spin off the division at 15 times EBITDA, less 5% in flotation costs. The best option for the company would be to:<\/p><\/div>","subj":"corporate"},{"n":38,"q":"A company is comprised of two operating segments, Segment A and Segment B. The company trades at an EV of €785 million, with an implied conglomerate discount of €100 million based on peer valuations. Financial information on the two segments is provided below: • Peer median EV/EBITDA multiple for Segment A: 5.0 • Segment A EBITDA: €50 million • Segment B EBITDA: €80 million The company receives a bid for Segment B, valuing it at an EV/EBITDA of 5.4. The bid:","opts":["undervalues Segment B.","fairly values Segment B.","overvalues Segment B. EdZebInstitute"],"ans":"A","expl":"A is Correct because the EV/EBITDA for Segment B is 7.9. Using the formula Conglomerate Discount = Sum of Valuation of Segment A and B – EV = EV/EBITDAA × EBITDAA + EV/EBITDAB × EBITDAB – EV implies that EV/EBITDAB × EBITDAB = Conglomerate Discount + EV – EV/EBITDAA × EBITDAA = €100 + €785 – €5 × €50 = €635 million. Thus EV/EBITDAB = €635/€80 = 7.94 = 7.9.","explhtml":"<p>A is Correct because the EV/EBITDA for Segment B is 7.9. Using the formula Conglomerate Discount = Sum of Valuation of Segment A and B – EV = EV/EBITDAA × EBITDAA + EV/EBITDAB × EBITDAB – EV implies that EV/EBITDAB × EBITDAB = Conglomerate Discount + EV – EV/EBITDAA × EBITDAA = €100 + €785 – €5 × €50 = €635 million. Thus EV/EBITDAB = €635/€80 = 7.94 = 7.9.<\/p>","qhtml":"<div class=\"pp-topic\">Corporate Restructuring<\/div><div class=\"qtext\"><p>A company is comprised of two operating segments, Segment A and Segment B. The company trades at an EV of €785 million, with an implied conglomerate discount of €100 million based on peer valuations. Financial information on the two segments is provided below:<\/p><p>• Peer median EV/EBITDA multiple for Segment A: 5.0 • Segment A EBITDA: €50 million • Segment B EBITDA: €80 million The company receives a bid for Segment B, valuing it at an EV/EBITDA of 5.4. The bid:<\/p><\/div>","subj":"corporate"},{"n":39,"q":"An analyst gathers the following data about a conglomerate with two segments (Segment Y and Segment Z) and compares the data with its peers. If the conglomerate's market value of equity is $130 million and its net debt is $10 million, the conglomerate discount (in $ millions) is closest to:","opts":["32.2.","77.2.","97.2."],"ans":"B","expl":"B is Correct because the conglomerate discount is calculated using the sum-of-the- parts approach as follows:","explhtml":"<p>B is Correct because the conglomerate discount is calculated using the sum-of-the- parts approach as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp046.webp\" style=\"max-width:min(100%,721px)\" alt=\"\">","qhtml":"<div class=\"pp-topic\">Corporate Restructuring<\/div><div class=\"qtext\"><p>An analyst gathers the following data about a conglomerate with two segments (Segment Y and Segment Z) and compares the data with its peers.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp034.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>If the conglomerate&#x27;s market value of equity is $130 million and its net debt is $10 million, the conglomerate discount (in $ millions) is closest to:<\/p><\/div>","subj":"corporate"},{"n":40,"q":"An analyst gathers the following information (in $ millions) about Apex Inc. and three competitors: Apex management has decided to undertake a cost restructuring plan. To reach its peer median EBIT margin level, the amount of operating cost savings (in $ millions) Apex must achieve is closest to:","opts":["32.","36.","40. EdZebInstitute"],"ans":"C","expl":"C is Correct because to calculate the operating cost savings required, we must first determine the peer median EBIT margin: The peer median EBIT margin is 30%. Therefore, Apex must reduce costs by 30% – 10% = 20%. So, to reach the median peer EBIT level, Apex must reduce costs by $200 million × 20% = $40 million.","explhtml":"<p>C is Correct because to calculate the operating cost savings required, we must first determine the peer median EBIT margin:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp047.webp\" style=\"max-width:min(100%,716px)\" alt=\"\"><p>The peer median EBIT margin is 30%. Therefore, Apex must reduce costs by 30% – 10% = 20%. So, to reach the median peer EBIT level, Apex must reduce costs by $200 million × 20% = $40 million.<\/p>","qhtml":"<div class=\"pp-topic\">Corporate Restructuring<\/div><div class=\"qtext\"><p>An analyst gathers the following information (in $ millions) about Apex Inc. and three competitors:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp035.webp\" style=\"max-width:min(100%,555px)\" alt=\"\"><p>Apex management has decided to undertake a cost restructuring plan. To reach its peer median EBIT margin level, the amount of operating cost savings (in $ millions) Apex must achieve is closest to:<\/p><\/div>","subj":"corporate"},{"n":41,"q":"An analyst is evaluating GutWare, a European consumer goods company that is restructuring its cost structure to increase shareholder value. The analyst gathers the following summary financial data for GutWare and five peer companies: If GutWare's EBIT margin were equal to that of the peer group median, its operating costs (in GBP millions) would total:","opts":["41,057.","41,195.","41,623."],"ans":"B","expl":"B is Correct because operating costs would need to be GBP 41,195 million to bring GutWare’s EBIT margin in line with the peer group median EBIT margin of 23%. The peer median EBIT margin is 23%, calculated as the median of (17, 19, 23, 25, 27). For GutWare’s EBIT margin (calculated as EBIT/Revenues) to be in line with the peer group median of 23% its operating profit would need to be GBP 53,500 million × 0.23 EdZebInstitute = GBP 12,305 million. Since, Revenues – Operating Costs = Operating Profit, this would imply operating costs of GBP 53,500 million – GBP 12,305 million = GBP 41,195 million.","explhtml":"<p>B is Correct because operating costs would need to be GBP 41,195 million to bring GutWare’s EBIT margin in line with the peer group median EBIT margin of 23%. The peer median EBIT margin is 23%, calculated as the median of (17, 19, 23, 25, 27). For GutWare’s EBIT margin (calculated as EBIT/Revenues) to be in line with the peer group median of 23% its operating profit would need to be GBP 53,500 million × 0.23 EdZebInstitute<\/p><p>= GBP 12,305 million. Since, Revenues – Operating Costs = Operating Profit, this would imply operating costs of GBP 53,500 million – GBP 12,305 million = GBP 41,195 million.<\/p>","qhtml":"<div class=\"pp-topic\">Corporate Restructuring<\/div><div class=\"qtext\"><p>An analyst is evaluating GutWare, a European consumer goods company that is restructuring its cost structure to increase shareholder value. The analyst gathers the following summary financial data for GutWare and five peer companies:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp036.webp\" style=\"max-width:min(100%,552px)\" alt=\"\"><p>If GutWare&#x27;s EBIT margin were equal to that of the peer group median, its operating costs (in GBP millions) would total:<\/p><\/div>","subj":"corporate"},{"n":42,"q":"With respect to corporate ownership structures, the principal–agent conflict caused by the combination of dispersed ownership and dispersed voting power is best mitigated through:","opts":["voting caps.","controlling shareholders.","insiders with large ownership positions."],"ans":"B","expl":"B is Correct because the combination of dispersed ownership and dispersed voting power is generally associated with shareholders who lack the power to exercise control over managers. These shareholders are referred to as weak shareholders, and such managers are referred to as strong managers. Under this combination, conflict between the shareholders and managers of a corporation may be significant. Shareholders are interested in maximizing shareholder value. There is a risk, however, that managers will seek to use a company’s resources to pursue their own interests. In corporate governance, this conflict is known as a principal–agent problem. This problem can be mitigated if controlling shareholders are present because they may be able to control the board of directors (and, in turn, the appointment of managers) and have the incentive to monitor management.","explhtml":"<p>B is Correct because the combination of dispersed ownership and dispersed voting power is generally associated with shareholders who lack the power to exercise control over managers. These shareholders are referred to as weak shareholders, and such managers are referred to as strong managers. Under this combination, conflict between the shareholders and managers of a corporation may be significant. Shareholders are interested in maximizing shareholder value. There is a risk, however, that managers will seek to use a company’s resources to pursue their own interests. In corporate governance, this conflict is known as a principal–agent problem. This problem can be mitigated if controlling shareholders are present because they may be able to control the board of directors (and, in turn, the appointment of managers) and have the incentive to monitor management.<\/p>","qhtml":"<div class=\"pp-topic\">Environmental, Social, and Governance (ESG) Considerations in Investment Analysis<\/div><div class=\"qtext\"><p>With respect to corporate ownership structures, the principal–agent conflict caused by the combination of dispersed ownership and dispersed voting power is best mitigated through:<\/p><\/div>","subj":"corporate"},{"n":43,"q":"Shareholder control over a company's management is least likely if the company has:","opts":["dispersed ownership and dispersed voting power.","dispersed ownership and concentrated voting power.","concentrated ownership and concentrated voting power."],"ans":"A","expl":"A is Correct because the combination of dispersed ownership and dispersed voting power is generally associated with shareholders who lack the power to exercise control over managers. These shareholders are referred to as weak shareholders, and such managers are referred to as strong managers. Under this combination, conflict between the shareholders and managers of a corporation may be significant
