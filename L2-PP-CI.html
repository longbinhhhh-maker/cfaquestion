.","explhtml":"<p>A is Correct because the combination of dispersed ownership and dispersed voting power is generally associated with shareholders who lack the power to exercise control over managers. These shareholders are referred to as weak shareholders, and such managers are referred to as strong managers. Under this combination, conflict between the shareholders and managers of a corporation may be significant.<\/p>","qhtml":"<div class=\"pp-topic\">Environmental, Social, and Governance (ESG) Considerations in Investment Analysis<\/div><div class=\"qtext\"><p>Shareholder control over a company&#x27;s management is least likely if the company has:<\/p><\/div>","subj":"corporate"},{"n":44,"q":"An analyst observes the following governance characteristics of a company: • Characteristic 1: The number of executive directors is greater than the number of independent directors. • Characteristic 2: The key board committees have a majority of independent members. • Characteristic 3: The chief executive officer (CEO) also serves as chairperson of the board.Which characteristic best reflects effective corporate governance?","opts":["Characteristic 1","Characteristic 2 EdZebInstitute","Characteristic 3"],"ans":"B","expl":"B is Correct because investors assess whether there are sufficiently independent committees that focus on key governance concerns, such as audit, compensation, and the selection of directors. The presence of non-independent committee members or executive directors may prompt the consideration of potential conflicts of interest or biases. Therefore, this is an example of effective corporate governance.","explhtml":"<p>B is Correct because investors assess whether there are sufficiently independent committees that focus on key governance concerns, such as audit, compensation, and the selection of directors. The presence of non-independent committee members or executive directors may prompt the consideration of potential conflicts of interest or biases. Therefore, this is an example of effective corporate governance.<\/p>","qhtml":"<div class=\"pp-topic\">Environmental, Social, and Governance (ESG) Considerations in Investment Analysis<\/div><div class=\"qtext\"><p>An analyst observes the following governance characteristics of a company: • Characteristic 1: The number of executive directors is greater than the number of independent directors. • Characteristic 2: The key board committees have a majority of independent members. • Characteristic 3: The chief executive officer (CEO) also serves as chairperson of the board.Which characteristic best reflects effective corporate governance?<\/p><\/div>","subj":"corporate"},{"n":45,"q":"An analyst gathers the following information about three companies: All else being equal, which of the companies most likely has the weakest corporate governance?","opts":["Company 1","Company 2","Company 3"],"ans":"B","expl":"B is Correct because neither a high percentage of independent directors nor the CEO serving as chairperson (CEO duality) supports good corporate governance. The absence or presence of a minority of independent directors is a negative aspect of corporate governance. Without independent directors, the potential exists for management to act in a self-serving manner. Consequently a lack of independent directors on a board may increase investors' perception of the corporation's risk. Also, separation of the roles of CEO and chairperson is an example of a strong corporate governance practice that reduces potential risks for shareholders. In case of CEO duality, the concern may be that the monitoring and oversight role of the board may be compromised relative to independent chairperson and CEO roles.","explhtml":"<p>B is Correct because neither a high percentage of independent directors nor the CEO serving as chairperson (CEO duality) supports good corporate governance. The absence or presence of a minority of independent directors is a negative aspect of corporate governance. Without independent directors, the potential exists for management to act in a self-serving manner. Consequently a lack of independent directors on a board may increase investors&#x27; perception of the corporation&#x27;s risk. Also, separation of the roles of CEO and chairperson is an example of a strong corporate governance practice that reduces potential risks for shareholders. In case of CEO duality, the concern may be that the monitoring and oversight role of the board may be compromised relative to independent chairperson and CEO roles.<\/p>","qhtml":"<div class=\"pp-topic\">Environmental, Social, and Governance (ESG) Considerations in Investment Analysis<\/div><div class=\"qtext\"><p>An analyst gathers the following information about three companies:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp037.webp\" style=\"max-width:min(100%,641px)\" alt=\"\"><p>All else being equal, which of the companies most likely has the weakest corporate governance?<\/p><\/div>","subj":"corporate"},{"n":46,"q":"Which of the following most likely has the primary decision for labeling a security as a green bond?","opts":["Bond issuers","Credit rating agencies","Self-regulatory organizations"],"ans":"A","expl":"A is Correct because issuers have the primary decision for labeling their bonds \"green.\" This decision is made in close cooperation with the lead underwriter. At a minimum level, issuers provide detail to investors about the green eligibility criteria for the use of proceeds. Issuers are responsible for providing investors with details EdZebInstitute on the criteria used to classify the bonds as green and how the bond’s proceeds are used.","explhtml":"<p>A is Correct because issuers have the primary decision for labeling their bonds &quot;green.&quot; This decision is made in close cooperation with the lead underwriter. At a minimum level, issuers provide detail to investors about the green eligibility criteria for the use of proceeds. Issuers are responsible for providing investors with details EdZebInstitute<\/p><p>on the criteria used to classify the bonds as green and how the bond’s proceeds are used.<\/p>","qhtml":"<div class=\"pp-topic\">Environmental, Social, and Governance (ESG) Considerations in Investment Analysis<\/div><div class=\"qtext\"><p>Which of the following most likely has the primary decision for labeling a security as a green bond?<\/p><\/div>","subj":"corporate"},{"n":47,"q":"A portfolio manager at an investment firm is evaluating the corporate governance practices of three companies in her fund. Board composition and compensation governance information for the companies are provided in the table below: All else being equal, which of the three companies has the most effective corporate governance practices?","opts":["Company 1","Company 2","Company 3"],"ans":"B","expl":"B is Correct because among all the factors/attributes in the table, Company 2 exhibits the most effective corporate governance characteristics. Company 2 has a high percentage of independent directors, reducing the possibility of principal-principal and principal-agent risks. The absence, or presence of a minority, of independent directors is a negative aspect of corporate governance. Without independent directors, the potential exists for management to act in a self- serving manner. Company 2 also has a high percentage of non-executive directors with relevant industry experience. A board with diverse skills and expertise that are not directly related to the company’s core operations may lack sufficient expertise to govern. Finally, Company 2 has a “say-on-pay” provision where shareholders can vote and/or provide feedback on remuneration issues (e.g., excessive remuneration).","explhtml":"<p>B is Correct because among all the factors/attributes in the table, Company 2 exhibits the most effective corporate governance characteristics. Company 2 has a high percentage of independent directors, reducing the possibility of principal-principal and principal-agent risks. The absence, or presence of a minority, of independent directors is a negative aspect of corporate governance. Without independent directors, the potential exists for management to act in a self- serving manner. Company 2 also has a high percentage of non-executive directors with relevant industry experience. A board with diverse skills and expertise that are not directly related to the company’s core operations may lack sufficient expertise to govern. Finally, Company 2 has a “say-on-pay” provision where shareholders can vote and/or provide feedback on remuneration issues (e.g., excessive remuneration).<\/p>","qhtml":"<div class=\"pp-topic\">Environmental, Social, and Governance (ESG) Considerations in Investment Analysis<\/div><div class=\"qtext\"><p>A portfolio manager at an investment firm is evaluating the corporate governance practices of three companies in her fund. Board composition and compensation governance information for the companies are provided in the table below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp038.webp\" style=\"max-width:min(100%,643px)\" alt=\"\"><p>All else being equal, which of the three companies has the most effective corporate governance practices?<\/p><\/div>","subj":"corporate"},{"n":48,"q":"All else equal, which of the following business model characteristics most likely results in a lower cost of capital of a company when compared to its peers?","opts":["Higher operating leverage","Higher earnings predictability EdZebInstitute","Higher revenue concentration"],"ans":"B","expl":"B is Correct because with regard to the relationships between business model characteristics and a company’s cost of capital, the effect of higher earnings predictability is a lower cost of capital.","explhtml":"<p>B is Correct because with regard to the relationships between business model characteristics and a company’s cost of capital, the effect of higher earnings predictability is a lower cost of capital.<\/p>","qhtml":"<div class=\"pp-topic\">Cost of Capital: Advanced Topics<\/div><div class=\"qtext\"><p>All else equal, which of the following business model characteristics most likely results in a lower cost of capital of a company when compared to its peers?<\/p><\/div>","subj":"corporate"},{"n":49,"q":"An analyst researches three comparable companies that are seeking to raise capital. Selected information from the common- sized balance sheets of the companies is shown in the table below: Based only on this information, which company is most likely to have the lowest cost of capital?","opts":["Company 1","Company 2","Company 3"],"ans":"A","expl":"A is Correct because Company 1 has the largest percentage of cash and marketable securities (30%) compared to company 2 (19%) and company 3 (21%). Companies with primarily fungible (i.e., interchangeable into other units of the same identity) and highly liquid assets, such as cash and marketable securities, are likely to have access to lower-cost capital than companies with mostly non-fungible, illiquid assets such as specialized property, plant, and equipment. Also, Company 1 has a lower percentage of intangible assets (17%) compared to Company 2 (21%) and Company 3 (27%). In general, companies with primarily tangible and liquid assets are likely to be able to access debt and equity capital at lower cost than companies with a high proportion of intangible assets.","explhtml":"<p>A is Correct because Company 1 has the largest percentage of cash and marketable securities (30%) compared to company 2 (19%) and company 3 (21%). Companies with primarily fungible (i.e., interchangeable into other units of the same identity) and highly liquid assets, such as cash and marketable securities, are likely to have access to lower-cost capital than companies with mostly non-fungible, illiquid assets such as specialized property, plant, and equipment. Also, Company 1 has a lower percentage of intangible assets (17%) compared to Company 2 (21%) and Company 3 (27%). In general, companies with primarily tangible and liquid assets are likely to be able to access debt and equity capital at lower cost than companies with a high proportion of intangible assets.<\/p>","qhtml":"<div class=\"pp-topic\">Cost of Capital: Advanced Topics<\/div><div class=\"qtext\"><p>An analyst researches three comparable companies that are seeking to raise capital. Selected information from the common- sized balance sheets of the companies is shown in the table below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp039.webp\" style=\"max-width:min(100%,588px)\" alt=\"\"><p>Based only on this information, which company is most likely to have the lowest cost of capital?<\/p><\/div>","subj":"corporate"},{"n":50,"q":"A European company has publicly-traded straight debt outstanding that is denominated in US dollars and has a credit rating of A. When estimating the cost of capital of the company in US dollars, which of the following is the most appropriate estimate of its cost of debt?","opts":["YTM of the straight debt in US dollars","YTM of US dollar bonds of the company's peers with the same maturity and credit rating","YTM of Euro-denominated bonds of the company's peers with the same maturity and credit rating, adjusted for US country risk rating"],"ans":"A","expl":"A is Correct because if a company has publicly-traded debt with no embedded options, otherwise known as straight debt, the yield to maturity (YTM) on the company’s existing debt could be a reasonable estimate of the company’s cost of issuing straight debt. Effectively, the YTM reflects the current market interest rate on the debt, which can be interpreted as the current cost of issuing new debt with similar features.","explhtml":"<p>A is Correct because if a company has publicly-traded debt with no embedded options, otherwise known as straight debt, the yield to maturity (YTM) on the company’s existing debt could be a reasonable estimate of the company’s cost of issuing straight debt. Effectively, the YTM reflects the current market interest rate on the debt, which can be interpreted as the current cost of issuing new debt with similar features.<\/p>","qhtml":"<div class=\"pp-topic\">Cost of Capital: Advanced Topics<\/div><div class=\"qtext\"><p>A European company has publicly-traded straight debt outstanding that is denominated in US dollars and has a credit rating of A. When estimating the cost of capital of the company in US dollars, which of the following is the most appropriate estimate of its cost of debt?<\/p><\/div>","subj":"corporate"},{"n":51,"q":"The chief financial officer (CFO) of AeroNex Airways, a private company, considers purchasing a new aircraft for GBP 80 million. The CFO compares two alternatives to finance the purchase: a 10-year bank loan where the incremental borrowing rate is 9.68%, or a 10-year lease with annual lease payments of GBP 12 million due at the beginning of each year. The residual value of the leased asset at the end of Year 10 is GBP 5 million and the lessor would incur direct leasing costs of GBP 2 million at lease inception. In comparison to the cost of the bank loan, the rate implicit on the lease (RIIL) is:","opts":["lower.","the same.","higher. EdZebInstitute"],"ans":"C","expl":"C is Correct because the cost of the lease is 10.36%, which is higher than the bank loan rate of 9.68%. The rate implicit in the lease (RIIL) is the discount rate that equates the sum of the present value of the lease payments and the present value of the residual value with the sum of the fair value of the leased asset and the lessor’s direct costs (e.g., legal fees). EdZebInstitute Based on the proposed terms of the lease, a financial calculator can be used to solve for the RIIL: Setting: Annuity due (BGN mode) N = 10 (number of years), PV = –82 (80 cost of asset + 2 direct leasing costs), PMT = 12 (annual lease payment), FV = 5 (residual value). Solving for the interest rate (I/Y) gives approximately 10.36%. The cost of the lease (10.36%) is thus higher than the bank loan rate(9.68%).","explhtml":"<p>C is Correct because the cost of the lease is 10.36%, which is higher than the bank loan rate of 9.68%. The rate implicit in the lease (RIIL) is the discount rate that equates the sum of the present value of the lease payments and the present value of the residual value with the sum of the fair value of the leased asset and the lessor’s direct costs (e.g., legal fees). EdZebInstitute<\/p><p>Based on the proposed terms of the lease, a financial calculator can be used to solve for the RIIL: Setting: Annuity due (BGN mode)<\/p><p>N = 10 (number of years), PV = –82 (80 cost of asset + 2 direct leasing costs), PMT = 12 (annual lease payment), FV = 5 (residual value). Solving for the interest rate (I/Y) gives approximately 10.36%.<\/p><p>The cost of the lease (10.36%) is thus higher than the bank loan rate(9.68%).<\/p>","qhtml":"<div class=\"pp-topic\">Cost of Capital: Advanced Topics<\/div><div class=\"qtext\"><p>The chief financial officer (CFO) of AeroNex Airways, a private company, considers purchasing a new aircraft for GBP 80 million. The CFO compares two alternatives to finance the purchase: a 10-year bank loan where the incremental borrowing rate is 9.68%, or a 10-year lease with annual lease payments of GBP 12 million due at the beginning of each year. The residual value of the leased asset at the end of Year 10 is GBP 5 million and the lessor would incur direct leasing costs of GBP 2 million at lease inception. In comparison to the cost of the bank loan, the rate implicit on the lease (RIIL) is:<\/p><\/div>","subj":"corporate"},{"n":52,"q":"An analyst gathers the following information to calculate the equity risk premium (ERP) for the US market: The ERP using the forward-looking Grinold–Kroner model is closest to:","opts":["4.3%.","6.5%.","7.0%."],"ans":"B","expl":"B is Correct because based on the forward-looking macroeconomic approach using the Grinold-Kroner model: ERP = [DY + Δ(P/E) + i + g + ΔS] – E(rf) Where, DY = Expected income component = broad-based market index dividend yield = 2.4%, ΔP/E = Expected growth rate in the P/E ratio = 1.2%, i = Expected inflation = (1 + YTMTreasury bond/1 + YTMTIPS) – 1 = (1.05/1.027) – 1 ≈ 2.2%, g = Expected growth rate in real earnings per share = real GDP growth rate = 2.8%, ΔS = Expected change in shares outstanding = 0% and E(rf) = Risk-free rate = 2.1%. ERP = [2.4% + 1.2% + 2.2% + 2.8% + 0.0%] – 2.1% = 6.5%","explhtml":"<p>B is Correct because based on the forward-looking macroeconomic approach using the Grinold-Kroner model: ERP = [DY + Δ(P/E) + i + g + ΔS] – E(rf) Where, DY = Expected income component = broad-based market index dividend yield = 2.4%, ΔP/E = Expected growth rate in the P/E ratio = 1.2%, i = Expected inflation = (1 + YTMTreasury bond/1 + YTMTIPS) – 1 = (1.05/1.027) – 1 ≈ 2.2%, g = Expected growth rate in real earnings per share = real GDP growth rate = 2.8%, ΔS = Expected change in shares outstanding = 0% and E(rf) = Risk-free rate = 2.1%. ERP = [2.4% + 1.2% + 2.2% + 2.8% + 0.0%] – 2.1% = 6.5%<\/p>","qhtml":"<div class=\"pp-topic\">Cost of Capital: Advanced Topics<\/div><div class=\"qtext\"><p>An analyst gathers the following information to calculate the equity risk premium (ERP) for the US market:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp040.webp\" style=\"max-width:min(100%,550px)\" alt=\"\"><p>The ERP using the forward-looking Grinold–Kroner model is closest to:<\/p><\/div>","subj":"corporate"},{"n":53,"q":"The historical approach makes use of which of the following to estimate equity risk premiums (ERP)?","opts":["Macroeconomic models","Dividend discount models","A government bond yield as a proxy for the risk-free rate"],"ans":"C","expl":"C is Correct because the historical approach requires an estimate of the risk-free rate. The historical approach assumes that risk-free rates will reflect either previous short-term rates or long-term government bond yields. A historical approach is often used when reliable long-term equity return data are available. A historical ERP estimate is typically calculated as the mean value of the difference between a broad-based equity market index return and a government debt return, as a proxy for the risk-free rate, over some sample period.","explhtml":"<p>C is Correct because the historical approach requires an estimate of the risk-free rate. The historical approach assumes that risk-free rates will reflect either previous short-term rates or long-term government bond yields. A historical approach is often used when reliable long-term equity return data are available. A historical ERP estimate is typically calculated as the mean value of the difference between a broad-based equity market index return and a government debt return, as a proxy for the risk-free rate, over some sample period.<\/p>","qhtml":"<div class=\"pp-topic\">Cost of Capital: Advanced Topics<\/div><div class=\"qtext\"><p>The historical approach makes use of which of the following to estimate equity risk premiums (ERP)?<\/p><\/div>","subj":"corporate"},{"n":54,"q":"Three years ago, a company issued a bond using a private placement. The company has no other debt. Six months ago, the company undertook an IPO and started paying dividends. The company's CEO expects constant growth in the future. Which of the following methods is most appropriate to estimate the company's required return on equity?","opts":["The Fama–French model","The dividend discount model","The bond yield plus risk premium approach EdZebInstitute"],"ans":"B","expl":"B is Correct because the dividend discount model (DDM) requires that the company’s shares are publicly traded and that the company pays dividends that are stable and predictable. Based on these characteristics, the DDM is most appropriate in this case.","explhtml":"<p>B is Correct because the dividend discount model (DDM) requires that the company’s shares are publicly traded and that the company pays dividends that are stable and predictable. Based on these characteristics, the DDM is most appropriate in this case.<\/p>","qhtml":"<div class=\"pp-topic\">Cost of Capital: Advanced Topics<\/div><div class=\"qtext\"><p>Three years ago, a company issued a bond using a private placement. The company has no other debt. Six months ago, the company undertook an IPO and started paying dividends. The company&#x27;s CEO expects constant growth in the future. Which of the following methods is most appropriate to estimate the company&#x27;s required return on equity?<\/p><\/div>","subj":"corporate"},{"n":55,"q":"An analyst gathers the following information about a public company: Based only on the data in the table, the required ROE can be calculated using which of the following?","opts":["DDM","CAPM","Bond yield plus risk premium approach"],"ans":"C","expl":"C is Correct because the cost of debt and the risk premium over the cost of debt are known, so the cost of equity (required ROE) can be calculated using the bond yield plus risk premium approach (BYPRP). The BYPRP is: re = rd + RP, where rd is the cost of debt and RP is the risk premium over the cost of debt. In this case re = 6% + 7% = 13%.","explhtml":"<p>C is Correct because the cost of debt and the risk premium over the cost of debt are known, so the cost of equity (required ROE) can be calculated using the bond yield plus risk premium approach (BYPRP). The BYPRP is: re = rd + RP, where rd is the cost of debt and RP is the risk premium over the cost of debt. In this case re = 6% + 7% = 13%.<\/p>","qhtml":"<div class=\"pp-topic\">Cost of Capital: Advanced Topics<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a public company:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp041.webp\" style=\"max-width:min(100%,560px)\" alt=\"\"><p>Based only on the data in the table, the required ROE can be calculated using which of the following?<\/p><\/div>","subj":"corporate"},{"n":56,"q":"A company's preferred equity is trading at $140 per share. The annual dividend rate is 8.0% and the par value is $150 per share. The cost of the preferred equity is closest to:","opts":["7.1%.","8.0%.","8.6%"],"ans":"C","expl":"C is Correct because the cost of the preferred equity is (8.0% × $150)/$140 = 8.57% ≈ 8.6%.","explhtml":"<p>C is Correct because the cost of the preferred equity is (8.0% × $150)/$140 = 8.57% ≈ 8.6%.<\/p>","qhtml":"<div class=\"pp-topic\">Cost of Capital: Advanced Topics<\/div><div class=\"qtext\"><p>A company&#x27;s preferred equity is trading at $140 per share. The annual dividend rate is 8.0% and the par value is $150 per share. The cost of the preferred equity is closest to:<\/p><\/div>","subj":"corporate"},{"n":57,"q":"A private company's capital structure is composed of 65% in debt and 35% in equity. The company's single debt issue matures in seven years. To estimate the company's cost of debt, an analyst summarizes the following matrix of bond yields issued by companies with similar capital structures and credit quality: The estimated company's cost of debt is closest to:","opts":["3.7%.","4.3%.","5.7%. EdZebInstitute"],"ans":"C","expl":"C is Correct because the 7-year bond yield is unknown, so the analyst uses linear interpolation to estimate its YTM. Since the spread in YTM is 7.0% – 3.0% = 4.0%, EdZebInstitute and the range of years is 8 – 5 = 3 years, the average incremental yield per year is 4.0%/3 = 1.33%. Therefore, a comparable 7-year bond has an estimated yield of 3.0% + (2 × 1.33%) = 5.66% ≈ 5.7%.","explhtml":"<p>C is Correct because the 7-year bond yield is unknown, so the analyst uses linear interpolation to estimate its YTM. Since the spread in YTM is 7.0% – 3.0% = 4.0%, EdZebInstitute<\/p><p>and the range of years is 8 – 5 = 3 years, the average incremental yield per year is 4.0%/3 = 1.33%. Therefore, a comparable 7-year bond has an estimated yield of 3.0% + (2 × 1.33%) = 5.66% ≈ 5.7%.<\/p>","qhtml":"<div class=\"pp-topic\">Cost of Capital: Advanced Topics<\/div><div class=\"qtext\"><p>A private company&#x27;s capital structure is composed of 65% in debt and 35% in equity. The company&#x27;s single debt issue matures in seven years. To estimate the company&#x27;s cost of debt, an analyst summarizes the following matrix of bond yields issued by companies with similar capital structures and credit quality:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp042.webp\" style=\"max-width:min(100%,552px)\" alt=\"\"><p>The estimated company&#x27;s cost of debt is closest to:<\/p><\/div>","subj":"corporate"},{"n":58,"q":"An investor compares a company versus its industry average, using the following data (in $ millions): A synthetic credit rating schedule indicates: Based on this schedule, comparing credit ratings for the company and industry averages suggests that the company achieves a:","opts":["lower rating based on IC and a higher rating based on D/E.","higher rating based on IC and a lower rating based on D/E.","higher rating based on both IC and D/E."],"ans":"B","expl":"B is Correct because the company's interest coverage is $9 million/$ 2 million = 4.5 which compares to the industry average of $90 million/$24 million = 3.75. Therefore, the company's rating is \"A\" based on interest coverage only, compared to a \"BBB\" rating for the industry average. By contrast, the company's D/E ratio is $45 million/$80 million = 56.25% which yields a \"BBB\" rating. The industry average yields a D/E ratio of $360 million/$900 million = 40% which corresponds to an \"A\" rating. In sum, when comparing company and industry average, the company achieves a higher rating based on IC and a lower rating based on D/E.","explhtml":"<p>B is Correct because the company&#x27;s interest coverage is $9 million/$ 2 million = 4.5 which compares to the industry average of $90 million/$24 million = 3.75. Therefore, the company&#x27;s rating is &quot;A&quot; based on interest coverage only, compared to a &quot;BBB&quot; rating for the industry average. By contrast, the company&#x27;s D/E ratio is $45 million/$80 million = 56.25% which yields a &quot;BBB&quot; rating. The industry average yields a D/E ratio of $360 million/$900 million = 40% which corresponds to an &quot;A&quot; rating. In sum, when comparing company and industry average, the company achieves a higher rating based on IC and a lower rating based on D/E.<\/p>","qhtml":"<div class=\"pp-topic\">Cost of Capital: Advanced Topics<\/div><div class=\"qtext\"><p>An investor compares a company versus its industry average, using the following data (in $ millions):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp043.webp\" style=\"max-width:min(100%,556px)\" alt=\"\"><p>A synthetic credit rating schedule indicates:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp044.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>Based on this schedule, comparing credit ratings for the company and industry averages suggests that the company achieves a:<\/p><\/div>","subj":"corporate"},{"n":59,"q":"An analyst is estimating the cost of debt for a company's 10-year non-traded bonds. She relies on an internally developed matrix of synthetic credit ratings, a portion of which is presented in the following table: The yield to maturity (YTM) on the US Treasury 10-year benchmark government bond is 5.41%. In its most recent financial statements, the company reported equity of $150.0 million and total debt of $34.5 million. The implied YTM of the company's 10- year bond is closest to:","opts":["1.45%.","6.51%.","6.86%. EdZebInstitute"],"ans":"C","expl":"C is Correct because the implied credit rating is 'A' for the company and reflects a YTM of 5.41%. The company has a debt-to-equity ratio of $34.5/$150.0 = 0.23. This implies a credit rating of ‘A’ and a credit spread of 1.45%. Adding the 1.45% credit spread to the US Treasury 10-year benchmark government bond YTM of 5.41% implies a YTM of 1.45% + 5.41% = 6.86%.","explhtml":"<p>C is Correct because the implied credit rating is &#x27;A&#x27; for the company and reflects a YTM of 5.41%. The company has a debt-to-equity ratio of $34.5/$150.0 = 0.23. This implies a credit rating of ‘A’ and a credit spread of 1.45%. Adding the 1.45% credit spread to the US Treasury 10-year benchmark government bond YTM of 5.41% implies a YTM of 1.45% + 5.41% = 6.86%.<\/p>","qhtml":"<div class=\"pp-topic\">Cost of Capital: Advanced Topics<\/div><div class=\"qtext\"><p>An analyst is estimating the cost of debt for a company&#x27;s 10-year non-traded bonds. She relies on an internally developed matrix of synthetic credit ratings, a portion of which is presented in the following table:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp045.webp\" style=\"max-width:min(100%,550px)\" alt=\"\"><p>The yield to maturity (YTM) on the US Treasury 10-year benchmark government bond is 5.41%. In its most recent financial statements, the company reported equity of $150.0 million and total debt of $34.5 million. The implied YTM of the company&#x27;s 10- year bond is closest to:<\/p><\/div>","subj":"corporate"}];
const CFG = {"title": "Corporate Issuers — Practice Pack", "subtitle": "CFA Level II · 59 câu · EdZeb", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;

function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);

function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"

  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }

  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";

}

const CFA_SESSION_SUBJECT_RANGES = {
  1:{ethics:[27,27],quant:[11,17],economics:[11,17],fsa:[20,25],corporate:[10,16]},
  2:{equity:[20,25],fixed:[20,25],derivatives:[9,14],alternatives:[11,16],portfolio:[14,22]}
};
const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,
  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,
  fsa:/financial statement|financial reporting|accounting|income statement|balance sheet|cash flow|revenue|expense|inventory|cost of sales|gross profit|gross margin|shareholders?['’]? equity|earnings per share|\beps\b|audit|gaap|ifrs|taxable income|deferred tax|temporary difference|intangible|long-lived|revaluation|impairment|amortization|depreciation|pension|financial ratio|receivables turnover|payables turnover|cash conversion|fixed charge coverage|normalized earnings|management['’]?s commentary/g,
  corporate:/corporate|company lifecycle|start-up|startup|early-stage|business model|franchise|board of directors|proxy voting|stakeholder|shareholder|creditor|governance|capital budgeting|capital investment|project|real option|\bnpv\b|internal rate of return|\birr\b|cost of debt|cost of capital|capital structure|weight of debt|modigliani|dividend policy|double taxation|principal-agent|working capital|liquidity|compensation|competitive strategy|porter|economies of scale|information asymmetry|agency relationship/g,
  equity:/equity|common share|preferred share|stock|market index|index weighting|market efficiency|efficient market|security market|buy order|sell order|limit order|dealer|margin requirement|leverage ratio|industry classification|company analysis|enterprise value|price-to|free cash flow to equity|\bfcfe\b|dividend discount|earnings multiplier|book value per share|intrinsic value|voting|ex-dividend/g,
  fixed:/fixed-income|fixed income|bond|debt|credit rating|credit spread|yield|spot rate|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|repo|covenant|accrued interest|priority of claims|default|extension risk|interest coverage/g,
  derivatives:/derivative|forward|future|swap|option|call buyer|call seller|put buyer|put seller|strike price|premium|put-call|binomial|contingent claim|moneyness|expiration|arbitrage|replication/g,
  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,
  portfolio:/portfolio|asset allocation|investment policy|\bips\b|behavioral|cognitive error|risk aversion|utility|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation|covariance|sharpe|treynor|jensen|information ratio|two-fund|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral/g
};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();

(function(){

    var emoji=document.getElementById('rEmoji');

      emoji.textContent='💪';
    }

  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  if(graded) window.showGradedResult();

  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

(function(){

    var r=panel.getBoundingClientRect();

    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);

})();

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
