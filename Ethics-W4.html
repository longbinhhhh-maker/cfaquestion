<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

const DATA = [{"n": 1, "q": "An investment firm has multiple subsidiaries across countries. The subsidiaries have different business names but operate under the same brand name. When defining the firm to claim compliance with GIPS standards, which subsidiaries should the firm most appropriately include? ", "opts": ["Any subsidiaries operating under the same brand name", "Only subsidiaries using the business name of the investment firm", "Only subsidiaries located in the country the firm is seeking compliance"], "ans": "A", "expl": "The fundamentals of compliance require that a company seeking compliance with GIPS standards must properly define its firm. A proper\ndefinition ensures:\nthe whole firm is complying with GIPS standards,\nan accurate accounting of total firm assets, and\nrepresentative composite creation.\nGIPS standards state that an investment firm seeking compliance should adopt the broadest definition of the firm. When a company operates in\nmultiple countries or regions, the scope should include all subsidiaries or offices that operate under the same brand name. This includes\nany individual subsidiaries that may have different business names. For example, if a company has a subsidiary in another country with a different\nbusiness name but that operates under the same brand name, it should be included under the definition of the firm for GIPS compliance.\n(Choice B) The definition of the firm should include all geographical subsidiaries operating under the same brand name, regardless of the actual\nnames of the individual companies.\n(Choice C) GIPS compliance encompasses the whole firm and is not done on a country-by-country basis.\nThings to remember:\nGIPS standards state that an investment firm seeking compliance should adopt the broadest definition of the firm. When the company operates in\nmultiple countries/regions, the definition should include all subsidiaries or offices that operate under the same brand name, regardless of the\nbusiness names of the individual companies.\nDescribe the fundamentals of compliance, including the recommendations of the GIPS Standards with respect to the definition of the firm and the\nfirm’s definition of discretion", "qhtml": null}, {"n": 2, "q": "When constructing a composite, which of the following is least likely a requirement of GIPS?", "opts": ["Each composite must include two or more discretionary portfolios.", "A portfolio's inclusion in a composite is determined on an ex ante basis.", "All actual, fee-paying, discretionary portfolios are required to be in at least one composite."], "ans": "A", "expl": "A composite is an aggregated portfolio formed by grouping one or more portfolios that a firm manages according to a specific style or objective.\nFirms report the portfolios' combined performance as if it were one collective unit. Most composites are constructed using many portfolios.\nHowever, a composite can consist of only one portfolio if the style or objective is unique to that portfolio.\nTo be GIPS-compliant, a firm must include all actual, discretionary, fee-paying, portfolios in at least one composite (Choice C). Hypothetical\nportfolios cannot be included since composites must represent actual results. The term \"discretionary\" indicates that the client has given the\nmanager control to make investment decisions (ie, buy or sell securities). Including only the portfolios that the manager controls provides the best\nevidence of the manager's skill.\n(Choice B) The decision whether to include a portfolio in a composite must be made prior to the reporting period; this is referred to as ex ante,\nrather than ex post. This prevents managers from \"cherry picking\" or selecting only those portfolios that boost the composite's performance.\nThings to remember:\nA composite is a collection of one or more portfolios that are managed under a common strategy or objective. To be GIPS-compliant, a firm must\ninclude all actual, discretionary, fee-paying, portfolios in at least one composite. The decision to include a portfolio in a composite in done prior to\ncalculating the composite's performance (ie, ex ante basis).\nExplain the purpose of composites in performance reporting", "qhtml": null}, {"n": 3, "q": "An investment management firm most likely can claim compliance with the Global Investment Performance Standards (GIPS) if it:", "opts": ["includes only discretionary portfolios in its composites.", "clearly distinguishes composites that do and do not comply with GIPS.", "excludes composites for which it has less than five years of performance history."], "ans": "A", "expl": "Compliance with the Global Investment Performance Standards (GIPS) requires firms to calculate and present composite returns. A composite\nis a group of discretionary portfolios that a firm manages according to a common style or strategy. A discretionary portfolio is one in which the\nmanager makes the investment decisions. For example, a firm's large-cap value composite would consist of the portfolios that have a strategy\nthat invests in large-cap value stocks. A firm must present a composite for each of its different strategies, but nondiscretionary portfolios are\nnot included in a composite.\n(Choice B) GIPS are a set of detailed provisions and definitions concerning input data, calculation, composite construction, and so on. For a firm\nto claim compliance, all composites must be prepared according to GIPS; the Standards specifically disallow firms to claim compliance \"except for\"\nnoncompliant composites.\n(Choice C) GIPS generally require firms to present a minimum of five years of returns for each composite. However, with respect to newer\ncomposites, a firm complies with GIPS if it presents information for each year of a composite's existence. Even if a composite has existed for less\nthan five years, it must be included for a firm to claim compliance with GIPS.\nThings to remember:\nThe Global Investment Performance Standards (GIPS) are uniform methods to calculate and present investment performance results. Firms must\nreport at least five years of composite information for each strategy or style that they manage. A composite consists of all discretionary portfolios\nthat are managed using a common style or strategy.\nDescribe the key concepts of the GIPS standards for firms", "qhtml": null}, {"n": 4, "q": "A firm creating and maintaining GIPS-compliant composites is most likely required to:", "opts": ["assign portfolios to composites on an ex ante basis.", "ensure that each composite contains multiple portfolios.", "include every portfolio with a similar strategy in a composite."], "ans": "A", "expl": "A composite aggregates all a firm's portfolios that are managed according to a certain investment mandate, objective, or strategy. GIPS require\nthat each fee-paying, discretionary portfolio must be included in at least one composite.\nThe decision to include a portfolio in a composite must be based on pre-established criteria, referred to as ex ante, rather than ex post (ie,\nafter the fact), criteria. This prevents managers from presenting only their best-performing portfolios in the composite. Including all similarly\nmanaged portfolios provides a complete representation of the firm's performance with that strategy.\n(Choice B) Including only one portfolio in a composite is allowed if it is the firm's only portfolio using that investment mandate, objective, or\nstrategy.\n(Choice C) A firm is required only to include fee-paying, discretionary portfolios in composites. Non–fee-paying portfolios that are discretionary\nalso may be included. However, all nondiscretionary portfolios must be excluded since they reflect clients', not the firm's, decisions and\nperformance.\nThings to remember:\nA composite is an aggregate of one or more portfolios based on a specific investment mandate, objective, or strategy. The decision to include a\nportfolio in a composite must be based on pre-established (ie, ex ante) criteria.\nExplain the purpose of composites in performance reporting", "qhtml": null}, {"n": 5, "q": "The fundamental purpose of the GIPS standards for firms is best described as:", "opts": ["fully, fairly, and ethically presenting a firm's investment performance.", "serving as the global regulatory source to address controversial performance reporting.", "setting a minimum threshold for composite performance reporting, verified by a third party."], "ans": "A", "expl": "Global Investment Performance Standards (GIPS®) are a standardized approach for investment performance presentation. GIPS standards are\nbased on the ethical principle that fair representation and full disclosure of investment performance are critical to the integrity of the capital\nmarkets and the investment profession. For firms, the fundamental purpose of GIPS compliance is to present investment performance fully,\nfairly, and ethically.\n(Choice B) CFA Institute is not a regulatory body. GIPS standards are a self-regulatory set of standards that lays out a framework for global\nperformance reporting without attempting to address every element (controversial or not) of performance reporting practices.\n(Choice C) The GIPS standards set a much higher bar than a minimum threshold for composite performance reporting. In addition, third-party\nverification is optional, although it is considered best practice.\nThings to remember:\nFor firms, the fundamental purpose of GIPS is to present investment performance fully, fairly, and ethically.\nDescribe the fundamentals of compliance, including the recommendations of the GIPS Standards with respect to the definition of the firm and the\nfirm’s definition of discretion", "qhtml": null}, {"n": 6, "q": "For Global Investment Performance Standards (GIPS®) compliant firms, which of the following best describes the purpose of composite construction?", "opts": ["Equal trade allocations ensure consistent reporting.", "Composites' universal asset class definitions improve comparability.", "Composites bar managers from preparing performance reports using only the best accounts."], "ans": "C", "expl": "GIPS standards provide rules on how a manager must construct and report composites. A composite is made up of one or more client portfolios\nthat represent a firm's strategy. Each portfolio may be included in one or more composites.\nThe purpose of having uniformity in constructing composites is to prevent firms from selecting accounts that make the firm's performance look\nbetter than it would if all appropriate accounts were included. Without GIPS standards, a firm could choose which portfolios to include and\nexclude, making it difficult to ascertain how managers truly perform. GIPS-compliant firms produce performance reports that are more consistent\nand reliable.\n(Choice A) GIPS standards do not require managers to allocate trades equally. The Standard of Professional Conduct stipulates that clients\nshould be fairly treated, but it is silent on an exact process for allocating trades.\n(Choice B) GIPS standards do not mandate universal asset class definitions in composites.\nThings to remember:\nGIPS standards provide rules on composite construction, maintenance, and performance reporting. Having uniformity in constructing composites\nprevents firms from selecting only high-performing portfolios. Without GIPS standards, a firm could choose which portfolios to include and\nexclude; this would make it difficult to ascertain a manager's true performance.\nExplain the purpose of composites in performance reporting", "qhtml": null}, {"n": 7, "q": "If a firm chooses to verify its compliance with the GIPS standards, the verification must be performed by:", "opts": ["an independent third party.", "the firm's chief compliance officer.", "the local securities market regulatory authority."], "ans": "A", "expl": "GIPS verification\nIs recommended but not required\nMust be performed by an independent third party\nApplies to the entire firm, not just specific composites\nIncreases confidence in a firm's claim of GIPS compliance\nCompliance with GIPS (Global Investment Performance Standards) is voluntary, but a firm must fully comply to claim compliance; there is no\npartial compliance. For the firm that claims compliance, CFA Institute recommends (but does not require) that compliance be verified to enhance\nthe reliability of the firm's assertion.\nVerification must be made by an independent third party and is applied to an entire firm, not individual composites. Verification does not\nensure the accuracy of the composites but tests whether the firm:\nhas complied with all GIPS requirements when constructing its composites and\nfollows a process for calculating and presenting performance returns that complies with GIPS.\n(Choice B) A firm can assert that it is GIPS compliant, but it cannot self-verify its assertion. A firm's chief compliance officer, or any other person\nwho is part of the firm, is not allowed to perform the verification.\n(Choice C) Regulatory bodies are not involved in verifying GIPS compliance.\nThings to remember:\nCFA Institute recommends that firms verify their compliance with GIPS if they choose to claim they are GIPS compliant. Verification must be\nperformed by an independent third party.\nDescribe the concept of independent verification", "qhtml": null}, {"n": 8, "q": "Which of the following most accurately describes a reason why the Global Investment Performance Standards were developed?", "opts": ["To encourage diversity in performance reporting", "To set a minimum period for reporting past performance", "To provide flexibility in how terminated accounts are reported"], "ans": "B", "expl": "The Global Investment Performance Standards (GIPS) are a uniform approach for calculating and presenting historical investment\nperformance. With fair representation and full disclosure, all interested parties benefit from more reliable data. Prior to the development of\nGIPS, investors had difficulty comparing managers since there was a wide disparity in how managers calculated and presented performance\ninformation.\nIntitially, for GIPS-compliant firms, performance reports must show at least five years of performance unless the firm or composite has existed for\nless than five years. In this case, firms present performance since the firm's or composite's inception. In subsequent years, the firm must add\nGIPS-compliant performance each year until there is a minimum of 10 years of performance in the firm's reports.\n(Choice A) GIPS provide uniformity, not diversity when presenting performance. Uniformity gives the investor the ability to compare managers\nwho use the same method to calculate performance.\n(Choice C) GIPS require managers to include terminated client accounts as part of the firm's historical performance. Excluding underperforming\nportfolios that were terminated may overstate performance and so would be an unfair representation. There is no flexibility on how to account for\nterminated portfolios.\nThings to remember:\nThe Global Investment Performance Standards (GIPS) are a uniform approach for calculating and presenting historical investment performance.\nGIPS was developed to improve the comparability of managers' performance since each manager may have presented performance differently.\nExplain why the GIPS standards were created, who can claim compliance, and who benefits from compliance", "qhtml": null}, {"n": 9, "q": "Parkhurst Investment Advisors (PIA) is a fee-based provider of stock selection and asset allocation advice to large, defined-benefit pension plans. It does not manage assets but maintains detailed records on its recommendations. For the last 12 years, PIA has created composites from the different portfolios that it has recommended to its clients. In its advertising literature, PIA displays each year's return for its composites, both gross of and net of a hypothetical 1% annual fee, as well as the return for each composite's benchmark. Can PIA claim compliance with the Global Investment Performance Standards (GIPS)?", "opts": ["No, since it does not manage assets.", "No, since GIPS place a 10-year limit on past information.", "Yes, since it presents the returns for the composites as well as their benchmarks."], "ans": "A", "expl": "Global Investment Performance Standards (GIPS) provide uniform methods for investment managers to calculate and present investment\nresults. Using GIPS to calculate and present performance allows the investing public to objectively compare different managers. It prevents firms\nfrom presenting information for a limited time horizon that may not represent the longer-term reality.\nAlthough compliance is voluntary, one condition to claim compliance with GIPS is that a firm must manage assets. Advisers and software\ndevelopers that aid asset managers cannot claim compliance since they do not actually manage client assets. In this case, although PIA can\ndemonstrate the returns that its portfolios would have achieved, it is not allowed to claim compliance with GIPS.\n(Choice B) GIPS requires a firm to present at least five years of returns for each of the composite portfolios that it manages. A \"composite\"\nportfolio is one that is aggregated from one or more actual portfolios that the firm manages according to a distinct style or objective. GIPS does\nnot limit the number of years of information that can be provided.\n(Choice C) A firm must present information concerning both its composites and their benchmarks. However, since PIA does not manage assets,\nit cannot claim to be GIPS-compliant.\nThings to remember:\nGlobal Investment Performance Standards (GIPS) are uniform methods to calculate and present investment performance results. Compliance\nwith GIPS is voluntary, but firms must comply with all Standards in order to claim compliance. In addition, a firm must manage client assets to\nclaim compliance with GIPS.\nDescribe the key concepts of the GIPS standards for firms", "qhtml": null}, {"n": 10, "q": "If an investment firm has its GIPS compliance verified, the verifier must attest that the firm is compliant at the:", "opts": ["firm level.", "account level.", "composite level."], "ans": "A", "expl": "According to the Fundamentals of Compliance provision of the GIPS, to claim compliance a firm must adhere to all GIPS requirements. This is\naccomplished only if the entire firm follows all mandated rules.\nFirms that claim GIPS compliance enhance potential clients' confidence that the information used is complete and fairly presented. If the\nStandards are not applied on a firm-wide basis, managers could include only those portfolios that present the firm in the best light (ie, cherry-pick\naccounts), which could mislead investors.\n(Choice B) Composites are groups of accounts managed in a similar strategy, all of which must, without exception, comply with GIPS for a firm to\nclaim GIPS compliance.\n(Choice C) Account performance data must be appropriately maintained and may be part of a composite. However, the basis of claiming GIPS\ncompliance is at the firm level, not the account level.\nThings to remember:\nA firm can claim GIPS compliance only on a firm-wide basis. All accounts and composites must follow the rules mandated by the GIPS\nprovisions. Firm-wide compliance prevents managers from promoting better performance or cherry-picking accounts and misleading investors.\nDescribe the key concepts of the GIPS standards for firms", "qhtml": null}, {"n": 11, "q": "A firm is in a jurisdiction where local regulations concerning investment reporting requirements are very similar to the Global Investment Performance Standards (GIPS), except that a firm cannot provide performance information for composites that are in existence for less than five years. If the firm follows local regulations, can it claim that it is GIPS-compliant?", "opts": ["No, since a firm must comply with all the Standards to claim GIPS-compliance.", "Yes, provided that the firm indicates where GIPS conflicts with local regulations.", "Yes, provided that the firm furnishes independent verification that it follows local regulations."], "ans": "B", "expl": "Global Investment Performance Standards (GIPS) require firms to include five years of performance information for all composites. If a composite\nhas been in existence for less than five years, then the information must be provided from the composite's inception. In this question, GIPS\nconflict with local law, since firms are not permitted under local law to report on composites that have been in existence for less than five years.\nThe general rule is that a firm must comply with all Standards to claim it is GIPS-compliant. However, the Standards also require firms to comply\nwith local law. GIPS are intended to apply globally, so when GIPS conflict with local law, a firm can claim compliance with GIPS by following local\nlaw and disclosing those areas where GIPS conflict (Choice A).\n(Choice C) The CFA Institute recommends, but does not require, that firms verify their compliance with GIPS. If a firm chooses to verify, the\nverification must be performed by an independent third party. Nothing in GIPS requires a firm to verify that it complies with local regulations in\norder to claim that it complies with GIPS.\nThings to remember:\nThe general rule is that a firm must comply with all Global Investment Performance Standards (GIPS) to claim that it is GIPS-compliant. However,\nwhen GIPS conflict with local law, a firm can claim compliance with GIPS by following local law and disclosing those areas where GIPS conflict.\nDescribe the concept of independent verification", "qhtml": null}, {"n": 12, "q": "According to CFA Institute, which of the following are most likely to be the main beneficiaries of GIPS-compliant reporting?", "opts": ["Investment firms and prospective clients", "Governmental regulators and investment firms", "Prospective clients and governmental regulators"], "ans": "A", "expl": "While it may be that market participants and society at large benefit from GIPS compliance, according to CFA Institute, both investment firms\nand potential clients are the main beneficiaries. GIPS-compliant firms benefit directly by increasing the integrity of their performance\nreporting with complete and fairly presented reports.\nProspective clients benefit from increased confidence in the reliability of firms' performance. They also benefit from easier comparisons\nwhen selecting among investment firms. Complying with GIPS enhances firms' credibility but does not replace a potential investor's due\ndiligence.\n(Choices B and C) Governmental regulators may have their own standards but do not directly benefit from GIPS-compliant firms.\nThings to remember:\nAccording to CFA Institute, investment firms and potential clients are the main beneficiaries of GIPS compliance. Investment firms benefit directly\nby increasing their integrity with complete and fairly presented performance reports. Prospective clients benefit from increased faith in the\nreliability of firms' performance. They also benefit from easier comparisons when selecting among investment firms.\nExplain why the GIPS standards were created, who can claim compliance, and who benefits from compliance", "qhtml": null}, {"n": 13, "q": "If a firm elects to verify its compliance with the Global Investment Performance Standards (GIPS), verification most likely:", "opts": ["is required at least annually.", "must be performed on all the firm's composites.", "ensures that a composite is accurately presented."], "ans": "B", "expl": "The Global Investment Performance Standards (GIPS) provide uniform methods for investment managers to calculate and present\ninvestment results. Compliance with GIPS is voluntary, but firms must comply with all the Standards to claim compliance; there is no partial\ncompliance.\nWhen a firm claims that it complies with GIPS, CFA Institute recommends, but does not require, that the claim be verified. If elected, verification\nmust be made by an independent third party. Verification is performed on all the firm's composites and tests two conditions:\nThe firm has constructed its composites in accordance with GIPS.\nThe firm's process for calculating and presenting performance returns complies with GIPS.\n(Choice A) CFA Institute recommends that firms verify their claims of compliance with GIPS, but it is not required.\n(Choice C) Verification only tests that the firm followed GIPS in constructing its composites. It does not ensure that a composite is accurately\npresented.\nThings to remember:\nCFA Institute recommends that firms verify their compliance with the Global Investment Performance Standards (GIPS). Verification is performed\nby an independent third party, and a firm must verify that all its composites comply with GIPS.\nDescribe the concept of independent verification", "qhtml": null}, {"n": 14, "q": "Firm X acquires Firm Y. Both firms have historically claimed GIPS compliance. In the acquisition, all of Firm Y's portfolio managers have been retained by Firm X but most of the research and support staff have not. The research duties will be assumed by Firm X's existing staff. According to the GIPS standards, can Firm X link Firm Y's past performance with its own?", "opts": ["No.", "Yes, since Firm X has acquired Firm Y.", "Yes, since the portfolios' management remains the same."], "ans": "A", "expl": "Global Investment Performance Standards (GIPS®) are a standardized approach for investment performance presentation. GIPS compliance is\non a firm-wide basis only (ie, not on a composite and/or fund level). When a new firm is created or an existing firm is acquired, the prior or existing\nfirm's historical GIPS-compliant performance can be linked to (ie, assumed by and reported with) the new or acquiring firm's reported\nperformance, provided that all of the following conditions are met:\nSubstantially all the investment decision makers are employed by the new or acquiring firm. This includes not only portfolio managers but\nalso the relevant research and support staff.\nThe investment decision-making process must remain independent (ie, no interference by acquiring firm) and substantially intact.\nThe new or acquiring firm must maintain records that support the reported performance.\nThere is no break (ie, gap) in the performance record when transitioning to the new firm. If there is a break, the past performance can still\nbe presented but not linked.\nIn this scenario, since Firm X has not retained Firm Y's key investment decision-making personnel, Firm X cannot link Firm Y's past performance\nwith its own (Choices B and C).\nThings to remember:\nPast GIPS-compliant performance can be linked to a new or acquiring firm provided that certain conditions are met; those conditions include\nretaining personnel, maintaining records, keeping the decision process intact, and allowing no break in the performance record.\nDescribe the fundamentals of compliance, including the recommendations of the GIPS Standards with respect to the definition of the firm and the\nfirm’s definition of discretion", "qhtml": null}, {"n": 15, "q": "The GIPS standards most likely:", "opts": ["allow selection of the period to be presented for a composite and its benchmark.", "require inclusion of portfolios removed from a composite after the reported period.", "are enforced by regulatory authorities to ensure consistency among investment firms."], "ans": "B", "expl": "Common misleading performance reporting practices\nRepresentative\nSelecting top-performing portfolios to represent overall results\naccounts\nSurvivorship\nExcluding terminated portfolios from average performance\nbias\nVarying\nPresenting only selected periods of strong performance\ntime periods\nThe Global Investment Performance Standards (GIPS®) standardize the reporting of historical performance across the investment industry to\nfacilitate comparisons between firms and increase investor confidence. The GIPS standards require that information is comprehensive and\nrepresents actual performance. Investment managers at noncompliant firms could mislead clients by selectively choosing to present information\non:\nPortfolios managed: A firm might choose to share the historical performance of its top-performing portfolios only, thus reporting greater\nreturns than the actual results.\nFinancial assets: A firm might present the investment performance of only currently invested assets, which creates survivorship bias by\noverlooking assets that were removed from the portfolio after performing poorly. Firms should include terminated client accounts, funds,\nand portfolios as part of the historical performance of a composite.\nTime period: Investment managers might inappropriately present the performance only for periods when a portfolio outperformed the\nmarket or the benchmark.\n(Choice A) The GIPS standards prevent firms from presenting performance periods selectively by mandating a minimum number of consecutive\nperiods to present.\n(Choice C) GIPS compliance is optional, so there is no regulatory oversight of the GIPS standards.\nThings to remember:\nInvestment firms can mislead investors with an incomplete performance history, selectively choosing which information to present. The GIPS\nstandards provide a uniform approach to presenting composites that requires firms to include terminated client accounts, funds, and portfolios as\npart of the historical performance.\nDescribe the key concepts of the GIPS standards for firms", "qhtml": null}, {"n": 16, "q": "Based on the GIPS fundamentals of compliance, a firm must define:", "opts": ["the firm and discretion.", "prospective clients and the firm.", "discretion and prospective clients."], "ans": "A", "expl": "A firm seeking compliance with GIPS standards must define the firm and the meaning of discretion to ensure accuracy and consistency when\napplying the standards.\nGIPS standards state that an investment firm seeking compliance should adopt the broadest definition of the firm to ensure an accurate\naccounting of total firm assets. When a firm operates in multiple countries/regions, the scope of the definition of the firm should include all offices\nthat operate under the same brand name.\nFirms must also define discretion so that they can be consistent about which portfolios will be included in composites. Since only\ndiscretionary portfolios are included in composites, this definition will dictate when a portfolio is included or removed from composites, which in\nturn affects reported performance.\n(Choices B and C) Firms claiming GIPS compliance do not consider a definition for prospective clients. Based on the fundamentals of\ncompliance, firms must provide GIPS reports to all prospective clients and prospective pooled fund investors.\nThings to remember:\nA firm seeking compliance with GIPS standards must define the firm and discretion. GIPS standards state that an investment firm seeking\ncompliance should adopt the broadest definition of the firm. Defining discretion allows firms to be consistent about which portfolios will be included\nin a composite and thus affects reported performance.\nDescribe the fundamentals of compliance, including the recommendations of the GIPS Standards with respect to the definition of the firm and the\nfirm’s definition of discretion", "qhtml": null}, {"n": 17, "q": "To claim compliance with Global Investment Performance Standards (GIPS), a firm most likely will state that it:", "opts": ["calculates performance in accordance with GIPS.", "includes portfolios in composites based on ex ante criteria.", "omits reporting on composites that have been in existence for fewer than 5 years."], "ans": "B", "expl": "Global Investment Performance Standards®, known as GIPS, were created by CFA Institute to provide uniform methods for investment\nmanagers to calculate and present investment results. Compliance with GIPS is voluntary, but to claim compliance, a firm must comply with all\nof the standards; there is no partial compliance.\nA composite is an aggregation of portfolios that are managed to a specific style or strategy. One compliance requirement is that a firm\ngenerally must include all discretionary, fee-paying portfolios in a composite. However, if the firm has established specific criteria for including\nportfolios before creating the composite (ie, ex ante criteria), then it can still claim compliance with GIPS despite the exclusion of portfolios that do\nnot comply with criteria. This prevents a firm from changing its rules to justify excluding one or more portfolios with subpar performance so that the\noverall results look better.\n(Choice A) CFA Institute specifically prohibits firms from using any language to the effect that they calculate returns in accordance with GIPS.\n(Choice C) Firms must present information on all composites for at least 5 years or since inception if the composite has existed for fewer than 5\nyears .\nThings to remember:\nGlobal Investment Performance Standards (GIPS) normally require firms to include all discretionary, fee-paying portfolios in a composite.\nHowever, a firm can establish specific criteria to include portfolios before creating the composite (ie, ex ante criteria). This prevents the firm from\nusing after-the-fact criteria to exclude underperforming portfolios so that its overall performance looks better than it would have.\nDescribe the key concepts of the GIPS standards for firms", "qhtml": null}, {"n": 18, "q": "GIPS standards prevent firms from using misleading performance measurement practices such as presenting:", "opts": ["average returns that exclude terminated portfolios.", "fewer periods of returns than exist for an investment strategy.", "returns of investment strategies that consist of a single portfolio."], "ans": "A", "expl": "Common misleading performance reporting practices\nRepresentative\nSelecting top-performing portfolios to represent overall results\naccounts\nSurvivorship\nExcluding terminated portfolios from average performance\nbias\nVarying\nPresenting only selected periods of strong performance\ntime periods\nThe global standard for investment performance reporting known as GIPS (Global Investment Performance Standards) provides a uniform\napproach for calculating and presenting historical investment performance. Without the GIPS standards, a firm's reporting of its investment\nperformance may be unreliable due to:\nselectively presenting top-performing portfolios to represent the firm's results for a given strategy,\nexcluding portfolios that performed poorly and were terminated, or\npresenting returns for a period of strong performance while excluding periods of weaker performance.\nGIPS require that firms include terminated client accounts, funds, and portfolios as part of the historical performance of a composite. This\npractice results in a more accurate representation of a firm's complete performance. Excluding terminated portfolios that underperformed results\nin overstating performance and leads to misleading reporting.\n(Choice B) GIPS standards prevent firms from selectively presenting performance periods by mandating a minimum number of consecutive years\nto present. If the strategy has existed for more than the minimum number of required reporting years, firms are allowed to present fewer periods\nof historical performance than exist.\n(Choice C) Firms can present results of a single portfolio if it is the only one for a given strategy.\nThings to remember:\nThe performance reporting standards known as GIPS (Global Investment Performance Standards) provide a uniform approach for presenting\nhistorical investment performance. GIPS require that firms include terminated portfolios as part of the historical performance of a composite.\nExplain why the GIPS standards were created, who can claim compliance, and who benefits from compliance", "qhtml": null}];
const CFG = {"title": "Wiley · Introduction To The Global Investment Performance Standards (2)", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Ethical & Professional Standards · 18 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
</html>
