<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "In commodity futures markets, futures prices are more likely to be in contango when:", "opts": ["storage costs are positive.", "the forward curve is downward sloping.", "convenience yields are greater than storage costs."], "ans": "A", "expl": "Commodities are a type of alternative investment in physical products, such as minerals and agricultural goods. A commodity can be owned\ndirectly by the investor, but most commodities investing is accomplished through futures contracts. When the futures price is greater than the\nspot price (ie, price at which the asset currently trades in the market), the futures contract is said to be in contango.\nTo determine the arbitrage-free price of a futures contract, use the following formula:\nWhen an investor owns a commodity directly, the commodity incurs storage costs, which are added to the futures price since the futures owner is\nnot holding the commodity and therefore not paying the costs. The convenience yield represents the investor's imputed benefit from directly\nowning the commodity; this yield is deducted from the futures price since the futures owner does not hold the commodity or receive the benefit.\nThe storage costs are added to the futures price and the convenience yield is deducted from it. This prevents the possibility of arbitrage, in which:\nthe storage costs cause the futures price to be greater than the spot price, and\nthe convenience yield can result in a spot price that is less than the futures price.\nBackwardation occurs when the futures price falls below the spot price; this possibility exists when the convenience yield is greater than the\nstorage costs (Choice C).\n(Choice B) A contract in backwardation produces a downward-sloping forward curve (ie, forward price is less than spot price). A contract in\ncontango has an upward-sloping forward curve.\nThings to remember:\nThe terms contango and backwardation describe a futures contract price as it relates to the underlying commodity's spot price. A contango\n(backwardation) contract has a futures price greater (less) than the underlying spot price. Contango can result when storage costs exceed the\nconvenience yield.\nExplain features of raw land, timberland, and farmland and their investment characteristics", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAvgAAAGjCAIAAADW4fYdAAAzf0lEQVR42u3dX2xbZ3rn8Z/WaZVahQTSsQJsbHmWrgU4WQWDJXfborFngaU2yFq9SB3qYoUJFrsZKoMF0iK9EFN0FkHTzpAXNdrexOQUXWAGkwuxQS6KNJLFuUgygHtB7l4YsQpkeWacyAhg2aJkJ/ZaG0l78Zhvjs8haUqWZFL6fi5k6fjw/HkP/zx8nvd9T8/GxoYAAAD2on9BEwAAAAIdAAAAAh0AAAACHQAAAAIdAAAAAh0AAAACHQAAQKADAABAoAMAAECgAwAAQKADAABAoAMAAECgAwAACHQAAAAIdAAAAAh0AAAACHQAAAAIdAAAAAh0AAAAgQ4AAACBDgAAAIEOAAAAgQ4AAACBDgAAAIEOAAAAgQ4AACDQAQAAINABAAAg0AEAACDQAQAAINABAAAg0AEAAAQ62MdyuVxPe0ZHR7drp8VisVQqlUol2v+Rq9VqtVotl8vlcrnOP8g21y8UCu55yzOtWCzyigOBDrBLJicnJycnx8fHaYpOUCqVEolEIpHo5E9B/0FyybbwihsfH+cVBwIdAACArvcYTYBH+9W8UCjQDuqkwqXneZJisdheOsh0Op1Op3m5SeIVB5HRAQAA2CM2gPtls1n39KhWq9VqtZ1HuYckk8lkMhn4X/+XadtmNpv178jPVpibm/MvzGazgW26b/OxWCwWizXc19zcnH87tlO3Zj6fj0QikUgk8L2/4Snn8/l8Ph9OIUxNTU1NTbXZSmZpaWlpaWlqaiqwqVQqlUql5ubmGj6qXC7bCoFmCbeMXUR/85bLZTtOtyQej8fjcf++WudCrGFbt607u8C+TCQSsTbcVIPYXto5yNZtns/nA0duy/2nYIeXzWb9z4oWh93C9PT09PR0PB4PtECz6+UuWeAJmUwmAy3QzmHbL4HDbvZy87/Mm10It8HAYSSTSf9rMPwUTaVSzd5DrIncC8odcOCpG36sNay/bW3vm71G2D8oXWEva9bjMpPJSAqP2bGsfrFYtA8S92aay+XsIWpURrGHlMtle7/Wg4YLJRIJSVZ80f1jYfybcnu3ikPDMW52VO6Am+19fHw8sLtKpWLbrFarWytUNWvb0dFR23j4xCcnJ+0X91Faq9UktWgQa5NyuRwIGrQzFbHwYbjDtnCqze00fLbUajVbXqlUpqenA43WsGO16xKez+eb7T182Naqmz1s9xwLXz63QfslHAnZ8tHRUfvFfwVta/Y08y8PPH9cO7d4KtqZhtvWzn1yctL25Q9qAVG6AgAAonSF/Vm6aiZQLdpC6SqcgQ+k6LeldGUpbpeTNw2LWXZULiUeOAuXKbGtNSyItKhKNGsKy96HN+X2bgfsShKuQBB+iJUMmpWu7FHugf5jCBy2K0aEr2OgdBVuWys9yFcva3i9/G0Y2KZrkMCmAkfiP8g2n9XtlK7cMfiLlf4WfuBe7FnkP2z/E8+flHLHELhSVvVzrep/iP8Ktj5s3V/+87+mWrziAtfOf/nsiee/6IELET7fQHWp2ZMhEom4fTUsZzd8r7Anp+0o/Cxq52UISlfAHuFy7P6ajlVD7F3brWDvvPbn+Pi41QtqtZo90CXka7WalbfsjXULY3nc3g ng commodities gained through\nderivatives\nDerivative price performance can vary significantly from\nphysical commodity price\nUnderlying commodity exposure can vary substantially\nbetween indexes\nWidely viewed as an inflation hedge\nHistorically low correlations to other asset classes\nCommodity indexes use futures or other derivative contracts to gain exposure to the underlying commodities in each index. This makes the\nindexes more investable and easier to replicate with greater price transparency than direct commodity investments.\nAn index may have exposure to more than one commodity, and each commodity in the index may have a different weight. Futures prices, while\ncertainly affected by changes in the underlying commodity, are also affected by carrying costs and returns on the collateral required for futures\ninvestments. These factors mean that the price of the index is almost certain to differ from the commodity's futures price. Likewise, an underlying\ncommodity's return as measured by a change in its spot price is almost certain to differ from the commodity index's return as measured by a\nchange in its futures price.\n(Choice A) Unlike other alternative investment indexes (eg, hedge funds, private equities), commodity indexes are based on observable market\nprices of commodity derivatives and therefore not subject to the selective reporting that leads to backfill and survivorship bias.\n(Choice B) Underlying commodity exposure and weighting methods can vary substantially between indexes and therefore are not standardized.\nThings to remember:\nCommodity indexes use futures or other derivative contracts to gain exposure to the underlying commodities in each index. Since the futures\nprice of an underlying commodity is almost certain to differ from its spot price, the index's return as measured by a change in its futures price is\nalmost certain to differ from the commodity's return as measured by a change in its spot price.\nExplain features of raw land, timberland, and farmland and their investment characteristics", "qhtml": null, "explfigs": null}, {"n": 3, "q": "Generally, the investment characteristic that best distinguishes farmland from timberland is that farmland:", "opts": ["can be hedged using futures.", "has a role as an inflation hedge.", "lacks the production flexibility of timberland."], "ans": "C", "expl": "Farmland and timberland investments\nFarmland Timberland Common to both\nHarvest quantities\nSources of returns Commodity prices Lumber prices\nLand price changes\nPossibly ESG Inflation hedge\nESG-friendly\nInvestment Regular income Low correlation with traditional\nLong new growth cycle\nattributes Harvest inflexibility; at least annual assets\nHarvest flexibility\nharvest cycle Can hedge with futures\nDirect purchase, but for largest\nInvestment vehicles Publicly traded REITs investors only\nPrivate investment funds\nESG = environmental, social, and governance REIT = Real estate investment trust\nFarmland and timberland have three principal components of return: harvest quantities, changes in commodity prices, and changes in land\nprices. Both types of land are desirable investments due to:\na low occurrence of negative historical annual returns;\nincome streams derived from the sale of crops or timber;\nlow correlations with other financial assets; and\nproviding an inflation hedge due to exposure to commodity and land prices.\nThe most significant difference between farmland and timberland is the harvest cycle. Farm crops, whether row crops (eg, corn, wheat) or\npermanent crops (eg, almonds, grapes) must be harvested when ripe, with little flexibility in production. By contrast, timber does not have to be\nharvested regularly, so if market conditions are unfavorable, the harvest can be delayed indefinitely. Timberland can serve simultaneously as a\nproduction facility (when timber is harvested) as well as a source of raw material (ie, uncut trees).\n(Choice A) Both timberland (ie, lumber) and many farmland crops (eg, corn, wheat) can be hedged through futures on the commodities produced.\n(Choice B) Both farmland and timberland are viewed as inflation hedges.\nThings to remember:\nBoth farmland and timberland provide a regular history of positive returns, diversification benefits, an inflation hedge, and returns comparable to\nequities. The most significant distinguishing investment characteristic of farmland relative to timberland is the harvest cycle: farm crops must be\nharvested at least annually; harvesting of timber can be delayed indefinitely.\nExplain features of raw land, timberland, and farmland and their investment characteristics", "qhtml": null, "explfigs": null}, {"n": 4, "q": "An analyst observes that a commodity's forward curve is in backwardation. This situation most likely implies:", "opts": ["negative roll yield.", "negative collateral yield.", "convenience yield exceeds storage costs."], "ans": "C", "expl": "An investor who owns a physical commodity (eg, copper) incurs storage costs until the commodity is used or sold. However, that investor also\naccrues benefits (eg, immediate availability) from directly owning the commodity; the benefit that offsets storage costs is the convenience yield. In\ncontrast, an investor who owns a futures contract on the same commodity incurs no storage costs until the contract matures and delivery is\naccepted, but no convenience yield is accrued.\nAll else equal, a commodity's futures prices are higher than the spot price by the cost of holding the commodity, which prevents arbitrage.\nTherefore, the typical forward pricing structure for physical commodities is an upward-sloping forward curve (ie, futures prices > spot prices); in\nthat case, the market is said to be in contango.\nA downward-sloping forward curve (ie, futures prices < spot prices), known as backwardation, results from the convenience yield exceeding\nstorage costs. Backwardation often indicates bottlenecks in supply or delivery in the spot market.\n(Choice A) Roll yield is the return (positive or negative) that occurs when a contract nears expiration and the futures price converges with the spot\nprice. Backwardation results in a positive roll yield.\n(Choice B) Collateral yield is a component of a futures contract's price return and should always be positive.\nThings to remember:\nContango and backwardation are terms that describe a futures contract's price relative to the spot price of the underlying commodity. The contract\nis in backwardation if the futures price is lower than the spot price. When this occurs, the convenience yield is greater than the storage costs.\nExplain features of raw land, timberland, and farmland and their investment characteristics", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA4kAAAMjCAIAAACHy8KKAACMS0lEQVR42u39W2ycdbrv+z4mhgQCuMJYDQSJpExz6D17ZKS8G9baGoSZsmgNtBu6Xe7crE6kdnltzU131oXtodZccDPsGhebrCk0yt7SDM2a0nK5paTnDbhMk95iqpErizC0NGEsl0e6pebQpBIkaECTlGlCxxDIvvjhp/9536py+Rgfvp+LyK689R7+9dbfz/v8Ty2XL182AAAAYA24hiIAAAAAsSkAAABAbAoAAABiUwAAAIDYFAAAAMSmAAAAALEpAAAAiE0BAAAAYlMAAAAQmwIAAADEpgAAACA2BQAAAIhNAQAAQGwKAAAAEJsCAACA2BQAAAAgNgUAAACxKQAAAEBsCgAAABCbAgAAgNgUAAAAIDYFAAAAsSkAAABAbAoAAABiUwAAAIDYFAAAAMSmAAAAALEpAAAAiE0BAAAAYlMAAAAQmwIAAADEpgAAACA2BQAAAFZFK0WAja1QKIyNjZlZqVTSK4lEIp1Om1lfX59+wOIK1sxUtmaWz+dTqZSZlctlMxsYGNDrPT092Ww2/vZKpaIfksnkyp1eLpcLj5VOpycnJ5e455U+882gs7NTP+ieyefzlAkAI28KAAAAI28KrLRqtWpm3d3dFqRLw/8tFotmViwWldIbHR2l0Bbq7NmzYfGqzP0Hfz3MTOu/RkZGzGxoaEgpzJXIPpZKpd7e3pW4qUZGRoaGhsxscnKSvOlSPiAKAYCRNwUAAICRNwVWWSRj6r1LE4mEmZ08eXJ4eNjMqtWqeiXu37/fzGp2i8RCKZuo5KKXrXjGdKXP4eTJk+Gv+Xy+v78/TO4uwqqd/Gbgxbh7925KAwCxKTa4YrEYthhms9lIk306ne7q6jKzjo4OvaIRMw2G7ISDaRZ0MuVyWfFQKpVSZGyxZs3m96lhRtVqVSNIlrJD31ih5LzN07qKcrmsg+oEGsSmg4ODa+eW8LONlNgaFN5v8c/Rb6dkMjnvR+Z3S1gISy+BarWqPTdzDpG3+LegydtjQdfrRTfvLdpk/w2d8yK+9baoTg5NfhObuYVUFIlEYt5CiNRvy3UOgNGmDwAAgA3iMrCxZDKZ8A4/c+ZMvS1HR0cnJycnJyfPnz9//vz58L+mpqampqbi+ZJEIpFIJIaGhiK7ijT1jo+Pp9Pp8O2JRGJ0d 1l/f79eaW9vV950amrKzJLJZLlcNrPe3l69Mq96Bw2POzg4aLTpAwAAbAwKH3t7e8fHxxXzKYJUzDc2NuaN5o3t3bv35MmTdmWDeyaTUYhpZtlsVj94A32lUtGW3sTvb9QPOjeLNeXHXzfa9AEAAGCMhQIAAMBy8bZ7tZJ3dXUpi6lf8/m8fujp6Wm8n3Q67e3syo+m0+n9+/ebmfKp2Wx2enrazPbu3VsoFMxsZGRExxoYGDCzycnJsbExMysUCupIsHfvXt+/v0V71q/ef4DYFAAAYCM4e/asme3fv19xoVrhFZXale3sjSWTSTW1V6vViYkJhbNh6Dk6OqreAn19fZ2dnWY2NTWlDgPq6qpwU+egHgWKcS3oYKqOp34so00fAAAARps+AAAAlp3azU+ePOlN+XpFreeDg4PxuUXr0ZalUkn5ztHRUQ35V3K0VCopb5pKpZT19FFW+mFmZka/+gypFhsFFXmLkTcFAACAkTcFAADAslMH05GREXXxrFQqGrGkX3O53OjoqJklEgllPX1VJyUyC4WCNrC5qaBGRkYiC0TpELlczueK8kyqXlGetaenR51frWFSVgfyH4hNAQAANprx8XGNWPKRT4pE8/m8t54rBu3t7dU2Cj37+/s9QNSo/KGhoaGhoXDn8dc1l6qGQHmImc1mfaR/nB9dh2YsFAAAAIw1SwEAAIB5kDcFAAAAsSkAAABAbAoAAIC16f8PQpFDKQ7qRZMAAAAASUVORK5CYII="]}, {"n": 5, "q": "A portfolio manager is seeking an alternative investment to diversify a pension portfolio. If the investment is actively managed, liquid, and a variant of a global macro strategy, it is most likely a:", "opts": ["market-neutral fund.", "merger arbitrage fund.", "managed futures fund."], "ans": "C", "expl": "Managed futures\nActively managed futures trading\nFeatures Absolute return focus\nSubset of global macro approach\nLow/negative correlation to traditional assets\nBenefits Potentially strong performance during equity market corrections\nHigh liquidity\nUse of substantial leverage\nRisks\nSustained periods of relative underperformance\nManaged futures (MF) are alternative investments that actively trade a variety of futures contracts (eg, commodity, interest rate, foreign\nexchange). MF use short-term, trend-following strategies; are absolute-return oriented; and are most commonly associated with global macro\ninvesting. Global macro is an investing strategy based on anticipating moves in macro factors (eg, interest rates, government policy, foreign\nexchange). The primary attraction for MF investors is the low-to-negative correlations with traditional asset classes and high levels of liquidity.\nMF funds are similar in structure to hedge funds and often have comparable incentive fee structures based on fund performance. As with\nnumerous hedge fund strategies that have gone mainstream, many MF products are available in a mutual fund or exchange-traded fund format\n(ie, \"liquid alts\").\n(Choice A) A market-neutral strategy consists of buying undervalued stocks and shorting overvalued stocks to create a portfolio that is immune to\nmarket-level risks and is zero-beta. Market-neutral portfolios do not employ global macro tactics.\n(Choice B) Merger arbitrage pairs merger partners in long and short positions. It is an event-driven, bottom-up strategy and does not use a\nglobal macro approach.\nThings to remember:\nManaged futures (MF) funds are alternative investments that actively trade a variety of futures contracts. MF use short-term, trend-following\nstrategies and are most commonly associated with global macro investing.\nExplain features of raw land, timberland, and farmland and their investment characteristics", "qhtml": null, "explfigs": null}, {"n": 6, "q": "When a commodity's futures prices are in contango, its forward price curve most likely has:", "opts": ["a negative slope.", "a positive roll yield.", "little to no convenience yield."], "ans": "C", "expl": "Slope of the futures curve\nContango Backwardation\nFutures price > spot price Futures price < spot price\nMay result if May result if\nNo convenience yield or Convenience yield > storage costs\nConvenience yield < storage costs\nAn investor who owns a physical commodity (eg, wheat, copper) incurs storage costs until the commodity is used or sold. In contrast, an investor\nwho owns a futures contract on the same commodity incurs no storage costs until the contract matures and delivery is accepted.\nAll else equal, to prevent arbitrage, a commodity's futures prices are set higher than the spot price by the cost of holding the commodity. An\nupward-sloping futures curve (ie, futures prices > spot prices) is the typical forward pricing structure for physical commodities. This structure is\ncalled contango.\nConvenience yield, which offsets the storage costs, is the benefit the investor receives from directly owning the commodity (eg, immediate\navailability). Contango results if the convenience yield is less than the storage costs, which is usually the case. When the futures contract is in\ncontango, there is little to no convenience yield (ie, benefit) to owning the commodity directly.\n(Choice A) Backwardation has a negatively sloped (ie, downward-sloping) forward price curve since the futures price is less than the spot price.\n(Choice B) Roll yield is the return (positive or negative) that occurs when the contract nears its expiration and the futures price converges with the\nspot price. The roll yield for a forward price curve in contango is negative since the futures price is moving toward the lower spot price.\nThings to remember:\nA futures contract is in contango if the futures price is higher than the spot price. When this occurs, the convenience yield of holding the\ncommodity directly is less than the storage costs.\nExplain features of raw land, timberland, and farmland and their investment characteristics", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABCAAAAA4CAIAAACjRB7XAAAWQElEQVR42u2d2XXiSheFy/+671ZHYDmCxhG0FIFFBEAEQASgCIAIDBEAESAisDqCpiNo3Qj8P+zVe9Wt0sTkcX8PvWwaq0pVp6Yz1c3Ly4sRQgghhBBCiEvwPzWBEEIIIYQQQgcMIYQQQgghhA4YQgghhBBCCB0whBBCCCGEEEIHDCGEEEIIIYQOGEIIIYQQQggdMIQQQgghhBA6YAghhBBCCCGEDhhCCCGEEEIIHTCEEEIIIYQQOmAIIYQQQgghhA4YQgghhBBCCB0whBBCCCGEEDpgCCGEEEIIIXTAEEIIIYQQQojz+EdNIIQQoobD4cB/HcIwrPlV2O2mxhFCGFkwhBBCCCGEEMLIgiGEEOKCZFlmjFmtVvw1iiL83Ov17G/2+/0r1WGz2cAUMBqN3qod4jje7XantR4bZzqdGmOiKGIbCiHE5+Pm5eVFrSCuvTUxf90D5CQgxIdfNm6aF46iKIwxeZ53Oh1jTBAE+BX/iw/Nf/2v6jfc2JfbP5QWYWpdlVAWC8LsFIahMy9x1nKq1ObFnfcqisJ+WZxSjDGTyeR9HjA0Y5sv79EH0Q2CwBFdIYxcpIQQQgghhBDmo1gwbm5u6r8wmUyMpWc66ugMFVeSJF+zP6bTaZqm57Th6+syjaXqo//Ac s crude oil. Midstream companies refine the crude oil into gasoline, kerosene, and heating oil. Downstream companies create other\nproducts or services (eg, tires, retail gas stations) from the refined commodity.\nAn oil and gas sector hedge fund that focuses on midstream companies most likely invests in a gasoline refinery. A drilling company is an\nupstream company (Choice B), and a plastics manufacturer is an example of a downstream company (Choice C).\nThings to remember:\nCommodities investing includes alternative investment funds that focus on companies involved in the production of commodities. The oil and gas\nsector of energy commodities is divided into upstream, midstream, and downstream companies. Each category refers to where a company is\nlocated within the overall supply chain.\nExplain features of raw land, timberland, and farmland and their investment characteristics", "qhtml": null, "explfigs": null}, {"n": 8, "q": "Historical monthly changes in a country's consumer price index (CPI) have been negatively correlated with both global equity and global bond returns. To capture the potential benefits of these correlations in a diversified portfolio, an investor would most appropriately invest in which of the following?", "opts": ["Greenfield infrastructure project", "Fixed-income convertible arbitrage", "Broad-based commodity index fund"], "ans": "C", "expl": "Alternative investments refer to investments in nontraditional assets such as commodities, real estate, private equity, and hedge funds. The\nprimary motivation for adding alternative investments to a traditional portfolio is to improve the risk-reward profile since alternative assets generally\nhave relatively low correlations with traditional assets.\nCommodities offer attractive investment opportunities due to historically low correlations of their returns with traditional assets and for their\ninflation protection. Commodity indexes are viewed as particularly good inflation hedges since commodities directly (eg, food, energy prices) or\nindirectly (eg, housing costs) affect the underlying calculation of the inflation indexes [eg, consumer price index (CPI)]. Therefore, commodities\ngenerally have relatively high positive correlations with inflation measures and are considered one of the best alternatives for capturing and\nhedging against inflation trends.\n(Choice A) A greenfield investment is an infrastructure investment that has not yet been built. Infrastructure projects generally carry considerable\nproject-specific risk and return profiles. Although a direct infrastructure investment may provide diversification benefits, its return profile is unlikely\nto be correlated with consumer prices.\n(Choice B) Fixed-income convertible arbitrage attempts to profit from mispricing between the embedded equity option in a convertible bond and\nthe underlying common stock. This strategy relies on capturing short-term, event-driven pricing discrepancies and is unrelated to long-term\ninflation trends represented in a CPI.\nThings to remember:\nInvestors are attracted to commodities due to their historically low correlations of returns with traditional assets and for their inflation protection.\nCommodity indexes are viewed as particularly good inflation hedges since commodities directly or indirectly affect the underlying calculation of the\ninflation indexes [eg, consumer price index (CPI)] and therefore have relatively high positive correlations with inflation measures.\nExplain features of raw land, timberland, and farmland and their investment characteristics", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAowAAADrCAIAAABsP1BKAAA1oElEQVR42u2dTWwjyZXnn6pUXW6UG0q14UP5MEp1Y4E5WSSwwJy6lMQa7VM3ScygT9MmiVnPyR6SWMxp7CU54zkZA5LrOc3sgmR7ToMFRNonG14o2XNqwIBSPjQMzEEpH/3RSh0KdlWrSnv4ux6iIz9ISRRFVf9/hwIrlRkZHy/ixXvxInLt/PxcCCGEELJ63GEVEEIIIVTShBBCCKGSJoQQQqikCSGEEEIlTQghhFBJE0IIIYRKmhBCCCFU0oQQQgiVNCGEEEKopAkhhBAqaUIIIYRQSRNCCCGESpoQQgihkiaEE /SbEHcvta0DAAAAAElFTkSuQmCC"]}, {"n": 9, "q": "Which of the following alternative investments is the least likely candidate to meet environmental, social, and governance (ESG) investing criteria?", "opts": ["Timberland", "Managed futures", "Greenfield renewables utility project"], "ans": "B", "expl": "Alternative investments overview\nMotivations for using Constraints of using\nExploit less efficient markets\nHigh fees\nLow correlations with traditional\nLow transparency, due diligence\ninvestments\nrequired\nDiversification benefits within\nLess regulatory investor protection\nalternatives\nPotential legal/tax consequences\nHigher expected returns\nUnderlying investments can be\nPositive absolute returns\nilliquid\nAlpha creation/superior risk-\nLockup/redemption restrictions\nadjusted returns\nAlternative investments are investments in nontraditional assets, such as hedge funds, private equity, infrastructure, and natural resources.\nAlternative investments typically operate in less efficient markets that provide investment managers with greater potential to exploit mispricing\nthrough active investment strategies.\nAn additional motivation for incorporating alternative investments in a portfolio is an ability to meet environmental, social, and governance (ESG)\ninvesting goals. For example, infrastructure investing has seen the adoption of frameworks such as the Equator Principles, which incorporate\nESG criteria for infrastructure projects, especially by global financial institutions that provide major infrastructure financing. Thus, a greenfield (ie,\nnew) renewables utility project (eg, wind, solar, water) would most likely be ESG compliant (Choice C).\nTimberland is also an obvious candidate to invest in to achieve ESG goals. Timber benefits from its positive environmental impact of\nabsorbing carbon dioxide (CO ) (ie, acting as a carbon sink), thus offsetting some carbon emissions (ie, air pollution). Combined with otherwise\n2\nattractive investment characteristics (eg, low correlations, competitive returns), timberland is often a preferred choice of ESG investors (Choice\nA).\nOutside of very limited circumstances (eg, minority-owned firm), which could be true for almost any investment, managed futures do not have\nwidespread application within ESG investing.\nThings to remember:\nFor investors seeking alternative investments, timberland and greenfield infrastructure stand out as likely candidates to achieve environmental,\nsocial, and governance (ESG) goals. Timber benefits from its positive environmental impact of absorbing carbon dioxide, thus offsetting some\nhuman-related carbon emissions. Greenfield infrastructure is also likely to adhere to ESG frameworks.\nExplain features of raw land, timberland, and farmland and their investment characteristics", "qhtml": null, "explfigs": null}, {"n": 10, "q": "An analyst has compiled the following spot and futures pricing data for a commodity: Which of the following best describes the commodity's spot and futures prices?", "opts": ["In contango", "In backwardation", "Having zero convenience yield"], "ans": "B", "expl": "Slope of the futures curve\nContango Backwardation\nFutures price > spot price Futures price < spot price\nMay result if May result if\nNo convenience yield or Convenience yield > storage costs\nConvenience yield < storage costs\nWhen a commodity's spot price is higher (lower) than its futures price, the futures curve is said to be in backwardation (contango). For most\ncommodities, under normal circumstances, contango is the typical forward pricing structure.\nIf an investor physically owns a commodity, the investor pays storage costs until the commodity is used or resold. An investor who owns a futures\ncontract incurs no storage costs until the futures contract matures. Storage costs are usually reflected in futures price to prevent the possibility of\narbitrage. Storage costs cause the commodity futures price to be higher than the spot price.\nThe convenience yield is the benefit the investor receives from currently owning the commodity (ie, its availability). Therefore, it is deducted from\nthe spot price. When the convenience yield is high and/or greater than the storage costs, the spot price may be higher than the futures price,\ncreating backwardation.\n(Choices A and C) When the spot price is lower than the underlying futures price, the contract is in contango. Contango can result when there is\nlittle to no (ie, zero) convenience yield to owning the commodity, often due to high storage costs.\nThings to remember:\nContango and backwardation are terms that describe the relative position of a futures price to the spot price of the underlying commodity. A\ncontract in backwardation has a spot price that is higher than the futures price. Backwardation is possible when the convenience yield is high\nand/or higher than the storage costs.\nExplain features of raw land, timberland, and farmland and their investment characteristics", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABEQAAAIxCAIAAADL2Po8AAChr0lEQVR42uzdd2CUVdbH8e+0TCa9h0BCEnoJEVQQUWyAva9d19V17aso9t4LtrViWXtZK/aGZbGLiAJKJ4QeCOl1MsmU948D80ZA14IQwu/zR8TJJJnnPvXcc+69jkgkgoiIiIiIyNbGqSYQEREREREFMyIiIiIiIgpmREREREREFMyIiIiIiIiCGREREREREQUzIiIiIiIiCmZERERERETBjIiIiIiIiIIZERERERERBTMiIiIiIiIKZkRERERERMGMiIiIiIiIghkREREREREFMyIiIiIiomBGREREREREwYyIiIiIiIiCGRERERERUTAjIiIiIiKiYEZEREREROTP4N5aPmhrayvg8XgcDsfveEM4HPb7/UAkEvF6vfZO7X4REREREZSZERERERERQZmZ9cyePfvGG28Errvuuj59+mz4hjlz5txwww3ANddc069fv/bfamtrAx599NEXXngB8Pv9w4YNA6699tqMjAwdASIiIiIiCmY2vXA4PHfuXODUU0/97rvvgLFjx673hnnz5tkbpk6dCvzzn/+MfjcSiQB33323BTP77bcfkJiY+PzzzwPV1dX3338/kJaWpuNARERERASVmYmIiIiIiLDNZmZCoRDw7LPP3nnnnUBJSYkN67dkCxAOh4FnnnnG3rBo0SKnc/3AbPXq1fZLgFGjRl199dWAz+fLzMwErr/++vfffx849thjgZ+bV0BERERERFBmRkREREREhM6dmVmyZAkwYcKEvn37AmPGjHnmmWdYl5ABli5dCjz44IM2H0D0DZbSMZMnTwZWrFgBDB8+PDo25sgjjwQeeOCBzz//HDj44IOBhIQEHQ0iIiIiIgpm/qjc3FzgoYce6t69O/Daa6/Rbkw/0K1bNwtm7A1 higher price, resulting in a loss on the roll.\nThings to remember:\nBackwardation allows investors to enhance the return for long-only commodity positions by rolling an expiring contract to a future-dated contract at\na lower price (and thus a lower cost) than the current spot, thus locking in a gain on the roll.\nExplain features of raw land, timberland, and farmland and their investment characteristics", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA+AAAAKoCAIAAAB4OQKfAACS8klEQVR42u39f4xb93nnfX+oGY00sn4dOrVlJZa1pLC7TWDHBQe7WFRptACJzR8O4OIOuQWSbl3gfsgFEjy3/wqJdBdxgW4xDLKIeyMpSmKBVZ51gd7DFOtFAtwJhn8oiQ1kk+Gzkt2kuQsPKzdPbMuJhrJlS7JGo3n+uDRXj84hOZwfnOHMvF9/CByKPD++PCQvXuf6XiexvLwsAAAAAKNhH0MAAAAAEKADAAAAIEAHAAAACNABAAAAEKADAAAABOgAAAAACNABAAAAAnQAAAAABOgAAAAAAToAAAAAAnQAAACAAB0AAAAAAToAAAAAAnQAAACAAB0AAAAAAToAAABAgA4AAACAAB0AAAAgQAcAAABAgA4AAAAQoAMAAAAgQAcAAAAI0AEAAAAQoAMAAAAE6AAAAAAI0AEAAAAQoAMAAAAE6AAAAAAI0AEAAAACdAAAAAAE6NgpqtVqtVpNrGg2m3Z/u91OhFSrVX9KOp1Op9OJRCKXy+VyuW3c+Eaj0Ww2fZuHrdVqtVqter0euX90BmTTh9d3zSSTyWQyybtmW+RyOX8hwveXSqWu9/uLOOy3ib0vwptn7P5hvOMAgAAdAAAA2EPGGQJgHUqlkqR6vT47O7s1a6zX67bS6enpXT+8nU5HUqFQ4Ejb6W8TSz8P9W1i74sNJsvjbzdf8l54xwEgQAd2vGazufVnvS1W6Gp+fn5XBuiuXC4TJ42sWq1Wq9Xi7xEPc7fsaMlkMpLm5uaG+nYDAFHiAgAAABCgA9qhk9h6zWOr1+v1et3/y/70/22326VSKTzXzUxNTUUeaVNawxMxfaXtdrvdbofXYivqNYPTJs9NTU1FVlooFGxRkmxqXWR3KpWKL1yDTRK1FYXXZU/pleD0h5VKpfh2ViqVSqWitc+3KxQKhUIhMvc3PP3XB9k2Lz6TuOvjB1yXbbaP7SBPicxOVmxWro15fIj8sLEbNrfVJ7k2Go3+03zjr5e/Ur5AnzVra1e3vHKn0/GjJfyalkqlroPgox1+fDqd7rUK9Zgkau+Rrm+TyDux12J9B/uUOfm7w19Tm9Ppr0vkYI6/NSLv+na77csMPyz+jlvTMrve7+/r+FFt2xB+9W30es2yDX/IDHi0a7VZ+z7+9jEY/ySMDELXcQgPgm1GfBAi4+DvlF4vvb8vIh8RkVeq/yfMmj7zAVHiAmibSilyuVyvoM3OdHc6HauyWKtKpeLn34Mg8HBZvQusreWFNqlwxb6c4vG0f19a5W68RKFPMY8t0/ar1xPj1Q5dfznYhtmAzM7O+hBpA2037Fu811DYuubm5nxdfTbPtrD/5llk37VAwl/KeG291WRns9mu2991gbYZ8QXag2dnZ8NLa7fbtkfxA9te0EajYdtgZSHhlyMS0LTb7U2cDGCrC4LAhqLVauXz+cjxH65aiQ/R7tB1SHt9MtiL3mw27e1WLBb7v7v7HO2rblX8J5Mdkxv8JBxwEGzXfOPtMP   try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      if(q.explfigs){q.explfigs.forEach(function(u){var im=document.createElement("img");im.className="qfig";im.src=u;im.alt="exhibit";e.appendChild(im);});}
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
