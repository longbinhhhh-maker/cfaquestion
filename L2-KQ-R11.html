/td><td>12,000<\/td><\/tr><tr><td>Retained earnings<\/td><td>1,438<\/td><td>2,004<\/td><td>2,668<\/td><td><\/td><td>750<\/td><td>1,031<\/td><td>1,384<\/td><\/tr><\/table><\/div><div class=\"tbl\"><table><tr><td>Total liabilities and<br>shareholders equity<\/td><td>31,337<\/td><td>33,084<\/td><td>35,518<\/td><td><\/td><td>25,070<\/td><td>25,604<\/td><td>27,907<\/td><\/tr><tr><td>% change gross sales<\/td><td><\/td><td>7.0%<\/td><td>6.0%<\/td><td><\/td><td><\/td><td>8.0%<\/td><td>11.7%<\/td><\/tr><tr><td>% change sales discounts<br>and allowances<\/td><td><\/td><td>6.0%<\/td><td>6.0%<\/td><td><\/td><td><\/td><td>8.0%<\/td><td>33.3%<\/td><\/tr><tr><td>% change net sales<\/td><td><\/td><td>7.0%<\/td><td>6.0%<\/td><td><\/td><td><\/td><td>8.0%<\/td><td>11.1%<\/td><\/tr><tr><td>% change cost of goods<br>sold<\/td><td><\/td><td>7.0%<\/td><td>6.0%<\/td><td><\/td><td><\/td><td>8.0%<\/td><td>17.0%<\/td><\/tr><tr><td>% change in SG&amp;A<\/td><td><\/td><td>6.0%<\/td><td>6.0%<\/td><td><\/td><td><\/td><td>8.0%<\/td><td>5.1%<\/td><\/tr><tr><td>% change in depreciation<br>expense<\/td><td><\/td><td>6.0%<\/td><td>6.0%<\/td><td><\/td><td><\/td><td>3.0%<\/td><td>0.2%<\/td><\/tr><tr><td>% change in accounts<br>receivable<\/td><td><\/td><td>6.0%<\/td><td>6.0%<\/td><td><\/td><td><\/td><td>2.0%<\/td><td>22.3%<\/td><\/tr><tr><td>% change in inventories<\/td><td><\/td><td>5.0%<\/td><td>13.8%<\/td><td><\/td><td><\/td><td>0.0%<\/td><td>(13.5%)<\/td><\/tr><tr><td>Revenues % cash<br>collections<\/td><td>1.03<\/td><td>1.03<\/td><td>1.03<\/td><td><\/td><td>1.0<\/td><td>1.0<\/td><td>1.1<\/td><\/tr><tr><td>Days inventory<br>outstanding<\/td><td>155<\/td><td>153<\/td><td>164<\/td><td><\/td><td>144<\/td><td>143<\/td><td>106<\/td><\/tr><tr><td>Balance sheet accrual ratio<\/td><td>3.4%<\/td><td>3.5%<\/td><td>3.9%<\/td><td><\/td><td>2.0%<\/td><td>2.4%<\/td><td>10.1%<\/td><\/tr><tr><td>Cash flow accrual ratio<\/td><td>3.4%<\/td><td>3.5%<\/td><td>3.8%<\/td><td><\/td><td>2.0%<\/td><td>2.0%<\/td><td>4.3%<\/td><\/tr><\/table><\/div><p>The quality of earnings as measured by balance-sheet-based accruals ratios showed:<\/p><\/div>", "subj": "fsa"}, {"n": 24, "q": "Galaxy Company recognized a restructuring charge in its year-end income statement. Similar restructuring charges have occurred in the past. In addition, Galaxy recognized an extraordinary loss. Galaxy uses the term \"operational earnings\" when discussing its financial results. According to Galaxy, \"operational earnings\" excludes special nonrecurring transactions such as restructuring charges, discontinued operations, and extraordinary items. Should the restructuring charge and extraordinary loss be included or excluded from \"operational earnings\" for analytical purposes?", "opts": ["One is included.", "Both are excluded.", "Both are included."], "ans": "A", "expl": "The restructuring charge does not appear to be nonrecurring; thus, it should be included in \"operational earnings.\" By definition, an extraordinary loss is unusual in nature and infrequent in occurrence. Therefore, the extraordinary loss should be excluded from \"operational earnings.\"", "explhtml": "<p>The restructuring charge does not appear to be nonrecurring; thus, it should be included in &quot;operational earnings.&quot; By definition, an extraordinary loss is unusual in nature and infrequent in occurrence. Therefore, the extraordinary loss should be excluded from &quot;operational earnings.&quot;<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.1, LOS 11.b<\/div><div class=\"qtext\"><p>Galaxy Company recognized a restructuring charge in its year-end income statement. Similar restructuring charges have occurred in the past. In addition, Galaxy recognized an extraordinary loss. Galaxy uses the term &quot;operational earnings&quot; when discussing its financial results. According to Galaxy, &quot;operational earnings&quot; excludes special nonrecurring transactions such as restructuring charges, discontinued operations, and extraordinary items. Should the restructuring charge and extraordinary loss be included or excluded from &quot;operational earnings&quot; for analytical purposes?<\/p><\/div>", "subj": "fsa"}, {"n": 25, "q": "Complete the following sentence. An analyst would apply _________ to the cash component of income compared to the accrual component when evaluating company performance.", "opts": ["the same weighting.", "a lower weighting.", "a higher weighting."], "ans": "C", "expl": "Since the cash component has more sustainability in the future than the accrual component, an analyst would apply a higher weighting to the cash component of income than the accrual component when evaluating company performance.", "explhtml": "<p>Since the cash component has more sustainability in the future than the accrual component, an analyst would apply a higher weighting to the cash component of income than the accrual component when evaluating company performance.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.2, LOS 11.f<\/div><div class=\"qtext\"><p>Complete the following sentence. An analyst would apply _________ to the cash component of income compared to the accrual component when evaluating company performance.<\/p><\/div>", "subj": "fsa"}, {"n": 26, "q": "High-quality cash flow is least likely to be characterized by:", "opts": ["Financing cash flows sufficient to cover capital expenditures, dividends and debt repayments.", "No significant differences between operating cash flow and reported earnings.", "Volatility of operating cash flow being lower than that of the firm’s peers."], "ans": "A", "expl": "High-quality cash flow is characterized by positive OCF that is derived from sustainable sources and is adequate to cover capital expenditures, dividends, and debt repayments. Furthermore, high-quality OCF is characterized by lower volatility than that of the firm's peers. Significant differences between OCF and earnings, or differences that widen over time, can be an indicator of earnings manipulation.", "explhtml": "<p>High-quality cash flow is characterized by positive OCF that is derived from sustainable sources and is adequate to cover capital expenditures, dividends, and debt repayments. Furthermore, high-quality OCF is characterized by lower volatility than that of the firm&#x27;s peers. Significant differences between OCF and earnings, or differences that widen over time, can be an indicator of earnings manipulation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.4, LOS 11.l<\/div><div class=\"qtext\"><p>High-quality cash flow is least likely to be characterized by:<\/p><\/div>", "subj": "fsa"}, {"n": 27, "q": "Which one of the following choices is least likely to be an indicator of poor-quality earnings?", "opts": ["An investigation by the market regulatory authority is initiated.", "Restatement of previously issued financial statements.", "Reported earnings handily beat analyst estimates."], "ans": "C", "expl": "Enforcement actions by regulatory authorities and restatements of previously issued financial statements are two (external) indicators of poor-quality earnings. Earnings that meet or narrowly beat analyst estimates are considered to be suspect for poor quality. Handily beating analyst estimates is not considered to be an indicator of poor-quality earnings.", "explhtml": "<p>Enforcement actions by regulatory authorities and restatements of previously issued financial statements are two (external) indicators of poor-quality earnings. Earnings that meet or narrowly beat analyst estimates are considered to be suspect for poor quality. Handily beating analyst estimates is not considered to be an indicator of poor-quality earnings.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.2, LOS 11.e<\/div><div class=\"qtext\"><p>Which one of the following choices is least likely to be an indicator of poor-quality earnings?<\/p><\/div>", "subj": "fsa"}, {"n": 28, "q": "Classification of non-operating income as operating would lead to stated earnings that are likely to be:", "opts": ["non-compliant with GAAP.", "compliant with GAAP but not sustainable.", "compliant with GAAP and sustainable."], "ans": "B", "expl": "Non-operating income is less likely to recur and hence the earnings that include such misclassified non-operating income would be considered non-sustainable. The misclassification need not always be GAAP non-compliant.", "explhtml": "<p>Non-operating income is less likely to recur and hence the earnings that include such misclassified non-operating income would be considered non-sustainable. The misclassification need not always be GAAP non-compliant.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.2, LOS 11.f<\/div><div class=\"qtext\"><p>Classification of non-operating income as operating would lead to stated earnings that are likely to be:<\/p><\/div>", "subj": "fsa"}, {"n": 29, "q": "Charles Nicholls, chief investment officer of Gertmann Money Management, is reviewing the year-end financial statements of Zartner Canneries. In those statements he sees a sharp increase in inventories well above the sales-growth rate, and an increase in the discount rate for its pension liabilities. To determine whether or not Zartner Canneries is cooking the books, what should Nicholls do?", "opts": ["Check Zartner’s cash-flow statement and review its footnotes.", "Calculate Zartner’s turnover ratios and review the footnotes of its competitors.", "Analyze trends in Zartner’s receivables and consider the changing characteristics of its work force."], "ans": "B", "expl": "To assess the meaning of the inventory increase, look for declines in inventory turnover. And if Zartner changes its pension assumptions, Nicholls should see how those new assumptions compare to those found in the footnotes of financial statements from other companies in the same industry.", "explhtml": "<p>To assess the meaning of the inventory increase, look for declines in inventory turnover. And if Zartner changes its pension assumptions, Nicholls should see how those new assumptions compare to those found in the footnotes of financial statements from other companies in the same industry.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.1, LOS 11.b<\/div><div class=\"qtext\"><p>Charles Nicholls, chief investment officer of Gertmann Money Management, is reviewing the year-end financial statements of Zartner Canneries. In those statements he sees a sharp increase in inventories well above the sales-growth rate, and an increase in the discount rate for its pension liabilities. To determine whether or not Zartner Canneries is cooking the books, what should Nicholls do?<\/p><\/div>", "subj": "fsa"}, {"n": 30, "q": "In the context of the Beneish model to evaluate the probability of earnings manipulation, an increase in Days Sales Receivable Index is least likely to signify:", "opts": ["revenue inflation.", "a decrease in probability of earnings manipulation.", "an increase in M-score."], "ans": "B", "expl": "An increase in Days Sales Receivable Index indicates revenue inflation and increases the M-score, thereby increasing the probability of earnings manipulation.", "explhtml": "<p>An increase in Days Sales Receivable Index indicates revenue inflation and increases the M-score, thereby increasing the probability of earnings manipulation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.2, LOS 11.c<\/div><div class=\"qtext\"><p>In the context of the Beneish model to evaluate the probability of earnings manipulation, an increase in Days Sales Receivable Index is least likely to signify:<\/p><\/div>", "subj": "fsa"}, {"n": 31, "q": "Duster Corporation's year-end income statement reported the following: Operating income  $187,000 Results from discontinued operations:   Loss from segment operations   (net of $1,440 tax effect) ($2,160)  Gain on segment disposal   (net of $8,640 tax effect) 12,960 10,800 Gain on sale of equipment  3,400 Interest expense  12,400 Extraordinary loss   (net of $2,200 tax benefit)  3,300 Income tax expense  71,200 Calculate Duster's income from continuing operations for the year.", "opts": ["$106,800.", "$103,500.", "$100,200."], "ans": "A", "expl": "Income from continuing operations includes all revenues and expenses except discontinued operations and extraordinary items: $187,000 operating income + $3,400 gain on sale of equipment – $12,400 interest expense – $71,200 income tax expense = $106,800.", "explhtml": "<p>Income from continuing operations includes all revenues and expenses except discontinued operations and extraordinary items: $187,000 operating income + $3,400 gain on sale of equipment – $12,400 interest expense – $71,200 income tax expense = $106,800.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.1, LOS 11.b<\/div><div class=\"qtext\"><p>Duster Corporation&#x27;s year-end income statement reported the following:<\/p><div class=\"tbl\"><table><tr><td>Operating income<\/td><td><\/td><td>$187,000<\/td><\/tr><tr><td>Results from discontinued operations:<\/td><td><\/td><td><\/td><\/tr><tr><td>Loss from segment operations<\/td><td><\/td><td><\/td><\/tr><tr><td>(net of $1,440 tax effect)<\/td><td>($2,160)<\/td><td><\/td><\/tr><tr><td>Gain on segment disposal<\/td><td><\/td><td><\/td><\/tr><tr><td>(net of $8,640 tax effect)<\/td><td>12,960<\/td><td>10,800<\/td><\/tr><tr><td>Gain on sale of equipment<\/td><td><\/td><td>3,400<\/td><\/tr><tr><td>Interest expense<\/td><td><\/td><td>12,400<\/td><\/tr><tr><td>Extraordinary loss<\/td><td><\/td><td><\/td><\/tr><tr><td>(net of $2,200 tax benefit)<\/td><td><\/td><td>3,300<\/td><\/tr><tr><td>Income tax expense<\/td><td><\/td><td>71,200<\/td><\/tr><\/table><\/div><p>Calculate Duster&#x27;s income from continuing operations for the year.<\/p><\/div>", "subj": "fsa"}, {"n": 32, "q": "High results quality is most likely demonstrated by:", "opts": ["an adequate level of return that is sustainable.", "high level of earnings determined conservatively.", "GAAP compliant financial reports that are decision useful."], "ans": "A", "expl": "High results quality occurs if the level of earnings provides an adequate level of return and that the earnings are sustainable.", "explhtml": "<p>High results quality occurs if the level of earnings provides an adequate level of return and that the earnings are sustainable.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.1, LOS 11.a<\/div><div class=\"qtext\"><p>High results quality is most likely demonstrated by:<\/p><\/div>", "subj": "fsa"}, {"n": 33, "q": "De Freitas Inc. (De Freitas) is a conglomerate. Its computer division was very profitable in the current year because it launched a successful new lightweight laptop computer. Prices in the automobile division have been rising over the years but it is engaged in a LIFO liquidation in the current year. Which of the following best describes the effect on the long-run earnings of the computer division and the automobile division compared to the most recent year? Computer  Automobile | division  division | earnings  earnings", "opts": ["Decrease Increase", "Increase Decrease", "Decrease Decrease"], "ans": "C", "expl": "When examining earnings, analysts should be aware that earnings at extreme levels tend to revert back to normal levels over time. This phenomenon is known as mean reversion. For example, capital is attracted to successful projects (i.e. the new laptop) thereby increasing competition and decreasing earnings in the long-run. A LIFO liquidation involves selling more goods than are replaced. Thus, the automobile division penetrated the older, lower cost layers of inventory thereby increasing profit. This higher profitability is not sustainable, however, because the firm will eventually run out of lower priced inventory. In the long-run, the earnings will decrease (to normal levels).", "explhtml": "<p>When examining earnings, analysts should be aware that earnings at extreme levels tend to revert back to normal levels over time. This phenomenon is known as mean reversion. For example, capital is attracted to successful projects (i.e. the new laptop) thereby increasing competition and decreasing earnings in the long-run.<\/p><p>A LIFO liquidation involves selling more goods than are replaced. Thus, the automobile division penetrated the older, lower cost layers of inventory thereby increasing profit. This higher profitability is not sustainable, however, because the firm will eventually run out of lower priced inventory. In the long-run, the earnings will decrease (to normal levels).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.1, LOS 11.b<\/div><div class=\"qtext\"><p>De Freitas Inc. (De Freitas) is a conglomerate. Its computer division was very profitable in the current year because it launched a successful new lightweight laptop computer. Prices in the automobile division have been rising over the years but it is engaged in a LIFO liquidation in the current year. Which of the following best describes the effect on the long-run earnings of the computer division and the automobile division compared to the most recent year?<\/p><div class=\"tbl\"><table><tr><td>Computer<\/td><td>Automobile<\/td><\/tr><tr><td>division<\/td><td>division<\/td><\/tr><tr><td>earnings<\/td><td>earnings<\/td><\/tr><\/table><\/div><\/div>", "subj": "fsa"}, {"n": 34, "q": "To assess the quality of financial reports, which question is least necessary for an analyst to answer?", "opts": ["Do earnings represent an adequate level of return?", "Are the financial reports decision useful and GAAP compliant?", "Are reported earnings consistent with the firm’s budget?"], "ans": "C", "expl": "Quality of financial reports is assessed by answering two questions: Whether the financial reports are decision useful and GAAP compliant and whether the results quality is high (i.e., earnings provide adequate return on capital and are sustainable).", "explhtml": "<p>Quality of financial reports is assessed by answering two questions: Whether the financial reports are decision useful and GAAP compliant and whether the results quality is high (i.e., earnings provide adequate return on capital and are sustainable).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.1, LOS 11.a<\/div><div class=\"qtext\"><p>To assess the quality of financial reports, which question is least necessary for an analyst to answer?<\/p><\/div>", "subj": "fsa"}, {"n": 35, "q": "High Plains Tubular Company is a leading manufacturer and distributor of quality steel products used in energy, industrial, and automotive applications worldwide. The U.S. steel industry has been challenged by competition from foreign producers located primarily in Asia. All of the U.S. producers are experiencing declining margins as labor costs continue to increase. In addition, the U.S. steel mills are technologically inferior to the foreign competitors. Also, the U.S. producers have significant environmental issues that remain unresolved. High Plains is not immune from the problems of the industry and is currently in technical default under its bond covenants. The default is a result of the failure to meet certain coverage and turnover ratios. Earlier this year, High Plains and its bondholders entered into an agreement that will allow High Plains time to become compliant with the covenants. If High Plains is not in compliance by year end, the bondholders can immediately accelerate the maturity date of the bonds. In this case, High Plains would have no choice but to file bankruptcy. High Plains follows U.S. GAAP. For the year ended 2008, High Plains received an unqualified opinion from its independent auditor. However, the auditor's opinion included an explanatory paragraph about High Plains' inability to continue as a going concern in the event its bonds remain in technical default. At the end of 2008, High Plains' Chief Executive Officer (CEO) and Chief Financial Officer (CFO) filed the necessary certifications required by the Securities and Exchange Commission (SEC). To get a better understanding of High Plains' financial situation, it is helpful to review High Plains' cash flow statement found in Exhibit 1 and selected financial footnotes found in Exhibit 2. Exhibit 1: Cash Flow Statement High Plains Tubular Cash Flow Statement    Year ended December 31,  in thousands 2008 2007 Net income $158,177 $121,164 Depreciation expense 34,078 31,295 Deferred taxes 7,697 11,407 Receivables (144,087) (24,852) Inventory (79,710) (72,777) Payables 36,107 22,455 Cash flow from operations $12,262 $88,692 Cash flow from investing ($39,884) ($63,953) Cash flow from financing $82,676 $6,056 Change in cash $55,054 $30,795 Exhibit 2: Selected Financial Footnotes 1. During 2008, High Plains' sales increased 27% over 2007. Its sales growth continues to significantly exceed the industry average. Sales are recognized when a firm order is received from the customer, the sales price is fixed and determinable, and collectability is reasonably assured. 2. The cost of inventories is determined using the last-in, first-out (LIFO) method. Had the first-in, first-out method been used, inventories would have been $152 million and $143 million higher as of December 31, 2008 and 2007, respectively. 3. Effective January 1, 2008, High Plains changed its depreciation method from the double-declining balance method to the straight-line method in order to be more comparable with the accounting practices of other firms within its industry. The change was not retroactively applied and only affects assets that were acquired on or after January 1, 2008. 4. High Plains made the following discretionary expenditures for maintenance and repair of plant and equipment and for advertising and marketing: in millions 2008 2007 2006 Maintenance and repairs $180 $184 $218 Advertising and marketing 94 108 150 5. During the fiscal year ended December 31, 2008, High Plains sold $50 million of its accounts receivable, with recourse, to an unrelated entity. All of the receivables were still outstanding at year end. 6. High Plains conducts some of its operations in facilities leased under noncancelable finance (capital) leases. Certain leases include renewal options with provisions for increased lease payments during the renewal term. 7. High Plains' average net operating assets at the end of 2008 and 2007 was $977.89 million and $642.83 million, respectively. Which of the following statements about evaluating High Plains' financial reporting quality is least accurate?", "opts": ["Higher Plains may have manipulated earnings due to the risk of default.", "High Plains’ extreme revenue growth will likely revert back to normal levels over time.", "Because of the estimates involved, a higher weighting should be assigned to the accrual component of High Plains’ earnings as compared to the cash component."], "ans": "C", "expl": "It appears that High Plains manipulated its earnings upward in 2008 to avoid default under its bond covenants. However, the higher earnings are lower quality as measured by the cash flow accrual ratio. Because of the estimates involved, a lower weighting should be assigned to the accrual component of High Plains' earnings. Extreme earnings (including revenues) tend to revert to normal levels over time (mean reversion).", "explhtml": "<p>It appears that High Plains manipulated its earnings upward in 2008 to avoid default under its bond covenants. However, the higher earnings are lower quality as measured by the cash flow accrual ratio. Because of the estimates involved, a lower weighting should be assigned to the accrual component of High Plains&#x27; earnings. Extreme earnings (including revenues) tend to revert to normal levels over time (mean reversion).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.2, LOS 11.f<\/div><div class=\"qtext\"><p>High Plains Tubular Company is a leading manufacturer and distributor of quality steel products used in energy, industrial, and automotive applications worldwide.<\/p><p>The U.S. steel industry has been challenged by competition from foreign producers located primarily in Asia. All of the U.S. producers are experiencing declining margins as labor costs continue to increase. In addition, the U.S. steel mills are technologically inferior to the foreign competitors. Also, the U.S. producers have significant environmental issues that remain unresolved.<\/p><p>High Plains is not immune from the problems of the industry and is currently in technical default under its bond covenants. The default is a result of the failure to meet certain coverage and turnover ratios. Earlier this year, High Plains and its bondholders entered into an agreement that will allow High Plains time to become compliant with the covenants. If High Plains is not in compliance by year end, the bondholders can immediately accelerate the maturity date of the bonds. In this case, High Plains would have no choice but to file bankruptcy.<\/p><p>High Plains follows U.S. GAAP. For the year ended 2008, High Plains received an unqualified opinion from its independent auditor. However, the auditor&#x27;s opinion included an explanatory paragraph about High Plains&#x27; inability to continue as a going concern in the event its bonds remain in technical default.<\/p><p>At the end of 2008, High Plains&#x27; Chief Executive Officer (CEO) and Chief Financial Officer (CFO) filed the necessary certifications required by the Securities and Exchange Commission (SEC).<\/p><p>To get a better understanding of High Plains&#x27; financial situation, it is helpful to review High Plains&#x27; cash flow statement found in Exhibit 1 and selected financial footnotes found in Exhibit 2.<\/p><p>Exhibit 1: Cash Flow Statement<\/p><div class=\"tbl\"><table><tr><td colspan=3>High Plains Tubular Cash Flow Statement<\/td><\/tr><tr><td><\/td><td colspan=2>Year ended December 31,<\/td><\/tr><tr><td>in thousands<\/td><td>2008<\/td><td>2007<\/td><\/tr><tr><td>Net income<\/td><td>$158,177<\/td><td>$121,164<\/td><\/tr><tr><td>Depreciation expense<\/td><td>34,078<\/td><td>31,295<\/td><\/tr><tr><td>Deferred taxes<\/td><td>7,697<\/td><td>11,407<\/td><\/tr><tr><td>Receivables<\/td><td>(144,087)<\/td><td>(24,852)<\/td><\/tr><\/table><\/div><div class=\"tbl\"><table><tr><td>Inventory<\/td><td>(79,710)<\/td><td>(72,777)<\/td><\/tr><tr><td>Payables<\/td><td>36,107<\/td><td>22,455<\/td><\/tr><tr><td>Cash flow from operations<\/td><td>$12,262<\/td><td>$88,692<\/td><\/tr><tr><td>Cash flow from investing<\/td><td>($39,884)<\/td><td>($63,953)<\/td><\/tr><tr><td>Cash flow from financing<\/td><td>$82,676<\/td><td>$6,056<\/td><\/tr><tr><td>Change in cash<\/td><td>$55,054<\/td><td>$30,795<\/td><\/tr><\/table><\/div><p>Exhibit 2: Selected Financial Footnotes<\/p><p>1. During 2008, High Plains&#x27; sales increased 27% over 2007. Its sales growth continues to significantly exceed the industry average. Sales are recognized when a firm order is received from the customer, the sales price is fixed and determinable, and collectability is reasonably assured. 2. The cost of inventories is determined using the last-in, first-out (LIFO) method. Had the first-in, first-out method been used, inventories would have been $152 million and $143 million higher as of December 31, 2008 and 2007, respectively. 3. Effective January 1, 2008, High Plains changed its depreciation method from the double-declining balance method to the straight-line method in order to be more comparable with the accounting practices of other firms within its industry. The change was not retroactively applied and only affects assets that were acquired on or after January 1, 2008.<\/p><p>4. High Plains made the following discretionary expenditures for maintenance and repair of plant and equipment and for advertising and marketing:<\/p><div class=\"tbl\"><table><tr><td>in millions<\/td><td>2008<\/td><td>2007<\/td><td>2006<\/td><\/tr><tr><td>Maintenance and repairs<\/td><td>$180<\/td><td>$184<\/td><td>$218<\/td><\/tr><tr><td>Advertising and marketing<\/td><td>94<\/td><td>108<\/td><td>150<\/td><\/tr><\/table><\/div><p>5. During the fiscal year ended December 31, 2008, High Plains sold $50 million of its accounts receivable, with recourse, to an unrelated entity. All of the receivables were still outstanding at year end. 6. High Plains conducts some of its operations in facilities leased under noncancelable finance (capital) leases. Certain leases include renewal options with provisions for increased lease payments during the renewal term.<\/p><p>7. High Plains&#x27; average net operating assets at the end of 2008 and 2007 was $977.89 million and $642.83 million, respectively.<\/p><p>Which of the following statements about evaluating High Plains&#x27; financial reporting quality is least accurate?<\/p><\/div>", "subj": "fsa"}, {"n": 36, "q": "Mean reversion in earnings means that:", "opts": ["Extreme high as well as low levels of earnings will revert to the mean.", "Extreme low earnings will revert to the mean but extreme high earnings will not.", "Extreme high earnings will revert to the mean but extreme low earnings will not."], "ans": "A", "expl": "Mean reversion in earnings means that extreme high or low earnings are not sustainable and will mean revert.", "explhtml": "<p>Mean reversion in earnings means that extreme high or low earnings are not sustainable and will mean revert.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.3, LOS 11.g<\/div><div class=\"qtext\"><p>Mean reversion in earnings means that:<\/p><\/div>", "subj": "fsa"}, {"n": 37, "q": "Aggressive revenue recognition practices are least likely to increase:", "opts": ["reported ending inventory", "reported expenses", "reported assets"], "ans": "A", "expl": "Aggressive revenue recognition practices would increase accounts receivable, revenues, expenses, income and stockholder's equity. Ending inventory would decline but by less than the increase in accounts receivable resulting in increase in total assets. Early recognition of revenues also accelerates recognition of expenses (COGS).", "explhtml": "<p>Aggressive revenue recognition practices would increase accounts receivable, revenues, expenses, income and stockholder&#x27;s equity. Ending inventory would decline but by less than the increase in accounts receivable resulting in increase in total assets. Early recognition of revenues also accelerates recognition of expenses (COGS).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.1, LOS 11.b<\/div><div class=\"qtext\"><p>Aggressive revenue recognition practices are least likely to increase:<\/p><\/div>", "subj": "fsa"}, {"n": 38, "q": "William Jones, CFA, is analyzing the financial performance of two U.S. competitors in connection with a potential investment recommendation of their common stocks. He is particularly concerned about the quality of each company's financial results in 2007–2008 and in developing projections for 2009 and 2010 fiscal years. Adams Company has been the largest company in the industry, but Jefferson Inc. has grown more rapidly in recent years. Adams's net sales in 2004 were 33-1/3% higher than Jefferson's but were only 18% above Jefferson's in 2008. During 2008, a slowing U.S. economy led to lower domestic revenue growth for both companies. The 10-k reports showed overall sales growth of 6% for Adams in 2008 compared to 7% for 2007 and 9% in 2006. Jefferson's gross sales rose almost 12% in 2008 versus 8% in 2007 and 10% in 2006. In the past three years, Jefferson has expanded its foreign business at a faster pace than Adams. In 2008, Jefferson's growth in overseas business was particularly impressive. According to the company's 10-k report, Jefferson offered a sales incentive to overseas customers. For those customers accepting the special sales discount, Jefferson shipped products to specific warehouses in foreign ports rather than directly to those customers' facilities. In his initial review of Adams's and Jefferson's financial statements, Jones was concerned about the quality of the growth in Jefferson's sales, considerably higher accounts receivables, and the impact of overall accruals on earnings quality. He noted that Jefferson had instituted an accounting change in 2008. The economic life for new plant and equipment investments was determined to be five years longer than for previous investments. For Adams, he noted that the higher level of inventories at the end of 2008 might be cause for concern in light of a further slowdown expected in the U.S. economy in 2009. The accompanying table shows financial data for both companies' Form 10-k reports for 2006– 2008 used by Jones for his analysis. To evaluate sales quality, he focused on trends in sales and related expenses for both companies as well as cash collections and receivables comparisons. Inventory trends relative to sales and the number of days' sales outstanding in inventory were determined for both companies. Expense trends were examined for Adams and Jefferson relative to sales growth and accrual ratios on a balance sheet and cash flow basis were developed as overall measures of earnings quality.  Adams Company    Jefferson Inc.   ($ in thousands) 2006 2007 2008  2006 2007 2008         Gross sales 32,031 34,273 36,330  25,625 27,675 30,900 Sales discounts, returns,\nand allowances 781 836 886  625 675 900 Net sales 31,250 33,438 35,444  25,000 27,000 30,000 Cost of goods sold 15,312 16,384 17,367  12,250 13,250 15,500 SG&A expenses 9,028 9,660 10,240  7,222 7,800 8,200 Depreciation expense 625 669 709  500 515 516 Interest expense 400 428 454  360 366 396 Income before taxes 5,835 6,243 6,618  4,668 5,069 5,388 Taxes (tax rate 40%) 2,334 2,497 2,647  2,000 2,028 2,155 Net income 3,501 3,746 3,971  2,668 3,041 3,233         Dividends 3,000 3,180 3,307  2,460 2,760 2,880 Net addition to retained\nearnings 501 566 664  208 281 353         Balance Sheet        Cash and equivalents 150 160 170  120 130 120 Short-term marketable\nsecurities 250 325 345  200 217 195 Accounts receivable (net) 15,875 16,758 17,763  12,700 13,000 15,892 Inventories 6,500 6,850 7,800  5,200 5,200 4,500 PP&E (net of depreciation) 8,562 8,991 9,440  6,850 7,057 7,200 Total assets 31,337 33,084 35,518  25,070 25,604 27,907         Accounts payable 7,062 7,880 9,300  6,050 6,100 6,398 Other current liabilities 337 400 450  270 373 1,525 Long-term debt 7,500 7,800 8,100  6,000 6,100 6,600 Common stock 15,000 15,000 15,000  12,000 12,000 12,000 Retained earnings 1,438 2,004 2,668  750 1,031 1,384 Total liabilities and\nshareholders equity 31,337 33,084 35,518  25,070 25,604 27,907         % change gross sales  7.0% 6.0%   8.0% 11.7% % change sales discounts\nand allowances  6.0% 6.0%   8.0% 33.3% % change net sales  7.0% 6.0%   8.0% 11.1% % change cost of goods\nsold  7.0% 6.0%   8.0% 17.0% % change in SG&A  6.0% 6.0%   8.0% 5.1% % change in depreciation\nexpense  6.0% 6.0%   3.0% 0.2% % change in accounts\nreceivable  6.0% 6.0%   2.0% 22.3% % change in inventories  5.0% 13.8%   0.0% (13.5%)         Revenues % cash\ncollections 1.03 1.03 1.03  1.0 1.0 1.1 Days inventory\noutstanding 155 153 164  144 143 106 Balance sheet accrual ratio 3.4% 3.5% 3.9%  2.0% 2.4% 10.1% Cash flow accrual ratio 3.4% 3.5% 3.8%  2.0% 2.0% 4.3% Comparisons of expense trends in 2007–2008 showed:", "opts": ["Jefferson’s management appeared to have managed SG&A and depreciation expenses more effectively than Adams’s; there was a small increase in Jefferson’s depreciation expense and slower growth in SG&A relative to the company’s previous year and compared to Adams’s trends.", "higher growth of Adams’s SG&A and depreciation expense versus Jefferson’s; the small change in Jefferson’s depreciation may relate to the change in depreciation lives, while the slower SG&A growth may reflect expense controls imposed to offset lower gross profit margins.", "higher growth of Adams’s SG&A and depreciation expense versus Jefferson’s may indicate more effective expense control by Jefferson in a slowing domestic economy."], "ans": "B", "expl": "The more favorable trends in Jefferson's expenses may reflect more aggressive depreciation accounting and controls imposed on discretionary expenses to offset declining gross profit margins.", "explhtml": "<p>The more favorable trends in Jefferson&#x27;s expenses may reflect more aggressive depreciation accounting and controls imposed on discretionary expenses to offset declining gross profit margins.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.1, LOS 11.b<\/div><div class=\"qtext\"><p>William Jones, CFA, is analyzing the financial performance of two U.S. competitors in connection with a potential investment recommendation of their common stocks. He is particularly concerned about the quality of each company&#x27;s financial results in 2007–2008 and in developing projections for 2009 and 2010 fiscal years.<\/p><p>Adams Company has been the largest company in the industry, but Jefferson Inc. has grown more rapidly in recent years. Adams&#x27;s net sales in 2004 were 33-1/3% higher than Jefferson&#x27;s but were only 18% above Jefferson&#x27;s in 2008. During 2008, a slowing U.S. economy led to lower domestic revenue growth for both companies. The 10-k reports showed overall sales growth of 6% for Adams in 2008 compared to 7% for 2007 and 9% in 2006. Jefferson&#x27;s gross sales rose almost 12% in 2008 versus 8% in 2007 and 10% in 2006. In the past three years, Jefferson has expanded its foreign business at a faster pace than Adams. In 2008, Jefferson&#x27;s growth in overseas business was particularly impressive. According to the company&#x27;s 10-k report, Jefferson offered a sales incentive to overseas customers. For those customers accepting the special sales discount, Jefferson shipped products to specific warehouses in foreign ports rather than directly to those customers&#x27; facilities.<\/p><p>In his initial review of Adams&#x27;s and Jefferson&#x27;s financial statements, Jones was concerned about the quality of the growth in Jefferson&#x27;s sales, considerably higher accounts receivables, and the impact of overall accruals on earnings quality. He noted that Jefferson had instituted an accounting change in 2008. The economic life for new plant and equipment investments was determined to be five years longer than for previous investments. For Adams, he noted that the higher level of inventories at the end of 2008 might be cause for concern in light of a further slowdown expected in the U.S. economy in 2009.<\/p><p>The accompanying table shows financial data for both companies&#x27; Form 10-k reports for 2006– 2008 used by Jones for his analysis. To evaluate sales quality, he focused on trends in sales and related expenses for both companies as well as cash collections and receivables comparisons. Inventory trends relative to sales and the number of days&#x27; sales outstanding in inventory were determined for both companies. Expense trends were examined for Adams and Jefferson relative to sales growth and accrual ratios on a balance sheet and cash flow basis were developed as overall measures of earnings quality.<\/p><div class=\"tbl\"><table><tr><td><\/td><td colspan=3>Adams Company<\/td><td><\/td><td colspan=3>Jefferson Inc.<\/td><\/tr><tr><td>($ in thousands)<\/td><td>2006<\/td><td>2007<\/td><td>2008<\/td><td><\/td><td>2006<\/td><td>2007<\/td><td>2008<\/td><\/tr><tr><td>Gross sales<\/td><td>32,031<\/td><td>34,273<\/td><td>36,330<\/td><td><\/td><td>25,625<\/td><td>27,675<\/td><td>30,900<\/td><\/tr><\/table><\/div><div class=\"tbl\"><table><tr><td>Sales discounts, returns,<br>and allowances<\/td><td>781<\/td><td>836<\/td><td>886<\/td><td><\/td><td>625<\/td><td>675<\/td><td>900<\/td><\/tr><tr><td>Net sales<\/td><td>31,250<\/td><td>33,438<\/td><td>35,444<\/td><td><\/td><td>25,000<\/td><td>27,000<\/td><td>30,000<\/td><\/tr><tr><td>Cost of goods sold<\/td><td>15,312<\/td><td>16,384<\/td><td>17,367<\/td><td><\/td><td>12,250<\/td><td>13,250<\/td><td>15,500<\/td><\/tr><tr><td>SG&am d><\/td><td>1.0<\/td><td>1.0<\/td><td>1.1<\/td><\/tr><tr><td>Days inventory<br>outstanding<\/td><td>155<\/td><td>153<\/td><td>164<\/td><td><\/td><td>144<\/td><td>143<\/td><td>106<\/td><\/tr><tr><td>Balance sheet accrual ratio<\/td><td>3.4%<\/td><td>3.5%<\/td><td>3.9%<\/td><td><\/td><td>2.0%<\/td><td>2.4%<\/td><td>10.1%<\/td><\/tr><tr><td>Cash flow accrual ratio<\/td><td>3.4%<\/td><td>3.5%<\/td><td>3.8%<\/td><td><\/td><td>2.0%<\/td><td>2.0%<\/td><td>4.3%<\/td><\/tr><\/table><\/div><p>Comparisons of expense trends in 2007–2008 showed:<\/p><\/div>", "subj": "fsa"}, {"n": 39, "q": "The failure to recognize inventory obsolescence is an example of ___________.", "opts": ["Understating expenses.", "Misclassifying expenses.", "Delaying expenses."], "ans": "A", "expl": "Inventory must be tested for obsolescence using the lower-of-cost-or-market method. Obsolete inventory must be written down (expensed) in the income statement which results in lower earnings. Thus, failure to recognize obsolescence understates expenses and overstates earnings. Delaying expenses involves deferring recognition to a future period. Delaying expense is the result of capitalizing a cost instead of immediately recognizing the cost in the income statement. This is not the same as failing to recognize inventory obsolescence. Investors typically focus more on operating income than nonrecurring and non-operating income. Thus, firms may have an incentive to increase operating income by misclassifying an operating expense as a nonrecurring or non-operating item. Therefore, failure to recognize obsolescence is not an example of misclassification.", "explhtml": "<p>Inventory must be tested for obsolescence using the lower-of-cost-or-market method. Obsolete inventory must be written down (expensed) in the income statement which results in lower earnings. Thus, failure to recognize obsolescence understates expenses and overstates earnings.<\/p><p>Delaying expenses involves deferring recognition to a future period. Delaying expense is the result of capitalizing a cost instead of immediately recognizing the cost in the income statement. This is not the same as failing to recognize inventory obsolescence.<\/p><p>Investors typically focus more on operating income than nonrecurring and non-operating income. Thus, firms may have an incentive to increase operating income by misclassifying an operating expense as a nonrecurring or non-operating item. Therefore, failure to recognize obsolescence is not an example of misclassification.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.1, LOS 11.b<\/div><div class=\"qtext\"><p>The failure to recognize inventory obsolescence is an example of ___________.<\/p><\/div>", "subj": "fsa"}, {"n": 40, "q": "Which of the following is least likely an indicator of biased measurement in assessing balance sheet quality?", "opts": ["Understatement of valuation allowance for deferred tax assets.", "Presence of substantial goodwill on balance sheet.", "Understatement of inventory impairment charges."], "ans": "B", "expl": "Presence of substantial goodwill does not inherently make it biased measurement. Only if the value of goodwill is unjustified (based on market values of the investments), would the measurement be considered biased. Understatement of inventory impairment charges overstates value of inventory. Similarly understatement of valuation allowance for deferred tax assets overstates the value of deferred tax assets.", "explhtml": "<p>Presence of substantial goodwill does not inherently make it biased measurement. Only if the value of goodwill is unjustified (based on market values of the investments), would the measurement be considered biased. Understatement of inventory impairment charges overstates value of inventory. Similarly understatement of valuation allowance for deferred tax assets overstates the value of deferred tax assets.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.5, LOS 11.j<\/div><div class=\"qtext\"><p>Which of t  with a potential investment recommendation of their common stocks. He is particularly concerned about the quality of each company&#x27;s financial results in 2007–2008 and in developing projections for 2009 and 2010 fiscal years.<\/p><p>Adams Company has been the largest company in the industry, but Jefferson Inc. has grown more rapidly in recent years. Adams&#x27;s net sales in 2004 were 33-1/3% higher than Jefferson&#x27;s but were only 18% above Jefferson&#x27;s in 2008. During 2008, a slowing U.S. economy led to lower domestic revenue growth for both companies. The 10-k reports showed overall sales growth of 6% for Adams in 2008 compared to 7% for 2007 and 9% in 2006. Jefferson&#x27;s gross sales rose almost 12% in 2008 versus 8% in 2007 and 10% in 2006. In the past three years, Jefferson has expanded its foreign business at a faster pace than Adams. In 2008, Jefferson&#x27;s growth in overseas business was particularly impressive. According to the company&#x27;s 10-k report, Jefferson offered a sales incentive to overseas customers. For those customers accepting the special sales discount, Jefferson shipped products to specific warehouses in foreign ports rather than directly to those customers&#x27; facilities.<\/p><p>In his initial review of Adams&#x27;s and Jefferson&#x27;s financial statements, Jones was concerned about the quality of the growth in Jefferson&#x27;s sales, considerably higher accounts receivables, and the impact of overall accruals on earnings quality. He noted that Jefferson had instituted an accounting change in 2008. The economic life for new plant and equipment investments was determined to be five years longer than for previous investments. For Adams, he noted that the higher level of inventories at the end of 2008 might be cause for concern in light of a further slowdown expected in the U.S. economy in 2009.<\/p><p>The accompanying table shows financial data for both companies&#x27; Form 10-k reports for 2006– 2008 used by Jones for his analysis. To evaluate sales quality, he focused on trends in sales and related expenses for both companies as well as cash collections and receivables comparisons. Inventory trends relative to sales and the number of days&#x27; sales outstanding in inventory were determined for both companies. Expense trends were examined for Adams and Jefferson relative to sales growth and accrual ratios on a balance sheet and cash flow basis were developed as overall measures of earnings quality.<\/p><div class=\"tbl\"><table><tr><td><\/td><td colspan=3>Adams Company<\/td><td><\/td><td colspan=3>Jefferson Inc.<\/td><\/tr><tr><td>($ in thousands)<\/td><td>2006<\/td><td>2007<\/td><td>2008<\/td><td><\/td><td>2006<\/td><td>2007<\/td><td>2008<\/td><\/tr><tr><td>Gross sales<\/td><td>32,031<\/td><td>34,273<\/td><td>36,330<\/td><td><\/td><td>25,625<\/td><td>27,675<\/td><td>30,900<\/td><\/tr><\/table><\/div><div class=\"tbl\"><table><tr><td>Sales discounts, returns,<br>and allowances<\/td><td>781<\/td><td>836<\/td><td>886<\/td><td><\/td><td>625<\/td><td>675<\/td><td>900<\/td><\/tr><tr><td>Net sales<\/td><td>31,250<\/td><td>33,438<\/td><td>35,444<\/td><td><\/td><td>25,000<\/td><td>27,000<\/td><td>30,000<\/td><\/tr><tr><td>Cost of goods sold<\/td><td>15,312<\/td><td>16,384<\/td><td>17,367<\/td><td><\/td><td>12,250<\/td><td>13,250<\/td><td>15,500<\/td><\/tr><tr><td>SG&amp;A expenses<\/td><td>9,028<\/td><td>9,660<\/td><td>10,240<\/td><td><\/td><td>7,222<\/td><td>7,800<\/td><td>8,200<\/td><\/tr><tr><td>Depreciation expense<\/td><td>625<\/td><td>669<\/td><td>709<\/td><td><\/td><td>500<\/td><td>515<\/td><td>516<\/td><\/tr><tr><td>Interest expense<\/td><td>400<\/td><td>428<\/td><td>454<\/td><td><\/td><td>360<\/td><td>366<\/td><td>396<\/td><\/tr><tr><td>Income before taxes<\/td><td>5,835<\/td><td>6,243<\/td><td>6,618<\/td><td><\/td><td>4,668<\/td><td>5,069<\/td><td>5,388<\/td><\/tr><tr><td>Taxes (tax rate 40%)<\/td><td>2,334<\/td><td>2,497<\/td><td>2,647<\/td><td><\/td><td>2,000<\/td><td>2,028<\/td><td>2,155<\/td><\/tr><tr><td>Net income<\/td><td>3,501<\/td><td>3,746<\/td><td>3,971<\/td><td><\/td><td>2,668<\/td><td>3,041<\/td><td>3,233<\/td><\/tr><tr><td>Dividends<\/td><td>3,000<\/td><td>3,180<\/td><td>3,307<\/td><td><\/td><td>2,460<\/td><td>2,760<\/td><td>2,880<\/td><\/tr><tr><td>Net addition to retained<br>earnings<\/td><td>501<\/td><td>566<\/td><td>664<\/td><td><\/td><td>208<\/td><td>281<\/td><td>353<\/td><\/tr><tr><td colspan=8>Balance Sheet<\/td><\/tr><tr><td>Cash and equivalents<\/td><td>150<\/td><td>160<\/td><td>170<\/td><td><\/td><td>120<\/td><td>130<\/td><td>120<\/td><\/tr><tr><td>Short-term marketable<br>securities<\/td><td>250<\/td><td>325<\/td><td>345<\/td><td><\/td><td>200<\/td><td>217<\/td><td>195<\/td><\/tr><tr><td>Accounts receivable (net)<\/td><td>15,875<\/td><td>16,758<\/td><td>17,763<\/td><td><\/td><td>12,700<\/td><td>13,000<\/td><td>15,892<\/td><\/tr><tr><td>Inventories<\/td><td>6,500<\/td><td>6,850<\/td><td>7,800<\/td><td><\/td><td>5,200<\/td><td>5,200<\/td><td>4,500<\/td><\/tr><tr><td>PP&amp;E (net of depreciation)<\/td><td>8,562<\/td><td>8,991<\/td><td>9,440<\/td><td><\/td><td>6,850<\/td><td>7,057<\/td><td>7,200<\/td><\/tr><tr><td>Total assets<\/td><td>31,337<\/td><td>33,084<\/td><td>35,518<\/td><td><\/td><td>25,070<\/td><td>25,604<\/td><td>27,907<\/td><\/tr><tr><td>Accounts payable<\/td><td>7,062<\/td><td>7,880<\/td><td>9,300<\/td><td><\/td><td>6,050<\/td><td>6,100<\/td><td>6,398<\/td><\/tr><tr><td>Other current liabilities<\/td><td>337<\/td><td>400<\/td><td>450<\/td><td><\/td><td>270<\/td><td>373<\/td><td>1,525<\/td><\/tr><tr><td>Long-term debt<\/td><td>7,500<\/td><td>7,800<\/td><td>8,100<\/td><td><\/td><td>6,000<\/td><td>6,100<\/td><td>6,600<\/td><\/tr><tr><td>Common stock<\/td><td>15,000<\/td><td>15,000<\/td><td>15,000<\/td><td><\/td><td>12,000<\/td><td>12,000<\/td><td>12,000<\/td><\/tr><tr><td>Retained earnings<\/td><td>1,438<\/td><td>2,004<\/td><td>2,668<\/td><td><\/td><td>750<\/td><td>1,031<\/td><td>1,384<\/td><\/tr><\/table><\/div><div class=\"tbl\"><table><tr><td>Total liabilities and<br>shareholders equity<\/td><td>31,337<\/td><td>33,084<\/td><td>35,518<\/td><td><\/td><td>25,070<\/td><td>25,604<\/td><td>27,907<\/td><\/tr><tr><td>% change gross sales<\/td><td><\/td><td>7.0%<\/td><td>6.0%<\/td><td><\/td><td><\/td><td>8.0%<\/td><td>11.7%<\/td><\/tr><tr><td>% change sales discounts<br>and allowances<\/td><td><\/td><td>6.0%<\/td><td>6.0%<\/td><td><\/td><td><\/td><td>8.0%<\/td><td>33.3%<\/td><\/tr><tr><td>% change net sales<\/td><td><\/td><td>7.0%<\/td><td>6.0%<\/td><td><\/td><td><\/td><td>8.0%<\/td><td>11.1%<\/td><\/tr><tr><td>% change cost of goods<br>sold<\/td><td><\/td><td>7.0%<\/td><td>6.0%<\/td><td><\/td><td><\/td><td>8.0%<\/td><td>17.0%<\/td><\/tr><tr><td>% change in SG&amp;A<\/td><td><\/td><td>6.0%<\/td><td>6.0%<\/td><td><\/td><td><\/td><td>8.0%<\/td><td>5.1%<\/td><\/tr><tr><td>% change in depreciation<br>expense<\/td><td><\/td><td>6.0%<\/td><td>6.0%<\/td><td><\/td><td><\/td><td>3.0%<\/td><td>0.2%<\/td><\/tr><tr><td>% change in accounts<br>receivable<\/td><td><\/td><td>6.0%<\/td><td>6.0%<\/td><td><\/td><td><\/td><td>2.0%<\/td><td>22.3%<\/td><\/tr><tr><td>% change in inventories<\/td><td><\/td><td>5.0%<\/td><td>13.8%<\/td><td><\/td><td><\/td><td>0.0%<\/td><td>(13.5%)<\/td><\/tr><tr><td>Revenues % cash<br>collections<\/td><td>1.03<\/td><td>1.03<\/td><td>1.03<\/td><td><\/td><td>1.0<\/td><td>1.0<\/td><td>1.1<\/td><\/tr><tr><td>Days inventory<br>outstanding<\/td><td>155<\/td><td>153<\/td><td>164<\/td><td><\/td><td>144<\/td><td>143<\/td><td>106<\/td><\/tr><tr><td>Balance sheet accrual ratio<\/td><td>3.4%<\/td><td>3.5%<\/td><td>3.9%<\/td><td><\/td><td>2.0%<\/td><td>2.4%<\/td><td>10.1%<\/td><\/tr><tr><td>Cash flow accrual ratio<\/td><td>3.4%<\/td><td>3.5%<\/td><td>3.8%<\/td><td><\/td><td>2.0%<\/td><td>2.0%<\/td><td>4.3%<\/td><\/tr><\/table><\/div><p>The quality of earnings as measured by cash-flow-based accruals ratios showed:<\/p><\/div>", "subj": "fsa"}, {"n": 44, "q": "Which of the following choices is most likely a biased accounting choice to overstate profitability?", "opts": ["Classifying non-operating expenses as operating.", "Channeling gains through OCI and losses through income statement.", "Lessor use of sales-type finance lease classification."], "ans": "C", "expl": "Lessor use of sales-type finance lease classification results in Lessor recognizing the gross profit at inception of the lease and is a mechanism to overstate profitability. Classifying non-operating expenses as operating and channeling gains through OCI and losses through income statement would understate profitability.", "explhtml": "<p>Lessor use of sales-type finance lease classification results in Lessor recognizing the gross profit at inception of the lease and is a mechanism to overstate profitability. Classifying non-operating expenses as operating and channeling gains through OCI and losses through income statement would understate profitability.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.1, LOS 11.b<\/div><div class=\"qtext\"><p>Which of the following choices is most likely a biased accounting choice to overstate profitability?<\/p><\/div>", "subj": "fsa"}, {"n": 45, "q": "Complete the following sentence. When earnings are relatively free of accruals, mean reversion will occur __________.", "opts": ["at the same rate as usual.", "relatively faster than usual.", "relatively slower than usual."], "ans": "C", "expl": "Earnings consist of cash flow and accruals and there is an inverse relationship between accruals and cash flow. When earnings are relatively free of accruals, mean reversion will occur at a slower rate. The opposite is true when earnings are largely comprised of accruals.", "explhtml": "<p>Earnings consist of cash flow and accruals and there is an inverse relationship between accruals and cash flow. When earnings are relatively free of accruals, mean reversion will occur at a slower rate. The opposite is true when earnings are largely comprised of accruals.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.3, LOS 11.g<\/div><div class=\"qtext\"><p>Complete the following sentence. When earnings are relatively free of accruals, mean reversion will occur __________.<\/p><\/div>", "subj": "fsa"}, {"n": 46, "q": "Which of the following is least likely an indicator of high-quality cash flow?", "opts": ["OCF adequate to cover capital expenditures, dividends and debt repayments.", "OCF derived from sustainable sources.", "Total cash flow that is positive and high."], "ans": "C", "expl": "High-quality cash flow focuses on positive, adequate and sustainable operating cash flow. Firms with high borrowings could have high total cash flow but such cash flows would not be sustainable (nor considered high-quality).", "explhtml": "<p>High-quality cash flow focuses on positive, adequate and sustainable operating cash flow. Firms with high borrowings could have high total cash flow but such cash flows would not be sustainable (nor considered high-quality).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.4, LOS 11.l<\/div><div class=\"qtext\"><p>Which of the following is least likely an indicator of high-quality cash flow?<\/p><\/div>", "subj": "fsa"}, {"n": 47, "q": "Which of the following statements about operating income and operating cash flow are correct or incorrect? Statement #1: If operating income is growing faster than operating cash flow over the long-\nterm, the firm may be recognizing revenue too soon or delaying the\nrecognition of expense. Statement #2: Operating cash flow exceeding operating income is sustainable over the\nlong-term.", "opts": ["Both are incorrect.", "Only one is correct.", "Both are correct."], "ans": "B", "expl": "Statement #1 is correct. If operating income and operating cash flow are growing at different rates over the long-term, the firm may be engaging in earnings manipulation. Statement #2 is incorrect. Over the long-term, operating cash flow will eventually decline without the support of operating income.", "explhtml": "<p>Statement #1 is correct. If operating income and operating cash flow are growing at different rates over the long-term, the firm may be engaging in earnings manipulation. Statement #2 is incorrect. Over the long-term, operating cash flow will eventually decline without the support of operating income.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.1, LOS 11.b<\/div><div class=\"qtext\"><p>Which of the following statements about operating income and operating cash flow are correct or incorrect?<\/p><div class=\"tbl\"><table><tr><td>Statement #1:<\/td><td>If operating income is growing faster than operating cash flow over the long-<br>term, the firm may be recognizing revenue too soon or delaying the<br>recognition of expense.<\/td><\/tr><tr><td>Statement #2:<\/td><td>Operating cash flow exceeding operating income is sustainable over the<br>long-term.<\/td><\/tr><\/table><\/div><\/div>", "subj": "fsa"}, {"n": 48, "q": "Alex Fisher, CFA, is examining the phenomenon of mean reversion on the earnings of several firms. Which of the following statements regarding mean reversion is least accurate?", "opts": ["Low earnings should not be expected to continue indefinitely.", "Normal earnings should not be expected to continue indefinitely.", "High earnings should not be expected to continue indefinitely."], "ans": "B", "expl": "When examining net income, analysts should be aware that earnings at extreme levels tend to revert back to normal levels over time. This phenomenon is known as mean reversion. As a result of mean reversion, analysts must understand that extreme earnings (high or low) should not be expected to continue indefinitely.", "explhtml": "<p>When examining net income, analysts should be aware that earnings at extreme levels tend to revert back to normal levels over time. This phenomenon is known as mean reversion. As a result of mean reversion, analysts must understand that extreme earnings (high or low) should not be expected to continue indefinitely.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.3, LOS 11.g<\/div><div class=\"qtext\"><p>Alex Fisher, CFA, is examining the phenomenon of mean reversion on the earnings of several firms. Which of the following statements regarding mean reversion is least accurate?<\/p><\/div>", "subj": "fsa"}, {"n": 49, "q": "Classification shifting is least likely to result in a higher:", "opts": ["reported net income.", "equity value derived when earnings forecasts are based on operating earnings.", "firm value derived when cash flow forecasts are based on core earnings."], "ans": "A", "expl": "Classification shifting results in inflation of core or recurring earnings while keeping the total reported income same. This is used to mislead analysts into using a higher number as a basis for generating forecasts of future earnings and cash flows. Such erroneous forecasts would then result in inflated equity and firm valuation.", "explhtml": "<p>Classification shifting results in inflation of core or recurring earnings while keeping the total reported income same. This is used to mislead analysts into using a higher number as a basis for generating forecasts of future earnings and cash flows. Such erroneous forecasts would then result in inflated equity and firm valuation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.2, LOS 11.e<\/div><div class=\"qtext\"><p>Classification shifting is least likely to result in a higher:<\/p><\/div>", "subj": "fsa"}, {"n": 50, "q": "Junior analyst Xander Marshall sends an e-mail to his boss, Janet Jacobs, CFA, suggesting that Peterson Novelties is manipulating its results to artificially inflate profits. He cites four reasons for his conclusion: The LIFO reserve is declining.  Earnings are much higher in the September quarter than in other quarters. Many nonoperating and nonrecurring gains are being recorded as revenue. Much of Peterson's earnings come from equity investments not reflected on the cash-flow statement. Jacobs is less concerned about Peterson's earnings than Marshall is, though she does resolve to check out one of his concerns. Which of Marshall's observations best supports his conclusion?", "opts": ["Nonoperating and nonrecurring gains recorded as revenue.", "The declining LIFO reserve.", "Equity investment earnings not reflected on the cash-flow statement."], "ans": "C", "expl": "On its own, a declining LIFO reserve is not a sign of fraud. Peterson Novelties could have simply moved a lot of inventory and disclosed the LIFO liquidation in its footnotes. When unusual gains are recorded as revenue they will artificially boost sales growth. Each of the above issues are potential danger signs, but can also be easily explained in a manner beyond reproach. However, earnings from equity investments that do not generate cash flow are of very low quality and warrant further examination.", "explhtml": "<p>On its own, a declining LIFO reserve is not a sign of fraud. Peterson Novelties could have simply moved a lot of inventory and disclosed the LIFO liquidation in its footnotes. When unusual gains are recorded as revenue they will artificially boost sales growth. Each of the above issues are potential danger signs, but can also be easily explained in a manner beyond reproach. However, earnings from equity investments that do not generate cash flow are of very low quality and warrant further examination.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.1, LOS 11.b<\/div><div class=\"qtext\"><p>Junior analyst Xander Marshall sends an e-mail to his boss, Janet Jacobs, CFA, suggesting that Peterson Novelties is manipulating its results to artificially inflate profits. He cites four reasons for his conclusion:<\/p><p>The LIFO reserve is declining.  Earnings are much higher in the September quarter than in other quarters. Many nonoperating and nonrecurring gains are being recorded as revenue. Much of Peterson&#x27;s earnings come from equity investments not reflected on the cash-flow statement.<\/p><p>Jacobs is less concerned about Peterson&#x27;s earnings than Marshall is, though she does resolve to check out one of his concerns. Which of Marshall&#x27;s observations best supports his conclusion?<\/p><\/div>", "subj": "fsa"}, {"n": 51, "q": "Consider the following statements: Compared to the cash basis of accounting, the accrual basis of accounting Statement 1: provides more timely information about future cash flows. Compared to the cash basis of accounting, the accrual basis requires more Statement 2: use of discretion than the cash basis. Are these statements CORRECT?", "opts": ["No, because it is actually the cash basis of accounting that results in more difficulty in properly assigning revenues and expenses to the appropriate periods.", "No, because it is actually the cash basis of accounting that provides more timely and relevant information to users about future cash flows.", "Yes."], "ans": "C", "expl": "Users of financial information seek timely information about future cash flows. The accrual basis of accounting provides this information at the earliest appearance of objective evidence. Thus, accrual accounting provides more timely and relevant information to users. The cash basis is more concerned with recording cash flows for transactions that have already occurred. Accrual accounting (not cash-based accounting) necessitates the use of discretion because of the many estimates and judgments involved with assigning revenue and expense to the appropriate periods.", "explhtml": "<p>Users of financial information seek timely information about future cash flows. The accrual basis of accounting provides this information at the earliest appearance of objective evidence. Thus, accrual accounting provides more timely and relevant information to users. The cash basis is more concerned with recording cash flows for transactions that have already occurred.<\/p><p>Accrual accounting (not cash-based accounting) necessitates the use of discretion because of the many estimates and judgments involved with assigning revenue and expense to the appropriate periods.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.2, LOS 11.f<\/div><div class=\"qtext\"><p>Consider the following statements:<\/p><p>Compared to the cash basis of accounting, the accrual basis of accounting<\/p><p>Statement 1:<\/p><p>provides more timely information about future cash flows.<\/p><p>Compared to the cash basis of accounting, the accrual basis requires more<\/p><p>Statement 2:<\/p><p>use of discretion than the cash basis.<\/p><p>Are these statements CORRECT?<\/p><\/div>", "subj": "fsa"}, {"n": 52, "q": "Analyst Jane Kilgore is worried that some of Maxwell Research's accrual accounting practices will lead to excessive operating earnings recognition in the near-term. Examples of Kilgore's concerns include the following: Accelerated revenue recognition of service agreements. Classification of recurring revenue as nonrecurring revenue. Understated inventory obsolescence. Which of Kilgore's concerns is least likely to overstate current operating earnings?", "opts": ["Understated inventory obsolescence.", "Classification of recurring revenue as nonrecurring revenue.", "Accelerated revenue recognition of service agreements."], "ans": "B", "expl": "Classification of recurring revenue as nonrecurring revenue will understate current operating earnings. The other two items act to overstate revenue and understate expenses.", "explhtml": "<p>Classification of recurring revenue as nonrecurring revenue will understate current operating earnings. The other two items act to overstate revenue and understate expenses.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.1, LOS 11.b<\/div><div class=\"qtext\"><p>Analyst Jane Kilgore is worried that some of Maxwell Research&#x27;s accrual accounting practices will lead to excessive operating earnings recognition in the near-term. Examples of Kilgore&#x27;s concerns include the following:<\/p><p>Accelerated revenue recognition of service agreements. Classification of recurring revenue as nonrecurring revenue. Understated inventory obsolescence.<\/p><p>Which of Kilgore&#x27;s concerns is least likely to overstate current operating earnings?<\/p><\/div>", "subj": "fsa"}, {"n": 53, "q": "Hartford Manufacturing Case Scenario Sally Wellington, CFA, analyzes the financial statements of Hartford Manufacturing, a company located in the United States that uses U.S. GAAP. Wellington determines that Hartford's most significant assets are its inventory and long-term assets. Wellington is interested in the financial statement and ratio impact of the accounting methods used by Hartford to account for these assets, especially when compared to the methods used by Hartford's competitors. She gathers the following information to aid in her analysis: Exhibit 1  Selected Financial Information (US$ millions)  Year Ended December 31, 20X1  Select Balance Sheet Information  Inventory 16,253 Property, plant and equipment, gross 34,221 Accumulated depreciation (12,835) Property, plant and equipment, net 21,836 Total assets 60,038 Total liabilities 40,736 Total equity 19,302   Income Statement Information  Revenues 32,396 Cost of goods sold 18,885 Lease expense 590 Other expense 5,911 Depreciation expense 2,336 EBIT 4,674 Interest expense 1,522 Income tax expense (30%) 946 Net income 2,206 Based on her knowledge of Hartford's competitors and her review of Hartford's financial statement disclosures and Management's Discussion and Analysis (MD&A), Wellington notes the following: Hartford accounts for its inventory using the LIFO method. All of Hartford's competitors use the FIFO method. As a result of technological advancements, the cost to produce Hartford's inventory has fallen each year for the last five years. Hartford's LIFO reserve was (–)$2,603 in 20X0 and (–)$3,183 in 20X1. Hartford recorded a $520 fixed-asset impairment loss on its December 31, 20X0 income statement. Wellington concluded that this impairment loss increased Hartford's fixed-asset turnover ratio in 20X0, and Hartford's return on assets and net profit margin in 20X1. In 20X1 Hartford changed its depreciation method from the straight-line method to the double-declining balance method and increased the useful lives and salvage values of its fixed assets. The majority of Hartford's lease agreements are accounted for as operating leases. Hartford's largest competitors account for the majority of their leases as capital (finance) leases. Wellington knows that the Financial Accounting Standards Board (FASB) and International Accounting Standards Board (IASB) have proposed a change in lease accounting that would require the capitalization of all leases, including leases currently classified as operating leases. Using a discount rate of 8% and an average remaining lease term of five years, Wellington determines that the present value of Hartford's operating leases was $2,630 on December 31, 20X1. Which of the following characteristics of Hartford's long-term asset accounting is least likely to be considered a quality of financial reporting problem by Wellington?", "opts": ["The change from straight-line to double-declining balance depreciation.", "The increase in the useful lives and salvage values of Hartford's fixed assets.", "The classification of the majority of Hartford's leases as operating leases."], "ans": "A", "expl": "Double-declining balance (DDB) depreciation is a more conservative method of depreciation than straight-line because more depreciation expense is reported in the early years under DDB. Therefore, Wellington is not likely to consider Hartford's change from straight-line to double-declining balance depreciation to be a quality of financial reporting problem. Operating leases are a form of off-balance sheet financing that result in an understatement of an entity's liabilities. Wellington will likely consider Hartford's extensive use of operating leases to be a quality of financial reporting problem, especially given that Hartford's largest competitors account for the majority of their leases as capital (finance) leases. The increase in the useful lives and salvage values of Hartford's fixed assets is likely to be considered a quality of financial reporting problem by Wellington because longer useful lives and higher salvage values decrease (understate) depreciation expense. An effort to reduce expense could be a sign that the firm is trying to hide other problems, such as deteriorating core profitability.", "explhtml": "<p>Double-declining balance (DDB) depreciation is a more conservative method of depreciation than straight-line because more depreciation expense is reported in the early years under DDB. Therefore, Wellington is not likely to consider Hartford&#x27;s change from straight-line to double-declining balance depreciation to be a quality of financial reporting problem.<\/p><p>Operating leases are a form of off-balance sheet financing that result in an understatement of an entity&#x27;s liabilities. Wellington will likely consider Hartford&#x27;s extensive use of operating leases to be a quality of financial reporting problem, especially given that Hartford&#x27;s largest competitors account for the majority of their leases as capital (finance) leases.<\/p><p>The increase in the useful lives and salvage values of Hartford&#x27;s fixed assets is likely to be considered a quality of financial reporting problem by Wellington because longer useful lives and higher salvage values decrease (understate) depreciation expense. An effort to reduce expense could be a sign that the firm is trying to hide other problems, such as deteriorating core profitability.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.2, LOS 11.e<\/div><div class=\"qtext\"><p>Hartford Manufacturing Case Scenario<\/p><p>Sally Wellington, CFA, analyzes the financial statements of Hartford Manufacturing, a company located in the United States that us const CFG = {"title": "Reading 11 — Evaluating Quality of Financial Reports", "subtitle": "CFA Level II · 55 câu · Kaplan Schweser QBank 2025", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
