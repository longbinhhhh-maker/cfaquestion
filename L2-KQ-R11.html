<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 11 — Evaluating Quality of Financial Reports · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>

<style id="ui-polish">

    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;

  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";

<\/td><td>3.5%<\/td><td>3.9%<\/td><td><\/td><td>2.0%<\/td><td>2.4%<\/td><td>10.1%<\/td><\/tr><tr><td>Cash flow accrual ratio<\/td><td>3.4%<\/td><td>3.5%<\/td><td>3.8%<\/td><td><\/td><td>2.0%<\/td><td>2.0%<\/td><td>4.3%<\/td><\/tr><\/table><\/div><p>Jones also observed that inventory and cost of goods sold comparisons showed:<\/p><\/div>", "subj": "fsa"}, {"n": 2, "q": "Pritesh Deshmukh, CFA is analyzing the financial statements of Baza Restaurants Inc. Deshmukh wants to use the Beneish model to evaluate the probability of earnings manipulation. Deshmukh makes the following statements: 1. Depreciation index of less than 1 would indicate that the company is depreciating assets at a lower rate than in prior years. 2. Sales growth index of more than 1 indicates revenue inflation. Which of the statements by Deshmukh are most accurate?", "opts": ["Statement 2 only.", "None of the statements is accurate.", "Statement 1 only."], "ans": "B", "expl": "Statement 1 is incorrect. Depreciation index of less than 1 indicates that the company is depreciating assets at a higher rate than in prior years. Statement 2 is incorrect. Sales growth index of more than 1 simply implies that the growth in sales is positive. While not a measure of manipulation by itself, growth companies tend to find themselves under pressure to manipulate earnings to meet ongoing expectations.", "explhtml": "<p>Statement 1 is incorrect. Depreciation index of less than 1 indicates that the company is depreciating assets at a higher rate than in prior years. Statement 2 is incorrect. Sales growth index of more than 1 simply implies that the growth in sales is positive. While not a measure of manipulation by itself, growth companies tend to find themselves under pressure to manipulate earnings to meet ongoing expectations.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.2, LOS 11.d<\/div><div class=\"qtext\"><p>Pritesh Deshmukh, CFA is analyzing the financial statements of Baza Restaurants Inc. Deshmukh wants to use the Beneish model to evaluate the probability of earnings manipulation.<\/p><p>Deshmukh makes the following statements:<\/p><p>1. Depreciation index of less than 1 would indicate that the company is depreciating assets at a lower rate than in prior years. 2. Sales growth index of more than 1 indicates revenue inflation.<\/p><p>Which of the statements by Deshmukh are most accurate?<\/p><\/div>", "subj": "fsa"}, {"n": 3, "q": "Which of the following statements about operating income and operating cash flow is most accurate?", "opts": ["Operating income is more reliable than operating cash flow because of the judgments and estimates involved with accrual accounting.", "Operating income is confirmed by operating cash flow when the growth rates of the two measures are relatively stable over time.", "Operating cash flow usually increases faster than operating income when the firm is growing."], "ans": "B", "expl": "When the growth rates of operating income and operating cash flow are stable over time, operating income is being confirmed by operating cash flow. Operating cash flow is more reliable than operating income. During growth, operating cash flow is usually lower than operating income as the firm uses cash to increase inventories and receivables.", "explhtml": "<p>When the growth rates of operating income and operating cash flow are stable over time, operating income is being confirmed by operating cash flow. Operating cash flow is more reliable than operating income. During growth, operating cash flow is usually lower than operating income as the firm uses cash to increase inventories and receivables.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.1, LOS 11.b<\/div><div class=\"qtext\"><p>Which of the following statements about operating income and operating cash flow is most accurate?<\/p><\/div>", "subj": "fsa"}, {"n": 4, "q": "Fero Inc. (Fero) is a successful computer consulting services firm that has an established policy of investing its excess cash in short-term, virtually riskless, and highly liquid money market securities. However, it has recently deviated from this policy by investing in commercial paper and medium-cap domestic equities. As well, Fero entered into a $1.0 million lease with Pasquale Inc. (Pasquale) for some specialized computer equipment on December 28, 2008 that will be shipped at the very start of its next fiscal period on January 1, 2009. In exchange for the lease, Fero agrees to provide consulting services to Pasquale. Which of the following activities is one in which Fero is least likely involved?", "opts": ["Misclassifying cash flow.", "Ignoring cash flow.", "Managing cash flow."], "ans": "C", "expl": "Fero is ignoring cash flow, most likely misclassifying cash flow, but there is no evidence that Fero is managing cash flow. Firms can misrepresent their cash generating ability by misclassifying investing activities as operating activities and vice versa. For example, under U.S. GAAP, the cash flow statement reconciles the changes in cash and cash equivalents. Cash equivalents include short-term, highly liquid investments. Some firms park cash in longer-term investments such as marketable debt and equity securities. Typically, the acquisition and disposal cash flows from these longer-term investments are reported as investing activities in the cash flow statement. Noncash investing and financing activities are not reported in the cash flow statement since they do not result in an inflow or outflow of cash. For example, a capital lease is both an investing and financing decision in that the transaction is the equivalent of borrowing the purchase price. However, since no cash is involved, the transaction is not reported (it is ignored) on the cash flow statement throughout the life of the lease.", "explhtml": "<p>Fero is ignoring cash flow, most likely misclassifying cash flow, but there is no evidence that Fero is managing cash flow. Firms can misrepresent their cash generating ability by misclassifying investing activities as operating activities and vice versa. For example, under U.S. GAAP, the cash flow statement reconciles the changes in cash and cash equivalents. Cash equivalents include short-term, highly liquid investments. Some firms park cash in longer-term investments such as marketable debt and equity securities. Typically, the acquisition and disposal cash flows from these longer-term investments are reported as investing activities in the cash flow statement.<\/p><p>Noncash investing and financing activities are not reported in the cash flow statement since they do not result in an inflow or outflow of cash. For example, a capital lease is both an investing and financing decision in that the transaction is the equivalent of borrowing the purchase price. However, since no cash is involved, the transaction is not reported (it is ignored) on the cash flow statement throughout the life of the lease.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.1, LOS 11.b<\/div><div class=\"qtext\"><p>Fero Inc. (Fero) is a successful computer consulting services firm that has an established policy of investing its excess cash in short-term, virtually riskless, and highly liquid money market securities. However, it has recently deviated from this policy by investing in commercial paper and medium-cap domestic equities. As well, Fero entered into a $1.0 million lease with Pasquale Inc. (Pasquale) for some specialized computer equipment on December 28, 2008 that will be shipped at the very start of its next fiscal period on January 1, 2009. In exchange for the lease, Fero agrees to provide consulting services to Pasquale. Which of the following activities is one in which Fero is least likely involved?<\/p><\/div>", "subj": "fsa"}, {"n": 5, "q": "Samuel Maskin, CFA is evaluating the financial statements of Northern Energy Inc. The following is an extract from Northern's cash flow statement for the past three years:  20x6 20x5 20x4 Net Income $1,023 $988 $744 Depreciation $187 $145 $128 Restructuring Charges $(108) $(104) $212 Accounts receivable $(172) $(145) $(33) Inventories $(418) $(202) $(180) Accounts Payable $38 $37 $33 OCF $550 $719 $904 Which of the following conclusions is least likely for Northern?", "opts": ["Northern is stretching payables.", "Northern may have accelerated revenue recognition.", "Days sales outstanding is probably increasing."], "ans": "A", "expl": "We are not provided with income statement data such as revenues and COGS and hence have to make inferences from the information provided. Accounts payable seem to be stable and decreasing as a percentage of net income making the conclusion of stretching payables least likely. Revenue acceleration can be concluded based on large increase in inventory in 20x6 (possibly reflecting returns from customers) combined with increases in accounts receivable over time. Increases in accounts receivable (relative to earnings) also would indicate that days sales outstanding would most likely be increasing.", "explhtml": "<p>We are not provided with income statement data such as revenues and COGS and hence have to make inferences from the information provided. Accounts payable seem to be stable and decreasing as a percentage of net income making the conclusion of stretching payables least likely. Revenue acceleration can be concluded based on large increase in inventory in 20x6 (possibly reflecting returns from customers) combined with increases in accounts receivable over time. Increases in accounts receivable (relative to earnings) also would indicate that days sales outstanding would most likely be increasing.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.4, LOS 11.i<\/div><div class=\"qtext\"><p>Samuel Maskin, CFA is evaluating the financial statements of Northern Energy Inc. The following is an extract from Northern&#x27;s cash flow statement for the past three years:<\/p><div class=\"tbl\"><table><tr><td><\/td><td>20x6<\/td><td>20x5<\/td><td>20x4<\/td><\/tr><tr><td>Net Income<\/td><td>$1,023<\/td><td>$988<\/td><td>$744<\/td><\/tr><tr><td>Depreciation<\/td><td>$187<\/td><td>$145<\/td><td>$128<\/td><\/tr><tr><td>Restructuring Charges<\/td><td>$(108)<\/td><td>$(104)<\/td><td>$212<\/td><\/tr><tr><td>Accounts receivable<\/td><td>$(172)<\/td><td>$(145)<\/td><td>$(33)<\/td><\/tr><tr><td>Inventories<\/td><td>$(418)<\/td><td>$(202)<\/td><td>$(180)<\/td><\/tr><tr><td>Accounts Payable<\/td><td>$38<\/td><td>$37<\/td><td>$33<\/td><\/tr><tr><td>OCF<\/td><td>$550<\/td><td>$719<\/td><td>$904<\/td><\/tr><\/table><\/div><p>Which of the following conclusions is least likely for Northern?<\/p><\/div>", "subj": "fsa"}, {"n": 6, "q": "Andre Bursh, is analyzing large retailers and has collected the following information on three companies based on the most recent financial statements:  Allied Stores Beta Mart Cash-N-Carry Total Earnings (per share) $2.80 $1.33 $0.75 Cash element $1.90 $0.78 $0.25 Accrual element $0.90 $0.55 $0.50 Bursh notes that all three companies have reported stellar earnings this past year. Bursh is concerned about sustainability of such high earnings. Which company's earnings will revert to its mean fastest?", "opts": ["Allied Stores.", "Beta Mart.", "Cash-N-Carry."], "ans": "C", "expl": "Cash-N-Carry's earnings is comprised of large proportion of accruals (0.50/0.75 or 67%). Allied's accruals comprise (0.90/2.80) 32% of earnings and Beta's accruals comprise 41% of earnings.", "explhtml": "<p>Cash-N-Carry&#x27;s earnings is comprised of large proportion of accruals (0.50/0.75 or 67%). Allied&#x27;s accruals comprise (0.90/2.80) 32% of earnings and Beta&#x27;s accruals comprise 41% of earnings.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.3, LOS 11.g<\/div><div class=\"qtext\"><p>Andre Bursh, is analyzing large retailers and has collected the following information on three companies based on the most recent financial statements:<\/p><div class=\"tbl\"><table><tr><td><\/td><td>Allied Stores<\/td><td>Beta Mart<\/td><td>Cash-N-Carry<\/td><\/tr><tr><td>Total Earnings (per share)<\/td><td>$2.80<\/td><td>$1.33<\/td><td>$0.75<\/td><\/tr><tr><td>Cash element<\/td><td>$1.90<\/td><td>$0.78<\/td><td>$0.25<\/td><\/tr><tr><td>Accrual element<\/td><td>$0.90<\/td><td>$0.55<\/td><td>$0.50<\/td><\/tr><\/table><\/div><p>Bursh notes that all three companies have reported stellar earnings this past year. Bursh is concerned about sustainability of such high earnings. Which company&#x27;s earnings will revert to its mean fastest?<\/p><\/div>", "subj": "fsa"}, {"n": 7, "q": "Samuel Maskin, CFA is evaluating the financial statements of Northern Energy Inc. The following is an extract from Northern's cash flow statement for the past three years:  20x6 20x5 20x4 Net Income $1,023 $988 $744 Depreciation $187 $145 $128 Restructuring Charges $(108) $(104) $212 Accounts receivable $(172) $(145) $(33) Inventories $(418) $(202) $(180) Accounts Payable $38 $37 $33 OCF $550 $719 $904 The restructuring charges for Northern has most likely:", "opts": ["Increased reported earnings in 20x6 while reducing reported earnings in 20x4 and 20x5.", "Increased reported earnings for 20x4 while reducing reported earnings in 20x5 and 20x6.", "Reduced reported earnings in 20x4 while increasing reported earnings in 20x5 and 20x6."], "ans": "C", "expl": "Restructuring charges contribute positively to 20x4 cash flow indicating that it was a non-cash charge against that year's income. In the following two years, there is a reversal of that charge leading to an artificial increase in reported earnings for 20x5 and 20x6.", "explhtml": "<p>Restructuring charges contribute positively to 20x4 cash flow indicating that it was a non-cash charge against that year&#x27;s income. In the following two years, there is a reversal of that charge leading to an artificial increase in reported earnings for 20x5 and 20x6.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.4, LOS 11.i<\/div><div class=\"qtext\"><p>Samuel Maskin, CFA is evaluating the financial statements of Northern Energy Inc. The following is an extract from Northern&#x27;s cash flow statement for the past three years:<\/p><div class=\"tbl\"><table><tr><td><\/td><td>20x6<\/td><td>20x5<\/td><td>20x4<\/td><\/tr><tr><td>Net Income<\/td><td>$1,023<\/td><td>$988<\/td><td>$744<\/td><\/tr><tr><td>Depreciation<\/td><td>$187<\/td><td>$145<\/td><td>$128<\/td><\/tr><tr><td>Restructuring Charges<\/td><td>$(108)<\/td><td>$(104)<\/td><td>$212<\/td><\/tr><tr><td>Accounts receivable<\/td><td>$(172)<\/td><td>$(145)<\/td><td>$(33)<\/td><\/tr><tr><td>Inventories<\/td><td>$(418)<\/td><td>$(202)<\/td><td>$(180)<\/td><\/tr><tr><td>Accounts Payable<\/td><td>$38<\/td><td>$37<\/td><td>$33<\/td><\/tr><tr><td>OCF<\/td><td>$550<\/td><td>$719<\/td><td>$904<\/td><\/tr><\/table><\/div><p>The restructuring charges for Northern has most likely:<\/p><\/div>", "subj": "fsa"}, {"n": 8, "q": "Which of the following items is least likely to involve the use of subjective measurement estimates by management?", "opts": ["Use of straight-line depreciation method to depreciate tangible assets.", "Use of FIFO (first in-first out) to cost inventories.", "Use of criteria to determine treatment as an extraordinary item."], "ans": "C", "expl": "The use of criteria to determine treatment as an extraordinary item (i.e. Is the item within management's discretion? Is the event likely to recur in the foreseeable future?) does not involve numerical and subjective estimates per se. It is more a test of qualitative factors to determine the proper classification. Contrast this to FIFO, which is clearly a numerical estimate since an alternative of using LIFO (last in-first out) is possible and this will result in a different reported amount than FIFO. The same argument can be made for the use of the straight-line method since an alternative of using the declining-balance method is possible to depreciate tangible assets.", "explhtml": "<p>The use of criteria to determine treatment as an extraordinary item (i.e. Is the item within management&#x27;s discretion? Is the event likely to recur in the foreseeable future?) does not involve numerical and subjective estimates per se. It is more a test of qualitative factors to determine the proper classification. Contrast this to FIFO, which is clearly a numerical estimate since an alternative of using LIFO (last in-first out) is possible and this will result in a different reported amount than FIFO. The same argument can be made for the use of the straight-line method since an alternative of using the declining-balance method is possible to depreciate tangible assets.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.1, LOS 11.b<\/div><div class=\"qtext\"><p>Which of the following items is least likely to involve the use of subjective measurement estimates by management?<\/p><\/div>", "subj": "fsa"}, {"n": 9, "q": "Joe Carter, CFA, believes Triangle Equipment, a maker of large, specialized industrial equipment, has overstated the salvage value of its equipment. This would:", "opts": ["understate earnings.", "overstate earnings.", "overstate liabilities."], "ans": "B", "expl": "Overstating the salvage value reduces depreciation expense, which in turn increases earnings.", "explhtml": "<p>Overstating the salvage value reduces depreciation expense, which in turn increases earnings.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.1, LOS 11.b<\/div><div class=\"qtext\"><p>Joe Carter, CFA, believes Triangle Equipment, a maker of large, specialized industrial equipment, has overstated the salvage value of its equipment. This would:<\/p><\/div>", "subj": "fsa"}, {"n": 10, "q": "Asma Pharma has made several strategic investments in other pharmaceutical companies. In each instance, Asma has kept its stake just below 50% so it can account for the investment using the equity method of consolidation. Asma's balance sheet quality can be most accurately characterized as:", "opts": ["High-quality due to compliance with local GAAP.", "Low-quality due to bias in measurement.", "Low-quality due to lack of completeness."], "ans": "C", "expl": "One-line consolidation under the equity method obscures the components of balance sheet and artificially boosts certain profitability ratios (e.g., return on assets or profit margin). This reduces the completeness and quality of the firm's balance sheet. Compliance with GAAP is a necessary but not sufficient condition for evaluating quality of financial statements. Equity method of accounting does not by itself lead to measurement bias.", "explhtml": "<p>One-line consolidation under the equity method obscures the components of balance sheet and artificially boosts certain profitability ratios (e.g., return on assets or profit margin). This reduces the completeness and quality of the firm&#x27;s balance sheet. Compliance with GAAP is a necessary but not sufficient condition for evaluating quality of financial statements. Equity method of accounting does not by itself lead to measurement bias.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.5, LOS 11.k<\/div><div class=\"qtext\"><p>Asma Pharma has made several strategic investments in other pharmaceutical companies. In each instance, Asma has kept its stake just below 50% so it can account for the investment using the equity method of consolidation.<\/p><p>Asma&#x27;s balance sheet quality can be most accurately characterized as:<\/p><\/div>", "subj": "fsa"}, {"n": 11, "q": "Sustainable earnings are most likely to be driven by:", "opts": ["Cash flow element of earnings.", "Conservative revenue recognition practices.", "Accruals element of earnings."], "ans": "A", "expl": "Sustainable and persistent earnings are driven by cash flow element of earnings. The stability and accuracy of earnings forecasts can be reduced by estimation process that generates the accruals component of earnings. Conservative and aggressive revenue recognition practices both would result in reversion in earnings (and hence lowers the sustainability of earnings).", "explhtml": "<p>Sustainable and persistent earnings are driven by cash flow element of earnings. The stability and accuracy of earnings forecasts can be reduced by estimation process that generates the accruals component of earnings. Conservative and aggressive revenue recognition practices both would result in reversion in earnings (and hence lowers the sustainability of earnings).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.3, LOS 11.g<\/div><div class=\"qtext\"><p>Sustainable earnings are most likely to be driven by:<\/p><\/div>", "subj": "fsa"}, {"n": 12, "q": "Pysha Heavy Metals Ltd. supplies specialized metals to the chip fabrication industry. Selected financial data for Pysha, as well as industry comparables, are shown below: Pysha selected financial data (£ '000s):  20x7 20x8 20x9 Sales 1,169 1,312 1,414 Accounts receivable 58.45 72.16 98.98 Industry average:  20x7 20x8 20x9 DSO 22.6 22.8 22.4 Receivables turnover 16.2 16.0 16.3 Based on the trend in revenues and receivables, it can be most accurately concluded that:", "opts": ["Pysha’s revenues are growing at a faster rate than its receivables.", "Pysha’s revenues are growing at a slower rate than its receivables.", "The revenue growth rate divided by receivables growth rate is increasing over time."], "ans": "B", "expl": "Pysha's revenue growth rate is lagging the receivables growth rate.  20x7 20x8 20x9 Revenue growth - 12.23% 7.77% Receivable growth - 23.46% 37.17% Ratio  52.15% 20.92%", "explhtml": "<p>Pysha&#x27;s revenue growth rate is lagging the receivables growth rate.<\/p><div class=\"tbl\"><table><tr><td><\/td><td>20x7<\/td><td>20x8<\/td><td>20x9<\/td><\/tr><tr><td>Revenue growth<\/td><td>-<\/td><td>12.23%<\/td><td>7.77%<\/td><\/tr><tr><td>Receivable growth<\/td><td>-<\/td><td>23.46%<\/td><td>37.17%<\/td><\/tr><tr><td>Ratio<\/td><td><\/td><td>52.15%<\/td><td>20.92%<\/td><\/tr><\/table><\/div>", "qhtml": "<div class=\"pp-topic\">Module 11.3, LOS 11.h<\/div><div class=\"qtext\"><p>Pysha Heavy Metals Ltd. supplies specialized metals to the chip fabrication industry. Selected financial data for Pysha, as well as industry comparables, are shown below:<\/p><p>Pysha selected financial data (£ &#x27;000s):<\/p><div class=\"tbl\"><table><tr><td><\/td><td>20x7<\/td><td>20x8<\/td><td>20x9<\/td><\/tr><tr><td>Sales<\/td><td>1,169<\/td><td>1,312<\/td><td>1,414<\/td><\/tr><tr><td>Accounts receivable<\/td><td>58.45<\/td><td>72.16<\/td><td>98.98<\/td><\/tr><\/table><\/div><p>Industry average:<\/p><div class=\"tbl\"><table><tr><td><\/td><td>20x7<\/td><td>20x8<\/td><td>20x9<\/td><\/tr><tr><td>DSO<\/td><td>22.6<\/td><td>22.8<\/td><td>22.4<\/td><\/tr><tr><td>Receivables turnover<\/td><td>16.2<\/td><td>16.0<\/td><td>16.3<\/td><\/tr><\/table><\/div><p>Based on the trend in revenues and receivables, it can be most accurately concluded that:<\/p><\/div>", "subj": "fsa"}, {"n": 13, "q": "Which of the following statements about financial disclosures are correct or incorrect? Statement #1: Transitory earnings are usually more important to investors than permanent\nearnings. Statement #2: Pro-forma earnings are usually prepared in accordance with generally\naccepted accounting principles.", "opts": ["Only statement #1 is incorrect.", "Only statement #2 is incorrect.", "Both are incorrect."], "ans": "C", "expl": "Statement #1 is incorrect. Investors are usually more interested in permanent earnings. Statement #2 is incorrect. Pro-forma earnings are not prepared in accordance with generally accepted accounting principles because they may exclude certain transactions. This is why it is important for an analyst to understand the disclosures.", "explhtml": "<p>Statement #1 is incorrect. Investors are usually more interested in permanent earnings. Statement #2 is incorrect. Pro-forma earnings are not prepared in accordance with generally accepted accounting principles because they may exclude certain transactions. This is why it is important for an analyst to understand the disclosures.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.2, LOS 11.f<\/div><div class=\"qtext\"><p>Which of the following statements about financial disclosures are correct or incorrect?<\/p><div class=\"tbl\"><table><tr><td>Statement #1:<\/td><td>Transitory earnings are usually more important to investors than permanent<br>earnings.<\/td><\/tr><tr><td>Statement #2:<\/td><td>Pro-forma earnings are usually prepared in accordance with generally<br>accepted accounting principles.<\/td><\/tr><\/table><\/div><\/div>", "subj": "fsa"}, {"n": 14, "q": "Brent Jones, CFA is analyzing the financial statements of Imperial Resorts Inc. Jones wants to use the Beneish model to evaluate the probability of earnings manipulation. Jones makes the following statements: 1. Depreciation index of less than 1 would indicate that the company is depreciating assets at a higher rate than its peers. 2. Increases in Asset quality index indicate that the revenue recognition policies are conservative. Regarding the statements by Jones:", "opts": ["None of the statements is correct.", "Only statement 1 is correct.", "Only statement 2 is correct."], "ans": "A", "expl": "Statement 1 is incorrect. Depreciation index less than 1 indicates that the company is depreciating assets at a higher rate than in prior years (and not relative to its peers). Statement 2 is incorrect. Asset quality index is used as an indicator of excessive capitalization of expenses.", "explhtml": "<p>Statement 1 is incorrect. Depreciation index less than 1 indicates that the company is depreciating assets at a higher rate than in prior years (and not relative to its peers). Statement 2 is incorrect. Asset quality index is used as an indicator of excessive capitalization of expenses.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.2, LOS 11.d<\/div><div class=\"qtext\"><p>Brent Jones, CFA is analyzing the financial statements of Imperial Resorts Inc. Jones wants to use the Beneish model to evaluate the probability of earnings manipulation.<\/p><p>Jones makes the following statements:<\/p><p>1. Depreciation index of less than 1 would indicate that the company is depreciating assets at a higher rate than its peers. 2. Increases in Asset quality index indicate that the revenue recognition policies are conservative.<\/p><p>Regarding the statements by Jones:<\/p><\/div>", "subj": "fsa"}, {"n": 15, "q": "A manufacturing firm purchases equipment for use in its operations. With regard to recording the purchase using the cash basis versus the accrual basis of accounting, which of the following statements is most appropriate?", "opts": ["With the cash basis, revenues and expenses relating to the equipment are generally recognized in the same period.", "With the accrual basis, the cost of the equipment is allocated to the cash flow statements over the asset’s life.", "With the cash basis, revenues and expenses relating to the equipment are generally recognized in different periods."], "ans": "C", "expl": "With the cash basis of accounting, revenues are recognized when cash is collected and expenses are recognized when cash is paid. Therefore, the cash flows may occur in different periods than when the revenues are actually earned or when the expenses are actually incurred. For example, the purchase of equipment used in a firm's manufacturing operation may result in an immediate cash outflow but the equipment generates revenues over its useful life. In this case, the revenues and expense are reported in different periods. With the accrual basis of accounting, revenues are recognized when earned and expenses are recognized when incurred, regardless of the timing of the cash flows. With the equipment purchase, the cost of the equipment will be allocated to the income statement (not cash flow statement) over the asset's life and at the same time, matched with the revenues generated.", "explhtml": "<p>With the cash basis of accounting, revenues are recognized when cash is collected and expenses are recognized when cash is paid. Therefore, the cash flows may occur in different periods than when the revenues are actually earned or when the expenses are actually incurred. For example, the purchase of equipment used in a firm&#x27;s manufacturing operation may result in an immediate cash outflow but the equipment generates revenues over its useful life. In this case, the revenues and expense are reported in different periods.<\/p><p>With the accrual basis of accounting, revenues are recognized when earned and expenses are recognized when incurred, regardless of the timing of the cash flows. With the equipment purchase, the cost of the equipment will be allocated to the income statement (not cash flow statement) over the asset&#x27;s life and at the same time, matched with the revenues generated.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.2, LOS 11.f<\/div><div class=\"qtext\"><p>A manufacturing firm purchases equipment for use in its operations. With regard to recording the purchase using the cash basis versus the accrual basis of accounting, which of the following statements is most appropriate?<\/p><\/div>", "subj": "fsa"}, {"n": 16, "q": "William Jones, CFA, is analyzing the financial performance of two U.S. competitors in connection with a potential investment recommendation of their common stocks. He is particularly concerned about the quality of each company's financial results in 2007–2008 and in developing projections for 2009 and 2010 fiscal years. Adams Company has been the largest company in the industry, but Jefferson Inc. has grown more rapidly in recent years. Adams's net sales in 2004 were 33-1/3% higher than Jefferson's but were only 18% above Jefferson's in 2008. During 2008, a slowing U.S. economy led to lower domestic revenue growth for both companies. The 10-k reports showed overall sales growth of 6% for Adams in 2008 compared to 7% for 2007 and 9% in 2006. Jefferson's gross sales rose almost 12% in 2008 versus 8% in 2007 and 10% in 2006. In the past three years, Jefferson has expanded its foreign business at a faster pace than Adams. In 2008, Jefferson's growth in overseas business was particularly impressive. According to the company's 10-k report, Jefferson offered a sales incentive to overseas customers. For those customers accepting the special sales discount, Jefferson shipped products to specific warehouses in foreign ports rather than directly to those customers' facilities. In his initial review of Adams's and Jefferson's financial statements, Jones was concerned about the quality of the growth in Jefferson's sales, considerably higher accounts receivables, and the impact of overall accruals on earnings quality. He noted that Jefferson had instituted an accounting change in 2008. The economic life for new plant and equipment investments was determined to be five years longer than for previous investments. For Adams, he noted that the higher level of inventories at the end of 2008 might be cause for concern in light of a further slowdown expected in the U.S. economy in 2009. The accompanying table shows financial data for both companies' Form 10-k reports for 2006– 2008 used by Jones for his analysis. To evaluate sales quality, he focused on trends in sales and related expenses for both companies as well as cash collections and receivables comparisons. Inventory trends relative to sales and the number of days' sales outstanding in inventory were determined for both companies. Expense trends were examined for Adams and Jefferson relative to sales growth and accrual ratios on a balance sheet and cash flow basis were developed as overall measures of earnings quality.  Adams Company    Jefferson Inc.   ($ in thousands) 2006 2007 2008  2006 2007 2008         Gross sales 32,031 34,273 36,330  25,625 27,675 30,900 Sales discounts, returns,\nand allowances 781 836 886  625 675 900 Net sales 31,250 33,438 35,444  25,000 27,000 30,000 Cost of goods sold 1 elerated in 2008 compared to Adams’s, but cash collections declined as indicated by the rise in receivables and the revenue/collections ratio; Adams’s sales, accounts receivables, and cash collections rose at similar rates in 2008.", "Jefferson’s higher increase in sales relative to Adams’s led to improvement in cash collections indicated by the rise in the revenue/collections ratio. There was no change in Adams’s cash collections in 2008.", "Jefferson’s decline in cash and equivalents in 2008 resulted in lower cash collections despite strong sales growth; Adams’s showed similar growth in cash and equivalents and accounts receivable relative to sales gains."], "ans": "A", "expl": "The increase in Jefferson's revenues relative to cash collections along with the large increase in accounts receivable indicates declining cash collections in 2008 compared to its experience in 2007 and relative to Adams's, which showed consistency in both years.", "explhtml": "<p>The increase in Jefferson&#x27;s revenues relative to cash collections along with the large increase in accounts receivable indicates declining cash collections in 2008 compared to its experience in 2007 and relative to Adams&#x27;s, which showed consistency in both years.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.1, LOS 11.b<\/div><div class=\"qtext\"><p>William Jones, CFA, is analyzing the financial performance of two U.S. competitors in connection with a potential investment recommendation of their common stocks. He is particularly concerned about the quality of each company&#x27;s financial results in 2007–2008 and in developing projections for 2009 and 2010 fiscal years.<\/p><p>Adams Company has been the largest company in the industry, but Jefferson Inc. has grown more rapidly in recent years. Adams&#x27;s net sales in 2004 were 33-1/3% higher than Jefferson&#x27;s but were only 18% above Jefferson&#x27;s in 2008. During 2008, a slowing U.S. economy led to lower domestic revenue growth for both companies. The 10-k reports showed overall sales growth of 6% for Adams in 2008 compared to 7% for 2007 and 9% in 2006. Jefferson&#x27;s gross sales rose almost 12% in 2008 versus 8% in 2007 and 10% in 2006. In the past three years, Jefferson has expanded its foreign business at a faster pace than Adams. In 2008, Jefferson&#x27;s growth in overseas business was particularly impressive. According to the company&#x27;s 10-k report, Jefferson offered a sales incentive to overseas customers. For those customers accepting the special sales discount, Jefferson shipped products to specific warehouses in foreign ports rather than directly to those customers&#x27; facilities.<\/p><p>In his initial review of Adams&#x27;s and Jefferson&#x27;s financial statements, Jones was concerned about the quality of the growth in Jefferson&#x27;s sales, considerably higher accounts receivables, and the impact of overall accruals on earnings quality. He noted that Jefferson had instituted an accounting change in 2008. The economic life for new plant and equipment investments was determined to be five years longer than for previous investments. For Adams, he noted that the higher level of inventories at the end of 2008 might be cause for concern in light of a further slowdown expected in the U.S. economy in 2009.<\/p><p>The accompanying table shows financial data for both companies&#x27; Form 10-k reports for 2006– 2008 used by Jones for his analysis. To evaluate sales quality, he focused on trends in sales and related expenses for both companies as well as cash collections and receivables comparisons. Inventory trends relative to sales and the number of days&#x27; sales outstanding in inventory were determined for both companies. Expense trends were examined for Adams and Jefferson relative to sales growth and accrual ratios on a balance sheet and cash flow basis were developed as overall measures of earnings quality.<\/p><div class=\"tbl\"><table><tr><td><\/td><td colspan=3>Adams Company<\/t ipment terms on revenue recognition and inventories for the special overseas offer.", "Adams due to lower cash collection measures, possible inventory obsolescence related to higher 2008 inventories despite slowing customer demand, higher expense growth compared to Jefferson, and lower balance sheet and cash flow accrual ratios relative to Jefferson."], "ans": "B", "expl": "According to the simple measures of earnings quality, balance sheet, and cash flow accruals ratios, Jefferson's earnings quality in 2008 was lower than its 2007 levels and relative to Adams's. The more aggressive accounting treatment for the overseas special offer lowered the quality of revenues and may have understated inventories if some of these customers did not take delivery of the shipments. Jefferson also instituted a more liberal policy toward depreciable lives versus Adams, another indicator of lower earnings quality.", "explhtml": "<p>According to the simple measures of earnings quality, balance sheet, and cash flow accruals ratios, Jefferson&#x27;s earnings quality in 2008 was lower than its 2007 levels and relative to Adams&#x27;s. The more aggressive accounting treatment for the overseas special offer lowered the quality of revenues and may have understated inventories if some of these customers did not take delivery of the shipments. Jefferson also instituted a more liberal policy toward depreciable lives versus Adams, another indicator of lower earnings quality.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.3, LOS 11.h<\/div><div class=\"qtext\"><p>William Jones, CFA, is analyzing the financial performance of two U.S. competitors in connection with a potential investment recommendation of their common stocks. He is particularly concerned about the quality of each company&#x27;s financial results in 2007–2008 and in developing projections for 2009 and 2010 fiscal years.<\/p><p>Adams Company has been the largest company in the industry, but Jefferson Inc. has grown more rapidly  Jefferson relative to sales growth and accrual ratios on a balance sheet and cash flow basis were developed as overall measures of earnings quality.<\/p><div class=\"tbl\"><table><tr><td><\/td><td colspan=3>Adams Company<\/td><td><\/td><td colspan=3>Jefferson Inc.<\/td><\/tr><tr><td>($ in thousands)<\/td><td>2006<\/td><td>2007<\/td><td>2008<\/td><td><\/td><td>2006<\/td><td>2007<\/td><td>2008<\/td><\/tr><tr><td>Gross sales<\/td><td>32,031<\/td><td>34,273<\/td><td>36,330<\/td><td><\/td><td>25,625<\/td><td>27,675<\/td><td>30,900<\/td><\/tr><\/table><\/div><div class=\"tbl\"><table><tr><td>Sales discounts, returns,<br>and allowances<\/td><td>781<\/td><td>836<\/td><td>886<\/td><td><\/td><td>625<\/td><td>675<\/td><td>900<\/td><\/tr><tr><td>Net sales<\/td><td>31,250<\/td><td>33,438<\/td><td>35,444<\/td><td><\/td><td>25,000<\/td><td>27,000<\/td><td>30,000<\/td><\/tr><tr><td>Cost of goods sold<\/td><td>15,312<\/td><td>16,384<\/td><td>17,367<\/td><td><\/td><td>12,250<\/td><td>13,250<\/td><td>15,500<\/td><\/tr><tr><td>SG&amp;A expenses<\/td><td>9,028<\/td><td>9,660<\/td><td>10,240<\/td><td><\/td><td>7,222<\/td><td>7,800<\/td><td>8,200<\/td><\/tr><tr><td>Depreciation expense<\/td><td>625<\/td><td>669<\/td><td>709<\/td><td><\/td><td>500<\/td><td>515<\/td><td>516<\/td><\/tr><tr><td>Interest expense<\/td><td>400<\/td><td>428<\/td><td>454<\/td><td><\/td><td>360<\/td><td>366<\/td><td>396<\/td><\/tr><tr><td>Income before taxes<\/td><td>5,835<\/td><td>6,243<\/td><td>6,618<\/td><td><\/td><td>4,668<\/td><td>5,069<\/td><td>5,388<\/td><\/tr><tr><td>Taxes (tax rate 40%)<\/td><td>2,334<\/td><td>2,497<\/td><td>2,647<\/td><td><\/td><td>2,000<\/td><td>2,028<\/td><td>2,155<\/td><\/tr><tr><td>Net income<\/td><td>3,501<\/td><td>3,746<\/td><td>3,971<\/td><td><\/td><td>2,668<\/td><td>3,041<\/td><td>3,233<\/td><\/tr><tr><td>Dividends<\/td><td>3,000<\/td><td>3,180<\/td><td>3,307<\/td><td><\/td><td>2,460<\/td><td>2,760<\/td><td>2,880<\/td><\/tr><tr><td>Net addition to retained<br>earnings<\/td><td>50 hange sales discounts<br>and allowances<\/td><td><\/td><td>6.0%<\/td><td>6.0%<\/td><td><\/td><td><\/td><td>8.0%<\/td><td>33.3%<\/td><\/tr><tr><td>% change net sales<\/td><td><\/td><td>7.0%<\/td><td>6.0%<\/td><td><\/td><td><\/td><td>8.0%<\/td><td>11.1%<\/td><\/tr><tr><td>% change cost of goods<br>sold<\/td><td><\/td><td>7.0%<\/td><td>6.0%<\/td><td><\/td><td><\/td><td>8.0%<\/td><td>17.0%<\/td><\/tr><tr><td>% change in SG&amp;A<\/td><td><\/td><td>6.0%<\/td><td>6.0%<\/td><td><\/td><td><\/td><td>8.0%<\/td><td>5.1%<\/td><\/tr><tr><td>% change in depreciation<br>expense<\/td><td><\/td><td>6.0%<\/td><td>6.0%<\/td><td><\/td><td><\/td><td>3.0%<\/td><td>0.2%<\/td><\/tr><tr><td>% change in accounts<br>receivable<\/td><td><\/td><td>6.0%<\/td><td>6.0%<\/td><td><\/td><td><\/td><td>2.0%<\/td><td>22.3%<\/td><\/tr><tr><td>% change in inventories<\/td><td><\/td><td>5.0%<\/td><td>13.8%<\/td><td><\/td><td><\/td><td>0.0%<\/td><td>(13.5%)<\/td><\/tr><tr><td>Revenues % cash<br>collections<\/td><td>1.03<\/td><td>1.03<\/td><td>1.03<\/td><td><\/td><td>1.0<\/td><td>1.0<\/td><td>1.1<\/td><\/tr><tr><td>Days inventory<br>outstanding<\/td><td>155<\/td><td>153<\/td><td>164<\/td><td><\/td><td>144<\/td><td>143<\/td><td>106<\/td><\/tr><tr><td>Balance sheet accrual ratio<\/td><td>3.4%<\/td><td>3.5%<\/td><td>3.9%<\/td><td><\/td><td>2.0%<\/td><td>2.4%<\/td><td>10.1%<\/td><\/tr><tr><td>Cash flow accrual ratio<\/td><td>3.4%<\/td><td>3.5%<\/td><td>3.8%<\/td><td><\/td><td>2.0%<\/td><td>2.0%<\/td><td>4.3%<\/td><\/tr><\/table><\/div><p>Based on the financial results of Adams and Jefferson in 2007 and 2008, the company demonstrating the lower earnings quality would be:<\/p><\/div>", "subj": "fsa"}, {"n": 19, "q": "The least valuable source of information about a businesses' risk is:", "opts": ["Management discussion and analysis section of the annual report.", "Auditor’s report.", "Notes to financial statements."], "ans": "B", "expl": "Because an audit report provides only historical information, such a report's usefulness as an information source is limited. Companies are required to make certain risk related disclosures in the notes to financial statements. Both GAAP and IFRS require companies to disclose risks related to pension benefits, contingent obligations and financial instruments. Ideally, companies should include principal risks that are unique to the business (as opposed to risks faced by most businesses) in their MD&A.", "explhtml": "<p>Because an audit report provides only historical information, such a report&#x27;s usefulness as an information source is limited. Companies are required to make certain risk related disclosures in the notes to financial statements. Both GAAP and IFRS require companies to disclose risks related to pension benefits, contingent obligations and financial instruments. Ideally, companies should include principal risks that are unique to the business (as opposed to risks faced by most businesses) in their MD&amp;A.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.5, LOS 11.m<\/div><div class=\"qtext\"><p>The least valuable source of information about a businesses&#x27; risk is:<\/p><\/div>", "subj": "fsa"}, {"n": 20, "q": "Jeremy Jennings is explaining the concept of earnings quality to his new colleagues. Which of the following measures is most indicative of a higher quality of earnings when attempting to forecast future earnings?", "opts": ["Higher level of earnings.", "Higher degree of conservatism of earnings.", "Higher degree of persistence of earnings."], "ans": "C", "expl": "The term earnings quality usually refers to the persistence and sustainability of a firm's earnings; that is, more persistent and sustainable earnings are considered higher quality. Measuring earnings quality based on conservative earnings is an inferior measure when attempting to forecast future earnings because most accruals will self-correct over time. For example, the lower earnings that result from accelerated depreciation will increase in the later years of the asset's life. Focusing on accruals and deferrals is a more effective way of measuring earnings quality. A higher level of earnings has no impact on increasing the quality of earnings since the former may be derived largely from earnings manipulation on the part of management.", "explhtml": "<p>The term earnings quality usually refers to the persistence and sustainability of a firm&#x27;s earnings; that is, more persistent and sustainable earnings are considered higher quality.<\/p><p>Measuring earnings quality based on conservative earnings is an inferior measure when attempting to forecast future earnings because most accruals will self-correct over time. For example, the lower earnings that result from accelerated depreciation will increase in the later years of the asset&#x27;s life. Focusing on accruals and deferrals is a more effective way of measuring earnings quality.<\/p><p>A higher level of earnings has no impact on increasing the quality of earnings since the former may be derived largely from earnings manipulation on the part of management.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.2, LOS 11.f<\/div><div class=\"qtext\"><p>Jeremy Jennings is explaining the concept of earnings quality to his new colleagues. Which of the following measures is most indicative of a higher quality of earnings when attempting to forecast future earnings?<\/p><\/div>", "subj": "fsa"}, {"n": 21, "q": "With regard to specific measures to analyze in detecting manipulation in the financial reporting process, which of the following statements is the least accurate?", "opts": ["Negative nonrecurring or non-operating items may be indicative of misclassifying an operating expense.", "An increasing days’ inventory on hand (DOH) measure may be indicative of obsolete inventory.", "A decreasing days’ sales outstanding (DSO) measure may be an indication of lower quality revenue."], "ans": "C", "expl": "Days' sales outstanding (DSO) measures the number of days it takes to convert receivables into cash and is calculated by dividing the number of days in the period by the accounts receivable turnover ratio. An increasing DSO (decreasing receivables turnover) may be an indication of lower quality revenue; that is, the longer it takes to collect from customers, the more likely the receivables will turn into bad debt. Days' inventory on hand (DOH) is equal to the number of days in the period divided by inventory turnover ratio and it measures the number of days it takes to sell inventory. An increasing DOH may be indicative of obsolete inventory. Analysts should compare changes in the core operating margin over time and look for negative nonrecurring (e.g., restructuring charges, asset impairments, and write-downs) or non-operating items that occurred when the ratio increased. This may be the result of misclassifying an operating expense.", "explhtml": "<p>Days&#x27; sales outstanding (DSO) measures the number of days it takes to convert receivables into cash and is calculated by dividing the number of days in the period by the accounts receivable turnover ratio. An increasing DSO (decreasing receivables turnover) may be an indication of lower quality revenue; that is, the longer it takes to collect from customers, the more likely the receivables will turn into bad debt.<\/p><p>Days&#x27; inventory on hand (DOH) is equal to the number of days in the period divided by inventory turnover ratio and it measures the number of days it takes to sell inventory. An increasing DOH may be indicative of obsolete inventory.<\/p><p>Analysts should compare changes in the core operating margin over time and look for negative nonrecurring (e.g., restructuring charges, asset impairments, and write-downs) or non-operating items that occurred when the ratio increased. This may be the result of misclassifying an operating expense.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.1, LOS 11.b<\/div><div class=\"qtext\"><p>With regard to specific measures to analyze in detecting manipulation in the financial reporting process, which of the following statements is the least accurate?<\/p><\/div>", "subj": "fsa"}, {"n": 22, "q": "High Plains Tubular Company is a leading manufacturer and distributor of quality steel products used in energy, industrial, and automotive applications worldwide. The U.S. steel industry has been challenged by competition from foreign producers located primarily in Asia. All of the U.S. producers are experiencing declining margins as labor costs continue to increase. In addition, the U.S. steel mills are technologically inferior to the foreign competitors. Also, the U.S. producers have significant environmental issues that remain unresolved. High Plains is not immune from the problems of the industry and is currently in technical default under its bond covenants. The default is a result of the failure to meet certain coverage and turnover ratios. Earlier this year, High Plains and its bondholders entered into an agreement that will allow High Plains time to become compliant with the covenants. If High Plains is not in compliance by year end, the bondholders can immediately accelerate the maturity date of the bonds. In this case, High Plains would have no choice but to file bankruptcy. High Plains follows U.S. GAAP. For the year ended 2008, High Plains received an unqualified opinion from its independent auditor. However, the auditor's opinion included an explanatory paragraph about High Plains' inability to continue as a going concern in the event its bonds remain in technical default. At the end of 2008, High Plains' Chief Executive Officer (CEO) and Chief Financial Officer (CFO) filed the necessary certifications required by the Securities and Exchange Commission (SEC). To get a better understanding of High Plains' financial situation, it is helpful to review High Plains' cash flow statement found in Exhibit 1 and selected financial footnotes found in Exhibit 2. Exhibit 1: Cash Flow Statement High Plains Tubular Cash Flow Statement    Year ended December 31,  in thousands 2008 2007 Net income $158,177 $121,164 Depreciation expense 34,078 31,295 Deferred taxes 7,697 11,407 Receivables (144,087) (24,852) Inventory (79,710) (72,777) Payables 36,107 22,455 Cash flow from operations $12,262 $88,692 Cash flow from investing ($39,884) ($63,953) Cash flow from financing $82,676 $6,056 Change in cash $55,054 $30,795 Exhibit 2: Selected Financial Footnotes 1. During 2008, High Plains' sales increased 27% over 2007. Its sales growth continues to significantly exceed the industry average. Sales are recognized when a firm order is received from the customer, the sales price is fixed and determinable, and collectability is reasonably assured. 2. The cost of inventories is determined using the last-in, first-out (LIFO) method. Had the first-in, first-out method been used, inventories would have been $152 million and $143 million higher as of December 31, 2008 and 2007, respectively. 3. Effective January 1, 2008, High Plains changed its depreciation method from the double-declining balance method to the straight-line method in order to be more comparable with the accounting practices of other firms within its industry. The change was not retroactively applied and only affects assets that were acquired on or after January 1, 2008. 4. High Plains made the following discretionary expenditures for maintenance and repair of plant and equipment and for advertising and marketing: in millions 2008 2007 2006 Maintenance and repairs $180 $184 $218 Advertising and marketing 94 108 150 5. During the fiscal year ended December 31, 2008, High Plains sold $50 million of its accounts receivable, with recourse, to an unrelated entity. All of the receivables were still outstanding at year end. 6. High Plains conducts some of its operations in facilities leased under noncancelable finance (capital) leases. Certain leases include renewal options with provisions for increased lease payments during the renewal term. 7. High Plains' average net operating assets at the end of 2008 and 2007 was $977.89 million and $642.83 million, respectively. What is the most likely effect of High Plains' revenue recognition policy on net income and inventory turnover?", "opts": ["Net income and inventory turnover are overstated.", "Only inventory turnover is overstated.", "Only net income is overstated."], "ans": "A", "expl": "Revenue should be recognized when earned and payment is assured. High Plains is recognizing revenue as orders are received. Since High Plains still has an obligation to deliver the goods, revenue is not yet earned. By recognizing revenue too soon, net income is overstated and ending inventory is understated. Understated ending inventory would result in an overstated inventory turnover ratio.", "explhtml": "<p>Revenue should be recognized when earned and payment is assured. High Plains is recognizing revenue as orders are received. Since High Plains still has an obligation to deliver the goods, revenue is not yet earned. By recognizing revenue too soon, net income is overstated and ending inventory is understated. Understated ending inventory would result in an overstated inventory turnover ratio.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.1, LOS 11.b<\/div><div class=\"qtext\"><p>High Plains Tubular Company is a leading manufacturer and distributor of quality steel products used in energy, industrial, and automotive applications worldwide.<\/p><p>The U.S. steel industry has been challenged by competition from foreign producers located primarily in Asia. All of the U.S. producers are experiencing declining margins as labor costs continue to increase. In addition, the U.S. steel mills are technologically inferior to the foreign competitors. Also, the U.S. producers have significant environmental issues that remain unresolved.<\/p><p>High Plains is not immune from the problems of the industry and is currently in technical default under its bond covenants. The default is a result of the failure to meet certain coverage and turnover ratios. Earlier this year, High Plains and its bondholders entered into an agreement that will allow High Plains time to become compliant with the covenants. If High Plains is not in compliance by year end, the bondholders can immediately accelerate the maturity date of the bonds. In this case, High Plains would have no choice but to file bankruptcy.<\/p><p>High Plains follows U.S. GAAP. For the year ended 2008, High Plains received an unqualified opinion from its independent auditor. However, the auditor&#x27;s opinion included an explanatory paragraph about High Plains&#x27; inability to continue as a going concern in the event its bonds remain in technical default.<\/p><p>At the end of 2008, High Plains&#x27; Chief Executive Officer (CEO) and Chief Financial Officer (CFO) filed the necessary certifications required by the Securities and Exchange Commission (SEC).<\/p><p>To get a better understanding of High Plains&#x27; financial situation, it is helpful to review High Plains&#x27; cash flow statement found in Exhibit 1 and selected financial footnotes found in Exhibit 2.<\/p><p>Exhibit 1: Cash Flow Statement<\/p><div class=\"tbl\"><table><tr><td colspan=3>High Plains Tubular Cash Flow Statement<\/td><\/tr><tr><td><\/td><td colspan=2>Year ended December 31,<\/td><\/tr><tr><td>in thousands<\/td><td>2008<\/td><td>2007<\/td><\/tr><tr><td>Net income<\/td><td>$158,177<\/td><td>$121,164<\/td><\/tr><tr><td>Depreciation expense<\/td><td>34,078<\/td><td>31,295<\/td><\/tr><tr><td>Deferred taxes<\/td><td>7,697<\/td><td>11,407<\/td><\/tr><tr><td>Receivables<\/td><td>(144,087)<\/td><td>(24,852)<\/td><\/tr><\/table><\/div><div class=\"tbl\"><table><tr><td>Inventory<\/td><td>(79,710)<\/td><td>(72,777)<\/td><\/tr><tr><td>Payables<\/td><td>36,107<\/td><td>22,455<\/td><\/tr><tr><td>Cash flow from operations<\/td><td>$12,262<\/td><td>$88,692<\/td><\/tr><tr><td>Cash flow from investing<\/td><td>($39,884)<\/td><td>($63,953)<\/td><\/tr><tr><td>Cash flow from financing<\/td><td>$82,676<\/td><td>$6,056<\/td><\/tr><tr><td>Change in cash<\/td><td>$55,054<\/td><td>$30,795<\/td><\/tr><\/table><\/div><p>Exhibit 2: Selected Financial Footnotes<\/p><p>1. During 2008, High Plains&#x27; sales increased 27% over 2007. Its sales growth continues to significantly exceed the industry average. Sales are recognized when a firm order is received from the customer, the sales price is fixed and determinable, and collectability is reasonably assured. 2. The cost of inventories is determined using the last-in, first-out (LIFO) method. Had the first-in, first-out method been used, inventories would have been $152 million and $143 million higher as of December 31, 2008 and 2007, respectively. 3. Effective January 1, 2008, High Plains changed its depreciation method from the double-declining balance method to the straight-line method in order to be more comparable with the accounting practices of other firms within its industry. The change was not retroactively applied and only affects assets that were acquired on or after January 1, 2008.<\/p><p>4. High Plains made the following discretionary expenditures for maintenance and repair of plant and equipment and for advertising and marketing:<\/p><div class=\"tbl\"><table><tr><td>in millions<\/td><td>2008<\/td><td>2007<\/td><td>2006<\/td><\/tr><tr><td>Maintenance and repairs<\/td><td>$180<\/td><td>$184<\/td><td>$218<\/td><\/tr><tr><td>Advertising and marketing<\/td><td>94<\/td><td>108<\/td><td>150<\/td><\/tr><\/table><\/div><p>5. During the fiscal year ended December 31, 2008, High Plains sold $50 million of its accounts receivable, with recourse, to an unrelated entity. All of the receivables were still outstanding at year end. 6. High Plains conducts some of its operations in facilities leased under noncancelable finance (capital) leases. Certain leases include renewal options with provisions for increased lease payments during the renewal term.<\/p><p>7. High Plains&#x27; average net operating assets at the end of 2008 and 2007 was $977.89 million and $642.83 million, respectively.<\/p><p>What is the most likely effect of High Plains&#x27; revenue recognition policy on net income and inventory turnover?<\/p><\/div>", "subj": "fsa"}, {"n": 23, "q": "William Jones, CFA, is analyzing the financial performance of two U.S. competitors in connection with a potential investment recommendation of their common stocks. He is particularly concerned about the quality of each company's financial results in 2007– 2008 and in developing projections for 2009 and 2010 fiscal years. Adams Company has been the largest company in the industry, but Jefferson Inc. has grown more rapidly in recent years. Adams's net sales in 2004 were 33-1/3% higher than Jefferson's but were only 18% above Jefferson's in 2008. During 2008, a slowing U.S. economy led to lower domestic revenue growth for both companies. The 10-k reports showed overall sales growth of 6% for Adams in 2008 compared to 7% for 2007 and 9% in 2006. Jefferson's gross sales rose almost 12% in 2008 versus 8% in 2007 and 10% in 2006. In the past three years, Jefferson has expanded its foreign business at a faster pace than Adams. In 2008, Jefferson's growth in overseas business was particularly impressive. According to the company's 10-k report, Jefferson offered a sales incentive to overseas customers. For those customers accepting the special sales discount, Jefferson shipped products to specific warehouses in foreign ports rather than directly to those customers' facilities. In his initial review of Adams's and Jefferson's financial statements, Jones was concerned about the quality of the growth in Jefferson's sales, considerably higher accounts receivables, and the impact of overall accruals on earnings quality. He noted that Jefferson had instituted an accounting change in 2008. The economic life for new plant and equipment investments was determined to be five years longer than for previous investments. For Adams, he noted that the higher level of inventories at the end of 2008 might be cause for concern in light of a further slowdown expected in the U.S. economy in 2009. The accompanying table shows financial data for both companies' Form 10-k reports for 2006– 2008 used by Jones for his analysis. To evaluate sales quality, he focused on trends in sales and related expenses for both companies as well as cash collections and receivables comparisons. Inventory trends relative to sales and the number of days' sales outstanding in inventory were determined for both companies. Expense trends were examined for Adams and Jefferson relative to sales growth and accrual ratios on a balance sheet and cash flow basis were developed as overall measures of earnings quality.  Adams Company    Jefferson Inc.   ($ in thousands) 2006 2007 2008  2006 2007 2008         Gross sales 32,031 34,273 36,330  25,625 27,675 30,900 Sales discounts, returns,\nand allowances 781 836 886  625 675 900 Net sales 31,250 33,438 35,444  25,000 27,000 30,000 Cost of goods sold 15,312 16,384 17,367  12,250 13,250 15,500 SG&A expenses 9,028 9,660 10,240  7,222 7,800 8,200 Depreciation expense 625 669 709  500 515 516 Interest expense 400 428 454  360 366 396 Income before taxes 5,835 6,243 6,618  4,668 5,069 5,388 Taxes (tax rate 40%) 2,334 2,497 2,647  2,000 2,028 2,155 Net income 3,501 3,746 3,971  2,668 3,041 3,233         Dividends 3,000 3,180 3,307  2,460 2,760 2,880 Net addition to retained\nearnings 501 566 664  208 281 353         Balance Sheet        Cash and equivalents 150 160 170  120 130 120 Short-term marketable\nsecurities 250 325 345  200 217 195 Accounts receivable (net) 15,875 16,758 17,763  12,700 13,000 15,892 Inventories 6,500 6,850 7,800  5,200 5,200 4,500 PP&E (net of depreciation) 8,562 8,991 9,440  6,850 7,057 7,200 Total assets 31,337 33,084 35,518  25,070 25,604 27,907         Accounts payable 7,062 7,880 9,300  6,050 6,100 6,398 Other current liabilities 337 400 450  270 373 1,525 Long-term debt 7,500 7,800 8,100  6,000 6,100 6,600 Common stock 15,000 15,000 15,000  12,000 12,000 12,000 Retained earnings 1,438 2,004 2,668  750 1,031 1,384 Total liabilities and\nshareholders equity 31,337 33,084 35,518  25,070 25,604 27,907         % change gross sales  7.0% 6.0%   8.0% 11.7% % change sales discounts\nand allowances  6.0% 6.0%   8.0% 33.3% % change net sales  7.0% 6.0%   8.0% 11.1% % change cost of goods\nsold  7.0% 6.0%   8.0% 17.0% % change in SG&A  6.0% 6.0%   8.0% 5.1% % change in depreciation\nexpense  6.0% 6.0%   3.0% 0.2% % change in accounts\nreceivable  6.0% 6.0%   2.0% 22.3% % change in inventories  5.0% 13.8%   0.0% (13.5%)         Revenues % cash\ncollections 1.03 1.03 1.03  1.0 1.0 1.1 Days inventory\noutstanding 155 153 164  144 143 106 Balance sheet accrual ratio 3.4% 3.5% 3.9%  2.0% 2.4% 10.1% Cash flow accrual ratio 3.4% 3.5% 3.8%  2.0% 2.0% 4.3% The quality of earnings as measured by balance-sheet-based accruals ratios showed:", "opts": ["both companies’ earnings quality improved due to the increase in the ratio with Jefferson showing the most improvement.", "strong improvement in Jefferson’s earnings quality relative to Adams’s due to the sharp jump in the ratio in 2008 compared to the much smaller increase for Adams.", "decrease in Jefferson’s earnings quality relative to Adams’s due to the sharp jump in the ratio in 2008 compared to a much smaller increase for Adams."], "ans": "C", "expl": "The lower the ratio, the higher will be the earnings quality. Jefferson's ratio rose sharply in 2008 compared to the previous years and was substantially above Adams's. Thus, Jefferson's earnings quality is lower.", "explhtml": "<p>The lower the ratio, the higher will be the earnings quality. Jefferson&#x27;s ratio rose sharply in 2008 compared to the previous years and was substantially above Adams&#x27;s. Thus, Jefferson&#x27;s earnings quality is lower.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 11.1, LOS 11.b<\/div><div class=\"qtext\"><p>William Jones, CFA, is analyzing the financial performance of two U.S. competitors in connection with a potential investment recommendation of their common stocks. He is particularly concerned about the quality of each company&#x27;s financial results in 2007– 2008 and in developing projections for 2009 and 2010 fiscal years.<\/p><p>Adams Company has been the largest company in the industry, but Jefferson Inc. has grown more rapidly in recent years. Adams&#x27;s net sales in 2004 were 33-1/3% higher than Jefferson&#x27;s but were only 18% above Jefferson&#x27;s in 2008. During 2008, a slowing U.S. economy led to lower domestic revenue growth for both companies. The 10-k reports showed overall sales growth of 6% for Adams in 2008 compared to 7% for 2007 and 9% in 2006. Jefferson&#x27;s gross sales rose almost 12% in 2008 versus 8% in 2007 and 10% in 2006. In the past three years, Jefferson has expanded its foreign business at a faster pace than Adams. In 2008, Jefferson&#x27;s growth in overseas business was particularly impressive. According to the company&#x27;s 10-k report, Jefferson offered a sales incentive to overseas customers. For those customers accepting the special sales discount, Jefferson shipped products to specific warehouses in foreign ports rather than directly to those customers&#x27; facilities.<\/p><p>In his initial review of Adams&#x27;s and Jefferson&#x27;s financial statements, Jones was concerned about the quality of the growth in Jefferson&#x27;s sales, considerably higher accounts receivables, and the impact of overall accruals on earnings quality. He noted that Jefferson had instituted an accounting change in 2008. The economic life for new plant and equipment investments was determined to be five years longer than for previous investments. For Adams, he noted that the higher level of inventories at the end of 2008 might be cause for concern in light of a further slowdown expected in the U.S. economy in 2009.<\/p><p>The accompanying table shows financial data for both companies&#x27; Form 10-k reports for 2006– 2008 used by Jones for his analysis. To evaluate sales quality, he focused on trends in sales and related expenses for both companies as well as cash collections and receivables comparisons. Inventory trends relative to sales and the number of days&#x27; sales outstanding in inventory were determined for both companies. Expense trends were examined for Adams and Jefferson relative to sales growth and accrual ratios on a balance sheet and cash flow basis were developed as overall measures of earnings quality.<\/p><div class=\"tbl\"><table><tr><td><\/td><td colspan=3>Adams Company<\/td><td><\/td><td colspan=3>Jefferson Inc.<\/td><\/tr><tr><td>($ in thousands)<\/td><td>2006<\/td><td>2007<\/td><td>2008<\/td><td><\/td><td>2006<\/td><td>2007<\/td><td>2008<\/td><\/tr><tr><td>Gross sales<\/td><td>32,031<\/td><td>34,273<\/td><td>36,330<\/td><td><\/td><td>25,625<\/td><td>27,675<\/td><td>30,900<\/td><\/tr><\/table><\/div><div class=\"tbl\"><table><tr><td>Sales discounts, returns,<br>and allowances<\/td><td>781<\/td><td>836<\/td><td>886<\/td><td><\/td><td>625<\/td><td>675<\/td><td>900<\/td><\/tr><tr><td>Net sales<\/td><td>31,250<\/td><td>33,438<\/td><td>35,444<\/td><td><\/td><td>25,000<\/td><td>27,000<\/td><td>30,000<\/td><\/tr><tr><td>Cost of goods sold<\/td><td>15,312<\/td><td>16,384<\/td><td>17,367<\/td><td><\/td><td>12,250<\/td><td>13,250<\/td><td>15,500<\/td><\/tr><tr><td>SG&amp;A expenses<\/td><td>9,028<\/td><td>9,660<\/td><td>10,240<\/td><td><\/td><td>7,222<\/td><td>7,800<\/td><td>8,200<\/td><\/tr><tr><td>Depreciation expense<\/td><td>625<\/td><td>669<\/td><td>709<\/td><td><\/td><td>500<\/td><td>515<\/td><td>516<\/td><\/tr><tr><td>Interest expense<\/td><td>400<\/td><td>428<\/td><td>454<\/td><td><\/td><td>360<\/td><td>366<\/td><td>396<\/td><\/tr><tr><td>Income before taxes<\/td><td>5,835<\/td><td>6,243<\/td><td>6,618<\/td><td><
