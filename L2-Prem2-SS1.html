<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button id="submitBtn" class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>

    <!--subject-breakdown-panel-start-->
    <div id="subjectBreakdown" class="subject-breakdown" aria-live="polite"></div>
    <!--subject-breakdown-panel-end-->
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

azy\" src=\"l2img/prem/m2s1-001.webp\" style=\"max-width:min(100%,285px)\" alt=\"NOI for last 12 months $180 Cash and equivalents $24 Land held for future $90 development Total debt and other $130 liabilities Shares outstanding 220\"><p>Finally, Phonix asks Goat to calculate the adjusted funds from operations (AFFO) for LIVA, an industrial REIT, using the financial data in Exhibit 2 (all amounts are in millions).<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-002.webp\" style=\"max-width:min(100%,445px)\" alt=\"Net income $400.0 Depreciation and amortization $190.0 Losses from sale of depreciable real estate $62.5 Non-cash (straight-line) rent adjustment $52.5\"><p>Recurring maintenance-type capital expenditures and leasing $140.0 commissions<\/p><\/div><\/details><div class=\"qtext\"><p>The demand for industrial real estate would be least impacted by:<\/p><\/div>", "subj": "alternatives"}, {"n": 2, "q": "Which real estate investment type best meets Cruyff's criteria?", "opts": ["REIT", "REOC", "Direct investment in real estate"], "ans": "B", "expl": "B is correct. because Cryuff's criteria is liquidity and maximum potential for growth opportunities. With a liquidity objective, REOC and REIT investments are most appropriate because REOCs and REITs are traded on stock exchanges and are more liquid. Direct investments in income-producing property are generally less liquid. With a potential for maximum growth opportunities objective, REOCs and direct property investment are most appropriate because REOCs and direct investors are free to invest in any kind of real estate or related activity without limitation and to reinvest as much of their income as they believe is appropriate for their objectives. This freedom gives them the opportunity to create more value in development activity and in trading real estate. REITs' constraints prevent them from retaining earnings to reinvest, so their growth opportunities are more limited. Since both the primary criteria are best met by REOCs, they are the most suitable investment type.", "explhtml": "<p><b>B is correct.<\/b> because Cryuff's criteria is liquidity and maximum potential for growth<\/p><p>opportunities. With a liquidity objective, REOC and REIT investments are most appropriate because REOCs and REITs are traded on stock exchanges and are more liquid. Direct investments in income-producing property are generally less liquid. With a potential for maximum growth opportunities objective, REOCs and direct property investment are most appropriate because REOCs and direct investors are free to invest in any kind of real estate or related activity without limitation and to reinvest as much of their income as they believe is appropriate for their objectives. This freedom gives them the opportunity to create more value in development activity and in trading real estate. REITs' constraints prevent them from retaining earnings to reinvest, so their growth opportunities are more limited. Since both the primary criteria are best met by REOCs, they are the most suitable investment type.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Alternative Investments · Leo Goat<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Leo Goat is an investment consultant specializing in real estate investments. Goat is meeting with two of his institutional clients: Cryuff Trust and Phonix Investments. Cryuff Trust Cruyff wants to invest in industrial real estate. Goat analyzes how the following economic drivers impact the demand for industrial real estate. Driver A: Retail sales growth Driver B: Household formations Driver C: Changing supply routes For an income-producing industrial property, Cruyff is choosing among the following investment types: REITs, real estate operating companies (REOCS), direct investment in real estate. Cruyff's criteria when deciding which investment type to use are liquidity and maximum potential for growth opportunities. Phonix Investments Phonix is interested in investing in Bando Office REIT. To value Bando, Goat assumes an annual net operating income (NOI) growth rate of 2% and a capitalization rate of 6%. He calculates Bando's expected NAV per share using the financial data in Exhibit 1 (all amounts are in millions):<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-001.webp\" style=\"max-width:min(100%,285px)\" alt=\"NOI for last 12 months $180 Cash and equivalents $24 Land held for future $90 development Total debt and other $130 liabilities Shares outstanding 220\"><p>Finally, Phonix asks Goat to calculate the adjusted funds from operations (AFFO) for LIVA, an industrial REIT, using the financial data in Exhibit 2 (all amounts are in millions).<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-002.webp\" style=\"max-width:min(100%,445px)\" alt=\"Net income $400.0 Depreciation and amortization $190.0 Losses from sale of depreciable real estate $62.5 Non-cash (straight-line) rent adjustment $52.5\"><p>Recurring maintenance-type capital expenditures and leasing $140.0 commissions<\/p><\/div><\/details><div class=\"qtext\"><p>Which real estate investment type best meets Cruyff's criteria?<\/p><\/div>", "subj": "alternatives"}, {"n": 3, "q": "Bando Office REIT's expected NAV per share is closest to:", "opts": ["$13.32.", "$13.84.", "$14.43."], "ans": "B", "expl": "B is correct. based on the calculations below:", "explhtml": "<p><b>B is correct.<\/b> based on the calculations below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1a-016.webp\" style=\"max-width:min(100%,525px)\" alt=\"Net operating income (NOI) for last 12 months 180.0 A: Estimated next 12 months NOI = NOI * (1+growth rate) 183.6 B: Estimated value of operating real estate = A/Cap rate 3,060.0 ADD: Cash and equivalents 24.0 ADD: Land held for future developm e demand for industrial real estate. Driver A: Retail sales growth Driver B: Household formations Driver C: Changing supply routes For an income-producing industrial property, Cruyff is choosing among the following investment types: REITs, real estate operating companies (REOCS), direct investment in real estate. Cruyff's criteria when deciding which investment type to use are liquidity and maximum potential for growth opportunities. Phonix Investments Phonix is interested in investing in Bando Office REIT. To value Bando, Goat assumes an annual net operating income (NOI) growth rate of 2% and a capitalization rate of 6%. He calculates Bando's expected NAV per share using the financial data in Exhibit 1 (all amounts are in millions):<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-001.webp\" style=\"max-width:min(100%,285px)\" alt=\"NOI for last 12 months $180 Cash and equivalents $24 Land held for future $90 development Total debt and other $130 liabilities Shares outstanding 220\"><p>Finally, Phonix asks Goat to calculate the adjusted funds from operations (AFFO) for LIVA, an industrial REIT, using the financial data in Exhibit 2 (all amounts are in millions).<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-002.webp\" style=\"max-width:min(100%,445px)\" alt=\"Net income $400.0 Depreciation and amortization $190.0 Losses from sale of depreciable real estate $62.5 Non-cash (straight-line) rent adjustment $52.5\"><p>Recurring maintenance-type capital expenditures and leasing $140.0 commissions<\/p><\/div><\/details><div class=\"qtext\"><p>The AFFO (in millions) for the LIVA REIT is:<\/p><\/div>", "subj": "alternatives"}, {"n": 5, "q": "The predicted value of RET for the next month is closest to:", "opts": ["1.49%.", "1.61%.", "2.72%."], "ans": "C", "expl": "C is correct. because vViovl leluose RET = 60 + bIMKR + b2VME + b3VIX = -0.768 + 1.242(0.012) + 0.031(25.130) + 0.034(0.036) = 0.027158 • 2.72%.", "explhtml": "<p><b>C is correct.<\/b> because<\/p><p>vViovl leluose RET = 60 + bIMKR + b2VME + b3VIX = -0.768 + 1.242(0.012) + 0.031(25.130) + 0.034(0.036) = 0.027158 • 2.72%.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Quantitative Methods · Rick Mave<\/summary><div class=\"vig-body\"><p>Rick Mave is an analyst at a portfolio management firm. He has constructed a linear regression model to explain the monthly returns for a specific portfolio. Returns and percentage changes are in decimal form (i.e., 1% is represented as 0.01). The regression equation is expressed as:<\/p><p>where RETt= the portfolio return, MKRT= the market return, VMEt= the natural log of the trading volume on a large equity market index, VIXt= the percentage change in a volatility index, and E, = the error term. The output of the regression analysis is shown in Exhibit 1.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-003.webp\" style=\"max-width:min(100%,286px)\" alt=\"Coefficient t-Statistic Intercept -0.768 -1.853 MKR 1.242 11.658 VME 0.031 1.857\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-004.webp\" style=\"max-width:min(100%,279px)\" alt=\"VIX 0.034 2.033\"><p>Mave uses the model to predict the portfolio return for the next month, based on the following forecast values: MKR = 0.012, VME = 25.130, and VIX = 0.036. To check for model misspecification, Mave carries out several tests. To test for conditional heteroskedasticity, Mave performs the regression for the Breusch-Pagan test. The results are shown in Exhibit 2. For a chi-square distribution with three degrees of freedom, the critical values at the 1% and 5% significance levels are 11.345 and 7.815, respectively.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-005.webp\" style=\"max-width:min(100%,218px)\" alt=\"Multiple R 0.488 R-squared 0.238\"><p>Adjusted R-squared 0.167 Observations 36 To test for multicollinearity, Mave computes the variance inflation factors (VIFs) for MKR, VME, and VIX as 1.044, 1.007, and 1.634, respectively. To gain additional insight into the portfolio's investments, Mave uses an unsupervised machine-learning technique to classify the stocks in the investment universe into five groups, each with similar characteristics. He does this using a dataset that consists of various financial and valuation parameters. He assumes that the data do not have non- linear characteristics.<\/p><\/div><\/details><div class=\"qtext\"><p>The predicted value of RET for the next month is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 6, "q": "Based on the results of the Breusch-Pagan test, Mave should:", "opts": ["reject the null hypothesis of no conditional heteroskedasticity at both the 5% and 1% significance levels. and1cinnificanno loudle", "reject the null hypothesis of no conditional heteroskedasticity at the 5% significance level but not at the 1% significance level.", "not reject the null hypothesis of no conditional heteroskedasticity at either the 5% or 1% significance levels."], "ans": "C", "expl": "C is correct. because the BP test statistic is approximately chi-square distributed with k degrees of freedom, where k is the number of independent variables: x2= nR2 = 36(0.238) = 8.568, and - at the 5% significance level, the critical value is 7.815, which is less than the calculated test statistic of 8.568, so the null hypothesis should be rejected; but - at the 1% significance level, the critical value is 11.345, which is greater than the calculated test statistic of 8.568, so the null hypothesis should not be rejected.", "explhtml": "<p><b>C is correct.<\/b> because the BP test statistic is approximately chi-square distributed<\/p><p>with k degrees of freedom, where k is the number of independent variables: x2= nR2 = 36(0.238) = 8.568, and - at the 5% significance level, the critical value is 7.815, which is less than the calculated test statistic of 8.568, so the null hypothesis should be rejected; but - at the 1% significance level, the critical value is 11.345, which is greater than the calculated test statistic of 8.568, so the null hypothesis should not be rejected.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1a-018.webp\" style=\"max-width:min(100%,521px)\" alt=\"6.012 7.815 8.568 11.345 17.568 Test statistic n x Adjusted R2 nR? - n x Multiple R (incorrect) (correct) (Incorrect) 5% significance Do not reject Critical value Reject null Reject null Reject null level null 1% significance Do not reject Do not reject Do not reject Critical Reject null level null null null value\">", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Quantitative Methods · Rick Mave<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rick Mave is an analyst at a portfolio management firm. He has constructed a linear regression model to explain the monthly returns for a specific portfolio. Returns and percentage changes are in decimal form (i.e., 1% is represented as 0.01). The regression equation is expressed as:<\/p><p>where RETt= the portfolio return, MKRT= the market return, VMEt= the natural log of the trading volume on a large equity market index, VIXt= the percentage change in a volatility index, and E, = the error term. The output of the regression analysis is shown in Exhibit 1.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-003.webp\" style=\"max-width:min(100%,286px)\" alt=\"Coefficient t-Statistic Intercept -0.768 -1.853 MKR 1.242 11.658 VME 0.031 1.857\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-004.webp\" style=\"max-width:min(100%,279px)\" alt=\"VIX 0.034 2.033\"><p>Mave uses the model to predict the portfolio return for the next month, based on the following forecast values: MKR = 0.012, VME = 25.130, and VIX = 0.036. To check for model misspecification, Mave carries out several tests. To test for conditional heteroskedasticity, Mave performs the regression for the Breusch-Pagan test. The results are shown in Exhibit 2. For a chi-square distribution with three degrees of freedom, the critical values at the 1% and 5% significance levels are 11.345 and 7.815, respectively.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-005.webp\" style=\"max-width:min(100%,218px)\" alt=\"Multiple R 0.488 R-squared 0.238\"><p>Adjusted R-squared 0.167 Observations 36 To test for multicollinearity, Mave computes the variance inflation factors (VIFs) for MKR, VME, and VIX as 1.044, 1.007, and 1.634, respectively. To gain additional insight into the portfolio's investments, Mave uses an unsupervised machine-learning technique to classify the stocks in the investment universe into five groups, each with similar characteristics. He does this using a dataset that consists of various financial and valuation parameters. He assumes that the data do not have non- linear characteristics.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the results of the Breusch-Pagan test, Mave should:<\/p><\/div>", "subj": "quant"}, {"n": 7, "q": "Based on the variance inflation factors for each of the independent variables, Mave should conclude that:", "opts": ["there is no evidence of multicollinearity.", "further investigation of certain independent variables is required.", "there is evidence of serious multicollinearity that requires correction."], "ans": "A", "expl": "A is correct. because each of the VIFj is less than 5 and is close to 1. For a given independent variable, Xj. the minimum VIFj is 1, which occurs when Rj2 is O, so when there is no correlation between Xj and the remaining independent variables. VIF increases as the correlation increases; the higher the VIF, the more likely a given independent variable can be accurately predicted from the remaining independent variables, making it increasingly redundant. The following are useful rules of thumb: VIFj › 5 warrants further investigation of the given independent variable. VIFj >10 indicates serious multicollinearity requiring correction.", "explhtml": "<p><b>A is correct.<\/b> because each of the VIFj is less than 5 and is close to 1. For a given<\/p><p>independent variable, Xj. the minimum VIFj is 1, which occurs when Rj2 is O, so when there is no correlation between Xj and the remaining independent variables. VIF increases as the correlation increases; the higher the VIF, the more likely a given independent variable can be accurately predicted from the remaining independent variables, making it increasingly redundant. The following are useful rules of thumb: VIFj › 5 warrants further investigation of the given independent variable. VIFj &gt;10 indicates serious multicollinearity requiring correction.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Quantitative Methods · Rick Mave<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rick Mave is an analyst at a portfolio management firm. He has constructed a linear regression model to explain the monthly returns for a specific portfolio. Returns and percentage changes are in decimal form (i.e., 1% is represented as 0.01). The regression equation is expressed as:<\/p><p>where RETt= the portfolio return, MKRT= the market return, VMEt= the natural log of the trading volume on a large equity market index, VIXt= the percentage change in a volatility index, and E, = the error term. The output of the regression analysis is shown in Exhibit 1.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-003.webp\" style=\"max-width:min(100%,286px)\" alt=\"Coefficient t-Statistic Intercept -0.768 -1.853 MKR 1.242 11.658 VME 0.031 1.857\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-004.webp\" style=\"max-width:min(100%,279px)\" alt=\"VIX 0.034 2.033\"><p>Mave uses the model to predict the portfolio return for the next month, based on the following forecast values: MKR = 0.012, VME = 25.130, and VIX = 0.036. To check for model misspecification, Mave carries out several tests. To test for conditional heteroskedasticity, Mave performs the regression for the Breusch-Pagan test. The results are shown in Exhibit 2. For a chi-square distribution with three degrees of freedom, the critical values at the 1% and 5% significance levels are 11.345 and 7.815, respectively.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-005.webp\" style=\"max-width:min(100%,218px)\" alt=\"Multiple R 0.488 R-squared 0.238\"><p>Adjusted R-squared 0.167 Observations 36 To test for multicollinearity, Mave computes the variance inflation factors (VIFs) for MKR, VME, and VIX as 1.044, 1.007, and 1.634, respectively. To gain additional insight into the portfolio's investments, Mave uses an unsupervised machine-learning technique to classify the stocks in the investment universe into five groups, each with similar characteristics. He does this using a dataset that consists of various financial and valuation parameters. He assumes that the data do not have non- linear characteristics.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the variance inflation factors for each of the independent variables, Mave<\/p><p>should conclude that:<\/p><\/div>", "subj": "quant"}, {"n": 8, "q": "Which of the following machine-learning techniques would best meet Mave's objective for grouping stocks?", "opts": ["K-means clustering", "Hierarchical clustering", "Classification and regression tree"], "ans": "A", "expl": "A is correct. because K-means is an algorithm that repeatedly partitions observations into a fixed number, k, of non-overlapping clusters. The number of clusters, k, is a model hyperparameter. Note that clustering is another type of unsupervised machine learning, which is used to organize data points into similar groups called clusters. A cluster contains a subset of observations from the dataset such that all the observations within the same cluster are deemed 'similar.' K-means is an appropriate algorithm in a situation where the objective is classification (as opposed to prediction), with a known number of categories and where the data does not have complex non-linear characteristics. This is consistent with Mave's objective (classification into groups, 5 categories, data assumed not non-linear).", "explhtml": "<p><b>A is correct.<\/b> because K-means is an algorithm that repeatedly partitions<\/p><p>observations into a fixed number, k, of non-overlapping clusters. The number of clusters, k, is a model hyperparameter. Note that clustering is another type of unsupervised machine learning, which is used to organize data points into similar groups called clusters. A cluster contains a subset of observations from the dataset such that all the observations within the same cluster are deemed 'similar.' K-means is an appropriate algorithm in a situation where the objective is classification (as opposed to prediction), with a known number of categories and where the data does not have complex non-linear characteristics. This is consistent with Mave's objective (classification into groups, 5 categories, data assumed not non-linear).<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Quantitative Methods · Rick Mave<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rick Mave is an analyst at a portfolio management firm. He has constructed a linear regression model to explain the monthly returns for a specific portfolio. Returns and percentage changes are in decimal form (i.e., 1% is represented as 0.01). The regression equation is expressed as:<\/p><p>where RETt= the portfolio return, MKRT= the market return, VMEt= the natural log of the trading volume on a large equity market index, VIXt= the percentage change in a volatility index, and E, = the error term. The output of the regression analysis is shown in Exhibit 1.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-003.webp\" style=\"max-width:min(100%,286px)\" alt=\"Coefficient t-Statistic Intercept -0.768 -1.853 MKR 1.242 11.658 VME 0.031 1.857\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-004.webp\" style=\"max-width:min(100%,279px)\" alt=\"VIX 0.034 2.033\"><p>Mave uses the model to predict the portfolio return for the next month, based on the following forecast values: MKR = 0.012, VME = 25.130, and VIX = 0.036. To check for model misspecification, Mave carries out several tests. To test for conditional heteroskedasticity, Mave performs the regression for the Breusch-Pagan test. The results are shown in Exhibit 2. For a chi-square distribution with three degrees of freedom, the critical values at the 1% and 5% significance levels are 11.345 and 7.815, respectively.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-005.webp\" style=\"max-width:min(100%,218px)\" alt=\"Multiple R 0.488 R-squared 0.238\"><p>Adjusted R-squared 0.167 Observations 36 To test for multicollinearity, Mave computes the variance inflation factors (VIFs) for MKR, VME, and VIX as 1.044, 1.007, and 1.634, respectively. To gain additional insight into the portfolio's investments, Mave uses an unsupervised machine-learning technique to classify the stocks in the investment universe into five groups, each with similar characteristics. He does this using a dataset that consists of various financial and valuation parameters. He assumes that the data do not have non- linear characteristics.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following machine-learning techniques would best meet Mave's<\/p><p>objective for grouping stocks?<\/p><\/div>", "subj": "quant"}, {"n": 9, "q": "By accepting the room upgrade and the meals and entertainment at the AIF conference, does Bali comply with the Standards?", "opts": ["Yes", "No, with regard to the room upgrade", "No, with regard to the meals and entertainment"], "ans": "A", "expl": "A is correct. because according to the Standards, Bali does not compromise his Independence and Objectivity (Standard I(B)) by accepting the modest room upgrade, or the meals and entertainment. Aldebaran, Bali's employer, rather than the conference sponsors, paid for the hotel room - the sponsors merely placed him on a higher floor. Also, the Standards do not consider meals and entertainment to create a conflict of interest. Members and Candidates must use reasonable care and judgment to achieve and maintain independence and objectivity in their professional activities. Members and Candidates must not offer, solicit, or accept any gift, benefit, compensation, or consideration that reasonably could be expected to compromise their own or another's independence and objectivity. Also, Standard I(B) does not preclude customary, ordinary business-related entertainment as long as its purpose is not to influence or reward members or candidates and the room upgrade and entertainment received were not things that reasonably could be expected to compromise their own or another's independence and objectivity.", "explhtml": "<p><b>A is correct.<\/b> because according to the Standards, Bali does not compromise his<\/p><p>Independence and Objectivity (Standard I(B)) by accepting the modest room upgrade, or the meals and entertainment. Aldebaran, Bali's employer, rather than the conference sponsors, paid for the hotel room - the sponsors merely placed him on a higher floor. Also, the Standards do not consider meals and entertainment to create a conflict of interest. Members and Candidates must use reasonable care and judgment to achieve and maintain independence and objectivity in their professional activities. Members and Candidates must not offer, solicit, or accept any gift, benefit, compensation, or consideration that reasonably could be expected to compromise their own or another's independence and objectivity. Also, Standard I(B) does not preclude customary, ordinary business-related entertainment as long as its purpose is not to influence or reward members or candidates and the room upgrade and entertainment received were not things that reasonably could be expected to compromise their own or another's independence and objectivity.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Ethics · Atul Bali<\/summary><div class=\"vig-body\"><p>Atul Bali, CFA, is an analyst at Aldebaran Partners, a broker-dealer, covering the airline industry. Bali plans to attend the Airline Industry Forum (AIF), an investor conference. For travel and lodging at the conference, Aldebaran pays for Bali's economy-class air ticket and for a standard hotel room. The conference sponsor, the Association of Airline Companies (AAC), offers Bali an upgrade to a similar-sized room on a higher floor that has a better view. AAC also offers to pay for all of Bali's meals and his attendance at planned entertainment events during the three days of the conference. Bali accepts the room upgrade and the paid meals and entertainment. To identify potential company failures, Aldebaran relies upon a research firm that uses quantitative models to forecast bankruptcy. Aldebaran conducts regular reviews on the firm to verify their research is sound. Bali notes that the quantitative model predicts that one of the airline operators presenting at the AIF will be bankrupt within a year. Bali identifies that some of the data used in the model are outdated. The research firm promises Bali an updated prediction within a week using new data. Bali wants to write his report on the distressed airline as soon as possible and conducts his own research using the limited data available to him. Bali's research leads him to believe the airline will not go bankrupt and he decides whether to issue a report with a \"Buy\" recommendation. During their personal time, Bali and his supervisor develop a portfolio optimization model. They back-test the model and use it to optimize their personal portfolios. They haud hoon dlorcod with tho noculto and dorido to manotizo thoin madol Aocandinsly have been pleased with the results and decide to monetize their model. Accordingly. they take the model to Aldebaran's director of research, who reviews its technical parameters, but informs them that these types of models do not meet Aldebaran's needs. Bali and his supervisor then demonstrate the model for a firm managing pension assets. The asset manager makes a monetary offer to purchase the model. Both Bali and his supervisor accept the offer and disclose it to Aldebaran. Bali learns that Client A wants to make a substantial charitable donation. He knows from communicating with Client B, a charitable endowment, that it is raising funds to build housing for victims of a recent natural disaster. Client A asks Bali if he is aware of a suitable charity in need of funds and, if so, requests an introduction to such a charity. Bali emails Client B's contact information to Client A.<\/p><\/div><\/details><div class=\"qtext\"><p>By accepting the room upgrade and the meals and entertainment at the AIF<\/p><p>conference, does Bali comply with the Standards?<\/p><\/div>", "subj": "ethics"}, {"n": 10, "q": "Regarding his report on the distressed airline, which of the following is Bali's best course of action to comply with the Standards?", "opts": ["Publish his report based only on his own research", "Publish his report after the updated prediction from the research firm is received", "Refrain from publishing his report because of the conflicting results regarding possible bankruptcy"], "ans": "B", "expl": "B is correct. because to be in compliance with Standard V(A) Diligence nned entertainment events during the three days of the conference. Bali accepts the room upgrade and the paid meals and entertainment. To identify potential company failures, Aldebaran relies upon a research firm that uses quantitative models to forecast bankruptcy. Aldebaran conducts regular reviews on the firm to verify their research is sound. Bali notes that the quantitative model predicts that one of the airline operators presenting at the AIF will be bankrupt within a year. Bali identifies that some of the data used in the model are outdated. The research firm promises Bali an updated prediction within a week using new data. Bali wants to write his report on the distressed airline as soon as possible and conducts his own research using the limited data available to him. Bali's research leads him to believe the airline will not go bankrupt and he decides whether to issue a report with a \"Buy\" recommendation. During their personal time, Bali and his supervisor develop a portfolio optimization model. They back-test the model and use it to optimize their personal portfolios. They haud hoon dlorcod with tho noculto and dorido to manotizo thoin madol Aocandinsly have been pleased with the results and decide to monetize their model. Accordingly. they take the model to Aldebaran's director of research, who reviews its technical parameters, but informs them that these types of models do not meet Aldebaran's needs. Bali and his supervisor then demonstrate the model for a firm managing pension assets. The asset manager makes a monetary offer to purchase the model. Both Bali and his supervisor accept the offer and disclose it to Aldebaran. Bali learns that Client A wants to make a substantial charitable donation. He knows from communicating with Client B, a charitable endowment, that it is raising funds to build housing for victims of a recent natural disaster. Client A asks Bali if he is aware of a suitable charity in need of funds and, if so, requests an introduction to such a charity. Bali emails Client B's contact information to Client A.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding his report on the distressed airline, which of the following is<\/p><p>Bali's best course of action to comply with the Standards?<\/p><\/div>", "subj": "ethics"}, {"n": 11, "q": "With regard to the development and sale of the portfolio optimization model, have either Bali or his supervisor violated the Standards?", "opts": ["No", "Yes, only the supervisor has violated the Standards", "Yes, both Bali and the supervisor have violated the Standards"], "ans": "A", "expl": "A is correct. because there is no violation of either Standard IV(A) Loyalty to Employer, or IV(C) Responsibility of Supervisors. Although Standard IV(A) does not preclude members or candidates from entering into an independent business while still employed, members and candidates who plan to engage in independent practice for compensation must notify their employer and describe the types of services they will render to prospective independent clients, the expected duration of the services, and the compensation for the services. In the situation of Bali and the supervisor, the model was developed during their personal time by Bali and the supervisor and tested only on their personal portfolios. The director of research is aware of their model, so they have informed their employer of its existence. Further, they offered the model to their employer first, but were turned down. Also, when they did sell the model to the asset manager, they informed their AшHalhA mAatalns dasl manasan 4hosinfanmad thcin employer of the sale.", "explhtml": "<p><b>A is correct.<\/b> because there is no violation of either Standard IV(A) Loyalty to<\/p><p>Employer, or IV(C) Responsibility of Supervisors. Although Standard IV(A) does not preclude members or candidates from entering into an independent business while still employed, members and candidates who plan to engage in independent practice for compensation must notify their employer and describe the types of services they will render to prospective independent clients, the expected duration of the services, and the compensation for the services. In the situation of Bali and the supervisor, the model was developed during their personal time by Bali and the supervisor and tested only on their personal portfolios. The director of research is aware of their model, so they have informed their employer of its existence. Further, they offered the model to their employer first, but were turned down. Also, when they did sell the model to the asset manager, they informed their AшHalhA mAatalns dasl manasan 4hosinfanmad thcin<\/p><p>employer of the sale.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Ethics · Atul Bali<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Atul Bali, CFA, is an analyst at Aldebaran Partners, a broker-dealer, covering the airline industry. Bali plans to attend the Airline Industry Forum (AIF), an investor conference. For travel and lodging at the conference, Aldebaran pays for Bali's economy-class air ticket and for a standard hotel room. The conference sponsor, the Association of Airline Companies (AAC), offers Bali an upgrade to a similar-sized room on a higher floor that has a better view. AAC also offers to pay for all of Bali's meals and his attendance at planned entertainment events during the three days of the conference. Bali accepts the room upgrade and the paid meals and entertainment. To identify potential company failures, Aldebaran relies upon a research firm that uses quantitative models to forecast bankruptcy. Aldebaran conducts regular reviews on the firm to verify their research is sound. Bali notes that the quantitative model predicts that one of the airline operators presenting at the AIF will be bankrupt within a year. Bali identifies that some of the data used in the model are outdated. The research firm promises Bali an updated prediction within a week using new data. Bali wants to write his report on the distressed airline as soon as possible and conducts his own research using the limited data available to him. Bali's research leads him to believe the airline will not go bankrupt and he decides whether to issue a report with a \"Buy\" recommendation. During their personal time, Bali and his supervisor develop a portfolio optimization model. They back-test the model and use it to optimize their personal portfolios. They haud hoon dlorcod with tho noculto and dorido to manotizo thoin madol Aocandinsly have been pleased with the results and decide to monetize their model. Accordingly. they take the model to Aldebaran's director of research, who reviews its technical parameters, but informs them that these types of models do not meet Aldebaran's needs. Bali and his supervisor then demonstrate the model for a firm managing pension assets. The asset manager makes a monetary offer to purchase the model. Both Bali and his supervisor accept the offer and disclose it to Aldebaran. Bali learns that Client A wants to make a substantial charitable donation. He knows from communicating with Client B, a charitable endowment, that it is raising funds to build housing for victims of a recent natural disaster. Client A asks Bali if he is aware of a suitable charity in need of funds and, if so, requests an introduction to such a charity. Bali emails Client B's contact information to Client A.<\/p><\/div><\/details><div class=\"qtext\"><p>With regard to the development and sale of the portfolio optimization model, have<\/p><p>either Bali or his supervisor violated the Standards?<\/p><\/div>", "subj": "ethics"}, {"n": 12, "q": "By emailing Client A, Bali violated the Standard related to preservation of confidentiality for:", "opts": ["Client A only.", "Client B only.", "both Client A and Client B."], "ans": "B", "expl": "B is correct. because Bali did not obtain the permission of Client B before he made the introduction to Client A. In making the introduction, he revealed the identity of Client B to Client A, violating Standard III(E) preservation of confidentiality. This standard protects the confidentiality of client information even if the person or entity is no longer a client of the member or candidate. Therefore, members and candidates must continue to maintain the confidentiality of client records even after the client relationship has ended. If a client or former client expressly authorizes the member or candidate to disclose information, however, the member or candidate may follow the terms of the authorization and provide the information.", "explhtml": "<p><b>B is correct.<\/b> because Bali did not obtain the permission of Client B before he made<\/p><p>the introduction to Client A. In making the introduction, he revealed the identity of Client B to Client A, violating Standard III(E) preservation of confidentiality. This standard protects the confidentiality of client information even if the person or entity is no longer a client of the member or candidate. Therefore, members and candidates must continue to maintain the confidentiality of client records even after the client relationship has ended. If a client or former client expressly authorizes the member or candidate to disclose information, however, the member or candidate may follow the terms of the authorization and provide the information.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Ethics · Atul Bali<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Atul Bali, CFA, is an analyst at Aldebaran Partners, a broker-dealer, covering the airline industry. Bali plans to attend the Airline Industry Forum (AIF), an investor conference. For travel and lodging at the conference, Aldebaran pays for Bali's economy-class air ticket and for a standard hotel room. The conference sponsor, the Association of Airline Companies (AAC), offers Bali an upgrade to a similar-sized room on a higher floor that has a better view. AAC also offers to pay for all of Bali's meals and his attendance at planned entertainment events during the three days of the conference. Bali accepts the room upgrade and the paid meals and entertainment. To identify potential company failures, Aldebaran relies upon a research firm that uses quantitative models to forecast bankruptcy. Aldebaran conducts regular reviews on the firm to verify their research is sound. Bali notes that the quantitative model predicts that one of the airline operators presenting at the AIF will be bankrupt within a year. Bali identifies that some of the data used in the model are outdated. The research firm promises Bali an updated prediction within a week using new data. Bali wants to write his report on the distressed airline as soon as possible and conducts his own research using the limited data available to him. Bali's research leads him to believe the airline will not go bankrupt and he decides whether to issue a report with a \"Buy\" recommendation. During their personal time, Bali and his supervisor develop a portfolio optimization model. They back-test the model and use it to optimize their personal portfolios. They haud hoon dlorcod with tho noculto and dorido to manotizo thoin madol Aocandinsly have been pleased with the results and decide to monetize their model. Accordingly. they take the model to Aldebaran's director of research, who reviews its technical parameters, but informs them that these types of models do not meet Aldebaran's needs. Bali and his supervisor then demonstrate the model for a firm managing pension assets. The asset manager makes a monetary offer to purchase the model. Both Bali and his supervisor accept the offer and disclose it to Aldebaran. Bali learns that Client A wants to make a substantial charitable donation. He knows from communicating with Client B, a charitable endowment, that it is raising funds to build housing for victims of a recent natural disaster. Client A asks Bali if he is aware of a suitable charity in need of funds and, if so, requests an introduction to such a charity. Bali emails Client B's contact information to Client A.<\/p><\/div><\/details><div class=\"qtext\"><p>By emailing Client A, Bali violated the Standard related to preservation of<\/p><p>confidentiality for:<\/p><\/div>", "subj": "ethics"}, {"n": 13, "q": "The distinctive risk discussed by Ali will most likely be reduced when:", "opts": ["deposits are insured up to a stated limit.", "assets are made up primarily of mark-to-market assets.", "liabilities are made up primarily of deposits with maturity less than a year."], "ans": "A", "expl": "A is correct. because government insurance on deposits reduces the expectation that a bank might not honor its deposits. The distinctive risk of failure Ali discusses is a bank run when a bank fails to honor its liabilities. Since the liabilities of most banks are made up primarily of deposits, government insurance on deposits will reduce the risk of a bank run. Even the expectation that a bank might not be able to honor its deposits could cause depositors to withdraw their money from the bank, and a large sudden withdrawal of deposits (a bank run) could cause an actual failure and financial contagion across the economy. Therefore, deposits are often insured (up to a stated limit) by the government of the country in which the bank operates.", "explhtml": "<p><b>A is correct.<\/b> because government insurance on deposits reduces the expectation<\/p><p>that a bank might not honor its deposits. The distinctive risk of failure Ali discusses is a bank run when a bank fails to honor its liabilities. Since the liabilities of most banks are made up primarily of deposits, government insurance on deposits will reduce the risk of a bank run. Even the expectation that a bank might not be able to honor its deposits could cause depositors to withdraw their money from the bank, and a large sudden withdrawal of deposits (a bank run) could cause an actual failure and financial contagion across the economy. Therefore, deposits are often insured (up to a stated limit) by the government of the country in which the bank operates.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Financial Statement Analysis · Imran Ali<\/summary><div class=\"vig-body\"><p>Imran Ali is a research analyst at Winter River Funds covering financial institutions. He prepares a short presentation of his research for an introductory client meeting. Ali begins the meeting by discussing the characteristics of a bank. He notes the distinctive risk of failure when a bank fails to honor its liabilities and the contagion this can cause to the economy. Ali explains that due to the potential contagion effect on the rest of the economy. financial institutions are subject to heavy regulation. He mentions that one outcome of the Basel III framework is that banks are precluded from assuming too much financial leverage. As a result, banks are better able to withstand asset write-downs. Ali uses several indicators to determine the riskiness of a bank. In Exhibit 1, he prepares a sample of these indicators from three banks, Rose, Orchid, and Begonia, whose stocks are held by Winter River.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-006.webp\" style=\"max-width:min(100%,472px)\" alt=\"Rose Orchid Begonia Total high quality liquid assets ($ billion) 727 548 718 Stressed 30-day net cash outflow ($ billion) 518 400 495\"><p>Ali then analyzes insurance companies with the primary source of profit from underwriting operations. Using the performance indicators in Exhibit 2, Ali compares Company A to its competitors, Company B and Company C.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src d the highly liquid assets (the numerator) include only those that are easily convertible into cash. The standards set a target minimum of 100%. Begonia is the highest among the three banks featured in Exhibit 1.", "explhtml": "<p><b>C is correct.<\/b> because Begonia has the highest Liquidity Coverage Ratio (LCR).<\/p><p>Begonia's ratio is 1.45 or 145% of the cash needs. This is higher than the other DAII…::1Aг_<\/p><p>entities. The LCR is expressed as the minimum percentage of a bank's expected cash outflows that must be held in highly liquid assets. For this ratio, the expected cash outflows (the denominator) are the bank's anticipated one-month liquidity needs in a stress scenario, and the highly liquid assets (the numerator) include only those that are easily convertible into cash. The standards set a target minimum of 100%. Begonia is the highest among the three banks featured in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1a-019.webp\" style=\"max-width:min(100%,539px)\" alt=\"Rose Orchid Begonia Total high quality liquid assets ($ billions) 727 548 718 Total net cash outflow 30 days (S billions) 518 400 495 |Liquidity Coverage Ratio (liquid assets / cash outfiow) 1.40 1.37 1.45\">", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Financial Statement Analysis · Imran Ali<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Imran Ali is a research analyst at Winter River Funds covering financial institutions. He prepares a short presentation of his research for an introductory client meeting. Ali begins the meeting by discussing the characteristics of a bank. He notes the distinctive risk of failure when a bank fails to honor its liabilities and the contagion this can cause to the economy. Ali explains that due to the potential contagion effect on the rest of the economy. financial institutions are subject to heavy regulation. He mentions that one o
