000 x (1.4% - 8%) = -1,320,000. As Tan receives the fixed rate and pays the equity return she will pay USD 1,320,000.", "explhtml": "<p><b>A is correct.<\/b> because the cash flows on the two legs of the equity swap<\/p><p>are calculated as follows: Equity leg: Si = NAE x RE Fixed-interest rate leg: FS = NAE × APFIX x rFIX Where: NAE = notional amount DE - noniodia notumn of tha canit, RE = periodic return of the equity APFIX = accrual period rFIX = fixed rate The net cash flow (fixed minus equity) is therefore: FS - Si = NAE × (rFIX- RE) RE = (21,600,000 / 20,000,000) - 1 = 8%. Therefore: NAE × (rFIX - RE) = 20,000,000 x (1.4% - 8%) = -1,320,000. As Tan receives the fixed rate and pays the equity return she will pay USD 1,320,000.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Derivatives · Sharon Tan<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sharon Tan is a sophisticated investor who lives in Singapore and has both domestic and international investments. Equity Forward Tan has a significant long position in a non-dividend-paying stock (Stock A) that she must continue to hold. To hedge the downside risk, she sold a one-year forward contract on Stock A six months ago at the no-arbitrage price. Exhibit 1 provides information on the stock and the forward contract. All prices are in Singapore dollars (SGD) per share.<\/p><p><b>Exhibit 1:<\/b><\/p><p>Price of Stock A at initiation of one-year forward contract 350.00<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-008.webp\" style=\"max-width:min(100%,463px)\" alt=\"Risk-free rate at initiation of one-year forward contract 0.85% Current risk-free rate 0.85% Current price of Stock A 340.00 Current price on new, six-month forward contract 341.44\"><p>Interest Rate Swap One year ago, Tan entered a 3-year interest rate swap in which she pays fixed and receives floating semi-annually. She now wants to offset this position with a new swap. Equity Index Swap Also one year ago, Tan entered a 2-year, receive-fixed, pay-equity swap on the S&amp;P 500° index. The swap is being reset today. Selected terms of the swap are shown in<\/p><p><b>Exhibit 2.<\/b><\/p><p><b>Exhibit 2:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-009.webp\" style=\"max-width:min(100%,500px)\" alt=\"Equity underlying S&amp;P 500 index with reinvested dividends Notional amount USD 20,000,000 Current underlying equity value USD 21,600,000 Fixed swap rate at initiation 1.40% Initial term 2 years Remaining term 1 year Reset Annual\"><p>Currency Swap Tan recently invested USD 5 million and is concerned that the USD will depreciate against the SGD. To hedge this risk, she enters a fixed-for-fixed currency swap with notional amounts of SGD 6.75 million and USD 5 million that are exchanged at both initiation and expiration. The forward exchange rate with the same expiration as the swap is 1.2821 SGD per USD.<\/p><\/div><\/details><div class=\"qtext\"><p>At today's reset of the equity index swap, Tan will:<\/p><\/div>", "subj": "derivatives"}, {"n": 20, "q": "At expiration of the USD/SGD currency swap, Tan will pay a notional amount of:", "opts": ["USD 5.00 million.", "USD 5.26 million.", "SGD 6.75 million."], "ans": "A", "expl": "A is correct. because to hedge the exchange rate risk on the USD investment, Tan would use a swap that converts USD into SGD. This means at the initiation of the swap, Tan would receive the notional amount of USD 5.00 million and pay the notional amount of SGD 6.75 million. At expiration, this is reversed and Tan would receive SGD 6.75 million and pay USD 5.00 million.", "explhtml": "<p><b>A is correct.<\/b> because to hedge the exchange rate risk on the USD investment, Tan<\/p><p>would use a swap that converts USD into SGD. This means at the initiation of the swap, Tan would receive the notional amount of USD 5.00 million and pay the notional amount of SGD 6.75 million. At expiration, this is reversed and Tan would receive SGD 6.75 million and pay USD 5.00 million.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Derivatives · Sharon Tan<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sharon Tan is a sophisticated investor who lives in Singapore and has both domestic and international investments. Equity Forward Tan has a significant long position in a non-dividend-paying stock (Stock A) that she must continue to hold. To hedge the downside risk, she sold a one-year forward contract on Stock A six months ago at the no-arbitrage price. Exhibit 1 provides information on the stock and the forward contract. All prices are in Singapore dollars (SGD) per share.<\/p><p><b>Exhibit 1:<\/b><\/p><p>Price of Stock A at initiation of one-year forward contract 350.00<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-008.webp\" style=\"max-width:min(100%,463px)\" alt=\"Risk-free rate at initiation of one-year forward contract 0.85% Current risk-free rate 0.85% Current price of Stock A 340.00 Current price on new, six-month forward contract 341.44\"><p>Interest Rate Swap One year ago, Tan entered a 3-year interest rate swap in which she pays fixed and receives floating semi-annually. She now wants to offset this position with a new swap. Equity Index Swap Also one year ago, Tan entered a 2-year, receive-fixed, pay-equity swap on the S&amp;P 500° index. The swap is being reset today. Selected terms of the swap are shown in<\/p><p><b>Exhibit 2.<\/b><\/p><p><b>Exhibit 2:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-009.webp\" style=\"max-width:min(100%,500px)\" alt=\"Equity underlying S&amp;P 500 index with reinvested dividends Notional amount USD 20,000,000 Current underlying equity value USD 21,600,000 Fixed swap rate at initiation 1.40% Initial term 2 years Remaining term 1 year Reset Annual\"><p>Currency Swap Tan recently invested USD 5 million and is concerned that the USD will depreciate against the SGD. To hedge this risk, she enters a fixed-for-fixed currency swap with notional amounts of SGD 6.75 million and USD 5 million that are exchanged at both initiation and expiration. The forward exchange rate with the same expiration as the swap is 1.2821 SGD per USD.<\/p><\/div><\/details><div class=\"qtext\"><p>At expiration of the USD/SGD currency swap, Tan will pay a notional amount of:<\/p><\/div>", "subj": "derivatives"}, {"n": 21, "q": "Ignoring transaction costs, the hedge fund's payoff from the Amass-Tryme merger arbitrage transaction is:", "opts": ["-$120,000.", "-$90,000.", "$30,000."], "ans": "B", "expl": "B is correct. because at the post-announcement price of $15, it costs $450,000 to buy 30,000 shares of Tryme, and $480,000 would be received for short selling 15,000 shares of Amass at its post announcement price of $32. This provides a net spread of $30,000 to the hedge fund manager if the merger is successfully completed. If the merger fails, then prices should revert to their pre- merger announcement levels. The manager would need to buy 15,000 shares of Amass at $34 (costing $510,000) to close the short position, while the long position in 30,000 shares of Tryme would fall to $13 per share (value at $390,000). This would cause a total loss of $90,000 [ = (Amass: +$480,000 - $510,000) + (Tryme: -$450,000 + $390,000)].", "explhtml": "<p><b>B is correct.<\/b> because at the post-announcement price of $15, it costs $450,000 to<\/p><p>buy 30,000 shares of Tryme, and $480,000 would be received for short selling 15,000 shares of Amass at its post announcement price of $32. This provides a net spread of $30,000 to the hedge fund manager if the merger is successfully completed. If the merger fails, then prices should revert to their pre- merger announcement levels. The manager would need to buy 15,000 shares of Amass at $34 (costing $510,000) to close the short position, while the long position in 30,000 shares of Tryme would fall to $13 per share (value at $390,000). This would cause a total loss of $90,000 [ = (Amass: +$480,000 - $510,000) + (Tryme: -$450,000 + $390,000)].<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Alternative Investments · Lain MacKay<\/summary><div class=\"vig-body\"><p>Iain MacKay, an investment advisor, specializes in hedge fund investments. He is advising a family office client and an institutional client on hedge fund strategies. Bony Family Office The Bony Family Office is considering arbitrage strategies. MacKay first demonstrates a merger arbitrage strategy. Several months ago, Amass Inc. made an offer to acquire Tryme Ltd. in a stock-for-stock transaction, with one share of Amass stock exchanged for every two shares of Tryme. After the offer was announced, a hedge fund bought 30,000 shares of Tryme and sold short 15,000 shares of Amass. The acquisition was ultimately not completed and the stock prices of both Amass and Tryme reverted to their pre-announcement levels. Mackay calculates the Amass-Tryme merger arbitrage transaction payoff for the hedge fund based on the information in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-010.webp\" style=\"max-width:min(100%,323px)\" alt=\"Amass share price (pre-announcement) $34 Amass share price (post-announcement) $32 Tryme share price (pre-announcement) $13 Tryme share price (post-announcement) $15\"><p>Next, MacKay demonstrates a convertible arbitrage strategy for the family office. MacKay believes that shares of Winfra Corporation are overvalued relative to its convertible bonds. He assumes a holding period of one year and uses the information in<\/p><p><b>Exhibit 2 to calculate the payoff per share.<\/b><\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-011.webp\" style=\"max-width:min(100%,375px)\" alt=\"Convertible price (% of par value of $1,000) 110 Annual coupon (%) 6.60 Remaining maturity (years) 1 Conversion ratio 55 Price per share (in $) 24\"><p>Annual cost of borrowing shares (in $ per share) 2 Annual share dividend (in $ per share) 1 Bony's existing portfolio is 60% equity and 40% debt. Its investment committee states that the main considerations for adding hedge fund investments to its portfolio are to: • Increase risk-adjusted returns • Limit downside risk • Avoid layering of fees MacKay assesses which hedge fund in Exhibit 3 he should recommend to meet all of these considerations.<\/p><p><b>Exhibit 3<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-012.webp\" style=\"max-width:min(100%,385px)\" alt=\"Sharpe Sortino Maximum Ratio Ratio Drawdown Existing Bony portfolio 0.65 1.26 14.80% Fund-of-funds 0.77 1.41 10.71% Long/short equity 0.75 1.23 18.03% Event-driven arbitrage 0.67 1.31 13.15%\"><p>Grati Grati, an institutional client of Mackay, has an existing investment in the Umbrella Fund, a fund-of-funds. Umbrella charges a 1% management fee and a 10% incentive fee. The fund consists of two equally weighted underlying hedge funds, Argo and Baker. Argo and Baker both charge a 2% management fee and a 20% incentive fee. Mackay calculates the net-of-fees return on Umbrella, assuming a scenario in which Argo and Baker generate a 1-year gross return of 15% and 20%, respectively.<\/p><\/div><\/details><div class=\"qtext\"><p>Ignoring transaction costs, the hedge fund's payoff from the Amass-Tryme merger<\/p><p>arbitrage transaction is:<\/p><\/div>", "subj": "alternatives"}, {"n": 22, "q": "The payoff per share of the convertible arbitrage strategy is:", "opts": ["$2.20.", "$4.00.", "$5.80."], "ans": "A", "expl": "A is correct. because based on the 4-step calculation below the payoff per convertible bond is $110. Step 1: Winfra's convertible bond price is $1,100 [= $1,000 × (110/100)], and its conversion ratio is 55; so, the conversion price is $20 ($1,100/55). This compares with Winfra's current share price of $24. Thus, MacKay should buy the convertibles and short sell the shares to make a profit of $4 per share ($24 - $20). Step 2: The $2 per share borrowing costs and the $1 dividend per share payable to the lender together represent a $3 per share outflow (-$2 - $1) that MacKay must pay. Step 3: But, the convertible bond pays a 6.6% coupon or $66, which equates to an inflow of $1.20 per share equivalent ($66 coupon/55 shares per bond). Step 4: Therefore, the total profit outcome would be reduced by -$1.80 per share ( -$3 + $1.20). In sum, MacKay would realize a total profit of $2.20 per each Winfra share ($4 - $1.80)", "explhtml": "<p><b>A is correct.<\/b> because based on the 4-step calculation below the payoff per<\/p><p>convertible bond is $110. Step 1: Winfra's convertible bond price is $1,100 [= $1,000 × (110/100)], and its conversion ratio is 55; so, the conversion price is $20 ($1,100/55). This compares with Winfra's current share price of $24. Thus, MacKay should buy the convertibles and short sell the shares to make a profit of $4 per share ($24 - $20). Step 2: The $2 per share borrowing costs and the $1 dividend per share payable to the lender together represent a $3 per share outflow (-$2 - $1) that MacKay must pay. Step 3: But, the convertible bond pays a 6.6% coupon or $66, which equates to an inflow of $1.20 per share equivalent ($66 coupon/55 shares per bond). Step 4: Therefore, the total profit outcome would be reduced by -$1.80 per share ( -$3 + $1.20). In sum, MacKay would realize a total profit of $2.20 per each Winfra share ($4 - $1.80)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Alternative Investments · Lain MacKay<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Iain MacKay, an investment advisor, specializes in hedge fund investments. He is advising a family office client and an institutional client on hedge fund strategies. Bony Family Office The Bony Family Office is considering arbitrage strategies. MacKay first demonstrates a merger arbitrage strategy. Several months ago, Amass Inc. made an offer to acquire Tryme Ltd. in a stock-for-stock transaction, with one share of Amass stock exchanged for every two shares of Tryme. After the offer was announced, a hedge fund bought 30,000 shares of Tryme and sold short 15,000 shares of Amass. The acquisition was ultimately not completed and the stock prices of both Amass and Tryme reverted to their pre-announcement levels. Mackay calculates the Amass-Tryme merger arbitrage transaction payoff for the hedge fund based on the information in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-010.webp\" style=\"max-width:min(100%,323px)\" alt=\"Amass share price (pre-announcement) $34 Amass share price (post-announcement) $32 Tryme share price (pre-announcement) $13 Tryme share price (post-announcement) $15\"><p>Next, MacKay demonstrates a convertible arbitrage strategy for the family office. MacKay believes that shares of Winfra Corporation are overvalued relative to its convertible bonds. He assumes a holding period of one year and uses the information in<\/p><p><b>Exhibit 2 to calculate the payoff per share.<\/b><\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-011.webp\" style=\"max-width:min(100%,375px)\" alt=\"Convertible price (% of par value of $1,000) 110 Annual coupon (%) 6.60 Remaining maturity (years) 1 Conversion ratio 55 Price per share (in $) 24\"><p>Annual cost of borrowing shares (in $ per share) 2 Annual share dividend (in $ per share) 1 Bony's existing portfolio is 60% equity and 40% debt. Its investment committee states that the main considerations for adding hedge fund investments to its portfolio are to: • Increase risk-adjusted returns • Limit downside risk • Avoid layering of fees MacKay assesses which hedge fund in Exhibit 3 he should recommend to meet all of these considerations.<\/p><p><b>Exhibit 3<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-012.webp\" style=\"max-width:min(100%,385px)\" alt=\"Sharpe Sortino Maximum Ratio Ratio Drawdown Existing Bony portfolio 0.65 1.26 14.80% Fund-of-funds 0.77 1.41 10.71% Long/short equity 0.75 1.23 18.03% Event-driven arbitrage 0.67 1.31 13.15%\"><p>Grati Grati, an institutional client of Mackay, has an existing investment in the Umbrella Fund, a fund-of-funds. Umbrella charges a 1% management fee and a 10% incentive fee. The fund consists of two equally weighted underlying hedge funds, Argo and Baker. Argo and Baker both charge a 2% management fee and a 20% incentive fee. Mackay calculates the net-of-fees return on Umbrella, assuming a scenario in which Argo and Baker generate a 1-year gross return of 15% and 20%, respectively.<\/p><\/div><\/details><div class=\"qtext\"><p>The payoff per share of the convertible arbitrage strategy is:<\/p><\/div>", "subj": "alternatives"}, {"n": 23, "q": "Given Bony's investment committee considerations, which hedge fund should MacKay recommend?", "opts": ["Fund-of-funds", "Long/short equity", "Event-driven arbitrage"], "ans": "C", "expl": "C is correct. because based on Bony IC's considerations, the event-driven arbitrage fund is the only fund which meets all the considerations as below: Increase risk-adjusted returns: All funds have a Sharpe ratio greater than the existing portfolio. The long/short equity fund does not beat the Sortino ratio of the existing portfolio, so it is not suitable. Limit downside risk: The long/short equity fund has a maximum drawdown greater than the existing portfolio, so it is not suitable. Avoid layering of fees: The fund-of-funds is the only one to have layering of fees, so it is not suitable. The event-driven arbitrage fund has a: • Sharpe ratio of 0.67, which is greater than the Sharpe ratio of 0.65 of the existing portfolio • Sortino ratio of 1.31, which is greater than the Sortino ratio of 1.26 of the • maximum drawdown of 13.15, which is lower than the maximum drawdown of 14.80 of the existing portfolio. This makes the event- driven arbitrage fund most suitable, as such an allocation would result in significant increase in the combined portfolio's Sharpe and Sortino ratios, and lower the maximum drawdown indicating less downside risk in the combined portfolio. An event-driven arbitrage fund is expected to have low correlation with a 60/40 fund, hence improving the risk-adjusted return.", "explhtml": "<p><b>C is correct.<\/b> because based on Bony IC's considerations, the event-driven arbitrage<\/p><p>fund is the only fund which meets all the considerations as below: Increase risk-adjusted returns: All funds have a Sharpe ratio greater than the existing portfolio. The long/short equity fund does not beat the Sortino ratio of the existing portfolio, so it is not suitable. Limit downside risk: The long/short equity fund has a maximum drawdown greater than the existing portfolio, so it is not suitable. Avoid layering of fees: The fund-of-funds is the only one to have layering of fees, so it is not suitable. The event-driven arbitrage fund has a:<\/p><p>• Sharpe ratio of 0.67, which is greater than the Sharpe ratio of 0.65 of the existing portfolio • Sortino ratio of 1.31, which is greater than the Sortino ratio of 1.26 of the<\/p><p>• maximum drawdown of 13.15, which is lower than the maximum drawdown of 14.80 of the existing portfolio. This makes the event- driven arbitrage fund most suitable, as such an allocation would result in significant increase in the combined portfolio's Sharpe and Sortino ratios, and lower the maximum drawdown indicating less downside risk in the combined portfolio. An event-driven arbitrage fund is expected to have low correlation with a 60/40 fund, hence improving the risk-adjusted return.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Alternative Investments · Lain MacKay<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Iain MacKay, an investment advisor, specializes in hedge fund investments. He is advising a family office client and an institutional client on hedge fund strategies. Bony Family Office The Bony Family Office is considering arbitrage strategies. MacKay first demonstrates a merger arbitrage strategy. Several months ago, Amass Inc. made an offer to acquire Tryme Ltd. in a stock-for-stock transaction, with one share of Amass stock exchanged for every two shares of Tryme. After the offer was announced, a hedge fund bought 30,000 shares of Tryme and sold short 15,000 shares of Amass. The acquisition was ultimately not completed and the stock prices of both Amass and Tryme reverted to their pre-announcement levels. Mackay calculates the Amass-Tryme merger arbitrage transaction payoff for the hedge fund based on the information in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-010.webp\" style=\"max-width:min(100%,323px)\" alt=\"Amass share price (pre-announcement) $34 Amass share price (post-announcement) $32 Tryme share price (pre-announcement) $13 Tryme share price (post-announcement) $15\"><p>Next, MacKay demonstrates a convertible arbitrage strategy for the family office. MacKay believes that shares of Winfra Corporation are overvalued relative to its convertible bonds. He assumes a holding period of one year and uses the information in<\/p><p><b>Exhibit 2 to calculate the payoff per share.<\/b><\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-011.webp\" style=\"max-width:min(100%,375px)\" alt=\"Convertible price (% of par value of $1,000) 110 Annual coupon (%) 6.60 Remaining maturity (years) 1 Conversion ratio 55 Price per share (in $) 24\"><p>Annual cost of borrowing shares (in $ per share) 2 Annual share dividend (in $ per share) 1 Bony's existing portfolio is 60% equity and 40% debt. Its investment committee states that the main considerations for adding hedge fund investments to its portfolio are to: • Increase risk-adjusted returns • Limit downside risk • Avoid layering of fees MacKay assesses which hedge fund in Exhibit 3 he should recommend to meet all of these considerations.<\/p><p><b>Exhibit 3<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-012.webp\" style=\"max-width:min(100%,385px)\" alt=\"Sharpe Sortino Maximum Ratio Ratio Drawdown Existing Bony portfolio 0.65 1.26 14.80% Fund-of-funds 0.77 1.41 10.71% Long/short equity 0.75 1.23 18.03% Event-driven arbitrage 0.67 1.31 13.15%\"><p>Grati Grati, an institutional client of Mackay, has an existing investment in the Umbrella Fund, a fund-of-funds. Umbrella charges a 1% management fee and a 10% incentive fee. The fund consists of two equally weighted underlying hedge funds, Argo and Baker. Argo and Baker both charge a 2% management fee and a 20% incentive fee. Mackay calculates the net-of-fees return on Umbrella, assuming a scenario in which Argo and Baker generate a 1-year gross return of 15% and 20%, respectively.<\/p><\/div><\/details><div class=\"qtext\"><p>Given Bony's investment committee considerations, which hedge fund should<\/p><p>MacKay recommend?<\/p><\/div>", "subj": "alternatives"}, {"n": 24, "q": "Based on Mackay's scenario, Umbrella's net-of-fees return is closest to:", "opts": ["9.8%.", "10.3%.", "12.4%."], "ans": "B", "expl": "B is correct. because: Net of Fees Return for Argo Investor = (15% - 2% - 2.6%) = 10.4%; where Incentive Fee for Argo Investor = 20% × (15% - 2%) = 2.6% Net of Fees Return for Baker Investor = (20% - 2% - 3.6%) = 14.4%; where Incentive Fee for Baker Investor = 20% × (20% - 2%) = 3.6% Gross Return for Umbrella Investor = (0.5 × 10.4% + 0.5 × 14.4%) = 12.4%; Net of Fees Return for Umbrella Investor = (12.4% - 1% - 1.14%) = 10.26%, where Incentive Fee for Umbrella Investor = 10% × (12.4% - 1%) = 1.14% In conclusion, if Argo and Baker managers generate gross returns of 15% and 20% respectively, then the net-of-fee return for Umbrella's investor is 10.26%", "explhtml": "<p><b>B is correct.<\/b> because:<\/p><p>Net of Fees Return for Argo Investor = (15% - 2% - 2.6%) = 10.4%; where Incentive Fee for Argo Investor = 20% × (15% - 2%) = 2.6% Net of Fees Return for Baker Investor = (20% - 2% - 3.6%) = 14.4%; where Incentive Fee for Baker Investor = 20% × (20% - 2%) = 3.6% Gross Return for Umbrella Investor = (0.5 × 10.4% + 0.5 × 14.4%) = 12.4%; Net of Fees Return for Umbrella Investor = (12.4% - 1% - 1.14%) = 10.26%, where Incentive Fee for Umbrella Investor = 10% × (12.4% - 1%) = 1.14% In conclusion, if Argo and Baker managers generate gross returns of 15% and 20% respectively, then the net-of-fee return for Umbrella's investor is 10.26%<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Alternative Investments · Lain MacKay<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Iain MacKay, an investment advisor, specializes in hedge fund investments. He is advising a family office client and an institutional client on hedge fund strategies. Bony Family Office The Bony Family Office is considering arbitrage strategies. MacKay first demonstrates a merger arbitrage strategy. Several months ago, Amass Inc. made an offer to acquire Tryme Ltd. in a stock-for-stock transaction, with one share of Amass stock exchanged for every two shares of Tryme. After the offer was announced, a hedge fund bought 30,000 shares of Tryme and sold short 15,000 shares of Amass. The acquisition was ultimately not completed and the stock prices of both Amass and Tryme reverted to their pre-announcement levels. Mackay calculates the Amass-Tryme merger arbitrage transaction payoff for the hedge fund based on the information in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-010.webp\" style=\"max-width:min(100%,323px)\" alt=\"Amass share price (pre-announcement) $34 Amass share price (post-announcement) $32 Tryme share price (pre-announcement) $13 Tryme share price (post-announcement) $15\"><p>Next, MacKay demonstrates a convertible arbitrage strategy for the family office. MacKay believes that shares of Winfra Corporation are overvalued relative to its convertible bonds. He assumes a holding period of one year and uses the information in<\/p><p><b>Exhibit 2 to calculate the payoff per share.<\/b><\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-011.webp\" style=\"max-width:min(100%,375px)\" alt=\"Convertible price (% of par value of $1,000) 110 Annual coupon (%) 6.60 Remaining maturity (years) 1 Conversion ratio 55 Price per share (in $) 24\"><p>Annual cost of borrowing shares (in $ per share) 2 Annual share dividend (in $ per share) 1 Bony's existing portfolio is 60% equity and 40% debt. Its investment committee states that the main considerations for adding hedge fund investments to its portfolio are to: • Increase risk-adjusted returns • Limit downside risk • Avoid layering of fees MacKay assesses which hedge fund in Exhibit 3 he should recommend to meet all of these considerations.<\/p><p><b>Exhibit 3<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-012.webp\" style=\"max-width:min(100%,385px)\" alt=\"Sharpe Sortino Maximum Ratio Ratio Drawdown Existing Bony portfolio 0.65 1.26 14.80% Fund-of-funds 0.77 1.41 10.71% Long/short equity 0.75 1.23 18.03% Event-driven arbitrage 0.67 1.31 13.15%\"><p>Grati Grati, an institutional client of Mackay, has an existing investment in the Umbrella Fund, a fund-of-funds. Umbrella charges a 1% management fee and a 10% incentive fee. The fund consists of two equally weighted underlying hedge funds, Argo and Baker. Argo and Baker both charge a 2% management fee and a 20% incentive fee. Mackay calculates the net-of-fees return on Umbrella, assuming a scenario in which Argo and Baker generate a 1-year gross return of 15% and 20%, respectively.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Mackay's scenario, Umbrella's net-of-fees return is closest to:<\/p><\/div>", "subj": "alternatives"}, {"n": 25, "q": "The total market value (in $ millions) of Brixton's equity is closest to:", "opts": ["38.", "49.", "59."], "ans": "B", "expl": "B is correct. because total market value of equity is calculated as follows (in $ millions): Equity value = Firm value - Market value of debt Firm value = FCFFO(1 +g) / (WACC -g) = 2.66(1.05) / (0.0976 - 0.05) = 2.7930 / 0.0476 = 58.6765 Equity value = 58.6765 - 9.86 = 48.8165 • 49", "explhtml": "<p><b>B is correct.<\/b> because total market value of equity is calculated as follows (in $<\/p><p>millions): Equity value = Firm value - Market value of debt Firm value = FCFFO(1 +g) / (WACC -g) = 2.66(1.05) / (0.0976 - 0.05) = 2.7930 / 0.0476 = 58.6765 Equity value = 58.6765 - 9.86 = 48.8165 • 49<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Equity Valuation · Jane Masterson<\/summary><div class=\"vig-body\"><p>Jane Masterson is an equity analyst for an investment bank. She uses free cash flow to value three companies. Brixton Corporation Masterson uses the following information to determine the total market value of Brixton Corporation's equity: • Current FCFF is $2.66 million • Market value of debt is $9.86 million • Required return on equity is 10.86% • WACC is 9.76% • FCFF is expected to grow at a constant rate of 5% per year After completing the valuation, Masterson learns that Brixton may soon change its capital structure by issuing more debt. She considers the effect this will have on its future FCFF. Hillbrow, Inc. Masterson next values Hillbrow, Inc. using the information (in $ millions) in Exhibit 1 to calculate its FCFE.<\/p><p><b>E "><p>Hillbrow's FCFE (in $ millions) is:<\/p><\/div>", "subj": "equity"}, {"n": 28, "q": "Carlton's total value of equity (in $ millions) is closest to:", "opts": ["628.", "679.", "748."], "ans": "B", "expl": "B is correct. because the total value of equity is calculated as follows (in $ millions): VO = FCFE1/(1 + r) + FCFE2/(1 + r)2 + FCFE3/(1 + r)3 + TV3/(1 + r)3 where: FCFE is free cash flow to equity (given in case for years 1-4)TV is terminal valuer is required return on equity (9.5% given in case) Step 1 is to calculate the terminal value of FCFE in Year 3. TV3 = FCFE4/(r - g) = (41x 1.04)/(0.095 - 0.04) = 42.64/0.055 = 775.27 Then this value is discounted along with the cash flows of the first three years. VO = FCFE1/(1 + r) + FCFE2/(1 + r)2 + FCFE3/(1 + r)3 + TV3/(1 + г)3 = 30/1.095 + 36/1.0952 + 41/1.0953 + 775.27/1.0953 = 27.40 + 30.02 + 31.23 + 590.49 = 679.14 м 679", "explhtml": "<p><b>B is correct.<\/b> because the total value of equity is calculated as follows (in $ millions):<\/p><p>VO = FCFE1/(1 + r) + FCFE2/(1 + r)2 + FCFE3/(1 + r)3 + TV3/(1 + r)3 where: FCFE is free cash flow to equity (given in case for years 1-4)TV is terminal valuer is required return on equity (9.5% given in case) Step 1 is to calculate the terminal value of FCFE in Year 3. TV3 = FCFE4/(r - g) = (41x 1.04)/(0.095 - 0.04) = 42.64/0.055 = 775.27 Then this value is discounted along with the cash flows of the first three years. VO = FCFE1/(1 + r) + FCFE2/(1 + r)2 + FCFE3/(1 + r)3 + TV3/(1 + г)3 = 30/1.095 + 36/1.0952 + 41/1.0953 + 775.27/1.0953 = 27.40 + 30.02 + 31.23 + 590.49 = 679.14 м 679<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Equity Valuation · Jane Masterson<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jane Masterson is an equity analyst for an investment bank. She uses free cash flow to value three companies. Brixton Corporation Masterson uses the following information to determine the total market value of Brixton Corporation's equity: • Current FCFF is $2.66 million • Market value of debt is $9.86 million • Required return on equity is 10.86% • WACC is 9.76% • FCFF is expected to grow at a constant rate of 5% per year After completing the valuation, Masterson learns that Brixton may soon change its capital structure by issuing more debt. She considers the effect this will have on its future FCFF. Hillbrow, Inc. Masterson next values Hillbrow, Inc. using the information (in $ millions) in Exhibit 1 to calculate its FCFE.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-013.webp\" style=\"max-width:min(100%,368px)\" alt=\"Net income available to common shareholders 420 Depreciation expense 525 Interest expense (after tax) 74 Increase in fixed capital investment 700 Increase in working capital investment 78 Increase in net borrowing 48\"><p>Carlton Corporation • Finally, Masterson uses a two-stage FCFE model and the following information to value Carlton Corporation: • FCFE is expected to be $30 million in Year 1, $36 million in Year 2, and $41 million in Year 3 • Required return on equity is 9.5% • WACC is 9% • FCFE is expected to grow at a constant annual rate of 4% after Year 3<\/p><\/div><\/details><div class=\"qtext\"><p>Carlton's total value of equity (in $ millions) is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 29, "q": "The fair value (per 100 of par value) of the Li-Ion Corp bond is closest to:", "opts": ["113.44.", "114.78.", "115.37. ("], "ans": "B", "expl": "B is correct. because to determine the arbitrage-free value of the bond, two calculations are required: 1. the value for the bond assuming no default (VND), and 2. the credit valuation adjustment (CVA). 7 tho nnodit unlitinn adinetmont (VA) 1. The VND is the PV of each year's cashflow = cash flow x discount factor: 6.75 x 0.9950 = 6.7163 6.75 × 0.9901 = 6.6832 106.75 x 0.9851 = 105.1594 Total = 118.5589. 2. The CVA is the sum of the PV of expected loss: CVA = 1.3635 + 1.2567 + 1.1544 = 3.7746 per 100 of par value. The fair value of the bond if it were default free adjusted by the CVA reflects Li- Ion Corp bond riskiness = VND - CVA = 118.5589 - 3.7746 = 114.7843 & 114.78 per 100 of par value. 1M af nanualuo", "explhtml": "<p><b>B is correct.<\/b> because to determine the arbitrage-free value of the bond, two<\/p><p>calculations are required: 1. the value for the bond assuming no default (VND), and 2. the credit valuation adjustment (CVA). 7 tho nnodit unlitinn adinetmont (VA)<\/p><p>1. The VND is the PV of each year's cashflow = cash flow x discount factor: 6.75 x 0.9950 = 6.7163 6.75 × 0.9901 = 6.6832 106.75 x 0.9851 = 105.1594 Total = 118.5589. 2. The CVA is the sum of the PV of expected loss: CVA = 1.3635 + 1.2567 + 1.1544 = 3.7746 per 100 of par value. The fair value of the bond if it were default free adjusted by the CVA reflects Li- Ion Corp bond riskiness = VND - CVA = 118.5589 - 3.7746 = 114.7843 &amp; 114.78 per 100 of par value. 1M af nanualuo<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Fixed Income · Philippe Georgiou<\/summary><div class=\"vig-body\"><p>Philippe Georgiou works as a fixed income portfolio manager. He is currently assessing some investments as possible inclusions to his portfolio. Georgiou first looks at a 3-year, annual 6.75% coupon bond issued by Li-Ion Corp, an electric vehicle battery manufacturer. The bond has a yield to maturity of 1.656%. He uses the information in Exhibit 1 (presented in per 100 of par value) to determine the fair value of the bond.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-014.webp\" style=\"max-width:min(100%,418px)\" alt=\"Present Value of Exposure Discount Factor Expected Loss Year 0 --- --- --- Year 1 119.1569 0.9950 1.3635 Year 2 112.9689 0.9901 1.2567 Year 3 106.7500 0.9851 1.1544\"><p>Georgiou also estimates the risk-neutral probability of default of the bond. He observes that this risk-neutral probability of default is different than the actual probability of default based on historical data for companies with comparable credit risk. He believes that this difference is explained by: i) the default risk premium associated with the timing of possible default ii) the fact that the observed spread over the yield on a risk-free bond also includes liquidity and tax considerations in addition to credit risk. Next, Georgiou assesses an auto ABS issued by Clear Future, the financial services entity of an automotive company. The ABS is backed by a non-static pool of 40,000 of the firm's standard medium-term auto lease contracts covering zero emissions vehicles. Georgiou holds a 5-year senior, unsecured bond issued by EV Cars. The company is being investigated about the possible manipulation of carbon dioxide emissions tests. Georgiou decides to buy protection on EV Cars with a CDS contract which has a standardized coupon of 1%, a duration of 4 and trades at a credit spread of 250 bps.<\/p><\/div><\/details><div class=\"qtext\"><p>The fair value (per 100 of par value) of the Li-Ion Corp bond is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 30, "q": "Are Georgiou's beliefs regarding the explanation for the difference in the probability of default measures correct?", "opts": ["Yes", "No, with regard to the default risk premium", "No, with regard to liquidity and tax considerations"], "ans": "A", "expl": "A is correct. because Georgiou's beliefs are correct with regard to differences between risk-neutral probabilities of default (POD) and historical POD. Unlike historical POD, risk-neutral probabilities include a default risk premium. In the same time, while risk-neutral probabilities ignore the liquidity and tax considerations specific to each bond, they are still observed in practice. One reason for the difference between actual (or historical) and risk-neutral default probabilities is that actual default probabilities do not include the default risk premium associated with uncertainty over the timing of possible default loss. Another reason is that the observed spread over the yield on a risk-free bond in practice also includes liquidity and tax considerations in addition to credit risk.", "explhtml": "<p><b>A is correct.<\/b> because Georgiou's beliefs are correct with regard to differences<\/p><p>between risk-neutral probabilities of default (POD) and historical POD. Unlike historical POD, risk-neutral probabilities include a default risk premium. In the same time, while risk-neutral probabilities ignore the liquidity and tax considerations specific to each bond, they are still observed in practice. One reason for the difference between actual (or historical) and risk-neutral default probabilities is that actual default probabilities do not include the default risk premium associated with uncertainty over the timing of possible default loss. Another reason is that the observed spread over the yield on a risk-free bond in practice also includes liquidity and tax considerations in addition to credit risk.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Fixed Income · Philippe Georgiou<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Philippe Georgiou works as a fixed income portfolio manager. He is currently assessing some investments as possible inclusions to his portfolio. Georgiou first looks at a 3-year, annual 6.75% coupon bond issued by Li-Ion Corp, an electric vehicle battery manufacturer. The bond has a yield to maturity of 1.656%. He uses the information in Exhibit 1 (presented in per 100 of par value) to determine the fair value of the bond.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-014.webp\" style=\"max-width:min(100%,418px)\" alt=\"Present Value of Exposure Discount Factor Expected Loss Year 0 --- --- --- Year 1 119.1569 0.9950 1.3635 Year 2 112.9689 0.9901 1.2567 Year 3 106.7500 0.9851 1.1544\"><p>Georgiou also estimates the risk-neutral probability of default of the bond. He observes that this risk-neutral probability of default is different than the actual probability of default based on historical data for companies with comparable credit risk. He believes that this difference is explained by: i) the default risk premium associated with the timing of possible default ii) the fact that the observed spread over the yield on a risk-free bond also includes liquidity and tax considerations in addition to credit risk. Next, Georgiou assesses an auto ABS issued by Clear Future, the financial services entity of an automotive company. The ABS is backed by a non-static pool of 40,000 of the firm's standard medium-term auto lease contracts covering zero emissions vehicles. Georgiou holds a 5-year senior, unsecured bond issued by EV Cars. The company is being investigated about the possible manipulation of carbon dioxide emissions tests. Georgiou decides to buy protection on EV Cars with a CDS contract which has a standardized coupon of 1%, a duration of 4 and trades at a credit spread of 250 bps.<\/p><\/div><\/details><div class=\"qtext\"><p>Are Georgiou's beliefs regarding the explanation for the difference in the<\/p><p>probability of default measures correct?<\/p><\/div>", "subj": "fixed"}, {"n": 31, "q": "Which credit analysis approach would be most appropriate in assessing the Clear Future ABS?", "opts": ["Loan-by-loan approach", "Portfolio-based approach", "Statistics-based approach"], "ans": "B", "expl": "B is correct. because the pool for the ABS issued by Clear Future is described as five-year auto lease contracts, so it is medium-term. It is backed by 40,000 such auto lease contracts and all these contracts are for purchases of zero emissions vehicles. The pool shows homogeneity as contracts are similar and high granularity as there are 40,000 of them.", "explhtml": "<p><b>B is correct.<\/b> because the pool for the ABS issued by Clear Future is described as<\/p><p>five-year auto lease contracts, so it is medium-term. It is backed by 40,000 such auto lease contracts and all these contracts are for purchases of zero emissions vehicles. The pool shows homogeneity as contracts are similar and high granularity as there are 40,000 of them.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Fixed Income · Philippe Georgiou<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Philippe Georgiou works as a fixed income portfolio manager. He is currently assessing some investments as possible inclusions to his portfolio. Georgiou first looks at a 3-year, annual 6.75% coupon bond issued by Li-Ion Corp, an electric vehicle battery manufacturer. The bond has a yield to maturity of 1.656%. He uses the information in Exhibit 1 (presented in per 100 of par value) to determine the fair value of the bond.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-014.webp\" style=\"max-width:min(100%,418px)\" alt=\"Present Value of Exposure Discount Factor Expected Loss Year 0 --- --- --- Year 1 119.1569 0.9950 1.3635 Year 2 112.9689 0.9901 1.2567 Year 3 106.7500 0.9851 1.1544\"><p>Georgiou also estimates the risk-neutral probability of default of the bond. He observes that this risk-neutral probability of default is different than the actual probability of default based on historical data for companies with comparable credit risk. He believes that this difference is explained by: i) the default risk premium associated with the timing of possible default ii) the fact that the observed spread over the yield on a risk-free bond also includes liquidity and tax considerations in addition to credit risk. Next, Georgiou assesses an auto ABS issued by Clear Future, the financial services entity of an automotive company. The ABS is backed by a non-static pool of 40,000 of the firm's standard medium-term auto lease contracts covering zero emissions vehicles. Georgiou holds a 5-year senior, unsecured bond issued by EV Cars. The company is being investigated about the possible manipulation of carbon dioxide emissions tests. Georgiou decides to buy protection on EV Cars with a CDS contract which has a standardized coupon of 1%, a duration of 4 and trades at a credit spread of 250 bps.<\/p><\/div><\/details><div class=\"qtext\"><p>Which credit analysis approach would be most appropriate in assessing the Clear<\/p><p>Future ABS?<\/p><\/div>", "subj": "fixed"}, {"n": 32, "q": "The upfront premium (as a percentage of notional) to buy CDS protection on EV Car is closestto:", "opts": ["0.40%.", "4.00%.", "6.00%."], "ans": "C", "expl": "C is correct. because a good approximation of the upfront premium to buy CDS protection is: upfront premium as a % of notional * (credit spread - fixed coupon) x duration. Upfront premium • (0.025 - 0.01) × 4 = 6% of notional amount.", "explhtml": "<p><b>C is correct.<\/b> because a good approximation of the upfront premium to buy CDS<\/p><p>protection is: upfront premium as a % of notional * (credit spread - fixed coupon) x duration. Upfront premium • (0.025 - 0.01) × 4 = 6% of notional amount.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Fixed Income · Philippe Georgiou<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Philippe Georgiou works as a fixed income portfolio manager. He is currently assessing some investments as possible inclusions to his portfolio. Georgiou first looks at a 3-year, annual 6.75% coupon bond issued by Li-Ion Corp, an electric vehicle battery manufacturer. The bond has a yield to maturity of 1.656%. He uses the information in Exhibit 1 (presented in per 100 of par value) to determine the fair value of the bond.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m2s1-014.webp\" style=\"max-width:min(100%,418px)\" alt=\"Present Value of Exposure Discount Factor Expected Loss Year 0 --- --- --- Year 1 119.1569 0.9950 1.3635 Year 2 112.9689 0.9901 1.2567 Year 3 106.7500 0.9851 1.1544\"><p>Georgiou also estimates the risk-neutral probability of default of the bond. He observes that this risk-neutral probability of default is different than the actual probability of default based on historical data for companies with comparable credit risk. He believes that this difference is explained by: i) the default risk premium associated with the timing of possible default ii) the fact that the observed spread over the yield on a risk-free bond also includes liquidity and tax considerations in addition to credit risk. Next, Georgiou assesses an auto ABS issued by Clear Future, the financial services entity of an automotive company. The ABS is backed by a non-static pool of 40,000 of the firm's standard medium-term auto lease contracts covering zero emissions vehicles. Georgiou holds a 5-year senior, unsecured bond issued by EV Cars. The company is being investigated about the possible manipulation of carbon dioxide emissions tests. Georgiou decides to buy protection on EV Cars with a CDS contract which has a standardized coupon of 1%, a duration of 4 and trades at a credit spread of 250 bps.<\/p><\/div><\/details><div class=\"qtext\"><p>The upfront premium (as a percentage of notional) to buy CDS protection on EV<\/p><p>Car is closestto:<\/p><\/div>", "subj": "fixed"}, {"n": 33, "q": "Based on Lin's estimates, the daily 5% parametric VaR of the client's portfolio is closest to:", "opts": ["0.04%.", "0.58%.", "1.32%."], "ans": "C", "expl": "C is correct. because given the characteristics of the normal distribution, a 5% VaR is equivalent to the point on the distribution that is 1.65 standard deviations below the expected value and assuming 250 trading days in a year, the expected return is adjusted by dividing by 250 and the standard deviation is adjusted by dividing by the square root of 250. The daily expected return = 12.5%/250 • 0.05%. The daily standard deviation = 13.1%/ SQRT250 ø 0.83%. The daily VaR = | 0.05% - 1.65(0.83%)| * 1.32%.", "explhtml": "<p><b>C is correct.<\/b> because given the characteristics of the normal distribution, a 5% VaR<\/p><p>is equivalent to the point on the distribution that is 1.65 standard deviations below the expected value and assuming 250 trading days in a year, the expected return is adjusted by dividing by 250 and the standard deviation is adjusted by dividing by the square root of 250. The daily expected return = 12.5%/250 • 0.05%. The daily standard deviation = 13.1%/ SQRT250 ø 0.83%. The daily VaR = | 0.05% - 1.65(0.83%)| * 1.32%.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Portfolio Management · Lin Xiamen<\/summary><div class=\"vig-body\"><p>flin Vinmon Nndo Caonanin ?<\/p><p>Lin Xiamen manages diversified portfolios for high-net-worth individuals. His portfolios have a client-specific target allocation to domestic equities and fixed-income investments. Lin reports the return and standard deviation for each client's portfolio, but wants to enhance his risk reporting by including measures of VaR. Lin reports the daily 5% parametric VaR based on 250 trading days per year. He estimates the following for a client's portfolio. • Annual expected return of 12.5% • Annual standard deviation of 13.1% • Annual 5% parametric VaR of 9.1% Lin understands that VaR is an important risk measure but intends to communicate its limitations to clients. Some of Lin's clients have expressed concerns about potential losses in the event of extreme market downturns. Lin considers a new strategy that includes adding non-domestic equities to portfolios. His primary investment goal is to generate a higher Sharpe ratio for each client's equity portfolio versus the portfolio being invested only in domestic equities. He notes that transaction costs for buying and selling non-domestic equities are similar to the transaction costs of domestic equities. Lin does not plan on hedging currency exposures because he expects those foreign currencies to appreciate. Lin plans to test the new strategy over an extended historical period.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Lin's estimates, the daily 5% parametric VaR of the client's portfolio<\/p><p>is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 34, "q": "A limitation that Lin should communicate to his clients is that the important risk measure he uses:", "opts": ["fails to take into account the liquidity of assets.", "should not be used to compare risks across asset classes.", "is likely to underestimate the effect, but not the likelihood, of extreme market events."], "ans": "A", "expl": "A is correct. because if some assets in a portfolio are relatively illiquid, VaR could be understated, even under normal market conditions. Additionally, liquidity squeezes are frequently associated with tail events and major market downturns, thereby exacerbating the risk.", "explhtml": "<p><b>A is correct.<\/b> because if some assets in a portfolio are relatively illiquid, VaR could<\/p><p>be understated, even under normal market conditions. Additionally, liquidity squeezes are frequently associated with tail events and major market downturns, thereby exacerbating the risk.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Portfolio Management · Lin Xiamen<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>flin Vinmon Nndo Caonanin ?<\/p><p>Lin Xiamen manages diversified portfolios for high-net-worth individuals. His portfolios have a client-specific target allocation to domestic equities and fixed-income investments. Lin reports the return and standard deviation for each client's portfolio, but wants to enhance his risk reporting by including measures of VaR. Lin reports the daily 5% parametric VaR based on 250 trading days per year. He estimates the following for a client's portfolio. • Annual expected return of 12.5% • Annual standard deviation of 13.1% • Annual 5% parametric VaR of 9.1% Lin understands that VaR is an important risk measure but intends to communicate its limitations to clients. Some of Lin's clients have expressed concerns about potential losses in the event of extreme market downturns. Lin considers a new strategy that includes adding non-domestic equities to portfolios. His primary investment goal is to generate a higher Sharpe ratio for each client's equity portfolio versus the portfolio being invested only in domestic equities. He notes that transaction costs for buying and selling non-domestic equities are similar to the transaction costs of domestic equities. Lin does not plan on hedging currency exposures because he expects those foreign currencies to appreciate. Lin plans to test the new strategy over an extended historical period.<\/p><\/div><\/details><div class=\"qtext\"><p>A limitation that Lin should communicate to his clients is that the important risk<\/p><p>measure he uses:<\/p><\/div>", "subj": "portfolio"}, {"n": 35, "q": "To best address his clients' expressed concerns about potential losses, Lin should report:", "opts": ["marginal VaR.", "conditional VaR.", "incremental VaR."], "ans": "B", "expl": "B is correct. because the clients are concerned about potential losses in the event of an extreme market downturn. An important and related measure can determine the average loss that would be incurred if the VaR cutoff is exceeded. This measure is sometimes referred to as the conditional VaR (CVaR), although it is not technically a VaR measure. CVaR is also sometimes referred to as the expected tail loss or expected shortfall.", "explhtml": "<p><b>B is correct.<\/b> because the clients are concerned about potential losses in the event<\/p><p>of an extreme market downturn. An important and related measure can determine the average loss that would be incurred if the VaR cutoff is exceeded. This measure is sometimes referred to as the conditional VaR (CVaR), although it is not technically a VaR measure. CVaR is also sometimes referred to as the expected tail loss or expected shortfall.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Portfolio Management · Lin Xiamen<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>flin Vinmon Nndo Caonanin ?<\/p><p>Lin Xiamen manages diversified portfolios for high-net-worth individuals. His portfolios have a client-specific target allocation to domestic equities and fixed-income investments. Lin reports the return and standard deviation for each client's portfolio, but wants to enhance his risk reporting by including measures of VaR. Lin reports the daily 5% parametric VaR based on 250 trading days per year. He estimates the following for a client's portfolio. • Annual expected return of 12.5% • Annual standard deviation of 13.1% • Annual 5% parametric VaR of 9.1% Lin understands that VaR is an important risk measure but intends to communicate its limitations to clients. Some of Lin's clients have expressed concerns about potential losses in the event of extreme market downturns. Lin considers a new strategy that includes adding non-domestic equities to portfolios. His primary investment goal is to generate a higher Sharpe ratio for each client's equity portfolio versus the portfolio being invested only in domestic equities. He notes that transaction costs for buying and selling non-domestic equities are similar to the transaction costs of domestic equities. Lin does not plan on hedging currency exposures because he expects those foreign currencies to appreciate. Lin plans to test the new strategy over an extended historical period.<\/p><\/div><\/details><div class=\"qtext\"><p>To best address his clients' expressed concerns about potential losses, Lin should<\/p><p>report:<\/p><\/div>", "subj": "portfolio"}, {"n": 36, "q": "Regarding Lin's new strategy to generate higher Sharpe ratios for client portfolios, which of the following is most appropriate?", "opts": ["Transaction costs should be ignored when testing the new strategy", "Using point-in-time data to determine the countries in which he should invest", "The Sharpe ratio should be computed using local currency returns and risk-free rates"], "ans": "B", "expl": "B is correct. because tracking all companies that have ever existed in a correct point-in-time fashion (i.e., the casualties as well as the survivors) is strongly recommended, especially as such data becomes more available from data vendors. Point-in-time data allow analysts to use the most complete data for any given prior time period, thereby enabling the construction (and backtesting) of the most realistic investment strategies. Lin could potentially create look-ahead bias by using information that was unknown or unavailable during the historical periods over which the backtest is conducted to determine which countries he would have invested in.", "explhtml": "<p><b>B is correct.<\/b> because tracking all companies that have ever existed in a correct<\/p><p>point-in-time fashion (i.e., the casualties as well as the survivors) is strongly recommended, especially as such data becomes more available from data vendors. Point-in-time data allow analysts to use the most complete data for any given prior time period, thereby enabling the construction (and backtesting) of the most realistic investment strategies. Lin could potentially create look-ahead bias by using information that was unknown or unavailable during the historical periods over which the backtest is conducted to determine which countries he would have invested in.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Portfolio Management · Lin Xiamen<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>flin Vinmon Nndo Caonanin ?<\/p><p>Lin Xiamen manages diversified portfolios for high-net-worth individuals. His portfolios have a client-specific target allocation to domestic equities and fixed-income investments. Lin reports the return and standard deviation for each client's portfolio, but wants to enhance his risk reporting by including measures of VaR. Lin reports the daily 5% parametric VaR based on 250 trading days per year. He estimates the following for a client's portfolio. • Annual expected return of 12.5% • Annual standard deviation of 13.1% • Annual 5% parametric VaR of 9.1% Lin understands that VaR is an important risk measure but intends to communicate its limitations to clients. Some of Lin's clients have expressed concerns about potential losses in the event of extreme market downturns. Lin considers a new strategy that includes adding non-domestic equities to portfolios. His primary investment goal is to generate a higher Sharpe ratio for each client's equity portfolio versus the portfolio being invested only in domestic equities. He notes that transaction costs for buying and selling non-domestic equities are similar to the transaction costs of domestic equities. Lin does not plan on hedging currency exposures because he expects those foreign currencies to appreciate. Lin plans to test the new strategy over an extended historical period.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Lin's new strategy to generate higher Sharpe ratios for client portfolios,<\/p><p>which of the following is most appropriate?<\/p><\/div>", "subj": "portfolio"}, {"n": 37, "q": "When presenting his performance to Maulbaum, DeVriese violates the Standards concerning the treatment of:", "opts": ["fees and taxes.", "terminated accounts.", "performance data from Blue Lantern."], "ans": "B", "expl": "B is correct. because DeVriese is not allowed to exclude terminated accounts. Compliance with Standard III(D) Performance Presentation requires including terminated accounts as part of performance history with a clear indication of when the accounts were terminated.", "explhtml": "<p><b>B is correct.<\/b> because DeVriese is not allowed to exclude terminated accounts.<\/p><p>Compliance with Standard III(D) Performance Presentation requires including terminated accounts as part of performance history with a clear indication of when the accounts were terminated.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Ethics · Albert De Vriese<\/summary><div class=\"vig-body\"><p>Albert DeVriese, CFA, is an investment adviser at Thunderland, a private wealth management firm. DeVriese meets with Donna Maulbaum, a potential new client. During his initial presentation, DeVriese provides performance information for a weighted composite of the portfolios that he managed over the previous ten years. These ten years include five years during which he worked at Blue Lantern, another private wealth management firm. In his presentation, DeVriese explains that the performance information: • is stated gross of fees and before taxes; • excludes terminated accounts; and • includes the performance data from his time as an investment adviser at Blue Lantern. Maulbaum is impressed and transfers her portfolio to an account at Thunderland. A few weeks later, DeVriese receives a report from Thunderland's research department on GasExplorer, a publicly listed company. The report upgrades the firm's recommendation on GasExplorer from \"hold\" to \"strong buy.\" DeVriese distributes the report to all of his clients via e-mail. Since Maulbaum, who already owns some GasExplorer stock, mentioned that she might transfer additional funds, DeVriese meets with her to discuss the report and to encourage her to increase her holdings in the stock. Maulbaum states that she is not interested in acquiring more shares. Instead, Maulbaum wants to sell her holdings in GasExplorer immediately because she needs liquidity for the purchase of a vacation home. DeVriese documents the discussion and sells Maulbaum's GasExplorer shares, contrary to the \"strong buy\" recommendation.<\/p><p>At the end of the month, DeVriese receives a payment of $1,000 from Thunderland as a bonus for bringing over Maulbaum's portfolio from a competitor. The bonus arrangement is in line with company policy, and DeVriese does not disclose the arrangement to Maulbaum at their initial meeting, nor upon receipt of the payment. DeVriese's brother is one of Thunderland's largest clients. As a family member, DeVriese's brother obtained an exception to firm policy, whereby he does not pay any management fees on his account. An upcoming IPO is suitable for DeVriese's brother as well as a number of other clients. DeVriese requests 10,000 shares in total and plans to allocate 1,000 shares to his brother and the remainder to the other clients. However, he only receives 6,000 shares from the IPO allocation.<\/p><\/div><\/details><div class=\"qtext\"><p>When presenting his performance to Maulbaum, DeVriese violates the Standards<\/p><p>concerning the treatment of:<\/p><\/div>", "subj": "ethics"}, {"n": 38, "q": "Does DeVriese violate the Standards with his actions regarding the GasExplorer report?", "opts": ["No", "Yes, by meeting with Maulbaum to discuss the report", "Yes, by selling Maulbaum's shares, contrary to the recommendation"], "ans": "A", "expl": "A is correct. because neither the meeting with Maulbaum nor the selling of her shares are a violation of Standard III(B) Fair Dealing. DeVriese has distributed the research report to all clients via e-mail. After that, he is free to discuss the report in more detail with select clients. Once this distribution has occurred, the member or candidate may follow up separately with individual clients. DeVriese is also not in violation of the Standards by trading against a current recommendation of the firm. Because investments should be based on individual needs and circumstances, an investment manager may have good reasons for placing a given security or other investment in one account while selling it from another account and should fully document the reasons behind both sides of the transaction.", "explhtml": "<p><b>A is correct.<\/b> because neither the meeting with Maulbaum nor the selling of her<\/p><p>shares are a violation of Standard III(B) Fair Dealing. DeVriese has distributed the research report to all clients via e-mail. After that, he is free to discuss the report in more detail with select clients. Once this distribution has occurred, the member or candidate may follow up separately with individual clients. DeVriese is also not in violation of the Standards by trading against a current recommendation of the firm. Because investments should be based on individual needs and circumstances, an investment manager may have good reasons for placing a given security or other investment in one account while selling it from another account and should fully document the reasons behind both sides of the transaction.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Ethics · Albert De Vriese<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Albert DeVriese, CFA, is an investment adviser at Thunderland, a private wealth management firm. DeVriese meets with Donna Maulbaum, a potential new client. During his initial presentation, DeVriese provides performance information for a weighted composite of the portfolios that he managed over the previous ten years. These ten years include five years during which he worked at Blue Lantern, another private wealth management firm. In his presentation, DeVriese explains that the performance information: • is stated gross of fees and before taxes; • excludes terminated accounts; and • includes the performance data from his time as an investment adviser at Blue Lantern. Maulbaum is impressed and transfers her portfolio to an account at Thunderland. A few weeks later, DeVriese receives a report from Thunderland's research department on GasExplorer, a publicly listed company. The report upgrades the firm's recommendation on GasExplorer from \"hold\" to \"strong buy.\" DeVriese distributes the report to all of his clients via e-mail. Since Maulbaum, who already owns some GasExplorer stock, mentioned that she might transfer additional funds, DeVriese meets with her to discuss the report and to encourage her to increase her holdings in the stock. Maulbaum states that she is not interested in acquiring more shares. Instead, Maulbaum wants to sell her holdings in GasExplorer immediately because she needs liquidity for the purchase of a vacation home. DeVriese documents the discussion and sells Maulbaum's GasExplorer shares, contrary to the \"strong buy\" recommendation.<\/p><p>At the end of the month, DeVriese receives a payment of $1,000 from Thunderland as a bonus for bringing over Maulbaum's portfolio from a competitor. The bonus arrangement is in line with company policy, and DeVriese does not disclose the arrangement to Maulbaum at their initial meeting, nor upon receipt of the payment. DeVriese's brother is one of Thunderland's largest clients. As a family member, DeVriese's brother obtained an exception to firm policy, whereby he does not pay any management fees on his account. An upcoming IPO is suitable for DeVriese's brother as well as a number of other clients. DeVriese requests 10,000 shares in total and plans to allocate 1,000 shares to his brother and the remainder to the other clients. However, he only receives 6,000 shares from the IPO allocation.<\/p><\/div><\/details><div class=\"qtext\"><p>Does DeVriese violate the Standards with his actions regarding the GasExplorer<\/p><p>report?<\/p><\/div>", "subj": "ethics"}, {"n": 39, "q": "Does DeVriese violate the Standards with regard to the bonus payment?", "opts": ["No", "Yes, by not disclosing the payment to Maulbaum upon receipt", "Yes, by not disclosing the arrangement to Maulbaum at their initial meeting"], "ans": "A", "expl": "A is correct. because the bonus does not need to be disclosed to Maulbaum to comply with the Standards. It is provided by Thunderland and thus does not create zmahwith the Ctaudand, Tti, nnuided hu Thimdonland aud thaie dose nat ananto a conflict of interest between DeVriese and his employer, clients, or prospective clients. Since it comes from Thunderland, it is neither a referral fee nor additional compensation, as defined by the Standards. According to Standard VI(C) Referral Fees, referral fees are any compensation, consideration, or benefit received from or paid to others for the recommendation of products or services. Additional compensation is defined in Standard IV(B). Additional Compensation Arrangements as gifts, benefits, or compensation, or consideration that competes with or might reasonably be expected to create a conflict of interest with their employer's interest. Although the disclosure of all bonus arrangements might add clarity, the Code and Standards do not require members and candidates to disclose how they are compensated.", "explhtml": "<p><b>A is correct.<\/b> because the bonus does not need to be disclosed to Maulbaum to<\/p><p>comply with the Standards. It is provided by Thunderland and thus does not create zmahwith the Ctaudand, Tti, nnuided hu Thimdonland aud thaie dose nat ananto<\/p><p>a conflict of interest between DeVriese and his employer, clients, or prospective clients. Since it comes from Thunderland, it is neither a referral fee nor additional compensation, as defined by the Standards. According to Standard VI(C) Referral Fees, referral fees are any compensation, consideration, or benefit received from or paid to others for the recommendation of products or services. Additional compensation is defined in Standard IV(B). Additional Compensation Arrangements as gifts, benefits, or compensation, or consideration that competes with or might reasonably be expected to create a conflict of interest with their employer's interest. Although the disclosure of all bonus arrangements might add clarity, the Code and Standards do not require members and candidates to disclose how they are compensated.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Ethics · Albert De Vriese<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Albert DeVriese, CFA, is an investment adviser at Thunderland, a private wealth management firm. DeVriese meets with Donna Maulbaum, a potential new client. During his initial presentation, DeVriese provides performance information for a weighted composite of the portfolios that he managed over the previous ten years. These ten years include five years during which he worked at Blue Lantern, another private wealth management firm. In his presentation, DeVriese explains that the performance information: • is stated gross of fees and before taxes; • excludes terminated accounts; and • includes the performance data from his time as an investment adviser at Blue Lantern. Maulbaum is impressed and transfers her portfolio to an account at Thunderland. A few weeks later, DeVriese receives a report from Thunderland's research department on GasExplorer, a publicly listed company. The report upgrades the firm's recommendation on GasExplorer from \"hold\" to \"strong buy.\" DeVriese distributes the report to all of his clients via e-mail. Since Maulbaum, who already owns some GasExplorer stock, mentioned that she might transfer additional funds, DeVriese meets with her to discuss the report and to encourage her to increase her holdings in the stock. Maulbaum states that she is not interested in acquiring more shares. Instead, Maulbaum wants to sell her holdings in GasExplorer immediately because she needs liquidity for the purchase of a vacation home. DeVriese documents the discussion and sells Maulbaum's GasExplorer shares, contrary to the \"strong buy\" recommendation.<\/p><p>At the end of the month, DeVriese receives a payment of $1,000 from Thunderland as a bonus for bringing over Maulbaum's portfolio from a competitor. The bonus arrangement is in line with company policy, and DeVriese does not disclose the arrangement to Maulbaum at their initial meeting, nor upon receipt of the payment. DeVriese's brother is one of Thunderland's largest clients. As a family member, DeVriese's brother obtained an exception to firm policy, whereby he does not pay any management fees on his account. An upcoming IPO is suitable for DeVriese's brother as well as a number of other clients. DeVriese requests 10,000 shares in total and plans to allocate 1,000 shares to his brother and the remainder to the other clients. However, he only receives 6,000 shares from the IPO allocation.<\/p><\/div><\/details><div class=\"qtext\"><p>Does DeVriese violate the Standards with regard to the bonus payment?<\/p><\/div>", "subj": "ethics"}, {"n": 40, "q": "To comply with the Standards, how many shares from the IPO should DeVriese allocate to his brother's account?", "opts": ["O", "600", "1,000"], "ans": "A", "expl": "A is correct. because DeVriese's brother does not pay any management fees. That means his account is managed outside the normal fee structure of the firm. Such accounts should not receive any allocation in the case of an oversubscribed IPO. According to Standard III(B) Fair Dealing, if the issue is oversubscribed, members and candidates should forego any sales to themselves or their immediate families in order to free up additional shares for clients. If the investment professional's family-member accounts are managed similarly to the accounts of other clients of the firm, however, the family-member accounts should not be excluded from buying such shares. DeVriese is correct in not allocating shares to his brother's account if that account is being managed outside the normal fee structure of the firm.", "explhtml": "<p><b>A is correct.<\/b> because DeVriese's brother does not pay any management fees. That<\/p><p>means his account is managed outside the normal fee structure of the firm. Such accounts should not receive any allocation in the case of an oversubscribed IPO. According to Standard III(B) Fair Dealing, if the issue is oversubscribed, members and candidates should forego any sales to themselves or their immediate families in order to free up additional shares for clients. If the investment professional's family-member accounts are managed similarly to the accounts of other clients of the firm, however, the family-member accounts should not be excluded from buying such shares. DeVriese is correct in not allocating shares to his brother's account if that account is being managed outside the normal fee structure of the firm.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Ethics · Albert De Vriese<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Albert DeVriese, CFA, is an investment adviser at Thunderland, a private wealth management firm. DeVriese meets with Donna Maulbaum, a potential new client. During his initial presentation, DeVriese provides performance information for a weighted composite of the portfolios that he managed over the previous ten years. These ten years include five years during which he worked at Blue Lantern, another private wealth management firm. In his presentation, DeVriese explains that the performance information: • is stated gross of fees and before taxes; • excludes terminated accounts; and • includes the performance data from his time as an investment adviser at Blue Lantern. Maulbaum is impressed and transfers her portfolio to an account at Thunderland. A few weeks later, DeVriese receives a report from Thunderland's research department on GasExplorer, a publicly listed company. The report upgrades the firm's recommendation on GasExplorer from \"hold\" to \"strong buy.\" DeVriese distributes the report to all of his clients via e-mail. Since Maulbaum, who already owns some GasExplorer stock, mentioned that she might transfer additional funds, DeVriese meets with her to discuss the report and to encourage her to increase her holdings in the stock. Maulbaum states that she is not interested in acquiring more shares. Instead, Maulbaum wants to sell her holdings in GasExplorer immediately because she needs liquidity for the purchase of a vacation home. DeVriese documents the discussion and sells Maulbaum's GasExplorer shares, contrary to the \"strong buy\" recommendation.<\/p><p>At the end of the month, DeVriese receives a payment of $1,000 from Thunderland as a bonus for bringing over Maulbaum's portfolio from a competitor. The bonus arrangement is in line with company policy, and DeVriese does not disclose the arrangement to Maulbaum at their initial meeting, nor upon receipt of the payment. DeVriese's brother is one of Thunderland's largest clients. As a family member, DeVriese's brother obtained an exception to firm policy, whereby he does not pay any management fees on his account. An upcoming IPO is suitable for DeVriese's brother as well as a number of other clients. DeVriese requests 10,000 shares in total and plans to allocate 1,000 shares to his brother and the remainder to the other clients. However, he only receives 6,000 shares from the IPO allocation.<\/p><\/div><\/details><div class=\"qtext\"><p>To comply with the Standards, how many shares from the IPO should DeVriese<\/p><p>allocate to his brother's account?<\/p><\/div>", "subj": "ethics"}, {"n": 41, "q": "The inclusion of Hemlock will increase Aspen's reported:", "opts": ["investments.", "plant and equipment.", "non-controlling interests."], "ans": "A", "expl": "A is correct. because both IFRS and US GAAP require the equity method of accounting for joint ventures. The equity method results in a single line item (equity in income of the joint venture) on the income statement and a single line item (investment in joint venture) on the balance sheet.", "explhtml": "<p><b>A is correct.<\/b> because both IFRS and US GAAP require the equity method of<\/p><p>accounting for joint ventures. The equity method results in a single line item (equity in income of the joint venture) on the income statement and a single line item (investment in joint venture) on the balance sheet.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 41–44 · Financial Statement Analysis · Shanice Booker<\/summary><div class=\"vig-body\"><p>Shanice Booker is an analyst at an equity fund and is reviewing the fund's holdings in the industrial sector. All of the companies report under IFRS. One of the companies, Aspen Co., recently announced two new investments. The first investment is a joint venture called Hemlock Ltd. Hemlock is expected to be profitable for both joint venture partners. Booker considers how including Hemlock will affect Aspen's financial statements. Aspen also purchased 70% of Maple Inc. Selected information on Maple's fixed assets at the time of acquisition is included below: • Fair value was estimated at €32 million, half of which is attributed to land and the other half is attributable to plant and equipment. • Plant and equipment had a carrying value of €10 million, a remaining useful life of 10 years, and no residual value. Both Maple and Aspen depreciate plant and equipment on a straight-line basis. Booker expects Maple to report earnings before tax of €3.5 million next year. Concerned about financial reporting quality, Booker uses the Beneish model to evaluate the likelihood of earnings manipulation. She considers the M1-scores
