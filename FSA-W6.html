<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "An automotive parts company manufactures specialty engine pistons and presents its financial statements using US GAAP. Due to manufacturing improvements, it estimates that its inventory is worth less than its carrying value. The relevant per-unit information for 20X8 is shown below: If this company uses LIFO, the per-unit cost for its 20X8 ending inventory is closest to:", "opts": ["$90", "$93", "$100"], "ans": "B", "expl": "US GAAP require companies using LIFO to report inventory at the lower of cost or market value. US GAAP define market value as\nreplacement cost, subject to upper and lower limits. The upper limit is net realizable value (ie, the selling price less costs to complete and sell\nthe inventory). The lower limit is net realizable value minus a normal profit margin.\nThe company's original cost is $105 per unit, which is higher than the $90 replacement cost, so this company must write down its inventory to\nmarket value. \"Market value\" is a range defined by the upper limit of net realizable value ($100) (Choice C) and the lower limit of net realizable\nvalue minus a normal profit margin ($100 - $7 = $93). The actual replacement cost ($90) is less than the lower limit ($93), so the company can\nwrite down its inventory to only $93 per unit.\n(Choice A) This is the company's actual replacement cost, but since it is less than the GAAP-specified lower limit of net realizable value minus a\nprofit margin, the company cannot reduce the inventory value below the lower limit of $93 per unit.\nThings to remember:\nCompanies using LIFO must carry inventory at the lower of cost or market value. Market value equals replacement cost but is subject to an upper\nand lower limit defined as net realizable value and net realizable value minus a normal profit margin.\nDescribe the measurement of inventory at the lower of cost and net realisable value and its implications for financial statements and ratios", "qhtml": null}, {"n": 2, "q": "In a period of increasing inventory costs, a company using FIFO instead of LIFO will most likely experience a lower:", "opts": ["current ratio.", "gross profit margin.", "inventory turnover ratio."], "ans": "C", "expl": "Changing inventory unit costs have different effects on a company's reported financials, depending on its inventory valuation method. With the\nFIFO method, the oldest units purchased are used in the calculation of cost of goods sold (COGS) whereas the most recent additions are used to\nvalue inventory. During periods of rising inventory costs, the most expensive units \"remain\" in inventory whereas the least expensive units are\nused for COGS. In comparison, a company using LIFO experiences a larger COGS and smaller inventory.\nA company's inventory turnover ratio measures its efficiency in managing its inventories. In periods of rising inventory costs, a company\nreporting with the FIFO method instead of LIFO will report lower COGS, which is the numerator of the inventory turnover ratio, and higher\ninventory, which is the denominator. Therefore, the company's inventory ratio will be lower using FIFO compared to LIFO.\n(Choice A) Current ratios are higher for companies reporting in FIFO during periods of rising inventory costs, since inventories are larger and\ncurrent liabilities are unchanged.\n(Choice B) Gross profit margins are higher for companies using FIFO during periods of rising inventory costs, since a lower COGS results in a\nhigher gross profit and revenue remains unchanged.\nThings to remember:\nSince a company using FIFO calculates its COGS with the oldest units purchased, during periods of rising inventory costs, the least expensive\nunits are used in COGS. This results in a lower COGS and a higher average inventory and, therefore, a lower inventory turnover ratio.\nCalculate and explain how inflation and deflation of inventory costs affect the financial statements and ratios of companies that use different\ninventory valuation methods", "qhtml": null}, {"n": 3, "q": "An analyst gathers the following data on two companies: Selected financial information In EUR (millions) Company A Company B Inventory valuation method LIFO FIFO Revenue (20X9) 1,300 2,200 COGS (20X9) 800 1,500 Gross profit (20X9) 500 700 Inventory (20X9) 145 280 Inventory (20X8) 115 265 LIFO reserve (20X9) 20 LIFO reserve (20X8) 35 Neither company has reported inventory shortages or write-downs. After the appropriate adjustments are made to compare the companies' financial data, Company A's inventory turnover is most likely: ", "opts": ["less than Company B's.", "the same as Company B's.", "greater than Company B's."], "ans": "A", "expl": "Two steps are required to allow for a comparison between Company A and Company B:\nConvert Company A's financial information from LIFO to FIFO, and then\ncalculate the inventory turnover of both companies.\nSince the two companies use different inventory valuation methods, Company A's inventory and COGS must be converted from LIFO to FIFO.\nThis is achieved with the LIFO reserve, a required disclosure for a company using LIFO. To convert Company A's ending inventory for a given\nperiod to FIFO, add the LIFO reserve for the same period to the inventory balance. To convert COGS, add the amount of decrease in the LIFO\nreserve over the period to the reported COGS.\nThe change in the LIFO reserve is calculated from a period's beginning and ending LIFO reserve. The adjustments to Company A's financial data\nare as follows:\nAfter Company A's data is converted to FIFO, the inventory turnover for both companies can be calculated and compared. Inventory turnover is\nthe ratio of COGS to average inventory (ie, the average number of times that the company sells and replenishes its inventory during a period).\nAdjusted financials (FIFO) Company A Company B\nRevenue 1,300 2,200\nCOGS 815 1,500\nGross profit 485 700\nInventory (20X9) 165 280\nInventory (20X8) 150 265\n815 / [(165 + 150) / 2] 1,500 / [(280 + 265) / 2]\nInventory turnover\n= 5.2 = 5.5\nConverting Company A's inventory and COGS to FIFO shows that the company has a lower inventory turnover than Company B (Choices B and\nC).\nThings to remember:\nTo convert a company's inventory balance from LIFO to FIFO, the LIFO reserve is added to the ending inventory balance. To convert the\ncompany's reported COGS from LIFO to FIFO, the decrease (increase) in the LIFO reserve is added to (subtracted from) COGS. After these\nadjustments are made, the company's inventory turnover is calculated as the ratio of COGS to average inventory.\nDescribe the presentation and disclosures relating to inventories and explain issues that analysts should consider when examining a company’s\ninventory disclosures and other sources of information", "qhtml": null}, {"n": 4, "q": "A clothing retailer reporting under IFRS purchased merchandise for £500,000 at the beginning of the year. Normally, the retailer could sell this inventory for £700,000, but now the estimated selling price is £510,000. The cost of selling the inventory is £15,000. Based on this information, the retailer's reported carrying value of inventory (in £ thousands) is closest to:", "opts": ["485", "495", "500"], "ans": "B", "expl": "Inventory may lose value due to spoilage, obsolescence, or declines in selling prices. Companies update their inventory values on the balance\nsheet to account for such events. IFRS require companies to report the carrying value of inventory at the lower of historic cost and net\nrealizable value (NRV). The NRV equals the estimated selling price minus the cost of completing and selling the inventory.\nIn this scenario, the estimated selling price is now 510 (in £ thousands). The selling cost is 15, so the NRV is 495 (510 − 15). Since the NRV is\nlower than the historical cost of 500, this inventory should be written down to the NRV of 495 on the balance sheet.\n(Choice A) 485 is the carrying value, not the selling price, less the selling cost.\n(Choice C) 500 is the historical cost of the inventory, but it is lower only if incorrectly compared to the selling price instead of the NRV.\nThings to remember:\nIFRS require companies to report the carrying value of inventory at the lower of historic cost and net realizable value (NRV). The NRV equals the\nestimated selling price minus the cost of completing and selling the inventory.\nDescribe the measurement of inventory at the lower of cost and net realisable value and its implications for financial statements and ratios", "qhtml": null}, {"n": 5, "q": "A company reporting under US GAAP and using FIFO assesses its inventory's net realizable value as being €200,000 less than its carrying value. The company records a write-down and increases COGS by €200,000. In the subsequent period, a new assessment of the inventory's net realizable value is €250,000 higher than its revised carrying value. The company's most appropriate action is to reduce COGS by:", "opts": ["€0", "€200,000", "€250,000"], "ans": "A", "expl": "Inventory write-downs and reversals\nWhen to When to reverse Maximum\nwrite down a write-down reversal\nUS GAAP Net realizable value Reversals\nN/A\n(FIFO, weighted average) < cost prohibited\nUS GAAP\nMarket value Reversals\n(LIFO, retail N/A\n< cost prohibited\ninventory)\nNet realizable value Net realizable value Amount of\nIFRS\n< cost > carrying value write-down\nInventory costs may decline due to spoilage, obsolescence, or reduced selling prices. Companies reporting under IFRS and US GAAP using any\ninventory valuation method other than the LIFO and retail inventory methods must value their inventory at the lower of cost and net realizable\nvalue. Net realizable value is the estimated selling price in the normal course of business less the costs to complete the sales of inventory.\nIf the net realizable value of a company's inventory becomes lower than its cost, the company must write down the inventory to its net\nrealizable value. At the same time, the company must increase COGS by the same amount. This becomes the inventory's new carrying value.\nUnder US GAAP, reversals of write-downs are prohibited. Therefore, in this scenario, the company should do nothing even though the net\nrealizable value of its inventory rose above its carrying cost following the write-down. It should not reduce COGS.\nUnder IFRS, write-downs can be reversed in subsequent periods if net realizable value rises above the new carrying value. However, a reversal\ncannot exceed the value of the write-down (Choices B and C).\nThings to remember:\nIf the net realizable value of a company's inventory becomes lower than its cost, the company must report a write-down and increase COGS by\nthe amount of the write-down. Under US GAAP, reversals of write-downs are prohibited.\nDescribe the measurement of inventory at the lower of cost and net realisable value and its implications for financial statements and ratios", "qhtml": null}, {"n": 6, "q": "A company that reports under US GAAP decides to change its inventory accounting from FIFO to LIFO. The change on its financial statements is most appropriately disclosed:", "opts": ["retroactively, including a restatement of prior years' financial statements.", "retroactively, without restating prior financial statements but disclosing the impact of the change to prior years' statements in footnotes.", "prospectively, without restating prior financial statements but disclosing the impact of the change to prior years' statements in footnotes."], "ans": "C", "expl": "Disclosure requirements: change in inventory costing methods\nChange reporting method to: US GAAP IFRS\nExplain why LIFO is superior\nLIFO Apply prospectively Not permitted\nNo restatement of prior statements\nExplain why new method is superior Must justify change\nAny other method Apply retrospectively Apply retrospectively\nRestatement of prior financials Restatement of prior financials\nOnly US GAAP permit companies to use LIFO. Switching from LIFO to any other method requires the company to explain why the new method\nis better than LIFO, and it must also restate prior financial statements as though it had used the new method in prior years (Choices A and B).\nOne reasonable explanation for switching from LIFO to FIFO is that it improves comparability between IFRS and GAAP reporting companies.\nWhen switching to LIFO from another method, US GAAP require the company to treat the change prospectively. It must disclose the reasons\nfor the change but is not required to restate prior financial statements. Although the CFA materials do not explain why no restatement is\nnecessary, there is no need to retroactively adjust comparisons since IFRS companies cannot use LIFO.\nThings to remember:\nUS GAAP impose more reporting requirements for companies that switch from LIFO to a different method. Switching to LIFO requires only\ndisclosure of the rationale for the change without restatement of prior financial statements.\nDescribe the presentation and disclosures relating to inventories and explain issues that analysts should consider when examining a company’s\ninventory disclosures and other sources of information", "qhtml": null}, {"n": 7, "q": "A manager collects information on a company's inventory for a period: Per-Unit Inventory USD Original cost 105 Selling price 140 Selling cost 10 Completion cost 30 Replacement cost 96 Normal profit margin 7 The company uses LIFO to calculate COGS. Based on only this information, under US GAAP, the per-unit value (in USD) for the existing inventory is closest to: ", "opts": ["96", "100", "105"], "ans": "A", "expl": "Inventory may lose value due to spoilage, obsolescence, or declines in selling prices. Companies often update their inventory values on the\nbalance sheet to account for such events. US GAAP require companies to report inventory at the lower of historical cost or market value (MV).\nWhen a company reports under US GAAP and uses LIFO as its inventory costing method, MV is the current replacement cost subject to an\nupper and lower limit.\nThe upper limit is the net realizable value (NRV), which is the selling price net of the costs to complete and sell the inventory. In this\nscenario, NRV = Selling price − Selling cost − Completion cost, so NRV = 140 − 10 − 30 = 100.\nThe lower limit is the NRV minus a normal profit margin. In this scenario, the lower limit is NRV − Normal profit margin = 100 − 7 = 93.\nMV is always the middle number of the replacement cost (RC), upper limit, and lower limit when ranked in order:\nIf RC > Upper > Lower, MV is the upper limit.\nIf Upper > RC > Lower, MV is the RC.\nIf Upper > Lower > RC, MV is the lower limit.\nIn this case, the MV is the RC of $96 per unit since it is within the upper and lower limits and is lower than the historical cost of the inventory.\n(Choice B) $100 is the upper limit for MV, which is capped at the upper limit only when RC exceeds the upper limit.\n(Choice C) $105 is the company's historical cost. The inventory's NRV is lower than its historical cost, so the NRV should be reported.\nThings to remember:\nCompanies that report under US GAAP should report inventory at the lower of historical cost or market value. When a company uses LIFO,\nmarket value is the lower of net realizable value, which is the sales price net of the costs to complete and sell the inventory, and net realizable\nvalue minus a normal profit margin.\nDescribe the measurement of inventory at the lower of cost and net realisable value and its implications for financial statements and ratios", "qhtml": null}, {"n": 8, "q": "In 20X7, a company wrote down its inventory from £30 million to £28.7 million. In 20X8, a global shortage of this product results in the inventory having a net realizable value of £35 million. Under IFRS, the company's revaluation of inventory to reflect its increased value is closest to:", "opts": ["£0", "£1.3 million", "£6.3 million"], "ans": "B", "expl": "Inventory write-downs and revaluations\nUS GAAP IFRS\nLower of cost or net realizable value (FIFO) Lower of cost or net realizable value (LIFO not permitted\nLower of cost or market value (LIFO) under IFRS)\nMarket value equals replacement cost but with an upper and lower limit Revaluations in future periods permitted\nUpper limit: net realizable value Revaluations limited to amount of all previous write-\nLower limit: net realizable value less normal profit margin downs (except for agricultural, forest, and mineral\nRevaluations generally NOT permitted products)\nIFRS, unlike GAAP, permit upward revaluation of inventory if the net realizable value increases. With very few exceptions, upward revaluation\nis limited to the amount of all previous write-downs. Further, the maximum value for the inventory is its original cost.\nThis company wrote down its inventory by £1.3 million to reflect its reduced value. Although the value has sharply increased, the amount of\nrevaluation is limited to the previous £1.3 million reduction. This brings the inventory's value back to its original cost of £30 million.\n(Choice A) This would be the case under US GAAP, which do not permit upward revaluations to previously written-down inventory except for\nagricultural, forest, and mineral products.\n(Choice C) IFRS limit revaluation of inventory to the original cost, even if the future net realizable value exceeds the original cost. For\nagricultural, forest, and mineral products, revaluations can exceed the original cost.\nThings to remember:\nIFRS require inventory to be carried at the lower of cost or net realizable value. Revaluations are permitted if net realizable value increases in\nfuture periods but are generally limited to the amount of all previous write-downs.\nDescribe the measurement of inventory at the lower of cost and net realisable value and its implications for financial statements and ratios", "qhtml": null}, {"n": 9, "q": "When inventory costs are declining, a company using FIFO will most likely experience:", "opts": ["a lower current ratio.", "a higher gross profit margin.", "an increase in working capital."], "ans": "A", "expl": "FIFO (first-in, first-out) inventory costing means that a company is deemed to have sold its older inventory first. When inventory costs fall, older\ninventory is valued higher than more recently purchased inventory. The older inventory is included in the cost of goods sold (COGS), so a higher-\nvalued inventory equals higher COGS. Gross profit is the difference between revenues and COGS, so a higher COGS translates to lower profits.\nWhen older inventory is sold first, ending inventory consists of the more recent purchases. With falling inventory costs, more recent purchases are\nless costly than the older ones, so ending inventory is worth less than beginning inventory. Inventory is a current asset, and the current ratio is\ncalculated as current assets divided by current liabilities. A lower ending inventory value means a lower value for both current assets and the\ncurrent ratio.\n(Choice B) Since COGS is higher when inventory costs fall (using FIFO), gross profit is lower, not higher. The gross profit margin is equal to\ngross profit divided by revenues, so the gross profit margin is also less.\n(Choice C) Working capital is the difference between current assets and current liabilities. A lower inventory value results in lower working\ncapital.\nThings to remember:\nWhen inventory costs fall, a company using FIFO experiences lower profits due to the higher cost of goods sold. Ending inventory has less value\nthan beginning inventory under FIFO, since ending inventory consists of more recent purchases that cost less than older purchases.\nCalculate and explain how inflation and deflation of inventory costs affect the financial statements and ratios of companies that use different\ninventory valuation methods", "qhtml": null}, {"n": 10, "q": "An engineering company manufactures high-end automotive accessories. It reports under US GAAP and uses LIFO. The company is replacing its inventory for the coming year and has determined that its existing inventory has become obsolete. An analyst gathers the following information: Per-Unit Inventory USD Original cost 105 Selling price 150 Replacement cost 96 Net realizable value 100 Normal profit margin 7 The per-unit value that the company reports for the existing inventory is closest to: ", "opts": ["$96", "$100", "$110"], "ans": "A", "expl": "US GAAP require companies using LIFO to report inventory at the lower of historic cost or market value. US GAAP define market value as\nreplacement cost (subject to upper and lower limits). The upper limit is net realizable value, which equals the selling price minus costs to\ncomplete and sell the inventory. The lower limit is net realizable value minus a normal profit margin.\nWhen the replacement cost falls between the two limits, as is the case here, then it is used as the market value, which is then compared to the\nhistoric cost. The diagram below illustrates this concept:\n(Choice B) $100 represents the upper bound for market value. This would be the correct answer if the replacement cost were higher than the\ninventory's net realizable value.\n11.A company that reports under IFRS is valuing its year-end inventory. It has collected the following information (in CHF millions):\nHistoric cost 175\nReplacement cost 165\nSelling price 240\nCost to sell inventory 60\nBased on this data, the inventory value (in CHF millions) reported on its balance sheet is closest to:\nA. 165\n\nB. 175\nC. 180\nExplanation\nInventory is initially recorded on a company's balance sheet at historic cost. However, companies are required to regularly reassess this value. If\nthe inventory's value falls below its cost (eg, spoils, becomes obsolete, declines in selling price), the company must write down the inventory to\nreflect the new, lower value, which becomes the carrying value.\nIFRS require companies to report the carrying value of inventory at the lower of cost or net realizable value (NRV). The NRV is the estimated\nselling price less the cost of completing and selling the inventory.\nIn this scenario, the NRV of the inventory is CHF 180 million (240 − 60). This is higher than the cost of 175, so no write down is taken and the\ninventory remains at 175.\n(Choice A) 165 is the replacement value, which is not used by IFRS in valuing inventory. The replacement value is used by companies reporting\nunder US GAAP and using LIFO or retail inventory methods when valuing inventory.\n(Choice C) 180 is the NRV, which is greater than the historical cost. Since inventory is required to be valued at the lower of cost and NRV, the\ncompany would not be permitted to increase the value of its inventory above 175.\nThings to remember:\nIFRS require companies to report the carrying value of inventory at the lower of cost or net realizable value (NRV). The NRV is the estimated\nselling price less the costs of completing and selling the inventory.\nDescribe the measurement of inventory at the lower of cost and net realisable value and its implications for financial statements and ratios", "qhtml": null}, {"n": 11, "q": "A company that reports under IFRS is valuing its year-end inventory. It has collected the following information (in CHF millions): Historic cost 175 Replacement cost 165 Selling price 240 Cost to sell inventory 60 Based on this data, the inventory value (in CHF millions) reported on its balance sheet is closest to:", "opts": ["165", "175", "180"], "ans": "B", "expl": "Inventory is initially recorded on a company's balance sheet at historic cost. However, companies are required to regularly reassess this value. If\nthe inventory's value falls below its cost (eg, spoils, becomes obsolete, declines in selling price), the company must write down the inventory to\nreflect the new, lower value, which becomes the carrying value.\nIFRS require companies to report the carrying value of inventory at the lower of cost or net realizable value (NRV). The NRV is the estimated\nselling price less the cost of completing and selling the inventory.\nIn this scenario, the NRV of the inventory is CHF 180 million (240 − 60). This is higher than the cost of 175, so no write down is taken and the\ninventory remains at 175.\n(Choice A) 165 is the replacement value, which is not used by IFRS in valuing inventory. The replacement value is used by companies reporting\nunder US GAAP and using LIFO or retail inventory methods when valuing inventory.\n(Choice C) 180 is the NRV, which is greater than the historical cost. Since inventory is required to be valued at the lower of cost and NRV, the\ncompany would not be permitted to increase the value of its inventory above 175.\nThings to remember:\nIFRS require companies to report the carrying value of inventory at the lower of cost or net realizable value (NRV). The NRV is the estimated\nselling price less the costs of completing and selling the inventory.\nDescribe the measurement of inventory at the lower of cost and net realisable value and its implications for financial statements and ratios", "qhtml": null}, {"n": 12, "q": "Which of the following types of ratio will most likely be positively affected by an inventory write-down?", "opts": ["Activity", "Liquidity", "Profitability"], "ans": "A", "expl": "Companies write down the carrying value of inventory on the books due to spoilage, obsolescence, or reductions in selling prices. When a\nwrite-down occurs, the company decreases inventory on the balance sheet and increases COGS on the income statement, both by the amount of\nthe write-down. These adjustments have a negative impact on liquidity and profitability ratios and an artificially positive impact on activity ratios.\nActivity ratios measure efficiency. One common example is inventory turnover (or COGS / Inventory), which measures the average number of\ntimes a company sells its average inventory over a period. After a write-down, the ratio becomes higher since an inventory write-down increases\nCOGS (numerator) and decreases inventory (denominator). This makes a company appear to be more efficient at turning its inventory into sales.\nAnalysts should be aware of the impact of such practices and make appropriate adjustments when analyzing financial reports.\n(Choice B) Liquidity ratios measure a company's ability to cover short-term obligations. They commonly consist of current assets (including\ninventory) in the numerator and current liabilities in the denominator. Decreasing inventory value reduces the numerator, which worsens the ratio.\n(Choice C) Profitability ratios measure a type of profit as a fraction of revenue. Write-downs increase COGS, an expense, thereby decreasing all\ntypes of profitability.\nThings to remember:\nWhen a company writes down inventory, it decreases inventory on the balance sheet and increases COGS on the income statement, both by the\namount of the write-down. These adjustments have a negative impact on liquidity and profitability ratios and an artificially positive impact on\nactivity ratios.\nDescribe the measurement of inventory at the lower of cost and net realisable value and its implications for financial statements and ratios", "qhtml": null}, {"n": 13, "q": "A manufacturing company that uses LIFO under US GAAP shows the following inventory-related information at the end of 20X8: Based on this data, the inventory amount reported on the balance sheet (in $ millions) is closest to:", "opts": ["70", "75", "95"], "ans": "B", "expl": "Inventory may lose value due to spoilage, obsolescence, or declines in selling prices. Companies often update their inventory values on the\nbalance sheet to account for such events. US GAAP require companies using LIFO to report inventory at the lower of historic cost or market\nvalue (MV).\nMV is defined as the current replacement cost (RC) subject to an upper and lower limit.\nThe upper limit is the net realizable value (NRV), which equals the selling price minus costs to complete and sell the inventory. In this\nscenario, the upper limit (NRV) equals the selling price (110) minus the completion cost (15), or 95.\nThe lower limit is the NRV minus a normal profit margin. In this scenario, the lower limit equals NRV (95) minus a normal profit margin (20),\nor 75.\nThe MV is 75 since the RC of 70 is subject to a lower limit of 75 (ie, cannot fall below 75). Since the company must record inventory at the lower\nof cost or market, it must update its inventory amount on the balance sheet to 75.\nNote: MV is always the middle number of the RC, upper limit, and lower limit, when ranked in order:\nIf RC > Upper > Lower, MV is the upper limit.\nIf Upper > RC > Lower, MV is the RC.\nIf Upper > Lower > RC, MV is the lower limit.\n(Choice A) 70 results from not imposing a lower limit of 75 on the RC.\n(Choice C) 95 is the NRV, which is the upper limit.\nThings to remember:\nUS GAAP require companies using LIFO to report inventory at the lower of historic cost or market value (MV). MV is defined as the replacement\ncost subject to an upper and lower limit. The upper limit is the net realizable value (NRV), which equals the selling price minus completion and\nselling costs. The lower limit is NRV minus a normal profit margin.\nDescribe the measurement of inventory at the lower of cost and net realisable value and its implications for financial statements and ratios", "qhtml": null}, {"n": 14, "q": "Unlike companies that comply with US GAAP, a company reporting under IFRS can disclose in its financial statements the amount of:", "opts": ["LIFO reserves.", "an inventory write-down.", "a reversal of an inventory write-down."], "ans": "C", "expl": "Inventory constitutes a large percentage of total assets for many companies and can significantly impact revenue, expenses (ie, cost of sales),\nand liquidity. As such, companies provide inventory-related disclosures in financial statements to better explain reporting methods and trends.\nOne important category of disclosure relates to reversals of previously written down inventory, which is permitted under IFRS only. In general,\na write-down occurs when an inventory item's market value falls below its carrying value on the balance sheet. A write-down increases expenses\n(cost of sales) and lowers profits. Any subsequent reversals of write-downs will allow companies to recapture these lost profits.\n(Choice A) LIFO reporting is allowed under US GAAP, not IFRS. LIFO reserves measure the difference between ending inventory value\nmeasured under FIFO and LIFO and are reported only for US GAAP companies.\n(Choice B) Companies using both US GAAP and IFRS disclose information related to inventory write-downs.\nThings to remember:\nReversals of inventory write-downs are permitted under IFRS only. These reversals allow companies to recapture lost profits from previous write-\ndowns.\nDescribe the presentation and disclosures relating to inventories and explain issues that analysts should consider when examining a company’s\ninventory disclosures and other sources of information", "qhtml": null}, {"n": 15, "q": "A company reporting under US GAAP has both increasing inventory levels and increasing inventory unit costs. Which inventory valuation method most likely results in the lowest days of inventory on hand? ", "opts": ["LIFO", "FIFO", "Weighted average cost"], "ans": "A", "expl": "Rising and falling inventory unit costs will have different effects on a company's reported financials depending on its inventory valuation method.\nWith the LIFO method, during periods of rising costs and steady-to-increasing inventory quantities, the most expensive inventory is included in a\ncompany's COGS, resulting in a higher COGS when compared to other inventory methods. In addition, ending inventory is lower since the least\nexpensive units remain in inventory.\nA company's days of inventory on hand is equal to 365 days in a year divided by the company's inventory turnover ratio. The more frequently a\ncompany turns over its inventory, the fewer days it remains on hand.\nSince a company using LIFO has a higher COGS and lower inventory, its inventory turnover is higher. Days of inventory are inversely affected\nsince inventory turnover is the denominator. Therefore, days of inventory on hand are lower for a company using LIFO compared to a company\nusing FIFO during a period of rising inventory costs (Choice B).\n(Choice C) Using the weighted average cost method results in an amount of COGS between LIFO and FIFO. Therefore, using this method, days\nof inventory on hand are not the lowest of the given methods.\nThings to remember:\nIn periods of rising costs and steady-to-increasing inventory, LIFO results in a higher COGS, lower ending inventory, and lower days of inventory\non hand compared to other inventory valuation methods.\nCalculate and explain how inflation and deflation of inventory costs affect the financial statements and ratios of companies that use different\ninventory valuation methods", "qhtml": null}];
const CFG = {"title": "Wiley · Analysis of Inventories", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Financial Statement Analysis · 15 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";

      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
