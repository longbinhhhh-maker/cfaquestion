<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n":1,"q":"Which of the following companies would most likely be considered to have the lowest\nfinancial reporting quality other things equal?","opts":["A company that provides high quality, decision useful information under GAAP but delays its reports.","A company that reports significant profits due to a favorable exchange rate movement","A company that reports the results from two different segments as a combined entity."],"ans":"C","expl":"A. Không chính xác vì Các báo cáo của công ty có giá trị khai thác cao, nhưng sự chậm trễ trong việc báo cáo đã làm giảm phần nào tính hữu ích của chúng\n. Báo cáo vẫn tốt hơn báo cáo thiên vị.\nB. Không chính xác vì Đây là một ví dụ về quyết định thông tin hữu ích về một kết quả có thể không bền vững\n. Báo cáo không có chất lượng cao nhất nhưng tốt hơn báo cáo thiên vị\nC. Đúng vì Kết hợp các kết quả từ hai phân đoạn là một ví dụ về báo cáo sai lệch,\nthất bại ở giữa phạm vi chất lượng. Rất khó để giải thích khả năng sinh lời của từng phân đoạn\nkhi kết quả của chúng được kết hợp\nPhân tích Báo cáo Tài chính: mô tả một phạm vi để đánh giá chất lượng báo cáo tài chính","qhtml":null},{"n":2,"q":"Which of the following is lowest quality on the spectrum of GAAP conforming financial\nreports?","opts":["Aggressive accounting choices","Earnings management","Conservative accounting choices"],"ans":"B","expl":"A. Không chính xác vì kế toán tích cực là một lựa chọn sai lệch. Các lựa chọn kế toán thiên vị\ncó chất lượng cao hơn so với quản lý thu nhập trên phạm vi các báo cáo tài chính\ntuân theo GAAP.\nB. Đúng vì Quản lý thu nhập thể hiện các hành động có chủ ý nhằm tác động đến thu nhập được báo cáo\nvà cách giải thích chúng. Sự khác biệt giữa quản lý thu nhập và các lựa chọn thiên vị\nrất tinh tế và chủ yếu là vấn đề về mục đích.\nC. Không chính xác vì kế toán thận trọng là một sự lựa chọn thiên vị. Các lựa chọn kế toán sai lệch có\ncó chất lượng cao hơn so với quản lý thu nhập trên phạm vi các báo cáo tài chính\ntuân theo GAAP.\nPhân tích báo cáo tài chính: mô tả một phạm vi đánh giá chất lượng báo cáo tài chính","qhtml":null},{"n":3,"q":"Analyst would mostly conduct additional analysis i en laced will which of the following\nfinancial presentations?","opts":["A non-GAAP financial measure that excludes an expense that is likely to recur","Reporting a non-GAAP financial measure in an SEC filing","A change from LIFO inventory accounting to FIFO"],"ans":"A","expl":"A. Đúng vì Việc loại trừ các mục định kỳ khỏi các biện pháp tài chính không phải GAAP bị SEC nghiêm cấm\nvà sẽ làm dấy lên mối lo ngại rằng cần phải phân tích\nbổ sung\nB. Không chính xác vì Nếu một công ty sử dụng các thước đo không phải GAAP trong hồ sơ SEC, thì công ty đó phải hiển thị\nđo lường GAAP so sánh với mức độ nổi bật tương đương và cung cấp sự đối chiếu giữa\nhai\nC. Không chính xác vì Báo cáo LIFO cung cấp đầy đủ thông tin trong Ghi chú để chuyển đổi từ LIFO sang\nFIFO để một thay đổi chính thức sẽ không làm thay đổi quan điểm của nhà phân tích về công ty.\nPhân tích báo cáo tài chính: Mô tả các lựa chọn trình bày, bao gồm các biện pháp không phải GAAP, el\ncó thể được sử dụng để tác động đến kết quả của nhà phân tích","qhtml":null},{"n":4,"q":"Under International Financial Reporting Standards (IFRS) reported operating cash flows are\nmost likely to be increased by the classification choice made for","opts":["impairment losses on fixed assets","dividends paid","Interest expense"],"ans":"C","expl":"A. Không chính xác vì IFRS không chính xác không cho phép phân loại các khoản lỗ do suy giảm giá trị thành bất kỳ thứ gì khác ngoài\ndòng tiền hoạt động\nB. Không chính xác vì IFRS cho phép phân loại cổ tức được trả dưới dạng tiền hoạt động hoặc tiền tài trợ\nTuy nhiên, khi cổ tức được trả được trình bày dưới dạng dòng tiền hoạt động, tiền hoạt động được báo cáo\ndòng chảy thấp hơn.\nC. Đúng vì IFRS cho phép phân loại chi phí lãi vay thành chi phí hoạt động hoặc chi phí tài chính\ndòng tiền. Khi chi phí lãi vay được trình bày dưới dạng dòng tiền tài trợ, tiền hoạt động được báo cáo\ndòng chảy cao hơn.\nPhân tích báo cáo tài chính: mô tả các phương pháp kế toán (lựa chọn và ước tính) có thể được áp dụng\nđược sử dụng để quản lý thu nhập, dòng tiền và các mục trong bảng cân đối kế toán","qhtml":null},{"n":5,"q":"In the Porter's five forces framework a company is most likely to have the greatest\nprofitability if","opts":["the threat of substitutes is low and the bargaining power of buyers is low","the threat of substitutes is low and the bargaining power of buyers is high.","The threat of substitutes is high and the bargaining power of buyers is low."],"ans":"A","expl":"A. Đúng vì cả sự sẵn có thấp của các sản phẩm thay thế và khả năng thương lượng thấp của người mua\nsẽ cải thiện khả năng định giá của công ty\nB. Không chính xác vì mức độ cạnh tranh cao sẽ bù đắp tác động tích cực của mối đe dọa thấp về những sản phẩm thay thế\n.\nC. Không chính xác vì sự sẵn có cao của các sản phẩm thay thế sẽ có tác dụng bù đắp tác động tích cực của\nkhả năng thương lượng thấp của người mua\nPhân tích báo cáo tài chính: giải thích vị thế cạnh tranh của một công ty dựa trên a\nPhân tích năm lực lượng của Porter ảnh hưởng đến giá cả và chi phí","qhtml":null},{"n":6,"q":"Which of the following conditions conducive to issuing low-quality financial reports is most\nlikely a result of poor internal controls","opts":["Rationalization","Opportunity","Motivation"],"ans":"B","expl":"A. Không chính xác vì Việc hợp lý hóa không chính xác diễn ra sau khi hành vi báo cáo có chất lượng thấp được thực hiện và\ntâm lý của các cá nhân để biện minh cho hành động của họ. Kiểm soát nội bộ kém không phải là một\nquá trình tâm lý\nB. Đúng vì Kiểm soát nội bộ kém tạo cơ hội cho sai sót hoặc gian lận xuất hiện trong\nbáo cáo tài chính mà không bị xóa\nC. Không chính xác vì Động lực xuất phát từ áp lực cá nhân hoặc áp lực của công ty trong việc báo cáo về một\ncơ sở chất lượng thấp. Kiểm soát nội bộ kém tạo điều kiện cho việc báo cáo chất lượng thấp\ncó thể được che giấu, không phải là động cơ cho nó.\nPhân tích báo cáo tài chính: mô tả các động cơ có thể khiến ban quản lý đưa ra quyết định\ncác báo cáo tài chính không có chất lượng cao và các điều kiện thuận lợi cho việc phát hành báo cáo tài chính có giá trị thấp.\nchất lượng, hoặc thậm chí lừa đảo","qhtml":null},{"n":7,"q":"Maintaining prior views or forecasts by inadequately incorporating new information best\ndescribes","opts":["conservatism bias","overconfidence bias","representativeness bias"],"ans":"A","expl":"A. Đúng vì chủ nghĩa bảo thủ trong đó mọi người duy trì quan điểm hoặc dự đoán trước đó của họ bằng cách\nkết hợp không đầy đủ thông tin mới\nB. Không chính xác vì sự thiên vị quá tự tin xảy ra khi mọi người thể hiện niềm tin không chính đáng vào\nkhả năng của chính họ\nC. Không chính xác vì thành kiến mang tính đại diện đề cập đến xu hướng phân loại thông tin dựa trên\nkinh nghiệm trong quá khứ và các phân loại đã biết\nBáo cáo tài chính : giải thích các yếu tố hành vi ảnh hưởng như thế nào đến các dự báo phân tích của nhà phân tích và\nđề xuất các hành động khắc phục đối với thành kiến của nhà phân tích","qhtml":null},{"n":8,"q":"For a company in a cyclical industry, normalized earnings are best described as","opts":["current earnings that include the impact of acquisitions","mid-cycle earnings in the absence of temporary factors.","earnings from the peak years excluding temporary factors"],"ans":"B","expl":"A. Không chính xác vì thu nhập được chuẩn hóa sẽ loại bỏ tác động của các yếu tố tạm thời và các sự kiện\nbất thường, chẳng hạn như hoạt động mua lại.\nB. Đúng vì thu nhập bình thường hóa là mức thu nhập dự kiến ​​giữa chu kỳ của một công ty\ntrong trường hợp không có bất kỳ yếu tố bất thường hoặc tạm thời nào ảnh hưởng đến lợi nhuận.\nC. Không chính xác vì thu nhập chuẩn hóa dựa trên thu nhập giữa chu kỳ chứ không phải thu nhập\nnăm cao điểm.\nPhân tích báo cáo tài chính: giải thích những cân nhắc trong việc lựa chọn dự báo bùng nổ Fonzon\nvà lựa chọn của nhà phân tích trong việc phát triển các dự đoán ngoài phạm vi dự báo ngắn hạn","qhtml":null},{"n":9,"q":"Porter's five forces analysis is used to estimate a company's future profit margin relate to.","opts":["only its competitors","only its historic margins.","both its competitors and its historic margins"],"ans":"C","expl":"A. Không chính xác vì khung năm lực lượng cạnh tranh và các công cụ phân tích của Porter có thể giúp các nhà phân tích đánh giá\ntiềm năng lợi nhuận tương đối của một công ty bằng cách giúp các nhà phân tích ước tính liệu tỷ suất lợi nhuận\ncó thể tương đối cao hay thấp (so với tỷ suất lợi nhuận lịch sử và so với\ncác công ty cạnh tranh).\nB. Không chính xác vì khung năm lực lượng của Porter và các công cụ phân tích tương tự có thể giúp các nhà phân tích\nđánh giá tiềm năng lợi nhuận tương đối của một công ty bằng cách giúp các nhà phân tích ước tính liệu tỷ suất lợi nhuận\ncó thể tương đối cao hay thấp (so với tỷ suất lợi nhuận lịch sử và so với\ncác công ty cạnh tranh).\nC. Đúng vì khung lực lượng trực tiếp của Porter và các công cụ phân tích tương tự có thể giúp các nhà phân tích\nđánh giá tiềm năng lợi nhuận tương đối của một công ty bằng cách giúp họ hiểu được ngành\ncủa công ty và vị trí của nó trong ngành. Việc hiểu biết về ngành và bối cảnh\ncạnh tranh của một công ty giúp các nhà phân tích ước tính liệu, ví dụ, tăng trưởng doanh số có thể\ntương đối cao hay thấp (so với lịch sử, so với mức tăng trưởng chung trong nền kinh tế hoặc một\nngành và/hoặc so với các công ty cạnh tranh) và liệu biên lợi nhuận có thể\ntương đối cao hay thấp (so với tỷ suất lợi nhuận lịch sử và tương đối) cho các công ty cạnh tranh)\nPhân tích báo cáo tài chính: giải thích vị thế cạnh tranh của một công ty dựa trên a\nNăm lực lượng của Porter cho biết ảnh hưởng đến giá cả và chi phí","qhtml":null},{"n":10,"q":"An analyst uses the following information to forecast a company's gross profit margin:\nCurrent Amount (in $ millions) Forecasted Growth\nSales 1200 8%\nCost of sales 300 4%\nThe analysts forecasted gross profit margin should be closest to a(n)","opts":["decrease of 1%.","increase of 1%","increase of 4%."],"ans":"B","expl":"A. Không chính xác vì nó tính tỷ suất lợi nhuận gộp dưới dạng giá vốn hàng bán/doanh thu. Tỷ suất lợi nhuận gộp\nhiện tại là 25% (300/1.200) và tỷ suất lợi nhuận gộp dự báo là 24,1% (312 / 1.296) và\ngiảm khoảng 1%.\nB. Đúng vì lợi nhuận gộp của năm hiện tại là 900 (=1.200-300) do đó\nbiên lợi nhuận gộp hiện tại là 75% Nếu doanh thu tăng 8% (lên 1.296) và giá vốn hàng bán tăng\n4% (lên 312), lợi nhuận gộp dự báo là 984 (=1.295-312) và lợi nhuận gộp dự báo\nlề là 75,9%. Đây là mức tăng khoảng 1% (=75,9% -75%)\nC. Không chính xác vì nó giả định các giá trị ban đầu có cùng cơ sở và có sự khác biệt\nvề tốc độ tăng trưởng, 4% = tăng trưởng doanh thu - chi phí tăng trưởng doanh thu\nPhân tích báo cáo tài chính: chứng minh sự phát triển của mô hình công ty theo quy ước dựa trên doanh số","qhtml":null},{"n":11,"q":"The price elasticity of demand for a product is 0.5 and its cost remains constant, a 10%\nincrease is selling price will most likely result in.","opts":["no change in cost of sales","a decrease in volume of 5%","an increase in revenue of 5%"],"ans":"B","expl":"A. Không chính xác vì tác động của giá cao hơn đến số lượng phụ thuộc vào độ co giãn của cầu\ntheo giá (Le., lượng cầu thay đổi như thế nào theo giá). Vì khối lượng sẽ giảm nên giá vốn\nhàng bán cũng sẽ giảm.\nB. Đúng vì tác động của giá cao hơn lên số lượng phụ thuộc vào độ co giãn của cầu\ntheo giá (tức là lượng cầu thay đổi như thế nào theo giá). Độ co giãn của cầu theo giá tác động\nđến khối lượng chứ không phải tổng doanh thu đối với một mức tăng giá nhất định. Hơn nữa,\nNhà phân tích A dự kiến ​​mức giá cố định là 0,5, khối lượng sẽ giảm 0% khi giá bán lẻ tăng 10\n%.\nC. Không chính xác vì tác động của giá cao hơn đến số lượng phụ thuộc vào độ co giãn của cầu\ntheo giá (le, lượng cầu thay đổi như thế nào theo giá). Độ co giãn của cầu theo giá\ntác động đến khối lượng chứ không phải tổng doanh thu đối với một mức tăng giá nhất định\nPhân tích báo cáo tài chính: giải thích cách dự báo doanh thu và chi phí của ngành và công ty\nkhi chúng bị lạm phát hoặc giảm phát giá","qhtml":null},{"n":12,"q":"All else being equal, forecasting an increase in which of the following will most likely\nincrease forecasted EPS for a company?","opts":["Share repurchases","Secondary stock issuances","Equity based compensation of employees"],"ans":"A","expl":"A. Đúng vì việc mua lại cổ phiếu làm giảm số lượng cổ phiếu đang lưu hành. Việc giảm\nsố lượng cổ phiếu đang lưu hành sẽ làm tăng EPS ở mức bằng nhau\nB. Không chính xác vì việc phát hành cổ phiếu thứ cấp làm tăng số lượng cổ phiếu đang lưu hành. Việc\nsố lượng cổ phiếu đang lưu hành tăng lên sẽ làm giảm EPS ở mức tương đương.\nC. Không chính xác vì việc tăng thù lao dựa trên vốn chủ sở hữu làm tăng số lượng cổ phiếu\nđang lưu hành. Số lượng cổ phiếu đang lưu hành tăng lên sẽ làm giảm EPS tất cả mọi thứ\nbằng nhau\nPhân tích báo cáo tài chính: chứng minh sự phát triển của mô hình công ty pro forma\ndựa trên doanh số","qhtml":null},{"n":13,"q":"Analyst gathers the following information (in € millions) relating to a company's\nmerchandise inventory as of 31 December of Year 1.\nCost 65\nNet realizable value 60\nCurrent placement cost 58\nOn 31 December of Year 2, the net realizable value of the inventory is € 7 higher than iít\ncarrying value. Under US GAAP, the amount (in millions) of the reversal of the prior write\ndown is","opts":["0","5","7"],"ans":"A","expl":"A. Đúng vì GAAP của Hoa Kỳ cấm đảo ngược việc ghi giảm\nB. Không chính xác vì đây là sự đảo ngược theo IFRS. Hàng tồn kho sẽ được đo lường (và ghi\ntrên bảng cân đối kế toán) ở mức thấp hơn giữa giá gốc và giá trị thuần có thể thực hiện được. Việc đảo ngược (giới hạn ở\nsố tiền ghi giảm ban đầu) là cần thiết để tăng giá trị hàng tồn kho\nđã ghi lại trước đó. Việc hoàn nhập khoản ghi giảm hàng tồn kho được ghi nhận là một\ngiảm giá vốn hàng bán (giảm số lượng hàng tồn kho được ghi nhận là chi phí). Khoản ghi giảm\ntrong Năm 1 là 5 triệu (chi phí €55 - giá trị thuần có thể thực hiện được là €60). Việc đảo ngược\nđược giới hạn ở mức ghi giảm ban đầu là 5 triệu. Theo CAAP của Hoa Kỳ, việc đảo ngược việc ghi giảm bị cấm\nc bị cấm\nC. Không chính xác vì và là số tiền hoàn nhập được phép nếu ứng viên tính toán sai\ngiá trị ghi giảm ban đầu là 7 triệu (65 chi phí – 58 chi phí thay thế hiện tại) theo IFRS. Đây cũng là\nbản ghi ban đầu chính xác theo US GAAP, giả sử hàng tồn kho được đo bằng LIFO hoặc\nphương pháp kiểm kê bán lẻ. Ngoài ra, đó là số tiền mà giá trị thuần có thể thực hiện được vượt quá\ngiá trị ghi sổ tại ngày 31 tháng 12 năm thứ 2. Tuy nhiên, theo GAAP của Hoa Kỳ, việc đảo ngược việc ghi giảm là\nbị cấm.","qhtml":null},{"n":14,"q":"An analyst gathers the following year-end information from a company's financial\nstatements\nYear 1 Year 2\nAccounts receivable €3 million €1 million\nAccounts payable €2 million €5 million\nBased only on this information, if Year 2 net income is €3 million and the Year 1 ending cash\nbalance is €10 million the Year 2 ending cash balance is:","opts":["€8 million","€12 million","€15 million"],"ans":"A","expl":"A. Đúng vì thu nhập ròng €3.000.000 sẽ cần được điều chỉnh cho\nthu nhập/chi phí tích lũy bắt nguồn từ thay đổi trong khoản thu hồi tài khoản và tài khoản phải trả.\nsự gia tăng trong các khoản phải thu được trừ khỏi thu nhập ròng và sự sụt giảm trong các tài khoản\nphải trả cũng được trừ vào thu nhập ròng.\nThay đổi về tiền mặt = Thu nhập ròng - tăng các khoản phải thu - giảm các khoản phải trả --\n€2.000.000\nThay đổi về tiền mặt = €3.000.000 - €2.000.000 - €3.000.000 = - €2.000.000\nSố dư tiền mặt cuối kỳ = Số dư tiền mặt cuối năm 2011 + thay đổi tiền mặt = €10.000.000 - €2.000.000 =\n€8.000.000","qhtml":null},{"n":15,"q":"A company Incurred the following expenditures (in € millions) to internally develop\nIntangible asset:\nCosts incurred during the research phase 900\nCosts incurred during the development phase 600\nIf the recognition criteria for an intangible asset have been met, the maximum amount of\ncapitalized costs (in millions) is","opts":["600","900.","1,500"],"ans":"A","expl":"A. Đúng vì 500 triệu euro thể hiện chi phí phát sinh trong giai đoạn phát triển\ncần được viết hoa. Chi phí phát sinh trong giai đoạn phát triển có thể được vốn hóa thành\ntài sản vô hình nếu đáp ứng một số tiêu chí nhất định, bao gồm tính khả thi về công nghệ, khả năng sử dụng\nhoặc bán tài sản thu được và khả năng hoàn thành dự án.\nB. Không chính xác vì 900 triệu euro thể hiện chi phí cần thiết trong giai đoạn nghiên cứu. IFRS\nyêu cầu chi tiêu cho nghiên cứu hoặc trong giai đoạn nghiên cứu của một dự án nội bộ phải được\nchi trả thay vì được vốn hóa.\nC. Không chính xác vì 1.500 triệu Euro là tổng chi phí phát sinh trong giai đoạn nghiên cứu và\nphát triển. Nó bao gồm chi phí 900 triệu euro phát sinh trong giai đoạn nghiên cứu mà\nsẽ được tính vào chi phí. Chỉ nên vốn hóa 600 triệu euro được vốn hóa dưới dạng tài sản vô hình phát sinh trong\ngiai đoạn phát triển.\nPhân tích báo cáo tài chính: so sánh báo cáo tài chính của các loại\ntài sản vô hình sau: mua hàng, phát triển nội bộ và mua lại khi hợp nhất kinh doanh","qhtml":null},{"n":16,"q":"Compared to the industry average, which of the following financial ratio most likely\nindicates a company has a highly efficient credit and collection process? A relatively low.","opts":["receivables turnover ratio","number of days sales outstanding","number of days of inventory on hand"],"ans":"B","expl":"A. Không chính xác vì tỷ lệ vòng quay khoản phải thu tương đối cao (và DSO tương ứng thấp)\ncó thể cho thấy tín dụng và thu nợ hiệu quả cao\nB. Đúng vì tỷ lệ vòng quay khoản phải thu tương đối cao (và DSO tương ứng thấp)\ncó thể cho thấy tín dụng và thu nợ có hiệu quả cao\nC. Không chính xác vì DOH thấp có thể cho thấy một công ty bán hàng tồn kho hiệu quả, nhưng nó\nkhông đo lường thời gian cần thiết để thu thập từ doanh số bán hàng của mình. Số DSO thể hiện\nthời gian trôi qua giữa việc bán hàng và thu tiền mặt, phản ánh tốc độ công ty thu tiền mặt\ntừ những khách hàng mà công ty cung cấp tín dụng. Tỷ lệ vòng quay các khoản phải thu tương đối cao (và\nDSO tương đối thấp) có thể cho thấy tín dụng và thu nợ\nPhân tích báo cáo tài chính hiệu quả cao: tính toán và giải thích hoạt động, tính thanh khoản, khả năng thanh toán và khả năng sinh lời\ntỷ lệ","qhtml":null},{"n":17,"q":"Under the indirect method of reporting cash flow from operating actives, a decrease\ndeferred income tax liabilities is","opts":["ignored","added back to net income","subtracted from net income."],"ans":"C","expl":"A. Không chính xác vì bất kể nguồn gốc của nghĩa vụ thuế thu nhập hoãn lại là gì, tất cả các thay đổi\ntrong thuế thu nhập hoãn lại phải trả sẽ được cộng lại hoặc trừ vào thu nhập ròng theo\nphương pháp báo cáo tiền mặt gián tiếp từ hoạt động\nB. Không chính xác vì việc tăng thuế thu nhập hoãn lại phải trả sẽ là khoản bổ sung vào thu nhập ròng\nphương pháp báo cáo dòng tiền gián tiếp từ hoạt động kinh doanh.\nC. Đúng vì khoản giảm thuế thu nhập hoãn lại phải trả sẽ được trừ khỏi thu nhập ròng\ntheo phương pháp báo cáo dòng tiền từ hoạt động kinh doanh gián tiếp.\nPhân tích báo cáo tài chính: mô tả các bước lập báo cáo lưu chuyển tiền tệ trực tiếp và gián tiếp\n, bao gồm cách tính toán dòng tiền bằng cách sử dụng Báo cáo thu nhập và\ndữ liệu bảng cân đối kế toán","qhtml":null},{"n":18,"q":"With respect to company analysis, measures of inventory management are best described\nat.","opts":["activity ratios","solvency ratios.","profitability ratios."],"ans":"A","expl":"A. Đúng vì tỷ lệ hoạt động đo lường mức độ hiệu quả của công ty thực hiện các công việc hàng ngày,\nnhư thu hồi các khoản phải thu và quản lý hàng tồn kho.\nB. Không chính xác vì tỷ lệ khả năng thanh toán đo lường khả năng đáp ứng các nghĩa vụ dài hạn của công ty.\nCác tập hợp con của các tỷ lệ này còn được gọi là tỷ lệ “đòn bẩy” và “nợ dài hạn”.\nC. Không chính xác vì Tỷ suất lợi nhuận không chính xác đo lường khả năng tạo ra lợi nhuận của công ty từ hoạt động kinh doanh của mình.\nnguồn lực (tài sản)\nPhân tích báo cáo tài chính: tính toán và giải thích hoạt động, tính thanh khoản, khả năng thanh toán và lợi nhuận\ntỷ lệ","qhtml":null},{"n":19,"q":"A disclaimer of opinion is issued when an auditor","opts":["is unable to issue an opinion","notes an exception to accounting standards.","finds a material departure from accounting standards."],"ans":"A","expl":"A. Đúng vì việc từ chối đưa ra ý kiến ​​xảy ra khi kiểm toán viên không thể đưa ra ý kiến\nB. Không chính xác vì ý kiến ​​đã được thẩm định (chứ không phải là từ chối đưa ra ý kiến) sẽ\nthích hợp trong trường hợp có một số giới hạn phạm vi hoặc ngoại lệ đối với quan điểm kế toán.\nC. Không chính xác vì ý kiến ​​trái ngược (chứ không phải từ chối đưa ra ý kiến) sẽ\nthích hợp nếu kiểm toán viên xác định rằng báo cáo tài chính về cơ bản khác với\nchuẩn mực kế toán và không được trình bày một cách công bằng.\nPhân tích báo cáo tài chính: mô tả tầm quan trọng của hồ sơ pháp lý, báo cáo tài chính\ncác quy tắc và thông tin bổ sung, bình luận của ban quản lý và báo cáo kiểm toán","qhtml":null},{"n":20,"q":"Which of the following most likely indicates improved efficiency of a company’s credit,\nand collection policy? An increase in","opts":["receivables turnover ratio","days of sales outstanding","number of days of payables"],"ans":"A","expl":"A. Đúng vì vòng quay khoản phải thu tương đối cao (và DSO tương ứng thấp) có thể\ncho thấy tín dụng và thu nợ hiệu quả cao.\nB. Không chính xác vì tỷ lệ vòng quay khoản phải thu tương đối cao (và DSO tương ứng thấp)\ncó thể cho thấy hoạt động tín dụng và thu nợ hiệu quả cao.\nC. Không chính xác vì số ngày phải trả phản ánh số ngày trung bình mà\ncông ty phải trả để thanh toán cho nhà cung cấp của mình và không liên quan đến các khoản phải thu hoặc hiệu quả của\ntín dụng hoặc thu nợ của công ty.\nPhân tích báo cáo tài chính: tính toán và diễn giải hoạt động, tính thanh khoản, khả năng thanh toán và\ntỷ lệ lợi nhuận","qhtml":null},{"n":21,"q":"An analyst gathers the following information (in € millions) about a manufacturing\ncompany\nCost of sales 150\nGross profit: 100\nSelling, general, and administrative expenses 30\nBased only on this information, applying vertical common size analysis to the income\nstatement, selling, general and administrative expenses are:","opts":["12%.","20%","30%"],"ans":"A","expl":"A. Đúng vì báo cáo thu nhập có kích thước thông thường theo chiều dọc chia mỗi báo cáo thu nhập\ntem cho doanh thu. Lợi nhuận gộp là số doanh thu có được sau khi trừ đi chi phí\ngiao hàng hóa hoặc dịch vụ. Theo đó, chỉ dựa trên thông tin này, theo phân tích quy mô\nthông thường theo chiều dọc, chi phí bán hàng, chi phí chung và hành chính có thể được biểu thị bằng\n= Chi phí bán hàng, chi phí chung và hành chính / Doanh thu\n= Chi phí bán hàng, chi phí chung và hành chính / (Tổng tiền lãi + Chi phí bán hàng) –\n= 30/(100 + 150)\n; hoặc = 30/250 ~ 12%\nB. Không chính xác vì nó thể hiện chi phí bán hàng, chi phí chung và chi phí quản lý dưới dạng phần trăm của\nChi phí bán hàng. Do đó, Chi phí bán hàng chung và chi phí quản lý/Chi phí bán hàng = 30/150\n= 20%\nC. Không chính xác vì nó thể hiện chi phí bán hàng, chi phí chung và chi phí quản lý dưới dạng phần trăm\ncủa Lợi nhuận gộp: Do đó, Chi phí bán hàng và chi phí quản lý chung/Lợi nhuận gộp =\n30/100 = 30%.\nPhân tích báo cáo tài chính: hiệu quả hoạt động nhân sự của một công ty sử dụng báo cáo thu nhập quy mô comme\nvà các tỷ số tài chính dựa trên báo cáo thu nhập","qhtml":null},{"n":22,"q":"Which of the following is most likely added back to net income when preparing a cash\nflow statement under the Indirect method?","opts":["Gains on sale of assets","Amortization of bond discount","Decrease in deferred tax liability"],"ans":"B","expl":"A. Không chính xác vì lãi từ việc bán tài sản là một khoản mục không hoạt động được tính vào thu nhập ròng\ntính toán. Vì vậy, lãi từ việc bán tài sản phải được trừ đi, không được cộng lại vào số tiền ròng.\nthu nhập khi lập báo cáo lưu chuyển tiền tệ theo phương pháp gián tiếp.\nB. Đúng vì khấu hao khoản chiết khấu (cao cấp) của một khoản mục không dùng tiền mặt và do đó, ngoài\nảnh hưởng của nó đến thu nhập chịu thuế, không ảnh hưởng đến dòng tiền trong phần báo cáo tiền tệ\ncác dòng điều hòa thu nhập ròng với dòng tiền hoạt động, khấu hao khoản chiết khấu (phí bảo hiểm) là\nđược cộng lại vào (trừ đi) thu nhập ròng.\nC. Không chính xác vì việc giảm thuế thu nhập hoãn lại phải trả xảy ra khi chi phí thuế kế toán được tính\nthấp hơn số tiền mặt nộp thuế thu nhập. Vì vậy, mức giảm phải\nđược trừ vào thu nhập ròng khi lập báo cáo lưu chuyển tiền tệ theo phương pháp gián tiếp\nphương pháp.\nPhân tích báo cáo tài chính: mô tả chi tiết các bước lập tiền trực tiếp và gián tiếp\nbáo cáo thấp bao gồm cách tính toán dòng tiền bằng cách sử dụng báo cáo thu nhập và số dư\ntấm mèo","qhtml":null},{"n":23,"q":"With respect to the statement of cash flows under the indirect method, which of the\nFollowing will increase net cash provided by operating activities compared to net income? An\nincrease in","opts":["inventory","accounts payable","accounts receivable"],"ans":"B","expl":"A. Không chính xác vì việc tăng lượng hàng tồn kho sẽ làm tăng số lượt mua hàng từ nhà cung cấp so với\ngiá vốn hàng bán để xác định số lần mua hàng từ nhà cung cấp, giá vốn hàng bán được điều chỉnh theo\nthay đổi trong hàng tồn kho. Nếu hàng tồn kho tăng trong năm thì số lượng mua hàng trong năm\nvượt quá giá vốn hàng bán và ngược lại.\nB. Đúng vì khoản phải trả tăng lên có nghĩa là số tiền được thanh toán ít hơn số tiền\nmua từ nhà cung cấp. Nếu các khoản phải trả tăng trong năm thì các giao dịch mua hàng\ncơ sở dồn tích sẽ cao hơn so với mua hàng trên cơ sở tiền mặt và ngược lại\nC. Không chính xác vì khoản phải thu tăng lên có nghĩa là số tiền thu được ít hơn số tiền\nđã bán. Để xác định số tiền thu được gần đúng từ khách hàng, cần phải điều chỉnh số tiền doanh thu\n này theo thay đổi ròng trong các khoản phải thu trong năm. Nếu các khoản phải thu\ntăng trong năm, doanh thu trên cơ sở dồn tích sẽ cao hơn số tiền nhận được từ\nkhách hàng và ngược lại.\nPhân tích báo cáo tài chính: mô tả các bước lập báo cáo lưu chuyển tiền tệ trực tiếp và gián tiếp\n, bao gồm cách tính toán dòng tiền bằng cách sử dụng báo cáo thu nhập và\ndữ liệu bảng cân đối","qhtml":null},{"n":24,"q":"Ignoring income taxes, acquiring an intangible asset would most likely result in","opts":["a lower net operating cash flow than internally developing the intangible asset","the same net operating cash flow than internally developing the intangible asset","a higher net operating cash flow than internally developing the intangible asset"],"ans":"C","expl":"A. Không chính xác vì việc mua tài sản vô hình là một hoạt động đầu tư trong khi\nphát triển nội bộ tài sản vô hình có thể là sự kết hợp giữa hoạt động điều hành và hoạt động đầu tư. Chi phí\ncó được tài sản vô hình được phân loại là dòng tiền đầu tư ra. IFRS yêu cầu\nchi tiêu cho nghiên cứu (hoặc trong giai đoạn nghiên cứu của một dự án nội bộ) phải được tính vào chi phí\nthay vì được vốn hóa như một tài sản vô hình. IFRS cho phép các công ty tận dụng tài sản\nvô hình phát sinh từ quá trình phát triển (hoặc giai đoạn phát triển của một dự án nội bộ) nếu đáp ứng được một số\ntiêu chí nhất định, bao gồm việc chứng minh tính khả thi về mặt kỹ thuật của việc hoàn thiện tài sản\nvô hình và ý định sử dụng hoặc bán tài sản đó. Do đó, việc mua lại một tài sản vô hình sẽ\ndẫn đến dòng tiền chi ra từ hoạt động kinh doanh thấp hơn so với việc phát triển tài sản vô hình trong nội bộ (vì\nsau này sẽ dẫn đến dòng tiền chi từ hoạt động tăng lên trong giai đoạn nghiên cứu)\nB. Không chính xác vì việc mua tài sản vô hình là một hoạt động đầu tư trong khi\nphát triển nội bộ tài sản vô hình có thể là sự kết hợp giữa hoạt động điều hành và hoạt động đầu tư. Trên\nbáo cáo lưu chuyển tiền tệ, chi phí phát triển nội bộ tài sản vô hình được phân loại là\ndòng tiền ra từ hoạt động kinh doanh trong khi chi phí để có được tài sản vô hình được phân loại là đầu tư\ndòng tiền ra\nC. Đúng vì mua tài sản vô hình là một hoạt động đầu tư trong khi\nphát triển nội bộ một tài sản vô hình có thể là sự kết hợp giữa hoạt động điều hành và hoạt động đầu tư. Trên\nbáo cáo lưu chuyển tiền tệ, chi phí phát triển nội bộ tài sản vô hình được phân loại là\ndòng tiền hoạt động trong khi chi phí mua tài sản vô hình được phân loại là dòng tiền đầu tư\n. Chi phí để có được tài sản vô hình được phân loại là dòng tiền đầu tư ra. IFRS\nyêu cầu chi tiêu cho nghiên cứu (hoặc trong giai đoạn nghiên cứu của một dự án nội bộ) phải được\nchi trả thay vì được vốn hóa như một tài sản vô hình. IFRS cho phép các công ty ghi nhận\ntài sản vô hình phát sinh từ quá trình phát triển (hoặc giai đoạn phát triển của một dự án nội bộ) nếu\nđáp ứng một số tiêu chí nhất định, bao gồm việc chứng minh khả năng kỹ thuật để hoàn thành\ntài sản vô hình và ý định sử dụng hoặc bán tài sản","qhtml":null},{"n":25,"q":"Which of the following is most accurate with respect to inherent limitations of audit?","opts":["An audit opinion is based on review of information only prepared by the auditor","An audit is based on an exhaustive review of all transactions during a financial year","An expectations gap may exist between the auditor's rule and the public's expectation of auditors"],"ans":"C","expl":"A. Không chính xác vì quá trình kiểm tra dựa trên việc xem xét thông tin do công ty cung cấp chứ không phải\nkiểm toán viên. Mặc dù ý kiến ​​kiểm toán đưa ra nguyên tắc về chất lượng báo cáo tài chính nhưng vẫn tồn tại những hạn chế cố hữu\n. Ý kiến ​​kiểm toán dựa trên việc xem xét thông tin do công ty chuẩn bị.\nB. Không chính xác vì quá trình kiểm toán dựa trên việc lấy mẫu chứ không phải xem xét toàn diện tất cả các giao dịch.\nMặc dù ý kiến ​​kiểm toán đưa ra kỷ luật về chất lượng báo cáo tài chính nhưng vẫn tồn tại những hạn chế cố hữu\n. Quá trình kiểm tra dựa trên việc lấy mẫu và mẫu có thể không phát hiện sai sót.\nC. Đúng vì mặc dù ý kiến ​​kiểm toán đưa ra nguyên tắc về chất lượng báo cáo tài chính nhưng\n vẫn tồn tại những hạn chế cố hữu. Có thể tồn tại “khoảng cách kỳ vọng” giữa vai trò của kiểm toán viên và\nkỳ vọng của công chúng đối với kiểm toán viên. Kiểm toán thường không nhằm mục đích phát hiện gian lận mà nhằm mục đích\nđể đảm bảo rằng báo cáo tài chính được trình bày công bằng.\nPhân tích báo cáo tài chính: mô tả các cơ chế kỷ luật về chất lượng báo cáo tài chính\nvà những hạn chế tiềm ẩn của các cơ chế đó.","qhtml":null},{"n":26,"q":"An analyst gathers the following Information about a company for its fiscal year ended 31\nDecember\nNet income €80,000\nCommon dividends declared are paid €16,000\nPreferred dividends declared and paid €10,000\nWeighted average common shares outstanding 150,000\nCommon shares outstanding at year end 130,000\nBasic EPS is closest to","opts":["€0.36.","€0.47.","€0.54."],"ans":"B","expl":"A. Không chính xác vì nó làm giảm thu nhập ròng của tài khoản cổ tức phổ thông và cổ tức ưu đãi.\nEPS cơ bản & (Thu nhập ròng - Cổ tức phổ thông - Cổ tức ưu đãi) / số bình quân gia quyền\nsố cổ phiếu đang lưu hành) = (€80.000 - €16.000 - €10.000) / 150 000 = €0,36.\nB. Đúng vì EPS cơ bản (Thu nhập ròng - Cổ tức ưu đãi)/(Số bình quân gia quyền của\ncổ phiếu đang lưu hành) = (€80.000-€10.000)/150.000 = 0,47\nC. Không chính xác vì nó sử dụng số cổ phiếu phổ thông đang lưu hành cuối năm làm mẫu số.\nEPS cơ bản = €80.000 - €10.000) / 130.000 = €0,54\nPhân tích Báo cáo Tài chính: mô tả cách tính và tính toán thu nhập trên mỗi cổ phiếu và\ndiễn giải thu nhập cơ bản và lãi suy giảm trên mỗi cổ phiếu của công ty đối với các công ty có mô hình đơn giản và\ncơ cấu vốn phức tạp bao gồm cả những cơ cấu có chứng khoán có tính suy giảm suy giảm.","qhtml":null},{"n":27,"q":"Which of the following opinions is the best indication that the auditor believes that the financial statements depart materially from accounting standards and are not fairly presented?","opts":["Adverse opinion","Qualified opinion","Disclaimer of opinion"],"ans":"A","expl":"A. Đúng vì ý kiến ​​trái ngược (ý kiến ​​​​bất lợi) được đưa ra khi kiểm tra viên kết luận báo cáo tài chính sai lệch yếu yếu so với chuẩn mực kế toán và không được trình bày trung thực, hợp lý.\nB. Không chính xác vì ý kiến ​​ngoại trừ (ý kiến ​​đủ điều kiện) chỉ ra một số ngoại lệ/hạn chế nhưng phần còn lại của báo cáo vẫn hiển thị trung thực.\nC. Không chính xác vì từ chối đưa ra ý kiến ​​kiến ​​trúc (tuyên bố từ chối trách nhiệm) xảy ra khi kiểm tra viên không thể thu thập đủ bằng chứng để đưa ra ý kiến, không phải khi phát hiện sai lệch trọng yếu."},{"n":28,"q":"An analyst gathers the following information about a company.\nPayables turnover 8\nInventory turnover 2\nReceivables over 10\nIf all purchases and sales were made on credit, the cash conversion cycle (based on a 360-day\nyear) is","opts":["99 days.","171 days.","251 days."],"ans":"B","expl":"A. Không chính xác vì DSO đã bị trừ để lấy CCC. Theo đó, CCC = DCH – DEO -\nSố ngày phải trả = 180 – 36 - 45 = 99 ngày.\nB. Đúng vì Chu kỳ chuyển đổi tiền mặt (CCC) = DOH + DSO - Số ngày phải trả.\nDOH = Số ngày trong kỳ/ Vòng quay hàng tồn kho = 360/2 = 180 ngày.\nDSO = Số ngày trong kỳ/ Vòng quay khoản phải thu-360/10 = 36 ngày.\nDNSố ngày của các trang thanh toán Số ngày trong kỳ /Vòng quay khoản phải trả = 360/8 = 45 ngày\nDo đó CCC = 180+36-45 = 171 ngày\nC. Không chính xác vì Số ngày phải trả đã được thêm vào để lấy CCC Theo đó CCC =\nDCH + DRO + Số ngày phải trả = 180+36 +45 =261 ngày\nPhân tích báo cáo tài chính: tính toán và giải thích hoạt động, tính thanh khoản, khả năng thanh toán và khả năng sinh lời\ntỷ lệ","qhtml":null},{"n":29,"q":"An analyst gathers the following information (in $ thousands) about a company\nNet income 10,000\nGain on debt retirement 500\nDecrease in working capital 2,000\nCash flow from operating activities (in $ thousands) is","opts":["$8,500.","$11,500.","$12,000."],"ans":"B","expl":"A. Không chính xác vì nó đảo ngược tất cả các ký hiệu và tính toán Tiền mặt hiện có từ hoạt động kinh doanh =\nThu nhập ròng – Giảm vốn lưu động + Lãi khi nghỉ hưu từ nợ = 10.000 -2.000 + 500 -\n8.500\nB. Đúng vì dòng tiền từ hoạt động kinh doanh = Thu nhập ròng + Giảm vốn lưu động\n - Lãi khi nghỉ hưu do nợ = 10.000+2000-500 = 11.500.\nC. Không chính xác vì nó đảo ngược dấu hiệu thu nhập khi nghỉ hưu bằng nợ và tính toán Dòng tiền\ntừ hoạt động kinh doanh = Thu nhập ròng + Giảm vốn lưu động + Thu nhập khi nghỉ hưu từ\nnợ = 10.000 + 2.000 – 500 = 12.500\nPhân tích báo cáo tài chính: mô tả các bước chuẩn bị tiền mặt trực tiếp và gián tiếp\nbáo cáo luồng tiền, bao gồm cách tính toán luồng tiền bằng cách sử dụng báo cáo Thu nhập và\ndữ liệu bảng cân đối kế toán","qhtml":null},{"n":30,"q":"Which of the following may be reported using the modified retrospective method?","opts":["Corrections of prior period errors","Changes in estimated useful life of PP&E","Changes in accounting policies based on the new revenue recognition standard"],"ans":"C","expl":"A. Không chính xác vì việc sửa lỗi cho kỳ trước được xử lý bằng cách trình bày lại\nbáo cáo tài chính bao gồm bảng cân đối kế toán được trình bày về vốn chủ sở hữu và\nbáo cáo lưu chuyển tiền tệ cho các kỳ trước, được trình bày trong báo cáo tài chính hiện tại dưới dạng\nhiện hành. Do đó, nó sử dụng “phương pháp hồi cứu đầy đủ” yêu cầu các công ty trình bày lại\nkết quả của các kỳ trước\nB. Không chính xác vì những thay đổi ước tính kế toán được xử lý hồi cứu, với sự thay đổi\nảnh hưởng đến báo cáo tài chính trong khoảng thời gian có thay đổi và các kỳ trong tương lai.\nC. Đúng vì đôi khi những người thiết lập tiêu chuẩn ban hành các tiêu chuẩn mới yêu cầu các công ty\nthay đổi chính sách kế toán. Tùy thuộc vào tiêu chuẩn, các công ty có thể được phép áp dụng\ncác tiêu chuẩn này trong tương lai (trong tương lai) hoặc hồi tố (trình bày lại báo cáo tài chính như\nmặc dù tiêu chuẩn đã tồn tại trong quá khứ) trong khi tiêu chuẩn ghi nhận doanh thu mới cũng\ncung cấp cho các công ty tùy chọn sử dụng phương pháp áp dụng hồi cứu đã được sửa đổi. Theo\ncách tiếp cận hồi cứu đã sửa đổi, các công ty không bắt buộc phải sửa đổi các báo cáo tài chính\nđã báo cáo trước đó. Thay vào đó, họ điều chỉnh số dư đầu kỳ của thu nhập giữ lại (và\ncác tài khoản áp dụng khác) để đối phó với Tác động tích lũy của tiêu chuẩn mới.\nPhân tích báo cáo tài chính: mô tả cách xử lý báo cáo tài chính và phân tích các khoản mục không phải\nđịnh kỳ (bao gồm các hoạt động đã ngừng, các khoản mục bất thường hoặc không thường xuyên) và những thay đổi trong\nchính sách kế toán.","qhtml":null},{"n":31,"q":"An analyst gathers the following information (in millions) about a company before any\nrevaluations:\nAverage total assets 20\nAverage total liabilities 0\nAverage total equity 12\nQ. An initial revaluation increases the carrying value of the asset valued under the\nrevaluation model. Ignoring taxes, the financial leverage ratio most way","opts":["decreases","remains the same.","increases"],"ans":"A","expl":"A. Đúng vì việc đánh giá lại tăng lên được xử lý giống như số tiền vượt quá số tiền đảo ngược\n. Nói cách khác, nếu việc đánh giá lại ban đầu làm tăng giá trị ghi sổ của loại tài sản\nthì sự gia tăng trong loại tài sản ghi sổ sẽ bỏ qua báo cáo kết quả hoạt động kinh doanh và đi thẳng\nvào vốn chủ sở hữu dưới tiêu đề thặng dư đánh giá lại. Tỷ lệ đòn bẩy tài chính là\ntổng tài sản trung bình chia cho tổng vốn chủ sở hữu trung bình. Việc tăng cả tử số (tài sản) và\nmẫu số (vốn chủ sở hữu) lên cùng một lượng sẽ dẫn đến giảm (Về mặt toán học, khi a\ntỷ lệ lớn hơn 1, như trong trường hợp này, cả tử số và\nmẫu số tăng cùng một lượng sẽ dẫn đến giảm tỷ lệ)\nB. Không chính xác vì đòn bẩy là tổng tài sản trung bình chia cho vốn chủ sở hữu trung bình của cổ đông\n, việc tăng cả tử số (tài sản) và mẫu số (vốn chủ sở hữu) lên cùng một lượng\ndẫn đến giảm tỷ lệ (Về mặt toán học, khi tỷ lệ lớn hơn một, như trong trường hợp này,\nviệc tăng cả tử số và mẫu số đều dẫn đến giảm\ntheo tỷ lệ).\nC. Không chính xác vì đòn bẩy là tổng tài sản trung bình chia cho vốn chủ sở hữu trung bình của cổ đông, việc tăng cả tử số (tài sản) và mẫu số (vốn chủ sở hữu) lên cùng một lượng\ndẫn đến giảm tỷ lệ (Về mặt toán học, khi tỷ lệ lớn hơn một, như trong trường hợp này,\ncả tử số và mẫu số tăng cùng một lượng sẽ dẫn đến giảm\ntheo tỷ lệ).","qhtml":null},{"n":32,"q":"An analyst gathers the following information (in € thousands) about a company\nNet Income 143\nGain on sale of equipment 20\nDecrease in accounts receivable 38\nCash flow from operating activities (in € thousands) is","opts":["85","161.","201."],"ans":"B","expl":"A. Không chính xác vì việc giảm các khoản phải thu đã được khấu trừ thay vì được thêm vào\nDo đó, dòng tiền từ hoạt động kinh doanh = Thu nhập ròng - lãi từ việc bán thiết bị -\ngiảm các khoản phải thu = 143 - 20 – 38 = 85.\nB. Đúng vì những thay đổi trong tài khoản vốn lưu động bao gồm tăng và giảm trong tài khoản nợ và tài sản hoạt động hiện tại. Để thực hiện điều chỉnh vốn lưu động theo\nphương pháp gián tiếp, mọi khoản tăng trong tài khoản tài sản hoạt động hiện tại đều được trừ khỏi thu nhập\nròng và mức giảm ròng sẽ được cộng vào thu nhập ròng. Khi tính toán dòng tiền hoạt động theo\nphương pháp gián tiếp, lợi nhuận từ việc bán tài sản được tính từ thu nhập ròng. Theo đó, dòng tiền\ndòng tiền từ hoạt động kinh doanh Thu nhập ròng thu được từ việc bán thiết bị + giảm các tài khoản\nphải thu = 143-20+38 = 161\nC. Không chính xác vì lợi nhuận từ việc bán thiết bị đã được thêm vào thay vì được khấu trừ khỏi thu nhập\nròng. Do đó, dòng tiền từ hoạt động kinh doanh = Thu nhập ròng + lãi bán\nthiết bị giảm các khoản phải thu= 143 +20 +36 =201","qhtml":null},{"n":33,"q":"Under US GAAP and all else being equal in a period of stable inventory quantities and\nrising inventory unit costs. Which inventory valuation method is least likely to incur inventory\nwrite downs?","opts":["FIFO","LIFO","Weighted average cost"],"ans":"B","expl":"A. Không chính xác vì các công ty sử dụng phương pháp nhận dạng cụ thể, chi phí trung bình có trọng số hoặc phương pháp FIFO\ncó nhiều khả năng ghi giảm hàng tồn kho hơn, sau đó so sánh sử dụng phương pháp LIFO\n\nB. Đúng vì các công ty sử dụng phương pháp nhận dạng cụ thể, chi phí trung bình có trọng số hoặc phương pháp FIFO\ncó nhiều khả năng ghi giảm hàng tồn kho hơn so với các công ty sử dụng phương pháp LIFO\n. Theo phương pháp LIFO, chi phí cũ nhất được phản ánh trong số lượng\nhàng tồn kho trên bảng cân đối kế toán. Do chi phí hàng tồn kho ngày càng tăng, số lượng tồn kho trong kho\ntheo phương pháp LIFO đã được trình bày một cách thận trọng với chi phí cũ nhất và thấp nhất.\nDo đó, khả năng ghi giảm hàng tồn kho sẽ xảy ra theo LIFO sẽ ít hơn rất nhiều và nếu xảy ra việc ghi giảm\nthì nó có thể ở mức độ nhỏ hơn.\nC. Không chính xác vì các công ty sử dụng phương pháp nhận dạng cụ thể, chi phí trung bình có trọng số hoặc phương pháp FIFO\ncó nhiều khả năng ghi giảm hàng tồn kho hơn những công ty sử dụng phương pháp LIFO\n.","qhtml":null},{"n":34,"q":"Which of the following analyses can be used to compare a company's financial ratios with\nthose of its major competitors?","opts":["Trend only","Cross-sectional only","Both trend and cross sectional"],"ans":"C","expl":"A. Không chính xác vì cả phân tích xu hướng và phân tích cắt ngang đều được sử dụng để so sánh các tỷ số tài chính\ncủa một công ty với các đối thủ cạnh tranh. Nói chung, các tỷ số tài chính của một công ty\nđược so sánh với các tỷ số tài chính của các đối thủ cạnh tranh chính của nó (phân tích chéo và xu hướng) và với\nphân tích xu hướng các giai đoạn trước của công ty)\nB. Không chính xác vì cả phân tích xu hướng và phân tích cắt ngang đều được sử dụng để so sánh các tỷ số tài chính\ncủa công ty với các đối thủ cạnh tranh. Nhìn chung, các tỷ số tài chính của một công ty\nđược so sánh với các tỷ số tài chính của các đối thủ cạnh tranh chính (phân tích mặt cắt ngang và xu hướng) và với\nphân tích xu hướng các giai đoạn trước của công ty).\nC. Đúng vì cả hai loại phân tích đều được sử dụng để so sánh các chỉ số tài chính của công ty với\ncủa các đối thủ cạnh tranh. Nói chung, các tỷ số tài chính của một công ty được so sánh với\ncủa các đối thủ cạnh tranh chính (phân tích chéo và xu hướng) và với các kỳ trước của công ty\n(phân tích xu hướng).\nPhân tích báo cáo tài chính: tính toán và giải thích hoạt động, tính thanh khoản, khả năng thanh toán và khả năng sinh lời\ntỷ lệ","qhtml":null},{"n":35,"q":"An analyst gathers the following information about a company's fiscal year ended 31\nDecember\nNet income $210,000\nCommon shares outstanding on 1 January 50.000\nCommon shares repurchased on 1 April 20.000\nIf a 2-for-1 stock split took effect on 1 July, basic EPS for the year is","opts":["$3.00.","$3.50.","$4.20."],"ans":"A","expl":"A. Đúng vì EPS cơ bản = (Thu nhập ròng – Cổ tức ưu đãi) / Số lượng trung bình có trọng số\ncủa số cổ phiếu đang lưu hành = ($210.000 - $0) / [(50.000 × 3/12) + (30.000 × 9/12) * 2] = ($210.000) /\n[(12.500 + 22.500)*2] = 210.000 USD / 700,00 = 3,00 USD.\nB. Không chính xác vì nó tính toán không chính xác số lượng cổ phiếu trung bình có trọng số\nđang lưu hành.\nC. Không chính xác vì nó cũng tính toán sai số lượng cổ phiếu bình quân gia quyền đang lưu hành.","qhtml":null},{"n":36,"q":"An analyst gathers the following information about two companies in thousands)\nCompany 1 Company 2\nRevenue 7,586,000 9,445,000\nCost of goods sold 3,413,700 4,533,600\nResearch and development expense 1,800,000 1,800,000\nAdvertising expense 531,020 755,600\nBased only on the companies' common size income statements, it appears that","opts":["Company 1 spent more on advertising than Company 2","both companies spent equally on research and development","Company 1 has a higher gross profit margin than Company 2."],"ans":"C","expl":"C. Đúng vì có thể thực hiện phân tích quy mô chung của báo cáo thu nhập bằng cách nêu\ntừng mục hàng trên báo cáo thu nhập dưới dạng phần trăm doanh thu. Theo đó. Tỷ suất lợi nhuận gộp\ncủa Công ty I (7.586.000- 3,413.700) / 7.586.000 = 55%, cao hơn tỷ suất lợi nhuận gộp\ncủa Công ty 2 là (9.445.000-4.533.600) / 9.445.000 = 52%.\nPhân tích báo cáo tài chính: đánh giá hiệu quả tài chính của một công ty bằng cách sử dụng trang web chung\nBáo cáo thu nhập và tỷ số tài chính dựa trên Báo cáo thu nhập","qhtml":null},{"n":37,"q":"A deferred tax liability could arise when","opts":["the tax base of an asset is greater than its carrying amount","the carrying amount of a liability is greater than its tax base.","financial accounting income tax expense exceeds income tax payable"],"ans":"C","expl":"A. Không chính xác vì tài sản thuế thu nhập hoãn lại chứ không phải thuế thu nhập hoãn lại phải trả phát sinh khi cơ sở thuế\ncủa một tài sản lớn hơn giá trị ghi sổ của nó\nB. Không chính xác vì tài sản thuế thu nhập hoãn lại chứ không phải thuế thu nhập hoãn lại phát sinh khi\ngiá trị ghi sổ của khoản nợ phải trả lớn hơn cơ sở tính thuế của nó.\nC. Đúng vì thuế thu nhập hoãn lại phải trả phát sinh khi chi phí thuế thu nhập kế toán tài chính\nvượt quá số thuế thu nhập phải nộp\nPhân tích báo cáo tài chính: lợi nhuận kế toán tương phản, thuế thu nhập phải nộp và\nchi phí thuế thu nhập và chênh lệch tạm thời so với vĩnh viễn giữa lợi nhuận kế toán\nvà thu nhập chịu thuế","qhtml":null},{"n":38,"q":"An analyst gathers the following information (in € millions) about a company's fiscal year:\nCost of goods sold 5,000\nIncrease in inventory 3,000\nIncrease in accounts payable 2.500\nCase paid to suppliers (in € millions) is","opts":["6,500.","9,000.","11,500."],"ans":"A","expl":"A. Đúng vì Tiền mặt trả cho nhà cung cấp = Giá vốn hàng bán + Tăng hàng tồn kho - Tăng\ntrong tài khoản phải trả = €5.000 + €3.000 - €2.500 = €5.500 - €2.500 = €6.500.\nB. Không chính xác vì nó loại trừ sự gia tăng trong các khoản phải trả và tính toán sai số lần Mua hàng\ntừ nhà cung cấp thay vì Tiền mặt trả cho nhà cung cấp.\nC. Không chính xác vì đã cộng nhầm thay vì trừ đi phần tăng trong tài khoản\nphải trả khi tính Tiền mặt trả cho nhà cung cấp.\nPhân tích báo cáo tài chính: chứng minh việc chuyển đổi dòng tiền từ phương pháp gián tiếp sang\ntrực tiếp","qhtml":null},{"n":39,"q":"An analyst gathers the following information about a company for its fiscal year ended 31\nDecember:\nNet income €3 000 000\nCommon shares outstanding, January 3.500,000\nCommon shares issued, 1 April 1,000,000\nCommon shares outstanding 31 December 4,500,000\nConvertible preferred shares outstanding 400,000\nConvertible preformed dividend per share €1.00\nEach convertible preferred share is convertible into two common shares, if there are no other\npotentially dilutive securities outstanding, reported diluted EPS is closest to","opts":["€0.51","€0.57","€0.59"],"ans":"C","expl":"C. Đúng vì EPS bị pha loãng = Thu nhập ròng / (Số lượng cổ phiếu phổ thông bình quân gia quyền +\nCổ phiếu phổ thông mới phát hành tại thời điểm chuyển đổi). Số lượng cổ phiếu phổ thông bình quân gia quyền\ntrong năm = 3.500.000 + (1.000.000 × 9/12) = 4.250.000, xem xét số cổ phiếu phát hành vào\nngày 1 tháng 4, đang lưu hành 9 trong 12 tháng trong năm. Cổ phiếu mới phát hành tại\nchuyển đổi = 400.000 × 2 = 800.000. EPS pha loãng = €3.000.000 / (4.250.000 + 800.000) =\n€3.000.000 / 5.050.000 = €0,5941 (làm tròn thành €0,59).\nCông thức EPS cơ bản: EPS cơ bản = (Thu nhập ròng - Cổ tức ưu đãi) / Bình quân gia quyền\ncổ phiếu phổ thông = (€3.000.000 - €400.000) / 4.250.000 = €2.600.000 / 4.250.000 = €0,6118. Vì\nEPS pha loãng được báo cáo là €0,59 thấp hơn EPS cơ bản là €0,6118, nên cổ phiếu ưu đãi chuyển đổi\nkhông có tính suy giảm suy giảm. Do đó, EPS pha loãng được báo cáo là 0,59 €.\nPhân tích báo cáo tài chính: mô tả cách tính và tính toán thu nhập trên mỗi cổ phiếu, đồng thời\ngiải thích thu nhập cơ bản và thu nhập suy giảm trên mỗi cổ phiếu của một công ty đối với các công ty có cấu trúc vốn đơn giản và\nphức tạp, bao gồm cả những công ty có chứng khoán có tính pha loãng","qhtml":null},{"n":40,"q":"An analyst gathers the following Information (in thousands) about a company.\nCash flow from operating activities 80\nCapital expenditures 15\nInterest paid and expensed 10\nIf interest paid is classified as a cash flow from operating activities and the income tax rate is\n20%, FCFF (in € thousands) is:","opts":["57","65","73"],"ans":"C","expl":"A. Không chính xác vì nó đã trừ đi khoản điều chỉnh lãi suất sau thuế thay vì cộng lại.\nDo đó, FCFF = 80 - 10 × (1 - 0,20) - 15 = 80 - (10 × 0,80) - 15 = 80 - 8 - 15 = €57.\nB. Không chính xác vì nó giả định không chính xác rằng tiền lãi được tính và trả đã được bao gồm trong\nhoạt động tài chính và không điều chỉnh cho int(1 - Thuế suất). Theo đó, FCFF = CFO – FCInv = 80 -\n15 = €65.\nC. Đúng vì FCFF có thể được tính từ dòng tiền từ hoạt động kinh doanh dưới dạng FCFF =\nCFO + int(1 - Tax rate) - FCInv. CFO thể hiện dòng tiền từ hoạt động kinh doanh theo US GAAP\nhoặc theo IFRS trong đó công ty đã bao gồm lãi trả trong hoạt động kinh doanh. Theo đó,\nFCFF = 80 + [10 × (1 - 0,20)] - 15 = 80 + (10 × 0,80) - 15 = 80 + 8 - 15 = €73.","qhtml":null},{"n":41,"q":"A qualified audit opinion is most likely issued when financial statements are prepared","opts":["In compliance with accounting standards","with material departures from accounting standards","with some limitation or exception to accounting standards"],"ans":"C","expl":"A. Không chính xác vì báo cáo tài chính tuân thủ các chuẩn mực kế toán\nthường nhận được ý kiến ​​không đủ tiêu chuẩn (sạch).\nB. Không chính xác vì những sai lệch trọng yếu so với chuẩn mực kế toán thường sẽ dẫn đến\ný kiến ​​bất lợi chứ không phải là ý kiến ​​đủ tiêu chuẩn.\nC. Đúng vì báo cáo tài chính thể hiện \"giới hạn phạm vi hoặc ngoại lệ đối với các chuẩn mực kế toán\n\" sẽ có ý kiến ​​chấp nhận được.","qhtml":null},{"n":42,"q":"Common size statements are most likely the output of which of the following phases of\nthe financial statement analysis framework?","opts":["Process data","Analyze interpret the processed data","Develop and communicate conclusions and recommendations"],"ans":"A","expl":"A. Đúng vì các báo cáo có kích thước thông thường là đầu ra của giai đoạn \"xử lý dữ liệu\" của\nkhung phân tích báo cáo tài chính.\nB. Không chính xác vì các kết quả phân tích, chứ không phải các báo cáo có kích thước thông thường, là đầu ra của\ngiai đoạn \"phân tích và giải thích dữ liệu đã xử lý\".\nC. Không chính xác vì các báo cáo phân tích và đề xuất, không phải các tuyên bố thông thường, là\nkết quả của giai đoạn \"phát triển và truyền đạt kết luận cũng như đề xuất\".","qhtml":null},{"n":43,"q":"An analyst gathers the following information about a company's fiscal year ended 31\nDecember\nInterest payable on 1 January €45,000\nCash interest paid during the year €15,000\nInterest expense during the year €50,000\nInterest payable on 31 December is:","opts":["€30,000","€80,000","€95,000."],"ans":"B","expl":"A. Không chính xác vì chi phí lãi vay chưa được thêm vào. Theo đó, Lãi cuối kỳ phải trả =\nLãi bắt đầu phải trả - Tiền mặt trả lãi = €45.000 - €15.000 = €30.000.\nB. Đúng vì Lãi cuối kỳ phải trả - Lãi đầu kỳ phải trả + Chi phí lãi -\nTiền mặt trả lãi. Theo đó, Lãi cuối kỳ phải trả = Lãi bắt đầu phải trả +\nChi phí lãi - Tiền mặt trả lãi = €45.000 + €50.000 - €15.000 = €80.000.\nC. Không chính xác vì Tiền mặt trả lãi không được khấu trừ. Theo đó, Lãi cuối kỳ\nphải trả = Lãi bắt đầu phải trả + Chi phí lãi vay = €45.000 + €50.000 - €95.000.","qhtml":null},{"n":44,"q":"An analyst gathers the following Information (in € thousands) about a company:\nFCFF 2500\nFCFE 1,300\nInterest paid 260\nIf Interest paid is classified as a cash flow from operating activities and the income tax rate is\n40%, net debt repayment (in € thousands) is closest to","opts":["940","1,044.","1,200."],"ans":"B","expl":"A. Không chính xác vì nó trừ toàn bộ khoản thanh toán lãi thay vì số tiền lãi suất ròng\n. Vì vậy, FCFF - Trả lãi - FCFE không bằng trả nợ ròng. Phép tính\nkết quả là 2.500 - 260 - 1.300 = 940, đây không phải là số tiền trả nợ ròng chính xác.\nB. Đúng vì FCFF = CFO + Lãi trả (1 - Thuế suất) – CapEx (“FCInv”). Ngoài ra FCFE =\nCFO - FCInv + Trả nợ ròng.\nSắp xếp lại FCFF: CFO - FCInv = FCFF - Lãi trả (1 - Thuế suất).\nSắp xếp lại FCFE: CFO - FCInv = FCFE + Trả nợ ròng.\nDo đó: FCFF - Lãi trả (1 - Thuế suất) = FCFE + Ròng trả nợ\n→ 2.500 - (260 × (1 - 40%)) = 1300 + Trả nợ ròng\nDo đó, Trả nợ ròng = 2.344 - 1.300 = 1.044.\nC. Không chính xác vì nó giả định tiền lãi đã trả được phân loại là dòng tiền từ hoạt động tài chính\nvà không cần phải cộng lại vào CFO. Do đó, các tính toán được thực hiện không phù hợp\nvới việc trả nợ ròng chính xác.","qhtml":null},{"n":45,"q":"Deferred tax assets could arise when","opts":["taxable income exceeds accounting profit","the carrying amount of assets exceeds their tax base.","accounting income tax expense exceeds income taxes payable"],"ans":"A","expl":"A. Đúng vì tài sản thuế thu nhập hoãn lại xuất hiện trên bảng cân đối kế toán phát sinh khi một số tiền vượt quá được trả cho thuế thu nhập (thu nhập chịu thuế cao hơn lợi nhuận kế toán).\nB. Không chính xác vì tài sản thuế thu nhập hoãn lại phát sinh khi cơ sở tính thuế của tài sản vượt quá\ngiá trị ghi sổ của nó. Sự khác biệt giữa cơ sở tính thuế và giá trị ghi sổ cũng dẫn đến\nsự khác biệt giữa lợi nhuận kế toán và thu nhập chịu thuế. Chênh lệch tạm thời được khấu trừ\ndẫn đến tài sản thuế thu nhập hoãn lại khi cơ sở tính thuế của một tài sản vượt quá giá trị ghi sổ của nó.\nC. Không chính xác vì tài sản thuế thu nhập hoãn lại phát sinh khi số tiền nộp thuế (thuế phải nộp)\nvượt quá chi phí thuế. Thu nhập chịu thuế của một công ty là cơ sở để tính thuế thu nhập phải nộp (a\ntrách nhiệm pháp lý) hoặc có thể thu hồi (tài sản) được tính trên cơ sở thuế suất của công ty và\nxuất hiện trên bảng cân đối kế toán của công ty. Tài sản thuế thu nhập hoãn lại xuất hiện trên bảng cân đối kế toán khi số tiền\nvượt quá được trả cho thuế thu nhập (thu nhập chịu thuế cao hơn lợi nhuận kế toán) và công ty\ndự kiến ​​sẽ thu hồi được khoản chênh lệch trong quá trình hoạt động trong tương lai. Do đó, số thuế thu nhập thực tế\nphải nộp có thể vượt quá chi phí thuế thu nhập kế toán tài chính\ndựa trên lợi nhuận kế toán.","qhtml":null},{"n":46,"q":"Under US GAAP, in The second year of a multi-year lease, a lessee with an operating lease\nmost likely reports a:","opts":["higher interest expensethan it would if the lease were a finance lease","lower deprecation expense than it would if the lease were a finance lease","greater financing cash outflow that would if the lease were a finance lease."],"ans":"B","expl":"A. Không chính xác vì chi phí lãi vay của bên thuê có hợp đồng thuê hoạt động thấp hơn\nso với hợp đồng thuê tài chính (không có chi phí lãi vay theo hợp đồng thuê hoạt động). Theo\nIFRS, có một mô hình kế toán duy nhất cho cả hợp đồng thuê tài chính và hoạt động cho bên cho thuê. Tại\nhợp đồng thuê bắt đầu, bên thuê ghi lại khoản nợ phải trả cho thuê và tài sản \"quyền sử dụng\" (ROU) trên\nbảng cân đối kế toán của mình, cả hai đều bằng giá trị hiện tại của các khoản thanh toán tiền thuê trong tương lai. Phần sau\nmô tả cách giao dịch (theo IFRS) ảnh hưởng đến báo cáo tài chính: chi phí lãi vay trên\nnợ thuê và chi phí khấu hao liên quan đến tài sản ROU được báo cáo\nriêng biệt trên báo cáo thu nhập. Tuy nhiên, theo US GAAP, chi phí lãi vay và khấu hao\nliên quan đến tài sản ROU được báo cáo dưới dạng một chi phí hoạt động duy nhất trên báo cáo thu nhập\n. Các thành phần lãi suất và khấu hao không được báo cáo riêng biệt.\nB. Đúng vì Trong trường hợp hợp đồng thuê hoạt động theo US GAAP, bên thuê ghi nhận các khoản thanh toán tiền thuê\nlà chi phí thuê và không báo cáo chi phí khấu hao đối với tài sản cho thuê.\nCác khoản thanh toán được thực hiện phản ánh khấu hao của tài sản quyền sử dụng (ROU) trong thời hạn thuê.\nChi phí khấu hao và không có chi phí khấu hao được báo cáo trong báo cáo tài chính.\nC. Không chính xác vì dòng tiền tài trợ ra cho bên thuê có hợp đồng thuê hoạt động thấp hơn\nso với hợp đồng thuê tài chính theo IFRS. Có một mô hình kế toán duy nhất cho cả hợp đồng thuê tài chính và\nhoạt động dành cho bên cho thuê theo IFRS. Khi bắt đầu thuê, bên thuê ghi lại trách nhiệm thuê\nvà tài sản có quyền sử dụng (ROU) trên bảng cân đối kế toán, cả hai đều bằng giá trị hiện tại của\ncác khoản thanh toán tiền thuê trong tương lai. Thành phần trả nợ gốc của nợ thuê được báo cáo dưới dạng dòng tiền ra\ntrong hoạt động tài chính trên báo cáo lưu chuyển tiền tệ. Tuy nhiên, theo US\nGAAP, toàn bộ khoản thanh toán tiền thuê được báo cáo dưới dạng dòng tiền chi ra trong hoạt động kinh doanh trên báo cáo lưu chuyển tiền tệ\n. Các thành phần thanh toán lãi và gốc không được báo cáo\nriêng biệt.","qhtml":null},{"n":47,"q":"In common-size analysis of the cash flow statement, each line item of cash inflow may\nbe stated as a percentage of","opts":["total assets","net revenue.","net cash flow."],"ans":"B","expl":"A. Không chính xác vì trong phân tích báo cáo lưu chuyển tiền tệ quy mô chung, có hai cách tiếp cận\nphổ biến. Cách tiếp cận chính là thể hiện từng chi tiết đơn hàng của dòng tiền vào hoặc dòng tiền ra dưới dạng phần trăm\ntrên tổng dòng tiền vào hoặc dòng tiền ra. Cách tiếp cận thứ hai là thể hiện từng mục hàng\ndưới dạng phần trăm doanh thu thuần chứ không phải tổng tài sản.\nB. Đúng vì trong phân tích báo cáo lưu chuyển tiền tệ quy mô chung, có hai cách tiếp cận\nphổ biến. Cách tiếp cận chính liên quan đến việc thể hiện từng mục dòng tiền vào hoặc dòng tiền ra\ndưới dạng phần trăm của tổng dòng tiền vào hoặc ra. Cách tiếp cận thứ hai là biểu thị\nmỗi mục hàng dưới dạng phần trăm doanh thu thuần.\nC. Không chính xác vì trong phân tích báo cáo lưu chuyển tiền tệ quy mô chung, có hai cách tiếp cận\nkhác nhau. Cách tiếp cận chính là thể hiện từng chi tiết đơn hàng của dòng tiền vào hoặc dòng tiền ra dưới dạng phần trăm\ntrên tổng dòng tiền vào hoặc dòng tiền ra. Cách tiếp cận thứ hai là thể hiện từng mục hàng\ndưới dạng phần trăm doanh thu thuần chứ không phải dòng tiền ròng.","qhtml":null},{"n":48,"q":"Under US GAAP, which of the following is a required financial statement disclosure\nconcerning inventory?","opts":["Only the material amount of income resulting from the liquidation of LIFO inventory","Only the amount of any reversal of any write down that is recognized as a reduction in cost of goods sold in the period","Both the material amount of income resulting from the liquidation of LIFO inventory, and the amount of any reversal of any write down that is recognized as a reduction in cost of goods sold in the period"],"ans":"A","expl":"A. Đúng vì việc tiết lộ thông tin rất hữu ích khi phân tích một công ty. Theo US GAAP,\nbáo cáo tài chính bắt buộc liên quan đến hàng tồn kho bao gồm các chính sách kế toán được áp dụng trong\nđo lường hàng tồn kho, bao gồm cả các công thức chi phí (phương pháp định giá hàng tồn kho) được sử dụng.\nTuy nhiên, phần thứ hai của công bố liên quan đến số tiền hoàn nhập ghi giảm\nlàm giảm giá vốn hàng bán không liên quan theo US GAAP, vì US GAAP không cho phép\nđảo ngược việc ghi giảm hàng tồn kho năm trước. GAAP của Hoa Kỳ cũng yêu cầu tiết lộ các ước tính\nđáng kể áp dụng cho hàng tồn kho và bất kỳ khoản thu nhập quan trọng nào có được từ việc thanh lý\nhàng tồn kho LIFO.\nB. Không chính xác vì phần thứ hai của thông tin công bố liên quan đến số tiền hoàn ngược các khoản ghi giảm\nđể giảm giá vốn hàng bán không liên quan theo GAAP của Hoa Kỳ, vì GAAP của Hoa Kỳ\nkhông cho phép hoàn nhập các khoản ghi giảm hàng tồn kho năm trước. Thông tin tiết lộ\nthực tế được yêu cầu theo G
