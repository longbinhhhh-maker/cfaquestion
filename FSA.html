al and ignoring taxes, the revaluation at 31 December Year 1 leads in a", "opts": ["higher quick ratio", "higher total asset turnover", "lower debt-to-assets ratio"], "ans": "B", "expl": "A. Incorrect because an upward asset revaluation only affects the fixed assets on the asset side\nand the surplus account in equity; the numerator remains unchanged. It leads to an increased\ntotal asset value and therefore has a direct relationship only with the PP&E on the asset side\nand the surplus account in equity; the numerator is unaffected, and only the denominator\nincreased. This leads to a decreased total asset turnover.\nB. Correct because the upward revaluation increases the fixed asset value causing an increased\ntotal asset value. Total assets in the denominator increase while the numerator (net sales)\nremains the same. This results in a higher total asset turnover.\nC. Incorrect because the upward revaluation increases the fixed asset value, therefore\nincreasing the denominator (total assets) but the total debt remains unchanged in the\nnumerator. This leads to a decrease in the debt-to-assets ratio.", "qhtml": null}, {"n": 105, "q": "On the statement of cash flows cash dividends paid may be classified as an operating\nactivity under", "opts": ["IFRS only", "US GAAP only.", "Both IFRS and US GAAP"], "ans": "A", "expl": "A. Correct because US GAAP classifies dividends paid to stockholders as a financing activity,\nwhereas IFRS allows companies to classify dividends paid as either an operating activity or a\nfinancing activity.\nB. Incorrect because US GAAP classifies dividends paid to stockholders as a financing activity,\nwhereas IFRS allows companies to classify dividends paid as either an operating activity or a\nfinancing activity.\nC. Incorrect because US GAAP classifies dividends paid to stockholders as a financing activity,\nwhereas IFRS allows companies to classify dividends paid as either an operating activity or a\nfinancing activity.", "qhtml": null}, {"n": 106, "q": "According to the converged accounting standards for reverse recognition, which of the\nfollowing is the first of five steps in recognizing revenue?", "opts": ["Determine the transaction price", "Identify the contract with the customer", "Identify the distinct performance obligations in the contract"], "ans": "B", "expl": "A. Incorrect because this is the third of five steps in recognizing revenue according to the\nconverged accounting standard for revenue recognition.\nB. Correct because this is the first of five steps in recognizing revenue according to the\nconverged accounting standard for revenue recognition. The [converged accounting standard\nfor revenue recognition] describes the application of five steps in recognizing revenue:\n1. Identify the contract(s) with a customer\n2. Identify the separate or distinct performance obligations in the contract\n3. Determine the transaction price\n4. Allocate the transaction price to the performance obligations in the contract\n5. Recognize revenue when (or as) the entity satisfies a performance obligation.\nC. Incorrect because this is the second of five steps in recognizing revenue according to the\nconverged accounting standard for revenue recognition.", "qhtml": null}, {"n": 107, "q": "The financial leverage ratio may be calculated as:", "opts": ["EBIT divided by interest payments.", "total debt divided by total shareholders equity.", "average total assets divided by average shareholders' equity"], "ans": "C", "expl": "A. Incorrect because this metric indicates the number of times company EBIT can cover the\ninterest payments. Higher coverage ratios provide assurance that the company can service debt\nfrom operating earnings.\nB. Incorrect because this defines the debt-to-equity ratio (instead of the financial leverage\nratio). The debt-to-equity ratio measures the amount of debt financing relative to equity\nfinancing. Higher debt-to-capital or debt-to-equity ratios imply weaker solvency.\nC. Correct because this defines the financial leverage ratio. The financial leverage ratio (also\nknown as the leverage ratio or equity multiplier) measures the financial support provided by\none money unit of equity. The higher the financial leverage ratio, the more leveraged the\ncompany is in the sense of using debt and other liabilities to finance assets. This ratio is often\ncalculated using average total assets and average total equity and plays an important role in the\nDuPont decomposition of return on equity.", "qhtml": null}, {"n": 108, "q": "Which of the following is defined as how long a company can continue to pay as daily\ncash expenditures from its existing liquid assets without receiving additional cash inflow?", "opts": ["Cash conversion cycle", "Defensive interval ratio", "Fixed charge coverage"], "ans": "B", "expl": "A. Incorrect because this metric indicates the amount of time that elapses from the point when\na company invests in working capital until the point at which the company collects cash.\nConsequently, the cash conversion cycle does not indicate the degree to which a company's\nliquid assets can cover daily cash expenditures.\nB. Correct because this ratio measures how long the company can continue to pay its expenses\nfrom its existing liquid assets without receiving any additional cash inflow.\nC. Incorrect because this measure focuses on the degree to which the company's earnings can\ncover its fixed charges. This ratio relates fixed charges or obligations to the cash flow generated\nby the company. It measures the number of times a company's earnings (before interest, taxes,\nand lease payments) can cover the company's interest and lease payments.", "qhtml": null}, {"n": 109, "q": "Accounting goodwill arising from acquisitions is", "opts": ["expensed in the period it arises", "capitalized and amortized over a finite period.", "capitalized and tested for impairment annually"], "ans": "C", "expl": "A. Incorrect because under both IFRS and US GAAP, accounting goodwill arising from\nacquisitions is capitalized.\nB. Incorrect because under both IFRS and US GAAP, accounting goodwill arising from\nacquisitions is capitalized. Goodwill is not amortized but is tested for impairment annually. If\ngoodwill is deemed to be impaired, an impairment loss is charged against income in the current\nperiod.\nC. Correct because under both IFRS and US GAAP, accounting goodwill arising from acquisitions\nis capitalized. Goodwill is not amortized but is tested for impairment annually. If goodwill is\ndeemed to be impaired, an impairment loss is charged against income in the current period.", "qhtml": null}, {"n": 110, "q": "An analyst gathers the following Information (in millions) about a company:\nNet cash flow from operating activities (750)\nTotal cash inflows 1,500\nTotal cash outflows 2,500\nNet increase (decrease) in cash (1.000)\nOn a common-sze statement of cash flows presented using the indirect method, net\noperating cash flow is:", "opts": ["30%", "50%", "75%"], "ans": "A", "expl": "A. Correct because when a cash flow statement has been presented using the indirect method,\noperating cash inflows and outflows are not separately presented; therefore, the common-size\ncash flow statement shows only the net operating cash flow (net cash provided by or used in\noperating activities) as a percentage of total inflows or outflows, depending on whether the net\namount was a cash inflow or outflow. Because the net amount is an outflow, it should be\ncalculated as a percentage of total cash outflows as follows: 750/2500=30%\nB. Incorrect because when a cash flow statement has been presented using the indirect\nmethod, operating cash inflows and outflows are not separately presented; therefore, the\ncommon-size cash flow statement shows only the net operating cash flow (net cash provided by\nor used in operating activities) as a percentage of total inflows or outflows, depending on\nwhether the net amount was a cash inflow or outflow. Because the net amount is an outflow, it\nshould be calculated as a percentage of total cash outflows as follows: 750/2500=30%. The\nincorrect answer is obtained by dividing net cash used in operations by total cash inflows:\n750/1500=50%\nC. Incorrect because when a cash flow statement has been presented using the indirect\nmethod, operating cash inflows and outflows are not separately presented; therefore, the\ncommon-size cash flow statement shows only the net operating cash flow (net cash provided by\nor used in operating activities) as a percentage of total inflows or outflows, depending on\nwhether the net amount was a cash inflow or outflow. Because the net amount is an outflow, it\nshould be calculated as a percentage of total cash outflows as follows: 750/2500=30%. The\nincorrect answer is obtained by dividing net cash used in operations by the net decrease in cash:\n750/1000=75%", "qhtml": null}, {"n": 111, "q": "A company establishes a plan dispose of one of its material lines of business and will\nhave no further involvement in its operation. The income statement most likely reports the\nresults of this line of business as", "opts": ["discontinued operations", "unusual or infrequent items", "continuing operations unit the actual sale is performed."], "ans": "A", "expl": "A. Correct because when a company disposes of or establishes a plan to dispose of one of its\ncomponent operations and will have no further involvement in the operation, the income\nstatement reports separately the effect of this disposal as a \"discontinued\" operation under\nboth IFRS and US GAAP. Financial standards provide various criteria for reporting the effect\nseparately, which are generally that the discontinued component must be separable both\nphysically and operationally.\nB. Incorrect because items of income or expense that are material and/or relevant to the\nunderstanding of the entity's financial performance should be disclosed separately under IFRS.\nUnusual or infrequent items may meet these criteria, for instance, restructuring charges or\ngains/losses arising from asset sales, but these are considered part of ordinary activities.\nC. Incorrect because both IFRS and US GAAP specify that the results of discontinued operations\nshould be reported separately from continuing operations.", "qhtml": null}, {"n": 112, "q": "An analyst gathers the following information (in € thousands) about a company's\nequipment reported under the cost model\nCarrying amount before impairment 2,000\nUndiscounted expected future cash flows 1,800\nFair value 1,700\nValue in use 1.500\nCosts to sell 50\nThe impairment loss (in € thousands) is", "opts": ["300", "350.", "500"], "ans": "B", "expl": "A. Incorrect because it does not reflect the correct calculation for impairment loss under the\ncost model. The impairment loss under the cost model is recognized when the carrying amount\nof an asset exceeds its recoverable amount. The recoverable amount is the higher of fair value\nless costs to sell and value in use. In this case, the recoverable amount would be €1,700 (Fair\nvalue - Costs to sell). Therefore, the impairment loss is €300 (Carrying amount - Recoverable\namount = €2,000 - €1,700).\nB. Correct. Under ISA 36, an impairment loss is measured as the excess of carrying amount over\nthe recoverable amount of the asset. The recoverable amount of an asset is defined as the\nhigher of its fair value less costs to sell and its value in use. Value in use is a discounted measure\nof expected future cash flows. As the recoverable amount = MAX (Fair value less costs to sell,\nvalue in use) = MAX [(1700 – 50); 1500] = 1650, the impairment loss = carrying amount –\nrecoverable amount = 2000 – 1650 = 350\nC. Incorrect because it calculates the recoverable amount as the lower of its fair value less costs\nto sell and its value in use. Accordingly, the recoverable amount = MIN(Fair value less costs to\nsell, value in use) = MIN [(1700 – 50); 1500] = 1500, the impairment loss = carrying amount –\nrecoverable amount = 2000 – 1500 = 500", "qhtml": null}, {"n": 113, "q": "An analyst gathers the following information about PP&E that is abandoned and\naccumulated for using the cost model\nCarrying value €10 million\nFair value at time of abandonment €1 million\nAssuming no impairment, the abandonment of PP&E on the financial statements will result in\na:", "opts": ["decrease of €10 million in PP&E.", "loss of €1 million on the income statement", "decrease of €1 million on the cash flow statement."], "ans": "A", "expl": "A. Correct because when an asset is retired or abandoned, the accounting is similar to a sale,\nexcept that the company does not record cash proceeds. Assets are reduced by the carrying\namount of the asset at the time of retirement or abandonment, and a loss equal to the assets\ncarrying amount is recorded. The carrying amount of the asset is 10 at the time of\nabandonment. As a result, the asset's carrying value will be reduced to 0, resulting in a loss of\n10 on the income statement, and will have no cash impact on the cash flow statement\nB. Incorrect because it calculates the loss of 1 on the income statement by using the fair value at\nthe time of abandonment which is incorrect because the cost model is applied.\nC. Incorrect because there should be no cash impact on the cash flow statement. However, the\ndecrease of 1 on the cash flow statement is due to the incorrect recognition of the 1 fair value\nat the time of abandonment", "qhtml": null}, {"n": 114, "q": "An analyst gathers the following information about a company.\nROE 15%\nInterest burden 0.85\nEBIT margin 30%\nTotal asset turnover 1.1\nFinancial leverage 1.25\nThe average tax rate is closest to", "opts": ["43%", "47%", "57%"], "ans": "C", "expl": "A. Incorrect because the calculation seems to have computed the tax burden (approximately\n42.78%) rather than the average tax rate. The tax burden is one minus the average tax rate,\nindicating how much of a company's pretax profits it retains.\nB. Incorrect because it appears to have confused Return on Equity (ROE) with Return on Assets\n(ROA) in the calculation. ROE can be dissected through the DuPont analysis formula: ROE = Tax\nBurden × Interest Burden × EBIT Margin × Total Asset Turnover × Financial Leverage. With the\ngiven values, the estimated tax burden is approximately 53.48%, hence the average tax rate\nwould be approximately 47%.\nC. Correct because the calculation seems to employ the DuPont analysis formula: ROE = Tax\nBurden × Interest Burden × EBIT Margin × Total Asset Turnover × Financial Leverage. Utilizing\nthis formula with the provided values yields an estimated tax burden of around 42.78%. Tax\nburden reflects one minus the average tax rate, or how much of a company’s pretax profits it\ngets to keep. Thus average tax rate = 1 – Tax burden = 57.22% ~ 57%", "qhtml": null}, {"n": 115, "q": "Which of the following disclosures as required for each class of PP&E carried under the\ncost model?", "opts": ["Remaining useful life", "Gross carrying amount", "Fair value and details of how it was obtained"], "ans": "B", "expl": "A. Incorrect because it mentions \"estimated useful life\" instead of \"remaining useful life\" of the\nclass, as required. Under IFRS, for each class of property, plant, and equipment, a company must\ndisclose remaining useful life (or useful life only).\nB. Correct because for each class of property, plant, and equipment carried under the cost\nmodel, a company must disclose various details such as measurement bases, depreciation\nmethod, useful lives, depreciation rate used, gross carrying amount, accumulated depreciation\nat the beginning and end of periods, reconciliation of carrying amount at the start and end of\nthe period, and additional disclosures such as restrictions on title, liens on property, and\ncontractual agreements.\nC. Incorrect because disclosing the details of how fair value was obtained is necessary for\nclasses of PP&E under the revaluation model, not the cost model. Under IFRS, if the revaluation\nmodel is applied, disclosure requirements encompass the date of revaluation, particulars of fair\nvalue determination, carrying amount under the cost model, and the revaluation surplus.", "qhtml": null}, {"n": 116, "q": "Which of the following components of change in the net pension asset or liability of a\ndefined-beneft pension plan is recognized in other comprehensive income?", "opts": ["Employees' service costs", "Actuarial gains and losses", "Net interest expense of income accrued on the beginning net pension asset or liability"], "ans": "B", "expl": "A. Incorrect because it is recognized in profit and loss instead of other comprehensive income.\nUnder IFRS, the change in the net pension asset or liability each period is viewed as having\nthree general components. Two of the components of this change are recognized as pension\nexpense in profit and loss: (1) employees' service costs and (2) the net interest expense or\nincome accrued on the beginning net pension asset or liability.\nB. Correct because under IFRS, the change in the net pension asset or liability each period is\nviewed as having three general components. Two of the components of this change are\nrecognized as pension expense in profit and loss: (1) employees' service costs and (2) the net\ninterest expense or income accrued on the beginning net pension asset or liability. The third\ncomponent of the change in the net pension asset or liability during a period—\nremeasurements—is recognized in other comprehensive income. Remeasurements are not\namortized into profit or loss over time. Remeasurements include (a) actuarial gains and losses.\nC. Incorrect because it is recognized in profit and loss instead of other comprehensive income.\nUnder IFRS, the change in the net pension asset or liability each period is viewed as having\nthree general components. Two of the components of this change are recognized as pension\nexpense in profit and loss: (1) employees' service costs and (2) the net interest expense or\nincome accrued on the beginning net pension asset or liability.", "qhtml": null}, {"n": 117, "q": "An analyst gathers the following information about a company\nInterest payments $30,000\nCapital expenditures $82,000\nNet borrowing $18,000\nIncome tax rate 40%\nUnder US GAAP free cash flow to equity is most likely:", "opts": ["less than free cash flow to the firm.", "equal to free cash flow to the firm.", "greater than free cash flow to the firm."], "ans": "B", "expl": "A. Incorrect because FCFE is equal to FCFF.\nB. Correct because under U.S. GAAP, free cash flow to the firm is calculated as CFO + int(1 - tax\nrate) - capital expenditures. Since the firm has interest-bearing debt outstanding, $18,000\n($10,000(1-0.4)) is added back to CFO in calculating FCFF. In addition, the capital expenditures\nof $82,000 are subtracted, so the equation becomes CFO + $18,000 - $82,000 for a net decrease\nto CFO of $64,000 ($18,000 - $82,000 = -$64,000). The calculation for free cash flow to equity is\nCFO - capital expenditures - net borrowing with no adjustment for interest paid under US GAAP.\nThe calculation becomes CFO - $82,000 + $18,000 for a net decrease to CFO of $64,000\n($82,000 - $18,000 = $64,000). Therefore, FTE will be equal to FCFE, as the after-tax interest\nadd-back to FCFF is equal to the net borrowing add-back to FCFE, and CFO and capital\nexpenditures are the same for both.\nC. Incorrect because FCFE is equal to FCFF.", "qhtml": null}, {"n": 118, "q": "A manufacturing company reporting under US GAAP using the FIFO inventory valuation\nmethod should measure its finished goods' inventory at the lower of", "opts": ["cost and market value", "cost and net realizable value.", "market value and net resizable value"], "ans": "B", "expl": "A. Incorrect because US GAAP used to specify the lower of cost or market to value inventories.\nFor fiscal years beginning after December 15, 2016, inventories measured using other than LIFO\nand retail inventory methods are measured at the lower of cost or net realizable value.\nB. Correct because under US GAAP for fiscal years beginning after December 15, 2016,\ninventories measured using other than LIFO and retail inventory methods are measured at the\nlower of cost or net realizable value.\nC. Incorrect because US GAAP used to specify the lower of cost or market to value inventories.\nFor fiscal years beginning after December 16, 2016, inventories measured using other than FIFO\nand retail inventory methods are measured at the lower of cost or net realizable value. This\nanswer incorrectly uses some of the inventory measurement restrictions under US GAAP for\nFIFO. For inventories measured using FIFO and retail inventory methods, market value is defined\nas current replacement cost subject to upper and lower limits. Market value cannot exceed net\nrealizable value.", "qhtml": null}, {"n": 119, "q": "A company reporting under US GAAP purchases an equity security issued by another\ncompany. If the equity security represents less than 1% of the outstanding equity of the\nissuing company and the acquiring company owns no other equity stake in the issuing\ncompany, the investment is most likely earned on the acquiring company's balance sheet as", "opts": ["amortized cost", "fair value with any unrealized holding gains/lossesrecognized in the income statement", "fair value with any unrealized holding gains/lossesrecognized in other comprehensive income"], "ans": "B", "expl": "A. Incorrect because under US GAAP, all investments in equity securities (other than\ninvestments giving rise to ownership positions that confer significant influence over the\ninvestee) are measured at fair value with unrealized holding gains or losses recognized in the\nincome statement.\nB. Correct because under US GAAP, all investments in equity securities (other than investments\ngiving rise to ownership positions that confer significant influence over the investors) are\nmeasured at fair value with unrealized holding gains or losses recognized in the income\nstatement.\nC. Incorrect because under US GAAP, all investments in equity securities (other than\ninvestments giving rise to ownership positions that confer significant influence over the\ninvestors) are measured at fair value with unrealized holding gains or losses recognized in the\nincome statement.", "qhtml": null}, {"n": 120, "q": "An analyst gathers the following information about a company's fiscal year ended 31\nDecember\nNet income €2,500,000\nWeighted average common shares outstanding during the year 2,000,000\nConvertible preferred shares outstanding 1,000,000\nDividend per convertible preferred share €1\nOne convertible preferred share is convertible into two common shares if the tax rate is 40%\nand there are no other potentially dilutive securities outstanding, reported diluted EPS is\nclosest to", "opts": ["€0.38", "€0.48", "€0.63"], "ans": "C", "expl": "A. Incorrect because it subtracts the preferred dividends from net income in the diluted EPS\ncalculation. Accordingly, Diluted EPS = (€2,500,000 - 1,000,000 × 1) / (2,000,000 + 2 × 1,000,000)\n= €1,500,000 / 4,000,000 = €0.375 = €0.38.\nB. Incorrect because it subtracts the preferred dividends multiplied by an after-tax percentage\nfrom net income in the diluted EPS calculation. Accordingly, Diluted EPS = (€2,500,000 -\n1,000,000 × 1) + [2 × (1-0.4)] / (2,000,000 + 2 × 1,000,000) = €1,800,000 / 4,000,000 = €0.45 =\n€0.48.\nC. Correct because when a company has convertible preferred stock outstanding, diluted EPS is\ncalculated using the if-converted method. The formula to calculate diluted EPS using the if-\nconverted method for preferred stock is: Diluted EPS = Net income / (Weighted average number\nof shares outstanding + New common shares that would have been issued at conversion).\nTherefore, Diluted EPS = €2,500,000 / (2,000,000 + 2 × 1,000,000) = €2,500,000 / 4,000,000 =\n€0.625 = €0.63. However, diluted EPS, by definition, is always equal to or less than basic EPS.\nBasic EPS = (Net income - Preferred dividends) / (Weighted average number of shares\noutstanding) = (€2,600,000 - 1,000,000) / 2,000,000 = €1,600,000 / 2,000,000 = €0.80 = €0.75.\nTherefore, the convertible preferred stocks are dilutive, and diluted EPS = €0.63.", "qhtml": null}, {"n": 121, "q": "An analyst gathers the following information about a company's fiscal year ended 31\nDecember\nNet income €5,000,000\nCommon dividends doclared and paid €500,000\nWeighted average common shares outstanding during the year 2,000,000\nConvertible preferred shares outstanding 400,000\nUradend per convertible preferred share €2\nOne convertible preferred share is convertible into six common shares. If there are no other\npotentially dilutive securities outstanding, reported diluted EPS should be closest to", "opts": ["$0.95", "$1.02", "$1.14"], "ans": "C", "expl": "A. Incorrect because it subtracts the preferred dividends from net income in the diluted EPS\ncalculation. The calculation becomes: Diluted EPS = (€5,000,000 - 400,000 × €2) / (2,000,000 + 6\n× 400,000) = (€5,000,000 - €800,000) / €4,400,000 = €4,200,000 / €4,400,000 = €0.95.\nB. Incorrect because it subtracts the common dividends from net income in the diluted EPS\ncalculation. The calculation becomes: Diluted EPS = (€5,000,000 - €500,000) / (2,000,000 + 6 ×\n400,000) = €4,500,000 / €4,400,000 = €1.02.\nC. Correct because when a company has convertible preferred stock outstanding, diluted EPS is\ncalculated using the if-converted method. The formula to calculate diluted EPS using the if-\nconverted method for preferred stock is: Diluted EPS = Net income / (Weighted average number\nof shares outstanding + New common shares that would have been issued at conversion).\nTherefore, Diluted EPS = €5,000,000 / (2,000,000 + 6 × 400,000) = €5,000,000 / €4,400,000 =\n€1.14. Checking that diluted EPS, by definition, is always equal to or less than basic EPS. Basic\nEPS = (Net income - Preferred dividends) / (Weighted average number of shares outstanding) =\n(€5,000,000 - €400,000) / 2,000,000 = €4,600,000 / 2,000,000 = €2.30 = €2.1. Therefore, the\nconvertible preferred stocks are dilutive, and diluted EPS is €1.14.", "qhtml": null}, {"n": 122, "q": "An analyst gathers the following information (in € millions) about a company\nCash and cash equivalents 40\nTotal current assets 125\nTotal non-current assets 35\nRevenue 200\nApplying vertical common-size analysis to the company's balance sheet, cash and cash\nequivalents are", "opts": ["20%.", "25%", "32%"], "ans": "B", "expl": "A. Incorrect because it states Cash and cash equivalents as a percentage of Revenue instead of\nTotal assets. Consequently, the calculation becomes Cash and cash equivalents / (Cash and Cash\nequivalents + Total assets) = 40 / (40 + 125 + 35) = 40 / 160 = 20%.\nB. Correct because vertical common-size analysis involves stating each balance sheet item as a\npercentage of total assets. Accordingly, Cash and cash equivalents is stated as a percentage of\nTotal assets: Cash and cash equivalents / (Total current assets + Total non-current assets) = 40 /\n(125 + 35) = 40 / 160 = 25%.\nC. Incorrect because it states Cash and cash equivalents as a percentage of Total current assets\ninstead of Total assets. Consequently, the calculation becomes Cash and cash equivalents / Total\ncurrent assets = 40 / 125 = 32%.", "qhtml": null}, {"n": 123, "q": "An analyst gathers the following information (in € thousands) about a company\nYear 2 Year 1\nRevenue 2,400 2,000\nCost of sales 1,800 1,400\nEnding accounts payable 180 220\nBased only on this information, the payables turnover ratio for Year 2 is", "opts": ["9.", "10", "12"], "ans": "A", "expl": "A. Correct because Payables turnover = Purchases / Average trade payables, or Purchases\n(proxied by cost of sales) / Average trade payables = 1,800 / ((180 + 220) / 2) = 1,800 / 200 = 9.\nThe number of days of payables reflects the average number of days the company takes to pay\nits suppliers, and the payables turnover ratio measures how many times per year the company\ntheoretically pays off all its creditors. For purposes of calculating these ratios, an implicit\nassumption is that the company makes all its purchases using credit. Cost of goods sold (or cost\nof sales) is sometimes used as an approximation of purchases.\nB. Incorrect because it uses ending accounts payable rather than average payables in the\ndenominator of the calculation, or = 1,800 / 180 = 10.\nC. Incorrect because it uses sales rather than cost of sales in the numerator of the calculation, or\n= 2,400 / ((180 + 220) / 2) = 2,400 / 200 = 12.", "qhtml": null}, {"n": 124, "q": "An analyst gathers the following information about a company\nYear 2 Year 1\nDays of inventory on hand 11 13\nDays of sales outstanding 24 22\nPayables turnover 36 18\nBased only on the cash conversion cycle, the company's liquidity position from Year 1 to Year\n2 has", "opts": ["deteriorated.", "remained the same.", "improved"], "ans": "A", "expl": "A. Correct because the Cash conversion cycle (net operating cycle) (CCC) = Days of inventory on\nhand + Days of sales outstanding - Number of days of payables, and thí metrics indicates the\namount of time that elapses from the point when a company invests in working capital until the\npoint at which the company collects cash. A shorter cash conversion cycle indicates greater\nliquidity. A longer cash conversion cycle indicates lower liquidity. Also, Payables turnover =\nPurchases/ Average trade payables and Number of days of payables = Number of days in period\n/ Payables turnover. Accordingly, the number of days payables for Year 2 = Number of days in\nperiod / Payables turnover, or 365 / 36 = 10.1389 and the number of days payables for Year 1 =\nNumber of days in period / Payables turnover = 365 / 18 = 20.2778 (365 is used for the number\nof days in a year given the annual date). The CCC for Year 2 = DOH + DOS – Number of days of\npayables, or 11 + 24 – 10.1389 = 24.8611 and the CCC for Year 1 = 14.7222. As the CCC is higher\n(longer) in Year 2 than in Year 1, the company’s liquidity based on its CCC alone has\ndeteriorated.\nB. Incorrect because it did not consider the Number of days of payables in the calculation of the\nCCC. The calculation CCC for Year 2 = Days of inventory on hand + Days of sales outstanding = 11\n+ 24 = 35, and CCC for Year 1 = Days of inventory on hand + Days of sales outstanding = 13 + 22\n= 35. As the CCC calculated for Year 2 is the same as Year 1, the company's liquidity based on its\nCCC alone remained the same.\nC. Incorrect because it did not convert the Payables turnover ratio to Number of days of\npayables. Instead, CCC for Year 2 = Days of inventory on hand + Days of sales outstanding -\nPayables turnover = 11 + 24 - 36 = -1, and CCC for Year 1 = Days of inventory on hand + Days of\nsales outstanding - Payables turnover = 13 + 22 - 18 = 17. As the CCC is lower (shorter) in Year 2\nthan in Year 1, the company's liquidity based on its CCC alone appears to have improved.", "qhtml": null}, {"n": 125, "q": "The role of financial reporting is best described as", "opts": ["making operating investing and financial decisions.", "providing information about a company's performance, financial position, and change in financial position", "evaluating a company's past, current, and potential performance for the purpose of making economic decisions"], "ans": "B", "expl": "A. Incorrect because the role of financial reporting issued by companies is to provide\ninformation about a company's performance, financial position, and changes in financial\nposition. The answer describes the role of management analyses managers within a company\nperform financial analysis to make operating, investing, and financing decisions but do not\nnecessarily rely on analysis of related financial statements.\nB. Correct because the role of financial reporting issued by companies is to provide information\nabout a company's performance, financial position, and changes in financial position.\nC. Incorrect because the role of financial reporting issued by companies is to provide\ninformation about a company's performance, financial position, and changes in financial\nposition. The answer describes the role of financial statement analysis. The role of financial\nstatement analysis is to use financial reports prepared by companies, combined with other\ninformation, to evaluate the past, current, and potential performance and financial position of a\ncompany for the purpose of making investment, credit, and other economic decisions.", "qhtml": null}, {"n": 126, "q": "An analyst gathers the following information (in E millions) about a company\nEBIT 16\nNet income 8\nInterest payments 6\nLease payments 4\nThe fixed charge coverage ratio is closest to", "opts": ["1.2.", "1.8.", "2.0"], "ans": "C", "expl": "A. Incorrect because it uses Net income instead of EBIT. Accordingly, Fixed charge coverage ratio\n= (Net income + Lease payments) / (Interest payments + Lease payments) = (8 + 4) / (6 + 4) = 12\n/ 10 = 1.2.\nB. Incorrect because it sums Lease payments in the numerator. Accordingly, Fixed charge\ncoverage ratio = EBIT / (Interest payments + Lease payments) = 16 / (6 + 4) = 16 / 10 = 1.6.\nC. Correct because the fixed charge coverage ratio relates fixed financing charges, or\nobligations, to the cash flow generated by the company. It measures the number of times a\ncompany's earnings (before interest, taxes, and lease payments) can cover the company's\ninterest and lease payments. Accordingly, Fixed charge coverage ratio = (EBIT + Lease payments)\n/ (Interest payments + Lease payments) = (16 + 4) / (6 + 4) = 20 / 10 = 2.0. For computing this\nratio, an assumption sometimes made is that one-third of the lease payment amount represents\ninterest on the lease obligation and that the rest is a repayment of principal on the obligation.\nFor this variant of the fixed charge coverage ratio, the numerator is EBIT plus one-third of lease\npayments, and the denominator is interest payments plus one-third of lease payments.\nAccordingly, Fixed charge coverage ratio = (EBIT + (Lease payments / 3)) / (Interest payments +\n(Lease payments / 3)) = (16 + (4 / 3)) / (6 + (4 / 3)) = (16 + 1.33) / (6 + 1.33) ≈ 17.33 / 7.33 ≈ 2.36,\nwhich is also closest to 2.0.", "qhtml": null}, {"n": 127, "q": "Under US GAAP the recognition of a valuation allowance for deferred tax assets impacts", "opts": ["the effective tax rate only", "the statutory tax rate only", "both the effective tax rate and statutory lax rate"], "ans": "A", "expl": "A. Correct because, under US GAAP, a valuation allowance for deferred tax assets impacts the\neffective tax rate only. Establishing a valuation allowance reduces the deferred tax asset and\nincome in the period in which the allowance is established. Also, Reported effective tax rate =\nIncome tax expense / Pretax income (Accounting profit).\nB. Incorrect because, under US GAAP, the recognition of a valuation allowance for deferred tax\nassets impacts the effective tax rate only.\nC. Incorrect because, under US GAAP, the recognition of a valuation allowance for deferred tax\nassets impacts the effective tax rate only.", "qhtml": null}, {"n": 128, "q": "A copyright, for which an active market exists, has a set finite life and is used in a\ncompany’s operations over more than one fiscal period. Under US GAAP, this copyright is\nreported using:", "opts": ["only the cost model", "only the revaluation model", "either the cost or the revaluation model"], "ans": "A", "expl": "A. Correct because under US GAAP, companies are required to use the cost model to value\nintangible assets. IFRS allows companies to value intangible assets under a cost model or under\na revaluation model. The revaluation model can only be selected when there is an active market\nfor an intangible asset.\nB. Incorrect because the revaluation model is not allowed under US GAAP; however, IFRS\npermits the use of the revaluation model or the cost model.\nC. Incorrect because the revaluation model is not allowed under US GAAP; however, IFRS\npermits the use of the revaluation model or the cost model.", "qhtml": null}, {"n": 129, "q": "Compared to purchasing an asset using debt, leasing an asset is most likely to", "opts": ["have a higher financing cost", "require a greater down payment.", "reduce lessee's exposure to obsolescence"], "ans": "C", "expl": "A. Incorrect because there are several advantages to leasing an asset compared to purchasing.\nCost effectiveness: Leases are a form of secured borrowing. In the event of non-payment, the\nlessor simply repossesses the leased asset. As a result, the effective interest rate for a lease is\ntypically lower than what the lessee would pay on an unsecured loan or bond.\nB. Incorrect because there are several advantages to leasing an asset compared to purchasing.\nLess cash is needed upfront. Lessees typically require little, if any, down payment.\nC. Correct because there are several advantages to leasing an asset compared to purchasing it:\nConvenience and lower risks associated with asset ownership such as obsolescence.", "qhtml": null}, {"n": 130, "q": "An analyst gathers the following information (in € millions) about a company\nYear 2 Year 1\nRevenues 2,100 2,000\nAccounts receivable 230 200\nCash 70 50\nCash received from customers (in € millions) in Year 2 is:", "opts": ["2,070", "2,120.", "2,130"], "ans": "A", "expl": "A. Correct because to determine the approximate cash receipts from its customers, it is\nnecessary to adjust this revenue by the net change in accounts receivable for the year. Revenue\nminus the change in receivables: 2,100 - (230 - 200) = 2,070.\nB. Incorrect because it adds the change in cash to revenues rather than subtracting the change\nin receivables: 2,100 + (70 - 50) = 2,120.\nC. Incorrect because it adds the change in accounts receivable to revenue rather than\nsubtracting the change: 2,100 + (230 - 200) = 2,130.", "qhtml": null}];
const CFG = {"title": "Financial Statement Analysis", "subtitle": "Ngân hàng câu hỏi CFA chính thức — Level I", "minutes": 258, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|\(?required\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect)\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect)\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  return sections;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("resumeNote").classList.remove("show");
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;

  function showResult(pass, badgeText){

    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');

      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>

<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
