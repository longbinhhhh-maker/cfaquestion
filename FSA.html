AAP của Hoa Kỳ khác với tuyên bố này.\nC. Không chính xác vì mặc dù việc tiết lộ thông tin rất hữu ích khi phân tích một công ty nhưng phần thứ hai\ncủa việc tiết lộ về việc đảo ngược khoản giảm giá trị không được áp dụng theo US GAAP. GAAP Hoa Kỳ\nkhông cho phép hoàn nguyên khoản ghi giảm hàng tồn kho năm trước. Các tiết lộ bắt buộc theo\nUS GAAP liên quan nhiều hơn đến chính sách kế toán, các ước tính quan trọng áp dụng cho hàng tồn kho,\nvà bất kỳ khoản thu nhập vật chất nào có được từ việc thanh lý hàng tồn kho LIFO.","qhtml":null},{"n":49,"q":"An analyst gathers the following Information about a company's non-depreciable asset\nreported under the revaluation model\nOriginal cost €25,000\nReported value after initial evaluation €27.600\nReported value after second revelation 22.500\nThe revaluation surplus after the second revaluation is:","opts":["€2,500","€0","€2.600"],"ans":"B","expl":"A. Không chính xác vì do đánh giá lại, giá trị tài sản\ntăng lên €2.500 trong năm đầu tiên (€27.500 - €25.000) được ghi vào tài khoản thặng dư đánh giá lại trong vốn chủ sở hữu.\nSau đó, giá trị hợp lý giảm €5.000 (€22.500 - €27.500) trong năm thứ hai là\ngiả định chỉ được áp dụng cho tài khoản thặng dư đánh giá lại, dẫn đến số dư là -€2.500\n(-€25.000 - €5.000).\nB. Đúng vì theo mô hình đánh giá lại, khi giá trị của một tài sản tăng lên, phần thặng dư\nsẽ chuyển trực tiếp sang vốn chủ sở hữu. Bất kỳ sự giảm giá trị tài sản nào sau đó sẽ làm giảm thặng dư đánh giá lại\nvà sau đó ảnh hưởng đến báo cáo kết quả hoạt động kinh doanh. Do đó, mức tăng ban đầu\n€2.500 (€27.500 - €25.000) sẽ được chuyển vào tài khoản thặng dư đánh giá lại trong vốn chủ sở hữu. Trong số\ngiảm tiếp theo là €5.000 (€22.500 - €27.500) về giá trị hợp lý, €2.500 được sử dụng để giảm\nthặng dư đánh giá lại, trong khi €2.500 còn lại được đưa vào báo cáo thu nhập. Do đó, thặng dư đánh giá lại\nkết thúc ở mức €0.\nC. Không chính xác vì do việc đánh giá lại, mức tăng ban đầu là €2.500 (€27.500 -\n€25.000) sẽ được chuyển vào tài khoản thặng dư đánh giá lại trong vốn chủ sở hữu. Việc giảm tiếp theo €5.000\n(€22.500 - €27.500) về giá trị hợp lý được tính vào báo cáo kết quả hoạt động kinh doanh và không trực tiếp\nảnh hưởng đến tài khoản thặng dư được đánh giá lại.","qhtml":null},{"n":50,"q":"An analyst gathers the following Information about an electronics manufacturing\ncompany's inventory.\nYear 2 Year 1\nCost €100,000 €100,000\nNet realizable value €105.000 €97,000\nAs a result of the reversal of the write-down, the company's Year 2 financial statements\nshould report a decrease in cost of sales of","opts":["€0","€3.000","€6.000"],"ans":"B","expl":"A. Không chính xác vì GAAP của Hoa Kỳ nghiêm cấm việc đảo ngược các khoản ghi giảm, chứ không phải IFRS.\nB. Đúng vì theo IFRS, hàng tồn kho được đo lường ở mức thấp hơn giữa chi phí và giá trị thuần\ncó thể thực hiện được. Với mỗi kỳ tiếp theo,\ngiá trị thuần có thể thực hiện được sẽ được đánh giá mới. Việc hoàn nhập bất kỳ khoản giảm giá hàng tồn kho nào, giới hạn ở số tiền ghi giảm ban đầu, được\nđược ghi nhận là giảm giá vốn hàng bán (tức là giảm số lượng hàng tồn kho\nđược ghi nhận là chi phí).\n© Vào ngày 31 tháng 12 của Năm 1, hàng tồn kho được ghi nhận trên bảng cân đối kế toán ở mức thấp hơn\nchi phí và giá trị ròng giá trị có thể thực hiện được: min(€100.000, €97.000) = €97.000.\n Việc ghi giảm hàng tồn kho bằng Giá vốn hàng tồn kho trừ đi Giá trị thuần có thể thực hiện được:\n€100.000 - (€97.000) = €3.000.\n© Vào ngày 31 tháng 12 của Năm 2, Giá trị thuần có thể thực hiện được (€105.000) cao hơn\nmức trước đó (vượt quá giá vốn hàng tồn kho). Việc hoàn nhập bất kỳ khoản giảm giá nào của\nhàng tồn kho được ghi nhận là khoản giảm giá vốn hàng bán và được giới hạn ở số tiền\nkhoản giảm giá ban đầu là €3.000.\nC. Không chính xác vì nó tính toán khoản hoàn nhập ghi giảm hàng tồn kho là chênh lệch\ngiữa giá trị thuần có thể thực hiện được tại ngày đánh giá tiếp theo và mức trước đó của nó (€105.000 -\n€97.000 = €8.000), trong khi việc hoàn nhập bất kỳ khoản ghi giảm hàng tồn kho nào được giới hạn ở số tiền\ncủa khoản ghi giảm ban đầu, tức là €3.000.","qhtml":null},{"n":51,"q":"An analyst gathers the following Information about a company.\nROE 10%\nFinancial leverage 2.0\nNet profit margin 4%\nEBIT margin 5%\nInterest burden 85%\nThe total asset turnover ratio is closet to","opts":["1.0","1.3","1.5"],"ans":"B","expl":"A. Không chính xác vì nó đã bao gồm Biên EBIT trong tính toán thay vì Lợi nhuận ròng\nMargin. Theo đó, Vòng quay tổng tài sản = ROE/(EBIT Margin x Đòn bẩy); hoặc = 10% / (5% x 2) =\n10 / 10 = 1,0.\nB. Đúng vì theo phân tích của DuPont cho ROE, ROE = Tỷ suất lợi nhuận ròng × Tổng\n Vòng quay tài sản × Đòn bẩy. Do đó, sắp xếp lại công thức Vòng quay tổng tài sản: Tổng tài sản\nDoanh thu = ROE / (Biên lợi nhuận ròng × Đòn bẩy) = 10% / (4% × 2) = 10 / 8 = 1,25, xấp xỉ\n1,3.\nC. Không chính xác vì nó bao gồm Gánh nặng lãi suất trong phép tính. Theo đó, Tổng tài sản\nDoanh thu = ROE / (Biên lợi nhuận ròng × Đòn bẩy × Gánh nặng lãi vay); hoặc = 10% / (4% × 2 × 85%) =\n10 / 6,8 ≈ 1,471, xấp xỉ 1,5.","qhtml":null},{"n":52,"q":"All else being equal, in a period of stable inventory quantities and declining inventory unit\ncosts, using the LIFO Inventory valuation method will result in a lower:","opts":["gross profit than if the FIFO inventory valuation method had been used","current ratio than if the FIFO Inventory valuation method had been used","Inventory turnover ratio than if the FIFO inventory valuation method had been used."],"ans":"C","expl":"A. Không chính xác vì nếu giá mua hàng tồn kho đang giảm thì việc sử dụng phương pháp định giá LIFO Inventory\nsẽ mang lại lợi nhuận gộp cao hơn so với các phương pháp khác.\nB. Không chính xác vì nếu giá mua hàng tồn kho đang giảm thì việc sử dụng phương pháp LIFO để định giá hàng tồn kho\nsẽ dẫn đến tỷ lệ hiện tại cao hơn so với các phương pháp khác. Việc sử dụng\nphương pháp LIFO dẫn đến tài sản hiện tại tồn kho cuối kỳ cao hơn so với các phương pháp khác.\nDo đó, tỷ lệ hiện tại, được định nghĩa là tài sản hiện tại chia cho nợ ngắn hạn, sẽ\ncao hơn khi tài sản hiện tại (Hàng tồn kho) sẽ cao hơn và nợ ngắn hạn sẽ không bị ảnh hưởng bởi\nviệc lựa chọn phương pháp định giá hàng tồn kho.\nC. Đúng vì nếu giá mua hàng tồn kho đang giảm thì việc sử dụng phương pháp LIFO để định giá hàng tồn kho\nsẽ dẫn đến lượng hàng tồn kho cuối kỳ cao hơn và chi phí bán hàng thấp hơn so với\nvới các phương pháp định giá hàng tồn kho khác. Vòng quay hàng tồn kho được xác định bằng giá vốn hàng bán chia cho\nhàng tồn kho trung bình. Vì chi phí bán hàng theo LIFO sẽ thấp hơn so với FIFO và\nhàng tồn kho trung bình sẽ cao hơn theo LIFO so với FIFO trong giai đoạn chi phí đơn vị\ngiảm, vòng quay hàng tồn kho sẽ thấp hơn trong LIFO so với FIFO trong giai đoạn chi phí đơn vị\nhàng tồn kho giảm.","qhtml":null},{"n":53,"q":"An analyst collects the following information (in € millions) about a manufacturing\ncompany's inventory\nOriginal cost 2,000\nNet realizable value at end of Year 1 1,700\nNet realizable value at end of Year 2 2,500\nAt the end of Year 2, thee balance sheet should reflect inventory (in € millions) of","opts":["1,700.","2,000.","2,500."],"ans":"B","expl":"A. Không chính xác vì trong mỗi kỳ tiếp theo, một đánh giá mới về giá trị thuần có thể thực hiện được\nđược thực hiện. Cần phải đảo ngược (giới hạn ở số lượng ghi giảm ban đầu) để\ntăng giá trị hàng tồn kho đã ghi lại trước đó. Không được phép đảo ngược đối với US GAAP,\nđiều này sẽ dẫn đến câu trả lời này. Hàng tồn kho sẽ được ghi giảm từ 2.000 xuống 1.700 trong Năm\n1 và số tiền đảo ngược trong Năm 2 sẽ được giới hạn ở mức ghi giảm ban đầu là 300, đưa giá trị\ntrở lại 2.000 vào cuối Năm 2.\nB. Đúng vì trong mỗi kỳ tiếp theo, một đánh giá mới về giá trị thuần có thể thực hiện được\nđược thực hiện. Cần phải đảo ngược (giới hạn ở số lượng ghi giảm ban đầu) để\ntăng giá trị hàng tồn kho đã ghi lại trước đó. Khoảng không quảng cáo sẽ được ghi giảm từ\n2.000 xuống 1.700 trong Năm 1 và số tiền đảo ngược trong Năm 2 sẽ được giới hạn ở mức ghi giảm ban đầu\nlà 300, đưa giá trị trở lại 2.000 vào cuối Năm 2.\nC. Không chính xác vì trong mỗi kỳ tiếp theo, một đánh giá mới về giá trị thuần có thể thực hiện được\nđược thực hiện. Cần phải đảo ngược (giới hạn ở số lượng ghi giảm ban đầu) để\ntăng giá trị hàng tồn kho đã ghi lại trước đó. Câu trả lời sai có được bằng cách\nghi hàng tồn kho lên tới giá trị thuần có thể thực hiện được của Năm thứ 2.","qhtml":null},{"n":54,"q":"In an environment of steadily increasing prices and quantities reported, ending inventory\nmost closely reflects current replacement value under the","opts":["FIFO method using a periodic inventory system","LIFO method using a periodic inventory system.","LIFO method using a perpetual inventory system."],"ans":"A","expl":"A. Đúng vì FIFO giả định rằng những mặt hàng tồn kho lâu đời nhất sẽ được bán trước, còn lại những mặt hàng tồn kho nhiều nhất sẽ được bán trước.\nhàng tồn kho được mua gần đây trên bảng cân đối kế toán. Giá trị ghi sổ của hàng tồn kho theo\nFIFO sẽ phản ánh chặt chẽ hơn giá trị thay thế hiện tại vì hàng tồn kho được giả định là\nbao gồm các mặt hàng được mua gần đây nhất. Các công ty thường ghi lại những thay đổi đối với hàng tồn kho\nsử dụng hệ thống kiểm kê định kỳ hoặc hệ thống kiểm kê thường xuyên. Dưới một trong hai hệ thống,\nviệc phân bổ hàng hóa sẵn có để bán vào giá vốn hàng bán và hàng tồn kho cuối kỳ là như nhau nếu\nPhương pháp định giá hàng tồn kho được sử dụng là phương pháp xác định cụ thể hoặc FIFO.\nB. Không chính xác vì theo LIFO, các mặt hàng tồn kho được mua gần đây nhất được giả định là\nđược bán trước, do đó các khoản mục được tính vào giá vốn hàng bán phản ánh chặt chẽ hơn giá trị hiện tại\ngiá trị thay thế. Tuy nhiên, hàng tồn kho trong bảng cân đối kế toán sẽ phản ánh kỳ trước (thấp hơn trong trường hợp này).\ntrường hợp) giá cả. Chi phí bán hàng theo LIFO sẽ phản ánh chặt chẽ hơn giá trị thay thế hiện tại.\nMặc dù giá trị ghi sổ của hàng tồn kho cuối kỳ có thể khác nhau (so với giá trị ghi sổ định kỳ\nhệ thống) vì hệ thống vĩnh viễn sẽ áp dụng LIFO liên tục trong suốt cả năm,\nảnh hưởng của việc tăng giá và số lượng sẽ dẫn đến lượng hàng tồn kho được báo cáo thấp hơn trên bảng cân đối kế toán\ntrang tính hơn giá trị thay thế hiện tại.\nC. Không chính xác vì theo LIFO, các mặt hàng tồn kho được mua gần đây nhất được giả định là\nđược bán trước, do đó các khoản mục được tính vào giá vốn hàng bán phản ánh chặt chẽ hơn giá trị hiện tại\ngiá trị thay thế. Tuy nhiên, hàng tồn kho trong bảng cân đối kế toán sẽ phản ánh kỳ trước (thấp hơn trong trường hợp này).\ntrường hợp) giá cả. Chi phí bán hàng theo LIFO sẽ phản ánh chặt chẽ hơn giá trị thay thế hiện tại.\nMặc dù giá trị ghi sổ của hàng tồn kho cuối kỳ có thể khác nhau (so với giá trị ghi sổ định kỳ\nhệ thống) vì hệ thống vĩnh viễn sẽ áp dụng LIFO liên tục trong suốt cả năm,\nảnh hưởng của việc tăng giá và số lượng sẽ dẫn đến lượng hàng tồn kho được báo cáo thấp hơn trên bảng cân đối kế toán\ntrang tính hơn giá trị thay thế hiện tại.","qhtml":null},{"n":55,"q":"An analyst gathers the following information (in € thousands) about a company's non-\ndepreciable asset\nHistorical cost 50\nCarrying value after impairment, 31 December of Year 1 40\nRecoverable amount, 31 December of Year 2 60\nThe maximum allowable carrying amount (in € thousands) on the Year 2 balance sheet is","opts":["40","50","60"],"ans":"B","expl":"A. Không chính xác vì được phép điều chỉnh trong mọi trường hợp theo IFRS. Tình huống duy nhất\nkhi tổn thất không thể hoàn nguyên là theo GAAP của Hoa Kỳ đối với tài sản được giữ để sử dụng. Theo GAAP của Hoa Kỳ,\nkhoản lỗ do suy giảm giá trị sẽ không được hoàn lại, vẫn ở mức 40.000 €.\nB. Đúng vì khi ghi nhận khoản lỗ do suy giảm giá trị trong Năm 1, chi phí lưu trữ đã giảm từ\n€50.000 xuống còn €40.000, do đó, khoản lỗ do suy giảm giá trị là €10.000 đã được báo cáo. Việc đảo ngược chỉ có thể được thực hiện\nđối với giá trị ghi sổ trước đó, chứ không phải toàn bộ giá trị có thể thu hồi được. Do đó, với sự đảo ngược\n, chi phí vận chuyển sẽ trở lại mức trước đó là €50.000. Lưu ý rằng IFRS chỉ cho phép hoàn nhập\ncác khoản lỗ do suy giảm giá trị. IFRS không cho phép đánh giá lại giá trị có thể thu hồi được nếu\ngiá trị có thể thu hồi vượt quá giá trị ghi sổ trước đó.\nC. Không chính xác vì IFRS chỉ cho phép hoàn nhập khoản lỗ do suy giảm giá trị. IFRS không cho phép\nđánh giá lại giá trị có thể thu hồi được nếu giá trị có thể thu hồi vượt quá giá trị ghi sổ trước đó\n. Trước đây, chi phí lưu trữ đã giảm từ €50.000 xuống €40.000, do đó, khoản lỗ do suy giảm giá trị\n€10.000 đã được báo cáo. Việc hoàn nhập chỉ có thể được thực hiện đối với giá trị ghi sổ trước đó.\nDo đó, chi phí ghi sổ mới không thể tăng lên toàn bộ số tiền có thể thu hồi được là €60.000.","qhtml":null},{"n":56,"q":"All else being equal, a write down of inventory by a manufacturing company most likely\nresults in a","opts":["lower total asset turnover ratio and a lower current ratio","higher total asset turnover ratio and a lower current ratio.","lower total asset turnover ratio and a higher current ratio."],"ans":"B","expl":"A. Không chính xác vì việc ghi giảm hàng tồn kho xuống giá trị thấp hơn sẽ làm giảm cả doanh thu\ntổng tài sản và tỷ lệ hiện tại. Tổng vòng quay tài sản, được tính bằng cách chia doanh thu thuần cho tổng tài sản\ntrung bình, sẽ giảm khi mẫu số (tổng tài sản trung bình) giảm do giá trị hàng tồn kho\ngiảm. Tương tự, tỷ lệ hiện tại, được tính bằng tài sản hiện tại chia cho\nnợ ngắn hạn, sẽ giảm do giảm hàng tồn kho (một thành phần của tài sản hiện tại)\nlàm giảm tử số, ảnh hưởng đến tỷ lệ.\nB. Đúng vì khi giá trị hàng tồn kho giảm xuống dưới giá trị ghi sổ trên bảng cân đối kế toán\n, giá trị ghi sổ hàng tồn kho phải được ghi xuống giá trị thuần có thể thực hiện được.\nViệc ghi giảm này làm giảm cả hàng tồn kho và giá trị ghi sổ của hàng tồn kho trên bảng cân đối kế toán\n, ảnh hưởng đến vòng quay tài sản và tỷ lệ khả năng thanh toán. Tỷ lệ vòng quay tổng tài sản, được tính bằng\nchia doanh thu thuần cho tổng tài sản trung bình, sẽ tăng do tổng tài sản\ntrung bình giảm do ghi giảm giá trị. Tuy nhiên, tỷ lệ hiện tại, được tính bằng tài sản lưu động\nchia cho nợ ngắn hạn, giảm vì việc giảm hàng tồn kho ảnh hưởng đến tử số trong khi\nnợ ngắn hạn không bị ảnh hưởng.\nC. Không chính xác vì việc ghi giảm hàng tồn kho xuống giá trị thuần có thể thực hiện được sẽ dẫn đến tỷ lệ vòng quay tổng tài sản\nthấp hơn và tỷ lệ khả năng thanh toán ngắn hạn thấp hơn do giá trị hàng tồn kho giảm\ntác động tiêu cực đến cả hai tỷ lệ.\nLưu ý: \"Tất cả các yếu tố khác đều bằng nhau\" đã được xem xét trong phân tích này để tách biệt tác động của việc\nghi giảm hàng tồn kho lên các tỷ lệ tài chính này.","qhtml":null},{"n":57,"q":"On the statement of cash flows, interest paid should be classified as","opts":["a financing cash flow only","an operating cash flow only.","ether a financing or an operating cash flow"],"ans":"C","expl":"A. Không chính xác vì IFRS cho phép các công ty phân loại chi phí lãi vay là hoạt động\nhoạt động hoặc hoạt động tài chính. Đây là cách xử lý cổ tức được trả theo US GAAP US GAAP\nphân loại cổ tức trả cho cổ đông như một hoạt động tài chính.\nB. Không chính xác vì IFRS cho phép các công ty phân loại chi phí lãi vay là hoạt động\nhoạt động hoặc hoạt động tài chính. Đây là cách xử lý tiền lãi được trả theo US GAAP US GAAP\nchi phí lãi vay loại như một hoạt động điều hành, mặc dù số tiền gốc của khoản nợ\nđã phát hành được phân loại là một hoạt động tài chính.\nC. Đúng vì IFRS cho phép linh hoạt hơn trong việc báo cáo các khoản mục như lãi vay đã trả.\nIFRS cho phép các công ty phân loại Chi phí lãi vay là hoạt động điều hành hoặc hoạt động\ntài chính.","qhtml":null},{"n":58,"q":"An analyst gathers the following information (in millions) about an automobile\nmanufacturer's inventory:\nYear 2 Year 1\nCost of goods sold 600 700\nCost of inventory 100 90\nNet realizable value of inventory 120 80\nThe Inventory turnover (calculated using average inventory in Year 2) is closest to:","opts":["6.0","6.3","6.7"],"ans":"C","expl":"A. Không chính xác vì vòng quay hàng tồn kho trong Năm 2 được tính toán dựa trên mức trung bình\nGiá trị thuần có thể thực hiện được của hàng tồn kho trong hai năm. Do đó, Vòng quay hàng tồn kho trong\nNăm 2 = Giá vốn hàng bán / Hàng tồn kho trung bình = 600 / ((120 + 80) / 2) = 600 / 100 = 6,0.\nB. Không chính xác vì vòng quay hàng tồn kho trong Năm 2 được tính toán dựa trên mức trung bình\nChi phí tồn kho trong hai năm. Do đó, Vòng quay hàng tồn kho trong Năm 2 = Giá vốn\nhàng bán / Hàng tồn kho trung bình = 600 / ((100 + 90) / 2) = 600 / 95 = 6,3.\nC. Đúng vì theo IFRS, hàng tồn kho phải được đo lường (và được ghi trên bảng cân đối kế toán\n) ở mức thấp hơn giữa chi phí và giá trị thuần có thể thực hiện được. Theo đó, lượng tồn kho của Năm 1 = 80 (là\nthấp hơn của 90 và 80) và lượng tồn kho của Năm 2 = 100 (là mức thấp hơn của 100 và 120). Hàng tồn kho\ndoanh thu trong Năm 2 = Giá vốn hàng bán / Hàng tồn kho trung bình = 600 / ((100 + 80) / 2) = 600 / 90 =\n6,7.","qhtml":null},{"n":59,"q":"An analyst gathers the following Information (in € thousands) about an electronics\nmanufacturing company's inventory.\nCost of ending inventory 3,600\nNet realizable value 3,300\nCurrent replacement cost 3,200\nNet realizable value less a normal profit margin 3,100\nThe Inventory (in € thousands) is carried on the balance sheet at","opts":["3,100.","3,200","3,300."],"ans":"C","expl":"A. Không chính xác vì nó giả định công ty báo cáo theo US GAAP và sử dụng phương pháp định giá hàng tồn kho LIFO\n, lấy giới hạn dưới của giá trị thị trường (tức là giá trị thuần có thể thực hiện được trừ\nbiên lợi nhuận thông thường) thay vì chi phí thay thế hiện tại. Theo đó, Min(Chi phí, Giá trị ròng\ncó thể thực hiện được trừ đi tỷ suất lợi nhuận thông thường) = Min(€3.600; €3.100) = €3.100.\nB. Không chính xác vì nó giả định công ty báo cáo theo US GAAP và sử dụng phương pháp định giá hàng tồn kho LIFO\n. Theo GAAP của Hoa Kỳ, đối với hàng tồn kho được đo bằng LIFO và phương pháp kiểm kê bán lẻ\n, giá trị thị trường được xác định là chi phí thay thế hiện tại (€3.200), tuân theo\ngiới hạn trên và dưới. Giới hạn dưới của giá trị thị trường là giá trị thuần có thể thực hiện được trừ đi tỷ suất lợi nhuận\nthông thường (€3.100). Theo đó, Min(Chi phí, Giá trị thị trường) = Min(€3.600, €3.200) = €3.200.\nC. Đúng vì theo IFRS, hàng tồn kho phải được đo lường (và được ghi trên bảng cân đối kế toán\n) ở mức thấp hơn giữa chi phí và giá trị thuần có thể thực hiện được. Theo đó, Min(Chi phí, Giá trị thuần có thể thực hiện được)\n= Min(€3.600, €3.300) = €3.300.","qhtml":null},{"n":60,"q":"For leases with a term of twelve months or less, the lessee:","opts":["may recognize lease payments on a straight-line basis.","must report at lease inception a \"right-of-use” asset and a lease liability, which are both equal to the present value of future lease payments","must report at lease inception a right-of-use asset and a lease liability, which are both equal to the undiscounted value of future lease payments"],"ans":"A","expl":"A. Đúng vì đối với bên thuê, có những miễn trừ kế toán cho thuê đối với một số hợp đồng thuê\n. Nếu thời hạn từ 12 tháng trở xuống (theo cả IFRS và US GAAP) hoặc đối với \"tài sản\ngiá trị thấp\" lên tới 5.000 USD hoặc số tiền tương tự (chỉ theo IFRS), bên thuê có thể chọn chỉ thanh toán\ncác khoản thanh toán tiền thuê theo phương pháp đường thẳng. Những miễn trừ này không áp dụng cho bên cho thuê.\nB. Không chính xác vì theo IFRS, có một mô hình kế toán duy nhất cho cả hợp đồng thuê tài chính và\nhoạt động cho bên thuê. Khi bắt đầu hợp đồng thuê, bên thuê ghi lại khoản nợ thuê và tài sản \"quyền\nsử dụng\" (ROU) trên bảng cân đối kế toán, cả hai đều bằng giá trị hiện tại của các khoản thanh toán\ncho thuê trong tương lai.\nC. Không chính xác vì theo IFRS, có một mô hình kế toán duy nhất cho cả hợp đồng thuê tài chính và\nhoạt động cho bên thuê. Khi bắt đầu hợp đồng thuê, bên thuê ghi lại khoản nợ thuê và tài sản có quyền sử dụng\n(ROU) trên bảng cân đối kế toán của mình, cả hai đều bằng giá trị hiện tại của các khoản thanh toán tiền thuê trong tương lai.","qhtml":null},{"n":61,"q":"According to the converged standards for revenue recognition, a receivable is recognized\non the seller's balance sheet when","opts":["a contract is signed","all performance obligations have been met except for payment","consideration is received in advance of transferring goods or services"],"ans":"B","expl":"A. Hợp đồng được ký kết. Theo các tiêu chuẩn tổng hợp về ghi nhận doanh thu,\nquá trình bao gồm năm bước:\n1. Xác định (các) hợp đồng với khách hàng.\n2. Xác định các nghĩa vụ thực hiện riêng biệt hoặc riêng biệt trong hợp đồng.\n3. Xác định giá giao dịch.\n4. Phân bổ giá giao dịch cho các nghĩa vụ thực hiện trong hợp đồng.\n5. Ghi nhận doanh thu khi (hoặc với tư cách) đơn vị đáp ứng nghĩa vụ thực hiện. Trong khi\nviệc ký kết hợp đồng sẽ được thực hiện theo các bước 1-4, bước 5 là bắt buộc để\nghi nhận doanh thu. Đơn vị sẽ chỉ ghi nhận doanh thu khi có thể đáp ứng được các yêu cầu\nnghĩa vụ thực hiện.\nB. Đúng vì chỉ khi tất cả các nghĩa vụ thực hiện đã được đáp ứng ngoại trừ\nkhoản thanh toán mà khoản phải thu xuất hiện trên bảng cân đối kế toán của người bán.\nC. Không chính xác vì chỉ khi tất cả các nghĩa vụ thực hiện đã được đáp ứng ngoại trừ\nkhoản thanh toán mà khoản phải thu xuất hiện trên bảng cân đối kế toán của người bán. Nếu nhận được sự xem xét trong\ntrước khi chuyển giao hàng hóa hoặc dịch vụ, người bán phải chịu trách nhiệm theo hợp đồng. Do đó,\nngười bán ghi nhận một khoản nợ hợp đồng hơn là một khoản phải thu.","qhtml":null},{"n":62,"q":"An analyst gathers the following Information about a company's equipment\nCarrying value prior to impairment €20,000\nUndiscounted expected future cash flows €22,000\nValue in use €17,400\nFair value if sold €19,100\nCosts to sell €1.900\nThe carrying value of the equipment should be","opts":["€17,200","€17,400.","€20,000"],"ans":"B","expl":"A. Không chính xác vì đó là giá trị của tài sản nếu được bán với chi phí bán thấp hơn, tức là giá trị thấp hơn chứ không phải\ncao hơn của giá trị hợp lý trừ chi phí bán và giá trị sử dụng của tài sản đó. Theo IFRS, công ty sẽ\nso sánh giá trị ghi sổ (€20.000) với giá trị hợp lý cao hơn trừ đi chi phí bán (€19.100 -\n€1.900 = €17.200) và giá trị sử dụng của nó (€17.400). Theo IFRS, giá trị ghi sổ là €17.400.\nB. Đúng vì nó thể hiện giá trị của tài sản đang sử dụng. Theo IFRS, công ty sẽ\nso sánh giá trị ghi sổ (€20.000) với giá trị hợp lý cao hơn trừ đi chi phí bán (€19.100 -\n€1.900 = €17.200) và giá trị sử dụng của nó (€17.400). Theo IFRS, giá trị ghi sổ là €17.400.\nC. Không chính xác vì đây là giá trị ghi sổ sau khi đánh giá tổn thất theo US GAAP:\ngiá trị ghi sổ (€20.000) được so sánh với dòng tiền dự kiến ​​trong tương lai chưa chiết khấu\n(€22.000). Giá trị ghi sổ nhỏ hơn dòng tiền dự kiến ​​trong tương lai chưa chiết khấu, do đó\ngiá trị ghi sổ được coi là có thể thu hồi được. Thiết bị sẽ tiếp tục được bán với giá\n€20.000 theo GAAP của Hoa Kỳ.","qhtml":null},{"n":63,"q":"Which of the following ratios would most likely be positively affected by an inventory\nwrite-down compared to the value absent the write down?","opts":["Activity","Liquidity","Solvency"],"ans":"A","expl":"A. Đúng vì các tỷ lệ hoạt động (chẳng hạn như Vòng quay hàng tồn kho và vòng quay tổng tài sản) sẽ\nbị ảnh hưởng tích cực bởi việc ghi giảm vì cơ sở tài sản (mẫu số) giảm.\nB. Không chính xác vì việc ghi giảm hàng tồn kho làm giảm cả lợi nhuận và giá trị ghi sổ của\nhàng tồn kho trên bảng cân đối kế toán, do đó có tác động tiêu cực đến lợi nhuận, tính thanh khoản và\ntỷ lệ khả năng thanh toán.\nC. Không chính xác vì việc ghi giảm hàng tồn kho làm giảm cả lợi nhuận và giá trị ghi sổ của\nhàng tồn kho trên bảng cân đối kế toán, do đó tác động tiêu cực đến lợi nhuận, tính thanh khoản và\ntỷ lệ khả năng thanh toán.","qhtml":null},{"n":64,"q":"A deferred tax asset has been previously recognized. At the current balance sheet date,\nthe criteria for economic benefits are not met but the tax differences are still expected to be\ntemporary. As a result:","opts":["The existing deferred tax asset should be reversed","a valuation allowance account should be established","the existing deferred tax asset should be reclassified as equity"],"ans":"A","expl":"A. Đúng vì nếu tài sản thuế thu nhập hoãn lại hoặc nợ phải trả thuế thu nhập hoãn lại phát sinh trong quá khứ nhưng tiêu chí\nlợi ích kinh tế không được đáp ứng vào ngày của bảng cân đối kế toán hiện tại thì theo IFRS, tài sản thuế thu nhập hoãn lại hoặc nợ thuế thu nhập hoãn lại liên quan đến khoản mục này sẽ bị đảo ngược.\nB. Không chính xác vì nếu tài sản thuế thu nhập hoãn lại hoặc nợ phải trả thuế thu nhập hoãn lại phát sinh trong quá khứ nhưng các tiêu chí về lợi ích kinh tế\nkhông được đáp ứng vào ngày của bảng cân đối kế toán hiện tại thì theo IFRS, tài sản thuế thu nhập hoãn lại hoặc nợ phải trả thuế thu nhập hoãn lại liên quan đến khoản mục này sẽ được đảo ngược. Theo GAAP của Hoa Kỳ, mức định giá\nđược thiết lập.\nC. Không chính xác vì nó đề cập đến nghĩa vụ thuế hoãn lại được báo cáo theo US GAAP. Phân tích\nnên phân loại nghĩa vụ thuế thu nhập hoãn lại là nợ nếu nghĩa vụ nợ dự kiến ​​sẽ được đảo ngược khi\nthanh toán thuế tiếp theo. Nếu khoản nợ phải trả dự kiến ​​không được đảo ngược thì sẽ không có kỳ vọng về dòng tiền ra\n và khoản nợ phải trả đó phải được coi là vốn chủ sở hữu.","qhtml":null},{"n":65,"q":"An analyst gathers the following information (in € thousands) about a company\nRevenue 5,000\nCash balance, beginning of year 2,000\nCash balance, end of year 2,000\nIncrease in accounts receivable 1.200\nCash received from customers (in € thousands) is:","opts":["3,800.","5,000","6,200."],"ans":"A","expl":"A. Đúng vì nếu doanh thu được báo cáo theo phương pháp kế toán dồn tích cao hơn số tiền thực tế\nthu được thì kết quả thường là sự gia tăng các khoản phải thu. Ngoài ra, Bắt đầu\ncác khoản phải thu cộng với Doanh thu trừ Tiền thu từ khách hàng bằng Tài khoản cuối kỳ\nphải thu, trình bày lại là: Tiền thu từ khách hàng = Khoản phải thu đầu kỳ +\nDoanh thu - Các khoản phải thu cuối kỳ hoặc Doanh thu - Tăng các khoản phải thu = 5.000 -\n1.200 = 3.800.\nB. Không chính xác vì nó bằng Doanh thu (3.000) hoặc Thay đổi ngược trong số dư tiền mặt (thay vào đó\ncủa Thay đổi các khoản phải thu) = 6.000 - (2.000 - 2.000) = 6.000 - 0 = 5.000.\nC. Không chính xác vì giả định Tiền thu từ khách hàng = Doanh thu + Tăng trong\nkhoản phải thu = 5.000 + 1.200 = 6.200.","qhtml":null},{"n":66,"q":"Which of the following is an inventory related financial statement disclosure required\nunder US GAAP?","opts":["The carrying amount of inventories carried at fair value less costs to sell.","The circumstances or events that led to the reversal of a prior-year write-down of inventories","The amount of reversal of any prior year write-down of inventories that is recognized as a reduction in cost of sales in the current period."],"ans":"A","expl":"A. Đúng vì IFRS yêu cầu tám công bố báo cáo tài chính liên quan đến hàng tồn kho,\nbao gồm (1) giá trị còn lại của hàng tồn kho được ghi nhận theo giá trị hợp lý trừ đi chi phí bán, (2) giá trị\nsố tiền hoàn nhập của bất kỳ khoản ghi giảm nào được ghi nhận là khoản giảm giá vốn hàng bán trong\ntrong kỳ, và (3) các tình huống hoặc sự kiện dẫn đến việc hoàn nhập việc ghi giảm giá trị\nhàng tồn kho. Các thông tin tiết lộ liên quan đến hàng tồn kho theo US GAAP rất giống với các thông tin tiết lộ\nở trên, ngoại trừ yêu cầu (2) và (3) không liên quan vì US GAAP không cho phép\nsự đảo ngược của việc ghi giảm hàng tồn kho năm trước.\nB. Không chính xác vì các thông tin tiết lộ liên quan đến hàng tồn kho theo US GAAP rất giống với\ncông bố thông tin theo IFRS, ngoại trừ yêu cầu \"hoàn cảnh hoặc sự kiện dẫn đến\nhoàn nhập việc ghi giảm hàng tồn kho\" là không liên quan vì GAAP của Hoa Kỳ không cho phép\nđảo ngược việc ghi giảm hàng tồn kho năm trước.\nC. Không chính xác vì các thông tin tiết lộ liên quan đến hàng tồn kho theo US GAAP rất giống với\ncông bố theo IFRS, ngoại trừ yêu cầu \"giá trị hoàn nhập của bất kỳ khoản ghi nợ nào\ngiảm được ghi nhận là khoản giảm giá vốn hàng bán trong kỳ\" là không phù hợp vì Hoa Kỳ\nGAAP không cho phép đảo ngược việc ghi giảm hàng tồn kho năm trước.","qhtml":null},{"n":67,"q":"All else being equal in a period of declining inventory unit costs and constant inventory\nquantities, which of the following inventory valuation methods most likely allocates a higher\namount of the total cost of goods available available for sale to cost of sales on the income\nstatement?","opts":["FIFO","LIFO","Weighted average cost"],"ans":"A","expl":"A. Đúng vì trong môi trường chi phí đơn vị hàng tồn kho giảm và số lượng hàng tồn kho không đổi hoặc\ntăng, FIFO (so với chi phí bình quân gia quyền hoặc LIFO) sẽ\nphân bổ số tiền cao hơn trong tổng giá vốn hàng hóa sẵn có để bán vào giá vốn bán hàng trên báo cáo thu nhập\nvà số tiền thấp hơn cho hàng tồn kho cuối kỳ trên bảng cân đối kế toán. Theo đó,\ndo chi phí bán hàng sẽ cao hơn theo FIFO nên lợi nhuận gộp, lợi nhuận hoạt động và\nthuế thu nhập của công ty sẽ thấp hơn.\nB. Không chính xác vì trong môi trường chi phí đơn vị hàng tồn kho giảm và số lượng hàng tồn kho không đổi hoặc\ntăng, FIFO (so với chi phí bình quân gia quyền hoặc LIFO) sẽ\nphân bổ số tiền cao hơn trong tổng giá vốn hàng hóa sẵn có để bán vào giá vốn bán hàng trên báo cáo thu nhập\nvà số tiền thấp hơn cho hàng tồn kho cuối kỳ trên bảng cân đối kế toán. Theo đó,\ndo chi phí bán hàng sẽ cao hơn theo FIFO nên lợi nhuận gộp, lợi nhuận hoạt động và\nthuế thu nhập của công ty sẽ thấp hơn. Để so sánh, trong giai đoạn chi phí đơn vị hàng tồn kho giảm, LIFO sẽ\ndẫn đến lượng hàng tồn kho cao hơn và chi phí bán hàng thấp hơn. Vì chi phí giảm trong kỳ nên LIFO\ncó lượng hàng tồn kho cuối kỳ cao nhất, chi phí bán hàng thấp nhất và lợi nhuận gộp cao nhất\n[so với Nhận dạng cụ thể, Chi phí trung bình có trọng số và FIFO].\nC. Không chính xác vì trong môi trường chi phí đơn vị hàng tồn kho giảm và số lượng hàng tồn kho không đổi hoặc\ntăng, FIFO (so với chi phí bình quân gia quyền hoặc LIFO) sẽ\nphân bổ số tiền cao hơn trong tổng giá vốn hàng hóa sẵn có để bán vào giá vốn bán hàng trên báo cáo thu nhập\nvà số tiền thấp hơn cho hàng tồn kho cuối kỳ trên bảng cân đối kế toán. Theo đó,\ndo chi phí bán hàng sẽ cao hơn theo FIFO nên lợi nhuận gộp, lợi nhuận hoạt động và\nthuế thu nhập của công ty sẽ thấp hơn.","qhtml":null},{"n":68,"q":"The adjustments related to changes in the estimated residual value of a long-lived asset\nshould be","opts":["handled prospectively","shown separately on the income statement","handled retrospectively unless impractical to do so."],"ans":"A","expl":"A. Đúng vì vì, trái ngược với những thay đổi trong chính sách kế toán (chẳng hạn như liệu có tính chi phí\nchi phí mua cổ phiếu của nhân viên hay không), các công ty đôi khi thực hiện những thay đổi trong ước tính\nkế toán chẳng hạn như thời gian sử dụng hữu ích của một tài sản có thể khấu hao. Những thay đổi trong ước tính kế toán\nđược xử lý phi hồi cứu, với những thay đổi này ảnh hưởng đến báo cáo tài chính trong khoảng thời gian\nthay đổi và các kỳ trong tương lai. Không có điều chỉnh nào được thực hiện đối với các báo cáo trước đó và việc điều chỉnh\nkhông được thể hiện trên mặt báo cáo thu nhập. B. Không chính xác vì, trái ngược với những thay đổi trong\nchính sách kế toán, những thay đổi trong ước tính kế toán, chẳng hạn như thời gian sử dụng hữu ích của tài sản\ncó thể khấu hao, được xử lý theo phương pháp hồi cứu. Chúng ảnh hưởng đến báo cáo tài chính trong kỳ thay đổi\nvà các giai đoạn trong tương lai. Không có điều chỉnh nào được thực hiện đối với các báo cáo trước đó và việc điều chỉnh này không\nđược thể hiện riêng biệt trên mặt báo cáo kết quả hoạt động kinh doanh. C. Không đúng vì, trái ngược với\nnhững thay đổi trong chính sách kế toán, những thay đổi trong ước tính kế toán, chẳng hạn như thời gian sử dụng hữu ích của một\ntài sản có thể khấu hao, được xử lý phi hồi tố. Chúng ảnh hưởng đến báo cáo tài chính trong kỳ\ncó nhiều thay đổi và các giai đoạn trong tương lai. Không có điều chỉnh nào được thực hiện đối với các báo cáo trước đó và\nđiều chỉnh không được hiển thị riêng trên mặt báo cáo thu nhập.","qhtml":null},{"n":69,"q":"Which of the following might indicate that a company uses aggressive accounting choices\nto increase its reported performance and financial position in the current period?","opts":["Increasing the estimated salvage values of PPSE","Changing the depreciation method from straight-line to double-declining balance","Changing from weighted average to FIFO Inventory valuation method in a period of declining inventory prices and constant inventory quantities"],"ans":"A","expl":"A. Đúng vì việc tăng giá trị thu hồi ước tính là một ví dụ về chính sách kế toán\n(hoặc linh hoạt) không bảo thủ. Chi phí khấu hao bị ảnh hưởng bởi giá trị thu hồi ước tính\ncủa tài sản đang được khấu hao. Giá trị thanh lý cao hơn sẽ làm giảm chi phí khấu hao\ntheo hầu hết các phương pháp, so với việc chọn giá trị thanh lý thấp hơn.\nB. Không chính xác vì việc thay đổi phương pháp khấu hao từ đường thẳng sang số dư giảm dần kép\nlà một ví dụ về thay đổi chính sách kế toán thận trọng. Thay đổi này sẽ làm tăng\nchi phí khấu hao và giảm thu nhập trong năm. Việc lựa chọn phương pháp khấu hao\nảnh hưởng đến việc phân bổ chi phí của tài sản tồn tại lâu dài cho các kỳ kế toán và\nngười quản lý có thể chọn các phương pháp khác nhau dựa trên nhiều yếu tố khác nhau.\nC. Không chính xác vì việc thay đổi từ phương pháp định giá hàng tồn kho từ bình quân gia quyền sang phương pháp định giá hàng tồn kho FIFO trong khoảng thời gian\ngiá và số lượng hàng tồn kho giảm là một ví dụ về thay đổi chính sách kế toán\nthận trọng. Trong môi trường chi phí đơn vị hàng tồn kho giảm và số lượng hàng tồn kho\nkhông đổi hoặc ngày càng tăng, FIFO (so với chi phí bình quân gia quyền hoặc LIFO) sẽ phân bổ một\nsố tiền cao hơn trong tổng giá vốn hàng hóa sẵn có để bán vào giá vốn bán hàng trên báo cáo thu nhập\nvà số tiền thấp hơn cho hàng tồn kho cuối kỳ trên bảng cân đối kế toán. Thay đổi này dẫn đến\nchi phí bán hàng cao hơn và lợi nhuận được báo cáo thấp hơn. Giả định về dòng chi phí hàng tồn kho cung cấp\nmột ví dụ khác về cách các lựa chọn kế toán có thể ảnh hưởng đến báo cáo tài chính","qhtml":null},{"n":70,"q":"An analyst gathers she following information about a company's equipment base:\nBeginning balance accumulated depreciation €7.000.000\nEnding balance accumulated depreciation €3.000.000\nDepreciation expense of equipment €4.000.000\nThe company sold equipment having a historical cost of €5,000,000 and reported a loss on\nsale of €250,000. The cash received from the sale of equipment is","opts":["€750,000.","€1,750.000","€4,700.000."],"ans":"B","expl":"A. Không chính xác vì tiền nhận được từ việc bán thiết bị được tính như sau:\nGiá vốn trước đây của thiết bị đã bán (€5.000.000) - Khấu hao lũy kế của thiết bị\nđã bán (€3.000.000) = Giá trị sổ sách của thiết bị đã bán (€2.000.000) - Lỗ bán (€250.000) =\n€1.750.000.\nB. Đúng vì tiền nhận được từ việc bán thiết bị được xác định bằng cách trừ\ngiá trị sổ sách của thiết bị đã bán (được tính bằng giá gốc trừ đi khấu hao\ntích lũy) khỏi khoản lỗ bán hàng được báo cáo. Công thức là: Tiền mặt nhận được từ việc bán\nthiết bị = Giá trị sổ sách của thiết bị đã bán - Lỗ khi bán = €2.000.000 - €250.000 =\n€1.750.000.\nC. Không chính xác vì cách tính số tiền mặt nhận được từ việc bán thiết bị là giá trị lịch sử\ncủa thiết bị đã bán (€5.000.000) - Lỗ bán (250.000 €) bằng 4.750.000 €, không\nchính xác trong ngữ cảnh này.","qhtml":null},{"n":71,"q":"An analyst gathers the following information (in millions) about a company.\nEBIT 150\nEarnings before taxes 130\nNet income 110\nTotal average asset 1,000\nROA is","opts":["11%","13%","15%"],"ans":"A","expl":"A. Đúng vì ROA được tính bằng Thu nhập ròng chia cho Tổng tài sản trung bình, là\n(110 / 1.000) * 100 = 11%.\nB. Không chính xác vì nó giả định ROA được tính bằng Thu nhập trước thuế chia cho Tổng tài sản trung bình\n, là (130 / 1.000) * 100 = 13%.\nC. Không chính xác vì nó giả định ROA được tính bằng EBIT chia cho Tổng tài sản trung bình,\nlà (150 / 1.000) * 100 = 15%.","qhtml":null},{"n":72,"q":"In calculating basic and basic EPS, the numerators are the same but the denominators are\ndifferent, the company.","opts":["split its stock during the year","had stock options outstanding at year end.","had convertible debt outstanding at year end."],"ans":"B","expl":"A. Không chính xác vì nếu số lượng cổ phiếu phổ thông tăng lên do chia cổ tức hoặc chia cổ phiếu\n, thì phép tính EPS sẽ phản ánh thay đổi hồi tố về đầu\nkỳ. Mẫu số giống nhau cho cả phép tính EPS cơ bản và EPS pha loãng.\nB. Đúng vì việc thực hiện quyền chọn cổ phiếu giả định sẽ không làm thay đổi thu nhập ròng trong\nnăm (hoặc xác định trước cổ tức). Do đó, để tính EPS, không có thay đổi nào được thực hiện đối với tử số\n. Tuy nhiên, mẫu số sẽ tăng lên theo số lượng cổ phiếu\nđược phát hành do quyền chọn cổ phiếu được thực hiện.\nC. Không chính xác vì cả tử số và mẫu số đều thay đổi khi xử lý\nnợ chuyển đổi. Tử số được tăng lên bởi lãi suất sau thuế của khoản nợ chuyển đổi và\nmẫu số được tăng bởi số cổ phiếu bổ sung được phát hành khi chuyển đổi.","qhtml":null},{"n":73,"q":"An analyst gathers the following Information about a company's given fiscal year ended\n31 December.\nNet income $1,200,000\nNumber of common shares outstanding on 1 January 1,000,000\nNumber of common shares issued on 1 April 100.000\nNumber of common shares outstanding on 31 December 1,100 000\nFace value of convertible bonds outstanding for the year $2,000,000\nCoupon rate on convertible bonds outstanding 8%\nTax rate 30%\nthe bonds are convertible into 200,000 common shares and there are no other potentially\ndilutive securities outstanding, The company's reported diluted EPS is closest to","opts":["$1.01.","$1.03.","$1.07."],"ans":"B","expl":"A. Không chính xác vì nó chưa tính trọng số số lượng cổ phiếu đang lưu hành trong năm và\nthay vào đó sử dụng số dư cuối kỳ cùng với ảnh hưởng của việc chuyển đổi. Nghĩa là, số lượng cổ phiếu đang lưu hành bình quân\ncó trọng số bị tính nhầm là 1.100.000 cổ phiếu cộng với 200.000\nbằng 1.300.000. Giả sử tất cả các yếu tố khác đều bằng nhau, 1.312.000 USD / 1.300.000 = 1,01 USD\nB. Đúng vì tính toán EPS cơ bản không kết hợp trái phiếu chuyển đổi dưới dạng pha loãng\n. EPS cơ bản được tính như sau: EPS cơ bản = (Thu nhập ròng - Cổ tức ưu đãi) /\n(Số lượng cổ phiếu lưu hành bình quân gia quyền). Thu nhập ròng là 1.200.000 USD. Không có\ncổ tức ưu đãi. Số lượng cổ phiếu đang lưu hành bình quân gia quyền được tính như sau:\nSố lượng cổ phiếu đang lưu hành bình quân gia quyền = [(1.000.000 cổ phiếu * 3 tháng) + (1.100.000\ncổ phiếu * 9 tháng)] / 12 tháng = (3.000.000 + 9.900.000) / 12 tháng = 12.900.000 / 12 =\n1.075.000 cổ phiếu. Do đó, EPS cơ bản = 1.200.000 USD / 1.075.000 = 1,12 USD. EPS pha loãng, được tính\nbằng cách sử dụng trái phiếu chuyển đổi, được tính như sau: (Thu nhập ròng + Lãi sau thuế đối với\nnợ chuyển đổi - Cổ tức ưu đãi) / (Số lượng cổ phiếu bình quân gia quyền đang lưu hành -\nCổ phiếu phổ thông bổ sung lẽ ra sẽ được phát hành khi chuyển đổi). Lãi suất sau thuế đối với\nnợ chuyển đổi = $2.000.000 * 8% * (1 - 30%) = $112.000 Do đó, EPS bị pha loãng = ($1.200.000\n+ $112.000) / (1.075.000 + 200.000) = 1.312.000 USD / 1.275.000 ≈ 1,03 USD.\nC. Không chính xác vì nó bao gồm sai chi phí nợ trước thuế như một phần bổ sung cho thu nhập\nròng trong tử số. Tính toán được hiển thị dưới dạng ($1.200.000 + $160.000) / (1.075.000 +\n200.000) = $1.360.000 / 1.275.000 ≈ $1,07. Nếu một ứng viên sử dụng nhầm thu nhập ròng chỉ trong\ntử số với bất kỳ mẫu số nào trong ba Cơ sở phản hồi, thì câu trả lời\ncũng sẽ gần nhất với yếu tố phân tâm này.","qhtml":null},{"n":74,"q":"An analyst gathers the following information about a company.\nNet profit margin 3.0%\nTotal asset turnover 1.0\nFinancial leve age 1.5\nTax burden 0.85\nROE is closest to","opts":["5.4%","6.9%","8.1%"],"ans":"C","expl":"A. Không chính xác vì nó bỏ qua đòn bẩy tài chính trong tính toán ROE và thay vào đó sử dụng phép tính\nROA. Nó tính ROA (Lợi nhuận trên tài sản) là Tỷ suất lợi nhuận ròng × Tổng doanh thu tài sản\n= 3% × 1,8 = 5,4%.\nB. Không chính xác vì nó bao gồm gánh nặng thuế trong tính toán ROE chứ không phải đòn bẩy tài chính.\nCông thức trở thành ROC (Tỷ suất lợi nhuận trên vốn) = Biên lợi nhuận ròng × Tổng vòng quay tài sản ×\nĐòn bẩy tài chính × Gánh nặng thuế = 3,0% × 1,8 × 1,5 × 0,85 = 6,585% ≈ 6,9%.\nC. Đúng vì ROE (Lợi nhuận trên vốn chủ sở hữu) được tính theo công thức: Tỷ suất lợi nhuận ròng ×\nTổng vòng quay tài sản × Đòn bẩy tài chính = 3,0% × 1,8 × 1,5 = 8,1%.","qhtml":null},{"n":75,"q":"An analyst gathers the following Information (in € thousands) about equipment.\nCarrying amount prior to testing for impairment 10,000\nFair value 9,000\nPresent value of expected future cash flows 7,000\nCosts to sel l 200\nThe equipments carrying amount (in € thousands) after Impairment is","opts":["7,000.","8,800.","9,000."],"ans":"B","expl":"A. Không chính xác vì giá trị ghi sổ sau khi tính phí tổn thất bằng với\ngiá trị có thể thu hồi được. Theo IFRS 36, khoản lỗ do suy giảm giá trị được đo bằng phần vượt quá giữa giá trị ghi sổ\n so với giá trị có thể thu hồi của tài sản. Giá trị có thể thu hồi của một tài sản\nđược định nghĩa là giá trị cao hơn giữa giá trị hợp lý của nó trừ đi chi phí bán (€9.000 - €200 = €8.800) và giá trị của nó khi sử dụng\n(€7.000). Giá trị thấp hơn trong hai giá trị này là €7.000 chứ không phải €9.000.\nB. Đúng vì giá trị ghi sổ sau khi tính phí tổn thất bằng với số tiền\ncó thể thu hồi được. Theo IFRS 36, khoản lỗ do suy giảm giá trị được đo bằng phần chênh lệch giữa giá trị ghi sổ\nso với giá trị có thể thu hồi của tài sản. Giá trị có thể thu hồi của một tài sản được xác định là\ngiá trị cao hơn của giá trị hợp lý trừ đi chi phí bán (€9.000 - €200 = €8.800) và giá trị sử dụng của nó (€7.000). Trong\ntrường hợp này, số tiền có thể thu hồi là giá trị hợp lý trừ đi chi phí bán, là €8.800.\nC. Không chính xác vì nó cố gắng trừ chi phí bán hàng khỏi giá trị hợp lý, điều này không\ncần thiết. Giá trị có thể thu hồi của một tài sản là giá trị cao hơn giữa giá trị hợp lý trừ đi chi phí bán hoặc\ngiá trị sử dụng của nó và trong trường hợp này, giá trị hợp lý trừ chi phí bán là 8.800 Euro chứ không phải 9.000 Euro.","qhtml":null},{"n":76,"q":"Which of the following ratios is most appropriate in measuring a company's ability to\ncover its debt payment","opts":["Return on equity","Fixed asset turnover","Fixed charge coverage"],"ans":"C","expl":"A. Không chính xác vì đây là tỷ lệ lợi nhuận. ROE đo lường lợi nhuận mà một công ty kiếm được\ntrên vốn chủ sở hữu, bao gồm vốn chủ sở hữu thiểu số, vốn chủ sở hữu ưu đãi và vốn chủ sở hữu chung. ROE được\nđược tính bằng Thu nhập ròng chia cho Tổng vốn chủ sở hữu trung bình.\nB. Không chính xác vì đây là tỷ lệ hoạt động (hoặc tỷ lệ sử dụng tài sản, doanh thu hoặc hiệu quả hoạt động\n) đo lường mức độ công ty quản lý các hoạt động khác nhau. Vòng quay tài sản cố định\nđược tính bằng Doanh thu chia cho Tài sản cố định ròng trung bình. Tỷ lệ này đánh giá mức độ hiệu quả\ncông ty tạo ra doanh thu từ các khoản đầu tư vào tài sản cố định.\nC. Đúng vì tỷ lệ khả năng thanh toán chủ yếu có hai loại: tỷ lệ nợ, tập trung vào\nbảng cân đối kế toán và đo lường lượng vốn nợ so với vốn chủ sở hữu, và tỷ lệ bao phủ\n, tập trung vào báo cáo thu nhập và đo lường khả năng của một công ty trong việc trang trải các khoản thanh toán nợ\ncủa mình. Các tỷ lệ này được sử dụng để đánh giá khả năng thanh toán của công ty và đánh giá\nchất lượng trái phiếu và các nghĩa vụ nợ khác của công ty.\nTỷ lệ bao phủ phí cố định được tính bằng (EBIT + Thanh toán tiền thuê) chia cho (Tiền lãi\nthanh toán + Thanh toán tiền thuê). Tỷ lệ chi trả phí cố định cao hơn hàm ý khả năng thanh toán cao hơn,\nmang đến sự đảm bảo cao hơn rằng công ty có thể thanh toán các nghĩa vụ nợ của mình, chẳng hạn như các khoản vay ngân hàng,\ntrái phiếu và trái phiếu, từ thu nhập thông thường.","qhtml":null},{"n":77,"q":"Under which of the following classifications of leases will a lessor derecognize the leased\nasset and recognize a lease receivable on the balance sheet at lease inception","opts":["Only a finance lease under IFRS","Only an operating lease under US GAAP","Both a finance lease under IFRS and an operating lease under US GAAP"],"ans":"A","expl":"A. Đúng vì cách xử lý kế toán đối với bên cho thuê về cơ bản là giống nhau theo cả IFRS\nvà US GAAP. Trong cả hai chuẩn mực kế toán, bên cho thuê phân loại hợp đồng thuê là tài chính hoặc hợp đồng thuê hoạt động, xác định báo cáo tài chính của họ. Theo hợp đồng thuê tài chính, bên cho thuê ghi nhận một\ntiền thuê phải thu trên bảng cân đối kế toán, thể hiện giá trị hiện tại của các khoản thanh toán tiền thuê trong tương lai,\nvà hủy ghi nhận tài sản cho thuê. Bất kỳ sự khác biệt nào giữa giá trị hiện tại của khoản thanh toán tiền thuê\nvà giá trị còn lại của tài sản đều được ghi nhận là lãi hoặc lỗ.\nB. Không chính xác vì theo cả IFRS và US GAAP, bên cho thuê phân loại hợp đồng thuê là hợp đồng thuê tài chính hoặc\nhoạt động, mỗi hợp đồng có cách xử lý kế toán tương ứng. Trong trường hợp hợp đồng thuê\nhoạt động, bên cho thuê giữ lại tài sản cho thuê trên sổ sách của mình và ghi nhận doanh thu cho thuê theo\nđường thẳng trong thời hạn thuê.\nC. Không chính xác vì cách xử lý kế toán đối với bên cho thuê là tương tự nhau theo cả IFRS và US\nGAAP. Cả hai tiêu chuẩn đều phân loại hợp đồng thuê là hợp đồng thuê tài chính hoặc hợp đồng thuê hoạt động, ảnh hưởng đến báo cáo tài chính\ncủa bên cho thuê. Trong trường hợp thuê hoạt động, bên cho thuê giữ lại tài sản cho thuê trên sổ sách\nvà ghi nhận doanh thu cho thuê đồng đều trong suốt thời hạn thuê, khác với hợp đồng thuê tài chính\ntrong đó bên cho thuê ngừng ghi nhận tài sản và ghi nhận khoản phải thu cho thuê.","qhtml":null},{"n":78,"q":"Ignoring income taxes, which of the following ratios decreases as a result of an\nimpairment change","opts":["Net profit margin","Debt-to-equity ratio","Working capital turnover"],"ans":"A","expl":"A. Đúng vì số tiền lỗ do suy giảm giá trị sẽ làm giảm giá trị ghi sổ của tài sản\ntrên bảng cân đối kế toán và do đó sẽ làm giảm thu nhập ròng trên báo cáo kết quả hoạt động kinh doanh.\nPhí suy giảm giá trị làm giảm thu nhập nhưng không ảnh hưởng đến doanh thu. Do đó, sự suy giảm\nlàm giảm tỷ suất lợi nhuận ròng, trong đó tỷ suất lợi nhuận ròng = Thu nhập ròng / Doanh thu.\nB. Không chính xác vì tỷ lệ Nợ trên vốn chủ sở hữu là tổng nợ chia cho tổng vốn chủ sở hữu. Khoản lỗ do suy giảm\nlàm giảm giá trị ghi sổ của tài sản trên bảng cân đối kế toán, nhưng nó không\nảnh hưởng trực tiếp đến tổng nợ hoặc vốn chủ sở hữu, vốn không bị ảnh hưởng bởi phí tổn thất. Do đó,\nphí suy giảm không ảnh hưởng đến tỷ lệ Nợ trên vốn chủ sở hữu.\nC. Không chính xác vì tỷ lệ vòng quay vốn lưu động, được tính bằng Doanh thu chia\ncho Vốn lưu động trung bình, không bị ảnh hưởng bởi những thay đổi về suy giảm giá trị. Các khoản lỗ do suy giảm giá trị làm giảm\ngiá trị ghi sổ của tài sản trên bảng cân đối kế toán và sau đó làm giảm thu nhập ròng trên báo cáo thu nhập\n. Tuy nhiên, phí tổn thất là khoản mục không dùng tiền mặt và không ảnh hưởng đến\nvốn lưu động hoặc tỷ lệ doanh thu.","qhtml":null},{"n":79,"q":"An analyst gathers the following information about a company:\nShort-term interest bearing debt 700\nCurrent portion of long term interest bearing debt 500\nNon-current portion of long-term interest bearing debt: 800\nTotal shareholders' equity 7,500\nBased only on this information, the company's debt to capital ratio is closest to:","opts":["17%","21%","27%"],"ans":"B","expl":"A. Không chính xác vì nó loại trừ không chính xác Phần hiện tại của khoản nợ mang lãi dài hạn\nkhỏi Tổng nợ và tính tỷ lệ Nợ trên vốn là Tổng nợ / (Tổng nợ +\nTổng vốn chủ sở hữu của cổ đông), dẫn đến sai sót trong tính toán. Công thức đúng cho\ntỷ lệ nợ trên vốn là (Nợ chịu lãi ngắn hạn + Phần hiện tại của nợ chịu lãi dài hạn\n + Phần dài hạn của nợ chịu lãi dài hạn) / (Nợ chịu lãi ngắn hạn\n + Phần nợ chịu lãi dài hạn hiện tại + Phần dài hạn\nnợ chịu lãi dài hạn + Tổng vốn chủ sở hữu). Sử dụng công thức\nđúng, phép tính sẽ là (700 + 500 + 800) / (700 + 500 + 800 + 7.500) = 2.000 / 9.500\n= 0,211 hoặc 21%.\nB. Đúng vì tỷ lệ Nợ trên vốn được tính chính xác bằng (Nợ chịu lãi ngắn hạn-\n + Phần hiện tại của nợ chịu lãi dài hạn + Phần dài hạn của\nnợ chịu lãi dài hạn) chia cho (Nợ chịu lãi ngắn hạn + Phần hiện tại\ncủa nợ chịu lãi dài hạn + Phần dài hạn của nợ chịu lãi dài hạn +\nTổng vốn chủ sở hữu của cổ đông), dẫn đến (700 + 500 + 800) / (700 + 500 + 800 + 7.500) =\n2.000 / 9.500 = 0,211 hoặc 21%.\nC. Không chính xác vì nó tính nhầm tỷ lệ Nợ trên vốn chủ sở hữu [(Nợ chịu lãi ngắn hạn-\n + Phần nợ chịu lãi dài hạn hiện tại + Phần dài hạn của\nnợ chịu lãi dài hạn) / Tổng vốn chủ sở hữu của cổ đông], dẫn đến\nTỷ lệ nợ trên vốn không chính xác.","qhtml":null},{"n":80,"q":"According to the converged standards for revenue recognon, which of the following might\nindicate that a seller has transferred control of an asset to a buyer at a point in time? The\nseller has","opts":["legal title of the asset","a present right to payment for the asset","significant risks and rewards of ownership related to the asset"],"ans":"B","expl":"A. Không chính xác vì thực thể sẽ ghi nhận doanh thu khi có thể đáp ứng nghĩa vụ thực hiện\nbằng cách chuyển giao quyền kiểm soát cho khách hàng. Các yếu tố cần xem xét khi đánh giá liệu khách hàng\ncó giành được quyền kiểm soát tài sản tại một thời điểm hay không liên quan đến việc liệu khách hàng (không phải\nthực thể/người bán) có quyền sở hữu hợp pháp hay không.\nB. Đúng vì thực thể (người bán) sẽ ghi nhận doanh thu khi có thể đáp ứng\nnghĩa vụ thực hiện bằng cách chuyển giao quyền kiểm soát cho khách hàng. Các yếu tố cần xem xét khi\nđánh giá liệu khách hàng có giành được quyền kiểm soát tài sản tại một thời điểm hay không bao gồm\nliệu thực thể có quyền thanh toán hiện tại hay không.\nC. Không chính xác vì thực thể (người bán) sẽ ghi nhận doanh thu khi có thể đáp ứng\nnghĩa vụ thực hiện bằng cách chuyển giao quyền kiểm soát cho khách hàng. Các yếu tố cần xem xét khi\nđánh giá liệu khách hàng có giành được quyền kiểm soát tài sản tại một thời điểm hay không liên quan đến\nliệu khách hàng (không phải tổ chức/người bán) có chịu rủi ro và lợi ích đáng kể từ quyền sở hữu hay không.","qhtml":null},{"n":81,"q":"A company incurred research costs which were all expened in the current fiscal year for\nfinancial reporting purposes. Applicable tax laws require research costs to be expensed over a\n5 year period if taxable profit will be available against which the deductible temporary\ndifferences can be utilized, in the current fiscal year the company will most likely record","opts":["a deferred tax asset.","a deferred tax liability","neither a deferred tax asset nor a deferred tax liability."],"ans":"A","expl":"A. Đúng vì giá trị ghi sổ bằng 0 do toàn bộ số tiền đã được tính vào chi phí\ncho mục đích kế toán tài chính, trong khi cơ sở tính thuế của tài sản chỉ giảm 1/5\ntổng chi phí trong năm đầu tiên. Ngoài ra, sẽ có lợi nhuận chịu thuế để sử dụng\ncác chênh lệch tạm thời được khấu trừ. Vì giá trị ghi sổ của tài sản nhỏ hơn\ncơ sở tính thuế nên sẽ tạo ra tài sản thuế thu nhập hoãn lại.\nB. Không chính xác vì nợ thuế thu nhập hoãn lại phải trả khi giá trị ghi sổ của tài sản lớn hơn\nso với cơ sở tính thuế.\nC. Không chính xác vì giá trị ghi sổ của tài sản nhỏ hơn cơ sở tính thuế, do đó sẽ dẫn đến\ntài sản thuế thu nhập hoãn lại.","qhtml":null},{"n":82,"q":"All else being equal, the cash conversion cycle most likely shortens if","opts":["payables turnover decreases","Inventory turnover decreases.","days of sales outstanding increases."],"ans":"A","expl":"A. Đúng vì chu kỳ chuyển đổi Tiền mặt = Số ngày tồn kho + Số ngày bán hàng\nnợ - Số ngày phải trả. Nếu vòng quay các khoản phải trả giảm, điều đó sẽ\ntăng Số ngày phải trả, do đó làm tăng CCC.\nB. Không chính xác vì chu kỳ chuyển đổi Tiền mặt = Số ngày tồn kho + Số ngày bán hàng\nchưa thanh toán - Số ngày phải trả. Vòng quay hàng tồn kho giảm sẽ làm tăng\nSố ngày tồn kho, do đó làm tăng chu kỳ chuyển đổi tiền mặt.\nC. Không chính xác vì chu kỳ chuyển đổi Tiền mặt = Số ngày tồn kho + Số ngày bán hàng\nchưa thanh toán - Số ngày phải trả. Việc tăng Số ngày bán hàng chưa thanh toán sẽ\ntăng chứ không giảm chu kỳ chuyển đổi tiền mặt.","qhtml":null},{"n":83,"q":"On the statement of cash flows, interest payments may be classified as a financing cash\nflow under","opts":["IFRS only","US GAAP only.","both IFRS and US GAAP"],"ans":"A","expl":"A. Đúng vì tiền trả lãi vay được đưa vào dòng tiền hoạt động theo US GAAP\nvà có thể được đưa vào dòng tiền hoạt động hoặc tài trợ theo IFRS. GAAP của Hoa Kỳ phân loại chi phí lãi vay\nlà một hoạt động điều hành, mặc dù số tiền gốc của khoản nợ phát hành được\nđược phân loại là hoạt động tài chính. IFRS cho phép các công ty phân loại chi phí lãi vay là\nhoạt động điều hành hoặc hoạt động tài chính.\nB. Không chính xác vì tiền trả lãi được bao gồm trong dòng tiền hoạt động theo US\nGAAP.\nC. Không chính xác vì tiền trả lãi vay được đưa vào dòng tiền hoạt động theo US\nGAAP và có thể được đưa vào dòng tiền hoạt động hoặc tài trợ theo IFRS.","qhtml":null},{"n":84,"q":"An analyst gathers The following information (in € thousands) about a company whose\nfiscal year ends on 31 December\nEarnings for the six months ended 30 June of Year 1 2,000\nEarnings for the year ended 31 December of Year 1 1,500\nEarnings for the six months ended 30 June of Year 2 2.200\nThe company's trailing 12 months (in € thousands) for the period ended 30 one of Year 2 is","opts":["1,700","3,700","4,200."],"ans":"A","expl":"A. Đúng vì thu nhập 12 tháng trước của công ty trong kỳ kết thúc vào ngày 30 tháng 6 của\nNăm 2 được tính bằng (Thu nhập tính đến ngày 31 tháng 12 của Năm 1 - Thu nhập tính đến ngày 30 tháng 6 của Năm 1)\n+ Thu nhập tính đến ngày 30 tháng 6 của Năm 2. Đó là (1.500 - 2.000) + 2.200 = 3.700.\nB. Không chính xác vì lời giải thích được cung cấp có vẻ không chính xác. Tính toán chính xác cho\nthu nhập trong 12 tháng qua không chỉ là tổng Thu nhập tính đến ngày 31 tháng 12 của Năm 1 và\nThu nhập tính đến ngày 30 tháng 6 của Năm 2. Công thức đúng phải xem xét thu nhập trong 12 tháng qua\ndẫn đến ngày 30 tháng 6 của Năm 2.\nC. Không chính xác vì phương pháp tính toán được cung cấp không chính xác. Thu nhập 12 tháng trước\ncần xem xét thu nhập tích lũy trong 12 tháng tính đến cuối tháng 6\ncủa Năm 2, chứ không chỉ thu nhập ở các khoảng thời gian khác nhau.","qhtml":null},{"n":85,"q":"An analyst gathers the following information about three companies (In € millions)\nCompany 1 Company 2 Company 3\nTotal assets 100 200 400\nTotal debt 20 50 60\nTotal equity 80 150 320\nEarnings before interest and taxes (EBIT) 8 10 12\nInterest payments 4 4 4\nBased on this information, which company is most solvent?","opts":["Company 1","Company 2","Company 3"],"ans":"C","expl":"A. Không chính xác vì mặc dù Công ty 1 có tỷ lệ đòn bẩy thấp nhất trong số ba công ty, nhưng\ncó tỷ lệ thanh toán lãi suất thấp hơn so với Công ty 3, cho thấy đây có thể không phải là\ndung môi tốt nhất.\nB. Không chính xác vì Công ty 2 có tỷ lệ đòn bẩy cao hơn cả Công ty 1 và Công ty\n3 và tỷ lệ thanh toán lãi suất thấp hơn Công ty 3, cho thấy công ty này có thể không phải là công ty có khả năng thanh toán cao nhất.\nC. Đúng vì khả năng thanh toán đề cập đến khả năng đáp ứng các nghĩa vụ nợ dài hạn. Nó có thể được\nđánh giá bằng cách sử dụng tỷ lệ đòn bẩy và tỷ lệ bảo hiểm. Thông thường, tỷ lệ đòn bẩy cao hơn cho thấy rủi ro tài chính\ncao hơn và khả năng thanh toán yếu hơn. Ngoài ra, tỷ lệ bao phủ lãi suất cao hơn cho thấy khả năng thanh toán\nmạnh mẽ hơn. So sánh thông tin được cung cấp:\nCông ty 1 Công ty 2 Công ty 3\nTỷ lệ nợ trên tài sản 0,20 0,25 0,15\nTỷ lệ nợ trên vốn chủ sở hữu 0,25 0,33 0,23\nNợ trên vốn 0,20 0,25 0,20\nTỷ lệ đòn bẩy tài chính 1,25 1,33 1,25\nTỷ lệ khả năng thanh toán lãi vay 2,00 2,50 3,02\nTrong số ba công ty, Công ty 3 có tỷ lệ nợ thấp nhất\n(so sánh tỷ lệ nợ) và tỷ lệ thanh toán lãi suất cao nhất, cho thấy đây có thể là\ndung môi tốt nhất trong số các tùy chọn được cung cấp. Do đó, câu trả lời đúng là C, Công ty\n3.","qhtml":null},{"n":86,"q":"The carrying amount of an asset being higher than its tax base may be considered a","opts":["temporary difference resulting in a deferred tax asset","permanent difference resulting in a deferred tax asset.","temporary difference resulting in a deferred tax ability"],"ans":"C","expl":"A. Không chính xác vì giá trị ghi sổ của một tài sản cao hơn cơ sở tính thuế của nó\nđược coi là chênh lệch tạm thời dẫn đến nghĩa vụ thuế thu nhập hoãn lại.\nB. Không chính xác vì giá trị ghi sổ của một tài sản cao hơn cơ sở tính thuế của nó\nđược coi là chênh lệch tạm thời dẫn đến nghĩa vụ thuế thu nhập hoãn lại.\nC. Đúng vì giá trị ghi sổ của một tài sản cao hơn cơ sở tính thuế của nó được coi\nlà chênh lệch tạm thời dẫn đến thuế thu nhập hoãn lại phải trả. Thuế thu nhập hoãn lại phải trả phát sinh\nkhi giá trị ghi sổ của một tài sản vượt quá cơ sở tính thuế của nó, dẫn đến số tiền phải chịu thuế trong các kỳ\ntương lai khi chênh lệch tạm thời được hoàn nhập. Những khác biệt này ảnh hưởng đến lợi nhuận kế toán và\nthu nhập chịu thuế, dẫn đến thuế thu nhập hoãn lại phải trả được ghi nhận trên bảng cân đối kế toán.","qhtml":null},{"n":87,"q":"A debt-to-equity of 1.0 most likely results in a debt-to-capital ratio of.","opts":["0.5","1.0","2.0"],"ans":"A","expl":"A. Đúng vì tỷ lệ nợ trên vốn chủ sở hữu đo lường tỷ lệ nợ được sử dụng để tài trợ cho tài sản của công ty so với vốn chủ sở hữu. Tỷ lệ nợ trên vốn chủ sở hữu là 1,0 cho thấy số lượng nợ và vốn chủ sở hữu\nbằng nhau. Tỷ lệ nợ trên vốn tính toán tỷ lệ tài trợ bằng nợ\ntrong tổng vốn của công ty. Nếu tỷ lệ nợ trên vốn chủ sở hữu là 1, thì tỷ lệ nợ trên vốn sẽ là 0,5.\nTỷ lệ nợ trên vốn chủ sở hữu = Tổng nợ / Tổng vốn chủ sở hữu của cổ đông = 1,0 Tỷ lệ nợ trên vốn = Tổng\nnợ / (Tổng nợ + Tổng vốn chủ sở hữu của cổ đông) = 1,0 / (1,0 + 1,0) = 1,0 / 2,0 = 0,5\nB. Không chính xác vì nó đánh đồng tỷ lệ nợ trên vốn chủ sở hữu với tỷ lệ nợ trên vốn không chính xác,\ncho biết cả hai đều bằng 1,0.\nC. Không chính xác vì nó khẳng định rằng tỷ lệ nợ trên vốn gấp đôi tỷ lệ nợ trên vốn chủ sở hữu.\nĐiều này không chính xác vì tỷ lệ nợ trên vốn không nhất thiết phải gấp đôi tỷ lệ nợ trên vốn chủ sở hữu.","qhtml":null},{"n":88,"q":"Which of the following financial statement disclosures concerning PP&E is required under\nUS GAAP?","opts":["The balances of major classes of depreciable assets","The date of revaluation under the revaluation model","A reconciliation of carrying amount at the beginning and end of the period"],"ans":"A","expl":"A. Đúng vì các yêu cầu công bố theo GAAP của Hoa Kỳ liên quan đến Tài sản, Nhà máy và\nThiết bị (PP&E) bắt buộc phải công bố các loại tài sản chính có thể khấu hao. Các công ty\ncó nghĩa vụ tiết lộ số dư của các loại tài sản có thể khấu hao đáng kể, khấu hao lũy kế\ntheo các loại tài sản chính và mô tả chung về các phương pháp khấu hao được sử dụng\nđể tính toán chi phí khấu hao liên quan đến các loại tài sản có thể khấu hao chính đó.\nB. Không chính xác vì mô hình đánh giá lại không được phép theo US GAAP để báo cáo nội dung tồn tại lâu dài\n. Mô hình này được phép theo IFRS nhưng không được phép theo GAAP của Hoa Kỳ.\nC. Không chính xác vì mặc dù IFRS yêu cầu đối chiếu giá trị ghi sổ vào đầu và cuối kỳ\nđối với từng loại PP&E, theo US GAAP, nhưng các yêu cầu về công bố\nít toàn diện hơn. US GAAP yêu cầu tiết lộ chi phí khấu hao trong kỳ\n, số dư của các loại tài sản có thể khấu hao chính, khấu hao lũy kế theo các loại tài sản chính\nvà mô tả chung về các phương pháp khấu hao được sử dụng để tính toán\nchi phí khấu hao liên quan đến các loại tài sản có thể khấu hao chính đó. Do đó,\nviệc đối chiếu giá trị ghi sổ ở đầu và cuối kỳ không được yêu cầu cụ thể\ntheo GAAP của Hoa Kỳ đối với các thông tin công bố về PP&E.","qhtml":null},{"n":89,"q":"All else being equal, a company with older assets has a fixed asset turnover ratio that is","opts":["lower compared to a company with new assets","the same compared to a company with newer assets","higher compared to a company with newer assets"],"ans":"C","expl":"A. Không chính xác vì tỷ lệ vòng quay tài sản cố định sẽ cao hơn đối với một công ty có tài sản\nmới hơn (ít bị khấu hao hơn và do đó được phản ánh trong báo cáo tài chính ở mức\ngiá trị ghi sổ cao hơn) so với một công ty có tài sản cũ hơn (được khấu hao nhiều hơn và do đó\nphản ánh ở giá trị ghi sổ thấp hơn).\nB. Không chính xác vì tỷ lệ vòng quay tài sản cố định sẽ cao hơn đối với một công ty có tài sản\nmới hơn (ít bị khấu hao hơn và do đó được phản ánh trong báo cáo tài chính ở mức\ngiá trị ghi sổ cao hơn) so với một công ty có tài sản cũ hơn (được khấu hao nhiều hơn và do đó\nphản ánh ở giá trị ghi sổ thấp hơn).\nC. Đúng vì tỷ lệ vòng quay tài sản cố định sẽ cao hơn đối với một công ty có tài sản\nmới hơn (ít bị khấu hao hơn và do đó được phản ánh trong báo cáo tài chính ở mức\ngiá trị ghi sổ cao hơn) so với một công ty có tài sản cũ hơn (được khấu hao nhiều hơn và do đó\nđược phản ánh ở giá trị ghi sổ thấp hơn).","qhtml":null},{"n":90,"q":"An analyst gathers the following Information (in thousands) about a manufacturing\ncompens\nYear 2 Year 1\nAverage total assets 500 450\nAverage total liabilities 400 330\nAverage total shareholders’ equity 100 120\nEBIT 35 40\nInterest payments 6 8\nBased only on this information, which of the following ratios(s) may indicate improved\nsolvency from Year 1 to Year 2?","opts":["Interest coverage ratio only","Financial leverage ratio only","Both interest coverage ratio and financial leverage ratio"],"ans":"A","expl":"A. Đúng vì tỷ lệ thanh toán lãi vay đo lường số lần EBIT\ncủa một công ty có thể trang trải các khoản thanh toán lãi vay của công ty đó. Tỷ lệ thanh toán lãi suất cao hơn cho thấy khả năng thanh toán mạnh hơn,\nmang lại sự đảm bảo cao hơn rằng công ty có thể trả nợ từ thu nhập hoạt động.\nTheo đó, Tỷ lệ thanh toán lãi suất cho Năm 1 là 40/8 = 5 và cho Năm 2 là 35/6 = 5,83,\ncho thấy tỷ lệ thanh toán lãi suất tăng từ Năm 1 đến Năm 2, cho thấy\nkhả năng thanh toán được cải thiện.\nB. Không chính xác vì tỷ lệ đòn bẩy tài chính, đo lường tỷ lệ tổng tài sản\nđược tài trợ bằng vốn chủ sở hữu, đã tăng từ Năm 1 (Tỷ lệ đòn bẩy tài chính: 450/120 = 3,75) đến Năm\n2 (Tỷ lệ đòn bẩy tài chính: 500/100 = 5), ngụ ý đòn bẩy cao hơn và khả năng thanh toán yếu hơn.\nC. Không chính xác vì mặc dù tỷ lệ thanh toán lãi vay đã được cải thiện (cho thấy khả năng thanh toán tốt hơn),\ntỷ lệ đòn bẩy tài chính đã tăng lên, báo hiệu đòn bẩy cao hơn và khả năng thanh toán yếu hơn.\nDo đó, cả hai tỷ lệ đều không cho thấy khả năng thanh toán được cải thiện từ Năm 1 đến Năm 2.","qhtml":null},{"n":91,"q":"If a company sell PP&E with a carrying amount of €75,000 and reported a gain of €2,000\ncash flow from investing activities","opts":["€0","€73,000","€77.000"],"ans":"C","expl":"A. Không chính xác vì nó giả định rằng tiền thu được từ việc bán PP&E chuyển sang dòng tiền emmer\ntừ hoạt động kinh doanh hoặc tiền mà người tài trợ chứ không phải dòng tiền từ đầu tư.\nB. Không chính xác vì nó trừ đi lợi nhuận từ giá trị ghi sổ không chính xác để tính toán\ntiền bán hàng. Số tiền thu được từ việc bán hàng này = số tiền thu được khi bán = 75-2 = 73.\nC. Đúng vì lãi hoặc lỗ từ việc bán tài sản tồn tại lâu dài được tính bằng doanh thu\ndoanh thu trừ đi giá trị còn lại của tài sản tại thời điểm bán. Giá trị ghi sổ của tài sản\nthường là giá trị sổ sách ròng e Chi phí lịch sử trừ đi khấu hao lũy kế), trừ khi\ngiá trị ghi sổ của tài sản đã được thay đổi để phản ánh việc đánh giá lại imparentador, như trước đây\nđã thảo luận Bỏ qua thuế, số tiền mặt thấp từ việc bán sẽ xuất hiện dưới dạng dòng tiền từ\nđầu tư. semount. Sắp xếp lại,\ntiền thu được từ việc bán tài sản tồn tại lâu dài + giá trị ghi sổ -2+75-77.","qhtml":null},{"n":92,"q":"A company acquires a 5-year t license for product it plans to continue selling for the\nforeseeable future. The license can be renewed at minimal cost. The license should be.","opts":["carried on the balance sheet at historical cost.","amortised using the straight-line method over its estimated useful life","amortised using the units of production method over its estimated useful life"],"ans":"A","expl":"A. Đúng vì giấy phép có thời hạn vô thời hạn và không được khấu hao. Chỉ những tài sản vô hình\nđược cho là có thời gian sử dụng hữu ích mới được khấu hao theo thời gian sử dụng, theo pallen\ntrong đó các lợi ích được sử dụng hết. Ví dụ về Tài sản vô hình có thời gian sử dụng hữu ích vô thời hạn\nbao gồm giấy phép đã mua, mặc dù có ngày hết hạn cụ thể, có thể được gia hạn với\nít hoặc miễn phí và nhãn hiệu đã mua, mặc dù có thời hạn sử dụng cụ thể nhưng có thể được gia hạn\nvới chi phí tối thiểu và liên quan đến sản phẩm mà công ty dự định tiếp tục bán với giá\nthời hạn có thể dự đoán trước Cuộc sống vô thời hạn không được khấu hao. Thay vào đó, chúng\nđược ghi trên bảng cân đối kế toán theo giá gốc nhưng được kiểm tra ít nhất hàng năm về tình trạng suy giảm.\nB. Không chính xác vì giấy phép có indelene và do đó không được cắt giảm. Tài sản vô hình\nsẽ loại bỏ các sinh mạng không được khấu hao thay vào đó chúng là những ngụy trang trong lần cân bằng số dư tại diễn biến lịch sử\nđược kiểm tra ít nhất hàng năm về tình trạng suy giảm.\nC. Không chính xác vì giấy phép có dòng không xác định và do đó không được khấu hao. Tài sản\nvô hình sẽ không được khấu hao. Thay vào đó, chúng được đưa vào bảng cân đối kế toán với\ngiá gốc nhưng được kiểm tra ít nhất hàng năm về khả năng suy giảm giá trị.","qhtml":null},{"n":93,"q":"An analyst gathers the following information (in € thousands) about a company's sale of\nequipment.\nSelling price 58\nHistorical cost 50\nAccumulated depreciation 5\nThe gain on the sale (in € thousands) is","opts":["3.","8.","13."],"ans":"C","expl":"A. Không chính xác vì nó tính toán giá trị còn lại của chi phí lịch sử thiết bị+\nkhấu hao tích lũy -50+5-55. Do đó, lợi nhuận từ việc thiết lập giá mang\namount-55-55-3\nB. Không chính xác vì tôi tính toán viên đá quý trên cài đặt bán giá-cust-56-50-0.\nC. Đúng vì lãi hoặc lỗ từ việc bán tài sản tồn tại lâu dài được tính bằng doanh thu\ndoanh số trừ đi giá trị còn lại của tài sản tại thời điểm bán. Giá trị ghi sổ của một tài sản\nthường là giá trị sổ sách ròng (Le.. nguyên giá trừ đi khấu hao lũy kế).\ngiá trị còn lại của thiết bị - khấu hao lũy kế theo chi phí lịch sử-50-5-65 và\nlãi từ số tiền bán prion-canying-58-45-13","qhtml":null},{"n":94,"q":"An analyst gathers the following information (in € thousands) about a manufacturing\ncompany's inventory.\nCost of ending Inventory 750\nEstimated selling price in the ordinary course of business: 1,100\nEstimated costs necessary to sell the inventory 50\nEstimated costs to get the inventory in condition for sale 50\nThe net realizable value of the inventory (in € thousands) is","opts":["750","850","1,000."],"ans":"C","expl":"A. toneret nec đó là giá trị còn lại của hàng tồn kho, là giá trị rezate ròng của Mingos)\nMin(750 1100-50-501-0 (cũng bằng giá vốn hàng tồn kho) RS trạng thái tập trung\ndoanh thu được đo lường (và được ghi trên bảng cân đối kế toán) ở mức thấp hơn giữa giá gốc và giá trị có thể thực hiện được\ngiá trị. Trong khi giá trị cần thực hiện là giá bán ước tính trong điều kiện bình thường\nkinh doanh trừ đi chi phí ước tính cần thiết để thực hiện việc bán hàng và những chi phí ước tính để có được hàng\nhàng tồn kho trong tình trạng để bán\nB. Không chính xác vì nếu tính Giá trị thuần có thể thực hiện được-Giá vốn hàng tồn kho + Ccals ước tính\ncần thiết để bán hàng. Chi phí ước tính để có được hàng tồn kho ở trạng thái sẵn sàng để bán; hoặc 760-60-\n50-650.\nC. Đúng vì giá trị thuần có thể thực hiện được là giá bán ước tính trong điều kiện bình thường\nkinh doanh trừ đi các chi phí ước tính cần thiết để thực hiện san và chi phí ước tính để có được\nĐiều kiện tồn kho để tiết kiệm Theo đó, giá trị thuần có thể thực hiện được 1.100-50-50-1200","qhtml":null},{"n":95,"q":"Which of the following is most likely a measure of a company's ability to meet its short-\nterm obligations?","opts":["Quick ratio","Operating profit margin","Days of payables outstanding"],"ans":"A","expl":"A. Đúng vì tỷ lệ thanh toán nhanh là tỷ lệ thanh khoản đo lường khả năng đáp ứng\nngắn hạn của công ty nghĩa vụ.\nB. Không chính xác vì tỷ suất lợi nhuận hoạt động là tỷ lệ sinh lời đo lường khả năng tạo ra lợi nhuận từ các nguồn lực (tài sản) của công ty.\nC. Không chính xác vì số ngày phải trả là tỷ lệ hoạt động đo lường mức độ hiệu quả của một công ty thực hiện các công việc hàng ngày, chẳng hạn như thu các khoản phải thu và\nquản lý khoảng không quảng cáo","qhtml":null},{"n":96,"q":"An analyst gathers the following information (in thousands) about a company's current\nassets and liabilities:\nCash and equivalents 800\nShort-term marketable securities 500\nInventory 700\nAccounts receivable 2.000\nCurrent liabilities 10.000\nThe company's quick ratio is","opts":["0.13.","0.33.","0.40."],"ans":"B","expl":"A. Không chính xác vì đó là Tỷ lệ tiền mặt (Tiền mặt và các khoản tương đương + Ngắn hạn\ntiền có thể bán được)/Xương Cumen. Phép tính là (000+ 5000/10.000-1.300/10.000 -0,13 hoặc\n13%\nB. Đúng vì Hệ số thanh toán nhanh (Tiền mặt và các khoản tương đương Chứng khoán thị trường ngắn hạn\nCác khoản phải thu)/ Nợ ngắn hạn. Phép tính là (800+500 2.000)/10.000 = 3.300/10.000 = 0\n33, hoặc 33%.\nC. Không chính xác vì đây là Tỷ lệ hiện tại-Tài sản hiện tại/Nợ ngắn hạn,\nphép tính là (800 + 500+ 700 + 2000) 10,000-01, nr 40%","qhtml":null},{"n":97,"q":"An analyst gathers the following Information (in millions) about a company!\nTotal assets 400\nTotal liabilities 200\nTotal debt 100\nTotal equity 200\nThe total debt ratio is:","opts":["0.25","0.50.","2.00."],"ans":"A","expl":"A. Đúng vì tỷ lệ tổng nợ = tổng nợ/tổng ​​tài sản = 100/400 = 0,25.\nB. Không chính xác vì tính tỷ lệ nợ trên vốn chủ sở hữu = tổng nợ/tổng vốn chủ sở hữu = 100/200\n= 0,50. Tỷ lệ này cũng có thể được tính toán không chính xác bằng cách chia tổng nợ phải trả cho tổng tài sản.\n(200/400 = 0,50).\nC. Không chính xác vì tính tỷ lệ đòn bẩy tài chính = tổng tài sản/tổng vốn chủ sở hữu = 400/\n200 = 2,00.","qhtml":null},{"n":98,"q":"For a mature company. The primary source of cash flows is most likely from","opts":["operating activities","investing activities","financing activities"],"ans":"A","expl":"A. Đúng vì các nguồn tiền mặt chính của một công ty có thể thay đổi theo giai đoạn tăng trưởng của nó.\nĐối với một công ty trưởng thành, người ta kỳ vọng và mong muốn rằng các hoạt động kinh doanh là nguồn\nchính của dòng tiền. Về lâu dài, một công ty phải tạo ra tiền từ các hoạt động\nhoạt động của mình. Nếu dòng tiền hoạt động liên tục âm, một công ty sẽ cần vay tiền\nhoặc phát hành cổ phiếu (hoạt động tài chính) để tài trợ cho khoản thiếu hụt. Cuối cùng, những nhà cung cấp\nvốn này cần phải được hoàn trả từ hoạt động hoạt động, nếu không họ sẽ không sẵn sàng cung cấp vốn nữa.\nB. Không chính xác vì đối với một công ty trưởng thành, các hoạt động điều hành\nđược kỳ vọng và mong muốn là nguồn tạo ra dòng tiền chính. Tiền mặt tạo ra từ hoạt động kinh doanh có thể được sử dụng trong\ncác cơ hội đầu tư hoặc tài trợ khác hoặc các dự án kinh doanh khác nếu công ty có\ncơ hội đầu tư tốt.\nC. Không chính xác vì đối với một công ty trưởng thành, các hoạt động điều hành\nđược kỳ vọng và mong muốn là nguồn tạo ra dòng tiền chính. Tiền mặt được tạo ra từ hoạt động kinh doanh có thể được sử dụng trong\nhoạt động đầu tư hoặc tài trợ nếu công ty không có cơ hội đầu tư sinh lời\n. Ngoài ra, tiền mặt sẽ được trả lại cho các cổ đông hoặc người cung cấp nợ như\nmột phần của hoạt động tài chính.","qhtml":null},{"n":99,"q":"A company entered into a 5 year construction contract with a total sales price of\n€3.000.000. The estimated total costs are €2,000,000 and the company incurred €500,000\nactual costs in the first year. The company has extensive experience with similar types of\ncontracts. Costs incurred provide an appropriate measure of progress toward completing the\ncontract. Assuming it is highly probable that revenue will not be subsequently reversed,\nrevenue recognized under the contract in Year 1 is most likely","opts":["€500,000.","€600,000.","€750,000"],"ans":"C","expl":"A. Không chính xác vì nó chỉ giả định chi phí thực tế phát sinh được ghi nhận là doanh thu -\n€0,5 triệu. Tiêu chuẩn nêu rõ rằng đối với các nghĩa vụ thực hiện được đáp ứng theo thời gian (ví dụ:\nkhi có hợp đồng dài hạn), doanh thu được ghi nhận theo thời gian bằng cách đo lường tiến độ\nhướng tới việc đáp ứng nghĩa vụ.\nB. Không chính xác vì nó giả định rằng doanh thu chỉ được ghi nhận theo cùng khoảng thời gian\nđã trôi qua. Tuy nhiên, tiêu chuẩn đề cập đến các nghĩa vụ thực hiện được đáp ứng theo thời gian và yêu cầu\ntiến trình hướng tới việc hoàn thành nghĩa vụ thực hiện được đo lường dựa trên\ndựa trên phương thức nhập liệu, chẳng hạn như phương thức minh họa ở đây (ghi nhận doanh thu dựa trên\ntỷ lệ tổng chi phí phát sinh trong kỳ) hoặc phương thức đầu ra\n(ghi nhận doanh thu dựa trên số đơn vị sản xuất hoặc các mốc đạt được). Theo đó, phép tính\ntrở thành €500.000 (chi phí phát sinh trong Năm 1) / €2.000.000 (tổng chi phí ước tính) *\n€3.000.000 (tổng giá trị hợp đồng) = €750.000.\nC. Đúng vì tiêu chuẩn nêu rõ rằng đối với các nghĩa vụ thực hiện được đáp ứng theo thời gian (ví dụ:\nkhi có hợp đồng dài hạn), doanh thu được ghi nhận theo thời gian bằng cách đo lường tiến độ\nhướng tới việc đáp ứng nghĩa vụ. Tiêu chuẩn đề cập đến các nghĩa vụ thực hiện được đáp ứng theo thời gian\n và yêu cầu rằng tiến độ hướng tới việc hoàn thành nghĩa vụ thực hiện phải được\nđo lường dựa trên phương thức nhập liệu, chẳng hạn như phương pháp được minh họa ở đây (ghi nhận doanh thu\ndựa trên tỷ lệ tổng chi phí phát sinh trong kỳ) hoặc phương pháp đầu ra\n(ghi nhận doanh thu dựa trên số đơn vị sản xuất hoặc các mốc đạt được). Theo đó, công ty\nđã phát sinh 25% tổng chi phí dự kiến ​​(€500.000 / €2.000.000) và do đó\nghi nhận 25% của €3.000.000 (€750.000) là doanh thu trong Năm 1.","qhtml":null},{"n":100,"q":"Which of the following could motivate a lessee to lease a high-value, long-lived asset\nrather than to purchase Lease contracts","opts":["usually require little, if any, down payment","are reported as off-balance sheet financing structures","do not require the recognition of a liability on the balance sheet."],"ans":"A","expl":"A. Đúng vì thuê tài sản có một số lợi ích so với mua.\nHợp đồng thuê thường yêu cầu ít hoặc không cần trả trước một khoản trả trước.\nB. Không chính xác vì theo IFRS, có một mô hình kế toán duy nhất cho cả hợp đồng thuê tài chính và\nhoạt động. Khi bắt đầu thuê, bên thuê ghi lại khoản nợ thuê và tài sản có quyền sử dụng (ROU)\n trên bảng cân đối kế toán của mình, cả hai đều bằng giá trị hiện tại của các khoản thanh toán tiền thuê trong tương lai. Đối với\nbên thuê, có các miễn trừ kế toán thuê đối với một số hợp đồng thuê nhất định nếu thời hạn là 12\ntháng hoặc ít hơn (IFRS và US GAAP) hoặc nếu đó là tài sản có giá trị thấp, giá bán lên tới 5.000 USD\n(chỉ IFRS), trong khi bên thuê có thể chọn ghi nhận các khoản thanh toán tiền thuê là chi phí trên\nđường thẳng cơ sở.\nC. Không chính xác vì theo IFRS, có một mô hình kế toán duy nhất cho cả hợp đồng thuê tài chính và\nhoạt động cho bên thuê. Khi bắt đầu hợp đồng thuê, bên thuê ghi lại khoản nợ thuê và tài sản có quyền sử dụng\n(ROU) trên bảng cân đối kế toán của mình, cả hai đều bằng giá trị hiện tại của các khoản thanh toán tiền thuê trong tương lai.","qhtml":null},{"n":101,"q":"An analyst gathers the following information (in millions) about a company:\nOther operating exposes 4,500\nDecrease in prepaid expenses 200\nIncrease in other accrued liabilities 300\nCash paid for other operating expenses (in € millions) is:","opts":["4,000.","4,400.","4,600"],"ans":"A","expl":"A. Đúng vì để xác định số tiền mặt trả cho các chi phí hoạt động khác, cần\nđiều chỉnh số tiền chi phí hoạt động khác trên báo cáo kết quả hoạt động kinh doanh theo những thay đổi ròng trong\nchi phí trả trước và chi phí phải trả phải trả trong năm. Theo đó, Tiền mặt thanh toán cho các chi phí hoạt động\nkhác = Chi phí hoạt động khác - Giảm chi phí trả trước - Tăng\nnợ phải trả khác = 4.500 - 200 - 300 = 4.000.\nB. Không chính xác vì nó đã thêm phần giảm chi phí trả trước thay vì trừ đi. 4.500 +\n200 - 300 = 4.400.\nC. Không chính xác vì nó đã cộng phần tăng nợ phải trả thay vì trừ đi. 4.500 -\n200 + 300 = 4.600.","qhtml":null},{"n":102,"q":"An analyst gathers the following information (in thousands) acut a company's equipment\nPurchase price of the equipment 1,000\nAccumulated depreciation 250\nGain on sale of the equipment 400\nIgnoring taxes, proceeds from sale of the equipment (in € thousands) is","opts":["750","1,150","1,400."],"ans":"B","expl":"A. Không chính xác vì nó đã tính giá trị còn lại của thiết bị (giá mua thiết bị\n - khấu hao lũy kế) = 1.000 - 250 = 750.\nB. Đúng vì lãi hoặc lỗ từ việc bán tài sản tồn tại lâu dài được tính bằng doanh thu\ndoanh thu trừ đi giá trị còn lại của tài sản tại thời điểm bán. Phép tính phải là\nDòng tiền từ việc bán thiết bị = Tiền bán thiết bị - Giá trị còn lại của thiết bị\n+ Lãi bán thiết bị = (1.000 - 250) + 400 = 1.150.\nC. Không chính xác vì nó đã tính toán dòng tiền từ việc bán thiết bị (giá mua\nthiết bị + lãi bán thiết bị) = 1.000 + 400 = 1.400.","qhtml":null},{"n":103,"q":"For a company reporting on a calendar year basis. The receipt of a payment from a client\nin Year 1 for the delivery of services in Year 2 most likely increases","opts":["net income for Year 1","liabilities as of 31 December of Year 1.","cash flow from operating activities for Year 2."],"ans":"B","expl":"A. Không chính xác vì giao dịch sẽ không tăng thu nhập ròng cho năm hiện tại vì\nviệc cung cấp dịch vụ không diễn ra trong năm hiện tại. Không có doanh thu nào được ghi nhận trong\nnăm hiện tại đối với các dịch vụ sẽ được cung cấp trong năm tiếp theo.\nB. Đúng vì khoản thanh toán nhận trước được ghi nhận là khoản nợ phải trả đối với doanh thu\nchưa kiếm được khi nhận được tiền mặt lần đầu và doanh thu sẽ được ghi nhận theo thời gian khi\nsản phẩm và dịch vụ được phân phối.\nC. Không chính xác vì dòng tiền sẽ được ghi nhận trong năm hiện tại mặc dù doanh thu\nsẽ không được ghi nhận cho đến năm sau. Việc nhận tiền mặt trong năm hiện tại\nsẽ làm tăng dòng tiền từ hoạt động kinh doanh trong năm hiện tại thay vì\nnăm tiếp theo.","qhtml":null},{"n":104,"q":"An analyst gathers the following Information (in € millions) about a manufacturing\ncompany's land reported under the revaluation model\nPurchase price and fair value on 1 January Year 23\nFair value at initial revaluation on 31 December Year 1 25\nAll elsebeing equal and ignoring taxes, the revaluation at 31 December Year 1 leads in a","opts":["higher quick ratio","higher total asset turnover","lower debt-to-assets ratio"],"ans":"B","expl":"A. Không chính xác vì việc đánh giá lại tài sản tăng lên chỉ ảnh hưởng đến tài sản cố định về mặt tài sản\nvà tài khoản thặng dư trong vốn chủ sở hữu; tử số không đổi. Nó dẫn đến\ntổng giá trị tài sản tăng lên và do đó chỉ có mối quan hệ trực tiếp với PP&E về mặt tài sản\nvà tài khoản thặng dư trong vốn chủ sở hữu; tử số không bị ảnh hưởng và chỉ mẫu số\ntăng. Điều này dẫn đến vòng quay tổ
