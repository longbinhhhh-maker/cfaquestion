 relevant under US GAAP, as US GAAP\ndoesn't allow for the reversal of prior-year inventory write-downs. The actual required\ndisclosures under US GAAP differ from this statement.\nC. Incorrect because although disclosures are useful when analyzing a company, the second part\nof the disclosure about the reversal of write-downs is not applicable under US GAAP. US GAAP\ndoesn't permit the reversal of prior-year inventory write-downs. The required disclosures under\nUS GAAP pertain more to accounting policies, significant estimates applicable to inventories,\nand any material amount of income resulting from the liquidation of LIFO inventory.", "qhtml": null}, {"n": 49, "q": "An analyst gathers the following Information about a company's non-depreciable asset\nreported under the revaluation model\nOriginal cost €25,000\nReported value after initial evaluation €27.600\nReported value after second revelation 22.500\nThe revaluation surplus after the second revaluation is:", "opts": ["€2,500", "€0", "€2.600"], "ans": "B", "expl": "A. Incorrect because as a result of the revaluations, the €2,500 increase in the value of the asset\nduring the first year (€27,500 - €25,000) is recorded in the revaluation surplus account in equity.\nThe subsequent decrease in fair value by €5,000 (€22,500 - €27,500) in the second year is\nassumed to be applied only to the revaluation surplus account, resulting in a balance of -€2,500\n(-€25,000 - €5,000).\nB. Correct because under the revaluation model, when an asset's value increases, the surplus\ngoes directly to equity. Any subsequent decrease in the asset's value will decrease the\nrevaluation surplus and then affect the income statement. Therefore, the initial increase of\n€2,500 (€27,500 - €25,000) goes to the revaluation surplus account in equity. Out of the\nsubsequent decrease of €5,000 (€22,500 - €27,500) in fair value, €2,500 is used to decrease the\nrevaluation surplus, while the remaining €2,500 goes to the income statement. Thus, the\nrevaluation surplus ends up at €0.\nC. Incorrect because, as a result of the revaluations, the initial increase of €2,500 (€27,500 -\n€25,000) goes to the revaluation surplus account in equity. The subsequent decrease of €5,000\n(€22,500 - €27,500) in fair value is accounted for in the income statement and does not directly\naffect the revaluation surplus account.", "qhtml": null}, {"n": 50, "q": "An analyst gathers the following Information about an electronics manufacturing\ncompany's inventory.\nYear 2 Year 1\nCost €100,000 €100,000\nNet realizable value €105.000 €97,000\nAs a result of the reversal of the write-down, the company's Year 2 financial statements\nshould report a decrease in cost of sales of", "opts": ["€0", "€3.000", "€6.000"], "ans": "B", "expl": "A. Incorrect because US GAAP prohibits the reversal of write-downs, but not IFRS.\nB. Correct because according to IFRS, inventories are measured at the lower of cost and net\nrealizable value. With each subsequent period, a new assessment of net realizable value is\nmade. Reversal of any write-down of inventories, limited to the original write-down amount, is\nrecognized as a reduction in cost of sales (i.e., a reduction in the amount of inventories\nrecognized as an expense).\n• On December 31 of Year 1, the inventory is carried on the balance sheet at the lower of\ncost and net realizable value: min(€100,000, €97,000) = €97,000.\n• The write-down of inventory equals the Cost of inventory minus the Net realizable value:\n€100,000 - (€97,000) = €3,000.\n• On December 31 of Year 2, the Net realizable value (€105,000) is higher than the\nprevious level (exceeding the cost of inventory). The reversal of any write-down of\ninventories is recognized as a reduction in cost of sales and is limited to the amount of\nthe original write-down, which is €3,000.\nC. Incorrect because it computes the reversal of inventory write-down as the difference\nbetween the net realizable value at the next assessment date and its previous level (€105,000 -\n€97,000 = €8,000), while the reversal of any write-down of inventories is limited to the amount\nof the original write-down, which is €3,000.", "qhtml": null}, {"n": 51, "q": "An analyst gathers the following Information about a company.\nROE 10%\nFinancial leverage 2.0\nNet profit margin 4%\nEBIT margin 5%\nInterest burden 85%\nThe total asset turnover ratio is closet to", "opts": ["1.0", "1.3", "1.5"], "ans": "B", "expl": "A. Incorrect because it has included the EBIT Margin in the calculation instead of the Net Profit\nMargin. Accordingly, Total asset turnover = ROE / (EBIT Margin x Leverage); or = 10% / (5% x 2) =\n10 / 10 = 1.0.\nB. Correct because according to the DuPont analysis for ROE, ROE = Net Profit Margin × Total\nAsset Turnover × Leverage. Thus, rearranging the formula for Total Asset Turnover: Total Asset\nTurnover = ROE / (Net Profit Margin × Leverage) = 10% / (4% × 2) = 10 / 8 = 1.25, approximately\n1.3.\nC. Incorrect because it included the Interest Burden in the calculation. Accordingly, Total Asset\nTurnover = ROE / (Net Profit Margin × Leverage × Interest Burden); or = 10% / (4% × 2 × 85%) =\n10 / 6.8 ≈ 1.471, approximately 1.5.", "qhtml": null}, {"n": 52, "q": "All else being equal, in a period of stable inventory quantities and declining inventory unit\ncosts, using the LIFO Inventory valuation method will result in a lower:", "opts": ["gross profit than if the FIFO inventory valuation method had been used", "current ratio than if the FIFO Inventory valuation method had been used", "Inventory turnover ratio than if the FIFO inventory valuation method had been used."], "ans": "C", "expl": "A. Incorrect because if purchase prices of inventory are decreasing, using the LIFO Inventory\nvaluation method will result in higher gross profit compared to other methods.\nB. Incorrect because if purchase prices of inventory are declining, using the LIFO method of\ninventory valuation will result in a higher current ratio compared to other methods. The use of\nthe LIFO method results in a higher ending inventory current asset compared to other methods.\nTherefore, the current ratio, defined as current assets divided by current liabilities, will be\nhigher as current assets (Inventory) will be higher and current liabilities will not be affected by\nthe choice of the inventory valuation method.\nC. Correct because if purchase prices of inventory are declining, using the LIFO method of\ninventory valuation will result in a higher ending inventory and a lower cost of sales compared\nto other inventory valuation methods. Inventory turnover is defined as cost of sales divided by\naverage inventory. Since the cost of sales will be lower under LIFO compared to FIFO and\naverage inventory will be higher under LIFO as compared to FIFO in a period of declining unit\ncosts, inventory turnover will be lower under LIFO than FIFO in a period of declining inventory\nunit costs.", "qhtml": null}, {"n": 53, "q": "An analyst collects the following information (in € millions) about a manufacturing\ncompany's inventory\nOriginal cost 2,000\nNet realizable value at end of Year 1 1,700\nNet realizable value at end of Year 2 2,500\nAt the end of Year 2, thee balance sheet should reflect inventory (in € millions) of", "opts": ["1,700.", "2,000.", "2,500."], "ans": "B", "expl": "A. Incorrect because in each subsequent period, a new assessment of net realizable value is\nmade. Reversal (limited to the amount of the original write-down) is required for a subsequent\nincrease in value of inventory previously written down. Reversals are not allowed for US GAAP,\nwhich would result in this answer. Inventory would be written down from 2,000 to 1,700 in Year\n1, and the reversal in Year 2 would be limited to the original write-down of 300, bringing the\nvalue back to 2,000 at the end of Year 2.\nB. Correct because in each subsequent period, a new assessment of net realizable value is\nmade. Reversal (limited to the amount of the original write-down) is required for a subsequent\nincrease in value of inventory previously written down. Inventory would be written down from\n2,000 to 1,700 in Year 1, and the reversal in Year 2 would be limited to the original write-down\nof 300, bringing the value back to 2,000 at the end of Year 2.\nC. Incorrect because in each subsequent period, a new assessment of net realizable value is\nmade. Reversal (limited to the amount of the original write-down) is required for a subsequent\nincrease in value of inventory previously written down. The incorrect answer is obtained by\nwriting the inventory up to the Year 2 net realizable value.", "qhtml": null}, {"n": 54, "q": "In an environment of steadily increasing prices and quantities reported, ending inventory\nmost closely reflects current replacement value under the", "opts": ["FIFO method using a periodic inventory system", "LIFO method using a periodic inventory system.", "LIFO method using a perpetual inventory system."], "ans": "A", "expl": "A. Correct because FIFO assumes that the oldest inventory items are sold first, leaving the most\nrecently purchased inventory on the balance sheet. The carrying amount of inventories under\nFIFO will more closely reflect current replacement values because inventories are assumed to\nconsist of the most recently purchased items. Companies typically record changes to inventory\nusing either a periodic inventory system or a perpetual inventory system. Under either system,\nthe allocation of goods available for sale to cost of sales and ending inventory is the same if the\ninventory valuation method used is either specific identification or FIFO.\nB. Incorrect because under LIFO, the most recently purchased inventory items are assumed to\nbe sold first, so items included in the cost of goods sold more closely reflect current\nreplacement value. However, the balance sheet inventory will reflect prior period (lower in this\ncase) prices. The cost of sales under LIFO will more closely reflect current replacement value.\nAlthough the carrying amount of the ending inventory may differ (compared to the periodic\nsystem) because the perpetual system will apply LIFO continuously throughout the year, the\neffect of increasing prices and quantities will result in a lower reported inventory on the balance\nsheet than current replacement values.\nC. Incorrect because under LIFO, the most recently purchased inventory items are assumed to\nbe sold first, so items included in the cost of goods sold more closely reflect current\nreplacement value. However, the balance sheet inventory will reflect prior period (lower in this\ncase) prices. The cost of sales under LIFO will more closely reflect current replacement value.\nAlthough the carrying amount of the ending inventory may differ (compared to the periodic\nsystem) because the perpetual system will apply LIFO continuously throughout the year, the\neffect of increasing prices and quantities will result in a lower reported inventory on the balance\nsheet than current replacement values.", "qhtml": null}, {"n": 55, "q": "An analyst gathers the following information (in € thousands) about a company's non-\ndepreciable asset\nHistorical cost 50\nCarrying value after impairment, 31 December of Year 1 40\nRecoverable amount, 31 December of Year 2 60\nThe maximum allowable carrying amount (in € thousands) on the Year 2 balance sheet is", "opts": ["40", "50", "60"], "ans": "B", "expl": "A. Incorrect because an adjustment is permitted in all cases under IFRS. The only situation\nwhere the loss cannot be reversed is under US GAAP for an asset held for use. Under US GAAP,\nthe impairment loss would not be reversed, remaining at €40,000.\nB. Correct because in recognizing the impairment loss in Year 1, carrying cost was reduced from\n€50,000 to €40,000, so an impairment loss of €10,000 was reported. A reversal can only be\ntaken for the previous carrying amount, not the full recoverable amount. Therefore, with the\nreversal, carrying cost reverts to its previous level of €50,000. Note that IFRS permit the reversal\nof impairment losses only. IFRS do not permit the revaluation to the recoverable amount if the\nrecoverable amount exceeds the previous carrying amount.\nC. Incorrect because IFRS permit the reversal of impairment losses only. IFRS do not permit the\nrevaluation to the recoverable amount if the recoverable amount exceeds the previous carrying\namount. Previously, carrying cost was reduced from €50,000 to €40,000, so an impairment loss\nof €10,000 was reported. A reversal can only be taken for the previous carrying amount.\nTherefore, the new carrying cost cannot increase to the full recoverable amount of €60,000.", "qhtml": null}, {"n": 56, "q": "All else being equal, a write down of inventory by a manufacturing company most likely\nresults in a", "opts": ["lower total asset turnover ratio and a lower current ratio", "higher total asset turnover ratio and a lower current ratio.", "lower total asset turnover ratio and a higher current ratio."], "ans": "B", "expl": "A. Incorrect because a write-down of inventory to a lower value would decrease both total asset\nturnover and the current ratio. Total asset turnover, calculated by dividing net sales by average\ntotal assets, will decrease as the denominator (average total assets) decreases due to the\nreduced inventory value. Similarly, the current ratio, calculated as current assets divided by\ncurrent liabilities, will decline because reducing inventory (a component of current assets)\ndecreases the numerator, affecting the ratio.\nB. Correct because when the value of inventory declines below the carrying amount on the\nbalance sheet, the inventory carrying amount must be written down to its net realizable value.\nThis write-down reduces both inventory and the carrying value of inventory on the balance\nsheet, impacting asset turnover and solvency ratios. The total asset turnover ratio, calculated by\ndividing net sales by average total assets, will increase due to the reduction in average total\nassets caused by the write-down. However, the current ratio, computed as current assets\ndivided by current liabilities, decreases because reducing inventory affects the numerator while\ncurrent liabilities remain unaffected.\nC. Incorrect because a write-down of inventory to its net realizable value would result in a lower\ntotal asset turnover ratio and a lower current ratio due to the reduction in inventory value\nimpacting both ratios negatively.\nNote: \"All else being equal\" has been considered in this analysis to isolate the impact of\ninventory write-downs on these financial ratios.", "qhtml": null}, {"n": 57, "q": "On the statement of cash flows, interest paid should be classified as", "opts": ["a financing cash flow only", "an operating cash flow only.", "ether a financing or an operating cash flow"], "ans": "C", "expl": "A. Incorrect because IFRS allow companies to classify interest expense as either an operating\nacavity or a financing activity. This is the treatment of dividends paid under US GAAP US GAAP\nclassify dividends paid to stockholders as a financing activity.\nB. Incorrect because IFRS allow companies to classify interest expense as either an operating\nactivity or a financing activity. This is the treatment of interest paid under US GAAP US GAAP\nclassy interest expense as an operating activity, even though the principal amount of the debt\nissued is classified as a financing activity.\nC. Correct because IFRS allows more flexibility in the reporting of such items as interest paid.\nIFRS allow companies to classify Interest expense as either an operating activity or a financing\nactivity.", "qhtml": null}, {"n": 58, "q": "An analyst gathers the following information (in millions) about an automobile\nmanufacturer's inventory:\nYear 2 Year 1\nCost of goods sold 600 700\nCost of inventory 100 90\nNet realizable value of inventory 120 80\nThe Inventory turnover (calculated using average inventory in Year 2) is closest to:", "opts": ["6.0", "6.3", "6.7"], "ans": "C", "expl": "A. Incorrect because the inventory turnover in Year 2 was calculated based on the average of\nthe Net Realizable Value of Inventory for the two years. Consequently, the Inventory turnover in\nYear 2 = Cost of goods sold / Average Inventory = 600 / ((120 + 80) / 2) = 600 / 100 = 6.0.\nB. Incorrect because the inventory turnover in Year 2 was calculated based on the average of\nthe Cost of Inventory for the two years. Consequently, the Inventory turnover in Year 2 = Cost of\ngoods sold / Average Inventory = 600 / ((100 + 90) / 2) = 600 / 95 = 6.3.\nC. Correct because under IFRS, inventories are to be measured (and carried on the balance\nsheet) at the lower of cost and net realizable value. Accordingly, Year 1 inventory = 80 (being the\nlower of 90 and 80), and Year 2 inventory = 100 (being the lower of 100 and 120). Inventory\nturnover in Year 2 = Cost of goods sold / Average Inventory = 600 / ((100 + 80) / 2) = 600 / 90 =\n6.7.", "qhtml": null}, {"n": 59, "q": "An analyst gathers the following Information (in € thousands) about an electronics\nmanufacturing company's inventory.\nCost of ending inventory 3,600\nNet realizable value 3,300\nCurrent replacement cost 3,200\nNet realizable value less a normal profit margin 3,100\nThe Inventory (in € thousands) is carried on the balance sheet at", "opts": ["3,100.", "3,200", "3,300."], "ans": "C", "expl": "A. Incorrect because it assumes the company reports under US GAAP and uses the LIFO\ninventory valuation method, taking the lower limit of market value (i.e., net realizable value less\na normal profit margin) instead of the current replacement cost. Accordingly, Min(Cost, Net\nrealizable value less a normal profit margin) = Min(€3,600; €3,100) = €3,100.\nB. Incorrect because it assumes the company reports under US GAAP and uses the LIFO\ninventory valuation method. Under US GAAP, for inventories measured using LIFO and retail\ninventory methods, market value is defined as the current replacement cost (€3,200), subject to\nupper and lower limits. The lower limit of market value is the net realizable value less a normal\nprofit margin (€3,100). Accordingly, Min(Cost, Market value) = Min(€3,600, €3,200) = €3,200.\nC. Correct because under IFRS, inventories are to be measured (and carried on the balance\nsheet) at the lower of cost and net realizable value. Accordingly, Min(Cost, Net realizable value)\n= Min(€3,600, €3,300) = €3,300.", "qhtml": null}, {"n": 60, "q": "For leases with a term of twelve months or less, the lessee:", "opts": ["may recognize lease payments on a straight-line basis.", "must report at lease inception a \"right-of-use” asset and a lease liability, which are both equal to the present value of future lease payments", "must report at lease inception a right-of-use asset and a lease liability, which are both equal to the undiscounted value of future lease payments"], "ans": "A", "expl": "A. Correct because for lessees, there are lease accounting exemptions for certain lease\ncontracts. If the term is 12 months or less (under both IFRS and US GAAP) or for a \"low-value\nasset\" up to $5,000 or similar amounts (under IFRS only), the lessee can elect to simply expense\nthe lease payments on a straight-line basis. These exemptions are not available to lessors.\nB. Incorrect because under IFRS, there is a single accounting model for both finance and\noperating leases for lessees. At lease inception, the lessee records a lease liability and a \"right-\nof-use\" (ROU) asset on its balance sheet, both equal to the present value of future lease\npayments.\nC. Incorrect because under IFRS, there is a single accounting model for both finance and\noperating leases for lessees. At lease inception, the lessee records a lease liability and a right-of-\nuse (ROU) asset on its balance sheet, both equal to the present value of future lease payments.", "qhtml": null}, {"n": 61, "q": "According to the converged standards for revenue recognition, a receivable is recognized\non the seller's balance sheet when", "opts": ["a contract is signed", "all performance obligations have been met except for payment", "consideration is received in advance of transferring goods or services"], "ans": "B", "expl": "A. A contract is signed. According to the converged standards of revenue recognition, the\nprocess involves five steps:\n1. Identify the contract(s) with a customer.\n2. Identify the separate or distinct performance obligations in the contract.\n3. Determine the transaction price.\n4. Allocate the transaction price to the performance obligations in the contract.\n5. Recognize revenue when (or as) the entity satisfies a performance obligation. While\nentering into or signing the contract would be covered by steps 1-4, step 5 is required to\nrecognize revenue. The entity will only recognize revenue when it is able to satisfy the\nperformance obligation.\nB. Correct because it is only when all performance obligations have been met except for\npayment that a receivable appears on the seller's balance sheet.\nC. Incorrect because it is only when all performance obligations have been met except for\npayment that a receivable appears on the seller's balance sheet. If consideration is received in\nadvance of transferring goods or services, the seller presents a contract liability. Consequently,\nthe seller recognizes a contract liability rather than a receivable.", "qhtml": null}, {"n": 62, "q": "An analyst gathers the following Information about a company's equipment\nCarrying value prior to impairment €20,000\nUndiscounted expected future cash flows €22,000\nValue in use €17,400\nFair value if sold €19,100\nCosts to sell €1.900\nThe carrying value of the equipment should be", "opts": ["€17,200", "€17,400.", "€20,000"], "ans": "B", "expl": "A. Incorrect because it is the value of the asset if sold less costs to sell, which is the lower, not\nhigher, of its fair value less costs to sell and its value in use. Under IFRS, the company would\ncompare the carrying value (€20,000) with the higher of its fair value less costs to sell (€19,100 -\n€1,900 = €17,200) and its value in use (€17,400). Under IFRS, the carrying value is €17,400.\nB. Correct because it represents the value of the asset in use. Under IFRS, the company would\ncompare the carrying value (€20,000) with the higher of its fair value less costs to sell (€19,100 -\n€1,900 = €17,200) and its value in use (€17,400). Under IFRS, the carrying value is €17,400.\nC. Incorrect because this is the carrying amount after impairment assessment under US GAAP:\nthe carrying amount (€20,000) is compared with the undiscounted expected future cash flows\n(€22,000). The carrying amount is less than the undiscounted expected future cash flows, so the\ncarrying amount is considered recoverable. The equipment would continue to be carried at\n€20,000 under US GAAP.", "qhtml": null}, {"n": 63, "q": "Which of the following ratios would most likely be positively affected by an inventory\nwrite-down compared to the value absent the write down?", "opts": ["Activity", "Liquidity", "Solvency"], "ans": "A", "expl": "A. Correct because activity ratios (such as Inventory turnover and total asset turnover) will be\npositively affected by a write-down because the asset base (denominator) is reduced.\nB. Incorrect because an inventory write-down reduces both profit and the carrying amount of\ninventory on the balance sheet, thus having a negative effect on profitability, liquidity, and\nsolvency ratios.\nC. Incorrect because an inventory write-down reduces both profit and the carrying amount of\ninventory on the balance sheet, thereby negatively impacting profitability, liquidity, and\nsolvency ratios.", "qhtml": null}, {"n": 64, "q": "A deferred tax asset has been previously recognized. At the current balance sheet date,\nthe criteria for economic benefits are not met but the tax differences are still expected to be\ntemporary. As a result:", "opts": ["The existing deferred tax asset should be reversed", "a valuation allowance account should be established", "the existing deferred tax asset should be reclassified as equity"], "ans": "A", "expl": "A. Correct because if a deferred tax asset or liability resulted in the past, but the criteria of\neconomic benefits are not met on the current balance sheet date, then, under IFRS, an existing\ndeferred tax asset or liability related to the item will be reversed.\nB. Incorrect because if a deferred tax asset or liability resulted in the past, but the criteria of\neconomic benefits are not met on the current balance sheet date, then, under IFRS, an existing\ndeferred tax asset or liability related to the item will be reversed. Under US GAAP, a valuation\nallowance is established.\nC. Incorrect because it refers to a deferred tax liability reported under US GAAP. The analysis\nshould classify the deferred tax liability as debt if the liability is expected to reverse with\nsubsequent tax payment. If the liability is not expected to reverse, there is no expectation of a\ncash outflow, and the liability should be treated as equity.", "qhtml": null}, {"n": 65, "q": "An analyst gathers the following information (in € thousands) about a company\nRevenue 5,000\nCash balance, beginning of year 2,000\nCash balance, end of year 2,000\nIncrease in accounts receivable 1.200\nCash received from customers (in € thousands) is:", "opts": ["3,800.", "5,000", "6,200."], "ans": "A", "expl": "A. Correct because if revenue reported using accrual accounting is higher than the cash actually\ncollected, the result will typically be an increase in accounts receivable. Also, Beginning\naccounts receivable plus Revenue minus Cash collected from customers equals Ending accounts\nreceivable, restated as: Cash collected from customers = Beginning accounts receivable +\nRevenue - Ending accounts receivable or Revenue - Increase in accounts receivable = 5,000 -\n1,200 = 3,800.\nB. Incorrect because it equals Revenue (3,000) or the Reverse Change in cash balance (instead\nof Change in accounts receivable) = 6,000 - (2,000 - 2,000) = 6,000 - 0 = 5,000.\nC. Incorrect because it assumes Cash collected from customers = Revenue + Increase in\naccounts receivable = 5,000 + 1,200 = 6,200.", "qhtml": null}, {"n": 66, "q": "Which of the following is an inventory related financial statement disclosure required\nunder US GAAP?", "opts": ["The carrying amount of inventories carried at fair value less costs to sell.", "The circumstances or events that led to the reversal of a prior-year write-down of inventories", "The amount of reversal of any prior year write-down of inventories that is recognized as a reduction in cost of sales in the current period."], "ans": "A", "expl": "A. Correct because IFRS requires eight financial statement disclosures concerning inventory,\nincluding (1) the carrying amount of inventories carried at fair value less costs to sell, (2) the\namount of any reversal of any write-down that is recognized as a reduction in cost of sales in the\nperiod, and (3) the circumstances or events that led to the reversal of a write-down of\ninventories. Inventory-related disclosures under US GAAP are very similar to the disclosures\nabove, except that requirement (2) and (3) are not relevant because US GAAP does not permit\nthe reversal of prior-year inventory write-downs.\nB. Incorrect because inventory-related disclosures under US GAAP are very similar to the\ndisclosures under IFRS, except that the requirement \"the circumstances or events that led to the\nreversal of a write-down of inventories\" is not relevant because US GAAP does not permit the\nreversal of prior-year inventory write-downs.\nC. Incorrect because inventory-related disclosures under US GAAP are very similar to the\ndisclosures under IFRS, except that the requirement \"the amount of any reversal of any write-\ndown that is recognized as a reduction in cost of sales in the period\" is not relevant because US\nGAAP does not permit the reversal of prior-year inventory write-downs.", "qhtml": null}, {"n": 67, "q": "All else being equal in a period of declining inventory unit costs and constant inventory\nquantities, which of the following inventory valuation methods most likely allocates a higher\namount of the total cost of goods available available for sale to cost of sales on the income\nstatement?", "opts": ["FIFO", "LIFO", "Weighted average cost"], "ans": "A", "expl": "A. Correct because in an environment of declining inventory unit costs and constant or\nincreasing inventory quantities, FIFO (compared with weighted average cost or LIFO) will\nallocate a higher amount of the total cost of goods available for sale to cost of sales on the\nincome statement and a lower amount to ending inventory on the balance sheet. Accordingly,\nbecause cost of sales will be higher under FIFO, a company's gross profit, operating profit, and\nincome taxes will be lower.\nB. Incorrect because in an environment of declining inventory unit costs and constant or\nincreasing inventory quantities, FIFO (compared with weighted average cost or LIFO) will\nallocate a higher amount of the total cost of goods available for sale to cost of sales on the\nincome statement and a lower amount to ending inventory on the balance sheet. Accordingly,\nbecause cost of sales will be higher under FIFO, a company's gross profit, operating profit, and\nincome taxes will be lower. In comparison, in a period of declining inventory unit costs, LIFO will\nresult in higher inventory and lower cost of sales. Because cost declined over the period, LIFO\nhad the highest ending inventory, the lowest cost of sales, and the highest gross profit\n[compared to Specific Identification, Weighted Average Cost, and FIFO].\nC. Incorrect because in an environment of declining inventory unit costs and constant or\nincreasing inventory quantities, FIFO (compared with weighted average cost or LIFO) will\nallocate a higher amount of the total cost of goods available for sale to cost of sales on the\nincome statement and a lower amount to ending inventory on the balance sheet. Accordingly,\nbecause cost of sales will be higher under FIFO, a company's gross profit, operating profit, and\nincome taxes will be lower.", "qhtml": null}, {"n": 68, "q": "The adjustments related to changes in the estimated residual value of a long-lived asset\nshould be", "opts": ["handled prospectively", "shown separately on the income statement", "handled retrospectively unless impractical to do so."], "ans": "A", "expl": "A. Correct because, in contrast to changes in accounting policies (such as whether to expense\nthe cost of employee stock options), companies sometimes make changes in accounting\nestimates such as the useful life of a depreciable asset. Changes in accounting estimates are\nhandled prospectively, with the change affecting the financial statements for the period of\nchange and future periods. No adjustments are made to prior statements, and the adjustment is\nnot shown on the face of the income statement. B. Incorrect because, in contrast to changes in\naccounting policies, changes in accounting estimates, such as the useful life of a depreciable\nasset, are handled prospectively. They affect the financial statements for the period of change\nand future periods. No adjustments are made to prior statements, and the adjustment is not\nseparately shown on the face of the income statement. C. Incorrect because, in contrast to\nchanges in accounting policies, changes in accounting estimates, such as the useful life of a\ndepreciable asset, are handled prospectively. They affect the financial statements for the period\nof change and future periods. No adjustments are made to prior statements, and the\nadjustment is not shown separately on the face of the income statement.", "qhtml": null}, {"n": 69, "q": "Which of the following might indicate that a company uses aggressive accounting choices\nto increase its reported performance and financial position in the current period?", "opts": ["Increasing the estimated salvage values of PPSE", "Changing the depreciation method from straight-line to double-declining balance", "Changing from weighted average to FIFO Inventory valuation method in a period of declining inventory prices and constant inventory quantities"], "ans": "A", "expl": "A. Correct because increasing the estimated salvage values is an example of a non-conservative\n(or aggressive) accounting policy. Depreciation expense is affected by the estimated salvage\nvalue of the assets being depreciated. A higher salvage value will decrease depreciation expense\nunder most methods, compared with the choice of a lower salvage value.\nB. Incorrect because changing the depreciation method from straight-line to double-declining\nbalance is an example of a conservative accounting policy change. This change would increase\ndepreciation expenses and decrease earnings for the year. The selection of a depreciation\nmethod affects the allocation of the cost of long-lived assets to accounting periods, and\nmanagers may choose different methods based on various factors.\nC. Incorrect because changing from weighted average to FIFO Inventory valuation method in a\nperiod of declining inventory prices and quantities is an example of a conservative accounting\npolicy change. In an environment of declining inventory unit costs and constant or increasing\ninventory quantities, FIFO (in comparison with weighted average cost or LIFO) would allocate a\nhigher amount of the total cost of goods available for sale to cost of sales on the income\nstatement and a lower amount to ending inventory on the balance sheet. This change leads to\nhigher cost of sales and lower reported profits. Assumptions about Inventory cost flows provide\nanother example of how accounting choices can affect financial reporting", "qhtml": null}, {"n": 70, "q": "An analyst gathers she following information about a company's equipment base:\nBeginning balance accumulated depreciation €7.000.000\nEnding balance accumulated depreciation €3.000.000\nDepreciation expense of equipment €4.000.000\nThe company sold equipment having a historical cost of €5,000,000 and reported a loss on\nsale of €250,000. The cash received from the sale of equipment is", "opts": ["€750,000.", "€1,750.000", "€4,700.000."], "ans": "B", "expl": "A. Incorrect because the cash received from the sale of equipment is calculated as follows:\nHistorical cost of equipment sold (€5,000,000) - Accumulated depreciation on the equipment\nsold (€3,000,000) = Book value of the equipment sold (€2,000,000) - Loss on sale (€250,000) =\n€1,750,000.\nB. Correct because the cash received from the sale of equipment is determined by subtracting\nthe book value of the equipment sold (calculated as the historical cost minus the accumulated\ndepreciation) from the loss on sale reported. The formula is: Cash received from the sale of\nequipment = Book value of the equipment sold - Loss on sale = €2,000,000 - €250,000 =\n€1,750,000.\nC. Incorrect because the calculation for cash received from the sale of equipment as Historical\ncost of equipment sold (€5,000,000) - Loss on sale (€250,000) equals €4,750,000, which is not\naccurate in this context.", "qhtml": null}, {"n": 71, "q": "An analyst gathers the following information (in millions) about a company.\nEBIT 150\nEarnings before taxes 130\nNet income 110\nTotal average asset 1,000\nROA is", "opts": ["11%", "13%", "15%"], "ans": "A", "expl": "A. Correct because ROA is calculated as Net income divided by Average total assets, which is\n(110 / 1,000) * 100 = 11%.\nB. Incorrect because it assumes ROA is calculated as Earnings before taxes divided by Total\naverage assets, which is (130 / 1,000) * 100 = 13%.\nC. Incorrect because it assumes ROA is calculated as EBIT divided by Average total assets, which\nis (150 / 1,000) * 100 = 15%.", "qhtml": null}, {"n": 72, "q": "In calculating basic and basic EPS, the numerators are the same but the denominators are\ndifferent, the company.", "opts": ["split its stock during the year", "had stock options outstanding at year end.", "had convertible debt outstanding at year end."], "ans": "B", "expl": "A. Incorrect because if the number of shares of common stock increases as a result of a stock\ndividend or stock split, the EPS calculation reflects the change retroactively to the beginning of\nthe period. The denominator is the same for both the basic and diluted EPS calculations.\nB. Correct because the assumed exercise of the stock options would not change net income for\nthe year (or predetermine dividends). Therefore, for calculating EPS, no change is made to the\nnumerator. However, the denominator would be increased by the incremental number of shares\nissued as a result of the stock options being exercised.\nC. Incorrect because both the numerator and the denominator change when dealing with\nconvertible debt. The numerator is increased by after-tax interest on the convertible debt, and\nthe denominator is increased by the additional shares that were issued upon conversion.", "qhtml": null}, {"n": 73, "q": "An analyst gathers the following Information about a company's given fiscal year ended\n31 December.\nNet income $1,200,000\nNumber of common shares outstanding on 1 January 1,000,000\nNumber of common shares issued on 1 April 100.000\nNumber of common shares outstanding on 31 December 1,100 000\nFace value of convertible bonds outstanding for the year $2,000,000\nCoupon rate on convertible bonds outstanding 8%\nTax rate 30%\nthe bonds are convertible into 200,000 common shares and there are no other potentially\ndilutive securities outstanding, The company's reported diluted EPS is closest to", "opts": ["$1.01.", "$1.03.", "$1.07."], "ans": "B", "expl": "A. incorrect because it has not weighted the number of shares outstanding during the year and\ninstead used the period-end balance along with the effect of the conversion. That is, weighted\naverage number of shares outstanding is mistakenly calculated as 1,100.000 shares plus 200,000\nwhich equals 1.300.000. Assuming all else equal, $1,312,000 / 1,300,000 = $1.01\nB. Correct because the basic EPS calculation does not incorporate the convertible bond as\ndilutive. The basic EPS is calculated as follows: Basic EPS = (Net income - Preferred dividends) /\n(Weighted average number of shares outstanding). Net income is $1,200,000. There are no\npreferred dividends. Weighted average number of shares outstanding is calculated as follows:\nWeighted average number of shares outstanding = [(1,000,000 shares * 3 months) + (1,100,000\nshares * 9 months)] / 12 months = (3,000,000 + 9,900,000) / 12 months = 12,900,000 / 12 =\n1,075,000 shares. Therefore, Basic EPS = $1,200,000 / 1,075,000 = $1.12. Diluted EPS, computed\nusing the convertible bonds, is calculated as follows: (Net income + After-tax interest on\nconvertible debt - Preferred dividends) / (Weighted average number of shares outstanding -\nAdditional common shares that would have been issued at conversion). After-tax interest on\nconvertible debt = $2,000,000 * 8% * (1 - 30%) = $112,000 Therefore, Diluted EPS = ($1,200,000\n+ $112,000) / (1,075,000 + 200,000) = $1,312,000 / 1,275,000 ≈ $1.03.\nC. Incorrect because it erroneously includes the pre-tax cost of debt as an addition to net\nincome in the numerator. The computation is shown as ($1,200,000 + $160,000) / (1,075,000 +\n200,000) = $1,360,000 / 1,275,000 ≈ $1.07. If a candidate mistakenly uses net income alone in\nthe numerator with any of the denominators in the three Response Rationales, the answer will\nalso be closest to this distractor.", "qhtml": null}, {"n": 74, "q": "An analyst gathers the following information about a company.\nNet profit margin 3.0%\nTotal asset turnover 1.0\nFinancial leve age 1.5\nTax burden 0.85\nROE is closest to", "opts": ["5.4%", "6.9%", "8.1%"], "ans": "C", "expl": "A. Incorrect because it omits the financial leverage in the ROE calculation and instead uses the\nROA calculation. It calculates ROA (Return on Assets) as Net profit margin × Total asset turnover\n= 3% × 1.8 = 5.4%.\nB. Incorrect because it includes the tax burden in the ROE calculation and not financial leverage.\nThe formula becomes ROC (Return on Capital) = Net profit margin × Total asset turnover ×\nFinancial leverage × Tax burden = 3.0% × 1.8 × 1.5 × 0.85 = 6.585% ≈ 6.9%.\nC. Correct because ROE (Return on Equity) is calculated using the formula: Net profit margin ×\nTotal asset turnover × Financial leverage = 3.0% × 1.8 × 1.5 = 8.1%.", "qhtml": null}, {"n": 75, "q": "An analyst gathers the following Information (in € thousands) about equipment.\nCarrying amount prior to testing for impairment 10,000\nFair value 9,000\nPresent value of expected future cash flows 7,000\nCosts to sel l 200\nThe equipments carrying amount (in € thousands) after Impairment is", "opts": ["7,000.", "8,800.", "9,000."], "ans": "B", "expl": "A. Incorrect because the carrying amount after the impairment charge is equal to the\nrecoverable amount. Under IFRS 36, an impairment loss is measured as the excess of the\ncarrying amount over the recoverable amount of the asset. The recoverable amount of an asset\nis defined as the higher of its fair value less costs to sell (€9,000 - €200 = €8,800) and its value in\nuse (€7,000). The lower of these two values is €7,000, not €9,000.\nB. Correct because the carrying amount after the impairment charge is equal to the recoverable\namount. Under IFRS 36, an impairment loss is measured as the excess of the carrying amount\nover the recoverable amount of the asset. The recoverable amount of an asset is defined as the\nhigher of its fair value less costs to sell (€9,000 - €200 = €8,800) and its value in use (€7,000). In\nthis case, the recoverable amount is the fair value less costs to sell, which is €8,800.\nC. Incorrect because it attempts to subtract the cost of selling from the fair value, which is not\nnecessary. The recoverable amount of an asset is the higher of its fair value less costs to sell or\nits value in use, and in this scenario, the fair value less costs to sell is €8,800, not €9,000.", "qhtml": null}, {"n": 76, "q": "Which of the following ratios is most appropriate in measuring a company's ability to\ncover its debt payment", "opts": ["Return on equity", "Fixed asset turnover", "Fixed charge coverage"], "ans": "C", "expl": "A. Incorrect because this is a profitability ratio. ROE measures the return earned by a company\non its equity capital, including minority equity, preferred equity, and common equity. ROE is\ncalculated as Net Income divided by Average Total Equity.\nB. Incorrect because this is an activity ratio (or asset utilization, turnover, or operating efficiency\nratio) that measures how well a company manages various activities. Fixed asset turnover is\ncalculated as Revenue divided by Average Net Fixed Assets. This ratio assesses how efficiently\nthe company generates revenues from its investments in fixed assets.\nC. Correct because solvency ratios are primarily of two types: debt ratios, which focus on the\nbalance sheet and measure the amount of debt capital relative to equity capital, and coverage\nratios, which focus on the income statement and measure the ability of a company to cover its\ndebt payments. These ratios are used in assessing a company's solvency and evaluating the\nquality of its bonds and other debt obligations.\nFixed charge coverage ratio is calculated as (EBIT + Lease payments) divided by (Interest\npayments + Lease payments). A higher fixed charge coverage ratio implies stronger solvency,\noffering greater assurance that the company can service its debt obligations, such as bank loans,\nnotes, and bonds, from normal earnings.", "qhtml": null}, {"n": 77, "q": "Under which of the following classifications of leases will a lessor derecognize the leased\nasset and recognize a lease receivable on the balance sheet at lease inception", "opts": ["Only a finance lease under IFRS", "Only an operating lease under US GAAP", "Both a finance lease under IFRS and an operating lease under US GAAP"], "ans": "A", "expl": "A. Correct because the accounting treatment for lessors is substantially similar under both IFRS\nand US GAAP. In both accounting standards, lessors classify leases as finance or operating\nleases, which determines their financial reporting. Under a finance lease, the lessor recognizes a\nlease receivable on the balance sheet, representing the present value of future lease payments,\nand derecognizes the leased asset. Any difference between the present value of the lease\npayments and the carrying amount of the asset is recognized as a gain or loss.\nB. Incorrect because under both IFRS and US GAAP, lessors classify leases as finance or\noperating leases, each with its respective accounting treatment. In the case of an operating\nlease, the lessor retains the leased asset on its books and recognizes lease revenue on a\nstraight-line basis over the lease term.\nC. Incorrect because the accounting treatment for lessors is similar under both IFRS and US\nGAAP. Both standards categorize leases as finance or operating leases, impacting the lessor's\nfinancial reporting. In an operating lease scenario, the lessor retains the leased asset on its\nbooks and recognizes lease revenue evenly over the lease term, differing from finance leases\nwhere the lessor derecognizes the asset and recognizes a lease receivable.", "qhtml": null}, {"n": 78, "q": "Ignoring income taxes, which of the following ratios decreases as a result of an\nimpairment change", "opts": ["Net profit margin", "Debt-to-equity ratio", "Working capital turnover"], "ans": "A", "expl": "A. Correct because the amount of the impairment loss will reduce the carrying amount of the\nasset on the balance sheet and will consequently reduce net income on the income statement.\nImpairment charges reduce income but have no effect on revenue. Therefore, the impairment\ncauses a decrease in the net profit margin, where Net profit margin = Net Income / Revenue.\nB. Incorrect because the Debt-to-equity ratio is the total debt divided by total equity. The\nimpairment loss reduces the carrying amount of the asset on the balance sheet, but it does not\ndirectly affect the total debt or equity, which are unaffected by impairment charges. Therefore,\nimpairment charges do not impact the Debt-to-equity ratio.\nC. Incorrect because the Working capital turnover ratio, which is calculated as Revenue divided\nby Average working capital, is unaffected by impairment changes. Impairment losses reduce the\ncarrying amount of the asset on the balance sheet and subsequently reduce net income on the\nincome statement. However, impairment charges are non-cash items and do not affect the\nworking capital or the turnover ratio.", "qhtml": null}, {"n": 79, "q": "An analyst gathers the following information about a company:\nShort-term interest bearing debt 700\nCurrent portion of long term interest bearing debt 500\nNon-current portion of long-term interest bearing debt: 800\nTotal shareholders' equity 7,500\nBased only on this information, the company's debt to capital ratio is closest to:", "opts": ["17%", "21%", "27%"], "ans": "B", "expl": "A. Incorrect because it incorrectly excludes the Current portion of long-term interest-bearing\ndebt from the Total debt and calculates the Debt-to-capital ratio as Total debt / (Total debt +\nTotal shareholders' equity), which leads to an error in the calculation. The correct formula for\nthe debt to capital ratio is (Short-term interest-bearing debt + Current portion of long-term\ninterest-bearing debt + Non-current portion of long-term interest-bearing debt) / (Short-term\ninterest-bearing debt + Current portion of long-term interest-bearing debt + Non-current\nportion of long-term interest-bearing debt + Total shareholders' equity). Using the correct\nformula, the calculation would be (700 + 500 + 800) / (700 + 500 + 800 + 7,500) = 2,000 / 9,500\n= 0.211 or 21%.\nB. Correct because the Debt-to-capital ratio is calculated correctly as (Short-term interest-\nbearing debt + Current portion of long-term interest-bearing debt + Non-current portion of\nlong-term interest-bearing debt) divided by (Short-term interest-bearing debt + Current portion\nof long-term interest-bearing debt + Non-current portion of long-term interest-bearing debt +\nTotal shareholders' equity), which results in (700 + 500 + 800) / (700 + 500 + 800 + 7,500) =\n2,000 / 9,500 = 0.211 or 21%.\nC. Incorrect because it mistakenly calculates the Debt-to-equity ratio [(Short-term interest-\nbearing debt + Current portion of long-term interest-bearing debt + Non-current portion of\nlong-term interest-bearing debt) / Total shareholders' equity], which results in an incorrect\nDebt-to-capital ratio.", "qhtml": null}, {"n": 80, "q": "According to the converged standards for revenue recognon, which of the following might\nindicate that a seller has transferred control of an asset to a buyer at a point in time? The\nseller has", "opts": ["legal title of the asset", "a present right to payment for the asset", "significant risks and rewards of ownership related to the asset"], "ans": "B", "expl": "A. Incorrect because the entity will recognize revenue when it is able to satisfy the performance\nobligation by transferring control to the customer. Factors to consider when assessing whether the\ncustomer has obtained control of an asset at a point in time involve whether the customer (not the\nentity/seller) has legal title.\nB. Correct because the entity (the seller) will recognize revenue when it is able to satisfy the\nperformance obligation by transferring control to the customer. Factors to consider when\nassessing whether the customer has obtained control of an asset at a point in time include\nwhether the entity has a present right to payment.\nC. Incorrect because the entity (the seller) will recognize revenue when it is able to satisfy the\nperformance obligation by transferring control to the customer. Factors to consider when\nassessing whether the customer has obtained control of an asset at a point in time involve\nwhether the customer (not the entity/seller) has the significant risks and rewards of ownership.", "qhtml": null}, {"n": 81, "q": "A company incurred research costs which were all expened in the current fiscal year for\nfinancial reporting purposes. Applicable tax laws require research costs to be expensed over a\n5 year period if taxable profit will be available against which the deductible temporary\ndifferences can be utilized, in the current fiscal year the company will most likely record", "opts": ["a deferred tax asset.", "a deferred tax liability", "neither a deferred tax asset nor a deferred tax liability."], "ans": "A", "expl": "A. Correct because the carrying amount is zero due to the full amount having been expensed\nfor financial accounting purposes, while the tax base of the asset was only reduced by one-fifth\nof the total cost in the first year. Additionally, taxable profit will be available against which the\ndeductible temporary differences can be utilized. As the asset's carrying amount is less than the\ntax base, it will result in a deferred tax asset.\nB. Incorrect because a deferred tax liability results when the asset's carrying amount is greater\nthan the tax base.\nC. Incorrect because the asset's carrying amount is less than the tax base, therefore it will result\nin a deferred tax asset.", "qhtml": null}, {"n": 82, "q": "All else being equal, the cash conversion cycle most likely shortens if", "opts": ["payables turnover decreases", "Inventory turnover decreases.", "days of sales outstanding increases."], "ans": "A", "expl": "A. Correct because the Cash conversion cycle = Days of Inventory on hand + Days of sales\noutstanding - Number of days of payables. If payables turnover were to decrease, it would\nincrease the Number of days of payables, thereby increasing the CCC.\nB. Incorrect because the Cash conversion cycle = Days of Inventory on hand + Days of sales\noutstanding - Number of days of payables. A decrease in inventory turnover would increase the\nDays of Inventory on hand, thereby increasing the cash conversion cycle.\nC. Incorrect because the Cash conversion cycle = Days of Inventory on hand + Days of sales\noutstanding - Number of days of payables. An increase in the Days of sales outstanding would\nincrease, not decrease, the cash conversion cycle.", "qhtml": null}, {"n": 83, "q": "On the statement of cash flows, interest payments may be classified as a financing cash\nflow under", "opts": ["IFRS only", "US GAAP only.", "both IFRS and US GAAP"], "ans": "A", "expl": "A. Correct because the cash paid for interest is included in operating cash flows under US GAAP\nand may be included in operating or financing cash flows under IFRS. US GAAP classifies interest\nexpense as an operating activity, even though the principal amount of the debt issued is\nclassified as a financing activity. IFRS allows companies to classify interest expense as either an\noperating activity or a financing activity.\nB. Incorrect because the cash paid for interest is included in operating cash flows under US\nGAAP.\nC. Incorrect because the cash paid for interest is included in operating cash flows under US\nGAAP and may be included in operating or financing cash flows under IFRS.", "qhtml": null}, {"n": 84, "q": "An analyst gathers The following information (in € thousands) about a company whose\nfiscal year ends on 31 December\nEarnings for the six months ended 30 June of Year 1 2,000\nEarnings for the year ended 31 December of Year 1 1,500\nEarnings for the six months ended 30 June of Year 2 2.200\nThe company's trailing 12 months (in € thousands) for the period ended 30 one of Year 2 is", "opts": ["1,700", "3,700", "4,200."], "ans": "A", "expl": "A. Correct because the company's trailing 12 months earnings for the period ended 30 June of\nYear 2 are calculated as (Earnings as of 31 December of Year 1 - Earnings as of 30 June of Year 1)\n+ Earnings as of 30 June of Year 2. It's (1,500 - 2,000) + 2,200 = 3,700.\nB. Incorrect because the provided explanation seems to be incorrect. The correct calculation for\nthe trailing 12 months earnings is not just the sum of Earnings as of 31 December of Year 1 and\nEarnings as of 30 June of Year 2. The correct formula should consider the earnings over the last\n12 months leading to 30 June of Year 2.\nC. Incorrect because the calculation method provided is incorrect. The trailing 12 months\nearnings should consider the cumulative earnings for the 12 months leading to the end of June\nof Year 2, not just the earnings at different intervals.", "qhtml": null}, {"n": 85, "q": "An analyst gathers the following information about three companies (In € millions)\nCompany 1 Company 2 Company 3\nTotal assets 100 200 400\nTotal debt 20 50 60\nTotal equity 80 150 320\nEarnings before interest and taxes (EBIT) 8 10 12\nInterest payments 4 4 4\nBased on this information, which company is most solvent?", "opts": ["Company 1", "Company 2", "Company 3"], "ans": "C", "expl": "A. Incorrect because even though Company 1 has the lowest leverage ratio among the three, it\nhas a lower interest coverage ratio compared to Company 3, indicating it might not be the most\nsolvent.\nB. Incorrect because Company 2 has higher leverage ratios than both Company 1 and Company\n3 and a lower interest coverage ratio than Company 3, indicating it may not be the most solvent.\nC. Correct because solvency refers to the ability to meet long-term debt obligations. It can be\nevaluated using leverage and coverage ratios. Typically, higher leverage ratios indicate higher\nfinancial risk and weaker solvency. Also, a higher interest coverage ratio suggests stronger\nsolvency. Comparing the information provided:\nCompany 1 Company 2 Company 3\nDebt to assets ratio 0.20 0.25 0.15\nDebt to equity ratio 0.25 0.33 0.23\nDebt to capital 0.20 0.25 0.20\nFinancial leverage ratio 1.25 1.33 1.25\nInterest coverage ratio 2.00 2.50 3.02\nAmong the three companies, Company 3 has the lowest debt proportionately\n(comparing debt ratios) and the highest interest coverage ratio, indicating it might be the\nmost solvent among the options provided. Therefore, the correct answer is C, Company\n3.", "qhtml": null}, {"n": 86, "q": "The carrying amount of an asset being higher than its tax base may be considered a", "opts": ["temporary difference resulting in a deferred tax asset", "permanent difference resulting in a deferred tax asset.", "temporary difference resulting in a deferred tax ability"], "ans": "C", "expl": "A. Incorrect because the carrying amount of an asset being higher than its tax base is\nconsidered to be a temporary difference that results in a deferred tax liability.\nB. Incorrect because the carrying amount of an asset being higher than its tax base is\nconsidered to be a temporary difference that results in a deferred tax liability.\nC. Correct because the carrying amount of an asset being higher than its tax base is considered\nto be a temporary difference that results in a deferred tax liability. Deferred tax liabilities arise\nwhen the carrying amount of an asset exceeds its tax base, leading to taxable amounts in future\nperiods when the temporary difference reverses. These differences affect accounting profit and\ntaxable income, resulting in deferred tax liabilities, which are recognized on the balance sheet.", "qhtml": null}, {"n": 87, "q": "A debt-to-equity of 1.0 most likely results in a debt-to-capital ratio of.", "opts": ["0.5", "1.0", "2.0"], "ans": "A", "expl": "A. Correct because the debt-to-equity ratio measures the proportion of debt used to finance a\ncompany's assets compared to the equity. A debt-to-equity ratio of 1.0 indicates an equal\namount of debt and equity. The debt-to-capital ratio calculates the proportion of debt financing\nin relation to the company's total capital. If the debt-to-equity ratio is 1.0, then the debt-to-\ncapital ratio would be 0.5.\nDebt-to-equity ratio = Total debt / Total shareholder's equity = 1.0 Debt-to-capital ratio = Total\ndebt / (Total debt + Total shareholder's equity) = 1.0 / (1.0 + 1.0) = 1.0 / 2.0 = 0.5\nB. Incorrect because it incorrectly equates the debt-to-equity ratio with the debt-to-capital ratio,\nstating they both are 1.0.\nC. Incorrect because it asserts that the debt-to-capital ratio is twice the debt-to-equity ratio.\nThis is inaccurate as the debt-to-capital ratio is not necessarily double the debt-to-equity ratio.", "qhtml": null}, {"n": 88, "q": "Which of the following financial statement disclosures concerning PP&E is required under\nUS GAAP?", "opts": ["The balances of major classes of depreciable assets", "The date of revaluation under the revaluation model", "A reconciliation of carrying amount at the beginning and end of the period"], "ans": "A", "expl": "A. Correct because the disclosure requirements under US GAAP regarding Property, Plant, and\nEquipment (PP&E) necessitate the disclosure of major classes of depreciable assets. Companies\nare mandated to reveal the balances of significant classes of depreciable assets, accumulated\ndepreciation by major asset classes, and a general description of the depreciation methods used\nfor computing depreciation expense related to those major classes of depreciable assets.\nB. Incorrect because the revaluation model is not permitted under US GAAP for reporting long-\nlived assets. This model is allowed under IFRS but not under US GAAP.\nC. Incorrect because while IFRS necessitates a reconciliation of the carrying amount at the\nbeginning and end of the period for each class of PP&E, under US GAAP, the disclosure\nrequirements are less exhaustive. US GAAP requires a disclosure of depreciation expense for the\nperiod, balances of major classes of depreciable assets, accumulated depreciation by major\nasset classes, and a general description of the depreciation methods used for computing\ndepreciation expense related to those major classes of depreciable assets. Thus, the\nreconciliation of the carrying amount at the beginning and end of the period is not specifically\nrequired under US GAAP for PP&E disclosures.", "qhtml": null}, {"n": 89, "q": "All else being equal, a company with older assets has a fixed asset turnover ratio that is", "opts": ["lower compared to a company with new assets", "the same compared to a company with newer assets", "higher compared to a company with newer assets"], "ans": "C", "expl": "A. Incorrect because the fixed asset turnover ratio would be higher for a company with newer\nassets (which are less depreciated and thus reflected in the financial statements at a higher\ncarrying value) compared to a company with older assets (which are more depreciated and thus\nreflected at a lower carrying value).\nB. Incorrect because the fixed asset turnover ratio would be higher for a company with newer\nassets (which are less depreciated and thus reflected in the financial statements at a higher\ncarrying value) compared to a company with older assets (which are more depreciated and thus\nreflected at a lower carrying value).\nC. Correct because the fixed asset turnover ratio would be higher for a company with newer\nassets (which are less depreciated and thus reflected in the financial statements at a higher\ncarrying value) compared to a company with older assets (which are more depreciated and thus\nreflected at a lower carrying value).", "qhtml": null}, {"n": 90, "q": "An analyst gathers the following Information (in thousands) about a manufacturing\ncompens\nYear 2 Year 1\nAverage total assets 500 450\nAverage total liabilities 400 330\nAverage total shareholders’ equity 100 120\nEBIT 35 40\nInterest payments 6 8\nBased only on this information, which of the following ratios(s) may indicate improved\nsolvency from Year 1 to Year 2?", "opts": ["Interest coverage ratio only", "Financial leverage ratio only", "Both interest coverage ratio and financial leverage ratio"], "ans": "A", "expl": "A. Correct because the interest coverage ratio measures the number of times a company's EBIT\ncould cover its interest payments. A higher interest coverage ratio indicates stronger solvency,\noffering greater assurance that the company can service its debt from operating earnings.\nAccordingly, the Interest Coverage Ratio for Year 1 is 40/8 = 5 and for Year 2 is 35/6 = 5.83,\nwhich shows an increase in the interest coverage ratio from Year 1 to Year 2, indicating\nimproved solvency.\nB. Incorrect because the financial leverage ratio, which measures the proportion of total assets\nfinanced by equity, has increased from Year 1 (Financial Leverage Ratio: 450/120 = 3.75) to Year\n2 (Financial Leverage Ratio: 500/100 = 5), implying higher leverage and weaker solvency.\nC. Incorrect because while the interest coverage ratio has improved (indicating better solvency),\nthe financial leverage ratio has increased, signaling higher leverage and weaker solvency.\nTherefore, both ratios do not indicate improved solvency from Year 1 to Year 2.", "qhtml": null}, {"n": 91, "q": "If a company sell PP&E with a carrying amount of €75,000 and reported a gain of €2,000\ncash flow from investing activities", "opts": ["€0", "€73,000", "€77.000"], "ans": "C", "expl": "A. Incorrect because it assumes the cash proceeds from the sale of PP&E went towards emmer\ncash flow from operating or cash whom financing, and not cash flow From investing.\nB. Incorrect because it incorrectly subtracts the gain from the carrying amount to calculate the\nsales proceeds. Thes sales proceeds = carrying amount-gain on sale = 75-2 = 73.\nC. Correct because the gain or loss on the sale of long-livec assets is computed as the sales\nproceeds minus the carrying amount of the asset at the time of sale. An asset's carrying amount\nis typically the net book value e The historical cost minus accumulated depreciation), unless the\nassets carrying amount has been changed to reflect imparentador revaluation, as previously\ndiscussed Ignoring taxes, the cash low from the sale would appear as a cash inflow from\ninvesting Thus gain on sale of long lived asset sales proceeds-carrying semount. Rearranging,\nsales proceeds gan ce sale of long lived asset + carrying amount -2+75-77.", "qhtml": null}, {"n": 92, "q": "A company acquires a 5-year t license for product it plans to continue selling for the\nforeseeable future. The license can be renewed at minimal cost. The license should be.", "opts": ["carried on the balance sheet at historical cost.", "amortised using the straight-line method over its estimated useful life", "amortised using the units of production method over its estimated useful life"], "ans": "A", "expl": "A. Correct because the license has an indefinite tre and is not amortised Only those intangible\nassets assumed to have file useful lives are amortised over then uselu Ives, following the pallen\nin which the benefits are used up. Examples of Intangible assets with indefinite useful lives\ninclude an acquired license that, although it has a specific expiration date, can be renewed at\nlittle or no cost and an acquired trademark that, although it has a specific expiration, can be\nrenewed at a minimal cost and relates to a product that a company plans to continue selling for\nthe foreseeable finire Intangible assets with indefinite lives are not amortised Instead, they are\ncamed on the balance sheet at historical cost but are tested at least annualy for impairment.\nB. Incorrect because the license has an indelene and is therefore not amcised. Intangible assets\nwill dele lives am not amortised instead they am camos on the balance shoot at historical cast\nhur am tested at least annually for impairment.\nC. Incorrect because the license has an indennite line and is therefore not amortised. Intangible\nassets will deinte Ives are not amortised. Instead, they are camed on the balance sheet at\nhistorical cost but are tested at least annually for impairment.", "qhtml": null}, {"n": 93, "q": "An analyst gathers the following information (in € thousands) about a company's sale of\nequipment.\nSelling price 58\nHistorical cost 50\nAccumulated depreciation 5\nThe gain on the sale (in € thousands) is", "opts": ["3.", "8.", "13."], "ans": "C", "expl": "A. Incorrect because it calculates the carrying amount of the equipment-historical cost+\naccumulated depreciation -50+5-55. Consequently, the gain on the sale setting price-carrying\namount-55-55-3\nB. Incorrect because il calculates the gem on the sale setting price-historical cust-56-50-0.\nC. Correct because the gain or loss on the sale of long livec assets is computed as the sales\nproceeds minus the carrying amount of the asset at the time of sale. An asset's carrying amount\nis typically the net book value (Le.. the historical cost minus accumulated depreciation). The\ncarrying amount of the equipment - historical cost- accumulated depreciation-50-5-65, and the\ngain on the sale-selling prion-canying amount-58-45-13", "qhtml": null}, {"n": 94, "q": "An analyst gathers the following information (in € thousands) about a manufacturing\ncompany's inventory.\nCost of ending Inventory 750\nEstimated selling price in the ordinary course of business: 1,100\nEstimated costs necessary to sell the inventory 50\nEstimated costs to get the inventory in condition for sale 50\nThe net realizable value of the inventory (in € thousands) is", "opts": ["750", "850", "1,000."], "ans": "C", "expl": "A. toneret nec it is the carrying amount of the inventory, being Mingos Net rezate value)\nMin(750 1100-50-501-0 (which is also equal to the cost of the inventory) RS state that centres\nsal be measured (and carried on the balance sheet) at the lower of cost and nes realizable\nvalue. While the nec realizable value is the estimated selling price in the ordinary course of\nbusiness less the estimated costs necessary to make the sale and estimated cons to get the\ninventory in condition for sale\nB. Incorrect because if calculates Net realizable value-Cost of inventory+ Estimated ccals\nnecessary to make the sale Estimated costs to get the inventory in condition for sale; or 760-60-\n50-650.\nC. Correct because the net realizable value is the estimated selling price in the ordinary course of\nbusiness less the estimated costs conessary in make the san and estimated costs to get the\ninventory condition for save Accordingly, the net realizable value 1,100-50-50-1200", "qhtml": null}, {"n": 95, "q": "Which of the following is most likely a measure of a company's ability to meet its short-\nterm obligations?", "opts": ["Quick ratio", "Operating profit margin", "Days of payables outstanding"], "ans": "A", "expl": "A. Correct because the quick ratio is a liquidity ratio which measures a company's ability to meet\nits short-term obligations.\nB. Incorrect because the operating profit margin is a profitably ratio which measures a\ncompany's ability to generate profits from its resources (assets).\nC. Incorrect because days of payables outstanding is an activity ratio which measures how\nefficiently a company performs day-to-day tasks, such as the collection of receivables and\nmanagement of inventory", "qhtml": null}, {"n": 96, "q": "An analyst gathers the following information (in thousands) about a company's current\nassets and liabilities:\nCash and equivalents 800\nShort-term marketable securities 500\nInventory 700\nAccounts receivable 2.000\nCurrent liabilities 10.000\nThe company's quick ratio is", "opts": ["0.13.", "0.33.", "0.40."], "ans": "B", "expl": "A. Incorrect because it is the Cash ratio. The Cash ratio (Cash and equivalents + Short-term\nmarketable secunes)/Cumen bones. The calculation is (000+ 5000/10.000-1,300/10,000 -0.13 or\n13%\nB. Correct because the Quick ratio (Cash and equivalents Short term marketable securities\nReceivables)/ Current liabilities. The calculation is (800+500 2,000)/10,000 = 3,300/10.000 = 0\n33, or 33%.\nC. Incorrect because it is the Current ratio. The Current rato-Current assets/Current liabilities,\nthe calculation is (800 + 500+ 700 + 2000) 10,000-01, nr 40%", "qhtml": null}, {"n": 97, "q": "An analyst gathers the following Information (in millions) about a company!\nTotal assets 400\nTotal liabilities 200\nTotal debt 100\nTotal equity 200\nThe total debt ratio is:", "opts": ["0.25", "0.50.", "2.00."], "ans": "A", "expl": "A. Correct because the total debt ratio = total debt/total assets = 100/400 = 0.25.\nB. Incorrect because it calculates the debt-to-equity ratio = total debt / total equity = 100 / 200\n= 0.50. This ratio may also be incorrectly calculated by dividing total liabilities by total assets\n(200 / 400 = 0.50).\nC. Incorrect because it calculates the financial leverage ratio = total assets / total equity = 400 /\n200 = 2.00.", "qhtml": null}, {"n": 98, "q": "For a mature company. The primary source of cash flows is most likely from", "opts": ["operating activities", "investing activities", "financing activities"], "ans": "A", "expl": "A. Correct because the major sources of cash for a company can vary with its stage of growth.\nFor a mature company, it is expected and desirable that operating activities are the primary\nsource of cashflow. Over the long term, a company must generate cash from its operating\nactivities. If operating cash flow were consistently negative, a company would need to borrow\nmoney or issue stock (financing activities) to fund the shortfall. Eventually, these providers of\ncapital need to be repaid from operations, or they will no longer be willing to provide capital.\nB. Incorrect because for a mature company, it is expected and desirable that operating activities\nare the primary source of cash flows. Cash generated from operating activities can be used in\nother investing or financing opportunities or other business ventures if the company has good\nopportunities to invest.\nC. Incorrect because for a mature company, it is expected and desirable that operating activities\nare the primary source of cash flows. Cash generated from operating activities can be used in\neither investing or financing activities if the company does not have profitable investment\nopportunities. Alternatively, the cash should be returned to shareholders or debt providers as\npart of financing activities.", "qhtml": null}, {"n": 99, "q": "A company entered into a 5 year construction contract with a total sales price of\n€3.000.000. The estimated total costs are €2,000,000 and the company incurred €500,000\nactual costs in the first year. The company has extensive experience with similar types of\ncontracts. Costs incurred provide an appropriate measure of progress toward completing the\ncontract. Assuming it is highly probable that revenue will not be subsequently reversed,\nrevenue recognized under the contract in Year 1 is most likely", "opts": ["€500,000.", "€600,000.", "€750,000"], "ans": "C", "expl": "A. Incorrect because it assumes only the incurred actual costs as being recognized as revenue -\n€0.5 million. The standard states that for performance obligations satisfied over time (e.g.,\nwhere there is a long-term contract), revenue is recognized over time by measuring progress\ntoward satisfying the obligation.\nB. Incorrect because it assumes that revenue is only recognized according to the same elapsed\ntime. However, the standard refers to performance obligations satisfied over time and requires\nthat progress toward complete satisfaction of the performance obligation be measured based\non an input method, such as the one illustrated here (recognizing revenue based on the\nproportion of total costs that have been incurred in the period) or an output method\n(recognizing revenue based on units produced or milestones achieved). Accordingly, the\ncalculation becomes €500,000 (costs incurred in Year 1) / €2,000,000 (total estimated costs) *\n€3,000,000 (total contract value) = €750,000.\nC. Correct because the standard states that for performance obligations satisfied over time (e.g.,\nwhere there is a long-term contract), revenue is recognized over time by measuring progress\ntoward satisfying the obligation. The standard refers to performance obligations satisfied over\ntime and requires that progress toward complete satisfaction of the performance obligation be\nmeasured based on an input method, such as the one illustrated here (recognizing revenue\nbased on the proportion of total costs that have been incurred in the period) or an output\nmethod (recognizing revenue based on units produced or milestones achieved). Accordingly, the\ncompany has incurred 25% of the total expected costs (€500,000 / €2,000,000) and will thus\nrecognize 25% of €3,000,000 (€750,000) as revenue in Year 1.", "qhtml": null}, {"n": 100, "q": "Which of the following could motivate a lessee to lease a high-value, long-lived asset\nrather than to purchase Lease contracts", "opts": ["usually require little, if any, down payment", "are reported as off-balance sheet financing structures", "do not require the recognition of a liability on the balance sheet."], "ans": "A", "expl": "A. Correct because there are several advantages to leasing an asset compared with purchasing.\nLeases typically require little or no down payment upfront.\nB. Incorrect because under IFRS, there is a single accounting model for both finance and\noperating leases. At lease inception, the lessee records a lease liability and a right-of-use (ROU)\nasset on its balance sheet, both equal to the present value of future lease payments. For\nlessees, there are lease accounting exemptions for certain lease contracts if the term is 12\nmonths or less (IFRS and US GAAP) or if it is for a low-value asset, up to $5,000 in sales price\n(IFRS only), whereas lessees can elect to recognize the lease payments as expenses on a\nstraight-line basis.\nC. Incorrect because under IFRS, there is a single accounting model for both finance and\noperating leases for lessees. At lease inception, the lessee records a lease liability and a right-of-\nuse (ROU) asset on its balance sheet, both equal to the present value of future lease payments.", "qhtml": null}, {"n": 101, "q": "An analyst gathers the following information (in millions) about a company:\nOther operating exposes 4,500\nDecrease in prepaid expenses 200\nIncrease in other accrued liabilities 300\nCash paid for other operating expenses (in € millions) is:", "opts": ["4,000.", "4,400.", "4,600"], "ans": "A", "expl": "A. Correct because to determine the cash paid for other operating expenses, it is necessary to\nadjust the other operating expenses amount on the income statement by the net changes in\nprepaid expenses and accrued expense liabilities for the year. Accordingly, Cash paid for other\noperating expenses = Other operating expenses - Decrease in prepaid expenses - Increase in\nother accrued liabilities = 4,500 - 200 - 300 = 4,000.\nB. Incorrect because it added the decrease in prepaid expenses instead of subtracting it. 4,500 +\n200 - 300 = 4,400.\nC. Incorrect because it added the increase in accrued liabilities instead of subtracting it. 4,500 -\n200 + 300 = 4,600.", "qhtml": null}, {"n": 102, "q": "An analyst gathers the following information (in thousands) acut a company's equipment\nPurchase price of the equipment 1,000\nAccumulated depreciation 250\nGain on sale of the equipment 400\nIgnoring taxes, proceeds from sale of the equipment (in € thousands) is", "opts": ["750", "1,150", "1,400."], "ans": "B", "expl": "A. Incorrect because it calculated the carrying amount of the equipment (purchase price of the\nequipment - accumulated depreciation) = 1,000 - 250 = 750.\nB. Correct because the gain or loss on the sale of long-lived assets is computed as the sales\nproceeds minus the carrying amount of the asset at the time of sale. The calculation should be\nCash flow from the sale of the equipment = Sale proceeds - Carrying amount of the equipment\n+ Gain on sale of the equipment = (1,000 - 250) + 400 = 1,150.\nC. Incorrect because it calculated the cash flow from the sale of equipment (purchase price of\nthe equipment + gain on sale of the equipment) = 1,000 + 400 = 1,400.", "qhtml": null}, {"n": 103, "q": "For a company reporting on a calendar year basis. The receipt of a payment from a client\nin Year 1 for the delivery of services in Year 2 most likely increases", "opts": ["net income for Year 1", "liabilities as of 31 December of Year 1.", "cash flow from operating activities for Year 2."], "ans": "B", "expl": "A. Incorrect because the transaction will not increase net income for the current year since\ndelivery of services does not happen in the current year. No revenue is recognized in the current\nyear for services to be delivered in the following year.\nB. Correct because a payment received in advance is recorded as a liability for unearned\nrevenue when the cash is initially received, and revenue will be recognized over time as\nproducts and services are delivered.\nC. Incorrect because the cash flow will be recognized in the current year even though the\nrevenue will not be recognized until the following year. The receipt of cash in the current year\nwill increase cash flow from operating activities in the current year rather than the following\nyear.", "qhtml": null}, {"n": 104, "q": "An analyst gathers the following Information (in € millions) about a manufacturing\ncompany's land reported under the revaluation model\nPurchase price and fair value on 1 January Year 23\nFair value at initial revaluation on 31 December Year 1 25\nAll elsebeing equ
