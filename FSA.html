ng tài sản giảm.\nB. Đúng vì việc đánh giá lại tăng lên làm tăng giá trị tài sản cố định khiến tổng giá trị tài sản\ntăng lên. Tổng tài sản ở mẫu số tăng trong khi tử số (doanh thu thuần)\ngiữ nguyên. Điều này dẫn đến vòng quay tổng tài sản cao hơn.\nC. Không chính xác vì việc đánh giá lại tăng lên làm tăng giá trị tài sản cố định, do đó\ntăng mẫu số (tổng tài sản) nhưng tổng nợ vẫn không thay đổi ở\ntử số. Điều này dẫn đến tỷ lệ nợ trên tài sản giảm.","qhtml":null},{"n":105,"q":"On the statement of cash flows cash dividends paid may be classified as an operating\nactivity under","opts":["IFRS only","US GAAP only.","Both IFRS and US GAAP"],"ans":"A","expl":"A. Đúng vì GAAP của Hoa Kỳ phân loại cổ tức trả cho cổ đông là hoạt động tài chính,\ntrong khi IFRS cho phép các công ty phân loại cổ tức được trả là hoạt động điều hành hoặc\nhoạt động tài chính.\nB. Không chính xác vì GAAP của Hoa Kỳ phân loại cổ tức trả cho cổ đông là hoạt động tài chính,\ntrong khi IFRS cho phép các công ty phân loại cổ tức được trả là hoạt động điều hành hoặc\nhoạt động tài chính.\nC. Không chính xác vì GAAP của Hoa Kỳ phân loại cổ tức trả cho cổ đông là hoạt động tài chính,\ntrong khi IFRS cho phép các công ty phân loại cổ tức được trả là hoạt động điều hành hoặc\nhoạt động tài chính.","qhtml":null},{"n":106,"q":"According to the converged accounting standards for reverse recognition, which of the\nfollowing is the first of five steps in recognizing revenue?","opts":["Determine the transaction price","Identify the contract with the customer","Identify the distinct performance obligations in the contract"],"ans":"B","expl":"A. Không chính xác vì đây là bước thứ ba trong năm bước ghi nhận doanh thu theo\nchuẩn mực kế toán tổng hợp để ghi nhận doanh thu.\nB. Đúng vì đây là bước đầu tiên trong năm bước ghi nhận doanh thu theo\nchuẩn mực kế toán tổng hợp để ghi nhận doanh thu. [Chuẩn mực kế toán tổng hợp\nđể ghi nhận doanh thu] mô tả việc áp dụng năm bước để ghi nhận doanh thu:\n1. Xác định (các) hợp đồng với khách hàng\n2. Xác định các nghĩa vụ thực hiện riêng biệt hoặc riêng biệt trong hợp đồng\n3. Xác định giá giao dịch\n4. Phân bổ giá giao dịch cho các nghĩa vụ thực hiện trong hợp đồng\n5. Ghi nhận doanh thu khi (hoặc với tư cách) đơn vị đáp ứng nghĩa vụ thực hiện.\nC. Không chính xác vì đây là bước thứ hai trong năm bước ghi nhận doanh thu theo\nchuẩn mực kế toán tổng hợp để ghi nhận doanh thu.","qhtml":null},{"n":107,"q":"The financial leverage ratio may be calculated as:","opts":["EBIT divided by interest payments.","total debt divided by total shareholders equity.","average total assets divided by average shareholders' equity"],"ans":"C","expl":"A. Không chính xác vì số liệu này cho biết số lần EBIT của công ty có thể chi trả cho các khoản thanh toán lãi\n. Tỷ lệ thanh toán cao hơn đảm bảo rằng công ty có thể trả nợ\ntừ thu nhập hoạt động.\nB. Không chính xác vì điều này xác định tỷ lệ nợ trên vốn chủ sở hữu (thay vì tỷ lệ đòn bẩy tài chính\n). Tỷ lệ nợ trên vốn chủ sở hữu đo lường lượng tài trợ bằng nợ so với tài trợ bằng vốn chủ sở hữu\n. Tỷ lệ nợ trên vốn hoặc nợ trên vốn chủ sở hữu cao hơn hàm ý khả năng thanh toán yếu hơn.\nC. Đúng vì điều này xác định tỷ lệ đòn bẩy tài chính. Tỷ lệ đòn bẩy tài chính (còn được gọi là\nđược gọi là tỷ lệ đòn bẩy hoặc hệ số nhân vốn chủ sở hữu) đo lường sự hỗ trợ tài chính được cung cấp bởi\nmột đơn vị tiền vốn chủ sở hữu. Tỷ lệ đòn bẩy tài chính càng cao, công ty\ncó đòn bẩy tài chính càng cao theo nghĩa sử dụng nợ và các khoản nợ khác để tài trợ cho tài sản. Tỷ lệ này thường\nđược tính bằng cách sử dụng tổng tài sản trung bình và tổng vốn chủ sở hữu trung bình và đóng một vai trò quan trọng trong\nsự phân tách lợi nhuận trên vốn chủ sở hữu của DuPont.","qhtml":null},{"n":108,"q":"Which of the following is defined as how long a company can continue to pay as daily\ncash expenditures from its existing liquid assets without receiving additional cash inflow?","opts":["Cash conversion cycle","Defensive interval ratio","Fixed charge coverage"],"ans":"B","expl":"A. Không chính xác vì số liệu này cho biết khoảng thời gian trôi qua kể từ thời điểm\nmột công ty đầu tư vào vốn lưu động cho đến thời điểm công ty thu được tiền mặt.\nDo đó, chu kỳ chuyển đổi tiền mặt không cho biết mức độ mà\ntài sản lưu động của công ty có thể trang trải chi tiêu tiền mặt hàng ngày.\nB. Đúng vì tỷ lệ này đo lường thời gian công ty có thể tiếp tục thanh toán các chi phí\ntừ tài sản lưu động hiện có mà không nhận thêm bất kỳ dòng tiền vào nào.\nC. Không chính xác vì thước đo này tập trung vào mức độ mà thu nhập của công ty có thể\ntrang trải các khoản phí cố định. Tỷ lệ này liên quan đến các khoản phí hoặc nghĩa vụ cố định đối với dòng tiền\ndo công ty tạo ra. Nó đo lường số lần thu nhập của một công ty (trước lãi vay, thuế,\nvà các khoản thanh toán tiền thuê) có thể trang trải các khoản thanh toán tiền lãi và tiền thuê của công ty.","qhtml":null},{"n":109,"q":"Accounting goodwill arising from acquisitions is","opts":["expensed in the period it arises","capitalized and amortized over a finite period.","capitalized and tested for impairment annually"],"ans":"C","expl":"A. Không chính xác vì theo cả IFRS và US GAAP, lợi thế thương mại kế toán phát sinh từ\ncác giao dịch mua lại đều được vốn hóa.\nB. Không chính xác vì theo cả IFRS và US GAAP, lợi thế thương mại kế toán phát sinh từ\nmua lại đều được vốn hóa. Lợi thế thương mại không được khấu hao nhưng được kiểm tra mức độ suy giảm hàng năm. Nếu\nlợi thế thương mại được coi là bị suy giảm thì khoản lỗ do suy giảm giá trị sẽ được tính vào thu nhập trong kỳ\nhiện tại.\nC. Đúng vì theo cả IFRS và US GAAP, lợi thế thương mại kế toán phát sinh từ việc mua lại\nđược vốn hóa. Lợi thế thương mại không được khấu hao nhưng được kiểm tra mức độ suy giảm hàng năm. Nếu lợi thế thương mại\nđược coi là bị suy giảm thì khoản lỗ do suy giảm giá trị sẽ được tính vào thu nhập trong kỳ hiện tại.","qhtml":null},{"n":110,"q":"An analyst gathers the following Information (in millions) about a company:\nNet cash flow from operating activities (750)\nTotal cash inflows 1,500\nTotal cash outflows 2,500\nNet increase (decrease) in cash (1.000)\nOn a common-sze statement of cash flows presented using the indirect method, net\noperating cash flow is:","opts":["30%","50%","75%"],"ans":"A","expl":"A. Đúng vì khi báo cáo lưu chuyển tiền tệ được trình bày bằng phương pháp gián tiếp,\ndòng tiền từ hoạt động kinh doanh và dòng tiền ra không được trình bày riêng biệt; do đó, báo cáo lưu chuyển tiền tệ\nquy mô chung chỉ hiển thị dòng tiền hoạt động ròng (tiền ròng được cung cấp hoặc sử dụng trong\nhoạt động điều hành) dưới dạng phần trăm của tổng dòng tiền vào hoặc dòng tiền chi, tùy thuộc vào việc số tiền\nròng là dòng tiền vào hay dòng tiền ra. Bởi vì số tiền ròng là một dòng tiền chi ra nên nó phải được\ntính theo phần trăm của tổng dòng tiền chi ra như sau: 750/2500=30%\nB. Không chính xác vì khi báo cáo lưu chuyển tiền tệ được trình bày bằng phương pháp\ngián tiếp, dòng tiền vào và dòng tiền ra từ hoạt động kinh doanh không được trình bày riêng biệt; do đó,\nbáo cáo lưu chuyển tiền tệ cỡ chung chỉ hiển thị dòng tiền ròng từ hoạt động kinh doanh (tiền ròng được cung cấp bởi\nhoặc được sử dụng trong hoạt động điều hành) dưới dạng phần trăm của tổng dòng tiền vào hoặc dòng tiền ra, tùy thuộc vào\nliệu số tiền ròng là dòng tiền vào hay dòng tiền ra. Vì số tiền ròng là một dòng tiền chi ra nên nó\nphải được tính theo tỷ lệ phần trăm của tổng dòng tiền chi ra như sau: 750/2500=30%.\ncâu trả lời sai có được bằng cách chia tiền ròng được sử dụng trong hoạt động cho tổng dòng tiền vào:\n750/1500=50%\nC. Không chính xác vì khi báo cáo lưu chuyển tiền tệ được trình bày bằng phương pháp\ngián tiếp, dòng tiền vào và dòng tiền ra từ hoạt động kinh doanh không được trình bày riêng biệt; do đó,\nbáo cáo lưu chuyển tiền tệ cỡ chung chỉ hiển thị dòng tiền ròng từ hoạt động kinh doanh (tiền ròng được cung cấp bởi\nhoặc được sử dụng trong hoạt động điều hành) dưới dạng phần trăm của tổng dòng tiền vào hoặc dòng tiền ra, tùy thuộc vào\nliệu số tiền ròng là dòng tiền vào hay dòng tiền ra. Vì số tiền ròng là một dòng tiền chi ra nên nó\nphải được tính theo tỷ lệ phần trăm của tổng dòng tiền chi ra như sau: 750/2500=30%.\ncâu trả lời sai có được bằng cách chia tiền mặt ròng được sử dụng trong hoạt động cho mức giảm ròng về tiền mặt:\n750/1000=75%","qhtml":null},{"n":111,"q":"A company establishes a plan dispose of one of its material lines of business and will\nhave no further involvement in its operation. The income statement most likely reports the\nresults of this line of business as","opts":["discontinued operations","unusual or infrequent items","continuing operations unit the actual sale is performed."],"ans":"A","expl":"A. Đúng vì khi một công ty thanh lý hoặc thiết lập kế hoạch thanh lý một trong các\nhoạt động thành phần của mình và sẽ không tham gia thêm vào hoạt động đó nữa, báo cáo thu nhập\nsẽ báo cáo riêng tác động của việc thanh lý này dưới dạng hoạt động \"ngưng\" theo\ncả IFRS và US GAAP. Các tiêu chuẩn tài chính cung cấp nhiều tiêu chí khác nhau để báo cáo tác động\nriêng biệt, nói chung là thành phần đã ngừng sử dụng phải có thể tách biệt được cả\nvề mặt vật lý và hoạt động.\nB. Không chính xác vì các khoản thu nhập hoặc chi phí quan trọng và/hoặc liên quan đến\nhiểu biết về hiệu quả tài chính của đơn vị phải được trình bày riêng theo IFRS.\nCác khoản mục bất thường hoặc không thường xuyên có thể đáp ứng các tiêu chí này, ví dụ: phí tái cơ cấu hoặc\nlãi/lỗ phát sinh từ việc bán tài sản, nhưng chúng được coi là một phần của hoạt động thông thường.\nC. Không chính xác vì cả IFRS và US GAAP đều chỉ định rằng kết quả của các hoạt động bị ngừng\nphải được báo cáo riêng biệt với các hoạt động tiếp tục.","qhtml":null},{"n":112,"q":"An analyst gathers the following information (in € thousands) about a company's\nequipment reported under the cost model\nCarrying amount before impairment 2,000\nUndiscounted expected future cash flows 1,800\nFair value 1,700\nValue in use 1.500\nCosts to sell 50\nThe impairment loss (in € thousands) is","opts":["300","350.","500"],"ans":"B","expl":"A. Không chính xác vì nó không phản ánh cách tính chính xác về tổn thất do suy giảm giá trị theo mô hình chi phí\n. Khoản lỗ suy giảm giá trị theo mô hình chi phí được ghi nhận khi giá trị ghi sổ\ncủa một tài sản vượt quá giá trị có thể thu hồi của nó. Giá trị có thể thu hồi là giá trị cao hơn giữa giá trị hợp lý\ntrừ chi phí bán và giá trị sử dụng. Trong trường hợp này, số tiền có thể thu hồi sẽ là €1.700 (Giá trị\nhợp lý - Chi phí bán). Do đó, khoản lỗ do suy giảm giá trị là €300 (Giá trị ghi sổ - Số tiền\ncó thể phục hồi = €2.000 - €1.700).\nB. Đúng vì Theo ISA 36, khoản lỗ do suy giảm giá trị được đo bằng phần chênh lệch giữa giá trị ghi sổ so với\ngiá trị có thể thu hồi của tài sản. Giá trị có thể thu hồi của một tài sản được xác định là\ngiá trị hợp lý cao hơn của nó trừ đi chi phí bán và giá trị sử dụng của nó. Giá trị sử dụng là thước đo chiết khấu\ncủa dòng tiền dự kiến ​​trong tương lai. Vì số tiền có thể thu hồi = MAX (Giá trị hợp lý trừ đi chi phí bán,\ngiá trị đang sử dụng) = MAX [(1700 – 50); 1500] = 1650, tổn thất do suy giảm giá trị = giá trị còn lại –\ngiá trị có thể thu hồi = 2000 – 1650 = 350\nC. Không chính xác vì nó tính toán số tiền có thể thu hồi là giá trị thấp hơn của giá trị hợp lý trừ đi chi phí\nđể bán và giá trị sử dụng của nó. Theo đó, số tiền có thể thu hồi = MIN(Giá trị hợp lý trừ đi chi phí\nbán, giá trị sử dụng) = MIN [(1700 – 50); 1500] = 1500, tổn thất do suy giảm giá trị = giá trị còn lại –\ngiá trị có thể thu hồi = 2000 – 1500 = 500","qhtml":null},{"n":113,"q":"An analyst gathers the following information about PP&E that is abandoned and\naccumulated for using the cost model\nCarrying value €10 million\nFair value at time of abandonment €1 million\nAssuming no impairment, the abandonment of PP&E on the financial statements will result in\na:","opts":["decrease of €10 million in PP&E.","loss of €1 million on the income statement","decrease of €1 million on the cash flow statement."],"ans":"A","expl":"A. Đúng vì khi một tài sản bị loại bỏ hoặc bị bỏ rơi, việc hạch toán tương tự như việc bán tài sản,\nngoại trừ việc công ty không ghi lại số tiền thu được. Tài sản bị giảm đi theo giá trị còn lại của tài sản\ntại thời điểm nghỉ hưu hoặc bị từ bỏ và khoản lỗ bằng với giá trị còn lại của tài sản\nđược ghi nhận. Giá trị ghi sổ của tài sản là 10 tại thời điểm\nbỏ rơi. Do đó, giá trị ghi sổ của tài sản sẽ giảm xuống 0, dẫn đến mất\n10 trên báo cáo kết quả hoạt động kinh doanh và sẽ không có tác động về mặt tiền mặt đối với báo cáo lưu chuyển tiền tệ\nB. Không chính xác vì nó tính khoản lỗ 1 trên báo cáo thu nhập bằng cách sử dụng giá trị hợp lý tại\nthời điểm từ bỏ. Điều này không chính xác do áp dụng mô hình chi phí.\nC. Không chính xác vì lẽ ra không có tác động của tiền mặt lên báo cáo lưu chuyển tiền tệ. Tuy nhiên, việc\ngiảm 1 trên báo cáo lưu chuyển tiền tệ là do ghi nhận không chính xác giá trị hợp lý 1\ntại thời điểm từ bỏ","qhtml":null},{"n":114,"q":"An analyst gathers the following information about a company.\nROE 15%\nInterest burden 0.85\nEBIT margin 30%\nTotal asset turnover 1.1\nFinancial leverage 1.25\nThe average tax rate is closest to","opts":["43%","47%","57%"],"ans":"C","expl":"A. Không chính xác vì phép tính dường như đã tính toán gánh nặng thuế (khoảng\n42,78%) thay vì mức thuế suất trung bình. Gánh nặng thuế bằng 1 trừ đi thuế suất trung bình,\ncho biết công ty giữ lại bao nhiêu lợi nhuận trước thuế.\nB. Không chính xác vì có vẻ như nó đã nhầm lẫn Tỷ suất lợi nhuận trên vốn chủ sở hữu (ROE) với Tỷ suất lợi nhuận trên tài sản\n(ROA) trong phép tính. ROE có thể được phân tích thông qua công thức phân tích DuPont: ROE = Thuế\nGánh nặng × ​​Gánh nặng lãi vay × Biên EBIT × Tổng doanh thu tài sản × Đòn bẩy tài chính. Với\ncác giá trị đã cho, gánh nặng thuế ước tính là khoảng 53,48%, do đó thuế suất trung bình\nsẽ là khoảng 47%.\nC. Đúng vì phép tính dường như sử dụng công thức phân tích DuPont: ROE = Thuế\nGánh nặng × ​​Gánh nặng lãi vay × Biên EBIT × Tổng doanh thu tài sản × Đòn bẩy tài chính. Việc sử dụng\ncông thức này với các giá trị được cung cấp sẽ mang lại gánh nặng thuế ước tính khoảng 42,78%. Gánh nặng thuế\nphản ánh mức thuế suất trung bình trừ đi hoặc mức lợi nhuận trước thuế của một công ty\nphải giữ lại. Như vậy thuế suất trung bình = 1 – Gánh nặng thuế = 57,22% ~ 57%","qhtml":null},{"n":115,"q":"Which of the following disclosures as required for each class of PP&E carried under the\ncost model?","opts":["Remaining useful life","Gross carrying amount","Fair value and details of how it was obtained"],"ans":"B","expl":"A. Không chính xác vì nó đề cập đến \"thời gian sử dụng ước tính\" thay vì \"thời gian sử dụng còn lại\" của lớp\n, theo yêu cầu. Theo IFRS, đối với mỗi loại tài sản, nhà xưởng và thiết bị, công ty phải\ntiết lộ thời gian sử dụng hữu ích còn lại (hoặc chỉ thời gian sử dụng hữu ích).\nB. Đúng vì đối với mỗi loại tài sản, nhà xưởng và thiết bị theo mô hình chi phí\n, một công ty phải tiết lộ nhiều chi tiết khác nhau như cơ sở đo lường, phương pháp khấu hao\n, thời gian sử dụng hữu ích, tỷ lệ khấu hao đã sử dụng, tổng giá trị còn lại, khấu hao lũy kế\nở đầu và cuối kỳ, đối chiếu giá trị ghi sổ vào đầu và cuối kỳ\nvà các tiết lộ bổ sung như hạn chế về quyền sở hữu, quyền lưu giữ tài sản và\nthỏa thuận hợp đồng.\nC. Không chính xác vì việc tiết lộ chi tiết về cách thu được giá trị hợp lý là cần thiết đối với\ncác loại PP&E theo mô hình đánh giá lại chứ không phải mô hình chi phí. Theo IFRS, nếu áp dụng mô hình\nđánh giá lại, các yêu cầu công bố thông tin bao gồm ngày đánh giá lại, chi tiết về việc xác định\ngiá trị hợp lý, giá trị ghi sổ theo mô hình chi phí và thặng dư đánh giá lại.","qhtml":null},{"n":116,"q":"Which of the following components of change in the net pension asset or liability of a\ndefined-beneft pension plan is recognized in other comprehensive income?","opts":["Employees' service costs","Actuarial gains and losses","Net interest expense of income accrued on the beginning net pension asset or liability"],"ans":"B","expl":"A. Không chính xác vì nó được ghi nhận trong lãi và lỗ thay vì thu nhập toàn diện khác.\nTheo IFRS, sự thay đổi trong tài sản hoặc nợ lương hưu ròng mỗi kỳ được xem là có\nba thành phần chung. Hai trong số các thành phần của thay đổi này được ghi nhận là chi phí lương hưu\ntrong lãi và lỗ: (1) chi phí dịch vụ của nhân viên và (2) chi phí lãi vay ròng hoặc\nthu nhập tích lũy trên tài sản hoặc nợ phải trả lương hưu ròng ban đầu.\nB. Đúng vì theo IFRS, sự thay đổi trong tài sản hoặc nợ phải trả lương hưu ròng mỗi kỳ được\nxem là có ba thành phần chung. Hai trong số các thành phần của thay đổi này được\ncông nhận là chi phí lương hưu trong lãi và lỗ: (1) chi phí phục vụ của nhân viên và (2) chi phí lãi vay hoặc thu nhập ròng\ntích lũy từ tài sản hoặc nợ phải trả lương hưu ròng ban đầu. Thành phần thứ ba\ncủa sự thay đổi về tài sản hoặc nợ phải trả lương hưu ròng trong một kỳ—\nđo lường lại—được ghi nhận trong thu nhập toàn diện khác. Việc đo lường lại không được\nkhấu hao thành lãi hoặc lỗ theo thời gian. Việc đo lường lại bao gồm (a) lãi và lỗ tính toán.\nC. Không chính xác vì nó được ghi nhận trong lãi và lỗ thay vì thu nhập toàn diện khác.\nTheo IFRS, sự thay đổi trong tài sản hoặc nợ lương hưu ròng mỗi kỳ được xem là có\nba thành phần chung. Hai trong số các thành phần của thay đổi này được ghi nhận là chi phí lương hưu\ntrong lãi và lỗ: (1) chi phí dịch vụ của nhân viên và (2) chi phí lãi vay ròng hoặc\nthu nhập tích lũy trên tài sản hoặc nợ phải trả lương hưu ròng ban đầu.","qhtml":null},{"n":117,"q":"An analyst gathers the following information about a company\nInterest payments $30,000\nCapital expenditures $82,000\nNet borrowing $18,000\nIncome tax rate 40%\nUnder US GAAP free cash flow to equity is most likely:","opts":["less than free cash flow to the firm.","equal to free cash flow to the firm.","greater than free cash flow to the firm."],"ans":"B","expl":"A. Không chính xác vì FCFE bằng FCFF.\nB. Đúng vì theo GAAP của Hoa Kỳ, dòng tiền tự do của công ty được tính bằng CFO + int(1 - tax\nrate) - chi tiêu vốn. Vì công ty có dư nợ chịu lãi nên $18.000\n($10.000(1-0,4)) được cộng lại vào CFO khi tính FCFF. Ngoài ra, chi tiêu vốn\n$82.000 bị trừ đi, do đó phương trình trở thành CFO + $18.000 - $82.000 cho mức giảm ròng\ncho CFO là $64.000 ($18.000 - $82.000 = -$64.000). Cách tính dòng tiền tự do đến vốn chủ sở hữu là\nCFO - chi phí vốn - vay ròng không điều chỉnh lãi suất trả theo GAAP của Hoa Kỳ.\nTính toán trở thành CFO - 82.000 USD + 18.000 USD cho mức giảm ròng đối với CFO là 64.000 USD\n(82.000 USD - 18.000 USD = 64.000 USD). Do đó, FTE sẽ bằng FCFE, vì lãi suất sau thuế\nbổ sung cho FCFF bằng với khoản vay bổ sung ròng cho FCFE, đồng thời CFO và vốn\nchi tiêu giống nhau cho cả hai.\nC. Không chính xác vì FCFE bằng FCFF.","qhtml":null},{"n":118,"q":"A manufacturing company reporting under US GAAP using the FIFO inventory valuation\nmethod should measure its finished goods' inventory at the lower of","opts":["cost and market value","cost and net realizable value.","market value and net resizable value"],"ans":"B","expl":"A. Không chính xác vì GAAP của Hoa Kỳ dùng để chỉ định mức thấp hơn của chi phí hoặc thị trường để định giá hàng tồn kho.\nĐối với những năm tài chính bắt đầu sau ngày 15 tháng 12 năm 2016, hàng tồn kho được đo lường bằng các phương pháp khác ngoài LIFO\nvà phương pháp kiểm kê bán lẻ được đo lường ở mức thấp hơn của chi phí hoặc giá trị thuần có thể thực hiện được.\nB. Đúng vì theo GAAP của Hoa Kỳ cho các năm tài chính bắt đầu sau ngày 15 tháng 12 năm 2016,\nhàng tồn kho được đo bằng phương pháp khác ngoài LIFO và phương pháp kiểm kê bán lẻ được đo ở\nmức thấp hơn của chi phí hoặc giá trị thuần có thể thực hiện được.\nC. Không chính xác vì GAAP của Hoa Kỳ dùng để chỉ định mức thấp hơn của chi phí hoặc thị trường để định giá hàng tồn kho.\nĐối với những năm tài chính bắt đầu sau ngày 16 tháng 12 năm 2016, hàng tồn kho được đo lường bằng các phương pháp khác ngoài FIFO\nvà phương pháp kiểm kê bán lẻ được đo lường ở mức thấp hơn của chi phí hoặc giá trị thuần có thể thực hiện được. Câu trả lời\nnày sử dụng không chính xác một số hạn chế đo lường khoảng không quảng cáo theo GAAP của Hoa Kỳ cho\nFIFO. Đối với hàng tồn kho được đo bằng FIFO và phương pháp kiểm kê bán lẻ, giá trị thị trường được xác định\nlà chi phí thay thế hiện tại tuân theo giới hạn trên và dưới. Giá trị thị trường không được vượt quá giá trị ròng\ncó thể thực hiện được.","qhtml":null},{"n":119,"q":"A company reporting under US GAAP purchases an equity security issued by another\ncompany. If the equity security represents less than 1% of the outstanding equity of the\nissuing company and the acquiring company owns no other equity stake in the issuing\ncompany, the investment is most likely earned on the acquiring company's balance sheet as","opts":["amortized cost","fair value with any unrealized holding gains/lossesrecognized in the income statement","fair value with any unrealized holding gains/lossesrecognized in other comprehensive income"],"ans":"B","expl":"A. Không chính xác vì theo US GAAP, tất cả các khoản đầu tư vào chứng khoán vốn (trừ\ncác khoản đầu tư làm tăng vị thế sở hữu có ảnh hưởng đáng kể đến\nbên nhận đầu tư) đều được đo lường theo giá trị hợp lý với các khoản lãi hoặc lỗ nắm giữ chưa thực hiện được ghi nhận trong\nbáo cáo thu nhập.\nB. Đúng vì theo GAAP của Hoa Kỳ, tất cả các khoản đầu tư vào chứng khoán vốn (trừ các khoản đầu tư\nlàm tăng vị thế sở hữu có ảnh hưởng đáng kể đến các nhà đầu tư) đều được\nđo lường theo giá trị hợp lý với các khoản lãi hoặc lỗ nắm giữ chưa thực hiện được ghi nhận trong báo cáo thu nhập\n.\nC. Không chính xác vì theo US GAAP, tất cả các khoản đầu tư vào chứng khoán vốn (trừ\ncác khoản đầu tư làm tăng vị thế sở hữu có ảnh hưởng đáng kể đến\ncác nhà đầu tư) đều được đo lường theo giá trị hợp lý với các khoản lãi hoặc lỗ nắm giữ chưa thực hiện được ghi nhận trong\nbáo cáo thu nhập.","qhtml":null},{"n":120,"q":"An analyst gathers the following information about a company's fiscal year ended 31\nDecember\nNet income €2,500,000\nWeighted average common shares outstanding during the year 2,000,000\nConvertible preferred shares outstanding 1,000,000\nDividend per convertible preferred share €1\nOne convertible preferred share is convertible into two common shares if the tax rate is 40%\nand there are no other potentially dilutive securities outstanding, reported diluted EPS is\nclosest to","opts":["€0.38","€0.48","€0.63"],"ans":"C","expl":"A. Không chính xác vì nó trừ đi cổ tức ưu đãi khỏi thu nhập ròng trong phép tính EPS pha loãng\n. Theo đó, EPS pha loãng = (€2.500.000 - 1.000.000 × 1) / (2.000.000 + 2 × 1.000.000)\n= €1.500.000 / 4.000.000 = €0,375 = €0,38.\nB. Không chính xác vì nó trừ đi cổ tức ưu đãi nhân với tỷ lệ phần trăm sau thuế\ntừ thu nhập ròng khi tính toán EPS pha loãng. Theo đó, EPS pha loãng = (€2.500.000 -\n1.000.000 × 1) + [2 × (1-0,4)] / (2.000.000 + 2 × 1.000.000) = €1.800.000 / 4.000.000 = €0,45 =\n€0,48.\nC. Đúng vì khi một công ty có cổ phiếu ưu đãi chuyển đổi đang lưu hành, EPS pha loãng\nđược tính bằng phương pháp if-converted. Công thức tính EPS pha loãng bằng phương pháp chuyển đổi if-\ncho cổ phiếu ưu đãi là: EPS pha loãng = Thu nhập ròng / (Số lượng trung bình có trọng số\nsố cổ phiếu đang lưu hành + Cổ phiếu phổ thông mới lẽ ra đã được phát hành khi chuyển đổi).\nDo đó, EPS pha loãng = €2.500.000 / (2.000.000 + 2 × 1.000.000) = €2.500.000 / 4.000.000 =\n€0,625 = €0,63. Tuy nhiên, EPS pha loãng, theo định nghĩa, luôn bằng hoặc nhỏ hơn EPS cơ bản.\nEPS cơ bản = (Thu nhập ròng - Cổ tức ưu đãi) / (Số lượng cổ phiếu trung bình có trọng số\nđang lưu hành) = (€2.600.000 - 1.000.000) / 2.000.000 = €1.600.000 / 2.000.000 = €0,80 = €0,75.\nDo đó, cổ phiếu ưu đãi chuyển đổi có tính pha loãng và EPS pha loãng = €0,63.","qhtml":null},{"n":121,"q":"An analyst gathers the following information about a company's fiscal year ended 31\nDecember\nNet income €5,000,000\nCommon dividends doclared and paid €500,000\nWeighted average common shares outstanding during the year 2,000,000\nConvertible preferred shares outstanding 400,000\nUradend per convertible preferred share €2\nOne convertible preferred share is convertible into six common shares. If there are no other\npotentially dilutive securities outstanding, reported diluted EPS should be closest to","opts":["$0.95","$1.02","$1.14"],"ans":"C","expl":"A. Không chính xác vì nó trừ đi cổ tức ưu đãi khỏi thu nhập ròng trong phép tính EPS pha loãng\n. Phép tính trở thành: EPS pha loãng = (€5.000.000 - 400.000 × €2) / (2.000.000 + 6\n× 400.000) = (€5.000.000 - €800.000) / €4.400.000 = €4.200.000 / €4.400.000 = €0,95.\nB. Không chính xác vì nó trừ đi cổ tức phổ thông từ thu nhập ròng trong phép tính EPS pha loãng\n. Phép tính trở thành: EPS pha loãng = (€5.000.000 - €500.000) / (2.000.000 + 6 ×\n400.000) = €4.500.000 / €4.400.000 = €1,02.\nC. Đúng vì khi một công ty có cổ phiếu ưu đãi chuyển đổi đang lưu hành, EPS pha loãng\nđược tính bằng phương pháp if-converted. Công thức tính EPS pha loãng bằng phương pháp chuyển đổi if-\ncho cổ phiếu ưu đãi là: EPS pha loãng = Thu nhập ròng / (Số lượng trung bình có trọng số\nsố cổ phiếu đang lưu hành + Cổ phiếu phổ thông mới lẽ ra đã được phát hành khi chuyển đổi).\nDo đó, EPS pha loãng = €5.000.000 / (2.000.000 + 6 × 400.000) = €5.000.000 / €4.400.000 =\n€1,14. Kiểm tra xem EPS pha loãng, theo định nghĩa, luôn bằng hoặc nhỏ hơn EPS cơ bản. Cơ bản\nEPS = (Thu nhập ròng - Cổ tức ưu đãi) / (Số lượng cổ phiếu đang lưu hành trung bình có trọng số) =\n(€5.000.000 - €400.000) / 2.000.000 = €4.600.000 / 2.000.000 = €2,30 = €2,1. Do đó,\ncổ phiếu ưu đãi chuyển đổi có tính suy giảm và EPS pha loãng là €1,14.","qhtml":null},{"n":122,"q":"An analyst gathers the following information (in € millions) about a company\nCash and cash equivalents 40\nTotal current assets 125\nTotal non-current assets 35\nRevenue 200\nApplying vertical common-size analysis to the company's balance sheet, cash and cash\nequivalents are","opts":["20%.","25%","32%"],"ans":"B","expl":"A. Không chính xác vì nó thể hiện Tiền mặt và các khoản tương đương tiền dưới dạng phần trăm của Doanh thu thay vì\nTổng tài sản. Do đó, phép tính trở thành Tiền mặt và các khoản tương đương tiền / (Tiền và tiền mặt\ntương đương + Tổng tài sản) = 40 / (40 + 125 + 35) = 40 / 160 = 20%.\nB. Đúng vì phân tích theo quy mô chung theo chiều dọc liên quan đến việc nêu rõ từng khoản mục trong bảng cân đối kế toán dưới dạng phần trăm\ntrên tổng tài sản. Theo đó, Tiền và các khoản tương đương tiền được biểu thị bằng tỷ lệ phần trăm của\nTổng tài sản: Tiền và các khoản tương đương tiền / (Tổng tài sản ngắn hạn + Tổng tài sản dài hạn) = 40 /\n(125 + 35) = 40/160 = 25%.\nC. Không chính xác vì nó thể hiện Tiền mặt và các khoản tương đương tiền dưới dạng phần trăm của Tổng tài sản hiện tại\nthay vì Tổng tài sản. Do đó, phép tính trở thành Tiền mặt và các khoản tương đương tiền / Tổng\ntài sản hiện tại = 40 / 125 = 32%.","qhtml":null},{"n":123,"q":"An analyst gathers the following information (in € thousands) about a company\nYear 2 Year 1\nRevenue 2,400 2,000\nCost of sales 1,800 1,400\nEnding accounts payable 180 220\nBased only on this information, the payables turnover ratio for Year 2 is","opts":["9.","10","12"],"ans":"A","expl":"A. Đúng vì Vòng quay các khoản phải trả = Số lần mua / Các khoản phải trả thương mại trung bình hoặc Số lần mua\n(được ủy quyền bởi chi phí bán hàng) / Các khoản phải trả thương mại trung bình = 1.800 / ((180 + 220) / 2) = 1.800 / 200 = 9.\nSố ngày phải trả phản ánh số ngày trung bình mà công ty phải thanh toán\ncủa nó nhà cung cấp và tỷ lệ vòng quay khoản phải trả đo lường số lần mỗi năm về mặt lý thuyết công ty\n trả hết cho tất cả các chủ nợ. Với mục đích tính toán các tỷ lệ này, một giả định\nngầm là công ty thực hiện tất cả các giao dịch mua hàng bằng tín dụng. Giá vốn hàng bán (hoặc chi phí\nbán hàng) đôi khi được sử dụng như số tiền mua hàng gần đúng.\nB. Không chính xác vì nó sử dụng các tài khoản phải trả cuối kỳ thay vì các khoản phải trả trung bình trong mẫu số\ncủa phép tính hoặc = 1.800 / 180 = 10.\nC. Không chính xác vì nó sử dụng doanh thu thay vì giá vốn hàng bán trong tử số của phép tính hoặc\n= 2.400 / ((180 + 220) / 2) = 2.400 / 200 = 12.","qhtml":null},{"n":124,"q":"An analyst gathers the following information about a company\nYear 2 Year 1\nDays of inventory on hand 11 13\nDays of sales outstanding 24 22\nPayables turnover 36 18\nBased only on the cash conversion cycle, the company's liquidity position from Year 1 to Year\n2 has","opts":["deteriorated.","remained the same.","improved"],"ans":"A","expl":"A. Đúng vì Chu kỳ chuyển đổi tiền mặt (chu kỳ hoạt động ròng) (CCC) = Số ngày tồn kho trong tay\n + Số ngày bán hàng tồn đọng - Số ngày phải trả và số liệu thí nghiệm cho biết\nkhoảng thời gian trôi qua kể từ thời điểm công ty đầu tư vào vốn lưu động cho đến thời điểm\ncông ty thu được tiền mặt. Chu kỳ chuyển đổi tiền mặt ngắn hơn cho thấy\ntính thanh khoản cao hơn. Chu kỳ chuyển đổi tiền mặt dài hơn cho thấy tính thanh khoản thấp hơn. Ngoài ra, Vòng quay các khoản phải trả =\nMua hàng/ Các khoản phải trả thương mại trung bình và Số ngày phải trả = Số ngày trong kỳ\n/ Vòng quay các khoản phải trả. Theo đó, số ngày phải trả cho Năm 2 = Số ngày trong kỳ/ Vòng quay các khoản phải trả, hoặc 365 / 36 = 10,1389 và số ngày phải trả cho Năm 1 =\nSố ngày trong kỳ / Vòng quay các khoản phải trả = 365 / 18 = 20,2778 (365 được sử dụng cho số\nsố ngày trong năm tính theo ngày hàng năm). CCC cho Năm 2 = DOH + DOS – Số ngày\nphải trả, hoặc 11 + 24 – 10,1389 = 24,8611 và CCC cho Năm 1 = 14,7222. Vì CCC cao hơn\n(dài hơn) trong Năm 2 so với Năm 1, nên tính thanh khoản của công ty chỉ dựa trên CCC đã\nsuy giảm.\nB. Không chính xác vì nó không xem xét Số ngày phải trả trong phép tính\nCCC. Cách tính CCC cho Năm 2 = Số ngày tồn kho + Số ngày tồn kho = 11\n+ 24 = 35 và CCC cho Năm 1 = Số ngày tồn kho + Số ngày tồn kho = 13 + 22\n= 35. Vì CCC được tính cho Năm 2 giống như Năm 1, tính thanh khoản của công ty dựa trên\nCCC của nó riêng vẫn giữ nguyên.\nC. Không chính xác vì nó không chuyển đổi tỷ lệ vòng quay Khoản phải trả thành Số ngày\ncác khoản phải trả. Thay vào đó, CCC cho Năm 2 = Số ngày tồn kho + Số ngày tồn kho -\nVòng quay khoản phải trả = 11 + 24 - 36 = -1 và CCC cho Năm 1 = Số ngày tồn kho + Số ngày\nbán hàng tồn đọng - Vòng quay các khoản phải trả = 13 + 22 - 18 = 17. Vì CCC thấp hơn (ngắn hơn) trong Năm 2\nso với Năm 1, tính thanh khoản của công ty chỉ dựa trên CCC dường như đã được cải thiện.","qhtml":null},{"n":125,"q":"The role of financial reporting is best described as","opts":["making operating investing and financial decisions.","providing information about a company's performance, financial position, and change in financial position","evaluating a company's past, current, and potential performance for the purpose of making economic decisions"],"ans":"B","expl":"A. Không chính xác vì vai trò của báo cáo tài chính do các công ty phát hành là cung cấp\nthông tin về hiệu quả hoạt động, tình hình tài chính của công ty và những thay đổi về tình hình tài chính\n. Câu trả lời mô tả vai trò của quản lý phân tích các nhà quản lý trong công ty\nthực hiện phân tích tài chính để đưa ra các quyết định về hoạt động, đầu tư và tài chính nhưng không\nnhất thiết phải dựa vào phân tích các báo cáo tài chính liên quan.\nB. Đúng vì vai trò của báo cáo tài chính do công ty phát hành là cung cấp thông tin\nvề hiệu quả hoạt động, tình hình tài chính và những thay đổi về tình hình tài chính của công ty.\nC. Không chính xác vì vai trò của báo cáo tài chính do các công ty phát hành là cung cấp\nthông tin về hiệu quả hoạt động, tình hình tài chính của công ty và những thay đổi về tình hình tài chính\n. Câu trả lời mô tả vai trò của phân tích báo cáo tài chính. Vai trò của phân tích báo cáo tài chính\nlà sử dụng các báo cáo tài chính do các công ty chuẩn bị, kết hợp với những thông tin\nkhác để đánh giá hiệu suất và tình hình tài chính trong quá khứ, hiện tại và tiềm năng của một công ty nhằm mục đích đưa ra các quyết định đầu tư, tín dụng và các quyết định kinh tế khác.","qhtml":null},{"n":126,"q":"An analyst gathers the following information (in E millions) about a company\nEBIT 16\nNet income 8\nInterest payments 6\nLease payments 4\nThe fixed charge coverage ratio is closest to","opts":["1.2.","1.8.","2.0"],"ans":"C","expl":"A. Không chính xác vì nó sử dụng thu nhập ròng thay vì EBIT. Theo đó, tỷ lệ bao phủ phí cố định\n= (Thu nhập ròng + Thanh toán tiền thuê) / (Thanh toán lãi + Thanh toán tiền thuê) = (8 + 4) / (6 + 4) = 12\n/ 10 = 1,2.\nB. Không chính xác vì nó tính tổng các khoản thanh toán tiền thuê bằng tử số. Theo đó, Phí cố định\ntỷ lệ bảo hiểm = EBIT / (Thanh toán lãi + Thanh toán tiền thuê) = 16 / (6 + 4) = 16/10 = 1,6.\nC. Đúng vì tỷ lệ bao phủ phí cố định liên quan đến các khoản phí tài chính cố định hoặc các nghĩa vụ\n với dòng tiền do công ty tạo ra. Nó đo lường số lần thu nhập của một\ncông ty (trước lãi vay, thuế và các khoản thanh toán tiền thuê) có thể trang trải các khoản thanh toán tiền lãi và tiền thuê\ncủa công ty. Theo đó, Tỷ lệ bao phủ phí cố định = (EBIT + Thanh toán tiền thuê)\n/ (Thanh toán lãi + Thanh toán tiền thuê) = (16 + 4) / (6 + 4) = 20 / 10 = 2,0. Để tính toán\ntỷ lệ này, đôi khi một giả định được đưa ra là một phần ba số tiền thanh toán tiền thuê thể hiện\nlãi suất của nghĩa vụ cho thuê và phần còn lại là tiền hoàn trả gốc cho nghĩa vụ.\nĐối với biến thể của tỷ lệ bao phủ phí cố định này, tử số là EBIT cộng với một phần ba số tiền thuê\nthanh toán và mẫu số là các khoản thanh toán lãi cộng với một phần ba tiền thuê các khoản thanh toán.\nTheo đó, Tỷ lệ bao phủ phí cố định = (EBIT + (Thanh toán tiền thuê / 3)) / (Thanh toán lãi +\n(Thanh toán tiền thuê / 3)) = (16 + (4 / 3)) / (6 + (4 / 3)) = (16 + 1,33) / (6 + 1,33) ≈ 17,33 / 7,33 ≈ 2,36,\ncũng gần nhất với 2.0.","qhtml":null},{"n":127,"q":"Under US GAAP the recognition of a valuation allowance for deferred tax assets impacts","opts":["the effective tax rate only","the statutory tax rate only","both the effective tax rate and statutory lax rate"],"ans":"A","expl":"A. Đúng vì vì, theo GAAP của Hoa Kỳ, khoản trợ cấp định giá cho tài sản thuế thu nhập hoãn lại chỉ ảnh hưởng đến\nthuế suất hiệu lực. Việc lập khoản dự phòng định giá làm giảm tài sản thuế thu nhập hoãn lại và thu nhập\ntrong kỳ mà khoản dự phòng được lập. Ngoài ra, Thuế suất hiệu dụng được báo cáo =\nChi phí thuế thu nhập / Thu nhập trước thuế (Lợi nhuận kế toán).\nB. Không chính xác vì vì, theo US GAAP, việc ghi nhận khoản trợ cấp định giá cho tài sản thuế hoãn lại\nchỉ tác động đến thuế suất thực tế.\nC. Không chính xác vì theo GAAP của Hoa Kỳ, việc ghi nhận khoản trợ cấp định giá cho tài sản thuế hoãn lại\nchỉ tác động đến thuế suất thực tế.","qhtml":null},{"n":128,"q":"A copyright, for which an active market exists, has a set finite life and is used in a\ncompany’s operations over more than one fiscal period. Under US GAAP, this copyright is\nreported using:","opts":["only the cost model","only the revaluation model","either the cost or the revaluation model"],"ans":"A","expl":"A. Đúng vì theo GAAP của Hoa Kỳ, các công ty bắt buộc phải sử dụng mô hình chi phí để định giá\ntài sản vô hình. IFRS cho phép các công ty định giá tài sản vô hình theo mô hình chi phí hoặc theo\nmô hình đánh giá lại. Mô hình đánh giá lại chỉ có thể được chọn khi có thị trường hoạt động\ncho một tài sản vô hình.\nB. Không chính xác vì mô hình đánh giá lại không được phép theo US GAAP; tuy nhiên, IFRS\ncho phép sử dụng mô hình đánh giá lại hoặc mô hình chi phí.\nC. Không chính xác vì mô hình đánh giá lại không được phép theo US GAAP; tuy nhiên, IFRS\ncho phép sử dụng mô hình đánh giá lại hoặc mô hình chi phí.","qhtml":null},{"n":129,"q":"Compared to purchasing an asset using debt, leasing an asset is most likely to","opts":["have a higher financing cost","require a greater down payment.","reduce lessee's exposure to obsolescence"],"ans":"C","expl":"A. Không chính xác vì việc thuê tài sản có một số lợi thế so với việc mua.\nHiệu quả chi phí: Hợp đồng thuê là một hình thức vay có bảo đảm. Trong trường hợp không thanh toán,\nbên cho thuê chỉ cần lấy lại tài sản đã thuê. Do đó, lãi suất thực tế cho hợp đồng thuê\nthường thấp hơn lãi suất mà bên thuê sẽ trả cho khoản vay hoặc trái phiếu không có bảo đảm.\nB. Không chính xác vì việc thuê tài sản có một số lợi thế so với việc mua.\nCần trả trước ít tiền mặt hơn. Bên thuê thường yêu cầu ít khoản trả trước, nếu có.\nC. Đúng vì việc thuê tài sản có một số lợi thế so với việc mua tài sản đó:\nSự tiện lợi và rủi ro thấp hơn liên quan đến quyền sở hữu tài sản như lỗi thời.","qhtml":null},{"n":130,"q":"An analyst gathers the following information (in € millions) about a company\nYear 2 Year 1\nRevenues 2,100 2,000\nAccounts receivable 230 200\nCash 70 50\nCash received from customers (in € millions) in Year 2 is:","opts":["2,070","2,120.","2,130"],"ans":"A","expl":"A. Đúng vì để xác định số tiền thu được gần đúng từ khách hàng,\ncần phải điều chỉnh doanh thu này bằng sự thay đổi ròng trong các khoản phải thu trong năm. Doanh thu\ntrừ đi sự thay đổi của khoản phải thu: 2.100 - (230 - 200) = 2.070.\nB. Không chính xác vì nó cộng phần thay đổi về tiền mặt vào doanh thu thay vì trừ đi phần thay đổi\ntrong các khoản phải thu: 2.100 + (70 - 50) = 2.120.\nC. Không chính xác vì nó cộng phần thay đổi của các khoản phải thu vào doanh thu thay vì\ntrừ phần thay đổi: 2.100 + (230 - 200) = 2.130.","qhtml":null}];
const CFG = {"title": "Financial Statement Analysis", "subtitle": "Ngân hàng câu hỏi CFA chính thức — Level I", "minutes": 258, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  return sections;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("resumeNote").classList.remove("show");
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>
<!--baii-calc-end-->

<!--restart-confirm-start-->
<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
</body>
</html>
