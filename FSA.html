<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Which of the following companies would most likely be considered to have the lowest\nfinancial reporting quality other things equal?", "opts": ["A company that provides high quality, decision useful information under GAAP but delays its reports.", "A company that reports significant profits due to a favorable exchange rate movement", "A company that reports the results from two different segments as a combined entity."], "ans": "C", "expl": "A. Incorrect. The company's reports are high quarry, but the delay in reporting impairs their\nusefulness somewhat. The reporting is still better than biased reporting.\nB. Incorrect. This is an example of decision useful information about a result that may not be\nsustainable. Reporting is not of the highest quality, but is better than biased reporting\nC. Correct. Combining the results from two segments is an example of biased reporting, which\nfails in the middle of the quality spectrum It is difficult to interpret the profitability of each\nsegment when their results are combined\nFinancial Statement Analysis: describe a spectrum for assessing financial reporting quality", "qhtml": null}, {"n": 2, "q": "Which of the following is lowest quality on the spectrum of GAAP conforming financial\nreports?", "opts": ["Aggressive accounting choices", "Earnings management", "Conservative accounting choices"], "ans": "B", "expl": "A. Incorrect because aggressive accounting is a biased choice. Biased accounting choices are\nhigher in quality than earnings management on the spectrum of GAAP conforming financial\nreports.\nB. Correct. Earnings management represents deliberate actions to influence reported earnings\nand their interpretation. The distinction between earnings management and biased choices is\nsubtle and, primarily, a matter of intent.\nC. Incorrect because conservative accounting í a biased choice. Biased accounting choices are\nhigher in quality than earnings management on the spectrum of GAAP conforming financial\nreports.\nFinancial Statement Analysis: describe a spectrum for assessing financial reporting quality", "qhtml": null}, {"n": 3, "q": "Analyst would mostly conduct additional analysis i en laced will which of the following\nfinancial presentations?", "opts": ["A non-GAAP financial measure that excludes an expense that is likely to recur", "Reporting a non-GAAP financial measure in an SEC filing", "A change from LIFO inventory accounting to FIFO"], "ans": "A", "expl": "A. Correct. The exclusion of recurring items from non-GAAP financial measures is strictly\nprohibited by the SEC and should raise concerns that should raise concerns that additional\nanalysis is needed\nB. Incorrect. If a company uses non-GAAP measures in is SEC filings, it must display the\ncomparative GAAP measure with equal prominence and provide a reconciliation between the\ntwo\nC. Incorrect. LIFO reporting provides sufficient information in the Notes to convert from LIFO to\nFIFO so a formal change should not alter an analyst’s opinion about the company.\nFinancial Statement Analysis: Describe presentation choices, including non-GAAP measures, el\ncould be used to influence an analyst's", "qhtml": null}, {"n": 4, "q": "Under International Financial Reporting Standards (IFRS) reported operating cash flows are\nmost likely to be increased by the classification choice made for", "opts": ["impairment losses on fixed assets", "dividends paid", "Interest expense"], "ans": "C", "expl": "A. Incorrect IFRS does not allow classification of impairment losses as anything other than an\noperating cash flow\nB. Incorrect, IFRS allows classification of dividends paid as either an operating or a financing cash\nflow However, when dividends paid is shown as an operating cash flow, reported operating cash\nflows are lower.\nC. Correct. IFRS allows the classification of interest expense as either an operating or a financing\ncash flow. When interest expense is shown as a financing cash flow, reported operating cash\nflows are higher.\nFinancial Statement Analysis: describe accounting methods (choices and estimates) could be\nused to manage earnings, cash flow, and balance sheet items", "qhtml": null}, {"n": 5, "q": "In the Porter's five forces framework a company is most likely to have the greatest\nprofitability if", "opts": ["the threat of substitutes is low and the bargaining power of buyers is low", "the threat of substitutes is low and the bargaining power of buyers is high.", "The threat of substitutes is high and the bargaining power of buyers is low."], "ans": "A", "expl": "A. Correct because both a low availability of substitutes and low bargaining power of buyers\nwould improve a company's pricing power\nB. Incorrect because a high degree of rivalry would offset the positive effect of a low threat of\nsubstitutes.\nC. Incorrect because a high availability of substitutes would act to offset the positive affect of\nlow bargaining power of buyers\nFinancial Statement Analysis: explain how the competitive position of a company based on a\nPorter's five forces analysis affects prices and costs", "qhtml": null}, {"n": 6, "q": "Which of the following conditions conducive to issuing low-quality financial reports is most\nlikely a result of poor internal controls", "opts": ["Rationalization", "Opportunity", "Motivation"], "ans": "B", "expl": "A. Incorrect Rationalization takes place after the low-qually reporting act has taken place and is\na psychological by individuals to justify their actions. Poor internal controls are not a\npsychological process\nB. Correct. Poor internal controls provide opportunities for errors or fraud to be incorporated in\nfinancial reporting without being deleted\nC. Incorrect. Motivation results from personal pressures or corporate pressures to report on a\nlow-quality basis. Poor internal controls provide the vehicle through which low-quality reporting\ncan be concealed, not the motivation for it.\nFinancial Statement Analysis: describe motivations that might cause management to issue\nfinancial reports that are not high quality and conditions that are conducive to issuing low-\nquality, or even fraudulent", "qhtml": null}, {"n": 7, "q": "Maintaining prior views or forecasts by inadequately incorporating new information best\ndescribes", "opts": ["conservatism bias", "overconfidence bias", "representativeness bias"], "ans": "A", "expl": "A. Correct because conservatism in which people maintain their prior views or forecasts by\ninadequately incorporating new information\nB. Incorrect because overconfidence bias occurs when people demonstrate unwarranted faith in\ntheir own abilities\nC. Incorrect because representative bias refers to the tendency to classify information based on\npast experiences and known classifications\nFinancial Statement : explain how behavioral factors affect analyst Analysis forecasts and\nrecommend remedial actions for analyst biases", "qhtml": null}, {"n": 8, "q": "For a company in a cyclical industry, normalized earnings are best described as", "opts": ["current earnings that include the impact of acquisitions", "mid-cycle earnings in the absence of temporary factors.", "earnings from the peak years excluding temporary factors"], "ans": "B", "expl": "A. Incorrect because normalized earnings remove the impact of temporary factors and unusual\nevents such as acquisitions.\nB. Correct because normalized earnings are the expected level of mid-cycle earnings for a\ncompany in the absence of any unusual or temporary factors that affect profitability.\nC. Incorrect because normalized earning are based on mid-cycle earnings, not peak-year\nearnings.\nFinancial Statement Analysis: explan considerations in the choice of an explol forecast Fonzon\nand an analyst's choices in developing projections beyond the short-term forecast horizon", "qhtml": null}, {"n": 9, "q": "Porter's five forces analysis is used to estimate a company's future profit margin relate to.", "opts": ["only its competitors", "only its historic margins.", "both its competitors and its historic margins"], "ans": "C", "expl": "A. Incorrect because Porter's five forces framework and analytical tools can help analysts assess\nthe relative profit potential of a company by helping analysts estimate whether profit margins\nare likely to be relatively high or low (relative to historical profit margins and relative to\ncompeting companies).\nB. Incorrect because Porter's five forces framework and similar analytical tools can help analysts\nassess the relative profit potential of a company by helping analysts estimate whether profit\nmargins are likely to be relatively high or low (relative to historical profit margins and relative to\ncompeting companies).\nC. Correct because Porter's live forces framework and similar analytical tools can help analysts\nassess the relative profit potential of a company by helping them understand the company’s\nindustry and its position within the industry. Understanding the industry and competitive\ncontexts of a company helps analysts estimate whether, for example, sales growth is likely to be\nrelatively high or low(relative to history, relative to the overall growth in the economy or a\nsector and/ or relative to competing companies) and whether the profit margins are likely to be\nrelatively high or low (relative to historical profit margins and relative to competing companies)\nFinancial Statement Analysis: explain bow the competitive position of a company base on a\nPorter's five forces says affects prices and costs", "qhtml": null}, {"n": 10, "q": "An analyst uses the following information to forecast a company's gross profit margin:\nCurrent Amount (in $ millions) Forecasted Growth\nSales 1200 8%\nCost of sales 300 4%\nThe analysts forecasted gross profit margin should be closest to a(n)", "opts": ["decrease of 1%.", "increase of 1%", "increase of 4%."], "ans": "B", "expl": "A. Incorrect because it computes the gross profit margin as cost of sales/ sales. Current gross\nprofit margin is 25% (300/1,200) and the forecasted gross profit margin is 24,1% (312 / 1.296) a\ndecrease of approximately 1%.\nB. Correct because the gross profit for the current year is 900 (=1,200-300) therefore the\ncurrent gross profit margin is 75% If sales Increase by 8% (to 1,296) and cost of sales increase by\n4% (to 312), the forecasted gross profit is 984 (=1.295-312) and the forecasted gross profit\nmargin is 75.9%. This is an increase of approximately 1% (=75.9% -75%)\nC. Incorrect because it assumes the starting values have the same base and takes the difference\nin the growth rates, 4% = sales growth - cost of sales growth\nFinancial Statement Analysis: demonstrate the development of a sales-based pro forma\ncompany model", "qhtml": null}, {"n": 11, "q": "The price elasticity of demand for a product is 0.5 and its cost remains constant, a 10%\nincrease is selling price will most likely result in.", "opts": ["no change in cost of sales", "a decrease in volume of 5%", "an increase in revenue of 5%"], "ans": "B", "expl": "A. Incorrect because the impact of higher prices on volume depends on the price elasticity of\ndemand (Le., how the quantity demanded varies with price). Since volumes will decline, cost of\ngoods sold will also decline.\nB. Correct because the impact of higher prices on volume depends on the price elasticity of\ndemand (ie, how the quantly demanded varies with price). Price elasticity of demand gives the\nimpact to volume, and not total revenues, for a given level of price increases. Furthermore,\nAnalyst A expects price sticky of 0.5 micating that volume will fall by 0 percent given the 10\npercent retail price increase.\nC. Incorrect because the impact of higher prices on volume depends on the price elasticity of\ndemand (le, how the quantly demanded varies with price). Price elasticity of demand gives the\nimpact to volume, and not total revenues, for a given level of price increases\nFinancial Statement Analysis: explain how to forecast industry and company sales and costs\nwhen they are subject to price inflation or deflation", "qhtml": null}, {"n": 12, "q": "All else being equal, forecasting an increase in which of the following will most likely\nincrease forecasted EPS for a company?", "opts": ["Share repurchases", "Secondary stock issuances", "Equity based compensation of employees"], "ans": "A", "expl": "A. Correct because share repurchases decrease the number of shares outstanding. A decrease\nin the number of shares outstanding will raise the EPS all things being equal\nB. Incorrect because a secondary stock issuance increases the number of shares outstanding. An\nincrease in the number of shares outstanding will decrease the EPS all things being equal.\nC. Incorrect because an increase in equity-based compensation increases the number of shares\noutstanding. An increase in the number of shares outstanding will decrease the EPS all things\nbeing equal\nFinancial Statement Analysis: demonstrate the development of a sales-based pro forma\ncompany model", "qhtml": null}, {"n": 13, "q": "Analyst gathers the following information (in € millions) relating to a company's\nmerchandise inventory as of 31 December of Year 1.\nCost 65\nNet realizable value 60\nCurrent placement cost 58\nOn 31 December of Year 2, the net realizable value of the inventory is € 7 higher than iít\ncarrying value. Under US GAAP, the amount (in millions) of the reversal of the prior write\ndown is", "opts": ["0", "5", "7"], "ans": "A", "expl": "A. Correct as U.S GAAP prohibit the reversal of write-downs\nB. Incorrect because this is the reversal under IFRS. Inventories shall be measured (and carried\non the balance sheet) at the lower of cost and net realizable value Reversal (limited to the\namount of the original write-down) is required for a subsequent increase in value of inventory\npreviously written down. The reversal of any write-down of inventories is recognized as a\nreduction in cost of sales (reduction in the amount of inventories recognized as expense). The\nwrite-down in Year 1 is equal to 5 million (€55 cost - €60 net realizable value). The reversal is\nlimited to the original 5 million write-down. Under U.S. CAAP, reversal of a write-down is\nprohibited\nc. Incorrect and is the amount of the reversal allowed if the candidate incorrectly calculated the\ninitial write-down as 7 million (65 cost – 58 current replacement cost) under IFRS. This is also the\ncorrect initial write-down under U.S GAAP, assuiming inventories are measured using LIFO or\nretail inventory methods. Also, it is the amount by which the net realizable value exceeds\ncarrying value at 31 December Year 2. However, under US GAAP reversal of a write down is\nprohibited.", "qhtml": null}, {"n": 14, "q": "An analyst gathers the following year-end information from a company's financial\nstatements\nYear 1 Year 2\nAccounts receivable €3 million €1 million\nAccounts payable €2 million €5 million\nBased only on this information, if Year 2 net income is €3 million and the Year 1 ending cash\nbalance is €10 million the Year 2 ending cash balance is:", "opts": ["€8 million", "€12 million", "€15 million"], "ans": "A", "expl": "A. Correct because €3,000,000 net income would need to be adjusted for accrued\nincome/expense derived from the change in accounts recervate and accounts payable. The\nincrease in accounts receivables subtracted from net income and the decrease in accounts\npayable is also subtracted from net income.\nChange in cash = Net Income - increase in Accounts Receivable - decrease in Accounts Payable --\n€2,000,000\nChange in cash = €3,000,000 - €2,000,000 - €3,000,000 = - €2,000,000\nEnding cash balance = 2011 ending cash balance + change in cash = €10,000,000 - €2,000,000 =\n€8,000,000", "qhtml": null}, {"n": 15, "q": "A company Incurred the following expenditures (in € millions) to internally develop\nIntangible asset:\nCosts incurred during the research phase 900\nCosts incurred during the development phase 600\nIf the recognition criteria for an intangible asset have been met, the maximum amount of\ncapitalized costs (in millions) is", "opts": ["600", "900.", "1,500"], "ans": "A", "expl": "A. Correct because €500 million represents the costs incurred during the development phase\nwhich should be capitalized. Costs incurred in the development stage can be capitalized as\nintangible assets if certain criteria are met, including technological feasibility, the ability to use\nor sell the resulting asset and the ability to complete the project.\nB. Incorrect because €900 million represents the costs need during the research phase. IFRS\nrequires that expenditures on research or during the research phase of an internal project be\nexpensed rather than capitalized.\nC. Incorrect because €1,500 million is the total costs incurred in the research and the\ndevelopment phases. It includes the €900 million costs incurred in the research phase which\nshould be expensed. Only the €600 million capitalized as an intangible asset incurred during the\ndevelopment phase should be capitalized.\nFinancial Statement Analysis: compare the financial reporting of the following types of\nintangible assets: purchases, Internally developed, and acquired in a business combination", "qhtml": null}, {"n": 16, "q": "Compared to the industry average, which of the following financial ratio most likely\nindicates a company has a highly efficient credit and collection process? A relatively low.", "opts": ["receivables turnover ratio", "number of days sales outstanding", "number of days of inventory on hand"], "ans": "B", "expl": "A. Incorrect because a relatively high receivables turnover ratio (and commensurately low DSO)\nmight indicate highly efficient credit and collection\nB. Correct because a relatively high receivables turnover ratio (and commensurately low DSO)\nmight indicate highly efficient credit and collection\nC. Incorrect because a low DOH may suggest a firm is efficient at selling its inventory, but it does\nnot measure how long it takes it to collect from its sales. The number of DSO represents the\nelapsed time between a sale and cash collection, reflecting how fast the company collects cash\nfrom customers to whom it offers credit. A relatively high receivables turnover ratio (and\ncommensurately low DSO) might indicate highly efficient credit and collection\nFinancial Statement Analysis: calculate and interpret activity, liquidity, solvency, and profitability\nratios", "qhtml": null}, {"n": 17, "q": "Under the indirect method of reporting cash flow from operating actives, a decrease\ndeferred income tax liabilities is", "opts": ["ignored", "added back to net income", "subtracted from net income."], "ans": "C", "expl": "A. Incorrect because regardless of the originating source of the deferred tax liability, all changes\nin deferred tax liabilities will either be added back or subtracted from net income under the\nindirect method of reporting cash tow from operations\nB. Incorrect because an increase in deferred tax liability would be an addition to net come under\nthe indirect method of reporting cash flow from operations.\nC. Correct because a decrease in deferred tax liability would be subtracted from net income\nunder the indirect method of reporting cash flow from operations.\nFinancial Statement Analysis: describe the steps in the preparation of direct and indirect cash\nflow statements, including how cash flows can be computed using Income statement and\nbalance sheet data", "qhtml": null}, {"n": 18, "q": "With respect to company analysis, measures of inventory management are best described\nat.", "opts": ["activity ratios", "solvency ratios.", "profitability ratios."], "ans": "A", "expl": "A. Correct because activity ratios measure how efficiently a company performs day-to-day tasks,\nsuch as collection of receivables and management of inventory.\nB. Incorrect because solvency ratios measure a company’s ability to meet long term obligations.\nSubsets of these ratios are also known as “leverage” and “long-term debt” ratios\nC. Incorrect profitability ratios measure the company's ability to generate profits from its\nresources (assets)\nFinancial Statement Analysis: calculate and interpret activity, liquidity, solvency, and profitability\nratios", "qhtml": null}, {"n": 19, "q": "A disclaimer of opinion is issued when an auditor", "opts": ["is unable to issue an opinion", "notes an exception to accounting standards.", "finds a material departure from accounting standards."], "ans": "A", "expl": "A. Correct because a disclaimer of opinion occurs when auditors are unable to issue an opinion\nB. Incorrect because a qualified opinion (rather than a disclaimer of opinion) would be\nappropriate in the case of some scope limitation or an exception to accounting stances.\nC. Incorrect because an adverse opinion (rather than a disclaimer of opinion) would be\nappropriate if the auditor determines that financial statements materially depart from\naccounting standards and are not fairly presented.\nFinancial Statement Analysis: describe the importance of regulatory filings, financial statement\nrules and supplementary information, management's commentary, and audit reports", "qhtml": null}, {"n": 20, "q": "Which of the following most likely indicates improved efficiency of a company’s credit,\nand collection policy? An increase in", "opts": ["receivables turnover ratio", "days of sales outstanding", "number of days of payables"], "ans": "A", "expl": "A. Correct because a relatively high receivables turnover (and commensurately low DSO) might\nindicate highly efficient credit and collection.\nB. Incorrect because a relatively high receivables turnover ratio (and commensurately low DSO)\nmight indicate highly efficient credit and collection.\nC. Incorrect because the number of days of payables reflects the average number of days the\ncompany takes to pay its suppliers and is not related to account receivables or the efficiency of\nthe company's credit or collections.\nFinancial Statement Analysis: calculate and interpret activity, liquidity, solvency, and\nprofitability ratios", "qhtml": null}, {"n": 21, "q": "An analyst gathers the following information (in € millions) about a manufacturing\ncompany\nCost of sales 150\nGross profit: 100\nSelling, general, and administrative expenses 30\nBased only on this information, applying vertical common size analysis to the income\nstatement, selling, general and administrative expenses are:", "opts": ["12%.", "20%", "30%"], "ans": "A", "expl": "A. Correct because a vertical common-size income statement divides each income statement\ntem by revenue. Gross profit is the amount of revenue available after subtracting the costs of\ndelivery goods or services. Accordingly, based only on this information, under vertical common\nsize analysis, selling, general, and administrative expenses can be expressed as\n= Selling, general, and administrative expenses / Revenue\n= Selling, general and administrative expenses / (Gross preft + Cost of sales) –\n= 30/(100 + 150)\n; or = 30/250 ~ 12%\nB. Incorrect because it expresses selling, general, and administrative expenses as a percentage of\nCost of sales. Consequently, Selling general, and administrative expenses/Cost of sales = 30/150\n= 20%\nC. Incorrect because it expresses selling, general, and administrative expenses as a percentage\nof Gross profit: Consequently, Selling general, and administrative expenses/Gross profit =\n30/100 = 30%.\nFinancial Statement Analysis: a company's mancal performance using comme size income\nstatements and financial ratios based on the income statement", "qhtml": null}, {"n": 22, "q": "Which of the following is most likely added back to net income when preparing a cash\nflow statement under the Indirect method?", "opts": ["Gains on sale of assets", "Amortization of bond discount", "Decrease in deferred tax liability"], "ans": "B", "expl": "A. Incorrect because gain on sale of assets is a non-operating item that is included in net income\ncalculation. Therefore, gains on sale of assets must be subtracted from, not added back to net\nincome when preparing a cash flow statement under the indirect method.\nB. Correct because amortization of a discount (premium) a non-cash item and thus, apart from\nits effect on taxable income, has no effect on cash flow in the section of the statement of cash\nflows that reconciles net income to operating cash flow, amortization of a discount (premium) is\nadded back to (subtracted from) net income.\nC. Incorrect because a decrease in deferred ltax liability occurs when accounting tax expense is\nlower than the amount of cash paid the income taxes. Therefore, the amount of decrease must\nbe subtracted from net income when preparing the cash flow statement under the indirect\nmethod.\nFinancial Statement Analysis: descuite the steps in the preparation of direct and indirect cash\nlow statements including how cash flows can be computed using income statement and balance\nsheet cats", "qhtml": null}, {"n": 23, "q": "With respect to the statement of cash flows under the indirect method, which of the\nFollowing will increase net cash provided by operating activities compared to net income? An\nincrease in", "opts": ["inventory", "accounts payable", "accounts receivable"], "ans": "B", "expl": "A. Incorrect because an increase in inventory increases purchases from suppliers compared to\ncost of goods sold to determine purchases from suppliers, cost of goods sold is adjusted for the\nchange in inventory. If inventory increased during the year, then purchases during the year\nexceeded cost of goods sold, and vice versa.\nB. Correct because an increase in accounts payable mears that less was paid than was\npurchased from suppliers. If accounts payable increased during the year, then purchases on an\naccrual basis would be higher than they would be on a cash basis, and vice versa\nC. Incorrect because an increase in accounts receivable means that less was collected than was\nsold. To determine the approximate cash receipts from customers, it is necessary to adjust this\nrevenue amount by the net change in accounts receivable for the year. If accounts receivable\nincrease during the year, revenue on an accrual basis is higher than cash receipts from\ncustomers, and vice versa.\nFinancial Statement Analysis: describe the steps in the preparation of direct and indirect cash\nflow statements, including how cash flows can be computed using income statement and\nbalance sheet data", "qhtml": null}, {"n": 24, "q": "Ignoring income taxes, acquiring an intangible asset would most likely result in", "opts": ["a lower net operating cash flow than internally developing the intangible asset", "the same net operating cash flow than internally developing the intangible asset", "a higher net operating cash flow than internally developing the intangible asset"], "ans": "C", "expl": "A. Incorrect because acquiring an intangible asset is an investing activity whereas internally\ndeveloping in intangible asset can be a combination of operating and investing activity. Costs of\nacquiring intangible assets are classified as investing cash outflows. IFRS require that\nexpenditures on research (or during the research phase of an internal project) be expensed\nrather than capitalised as an Intangible asset. IFRS allow companies to capitalise an intangible\nasset arising from development (or the development phase of an internal project) if certain\ncriteria are met, including demonstration of the technical feasibility of completing the intangible\nasset and the intent to use or sell the asset. Consequently, acquiring an intangible asset would\nresult in lower operating cast outflows than internally developing the intangible assets (as the\nlatter would result in increased operating cash outflows during the research phase)\nB. Incorrect because acquiring an intangible asset is an investing activity whereas internally\ndeveloping in intangible asset can be a combination of operating and investing activity. On the\nstatement of cash flows, costs of internally developing intangible assets are classified as\noperating cash outflows whereas costs of acquiring intangible assets are classed as investing\ncash outflows\nC. Correct because acquiring an intangible asset is an investing activity whereas internally\ndeveloping an intangible asset can be a combination of operating and investing activities. On\nthe statement of cash flows, costs of internally developing intangible assets are classified as\noperating cash outflows whereas costs of acquiring intangible assets are classified as investing\ncash outflows. Cost of acquiring intangible assets are classified investing cash outflows. IFRS\nrequire that expenditures on research (or during the research phase of an internal project) be\nexpensed rather than capitalised as an intangible asset. IFRS alow companies to recognise an\nintangible asset arising from development (or the development phase of an internal project) if\ncertain criteria are met, including a demonstration of the technical possibility of completing the\nintangible asset and the intent to use or sell the asset", "qhtml": null}, {"n": 25, "q": "Which of the following is most accurate with respect to inherent limitations of audit?", "opts": ["An audit opinion is based on review of information only prepared by the auditor", "An audit is based on an exhaustive review of all transactions during a financial year", "An expectations gap may exist between the auditor's rule and the public's expectation of auditors"], "ans": "C", "expl": "A. Incorrect because an audit is based on a review of information provided by the company, not\nthe auditor. Although audit opinions provide discipline for financial reporting quality, inherent\nlimitations exist. An audit opinion is based on a review of information prepared by the company.\nB. Incorrect because an audit is based on sampling, not an exhaustive review of all transactions.\nAlthoguh audit opinions provide discipline for financial reporting quality, inherent limitations\nexist. An audit is based on sampling and the sample might not reveal misstatements.\nC. Correct because although audit opinions provide discipline for financial reporting quality,\ninherent limitations exist. An “expectation gap” may exist between the auditor’s role and the\npublic’s expectation of auditors. An audit is not typically intended to detect fraud, it is intended\nto provide assurance that the financial reports are fairly presented.\nFinancial Statement Analysis: describe mechanisms the discipline financial reporting quality\nand the potential limitations of those mechanisms.", "qhtml": null}, {"n": 26, "q": "An analyst gathers the following Information about a company for its fiscal year ended 31\nDecember\nNet income €80,000\nCommon dividends declared are paid €16,000\nPreferred dividends declared and paid €10,000\nWeighted average common shares outstanding 150,000\nCommon shares outstanding at year end 130,000\nBasic EPS is closest to", "opts": ["€0.36.", "€0.47.", "€0.54."], "ans": "B", "expl": "A. Incorrect because it reduces net income by the common and preferred dividend account.\nBasic EPS & (Net income - Common dividends - Preferred dividends) / weighted average number\nof shares outstanding) = (€80.000 - €16,000 - €10,000) / 150 000 = €0.36.\nB. Correct because Basic EPS (Net income - Preferred dividends)/(Weighted average number of\nshares outstanding) = (€80,000-€10,000)/150.000 = 0.47\nC. Incorrect because it uses the common shares outstanding at year end as the denominator.\nBasic EPS = €80,000 - €10,000) / 130,000 = €0.54\nFinancial Statement Analysis: describe how earnings per share is calculated and calculate and\ninterpret a company's basic and diluted earnings per share for companies with simple and\ncomplex capital structures including those with antidilutive securities.", "qhtml": null}, {"n": 27, "q": "Which of the following opinions is the best indication that the auditor believes that the financial statements depart materially from accounting standards and are not fairly presented?", "opts": ["Adverse opinion", "Qualified opinion", "Disclaimer of opinion"], "ans": "A", "expl": "A. Correct: ý kiến trái ngược (adverse opinion) được đưa ra khi kiểm toán viên kết luận báo cáo tài chính sai lệch trọng yếu so với chuẩn mực kế toán và không được trình bày trung thực, hợp lý.\nB. Incorrect: ý kiến ngoại trừ (qualified opinion) chỉ ra một số ngoại lệ/hạn chế nhưng phần còn lại của báo cáo vẫn trình bày trung thực.\nC. Incorrect: từ chối đưa ra ý kiến (disclaimer) xảy ra khi kiểm toán viên không thể thu thập đủ bằng chứng để đưa ra ý kiến, không phải khi phát hiện sai lệch trọng yếu."}, {"n": 28, "q": "An analyst gathers the following information about a company.\nPayables turnover 8\nInventory turnover 2\nReceivables over 10\nIf all purchases and sales were made on credit, the cash conversion cycle (based on a 360-day\nyear) is", "opts": ["99 days.", "171 days.", "251 days."], "ans": "B", "expl": "A. Incorrect because DSO was subtracted to derive CCC. Accordingly, CCC = DCH – DEO -\nNumber of days of payables = 180 – 36 - 45 = 99 days.\nB. Correct because Cash conversion cycle (CCC) = DOH + DSO - Number of days of payables.\nDOH = Number of days in period/ inventory turnover = 360/2 = 180 days.\nDSO = Number of days in period/ Receivables turnover-360/10 = 36 days.\nDNumber of days of paysites Number of days in period /Payables turnover = 360/8 = 45 days\nThus CCC = 180+36-45 = 171 days\nC. Incorrect because Number of days of payables was added to derive CCC Accordingly CCC =\nDCH + DRO + Number of days of payables = 180+36 +45 =261 days\nFinancial Statement Analysis: calculate and interpret activity, liquidity, solvency and profitability\nratios", "qhtml": null}, {"n": 29, "q": "An analyst gathers the following information (in $ thousands) about a company\nNet income 10,000\nGain on debt retirement 500\nDecrease in working capital 2,000\nCash flow from operating activities (in $ thousands) is", "opts": ["$8,500.", "$11,500.", "$12,000."], "ans": "B", "expl": "A. Incorrect because it reverses all signage and calculates Cash now from operating activities =\nNet income – Decrease in working capital + Gain on retirement on debt = 10.000 -2,000 + 500 -\n8,500\nB. Correct because Cash flow from operating activities = Net income + Decrease in working\ncapital - Gain on retirement on debt = 10,000+2000-500 = 11,500.\nC. Incorrect because it reverses the sign on gain on retirement on debt and calculates Cash flow\nfrom operating activities = Net income + Decrease in working capital + Gain on retirement on\ndebt = 10,000 + 2.000 – 500 = 12,500\nFinancial Statement Analysis: describe the steps in the preparation of direct and indirect cash\nflow statements, including how cash flows can be computed using Income statement and\nbalance sheet data", "qhtml": null}, {"n": 30, "q": "Which of the following may be reported using the modified retrospective method?", "opts": ["Corrections of prior period errors", "Changes in estimated useful life of PP&E", "Changes in accounting policies based on the new revenue recognition standard"], "ans": "C", "expl": "A. Incorrect because correction of an error for a prior period is handled by restating the\nfinancial statements including the balance presented sheet statement of owners’ equity, and\ncash flow statements to the prior periods, presented in the current financial statement in the\ncurrent. Thus, it uses the “full retrospective method\" which requires companies to restate prior\nperiods’ results\nB. Incorrect because changes accounting estimates are handled prospectively, with the change\naffecting the financial statements for the period of change and future periods.\nC. Correct because at times standard setters issue new standards that require companies to\nchange accounting policies. Depending on the standard, companies may be permitted to adopt\nthe standards prospectively (in the future) or retrospectively (restate financial statements as\nthough the standard existed in the past) while the new revenue recognition standard also\noffered companies the option of using a modified retrospective method of adoption. Under the\nmodified retrospective approach, companies were not required to revise previously reported\nfinancial statements. Instead, they adjusted the opening balances of retained earnings (and\nother applicable accounts) for the cumulative Impact of the new standard.\nFinancial Statement Analysis: describe the financial reporting treatment and analysis of non-\nrecurring items (including discontinued operations, unusual or infrequent items) and changes in\naccounting policies.", "qhtml": null}, {"n": 31, "q": "An analyst gathers the following information (in millions) about a company before any\nrevaluations:\nAverage total assets 20\nAverage total liabilities 0\nAverage total equity 12\nQ. An initial revaluation increases the carrying value of the asset valued under the\nrevaluation model. Ignoring taxes, the financial leverage ratio most way", "opts": ["decreases", "remains the same.", "increases"], "ans": "A", "expl": "A. Correct because an upward revaluation is treated the same as the amount in excess of the\nreversal amount. In other words, if a revaluation initially increases the carrying amount of the\nasset class, the increase in the carrying asset class bypasses the income statement and goes\ndirectly to equity under the heading of revaluation surplus. The financial leverage ratio is the\naverage total assets divided by average total equity. Increasing both the numerator (assets) and\ndenominator (equity) by the same amount leads to a decline in the (Mathematically, when a\nratio is greater than one, as in this case, an increase in both the numerator and the\ndenominator by the same amount leads to a decline in the ratio)\nB. Incorrect because leverage is the average total assets divided by average shareholders’\nequity, increasing both the numerator (assets) and denominator (equity) by the same amount\nleads to a decline in the ratio (Mathematically, when a ratio is greater than one, as in this case,\nan increase in both the numerator and the denominator by the same amount leads to a decline\nin the ratio).\nC. Incorrect because leverage is the average total assets divided by average shareholders'\nequity, increasing both the numerator (assets) and denominator (equity) by the same amount\nleads to a decline in the ratio (Mathematically, when a ratio is greater than one, as in this case,\nan increase in both the numerator and the denominator by the same amount leads to a decline\nin the ratio).", "qhtml": null}, {"n": 32, "q": "An analyst gathers the following information (in € thousands) about a company\nNet Income 143\nGain on sale of equipment 20\nDecrease in accounts receivable 38\nCash flow from operating activities (in € thousands) is", "opts": ["85", "161.", "201."], "ans": "B", "expl": "A. Incorrect because decrease in accounts receivable was deducted rather than added\nConsequently, cash flow from operating activities = Net income - gain on sale of equipment -\ndecrease in accounts receivable = 143 - 20 – 38 = 85.\nB. Correct because changes in working capital accounts include increases and decreases in the\ncurrent operating asset and liability accounts. To make the working capital adjustments under\nthe indirect method, any increase in a current operating asset account is subtracted from net\nincome and a net decrease is added to net income. When calculating operating cash flow under\nthe indirect method, gain on sale of assets are subjected from net income. Accordingly, cash\nflow from operating activities Net income gain on sale of equipment + decrease in accounts\nreceivable = 143-20+38 = 161\nC. Incorrect because gain on sale of equipment was added rather than deducted from net\nincome. Consequently, cash flow from operating activities = Net income + gain on sale of\nequipment decrease in accounts receivable= 143 +20 +36 =201", "qhtml": null}, {"n": 33, "q": "Under US GAAP and all else being equal in a period of stable inventory quantities and\nrising inventory unit costs. Which inventory valuation method is least likely to incur inventory\nwrite downs?", "opts": ["FIFO", "LIFO", "Weighted average cost"], "ans": "B", "expl": "A. Incorrect because companies that use specic identification, weighted average cost, or FIFO\nmethods are more likely to incur inventory write-downs then compares that use the LIFO\nmethod\nB. Correct because companies that use specific identification, weighted average cost, or FIFO\nmethods are more likely to incur inventory write-downs than companies that use the LIFO\nmethod. Under the LIFO method, the oldest costs are reflected in the inventory carrying\namount on the balance sheet. Given increasing inventory costs, the inventory carrying amounts\nunder the LIFO method are already conservatively presented at the oldest and lowest costs.\nThus, it is far less likely that inventory write-downs will occur under LIFO, and if a write-down\ndoes occur, it is likely to be of a lesser magnitude.\nC. Incorrect because companies that use specific identification, weighted average cost, or FIFO\nmethods are more likely to incur inventory write-downs than companies that use the LIFO\nmethod.", "qhtml": null}, {"n": 34, "q": "Which of the following analyses can be used to compare a company's financial ratios with\nthose of its major competitors?", "opts": ["Trend only", "Cross-sectional only", "Both trend and cross sectional"], "ans": "C", "expl": "A. Incorrect because both trend and cross-sectional analyses are used to compare a company's\nfinancial ratios with those of its competitors. In general, the financial ratios of a company are\ncompared with those of its major competitors (cross-sectional and trend analysis) and to the\ncompany's prior periods trend analysis)\nB. Incorrect because both trend and cross-sectional analyses are used to compare a company's\nfinancial ratios with those of is competitors. In general, the finance ratios of a company are\ncompared with those of is major competitors (cross sectional and trend analysis) and to the\ncompany's prior periods trend analysis).\nC. Correct because both types of analyses are used to compare a company's financial ratios with\nthose of its competitors. In general, the financial ratios of a company are compared with those\nof its major competitors (cross- sectional and trend analysis) and to the company's prior periods\n(trend analysis).\nFinancial Statement Analysis: calculate and interpret activity, liquidity, solvency, and profitability\nratios", "qhtml": null}, {"n": 35, "q": "An analyst gathers the following information about a company's fiscal year ended 31\nDecember\nNet income $210,000\nCommon shares outstanding on 1 January 50.000\nCommon shares repurchased on 1 April 20.000\nIf a 2-for-1 stock split took effect on 1 July, basic EPS for the year is", "opts": ["$3.00.", "$3.50.", "$4.20."], "ans": "A", "expl": "A. Correct because Basic EPS = (Net income – Preferred Dividends) / Weighted average number\nof shares outstanding = ($210,000 - $0) / [(50,000 × 3/12) + (30,000 × 9/12) * 2] = ($210,000) /\n[(12,500 + 22,500)*2] = $210,000 / 700,00 = $3.00.\nB. Incorrect because it incorrectly calculates the weighted average number of shares\noutstanding.\nC. Incorrect because it also miscalculates the weighted average number of shares outstanding.", "qhtml": null}, {"n": 36, "q": "An analyst gathers the following information about two companies in thousands)\nCompany 1 Company 2\nRevenue 7,586,000 9,445,000\nCost of goods sold 3,413,700 4,533,600\nResearch and development expense 1,800,000 1,800,000\nAdvertising expense 531,020 755,600\nBased only on the companies' common size income statements, it appears that", "opts": ["Company 1 spent more on advertising than Company 2", "both companies spent equally on research and development", "Company 1 has a higher gross profit margin than Company 2."], "ans": "C", "expl": "C. Correct because common-size analysis of the income statement can be performed by stating\neach line item on the income statement as a percentage of revenue. Accordingly. Company I's\ngross profit margin (7,586,000- 3.413,700) / 7,586,000 = 55%, being higher than Company 2's\ngross profit margin of (9,445,000-4.533,600) / 9.445,000 = 52%.\nFinancial Statement Analysis: evaluate a company's financial performance using common-site\nIncome statements and financial ratios based on the Income statement", "qhtml": null}, {"n": 37, "q": "A deferred tax liability could arise when", "opts": ["the tax base of an asset is greater than its carrying amount", "the carrying amount of a liability is greater than its tax base.", "financial accounting income tax expense exceeds income tax payable"], "ans": "C", "expl": "A. Incorrect because deferred tax assets, rather than deferred tax liabilities arise when the tax\nbase of an assets greater than its carrying amount\nB. Incorrect because deferred tax assets, rather than deferred tax abilities arise when the\ncarrying amount of a liability is greater than its tax base.\nC. Correct because deferred tax liabilities arise when a financial accounting income tax expense\nexceeds income taxes payable\nFinancial Statement Analysis: contrast accounting profit, xable income taxes payable, and\nincome tax expense and temporary versus permanent differences between accounting profit\nand taxable income", "qhtml": null}, {"n": 38, "q": "An analyst gathers the following information (in € millions) about a company's fiscal year:\nCost of goods sold 5,000\nIncrease in inventory 3,000\nIncrease in accounts payable 2.500\nCase paid to suppliers (in € millions) is", "opts": ["6,500.", "9,000.", "11,500."], "ans": "A", "expl": "A. Correct because Cash paid to suppliers = Cost of goods sold + Increase in inventory - Increase\nin accounts payable = €5,000 + €3,000 - €2,500 = €5,500 - €2,500 = €6,500.\nB. Incorrect because it excludes the increase in accounts payable and miscalculates Purchases\nfrom suppliers instead of Cash paid to suppliers.\nC. Incorrect because it mistakenly added, rather than subtracted the increase in accounts\npayable in the calculation of Cash paid to suppliers.\nFinancial Statement Analysis: demonstrate the conversion of cash flows from the indirect to\ndirect method", "qhtml": null}, {"n": 39, "q": "An analyst gathers the following information about a company for its fiscal year ended 31\nDecember:\nNet income €3 000 000\nCommon shares outstanding, January 3.500,000\nCommon shares issued, 1 April 1,000,000\nCommon shares outstanding 31 December 4,500,000\nConvertible preferred shares outstanding 400,000\nConvertible preformed dividend per share €1.00\nEach convertible preferred share is convertible into two common shares, if there are no other\npotentially dilutive securities outstanding, reported diluted EPS is closest to", "opts": ["€0.51", "€0.57", "€0.59"], "ans": "C", "expl": "C. Correct because Diluted EPS = Net income / (Weighted average number of common shares +\nNew common shares issued at conversion). Weighted average number of common shares\nduring the year = 3,500,000 + (1,000,000 × 9/12) = 4,250,000, considering the shares issued on\nApril 1, which are outstanding for 9 out of the 12 months of the year. New shares issued at\nconversion = 400,000 × 2 = 800,000. Diluted EPS = €3,000,000 / (4,250,000 + 800,000) =\n€3,000,000 / 5,050,000 = €0.5941 (rounded to €0.59).\nThe Basic EPS formula: Basic EPS = (Net income - Preferred dividend) / Weighted average\ncommon shares = (€3,000,000 - €400,000) / 4,250,000 = €2,600,000 / 4,250,000 = €0.6118. As\nthe reported diluted EPS of €0.59 is less than the basic EPS of €0.6118, the convertible preferred\nshares are not anti-dilutive. Therefore, the reported diluted EPS is €0.59.\nFinancial Statement Analysis: describe how earnings per share is calculated and calculate and\ninterpret a company's basic and diluted earnings per share for companies with simple and\ncomplex capital structures including those with antidilutive securities", "qhtml": null}, {"n": 40, "q": "An analyst gathers the following Information (in thousands) about a company.\nCash flow from operating activities 80\nCapital expenditures 15\nInterest paid and expensed 10\nIf interest paid is classified as a cash flow from operating activities and the income tax rate is\n20%, FCFF (in € thousands) is:", "opts": ["57", "65", "73"], "ans": "C", "expl": "A. Incorrect because it subtracted the after-tax interest adjustment instead of adding it back.\nTherefore, FCFF = 80 - 10 × (1 - 0.20) - 15 = 80 - (10 × 0.80) - 15 = 80 - 8 - 15 = €57.\nB. Incorrect because it incorrectly assumed that interest expensed and paid was included in\nfinancing activities and did not adjust for int(1 - Tax rate). Accordingly, FCFF = CFO – FCInv = 80 -\n15 = €65.\nC. Correct because FCFF can be computed from cash flow from operating activities as FCFF =\nCFO + int(1 - Tax rate) - FCInv. CFO represents cash flow from operating activities under US GAAP\nor under IFRS where the company has included interest paid in operating activities. Accordingly,\nFCFF = 80 + [10 × (1 - 0.20)] - 15 = 80 + (10 × 0.80) - 15 = 80 + 8 - 15 = €73.", "qhtml": null}, {"n": 41, "q": "A qualified audit opinion is most likely issued when financial statements are prepared", "opts": ["In compliance with accounting standards", "with material departures from accounting standards", "with some limitation or exception to accounting standards"], "ans": "C", "expl": "A. Incorrect because financial statements that are in compliance with accounting standards\ngenerally receive an unqualified (clean) opinion.\nB. Incorrect because material departures from accounting standards will typically result in an\nadverse opinion, not a qualified one.\nC. Correct because financial statements showing \"scope limitation or exception to accounting\nstandards\" will earn a qualified opinion.", "qhtml": null}, {"n": 42, "q": "Common size statements are most likely the output of which of the following phases of\nthe financial statement analysis framework?", "opts": ["Process data", "Analyze interpret the processed data", "Develop and communicate conclusions and recommendations"], "ans": "A", "expl": "A. Correct because common-size statements are an output of the \"process data\" phase of the\nfinancial statement analysis framework.\nB. Incorrect because analytical results, rather than common-size statements, are the output of\nthe \"analyze and interpret the processed data\" phase.\nC. Incorrect because analytical reports and recommendations, not common-size statements, are\nthe outputs of the \"develop and communicate conclusions and recommendations\" phase.", "qhtml": null}, {"n": 43, "q": "An analyst gathers the following information about a company's fiscal year ended 31\nDecember\nInterest payable on 1 January €45,000\nCash interest paid during the year €15,000\nInterest expense during the year €50,000\nInterest payable on 31 December is:", "opts": ["€30,000", "€80,000", "€95,000."], "ans": "B", "expl": "A. Incorrect because interest expense was not added. Accordingly, Ending interest payable =\nBeginning interest payable - Cash paid for Interest = €45,000 - €15,000 = €30,000.\nB. Correct because Ending Interest payable - Beginning Interest payable + Interest expense -\nCash paid for interest. Accordingly, Ending interest payable = Beginning interest payable +\nInterest expense - Cash paid for interest = €45,000 + €50,000 - €15,000 = €80,000.\nC. Incorrect because Cash paid for interest was not deducted. Accordingly, Ending interest\npayable = Beginning interest payable + Interest expense = €45,000 + €50,000 - €95,000.", "qhtml": null}, {"n": 44, "q": "An analyst gathers the following Information (in € thousands) about a company:\nFCFF 2500\nFCFE 1,300\nInterest paid 260\nIf Interest paid is classified as a cash flow from operating activities and the income tax rate is\n40%, net debt repayment (in € thousands) is closest to", "opts": ["940", "1,044.", "1,200."], "ans": "B", "expl": "A. Incorrect because it subtracts the entire interest payment instead of the net-of-tax interest\namount. Therefore, FCFF - Interest paid - FCFE does not equal net debt repayment. The\ncalculation results in 2,500 - 260 - 1,300 = 940, which is not the correct net debt repayment.\nB. Correct because FCFF = CFO + Interest paid (1 - Tax rate) – CapEx (“FCInv”). In addition FCFE =\nCFO - FCInv + Net debt repayment.\nRearranging FCFF: CFO - FCInv = FCFF - Interest paid (1 - Tax rate).\nRearranging FCFE: CFO - FCInv = FCFE + Net debt repayment.\nTherefore: FCFF - Interest paid (1 - Tax rate) = FCFE + Net debt repayment\n→ 2,500 - (260 × (1 - 40%)) = 1300 + Net debt repayment\nHence, Net debt repayment = 2,344 - 1,300 = 1,044.\nC. Incorrect because it assumes interest paid is classified as a cash flow from financing activities\nand doesn't need to be added back to CFO. Consequently, the calculations made are not in line\nwith the correct net debt repayment.", "qhtml": null}, {"n": 45, "q": "Deferred tax assets could arise when", "opts": ["taxable income exceeds accounting profit", "the carrying amount of assets exceeds their tax base.", "accounting income tax expense exceeds income taxes payable"], "ans": "A", "expl": "A. Correct because deferred tax assets, which appear on the balance sheet, arise when an\nexcess amount is paid for income taxes (taxable income higher than accounting profit).\nB. Incorrect because a deferred tax asset arises when the tax base of an asset exceeds its\ncarrying amount. Differences between the tax base and the carrying amount also result in\ndifferences between accounting profit and taxable income. Deductible temporary differences\nresult in a deferred tax asset when the tax base of an asset exceeds its carrying amount.\nC. Incorrect because deferred tax assets arise when the amount paid for taxes (taxes payable)\nexceeds the tax expense. A company's taxable income is the basis for its income tax payable (a\nliability) or recoverable (an asset) which is calculated on the basis of the company's tax rate and\nappears on its balance sheet. Deferred tax assets appear on the balance sheet when an excess\namount is paid for income taxes (taxable income higher than accounting profit), and the\ncompany expects to recover the difference during the course of future operations. Actual\nincome taxes payable may thus exceed the financial accounting income tax expense, which is\nbased on accounting profit.", "qhtml": null}, {"n": 46, "q": "Under US GAAP, in The second year of a multi-year lease, a lessee with an operating lease\nmost likely reports a:", "opts": ["higher interest expensethan it would if the lease were a finance lease", "lower deprecation expense than it would if the lease were a finance lease", "greater financing cash outflow that would if the lease were a finance lease."], "ans": "B", "expl": "A. Incorrect because the interest expense for a lessee with an operating lease is lower\ncompared to a finance lease (there is no interest expense under an operating lease). Under\nIFRS, there is a single accounting model for both finance and operating leases for lessors. At\nlease inception, the lessee records a lease payable liability and a \"right-of-use\" (ROU) asset on\nits balance sheet, both equal to the present value of future lease payments. The following\ndescribes how the transaction (under IFRS) affects the financial statements: interest expense on\nthe lease liability and the amortization expense related to the ROU asset are reported\nseparately on the income statement. However, under US GAAP, the interest and amortization\nexpenses related to the ROU asset are reported as a single operating expense on the income\nstatement. The interest and amortization components are not separately reported.\nB. Correct because In the case of operating leases under US GAAP, the lessee recognizes the\nlease payments as rent expense and does not report depreciation expense for the leased asset.\nThe payments made reflect the right-of-use (ROU) asset's amortization over the lease term. The\namortization expense and no depreciation expense are reported in the financial statements.\nC. Incorrect because financing cash outflow for a lessee with an operating lease is lower\ncompared to a finance lease under IFRS. There is a single accounting model for both finance and\noperating leases for lessors under IFRS. At lease inception, the lessee records a lease payable\nliability and a right-of-use (ROU) asset on its balance sheet, both equal to the present value of\nfuture lease payments. The principal repayment component of the lease liability is reported as a\ncash outflow under financing activities on the statement of cash flows. However, under US\nGAAP, the entire lease payment is reported as a cash outflow under operating activities on the\nstatement of cash flows. The interest and principal payment components are not reported\nseparately.", "qhtml": null}, {"n": 47, "q": "In common-size analysis of the cash flow statement, each line item of cash inflow may\nbe stated as a percentage of", "opts": ["total assets", "net revenue.", "net cash flow."], "ans": "B", "expl": "A. Incorrect because in common-size cash flow statement analysis, there are two common\napproaches. The primary approach is to express each line item of cash inflow or outflow as a\npercentage of the total inflows or outflows of cash. The secondary approach is to express each\nline item as a percentage of net revenue, not total assets.\nB. Correct because in common-size cash flow statement analysis, there are two prevalent\napproaches. The primary approach involves expressing each line item of cash inflow or outflow\nas a percentage of the total inflows or outflows of cash. The secondary approach is to express\neach line item as a percentage of net revenue.\nC. Incorrect because in common-size cash flow statement analysis, there are two alternative\napproaches. The primary approach is to express each line item of cash inflow or outflow as a\npercentage of the total inflows or outflows of cash. The secondary approach is to express each\nline item as a percentage of net revenue, not net cash flows.", "qhtml": null}, {"n": 48, "q": "Under US GAAP, which of the following is a required financial statement disclosure\nconcerning inventory?", "opts": ["Only the material amount of income resulting from the liquidation of LIFO inventory", "Only the amount of any reversal of any write down that is recognized as a reduction in cost of goods sold in the period", "Both the material amount of income resulting from the liquidation of LIFO inventory, and the amount of any reversal of any write down that is recognized as a reduction in cost of goods sold in the period"], "ans": "A", "expl": "A. Correct because disclosures are useful when analyzing a company. Under US GAAP, required\nfinancial statement disclosures concerning inventory include the accounting policies adopted in\nmeasuring inventories, including the cost formulas (inventory valuation methods) used.\nHowever, the second part of the disclosure regarding the amount of any reversal of write-downs\nthat reduce the cost of goods sold is not relevant under US GAAP, as US GAAP doesn't allow for\nthe reversal of prior-year inventory write-downs. US GAAP also requires disclosure of significant\nestimates applicable to inventories and any material amount of income resulting from the\nliquidation of LIFO inventory.\nB. Incorrect because the second part of the disclosure regarding the amount of any reversal of\nwrite-downs that reduce the cost of goods sold is not
