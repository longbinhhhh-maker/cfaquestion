 in the portfolio.\nThe weights of asset allocations in a portfolio will always sum to 100% (ie, 100% of the portfolio's value). A positive weight is assigned to long\npositions and a negative weight to short positions. Each data point is multiplied by its weight as follows:\nThe resulting individual weighted returns, showing the contribution of each asset class to total return, are then added together to reach the\nportfolio average of 3.6%.\n(Choice B) 4.5% is the arithmetic mean. It is a simple average that assigns equal weights to all observations, which is inappropriate in this case\nsince each asset class has a different allocation in the portfolio.\n(Choice C) 5.0% is the midpoint of the range of returns. It does not assign weights to observations.\nThings to remember:\nThe weighted mean is a measure of central tendency used when each observation has a different level of significance and therefore must have a\ndifferent weight in the average. The weights of asset allocations in a portfolio will always sum to 100% (ie, 100% of the portfolio's value). A\npositive weight is assigned to long positions and a negative weight to short positions.\nCalculate, interpret, and evaluate measures of central tendency and location to address an investment problem", "qhtml": null}, {"n": 35, "q": "An analyst calculates the mean and standard deviation for two companies over the same 7-year period: Company A: Mean is 9% and standard deviation is 20%. Company B: Mean is 14% and standard deviation is 30%. The most appropriate measure for determining which company offers less relative volatility is:", "opts": ["F-test.", "semideviation.", "coefficient of variation."], "ans": "C", "expl": "The standard deviation of asset returns measures the variation of returns around the mean; a higher standard deviation indicates more volatility\nand therefore more risk. An investor who prefers less risk may be tempted to reject Company B due to its higher standard deviation; however,\nCompany B also has a higher average return than Company A. Evaluating each company's risk relative to its return allows the investor to\ndetermine which offers less relative volatility.\nThe coefficient of variation (CV) is the ratio of an asset's standard deviation to its mean return. An asset with a higher CV is relatively more\nvolatile than one with a lower CV since it has higher risk per unit of return. In this question, Company A's CV is approximately 2.22, while\nCompany B's is approximately 2.14. This indicates that Company B has less risk per unit of return (ie, less relative volatility) than Company A,\nalthough it has a higher standard deviation.\n(Choice A) An F-test is used to determine if the variances of two populations are equal. It does not measure which of the two populations\ndemonstrates less volatility.\n(Choice B) Semideviation measures an asset's downside risk. It does not indicate relative volatility among multiple assets.\nThings to remember:\nFor asset returns, a higher standard deviation indicates greater risk. The coefficient of variation (CV) measures an asset's risk per unit of return.\nCV can be used to compare the relative risk of multiple assets. An asset with a higher CV is relatively riskier than one with a lower CV.\nCalculate, interpret, and evaluate measures of dispersion to address an investment problem", "qhtml": null}, {"n": 36, "q": "The annual returns for three funds over a nine-year period are listed in the following table: Annual Returns (%) Fund −12.3 −10.4 −3.7 1.8 3.9 4.3 7.1 8.6 9.9 1 Fund −8.4 -6.5 −4.9 −1.2 1.1 5.3 6.5 8.9 10.7 2 Fund −18.0 −13.9 −8.7 −2.3 3.4 5.7 6.2 13.3 15.8 3 The fund that had the highest 67th percentile of returns is most likely: ", "opts": ["Fund 1", "Fund 2", "Fund 3"], "ans": "A", "expl": "Deciles, quintiles, quartiles, and percentiles are all types of quantiles, which are measures of location for data sets. They provide the\nlocation at which a certain percentage of data is at or below. To find measures of location, data must be ordered.\nPercentiles split data sets into hundredths. For instance, 58th percentile marks the point that 58% of the data is at or below.\nMeasures of location can be calculated with the following equation:\nThe portfolio has nine stocks, so the location of the 67th percentile is:\nWhen the location is a decimal, linear interpolation is used to find the value of the quantile. Linear interpolation assumes that a straight line exists\nbetween the two known data points on each side of the location. The most efficient way to calculate a decimal quantile is as follows:\n(Choices B and C) Since all three funds have the same number of values, the location of the 67th percentile is the same for each. The 67th\npercentile of returns for Fund 2 is 6.14%, and 6.05% for Fund 3. Both of these are less than the 67th percentile of returns for Fund 1.\nThings to remember:\nWhen the quantile is a decimal, use linear interpolation to calculate the value.\nCalculate, interpret, and evaluate measures of central tendency and location to address an investment problem", "qhtml": null}, {"n": 37, "q": "The monthly returns of a mutual fund for the first six months of 20X0 are given below: If the sample standard deviation for this fund over the period is approximately 1.77%, the most appropriate conclusion is that the fund's sample semideviation for the same period is:", "opts": ["less than the standard deviation.", "equal to the standard deviation.", "greater than the standard deviation."], "ans": "A", "expl": "Variance and standard deviation measure the dispersion of returns both above and below the mean, so they offer investors an idea of an asset's\npotential upside as well as its downside. However, investors are often concerned with downside risk only. Semivariance and semideviation focus\non downside risk.\nFor any distribution of an asset's returns, semivariance is the average squared deviation below the mean, and semideviation is the positive\nsquare root of semivariance. Both measures can be calculated for a sample or a population. With sample semivariance and semideviation,\nremember to reduce the denominator by one. The steps for calculating the sample semivariance and semideviation are shown below:\nThe sample semideviation of 1.30% is less than the sample standard deviation of 1.77% (Choices B and C). This means that the fund's\ndownside risk is less than indicated by the standard deviation.\nRemember that semivariance and semideviation do not necessarily use only negative returns. Downside risk is defined as the risk that a return is\nbelow the mean, so semivariance and semideviation can be calculated based on both positive and negative returns.\nThings to remember:\nSemivariance and semideviation are dispersion measures that focus on an asset's downside risk (ie, risk that a return is less than the asset's\nmean return). They can be calculated based on positive and negative returns since it is possible for a return to be positive yet less than the mean\nreturn.\nCalculate, interpret, and evaluate measures of dispersion to address an investment problem", "qhtml": null}];
const CFG = {"title": "Wiley · Statistical Measures of Asset Returns", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Quantitative Methods · 37 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
