 năm ≈ 4.25% + ¼ × 1.00% = 4.50%. Trái phiếu của Company Z giao dịch rất ít nên phải cộng thêm phần bù thanh khoản → chi phí nợ cao hơn 4.5%.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Corporate Issuers · James Goodwin<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>James Goodwin is a corporate restructuring consultant.<\/p><p>Goodwin is hired by the board of Company X, a US clothing manufacturer that sells to three large US retailers. The board is considering several potential actions but is concerned about increasing the company's current WACC. The board asks Goodwin which of the following three actions would increase WACC in the short term: • Action 1: Expand the customer base from three retailers to five. • Action 2: Add a new children's clothing product line which has higher revenue potential and risk than current product lines. • Action 3: Buy back 20% of the company's outstanding option-free debt and issue putable bonds, leaving overall leverage unchanged.<\/p><p>Goodwin compares the cost of equity of Company Y, a privately held US company, under two different methods: the build-up approach and the expanded CAPM. For Company Y. the beta of a peer group of public companies is 0.8, the industry risk premium is 0.4%, and the equity risk premium is 2.0%.<\/p><p>Goodwin then computes the cost of debt for Company Z, an A-rated US chemical manufacturer. The company's debt consists of 7-year maturity, 5.00% coupon, option- free bonds which are very thinly traded. Goodwin uses a matrix approach to estimate Company Z's cost of debt and wants to adjust for its lack of liquidity. In Exhibit 1, he compiles average YTM data from highly liquid bonds of other companies in the same industry with the same credit rating.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-015.webp\" style=\"max-width:min(100%,354px)\" alt=\"Coupon Maturity 3.00% 4.00% 5.00% 6.00% 6 years 4.15% --- --- 4.35% 10 years --- 5.20% 5.30% ---\"><p>Company Z is also considering acquiring a target company for $72 per share. Management asks Goodwin to assess whether this offer would fairly value the target company. Goodwin collects data in Exhibit 2 for the target company and two recent takeovers of similar companies.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-016.webp\" style=\"max-width:min(100%,451px)\" alt=\"Target Company Takeover 1 Takeover 2 Acquisition price --- $42.00 $56.00 Earnings per share $8.50 $6.50 $7.20 Cash flow per share $15.00 $8.90 $12.10\"><p>To estimate a fair takeover price for the target company, Goodwin performs a comparable transaction analysis using a 60% weight on the cash flow multiple and a 40% weight on the earnings multiple. Goodwin will conclude that the $72 offer fairly values the target company if the offer price is within $5 of his estimated fair takeover price.<\/p><\/div><\/details><div class=\"qtext\"><p>Goodwin's estimate of the cost of debt for Company Z should be:<\/p><\/div>", "subj": "corporate"}, {"n": 36, "q": "Based on comparable transaction analysis, Goodwin should conclude that a $72-per- share offer by Company Z would:", "opts": ["undervalue the target company.", "fairly value the target company.", "overvalue the target company."], "ans": "C", "expl": "C is correct (lời giải bổ sung — file gốc thiếu đáp án câu này). P/CF: 42/8.90 = 4.72, 56/12.10 = 4.63 → trung bình 4.67; P/E: 42/6.50 = 6.46, 56/7.20 = 7.78 → trung bình 7.12. Giá trị theo dòng tiền = 15.00 × 4.67 = $70.10; theo lợi nhuận = 8.50 × 7.12 = $60.52. Giá hợp lý = 0.6 × 70.10 + 0.4 × 60.52 ≈ $66.27. Giá chào $72 cao hơn quá $5 → định giá cao (overvalue) công ty mục tiêu.", "explhtml": "<p><b>C is correct<\/b> (lời giải bổ sung — file gốc thiếu đáp án câu này). P/CF: 42/8.90 = 4.72, 56/12.10 = 4.63 → trung bình 4.67; P/E: 42/6.50 = 6.46, 56/7.20 = 7.78 → trung bình 7.12. Giá trị theo dòng tiền = 15.00 × 4.67 = $70.10; theo lợi nhuận = 8.50 × 7.12 = $60.52. Giá hợp lý = 0.6 × 70.10 + 0.4 × 60.52 ≈ $66.27. Giá chào $72 cao hơn quá $5 → định giá cao (overvalue) công ty mục tiêu.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Corporate Issuers · James Goodwin<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>James Goodwin is a corporate restructuring consultant.<\/p><p>Goodwin is hired by the board of Company X, a US clothing manufacturer that sells to three large US retailers. The board is considering several potential actions but is concerned about increasing the company's current WACC. The board asks Goodwin which of the following three actions would increase WACC in the short term: • Action 1: Expand the customer base from three retailers to five. • Action 2: Add a new children's clothing product line which has higher revenue potential and risk than current product lines. • Action 3: Buy back 20% of the company's outstanding option-free debt and issue putable bonds, leaving overall leverage unchanged.<\/p><p>Goodwin compares the cost of equity of Company Y, a privately held US company, under two different methods: the build-up approach and the expanded CAPM. For Company Y. the beta of a peer group of public companies is 0.8, the industry risk premium is 0.4%, and the equity risk premium is 2.0%.<\/p><p>Goodwin then computes the cost of debt for Company Z, an A-rated US chemical manufacturer. The company's debt consists of 7-year maturity, 5.00% coupon, option- free bonds which are very thinly traded. Goodwin uses a matrix approach to estimate Company Z's cost of debt and wants to adjust for its lack of liquidity. In Exhibit 1, he compiles average YTM data from highly liquid bonds of other companies in the same industry with the same credit rating.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-015.webp\" style=\"max-width:min(100%,354px)\" alt=\"Coupon Maturity 3.00% 4.00% 5.00% 6.00% 6 years 4.15% --- --- 4.35% 10 years --- 5.20% 5.30% ---\"><p>Company Z is also considering acquiring a target company for $72 per share. Management asks Goodwin to assess whether this offer would fairly value the target company. Goodwin collects data in Exhibit 2 for the target company and two recent takeovers of similar companies.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-016.webp\" style=\"max-width:min(100%,451px)\" alt=\"Target Company Takeover 1 Takeover 2 Acquisition price --- $42.00 $56.00 Earnings per share $8.50 $6.50 $7.20 Cash flow per share $15.00 $8.90 $12.10\"><p>To estimate a fair takeover price for the target company, Goodwin performs a comparable transaction analysis using a 60% weight on the cash flow multiple and a 40% weight on the earnings multiple. Goodwin will conclude that the $72 offer fairly values the target company if the offer price is within $5 of his estimated fair takeover price.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on comparable transaction analysis, Goodwin should conclude that a $72-per-<\/p><p>share offer by Company Z would:<\/p><\/div>", "subj": "corporate"}, {"n": 40, "q": "Given Cooper's expectations for the prices of WTI and heavy crude oil, which trade should she implement?", "opts": ["Trade 1", "Trade 2", "Trade 3"], "ans": "A", "expl": "A is correct. because a short volatility swap would be profitable if volatility is below market expectations. A volatility seller will profit if realized volatility is lower than expectations, whereas the counterparty volatility buyer anticipates higher than expected volatility. Therefore this position would bring a profit if Cooper's expectations (of volatility lower than market expectations for WTI) are realized.", "explhtml": "<p><b>A is correct.<\/b> because a short volatility swap would be profitable if volatility is below<\/p><p>market expectations. A volatility seller will profit if realized volatility is lower than expectations, whereas the counterparty volatility buyer anticipates higher than expected volatility. Therefore this position would bring a profit if Cooper's expectations (of volatility lower than market expectations for WTI) are realized.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 40–40 · Alternative Investments · Judith Cooper<\/summary><div class=\"vig-body\"><p>Judith Cooper is a portfolio manager at Minster, a hedge fund specializing in commodities. She is evaluating several trading strategies and reviewing her portfolio's positions.<\/p><p>Cooper considers futures trading strategies for six base metals. Her goal is to implement a time-series momentum strategy. The recent performance of several metal futures is presented in Exhibit 1. Cooper expects a contraction in global GDP growth over the next several months.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-017.webp\" style=\"max-width:min(100%,276px)\" alt=\"Trailing 6-month Metal Risk-adjusted Return Copper 3.2% Aluminum 2.8% Nickel 1.9% Zinc 0.8% Lead 0.5% Tin -1.1%\"><p>Minster's research department has identified the following potential futures trading strategies: • Strategy 1: Long positions in copper, aluminum, nickel, zinc, and lead; a short position in tin • Strategy 2: Long positions in copper, aluminum, and nickel; short positions in zinc, lead, and tin • Strategy 3: Short positions in all six metals<\/p><p>Next, Cooper reviews the portfolio's long energy futures positions. She collects the relevant closing price data ($ per unit) in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-018.webp\" style=\"max-width:min(100%,533px)\" alt=\"Price Brent Crude Oil Coal Heating Oil Spot price 72.50 349.41 3.18 Near-term futures price 74.64 342.36 3.69 Farther-term futures price 74.64 334.52 3.93\"><p>Cooper carries out further analysis of Brent crude oil. She observes that the direct storage cost of Brent crude oil over the farther-term is $3.50 per barrel.<\/p><p>After analyzing crude oil, Cooper concludes that the price of West Texas Intermediate (WTI) and heavy crude oil will decrease by 3% and 6%, respectively, over the next several months. In addition, she expects that volatility for WTI will be lower than market expectations. Based on this, Cooper considers the following trades:<\/p><p>• Trade 1: A short volatility swap on WTI • Trade 2: A basis swap which is short on WTI and long on heavy crude oil • Trade 3: A long position in an excess return swap on WTI that is based on the current price<\/p><\/div><\/details><div class=\"qtext\"><p>Given Cooper's expectations for the prices of WTI and heavy crude oil, which trade<\/p><p>should she implement?<\/p><\/div>", "subj": "alternatives"}, {"n": 41, "q": "The expected all-in 1-year USD return on Malshuk's hedged GBP zero-coupon bond position is closest to:", "opts": ["0.72%.", "1.00%.", "1.72%."], "ans": "C", "expl": "C is correct. because covered interest rate parity asserts that an investment in a fanдiди MAnsu mAuLsŁ inatullmsut fhat ia aamalotslu hodaod aarinat suahanas nato foreign money market instrument that is completely hedged against exchange rate risk should yield exactly the same return as an otherwise identical domestic money market investment. Malshuk therefore earns the USD interest rate. Given the spot exchange rate and the domestic and foreign yields, the forward exchange rate must equal the rate that gives these two alternative investment strategies—invest either in a domestic money market instrument or in a fully currency-hedged foreign money market instrument-exactly the same holding period return. If one strategy gave a higher holding period return than the other, then an investor could short-sell the lower-yielding approach and invest the proceeds in the higher-yielding approach, earning riskless arbitrage profits in the process. In real-world financial markets, such a disparity will be quickly arbitraged away so that no further arbitrage profits are available. Covered interest rate parity is thus said to be a no-arbitrage condition. No calculations are needed to answer this question. Therefore the spot rate at the time Malshuk enters into the transaction is not needed", "explhtml": "<p><b>C is correct.<\/b> because covered interest rate parity asserts that an investment in a<\/p><p>fanдiди MAnsu mAuLsŁ inatullmsut fhat ia aamalotslu hodaod aarinat suahanas nato foreign money market instrument that is completely hedged against exchange rate risk should yield exactly the same return as an otherwise identical domestic money market investment. Malshuk therefore earns the USD interest rate. Given the spot exchange rate and the domestic and foreign yields, the forward exchange rate must equal the rate that gives these two alternative investment strategies—invest either in a domestic money market instrument or in a fully currency-hedged foreign money market instrument-exactly the same holding period return. If one strategy gave a higher holding period return than the other, then an investor could short-sell the lower-yielding approach and invest the proceeds in the higher-yielding approach, earning riskless arbitrage profits in the process. In real-world financial markets, such a disparity will be quickly arbitraged away so that no further arbitrage profits are<\/p><p>available. Covered interest rate parity is thus said to be a no-arbitrage condition. No calculations are needed to answer this question. Therefore the spot rate at the time Malshuk enters into the transaction is not needed<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 41–44 · Economics · Georg Malshuk<\/summary><div class=\"vig-body\"><p>Georg Malshuk manages a multi-currency portfolio. To increase returns, he has introduced several currency strategies.<\/p><p>Malshuk buys a GBP 5 million zero-coupon bond with one year to maturity. At the same time, he completely hedges the exchange rate risk with a 1-year currency forward, buying USD at the no-arbitrage forward rate of 1.3367 USD/GBP. The 1-year USD interest rate is 1.72% and the 1-year GBP interest rate is 0.72%.<\/p><p>Six months later, as part of a periodic reporting requirement, he marks the USD/GBP forward contract to market based on the information in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-019.webp\" style=\"max-width:min(100%,372px)\" alt=\"Spot Rate (USD/GBP) 1.3585 6-month forward points on USD/GBP 68\"><p>6-month USD interest rate (annualized) 1.50% 6-month GBP interest rate (annualized) 0.50%<\/p><p>Malshuk analyzes carry strategies in different currencies and enters a 1-year carry trade involving the Brazilian real (BRL) and the USD. Exhibit 2 provides details relating to the trade.<\/p><p><b>Exhibit 2:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-020.webp\" style=\"max-width:min(100%,379px)\" alt=\"Current BRL/USD spot rate 3.1259 Expected BRL/USD spot rate in 1 year 3.1639 1-year BRL interest rate 8.25% 1-year USD interest rate 1.82%\"><p>Malshuk researches the fiscal and monetary policies of emerging market countries that have high capital mobility. Based on this research and the Mundell-Fleming model, he prepares a list of the countries whose currencies are expected to appreciate against the USD.<\/p><\/div><\/details><div class=\"qtext\"><p>The expected all-in 1-year USD return on Malshuk's hedged GBP zero-coupon bond<\/p><p>position is closest to:<\/p><\/div>", "subj": "economics"}, {"n": 42, "q": "With six months remaining in the contract term, the mark-to-market value (in USD) CAALLLAIICAICDD CLLlLL.. of Malshuk's USD/GBP forward contract is closest to:", "opts": ["-142,643.", "-141,935.", "143,000."], "ans": "B", "expl": "B is correct. because Malshuk's original hedging forward contract sold GBP 5 million versus USD at a USD/GBP forward price of 1.3367 and he now must buy GBP 5 million back to close the forward, ensuring the settlement dates for both contracts match. Sold GBP5,000,000 at 1.3367 = Bought USD6,683,500 Forward = Spot of 1.3585 + (68/10000) = 1.3653 Buy back GBP5,000,000 at the forward rate of 1.3653 = Sell USD6,826,500 Malshuk therefore originally sold GBP 5 million at 1.3367 versus a receipt of USD 6,683,500 and subsequently buys back GBP 5 million at 1.3653 versus a payment of 6,826,500. The GBP amounts net to zero at settlement date but the USD amount do not because the forward rate has changed. Initially Malshuk received USD 6,683,500 versus GBP and now Malshuk is paying USD 6,826,500 versus GBP for a loss of 6,683,500 - 6,826,500 = -143,000. This is a cash outflow for Malshuk but will not be paid for another 6 months and should therefore be discounted at the 6-month USD interest rate to calculate the present value; PV = -143,000/[1 + 0.015(180/360)] = - 141,935.", "explhtml": "<p><b>B is correct.<\/b> because Malshuk's original hedging forward contract sold GBP 5 million<\/p><p>versus USD at a USD/GBP forward price of 1.3367 and he now must buy GBP 5 million back to close the forward, ensuring the settlement dates for both contracts match. Sold GBP5,000,000 at 1.3367 = Bought USD6,683,500 Forward = Spot of 1.3585 + (68/10000) = 1.3653 Buy back GBP5,000,000 at the forward rate of 1.3653 = Sell USD6,826,500 Malshuk therefore originally sold GBP 5 million at 1.3367 versus a receipt of USD 6,683,500 and subsequently buys back GBP 5 million at 1.3653 versus a payment of 6,826,500. The GBP amounts net to zero at settlement date but the USD amount do not because the forward rate has changed. Initially Malshuk received USD 6,683,500 versus GBP and now Malshuk is paying USD 6,826,500 versus GBP for a loss of 6,683,500 - 6,826,500 = -143,000. This is a cash outflow for Malshuk but will not be paid fo rictive monetary policy and restrictive fiscal policy.", "restrictive monetary policy and expansionary fiscal policy.", "expansionary monetary policy and restrictive fiscal policy. Solution:"], "ans": "B", "expl": "B is correct. The Mundell-Fleming model asserts that an expansionary fiscal policy is likely to lead to upward pressure on interest rates because larger budget deficits must be financed. Restrictive monetary policies similarly implies higher interest rates. Given the high capital mobility, higher interest rates will attract foreign capital. This capital flow will put upward pressure on the exchange rate.", "explhtml": "<p><b>B is correct.<\/b> The Mundell-Fleming model asserts that an expansionary fiscal policy is<\/p><p>likely to lead to upward pressure on interest rates because larger budget deficits must be financed. Restrictive monetary policies similarly implies higher interest rates. Given the high capital mobility, higher interest rates will attract foreign capital. This capital flow will put upward pressure on the exchange rate.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 41–44 · Economics · Georg Malshuk<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Georg Malshuk manages a multi-currency portfolio. To increase returns, he has introduced several currency strategies.<\/p><p>Malshuk buys a GBP 5 million zero-coupon bond with one year to maturity. At the same time, he completely hedges the exchange rate risk with a 1-year currency forward, buying USD at the no-arbitrage forward rate of 1.3367 USD/GBP. The 1-year USD interest rate is 1.72% and the 1-year GBP interest rate is 0.72%.<\/p><p>Six months later, as part of a periodic reporting requirement, he marks the USD/GBP forward contract to market based on the information in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-019.webp\" style=\"max-width:min(100%,372px)\" alt=\"Spot Rat const CFG = {"title": "CFA Premium Mock 1 — Session 1", "subtitle": "CFA Level II · 41 câu · 2h12p", "minutes": 132, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,

};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

(function(){

  function fetchEmoji(group, el){

    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})

        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  if(graded) window.showGradedResult();

  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>

  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
</body>
</html>
