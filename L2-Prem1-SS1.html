 model. Our model assumes that a single factor drives all yield curve movements, and we continually analyze market factors to determine the mispricing of bonds. Although our model cannot be calibrated to current market data, it does permit mean reversion of rates, assumes constant volatility, and allows negative interest rates.\"<\/p><p>MacQuoid mentions to Client 3 that he can also use the binomial interest rate tree to value bonds. MacQuoid illustrates how the tree in Exhibit 2 can be used to value Bond X, a 2-year, 4% annual-pay coupon, option-free and default-free bond. MacQuoid assumes the branching from each node occurs with equal probability.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-006.webp\" style=\"max-width:min(100%,322px)\" alt=\"Binomial Interest Rate Tree Year 0 Year 1 3.00% 1.25% 0.75%\"><\/div><\/details><div class=\"qtext\"><p>The new interest-rate model described by Client 3 is most consistent with the:<\/p><\/div>", "subj": "fixed"}, {"n": 16, "q": "The value of Bond X is closest to:", "opts": ["100.91.", "104.79.", "106.10."], "ans": "B", "expl": "B is correct. because based on the binomial tree calculations below, using iO = current spot rate = 1.25% and Coupon = 4: 100 + 100 x 0.04 = 104. 104/(1 + 0075%) = 103.2258. Present Value at year 1 (downstate) = VL = 104/(1 + 3.0%) = 100.9709 C + (0.5 x VH + 0.5 x VL)/ (1 + i) = [4 + (0.5 ×103.2258 + 0.5 ×100.9709)]/(1 + 1.25%) = 104.7885 - 104.79.", "explhtml": "<p><b>B is correct.<\/b> because based on the binomial tree calculations below, using<\/p><p>iO = current spot rate = 1.25% and Coupon = 4:<\/p><p>100 + 100 x 0.04 = 104.<\/p><p>104/(1 + 0075%) = 103.2258. Present Value at year 1 (downstate) = VL = 104/(1 + 3.0%) = 100.9709<\/p><p>C + (0.5 x VH + 0.5 x VL)/ (1 + i) = [4 + (0.5 ×103.2258 + 0.5 ×100.9709)]/(1 + 1.25%) = 104.7885 - 104.79.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Fixed Income · Jarrod MacQuoid<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jarrod MacQuoid is meeting with several clients regarding their fixed-income investments. All bonds held in portfolios have a par value of 100. The current interest rates in their home country are presented in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-005.webp\" style=\"max-width:min(100%,258px)\" alt=\"Maturity Spot Rate УTM One year 7.40% 7.40% Two years 7.61% 7.60% Three years 8.15% 8.10% Four years 8.76% 8.65%\"><p>Client 1<\/p><p>Client 1 anticipates a large cash inflow in one year. He plans to use some of the new cash to build a summer home in three years, and wants to know what the rate would be for a 2-year zero-coupon, option-free and default-free bond issued one year from now.<\/p><p>Client 2<\/p><p>Client 2 is a portfolio manager at a small bank who asks MacQuoid to determine the arbitrage-free value of a bond he is considering purchasing. The bond is a 3-year, 6.0% annual-pay coupon, option-free and default-free bond.<\/p><p>Client 3<\/p><p>Client 3 runs a fixed-income fund that invests in a foreign country, and asks MacQuoid for advice on the fund's strategy. The client has recently started using a new interest- rate model which he describes to MacQuoid.<\/p><p>\"We perform our interest-rate modeling using an equilibrium term-structure model. Our model assumes that a single factor drives all yield curve movements, and we continually analyze market factors to determine the mispricing of bonds. Although our model cannot be calibrated to current market data, it does permit mean reversion of rates, assumes constant volatility, and allows negative interest rates.\"<\/p><p>MacQuoid mentions to Client 3 that he can also use the binomial interest rate tree to value bonds. MacQuoid illustrates how the tree in Exhibit 2 can be used to value Bond X, a 2-year, 4% annual-pay coupon, option-free and default-free bond. MacQuoid assumes the branching from each node occurs with equal probability.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-006.webp\" style=\"max-width:min(100%,322px)\" alt=\"Binomial Interest Rate Tree Year 0 Year 1 3.00% 1.25% 0.75%\"><\/div><\/details><div class=\"qtext\"><p>The value of Bond X is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 17, "q": "Which of the following banks relies most on financial models and unobservable inputs to measure the fair value of assets?", "opts": ["Sungda Bank", "Topliska Bank", "Vibetera Bank"], "ans": "A", "expl": "A is correct. because Level 3 inputs are unobservable. The fair value of a financial instrument is based on a model (or models) and unobservable inputs and Sungda Bank has the highest portion of Level 3 assets across \"total assets measured at fair value\" at 14.9%. See below calculation. measured at fair value", "explhtml": "<p><b>A is correct.<\/b> because Level 3 inputs are unobservable. The fair value of a financial<\/p><p>instrument is based on a model (or models) and unobservable inputs and Sungda Bank has the highest portion of Level 3 assets across \"total assets measured at fair value\" at 14.9%. See below calculation.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1a-021.webp\" style=\"max-width:min(100%,608px)\" alt=\"Total Assets Level 1 Level 2 Level 3 Total\"><p>measured at fair value<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1a-022.webp\" style=\"max-width:min(100%,608px)\" alt=\"Sungda Bank 1,524 46,396 8,378 56,298 Toplisk Bank 6,916 864 5 7,785 Viabter Bank 3,217 15,364 211 18,792 Of Total Sungda Bank 2.7% 82.4% 14.9% Toplisk Bank 88.8% 11.1% 0.1% Viabter Bank 17.1% 81.8% 1.1%\">", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Financial Statement Analysis · Megan Pey<\/summary><div class=\"vig-body\"><p>Megan Pey is an investment analyst covering the financial sector. Pey is reviewing Sungda Group, a listed holding company that operates Sungda Bank and Sungda Insurance. The group reports under US GAAP in USD and is subject to the Basel III requirements.<\/p><p>Sungda Bank Pey applies the CAMELS approach (Capital adequacy, Asset quality, Management capabilities, Earnings sufficiency, Liquidity position, and Sensitivity to market risk) to analyze Sungda Bank. Pey's research focuses particularly on the earnings quality and liquidity risk of the bank. She examines management discretion and estimates used in fair value measurements. Pey compares the year-end fair value hierarchy data (in USD millions) of Sungda Bank and two competitors, Topliska Bank and Vibetera Bank, for the most recent year in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-007.webp\" style=\"max-width:min(100%,633px)\" alt=\"Level1 Level 2 Level 3 Total Sungda Bank - total assets measured at fair value 1,524 46,396 8,378 56,298 Topliska Bank - total assets measured at fair value 6,916 864 5 7.785 Vibetera Bank - total assets measured at fair value 3,217 15,364 211 18,792\"><p>Pey lists three additional observations that she considers including as a part of her CAMELS analysis.<\/p><p>• Observation 1: Compared to its banking peers, Sungda Bank's CEO is paid a moderate base salary, with remaining compensation paid as equity-based incentives. • Observation 2: The assets under management at the bank's trust department are sizable and the fees generated contribute materially to the bank's business performance. • Observation 3: The board has appointed a rigorous risk management committee that consists of several sub-committees to provide oversight on various internal control aspects.<\/p><p>Sungda Insurance Pey compares Sungda Insurance, a company primarily offering property and casualty insurance products, with two competitors, Treetop Insurance and Umbrella Insurance. To assess their respective underwriting operations, Pey assembles the information in<\/p><p><b>Exhibit 2.<\/b><\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-008.webp\" style=\"max-width:min(100%,567px)\" alt=\"Sungda Treetop Umbrella Insurance Insurance Insurance\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-009.webp\" style=\"max-width:min(100%,549px)\" alt=\"Loss and loss ad justment expense ratio 64.2% 63.2% 66.7% Underwriting expense ratio 30.1% 31.8% 26.6%\"><p>Sungda Group recently announced plans to sell Sungda Insurance. To understand the group's decision, Pey notes the following developments in the market where Sungdo Insurance operates.<\/p><p>• Development 1: The market is gradually trending to a \"hard\" pricing market. • Development 2: The local regulator is raising minimum capital requirements on insurers. • Development 3: Global reinsurers are reducing the number of policies accepted from this market.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following banks relies most on financial models and unobservable inputs<\/p><p>to measure the fair value of assets?<\/p><\/div>", "subj": "fsa"}, {"n": 18, "q": "Which of Pey's observations most likely falls within the scope of a CAMELS analysis?", "opts": ["Observation 1", "Observation 2", "Observation 3"], "ans": "C", "expl": "C is correct. because the existence of the risk management committee and the oversight on various internal control aspects provide circumstantial evidence of management's quality, and management capability is a key component of CAMELS. Sound internal controls, are indicators of management effectiveness. For financial institutions, a particularly important aspect of management capability is the ability to identify and control risk.", "explhtml": "<p><b>C is correct.<\/b> because the existence of the risk management committee and the<\/p><p>oversight on various internal control aspects provide circumstantial evidence of management's quality, and management capability is a key component of CAMELS. Sound internal controls, are indicators of management effectiveness. For financial institutions, a particularly important aspect of management capability is the ability to identify and control risk.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Financial Statement Analysis · Megan Pey<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Megan Pey is an investment analyst covering the financial sector. Pey is reviewing Sungda Group, a listed holding company that operates Sungda Bank and Sungda Insurance. The group reports under US GAAP in USD and is subject to the Basel III requirements.<\/p><p>Sungda Bank Pey applies the CAMELS approach (Capital adequacy, Asset quality, Management capabilities, Earnings sufficiency, Liquidity position, and Sensitivity to market risk) to analyze Sungda Bank. Pey's research focuses particularly on the earnings quality and liquidity risk of the bank. She examines management discretion and estimates used in fair value measurements. Pey compares the year-end fair value hierarchy data (in USD millions) of Sungda Bank and two competitors, Topliska Bank and Vibetera Bank, for the most recent year in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-007.webp\" style=\"max-width:min(100%,633px)\" alt=\"Level1 Level 2 Level 3 Total Sungda Bank - total assets measured at fair value 1,524 46,396 8,378 56,298 Topliska Bank - total assets measured at fair value 6,916 864 5 7.785 Vibetera Bank - total assets measured at fair value 3,217 15,364 211 18,792\"><p>Pey lists three additional observations that she considers including as a part of her CAMELS analysis.<\/p><p>• Observation 1: Compared to its banking peers, Sungda Bank's CEO is paid a moderate base salary, with remaining compensation paid as equity-based incentives. • Observation 2: The assets under management at the bank's trust department are sizable and the fees generated contribute materially to the bank's business performance. • Observation 3: The board has appointed a rigorous risk management committee that consists of several sub-committees to provide oversight on various internal control aspects.<\/p><p>Sungda Insurance Pey compares Sungda Insurance, a company primarily offering property and casualty insurance products, with two competitors, Treetop Insurance and Umbrella Insurance. To assess their respective underwriting operations, Pey assembles the information in<\/p><p><b>Exhibit 2.<\/b><\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-008.webp\" style=\"max-width:min(100%,567px)\" alt=\"Sungda Treetop Umbrella Insurance Insurance Insurance\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-009.webp\" style=\"max-width:min(100%,549px)\" alt=\"Loss and loss ad justment expense ratio 64.2% 63.2% 66.7% Underwriting expense ratio 30.1% 31.8% 26.6%\"><p>Sungda Group recently announced plans to sell Sungda Insurance. To understand the group's decision, Pey notes the following developments in the market where Sungdo Insurance operates.<\/p><p>• Development 1: The market is gradually trending to a \"hard\" pricing market. • Development 2: The local regulator is raising minimum capital requirements on insurers. • Development 3: Global reinsurers are reducing the number of policies accepted from this market.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Pey's observations most likely falls within the scope of a CAMELS analysis?<\/p><\/div>", "subj": "fsa"}, {"n": 19, "q": "Which insurance company has the most efficient overall underwriting operation?", "opts": ["Sungda", "Treetop", "Umbrella"], "ans": "A", "expl": "A is correct. because the Combined ratio = Loss and loss adjustment expense ratio + Underwriting expense ratio. This ratio indicates the overall efficiency of an underwriting operation. A combined ratio of less than 100 is considered efficient. A lower ratio indicates higher success. Sungda Insurance's combined ratio is the lowest among Treetop Insurance and Umbrella Insurance and Sungda Insurance is the most efficient as follows: Sungda Insurance: 64.2% + 30.1% = 94.3% Treeteop Insurance: 63.2% + 31.8% = 95.0% Umbrella Insurance: 66.7% + 28.6% = 95.3%", "explhtml": "<p><b>A is correct.<\/b> because the Combined ratio = Loss and loss adjustment expense ratio +<\/p><p>Underwriting expense ratio. This ratio indicates the overall efficiency of an underwriting operation. A combined ratio of less than 100 is considered efficient. A lower ratio indicates higher success. Sungda Insurance's combined ratio is the lowest among Treetop Insurance and Umbrella Insurance and Sungda Insurance is the most efficient as follows: Sungda Insurance: 64.2% + 30.1% = 94.3% Treeteop Insurance: 63.2% + 31.8% = 95.0% Umbrella Insurance: 66.7% + 28.6% = 95.3%<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Financial Statement Analysis · Megan Pey<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Megan Pey is an investment analyst covering the financial sector. Pey is reviewing Sungda Group, a listed holding company that operates Sungda Bank and Sungda Insurance. The group reports under US GAAP in USD and is subject to the Basel III requirements.<\/p><p>Sungda Bank Pey applies the CAMELS approach (Capital adequacy, Asset quality, Management capabilities, Earnings sufficiency, Liquidity position, and Sensitivity to market risk) to analyze Sungda Bank. Pey's research focuses particularly on the earnings quality and liquidity risk of the bank. She examines management discretion and estimates used in fair value measurements. Pey compares the year-end fair value hierarchy data (in USD millions) of Sungda Bank and two competitors, Topliska Bank and Vibetera Bank, for the most recent year in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-007.webp\" style=\"max-width:min(100%,633px)\" alt=\"Level1 Level 2 Level 3 Total Sungda Bank - total assets measured at fair value 1,524 46,396 8,378 56,298 Topliska Bank - total assets measured at fair value 6,916 864 5 7.785 Vibetera Bank - total assets measured at fair value 3,217 15,364 211 18,792\"><p>Pey lists three additional observations that she considers including as a part of her CAMELS analysis.<\/p><p>• Observation 1: Compared to its banking peers, Sungda Bank's CEO is paid a moderate base salary, with remaining compensation paid as equity-based incentives. • Observation 2: The assets under management at the bank's trust department are sizable and the fees generated contribute materially to the bank's business performance. • Observation 3: The board has appointed a rigorous risk management committee that consists of several sub-committees to provide oversight on various internal control aspects.<\/p><p>Sungda Insurance Pey compares Sungda Insurance, a company primarily offering property and casualty insurance products, with two competitors, Treetop Insurance and Umbrella Insurance. To assess their respective underwriting operations, Pey assembles the information in<\/p><p><b>Exhibit 2.<\/b><\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-008.webp\" style=\"max-width:min(100%,567px)\" alt=\"Sungda Treetop Umbrella Insurance Insurance Insurance\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-009.webp\" style=\"max-width:min(100%,549px)\" alt=\"Loss and loss ad justment expense ratio 64.2% 63.2% 66.7% Underwriting expense ratio 30.1% 31.8% 26.6%\"><p>Sungda Group recently announced plans to sell Sungda Insurance. To understand the group's decision, Pey notes the following developments in the market where Sungdo Insurance operates.<\/p><p>• Development 1: The market is gradually trending to a \"hard\" pricing market. • Development 2: The local regulator is raising minimum capital requirements on insurers. • Development 3: Global reinsurers are reducing the number of policies accepted from this market.<\/p><\/div><\/details><div class=\"qtext\"><p>Which insurance company has the most efficient overall underwriting operation?<\/p><\/div>", "subj": "fsa"}, {"n": 20, "q": "Which of the following developments most likelyincreases risk for Sungda Insurance?", "opts": ["Development 1", "Development 2", "Development 3"], "ans": "C", "expl": "C is correct. because P&C insurers rely on reinsurance to diversify their risks but the global reinsurers reducing policies transferred from a market potentially restrains local P&C insurers' capability of issuing new policies and diversifying their risk. Property and casualty insurers try to minimize their payouts to insured parties. They may also diversify their risk by transferring policies, in whole or in part, to reinsurers. The lack of reinsurance availability is likely increasing the risk of Sungda Insurance.", "explhtml": "<p><b>C is correct.<\/b> because P&amp;C insurers rely on reinsurance to diversify their risks but the<\/p><p>global reinsurers reducing policies transferred from a market potentially restrains<\/p><p>local P&amp;C insurers' capability of issuing new policies and diversifying their risk. Property and casualty insurers try to minimize their payouts to insured parties. They may also diversify their risk by transferring policies, in whole or in part, to reinsurers. The lack of reinsurance availability is likely increasing the risk of Sungda Insurance.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Financial Statement Analysis · Megan Pey<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Megan Pey is an investment analyst covering the financial sector. Pey is reviewing Sungda Group, a listed holding company that operates Sungda Bank and Sungda Insurance. The group reports under US GAAP in USD and is subject to the Basel III requirements.<\/p><p>Sungda Bank Pey applies the CAMELS approach (Capital adequacy, Asset quality, Management capabilities, Earnings sufficiency, Liquidity position, and Sensitivity to market risk) to analyze Sungda Bank. Pey's research focuses particularly on the earnings quality and liquidity risk of the bank. She examines management discretion and estimates used in fair value measurements. Pey compares the year-end fair value hierarchy data (in USD millions) of Sungda Bank and two competitors, Topliska Bank and Vibetera Bank, for the most recent year in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-007.webp\" style=\"max-width:min(100%,633px)\" alt=\"Level1 Level 2 Level 3 Total Sungda Bank - total assets measured at fair value 1,524 46,396 8,378 56,298 Topliska Bank - total assets measured at fair value 6,916 864 5 7.785 Vibetera Bank - total assets measured at fair value 3,217 15,364 211 18,792\"><p>Pey lists three additional observations that she considers including as a part of her CAMELS analysis.<\/p><p>• Observation 1: Compared to its banking peers, Sungda Bank's CEO is paid a moderate base salary, with remaining compensation paid as equity-based incentives. • Observation 2: The assets under management at the bank's trust department are sizable and the fees generated contribute materially to the bank's business performance. • Observation 3: The board has appointed a rigorous risk management committee that consists of several sub-committees to provide oversight on various internal control aspects.<\/p><p>Sungda Insurance Pey compares Sungda Insurance, a company primarily offering property and casualty insurance products, with two competitors, Treetop Insurance and Umbrella Insurance. To assess their respective underwriting operations, Pey assembles the information in<\/p><p><b>Exhibit 2.<\/b><\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-008.webp\" style=\"max-width:min(100%,567px)\" alt=\"Sungda Treetop Umbrella Insurance Insurance Insurance\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-009.webp\" style=\"max-width:min(100%,549px)\" alt=\"Loss and loss ad justment expense ratio 64.2% 63.2% 66.7% Underwriting expense ratio 30.1% 31.8% 26.6%\"><p>Sungda Group recently announced plans to sell Sungda Insurance. To understand the group's decision, Pey notes the following developments in the market where Sungdo Insurance operates.<\/p><p>• Development 1: The market is gradually trending to a \"hard\" pricing market. • Development 2: The local regulator is raising minimum capital requirements on insurers. • Development 3: Global reinsurers are reducing the number of policies accepted from this market.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following developments most likelyincreases risk for Sungda<\/p><p>Insurance?<\/p><\/div>", "subj": "fsa"}, {"n": 21, "q": "The 5% annual parametric VaR for the foundation's investment in GEF is closest to:", "opts": ["$79,400.", "$834,400.", "$1,255,800."], "ans": "B", "expl": "B is correct. because this answer reflects the accurate application of the procedure for calculating annual VaR. There are 250 trading days in one year. Therefore, we multiply the mean daily return by 250 to get the mean annual return: 250 x 0.04% = 10.00% To get the annual standard deviation, we multiply the daily standard deviation by the square root of 250, or 15.811: 1.094% × 15.811 = 17.298% The annual VaR is then given by: 10.00% - (17.298% × 1.65) = -18.541% The annual VaR for the foundation's $4.5 million investment in GEF is then given by: 18.541% of $4,500,000 = 0.18541 × $4,500,000 = $834,351 ñ $834,400", "explhtml": "<p><b>B is correct.<\/b> because this answer reflects the accurate application of the procedure<\/p><p>for calculating annual VaR. There are 250 trading days in one year. Therefore, we multiply the mean daily return by 250 to get the mean annual return: 250 x 0.04% = 10.00% To get the annual standard deviation, we multiply the daily standard deviation by the square root of 250, or 15.811: 1.094% × 15.811 = 17.298% The annual VaR is then given by: 10.00% - (17.298% × 1.65) = -18.541% The annual VaR for the foundation's $4.5 million investment in GEF is then given by: 18.541% of $4,500,000 = 0.18541 × $4,500,000 = $834,351 ñ $834,400<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Portfolio Management · Clara Nagle<\/summary><div class=\"vig-body\"><p>Clara Nagle, a portfolio manager at an investment firm, prepares a report for clients invested in the firm's Global Equities Fund (GEF). Her report includes the following daily market estimates:<\/p><p>• Mean daily return: 0.04% • Daily standard deviation of returns: 1.094% • 5% daily parametric VaR: 1.765% • 5% daily incremental VaR (IVaR) from a potential 10% increase in emerging market equities: 0.345%<\/p><p>One of her clients, a charitable foundation, has $4.5 million invested in GEF. The foundation asks for an estimate of the 5% annual parametric VaR for its investment in GEF, which Nagle calculates assuming 250 trading days in a year. In the standard normal distribution, a 5% VaR is 1.65 standard deviations below the expected value.<\/p><p>The chair of the foundation's board contacts Nagle and asks her to interpret the IVaR metric provided in the report.<\/p><p>Nagle has developed a new fund focused on European equities, with a strategy focused on managing exposure to five factors. She backtests the strategy using 20 years of historical data. A Monte Carlo simulation is also used whereby the historical data is calibrated using random samples from a multivariate normal distribution of returns for the five factors. Exhibit 1 shows the Sharpe ratio and annual conditional VaR (CVaR) resulting from the backtest and Monte Carlo simulation approaches.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-010.webp\" style=\"max-width:min(100%,409px)\" alt=\"Sharpe Ratio CVaR Backtest 1.1 11.4% Monte Carlo simulation 1.0 5.2%\"><p>Nagle considers why the two approaches have produced different CVaR results.<\/p><p>Nagle also plans to establish a new fund investing in global technology equities. In determining her strategy for the fund, she develops 20 different strategies using factor-based models. The number of factors used in the different strategies ranges from five to nine. Nagle obtains point-in-time data going back 15 years and backtests all 20 strategies. After examining the results, she recommends to her firm's management that the new fund use the strategy that performed best in the backtests.<\/p><\/div><\/details><div class=\"qtext\"><p>The 5% annual parametric VaR for the foundation's investment in GEF is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 22, "q": "Which of the following is the best response to the foundation board chair's question about the IVAR metric?", "opts": ["The 5% daily VaR would be 2.110% with a 10% increase in emerging market equities", "The 5% daily VaR of the emerging market equities allocation in GEF's portfolio is 0.345%", "The 5% maximum daily loss would rise by 0.345% with a 10% increase in emerging market equities"], "ans": "A", "expl": "A is correct. because this statement Correctly interprets IVaR. IVaR measures the change in VaR resulting from a change in allocation of a portfolio: a risk manager often wants to know how the portfolio VaR will change if a position size is changed relative to the remaining positions. We recalculate the VaR under the proposed allocation, and the incremental VaR is the difference between the 'before' and 'after' VaR. The risk manager would calculate the VaR under the assumption that the change is made, and then the difference between the new VaR and the old VaR is the IVaR. This measure is useful because it reflects the effect of an anticipated change on the VaR. The 5% daily VaR of the portfolio is 1.765% and the IVaR from a potential 10% increase in the allocation to emerging market equities is 0.345%. Therefore, the 5% daily VaR after the increase is 1.765% + 0.345% = 2.110%.", "explhtml": "<p><b>A is correct.<\/b> because this statement Correctly interprets IVaR.<\/p><p>IVaR measures the change in VaR resulting from a change in allocation of a portfolio: a risk manager often wants to know how the portfolio VaR will change if a position size is changed relative to the remaining positions. We recalculate the VaR under the proposed allocation, and the incremental VaR is the difference between the 'before' and 'after' VaR. The risk manager would calculate the VaR under the assumption that the change is made, and then the difference between the new VaR and the old VaR is the IVaR. This measure is useful because it reflects the effect of an anticipated change on the VaR. The 5% daily VaR of the portfolio is 1.765% and the IVaR from a potential 10% increase in the allocation to emerging market equities is 0.345%. Therefore, the 5% daily VaR after the increase is 1.765% + 0.345% = 2.110%.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Portfolio Management · Clara Nagle<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Clara Nagle, a portfolio manager at an investment firm, prepares a report for clients invested in the firm's Global Equities Fund (GEF). Her report includes the following daily market estimates:<\/p><p>• Mean daily return: 0.04% • Daily standard deviation of returns: 1.094% • 5% daily parametric VaR: 1.765% • 5% daily incremental VaR (IVaR) from a potential 10% increase in emerging market equities: 0.345%<\/p><p>One of her clients, a charitable foundation, has $4.5 million invested in GEF. The foundation asks for an estimate of the 5% annual parametric VaR for its investment in GEF, which Nagle calculates assuming 250 trading days in a year. In the standard normal distribution, a 5% VaR is 1.65 standard deviations below the expected value.<\/p><p>The chair of the foundation's board contacts Nagle and asks her to interpret the IVaR metric provided in the report.<\/p><p>Nagle has developed a new fund focused on European equities, with a strategy focused on managing exposure to five factors. She backtests the strategy using 20 years of historical data. A Monte Carlo simulation is also used whereby the historical data is calibrated using random samples from a multivariate normal distribution of returns for the five factors. Exhibit 1 shows the Sharpe ratio and annual conditional VaR (CVaR) resulting from the backtest and Monte Carlo simulation approaches.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-010.webp\" style=\"max-width:min(100%,409px)\" alt=\"Sharpe Ratio CVaR Backtest 1.1 11.4% Monte Carlo simulation 1.0 5.2%\"><p>Nagle considers why the two approaches have produced different CVaR results.<\/p><p>Nagle also plans to establish a new fund investing in global technology equities. In determining her strategy for the fund, she develops 20 different strategies using factor-based models. The number of factors used in the different strategies ranges from five to nine. Nagle obtains point-in-time data going back 15 years and backtests all 20 strategies. After examining the results, she recommends to her firm's management that the new fund use the strategy that performed best in the backtests.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following is the best response to the foundation board chair's question<\/p><p>about the IVAR metric?<\/p><\/div>", "subj": "portfolio"}, {"n": 23, "q": "The bestexplanation for the different CVaR results in the tests of Nagle's new European equities strategy is that the:", "opts": ["historical returns of the five factors are highly correlated.", "distribution of historical factor returns exhibits excess kurtosis.", "distribution of historical factor returns exhibits positive skewness."], "ans": "B", "expl": "B is correct. because the smaller CVaR for the Monte Carlo simulation (5.2% versus 11.4% for the backtest) suggests that the multivariate normal distribution underestimates the downside risk of the strategy. Monte Carlo simulation randomly samples from a multivariate normal distribution, while backtesting is based on actual past returns. Therefore, the discrepancy between the output of the Monte Carlo simulation and the backtest is likely the result of a difference between the multivariate normal distribution and the actual distribution of returns for the strategy. The Sharpe ratios for the two methods are similar (1.0 for Monte Carlo versus 1.1 for the backtest), therefore overall risk levels (characterized by standard deviations) probably do not vary greatly. A larger CVaR for the backtest suggests that the actual downside risk might be higher than that indicated by the multivariate normal distribution. This could be a result of excess kurtosis (fat tails) and/or negative skewness. Note that the backtesting approach provides realistic performance metrics assuming investors have been following the same trading rules throughout the past periods under investigation. Monte Carlo simulation randomly samples from an assumed multivariate joint probability distribution (e.g., normal or another type of distribution), in a manner that the past record of asset returns is used to calibrate the parameters of the multivariate distribution. The Monte Carlo simulation appears to understate the downside risk of the BM strategy compared with both rolling- window backtesting and historical simulation methods. Because the factor returns are negatively skewed with fat tails (i.e., excess kurtosis), the multivariate normal InES_Ir_ distribution assumption is likely to be underestimating the true downside risk of the BM strategy.", "explhtml": "<p><b>B is correct.<\/b> because the smaller CVaR for the Monte Carlo simulation (5.2% versus<\/p><p>11.4% for the backtest) suggests that the multivariate normal distribution underestimates the downside risk of the strategy. Monte Carlo simulation randomly samples from a multivariate normal distribution, while backtesting is based on actual past returns. Therefore, the discrepancy between the output of the Monte Carlo simulation and the backtest is likely the result of a difference between the multivariate normal distribution and the actual distribution of returns for the strategy. The Sharpe ratios for the two methods are similar (1.0 for Monte Carlo versus 1.1 for the backtest), therefore overall risk levels (characterized by standard deviations) probably do not vary greatly. A larger CVaR for the backtest suggests that the actual downside risk might be higher than that indicated by the multivariate normal distribution. This could be a result of excess kurtosis (fat tails) and/or negative skewness.<\/p><p>Note that the backtesting approach provides realistic performance metrics assuming investors have been following the same trading rules throughout the past periods under investigation. Monte Carlo simulation randomly samples from an assumed multivariate joint probability distribution (e.g., normal or another type of distribution), in a manner that the past record of asset returns is used to calibrate the parameters of the multivariate distribution. The Monte Carlo simulation appears to understate the downside risk of the BM strategy compared with both rolling- window backtesting and historical simulation methods. Because the factor returns are negatively skewed with fat tails (i.e., excess kurtosis), the multivariate normal InES_Ir_<\/p><p>distribution assumption is likely to be underestimating the true downside risk of the BM strategy.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Portfolio Management · Clara Nagle<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Clara Nagle, a portfolio manager at an investment firm, prepares a report for clients invested in the firm's Global Equities Fund (GEF). Her report includes the following daily market estimates:<\/p><p>• Mean daily return: 0.04% • Daily standard deviation of returns: 1.094% • 5% daily parametric VaR: 1.765% • 5% daily incremental VaR (IVaR) from a potential 10% increase in emerging market equities: 0.345%<\/p><p>One of her clients, a charitable foundation, has $4.5 million invested in GEF. The foundation asks for an estimate of the 5% annual parametric VaR for its investment in GEF, which Nagle calculates assuming 250 trading days in a year. In the standard normal distribution, a 5% VaR is 1.65 standard deviations below the expected value.<\/p><p>The chair of the foundation's board contacts Nagle and asks her to interpret the IVaR metric provided in the report.<\/p><p>Nagle has developed a new fund focused on European equities, with a strategy focused on managing exposure to five factors. She backtests the strategy using 20 years of historical data. A Monte Carlo simulation is also used whereby the historical data is calibrated using random samples from a multivariate normal distribution of returns for the five factors. Exhibit 1 shows the Sharpe ratio and annual conditional VaR (CVaR) resulting from the backtest and Monte Carlo simulation approaches.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-010.webp\" style=\"max-width:min(100%,409px)\" alt=\"Sharpe Ratio CVaR Backtest 1.1 11.4% Monte Carlo simulation 1.0 5.2%\"><p>Nagle considers why the two approaches have produced different CVaR results.<\/p><p>Nagle also plans to establish a new fund investing in global technology equities. In determining her strategy for the fund, she develops 20 different strategies using factor-based models. The number of factors used in the different strategies ranges from five to nine. Nagle obtains point-in-time data going back 15 years and backtests all 20 strategies. After examining the results, she recommends to her firm's management that the new fund use the strategy that performed best in the backtests.<\/p><\/div><\/details><div class=\"qtext\"><p>The bestexplanation for the different CVaR results in the tests of Nagle's new<\/p><p>European equities strategy is that the:<\/p><\/div>", "subj": "portfolio"}, {"n": 24, "q": "The backtest results for Nagle's new global technology equities fund are most likely subject to:", "opts": ["data snooping.", "look-ahead bias.", "survivorship bias."], "ans": "A", "expl": "A is correct. because Nagle has selected a strategy using the results of backtests rather than using backtesting to test a specific strategy. Data snooping refers to making an inference-such as formulating an investment strategy-afterlooking at statistical results rather than testing a prior inference. Data snooping occurs when an analyst selects data or performs analyses until a significant result is found. An example is given of an analyst engaged in potential data snooping: She reports the development and backtesting of several different models: The number of factors ranged from 5 to 10, rebalancing periods were monthly and quarterly, and rolling windows were implemented for 5, 15, and 25 years of historical data. The analyst in this example selects the model with the best-performing statistics.", "explhtml": "<p><b>A is correct.<\/b> because Nagle has selected a strategy using the results of<\/p><p>backtests rather than using backtesting to test a specific strategy. Data snooping refers to making an inference-such as formulating an investment strategy-afterlooking at statistical results rather than testing a prior inference. Data snooping occurs when an analyst selects data or performs analyses until a significant result is found. An example is given of an analyst engaged in potential data snooping: She reports the development and backtesting of several different models: The number of factors ranged from 5 to 10, rebalancing periods were monthly and quarterly, and rolling windows were implemented for 5, 15, and 25 years of historical data. The analyst in this example selects the model with the best-performing statistics.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Portfolio Management · Clara Nagle<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Clara Nagle, a portfolio manager at an investment firm, prepares a report for clients invested in the firm's Global Equities Fund (GEF). Her report includes the following daily market estimates:<\/p><p>• Mean daily return: 0.04% • Daily standard deviation of returns: 1.094% • 5% daily parametric VaR: 1.765% • 5% daily incremental VaR (IVaR) from a potential 10% increase in emerging market equities: 0.345%<\/p><p>One of her clients, a charitable foundation, has $4.5 million invested in GEF. The foundation asks for an estimate of the 5% annual parametric VaR for its investment in GEF, which Nagle calculates assuming 250 trading days in a year. In the standard normal distribution, a 5% VaR is 1.65 standard deviations below the expected value.<\/p><p>The chair of the foundation's board contacts Nagle and asks her to interpret the IVaR metric provided in the report.<\/p><p>Nagle has developed a new fund focused on European equities, with a strategy focused on managing exposure to five factors. She backtests the strategy using 20 years of historical data. A Monte Carlo simulation is also used whereby the historical data is calibrated using random samples from a multivariate normal distribution of returns for the five factors. Exhibit 1 shows the Sharpe ratio and annual conditional VaR (CVaR) resulting from the backtest and Monte Carlo simulation approaches.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-010.webp\" style=\"max-width:min(100%,409px)\" alt=\"Sharpe Ratio CVaR Backtest 1.1 11.4% Monte Carlo simulation 1.0 5.2%\"><p>Nagle considers why the two approaches have produced different CVaR results.<\/p><p>Nagle also plans to establish a new fund investing in global technology equities. In determining her strategy for the fund, she develops 20 different strategies using factor-based models. The number of factors used in the different strategies ranges from five to nine. Nagle obtains point-in-time data going back 15 years and backtests all 20 strategies. After examining the results, she recommends to her firm's management that the new fund use the strategy that performed best in the backtests.<\/p><\/div><\/details><div class=\"qtext\"><p>The backtest results for Nagle's new global technology equities fund<\/p><p>are most likely subject to:<\/p><\/div>", "subj": "portfolio"}, {"n": 25, "q": "Based on the earnings components, the company whose earnings are most sustainable is:", "opts": ["Tengu.", "Pégase.", "Unicorn."], "ans": "A", "expl": "A is correct. because Tengu's ROE has the highest cash flow component of 60%. When earnings are decomposed into a cash component and an accruals component, research has shown that the cash component is more persistent. Earnings are the sum of cash flows and accruals, and they will be more sustainable and persistent when the cash flow component dominates earnings. If earnings have a significant accruals component, it may hasten the earnings' reversion to the mean, even more so when the accrual elements are outliers relative to the normal amount of accruals in a company's earnings.", "explhtml": "<p><b>A is correct.<\/b> because Tengu's ROE has the highest cash flow component of 60%.<\/p><p>When earnings are decomposed into a cash component and an accruals component, research has shown that the cash component is more persistent. Earnings are the sum of cash flows and accruals, and they will be more sustainable and persistent when the cash flow component dominates earnings. If earnings have a significant accruals component, it may hasten the earnings' reversion to the mean, even more so when the accrual elements are outliers relative to the normal amount of accruals in a company's earnings.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Financial Statement Analysis · Amelia Shah<\/summary><div class=\"vig-body\"><p>Amelia Shah is an analyst covering consumer goods for an investment management firm. She is following three companies that produce baby care products: Tengu Ltd., Pégase S.A., and Unicorn Inc. They are all similarly sized multinational companies reporting under IFRS.<\/p><p>Tengu, Pégase, and Unicorn have similar ROEs that are above the industry average. Shah applies the mean reversion principle to forecast the trends of their future ROEs, based on the earnings components shown in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-011.webp\" style=\"max-width:min(100%,476px)\" alt=\"Tengu Pégase Unicorn Accruals component 40% 50% 60% Cash flow component 60% 50% 40%\"><p>Shah then assesses the outputs of the Beneish model M-scores and the Altman model Z- scores in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-012.webp\" style=\"max-width:min(100%,489px)\" alt=\"Beneish Model M-score -2.6 -1.8 -1.1 Altman Model Z-score 3.0 1.8 2.4\"><p>Unicorn acquired a 50% equity interest in Antler Co. for USD 20 million at the end of the most recent year, but it did not assume control over Antler. Shah summarizes Antler's balance sheet (in USD millions) for the most recent year in Exhibit 3.<\/p><p><b>Exhibit 3<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-013.webp\" style=\"max-width:min(100%,442px)\" alt=\"Book Value Fair Value Current assets 6 6 Property, plant, and equipment 40 44 Total assets 46 50 Total liabilities 18 18 Net assets 28 32\"><p>Finally, Shah calculates Tengu's cash-flow-based accruals ratio for the most recent year, using the data summarized in Exhibit 4.<\/p><p><b>Exhibit 4<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-014.webp\" style=\"max-width:min(100%,473px)\" alt=\"Most Recent Year Line Item (in JPY 100 millions) Net income 66 Cash flow from operating activities 90 Cash flow from investing activities -99 Cash flow from financing activities -8 Average net operating assets 500\"><\/div><\/details><div class=\"qtext\"><p>Based on the earnings components, the company whose earnings are most sustainable<\/p><p>is:<\/p><\/div>", "subj": "fsa"}, {"n": 26, "q": "Based on the outputs of the Beneish and Altman models, the company with the highest probability of earnings manipulation is:", "opts": ["Tengu.", "Pégase.", "Unicorn."], "ans": "C", "expl": "C is correct. because Unicorn has the highest M-score of -11 out of the three companies. Higher M-scores (ie., less negative numbers) indicate an increased probability of earnings manipulation. The probability is given by the amount in the left side of the distribution. Note that the M-score is used to assess the likelihood of earnings manipulation under the Beneish model, while the Z-score is used for bankruptcy prediction under the Altman model.", "explhtml": "<p><b>C is correct.<\/b> because Unicorn has the highest M-score of -11 out of the three<\/p><p>companies. Higher M-scores (ie., less negative numbers) indicate an increased probability of earnings manipulation. The probability is given by the amount in the left side of the distribution. Note that the M-score is used to assess the likelihood of earnings manipulation under the Beneish model, while the Z-score is used for bankruptcy prediction under the Altman model.<\/p>", "qhtml": "<details class=\"vig\"><summary> based accruals ratio for the most recent year, using the data summarized in Exhibit 4.<\/p><p><b>Exhibit 4<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-014.webp\" style=\"max-width:min(100%,473px)\" alt=\"Most Recent Year Line Item (in JPY 100 millions) Net income 66 Cash flow from operating activities 90 Cash flow from investing activities -99 Cash flow from financing activities -8 Average net operating assets 500\"><\/div><\/details><div class=\"qtext\"><p>Tengu's cash-flow-based accruals ratio for the most recent year is:<\/p><\/div>", "subj": "fsa"}, {"n": 29, "q": "L' 29. By including the findings of the medical study in her industry report, does Badie violate the Standard relating to misrepresentation?", "opts": ["No", "Yes, because she uses the findings as part of her analysis", "Yes, because she fails to mention the medical conference she attended"], "ans": "A", "expl": "A is correct. because Badie does not violate Standard I(C) Misrepresentation. In all instances, a member or candidate must cite the actual source of the information. Best practice would be to obtain the information directly from the author and review it before citing it in a report. In that case, she would not need to report how she found out about the information.", "explhtml": "<p><b>A is correct.<\/b> because Badie does not violate Standard I(C) Misrepresentation. In all<\/p><p>instances, a member or candidate must cite the actual source of the information. Best practice would be to obtain the information directly from the author and review it before citing it in a report. In that case, she would not need to report how she found out about the information.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Ethics · Suzanne Badie<\/summary><div class=\"vig-body\"><p>Suzanne Badie, CFA, is a sell-side analyst covering the pharmaceutical industry for Seaside, an investment bank.<\/p><p>Badie attends a medical conference, where she hears a conference participant describe a medical study that reports a link between a new drug and the quality of sleep. When she returns to her office, Badie downloads the medical study and includes its findings as part of her analysis in her next industry report. In this report, she cites the study but does not mention the medical conference.<\/p><p>Badie prepares an analysis of Midsound Pharma. To help determine her recommendation, -'7- she uses the firm's approved quantitative model, which she did not create, as well as her own due diligence. She concludes that a \"buy\" recommendation on Midsound is appropriate and forecasts a 10% increase in its share price.<\/p><p>Shortly after Badie's recommendation is issued, Midsound suffers an unexpected quarterly loss and its share price declines by 25%. One of Seaside's retail clients, who is also a CFA charterholder, accuses Badie of violating the Standard relating to diligence and reasonable basis because Badie did not develop the quantitative model she used in analyzing Midsound, and because the value of the shares subsequently declined in contrast to her forecast.<\/p><p>Following the share sell-off, Midsound's CEO Troy Miller, CFA, decides that an acquisition by a competitor would be the best solution to increase the share price. Prior to any conversations with potential bidders, he announces that Midsound is already in negotiations with multiple acquirers. Miller's announcement leads to an immediate jump in Midsound's share price as the number of investor buy orders increases.<\/p><p>Badie plans to retire soon. In her spare time, she writes a proposal for a non- fiction book based on a behind-the-scenes look at the investment banking industry. She signs a book deal with a national publisher prior to leaving the investment bank. The book will rely upon the skills and experience she gained at Seaside, and provide readers with Badie's opinions on how to evaluate investments.<\/p><\/div><\/details><div class=\"qtext\"><p>L'<\/p><p>29. By including the findings of the medical study in her industry report, does Badie violate the Standard relating to misrepresentation?<\/p><\/div>", "subj": "ethics"}, {"n": 30, "q": "With regard to the client's accusations, does Badie violate the Standard relating to diligence and reasonable basis?", "opts": ["No", "Yes, because of her use of the quantitative model", "Yes, because of the share price performance relative to her forecast"], "ans": "A", "expl": "A is correct. because Badie does not violate Standard V(A) Diligence and Reasonable Basis. A member or candidate may rely on others in his or her firm to determine whether secondary or third-party research is sound and use the information in good faith unless the member or candidate has reason to question its validity or the processes and procedures used by those responsible for the research. For example, a portfolio manager may not have a choice of a data source because the firm's senior managers conducted due diligence to determine which vendor would provide services; the member or candidate can use the information in good faith assuming the due diligence process was deemed adequate. Badie did her own due diligence in arriving at her recommendation, so she did not violate Standard V(A). Additionally, analysis of an investment that results in a reasonable basis for recommendation does not guarantee that the investment has no downside risk. So Badie is not at fault because the stock's performance subsequent to her recommendation did not meet her expectations.", "explhtml": "<p><b>A is correct.<\/b> because Badie does not violate Standard V(A) Diligence and Reasonable<\/p><p>Basis. A member or candidate may rely on others in his or her firm to determine whether secondary or third-party research is sound and use the information in good faith unless the member or candidate has reason to question its validity or the processes and procedures used by those responsible for the research. For example, a portfolio manager may not have a choice of a data source because the firm's senior managers conducted due diligence to determine which vendor would provide services; the member or candidate can use the information in good faith assuming the due diligence process was deemed adequate. Badie did her own due diligence in arriving at her recommendation, so she did not violate Standard V(A). Additionally, analysis of an investment that results in a reasonable basis for recommendation does not guarantee that the investment has no downside risk. So Badie is not at fault because the stock's performance subsequent to her recommendation did not meet her expectations.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Ethics · Suzanne Badie<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Suzanne Badie, CFA, is a sell-side analyst covering the pharmaceutical industry for Seaside, an investment bank.<\/p><p>Badie attends a medical conference, where she hears a conference participant describe a medical study that reports a link between a new drug and the quality of sleep. When she returns to her office, Badie downloads the medical study and includes its findings as part of her analysis in her next industry report. In this report, she cites the study but does not mention the medical conference.<\/p><p>Badie prepares an analysis of Midsound Pharma. To help determine her recommendation, -'7- she uses the firm's approved quantitative model, which she did not create, as well as her own due diligence. She concludes that a \"buy\" recommendation on Midsound is appropriate and forecasts a 10% increase in its share price.<\/p><p>Shortly after Badie's recommendation is issued, Midsound suffers an unexpected quarterly loss and its share price declines by 25%. One of Seaside's retail clients, who is also a CFA charterholder, accuses Badie of violating the Standard relating to diligence and reasonable basis because Badie did not develop the quantitative model she used in analyzing Midsound, and because the value of the shares subsequently declined in contrast to her forecast.<\/p><p>Following the share sell-off, Midsound's CEO Troy Miller, CFA, decides that an acquisition by a competitor would be the best solution to increase the share price. Prior to any conversations with potential bidders, he announces that Midsound is already in negotiations with multiple acquirers. Miller's announcement leads to an immediate jump in Midsound's share price as the number of investor buy orders increases.<\/p><p>Badie plans to retire soon. In her spare time, she writes a proposal for a non- fiction book based on a behind-the-scenes look at the investment banking industry. She signs a book deal with a national publisher prior to leaving the investment bank. The book will rely upon the skills and experience she gained at Seaside, and provide readers with Badie's opinions on how to evaluate investments.<\/p><\/div><\/details><div class=\"qtext\"><p>With regard to the client's accusations, does Badie violate the Standard relating to<\/p><p>diligence and reasonable basis?<\/p><\/div>", "subj": "ethics"}, {"n": 31, "q": "Miller's comments violate the Standard relating to:", "opts": ["material nonpublic information.", "transaction-based manipulation.", "information-based manipulation."], "ans": "C", "expl": "C is correct. because Miller engages in information-based manipulation and violates Standard II(B) Market Manipulation by implying that the firm has interest from multiple acquirers when, in fact, he is hoping to attract the first bidder. Information- based manipulation includes, but is not limited to, spreading false rumors to induce trading by others. Members and candidates must refrain from \"pumping up\" the price of an investment by issuing misleading positive information.", "explhtml": "<p><b>C is correct.<\/b> because Miller engages in information-based manipulation and violates<\/p><p>Standard II(B) Market Manipulation by implying that the firm has interest from multiple acquirers when, in fact, he is hoping to attract the first bidder. Information- based manipulation includes, but is not limited to, spreading false rumors to induce trading by others. Members and candidates must refrain from \"pumping up\" the price of an investment by issuing misleading positive information.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Ethics · Suzanne Badie<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Suzanne Badie, CFA, is a sell-side analyst covering the pharmaceutical industry for Seaside, an investment bank.<\/p><p>Badie attends a medical conference, where she hears a conference participant describe a medical study that reports a link between a new drug and the quality of sleep. When she returns to her office, Badie downloads the medical study and includes its findings as part of her analysis in her next industry report. In this report, she cites the study but does not mention the medical conference.<\/p><p>Badie prepares an analysis of Midsound Pharma. To help determine her recommendation, -'7- she uses the firm's approved quantitative model, which she did not create, as well as her own due diligence. She concludes that a \"buy\" recommendation on Midsound is appropriate and forecasts a 10% increase in its share price.<\/p><p>Shortly after Badie's recommendation is issued, Midsound suffers an unexpected quarterly loss and its share price declines by 25%. One of Seaside's retail clients, who is also a CFA charterholder, accuses Badie of violating the Standard relating to diligence and reasonable basis because Badie did not develop the quantitative model she used in analyzing Midsound, and because the value of the shares subsequently declined in contrast to her forecast.<\/p><p>Following the share sell-off, Midsound's CEO Troy Miller, CFA, decides that an acquisition by a competitor would be the best solution to increase the share price. Prior to any conversations with potential bidders, he announces that Midsound is already in negotiations with multiple acquirers. Miller's announcement leads to an immediate jump in Midsound's share price as the number of investor buy orders increases.<\/p><p>Badie plans to retire soon. In her spare time, she writes a proposal for a non- fiction book based on a behind-the-scenes look at the investment banking industry. She signs a book deal with a national publisher prior to leaving the investment bank. The book will rely upon the skills and experience she gained at Seaside, and provide readers with Badie's opinions on how to evaluate investments.<\/p><\/div><\/details><div class=\"qtext\"><p>Miller's comments violate the Standard relating to:<\/p><\/div>", "subj": "ethics"}, {"n": 32, "q": "With regard to her book, does Badie violate the Standard relating to loyalty to employers?", "opts": ["No", "Yes, by signing the book deal prior to retirement", "Yes, by relying upon the skills and experience gained at Seaside"], "ans": "A", "expl": "A is correct. because Badie does not violate Standard IV(A) Loyalty by using her skills and experience gained at Seaside or by signing the book deal prior to retirement. A departing employee is generally free to make arrangements or preparations to go into a competitive business before terminating the relationship with his or her employer as long as such preparations do not breach the employee's duty of loyalty. Badie is not entering a competing business. Additionally, Badie does not misuse confidential information or misappropriate trade secrets in violation of Standard IV(A) by using the skills and experience gained at Seaside to write her book. Once an employee has left the firm, the skills and experience that an employee obtained while employed are not 'confidential' or 'privileged' information.", "explhtml": "<p><b>A is correct.<\/b> because Badie does not violate Standard IV(A) Loyalty by using her skills<\/p><p>and experience gained at Seaside or by signing the book deal prior to retirement. A departing employee is generally free to make arrangements or preparations to go into a competitive business before terminating the relationship with his or her employer as long as such preparations do not breach the employee's duty of loyalty. Badie is not entering a competing business. Additionally, Badie does not misuse confidential information or misappropriate trade secrets in violation of Standard IV(A) by using the skills and experience gained at Seaside to write her book. Once an employee has left the firm, the skills and experience that an employee obtained while employed are not 'confidential' or 'privileged' information.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Ethics · Suzanne Badie<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Suzanne Badie, CFA, is a sell-side analyst covering the pharmaceutical industry for Seaside, an investment bank.<\/p><p>Badie attends a medical conference, where she hears a conference participant describe a medical study that reports a link between a new drug and the quality of sleep. When she returns to her office, Badie downloads the medical study and includes its findings as part of her analysis in her next industry report. In this report, she cites the study but does not mention the medical conference.<\/p><p>Badie prepares an analysis of Midsound Pharma. To help determine her recommendation, -'7- she uses the firm's approved quantitative model, which she did not create, as well as her own due diligence. She concludes that a \"buy\" recommendation on Midsound is appropriate and forecasts a 10% increase in its share price.<\/p><p>Shortly after Badie's recommendation is issued, Midsound suffers an unexpected quarterly loss and its share price declines by 25%. One of Seaside's retail clients, who is also a CFA charterholder, accuses Badie of violating the Standard relating to diligence and reasonable basis because Badie did not develop the quantitative model she used in analyzing Midsound, and because the value of the shares subsequently declined in contrast to her forecast.<\/p><p>Following the share sell-off, Midsound's CEO Troy Miller, CFA, decides that an acquisition by a competitor would be the best solution to increase the share price. Prior to any conversations with potential bidders, he announces that Midsound is already in negotiations with multiple acquirers. Miller's announcement leads to an immediate jump in Midsound's share price as the number of investor buy orders increases.<\/p><p>Badie plans to retire soon. In her spare time, she writes a proposal for a non- fiction book based on a behind-the-scenes look at the investment banking industry. She signs a book deal with a national publisher prior to leaving the investment bank. The book will rely upon the skills and experience she gained at Seaside, and provide readers with Badie's opinions on how to evaluate investments.<\/p><\/div><\/details><div class=\"qtext\"><p>With regard to her book, does Badie violate the Standard relating to loyalty to<\/p><p>employers?<\/p><\/div>", "subj": "ethics"}, {"n": 33, "q": "Which action considered by Company X's board would most likely increase WACC?", "opts": ["Action 1", "Action 2", "Action 3"], "ans": "B", "expl": "B is correct. because Action 2 increases WACC. Even though entering the riskier market has higher return potential, it also decreases the earnings predictability and stability. For a given level of debt, a company with greater predictability and lower associated volatility in its revenues, earnings, and cash flow streams is likely to have a lower probability of default and a narrower credit spread, resulting in a lower cost of debt and equity capital.", "explhtml": "<p><b>B is correct.<\/b> because Action 2 increases WACC. Even though entering the riskier<\/p><p>market has higher return potential, it also decreases the earnings predictability and stability. For a given level of debt, a company with greater predictability and lower associated volatility in its revenues, earnings, and cash flow streams is likely to have a lower probability of default and a narrower credit spread, resulting in a lower cost of debt and equity capital.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Corporate Issuers · James Goodwin<\/summary><div class=\"vig-body\"><p>James Goodwin is a corporate restructuring consultant.<\/p><p>Goodwin is hired by the board of Company X, a US clothing manufacturer that sells to three large US retailers. The board is considering several potential actions but is concerned about increasing the company's current WACC. The board asks Goodwin which of the following three actions would increase WACC in the short term: • Action 1: Expand the customer base from three retailers to five. • Action 2: Add a new children's clothing product line which has higher revenue potential and risk than current product lines. • Action 3: Buy back 20% of the company's outstanding option-free debt and issue putable bonds, leaving overall leverage unchanged.<\/p><p>Goodwin compares the cost of equity of Company Y, a privately held US company, under two different methods: the build-up approach and the expanded CAPM. For Company Y. the beta of a peer group of public companies is 0.8, the industry risk premium is 0.4%, and the equity risk premium is 2.0%.<\/p><p>Goodwin then computes the cost of debt for Company Z, an A-rated US chemical manufacturer. The company's debt consists of 7-year maturity, 5.00% coupon, option- free bonds which are very thinly traded. Goodwin uses a matrix approach to estimate Company Z's cost of debt and wants to adjust for its lack of liquidity. In Exhibit 1, he compiles average YTM data from highly liquid bonds of other companies in the same industry with the same credit rating.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-015.webp\" style=\"max-width:min(100%,354px)\" alt=\"Coupon Maturity 3.00% 4.00% 5.00% 6.00% 6 years 4.15% --- --- 4.35% 10 years --- 5.20% 5.30% ---\"><p>Company Z is also considering acquiring a target company for $72 per share. Management asks Goodwin to assess whether this offer would fairly value the target company. Goodwin collects data in Exhibit 2 for the target company and two recent takeovers of similar companies.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-016.webp\" style=\"max-width:min(100%,451px)\" alt=\"Target Company Takeover 1 Takeover 2 Acquisition price --- $42.00 $56.00 Earnings per share $8.50 $6.50 $7.20 Cash flow per share $15.00 $8.90 $12.10\"><p>To estimate a fair takeover price for the target company, Goodwin performs a comparable transaction analysis using a 60% weight on the cash flow multiple and a 40% weight on the earnings multiple. Goodwin will conclude that the $72 offer fairly values the target company if the offer price is within $5 of his estimated fair takeover price.<\/p><\/div><\/details><div class=\"qtext\"><p>Which action considered by Company X's board would most likely increase WACC?<\/p><\/div>", "subj": "corporate"}, {"n": 34, "q": "The cost of equity for Company Y under the build-up approach is:", "opts": ["lower than under the expanded CAPM.", "the same as under the expanded CAPM.", "higher than under the expanded CAPM."], "ans": "B", "expl": "B is correct. because the two methods result in the same cost of equity estimate in this particular case. The expanded CAPM estimates the cost of equity re as follows: re= rf +ßpeer x ERP + SP + IP + SCRP, where rf is the risk-free rate, ßpeer is the industry beta, SP is the size premium, IP is the industry risk premium, and SCRP is the specific-company risk premium. The build-up approach estimates the cost of equity re as follows: re =rf + ERP + SP + SCRP, where variables are as per above. In other words, the build- up approach assumes that the industry beta ßpeer is 1 and the industry risk premium IP is O. If ßpeer × ERP + IP - ERP = (ßpeer - 1) × ERP + IP › O, then the cost of equity from the expanded CAPM is higher than the cost of equity from the build-up approach. Conversely, if (Bpeer - 1) x ERP + IP ‹ O, then the cost of equity from the expanded CAPM is lower than the cost of equity from the build-up approach. In our case, (Bpeer - 1) × ERP + IP = -0.2 x 2% + 0.4% = 0, therefore the two estimates are equal. Should one calculate the two estimates, one would obtain: Cost of equity using build-up approach = rf + 2% + SP + SCRP Cost of equity using expanded CAPM = rf + 0.8 × 2% + 0.4% + SP + SCRP = rf + 2% + SP + SCRP The two estimates are therefore identical. SP + SCRP", "explhtml": "<p><b>B is correct.<\/b> because the two methods result in the same cost of equity estimate in<\/p><p>this particular case. The expanded CAPM estimates the cost of equity re as follows: re= rf +ßpeer x ERP + SP + IP + SCRP, where rf is the risk-free rate, ßpeer is the industry beta, SP is the size premium, IP is the industry risk premium, and SCRP is the specific-company risk premium. The build-up approach estimates the cost of equity re as follows: re =rf + ERP + SP + SCRP, where variables are as per above. In other words, the build- up approach assumes that the industry beta ßpeer is 1 and the industry risk premium IP is O. If ßpeer × ERP + IP - ERP = (ßpeer - 1) × ERP + IP › O, then the cost of equity from the expanded CAPM is higher than the cost of equity from the build-up approach. Conversely, if (Bpeer - 1) x ERP + IP ‹ O, then the cost of equity from the expanded CAPM is lower than the cost of equity from the build-up approach. In our case, (Bpeer - 1) × ERP + IP = -0.2 x 2% + 0.4% = 0, therefore the two estimates are equal.<\/p><p>Should one calculate the two estimates, one would obtain: Cost of equity using build-up approach = rf + 2% + SP + SCRP Cost of equity using expanded CAPM = rf + 0.8 × 2% + 0.4% + SP + SCRP = rf + 2% + SP + SCRP The two estimates are therefore identical.<\/p><p>SP + SCRP<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Corporate Issuers · James Goodwin<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>James Goodwin is a corporate restructuring consultant.<\/p><p>Goodwin is hired by the board of Company X, a US clothing manufacturer that sells to three large US retailers. The board is considering several potential actions but is concerned about increasing the company's current WACC. The board asks Goodwin which of the following three actions would increase WACC in the short term: • Action 1: Expand the customer base from three retailers to five. • Action 2: Add a new children's clothing product line which has higher revenue potential and risk than current product lines. • Action 3: Buy back 20% of the company's outstanding option-free debt and issue putable bonds, leaving overall leverage unchanged.<\/p><p>Goodwin compares the cost of equity of Company Y, a privately held US company, under two different methods: the build-up approach and the expanded CAPM. For Company Y. the beta of a peer group of public companies is 0.8, the industry risk premium is 0.4%, and the equity risk premium is 2.0%.<\/p><p>Goodwin then computes the cost of debt for Company Z, an A-rated US chemical manufacturer. The company's debt consists of 7-year maturity, 5.00% coupon, option- free bonds which are very thinly traded. Goodwin uses a matrix approach to estimate Company Z's cost of debt and wants to adjust for its lack of liquidity. In Exhibit 1, he compiles average YTM data from highly liquid bonds of other companies in the same industry with the same credit rating.<\/p><p
