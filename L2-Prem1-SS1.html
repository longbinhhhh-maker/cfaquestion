<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button id="submitBtn" class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>

    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">

    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>

  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Which of the following ratios is the most appropriate for Wang to use in comparing Tupelo and Grupo?", "opts": ["Price to book", "Price to FCFE", "Price to earnings"], "ans": "B", "expl": "B is correct. because the P/FCFE ratio is the least affected of these three valuation metrics when two companies report under different accounting standards, and therefore the most appropriate to use for a comparison. Tupelo reports under US GAAP and Grupo reports under IFRS. International accounting differences affect the comparability of all price multiples. Of the price multiples we examined, P/CFO and P/FCFE will generally be least affected by accounting differences. P/B, P/E, and multiples based on such concepts as EBITDA, which start from accounting earnings, will generally be the most affected.", "explhtml": "<p><b>B is correct.<\/b> because the P/FCFE ratio is the least affected of these three valuation<\/p><p>metrics when two companies report under different accounting standards, and therefore the most appropriate to use for a comparison. Tupelo reports under US GAAP and Grupo reports under IFRS. International accounting differences affect the comparability of all price multiples. Of the price multiples we examined, P/CFO and P/FCFE will generally be least affected by accounting differences. P/B, P/E, and multiples based on such concepts as EBITDA, which start from accounting earnings, will generally be the most affected.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Equity Valuation · Collin Wang<\/summary><div class=\"vig-body\"><p>Collin Wang is a portfolio manager screening companies in the transportation industry for inclusion in his firm's mid-cap equity fund.<\/p><p>Wang selects three companies to consider for his fund. The first two are US-based companies, Tupelo Transport Inc. and KXC Inc., that prepare their financial statements in accordance with US GAAP. Both companies provide transportation services across the US and Mexico. The third company, Grupo TranspoRio, is a Mexico-based company that provides transportation services throughout Mexico and the southwestern US. Grupo prepares its financial statements in accordance with IFRS.<\/p><p>Wang first reviews Tupelo and Grupo. He considers which price multiple would be most appropriate to use when comparing the two companies.<\/p><p>Wang observes that the justified price-to-sales (P/S) ratio for Tupelo is lower than for KXC. He uses the information in Exhibit 1 to determine which metric best supports Tupelo's lower justified P/5 ratio.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-001.webp\" style=\"max-width:min(100%,383px)\" alt=\"Metric Tupelo KXC Debt-to-equity (D/E) ratio 40.3% 48.2% Net profit margin 6.5% 5.2% Dividend payout ratio 18.0% 22.0%\"><p>Wang summarizes in Exhibit 2 key financial statement data (in $ millions) of Tupelo for the year just ended. Tupelo's current price per share is $191.60 and there are 103.7 million shares outstanding. Wang calculates the company's enterprise value to sales ratio, assuming the market value of long-term debt equals its book value.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-002.webp\" style=\"max-width:min(100%,337px)\" alt=\"Cash and short-term investments 852 Long-term debt 1,460 Revenues 14,820\"><p>As part of his screening process, Wang examines a momentum indicator for the three companies. The indicator is calculated by dividing the difference between reported earnings and the mean of analysts' earnings forecasts by the dispersion in the analysts' forecasts.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following ratios is the most appropriate for Wang to use in comparing<\/p><p>Tupelo and Grupo?<\/p><\/div>", "subj": "equity"}, {"n": 2, "q": "Which metric in Exhibit 1 best supports Tupelo's lower justified P/S ratio compared to KXC?", "opts": ["D/E ratio", "Net profit margin", "Dividend payout ratio"], "ans": "C", "expl": "C is correct. because the dividend payout ratio for Tupelo (18%) is lower than for KXC (22%). That would lead to a lower justified P/S ratio based on fundamentals, all else equal. The justified P/S ratio is calculated as follows: PO/S1 = [(E1/S1)(1 - b)] / (r- g) where E1/S1 = forecasted net profit margin, b = retention ratio, (1-b) = dividend payout ratio, r = required return on equity, and g = growth rate.", "explhtml": "<p><b>C is correct.<\/b> because the dividend payout ratio for Tupelo (18%) is lower than for KXC<\/p><p>(22%). That would lead to a lower justified P/S ratio based on fundamentals, all else equal. The justified P/S ratio is calculated as follows: PO/S1 = [(E1/S1)(1 - b)] / (r- g) where E1/S1 = forecasted net profit margin, b = retention ratio, (1-b) = dividend payout ratio, r = required return on equity, and g = growth rate.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Equity Valuation · Collin Wang<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Collin Wang is a portfolio manager screening companies in the transportation industry for inclusion in his firm's mid-cap equity fund.<\/p><p>Wang selects three companies to consider for his fund. The first two are US-based companies, Tupelo Transport Inc. and KXC Inc., that prepare their financial statements in accordance with US GAAP. Both companies provide transportation services across the US and Mexico. The third company, Grupo TranspoRio, is a Mexico-based company that provides transportation services throughout Mexico and the southwestern US. Grupo prepares its financial statements in accordance with IFRS.<\/p><p>Wang first reviews Tupelo and Grupo. He considers which price multiple would be most appropriate to use when comparing the two companies.<\/p><p>Wang observes that the justified price-to-sales (P/S) ratio for Tupelo is lower than for KXC. He uses the information in Exhibit 1 to determine which metric best supports Tupelo's lower justified P/5 ratio.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-001.webp\" style=\"max-width:min(100%,383px)\" alt=\"Metric Tupelo KXC Debt-to-equity (D/E) ratio 40.3% 48.2% Net profit margin 6.5% 5.2% Dividend payout ratio 18.0% 22.0%\"><p>Wang summarizes in Exhibit 2 key financial statement data (in $ millions) of Tupelo for the year just ended. Tupelo's current price per share is $191.60 and there are 103.7 million shares outstanding. Wang calculates the company's enterprise value to sales ratio, assuming the market value of long-term debt equals its book value.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-002.webp\" style=\"max-width:min(100%,337px)\" alt=\"Cash and short-term investments 852 Long-term debt 1,460 Revenues 14,820\"><p>As part of his screening process, Wang examines a momentum indicator for the three companies. The indicator is calculated by dividing the difference between reported earnings and the mean of analysts' earnings forecasts by the dispersion in the analysts' forecasts.<\/p><\/div><\/details><div class=\"qtext\"><p>Which metric in Exhibit 1 best supports Tupelo's lower justified P/S ratio compared<\/p><p>to KXC?<\/p><\/div>", "subj": "equity"}, {"n": 3, "q": "Tupelo's enterprise value to sales ratio is closestto:", "opts": ["1.28.", "1.38.", "1.44."], "ans": "B", "expl": "B is correct. because the EV/S ratio is calculated as follows: EV = Market value of equity + Market value of debt - Cash EV = (103.7 shares × $191.60) + $1,460 - $852 = $20,476.9 EV/S ratio = $20,476.9/14,820 = 1.38", "explhtml": "<p><b>B is correct.<\/b> because the EV/S ratio is calculated as follows:<\/p><p>EV = Market value of equity + Market value of debt - Cash EV = (103.7 shares × $191.60) + $1,460 - $852 = $20,476.9<\/p><p>EV/S ratio = $20,476.9/14,820 = 1.38<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Equity Valuation · Collin Wang<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Collin Wang is a portfolio manager screening companies in the transportation industry for inclusion in his firm's mid-cap equity fund.<\/p><p>Wang selects three companies to consider for his fund. The first two are US-based companies, Tupelo Transport Inc. and KXC Inc., that prepare their financial statements in accordance with US GAAP. Both companies provide transportation services across the US and Mexico. The third company, Grupo TranspoRio, is a Mexico-based company that provides transportation services throughout Mexico and the southwestern US. Grupo prepares its financial statements in accordance with IFRS.<\/p><p>Wang first reviews Tupelo and Grupo. He considers which price multiple would be most appropriate to use when comparing the two companies.<\/p><p>Wang observes that the justified price-to-sales (P/S) ratio for Tupelo is lower than for KXC. He uses the information in Exhibit 1 to determine which metric best supports Tupelo's lower justified P/5 ratio.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-001.webp\" style=\"max-width:min(100%,383px)\" alt=\"Metric Tupelo KXC Debt-to-equity (D/E) ratio 40.3% 48.2% Net profit margin 6.5% 5.2% Dividend payout ratio 18.0% 22.0%\"><p>Wang summarizes in Exhibit 2 key financial statement data (in $ millions) of Tupelo for the year just ended. Tupelo's current price per share is $191.60 and there are 103.7 million shares outstanding. Wang calculates the company's enterprise value to sales ratio, assuming the market value of long-term debt equals its book value.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-002.webp\" style=\"max-width:min(100%,337px)\" alt=\"Cash and short-term investments 852 Long-term debt 1,460 Revenues 14,820\"><p>As part of his screening process, Wang examines a momentum indicator for the three companies. The indicator is calculated by dividing the difference between reported earnings and the mean of analysts' earnings forecasts by the dispersion in the analysts' forecasts.<\/p><\/div><\/details><div class=\"qtext\"><p>Tupelo's enterprise value to sales ratio is closestto:<\/p><\/div>", "subj": "equity"}, {"n": 4, "q": "The momentum indicator used by Wang is best described as:", "opts": ["relative strength.", "scaled earnings surprise.", "standardized unexpected earnings."], "ans": "B", "expl": "B is correct. because the scaled earnings surprise indicator is calculated as the difference between reported earnings and expected earnings (as measured by the mean of the analysts following the stock), scaled by a measure reflecting the variability or range in analysts' EPS estimates. A way to accomplish such scaling is to divide unexpected earnings by the standard deviation of analysts' earnings forecasts, which we refer to as the scaled earnings surprise.", "explhtml": "<p><b>B is correct.<\/b> because the scaled earnings surprise indicator is calculated as the<\/p><p>difference between reported earnings and expected earnings (as measured by the mean of the analysts following the stock), scaled by a measure reflecting the variability or range in analysts' EPS estimates. A way to accomplish such scaling is to divide unexpected earnings by the standard deviation of analysts' earnings forecasts, which we refer to as the scaled earnings surprise.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Equity Valuation · Collin Wang<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Collin Wang is a portfolio manager screening companies in the transportation industry for inclusion in his firm's mid-cap equity fund.<\/p><p>Wang selects three companies to consider for his fund. The first two are US-based companies, Tupelo Transport Inc. and KXC Inc., that prepare their financial statements in accordance with US GAAP. Both companies provide transportation services across the US and Mexico. The third company, Grupo TranspoRio, is a Mexico-based company that provides transportation services throughout Mexico and the southwestern US. Grupo prepares its financial statements in accordance with IFRS.<\/p><p>Wang first reviews Tupelo and Grupo. He considers which price multiple would be most appropriate to use when comparing the two companies.<\/p><p>Wang observes that the justified price-to-sales (P/S) ratio for Tupelo is lower than for KXC. He uses the information in Exhibit 1 to determine which metric best supports Tupelo's lower justified P/5 ratio.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-001.webp\" style=\"max-width:min(100%,383px)\" alt=\"Metric Tupelo KXC Debt-to-equity (D/E) ratio 40.3% 48.2% Net profit margin 6.5% 5.2% Dividend payout ratio 18.0% 22.0%\"><p>Wang summarizes in Exhibit 2 key financial statement data (in $ millions) of Tupelo for the year just ended. Tupelo's current price per share is $191.60 and there are 103.7 million shares outstanding. Wang calculates the company's enterprise value to sales ratio, assuming the market value of long-term debt equals its book value.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-002.webp\" style=\"max-width:min(100%,337px)\" alt=\"Cash and short-term investments 852 Long-term debt 1,460 Revenues 14,820\"><p>As part of his screening process, Wang examines a momentum indicator for the three companies. The indicator is calculated by dividing the difference between reported earnings and the mean of analysts' earnings forecasts by the dispersion in the analysts' forecasts.<\/p><\/div><\/details><div class=\"qtext\"><p>The momentum indicator used by Wang is best described as:<\/p><\/div>", "subj": "equity"}, {"n": 5, "q": "The arbitrage-free value of Bond D is closest to:", "opts": ["$997.93.", "$1000.00.", "$1000.17."], "ans": "C", "expl": "C is correct. because the arbitrage-free value of Bond D is 1000.17, based on the calculation below using the binomial tree included in Exhibit 2: Cash flow at year 2 (up state) = par value + (par value x coupon rate) = 1000.000 + 1000.000 x 0.029366 = 1029.366. Present Value at year 1 (up state) = VH = Cash flow / (1 + coupon rate) = 1029.366 / (1.029366) = 1000.000. Cash Flow at year 2 (down state) = 1000.000 + 1000.000 x 0.025000 = 1025.000. Since the coupon rate in year 1 is 2.4651%, and the bond is floored at 2.5000%, the rate to use for the coupon in year 2 is 2.5000%. Present Value at year 1 (downstate) = VL = 1025.000 / (1.024651) = 1000.341. Present Value at year 0 (probability-weighted present value) = C + ( 0.5 × VH + 0.5 x VL ) / (1 + i) = 26.000 + (50% x 1000.000 + 50% x 1000.341) / (1.026000) = 1000.17.", "explhtml": "<p><b>C is correct.<\/b> because the arbitrage-free value of Bond D is 1000.17, based on the<\/p><p>calculation below using the binomial tree included in Exhibit 2: Cash flow at year 2 (up state) = par value + (par value x coupon rate) = 1000.000 + 1000.000 x 0.029366 = 1029.366. Present Value at year 1 (up state) = VH = Cash flow / (1 + coupon rate) = 1029.366 / (1.029366) = 1000.000. Cash Flow at year 2 (down state) = 1000.000 + 1000.000 x 0.025000 = 1025.000. Since the coupon rate in year 1 is 2.4651%, and the bond is floored at 2.5000%, the rate to use for the coupon in year 2 is 2.5000%. Present Value at year 1 (downstate) = VL = 1025.000 / (1.024651) = 1000.341. Present Value at year 0 (probability-weighted present value) = C + ( 0.5 × VH + 0.5 x VL ) / (1 + i) = 26.000 + (50% x 1000.000 + 50% x 1000.341) / (1.026000) = 1000.17.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Fixed Income · Paul Lee<\/summary><div class=\"vig-body\"><p>Paul Lee is a fixed income analyst for a hedge fund. He is analyzing bonds issued by Pluto Inc., a US corporation. To value these bonds, Lee uses the binominal tree shown in Exhibit 1, which includes an OAS of 2%. In the tree, the branching from each node to a high state and to a low state occurs with equal probabilities.<\/p><p><b>Exhibit 1:<\/b><\/p><p>Lee analyzes 2-year annual coupon bonds issued by Pluto. A description of the bonds is provided below in Exhibit 2. Each bond has a par value of $1,000, and all floating-rate bonds (floaters) have annual resets. The coupon rate for all the floaters is reset at the beginning of the period, and was just reset.<\/p><p><b>Exhibit 2:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-003.webp\" style=\"max-width:min(100%,521px)\" alt=\"Bond Coupon Rate Bond Characteristics Bond A Reference rate + 2% Convertible into 90 shares of Pluto common stock Bond B Reference rate + 2% Straight floater Bond C Reference rate + 2% Floater with a cap rate of 2.8% Bond D Reference rate + 2% Floater with a floor rate of 2.5% Bond E 2.3% Putable at par after 1 year Bond F 2.3% Callable at par after 1 year\"><p>Bond A has a current market price of $1,010. Pluto's shares currently trade at $9.53 per share. Lee expects Pluto's shares to decrease in value by 20% over the next year, bringing shares below the current conversion price.<\/p><p>After valuing the bonds, Lee analyzes the following two independent scenarios:<\/p><p>• Scenario 1: a steepening of the 1-year reference rate forward curve due to a decrease in rates at or under 2 years, and an increase in rates over 2 years. • Scenario 2: an increase in the volatility of the 1-year forward reference rate.<\/p><\/div><\/details><div class=\"qtext\"><p>The arbitrage-free value of Bond D is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 6, "q": "If Pluto's shares move as Lee expects, Bond A's behavior will most likely resemble that of:", "opts": ["common stock.", "an option-free floater.", "an option-free fixed-rate bond."], "ans": "B", "expl": "B is correct. because Pluto's convertible bond can be viewed as a straight bond and a call option on Pluto's common stock. When the underlying share price is well below the conversion price, the convertible bond is described as a \"busted convertible\" and exhibits mostly bond risk-return characteristics. That is, the risk-return characteristics of the convertible bond resemble those of the underlying option-free (straight) bond. In this case, the call option is out of the money, so share price movements do not significantly affect the price of the call option. If Pluto's shares move as Lee expects (decrease of 20%), Bond A's embedded call option will be deeply out of the money, so Bond A's behavior will most likely resemble that of the underlying option-free bond. As Bond A's coupon rate is floating, Bond A's behavior will resemble that of an option-free floater.", "explhtml": "<p><b>B is correct.<\/b> because Pluto's convertible bond can be viewed as a straight bond and a<\/p><p>call option on Pluto's common stock. When the underlying share price is well below the conversion price, the convertible bond is described as a \"busted convertible\" and exhibits mostly bond risk-return characteristics. That is, the risk-return characteristics of the convertible bond resemble those of the underlying option-free (straight) bond. In this case, the call option is out of the money, so share price movements do not significantly affect the price of the call option. If Pluto's shares move as Lee expects (decrease of 20%), Bond A's embedded call option will be deeply out of the money, so Bond A's behavior will most likely resemble that of the underlying option-free bond. As Bond A's coupon rate is floating, Bond A's behavior will resemble that of an option-free floater.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Fixed Income · Paul Lee<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Paul Lee is a fixed income analyst for a hedge fund. He is analyzing bonds issued by Pluto Inc., a US corporation. To value these bonds, Lee uses the binominal tree shown in Exhibit 1, which includes an OAS of 2%. In the tree, the branching from each node to a high state and to a low state occurs with equal probabilities.<\/p><p><b>Exhibit 1:<\/b><\/p><p>Lee analyzes 2-year annual coupon bonds issued by Pluto. A description of the bonds is provided below in Exhibit 2. Each bond has a par value of $1,000, and all floating-rate bonds (floaters) have annual resets. The coupon rate for all the floaters is reset at the beginning of the period, and was just reset.<\/p><p><b>Exhibit 2:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-003.webp\" style=\"max-width:min(100%,521px)\" alt=\"Bond Coupon Rate Bond Characteristics Bond A Reference rate + 2% Convertible into 90 shares of Pluto common stock Bond B Reference rate + 2% Straight floater Bond C Reference rate + 2% Floater with a cap rate of 2.8% Bond D Reference rate + 2% Floater with a floor rate of 2.5% Bond E 2.3% Putable at par after 1 year Bond F 2.3% Callable at par after 1 year\"><p>Bond A has a current market price of $1,010. Pluto's shares currently trade at $9.53 per share. Lee expects Pluto's shares to decrease in value by 20% over the next year, bringing shares below the current conversion price.<\/p><p>After valuing the bonds, Lee analyzes the following two independent scenarios:<\/p><p>• Scenario 1: a steepening of the 1-year reference rate forward curve due to a decrease in rates at or under 2 years, and an increase in rates over 2 years. • Scenario 2: an increase in the volatility of the 1-year forward reference rate.<\/p><\/div><\/details><div class=\"qtext\"><p>If Pluto's shares move as Lee expects, Bond A's behavior will most likely resemble<\/p><p>that of:<\/p><\/div>", "subj": "fixed"}, {"n": 7, "q": "Under Scenario 1, Bond E's effective duration will most likely.", "opts": ["decrease.", "stay the same.", "increase."], "ans": "C", "expl": "C is correct. because Bond E is a putable bond with a two-year time to maturity. The steepening of the yield curve indicated in the scenario, which implies that the interest rates at or below 2 years (those relevant to Bond E's value) decrease, makes Bond E's put option decrease in value. That move implies an increase in Bond Es effective duration, since the likelihood of exercising the put option decreases.", "explhtml": "<p><b>C is correct.<\/b> because Bond E is a putable bond with a two-year time to maturity. The<\/p><p>steepening of the yield curve indicated in the scenario, which implies that the interest rates at or below 2 years (those relevant to Bond E's value) decrease, makes Bond E's put option decrease in value. That move implies an increase in Bond Es effective duration, since the likelihood of exercising the put option decreases.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Fixed Income · Paul Lee<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Paul Lee is a fixed income analyst for a hedge fund. He is analyzing bonds issued by Pluto Inc., a US corporation. To value these bonds, Lee uses the binominal tree shown in Exhibit 1, which includes an OAS of 2%. In the tree, the branching from each node to a high state and to a low state occurs with equal probabilities.<\/p><p><b>Exhibit 1:<\/b><\/p><p>Lee analyzes 2-year annual coupon bonds issued by Pluto. A description of the bonds is provided below in Exhibit 2. Each bond has a par value of $1,000, and all floating-rate bonds (floaters) have annual resets. The coupon rate for all the floaters is reset at the beginning of the period, and was just reset.<\/p><p><b>Exhibit 2:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-003.webp\" style=\"max-width:min(100%,521px)\" alt=\"Bond Coupon Rate Bond Characteristics Bond A Reference rate + 2% Convertible into 90 shares of Pluto common stock Bond B Reference rate + 2% Straight floater Bond C Reference rate + 2% Floater with a cap rate of 2.8% Bond D Reference rate + 2% Floater with a floor rate of 2.5% Bond E 2.3% Putable at par after 1 year Bond F 2.3% Callable at par after 1 year\"><p>Bond A has a current market price of $1,010. Pluto's shares currently trade at $9.53 per share. Lee expects Pluto's shares to decrease in value by 20% over the next year, bringing shares below the current conversion price.<\/p><p>After valuing the bonds, Lee analyzes the following two independent scenarios:<\/p><p>• Scenario 1: a steepening of the 1-year reference rate forward curve due to a decrease in rates at or under 2 years, and an increase in rates over 2 years. • Scenario 2: an increase in the volatility of the 1-year forward reference rate.<\/p><\/div><\/details><div class=\"qtext\"><p>Under Scenario 1, Bond E's effective duration will most likely.<\/p><\/div>", "subj": "fixed"}, {"n": 8, "q": "Under Scenario 2, which of the following bonds will most likely increase in value?", "opts": ["Bond E only", "Bond Fonly", "Both Bond E and Bond F"], "ans": "A", "expl": "A is correct. because Bonds E and Fshare the same characteristics, except that E is putable and F is callable. There is a relationship among their values: Value of Bond E = Value of Option Free Bond + Value of investor put option Value of Bond F = Value of Option Free Bond - Value of issuer call option. As indicated in the scenario, the change in interest rate volatility has no effect on the value of an option free bond. However, such change in interest rate volatility will increase the value of both the put and call options embedded in Bonds E and F. respectively. The increase in the put option will make Bond E's value increase, and the increase in the call option will make Bond F's value decrease.", "explhtml": "<p><b>A is correct.<\/b> because Bonds E and Fshare the same characteristics, except that E is<\/p><p>putable and F is callable. There is a relationship among their values: Value of Bond E = Value of Option Free Bond + Value of investor put option<\/p><p>Value of Bond F = Value of Option Free Bond - Value of issuer call option. As indicated in the scenario, the change in interest rate volatility has no effect on the value of an option free bond. However, such change in interest rate volatility will increase the value of both the put and call options embedded in Bonds E and F. respectively. The increase in the put option will make Bond E's value increase, and the increase in the call option will make Bond F's value decrease.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Fixed Income · Paul Lee<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Paul Lee is a fixed income analyst for a hedge fund. He is analyzing bonds issued by Pluto Inc., a US corporation. To value these bonds, Lee uses the binominal tree shown in Exhibit 1, which includes an OAS of 2%. In the tree, the branching from each node to a high state and to a low state occurs with equal probabilities.<\/p><p><b>Exhibit 1:<\/b><\/p><p>Lee analyzes 2-year annual coupon bonds issued by Pluto. A description of the bonds is provided below in Exhibit 2. Each bond has a par value of $1,000, and all floating-rate bonds (floaters) have annual resets. The coupon rate for all the floaters is reset at the beginning of the period, and was just reset.<\/p><p><b>Exhibit 2:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-003.webp\" style=\"max-width:min(100%,521px)\" alt=\"Bond Coupon Rate Bond Characteristics Bond A Reference rate + 2% Convertible into 90 shares of Pluto common stock Bond B Reference rate + 2% Straight floater Bond C Reference rate + 2% Floater with a cap rate of 2.8% Bond D Reference rate + 2% Floater with a floor rate of 2.5% Bond E 2.3% Putable at par after 1 year Bond F 2.3% Callable at par after 1 year\"><p>Bond A has a current market price of $1,010. Pluto's shares currently trade at $9.53 per share. Lee expects Pluto's shares to decrease in value by 20% over the next year, bringing shares below the current conversion price.<\/p><p>After valuing the bonds, Lee analyzes the following two independent scenarios:<\/p><p>• Scenario 1: a steepening of the 1-year reference rate forward curve due to a decrease in rates at or under 2 years, and an increase in rates over 2 years. • Scenario 2: an increase in the volatility of the 1-year forward reference rate.<\/p><\/div><\/details><div class=\"qtext\"><p>Under Scenario 2, which of the following bonds will most likely increase in value?<\/p><\/div>", "subj": "fixed"}, {"n": 9, "q": "The Durbin-Watson test statistic for Model 1 will most likely be:", "opts": ["less than 2 and statistically significant.", "not significantly different from 2.", "greater than 2 and statistically significant."], "ans": "A", "expl": "A is correct. because the description of the results being consistently below the forecasted value indicate positive serial correlation amongst the error terms. Positive serial correlation is present when a positive (negative) residual for one observation increases the chance of a positive (negative) residual in the next observation. Values significantly smaller than 2 for the Durbin-Watson test statistic indicate positive serial correlation. Given an appearance of positive serial correlation and 15 years (since 2008) of actual results consistently below forecast, it is likely that the value of the Durbin-Watson test statistic will be less than 2 and statistically significant.", "explhtml": "<p><b>A is correct.<\/b> because the description of the results being consistently below the<\/p><p>forecasted value indicate positive serial correlation amongst the error terms. Positive serial correlation is present when a positive (negative) residual for one observation increases the chance of a positive (negative) residual in the next observation. Values significantly smaller than 2 for the Durbin-Watson test statistic indicate positive serial correlation. Given an appearance of positive serial correlation and 15 years (since 2008) of actual results consistently below forecast, it is likely that the value of the Durbin-Watson test statistic will be less than 2 and statistically significant.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Quantitative Methods · James Barber<\/summary><div class=\"vig-body\"><p>James Barber, a macro strategist, is developing models to help forecast macroeconomic data. Barber has gathered quarterly data on Country A's labor productivity and is modeling that data using linear regression. The model (Model 1) has t-statistics slightly above the critical value and has an R-squared of 0.0976. The residuals appear to be predictable over time, with quarterly labor productivity figures consistently lower than the forecasted values since the 2008 financial crisis. Barber uses the Durbin-Watson test statistic to evaluate the regression.<\/p><p>Barber then turns his attention to household savings rates (SavingsRate). He is reviewing the results of Model 2, an AR(1) model. In reviewing the data, Barber determines that the household savings rate is mean-reverting. Selected results of the regression are shown in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-004.webp\" style=\"max-width:min(100%,503px)\" alt=\"Coefficient Standard Error t-Statistic Intercept 5.60 0.84 6.67 SavingsRatet-1 0.45 0.09 5.00\"><p>Barber has built a machine-learning model (Model 3) to gather insight into consumer sentiment. Model 3 performs well on the training dataset but produces a high number of false positives and false negatives on the cross-validation dataset. To improve Model 3's performance, Barber is considering the following two strategies:<\/p><p>• Strategy 1: Increase regularization • Strategy 2: Increase the number of features<\/p><p>Following some ad justments and re-training, Barber produces the confusion matrix shown in Exhibit 2 to evaluate the performance of Model 3. He calculates the F1 score for the model.<\/p><p>Actual Training Labels Class \"1\" Class \"O\" Class \"1\" 165 (True Positives) 27 (False Positives) Predicted Results Class \"O\" 4 (False Negatives) 104 (True Negatives)<\/p><\/div><\/details><div class=\"qtext\"><p>The Durbin-Watson test statistic for Model 1 will most likely be:<\/p><\/div>", "subj": "quant"}, {"n": 10, "q": "The mean-reverting level for Model 2 is closest to:", "opts": ["6.05.", "10.18.", "12.44."], "ans": "B", "expl": "B is correct. because a time series shows mean reversion if it tends to fall when its level is above its mean and rise when its level is below its mean. For an AR(1) model, the mean-reverting level is given by the formula: Xt = b0/(1 - b1) where Intercept = b0 SavingsRatet-1 = b1 Calculated as: Intercept / (1 - SavingsRatet-1) = 5.60 / (1 - 0.45) = 10.18", "explhtml": "<p><b>B is correct.<\/b> because a time series shows mean reversion if it tends to fall when its<\/p><p>level is above its mean and rise when its level is below its mean. For an AR(1) model, the mean-reverting level is given by the formula: Xt = b0/(1 - b1) where Intercept = b0 SavingsRatet-1 = b1 Calculated as: Intercept / (1 - SavingsRatet-1) = 5.60 / (1 - 0.45) = 10.18<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Quantitative Methods · James Barber<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>James Barber, a macro strategist, is developing models to help forecast macroeconomic data. Barber has gathered quarterly data on Country A's labor productivity and is modeling that data using linear regression. The model (Model 1) has t-statistics slightly above the critical value and has an R-squared of 0.0976. The residuals appear to be predictable over time, with quarterly labor productivity figures consistently lower than the forecasted values since the 2008 financial crisis. Barber uses the Durbin-Watson test statistic to evaluate the regression.<\/p><p>Barber then turns his attention to household savings rates (SavingsRate). He is reviewing the results of Model 2, an AR(1) model. In reviewing the data, Barber determines that the household savings rate is mean-reverting. Selected results of the regression are shown in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-004.webp\" style=\"max-width:min(100%,503px)\" alt=\"Coefficient Standard Error t-Statistic Intercept 5.60 0.84 6.67 SavingsRatet-1 0.45 0.09 5.00\"><p>Barber has built a machine-learning model (Model 3) to gather insight into consumer sentiment. Model 3 performs well on the training dataset but produces a high number of false positives and false negatives on the cross-validation dataset. To improve Model 3's performance, Barber is considering the following two strategies:<\/p><p>• Strategy 1: Increase regularization • Strategy 2: Increase the number of features<\/p><p>Following some ad justments and re-training, Barber produces the confusion matrix shown in Exhibit 2 to evaluate the performance of Model 3. He calculates the F1 score for the model.<\/p><p>Actual Training Labels Class \"1\" Class \"O\" Class \"1\" 165 (True Positives) 27 (False Positives) Predicted Results Class \"O\" 4 (False Negatives) 104 (True Negatives)<\/p><\/div><\/details><div class=\"qtext\"><p>The mean-reverting level for Model 2 is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 11, "q": "Which of the following would most likely improve the performance of Model 3?", "opts": ["Strategy 1 only", "Strategy 2 only", "Both Strategy 1 and Strategy 2"], "ans": "A", "expl": "A is correct. is Correctbecause Strategy 1 (\"increase regularization\") will improve the performance of Model 3. The current model suffers from high variance, where the prediction errors are small on the training dataset but high on the cross-validation (CV) dataset. Slight regularization lightly penalizes model complexity, thereby allowing most or all of the features to be included in the model and thus potentially enabling the model to \"memorize\" the data. Typically with no or slight regularization, the prediction error on the training dataset is small while the prediction error on the CV dataset is significantly larger. This difference in error is variance. High variance error, which typically results from too many features and model complexity, results in model overfitting. When high variance error and low bias error exist, the model performs well on the training dataset but generates many FP and FN errors on the cross- validation dataset; in other words, the model is overfitted and does not generalize to new data well. Large regularization excessively penalizes model complexity, thereby allowing too few of the features to be included in the model and causing the model to learn less from the data. The model may lack the necessary predictor variables and complexity needed to discern underlying patterns in the data. Typically with large regularization, the prediction errors on the training and CV datasets are both large. Large prediction errors on the training dataset indicate high bias, and high bias error results from model underfitting. When high bias error exists, the model does not perform well on either training or CV datasets because it is typically lacking important predictor variables. Optimum regularization minimizes both variance and bias errors in a balanced fashion. It penalizes model complexity just enough so that only the most important features are included in the model.", "explhtml": "<p><b>A is correct.<\/b>  is Correctbecause Strategy 1 (\"increase regularization\") will improve the<\/p><p>performance of Model 3. The current model suffers from high variance, where the prediction errors are small on the training dataset but high on the cross-validation (CV) dataset. Slight regularization lightly penalizes model complexity, thereby allowing most or all of the features to be included in the model and thus potentially enabling the model to \"memorize\" the data. Typically with no or slight regularization, the prediction error on the training dataset is small while the prediction error on the CV dataset is significantly larger. This difference in error is variance. High variance error, which typically results from too many features and model complexity, results in model overfitting. When high variance error and low bias error exist, the model performs well on the training dataset but generates many FP and FN errors on the cross- validation dataset; in other words, the model is overfitted and does not generalize to new data well.<\/p><p>Large regularization excessively penalizes model complexity, thereby allowing too few of the features to be included in the model and causing the model to learn less from the data. The model may lack the necessary predictor variables and complexity needed to discern underlying patterns in the data. Typically with large regularization, the prediction errors on the training and CV datasets are both large. Large prediction errors on the training dataset indicate high bias, and high bias error results from model underfitting. When high bias error exists, the model does not perform well on either training or CV datasets because it is typically lacking important predictor variables. Optimum regularization minimizes both variance and bias errors in a balanced fashion. It penalizes model complexity just enough so that only the most important features are included in the model.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Quantitative Methods · James Barber<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>James Barber, a macro strategist, is developing models to help forecast macroeconomic data. Barber has gathered quarterly data on Country A's labor productivity and is modeling that data using linear regression. The model (Model 1) has t-statistics slightly above the critical value and has an R-squared of 0.0976. The residuals appear to be predictable over time, with quarterly labor productivity figures consistently lower than the forecasted values since the 2008 financial crisis. Barber uses the Durbin-Watson test statistic to evaluate the regression.<\/p><p>Barber then turns his attention to household savings rates (SavingsRate). He is reviewing the results of Model 2, an AR(1) model. In reviewing the data, Barber determines that the household savings rate is mean-reverting. Selected results of the regression are shown in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-004.webp\" style=\"max-width:min(100%,503px)\" alt=\"Coefficient Standard Error t-Statistic Intercept 5.60 0.84 6.67 SavingsRatet-1 0.45 0.09 5.00\"><p>Barber has built a machine-learning model (Model 3) to gather insight into consumer sentiment. Model 3 performs well on the training dataset but produces a high number of false positives and false negatives on the cross-validation dataset. To improve Model 3's performance, Barber is considering the following two strategies:<\/p><p>• Strategy 1: Increase regularization • Strategy 2: Increase the number of features<\/p><p>Following some ad justments and re-training, Barber produces the confusion matrix shown in Exhibit 2 to evaluate the performance of Model 3. He calculates the F1 score for the model.<\/p><p>Actual Training Labels Class \"1\" Class \"O\" Class \"1\" 165 (True Positives) 27 (False Positives) Predicted Results Class \"O\" 4 (False Negatives) 104 (True Negatives)<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following would most likely improve the performance of Model 3?<\/p><\/div>", "subj": "quant"}, {"n": 12, "q": "The F1 score for Model 3 is closest to:", "opts": ["0.839.", "0.897.", "0.914."], "ans": "C", "expl": "C is correct. because the F1 score is calculated with the following formula: F1 score = (2 × P × R)/(P+ R) P = Precision R= Recall Precision (P) = True Positives/(True Positives + False Positives) = 165/(165 + 27) = 0.8594 Recall (R) = True Positives/(True Positives + False Negatives) = 165/(165 + 4) = 0.9763 F1score = (2 x P × R)/(P +R) = (2 × 0.8594 × 0.9763)/(0.8594 + 0.9763) = 0.9141", "explhtml": "<p><b>C is correct.<\/b> because the F1 score is calculated with the following formula:<\/p><p>F1 score = (2 × P × R)/(P+ R) P = Precision R= Recall Precision (P) = True Positives/(True Positives + False Positives) = 165/(165 + 27) = 0.8594 Recall (R) = True Positives/(True Positives + False Negatives) = 165/(165 + 4) = 0.9763 F1score = (2 x P × R)/(P +R) = (2 × 0.8594 × 0.9763)/(0.8594 + 0.9763) = 0.9141<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Quantitative Methods · James Barber<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>James Barber, a macro strategist, is developing models to help forecast macroeconomic data. Barber has gathered quarterly data on Country A's labor productivity and is modeling that data using linear regression. The model (Model 1) has t-statistics slightly above the critical value and has an R-squared of 0.0976. The residuals appear to be predictable over time, with quarterly labor productivity figures consistently lower than the forecasted values since the 2008 financial crisis. Barber uses the Durbin-Watson test statistic to evaluate the regression.<\/p><p>Barber then turns his attention to household savings rates (SavingsRate). He is reviewing the results of Model 2, an AR(1) model. In reviewing the data, Barber determines that the household savings rate is mean-reverting. Selected results of the regression are shown in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-004.webp\" style=\"max-width:min(100%,503px)\" alt=\"Coefficient Standard Error t-Statistic Intercept 5.60 0.84 6.67 SavingsRatet-1 0.45 0.09 5.00\"><p>Barber has built a machine-learning model (Model 3) to gather insight into consumer sentiment. Model 3 performs well on the training dataset but produces a high number of false positives and false negatives on the cross-validation dataset. To improve Model 3's performance, Barber is considering the following two strategies:<\/p><p>• Strategy 1: Increase regularization • Strategy 2: Increase the number of features<\/p><p>Following some ad justments and re-training, Barber produces the confusion matrix shown in Exhibit 2 to evaluate the performance of Model 3. He calculates the F1 score for the model.<\/p><p>Actual Training Labels Class \"1\" Class \"O\" Class \"1\" 165 (True Positives) 27 (False Positives) Predicted Results Class \"O\" 4 (False Negatives) 104 (True Negatives)<\/p><\/div><\/details><div class=\"qtext\"><p>The F1 score for Model 3 is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 13, "q": "Based on Exhibit 1, the forward rate for the 2-year zero-coupon bond issued one year from now is closestto:", "opts": ["8.53%.", "9.24%.", "9.67%."], "ans": "A", "expl": "A is correct. because it calculates the forward rate using spot rates as follows: f(1,2) = [(1+z3)3/(1+z1)1]0.5 - 1 = [(1.0815)3/(1.074)]0.5 - 1ñ 0.0853 = 8.53%.", "explhtml": "<p><b>A is correct.<\/b> because it calculates the forward rate using spot rates as follows:<\/p><p>f(1,2) = [(1+z3)3/(1+z1)1]0.5 - 1 = [(1.0815)3/(1.074)]0.5 - 1ñ 0.0853 = 8.53%.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Fixed Income · Jarrod MacQuoid<\/summary><div class=\"vig-body\"><p>Jarrod MacQuoid is meeting with several clients regarding their fixed-income investments. All bonds held in portfolios have a par value of 100. The current interest rates in their home country are presented in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-005.webp\" style=\"max-width:min(100%,258px)\" alt=\"Maturity Spot Rate УTM One year 7.40% 7.40% Two years 7.61% 7.60% Three years 8.15% 8.10% Four years 8.76% 8.65%\"><p>Client 1<\/p><p>Client 1 anticipates a large cash inflow in one year. He plans to use some of the new cash to build a summer home in three years, and wants to know what the rate would be for a 2-year zero-coupon, option-free and default-free bond issued one year from now.<\/p><p>Client 2<\/p><p>Client 2 is a portfolio manager at a small bank who asks MacQuoid to determine the arbitrage-free value of a bond he is considering purchasing. The bond is a 3-year, 6.0% annual-pay coupon, option-free and default-free bond.<\/p><p>Client 3<\/p><p>Client 3 runs a fixed-income fund that invests in a foreign country, and asks MacQuoid for advice on the fund's strategy. The client has recently started using a new interest- rate model which he describes to MacQuoid.<\/p><p>\"We perform our interest-rate modeling using an equilibrium term-structure model. Our model assumes that a single factor drives all yield curve movements, and we continually analyze market factors to determine the mispricing of bonds. Although our model cannot be calibrated to current market data, it does permit mean reversion of rates, assumes constant volatility, and allows negative interest rates.\"<\/p><p>MacQuoid mentions to Client 3 that he can also use the binomial interest rate tree to value bonds. MacQuoid illustrates how the tree in Exhibit 2 can be used to value Bond X, a 2-year, 4% annual-pay coupon, option-free and default-free bond. MacQuoid assumes the branching from each node occurs with equal probability.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-006.webp\" style=\"max-width:min(100%,322px)\" alt=\"Binomial Interest Rate Tree Year 0 Year 1 3.00% 1.25% 0.75%\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the forward rate for the 2-year zero-coupon bond issued one year<\/p><p>from now is closestto:<\/p><\/div>", "subj": "fixed"}, {"n": 14, "q": "The arbitrage-free value of the 3-year 6.0% coupon bond Client 2 is considering purchasing is closest to:", "opts": ["94.48.", "94.57.", "94.68."], "ans": "B", "expl": "B is correct. because it discounts each of the cash flows from the bond with the spot rate coincident with the timing of that cash flow: PO = 6/(1.0740)1 + 6/(1.0761)2 + 106(1.0815)3 = 5.587 + 5.181 + 83.797 = 94.565 = 94.57.", "explhtml": "<p><b>B is correct.<\/b> because it discounts each of the cash flows from the bond with the spot<\/p><p>rate coincident with the timing of that cash flow: PO = 6/(1.0740)1 + 6/(1.0761)2 + 106(1.0815)3 = 5.587 + 5.181 + 83.797 = 94.565 = 94.57.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Fixed Income · Jarrod MacQuoid<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jarrod MacQuoid is meeting with several clients regarding their fixed-income investments. All bonds held in portfolios have a par value of 100. The current interest rates in their home country are presented in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-005.webp\" style=\"max-width:min(100%,258px)\" alt=\"Maturity Spot Rate УTM One year 7.40% 7.40% Two years 7.61% 7.60% Three years 8.15% 8.10% Four years 8.76% 8.65%\"><p>Client 1<\/p><p>Client 1 anticipates a large cash inflow in one year. He plans to use some of the new cash to build a summer home in three years, and wants to know what the rate would be for a 2-year zero-coupon, option-free and default-free bond issued one year from now.<\/p><p>Client 2<\/p><p>Client 2 is a portfolio manager at a small bank who asks MacQuoid to determine the arbitrage-free value of a bond he is considering purchasing. The bond is a 3-year, 6.0% annual-pay coupon, option-free and default-free bond.<\/p><p>Client 3<\/p><p>Client 3 runs a fixed-income fund that invests in a foreign country, and asks MacQuoid for advice on the fund's strategy. The client has recently started using a new interest- rate model which he describes to MacQuoid.<\/p><p>\"We perform our interest-rate modeling using an equilibrium term-structure model. Our model assumes that a single factor drives all yield curve movements, and we continually analyze market factors to determine the mispricing of bonds. Although our model cannot be calibrated to current market data, it does permit mean reversion of rates, assumes constant volatility, and allows negative interest rates.\"<\/p><p>MacQuoid mentions to Client 3 that he can also use the binomial interest rate tree to value bonds. MacQuoid illustrates how the tree in Exhibit 2 can be used to value Bond X, a 2-year, 4% annual-pay coupon, option-free and default-free bond. MacQuoid assumes the branching from each node occurs with equal probability.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m1s1-006.webp\" style=\"max-width:min(100%,322px)\" alt=\"Binomial Interest Rate Tree Year 0 Year 1 3.00% 1.25% 0.75%\"><\/div><\/details><div class=\"qtext\"><p>The arbitrage-free value of the 3-year 6.0% coupon bond Client 2 is considering<\/p><p>purchasing is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 15, "q": "The new interest-rate model described by Client 3 is most consistent with the:", "opts": ["Ho-Lee model.", "Vasicek model.", "Cox-Ingersoll-Ross model."], "ans": "B", "expl": "B is correct. because the Vasicek model fits the client's description by permitting mean reversion, constant volatility of forward rates, as well
