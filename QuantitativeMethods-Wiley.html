he calculations are:\nDescribe the use of analysis of variance (ANOVA) in regression analysis, interpret ANOVA results, and calculate and interpret the standard error\nof Estimate in a simple linear regression LOS\n13.An analyst runs a simple linear regression using a sample of 10 observations. To assess the validity of the regression statistics, the analyst\nrandomly draws 20 observations from the same data. The results of both regression analyses are:\nSum of Sum of\nSample size squares squares\ntotal (SST) errors (SSE)\nRegression 1 10 167.00 47.75\nRegression 2 20 334.00 95.50\nBased on this information, the analyst should most likely conclude that:\nA. Regression 1 has a larger F-statistic.\nB. both regressions have the same F-statistic.\n\nC. Regression 2 has a larger F-statistic.\nExplanation\nSum of squares total\nSum of squares total (SST) = Sum of squares regression (SSR) + Sum of squares error (SSE)\nA simple linear regression (SLR) can be used to assess the degree to which variations in a dependent variable are explained by variations in an\nindependent variable. Outputs of a regression analysis include the:\nsum of squares total (SST), the variation in the observed values of the dependent variable versus its average value,\nsum of squares regression (SSR), the proportion of variation of the dependent variable explained by changes in the independent variable,\nand\nsum of squares error (SSE), the proportion of variation of the dependent variable unexplained by changes in the independent variable.\nF-statistics are used to evaluate the goodness of fit (ie, how well the regression model fits the data). F-statistics reflect the explained versus\nthe unexplained variation in the dependent variable, adjusted for sample size and degrees of freedom (ie, mean square regression [MSR] /\nmean square error [MSE]). For a given data set, both the SSR and SSE increase as sample size increases:\nIn this scenario, both the SST and SSE double when the sample size doubles. This indicates the same relative variance is exhibited by both\nsamples. Since the divisor in calculating the F-statistic is inversely related to sample size, other things equal, a larger sample size exhibiting the\nsame relative variation results in a greater value for the F-statistic (Choices A and B).\nA larger sample size that exhibits the same relative variation of the dependent variable should give an analyst greater confidence regarding the\nexplanatory power of the independent variable.\nCalculate and interpret measures of fit and formulate and evaluate tests of fit and of regression coefficients in a simple linear regression\n14.A foreign exchange trader runs a linear regression with 24 observations in which BRL/USD is the independent variable and MXN/USD is the\ndependent variable and compiles the following results:\nThe standard error of the estimate is closest to:\nA. 0.418\n\nB. 0.436\nC. 0.473\nExplanation\nThe standard error of the estimate (s ) measures the accuracy of a regression as the average distance between each predicted and observed\ne\nindependent variable (Y). It is also known as the standard error of the regression or the root mean square error (MSE). It is an absolute\nmeasure presented in the same units as Y. Smaller values of s mean that the regression has smaller errors; therefore, the regression line is a\ne\nbetter fit for the data.\nSince this scenario does not provide the MSE, it must be calculated as the ratio of the sum of squares error (SSE), or residual sum of squares, to\nthe degrees of freedom (df). Note that the df(residual) is the difference between the sample size (n = 24) and the number of variables (X and Y)\n(ie, 24 − 2 = 22).\n(Choice A) 0.418 is obtained by incorrectly using the number of observations (ie, sample size) in the denominator instead of the df, n − 2 (ie,\nsquare root of 4.190 / 24).\n(Choice C) 0.473 is obtained by incorrectly using the sum of squares total (SST), or total sum of squares, in the numerator instead of SSE (ie,\nsquare root of 4.932 / 22).\nThings to remember:\nThe standard error of the estimate (s ), or square root of the mean square error, quantifies the accuracy of the regression (ie, the average error). It\ne\nis an absolute measure of how well the regression line fits the data, presented in the same units as the dependent variable. Smaller values of s\ne\nmean that the regression has a smaller error and better precision.\nDescribe the use of analysis of variance (ANOVA) in regression analysis, interpret ANOVA results, and calculate and interpret the standard error\nof Estimate in a simple linear regression", "qhtml": null}, {"n": 196, "q": "An analyst runs a simple linear regression using a sample of 10 observations. To assess the validity of the regression statistics, the analyst randomly draws 20 observations from the same data. The results of both regression analyses are: Sum of Sum of Sample size squares squares total (SST) errors (SSE) Regression 1 10 167.00 47.75 Regression 2 20 334.00 95.50 Based on this information, the analyst should most likely conclude that:", "opts": ["Regression 1 has a larger F-statistic.", "both regressions have the same F-statistic.", "Regression 2 has a larger F-statistic."], "ans": "C", "expl": "Sum of squares total\nSum of squares total (SST) = Sum of squares regression (SSR) + Sum of squares error (SSE)\nA simple linear regression (SLR) can be used to assess the degree to which variations in a dependent variable are explained by variations in an\nindependent variable. Outputs of a regression analysis include the:\nsum of squares total (SST), the variation in the observed values of the dependent variable versus its average value,\nsum of squares regression (SSR), the proportion of variation of the dependent variable explained by changes in the independent variable,\nand\nsum of squares error (SSE), the proportion of variation of the dependent variable unexplained by changes in the independent variable.\nF-statistics are used to evaluate the goodness of fit (ie, how well the regression model fits the data). F-statistics reflect the explained versus\nthe unexplained variation in the dependent variable, adjusted for sample size and degrees of freedom (ie, mean square regression [MSR] /\nmean square error [MSE]). For a given data set, both the SSR and SSE increase as sample size increases:\nIn this scenario, both the SST and SSE double when the sample size doubles. This indicates the same relative variance is exhibited by both\nsamples. Since the divisor in calculating the F-statistic is inversely related to sample size, other things equal, a larger sample size exhibiting the\nsame relative variation results in a greater value for the F-statistic (Choices A and B).\nA larger sample size that exhibits the same relative variation of the dependent variable should give an analyst greater confidence regarding the\nexplanatory power of the independent variable.\nCalculate and interpret measures of fit and formulate and evaluate tests of fit and of regression coefficients in a simple linear regression\n14.A foreign exchange trader runs a linear regression with 24 observations in which BRL/USD is the independent variable and MXN/USD is the\ndependent variable and compiles the following results:\nThe standard error of the estimate is closest to:\nA. 0.418\n\nB. 0.436\nC. 0.473\nExplanation\nThe standard error of the estimate (s ) measures the accuracy of a regression as the average distance between each predicted and observed\ne\nindependent variable (Y). It is also known as the standard error of the regression or the root mean square error (MSE). It is an absolute\nmeasure presented in the same units as Y. Smaller values of s mean that the regression has smaller errors; therefore, the regression line is a\ne\nbetter fit for the data.\nSince this scenario does not provide the MSE, it must be calculated as the ratio of the sum of squares error (SSE), or residual sum of squares, to\nthe degrees of freedom (df). Note that the df(residual) is the difference between the sample size (n = 24) and the number of variables (X and Y)\n(ie, 24 − 2 = 22).\n(Choice A) 0.418 is obtained by incorrectly using the number of observations (ie, sample size) in the denominator instead of the df, n − 2 (ie,\nsquare root of 4.190 / 24).\n(Choice C) 0.473 is obtained by incorrectly using the sum of squares total (SST), or total sum of squares, in the numerator instead of SSE (ie,\nsquare root of 4.932 / 22).\nThings to remember:\nThe standard error of the estimate (s ), or square root of the mean square error, quantifies the accuracy of the regression (ie, the average error). It\ne\nis an absolute measure of how well the regression line fits the data, presented in the same units as the dependent variable. Smaller values of s\ne\nmean that the regression has a smaller error and better precision.\nDescribe the use of analysis of variance (ANOVA) in regression analysis, interpret ANOVA results, and calculate and interpret the standard error\nof Estimate in a simple linear regression", "qhtml": null}, {"n": 197, "q": "A foreign exchange trader runs a linear regression with 24 observations in which BRL/USD is the independent variable and MXN/USD is the dependent variable and compiles the following results: The standard error of the estimate is closest to:", "opts": ["0.418", "0.436", "0.473"], "ans": "B", "expl": "The standard error of the estimate (s ) measures the accuracy of a regression as the average distance between each predicted and observed\ne\nindependent variable (Y). It is also known as the standard error of the regression or the root mean square error (MSE). It is an absolute\nmeasure presented in the same units as Y. Smaller values of s mean that the regression has smaller errors; therefore, the regression line is a\ne\nbetter fit for the data.\nSince this scenario does not provide the MSE, it must be calculated as the ratio of the sum of squares error (SSE), or residual sum of squares, to\nthe degrees of freedom (df). Note that the df(residual) is the difference between the sample size (n = 24) and the number of variables (X and Y)\n(ie, 24 − 2 = 22).\n(Choice A) 0.418 is obtained by incorrectly using the number of observations (ie, sample size) in the denominator instead of the df, n − 2 (ie,\nsquare root of 4.190 / 24).\n(Choice C) 0.473 is obtained by incorrectly using the sum of squares total (SST), or total sum of squares, in the numerator instead of SSE (ie,\nsquare root of 4.932 / 22).\nThings to remember:\nThe standard error of the estimate (s ), or square root of the mean square error, quantifies the accuracy of the regression (ie, the average error). It\ne\nis an absolute measure of how well the regression line fits the data, presented in the same units as the dependent variable. Smaller values of s\ne\nmean that the regression has a smaller error and better precision.\nDescribe the use of analysis of variance (ANOVA) in regression analysis, interpret ANOVA results, and calculate and interpret the standard error\nof Estimate in a simple linear regression", "qhtml": null}, {"n": 198, "q": "Given that the goal of a linear regression is to explain the variation of the dependent variable Y, the sum of squares regression (SSR) is best described as the:", "opts": ["total variation of Y.", "explained variation of Y.", "unexplained variation of Y."], "ans": "B", "expl": "A linear regression evaluates the relationship between two or more variables, plotting a straight line that best fits the data. The more the model\nexplains the variation of the dependent variable Y, the greater its goodness of fit.\nThe variation of Y is often called the sum of squares total (SST). SST is the total squared difference between each observed Y and the average\nvalue Ῡ, based on the results from the sample data (ie, independent of the regression model). Then, the regression model can help to explain\nSST based on the changes of one or more independent variables. The model breaks the SST into two measures of total squared differences:\nSum of squares regression (SSR) measures differences between Ῡ and Ŷ (the value of Y predicted by the regression model). Since Ῡ can\nbe interpreted as the expected value of Y without a regression model, SSR quantifies how much of SST is explained by the model.\nSum of squares error (SSE) measures differences between Y and Ŷ. Since this is a measure of the prediction error, SSE quantifies how\nmuch of SST is unexplained by the model (Choice C).\nTherefore, SST equals the total variation of Y (ie, the sum of the explained variation and the unexplained variation) (Choice A).\nThings to remember:\nThe variation of Y is known as the sum of squares total (SST), the total squared difference between each observed Y and the average value Ῡ,\nbased on the results from the sample data. The regression model can help to explain SST as two components: the sum of squares regression\n(SSR), the variation explained by the regression model; and the sum of squares error (SSE), the variation unexplained by the model.\nDescribe a simple linear regression model, how the least squares criterion is used to estimate regression coefficients, and the interpretation of\nthese coefficients", "qhtml": null}, {"n": 199, "q": "After running a simple linear regression, a trader analyzes the resulting residual plot: Based on only the residual plot, this regression model most likely violated which of the following linear regression assumptions?", "opts": ["Linearity", "Independence", "Homoskedasticity"], "ans": "C", "expl": "A residual is the difference between the observed value of the dependent variable and the value predicted by the regression. In a simple linear\nregression (SLR), residuals are the vertical distance between the actual observations and the regression line, which is the straight line that\nminimizes the sum of the squares of all residuals (ie, the sum of squares error).\nIdeally, the residual plot is randomly scattered; the presence of a pattern often indicates the violation of one or more assumptions underlying\nthe simple linear regression model.\nIn this scenario, there is a pattern: the variance increases as the value of the independent variable increases. This indicates a violation of\nhomoskedasticity, which assumes that observations have a similar dispersion and residuals have constant variance. That violation is called\nheteroskedasticity.\n(Choice A) Linearity assumes that the variables have a linear relationship. Nonlinearity, the violation of this assumption, is indicated by a\nconcentration of positive residuals in a range (or ranges) of the plot and of negative residuals in other range(s). No concentration exists in this\nscenario's residual plot.\n(Choice B) Independence assumes that observations are uncorrelated. Autocorrelation, the violation of this assumption, is often indicated by\nplotting the residuals against time (ie, observation order), and identifying that neighboring residuals have similar signs and magnitudes. There is\nno evidence of autocorrelation in this residual plot.\nThings to remember:\nThe presence of patterns in residual plots often indicates a violation of the assumptions of a linear regression. If the residual plot shows changes\nin variance across observations, the homoskedasticity assumption is violated and the linear regression will be less accurate for part of the\npopulation. This is called heteroskedasticity.\nExplain the assumptions underlying the simple linear regression model, and describe how residuals and residual plots indicate if these\nassumptions may have been violated", "qhtml": null}, {"n": 200, "q": "An analyst runs a linear regression between two variables but infers that they have a nonlinear relationship. Which of the following approaches would be most appropriate to address this issue? ", "opts": ["Transform one or both variables", "Use an indicator (dummy) variable", "Increase the number of observations"], "ans": "A", "expl": "Linearity is one of the four key assumptions of a simple linear regression. However, even if data sets do not have a linear relationship, it is\npossible to transform one or both variables by using the square, the reciprocal, or the log and then employing a linear regression with the\ntransformed variable(s).\nA common solution to nonlinearity is to use a log transformation. This results in distinct functional forms, allowing the regression line to better fit\na curvature. In the graphs, it is evident that the linear functional form does not depict a linear relationship but the log-lin functional form\nprovides a much better fit, resulting in a stronger regression model. Although the graphs indicate this improvement, the statistics of both\nregression models cannot be compared directly since they use different forms of the dependent variable.\n(Choice B) An indicator variable (ie, dummy variable) is used in specific situations (eg, when there is seasonal data indicating autocorrelation) but\nnot as a solution to nonlinearity.\n(Choice C) Increasing the sample size reduces a regression's uncertainty but does not resolve the nonlinear relationship between variables.\nThings to remember:\nThe transformation (eg, the square, the reciprocal, or the log) of one or both variables in a simple linear regression is often used when there is a\nnonlinear relationship. This results in distinct functional forms, allowing the regression line to better fit a curvature.\nDescribe different functional forms of simple linear regressions", "qhtml": null}, {"n": 201, "q": "A linear regression will most likely provide valid conclusions even if:", "opts": ["the independent variable is not normally distributed.", "there is a strong seasonal pattern in a time series data.", "the dispersion of the dependent variable changes as the independent variable increases."], "ans": "A", "expl": "Assumptions of a simple linear regression\nLinearity Relationship between X and Y is linear\nResiduals for all observations have constant\nHomoskedasticity\nvariance\nObservations are independent and residuals are\nIndependence\nuncorrelated\nNormality Residuals are normally distributed\nX = Independent variable (explanatory)\nY = Dependent variable (explained)\nResiduals = Predicted Y − Observed Y\nNormality is one of the key assumptions of simple linear regression. It does not refer to a normal distribution of the variables (ie, the independent\nvariable, X, or the dependent variable, Y); however, the residuals must be normally distributed.\nThe residuals are the difference between the observed and predicted dependent variable (Y). The nonnormality of residuals compromises some\nuses of the regression model (eg, prediction intervals), but it does not affect the estimated coefficients (ie, slope and intercept), and thus the\nvariables. As the number of observations increases, this assumption becomes less relevant, according to the central limit theorem.\n(Choice B) A strong seasonal pattern in time series data is an indicator of autocorrelation (ie, correlation between sequential values of the same\nvariable), violating the independence assumption. This harms the independence of the residuals and biases the variance of the estimated\ncoefficients, invalidating any significance test of the coefficients.\n(Choice C) If the dispersion of Y changes as X increases, there is heteroskedasticity, violating the homoskedasticity assumption. The variance of\nthe residuals also changes and the regression model will be a less precise predictor for part of the population (ie, not a good fit).\nThings to remember:\nNormality is the assumption that the residuals of a linear regression are normally distributed. It does not require a normal distribution of the\nvariables. A violation of normality compromises some uses of the regression (eg, prediction intervals), but not the estimation of coefficients. This\nassumption becomes irrelevant when there are many observations due to the central limit theorem.\nExplain the assumptions underlying the simple linear regression model, and describe how residuals and residual plots indicate if these\nassumptions may have been violated", "qhtml": null}, {"n": 202, "q": "The following table summarizes performance data for a mutual fund and its benchmark for the last 50 months: Fund Benchmark Return (Y) Return (X) Mean 1.48 1.20 Variance 5.60 5.07 Covariance (Y,X) 4.78 Based on this data, if an investor expects a 0% return for the benchmark next month, the predicted return of the mutual fund will be closest to: ", "opts": ["0.35%", "0.94%", "1.48%"], "ans": "A", "expl": "The coefficients of a linear regression (ie, slope and intercept) can be estimated based on common statistical measures, as given in this\nscenario. When the expected benchmark return (the independent variable, X) equals zero, the predicted return of the mutual fund (the predicted\ndependent variable, Ŷ) equals the value of the intercept.\nBased on the information given, find the intercept using the return means as the independent and dependent variable values and the slope of the\nregression line. The slope is the ratio of the covariance of Y and X to the variance of X. This is derived from the least squares criterion that drives\nthe goal of the linear regression: to minimize the sum of the squared residuals so that the regression line is the best fit for the data.\nIt is important to note that 0.35% is the predicted mutual fund return, not the observed (ie, actual) return, and that the data set is just a sample of\nthe population, so the calculated coefficients will always be estimates of the population parameters.\n(Choice B) 0.94% is the slope, or the change in the predicted return of the mutual fund for every unit change in the expected return of the\nbenchmark.\n(Choice C) 1.48% is the mean (ie, average) return of the mutual fund. It is the expected return when there is no information about the\nbenchmark.\nThings to remember:\nRegression coefficients can be estimated using common statistical measures. This results from the least squares criterion that drives the linear\nregression's goal of minimizing the sum of the squared residuals (ie, the difference between observed Y and predicted Y) so that the estimated\nregression line is the best fit for the data.\nDescribe a simple linear regression model, how the least squares criterion is used to estimate regression coefficients, and the interpretation of\nthese coefficients", "qhtml": null}, {"n": 203, "q": "An equity analyst evaluates how the percentage change in cotton prices affects the percentage change in the stock price of an apparel company. The analyst prepares a linear regression, resulting in an intercept of 0.3 and a slope of −0.7. According to this regression, the predicted change in stock price given a 2% increase in cotton prices is closest to:", "opts": ["−1.4%", "−1.1%", "−0.1%"], "ans": "B", "expl": "This linear equation represents the current scenario. The intercept is 0.3, so if the change in cotton price is zero, the predicted monthly change in\nstock price is 0.3%. The slope is −0.7, meaning that every 1% increase in cotton prices would make the stock price decrease by an incremental\n0.7%.\nTherefore, a 2% increase in cotton prices results in a predicted decrease of 1.1% [0.3 − (0.7 × 2)] in the stock price. It is important to note that\nthis is a predicted variation, not the observed (ie, actual) stock price change.\nA linear regression with one independent variable has two coefficients and is presented as a scatterplot, where the:\nIntercept is the value of the dependent variable when the independent variable equals zero (ie, the expected variation in the estimate that\nis unrelated to the independent variable).\nSlope is the change in the dependent variable for every unit change in the independent variable.\n(Choice A) −1.4% results from ignoring the intercept, but the regression model includes the intercept as the variation unrelated to changes in the\nindependent variable.\n(Choice C) −0.1% results from misplacing both coefficients and multiplying the 2% variation by the intercept instead of the slope [(0.3 × 2) − 0.7].\nThings to remember:\nIn a linear regression, the intercept is the value of the dependent variable Y when the independent variable X equals zero (ie, the expected change\nin the dependent variable regardless of the change in the independent variable). The slope is the change in the dependent variable for every unit\nchange in the independent variable. These coefficients and the independent variable explain the variations in the dependent variable.\nDescribe a simple linear regression model, how the least squares criterion is used to estimate regression coefficients, and the interpretation of\nthese coefficients", "qhtml": null}, {"n": 204, "q": "A trader runs a linear regression model and calculates a prediction interval. The trader reviews the results, then runs a second model based on the same data set and calculates a significantly narrower prediction interval. Based only on this information, the trader most likely:", "opts": ["decreased the sample size.", "increased the level of significance.", "assumed the forecasted independent variable is farther from the sample mean."], "ans": "B", "expl": "Simple linear regressions can be used to predict a dependent variable (Ŷ) based on a forecasted value of the independent variable (X). The\nf f\nforecast's prediction interval is the expected range of values around Ŷ for a given level of significance (α).\nf\nThe range (ie, the width) of the interval is a function of two components: the critical t-value, which is a reliability factor, and the standard error of\nthe forecast (s), which measures the accuracy of the forecast (for a given value of X). Factors that can affect this range, when comparing the first\nf f\nmodel to the second, are:\nDecreasing the number of observations (ie, sample size) results in a less reliable model. The prediction interval is wider to reflect the\ngreater uncertainty (Choice A).\nIncreasing the significance level decreases the confidence level (ie, the probability that the actual value of Y lies within the prediction\ninterval) and narrows the interval.\nIf the forecasted independent variable is farther from the sample mean independent variable, it decreases accuracy and increases\nuncertainty, thus widening the prediction interval (Choice C).\nThings to remember:\nThe prediction interval of a forecast is the expected range of values around the predicted dependent variable, resulting from factors such as the\nnumber of observations, the significance level, and the forecasted independent variable. The smaller (greater) the number of observations and the\nsignificance level and the farther (closer) the forecasted independent variable from the sample mean, the wider (narrower) the interval.\nCalculate and Interpret the predicted value for the dependent variable, and a prediction interval for it, given an estimated linear regression model\nand a value for the independent variable", "qhtml": null}, {"n": 205, "q": "Which of the following is most likely to cause errors in a machine learning (ML) model that is based on unsupervised learning?", "opts": ["The algorithm overfits the data.", "The algorithm's training data is biased.", "The algorithm uses unlabeled data to find common patterns."], "ans": "A", "expl": "Types of machine learning (ML)\nModel specifies inputs and outputs (\"labeled data\") to train algorithm\nSupervised\nAlgorithm predicts outcomes from new data sources\nModel does not specify outputs and uses unlabeled input data\nUnsupervised\nAlgorithm attempts to find patterns or characteristics from raw data\nCan incorporate supervised or unsupervised ML\nDeep learning\nUses multi-stage nonlinear data processing\nMachine learning (ML) is a subcategory of artificial intelligence in which computer algorithms \"learn\" to predict outcomes from inputs known\nas training data. Fintech incorporates ML to analyze information from very large data sets that the program then uses to predict outcomes. The\ntwo primary types of ML are supervised learning and unsupervised learning.\nOverfitting refers to an ML model that attributes significance to a variable in the training data when that variable only works with that specific\ndata. For models based on supervised learning, overfitting can cause prediction errors when using the program with different input data. For\nunsupervised learning models, overfitting occurs when the model fits the input data too well but has no predictive value when it uses a different\ndata set.\n(Choice B) This is an example of an event that causes errors in supervised ML. The algorithm attempts to model specified outcomes from input\ndata called \"training\" or \"labeled\" data. If the training data is of poor quality or if there is not enough data, the model will be a poor predictor of\nfuture outcomes. This isn't a factor in unsupervised ML since unsupervised ML uses only unlabeled data.\n(Choice C) This is an example of unsupervised ML, not one of its most common causes of errors. Unsupervised ML differs from supervised\nlearning in that the algorithm attempts to find patterns from the input data rather than trying to predict specific outcomes. The input data for\nunsupervised learning is called unlabeled data.\nThings to remember:\nMachine learning (ML) is a form of artificial intelligence. It is used in fintech to analyze large amounts of data to identify variables that allow the\nprediction of future outcomes, or to find patterns in raw input data. One problem with ML arises from overfitting, which happens when predicted\noutcomes are too specific to the input data. An algorithm that has been overfit loses its predictive ability when different input data is used.\nDescribe Big Data, artificial intelligence, and machine learning", "qhtml": null}, {"n": 206, "q": "A human investment adviser would least appropriately use a robo-adviser to:", "opts": ["create passively managed portfolios.", "offer wealth management and planning.", "gain a greater market share of cost-conscious investors."], "ans": "B", "expl": "Robo-advisers are low-cost investment services offered through an online platform with no (or minimal) involvement by a human adviser.\nTypically, an investor provides information concerning investment goals and risk tolerances through an online questionnaire. The robo-adviser\nuses algorithms and historical market data to recommend an asset allocation for a passive strategy, usually applied to a standardized portfolio of\nexchange-traded funds, that aligns with the investor's responses (Choice A).\nHigh net worth clients are usually inappropriate candidates for robo-advisers since they generally need advice on more complex investment\nissues, such as charitable giving and estate planning. In addition, high net worth clients are more likely to seek active management, since their\ngreater asset base allows for a higher risk tolerance. Thus, robo-advisers are usually inappropriate for wealth planning applications.\n(Choices C) Investment advisers often use robo-advisers to service investors who have less wealth and risk tolerance than high-net-worth clients\nand are more cost-conscious and therefore would benefit from low-cost, passive investment strategies.\nThings to remember:\nRobo-advisers offer investment recommendations, usually passive asset allocations applied to a standardized portfolio of funds, based on\nalgorithms that work with investors' quantifiable investment goals and risk tolerances. Robo-advisers are most appropriate for investors who\nwould benefit from passive and low-cost investment strategies, but are not appropriate for the complexities of wealth planning.\nDescribe applications of Big Data and Data Science to investment management", "qhtml": null}, {"n": 207, "q": "An analyst wishes to understand sentiment based on remarks during a recent earnings call. Of the following, the most appropriate visualization tool for the analyst to use would be a:", "opts": ["heat map.", "word cloud.", "frequency polygon."], "ans": "B", "expl": "A word cloud is a visual tool for representing the distribution of textual, unstructured data in a given data source (eg, financial filings, social\nmedia). The font size of each word in the word cloud is directly related to its frequency of occurrence within that source of data.\nWord clouds typically exclude common words that lack contextual meaning (eg, and, or, the) so that only meaningful words remain, allowing the\ncloud to provide useful information (eg, frequent use of positive words suggests positive sentiment). Word clouds may be used by financial market\nparticipants for purposes such as quickly assessing a company's sentiment based on its earnings filings or calls and learning potential customers'\nattitudes about products.\n(Choice A) Heat maps summarize and display the joint frequencies of two variables. They would not be appropriate for visualizing textual data.\n(Choice C) Frequency polygons display a distribution of numerical data by breaking the data into intervals, with the frequency of each interval\nrepresented by the height of a line. They would not be appropriate for visualizing textual data.\nThings to remember:\nA word cloud is a visual tool for representing the distribution of textual data in a given source. The size of each word represents its frequency\nwithin the data source, so that the words with larger fonts are those that appear most often in the source.\nDescribe applications of Big Data and Data Science to investment management", "qhtml": null}, {"n": 208, "q": "A fund manager is preparing a presentation that shows the fund's number of stock holdings per country and also categorizes the stocks by market cap. Which of the following data visualization tools is most appropriate to reflect this data? ", "opts": ["Tree-map", "Histogram", "Scatterplot matrix"], "ans": "A", "expl": "Data visualization tools display the frequency of categorical (ie, qualitative) or numerical (ie, quantitative) data points. Tree-maps visualize the\nfrequency of categorical variables by using nested rectangles and can show joint frequencies across different levels of a hierarchy. In this\nscenario, the fund manager wants to simultaneously show the total number of stock holdings per country and the stock classifications by market\ncap.\nThe frequency of each outcome of the first-level categorical variable (eg, country) is visualized using differently colored rectangles, with each\nrectangle's size proportional to the number of observations. Those rectangles are further divided into smaller rectangles, which group\nobservations based on a second categorical variable and show the frequency of variable outcomes (eg, different market caps). In this way, tree-\nmaps can display joint frequencies (eg, frequency by country and market cap) and accommodate as many levels of categorical data as needed.\n(Choice B) Histograms are used to display the frequency of numerical variables. They cannot be used with categorical variables.\n(Choice C) A scatterplot matrix is a collection of scatterplots in which each graph is used to examine the relationship between a different\ncombination of two numerical variables. It cannot be used for categorical variables.\nThings to remember:\nTree-maps visualize the frequency of categorical variables by using nested rectangles and can show joint frequencies across different levels of a\nhierarchy. Distinct variable outcomes are presented using differently colored rectangles that can be split further into subgroups. The size of each\nrectangle is proportional to the number of observations.\nDescribe applications of Big Data and Data Science to investment management", "qhtml": null}, {"n": 209, "q": "Natural language processing is most appropriate for use when:", "opts": ["analysis is needed for large amounts of sensor-based data.", "a company globally monitors employee emails for compliance.", "the algorithm must generate predictions that are highly accurate."], "ans": "B", "expl": "Text analytics is a fintech application that analyzes text- and voice-based data. Natural language processing (NLP) is a category of text\nanalytics that focuses mainly on developing algorithms and applications to interpret human language. NLP can enhance a company's\ncompliance processes by automatically monitoring employee emails for word patterns that may flag compliance issues or even fraud.\nOne limitation to NLP is that human language is imprecise; an algorithm may not be able to interpret idioms or distinguish true intent from\nsarcasm. NLP used to analyze emails does not necessarily conclude that fraud or noncompliance occurred. Instead, it allows humans to\ninvestigate further based on the initial algorithmic analysis. NLP may not be suitable for analysis that needs to convey very precise outputs or\npredictions (Choice C).\n(Choice A) Sensor-based data consists of items such as satellite imagery, climate and security updates for \"smart\" buildings, and smartphone\nimages. This type of data typically does not involve human language, so NLP would not be useful.\nThings to remember:\nNatural language processing is a category of text analytics. It involves data analysis of text- and voice-based data.\nDescribe applications of Big Data and Data Science to investment management", "qhtml": null}, {"n": 210, "q": "Machine learning may be most appropriate for data analysis if:", "opts": ["training data are applied to targeted outputs.", "the input data have not been filtered to eliminate bias.", "patterns from raw data inputs were obtained through supervised learning."], "ans": "A", "expl": "Types of machine learning (ML)\nModel specifies inputs and outputs (\"labeled data\") to train algorithm\nSupervised\nAlgorithm predicts outcomes from new data sources\nModel does not specify outputs and uses unlabeled input data\nUnsupervised\nAlgorithm attempts to find patterns or characteristics from raw data\nCan incorporate supervised or unsupervised ML\nDeep learning\nUses multi-stage nonlinear data processing\nMachine learning (ML) is a subcategory of artificial intelligence in which computer programs \"learn\" to predict outcomes from inputs known as\ntraining data. \"Fintech\" is the term used to describe the integration of technology with financial services. It incorporates ML to analyze information\nfrom very large datasets, which the programs then use to predict outcomes.\nOne type of ML model is created through supervised learning. Supervised learning refers to algorithms that map input data to specified outputs\n(ie, targeted outputs). Both the data and the targeted output are provided to the algorithm, which \"learns\" from subsequent input data. One\nexample is using historical information correlated to stock prices to identify variables that predict price changes. The algorithm then uses changes\nin those variables to predict future stock prices (ie, targeted outputs).\n(Choice B) ML requires large amounts of data to be effective. The data must be as free as possible from bias (eg, sample bias, where the\nsample is not representative of the environment in which the algorithm will be running). In addition, it must not contain spurious data (eg, data that\nappear to be related but are not causally connected).\n(Choice C) Supervised learning specifies inputs and outputs that an algorithm uses to find patterns in new raw data sources. Unsupervised\nlearning refers to ML models that determine patterns or characteristics from large amounts of raw input data without specified inputs or outputs.\nAn unsupervised learning algorithm may be able to discern patterns from data that would not be obvious to humans.\nThings to remember:\nMachine learning (ML) is a type of artificial intelligence. Supervised ML applies input data to algorithms that map the data to specific (ie, targeted)\noutputs. In order to be effective, the input data used to build and refine the algorithms must be free of bias.\nDescribe Big Data, artificial intelligence, and machine learning", "qhtml": null}, {"n": 211, "q": "Use of fintech most appropriately enhances a company's risk analysis capabilities when:", "opts": ["machine learning analyzes input data for errors.", "the data to be analyzed excludes quantitative data.", "the risk analysis focuses mainly on market and trading risk rather than operational risk."], "ans": "A", "expl": "Fintech refers to technological innovation in designing and delivering financial information and products. One practical application of fintech\nconcerns how investment companies can utilize machine learning to analyze and manage risk. Machine learning is the creation of algorithms that\nanalyze enormous amounts of qualitative and quantitative input data to predict future outcomes or to identify patterns that would not otherwise be\nobvious.\nRisk analysis uses data from multiple sources, many of which are classified as alternative sources (eg, photographs, text messages). Machine\nlearning is easily adapted to determine whether this data contains errors, bias, or outliers that would distort the predictive ability of a risk model\nthat will use the data. In other words, if the data contains errors that were missed during human quality control processes, machine learning can\nhelp validate the data before it is used by the algorithm that manages risk.\n(Choice B) Risk management uses both quantitative and qualitative data.\n(Choice C) Operational risk is the risk of loss caused by failed systems or processes within the firm. Fintech can use algorithms that analyze a\nvariety of input data to predict events that result in losses from operational risk.\nThings to remember:\nA practical application of fintech is to analyze risk in the investment industry. Risk analysis incorporates qualitative and quantitative data from\nmultiple sources. Machine learning can be used to vet data for errors, bias, and outliers before the data is inputted for risk models.\nDescribe applications of Big Data and Data Science to investment management", "qhtml": null}, {"n": 212, "q": "A corporate banking analyst is evaluating the concentration risk of a bank's lending portfolio jointly across countries and sectors. The analyst calculates the relative value of the loans (by country and sector) in proportion to the portfolio's value. Which of the following data visualization tools is most appropriate to reflect this data?", "opts": ["Heat map", "Line chart", "Scatterplot"], "ans": "A", "expl": "The frequency of categorical (qualitative) or numerical (quantitative) data points can be summarized using data visualization tools. The joint\nfrequencies of two categorical variables can be depicted using a heat map.\nHeat maps visualize relative magnitude using a color spectrum. One end of the color spectrum represents high-frequency data points; the\nopposite end represents low-frequency data points. Each cell is colored differently according to the corresponding frequency. Heat maps can also\nbe used to visualize the correlation between two categorical variables.\nIn this scenario, each loan is assessed for two categorical variables: the sector invested in and the country invested in. An analyst calculates the\nrelative frequency for each possible combination of the two variables, represented by each loan's percentage of the total portfolio (based on the\nloan's nominal value) and allocated jointly to each sector and country. Data points on the color spectrum's high end are associated with a higher\nconcentration risk in the corresponding markets.\n(Choice B) Line charts, such as frequency polygons, display the frequency of one variable only and therefore cannot show joint frequencies. In\nother applications, more than one variable can be accommodated by plotting multiple data sets separately in the same chart for comparison.\n(Choice C) A scatterplot shows the relationship between two numerical variables represented on the x-axis and the y-axis (eg, technology sector\nreturns versus Dow Jones Industrial Average returns). However, the two axes form a numerical scale for data points, so the scatterplot cannot be\nused to present categorical variables.\nThings to remember:\nHeat maps show relative magnitude and can depict the joint frequencies of two categorical variables. These maps use a color spectrum to\ngraphically represent frequency.\nDescribe applications of Big Data and Data Science to investment management", "qhtml": null}, {"n": 213, "q": "Big Data most likely:", "opts": ["excludes data generated from traditional sources.", "excludes unstructured data and includes only structured data.", "is typically composed of data sets generated at high velocities."], "ans": "C", "expl": "Overview of Big Data\nTraditional: includes financial reports, census reports\nData sources\nAlternative: includes social media, sensor networks\nVolume: large number of data points\nData set characteristics Velocity: high speed of data collection\nVariety: many different formats and sources\nStructured: tabular data with distinct fields (eg, address database)\nData structure Unstructured: unorganized data not in tabular format (eg, audios)\nSemistructured: mixture of structured and unstructured formats\nBig Data is a term referring to enormous amounts of data generated by businesses, governments, and individuals that can be captured through\nsources that are either traditional (eg, census reports) or alternative (eg, social media posts) (Choice A). These data sets are typically\ncharacterized by high volume (data points), velocity (speed), and variety (formats).\nThe data can be structured, unstructured, or semistructured (Choice B). Structured data is stored in a tabular format where a unique record is\nstored in each row and various fields are stored in each column. Unstructured data such as data from an audio file is not stored in a tabular form.\nSemistructured data is a combination of the two.\nThings to remember:\nBig Data refers to enormous amounts of data generated by businesses, governments, and individuals that can be captured through traditional or\nalternative sources. These data sets are typically characterized by high volume, velocity, and variety. The data can be structured, unstructured, or\nsemistructured.\nDescribe Big Data, artificial intelligence, and machine learning", "qhtml": null}, {"n": 214, "q": "When considering different sources of Big Data, structured data most likely includes:", "opts": ["computer spreadsheets of historic company information.", "postings by users of consumer products on social media.", "point-of-sale information transmitted by cash registers in stores."], "ans": "A", "expl": "Classifications of big data\nTraditional\nPrices of stock trades\nCompany reports\nSources\nAlternative\nSocial media\nSatellite images\nStructured: Tabular depiction (eg, spreadsheets)\nData types Unstructured: Requires additional applications such as\nimage recognition software and use data\nFintech refers to technological innovation in designing and delivering financial information and products. One area of fintech concerns ways\nto efficiently use data generated by businesses, governments, and individuals. This data can arise from both traditional and alternative information\nsources; collectively, this data is commonly referred to as Big Data.\nBig Data can be categorized as structured or unstructured. Structured data refers to data that can be easily stored in a database. Historical\nstock prices, company earnings. and economic statistics are examples of structured data. Unstructured data largely encompasses alternative\ndata sources such as social media postings and transaction information from point-of-sale registers in retail stores (Choices B and C).\nUnstructured data requires special applications to process the information before investment professionals can use it.\nThings to remember:\nFintech refers to technological innovations in the financial services industry. Many innovations focus on analyzing data from traditional and\nalternative sources, collectively known as Big Data. Big Data consists of both structured and unstructured data. The latter must be processed by\nspecial applications before it is used.\nDescribe Big Data, artificial intelligence, and machine learning", "qhtml": null}, {"n": 215, "q": "With respect to machine learning, a model is most likely underfitted when:", "opts": ["the underlying data set is too small to analyze.", "the model treats true parameters as if they were noise (ie, insignificant datapoints).", "the model treats noise (ie, insignificant datapoints) as if they were true parameters."], "ans": "B", "expl": "Potential errors in the machine learning process\nTreats insignificant parameters as significant parameters\nOverfit\nResults from overly precise analysis\nTreats significant parameters as insignificant parameters\nUnderfit\nResults from overly simplistic analysis\nMachine learning (ML) uses algorithms to identify patterns and relationships from training data (ie, input data) to predict outcomes for other data\nsets. According to CFA Institute curriculum, \"ML algorithms aim to 'find the pattern, apply the pattern.'\" Analysts should be aware of errors that\narise from overfitting or underfitting training data during the training process.\nOverfitting refers to putting undue weight on insignificant datapoints (ie, noise) and treating them as if they were significant (Choice C). It results\nfrom overly precise data analysis. False relationships or unsubstantiated patterns are drawn from the training data and may lead to prediction\nerrors in the future.\nUnderfitting refers to putting too little weight on true (ie, significant) parameters and treating them as if they were noise. It results from overly\nsimplistic data analysis. Important relationships or patterns may be left undiscovered in the training data, which may lead to prediction errors in\nthe future.\n(Choice A) Underfit does not refer to the size of the training data. It refers to how well the data is specified.\nThings to remember:\nAnalysts should be aware of errors that arise from overfitting or underfitting training data in the machine learning process. Overfitting refers to\nputting undue weight on insignificant datapoints (ie, noise) and treating them as if they were significant. Underfitting refers to putting too little\nweight on true (ie, significant) parameters and treating them as if they were noise.\nDescribe Big Data, artificial intelligence, and machine learning", "qhtml": null}, {"n": 216, "q": "Which of the following best describes fintech within the investment management industry? Fintech is:", "opts": ["the financial analysis of technology stocks.", "a form of technical analysis used to determine the price of an asset.", "the convergence of finance and technology that provides easier access to investment services."], "ans": "C", "expl": "The convergence of finance and technology is commonly known as fintech. Creators and users of fintech changed the investment management\nindustry. For example, firms now use robo-advisers, which are automated client account management programs using preset algorithms.\nInvestors using robo-advisers receive a portfolio that matches their objectives (ie, return) and constraints (ie, risks) with little human interaction.\nWith more automation than traditional investing, fintech enables investors to have easier access to investment management.\n(Choices A and B) Fintech is the innovation in finance using advancements in technology. It is neither a financial analysis of technology stocks\nnor a form of technical analysis.\nThings to remember:\nThe convergence of finance and technology is known as fintech. Advances in technology allow investors to get automated personalized portfolios\nwith less human interaction. These advances provide investors easier access to investment services.\nDescribe aspects of “fintech” that are directly relevant for the gathering and analyzing of financial data", "qhtml": null}, {"n": 217, "q": "With respect to Big Data, data related to the Internet of Things (IOT) is most likely generated through:", "opts": ["sensors.", "individuals.", "business processes."], "ans": "A", "expl": "Sources of alternative data\nIndividuals Text messages, videos, photos, audio files\nBusiness processes Customer transactions, bank records, supply chain data\nSensors Smartphones, satellites, Internet of Things (IOT)\nBig Data refers to the vast amount of data generated by businesses, governments, and individuals. This data can be captured from traditional or\nalternative sources. Traditional data can be obtained from publications such as company financial reports or government census reports. In\ncontrast, alternative data are usually less structured and come from sources such as social media posts, sensors, and credit card transactions.\nAccording to CFA Institute curriculum, alternative data can be broken down into three categories: data generated by individuals, business\nprocesses, and sensors.\nData from individuals include unstructured data from text messages, videos, photos, and online audio files (Choice B).\nData from business processes include credit card information, bank records, and supply chain information (Choice C).\nData from sensors come from devices such as smartphones, cameras, and satellites that are connected through a wireless network.\nData from sensors has vastly expanded over the years due to the ongoing development of microprocessors and networking technology. This\ngrowth has spawned the Internet of Things (IOT), an information ecosystem comprising networks of physical devices stored in offices, homes, and\ncars that enable data sharing over network connections.\nThings to remember:\nBig Data refers to the vast amount of data generated by businesses, governments, and individuals. This data can be captured from traditional or\nalternative sources. Alternative data include data from sensors (eg, smartphones, cameras, satellites) that are connected through a wireless\nnetwork. The Internet of Things (IOT) refers to an array of physical sensory devices that share information across a network.\nDescribe Big Data, artificial intelligence, and machine learning", "qhtml": null}, {"n": 218, "q": "Which of the following statements is most accurate regarding machine learning?", "opts": ["A model is underfitted when it treats noise data as true parameters.", "Supervised learning involves using algorithms to learn unlabeled data.", "Training data sets help identify historical relationships between variables."], "ans": "C", "expl": "Machine learning types and purposes\nType Purpose\nTraining Uncover relationships between inputs and outputs within historical data\nValidation Validate relationships and fine-tune predictive model\nTesting Test predictive accuracy\nA machine learning (ML) model uses an algorithm to uncover patterns and relationships from one data set to predict outcomes associated\nwith other data sets.\nThe machine learning process segments data into the three subsets shown above. The training data set is used for identifying historical\nrelationships between inputs and outputs. Once the algorithm is \"trained,\" it is validated and tested for accuracy with other data sets. After testing,\nthe ML model is ready for use.\n(Choice A) Underfitting and overfitting errors can emerge from the ML process. A model is underfitted when it treats true parameters as noise\ndata and is overfitted when it treats noise data as true parameters.\n(Choice B) Computers may employ a supervised or unsupervised approach to machine learning. Supervised learning models relationships\nbased on labeled training data (ie, the inputs and outputs are clearly labeled). Unsupervised learning models relationships based on unlabeled\ndata, so the algorithm attempts to \"guess\" the pairing of the inputs with the outputs.\nThings to remember:\nThe machine learning process segments data into training, validation, and testing subsets. The training data set is used for identifying historical\nrelationships between inputs and outputs. Once an ML model's algorithm is \"trained,\" it is validated and tested for accuracy with other data sets.\nAfter testing, the model is ready for use.\nDescribe Big Data, artificial intelligence, and machine learning", "qhtml": null}, {"n": 219, "q": "A machine learning model treats noise in a training data set as valid parameters and subsequently fails when applied in reality. This outcome is most likely a result of: ", "opts": ["overfitting.", "using structured data.", "using unstructured data."], "ans": "A", "expl": "Potential errors in the machine learning process\nTreats insignificant parameters as significant parameters\nOverfit\nResults from overly precise analysis\nTreats significant parameters as insignificant parameters\nUnderfit\nResults from overly simplistic analysis\nMachine learning (ML) uses algorithms to identify patterns and relationships from training data (ie, input data) to predict outcomes for other\ndata sets. Once a pattern is identified in the training data, it is then validated and tested before being applied to real data.\nAnalysts should be aware of errors that arise from overfitting or underfitting training data during the learning process. Overfitting happens when\nthe algorithm identifies spurious relationships or patterns (ie, noise) as significant, and results in identifying invalid relationships when applied\noutside the training data.\nUnderfitting happens when the algorithm puts too little weight on valid parameters and treats them as if they were noise. This overly simplistic\ndata analysis results in important relationships or patterns left undiscovered, leading to prediction errors in the future.\n(Choices B and C) Structured and unstructured data are classifications of big data, not ML model errors. Structured data refers to data that can\nbe easily stored in a database, such as historical stock prices, company earnings, or economic statistics. Unstructured data largely encompasses\nalternative data sources such as social media postings and transaction information from point-of-sale registers in retail stores.\nThings to remember:\nMachine learning uses algorithms to identify patterns and relationships in training data to then predict outcomes for other data sets. Overfitting\nhappens when the algorithm mistakes noise for valid data and identifies spurious relationships or patterns as significant; underfitting happens\nwhen the algorithm ignores valid data and thus fails to identify critical patterns or relationships. Both errors lead to predictive failures.\nDescribe Big Data, artificial intelligence, and machine learning", "qhtml": null}];
const CFG = {"title": "Quantitative Methods — Wiley/UWorld Q-bank", "subtitle": "CFA Level I · Wiley 2024 · 219 câu · không giới hạn giờ", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
