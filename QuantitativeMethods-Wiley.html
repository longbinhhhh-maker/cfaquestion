le\nCompany size\nRating Large cap Mid cap Small cap Total by rating\nAAA or A 15 32 51 98\nBBB or BB 24 47 68 139\nHigh yield 31 55 70 156\nTotal by size 70 134 189 393\nContingency tables can be used to find patterns that exist between two variables. Each variable can have one or more categories; the only\nrequirement is that the number of categories be finite. One variable (eg, company size) is placed in rows and the other (eg, bond rating) is placed\nin columns. Each cell in a contingency table represents a joint frequency between a category of one variable and a category of the other variable.\nData in a contingency table can be displayed as a count (ie, absolute frequency) or a percentage of a total (ie, relative frequency).\nIn this question, the variables are bond rating and company size, and each variable has three categories. There are 47 defaults of bonds rated\neither BBB or BB from mid-cap companies and 134 total bond defaults from mid-cap companies, so the relative frequency is 47 / 134 ≈ 35.1%.\nWhen using contingency tables, it is crucial to know precisely which relationships are being compared. For instance, if this question had asked for\nthe frequency of BBB- or BB-rated mid-cap defaults relative to all defaults of BBB—BB bonds, the correct answer would be 47 / 139 ≈ 33.8%\n(Choice C). If the question had asked for the frequency of mid-cap defaults with those ratings relative to all defaults, the correct answer would be\n47 / 393 ≈ 12.0% (Choice A).\nThings to remember:\nA contingency table can be used to find patterns that exist between two variables. Each variable must have a finite number of categories. One\napplication of a contingency table is to detect patterns that exist between and among variables.\nExplain tests of independence based on contingency table data", "qhtml": null}, {"n": 183, "q": "An investor builds a contingency table for a group of 600 companies based on two variables: inventory valuation method and gross margin. The scaled squared deviation for each combination of these variables is presented below: Gross margin Inventory valuation method Low Average High FIFO 2.92 0.60 0.77 LIFO 1.47 0.34 0.34 Weighted average 1.18 0.21 0.35 At a 5% level of significance and based on the chi-square distribution table, the most appropriate conclusion is that:", "opts": ["the variables are positively correlated.", "the variables are independent of each other.", "the chi-square statistic is greater than the critical value."], "ans": "B", "expl": "Contingency tables can be used to find existing patterns between two categorical variables. The rows represent the groups (ie, categories) of the\nfirst variable, while the columns represent the groups of the second variable. Each cell represents a joint frequency of a pair of groups. Chi-\nsquare (χ2) is a nonparametric test statistic that tests if these variables are independent or related to each other.\nTo obtain the χ2, it is necessary to create a contingency table, an expected frequency table, and a scaled squared deviation table. This\ncalculation is extensive, but χ2 can be calculated adding the cells of the scaled squared deviation table, which is given in this question. The\ncorresponding hypothesis test is:\nAs the differences are squared (ie, positive), the only rejection region for the chi-square distribution is on the right side. Since the calculated χ2 is\nless than the critical value, there is not enough evidence that the variables are not independent, and the null hypothesis should not be rejected\n(Choice C).\n(Choice A) Correlation measures the direction and strength of the linear relationship between two variables. Therefore, it does not apply to\nunordered categorical variables, like the inventory valuation method.\nThings to remember:\nThe chi-square distributed statistic can be used to test the independence of the variables of a contingency table. The test is performed by\ncalculating expected frequencies and the squared scaled deviation and comparing the statistic with the critical value.\nExplain tests of independence based on contingency table data", "qhtml": null}, {"n": 184, "q": "An investor receives a research report that analyzes two securities through a simple linear regression. The study discloses the coefficient of determination (R2) and the sum of squares error (SSE). To estimate the accuracy of the model using an absolute measure of the errors, the investor will most likely need to know the:", "opts": ["sample size.", "regression coefficients.", "correlation between the securities."], "ans": "A", "expl": "The standard error of the estimate (s ) is an absolute (ie, not relative) measure of the accuracy of the regression, as reflected by the average\ne\ndistance between each predicted (Ŷ) and observed (Y) values of the dependent variable. Since s is the square root of the mean square error\ne\n(MSE) , it is presented in the same units as Y. Smaller values of s mean that the regression line is a better fit of the data.\ne\nIn this scenario, s is the correct statistic to use since the investor wants an absolute measure of the accuracy of the model. Other measures of\ne\ngoodness of fit, such as the coefficient of determination (R2) and the F-statistic, provide a relative measure and are not appropriate for this case.\nSince this scenario does not provide the MSE, it must be calculated as the ratio of:\nthe sum of squares error (SSE), or residual sum of squares, to\nthe degrees of freedom, derived from the sample size (n) and the number of variables.\nSince there are two variables and SSE is known, the investor will need to know n to calculate s .\ne\n(Choices B and C) The regression coefficients (ie, the intercept and the slope, and the correlation between the variables are not necessary to\ncalculate s .\ne\nThings to remember:\nThe standard error of the estimate (s ) is an absolute (ie, not relative) measure of the accuracy of the regression, presented in the same data units\ne\nas the dependent variable. s is the square root of the mean square error (MSE), which is the ratio of the residual sum of squares to the degrees\ne\nof freedom.\nDescribe the use of analysis of variance (ANOVA) in regression analysis, interpret ANOVA results, and calculate and interpret the standard error\nof Estimate in a simple linear regression", "qhtml": null}, {"n": 185, "q": "An economist runs the following regression models between two macroeconomic datasets with variable transformations: Regression M1 M2 Model lnY = b + b X + ε lnY = b + b lnX + ε 0 1 0 1 Intercept 5.723 5.338 Slope 0.233 1.184 Coefficient of determination (R2) 0.830 0.573 Standard error of the estimate (s ) 0.415 0.658 e F-statistic 137.001 37.624 Based only on this data, which of the following functional forms is the most appropriate fit for the sample data?", "opts": ["Lin-log", "Log-lin", "Log-log"], "ans": "B", "expl": "Linearity is one of the four key assumptions of a simple linear regression. However, even if data sets do not have a linear relationship, a simple\nlinear regression can be used by transforming one or both variables by using, for example, the square, the reciprocal, or the log of the variable.\nThis results in distinct functional forms, allowing the regression to better fit a curvature. These transformed models have linear parameters (ie,\nthe intercept b and the slope b ), although the variables are not linear.\n0 1\nIn this scenario:\nM1 is a log-lin model, with a logarithmic dependent variable (lnY) and a linear independent variable (X), and\nM2 is a log-log model, with both variables in their logarithmic forms.\nThe study show that M1 has the largest coefficient of determination and F-statistic, and the smallest standard error of the estimate. Therefore, the\nlog-lin model displays the best fit for the data (Choice C).\nIt is important to remember that regression statistics can be compared for regressions only when each regression's dependent variable has\nthe same form. For instance, linear and lin-log models can be compared since the dependent variable for each is linear, but a lin-log model\ncannot be directly compared with a log-log model. In this question, M1 and M2 can be compared since both use lnY as the dependent variable.\n(Choice A) Neither regression is in the lin-log functional form, which has a linear dependent variable (Y) and a logarithmic independent variable\n(lnX).\nThings to remember:\nSimple linear regressions may have different functional forms, including logarithmic transformations of one or both variables (ie, lin-log, log-lin, log-\nlog). These transformed models have linear parameters, although the variables are not linear. The statistics of models with different forms of\ndependent variable (eg, Y and lnY) are not comparable.\nDescribe different functional forms of simple linear regressions", "qhtml": null}, {"n": 186, "q": "An economist runs a linear regression and analyzes the regression's residual plot: The most appropriate conclusion is that the pattern of the residual plot indicates the presence of:", "opts": ["outliers.", "nonlinearity.", "heteroskedasticity."], "ans": "B", "expl": "A residual is the difference between the observed value of a dependent variable Y and the value predicted by a regression. In a simple linear\nregression (SLR), residuals are the vertical distance between the actual observations and the regression line, which is the straight line that\nminimizes the sum of the squares of all residuals (ie, the sum of squares error).\nThe residual plot ideally should be scattered randomly; the presence of a pattern often indicates the violation of one or more assumptions\nunderlying the SLR model.\nIn this residual plot (graph on the right), there is a pattern: a concentration of positive residuals in the lower and upper ranges of the independent\nvariable X and of negative residuals in the middle range. This indicates a violation of linearity, which assumes that X and Y have a linear\nrelationship. This violation is called nonlinearity and is evident in the scatterplot of Y against X (graph on the left).\nThings to remember:\nThe presence of a pattern in a residual plot often indicates a violation of the assumptions of a linear regression model. If the residual plot shows a\nconcentration of positive residuals in a range and of negative residuals in other range(s), then the relationship cannot be displayed as a straight\nline and the linearity assumption is violated. This is called nonlinearity.\nExplain the assumptions underlying the simple linear regression model, and describe how residuals and residual plots indicate if these\nassumptions may have been violated", "qhtml": null}, {"n": 187, "q": "A linear regression analysis generates the following ANOVA (analysis of variance) table: ANOVA Table Degrees of Sum of Mean F- Source freedom squares squares statistic Regression 1 9.5231 9.5231 163.4274 Residual 78 4.5452 0.0583 Total 79 14.0683 Based on this data, the standard error of the estimate (s ) is closest to: e ", "opts": ["0.241", "0.323", "0.677"], "ans": "A", "expl": "The standard error of the estimate (s ) measures the accuracy of the regression as reflected by the average distance between each predicted\ne\nŶ and observed Y. It is the square root of the mean square error (MSE) and is presented in the same units as Y. In this scenario:\nSmaller s values mean that a regression has smaller errors, so the regression line is a better fit for the data. This important measure of\ne\ngoodness of fit can be derived from the ANOVA table for a simple linear regression since the table includes the MSE.\n(Choice B) 0.323 results from dividing the sum of squares error (SSE) by the sum of squares total (SST) (1 − R2); it is the proportion of the\nchange in the dependent variable Y not explained by the model.\n(Choice C) 0.677 is the coefficient of determination (R2) that measures the proportion of the change in Y explained by the independent variable\nX. R2 = sum of squares regression (SSR) / SST.\nThings to remember:\nThe standard error of the estimate (s ), derived from the ANOVA table, is a key measure to evaluate how the regression fits the data. It quantifies\ne\nthe accuracy of the regression (ie, the average error) and is measured in the same units as the dependent variable. It is the square root of the\nmean square error (MSE); smaller s values mean that a regression has smaller errors, so the regression line is a better fit for the data.\ne\nDescribe the use of analysis of variance (ANOVA) in regression analysis, interpret ANOVA results, and calculate and interpret the standard error\nof Estimate in a simple linear regression", "qhtml": null}, {"n": 188, "q": "An analyst runs a linear regression on crude oil prices (in USD per barrel) and a company's gross margin (in %), with the following results: The analyst forecasts an average oil price of USD 66 in the following quarter. Considering t-values of ±2.228, the 95% prediction interval for the company's gross margin is closest to:", "opts": ["40.6% to 52.1%.", "42.3% to 50.5%.", "44.2% to 48.6%."], "ans": "A", "expl": "Simple linear regressions are commonly used to predict a dependent variable (Ŷ) based on a forecasted value of the independent variable (X).\nf f\nThe forecast's prediction interval is the expected range of values around Ŷ given a certain level of significance (α). For example, if α = 5%,\nf\nthere is a 95% probability that the actual value of Y will be within the prediction interval.\nThe width of the range is a function of two components: the critical t-value (t ), which is a reliability factor, and the standard error of the forecast,\nc\nwhich is a measure of the regression's accuracy. In this scenario, the prediction interval is calculated as follows:\n6.An analyst runs a simple linear regression (SLR) and plots the resulting residuals:\nThe regression's residuals are presented on the vertical axis of each graph. In the left graph, residuals are plotted against the regression's\nindependent variable, and in the right graph, they are plotted in chronological order. Based only on the graphs, the model most likely violates\nwhich of the following linear regression assumptions?\nA. Linearity\n B. Independence\nC. Homoskedasticity\nExplanation\nA residual is the difference between the observed value of the dependent variable and the value predicted by the regression. In a simple linear\nregression (SLR), residuals are the vertical distance between the actual observations and the regression line, which is the straight line that\nminimizes the sum of the squares of all residuals (ie, the sum of squares error).\nIdeally, the residual plot is randomly scattered. Therefore, the presence of patterns often indicates the violation of one or more assumptions\nunderlying the SLR model. In this scenario, when the residuals are plotted against the independent variable (X), it does not display any visible\npattern.\nWhen the residuals are plotted against time (ie, chronological order), there is a pattern: Neighboring (ie, succeeding and preceding) residuals\nhave similar signs and magnitudes. This indicates a violation of the independence assumption, which assumes that observations (and\nresiduals) are uncorrelated; it is called autocorrelation.\nThings to remember:\nIndependence assumes that observations (and residuals) are uncorrelated. Autocorrelation, the violation of this assumption, is often recognized\nby plotting the residuals against time (ie, chronological order) and identifying that neighboring residuals have similar signs and magnitudes.\nExplain the assumptions underlying the simple linear regression model, and describe how residuals and residual plots indicate if these\nassumptions may have been violated LOS\n7.The following table summarizes the relationship between two exchange rates, USD/GBP and USD/EUR for the last 12 months:\nStatistic Data\nStandard deviation of USD/GBP 1.389\nStandard deviation of USD/EUR 1.208\nCorrelation of USD/GBP and USD/EUR 0.781\nAn analyst runs a linear regression to test if USD/GBP explains changes in USD/EUR. The slope of this regression model is closest to:\nA. 0.405\n\nB. 0.679\nC. 0.898\nExplanation\nThis regression model examines how well USD/GBP explains USD/EUR. Therefore, USD/GBP is the explanatory or independent variable (X),\nwhile USD/EUR is the explained or dependent variable (Y). Since there is only one independent variable, this is a simple linear regression, and\nthe slope coefficient is the ratio of the covariance (Y, X) to the variance of X.\nIn this scenario, the covariance (Y, X) can be obtained using the correlation of Y and X and the standard deviations of X and Y. After obtaining the\ncovariance, the slope coefficient is calculated as follows:\n(Choice A) 0.405 results from incorrectly using the correlation instead of covariance in the slope formula (ie, 0.781 / (1.389)2).\n(Choice C) 0.898 results from incorrectly swapping the variables (ie, using USD/GBP as the dependent variable and USD/EUR as the\nindependent variable [0.781 × 1.389 / 1.208]).\nThings to remember:\nIn a simple linear regression, the independent variable (X) explains the dependent variable (Y). The slope coefficient is the ratio of the covariance\n(Y, X) to the variance of X. It can also be calculated as the product of the correlation (Y, X) and the ratio of the standard deviations of Y and X.\nDescribe a simple linear regression model, how the least squares criterion is used to estimate regression coefficients, and the interpretation of\nthese coefficients", "qhtml": null}, {"n": 189, "q": "An analyst runs a simple linear regression (SLR) and plots the resulting residuals: The regression's residuals are presented on the vertical axis of each graph. In the left graph, residuals are plotted against the regression's independent variable, and in the right graph, they are plotted in chronological order. Based only on the graphs, the model most l n model also predicts the\nvalue of a variable based on the assumed value(s) for the other variable(s).\nIn this scenario:\nModel 1 examines if changes in the stock index are explained by the unemployment rate. In this model, the stock index is the dependent\nvariable (ie, explained variable), which is usually named Y. The goal of the model is to predict trends in the stock index based on the\nexpected unemployment rate.\nModel 2 examines if changes in the stock index explain changes in GDP. In this model, the stock index is the independent variable (ie,\nexplanatory variable), which is usually named X. The goal of the model is to predict trends in GDP based on the expected stock index\n(Choices A and C).\nA linear regression model has only one dependent variable, but it may have several independent variables. In this case, the model is known as a\nsimple linear regression since it has only one independent variable.\nThings to remember:\nA linear regression tests if independent variables explain changes in a dependent variable, quantifying their relationship in a linear equation.\nLinear regressions have only one dependent variable but may have several independent variables. When there is only one independent variable,\nthe model is known as a simple linear regression.\nDescribe a simple linear regression model, how the least squares criterion is used to estimate regression coefficients, and the interpretation of\nthese coefficients", "qhtml": null}, {"n": 192, "q": "A portfolio manager uses a regression model to evaluate how a company's debt-to-equity ratio influences its beta. The analysis of variance (ANOVA) for the regression model is: ANOVA Table Degrees of Sum of Mean F- Source Freedom Squares Squares statistic Regression 1 0.1426 0.1426 ? Residual 8 0.2986 0.0373 Total 9 0.4413 The manager formulates the null hypothesis (H ) that the slope coefficient is zero. If the critical F-value at a 5% significance is 5.32, the manager's 0 most appropriate decision is t
