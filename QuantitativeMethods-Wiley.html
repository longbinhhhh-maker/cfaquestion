stock meeting the first three criteria is closest to:\nA. 0.014\n\nB. 0.025\nC. 0.931\nExplanation\nThe multiplication rule for independent events describes how to calculate the joint probability, P(ABC. . .N), of any number of independent\nevents. The joint probability is equal to the product of the probabilities of each event.\nIn this scenario, the analyst assumes that any stock chosen will have a 45.1% chance to meet Criterion A, a 28.7% chance to meet Criterion B,\nand a 19.3% chance to meet Criterion C. Each criterion is an independent event. Substitute values into the formula to determine the joint\nprobability that all three events occur (ie, that the stock meets the first three criteria):\nTwo events, A and B, are independent if and only if the probability of B is equal to the probability of B given A and vice versa: P(B) = P(B|A) and\nP(A) = P(A|B). This is reasonable since if the events are independent, the probability of B occurring is the same whether A occurs or not and vice\nversa.\n(Choice A) 0.014 is the chance that a stock will meet all four criteria: P(ABCD) = P(A) × P(B) × P(C) × P(D) = 0.01384. The question asks about\nthe joint probability of the first three events only.\n(Choice C) 0.931 is the result of incorrectly applying the addition rule for mutually exclusive events, instead of the multiplication rule, to the first\nthree probabilities.\nThings to remember:\nThe joint probability of any number of independent events is the product of their probabilities. This is true only if the events are independent.\nFormulate an investment problem as a probability tree and explain the use of conditional expectations in investment application", "qhtml": null}, {"n": 108, "q": "An analyst has four independent criteria for selecting stocks and assumes the probabilities of meeting each criterion apply to every stock as follows: Under the analyst's assumptions, the probability of a stock meeting the first three criteria is closest to:", "opts": ["0.014", "0.025", "0.931"], "ans": "B", "expl": "The multiplication rule for independent events describes how to calculate the joint probability, P(ABC. . .N), of any number of independent\nevents. The joint probability is equal to the product of the probabilities of each event.\nIn this scenario, the analyst assumes that any stock chosen will have a 45.1% chance to meet Criterion A, a 28.7% chance to meet Criterion B,\nand a 19.3% chance to meet Criterion C. Each criterion is an independent event. Substitute values into the formula to determine the joint\nprobability that all three events occur (ie, that the stock meets the first three criteria):\nTwo events, A and B, are independent if and only if the probability of B is equal to the probability of B given A and vice versa: P(B) = P(B|A) and\nP(A) = P(A|B). This is reasonable since if the events are independent, the probability of B occurring is the same whether A occurs or not and vice\nversa.\n(Choice A) 0.014 is the chance that a stock will meet all four criteria: P(ABCD) = P(A) × P(B) × P(C) × P(D) = 0.01384. The question asks about\nthe joint probability of the first three events only.\n(Choice C) 0.931 is the result of incorrectly applying the addition rule for mutually exclusive events, instead of the multiplication rule, to the first\nthree probabilities.\nThings to remember:\nThe joint probability of any number of independent events is the product of their probabilities. This is true only if the events are independent.\nFormulate an investment problem as a probability tree and explain the use of conditional expectations in investment application", "qhtml": null}, {"n": 109, "q": "A distressed company may default on existing debt of £10 million depending on whether it declares bankruptcy. The company has a 0.8 probability of going bankrupt. If the company goes bankrupt, then its lender has a 0.6 probability of recovering £3 million and a 0.4 probability of recovering nothing. If the company does not go bankrupt, then its lender has a 0.7 probability of recovering the full loan and a 0.3 probability of recovering £9 million. The lender's expected recovery amount on the loan is closest to:", "opts": ["£1.44 million.", "£3.38 million.", "£5.58 million."], "ans": "B", "expl": "A random variable's expected value is derived from its potential outcomes under different scenarios. In this question, the expected recovery\namount equals the probability-weighted average of the recovery amounts under Scenario 1 (bankruptcy) and Scenario 2 (no bankruptcy). Since\nthere are four different outcome values for the recovery amount, the overall expected recovery amount is calculated as follows:\n(Choice A) This answer, £1.44 million, is the sum of only the probability-weighted recovery amounts under Scenario 1, where the company goes\nbankrupt; this answer neglects to factor in the probability-weighted recovery amounts under Scenario 2.\n(Choice C) This choice, £5.58 million, is the simple average of the four recovery amount values, not the probability-weighted outcomes of\nScenarios 1 and 2.\nThings to remember:\nThe expected value of a random variable equals the sum of the probability-weighted averages of its possible outcomes.\nFormulate an investment problem as a probability tree and explain the use of conditional expectations in investment application", "qhtml": null}, {"n": 110, "q": "Which of the following statements concerning properties of probability is least likely to be accurate?", "opts": ["An event can have an infinite number of outcomes.", "The sum of probabilities for two mutually exclusive events equals 1.", "If P(A | B) is greater than 0, then A and B cannot be mutually exclusive."], "ans": "B", "expl": "Properties of probability\nThe probability of any event's occurrence is between 0 and 1.\nIn any set of mutually exclusive and exhaustive events, the sum of probabilities for all events equals 1.\nEvents are mutually exclusive if only one event can occur at a time. A set of events is exhaustive if it covers all possible outcomes. Only when\nevents are mutually exclusive and exhaustive does the sum of their probabilities equal 1.\nFor example, the possible outcomes for a company's earnings per share (EPS) may have different events:\nEvent A: EPS is less than EUR 0.\nEvent B: EPS is between EUR 0 and EUR 0.05 per share.\nEvents A and B are mutually exclusive since neither can occur simultaneously (ie, EPS cannot be both negative and non-negative). However,\nunless Events A and B cover all possible outcomes (ie, they are exhaustive), the sum of their individual probabilities can be less than 1. Since it is\npossible to describe an Event C, in which EPS could be more than EUR 0.05, Events A and B are not exhaustive and their probabilities do not\nequal 1.\n(Choice A) An event is not limited to one possible outcome. To continue the EPS example above, Event A is that EPS is less than EUR 0, but\nany negative EPS result would mean that the event occurred.\n(Choice C) The formula for conditional probability, P(A | B) = P(AB) / P(B), means that for the conditional probability to be greater than 0, the joint\nprobability that Events A and B both occur [P(AB)] must also be greater than 0. Mutually exclusive events cannot occur simultaneously, so the\njoint probability of mutually exclusive events is 0.\nThings to remember:\nA property of probability is that the sum of all probabilities in a set of mutually exclusive and exhaustive events must equal 1.\nCalculate and interpret an updated probability in an investment setting using Bayes’ formula", "qhtml": null}, {"n": 111, "q": "An analyst considers the impact of a company's earnings-per-share on its CEO's compensation and estimates the following probabilities: Based on the information given, a calculated probability of 0.38 most likely represents the: ", "opts": ["total probability of an increase in compensation.", "joint probability of an increase in compensation and in EPS.", "conditional probability that compensation increased given that EPS does not increase."], "ans": "A", "expl": "This question uses the total probability rule to estimate the probability of a compensation increase. The compensation increase is impacted by\nwhether the company's EPS increases. One scenario is that EPS does not increase, which has a probability of 0.6. Since the probability of EPS\nincreasing is mutually exclusive and conditional, the probability of an EPS increase is (1 − 0.6) = 0.4.\nAfter the independent probabilities of an EPS increase are determined, the next step is to identify and calculate the conditional probabilities of\ncompensation increasing, given that EPS increases and also given that it does not. The sum of those conditional probabilities is the total\nprobability that compensation increases.\nThe likelihood that compensation increases given that EPS increases is 0.8, so the joint probability that both EPS and compensation increase is\n0.8 × 0.4 = 0.32 (Choice B). This is not the total probability of a compensation increase since it does not address the scenario of compensation\nincreasing given that EPS does not increase.\nConditional probabilities can also be mutually exclusive and exhaustive. The probability of no compensation increase given no EPS increase\nis 0.9, so the conditional probability that compensation increases given that EPS does not increase is 1 − 0.9 = 0.1. The joint probability of no EPS\nincrease and a compensation increase is 0.6 × 0.1 = 0.06 (Choice C). The result is the total probability of a compensation increase of 0.32 + 0.06\n= 0.38.\nThings to remember:\nThe total probability rule estimates the unconditional probability of an event where there are multiple scenarios that affect the event's occurrence.\nThe total probability is the sum of each joint probability of the event and the scenario.\nFormulate an investment problem as a probability tree and explain the use of conditional expectations in investment application", "qhtml": null}, {"n": 112, "q": "An analyst wants to estimate the unconditional probability that a company will default on its bonds, which depends on whether its revenue growth is positive. If the analyst can estimate the probability that revenue growth will be positive, then the most appropriate probability rule to estimate the unconditional probability of default is the:", "opts": ["addition rule.", "multiplication rule.", "total probability rule."], "ans": "C", "expl": "Basic probability rules\nProbability that either events A or B occur\nAddition rule P(A or B) = P(A) + P(B) − P(AB) Remember to subtract the joint probability that both events\noccur\nProbability that both events A and B occur\nMultiplication rule P(A and B) = P(A) × P(B) When A and B are independent events, formula simplifies to\nP(A) × P(B)\nUnconditional probability that A occurs whether a different event\nTotal probability P(A) = P(A|B occurs) × P(B occurs) + P(A|B not\nB occurs or does not occur\nrule occur) × P(B not occur)\nMore easily understood with a tree diagram\nThe total probability rule estimates the expected unconditional probability of an event that is conditioned on mutually exclusive and exhaustive\nevents. Mutually exclusive events cannot occur at the same time. Events are exhaustive when they cover all possible outcomes. The sum of\nprobabilities for mutually exclusive and exhaustive events is 1, so the total probability rule covers all possible scenarios.\nThe tree diagram below demonstrates the total probability that the company in this scenario will default given the probability that its revenue will or\nwill not grow. Revenue growth is a mutually exclusive event (ie, revenue cannot simultaneously grow and not grow). It is also exhaustive since\nthe probabilities that revenue will grow, stay flat, or decline sum to 1. The analyst can estimate the probability of positive growth, so the probability\nof flat or negative growth is 1 − P(Positive growth).\nThe probability of default given positive revenue growth is a conditional probability, as is the probability of default given flat or negative growth.\nThe total probability rule estimates the unconditional probability of default by summing the probabilities of all possible conditional probabilities.\n(Choice A) The addition rule does not require that the events be mutually exclusive or exhaustive.\n(Choice B) The multiplication rule calculates the joint probability that two events will both occur, but those events cannot be mutually exclusive.\nMutually exclusive events cannot occur simultaneously, so their joint probability equals 0.\nThings to remember:\nThe total probability rule is used for events that are conditioned on scenarios that themselves are both mutually exclusive and exhaustive. This\nrule calculates the probability of an event under all possible scenarios.\nFormulate an investment problem as a probability tree and explain the use of conditional expectations in investment application", "qhtml": null}, {"n": 113, "q": "A trader owns a share of stock and estimates that there is a: 0.6 probability of the stock closing at a higher price today, 0.9 probability that the trader will sell the stock given that the stock closes higher, and 0.2 probability that the trader will sell the stock given that the stock does not close higher. The expected probability that the trader will sell the stock is closest to:", "opts": ["0.54", "0.60", "0.62"], "ans": "C", "expl": "Unconditional probability is the likelihood that an event will occur, regardless of another event's occurrence. The unconditional probability of\nselling the stock can be calculated from the conditional probabilities of selling the stock.\nThe conditional probability of selling the stock, given that its price closes higher, is 0.9. Since the probability of the stock closing higher is\n0.6, the probability of both the stock closing higher and the trader selling the stock is 0.6 × 0.9, or 0.54.\nThe conditional probability of selling the stock, given that the price does not close higher, is 0.2. Since the probability of the stock not\nclosing higher is 0.4 or (1 − 0.6 probability of the stock closing higher), the probability that the stock won't close higher and the trader will sell\nthe stock equals 0.4 × 0.2, or 0.08.\nSince the unconditional probability of selling the stock is the likelihood of the trader selling the stock regardless of whether the stock closes higher,\nthe answer is the sum of the probabilities of the selling the stock under both scenarios above, or 0.62 (ie, 0.54 + 0.08).\n(Choice A) 0.54 is the joint probability of selling the stock and the stock closing higher.\n(Choice B) 0.60 is the probability of the stock closing higher.\nThings to remember:\nThe unconditional probability of selling the stock is the weighted average of its conditional probabilities; the weights are the probabilities of the\npreceding scenarios.\nFormulate an investment problem as a probability tree and explain the use of conditional expectations in investment application", "qhtml": null}, {"n": 114, "q": "For two events, A and B, which of the following best describes a property of conditional probability?", "opts": ["A and B are mutually exclusive events.", "Conditional probability can be higher than unconditional probability.", "The probability of A given B cannot equal the probability of B given A."], "ans": "B", "expl": "Conditional probability is the probability that one event will occur given that another event occurs. For example, an analyst may believe there\nis a 0.30 probability that a company will report earnings per share (EPS) of at least USD 0.20 (Event B). If Event B occurs, the analyst estimates a\n0.60 probability that the company will increase its dividend (Event A). This describes a conditional probability since an of EPS of more than USD\n0.20 impacts the probability of the dividend increase.\nConditional probability can be higher, lower, or the same as unconditional probability. For example, the analyst may believe there is a 0.15\nunconditional probability that the company will raise its dividend regardless of EPS. The conditional probability of a dividend increase given a\nthreshold level of EPS (0.60) is higher than the unconditional probability of a dividend increase (0.15).\n(Choice A) Mutually exclusive events are events that cannot occur at the same time: P(A and B) = 0. Since this is the numerator of the equation\nfor conditional probability, conditional probability for mutually exclusive events is always 0.\n(Choice C) The numerator for the conditional probability of B given A is P(B and A). However, P(B and A) is the same as P(A and B). This means\nthat the conditional probability of A given B can equal the conditional probability of B given A if the probability of Events A and B (the denominator)\nis the same, that is if P(A) = P(B).\nThings to remember:\nConditional probability is the probability that one event will occur given that another event occurs. The conditional probability of an event can be\nhigher, lower, or the same as the unconditional probability of the same event. The conditional probability for mutually exclusive events will always\nbe 0.\nFormulate an investment problem as a probability tree and explain the use of conditional expectations in investment application", "qhtml": null}, {"n": 115, "q": "A fund has 200 bonds. The fund's previous manager added some of the bonds to the funds; the remainder were added by the current manager. Forty of the 200 bonds are investment grade; the remainder are high-yield bonds. The current manager added 35% of the investment- grade bonds and 80% of the high-yield bonds to the fund. The probability that a randomly selected security is either an investment-grade bond or any bond that was not added by the current manager is closest to:", "opts": ["20%", "36%", "49%"], "ans": "B", "expl": "This question involves the use of the addition rule for probabilities. A is the probability of randomly selecting an investment-grade bond, which\nis 40/200 = 0.20, or 20%.\nB is the probability of selecting any bond that was not added to the portfolio by the current manager. The current manager did not add 65% of the\ninvestment-grade bonds nor 20% of the high-yield bonds:\nAdded by current manager Not added by current manager\nInvestment grade 35% × 40 = 14 (1 − 35%) × 40 = 26\nHigh yield 80% × (200 − 40) = 128 (1 − 80%) × (200 − 40) = 32\nTotal 142/200 = 71% 58/200 = 29%\nThe sum of the probabilities for A and B is 0.20 + 0.29 = 0.49, or 49%, which would be the correct answer if A and B were mutually exclusive\nevents (Choice C). However, they are not mutually exclusive, since it is possible that the chosen bond is an investment-grade bond that was not\nadded by the current manager.\nThe joint probability of both events, P(AB), must be subtracted from the sum of the individual event probabilities to prevent double counting. The\njoint probability of selecting an investment-grade bond that was not added by the manager is 0.20 × 0.65 = 0.13, or 13%. After subtracting this\njoint probability, the total probability of A or B equals 0.20 + 0.29 − 0.13 = 0.36, or 36%.\n(Choice A) The probability of randomly selecting an investment-grade bond is 20%, but that does not account for the probability of selecting a\nbond that the current manager did not add to the fund.\nThings to remember:\nThe addition rule for probabilities is that the probability of A or B [P(A or B)] equals the probability of A plus the probability of B, minus the joint\nprobability of A and B.\nFormulate an investment problem as a probability tree and explain the use of conditional expectations in investment application", "qhtml": null}, {"n": 116, "q": "An analyst who is evaluating the probability that a company will fire its CEO if EPS decreases this year gathers the following relevant estimates: Probability that EPS decreases 0.35 Probability that company fires CEO if EPS decreases 0.85 Probability that company does not fire CEO if EPS does not decrease 0.75 The analyst later learns that the company did not fire the CEO after reporting EPS. The updated probability that the company's EPS decreased is closest to:", "opts": ["0.05", "0.10", "0.15"], "ans": "B", "expl": "Probability estimates are often revised based on new information. In this scenario, the conditional probability that the CEO is not fired depends on\nwhether the company's earnings per share (EPS) have decreased. Two relevant conditional probabilities are as follows:\nThe CEO is not fired given that EPS did not decrease [P(CEO not fired | no EPS decrease)]\nThe CEO is not fired given that EPS decreased [P(CEO not fired | EPS decrease)]\nThe diagram above shows that the probabilities that the CEO is not fired are:\n0.0525 if EPS decreased and\n0.4875 if EPS did not decrease.\nThe total probability that the CEO is not fired, regardless of what happens to EPS, is 0.0525 + 0.4875 = 0.54. Bayes' formula can be used to\nreverse the conditional probability and answer the question, \"What is the probability that EPS decreased given that the CEO was not fired\"?\nHowever, it is often easier to invert the tree diagram using previously calculated probabilities than to memorize and apply Bayes' formula:\nBefore the analyst learned the outcome for the CEO, the estimated probability of an EPS decrease was 0.35. Given the updated information (ie,\nCEO was not fired) and using Bayes' formula, the revised probability that EPS decreased is reduced to approximately 0.10 (ie, 0.0972).\n(Choice A) 0.05 (ie, 0.0525) represents the joint probability that the CEO is not fired and that there is a decrease in EPS.\n(Choice C) 0.15 is the conditional probability that the CEO is not fired given that EPS decreased.\nThings to remember:\nBayes' formula is a way to update probabilities of related events based on new information.\nCalculate and interpret an updated probability in an investment setting using Bayes’ formula LOS\n34.A mutual fund contains 250 constituent companies.\n12% of the companies are categorized as healthcare stocks.\n16% of the companies are categorized as small-cap stocks.\n4% of the companies are categorized as both healthcare and small-cap stocks.\nIf the categories are not mutually exclusive, then the probability that any constituent company is a healthcare or small-cap stock is closest to:\n A. 24.0%\nB. 26.1%\nC. 28.0%\nExplanation\nFor events that are not mutually exclusive, the probability that at least one event will occur equals the sum of the individual events'\nprobabilities minus their joint probability (ie, P(A and B)). The joint probability that the stock is both a healthcare stock and a small-cap stock is\ncaptured in the overlapping area in the diagram below. Since this overlapping area shares outcomes with Event A and Event B, P(A and B)\nshould be subtracted from the sum of their individual probabilities to avoid double counting.\n(Choice B) 26.1% results from subtracting the product of P(A) and P(B) from the sum of P(A) and P(B). The joint probability of two events P(A\nand B) cannot be calculated from multiplying the probabilities of two events in a non–mutually exclusive scenario.\n(Choice C) 28.0% results from failing to subtract P(A and B) from the sum of P(A) and P(B).\nThings to remember:\nFor events that are not mutually exclusive, the probability that at least one event will occur equals the sum of the individual events' probabilities\nminus their joint probability.\nFormulate an investment problem as a probability tree and explain the use of conditional expectations in investment application", "qhtml": null}, {"n": 117, "q": "A mutual fund contains 250 constituent companies. 12% of the companies are categorized as healthcare stocks. 16% of the companies are categorized as small-cap stocks. 4% of the companies are categorized as both healthcare and small-cap stocks. If the categories are not mutually exclusive, then the probability that any constituent company is a healthcare or small-cap stock is closest to:", "opts": ["24.0%", "26.1%", "28.0%"], "ans": "A", "expl": "For events that are not mutually exclusive, the probability that at least one event will occur equals the sum of the individual events'\nprobabilities minus their joint probability (ie, P(A and B)). The joint probability that the stock is both a healthcare stock and a small-cap stock is\ncaptured in the overlapping area in the diagram below. Since this overlapping area shares outcomes with Event A and Event B, P(A and B)\nshould be subtracted from the sum of their individual probabilities to avoid double counting.\n(Choice B) 26.1% results from subtracting the product of P(A) and P(B) from the sum of P(A) and P(B). The joint probability of two events P(A\nand B) cannot be calculated from multiplying the probabilities of two events in a non–mutually exclusive scenario.\n(Choice C) 28.0% results from failing to subtract P(A and B) from the sum of P(A) and P(B).\nThings to remember:\nFor events that are not mutually exclusive, the probability that at least one event will occur equals the sum of the individual events' probabilities\nminus their joint probability.\nFormulate an investment problem as a probability tree and explain the use of conditional expectations in investment application", "qhtml": null}, {"n": 118, "q": "An analyst compiles the following covariance matrix for two assets: A portfolio is created from these two assets, with 31% invested in Asset B. The portfolio's variance is closest to:", "opts": ["4.08", "14.99", "25.31"], "ans": "B", "expl": "Portfolio variance, an important measure of portfolio risk, depends on the assets' return variances, their covariances, and the weight of each\nasset in the portfolio. To minimize portfolio risk, managers seek to minimize portfolio variance by combining assets that have low covariances with\neach other. The covariance of an asset with itself is its variance: Cov(X,X) = σ2(X).\nIn this scenario, the weight of Asset B is 31%, so the weight of Asset A must be (1 − 0.31) = 69%. These values are substituted into the formula for\nportfolio variance as follows:\n(Choice A) 4.08 is the result of incorrectly using the asset return standard deviation in place of the asset return variance in the formula for two-\nasset portfolio variance.\n(Choice C) 25.31 is the result of calculating the weighted average of the return variances. The variance of a portfolio's return is not equal to the\nweighted average of the return variances of the assets in a portfolio. Assuming the weighted average of the asset variances is equal to the\nportfolio variance ignores that effect of the assets' covariance.\nThings to remember:\nPortfolio variance depends on the assets' return variances, their covariances, and the weight of each asset in the portfolio. The covariance of an\nasset with itself is its variance.\nCalculate expected values, variances, and standard deviations and demonstrate their application to investment problems", "qhtml": null}, {"n": 119, "q": "An analyst compiles information on a company's estimated future earnings per share (EPS): If the company's EPS amount is treated as a random variable, its standard deviation is closest to: ", "opts": ["EUR 0.0354", "EUR 0.0433", "EUR 0.0612"], "ans": "A", "expl": "The standard deviation of a random variable is a measure of the variable's dispersion from its expected value (ie, how far values of the variable lie\nfrom its mean). Both standard deviation and variance are used as a measure of risk for assets and portfolios.\nIn this scenario, calculate the standard deviation of the company's earnings per share (EPS) by finding the expected value of the EPS, then\ncalculating the variance:\nThe square root of the variance is the standard deviation:\n(Choice B) EUR 0.0433 is the result of incorrectly finding the simple average of the EPS values instead of the expected value based on\nprobability as the first step in calculating the variance and the standard deviation.\n(Choice C) EUR 0.0612 is the result of incorrectly calculating the variance as a simple average instead of the expected value of the squared\ndifferences between the individual estimates and the expected value of the EPS.\nThings to remember:\nThe standard deviation of a random variable is a measure of the dispersion of the values of the variable from its expected value, expressed in the\nsame units as the random variable. The standard deviation is the square root of the variance.\nCalculate expected values, variances, and standard deviations and demonstrate their application to investment problems", "qhtml": null}, {"n": 120, "q": "An investor estimates a covariance matrix for the relative price movements of Asset A and Asset B that is shown below: Asset A Asset B Asset A 900 30 Asset B 30 400 If the investor creates a portfolio with 35% invested in Asset A and 65% invested in Asset B, the portfolio's standard deviation is closest to:", "opts": ["16.7%", "17.1%", "24.3%"], "ans": "B", "expl": "A portfolio's standard deviation is the positive square root of its variance. Standard deviation measures the dispersion of the portfolio's returns\naround its mean return, which indicates the portfolio's risk relative to its return. A greater standard deviation represents greater risk.\nCovariance indicates how the return of one asset moves relative to another asset. These co-movements affect the portfolio's variance. The\ncovariance of an asset with itself is its variance: σ2(X) = Cov(X, X). In this question, reading the matrix provided shows that:\n900 is Asset A's variance,\n400 is Asset B's variance, and\n30 is the covariance between the assets.\nSubstituting the assets' weights, variances, and covariance into the equation for standard deviation:\nThe benefit of the assets' low covariance is risk reduction: A low covariance (relative to each asset's variance) allows a portfolio to be created that\nhas a lower standard deviation, and thus a lower risk, than either of the individual assets. The assets' standard deviations are 30% (Asset A) and\n20% (Asset B) whereas the risk of a portfolio that combines both assets (given this weighting) is approximately 17.1%.\n(Choice A) 16.7% results from summing the simple weighted average of each of the asset's variances and then taking the square root of the\nresult. This method fails to account for the effects of the assets' covariance.\n(Choice C) 24.3% results from not squaring the weights of each asset in the first two elements of the equation.\nThings to remember:\nCovariance of returns measures how the returns of two assets move relative to each other. For assets with a low covariance relative to each\nasset's variance, it is possible to combine the assets into a portfolio that has lower risk (as measured by standard deviation) than the risk of either\nindividual asset.\nCalculate expected values, variances, and standard deviations and demonstrate their application to investment problems", "qhtml": null}, {"n": 121, "q": "An analyst estimates the probability of future returns on an asset as follows: If the asset's return is a random variable, its variance is closest to: ", "opts": ["0.0009", "0.0012", "0.0013"], "ans": "A", "expl": "The variance of a random variable is calculated as the probability-weighted average of the squared differences between each possible\noutcome and the variable's expected value. The expected value of a random variable, a required input to calculate variance, is the probability-\nweighted average of the variable's possible outcomes.\nIn this scenario, the expected value of the portfolio return is calculated as follows:\nUsing the expected value, calculate the variance as follows:\nNote that the CFA curriculum uses both σ2(X) and Var(X) as equally valid symbols for variance.\n(Choice B) 0.0012 is the result of failing to weight the calculation for E(X) by the probability distribution.\n(Choice C) 0.0013 is the result of failing to weight the calculation for variance by the probability distribution. When calculating the variance, the\nsum of the square differences is weighted by the probability of each outcome. This step corresponds to the last column in the table above.\nThings to remember:\nThe variance of a random variable is the probability-weighted average of the squared differences between each possible outcome and the\nvariable's expected value. The expected value is the probability-weighted average of the variable's possible outcomes.\nCalculate expected values, variances, and standard deviations and demonstrate their application to investment problems", "qhtml": null}, {"n": 122, "q": "For two events A and B, one calculates the probability of (A or B) by adding the probability of A to the probability of B, then:", "opts": ["subtracting the conditional probability of A given B [ie, P(A|B)].", "subtracting the probability of A and B [ie, P(AB)] to avoid counting it twice.", "adding the probability of A and B [ie, P(AB)] in case the events are not mutually exclusive."], "ans": "B", "expl": "For any two events A and B, the addition rule for probabilities, P(A or B) = P(A) + P(B) − P(AB), describes how to calculate the probability\nthat Aor B occurs. The formula can be simplified if the events are mutually exclusive, which is true only if their joint probability is equal to zero:\nP(AB) = 0. If events are mutually exclusive, there is zero chance of both occurring. Thus, if the events are mutually exclusive, the addition rule\nsimplifies to P(A or B) = P(A) + P(B).\nConsider the probabilities of A and B in the diagram. P(A) and P(B) are represented by their areas. If events are not mutually exclusive, adding\nP(A) and P(B) will result in double counting P(AB), which is the overlap of the two areas. This would result in overestimating the probability of A or\nB occurring. Thus, after adding P(A) and P(B), P(AB) should be subtracted to avoid double counting this probability (Choices A and C).\nThings to remember:\nAddition rule for probabilities: The probability of A or B is equal to the probability of A plus the probability of B minus the probability of A and B. If\nevents are mutually exclusive, this simplifies to: The probability of A or B is equal to the probability of A plus the probability of B.\nFormulate an investment problem as a probability tree and explain the use of conditional expectations in investment application", "qhtml": null}, {"n": 123, "q": "There is an 80% chance that a hedge fund's return will exceed its benchmark this year. There is a 90% chance that the fund manager will earn higher total compensation than last year if the fund's return exceeds the benchmark. Suppose that the overall probability that the manager will earn higher total compensation this year is 73%. Which of the following statements is most accurate?", "opts": ["The conditional probability of the fund return exceeding the benchmark is 0.80.", "The unconditional probability of earning higher compensation this year is 0.73.", "The conditional probability of earning higher total compensation this year given that returns exceed the benchmark is 0.72."], "ans": "B", "expl": "The conditional probability of an event expresses the likelihood that the event will occur given that another event occurs. In this case, the\nconditional probability of the manager earning higher compensation given that the fund return exceeds its benchmark, denoted P(higher comp |\nexceeds benchmark), is 0.9.\nThe unconditional probability (expected probability) of an event expresses the likelihood that an event will occur, regardless of whether\nanother event occurs. In this case, the unconditional probability of the manager earning higher compensation is 0.73, regardless of the fund's\nreturn.\n(Choice A) The unconditional probability of the fund exceeding its benchmark is 0.8. In this question, the event, defined as the fund return\nexceeding the benchmark, is not conditioned on another event.\n(Choice C) 0.72 is the joint probability of exceeding the benchmark and receiving higher compensation. The joint probability of two events equals\nthe product of the unconditional probability of one event [P(exceeds benchmark)] and the conditional probability of another event [P(higher comp |\nexceeds benchmark)].\nThings to remember:\nThe conditional probability of an event expresses the likelihood that the event will occur given that another event occurs. The unconditional\nprobability (expected probability) of an event expresses the likelihood that an event will occur, regardless of whether another event occurs.\nFormulate an investment problem as a probability tree and explain the use of conditional expectations in investment application", "qhtml": null}, {"n": 124, "q": "An analyst determines that two events are independent but not mutually exclusive: a rise in stock prices (S) and a rise in the price of West Texas intermediate crude oil (T). If P(S|T) = 0.54, P(S or T) = 0.655, and P(T) = 0.25, then the probability of events S and T both occurring is closest to:", "opts": ["0", "0.063", "0.135"], "ans": "C", "expl": "If P(A|B) = P(A) or P(B|A) = P(B), then\nevents A and B are independent.\nIf two events, A and B, are independent, then the occurrence of each event has no effect on the probability of the other event. Therefore,\nthe probability of A given that B occurs is the same as the probability of A regardless of B, and vice versa.\nIn this scenario, since events S and T are independent, observe that P(S|T) = P(S) = 0.54. Then, use the multiplication rule for probabilities to\ncalculate the probability that both S and T occur:\nP(S and T) = P(S) × P(T)\n= 0.54 × 0.25\n= 0.1350\n(Choice A) P(S and T) is equal to zero if S and T are mutually exclusive events, since there is no chance of both events happening. However,\nsince S and T are not mutually exclusive, P(S and T) ≠ 0.\n(Choice B) 0.063 is the result of misunderstanding the definition of independent events to be P(T|S) = P(S), and then multiplying the incorrect\nvalue for P(S) by P(T) to obtain P(S and T). An easy way to remember the correct formula is that the first event in the conditional probability is\nrepeated on the other side of the equation: P(S|T) = P(S) and P(T|S) = P(T).\nThings to remember:\nIf two events, A and B, are independent, the occurrence of each event has no effect on the probability of the other event occurring. Therefore, the\nprobability of A given that B occurs is the same as the probability of A regardless of B, and vice versa.\nFormulate an investment problem as a probability tree and explain the use of conditional expectations in investment application", "qhtml": null}, {"n": 125, "q": "An analyst compiles the following data about an equity-indexed annuity that pays one of five possible returns to investors each year: The expected value of the asset's return is closest to: ", "opts": ["2.89%", "3.00%", "3.10%"], "ans": "A", "expl": "The expected value of a random variable is the probability-weighted average of the variable's possible outcomes. The term \"expected value\"\nis used with a random variable, whose value is not yet determined. In calculating the expected value, each outcome is weighted by the likelihood\nof its occurrence.\nIn this scenario, multiply each return by its probability, and then sum the resulting products to calculate the expected value:\nThe historical occurrences of the last 10 years are not used in the calculation of the expected value.\n(Choice B) 3.00% is the simple arithmetic average of the five returns, not accounting for their number of occurrences.\n(Choice C) 3.10% is the average of the values of the samples observed, in this case: [(1 + 1 + 2 + 3 + 3 + 4 + 4 + 4 + 4 + 5) / 10] = 3.10. The\nexpected value should not be confused with the sample mean, which is used with historical data.\nThings to remember:\nThe expected value of a random variable is the probability-weighted average of the variable's possible outcomes. The expected value is used with\nrandom variables, including future estimates, while the sample mean is used for historical observations, since their value has already been\ndetermined.\nCalculate expected values, variances, and standard deviations and demonstrate their application to investment problems", "qhtml": null}, {"n": 126, "q": "An analyst identifies two events and estimates probabilities as follows: Probability of X 0.5100 Probability of Y 0.3600 Probability of X given Y 0.7222 Events X and Y are most likely:", "opts": ["dependent.", "mutually exclusive.", "perfectly correlated."], "ans": "A", "expl": "If\nP(A|B) = P(A) or P(B|A) = P(B)\nthen events A and B are independent.\nIf, for two events X and Y, the occurrence of each event has no effect on the probability of the other event, then the events are\nindependent. Therefore, the probability of X given that Y occurs is the same as the probability of X regardless of Y, and vice versa.\nIn this scenario, the conditional probability of X given Y, or P(X|Y), is provided: 0.7222. Since P(X) = 0.51 ≠ P(X|Y) = 0.722, events X and Y are\nnot independent. Therefore, the events are dependent.\n(Choice B) Two events X and Y are mutually exclusive if and only if P(X and Y) = 0. Whether the events are independent or not, P(X and Y) =\nP(X|Y) × P(Y) = 0.7222 × 0.36 ≈ 0.26 ≠ 0. Therefore, since P(X and Y) ≠ 0, X and Y are not mutually exclusive.\n(Choice C) In the context of two random variables with binary outcomes, perfect correlation would mean that whenever one occurs, the other\noccurs, and vice versa. This would mean that P(X) = P(Y) = P(X and Y), and that P(X|Y) = 1, which is not the case in this scenario.\nThings to remember:\nIf two events, X and Y, are independent, then each event has no effect (positive or negative) on the probability of the other event. Therefore, the\nprobability of X given that Y occurs is the same as the probability of X regardless of Y, and vice versa.\nFormulate an investment problem as a probability tree and explain the use of conditional expectations in investment application", "qhtml": null}, {"n": 127, "q": "A portfolio comprises two stocks, A and B, with the following characteristics: All values expressed as % A B Portfolio weight (w) 40 60 Return 3 6 Standard deviation (σ) 5 10 If the portfolio standard deviation equals 5.40%, the correlation between Stocks A and B is closest to: ", "opts": ["−0.4517", "−0.0023", "0.1733"], "ans": "A", "expl": "Portfolio variance and standard deviation can be used to measure the dispersion of portfolio returns. A high overall variance represents a high\ndegree of dispersion and therefore high overall risk.\nA key benefit of holding a diversified portfolio is that the overall variance of a portfolio can be lower than the simple weighted average of the\nvariance of its component assets. The magnitude of this effect depends on the correlation between the assets held in the portfolio.\nAs shown in the equation for the variance of a two-stock portfolio, the portfolio weights, stock variances, and correlation between the stocks are\nused to calculate the variance. The smaller the correlation's value, the smaller the portfolio variance.\nIn this scenario, the portfolio standard deviation is given. The variance must first be derived, then the equation above can be used to solve for the\ncorrelation:\nThe correlation is closest to −0.4517.\n(Choice B) −0.0023 is the covariance between Stocks A and B, which is related to correlation and equals the product of the correlation and each\nof the standard deviations.\n(Choice C) 0.1733 is the result of incorrectly applying Stock A weights to Stock B's standard deviation, and vice versa.\nThings to remember:\nIn a two-stock portfolio, all else equal, a smaller correlation value will result in a smaller variance. The portfolio's variance is a function of the\nweight and standard deviation of each asset and the correlation between assets.\nCalculate expected values, variances, and standard deviations and demonstrate their application to investment problems", "qhtml": null}, {"n": 128, "q": "An analyst estimates the probability that: a carbon tax will be enacted is 0.40. oil prices will fall given that a carbon tax is enacted is 0.75. either a carbon tax will be enacted or oil prices will fall is 0.80. The probability that oil prices will fall is closest to:", "opts": ["0.10", "0.40", "0.70"], "ans": "C", "expl": "The addition rule for probabilities is used to calculate the probability that at least one of two events, A or B, occurs. When the events are\nindependent, this is the sum of P(A) + P(B). However, when the events are not independent, there is a probability that both events could occur (ie,\na joint probability). The joint probability P(AB) must be subtracted from the sum of the individual probabilities.\nSince oil prices falling is related to the imposition of the tax, there is a probability that both events could occur. The probability that oil prices fall\ngiven the imposition of the tax is 0.75. Using the joint probability rule, the probability of both a fall in oil prices AND the imposition of the tax is 0.75\n× 0.40 = 0.30.\nIn this question, the P(oil prices fall OR carbon tax enacted) is given as 0.80. The calculation using the addition rule is shown below (the formula\nis rearranged in the second line to isolate the unknown variable):\n(Choice A) 0.10 results from incorrectly specifying the rearranged formula by subtracting the joint probability instead of adding it.\n(Choice B) 0.40 results by not subtracting the joint probability of both events.\nThings to remember:\nThe addition rule for probabilities is used to calculate the probability that at least one of two events will occur. When the events are not\nindependent, the joint probability of both events must be subtracted from the sum of the individual probabilities of either event to avoid double-\ncounting.\nFormulate an investment problem as a probability tree and explain the use of conditional expectations in investment application", "qhtml": null}, {"n": 129, "q": "A company generates substantial income from a major foreign subsidiary. The company's net profitability is impacted by changes to the foreign exchange rate. There is a 0.3 probability that the foreign currency will depreciate relative to the company's domestic currency. 0.2 probability of the company recording a net loss this year given that the foreign currency depreciates. 0.1 probability of the company recording a net loss this year given that the foreign currency does not depreciate. At year-end, the company did not record a net loss. The probability that the foreign currency did not depreciate is closest to:", "opts": ["0.70", "0.72", "0.87"], "ans": "B", "expl": "The probability of an event is often impacted by the occurrence of a related preceding event. In this question, the probability of the company\nrecording a net loss is related to whether the foreign currency depreciates.\nBayes' formula calculates a type of \"inverse\" probability that revises the probability of a preceding event given that the subsequent event\nhas occurred. Bayes' formula uses the occurrence of a subsequent event to infer the probability of a preceding event.\nNew information confirms that the company did not experience a net loss at year-end. Work backward to deduce the probability of this being\nattributed to the foreign currency not depreciating:\nOriginally, there is a 0.87 (or 0.24 + 0.63) probability of the company not recording a net loss.\nSince the company did not have a net loss, the updated (posterior) probability that the foreign currency depreciated is 0.72 [or 0.63 / (0.24 +\n0.63)]. This is revised from its original (prior) probability of 0.7.\nAlternatively, one can use the Bayes' formula to answer this question; however, the formula is complex and requires detailed memorization. For\nthe exam, the decision tree approach detailed here is highly recommended.\n(Choice A) 0.7 is the original (prior) probability of the foreign currency not depreciating.\n(Choice C) 0.87 is the original expected probability of the company not experiencing a net loss.\nThings to remember:\nBayes' formula calculates a type of \"inverse\" probability that revises the probability of a preceding event given that the subsequent event has\noccurred.\nCalculate and interpret an updated probability in an investment setting using Bayes’ formula", "qhtml": null}, {"n": 130, "q": "An analyst has developed a screening test to determine whether a company's earnings will decrease. If the company does not pass the test, it is likely that its earnings will decrease in the next quarter. The table below shows relevant information: Event Probability Probability of an earnings decrease in the next quarter 0.47 Probability of passing the test 0.62 Probability of an earnings decrease in the next quarter 0.90 given it did not pass the test Based on this information, the probability that the company's earnings will decrease in the next quarter given that the company passes the test is closest to:", "opts": ["0.13", "0.21", "0.34"], "ans": "B", "expl": "This question asks the candidate to calculate the probability that a company's earnings will decrease given that it passes a screening test\n[P(Earnings decrease | Passes test)]. This is an example of a conditional probability. The question does not provide the information needed to\ndirectly solve for the answer, but the solution can be derived using the total probability rule.\nThe total probability of an event is the sum of the joint probabilities of its mutually exclusive and exhaustive scenarios. In this question, the\ntotal probability of an earnings decrease is the sum of:\nP(Passes test AND Earnings decrease) and\nP(Does not pass the test AND Earnings decrease).\nEach joint probability is the product of two probabilities. The first term is the unconditional probability of the company passing (or does not\npass) the test, and the second is a conditional probability (ie, its earnings decrease given that it passes (or not passes) the test). The joint\nprobability is P(A and B) = P(A) × P(B | A). The information needed to calculate the probability that the company will not pass the test AND have\nan earnings decrease [P(Does not pass test AND Earnings decrease)] is given: (1 − 0.62) × 0.90 ≈ 0.34 (Choice C).\nThe information needed to calculate the probability that the company will pass the test AND have an earnings decrease is not given; however, it\ncan be deduced since the total probability of an earnings decrease is given as 0.47. These two joint probabilities of an earnings decrease are\nmutually exclusive and exhaustive and sum to the total probability (0.47); therefore, the unknown joint probability is 0.47 − 0.342 = 0.128 (Choice\nA).\nOnce the joint probability P(Passes test AND Earnings decrease) is known, and since the unconditional probability of passing the test is given\n[P(Passes test) = 0.62], the conditional probability can be calculated by rearranging the formula for joint probability: P(B | A) = P(A and B) / P(A), or\nP(Passes test AND Earnings decrease) / P(Passes test) = 0.128 / 0.62 ≈ 0.21\nThings to remember:\nThe total probability of an event is the sum of the probabilities of its mutually exclusive and exhaustive scenarios. Each scenario can consist of a\njoint probability of two events, where one probability is unconditional and the other is conditioned on whether the first event occurs.\nFormulate an investment problem as a probability tree and explain the use of conditional expectations in investment application", "qhtml": null}, {"n": 131, "q": "An analyst estimates the following joint probability function of returns for two assets, X and Y, under three scenarios: Scenario Return on X (%) Return on Y (%) Probability 1 12 7 0.28 2 9 17 0.51 3 7 2 0.21 Based only on this information, the covariance of returns of the two assets is closest to:", "opts": ["−1.63", "0.39", "6.53"], "ans": "B", "expl": "The covariance of two random variables can be calculated based on their joint probability function.\nFirst calculate the expected return on each asset:\nER = 12(0.28) + 9(0.51) + 7(0.21) = 9.42\nX\nER = 7(0.28) + 17(0.51) + 2(0.21= 11.05\nY\nSubstitute into the formula for covariance:\nCov(R , R ) = (0.28)(12 − 9.42)(7 − 11.05)\nX Y\n+ (0.51)(9 − 9.42)(17 − 11.05)\n+ (0.21)(7 − 9.42)(2 − 11.05)\nCov(R , R ) ≈ 0.39\nX Y\nThings to remember:\nA joint probability function of two random variables X and Y gives the probabilities of the joint occurrence of specific values of each variable. The\ncovariance of two random variables can be calculated based on their joint probability function. The covariance of two variables is the expected\nvalue of the product of the pair-wise matched deviations of each variable from its mean.\nCalculate and interpret the covariance and correlation of portfolio returns using a joint probability function for returns", "qhtml": null}, {"n": 132, "q": "An analyst estimates a joint probability function of two assets' returns during good, average, and poor business conditions: The covariance of returns is closest to: ", "opts": ["9.8", "10.70", "20.23"], "ans": "A", "expl": "A joint probability function describes the probability of the joint occurrence of specific values for two random variables. The covariance of\ntwo random variables in a joint probability function is the probability-weighted product of their differences from their individual expected values.\nIn this scenario, the joint probability function is used to specify returns of two assets in different business conditions and the probability of each\ncondition occurring. The probability of good business conditions is 0.15, the probability that Asset X returns 21% and Asset Y returns 17%:\nP(21,17) = 0.15. Similarly, the joint probability function indicates the probability and returns in average and poor business conditions.\nUse the probabilities on the diagonal to calculate the expected values of each return:\nSubstitute values into the covariance formula as follows:\nCalculate and interpret the covariance and correlation of portfolio returns using a joint probability function for returns\n3.All else equal, if a portfolio consists of two stocks, the portfolio will have the least risk if the correlation between the two stocks is:\n A. less than zero.\nB. equal to zero.\nC. greater than zero.\nExplanation\nCorrelation (ρ) measures the extent to which two variables (eg, asset returns) move together. Correlation can be used to calculate portfolio\nvariance, which is a measure of portfolio risk.\nVariance measures the magnitude of the dispersion of portfolio returns whereas\ncorrelation reflects both the direction and magnitude of the movement of asset returns relative to each other.\nAll else equal, for a two-asset portfolio, a lower correlation between the two stocks results in a lower portfolio variance. The lower correlation\nimplies that the stocks are less alike in the behavior of their returns. This dissimilarity can create a more diverse portfolio.\nTherefore, a lower correlation means less dispersion of portfolio returns, which indicates that the portfolio has less risk. In this scenario, the\nportfolio would have the least amount of risk if the correlation between the two stocks is less than zero (Choices B and C).\nThings to remember:\nCorrelation measures the tendency of asset returns to move together. Portfolios holding assets with lower correlations tend to have lower risk.\nPortfolio risk can be measured with variance, which can be calculated using the correlation.\nCalculate and interpret the expected value, variance, standard deviation, covariances, and correlations of portfolio returns", "qhtml": null}, {"n": 133, "q": "All else equal, if a portfolio consists of two stocks, the portfolio will have the least risk if the correlation between the two stocks is:", "opts": ["less than zero.", "equal to zero.", "greater than zero."], "ans": "A", "expl": "Correlation (ρ) measures the extent to which two variables (eg, asset returns) move together. Correlation can be used to calculate portfolio\nvariance, which is a measure of portfolio risk.\nVariance measures the magnitude of the dispersion of portfolio returns whereas\ncorrelation reflects both the direction and magnitude of the movement of asset returns relative to each other.\nAll else equal, for a two-asset portfolio, a lower correlation between the two stocks results in a lower portfolio variance. The lower correlation\nimplies that the stocks are less alike in the behavior of their returns. This dissimilarity can create a more diverse portfolio.\nTherefore, a lower correlation means less dispersion of portfolio returns, which indicates that the portfolio has less risk. In this scenario, the\nportfolio would have the least amount of risk if the correlation between the two stocks is less than zero (Choices B and C).\nThings to remember:\nCorrelation measures the tendency of asset returns to move together. Portfolios holding assets with lower correlations tend to have lower risk.\nPortfolio risk can be measured with variance, which can be calculated using the correlation.\nCalculate and interpret the expected value, variance, standard deviation, covariances, and correlations of portfolio returns", "qhtml": null}, {"n": 134, "q": "A portfolio manager gathers the following information about a portfolio: Bonds Stocks Real Estate Expected return 4% 8% 2% Portfolio weight 35% 50% 15% Covariance Matrix Bonds Stocks Real Estate Bonds 80 100 45 Stocks 100 300 185 Real estate 45 185 180 If the benchmark has an expected return of 6% and standard deviation of 12.5%, based on only this information, the portfolio's risk is most likely:", "opts": ["less than the benchmark's.", "the same as the benchmark's.", "more than the benchmark's."], "ans": "B", "expl": "The variance of a portfolio is contingent on the weights of each asset in the portfolio, their individual variances, and the covariances between\neach pair of assets. The more assets in the portfolio, the more interactions exist between the assets, and the more complex the calculation will\nbe to find the portfolio's variance.\nA covariance matrix provides the variance for each asset (ie, each asset's covariance with itself), as well as the covariance for each pair of assets.\nFor instance, the variance (σ2) for bonds is 80 and the covariance between bonds and stocks is 100. In this scenario, each asset's weight and the\ncovariance matrix are provided, so the variance of the portfolio can be calculated using the following equation:\nσ2(R ) = (0.352 × 80) + (0.502 × 300) + (0.152 × 180)\np\n+ (2 × 0.35 × 0.50 × 100) + (2 × 0.50 × 0.15 × 185) + (2 × 0.35 × 0.15 × 45) ≈ 156.3\nThe standard deviation of the portfolio is 12.5% (= √156.3). Since the portfolio's standard deviation is the same as the benchmark's standard\ndeviation, the portfolio and the benchmark have the same risk (Choices A and C).\nThings to remember:\nThe variance of a portfolio is contingent on the weights of each asset in the portfolio, the assets' individual variances, and the covariances\nbetween each pair of assets. A covariance matrix provides the variance for each asset, as well as the covariance for each pair of assets.\nCalculate and interpret the expected value, variance, standard deviation, covariances, and correlations of portfolio returns", "qhtml": null}, {"n": 135, "q": "An investor has a safety-first optimal portfolio of €40 million with an expected annual return of 15% and a standard deviation of 17%. The investor plans to withdraw €1 million in one year without reducing the initial principal (assume that the initial principal is €40 million). The probability that the investor's actual return will fall below the shortfall level is closest to:", "opts": ["16.60%", "22.96%", "77.04%"], "ans": "B", "expl": "A safety-first optimal portfolio contains the optimal allocation that minimizes the probability of shortfall risk. Shortfall risk is the risk of a return\nfalling below a minimum acceptable level (ie, threshold level). The threshold level (R ) here is 2.5%, or €1 million ÷ €40 million. If the portfolio\nL\nreturn is less than 2.5% this year, then the investor must \"dip into\" the original €40 million at year-end to withdraw €1 million.\nThe SF ratio converts the 2.5% R value into a z-score that measures the absolute number of standard deviations the R is away from the\nL L\nexpected return (mean). The further the R is from the expected return, the lower the probability of shortfall risk.\nL\nNote that a z-score of −0.74 is referenced in the z-table since the threshold level is below the mean. A z-score of −0.74 indicates that the\nprobability of the actual return being below the threshold level is 0.2296, or P(z < −0.74) = 0.2296.\n(Choice A) 16.60% results from incorrectly switching the expected return and the standard deviation when calculating the safety-first ratio.\n(Choice C) 77.04% results from referencing 0.74 (instead of −0.74) in the z-table.\nThings to remember:\nThe safety-first ratio (equivalent to a z-score) indicates the probability of shortfall risk, which is the risk of a return falling below a minimum\nacceptable level (ie, threshold level). When determining the probability of shortfall risk, use the negative z-value.\nDefine shortfall risk, calculate the safety-first ratio, and identify an optimal portfolio using Roy’s safety-first criterion LOS\n6.An investor invests €1,000,000 today and plans to withdraw €50,000 one year from today. None of the withdrawal can be from principal. An\nadvisor recommends three different portfolio allocations:\nThe optimal allocation, according to Roy's safety-first criterion, has a safety-first ratio closest to:\nA. 0.21\nB. 0.36\n C. 0.48\nExplanation\nRoy's safety-first criterion determines the optimal allocation for minimizing the probability of shortfall risk. Shortfall risk is the risk of a return\nfalling below a minimum acceptable level (ie, threshold level). The threshold level (R ) here is 5%, or €50,000/€1,000,000. If the portfolio returns\nL\nless than 5% this year, then the investor must \"dip into\" the original €1,000,000 to withdraw €50,000 at year-end, which the question specifies is\nunacceptable.\nThe optimal allocation is indicated by the highest safety-first ratio (SF ratio). The SF ratio effectively converts the 5% R value into a Z-value\nL\nthat measures the absolute number of standard deviations between the R and the expected return (mean). The farther the R is from the\nL L\nexpected return, the lower the probability of shortfall risk.\nAllocation 3 has the highest SF ratio of 0.48 (Choices A and B).\nThings to remember:\nThe highest safety-first ratio (SF ratio) determines the optimal allocation for minimizing the probability of shortfall risk, which is the risk of a\nportfolio's return falling below a minimum acceptable level (ie, threshold level). The SF ratio is equivalent to a Z-score (the number of standard\ndeviations away from the mean).\nDefine shortfall risk, calculate the safety-first ratio, and identify an optimal portfolio using Roy’s safety-first criterion", "qhtml": null}, {"n": 136, "q": "An investor invests €1,000,000 today and plans to withdraw €50,000 one year from today. None of the withdrawal can be from principal. An advisor recommends three different portfolio allocations: The optimal allocation, according to Roy's safety-first criterion, has a safety-first ratio closest to:", "opts": ["0.21", "0.36", "0.48"], "ans": "C", "expl": "Roy's safety-first criterion determines the optimal allocation for minimizing the probability of shortfall risk. Shortfall risk is the risk of a return\nfalling below a minimum acceptable level (ie, threshold level). The threshold level (R ) here is 5%, or €50,000/€1,000,000. If the portfolio returns\nL\nless than 5% this year, then the investor must \"dip into\" the original €1,000,000 to withdraw €50,000 at year-end, which the question specifies is\nunacceptable.\nThe optimal allocation is indicated by the highest safety-first ratio (SF ratio). The SF ratio effectively converts the 5% R value into a Z-value\nL\nthat measures the absolute number of standard deviations between the R and the expected return (mean). The farther the R is from the\nL L\nexpected return, the lower the probability of shortfall risk.\nAllocation 3 has the highest SF ratio of 0.48 (Choices A and B).\nThings to remember:\nThe highest safety-first ratio (SF ratio) determines the optimal allocation for minimizing the probability of shortfall risk, which is the risk of a\nportfolio's return falling below a minimum acceptable level (ie, threshold level). The SF ratio is equivalent to a Z-score (the number of standard\ndeviations away from the mean).\nDefine shortfall risk, calculate the safety-first ratio, and identify an optimal portfolio using Roy’s safety-first criterion", "qhtml": null}, {"n": 137, "q": "A portfolio comprises three equally weighted assets. The covariance matrix for the three assets' returns is shown below: Asset A Asset B Asset C Asset A 200 Asset B 100 75 Asset C 125 90 210 All else equal, if the covariance between Asset A and Asset C increases to 150 and the covariance between Asset B and Asset C is simultaneously halved, the overall portfolio variance will be closest to: ", "opts": ["117", "124", "196"], "ans": "A", "expl": "Covariance measures how two variables (eg, asset returns) move in relation to each other. For portfolios with multiple assets, each possible asset\npairing has its own covariance. The different pairings can be illustrated using a covariance matrix, which shows the covariance between specific\nasset pairs. For example, in this scenario:\nThe covariance between the Asset A and Asset C returns equals 125. In the equation, this covariance would be expressed as Cov(R ,R ) =\nA C\n125.\nWhen the matrix shows an asset's covariance with itself, that covariance is simply the asset's variance: Cov(R ,R ) = σ2(R ) = 75.\nB B B\nThe covariance matrix can be applied to the equation to calculate the overall return variance for a three-asset portfolio. The asset weights are\nall equal; therefore, W = W = W = 1/3 = 0.33. In this case, Cov(R ,R ) increases from 125 to 150 while Cov(R , R ) is halved from 90 to 45.\nA B C A C B C\nThe resulting portfolio variance is calculated as follows (with updated covariances in red):\nσ2(R ) = 0.332(200) + 0.332(75) + 0.332(210) + 2(0.33)(0.33)(100) + (2)(0.33)(0.33)(45) + (2)(0.33)(0.33)(150)\np\nσ2(R ) = 0.332 [200 + 75 + 210 + 2(100 + 45 + 150)] ≈ 117.1\np\nNote that the variance is approximately 119.4 when using 1/3 as each asset's weight instead of 0.33.\n(Choice B) 124 derives from the given covariance matrix (ie, prior to the stated changes). However, a change in the covariance matrix values\nresults in a change to the portfolio variance.\n(Choice C) 196 results from incorrectly simplifying the portfolio variance equation, multiplying the full equation by 2 instead of multiplying only the\ncovariance terms by 2.\nThings to remember:\nPortfolio variance can be calculated using the portfolio's asset weights and a covariance matrix. A change in the covariance matrix values results\nin a change to the portfolio variance. The precise change can be determined by using the variance formula.\nCalculate and interpret the expected value, variance, standard deviation, covariances, and correlations of portfolio returns", "qhtml": null}, {"n": 138, "q": "Given that continuously compounded returns are normally or approximately normally distributed, asset prices are:", "opts": ["normally distributed.", "chi-square distributed.", "lognormally distributed."], "ans": "C", "expl": "Asset prices (S ) are positive; asset returns can be positive or negative. The lognormal distribution always has zero as its left endpoint, so its\nT\nvalues are always positive. The normal distribution may have zero in any position; zero may or may not be its mean. Noting the position of zero in\nthe different distributions is a practical way to remember that continuously compounded returns of assets are assumed to be normally, or\napproximately normally, distributed, and that asset prices are lognormally distributed.\nA random variable follows a lognormal distribution if and only if its natural log is normally distributed. It can be shown that continuously\ncompounded asset returns are normally distributed and that as a result, the natural log of asset prices is also normally distributed. Therefore,\nasset prices are lognormally distributed (Choices A and B).\nThings to remember:\nThe lognormal distribution always has zero as its left endpoint, so its values are always positive. The normal distribution may have zero in any\nposition; zero may or may not be its mean. Continuously compounded returns are normally or approximately normally distributed. It follows that\nasset prices are lognormally distributed.\nExplain the relationship between normal and lognormal distributions and why the lognormal distribution is used to model asset prices when using\ncontinuously compounded asset returns", "qhtml": null}, {"n": 139, "q": "A feature of Monte Carlo simulation is its ability to:", "opts": ["provide exact results.", "incorporate \"what-if\" analysis.", "explain cause-and-effect relationships."], "ans": "B", "expl": "Monte Carlo simulation can be used to solve complex financial problems (eg, planning, risk management, valuation) by randomly generating large\nsets of data over repeated trials. This complex simulation is always performed with a computer.\nIn simple terms, a Monte Carlo simulation projects a set of random values for several independent variables to approximate the value for a\ndependent variable, over repeated trials. Each trial generates one set of data. At the end of the simulation, the dependent variable's approximate\nvalue from all the trials is averaged.\nOne strength of the Monte Carlo model is that it provides sensitivity (what-if) analysis by allowing users flexibility to adjust the parameters of\nthe simulation (ie, probability distributions of the data, as well as mean and standard deviation of the distribution). Despite these strengths, there\nare also limitations to the Monte Carlo model. The model provides statistical estimates, not exact results (Choice A). Furthermore, these\nestimates fail to identify cause-and-effect relationships (Choice C).\nThings to remember:\nMonte Carlo simulation can be used to solve complex financial problems (eg, planning, risk management, valuation) by randomly generating large\nsets of data over repeated trials. Strengths of this model lie in its ability to price complex securities and provide what-if analysis. Limitations of the\nmodel include its inability to provide exact results and identify cause-and-effect relationships.\nDescribe Monte Carlo simulation and explain how it can be used in investment applications", "qhtml": null}, {"n": 140, "q": "An analyst is determining the appropriate price for a complex call option on a bond. Monte Carlo simulation is most appropriate to use if the analyst:", "opts": ["requires an accurate result.", "can only use estimates for the inputs.", "is unsure of the probability distributions for the inputs."], "ans": "B", "expl": "Monte Carlo simulation is a technique that generates random samples from specific probability distributions. One of the advantages of Monte\nCarlo simulation is that the user can conduct what-if analyses by changing the assumptions underlying the inputs used to analyze the data.\nMonte Carlo analysis generates a result that is an average of thousands of trials (ie, simulation). Its accuracy depends on its standard\ndeviation. A large standard deviation indicates a wide variability of possible outcomes. For example, the simulation might result in a price of $5,\nbut it could be as low as $4 or as high as $6. Therefore, when an investment decision requires a precise result, Monte Carlo simulation may be\ninappropriate (Choice A).\nMonte Carlo simulation can incorporate multiple inputs. For example, the derivative in this scenario may be impacted by interest rate volatility,\nchanges in the issuer's credit rating, and the correlation of bond prices and economic conditions. Each variable has its own probability distribution,\nand unless the user knows or can reasonably estimate the distributions, the simulation would produce meaningless results (Choice C).\nThings to remember:\nMonte Carlo simulation allows a user to conduct what-if analyses by changing the assumptions underlying the inputs used to analyze the data. To\ngenerate valid results, the user must know the probability distributions for the simulation inputs. In addition, since it generates an average from the\nresults of thousands of trials, Monte Carlo simulation may be inappropriate when an investment decision requires an exact result.\nDescribe Monte Carlo simulation and explain how it can be used in investment applications", "qhtml": null}, {"n": 141, "q": "Which of the following distributions is most appropriate for modeling a stock's price?", "opts": ["Normal", "Lognormal", "Multivariate"], "ans": "B", "expl": "A lognormal distribution has several characteristics that make it suitable for modeling stock prices. Values on the lower end of the distribution are\nbounded by zero but have no upper bound. The distribution also has a skew to the right. This results in a shortened left tail, a long right tail,\nand an asymmetrical shape. Stock prices behave similarly: prices cannot be below zero and theoretically have no upper limit.\n(Choice A) Normal distributions are symmetrical, do not have a skew, and do not have upper or lower bounds. These characteristics are\ninconsistent with the distribution of stock prices; therefore, a normal distribution is not appropriate here.\n(Choice C) Multivariate distributions are a form of normal distribution that deals with groups of variables instead of a single variable. A normal\ndistribution is not suitable here and in this case there is only one variable, which makes the multivariate distribution an inappropriate choice.\nThings to remember:\nLognormal distributions have a lower bound of zero, no upper bound, and are asymmetrical with a right skew. These features make them suitable\nfor describing stock prices, which are asymmetrically distributed and skew to the right since they cannot drop below zero and theoretically have no\nupper limit.\nExplain the relationship between normal and lognormal distributions and why the lognormal distribution is used to model asset prices when using\ncontinuously compounded asset returns", "qhtml": null}, {"n": 142, "q": "Prices for a volatile asset most likely follow a(n):", "opts": ["F-distribution.", "binomial distribution.", "lognormal distribution."], "ans": "C", "expl": "A lognormal distribution is a positively skewed probability distribution with a lower bound of zero that models probability distributions of asset\nprices. Asset prices cannot be less than zero, so the distribution is positively skewed with a lower bound of zero and no upper bound. The long\ntail on the right reflects the reduced probability of higher prices for the asset.\nRandom variables follow a lognormal distribution if their natural logarithms follow a normal distribution. For example, an asset's continuously\ncompounded return for any period is the natural logarithm of the ratio of its ending price to its beginning price:\nAn asset's continuously compounded returns may follow a normal distribution. In that case, the asset's prices follow a lognormal distribution.\n(Choice A) An F-distribution is used for hypothesis tests concerning the equality (or inequality) of the variances of two separate populations.\n(Choice B) A binomial distribution is a probability distribution based on an event having one of two possible outcomes. A binomial distribution can\nmodel the change of asset prices over time but does not model the distribution of the prices themselves.\nThings to remember:\nA lognormal distribution is a positively skewed probability distribution with a lower bound of zero that models the distribution of an asset price.\nAsset prices cannot be less than zero, and because they have no maximum the distribution has no upper bound. Random variables follow a\nlognormal distribution if their natural logarithms follow a normal distribution.\nExplain the relationship between normal and lognormal distributions and why the lognormal distribution is used to model asset prices when using\ncontinuously compounded asset returns", "qhtml": null}, {"n": 143, "q": "If a random variable X is lognormally distributed, its natural log most likely follows a:", "opts": ["normal distribution.", "lognormal distribution.", "chi-squared distribution."], "ans": "A", "expl": "If a random variable is lognormally distributed, this means its natural log is normally distributed. If a variable is lognormally distributed, it\ncan be defined and analyzed with reference to the mean and variance of its associated normal distribution (ie, the distribution of the natural log of\nX). The related normal distribution is simpler to work with than the lognormal distribution.\nAnalyzing a lognormal distribution is more complex than analyzing a normal distribution. It is bounded by zero to the left and is asymmetrical. In\naddition, calculating its mean and variance is cumbersome. However, it can be analyzed via its associated normal distribution, making the\nlognormal distribution useful for conducting statistical tests on lognormally distributed data like asset prices.\n(Choice B) The natural log of a lognormally distributed random variable is distributed according to a normal distribution, not another lognormal\ndistribution.\n(Choice C) A chi-squared distribution is the distribution of a random variable that is the sum of squares of one or more independent standard\nnormal random variables. The natural log of a lognormally distributed random variable is not chi-square distributed.\nThings to remember:\nIf a random variable is lognormally distributed, its natural log is distributed according to a normal distribution. Lognormally distributed random\nvariables are usually defined and analyzed in terms of their associated normal distributions, since it is easier to do so than to work with the\nparameters of the lognormal distribution directly.\nExplain the relationship between normal and lognormal distributions and why the lognormal distribution is used to model asset prices when using\ncontinuously compounded asset returns", "qhtml": null}, {"n": 144, "q": "An analyst samples market capitalization (market cap) values from several stocks in an index composed of 250 stocks. From this sample, the standard deviation of market cap is $9.6 billion and the standard error of the mean market cap is $1.2 billion. The number of stocks in the sample is closest to:", "opts": ["8", "31", "64"], "ans": "C", "expl": "A sample is a subset of a population that is selected to represent the characteristics of that population. In this question, the representative\ncharacteristic is the market cap value. Many different sample groups can be drawn from a population; each group will have its own sample mean.\ns\nThe standard error of the sample mean, or X¯¯¯, is the standard deviation of distributions of the various sample means. The standard error of the\nmean decreases with increasing sample size (n). This means that larger sample sizes better represent the population. The sample size can be\nfound by rearranging the equation above.\n(s) (σ)\nNote that for the exam, a question may provide either the sample standard deviation or the population standard deviation . Regardless of\nwhich type of standard deviatio
