d reporting years, firms are allowed to present fewer periods\nof historical performance than exist.\n(Choice C) Firms can present results of a single portfolio if it is the only one for a given strategy.\nThings to remember:\nThe performance reporting standards known as GIPS (Global Investment Performance Standards) provide a uniform approach for presenting\nhistorical investment performance. GIPS require that firms include terminated portfolios as part of the historical performance of a composite.\nExplain why the GIPS standards were created, who can claim compliance, and who benefits from compliance", "qhtml": null}, {"n": 124, "q": "Zhang Li, CFA, is a portfolio manager who manages a mutual fund and a hedge fund for an investment company. Li conducts thorough due diligence of Coffee Cup Inc., which she believes will revolutionize the industry, and finds that the stock is suitable for both funds. Li places a limit order for 100,000 shares at $35 and instructs the broker to allocate 90% to the mutual fund and 10% to the hedge fund, based on the funds' sizes and investment objectives and given that neither fund requires a minimum allocation. On the same day, Coffee Cup announces it has received a new patent and the stock price quickly increases to $40 per share. Later, Li sees that her order has been only partially filled and she has received only 10,000 shares. Li decides that she would prefer the hedge fund have a full allocation, so she instructs the broker to allocate all 10,000 shares to the hedge fund and cancels the rest of the order. Does Li's conduct most likely comply with Standard III(B) Fair Dealing? ", "opts": ["No, since she favored one client over another.", "Yes, since the hedge fund received its full allocation, but no more.", "Yes, since a pro rata allocation would have been too small for either client."], "ans": "A", "expl": "\"Members and Candidates must deal fairly and objectively with all clients when providing investment analysis,\nmaking investment recommendations, taking investment action, or engaging in other professional activities.\"\nStandard III(B) Fair Dealing focuses on managers' responsibilities to treat all clients fairly and objectively, specifically in terms of information\ndistribution and investment actions. According to the Standards, when a member or candidate is managing a fund, that fund is the client.\nIn this scenario, Li violated Standard III(B) by changing the allocation to each fund after finding out that the stock price had risen. Since the\norder had been only partially filled, the shares should have been allocated on a pro rata basis as initially instructed. The mutual fund was at a\ndisadvantage since it was also entitled to participate in the gain but Li's action prevented this participation.\n(Choice B) Allowing the hedge fund a full allocation and the full benefit of a fortuitous trade at the expense of another client (ie, the mutual fund)\nafter hearing of the price gain is a violation of the Standard.\n(Choice C) Minimum allocation sizes are sometimes appropriate and even common (eg, initial public offerings, new corporate bond offerings).\nHowever, the key element in this scenario is that the portfolio manager knew the stock price had risen and deliberately favored one client (ie,\nhedge fund) over another client (ie, mutual fund). This is an especially sensitive issue if a fund charging higher fees (eg, hedge fund with incentive\nfees) is favored over a fund charging lower fees (eg, mutual fund).\nThings to remember:\nStandard III(B) Fair Dealing focuses on managers' responsibilities to treat all clients fairly and objectively, specifically in terms of information\ndistribution and investment actions. In this scenario, Standard III(B) was violated by changing the trade allocation once the stock price had risen.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 125, "q": "Wang Pei Han, CFA, is an independent investment consultant. Among her clients are the investment fund for Bright Life Insurance (BLI) and the personal investment account for the fund's manager, Li Jie. Wang is contacted by the CFA Institute Professional Conduct Program (PCP) regarding her own potentially unethical, but not illegal, activity. The PCP is requesting information about the fund and Li's investment account to support its investigation. Local law requires that information about illegal activity be disclosed to authorities but does not mandate any specific action otherwise. Given that BLI and Li are clients, to comply with Standard III(E) Preservation of Confidentiality, Wang's most appropriate action is to provide the PCP information about:", "opts": ["only BLI's investment fund since Li is an individual investor.", "both BLI's investment fund and Li's personal investment account.", "neither BLI's investment fund nor Li's personal investment account."], "ans": "B", "expl": "\"Members and Candidates must keep information about current, former, and prospective clients confidential\nunless:\n1. The information concerns illegal activities on the part of the client or prospective client,\n2. Disclosure is required by law, or\n3. The client or prospective client permits disclosure of the information.\"\nStandard III(E) Preservation of Confidentiality instructs Members and Candidates to protect confidential information provided by clients,\nprospective clients, and former clients. This applies to both individual and institutional investors equally. Confidential information includes that\nwhich:\nis received while conducting the client's business or personal affairs\narises or is relevant to the portion of the client's business that is subject to the relationship.\nIn addition to the three conditions listed in the Standard, Members and Candidates are required, when permitted by applicable local laws, to\nprovide the CFA Institute Professional Conduct Program (PCP) any client information requested during PCP investigations into themselves.\nMembers and Candidates are also encouraged to cooperate in investigations of others by the PCP. Confidential information provided to the PCP\ndoes not violate the Standard.\nIn this scenario, Wang Pei Han must first defer to local law, which does not mandate any specific action from her since there are no illegal actions\nto report. Therefore, the Standard requires Wang to disclose the information that the PCP is seeking regarding both clients (Choices A and C).\nThings to remember:\nStandard III(E) Preservation of Confidentiality instructs Members and Candidates to protect the information of individual and institutional investor\nclients. However, when applicable law allows, the Standard requires Members and Candidates to provide requested client information during\nProfessional Conduct Program investigations.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 126, "q": "Fulvio Lombardi, CFA, a research analyst, recently left Primo Investment, where he had published research on Breve Latte Inc. (BLI). Lombardi joins Risultati Research and uses publicly available information and material from management's latest earnings release to create a new research report on BLI based on updated information. The public information includes material from Twitter posts and online blogs by BLI's chief executive officer and chief financial officer. Lombardi verifies the information in the social media sources when possible and feels comfortable including them in his analysis. Since these tweets and blogs are hosted on electronic servers and are easily accessible, Lombardi does not see the need to maintain them in his files, yet he keeps documentation of personal notes, articles, and other research documents. Lombardi publishes the report without obtaining permission from or citing his former employer. Which of Lombardi's actions are most likely in compliance with Standard V(C) Record Retention?", "opts": ["Only his documentation of research sources", "Only the publishing of the research report on BLI at Risultati", "Both his documentation of research sources and publishing of the report on BLI at Risultati"], "ans": "B", "expl": "\"Members and Candidates must develop and maintain appropriate records to support their investment analyses,\nrecommendations, actions, and other investment-related communications with clients and prospective clients.\"\nTypically, records are the property of the firm and must not be used outside that firm without written consent. However, the member or\ncandidate may create new reports on companies covered during prior employment if the member or candidate obtains information from public\nsources or new research material (ie, not from memory). Thus, Lombardi's creation and publishing of the research report comply with the\nStandard.\n(Choices A and C) Although the Standard places primary responsibility on the firm for record retention compliance, members and candidates\nmust keep records on their own to assist the firm. These records include retaining documentation of online media, including emails, text, Twitter,\nand blog posts (ie, new media items). Here, Lombardi's failure to document the Twitter and blog posts conflicts with the Standard.\nThings to remember:\nStandard V(C) Record Retention requires members and candidates to keep records (which are considered the property of the firm), including\ndocumentation of social media sources such as Twitter and blog posts, that support their investment-related communication with and actions on\nbehalf of clients and prospective clients. Members or candidates that leave one firm for another may continue to cover the same companies at the\nnew firm if the member or candidate creates new reports using information from public sources or new research material.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 127, "q": "Aditi Kumar is a Level II Candidate and a performance measurement and attribution analyst for an investment manager. On a quarterly basis, Kumar produces performance reports that include the firm's composites for each investment strategy. Raheem Khan, CFA, the portfolio manager of the firm's large-cap equity strategy approaches Kumar regarding the large-cap equity composite for the most recent quarter. Kumar explains that several accounts in the composite should be excluded from this quarter's performance report due to a software issue that resulted in numerous accounts not being fully invested. The resulting cash drag caused the composite to underperform the benchmark index for the quarter and year. Khan explains that he should not be held responsible for a software error. Kumar agrees and produces new reports without the affected accounts. According to Standard I(C) Misrepresentation, it is most likely that:", "opts": ["no violation occurred.", "only Kumar violated the Standard.", "both Kumar and Khan violated the Standard."], "ans": "C", "expl": "\"Members and Candidates must not knowingly make any misrepresentations relating to investment\nanalysis, recommendations, actions, or other professional activities.\"\nStandard I(C) Misrepresentation protects investors against statements and information provided by the investing community that may undermine\ninvestor trust in the integrity of the profession. Misrepresentation can include:\nPlagiarism: quoting information without acknowledgment or citation of the source\nOmission: presenting incomplete or misleading information\nExaggeration: inflating professional credentials or performance results\nPerformance measurement and attribution is an area susceptible to selective disclosure and omission. A prime example is the concept of \"cherry\npicking,\" which involves choosing only the best funds or accounts or omitting the worst for performance reporting. Omitting accounts or altering\ncomposite construction outside a clearly defined process may lead to misrepresenting composite performance.\nIn this instance, Khan persuaded Kumar to alter the composite construction due to a one-time software issue, which improved the composite's\nperformance. Therefore, both Kumar and Khan violated the Standard by presenting incomplete or misleading information (Choices A and\nB).\nAlthough the software issue may not have been Khan's fault, changing the composite constituents to omit the affected accounts violates the\nStandard. Also, the fact that Kumar is not yet a charterholder is irrelevant in this scenario since he, as a Candidate, is expected to uphold the\nCode and Standards.\nThings to remember:\nPerformance measurement and attribution is an area susceptible to selective disclosure, omission, and exaggeration. \"Cherry picking\" involves\nchoosing only the best funds or accounts or omitting the worst for performance reporting. Omitting accounts or altering composite construction\noutside a clearly defined process may lead to misrepresenting composite performance.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 128, "q": "Marcos Silva, CFA, and Clara Neves, CFA, are analysts at Alpha Capital, an independent research firm. Silva reads a blog post about Northwest Bank that details several fresh insights on company-specific growth. After doing his own thorough research on Northwest, Silva agrees with the blogger's analysis, although he expects this growth to take longer than the blogger predicts. Silva then writes a research report on Northwest and includes a restatement of the blogger's insights. Since he has changed some of the wording and the expected time horizon for growth, he does not reference the blog. Neves proofreads the report at Silva's request and agrees with his conclusion about the bank. With Silva's approval, Neves adds a chart from the US Federal Reserve, which is not copyrighted, that shows expected growth in bank reserves over the next year. She properly cites the US Federal Reserve as the source. According to the Code and Standards:", "opts": ["both Silva and Neves have violated the Standards.", "Silva has violated the Standards, but Neves has not.", "Neves has violated the Standards, but Silva has not."], "ans": "B", "expl": "\"Members and Candidates must not knowingly make any misrepresentations relating to investment analysis, recommendations, actions, or\nother professional activities.\"\nStandard I(C) Misrepresentation protects investors against statements and information provided by the investing community that may undermine\ninvestor trust in the integrity of the profession. Misrepresentation can include:\nPlagiarism: quoting information without acknowledgment or citation of the source\nOmission: presenting incomplete information or data in order to mislead\nExaggeration: inflating professional credentials or performance results\nThe use of another's work without attribution is plagiarism, even if the work is not quoted verbatim from the original or slight changes have\nbeen made. Others' work can be presented to clients as long as the original source is clearly identified.\nIn this scenario, Marcos Silva restates an excerpt from a blog, changing only the time horizon of the expected growth while effectively copying\nimportant substance about the sources of that growth. Silva does not make significant changes to the original author's work, nor does he attribute\nthe work to that author; this is plagiarism, and Silva has violated the Standard (Choice C).\n(Choice A) Clara Neves includes a chart from the US Federal Reserve, which is not her original work. However, Neves does not commit\nplagiarism since the material is not copyrighted, allowing it to be repurposed without permission, and she properly cites the original source;\ntherefore, she has not violated the Standard.\nThings to remember:\nStandard I(C) protects investors against statements and information from the investing community that may undermine investor trust in the\nintegrity of the profession. Making only slight changes to another's work and failing to cite the source is considered plagiarism, which misleads\ninvestors and is a violation of the Standard.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 129, "q": "Clem Benson, CFA, is the chief investment officer at Sterling Hospital. Sterling's board asks Benson for fundraising ideas. Benson suggests that if Sterling refers past contributors to him, he will conduct a personalized investment review for a fee of $1,000. In return, Benson will donate 50% of that fee to Sterling. After receiving board approval, Sterling promotes the fundraising campaign to its past contributors, informs them of Benson's arrangement, and refers 50 clients to Benson. The fundraiser raises $25,000 for Sterling. According to Standard VI(C) Referral Fees, has Benson most likely violated the Standard?", "opts": ["No.", "Yes, since Benson receives income from the referrals.", "Yes, since Benson receives the tax deduction for the donation instead of the contributors."], "ans": "A", "expl": "\"Members and Candidates must disclose to their employer, clients, and prospective clients, as appropriate, any\ncompensation, consideration, or benefit received from or paid to others for the recommendation of products or\nservices.\"\nUnder Standard VI(C), Members and Candidates must notify clients of the benefits they obtain for receiving a referral. When an adviser's\nreferral arrangements are disclosed, prospective clients may evaluate the adviser's objectivity.\nAll referral arrangements between an employee and employer or an employee and a third party must be disclosed. Clem Benson does not violate\nthe Standard since both Sterling Hospital and the past contributors being referred to Benson are aware of the referral structure.\n(Choice B) Benson may receive cash from the referral arrangement since the clients are informed of the referral structure.\n(Choice C) Benson is permitted to construct any legally allowable referral arrangement, including one that generates a tax benefit. Since the\nreferral structure is disclosed, he does not violate the Standard.\nThings to remember:\nMembers and Candidates must notify clients of the benefits they obtain for receiving a referral. When an adviser's referral arrangements are\ndisclosed, prospective clients may evaluate the adviser's objectivity. All referral arrangements between an employee and employer or an\nemployee and a third party must be disclosed.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 130, "q": "Maria Perez, CFA, is a portfolio manager for a small family office, Powell Investment Partners. Powell's investment policy does not allow managers to invest in individual hedge funds, but Perez gets approval to invest in funds of hedge funds. Perez decides to invest in Ashvale Group, a fund of hedge funds operated by a former colleague, Jose Rivera. She sees that Ashvale has posted strong returns in each of the past five years and remembers Rivera being highly diligent in his investment decisions when they worked together. Perez knows that fund-of-hedge- funds managers perform due diligence on each individual hedge fund in which they invest, so she feels comfortable with her decision. Has Perez violated Standard V(A) Diligence and Reasonable Basis? ", "opts": ["Yes", "No, since she worked with Rivera and is familiar with his work", "No, since fund-of-hedge-funds managers do the due diligence on behalf of investors"], "ans": "A", "expl": "\"Members and Candidates must:\n1. Exercise diligence, independence, and thoroughness in analyzing investments, making investment\nrecommendations, and taking investment actions.\n2. Have a reasonable and adequate basis, supported by appropriate research and investigation, for any\ninvestment analysis, recommendation, or action.\"\nStandard V(A) Diligence and Reasonable Basis mandates that Members and Candidates who are managers or advisors conduct thorough and\ndiligent analysis of all investments made on behalf of their clients. The Standard aims to ensure that investment recommendations on clients'\nbehalf are well researched since clients rely on investment professionals to do the research for them.\nDue diligence should be conducted by the Member or Candidate on any investment, including for a fund that invests in multiple hedge funds (fund\nof funds). A manager of a fund of funds performs due diligence on each individual hedge fund in the fund of funds. However, when a Member or\nCandidate invests in an existing fund of funds, due diligence must be conducted on each of the hedge funds and its manager to ensure that they\nmeet all investment criteria (Choice C). This review should be as diligent as reviews of other investment types.\nIn this scenario, Maria Perez has relied on her memory of working with Rivera when she decides to invest in Ashvale. Remembering that Rivera\nwas a diligent investor is not an adequate level of due diligence. Perez should have performed the same level of due diligence on Rivera that she\nwould have on any other fund manager (Choice B). Perez's actions would be deemed a Standard violation.\nThings to remember:\nStandard V(A) Diligence and Reasonable Basis mandates that Members and Candidates conduct a thorough and diligent analysis of any\ninvestment. This includes due diligence on funds of hedge funds as well as their managers.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 131, "q": "Morena Villalba, CFA, and Franco Aquirre, a Level I CFA candidate, both work in the private wealth department of a major bank and often work with the same clients. Villalba becomes aware that Aquirre receives compensation for each referral he makes to the bank's brokerage department that results in commissions but does not disclose that fact to clients. Also, she learns that Aquirre and a colleague have been able to hide the arrangement and fees from the firm. Villalba researches local law and believes that Aquirre's arrangement is illegal. She reports the situation to her supervisor, but after some time has passed, Villalba notices that Aquirre continues to benefit from his referrals, and she is not sure what to do next. According to Standard I(A) Knowledge of the Law, which of the following actions is Villalba's most appropriate next step?", "opts": ["Resign from her employment at the bank", "Request a transfer to another department of the bank", "Remain in her role to document stronger evidence to present later"], "ans": "B", "expl": "\"Members and Candidates must understand and comply with all applicable laws, rules, and regulations (including\nthe CFA Institute Code of Ethics and Standards of Professional Conduct) of any government, regulatory\norganization, licensing agency, or professional association governing their professional activities. In the event of\nconflict, Members and Candidates must comply with the more strict law, rule, or regulation. Members and\nCandidates must not knowingly participate or assist in and must dissociate from any violation of such laws, rules,\nor regulations.\"\nWhen a member or candidate becomes aware that violations of rules or laws are taking place, the Standard encourages the member or candidate\nfirst to report the situation to a supervisor or compliance department. If that is unsuccessful, members and candidates should then attempt to\ndissociate (ie, separate themselves) from the activity, not necessarily resign from the firm.\nHere, Villalba's most appropriate next step is to dissociate from the activity by requesting reassignment. She may need to resign if that request\nis not granted. Note that although the Standard strongly encourages reporting, it does not require the member or candidate to report unethical or\nillegal activities by others to government authorities or regulators (Choice A).\n(Choice C) Remaining in her current role is not an appropriate action. The Standard implies that by both continuing to associate with and failing\nto act on a legal violation, Villalba could be considered as taking part in or assisting with the illegal conduct.\nThings to remember:\nStandard I(A) Knowledge of the Law requires a member or candidate who becomes aware that violations of rules or laws are taking place to first\nreport the situation to a supervisor or compliance department. If unsuccessful, the next step is to dissociate from the activity. In some cases, the\nmember or candidate may need to resign from the firm.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 132, "q": "Calvin Wurtz, CFA, is the founder and CEO of Florenz Equities, an asset management firm specializing in small-cap stocks. The firm's marketing materials display its average compounded returns over 5, 10, and 15 years. The materials include the following statements: Statement 1: \"Average returns for each time period shown in these materials include returns from both currently active accounts and accounts that were terminated during that period.\" Statement 2: \"We present average return data gross of management fees.\" The materials do not specify the dates when accounts were terminated. The materials state that the firm does not comply with Global Investment Performance Standards® (GIPS). Has Wurtz violated Standard III(D) Performance Presentation with respect to Florenz's marketing materials? ", "opts": ["Yes, only regarding terminated accounts.", "Yes, only regarding average return data.", "Yes, regarding both terminated accounts and average return data."], "ans": "A", "expl": "\"When communicating investment performance information, Members and Candidates must make reasonable efforts to ensure\nthat it is fair, accurate, and complete.\"\nStandard III(D) Performance Presentation requires members and candidates to avoid misleading investors (and potential investors) when\ncommunicating investment performance. The Standard applies to how performance is presented and measured. Although compliance with the\nGlobal Investment Performance Standards® (GIPS) is recommended, a firm does not need to adopt GIPS to comply with this Standard.\nA firm must include both active and terminated accounts in its performance information. The information must clearly indicate when\naccounts were terminated. Failing to do so could mislead investors since the breakdown of returns for terminated accounts and active accounts\ncannot be easily determined.\nFirms must also indicate whether performance is calculated gross of (ie, before) or net of (ie, after) management fees. In this scenario,\nStatement 2 clearly states that performance data are gross of fees, so the materials comply with the Standard. Florenz Equities does not need to\nspecify its management fees in its marketing materials (Choices B and C).\nThings to remember:\nStandard III(D) requires members and candidates to present performance in a way that does not mislead investors. When presenting past\nperformance in marketing materials, firms should include returns from both terminated and active accounts and state when accounts were\nterminated. Firms must also indicate whether returns are gross or net of fees, but there is no requirement to disclose the fees in marketing\nmaterials.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 133, "q": "Gerry Walsh, CFA, trades only cryptocurrencies through an account at Mayday Securities. Since the account was opened in January 20X7, Walsh has earned an average monthly return of 3.5%. However, returns have been very volatile, and the monthly gains and losses often exceed 10%. In January 20X8, Walsh starts a subscriber-based online investment newsletter providing information on his experience with cryptocurrencies and monthly returns. In the newsletter, Walsh suggests similar long-term average returns are possible for others if they follow his strategies. He states that cryptocurrency trading can generate large gains, but adds that it carries the potential for high volatility and significant losses. Although Walsh wants more subscribers, he fully discloses the account's performance in 20X7 and notes that cryptocurrency investments may not be appropriate for all investors. Based on the actions described, does Walsh violate Standard I(C) Misrepresentation by issuing the newsletter? ", "opts": ["No.", "Yes, since he presents performance for only 20X7.", "Yes, since he knows cryptocurrencies are not appropriate for all subscribers."], "ans": "A", "expl": "\"Members and Candidates must not knowingly make any misrepresentations relating to investment analysis,\nrecommendations, actions, or other professional activities.\"\nStandard I(C) Misrepresentation concerns actions that may undermine investor trust in the integrity of the CFA profession and the financial\nmarkets. The Standard applies to all information presented to clients, colleagues, or the public. Misrepresentation can include:\nOmission: Presenting incomplete information or data in order to mislead\nExaggeration: Inflating professional credentials or performance results\nPlagiarism: Quoting information without acknowledgment or citation\nIn this scenario, Gerry Walsh has complied with the Standard by fully disclosing performance for the life of the account (Choice B). The\nStandard prohibits Members and Candidates from guaranteeing clients specific returns on investments since all investments carry some\ndegree of risk. Although Walsh states that \"similar long-term average returns are possible for others,\" he is not violating the Standard. Walsh is\nnot promising such returns will be achieved, and he warns investors about \"the potential for high volatility and significant losses.\"\n(Choice C) Walsh provides data conveying the risk of cryptocurrencies and advises they are not appropriate for all investors. The Standard is not\nviolated since there is no omission of information that might result in investors being misled.\nThings to remember:\nStandard I(B) Misrepresentation prohibits Members and Candidates from knowingly misrepresenting or misusing information in presenting it to\nclients, colleagues, or the public. Misrepresentation can happen through acts of plagiarism, omission, or exaggeration. The Standard also\nprohibits Members and Candidates from guaranteeing any return on risky investments.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 134, "q": "Matt Fabiano, CFA, is the senior portfolio manager at Marco Investment Advisors (MIA). All of MIA's clients gave Fabiano discretion over their accounts and, as part of his service, he directs trades to a number of brokerage firms. Fabiano discovers that if he trades exclusively with Strollo Brokerage Inc. (SB), MIA could participate in SB's client referral program, allowing MIA to serve more clients. Based on MIA's analysis, Fabiano concludes that clients are neither harmed by nor benefit from using SB as a broker. With respect to Standard III(A) Loyalty, Prudence, and Care, if Fabiano trades exclusively with SB, most likely he:", "opts": ["does not violate the Standard since he has discretion.", "violates the Standard since clients do not receive a benefit.", "does not violate the Standard since he does not receive a benefit."], "ans": "B", "expl": "\"Members and Candidates have a duty of loyalty to their clients and must act with reasonable care and exercise\nprudent judgment. Members and Candidates must act for the benefit of their clients and place their clients'\ninterests before their employer's or their own interests.\"\nStandard III(A) Loyalty, Prudence, and Care requires members and candidates to be loyal to clients and use reasonable care. This implies\nmaking prudent investment decisions based on the clients' best interests only. One application of the Standard is how members and candidates\ndirect trades on the clients' behalf.\nHere, Fabiano, who has discretion over client accounts, controls how client trades are executed. If he trades exclusively with SB, he violates the\nStandard since clients do not benefit. Fabiano and his firm reap the benefits (ie, financial reward from having more clients) by participating in the\nclient referral program. Being unharmed is not the same as receiving a benefit. If there is any benefit derived from directing trades, it must be\nrealized by the client (Choice C).\n(Choice A) Having discretion indicates Fabiano makes day-to-day investment decisions without continually asking for the client's permission.\nHowever, having discretion does not exempt Fabiano from being loyal to his clients (ie, the Standards).\nThings to remember:\nUnder Standard III(A) Loyalty, Prudence, and Care members and candidates must be loyal to clients and use reasonable care. To comply with this\nStandard regarding trading, if a benefit exists, clients must receive it. Members and candidates will violate the Standard if they or their firm\nreceives a benefit and clients do not.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 135, "q": "Hudson Bright, CFA, just received his certificate in quantitative finance. As part of his studies, he developed training modules for financial modeling. Soon after receiving his certificate, Bright joins QED Consulting, a quantitative analysis consulting firm, and posts news about his certificate and new job on social media. The local CFA Society president sees his post and asks him to teach financial modeling classes. After determining that the time commitment will not hinder his performance at QED, Bright agrees to teach a monthly, one-hour class for 6 months at €500 per class. He advises QED of his plans in an email that states, \"I am writing to inform you that I have agreed to partner with the local CFA Society to teach financial modeling classes. Please contact me with any questions.\" He does not receive a response and begins teaching the classes. Has Bright most likely violated Standard IV(A) Loyalty to Employer? ", "opts": ["No.", "Yes, since he started teaching prior to receiving approval from QED.", "Yes, since his notice to QED left out required information on compensation and duration."], "ans": "A", "expl": "\"In matters related to their employment, Members and Candidates must act for the benefit of their employer and\nnot deprive their employer of the advantage of their skills and abilities, divulge confidential information, or\notherwise cause harm to their employer.\"\nStandard IV(A) Loyalty is one of the broader Duties to Employers addressed in Standard IV. It places specific requirements on members or\ncandidates who intend to engage in independent practice for compensation when that practice may conflict with the employer's interest or\ndeprive the employer of business opportunities. Members or candidates who plan to engage in such independent practice must notify their\nemployer prior to offering the services.\nIn this instance, there is no violation of the Standard since Bright's teaching does not compete with QED's business model. Furthermore,\nbased on the information provided, teaching the classes will not deprive his employer of any of his skills or time, and the teaching may benefit his\nemployer by improving his skill set.\n(Choice B) If Bright's independent practice competed with QED's business, he would have to wait for permission prior to teaching a class to\ncomply with the Standard.\n(Choice C) In this case, Bright is not required to provide notice. When the Standard does apply, members and candidates are required to provide\na description of the services to be offered, compensation to be received, and expected duration of services.\nThings to remember:\nStandard IV(A) Loyalty applies when members or candidates plan to engage in independent practice for compensation that competes with the\nemployer's business or conflicts with the employer's interest. If the Standard applies, members and candidates must notify their employer prior to\noffering the services.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 136, "q": "Trevor Johnson, CFA, joins Pinnacle Advisors as an equity trader. Pinnacle uses Research Market Brokers (RMB) for all trades from accounts that allow soft dollar arrangements and Cost Cutter Brokers (CCB) for those that do not. RMB does not have the lowest execution price but offers research used for the benefit of Pinnacle's clients. CCB offers the lowest price execution available for Pinnacle. After a slow trading month, Pinnacle is below its soft dollar trading commitment to RMB. RMB offers to temporarily lower the price of its trades to match CCB until the commitment is reached as long as all trades, including those on accounts that do not allow soft dollar arrangements, are made through their brokerage. Based on the Code and Standards, Johnson: ", "opts": ["can temporarily trade all accounts through RMB since it lowered its price.", "can only trade stocks through CCB for all accounts since it is usually the lowest-priced.", "cannot use trades for accounts that prohibit soft dollar arrangements to meet the commitment."], "ans": "A", "expl": "\"Members and Candidates have a duty of loyalty to their clients and must act with reasonable care and exercise prudent judgment. Members\nand Candidates must act for the benefit of their clients and place their clients' interests before their employer's or their own interests.\"\nStandard III(A) Loyalty, Prudence, and Care requires Members and Candidates to seek best price and best execution for client trades. \"Best\nprice\" and \"best execution\" do not necessarily mean the lowest trading commission, but commissions paid to brokers to execute the trades must\nbe commensurate with the value received.\nSoft dollar brokerage refers to the practice of using a portion of brokerage commissions to purchase investment services (eg, research).\nSince the client \"pays\" the commission out of client assets, these investment services are the property of the client, not the investment\nmanagement firm, and must be used to benefit the client. Typically, brokers that offer value-added investment services charge higher\ncommissions. Clients can choose not to have their accounts traded on a soft dollar basis if they do not feel the value is worth the cost.\nIn this scenario, Johnson does not violate the Standard even though he directs all account trading to RMB. RMB reduced its commissions to\nmatch CCB's commissions; therefore, the clients that do not allow soft dollars are not paying extra to subsidize the research used by clients that\nallow soft dollars (Choice C). When RMB raises its prices, Johnson must switch accounts that do not allow soft dollars back to CCB.\n(Choice B) Johnson is not required to trade through only CCB despite them having the lowest commissions since RMB adds value to Pinnacle's\nclients through the research they offer, so long as the research is used to benefit Pinnacle's clients.\nThings to remember:\nSoft dollar brokerage refers to the practice of using a portion of brokerage commissions to pay for investment research. The research purchased\nthrough these agreements is considered an asset of the client, not the investment manager. Clients may opt out of trading with brokers with\nhigher commissions and soft dollar arrangements.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 137, "q": "Shweta Reddy, CFA, proctors the last day of the Level III CFA exam. While conducting a walkthrough during the exam, she sees one Candidate glancing at another Candidate's monitor. She notices that the question on the cheating Candidate's screen is about the portfolio management of pension funds. After the exam, Shweta joins the other proctors for drinks at a local bar and runs into an old friend, a doctor who has no plans to take any CFA exam. While chatting with the doctor, she mentions her proctoring experience and says, \"I caught someone blatantly cheating on a pension fund question. He wasn't even trying to hide it!\" Has Reddy most likely violated Standard VII(A) Conduct as Participants in CFA Institute Programs? ", "opts": ["Yes.", "No, since the last day of exams has been completed.", "No, since she did not provide specific details about the question."], "ans": "A", "expl": "\"Members and Candidates must not engage in any conduct that compromises the reputation or integrity of CFA\nInstitute or the CFA designation or the integrity, validity, or security of CFA Institute programs.\"\nCFA Institute strives to ensure that confidential information about its exams is not disclosed since this disclosure can create an unfair advantage\nfor anyone who receives the information. Therefore, Standard VII(A) prohibits Members and Candidates from disclosing any confidential\ninformation related to the exams or any behaviors that could undermine the integrity of CFA Institute or its programs.\nMembers who serve as proctors may come across confidential information, including\nspecific details about questions on the exams and the\nbroad topical areas represented in those questions.\nA proctor does not violate the Standard by simply viewing exam materials. However, sharing information about the materials is a violation. All\ninformation contained in the exams must remain confidential unless CFA Institute eventually chooses to disclose it. Until that time, revealing any\nof the information—even after the exam period has ended—constitutes a violation of the Standard (Choice B).\n(Choice C) Although Shweta Reddy has not provided specific details about the question, she violates the Standard by revealing one of the broad\ntopical areas on the exam (ie, pension funds).\nThings to remember:\nStandard VII(A) Conduct as Participants in CFA Institute Programs prohibits Members and Candidates from disclosing any confidential exam\ninformation. The Standard also prohibits any behaviors that could undermine the integrity of CFA Institute or its programs.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 138, "q": "Five years ago, Marlijn Wijngaards pled guilty to a finance-related felony. She had previously earned the CFA designation, but her charter was revoked as a result of the plea. Wijngaards has applied to CFA Institute to reinstate her charter and membership. Her application is pending. In her résumé, Wijngaards refers to herself as a \"Former CFA Charterholder.\" Does this reference violate Standard VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program? ", "opts": ["No.", "Yes, since she cannot refer to the CFA designation unless her application is successful.", "Yes, since the revocation prohibits her from indicating that she ever held the designation."], "ans": "A", "expl": "\"When referring to CFA Institute, CFA Institute membership, the CFA designation, or candidacy in the CFA\nProgram, Members and Candidates must not misrepresent or exaggerate the meaning or implications of\nmembership in CFA Institute, holding the CFA designation, or candidacy in the CFA Program.\"\nStandard VII(B) permits only CFA Institute members who have earned the CFA designation to refer to themselves as CFA charterholders.\nWijngaards' guilty plea and the subsequent revocation of her charter mean that she forfeited her right to use the designation. However, as\ninterpreted by CFA Institute, Standard VII(B) does allow former charterholders to state that they previously held the designation.\nNothing in the Code or Standards requires former charterholders to apply for reinstatement as a condition of stating that they are former\ncharterholders (Choice B). Furthermore, the Standards do not prohibit statements of objective fact. Wijngaards can verify that she once held the\nCFA designation. So long as Wijngaards's statement does not lead others to conclude that she expects to be reinstated, the Standards do not\nprevent her from stating that she previously was a charterholder (Choice C).\nThings to remember:\nStandard VII(B) allows CFA Institute members who have earned the CFA designation to refer to themselves as CFA charterholders. Former\ncharterholders are allowed to indicate that they formerly held the designation.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 139, "q": "Eric Saul, CFA, is a portfolio manager with Skye Group. He reads several social media posts from industry experts about the health benefits attributed to a new herbal tea made with rose petals. Based on these posts, Saul reviews industry publications and finds several articles that speculate herbal rose tea will be the next big beverage craze. Saul visits a senior vice president of Gamma Company, a conglomerate with a significant market share in the beverage industry, who confirms that the market for herbal tea has considerable potential. After reviewing Gamma's financial statements and public disclosures, Saul uses industry-standard financial models to determine the intrinsic value of Gamma's stock. He concludes that Gamma will introduce an herbal tea made with rose petals. Based on this conclusion, Saul buys Gamma stock for all suitable client portfolios. A few weeks later, Gamma announces a new line of herbal rose tea. Did Saul most likely violate Standard II(A) Material Nonpublic Information? ", "opts": ["No", "Yes, by purchasing Gamma for clients", "Yes, by acting on information from company management"], "ans": "A", "expl": "\"Members and Candidates who possess material nonpublic information that could affect the value of an\ninvestment must not act or cause others to act on the information.\"\nStandard II(A) Material Nonpublic Information prohibits Members and Candidates from trading on or recommending investments based on\nmaterial nonpublic information. However, analysts may piece together public and nonmaterial nonpublic data from multiple sources to form\ninvestment conclusions.\nThis research approach is referred to as the mosaic theory, and it recognizes that analysts form conclusions from various sources of information.\nConclusions formed through the mosaic process, even when based on information that would be considered material and nonpublic if it came\ndirectly from a reliable source (eg, the company), do not violate the Standard.\nIn this scenario, Eric Saul used public information, including social media posts, industry publications, and financial statements. His discussion at\nGamma Company, although nonpublic, is not material since the senior vice president simply confirmed Saul's market research and indicated\nnothing about Gamma's intentions (Choice C).\n(Choice B) Saul's purchase of Gamma did not violate the Standard since he did not use material nonpublic information to reach his conclusion\nregarding Gamma. He also treated Skye's clients in an equitable manner by purchasing the stock for all suitable client portfolios.\nThings to remember:\nStandard II(A) Material Nonpublic Information prohibits Members and Candidates from trading on or recommending investments based on material\nnonpublic information. Mosaic theory suggests an approach that uses a combination of public and nonmaterial nonpublic information to arrive at\ninvestment conclusions that is not considered a violation of the Standard.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 140, "q": "Tom Smith, CFA, is assigned a new client, Brigitte Duret, who is currently invested entirely in cash. During a brief phone conversation with Smith, Duret says: \"I'd like to earn a better return, but I don't want to take any risk. I am going to work in the Amazon rainforest for about three months, so we will meet when I am back in the US.\" Smith schedules a meeting with Duret three months from today. Smith temporarily invests Duret's assets in the firm's Conservative Portfolio since he does not want Duret to miss out on at least some of the market's performance before their meeting. Smith is the firm's leading expert on the Conservative Portfolio (shown in the table below) and has used it for many client portfolios with good results. Asset Class Percent Allocation Cash 45 Fixed Income 45 Developed Equity 5 Emerging Markets 5 According to Standard III(C) Suitability and based on the Conservative Portfolio's asset allocation, Smith most likely:", "opts": ["violates the Standard since he failed to perform due diligence before taking investment action.", "violates the Standard since he invested the client's assets before understanding the client's risk and return objectives.", "does not violate the Standard since he spoke to Duret, the investment is temporary, and it is consistent with what a prudent investor would expect."], "ans": "B", "expl": "\"When Members and Candidates are responsible for managing a portfolio to a specific mandate, strategy, or style, they must make only\ninvestment recommendations or take only investment actions that are consistent with the stated objectives and constraints of the portfolio.\"\nStandard III(C) Suitability prescribes how the manager must act when investing on behalf of the client. Suitability entails evaluating whether an\ninvestment's expected risk and return match the client's risk tolerance and return objectives. Suitability cannot determine until the manager\nknows the client's investment objectives and constraints.\n(Choice A) Standard V(A) Diligence and Reasonable Basis states that managers must diligently exercise thoroughness when taking investment\nactions. Given Smith's expertise with the Conservative Portfolio, it is reasonable to assume that the violation does not involve a lack of diligence.\n(Choice C) The Conservative Portfolio has more risk than a cash portfolio since it has exposure to equities and emerging markets. There is no\nprudent investor test to determine whether the portfolio is appropriate or not. No matter how \"temporary\" the investment is intended to be, it does\nnot excuse Smith from first assessing whether the investment is suitable for the client's risk and return objectives.\nThings to remember:\nSuitability entails evaluating whether an investment's expected risk and return match the client's risk tolerance and return objectives. Suitability\ncannot be determine until the manager knows the client's investment objectives and constraints.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 141, "q": "Annika and Boris Goncharov are siblings, CFA charterholders, and investors of Bright Sky Capital (BSC). Annika and Boris hold more than RUB 100 million each in BSC stock, and each plans to sell 10% to diversify their separate portfolios. However, BSC is a lightly traded stock, and the siblings agree that large sales would likely cause the company's stock price to decline. Annika decides to break up her sales into small batches of limit orders and sell them over multiple days to minimize the impact on the stock's price. Still, Annika's sales cause BSC's stock price to decline. Boris similarly decides to sell his holdings in batches, but he simultaneously purchases half the amount he sells to ensure the stock price is unaffected by his trades. Standard II(B) Market Manipulation is most likely violated by: ", "opts": ["only Boris.", "both Boris and Annika.", "neither Boris nor Annika."], "ans": "A", "expl": "\"Members and Candidates must not engage in practices that distort prices or artificially inflate trading volume with\nthe intent to mislead market participants.\"\nStandard II(B) Market Manipulation requires Members and Candidates to avoid any practices that deceive market participants through the\ndistortion of securities prices or trading volume. Manipulation can occur through:\ninformation-based activities (eg, issuing misleading information) and\ntransaction-based activities (eg, exaggerated trading between two accounts).\nThe Standard is not meant to prevent the use of legitimate strategies that limit a trade's impact on the market when trading large positions or low-\nliquidity stocks. The key element in determining whether the Standard is violated is whether the trading strategy is intended to deceive market\nparticipants. If the strategy is intended to deceive investors, it violates the Standard.\nIn this scenario, Annika Goncharov uses a legitimate strategy of breaking up a large position of a low-liquidity stock to limit the impact of the sale\non the price. Annika's strategy has not violated the Standard (Choice B). Boris Goncharov intends to distort market prices by making market\nparticipants believe there are more buyers of Bright Sky Capital's stock than there are. Since market participants cannot see that Boris is driving\nboth the buying and the selling activity, the trading is deceptive and has violated the Standard (Choice C).\nThings to remember:\nStandard II(B) Market Manipulation requires Members and Candidates to avoid any practices that deceive market participants through information-\nbased or transaction-based activities. The Standard does not prevent the use of legitimate strategies that limit market impact. Strategies that are\nmeant to deceive market participants violate the Standard.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 142, "q": "In 20X6, Shepherd Financial, Inc. (SFI), headed by founder Lillian Shepherd, CFA, is engaged by the Green Fund to manage part of the fund's assets. SFI, with Shepherd as the advisor for the account, is one of 10 subadvisors hired by the Green Fund to select securities. Two years later, in 20X8, the Green Fund terminates SFI. In 20X9, Shepherd delivers performance reports to prospective clients that include the Green Fund's historical gross performance. The reports also include the Green Fund's fee schedule and disclosures that SFI was one member of a 10- subadvisor team for the Green Fund from 20X6 to 20X8. According to Standard III(D) Performance Presentation, does Shepherd most likely violate the Standard? ", "opts": ["No.", "Yes, since she reports the Green Fund's gross performance.", "Yes, since she claims performance for a fund SFI no longer advises."], "ans": "A", "expl": "\"When communicating investment performance information, Members and Candidates must make reasonable\nefforts to ensure that it is fair, accurate, and complete.\"\nTo comply with Standard III(D) Performance Presentation, Members and Candidates must use credible return data when preparing performance\ninformation for current or potential clients. Clients must receive performance information that is free from distorted data that may be misleading.\nTo comply with the Standard, Members and Candidates need to fully disclose exceptions and avoid any disclosures that may misrepresent\nperformance.\nShepherd accurately portrays her work with the Green Fund and does not mislead her clients, who are made aware that she worked for the Green\nFund from 20X6 to 20X8.\n(Choice B) Shepherd does not violate the Standard by reporting the Green Fund's performance gross of fees since she discloses its fee\nschedule.\n(Choice C) An advisor must report an account's returns even if the advisor is no longer associated with that account. Otherwise, the advisor\nmight conceal accounts that performed poorly, leading to the advisor's termination.\nThings to remember:\nMembers and Candidates must use credible performance data when reporting performance information. To comply with the Standard, Members\nand Candidates should supply potential investors and clients with complete information regarding the performance of funds they served as\nadvisors. This includes fee schedule and the historical context of their participation with the fund.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 143, "q": "Stephanie Williams, CFA, is the portfolio manager of the Lantern Latin American Equity Fund (LLAEF). LLAEF is a mutual fund that invests exclusively in stocks listed in Central and South America. While attending her daughter's gymnastics practice, Williams discusses LLAEF with Jeffrey Jones, who also has a daughter in the class. Jones states that he is a conservative investor, investing primarily in a balanced fund, and has never considered investing in Latin American equities before. Williams gives a very optimistic assessment of the economic conditions in the region and states that Latin American equities are among the most undervalued globally. Williams says, \"I believe Latin America is likely to be the best performing emerging market region in the world over the next few years. This fund is a 'no brainer' and adds great diversification benefits to any portfolio.\" Has Williams most likely violated Standard III(C) Suitability? ", "opts": ["No", "Yes, as Williams recommended a portfolio allocation", "Yes, as Williams recommended a specific investment"], "ans": "A", "expl": "\"When Members and Candidates are responsible for managing a portfolio to a specific mandate, strategy, or style, they must\nmake only investment recommendations or take only investment actions that are consistent with the stated objectives and\nconstraints of the portfolio.\"\nStandard III(C) Suitability addresses Members' and Candidates' responsibilities to assess the suitability of investments for each client. Members\nand Candidates that manage a pooled investment vehicle to a specific investment mandate have a responsibility to ensure the suitability of\ninvestments for the fund, specifically making sure investments adhere to the mandate. Members and Candidates cannot be expected to ensure\nsuitability for every investor in the fund; that is the responsibility of the investor or investor's advisor.\nIn this instance, Stephanie Williams is an institutional portfolio manager, so her duty is to ensure suitability to the fund's mandate. Since she is not\nin an advisory relationship with Jeffrey Jones, or any investor, she is not responsible for assessing the suitability of the fund for his investment\nportfolio (Choices B and C). Therefore, Williams did not violate the Standard.\nThings to remember:\nMembers and Candidates that manage to a specific investment mandate must manage in accordance with that mandate. Members and\nCandidates that are not in an advisory relationship with a client are not responsible for determining the suitability of the investment mandate.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 144, "q": "Soomin Yoo, CFA, is helping grade the most recent Level 3 exam. At dinner one evening, she discusses the grading process with a friend, Minsoo Han, CFA, who is not participating in the grading process. Yoo states \"I'm surprised how many people are missing the question on fixed income investing strategies. It didn't come across to me as that difficult.\" Han responds \"If that's the case, candidates might be in trouble. I read on a social media post that the multiple-choice section also had more fixed income questions than in other recent exams.\" According to the Standards, is it most likely that:", "opts": ["both Yoo and Han have violated the Standards.", "Yoo has violated the Standards but Han has not.", "Han has violated the Standards but Yoo has not."], "ans": "B", "expl": "\"Members and Candidates must not engage in any conduct that compromises the reputation or integrity of CFA\nInstitute or the CFA designation or the integrity, validity, or security of CFA Institute programs.\"\nStandard VII(A) prohibits Members and Candidates from engaging in behavior that undermines the integrity of CFA Institute, its programs, and the\npublic's confidence in the level of merit needed to achieve a CFA charter. To uphold the integrity of the charter, the CFA Institute takes care to\nensure that confidential information about exams is not shared by anyone. For Members and Candidates, sharing such information is a violation\nof the Standard.\nMembers may not disclose:\nquestions that are set to appear on the exam or are under consideration,\nany parts of the deliberation process related to the exam, or\ninformation related to the grading of questions.\nGraders may not share information with anyone outside of the development or grading process. Since Han is not part of the grading process,\nYoo may not discuss any information relating to the grading of questions, whether it is specific details or general information. By doing so, she\nviolates the Standard. If this information were shared with other participants in the grading process, it would not violate the Standard.\n(Choices A and C) Han does not violate the Standard since he is not part of the exam's development, administering, or grading process and\ntherefore does not know any information to disclose. His only source of information is a social media post.\nThings to remember:\nStandard VII(A) prohibits Members and Candidates from engaging in behavior that undermines the integrity of CFA Institute, its programs, and the\npublic's confidence in the level of merit needed to achieve a CFA charter. Members may not disclose information related to the grading of\nquestions to anyone outside of the grading process.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 145, "q": "Vladimir Ivanov, CFA, is the portfolio manager of a separately managed account (SMA) that invests equally in 20 different large-cap international value stocks. Most of Ivanov's personal investments are invested in the same strategy. Since Ivanov's twin daughters are enrolling in college this year, he needs to sell a portion of his holdings to pay for their tuition. To generate a tax loss, Ivanov sells the entire position of one holding instead of selling equal portions of all 20 positions in his account. According to Standard VI(B) Priority of Transactions, did Ivanov most likely comply with the Standard?", "opts": ["Yes", "No, by not informing his clients before the trade", "No, by entirely divesting from a holding that is still held in client accounts"], "ans": "A", "expl": "\"Investment transactions for clients and employers must have priority over investment transactions in which a\nMember or Candidate is the beneficial owner.\"\nStandard VI(B) Priority of Transactions requires members and candidates to place clients' and employers' financial interests before their own\nwhen investing. It is not uncommon for a member or candidate to transact in the same investments as a client or even alongside the client. This\nsituation does not violate the Standard provided that:\nthe client is not disadvantaged by the trade,\nthe member or candidate does not benefit from the client transactions, and\nthe member or candidate adheres to all applicable regulatory requirements.\nLikewise, a manager has no obligation to invest personal funds in the same strategy as clients do since the manager may have different risk and\nreturn objectives and different constraints (eg, liquidity needs) than the clients.\nIn this scenario, Ivanov complied with the Standard. Ivanov has no specific obligation to inform clients of his personal transactions (Choice B).\nHis sale ran counter to the long-term advice given to clients, but since he did not violate the guidelines above, no infringement occurred (Choice\nC).\nThings to remember:\nStandard VI(B) requires members and candidates to place clients' and employers' financial interests before their own with respect to investment\ntransactions. The clients in this scenario were not disadvantaged, so there was no violation of the Standard.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 146, "q": "Erik Johansen, CFA, and Claire Olsen, CFA, decide to start their own fund. They create a marketing brochure that includes the following: \"Claire Olsen, CFA, a self-employed investor, has developed a proprietary model focused on growth stocks. The model achieved a simulated annualized return of 15% over the past five years.\" \"Erik Johansen, CFA, averaged a 12% annual return from 20X1 to 20X7 while working as a portfolio manager at his prior employer, Henderson Bank.\" Johansen received written approval from Henderson to use the return data. Based on this information, have Johansen and Olsen most likely violated Standard III(D) Performance Presentation? ", "opts": ["No.", "Yes, by using Johansen's return data from a prior employer.", "Yes, by using the simulated returns of Olsen's model and not the actual performance history."], "ans": "A", "expl": "\"When communicating investment performance information, Members and Candidates must make reasonable efforts to ensure\nthat it is fair, accurate, and complete.\"\nStandard III(D) Performance Presentation requires Members and Candidates to provide a fair, accurate, and complete record of their\nperformance. To avoid misrepresentation, a manager, firm, portfolio, or composite must provide full disclosure of all aspects of performance to all\nclients, prospective clients, and prospective employers.\nIf the details are fully disclosed, the Standard allows the presentation of performance information from prior employers, accounts managed by\nmultiple people, and simulations. Performance data from a prior employer cannot be used without written permission from the employer. In this\nscenario, Erik Johansen receives written approval from his prior employer, Henderson Bank, before presenting data on the returns he achieved\nthere as a portfolio manager. The marketing brochure fully discloses both this background and the fact that Claire Olsen's model returns are\nsimulated, so the Standard is not being violated (Choices B and C).\nThings to remember:\nPerformance reporting should communicate fair, accurate, and complete information. Standard III(D) Performance Presentation calls for providing\nfull disclosure of all aspects of performance to avoid misrepresentation.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 147, "q": "Aline Costa, CFA, is a financial advisor for Solar Bank. At a conference, Costa meets Juanita Carvalho, a portfolio manager for Lunar Financial. Carvalho tells Costa about a propriety quantitative model developed by Lunar that aims to predict interest rate changes. Costa reads Lunar's sales literature on the model to understand how it works, its assumptions, and its testing parameters, which included both extreme positive and negative scenarios. Of the following, Costa can most appropriately begin integrating the model into her research process:", "opts": ["immediately.", "after thoroughly testing the model herself.", "after taking the time to learn the technical aspects of the model."], "ans": "B", "expl": "\"Members and Candidates must:\n1. Exercise diligence, independence, and thoroughness in analyzing investments, making investment\nrecommendations, and taking investment actions.\n2. Have a reasonable and adequate basis, supported by appropriate research and investigation, for any\ninvestment analysis, recommendation, or action.\"\nStandard V(A) Diligence and Reasonable Basis requires Members and Candidates that are advisors to conduct thorough due diligence when\nanalyzing investments. The Standard requires that the due diligence on quantitative models be as thorough as all other aspects of the\ninvestment recommendation process. The Member or Candidate must:\nunderstand how the model works and be able to explain it to clients,\nunderstand the model's assumptions and limitations, and\nthoroughly test the model.\nEven if the model was already tested by third-party developers, Members and Candidates should test the model before incorporating it into their\nresearch process or recommendations. This ensures that the model was properly tested (Choice A). Data used in testing should encompass all\nperformance and volatility expectations.\n(Choice C) The model's developers must understand all the technical aspects of the model (eg, equations, variables). However, users are not\nrequired to have as deep an understanding, as long as they understand its assumptions and limitations and are able to explain the model to\nclients.\nThings to remember:\nWhen Members and Candidates use quantitative models as part of their investment process, the Standard requires that the due diligence on the\nmodel be as thorough as all other aspects of the process. The model's users must understand how the model works well enough to explain it to\nclients and to thoroughly test the model.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 148, "q": "Kathy Harriet, CFA, is the chief investment officer at PPG Investments. Harriet hosts a video meeting where she speaks to all employees. During her live presentation, Harriet discusses PPG's top holdings, including Responsive Market Tech, Inc. (RMT). Harriet explains why RMT is a top holding: existing barriers to entry and the current competitive landscape create a rare opportunity for accelerated earnings growth. Sidney Fletcher, CFA and PPG employee, acts on Harriet's explanation and purchases 100,000 shares of RMT for PPG's trading account during the meeting. After Fletcher's trades, RMT's price has not changed. According to PPG's policies, Harriet sends the recorded meeting and its transcript to clients and employees right after the meeting. According to Standard VI(B) Priority of Transactions, did Fletcher most likely comply with the Standard? ", "opts": ["No.", "Yes, since Fletcher did not impact RMT's price.", "Yes, since Harriet sent the transcript directly after the meeting."], "ans": "A", "expl": "Investment transactions for clients and employers must have priority over investment transactions in which a\nMember or Candidate is the beneficial owner\nStandard VI(B) Priority of Transactions requires Members and Candidates to place clients' interests ahead of their own. The Standard\nmandates that, for a given security, the firm's or employee's trades must be placed after client trades. There is no specific waiting period, but\nfirms must give clients a reasonable amount of time to act on recommendations.\nSidney Fletcher violated the Standard by trading Responsive Market Tech, Inc. for the firm's account before PPG Investments' clients had time to\nact upon Kathy Harriet's advice. Fletcher should have postponed trading until clients could reasonably have acted on Harriet's recommendation.\n(Choice B) The resulting price after Fletcher's trade does not mitigate his violation. Fletcher is not exempted from violating the Standard just for\nhaving no price impact.\n(Choice C) Harriet complied by delivering the meeting transcript and her recommendation as soon as possible, but Fletcher should have placed\nthe firm's trades after clients could reasonably be expected to receive and use the recommendation.\nThings to remember:\nStandard VI(B) Priority of Transactions governs how Members and Candidates place clients' interests ahead of their own. For a given security, a\nfirm's or an employee's trades must be placed after clients' trades. Clients must be given a reasonable amount of time to act on a\nrecommendation before a firm may trade for itself.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 149, "q": "Rahul Agarwal, CFA, is the Chief Investment Officer of Bagh Capital. He is having lunch with a group of prospective clients and passes out a summary of the company's performance. The summary mentions that the firm was able to generate returns of 25% last year, 18% annualized over the past three years, and 15% annualized over the past five years. The returns exclude several portfolios that Bagh closed last year due to underperformance. The summary does not mention the exclusions but notes that it is limited in nature and that a detailed presentation is available upon request. By distributing this summary to clients, does Agarwal most likely violate Standard III(D) Performance Presentation?", "opts": ["No", "Yes, by excluding the closed portfolios", "Yes, by distributing only the summary and not the detailed presentation"], "ans": "B", "expl": "\"When communicating investment performance information, Members and Candidates must make reasonable\nefforts to ensure that this information is fair, accurate, and complete.\"\nStandard III(D) Performance Presentation requires Members and Candidates to provide a fair, accurate, and complete performance record.\nMisrepresenting performance is a violation of the Standard, whether it is in the measurement or presentation. Providing a complete performance\nrecord entails including all pertinent portfolios or composites when calculating the performance of a firm.\nRahul Agarwal violates the Standard by excluding terminated portfolios from the firm's performance and not making any note that they were\nexcluded (Choice A). By excluding terminated portfolios, Agarwal misrepresents Bagh Capital's performance and fails to provide the prospective\nclients with an accurate and complete picture of historical returns.\n(Choice C) Distributing a summary of performance is allowed under the Standard. Best practices call for summaries to include a note about the\nlimited nature of the presentation.\nThings to remember:\nPerformance reporting should communicate fair, accurate, and complete information. This entails including all pertinent portfolios or composites\nwhen calculating the performance of a firm. By excluding terminated portfolios, Agarwal violates the Standard by deliberately presenting\nincomplete information.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 150, "q": "Bull Advisors, based in Country Y, expanded its operations to Country X, where securities laws and regulations are less strict than either CFA Institute's Code and Standards or Country Y's laws and regulations. One of Bull's advisors, Joseph Telluci, CFA, travels to Country X to meet with a client. In a rush to meet with the client before she leaves for vacation, Telluci does not familiarize himself with Country X's securities laws and regulations. After the meeting, he begins the investment management process on behalf of the client based on the laws, regulations, and rules of Country Y and the Code and Standards. Has Telluci most likely violated Standard I(A) Knowledge of the Law?", "opts": ["Yes.", "No, since he follows the laws of Country Y.", "No, since he adheres to CFA Institute's Standards of Professional Conduct."], "ans": "A", "expl": "\"Members and Candidates must understand and comply with all applicable laws, rules, and regulations (including the CFA Institute Code of Ethics\nand Standards of Professional Conduct) of any government, regulatory organization, licensing agency, or professional association governing their\nprofessional activities. In the event of conflict, Members and Candidates must comply with the more strict law, rule, or regulation. Members and\nCandidates must not knowingly participate or assist in and must dissociate from any violation of such laws, rules, or regulations.\"\nStandard I(A) Knowledge of the Law requires members and candidates to understand local laws. When members or candidates do business\nin more than one country, they are required to know and understand both the Standards of Professional Conduct and the laws and regulations\nof each country. In all professional activities, they must follow the strictest of the applicable rules.\nTelluci does business in both Country Y (where Bull Advisors is based) and Country X (where the new client resides). Before doing business with\nthe client, Telluci must be familiar with the set of securities laws and regulations in Country X—in addition to those of Country Y and the Code and\nStandards—so that he knows which rules to apply if a conflict arises. Without this knowledge, Telluci could not make an informed judgment.\n(Choices B and C) Although the rules of Country X are less strict than those of Country Y or the Code and Standards, Telluci violated Standard\nI(A) by not familiarizing himself with and understanding all the applicable laws and regulations.\nThings to remember:\nStandard I(A) Knowledge of the Law requires members and candidates to understand the laws and regulations in any country where they engage\nin professional activities, as well as the Code and Standards. In all cases, the strictest of these laws, rules, and regulations must be followed.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 151, "q": "Sarah Cohen, CFA, is a portfolio manager at Mountain Peak Capital (MPC) and manages the firm's multi-cap equity growth fund. Cohen often directs the firm's trading desk to place orders through certain brokerage firms that have assisted her in idea generation or in investment decision- making. Cohen has recently agreed to enter into a new soft dollar relationship with Large-Cap Capital (LCC) for research services. Cohen sends a large order for a thinly traded small-cap stock to the firm's trading desk. Cohen usually prefers small-cap stock trades to be directed to Small-Cap Specialists, Inc. (SCSI), as they are better able to source liquidity (ie, find buyers and sellers) to fill these trades than most of their competitors. The trader suggests the order be routed through LCC to help satisfy MPC's new soft dollar commitment. LCC can execute the order, but it would likely be at market prices, and the large order size will almost certainly negatively affect the execution. After discussing the situation with the firm's trader, Cohen instructs the trader to send the order to LCC. Cohen most likely violates Standard III(A) Loyalty, Prudence, and Care, by:", "opts":
