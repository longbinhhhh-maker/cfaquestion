0X3 5% 2% −4% 20X4 13% 12% 8% 20X5 24% 22% 13% 20X6 5% 5% 4% 20X7 16% 14% 6% In the brochure, Murphy writes, \"Star Capital has consistently outperformed its benchmark on a risk-adjusted basis and has yet to have a loss in any year. Clients can expect more of the same next year.\" Which part of Murphy's statements most likely violates Standard I(C) Misrepresentation? Stating that:", "opts": ["\"Star Capital…has yet to have a loss in any year.\"", "\"Clients can expect more of the same next year.\"", "\"Star Capital has consistently outperformed its benchmark...\""], "ans": "B", "expl": "\"Members and Candidates must not knowingly make any misrepresentations relating to investment\nanalysis, recommendations, actions, or other professional activities.\"\nStandard I(C) Misrepresentation focuses on avoiding both the use of false or misleading statements and the omission of facts, which can\nundermine investor trust. This includes statements that guarantee clients a level of future performance or a specific return on risky investments\n(eg, stocks). The Standard applies to information prepared\nas a verbal or published statement that is intended\nfor clients, colleagues, or the public.\nIn the marketing brochure, Murphy violates the Standard by implying that clients of Star Capital can expect to receive positive returns and to\noutperform the market next year. Since the hedge fund's investments consist of risky assets, it is impossible for Murphy to know whether Star\nCapital can achieve these targets. Past results are not guarantees of future performance and should not be presented as such.\n(Choice A) Stating that Star Capital has not had a loss is not misrepresentation since it is a factual statement with no omissions.\n(Choice C) Stating that returns have consistently outperformed the benchmark on a risk-adjusted basis is not misrepresentation since it, too, is a\nfactual statement with no omissions.\nThings to remember:\nStandard I(C) Misrepresentation prohibits both the use of false or misleading statements and the omission of facts in any verbal or published\nstatement to clients, colleagues, or the public. This includes statements that guarantee clients a specific performance on risky investments.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 91, "q": "Jessica Meyer, CFA, is a portfolio manager at a large life insurance company. Meyer is a member of the investment committee, which collectively makes investment decisions for the company's investment portfolio. Meyer is the team's emerging market specialist and was recently assigned to analyze the investment prospects of a high-yield debt offering backed by oil export revenues in an emerging market country. Meyer was tasked with this assignment as she is the most qualified to do the analysis, but she personally believes the insurance portfolio should not invest in energy companies for environmental reasons. After considering all factors, in her final report to the committee, Meyer recommends not investing due to the considerable risk involved. After long and thorough deliberation, the committee votes to invest in the debt offering, despite the acknowledged risk. A report is created detailing the discussion and listing all committee members present for the due diligence file. Based on Standard V(A) Diligence and Reasonable Basis, Meyer should most likely: ", "opts": ["do nothing.", "disassociate herself from the report, as it does not align with her personal beliefs.", "disassociate herself from the report, as it does not reflect her true investment opinion."], "ans": "A", "expl": "\"Members and Candidates must:\n1. Exercise diligence, independence, and thoroughness in analyzing investments, making\ninvestment recommendations, and taking investment actions.\n2. Have a reasonable and adequate basis, supported by appropriate research and\ninvestigation, for any investment analysis, recommendation, or action.\"\nStandard V(A) Diligence and Reasonable Basis requires all investment analysis done by Members and Candidates to be diligent and thorough.\nReasonable efforts must be made to ensure all pertinent issues are considered when issuing recommendations.\nWhen investment analysis and recommendations are done by a group, not all members of the group must agree on the conclusion. Those with\ndissenting opinions:\nmay keep their names on the report, and\nare not required to disassociate if they disagree with colleagues so long as they believe the group's conclusion has a reasonable and\nadequate basis.\nIn this scenario, although Jessica Meyer does not agree with its conclusion, the group's process was reasonable and adequate (ie, \"long and\nthorough deliberation\"). The fact that the group's decision conflicts with her personal beliefs is an inadequate basis for disassociating. As such,\nthere is no need for Meyer to disassociate (Choices B and C).\nThings to remember:\nStandard V(A) Diligence and Reasonable Basis requires all investment analysis done by Members and Candidates to be researched thoroughly.\nWhen investment analysis and recommendations are done by a group, those with dissenting opinions do not need to disassociate if they believe\nthe group's conclusion has a reasonable and adequate basis.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 92, "q": "Leslie Gutkowski, CFA, specializes in managing US equity portfolios at Sawa Investments. She adds a new Sawa Emerging Markets Portfolio and decides to outsource its management. She knows many external managers but selects Akiko Investments since they manage emerging markets portfolios for the lowest cost. She dismisses other factors since she strongly believes that the lowest cost is the most important consideration. With respect to Standard V(A) Diligence and Reasonable Basis, Gutkowski most likely: ", "opts": ["violates the Standard by basing the selection of Akiko only on its fee structure.", "violates the Standard by relying on Akiko to provide external portfolio management.", "does not violate the Standard since selecting the least expensive manager is in her clients' best interest."], "ans": "A", "expl": "\"Members and Candidates must:\n1. Exercise diligence, independence, and thoroughness in analyzing investments, making investment\nrecommendations, and taking investment actions.\n2. Have a reasonable and adequate basis, supported by appropriate research and investigation, for any\ninvestment analysis, recommendation, or action.\"\nStandard V(A) Diligence and Reasonable Basis requires members and candidates to exercise diligence and thoroughness when making\ninvestment decisions. An example of an investment decision is a review of external managers. Managers commonly hire external managers (ie,\noutsource) but must conduct a diligent review before doing so.\nHere, Gutkowski selects Akiko by considering only the fee structure and dismisses all other factors (eg, risk and return, manager tenure).\nGutkowski fails to exercise diligence and thoroughness in taking an investment action; this violates the Standard (Choice C).\n(Choice B) The Standard does not preclude members and candidates from hiring external managers; in fact, this practice is common. When it\ndoes occur, the hiring manager must conduct a diligent review of the external manager.\nThings to remember:\nMembers and candidates must exercise diligence and thoroughness in taking investment actions. One example of an investment action is the\nselection of an external manager. Using only one investment criteria to evaluate an external manager fails to demonstrate diligence and\nthoroughness.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 93, "q": "Michael Woods, CFA, is a sell-side analyst at a large brokerage firm. Woods previously published a \"buy\" rating on Mira Medical but believes the stock is now overvalued and submits a downgrade report to his compliance department for approval. Sally Silva, an influential buy-side portfolio manager at a large investment firm, calls Woods to discuss Mira's investment prospects. Woods does not mention the impending downgrade, but the tone of the conversation leads Silva to suspect he is likely to downgrade Mira. Silva comments that Mira is her largest holding and that \"it would be very unfortunate\" if the stock were downgraded before year end. She mentions conversations with other sell-side analysts that support higher price targets on Mira. Silva then says that a downgrade might shake her confidence in Woods, that others might be doing a better job, and she might take her business elsewhere. After this conversation, Woods postpones his downgrade, preferring to think for a while and carefully consider all the relevant factors. Woods downgrades Mira Medical a few weeks later, during the first week of the new year. According to Standard I(B) Independence and Objectivity, Woods:", "opts": ["did not violate the Standard.", "violated the Standard by delaying publication of the downgrade.", "violated the Standard by tipping off the portfolio manager that a downgrade was coming."], "ans": "B", "expl": "\"Members and Candidates must use reasonable care and judgment to achieve and maintain independence and objectivity in\ntheir professional activities. Members and Candidates must not offer, solicit, or accept any gift, benefit, compensation, or\nconsideration that reasonably could be expected to compromise their own or another's independence and objectivity.\"\nStandard I(B) Independence and Objectivity focuses on avoiding any actions that would compromise the independence and objectivity of\nan investment professional. A sell-side analyst is often pressured by buy-side analysts and portfolio managers to express views or take actions\ninconsistent with the sell-side analyst's honest opinion. Since buy-side firms are the \"customer,\" they wield considerable influence over sell-side\nanalysts, who are often directly compensated based on the amount of trading revenue they generate for their firms.\nIn this scenario, Michael Woods has decided to downgrade Mira Medical and submitted his report for compliance approval. A buy-side manager,\nSally Silva, threatens to send business elsewhere, which would likely affect Woods' compensation. By acquiescing to Silva's remarks and\ndelaying the downgrade until the new year, Woods compromises his independence and objectivity and violates the Standard (Choice A).\n(Choice C) As Wood did not disclose the impending downgrade, he did not violate the Standards. In such situations, a sell-side analyst must be\ncareful not to disclose any current opinions that may differ from what has been published and disseminated fairly to all clients.\nThings to remember:\nStandard I(B) Independence and Objectivity mandates that Members and Candidates avoid actions that might compromise their own or another's\nindependence and objectivity. A sell-side analyst is often pressured by buy-side analysts and portfolio managers to express views or take actions\ninconsistent with the sell-side analyst's honest opinion.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 94, "q": "Oscar Serrano, CFA, supervises an analyst team and has the following conversations about the company's compliance efforts with two team members: To Arthur Canto, he says, \"As your supervisor, I should make a reasonable effort to detect unethical behavior, since if I failed to detect such behavior, I would have violated the CFA Standards of Professional Conduct.\" To Maria Alverez, he says, \"I must have an effective compliance system that helps us prevent and detect ethical violations. This will also allow you to better understand your responsibilities.\" According to Standard IV(C) Responsibilities of Supervisors, which of Serrano's conversations best describes a requirement for supervisors managing the employees under their authority? Serrano's conversation with:", "opts": ["only Canto", "only Alverez", "both Canto and Alverez"], "ans": "B", "expl": "\"Members and Candidates must make reasonable efforts to ensure that anyone subject to their supervision or authority complies with applicable\nlaws, rules, regulations, and the Code and Standards.\"\nStandard IV(C) Responsibilities of Supervisors notes that members and candidates with supervisory responsibilities must understand the\ncharacteristics of an effective compliance system. An acceptable system has comprehensive procedures and policies that are:\nproperly documented and\nappropriately conveyed to all pertinent employees.\nAlso, employees' conduct should be reviewed regularly to ensure the rules are followed.\nSupervisors' responsibilities include detecting and preventing violations and developing effective compliance systems to improve their\nsubordinates' understanding of ethical behavior. Promoting education and training is one way to fulfill this responsibility.\n(Choices A and C) Supervisors should make reasonable efforts to detect unethical behavior; however, failing to do so does not constitute a\nviolation of the Standards of Professional Conduct or its recommendations.\nThings to remember:\nThe Standards of Professional Conduct (Standards) require supervisors to actively assist employees' compliance with laws, regulations, the Code\nof Ethics, and the Standards. Supervisors' responsibilities include detecting and preventing violations and developing effective compliance\nsystems to improve their subordinates' understanding of ethical behavior.\nRecommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 95, "q": "Win Minjun is a CFA candidate preparing for the Level I exam. On the morning of the exam, before taking the test, Minjun receives an email from a close friend who already took the test, stating that \"I studied so much and still couldn't pass this ridiculous test. I didn't even finish in the afternoon.\" After entering the exam room, Minjun wishes the other candidates good luck. During the exam, Minjun says aloud, in frustration, \"NPV is always better than IRR,\" which is a correct answer. After the exam, Minjun posts on a public blog, \"There were numerous questions regarding Priority of Transactions in the Ethics section. Make sure to know those topics well.\" According to Standard VII(A) Responsibilities, as a CFA Institute Member or a CFA Candidate, Minjun most likely violated the Standard: ", "opts": ["during and after the exam.", "before and after the exam.", "before and during the exam."], "ans": "A", "expl": "\"Members and Candidates must not engage in any conduct that compromises the reputation or integrity of CFA Institute or the CFA designation or\nthe integrity, validity, or security of CFA Institute programs.\"\nStandard VII(A) Responsibilities as a CFA Institute Member or a CFA Candidate identifies conduct that damages the public's trust. Any behavior\n(eg, cheating) that would discredit the CFA Program violates this Standard.\nCandidates taking the exam must sign the Candidate Pledge, which identifies behaviors that are prohibited before, during, and after the test,\nincluding:\nsharing actual exam information about questions, broad topic areas, or formulas, and\nnot following the exam rules or the proctors' instructions.\nIn this scenario, Minjun violates the Standard by talking during the exam and giving test information to other candidates. This compromises the\nexam's validity for all candidates in the room with Minjun. Also, Minjun violates the Standard by sharing actual exam information about the Ethics\ntopic area after the exam.\n(Choices B and C) Reading an opinion about the exam's difficulty before taking the exam does not violate the Standard. Candidates may\nexpress their opinions about the exam since opinions are not considered actual exam information.\nThings to remember:\nStandard VII(A) Responsibilities as a CFA Institute Member or a CFA Candidate identifies behavior that discredits the CFA Program. Candidates\nmust sign the Candidate Pledge before taking the exam, attesting that they have not shared and will not share confidential exam materials before,\nduring, or after the test.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 96, "q": "Julia Steinhardt, CFA, manages clients' assets as sole proprietor at Steinhardt Capital Advisors (SCA). Steinhardt is generally conservative in her approach, investing only in traditional asset classes of domestic stocks, bonds, and cash. During a recent annual portfolio review, one of Steinhardt's high-net-worth clients with a large account states he wants to add a more aggressive investing option to his portfolio, given his ample risk tolerance. Alarmed about potentially losing the client's business, Steinhardt updates the client's investment policy statement (IPS) and agrees to allocate a portion of the client's portfolio to investments in derivatives. At their next meeting, Steinhardt explains that she developed a new strategy that equally weights her ten best ideas using long-term call options, and then back-tested the new strategy's performance over the past five years. As the stock market has been in a consistent uptrend during the back-test period, Steinhardt emphasizes the spectacular pro forma performance of the model portfolio and stresses how this investment would make a great addition to the client's portfolio. According to Standard V(B) Communication with Clients and Prospective Clients, Steinhardt most likely violated the Standard by failing to:", "opts": ["sufficiently describe how the new strategy works.", "discuss the limitations and risks associated with the strategy.", "communicate that the original investment policy statement was more appropriate."], "ans": "B", "expl": "\"Members and Candidates must:\nDisclose to clients and prospective clients significant limitations and risks associated with the investment\nprocess.\"\nStandard V(B) Communication with Clients and Prospective Clients requires Members and Candidates to discuss the limitations and risks of\nrecommendations of an investment strategy or process. This is especially imperative when the investments are in new or unusual financial\ninstruments with which the client may be unfamiliar.\nTo comply with the Standard, Members and Candidates must communicate with clients in plain language. The communication must also convey\nenough information that clients can recognize the risks and limitations of the recommendation. When explaining key attributes of an investment\nrecommendation, Members and Candidates must use reasonable judgment in providing the appropriate level of transparency without unnecessary\nor confusing details of the strategy.\nIn this scenario, Steinhardt communicated the positive pro forma performance data, but she failed to discuss the significant risks of the strategy. A\nstrategy consisting of only long-term options is aggressive and the risk of loss is very high, particularly in a different market environment (eg, bear\nmarket).\n(Choice A) The basic format, structure, and security selection process of the investment was sufficiently described, meeting the Standard.\n(Choice C) Advisors must not impose their own biases (ie, conservatism) on the client. In this instance, after discussion with Steinhardt, the client\nspecifically requested an IPS with a greater risk/reward profile. Since the high-net-worth client can be assumed to have adequate risk tolerance,\nthere is no indication that the original IPS was more appropriate.\nThings to remember:\nStandard V(B) Communication with Clients and Prospective Clients requires Members and Candidates to discuss the limitations and risks of\nrecommendations of an investment strategy or process.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 97, "q": "Hiroshi Tanaka, CFA, is a research analyst for Fuji Investments and covers the insurance sector. Due to client demand, Tanaka's manager asks him to initiate coverage on insurance brokers. Tanaka owns stock in Union Insurance, the country's second-largest public insurance broker, in a long-term investment account for his daughter's education. He cannot sell shares from the account since it is managed by a third party. Tanaka's wife is on the Union board of directors. To comply with the Code and Standards, Tanaka should most appropriately disclose to Fuji:", "opts": ["only his stock holdings in Union.", "only his wife's board position with Union.", "both his stock holdings and his wife's board position."], "ans": "C", "expl": "\"Members and Candidates must make full and fair disclosure of all matters that could reasonably be expected to\nimpair their independence and objectivity or interfere with respective duties to their clients, prospective clients,\nand employer. Members and Candidates must ensure that such disclosures are prominent, are delivered in plain\nlanguage, and communicate the relevant information effectively.\"\nStandard VI(A) Disclosure of Conflicts aims to protect employers and clients by promoting transparency, allowing them to evaluate whether a\nMember or Candidate is acting independently and objectively when offering investment advice or recommendations. When a conflict can be\nreasonably viewed as interfering with a Member's or Candidate's ability to conduct unbiased investment evaluations, the employer and\nclients must be informed on all pertinent details of the conflict.\nFor employers, disclosure provides the opportunity to decide whether the Member's or Candidate's objectivity might be impaired and then take\nproper actions to limit or prevent conflicts of interest. Both financial and nonfinancial conflicts must be disclosed.\nIn this scenario, Hiroshi Tanaka's ownership of Union Insurance stock represents a conflict of interest. Even though he cannot sell the stock, he\nstill benefits from the capital appreciation; thus, the holdings must be disclosed to Fuji Investments. Tanaka's wife's position on the Union board of\ndirectors represents a potential conflict of interest. Even though he is not on the board, his wife's role gives him incentive to see Union succeed;\nthus, her position also must be disclosed to Fuji (Choices A and B).\nThings to remember:\nWhen a conflict can be reasonably viewed as interfering with a Member's or Candidate's ability to conduct unbiased investment evaluations, the\nemployer and clients must be informed of the conflict. For employers, disclosure provides the opportunity to decide whether the Member's or\nCandidate's objectivity might be impaired and take proper actions to limit or prevent conflicts of interest.\nRecommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 98, "q": "Aisha Nazari, CFA, manages a small-cap stock portfolio for Sanctuary Capital. As the portfolio has grown, Nazari has noticed that trading costs are increasing due to low liquidity in small-cap stocks. To reduce these costs, she adds derivatives that mimic the returns of the small-cap stocks she invests in. Nazari updates the portfolio's information on Sanctuary's social media page, which is used for marketing to prospective clients. Existing clients can access the social media page, but it generally is not used to communicate with them. Nazari does not use any other communication to tell existing clients about these changes. Nazari:", "opts": ["does not violate the Standards.", "violates the Standards by not communicating separately with existing clients.", "violates the Standards by using social media to communicate an investment strategy."], "ans": "B", "expl": "\"Members and Candidates must:\n1. Disclose to clients and prospective clients the basic format and general principles of the investment\nprocesses they use to analyze investments, select securities, and construct portfolios and must promptly\ndisclose any changes that might materially affect those processes.\n2. Disclose to clients and prospective clients significant limitations and risks associated with the investment\nprocess.\"\nStandard V(B) Communication with Clients and Prospective Clients requires Members and Candidates to inform both clients and prospective\nclients about the limitations and risks of an asset or investment process. The communications must use language that is easy for clients to\nunderstand but that also conveys enough information for them to recognize the relevant risks and limitations.\nFurther, any changes in the general characteristics of an asset or investment process (eg, strategies, risks) also must be disclosed.\nCommunications about changes allow clients to decide whether the asset or process still aligns with their risk and return objectives after the\nchanges are made. The addition of derivatives to a portfolio changes its risk profile; this is important information for all clients to know.\nCommunicating investment details or changes in investment characteristics through social media is not a violation of Standard V(B) (Choice C).\nHowever, if a social media platform is used, special care must be taken to ensure all clients receive the communications and are treated fairly.\nIn this scenario, since Sanctuary Capital and Aisha Nazari do not generally use the company's social media page to communicate with existing\nclients, just updating that page is insufficient disclosure of important information. Additional communication is needed to ensure all clients are\naware of the change. Nazari violates the Standard by failing to provide the additional information (Choice A).\nThings to remember:\nStandard V(B) requires Members and Candidates to inform both clients and prospective clients about the limitations and risks of an investment\nasset. Any changes to the components, risks, or investment strategy of the asset must also be disclosed. If a social media platform is used,\nspecial care must be taken to ensure all clients receive the communications.\nRecommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 99, "q": "Bethany Crystal, CFA, manages a firm's European small-cap fund. The fund's investment policy statement mandates that all holdings at the time of purchase must have: at least a 20% potential price return and market capitalizations (ie, market caps) between €300 million and €3 billion. Crystal considers purchasing Investment A, a €200 million retailer, since it has been a proven market disrupter. She is also reviewing Investment B, a €2.9 billion health care stock, which is an attractive acquisition target for several companies. Crystal contends that Investment A's market cap could appreciate to well over €300 million in less than a year and that Investment B's market cap could rise beyond €4 billion if a bidding war occurs. She argues that, regardless of the small-cap fund's constraints, the potential appreciation in both stocks is so great that shareholders should not miss out on these extraordinary expected returns. To comply with Standard III(C) Suitability, Crystal should most appropriately purchase:", "opts": ["neither investment.", "one investment.", "both investments."], "ans": "B", "expl": "\"When Members and Candidates are responsible for managing a portfolio to a specific mandate, strategy, or style, they must\nmake only investment recommendations or take only investment actions that are consistent with the stated objectives and\nconstraints of the portfolio.\"\nAccording to Standard III(C) Suitability, managers must invest according to the detailed investment objectives and constraints of a specific\nmandate (eg, a fund's restrictions). This is crucial since a manager might otherwise purchase a security inconsistent with the objectives and\nconstraints, leaving investors exposed to different risks and returns than those stated in the mandate.\nThe mandate in this scenario has two constraints: a minimum potential price return of 20% and market capitalizations between €300 million and €3\nbillion. Investment A's potential price return of 50% [(300 − 200) ÷ 200] is greater than the 20% minimum, but its present market cap of €200\nmillion is less than the fund's €300 million minimum.\nInvestment B's potential price return of 37.9% [(4.0 − 2.9) ÷ 2.9] and its current market cap of €2.9 billion both pass the fund's constraints.\nTherefore, Crystal complies with Standard III(C) Suitability by purchasing only Investment B. The investment's market capitalization after\npurchase is not a constraint of the fund (Choices A and C).\nThings to remember:\nAccording to Standard III(C) Suitability, managers of a fund must adhere to its specific investment objectives and constraints. If a manager\npurchases securities in a manner inconsistent with the constraints, the fund is mispresented to investors. The investors are then exposed to\ndifferent risks and returns than intended.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 100, "q": "Jiang Shuang, CFA, is working on a new quantitative model for her employer, Qiao Ventures. Halfway through the project, Jiang decides to leave for another hedge fund, Green Tide Partners. Before leaving, Jiang confirms that she has not signed a noncompete agreement with Qiao. She also confirms that Qiao does not plan on continuing work on her model. Without informing Qiao, Jiang decides to take copies of documents on the project to finish the work at Green Tide. Once at Green Tide, her new manager asks for her help completing another project. Jiang uses knowledge learned at Qiao to help her complete that project. Jiang has most likely violated the Standard IV(A) Loyalty by:", "opts": ["taking documents from Qiao.", "using knowledge gained at Qiao.", "both taking documents from and using knowledge gained at Qiao."], "ans": "A", "expl": "\"In matters related to their employment, Members and Candidates must act for the benefit of their employer and not deprive their\nemployer of the advantage of their skills and abilities, divulge confidential information, or otherwise cause harm to their\nemployer.\"\nStandard IV(A) Loyalty requires Members and Candidates that are employees to protect their employers and to refrain from any conduct that\ncould:\nInjure the firm\nDeprive the firm of profit\nDeprive the firm of the Member or Candidate's skills and abilities\nThe Standard indicates that Members and Candidates must continue to act in the best interest of their current employer when planning to leave.\nThis includes not appropriating confidential documentation and information. Documents and records are the property of the employer and\ncannot be taken from that employer without written permission. Any documents or records stored by an employee (eg, files on a hard drive)\nshould be erased or returned to the employer. However, skills, knowledge, and experiences gained while at a previous employer are not\nconfidential and may continue to be used.\nIn this scenario, Jiang Shuang violates the Standard by taking documents related to the quantitative model she was working on at Qiao Ventures\nwithout permission. Even though Qiao was not planning to continue the work, it does not release Jiang from her duty to her employer since all of\nJiang's work products created at Qiao, including the documents, still belong to Qiao. However, the Standard allows Jiang to use knowledge and\nskills gained while working at Qiao, so using this knowledge to help the manager of Green Tide Partners finish that project does not violate the\nStandard (Choices B and C).\nThings to remember:\nStandard IV(A) Loyalty notes that Members and Candidates must try to protect the interests of their employers. This includes refraining from\ntaking confidential information and documentation from an employer when leaving. However, knowledge gained while working at that employer is\nnot confidential and may continue to be used.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 101, "q": "Pierre Bellefont, CFA, is an analyst at a wealth advisory firm. In the last year, Bellefont has been in court twice. The first time, the charge stemmed from his refusal to testify as a witness to a colleague's illegal insider trading. Bellefont did not participate in the illegal trading activity and claimed that he refused to testify only out of loyalty to his employer and to protect his firm's reputation. The second time, he declared personal bankruptcy as the result of a large penalty for evading income taxes. Which of Bellefont's actions most likely indicate that he violated Standard I(D) Misconduct?", "opts": ["Evading taxes and refusing to testify", "Declaring bankruptcy and evading taxes", "Refusing to testify and declaring bankruptcy"], "ans": "A", "expl": "\"Members and Candidates must not engage in any professional conduct involving dishonesty, fraud, or deceit or\ncommit any act that reflects adversely on their professional reputation, integrity, or competence.\"\nStandard I(D) Misconduct focuses on conduct, whether legal or illegal, that reflects poorly on the professional competence, reputation, and\nintegrity of members or candidates. In this case, Bellefont's refusal to cooperate with the enforcement of insider trading laws reflects poorly on\nhis professional integrity. His refusal to testify is a refusal to protect the integrity of the capital markets from illegal insider trading and, ultimately, is\na refusal to protect clients from this colleague. In fact, this diminishes the professional reputation of his firm as well as himself.\nBankruptcy by itself is not a violation of the Standard (Choices B and C). However, the action that led to this bankruptcy—attempting to deceive\nand defraud the government by evading taxes—does violate the Standard.\nThings to remember:\nStandard I(D) Misconduct focuses on conduct that, whether legal or illegal, results from fraud, deceit, or dishonesty or may compromise the\ncompetence, reputation, and professional integrity of any member or candidate.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 102, "q": "To develop her investment theses, Quan Yan, CFA, a leading technology sector analyst, uses several sources, including the following: Personal written notes from earnings calls Twitter posts Text messages from other analysts Historical price feeds To comply with Standard V(C) Record Retention, Yan must keep a record of her:", "opts": ["personal notes, Twitter posts, and price feeds.", "price feeds, personal notes, and text messages.", "Twitter posts, text messages, and personal notes."], "ans": "C", "expl": "\"Members and Candidates must develop and maintain appropriate records to support their investment analyses, recommendations, actions, and\nother investment-related communications with clients and prospective clients.\"\nStandard V(C) Record Retention states that Members and Candidates must keep their own records to support investment research, actions, and\nconclusions. The exact records that must be maintained vary by the Member's role. Records include the following:\nClient conversations\nNotes from earnings calls\nStatistical analyses (ie, spreadsheets)\nWritten reports\nElectronic communications (eg, texts, emails)\nNew media communications (eg, Twitter feeds, blogs)\nRecords may be maintained electronically or as hard copies. Since firms' record retention policies may lag behind developments in new media\nstorage, Members and Candidates are obligated to store their own records of content from nontraditional media sources (eg, blogs, Twitter\nfeeds).\nIn this scenario, to adhere to the Standard, Yan must retain her written notes and keep records of Twitter feeds and text messages (even from\nher personal phone). Since historical price feeds are publicly available data that are easily reproduced, Yan is not required to record them as part\nof her investment research (Choices A and B).\nThings to remember:\nStandard V(C) Record Retention states that Members and Candidates must keep their own records, including client conversations, written reports,\nand new media (eg, blogs, Twitter feeds), to support investment research, actions, and conclusions. Using new media channels obligates analysts\nto properly record and store new media data.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 103, "q": "Ricardo Stevenson, CFA, regularly documents research to substantiate his investment decisions. Stevenson's firm has no mandatory policy regarding its record retention; however, the laws of the country where Stevenson's firm is located require that documents be maintained for at least three years. To comply with the Code and Standards, the minimum number of years he is required to maintain his research records is:", "opts": ["3", "7", "10"], "ans": "A", "expl": "\"Members and Candidates must develop and maintain appropriate records to support their investment analyses, recommendations, actions,\nand other investment-related communications with clients and prospective clients.\"\nRegulators often have minimum standards for investment-related records retention. In addition, investment organizations may have more\nstringent policies than local regulators. These may identify different periods of retention for different types of investment data (eg, earnings\nreports, client conversations).\nMembers and Candidates comply with Standard V(C) Record Retention if they follow the local country regulations and their firms' policies. If local\nregulations are silent and a firm does not have a record retention policy, CFA Institute recommends that Members and Candidates maintain\nrecords for at least 7 years. However, that is a recommendation of the Code and Standards, but not a requirement. So even though local laws\nare less strict than the recommendation of the Standards, as in this case, following the local laws complies with the Standard.\nIn this scenario, Ricardo Stevenson's firm has no record retention policy, but local law requires a minimum of 3 years' retention, so Stevenson\nshould maintain records for at least 3 years. If there were no local regulations, Stevenson should follow the Standard's recommendation of 7\nyears' retention (Choices B and C).\nThings to remember:\nFollowing firm and regulatory requirements meets the Standard. In the absence of both firm policies and local regulations, the Standards\nrecommend maintaining records for at least seven years.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 104, "q": "Stephen Cutler, State Treasurer, is responsible for overseeing the teachers' pension plan. Cutler hires Louise Gartner, a consultant, to advise the state on investments. Gartner hires Valarie Norton, CFA to manage the pension plan. Norton delivers investment reports to Cutler and Gartner on a semiannual basis. Under Standard III(A) Loyalty, Prudence, and Care, the client(s) to whom Norton most likely owes a duty of loyalty is (are):", "opts": ["Only Cutler", "Only the teachers", "Gartner and the teachers"], "ans": "B", "expl": "\"Members and Candidates have a duty of loyalty to their clients and must act with reasonable care and exercise\nprudent judgment. Members and Candidates must act for the benefit of their clients and place their clients'\ninterests before their employer's or their own interests.\"\nTo comply with Standard III(A) Loyalty, Prudence, and Care, members and candidates must identify the client to whom they owe loyalty. When\nan individual investor hires a manager to invest personal assets, the client is self-evidently the individual. However, when an institution hires an\ninvestment manager, it does so to benefit others. For institutional engagements, the plan beneficiaries are the clients, not the person or firm\nwho hires the manager.\nIn this scenario, Norton, as the hired manager, interacts with and reports to Cutler and Gartner; however, under Standard III(A), Cutler and Gartner\nare not considered her clients, even if they retain control over Norton's appointment as manager. The teachers are the beneficiaries of the\npension plan; therefore, it is to them that Norton owes a duty of loyalty (Choices A and C).\nThings to remember:\nMembers and candidates must identify the client to whom they owe loyalty. When an institution (eg, pension plan) hires an investment manager,\nthe plan's beneficiaries are the manager's clients; therefore, the manager owes the beneficiaries a duty of loyalty.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 105, "q": "Sami Sharifi, CFA, is the portfolio manager for high-net-worth clients at High Peak Capital. During his quarterly client review, he notices signs of potential tax fraud by one of his clients, Ibrahim Khan. Local law stipulates that illegal acts be reported to the authorities. However, Sharifi has only partial access to Khan's accounts, so he is not certain whether Khan's acts were illegal and so is unable to confirm any misdeeds. To comply with III(E) Preservation of Confidentiality, it would be most appropriate for Sharifi to:", "opts": ["keep Khan's information confidential but confront him about the activities.", "confer with High Peak's compliance officer and legal counsel on next steps.", "turn Khan's information over to local authorities on suspicion of illegal activity."], "ans": "B", "expl": "\"Members and Candidates must keep information about current, former, and prospective clients confidential\nunless:\n1. The information concerns illegal activities on the part of the client or prospective client,\n2. Disclosure is required by law, or\n3. The client or prospective client permits disclosure of the information.\"\nStandard III(E) Preservation of Confidentiality addresses the protection of client information. Members and Candidates are required to keep\nconfidential any relevant information about a client that is received during the course of business.\nHowever, information must be disclosed to authorities if the information is required to be disclosed by law or if the information regards illegal\nactivity. In these cases, dissemination would not violate the Standard. When in doubt about whether activities are illegal or violate applicable\nlaws, Members and Candidates should consult with their firms' compliance officer or seek legal counsel.\nSince Sami Sharifi noticed signs of a client's potential tax fraud by a client but is uncertain of any illegality, his best course of action would be to\nseek advice from the firm's compliance officer or legal counsel. Counsel can add clarity to the activities, so to avoid unnecessary disclosure of a\nclient's confidential information, such advice should be solicited before disclosing any relevant information to the authorities (Choice C). The\nStandard does not require Members or Candidates to confront the client about any potentially illegal activities (Choice A).\nThings to remember:\nStandard III(E) requires that relevant information about a client be kept confidential. However, information must be disclosed if required by law or\nif the information regards illegal activity. When in doubt about whether activities are illegal or violate applicable laws, Members and Candidates\nshould consult with their firms' compliance officer or seek legal counsel before deciding.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 106, "q": "An investment firm has multiple subsidiaries across countries. The subsidiaries have different business names but operate under the same brand name. When defining the firm to claim compliance with GIPS standards, which subsidiaries should the firm most appropriately include? ", "opts": ["Any subsidiaries operating under the same brand name", "Only subsidiaries using the business name of the investment firm", "Only subsidiaries located in the country the firm is seeking compliance"], "ans": "A", "expl": "The fundamentals of compliance require that a company seeking compliance with GIPS standards must properly define its firm. A proper\ndefinition ensures:\nthe whole firm is complying with GIPS standards,\nan accurate accounting of total firm assets, and\nrepresentative composite creation.\nGIPS standards state that an investment firm seeking compliance should adopt the broadest definition of the firm. When a company operates in\nmultiple countries or regions, the scope should include all subsidiaries or offices that operate under the same brand name. This includes\nany individual subsidiaries that may have different business names. For example, if a company has a subsidiary in another country with a different\nbusiness name but that operates under the same brand name, it should be included under the definition of the firm for GIPS compliance.\n(Choice B) The definition of the firm should include all geographical subsidiaries operating under the same brand name, regardless of the actual\nnames of the individual companies.\n(Choice C) GIPS compliance encompasses the whole firm and is not done on a country-by-country basis.\nThings to remember:\nGIPS standards state that an investment firm seeking compliance should adopt the broadest definition of the firm. When the company operates in\nmultiple countries/regions, the definition should include all subsidiaries or offices that operate under the same brand name, regardless of the\nbusiness names of the individual companies.\nDescribe the fundamentals of compliance, including the recommendations of the GIPS Standards with respect to the definition of the firm and the\nfirm’s definition of discretion", "qhtml": null}, {"n": 107, "q": "When constructing a composite, which of the following is least likely a requirement of GIPS?", "opts": ["Each composite must include two or more discretionary portfolios.", "A portfolio's inclusion in a composite is determined on an ex ante basis.", "All actual, fee-paying, discretionary portfolios are required to be in at least one composite."], "ans": "A", "expl": "A composite is an aggregated portfolio formed by grouping one or more portfolios that a firm manages according to a specific style or objective.\nFirms report the portfolios' combined performance as if it were one collective unit. Most composites are constructed using many portfolios.\nHowever, a composite can consist of only one portfolio if the style or objective is unique to that portfolio.\nTo be GIPS-compliant, a firm must include all actual, discretionary, fee-paying, portfolios in at least one composite (Choice C). Hypothetical\nportfolios cannot be included since composites must represent actual results. The term \"discretionary\" indicates that the client has given the\nmanager control to make investment decisions (ie, buy or sell securities). Including only the portfolios that the manager controls provides the best\nevidence of the manager's skill.\n(Choice B) The decision whether to include a portfolio in a composite must be made prior to the reporting period; this is referred to as ex ante,\nrather than ex post. This prevents managers from \"cherry picking\" or selecting only those portfolios that boost the composite's performance.\nThings to remember:\nA composite is a collection of one or more portfolios that are managed under a common strategy or objective. To be GIPS-compliant, a firm must\ninclude all actual, discretionary, fee-paying, portfolios in at least one composite. The decision to include a portfolio in a composite in done prior to\ncalculating the composite's performance (ie, ex ante basis).\nExplain the purpose of composites in performance reporting", "qhtml": null}, {"n": 108, "q": "An investment management firm most likely can claim compliance with the Global Investment Performance Standards (GIPS) if it:", "opts": ["includes only discretionary portfolios in its composites.", "clearly distinguishes composites that do and do not comply with GIPS.", "excludes composites for which it has less than five years of performance history."], "ans": "A", "expl": "Compliance with the Global Investment Performance Standards (GIPS) requires firms to calculate and present composite returns. A composite\nis a group of discretionary portfolios that a firm manages according to a common style or strategy. A discretionary portfolio is one in which the\nmanager makes the investment decisions. For example, a firm's large-cap value composite would consist of the portfolios that have a strategy\nthat invests in large-cap value stocks. A firm must present a composite for each of its different strategies, but nondiscretionary portfolios are\nnot included in a composite.\n(Choice B) GIPS are a set of detailed provisions and definitions concerning input data, calculation, composite construction, and so on. For a firm\nto claim compliance, all composites must be prepared according to GIPS; the Standards specifically disallow firms to claim compliance \"except for\"\nnoncompliant composites.\n(Choice C) GIPS generally require firms to present a minimum of five years of returns for each composite. However, with respect to newer\ncomposites, a firm complies with GIPS if it presents information for each year of a composite's existence. Even if a composite has existed for less\nthan five years, it must be included for a firm to claim compliance with GIPS.\nThings to remember:\nThe Global Investment Performance Standards (GIPS) are uniform methods to calculate and present investment performance results. Firms must\nreport at least five years of composite information for each strategy or style that they manage. A composite consists of all discretionary portfolios\nthat are managed using a common style or strategy.\nDescribe the key concepts of the GIPS standards for firms", "qhtml": null}, {"n": 109, "q": "A firm creating and maintaining GIPS-compliant composites is most likely required to:", "opts": ["assign portfolios to composites on an ex ante basis.", "ensure that each composite contains multiple portfolios.", "include every portfolio with a similar strategy in a composite."], "ans": "A", "expl": "A composite aggregates all a firm's portfolios that are managed according to a certain investment mandate, objective, or strategy. GIPS require\nthat each fee-paying, discretionary portfolio must be included in at least one composite.\nThe decision to include a portfolio in a composite must be based on pre-established criteria, referred to as ex ante, rather than ex post (ie,\nafter the fact), criteria. This prevents managers from presenting only their best-performing portfolios in the composite. Including all similarly\nmanaged portfolios provides a complete representation of the firm's performance with that strategy.\n(Choice B) Including only one portfolio in a composite is allowed if it is the firm's only portfolio using that investment mandate, objective, or\nstrategy.\n(Choice C) A firm is required only to include fee-paying, discretionary portfolios in composites. Non–fee-paying portfolios that are discretionary\nalso may be included. However, all nondiscretionary portfolios must be excluded since they reflect clients', not the firm's, decisions and\nperformance.\nThings to remember:\nA composite is an aggregate of one or more portfolios based on a specific investment mandate, objective, or strategy. The decision to include a\nportfolio in a composite must be based on pre-established (ie, ex ante) criteria.\nExplain the purpose of composites in performance reporting", "qhtml": null}, {"n": 110, "q": "The fundamental purpose of the GIPS standards for firms is best described as:", "opts": ["fully, fairly, and ethically presenting a firm's investment performance.", "serving as the global regulatory source to address controversial performance reporting.", "setting a minimum threshold for composite performance reporting, verified by a third party."], "ans": "A", "expl": "Global Investment Performance Standards (GIPS®) are a standardized approach for investment performance presentation. GIPS standards are\nbased on the ethical principle that fair representation and full disclosure of investment performance are critical to the integrity of the capital\nmarkets and the investment profession. For firms, the fundamental purpose of GIPS compliance is to present investment performance fully,\nfairly, and ethically.\n(Choice B) CFA Institute is not a regulatory body. GIPS standards are a self-regulatory set of standards that lays out a framework for global\nperformance reporting without attempting to address every element (controversial or not) of performance reporting practices.\n(Choice C) The GIPS standards set a much higher bar than a minimum threshold for composite performance reporting. In addition, third-party\nverification is optional, although it is considered best practice.\nThings to remember:\nFor firms, the fundamental purpose of GIPS is to present investment performance fully, fairly, and ethically.\nDescribe the fundamentals of compliance, including the recommendations of the GIPS Standards with respect to the definition of the firm and the\nfirm’s definition of discretion", "qhtml": null}, {"n": 111, "q": "For Global Investment Performance Standards (GIPS®) compliant firms, which of the following best describes the purpose of composite construction?", "opts": ["Equal trade allocations ensure consistent reporting.", "Composites' universal asset class definitions improve comparability.", "Composites bar managers from preparing performance reports using only the best accounts."], "ans": "C", "expl": "GIPS standards provide rules on how a manager must construct and report composites. A composite is made up of one or more client portfolios\nthat represent a firm's strategy. Each portfolio may be included in one or more composites.\nThe purpose of having uniformity in constructing composites is to prevent firms from selecting accounts that make the firm's performance look\nbetter than it would if all appropriate accounts were included. Without GIPS standards, a firm could choose which portfolios to include and\nexclude, making it difficult to ascertain how managers truly perform. GIPS-compliant firms produce performance reports that are more consistent\nand reliable.\n(Choice A) GIPS standards do not require managers to allocate trades equally. The Standard of Professional Conduct stipulates that clients\nshould be fairly treated, but it is silent on an exact process for allocating trades.\n(Choice B) GIPS standards do not mandate universal asset class definitions in composites.\nThings to remember:\nGIPS standards provide rules on composite construction, maintenance, and performance reporting. Having uniformity in constructing composites\nprevents firms from selecting only high-performing portfolios. Without GIPS standards, a firm could choose which portfolios to include and\nexclude; this would make it difficult to ascertain a manager's true performance.\nExplain the purpose of composites in performance reporting", "qhtml": null}, {"n": 112, "q": "If a firm chooses to verify its compliance with the GIPS standards, the verification must be performed by:", "opts": ["an independent third party.", "the firm's chief compliance officer.", "the local securities market regulatory authority."], "ans": "A", "expl": "GIPS verification\nIs recommended but not required\nMust be performed by an independent third party\nApplies to the entire firm, not just specific composites\nIncreases confidence in a firm's claim of GIPS compliance\nCompliance with GIPS (Global Investment Performance Standards) is voluntary, but a firm must fully comply to claim compliance; there is no\npartial compliance. For the firm that claims compliance, CFA Institute recommends (but does not require) that compliance be verified to enhance\nthe reliability of the firm's assertion.\nVerification must be made by an independent third party and is applied to an entire firm, not individual composites. Verification does not\nensure the accuracy of the composites but tests whether the firm:\nhas complied with all GIPS requirements when constructing its composites and\nfollows a process for calculating and presenting performance returns that complies with GIPS.\n(Choice B) A firm can assert that it is GIPS compliant, but it cannot self-verify its assertion. A firm's chief compliance officer, or any other person\nwho is part of the firm, is not allowed to perform the verification.\n(Choice C) Regulatory bodies are not involved in verifying GIPS compliance.\nThings to remember:\nCFA Institute recommends that firms verify their compliance with GIPS if they choose to claim they are GIPS compliant. Verification must be\nperformed by an independent third party.\nDescribe the concept of independent verification", "qhtml": null}, {"n": 113, "q": "Which of the following most accurately describes a reason why the Global Investment Performance Standards were developed?", "opts": ["To encourage diversity in performance reporting", "To set a minimum period for reporting past performance", "To provide flexibility in how terminated accounts are reported"], "ans": "B", "expl": "The Global Investment Performance Standards (GIPS) are a uniform approach for calculating and presenting historical investment\nperformance. With fair representation and full disclosure, all interested parties benefit from more reliable data. Prior to the development of\nGIPS, investors had difficulty comparing managers since there was a wide disparity in how managers calculated and presented performance\ninformation.\nIntitially, for GIPS-compliant firms, performance reports must show at least five years of performance unless the firm or composite has existed for\nless than five years. In this case, firms present performance since the firm's or composite's inception. In subsequent years, the firm must add\nGIPS-compliant performance each year until there is a minimum of 10 years of performance in the firm's reports.\n(Choice A) GIPS provide uniformity, not diversity when presenting performance. Uniformity gives the investor the ability to compare managers\nwho use the same method to calculate performance.\n(Choice C) GIPS require managers to include terminated client accounts as part of the firm's historical performance. Excluding underperforming\nportfolios that were terminated may overstate performance and so would be an unfair representation. There is no flexibility on how to account for\nterminated portfolios.\nThings to remember:\nThe Global Investment Performance Standards (GIPS) are a uniform approach for calculating and presenting historical investment performance.\nGIPS was developed to improve the comparability of managers' performance since each manager may have presented performance differently.\nExplain why the GIPS standards were created, who can claim compliance, and who benefits from compliance", "qhtml": null}, {"n": 114, "q": "Parkhurst Investment Advisors (PIA) is a fee-based provider of stock selection and asset allocation advice to large, defined-benefit pension plans. It does not manage assets but maintains detailed records on its recommendations. For the last 12 years, PIA has created composites from the different portfolios that it has recommended to its clients. In its advertising literature, PIA displays each year's return for its composites, both gross of and net of a hypothetical 1% annual fee, as well as the return for each composite's benchmark. Can PIA claim compliance with the Global Investment Performance Standards (GIPS)?", "opts": ["No, since it does not manage assets.", "No, since GIPS place a 10-year limit on past information.", "Yes, since it presents the returns for the composites as well as their benchmarks."], "ans": "A", "expl": "Global Investment Performance Standards (GIPS) provide uniform methods for investment managers to calculate and present investment\nresults. Using GIPS to calculate and present performance allows the investing public to objectively compare different managers. It prevents firms\nfrom presenting information for a limited time horizon that may not represent the longer-term reality.\nAlthough compliance is voluntary, one condition to claim compliance with GIPS is that a firm must manage assets. Advisers and software\ndevelopers that aid asset managers cannot claim compliance since they do not actually manage client assets. In this case, although PIA can\ndemonstrate the returns that its portfolios would have achieved, it is not allowed to claim compliance with GIPS.\n(Choice B) GIPS requires a firm to present at least five years of returns for each of the composite portfolios that it manages. A \"composite\"\nportfolio is one that is aggregated from one or more actual portfolios that the firm manages according to a distinct style or objective. GIPS does\nnot limit the number of years of information that can be provided.\n(Choice C) A firm must present information concerning both its composites and their benchmarks. However, since PIA does not manage assets,\nit cannot claim to be GIPS-compliant.\nThings to remember:\nGlobal Investment Performance Standards (GIPS) are uniform methods to calculate and present investment performance results. Compliance\nwith GIPS is voluntary, but firms must comply with all Standards in order to claim compliance. In addition, a firm must manage client assets to\nclaim compliance with GIPS.\nDescribe the key concepts of the GIPS standards for firms", "qhtml": null}, {"n": 115, "q": "If an investment firm has its GIPS compliance verified, the verifier must attest that the firm is compliant at the:", "opts": ["firm level.", "account level.", "composite level."], "ans": "A", "expl": "According to the Fundamentals of Compliance provision of the GIPS, to claim compliance a firm must adhere to all GIPS requirements. This is\naccomplished only if the entire firm follows all mandated rules.\nFirms that claim GIPS compliance enhance potential clients' confidence that the information used is complete and fairly presented. If the\nStandards are not applied on a firm-wide basis, managers could include only those portfolios that present the firm in the best light (ie, cherry-pick\naccounts), which could mislead investors.\n(Choice B) Composites are groups of accounts managed in a similar strategy, all of which must, without exception, comply with GIPS for a firm to\nclaim GIPS compliance.\n(Choice C) Account performance data must be appropriately maintained and may be part of a composite. However, the basis of claiming GIPS\ncompliance is at the firm level, not the account level.\nThings to remember:\nA firm can claim GIPS compliance only on a firm-wide basis. All accounts and composites must follow the rules mandated by the GIPS\nprovisions. Firm-wide compliance prevents managers from promoting better performance or cherry-picking accounts and misleading investors.\nDescribe the key concepts of the GIPS standards for firms", "qhtml": null}, {"n": 116, "q": "A firm is in a jurisdiction where local regulations concerning investment reporting requirements are very similar to the Global Investment Performance Standards (GIPS), except that a firm cannot provide performance information for composites that are in existence for less than five years. If the firm follows local regulations, can it claim that it is GIPS-compliant?", "opts": ["No, since a firm must comply with all the Standards to claim GIPS-compliance.", "Yes, provided that the firm indicates where GIPS conflicts with local regulations.", "Yes, provided that the firm furnishes independent verification that it follows local regulations."], "ans": "B", "expl": "Global Investment Performance Standards (GIPS) require firms to include five years of performance information for all composites. If a composite\nhas been in existence for less than five years, then the information must be provided from the composite's inception. In this question, GIPS\nconflict with local law, since firms are not permitted under local law to report on composites that have been in existence for less than five years.\nThe general rule is that a firm must comply with all Standards to claim it is GIPS-compliant. However, the Standards also require firms to comply\nwith local law. GIPS are intended to apply globally, so when GIPS conflict with local law, a firm can claim compliance with GIPS by following local\nlaw and disclosing those areas where GIPS conflict (Choice A).\n(Choice C) The CFA Institute recommends, but does not require, that firms verify their compliance with GIPS. If a firm chooses to verify, the\nverification must be performed by an independent third party. Nothing in GIPS requires a firm to verify that it complies with local regulations in\norder to claim that it complies with GIPS.\nThings to remember:\nThe general rule is that a firm must comply with all Global Investment Performance Standards (GIPS) to claim that it is GIPS-compliant. However,\nwhen GIPS conflict with local law, a firm can claim compliance with GIPS by following local law and disclosing those areas where GIPS conflict.\nDescribe the concept of independent verification", "qhtml": null}, {"n": 117, "q": "According to CFA Institute, which of the following are most likely to be the main beneficiaries of GIPS-compliant reporting?", "opts": ["Investment firms and prospective clients", "Governmental regulators and investment firms", "Prospective clients and governmental regulators"], "ans": "A", "expl": "While it may be that market participants and society at large benefit from GIPS compliance, according to CFA Institute, both investment firms\nand potential clients are the main beneficiaries. GIPS-compliant firms benefit directly by increasing the integrity of their performance\nreporting with complete and fairly presented reports.\nProspective clients benefit from increased confidence in the reliability of firms' performance. They also benefit from easier comparisons\nwhen selecting among investment firms. Complying with GIPS enhances firms' credibility but does not replace a potential investor's due\ndiligence.\n(Choices B and C) Governmental regulators may have their own standards but do not directly benefit from GIPS-compliant firms.\nThings to remember:\nAccording to CFA Institute, investment firms and potential clients are the main beneficiaries of GIPS compliance. Investment firms benefit directly\nby increasing their integrity with complete and fairly presented performance reports. Prospective clients benefit from increased faith in the\nreliability of firms' performance. They also benefit from easier comparisons when selecting among investment firms.\nExplain why the GIPS standards were created, who can claim compliance, and who benefits from compliance", "qhtml": null}, {"n": 118, "q": "If a firm elects to verify its compliance with the Global Investment Performance Standards (GIPS), verification most likely:", "opts": ["is required at least annually.", "must be performed on all the firm's composites.", "ensures that a composite is accurately presented."], "ans": "B", "expl": "The Global Investment Performance Standards (GIPS) provide uniform methods for investment managers to calculate and present\ninvestment results. Compliance with GIPS is voluntary, but firms must comply with all the Standards to claim compliance; there is no partial\ncompliance.\nWhen a firm claims that it complies with GIPS, CFA Institute recommends, but does not require, that the claim be verified. If elected, verification\nmust be made by an independent third party. Verification is performed on all the firm's composites and tests two conditions:\nThe firm has constructed its composites in accordance with GIPS.\nThe firm's process for calculating and presenting performance returns complies with GIPS.\n(Choice A) CFA Institute recommends that firms verify their claims of compliance with GIPS, but it is not required.\n(Choice C) Verification only tests that the firm followed GIPS in constructing its composites. It does not ensure that a composite is accurately\npresented.\nThings to remember:\nCFA Institute recommends that firms verify their compliance with the Global Investment Performance Standards (GIPS). Verification is performed\nby an independent third party, and a firm must verify that all its composites comply with GIPS.\nDescribe the concept of independent verification", "qhtml": null}, {"n": 119, "q": "Firm X acquires Firm Y. Both firms have historically claimed GIPS compliance. In the acquisition, all of Firm Y's portfolio managers have been retained by Firm X but most of the research and support staff have not. The research duties will be assumed by Firm X's existing staff. According to the GIPS standards, can Firm X link Firm Y's past performance with its own?", "opts": ["No.", "Yes, since Firm X has acquired Firm Y.", "Yes, since the portfolios' management remains the same."], "ans": "A", "expl": "Global Investment Performance Standards (GIPS®) are a standardized approach for investment performance presentation. GIPS compliance is\non a firm-wide basis only (ie, not on a composite and/or fund level). When a new firm is created or an existing firm is acquired, the prior or existing\nfirm's historical GIPS-compliant performance can be linked to (ie, assumed by and reported with) the new or acquiring firm's reported\nperformance, provided that all of the following conditions are met:\nSubstantially all the investment decision makers are employed by the new or acquiring firm. This includes not only portfolio managers but\nalso the relevant research and support staff.\nThe investment decision-making process must remain independent (ie, no interference by acquiring firm) and substantially intact.\nThe new or acquiring firm must maintain records that support the reported performance.\nThere is no break (ie, gap) in the performance record when transitioning to the new firm. If there is a break, the past performance can still\nbe presented but not linked.\nIn this scenario, since Firm X has not retained Firm Y's key investment decision-making personnel, Firm X cannot link Firm Y's past performance\nwith its own (Choices B and C).\nThings to remember:\nPast GIPS-compliant performance can be linked to a new or acquiring firm provided that certain conditions are met; those conditions include\nretaining personnel, maintaining records, keeping the decision process intact, and allowing no break in the performance record.\nDescribe the fundamentals of compliance, including the recommendations of the GIPS Standards with respect to the definition of the firm and the\nfirm’s definition of discretion", "qhtml": null}, {"n": 120, "q": "The GIPS standards most likely:", "opts": ["allow selection of the period to be presented for a composite and its benchmark.", "require inclusion of portfolios removed from a composite after the reported period.", "are enforced by regulatory authorities to ensure consistency among investment firms."], "ans": "B", "expl": "Common misleading performance reporting practices\nRepresentative\nSelecting top-performing portfolios to represent overall results\naccounts\nSurvivorship\nExcluding terminated portfolios from average performance\nbias\nVarying\nPresenting only selected periods of strong performance\ntime periods\nThe Global Investment Performance Standards (GIPS®) standardize the reporting of historical performance across the investment industry to\nfacilitate comparisons between firms and increase investor confidence. The GIPS standards require that information is comprehensive and\nrepresents actual performance. Investment managers at noncompliant firms could mislead clients by selectively choosing to present information\non:\nPortfolios managed: A firm might choose to share the historical performance of its top-performing portfolios only, thus reporting greater\nreturns than the actual results.\nFinancial assets: A firm might present the investment performance of only currently invested assets, which creates survivorship bias by\noverlooking assets that were removed from the portfolio after performing poorly. Firms should include terminated client accounts, funds,\nand portfolios as part of the historical performance of a composite.\nTime period: Investment managers might inappropriately present the performance only for periods when a portfolio outperformed the\nmarket or the benchmark.\n(Choice A) The GIPS standards prevent firms from presenting performance periods selectively by mandating a minimum number of consecutive\nperiods to present.\n(Choice C) GIPS compliance is optional, so there is no regulatory oversight of the GIPS standards.\nThings to remember:\nInvestment firms can mislead investors with an incomplete performance history, selectively choosing which information to present. The GIPS\nstandards provide a uniform approach to presenting composites that requires firms to include terminated client accounts, funds, and portfolios as\npart of the historical performance.\nDescribe the key concepts of the GIPS standards for firms", "qhtml": null}, {"n": 121, "q": "Based on the GIPS fundamentals of compliance, a firm must define:", "opts": ["the firm and discretion.", "prospective clients and the firm.", "discretion and prospective clients."], "ans": "A", "expl": "A firm seeking compliance with GIPS standards must define the firm and the meaning of discretion to ensure accuracy and consistency when\napplying the standards.\nGIPS standards state that an investment firm seeking compliance should adopt the broadest definition of the firm to ensure an accurate\naccounting of total firm assets. When a firm operates in multiple countries/regions, the scope of the definition of the firm should include all offices\nthat operate under the same brand name.\nFirms must also define discretion so that they can be consistent about which portfolios will be included in composites. Since only\ndiscretionary portfolios are included in composites, this definition will dictate when a portfolio is included or removed from composites, which in\nturn affects reported performance.\n(Choices B and C) Firms claiming GIPS compliance do not consider a definition for prospective clients. Based on the fundamentals of\ncompliance, firms must provide GIPS reports to all prospective clients and prospective pooled fund investors.\nThings to remember:\nA firm seeking compliance with GIPS standards must define the firm and discretion. GIPS standards state that an investment firm seeking\ncompliance should adopt the broadest definition of the firm. Defining discretion allows firms to be consistent about which portfolios will be included\nin a composite and thus affects reported performance.\nDescribe the fundamentals of compliance, including the recommendations of the GIPS Standards with respect to the definition of the firm and the\nfirm’s definition of discretion", "qhtml": null}, {"n": 122, "q": "To claim compliance with Global Investment Performance Standards (GIPS), a firm most likely will state that it:", "opts": ["calculates performance in accordance with GIPS.", "includes portfolios in composites based on ex ante criteria.", "omits reporting on composites that have been in existence for fewer than 5 years."], "ans": "B", "expl": "Global Investment Performance Standards®, known as GIPS, were created by CFA Institute to provide uniform methods for investment\nmanagers to calculate and present investment results. Compliance with GIPS is voluntary, but to claim compliance, a firm must comply with all\nof the standards; there is no partial compliance.\nA composite is an aggregation of portfolios that are managed to a specific style or strategy. One compliance requirement is that a firm\ngenerally must include all discretionary, fee-paying portfolios in a composite. However, if the firm has established specific criteria for including\nportfolios before creating the composite (ie, ex ante criteria), then it can still claim compliance with GIPS despite the exclusion of portfolios that do\nnot comply with criteria. This prevents a firm from changing its rules to justify excluding one or more portfolios with subpar performance so that the\noverall results look better.\n(Choice A) CFA Institute specifically prohibits firms from using any language to the effect that they calculate returns in accordance with GIPS.\n(Choice C) Firms must present information on all composites for at least 5 years or since inception if the composite has existed for fewer than 5\nyears .\nThings to remember:\nGlobal Investment Performance Standards (GIPS) normally require firms to include all discretionary, fee-paying portfolios in a composite.\nHowever, a firm can establish specific criteria to include portfolios before creating the composite (ie, ex ante criteria). This prevents the firm from\nusing after-the-fact criteria to exclude underperforming portfolios so that its overall performance looks better than it would have.\nDescribe the key concepts of the GIPS standards for firms", "qhtml": null}, {"n": 123, "q": "GIPS standards prevent firms from using misleading performance measurement practices such as presenting:", "opts": ["average returns that exclude terminated portfolios.", "fewer periods of returns than exist for an investment strategy.", "returns of investment strategies that consist of a single portfolio."], "ans": "A", "expl": "Common misleading performance reporting practices\nRepresentative\nSelecting top-performing portfolios to represent overall results\naccounts\nSurvivorship\nExcluding terminated portfolios from average performance\nbias\nVarying\nPresenting only selected periods of strong performance\ntime periods\nThe global standard for investment performance reporting known as GIPS (Global Investment Performance Standards) provides a uniform\napproach for calculating and presenting historical investment performance. Without the GIPS standards, a firm's reporting of its investment\nperformance may be unreliable due to:\nselectively presenting top-performing portfolios to represent the firm's results for a given strategy,\nexcluding portfolios that performed poorly and were terminated, or\npresenting returns for a period of strong performance while excluding periods of weaker performance.\nGIPS require that firms include terminated client accounts, funds, and portfolios as part of the historical performance of a composite. This\npractice results in a more accurate representation of a firm's complete performance. Excluding terminated portfolios that underperformed results\nin overstating performance and leads to misleading reporting.\n(Choice B) GIPS standards prevent firms from selectively presenting performance periods by mandating a minimum number of consecutive years\nto present. If the strategy has existed for more than the minimum number of require
