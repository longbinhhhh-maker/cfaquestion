"Yu may sell shares of SGHT for the down payment without notifying clients."], "ans": "C", "expl": "\"Investment transactions for clients and employers must have priority over investment transactions\nin which a Member or Candidate is the beneficial owner.\"\nStandard VI(B) Priority of Transactions is intended to avoid inherent conflicts of interest that arise from placing personal investing decisions over\ninterests of clients or employers. However, the Guidance for the Standard acknowledges the possibility that personal circumstances might cause\nmembers or candidates to make investment decisions different from their firm's current recommendations.\nFor example, members and candidates may sell a stock to raise funds for a down payment on a home, even if the firm is recommending a buy on\nthat stock. These transactions may occur if clients are not disadvantaged and the investment action complies with regulatory guidelines. If the\ntransaction complies with the Standard, it is irrelevant whether the member or candidate realized a gain from it.\n(Choices A and B) Yu's sale of SGHT shares for a down payment complies with Standard VI(B). There is no requirement for Yu to inform her\nclients before selling SGHT for the down payment.\nThings to remember:\nStandard VI(B) Priority of Transactions requires that Members and Candidates place client interests before employer or personal interests.\nHowever, the Standard allows exceptions for certain actions that run counter to current recommendations by the Member's or Candidate's firm,\nsuch as selling personal holdings for a down payment on a home.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 62, "q": "Violeta Constantin, CFA, is an analyst at a company that has not adopted GIPS but has adopted the Code and Standards as its ethical guidelines. The firm is preparing a report on its performance. To comply with Standard III(D) Performance Presentation, Constantin should most likely advise the firm to:", "opts": ["disclose that results are reported gross of fees.", "base results on a single, representative account.", "exclude terminated accounts in performance results."], "ans": "A", "expl": "\"When communicating investment performance information, Members and Candidates must make reasonable\nefforts to ensure that this information is fair, accurate, and complete.\"\nStandard III(D) Performance Presentation addresses the importance of communicating fair, accurate, and complete performance information. The\nStandard recommends applying the Global Investment Performance Standards (GIPS) to performance reporting. If a firm has not adopted GIPS,\nthen it should ensure that clients receive a fair, accurate, and complete report.\nFor example, firms should make disclosures that lead to a more complete explanation of results, such as whether results are reported gross of\nfees or net of fees. To be complete and accurate, reports should include terminated accounts (Choice C) and report the results of a weighted\ncomposite of similar portfolios, instead of a single, representative portfolio (Choice B).\nThings to remember:\nPerformance reporting should communicate fair, accurate, and complete information. To that end, firms should make disclosures that lead to a\nmore complete explanation of results, such as whether results are reported gross of fees or net of fees.\nRecommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 63, "q": "The compliance manual for West Tech Investing (WTI) was developed to suit the needs of the firm and clients. Excerpts from the personal securities transactions section of the policy include: Equity initial public offerings (IPOs) – Employees may participate in IPOs. Prior approval is required only for offerings that present a potential conflict of interest. Private placements – Preclearance is required for the initial placement. Restricted list – The firm maintains a restricted list, and no employees involved in the investment decision-making process may trade the securities on the restricted list without prior approval. Participation in investment clubs – Employees are prohibited from joining investment clubs. Which of the company's policies is most likely in conflict with the recommended procedures for compliance in Standard VI(B) Priority of Transactions?", "opts": ["Restricted list", "Equity IPO participation", "Investment club participation"], "ans": "B", "expl": "\"Investment transactions for clients and employers must have priority over investment transactions in which a\nMember or Candidate is the beneficial owner.\"\nStandard VI(B) Priority of Transactions is intended to avoid inherent conflicts of interest that arise from placing personal investing decisions over\nclient or employer interests. One source of an actual or potential conflict of interest is personal participation in equity initial public offerings (IPOs).\nPersonal participation in any equity IPO may appear to deprive clients of attractive investment opportunities. The guidance for the Standard\nrecommends that firms require preapproval (ie, preclearance) before employees participate in any equity IPOs, even if there is no potential\nconflict.\nOther recommended procedures include:\nRestrictions on private placements\nEstablishment of blackout periods/restricted lists\nReporting requirements\nDisclosure of policies regarding personal investments\n(Choice A) WTI's restricted list policy follows the Standard's recommendations as it applies to individuals involved in the investment decision-\nmaking process.\n(Choice C) The Standard allows firms to tailor personal investment policies to meet their own criteria—for example, by prohibiting certain\nactivities such as investment clubs.\nThings to remember:\nStandard VI(B) Priority of Transactions recommends that firms require preclearance for personal participation in any equity IPOs, even if there is\nno actual or potential conflict of interest.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 64, "q": "Nahiya Salehi, CFA, helps manage the pension fund for Azhar, Inc. One year ago, Azhar hired Yasir Kassem to lead the pension team, and since then the returns on Salehi's recommendations have lagged behind those of her colleagues. One day, Kassem tells her, \"I need you to develop relationships with managers at other companies for information to trade on. Your colleagues have made friends with directors at other companies who provide them with strategic information.\" Salehi feels that this constitutes insider trading, which is against local law. She brings the conversation to the attention of Azhar's compliance manager and chief financial officer, who tell her not to worry since this is common practice and the pension fund returns have improved since Kassem joined the team. To comply with Standard IV(A) Loyalty, Salehi's best course of action is to:", "opts": ["do nothing, since no clients are being harmed.", "develop the relationships as Kassem suggests.", "disclose the practice to local regulatory authorities."], "ans": "C", "expl": "\"In matters related to their employment, Members and Candidates must act for the benefit of their employer and\nnot deprive their employer of the advantage of their skills and abilities, divulge confidential information, or\notherwise cause harm to their employer.\"\nStandard IV(A) Loyalty requires Members and Candidates who are employees to protect their employers and refrain from conduct that could:\ninjure the firm,\ndeprive the firm of profit, or\ndeprive the firm of the Member or Candidate's skills and abilities.\nHowever, employers' interests are secondary to clients' interests and the integrity of the capital markets. Therefore, whistleblowing is\npermitted under the Standard, even when it is prohibited under a Member or Candidate's responsibilities to an employer under normal\ncircumstances. Nonetheless, whistleblowing is permitted only when the goal is to protect clients or market integrity, not for personal gain.\nIn this scenario, Azhar, Inc. and Yasir Kassem are using inside information to increase the return on Azhar's pension fund. However, acting on\ninside information is detrimental to overall investor confidence in the capital markets and is against local law. Since market integrity supersedes\nNahiya Salehi's loyalty to her employer, both doing nothing and collecting inside information would violate the Standard (Choices A and B).\nSalehi has already contacted Azhar's compliance manager and chief financial officer, who dismissed her concerns. Therefore, she would be\njustified in disclosing the insider trading to local regulatory authorities.\nThings to remember:\nStandard IV(A) Loyalty notes that Members and Candidates must protect their employers' interests. However, employers' interests are secondary\nto clients' interests and market integrity. Whistleblowing is permitted if it is done to protect clients or market integrity, not for personal gain.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 65, "q": "Indra Kulkarni, CFA, runs a hedge fund. Kulkarni wants to close out his short position in IPB Industrial (IPB), but the publicly traded stock's price keeps rising and Kulkarni wants to avoid taking a loss on the trade. Kulkarni hires a public relations firm to distribute false reports of succession issues and erratic management at IPB following the recent death of IPB's respected CEO. After the negative publicity causes the stock price to fall significantly, Kulkarni closes out his short position and realizes a large gain. On the same day, after meeting regulatory filing requirements, Manjeet Jain, CFA, sells a large block of IPB stock that she had inherited from her mother, the late IPB CEO. Jain knows the recent reports about IPB are false but does not know where they came from. Although she fears her sale may further depress the stock price, she is anxious to sell the stock in order to diversify her portfolio and meet some immediate, personal liquidity needs. Jain sells the stock at a loss but also realizes a large tax benefit. Which of the parties most likely violates Standard II(B) Market Manipulation?", "opts": ["Jain only", "Kulkarni only", "Both Jain and Kulkarni"], "ans": "B", "expl": "\"Members and Candidates must not engage in practices that distort prices or artificially inflate trading volume with\nthe intent to mislead market participants.\"\nStandard II(B) Market Manipulation prohibits behavior that undermines the integrity of markets by distorting trading volume or prices in a\nmarket in order to deceive those who rely on market information. In this case, Kulkarni violates the Standard by hiring a public relations firm to\nmislead market participants with the intent of distorting the market price to his advantage. This is an example of information-based manipulation.\nMarket manipulation can be information-based or transaction-based:\nInformation-based manipulation is the use of misleading or false information to distort market pricing or to induce others to trade based on\nsuch information.\nTransaction-based manipulation occurs when trading is used to distort market prices and volume.\nJain does not violate the Standard since she trades only with the intent of meeting liquidity needs and diversifying her portfolio. Although she\ntrades at a price that reflects information that she \"knows\" is false, and she \"fears\" that her trade will affect the market price, her intent is not to\ndeceive or defraud others by distorting market volume or price information. It is also irrelevant that she derives some benefit from the trade\n(Choices A and C).\nThings to remember:\nStandard II(B) Market Manipulation prohibits behavior that undermines the integrity of markets by distorting trading volume or prices in a market in\norder to deceive or defraud those who rely on market information. Violation of the Standard is determined by the intent to manipulate. Simply\ntrading in a market that reflects distortions of volume or price does not violate the Standard.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 66, "q": "Christina Wilkerson, CFA, is a portfolio manager for a well-known asset management firm. All managers include a brief biography on the firm's website. Wilkerson's entry reads: \"The CFA program afforded me a wide range of knowledge on diverse financial instruments and concepts. I have held the CFA designation since 2011 and passed each level on my first attempt. For each level, my scores in the topics of Fixed Income and Alternative Investments rated in the highest category in CFA Institute's grading system.\" Assuming that all assertions in her entry can be verified, which of the following best describes whether Wilkerson's entry complies with Standard VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program? ", "opts": ["Her entry does not violate the Standard.", "Her statement concerning her examination scores violates the Standard.", "Her statement that she passed each level on her first attempt violates the Standard."], "ans": "A", "expl": "\"When referring to CFA Institute, CFA Institute membership, the CFA designation, or candidacy in the CFA\nProgram, Members and Candidates must not misrepresent or exaggerate the meaning or implications of\nmembership in CFA Institute, holding the CFA designation, or candidacy in the CFA Program.\"\nStandard VII(B) governs how Members and Candidates may use the CFA designation. One purpose of the Standard is to prevent charterholders\nfrom mispresenting the designation by implying that it gives them superior investment expertise or will result in better investment outcomes.\nAn example of misrepresentation is a vague statement that a charterholder is better qualified to manage clients' money. However, the Standard\ndoes not prohibit statements of objective facts.\nWilkerson's assertion that she passed each level of the examination process on her first attempt can be verified. Nothing in the statement implies\nthat she is more qualified to manage investments than someone who required multiple attempts to pass one or more levels (Choice C).\nSimilarly, her statement concerning her score category does not violate the Standard. Candidates do not receive numerical scores; rather, the\nscores for each topic are placed into one of three categories. Candidates receive a breakdown on each topic and are advised as to each score's\ncategory. Again, Wilkerson is not exaggerating her ability or trying to mislead readers into concluding that her scores imply a superior ability\n(Choice B).\nThings to remember:\nStandard VII(B) prevents Members and Candidates from exaggerating the meaning of the CFA designation. They may not mislead others into\nconcluding that simply having the designation automatically confers superior investment knowledge or results. However, the Standard does not\nprohibit statements of objective facts.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 67, "q": "James Wilson, CFA, is an unemployed equity analyst. To keep his investing skills sharp while he looks for a job, he created a free investing blog, \"Investing with the Wizard,\" which issues market commentary and specific investment ideas under the pseudonym \"Investing Wizard.\" In the blog's description, he states that \"the author of this blog, Investing Wizard, is a CFA charterholder.\" Does Wilson's conduct comply with Standard VII(B) Reference to CFA Institute, the CFA designation, and the CFA Program?", "opts": ["Yes", "No, since he identifies the pseudonym as a CFA charterholder.", "No, since he uses a pseudonym that implies extraordinary abilities."], "ans": "B", "expl": "\"When referring to CFA Institute, CFA Institute membership, the CFA designation, or candidacy in the CFA Program, Members and Candidates\nmust not misrepresent or exaggerate the meaning or implications of membership in CFA Institute, holding the CFA designation, or candidacy in the\nCFA Program.\"\nStandard VII(B), Reference to CFA Institute, the CFA Designation, and the CFA Program, requires the use of the author's full name in connection\nwith the use of the CFA designation. The Standard prohibits using a pseudonym or fictitious name in association with the CFA designation.\nWilson violated the Standard by identifying his pseudonym, \"Investing Wizard,\" as a CFA charterholder. Note that using a pseudonym itself is not\na violation of the Standards, but that pseudonym cannot be identified as a CFA charterholder (Choices A and C).\nThings to remember:\nStandard VII(B), Reference to CFA Institute, the CFA Designation, and the CFA Program, prohibits the use of a pseudonym or fictitious name in\nconnection with the CFA designation. The charterholder's full name must be included with any reference to the CFA designation.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 68, "q": "Javier del Monte, CFA, is an adviser for an asset management firm. Five years ago, he was hired by Leonora Gomez to manage the investments of the Ochula Industries Employee Pension Fund. Gomez, chief financial officer of Ochula Industries, is a trustee of the fund. All employees are beneficiaries of the fund, except for company management, who receive stock options in lieu of pension participation. During a routine review of fund performance, Gomez tells del Monte to have the fund buy a position in the publicly traded stock of Brazos Industries (BI). \"That company is a disrupter,\" she notes, \"and the stock price is about to soar.\" Del Monte thoroughly and carefully analyzes this proposed change to the fund's allocation and concludes that the stock would be a good addition to the fund. Del Monte confers with his boss, who advises him to \"keep the customer happy—remember that Gomez is also a big personal client of our firm—so, go ahead and invest in BI; Gomez will be flattered.\" To comply with Standard III(A) Loyalty, Prudence, and Care, the most appropriate reason for del Monte to have the fund invest in BI stock is:", "opts": ["Gomez recommends it.", "his employer advises it.", "it is a good addition to the fund."], "ans": "C", "expl": "\"Members and Candidates have a duty of loyalty to their clients and must act with reasonable care and exercise\nprudent judgment. Members and Candidates must act for the benefit of their clients and place their clients'\ninterests before their employer's or their own interests.\"\nStandards III(A-E) detail a member's or candidate's duties to clients. According to Standard III(A), those duties include loyalty, prudence, and care\nwhen making decisions in the interests of clients. The client's interests must always come first, even before the interests of employers,\ncolleagues, or self. However, in order to put the client's interests first, the client must be properly identified.\nThe client is the party who receives the benefits and bears the risk of the assets under management. The client is not defined as the party who\nhires the asset manager or adviser. When assets are owned in trust, as in a pension plan, the trust's or pension plan's beneficiaries—those who\nreceive the benefits and bear the risks of the investment—are the clients. The plan trustees, despite hiring the asset manager, are not the clients.\nIn this case, the fund's beneficiaries are the participating current and retired employees. The fund is managed for their benefit, and it is to them\nthat del Monte owes his loyalty. Since, after thorough analysis, del Monte believes that the stock is a good investment to make for the fund, it\nwould be appropriate for him to invest in the stock.\n(Choice A) With regard to this fund, Gomez is not del Monte's client, although she is a trustee of the fund and a personal client of his firm. His\nduty of loyalty is not to her but to the fund's beneficiaries.\n(Choice B) Del Monte owes his primary duty of loyalty to his client, the fund's beneficiaries, before his own employer.\nThings to remember:\nThe client's interests must always come first, even before the interests of employers, colleagues, or self. When assets are owned by a pension\nplan or trust, the beneficiaries—not the trustees—are the clients.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 69, "q": "Qui Kien is a candidate for the CFA exam. He works exclusively in a call center as a broker and executes trades only as directed by clients. Under local law, Kien does not have fiduciary responsibility for clients. According to Standard III(A) Loyalty, Prudence, and Care, which of the following best describes Kien's responsibility to clients?", "opts": ["Kien has a fiduciary duty.", "Kien must act in the best interest of his clients.", "Kien has a fiduciary duty and must act in the best interest of his clients."], "ans": "B", "expl": "Members and Candidates have a duty of loyalty to their clients and must act with reasonable\ncare and exercise prudent judgment. Members and Candidates must act for the benefit of\ntheir clients and place their clients' interests before their employer's or their own interests.\nStandard III(A) Loyalty, Prudence, and Care requires members and candidates to be loyal to clients and use reasonable care by taking prudent\ninvestment action that is only motivated by and in the best interest of the client. Members and candidates are loyal to clients by putting clients'\ninterests ahead of all others' interests, including their own.\nIn this case, Kien is not considered a fiduciary under financial regulations. Kien is subject to the Standard due to his status as a CFA candidate,\nregardless of what his job entails. However, the Standards do not impose a fiduciary duty, and members or candidates are not required to act\nas fiduciaries (Choices A and C).\nThings to remember:\nUnder Standard III(A), members and candidates must be loyal to clients and use reasonable care. They are subject to the Standard regardless of\nmembers' or candidates' job responsibilities. However, the Standards do not impose a fiduciary duty on members or candidates.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 70, "q": "Frieda Simon, CFA, is a financial adviser at TCT Advisers. One of Simon's clients, Anton Krause, offers to include her on a trip to his vacation home in Australia once his portfolio reaches €1 million to celebrate the milestone. Krause also offers to pay her expenses for the trip. Simon accepts both offers and does not disclose the agreement to TCT since the compensation is not monetary. Another client, Karla Mayer, proposes a €500 bonus for Simon in any year that Mayer's portfolio achieves a return of 10% or higher. Simon mentions this offer over lunch with her boss, who says, \"That's a great offer. I approve.\" Based on this verbal approval, she accepts Mayer's offer. Simon most likely violates Standard IV(B) Additional Compensation Agreements with respect to:", "opts": ["the trip from Krause.", "the bonus from Mayer.", "both the trip from Krause and the bonus from Mayer."], "ans": "C", "expl": "\"Members and Candidates must not accept gifts, benefits, compensation, or consideration that competes with or\nmight reasonably be expected to create a conflict of interest with their employer's interest unless they obtain\nwritten consent from all parties involved.\"\nStandard IV(B) Additional Compensation Arrangements requires Members and Candidates to obtain written permission before accepting\ncompensation from third parties (eg, clients) for services rendered. Compensation from third parties can create, or be reasonably viewed as\ncreating, a conflict of interest with an employer's interest. The Standard applies to both monetary and nonmonetary (eg, gifts, benefits)\ncompensation.\nIn this scenario, both the paid trip from Anton Krause and the annual bonus from Karla Mayer require prior written approval from the respective\nclients and from Frieda Simon's employer since both gifts come from third parties. Simon received no approval for the trip and only verbal\napproval for the bonus, so she violates the Standard with both arrangements (Choices A and B).\nThings to remember:\nStandard IV(B) requires Members and Candidates to obtain written permission before accepting compensation from third parties for services\nrendered, since such arrangements can create a conflict of interest with an employer's interest. The Standard applies to both monetary and\nnonmonetary compensation.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 71, "q": "Vanessa Van Eeden, CFA, is the director of investments at Consensus Investments (CI) and is responsible for equity management. CI's specialty is small-cap stocks. Due to the departure of several key employees, Van Eeden decides to make the following operational adjustments in the firm: The large-cap strategy will change from active to passive management. Management of the mid-cap strategy will be outsourced to an external manager. CI will continue its focus on actively managing small-cap stocks. To comply with Standard V(B) Communication with Clients and Prospective Clients, which of the following investment strategies must Van Eeden fully disclose to current and prospective clients?", "opts": ["The mid-cap strategy", "The mid-cap and large-cap strategies", "The mid-cap, large-cap, and small-cap strategies"], "ans": "B", "expl": "\"Members and Candidates must disclose to clients and prospective clients the basic format and general principles of the\ninvestment processes they use to analyze investments, select securities, and construct portfolios and must promptly disclose\nany changes that might materially affect those processes.\"\nAccording to Standard V(B) Communication with Clients and Prospective Clients, members and candidates must disclose the changes in the\ngeneral underpinnings of investment processes (eg, strategies) to current and prospective clients. The disclosure allows clients to decide\nwhether the strategy changes still aligns with their risk and return objectives.\nVan Eeden alters the firm's investment process by moving from active to passive management in the large-cap strategy and by changing from\ninternal to external management in the mid-cap strategy. For both the large-cap mid-cap and strategies, Van Eeden should disclose the reasons\nbehind changes and new risks and limitations associated with them to comply with the Standard. A reasonable investor would want to know about\nthis so they could determine if the new strategy meets their investment objectives (Choice A).\n(Choice C) It is not required that Van Eeden disclose information surrounding the small-cap strategy since continuing to focus on the small-cap\nstrategy is not a shift in strategy.\nThings to remember:\nStandard V(B) Communication with Clients and Prospective Clients requires members and candidates to disclose to current and prospective\nclients any changes in the basic format and general principles of the investment processes. Disclosures allow clients to decide whether the\nstrategy changes still align with their risk and return objectives.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 72, "q": "Fatima Hakem, CFA, is a trader at Lakefront Capital. On Monday, Hakem receives a report from Saad Murad, one of Lakefront's research analysts, who adds Global Materials to his list of most recommended stocks based on the company receiving government approval for a new gold mine. Murad's report was simultaneously sent out to clients that morning based on Lakefront's best practices. On Wednesday, Hakem receives an order from one of her largest clients. The client wants to sell positions in the metals and mining industry, including its position in Global Materials, in order to rotate into the technology sector. To comply with Standard III(B) Fair Dealing, Hakem's most appropriate action would be to:", "opts": ["place the client's order since the report was already disseminated.", "refuse the client's order since it conflicts with Murad's recommendation.", "inform the client of Murad's change in recommendation before placing the order."], "ans": "C", "expl": "\"Members and Candidates must deal fairly and objectively with all clients when providing investment analysis,\nmaking investment recommendations, taking investment action, or engaging in other professional activities.\"\nStandard III(B) Fair Dealing requires Members and Candidates to treat all clients fairly when recommending investments or undergoing investment\nactions on their behalf. Analysts who prepare investment recommendations must ensure that their opinion is disseminated in a way that\nprovides all clients a fair opportunity to act on the recommendation.\nHowever, not all clients receive and consume new recommendations right away, which may lead them to make investment decisions they\notherwise would not have made. Therefore, when an analyst changes a recommendation, clients who place orders contrary to the new\nrecommendation should be advised of the change.\nIn this scenario, Fatima Hakem should inform the client about the change in recommendation on Global Materials since the client's order is\ncontrary to Saad Murad's recommendation. Placing the order before informing the client violates the Standard since it is Hakem's responsibility to\nconfirm that the client received the most recent recommendation (Choice A). Since the report was sent out only two days earlier, it is reasonable\nto assume the client may not have seen it. Once the client is advised of the recommendation, however, Hakem is obligated to fulfill the client's\nrequest (Choice B).\nThings to remember:\nStandard III(B) Fair Dealing requires Members and Candidates to treat all clients fairly, so investment recommendations must be disseminated in a\nway that provides all clients a fair opportunity to act on the recommendation. Analysts must ensure that clients are aware of relevant changes in\nrecommendations before placing orders.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 73, "q": "Chang Xue, CFA, is hired as an associate research analyst by Phoenix Capital, where she helps her senior analyst in writing research reports. After several months, Chang notices that her senior analyst receives material nonpublic information during discussions with management of covered companies. She suspects this information is sometimes used to change the recommendations on those companies, although the specific information is not disclosed in the research reports. Acting on material nonpublic information is against the law in the country where Phoenix operates, but since the report does not disclose any material nonpublic information, Chang is not sure what to do. She brings this up to Li Tengfei, the chief compliance officer for Phoenix. Li tells Chang that she would not be found guilty of breaking the law since no information is disclosed in the report, so she should continue to assist in writing the reports. To best comply with the Standards, Chang should: ", "opts": ["dissociate from her role collecting data for her senior analyst.", "do nothing since she is not the person using material nonpublic information.", "do nothing since she received approval to continue from the firm's compliance officer."], "ans": "A", "expl": "\"Members and Candidates must understand and comply with all applicable laws, rules, and\nregulations (including the CFA Institute Code of Ethics and Standards of Professional Conduct) of\nany government, regulatory organization, licensing agency, or professional association governing\ntheir professional activities. In the event of conflict, Members and Candidates must comply with the\nmore strict law, rule, or regulation. Members and Candidates must not knowingly participate or\nassist in and must dissociate from any violation of such laws, rules, or regulations.\"\nStandard I(A) Knowledge of the Law requires Members and Candidates to understand the laws of all countries where they reside and do business\nin order to know if their actions may contribute to violations. If an action that a Member or Candidate assists with is believed to be a violation, the\nMember or Candidate should notify a supervisor or the firm's compliance department to stop the action. If the violation continues, the\nStandard requires the Member or Candidate to dissociate from the action.\nWhen there is doubt if an action is a violation, the Member or Candidate should seek advice of legal counsel or compliance personnel.\nHowever, this advice does not absolve the Member or Candidate from potential violations of the Standard if the action is illegal. Members and\nCandidates are still required to know local laws and report on or dissociate from violations, if necessary (Choice C).\nIn this scenario, Chang has already brought the potential violation to the attention of the firm's compliance department. Based on the Standard,\nChang's next step should be to dissociate from the activity.\n(Choice B) Although Chang is not the person using material nonpublic information, she is still required to report on or dissociate from violations, if\nnecessary.\nThings to remember:\nStandard I(A) requires Members and Candidates to understand the laws of all countries where they reside and do business. When in doubt about\na possible violation, the Member or Candidate should seek advice of legal counsel or compliance personnel. Members and Candidates should\nfirst report a violation to a supervisor or compliance department; if the violation continues, the Member or Candidate should dissociate from the\nactivity.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 74, "q": "Munira Alam, CFA, is a financial adviser for Rahmi Hadi. Hadi reads a report about Force Gaming Inc. (FGI) and calls Alam to purchase the stock. After thorough research, Alam concludes that FGI is too risky for the parameters of Hadi's investment policy statement (IPS), although the amount of the proposed purchase would have only a minimal effect on his overall portfolio. She calls Hadi to inform him about the risk. Hadi acknowledges Alam's warning but insists that FGI stock be added to his portfolio, even if the IPS must be modified. To comply with the Standards, Alam should:", "opts": ["purchase FGI based on Hadi's request.", "cease her advisory relationship with Hadi.", "refuse to purchase FGI for Hadi's portfolio."], "ans": "A", "expl": "\"When Members and Candidates are in an advisory relationship with a client, they must:\nb. Determine that an investment is suitable to the client's financial situation and consistent with the client's written\nobjectives, mandates, and constraints before making an investment recommendation or taking investment action.\nc. Judge the suitability of investments in the context of the client's total portfolio.\"\nStandard III(C) Suitability addresses the adviser's responsibility for assessing the suitability of investments for each client. This responsibility\nentails researching a client's specific investment goals, constraints, and risk tolerance. These form the building blocks of the client's investment\npolicy statement (IPS) and determine the suitability of proposed investments.\nClients sometimes wish to make investments that do not align with their IPSs. In such a case, the Member or Candidate should discuss the\nproposed investment with the client before making the trade, explaining why the investment diverges from the IPS. If the investment has\nminimal impact on the portfolio, the Member or Candidate can purchase the investment without modifying the IPS after receiving the proper client\napproval, subject to the firm's guidelines.\nIn this scenario, Munira Alam may purchase Force Gaming Inc. (FGI) stock for Rahmi Hadi's portfolio since she educated him on the deviation\nbetween the stock's risk profile and the IPS and received Hadi's acknowledgment that the position is inconsistent with his current IPS.\n(Choice B) Alam would have to consider ceasing her advisory relationship with Hadi only if the unsolicited trade were material to Hadi's portfolio\nand he refused to update his IPS.\n(Choice C) Alam does not have to refuse to purchase FGI stock even though it does not align with Hadi's IPS. Since the trade will be immaterial\nto Hadi's portfolio, Alam only needs to educate Hadi and have him acknowledge that the trade is inconsistent with his IPS.\nThings to remember:\nWhen a client requests an investment that does not align with the client's own investment policy statement, the Member or Candidate should\ndiscuss the investment with the client. If the investment has minimal impact on the portfolio, the Member or Candidate can purchase the\ninvestment, according to the firm's guidelines, on client approval.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 75, "q": "Gaurav Khatri is taking the Level I CFA exam. During the break between sessions of the exam, he considers some questions he struggled with in Session 1 but cannot remember all the details. He decides to bring a piece of blank scratch paper from his car into the exam room. During Session 2, Khatri writes a few key words from difficult questions on the scratch paper so that he can confirm the calculations later at home. However, he does his math for the exam on writing materials provided by the proctors. After the exam, he returns these writing materials with his math to the proctors but he keeps the scratch paper containing the key words. Khatri violates Standard VII(A) Conduct as Participants in CFA Institute Programs:", "opts": ["only by using scratch paper.", "only by taking his notes from the exam room.", "both by using scratch paper and taking his notes from the exam room."], "ans": "C", "expl": "\"Members and Candidates must not engage in any conduct that compromises the reputation or integrity of CFA Institute or the\nCFA designation or the integrity, validity, or security of CFA Institute programs.\"\nStandard VII(A) mandates that Members and Candidates maintain the reputation, integrity, validity, and security of CFA Institute's exams and\nprograms. The Standard prohibits behavior that would compromise the public's confidence in the level of merit needed to achieve a CFA charter.\nEach Candidate taking a CFA exam must adhere to the Candidate Agreement, which prohibits cheating and misconduct on any CFA Institute\nexams. This includes any violation of the policies or practices of test administration.\nIn this scenario, Gaurav Khatri violates the Standard by using paper brought from outside the exam room. Candidates are allowed to write only on\nthe materials provided by CFA Institute for taking notes and doing math. Scratch paper brought from outside the exam room cannot be tracked,\nwhich compromises the security and integrity of the exams. Khatri further violates the Standard by taking the scratch paper with notes about the\nexam out of the testing room (Choices A and B).\nThings to remember:\nStandard VII(A) mandates that Members and Candidates act in an ethical manner regarding the CFA exams and CFA Institute's other programs.\nThe Candidate Pledge prohibits cheating and misconduct by Candidates on any CFA Institute exams.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 76, "q": "Beau Chamberlain, CFA, a manager at Flex Securities, is responsible for revamping Flex's compliance system. His supervisor tells him, \"The best way to eliminate conflicts of interest is to thoroughly review personal trades.\" According to Standard VI(B) Priority of Transactions, which of the following is most likely a recommended practice? Flex should:", "opts": ["receive duplicate trade confirmations from employees.", "identify all employee client accounts to ensure nonemployee client accounts trade first.", "disseminate notice of the blackout period to prevent client trades in restricted securities."], "ans": "A", "expl": "\"Investment transactions for clients and employers must have priority over investment transactions in which a Member or\nCandidate is the beneficial owner.\"\nStandard VI(B) Priority of Transactions requires employees to give clients ample time to act on an investment decision before transacting for\nthemselves. Employees' personal transactions should never harm a client's portfolio. Personal transactions include activity in accounts of\nEmployees\nSpouses, children, or other immediate family members\nEmployees that have indirect beneficial financial interests (eg, trust)\nOne recommended firm procedure is to require employees to deliver copies of trade confirmations to their employers. This provides:\nDocumentation of all purchases and sales\nProof the firm monitors employees' trading\nFewer conflicts due to personal trading\n(Choice B) Employee and nonemployee client accounts trade simultaneously; nonemployee accounts do not trade first.\n(Choice C) Blackout periods prevent employees, not clients, from placing any trades in a security just before the firm intends to transact for\nclients (ie, prevents front-running of restricted securities). This usually applies to transactions of substantial size.\nThings to remember:\nA recommendation to comply with the Standard VI(B) Priority of transactions is for employees to give their employer duplicate trade confirmations.\nThis helps identify employees' purchases and sales, provides proof of monitoring, and results in the firm having fewer conflicts due to personal\ntrading.\nRecommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 77, "q": "Deshawn Walker, CFA, and Jevon Glover, MD, grew up together and remain close friends today. Walker is a manager at Primary Partners Associates (PPA) and works on the Small Cap Sciences Fund, which focuses on health-care securities with great upside potential. Glover recently left his medical practice and now works for a sell-side securities firm where he is researching Cancer Advances Corp. (CAC), a company that uses artificial intelligence to design cancer drugs. CAC has yet to become profitable, but Glover feels optimistic based on its pipeline. He strongly suggests that Walker take a position in CAC since he expects the company to outperform. Walker conducts thorough due diligence and concludes that CAC is riskier than its peers but also that the company could see significantly higher returns if regulators approve certain drugs. Therefore, he deems CAC appropriate for the Small Cap Sciences Fund. Regarding the purchase of CAC stock for the fund, Walker will most likely comply with Standard VI(A) Disclosure of Conflicts if he:", "opts": ["adds an insignificant position in CAC to the fund, so disclosure is unnecessary.", "explains to Glover that he cannot buy CAC since a conflict of interest exists between them.", "adds a significant position in CAC to the fund after he informs PPA of his relationship with Glover."], "ans": "C", "expl": "\"Members and Candidates must make full and fair disclosure of all matters that could reasonably be expected to impair their independence and\nobjectivity or interfere with respective duties to their clients, prospective clients, and employer. Members and Candidates must ensure that such\ndisclosures are prominent, are delivered in plain language, and communicate the relevant information effectively.\"\nWhen a conflict interferes with a member's ability to conduct unbiased investment evaluations, the member's employer must be informed of\nthe conflict to comply with Standard VI(A) Disclosure of Conflicts.\nFor example, a member who feels pressured by personal loyalty to a friend may be impeded from making impartial decisions and acting in the\nemployer's best interest. Therefore, to comply with the Standard, Walker must disclose his relationship with Glover to Primary Partners\nAssociates (PPA). Walker may subsequently purchase Cancer Advances Corp. (CAC) since, after performing due diligence, he believes the\ncompany is appropriate for the fund.\n(Choice A) Since a conflict of interest exists between them, Walker must disclose his relationship with Glover before purchasing shares of CAC\nfor the fund, regardless of the size of the transaction.\n(Choice B) A conflict of interest, if resolved, does not necessarily result in the prohibition of behavior. Since Walker believes CAC is suitable for\nthe fund, once his relationship with Glover is disclosed and PPA has no objections, the purchase can be made.\nThings to remember:\nWhen a conflict interferes with a member's ability to be impartial, the member's employer must be informed to comply with Standard VI(A)\nDisclosure of Conflicts. Since pressure from contacts may impede members or candidates from acting in the employer's best interest, relevant\npersonal relationships must be disclosed.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 78, "q": "Tony Fernandez, CFA, is an analyst who provides investment recommendations to clients of Johan Investment Management (JIM). Mercedes Chevela, CFA, president of JIM, gives freedom to each analyst to develop diverse recommendations. Chevela's philosophy is to be the first with new ideas, so she streamlined JIM's research operations and eliminated her review of the analysts' work. All analysts deliver their recommendations to clients the same day they are made and are solely responsible for its content. As part of Fernandez's research efforts, he sometimes checks certain websites to get a sense of how \"hot\" a stock currently is. He also examines the company's financial statements, third- party research, and quantitative forecasts, which he believes cover all important issues. Over the last year, most of his sell recommendations have proven to be wrong. To ensure compliance with Standard V(A) Diligence and Reasonable Basis, the most appropriate recommended action is that:", "opts": ["Fernandez should exclude internet rumors as part of his research.", "Chevela should reinstate a review process to ensure diligence when making investment recommendations.", "Fernandez should redesign his analysis since it lacks a reasonable basis, as proven by his consistently inaccurate recommendations."], "ans": "B", "expl": "\"Members and Candidates must:\n1. Exercise diligence, independence, and thoroughness in analyzing investments, making investment\nrecommendations, and taking investment actions.\n2. Have a reasonable and adequate basis, supported by appropriate research and investigation, for any\ninvestment analysis, recommendation, or action.\"\nTo reach an investment recommendation, each analyst may take different steps in conducting investment research. However, identifiable criteria\nshould be measured when evaluating the research's quality. Under Standard V(A) Diligence and Reasonable Basis, it is recommended that\nanalysts and supervisors establish policies and procedures that require analysts to substantiate that their research is reasonable.\nOne recommended procedure is that supervisors should review and approve analysts' claims of a reasonable basis; this should be completed\nprior to disseminating investment advice. If this is not done it raises uncertainty as to the thoroughness of diligence. Here, Chevela streamlined\noperations and does not evaluate each analyst's research. Reinstating a review process would lead to a greater level of diligence.\n(Choice A) Analysts use information from diverse sources; these may include company reports, third-party research, or quantitative data.\nFernandez does not violate the Standard since he combines internet opinions with other information that he believes is thorough.\n(Choice C) Conducting research with a reasonable basis does not eliminate downside risk since analysts make decisions based on information\navailable at a point in time. The process of coming to the conclusion, not the correctness or consistency of the results, determines whether the\nresearch has a reasonable basis.\nThings to remember:\nAnalysts and supervisors should establish policies and procedures to ensure that research is conducted diligently and has a reasonable basis.\nSupervisors should review and approve analysts' claims of reasonability to ensure prior to disseminating the recommendation.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 79, "q": "Rhianne Bridges, CFA, oversees a group of junior equity analysts for an asset management firm. Some of the analysts are charterholders or candidates for the CFA designation, and others are not. Bridges discovers that Frank Parsons, an analyst who is neither a member nor a candidate, has accepted tickets to a sporting event from a client without first advising her or the firm. Parsons' action constitutes a violation of CFA Institute's Code and Standards concerning disclosure of additional compensation. Bridges reports the incident to her supervisors and warns Parsons not to do this again. However, a month later, Parsons accepts tickets to a sold-out concert from a different client, again without notifying Bridges or the firm. Has Bridges most likely violated Standard IV(C) Responsibilities of Supervisors? ", "opts": ["Yes.", "No, since Parsons does not need to follow the Code and Standards.", "No, since she told Parsons not to repeat the conduct and reported it to her supervisors."], "ans": "A", "expl": "\"Members and Candidates must make reasonable efforts to ensure that anyone subject to their supervision or\nauthority complies with applicable laws, rules, regulations, and the Code and Standards.\"\nStandard IV(C) Responsibilities of Supervisors requires members and candidates who supervise employees to take reasonable steps to\nensure those employees, even employees who are not members or candidates, comply with the Code and Standards. Therefore, Bridges must\ncomply with the Standard with respect to all the employees she supervises, not just charterholders and candidates (Choice B).\nAlthough Bridges warned Parsons not to accept tickets from clients without first getting clearance and notified her supervisors of the initial incident,\nthese steps alone are insufficient to comply with the Standard (Choice C). CFA Institute's guidance for Standard IV(C) also requires that\nsupervisors take appropriate steps to ensure that the prohibited conduct does not recur. These steps can include:\ninvestigating thoroughly to assess the extent of the violation(s),\nrestricting and/or monitoring the employee's activities, and\nconsidering changes to existing procedures to prevent future violations.\nThings to remember:\nMembers and candidates who serve as supervisors are responsible for taking reasonable steps to ensure that all employees they supervise, not\njust employees who are members or candidates, comply with the Code and Standards. A supervisor who discovers an employee's violation must\ntake reasonable steps to prevent future violations. These steps can include restricting and/or monitoring the employee's activities and considering\nchanges in existing procedures to prevent recurring violations.\nRecommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 80, "q": "Rachel Barrett, CFA, is in charge of calculating and disseminating the investment performance of client accounts. In her calculations, she identifies a material error due to a reporting system failure. Due to this error, the past performance of the firm's largest client, a large endowment, was understated: the client realized a gain instead of a reported loss. If the endowment's trustees discover this error, it is unclear if the trustees will terminate Barrett's firm. If they do terminate, her firm will lose a significant amount of revenue and Barrett's bonus would be negatively affected. Standard III(A) Loyalty, Prudence, and Care, most likely:", "opts": ["requires Barrett to report the error.", "does not require Barrett to report the error since it is in the client's favor.", "does not require Barrett to disclose the error since she must act for the benefit of her firm."], "ans": "A", "expl": "\"Members and Candidates have a duty of loyalty to their clients and must act with reasonable care and exercise\nprudent judgment. Members and Candidates must act for the benefit of their clients and place their clients'\ninterests before their employer's or their own interests.\"\nStandard III(A) Loyalty, Prudence, and Care requires members and candidates to be loyal to clients and use reasonable care. One application\nof the Standard is how members and candidates communicate errors to clients.\nHere, the Standard requires that Barrett disclose the error. Her loyalty to the client supersedes her loyalty to her employer or her own interests\n(loss of bonus or revenue). Regardless of the error's impact, reasonable investors would want to know the facts surrounding the error to make\nan investment decision (Choice B).\n(Choice C) Under Standard IV(A), Barrett has a duty to her employer; however, when the duty to the employer conflicts with the duty to the client,\nthe duty to the client always takes priority over the duty to the employer.\nThings to remember:\nUnder Standard III(A), members and candidates must be loyal to clients and use reasonable care. Members and candidates demonstrate loyalty\nby putting client interests ahead of their own or their employer's interests. To comply with the Standard, errors must be disclosed to the client.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 81, "q": "Sarah Paxton, CFA, works as an investment adviser at a bank. When a client is interested in buying a home, she refers them to Susan Jones, a friend and real estate agent. Jones reciprocates by referring real estate clients to Paxton when appropriate. Since Paxton and Jones are both skilled and respected professionals, each believes the referrals benefit their clients and are in the clients' best interest. According to Standard VI(C) Referral Fees, Paxton is most likely: ", "opts": ["required to disclose this arrangement to both her employer and clients.", "not required to disclose this arrangement because she believes the clients benefit.", "not required to disclose this arrangement because no money is exchanged between Paxton and Jones."], "ans": "A", "expl": "\"Members and Candidates must disclose to their employer, clients, and prospective clients, as appropriate, any compensation,\nconsideration, or benefit received from or paid to others for the recommendation of products or services.\"\nStandard VI(C) Referral Fees requires Members and Candidates to notify their employers, existing clients, and prospective clients of benefits\nreceived for recommending a product or service. Disclosing referral fee arrangements allows employers and clients to determine whether\nconflicts of interest exist and whether a recommendation is impartial. Referral fees are broadly defined and include any cash or noncash rewards\n(eg, tickets to a sporting event).\nIn this question, Paxton has entered into an agreement with Jones to mutually refer clients when appropriate, which is beneficial for both Paxton\nand Jones. Therefore, Paxton is required to disclose this information to both her employer and clients although no direct money transfer is\ninvolved (Choice C).\n(Choice B) The fact that Paxton believes the clients benefit from the arrangement does not preclude Paxton from the disclosure requirement of\nthe Standard.\nThings to remember:\nMembers and Candidates must notify their employers, existing clients, and prospective clients of any benefits received for recommending a\nproduct or service. This disclosure allows employers and clients to determine whether conflicts of interest exist.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 82, "q": "For CFA Institute Members and Candidates, which of the following best describes an action that violates the Code and Standards?", "opts": ["Delegating supervisory duties to subordinates who are not charterholders", "Accepting supervisory responsibility if the compliance system is inadequate", "Failing to detect violations despite instituting an effective compliance system"], "ans": "B", "expl": "\"Members and Candidates must make reasonable efforts to ensure that anyone subject to their supervision or\nauthority complies with applicable laws, rules, regulations, and the Code and Standards.\"\nStandard IV(C) Responsibilities of Supervisors requires Members and Candidates who supervise employees to encourage behavior that complies\nwith local laws, rules established by their firms, and the Code and Standards. They also must take reasonable steps to detect and prevent\nviolations. A Member or Candidate who encounters an inadequate compliance system should bring the shortcomings of the system to the\nattention of the company's managers and make recommendations for corrective actions.\nAny Member or Candidate who is prevented from carrying out supervisory responsibilities due to these shortcomings should decline in writing to\ntake on supervisory responsibility until the compliance system is fixed and is allowing for adequate controls. Accepting a supervisory role\nwhen the compliance system is inadequate would not allow the Member or Candidate to promote compliance by subordinates and thus would\nviolate the Standard.\n(Choice A) Under Standard IV(C), supervisors who supervise large numbers of employees can delegate supervision. The employee to whom\nthose supervisory responsibilities are delegated does not have to be a CFA charterholder.\n(Choice C) Supervisors should make a reasonable effort to detect unethical behavior. However, failing to detect such behavior does not imply a\nviolation of the Standard as long as the supervisor ensures that a proper compliance system is in place. In such a case, the system may need to\nbe reviewed.\nThings to remember:\nWhen Members or Candidates encounter an inadequate compliance system, they should bring the shortcomings of the system to the attention of\ncompany managers and make recommendations for corrective actions. Members and Candidates should decline in writing to take on supervisory\nresponsibility until the compliance system is fixed and is allowing for adequate controls.\nRecommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 83, "q": "Regina Garcia, CFA, is the equity trader at Rushmore Advisors (RA), an institutional buy-side firm. RA's normal business practice is to pay a standard commission rate of $0.02 per share for all stock trades. This $0.02 commission pays for the cost of both research and trade execution. RA has trading relationships with two firms: Execution Only, Inc. (EO), where RA has committed to a minimum amount of soft dollar commissions to pay for research, and Integrated Brokers, for all other trades. Trading activity has been lower than expected, and Garcia determines that the standard $0.02 per share commission will be insufficient to cover the cost of RA's soft dollar commitments to EO for the year. To prevent a shortfall, Garcia allocates most trades to EO and increases the commission rate paid to EO to $0.05 per share. According to Standard III(A) Loyalty, Prudence, and Care, did Garcia most likely violate the Standards? ", "opts": ["Yes", "No, since Garcia has a duty of loyalty to her employer", "No, since soft dollar arrangements are acceptable under the Code and Standards"], "ans": "A", "expl": "\"Members and Candidates have a duty of loyalty to their clients and must act with reasonable care and exercise prudent\njudgment. Members and Candidates must act for the benefit of their clients and place their clients' best interests before their\nemployer's or their own interests.\"\nInvestment managers pay a commission to a broker to execute client trades. Soft dollar brokerage is the practice of using a portion of\nbrokerage commissions to purchase investment research and related services. When a portion of the commission is used to purchase\nadditional investment services (ie, soft dollars), the services \"belong\" to the client since the client indirectly \"pays\" the commission (ie, out of client\nassets). The investment manager has a duty of loyalty to use such assets for the benefit of the client.\nIn this instance, Garcia and the investment manager violated the duty of loyalty to the client by paying a higher-than-normal commission\nrate for the exclusive purpose of generating soft dollar commissions.\nThe client will not receive any additional benefit from paying the higher commission since no additional research will be provided to\nRushmore Advisors (RA).\nThe only benefit of paying a higher commission was to satisfy RA's prior commitment to Execution Only, Inc., which is not the client's\nresponsibility.\n(Choice B) Garcia has a duty of loyalty to her employer (ie, ensure appropriate allocation of commissions) but not at the expense of the client.\n(Choice C) Soft dollar arrangements are acceptable under the Code and Standards, but it is not acceptable for clients to pay a higher-than-\nnormal brokerage commission without commensurate client benefit.\nThings to remember:\nSoft dollar brokerage is the practice of using a portion of brokerage commissions to pay for investment research. The portion of trading\ncommissions used to purchase research is considered an asset of the client, not the investment manager. The manager has a duty of loyalty to\nuse this asset for the benefit of the client.\nRecommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 84, "q": "Maria Garcia, CFA, is a sell-side analyst at Sharp Brokerage. Garcia is preparing a research report on Kicks, Inc., a popular athletic shoe manufacturer. Sharp Brokerage is a market maker in Kicks, Inc. Garcia is familiar with Kicks as she was on the investment banking team at a former employer that brought Kicks public two years ago. Garcia also has a childhood friend who is now a professional athlete and occasionally receives free Kicks apparel. According to Standard VI(A) Disclosure of Conflicts, the research report should most appropriately disclose:", "opts": ["Garcia's history with Kicks' initial public offering.", "Garcia's friendship with the professional athlete.", "that Sharp Brokerage is a market maker of Kicks."], "ans": "C", "expl": "\"Members and Candidates must make full and fair disclosure of all matters that could reasonably be expected to impair their\nindependence and objectivity or interfere with respective duties to their clients, prospective clients, and employer. Members and\nCandidates must ensure that such disclosures are prominent, are delivered in plain language, and communicate the relevant\ninformation effectively.\"\nStandard VI(A) Disclosure of Conflicts aims to protect employers and clients by promoting transparency, allowing them to evaluate whether a\nMember or Candidate is acting independently and objectively when offering investment advice or recommendations. When a conflict can be\nreasonably viewed as interfering with a Member's or Candidate's ability to conduct unbiased investment evaluations, the employer and\nclients must be informed on all pertinent details of the conflict.\nIn this instance, it is the broker/dealer (ie, Sharp Brokerage) who must notify clients that the firm is a market maker in the securities included in\nthe report. This disclosure alerts the client that the firm may have a potential conflict in that it likely holds shares of Kicks in its own account for\nmarket-making purposes.\n(Choice A) Garcia's involvement in the IPO of Kicks two years ago with a previous employer does not create an ongoing or perpetual conflict.\nGarcia does not have a disclosable relationship with the company currently.\n(Choice B) The fact that Garcia has a friend who is a professional athlete who occasionally receives free Kicks apparel is too tangential (indirect)\nand minor to cause a conflict.\nThings to remember:\nStandard VI(A) Disclosure of Conflicts addresses the responsibility of members and candidates to disclose actual and potential conflicts of\ninterests to clients, prospective clients, and employers so they can determine whether the conflict might influence a candidate's or member's\nobjectivity.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 85, "q": "Ivan Petrovich, CFA, manages the Emerging Markets Private Equity Fund. Twelve of the fund's 87 holdings may go a week or more without a quoted price. Petrovich believes that this is normal for some private equity holdings, so when reporting performance he uses the last available market price for the holdings that do not price daily. According to Standard III(D) Performance Presentation, Petrovich should:", "opts": ["provide only GIPS-compliant performance reports to potential clients.", "inform current and potential clients about the fund's pricing methodology.", "remove unpriced securities from the fund's public performance reports."], "ans": "B", "expl": "\"When communicating investment performance information, Members and Candidates must make reasonable\nefforts to ensure that it is fair, accurate, and complete.\"\nStandard III(D) Performance Presentation stipulates that Members and Candidates must use credible performance data to assess performance\nand present a fair and complete report. Therefore, Members and Candidates must disclose information that can help clients evaluate a firm's\nperformance. In this scenario, if Ivan Petrovich does not inform clients about the fund's pricing methodology, he violates the Standard.\n(Choice A) Petrovich is not required to show potential clients only GIPS-compliant reports. Firms may elect to comply with GIPS, but Standard\nIII(D) does not require GIPS compliance.\n(Choice C) Since reports must be as complete as possible, excluding some securities would violate the Standard.\nThings to remember:\nAccording to Standard III(D), Members and Candidates must communicate fair and accurate performance data to all clients and disclose\ninformation (eg, pricing methodology) that can help clients evaluate a firm's performance. Firms may elect to comply with GIPS, but the Standard\ndoes not require GIPS compliance. Performance reports must include all securities.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 86, "q": "Matthew Beck, CFA, recently joined an investment management firm as a senior analyst after many years of working in the same role for a competitor. Beck's spouse is a director of a publicly traded company that Beck will cover for his new employer. His spouse has been a director for several years, and Beck wrote analyst reports about the company for his previous employer. Beck also serves as a trustee for the youth soccer association in his town. Part of his responsibilities as a trustee is to coordinate the association's fundraising efforts, but Beck does not directly solicit money. The association is a relatively new entity, and Beck anticipates a significant time commitment for the next several months. Standard VI(A) Disclosure of Conflicts most likely requires Beck to disclose to his new employer:", "opts": ["his spouse's directorship only.", "both his spouse's directorship and his soccer trusteeship.", "neither his spouse's directorship nor his soccer trusteeship."], "ans": "B", "expl": "\"Members and Candidates must make full and fair disclosure of all matters that could reasonably be expected to\nimpair their independence and objectivity or interfere with respective duties to their clients, prospective clients,\nand employer. Members and Candidates must ensure that such disclosures are prominent, are delivered in plain\nlanguage, and communicate the relevant information effectively.\"\nStandard VI(A) Disclosure of Conflicts defines a conflict as a matter that reasonably could be expected to \"impair [members' or candidates']\nindependence or objectivity or interfere with their respective duties….\" Beck's spouse serves as a director of a company that Beck will be covering\nas an analyst. This must be disclosed since it potentially interferes with Beck's objectivity. It is irrelevant that Beck wrote reports on the company\nfor his previous employer since he cannot assume the new employer is aware of the relevant facts.\nThe Standard includes all conflicts, not just financial conflicts. Beck's soccer trusteeship is a potential conflict since Beck will have to devote\nsignificant time to the association in the coming months. This could interfere with his duties to his employer as well as to his clients. The Standard\ndoes not require an actual conflict to exist to trigger disclosure, only that one could \"reasonably be expected\" to occur (Choice A).\n(Choice C) Both Beck's spouse serving as a trustee of a company that Beck will be covering as an analyst and his soccer trusteeship pose actual\nor potential conflicts of interest, which Standard VI(A) requires him to disclose to his new employer.\nThings to remember:\nStandard VI(A) Disclosure of Conflicts requires members (and candidates) to disclose actual and potential conflicts of interest to clients, potential\nclients, and employers. A conflict is a matter that either impairs (or potentially impairs) objectivity or independence or interferes with the member's\nduties to a client, potential client, or employer.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 87, "q": "Geetha Patel, CFA, is a gaming company analyst at a large investment bank. Red Tiger Gaming, one of the companies she analyzes, opens a new casino and hotel in Macau and invites gaming analysts from several firms to take a tour and meet the CEO. Red Tiger offers to pay for the analysts' commercial flights to Macau. It also offers to pay for all of the analysts' accommodations in the new hotel's luxury suites, which are closest to the conference hall where they will meet the CEO, although other accommodations are available nearby. According to Standard I(B) Independence and Objectivity, if other flights and hotels are available, Patel's most appropriate course of action is to decline the:", "opts": ["flight and hotel accommodations.", "flight but accept the hotel accommodations.", "hotel accommodations but accept the flight."], "ans": "A", "expl": "\"Members and Candidates must use reasonable care and judgment to achieve and maintain independence and objectivity in their professional\nactivities. Members and Candidates must not offer, solicit, or accept any gift, benefit, compensation, or consideration that reasonably could be\nexpected to compromise their own or another's independence and objectivity.\"\nStandard I(B) Independence and Objectivity focuses on ensuring that Members and Candidates who are investment professionals avoid any\nactions that compromise their independence and objectivity. The Standard also pertains to actions that could create a conflict of interest.\nAccepting travel arrangements or accommodations from a company being analyzed should be avoided whenever possible since clients or\ncolleagues could perceive it as compromising the analyst's objecivity. If there are reasonable alternatives for travel and accommodations,\naccepting those offered by the subject company violates Standard I(B).\nBest practice is to use\ncommercial transportation and modest accommodations\nat the expense of the analyst or the analyst's employer.\nIf other commercial transportation or lodging is unavailable, travel can be accepted from the subject company.\nIn this scenario, since other flights and hotels are available, Patel's best course of action is to decline the flight and hotel accommodations and pay\nfor both herself (or have her employer pay). Accepting the accommodations from Red Tiger would be especially inappropriate since best practice\nsuggests accepting only modest accommodations (and only if necessary)—not a luxury suite (Choices B and C).\nThings to remember:\nAccording to Standard I(B) Independence and Objectivity, investment analysts should avoid accepting any offer that could create the perception\nthat their independence and objectivity are compromised. Whenever possible, recommendations call for using commercial transportation and\naccommodations paid for by the analyst or the analyst's employer.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and Standards", "qhtml": null}, {"n": 88, "q": "Donota Rosa, CFA, currently works with her best friend and supervisor Maria Danek, CFA, at Broadwick Investment Partners (BIP). BIP is a private equity firm with award-winning funds. Each of BIP's funds has a $20 million investment minimum for new investors. After working with Danek for two years, Rosa leaves BIP to start her own firm. Six months later, Danek helps Rosa by convincing BIP's management to waive the $20 million investment minimum exclusively for Rosa's clients, but the exclusivity will last for only one month. Rosa clearly remembers how well BIP managed its funds and, based on her memory, is convinced it is an ideal investment for clients. Grateful for this assistance and to meet the one-month deadline, she quickly jumps at the opportunity and immediately recommends BIP's funds. With respect to the Standard V(A) Diligence and Reasonable Basis, does Rosa most likely violate the Standard?", "opts": ["No.", "Yes, since she has a personal relationship with Danek.", "Yes, since she relies on her memory to make an investment decision."], "ans": "C", "expl": "\"Members and Candidates must:\nExercise diligence, independence, and thoroughness in analyzing investments, making investment\nrecommendations, and taking investment actions.\nHave a reasonable and adequate basis, supported by appropriate research and investigation, for any\ninvestment analysis, recommendation, or action.\"\nStandard V(A) Diligence and Reasonable Basis requires members and candidates to exercise diligence and thoroughness when making\ninvestment decisions. While there is no exact policy or procedure that the Standard demands, appropriate and diligent research must be\ncompleted.\nHere, Rosa believes that the funds of Broadwick Investment Partners (BIP) are an ideal investment based on her memory and experience while\nworking at BIP. However, BIP may have changed its investment process or the funds' underlying securities over the last six months; based on\ncurrent research, she might have a different investment recommendation.\nTo comply with the Standard, regardless of limited time or personal relationships, Rosa must exercise diligence by conducting her own thorough\nreview of the funds. Memory or past experiences are inadequate justifications and are not reasonable bases to make investment decisions\n(Choice A).\n(Choice B) Rosa does not violate the Standard by having a personal relationship with another investment manager. While Danek does assist\nRosa, Rosa must do her own work in making an investment recommendation.\nThings to remember:\nStandard V(A) Diligence and Reasonable Basis requires members and candidates to exercise diligence when making investment decisions.\nWhile there is no specific procedure that the Standard demands, proper research should be completed in a thorough and diligent manner. Merely\nrelying on memory and experience is not a reasonable basis for making investment decisions.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to situations involving issues of professional integrity", "qhtml": null}, {"n": 89, "q": "According to Standard II(A) Material Nonpublic Information, which of the following best describes the concept of mosaic theory? A manager complies with the Standards by recommending an investment using:", "opts": ["material nonpublic information.", "public and nonpublic material facts.", "material public and nonmaterial nonpublic data."], "ans": "C", "expl": "\"Member and Candidates who possess material nonpublic information that could affect the value of an investment\nmust not act or cause others to act on the information.\"\nInformation is deemed material if it is likely to change the price of a security or if a reasonable investor would use it to evaluate an investment.\nInformation is considered nonpublic until it is widely disseminated. Analysts may not act on material nonpublic information but may act on\nmaterial public data or nonmaterial nonpublic data.\nThe mosaic theory is a research approach that recognizes that analysts form conclusions from various sources of information. Analysts may\nresearch collections of public and nonmaterial nonpublic data to piece together information (ie, a mosaic), leading to a conclusion. An analyst\nusing various sources of public and nonmaterial nonpublic information does not violate the Standard, even if the analyst reaches a conclusion\nthat could have been reached using material nonpublic information.\n(Choices A and B) An analyst acting on material nonpublic information would be in violation of Standard II(A). Such action is an inappropriate\napplication of the mosaic theory.\nThings to remember:\nThe mosaic theory is a research approach in which analysts piece together bits of information using material public or nonmaterial nonpublic data.\nAn analyst using various sources of public and nonmaterial nonpublic information does not violate Standard II(A) Material Nonpublic Information,\neven if the analyst reaches a conclusion that could have been reached using material nonpublic information.\nRecommend practices and procedures designed to prevent violations of the Code of Ethics and Standards of Professional Conduct", "qhtml": null}, {"n": 90, "q": "Patricia Murphy, CFA, is asked by her manager at the hedge fund firm Star Capital to create a marketing brochure for prospective clients. The firm has achieved the following returns: Star Capital Star Capital Market (actual) (risk-adjusted) 2
