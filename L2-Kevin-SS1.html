$1.13 for US$1. <\/p><p>Aakash Aasmani, CFA is trying to crack the Black Model for valuing options. The S&amp;P 500 Index (a spot  index) is presently at 1,860 and the 0.25 expiration futures contract is trading at 1,851.65. Suppose  further that the exercise price is 1,860, the continuously compounded risk-free rate is 0.2%, time to  expiration is 0.25, volatility is 15%, and the dividend yield is 2.0%. Based on this information, the  following results are obtained for options on the futures contract.               Options on Futures <\/p><div class=\"tbl\"><table><tr><td>Calls  <\/td><td>Puts <\/td><\/tr><tr><td>N(d1) =0.491  <\/td><td>N(–d1) = 0.509 <\/td><\/tr><tr><td>N(d2) = 0.461  <\/td><td>N(–d2) = 0.539 <\/td><\/tr><tr><td>c = US$51.41  <\/td><td>p = US$59.76 <\/td><\/tr><\/table><\/div><p>Riya Shah, CFA addresses her team: “Suppose we know S = 100, X = 100, r = 5%, T = 1.0, σ = 30%, and δ  = 5%. We have a short position in put options on 10,000 shares of stock. Based on this information, we  note Deltac = 0.532, and Deltap = –0.419. Assume each stock option contract is for one share of stock.  What could be the appropriate delta hedge?” <\/p><\/div><\/details><div class=\"qtext\"><p>Identify the statement that best describes how the Black model is used to value a European call<\/p><p>option on the futures contract just described by Aakash. <\/p><\/div>", "subj": "derivatives"}, {"n": 16, "q": "The appropriate delta hedge, assuming the hedging instrument is stock, is executed by which of the following transactions? Select the closest answer.", "opts": ["Buy 5,320 shares of stock.", "Short sell 4,190 shares of stock.", "Buy 4,190 shares of stock."], "ans": "B", "expl": "", "explhtml": "<p>(Tài liệu gốc không kèm lời giải cho câu này.)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mahendra Modi, CFA bought a one-year forward contract at 102, and there are now three months to  expiration. The underlying is currently trading for 110, and interest rates are 5% on an annual  compounding basis. <\/p><p>US company needs to borrow 100 million Australian dollars (A$) for one year for its Australian subsidiary.  The company decided to borrow in US dollars (US$) an amount equivalent to A$100 million by issuing  US-denominated bonds. The company then entered a one-year currency swap with a swap dealer. The  swap uses quarterly reset (30/360 day count) and exchange of notional amounts at initiation and at  maturity. At the swap’s expiration, the US company pays the notional amount in Australian dollars and  receives from the dealer the notional amount in US dollars. The fixed rates were found to be 2.7695%  for Australian dollars and 0.2497% for US dollars. Initially, the notional amount in US dollars was  determined to be US$87,719,298 with a spot exchange rate of A$1.14 for US$1. Assume 60 days have  passed since swap initiation and we now observe the following updated market information: <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/efs/s1-002.webp\" style=\"max-width:min(100%,478px)\" alt=\"\"><p>The currency spot exchange rate (St) is now A$1.13 for US$1. <\/p><p>Aakash Aasmani, CFA is trying to crack the Black Model for valuing options. The S&amp;P 500 Index (a spot  index) is presently at 1,860 and the 0.25 expiration futures contract is trading at 1,851.65. Suppose  further that the exercise price is 1,860, the continuously compounded risk-free rate is 0.2%, time to  expiration is 0.25, volatility is 15%, and the dividend yield is 2.0%. Based on this information, the  following results are obtained for options on the futures contract.               Options on Futures <\/p><div class=\"tbl\"><table><tr><td>Calls  <\/td><td>Puts <\/td><\/tr><tr><td>N(d1) =0.491  <\/td><td>N(–d1) = 0.509 <\/td><\/tr><tr><td>N(d2) = 0.461  <\/td><td>N(–d2) = 0.539 <\/td><\/tr><tr><td>c = US$51.41  <\/td><td>p = US$59.76 <\/td><\/tr><\/table><\/div><p>Riya Shah, CFA addresses her team: “Suppose we know S = 100, X = 100, r = 5%, T = 1.0, σ = 30%, and δ  = 5%. We have a short position in put options on 10,000 shares of stock. Based on this information, we  note Deltac = 0.532, and Deltap = –0.419. Assume each stock option contract is for one share of stock.  What could be the appropriate delta hedge?” <\/p><\/div><\/details><div class=\"qtext\"><p>The appropriate delta hedge, assuming the hedging instrument is stock, is executed by which of the<\/p><p>following transactions? Select the closest answer. <\/p><\/div>", "subj": "derivatives"}, {"n": 17, "q": "Calculate the payoff from each of the two possible outcomes of Winston’s merger arbitrage strategy. Outcome 1: Outcome 2:", "opts": ["+75000 -675000", "+75000 0", "0 -675000"], "ans": "A", "expl": "Proceeds from short selling 75,000 CA shares = 75,000 × €46 = €3,450,000 Cost of buying 225,000 DA shares = 225,000 × €15 = €3,375,000 Outcome 1 Net spread if the deal reaches a successful conclusion = €3,450,000 – €3,375,000 = €75,000 Outcome 2 If the deal fails, the share prices of DA and CA are assumed to move back to their pre-offer-announcement prices (€49 for CA and €13 for DA) Cost of repurchasing 75,000 CA shares to close the short position = 75,000 × €49 = €3,675,000 Proceeds from selling 225,000 DA shares = 225,000 × €13 = €2,925,000 Calculated net loss if the deal fails = net loss on DA shares + net loss on CA shares = (€2,925,000 – €3,375,000) + (€3,450,000 – €3,675,000) = –€675,000 The information on Big Airways (BA) is not relevant to the investment.", "explhtml": "<p>Proceeds from short selling 75,000 CA shares = 75,000 × €46 = €3,450,000   Cost of buying 225,000 DA shares = 225,000 × €15 = €3,375,000   Outcome 1   Net spread if the deal reaches a successful conclusion = €3,450,000 – €3,375,000 = €75,000   Outcome 2   If the deal fails, the share prices of DA and CA are assumed to move back to their pre-offer-announcement  prices (€49 for CA and €13 for DA)   Cost of repurchasing 75,000 CA shares to close the short position = 75,000 × €49 = €3,675,000   Proceeds from selling 225,000 DA shares = 225,000 × €13 = €2,925,000   Calculated net loss if the deal fails = net loss on DA shares + net loss on CA shares = (€2,925,000 –  €3,375,000) + (€3,450,000 – €3,675,000) = –€675,000   The information on Big Airways (BA) is not relevant to the investment. <\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Alternative Investments<\/summary><div class=\"vig-body\"><p>McGowen explains his team that a merger arbitrage strategy would be a great way to deliver large  returns to investors. McGowen asks for an example of a recent transaction that could be used to  implement this strategy. Winston provides details of a potential acquisition of Discount Airways (DA) by  City Airline (CA). CA offered to acquire DA in an all-stock deal, offering one share of CA stock for every  three shares of DA. Before the offer became public, DA stock traded at €13 per share. After the merger  announcement, DA stock rose to €15 per share. CA currently trades at €46 per share, which is €3 per  share lower than its price before the offer became public. Winston also mentions that the stock of CA’s  direct competitor Big Airways (BA) gained 12% on its €48 share price when CA’s offer for DA became  public. Winston wants to exploit the arbitrage opportunity from the offer announcement by buying  225,000 DA shares at €15 per share and short selling 75,000 shares of CA at €46 per share. <\/p><p>McGowen points out two possible outcomes of Winston’s merger arbitrage strategy:   Outcome 1: Regulators approve the deal and the stock-for-stock merger is completed as proposed.   Outcome 2: The acquisition fails to receive approval from regulators and the market prices revert to the  levels observed before the offer was announced. <\/p><p>Gautam Ambani, CFA has a $10,000 position in long futures contracts (for a hypothetical commodity)  that he wants to roll forward. The current contracts, which are close to expiration, are valued at $4.00  per contract, whereas the longer- term contract he wants to roll into is valued at $2.50 per contract. <\/p><p>Smith instructs her junior analyst to conduct an NAVPS (net asset value per share) analysis on KaunBay  Real Estate Ltd. The junior analyst makes the following three statements:  Statement 1: NAVPS should not include investors’ assessments of the value of any non-asset-based  income streams, the value of non–real estate assets, or the value added by management.  Statement 2: REITs whose shares trade below NAVPS or have high leverage might have a more difficult  time raising new capital to fund acquisitions and development, which could limit long-term growth.  Statement 3: Shares priced at discounts to NAVPS are interpreted as indications of potential  overvaluation. <\/p><p>Ashleel Grover, CFA is commenting on publicly traded real estate securities. He cites the following  disadvantages:  1. Higher volatility.  2. Higher correlation with stocks (compared to the correlation of stocks with private real estate).  3. Dividends are taxed at high current income tax rates.  4. Poor governance/agency conflict.  5. Equity markets penalize high leverage.  6. Market prices differ from NAV.  7. REIT structure has limitless potential.  8. Compliance costs may be prohibitive for smaller companies. <\/p><\/div><\/details><div class=\"qtext\"><p>Calculate the payoff from each of the two possible outcomes of Winston’s merger arbitrage strategy.<\/p><div class=\"tbl\"><table><tr><td>Outcome 1: <\/td><td>Outcome 2: <\/td><\/tr><\/table><\/div><\/div>", "subj": "alternatives"}, {"n": 18, "q": "What are the transactions—in terms of buying and selling new contracts Gautam Ambani needs to execute in order to maintain his current exposure?", "opts": ["Close out (sell) 2,500 near-term contracts and initiate (buy) 4,000 of the longer-term contracts.", "Close out (buy) 2,500 near-term contracts and initiate (sell) 4,000 of the longer-term contracts.", "Let the 2,500 near-term contracts expire and use any proceeds to purchase an additional 2,500 of the longer-term contracts."], "ans": "A", "expl": "A is correct. To roll over the same level of total exposure ($10,000), he will need to do the following: Sell $10,000/$4.00 per contract = 2,500 existing contracts. And replace this position by purchasing $10,000/$2.50 per contract = 4,000 existing contracts", "explhtml": "<p>A is correct. To roll over the same level of total exposure ($10,000), he will need to do the following:  Sell $10,000/$4.00 per contract = 2,500 existing contracts.  And replace this position by purchasing $10,000/$2.50 per contract = 4,000 existing contracts <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>McGowen explains his team that a merger arbitrage strategy would be a great way to deliver large  returns to investors. McGowen asks for an example of a recent transaction that could be used to  implement this strategy. Winston provides details of a potential acquisition of Discount Airways (DA) by  City Airline (CA). CA offered to acquire DA in an all-stock deal, offering one share of CA stock for every  three shares of DA. Before the offer became public, DA stock traded at €13 per share. After the merger  announcement, DA stock rose to €15 per share. CA currently trades at €46 per share, which is €3 per  share lower than its price before the offer became public. Winston also mentions that the stock of CA’s  direct competitor Big Airways (BA) gained 12% on its €48 share price when CA’s offer for DA became  public. Winston wants to exploit the arbitrage opportunity from the offer announcement by buying a Maran is explaining Value at Risk to her junior staff. She mentions VaR of State bank of Hyderabad  is $12.5 million at 5% for one month. Explaining the meaning, she  makes the following comments:  1. The minimum loss that would be expected to occur over one month 5% of the time is $12.5 million.  2. There is a 95% chance that the expected loss over the next month is less than $12.5 million.  3. There is a 5% chance of losing $12.5 million over one month. <\/p><p>Virat Singh Sharma is analysing VaR of state bank of Delhi. He notes a daily expected return of 0.0384%  and daily standard deviation of 1.0112% , the daily 5% parametric VaR is $2,445,150.  <\/p><p>Rishabh Samson is contemplating Monte carlo simulation (MCS). He needs your advise regarding MCS’  technicalities. <\/p><\/div><\/details><div class=\"qtext\"><p>Which of Moosa’s statements regarding macroeconomic factor models and fundamental factor<\/p><p>models is correct? <\/p><\/div>", "subj": "portfolio"}, {"n": 22, "q": "Which comment/comments of Kaviya is/are incorrect?", "opts": ["Comment 1", "Comment 2,3", "Comment 3"], "ans": "B", "expl": "Only comment 1 is correct because it is the only statement that accurately expresses the VaR. Comment 2 is incorrect because VaR is not an expected loss (expected loss is Conditional Var or CVar) and Comment 3 is incorrect because VaR does not give the likelihood of losing a specific amount.", "explhtml": "<p>Only comment 1 is correct because it is the only statement that accurately expresses the VaR. Comment 2  is incorrect because VaR is not an expected loss (expected loss is Conditional Var or CVar) and Comment 3  is incorrect because VaR does not give the likelihood of losing a specific amount.  <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Moosa Heerapurwala and Heera Moosewala are discussing .096000 − 0.263810 = −0.167810 Step 3- Convert −0.167810 to 0.167810 Step 4- 0.167810 × $150 million = $25,171,500", "explhtml": "<p>It is found by annualizing the daily return and standard deviation and using these figures in the calculation.  The annual return and standard deviation are, respectively, 0.096000 (0.000384 × 250) and 0.159885  (0.010112 × √250 )   Step 1- 0.159885 × 1.65 = 0.263810  Step 2- 0.096000 − 0.263810 = −0.167810  Step 3- Convert −0.167810 to 0.167810  Step 4- 0.167810 × $150 million = $25,171,500 <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Moosa Heerapurwala and Heera Moosewala are discussing similarities and differences between  macroeconomic factor models, fundamental factor models and statistical factor models. Moosa makes  the following statements.   Statement 1- The factors in fundamental factor models are based on attributes of stocks or companies,  whereas the factors in macroeconomic factor models are based on surprises in economic variables.  Statement 2- The factor sensitivities are generally determined first in fundamental factor models,  whereas the factor sensitivities are estimated last in macroeconomic factor models. <\/p><p>Kaviya Maran is explaining Value at Risk to her junior staff. She mentions VaR of State bank of Hyderabad  is $12.5 million at 5% for one month. Explaining the meaning, she  makes the following comments:  1. The minimum loss that would be expected to occur over one month 5% of the time is $12.5 million.  2. There is a 95% chance that the expected loss over the next month is less than $12.5 million.  3. There is a 5% chance of losing $12.5 million over one month. <\/p><p>Virat Singh Sharma is analysing VaR of state bank of Delhi. He notes a daily expected return of 0.0384%  and daily standard deviation of 1.0112% , the daily 5% parametric VaR is $2,445,150.  <\/p><p>Rishabh Samson is contemplating Monte carlo simulation (MCS). He needs your advise regarding MCS’  technicalities. <\/p><\/div><\/details><div class=\"qtext\"><p>With respect to state bank of Delhi, Rounding the daily VaR to $2.4 million, which of the following<\/p><p>values is closest to the annual 5% parametric VaR? <\/p><\/div>", "subj": "portfolio"}, {"n": 24, "q": "Which one of the following statements concerning Monte Carlo simulation is false?", "opts": ["When simulating multiple assets (factors) whose returns are correlated, it is crucial to specify a multivariate distribution rather than modeling each asset on a standalone basis.", "Regression and distribution-fitting techniques are used to estimate the parameters underlying the statistical distributions of the key decision variables.", "The Monte Carlo simulation process is deterministic and non-random in nature."], "ans": "C", "expl": "C statement is false. Random variables can be used in MCS. A and B are incorrect because they are true statements about MCS.", "explhtml": "<p>C statement is false. Random variables can be used in MCS. A and B are incorrect because they are true  statements about MCS. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Moosa Heerapurwala and Heera Moosewala are discussing similarities and differences between  macroeconomic factor models, fundamental factor models and statistical factor models. Moosa makes  the following statements.   Statement 1- The factors in fundamental factor models are based on attributes of stocks or companies,  whereas the factors in macroeconomic factor models are based on surprises in economic variables.  Statement 2- The factor sensitivities are generally determined first in fundamental factor models,  whereas the factor sensitivities are estimated last in macroeconomic factor models. <\/p><p>Kaviya Maran is explaining Value at Risk to her junior staff. She mentions VaR of State bank of Hyderabad  is $12.5 million at 5% for one month. Explaining the meaning, she  makes the following comments:  1. The minimum loss that would be expected to occur over one month 5% of the time is $12.5 million.  2. There is a 95% chance that the expected loss over the next month is less than $12.5 million.  3. There is a 5% chance of losing $12.5 million over one month. <\/p><p>Virat Singh Sharma is analysing VaR of state bank of Delhi. He notes a daily expected return of 0.0384%  and daily standard deviation of 1.0112% , the daily 5% parametric VaR is $2,445,150.  <\/p><p>Rishabh Samson is contemplating Monte carlo simulation (MCS). He needs your advise regarding MCS’  technicalities. <\/p><\/div><\/details><div class=\"qtext\"><p>Which one of the following statements concerning Monte Carlo simulation is false?<\/p><\/div>", "subj": "portfolio"}, {"n": 25, "q": "Which statement/statements of Mr. Rotlu is/are incorrect?", "opts": ["Comment B, C", "Comment A", "Comment A, B"], "ans": "A", "expl": "The maximum spread on an ETF is positively related to creation/redemption fees plus other trading costs, spread on the underlying securities, risk premium for carrying the trade until close of trading, and AP's normal profit margin. Maximum spread is negatively related to the probability of offsetting the trade in the secondary market.", "explhtml": "<p>The maximum spread on an ETF is positively related to creation/redemption fees plus other trading costs,  spread on the underlying securities, risk premium for carrying the trade until close of trading, and AP&#x27;s  normal profit margin. Maximum spread is negatively related to the probability of offsetting the trade in the  secondary market. <\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Dr. Hasmukh Rotlu, CFA, CAIA addresses his sub-ordinates regarding ETFs and makes the following  comments: <\/p><p>COMMENT A: The maximum spread on an ETF is most likely to be negatively related to the probability  of authorized participants (APs) completing an off-setting the trade in secondary market.  COMMENT B: The maximum spread on an ETF is most likely to be negatively related to the risk premium  demanded by the authorized participants (APs) for carrying the trade until the close of trading.  COMMENT C: The maximum spread on an ETF is most likely to be negatively related to the spread quoted  on the underlying securities. <\/p><p>Janice Barefoot, CFA, has been managing a portfolio for a client who has asked Barefoot to use the Dow  Jones Industrial Average (DJIA) as a benchmark. In her first year Barefoot managed the portfolio by  choosing 29 of the 30 DJIA stocks. She selected a non-DJIA stock in the same industry as the omitted  stock to replace that stock. Compared to the DJIA, Barefoot has placed a higher weight on the financial  stocks and a lower weight on the other stocks still in the portfolio. Over that year, the non-DJIA stock in  the portfolio had a negative return while the omitted DJIA stock had a positive return.  <\/p><p>Kangana Roshan is an active fund manager at Queen Analytics. She has an information coefficient of  0.07, transfer coefficient of 0.90, and makes 59 bets a year out of which 10 are cloned from her manager- friends at other firms. The Benchmark portfolio has a Sharpe ratio of 0.40 and standard deviation of  benchmark returns is 12%.  <\/p><p>Hrithik Ranaut, MBA is trying to formulate required returns and risk premiums for various asset classes  and he notes 3 formulations: <\/p><p>Discount rate for equity = R + π + θ + γ + κ  where: κ = additional risk premium relative to risky debt for an investment in equities  λ = equity risk premium = γ + κ <\/p><p>Discount rate for commercial real estate = R + π + θ + γ + κ + φ  where: κ = risk premium for uncertainty about terminal value of property (similar to the equity risk  premium) and φ = risk premium for illiquidity <\/p><p>Required rate of return for credit risky bonds = R + π + θ + γ  where: γ = additional risk premium for credit risk = credit spread <\/p><\/div><\/details><div class=\"qtext\"><p>Which statement/statements of Mr. Rotlu is/are incorrect?<\/p><\/div>", "subj": "portfolio"}, {"n": 26, "q": "Assuming the portfolio managed by Barefoot outperformed the DJIA. Based on this we can say that the return from factor tilts and asset selection were:", "opts": ["both positive.", "positive and negative respectively.", "negative and positive respectively."], "ans": "B", "expl": "Since the replacement of the asset obviously had a negative effect, the tilting towards financial stocks must have been positive to not only compensate for the loss but produce a portfolio return greater than the DJIA.", "explhtml": "<p>Since the replacement of the asset obviously had a negative effect, the tilting towards financial stocks must  have been positive to not only compensate for the loss but produce a portfolio return greater than the  DJIA. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dr. Hasmukh Rotlu, CFA, CAIA addresses his sub-ordinates regarding ETFs and makes the following  comments: <\/p><p>COMMENT A: The maximum spread on an ETF is most likely to be negatively related to the probability  of authorized participants (APs) completing an off-setting the trade in secondary market.  COMMENT B: The maximum spread on an ETF is most likely to be negatively related to the risk premium  demanded by the authorized participants (APs) for carrying the trade until the close of trading.  COMMENT C: The maximum spread on an ETF is most likely to be negatively related to the spread  is closest to:", "opts": ["6%", "8%", "14%"], "ans": "C", "expl": "IR = IC X TC X ROOT.BR = 0.07 X 0.90 X ROOT.47 = 0.441 For a constrained portfolio, the optimal level of residual risk can be computed as: σ*A =(IR / SBB)σB = (0.441 / 0.40)(0.12) = 13.23%", "explhtml": "<p>IR = IC X TC X ROOT.BR = 0.07 X 0.90 X ROOT.47 = 0.441  For a constrained portfolio, the optimal level of residual risk can be computed as:  σ*A =(IR / SBB)σB = (0.441 / 0.40)(0.12) = 13.23% <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dr. Hasmukh Rotlu, CFA, CAIA addresses his sub-ordinates regarding ETFs and makes the following  comments: <\/p><p>COMMENT A: The maximum spread on an ETF is most likely to be negatively related to the probability  of authorized participants (APs) completing an off-setting the trade in secondary market.  COMMENT B: The maximum spread on an ETF is most likely to be negatively related to the risk premium  demanded by the authorized participants (APs) for carrying the trade until the close of trading.  COMMENT C: The maximum spread on an ETF is most likely to be negatively related to the spread quoted  on the underlying securities. <\/p><p>Janice Barefoot, CFA, has been managing a portfolio for a client who has asked Barefoot to use the Dow  Jones Industrial Average (DJIA) as a benchmark. In her first year Barefoot managed the portfolio by  choosing 29 of the 30 DJIA stocks. She selected a non-DJIA stock in the same industry as the omitted  stock to replace that stock. Compared to the DJIA, Barefoot has placed a higher weight on the financial  stocks and a lower weight on the other stocks still in the portfolio. Over that year, the non-DJIA stock in  the portfolio had a negative return while the omitted DJIA stock had a positive return.  <\/p><p>Kangana Roshan is an active fund manager at Queen Analyt  paid out as dividends is closest to:", "opts": ["35.0%.", "54.5%.", "62.3%."], "ans": "B", "expl": "The effective tax rate on earnings distributed as dividends is 0.35 + (1 − 0.35) (0.30) = 0.545 = 54.5%.", "explhtml": "<p>The effective tax rate on earnings distributed as dividends is 0.35 + (1 − 0.35)  (0.30) = 0.545 = 54.5%.  <\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Corporate Issuers<\/summary><div class=\"vig-body\"><p>A large retail pharmacy “PharmTough” chain has made a significant capital investment to incorporate  health care kiosks within their stores. If the company would like to receive cash up front in exchange for  the kiosks, and yet retain the right for their future use.  <\/p><p>Klaatu is a country that taxes dividends based on a double-taxation system. The corporate tax rate on  company profits is 35%. An investor named Shehenshah living in Klaatu holds 100 shares of stock in the  Lucas Corporation. Lucas’s pretax earnings for the current year are $2.00 per share, and the company  has a payout ratio of 100%. The investor’s individual tax rate on dividends is 30%.  <\/p><p>Cogenics, Inc., is expected to pay a dividend of $4 at the end of its first year. Dividends are expected to  grow at a constant rate of 4% per year. The current Cogenics stock price is $100. <\/p><p>Betagenics, Inc., is expected to pay a dividend of $1.50, $2.00, $2.50, and $3.00 at the end of each of the  next four years, respectively. The current Betagenics stock price is $50, and is expected to be $60 at the  end of four years. <\/p><\/div><\/details><div class=\"qtext\"><p>In Klaatu, The effective tax rate on a dollar of funds to be paid out as dividends is closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 30, "q": "The PharmTough company would most appropriately pursue a:", "opts": ["spin-off.", "balance sheet restructuring.", "reorganization."], "ans": "B", "expl": "The company could unlock capital by undertaking a sale-and-leaseback transaction, which is considered to be a type of balance sheet restructuring.", "explhtml": "<p>The company could unlock capital by undertaking a sale-and-leaseback transaction, which is considered to  be a type of balance sheet restructuring. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>A large retail pharmacy “PharmTough” chain has made a significant capital investment to incorporate  health care kiosks within their stores. If the company would like to receive cash up front in exchange for  the kiosks, and yet retain the right for their future use.  <\/p><p>Klaatu is a country that taxes dividends based on a double-taxation system. The corporate tax rate on  company profits is 35%. An investor named Shehenshah living in Klaatu holds 100 shares of stock in the  Lucas Corporation. Lucas’s pretax earnings for the current year are $2.00 per share, and the company  has a payout ratio of 100%. The investor’s individual tax rate on dividends is 30%.  <\/p><p>Cogenics, Inc., is expected to pay a dividend of $4 at the end of its first year. Dividends are expected to  grow at a constant rate of 4% per year. The current Cogenics stock price is $100. <\/p><p>Betagenics, Inc., is expected to pay a dividend of $1.50, $2.00, $2.50, and $3.00 at the end of each of the  next four years, respectively. The current Betagenics stock price is $50, and is expected to be $60 at the  end of four years. <\/p><\/div><\/details><div class=\"qtext\"><p>The PharmTough company would most appropriately pursue a:<\/p><\/div>", "subj": "corporate"}, {"n": 31, "q": "The cost of equity for Cogenics is:", "opts": ["4%", "10%", "8%"], "ans": "C", "expl": "Dividend yield for Cogenics = 4 / 100 = 4% re(Cogenics) = DY + CGY = 4% + 4% = 8%", "explhtml": "<p>Dividend yield for Cogenics = 4 / 100 = 4%  re(Cogenics) = DY + CGY = 4% + 4% = 8% <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>A large retail pharmacy “PharmTough” chain has made a significant capital investment to incorporate  health care kiosks within their stores. If the company would like to receive cash up front in exchange for  the kiosks, and yet retain the right for their future use.  <\/p><p>Klaatu is a country that taxes dividends based on a double-taxation system. The corporate tax rate on  company profits is 35%. An investor named Shehenshah living in Klaatu holds 100 shares of stock in the  Lucas Corporation. Lucas’s pretax earnings for the current year are $2.00 per share, and the company  has a payout ratio of 100%. The investor’s individual tax rate on dividends is 30%.  <\/p><p>Cogenics, Inc., is expected to pay a dividend of $4 at the end of its first year. Dividends are expected to  grow at a constant rate of 4% per year. The current Cogenics stock price is $100. <\/p><p>Betagenics, Inc., is expected to pay a dividend of $1.50, $2.00, $2.50, and $3.00 at the end of each of the  next four years, respectively. The current Betagenics stock price is $50, and is expected to be $60 at the  end of four years. <\/p><\/div><\/details><div class=\"qtext\"><p>The cost of equity for Cogenics is:<\/p><\/div>", "subj": "corporate"}, {"n": 32, "q": "The cost of equity for Betagenics is:", "opts": ["8.87%", "9%", "8.78%"], "ans": "C", "expl": "CF0 = −50; C01 = 1.50; C02 = 2.00; C03 = 2.50; C04 = 63, CPT IRR = 8.78%", "explhtml": "<p>CF0 = −50; C01 = 1.50; C02 = 2.00; C03 = 2.50; C04 = 63, CPT IRR = 8.78% <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>A large retail pharmacy “PharmTough” chain has made a significant capital investment to incorporate  health care kiosks within their stores. If the company would like to receive cash up front in exchange for  the kiosks, and yet retain the right for their future use.  <\/p><p>Klaatu is a country that taxes dividends based on a double-taxation system. The corporate tax rate on  company profits is 35%. An investor named Shehenshah living in Klaatu holds 100 shares of stock in the  Lucas Corporation. Lucas’s pretax earnings for the current year are $2.00 per share, and the company  has a payout ratio of 100%. The investor’s individual tax rate on dividends is 30%.  <\/p><p>Cogenics, Inc., is expected to pay a dividend of $4 at the end of its first year. Dividends are expected to  grow at a constant rate of 4% per year. The current Cogenics stock price is $100. <\/p><p>Betagenics, Inc., is expected to pay a dividend of $1.50, $2.00, $2.50, and $3.00 at the end of each of the  next four years, respectively. The current Betagenics stock price is $50, and is expected to be $60 at the  end of four years. <\/p><\/div><\/details><div class=\"qtext\"><p>The cost of equity for Betagenics is:<\/p><\/div>", "subj": "corporate"}, {"n": 33, "q": "The residual income for VIM by using the method based on deducting an equity charge is:", "opts": ["$8000", "$10000", "$11111"], "ans": "A", "expl": "EBIT $300,000 Interest 120,000 ($2,000,000 × 6%) Pretax income $180,000 Tax expense 72,000 Net income $108,000 Equity charge = Equity capital × Required return on equity = (1/3)($3,000,000) × 0.10 = $1,000,000 × 0.10 = $100,000 Residual income = Net income – Equity charge = $108,000 – $100,000 = $8,000", "explhtml": "<div class=\"tbl\"><table><tr><td>EBIT   <\/td><td>$300,000 <\/td><\/tr><tr><td>Interest  <\/td><td>120,000 ($2,000,000 × 6%) <\/td><\/tr><tr><td>Pretax income  <\/td><td>$180,000 <\/td><\/tr><tr><td>Tax expense   <\/td><td>72,000 <\/td><\/tr><tr><td>Net income   <\/td><td>$108,000 <\/td><\/tr><\/table><\/div><p>Equity charge = Equity capital × Required return on equity  = (1/3)($3,000,000) × 0.10  = $1,000,000 × 0.10 = $100,000  Residual income = Net income – Equity charge  = $108,000 – $100,000 = $8,000 <\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Based on the following information, Mr. Jaljeera has to determine whether Vertically Integrated  Manufacturing earned any residual income for its shareholders:  ■ VIM had total assets of $3,000,000, financed with twice as much debt capital as equity capital.  ■ VIM’s pretax cost of debt is 6% and cost of equity capital is 10%.  ■ VIM had EBIT of $300,000 and was taxed at a rate of 40%. <\/p><p>Notable Books (NB) is a family controlled company that dominates the retail book market. NB has book  value of $10 per share, is expected to earn $2.00 per share forever, and pays out all of its earnings as  dividends. Its required return on equity is 12.5%.  <\/p><p>Schwalke is currently valuing LPE, a private furniture manufacturing company based in France. The  company is owned entirely by the Lapiere family, with several family members employed as senior  company managers. Jean Lapiere is the current CEO and owns 25% of LPE stock. LPE’s most recent  income statement as part of its reviewed financial statements is as follows:  As of 31 December (in EUR) As Reported  Revenues 30,000,000 ; Cost of goods sold 18,000,000 ; Gross profit 12,000,000 ; SG&amp;A expenses  8,000,000 ; EBITDA 4,000,000 ; Depreciation and amortization 2,400,000 ; Earnings before interest and  taxes 1,600,000 ; Pro forma taxes (at 25%) 400,000 ; Operating income after taxes 1,200,000.  As Schwalke reviews compensation expenses, he learns that Jean Lapiere’s annual compensation is EUR  300,000 and that CEOs of similarly sized consumer durable goods companies earn EUR 600,000 on  average. <\/p><p>Mr. Professor is analysing a company called Stora (Helsinki Stock Exchange: STERV) which is an integrated  paper, packaging, and forest products company headquartered in Finland. In its fiscal year ended 31  December 2018, Stora sold goods worth €11,486 million and had 788.4 million shares outstanding with  Market price of €13.10 per share.  It’s Industry’s P/S ratio is 1.1111. It reported that it received back  goods of invoice value €1000 in return.  <\/p><\/div><\/details><div class=\"qtext\"><p>The residual income for VIM by using the method based on deducting an equity charge is:<\/p><\/div>", "subj": "equity"}, {"n": 34, "q": "Value of the stock of NB using the Dividend discount model and Residual income model is: Dividend discount model. Residual income model.", "opts": ["16 16", "16 26", "160 12"], "ans": "A", "expl": "According to the DDM, V0 = D/r for a no-growth company. V0 = $2.00/0.125 = $16 per share Under the residual income model, V0 = B0 + Present value of expected future per-share residual income. Residual income is calculated as: RIt = E – rBt–1 = $2 – (0.125)($10) = $0.75 Present value of stream of residual income is calculated as: RIt/r = 0.75/0.125 = $6 The value is calculated as: V0 = $10 + $6 = $16 per share", "explhtml": "<p>According to the DDM, V0 = D/r for a no-growth company. V0 = $2.00/0.125 = $16 per share  Under the residual income model, V0 = B0 + Present value of expected future per-share residual income.  Residual income is calculated as:  RIt = E – rBt–1 = $2 – (0.125)($10) = $0.75  Present value of stream of residual income is calculated as:  RIt/r = 0.75/0.125 = $6  The value is calculated as: V0 = $10 + $6 = $16 per share <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Based on the following information, Mr. Jaljeera has to determine whether Vertically Integrated  Manufacturing earned any residual income for its shareh esidual income model is:<\/p><p>Dividend discount model.  Residual income model. <\/p><\/div>", "subj": "equity"}, {"n": 35, "q": "Which amount is closest to LPE’s normalized EBITDA after considering Jean Lapiere’s compensation?", "opts": ["EUR 3.7 million", "EUR 4.0 million", "EUR 4.3 million"], "ans": "A", "expl": "Jean Lapiere receives EUR 0.3 million less as LPE’s CEO than what he should expect in an arms-length contract. LPE’s normalized EBITDA should therefore be EUR 0.3 million below its reported EUR 4.0 million.", "explhtml": "<p>Jean Lapiere receives EUR 0.3 million less as LPE’s CEO than what he should expect in an arms-length  contract. LPE’s normalized EBITDA should therefore be EUR 0.3 million below its reported EUR 4.0 million. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Based on the following information, Mr. Jaljeera has to determine whether Vertically Integrated  Manufacturing earned any residual income for its shareholders:  ■ VIM had total assets of $3,000,000, financed with twice as much debt capital as equity capital.  ■ VIM’s pretax cost of debt is 6% and cost of equity capital is 10%.  ■ VIM had EBIT of $300,000 and was taxed at a rate of 40%. <\/p><p>Notable Books (NB) is a family controlled company that dominates the retail book market. NB has book  value of $10 per share, is expected to earn $2.00 per share forever, and pays out all of its earnings as  dividends. Its required return on equity is 12.5%.  <\/p><p>Schwalke is currently valuing LPE, a private furniture manufacturing company based in France. The  company is owned entirely by the Lapiere family, with several family members employed as senior  company managers. Jean Lapiere is the current CEO and owns 25% of LPE stock. LPE’s most recent  income statement as part of its reviewed financial statements is as follows:  As 7, "q": "Mrs. Rekha is most likely to conclude that PHP shares are currently", "opts": ["Undervalued", "Fairly valued", "Over valued"], "ans": "A", "expl": "The WACC for PHB Company is WACC = 0.30 ( 7.0% ) ( 1 − 0.35 ) + 0.15 ( 6.8% ) + 0.55 ( 11.0% ) = 8.435 % . The firm value is FCFF1 / WACC – G = 28.04 (1+0.04) / 0.08435 – 0.04 = £656.60 million. The value of equity is the firm value minus the value of debt minus the value of preferred stock: Equity = 656.60 − 145 − 65 = ￡446.60 million. Dividing this amount by the number of shares gives the estimated value per share of ￡446.60 million/8 million shares = ￡55.82. The estimated value for the stock is greater than the market price of ￡32.50, so the stock appears to be undervalued.", "explhtml": "<p>The WACC for PHB Company is WACC = 0.30 ( 7.0% ) ( 1 − 0.35 ) + 0.15 ( 6.8% ) + 0.55 ( 11.0% ) = 8.435 % .  The firm value is FCFF1 / WACC – G = 28.04 (1+0.04) / 0.08435 – 0.04 = £656.60 million.  The value of equity is the firm value minus the value of debt minus the value of preferred stock: Equity =  656.60 − 145 − 65 = ￡446.60 million. Dividing this amount by the number of shares gives the estimated  value per share of ￡446.60 million/8 million shares = ￡55.82. The estimated value for the stock is greater  than the market price of ￡32.50, so the stock appears to be undervalued. <\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Equity Valuation<\/summary><div class=\"vig-body\"><p>PHB Company currently sells for ￡32.50 per share. In an attempt to determine whether PHB is fairly  priced, Mrs. Rekha Bacchan has assembled the following information:  ■ The before-tax required rates of return on PHB debt, preferred stock, and common stock are,  respectively, 7.0%, 6.8%, and 11.0%.  ■ The company’s target capital structure is 30% debt, 15% preferred stock, and 55% common stock.  ■ The market value of the company’s debt is ￡145 million, and its preferred stock is valued at ￡65  million.  ■ PHB’s FCFF for the year just ended is ￡28 million. FCFF is expected to grow at a constant rate of 4%  for the foreseeable future.  ■ The tax rate is 35%.  ■ PHB has 8 million outstanding common shares. <\/p><p>Hugo Dubois is evaluating NYL Manufacturing Company, Ltd. In 2020, when Dubois is performing his  analysis, the company is unprofitable. Furthermore, NYL pays no dividends on its common shares.  Dubois decides to value NYL Manufacturing by using his forecasts of FCFE. Dubois gathers the following  facts and assumptions:  ■ The company has 17.0 billion shares outstanding.  ■ Sales will be €5.5 billion in 2021, increasing at 28% annually for the next four years (through 2025).  ■ Net income will be 32% of sales.  ■ Investment in fixed assets will be 35% of sales; investment in working capital will be 6% of sales;  depreciation will be 9% of sales.  ■ 20% of the net investment in assets will be financed with debt.  ■ Interest expenses will be only 2% of sales.  ■ The tax rate will be 10%. NYL Manufacturing’s beta is 2.1; the risk-free government bond rate is 6.4%;  the equity risk premium is 5.0%.  ■ At the end of 2025, Dubois projects NYL terminal stock value at 18 times earnings. <\/p><p>Elsie Bouvier is evaluating Rhinestone Energy (a hypothetical company) for possible inclusion in a small- cap, growth-oriented portfolio. The company is a diversified energy company involved in oil and gas  exploration as well as natural gas distribution. In light of Rhinestone Energy’s aggressive program of  purchasing oil and gas producing properties, Bouvier expects above-average growth for the next five  years. She establishes the following facts and forecasts:  ■ The current market price is $56.18.  ■ The current dividend is $0.56.  ■ Bouvier forecasts an initial five-year period of 11% per year earnings and dividend growth.  ■ Bouvier anticipates that Rhinestone Energy can grow 6.5% per year as a mature company and allows  10 years for the transition to the mature growth period.  ■ To estimate the required return on equity using the CAPM, Bouvier uses an adjusted beta of 1.2 based  on two years of weekly observations, an estimated equity risk premium of 4.2%, and a risk-free rate  based on long bond yields of 3%. <\/p><p>Shakeel Quereshi is analysing Phoenix’s financial statements over the past five years. F/S shows strong  performance, with above average growth. He has decided to use a lower forecasted growth rate in his  models, reflecting the effect of “regression to the mean” over time. He notes two reasons for his lower  growth rate forecast:  Reason 1- Successful companies tend to draw more competition, putting their high profits under  pressure.  Reason 2- Phoenix’s intellectual property and franchise agreements will be weakening over time. <\/p><\/div><\/details><div class=\"qtext\"><p>Mrs. Rekha is most likely to conclude that PHP shares are currently<\/p><\/div>", "subj": "equity"}, {"n": 38, "q": "Value of one ordinary share of NYL Manufacturing Company is closest to-", "opts": ["€2.4.", "€3.39.", "Indeterminate (cannot be found)"], "ans": "A", "expl": "The required rate of return found with the CAPM is r = E ( R i ) = R F + β i [ E ( R M ) − R F ] = 6.4 % + 2.1 ( 5.0% ) = 16.9 % . The following table shows the values of sales, net income, capital expenditures less depreciation, and investments in working capital. FCFE equals net income less the investments financed with equity: FCFE = Net income − ( 1 − DR ) ( Capital expenditures − Depreciation ) − ( 1 − DR ) ( Investment in working capital ) , where DR is the debt ratio (debt financing as a percentage of debt and equity). Because 20% of net new investments are financed with debt, 80% of the investments are financed with equity, which reduces FCFE by 80% of (Capital expenditures – Depreciation) and 80% of the investment in working capital. The terminal stock value is 18.0 times the earnings in 2025, or 18 × 4.724 = €85.03 billion. The present value of the terminal value (€38.95 billion) plus the present value of the first five years’ FCFE (€1.82 billion) is €40.77 billion. Because NYL Manufacturing has 17 billion outstanding shares, the value per ordinary share is €2.398.", "explhtml": "<p>The required rate of return found with the CAPM is  r = E ( R i ) = R F + β i [ E ( R M ) − R F ] = 6.4 % + 2.1 ( 5.0% ) = 16.9 % .  The following table shows the values of sales, net income, capital expenditures less depreciation, and  investments in working capital. FCFE equals net income less the investments financed with equity:  FCFE = Net income − ( 1 − DR ) ( Capital expenditures − Depreciation ) − ( 1 − DR ) ( Investment in working  capital ) , where DR is the debt ratio (debt financing as a percentage of debt and equity).  Because 20% of net new investments are financed with debt, 80% of the investments are financed with  equity, which reduces FCFE by 80% of (Capital expenditures – Depreciation) and 80% of the investment in  working capital.  The terminal stock value is 18.0 times the earnings in 2025, or 18 × 4.724 = €85.03 billion. The present value  of the terminal value (€38.95 billion) plus the present value of the first five years’ FCFE (€1.82 billion) is  €40.77 billion. Because NYL Manufacturing has 17 billion outstanding shares, the value per ordinary share  is €2.398. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/efs/s1a-002.webp\" style=\"max-width:min(100%,649px)\" alt=\"\">", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>PHB Company currently sells for ￡32.50 per share. In an attempt to determine whether PHB is fairly  priced, Mrs. Rekha Bacchan has assembled the following information:  ■ The before-tax required rates of return on PHB debt, preferred stock, and common stock are,  respectively, 7.0%, 6.8%, and 11.0%.  ■ The company’s t const CFG = {"title": "Kevin Sir Mock 2024 — Session 1", "subtitle": "CFA Level II · 44 câu · 2h12p", "minutes": 132, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;

    const num = document.createElement("span");

    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");

    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();

  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";

    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){

    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";

const CFA_SESSION_SUBJECT_RANGES = {

};
const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,
  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,

let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();

      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  if(graded) window.showGradedResult();

  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">

    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
