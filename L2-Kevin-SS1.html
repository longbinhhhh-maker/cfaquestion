<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>
<body>
<header>

const DATA = [{"n": 1, "q": "Determine which one of the following statements about the coefficient of the volatility factor (VIX) is true.", "opts": ["A 1.0% increase in VIX  would result in a –0.927% decrease in YRET.", "A 0.073% increase in VIX would result in a 1.0% increase in YRET.", "A 1.0% increase in VIX, holding all the other independent variables constant, would result in a 0.073% increase in YRET."], "ans": "C", "expl": "The coefficient of the volatility factor (VIX) is 0.037. It should be interpreted to mean that holding all the other independent variables constant, a 1% increase (decrease) would result in a 0.037% increase (decrease) in the monthly portfolio excess return (RET).", "explhtml": "<p>The coefficient of the volatility factor (VIX) is 0.037. It should be interpreted to mean that holding all the  other independent variables constant, a 1% increase (decrease) would result in a 0.037% increase  (decrease) in the monthly portfolio excess return (RET). <\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>You are an analyst at Laxmi Chit Fund &amp; Asset Management Company. Your supervisor asks you to  analyze the return drivers for one of its portfolios. She asks you to construct a regression model of the  portfolio’s monthly excess returns (RET) against three factors: the market excess return (MRKT), a value  factor (HML), and the monthly percentage change in a volatility index (VIX). You collect the data and run  the regression, and the resulting model is   RET = –0.29 + 1.17 (MRKT) + 0.49 (HML) + 0.073 (VIX) <\/p><p>Harpik Dandya, CFA is an analyst in the research department of a large hedge fund. He was recently  asked to develop a model to predict the future exchange rate between two currencies. He gathers  monthly exchange rate data from the most recent 10-year period and runs a regression based on the  following AR(1) model specification:  Regression : x (t) = b0 + b1.x(t−1) + E(t), where x(t) is the exchange rate at time t.  Based on his analysis of the time series and the regression results, he reaches the following conclusions:  Conclusion 1 The variance of x(t) increases over time.  Conclusion 2 The mean-reverting level is undefined.  Conclusion 3 b0 does not appear to be significantly different from 0. <\/p><p>Paul Wang’s analytics team at LendALot Corporation is working to develop its first ML model for  classifying prospective borrowers’ creditworthiness. Wang has asked one of his data scientists, Lynn Lee,  to perform a preliminary assessment of the data cleansing and preprocessing tasks the team will need  to perform. As part of this assessment, Lee pulled the following sample of data for manual examination,  which she brings to Wang to discuss. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/efs/s1-001.webp\" style=\"max-width:min(100%,619px)\" alt=\"\"><p>Istvan Perenyi is a portfolio manager of the Europe Diversified Equity Fund (“the Fund”) within the  Diversified Investment Management Company (DIMCO) fund family. The Fund is benchmarked to the  STOXX Europe 600 Index, which spans 17 countries, 19 industry sectors, and three market capitalization  groupings (large-, mid-, and small-cap). Examining the Fund’s most recent performance, Perenyi is  concerned that the Fund’s holdings, although approximately aligned with the STOXX Europe 600 Index’s  country weights, may have unrecognized risk biases and concentrations. Perenyi asks Elsa Perry,  DIMCO’s chief risk officer, to investigate the Fund’s diversification. Perry asks her analysts for ideas on  how Perenyi’s request can be addressed and receives three suggestions:  Suggestion 1- Estimate the country, industry, and market cap exposures of each Fund holding, aggregate  them, and compare the aggregate exposures to the benchmark&#x27;s exposures. Then, examine mismatches  for evidence of unexpected biases or concentrations.  Suggestion 2- Identify inherent groupings among fund holdings based on a broad set of eight numerical  (operating and financial) measures related to the holdings’characteristics. Then, examine the groupings  for evidence of unexpected biases or concentrations.  Suggestion 3- Regress the return of the Fund on a set of country equity market indexes and sector  indexes based on the Fund’s benchmark. Then, examine the regression coefficients for evidence of  unexpected biases or concentrations. <\/p><\/div><\/details><div class=\"qtext\"><p>Determine which one of the following statements about the coefficient of the volatility factor (VIX) is<\/p><p>true. <\/p><\/div>", "subj": "quant"}, {"n": 2, "q": "Which of Harpik’s conclusions regarding the exchange rate time series is consistent with both the properties of a covariance-stationary time series and the properties of a random walk?", "opts": ["Conclusion 1", "Conclusion 2", "Conclusion 3"], "ans": "C", "expl": "A random walk can be described by the equation xt = b0 + b1xt−1 + εt, where b0 = 0 and b1 = 1. So b0 = 0 is a characteristic of a random walk time series. A covariance-stationary series must satisfy the following three requirements: 1. The expected value of the time series must be constant and finite in all periods. 2. The variance of the time series must be constant and finite in all periods. 3. The covariance of the time series with itself for a fixed number of periods in the past or future must be constant and finite in all periods. b0 = 0 does not violate any of these three requirements and is thus consistent with the properties of a covariance-stationary time series.", "explhtml": "<p>A random walk can be described by the equation xt = b0 + b1xt−1 + εt, where b0 = 0 and b1 = 1. So b0 = 0  is a characteristic of a random walk time series. A covariance-stationary series must satisfy the following  three requirements:  1. The expected value of the time series must be constant and finite in all periods. ons regarding the exchange rate time series is consistent with both the<\/p><p>properties of a covariance-stationary time series and the properties of a random walk? <\/p><\/div>", "subj": "quant"}, {"n": 3, "q": "With respect to Perry’s case, which suggestion is most likely to be implemented using machine learning?", "opts": ["Suggestion 1", "Suggestion 2", "Suggestion 3"], "ans": "B", "expl": "A machine learning clustering algorithm could be used to implement Suggestion 2. A and C are incorrect because Suggestions 1 and 3, respectively, can be addressed easily using traditional regression analysis", "explhtml": "<p>A machine learning clustering algorithm could be used to implement Suggestion 2. A and C are incorrect  because Suggestions 1 and 3, respectively, can be addressed easily using traditional regression analysis <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>You are an analyst at Laxmi Chit Fund &amp; Asset Management Company. Your supervisor asks you to  analyze the return drivers for one of its portfolios. She asks you to construct a regression model of the  portfolio’s monthly excess returns (RET) against three factors: the market excess return (MRKT), a value  factor (HML), and the monthly percentage change in a volatility index (VIX). You collect the data and run  the regression, and the resulting model is   RET = –0.29 + 1.17 (MRKT) + 0.49 (HML) + 0.073 (VIX) <\/p><p>Harpik Dandya, CFA is an analyst in the research department of a large hedge fund. He was recently  asked to develop a model to predict the future exchange rate between two currencies. He gathers  monthly exchange rate data from the most recent 10-year period and runs a regression based on the  following AR(1) model specification:  Regression : x (t) = b0 + b1.x(t−1) + E(t), where x(t) is the exchange rate at time t.  Based (operating and financial) measures related to the holdings’characteristics. Then, examine the groupings  for evidence of unexpected biases or concentrations.  Suggestion 3- Regress the return of the Fund on a set of country equity market indexes and sector  indexes based on the Fund’s benchmark. Then, examine the regression coefficients for evidence of  unexpected biases or concentrations. <\/p><\/div><\/details><div class=\"qtext\"><p>With respect to Perry’s case, which suggestion is most likely to be implemented using machine<\/p><p>learning? <\/p><\/div>", "subj": "quant"}, {"n": 4, "q": "The data shown for Ms. Beta and Ms. Delta contain what is best described as an: Ms. Beta Ms. Delta", "opts": ["invalidity error. inaccuracy error.", "inaccuracy error. Incompleteness error.", "incompleteness error. invalidity error."], "ans": "A", "expl": "Ms. Beta- This is an invalidity error because the data are outside of a meaningful range. Income cannot be negative. Ms. Delta- This is an inaccuracy error because LendALot must know how much they have lent to that particular borrower (who eventually repaid the loan as indicated by the loan outcome of no default).", "explhtml": "<p>Ms. Beta- This is an invalidity error because the data are outside of a meaningful range. Income cannot be  negative.  Ms. Delta- This is an inaccuracy error because LendALot must know how much they have lent to that  particular borrower (who eventually repaid the loan as indicated by the loan outcome of no default). <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>You are an analyst at Laxmi Chit Fund &amp; Asset Management Company. Your supervisor asks you to  analyze the return drivers for one of its portfolios. She asks you to construct a regression model of the  portfolio’s monthly excess returns (RET) against three factors: the market excess return (MRKT), a value  factor (HML), and the monthly percentage change in a volatility index (VIX). You collect the data and run  the regression, and the resulting model is   RET = –0.29 + 1.17 (MRKT) + 0.49 (HML) + 0.073 (VIX) <\/p><p>Harpik Dandya, CFA is an analyst in the research department of a large hedge fund. He was recently  asked to develop a model to predict the future exchange rate between two currencies. He gathers  monthly exchange rate data from the most recent 10-year period and runs a regression based on the  following AR(1) model specification:  Regression : x (t) = b0 + b1.x(t−1) + E(t), where x(t) is the exchange rate at time t.  Based on his analysis of the time series and the regression results, he reaches the following conclusions:  Conclusion 1 The variance of x(t) increases over time.  Conclusion 2 The mean-reverting level is undefined.  Conclusion 3 b0 does not appear to be significantly different from 0. <\/p><p>Paul Wang’s analytics team at LendALot Corporation is working to develop its first ML model for  classifying prospective borrowers’ creditworthiness. Wang has asked one of his data scientists, Lynn Lee,  to perform a preliminary assessment of the data cleansing and preprocessing tasks the team will need  to perform. As part of this assessment, Lee pulled the following sample of data for manual examination,  which she brings to Wang to discuss. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/efs/s1-001.webp\" style=\"max-width:min(100%,619px)\" alt=\"\"><p>Istvan Perenyi is a portfolio manager of the Europe Diversified Equity Fund (“the Fund”) within the  Diversified Investment Management Company (DIMCO) fund family. The Fund is benchmarked to the  STOXX Europe 600 Index, which spans 17 countries, 19 industry sectors, and three market capitalization  groupings (large-, mid-, and small-cap). Examining the Fund’s most recent performance, Perenyi is  concerned that the Fund’s holdings, although approximately aligned with the STOXX Europe 600 Index’s  country weights, may have unrecognized risk biases and concentrations. Perenyi asks Elsa Perry,  DIMCO’s chief risk officer, to investigate the Fund’s diversification. Perry asks her analysts for ideas on  how Perenyi’s request can be addressed and receives three suggestions:  Suggestion 1- Estimate the country, industry, and market cap exposures of each Fund holding, aggregate  them, and compare the aggregate exposures to the benchmark&#x27;s exposures. Then, examine mismatches  for evidence of unexpected biases or concentrations.  Suggestion 2- Identify inherent groupings among fund holdings based on a broad set of eight numerical  (operating and financial) measures related to the holdings’characteristics. Then, examine the groupings  for evidence of unexpected biases or concentrations.  Suggestion 3- Regress the return of the Fund on a set of country equity market indexes and sector  indexes based on the Fund’s benchmark. Then, examine the regression coefficients for evidence of  unexpected biases or concentrations. <\/p><\/div><\/details><div class=\"qtext\"><p>The data shown for Ms. Beta and Ms. Delta contain what is best described as an:<\/p><div class=\"tbl\"><table><tr><td>     Ms. Beta <\/td><td>Ms. Delta <\/td><\/tr><\/table><\/div><\/div>", "subj": "quant"}, {"n": 5, "q": "Among Rebecca Wong and William Leung, who most likely violated the CFA Institute Code of Ethics or any Standards of Professional Conduct?", "opts": ["Neither violated.", "Both violated.", "Only Leung violated."], "ans": "B", "expl": "Any act related to photocopying copyrighted material, regardless of the year of publication, is a violation of Standard I(A) because copyrighted materials are protected by law. Candidates and members must comply with all applicable laws, rules, and regulations and must not knowingly participate or assist in a violation of laws.", "explhtml": "<p>Any act related to photocopying copyrighted material, regardless of the year of publication, is a violation  of Standard I(A) because copyrighted materials are protected by law. Candidates and members must  comply with all applicable laws, rules, and regulations and must not knowingly participate or assist in a  violation of laws. <\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Ethics<\/summary><div class=\"vig-body\"><p>Rebecca Wong is enrolled to take the Level I CFA exam. Her friend William Leung purchased Level I study  materials from a well-known CFA review program the previous year. Leung made a photocopy of the  previous year&#x27;s copyrighted materials and sold it to Wong to help her study.  Molly Burnett, CFA, is a portfolio manager for a fund that only invests in environmentally friendly  companies. A multinational utility company recently acquired one of the fund&#x27;s best-performing  investments, a wind power company. The wind power company&#x27;s shareholders received utility company  shares as part of the merger agreement. The utility has one of the worst environmental records in the  industry, but its shares have been one of the top performers over the past 12 months. Because the utility  pays a high dividend every three months, Burnett holds the utility shares until the remaining two  dividends are paid for the year then sells the shares.  Robert Hamilton, a CFA candidate, is preparing a research report on Pets-R-Us for public distribution.  Hamilton&#x27;s preliminary report contains unfavorable earnings forecasts for the next four quarters. As part  of his analysis, Hamilton met with Linda Brisson, the president of Pets-R-Us, and asked her to review the  preliminary report for factual inaccuracies. Brisson revised Hamilton&#x27;s earnings forecasts so that the  quarterly earnings showed an upward trend and resulted in positive earnings by the fourth quarter.  Hamilton included the revised earnings figures in his report without further review. Although the final  report included the basic characteristics of Pets-R-Us, it emphasized certain areas such as projected  quarterly earnings but only briefly touched on others.  Beth Kozniak, a CFA candidate, is an independent licensed real estate broker and a well-known property  investor. She is currently brokering the sale of a commercial property on behalf of a client in financial  distress. If the client&#x27;s building is not sold within 30 days, he will lose the building to the bank. A year  earlier, another client of Kozniak&#x27;s had expressed interest in purchasing this same property. However,  she is unable to contact this client, and she has not discovered any other potential buyers. Given her  distressed client&#x27;s limited time frame, Kozniak purchases the property herself and forgoes any sales  commission. Six months later, she sells the property for a nice profit to the client who had earlier  expressed interest in the property.  <\/p><\/div><\/details><div class=\"qtext\"><p>Among Rebecca Wong and William Leung, who most likely violated the CFA Institute Code of Ethics<\/p><p>or any Standards of Professional Conduct? <\/p><\/div>", "subj": "ethics"}, {"n": 6, "q": "Has Kozniak most likely violated the CFA Institute Standards of Professional Conduct?", "opts": ["Yes, she did not disclose her potential conflicts of interest to either client", "Yes, she profited on the real estate to the detriment of her financially stressed client", "No"], "ans": "C", "expl": "Kozniak does not appear to have violated any CFA Institute Standards of Professional Conduct. Because she is known in the market for investing and brokering property and both parties have worked with Kozniak in the past, both parties would know of her interests. In addition, in both cases, she acts for her own account as a primary investor, not as a broker. She buys the property for her own portfolio and then sells the property from her own portfolio. Therefore, Kozniak did not violate Standard VI(A)–Disclosure of Conflicts. When she purchased the property for her portfolio, she saved her client from losing the building to the bank and did not charge a sales commission. Because the sale of the property to her other client did not take place until six months after her purchase, and she was unable to contact the client who had earlier expressed interest prior to her purchase, she cannot be accused of violating Standard III(A)–Loyalty, Prudence, and Care with either client.", "explhtml": "<p>Kozniak does not appear to have violated any CFA Institute Standards of Professional Conduct. Because she  is known in the market for investing and brokering property and both parties have worked with Kozniak in  the past, both parties would know of her interests. In addition, in both cases, she acts for her own account  as a primary investor, not as a broker. She buys the property for her own portfolio and then sells the  property from her own portfolio. Therefore, Kozniak did not violate Standard VI(A)–Disclosure of Conflicts.  When she purchased the property for her portfolio, she saved her client from losing the building to the  bank and did not charge a sales commission. Because the sale of the property to her other client did not  take place until six months after her purchase, and she was unable to contact the client who had earlier  expressed interest prior to her purchase, she cannot be accused of violating Standard III(A)–Loyalty,  Prudence, and Care with either client. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rebecca Wong is enrolled to take the Level I CFA exam. Her friend William Leung purchased Level I study  materials from a well-known CFA review program the previous year. Leung made a photocopy of the  previous year&#x27;s copyrighted materials and sold it to Wong to help her study.  Molly Burnett, CFA, is a portfolio manager for a fund that only invests in environmentally friendly  companies. A multinational utility company recently acquired one of the fund&#x27;s best-performing  investments, a wind power company. The wind power company&#x27;s shareholders received utility company  shares as part of the merger agreement. The utility has one of the worst environmental records in the  industry, but its shares have been one of the top performers over the past 12 months. Because the utility  pays a high dividend every three months, Burnett holds the utility shares until the remaining two  dividends are paid for the year then sells the shares.  Robert Hamilton, a CFA candidate, is preparing a research report on Pets-R-Us for public distribution.  Hamilton&#x27;s preliminary report contains unfavorable earnings forecasts for the next four quarters. As part  of his analysis, Hamilton met with Linda Brisson, the president of Pets-R-Us, and asked her to review the  preliminary report for factual inaccuracies. Brisson revised Hamilton&#x27;s earnings forecasts so that the  quarterly earnings showed an upward trend and resulted in positive earnings by the fourth quarter.  Hamilton included the revised earnings figures in his report without further review. Although the final  report included the basic characteristics of Pets-R-Us, it emphasized certain areas such as projected  quarterly earnings but only briefly touched on others.  Beth Kozniak, a CFA candidate, is an independent licensed real estate broker and a well-known property  investor. She is currently brokering the sale of a commercial property on behalf of a client in financial  distress. If the client&#x27;s building is not sold within 30 days, he will lose the building to the bank. A year  earlier, another client of Kozniak&#x27;s had expressed interest in purchasing this same property. However,  she is unable to contact this client, and she has not discovered any other potential buyers. Given her  distressed client&#x27;s limited time frame, Kozniak purchases the property herself and forgoes any sales  commission. Six months later, she sells the property for a nice profit to the client who had earlier  expressed interest in the property.  <\/p><\/div><\/details><div class=\"qtext\"><p>Has Kozniak most likely violated the CFA Institute Standards of Professional Conduct?<\/p><\/div>", "subj": "ethics"}, {"n": 7, "q": "Burnett most likely violated the CFA Institute Standard of Professional Conduct concerning:", "opts": ["Independence and Objectivity.", "Suitability.", "Disclosure of Conflicts."], "ans": "B", "expl": "The utility is not a suitable investment for a fund that only invests in companies with good environmental records. Continuing to hold this investment, therefore, was a violation of Standard III(C)–Suitability.", "explhtml": "<p>The utility is not a suitable investment for a fund that only invests in companies with good environmental  records. Continuing to hold this investment, therefore, was a violation of Standard III(C)–Suitability. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rebecca Wong is enrolled to take the Level I CFA exam. Her friend William Leung purchased Level I study  materials from a well-known CFA review program the previous year. Leung made a photocopy of the  previous year&#x27;s copyrighted materials and sold it to Wong to help her study.  Molly Burnett, CFA, is a portfolio manager for a fund that only invests in environmentally friendly  companies. A multinational utility company recently acquired one of the fund&#x27;s best-performing  investments, a wind power company. The wind power company&#x27;s shareholders received utility company  shares as part of the merger agreement. The utility has one of the worst environmental records in the  industry, but its shares have been one of the top performers over the past 12 months. Because the utility  pays a high dividend every three months, Burnett holds the utility shares until the remaining two  dividends are paid for the year then sells the shares.  Robert Hamilton, a CFA candidate, is preparing a research report on Pets-R-Us for public distribution.  Hamilton&#x27;s preliminary report contains unfavorable earnings forecasts for the next four quarters. As part  of his analysis, Hamilton met with Linda Brisson, the president of Pets-R-Us, and asked her to review the  preliminary report for factual inaccuracies. Brisson revised Hamilton&#x27;s earnings forecasts so that the  quarterly earnings showed an upward trend and resulted in positive earnings by the fourth quarter.  Hamilton included the revised earnings figures in his report without further review. Although the final  report included the basic characteristics of Pets-R-Us, it emphasized certain areas such as projected  quarterly earnings but only briefly touched on others.  Beth Kozniak, a CFA candidate, is an independent licensed real estate broker and a well-known property  investor. She is currently brokering the sale of a commercial property on behalf of a client in financial  distress. If the client&#x27;s building is not sold within 30 days, he will lose the building to the bank. A year  earlier, another client of Kozniak&#x27;s had expressed interest in purchasing this same property. However,  she is unable to contact this client, and she has not discovered any other potential buyers. Given her  distressed client&#x27;s limited time frame, Kozniak purchases the property herself and forgoes any sales  commission. Six months later, she sells the property for a nice profit to the client who had earlier  expressed interest in the property.  <\/p><\/div><\/details><div class=\"qtext\"><p>Burnett most likely violated the CFA Institute Standard of Professional Conduct concerning:<\/p><\/div>", "subj": "ethics"}, {"n": 8, "q": "According to CFA Institute Standards of Professional Conduct on research reports, Hamilton:", "opts": ["violated the Standard because he did not thoroughly review and analyze any information provided by Brisson.", "violated the Standard because the report did not give similar attention to all areas but instead emphasized quarterly earnings at the expense of other areas.", "did not violate the Standard."], "ans": "A", "expl": "Standard V(B) permits Hamilton to ask company management to review his report for factual inaccuracies, but Hamilton should have taken care to thoroughly review and analyze any information provided by the company. Hamilton is not required to give equal emphasis to all areas but can emphasize certain areas, touch briefly on others, and omit certain aspects deemed unimportant.", "explhtml": "<p>Standard V(B) permits Hamilton to ask company management to review his report for factual inaccuracies,  but Hamilton should have taken care to thoroughly review and analyze any information provided by the  company. Hamilton is not required to give equal emphasis to all areas but can emphasize certain areas,  touch briefly on others, and omit certain aspects deemed unimportant. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rebecca Wong is enrolled to take the Level I CFA exam. Her friend William Leung purchased Level I study  materials from a well-known CFA review program the previous year. Leung made a photocopy of the  previous year&#x27;s copyrighted materials and sold it to Wong to help her study.  Molly Burnett, CFA, is a portfolio manager for a fund that only invests in environmentally friendly  companies. A multinational utility company recently acquired one of the fund&#x27;s best-performing  investments, a wind power company. The wind power company&#x27;s shareholders received utility company  shares as part of the merger agreement. The utility has one of the worst environmental records in the  industry, but its shares have been one of the top performers over the past 12 months. Because the utility  pays a high dividend every three months, Burnett holds the utility shares until the remaining two  dividends are paid for the year then sells the shares.  Robert Hamilton, a CFA candidate, is preparing a research report on Pets-R-Us for public distribution.  Hamilton&#x27;s preliminary report contains unfavorable earnings forecasts for the next four quarters. As part  of his analysis, Hamilton met with Linda Brisson, the president of Pets-R-Us, and asked her to review the  preliminary report for factual inaccuracies. Brisson revised Hamilton&#x27;s earnings forecasts so that the  quarterly earnings showed an upward trend and resulted in positive earnings by the fourth quarter.  Hamilton included the revised earnings figures in his report without further review. Although the final  report included the basic characteristics of Pets-R-Us, it emphasized certain areas such as projected  quarterly earnings but only briefly touched on others.  Beth Kozniak, a CFA candidate, is an independent licensed real estate broker and a well-known property  investor. She is currently brokering the sale of a commercial property on behalf of a client in financial  distress. If the client&#x27;s building is not sold within 30 days, he will lose the building to the bank. A year  earlier, another client of Kozniak&#x27;s had expressed interest in purchasing this same property. However,  she is unable to contact this client, and she has not discovered any other potential buyers. Given her  distressed client&#x27;s limited time frame, Kozniak purchases the property herself and forgoes any sales  commission. Six months later, she sells the property for a nice profit to the client who had earlier  expressed interest in the property.  <\/p><\/div><\/details><div class=\"qtext\"><p>According to CFA Institute Standards of Professional Conduct on research reports, Hamilton:<\/p><\/div>", "subj": "ethics"}, {"n": 9, "q": "LaPoint’s statement to Saltzman:", "opts": ["violated the Standard relating to loyalty.", "violated the Standard relating to material nonpublic information.", "did not violate the Standards relating to loyalty or to material nonpublic information."], "ans": "C", "expl": "LaPoint could only have violated Standard II(A): Integrity of Capital Markets – Material Nonpublic Information if she revealed the information about the layoffs before it became public. As it was already on the national news channels roughly two hours prior to the opening of the market, she has not revealed nonpublic information to Saltzman. Similarly, she has not revealed confidential information in breach of her duty of loyalty to her employer (Standard IV(A): Duties to Employers – Loyalty). In different circumstances, had the information proved less newsworthy (i.e., if it wasn’t big enough news to immediately become a national story), she may well have violated Standard II(A): Integrity of Capital Markets – Material Nonpublic Information for not allowing sufficient time for the information to spread through the investment community.", "explhtml": "<p>LaPoint could only have violated Standard II(A): Integrity of Capital Markets – Material Nonpublic  Information if she revealed the information about the layoffs before it became public. As it was already on  the national news channels roughly two hours prior to the opening of the market, she has not revealed  nonpublic information to Saltzman. Similarly, she has not revealed confidential information in breach of  her duty of loyalty to her employer (Standard IV(A): Duties to Employers – Loyalty).   In different circumstances, had the information proved less newsworthy (i.e., if it wasn’t big enough news  to immediately become a national story), she may well have violated Standard II(A): Integrity of Capital  Markets – Material Nonpublic Information for not allowing sufficient time for the information to spread  through the investment community.  <\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Ethics<\/summary><div class=\"vig-body\"><p>Cheryl LaPoint is a CFA candidate who has passed the Level II exam. She works as a commercial real  estate broker in the Boston office of Trans Continental Properties (TCP), a publicly traded company with  offices around the US. Along with brokering office, warehouse, and manufacturing space, TCP has a small  relocation services unit that brokers residential home sales as a value-add to their commercial work.  Lately, the firm has been struggling.  <\/p><p>LaPoint typically commutes to work with friend and neighbour Andrew Saltzman, CFA, who works as a  portfolio manager for a large investment firm. One Monday as they depart for work, LaPoint turns the  radio to a national business news channel. One of the top stories is the announcement of major layoffs  in a number of TCP’s offices. She tells Saltzman:  <\/p><p>Statement 1: I have known about this for several weeks but I couldn’t tell you because of your job. I have  no idea how large the layoff will be or if my job is vulnerable. The press release went out at 7:00 AM,  and I checked online before I left home to make sure it was already in the news.   As the story unfolds, it becomes clear that TCP is closing a number of offices. The Boston office is among  them, and its operations will be transferred to the TCP office in New York City (NYC).  <\/p><p>When LaPoint arrives at work, she learns that only a few of the senior staff in Boston will be retained  and reassigned to positions in NYC. The remaining staff, including LaPoint, will be laid off. Emails have  already been sent to all clients of the Boston office, announcing the closure and layoffs. Contact  information about who will be handling their business out of the NYC office was included, with a promise  of more information to come.  <\/p><p>Later that day, LaPoint meets with the human resources department. She is offered a generous  severance package contingent on her signing a six-month non-compete agreement, which includes a  clause forbidding her to solicit any business from TCP clients.  <\/p><p>The next few days are spent preparing the site for closure. The IT department removes all company  applications and data from the personal laptops of the staff. The facility will be officially closed by Friday  when the staff terminations become effective.  <\/p><p>LaPoint has maintained separate personal and professional social media accounts. Prior to her official  termination, she updates all of her social media accounts with the pending change in her employment  status. She adds a message to her professional social media accounts that these accounts will be shut  down within two weeks. Many of these platforms generate an automatic update to all of the members  of LaPoint’s networks, alerting them to the changes in her profile. <\/p><p>After her termination, LaPoint realizes that she still has a remote hard drive used for backups. The drive  contains both personal files and work files from her former company. LaPoint does a full backup of her  personal laptop, which has had all company files removed. Previous backups, which contain company  files, remain on the drive. Not wanting to lose the backup history for her personal files, LaPoint ponders  how to handle the disposition of the drive.  <\/p><p>A competitor of TCP contacts LaPoint and offers her a temporary position in the residential brokerage  operations of the firm. The position would not require LaPoint to compete with TCP’s commercial  business. The hiring manager assures LaPoint that she would not be given any assignments that would  put her in competition with TCP’s relocation services unit. <\/p><\/div><\/details><div class=\"qtext\"><p>LaPoint’s statement to Saltzman:<\/p><\/div>", "subj": "ethics"}, {"n": 10, "q": "Which of the following best describes LaPoint’s handling of her social media presence?", "opts": ["Her handling of her social media presence complied with the Standards", "She violated her non-solicitation agreement and the Standard relating to loyalty by not deleting her professional accounts immediately upon termination", "She violated her non-solicitation agreement and the Standard relating to loyalty as the automatic updates that some accounts generate are a form of solicitation"], "ans": "A", "expl": "LaPoint’s handling of her social media accounts complied with the Standards, and her maintenance of separate personal and professional accounts is exemplary. It would be unreasonable to assume that the less active members of her professional networks would be aware of her change in status in such a short timeframe. Not immediately deleting her professional account, by itself, does not automatically form the basis of a solicitation violation. The automatic update only conveys information that her former clients would have already received directly from TCP itself or via news reports.", "explhtml": "<p>LaPoint’s handling of her social media accounts complied with the Standards, and her maintenance of  separate personal and professional accounts is exemplary.   It would be unreasonable to assume that the less active members of her professional networks would be  aware of her change in status in such a short timeframe. Not immediately deleting her professional account,  by itself, does not automatically form the basis of a solicitation violation.   The automatic update only conveys information that her former clients would have already received  directly from TCP itself or via news reports.  <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Cheryl LaPoint is a CFA candidate who has passed the Level II exam. She works as a commercial real  estate broker in the Boston office of Trans Continental Properties (TCP), a publicly traded company with  offices around the US. Along with brokering office, warehouse, and manufacturing space, TCP has a small  relocation services unit that brokers residential home sales as a value-add to their commercial work.  Lately, the firm has been struggling.  <\/p><p>LaPoint typically commutes to work with friend and neighbour Andrew Saltzman, CFA, who works as a  portfolio manager for a large investment firm. One Monday as they depart for work, LaPoint turns the  radio to a national business news channel. One of the top stories is the announcement of major layoffs  in a number of TCP’s offices. She tells Saltzman:  <\/p><p>Statement 1: I have known about this for several weeks but I couldn’t tell you because of your job. I have  no idea how large the layoff will be or if my job is vulnerable. The press release went out at 7:00 AM,  and I checked online before I left home to make sure it was already in the news.   As the story unfolds, it becomes clear that TCP is closing a number of offices. The Boston office is among  them, and its operations will be transferred to the TCP office in New York City (NYC).  <\/p><p>When LaPoint arrives at work, she learns that only a few of the senior staff in Boston will be retained  and reassigned to positions in NYC. The remaining staff, including LaPoint, will be laid off. Emails have  already been sent to all clients of the Boston office, announcing the closure and layoffs. Contact  information about who will be handling their business out of the NYC office was included, with a promise  of more information to come.  <\/p><p>Later that day, LaPoint meets with the human resources department. She is offered a generous  severance package contingent on her signing a six-month non-compete agreement, which includes a  clause forbidding her to solicit any business from TCP clients.  <\/p><p>The next few days are spent preparing the site for closure. The IT department removes all company  applications and data from the personal laptops of the staff. The facility will be officially closed by Friday  when the staff terminations become effective.  <\/p><p>LaPoint has maintained separate personal and professional social media accounts. Prior to her official  termination, she updates all of her social media accounts with the pending change in her employment  status. She adds a message to her professional social media accounts that these accounts will be shut  down within two weeks. Many of these platforms generate an automatic update to all of the members  of LaPoint’s networks, alerting them to the changes in her profile. <\/p><p>After her termination, LaPoint realizes that she still has a remote hard drive used for backups. The drive  contains both personal files and work files from her former company. LaPoint does a full backup of her  personal laptop, which has had all company files removed. Previous backups, which contain company  files, remain on the drive. Not wanting to lose the backup history for her personal files, LaPoint ponders  how to handle the disposition of the drive.  <\/p><p>A competitor of TCP contacts LaPoint and offers her a temporary position in the residential brokerage  operations of the firm. The position would not require LaPoint to compete with TCP’s commercial  business. The hiring manager assures LaPoint that she would not be given any assignments that would  put her in competition with TCP’s relocation services unit. <\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following best describes LaPoint’s handling of her social media presence?<\/p><\/div>", "subj": "ethics"}, {"n": 11, "q": "Regarding the backup drive, according to the Standards LaPoint should:", "opts": ["return the drive to her former employer.", "keep the drive but never restore any of her former employer’s data.", "contact her former employer, explain the situation with her personal files, and keep the drive."], "ans": "A", "expl": "While LaPoint’s actions were not intentional, she has violated Standard IV(A): Duties to Employers – Loyalty by keeping proprietary company data without the knowledge or permission of her former employer. Keeping the drive but not restoring her former employer’s data would turn an inadvertent violation into a conscious one. LaPoint has a duty to return company data to her former employer. She can request permission to keep the drive but she cannot on her own decide to keep the drive.", "explhtml": "<p>While LaPoint’s actions were not intentional, she has violated Standard IV(A): Duties to Employers – Loyalty  by keeping proprietary company data without the knowledge or permission of her former employer.   Keeping the drive but not restoring her former employer’s data would turn an inadvertent violation into a  conscious one. LaPoint has a duty to return company data to her former employer. She can request  permission to keep the drive but she cannot on her own decide to keep the drive.  <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Cheryl LaPoint is a CFA candidate who has passed the Level II exam. She works as a commercial real  estate broker in the Boston office of Trans Continental Properties (TCP), a publicly traded company with  offices around the US. Along with brokering office, warehouse, and manufacturing space, TCP has a small  relocation services unit that brokers residential home sales as a value-add to their commercial work.  Lately, the firm has been struggling.  <\/p><p>LaPoint typically commutes to work with friend and neighbour Andrew Saltzman, CFA, who works as a  portfolio manager for a large investment firm. One Monday as they depart for work, LaPoint turns the  radio to a national business news channel. One of the top stories is the announcement of major layoffs  in a number of TCP’s offices. She tells Saltzman:  <\/p><p>Statement 1: I have known about this for several weeks but I couldn’t tell you because of your job. I have  no idea how large the layoff will be or if my job is vulnerable. The press release went out at 7:00 AM,  and I checked online before I left home to make sure it was already in the news.   As the story unfolds, it becomes clear that TCP is closing a number of offices. The Boston office is among  them, and its operations will be transferred to the TCP office in New York City (NYC).  <\/p><p>When LaPoint arrives at work, she learns that only a few of the senior staff in Boston will be retained  and reassigned to positions in NYC. The remaining staff, including LaPoint, will be laid off. Emails have  already been sent to all clients of the Boston office, announcing the closure and layoffs. Contact  information about who will be handling their business out of the NYC office was included, with a promise  of more information to come.  <\/p><p>Later that day, LaPoint meets with the human resources department. She is offered a generous  severance package contingent on her signing a six-month non-compete agreement, which includes a  clause forbidding her to solicit any business from TCP clients.  <\/p><p>The next few days are spent preparing the site for closure. The IT department removes all company  applications and data from the personal laptops of the staff. The facility will be officially closed by Friday  when the staff terminations become effective.  <\/p><p>LaPoint has maintained separate personal and professional social media accounts. Prior to her official  termination, she updates all of her social media accounts with the pending change in her employment  status. She adds a message to her professional social media accounts that these accounts will be shut  down within two weeks. Many of these platforms generate an automatic update to all of the members  of LaPoint’s networks, alerting them to the changes in her profile. <\/p><p>After her termination, LaPoint realizes that she still has a remote hard drive used for backups. The drive  contains both personal files and work files from her former company. LaPoint does a full backup of her  personal laptop, which has had all company files removed. Previous backups, which contain company  files, remain on the drive. Not wanting to lose the backup history for her personal files, LaPoint ponders  how to handle the disposition of the drive.  <\/p><p>A competitor of TCP contacts LaPoint and offers her a temporary position in the residential brokerage  operations of the firm. The position would not require LaPoint to compete with TCP’s commercial  business. The hiring manager assures LaPoint that she would not be given any assignments that would  put her in competition with TCP’s relocation services unit. <\/p><\/div><\/details><div class=\"qtext\"><p>Regarding the backup drive, according to the Standards LaPoint should:<\/p><\/div>", "subj": "ethics"}, {"n": 12, "q": "According to the Standards, which of the following should be the principal consideration for LaPoint in deciding whether to accept the temporary position?", "opts": ["LaPoint’s experience is in commercial, and not residential, real estate, no non-compete violation is likely to occur", "Accepting this position would be a violation of LaPoint’s non-compete agreement and the Standard relating to loyalty", "The assurances given to LaPoint by the hiring manager would allow her to conform with the non- compete agreement and the Standard relating to loyalty"], "ans": "B", "expl": "TCP does have a minor retail presence, and this would put LaPoint in direct violation of her contractual obligations to TCP and Standard IV(A): Duties to Employers – Loyalty. Although LaPoint’s experience is in commercial real estate and the temporary offer deals with the residential market, it should not be the principal consideration in her decision making. A conflict with her obligations to TCP is still possible. The assurances given LaPoint are inherently unreliable and should not be the principal consideration in her decision making. When LaPoint is assigned as a broker representing the buyer or seller in any particular real estate deal, it would be impossible for her to avoid being confronted at some point with a counterparty represented by a TCP real estate broker. Simply operating in the same market creates a conflict with her obligations to TCP and Standard IV(A) Duties to Employers – Loyalty.", "explhtml": "<p>TCP does have a minor retail presence, and this would put LaPoint in direct violation of her contractual  obligations to TCP and Standard IV(A): Duties to Employers – Loyalty. Although LaPoint’s experience is in  commercial real estate and the temporary offer deals with the residential market, it should not be the  principal consideration in her decision making. A conflict with her obligations to TCP is still possible. The  assurances given LaPoint are inherently unreliable and should not be the principal consideration in her  decision making. When LaPoint is assigned as a broker representing the buyer or seller in any particular real  estate deal, it would be impossible for her to avoid being confronted at some point with a counterparty  represented by a TCP real estate broker. Simply operating in the same market creates a conflict with her  obligations to TCP and Standard IV(A) Duties to Employers – Loyalty. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Cheryl LaPoint is a CFA candidate who has passed the Level II exam. She works as a commercial real  estate broker in the Boston office of Trans Continental Properties (TCP), a publicly traded company with  offices around the US. Along with brokering office, warehouse, and manufacturing space, TCP has a small  relocation services unit that brokers residential home sales as a value-add to their commercial work.  Lately, the firm has been struggling.  <\/p><p>LaPoint typically commutes to work with friend and neighbour Andrew Saltzman, CFA, who works as a  portfolio manager for a large investment firm. One Monday as they depart for work, LaPoint turns the  radio to a national business news channel. One of the top stories is the announcement of major layoffs  in a number of TCP’s offices. She tells Saltzman:  <\/p><p>Statement 1: I have known about this for several weeks but I couldn’t tell you because of your job. I have  no idea how large the layoff will be or if my job is vulnerable. The press release went out at 7:00 AM,  and I checked online before I left home to make sure it was already in the news.   As the story unfolds, it becomes clear that TCP is closing a number of offices. The Boston office is among  them, and its operations will be transferred to the TCP office in New York City (NYC).  <\/p><p>When LaPoint arrives at work, she learns that only a few of the senior staff in Boston will be retained  and reassigned to positions in NYC. The remaining staff, including LaPoint, will be laid off. Emails have  already been sent to all clients of the Boston office, announcing the closure and layoffs. Contact  information about who will be handling their business out of the NYC office was included, with a promise  of more information to come.  <\/p><p>Later that day, LaPoint meets with the human resources department. She is offered a generous  severance package contingent on her signing a six-month non-compete agreement, which includes a  clause forbidding her to solicit any business from TCP clients.  <\/p><p>The next few days are spent preparing the site for closure. The IT department removes all company  applications and data from the personal laptops of the staff. The facility will be officially closed by Friday  when the staff terminations become effective.  <\/p><p>LaPoint has maintained separate personal and professional social media accounts. Prior to her official  termination, she updates all of her social media accounts with the pending change in her employment  status. She adds a message to her professional social media accounts that these accounts will be shut  down within two weeks. Many of these platforms generate an automatic update to all of the members  of LaPoint’s networks, alerting them to the changes in her profile. <\/p><p>After her termination, LaPoint realizes that she still has a remote hard drive used for backups. The drive  contains both personal files and work files from her former company. LaPoint does a full backup of her  personal laptop, which has had all company files removed. Previous backups, which contain company  files, remain on the drive. Not wanting to lose the backup history for her personal files, LaPoint ponders  how to handle the disposition of the drive.  <\/p><p>A competitor of TCP contacts LaPoint and offers her a temporary position in the residential brokerage  operations of the firm. The position would not require LaPoint to compete with TCP’s commercial  business. The hiring manager assures LaPoint that she would not be given any assignments that would  put her in competition with TCP’s relocation services unit. <\/p><\/div><\/details><div class=\"qtext\"><p>According to the Standards, which of the following should be the principal consideration for LaPoint<\/p><p>in deciding whether to accept the temporary position?  <\/p><\/div>", "subj": "ethics"}, {"n": 13, "q": "If there are no other carry cash flows, the value of Modi’s existing forward contract will be closest to:", "opts": ["–10.00.", "9.24.", "10.35."], "ans": "B", "expl": "For this case, we have F0 = 102, S (0.75) = 110, r = 5%, and T – t = 0.25. Note that the new forward price at t is simply Ft = FV(St) = 110(1 + 0.05) 0.25 = 111.3499. Therefore, Vt = PV[Ft – F0] = (111.3499 – 102)/(1 + 0.05) 0.25 = 9.2366, or Vt = St – PV[F0] = 110 – 102/(1 + 0.05) 0.25 = 9.2366.", "explhtml": "<p>For this case, we have F0 = 102, S (0.75) = 110, r = 5%, and T – t = 0.25. Note that the new forward price at  t is simply Ft = FV(St) = 110(1 + 0.05)<sup>0.25<\/sup> = 111.3499. Therefore,  Vt = PV[Ft – F0] = (111.3499 – 102)/(1 + 0.05)<sup>0.25<\/sup> = 9.2366, or  Vt = St – PV[F0] = 110 – 102/(1 + 0.05)<sup>0.25 <\/sup>= 9.2366. <\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Derivatives<\/summary><div class=\"vig-body\"><p>Mahendra Modi, CFA bought a one-year forward contract at 102, and there are now three months to  expiration. The underlying is currently trading for 110, and interest rates are 5% on an annual  compounding basis. <\/p><p>US company needs to borrow 100 million Australian dollars (A$) for one year for its Australian subsidiary.  The company decided to borrow in US dollars (US$) an amount equivalent to A$100 million by issuing  US-denominated bonds. The company then entered a one-year currency swap with a swap dealer. The  swap uses quarterly reset (30/360 day count) and exchange of notional amounts at initiation and at  maturity. At the swap’s expiration, the US company pays the notional amount in Australian dollars and  receives from the dealer the notional amount in US dollars. The fixed rates were found to be 2.7695%  for Australian dollars and 0.2497% for US dollars. Initially, the notional amount in US dollars was  determined to be US$87,719,298 with a spot exchange rate of A$1.14 for US$1. Assume 60 days have  passed since swap initiation and we now observe the following updated market information: <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/efs/s1-002.webp\" style=\"max-width:min(100%,478px)\" alt=\"\"><p>The currency spot exchange rate (St) is now A$1.13 for US$1. <\/p><p>Aakash Aasmani, CFA is trying to crack the Black Model for valuing options. The S&amp;P 500 Index (a spot  index) is presently at 1,860 and the 0.25 expiration futures contract is trading at 1,851.65. Suppose  further that the exercise price is 1,860, the continuously compounded risk-free rate is 0.2%, time to  expiration is 0.25, volatility is 15%, and the dividend yield is 2.0%. Based on this information, the  following results are obtained for options on the futures contract.               Options on Futures <\/p><div class=\"tbl\"><table><tr><td>Calls  <\/td><td>Puts <\/td><\/tr><tr><td>N(d1) =0.491  <\/td><td>N(–d1) = 0.509 <\/td><\/tr><tr><td>N(d2) = 0.461  <\/td><td>N(–d2) = 0.539 <\/td><\/tr><tr><td>c = US$51.41  <\/td><td>p = US$59.76 <\/td><\/tr><\/table><\/div><p>Riya Shah, CFA addresses her team: “Suppose we know S = 100, X = 100, r = 5%, T = 1.0, σ = 30%, and δ  = 5%. We have a short position in put options on 10,000 shares of stock. Based on this information, we  note Deltac = 0.532, and Deltap = –0.419. Assume each stock option contract is for one share of stock.  What could be the appropriate delta hedge?” <\/p><\/div><\/details><div class=\"qtext\"><p>If there are no other carry cash flows, the value of Modi’s existing forward contract will be closest<\/p><p>to: <\/p><\/div>", "subj": "derivatives"}, {"n": 14, "q": "With regards to currency swap, the current value to the swap dealer in A$ of the currency swap entered 60 days ago will be closest to:", "opts": ["–A$13,557,000.", "A$637,620.", "A$2,145,200."], "ans": "C", "expl": "The US firm issues $87.7 million of bonds and enters a swap with the swap dealer. The initial exchange rate is given as 1.14A$/1US$, so currency a is A$. The swap dealer is receiving quarterly interest payments in currency a (A$). After 60 days, the new exchange rate is 1.13A$/1US$ and the term structure of interest rates has changed in both markets. The value of the swap to the party receiving interest payments in Australian dollars, which is the swap dealer: V = A$100,000,000 × [0.00692375 (3.967683) + 0.986031] – 1.13 (A$/1US$) × (US$87,719,298) × [0.00062425 (3.994841) + 0.998336] = A$2,145,167.", "explhtml": "<p>The US firm issues $87.7 million of bonds and enters a swap with the swap dealer. The initial exchange rate  is given as 1.14A$/1US$, so currency a is A$. The swap dealer is receiving quarterly interest payments in  currency a (A$). <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/efs/s1a-001.webp\" style=\"max-width:min(100%,389px)\" alt=\"\"><p>After 60 days, the new exchange rate is 1.13A$/1US$ and the term structure of interest rates has changed  in both markets. The value of the swap to the party receiving interest payments in Australian dollars, which  is the swap dealer:   V = A$100,000,000 × [0.00692375 (3.967683) + 0.986031] – 1.13 (A$/1US$) × (US$87,719,298) ×  [0.00062425 (3.994841) + 0.998336] = A$2,145,167. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mahendra Modi, CFA bought a one-year forward contract at 102, and there are now three months to  expiration. The underlying is currently trading for 110, and interest rates are 5% on an annual  compounding basis. <\/p><p>US company needs to borrow 100 million Australian dollars (A$) for one year for its Australian subsidiary.  The company decided to borrow in US dollars (US$) an amount equivalent to A$100 million by issuing  US-denominated bonds. The company then entered a one-year currency swap with a swap dealer. The  swap uses quarterly reset (30/360 day count) and exchange of notional amounts at initiation and at  maturity. At the swap’s expiration, the US company pays the notional amount in Australian dollars and  receives from the dealer the notional amount in US dollars. The fixed rates were found to be 2.7695%  for Australian dollars and 0.2497% for US dollars. Initially, the notional amount in US dollars was  determined to be US$87,719,298 with a spot exchange rate of A$
