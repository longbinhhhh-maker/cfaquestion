year (from 0.25\nto 0.24).\n(Choice C) Profitability, measured by net profit margin, decreased in the current year (from 0.22\nto 0.20)\nThings to remember:\nReturn on equity (ROE) measures the level of net income generated by a company's use of equity.\nClassic DuPont analysis decomposes ROE into three distinct components: profitability, efficiency,\nand leverage. All else equal, an increase to any one component will positively impact ROE.\nDemonstrate the application of DuPont analysis of return on equity and calculate and interpret effects of\nchanges in its components\nLOS", "qhtml": null}, {"n": 56, "q": "A due diligence analyst is examining the correlation coefficients for the 10-year monthly\nreturns of four stock mutual funds:\nFund W Fund X Fund Y Fund Z\nFund W 1.0000 0.8784 −0.3021 0.6586\nFund X 1.0000 0.0072 0.9789\nFund Y 1.0000 −0.2540\nFund Z 1.0000\nWhich of the following is the least appropriate interpretation of this correlation matrix's data?", "opts": ["Fund X and Fund Y may have a nonlinear relationship.", "Fund X's performance can explain Fund W's performance.", "Fund X and Fund Z likely hold a significant amount of the same securities."], "ans": "B", "expl": "Correlation is a standardized measure of the tendency for two variables (eg, investment\nreturns) to move in a similar manner ; that is, it measures the strength of the linear\nrelationship between the two variables. The correlation coefficient (ρ ) can be positive or\n1,2\nnegative, and since it is standardized, it is bounded between +1 and −1 .\nIn this scenario, the returns of Fund X and Fund W have a relatively strong\ncorrelation with each other. However, it is not due to Fund X influencing or bringing about\n(ie, causing) the return pattern for Fund W. Correlation does not imply causation.\n(Choice A) If two variables essentially have a correlation of zero (such as Fund X and Fund\nY), the data would indicate almost no linear relationship between their returns. However,\nthese two variables could have a strong nonlinear relation that is not measured by\ncorrelation. This is one of the limitations of correlation analysis.\n(Choice C) While Fund X and Fund Z returns have a very high correlation with each other, it\ndoes not necessarily mean they own the same securities, in any amount. Each fund may own\na different mix of securities that produces a fund whose returns are highly correlated with the\nother fund.\nThings to remember:\nCorrelation measures the tendency for two variables (eg, investment returns) to move in a\nsimilar manner. It expresses the strength of the linear relationship between the variables.\nHowever, the fact that two variables are highly correlated does not mean that one variable has\ninfluenced the other.\nInterpret correlation between two variables to address an investment problem\nLOS", "qhtml": null}, {"n": 57, "q": "An investor deposits ¥100 million into a fund at the beginning of Year 1 and deposits another\n¥50 million at the beginning of Year 2. At the beginning of Year 3, the investor withdraws ¥15\nmillion. The fund has the following returns:\nYear Return (%)\n1 20\n2 10\n3 −20\nThe investor's money-weighted annual rate of return over the three-year period is closest to:", "opts": ["0.7%", "1.0%", "1.8%"], "ans": "A", "expl": "The money-weighted return (MWR), an application of the internal rate of return (IRR),\nmeasures investment performance based on an investor's cash flows (ie, deposits and\nwithdrawals). By contrast, the arithmetic mean and time-weighted return do not account for\ncash flows into and out of the portfolio.\nAs an application of the IRR, the MWR discounts cash flows so that their net present value\n(NPV) is equal to zero and the initial investment is equal to the future discounted deposits and\nwithdrawals. For the investor, deposits are outflows and withdrawals are inflows.\nWhen calculating MWR, the investment's ending value is assumed to be the final cash\ninflow (if positive) or outflow (if negative). Therefore, to calculate the MWR , the ending\nbalance must be calculated first, using the investor's deposits and withdrawals and the return\non the investment over each period.\n(¥ millions) Year 1 Year 2 Year 3\nBalance at beginning of year 0 120 187\nInvestor's deposits (withdrawals) 100 50 −15\nNet balance after deposits (withdrawals) 100 170 172\nReturn for the year 20% 10% −20%\nInvestment gain (loss) 20 17 −34.4\nBalance at end of year [= Net balance + Investment gain (loss)] 120 187 137.6\nAfter the cash flows have been identified, solve for the MWR using a financial calculator .\nEnter positive values for cash inflows and negative values for cash outflows.\n(Choice B) 1.0% results from incorrectly combining the withdrawal in the beginning of the\nthird year (¥15 million) with the investment's balance at the end of the third year (¥137.6\nmillion) into one cash flow. The withdrawal of ¥15 million should be included at the end of\nYear 2, which is the same as the beginning of Year 3.\n(Choice C) 1.8% results from using the geometric mean to measure the investment's\nperformance. MWR uses an investor's cash flows to determine the return.\nThings to remember:\nThe money-weighted return is an application of the internal rate of return. It measures the\nactual return on an investment based on the amount of contributions and withdrawals and the\nperiodic returns on the investment.\nCalculate and interpret major return measures and describe their appropriate uses\nLOS", "qhtml": null}, {"n": 58, "q": "In an oligopoly market where firms' pricing is interdependent, price elasticity of demand\nis most likely :", "opts": ["constant regardless of price changes.", "greater when the price is increased and less when the price is decreased.", "greater when the price is decreased and less when the price is increased."], "ans": "B", "expl": "Characteristics of pricing interdependence\nCompetitors match a decrease in price but ignore an increase in price\nDemand curve is kinked due to the different reactions of competitors to price change\nPrice elasticity of demand is likely to be:\nhigher when prices rise\nlower when prices fall\nTwo distinct demand patterns exist:\none linked to rising prices\nanother linked to decreasing prices\nIn an oligopoly , a few major companies dominate the market, typically offering similar\nproducts or services. The oligopoly market structure is marked by high barriers to entry,\nwhich can include substantial capital requirements and the need for proprietary technology.\nThese barriers create pricing power for the established firms and act as deterrents to new\nentrants.\nOligopoly markets often exhibit pricing interdependence, in which one firm's pricing decisions\ndirectly affect the pricing strategies of other competitors within the same market. In this\ncase, competitors match price decreases but ignore price increases. Matching lower prices\nprevents loss of market share, since, given similar products, customers can substitute.\nThus, in an oligopoly, price elasticity of demand is greater for price increases because\ncustomers substitute with competitors' products that are still at the original (now lower) price;\nit is less for decreases, since competitors match the decreased price.\n(Choices A and C) With pricing interdependence, price elasticity of demand is greater when\nthe price is increased and less when the price is decreased.\nThings to remember:\nPricing interdependence in oligopoly markets occurs when one firm's pricing decisions directly\ninfluence the pricing strategies of its competitors. Typically, competitors match price\nreductions but not price increases. Demand elasticity varies: It is greater when prices rise and\nless when prices decrease.\nExplain supply and demand relationships under oligopoly, including the optimal price and output\nfor firms as well as pricing strategy\nLOS", "qhtml": null}, {"n": 59, "q": "Which of the following is most likely a difference between maintaining a fixed parity exchange\nrate system and a currency board system? In a fixed parity exchange rate system, the\ncountry:", "opts": ["retains monetary independence.", "has a legislative commitment to the specified parity.", "has discretion over the level of foreign exchange reserves."], "ans": "C", "expl": "Fixed parity exchange rate vs. currency board system\nFixed parity Currency board system\nPegged to a major currency\nCommitment to fixed exchange rate\nPegged to a major currency\nCurrency issued only against foreign\nNo commitment to a specified parity\nexchange, fully backed by foreign\nDiscretion over the level of foreign exchange\nassets\nreserves\nMonetary base directly linked to\nMonetary independence is limited\ntrade/capital flows\nThe monetary authority functions as a central\nLimited monetary independence\nbank (eg, can act as the lender of last resort)\nMonetary authority does not function as\na traditional central bank\nIn both a fixed parity exchange rate system and a currency board system, a country's\ncurrency is pegged to another major currency or a basket of currencies. In developing\ncountries, the government or central bank sets and maintains the exchange rate at a fixed\nlevel with currencies of developed nations or major trading partners.\nThere are two major differences between a fixed parity exchange rate system and a currency\nboard system:\nIn a fixed parity exchange rate system, there is no legislative commitment to a specified\nparity (Choice B) . The country has the option to adjust or abandon the specified parity\ninstead of undergoing changes to meet the parity level.\nA fixed parity exchange rate system allows for discretion in maintaining the specific level\nof foreign exchange reserves. This level is not tied to or influenced by the amount of\nmoney circulating in the domestic economy. The monetary authority allows a range for\nprivate flows to influence the parity rate, but it may buy or sell foreign currency using\nreserves to ensure the rate stays within this specified band.\n(Choice A) A country with either a fixed parity exchange rate system or a currency board\nsystem generally has limited monetary independence as the value of the country's currency is\npegged to another currency or a basket of currencies.\nThings to remember:\nIn both a fixed parity exchange rate system and a currency board system, a country's\ncurrency is pegged to another major currency or a basket of currencies. The fixed parity\nexchange rate system differs from a currency board system in that there is discretion in\nmaintaining the specific level of foreign exchange reserves and no legislative commitment to\nthe specified parity.\nDescribe exchange rate regimes and explain the effects of exchange rates on countries’\ninternational trade and capital flows\nLOS", "qhtml": null}, {"n": 60, "q": "The process of recalculating deferred tax assets and liabilities at the end of each reporting\nperiod most likely involves:", "opts": ["assessing the current tax benefits of tax loss carryforwards.", "analyzing the future income tax payable based on current profits.", "comparing the tax bases and carrying amounts of balance sheet items."], "ans": "C", "expl": "Creation of deferred tax assets (DTA) and liabilities (DTL)\nBalance sheet\nScenario\nitem\nCarrying amount > Tax base → DTL\nAsset\nCarrying amount < Tax base → DTA\nCarrying amount > Tax base → DTA\nLiability\nCarrying amount < Tax base → DTL\nDeferred tax assets (DTA) and deferred tax liabilities (DTL) arise\nfrom differences between an asset's or liability's tax base and carrying amount , driven by\nvariations in accounting rules and tax regulations. For instance, a company may use different\ndepreciation methods for tax and financial reporting, which would create temporary\ndifferences.\nA DTA occurs when the carrying amount of an asset is less than its tax base, indicating\nexcess taxes paid.\nA DTL occurs when the carrying amount of a liability is less than its tax base, indicating\ndeferred tax obligations for future fulfillment.\nDeferred tax asset vs. deferred tax liability\nIncome tax expense < taxes payable\nDeferred tax asset\nCreated by overpaying tax in current period\nIncome tax expense > taxes payable\nDeferred tax liability\nCreated by underpaying tax in current period\nBoth DTA and DTL arise from temporary discrepancies between accounting\nprofit and taxable income . Such discrepancies result from timing differences in recognizing\ncertain items for financial reporting compared with tax reporting. This leads to the creation of\ndeferred tax balances: future tax benefits for DTA and future tax payments for DTL.\nAt the end of each reporting period, deferred tax assets and liabilities are recalculated by\ncomparing the tax bases and carrying amounts of the balance sheet items (Choice A and\nB) . The changes in deferred tax assets and liabilities are then incorporated into income tax\npayable in order to determine the company's income tax expense (or credit) as reported on\nthe income statement.\nThings to remember:\nDeferred tax assets (DTA) and deferred tax liabilities (DTL) result from temporary differences\nbetween tax bases and carrying amounts. These differences are created by timing\ndiscrepancies between the recognition of accounting profit and taxable income, which result in\nfuture tax benefits (DTA) or payments (DTL). At the end of each reporting period, DTA and\nDTL are recalculated; this affects the company's reported income tax expense or credit).\nExplain how deferred tax liabilities and assets are created and the factors that determine how a\ncompany’s deferred tax liabilities and assets should be treated for the purposes of financial\nanalysis\nLOS", "qhtml": null}, {"n": 61, "q": "If the Canadian dollar (CAD) depreciates 3% against the Australian dollar (AUD) over a period,\nthen the appreciation of the AUD against the CAD is most likely :", "opts": ["less than 3%.", "equal to 3%.", "greater than 3%."], "ans": "C", "expl": "Currency values are expressed in exchange rates as the amount of the price currency per one\nunit of the base currency. When an exchange rate changes, the percentage change in each of\nthe two currencies' values is inversely proportional. The absolute value of the changes must\nbe the same for both currencies, but the percentage changes cannot be equal.\nThe percentage increase of one currency is always greater than the percentage\ndecrease of the other currency.\nIn this scenario, the depreciation in the Canadian dollar (CAD) against the Australian dollar\n(AUD) must be converted to appreciation of the AUD against the CAD based on the above\nequation:\nThe appreciation of the AUD is 3.09%, which is greater than the depreciation of the CAD of\n3% (Choices A and B) .\nThings to remember:\nWhen an exchange rate changes, the percentage change in the two currencies' values are\ninversely proportional. Althoughthe absolute money value of the changes must be the same\nfor both currencies, the percentage gain of one currency is always greater than the percentage\nloss of the other.\nDescribe the foreign exchange market, including its functions and participants, distinguish between\nnominal and real exchange rates, and calculate and interpret the percentage change in a currency\nrelative to another currency\nLOS", "qhtml": null}, {"n": 62, "q": "If the inflation rate is expected to rise above a central bank's inflation target, that central\nbank's most appropriate action would be to:", "opts": ["increase the policy rate above the neutral rate.", "buy government bonds from commercial banks.", "lower the reserve requirement for commercial banks."], "ans": "A", "expl": "Monetary policy tools\nTool Description Expansionary Contractionary\nOpen market Trade securities (usually government Buy\nSell securities\noperations securities) securities\nPolicy interest rate Set interest rate used to signal markets Lower Raise\nSet percentage of bank deposits held in\nReserve requirements Decrease Increase\nreserves\nCentral banks have different primary policy objectives, but one common goal is price stability.\nCentral banks attempt to achieve this stability by influencing money supply levels with one or\nmore monetary policy tools. When a central bank expects inflation to\nrise above the target , it would most appropriately seek to curb inflation by implementing\na contractionary monetary policy .\nTo accomplish this, the central bank can target an increase in commercial banks' lending rates\nby increasing its policy rate above the neutral rate. Commercial banks tend to base their\nlending rates on the policy rate plus a spread. Therefore, a higher policy rate would cause\nthose banks to either raise their lending rates or accept lower margins, thus discouraging\nlending and borrowing. Less supply and demand for business and consumer loans would slow\ncapital expenditures and consumption. In theory, these effects should lower inflationary\npressures.\n(Choice B) Buying government bonds from commercial banks is an expansionary monetary\npolicy that gives those banks more excess reserves to lend. This policy would be\ninappropriate if the goal is to reduce inflationary pressures.\n(Choice C) Lowering the reserve requirement for commercial banks encourages those banks\nto lend more money. This expansionary monetary policy would be inappropriate if the goal is\nto reduce inflationary pressures.\nThings to remember:\nA central bank's policy rate is the interest rate it charges when lending money to commercial\nbanks. If a central bank expects inflation to rise above its target, it can increase the policy\nrate above the neutral rate with the goal of reducing inflationary pressures by increasing\ncommercial banks' lending rates.\nDescribe tools used to implement monetary policy tools and the monetary transmission\nmechanism, and explain the relationships between monetary policy and economic growth,\ninflation, interest, and exchange rates\nLOS", "qhtml": null}, {"n": 63, "q": "An analyst has estimated the probabilities of two unrelated events. Which probability rule\nis most appropriate for calculating the joint probability of these two events?", "opts": ["Addition", "Multiplication", "Total probability"], "ans": "B", "expl": "Basic probability rules\nProbability that either events A or B occur\nRemember to subtract the joint\nAddition rule P ( A or B ) = P ( A ) + P ( B ) − P ( AB )\nprobability that both events occur\nProbability that both events A and B occur\nMultiplication When A and B are independent events,\nP ( A and B ) = P ( A | B ) × P ( B )\nrule\nformula simplifies to P ( A ) × P ( B )\nUnconditional probability that A occurs\nwhether a different event B occurs or\nP ( A ) = P ( A | B occurs)\nTotal does not occur\n× P ( B occurs) + P ( A | B not\nprobability rule\nMore easily understood with a tree\noccur) × P ( B not occur)\ndiagram\nTo calculate the joint probability of two events, P ( A and B ) , use the multiplication rule\nfor probability : P ( AB ) = P ( A | B ) P ( B ).\nIf events A and B are independent (ie, unrelated), as in this instance, then P ( A ) = P ( A|B ) (ie,\nprobability of A is the same as probability of A given B ) since the probability of A occurring is\nthe same whether or not B occurs. The multiplication rule then simplifies to P ( AB )\n= P ( A ) P ( B ) .\n(Choice A) The addition rule can be used to determine the probability of an event\n( A ) or another event ( B ). For any two events, the addition rule for probabilities describes how\nto calculate the probability that A or B will occur, or P ( A or B ).\n(Choice C) The total probability rule is used to calculate the unconditional probability that an\nevent occurs, regardless of the occurrence of other events (example).\nThings to remember:\nTo calculate the joint probability of two events, use the multiplication rule for\nprobability: P ( AB ) = P ( A | B ) P ( B ). If the events are independent, the rule simplifies to P ( AB )\n= P ( A ) P ( B ).\nFormulate an investment problem as a probability tree and explain the use of conditional\nexpectations in investment application\nLOS", "qhtml": null}, {"n": 64, "q": "Based on the financial statement analysis framework, which of the following is least likely a\nsource of information when collecting input data?", "opts": ["Industry and economic data", "Financial statement forecasts", "Discussions with management"], "ans": "B", "expl": "Financial statement analysis framework\nPhase Action Result\nArticulate purpose of analysis Written objective of analysis\nArticulate purpose Determine the audience Nature of reporting\nOrganized financial\nObtain financial data statements\nCollect data\nVisit company Insight into goals and\noperations\nAdjusted financial statements\nAdjust numbers\nCommon-sized statements\nProcess data\nCalculate data\nFinancial ratios and forecasts\nUnderstand the processed\nAnalyst's report\nAnalyze/interpret data\ndata\nDevelop\nPlot course of action Recommendation report\nrecommendation\nRepeat analysis as data\nReissue analyses and reports\nFollow up\nchanges\nThe financial statement analysis framework is a series of six phases that describe how\nfinancial statement analysis is accomplished when evaluating investments in a company's\nsecurities. In each phase, the analyst acts on information and turns it into a result that can\nbe used to complete the next phase. In the data collection phase, an analyst collects all\npertinent data after articulating the purpose(s) of the analysis. Data collected can be\nquantitative and qualitative items pertaining to:\nMacroeconomic data (eg, GDP, inflation)\nThe prospects of the industry in which the company operates (Choice A)\nThe prospects of the company within the industry (eg, historical financial data,\ndiscussions with management) (Choice C)\nThe result of this phase is a collection of data that can be processed in the data processing\nphase . The results of processing the data include:\nFinancial statement forecasts\nRatios and common-sized financial statements\nCharts and graphs\nThis data can then be used to analyze the company as an investment.\nThings to remember:\nThe financial statement analysis framework describes how financial statement analysis is\naccomplished when evaluating investments in a company's securities. The data collection\nphase results in a collection of data that can be processed in the data processing phase. The\nresults of processing the data include financial statement forecasts, which can be used to\nanalyze the company as an investment.\nDescribe the steps in the financial statement analysis framework\nLOS", "qhtml": null}, {"n": 65, "q": "Which of the following is most likely a limitation of an audit opinion? The auditor:", "opts": ["relies on sampling.", "is responsible for detecting fraud.", "is compensated by regulatory agencies."], "ans": "A", "expl": "Limitations of auditor's opinion\nOpinion results from company-provided information,\nBasis of opinion\nwhich auditor may not be able to verify\nSampling Auditor may not be able to uncover all misstatements\nPublic may overestimate auditor's role in company's\nExpectations gap\nfinancial statement presentation\nCompany pays auditor's fee, which may raise the\nAuditor's compensation\nappearance of conflict of interest\nDuring an audit, an independent auditor reviews the company's financial records ,\ntransactions, and related documentation to ensure compliance with accounting standards and\nregulations. The audit opinion represents the auditor's professional judgment as to\nwhether the financial statements present a true and fair view of the company's financial\nposition and performance.\nAudit opinions are available to creditors, shareholders, and regulators, creating transparency\nin financial reporting. However, inherent limitations exist. For example, auditors rely solely\non information prepared by the company. In addition, the use of sampling in audits, with only\na subset of transactions reviewed, poses a risk of overlooking misstatements and even errors.\nThere may also be a disparity between the auditor's role and public expectations, known as an\n\"expectations gap.\" The public might expect auditors to detect fraud and/or assess the\nprobability of business success, but these activities are beyond the auditor's limited\nscope (Choice B) .\n(Choice C) Auditor fees are typically paid by the audited company, not by regulatory\nagencies. This can create an incentive for the auditor to be lenient, especially if the company\nalso hires the auditor for other services.\nThings to remember:\nAudit opinions verify the appropriateness of financial reporting, but they have limitations.\nThese include reliance on company-prepared information and sampled data. Such limitations\nmay lead to the auditor's missing reporting errors or fraud.\nDescribe mechanisms that discipline financial reporting quality and the potential limitations of\nthose mechanisms\nLOS", "qhtml": null}, {"n": 66, "q": "An analyst runs a simple linear regression using a sample of 10 observations. To assess the\nvalidity of the regression statistics, the analyst randomly draws 20 observations from the\nsame data. The results of both regression analyses are:\nSum of Sum of\nSample size squares squares\ntotal (SST) errors (SSE)\nRegression 1 10 167.00 47.75\nRegression 2 20 334.00 95.50\nBased on this information, the analyst should most likely conclude that:", "opts": ["Regression 1 has a larger F-statistic.", "both regressions have the same F-statistic.", "Regression 2 has a larger F-statistic."], "ans": "C", "expl": "Sum of squares total\nSum of squares total ( SST) = Sum of squares regression (SSR) + Sum of squares error (SSE)\nA simple linear regression (SLR) can be used to assess the degree to which variations in a\ndependent variable are explained by variations in an independent variable. Outputs of a\nregression analysis include the:\nsum of squares total ( SST ), the variation in the observed values of the dependent\nvariable versus its average value,\nsum of squares regression ( SSR ), the proportion of variation of the dependent variable\nexplained by changes in the independent variable, and\nsum of squares error ( SSE ), the proportion of variation of the dependent\nvariable unexplained by changes in the independent variable.\nF-statistics are used to evaluate the goodness of fit (ie, how well the regression model fits\nthe data). F-statistics reflect the explained versus the unexplained variation in\nthe dependent variable , adjusted for sample size and degrees of freedom (ie, mean square\nregression [MSR] / mean square error [ MSE ]). For a given data set, both\nthe SSR and SSE increase as sample size increases:\nIn this scenario, both the SST and SSE double when the sample size doubles. This indicates\nthe same relative variance is exhibited by both samples. Since the divisor in calculating the F-\nstatistic is inversely related to sample size, other things equal, a larger sample\nsize exhibiting the same relative variation results in a greater value for the F-statistic\n(Choices A and B) .\nA larger sample size that exhibits the same relative variation of the dependent variable should\ngive an analyst greater confidence regarding the explanatory power of the independent\nvariable.\nThings to remember:\nF-statistics are used to evaluate how well a regression model fits the data. If the relative\nvariation of the dependent variable is constant as the sample size from a given data set\nincreases, the F-statistic will increase.\nCalculate and interpret measures of fit and formulate and evaluate tests of fit and of regression\ncoefficients in a simple linear regression\nLOS", "qhtml": null}, {"n": 67, "q": "An analyst compiles the following information on a company:\n¥ millions 20X1 20X2\nRevenue 1,500 2,000\nCOGS 500 650\nSelling, general, and administrative expenses 450 550\nDepreciation and amortization 100 150\nOperating income 450 650\nInterest expense 80 90\nPretax profit 370 560\nIncome tax expense 111 140\nNet income 259 420\nThe analyst decides to use a common-size income statement to evaluate the company. After\nthe necessary adjustments are made, which of the following was the greatest contributor to\nthe company's net profit margin expansion in 20X2?", "opts": ["Greater gross margin percentage", "Smaller proportion of interest expenses", "Smaller proportion of selling, general, and administrative expenses"], "ans": "C", "expl": "Common-size income statements present each statement item as a percentage of total\nrevenue . This allows analysts to compare companies of different sizes, view performance\ntrends over time, and identify differences or changes in the companies' strategies.\nIn this scenario, the common-size income statement is calculated as follows:\nReported (¥) Common size (%)\nIncome statement 20X1 20X2 20X1 20X2\nRevenue 1,500 2,000 100.0 100.0\nCOGS 500 650 33.3 32.5\nGross profit (margin) (calculated) 1,000 1,350 66.7 67.5\nSelling, general, and administrative expenses 450 550 30.0 27.5\nDepreciation and amortization 100 150 6.7 7.5\nOperating income (margin) 450 650 30.0 32.5\nInterest expense 80 90 5.3 4.5\nPretax profit (margin) 370 560 24.7 28.0\nIncome tax expense 111 140 7.4 7.0\nNet income (margin) 259 420 17.3 21.0\nThe greatest contributing factor to the company's net profit margin expansion is a decline in\nthe proportion of selling, general, and administrative (SG&A) expenses , which fell\n2.5% from 30.0% of revenue in 20X1 to 27.5% in 20X2.\n(Choice A) The company's gross margin percentage increased 0.8% from 66.7% in 20X1 to\n67.5% in 20X2. However, this is smaller than the change in SG&A expenses, making it a\nsmaller contributor to net profit margin expansion.\n(Choice B) The company's interest expense decreased 0.8% from 5.3% of revenue in 20X1\nto 4.5% in 20X2. However, this is smaller than the change in SG&A expenses, making it a\nsmaller contributor to net profit margin expansion.\nThings to remember:\nCommon-size income statements present each statement item as a percentage of total\nrevenue. This allows analysts to compare companies of different sizes, view performance\ntrends over time, and identify differences or changes in the companies' strategies.\nEvaluate a company’s financial performance using common-size income statements and financial\nratios based on the income statement\nLOS", "qhtml": null}, {"n": 68, "q": "A company reports the following information in its first year of operations:\nTaxable profit €155,000\nAccounting profit €140,000\nTax rate 20%\nAll else equal, if the tax rate had been 25% instead of 20%, then most likely the company's:", "opts": ["deferred tax assets would have been €750 lower.", "deferred tax assets would have been €750 higher.", "deferred tax liabilities would have been €750 higher."], "ans": "B", "expl": "Deferred tax assets (DTA) and liabilities arise from temporary differences between income tax\nexpense and taxes payable for a period. These differences are expected to reverse over time\nand offset previous deferred tax items. Income tax expense is based on reported\naccounting income from the income statement. Taxes payable is based on taxable\nincome on the tax return and is the actual amount owed to the government.\nDTA arise when:\nTaxable income > Accounting income and\nTaxes payable > Tax expense.\nDeferred tax liabilities (DTL) arise when:\nTaxable income < Accounting income and\nTaxes payable < Tax expense.\nIn this scenario, a DTA is created since taxable income is greater than accounting\nincome (Choice C) .\nThe deferred tax amount can be calculated as the product of the absolute difference between\nthe taxable income and accounting income and the tax rate. Therefore, the size of the\ndeferred tax item is directly correlated to the tax rate. If the tax rate were higher, the amount\nof the DTA increase would be higher as well (Choice A) .\nThings to remember:\nA deferred tax item amount can be calculated as the product of the absolute difference\nbetween the taxable profit and accounting profit and the tax rate. The size of the deferred tax\nitem is directly correlated to the tax rate.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a\ncompany’s deferred tax liabilities and assets should be treated for the purposes of financial\nanalysis\nLOS", "qhtml": null}, {"n": 69, "q": "A company that reports under IFRS is valuing its year-end inventory. It has collected the\nfollowing information (in CHF millions):\nHistoric cost 175\nReplacement cost 165\nSelling price 240\nCost to sell inventory 60\nBased on this data, the inventory value (in CHF millions) reported on its balance sheet\nis closest to:", "opts": ["165", "175", "180"], "ans": "B", "expl": "Inventory is initially recorded on a company's balance sheet at historic cost. However,\ncompanies are required to regularly reassess this value. If the inventory's value falls below its\ncost (eg, spoils, becomes obsolete, declines in selling price), the company must write down\nthe inventory to reflect the new, lower value, which becomes the carrying value.\nIFRS require companies to report the carrying value of inventory at the lower of\ncost or net realizable value (NRV). The NRV is the estimated selling price less the cost of\ncompleting and selling the inventory.\nIn this scenario, the NRV of the inventory is CHF 180 million (240 − 60). This is higher than\nthe cost of 175, so no write down is taken and the inventory remains at 175.\n(Choice A) 165 is the replacement value, which is not used by IFRS in valuing inventory.\nThe replacement value is used by companies reporting under US GAAP and using LIFO or retail\ninventory methods when valuing inventory.\n(Choice C) 180 is the NRV, which is greater than the historical cost. Since inventory is\nrequired to be valued at the lower of cost and NRV, the company would not be permitted to\nincrease the value of its inventory above 175.\nThings to remember:\nIFRS require companies to report the carrying value of inventory at the lower of cost or net\nrealizable value (NRV). The NRV is the estimated selling price less the costs of completing and\nselling the inventory.\nDescribe the measurement of inventory at the lower of cost and net realisable value and its\nimplications for financial statements and ratios\nLOS", "qhtml": null}, {"n": 70, "q": "An analyst gathers the following information (in € millions) for a company reporting under\nIFRS:\nCFO 720\nInterest paid 25\nInvestment in working capital 40\nInvestment in fixed capital (CAPEX) 300\nTax rate 20%\nThe company reports interest paid as a cash outflow under financing activities. Based on this\ninformation, FCFF (in € millions) is closest to:", "opts": ["380", "420", "440"], "ans": "B", "expl": "Free cash flow to the firm (FCFF) is the cash flow available to a firm's capital\nproviders (ie, lenders and shareholders) after covering operating expenses and investments\nin fixed and working capital. Free cash flow can be used to:\npay interest and principal to lenders, or\npay dividends to and repurchase shares from shareholders.\nSince FCFF represents funds available to all capital providers, it is calculated before interest\nexpense is deducted.\nFCFF can be calculated from CFO. IFRS allow interest payments to be reported as\nan operating or financing outflow, so interest is added back to CFO only if it is classified as\nan operating outflow. Under US GAAP, interest payments are always reported as an outflow\nunder operating activities, so interest must be added back to CFO when calculating FCFF.\nIn this scenario, interest paid is classified as a financing outflow, so it is not added back to\nCFO. Therefore, FCFF is simply CFO − CAPEX = 720 − 300 = €420 million.\n(Choice A) €380 million results from incorrectly subtracting working capital investments\nfrom CFO. CFO already accounts for the outflows associated with investments in working\ncapital.\n(Choice C) €440 million results from incorrectly adding back after-tax interest to CFO. This\nwould be appropriate only if the company classified interest payments as an operating outflow.\nThings to remember:\nFree cash flow to the firm (FCFF) is the cash flow available to a firm's capital providers after\ncovering operating expenses and investments in fixed and working capital. Under IFRS,\ninterest payments can be classified as an operating or financing outflow. When calculating\nFCFF from CFO, interest is added back to CFO only if it is classified as an operating outflow.\nCalculate and interpret free cash flow to the firm, free cash flow to equity, and performance and\ncoverage cash flow ratios\nLOS", "qhtml": null}, {"n": 71, "q": "Which of the following central bank actions is most likely considered expansionary monetary\npolicy?", "opts": ["Reducing the reserve requirement", "Selling government bonds through open market operations", "Holding the policy rate constant as the neutral rate falls below it"], "ans": "A", "expl": "Monetary policy tools\nTool Description Expansionary Contractionary\nOpen market Trade securities (usually government Buy\nSell securities\noperations securities) securities\nPolicy interest rate Set interest rate used to signal markets Lower Raise\nSet percentage of bank deposits held in\nReserve requirements Decrease Increase\nreserves\nExpansionary monetary policies are used to increase economic growth during periods of\ndecline (eg, when output is below potential GDP). For example, a central bank can implement\nan expansionary policy of increasing excess reserves in the commercial banking system by:\nmaking open market purchases,\nreducing reserve requirements , which turns some required reserves into excess\nreserves, or\nreducing the policy interest rate, which reduces the costs banks incur when borrowing\nreserves.\nExcess reserves encourage increased lending since banks can earn higher returns by making\nloans than by holding reserves. This expands the money supply and lowers interest rates,\nleading to growth in borrowing, investment, and consumption, and thus an expanded GDP.\n(Choice B) A central bank conducts open market sales to reduce its holdings of government\nbonds when implementing a contractionary monetary policy. Commercial banks use reserves\nto purchase the bonds, which contracts the money supply.\n(Choice C) A central bank holds its policy interest rate constant as the neutral rate of\ninterest falls below the policy rate in order to tighten credit conditions. This inaction by a\ncentral bank is contractionary, not expansionary.\nThings to remember:\nExpansionary monetary policies are used to increase economic growth. Reducing reserve\nrequirements creates excess reserves, leading to expansion of the money supply and lower\ninterest rates. Lower interest rates result in increased borrowing, investment, and\nconsumption, and thus an expanded GDP.\nDescribe qualities of effective central banks; contrast their use of inflation, interest rate, and\nexchange rate targeting in expansionary or contractionary monetary policy; and describe the\nlimitations of monetary policy\nLOS", "qhtml": null}, {"n": 72, "q": "A company uses the LIFO inventory valuation method. In a deflationary environment with\ndeclining inventory costs, LIFO liquidation would most likely lead the company to experience:", "opts": ["greater COGS.", "less net revenue.", "greater tax expense."], "ans": "A", "expl": "The LIFO (last-in, first-out) method assumes that newer inventory is sold first: Unit costs from\nmore recent purchases are assigned to the cost of goods sold (COGS), which leaves older unit\ncosts in the value of remaining inventory. When inventory unit costs are decreasing due to a\ndeflationary environment, LIFO typically leads to lower COGS and greater ending inventory.\nLIFO liquidation occurs when a company sells more inventory units than it has purchased in\na period. In order to fulfill its sales, the company liquidates older inventory from prior periods,\nwith higher unit costs, rather than purchasing newer units with lower unit costs.\nWhen prices are declining , the inclusion of older, higher unit costs will\ntemporarily result in higher COGS than if the sales were fulfilled using only new purchases.\n(Choice B) Inventory valuation methods impact COGS and profit line items below COGS, but\nhave no impact on net revenue.\n(Choice C) Taxes would be lower since higher COGS would reduce pretax profits.\nThings to remember:\nLIFO liquidation occurs when a company sells more inventory units than it has purchased in a\nperiod and liquidates inventory from prior periods to fulfill its sales, rather than purchasing\nnewer units. During times of declining prices, older inventory has greater unit costs; thus,\nLIFO liquidation leads to greater COGS and less tax expense.\nCalculate and explain how inflation and deflation of inventory costs affect the financial statements\nand ratios of companies that use different inventory valuation methods\nLOS", "qhtml": null}, {"n": 73, "q": "An analyst gathers information from the income statements of two companies:\nCompany X has gross revenues of CAD 10 billion, and\nCompany Y has gross revenues of CAD 10 million.\nTo compare the companies' operating profit margins, the analyst should most\nappropriately use:", "opts": ["regression analysis.", "event study analysis.", "common-size statement analysis."], "ans": "C", "expl": "Common-size analysis of an income statement involves expressing each line item as\na percentage of revenue . This allows for comparison over different time periods (ie, time-\nseries analysis) and between different companies (ie, cross-sectional analysis)\nby standardizing each line item , thereby mitigating the impact of company size .\nCommon-size analysis is a form of cross-sectional analysis, which compares different entities\n(eg, companies) at a specific point in time and is often used to identify patterns, trends, or\nrelationships between variables at a particular moment. This contrasts with time-series\nanalysis, which focuses on changes within a single entity over time.\n(Choice A) Regression analysis assesses the relationship between a dependent variable and\none or more independent variables. The purpose of this analysis is to model the relationship,\nunderstand its strength and nature, and make predictions accordingly.\n(Choice B) Event study analysis evaluates the impact of specific events, such as earnings\nannouncements or policy changes, on financial markets or other variables. The analysis\nassesses how variables respond to these events over a specific period.\nThings to remember:\nCommon-size analysis of an income statement involves expressing each item as a percentage\nof total revenue or sales. This approach simplifies comparisons across time (ie, time-series\nanalysis) and across different companies (ie, cross-sectional analysis) as it standardizes each\nline item and mitigates the influence of company size.\nEvaluate a company’s financial performance using common-size income statements and financial\nratios based on the income statement\nLOS", "qhtml": null}, {"n": 74, "q": "An analyst identifies the presence of outliers in a sample containing the P/E ratios of 40\ncompanies. The analyst discards the two smallest and the two largest observations before\ncalculating the average P/E ratio. This process best describes the use of a:", "opts": ["trimmed mean.", "harmonic mean.", "winsorized mean."], "ans": "A", "expl": "Measures (ie, means) of central tendency include the arithmetic mean, geometric mean,\nand weighted mean. Although the presence of extreme values (ie, outliers) can\nsignificantly distort the accuracy of these measures, other measures reduce that effect. In\nthis scenario, 40 observations are ranked in ascending order with three means applied that\ntreat outliers in different ways:\nA trimmed mean discards the smallest and largest observations and calculates the\naverage of the remaining observations. In this case, the 10% trimmed mean discards\nthe two smallest observations (ranks 1 and 2) and the two largest observations (ranks\n39 and 40), then calculates the average of the remaining 36 observations.\nA winsorized mean replaces the smallest and largest observations respectively with\nthe smallest and largest values that fall within an acceptable range. Here, the 90%\nwinsorized mean replaces the two smallest values with 9.5 (rank 3) and the two largest\nvalues with 65.6 (rank 38), then calculates the average of the 40 observations (Choice\nC) .\nA harmonic mean is the ratio of the number of observations to the sum of reciprocals.\nIt is a weighted average that assigns smaller weights to larger observations ; in this\ncase, the weights range from 0.323 (rank 1) to 0.008 (rank 40). Due to these weights,\nthe harmonic mean is less influenced by large outliers, but it can be pulled significantly in\nthe direction of smaller values (Choice B) .\nThings to remember:\nSome measures (ie, means) of central tendency treat the presence of outliers. A winsorized\nmean replaces the smallest and largest observations with values that fall within an acceptable\nrange, while a trimmed mean simply discards those observations. A harmonic mean uses\nreciprocals to assign smaller weights to larger observations.\nCalculate, interpret, and evaluate measures of central tendency and location to address an\ninvestment problem\nLOS", "qhtml": null}, {"n": 75, "q": "Two events, A and B , are not independent: B 's probability depends on whether A occurs. If\nthe unconditional probability of A is known, which of the following probability rules is least\nappropriate to estimate the unconditional probability of B ?", "opts": ["Addition rule", "Multiplication rule", "Total probability rule"], "ans": "A", "expl": "The outcome of an event is often affected by different scenarios that impact the\nprobability of the event. In this question, the probability of B is impacted by\nwhether A occurs. The probability of B refers to its unconditional probability: the total\nprobability that B occurs if A occurs AND if A does not occur.\nB 's outcome is affected by A 's outcome, so the probability that B occurs given that A occurs,\nthe conditional probability P( B | A ), may not be the same as the probability that B occurs given\nB|AC\nthat A does not occur: P ( B|A ) ≠ P ( ).\nC\nSince A either occurs or does not occur, A and A are mutually exclusive and exhaustive. This\nAC\nmeans that the joint probabilities P ( B AND A ) and P ( B AND ) cover all possible outcomes\nof B . The sum of these joint probabilities is the total probability (ie, unconditional probability)\nof B . Since the total probability rule requires the use of the multiplication rule to calculate the\njoint probabilities (which are then summed to calculate the total probability), the total\nprobability and multiplication rules are appropriate to use for this calculation (Choices B and\nC) .\nThe addition rule, which calculates the probability that either A or B occurs, is not appropriate\nhere. The question asks for the probability of B irrespective of A 's occurrence.\nThings to remember:\nWhen different scenarios affect the likelihood of an event occurring, the total probability rule is\nused to calculate the unconditional (ie, total) probability of the event. Unconditional\nprobability is the sum of joint probabilities, which require the use of the multiplication rule.\nFormulate an investment problem as a probability tree and explain the use of conditional\nexpectations in investment application\nLOS", "qhtml": null}, {"n": 76, "q": "A company is currently developing a new software product for potential introduction to the\nmarket. If the company has demonstrated the technical feasibility of the software, then future\ndevelopment costs should most appropriately :", "opts": ["be expensed.", "be capitalized as a long-term asset.", "reduce cash flow from operating activities."], "ans": "B", "expl": "Treatment of research and development (R&D) costs\nIFRS US GAAP\nR&D costs: generally expensed\nResearch costs:\nSoftware exceptions\nexpensed\nR&D costs expensed prior to\nDevelopment\nestablishment of technical feasibility\ncosts:\nR&D costs capitalized once technical\ncapitalized\nfeasibility is established\nIntangible assets (eg, patents, trademarks, software) lack physical form and can be obtained\nthrough standalone purchases, mergers and acquisitions (ie, business combinations), or\ninternal development. When an intangible asset is acquired:\nexternally, costs are capitalized.\ninternally , certain research and development (R&D) costs may be expensed or\ncapitalized.\nIFRS and US GAAP differ in some areas on the treatment of internal R&D costs:\nIFRS require companies to expense research costs when incurred and to capitalize\ndevelopment costs . Under IFRS, development costs are incurred once a product\nhas proven technical feasibility .\nUS GAAP consider R&D costs together and typically require companies to expense those\ncosts. However, for software , R&D costs are capitalized once technical\nfeasibility has been demonstrated.\nIn this scenario, the software product is being developed internally and has demonstrated\ntechnical feasibility. Therefore, the development costs satisfy the capitalization criteria under\nboth IFRS and US GAAP (Choice A) .\n(Choice C) Since the development costs are capitalized, they represent a cash outflow\nunder investing activities , not operating activities. Cash flow from operating activities\ncaptures costs that are expensed on the income statement.\nThings to remember:\nIFRS require companies to expense research costs when incurred and to capitalize\ndevelopment costs. Development costs are incurred once a product has proven technical\nfeasibility. US GAAP typically require companies to expense research and development costs\nbut capitalize costs for software products once technical feasibility has been demonstrated.\nCompare the financial reporting of the following types of intangible assets: purchased, internally\ndeveloped, and acquired in a business combination\nLOS", "qhtml": null}, {"n": 77, "q": "An analyst compiles the following common-sized cash flow statements as a percentage of\nrevenue for a company:\n20X4 20X5\nNet income 9.0% 11.1%\nDepreciation and amortization 5.0% 6.7%\nChanges in operating assets and liabilities −5.5% −7.2%\nCash flow from operations 8.5% 10.6%\nPurchase of equipment −5.0% −6.7%\nCash flow from investing −5.0% −6.7%\nIssuance of debt 6.0% 2.2%\nRepayment of debt −6.0% −1.7%\nDividend payments −1.5% −1.7%\nCash flow from financing −1.5% −1.1%\nNet change in cash 2.0% 2.8%\nCash paid for interest 2.5% 2.2%\nThe company had total revenue of MXN 1,000 million in 20X4, MXN 900 million in 20X5, and a\ntax rate of 20% for both years. The analyst's most appropriate conclusion is that the\ncompany is:", "opts": ["increasing its free cash flow to equity.", "growing its dividend in line with net income.", "expanding its net investments in equipment."], "ans": "A", "expl": "Common-size cash flow statements display each statement item either as a percentage\nof revenue or as a percentage of the company's total cash inflows or outflows. This allows\nanalysts to compare the receipts and expenditures for companies of different sizes or for\none company over time.\nIn this scenario, the common-size cash flow statement indicates that the company's free cash\nflow to equity (FCFE) as a percentage of revenue increased between 20X4 and 20X5:\nfrom 3.5% (= 9% + 5% − 5.5% − 5% + 6% − 6%) in 20X4\nto 4.4% (= 11.1% + 6.7% −7.2% − 6.7% + 2.2% − 1.7%) in 20X5.\nThis equates to FCFE of MXN 35 million in 20X4 (= 1,000 × 0.035) and MXN 40 million in\n20X5 (= 900 × 0.044).\nNote: After-tax cash paid for interest is used in the calculation of free cash flow to the firm\n(FCFF), not FCFE .\n(Choice B) The company's dividend did not grow in line with net income. The dividend grew\nfrom 1.5% to 1.7% of revenue, which is an increase of 13%; net income grew from 9% to\n11.1%, an increase of 23%.\n(Choice C) The company's cash paid to purchase new equipment is 5% of its revenue in\n20X4 and 6.7% in 20X5. Although this expanded, it only kept pace with depreciation\nexpense, so the net investment did not expand. This suggests that the company is primarily\nspending to replace aging equipment.\nThings to remember:\nCommon-size cash flow statements can present each item on the cash flow statement as a\npercentage of revenue. They allow analysts to compare the receipts and expenditures that\ncontribute to cash generation for companies of different sizes or for one company over time.\nAnalyze and interpret both reported and common-size cash flow statements\nLOS", "qhtml": "<p>An analyst compiles the following common-sized cash flow statements as a percentage of revenue for a company:</p><table class=\"qtable\"><thead><tr><th></th><th>20X4</th><th>20X5</th></tr></thead><tbody><tr><td>Net income</td><td>9.0%</td><td>11.1%</td></tr><tr><td>Depreciation and amortization</td><td>5.0%</td><td>6.7%</td></tr><tr><td>Changes in operating assets and liabilities</td><td>−5.5%</td><td>−7.2%</td></tr><tr><td>Cash flow from operations</td><td>8.5%</td><td>10.6%</td></tr><tr><td>Purchase of equipment</td><td>−5.0%</td><td>−6.7%</td></tr><tr><td>Cash flow from investing</td><td>−5.0%</td><td>−6.7%</td></tr><tr><td>Issuance of debt</td><td>6.0%</td><td>2.2%</td></tr><tr><td>Repayment of debt</td><td>−6.0%</td><td>−1.7%</td></tr><tr><td>Dividend payments</td><td>−1.5%</td><td>−1.7%</td></tr><tr><td>Cash flow from financing</td><td>−1.5%</td><td>−1.1%</td></tr><tr><td>Net change in cash</td><td>2.0%</td><td>2.8%</td></tr><tr><td>Cash paid for interest</td><td>2.5%</td><td>2.2%</td></tr></tbody></table><p>The company had total revenue of MXN 1,000 million in 20X4, MXN 900 million in 20X5, and a tax rate of 20% for both years. The analyst's most appropriate conclusion is that the company is:</p>"}, {"n": 78, "q": "As the significance level of a hypothesis test increases, the most likely outcome is a decrease\nin the probability of:", "opts": ["a Type I error.", "a Type II error.", "both a Type I and a Type II error."], "ans": "B", "expl": "In hypothesis testing , a Type I error results from rejecting a true null hypothesis.\nThe probability of a Type I error increases with the test's level of significance . For\ninstance, a 1% level of significance means that the probability of a Type I error is 1%. If the\nlevel of significance increases to 5%, the probability of a Type I error also increases to\n5% (Choice A) .\nA Type II error results from failing to reject a false null hypothesis. As shown in the left\ngraph, the test statistic is in the white \"nonrejection\" region when the test is at a lower level\nof significance. When the significance level increases as shown in the right graph, the test\nstatistic is in the blue-shaded \"rejection\" region. Increasing the significance level causes the\nnull hypothesis to be rejected more frequently. Since a Type II error is based on failing to\nreject a false null hypothesis, all else equal, a higher significance level means a reduced\nprobability of making a Type II error.\n(Choice C) The only way to simultaneously decrease the probability of a Type I error and a\nType II error is to increase the size of the sample from which the test statistic is generated.\nThings to remember:\nIncreasing a hypothesis test's level of significance increases the probability of making a Type I\nerror. However, increasing the level of significance also means the null hypothesis will be\nrejected less often. Since a Type II error occurs from failing to reject a false null hypothesis,\nincreasing the level of significance will decrease the probability of a Type II error.\nExplain hypothesis testing and its components, including statistical significance, Type I and Type II\nerrors, and the power of a test.\nLOS", "qhtml": null}, {"n": 79, "q": "A company purchases a service on credit for TRY 10,000 in 20X8. The company recognizes\nthe expense on its income statement that year but will not pay cash until 20X9. Tax laws\nrequire that the company recognize the expense when cash is paid. If the company's tax rate\nis 30%, in 20X8 the company would most appropriately record a:", "opts": ["deferred tax asset of TRY 3,000.", "deferred tax asset of TRY 7,000.", "deferred tax liability of TRY 3,000."], "ans": "A", "expl": "Deferred tax asset vs. deferred tax liability\nIncome tax expense < taxes payable\nDeferred tax asset\nCreated by overpaying tax in current period\nIncome tax expense > taxes payable\nDeferred tax liability\nCreated by underpaying tax in current period\nDeferred tax assets ( DTAs ) and deferred tax liabilities ( DTLs ) arise when a company records\na tax expense for financial reporting purposes (ie, income tax expense different from the\namount it owes in taxes (ie, taxes payable) for that period, and the difference is expected to\nreverse. A company incurs a DTA when its taxes payable are greater than its income tax\nexpense .\nIn this scenario, the company recognizes an expense of TRY 10,000 on its income statement\nin 20X8. However, the company will not pay cash for the expense nor record it on the tax\nreturn until 20X9. In 20X8, the company's:\npretax profit will be 10,000 less than its taxable income, and its\nincome tax expense will be 3,000 (10,000 × 30%) less than its taxes payable.\nSince these differences will reverse in 20X9 when the company pays cash for the expense, a\nDTA of TRY 3,000 is created in 20X8.\nAssuming the company had revenue of TRY 15,000, the accounting difference would be as\nfollows:\n(Choice B) A DTA of 7,000 is the difference between the portions of the expense that affect\nnet income and taxable income, not the difference between tax expense and taxes payable.\n(Choice C) A DTL of 3,000 is calculated by incorrectly reversing the tax expense and taxes\npayable.\nThings to remember:\nDeferred tax assets (DTAs) and deferred tax liabilities (DTLs) arise when a company records\nan income tax expense different from its taxes payable, and that difference is expected to\nreverse. A DTA is incurred if the company's taxes payable are greater than its tax expense.\nExplain how deferred tax liabilities and assets are created and the factors that determine how a\ncompany’s deferred tax liabilities and assets should be treated for the purposes of financial\nanalysis\nLOS", "qhtml": null}, {"n": 80, "q": "Which of the following statements best describes a disadvantage of using fiscal policy as a\nshort-run economic tool?", "opts": ["Indirect taxes are difficult to implement and have a delayed impact.", "Capital spending plans take a long time to formulate and implement.", "Direct taxes have very small expectational effects and long lead times."], "ans": "B", "expl": "Fiscal policy vs. short-run cyclical fluctuations\nPolicy tool Examples Issues\nSales\nIndirect Easily enacted, affect behavior and\nExcise\ntaxes government revenues quickly\nAdvantages\nTaxes\nAdjustments can almost instantly encourage\nSocial policy\nSubsidies\nor discourage behavior\nIndividual\nincome\nRequires significant notice to update\nDirect taxes\nCorporate\ncomputerized systems\nprofits\nDisadvantages\nHighways\nCapital Lengthy lead times needed to formulate and\nSchools\nspending implement\nFiscal policy (ie, government spending and taxes) attempts to maximize overall welfare by\nstabilizing output near an economy's sustainable GDP growth rate. At that level of output,\nincome growth and employment are at the highest levels that can be maintained without\ncreating inflationary pressure:\nGrowth above that level may be countered with contractionary policies to stifle inflation.\nGrowth below that level may be addressed by fiscal stimulus to prevent excessive\nunemployment.\nGovernment capital spending on infrastructure (eg, bridges, airports) provides strong\nstimulus to output and can increase the sustainable GDP growth rate. However, effective\ncapital spending plans can take years to formulate and implement and, therefore, may\nhave little effect on the economy in the short run .\n(Choice A) Indirect taxes are easy to implement and affect consumer and business behavior\nand government revenues immediately. These are advantages of using this short-run tool.\n(Choice C) Direct taxes (eg, individual income taxes) can take a long time to change but\nhave powerful effects on economic activity. The impact of direct taxes is felt well before their\nimplementation, with powerful expectational impacts occurring as soon as the new tax rates\nare announced.\nThings to remember:\nFiscal policy attempts to stabilize output near an economy's sustainable GDP growth rate.\nExpansionary or contractionary fiscal policy is pursued when GDP diverges from the economy's\npotential. Government capital spending plans can take years to formulate and implement and,\ntherefore, may have little effect on the economy in the short run.\nDescribe tools of fiscal policy, including their advantages and disadvantages\nLOS", "qhtml": null}, {"n": 81, "q": "An analyst produces the following joint probability function for two energy stocks, an oil\ncompany (COIL) and a natural gas company (NAGS). The analyst estimates each stock's\nreturn given three possible return scenarios for crude oil and natural gas prices for the coming\nyear:\nThe covariance of the expected returns of COIL and the expected returns of NAGS\nis closest to:", "opts": ["131.74", "134.60", "152.22"], "ans": "A", "expl": "Analysts often use historical data to forecast the covariance of a set of asset returns. The\ncovariance of the variables is the expected value of the product of the pair-wise matched\ndeviations of each variable from its mean.\nThe forward-looking covariance of two random variables (eg, stock returns) can\nbe calculated if the joint probability function can be estimated. The expected value (return)\nof each variable, given each scenario and its probability , is calculated first, and then\nthe covariance can be calculated .\nThus, the covariance of the expected returns of COIL and NAGS is 131.74. Since this is a\npositive number, it indicates that the stocks show co-movement in the same direction: the\nreturns on both assets tend to outperform or underperform their expected values at the same\ntime. Here this would likely be the case since the companies are in the same industry and\nthus have similar systematic risks.\n(Choice B) 134.60 results from using the absolute difference between the expected returns\nand their means, which biases the covariance upward if one of the expected values is negative\nand the mean is positive.\n(Choice C) 152.22 results from equally weighting the probabilities instead of weighting them\naccording to the specific probabilities chosen by the analyst.\nThings to remember:\nThe covariance of a joint probability distribution measures the directionality of the relationship\nbetween two variables. If the joint probability function of the variables (eg, stock returns) can\nbe estimated, then the forward-looking covariance of the two variables can be calculated. A\npositive covariance indicates variables show co-movement in the same direction.\nCalculate and interpret the covariance and correlation of portfolio returns using a joint probability\nfunction for returns\nLOS", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAuMAAADsCAIAAABR1j8PAAAc6UlEQVR42u3d7XGjzBKG4dapTQCHgEKAECAECAFCECGIEEQIIgQTggjBhGBC8PnxlLtYEJLXX69s3dePrbWNkTygoemeGTYvLy8GAABwk/5HEwAAACIVAAAAIhUAAECkAgAAQKQCAACIVAAAAIhUAAAAiFQAAACRCgAAAJEKAAAgUgEAACBSAQAAIFIBAABEKgAAAEQ
