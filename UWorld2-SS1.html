 chênh lệch giữa chi tiêu vốn và tiền mặt nhận được từ\nbán (65 − 55) hoặc chênh lệch giữa tiền mặt nhận được từ việc bán và vốn\nchi phí cộng với chi phí khấu hao (55 − 65 + 20). Cả hai phép tính đều không tính đến\nsự thay đổi trong các mục trong bảng cân đối kế toán.\n(Lựa chọn B) 30 là sự khác biệt giữa BV lịch sử (thay vì hiện tại) của thiết bị\nđã bán và tiền mặt nhận được từ việc bán hàng.\nNhững điều cần nhớ:\nKhi các công ty bán thiết bị, họ báo cáo một khoản lãi (lỗ) không bằng tiền mặt bằng với khoản chênh lệch\ngiữa số tiền mặt nhận được từ việc bán và giá trị sổ sách ròng hiện tại (BV) của thiết bị.\nKhi không cung cấp BV ròng của thiết bị đã bán, thông tin báo cáo tài chính có thể được\nsử dụng để ước tính chi phí.\nMô tả các bước lập báo cáo lưu chuyển tiền tệ trực tiếp và gián tiếp, bao gồm cả cách\ndòng tiền có thể được tính toán bằng cách sử dụng báo cáo thu nhập và bảng cân đối kế toán dữ liệu\nLOS","qhtml":null},{"n":54,"q":"A company reporting under IFRS sponsors a defined benefit plan. Which of the following\ncomponents of pension cost is the company required to recognize in other comprehensive\nincome (OCI)?","opts":["Past service costs","Net interest expense","Actual return on plan assets"],"ans":"C","expl":"Chi phí lương hưu định kỳ của một chương trình phúc lợi xác định phản ánh sự gia tăng lương hưu\nnghĩa vụ được điều chỉnh theo lợi tức thực tế trên tài sản của chương trình. Theo IFRS và US GAAP, một phần\nchi phí lương hưu định kỳ được ghi nhận trên báo cáo thu nhập, trong khi phần còn lại được\nghi nhận trong thu nhập toàn diện khác (OCI). Theo IFRS, có ba\nthành phần của chi phí lương hưu định kỳ:\nChi phí dịch vụ bao gồm chi phí dịch vụ hiện tại và quá khứ và được ghi nhận là chi phí trong\nbáo cáo thu nhập.\nChi phí lãi vay hoặc thu nhập ròng là sản phẩm của trạng thái được tài trợ (tức là tài sản lương hưu ròng\nhoặc nợ phải trả) và tỷ lệ chiết khấu (dùng để tính nghĩa vụ lương hưu) và được ghi nhận\ntrong báo cáo thu nhập (Lựa chọn B) . Nó bằng chênh lệch giữa chi phí lãi vay\n(nghĩa vụ lương hưu × tỷ lệ chiết khấu) và lợi nhuận dự kiến trên tài sản (giá trị hợp lý của kế hoạch\ntài sản × tỷ lệ chiết khấu).\nĐo lường lại được ghi nhận trong OCI và bao gồm các khoản lỗ hoặc lãi theo tính toán thống kê và lợi nhuận ròng\ntrên tài sản kế hoạch (tức là lợi nhuận thực tế trừ đi lợi nhuận kỳ vọng được ghi nhận trong\nbáo cáo thu nhập).\nDo đó, công ty ghi nhận lợi tức kỳ vọng trên tài sản kế hoạch dựa trên tỷ lệ chiết khấu\ntrên báo cáo thu nhập. Sau đó, khi biết được lợi nhuận thực tế, công ty\nghi nhận nó trong OCI, trừ đi lợi nhuận kỳ vọng đã được ghi nhận trước đó.\n(Lựa chọn A) Chi phí dịch vụ trong quá khứ được ghi nhận trong OCI theo US GAAP, nhưng không phải theo IFRS.\nNhững điều cần nhớ:\nTheo IFRS, các thành phần của chi phí lương hưu là chi phí dịch vụ và chi phí lãi ròng hoặc\nthu nhập (cả hai đều được ghi nhận trong báo cáo thu nhập), cũng như các phép đo lại được\nghi nhận trong OCI. Các biện pháp đo lường bao gồm lãi hoặc lỗ theo tính toán và lợi nhuận thực tế trên\ntài sản kế hoạch sau khi trừ lợi nhuận dự kiến.\nGiải thích báo cáo tài chính về khoản đóng góp xác định, lợi ích xác định và\nkế hoạch bồi thường\nLOS","qhtml":null},{"n":55,"q":"An analyst gathers the following data for a company:\nPrior Current\n(¥ billions)\nYear Year\nSales 540 500\nNet income 120 100\nAverage total assets 2,200 2,100\nIf return on equity (ROE) was 0.12 in the prior year and 0.14 in the current year, then the\nincrease in ROE is most appropriately attributed to increased:","opts":["leverage.","efficiency.","profitability."],"ans":"A","expl":"Lợi nhuận trên vốn chủ sở hữu ( ROE ) đo lường mức thu nhập ròng được tạo ra từ việc sử dụng vốn chủ sở hữu của công ty.\nPhân tích cổ điển của DuPont phân tách ROE thành ba thành phần riêng biệt: khả năng sinh lời , hiệu quả ,\nvà đòn bẩy .\nKhả năng sinh lời, được đo bằng tỷ suất lợi nhuận ròng, đánh giá mức lợi nhuận từ việc bán hàng.\nHiệu quả, được đo bằng vòng quay tổng tài sản, đánh giá khả năng tạo doanh thu bằng cách sử dụng\ntài sản.\nĐòn bẩy tài chính là tỷ lệ giữa tổng tài sản trên vốn chủ sở hữu. Các công ty có đòn bẩy cao hơn\ncó tỷ lệ tài sản được tài trợ bằng nợ cao hơn.\nViệc tăng bất kỳ thành phần nào, tất cả các thành phần khác đều bằng nhau, sẽ tác động tích cực đến ROE.\nTrong kịch bản này, ROE tăng từ 0,12 lên 0,14. Để xác định nguyên nhân của sự gia tăng, trước tiên\ntính tỷ suất lợi nhuận ròng và vòng quay tổng tài sản, sau đó thay các giá trị đó vào phương trình ROE tổng thể\nđể giải đòn bẩy. Cuối cùng, so sánh các giá trị thành phần hiện tại với các giá trị\nnăm trước. Trong trường hợp này, mức tăng ROE được thúc đẩy bởi đòn bẩy tăng.\nLưu ý: Đòn bẩy cũng có thể được xác định dựa trên mối quan hệ của nó với ROE và lợi nhuận trên tài sản\n(ROA): ROE = ROA × Đòn bẩy .\n(Lựa chọn B) Hiệu quả, được đo bằng tổng vòng quay tài sản, giảm trong năm hiện tại (từ 0,25\nđến 0,24) phân tách ROE thành ba thành phần riêng biệt: lợi nhuận, hiệu quả,\nvà đòn bẩy. Tất cả các yếu tố khác đều như nhau, việc tăng bất kỳ thành phần nào cũng sẽ tác động tích cực đến ROE.\nChứng minh việc áp dụng phân tích lợi nhuận trên vốn chủ sở hữu của DuPont, đồng thời tính toán và giải thích tác động của\nnhững thay đổi trong các thành phần của nó\nLOS","qhtml":null},{"n":56,"q":"A due diligence analyst is examining the correlation coefficients for the 10-year monthly\nreturns of four stock mutual funds:\nFund W Fund X Fund Y Fund Z\nFund W 1.0000 0.8784 −0.3021 0.6586\nFund X 1.0000 0.0072 0.9789\nFund Y 1.0000 −0.2540\nFund Z 1.0000\nWhich of the following is the least appropriate interpretation of this correlation matrix's data?","opts":["Fund X and Fund Y may have a nonlinear relationship.","Fund X's performance can explain Fund W's performance.","Fund X and Fund Z likely hold a significant amount of the same securities."],"ans":"B","expl":"Tương quan là thước đo tiêu chuẩn về xu hướng hai biến số (ví dụ: đầu tư\nlợi nhuận) di chuyển theo cách tương tự ; nghĩa là, nó đo lường độ mạnh của mối quan hệ\ntuyến tính giữa hai biến. Hệ số tương quan (ρ ) có thể dương hoặc\n1,2\nâm và vì được chuẩn hóa nên nó nằm trong khoảng +1 và −1 .\nTrong kịch bản này, lợi nhuận của Quỹ X và Quỹ W có mối tương quan\ntương đối mạnh với nhau. Tuy nhiên, điều đó không phải do Quỹ X ảnh hưởng hoặc mang lại\n(tức là gây ra) mô hình lợi nhuận cho Quỹ W. Mối tương quan không ngụ ý quan hệ nhân quả.\n(Lựa chọn A) Nếu hai biến về cơ bản có mối tương quan bằng 0 (chẳng hạn như Quỹ X và Quỹ\nY), thì dữ liệu sẽ chỉ ra hầu như không có mối quan hệ tuyến tính giữa lợi nhuận của chúng. Tuy nhiên,\nhai biến này có thể có mối quan hệ phi tuyến tính mạnh và không được đo lường bằng\ntương quan. Đây là một trong những hạn chế của phân tích tương quan.\n(Lựa chọn C) Mặc dù lợi nhuận của Quỹ X và Quỹ Z có mối tương quan rất cao với nhau, nhưng điều đó\nkhông nhất thiết có nghĩa là họ sở hữu cùng một loại chứng khoán, với bất kỳ số lượng nào. Mỗi quỹ có thể sở hữu\nmột tổ hợp chứng khoán khác nhau tạo ra một quỹ có lợi nhuận có mối tương quan cao với\nquỹ kia.\nNhững điều cần nhớ:\nMối tương quan đo lường xu hướng hai biến số (ví dụ: lợi nhuận đầu tư) biến động theo cách\ntương tự. Nó thể hiện sức mạnh của mối quan hệ tuyến tính giữa các biến.\nTuy nhiên, việc hai biến có mối tương quan cao không có nghĩa là một biến\nảnh hưởng đến biến kia.\nGiải thích mối tương quan giữa hai biến để giải quyết vấn đề đầu tư\nLOS","qhtml":null},{"n":57,"q":"An investor deposits ¥100 million into a fund at the beginning of Year 1 and deposits another\n¥50 million at the beginning of Year 2. At the beginning of Year 3, the investor withdraws ¥15\nmillion. The fund has the following returns:\nYear Return (%)\n1 20\n2 10\n3 −20\nThe investor's money-weighted annual rate of return over the three-year period is closest to:","opts":["0.7%","1.0%","1.8%"],"ans":"A","expl":"Lợi nhuận tính theo tiền (MWR), ứng dụng tỷ suất hoàn vốn nội bộ (IRR),\nđo lường hiệu quả đầu tư dựa trên dòng tiền của nhà đầu tư (tức là tiền gửi) và\nrút tiền). Ngược lại, trung bình số học và lợi nhuận tính theo thời gian không tính đến\ndòng tiền vào và ra khỏi danh mục đầu tư.\nLà một ứng dụng của IRR, MWR chiết khấu dòng tiền sao cho giá trị hiện tại ròng của chúng\n(NPV) bằng 0 và khoản đầu tư ban đầu bằng với số tiền gửi được chiết khấu trong tương lai và số tiền rút ra\n. Đối với nhà đầu tư, tiền gửi là dòng tiền ra và tiền rút là dòng tiền vào.\nKhi tính toán MWR, giá trị cuối cùng của khoản đầu tư được giả định là dòng tiền cuối cùng\nvào (nếu dương) hoặc dòng tiền ra (nếu âm). Do đó, để tính MWR , số dư cuối kỳ\nphải được tính trước tiên, sử dụng tiền gửi và tiền rút của nhà đầu tư cũng như lợi tức\ncủa khoản đầu tư trong mỗi kỳ.\n(¥ triệu) Năm 1 Năm 2 Năm 3\nSố dư đầu năm 0 120 187\nTiền gửi của nhà đầu tư (rút tiền) 100 50 −15\nSố dư ròng sau khi gửi (rút tiền) 100 170 172\nLợi nhuận trong năm 20% 10% −20%\nLãi (lỗ) đầu tư 20 17 −34,4\nSố dư cuối năm [= Số dư ròng + Lãi (lỗ) đầu tư] 120 187 137.6\nSau khi xác định được dòng tiền, hãy tính MWR bằng máy tính tài chính .\nNhập giá trị dương cho dòng tiền vào và giá trị âm cho dòng tiền chi.\n(Lựa chọn B) 1,0% là kết quả của việc kết hợp sai số tiền rút vào đầu năm\nnăm thứ ba (15 triệu yên) với số dư đầu tư vào cuối năm thứ ba (137,6\ntriệu) thành một dòng tiền. Việc rút 15 triệu yên sẽ được đưa vào cuối\nNăm 2, giống như đầu Năm 3.\n(Lựa chọn C) 1,8% là kết quả từ việc sử dụng trung bình hình học để đo lường hiệu suất\ncủa khoản đầu tư. MWR sử dụng dòng tiền của nhà đầu tư để xác định lợi nhuận.\nNhững điều cần nhớ:\nLợi nhuận tính theo tiền là một ứng dụng của tỷ suất lợi nhuận nội bộ. Nó đo lường\nlợi tức đầu tư thực tế dựa trên số tiền đóng góp và rút tiền cũng như\nlợi tức đầu tư định kỳ.\nTính toán và giải thích các thước đo lợi nhuận chính và mô tả cách sử dụng thích hợp của chúng\nLOS","qhtml":null},{"n":58,"q":"In an oligopoly market where firms' pricing is interdependent, price elasticity of demand\nis most likely :","opts":["constant regardless of price changes.","greater when the price is increased and less when the price is decreased.","greater when the price is decreased and less when the price is increased."],"ans":"B","expl":"Đặc điểm của sự phụ thuộc lẫn nhau về giá\nĐối thủ cạnh tranh giảm giá nhưng bỏ qua việc tăng giá\nĐường cầu bị gấp khúc do phản ứng khác nhau của các đối thủ cạnh tranh đối với sự thay đổi giá\nĐộ co giãn của cầu theo giá có thể là:\ncao hơn khi giá tăng\nthấp hơn khi giá giảm\nTồn tại hai mô hình nhu cầu riêng biệt:\nmột mô hình liên quan đến giá tăng\nmột mô hình khác liên quan đến giá giảm\nTrong độc quyền nhóm, một số công ty lớn chiếm lĩnh thị trường, thường cung cấp các sản phẩm hoặc dịch vụ\ntương tự. Cấu trúc thị trường độc quyền nhóm được đánh dấu bằng các rào cản gia nhập cao,\ncó thể bao gồm các yêu cầu về vốn đáng kể và nhu cầu về công nghệ độc quyền.\nNhững rào cản này tạo ra sức mạnh định giá cho các công ty đã thành lập và đóng vai trò ngăn cản những người mới tham gia\n.\nThị trường độc quyền nhóm thường thể hiện sự phụ thuộc lẫn nhau về giá, trong đó các quyết định về giá của một công ty\nảnh hưởng trực tiếp đến việc định giá chiến lược của các đối thủ khác trong cùng thị trường. Trong trường hợp\nnày, giá khớp của đối thủ cạnh tranh giảm nhưng bỏ qua việc tăng giá. Việc điều chỉnh mức giá thấp hơn\nngăn chặn việc mất thị phần, vì với các sản phẩm tương tự, khách hàng có thể thay thế.\nDo đó, trong độc quyền nhóm, độ co giãn của cầu theo giá sẽ lớn hơn khi giá tăng vì\nkhách hàng thay thế bằng sản phẩm của đối thủ cạnh tranh vẫn ở mức giá ban đầu (hiện thấp hơn);\ngiá giảm ít hơn do đối thủ cạnh tranh khớp với mức giá giảm.\n(Lựa chọn A và C) Với sự phụ thuộc lẫn nhau về giá, độ co giãn của cầu theo giá sẽ lớn hơn khi\ngiá tăng và giảm khi giá giảm.\nNhững điều cần nhớ:\nSự phụ thuộc lẫn nhau về giá trong thị trường độc quyền nhóm xảy ra khi các quyết định về giá của một công ty trực tiếp\nảnh hưởng đến chiến lược định giá của các đối thủ cạnh tranh. Thông thường, các đối thủ cạnh tranh khớp với việc giảm giá\nnhưng không tăng giá. Độ co giãn của cầu khác nhau: Nó lớn hơn khi giá tăng và\nít hơn khi giá giảm.\nGiải thích mối quan hệ cung và cầu dưới sự độc quyền nhóm, bao gồm giá và sản lượng tối ưu\ncho các công ty cũng như chiến lược định giá\nLOS","qhtml":null},{"n":59,"q":"Which of the following is most likely a difference between maintaining a fixed parity exchange\nrate system and a currency board system? In a fixed parity exchange rate system, the\ncountry:","opts":["retains monetary independence.","has a legislative commitment to the specified parity.","has discretion over the level of foreign exchange reserves."],"ans":"C","expl":"Tỷ giá hối đoái ngang giá cố định so với hệ thống bảng tiền tệ\nHệ thống bảng tiền tệ chẵn lẻ cố định\nĐược gắn với một loại tiền tệ chính\nCam kết tỷ giá hối đoái cố định\nĐược gắn với một loại tiền tệ chính\nTiền tệ chỉ được phát hành đối với nước ngoài\nKhông có cam kết về mức chẵn lẻ cụ thể\nsàn giao dịch, được hỗ trợ hoàn toàn bởi nước ngoài\nQuyền quyết định về mức độ ngoại hối\ntài sản\ndự trữ\nCơ sở tiền tệ liên quan trực tiếp đến\nSự độc lập về tiền tệ bị hạn chế\ndòng vốn thương mại/vốn\nCơ quan tiền tệ có chức năng là trung tâm\nĐộc lập tiền tệ hạn chế\nngân hàng (ví dụ: có thể đóng vai trò là người cho vay cuối cùng)\nCơ quan tiền tệ không hoạt động như\nngân hàng trung ương truyền thống\nTrong cả hệ thống tỷ giá hối đoái ngang giá cố định và hệ thống bảng tiền tệ,\ntiền tệ được gắn với một loại tiền tệ chính khác hoặc một rổ tiền tệ. Đang phát triển\nquốc gia, chính phủ hoặc ngân hàng trung ương thiết lập và duy trì tỷ giá hối đoái ở mức cố định\nngang bằng với đồng tiền của các quốc gia phát triển hoặc các đối tác thương mại lớn.\nCó hai điểm khác biệt chính giữa hệ thống tỷ giá hối đoái ngang giá cố định và hệ thống tiền tệ.\nhệ thống bảng:\nTrong một hệ thống tỷ giá hối đoái ngang giá cố định, không có cam kết pháp lý nào đối với một tỷ giá hối đoái cụ thể.\ntính chẵn lẻ (Lựa chọn B). Quốc gia có quyền lựa chọn điều chỉnh hoặc từ bỏ mức chẵn lẻ được chỉ định\nthay vì trải qua những thay đổi để đáp ứng mức độ chẵn lẻ.\nMột hệ thống tỷ giá hối đoái ngang bằng cố định cho phép toàn quyền duy trì mức độ cụ thể\nvề dự trữ ngoại hối. Mức độ này không bị ràng buộc hoặc bị ảnh hưởng bởi số lượng\ntiền lưu thông trong nền kinh tế trong nước. Cơ quan tiền tệ cho phép một phạm vi\ndòng chảy tư nhân ảnh hưởng đến tỷ giá ngang giá, nhưng nó có thể mua hoặc bán ngoại tệ bằng cách sử dụng\ndự trữ để đảm bảo tỷ giá nằm trong phạm vi quy định này.\n(Lựa chọn A) Một quốc gia có hệ thống tỷ giá hối đoái ngang bằng cố định hoặc bảng tiền tệ\nHệ thống nói chung có sự độc lập tiền tệ hạn chế vì giá trị đồng tiền của quốc gia đó\nđược gắn với một loại tiền tệ khác hoặc một rổ tiền tệ.\nNhững điều cần nhớ:\nTrong cả hệ thống tỷ giá hối đoái ngang giá cố định và hệ thống bảng tiền tệ,\ntiền tệ được gắn với một loại tiền tệ chính khác hoặc một rổ tiền tệ. Tính chẵn lẻ cố định\nHệ thống tỷ giá hối đoái khác với hệ thống bảng tiền tệ ở chỗ có sự tùy ý quyết định trong\nduy trì mức dự trữ ngoại hối cụ thể và không có cam kết pháp lý nào về\ntính chẵn lẻ được chỉ định.\nMô tả chế độ tỷ giá hối đoái và giải thích tác động của tỷ giá hối đoái đối với các quốc gia\nthương mại quốc tế và dòng vốn\nLOS","qhtml":null},{"n":60,"q":"The process of recalculating deferred tax assets and liabilities at the end of each reporting\nperiod most likely involves:","opts":["assessing the current tax benefits of tax loss carryforwards.","analyzing the future income tax payable based on current profits.","comparing the tax bases and carrying amounts of balance sheet items."],"ans":"C","expl":"Tạo tài sản thuế thu nhập hoãn lại (DTA) và nợ phải trả (DTL)\nBảng cân đối kế toán\nKịch bản\nitem\nGiá trị ghi sổ > Cơ sở thuế → DTL\nTài sản\nGiá trị ghi sổ < Cơ sở thuế → DTA\nGiá trị ghi sổ > Cơ sở thuế → DTA\nTrách nhiệm\nGiá trị ghi sổ < Cơ sở thuế → DTL\nTài sản thuế thu nhập hoãn lại (DTA) và thuế thu nhập hoãn lại phải trả (DTL) phát sinh\ntừ sự khác biệt giữa cơ sở tính thuế của tài sản hoặc nợ phải trả và giá trị ghi sổ , do\ncác biến thể trong quy tắc kế toán và quy định về thuế. Ví dụ: một công ty có thể sử dụng\ncác phương pháp khấu hao khác nhau cho báo cáo thuế và tài chính, điều này sẽ tạo ra sự khác biệt\ntạm thời.\nDTA xảy ra khi giá trị ghi sổ của một tài sản nhỏ hơn cơ sở tính thuế của nó, biểu thị\nđã nộp thuế vượt mức.\nDTL xảy ra khi giá trị ghi sổ của một khoản nợ nhỏ hơn cơ sở tính thuế của nó, biểu thị\nnghĩa vụ thuế thu nhập hoãn lại để thực hiện trong tương lai.\nTài sản thuế thu nhập hoãn lại so với thuế thu nhập hoãn lại phải trả\nChi phí thuế thu nhập < thuế phải nộp\nTài sản thuế thu nhập hoãn lại\nĐược tạo bằng cách nộp thừa thuế trong kỳ hiện tại\nChi phí thuế thu nhập > thuế phải nộp\nThuế thu nhập hoãn lại phải trả\nĐược tạo ra bằng cách nộp thuế thiếu trong kỳ hiện tại\nCả DTA và DTL đều phát sinh từ sự khác biệt tạm thời giữa lợi nhuận kế toán\nvà thu nhập chịu thuế . Những khác biệt như vậy là do sự khác biệt về thời gian trong việc ghi nhận\ncác mục nhất định để báo cáo tài chính so với báo cáo thuế. Điều này dẫn đến việc tạo ra\nsố dư thuế hoãn lại: lợi ích thuế trong tương lai cho DTA và các khoản thanh toán thuế trong tương lai cho DTL.\nVào cuối mỗi kỳ báo cáo, tài sản thuế thu nhập hoãn lại và nợ phải trả được tính toán lại bằng cách\nso sánh cơ sở tính thuế và giá trị ghi sổ của các mục trong bảng cân đối kế toán (Lựa chọn A và\nB) . Sau đó, những thay đổi về tài sản thuế thu nhập hoãn lại và thuế thu nhập hoãn lại phải trả được tính vào thuế thu nhập\nphải nộp để xác định chi phí (hoặc tín dụng) thuế thu nhập của công ty như được báo cáo trên\nbáo cáo thu nhập.\nNhững điều cần nhớ:\nTài sản thuế thu nhập hoãn lại (DTA) và thuế thu nhập hoãn lại phải trả (DTL) là kết quả của sự khác biệt tạm thời\ngiữa các căn cứ tính thuế và giá trị ghi sổ. Những khác biệt này được tạo ra bởi sự khác biệt về thời gian\ngiữa việc ghi nhận lợi nhuận kế toán và thu nhập chịu thuế, dẫn đến\nlợi ích về thuế trong tương lai (DTA) hoặc các khoản thanh toán (DTL). Vào cuối mỗi kỳ báo cáo, DTA và\nDTL được tính toán lại; điều này ảnh hưởng đến chi phí hoặc tín dụng thuế thu nhập được báo cáo của công ty).\nGiải thích cách tạo ra tài sản và nợ thuế thu nhập hoãn lại cũng như các yếu tố xác định cách xử lý tài sản và nợ thuế thu nhập hoãn lại của một\ncho mục đích phân tích\ntài chính\nLOS","qhtml":null},{"n":61,"q":"If the Canadian dollar (CAD) depreciates 3% against the Australian dollar (AUD) over a period,\nthen the appreciation of the AUD against the CAD is most likely :","opts":["less than 3%.","equal to 3%.","greater than 3%."],"ans":"C","expl":"Giá trị tiền tệ được biểu thị bằng tỷ giá hối đoái dưới dạng số lượng tiền tệ giá trên một\nđơn vị tiền tệ cơ sở. Khi tỷ giá hối đoái thay đổi, tỷ lệ phần trăm thay đổi trong mỗi\ngiá trị của hai đồng tiền tỷ lệ nghịch với nhau. Giá trị tuyệt đối của những thay đổi phải\ngiống nhau đối với cả hai loại tiền tệ, nhưng phần trăm thay đổi không thể bằng nhau.\nTỷ lệ phần trăm tăng của một loại tiền tệ luôn lớn hơn tỷ lệ phần trăm\nđồng tiền kia giảm giá.\nTrong kịch bản này, sự mất giá của đồng đô la Canada (CAD) so với đồng đô la Úc\n(AUD) phải được chuyển đổi thành sự tăng giá của AUD so với CAD dựa trên những điều trên\nphương trình:\nSự tăng giá của AUD là 3,09%, lớn hơn mức giảm giá của CAD của\n3% (Lựa chọn A và B) .\nNhững điều cần nhớ:\nKhi tỷ giá hối đoái thay đổi, phần trăm thay đổi trong giá trị của hai đồng tiền là\ntỉ lệ nghịch. Mặc dù giá trị tuyệt đối bằng tiền của những thay đổi phải giống nhau\nđối với cả hai loại tiền tệ, tỷ lệ phần trăm tăng của một loại tiền tệ luôn lớn hơn tỷ lệ phần trăm\nmất đi cái kia.\nMô tả thị trường ngoại hối, bao gồm các chức năng và thành phần tham gia, phân biệt giữa\ntỷ giá hối đoái danh nghĩa và thực tế, tính toán và giải thích phần trăm thay đổi của một đồng tiền\nso với một loại tiền tệ khác\nLOS","qhtml":null},{"n":62,"q":"If the inflation rate is expected to rise above a central bank's inflation target, that central\nbank's most appropriate action would be to:","opts":["increase the policy rate above the neutral rate.","buy government bonds from commercial banks.","lower the reserve requirement for commercial banks."],"ans":"A","expl":"Các công cụ chính sách tiền tệ\nCông cụ Mô tả Thu hẹp mở rộng\nThị trường mở Chứng khoán giao dịch (thường là Mua của chính phủ\nBán chứng khoán\nchứng khoán hoạt động) chứng khoán\nLãi suất chính sách Đặt lãi suất dùng để báo hiệu thị trường Hạ Tăng\nĐặt tỷ lệ phần trăm tiền gửi ngân hàng được giữ trong\nYêu cầu dự trữ giảm Tăng\ndự trữ\nCác ngân hàng trung ương có các mục tiêu chính sách cơ bản khác nhau, nhưng một mục tiêu chung là giá cả sự ổn định.\nCác ngân hàng trung ương cố gắng đạt được sự ổn định này bằng cách tác động đến mức cung tiền bằng một hoặc\nnhiều công cụ chính sách tiền tệ. Khi ngân hàng trung ương kỳ vọng lạm phát\ntăng trên mục tiêu , ngân hàng trung ương sẽ tìm cách kiềm chế lạm phát một cách thích hợp nhất bằng cách thực hiện\nchính sách tiền tệ thắt chặt .\nĐể thực hiện điều này, ngân hàng trung ương có thể đặt mục tiêu tăng lãi suất cho vay của các ngân hàng thương mại\nbằng cách tăng lãi suất chính sách lên trên lãi suất trung lập. Các ngân hàng thương mại có xu hướng tính lãi suất cho vay\ncủa họ dựa trên lãi suất chính sách cộng với chênh lệch lãi suất. Do đó, lãi suất chính sách cao hơn sẽ khiến\nnhững ngân hàng đó tăng lãi suất cho vay hoặc chấp nhận tỷ suất lợi nhuận thấp hơn, do đó không khuyến khích\ncho vay và đi vay. Cung và cầu ít hơn đối với các khoản vay dành cho doanh nghiệp và tiêu dùng sẽ làm chậm lại\nchi tiêu vốn và tiêu dùng. Về lý thuyết, những tác động này sẽ làm giảm áp lực lạm phát\n.\n(Lựa chọn B) Mua trái phiếu chính phủ từ các ngân hàng thương mại là một chính sách tiền tệ\nmở rộng giúp các ngân hàng đó có thêm dự trữ dư thừa để cho vay. Chính sách này sẽ\nkhông phù hợp nếu mục tiêu là giảm áp lực lạm phát.\n(Lựa chọn C) Việc giảm yêu cầu dự trữ bắt buộc đối với các ngân hàng thương mại sẽ khuyến khích các ngân hàng đó\ncho vay nhiều tiền hơn. Chính sách tiền tệ mở rộng này sẽ không phù hợp nếu mục tiêu là\ngiảm áp lực lạm phát.\nNhững điều cần nhớ:\nLãi suất chính sách của ngân hàng trung ương là lãi suất mà ngân hàng này tính khi cho các ngân hàng thương mại\ncho vay. Nếu một ngân hàng trung ương kỳ vọng lạm phát sẽ tăng cao hơn mục tiêu, ngân hàng này có thể tăng tỷ lệ chính sách\ntrên tỷ lệ trung lập với mục tiêu giảm áp lực lạm phát bằng cách tăng\nlãi suất cho vay của các ngân hàng thương mại.\nMô tả các công cụ được sử dụng để thực hiện các công cụ chính sách tiền tệ và cơ chế truyền tải tiền tệ\nvà giải thích mối quan hệ giữa chính sách tiền tệ và tăng trưởng kinh tế,\nlạm phát, lãi suất và tỷ giá hối đoái\nLOS","qhtml":null},{"n":63,"q":"An analyst has estimated the probabilities of two unrelated events. Which probability rule\nis most appropriate for calculating the joint probability of these two events?","opts":["Addition","Multiplication","Total probability"],"ans":"B","expl":"Quy tắc xác suất cơ bản\nXác suất xảy ra sự kiện A hoặc B\nHãy nhớ trừ đi phần kết hợp\nQuy tắc cộng P ( A hoặc B ) = P ( A ) + P ( B ) − P ( AB )\nxác suất xảy ra cả hai sự kiện\nXác suất xảy ra cả hai sự kiện A và B\nPhép nhân Khi A và B là các sự kiện độc lập,\nP ( A và B ) = P ( A | B ) × P ( B )\nquy tắc\ncông thức đơn giản hóa thành P ( A ) × P ( B )\nXác suất vô điều kiện để A xảy ra\ncho dù một sự kiện B khác có xảy ra hay\nP ( A ) = P ( A | B xảy ra)\nTổng số không xảy ra\n× P ( B xảy ra) + P ( A | B không\nquy tắc xác suất\nDễ hiểu hơn với cây\nxảy ra) × P ( B không xảy ra)\nsơ đồ\nĐể tính xác suất chung của hai sự kiện P ( A và B ) , hãy sử dụng quy tắc nhân\ncho xác suất : P ( AB ) = P ( A | B ) P ( B ).\nNếu các sự kiện A và B độc lập (nghĩa là không liên quan), như trong trường hợp này, thì P ( A ) = P ( A|B ) (tức là\nxác suất của A bằng với xác suất của A cho trước B ) vì xác suất xảy ra A là\nnhư nhau dù B có xảy ra hay không. Sau đó, quy tắc nhân đơn giản hóa thành P ( AB )\n= P ( A ) P ( B ) .\n(Lựa chọn A) Quy tắc cộng có thể được sử dụng để xác định xác suất của một sự kiện\n( A ) hoặc một sự kiện khác ( B ). Đối với hai sự kiện bất kỳ, quy tắc cộng cho xác suất mô tả cách\ntính xác suất A hoặc B sẽ xảy ra hoặc P ( A hoặc B ).\n(Lựa chọn C) Quy tắc tổng xác suất được sử dụng để tính xác suất vô điều kiện mà một sự kiện\nxảy ra, bất kể sự xuất hiện của các sự kiện khác (ví dụ).\nNhững điều cần nhớ:\nĐể tính toán xác suất chung của hai sự kiện, hãy sử dụng quy tắc nhân cho\nxác suất: P ( AB ) = P ( A | B ) P ( B ). Nếu các sự kiện độc lập, quy tắc đơn giản hóa thành P ( AB )\n= P ( A ) P ( B ).\nXây dựng bài toán đầu tư dưới dạng cây xác suất và giải thích việc sử dụng các kỳ vọng có điều kiện\ntrong ứng dụng đầu tư\nLOS","qhtml":null},{"n":64,"q":"Based on the financial statement analysis framework, which of the following is least likely a\nsource of information when collecting input data?","opts":["Industry and economic data","Financial statement forecasts","Discussions with management"],"ans":"B","expl":"Khung phân tích báo cáo tài chính\nKết quả hành động giai đoạn\nMục đích phân tích rõ ràng Mục tiêu phân tích bằng văn bản\nMục đích rõ ràng Xác định đối tượng Bản chất của báo cáo\nTài chính có tổ chức\nLấy báo cáo dữ liệu tài chính\nThu thập dữ liệu\nTruy cập công ty Hiểu rõ về mục tiêu và\nhoạt động\nBáo cáo tài chính đã điều chỉnh\nĐiều chỉnh số\nCác báo cáo có kích thước phổ biến\nXử lý dữ liệu\nTính toán dữ liệu\nCác tỷ lệ và dự báo tài chính\nHiểu được\nBáo cáo của nhà phân tích\nPhân tích/diễn giải dữ liệu\ndữ liệu\nPhát triển\nLập kế hoạch hành động Báo cáo khuyến nghị\nđề xuất\nLặp lại phân tích dưới dạng dữ liệu\nPhát hành lại các phân tích và báo cáo\nTheo dõi\ncác thay đổi\nKhung phân tích báo cáo tài chính là một chuỗi gồm sáu giai đoạn mô tả cách thức\nphân tích báo cáo tài chính được thực hiện khi đánh giá các khoản đầu tư vào\nchứng khoán của công ty. Trong mỗi giai đoạn, nhà phân tích hành động dựa trên thông tin và biến nó thành kết quả có thể\nđược sử dụng để hoàn thành giai đoạn tiếp theo. Trong giai đoạn thu thập dữ liệu, nhà phân tích thu thập tất cả\ndữ liệu liên quan sau khi nêu rõ (các) mục đích của việc phân tích. Dữ liệu được thu thập có thể là\ncác mục định lượng và định tính liên quan đến:\nDữ liệu kinh tế vĩ mô (ví dụ: GDP, lạm phát)\nTriển vọng của ngành mà công ty hoạt động (Lựa chọn A)\nTriển vọng của công ty trong ngành (ví dụ: dữ liệu tài chính lịch sử,\nthảo luận với ban quản lý) (Lựa chọn C)\nKết quả của giai đoạn này là tập hợp dữ liệu có thể được xử lý trong giai đoạn xử lý dữ liệu\n . Kết quả xử lý dữ liệu bao gồm:\nDự báo báo cáo tài chính\nCác tỷ lệ và báo cáo tài chính quy mô thông thường\nBiểu đồ và đồ thị\nDữ liệu này sau đó có thể được sử dụng để phân tích công ty dưới dạng một khoản đầu tư.\nNhững điều cần nhớ:\nKhung phân tích báo cáo tài chính mô tả cách phân tích báo cáo tài chính\nđược thực hiện khi đánh giá các khoản đầu tư vào chứng khoán của công ty. Giai đoạn thu thập dữ liệu\ndẫn đến việc thu thập dữ liệu có thể được xử lý trong giai đoạn xử lý dữ liệu.\nkết quả xử lý dữ liệu bao gồm dự báo báo cáo tài chính, có thể được sử dụng để\nphân tích công ty dưới dạng một khoản đầu tư.\nMô tả các bước trong khung phân tích báo cáo tài chính\nLOS","qhtml":null},{"n":65,"q":"Which of the following is most likely a limitation of an audit opinion? The auditor:","opts":["relies on sampling.","is responsible for detecting fraud.","is compensated by regulatory agencies."],"ans":"A","expl":"Hạn chế trong ý kiến của kiểm toán viên\nÝ kiến là kết quả của thông tin do công ty cung cấp,\nCơ sở của ý kiến\nmà kiểm toán viên có thể không xác minh được\nLấy mẫu Kiểm toán viên có thể không phát hiện được tất cả các sai sót\nCông chúng có thể đánh giá quá cao vai trò của kiểm toán viên trong\nKhoảng cách kỳ vọng\ntrình bày báo cáo tài chính\nCông ty trả phí kiểm toán, điều này có thể làm tăng\nTiền thưởng của kiểm toán viên\ncó biểu hiện xung đột lợi ích\nTrong quá trình kiểm toán, kiểm toán viên độc lập xem xét hồ sơ tài chính,\ngiao dịch và tài liệu liên quan của công ty để đảm bảo tuân thủ các chuẩn mực kế toán và các quy định\n. Ý kiến ​​kiểm toán thể hiện phán đoán chuyên môn của kiểm toán viên về việc\nliệu báo cáo tài chính có phản ánh trung thực và hợp lý về tình hình và hiệu quả hoạt động\ntài chính của công ty hay không.\nCác chủ nợ, cổ đông và cơ quan quản lý đều có ý kiến ​​kiểm toán, tạo ra sự minh bạch\ntrong báo cáo tài chính. Tuy nhiên, những hạn chế cố hữu vẫn tồn tại. Ví dụ: kiểm toán viên chỉ dựa\nvào thông tin do công ty chuẩn bị. Ngoài ra, việc sử dụng phương pháp lấy mẫu trong kiểm tra, chỉ với\nmột tập hợp con các giao dịch được xem xét, có nguy cơ bỏ sót các sai sót và thậm chí sai sót.\nCũng có thể có sự chênh lệch giữa vai trò của kiểm toán viên và kỳ vọng của công chúng, được gọi là\n\"khoảng cách kỳ vọng\". Công chúng có thể mong đợi kiểm toán viên phát hiện gian lận và/hoặc đánh giá\nxác suất thành công trong kinh doanh, nhưng những hoạt động này vượt quá phạm vi\nhạn chế của kiểm toán viên (Lựa chọn B) .\n(Lựa chọn C) Phí kiểm toán thường do công ty được kiểm toán thanh toán chứ không phải do các cơ quan quản lý\n. Điều này có thể khuyến khích kiểm toán viên tỏ ra khoan dung, đặc biệt nếu công ty\ncũng thuê kiểm toán viên cho các dịch vụ khác.\nNhững điều cần nhớ:\nÝ kiến ​​kiểm toán xác minh tính phù hợp của báo cáo tài chính nhưng cũng có những hạn chế.\nNhững điều này bao gồm sự tin cậy vào thông tin do công ty chuẩn bị và dữ liệu được lấy mẫu. Những hạn chế như vậy\ncó thể dẫn đến việc kiểm toán viên bỏ sót sai sót hoặc gian lận trong báo cáo.\nMô tả các cơ chế kiểm soát chất lượng báo cáo tài chính và những hạn chế tiềm ẩn của\ncác cơ chế đó\nLOS","qhtml":null},{"n":66,"q":"An analyst runs a simple linear regression using a sample of 10 observations. To assess the\nvalidity of the regression statistics, the analyst randomly draws 20 observations from the\nsame data. The results of both regression analyses are:\nSum of Sum of\nSample size squares squares\ntotal (SST) errors (SSE)\nRegression 1 10 167.00 47.75\nRegression 2 20 334.00 95.50\nBased on this information, the analyst should most likely conclude that:","opts":["Regression 1 has a larger F-statistic.","both regressions have the same F-statistic.","Regression 2 has a larger F-statistic."],"ans":"C","expl":"Tổng bình phương\nTổng bình phương ( SST) = Tổng hồi quy bình phương (SSR) + Tổng sai số bình phương (SSE)\nCó thể sử dụng hồi quy tuyến tính đơn giản (SLR) để đánh giá mức độ mà các biến thể trong biến phụ thuộc a\nđược giải thích bởi các biến thể trong một biến độc lập. Đầu ra của a\nphân tích hồi quy bao gồm:\ntổng bình phương tổng ( SST ), sự biến thiên trong các giá trị quan sát được của biến phụ thuộc\nso với giá trị trung bình của nó,\ntổng hồi quy bình phương ( SSR ), tỷ lệ biến thiên của biến phụ thuộc\nđược giải thích bằng những thay đổi trong biến độc lập và\ntổng sai số bình phương ( SSE ), tỷ lệ biến thiên của biến phụ thuộc\nkhông giải thích được bằng những thay đổi trong biến độc lập.\nThống kê F được sử dụng để đánh giá mức độ phù hợp (tức là mô hình hồi quy phù hợp với\ndữ liệu đến mức nào). Thống kê F phản ánh biến thể được giải thích và biến thể không giải thích được trong\nbiến phụ thuộc , được điều chỉnh theo cỡ mẫu và bậc tự do (tức là hồi quy bình phương trung bình\n [MSR] / sai số bình phương trung bình [ MSE ]). Đối với một tập dữ liệu nhất định, cả\nSSR và SSE đều tăng khi kích thước mẫu tăng:\nTrong trường hợp này, cả SST và SSE đều tăng gấp đôi khi kích thước mẫu tăng gấp đôi. Điều này cho thấy\ncả hai mẫu đều có cùng phương sai tương đối. Vì ước số trong việc tính toán thống kê F-\ncó liên quan nghịch với kích thước mẫu, nên các yếu tố khác không đổi, kích thước mẫu\n lớn hơn thể hiện cùng một biến thể tương đối sẽ dẫn đến giá trị lớn hơn cho thống kê F\n(Lựa chọn A và B) .\nCỡ mẫu lớn hơn thể hiện cùng một biến thể tương đối của biến phụ thuộc nên\ngiúp nhà phân tích tin tưởng hơn về khả năng giải thích của biến\nđộc lập.\nNhững điều cần nhớ:\nThống kê F được sử dụng để đánh giá mức độ phù hợp của mô hình hồi quy với dữ liệu. Nếu biến thể\ntương đối của biến phụ thuộc không đổi khi cỡ mẫu từ một tập dữ liệu nhất định\ntăng thì thống kê F sẽ tăng.\nTính toán và giải thích các thước đo mức độ phù hợp, xây dựng và đánh giá các kiểm tra mức độ phù hợp và hồi quy\ncác hệ số trong hồi quy tuyến tính đơn giản\nLOS","qhtml":null},{"n":67,"q":"An analyst compiles the following information on a company:\n¥ millions 20X1 20X2\nRevenue 1,500 2,000\nCOGS 500 650\nSelling, general, and administrative expenses 450 550\nDepreciation and amortization 100 150\nOperating income 450 650\nInterest expense 80 90\nPretax profit 370 560\nIncome tax expense 111 140\nNet income 259 420\nThe analyst decides to use a common-size income statement to evaluate the company. After\nthe necessary adjustments are made, which of the following was the greatest contributor to\nthe company's net profit margin expansion in 20X2?","opts":["Greater gross margin percentage","Smaller proportion of interest expenses","Smaller proportion of selling, general, and administrative expenses"],"ans":"C","expl":"Báo cáo thu nhập thông thường trình bày từng mục trong báo cáo dưới dạng phần trăm của tổng\ndoanh thu . Điều này cho phép các nhà phân tích so sánh các công ty có quy mô khác nhau, xem xu hướng hiệu suất\ntheo thời gian và xác định sự khác biệt hoặc thay đổi trong chiến lược của các công ty.\nTrong trường hợp này, báo cáo thu nhập quy mô chung được tính như sau:\nĐã báo cáo (¥) Quy mô chung (%)\nBáo cáo thu nhập 20X1 20X2 20X1 20X2\nDoanh thu 1.500 2.000 100,0 100,0\ngiá vốn hàng bán 500 650 33,3 32,5\nLợi nhuận gộp (lợi nhuận) (được tính) 1.000 1.350 66,7 67,5\nBán, chi phí chung và chi phí quản lý 450 550 30,0 27,5\nKhấu hao và phân bổ 100 150 6,7 7,5\nThu nhập hoạt động (lợi nhuận) 450 650 30,0 32,5\nChi phí lãi vay 80 90 5,3 4,5\nLợi nhuận trước thuế (biên lợi nhuận) 370 560 24,7 28,0\nChi phí thuế thu nhập 111 140 7,4 7,0\nThu nhập ròng (biên lợi nhuận) 259 420 17,3 21,0\nYếu tố đóng góp lớn nhất vào việc mở rộng tỷ suất lợi nhuận ròng của công ty là giảm\ntỷ lệ chi phí bán hàng, chi phí chung và chi phí hành chính (SG&A), giảm\n2,5% từ 30,0% doanh thu trong năm 20X1 xuống 27,5% trong năm 20X2.\n(Lựa chọn A) Tỷ lệ lợi nhuận gộp của công ty đã tăng 0,8% từ 66,7% trong năm 20X1 lên\n67,5% trong 20X2. Tuy nhiên, mức này nhỏ hơn mức thay đổi trong chi phí SG&A, khiến nó trở thành\nđóng góp nhỏ hơn vào việc mở rộng tỷ suất lợi nhuận ròng.\n(Lựa chọn B) Chi phí lãi vay của công ty giảm 0,8% từ 5,3% doanh thu trong năm 20X1\nxuống 4,5% trong năm 20X2. Tuy nhiên, mức này nhỏ hơn mức thay đổi trong chi phí SG&A, khiến nó đóng góp\nnhỏ hơn vào việc mở rộng tỷ suất lợi nhuận ròng.\nNhững điều cần nhớ:\nBáo cáo thu nhập thông thường trình bày từng mục trong báo cáo dưới dạng phần trăm của tổng\ndoanh thu. Điều này cho phép các nhà phân tích so sánh các công ty có quy mô khác nhau, xem xu hướng\nhiệu suất theo thời gian và xác định sự khác biệt hoặc thay đổi trong chiến lược của các công ty.\nĐánh giá hiệu quả tài chính của công ty bằng cách sử dụng báo cáo kết quả hoạt động kinh doanh và\ntài chính thông thường dựa trên báo cáo thu nhập\nLOS","qhtml":null},{"n":68,"q":"A company reports the following information in its first year of operations:\nTaxable profit €155,000\nAccounting profit €140,000\nTax rate 20%\nAll else equal, if the tax rate had been 25% instead of 20%, then most likely the company's:","opts":["deferred tax assets would have been €750 lower.","deferred tax assets would have been €750 higher.","deferred tax liabilities would have been €750 higher."],"ans":"B","expl":"Tài sản thuế thu nhập hoãn lại (DTA) và nợ phải trả phát sinh từ chênh lệch tạm thời giữa thuế thu nhập\nchi phí và thuế phải nộp trong một kỳ. Những khác biệt này dự kiến ​​sẽ đảo ngược theo thời gian\nvà bù đắp các khoản thuế hoãn lại trước đó. Chi phí thuế thu nhập được dựa trên thu nhập kế toán\nđược báo cáo từ báo cáo kết quả hoạt động kinh doanh. Thuế phải trả dựa trên thu nhập chịu thuế\ntrên tờ khai thuế và là số tiền thực tế nợ chính phủ.\nDTA phát sinh khi:\nThu nhập chịu thuế > Thu nhập kế toán và\nThuế phải nộp > Chi phí thuế.\nNợ thuế thu nhập hoãn lại (DTL) phát sinh khi:\nThu nhập chịu thuế < Kế toán thu nhập và\nThuế phải nộp < Chi phí thuế.\nTrong trường hợp này, DTA được tạo do thu nhập chịu thuế lớn hơn thu nhập kế toán\nthu nhập kế toán (Lựa chọn C) .\nSố thuế hoãn lại có thể được tính bằng tích của chênh lệch tuyệt đối giữa\nthu nhập chịu thuế và thu nhập kế toán và thuế suất. Do đó, quy mô của mục thuế thu nhập hoãn lại\ncó tương quan trực tiếp với thuế suất. Nếu thuế suất cao hơn thì số tiền\ncủa khoản tăng DTA cũng sẽ cao hơn (Lựa chọn A) .\nNhững điều cần nhớ:\nSố tiền thuế hoãn lại có thể được tính bằng tích của chênh lệch tuyệt đối\ngiữa lợi nhuận chịu thuế và lợi nhuận kế toán và thuế suất. Quy mô của mục thuế thu nhập hoãn lại\ncó tương quan trực tiếp với thuế suất.\nGiải thích cách tạo ra tài sản và nợ thuế thu nhập hoãn lại cũng như các yếu tố xác định cách xử lý tài sản và nợ thuế thu nhập hoãn lại của một\ncho mục đích phân tích\ntài chính\nLOS","qhtml":null},{"n":69,"q":"A company that reports under IFRS is valuing its year-end inventory. It has collected the\nfollowing information (in CHF millions):\nHistoric cost 175\nReplacement cost 165\nSelling price 240\nCost to sell inventory 60\nBased on this data, the inventory value (in CHF millions) reported on its balance sheet\nis closest to:","opts":["165","175","180"],"ans":"B","expl":"Hàng tồn kho ban đầu được ghi nhận trên bảng cân đối kế toán của công ty theo giá gốc. Tuy nhiên,\ncác công ty phải thường xuyên đánh giá lại giá trị này. Nếu giá trị hàng tồn kho giảm xuống dưới giá thành\n(ví dụ: hư hỏng, lỗi thời, giảm giá bán), công ty phải ghi lại\nhàng tồn kho để phản ánh giá trị mới, thấp hơn, trở thành giá trị ghi sổ.\nIFRS yêu cầu các công ty báo cáo giá trị ghi sổ của hàng tồn kho ở mức thấp hơn\nchi phí hoặc giá trị thuần có thể thực hiện được (NRV). NRV là giá bán ước tính trừ đi chi phí\nhoàn thành và bán hàng tồn kho.\nTrong trường hợp này, NRV của hàng tồn kho là 180 triệu CHF (240 − 60). Giá trị này cao hơn\nchi phí 175, do đó không ghi sổ và hàng tồn kho vẫn ở mức 175.\n(Lựa chọn A) 165 là giá trị thay thế, IFRS không sử dụng khi định giá hàng tồn kho.\nGiá trị thay thế được sử dụng bởi các công ty báo cáo theo GAAP của Hoa Kỳ và sử dụng LIFO hoặc phương pháp kiểm kê bán lẻ\nkhi định giá hàng tồn kho.\n(Lựa chọn C) 180 là NRV, lớn hơn chi phí lịch sử. Vì hàng tồn kho\nbắt buộc phải được định giá ở mức thấp hơn chi phí và NRV nên công ty sẽ không được phép\ntăng giá trị hàng tồn kho của mình trên 175.\nNhững điều cần nhớ:\nIFRS yêu cầu các công ty báo cáo giá trị ghi sổ của hàng tồn kho ở mức thấp hơn chi phí hoặc giá trị thuần\ncó thể thực hiện được (NRV). NRV là giá bán ước tính trừ đi chi phí để hoàn thành và\nbán hàng tồn kho.\nMô tả việc đo lường hàng tồn kho ở mức thấp hơn giá gốc và giá trị thuần có thể thực hiện được cũng như\ný nghĩa của nó đối với báo cáo tài chính và các tỷ số\nLOS","qhtml":null},{"n":70,"q":"An analyst gathers the following information (in € millions) for a company reporting under\nIFRS:\nCFO 720\nInterest paid 25\nInvestment in working capital 40\nInvestment in fixed capital (CAPEX) 300\nTax rate 20%\nThe company reports interest paid as a cash outflow under financing activities. Based on this\ninformation, FCFF (in € millions) is closest to:","opts":["380","420","440"],"ans":"B","expl":"Dòng tiền tự do cho công ty (FCFF) là dòng tiền có sẵn cho vốn của công ty\nnhà cung cấp (tức là người cho vay và cổ đông) sau khi trang trải chi phí hoạt động và đầu tư\ntrong vốn cố định và vốn lưu động. Dòng tiền tự do có thể được sử dụng để:\ntrả lãi và gốc cho người cho vay hoặc\ntrả cổ tức và mua lại cổ phần từ các cổ đông.\nVì FCFF đại diện cho nguồn vốn sẵn có cho tất cả các nhà cung cấp vốn nên nó được tính trước khi lãi\nchi phí được khấu trừ.\nFCFF có thể được tính từ CFO. IFRS cho phép các khoản thanh toán lãi được báo cáo dưới dạng\ndòng chi hoạt động hoặc tài trợ, do đó tiền lãi chỉ được cộng lại cho CFO nếu nó được phân loại là\nmột dòng chi hoạt động. Theo GAAP của Hoa Kỳ, các khoản thanh toán lãi luôn được báo cáo là dòng tiền chảy ra\ntrong hoạt động kinh doanh, do đó tiền lãi phải được cộng lại cho CFO khi tính toán FCFF.\nTrong trường hợp này, tiền lãi đã trả được phân loại là dòng tiền chi tài chính nên nó không được cộng trở lại\nCFO. Do đó, FCFF chỉ đơn giản là CFO − CAPEX = 720 − 300 = 420 triệu €.\n(Lựa chọn A) 380 triệu € là kết quả của việc trừ sai các khoản đầu tư vốn lưu động\nkhỏi CFO. CFO đã tính đến các dòng tiền chảy ra liên quan đến các khoản đầu tư vào vốn lưu động\n.\n(Lựa chọn C) 440 triệu euro là kết quả của việc cộng nhầm tiền lãi sau thuế cho CFO.\nĐiều này sẽ chỉ phù hợp nếu công ty phân loại các khoản thanh toán lãi là một luồng chi hoạt động.\nNhững điều cần nhớ:\nDòng tiền tự do của công ty (FCFF) là dòng tiền có sẵn cho các nhà cung cấp vốn của công ty sau khi\ntrang trải chi phí hoạt động và đầu tư vào vốn cố định và vốn lưu động. Theo IFRS,\ncác khoản thanh toán lãi có thể được phân loại là dòng tiền chi hoạt động hoặc tài trợ. Khi tính toán\nFCFF từ CFO, tiền lãi chỉ được cộng lại cho CFO nếu nó được phân loại là một luồng chi hoạt động.\nTính toán và diễn giải dòng tiền tự do của công ty, dòng tiền tự do trên vốn chủ sở hữu, hiệu suất và\ntỷ lệ dòng tiền khả dụng\nLOS","qhtml":null},{"n":71,"q":"Which of the following central bank actions is most likely considered expansionary monetary\npolicy?","opts":["Reducing the reserve requirement","Selling government bonds through open market operations","Holding the policy rate constant as the neutral rate falls below it"],"ans":"A","expl":"Các công cụ chính sách tiền tệ\nCông cụ Mô tả Thu hẹp mở rộng\nThị trường mở Chứng khoán giao dịch (thường là Mua của chính phủ\nBán chứng khoán\nchứng khoán hoạt động) chứng khoán\nLãi suất chính sách Đặt lãi suất dùng để báo hiệu thị trường Giảm Tăng\nĐặt tỷ lệ phần trăm tiền gửi ngân hàng được giữ trong\nYêu cầu dự trữ bắt buộc Giảm Tăng\ndự trữ\nChính sách tiền tệ mở rộng được sử dụng để thúc đẩy tăng trưởng kinh tế trong thời kỳ\ndecline (ví dụ: khi sản lượng thấp hơn GDP tiềm năng). Ví dụ: ngân hàng trung ương có thể thực hiện\nchính sách mở rộng nhằm tăng dự trữ vượt mức trong hệ thống ngân hàng thương mại bằng cách:\nthực hiện mua hàng trên thị trường mở,\ngiảm yêu cầu dự trữ bắt buộc, biến một số dự trữ bắt buộc thành dự trữ vượt mức\nhoặc\ngiảm lãi suất chính sách, giúp giảm chi phí mà ngân hàng phải gánh chịu khi đi vay\ndự trữ.\nDự trữ dư thừa khuyến khích tăng cường cho vay vì các ngân hàng có thể kiếm được lợi nhuận cao hơn bằng cách cho vay\nso với việc giữ dự trữ. Điều này mở rộng cung tiền và giảm lãi suất,\ndẫn đến tăng trưởng vay, đầu tư và tiêu dùng, và do đó làm tăng GDP.\n(Lựa chọn B) Một ngân hàng trung ương tiến hành bán hàng trên thị trường mở để giảm nắm giữ trái phiếu chính phủ\nkhi thực hiện chính sách tiền tệ thắt chặt. Các ngân hàng thương mại sử dụng dự trữ\nđể mua trái phiếu, làm hợp đồng cung tiền.\n(Lựa chọn C) Một ngân hàng trung ương giữ lãi suất chính sách không đổi khi lãi suất trung lập\nlãi suất giảm xuống dưới lãi suất chính sách nhằm thắt chặt các điều kiện tín dụng. Việc a\nngân hàng trung ương không hành động này là sự thu hẹp chứ không phải sự mở rộng.\nNhững điều cần nhớ:\nCác chính sách tiền tệ mở rộng được sử dụng để thúc đẩy tăng trưởng kinh tế. Việc giảm yêu cầu dự trữ\nsẽ tạo ra dự trữ dư thừa, dẫn đến mở rộng cung tiền và giảm\nlãi suất. Lãi suất thấp hơn dẫn đến tăng vay mượn, đầu tư và\ntiêu dùng, từ đó làm tăng GDP.\nMô tả phẩm chất của các ngân hàng trung ương hiệu quả; đối chiếu việc họ sử dụng lạm phát, lãi suất và\nnhắm mục tiêu tỷ giá hối đoái trong chính sách tiền tệ mở rộng hoặc thu hẹp; và mô tả\nhạn chế của chính sách tiền tệ\nLOS","qhtml":null},{"n":72,"q":"A company uses the LIFO inventory valuation method. In a deflationary environment with\ndeclining inventory costs, LIFO liquidation would most likely lead the company to experience:","opts":["greater COGS.","less net revenue.","greater tax expense."],"ans":"A","expl":"Phương pháp LIFO (nhập sau, xuất trước) giả định rằng hàng tồn kho mới hơn được bán trước: Chi phí đơn vị từ\nnhững lần mua gần đây hơn được gán cho giá vốn hàng bán (COGS), để lại chi phí đơn vị\ncũ hơn trong giá trị của khoảng không quảng cáo còn lại. Khi chi phí đơn vị hàng tồn kho đang giảm do môi trường giảm phát\n, LIFO thường dẫn đến giá vốn hàng bán thấp hơn và lượng hàng tồn kho cuối kỳ lớn hơn.\nViệc thanh lý LIFO xảy ra khi một công ty bán nhiều đơn vị hàng tồn kho hơn mức họ đã mua trong\nmột khoảng thời gian. Để hoàn thành doanh số bán hàng, công ty thanh lý hàng tồn kho cũ từ các kỳ trước,\nvới chi phí đơn vị cao hơn thay vì mua các đơn vị mới hơn với chi phí đơn vị thấp hơn.\nKhi giá giảm , việc bao gồm chi phí đơn vị cũ hơn, cao hơn sẽ\ntạm thời dẫn đến giá vốn hàng bán cao hơn so với khi doanh số bán hàng được thực hiện chỉ bằng cách mua hàng mới.\n(Lựa chọn B) Phương pháp định giá hàng tồn kho tác động đến giá vốn hàng bán và các mục hàng lợi nhuận dưới giá vốn hàng bán, nhưng\nkhông ảnh hưởng đến doanh thu thuần.\n(Lựa chọn C) Thuế sẽ thấp hơn vì giá vốn hàng bán cao hơn sẽ làm giảm lợi nhuận trước thuế.\nNhững điều cần nhớ:\nViệc thanh lý LIFO xảy ra khi một công ty bán nhiều đơn vị hàng tồn kho hơn số lượng đã mua trong kỳ\nvà thanh lý hàng tồn kho từ các kỳ trước để hoàn thành doanh số bán hàng, thay vì mua\nđơn vị mới hơn. Trong thời gian giá giảm, hàng tồn kho cũ có đơn giá lớn hơn; do đó,\nViệc thanh lý LIFO dẫn đến giá vốn hàng bán lớn hơn và chi phí thuế ít hơn.\nTính toán và giải thích lạm phát và giảm phát chi phí hàng tồn kho ảnh hưởng như thế nào đến báo cáo tài chính\nvà tỷ lệ của các công ty sử dụng các phương pháp định giá hàng tồn kho khác nhau\nLOS","qhtml":null},{"n":73,"q":"An analyst gathers information from the income statements of two companies:\nCompany X has gross revenues of CAD 10 billion, and\nCompany Y has gross revenues of CAD 10 million.\nTo compare the companies' operating profit margins, the analyst should most\nappropriately use:","opts":["regression analysis.","event study analysis.","common-size statement analysis."],"ans":"C","expl":"Phân tích quy mô chung của báo cáo kết quả hoạt động kinh doanh liên quan đến việc trình bày từng chi tiết đơn hàng dưới dạng\nmột phần trăm doanh thu. Điều này cho phép so sánh qua các khoảng thời gian khác nhau (tức là thời gian-\nphân tích chuỗi) và giữa các công ty khác nhau (tức là phân tích chéo)\nbằng cách chuẩn hóa từng chi tiết đơn hàng , từ đó giảm thiểu tác động của quy mô công ty .\nPhân tích quy mô chung là một hình thức phân tích cắt ngang, so sánh các thực thể khác nhau\n(ví dụ: các công ty) tại một thời điểm cụ thể và thường được sử dụng để xác định các mô hình, xu hướng hoặc\nmối quan hệ giữa các biến tại một thời điểm cụ thể. Điều này trái ngược với chuỗi thời gian\nphân tích, tập trung vào những thay đổi trong một thực thể duy nhất theo thời gian.\n(Lựa chọn A) Phân tích hồi quy đánh giá mối quan hệ giữa biến phụ thuộc và\nmột hoặc nhiều biến độc lập. Mục đích của phân tích này là mô hình hóa mối quan hệ,\nhiểu sức mạnh và bản chất của nó, và đưa ra dự đoán phù hợp.\n(Lựa chọn B) Phân tích nghiên cứu sự kiện đánh giá tác động của các sự kiện cụ thể, chẳng hạn như thu nhập\nthông báo hoặc thay đổi chính sách, về thị trường tài chính hoặc các biến số khác. Việc phân tích\nđánh giá cách các biến phản ứng với các sự kiện này trong một khoảng thời gian cụ thể.\nNhững điều cần nhớ:\nPhân tích quy mô chung của báo cáo thu nhập liên quan đến việc thể hiện từng mục dưới dạng phần trăm\ntổng doanh thu hoặc doanh thu. Cách tiếp cận này đơn giản hóa việc so sánh theo thời gian (tức là, chuỗi thời gian\nphân tích) và giữa các công ty khác nhau (tức là phân tích chéo) vì nó tiêu chuẩn hóa từng\nmục hàng và giảm thiểu ảnh hưởng của quy mô công ty.\nĐánh giá hiệu quả tài chính của công ty bằng cách sử dụng báo cáo kết quả hoạt động kinh doanh và báo cáo tài chính quy mô chung\ntỷ lệ dựa trên báo cáo kết quả hoạt động kinh doanh\nLOS","qhtml":null},{"n":74,"q":"An analyst identifies the presence of outliers in a sample containing the P/E ratios of 40\ncompanies. The analyst discards the two smallest and the two largest observations before\ncalculating the average P/E ratio. This process best describes the use of a:","opts":["trimmed mean.","harmonic mean.","winsorized mean."],"ans":"A","expl":"Các thước đo (tức là phương tiện) của xu hướng trung tâm bao gồm trung bình số học, trung bình hình học,\nvà trung bình có trọng số. Mặc dù sự hiện diện của các giá trị cực trị (tức là các giá trị ngoại lệ) có thể\nlàm sai lệch đáng kể độ chính xác của các biện pháp này, nhưng các biện pháp khác sẽ làm giảm tác động đó. Trong\nkịch bản này, 40 quan sát được xếp hạng theo thứ tự tăng dần với ba phương tiện được áp dụng để\nxử lý các giá trị ngoại lệ theo nhiều cách khác nhau:\nMột giá trị trung bình được cắt bớt sẽ loại bỏ các quan sát nhỏ nhất và lớn nhất, đồng thời tính toán\ntrung bình của các quan sát còn lại. Trong trường hợp này, giá trị trung bình được cắt bớt 10% sẽ loại bỏ\nhai quan sát nhỏ nhất (cấp 1 và 2) và hai quan sát lớn nhất (xếp hạng\n39 và 40), sau đó tính giá trị trung bình của 36 quan sát còn lại.\nTrung bình được tối ưu hóa sẽ thay thế các quan sát nhỏ nhất và lớn nhất tương ứng bằng\ngiá trị nhỏ nhất và lớn nhất nằm trong phạm vi có thể chấp nhận được. Ở đây, giá trị trung bình chiến thắng 90%\nthay thế hai giá trị nhỏ nhất bằng 9,5 (xếp hạng 3) và hai giá trị\nlớn nhất bằng 65,6 (xếp hạng 38), sau đó tính giá trị trung bình của 40 quan sát (Lựa chọn\nC) .\nTrung bình điều hòa là tỷ lệ giữa số lượng quan sát với tổng của nghịch đảo.\nĐó là giá trị trung bình có trọng số gán trọng số nhỏ hơn cho các quan sát lớn hơn ; trong trường hợp\nnày, trọng số nằm trong khoảng từ 0,323 (xếp hạng 1) đến 0,008 (xếp hạng 40). Do các trọng số này,\ntrung bình điều hòa ít bị ảnh hưởng bởi các giá trị ngoại lệ lớn hơn, nhưng nó có thể bị kéo theo\nhướng của các giá trị nhỏ hơn (Lựa chọn B) .\nNhững điều cần nhớ:\nMột số thước đo (tức là phương tiện) của xu hướng trung tâm xử lý sự hiện diện của các giá trị ngoại lệ. Giá trị trung bình\nđược tối ưu hóa sẽ thay thế các quan sát nhỏ nhất và lớn nhất bằng các giá trị nằm trong phạm vi\ncó thể chấp nhận được, trong khi giá trị trung bình được cắt bớt chỉ loại bỏ những quan sát đó. Giá trị trung bình hài hòa sử dụng\nnghịch đảo để gán trọng số nhỏ hơn cho các quan sát lớn hơn.\nTính toán, giải thích và đánh giá các thước đo về xu hướng trung tâm và vị trí để giải quyết\nvấn đề đầu tư\nLOS","qhtml":null},{"n":75,"q":"Two events, A and B , are not independent: B 's probability depends on whether A occurs. If\nthe unconditional probability of A is known, which of the following probability rules is least\nappropriate to estimate the unconditional probability of B ?","opts":["Addition rule","Multiplication rule","Total probability rule"],"ans":"A","expl":"Kết quả của một sự kiện thường bị ảnh hưởng bởi các kịch bản khác nhau tác động đến\nxác suất của sự kiện. Trong câu hỏi này, xác suất của B bị ảnh hưởng bởi\nliệu A có xảy ra hay không. Xác suất của B đề cập đến xác suất vô điều kiện của nó: tổng\nxác suất B xảy ra nếu A xảy ra VÀ nếu A không xảy ra.\nKết quả của B bị ảnh hưởng bởi kết quả của A, do đó xác suất B xảy ra khi A xảy ra,\nxác suất có điều kiện P( B | A ), có thể không bằng xác suất B xảy ra cho trước\nB|AC\nrằng A không xảy ra: P ( B|A ) ≠ P ( ).\nC\nVì A xảy ra hoặc không xảy ra nên A và A loại trừ lẫn nhau và đầy đủ. Cái này\nAC\ncó nghĩa là xác suất chung P ( B AND A ) và P ( B AND ) bao gồm tất cả các kết quả có thể xảy ra\ncủa B. Tổng các xác suất chung này là tổng xác suất (tức là xác suất vô điều kiện)\ncủa B. Vì quy tắc tổng xác suất yêu cầu sử dụng quy tắc nhân để tính\nxác suất chung (sau đó được tổng hợp để tính tổng xác suất), tổng\ncác quy tắc xác suất và nhân thích hợp để sử dụng cho phép tính này (Lựa chọn B và\nC) .\nQuy tắc cộng tính xác suất xảy ra A hoặc B là không phù hợp\nở đây. Câu hỏi yêu cầu xác suất của B bất kể sự xuất hiện của A.\nNhững điều cần nhớ:\nKhi các kịch bản khác nhau ảnh hưởng đến khả năng xảy ra một sự kiện, quy tắc tổng xác suất là\nđược sử dụng để tính xác suất vô điều kiện (tức là tổng) của sự kiện. vô điều kiện\nxác suất là tổng các xác suất chung, yêu cầu sử dụng quy tắc nhân.\nHãy hình thành một bài toán đầu tư dưới dạng cây xác suất và giải thích việc sử dụng các điều kiện\nkỳ vọng trong ứng dụng đầu tư\nLOS","qhtml":null},{"n":76,"q":"A company is currently developing a new software product for potential introduction to the\nmarket. If the company has demonstrated the technical feasibility of the software, then future\ndevelopment costs should most appropriately :","opts":["be expensed.","be capitalized as a long-term asset.","reduce cash flow from operating activities."],"ans":"B","expl":"Xử lý chi phí nghiên cứu và phát triển (R&D)\nIFRS US GAAP\nChi phí R&D: thường được tính vào chi phí\nChi phí nghiên cứu:\nNgoại lệ phần mềm\nđã chi tiêu\nChi phí R&D đã tính chi phí trước\nPhát triển\nthiết lập tính khả thi về mặt kỹ thuật\nchi phí:\nChi phí R&D được vốn hóa một lần về mặt kỹ thuật\nđược vốn hóa\nkhả năng khả thi được thiết lập\nTài sản vô hình (ví dụ: bằng sáng chế, nhãn hiệu, phần mềm) không có dạng vật chất và có thể có được\nthông qua mua bán, sáp nhập và mua lại độc lập (tức là kết hợp kinh doanh) hoặc\nphát triển nội bộ. Khi một tài sản vô hình được mua:\nbên ngoài, chi phí được vốn hóa.\ntrong nội bộ, một số chi phí nghiên cứu và phát triển (R&D) nhất định có thể được tính vào chi phí hoặc\nđược vốn hóa.\nIFRS và US GAAP khác nhau ở một số lĩnh vực trong cách xử lý chi phí R&D nội bộ:\nIFRS yêu cầu các công ty tính chi phí nghiên cứu khi phát sinh và để tận dụng\nchi phí phát triển . Theo IFRS, chi phí phát triển sẽ phát sinh khi một sản phẩm\nđã chứng minh được tính khả thi về mặt kỹ thuật .\nUS GAAP xem xét các chi phí R&D cùng nhau và thường yêu cầu các công ty tính chi phí\nnhững chi phí đó. Tuy nhiên, đối với phần mềm , chi phí R&D được vốn hóa khi\nkhả thi về mặt kỹ thuật đã được chứng minh.\nTrong trường hợp này, sản phẩm phần mềm đang được phát triển nội bộ và đã chứng minh được\ntính khả thi về mặt kỹ thuật. Do đó, chi phí phát triển đáp ứng tiêu chí vốn hóa theo\ncả IFRS và US GAAP (Lựa chọn A) .\n(Lựa chọn C) Vì chi phí phát triển được vốn hóa nên chúng thể hiện dòng tiền ra\ntrong hoạt động đầu tư chứ không phải hoạt động điều hành. Dòng tiền từ hoạt động kinh doanh\nnắm bắt các chi phí được tính vào báo cáo thu nhập.\nNhững điều cần nhớ:\nIFRS yêu cầu các công ty tính chi phí nghiên cứu khi phát sinh và tận dụng\nchi phí phát triển. Chi phí phát triển sẽ phát sinh khi sản phẩm đã được chứng minh\ntính khả thi về mặt kỹ thuật. GAAP của Hoa Kỳ thường yêu cầu các công ty tính chi phí nghiên cứu và phát triển\nnhưng tận dụng chi phí cho các sản phẩm phần mềm sau khi tính khả thi về mặt kỹ thuật đã được chứng minh.\nSo sánh báo cáo tài chính của các loại tài sản vô hình sau: đã mua,\nđược phát triển nội bộ và được mua lại trong một sự hợp nhất kinh doanh\nLOS","qhtml":null},{"n":77,"q":"An analyst compiles the following common-sized cash flow statements as a percentage of\nrevenue for a company:\n20X4 20X5\nNet income 9.0% 11.1%\nDepreciation and amortization 5.0% 6.7%\nChanges in operating assets and liabilities −5.5% −7.2%\nCash flow from operations 8.5% 10.6%\nPurchase of equipment −5.0% −6.7%\nCash flow from investing −5.0% −6.7%\nIssuance of debt 6.0% 2.2%\nRepayment of debt −6.0% −1.7%\nDividend payments −1.5% −1.7%\nCash flow from financing −1.5% −1.1%\nNet change in cash 2.0% 2.8%\nCash paid for interest 2.5% 2.2%\nThe company had total revenue of MXN 1,000 million in 20X4, MXN 900 million in 20X5, and a\ntax rate of 20% for both years. The analyst's most appropriate conclusion is that the\ncompany is:","opts":["increasing its free cash flow to equity.","growing its dividend in line with net income.","expanding its net investments in equipment."],"ans":"A","expl":"Báo cáo lưu chuyển tiền tệ cỡ thông thường hiển thị từng mục trong báo cáo dưới dạng phần trăm\ndoanh thu hoặc phần trăm của tổng dòng tiền vào hoặc ra của công ty. Điều này cho phép\ncác nhà phân tích so sánh các khoản thu và chi của các công ty có quy mô khác nhau hoặc của\nmột công ty theo thời gian.\nTrong trường hợp này, báo cáo lưu chuyển tiền tệ quy mô chung chỉ ra rằng dòng tiền tự do\nđến vốn chủ sở hữu (FCFE) của công ty khi phần trăm doanh thu tăng lên trong khoảng thời gian từ 20X4 đến 20X5:\ntừ 3,5% (= 9% + 5% − 5,5% − 5% + 6% − 6%) trong 20X4\nđến 4,4% (= 11,1% + 6,7% −7,2% − 6,7% + 2,2% − 1,7%) trong 20X5.\nĐiều này tương đương với FCFE của MXN 35 triệu trong 20X4 (= 1.000 × 0,035) và 40 triệu MXN trong\n20X5 (= 900 × 0,044).\nLưu ý: Tiền mặt sau thuế trả lãi được sử dụng để tính toán dòng tiền tự do cho công ty\n(FCFF), không phải FCFE .\n(Lựa chọn B) Cổ tức của công ty không tăng theo thu nhập ròng. Cổ tức đã tăng\ntừ 1,5% lên 1,7% doanh thu, tức là tăng 13%; thu nhập ròng tăng từ 9% lên\n11,1%, tăng 23%.\n(Lựa chọn C) Tiền mặt công ty trả để mua thiết bị mới là 5% doanh thu trong\n20X4 và 6,7% vào năm 20X5. Mặc dù điều này mở rộng nhưng nó chỉ theo kịp tốc độ khấu hao\nchi phí, do đó đầu tư ròng không mở rộng. Điều này cho thấy rằng công ty chủ yếu\nchi tiêu để thay thế thiết bị cũ.\nNhững điều cần nhớ:\nBáo cáo lưu chuyển tiền tệ cỡ thông thường có thể trình bày từng mục trên báo cáo lưu chuyển tiền tệ dưới dạng\nphần trăm doanh thu. Chúng cho phép các nhà phân tích so sánh các khoản thu và chi mà\ngóp phần tạo ra tiền mặt cho các công ty có quy mô khác nhau hoặc cho một công ty theo thời gian.\nPhân tích và giải thích cả báo cáo lưu chuyển tiền tệ được báo cáo và báo cáo lưu chuyển tiền tệ thông thường\nLOS","qhtml":"<p>An analyst compiles the following common-sized cash flow statements as a percentage of revenue for a company:</p><table class=\"qtable\"><thead><tr><th></th><th>20X4</th><th>20X5</th></tr></thead><tbody><tr><td>Net income</td><td>9.0%</td><td>11.1%</td></tr><tr><td>Depreciation and amortization</td><td>5.0%</td><td>6.7%</td></tr><tr><td>Changes in operating assets and liabilities</td><td>−5.5%</td><td>−7.2%</td></tr><tr><td>Cash flow from operations</td><td>8.5%</td><td>10.6%</td></tr><tr><td>Purchase of equipment</td><td>−5.0%</td><td>−6.7%</td></tr><tr><td>Cash flow from investing</td><td>−5.0%</td><td>−6.7%</td></tr><tr><td>Issuance of debt</td><td>6.0%</td><td>2.2%</td></tr><tr><td>Repayment of debt</td><td>−6.0%</td><td>−1.7%</td></tr><tr><td>Dividend payments</td><td>−1.5%</td><td>−1.7%</td></tr><tr><td>Cash flow from financing</td><td>−1.5%</td><td>−1.1%</td></tr><tr><td>Net change in cash</td><td>2.0%</td><td>2.8%</td></tr><tr><td>Cash paid for interest</td><td>2.5%</td><td>2.2%</td></tr></tbody></table><p>The company had total revenue of MXN 1,000 million in 20X4, MXN 900 million in 20X5, and a tax rate of 20% for both years. The analyst's most appropriate conclusion is that the company is:</p>"},{"n":78,"q":"As the significance level of a hypothesis test increases, the most likely outcome is a decrease\nin the probability of:","opts":["a Type I error.","a Type II error.","both a Type I and a Type II error."],"ans":"B","expl":"Trong kiểm tra giả thuyết , lỗi Loại I là kết quả của việc bác bỏ giả thuyết khống thực sự.\nXác suất xảy ra lỗi Loại I tăng theo mức độ quan trọng của kiểm tra . Đối với\nví dụ, mức ý nghĩa 1% có nghĩa là xác suất xảy ra lỗi Loại I là 1%. Nếu\nmức ý nghĩa tăng lên 5% thì xác suất xảy ra lỗi Loại I cũng tăng lên\n5% (Lựa chọn A) .\nLỗi Loại II là kết quả của việc không bác bỏ giả thuyết khống sai. Như được hiển thị trong biểu đồ\nbên trái, thống kê kiểm tra nằm trong vùng \"không từ chối\" màu trắng khi kiểm tra ở mức ý nghĩa\nthấp hơn. Khi mức ý nghĩa tăng lên như được hiển thị trong biểu đồ bên phải, thống kê kiểm tra\n nằm trong vùng \"từ chối\" được tô màu xanh lam. Việc tăng mức ý nghĩa khiến giả thuyết\nnull bị bác bỏ thường xuyên hơn. Vì lỗi Loại II dựa trên việc không thể\nbác bỏ một giả thuyết khống sai, tất cả các yếu tố khác đều bằng nhau, mức ý nghĩa cao hơn có nghĩa là\nxác suất mắc lỗi Loại II giảm.\n(Lựa chọn C) Cách duy nhất để giảm đồng thời xác suất xảy ra lỗi Loại I và\nLỗi loại II là tăng kích thước của mẫu mà từ đó thống kê kiểm tra được tạo ra.\nNhững điều cần nhớ:\nViệc tăng mức độ quan trọng của kiểm tra giả thuyết sẽ làm tăng khả năng mắc lỗi Loại I\n. Tuy nhiên, việc tăng mức ý nghĩa cũng có nghĩa là giả thuyết không sẽ ít bị bác bỏ\n hơn. Vì lỗi Loại II xảy ra do không bác bỏ giả thuyết khống sai nên\nviệc tăng mức ý nghĩa sẽ làm giảm xác suất xảy ra lỗi Loại II.\nGiải thích việc kiểm tra giả thuyết và các thành phần của nó, bao gồm ý nghĩa thống kê, lỗi Loại I và Loại II\nvà sức mạnh của phép kiểm tra.\nLOS","qhtml":null},{"n":79,"q":"A company purchases a service on credit for TRY 10,000 in 20X8. The company recognizes\nthe expense on its income statement that year but will not pay cash until 20X9. Tax laws\nrequire that the company recognize the expense when cash is paid. If the company's tax rate\nis 30%, in 20X8 the company would most appropriately record a:","opts":["deferred tax asset of TRY 3,000.","deferred tax asset of TRY 7,000.","deferred tax liability of TRY 3,000."],"ans":"A","expl":"Tài sản thuế thu nhập hoãn lại so với thuế thu nhập hoãn lại phải trả\nChi phí thuế thu nhập < thuế phải trả\nTài sản thuế thu nhập hoãn lại\nĐược tạo bằng cách nộp thừa thuế trong kỳ hiện tại\nChi phí thuế thu nhập > thuế phải nộp\nNợ thuế thu nhập hoãn lại\nĐược tạo bằng cách nộp thiếu thuế trong kỳ hiện tại\nTài sản thuế thu nhập hoãn lại ( DTA ) và thuế thu nhập hoãn lại phải trả ( DTL ) phát sinh khi một công ty ghi nhận\nchi phí thuế cho mục đích báo cáo tài chính (tức là chi phí thuế thu nhập khác với\nsố tiền thuế phải nộp (tức là các khoản thuế phải nộp) trong kỳ đó và chênh lệch dự kiến sẽ\nngược lại. Một công ty phát sinh DTA khi số thuế phải trả lớn hơn thuế thu nhập\nchi phí .\nTrong trường hợp này, công ty ghi nhận khoản chi phí 10.000 TRY trên thu nhập của mình báo cáo\ntrong năm 20X8, tuy nhiên, công ty sẽ không thanh toán chi phí bằng tiền mặt cũng như không ghi nhận chi phí này trên tờ khai thuế\ncho đến năm 20X9, lợi nhuận trước thuế của công ty:\nsẽ thấp hơn 10.000 so với thu nhập chịu thuế và\nchi phí thuế thu nhập của công ty sẽ là 3.000 (10.000 × 30%) ít hơn số thuế phải nộp.\nVì những chênh lệch này sẽ đảo ngược vào năm 20X9 khi công ty thanh toán chi phí bằng tiền mặt nên\nDTA 3.000 TRY được tạo ra trong năm 20X8.\nGiả sử công ty có doanh thu 15.000 TRY, chênh lệch kế toán sẽ là\nnhư sau:\n(Lựa chọn B) DTA 7.000 là chênh lệch giữa các phần chi phí ảnh hưởng đến\nthu nhập ròng và thu nhập chịu thuế, không phải chênh lệch giữa chi phí thuế và thuế phải nộp.\n(Lựa chọn C) DTL 3.000 được tính bằng cách đảo ngược không chính xác chi phí thuế và thuế\npayable.\nNhững điều cần nhớ:\nTài sản thuế thu nhập hoãn lại (DTA) và thuế thu nhập hoãn lại phải trả (DTL) phát sinh khi một công ty ghi nhận\nchi phí thuế thu nhập khác với số thuế phải nộp và khoản chênh lệch đó dự kiến sẽ\nngược lại nếu thuế phải nộp của công ty lớn hơn chi phí thuế.\nGiải thích cách tạo ra tài sản và nợ thuế thu nhập hoãn lại cũng như các yếu tố quyết định cách xử lý tài sản và nợ thuế thu nhập hoãn lại của một\ncho mục đích phân tích\nLOS","qhtml":null},{"n":80,"q":"Which of the following statements best describes a disadvantage of using fiscal policy as a\nshort-run economic tool?","opts":["Indirect taxes are difficult to implement and have a delayed impact.","Capital spending plans take a long time to formulate and implement.","Direct taxes have very small expectational effects and long lead times."],"ans":"B","expl":"Chính sách tài chính so với các biến động theo chu kỳ ngắn hạn\nCông cụ chính sách Ví dụ về các vấn đề\nDoanh số\nGián tiếp Dễ dàng ban hành, ảnh hưởng đến hành vi và\nThuế đặc biệt\nđánh thuế doanh thu của chính phủ một cách nhanh chóng\nƯu điểm\nThuế\nCác điều chỉnh gần như có thể khuyến khích ngay lập tức\nChính sách xã hội\nTrợ cấp\nhoặc ngăn cản hành vi\nCá nhân\nthu nhập\nCần có thông báo quan trọng để cập nhật\nThuế trực tiếp\nDoanh nghiệp\nhệ thống máy tính\nlợi nhuận\nNhược điểm\nĐường cao tốc\nCapital Cần có thời gian dài để xây dựng và\nTrường học\nthực hiện chi tiêu\nChính sách tài chính (tức là chi tiêu và thuế của chính phủ) cố gắng tối đa hóa phúc lợi tổng thể bằng cách\nổn định sản lượng gần với tốc độ tăng trưởng GDP bền vững của nền kinh tế. Ở mức sản lượng đó,\ntăng trưởng thu nhập và việc làm ở mức cao nhất có thể được duy trì mà không\ntạo ra áp lực lạm phát:\nTăng trưởng trên mức đó có thể bị đối phó bằng các chính sách thắt chặt nhằm kiềm chế lạm phát.\nTăng trưởng dưới mức đó có thể được giải quyết bằng biện pháp kích thích tài chính để ngăn chặn tình trạng thất nghiệp quá mức\n.\nChi tiêu vốn của chính phủ cho cơ sở hạ tầng (ví dụ: cầu, sân bay) mang lại\nkích thích mạnh mẽ cho sản lượng và có thể tăng tốc độ tăng trưởng GDP bền vững. Tuy nhiên,\nkế hoạch chi tiêu vốn hiệu quả có thể mất nhiều năm để xây dựng và thực hiện, do đó, có thể\ncó ít ảnh hưởng đến nền kinh tế trong thời gian ngắn .\n(Lựa chọn A) Thuế gián thu dễ thực hiện và ảnh hưởng ngay lập tức đến hành vi của người tiêu dùng và doanh nghiệp\nvà doanh thu của chính phủ. Đây là những ưu điểm của việc sử dụng công cụ ngắn hạn này.\n(Lựa chọn C) Thuế trực tiếp (ví dụ: thuế thu nhập cá nhân) có thể mất nhiều thời gian để thay đổi nhưng\ncó tác động mạnh mẽ đến hoạt động kinh tế. Tác động của thuế trực thu được cảm nhận rõ ràng trước khi\nđược triển khai, với những tác động kỳ vọng mạnh mẽ xảy ra ngay sau khi thuế suất mới\nđược công bố.\nNhững điều cần nhớ:\nChính sách tài khóa cố gắng ổn định sản lượng gần với tốc độ tăng trưởng GDP bền vững của một nền kinh tế.\nChính sách tài khóa mở rộng hoặc thu hẹp được thực hiện khi GDP tách khỏi mức tăng trưởng GDP tiềm năng\ncủa nền kinh tế. Các kế hoạch chi tiêu vốn của chính phủ có thể mất nhiều năm để xây dựng và thực hiện và\ndo đó, có thể ít ảnh hưởng đến nền kinh tế trong thời gian ngắn.\nMô tả các công cụ của chính sách tài khóa, bao gồm cả ưu điểm và nhược điểm của chúng\nLOS","qhtml":null},{"n":81,"q":"An analyst produces the following joint probability function for two energy stocks, an oil\ncompany (COIL) and a natural gas company (NAGS). The analyst estimates each stock's\nreturn given three possible return scenarios for crude oil and natural gas prices for the coming\nyear:\nThe covariance of the expected returns of COIL and the expected returns of NAGS\nis closest to:","opts":["131.74","134.60","152.22"],"ans":"A","expl":"Các nhà phân tích thường sử dụng dữ liệu lịch sử để dự báo hiệp phương sai của một tập hợp lợi nhuận tài sản. Hiệp phương sai\ncủa các biến là giá trị kỳ vọng của tích của các\nđộ lệch theo cặp của mỗi biến so với giá trị trung bình của nó.\nHiệp phương sai trong tương lai của hai biến ngẫu nhiên (ví dụ: lợi nhuận chứng khoán) có thể được tính\nnếu có thể ước tính hàm xác suất chung. Giá trị kỳ vọng (return)\ncủa mỗi biến, cho từng kịch bản và xác suất của nó , được tính toán trước tiên, sau đó\ncó thể tính hiệp phương sai .\nDo đó, hiệp phương sai của lợi nhuận kỳ vọng của COIL và NAGS là 131,74. Vì đây là số dương\nnên nó cho thấy rằng các cổ phiếu thể hiện sự cùng biến động theo cùng một hướng: lợi nhuận\ncủa cả hai tài sản có xu hướng hoạt động tốt hơn hoặc kém hơn giá trị kỳ vọng của chúng tại cùng một thời điểm\n. Trường hợp này có thể xảy ra vì các công ty hoạt động trong cùng một ngành và\ndo đó có rủi ro hệ thống tương tự nhau.\n(Lựa chọn B) 134,60 là kết quả của việc sử dụng chênh lệch tuyệt đối giữa lợi nhuận kỳ vọng\nvà phương tiện của chúng, làm xu hướng hiệp phương sai tăng lên nếu một trong các giá trị kỳ vọng là âm\nvà giá trị trung bình là dương.\n(Lựa chọn C) 152,22 là kết quả của việc tính trọng số bằng nhau cho các xác suất thay vì tính trọng số cho chúng\ntheo các xác suất cụ thể do nhà phân tích chọn.\nNhững điều cần nhớ:\nHiệp phương sai của phân bố xác suất chung đo lường tính định hướng của mối quan hệ\ngiữa hai biến. Nếu hàm xác suất chung của các biến (ví dụ: lợi nhuận chứng khoán) có thể được ước tính\n, thì có thể tính được hiệp phương sai trong tương lai của hai biến. A\nhiệp phương sai dương cho biết các biến thể hiện sự cùng chuyển động theo cùng một hướng.\nTính toán và giải thích hiệp phương sai và mối tương quan của lợi nhuận danh mục đầu tư bằng cách sử dụng hàm xác suất kết hợp\ncho lợi nhuận\nLOS","qhtml":"<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAuMAAADsCAIAAABR1j8PAAAc6UlEQVR42u3d7XGjzBKG4dapTQCHgEKAECAECAFCECGIEEQIIgQTggjBhGBC8PnxlLtYEJLXX69s3dePrbWNkTygoemeGTYvLy8GAABwk/5HEwAAACIVAAAAIhUAAECkAgAAQKQCAACIVAAAAIhUAAAAiFQAAACRCgAAAJEKAAAgUgEAACBSAQAAIFIBAABEKgAAAEQqAADgLv3511/YbDa0GgAAeLeXl5d/CDz+aWsAAACj+gMAAECkAgAAiFQAAACIVAAAAJEKAAAAkQoAACBSoQkAAACRCgAAAJEKAAAgUgEAACBSAQAARCoAAABEKgAAAEQqAACASAUAAIBIBXeo67rNRWmaDsMwDMNvbYGmabbb7Xa7nf7J4ziO4zjbsqqq6TZpmvZ93/f9dBt9f7PZaJ+zn5pZnud5ntd1fcttUtd1XdcXzoo8z3/350JHNo5j/5PVJrPN2rZ9eHh4eHjYbDZlWZZludyJzoQb/3svH+57OOLvoI7x4eFh2Q/4+TM7hc7uwbc52/N4T7LsTIhUAADAfflDE+A27x31n6enpzAMlxvEcaw7xcfHR/t1+SQzK8tyv9+b2W63091MnudpmprZ6XTyO07dQD89PZlZGIa6xdS/+qY2U/Lp5eVFjVaWpe9Ee9AGx+Px9s+KMAz9T5veBeqsUJvsdrvfd6NsZjoBdrudH76qqnRAD4eDb1yWpVogy7I4js0sSZIsy/ynZqaz6/b7AX387/CIf/AkWSZfx3FUz6Az4XQ66QOl7adtqDMkDEOdZt7Ifs5UVaWdRFFEpIK7/siphzobpujDduOlindr2
