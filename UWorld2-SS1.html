ả định và báo cáo với) kết quả hoạt động được báo cáo của công ty mới hoặc công ty mua lại, với điều kiện là\nrằng tất cả các điều kiện sau đây được đáp ứng:\nVề cơ bản tất cả những người ra quyết định đầu tư đều được tuyển dụng bởi các công ty mới hoặc công ty mua lại.\nchắc chắn. Điều này không chỉ bao gồm các nhà quản lý danh mục đầu tư mà còn cả các nghiên cứu liên quan và\nnhân viên hỗ trợ.\nQuá trình ra quyết định đầu tư phải độc lập (nghĩa là không có sự can thiệp\nbởi công ty mua lại) và về cơ bản còn nguyên vẹn.\nCông ty mới hoặc công ty mua lại phải lưu giữ hồ sơ chứng minh kết quả hoạt động được báo cáo.\nKhông có sự gián đoạn (tức là khoảng trống) trong bản ghi hiệu suất khi chuyển sang bản ghi mới\nchắc chắn. Nếu có thời gian nghỉ, phần trình diễn trước đây vẫn có thể được trình bày nhưng không được liên kết.\nTrong kịch bản này, do Công ty X không giữ lại quyền ra quyết định đầu tư quan trọng của Công ty Y.\nnhân sự, Công ty X không thể liên kết hoạt động trước đây của Công ty Y với hoạt động của chính nó (Lựa chọn B và C).\nNhững điều cần nhớ:\nHoạt động tuân thủ GIPS trước đây có thể được liên kết với một công ty mới hoặc công ty mua lại với điều kiện là\nđáp ứng một số điều kiện nhất định; những điều kiện đó bao gồm việc giữ lại nhân sự, duy trì hồ sơ,\ngiữ nguyên quá trình ra quyết định và không cho phép phá vỡ thành tích thực hiện.\nMô tả các nguyên tắc cơ bản về tuân thủ, bao gồm các khuyến nghị của Tiêu chuẩn GIPS\nliên quan đến định nghĩa về công ty và định nghĩa về quyền tự quyết định của công ty\nLOS","qhtml":null},{"n":22,"q":"Ching Liu, CFA, investor relations manager at Emerald Software (ES), arranges a video\nconference call with a small group of sell-side analysts to discuss confidential company\ndevelopments. On the call, Liu tells the analysts that ES has decided to selectively disclose\ninformation to give the analysts time to think about the company developments before they\nare publicly announced in two days. Liu then tells the analysts that the company had a\ndisagreement with its auditors over revenue recognition policies and as a result, ES has\nchanged auditors.\nBo Wang, CFA, is an analyst on the call and immediately recognizes the negative implications\nthis will have for ES. Wang believes a potential accounting scandal will not only drive down\nthe stock price, but will motivate customers to switch to Ruby Software (RS), ES's largest\ncompetitor. Later that day, Wang calls his best clients and recommends purchase of RS\nwithout mentioning ES. Numerous clients act on this recommendation.\nAccording to Standard II(A) Material Nonpublic Information, it is most likely that:","opts":["no violation occurred.","only Liu violated the Standard.","only Wang violated the Standard."],"ans":"C","expl":"\"Thành viên và Ứng viên sở hữu thông tin quan trọng không công khai\ncó thể ảnh hưởng đến giá trị của khoản đầu tư\nkhông được hành động hoặc khiến người khác hành động theo information.\"\nThông tin quan trọng không công khai theo Tiêu chuẩn II(A) yêu cầu các Thành viên và Ứng viên\nkhông thực hiện các hoạt động đầu tư nếu họ có thông tin quan trọng không công khai (MNI).\nGiao dịch hoặc hành động trên MNI làm xói mòn niềm tin của công chúng vào sự công bằng của thị trường vốn.\nMNI có thể đến từ nhiều nguồn và Thành viên hoặc Ứng viên phải đánh giá thông tin để\nquyết định xem đó có phải là MNI hay không trước khi hành động.\nViệc tiết lộ có chọn lọc (ví dụ: các nhà phân tích trong cuộc gọi hội nghị, người trong nội bộ công ty) không nhất thiết\ncông khai thông tin. Trong câu hỏi này, Ching Liu và ES đã cố ý tiết lộ thông tin\nvà cung cấp cho các nhà phân tích lịch trình thời điểm thông tin đó sẽ được phổ biến công khai.\nLoại tiết lộ có chọn lọc này không vi phạm Tiêu chuẩn (Lựa chọn A và B).\nTuy nhiên, bằng việc đồng ý trở thành một phần của nhóm được chọn nhận thông tin, Bo Wang có nghĩa vụ\ngiữ bí mật thông tin này cho đến khi nó được tiết lộ công khai bởi công ty. Thậm chí\nmặc dù Wang không trực tiếp tiết lộ MNI nhưng anh ta đã vi phạm Tiêu chuẩn khi sử dụng\nkiến thức của mình về MNI để tác động đến người khác hành động dựa trên thông tin này. Hoạt động dựa trên MNI\nkhông bị giới hạn nghiêm ngặt đối với chứng khoán của công ty đó (ví dụ: ES), mọi giao dịch dựa trên MNI đều là\nvi phạm Tiêu chuẩn .\nNhững điều cần nhớ:\nThông tin quan trọng không công khai theo tiêu chuẩn II(A) yêu cầu Thành viên và Ứng viên không được thực hiện các giao dịch bằng cách sử dụng thông tin quan trọng không công khai (MNI). MNI có thể đến từ\nnhiều nguồn, bao gồm cả quản lý công ty. Bất kỳ giao dịch nào dựa trên MNI đều vi phạm\nTiêu chuẩn.\nXác định hành vi phù hợp với Quy tắc và Tiêu chuẩn cũng như hành vi vi phạm Quy tắc và\nTiêu chuẩn\nLOS","qhtml":null},{"n":23,"q":"Chen Hong, CFA, is an independent investment advisor. Through a referral from an existing\nclient, Chen contacts Zhao Qiuping. Chen briefly meets with Zhao, who is leaving for vacation\nthe next day. Zhao agrees to be Chen's client and sends him money that is currently in her\nsavings account. They are not able to discuss the details of Zhao's financial circumstances\nand objectives at the meeting, but Zhao tells Chen that he can invest the money however he\nsees fit and agrees that they will meet again to create a detailed investment policy statement\nwhen Zhao returns.\nChen invests a portion of Zhao's funds in several stocks of companies that Chen has invested\nin other clients' funds, since Chen believes the stock prices will increase and Chen does not\nwant Zhao to miss out. By the time Zhao returns, her investment portfolio is up 4%. With\nregards to Zhao's investments, Chen:","opts":["was in full compliance with the Standards.","violated the Standards by not getting approval from Zhao for each investment.","violated the Standards by investing Zhao's funds before gathering appropriate information."],"ans":"C","expl":"\"Khi Thành viên và Ứng viên có mối quan hệ tư vấn với khách hàng,\nhọ phải:…\nA. Không chính xác vì Đưa ra yêu cầu hợp lý về khoản đầu tư của khách hàng hoặc khách hàng tiềm năng\nkinh nghiệm, mục tiêu rủi ro và lợi nhuận cũng như các hạn chế tài chính trước khi\nđưa ra bất kỳ đề xuất đầu tư nào hoặc thực hiện hành động đầu tư và\nphải đánh giá lại và cập nhật thông tin này thường xuyên.\nB. Không chính xác vì Xác định rằng khoản đầu tư phù hợp với tình hình tài chính của khách hàng\nvà nhất quán với các mục tiêu, nhiệm vụ và ràng buộc bằng văn bản của khách hàng\ntrước đó. đưa ra khuyến nghị đầu tư hoặc thực hiện hành động đầu tư.\"\nTính phù hợp của Tiêu chuẩn III(C) yêu cầu các Thành viên và Ứng viên là cố vấn phải\nđánh giá đúng mức độ phù hợp của từng khoản đầu tư tiềm năng cho từng khách hàng trước khi đưa ra\nquyết định đầu tư. Để làm điều này, trước tiên cố vấn phải thu thập thông tin về\nmục tiêu đầu tư cụ thể, các hạn chế và khả năng chấp nhận rủi ro của từng khách hàng. Thông tin này được sử dụng để phát triển\ntuyên bố chính sách đầu tư (IPS), sau đó được sử dụng để phát triển chương trình đầu tư\nthích hợp cho khách hàng.\nNếu không thu thập và hiểu thông tin thích hợp, cố vấn không có cách nào để biết\nbiết liệu các khoản đầu tư cụ thể có đáp ứng tiêu chí về sự phù hợp với khách hàng hay không.\nDo đó, đầu tư tài sản của khách hàng trước khi thu thập thông tin thích hợp\nvi phạm Tiêu chuẩn . Trong trường hợp này, Chen đầu tư tài sản của Zhao trước khi nhận được\nthông tin về hoàn cảnh và mục tiêu tài chính của Zhao. Mặc dù Zhao nói sẽ\nđầu tư tài sản của mình theo cách mà Chen thấy phù hợp, nhưng Chen không có cách nào để biết liệu khoản đầu tư đó\ncó phù hợp với Zhao hay không. Do đó, Chen đã vi phạm Tiêu chuẩn (Lựa chọn A) .\n(Lựa chọn B) Các Thành viên và Ứng viên không cần sự chấp thuận của khách hàng đối với mọi khoản đầu tư\ncụ thể để tuân thủ Tiêu chuẩn. Sau khi IPS được tạo, cố vấn có thể đầu tư trong\ngiới hạn của IPS mà không cần phê duyệt cho mỗi khoản đầu tư.\nNhững điều cần nhớ:\nTính phù hợp của Tiêu chuẩn III(C) yêu cầu các Thành viên và Ứng viên là cố vấn phải\nđánh giá chính xác tính phù hợp của từng khoản đầu tư tiềm năng cho từng khách hàng trước khi đưa ra quyết định đầu tư\n. Không có IPS thì không thể xác định được sự phù hợp. Do đó, việc đầu tư\ntài sản của khách hàng trước khi IPS được phát triển là vi phạm Tiêu chuẩn.\nĐánh giá các thông lệ, chính sách và hành vi liên quan đến Quy tắc đạo đức và tiêu chuẩn của Viện CFA\nỨng xử chuyên nghiệp\nLOS","qhtml":null},{"n":24,"q":"Aline Costa, CFA, is a financial advisor for Solar Bank. At a conference, Costa meets Juanita\nCarvalho, a portfolio manager for Lunar Financial. Carvalho tells Costa about a propriety\nquantitative model developed by Lunar that aims to predict interest rate changes. Costa reads\nLunar's sales literature on the model to understand how it works, its assumptions, and its\ntesting parameters, which included both extreme positive and negative scenarios. Of the\nfollowing, Costa can most appropriately begin integrating the model into her research process:","opts":["immediately.","after thoroughly testing the model herself.","after taking the time to learn the technical aspects of the model."],"ans":"B","expl":"\"Thành viên và Ứng viên phải:\n1. Thực hiện sự siêng năng, độc lập và kỹ lưỡng trong\nphân tích đầu tư, đưa ra khuyến nghị đầu tư,\nvà thực hiện các hành động đầu tư.\n2. Có cơ sở hợp lý và đầy đủ, được hỗ trợ bởi\nnghiên cứu và điều tra phù hợp, cho bất kỳ phân tích, đề xuất hoặc hành động đầu tư nào.\"\nCơ sở siêng năng và hợp lý theo tiêu chuẩn V(A) yêu cầu các Thành viên và Ứng viên là cố vấn\n tiến hành thẩm định kỹ lưỡng khi phân tích các khoản đầu tư. Tiêu chuẩn\nyêu cầu thẩm định kỹ lưỡng các mô hình định lượng cũng kỹ lưỡng như tất cả các khía cạnh\nkhác của quy trình khuyến nghị đầu tư. Thành viên hoặc Ứng viên phải:\nhiểu cách thức hoạt động của mô hình và có thể giải thích nó cho khách hàng,\nhiểu các giả định và hạn chế của mô hình và\nkiểm tra kỹ lưỡng mô hình.\nNgay cả khi mô hình đã được các nhà phát triển bên thứ ba thử nghiệm, các Thành viên và Ứng viên\nnên kiểm tra mô hình trước khi đưa nó vào quy trình nghiên cứu của họ hoặc\nđề xuất. Điều này đảm bảo rằng mô hình đã được kiểm tra đúng cách (Lựa chọn A). Dữ liệu được sử dụng\ntrong thử nghiệm phải bao gồm tất cả các kỳ vọng về hiệu suất và độ biến động.\n(Lựa chọn C) Các nhà phát triển mô hình phải hiểu tất cả các khía cạnh kỹ thuật của mô hình\n(ví dụ: phương trình, biến). Tuy nhiên, người dùng không bắt buộc phải có hiểu biết sâu\nmiễn là họ hiểu các giả định và hạn chế của nó cũng như có thể\ngiải thích mô hình cho khách hàng.\nNhững điều cần nhớ:\nKhi Thành viên và Ứng viên sử dụng mô hình định lượng như một phần trong quy trình đầu tư của họ,\nTiêu chuẩn yêu cầu quá trình thẩm định mô hình phải kỹ lưỡng như tất cả các khía cạnh khác\ncủa tiến trình. Người dùng mô hình phải hiểu cách mô hình hoạt động đủ tốt để\ngiải thích cho khách hàng và kiểm tra mô hình một cách kỹ lưỡng.\nThể hiện việc áp dụng Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp cho\ncác tình huống liên quan đến vấn đề liêm chính nghề nghiệp\nLOS","qhtml":null},{"n":25,"q":"Whitney Hill, CFA, has notified her manager at Mercury Bank of her plans to leave Mercury and\njoin Saturn Bank in two weeks. Hill is contacted by a potential client, Brewster Payne, looking\nto invest with an investment management firm. Hill is careful not to disclose that she is\nleaving Mercury, though she tells Payne to wait a few weeks and they can revisit the\ndiscussion.\nAfter leaving Mercury and joining Saturn, Hill calls several of Mercury's clients that she is able\nto find contact information for using public records; she does not contact Payne. Assuming\nHill did not sign a noncompete agreement with Mercury, did she violate the Code and\nStandards?","opts":["No.","Yes, by not trying to recruit Payne for Mercury.","Yes, by soliciting existing Mercury clients after joining Saturn."],"ans":"B","expl":"\"Trong các vấn đề liên quan đến việc làm của mình, các Thành viên và Ứng viên\nphải hành động vì lợi ích của người sử dụng lao động và không tước đoạt quyền lợi của họ\nngười sử dụng lao động tận dụng lợi thế về kỹ năng và khả năng của họ, tiết lộ\nthông tin bí mật hoặc gây tổn hại cho người sử dụng lao động của họ.\"\nMức độ trung thành theo Tiêu chuẩn IV(A) yêu cầu Thành viên và Ứng viên phải bảo vệ lợi ích của mình\nngười sử dụng lao động. Khi dự định rời khỏi nhà tuyển dụng, Thành viên và Ứng viên phải tiếp tục\nhành động vì lợi ích tốt nhất của người sử dụng lao động hiện tại của họ. Điều này bao gồm việc tuyển dụng các ứng viên tiềm năng\nkhách hàng cho người sử dụng lao động hiện tại và không liên lạc với khách hàng của người sử dụng lao động và khách hàng tiềm năng\nkhách hàng với mục đích mời chào kinh doanh cho hoạt động kinh doanh độc lập của riêng họ hoặc hoạt động kinh doanh khác\nchắc chắn.\nSau khi rời khỏi nhà tuyển dụng, Thành viên hoặc Ứng viên có thể liên hệ với người tuyển dụng cũ của họ\nkhách hàng của chủ lao động, miễn là thông tin liên hệ được tìm thấy bằng cách sử dụng hồ sơ công khai (ví dụ:\ninternet) chứ không phải từ hồ sơ là tài sản của công ty cũ. Ngoài ra, Thành viên hoặc\nỨng viên phải đảm bảo rằng họ không có thỏa thuận không cạnh tranh với ứng viên cũ\nngười sử dụng lao động sẽ cấm họ liên lạc với khách hàng của người sử dụng lao động cũ.\nTrong trường hợp này, Whitney Hill vi phạm Tiêu chuẩn khi không cố gắng tuyển dụng Brewster Payne cho\nNgân hàng Thủy Ngân. Bằng cách yêu cầu Payne đợi một vài tuần trước khi xem lại cuộc trò chuyện (lúc\nkhi nào cô ấy sẽ ở Ngân hàng Sao Thổ), cô ấy không hành động vì lợi ích tốt nhất của Sao Thủy và\ndo đó vi phạm Tiêu chuẩn, mặc dù cô ấy không cố gắng tuyển dụng Payne làm khách hàng cho\ncông ty mới của cô ấy (Lựa chọn A) .\n(Lựa chọn C) Vì Hill không ký thỏa thuận không cạnh tranh nên cô ấy không vi phạm Tiêu chuẩn\nbằng cách sử dụng hồ sơ công khai để liên hệ với khách hàng của Mercury sau khi rời đi.\nNhững điều cần nhớ:\nMức độ trung thành theo Tiêu chuẩn IV(A) yêu cầu Thành viên và Ứng viên phải bảo vệ lợi ích của mình\nngười sử dụng lao động. Khi dự định rời khỏi nhà tuyển dụng, Thành viên hoặc Ứng viên phải tiếp tục hành động\nvì lợi ích tốt nhất của người sử dụng lao động của họ. Sau khi rời khỏi nhà tuyển dụng, Thành viên hoặc Ứng viên có thể\nliên hệ với khách hàng của chủ lao động cũ của họ nếu thông tin liên hệ được tìm thấy bằng hồ sơ công khai\nvà họ không có thỏa thuận không cạnh tranh.\nGiải thích cách thực hành, chính sách và hành vi vi phạm Quy tắc của Viện CFA\nĐạo đức và tiêu chuẩn ứng xử chuyên nghiệp\nLOS","qhtml":null},{"n":26,"q":"Alexander Petrov, CFA, regularly posts investment ideas and videos on several popular social\nmedia investment forums. Petrov has developed a sizable following that often immediately\nreacts to his recommendations.\nPetrov buys a significant number of shares in a micro-cap mining stock. He then posts to his\nfollowers on several social media platforms that he has a large position in this stock. Petrov\nthen starts a rumor stating that \"the company is likely to be acquired at a substantial premium\nto the current price in the near future.\" The stock immediately jumps 20% and Petrov sells\nmost of his shares over the rest of the trading day.\nAccording to Standard II(B) Market Manipulation, Petrov most likely violated the Standard by:","opts":["starting a rumor.","selling his shares.","buying before his followers."],"ans":"A","expl":"\"Thành viên và Ứng viên không được tham gia vào các hoạt động\nbóp méo giá hoặc thổi phồng khối lượng giao dịch một cách giả tạo với\nmục đích đánh lừa thị trường người tham gia.\"\nThao túng thị trường theo Tiêu chuẩn II(B) nghiêm cấm các hoạt động của Thành viên hoặc Ứng viên\nbóp méo giá chứng khoán. Thao túng có thể xảy ra thông qua:\ncác hoạt động dựa trên thông tin , chẳng hạn như phát tán tin đồn sai sự thật hoặc\ncác hoạt động dựa trên giao dịch , chẳng hạn như giao dịch quá mức giữa hai tài khoản.\nViệc thao túng có thể dẫn đến mất niềm tin vào sự công bằng và liêm chính của thị trường.\nMục đích của Thành viên hoặc Ứng viên xác định xem họ có vi phạm Tiêu chuẩn hay không.\nCác hành động làm thay đổi giá chứng khoán nhưng không nhằm mục đích đánh lừa những người tham gia thị trường sẽ không\nvi phạm Tiêu chuẩn.\nTrong trường hợp này, Alexander Petrov đã vi phạm Tiêu chuẩn bằng cách cố tình phát tán tin đồn\ngiả để thao túng giá cổ phiếu. Hành vi của Petrov là một ví dụ điển hình về kế hoạch\n\"bơm và đổ\", trong đó ai đó tích lũy một lượng cổ phiếu được giao dịch ít và do đó dễ dàng\nthao túng cổ phiếu, bịa đặt một câu chuyện để tăng giá, sau đó bán số cổ phiếu đó cho\ncác nhà đầu tư mới \"mua\" câu chuyện và cổ phiếu.\n(Lựa chọn B và C) Việc mua trước chứng khoán không phải là vi phạm về việc công bố công khai một\nvị trí hoặc bán cổ phiếu sau khi cổ phiếu tăng giá. Hành vi vi phạm tập trung vào\ný định thao túng của Petrov bằng cách lan truyền tin đồn nhằm tăng giá cổ phiếu\nmột cách giả tạo.\nNhững điều cần nhớ:\nThao tác thị trường tiêu chuẩn II(B) nghiêm cấm các hoạt động\ndựa trên thông tin và giao dịch làm sai lệch giá chứng khoán. Mục đích của hành động là yếu tố quyết định\nliệu Thành viên hoặc Ứng viên có vi phạm Tiêu chuẩn hay không.\nXác định hành vi phù hợp với Quy tắc và Tiêu chuẩn cũng như hành vi vi phạm Quy tắc và\nTiêu chuẩn\nLOS","qhtml":null},{"n":27,"q":"Latha Mani, CFA, manages an index fund with a small-cap growth mandate. The fund is\nowned by Alpha Investments and has thousands of investors. Mani's primary duty of loyalty is\nto:","opts":["the investors in the fund.","operate the fund to its mandate.","Alpha Investments' shareholders."],"ans":"B","expl":"\"Các Thành viên và Ứng viên có nghĩa vụ trung thành với khách hàng và\nphải hành động với sự thận trọng hợp lý và đưa ra phán đoán thận trọng.\nCác Thành viên và Ứng viên phải hành động vì lợi ích của khách hàng và\nđặt lợi ích của khách hàng lên trên lợi ích của người chủ hoặc của chính họ\nlợi ích.\"\nTiêu chuẩn III(A) Lòng trung thành, Thận trọng và Quan tâm yêu cầu các Thành viên và Ứng viên phải trung thành với\nkhách hàng của họ và sử dụng sự thận trọng và cẩn thận khi đưa ra quyết định đầu tư đối với khách hàng.\nthay mặt. Bước đầu tiên này là xác định chính xác khách hàng. Đối với các Thành viên và Ứng viên trong một\nvới vai trò tư vấn, khách hàng là nhà đầu tư hoặc người thụ hưởng dịch vụ. Trong trường hợp\nThành viên hoặc Ứng viên là người quản lý quỹ, khách hàng không phải là nhà đầu tư hoặc\nngười thụ hưởng nhưng quỹ đầu tư và nhiệm vụ của nó.\nTrong trường hợp này, Latha Mani quản lý một quỹ chỉ số với nhiệm vụ cụ thể. Mặc dù\nquỹ có nhà đầu tư thì nhà đầu tư đó có quyền tự mình vào, ra khỏi quỹ. Mani là\nkhông phải là cố vấn của họ và do đó không nợ họ lòng trung thành của cô ấy (Lựa chọn A). Mani chắc chắn là vậy\ntrung thành với việc quản lý quỹ theo đúng ủy quyền của mình kể từ khi nhà đầu tư đưa ra quyết định đầu tư\ndựa trên kỳ vọng sử dụng quỹ của Mani để tiếp cận các cổ phiếu tăng trưởng vốn hóa nhỏ.\nĐi chệch khỏi nhiệm vụ đó sẽ làm mất lòng tin của khách hàng.\n(Lựa chọn C) Mặc dù Mani có lòng trung thành với người chủ của mình và các cổ đông, khách hàng hoặc quỹ\nnhà đầu tư được ưu tiên trước người sử dụng lao động. Vì vậy, nghĩa vụ trung thành hàng đầu của Mani là\nphải quản lý quỹ theo nhiệm vụ của mình.\nNhững điều cần nhớ:\nTiêu chuẩn III(A) Lòng trung thành, Thận trọng và Quan tâm yêu cầu các Thành viên và Ứng viên phải trung thành với\nkhách hàng của họ, điều này trước tiên đòi hỏi phải xác định được khách hàng. Trong trường hợp Thành viên hoặc\nỨng viên không phải là cố vấn, khách hàng có thể không phải là tổ chức mà là tổ chức ủy thác đầu tư. trong\ntrong những trường hợp đó, lòng trung thành có được nhờ việc đầu tư quỹ theo nhiệm vụ đó.\nChứng minh việc áp dụng Quy tắc đạo đức và Chuẩn mực ứng xử chuyên nghiệp đối với\ncác tình huống liên quan đến vấn đề liêm chính nghề nghiệp\nLOS","qhtml":null},{"n":28,"q":"Company 1 and Company 2 are close competitors headquartered in different countries.\nCompany 1 reports under IFRS, while Company 2 reports under US GAAP. An analyst gathers\ninformation on two identical long-term assets owned by each company that are being tested\nfor impairment.\nCompany 1 Company 2\n(USD millions)\n(IFRS) (US GAAP)\nCarrying amount 20 20\nSum of undiscounted expected future cash flows 18 18\nSum of discounted expected future cash flows 16 16\nFair value if sold 17 17\nCost to sell 2 2\nBased on this information, which of the following accounting treatments is correct?","opts":["Company 2's impairment loss is USD 2 million.","Company 2's impairment loss is USD 3 million.","Company 1's impairment loss is USD 5 million."],"ans":"B","expl":"Các yếu tố liên quan đến tổn thất do suy giảm giá trị\nIFRS US GAAP\nTài sản bị suy giảm Giá trị ghi sổ > Tối đa [(Giá trị hợp lý − Chi phí để Giá trị ghi sổ > Tổng\nif: sell), Tổng CF chiết khấu] CF không chiết khấu\nLỗ suy giảm Giá trị ghi sổ − Max [(Giá trị hợp lý − Chi phí để ghi sổ − Giá trị hợp lý if\n= bán), Tổng CF chiết khấu] đã bán\nTối đa ghi sổ mới [(Giá trị hợp lý − Chi phí bán), Tổng của\nGiá trị hợp lý nếu được bán\nsố tiền CF chiết khấu]\nMột tài sản bị suy giảm khi giá trị thị trường của nó (tức là số tiền có thể thu hồi) giảm xuống dưới giá trị sổ sách\n(tức là giá trị ghi sổ). Nếu xảy ra suy giảm giá trị, công ty sẽ ghi nhận khoản lỗ\ndo suy giảm giá trị và giảm giá trị còn lại của tài sản. IFRS và US GAAP yêu cầu các giao thức khác nhau\nđể kiểm tra suy giảm giá trị và ước tính tổn thất do suy giảm giá trị. Theo IFRS, số tiền\ncó thể phục hồi là giá trị lớn hơn giữa giá trị hợp lý trừ đi chi phí bán và tổng dòng tiền chiết khấu\n.\nIFRS US GAAP\n20 > [max (17 − 2), 16] 20 > 18\nSuy giảm\n20 > 16 = true, do đó suy giảm = 20 > 18 = đúng, do đó suy giảm =\ntest\ncó có\nSuy giảm\n20 − 16 = 4 20 − 17 = 3\nloss\nTheo GAAP của Hoa Kỳ , số tiền có thể thu hồi là tổng của dòng tiền dự kiến\ntrong tương lai chưa được chiết khấu, là 18 trong kịch bản này. Vì 18 nhỏ hơn giá trị ghi sổ của\n20 nên tài sản bị suy giảm giá trị. Khoản lỗ do suy giảm giá trị là giá trị ghi sổ của tài sản trừ đi giá trị hợp lý\ncủa nó, là 3. Công ty 2 sẽ điều chỉnh giá trị ghi sổ của tài sản thành giá trị hợp lý\nlà 17 và báo cáo khoản lỗ là 3.\n(Lựa chọn A) Theo US GAAP, khoản lỗ do suy giảm giá trị là giá trị ghi sổ trừ đi giá trị hợp lý.\nTổng dòng tiền chưa chiết khấu là chỉ được sử dụng trong kiểm tra suy giảm giá trị.\n(Lựa chọn C) Mất 5 kết quả do Công ty 1 gán sai giá trị có thể thu hồi\nlà giá trị hợp lý trừ đi chi phí bán, nhỏ hơn tổng dòng tiền chiết khấu trong\nkịch bản này.\nNhững điều cần nhớ:\nTheo IFRS, giá trị có thể thu hồi là giá trị lớn hơn giá trị hợp lý ít hơn chi phí bán và\ntổng dòng tiền chiết khấu và tổn thất do suy giảm giá trị là chênh lệch giữa\ngiá trị ghi sổ và giá trị có thể thu hồi được. Theo US GAAP, số tiền có thể thu hồi là tổng của\ndòng tiền dự kiến ​​trong tương lai chưa được chiết khấu và khoản lỗ do suy giảm giá trị là chênh lệch giữa\ngiá trị ghi sổ và giá trị hợp lý. Các luồng tiền trong tương lai được sử dụng để kiểm tra mức độ suy giảm nhưng\nkhông tính toán mức suy giảm.\nGiải thích và đánh giá mức độ suy giảm và ngừng ghi nhận của tài sản, nhà xưởng, thiết bị cũng như\ntài sản vô hình ảnh hưởng đến báo cáo tài chính và các tỷ lệ\nLOS","qhtml":null},{"n":29,"q":"An analyst runs a simple linear regression with 30 observations, and the ANOVA table shows\nthat the sum of squares total (SST) is 26,255. If the correlation between both the dependent\nand independent variables is 0.80, the standard error of the estimate ( s ) is closest to:\ne","opts":["13.69","17.75","18.37"],"ans":"C","expl":"Hồi quy tuyến tính đánh giá mối quan hệ giữa hai hoặc nhiều biến , vẽ một\nđường thẳng phù hợp nhất với dữ liệu, để giải thích sự biến đổi của biến phụ thuộc Y , thường\nđược gọi là tổng bình phương tổng (SST) (tức là SSE + SSR). Một số thước đo được tính từ bảng\nANOVA được sử dụng để đánh giá mức độ phù hợp của phép hồi quy.\n2)\nHệ số xác định ( R đo tỷ lệ thay đổi trong Y được giải thích bởi\n2\nbiến độc lập X . R được tính bằng SSR / SST và bằng bình phương của\ntương quan cặp đôi ( r ) giữa các biến này Trong trường hợp này, r = 0,80 và SST =\n26.255. Do đó:\n2 r2 0,802\nR = = = 0,64\nSSR / SST = 0,64 ⇒ SSR = 0,64 × 26,255 = 16,803\nSSE = SST − SSR ⇒ SSE = 26,255 − 16,803 = 9,452\nSai số chuẩn của ước tính ( s ) đo lường độ chính xác của hồi quy, là\ne\nđược trình bày theo cùng đơn vị với biến phụ thuộc và được tính bằng căn bậc hai của\nsai số bình phương trung bình (MSE). Vì hồi quy có 30 quan sát:\nMSE = SSE / ( n − 2) = 9.452 / 28 = 337,6\ns = √ MSE = √337.6 = 18,37\ne\n2 2\n(Lựa chọn A) 13,69 là kết quả của việc tính R là r (= 0,80) thay vì r (= 0,64).\n(Lựa chọn B) 17,75 là kết quả của việc chia SSE cho n (= 30) thay vì bậc tự do (=\n28).\nNhững điều cần làm hãy nhớ:\nMột số thước đo được tính toán từ bảng ANOVA được sử dụng để đánh giá mức độ phù hợp của hồi quy tuyến tính a\n. Hệ số xác định đo lường tỷ lệ thay đổi\ntrong Y được giải thích bởi X . Sai số chuẩn của ước tính được tính bằng căn bậc hai của sai số bình phương trung bình\nMô tả việc sử dụng phân tích phương sai (ANOVA) trong hồi quy. phân tích, diễn giải kết quả ANOVA\nđồng thời tính toán và diễn giải sai số chuẩn của Ước tính trong hồi quy tuyến tính đơn giản\nLOS","qhtml":null},{"n":30,"q":"Which of the following is least likely to be a challenge to deepening regional trade integration?\nA member country's:","opts":["fiscal credibility.","mobility of labor and capital.","preference not to negotiate through the World Trade Organization."],"ans":"C","expl":"Những thách thức trong việc tăng cường hội nhập thương mại khu vực\nSự khác biệt về văn hóa/lịch sử Các cuộc chiến tranh và xung đột trước đây có thể làm phức tạp thêm những cân nhắc về chính trị và xã hội\n tiến trình hội nhập\nSự độc lập hạn chế của Thương mại tự do và sự di chuyển tự do của lao động và vốn khác với a\nchính sách kinh tế các chính sách ưa thích của các thành viên\nCác chính sách nhằm vào các điều kiện kinh tế vĩ mô lành mạnh và tài chính\nĐộ tin cậy kinh tế vĩ mô khác nhau\nniềm tin bị lung lay khi một quốc gia thành viên có nợ và/hoặc các điều kiện chậm\n\ntăng trưởng\nLoại khối thương mại khu vực mà một nhóm quốc gia tham gia một phần phụ thuộc vào\nmức độ thoải mái và tin cậy giữa mỗi quốc gia về các điều khoản của thỏa thuận.\nCác quốc gia thành viên hướng tới thương mại tự do hơn bằng cách giảm bớt các rào cản thương mại với nhau,\ndẫn đến phân bổ nguồn lực hiệu quả hơn.\nHình thành một khối thương mại với một nhóm nhỏ các quốc gia đơn giản hơn, nhanh chóng hơn và\nvề mặt chính trị ít gây tranh cãi hơn so với việc tham gia vào các cuộc đàm phán thương mại đa phương trong Tổ chức Thương mại Thế giới\n( WTO ). WTO đàm phán và hình thành các quy tắc thương mại, phần lớn là giữa\ncác quốc gia phát triển và đã bị chỉ trích vì tạo ra các quy tắc thương mại bất lợi cho\ncác nước đang phát triển.\nCác nước đang phát triển đã phải đối mặt với các cuộc đàm phán gây tranh cãi với WTO về những mối quan ngại\ncụ thể của họ. Các thỏa thuận thương mại của WTO thường mất nhiều năm để ký kết và có thể dẫn đến kết quả dưới mức trung bình\nđối với một số quốc gia. Vì vậy, người ta ưu tiên hướng tới tự do hóa thương mại song phương và đa phương\nở quy mô nhỏ hơn, điều này sẽ hiệu quả hơn so với đàm phán thông qua\n WTO.\nHội nhập khu vực có thể được coi là một bước hướng tới thương mại tự do hơn. Tuy nhiên, quá trình\ntừ một hiệp định thương mại tự do (FTA) đến hội nhập sâu hơn phải đối mặt với những thách thức:\nViệc một quốc gia thành viên thiếu độ tin cậy tài chính hoặc các điều kiện kinh tế vĩ mô khác nhau có thể\ngây căng thẳng cho sự hợp tác với các thành viên khác và có thể, trong trường hợp liên minh tiền tệ,\nngăn một quốc gia có vấn đề sử dụng sự phá giá tiền tệ để điều chỉnh\nsự mất cân bằng (Lựa chọn A) .\nThương mại tự do và sự di chuyển không giới hạn của lao động và vốn có thể cản trở các chính sách nhằm\nhạn chế giá cả hoặc số lượng tương đối trong một quốc gia (Lựa chọn B).\nNhững điều cần nhớ:\nCác cân nhắc lịch sử, sự thiếu tin cậy về tài chính của một quốc gia thành viên và các khía cạnh tiêu cực\ncủa phong trào tự do lao động và vốn là những ví dụ về những thách thức đối với việc tăng cường\nhội nhập thương mại khu vực.\nGiải thích động lực và lợi thế của các khối thương mại, thị trường chung và liên minh kinh tế\nLOS","qhtml":null},{"n":31,"q":"An analyst gathers the following information pertaining to a company's fixed assets at its three\nmanufacturing sites:\n(in € millions) Site 1 Site 2 Site 3\nGross fixed assets 600 1,100 1,250\nAccumulated depreciation 200 500 1,000\nAnnual depreciation expense 100 200 250\nThe assets are depreciated using straight-line method with no residual value. Based only on\nthis information, which site should replace its asset base the soonest ?","opts":["Site 1","Site 2","Site 3"],"ans":"C","expl":"Chỉ số tuổi là một loại tỷ lệ tài sản cố định bao gồm tổng thời gian hữu dụng ước tính,\ntuổi trung bình của tài sản và thời gian hữu dụng còn lại. Các số liệu này có thể cho biết thời gian mà một\ncông ty sẽ phải chi tiêu vốn để thay thế các tài sản đã cũ.\nĐể xác định cơ sở nào có nhiều khả năng thay thế cơ sở tài sản nhất trước tiên, hãy tìm địa điểm có tài sản\ncó thời gian sử dụng hữu ích trung bình còn lại ngắn nhất. Thời gian sử dụng hữu ích còn lại là tỷ lệ giữa\ntài sản cố định ròng trên chi phí khấu hao định kỳ.\nTrong trường hợp này, Cơ sở 3 có cơ sở tài sản cố định lâu đời nhất chỉ còn 1 năm thời gian sử dụng hữu ích\n, trong khi Cơ sở 1 và 2, tương ứng, có thời gian sử dụng hữu ích còn lại là 4 và 3 (Lựa chọn A\nvà B) . Do đó, Địa điểm 3 cần được thay thế tài sản nhiều nhất.\nNhững điều cần nhớ:\nSố liệu về tuổi đời có thể cho biết thời gian một công ty sẽ phải chịu chi phí vốn để thay thế các tài sản\nđã cũ. Các tài sản có thời gian sử dụng hữu ích ít nhất có nhiều khả năng sẽ được thay thế.\nThời gian sử dụng hữu ích còn lại là tỷ lệ tài sản cố định ròng trên chi phí khấu hao định kỳ.\nPhân tích và giải thích các thông tin tiết lộ trong báo cáo tài chính về tài sản, nhà xưởng, thiết bị và\ntài sản vô hình\nLOS","qhtml":null},{"n":32,"q":"Under IFRS, at the inception of a lease, a lessee would most appropriately record a(n):","opts":["expense equal to the average periodic lease payment.","long-term asset equal to the present value of lease payments.","long-term liability equal to the total amount of future lease payments."],"ans":"B","expl":"Tác động của báo cáo tài chính đến bên thuê\nSố dư\nTiêu chuẩn quản trị Báo cáo thu nhập Báo cáo lưu chuyển tiền tệ\nsheet\nGiảm hợp đồng thuê\ntrách nhiệm pháp lý: CFF\nIFRS: tất cả hợp đồng thuê Khấu hao tài sản Thanh toán lãi:\nUS GAAP: thuê tài chính Nợ lãi IFRS: CFF hoặc\nCFO\nUS GAAP: CFO\nTài sản Hoa Kỳ Thanh toán toàn bộ chi phí thuê:\nGAAP: hợp đồng thuê hoạt động Mục trách nhiệm CFO\nTrong hợp đồng cho thuê, bên thuê thanh toán định kỳ cho bên cho thuê để có quyền sử dụng tài sản\ntrong một khoảng thời gian xác định. Theo IFRS, tất cả các hợp đồng thuê đều được xử lý giống như việc mua tài sản được tài trợ\nbằng vốn vay (tương tự như việc xử lý các hợp đồng thuê tài chính theo US GAAP). Khi bắt đầu,\nbên thuê ghi lại trên bảng cân đối kế toán tài sản và nợ dài hạn bằng với giá trị hiện tại\ncủa các khoản thanh toán tiền thuê trong tương lai (Lựa chọn C) . Bên thuê khấu hao tài sản trong\nthời hạn của hợp đồng thuê.\nCác khoản thanh toán tiền thuê định kỳ được chia thành các khoản thanh toán lãi và giảm trách nhiệm pháp lý\nmỗi kỳ. Về mặt này, hợp đồng thuê về mặt khái niệm rất giống với việc khấu hao một\nkhoản vay dài hạn.\n(Lựa chọn A) Theo US GAAP, số tiền thanh toán tiền thuê định kỳ trung bình trong hợp đồng thuê hoạt động\nđược ghi nhận là chi phí mỗi kỳ trên báo cáo kết quả hoạt động kinh doanh. Hợp đồng thuê hoạt động\nđược coi giống như hợp đồng cho thuê.\nNhững điều cần nhớ:\nTheo IFRS, tất cả các hợp đồng thuê đều được coi như mua tài sản được tài trợ bằng vốn vay. Khi\nbắt đầu, bên thuê ghi lại tài sản và nợ dài hạn bằng giá trị hiện tại của các khoản thanh toán tiền thuê trong tương lai\n. Tài sản được khấu hao định kỳ trong suốt thời hạn của hợp đồng thuê,\nvà các khoản thanh toán tiền thuê định kỳ được phân chia thành các khoản thanh toán lãi và giảm trách nhiệm pháp lý\nmỗi kỳ.\nGiải thích báo cáo tài chính của hợp đồng thuê từ quan điểm của bên cho thuê và bên thuê\nLOS","qhtml":null},{"n":33,"q":"Two AUD 50,000 investments have a 3-year term. One compounds quarterly at a stated\nannual rate of 2.00%. The other compounds at a continuous rate of 1.75%. The difference in\ntheir future values (in AUD) at the end of 3 years is closest to:","opts":["364","389","540"],"ans":"B","expl":"Giá trị tương lai của khoản đầu tư đầu tiên có thể được tính bằng cách sử dụng công thức cho nhiều\nkỳ gộp mỗi năm. Giá trị hiện tại là 50.000 AUD và lãi suất hàng năm được nêu là\n2,00%. Lãi kép hàng quý ngụ ý 4 mỗi năm × 3 năm = 12 kỳ lãi kép ( N =\n3 và m = 4).\nGiá trị tương lai của khoản đầu tư khác có thể được tính bằng cách sử dụng công thức lãi kép liên tục\n. Lãi suất hàng năm được công bố là 1,75% và tất cả các giá trị khác đều giống như giá trị của khoản đầu tư đầu tiên\n. Hai giá trị và sự chênh lệch giữa chúng được tính như sau:\nChênh lệch giữa các giá trị tương lai là 388,76, có thể làm tròn thành 389.\n(Lựa chọn A) 364 là kết quả của việc tính giá trị tương lai của khoản đầu tư đầu tiên mà không cần\nđiều chỉnh số kỳ gộp lãi—thực tế là giả định lãi kép hàng năm.\n(Lựa chọn C) 540 là kết quả của việc giả định nhầm rằng việc gộp lãi liên tục có các khoảng thời gian gộp\nriêng biệt và sau đó sử dụng cùng tần suất gộp lãi cho cả hai\nđầu tư.\nNhững điều cần nhớ:\nGiá trị tương lai của khoản đầu tư ban đầu phụ thuộc vào việc lãi suất gộp là\nliên tục hay rời rạc. Trong trường hợp gộp rời rạc, hãy điều chỉnh tần suất\nlặp lãi.\nTính toán và giải thích các thước đo lợi nhuận hàng năm và lợi nhuận gộp liên tục, đồng thời\nmô tả cách sử dụng thích hợp của chúng\nLOS","qhtml":null},{"n":34,"q":"Which of the following is most appropriate for analyzing and interpreting unstructured, non-\ntextual data?","opts":["Tag cloud","Network graph","Trend visualization"],"ans":"B","expl":"Dữ liệu phi cấu trúc thường yêu cầu xử lý chuyên biệt trước khi có thể sử dụng để lập mô hình\nvà phân tích. Xu hướng, bảng và biểu đồ rất hữu ích trong việc trực quan hóa dữ liệu có cấu trúc truyền thống,\ntrong khi các nhà khoa học dữ liệu đang sử dụng các kỹ thuật được phát triển gần đây để trực quan hóa dữ liệu\nthay thế.\nMột ví dụ về trực quan hóa được sử dụng cho dữ liệu phi cấu trúc là biểu đồ mạng : một đồ họa\ntương tác dùng để diễn giải dữ liệu thông qua dạng hình học của trực quan hóa. Các ví dụ khác là bản đồ nhiệt\nvà sơ đồ cây.\n(Lựa chọn A) Đám mây thẻ, trong đó các từ được định cỡ và hiển thị dựa trên tần suất của\nmỗi từ trong tập dữ liệu, là một kỹ thuật trực quan hóa có thể áp dụng cho dữ liệu văn bản. Kỹ thuật\nnày không áp dụng cho các tệp dữ liệu phi văn bản.\n(Lựa chọn C) Dữ liệu phi cấu trúc yêu cầu các kỹ thuật trực quan hóa chuyên dụng để được phân tích\nđúng cách. Chỉ dữ liệu có cấu trúc, truyền thống mới có thể được hiển thị trực quan từ hoạt động phân tích cơ bản bằng cách sử dụng xu hướng,\nbảng và biểu đồ.\nNhững điều cần nhớ:\nCác nhà khoa học dữ liệu phân tích dữ liệu thay thế hoặc dữ liệu phi cấu trúc phải sử dụng các kỹ thuật mới\ncho phép hình ảnh hóa chuyên biệt các tập dữ liệu lớn này. Đồ họa tương tác cho phép\ntrực quan hóa hình học dữ liệu bao gồm bản đồ nhiệt, sơ đồ cây và biểu đồ mạng.\nCác tập dữ liệu văn bản cũng thường lớn và phải được phân tích theo cách phù hợp với\nbản chất phi cấu trúc của chúng.\nMô tả các ứng dụng của Dữ liệu lớn và Khoa học dữ liệu trong quản lý đầu tư\nLOS","qhtml":null},{"n":35,"q":"Which of the following \"signposts\" most likely indicates a strong warning of geopolitical risk to\na portfolio?","opts":["Political turnover during a period of worsening employment.","Rapidly declining exports in a country with a pegged currency regime.","Market environment moves from risk-on to risk-off with no identifiable cause."],"ans":"B","expl":"Các hành động dựa trên biển báo về rủi ro danh mục đầu tư\nRủi ro về khả năng xảy ra, vận tốc hoặc tác động Cần hành động\nThấp Không cần hành động\nTrung bình Cần thận trọng hơn hoặc chuẩn bị sẵn sàng\nCao Cân nhắc triển khai kế hoạch hành động\nCác nhà quản lý xem xét sự kết hợp giữa các điều kiện thị trường kinh tế và tài chính như những cảnh báo\nhoặc biển chỉ dẫn về những rắc rối tiềm ẩn . Biển chỉ dẫn là một yếu tố hoặc sự kết hợp của nhiều yếu tố dựa trên\ncác giả định chính của kịch bản đầu tư dự kiến ​​và xác suất liệu kịch bản\n đó có thành hiện thực hay không. Do đó, biển chỉ dẫn là một chỉ báo cho biết liệu khả năng xảy ra,\ntốc độ hoặc tác động của rủi ro có tăng lên hay không và liệu hành động đầu tư có cần thiết hay không.\nKhi một loại tiền tệ được cố định hoặc gắn với một loại tiền tệ chính khác , xuất khẩu\ngiảm nhanh chóng sẽ là một dấu hiệu cho các khoản đầu tư bằng đồng tiền được cố định. Xuất khẩu\ngiảm nhanh có thể sẽ:\ngiảm thu nhập xuất khẩu, làm cạn kiệt dự trữ ngoại hối của đất nước.\ndẫn đến mất giá tiền tệ, góp phần gây áp lực lạm phát.\nbuộc ngân hàng trung ương phải duy trì tỷ giá hối đoái cố định.\nlà một yếu tố dẫn đến suy thoái kinh tế.\nKể từ khi đầu tư có mệnh giá bằng đồng tiền cố định sẽ được thực hiện dựa trên\nmột số giả định nhất định về giá trị của đồng tiền cố định, bao gồm khối lượng xuất khẩu, một\nbiển báo được tạo khi khối lượng đó thay đổi đáng kể.\n(Lựa chọn A) Thông thường, doanh thu trong vai trò lãnh đạo chính trị xảy ra theo các sự kiện\nđã lên lịch (ví dụ: bầu cử) hoặc do một sự kiện cụ thể theo quốc gia (ví dụ: sự từ chức đột ngột của chính phủ top\nchính thức). Sự thay đổi chính trị xảy ra trong tất cả các phần của chu kỳ kinh tế và do đó\nkhông hữu ích như một biển chỉ dẫn. Thay vào đó, các nhà đầu tư nên tìm kiếm những thay đổi về chính sách để hướng dẫn các quyết định của danh mục đầu tư\n.\n(Lựa chọn C) Khi môi trường thị trường chuyển sang trạng thái chấp nhận rủi ro hoặc không chấp nhận rủi ro, người quản lý danh mục đầu tư\nphải xác định nguyên nhân trước khi xác định (các) hành động đầu tư cần thực hiện. Những chuyển động\ncó thể là kết quả của các yếu tố kỹ thuật hoặc sự thay đổi trong tâm lý.\nNhững điều cần nhớ:\nCác giả định được sử dụng để dự đoán hiệu suất đầu tư bắt nguồn từ\nsự kết hợp nhất định của các điều kiện thị trường kinh tế và tài chính. Những thay đổi trong các điều kiện đó và\ncác giả định thu được sau đó đóng vai trò là dấu hiệu cho thấy rủi ro đang thay đổi, giúp các nhà quản lý\nphân biệt giữa rủi ro địa chính trị thực sự và các sự kiện ít đe dọa hơn.\nMô tả tác động của rủi ro địa chính trị đối với các khoản đầu tư\nLOS","qhtml":null},{"n":36,"q":"When the price currency is trading at a forward premium to the base currency, it is most\nlikely that the:","opts":["forward points are positive.","price currency is expected to appreciate against the base currency.","interest rate for the price currency is higher than for the base currency."],"ans":"B","expl":"Khi lãi suất phi rủi ro của hai quốc gia khác nhau, tỷ giá hối đoái kỳ hạn giữa\ntiền tệ của họ sẽ khác với tỷ giá hối đoái giao ngay (tức là hiện tại). Báo giá ngoại hối\nchỉ định số lượng đơn vị tiền tệ giá có thể mua được cho mỗi đơn vị tiền tệ cơ sở.\nKhi tỷ giá kỳ hạn là:\nthấp hơn tỷ giá giao ngay, loại tiền tệ giá đang giao dịch ở mức cao hơn kỳ hạn so với tiền cơ sở\ntiền tệ cơ sở.\nlớn hơn tỷ giá giao ngay, đồng tiền định giá đang giao dịch ở mức chiết khấu kỳ hạn so với cơ sở\ntiền tệ.\nTín hiệu cộng thêm kỳ hạn cho thấy những người tham gia thị trường kỳ vọng giá\ntiền tệ sẽ tăng giá so với tiền tệ cơ sở: trong tương lai, một đơn vị tiền tệ cơ sở\nsẽ mua được tiền tệ có giá thấp hơn so với hiện nay vì tiền tệ định giá đã trở nên\ncó giá trị hơn tiền tệ cơ sở. Chiết khấu kỳ hạn báo hiệu rằng đồng tiền định giá\ndự kiến sẽ giảm giá so với đồng tiền cơ sở.\n(Lựa chọn A) Khi đồng tiền định giá đang giao dịch ở mức chênh lệch kỳ hạn, tỷ giá kỳ hạn thấp hơn\ntỷ giá giao ngay và điểm kỳ hạn là âm .\n(Lựa chọn C) Khi đồng tiền định giá giao dịch ở mức phí kỳ hạn, lãi suất của nó phải\nnhỏ hơn lãi suất của đồng tiền cơ sở. Đồng tiền có lãi suất thấp hơn giao dịch\nvới mức phí kỳ hạn.\nNhững điều cần nhớ:\nTỷ giá kỳ hạn phản ánh kỳ vọng về giá trị tiền tệ trong tương lai dựa trên lãi suất: khi\nlãi suất phi rủi ro của hai quốc gia khác nhau, tỷ giá hối đoái kỳ hạn sẽ khác với\ntỷ giá giao ngay. Khi tỷ giá kỳ hạn thấp hơn tỷ giá giao ngay, điều đó báo hiệu rằng những người tham gia thị trường\nkỳ vọng đồng tiền định giá sẽ tăng giá so với đồng tiền cơ sở.\nGiải thích mối quan hệ chênh lệch giá giữa tỷ giá hối đoái giao ngay và kỳ hạn cũng như lãi suất,\ntính tỷ giá kỳ hạn bằng cách sử dụng điểm hoặc theo tỷ lệ phần trăm và diễn giải chiết khấu kỳ hạn hoặc\npremium\nLOS","qhtml":null},{"n":37,"q":"A portfolio manager gathers the following information about a portfolio:\nBonds Stocks Real Estate\nExpected return 4% 8% 2%\nPortfolio weight 35% 50% 15%\nCovariance Matrix\nBonds Stocks Real Estate\nBonds 80 100 45\nStocks 100 300 185\nReal estate 45 185 180\nIf the benchmark has an expected return of 6% and standard deviation of 12.5%, based on\nonly this information, the portfolio's risk is most likely :","opts":["less than the benchmark's.","the same as the benchmark's.","more than the benchmark's."],"ans":"B","expl":"Phương sai của danh mục đầu tư phụ thuộc vào trọng số của từng tài sản trong danh mục đầu tư,\nphương sai riêng của chúng và hiệp phương sai giữa mỗi cặp tài sản . Càng nhiều tài sản\ntrong danh mục đầu tư thì càng tồn tại nhiều tương tác giữa các tài sản và\nviệc tính toán sẽ tìm ra phương sai của danh mục đầu tư càng phức tạp hơn.\nMa trận hiệp phương sai cung cấp phương sai cho từng tài sản (tức là hiệp phương sai của mỗi tài sản với\n2)\nchính nó), cũng như hiệp phương sai cho từng cặp tài sản tài sản. Ví dụ: phương sai ( σ cho\ntrái phiếu là 80 và hiệp phương sai giữa trái phiếu và cổ phiếu là 100. Trong trường hợp này, mỗi\ntrọng số của tài sản và ma trận hiệp phương sai được cung cấp, do đó, phương sai của danh mục đầu tư có thể được\ntính toán bằng phương trình sau:\n2 (0,352 (0,502) (0,152\nσ (R ) = × 80) + × 300) + × 180)\np\n+ (2 × 0,35 × 0,50 × 100) + (2 × 0,50 × 0,15 × 185) + (2 × 0,35\n× 0,15 × 45) ≈ 156,3\nĐộ lệch chuẩn của danh mục đầu tư là 12,5% (= √156,3). Vì độ lệch chuẩn\ncủa danh mục đầu tư giống với độ lệch chuẩn của điểm chuẩn nên danh mục đầu tư và điểm chuẩn\ncó cùng rủi ro (Lựa chọn A và C) .\nNhững điều cần nhớ:\nPhương sai của danh mục đầu tư phụ thuộc vào trọng số của từng tài sản trong danh mục đầu tư,\nphương sai riêng lẻ của tài sản và hiệp phương sai giữa mỗi cặp tài sản. Ma trận hiệp phương sai\ncung cấp phương sai cho từng tài sản cũng như hiệp phương sai cho từng cặp tài sản.\nTính toán và giải thích giá trị kỳ vọng, phương sai, độ lệch chuẩn, hiệp phương sai và\nmối tương quan của lợi nhuận danh mục đầu tư\nLOS","qhtml":"<p>A portfolio manager gathers the following information about a portfolio:</p><table class=\"qtable\"><thead><tr><th></th><th>Bonds</th><th>Stocks</th><th>Real Estate</th></tr></thead><tbody><tr><td>Expected return</td><td>4%</td><td>8%</td><td>2%</td></tr><tr><td>Portfolio weight</td><td>35%</td><td>50%</td><td>15%</td></tr></tbody></table><p>Covariance Matrix:</p><table class=\"qtable\"><thead><tr><th></th><th>Bonds</th><th>Stocks</th><th>Real Estate</th></tr></thead><tbody><tr><td>Bonds</td><td>80</td><td>100</td><td>45</td></tr><tr><td>Stocks</td><td>100</td><td>300</td><td>185</td></tr><tr><td>Real estate</td><td>45</td><td>185</td><td>180</td></tr></tbody></table><p>If the benchmark has an expected return of 6% and standard deviation of 12.5%, based on only this information, the portfolio's risk is most likely:</p>"},{"n":38,"q":"A retailer has a sales contract to:\ndeliver 40 machines for €90,000 to the customer's site on January 1, 20X1, and\nprovide annual maintenance services for three years, for a total of €6,000. The first\nservice is scheduled for December 20, 20X1.\nThe customer pays the full transaction price of €96,000 on January 31, 20X1.\nIn November 20X1, the retailer postpones the first scheduled maintenance service by 20 days,\nand the customer agrees. The correct amount of total revenue (in €) the retailer should\nreport for 20X1 is closest to:","opts":["90,000","92,000","96,000"],"ans":"A","expl":"Đơn đăng ký năm bước để ghi nhận doanh thu\n1. Xác định (các) hợp đồng với khách hàng.\n2. Xác định các nghĩa vụ thực hiện riêng biệt hoặc riêng biệt trong hợp đồng.\n3. Xác định giá giao dịch.\n4. Phân bổ giá giao dịch cho các nghĩa vụ thực hiện hợp đồng.\n5. Ghi nhận doanh thu khi thực thể đáp ứng nghĩa vụ thực hiện.\nBan Chuẩn mực Kế toán Quốc tế và Ban Chuẩn mực Kế toán Tài chính\nquy định một ứng dụng gồm 5 bước để chuẩn hóa quy trình ghi nhận doanh thu. Khi hợp đồng\nbán hàng có nhiều nghĩa vụ thực hiện thì giá phải được chỉ định cho từng nghĩa vụ.\nBước 5 quy định rằng người bán phải đáp ứng nghĩa vụ thực hiện để ghi nhận (tức là kiếm được)\ndoanh thu liên quan.\nTrong trường hợp này, hợp đồng có hai nghĩa vụ thực hiện riêng biệt: giao hàng và\nbảo trì. Vào năm 20X1, người bán đã giao máy nhưng không thể cung cấp\nbảo trì kịp thời. Do đó, nó chỉ có thể nhận ra 90.000 € để giao hàng trong\n20X1. Khi nhà bán lẻ thực hiện dịch vụ bảo trì đầu tiên, được hoãn lại đến tháng 1\n20X2, họ có thể ghi nhận doanh thu €2.000 (= €6.000 / 3 năm).\n(Lựa chọn B) €92.000 [= 90.000 + (6.000 / 3)] sẽ là tổng doanh thu được ghi nhận cho\n20X1 có nhà bán lẻ đã thực hiện bảo trì theo lịch trình lần đầu tiên đúng hạn.\n(Lựa chọn C) €96.000 là tổng giá giao dịch cho hợp đồng. Mặc dù nhà bán lẻ\nđã nhận được 96.000 euro tiền mặt trong năm 20X1 nhưng họ chỉ kiếm được 90.000 euro từ việc giao máy. Số\n€6.000 còn lại sẽ được ghi nhận theo thời gian khi nhà bán lẻ hoàn thành nghĩa vụ bảo trì của mình.\nNhững điều cần nhớ:\nKhi hợp đồng bán hàng có nhiều nghĩa vụ thực hiện, mỗi nghĩa vụ phải được\nhoàn thành để ghi nhận doanh thu tương ứng.\nMô tả các nguyên tắc chung về ghi nhận doanh thu, các ứng dụng ghi nhận doanh thu cụ thể và\ný nghĩa của các lựa chọn ghi nhận doanh thu cho phân tích tài chính\nLOS","qhtml":null},{"n":39,"q":"A developing market country that targets its currency exchange rate to the USD experiences a\nsudden period of high inflation due to country-specific supply chain pressures. Meanwhile, the\nUS experiences only mild inflation.\nThe immediate outcome and central bank response is most likely that the developing country's\ncurrency:","opts":["depreciates and its central bank should buy the US dollar.","depreciates and its central bank should buy the domestic currency.","appreciates and its central bank should sell the domestic currency."],"ans":"B","expl":"Một quốc gia thị trường đang phát triển có thể áp dụng chính sách tiền tệ nhằm vào mục tiêu\ntỷ giá hối đoái của tiền tệ thay vì nhắm tới một mức lạm phát cụ thể trong nước. Như vậy\nchính sách nhắm mục tiêu đặt ra một mức hoặc biên độ cho tỷ giá hối đoái của nó so với một loại tiền tệ chính trong\nhy vọng đạt được mức lạm phát của một nền kinh tế phát triển ổn định hơn, thường là\nthấp hơn. Ngân hàng trung ương của nước đang phát triển duy trì mục tiêu này bằng cách\ntích cực mua hoặc bán đồng nội tệ của mình .\nTrong kịch bản này, nước đang phát triển đã trải qua lạm phát cao, làm mất giá trị đồng tiền\ntiền tệ, trong khi Mỹ chỉ có lạm phát nhẹ. Nếu đồng tiền của nước đang phát triển có tỷ giá tự do\ntỷ giá hối đoái thả nổi, nó sẽ mất giá so với đồng đô la Mỹ.\nĐể ngừng khấu hao thêm, ngân hàng trung ương của nước đang phát triển nên\nbán dự trữ USD (tức là ngoại tệ) và mua tiền tệ của chính mình (Lựa chọn A).\nViệc mua bán này sẽ làm giảm cung tiền trong nước bằng cách lấy đi đồng nội tệ\ntuần hoàn. Điều này sẽ dẫn đến sự gia tăng lãi suất mà cuối cùng sẽ\ngiảm lạm phát trong nước. Lãi suất cao hơn cũng sẽ thu hút vốn nước ngoài và tăng\ncầu về tiền tệ của nước đang phát triển, dẫn đến việc đồng tiền bị đánh giá lại.\n(Lựa chọn C) Nếu tỷ lệ lạm phát của nước đang phát triển thấp hơn lạm phát của Mỹ thì nước đó\ntiền tệ sẽ tăng giá so với USD. Trong trường hợp này, trung tâm của nước đang phát triển\nngân hàng nên bán tiền tệ của mình và mua USD. Đây không phải là kịch bản ở đây.\nNhững điều cần nhớ:\nĐối với một nước đang phát triển sử dụng mục tiêu tỷ giá hối đoái, lạm phát trong nước lớn hơn mức\nlạm phát của đồng tiền mục tiêu sẽ gây áp lực giảm giá lên đồng nội tệ. Bảo trì\ntỷ giá hối đoái mục tiêu đòi hỏi ngân hàng trung ương phải mua đồng nội tệ.\nMô tả phẩm chất của các ngân hàng trung ương hiệu quả; đối chiếu việc họ sử dụng lạm phát, lãi suất và\nnhắm mục tiêu tỷ giá hối đoái trong chính sách tiền tệ mở rộng hoặc thu hẹp; và mô tả\nhạn chế của chính sách tiền tệ\nLOS","qhtml":null},{"n":40,"q":"An analyst is testing the returns generated by a portfolio manager. The mean return from\nsamples drawn by the analyst was 5%, but the analyst suspects that the manager's actual\nreturns are 4%. After applying a hypothesis test, the analyst rejects the null hypothesis. The\nanalyst's most appropriate conclusion is that the manager's mean return is:","opts":["equal to 4%.","not equal to 4%.","not equal to 5%."],"ans":"C","expl":"Thử nghiệm giả thuyết yêu cầu giả thuyết không và giả thuyết thay thế. Giả thuyết null\nlà điều đang được thử nghiệm ; nếu giá trị rỗng bị bác bỏ , giả thuyết\nthay thế được chấp nhận .\nTrong câu hỏi này, bằng chứng duy nhất của nhà phân tích là mẫu cho thấy lợi nhuận trung bình là\n5%. Mặc dù nhà phân tích nghi ngờ mức trung bình thực sự thấp hơn, nhưng việc kiểm tra giả thuyết nên kiểm tra\nkết quả thực tế của mẫu: giá trị rỗng không thể liên quan đến việc kiểm tra \"nghi ngờ\" của nhà phân tích rằng\ntrung bình thực sự là 4% vì không có gì khác ngoài \"sự nghi ngờ\" của nhà phân tích để hỗ trợ\nnó (Lựa chọn A và B) .\nThử nghiệm giả thuyết thích hợp là một kiểm tra hai mặt. Giá trị rỗng là lợi nhuận trung bình bằng\n5%, trong khi lựa chọn thay thế là không bằng 5%:\nH : μ = 5% (null)\n0\nH : μ ≠ 5% (alternative)\na\nNếu có đủ bằng chứng bác bỏ giá trị rỗng giả thuyết, kết luận đúng là\nlợi nhuận của người quản lý không bằng 5%, chứ không phải chúng bằng một số giá trị khác. Nếu\nnhà phân tích bác bỏ giả thuyết không, thì quy trình thích hợp là nhà phân tích sẽ thu thập\nthêm bằng chứng để kiểm tra xem lợi nhuận trên thực tế có bằng 4 hay không.\nNhững điều cần nhớ:\nTrong thử nghiệm giả thuyết, giả thuyết không là những gì được kiểm tra và giả thuyết thay thế được\nchấp nhận nếu giả thuyết không bị bác bỏ. Quy ước là xây dựng các giả thuyết sao cho\nphương án thay thế phản ánh điều kiện \"đúng\". Nếu giả thuyết không bị bác bỏ thì giả thuyết\nthay thế là số liệu thống kê không bằng tham số giả thuyết hoặc lớn hơn hoặc\nnhỏ hơn tham số chứ không phải tham số đó bằng một số giá trị cụ thể khác.\nGiải thích việc kiểm tra giả thuyết và các thành phần của nó, bao gồm ý nghĩa thống kê, lỗi Loại I và Loại II\nvà sức mạnh của thử nghiệm.\nLOS","qhtml":null},{"n":41,"q":"A cheese producer competes by creating a differentiated, high-quality cheese that sells for a\npremium price in the very crowded local retail cheese market. The market structure that this\ncheese producer operates in is best described as:","opts":["oligopoly.","perfect competition.","monopolistic competition."],"ans":"C","expl":"Cạnh tranh độc quyền là một cấu trúc thị trường được đặc trưng bởi nhiều\nđối thủ cạnh tranh bán các sản phẩm khác biệt và có rào cản gia nhập thấp. Những\ncác công ty này cạnh tranh về giá cả, chất lượng, tiếp thị và/hoặc địa điểm.\nCác sản phẩm hoặc chiến lược đổi mới có thể cho phép các công ty trong cạnh tranh độc quyền tạm thời\nđạt được mức lợi nhuận trên mức trung bình. Những khoản thu nhập trên mức trung bình này được gọi\nlà lợi nhuận kinh tế. Trong các thị trường cạnh tranh độc quyền, lợi nhuận kinh tế nhanh chóng\nbị xóa bỏ bởi nhiều đối thủ cạnh tranh hiện tại hoặc bởi các đối thủ cạnh tranh mới, được cho phép bởi\nrào cản gia nhập thấp.\n(Lựa chọn A) Độc quyền nhóm có ít đối thủ cạnh tranh, cung cấp các sản phẩm đồng nhất (ví dụ: dầu thô),\nvà có rào cản gia nhập cao.\n(Lựa chọn B) Hoàn hảo thị trường cạnh tranh được đặc trưng bởi các sản phẩm đồng nhất,\nrào cản gia nhập thấp và các công ty không có quyền kiểm soát giá thị trường (tức là người chấp nhận giá).\nNhững điều cần nhớ:\nCạnh tranh độc quyền là một cấu trúc thị trường được đặc trưng bởi nhiều đối thủ cạnh tranh bán\ncác sản phẩm khác biệt và có rào cản gia nhập thấp. Các công ty này cạnh tranh về giá,\nchất lượng, tiếp thị và/hoặc địa điểm.\nMô tả các đặc điểm của cạnh tranh hoàn hảo, cạnh tranh độc quyền, độc quyền nhóm và\nđộc quyền\nLOS","qhtml":null},{"n":42,"q":"A developed market economy's central bank announces a 100bps decrease in its official\ninterest rate. All else equal, which of the following will be the most likely outcome?","opts":["Stock prices fall.","Exports increase.","The country's currency appreciates."],"ans":"B","expl":"Đại diện của Cơ chế truyền tải tiền tệ\nChính sách tiền tệ của ngân hàng trung ương được truyền đi khắp nền kinh tế theo một loạt\nsự kiện và những phản hồi. Trong kịch bản này, ngân hàng trung ương giảm đáng kể tỷ lệ chính sách\nđể kích thích nền kinh tế và thúc đẩy đầu tư. Các phản ứng có thể xảy ra bao gồm:\nCác ngân hàng sẽ phản hồi bằng cách giảm lãi suất tham chiếu, qua đó họ thiết lập lãi suất cho vay\nđối với khách hàng. Do đó, các cá nhân và doanh nghiệp có thể vay nhiều hơn.\nGiá tài sản (bao gồm cả cổ phiếu) và giá trị của các dự án vốn có thể sẽ tăng , do\ntỷ lệ chiết khấu được sử dụng để tính toán dòng tiền trong tương lai (Lựa chọn A) giảm.\nNiềm tin sẽ tăng lên cùng với kỳ vọng rằng lãi suất thấp hơn sẽ dự báo tương lai mạnh mẽ hơn\ntăng trưởng và lợi nhuận tăng.\nĐồng nội tệ sẽ giảm giá trị khi tiền \"nóng\" theo sau\nlãi suất ở nơi khác cao hơn (Lựa chọn C) . Điều này cho phép các nhà sản xuất trong nước bán hàng hóa và\ndịch vụ ở thị trường nước ngoài với giá thấp hơn, cạnh tranh hơn, dẫn đến tăng\nxuất khẩu .\nNhìn chung, mức tăng trong tiêu dùng, vay mượn và giá tài sản có thể sẽ làm tăng tổng cầu\n. Nhu cầu mạnh hơn có thể làm tăng giá trong nước. Điều này, cùng với giá nhập khẩu\ncao hơn (do đồng nội tệ mất giá), có thể gây áp lực lên\nlạm phát thực tế.\nNhững điều cần nhớ:\nChính sách tiền tệ của ngân hàng trung ương được truyền tải khắp nền kinh tế theo một chuỗi các sự kiện và phản hồi\n. Khi một ngân hàng trung ương giảm lãi suất chính sách, nó đang cố gắng\nkích thích nền kinh tế trong nước. Đồng nội tệ mất giá, làm cho\nhàng hóa trong nước rẻ hơn ở thị trường nước ngoài và dẫn đến tăng xuất khẩu.\nMô tả các công cụ được sử dụng để thực hiện các công cụ chính sách tiền tệ và cơ chế truyền tải tiền tệ\nvà giải thích mối quan hệ giữa chính sách tiền tệ và tăng trưởng kinh tế,\nlạm phát, lãi suất và tỷ giá hối đoái\nLOS","qhtml":null},{"n":43,"q":"An analyst calculates the following ratios for a company to assess performance over time:\nRatio 20X4 20X5 20X6\nDebt-to-equity 0.42 0.35 0.33\nDebt-to-EBITDA 4.12 3.18 3.04\nWorking-capital turnover 0.64 0.59 0.54\nFixed-asset turnover 0.25 0.18 0.16\nPrice-to-book 8.41 8.05 7.85\nPrice-to-earnings 12.52 11.12 10.79\nBased on this information only, the analyst can most appropriately conclude that the\ncompany's:","opts":["solvency position has improved.","operation has increased efficiency.","stock is more expensive relative to fundamentals."],"ans":"A","expl":"Các nhà phân tích có thể sử dụng phân tích tỷ lệ tài chính tích hợp để đánh giá hiệu quả hoạt động của công ty\nvề mặt hoạt động hoặc hiệu quả, tính thanh khoản, khả năng thanh toán, lợi nhuận và định giá.\nTỷ lệ hoạt động đo lường mức độ hiệu quả của một công ty sử dụng tài sản của mình.\nTỷ lệ thanh khoản đo lường mức độ một công ty có thể trang trải các khoản nợ ngắn hạn\nnghĩa vụ bằng tiền mặt hoặc tài sản dễ dàng chuyển đổi thành tiền mặt.\nTỷ lệ khả năng thanh toán đo lường khả năng của công ty trong việc đáp ứng các nghĩa vụ dài hạn.\nTỷ lệ lợi nhuận đo lường lợi nhuận trên doanh thu và lợi tức đầu tư của công ty.\nTỷ lệ định giá đo lường giá cổ phiếu của một công ty so với các nguyên tắc cơ bản của nó.\nTrong kịch bản này, khả năng thanh toán, được đo bằng tỷ lệ nợ trên vốn chủ sở hữu (Nợ / Vốn chủ sở hữu) và tỷ lệ nợ trên vốn chủ sở hữu.\nEBITDA (Nợ / EBITDA), đã được cải thiện. Xu hướng giảm ở cả hai tỷ lệ cho thấy\nrằng công ty đã giảm nợ tồn đọng so với vốn chủ sở hữu và EBITDA.\n(Lựa chọn B) Hiệu quả (tức là hoạt động), được đo bằng vòng quay vốn lưu động (Doanh thu / Ròng\nvốn lưu động) và vòng quay tài sản cố định (Doanh thu/Tài sản cố định), đã trở nên tồi tệ hơn. Cả hai tỷ lệ\nđang có xu hướng giảm dần theo thời gian, cho thấy công ty đã trở nên kém hiệu quả hơn trong việc sử dụng\ntài sản của mình để tạo ra doanh thu.\n(Lựa chọn C) Giá cổ phiếu đã trở nên rẻ hơn theo thời gian so với giá của công ty\ncác nguyên tắc cơ bản, được biểu thị bằng giá trên sổ sách (P/B) và giá trên thu nhập (P/E) giảm dần\ntỷ lệ ở đây. Điều này cho thấy rằng các nhà đầu tư trả ít hơn cho cổ phiếu so với giá trị của công ty.\nthu nhập và giá trị sổ sách.\nNhững điều cần nhớ:\nTỷ lệ hoạt động đo lường mức độ hiệu quả của một công ty sử dụng tài sản của mình để tạo ra doanh thu. Thanh khoản\ntỷ lệ đo lường mức độ một công ty có thể trang trải các nghĩa vụ ngắn hạn của mình bằng tài sản lưu động.\nTỷ lệ khả năng thanh toán đo lường khả năng của công ty trong việc đáp ứng các nghĩa vụ dài hạn. Khả năng sinh lời\ntỷ lệ đo lường lợi nhuận trên doanh thu và lợi tức đầu tư của công ty. Tỷ lệ định giá\nđo lường mức giá cổ phiếu so với các nguyên tắc cơ bản của công ty.\nTính toán và giải thích các tỷ lệ hoạt động, tính thanh khoản, khả năng thanh toán và khả năng sinh lời\nLOS","qhtml":null},{"n":44,"q":"A portfolio holds the following stocks:\nStock Return (%)\nStock 1 6.00\nStock 2 5.20\nStock 3 −3.75\nStock 4 4.90\nStock 5 6.85\nStock 6 −0.50\nStock 7 2.25\nIf an analyst is choosing stocks that are only in the third and fourth quintiles of returns for this\nportfolio, which of the following stocks is the least appropriate choice?","opts":["Stock 2","Stock 4","Stock 7"],"ans":"C","expl":"Số lượng được sử dụng để đánh dấu phân bố thành các phần chứa số lượng quan sát\nbằng nhau. Một ví dụ là phân vị , thiết lập tỷ lệ phần trăm của các quan sát\ntrong phân bố nằm bằng hoặc thấp hơn giá trị ngưỡng được chỉ định (ví dụ: phân vị thứ 90 có nghĩa là\n90% giá trị trong phân phối nằm ở hoặc dưới quan sát đó). Ranh giới của lượng tử\nđược tìm kiếm thường không khớp với quan sát chính xác trong phân bố, do đó, vị trí\nphải được ước tính bằng phép nội suy tuyến tính.\nCác lượng tử khác có thể được xác định bằng cách sử dụng phân vị. Ví dụ: nhóm ngũ phân vị (tức là phần năm) xuất hiện ở\nnhóm thứ 80, thứ 100\nthứ 20, 40, 60 và phân vị:\nnhóm thứ 1: > 0 và ≤ phân vị thứ 20\nnhóm thứ 2: > thứ 20 đến 40 phân vị\nnhóm thứ 3: > phân vị thứ 40 đến 60\nnhóm thứ 4: > phân vị thứ 60 đến 80\nnhóm thứ 5: > phân vị thứ 80 đến 100\nTrong trường hợp này, nhà phân tích quan tâm đến lợi nhuận ở nhóm thứ ba và thứ tư (tức là\nquan sát trên phân vị thứ 40 và bằng hoặc dưới phân vị thứ 80). Bạn có thể lấy kết quả này\nbằng cách sắp xếp kết quả trả về theo thứ tự tăng dần, sau đó xác định hai vị trí\nthứ 4\ntương ứng với điểm đầu của nhóm thứ 3 và điểm cuối của nhóm thứ 3.\nLợi nhuận hàng tồn kho được sắp xếp theo giá trị tăng dần:\nTính vị trí của từng phần trăm:\nLưu ý rằng 3,2% đánh dấu phân vị thứ 40, trong khi 6,4% đại diện cho phân vị thứ 80. Vì\nkhông có lợi nhuận thực tế nào từ danh mục đầu tư tương ứng với các lợi nhuận này, nên hãy sử dụng phép nội suy tuyến tính để\ntìm lợi nhuận tương ứng cho mỗi phân vị:\nCác cổ phiếu có lợi nhuận ở nhóm thứ ba và thứ tư—trên phân vị thứ 40 và\nở hoặc dưới phân vị thứ 80—có lợi nhuận lớn hơn 2,78% và nhỏ hơn 6,34%. Các cổ phiếu\ntrong phạm vi đó là Cổ phiếu 1, 2 và 4, như được minh họa bằng phần tô bóng trong bảng\nở trên. Đây là những lựa chọn phù hợp nhất cho nhà phân tích (Lựa chọn A và B).\nCác cổ phiếu 3, 5, 6 và 7 không phù hợp vì chúng không đáp ứng được tiêu chí.\nNhững điều cần nhớ:\nSố lượng được sử dụng để sắp xếp các phân phối thành các phần chứa số lượng\nquan sát bằng nhau. Trong nhiều trường hợp, phân vị sẽ không chính xác bằng giá trị của một quan sát,\nvì vậy, phép nội suy tuyến tính được sử dụng để giải quyết phân vị mong muốn.\nTính toán, giải thích và đánh giá các thước đo về xu hướng trung tâm và vị trí để giải quyết\nvấn đề đầu tư\nLOS","qhtml":null},{"n":45,"q":"In a market structured as monopolistic competition, which of the following most likely allows\nfirms to establish some pricing power?","opts":["Customer loyalty","Homogenous products","High barriers to entry and exit"],"ans":"A","expl":"Cạnh tranh độc quyền là một cấu trúc thị trường có đặc điểm là có nhiều người mua và người bán,\ncung cấp các sản phẩm tương tự nhưng hơi khác biệt (Lựa chọn B) . Vì các sản phẩm gần như\nsản phẩm thay thế nên các công ty sử dụng nhiều chiến lược phi giá khác nhau để tạo sự khác biệt cho sản phẩm của mình.\nMột chiến lược như vậy là quảng cáo, giúp các công ty thuyết phục người tiêu dùng rằng sản phẩm của họ\nkhác biệt với sản phẩm của đối thủ cạnh tranh. Chiến lược này có thể xây dựng lòng trung thành và sự ưa thích của khách hàng\nđối với các sản phẩm cụ thể trong môi trường cạnh tranh. Do đó, các công ty có thể tạo ra một mức độ\nsức mạnh định giá nào đó bằng cách sử dụng các chiến lược quảng cáo và phi giá cả để phân biệt các sản phẩm\ncủa họ.\n(Lựa chọn C) Rào cản gia nhập cao là đặc điểm của cấu trúc thị trường độc quyền hoặc thị trường độc quyền\n; một thị trường có cấu trúc như cạnh tranh độc quyền có rào cản gia nhập thấp và\nnhiều người tham gia.\nNhững điều cần nhớ:\nCạnh tranh độc quyền được đánh dấu bởi nhiều công ty trong một thị trường cho phép gia nhập và\nra dễ dàng, với các sản phẩm là sản phẩm thay thế gần gũi. Do đó, các công ty có khả năng kiểm soát giá hạn chế do\nlựa chọn của người tiêu dùng và các công ty cố gắng tạo ra một mức độ sức mạnh định giá nào đó bằng cách sử dụng các chiến lược quảng cáo\nvà phi giá cả để tạo sự khác biệt cho sản phẩm của họ.\nGiải thích mối quan hệ cung và cầu trong cạnh tranh độc quyền, bao gồm\ngiá và sản lượng tối ưu cho các công ty cũng như chiến lược định giá\nLOS","qhtml":null},{"n":46,"q":"An analyst suspects a company of manipulating its financials. A trend that could most\nlikely be a warning sign is:","opts":["declining inventory turnover over multiple periods.","receivables decreasing as a percentage of total revenue.","a net-income-to-cash-from-operating-activities ratio consistently below 1."],"ans":"A","expl":"Dấu hiệu cảnh báo phổ biến về thao túng kế toán\nThường xuyên đưa tin “bất ngờ”\nCác mục \"không định kỳ\" xuất hiện liên tục trong nhiều khoảng thời gian\nMức độ bất thường của các khoản phải thu, phải trả, vòng quay hàng tồn kho, dòng tiền hoạt động, ròng\nthu nhập, tỷ suất lợi nhuận\nĐánh giá thấp chi phí bảo hành được “trình bày lại” ở các kỳ tiếp theo\nThời gian hữu dụng của tài sản dài hạn khác với mức trung bình của ngành\nGiao dịch với các bên liên quan\nNhấn mạnh vào thu nhập theo quy định (không phải GAAP, không phải IFRS)\nCác tiêu chuẩn báo cáo tài chính (ví dụ: IFRS, US GAAP) mang lại cho công ty quyền quyết định và linh hoạt\nthông tin tài chính mà họ trình bày, điều này có thể dẫn đến việc các công ty thao túng\ntài chính. Các nhà phân tích phải cảnh giác với các dấu hiệu cảnh báo về sự thao túng, điều này cần được\nđược phân tích sâu hơn.\nMột dấu hiệu cảnh báo tiềm ẩn là tỷ lệ vòng quay hàng tồn kho giảm dần qua nhiều\nthời kỳ. Tỷ lệ vòng quay hàng tồn kho cung cấp một dấu hiệu về hiệu quả của một công ty\nđang quản lý hàng tồn kho của mình. Mặc dù tỷ lệ giảm có thể đơn giản là do lượng hàng tồn kho kém\nquản lý, nó cũng có thể báo hiệu rằng công ty đang cố tình không nhận ra\nlỗi thời để tránh ghi giảm trong kỳ hiện tại. Tuy nhiên, điều này có thể dẫn đến\nghi giảm hàng tồn kho trong các kỳ tương lai.\n(Lựa chọn B) Các khoản phải thu đang tăng theo tỷ lệ phần trăm trên tổng doanh thu có thể là kết quả của\nquản lý tín dụng kém hoặc áp dụng các chính sách kế toán mạnh mẽ để ghi nhận doanh thu sớm,\nchẳng hạn như \"nhồi nhét kênh\" (tức là giao sản phẩm cho nhà phân phối trước nhu cầu của khách hàng).\n(Lựa chọn C) Tỷ lệ thu nhập ròng trên tiền từ hoạt động kinh doanh luôn ở mức trên 1 có thể là\nmột dấu hiệu cảnh báo về tài chính có chất lượng thấp hơn hoặc bị thao túng. Trong khi xu hướng này có thể là do\ntính chu kỳ của hoạt động kinh doanh, nó cũng có thể chỉ ra rằng công ty đang sử dụng mạnh mẽ\nchính sách kế toán để ghi nhận doanh thu sớm hoặc trì hoãn việc ghi nhận chi phí.\nNhững điều cần nhớ:\nCác chuẩn mực báo cáo tài chính cho phép các công ty có toàn quyền quyết định về thông tin tài chính mà họ\ntrình bày với các nhà đầu tư và tính linh hoạt trong cách trình bày, cho phép phát huy tiềm năng\nthao túng. Một dấu hiệu cảnh báo tiềm ẩn là tỷ lệ vòng quay hàng tồn kho giảm, có thể\nbáo hiệu rằng công ty cố tình không nhận ra sự lỗi thời của hàng tồn kho để tránh ghi-\nthăng trầm.\nMô tả các dấu hiệu cảnh báo kế toán và phương pháp phát hiện hành vi thao túng thông tin trong\nbáo cáo tài chính\nLOS","qhtml":null},{"n":47,"q":"An analyst estimates the probability that:\na carbon tax will be enacted is 0.40.\noil prices will fall given that a carbon tax is enacted is 0.75.\neither a carbon tax will be enacted or oil prices will fall is 0.80.\nThe probability that oil prices will fall is closest to:","opts":["0.10","0.40","0.70"],"ans":"C","expl":"Quy tắc cộng cho xác suất được sử dụng để tính xác suất xảy ra ít nhất một trong\nhai sự kiện , A hoặc B . Khi các sự kiện độc lập, đây là tổng của P ( A ) +\nP ( B ). Tuy nhiên, khi các sự kiện không độc lập, có khả năng cả hai sự kiện\ncó thể xảy ra (tức là xác suất chung). Xác suất chung P ( AB ) phải được trừ khỏi tổng\ncủa các xác suất riêng lẻ.\nVì giá dầu giảm có liên quan đến việc áp thuế nên có khả năng cả hai sự kiện\ncó thể xảy ra. Xác suất giá dầu giảm khi áp dụng thuế là 0,75.\nSử dụng quy tắc xác suất chung, xác suất cả giá dầu giảm VÀ việc áp dụng\nthuế là 0,75 × 0,40 = 0,30.\nTrong câu hỏi này, P (giá dầu giảm HOẶC thuế carbon được ban hành) được đưa ra là 0,80. Phép tính\nsử dụng quy tắc cộng được hiển thị bên dưới (công thức được sắp xếp lại ở dòng thứ hai để tách\nbiến không xác định):\n(Lựa chọn A) 0,10 là do chỉ định sai công thức được sắp xếp lại bằng cách trừ đi\nxác suất chung thay vì cộng nó.\n(Lựa chọn B) 0,40 là kết quả của việc không trừ đi xác suất chung của cả hai sự kiện.\nNhững điều cần nhớ:\nQuy tắc cộng cho xác suất được sử dụng để tính xác suất xảy ra ít nhất một trong hai\nsự kiện. Khi các sự kiện không độc lập, xác suất chung của cả hai sự kiện\nphải được trừ khỏi tổng xác suất riêng lẻ của một trong hai sự kiện để tránh\ntính hai lần.\nXây dựng bài toán đầu tư dưới dạng cây xác suất và giải thích việc sử dụng các kỳ vọng có điều kiện\ntrong ứng dụng đầu tư\nLOS","qhtml":null},{"n":48,"q":"A company's fiscal year ends December 31. Which of the following events most likely creates\na noncurrent liability? The company:","opts":["reports accounting income less than its taxable income.","is paid in March for a service to be provided next January.","issues debt at a premium, which is partially amortized in the first year."],"ans":"C","expl":"Một khoản nợ tài chính (ví dụ: khoản vay ngân hàng, trái phiếu phải trả) đáo hạn sau:\n12 tháng trở xuống được phân loại là nợ ngắn hạn.\nnhiều hơn 12 tháng được phân loại là nợ ngắn hạn , nhưng phần hiện tại\n(tức là bất kỳ số tiền nào đáo hạn trong 12 tháng tới) là nợ hiện tại.\nKhi một công ty phát hành nợ ở mức cao hơn (tức là cao hơn mệnh giá) hoặc ở mức chiết khấu (tức là thấp hơn\nmệnh giá của nó), phí bảo hiểm (chiết khấu) được ghi lại trên bảng cân đối kế toán và sau đó\nkhấu hao, tăng (giảm) số tiền lãi vay. Khi đáo hạn, phí bảo hiểm\n(chiết khấu) đã được phân bổ đầy đủ và chi phí ghi sổ bằng mệnh giá.\nKhi phí bảo hiểm không được phân bổ đầy đủ trong năm đầu tiên, điều đó có nghĩa là công cụ nợ\nsẽ đáo hạn sau hơn một năm . Do đó, tình huống này rất có thể\ntạo ra một khoản nợ phải trả dài hạn.\n(Lựa chọn A) Thuế thu nhập hoãn lại giải thích sự khác biệt tạm thời giữa chi phí thuế thu nhập\n(báo cáo tài chính) và thuế phải nộp (báo cáo thuế). Khi một công ty báo cáo thu nhập kế toán\nthấp hơn thu nhập chịu thuế, công ty đó sẽ tạo ra tài sản thuế thu nhập hoãn lại chứ không phải nợ phải trả.\n(Lựa chọn B) Doanh thu chưa thực hiện là một khoản nợ phải trả được ghi nhận khi một công ty nhận được tiền mặt\ntrước khi giao hàng hóa hoặc dịch vụ. Vì công ty được thanh toán cho một dịch vụ sẽ\nđược cung cấp trong vòng 12 tháng nên dịch vụ này phải được phân loại là một khoản nợ hiện tại. Việc\ndịch vụ sẽ được cung cấp trong một kỳ kế toán khác là không liên quan.\nNhững điều cần nhớ:\nNợ phải trả tài chính đến hạn và phải trả trong vòng 12 tháng trở xuống được phân loại là nợ ngắn hạn. Nếu nó\n đáo hạn trong hơn 12 tháng thì nó được phân loại là nợ phải trả dài hạn, nhưng phần\n hiện tại (tức là bất kỳ số tiền nào đáo hạn trong 12 tháng tới) là nợ ngắn hạn.\nGiải thích báo cáo tài chính và tiết lộ liên quan đến nợ dài hạn\nLOS","qhtml":null},{"n":49,"q":"A company has 30 million weighted average common shares outstanding and reports the\nfollowing data (in CAD) for the most current completed fiscal year:\nNet income 25 million\nPreferred dividends 1 million\nOption exercise price 40\nThere were 5 million employee stock options outstanding for half the year, and the average\nstock price was CAD 50. If there are no other dilutive securities, based on this information,\nthe company's diluted EPS (in CAD) is closest to:","opts":["0.77","0.79","0.80"],"ans":"B","expl":"Phương pháp cổ phiếu quỹ được sử dụng để tính EPS pha loãng cho một công ty\nvới các quyền chọn nổi bật . Cách tiếp cận này giả định rằng:\ntất cả các quyền chọn sẽ được chuyển đổi thành cổ phiếu phổ thông (tức là đã thực hiện ) nếu giá cổ phiếu trung bình\nlớn hơn giá thực hiện và\ncông ty sẽ sử dụng tất cả số tiền thu được từ các quyền chọn đã thực hiện để mua lại\ncổ phiếu ở mức giá thị trường trung bình để giảm thiểu pha loãng.\nDo đó, cổ phiếu ròng tăng sẽ là số lượng cổ phiếu phổ thông mới được phát hành, trừ đi\nsố lượng cổ phiếu được mua lại.\nVì giá cổ phiếu trung bình (50) lớn hơn giá thực hiện (40), nên tất cả 5 triệu quyền chọn\nđược giả định là được chuyển đổi thành cổ phiếu phổ thông mới phát hành. Công ty sẽ sử dụng tất cả\nsố tiền thu được từ quyền chọn (5 triệu × 40 = 200 triệu) để mua lại 4 triệu cổ phiếu (= 200 triệu /\n50) ở mức giá cổ phiếu trung bình, và do đó số cổ phiếu mới tăng ròng sẽ là 1,00 triệu.\nTuy nhiên, quyền chọn đã tồn tại trong nửa năm, dẫn đến 0,50 triệu cổ phiếu mới\ncổ phiếu và EPS pha loãng là 0,79.\n(Lựa chọn A) 0,77 là kết quả của việc không tính trọng số theo thời gian cho số cổ phiếu mới ròng theo tỷ lệ phần trăm của\nnăm các quyền chọn còn hiệu lực.\n(Lựa chọn C) 0,80 là EPS cơ bản (tức là không bị pha loãng).\nNhững điều cần nhớ:\nPhương pháp cổ phiếu quỹ giả định rằng tất cả các quyền chọn sẽ được thực hiện nếu giá cổ phiếu trung bình\nlớn hơn giá thực hiện và sau đó, công ty sẽ sử dụng tất cả tiền mặt\nthu được từ các quyền chọn đã thực hiện để mua lại cổ phiếu ở mức giá thị trường trung bình để\npha loãng vừa phải.\nMô tả cách tính toán và diễn giải thu nhập trên mỗi cổ phiếu thu nhập cơ bản và\nsuy giảm trên mỗi cổ phiếu của công ty đối với các công ty có cấu trúc vốn đơn giản và phức tạp bao gồm\nnhững công ty có chứng khoán có tính suy giảm suy giảm\nLOS","qhtml":null},{"n":50,"q":"A lender is most likely to benefit when, over the life of a loan, actual inflation:","opts":["is less than expected inflation.","equals expected inflation.","is greater than expected inflation."],"ans":"A","expl":"Tác động của lạm phát khác với kỳ vọng\nNhóm\nCơ sở lý luận\nlợi ích\nNgười vay\nNgười mua\nCác khoản thanh toán được thực hiện có\nLạm phát > do cố định-\nsức mua ít hơn\nkỳ vọng\ngiá\nso với dự kiến\nhợp đồng\nNgười cho vay\nNgười về hưu với\nThu nhập nhận được có\nLạm phát <\ncố định\nsức mua nhiều hơn\nkỳ vọng\nlương hưu\nso với dự kiến\nlợi ích\nLạm phát là sự thay đổi về mức giá danh nghĩa trung bình theo thời gian và được đặc trưng là\ndự kiến hoặc bất ngờ:\nDự kiến: thay đổi mức giá khớp với kỳ vọng\nKhông mong đợi: thay đổi mức giá cao hơn hoặc thấp hơn kỳ vọng\nNgười cho vay được hưởng lợi khi lạm phát thực tế thấp hơn lạm phát dự kiến . Lãi suất\nphản ánh lạm phát dự kiến. Nếu mức tăng giá trong suốt thời hạn của khoản vay thấp hơn\ntỷ lệ lạm phát dự kiến ​​​​được phản ánh trong lãi suất của khoản vay thì thu nhập từ lãi của người cho vay có\nsức mua lớn hơn dự kiến ​​tại thời điểm bắt đầu khoản vay. Có sự chuyển giao\ncủa cải từ người đi vay sang người cho vay khi lạm phát thực tế thấp hơn lạm phát dự kiến.\n(Lựa chọn B) Người cho vay không có lợi thế cũng như không bị bất lợi khi lạm phát thực tế bằng\nlạm phát dự kiến vì thu nhập từ lãi có cùng sức mua (giá trị thực) như\ndự kiến khi bắt đầu khoản vay.\n(Lựa chọn C) Nếu lạm phát thực tế lớn hơn lạm phát dự kiến, thì người cho vay sẽ kiếm được tiền lãi với\nsức mua ít hơn dự kiến ban đầu, đó là sự chuyển giao của cải thực sự từ người cho vay\nsang người đi vay.\nNhững điều cần nhớ:\nLạm phát là sự thay đổi về mức giá danh nghĩa trung bình theo thời gian. Người cho vay được hưởng lợi (chịu thiệt hại) khi\nlạm phát thực tế thấp hơn (nhiều hơn) so với lạm phát dự kiến vì tiền lãi kiếm được có sức mua lớn hơn (ít hơn)\nso với dự đoán ban đầu.\nMô tả các công cụ được sử dụng để thực hiện các công cụ chính sách tiền tệ và cơ chế truyền tải tiền tệ\nvà giải thích mối quan hệ giữa chính sách tiền tệ và tăng trưởng kinh tế,\nlạm phát, lãi suất và trao đổi tỷ lệ\nLOS","qhtml":null},{"n":51,"q":"Country Y's government agrees to establish a voluntary export restraint (VER) on perfumes\nwith importing Country X. This VER will voluntarily limit Country Y's exports to 600,000 liters\nper year for the next three years.\nAll else equal, which of the following is the most likely result of this VER?","opts":["Country Y will capture the quota rents.","Country Y will have a net welfare loss.","Country X will experience a decline in their producer surplus."],"ans":"A","expl":"So sánh hạn ngạch nhập khẩu và hạn chế xuất khẩu tự nguyện (VER):\nTác động đến quốc gia nhập khẩu\nHạn ngạch nhập khẩu VER\nThặng dư của nhà sản xuất Tăng Tăng\nNgười tiêu dùng\nGiảm Giảm\nthặng dư\nTrộn lẫn, tùy thuộc vào việc tiền thuê hạn ngạch\ncó được nắm bắt bởi:\nKhông thay đổi (rent\nChính phủ\nquốc gia nhập khẩu thông qua việc bán quyền truy cập vào\ndoanh thu\ngiấy phép hoặc người nước ngoài/nhà xuất khẩu)\nnhà xuất khẩu\nGiảm ở quốc gia nhỏ,\nPhúc lợi quốc gia Giảm\ncó thể tăng ở quốc gia lớn\nGiá tăng Tăng\nTrong nước\nGiảm Giảm\ntiêu thụ\nTrong nước\nTăng Tăng\nsản xuất\nThương mại Nhập khẩu giảm Nhập khẩu giảm\nHạn chế xuất khẩu tự nguyện (VER) tương tự như hạn ngạch nhập khẩu; điểm khác biệt chính là\nhạn ngạch nhập khẩu do quốc gia nhập khẩu áp đặt, trong khi VER do\nnước xuất khẩu ban hành. Trong VER, chính phủ nước nhập khẩu trao quyền cho\nchính phủ nước xuất khẩu hạn chế thương mại. VER được coi là các rào cản\nphi thuế quan, là các rào cản thương mại hạn chế như hạn ngạch và cấm vận.\nVER cho phép nhà xuất khẩu hoặc quốc gia xuất khẩu thu được tiền thuê hạn ngạch do sự sụt giảm trong thương mại, nơi chúng có thể được bán đấu giá hoặc trao cho các nhà sản xuất\nnước ngoài hoặc biến mất do hành vi tìm kiếm tiền thuê; trong trường hợp không tìm kiếm đặc lợi, hạn ngạch\ntiền thuê mang lại cho nước xuất khẩu (tức là Quốc gia Y) lợi ích phúc lợi ròng. Doanh thu của\nnước sở tại nhập khẩu đi ra khỏi đất nước, do đó, hiệu ứng phúc lợi ròng đối với quốc gia\nnhập khẩu (tức là Quốc gia X) được coi là tổn thất phúc lợi (Lựa chọn B) .\nVới VER hoạt động, các nhà sản xuất ở nước nhập khẩu được hưởng lợi do giảm\ncạnh tranh, có thể dẫn đến giá và lợi nhuận cao hơn và do đó nhà sản xuất tăng\nthặng dư (Lựa chọn C) . Tuy nhiên, những lợi nhuận này mang lại cho các nhà sản xuất trong nước có những hạn chế vì\nVER làm giảm phúc lợi chung của quốc gia bằng cách tạo ra các hiệu ứng thương mại tiêu cực cũng như những bóp méo tiêu cực và sản xuất\n.\nNhững điều cần nhớ:\nA VER tương tự như hạn ngạch nhập khẩu; điểm khác biệt chính là hạn ngạch nhập khẩu do\nnước nhập khẩu áp đặt, trong khi VER do nước xuất khẩu ban hành. VER cho phép nhà xuất khẩu hoặc quốc gia xuất khẩu thu được\ntiền thuê hạn ngạch do sự sụt giảm thương mại.\nSo sánh các loại hạn chế thương mại, chẳng hạn như thuế quan, hạn ngạch và trợ cấp xuất khẩu cũng như\ný nghĩa kinh tế\nLOS","qhtml":null},{"n":52,"q":"Which of the following distributions is most appropriate for modeling a stock's price?","opts":["Normal","Lognormal","Multivariate"],"ans":"B","expl":"Phân phối logarit chuẩn có một số đặc điểm giúp nó phù hợp để lập mô hình giá cổ phiếu\n. Các giá trị ở đầu dưới của phân phối được giới hạn bằng 0 nhưng không có giới hạn\ntrên. Sự phân bố cũng có độ lệch về bên phải. Điều này dẫn đến đuôi bên trái ngắn lại, đuôi phải dài\n và hình dạng không đối xứng. Giá cổ phiếu hoạt động tương tự: giá không thể\ndưới 0 và về mặt lý thuyết không có giới hạn trên.\n(Lựa chọn A) Phân phối bình thường là đối xứng, không có độ lệch và không có giới hạn trên\nhoặc giới hạn dưới. Những đặc điểm này không nhất quán với sự phân bổ giá cổ phiếu;\ndo đó, phân phối chuẩn không thích hợp ở đây.\n(Lựa chọn C) Phân phối đa biến là một dạng phân phối chuẩn xử lý các nhóm\nbiến thay vì một biến duy nhất. Ở đây, phân phối chuẩn không phù hợp và trong trường hợp\nchỉ có một biến này, điều này làm cho phân phối nhiều biến trở thành lựa chọn\nkhông phù hợp.\nNhững điều cần nhớ:\nPhân phối logic bình thường có giới hạn dưới bằng 0, không có giới hạn trên và không đối xứng\nvới độ lệch phải. Những đặc điểm này làm cho chúng phù hợp để mô tả giá cổ phiếu, vốn\nđược phân bổ không đối xứng và lệch sang phải vì chúng không thể giảm xuống dưới 0 và\nvề mặt lý thuyết không có giới hạn trên.\nGiải thích mối quan hệ giữa phân phối chuẩn và phân phối logic chuẩn và tại sao phân phối lognormal\nđược sử dụng để mô hình hóa giá tài sản khi sử dụng lợi nhuận tài sản gộp liên tục\nLOS","qhtml":null},{"n":53,"q":"A company receives cash of €55 million from the sale of equipment in 20X7. During that year,\nthe company had depreciation expenses of €20 million and capital expenditures of €65 million;\nthe capital expenditures were all used to purchase new equipment. The company reported the\nfollowing balance sheet data:\n€ millions 20X7 20X6\nGross cost of equipment 800 760\nAccumulated depreciation (150) (140)\nBased on only this information, the gain on the sale of the equipment (in € millions)\nis closest to:","opts":["10","30","40"],"ans":"C","expl":"Khi các công ty bán thiết bị , họ báo cáo khoản lãi (lỗ) không bằng tiền mặt bằng\nchênh lệch giữa tiền mặt nhận được từ việc bán hàng và số tiền ròng hiện tại giá trị sổ sách\n(BV) của thiết bị. Khi không cung cấp BV ròng của thiết bị đã bán, các mục trong báo cáo\ntài chính có thể được sử dụng để ước tính chi phí.\nTrong trường hợp này, để tính BV của thiết bị được thanh lý, hãy sử dụng mối quan hệ giữa\nsự thay đổi trong BV ròng của thiết bị và các yếu tố gây ra thay đổi đó: vốn\nchi tiêu (tức là tăng lên BV) và chi phí khấu hao cũng như thanh lý thiết bị (tức là\ngiảm xuống BV). BV ròng của thiết bị thanh lý có thể được tính như sau:\nVì tiền mặt nhận được từ việc bán là 55 nên lợi nhuận từ việc bán là 40 (55 − 15).\n(Lựa chọn A) 10 là
