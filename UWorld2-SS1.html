<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n":1,"q":"Reem Gamal, CFA, is the owner of Osiris Partners. She is working on the marketing pitch that\nshe will give to the trustees of Horus University to have Osiris manage its endowment fund.\nAs part of her pitch, she plans to say:\nI: \"Since Osiris hires only CFA charterholders, we are among the elite asset\nmanagement firms, as proven by our performance: Our returns have outperformed the\noverall market in 9 of the past 10 years.\"\nII: \"By passing such an intense and comprehensive study program, each of our analysts\nhave enhanced their knowledge in portfolio management, including endowments.\"\nWhich of the statements would most likely violate the Standards?","opts":["Only Statement I","Only Statement II","Both Statement I and II"],"ans":"A","expl":"\"Khi đề cập đến Viện CFA, tư cách thành viên của Viện CFA, chỉ định CFA\nhoặc ứng cử trong Chương trình CFA, các Thành viên và Ứng viên không được\nkhông xuyên tạc hoặc phóng đại ý nghĩa hoặc hàm ý của tư cách thành viên\ntrong Viện CFA, có chứng chỉ CFA hoặc ứng cử trong Chương trình CFA\n.\"\nTiêu chuẩn VII(B) Tham chiếu đến Viện CFA, Chỉ định CFA và Chương trình CFA\ncấm các Thành viên và Ứng viên phóng đại ý nghĩa hoặc hàm ý của việc\ncó điều lệ CFA . Điều này bao gồm việc phóng đại năng lực hoặc khả năng đạt được\nhiệu suất đầu tư vượt trội .\nMặc dù Tiêu chuẩn I(C) thường tập trung vào những lời hứa liên quan đến đảm bảo đầu tư hoặc\nkhả năng đạt được lợi nhuận vượt trội, Tiêu chuẩn VII(B) quy định rõ rằng những tuyên bố này không thể quy cho việc chỉ định CFA. Tuy nhiên, những tuyên bố thực tế khách quan về lợi ích\n(ví dụ: kiến ​​thức và kỹ năng đạt được, độ tin cậy) của việc chỉ định CFA và tính nghiêm ngặt của chương trình\nđược cho phép .\nTrong câu hỏi này, tuyên bố đầu tiên của Gamal vi phạm Tiêu chuẩn khi khẳng định rằng Osiris\nPartners là một công ty quản lý tài sản ưu tú vì công ty chỉ thuê những người nắm giữ CFA; bằng cách\nlàm như vậy, cô ấy gán địa vị ưu tú cho điều lệ. Mặc dù tuyên bố này so sánh hiệu quả hoạt động của công ty\nvới thị trường, nhưng tuyên bố này vẫn là vi phạm vì nó ngụ ý\ncó thể kỳ vọng hiệu quả hoạt động vượt trội trong tương lai. Tuyên bố thứ hai của Gamal không\nvi phạm Tiêu chuẩn vì nó chỉ nêu thông tin thực tế về cường độ của kỳ thi, các kỹ năng và\nkiến thức thu được (Lựa chọn B và C) .\nNhững điều cần nhớ:\nTiêu chuẩn VII(B) Tham chiếu đến Viện CFA, Chỉ định CFA và Chương trình CFA cấm\nThành viên và Thí sinh phóng đại ý nghĩa hoặc hàm ý của việc có điều lệ CFA\nvi phạm Tiêu chuẩn. Tuy nhiên, chúng tôi cho phép đưa ra những tuyên bố thực tế khách quan về lợi ích của\nviệc chỉ định CFA và tính nghiêm ngặt của chương trình.\nĐánh giá các thực tiễn, chính sách và hành vi liên quan đến Quy tắc đạo đức và tiêu chuẩn của Viện CFA\nỨng xử chuyên nghiệp\nLOS","qhtml":null},{"n":2,"q":"Based on Standard I Professionalism, Members and Candidates must :","opts":["have a duty of loyalty to their clients.","maintain independence and objectivity.","not compromise the reputation or the integrity of CFA Institute."],"ans":"B","expl":"\"Các Thành viên và Ứng viên phải có sự quan tâm và phán đoán hợp lý để đạt được\nvà duy trì tính độc lập và khách quan trong các hoạt động nghề nghiệp của mình.\nCác Thành viên và Ứng viên phải không đề nghị, gạ gẫm hoặc nhận bất kỳ quà tặng, lợi ích,\nbồi thường hoặc sự đền bù nào có thể được cho là\nlàm tổn hại đến tính độc lập và khách quan của chính họ hoặc của người khác.\"\nTiêu chuẩn I của Tiêu chuẩn Ứng xử Chuyên nghiệp đề cập đến tính chuyên nghiệp của\nThành viên và Ứng viên. Tiêu chuẩn I(B) Tính độc lập và khách quan cụ thể\nquy định:\n\" Các Thành viên và Ứng viên phải thận trọng và phán đoán hợp lý để đạt được và duy trì\nsự độc lập và khách quan trong các hoạt động nghề nghiệp của mình ...\"\nTiêu chuẩn I(B) đặc biệt tập trung vào các Thành viên và Ứng viên đạt được và duy trì\nsự độc lập và khách quan để các hành động và lời khuyên của họ dành cho khách hàng được tuân thủ không bị ảnh hưởng bởi\nxung đột lợi ích. Tiêu chuẩn áp dụng cho các tình huống trong đó các tổ chức hoặc cá nhân có thể\ntìm cách gây ảnh hưởng đến quá trình ra quyết định theo hướng gây bất lợi cho khách hàng. Nó không áp dụng cho\nquà tặng từ chính khách hàng.\nTrong câu hỏi này, tất cả các lựa chọn câu trả lời đều lấy trực tiếp từ Tiêu chuẩn nhưng chỉ có một lựa chọn được liên kết\nvới Tiêu chuẩn I.\n(Lựa chọn A) Tiêu chuẩn III(A) Lòng trung thành, Thận trọng và Cẩn trọng đề cập cụ thể đến nghĩa vụ của\nlòng trung thành mà các Thành viên và Ứng viên phải có đối với họ client.\n(Lựa chọn C) Tiêu chuẩn VII(A) Ứng xử với tư cách là Người tham gia các Chương trình của Viện CFA yêu cầu\nCác Thành viên và Ứng viên hành động theo cách không làm tổn hại đến danh tiếng hoặc\ntính chính trực của Viện CFA.\nNhững điều cần nhớ:\nTiêu chuẩn I(B) Tính độc lập và khách quan tập trung vào việc các Thành viên và Ứng viên đạt được\nvà duy trì tính độc lập, khách quan để hành động và lời khuyên của họ cho khách hàng\nkhông bị ảnh hưởng bởi xung đột lợi ích.\nGiải thích các trách nhiệm đạo đức mà Quy tắc và Tiêu chuẩn yêu cầu, bao gồm các phần phụ\ncủa mỗi Tiêu chuẩn\nLOS","qhtml":null},{"n":3,"q":"Maria Garcia, CFA, is a sell-side analyst at Sharp Brokerage. Garcia is preparing a research\nreport on Kicks, Inc., a popular athletic shoe manufacturer. Sharp Brokerage is a market\nmaker in Kicks, Inc.\nGarcia is familiar with Kicks as she was on the investment banking team at a former employer\nthat brought Kicks public two years ago. Garcia also has a childhood friend who is now a\nprofessional athlete and occasionally receives free Kicks apparel.\nAccording to Standard VI(A) Disclosure of Conflicts, the research report should most\nappropriately disclose:","opts":["Garcia's history with Kicks' initial public offering.","Garcia's friendship with the professional athlete.","that Sharp Brokerage is a market maker of Kicks."],"ans":"C","expl":"\"Các Thành viên và Ứng viên phải tiết lộ đầy đủ và công bằng tất cả các vấn đề\ncó thể được cho là sẽ làm giảm tính độc lập và\ntính khách quan của họ hoặc cản trở các nghĩa vụ tương ứng của họ khách hàng, khách hàng\ntiềm năng và nhà tuyển dụng. Thành viên và Ứng viên phải đảm bảo rằng những thông tin tiết lộ\n đó phải nổi bật, được trình bày bằng ngôn ngữ đơn giản và truyền đạt\nthông tin liên quan một cách hiệu quả.\"\nTiết lộ xung đột theo Tiêu chuẩn VI(A) nhằm mục đích bảo vệ nhà tuyển dụng và khách hàng bằng cách thúc đẩy\nsự minh bạch, cho phép họ đánh giá liệu một Thành viên hay Ứng viên có đủ điều kiện hay không. hành động\nđộc lập và khách quan khi đưa ra lời khuyên hoặc khuyến nghị đầu tư. Khi\nmột xung đột có thể được xem một cách hợp lý là cản trở khả năng của Thành viên hoặc Ứng viên\ntiến hành đánh giá đầu tư không thiên vị, nhà tuyển dụng và khách hàng phải\nđược thông báo về tất cả các chi tiết thích hợp của xung đột.\nTrong trường hợp này, chính nhà môi giới/đại lý (tức là Sharp Brokerage) phải thông báo cho khách hàng rằng\ncông ty là nhà tạo lập thị trường đối với các chứng khoán được nêu trong báo cáo. Tiết lộ này cảnh báo khách hàng\nrằng công ty có thể có xung đột tiềm ẩn ở chỗ công ty này có thể nắm giữ cổ phần của Kicks trong\ntài khoản riêng của mình cho mục đích tạo lập thị trường.\n(Lựa chọn A) Việc Garcia tham gia vào đợt IPO của Kicks hai năm trước với chủ lao động trước đó\nkhông tạo ra xung đột đang diễn ra hoặc vĩnh viễn. Garcia hiện không có mối quan hệ\ncó thể tiết lộ với công ty.\n(Lựa chọn B) Việc Garcia có một người bạn là vận động viên chuyên nghiệp thỉnh thoảng\nnhận quần áo Kicks miễn phí là quá tiếp tuyến (gián tiếp) và nhỏ để gây ra xung đột.\nNhững điều cần nhớ:\nTiêu chuẩn VI(A) Tiết lộ về Xung đột giải quyết trách nhiệm của các thành viên và ứng viên\ntrong việc tiết lộ các xung đột lợi ích thực tế và tiềm ẩn cho khách hàng, khách hàng tiềm năng và\nnhà tuyển dụng để họ có thể xác định liệu xung đột có thể ảnh hưởng đến tính khách quan của ứng viên hoặc\nthành viên hay không.\nXác định hành vi phù hợp với Quy tắc và Tiêu chuẩn cũng như hành vi vi phạm Quy tắc và\nTiêu chuẩn\nLOS","qhtml":null},{"n":4,"q":"Ross Farley, CFA, is the chief compliance officer at Prudent Advisors, Inc. (PA). PA offers\ninvestment advisory services to retail investors. Farley monitors the activity of six financial\nadvisors to ensure compliance with all applicable laws and regulations.\nFarley has provided all employees with the firm's code of ethics and a policies and procedures\nmanual. On an annual basis, Farley conducts educational training, sets expectations for\nbehavior, and asks employees to sign a document attesting that they have received the code\nand manual and understand their contents. In addition, employees are required to submit a\nquarterly transaction report detailing their trading of individual securities.\nFarley discovers that Greg Smith, an advisor at the firm, recently opened an unauthorized\naccount at a discount brokerage firm and is conducting personal trades that have not been\nreported or approved. According to Standard IV(C) Responsibilities of Supervisors, did\nFarley most likely violate the Standards?","opts":["No","Yes, for failing to set up and implement an effective compliance program","Yes, for failing to prevent Smith from trading in an unauthorized brokerage account"],"ans":"A","expl":"\"Các Thành viên và Ứng viên phải nỗ lực hợp lý để\nđảm bảo rằng bất kỳ ai chịu sự giám sát hoặc quyền hạn của họ\ntuân thủ luật pháp, quy tắc, quy định hiện hành và the\nQuy tắc và Tiêu chuẩn.\"\nTrách nhiệm của Giám sát viên theo Tiêu chuẩn IV(C) yêu cầu các Thành viên và Ứng viên\ngiám sát nhân viên thực hiện nỗ lực hợp lý để phát hiện và ngăn chặn hành vi phi đạo đức\nvà vi phạm pháp luật, các quy tắc do công ty của họ thiết lập cũng như Quy tắc và Tiêu chuẩn.\nTuy nhiên, việc không phát hiện ra hành vi đó không nhất thiết là vi phạm Tiêu chuẩn nếu\nngười giám sát đảm bảo rằng có một hệ thống tuân thủ phù hợp .\nHướng dẫn về Tiêu chuẩn chỉ ra rằng việc tuân thủ, ở mức tối thiểu, yêu cầu người giám sát\n:\nthiết lập các quy trình tuân thủ bằng văn bản và\nthực hiện đánh giá thường xuyên để đảm bảo rằng nhân viên tuân thủ các quy trình.\nNgười giám sát không đáp ứng những điều này các yêu cầu vi phạm Tiêu chuẩn ngay cả khi không có luật hoặc\n nào bị vi phạm. Tuy nhiên, khái niệm “hợp lý” không khiến người giám sát\ncó trách nhiệm phát hiện mọi hành vi vi phạm; nhân viên có thể trốn tránh việc tuân thủ theo những cách\nmà những nỗ lực hợp lý không thể phát hiện được.\nTrong trường hợp này, Ross Farley đã thiết lập và triển khai một chương trình tuân thủ đầy đủ\n(Lựa chọn B) . Sẽ không hợp lý khi kết luận rằng Farley lẽ ra phải\nbiết rằng một nhân viên sẽ cố gắng trốn tránh yêu cầu (Lựa chọn C) . Tuy nhiên, giờ đây\nanh ấy biết điều đó là có thể, Farley nên tăng cường các hệ thống tuân thủ để ngăn chặn những sự cố\ntrong tương lai.\nNhững điều cần nhớ:\nTrách nhiệm tiêu chuẩn IV(C) của Người giám sát yêu cầu người giám sát, ở mức tối thiểu,\nthiết lập các quy trình tuân thủ bằng văn bản và thực hiện đánh giá thường xuyên để đảm bảo rằng\nnhân viên đang tuân theo các thủ tục đó. Những người giám sát không đáp ứng các yêu cầu này\nvi phạm Tiêu chuẩn ngay cả khi không có luật hoặc quy tắc nào bị vi phạm. Tuy nhiên, Tiêu chuẩn chỉ yêu cầu\nngười giám sát phải thực hiện những nỗ lực phòng ngừa hợp lý; người giám sát tuân theo\ncác yêu cầu sẽ không vi phạm Tiêu chuẩn ngay cả khi có vi phạm.\nGiải thích cách thực hành, chính sách và hành vi vi phạm Quy tắc\nĐạo đức và Tiêu chuẩn ứng xử nghề nghiệp\nLOS","qhtml":null},{"n":5,"q":"The GIPS standards most likely :","opts":["allow selection of the period to be presented for a composite and its benchmark.","require inclusion of portfolios removed from a composite after the reported period.","are enforced by regulatory authorities to ensure consistency among investment firms."],"ans":"B","expl":"Các phương pháp báo cáo hiệu suất gây hiểu lầm phổ biến\nĐại diện Chọn danh mục đầu tư hoạt động tốt nhất để thể hiện tổng thể\nkết quả tài khoản\nSống sót\nLoại trừ các danh mục đầu tư đã chấm dứt khỏi hiệu suất trung bình\nxu hướng\nThay đổi\nChỉ trình bày các giai đoạn đã chọn có hiệu suất cao\nkhoảng thời gian\n(GIPS®)\nTiêu chuẩn hiệu suất đầu tư toàn cầu chuẩn hóa việc báo cáo\nhiệu suất lịch sử trong toàn ngành đầu tư để tạo điều kiện so sánh giữa các công ty\nvà tăng niềm tin của nhà đầu tư. Các tiêu chuẩn GIPS yêu cầu thông tin đó\ntoàn diện và thể hiện hiệu suất thực tế. Các nhà quản lý đầu tư tại các công ty\nkhông tuân thủ có thể đánh lừa khách hàng bằng cách chọn trình bày có chọn lọc thông tin về:\nDanh mục đầu tư được quản lý: Một công ty có thể chọn chia sẻ hiệu quả hoạt động trước đây của các danh mục đầu tư\nhoạt động hàng đầu của mình, do đó báo cáo lợi nhuận cao hơn kết quả thực tế.\nTài sản tài chính: Một công ty có thể trình bày hiệu suất đầu tư của chỉ những tài sản đã đầu tư\nhiện tại, điều này tạo ra sự thiên vị về người sống sót bằng cách bỏ qua những tài sản đã bị loại bỏ\nkhỏi danh mục đầu tư sau khi hoạt động kém. Các công ty nên bao gồm các tài khoản, quỹ và danh mục đầu tư của khách hàng đã chấm dứt\nnhư một phần hiệu suất lịch sử của một tổng hợp.\nKhoảng thời gian: Các nhà quản lý đầu tư có thể chỉ trình bày hiệu suất một cách không phù hợp\ntrong những khoảng thời gian khi danh mục đầu tư hoạt động tốt hơn thị trường hoặc điểm chuẩn.\n(Lựa chọn A) Các tiêu chuẩn GIPS ngăn các công ty trình bày các giai đoạn hiệu suất\nmột cách có chọn lọc bằng cách yêu cầu một số lượng giai đoạn liên tiếp tối thiểu cần trình bày.\n(Lựa chọn C) Việc tuân thủ GIPS là tùy chọn, do đó không có sự giám sát theo quy định đối với các tiêu chuẩn GIPS\n.\nNhững điều cần nhớ:\nCác công ty đầu tư có thể đánh lừa các nhà đầu tư với lịch sử hoạt động không đầy đủ, một cách có chọn lọc\nchọn thông tin cần trình bày. Các tiêu chuẩn GIPS cung cấp một cách tiếp cận thống nhất để\ntrình bày các kết hợp tổng hợp yêu cầu các công ty bao gồm các tài khoản khách hàng đã chấm dứt, quỹ và\ndanh mục đầu tư như một phần của hiệu suất lịch sử.\nMô tả các khái niệm chính của tiêu chuẩn GIPS dành cho các công ty\nLOS","qhtml":null},{"n":6,"q":"Soomin Yoo, CFA, is helping grade the most recent Level 3 exam. At dinner one evening, she\ndiscusses the grading process with a friend, Minsoo Han, CFA, who is not participating in the\ngrading process.\nYoo states \"I'm surprised how many people are missing the question on fixed income investing\nstrategies. It didn't come across to me as that difficult.\"\nHan responds \"If that's the case, candidates might be in trouble. I read on a social media\npost that the multiple-choice section also had more fixed income questions than in other\nrecent exams.\"\nAccording to the Standards, is it most likely that:","opts":["both Yoo and Han have violated the Standards.","Yoo has violated the Standards but Han has not.","Han has violated the Standards but Yoo has not."],"ans":"B","expl":"\"Thành viên và Ứng viên không được tham gia vào bất kỳ hành vi nào\nlàm tổn hại đến danh tiếng hoặc tính liêm chính của Viện CFA hoặc chỉ định CFA\nhoặc tính chính trực, hiệu lực hoặc tính bảo mật của các chương trình của Viện CFA\n.\"\nTiêu chuẩn VII(A) cấm các Thành viên và Ứng viên tham gia vào các hành vi\nlàm suy yếu tính liêm chính của Viện CFA, các chương trình của Viện và niềm tin của công chúng vào mức độ\nthành tích cần thiết để đạt được điều lệ CFA. Để duy trì tính toàn vẹn của điều lệ, Viện CFA\ncó trách nhiệm đảm bảo rằng\nbất kỳ ai cũng không chia sẻ thông tin bí mật về các kỳ thi. Đối với Thành viên và Thí sinh, việc chia sẻ thông tin như vậy là vi phạm Tiêu chuẩn.\nThành viên không được tiết lộ :\ncác câu hỏi sẽ xuất hiện trong bài kiểm tra hoặc đang được xem xét,\nbất kỳ phần nào của quá trình thảo luận liên quan đến bài kiểm tra hoặc\nthông tin liên quan đến việc chấm điểm câu hỏi.\nNgười chấm điểm không được chia sẻ thông tin với bất kỳ ai ngoài nhóm phát triển hoặc quá trình chấm điểm\n . Vì Han không tham gia quá trình chấm điểm nên Yoo không được thảo luận về bất kỳ thông tin nào\nliên quan đến việc chấm điểm câu hỏi, cho dù đó là chi tiết cụ thể hay thông tin chung. Bằng cách\nlàm như vậy, cô ấy đã vi phạm Tiêu chuẩn. Nếu thông tin này được chia sẻ với những người tham gia khác trong\nquy trình chấm điểm thì thông tin đó sẽ không vi phạm Tiêu chuẩn.\n(Lựa chọn A và C) Han không vi phạm Tiêu chuẩn vì anh ấy không tham gia\nquy trình phát triển, quản lý hoặc chấm điểm của kỳ thi và do đó không biết bất kỳ thông tin nào\nđể tiết lộ. Nguồn thông tin duy nhất của anh ấy là một bài đăng trên mạng xã hội.\nNhững điều cần nhớ:\nTiêu chuẩn VII(A) cấm các Thành viên và Ứng viên tham gia vào các hành vi\nlàm suy yếu tính liêm chính của Viện CFA, các chương trình của Viện và niềm tin của công chúng vào mức độ\nthành tích cần thiết để đạt được điều lệ CFA. Thành viên không được tiết lộ thông tin liên quan đến\nviệc chấm điểm câu hỏi cho bất kỳ ai ngoài quy trình chấm điểm.\nXác định hành vi phù hợp với Quy tắc và Tiêu chuẩn cũng như hành vi vi phạm Quy tắc và\nTiêu chuẩn\nLOS","qhtml":null},{"n":7,"q":"A Charterholder who lives and works in a country that adheres to a \"suitability standard\"\nrecommends an investment that meets a client's long-term financial objectives. If there was\nan equally suitable investment that paid the Charterholder a lower fee, the adviser's conduct\ncan be best described as:","opts":["legal and ethical.","legal but unethical.","illegal and unethical."],"ans":"B","expl":"Các công cụ tuân thủ đạo đức nghề nghiệp\nChủ sở hữu công cụ mô tả\nQuy tắc đạo đức Tổ chức chuyên nghiệp Nguyên tắc chung\nTiêu chuẩn ứng xử của tổ chức chuyên nghiệp Hành vi được chấp nhận ở mức tối thiểu\nLuật pháp và quy định của Chính phủ Giới hạn pháp lý đối với hành vi\nChỉ riêng các tiêu chuẩn pháp lý là không đủ để hình thành hành vi phù hợp giữa các chuyên gia đầu tư\n . Luật pháp thường quá hẹp để có thể nghiêm cấm đầy đủ mọi hành vi không đúng đắn và\nthường được ban hành sau khi xảy ra thương tích hoặc thiệt hại.\nĐạo đức được tạo ra để chi phối hành vi đạo đức , yêu cầu các Thành viên và Ứng viên phải\ntiêu chuẩn cao hơn mức yêu cầu của luật pháp và quy định . Hành vi đạo đức là những hành động\nphù hợp với mong đợi của xã hội về sự trung thực, minh bạch và công bằng. Họ\ncân bằng lợi ích cá nhân của mỗi người với nhận thức về hành động của một người ảnh hưởng đến người khác như thế nào.\nViện CFA đã áp dụng Quy tắc và Tiêu chuẩn làm tuyên bố về các nguyên tắc chung, dựa trên\nniềm tin rằng đạo đức đối với ngành đầu tư toàn cầu phải mang tính phổ quát thay vì dựa trên\nluật lệ hoặc phong tục địa phương. Các tiêu chuẩn đạo đức toàn cầu nhằm mục đích tạo ra niềm tin và tính liêm chính\ntrong toàn bộ hệ thống tài chính toàn cầu.\nTrong trường hợp này, tiêu chuẩn về tính phù hợp là nghĩa vụ pháp lý chỉ yêu cầu\nmức đầu tư phù hợp ở mức tối thiểu mà không cần cân nhắc đến các\nyếu tố khác (ví dụ: phí trả cho cố vấn). Ngược lại, nghĩa vụ ủy thác yêu cầu cố vấn\ntuân thủ tiêu chuẩn cao hơn bao gồm việc luôn phục vụ lợi ích tốt nhất của khách hàng, chẳng hạn như\ngiảm thiểu phí, tất cả các yếu tố khác đều bằng nhau. Do đó, hành động của Bên giữ đặc quyền là hợp pháp nhưng\nphi đạo đức (Lựa chọn A và C) .\nNhững điều cần nhớ:\nChỉ riêng các tiêu chuẩn pháp lý là không đủ để hình thành hành vi phù hợp giữa các chuyên gia đầu tư\n. Một quy tắc đạo đức riêng biệt có thể dùng làm hướng dẫn về hành vi đạo đức phù hợp,\ncó thể vượt quá yêu cầu pháp lý.\nSo sánh và đối chiếu các tiêu chuẩn đạo đức với các tiêu chuẩn pháp lý\nLOS","qhtml":null},{"n":8,"q":"Michael Woods, CFA, is a sell-side analyst at a large brokerage firm. Woods previously\npublished a \"buy\" rating on Mira Medical but believes the stock is now overvalued and submits\na downgrade report to his compliance department for approval.\nSally Silva, an influential buy-side portfolio manager at a large investment firm, calls Woods to\ndiscuss Mira's investment prospects. Woods does not mention the impending downgrade, but\nthe tone of the conversation leads Silva to suspect he is likely to downgrade Mira.\nSilva comments that Mira is her largest holding and that \"it would be very unfortunate\" if the\nstock were downgraded before year end. She mentions conversations with other sell-side\nanalysts that support higher price targets on Mira. Silva then says that a downgrade might\nshake her confidence in Woods, that others might be doing a better job, and she might take\nher business elsewhere.\nAfter this conversation, Woods postpones his downgrade, preferring to think for a while and\ncarefully consider all the relevant factors. Woods downgrades Mira Medical a few weeks later,\nduring the first week of the new year. According to Standard I(B) Independence and\nObjectivity, Woods:","opts":["did not violate the Standard.","violated the Standard by delaying publication of the downgrade.","violated the Standard by tipping off the portfolio manager that a downgrade was coming."],"ans":"B","expl":"\"Các Thành viên và Ứng viên phải có sự quan tâm và phán đoán hợp lý để đạt được\nvà duy trì tính độc lập và khách quan trong các hoạt động nghề nghiệp của mình.\nCác Thành viên và Ứng viên không được làm vậy đề nghị, gạ gẫm hoặc nhận bất kỳ món quà, lợi ích,\nbồi thường hoặc sự cân nhắc nào có thể được cho là\nlàm tổn hại đến tính độc lập và khách quan của chính họ hoặc của người khác.\"\nTiêu chuẩn I(B) Tính độc lập và khách quan tập trung vào việc tránh mọi hành động\nsẽ làm tổn hại đến tính độc lập và khách quan của một chuyên gia đầu tư. Nhà phân tích bên bán\nthường bị các nhà phân tích bên mua và nhà quản lý danh mục đầu tư gây áp lực phải bày tỏ\nquan điểm hoặc thực hiện các hành động không nhất quán với quan điểm trung thực của nhà phân tích bên bán. Vì các công ty\nbên mua là \"khách hàng\", nên họ có ảnh hưởng đáng kể đến các nhà phân tích bên bán, những người\nthường được trả thù lao trực tiếp dựa trên số doanh thu giao dịch mà họ tạo ra cho các công ty\ncủa mình.\nTrong trường hợp này, Michael Woods đã quyết định hạ cấp Mira Medical và gửi\nbáo cáo của mình để phê duyệt tuân thủ. Người quản lý bên mua, Sally Silva, đe dọa sẽ gửi doanh nghiệp\nđi nơi khác, điều này có thể sẽ ảnh hưởng đến khoản bồi thường của Woods. Bằng cách chấp nhận nhận xét của Silva\nvà trì hoãn việc hạ cấp cho đến năm mới, Woods\nđã xâm phạm tính độc lập và khách quan của mình và vi phạm Tiêu chuẩn (Lựa chọn A) .\n(Lựa chọn C) Vì Wood không tiết lộ việc hạ cấp sắp xảy ra nên anh ấy không vi phạm\nTiêu chuẩn. Trong những tình huống như vậy, nhà phân tích bên bán phải cẩn thận không tiết lộ bất kỳ ý kiến\nhiện tại nào có thể khác với những gì đã được công bố và phổ biến một cách công bằng cho tất cả khách hàng.\nNhững điều cần nhớ:\nTính độc lập và khách quan của Tiêu chuẩn I(B) yêu cầu các Thành viên và Ứng viên tránh\ncác hành động có thể làm tổn hại đến tính độc lập và khách quan của chính họ hoặc của người khác. Nhà phân tích bên bán\nthường bị các nhà phân tích bên mua và người quản lý danh mục đầu tư gây áp lực phải bày tỏ quan điểm\nhoặc thực hiện các hành động không nhất quán với ý kiến ​​trung thực của nhà phân tích bên bán.\nXác định hành vi phù hợp với Quy tắc và Tiêu chuẩn cũng như hành vi vi phạm Quy tắc và\nTiêu chuẩn\nLOS","qhtml":null},{"n":9,"q":"Which of the following statements best describes the obligation of Members and Candidates\nwith respect to the Standards of Professional Conduct? When in an advisory relationship with\na client, they must determine investment suitability based on only:","opts":["the merits of that specific investment.","earning the highest returns with the lowest fees.","the client's written objectives, mandates, and constraints."],"ans":"C","expl":"\"Khi Thành viên và Ứng viên có mối quan hệ tư vấn với khách hàng,\nhọ phải:\nA. Không chính xác vì Thực hiện một cuộc điều tra hợp lý về khách hàng hoặc khách hàng tiềm năng khoản đầu tư của khách hàng\nkinh nghiệm, mục tiêu rủi ro và lợi nhuận cũng như các hạn chế tài chính trước khi\nđưa ra bất kỳ đề xuất đầu tư nào hoặc thực hiện hành động đầu tư và\nphải đánh giá lại và cập nhật thông tin này thường xuyên.\nB. Không chính xác vì Xác định rằng khoản đầu tư phù hợp với tình hình tài chính của khách hàng\nvà nhất quán với các mục tiêu, nhiệm vụ và ràng buộc bằng văn bản của khách hàng\ntrước khi đưa ra khuyến nghị đầu tư hoặc thực hiện hành động đầu tư.\nC. Đúng vì Đánh giá tính phù hợp của các khoản đầu tư trong bối cảnh tổng thể\ndanh mục đầu tư của khách hàng.\"\nThành viên CFA (bao gồm cả người sở hữu CFA) và Ứng viên có nghĩa vụ tuân thủ và\nbảo vệ Quy tắc đạo đức (tức là Quy tắc) và Tiêu chuẩn ứng xử chuyên nghiệp (tức là\nTiêu chuẩn ), cung cấp hướng dẫn về hành vi đạo đức phù hợp . Quy tắc\nbao gồm các nguyên tắc chung mà Thành viên và Ứng viên phải tuân thủ. Ngược lại,\nTiêu chuẩn đề cập đến các ứng dụng cụ thể hơn của các nguyên tắc cần phải tuân theo.\nTiêu chuẩn III(C) Tính phù hợp đề cập đến trách nhiệm của Thành viên và Ứng viên trong việc đánh giá\nsự phù hợp của các khoản đầu tư cho từng khách hàng. Thành viên hoặc Ứng viên thực hiện điều này bằng cách nghiên cứu\nmục tiêu đầu tư cụ thể, các hạn chế và khả năng chấp nhận rủi ro của từng khách hàng, được so sánh với\nđặc điểm của từng khoản đầu tư được đề xuất. Cụ thể, Thành viên hoặc Ứng viên\nphải xác định tính phù hợp dựa trên mục tiêu, nhiệm vụ,\nvà các ràng buộc bằng văn bản của khách hàng trước khi thực hiện hành động đầu tư.\n(Lựa chọn A) Tính phù hợp của khoản đầu tư không chỉ dựa trên giá trị của một khoản đầu tư cụ thể mà\ncũng dựa trên mức độ phù hợp của khoản đầu tư đó trong tổng danh mục đầu tư của khách hàng.\n(Lựa chọn B) Đầu tư phí thấp được ưu tiên nếu chúng phù hợp và phù hợp. Tuy nhiên,\nlợi nhuận kỳ vọng cao nhất có thể gây ra rủi ro lớn hơn (tức là không thể đảm bảo lợi nhuận) so với mức mà\nkhách hàng sẵn sàng hoặc có khả năng chịu đựng và do đó có thể không phù hợp với khách hàng đó.\nNhững điều cần nhớ:\nTiêu chuẩn III(C) Sự phù hợp đề cập đến trách nhiệm của các Thành viên và Ứng viên trong việc đánh giá\nsự phù hợp của các khoản đầu tư khi có mối quan hệ tư vấn với một khách hàng. Điều này được thực hiện bằng cách\nnghiên cứu các mục tiêu đầu tư cụ thể, các hạn chế và khả năng chấp nhận rủi ro của khách hàng, cũng như\nđặc điểm của từng khoản đầu tư được đề xuất.\nXác định sáu thành phần của Quy tắc đạo đức và bảy Tiêu chuẩn ứng xử chuyên nghiệp\nLOS","qhtml":null},{"n":10,"q":"Kevin Smith, Level I CFA Candidate, has just finished the exam. Outside the test center, he\nposts on a popular CFA social media blog, \"The Level I CFA mocks are a joke!\", \"Be sure to\nmemorize ALL the convexity formulas!!!\" Hamza Bennani, who is also a Level I CFA\nCandidate, immediately responds by stating \"I hope I passed! The CFA Institute needs to\nprovide better exam prep materials as there were too many questions that I wasn't prepared\nfor!\"\nBased on Standard VII(A) Conduct as Participants in CFA Institute Programs, most likely :","opts":["only Smith violated the Standard.","only Bennani violated the Standard.","both Bennani and Smith violated the Standard."],"ans":"A","expl":"\"Thành viên và Ứng viên không được tham gia vào bất kỳ hành vi nào\nlàm tổn hại đến danh tiếng hoặc tính liêm chính của CFA\nViện hoặc chỉ định CFA hoặc tính chính trực, tính hợp lệ hoặc\nbảo mật của các chương trình của Viện CFA.\"\nTiêu chuẩn VII(A) Ứng xử với tư cách là Người tham gia các Chương trình của Viện CFA yêu cầu\nCác Thành viên và Thí sinh phải duy trì danh tiếng, tính toàn vẹn, tính hợp lệ và tính bảo mật của các kỳ thi và chương trình của Viện CFA. Tiêu chuẩn nghiêm cấm hành vi có thể làm tổn hại đến\nsự tự tin của công chúng về mức độ thành tích cần thiết để đạt được điều lệ CFA.\nThí sinh tham gia kỳ thi phải ký vào Cam kết của thí sinh, trong đó xác định các hành vi\nbị cấm trước, trong và sau kỳ thi. Những hành vi này bao gồm:\ncung cấp hoặc nhận thông tin về kỳ thi trước hoặc trong kỳ thi và\ncung cấp thông tin về kỳ thi cho người khác sau kỳ thi, bao gồm\ncác lĩnh vực chủ đề rộng rãi và các công thức đã được kiểm tra, cho đến khi thông tin đó được CFA\nInstitute công bố.\nTrong trường hợp này, Kevin Smith đã vi phạm Tiêu chuẩn khi cung cấp thông tin cụ thể\nliên quan đến công thức nào đã được thử nghiệm . Tuy nhiên, Hamza Bennani không vi phạm\nTiêu chuẩn vì anh ấy đã đưa ra nhận xét rất chung chung mà không đề cập đến bất kỳ lĩnh vực nghiên cứu hoặc nội dung kỳ thi nào\n.\n(Lựa chọn B và C) Thành viên và Thí sinh có thể bày tỏ ý kiến ​​về các kỳ thi hoặc\nHọc viện CFA mà không vi phạm Tiêu chuẩn, miễn là các ý kiến ​​đó không tiết lộ thông tin\ncụ thể về các kỳ thi. Smith và Bennani đã không vi phạm Tiêu chuẩn khi chỉ trích\nViện CFA.\nNhững điều cần nhớ:\nTiêu chuẩn VII(A) yêu cầu các Thành viên và Thí sinh không được tham gia vào các hành vi\nlàm suy yếu tính liêm chính của quy trình thi CFA. Điều này bao gồm việc tiết lộ thông tin\nbí mật, bao gồm các chi tiết cụ thể về các câu hỏi hoặc các lĩnh vực chủ đề rộng được kiểm tra trong kỳ thi\n, cho đến khi được Viện CFA công bố công khai.\nĐánh giá các thông lệ, chính sách và hành vi liên quan đến Quy tắc đạo đức và tiêu chuẩn của Viện CFA\nvề ứng xử nghề nghiệp\nLOS","qhtml":null},{"n":11,"q":"Sumit Ahuja, CFA, is an investor with limited knowledge of the biotech industry. Through an\nexpert network, he calls a physician at a prestigious hospital regarding broad trends in the\nbiotech industry. The physician names several companies that have high-profile drugs in the\nfinal stages of the government's publicly disclosed approval process. One of the companies is\nOrion Pharmaceuticals. After the call, as part of his thorough research on Orion, Ahuja\npurchases a newly released research report from Vijaya Dayal, a respected biotech analyst\nwho covers Orion. In her report, Dayal states that Orion's drug is likely to receive regulatory\napproval, based on her own opinion from thorough research. As a result, Ahuja purchases\nstock in Orion. Ahuja:","opts":["was in full compliance of the Standards.","violated the Standards by trading based on information received from the expert network.","violated the Standards by trading based on a research report that was not disseminated to the general public."],"ans":"A","expl":"\"Thành viên và Ứng viên sở hữu thông tin quan trọng không công khai\ncó thể ảnh hưởng đến giá trị của khoản đầu tư\nkhông được hành động hoặc khiến người khác hành động theo information.\"\nTiêu chuẩn II(A) yêu cầu Thành viên và Ứng viên không được thực hiện các hoạt động đầu tư nếu\nhọ có thông tin quan trọng không công khai (MNI) . Giao dịch dựa trên MNI làm xói mòn niềm tin vào\nsự công bằng của thị trường vốn và nghề đầu tư bằng cách duy trì ý tưởng rằng\nnhững người trong cuộc lợi dụng công chúng đầu tư để lừa dối. MNI có thể đến từ nhiều nguồn,\nbao gồm quản lý công ty và mạng lưới chuyên gia. Thành viên hoặc Ứng viên phải tự đánh giá\nthông tin đó để quyết định xem đó có phải là MNI hay không trước khi hành động.\nTrong câu hỏi này, bác sĩ mà Sumit Ahuja gọi qua mạng lưới chuyên gia cung cấp\nthông tin về các xu hướng chung của ngành, thông tin này không quan trọng vì nó không mang tính cụ thể của công ty.\nBác sĩ cũng cung cấp tên của các công ty sản xuất thuốc trong giai đoạn cuối của\nquy trình phê duyệt của chính phủ, là thông tin công khai. Do đó, Ahuja đã không nhận được\nMNI thông qua mạng lưới chuyên gia và không vi phạm Tiêu chuẩn khi hành động dựa trên nó (Lựa chọn B).\nMặc dù các báo cáo nghiên cứu từ các nhà phân tích bên bán, ngay cả những báo cáo dựa trên ý kiến, có thể\nquan trọng và không công khai, giao dịch dựa trên các báo cáo này không vi phạm Tiêu chuẩn nếu bất kỳ nhà đầu tư\n nào có thể mua chúng. Tính khả dụng như vậy có nghĩa là báo cáo được công khai ngay cả khi\nkhông được phổ biến công khai. Vì báo cáo mà Ahuja mua từ Vijaya Dayal được cung cấp cho tất cả các nhà đầu tư\n nên Ahuja đã không vi phạm Tiêu chuẩn khi thực hiện theo báo cáo đó (Lựa chọn C).\nNhững điều cần nhớ:\nTiêu chuẩn II(A) yêu cầu các Thành viên và Ứng viên không được thực hiện các giao dịch bằng cách sử dụng\nthông tin quan trọng không công khai (MNI). MNI có thể đến từ nhiều nguồn, bao gồm cả mạng lưới chuyên gia và quản lý\ncủa công ty. Các Thành viên và Ứng viên phải đánh giá thông tin để\nquyết định xem thông tin đó có quan trọng và không công khai hay không trước khi hành động.\nXác định hành vi phù hợp với Quy tắc và Tiêu chuẩn cũng như hành vi vi phạm Quy tắc và\nTiêu chuẩn\nLOS","qhtml":null},{"n":12,"q":"Jessica Meyer, CFA, is a portfolio manager at a large life insurance company. Meyer is a\nmember of the investment committee, which collectively makes investment decisions for the\ncompany's investment portfolio. Meyer is the team's emerging market specialist and was\nrecently assigned to analyze the investment prospects of a high-yield debt offering backed by\noil export revenues in an emerging market country.\nMeyer was tasked with this assignment as she is the most qualified to do the analysis, but she\npersonally believes the insurance portfolio should not invest in energy companies for\nenvironmental reasons. After considering all factors, in her final report to the committee,\nMeyer recommends not investing due to the considerable risk involved.\nAfter long and thorough deliberation, the committee votes to invest in the debt offering,\ndespite the acknowledged risk. A report is created detailing the discussion and listing all\ncommittee members present for the due diligence file. Based on Standard V(A) Diligence and\nReasonable Basis, Meyer should most likely :","opts":["do nothing.","disassociate herself from the report, as it does not align with her personal beliefs.","disassociate herself from the report, as it does not reflect her true investment opinion."],"ans":"A","expl":"\"Thành viên và Ứng viên phải:\n1. Thực hiện sự siêng năng, độc lập và kỹ lưỡng trong\nphân tích đầu tư, thực hiện đầu tư\nđề xuất và thực hiện các hành động đầu tư.\n2. Có cơ sở hợp lý và đầy đủ, được hỗ trợ bởi\nnghiên cứu và điều tra phù hợp, đối với mọi\nphân tích, khuyến nghị hoặc hành động đầu tư.\"\nCơ sở siêng năng và hợp lý theo tiêu chuẩn V(A) yêu cầu tất cả các phân tích đầu tư được thực hiện bởi\nCác Thành viên và Ứng viên phải hãy chăm chỉ và kỹ lưỡng. Cần phải nỗ lực hợp lý để\nđảm bảo tất cả các vấn đề thích hợp đều được xem xét khi đưa ra đề xuất.\nKhi việc phân tích và đề xuất đầu tư được thực hiện bởi một nhóm , không phải tất cả thành viên của\nnhóm đều phải đồng ý về kết luận. Những người có ý kiến bất đồng :\ncó thể giữ tên trong báo cáo và\nkhông bắt buộc phải tách ra nếu họ không đồng ý với đồng nghiệp miễn là họ\ntin rằng kết luận của nhóm có cơ sở hợp lý và đầy đủ .\nTrong trường hợp này, mặc dù Jessica Meyer không đồng ý với kết luận của nhóm, nhưng quy trình\ncủa nhóm là hợp lý và đầy đủ (tức là \"sự cân nhắc kỹ lưỡng và lâu dài\"). Việc quyết định của nhóm\nxung đột với niềm tin cá nhân của cô ấy là cơ sở không đầy đủ để tách ra.\nDo đó, Meyer không cần phải tách ra (Lựa chọn B và C) .\nNhững điều cần nhớ:\nCơ sở siêng năng và hợp lý theo tiêu chuẩn V(A) yêu cầu tất cả các phân tích đầu tư được thực hiện bởi\nThành viên và Ứng viên cần được nghiên cứu kỹ lưỡng. Khi phân tích đầu tư và\nđề xuất được thực hiện bởi một nhóm, những người có ý kiến ​​bất đồng không cần phải\ntách ra nếu họ tin rằng kết luận của nhóm có cơ sở hợp lý và đầy đủ.\nĐề xuất các phương pháp và quy trình được thiết kế để ngăn chặn hành vi vi phạm Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp\nLOS","qhtml":null},{"n":13,"q":"Regarding unethical behavior, overconfidence bias least likely leads to overestimating:","opts":["the morality of one's own behavior.","one's underlying intrinsic motivations.","external situational influences on one's behavior."],"ans":"C","expl":"Các yếu tố thách thức hành vi đạo đức\nNội bộ (niềm tin hoặc thành kiến) Bên ngoài (ảnh hưởng tình huống)\nNiềm tin rằng \"Tôi ở trên mức trung bình\" Phần thưởng tài chính\nSự tự tin quá mức Uy tín\nKhả năng hợp lý hóa Lòng trung thành với nhà tuyển dụng\nĐánh giá đạo đức có thể bị thách thức bởi các yếu tố bên trong hoặc bên ngoài. Các yếu tố bên trong là niềm tin\nhoặc những thành kiến ​​cản trở khả năng suy luận và phán đoán nhận thức. Một ví dụ phổ biến\nlà thành kiến ​​quá tự tin , khiến các cá nhân bỏ qua các yếu tố liên quan và\nthay vào đó, dựa vào niềm tin vào phán đoán đạo đức ưu việt của chính họ và động cơ nội tại\n(Lựa chọn A và B).\nYếu tố bên ngoài là ảnh hưởng tình huống, chẳng hạn như yếu tố văn hóa hoặc môi trường, mà\ncó thể khuyến khích hoặc ngăn cản phán đoán và hành vi đạo đức. Trong ngành đầu tư,\nnhững ảnh hưởng tình huống phổ biến thách thức hành vi đạo đức liên quan đến tiền bạc và uy tín.\nCác cá nhân có nhiều khả năng đánh giá thấp những ảnh hưởng của tình huống đối với hành vi của họ do\nthành kiến tự tin quá mức .\nNhững điều cần nhớ:\nThành kiến quá tự tin có thể khiến các cá nhân bỏ qua các yếu tố liên quan và thay vào đó, dựa vào a\nniềm tin vào phán đoán đạo đức ưu việt của chính họ. Các cá nhân có nhiều khả năng đánh giá thấp\nnhững ảnh hưởng của tình huống lên hành vi của họ do thành kiến ​​quá tự tin.\nXác định những thách thức đối với hành vi đạo đức\nLOS","qhtml":null},{"n":14,"q":"Sarah Paxton, CFA, works as an investment adviser at a bank. When a client is interested in\nbuying a home, she refers them to Susan Jones, a friend and real estate agent. Jones\nreciprocates by referring real estate clients to Paxton when appropriate. Since Paxton and\nJones are both skilled and respected professionals, each believes the referrals benefit their\nclients and are in the clients' best interest.\nAccording to Standard VI(C) Referral Fees, Paxton is most likely :","opts":["required to disclose this arrangement to both her employer and clients.","not required to disclose this arrangement because she believes the clients benefit.","not required to disclose this arrangement because no money is exchanged between Paxton and Jones"],"ans":"A","expl":"\"Các Thành viên và Ứng viên phải tiết lộ cho chủ lao động, khách hàng và\nkhách hàng tiềm năng của mình mọi khoản thù lao, cân nhắc hoặc\nlợi ích, nếu thích hợp nhận được từ hoặc được trả cho người khác để giới thiệu sản phẩm\nhoặc dịch vụ.\"\nPhí giới thiệu tiêu chuẩn VI(C) yêu cầu Thành viên và Ứng viên\nthông báo cho người sử dụng lao động, khách hàng hiện tại và khách hàng tiềm năng về những lợi ích nhận được\nkhi giới thiệu sản phẩm hoặc dịch vụ . Việc tiết lộ các thỏa thuận về phí giới thiệu cho phép\nchủ lao động và khách hàng xác định xem có xung đột lợi ích hay không và liệu đề xuất\ncó khách quan hay không. Phí giới thiệu được định nghĩa rộng rãi và bao gồm mọi phần thưởng tiền mặt hoặc\nkhông phải tiền mặt (ví dụ: vé tham dự một sự kiện thể thao).\nTrong câu hỏi này, Paxton đã ký một thỏa thuận với Jones để cùng giới thiệu khách hàng\nkhi thích hợp, điều này có lợi cho cả Paxton và Jones.\nDo đó, Paxton bắt buộc phải tiết lộ thông tin này cho cả hai\nchủ lao động của cô ấy và khách hàng mặc dù không liên quan đến chuyển tiền trực tiếp (Lựa chọn C) .\n(Lựa chọn B) Việc Paxton tin rằng khách hàng được hưởng lợi từ thỏa thuận này không\nngăn cản Paxton khỏi yêu cầu tiết lộ của Tiêu chuẩn.\nNhững điều cần nhớ:\nCác thành viên và Ứng viên phải thông báo cho người sử dụng lao động, khách hàng hiện tại và khách hàng tiềm năng\nvề bất kỳ lợi ích nào nhận được khi giới thiệu một sản phẩm hoặc dịch vụ. Việc tiết lộ này cho phép\nchủ lao động và khách hàng xác định xem có tồn tại xung đột lợi ích hay không.\nĐề xuất các biện pháp và quy trình được thiết kế để ngăn chặn hành vi vi phạm Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp\nLOS","qhtml":null},{"n":15,"q":"Regina Garcia, CFA, is the equity trader at Rushmore Advisors (RA), an institutional buy-side\nfirm. RA's normal business practice is to pay a standard commission rate of $0.02 per share\nfor all stock trades. This $0.02 commission pays for the cost of both research and trade\nexecution. RA has trading relationships with two firms: Execution Only, Inc. (EO), where RA\nhas committed to a minimum amount of soft dollar commissions to pay for research, and\nIntegrated Brokers, for all other trades.\nTrading activity has been lower than expected, and Garcia determines that the standard $0.02\nper share commission will be insufficient to cover the cost of RA's soft dollar commitments to\nEO for the year. To prevent a shortfall, Garcia allocates most trades to EO and increases the\ncommission rate paid to EO to $0.05 per share.\nAccording to Standard III(A) Loyalty, Prudence, and Care, did Garcia most likely violate the\nStandards?","opts":["Yes","No, since Garcia has a duty of loyalty to her employer","No, since soft dollar arrangements are acceptable under the Code and Standards"],"ans":"A","expl":"\"Thành viên và Ứng viên có nghĩa vụ trung thành với khách hàng của mình và phải hành động\nvới sự thận trọng hợp lý và đưa ra phán đoán thận trọng. Thành viên và\nỨng viên phải hành động vì vì lợi ích của khách hàng và đặt\nlợi ích tốt nhất của khách hàng lên trên lợi ích của chủ lao động hoặc lợi ích của chính họ.\"\nCác nhà quản lý đầu tư trả hoa hồng cho nhà môi giới để thực hiện giao dịch với khách hàng. Môi giới đô la mềm\nlà hoạt động sử dụng một phần hoa hồng môi giới để mua\nnghiên cứu đầu tư và các dịch vụ liên quan . Khi một phần hoa hồng được sử dụng để\nmua các dịch vụ đầu tư bổ sung (tức là đô la mềm), các dịch vụ đó sẽ \"thuộc về\" khách hàng\nvì khách hàng gián tiếp \"trả\" hoa hồng (tức là từ tài sản của khách hàng). Người quản lý đầu tư\ncó nghĩa vụ trung thành trong việc sử dụng những tài sản đó vì lợi ích của khách hàng.\nTrong trường hợp này, Garcia và người quản lý đầu tư đã vi phạm nghĩa vụ trung thành với\nkhách hàng bằng cách trả tỷ lệ hoa hồng cao hơn bình thường cho mục đích duy nhất là\ntạo hoa hồng bằng đô la mềm .\nKhách hàng sẽ không nhận được bất kỳ lợi ích bổ sung nào từ việc thanh toán hoa hồng cao hơn vì\nkhông có nghiên cứu bổ sung nào được cung cấp cho Rushmore Advisors (RA).\nLợi ích duy nhất của việc trả hoa hồng cao hơn là đáp ứng cam kết trước đó của RA với\nExecution Only, Inc., đây không phải là trách nhiệm của khách hàng.\n(Lựa chọn B) Garcia có nghĩa vụ trung thành với chủ của mình (tức là đảm bảo phân bổ\ntiền hoa hồng) nhưng không phải do khách hàng trả phí.\n(Lựa chọn C) Thỏa thuận đồng đô la mềm được chấp nhận theo Quy tắc và Tiêu chuẩn, nhưng\nkhông thể chấp nhận việc khách hàng trả hoa hồng môi giới cao hơn bình thường mà không có\nlợi ích tương xứng cho khách hàng.\nNhững điều cần nhớ:\nMôi giới bằng đô la mềm là hoạt động của sử dụng một phần hoa hồng môi giới để trả cho\nnghiên cứu đầu tư. Phần hoa hồng giao dịch được sử dụng để mua nghiên cứu\nđược coi là tài sản của khách hàng chứ không phải của người quản lý đầu tư. Người quản lý có nghĩa vụ\ntrung thành sử dụng tài sản này vì lợi ích của khách hàng.\nXác định hành vi phù hợp với Quy tắc và Tiêu chuẩn cũng như hành vi vi phạm Quy tắc và\nTiêu chuẩn\nLOS","qhtml":null},{"n":16,"q":"Xu Liang, CFA, is an equity portfolio manager of a large mutual fund. Liang's fund primarily\ninvests in large-cap, dividend-paying stocks that tend to be less volatile than the broad equity\nmarket.\nBernard Gerhardt is Liang's primary contact and salesperson at Trusted Brokers. Liang's firm\nis Trusted Brokers' largest client, and Liang's fund generates significant commission business.\nGerhardt approaches Liang regarding a private placement in Smart AI, an artificial intelligence\nsoftware company. During their conversation, Gerhardt comments that \"I know you don't\nnormally buy these things for the mutual fund, but Smart AI is priced so cheap that it could\neasily double in just a few months! You should consider investing personally.\"\nLiang conducts thorough due diligence and believes Smart AI is a great investment\nopportunity but not a good fit for the fund since it does not align with the fund's mandate and\nrisk profile. Therefore, Liang decides to personally invest in the private placement. According\nto Standard VI(B) Priority of Transactions, Liang most likely :","opts":["violated the Standard by personally investing in the private placement.","did not violate the Standard since the investment was inappropriate for the fund.","did not violate the Standard since the fund was given the opportunity to invest first."],"ans":"A","expl":"\"Giao dịch đầu tư cho khách hàng và nhà tuyển dụng phải được ưu tiên hơn\ngiao dịch đầu tư trong đó Thành viên hoặc Ứng viên là chủ sở hữu\nđược hưởng lợi.\"\nMức độ ưu tiên của Giao dịch theo Tiêu chuẩn VI(B) yêu cầu Thành viên và Ứng viên đặt\nlợi ích tài chính của khách hàng và người sử dụng lao động lên trước lợi ích tài chính của họ khi thực hiện các giao dịch đầu tư\nvà tránh ngay cả khi xuất hiện xung đột lợi ích. Việc\nsự tham gia của Thành viên hoặc Ứng viên vào các đợt phát hành riêng lẻ và phát hành lần đầu ra công chúng (IPO) đòi hỏi\ntiêu chuẩn chăm sóc đặc biệt cao.\nKhả năng xảy ra xung đột lợi ích là đáng kể hơn đối với nhân viên đầu tư tại các công ty đầu tư\nlớn. Nhân viên đầu tư (ví dụ: Liang) có thể được đưa ra những lời dụ dỗ đặc biệt, chẳng hạn như\nnhư quyền truy cập vào các vị trí riêng lẻ hoặc IPO, như hoàn vốn cho hoạt động kinh doanh (ví dụ: khách hàng lớn nhất)\nvới nhà môi giới (ví dụ: Nhà môi giới đáng tin cậy) cung cấp chứng khoán.\nMột mối lo ngại khác là khi vị trí riêng tư được công khai, sẽ có động cơ khuyến khích cho\nThành viên hoặc Ứng viên đã mua vào phát hành riêng lẻ và nắm giữ cổ phiếu của công ty hiện đã công khai\nđể chào bán và/hoặc mua chứng khoán cho khách hàng (hoặc, trong trường hợp này là cho quỹ)\ndù có phù hợp hay không.\nViệc tham gia vào các đợt phát hành riêng lẻ phải được giới hạn nghiêm ngặt trong các tình huống đặc biệt trong\nmà thậm chí không có khả năng xuất hiện xung đột lợi ích .\nDo đó, Liang đã vi phạm Tiêu chuẩn khi tự mình dính vào một tình huống có khả năng\ncó vẻ không phù hợp .\n(Lựa chọn B và C) Liang đã cân nhắc một cách thích hợp khoản đầu tư vào quỹ trước tiên và\nnhận thấy nó không phù hợp. Tuy nhiên, đây không phải là nơi xảy ra vi phạm.\nNhững điều cần nhớ:\nTiêu chuẩn VI(B) yêu cầu Thành viên và Ứng viên đặt lợi ích tài chính của khách hàng và nhà tuyển dụng\nlên lợi ích của chính họ khi thực hiện các giao dịch đầu tư. Việc tham gia vào các vị trí\nriêng tư phải được giới hạn nghiêm ngặt trong các tình huống đặc biệt mà trong đó không có khả năng\nthậm chí xuất hiện xung đột lợi ích.\nGiải thích cách thực hành, chính sách và hành vi vi phạm Quy tắc\nĐạo đức và Tiêu chuẩn ứng xử nghề nghiệp\nLOS","qhtml":null},{"n":17,"q":"Jalen Butler, CFA, is a research analyst for Principal Capital. As part of his research, Butler\nuses aggregated data generated from a variety of social media websites to track trends.\nPrincipal's compliance department updates its record retention policies annually, and therefore\nits most recent rules do not include several of the new websites used by Butler. Butler does\nnot retain the data generated from the websites outside of Principal's record retention list\nsince the information is on the internet and therefore is easily accessible. Has Butler most\nlikely violated the Standards?","opts":["Yes","No, since certain sources are not on Principal's record retention list","No, since he is not required to retain records of information that can be found on the internet"],"ans":"A","expl":"\"Các Thành viên và Ứng viên phải phát triển và duy trì các hồ sơ\nthích hợp để hỗ trợ các phân tích đầu tư, đề xuất,\nhành động và các thông tin liên lạc khác liên quan đến đầu tư của họ với khách hàng\nvà khách hàng tiềm năng.\"\nViệc lưu giữ hồ sơ tiêu chuẩn V(C) yêu cầu các thành viên và ứng viên lưu giữ hồ sơ về\nnghiên cứu cũng như động cơ cho hành động và đề xuất của họ. Mặc dù hồ sơ được\ncoi là tài sản của công ty và Tiêu chuẩn đặt ra một số trách nhiệm về việc lưu giữ hồ sơ\ncho công ty, nhưng các Thành viên và Ứng viên có trách nhiệm cuối cùng trong việc hỗ trợ\ncông ty thu thập và lưu giữ thông tin này, ngay cả khi mọi người có thể dễ dàng truy cập thông tin đó thông qua\ninternet. Các nguồn yêu cầu lưu giữ bao gồm:\nCuộc trò chuyện với khách hàng\nGhi chú từ các cuộc gọi thu nhập\nPhân tích thống kê (tức là bảng tính)\nBáo cáo bằng văn bản\nTruyền thông điện tử (ví dụ: văn bản, email)\nTruyền thông truyền thông (ví dụ: nguồn cấp dữ liệu Twitter, blog)\nĐưa ra Những thay đổi thường xuyên trong bối cảnh truyền thông kỹ thuật số, các chính sách lưu giữ hồ sơ của các công ty\nthường làm chậm quá trình tạo và phổ biến các nguồn thông tin mới. Điều này đặt gánh nặng\nlưu giữ liên quan đến các loại phương tiện này lên Thành viên hoặc Ứng viên nặng nề hơn\ncông ty. Trong câu hỏi này, Jalen Butler được yêu cầu lưu giữ hồ sơ của mình từ tất cả các trang web truyền thông xã hội\n, cho dù có nằm trong danh sách lưu giữ của công ty hay không. Không làm như vậy sẽ vi phạm\nTiêu chuẩn (Lựa chọn B) .\n(Lựa chọn C) Mặc dù phương tiện truyền thông thường có thể truy cập dễ dàng trên internet,\nthông tin cũng có thể bị xóa khỏi trang web, vì vậy Thành viên và Ứng viên bắt buộc phải\ngiữ lại thông tin này.\nNhững điều cần nhớ:\nTiêu chuẩn V(C) Record Retention yêu cầu các thành viên và ứng viên lưu giữ hồ sơ về\nnghiên cứu cũng như động cơ cho hành động và đề xuất của họ. Các Thành viên và Ứng viên\nchịu trách nhiệm cuối cùng trong việc hỗ trợ công ty thu thập và lưu giữ thông tin này. Do\nnhững thay đổi thường xuyên trong bối cảnh truyền thông kỹ thuật số, gánh nặng lưu giữ các loại\nphương tiện truyền thông này đè nặng lên các Thành viên và Ứng viên hơn là các công ty.\nThể hiện việc áp dụng Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp cho\ncác tình huống liên quan đến vấn đề liêm chính nghề nghiệp\nLOS","qhtml":null},{"n":18,"q":"Aditi Kumar is a Level II Candidate and a performance measurement and attribution analyst\nfor an investment manager. On a quarterly basis, Kumar produces performance reports that\ninclude the firm's composites for each investment strategy.\nRaheem Khan, CFA, the portfolio manager of the firm's large-cap equity strategy approaches\nKumar regarding the large-cap equity composite for the most recent quarter. Kumar explains\nthat several accounts in the composite should be excluded from this quarter's performance\nreport due to a software issue that resulted in numerous accounts not being fully invested.\nThe resulting cash drag caused the composite to underperform the benchmark index for the\nquarter and year.\nKhan explains that he should not be held responsible for a software error. Kumar agrees and\nproduces new reports without the affected accounts. According to Standard I(C)\nMisrepresentation, it is most likely that:","opts":["no violation occurred.","only Kumar violated the Standard.","both Kumar and Khan violated the Standard."],"ans":"C","expl":"\"Thành viên và Ứng viên không được cố ý đưa ra bất kỳ thông tin sai lệch nào liên quan đến\nphân tích đầu tư, khuyến nghị, hành động hoặc các hoạt động chuyên môn khác.\"\nTiêu chuẩn I(C) Việc trình bày sai bảo vệ nhà đầu tư trước những tuyên bố và thông tin\ndo cộng đồng đầu tư cung cấp có thể làm suy yếu niềm tin của nhà đầu tư vào tính liêm chính của nghề\n. Trình bày sai có thể bao gồm:\nĐạo văn: trích dẫn thông tin mà không ghi nhận hoặc trích dẫn nguồn\nThiếu sót: trình bày thông tin không đầy đủ hoặc gây hiểu nhầm\nPhóng đại: thổi phồng bằng cấp chuyên môn hoặc kết quả thực hiện\nĐo lường hiệu suất và ghi công là một lĩnh vực dễ bị tiết lộ có chọn lọc và\nbỏ sót. Một ví dụ điển hình là khái niệm \"hái quả anh đào\", bao gồm việc chỉ chọn\nnhững khoản tiền hoặc tài khoản tốt nhất hoặc bỏ qua những khoản tệ nhất để báo cáo hiệu suất. Việc bỏ sót\ntài khoản hoặc thay đổi cấu trúc hỗn hợp bên ngoài một quy trình được xác định rõ ràng có thể dẫn đến\ntrình bày sai hiệu suất của hỗn hợp.\nTrong trường hợp này, Khan đã thuyết phục Kumar thay đổi cấu trúc hỗn hợp do sự cố phần mềm\nmột lần, giúp cải thiện hiệu suất của hỗn hợp. Do đó, cả Kumar và\nKhan đều vi phạm Tiêu chuẩn bằng cách trình bày thông tin không đầy đủ hoặc sai lệch\n(Lựa chọn A và B) .\nMặc dù vấn đề phần mềm có thể không phải lỗi của Khan nhưng việc thay đổi các thành phần\ntổng hợp để bỏ qua các tài khoản bị ảnh hưởng đều vi phạm Tiêu chuẩn. Ngoài ra, việc Kumar\nchưa phải là chủ hợp đồng không liên quan trong trường hợp này vì anh ấy, với tư cách là Ứng viên, được yêu cầu\ntuân thủ Quy tắc và Tiêu chuẩn.\nNhững điều cần nhớ:\nĐo lường hiệu suất và phân bổ là một lĩnh vực dễ bị tiết lộ có chọn lọc,\nthiếu sót và cường điệu. \"Hái anh đào\" liên quan đến việc chỉ chọn những khoản tiền hoặc tài khoản\ntốt nhất hoặc bỏ qua những khoản tồi tệ nhất để báo cáo hiệu suất. Việc bỏ sót tài khoản hoặc thay đổi\ncấu trúc tổng hợp bên ngoài một quy trình được xác định rõ ràng có thể dẫn đến trình bày sai\nhiệu suất tổng hợp.\nXác định hành vi tuân thủ Quy tắc và Tiêu chuẩn cũng như hành vi vi phạm Quy tắc và\nTiêu chuẩn\nLOS","qhtml":null},{"n":19,"q":"Elise Berger, CFA, is sell-side analyst for Brick Wall Bank (BWB). Based on BWB's process,\nBerger sends her research reports through email to all clients simultaneously. BWB's largest\nclient, Standard Capital, offers to pay higher commissions to BWB for follow-up phone calls\nfrom Berger when she releases new research. BWB and Berger agree to this arrangement.\nBerger plans to offer this deal only to BWB's next nine largest clients since only they do\nenough business with BWB to afford the new service at the new, higher level of commission.\nWhich of the following best describes Berger's options under the Code and Standards?","opts":["Offer the higher level of service as planned","Not offer different levels of service to her customers","Offer the higher level of service only if it is offered to all clients"],"ans":"C","expl":"\"Thành viên và Ứng viên phải đối xử công bằng và khách quan\nvới tất cả khách hàng khi cung cấp phân tích đầu tư, đưa ra\nđề xuất đầu tư, thực hiện hành động đầu tư hoặc\ntham gia vào các hoạt động nghề nghiệp khác.\"\nGiao dịch công bằng theo tiêu chuẩn III(B) yêu cầu Thành viên và Ứng viên phải đối xử công bằng với tất cả khách hàng khi\nđề xuất đầu tư hoặc thực hiện các hoạt động đầu tư thay mặt họ. Các thành viên và\nỨng viên phải đảm bảo các đề xuất đầu tư của họ được phổ biến theo cách\ncung cấp cho tất cả khách hàng cơ hội công bằng để hành động theo mọi đề xuất.\nTuy nhiên, \"công bằng\" không có nghĩa là \"bình đẳng\". Tiêu chuẩn cho phép các công ty và nhà phân tích\ncung cấp mức dịch vụ cao hơn cho những khách hàng sẵn sàng trả phí (Lựa chọn B) . Các\ncác dịch vụ này:\nkhông được gây bất lợi hoặc ảnh hưởng tiêu cực đến các khách hàng khác và\nphải được tiết lộ và cung cấp cho tất cả khách hàng cũng như khách hàng tiềm năng.\nTrong trường hợp này, Berger có kế hoạch cung cấp mức dịch vụ cao hơn (tức là các cuộc gọi tiếp theo) chỉ cho mười khách hàng lớn nhất của Brick Wall Bank (BWB). Vì cô ấy không có ý định cung cấp dịch vụ này cho\ncác khách hàng khác nên cô ấy đã vi phạm Tiêu chuẩn. Mặc dù các khách hàng khác hiện không\nkinh doanh đủ với BWB để đủ khả năng chi trả cho dịch vụ, nhưng họ có thể muốn hợp tác kinh doanh nhiều hơn với BWB hoặc\ntrả hoa hồng cao hơn nếu dịch vụ bổ sung được cung cấp cho họ (Lựa chọn A) . Việc không\ntiết lộ dịch vụ cho họ khiến họ không có lựa chọn nào khác.\nNhững điều cần nhớ:\nGiao dịch công bằng theo Tiêu chuẩn III(B) yêu cầu các Thành viên và Ứng viên là nhà phân tích phải đảm bảo\ncác đề xuất đầu tư của họ được phổ biến một cách công bằng. Các cấp độ dịch vụ khác nhau dành cho\nkhách hàng được phép nếu các dịch vụ đó không gây bất lợi hoặc ảnh hưởng tiêu cực đến các khách hàng khác và\nđược tiết lộ và cung cấp cho tất cả khách hàng cũng như khách hàng tiềm năng.\nKhuyến nghị các biện pháp và quy trình được thiết kế để ngăn chặn hành vi vi phạm Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp\nLOS","qhtml":null},{"n":20,"q":"Ajay Patel, CFA, is a financial adviser for Eclipse Financial. At a party, Patel discusses financial\nadvisory services with Nira Jain. Jain asks Patel to be her adviser, but Patel states that he\ncannot accept new clients. Patel recommends Eclipse and states that he has faith in all the\ncompany's advisers. Jain agrees to become a client of Eclipse if Patel agrees to meet with her\nquarterly over dinner, paid for by Jain, to discuss her portfolio allocation. Which of the\nfollowing best describes Patel's options under the Code and Standards?","opts":["Patel must reject the offer","Patel can accept the offer but then must disclose it immediately to Eclipse in writing","Patel can accept the offer only after disclosing it in writing to Eclipse and receiving approval in writing"],"ans":"C","expl":"\"Thành viên và Ứng viên không được nhận quà tặng, lợi ích,\nbồi thường hoặc tiền thưởng cạnh tranh hoặc có thể\nmột cách hợp lý tạo ra xung đột lợi ích với\nlợi ích của chủ lao động trừ khi họ nhận được sự đồng ý bằng văn bản\ntừ tất cả các bên liên quan.\"\nThỏa thuận bồi thường bổ sung Tiêu chuẩn IV(B) yêu cầu Thành viên và Ứng viên phải\ncó được sự cho phép bằng văn bản khi các thỏa thuận bồi thường bổ sung của bên thứ ba có thể\nđược coi một cách hợp lý là tạo ra xung đột với chủ lao động của họ. Phải nhận được sự cho phép\ntừ tất cả các bên trước khi thỏa thuận có thể được chấp nhận . Tiêu chuẩn áp dụng cho cả\ntiền thù lao và phi tiền tệ (ví dụ: quà tặng, phúc lợi).\nTrong trường hợp này, việc chấp nhận lời đề nghị của Jain thanh toán các bữa tối hàng quý để thảo luận về việc phân bổ danh mục đầu tư\ncó thể được coi là xung đột lợi ích vì hành động của Patel có thể được coi là\nđối xử ưu đãi với Jain. Lời khuyên của anh ấy có thể được coi là ưu ái Jain hơn các khách hàng\ncủa chính anh ấy và có thể đi ngược lại lời khuyên do các cố vấn khác của Eclipse đưa ra. Để tuân thủ\nTiêu chuẩn, Patel phải có được sự cho phép bằng văn bản của cả Jain và Eclipse\ntrước khi chấp nhận lời đề nghị để Eclipse có thể giám sát hành động của anh ấy.\n(Lựa chọn A) Patel không bắt buộc phải từ chối lời đề nghị miễn là anh ấy có được sự cho phép bằng văn bản\ntừ tất cả các bên liên quan để chủ nhân của anh ấy có thể giám sát các xung đột.\n(Lựa chọn B) Việc thông báo cho Eclipse sau khi chấp nhận lời đề nghị là vi phạm Tiêu chuẩn. Patel\nphải nhận được sự cho phép trước khi đồng ý để Eclipse có thể quyết định xem thỏa thuận có gây ra\nxung đột hay không.\nNhững điều cần nhớ:\nTiêu chuẩn IV(B) yêu cầu các Thành viên và Ứng viên phải có được sự cho phép bằng văn bản khi bên thứ ba\n, các thỏa thuận thù lao bổ sung có thể được coi là hợp lý khi tạo ra xung đột\nvới người sử dụng lao động của họ. Phải nhận được sự cho phép từ tất cả các bên trước khi thỏa thuận\nđược chấp nhận.\nThể hiện việc áp dụng Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp trong\ncác tình huống liên quan đến vấn đề liêm chính nghề nghiệp\nLOS","qhtml":null},{"n":21,"q":"Firm X acquires Firm Y. Both firms have historically claimed GIPS compliance. In the\nacquisition, all of Firm Y's portfolio managers have been retained by Firm X but most of the\nresearch and support staff have not. The research duties will be assumed by Firm X's existing\nstaff. According to the GIPS standards, can Firm X link Firm Y's past performance with its\nown?","opts":["No.","Yes, since Firm X has acquired Firm Y.","Yes, since the portfolios' management remains the same."],"ans":"A","expl":"Tiêu chuẩn Hiệu suất Đầu tư Toàn cầu (GIPS®) là một cách tiếp cận được tiêu chuẩn hóa để\ntrình bày hiệu quả đầu tư. Việc tuân thủ GIPS chỉ áp dụng trên cơ sở toàn công ty (nghĩa là không phải\nở cấp độ tổng hợp và/hoặc quỹ). Khi một công ty mới được thành lập hoặc một công ty hiện có được mua lại,\nHiệu suất tuân thủ GIPS trước đây hoặc hiện tại của công ty có thể được liên kết với (nghĩa là\nđược gi
