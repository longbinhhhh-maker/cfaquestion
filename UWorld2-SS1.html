ype of selective disclosure is not a violation of the Standard (Choices A and B) .\nHowever, by agreeing to be part of the select group receiving the information, Bo Wang has a\nduty to keep this information confidential until it is released publicly by the company. Even\nthough Wang did not directly disclose the MNI, he violated the Standard by using his\nknowledge of MNI to influence others to act based on this information. Acting on MNI is\nnot limited strictly to that company's securities (eg, ES), any trading based on MNI is a\nviolation of the Standard .\nThings to remember:\nStandard II(A) Material Nonpublic Information requires Members and Candidates to abstain\nfrom making transactions using material nonpublic information (MNI). MNI can come from\nmany sources, including company management. Any trading based on MNI is a violation of\nthe Standard.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and\nStandards\nLOS", "qhtml": null}, {"n": 23, "q": "Chen Hong, CFA, is an independent investment advisor. Through a referral from an existing\nclient, Chen contacts Zhao Qiuping. Chen briefly meets with Zhao, who is leaving for vacation\nthe next day. Zhao agrees to be Chen's client and sends him money that is currently in her\nsavings account. They are not able to discuss the details of Zhao's financial circumstances\nand objectives at the meeting, but Zhao tells Chen that he can invest the money however he\nsees fit and agrees that they will meet again to create a detailed investment policy statement\nwhen Zhao returns.\nChen invests a portion of Zhao's funds in several stocks of companies that Chen has invested\nin other clients' funds, since Chen believes the stock prices will increase and Chen does not\nwant Zhao to miss out. By the time Zhao returns, her investment portfolio is up 4%. With\nregards to Zhao's investments, Chen:", "opts": ["was in full compliance with the Standards.", "violated the Standards by not getting approval from Zhao for each investment.", "violated the Standards by investing Zhao's funds before gathering appropriate information."], "ans": "C", "expl": "\"When Members and Candidates are in an advisory relationship with a client,\nthey must:…\na. Make a reasonable inquiry into a client's or prospective client's investment\nexperience, risk and return objectives, and financial constraints prior to\nmaking any investment recommendation or taking investment action and\nmust reassess and update this information regularly.\nb. Determine that an investment is suitable to the client's financial situation\nand consistent with the client's written objectives, mandates, and constraints\nbefore making an investment recommendation or taking investment action.\"\nStandard III(C) Suitability requires Members and Candidates that are advisors to\nproperly assess the suitability of each potential investment for each client before making\ninvestment decisions. To do this, an advisor must first gather information on each client's\nspecific investment goals, constraints, and risk tolerance. This information is used to develop\nan investment policy statement (IPS), which is then used to develop an appropriate\ninvestment program for the client.\nWithout gathering and understanding the appropriate information, an advisor has no way of\nknowing if specific investments meet criteria for suitability for the client.\nTherefore, investing a client's assets before gathering appropriate information\nviolates the Standard . In this scenario, Chen invests Zhao's assets before getting\ninformation on Zhao's financial circumstances and objectives. Even though Zhao said to\ninvest her assets however Chen saw fit, Chen had no way to know if the investments were\nsuitable for Zhao. Therefore, Chen violated the Standards (Choice A) .\n(Choice B) Members and Candidates do not need client approval for every specific\ninvestment to adhere to the Standard. Once the IPS is created, the advisors can invest within\nthe confines of the IPS without approval for each investment.\nThings to remember:\nStandard III(C) Suitability requires Members and Candidates that are advisors to properly\nassess the suitability of each potential investment for each client before making investment\ndecisions. Without an IPS, suitability cannot be determined. Therefore, investing a client's\nassets before an IPS is developed violates the Standard.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards\nof Professional Conduct\nLOS", "qhtml": null}, {"n": 24, "q": "Aline Costa, CFA, is a financial advisor for Solar Bank. At a conference, Costa meets Juanita\nCarvalho, a portfolio manager for Lunar Financial. Carvalho tells Costa about a propriety\nquantitative model developed by Lunar that aims to predict interest rate changes. Costa reads\nLunar's sales literature on the model to understand how it works, its assumptions, and its\ntesting parameters, which included both extreme positive and negative scenarios. Of the\nfollowing, Costa can most appropriately begin integrating the model into her research process:", "opts": ["immediately.", "after thoroughly testing the model herself.", "after taking the time to learn the technical aspects of the model."], "ans": "B", "expl": "\"Members and Candidates must:\n1. Exercise diligence, independence, and thoroughness in\nanalyzing investments, making investment recommendations,\nand taking investment actions.\n2. Have a reasonable and adequate basis, supported by\nappropriate research and investigation, for any investment\nanalysis, recommendation, or action.\"\nStandard V(A) Diligence and Reasonable Basis requires Members and Candidates that are\nadvisors to conduct thorough due diligence when analyzing investments. The Standard\nrequires that the due diligence on quantitative models be as thorough as all other\naspects of the investment recommendation process. The Member or Candidate must:\nunderstand how the model works and be able to explain it to clients,\nunderstand the model's assumptions and limitations, and\nthoroughly test the model.\nEven if the model was already tested by third-party developers, Members and Candidates\nshould test the model before incorporating it into their research process or\nrecommendations. This ensures that the model was properly tested (Choice A) . Data used\nin testing should encompass all performance and volatility expectations.\n(Choice C) The model's developers must understand all the technical aspects of the model\n(eg, equations, variables). However, users are not required to have as deep an\nunderstanding, as long as they understand its assumptions and limitations and are able to\nexplain the model to clients.\nThings to remember:\nWhen Members and Candidates use quantitative models as part of their investment process,\nthe Standard requires that the due diligence on the model be as thorough as all other aspects\nof the process. The model's users must understand how the model works well enough to\nexplain it to clients and to thoroughly test the model.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to\nsituations involving issues of professional integrity\nLOS", "qhtml": null}, {"n": 25, "q": "Whitney Hill, CFA, has notified her manager at Mercury Bank of her plans to leave Mercury and\njoin Saturn Bank in two weeks. Hill is contacted by a potential client, Brewster Payne, looking\nto invest with an investment management firm. Hill is careful not to disclose that she is\nleaving Mercury, though she tells Payne to wait a few weeks and they can revisit the\ndiscussion.\nAfter leaving Mercury and joining Saturn, Hill calls several of Mercury's clients that she is able\nto find contact information for using public records; she does not contact Payne. Assuming\nHill did not sign a noncompete agreement with Mercury, did she violate the Code and\nStandards?", "opts": ["No.", "Yes, by not trying to recruit Payne for Mercury.", "Yes, by soliciting existing Mercury clients after joining Saturn."], "ans": "B", "expl": "\"In matters related to their employment, Members and Candidates\nmust act for the benefit of their employer and not deprive their\nemployer of the advantage of their skills and abilities, divulge\nconfidential information, or otherwise cause harm to their employer.\"\nStandard IV(A) Loyalty requires Members and Candidates to protect the interests of their\nemployers. When planning to leave an employer, Members and Candidates must continue\nto act in their current employer's best interest . This includes recruiting prospective\nclients to the current employer and not contacting the employer's clients and prospective\nclients with the purpose of soliciting business for their own independent business or another\nfirm.\nAfter leaving an employer, a Member or Candidate may contact their former\nemployer's clients , so long as the contact information is found using public records (eg, the\ninternet) and not from records that are property of the old firm. Additionally, the Member or\nCandidate must ensure that they do not have a noncompete agreement with the former\nemployer that would prohibit them from contacting the former employer's clients.\nIn this scenario, Whitney Hill violates the Standard by not trying to recruit Brewster Payne for\nMercury Bank. By asking Payne to wait a few weeks before revisiting the conversation (at\nwhich time she would be at Saturn Bank), she is not acting in the best interest of Mercury and\ntherefore violates the Standard, even though she does not try to recruit Payne as a client for\nher new firm (Choice A) .\n(Choice C) Since Hill did not sign a noncompete agreement, she did not violate the Standard\nby using public records to contact Mercury's clients after leaving.\nThings to remember:\nStandard IV(A) Loyalty requires Members and Candidates to protect the interests of their\nemployers. When planning to leave an employer, a Member or Candidate must continue to act\nin their employer's best interest. After leaving an employer, a Member or Candidate may\ncontact their former employer's clients if the contact information is found using public records\nand they do not have a noncompete agreement.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of\nEthics and Standards of Professional Conduct\nLOS", "qhtml": null}, {"n": 26, "q": "Alexander Petrov, CFA, regularly posts investment ideas and videos on several popular social\nmedia investment forums. Petrov has developed a sizable following that often immediately\nreacts to his recommendations.\nPetrov buys a significant number of shares in a micro-cap mining stock. He then posts to his\nfollowers on several social media platforms that he has a large position in this stock. Petrov\nthen starts a rumor stating that \"the company is likely to be acquired at a substantial premium\nto the current price in the near future.\" The stock immediately jumps 20% and Petrov sells\nmost of his shares over the rest of the trading day.\nAccording to Standard II(B) Market Manipulation, Petrov most likely violated the Standard by:", "opts": ["starting a rumor.", "selling his shares.", "buying before his followers."], "ans": "A", "expl": "\"Members and Candidates must not engage in practices that\ndistort prices or artificially inflate trading volume with the\nintent to mislead market participants.\"\nStandard II(B) Market Manipulation prohibits activities by Members or Candidates that\ndistort securities prices. Manipulation can occur through:\ninformation-based activities , such as spreading false rumors , or\ntransaction-based activities , such as exaggerated trading between two accounts.\nManipulation can lead to a loss of trust in the fairness and integrity of the markets. The\nMember's or Candidate's intent determines whether he or she has violated the Standard .\nActions that move security prices but were not intended to deceive market participants do not\nviolate the Standard.\nIn this scenario, Alexander Petrov violated the Standard by intentionally spreading false\nrumors to manipulate the price of the stock. Petrov's behavior is a classic example of a\n\"pump and dump\" scheme, in which someone accumulates a thinly traded and therefore easily\nmanipulated stock, fabricates a story to boost the price, and then sells those shares to the\nnew investors who \"buy\" the story and the stock.\n(Choices B and C) It is not a violation to buy securities ahead of publicly announcing a\nposition or selling shares after a stock appreciates. The violation centered around\nPetrov's intent to manipulate by specifically spreading a rumor to artificially boost the stock\nprice.\nThings to remember:\nStandard II(B) Market Manipulation prohibits information-based and transaction-based\nactivities that distort security prices. The intent of the action is the factor that determines\nwhether a Member or Candidate violated the Standard.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and\nStandards\nLOS", "qhtml": null}, {"n": 27, "q": "Latha Mani, CFA, manages an index fund with a small-cap growth mandate. The fund is\nowned by Alpha Investments and has thousands of investors. Mani's primary duty of loyalty is\nto:", "opts": ["the investors in the fund.", "operate the fund to its mandate.", "Alpha Investments' shareholders."], "ans": "B", "expl": "\" Members and Candidates have a duty of loyalty to their clients and\nmust act with reasonable care and exercise prudent judgment.\nMembers and Candidates must act for the benefit of their clients and\nplace their client's interests before their employer's or their own\ninterests.\"\nStandard III(A) Loyalty, Prudence, and Care requires Members and Candidates to be loyal to\ntheir clients and to use prudence and care when making investment decisions on a client's\nbehalf. This first step is properly identifying the client. For Members and Candidates in an\nadvisory role, the client is the service's investors or beneficiaries. In cases where\nthe Member or Candidate is a fund manager , the client is not an investor or\nbeneficiary but the investment fund and its mandate .\nIn this scenario, Latha Mani manages an index fund with a specific mandate. Although the\nfund has investors, those investors may enter and exit the fund of their own accord. Mani is\nnot their advisor and therefore does not owe them her loyalty (Choice A) . Mani must be\nloyal to managing the fund to its mandate since investors have made investment decisions\nbased on the expectation of using Mani's fund to gain exposure to small cap growth stocks.\nDeviating from that mandate would breach clients' trust.\n(Choice C) Although Mani owes loyalty to her employer and its shareholders, clients or fund\ninvestors take precedence before employers. Therefore, Mani's primary duty of loyalty is\nowed to managing the fund to its mandate.\nThings to remember:\nStandard III(A) Loyalty, Prudence, and Care requires Members and Candidates to be loyal to\ntheir clients, which first requires identifying the client. In cases where the Member or\nCandidate is not an advisor, the client may not be an entity but an investment mandate. In\nthose cases, the loyalty is owed to investing the fund to that mandate.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to\nsituations involving issues of professional integrity\nLOS", "qhtml": null}, {"n": 28, "q": "Company 1 and Company 2 are close competitors headquartered in different countries.\nCompany 1 reports under IFRS, while Company 2 reports under US GAAP. An analyst gathers\ninformation on two identical long-term assets owned by each company that are being tested\nfor impairment.\nCompany 1 Company 2\n(USD millions)\n(IFRS) (US GAAP)\nCarrying amount 20 20\nSum of undiscounted expected future cash flows 18 18\nSum of discounted expected future cash flows 16 16\nFair value if sold 17 17\nCost to sell 2 2\nBased on this information, which of the following accounting treatments is correct?", "opts": ["Company 2's impairment loss is USD 2 million.", "Company 2's impairment loss is USD 3 million.", "Company 1's impairment loss is USD 5 million."], "ans": "B", "expl": "Elements pertaining to an impairment loss\nIFRS US GAAP\nAsset is impaired Carrying amount > Max [(Fair value − Cost to Carrying amount > Sum of\nif: sell), Sum of discounted CFs] undiscounted CFs\nImpairment loss Carrying amount − Max [(Fair value − Cost to Carrying amount − Fair value if\n= sell), Sum of discounted CFs] sold\nNew carrying Max [(Fair value − Cost to sell), Sum of\nFair value if sold\namount discounted CFs]\nAn asset is impaired when its market value (ie, recoverable amount) declines below its book\nvalue (ie, carrying amount). If impairment occurs, the company will record an impairment\nloss and reduce the asset's carrying amount. IFRS and US GAAP require different protocols\nfor impairment testing and for estimating impairment loss. Under IFRS, the recoverable\namount is the greater of the fair value less the cost to sell and the sum of discounted cash\nflows.\nIFRS US GAAP\n20 > [max (17 − 2), 16] 20 > 18\nImpairment\n20 > 16 = true, so impairment = 20 > 18 = true, so impairment =\ntest\nyes yes\nImpairment\n20 − 16 = 4 20 − 17 = 3\nloss\nUnder US GAAP , the recoverable amount is the sum of the undiscounted expected\nfuture cash flows , which is 18 in this scenario. Since 18 is less than the carrying amount of\n20, the asset is impaired. The impairment loss is the asset's carrying amount less its fair\nvalue , which is 3. Company 2 would revise the carrying amount of the asset to its fair value\nof 17 and report a loss of 3.\n(Choice A) Under US GAAP, the impairment loss is the carrying amount less the fair value.\nThe sum of undiscounted cash flows is used only in the impairment test.\n(Choice C) A loss of 5 results from Company 1 incorrectly assigning the recoverable amount\nas the fair value less the cost to sell, which is less than the sum of discounted cash flows in\nthis scenario.\nThings to remember:\nUnder IFRS, the recoverable amount is the greater of the fair value less the cost to sell and\nthe sum of discounted cash flows, and the impairment loss is the difference between the\ncarrying and recoverable amounts. Under US GAAP, the recoverable amount is the sum of the\nundiscounted expected future cash flows, and the impairment loss is the difference between\nthe carrying amount and fair value. The future cash flows are used to test for impairment but\nnot to calculate the impairment amount.\nExplain and evaluate how impairment and derecognition of property, plant, and equipment and\nintangible assets affect the financial statements and ratios\nLOS", "qhtml": null}, {"n": 29, "q": "An analyst runs a simple linear regression with 30 observations, and the ANOVA table shows\nthat the sum of squares total (SST) is 26,255. If the correlation between both the dependent\nand independent variables is 0.80, the standard error of the estimate ( s ) is closest to:\ne", "opts": ["13.69", "17.75", "18.37"], "ans": "C", "expl": "A linear regression evaluates the relationship between two or more variables , plotting a\nstraight line that best fits the data, to explain the variation of the dependent variable Y , often\ncalled the sum of squares total (SST) (ie, SSE + SSR). Some measures calculated from the\nANOVA table are used to evaluate the goodness of fit of the regression.\n2)\nThe coefficient of determination ( R measures the proportion of the change in Y explained by\n2\nthe independent variable X . R is calculated as SSR / SST and equals the square of\nthe pairwise correlation ( r ) between these variables. In this situation, r = 0.80 and SST =\n26,255. Therefore:\n2 r2 0.802\nR = = = 0.64\nSSR / SST = 0.64 ⇒ SSR = 0.64 × 26,255 = 16,803\nSSE = SST − SSR ⇒ SSE = 26,255 − 16,803 = 9,452\nThe standard error of the estimate ( s ) measures the accuracy of the regression, is\ne\npresented in the same units as the dependent variable, and is calculated as the square root of\nthe mean square error (MSE). Since the regression has 30 observations:\nMSE = SSE / ( n − 2) = 9,452 / 28 = 337.6\ns = √ MSE = √337.6 = 18.37\ne\n2 2\n(Choice A) 13.69 results from calculating R as r (= 0.80) instead of r (= 0.64).\n(Choice B) 17.75 results from dividing SSE by n (= 30) instead of degrees of freedom (=\n28).\nThings to remember:\nSome measures calculated from the ANOVA table are used to evaluate the goodness of fit of a\nlinear regression. The coefficient of determination measures the proportion of the change\nin Y explained by X . The standard error of the estimate is calculated as the square root of the\nmean square error.\nDescribe the use of analysis of variance (ANOVA) in regression analysis, interpret ANOVA results,\nand calculate and interpret the standard error of Estimate in a simple linear regression\nLOS", "qhtml": null}, {"n": 30, "q": "Which of the following is least likely to be a challenge to deepening regional trade integration?\nA member country's:", "opts": ["fiscal credibility.", "mobility of labor and capital.", "preference not to negotiate through the World Trade Organization."], "ans": "C", "expl": "Challenges to deepening regional trade integration\nCultural differences/historical Previous wars and conflicts might complicate social and political\nconsiderations progress of integration\nLimited independence of Free trade and liberal movement of labor and capital differ from a\neconomic policies member's preferred policies\nPolicies aimed at sound macroeconomic conditions and fiscal\nDivergent macroeconomic\ncredibility falter when a member country has debt and/or slow\nconditions\ngrowth\nThe type of regional trading bloc that a group of countries enters into partly depends on the\ndegree of comfort and trust between each country regarding the terms of the agreement.\nMember countries move toward freer trade by reducing trade barriers against each other,\nleading to a more efficient allocation of resources.\nForming a trading bloc with a small group of countries is more straightforward, quicker, and\npolitically less quarrelsome than engaging in multilateral trade negotiations under the World\nTrade Organization ( WTO ). The WTO negotiates and forms rules of trade, largely among\ndeveloped nations, and has been criticized for creating trade rules that are unfavorable toward\ndeveloping countries.\nDeveloping countries have faced contentious negotiations with the WTO about their specific\nconcerns. WTO trade deals often take years to conclude and may result in subpar outcomes\nfor some nations. Thus, there is a preference toward bilateral and multilateral trade\nliberalization on a smaller scale, which would be more productive than negotiating through the\nWTO.\nRegional integration can be viewed as a step toward freer trade. However, the progression\nfrom a free trade agreement (FTA) to deeper integration faces challenges:\nA member country's lack of fiscal credibility or different macroeconomic conditions can\nstrain cooperation with other members and may, in the case of a monetary union,\nprevent a problem country from using currency devaluation to correct\nimbalances (Choice A) .\nFree trade and unlimited movement of labor and capital can impede policies aimed at\nrestricting relative prices or quantities within a country (Choice B) .\nThings to remember:\nHistorical considerations, a member country's lack of fiscal credibility, and the negative\naspects of the liberal movement of labor and capital are examples of challenges to deepening\nregional trade integration.\nExplain motivations for and advantages of trading blocs, common markets, and economic unions\nLOS", "qhtml": null}, {"n": 31, "q": "An analyst gathers the following information pertaining to a company's fixed assets at its three\nmanufacturing sites:\n(in € millions) Site 1 Site 2 Site 3\nGross fixed assets 600 1,100 1,250\nAccumulated depreciation 200 500 1,000\nAnnual depreciation expense 100 200 250\nThe assets are depreciated using straight-line method with no residual value. Based only on\nthis information, which site should replace its asset base the soonest ?", "opts": ["Site 1", "Site 2", "Site 3"], "ans": "C", "expl": "Age metrics are a category of fixed asset ratios that include estimated total useful life,\naverage asset age, and remaining useful life. These metrics may indicate how soon a\ncompany will incur capital expenditures to replace worn assets.\nTo determine which site will most likely replace its asset base first, find the site with assets\nthat have the shortest average remaining useful life. Remaining useful life is the ratio of net\nfixed assets to periodic depreciation expense.\nIn this scenario, Site 3 has the oldest fixed asset base with only 1 year of remaining useful\nlife, while Sites 1 and 2, respectively, have 4 and 3 years of remaining useful life (Choices A\nand B) . As such, Site 3 is most in need of asset replacement.\nThings to remember:\nAge metrics may indicate how soon a company will incur capital expenditures to replace worn\nassets. Asset bases with the least remaining useful life are most likely to be replaced.\nRemaining useful life is the ratio of net fixed assets to periodic depreciation expense.\nAnalyze and interpret financial statement disclosures regarding property, plant, and equipment and\nintangible assets\nLOS", "qhtml": null}, {"n": 32, "q": "Under IFRS, at the inception of a lease, a lessee would most appropriately record a(n):", "opts": ["expense equal to the average periodic lease payment.", "long-term asset equal to the present value of lease payments.", "long-term liability equal to the total amount of future lease payments."], "ans": "B", "expl": "Financial statement impact to the lessee\nBalance\nGoverning standard Income statement Cash flow statement\nsheet\nReduction of lease\nliability: CFF\nIFRS: all leases Asset Depreciation Interest payments:\nUS GAAP: finance lease Liability Interest IFRS: CFF or\nCFO\nUS GAAP: CFO\nUS Asset Single expense Entire lease payment:\nGAAP: operating lease Liability item CFO\nIn a lease contract, the lessee makes periodic payments to the lessor for the right to use an\nasset for a specified period. Under IFRS, all leases are treated like asset purchases financed\nwith borrowed funds (similar to the treatment of finance leases under US GAAP). At inception,\nthe lessee records on its balance sheet a long-term asset and liability equal to the present\nvalue of the future lease payments (Choice C) . The lessee depreciates the asset during the\nterm of the lease.\nThe periodic lease payments are apportioned toward interest payments and liability\nreduction each period. In this respect, a lease is conceptually very similar to amortizing a\nlong-term loan.\n(Choice A) Under US GAAP, the amount of the average periodic lease payment in an\noperating lease is recorded as an expense each period on the income statement. Operating\nleases are treated like rental agreements.\nThings to remember:\nUnder IFRS, all leases are treated like asset purchases financed with borrowed funds. At\ninception, the lessee records a long-term asset and liability equal to the present value of the\nfuture lease payments. The asset is depreciated periodically throughout the term of the lease,\nand periodic lease payments are apportioned toward interest payments and liability reduction\neach period.\nExplain the financial reporting of leases from the perspectives of lessors and lessees\nLOS", "qhtml": null}, {"n": 33, "q": "Two AUD 50,000 investments have a 3-year term. One compounds quarterly at a stated\nannual rate of 2.00%. The other compounds at a continuous rate of 1.75%. The difference in\ntheir future values (in AUD) at the end of 3 years is closest to:", "opts": ["364", "389", "540"], "ans": "B", "expl": "The future value of the first investment can be solved using the formula for multiple\ncompounding periods per year. The present value is AUD 50,000 and the stated annual rate is\n2.00%. Quarterly compounding implies 4 per year × 3 years = 12 compounding periods ( N =\n3 and m = 4).\nThe other investment's future value can be solved using the continuous compounding\nformula. The stated annual rate is 1.75% and all other values are the same as those of the\nfirst investment. The two values and the difference between them are calculated as follows:\nThe difference between the future values is 388.76, which can be rounded to 389.\n(Choice A) 364 is the result of solving for the future value of the first investment without\nadjusting for the number of compounding periods—in effect, assuming annual compounding.\n(Choice C) 540 results from mistakenly assuming continuous compounding has discrete\ncompounding periods and then using the same frequency of compounding for both\ninvestments.\nThings to remember:\nThe future value of an initial investment depends on whether the rate of compounding is\ncontinuous or discrete. In the case of discrete compounding, adjust for the frequency of\ncompounding.\nCalculate and interpret annualized return measures and continuously compounded returns, and\ndescribe their appropriate uses\nLOS", "qhtml": null}, {"n": 34, "q": "Which of the following is most appropriate for analyzing and interpreting unstructured, non-\ntextual data?", "opts": ["Tag cloud", "Network graph", "Trend visualization"], "ans": "B", "expl": "Unstructured data often requires specialized treatment before it can be used for modeling\nand analysis. Trends, tables, and charts are useful for visualizing traditional structured data,\nwhereas data scientists are using recently developed techniques for visualizing alternative\ndata.\nOne example of visualization used for unstructured data is a network graph : an interactive\ngraphic used to interpret data through the geometry of visualization. Other examples are heat\nmaps and tree diagrams.\n(Choice A) A tag cloud , in which words are sized and displayed based on the frequency of\neach word in the data set, is a visualization technique that is applicable to textual data. This\ntechnique is not applicable to non-textual data files.\n(Choice C) Unstructured data requires specialized visualization techniques to be analyzed\nproperly. Only traditional, structured data can be visualized from basic analysis using trends,\ntables, and charts.\nThings to remember:\nData scientists who analyze alternative or unstructured data must employ new techniques\nallowing for a specialized visualization of these large data sets. Interactive graphics that allow\nfor visualization of data geometry include heat maps, tree diagrams, and network graphs.\nTextual data sets are also typically large and must be analyzed in a way that accounts for their\nunstructured nature.\nDescribe applications of Big Data and Data Science to investment management\nLOS", "qhtml": null}, {"n": 35, "q": "Which of the following \"signposts\" most likely indicates a strong warning of geopolitical risk to\na portfolio?", "opts": ["Political turnover during a period of worsening employment.", "Rapidly declining exports in a country with a pegged currency regime.", "Market environment moves from risk-on to risk-off with no identifiable cause."], "ans": "B", "expl": "Actions based on signposts for portfolio risk\nRisk of likelihood, velocity, or impact Action needed\nLow No action needed\nMedium Greater caution or preparedness warranted\nHigh Consider implementing an action plan\nManagers look to combinations of economic and financial market conditions as warnings\nor signposts of potential trouble . A signpost is a factor or combination of factors based on\nthe key assumptions of the projected investment scenario and the probability of whether that\nscenario will be realized. As such, the signpost is an indicator of whether the likelihood,\nvelocity, or impact of a risk has increased and whether investment action is needed.\nWhen a currency is fixed or pegged to another major currency , rapidly declining\nexports would be a signpost for investments denominated in the pegged currency. A rapid\ndecline in exports would likely:\nreduce export income, depleting the country's foreign exchange reserves.\nlead to currency devaluation, contributing to inflationary pressures.\nforce the central bank to maintain the fixed exchange rate.\nbe a factor in a resulting economic contraction.\nSince the investment denominated in the pegged currency would have been made based on\ncertain assumptions about the pegged currency's value, including the volume of exports, a\nsignpost is created when that volume changes significantly.\n(Choice A) Typically, turnover in political leadership occurs either according to scheduled\nevents (eg, elections) or due to a country-specific event (eg, sudden resignation of top\nofficial). Political turnover happens during all parts of an economic cycle, and thus is not\nuseful as a signpost. Instead, investors should look for policy changes to guide their portfolio\ndecisions.\n(Choice C) When the market environment moves to either risk-on or risk-off, portfolio\nmanagers must identify the cause before determining what investment action(s) to take. The\nmovements could be a result of technical factors or a change in sentiment.\nThings to remember:\nThe assumptions used to project investment performance are derived from certain\ncombinations of economic and financial market conditions. Changes in those conditions and\nthe resulting assumptions subsequently serve as signposts of changing risk, helping managers\nto differentiate between real geopolitical risks and less-threatening events.\nDescribe the impact of geopolitical risk on investments\nLOS", "qhtml": null}, {"n": 36, "q": "When the price currency is trading at a forward premium to the base currency, it is most\nlikely that the:", "opts": ["forward points are positive.", "price currency is expected to appreciate against the base currency.", "interest rate for the price currency is higher than for the base currency."], "ans": "B", "expl": "When the risk-free interest rates for two countries differ, the forward exchange rate between\ntheir currencies will differ from the spot (ie, current) exchange rate. A foreign exchange quote\nspecifies the amount of price currency that can be acquired for each unit of base currency.\nWhen the forward rate is:\nless than the spot rate, the price currency is trading at a forward premium to the base\ncurrency.\ngreater than the spot rate, the price currency is trading at a forward discount to the base\ncurrency.\nA forward premium signals that market participants expect the price\ncurrency to appreciate relative to the base currency: in the future, one unit of base\ncurrency will buy less price currency than it does today since the price currency has become\nmore valuable than the base currency. A forward discount signals that the price currency is\nexpected to depreciate relative to the base currency.\n(Choice A) When the price currency is trading at a forward premium, the forward rate is less\nthan the spot rate and the forward points are negative .\n(Choice C) When the price currency is trading at a forward premium, its interest rate must\nbe less than the base currency's interest rate. The currency with the lower interest rate trades\nat a forward premium.\nThings to remember:\nForward rates reflect expectations of future currency values based on interest rates: when the\nrisk-free interest rates of two countries are different, the forward exchange rate will differ from\nthe spot rate. When the forward rate is lower than the spot rate, it signals that market\nparticipants expect the price currency to appreciate against the base currency.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates,\ncalculate a forward rate using points or in percentage terms, and interpret a forward discount or\npremium\nLOS", "qhtml": null}, {"n": 37, "q": "A portfolio manager gathers the following information about a portfolio:\nBonds Stocks Real Estate\nExpected return 4% 8% 2%\nPortfolio weight 35% 50% 15%\nCovariance Matrix\nBonds Stocks Real Estate\nBonds 80 100 45\nStocks 100 300 185\nReal estate 45 185 180\nIf the benchmark has an expected return of 6% and standard deviation of 12.5%, based on\nonly this information, the portfolio's risk is most likely :", "opts": ["less than the benchmark's.", "the same as the benchmark's.", "more than the benchmark's."], "ans": "B", "expl": "The variance of a portfolio is contingent on the weights of each asset in the portfolio,\ntheir individual variances , and the covariances between each pair of assets . The more\nassets in the portfolio, the more interactions exist between the assets, and the more complex\nthe calculation will be to find the portfolio's variance.\nA covariance matrix provides the variance for each asset (ie, each asset's covariance with\n2)\nitself), as well as the covariance for each pair of assets. For instance, the variance ( σ for\nbonds is 80 and the covariance between bonds and stocks is 100. In this scenario, each\nasset's weight and the covariance matrix are provided, so the variance of the portfolio can be\ncalculated using the following equation:\n2 (0.352 (0.502 (0.152\nσ (R ) = × 80) + × 300) + × 180)\np\n+ (2 × 0.35 × 0.50 × 100) + (2 × 0.50 × 0.15 × 185) + (2 × 0.35\n× 0.15 × 45) ≈ 156.3\nThe standard deviation of the portfolio is 12.5% (= √156.3). Since the portfolio's standard\ndeviation is the same as the benchmark's standard deviation, the portfolio and the benchmark\nhave the same risk (Choices A and C) .\nThings to remember:\nThe variance of a portfolio is contingent on the weights of each asset in the portfolio, the\nassets' individual variances, and the covariances between each pair of assets. A covariance\nmatrix provides the variance for each asset, as well as the covariance for each pair of assets.\nCalculate and interpret the expected value, variance, standard deviation, covariances, and\ncorrelations of portfolio returns\nLOS", "qhtml": "<p>A portfolio manager gathers the following information about a portfolio:</p><table class=\"qtable\"><thead><tr><th></th><th>Bonds</th><th>Stocks</th><th>Real Estate</th></tr></thead><tbody><tr><td>Expected return</td><td>4%</td><td>8%</td><td>2%</td></tr><tr><td>Portfolio weight</td><td>35%</td><td>50%</td><td>15%</td></tr></tbody></table><p>Covariance Matrix:</p><table class=\"qtable\"><thead><tr><th></th><th>Bonds</th><th>Stocks</th><th>Real Estate</th></tr></thead><tbody><tr><td>Bonds</td><td>80</td><td>100</td><td>45</td></tr><tr><td>Stocks</td><td>100</td><td>300</td><td>185</td></tr><tr><td>Real estate</td><td>45</td><td>185</td><td>180</td></tr></tbody></table><p>If the benchmark has an expected return of 6% and standard deviation of 12.5%, based on only this information, the portfolio's risk is most likely:</p>"}, {"n": 38, "q": "A retailer has a sales contract to:\ndeliver 40 machines for €90,000 to the customer's site on January 1, 20X1, and\nprovide annual maintenance services for three years, for a total of €6,000. The first\nservice is scheduled for December 20, 20X1.\nThe customer pays the full transaction price of €96,000 on January 31, 20X1.\nIn November 20X1, the retailer postpones the first scheduled maintenance service by 20 days,\nand the customer agrees. The correct amount of total revenue (in €) the retailer should\nreport for 20X1 is closest to:", "opts": ["90,000", "92,000", "96,000"], "ans": "A", "expl": "Five-step application for revenue recognition\n1. Identify the contract(s) with a customer.\n2. Identify the separate or distinct performance obligations in the contract.\n3. Determine the transaction price.\n4. Allocate the transaction price to contract's performance obligations.\n5. Recognize revenue when entity satisfies a performance obligation.\nThe International Accounting Standards Board and Financial Accounting Standards Board\nprescribe a five-step application to standardize the revenue recognition process. When a sales\ncontract has multiple performance obligations, a price must be assigned to each obligation.\nStep 5 dictates that a seller must satisfy a performance obligation to recognize (ie, earn)\nits associated revenue.\nIn this scenario, the contract contains two distinct performance obligations: delivery and\nmaintenance. In 20X1, the seller delivered the machines but was unable to provide\nmaintenance in a timely manner. Thus, it can recognize only the €90,000 for delivery in\n20X1. When the retailer performs its first maintenance service, which is postponed to January\n20X2, it can recognize €2,000 (= €6,000 / 3 years) of revenue.\n(Choice B) €92,000 [= 90,000 + (6,000 / 3)] would be the total revenue recognized for\n20X1 had the retailer provided the first scheduled maintenance on time.\n(Choice C) €96,000 is the total transaction price for the contract. Although the retailer\nreceived cash of €96,000 in 20X1, it earned only €90,000 for delivering the machines. The\nremaining €6,000 will be recognized over time as the retailer fulfills its maintenance duty.\nThings to remember:\nWhen a sales contract contains multiple performance obligations, each obligation must be\ncompleted to recognize its corresponding revenue.\nDescribe general principles of revenue recognition, specific revenue recognition applications, and\nimplications of revenue recognition choices for financial analysis\nLOS", "qhtml": null}, {"n": 39, "q": "A developing market country that targets its currency exchange rate to the USD experiences a\nsudden period of high inflation due to country-specific supply chain pressures. Meanwhile, the\nUS experiences only mild inflation.\nThe immediate outcome and central bank response is most likely that the developing country's\ncurrency:", "opts": ["depreciates and its central bank should buy the US dollar.", "depreciates and its central bank should buy the domestic currency.", "appreciates and its central bank should sell the domestic currency."], "ans": "B", "expl": "A developing market country may apply a monetary policy that targets its\ncurrency's exchange rate rather than targeting a specific level of domestic inflation. Such a\ntargeting policy sets a level or band for its exchange rate against a major currency in the\nhopes of achieving the level of inflation of a more stable developed economy, which is usually\nlower. The developing country's central bank maintains this target by\nactively buying or selling its domestic currency .\nIn this scenario, the developing country has experienced high inflation, which devalues its\ncurrency, while the US has only mild inflation. If the developing country's currency had a free-\nfloating exchange rate, it would depreciate against the US dollar.\nTo stop further depreciation , the developing country's central bank should\nsell its USD (ie, foreign currency) reserves and buy its own currency (Choice A) .\nThese purchases should shrink the domestic money supply by taking domestic currency out of\ncirculation. This would in turn lead to an increase in interest rates that should eventually\nreduce domestic inflation. Higher rates should also attract foreign capital and increase\ndemand for the developing country's currency, leading to currency reappreciation.\n(Choice C) If the developing country's inflation rate were less than US inflation, then its\ncurrency should appreciate against the USD. In this case, the developing country's central\nbank should sell its currency and buy USD. This is not the scenario here.\nThings to remember:\nFor a developing country using exchange rate targeting, domestic inflation greater than the\ntarget currency's inflation will put downward pressure on the domestic currency. Maintaining\nthe target exchange rate requires central bank purchases of the domestic currency.\nDescribe qualities of effective central banks; contrast their use of inflation, interest rate, and\nexchange rate targeting in expansionary or contractionary monetary policy; and describe the\nlimitations of monetary policy\nLOS", "qhtml": null}, {"n": 40, "q": "An analyst is testing the returns generated by a portfolio manager. The mean return from\nsamples drawn by the analyst was 5%, but the analyst suspects that the manager's actual\nreturns are 4%. After applying a hypothesis test, the analyst rejects the null hypothesis. The\nanalyst's most appropriate conclusion is that the manager's mean return is:", "opts": ["equal to 4%.", "not equal to 4%.", "not equal to 5%."], "ans": "C", "expl": "Hypothesis testing requires a null and an alternative hypothesis. The null\nhypothesis is what is being tested ; if the null is rejected , the alternative\nhypothesis is accepted .\nIn this question, the analyst's only evidence is the sample indicating the average returns are\n5%. While the analyst suspects the average is actually lower, the hypothesis test should test\nthe sample's actual results: the null cannot relate to testing the analyst's \"suspicion\" that the\naverage is actually 4% since there is nothing other than the analyst's \"suspicion\" to support\nit (Choices A and B) .\nThe appropriate hypothesis test is a two-sided test. The null is that the average return equals\n5%, while the alternative is that it does not equal 5%:\nH : μ = 5% (null)\n0\nH : μ ≠ 5% (alternative)\na\nIf there is sufficient evidence to reject the null hypothesis, the correct conclusion is that the\nmanager's returns are not equal to 5%, not that they are equal to some other value. If the\nanalyst rejects the null hypothesis, the appropriate process would be for the analyst to gather\nmore evidence to test whether the returns in fact equal 4%.\nThings to remember:\nIn hypothesis testing, the null hypothesis is what is tested, and the alternative hypothesis is\naccepted if the null is rejected. The convention is to formulate the hypotheses so that the\nalternative reflects the \"true\" condition. If the null hypothesis is rejected, the alternative\nhypothesis is that the statistic does not equal the hypothesized parameter or is greater than or\nless than the parameter, not that the parameter equals some other specific value.\nExplain hypothesis testing and its components, including statistical significance, Type I and Type II\nerrors, and the power of a test.\nLOS", "qhtml": null}, {"n": 41, "q": "A cheese producer competes by creating a differentiated, high-quality cheese that sells for a\npremium price in the very crowded local retail cheese market. The market structure that this\ncheese producer operates in is best described as:", "opts": ["oligopoly.", "perfect competition.", "monopolistic competition."], "ans": "C", "expl": "Monopolistic competition is a market structure characterized by numerous\ncompetitors selling differentiated products and by low barriers to entry. These\ncompanies compete on price , quality , marketing, and/or location.\nInnovative products or strategies can allow firms in monopolistic competition to temporarily\nachieve above-average levels of profitability. These above-average earnings are known\nas economic profits. In monopolistically competitive markets, economic profits are quickly\nerased by the numerous existing competitors or by new competitors, allowed by the low\nbarriers to entry.\n(Choice A) Oligopolies have few competitors, deliver homogenous products (eg, crude oils),\nand have high barriers to entry.\n(Choice B) Perfect competition markets are characterized by homogenous products, low\nbarriers to entry, and firms with no control over the market price (ie, price takers).\nThings to remember:\nMonopolistic competition is a market structure characterized by numerous competitors selling\ndifferentiated products and by low barriers to entry. These companies compete on price,\nquality, marketing, and/or location.\nDescribe characteristics of perfect competition, monopolistic competition, oligopoly, and pure\nmonopoly\nLOS", "qhtml": null}, {"n": 42, "q": "A developed market economy's central bank announces a 100bps decrease in its official\ninterest rate. All else equal, which of the following will be the most likely outcome?", "opts": ["Stock prices fall.", "Exports increase.", "The country's currency appreciates."], "ans": "B", "expl": "Representation of the Monetary Transmission Mechanism\nA central bank's monetary policy is transmitted throughout the economy in a cascade of\nevents and responses. In this scenario, the central bank significantly decreases its policy\nrate to stimulate the economy and spur investment. Likely responses include:\nBanks will respond by decreasing their reference rates, by which they establish lending\nrates to customers. As a result, individuals and businesses may borrow more.\nAsset prices (including stocks) and values of capital projects will likely rise , due to\ndecreased discount rates used in calculating future cash flows (Choice A) .\nConfidence will rise with expectations that lower interest rates forecast stronger future\ngrowth and increased profits.\nThe domestic currency will depreciate in value as \"hot\" money follows now higher\ninterest rates elsewhere (Choice C) . This allows domestic producers to sell goods and\nservices in foreign markets at lower, more competitive prices, leading to an increase in\nexports .\nOverall, the increase in consumption, borrowing, and asset prices will likely increase aggregate\ndemand. Stronger demand may increase domestic prices. This, along with higher import\nprices (due to depreciation of the domestic currency), could put some upward pressure on\nactual inflation.\nThings to remember:\nA central bank's monetary policy is transmitted throughout the economy in a cascade of\nevents and responses. When a central bank decreases its policy rate, it is attempting to\nstimulate the domestic economy. The domestic currency depreciates in value, making\ndomestic goods cheaper in foreign markets and leading to an increase in exports.\nDescribe tools used to implement monetary policy tools and the monetary transmission\nmechanism, and explain the relationships between monetary policy and economic growth,\ninflation, interest, and exchange rates\nLOS", "qhtml": null}, {"n": 43, "q": "An analyst calculates the following ratios for a company to assess performance over time:\nRatio 20X4 20X5 20X6\nDebt-to-equity 0.42 0.35 0.33\nDebt-to-EBITDA 4.12 3.18 3.04\nWorking-capital turnover 0.64 0.59 0.54\nFixed-asset turnover 0.25 0.18 0.16\nPrice-to-book 8.41 8.05 7.85\nPrice-to-earnings 12.52 11.12 10.79\nBased on this information only, the analyst can most appropriately conclude that the\ncompany's:", "opts": ["solvency position has improved.", "operation has increased efficiency.", "stock is more expensive relative to fundamentals."], "ans": "A", "expl": "Analysts can use integrated financial ratio analysis to gauge a company's performance over\ntime in terms of its activity or efficiency, liquidity, solvency, profitability, and valuation.\nActivity ratios measure how efficiently a company uses its assets .\nLiquidity ratios measure how well a company can cover its short-term\nobligations with cash or assets that are easily converted to cash.\nSolvency ratios measure a company's ability to satisfy its long-term obligations .\nProfitability ratios measure a company's return on sales and return on investments .\nValuation ratios measures a company's stock price relative to its fundamentals .\nIn this scenario, solvency , as measured by debt-to-equity (Debt / Equity) and debt-to-\nEBITDA (Debt / EBITDA), has been improving . The downward trend in both ratios indicates\nthat the company has lowered its outstanding debt relative to its equity and EBITDA.\n(Choice B) Efficiency (ie, activity), as measured by working-capital turnover (Sales / Net\nworking capital) and fixed asset turnover (Sales / Fixed assets), has worsened. Both ratios\nare trending down over time, indicating that the company has become less efficient at using\nits assets to generate sales.\n(Choice C) The stock price has become less expensive over time relative to company\nfundamentals, as indicated by the decreasing price-to-book (P/B) and price-to-earnings (P/E)\nratios here. This suggests that the investors pay less for the stock relative to the company's\nearnings and book value.\nThings to remember:\nActivity ratios measure how effectively a company uses its assets to generate sales. Liquidity\nratios measure how well a company can cover its short-term obligations with liquid assets.\nSolvency ratios measure a company's ability to satisfy its long-term obligations. Profitability\nratios measure a company's return on sales and return on investments. Valuation ratios\nmeasures stock price levels relative to the company's fundamentals.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios\nLOS", "qhtml": null}, {"n": 44, "q": "A portfolio holds the following stocks:\nStock Return (%)\nStock 1 6.00\nStock 2 5.20\nStock 3 −3.75\nStock 4 4.90\nStock 5 6.85\nStock 6 −0.50\nStock 7 2.25\nIf an analyst is choosing stocks that are only in the third and fourth quintiles of returns for this\nportfolio, which of the following stocks is the least appropriate choice?", "opts": ["Stock 2", "Stock 4", "Stock 7"], "ans": "C", "expl": "Quantiles are used to mark distributions into portions containing equal numbers of\nobservations. One example is a percentile , which establishes the percentage of observations\nin the distribution lying at or below a specified cutoff value (eg, the 90th percentile means\nthat 90% of values in a distribution lie at or below that observation). The boundaries of the\nquantile being sought often do not match an exact observation in the distribution, so the\nlocation must be estimated using linear interpolation.\nOther quantiles can be defined using percentiles. For example, quintiles (ie, fifths) occur at\n80th, 100th\nthe 20th, 40th, 60th, and percentiles:\n1st quintile: > 0 and ≤ 20th percentile\n2nd quintile: > 20th to ≤ 40th percentile\n3rd quintile: > 40th to ≤ 60th percentile\n4th quintile: > 60th to ≤ 80th percentile\n5th quintile: > 80th to ≤ 100th percentile\nIn this case, the analyst is interested in the third and fourth quintiles of returns (ie,\nobservations above the 40th percentile and at or below the 80th percentile). This result can\nbe derived by sorting the returns in ascending order, and then determining the two locations\n4th\nthat correspond to the beginning point of the 3rd quintile and the endpoint of the quintile.\nThe stock returns are ordered by ascending value:\nCalculate the location of each percentile:\nNote that 3.2% marks the 40th percentile, while 6.4% represents the 80th percentile. Since\nno actual returns from the portfolio correspond to these returns, use linear interpolation to\nfind the corresponding returns for each percentile:\nThe stocks that have returns in the third and fourth quintiles—above the 40th percentile and\nat or below the 80th percentile—have returns greater than 2.78% and less than 6.34%. The\nstocks within that range are Stocks 1, 2, and 4 , as illustrated by the shading in the table\nabove. These are the most suitable selections for the analyst (Choices A and B) .\nStocks 3, 5, 6, and 7 are not suitable since they fail to meet the criteria.\nThings to remember:\nQuantiles are used to organize distributions into portions containing equal numbers of\nobservations. In many cases, the quantile will not exactly equal the value of an observation,\nso linear interpolation is used to solve for the desired quantile.\nCalculate, interpret, and evaluate measures of central tendency and location to address an\ninvestment problem\nLOS", "qhtml": null}, {"n": 45, "q": "In a market structured as monopolistic competition, which of the following most likely allows\nfirms to establish some pricing power?", "opts": ["Customer loyalty", "Homogenous products", "High barriers to entry and exit"], "ans": "A", "expl": "Monopolistic competition is a market structure characterized by numerous buyers and sellers,\noffering similar but slightly differentiated products (Choice B) . Since the products are close\nsubstitutes , firms use various nonprice strategies to set their products apart.\nOne such strategy is advertising, which helps firms convince consumers that their offerings are\ndistinct from those of competitors. This strategy may build customer loyalty and preference\nfor specific products within a competitive environment. Thus, firms can create some degree\nof pricing power by using advertising and nonprice strategies to differentiate their\nproducts.\n(Choice C) High barriers to entry are characteristic of oligopoly or monopoly market\nstructures; a market structured as monopolistic competition has low barriers to entry and\nmany participants.\nThings to remember:\nMonopolistic competition is marked by numerous firms in a market that allows easy entry and\nexit, with products that are close substitutes. Thus, firms have limited pricing control due to\nconsumer choices, and firms try to create some degree of pricing power by using advertising\nand nonprice strategies to differentiate their products.\nExplain supply and demand relationships under monopolistic competition, including the optimal\nprice and output for firms as well as pricing strategy\nLOS", "qhtml": null}, {"n": 46, "q": "An analyst suspects a company of manipulating its financials. A trend that could most\nlikely be a warning sign is:", "opts": ["declining inventory turnover over multiple periods.", "receivables decreasing as a percentage of total revenue.", "a net-income-to-cash-from-operating-activities ratio consistently below 1."], "ans": "A", "expl": "Common warning signs of accounting manipulation\nFrequent reporting \"surprises\"\n\"Nonrecurring\" items that consistently appear in multiple periods\nUnusual levels of receivables, payables, inventory turnover, operating cash flow, net\nincome, profit margins\nUnderestimating warranty expenses that are \"restated\" in subsequent periods\nUseful lives for long-term assets that are different than industry average\nRelated-party transactions\nHeavy emphasis on pro forma (non-GAAP, non-IFRS) earnings\nFinancial reporting standards (eg, IFRS, US GAAP) give companies discretion and flexibility\nover the financial information they present, which can result in companies manipulating their\nfinancials. Analysts must stay alert for warning signs of manipulation, which should be\nanalyzed further.\nOne potential warning sign is a declining inventory turnover ratio over multiple\nperiods. The inventory turnover ratio provides an indication on how efficiently a company\nis managing its inventory. Although a declining ratio may simply be due to poor inventory\nmanagement, it may also signal that the company is purposefully not recognizing\nobsolescence to avoid write-downs in the current period. However, this could result in\ninventory write-downs in future periods.\n(Choice B) Receivables that are increasing as a percentage of total revenue may result from\npoor credit management or indicate aggressive accounting policies to recognize revenue early,\nsuch as \"channel stuffing\" (ie, delivering product to distributors ahead of customer demand).\n(Choice C) A net-income-to-cash-from-operating-activities ratio consistently above 1 may be\na warning sign of lower quality financials or manipulation. While this trend may be due to the\ncyclicality of the business, it could also indicate that the company is using aggressive\naccounting policies to recognize revenue early or defer expense recognition.\nThings to remember:\nFinancial reporting standards allow companies discretion over the financial information they\npresent to investors and flexibility over how it's presented, allowing for potential\nmanipulation. One potential warning sign is a declining inventory turnover ratio, which may\nsignal that the company is purposefully not recognizing inventory obsolescence to avoid write-\ndowns.\nDescribe accounting warning signs and methods for detecting manipulation of information in\nfinancial reports\nLOS", "qhtml": null}, {"n": 47, "q": "An analyst estimates the probability that:\na carbon tax will be enacted is 0.40.\noil prices will fall given that a carbon tax is enacted is 0.75.\neither a carbon tax will be enacted or oil prices will fall is 0.80.\nThe probability that oil prices will fall is closest to:", "opts": ["0.10", "0.40", "0.70"], "ans": "C", "expl": "The addition rule for probabilities is used to calculate the probability that at least one of\ntwo events , A or B , occurs . When the events are independent, this is the sum of P ( A ) +\nP ( B ). However, when the events are not independent, there is a probability that both events\ncould occur (ie, a joint probability). The joint probability P ( AB ) must be subtracted from the\nsum of the individual probabilities.\nSince oil prices falling is related to the imposition of the tax, there is a probability that both\nevents could occur. The probability that oil prices fall given the imposition of the tax is 0.75.\nUsing the joint probability rule, the probability of both a fall in oil prices AND the imposition of\nthe tax is 0.75 × 0.40 = 0.30.\nIn this question, the P (oil prices fall OR carbon tax enacted) is given as 0.80. The calculation\nusing the addition rule is shown below (the formula is rearranged in the second line to isolate\nthe unknown variable):\n(Choice A) 0.10 results from incorrectly specifying the rearranged formula by subtracting the\njoint probability instead of adding it.\n(Choice B) 0.40 results by not subtracting the joint probability of both events.\nThings to remember:\nThe addition rule for probabilities is used to calculate the probability that at least one of two\nevents will occur. When the events are not independent, the joint probability of both events\nmust be subtracted from the sum of the individual probabilities of either event to avoid\ndouble-counting.\nFormulate an investment problem as a probability tree and explain the use of conditional\nexpectations in investment application\nLOS", "qhtml": null}, {"n": 48, "q": "A company's fiscal year ends December 31. Which of the following events most likely creates\na noncurrent liability? The company:", "opts": ["reports accounting income less than its taxable income.", "is paid in March for a service to be provided next January.", "issues debt at a premium, which is partially amortized in the first year."], "ans": "C", "expl": "A financial liability (eg, bank loans, bonds payable) maturing in:\n12 months or less is classified as a current liability.\nmore than 12 months is classified as a noncurrent liability , but the current portion\n(ie, any amount maturing in the next 12 months) is a current liability.\nWhen a company issues debt at a premium (ie, above its par value) or at a discount (ie, below\nits par value), the premium (discount) is recorded on the balance sheet and subsequently\namortized, increasing (decreasing) the amount of interest expense. At maturity, the premium\n(discount) has been fully amortized, and the carrying cost equals the par value.\nWhen the premium is not fully amortized in the first year, it means that the debt\ninstrument matures in more than one year . Therefore, this situation would most likely\ncreate a noncurrent liability.\n(Choice A) Deferred taxes account for temporary differences between income tax expense\n(financial reporting) and taxes payable (tax reporting). When a company reports accounting\nincome that is less than its taxable income, it creates a deferred tax asset , not a liability.\n(Choice B) Unearned revenue is a liability recorded when a company receives cash in\nadvance of the delivery of goods or services. Since the company is paid for a service that will\nbe delivered within 12 months, it should be classified as a current liability. The fact that the\nservice will be delivered in a different accounting period is not relevant.\nThings to remember:\nA financial liability due and payable in 12 months or less is classified as a current liability. If it\nmatures in more than 12 months, it is classified as a noncurrent liability, but the current\nportion (ie, any amount maturing in the next 12 months) is a current liability.\nExplain the financial reporting and disclosures related to non-current liabilities\nLOS", "qhtml": null}, {"n": 49, "q": "A company has 30 million weighted average common shares outstanding and reports the\nfollowing data (in CAD) for the most current completed fiscal year:\nNet income 25 million\nPreferred dividends 1 million\nOption exercise price 40\nThere were 5 million employee stock options outstanding for half the year, and the average\nstock price was CAD 50. If there are no other dilutive securities, based on this information,\nthe company's diluted EPS (in CAD) is closest to:", "opts": ["0.77", "0.79", "0.80"], "ans": "B", "expl": "The treasury stock method is used to calculate diluted EPS for a company\nwith outstanding options . This approach assumes that:\nall options will be converted into common shares (ie, exercised ) if the average stock\nprice is greater than the exercise price , and\nthe company will use all cash proceeds from the exercised options to repurchase\nshares at the average market price to minimize dilution.\nAs such, the net share increase would be the number of new common shares issued, net of\nthe number of shares repurchased.\nSince the average stock price (50) is greater than the exercise price (40), all 5 million options\nare assumed to be converted into newly issued common shares. The company would use all\noptions proceeds (5 million × 40 = 200 million) to repurchase 4 million shares (= 200 million /\n50) at the average stock price, and thus the net increase in new shares would be 1.00 million.\nHowever, the options were outstanding for half the year, resulting in 0.50 million net new\nshares and diluted EPS of 0.79.\n(Choice A) 0.77 results from not time-weighting the net new shares by the percentage of\nthe year the options were outstanding.\n(Choice C) 0.80 is the basic (ie, undiluted) EPS.\nThings to remember:\nThe treasury stock method assumes that all options will be exercised if the average stock price\nis greater than the exercise price and that, subsequently, the company will use all cash\nproceeds from the exercised options to repurchase shares at the average market price to\nmoderate dilution.\nDescribe how earnings per share is calculated and calculate and interpret a company’s basic and\ndiluted earnings per share for companies with simple and complex capital structures including\nthose with antidilutive securities\nLOS", "qhtml": null}, {"n": 50, "q": "A lender is most likely to benefit when, over the life of a loan, actual inflation:", "opts": ["is less than expected inflation.", "equals expected inflation.", "is greater than expected inflation."], "ans": "A", "expl": "Impact of inflation differing from expectations\nGroup\nRationale\nbenefiting\nBorrowers\nPurchasers\nPayments made have\nInflation > under fixed-\nless purchasing power\nexpectations\nprice\nthan expected\ncontracts\nLenders\nRetirees with\nIncome received has\nInflation <\nfixed\nmore purchasing power\nexpectations\npension\nthan expected\nbenefits\nInflation is a change in average nominal price levels over time and is characterized as either\nexpected or unexpected:\nExpected: price level changes match expectations\nUnexpected: price level changes are above or below expectations\nLenders benefit when actual inflation is less than expected inflation . Interest rates\nreflect expected inflation. If the rise in price levels over the life of a loan is less than the\nexpected inflation rate reflected in the loan's interest rate, a lender's interest income has\ngreater purchasing power than expected at the loan's origination. There is a transfer of\nwealth from borrowers to lenders when actual inflation is less than expected inflation.\n(Choice B) Lenders are neither advantaged nor disadvantaged when actual inflation equals\nexpected inflation since the interest income has the same purchasing power (real value) as\nanticipated at loan origination.\n(Choice C) If actual inflation is greater than expected inflation, lenders earn interest with\nless purchasing power than originally expected, which is a transfer of real wealth from lenders\nto borrowers.\nThings to remember:\nInflation is a change in average nominal price levels over time. Lenders benefit (suffer) when\nactual inflation is less (more) than expected inflation since interest earned has greater (less)\npurchasing power than originally anticipated.\nDescribe tools used to implement monetary policy tools and the monetary transmission\nmechanism, and explain the relationships between monetary policy and economic growth,\ninflation, interest, and exchange rates\nLOS", "qhtml": null}, {"n": 51, "q": "Country Y's government agrees to establish a voluntary export restraint (VER) on perfumes\nwith importing Country X. This VER will voluntarily limit Country Y's exports to 600,000 liters\nper year for the next three years.\nAll else equal, which of the following is the most likely result of this VER?", "opts": ["Country Y will capture the quota rents.", "Country Y will have a net welfare loss.", "Country X will experience a decline in their producer surplus."], "ans": "A", "expl": "Comparison of import quotas and voluntary export restraints (VER):\nImpact on importing country\nImport quota VER\nProducer surplus Increases Increases\nConsumer\nDecreases Decreases\nsurplus\nMixed, depends on whether quota rents\nare captured by:\nNo change (rent\nGovernment\nimporting country through sale of goes to\nrevenue\nlicenses, or foreigners/exporters)\nexporters\nDecreases in small country,\nNational welfare Decreases\ncould increase in large country\nPrice Increases Increases\nDomestic\nDecreases Decreases\nconsumption\nDomestic\nIncreases Increases\nproduction\nTrade Imports decrease Imports decrease\nA voluntary export restraint (VER) is similar to an import quota; the main difference is that\nan import quota is imposed by an importing country, while a VER is enacted by\nthe exporting country. In a VER, the government of the importing country gives authority to\nthe government of the exporting country to restrict trade. VERs are considered non-tariff\nbarriers, which are restrictive trade barriers such as quotas and embargoes.\nA VER allows the quota rents resulting from the decrease in trade to be captured by the\nexporter or exporting country, where they can be auctioned or handed out to foreign\nproducers or disappear through rent seeking behavior; in a case without rent seeking, quota\nrents provide the exporting country (ie, Country Y) with a net welfare gain. Revenues to the\nimporting home country go out of the country, so the net welfare effect for the importing\ncountry (ie, Country X) is considered a welfare loss (Choice B) .\nWith functioning VERs, producers in the importing country benefit as there is decreased\ncompetition, likely resulting in higher prices and profits and thus increased producer\nsurplus (Choice C) . However, these profits to domestic producers come with limitations since\nVERs reduce overall national welfare by creating negative trade effects and negative\nconsumption and production distortions.\nThings to remember:\nA VER is similar to an import quota; the main difference is that an import quota is imposed by\nan importing country, while a VER is enacted by the exporting country. A VER allows the\nquota rents resulting from the decrease in trade to be captured by the exporter or exporting\ncountry.\nCompare types of trade restrictions, such as tariffs, quotas, and export subsidies, and their\neconomic implications\nLOS", "qhtml": null}, {"n": 52, "q": "Which of the following distributions is most appropriate for modeling a stock's price?", "opts": ["Normal", "Lognormal", "Multivariate"], "ans": "B", "expl": "A lognormal distribution has several characteristics that make it suitable for modeling stock\nprices. Values on the lower end of the distribution are bounded by zero but have no upper\nbound. The distribution also has a skew to the right . This results in a shortened left tail, a\nlong right tail, and an asymmetrical shape. Stock prices behave similarly: prices cannot be\nbelow zero and theoretically have no upper limit.\n(Choice A) Normal distributions are symmetrical, do not have a skew, and do not have upper\nor lower bounds. These characteristics are inconsistent with the distribution of stock prices;\ntherefore, a normal distribution is not appropriate here.\n(Choice C) Multivariate distributions are a form of normal distribution that deals with groups\nof variables instead of a single variable. A normal distribution is not suitable here and in this\ncase there is only one variable, which makes the multivariate distribution an inappropriate\nchoice.\nThings to remember:\nLognormal distributions have a lower bound of zero, no upper bound, and are asymmetrical\nwith a right skew. These features make them suitable for describing stock prices, which are\nasymmetrically distributed and skew to the right since they cannot drop below zero and\ntheoretically have no upper limit.\nExplain the relationship between normal and lognormal distributions and why the lognormal\ndistribution is used to model asset prices when using continuously compounded asset returns\nLOS", "qhtml": null}, {"n": 53, "q": "A company receives cash of €55 million from the sale of equipment in 20X7. During that year,\nthe company had depreciation expenses of €20 million and capital expenditures of €65 million;\nthe capital expenditures were all used to purchase new equipment. The company reported the\nfollowing balance sheet data:\n€ millions 20X7 20X6\nGross cost of equipment 800 760\nAccumulated depreciation (150) (140)\nBased on only this information, the gain on the sale of the equipment (in € millions)\nis closest to:", "opts": ["10", "30", "40"], "ans": "C", "expl": "When companies sell equipment , they report a noncash gain (loss) equal to\nthe difference between the cash received from the sale and current net book value\n(BV) of the equipment. When the net BV of the equipment sold is not provided, financial\nstatement items can be used to estimate the cost.\nIn this scenario, to calculate the BV of the disposed equipment, use the relationship between\nthe change in the equipment's net BV and factors that account for that change: capital\nexpenditures (ie, increases to BV) and depreciation expense and disposals of equipment (ie,\ndecreases to BV). The net BV of the disposed equipment can be derived as follows:\nSince the cash received from the sale is 55, the gain from the sale is 40 (55 − 15).\n(Choice A) 10 is the difference between the capital expenditures and cash received from the\nsale (65 − 55) or the difference between the cash received from the sale and capital\nexpenditures plus the depreciation expense (55 − 65 + 20). Neither calculation accounts for\nthe change in the balance sheet items.\n(Choice B) 30 is the difference between the historical (instead of current) BV of equipment\nsold and cash received from the sale.\nThings to remember:\nWhen companies sell equipment, they report a noncash gain (loss) equal to the difference\nbetween the cash received from the sale and current net book value (BV) of the equipment.\nWhen the net BV of the equipment sold is not provided, financial statement information can be\nused to estimate the cost.\nDescribe the steps in the preparation of direct and indirect cash flow statements, including how\ncash flows can be computed using income statement and balance sheet data\nLOS", "qhtml": null}, {"n": 54, "q": "A company reporting under IFRS sponsors a defined benefit plan. Which of the following\ncomponents of pension cost is the company required to recognize in other comprehensive\nincome (OCI)?", "opts": ["Past service costs", "Net interest expense", "Actual return on plan assets"], "ans": "C", "expl": "The periodic pension cost of a defined benefit plan reflects the increase in the pension\nobligation adjusted for the actual return on plan assets. Under IFRS and US GAAP, part of\nperiodic pension costs is recognized on the income statement, whereas the other part is\nrecognized in other comprehensive income (OCI). Under IFRS, there are three\ncomponents of periodic pension cost:\nService costs include current and past service costs and are recognized as expenses in\nthe income statement.\nNet interest expense or income is the product of the funded status (ie, net pension asset\nor liability) and the discount rate (used to calculate pension obligation) and is recognized\nin the income statement (Choice B) . It equals the difference between interest cost\n(pension obligation × discount rate) and expected return on assets (fair value of plan\nassets × discount rate).\nRemeasurement is recognized in OCI and includes actuarial losses or gains and the net\nreturn on plan assets (ie, the actual return less the expected return recognized in the\nincome statement).\nTherefore, the company recognizes an expected return on plan assets based on the discount\nrate on the income statement. Later, when the actual return is known, the company\nrecognizes it in OCI, net of the previously recognized expected return.\n(Choice A) Past service costs are recognized in OCI under US GAAP, but not under IFRS.\nThings to remember:\nUnder IFRS, the components of pension cost are service costs and net interest expense or\nincome (both recognized in the income statement), as well as remeasurements, which are\nrecognized in OCI. Remeasurements include actuarial gains or losses and the actual return on\nplan assets net of expected return.\nExplain the financial reporting of defined contribution, defined benefit, and stock-based\ncompensation plans\nLOS", "qhtml": null}, {"n": 55, "q": "An analyst gathers the following data for a company:\nPrior Current\n(¥ billions)\nYear Year\nSales 540 500\nNet income 120 100\nAverage total assets 2,200 2,100\nIf return on equity (ROE) was 0.12 in the prior year and 0.14 in the current year, then the\nincrease in ROE is most appropriately attributed to increased:", "opts": ["leverage.", "efficiency.", "profitability."], "ans": "A", "expl": "Return on equity ( ROE ) measures the level of net income generated by a company's use of equity.\nClassic DuPont analysis decomposes ROE into three distinct components: profitability , efficiency ,\nand leverage .\nProfitability, measured by net profit margin, gauges the level of profit from sales.\nEfficiency, measured by total asset turnover, gauges the ability to generate sales by using\nassets.\nFinancial leverage is the ratio of total assets to equity capital. Firms with higher leverage\nhave a greater percentage of assets financed with debt.\nAn increase to any one component, all else equal, will positively impact ROE.\nIn this scenario, ROE increased from 0.12 to 0.14. To determine the cause of the increase, first\ncalculate the net profit margin and total asset turnover, and then plug those values into the overall\nROE equation to solve for leverage. Finally, compare the current component values to the prior\nyear values. In this case, the increase in ROE is driven by increased leverage.\nNote: Leverage can also be determined based on its relationship to ROE and return on assets\n(ROA): ROE = ROA × Leverage .\n(Choice B) Efficiency, measured by total asset turnover, decreased in the current
