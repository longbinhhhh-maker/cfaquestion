e covariance of the expected returns of COIL and the expected returns of NAGS\nis closest to:"}, {"n": 82, "q": "An analyst gathers the following data to compare two companies' performance.\nCompany Company\n($ millions)\nA B\nRevenue 1,000 800\nEBITDA 200 250\nNet income 150 188\nLong-term debt 700 800\nTotal assets 1,200 1,600\nThe analyst calculates only three ratios: Debt-to-EBITDA, net profit margin, and total asset\nturnover. Based only on these three ratios, the analyst can most appropriately conclude that\nCompany A has better:", "opts": ["solvency.", "efficiency.", "profitability."], "ans": "B", "expl": "Analysts use integrated financial ratio analysis to gauge a company's performance in terms of\nits activity or efficiency, liquidity, solvency, and profitability.\nActivity ratios measure how efficiently a company utilizes its assets.\nLiquidity ratios measure how well a company can cover its short-term obligations with\ncash or with assets that are easily converted to cash.\nSolvency ratios measure a company's ability to satisfy its long-term obligations.\nProfitability ratios measure a company's return on sales and return on investments.\nReturn on sales measures the margin earned from sales. Return on investment\nmeasures the profit from invested capital (eg, equity).\nFrom the information provided in the question, solvency is measured by Debt-to-\nEBITDA ratio, efficiency is measured by total asset turnover , and profitability is\nmeasured by net profit margin . After calculating the three ratios, the analyst can most\nappropriately conclude that Company A has better efficiency (0.83 vs. 0.50) since it is better\nat utilizing its assets to generate sales.\n(Choice A) Company B has better solvency as measured by a lower Debt-to-EBITDA ratio.\n(Choice C) Company B has better profitability as measured by net profit margin.\nThings to remember:\nActivity ratios measure how efficiently a company utilizes its assets to generate sales.\nLiquidity ratios measure how well a company can cover its short-term obligations with liquid\nassets. Solvency ratios measure a company's ability to satisfy its long-term obligations.\nProfitability ratios measure a company's return on sales and return on investments.\nDescribe relationships among ratios and evaluate a company using ratio analysis\nLOS", "qhtml": null}, {"n": 83, "q": "Company A purchases a patent from Company B and acquires Company C along with its\ncustomer list. The most appropriate way for Company A to account for these purchases would\nbe to:", "opts": ["capitalize both the patent and the customer list.", "capitalize the patent and expense the customer list.", "expense the patent and capitalize the customer list."], "ans": "A", "expl": "Treatment for intangible assets\nAcquisition method Treatment of costs\nPurchased on a stand-alone\nFair value of assets capitalized on balance sheet\nbasis\nResearch costs expensed immediately on income statement\nDeveloped internally\nDevelopment costs capitalized on balance sheet if product is\nthrough research and\ndeveloped for internal use (US GAAP) or has demonstrated\ndevelopment technical feasibility (IFRS)\nFair value of assets capitalized on balance sheet\nAcquired through a business\nAdditional goodwill created on balance sheet\ncombination (eg, merger)\nIntangible assets (eg, patents, customer lists) lack physical form but are still expected to\ngrant the holder future economic benefit. These assets can be obtained through a stand-alone\npurchase, the acquisition of another company, or internal development.\nCompanies are required to account for these assets in different ways, depending on the means\nof acquisition. If intangible assets are acquired through a stand-\nalone purchase or as part of a larger business combination (eg, acquisition), both IFRS\nand US GAAP require capitalizing the asset : recognizing its fair value on the company's\nbalance sheet and subsequently amortizing that value over the asset's useful life. Note\nthat goodwill, although considered an intangible asset, is not identifiable and therefore not\namortized but rather periodically tested for impairment.\nIn this scenario, one company acquires a customer list as a part of its acquisition of another\ncompany and also purchases a stand-alone patent. Under IFRS and US GAAP, both intangible\nassets should be capitalized (Choices B and C) .\nThings to remember:\nA company can obtain intangible assets through stand-alone purchases, the acquisition of\nother companies, or internal development. Under both IFRS and US GAAP, if an intangible\nasset is acquired through a stand-alone purchase or business combination (eg, acquisition), it\nis capitalized.\nCompare the financial reporting of the following types of intangible assets: purchased, internally\ndeveloped, and acquired in a business combination\nLOS", "qhtml": null}, {"n": 84, "q": "As the size of a sample drawn from a population increases, the standard error of the\nsample most likely :", "opts": ["approaches zero.", "produces a wider confidence interval.", "approximates the standard deviation of the population."], "ans": "A", "expl": "The standard error of a sample statistic is the standard deviation of that statistic.\nAccording to the central limit theorem, a sample size greater than or equal to 30 taken from a\npopulation will be normally distributed with its mean approximately equal to the population's\nmean.\nThe standard error is calculated by dividing the standard deviation by the square root of the\nsample size. A larger denominator results in a smaller fraction value, so as the sample size\nincreases, the standard error approaches zero.\n(Choice B) A confidence interval represents a range of values that includes an unknown\nparameter, such as a population mean, with a specified probability. As the sample size\nbecomes larger, the standard error becomes smaller. All else equal, a smaller standard error\nproduces a narrower confidence interval.\n(Choice C) As demonstrated by the standard error formula, the standard error is the\nsample's standard deviation divided by the square root of the sample size, so the standard\nerror of the sample is less than the sample's standard deviation.\nThings to remember:\nThe standard error is the standard deviation of a sample statistic, such as a sample mean.\nThe standard error is inversely related to the size of the sample. As the sample size\nincreases, the standard error approaches zero.\nExplain the central limit theorem and its importance for the distribution and standard error of the\nsample mean\nLOS", "qhtml": null}, {"n": 85, "q": "A central bank's mandate to ensure the stability of the currency's purchasing power is most\nlikely supported by its role in:", "opts": ["implementing fiscal policy.", "supplying the country's currency.", "managing the country's gold reserves."], "ans": "B", "expl": "Typical roles of central banks\nMonetary roles Banking roles\nSupply the currency\nAct as the lender of last resort\nManage the money supply\nRegulate the payments system\nImplement monetary policy\nServe as government's bank and bankers' bank\nMaintain foreign exchange reserves\nOversee the banking system\nManage country's gold reserves\nCentral banks have a mandate not only to supply the currency but\nto promote the stability of its domestic purchasing power (ie, price stability). One of the\nfundamental characteristics of a fiat money system is that the currency should have a\nrelatively stable value over time.\nA central bank can support this mandate by using its role as the sole supplier of the currency\nto manage the money supply. Along with using two other monetary policy tools—setting the\npolicy interest rate and conducting open market operations—a central bank tries to maintain\nprice stability by controlling inflation and/or preventing major fluctuations in the prices of\ngoods. In addition, as the guardian of the value of the fiat currency, a central bank has a role\nof maintaining confidence in the currency.\n(Choice A) Central banks implement monetary policy but not fiscal policy (eg, government\nspending and taxation), which, in most countries, is a function of a legislative or executive\narm of the government.\n(Choice C) Since currencies are no longer backed by the gold standard, which was\nabandoned in the 20th century, managing gold reserves has no effect on a currency's\npurchasing power. However, many countries own large holdings of gold, and, in most of them,\nthe central bank is responsible for overseeing the gold reserves and has the authority to buy\nor sell the gold.\nThings to remember:\nA central bank can fulfill its mandate to ensure the stability of the purchasing power of its\ncountry's currency by using its role as supplier of the currency to manage the money supply.\nThis role, along with other monetary policy tools such as setting the policy interest rate and\nconducting open market operations, is used to promote price stability and control inflation.\nDescribe the roles and objectives of central banks\nLOS", "qhtml": null}, {"n": 86, "q": "Which of the following best describes a characteristic of the early expansion phase of the\nbusiness cycle?", "opts": ["Inflation accelerates, leading economic growth", "Capital spending by businesses expands rapidly", "Consumers accelerate spending on housing and durable goods"], "ans": "C", "expl": "The phases of the business cycle are expansion, peak, contraction (ie, recession), and trough.\nThe length of a business cycle, or any specific phase, is not predictable. However, each phase\nis associated with certain characteristics regarding GDP growth and inflation.\nExpansions are divided into early (ie, initial recovery) and late phases. The early expansion\nphase occurs after the economy has been in a trough, which is considered a turning point in\nthe cycle, when economic activities begin to expand. Characteristics of the early\nexpansion phase include the following:\nBusinesses begin to replenish inventories.\nConsumers start spending more, particularly on housing and durable goods , as\nincomes stabilize.\nGDP moves from negative to moderately positive.\nCentral banks generally keep interest rates low to support the expanding economy.\nUnemployment levels decline but remain high. Layoffs slow, but employers are reluctant\nto hire new staff without evidence of sustained economic growth.\n(Choice A) Inflation tends to lag other variables, exhibiting slow growth or even deflation.\nInflation catches up to economic growth during the later expansion phase.\n(Choice B) Early in the expansion, businesses are not yet willing or able to commit to large\ncapital spending plans (eg, new manufacturing facilities, expanding production capabilities). It\nis during the peak phase that business capital spending expands rapidly since confidence in\nthe business cycle is high.\nThings to remember:\nThe early expansion phase occurs after the economy has been in a trough, when economic\nactivities begin to expand. GDP growth moves from negative to moderately positive.\nConsumers start spending more, particularly on housing and durable goods.\nDescribe the business cycle and its phases\nLOS", "qhtml": null}, {"n": 87, "q": "On its cash flow statement, a company classified its interest paid and interest received as\noperating activities and classified its dividends paid to shareholders as a financing activity.\nThese classifications are most appropriate under which accounting standard?", "opts": ["Only IFRS", "Only US GAAP", "Either IFRS or US GAAP"], "ans": "C", "expl": "Differences between US GAAP and IFRS for cash flow statement items\nUS GAAP IFRS\nInterest received Operating Operating or investing\nInterest paid Operating Operating or financing\nDividend received Operating Operating or investing\nDividend paid Financing Operating or financing\nTypically operating, but specific portions\nTaxes paid Operating\ncan be classified as financing or investing\nUS GAAP and IFRS have different rules for how certain financial items are classified on a\ncompany's statement of cash flows. In general, US GAAP has more stringent rules and IFRS\nallows more flexibility. For example, IFRS allows a choice of classification for interest and\ndividends (paid or received) and for taxes paid.\nIn this scenario, the company has classified its interest paid and interest received as operating\nactivities and its dividends paid to shareholders as a financing activity. These classifications\nare allowed under both US GAAP and IFRS (Choices A and B) .\nThings to remember:\nUS GAAP and IFRS have different rules for how certain financial items are reported on a\ncompany's statement of cash flows. In general, US GAAP has more stringent rules and IFRS\nallows more flexibility.\nContrast cash flow statements prepared under International Financial Reporting Standards (IFRS)\nand US generally accepted accounting principles (US GAAP)\nLOS", "qhtml": null}, {"n": 88, "q": "An analyst is modeling the financial performance of a company currently operating in an\ninflationary environment. The analyst expects the company to increase its prices based on the\ncountry's consumer price index (CPI). When forecasting the company's next year's results,\nthe analyst's most appropriate assumption is that:", "opts": ["all costs will increase based on the CPI.", "revenues will increase if demand is highly price inelastic.", "the quantity sold will decrease if competitors adjust their prices faster."], "ans": "B", "expl": "Factors influencing revenue forecasts with inflation\nInelastic: raising prices increases revenues\nPrice elasticity of demand\nElastic: raising prices may decrease revenues\nGeographic mix of revenues must be considered\nInflation rates in different\nDifferences in inflation rates usually affect exchange\ncountries rates\nInflation does not affect all input costs equally\nProper identification of affected relevant costs is\nChanges in relevant costs\nessential\nPassing full costs to customers preserves margins\nPricing strategy\nPartial increase in prices may increase market share\nTo forecast revenues and costs, analysts assess multiple factors including price elasticity,\ninflation across countries, and relevant costs. Companies adopt different pricing strategies\ndepending on their objectives, such as preserving margins or increasing market share.\nAnalysts must consider the impact of pricing strategies when forecasting revenues, particularly\nduring periods of high or abnormal inflation.\nIn this situation, the analyst expects the company to increase its prices in line with the\ncountry's CPI . If demand for the company's products is highly price inelastic , an increase in\nprice will have little effect on quantity demanded and will likely increase revenues .\nTherefore, the analyst should predict an increase in revenues in the financial model.\n(Choice A) Analysts should not adjust all costs according to CPI. They need to understand\nhow each of a company's significant inputs (eg, raw material, salaries, utilities) are affected by\ninflation and estimate the specific impact of inflation on each associated cost.\n(Choice C) Faster price adjustments by competitors would accordingly entail increasing the\nprices of their products. In the short run, this enables the company to offer more attractive\nprices, which would increase its sales volume.\nThings to remember:\nAnalysts must consider the impact of pricing strategies when forecasting revenues, particularly\nduring periods of high or abnormal inflation. If demand for the company's products is highly\nprice inelastic (or elastic), an increase in price will have little (or a large) effect on sales\nvolume and will likely increase (or decrease) revenues.\nExplain how to forecast industry and company sales and costs when they are subject to price\ninflation or deflation\nLOS", "qhtml": null}, {"n": 89, "q": "An analyst estimates the probability distribution for a company's upcoming quarterly EBITDA:\nProbability EBITDA ($ billions)\n0.5 2.05\n0.2 2.20\n0.3 2.40\nThe standard deviation of the distribution (in $ billions) is closest to:", "opts": ["0.147", "0.150", "0.152"], "ans": "C", "expl": "The standard deviation of a random variable measures the dispersion around the\nvariable's expected value (ie, mean ). In this scenario, the random variable is the company's\nnext quarterly EBITDA. To solve for standard deviation, first calculate the expected value of\nEBITDA by finding the mean of the distribution: the probability-weighted average of the\npossible EBITDA outcomes. The distances between each outcome and the mean can then be\nused to calculate the standard deviation as a probability-weighted average dispersion around\nthe expected EBITDA value.\nProbability EBITDA ($ billions)\n0.5 2.05\n0.2 2.20\n0.3 2.40\nFrom the given probabilities and EBITDA outcomes shown above, calculate the standard\ndeviation as follows:\n(Choice A) Standard deviation of 0.147 results from taking the simple average of the\nXi-EX2 terms in the second step, instead of using the probability-weighted\naverage.\n(Choice B) Standard deviation of 0.150 results from using a simple average, instead of a\nweighted average, to calculate the expected EBITDA value.\nThings to remember:\nThe standard deviation of a random variable measures the dispersion around the variable's\nexpected value (ie, mean). To calculate standard deviation, first calculate the mean, then use\nits distance from each outcome to solve for the standard deviation as a probability-weighted\naverage dispersion.\nCalculate expected values, variances, and standard deviations and demonstrate their application to\ninvestment problems\nLOS", "qhtml": null}, {"n": 90, "q": "If spot exchange rate quotes are 0.1427 CAD/SEK and 0.1366 CAD/NOK, the no-arbitrage\nSEK/NOK spot rate is closest to:", "opts": ["0.0195", "0.9573", "1.0447"], "ans": "B", "expl": "A cross exchange rate can be derived by cross multiplying two other rates . Cross rates\nare commonly used to derive an exchange rate for a seldom-quoted currency pair, but they\ncan also be used to determine whether a quoted rate is fairly priced. One currency must be\ncommon to both cross-multiplied rates.\nIn this scenario, the SEK/NOK cross rate is calculated by cross multiplying the CAD/SEK and\nCAD/NOK exchange rates. Since both quotes have CAD in the numerator, the steps to\ncalculate the cross rate are as follows:\nThis cross rate is referred to as the no-arbitrage rate since it is calculated\nfrom observed market rates . Here, any SEK/NOK exchange rate other than 0.9573 would\nallow an investor to earn arbitrage profits by selling the relatively overvalued currency and\nbuying the relatively undervalued currency.\n(Choice A) 0.0195 results from failing to invert the CAD/SEK quote before multiplying it by\nthe CAD/NOK rate.\n(Choice C) 1.0447 results from incorrectly inverting the CAD/NOK quote rather than the\nCAD/SEK rate. Doing so results in the NOK/SEK cross rate instead of the SEK/NOK rate.\nThings to remember:\nCross rates result from multiplying two separate exchange rates to derive a third rate. They\ncan be used to provide an exchange rate between two currencies that are not commonly\ntraded or to determine whether a quoted rate is priced fairly.\nCalculate and interpret currency cross-rates\nLOS", "qhtml": null}];
const CFG = {"title": "UWorld Mock Exam 2 — Session 1", "subtitle": "UWorld · CFA Level I · 90 câu · 2h15p", "minutes": 135, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>

      .then(function(r){return r.json();})

        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script id="baii-calc-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("baiiPanel");}
  window.baiiOpen=function(){
    var fr=document.getElementById("baiiFrame");
    if(!loaded){ fr.src="baii-plus.html"; loaded=true; }
    P().classList.add("open"); document.getElementById("baiiOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.baiiClose=function(){
    P().classList.remove("open"); document.getElementById("baiiOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.baiiClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("baiiHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".bp-x")||e.target.closest(".bp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>
