<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Reem Gamal, CFA, is the owner of Osiris Partners. She is working on the marketing pitch that\nshe will give to the trustees of Horus University to have Osiris manage its endowment fund.\nAs part of her pitch, she plans to say:\nI: \"Since Osiris hires only CFA charterholders, we are among the elite asset\nmanagement firms, as proven by our performance: Our returns have outperformed the\noverall market in 9 of the past 10 years.\"\nII: \"By passing such an intense and comprehensive study program, each of our analysts\nhave enhanced their knowledge in portfolio management, including endowments.\"\nWhich of the statements would most likely violate the Standards?", "opts": ["Only Statement I", "Only Statement II", "Both Statement I and II"], "ans": "A", "expl": "\"When referring to CFA Institute, CFA Institute membership, the CFA\ndesignation, or candidacy in the CFA Program, Members and Candidates must\nnot misrepresent or exaggerate the meaning or implications of membership\nin CFA Institute, holding the CFA designation, or candidacy in the CFA\nProgram.\"\nStandard VII(B) Reference to CFA Institute, the CFA Designation, and the CFA\nProgram forbids Members and Candidates from exaggerating the meaning or implication of\nhaving a CFA charter . This includes overstating competency or the ability to achieve\nsuperior investment performance .\nAlthough Standard I(C) focuses generally on promises related to investment guarantees or\nability to achieve superior returns, Standard VII(B) specifies that these claims cannot be\nattributable to the CFA designation. However, statements of objective fact about the benefits\n(eg, knowledge and skills gained , credibility) of the CFA designation and the rigor of the\nprogram are allowed .\nIn this question, Gamal's first statement violates the Standard by asserting that Osiris\nPartners is an elite asset management firm since the firm hires only CFA charterholders; by\ndoing so, she attributes elite status to the charter. Even though the statement compares the\nfirm's performance against the market, the statement is still a violation since it implies\nsuperior performance can be expected going forward. Gamal's second statement does not\nviolate the Standard since it states only facts about the intensity of the exam and skills and\nknowledge earned (Choices B and C) .\nThings to remember:\nStandard VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program forbids\nMembers and Candidates from exaggerating the meaning or implication of having a CFA\ncharter violate the Standard. However, statements of objective fact about the benefits of the\nCFA designation and the rigor of the program are allowed.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards\nof Professional Conduct\nLOS", "qhtml": null}, {"n": 2, "q": "Based on Standard I Professionalism, Members and Candidates must :", "opts": ["have a duty of loyalty to their clients.", "maintain independence and objectivity.", "not compromise the reputation or the integrity of CFA Institute."], "ans": "B", "expl": "\"Members and Candidates must use reasonable care and judgment to achieve\nand maintain independence and objectivity in their professional activities.\nMembers and Candidates must not offer, solicit, or accept any gift, benefit,\ncompensation, or consideration that reasonably could be expected to\ncompromise their own or another's independence and objectivity.\"\nStandard I of the Standards of Professional Conduct addresses the professionalism of\nMembers and Candidates. Standard I(B) Independence and Objectivity specifically\nstates:\n\" Members and Candidates must use reasonable care and judgment to achieve and maintain\nindependence and objectivity in their professional activities .…\"\nStandard I(B) specifically focuses on Members and Candidates achieving and maintaining\nindependence and objectivity so that their actions and advice to clients are unaffected by\nconflicts of interest. The Standard applies to situations wherein entities or individuals may\nseek to influence the decision-making process to the detriment of clients. It does not apply to\ngifts from the clients themselves.\nIn this question, all answer choices are directly from the Standards but only one is associated\nwith Standard I.\n(Choice A) Standard III(A) Loyalty, Prudence, and Care specifically addresses the duty of\nloyalty that Members and Candidates have toward their clients.\n(Choice C) Standard VII(A) Conduct as Participants in CFA Institute Programs requires\nMembers and Candidates to act in a manner that does not compromise the reputation or the\nintegrity of CFA Institute.\nThings to remember:\nStandard I(B) Independence and Objectivity focuses on Members and Candidates achieving\nand maintaining independence and objectivity so that their actions and advice to clients are\nunaffected by conflicts of interest.\nExplain the ethical responsibilities required by the Code and Standards, including the sub-sections\nof each Standard\nLOS", "qhtml": null}, {"n": 3, "q": "Maria Garcia, CFA, is a sell-side analyst at Sharp Brokerage. Garcia is preparing a research\nreport on Kicks, Inc., a popular athletic shoe manufacturer. Sharp Brokerage is a market\nmaker in Kicks, Inc.\nGarcia is familiar with Kicks as she was on the investment banking team at a former employer\nthat brought Kicks public two years ago. Garcia also has a childhood friend who is now a\nprofessional athlete and occasionally receives free Kicks apparel.\nAccording to Standard VI(A) Disclosure of Conflicts, the research report should most\nappropriately disclose:", "opts": ["Garcia's history with Kicks' initial public offering.", "Garcia's friendship with the professional athlete.", "that Sharp Brokerage is a market maker of Kicks."], "ans": "C", "expl": "\"Members and Candidates must make full and fair disclosure of all matters\nthat could reasonably be expected to impair their independence and\nobjectivity or interfere with respective duties to their clients, prospective\nclients, and employer. Members and Candidates must ensure that such\ndisclosures are prominent, are delivered in plain language, and communicate\nthe relevant information effectively.\"\nStandard VI(A) Disclosure of Conflicts aims to protect employers and clients by promoting\ntransparency, allowing them to evaluate whether a Member or Candidate is acting\nindependently and objectively when offering investment advice or recommendations. When\na conflict can be reasonably viewed as interfering with a Member's or Candidate's ability\nto conduct unbiased investment evaluations , the employer and clients must\nbe informed on all pertinent details of the conflict.\nIn this instance, it is the broker/dealer (ie, Sharp Brokerage) who must notify clients that\nthe firm is a market maker in the securities included in the report. This disclosure alerts the\nclient that the firm may have a potential conflict in that it likely holds shares of Kicks in its\nown account for market-making purposes.\n(Choice A) Garcia's involvement in the IPO of Kicks two years ago with a previous employer\ndoes not create an ongoing or perpetual conflict. Garcia does not have a disclosable\nrelationship with the company currently.\n(Choice B) The fact that Garcia has a friend who is a professional athlete who occasionally\nreceives free Kicks apparel is too tangential (indirect) and minor to cause a conflict.\nThings to remember:\nStandard VI(A) Disclosure of Conflicts addresses the responsibility of members and candidates\nto disclose actual and potential conflicts of interests to clients, prospective clients, and\nemployers so they can determine whether the conflict might influence a candidate's or\nmember's objectivity.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and\nStandards\nLOS", "qhtml": null}, {"n": 4, "q": "Ross Farley, CFA, is the chief compliance officer at Prudent Advisors, Inc. (PA). PA offers\ninvestment advisory services to retail investors. Farley monitors the activity of six financial\nadvisors to ensure compliance with all applicable laws and regulations.\nFarley has provided all employees with the firm's code of ethics and a policies and procedures\nmanual. On an annual basis, Farley conducts educational training, sets expectations for\nbehavior, and asks employees to sign a document attesting that they have received the code\nand manual and understand their contents. In addition, employees are required to submit a\nquarterly transaction report detailing their trading of individual securities.\nFarley discovers that Greg Smith, an advisor at the firm, recently opened an unauthorized\naccount at a discount brokerage firm and is conducting personal trades that have not been\nreported or approved. According to Standard IV(C) Responsibilities of Supervisors, did\nFarley most likely violate the Standards?", "opts": ["No", "Yes, for failing to set up and implement an effective compliance program", "Yes, for failing to prevent Smith from trading in an unauthorized brokerage account"], "ans": "A", "expl": "\"Members and Candidates must make reasonable efforts to\nensure that anyone subject to their supervision or authority\ncomplies with applicable laws, rules, regulations, and the\nCode and Standards.\"\nStandard IV(C) Responsibilities of Supervisors requires Members and Candidates who\nsupervise employees to make a reasonable effort to detect and prevent unethical behavior\nand violations of the law, rules established by their firm, and the Code and Standards.\nHowever, failing to detect such behavior is not necessarily a violation of the Standard if\nthe supervisor ensures that a proper compliance system is in place .\nThe Guidance to the Standard indicates that compliance, at a minimum , requires supervisors\nto:\nestablish written compliance procedures, and\nperform regular reviews to ensure that employees are following the procedures.\nA supervisor who does not satisfy these requirements violates the Standard even if no laws or\ncodes were violated. However, the concept of \"reasonableness\" does not make supervisors\nresponsible for detecting all violations; employees may be able to evade compliance in ways\nthat cannot be detected through reasonable efforts.\nIn this instance, Ross Farley established and implemented an adequate compliance\nprogram (Choice B) . It is not reasonable to conclude that Farley should have\nknown that an employee would try to evade the requirement (Choice C) . However, now that\nhe knows it is possible, Farley should enhance the compliance systems to prevent future\noccurrences.\nThings to remember:\nStandard IV(C) Responsibilities of Supervisors requires supervisors to, at a minimum,\nestablish written compliance procedures and perform regular reviews to ensure that\nemployees are following those procedures. Supervisors who do not satisfy these requirements\nviolate the Standard even if no laws or codes are violated. However, the Standard requires\nonly that supervisors make reasonable preventative efforts; a supervisor who follows the\nrequirements does not violate the Standard even if there is a violation.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of\nEthics and Standards of Professional Conduct\nLOS", "qhtml": null}, {"n": 5, "q": "The GIPS standards most likely :", "opts": ["allow selection of the period to be presented for a composite and its benchmark.", "require inclusion of portfolios removed from a composite after the reported period.", "are enforced by regulatory authorities to ensure consistency among investment firms."], "ans": "B", "expl": "Common misleading performance reporting practices\nRepresentative Selecting top-performing portfolios to represent overall\naccounts results\nSurvivorship\nExcluding terminated portfolios from average performance\nbias\nVarying\nPresenting only selected periods of strong performance\ntime periods\n(GIPS®)\nThe Global Investment Performance Standards standardize the reporting of\nhistorical performance across the investment industry to facilitate comparisons between firms\nand increase investor confidence. The GIPS standards require that information is\ncomprehensive and represents actual performance. Investment managers at noncompliant\nfirms could mislead clients by selectively choosing to present information on:\nPortfolios managed: A firm might choose to share the historical performance of its top-\nperforming portfolios only, thus reporting greater returns than the actual results.\nFinancial assets: A firm might present the investment performance of only currently\ninvested assets, which creates survivorship bias by overlooking assets that were removed\nfrom the portfolio after performing poorly. Firms should include terminated client\naccounts, funds, and portfolios as part of the historical performance of a composite.\nTime period: Investment managers might inappropriately present the performance only\nfor periods when a portfolio outperformed the market or the benchmark.\n(Choice A) The GIPS standards prevent firms from presenting performance periods\nselectively by mandating a minimum number of consecutive periods to present.\n(Choice C) GIPS compliance is optional, so there is no regulatory oversight of the GIPS\nstandards.\nThings to remember:\nInvestment firms can mislead investors with an incomplete performance history, selectively\nchoosing which information to present. The GIPS standards provide a uniform approach to\npresenting composites that requires firms to include terminated client accounts, funds, and\nportfolios as part of the historical performance.\nDescribe the key concepts of the GIPS standards for firms\nLOS", "qhtml": null}, {"n": 6, "q": "Soomin Yoo, CFA, is helping grade the most recent Level 3 exam. At dinner one evening, she\ndiscusses the grading process with a friend, Minsoo Han, CFA, who is not participating in the\ngrading process.\nYoo states \"I'm surprised how many people are missing the question on fixed income investing\nstrategies. It didn't come across to me as that difficult.\"\nHan responds \"If that's the case, candidates might be in trouble. I read on a social media\npost that the multiple-choice section also had more fixed income questions than in other\nrecent exams.\"\nAccording to the Standards, is it most likely that:", "opts": ["both Yoo and Han have violated the Standards.", "Yoo has violated the Standards but Han has not.", "Han has violated the Standards but Yoo has not."], "ans": "B", "expl": "\"Members and Candidates must not engage in any conduct that\ncompromises the reputation or integrity of CFA Institute or the CFA\ndesignation or the integrity, validity, or security of CFA Institute\nprograms.\"\nStandard VII(A) prohibits Members and Candidates from engaging in behavior that\nundermines the integrity of CFA Institute, its programs, and the public's confidence in the level\nof merit needed to achieve a CFA charter. To uphold the integrity of the charter, the CFA\nInstitute takes care to ensure that confidential information about exams is not shared by\nanyone. For Members and Candidates, sharing such information is a violation of the Standard.\nMembers may not disclose :\nquestions that are set to appear on the exam or are under consideration,\nany parts of the deliberation process related to the exam, or\ninformation related to the grading of questions.\nGraders may not share information with anyone outside of the development or grading\nprocess . Since Han is not part of the grading process, Yoo may not discuss any information\nrelating to the grading of questions, whether it is specific details or general information. By\ndoing so, she violates the Standard. If this information were shared with other participants in\nthe grading process, it would not violate the Standard.\n(Choices A and C) Han does not violate the Standard since he is not part of the exam's\ndevelopment, administering, or grading process and therefore does not know any information\nto disclose. His only source of information is a social media post.\nThings to remember:\nStandard VII(A) prohibits Members and Candidates from engaging in behavior that\nundermines the integrity of CFA Institute, its programs, and the public's confidence in the level\nof merit needed to achieve a CFA charter. Members may not disclose information related to\nthe grading of questions to anyone outside of the grading process.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and\nStandards\nLOS", "qhtml": null}, {"n": 7, "q": "A Charterholder who lives and works in a country that adheres to a \"suitability standard\"\nrecommends an investment that meets a client's long-term financial objectives. If there was\nan equally suitable investment that paid the Charterholder a lower fee, the adviser's conduct\ncan be best described as:", "opts": ["legal and ethical.", "legal but unethical.", "illegal and unethical."], "ans": "B", "expl": "Instruments for compliance with professional ethics\nInstrument Owner Describes\nCode of ethics Professional organization Shared principles\nStandards of conduct Professional organization Minimally acceptable behavior\nLaws and regulations Government Legal limits of behavior\nLegal standards alone are insufficient to shape appropriate behavior among investment\nprofessionals . Laws are often too narrow to adequately prohibit all improper behavior and\nare often enacted after injury or damage has been done.\nEthics are created to govern moral conduct , which holds Members and Candidates to\na higher standard than required by laws and regulations . Ethical behaviors are those\nactions that conform to society's expectations for honesty, transparency, and fairness. They\nbalance each person's self-interest with an awareness of how a person's actions affect others.\nCFA Institute has adopted the Code and Standards as its statement of shared principles, on\nthe belief that ethics for the global investment industry should be universal rather than based\non local laws or customs. Global ethical standards are intended to create trust and integrity\nthroughout the global financial system.\nIn this instance, a suitability standard is a legal obligation that requires just\na minimal level of investment appropriateness without consideration for other\nfactors (eg, fees paid to the adviser). In contrast, a fiduciary obligation requires the adviser\nto adhere to a higher standard that involves always serving the client's best interest, such as\nminimizing fees, all else being equal. Therefore, the Charterholder's actions were legal but\nunethical (Choices A and C) .\nThings to remember:\nLegal standards alone are insufficient to shape appropriate behavior among investment\nprofessionals. A separate code of ethics can serve as a guide to appropriate moral conduct,\nwhich may exceed legal requirements.\nCompare and contrast ethical standards with legal standards\nLOS", "qhtml": null}, {"n": 8, "q": "Michael Woods, CFA, is a sell-side analyst at a large brokerage firm. Woods previously\npublished a \"buy\" rating on Mira Medical but believes the stock is now overvalued and submits\na downgrade report to his compliance department for approval.\nSally Silva, an influential buy-side portfolio manager at a large investment firm, calls Woods to\ndiscuss Mira's investment prospects. Woods does not mention the impending downgrade, but\nthe tone of the conversation leads Silva to suspect he is likely to downgrade Mira.\nSilva comments that Mira is her largest holding and that \"it would be very unfortunate\" if the\nstock were downgraded before year end. She mentions conversations with other sell-side\nanalysts that support higher price targets on Mira. Silva then says that a downgrade might\nshake her confidence in Woods, that others might be doing a better job, and she might take\nher business elsewhere.\nAfter this conversation, Woods postpones his downgrade, preferring to think for a while and\ncarefully consider all the relevant factors. Woods downgrades Mira Medical a few weeks later,\nduring the first week of the new year. According to Standard I(B) Independence and\nObjectivity, Woods:", "opts": ["did not violate the Standard.", "violated the Standard by delaying publication of the downgrade.", "violated the Standard by tipping off the portfolio manager that a downgrade was coming."], "ans": "B", "expl": "\"Members and Candidates must use reasonable care and judgment to achieve\nand maintain independence and objectivity in their professional activities.\nMembers and Candidates must not offer, solicit, or accept any gift, benefit,\ncompensation, or consideration that reasonably could be expected to\ncompromise their own or another's independence and objectivity.\"\nStandard I(B) Independence and Objectivity focuses on avoiding any actions that\nwould compromise the independence and objectivity of an investment professional. A\nsell-side analyst is often pressured by buy-side analysts and portfolio managers to express\nviews or take actions inconsistent with the sell-side analyst's honest opinion. Since buy-side\nfirms are the \"customer,\" they wield considerable influence over sell-side analysts, who are\noften directly compensated based on the amount of trading revenue they generate for their\nfirms.\nIn this scenario, Michael Woods has decided to downgrade Mira Medical and submitted his\nreport for compliance approval. A buy-side manager, Sally Silva, threatens to send business\nelsewhere, which would likely affect Woods' compensation. By acquiescing to Silva's remarks\nand delaying the downgrade until the new year, Woods\ncompromises his independence and objectivity and violates the Standard (Choice A) .\n(Choice C) As Wood did not disclose the impending downgrade, he did not violate the\nStandards. In such situations, a sell-side analyst must be careful not to disclose any current\nopinions that may differ from what has been published and disseminated fairly to all clients.\nThings to remember:\nStandard I(B) Independence and Objectivity mandates that Members and Candidates avoid\nactions that might compromise their own or another's independence and objectivity. A sell-\nside analyst is often pressured by buy-side analysts and portfolio managers to express views\nor take actions inconsistent with the sell-side analyst's honest opinion.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and\nStandards\nLOS", "qhtml": null}, {"n": 9, "q": "Which of the following statements best describes the obligation of Members and Candidates\nwith respect to the Standards of Professional Conduct? When in an advisory relationship with\na client, they must determine investment suitability based on only:", "opts": ["the merits of that specific investment.", "earning the highest returns with the lowest fees.", "the client's written objectives, mandates, and constraints."], "ans": "C", "expl": "\"When Members and Candidates are in an advisory relationship with a client,\nthey must:\na. Make a reasonable inquiry into a client's or prospective client's investment\nexperience, risk and return objectives, and financial constraints prior to\nmaking any investment recommendation or taking investment action and\nmust reassess and update this information regularly.\nb. Determine that an investment is suitable to the client's financial situation\nand consistent with the client's written objectives, mandates, and constraints\nbefore making an investment recommendation or taking investment action.\nc. Judge the suitability of investments in the context of the client's total\nportfolio.\"\nCFA Members (including CFA charterholders) and Candidates are obligated to abide by and\nadvocate for the Code of Ethics (ie, the Code) and the Standards of Professional Conduct (ie,\nthe Standards ), which provide guidance for appropriate ethical behavior . The Code\nincludes general principles to which Members and Candidates must adhere. In contrast, the\nStandards address the principles' more specific applications, which must be followed.\nStandard III(C) Suitability addresses the Members' and Candidates' responsibilities to assess\nthe suitability of investments for each client. A Member or Candidate does this by researching\neach client's specific investment goals, constraints, and risk tolerance, which are compared to\nthe characteristics of each proposed investment. Specifically, a Member or Candidate\nmust determine suitability based on a client's written objectives , mandates ,\nand constraints before taking investment action.\n(Choice A) Investment suitability is based not only on the merits of a specific investment but\nalso how that investment fits within a client's total portfolio.\n(Choice B) Low-fee investments are preferred if they are suitable and appropriate. However,\nthe highest expected return may entail greater risk (ie, returns cannot be ensured) than a\nclient is willing or able to bear and so may not be suitable for that client.\nThings to remember:\nStandard III(C) Suitability addresses the responsibility of Members and Candidates to assess\nthe suitability of investments when in an advisory relationship with a client. This is done by\nresearching the client's specific investment goals, constraints, and risk tolerance, as well as\nthe characteristics of each proposed investment.\nIdentify the six components of the Code of Ethics and the seven Standards of Professional Conduct\nLOS", "qhtml": null}, {"n": 10, "q": "Kevin Smith, Level I CFA Candidate, has just finished the exam. Outside the test center, he\nposts on a popular CFA social media blog, \"The Level I CFA mocks are a joke!\", \"Be sure to\nmemorize ALL the convexity formulas!!!\" Hamza Bennani, who is also a Level I CFA\nCandidate, immediately responds by stating \"I hope I passed! The CFA Institute needs to\nprovide better exam prep materials as there were too many questions that I wasn't prepared\nfor!\"\nBased on Standard VII(A) Conduct as Participants in CFA Institute Programs, most likely :", "opts": ["only Smith violated the Standard.", "only Bennani violated the Standard.", "both Bennani and Smith violated the Standard."], "ans": "A", "expl": "\"Members and Candidates must not engage in any conduct\nthat compromises the reputation or integrity of CFA\nInstitute or the CFA designation or the integrity, validity, or\nsecurity of CFA Institute programs.\"\nStandard VII(A) Conduct as Participants in CFA Institute Programs mandates that\nMembers and Candidates maintain the reputation, integrity, validity, and security of CFA\nInstitute exams and programs. The Standard prohibits behavior that would compromise the\npublic's confidence in the level of merit needed to achieve a CFA charter.\nCandidates taking the exam must sign the Candidate Pledge, which identifies behaviors that\nare prohibited before, during, and after the test. These behaviors include:\ngiving or receiving information about the exam before or during the exam, and\nproviding information regarding the exam to others after the exam, including broad\ntopical areas and formulas tested , until that information is publicly released by CFA\nInstitute.\nIn this instance, Kevin Smith violated the Standard by providing specific information\nregarding which formulas were tested . However, Hamza Bennani did not violate the\nStandard as he made a very generic comment without mentioning any areas of study or exam\ncontent.\n(Choices B and C) Members and Candidates can express opinions about the exams or the\nCFA Institute without violating the Standard as long as the opinions do not reveal specific\ninformation about the exams. Smith and Bennani did not violate the Standard by criticizing\nthe CFA Institute.\nThings to remember:\nStandard VII(A) requires Members and Candidates to refrain from engaging in conduct that\nundermines the integrity of the CFA exam process. This includes disclosing confidential\ninformation, including specific details about questions or broad topic areas tested on the\nexam, until it is publicly released by CFA Institute.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards\nof Professional Conduct\nLOS", "qhtml": null}, {"n": 11, "q": "Sumit Ahuja, CFA, is an investor with limited knowledge of the biotech industry. Through an\nexpert network, he calls a physician at a prestigious hospital regarding broad trends in the\nbiotech industry. The physician names several companies that have high-profile drugs in the\nfinal stages of the government's publicly disclosed approval process. One of the companies is\nOrion Pharmaceuticals. After the call, as part of his thorough research on Orion, Ahuja\npurchases a newly released research report from Vijaya Dayal, a respected biotech analyst\nwho covers Orion. In her report, Dayal states that Orion's drug is likely to receive regulatory\napproval, based on her own opinion from thorough research. As a result, Ahuja purchases\nstock in Orion. Ahuja:", "opts": ["was in full compliance of the Standards.", "violated the Standards by trading based on information received from the expert network.", "violated the Standards by trading based on a research report that was not disseminated to the general public."], "ans": "A", "expl": "\"Members and Candidates who possess material nonpublic\ninformation that could affect the value of an investment\nmust not act or cause others to act on the information.\"\nStandard II(A) requires Members and Candidates to abstain from investment actions if\nthey have material nonpublic information (MNI) . Trading based on MNI erodes trust in the\nfairness of the capital markets and the investing profession by perpetuating the idea that\ninsiders take deceitful advantage of the investing public. MNI can come from many sources,\nincluding company management and expert networks. A Member or Candidate must evaluate\nthe information itself to decide whether it is MNI before acting on it.\nIn this question, the physician whom Sumit Ahuja calls through an expert network provides\ninformation on broad industry trends, which is nonmaterial since it is not company specific.\nThe physician also provides the names of companies with drugs in the final stages of the\ngovernment approval process, which is public information. Therefore, Ahuja did not receive\nMNI through the expert network and did not violate the Standard by acting on it (Choice B) .\nAlthough research reports from sell-side analysts, even those based on opinions, can be\nmaterial and nonpublic, trading based on these reports does not violate the Standard if any\ninvestor can purchase them. Such availability means that a report is public even if not\npublicly disseminated. Since the report Ahuja purchased from Vijaya Dayal is available to all\ninvestors, Ahuja did not violate the Standard by acting on it (Choice C) .\nThings to remember:\nStandard II(A) requires Members and Candidates to abstain from making transactions using\nmaterial nonpublic information (MNI). MNI can come from many sources, including company\nmanagement and expert networks. Members and Candidates must evaluate information to\ndecide whether it is material and nonpublic before acting on it.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and\nStandards\nLOS", "qhtml": null}, {"n": 12, "q": "Jessica Meyer, CFA, is a portfolio manager at a large life insurance company. Meyer is a\nmember of the investment committee, which collectively makes investment decisions for the\ncompany's investment portfolio. Meyer is the team's emerging market specialist and was\nrecently assigned to analyze the investment prospects of a high-yield debt offering backed by\noil export revenues in an emerging market country.\nMeyer was tasked with this assignment as she is the most qualified to do the analysis, but she\npersonally believes the insurance portfolio should not invest in energy companies for\nenvironmental reasons. After considering all factors, in her final report to the committee,\nMeyer recommends not investing due to the considerable risk involved.\nAfter long and thorough deliberation, the committee votes to invest in the debt offering,\ndespite the acknowledged risk. A report is created detailing the discussion and listing all\ncommittee members present for the due diligence file. Based on Standard V(A) Diligence and\nReasonable Basis, Meyer should most likely :", "opts": ["do nothing.", "disassociate herself from the report, as it does not align with her personal beliefs.", "disassociate herself from the report, as it does not reflect her true investment opinion."], "ans": "A", "expl": "\"Members and Candidates must:\n1. Exercise diligence, independence, and thoroughness in\nanalyzing investments, making investment\nrecommendations, and taking investment actions.\n2. Have a reasonable and adequate basis, supported by\nappropriate research and investigation, for any\ninvestment analysis, recommendation, or action.\"\nStandard V(A) Diligence and Reasonable Basis requires all investment analysis done by\nMembers and Candidates to be diligent and thorough. Reasonable efforts must be made to\nensure all pertinent issues are considered when issuing recommendations.\nWhen investment analysis and recommendations are done by a group , not all members of\nthe group must agree on the conclusion. Those with dissenting opinions :\nmay keep their names on the report, and\nare not required to disassociate if they disagree with colleagues so long as they\nbelieve the group's conclusion has a reasonable and adequate basis .\nIn this scenario, although Jessica Meyer does not agree with its conclusion, the group's\nprocess was reasonable and adequate (ie, \"long and thorough deliberation\"). The fact that the\ngroup's decision conflicts with her personal beliefs is an inadequate basis for disassociating.\nAs such, there is no need for Meyer to disassociate (Choices B and C) .\nThings to remember:\nStandard V(A) Diligence and Reasonable Basis requires all investment analysis done by\nMembers and Candidates to be researched thoroughly. When investment analysis and\nrecommendations are done by a group, those with dissenting opinions do not need to\ndisassociate if they believe the group's conclusion has a reasonable and adequate basis.\nRecommend practices and procedures designed to prevent violations of the Code of Ethics and\nStandards of Professional Conduct\nLOS", "qhtml": null}, {"n": 13, "q": "Regarding unethical behavior, overconfidence bias least likely leads to overestimating:", "opts": ["the morality of one's own behavior.", "one's underlying intrinsic motivations.", "external situational influences on one's behavior."], "ans": "C", "expl": "Factors that challenge ethical behavior\nInternal (beliefs or biases) External (situational influence)\nBelief that \"I'm above average\" Financial reward\nOverconfidence Prestige\nAbility to rationalize Loyalty to employer\nEthical judgment can be challenged by internal or external factors. Internal factors are beliefs\nor biases that impede cognitive reasoning and judgment. A common example\nis overconfidence bias , which leads individuals to ignore relevant factors and,\ninstead, rely on a belief in their own superior ethical judgment and intrinsic motivations\n(Choices A and B) .\nAn external factor is a situational influence, such as a cultural or environmental factor, that\nmay encourage or discourage ethical judgment and behavior. In the investment industry,\ncommon situational influences that challenge ethical behavior involve money and prestige.\nIndividuals are more likely to underestimate situational influences on their behavior due\nto overconfidence bias .\nThings to remember:\nOverconfidence bias can lead individuals to ignore relevant factors and, instead, rely on a\nbelief in their own superior ethical judgment. Individuals are more likely to underestimate\nsituational influences on their behavior due to overconfidence bias.\nIdentify challenges to ethical behavior\nLOS", "qhtml": null}, {"n": 14, "q": "Sarah Paxton, CFA, works as an investment adviser at a bank. When a client is interested in\nbuying a home, she refers them to Susan Jones, a friend and real estate agent. Jones\nreciprocates by referring real estate clients to Paxton when appropriate. Since Paxton and\nJones are both skilled and respected professionals, each believes the referrals benefit their\nclients and are in the clients' best interest.\nAccording to Standard VI(C) Referral Fees, Paxton is most likely :", "opts": ["required to disclose this arrangement to both her employer and clients.", "not required to disclose this arrangement because she believes the clients benefit.", "not required to disclose this arrangement because no money is exchanged between Paxton and Jones"], "ans": "A", "expl": "\"Members and Candidates must disclose to their employer, clients, and\nprospective clients, as appropriate, any compensation, consideration, or\nbenefit received from or paid to others for the recommendation of products\nor services.\"\nStandard VI(C) Referral Fees requires Members and Candidates\nto notify their employers , existing clients , and prospective clients of benefits received\nfor recommending a product or service . Disclosing referral fee arrangements allows\nemployers and clients to determine whether conflicts of interest exist and whether a\nrecommendation is impartial. Referral fees are broadly defined and include any cash or\nnoncash rewards (eg, tickets to a sporting event).\nIn this question, Paxton has entered into an agreement with Jones to mutually refer clients\nwhen appropriate, which is beneficial for both Paxton and Jones.\nTherefore, Paxton is required to disclose this information to both\nher employer and clients although no direct money transfer is involved (Choice C) .\n(Choice B) The fact that Paxton believes the clients benefit from the arrangement does not\npreclude Paxton from the disclosure requirement of the Standard.\nThings to remember:\nMembers and Candidates must notify their employers, existing clients, and prospective clients\nof any benefits received for recommending a product or service. This disclosure allows\nemployers and clients to determine whether conflicts of interest exist.\nRecommend practices and procedures designed to prevent violations of the Code of Ethics and\nStandards of Professional Conduct\nLOS", "qhtml": null}, {"n": 15, "q": "Regina Garcia, CFA, is the equity trader at Rushmore Advisors (RA), an institutional buy-side\nfirm. RA's normal business practice is to pay a standard commission rate of $0.02 per share\nfor all stock trades. This $0.02 commission pays for the cost of both research and trade\nexecution. RA has trading relationships with two firms: Execution Only, Inc. (EO), where RA\nhas committed to a minimum amount of soft dollar commissions to pay for research, and\nIntegrated Brokers, for all other trades.\nTrading activity has been lower than expected, and Garcia determines that the standard $0.02\nper share commission will be insufficient to cover the cost of RA's soft dollar commitments to\nEO for the year. To prevent a shortfall, Garcia allocates most trades to EO and increases the\ncommission rate paid to EO to $0.05 per share.\nAccording to Standard III(A) Loyalty, Prudence, and Care, did Garcia most likely violate the\nStandards?", "opts": ["Yes", "No, since Garcia has a duty of loyalty to her employer", "No, since soft dollar arrangements are acceptable under the Code and Standards"], "ans": "A", "expl": "\"Members and Candidates have a duty of loyalty to their clients and must act\nwith reasonable care and exercise prudent judgment. Members and\nCandidates must act for the benefit of their clients and place their clients'\nbest interests before their employer's or their own interests.\"\nInvestment managers pay a commission to a broker to execute client trades. Soft\ndollar brokerage is the practice of using a portion of brokerage commissions to purchase\ninvestment research and related services . When a portion of the commission is used to\npurchase additional investment services (ie, soft dollars), the services \"belong\" to the client\nsince the client indirectly \"pays\" the commission (ie, out of client assets). The investment\nmanager has a duty of loyalty to use such assets for the benefit of the client.\nIn this instance, Garcia and the investment manager violated the duty of loyalty to\nthe client by paying a higher-than-normal commission rate for the exclusive purpose of\ngenerating soft dollar commissions .\nThe client will not receive any additional benefit from paying the higher commission since\nno additional research will be provided to Rushmore Advisors (RA).\nThe only benefit of paying a higher commission was to satisfy RA's prior commitment to\nExecution Only, Inc., which is not the client's responsibility.\n(Choice B) Garcia has a duty of loyalty to her employer (ie, ensure appropriate allocation of\ncommissions) but not at the expense of the client.\n(Choice C) Soft dollar arrangements are acceptable under the Code and Standards, but it is\nnot acceptable for clients to pay a higher-than-normal brokerage commission without\ncommensurate client benefit.\nThings to remember:\nSoft dollar brokerage is the practice of using a portion of brokerage commissions to pay for\ninvestment research. The portion of trading commissions used to purchase research is\nconsidered an asset of the client, not the investment manager. The manager has a duty of\nloyalty to use this asset for the benefit of the client.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and\nStandards\nLOS", "qhtml": null}, {"n": 16, "q": "Xu Liang, CFA, is an equity portfolio manager of a large mutual fund. Liang's fund primarily\ninvests in large-cap, dividend-paying stocks that tend to be less volatile than the broad equity\nmarket.\nBernard Gerhardt is Liang's primary contact and salesperson at Trusted Brokers. Liang's firm\nis Trusted Brokers' largest client, and Liang's fund generates significant commission business.\nGerhardt approaches Liang regarding a private placement in Smart AI, an artificial intelligence\nsoftware company. During their conversation, Gerhardt comments that \"I know you don't\nnormally buy these things for the mutual fund, but Smart AI is priced so cheap that it could\neasily double in just a few months! You should consider investing personally.\"\nLiang conducts thorough due diligence and believes Smart AI is a great investment\nopportunity but not a good fit for the fund since it does not align with the fund's mandate and\nrisk profile. Therefore, Liang decides to personally invest in the private placement. According\nto Standard VI(B) Priority of Transactions, Liang most likely :", "opts": ["violated the Standard by personally investing in the private placement.", "did not violate the Standard since the investment was inappropriate for the fund.", "did not violate the Standard since the fund was given the opportunity to invest first."], "ans": "A", "expl": "\"Investment transactions for clients and employers must have priority over\ninvestment transactions in which a Member or Candidate is the beneficial\nowner.\"\nStandard VI(B) Priority of Transactions requires Members and Candidates to place clients'\nand employers' financial interests before their own when conducting investment transactions\nand to avoid even the appearance of conflicts of interest. A Member or Candidate's\nparticipation in private placements and initial public offerings (IPOs) requires an especially\nhigh standard of care.\nThe potential for conflicts of interest is more significant for investment personnel at large\ninvestment firms. Investment personnel (eg, Liang) may be offered special enticements, such\nas access to private placements or IPOs, as payback for doing business (eg, largest client)\nwith the broker (eg, Trusted Brokers) offering the securities.\nAnother concern is that once the private placement goes public, there is an incentive for the\nMember or Candidate who bought into the private placement and holds the now-public\ncompany's stock to offer and/or buy the securities for clients (or, in this case, for the fund)\nwhether suitable or not.\nParticipation in private placements should be strictly limited to special situations in\nwhich there is no potential for even the appearance of conflicts of interest .\nTherefore, Liang violated the Standard by involving himself in a situation that potentially\nhad the appearance of impropriety .\n(Choices B and C) Liang appropriately considered the investment for the fund first and\nfound it unsuitable. However, this is not where the violation occurred.\nThings to remember:\nStandard VI(B) requires Members and Candidates to place clients' and employers' financial\ninterests before their own when conducting investment transactions. Participation in private\nplacements should be strictly limited to special situations in which there is no potential for\neven the appearance of conflicts of interest.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of\nEthics and Standards of Professional Conduct\nLOS", "qhtml": null}, {"n": 17, "q": "Jalen Butler, CFA, is a research analyst for Principal Capital. As part of his research, Butler\nuses aggregated data generated from a variety of social media websites to track trends.\nPrincipal's compliance department updates its record retention policies annually, and therefore\nits most recent rules do not include several of the new websites used by Butler. Butler does\nnot retain the data generated from the websites outside of Principal's record retention list\nsince the information is on the internet and therefore is easily accessible. Has Butler most\nlikely violated the Standards?", "opts": ["Yes", "No, since certain sources are not on Principal's record retention list", "No, since he is not required to retain records of information that can be found on the internet"], "ans": "A", "expl": "\"Members and Candidates must develop and maintain appropriate\nrecords to support their investment analyses, recommendations,\nactions, and other investment-related communications with clients\nand prospective clients.\"\nStandard V(C) Record Retention requires members and candidates to keep records of their\nresearch and motives for their actions and recommendations. Although records are\nconsidered property of the firm, and the Standard places some responsibility for record\nretention on the firm, Members and Candidates are ultimately responsible for assisting the\nfirm in collecting and retaining this information , even if it is easily accessible to anyone via\nthe internet. Sources that require retention include:\nClient conversations\nNotes from earnings calls\nStatistical analyses (ie, spreadsheets)\nWritten reports\nElectronic communications (eg, texts, emails)\nMedia communications (eg, Twitter feeds, blogs)\nGiven the frequent changes in digital media landscape, companies' record retention policies\noften lag the creation and popularization of new sources of information. This puts the burden\nof retention regarding these types of media more heavily on the Member or Candidate than\nthe company. In this question, Jalen Butler is required to retain his records from all social\nmedia websites, whether on the company's retention list or not. Failing to do so violates the\nStandard (Choice B) .\n(Choice C) Although media communication is often easily accessible on the internet,\ninformation can also be removed from a website, so Members and Candidates are required to\nretain this information.\nThings to remember:\nStandard V(C) Record Retention requires members and candidates to keep records of their\nresearch and motives for their actions and recommendations. Members and Candidates are\nultimately responsible for assisting the firm in collecting and retaining this information. Given\nthe frequent changes to digital media landscape, the burden of retention of these types of\nmedia falls more heavily on Members and Candidates than companies.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to\nsituations involving issues of professional integrity\nLOS", "qhtml": null}, {"n": 18, "q": "Aditi Kumar is a Level II Candidate and a performance measurement and attribution analyst\nfor an investment manager. On a quarterly basis, Kumar produces performance reports that\ninclude the firm's composites for each investment strategy.\nRaheem Khan, CFA, the portfolio manager of the firm's large-cap equity strategy approaches\nKumar regarding the large-cap equity composite for the most recent quarter. Kumar explains\nthat several accounts in the composite should be excluded from this quarter's performance\nreport due to a software issue that resulted in numerous accounts not being fully invested.\nThe resulting cash drag caused the composite to underperform the benchmark index for the\nquarter and year.\nKhan explains that he should not be held responsible for a software error. Kumar agrees and\nproduces new reports without the affected accounts. According to Standard I(C)\nMisrepresentation, it is most likely that:", "opts": ["no violation occurred.", "only Kumar violated the Standard.", "both Kumar and Khan violated the Standard."], "ans": "C", "expl": "\"Members and Candidates must not knowingly make any misrepresentations relating to\ninvestment analysis, recommendations, actions, or other professional activities.\"\nStandard I(C) Misrepresentation protects investors against statements and information\nprovided by the investing community that may undermine investor trust in the integrity of the\nprofession. Misrepresentation can include:\nPlagiarism: quoting information without acknowledgment or citation of the source\nOmission: presenting incomplete or misleading information\nExaggeration: inflating professional credentials or performance results\nPerformance measurement and attribution is an area susceptible to selective disclosure and\nomission. A prime example is the concept of \"cherry picking,\" which involves choosing only\nthe best funds or accounts or omitting the worst for performance reporting. Omitting\naccounts or altering composite construction outside a clearly defined process may lead to\nmisrepresenting composite performance.\nIn this instance, Khan persuaded Kumar to alter the composite construction due to a one-time\nsoftware issue, which improved the composite's performance. Therefore, both Kumar and\nKhan violated the Standard by presenting incomplete or misleading information\n(Choices A and B) .\nAlthough the software issue may not have been Khan's fault, changing the composite\nconstituents to omit the affected accounts violates the Standard. Also, the fact that Kumar is\nnot yet a charterholder is irrelevant in this scenario since he, as a Candidate, is expected to\nuphold the Code and Standards.\nThings to remember:\nPerformance measurement and attribution is an area susceptible to selective disclosure,\nomission, and exaggeration. \"Cherry picking\" involves choosing only the best funds or\naccounts or omitting the worst for performance reporting. Omitting accounts or altering\ncomposite construction outside a clearly defined process may lead to misrepresenting\ncomposite performance.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and\nStandards\nLOS", "qhtml": null}, {"n": 19, "q": "Elise Berger, CFA, is sell-side analyst for Brick Wall Bank (BWB). Based on BWB's process,\nBerger sends her research reports through email to all clients simultaneously. BWB's largest\nclient, Standard Capital, offers to pay higher commissions to BWB for follow-up phone calls\nfrom Berger when she releases new research. BWB and Berger agree to this arrangement.\nBerger plans to offer this deal only to BWB's next nine largest clients since only they do\nenough business with BWB to afford the new service at the new, higher level of commission.\nWhich of the following best describes Berger's options under the Code and Standards?", "opts": ["Offer the higher level of service as planned", "Not offer different levels of service to her customers", "Offer the higher level of service only if it is offered to all clients"], "ans": "C", "expl": "\"Members and Candidates must deal fairly and objectively\nwith all clients when providing investment analysis, making\ninvestment recommendations, taking investment action, or\nengaging in other professional activities.\"\nStandard III(B) Fair Dealing requires Members and Candidates to treat all clients fairly when\nrecommending investments or undertaking investment actions on their behalf. Members and\nCandidates must ensure their investment recommendations are disseminated in a way that\nprovides all clients the fair opportunity to act on every recommendation.\nHowever, \"fair\" does not mean \"equal.\" The Standard allows firms and analysts to\noffer higher levels of service to clients willing to pay a premium (Choice B) . These\nservices:\nmust not disadvantage or negatively affect other clients and\nmust be disclosed and available to all clients and prospective clients.\nIn this scenario, Berger plans to offer the higher level of service (ie, follow-up calls) only to\nBrick Wall Bank's (BWB's) ten largest clients. Since she does not plan to offer this service to\nother clients, she violates the Standard. Although other clients do not currently do enough\nbusiness with BWB to afford the service, they might wish to do more business with BWB or\npay higher commissions if the additional service were offered to them (Choice A) . Not\ndisclosing the service to them gives them no choice.\nThings to remember:\nStandard III(B) Fair Dealing requires Members and Candidates that are analysts to ensure\ntheir investment recommendations are fairly disseminated. Different levels of service to\nclients are allowed if those services do not disadvantage or negatively affect other clients and\nare disclosed and available to all clients and prospective clients.\nRecommend practices and procedures designed to prevent violations of the Code of Ethics and\nStandards of Professional Conduct\nLOS", "qhtml": null}, {"n": 20, "q": "Ajay Patel, CFA, is a financial adviser for Eclipse Financial. At a party, Patel discusses financial\nadvisory services with Nira Jain. Jain asks Patel to be her adviser, but Patel states that he\ncannot accept new clients. Patel recommends Eclipse and states that he has faith in all the\ncompany's advisers. Jain agrees to become a client of Eclipse if Patel agrees to meet with her\nquarterly over dinner, paid for by Jain, to discuss her portfolio allocation. Which of the\nfollowing best describes Patel's options under the Code and Standards?", "opts": ["Patel must reject the offer", "Patel can accept the offer but then must disclose it immediately to Eclipse in writing", "Patel can accept the offer only after disclosing it in writing to Eclipse and receiving approval in writing"], "ans": "C", "expl": "\"Members and Candidates must not accept gifts, benefits,\ncompensation, or consideration that competes with or might\nreasonably be expected to create a conflict of interest with\ntheir employer's interest unless they obtain written consent\nfrom all parties involved.\"\nStandard IV(B) Additional Compensation Arrangements requires Members and Candidates to\nobtain written permission when third-party, additional compensation agreements could\nbe reasonably seen as creating a conflict with their employers. Permission must be received\nfrom all parties before the agreement can be accepted . The Standard applies to both\nmonetary and nonmonetary (eg, gifts, benefits) compensation.\nIn this scenario, accepting Jain's offer to pay for quarterly dinners to discuss portfolio\nallocation could be perceived as a conflict of interest since Patel's actions can be perceived as\ngiving Jain preferential treatment. His advice could be viewed as favoring Jain over his own\nclients and may run counter to advice given by Eclipse's other advisers. To comply with the\nStandard, Patel would be required to obtain written permission from both Jain and Eclipse\nbefore accepting the offer so Eclipse can monitor his actions.\n(Choice A) Patel is not required to reject the offer so long as he obtains written permission\nfrom all parties involved so his employer can monitor for conflicts.\n(Choice B) Informing Eclipse after accepting the offer is a violation of the Standard. Patel\nmust receive permission before agreeing so Eclipse can decide if the agreement presents a\nconflict.\nThings to remember:\nStandard IV(B) requires Members and Candidates to obtain written permission when third-\nparty, additional compensation agreements could be reasonably seen as creating a conflict\nwith their employers. Permission must be received from all parties before an agreement can\nbe accepted.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to\nsituations involving issues of professional integrity\nLOS", "qhtml": null}, {"n": 21, "q": "Firm X acquires Firm Y. Both firms have historically claimed GIPS compliance. In the\nacquisition, all of Firm Y's portfolio managers have been retained by Firm X but most of the\nresearch and support staff have not. The research duties will be assumed by Firm X's existing\nstaff. According to the GIPS standards, can Firm X link Firm Y's past performance with its\nown?", "opts": ["No.", "Yes, since Firm X has acquired Firm Y.", "Yes, since the portfolios' management remains the same."], "ans": "A", "expl": "Global Investment Performance Standards (GIPS®) are a standardized approach for\ninvestment performance presentation. GIPS compliance is on a firm-wide basis only (ie, not\non a composite and/or fund level). When a new firm is created or an existing firm is acquired,\nthe prior or existing firm's historical GIPS-compliant performance can be linked to (ie,\nassumed by and reported with) the new or acquiring firm's reported performance , provided\nthat all of the following conditions are met:\nSubstantially all the investment decision makers are employed by the new or acquiring\nfirm. This includes not only portfolio managers but also the relevant research and\nsupport staff.\nThe investment decision-making process must remain independent (ie, no interference\nby acquiring firm) and substantially intact.\nThe new or acquiring firm must maintain records that support the reported performance.\nThere is no break (ie, gap) in the performance record when transitioning to the new\nfirm. If there is a break, the past performance can still be presented but not linked.\nIn this scenario, since Firm X has not retained Firm Y's key investment decision-making\npersonnel, Firm X cannot link Firm Y's past performance with its own (Choices B and C) .\nThings to remember:\nPast GIPS-compliant performance can be linked to a new or acquiring firm provided that\ncertain conditions are met; those conditions include retaining personnel, maintaining records,\nkeeping the decision process intact, and allowing no break in the performance record.\nDescribe the fundamentals of compliance, including the recommendations of the GIPS Standards\nwith respect to the definition of the firm and the firm’s definition of discretion\nLOS", "qhtml": null}, {"n": 22, "q": "Ching Liu, CFA, investor relations manager at Emerald Software (ES), arranges a video\nconference call with a small group of sell-side analysts to discuss confidential company\ndevelopments. On the call, Liu tells the analysts that ES has decided to selectively disclose\ninformation to give the analysts time to think about the company developments before they\nare publicly announced in two days. Liu then tells the analysts that the company had a\ndisagreement with its auditors over revenue recognition policies and as a result, ES has\nchanged auditors.\nBo Wang, CFA, is an analyst on the call and immediately recognizes the negative implications\nthis will have for ES. Wang believes a potential accounting scandal will not only drive down\nthe stock price, but will motivate customers to switch to Ruby Software (RS), ES's largest\ncompetitor. Later that day, Wang calls his best clients and recommends purchase of RS\nwithout mentioning ES. Numerous clients act on this recommendation.\nAccording to Standard II(A) Material Nonpublic Information, it is most likely that:", "opts": ["no violation occurred.", "only Liu violated the Standard.", "only Wang violated the Standard."], "ans": "C", "expl": "\"Members and Candidates who possess material nonpublic\ninformation that could affect the value of an investment\nmust not act or cause others to act on the information.\"\nStandard II(A) Material Nonpublic Information requires Members and Candidates\nto abstain from investment actions if they have material nonpublic information (MNI) .\nTrading on or acting on MNI erodes the public's trust in the fairness of the capital markets.\nMNI can come from many sources, and a Member or Candidate must evaluate information to\ndecide whether it is MNI before acting on it.\nSelective disclosure (eg, analysts on a conference call, corporate insiders) does not necessarily\nmake information public. In this question, Ching Liu and ES intentionally disclosed information\nand gave the analysts the timeline of when that information would be publicly disseminated.\nThis t
