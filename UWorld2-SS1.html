tích sử dụng phân tích tỷ lệ tài chính tích hợp để đánh giá hiệu suất của công ty về mặt\nhoạt động hoặc hiệu suất, tính thanh khoản, khả năng thanh toán và lợi nhuận.\nTỷ lệ hoạt động đo lường mức độ hiệu quả của một công ty sử dụng tài sản của mình.\nChỉ số thanh khoản đo lường mức độ một công ty có thể trang trải các nghĩa vụ ngắn hạn của mình bằng\ntiền mặt hoặc bằng các tài sản dễ dàng chuyển đổi thành tiền mặt.\nTỷ lệ khả năng thanh toán đo lường khả năng đáp ứng các nghĩa vụ dài hạn của công ty.\nTỷ lệ lợi nhuận đo lường lợi nhuận của công ty về doanh thu và lợi tức đầu tư.\nLợi nhuận trên doanh thu đo lường tỷ suất lợi nhuận kiếm được từ việc bán hàng. Lợi tức đầu tư\nđo lường lợi nhuận từ vốn đầu tư (ví dụ: vốn chủ sở hữu).\nTừ thông tin được cung cấp trong câu hỏi, khả năng thanh toán được đo bằng tỷ lệ Nợ trên-\nEBITDA, hiệu quả được đo bằng tổng vòng quay tài sản và khả năng sinh lời\nđược đo bằng tỷ suất lợi nhuận ròng . Sau khi tính toán ba tỷ lệ, nhà phân tích hầu hết có thể\nkết luận một cách thích hợp rằng Công ty A có hiệu quả tốt hơn (0,83 so với 0,50) vì\nsử dụng tài sản của mình để tạo ra doanh thu tốt hơn.\n(Lựa chọn A) Công ty B có khả năng thanh toán tốt hơn khi được đo bằng tỷ lệ Nợ trên EBITDA thấp hơn.\n(Lựa chọn C) Công ty B có khả năng sinh lời tốt hơn khi được đo bằng tỷ suất lợi nhuận ròng.\nNhững điều cần nhớ:\nTỷ lệ hoạt động đo lường mức độ hiệu quả của một công ty sử dụng tài sản của mình để tạo ra doanh thu.\nTỷ lệ thanh khoản đo lường mức độ một công ty có thể trang trải các nghĩa vụ ngắn hạn của mình bằng tài sản thanh khoản\n. Tỷ lệ khả năng thanh toán đo lường khả năng đáp ứng các nghĩa vụ dài hạn của công ty.\nTỷ lệ lợi nhuận đo lường lợi tức bán hàng và lợi tức đầu tư của công ty.\nMô tả mối quan hệ giữa các tỷ lệ và đánh giá một công ty bằng cách sử dụng phân tích tỷ lệ\nLOS","qhtml":null},{"n":83,"q":"Company A purchases a patent from Company B and acquires Company C along with its\ncustomer list. The most appropriate way for Company A to account for these purchases would\nbe to:","opts":["capitalize both the patent and the customer list.","capitalize the patent and expense the customer list.","expense the patent and capitalize the customer list."],"ans":"A","expl":"Xử lý tài sản vô hình\nPhương thức mua lại Xử lý chi phí\nĐược mua độc lập\nGiá trị hợp lý của tài sản được vốn hóa trên bảng cân đối kế toán\ncơ sở\nChi phí nghiên cứu được ghi nhận ngay trên báo cáo thu nhập\nĐược phát triển nội bộ\nChi phí phát triển được vốn hóa trên bảng cân đối kế toán nếu sản phẩm\nthông qua nghiên cứu và\nđược phát triển để sử dụng nội bộ (US GAAP) hoặc đã được chứng minh\ntính khả thi về mặt kỹ thuật phát triển (IFRS)\nGiá trị hợp lý của tài sản được vốn hóa trên bảng cân đối kế toán\nCó được thông qua một doanh nghiệp\nLợi thế thương mại bổ sung được tạo trên bảng cân đối kế toán\nsự kết hợp (ví dụ: sáp nhập)\nTài sản vô hình (ví dụ: bằng sáng chế, danh sách khách hàng) thiếu hình thức vật lý nhưng vẫn dự kiến\ncung cấp cho người nắm giữ lợi ích kinh tế trong tương lai. Những tài sản này có thể có được thông qua việc mua\nđộc lập, mua lại một công ty khác hoặc phát triển nội bộ.\nCác công ty phải hạch toán những tài sản này theo nhiều cách khác nhau, tùy thuộc vào phương thức\nmua lại. Nếu tài sản vô hình được mua thông qua một giao dịch mua độc lập\nhoặc là một phần của sự kết hợp kinh doanh lớn hơn (ví dụ: mua lại), cả IFRS\nvà US GAAP đều yêu cầu vốn hóa tài sản đó: ghi nhận giá trị hợp lý của tài sản đó trên bảng cân đối kế toán\ncủa công ty và sau đó khấu hao giá trị đó trong suốt thời gian sử dụng hữu ích của tài sản. Lưu ý\nrằng lợi thế thương mại, mặc dù được coi là tài sản vô hình, không thể xác định được và do đó\nkhông được khấu hao mà được kiểm tra định kỳ về mức độ suy giảm.\nTrong trường hợp này, một công ty có được danh sách khách hàng như một phần của việc mua lại một công ty\nkhác và cũng mua một bằng sáng chế độc lập. Theo IFRS và US GAAP, cả hai tài sản vô hình\nphải được viết hoa (Lựa chọn B và C) .\nNhững điều cần nhớ:\nMột công ty có thể có được tài sản vô hình thông qua mua bán độc lập, mua lại\ncác công ty khác hoặc phát triển nội bộ. Theo cả IFRS và US GAAP, nếu một tài sản vô hình\ncó được thông qua một giao dịch mua độc lập hoặc kết hợp kinh doanh (ví dụ: mua lại), thì tài sản đó\nđược viết hoa.\nSo sánh báo cáo tài chính của các loại tài sản vô hình sau: được mua,\nđược phát triển nội bộ và được mua trong một hợp nhất kinh doanh\nLOS","qhtml":null},{"n":84,"q":"As the size of a sample drawn from a population increases, the standard error of the\nsample most likely :","opts":["approaches zero.","produces a wider confidence interval.","approximates the standard deviation of the population."],"ans":"A","expl":"Sai số chuẩn của một thống kê mẫu là độ lệch chuẩn của thống kê đó.\nTheo định lý giới hạn trung tâm, cỡ mẫu lớn hơn hoặc bằng 30 được lấy từ một\ntổng thể sẽ được phân phối bình thường với giá trị trung bình của nó xấp xỉ bằng trung bình\ncủa tổng thể đó.\nSai số chuẩn được tính bằng cách chia độ lệch chuẩn cho căn bậc hai của\ncỡ mẫu. Mẫu số lớn hơn dẫn đến giá trị phân số nhỏ hơn, do đó khi kích thước mẫu\ntăng, sai số chuẩn sẽ tiến tới 0.\n(Lựa chọn B) Khoảng tin cậy biểu thị một phạm vi giá trị bao gồm thông số\nkhông xác định, chẳng hạn như trung bình tổng thể, với một xác suất được chỉ định. Khi kích thước mẫu\ntrở nên lớn hơn, sai số chuẩn sẽ nhỏ hơn. Tất cả các yếu tố khác đều bằng nhau, lỗi tiêu chuẩn nhỏ hơn\ntạo ra khoảng tin cậy hẹp hơn.\n(Lựa chọn C) Như được minh họa bằng công thức lỗi tiêu chuẩn, lỗi tiêu chuẩn là\nđộ lệch chuẩn của mẫu chia cho căn bậc hai của kích thước mẫu, do đó, lỗi\ntiêu chuẩn của mẫu nhỏ hơn độ lệch chuẩn của mẫu.\nNhững điều cần làm hãy nhớ:\nSai số chuẩn là độ lệch chuẩn của một thống kê mẫu, chẳng hạn như giá trị trung bình mẫu.\nSai số chuẩn có liên quan nghịch với kích thước của mẫu. Khi kích thước mẫu\ntăng, sai số chuẩn sẽ tiến tới 0.\nGiải thích định lý giới hạn trung tâm và tầm quan trọng của nó đối với phân bố và sai số chuẩn của\ntrung bình mẫu\nLOS","qhtml":null},{"n":85,"q":"A central bank's mandate to ensure the stability of the currency's purchasing power is most\nlikely supported by its role in:","opts":["implementing fiscal policy.","supplying the country's currency.","managing the country's gold reserves."],"ans":"B","expl":"Vai trò điển hình của ngân hàng trung ương\nVai trò tiền tệ Vai trò ngân hàng\nCung cấp tiền tệ\nĐóng vai trò là người cho vay cuối cùng\nQuản lý nguồn cung tiền\nĐiều tiết hệ thống thanh toán\nThực hiện chính sách tiền tệ\nLà ngân hàng của chính phủ và ngân hàng của các chủ ngân hàng\nDuy trì dự trữ ngoại hối\nGiám sát hệ thống ngân hàng\nQuản lý dự trữ vàng của đất nước\nCác ngân hàng trung ương có nhiệm vụ không chỉ cung cấp tiền tệ mà còn\nthúc đẩy sự ổn định của sức mua trong nước (tức là ổn định giá cả). Một trong những\nđặc điểm cơ bản của hệ thống tiền pháp định là tiền tệ phải có\ngiá trị tương đối ổn định theo thời gian.\nNgân hàng trung ương có thể hỗ trợ nhiệm vụ này bằng cách sử dụng vai trò là nhà cung cấp tiền tệ duy nhất\nđể quản lý nguồn cung tiền. Cùng với việc sử dụng hai công cụ chính sách tiền tệ khác—thiết lập chính sách lãi suất\nvà thực hiện các hoạt động thị trường mở—ngân hàng trung ương cố gắng duy trì\nsự ổn định về giá bằng cách kiểm soát lạm phát và/hoặc ngăn chặn những biến động lớn về giá của hàng hóa\n. Ngoài ra, với tư cách là người bảo vệ giá trị của tiền tệ pháp định, ngân hàng trung ương có vai trò\nduy trì niềm tin vào tiền tệ.\n(Lựa chọn A) Các ngân hàng trung ương thực hiện chính sách tiền tệ nhưng không thực hiện chính sách tài khóa (ví dụ: chính phủ\nchi tiêu và thuế), mà ở hầu hết các quốc gia, là chức năng của cơ quan lập pháp hoặc hành pháp\ncủa chính phủ.\n(Lựa chọn C) Vì tiền tệ không còn được hỗ trợ bởi tiêu chuẩn vàng, vốn đã bị\nbỏ rơi vào thế kỷ 20, nên việc quản lý dự trữ vàng không ảnh hưởng đến sức mua\ncủa một loại tiền tệ. Tuy nhiên, nhiều quốc gia sở hữu lượng vàng nắm giữ lớn và ở hầu hết các quốc gia đó,\nngân hàng trung ương chịu trách nhiệm giám sát trữ lượng vàng và có quyền mua\nhoặc bán vàng.\nNhững điều cần nhớ:\nNgân hàng trung ương có thể thực hiện nhiệm vụ của mình là đảm bảo sự ổn định sức mua của đồng tiền\ncủa quốc gia đó bằng cách sử dụng vai trò là nhà cung cấp vàng tiền tệ để quản lý nguồn cung tiền.\nVai trò này, cùng với các công cụ chính sách tiền tệ khác như thiết lập lãi suất chính sách và\ntiến hành các hoạt động thị trường mở, được sử dụng để thúc đẩy sự ổn định giá cả và kiểm soát lạm phát.\nMô tả vai trò và mục tiêu của các ngân hàng trung ương\nLOS","qhtml":null},{"n":86,"q":"Which of the following best describes a characteristic of the early expansion phase of the\nbusiness cycle?","opts":["Inflation accelerates, leading economic growth","Capital spending by businesses expands rapidly","Consumers accelerate spending on housing and durable goods"],"ans":"C","expl":"Các giai đoạn của chu kỳ kinh doanh là mở rộng, đạt đỉnh, thu hẹp (tức là suy thoái) và đáy.\nĐộ dài của một chu kỳ kinh doanh hoặc bất kỳ giai đoạn cụ thể nào là không thể dự đoán được. Tuy nhiên, mỗi giai đoạn\ncó liên quan đến một số đặc điểm nhất định liên quan đến tăng trưởng GDP và lạm phát.\nSự mở rộng được chia thành giai đoạn sớm (tức là giai đoạn phục hồi ban đầu) và giai đoạn muộn. Giai đoạn mở rộng sớm\nxảy ra sau khi nền kinh tế đã ở đáy, được coi là bước ngoặt trong chu kỳ\n, khi các hoạt động kinh tế bắt đầu mở rộng. Đặc điểm của giai đoạn mở rộng\nban đầu bao gồm những điều sau:\nCác doanh nghiệp bắt đầu bổ sung hàng tồn kho.\nNgười tiêu dùng bắt đầu chi tiêu nhiều hơn, đặc biệt là vào nhà ở và hàng hóa lâu bền, khi\nthu nhập ổn định.\nGDP chuyển từ âm sang dương vừa phải.\nCác ngân hàng trung ương thường giữ lãi suất ở mức thấp để hỗ trợ việc mở rộng nền kinh tế.\nMức thất nghiệp giảm nhưng vẫn ở mức cao. Việc sa thải chậm, nhưng người sử dụng lao động không muốn\nthuê nhân viên mới mà không có bằng chứng về tăng trưởng kinh tế bền vững.\n(Lựa chọn A) Lạm phát có xu hướng tụt hậu so với các biến số khác, cho thấy mức tăng trưởng chậm hoặc thậm chí giảm phát.\nLạm phát bắt kịp tốc độ tăng trưởng kinh tế trong giai đoạn mở rộng sau này.\n(Lựa chọn B) Trong giai đoạn đầu mở rộng, các doanh nghiệp chưa sẵn sàng hoặc chưa thể cam kết đầu tư lớn\nkế hoạch chi tiêu vốn (ví dụ: cơ sở sản xuất mới, mở rộng năng lực sản xuất). Đó\nlà giai đoạn cao điểm mà chi tiêu vốn kinh doanh tăng nhanh do niềm tin vào\nchu kỳ kinh doanh cao.\nNhững điều cần nhớ:\nGiai đoạn mở rộng sớm xảy ra sau khi nền kinh tế rơi vào tình trạng khó khăn, khi các hoạt động kinh tế\nbắt đầu mở rộng. Tăng trưởng GDP chuyển từ âm sang dương vừa phải.\nNgười tiêu dùng bắt đầu chi tiêu nhiều hơn, đặc biệt là vào nhà ở và hàng hóa lâu bền.\nMô tả chu kỳ kinh doanh và các giai đoạn của nó\nLOS","qhtml":null},{"n":87,"q":"On its cash flow statement, a company classified its interest paid and interest received as\noperating activities and classified its dividends paid to shareholders as a financing activity.\nThese classifications are most appropriate under which accounting standard?","opts":["Only IFRS","Only US GAAP","Either IFRS or US GAAP"],"ans":"C","expl":"Sự khác biệt giữa GAAP Hoa Kỳ và IFRS đối với các mục trong báo cáo lưu chuyển tiền tệ\nIFRS GAAP Hoa Kỳ\nLãi suất nhận được trong hoạt động hoặc đầu tư hoạt động\nTiền lãi trả Hoạt động kinh doanh hoặc tài trợ\nCổ tức nhận được Hoạt động kinh doanh hoặc đầu tư\nCổ tức trả tài chính Hoạt động kinh doanh hoặc tài trợ\nHoạt động thường xuyên, nhưng các phần cụ thể\nThuế đã trả Hoạt động\ncó thể được phân loại là tài trợ hoặc đầu tư\nGAAP Hoa Kỳ và IFRS có các quy tắc khác nhau về cách thức hoạt động một số khoản mục tài chính nhất định được phân loại trên báo cáo lưu chuyển tiền tệ của công ty\n. Nhìn chung, GAAP của Hoa Kỳ có các quy tắc nghiêm ngặt hơn và IFRS\ncho phép linh hoạt hơn. Ví dụ: IFRS cho phép lựa chọn phân loại lãi vay và\ncổ tức (đã trả hoặc đã nhận) cũng như thuế đã trả.\nTrong trường hợp này, công ty đã phân loại lãi đã trả và lãi nhận được là hoạt động kinh doanh\nvà cổ tức trả cho cổ đông là hoạt động tài chính. Những phân loại này\nđược cho phép theo cả GAAP và IFRS (Lựa chọn A và B) của Hoa Kỳ.\nNhững điều cần nhớ:\nUS GAAP và IFRS có các quy tắc khác nhau về cách báo cáo một số khoản mục tài chính nhất định trên báo cáo lưu chuyển tiền tệ của\ncủa công ty. Nhìn chung, GAAP của Hoa Kỳ có các quy tắc nghiêm ngặt hơn và IFRS\ncho phép linh hoạt hơn.\nBáo cáo lưu chuyển tiền tệ tương phản được lập theo Chuẩn mực Báo cáo Tài chính Quốc tế (IFRS)\nvà các nguyên tắc kế toán được chấp nhận chung của Hoa Kỳ (US GAAP)\nLOS","qhtml":null},{"n":88,"q":"An analyst is modeling the financial performance of a company currently operating in an\ninflationary environment. The analyst expects the company to increase its prices based on the\ncountry's consumer price index (CPI). When forecasting the company's next year's results,\nthe analyst's most appropriate assumption is that:","opts":["all costs will increase based on the CPI.","revenues will increase if demand is highly price inelastic.","the quantity sold will decrease if competitors adjust their prices faster."],"ans":"B","expl":"Các yếu tố ảnh hưởng đến dự báo doanh thu với lạm phát\nKhông co giãn: tăng giá làm tăng doanh thu\nĐộ co giãn của cầu theo giá\nCo giãn: tăng giá có thể làm giảm doanh thu\nSự kết hợp về mặt địa lý của doanh thu phải được xem xét\nTỷ lệ lạm phát ở các mức khác nhau\nSự khác biệt về tỷ lệ lạm phát thường ảnh hưởng đến tỷ giá hối đoái\ntỷ lệ các quốc gia\nLạm phát không ảnh hưởng như nhau đến tất cả các chi phí đầu vào\nViệc xác định chính xác các chi phí liên quan bị ảnh hưởng là\nNhững thay đổi về chi phí liên quan\nthiết yếu\nChuyển toàn bộ chi phí cho khách hàng sẽ bảo toàn tỷ suất lợi nhuận\nChiến lược định giá\nViệc tăng giá một phần có thể làm tăng thị phần\nĐể dự báo doanh thu và chi phí, các nhà phân tích đánh giá nhiều yếu tố bao gồm độ co giãn của giá,\nlạm phát giữa các quốc gia và chi phí liên quan. Các công ty áp dụng các chiến lược định giá khác nhau\ntùy thuộc vào mục tiêu của họ, chẳng hạn như duy trì tỷ suất lợi nhuận hoặc tăng thị phần.\nCác nhà phân tích phải xem xét tác động của chiến lược định giá khi dự báo doanh thu, đặc biệt\ntrong thời kỳ lạm phát cao hoặc bất thường.\nTrong tình huống này, nhà phân tích kỳ vọng công ty sẽ tăng giá phù hợp với\nCPI của quốc gia. Nếu nhu cầu về sản phẩm của công ty có độ co giãn theo giá cao , việc tăng\ngiá sẽ ít ảnh hưởng đến lượng cầu và có thể sẽ tăng doanh thu .\nDo đó, nhà phân tích nên dự đoán doanh thu tăng trong mô hình tài chính.\n(Lựa chọn A) Nhà phân tích không nên điều chỉnh tất cả chi phí theo CPI. Họ cần hiểu\nlạm phát ảnh hưởng đến từng yếu tố đầu vào quan trọng của công ty (ví dụ: nguyên liệu thô, tiền lương, tiện ích) và ước tính tác động cụ thể của lạm phát đối với từng chi phí liên quan.\n(Lựa chọn C) Đối thủ cạnh tranh điều chỉnh giá nhanh hơn sẽ kéo theo việc tăng\ngiá sản phẩm của họ. Trong ngắn hạn, điều này cho phép công ty đưa ra mức giá\nhấp dẫn hơn, giúp tăng doanh số bán hàng.\nNhững điều cần nhớ:\nCác nhà phân tích phải xem xét tác động của chiến lược định giá khi dự báo doanh thu, đặc biệt\ntrong thời kỳ lạm phát cao hoặc bất thường. Nếu nhu cầu về sản phẩm của công ty rất\ngiá không co giãn (hoặc co giãn), thì việc tăng giá sẽ có ảnh hưởng ít (hoặc lớn) đến doanh số\nkhối lượng bán hàng và có thể sẽ tăng (hoặc giảm) doanh thu.\nGiải thích cách dự báo doanh thu và chi phí của ngành và công ty khi chúng chịu ảnh hưởng của giá\nlạm phát hoặc giảm phát\nLOS","qhtml":null},{"n":89,"q":"An analyst estimates the probability distribution for a company's upcoming quarterly EBITDA:\nProbability EBITDA ($ billions)\n0.5 2.05\n0.2 2.20\n0.3 2.40\nThe standard deviation of the distribution (in $ billions) is closest to:","opts":["0.147","0.150","0.152"],"ans":"C","expl":"Độ lệch chuẩn của một biến ngẫu nhiên đo lường độ phân tán xung quanh giá trị mong đợi của biến\n(tức là giá trị trung bình ). Trong trường hợp này, biến ngẫu nhiên là\nEBITDA quý tiếp theo của công ty. Để giải độ lệch chuẩn, trước tiên hãy tính giá trị kỳ vọng của\nEBITDA bằng cách tìm giá trị trung bình của phân phối: trung bình theo trọng số xác suất của\nkết quả EBITDA có thể xảy ra. Sau đó, khoảng cách giữa mỗi kết quả và giá trị trung bình có thể được\ndùng để tính độ lệch chuẩn dưới dạng độ phân tán trung bình theo trọng số xác suất xung quanh\ngiá trị EBITDA dự kiến.\nEBITDA xác suất (tỷ đô la)\n0,5 2,05\n0,2 2,20\n0,3 2.40\nTừ các xác suất cho trước và kết quả EBITDA được trình bày ở trên, hãy tính độ lệch chuẩn\nnhư sau:\n(Lựa chọn A) Độ lệch chuẩn 0,147 là kết quả của việc lấy trung bình đơn giản của các số hạng\nXi-EX2 ở bước thứ hai, thay vì sử dụng trọng số xác suất\ntrung bình.\n(Lựa chọn B) Độ lệch chuẩn 0,150 là kết quả của việc sử dụng mức trung bình đơn giản, thay vì a\ntrung bình có trọng số, để tính giá trị EBITDA dự kiến.\nNhững điều cần nhớ:\nĐộ lệch chuẩn của một biến ngẫu nhiên đo lường mức độ phân tán xung quanh\ngiá trị kỳ vọng (nghĩa là trung bình) của biến đó. Để tính độ lệch chuẩn, trước tiên hãy tính giá trị trung bình, sau đó sử dụng\nkhoảng cách của nó với mỗi kết quả để giải độ lệch chuẩn dưới dạng độ phân tán trung bình\ntheo xác suất.\nTính toán các giá trị, phương sai và độ lệch chuẩn dự kiến và chứng minh ứng dụng của chúng với\ncác vấn đề đầu tư\nLOS","qhtml":null},{"n":90,"q":"If spot exchange rate quotes are 0.1427 CAD/SEK and 0.1366 CAD/NOK, the no-arbitrage\nSEK/NOK spot rate is closest to:","opts":["0.0195","0.9573","1.0447"],"ans":"B","expl":"Có thể tính tỷ giá hối đoái chéo bằng cách nhân chéo hai tỷ giá khác . Tỷ giá chéo\nthường được sử dụng để tính tỷ giá hối đoái cho một cặp tiền tệ hiếm khi được niêm yết, nhưng chúng\ncũng có thể được sử dụng để xác định liệu tỷ giá niêm yết có được định giá hợp lý hay không. Một loại tiền tệ phải\nchung cho cả hai tỷ giá chéo.\nTrong trường hợp này, tỷ giá chéo SEK/NOK được tính bằng cách nhân chéo tỷ giá hối đoái CAD/SEK và\nCAD/NOK. Vì cả hai báo giá đều có CAD trong tử số nên các bước để\ntính tỷ giá chéo như sau:\nTỷ giá chéo này được gọi là tỷ giá không chênh lệch giá vì nó được tính\ntừ tỷ giá thị trường quan sát được . Ở đây, bất kỳ tỷ giá hối đoái SEK/NOK nào khác 0,9573 sẽ\ncho phép nhà đầu tư kiếm được lợi nhuận chênh lệch giá bằng cách bán loại tiền được định giá tương đối cao và\nmua loại tiền được định giá tương đối thấp.\n(Lựa chọn A) 0,0195 là kết quả của việc không đảo ngược báo giá CAD/SEK trước khi nhân nó với\nCAD/NOK tỷ giá.\n(Lựa chọn C) 1.0447 là kết quả của việc đảo ngược báo giá CAD/NOK không chính xác thay vì tỷ giá\nCAD/SEK. Làm như vậy sẽ tạo ra tỷ giá chéo NOK/SEK thay vì tỷ giá SEK/NOK.\nNhững điều cần nhớ:\nTỷ giá chéo là kết quả của việc nhân hai tỷ giá hối đoái riêng biệt để thu được tỷ giá thứ ba. Chúng\ncó thể được sử dụng để cung cấp tỷ giá hối đoái giữa hai loại tiền tệ không được giao dịch phổ biến\nhoặc để xác định xem tỷ giá niêm yết có được định giá hợp lý hay không.\nTính toán và diễn giải tỷ giá chéo tiền tệ\nLOS","qhtml":null}];
const CFG = {"title": "UWorld Mock Exam 2 — Session 1", "subtitle": "UWorld · CFA Level I · 90 câu · 2h15p", "minutes": 135, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');

    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

  #qnotesFab:hover{filter:brightness(1.06)}

  #qnotesPanel{position:fixed;top:8vh;left:16px;width:min(470px,94vw);height:min(80vh,680px);z-index:70;

  #qnotesPanel.open{opacity:1;pointer-events:auto;transform:none}
  #qnotesPanel .qnp-head{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--line);

<button id="qnotesFab" type="button" onclick="qnotesOpen()" title="Ghi chú của tôi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h9l5 5v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M8 10h6M8 14h8M8 18h5"/></svg><span>Ghi chú</span></button>
<div id="qnotesOverlay" onclick="qnotesClose()"></div>
<div id="qnotesPanel" aria-hidden="true">
  <div class="qnp-head" id="qnotesHead"><span class="qnp-grip" aria-hidden="true">⠿</span><b>Ghi chú của tôi</b><a class="qnp-open" href="index.html?view=notes" target="_blank" rel="noopener">Mở trang ↗</a><button type="button" class="qnp-x" onclick="qnotesClose()" title="Đóng (Esc)">✕</button></div>
  <iframe id="qnotesFrame" title="Ghi chú của tôi" loading="lazy"></iframe>
</div>
<script id="qnotes-panel-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("qnotesPanel");}
  window.qnotesOpen=function(){
    var fr=document.getElementById("qnotesFrame");
    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.qnotesClose=function(){
    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>
<!--qnotes-panel-end-->

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
