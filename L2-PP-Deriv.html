<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button id="submitBtn" class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>

    <!--subject-breakdown-panel-start-->

      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n":1,"q":"A non-dividend-paying stock is currently trading at $50. A call option with an exercise price of $55 has one month until maturity. Using a single-period binomial option valuation model, if the up factor (u) is equal to 1.25 and the down factor (d) is equal to 0.70, the optimal hedge ratio is closest to:","opts":["–0.73.","0.27.","0.73."],"ans":"B","expl":"B is Correct because: S+ = uS = 1.25(50) = 62.5 S– = dS = 0.70(50) = 35 where u is an up factor, d is a down factor, S+ denotes the outcome when the underlying goes up, S– denotes the outcome when the underlying goes down. c+ = Max(0,uS – X) = Max(0,62.5 – 55) = 7.5 c– = Max(0,dS – X) = Max(0,35 – 55) = 0 where c+ is the call price when underlying goes up, c– is the call price when underlying is down. The hedge ratio is: h = (7.5 − 0)/(62.5 − 35) = 7.5/27.5 = 0.27","explhtml":"<p>B is Correct because: S+ = uS = 1.25(50) = 62.5 S– = dS = 0.70(50) = 35 where u is an up factor, d is a down factor, S+ denotes the outcome when the underlying goes up, S– denotes the outcome when the underlying goes down. c+ = Max(0,uS – X) = Max(0,62.5 – 55) = 7.5 c– = Max(0,dS – X) = Max(0,35 – 55) = 0 where c+ is the call price when underlying goes up, c– is the call price when underlying is down. The hedge ratio is: h = (7.5 − 0)/(62.5 − 35) = 7.5/27.5 = 0.27<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>A non-dividend-paying stock is currently trading at $50. A call option with an exercise price of $55 has one month until maturity. Using a single-period binomial option valuation model, if the up factor (u) is equal to 1.25 and the down factor (d) is equal to 0.70, the optimal hedge ratio is closest to:<\/p><\/div>","subj":"derivatives"},{"n":2,"q":"A trader engages in a strategy that replicates the payoff of a long position in a put option within a single-period binomial framework. At time step 0, the cash flow is:","opts":["negative.","zero.","positive."],"ans":"C","expl":"C is Correct because the trading strategy that will generate the payoff of taking a long position in a put option is to short sell -h=-(p+-p-)/(S+-S-) units of the underlying and financing of -PV(-hS-+p-). Because p+ is less than p-, the hedge ratio is negative. With h negative, the trade is a short sale, and because -h is positive, the value -hS results in a positive cash flow at Time Step 0.","explhtml":"<p>C is Correct because the trading strategy that will generate the payoff of taking a long position in a put option is to short sell -h=-(p+-p-)/(S+-S-) units of the underlying and financing of -PV(-hS-+p-). Because p+ is less than p-, the hedge ratio is negative. With h negative, the trade is a short sale, and because -h is positive, the value -hS results in a positive cash flow at Time Step 0.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>A trader engages in a strategy that replicates the payoff of a long position in a put option within a single-period binomial framework. At time step 0, the cash flow is:<\/p><\/div>","subj":"derivatives"},{"n":3,"q":"Which of the following models is appropriate to value American options?","opts":["The binomial option valuation model only","The Black–Scholes–Merton (BSM) option valuation model only","Both the binomial option valuation model and the BSM option valuation model"],"ans":"A","expl":"A is Correct because binomial option valuation model is path-dependent (it provides a stream of valuations for a derivative for at each time node in a span of time), which can be used to value American options, that can be exercised prior to expiration. The path-dependency feature distinguishes this model from the Black-Scholes-Merton option valuation model (BSM model). The BSM model values only path-independent options, such as European options, which depend on only the values of their respective underlyings at expiration.","explhtml":"<p>A is Correct because binomial option valuation model is path-dependent (it provides a stream of valuations for a derivative for at each time node in a span of time), which can be used to value American options, that can be exercised prior to expiration. The path-dependency feature distinguishes this model from the Black-Scholes-Merton option valuation model (BSM model). The BSM model values only path-independent options, such as European options, which depend on only the values of their respective underlyings at expiration.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>Which of the following models is appropriate to value American options?<\/p><\/div>","subj":"derivatives"},{"n":4,"q":"An analyst gathers the following information about a put option on a non-dividend-paying stock: The early exercise premium of the American-style put option at Time 0 is closest to:","opts":["0.54.","0.59.","0.67."],"ans":"A","expl":"A is correct because the American-style put option value at Time 0 is calculated as p = PV [πp+ + (1 – π)p–] = (1/1.0205) × [(0.4498 × 0) + ((1 – 0.4498) × 15.88)] ≈ 8.5617. The European-style put option at Time 0 is calculated as p = PV [πp+ + (1 – π)p–] = (1/1.0205) × [(0.4498 × 0) + ((1 – 0.4498) × 14.88)] ≈ 8.0225 Therefore the early exercise premium of the American-style put option at Time 0 is 8.5617 – 8.0225 ≈ 0.54. PV = present value factor = 1 / (1 + r) = 1 / 1.0205 π = probability of up move = [ FV(1) – d ] / (u – d) = (1.0205 – 0.6562) / (1.4662 – 0.6562) ≈ 0.4498 For the American-style calculation: p+ = put exercise value at Time 1 with up move = Max [0, Strike – Underlying stock price at Time 1 with up move] = Max [0, 50.00 – 76.24] = 0 p– = put exercise value at Time 1 with down move = Max [0, Strike – Underlying stock price at Time 1 with down move] = Max [0, 50.00 – 34.12] = 15.88 For the European-style calculation: p+ = put value at Time 1 with up move (given) = 0 p– = put value at Time 1 with down move (given) = 14.88 where: u = up factor (total return) = S+ / S = 76.24 / 52.00 ≈ 1.4662 d = down factor (total return) = S- / S = 34.12 / 52.00 ≈ 0.6562 where: FV(1) = future value at Time 1 = 1 / PV(1) = 1 + r = 1.0205 S+ = value of underlying at Time 1 when an up move occurs = 76.24 S- = value of underlying at Time 1 when a down move occurs = 34.12 S = value of underlying at Time 0 = 52.00","explhtml":"<p>A is correct because the American-style put option value at Time 0 is calculated as p = PV [πp+ + (1 – π)p–] = (1/1.0205) × [(0.4498 × 0) + ((1 – 0.4498) × 15.88)] ≈ 8.5617. The European-style put option at Time 0 is calculated as p = PV [πp+ + (1 – π)p–] = (1/1.0205) × [(0.4498 × 0) + ((1 – 0.4498) × 14.88)] ≈ 8.0225 Therefore the early exercise premium of the American-style put option at Time 0 is 8.5617 – 8.0225 ≈ 0.54. PV = present value factor = 1 / (1 + r) = 1 / 1.0205 π = probability of up move = [ FV(1) – d ] / (u – d) = (1.0205 – 0.6562) / (1.4662 – 0.6562) ≈ 0.4498 For the American-style calculation: p+ = put exercise value at Time 1 with up move = Max [0, Strike – Underlying stock price at Time 1 with up move] = Max [0, 50.00 – 76.24] = 0 p– = put exercise value at Time 1 with down move = Max [0, Strike – Underlying stock price at Time 1 with down move] = Max [0, 50.00 – 34.12] = 15.88 For the European-style calculation: p+ = put value at Time 1 with up move (given) = 0 p– = put value at Time 1 with down move (given) = 14.88 where: u = up factor (total return) = S+ / S = 76.24 / 52.00 ≈ 1.4662 d = down factor (total return) = S- / S = 34.12 / 52.00 ≈ 0.6562 where: FV(1) = future value at Time 1 = 1 / PV(1) = 1 + r = 1.0205 S+ = value of underlying at Time 1 when an up move occurs = 76.24 S- = value of underlying at Time 1 when a down move occurs = 34.12 S = value of underlying at Time 0 = 52.00<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a put option on a non-dividend-paying stock:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp048.webp\" style=\"max-width:min(100%,576px)\" alt=\"\"><p>The early exercise premium of the American-style put option at Time 0 is closest to:<\/p><\/div>","subj":"derivatives"},{"n":5,"q":"An analyst gathers the following information about a call option on a non-dividend-paying stock: The current value of the European-style call option is closest to:","opts":["6.50.","8.90.","9.35."],"ans":"B","expl":"B is Correct because the European-style call option value at Time 0 is the two-period binomial option value, i.e. the present value of the expected terminal option payoffs, expressed as c = PV[π2c++ + 2π(1 – π)c+– + (1 – π)2c– –] = (1/1.05)2 × [0.502 × 39.2565) + (2 × 0.5 × (1 – 0.5) × 0 + (1 – 0.5)2 × 0] ≈ 8.90. where: PV = two-period present value factor = (1 / (1 + r))2 = (1 / 1.05)2 π = probability of up move = [ FV(1) – d ] / (u – d) = (1.05 – 0.727) / (1.373 – 0.727) = 0.5 c++ = Max (0, u2S – X) = Max [0, 1.3732 × 50 – 55] = 39.2565 c+- = c-+ = Max (0, udS – X) =Max [0, 1.373 × 0.727 × 50 – 55]=Max [0, –5.09] =0 c-- = Max (0, d2S – X) = Max [0, 0.7272 × 50 – 55] = Max [0, –28.57] = 0","explhtml":"<p>B is Correct because the European-style call option value at Time 0 is the two-period binomial option value, i.e. the present value of the expected terminal option payoffs, expressed as c = PV[π2c++ + 2π(1 – π)c+– + (1 – π)2c– –] = (1/1.05)2 × [0.502 × 39.2565) + (2 × 0.5 × (1 – 0.5) × 0 + (1 – 0.5)2 × 0] ≈ 8.90. where: PV = two-period present value factor = (1 / (1 + r))2 = (1 / 1.05)2 π = probability of up move = [ FV(1) – d ] / (u – d) = (1.05 – 0.727) / (1.373 – 0.727) = 0.5 c++ = Max (0, u2S – X) = Max [0, 1.3732 × 50 – 55] = 39.2565 c+- = c-+ = Max (0, udS – X) =Max [0, 1.373 × 0.727 × 50 – 55]=Max [0, –5.09] =0 c-- = Max (0, d2S – X) = Max [0, 0.7272 × 50 – 55] = Max [0, –28.57] = 0<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a call option on a non-dividend-paying stock:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp049.webp\" style=\"max-width:min(100%,556px)\" alt=\"\"><p>The current value of the European-style call option is closest to:<\/p><\/div>","subj":"derivatives"},{"n":6,"q":"Using the two-period binomial model, an analyst estimates the value of an American-style put option on a stock that pays no dividend. The current stock price is €65, and the put option exercise price is €63. The up factor (u) is 1.20, and the down factor (d) is 0.85. The risk-free rate of return is 5% per period. The binomial tree analysis for an European-style put option is shown in the exhibit below. At Time Step 0, the value of the American-style put option is closest to:","opts":["2.67.","3.16.","4.22."],"ans":"B","expl":"B is Correct because using the expectations approach, the risk-neutral probability of an up move is: π = [FV(1) – d]/(u – d) = (1.05 – 0.85)/(1.20 – 0.85) = 0.5714 The exercise value at Time 1 with a down move is: Max(0,63-55.25)=7.75. Thus, we replace this value in the binomial tree and compute the put option value at Time 0. The resulting put option value at Time 0 is thus: p = PV [πp+ + (1 – π)p–] =[1/(1+0.05)] [0.5714*0+(1-0.5714)*7.75] =3.1632","explhtml":"<p>B is Correct because using the expectations approach, the risk-neutral probability of an up move is: π = [FV(1) – d]/(u – d) = (1.05 – 0.85)/(1.20 – 0.85) = 0.5714 The exercise value at Time 1 with a down move is: Max(0,63-55.25)=7.75. Thus, we replace this value in the binomial tree and compute the put option value at Time 0. The resulting put option value at Time 0 is thus: p = PV [πp+ + (1 – π)p–] =[1/(1+0.05)] [0.5714*0+(1-0.5714)*7.75] =3.1632<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>Using the two-period binomial model, an analyst estimates the value of an American-style put option on a stock that pays no dividend. The current stock price is €65, and the put option exercise price is €63. The up factor (u) is 1.20, and the down factor (d) is 0.85. The risk-free rate of return is 5% per period. The binomial tree analysis for an European-style put option is shown in the exhibit below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp050.webp\" style=\"max-width:min(100%,716px)\" alt=\"\"><p>At Time Step 0, the value of the American-style put option is closest to:<\/p><\/div>","subj":"derivatives"},{"n":7,"q":"An analyst gathers the following information about a European-style call option on a non-dividend-paying stock: To exploit the arbitrage opportunity, at Time 0 an arbitrageur should:","opts":["sell the call option, buy stock and lend cash.","sell the call option, buy stock and borrow cash.","buy the call option, sell stock and borrow cash."],"ans":"B","expl":"B is Correct because the value of the European-style call option at Time 0, 13.50, is greater than c, the call option price at Time 0 as implied by the present value of the Time 1 call option values and π, the probability of an up move. The fair value for the European-style call option at Time 0 is c = PV [πc+ + (1 – π)c–] = (1/1.03) × [(0.6 × 21.52 + ((1 – 0.6) × 0)] ≈ 12.53. Thus by selling the call option at Time 0, the arbitrageur expects a profit of 13.50 – 12.53 = 0.97. An arbitrageur can sell the call for 13.50 and simultaneously purchase h × S amount of stock, where h is the hedge ratio at Time 0 and S is the underlying stock price at Time 0, calculated as h × S = (c+ – c-) / (S+ – S-) × S = (21.52 – 0) / (67.80 – 27.05) × 50 ≈ 0.528 × 50 = 26.40. Since the proceeds from the sale of the call option are less than the hedge amount required, the arbitrageur must borrow the difference. Assuming no arbitrage, the call seller must borrow PV(hS- + c-) = (1/1.03) × (0.528 × 27.05 + 0) = 13.87. The difference, 26.40 – 13.87 = 12.53, is the implied fair value of the call price. For the above calculation: PV = one-period present value = (1 / (1 + r)) = (1 / 1.03) FV(1) = future value at Time 1 = 1 / PV(1) = 1 + r = 1.03 π = probability of up move = [ FV(1) – d ] / (u – d) = (1.03 – 0.541) / (1.356 – 0.541) ≈ 0.6 c+ = call option value at Time 1 when an up move occurs (given) = 21.52 c- = call option value at Time 1 when a down move occurs (given) = 0.00","explhtml":"<p>B is Correct because the value of the European-style call option at Time 0, 13.50, is greater than c, the call option price at Time 0 as implied by the present value of the Time 1 call option values and π, the probability of an up move. The fair value for the European-style call option at Time 0 is c = PV [πc+ + (1 – π)c–] = (1/1.03) × [(0.6 × 21.52 + ((1 – 0.6) × 0)] ≈ 12.53. Thus by selling the call option at Time 0, the arbitrageur expects a profit of 13.50 – 12.53 = 0.97. An arbitrageur can sell the call for 13.50 and simultaneously purchase h × S amount of stock, where h is the hedge ratio at Time 0 and S is the underlying stock price at Time 0, calculated as h × S = (c+ – c-) / (S+ – S-) × S = (21.52 – 0) / (67.80 – 27.05) × 50 ≈ 0.528 × 50 = 26.40. Since the proceeds from the sale of the call option are less than the hedge amount required, the arbitrageur must borrow the difference. Assuming no arbitrage, the call seller must borrow PV(hS- + c-) = (1/1.03) × (0.528 × 27.05 + 0) = 13.87. The difference, 26.40 – 13.87 = 12.53, is the implied fair value of the call price. For the above calculation: PV = one-period present value = (1 / (1 + r)) = (1 / 1.03) FV(1) = future value at Time 1 = 1 / PV(1) = 1 + r = 1.03 π = probability of up move = [ FV(1) – d ] / (u – d) = (1.03 – 0.541) / (1.356 – 0.541) ≈ 0.6 c+ = call option value at Time 1 when an up move occurs (given) = 21.52 c- = call option value at Time 1 when a down move occurs (given) = 0.00<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a European-style call option on a non-dividend-paying stock:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp051.webp\" style=\"max-width:min(100%,595px)\" alt=\"\"><p>To exploit the arbitrage opportunity, at Time 0 an arbitrageur should:<\/p><\/div>","subj":"derivatives"},{"n":8,"q":"Within the no-arbitrage single-period binomial framework, which of the following trading strategies replicates the payoff of a short call option?","opts":["Going long the underlying and borrow cash","Going long the underlying and investing proceeds","Going short the underlying and investing proceeds"],"ans":"C","expl":"C is Correct because the no-arbitrage approach is a replicating strategy: A call option is synthetically replicated with the underlying and financing. For writing a call option, the writer will be selling stock short and investing proceeds (i.e. lending). If the value of the net portfolio at Time Step 0 is not zero, the strategy of short selling the underling and lending, will push the call price up and the underlying price down until the net cash flow at Time 0 is zero.","explhtml":"<p>C is Correct because the no-arbitrage approach is a replicating strategy: A call option is synthetically replicated with the underlying and financing. For writing a call option, the writer will be selling stock short and investing proceeds (i.e. lending). If the value of the net portfolio at Time Step 0 is not zero, the strategy of short selling the underling and lending, will push the call price up and the underlying price down until the net cash flow at Time 0 is zero.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>Within the no-arbitrage single-period binomial framework, which of the following trading strategies replicates the payoff of a short call option?<\/p><\/div>","subj":"derivatives"},{"n":9,"q":"An analyst gathers the following information about a 2-year European-style call option on the periodically compounded 1-year spot interest rate: If the option is cash settled at Time 2 based on the observed rate, the option value as a percentage of the notional amount at Time 0 is closest to:","opts":["0.15%.","0.24%.","0.87%."],"ans":"B","expl":"B is Correct because the option value, c, at Time 0 is given by c = PVrf,0,1[πc+ + (1 – π)c–] = (1/1.030454) × [(0.5 × 0.4209%) + (1 – 0.5) × 0.0751%] ≈ 0.24% where: PVrf,0,1 = present value factor (from Time 1 to Time 0) = 1 / (1+r) = 1 / (1.030454) π = risk-neutral probability of an up move (given) = 0.5 c+ = call option value at Time 1 when an up move occurs (given) = 0.4209% c- = call option value at Time 1 when a down move occurs (given) = 0.0751%","explhtml":"<p>B is Correct because the option value, c, at Time 0 is given by c = PVrf,0,1[πc+ + (1 – π)c–] = (1/1.030454) × [(0.5 × 0.4209%) + (1 – 0.5) × 0.0751%] ≈ 0.24% where: PVrf,0,1 = present value factor (from Time 1 to Time 0) = 1 / (1+r) = 1 / (1.030454) π = risk-neutral probability of an up move (given) = 0.5 c+ = call option value at Time 1 when an up move occurs (given) = 0.4209% c- = call option value at Time 1 when a down move occurs (given) = 0.0751%<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a 2-year European-style call option on the periodically compounded 1-year spot interest rate:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp052.webp\" style=\"max-width:min(100%,627px)\" alt=\"\"><p>If the option is cash settled at Time 2 based on the observed rate, the option value as a percentage of the notional amount at Time 0 is closest to:<\/p><\/div>","subj":"derivatives"},{"n":10,"q":"An analyst values a 2-year European-style put option where the underlying is the periodically compounded 1-year spot interest rate. The notional amount of the option is $1 million, and the put exercise rate is 3.5% of par. The risk-neutral probability is 5.0% and these options cash settle at time step 2 based on the observed rates as shown in the exhibit below. At time step 0, the value of the interest rate put option is closest to:","opts":["$4,623.","$4,713.","$4,878."],"ans":"B","expl":"B is Correct because using the expectations approach, per $1 of notional value, the values of the put options at time step 2 are: p++ = Max(0,X-S++) = Max(0,0.0.035-0.055) = 0 p+– = Max(0,X-S+– ) = Max(0,0.035 – 0.035) = 0 p– – = Max(0,X-S– –) = Max(0,0.035 – 0.0015) = 0.0200 At time step 1, the put values are: p+ = PV[πp++ + (1 – π)p+–] . p+ = 0.956938[0.50(0) + (1 – 0.50)(0)] =0 p– = PV[πp+– + (1 – π)p– –]. p– = 0.97561[0.50(0) + (1 – 0.50)(0.02)] = 0.009756 At time step 0, the put option value is: p = PV[πp+ + (1 – π)p–]. p = 0.966184[0.50(0) + (1 – 0.50)(0.009756)] = 0.004713 The value of the put option is: 0.004713 X 1,000,000 = 4,713","explhtml":"<p>B is Correct because using the expectations approach, per $1 of notional value, the values of the put options at time step 2 are: p++ = Max(0,X-S++) = Max(0,0.0.035-0.055) = 0 p+– = Max(0,X-S+– ) = Max(0,0.035 – 0.035) = 0 p– – = Max(0,X-S– –) = Max(0,0.035 – 0.0015) = 0.0200 At time step 1, the put values are: p+ = PV[πp++ + (1 – π)p+–] . p+ = 0.956938[0.50(0) + (1 – 0.50)(0)] =0 p– = PV[πp+– + (1 – π)p– –]. p– = 0.97561[0.50(0) + (1 – 0.50)(0.02)] = 0.009756 At time step 0, the put option value is:<\/p><p>p = PV[πp+ + (1 – π)p–]. p = 0.966184[0.50(0) + (1 – 0.50)(0.009756)] = 0.004713 The value of the put option is: 0.004713 X 1,000,000 = 4,713<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>An analyst values a 2-year European-style put option where the underlying is the periodically compounded 1-year spot interest rate. The notional amount of the option is $1 million, and the put exercise rate is 3.5% of par. The risk-neutral probability is 5.0% and these options cash settle at time step 2 based on the observed rates as shown in the exhibit below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp053.webp\" style=\"max-width:min(100%,721px)\" alt=\"\"><p>At time step 0, the value of the interest rate put option is closest to:<\/p><\/div>","subj":"derivatives"},{"n":11,"q":"An analyst is valuing a 2-year, European-style call option on a 1-year spot rate. The notional value of the option is $1 million, and the exercise rate is 3.5%. The risk-neutral probability of an up move is 0.50. The current and expected 1-year interest rates are shown in the exhibit below, along with the values of a 1-year zero-coupon bond of $1 notional value for each interest rate. At time step 0, the value of the interest rate option is closest to:","opts":["$8,035.","$8,356.","$9,615."],"ans":"A","expl":"A is Correct because using the expectations approach, per $1 of notional value, the values of the call option at Time Step 2 are: c++ = Max(0,S++ – X) = Max(0,0.060 – 0.035) = 0.025 c+– = Max(0,S+– – X) = Max(0,0.040 – 0.035) = 0.005 c– – = Max(0,S– – – X) = Max(0,0.020 – 0.035) = 0 At Time Step 1, the call values are: c+ = PV[πc++ + (1 – π)c+–] . c+ = 0.952381[0.50(0.025) + (1 – 0.50)(0.005)] =0.01429 c– = PV[πc+– + (1 – π)c– –]. c– = 0.970874[0.50(0.005) + (1 – 0.50)(0)] = 0.002427 At Time Step 0, the call option value is: c = PV[πc+ + (1 – π)c–]. c = 0.961538[0.50(0.01429) + (1 – 0.50)(0.002427)] = 0.008035 The value of the call option is: 0.008035 x 1,000,000 = 8,035","explhtml":"<p>A is Correct because using the expectations approach, per $1 of notional value, the values of the call option at Time Step 2 are: c++ = Max(0,S++ – X) = Max(0,0.060 – 0.035) = 0.025 c+– = Max(0,S+– – X) = Max(0,0.040 – 0.035) = 0.005 c– – = Max(0,S– – – X) = Max(0,0.020 – 0.035) = 0 At Time Step 1, the call values are: c+ = PV[πc++ + (1 – π)c+–] . c+ = 0.952381[0.50(0.025) + (1 – 0.50)(0.005)] =0.01429 c– = PV[πc+– + (1 – π)c– –]. c– = 0.970874[0.50(0.005) + (1 – 0.50)(0)] = 0.002427 At Time Step 0, the call option value is: c = PV[πc+ + (1 – π)c–]. c = 0.961538[0.50(0.01429) + (1 – 0.50)(0.002427)] = 0.008035 The value of the call option is: 0.008035 x 1,000,000 = 8,035<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>An analyst is valuing a 2-year, European-style call option on a 1-year spot rate. The notional value of the option is $1 million, and the exercise rate is 3.5%. The risk-neutral probability of an up move is 0.50. The current and expected 1-year interest rates are shown in the exhibit below, along with the values of a 1-year zero-coupon bond of $1 notional value for each interest rate.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp054.webp\" style=\"max-width:min(100%,721px)\" alt=\"\"><p>At time step 0, the value of the interest rate option is closest to:<\/p><\/div>","subj":"derivatives"},{"n":12,"q":"An analyst gathers the following information about a non-dividend-paying stock: Using a single-period binomial option valuation model and a strike price of $50.00, the value of a 1-year call option on the stock is closest to:","opts":["$5.95.","$6.25.","$6.56."],"ans":"A","expl":"A is Correct because this is the call value for a strike of $50, calculated using the expectations approach. The risk-neutral probability of an up move is π = [FV(1) – d]/(u – d) = (1.05 – 0.85)/(1.25 – 0.85) = 0.50, where FV(1) = (1 + r) = 1.05. Thus the call value by the expectations approach is c = PV[πc+ + (1 – π)c–] = (1/1.05) [(0.5)12.5 + (1–0.5)0] = 5.9525 ≈ 5.95, where: c+ = Max(0, uS - X) = Max(0, 50 × 1.25 – 50) = Max(0, 12.5) = 12.5 c- = Max(0, dS - X) = Max(0, 50 × 0.85 – 50) = Max(0, –7.5) = 0","explhtml":"<p>A is Correct because this is the call value for a strike of $50, calculated using the expectations approach. The risk-neutral probability of an up move is π = [FV(1) – d]/(u – d) = (1.05 – 0.85)/(1.25 – 0.85) = 0.50, where FV(1) = (1 + r) = 1.05. Thus the call value by the expectations approach is c = PV[πc+ + (1 – π)c–] = (1/1.05) [(0.5)12.5 + (1–0.5)0] = 5.9525 ≈ 5.95, where: c+ = Max(0, uS - X) = Max(0, 50 × 1.25 – 50) = Max(0, 12.5) = 12.5 c- = Max(0, dS - X) = Max(0, 50 × 0.85 – 50) = Max(0, –7.5) = 0<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a non-dividend-paying stock:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp055.webp\" style=\"max-width:min(100%,560px)\" alt=\"\"><p>Using a single-period binomial option valuation model and a strike price of $50.00, the value of a 1-year call option on the stock is closest to:<\/p><\/div>","subj":"derivatives"},{"n":13,"q":"The expectations approach to option valuation:","opts":["employs a risk-adjusted discount rate.","uses a risk-neutral probability of a move in the underlying.","is based on the investor’s beliefs regarding the future course of the underlying."],"ans":"B","expl":"B is Correct because the probability of an up move is π and the expectations approach to option valuation differs in two significant ways from the discounted cash flow approach to securities valuation. The probability, π, is objectively determined and not based on the investor’s personal view. This probability has taken several different names, including risk-neutral (RN) probability.","explhtml":"<p>B is Correct because the probability of an up move is π and the expectations approach to option valuation differs in two significant ways from the discounted cash flow approach to securities valuation. The probability, π, is objectively determined and not based on the investor’s personal view. This probability has taken several different names, including risk-neutral (RN) probability.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>The expectations approach to option valuation:<\/p><\/div>","subj":"derivatives"},{"n":14,"q":"The expectations approach values an option as:","opts":["the present value of the expected payoff at expiration.","the expected current payoff from exercising the option before expiration.","dependent on the investors' expectation for the price of the underlying at expiration."],"ans":"A","expl":"A is Correct because using the expectations approach, the option values are simply the present value of the expected terminal option payoffs.","explhtml":"<p>A is Correct because using the expectations approach, the option values are simply the present value of the expected terminal option payoffs.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>The expectations approach values an option as:<\/p><\/div>","subj":"derivatives"},{"n":15,"q":"The Black–Scholes–Merton option valuation model assumes that:","opts":["continuous trading is available.","early exercise of the option is allowed.","the volatility of the underlying is unknown."],"ans":"A","expl":"A is Correct because one of the specific assumptions of the BSM option valuation model is that continuous trading is available, meaning that in the strictest sense one must be able to trade at every instant. Also, Geometric Brownian motion, which is the stochastic process chosen by Black, Scholes, and Merton, implies continuous prices, meaning that the price of underlying instrument does not jump from one value to another; rather, it moves smoothly from value to value.","explhtml":"<p>A is Correct because one of the specific assumptions of the BSM option valuation model is that continuous trading is available, meaning that in the strictest sense one must be able to trade at every instant. Also, Geometric Brownian motion, which is the stochastic process chosen by Black, Scholes, and Merton, implies continuous prices, meaning that the price of underlying instrument does not jump from one value to another; rather, it moves smoothly from value to value.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>The Black–Scholes–Merton option valuation model assumes that:<\/p><\/div>","subj":"derivatives"},{"n":16,"q":"Under the Black–Scholes–Merton option valuation model, short selling of the underlying instrument is:","opts":["not permitted.","permitted with full use of proceeds.","permitted with restricted use of proceeds."],"ans":"B","expl":"B is Correct because one of the specific assumptions of the BSM model is that short selling of the underlying instrument with full use of the proceeds is permitted.","explhtml":"<p>B is Correct because one of the specific assumptions of the BSM model is that short selling of the underlying instrument with full use of the proceeds is permitted.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>Under the Black–Scholes–Merton option valuation model, short selling of the underlying instrument is:<\/p><\/div>","subj":"derivatives"},{"n":17,"q":"Which of the following is an assumption of the Black– Scholes–Merton option valuation model?","opts":["The underlying must pay a dividend","Asset prices are normally distributed","Borrowing and lending is allowed at the risk-free rate"],"ans":"C","expl":"C is Correct because a specific assumption of the BSM model is that the continuously compounded risk-free interest rate is known and constant; borrowing and lending is allowed at the risk-free rate.","explhtml":"<p>C is Correct because a specific assumption of the BSM model is that the continuously compounded risk-free interest rate is known and constant; borrowing and lending is allowed at the risk-free rate.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>Which of the following is an assumption of the Black– Scholes–Merton option valuation model?<\/p><\/div>","subj":"derivatives"},{"n":18,"q":"An analyst gathers the following Black–Scholes– Merton option valuation model outputs for a call option on a non-dividend-paying stock: To replicate the call option payoffs for a buyer, the initial trading strategy required by the no-arbitrage approach is to:","opts":["buy 0.230 shares of stock and short sell 0.053 shares of zero-coupon bonds.","buy 0.591 shares of stock and short sell 0.521 shares of zero-coupon bonds.","short sell 0.409 shares of stock and buy 0.479 shares of zero-coupon bonds."],"ans":"B","expl":"B is Correct because the no-arbitrage approach to replicate the call option involves purchasing N(d1) = 0.591 shares of stock partially financed with –N(d2) = –0.521 shares of zero-coupon bonds. Replicating strategy cost = nSS + nBB where the equivalent number of underlying shares is nS = N(d1) > 0 for calls and nS = –N(–d1) < 0 for puts. The equivalent number of bonds is nB = –N(d2) < 0 for calls and nB = N(– d2) > 0 for puts. Note, if n is positive, we are buying the underlying and if n is negative we are selling (short selling) the underlying.","explhtml":"<p>B is Correct because the no-arbitrage approach to replicate the call option involves purchasing N(d1) = 0.591 shares of stock partially financed with –N(d2) = –0.521 shares of zero-coupon bonds. Replicating strategy cost = nSS + nBB where the equivalent number of underlying shares is nS = N(d1) &gt; 0 for calls and nS = –N(–d1) &lt; 0 for puts. The equivalent number of bonds is nB = –N(d2) &lt; 0 for calls and nB = N(– d2) &gt; 0 for puts. Note, if n is positive, we are buying the underlying and if n is negative we are selling (short selling) the underlying.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>An analyst gathers the following Black–Scholes– Merton option valuation model outputs for a call option on a non-dividend-paying stock:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp056.webp\" style=\"max-width:min(100%,560px)\" alt=\"\"><p>To replicate the call option payoffs for a buyer, the initial trading strategy required by the no-arbitrage approach is to:<\/p><\/div>","subj":"derivatives"},{"n":19,"q":"An analyst gathers the following Black–Scholes– Merton option valuation model outputs for a call option on a non-dividend-paying stock: The probability that the call option expires in the money is:","opts":["40.6%.","48.8%.","59.4%."],"ans":"C","expl":"C is Correct because the N(d2) term (being 59.4%) has an additional important interpretation. It is a unique measure of the probability that the call option expires in the money, and correspondingly, 1 – N(d2) = N(−d2) is the probability that the put option expires in the money. Specifically, the probability based on the RN probability of being in the money, not one’s own estimate of the probability of being in the money nor the market’s estimate. That is, N(d2) = Prob(ST > X) based on the unique RN probability.","explhtml":"<p>C is Correct because the N(d2) term (being 59.4%) has an additional important interpretation. It is a unique measure of the probability that the call option expires in the money, and correspondingly, 1 – N(d2) = N(−d2) is the probability that the put option expires in the money. Specifically, the probability based on the RN probability of being in the money, not one’s own estimate of the probability of being in the money nor the market’s estimate. That is, N(d2) = Prob(ST &gt; X) based on the unique RN probability.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>An analyst gathers the following Black–Scholes– Merton option valuation model outputs for a call option on a non-dividend-paying stock:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp057.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>The probability that the call option expires in the money is:<\/p><\/div>","subj":"derivatives"},{"n":20,"q":"The value of an equity call option using the Black– Scholes–Merton model is equal to the value of the:","opts":["stock component plus the value of the bond component.","stock component minus the value of the bond component.","bond component minus the value of the stock component."],"ans":"B","expl":"B is Correct because the BSM model can be described as having two components: a stock component and a bond component. And, for call options, the stock component is SN(d1) and the bond component is e–rTXN(d2). The BSM model call value is the stock component minus the bond component.","explhtml":"<p>B is Correct because the BSM model can be described as having two components: a stock component and a bond component. And, for call options, the stock component is SN(d1) and the bond component is e–rTXN(d2). The BSM model call value is the stock component minus the bond component.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>The value of an equity call option using the Black– Scholes–Merton model is equal to the value of the:<\/p><\/div>","subj":"derivatives"},{"n":21,"q":"An arbitrageur dynamically manages a portfolio of options on a single stock. Using the Black–Scholes–Merton model, when the dividend yield on the stock increases, the arbitrageur should:","opts":["lower the number of stocks to buy for calls and lower the number of stocks to short sell for puts.","lower the number of stocks to buy for calls and raise the number of stocks to short sell for puts.","lower the number of stocks to short sell for puts and raise the number of stocks to buy for calls."],"ans":"B","expl":"B is Correct because with dividend paying stocks, the arbitrageur is able to receive the benefits of dividend payments when long the stock and has to pay dividends when short the stock. Thus, the burden of carrying the stock is diminished for a long position. The key insight is that dividends influence the dynamically managed portfolio by lowering the number of shares to buy for calls and raising the number of shares to short sell for puts.","explhtml":"<p>B is Correct because with dividend paying stocks, the arbitrageur is able to receive the benefits of dividend payments when long the stock and has to pay dividends when short the stock. Thus, the burden of carrying the stock is diminished for a long position. The key insight is that dividends influence the dynamically managed portfolio by lowering the number of shares to buy for calls and raising the number of shares to short sell for puts.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>An arbitrageur dynamically manages a portfolio of options on a single stock. Using the Black–Scholes–Merton model, when the dividend yield on the stock increases, the arbitrageur should:<\/p><\/div>","subj":"derivatives"},{"n":22,"q":"A French manufacturer receives fixed USD amounts for products exported to the United States. The company is concerned that the USD will depreciate versus the EUR over the next year and considers buying a put option on the USD. The risk-free rate is 4.9% in the United States and 3.3% in Europe, and the current exchange rate is 1.09 USD/EUR (1.09 USD per 1 EUR). The appropriate carry rate and underlying price to use in the Black–Scholes–Merton model to value the USD put option are closest to:","opts":["3.3% and 0.92.","4.9% and 0.92.","4.9% and 1.09."],"ans":"B","expl":"B is Correct because the company is domiciled in France and therefore the EUR is the home currency. Since, when quoting an exchange rate, we will give the value of the domestic currency per unit of the foreign currency, called the foreign exchange spot rate. With currency options, the underlying instrument is the foreign exchange spot rate. The exchange rate should be quoted as EUR/USD: 1/1.09 = 0.9174 ≈ 0.92. Also, the carry benefit is the interest rate in the foreign country because the foreign currency could be invested in the foreign country’s risk-free instrument. The carry benefit is therefore the US risk-free rate of 4.9%.","explhtml":"<p>B is Correct because the company is domiciled in France and therefore the EUR is the home currency. Since, when quoting an exchange rate, we will give the value of the domestic currency per unit of the foreign currency, called the foreign exchange spot rate. With currency options, the underlying instrument is the foreign exchange spot rate. The exchange rate should be quoted as EUR/USD: 1/1.09 = 0.9174 ≈ 0.92. Also, the carry benefit is the interest rate in the foreign country because the foreign currency could be invested in the foreign country’s risk-free instrument. The carry benefit is therefore the US risk-free rate of 4.9%.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>A French manufacturer receives fixed USD amounts for products exported to the United States. The company is concerned that the USD will depreciate versus the EUR over the next year and considers buying a put option on the USD. The risk-free rate is 4.9% in the United States and 3.3% in Europe, and the current exchange rate is 1.09 USD/EUR (1.09 USD per 1 EUR). The appropriate carry rate and underlying price to use in the Black–Scholes–Merton model to value the USD put option are closest to:<\/p><\/div>","subj":"derivatives"},{"n":23,"q":"In the Black model for valuing European put options on futures, the put price is the:","opts":["futures component plus the bond component.","futures component minus the bond component.","bond component minus the futures component."],"ans":"C","expl":"C isCorrect because the Black model has two components, a futures component and a bond component. For put options, the futures component is F0(T)e–rTN(–d1) and the bond component is again e–rTXN(–d2). The Black put model is simply the bond component minus the futures component.","explhtml":"<p>C isCorrect because the Black model has two components, a futures component and a bond component. For put options, the futures component is F0(T)e–rTN(–d1) and the bond component is again e–rTXN(–d2). The Black put model is simply the bond component minus the futures component.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>In the Black model for valuing European put options on futures, the put price is the:<\/p><\/div>","subj":"derivatives"},{"n":24,"q":"An analyst gathers the following information about a futures contract expiring in six months: The exercise price is $100 and the futures contract is priced at $101.25. Using the Black model, the value of a European call on the futures contract is the present value of:","opts":["the difference between ($100×0.45) and ($101.25×0.41).","the difference between ($101.25×0.41) and ($100×0.45).","the difference between ($101.25×0.45) and ($100×0.41)."],"ans":"C","expl":"C is Correct because the Black model for calls values the call as: c = e–rT[F0(T)N(d1) – XN(d2)]. Alternatively, futures option valuation, based on the Black model, is simply computing the present value of the difference between the futures price and the exercise price. The futures price and exercise price are appropriately adjusted by the N(d) functions. For call options, the futures price is adjusted by N(d1) and the exercise price is adjusted by –N(d2) to arrive at difference.","explhtml":"<p>C is Correct because the Black model for calls values the call as: c = e–rT[F0(T)N(d1) – XN(d2)]. Alternatively, futures option valuation, based on the Black model, is simply computing the present value of the difference between the futures price and the exercise price. The futures price and exercise price are appropriately adjusted by the N(d) functions. For call options, the futures price is adjusted by N(d1) and the exercise price is adjusted by –N(d2) to arrive at difference.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a futures contract expiring in six months:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp058.webp\" style=\"max-width:min(100%,550px)\" alt=\"\"><p>The exercise price is $100 and the futures contract is priced at $101.25. Using the Black model, the value of a European call on the futures contract is the present value of:<\/p><\/div>","subj":"derivatives"},{"n":25,"q":"An investor wishes to replicate the value of a long European put on a futures contract using a bond component and a futures component. According to the Black model, which of the following combinations will replicate the put value?","opts":["The futures component plus the bond component","The bond component minus the futures component","The futures component minus the bond component"],"ans":"B","expl":"B is Correct because the Black model can be described in a similar way to the BSM model. The Black model has two components, a futures component and a bond component. The Black put model is simply the bond component minus the futures component.","explhtml":"<p>B is Correct because the Black model can be described in a similar way to the BSM model. The Black model has two components, a futures component and a bond component. The Black put model is simply the bond component minus the futures component.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>An investor wishes to replicate the value of a long European put on a futures contract using a bond component and a futures component. According to the Black model, which of the following combinations will replicate the put value?<\/p><\/div>","subj":"derivatives"},{"n":26,"q":"An interest rate call option on a 3-month MRR has one year to expiration. The underlying interest rate is a forward rate agreement (FRA) rate used in the Black model to value the interest rate option. The underlying rate of the FRA is a 3-month MRR deposit that is:","opts":["investable in 3 months and matures in 12 months.","investable in 9 months and matures in 12 months.","investable in 12 months and matures in 15 months."],"ans":"C","expl":"C is Correct because for an interest rate call option on three-month MRR with one year to expiration, the underlying interest rate is a forward rate agreement (FRA) rate that expires in one year. This FRA is observed today and is the underlying rate used in the Black model. The underlying rate of the FRA is a 3-month MRR deposit that is investable in 12 months and matures in 15 months. Thus, in one year, the FRA rate typically converges to the three-month spot MRR.","explhtml":"<p>C is Correct because for an interest rate call option on three-month MRR with one year to expiration, the underlying interest rate is a forward rate agreement (FRA) rate that expires in one year. This FRA is observed today and is the underlying rate used in the Black model. The underlying rate of the FRA is a 3-month MRR deposit that is investable in 12 months and matures in 15 months. Thus, in one year, the FRA rate typically converges to the three-month spot MRR.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>An interest rate call option on a 3-month MRR has one year to expiration. The underlying interest rate is a forward rate agreement (FRA) rate used in the Black model to value the interest rate option. The underlying rate of the FRA is a 3-month MRR deposit that is:<\/p><\/div>","subj":"derivatives"},{"n":27,"q":"Compared to the Black model to value European interest rate options, the standard market model assumes that the:","opts":["underlying is a futures price.","discount factor applies to the option expiration.","actual option premium needs to be adjusted for the accrual period."],"ans":"C","expl":"C is Correct because the standard market model requires an adjustment when compared with the Black model for the accrual period. In other words, a value such as FRA(0,tj–1,tm) or the strike rate, Rx, is stated on an annual basis, as are interest rates in general. The actual option premium would have to be adjusted for the accrual period.","explhtml":"<p>C is Correct because the standard market model requires an adjustment when compared with the Black model for the accrual period. In other words, a value such as FRA(0,tj–1,tm) or the strike rate, Rx, is stated on an annual basis, as are interest rates in general. The actual option premium would have to be adjusted for the accrual period.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>Compared to the Black model to value European interest rate options, the standard market model assumes that the:<\/p><\/div>","subj":"derivatives"},{"n":28,"q":"Who would most likely benefit if interest rates increase? An investor that is:","opts":["long a payer swaption.","short a payer swaption.","long a receiver swaption."],"ans":"A","expl":"A is Correct because a payer swaption is an option on a swap to pay fixed, receive floating. Therefore, a payer swaption buyer hopes the fixed rate goes up before the swaption expires. When exercised, the payer swaption buyer is able to enter into a pay-fixed, receive-floating swap at the predetermined exercise rate. The buyer can then immediately enter an offsetting at-market receive-fixed, pay-floating swap at the current fixed swap rate. The floating legs of both swaps will offset, leaving the payer swaption buyer with an annuity of the difference between the current fixed swap rate and the swaption exercise rate.","explhtml":"<p>A is Correct because a payer swaption is an option on a swap to pay fixed, receive floating. Therefore, a payer swaption buyer hopes the fixed rate goes up before the swaption expires. When exercised, the payer swaption buyer is able to enter into a pay-fixed, receive-floating swap at the predetermined exercise rate. The buyer can then immediately enter an offsetting at-market receive-fixed, pay-floating swap at the current fixed swap rate. The floating legs of both swaps will offset, leaving the payer swaption buyer with an annuity of the difference between the current fixed swap rate and the swaption exercise rate.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>Who would most likely benefit if interest rates increase? An investor that is:<\/p><\/div>","subj":"derivatives"},{"n":29,"q":"A trader has a long position in two options on the same underlying: The vega of Option 1 is:","opts":["less than Option 2.","equal to Option 2.","greater than Option 2."],"ans":"B","expl":"B is Correct because vega is defined as the change in a given portfolio for a given small change in volatility, holding everything else constant. Vega measures the sensitivity of a given portfolio to volatility. The vega of an option is positive. An increase in volatility results in an increase in the option value for both calls and puts. The vega of a call equals the vega of a similar put (i.e. with the same strike) based on put–call parity or c – p = S0 – e–rTX. Note that neither S0 nor e–rTX is a direct function of volatility. Therefore, the vega of a call must offset the vega of a put so that the vega of the right-hand side is zero.","explhtml":"<p>B is Correct because vega is defined as the change in a given portfolio for a given small change in volatility, holding everything else constant. Vega measures the sensitivity of a given portfolio to volatility. The vega of an option is positive. An increase in volatility results in an increase in the option value for both calls and puts. The vega of a call equals the vega of a similar put (i.e. with the same strike) based on put–call parity or c – p = S0 – e–rTX. Note that neither S0 nor e–rTX is a direct function of volatility. Therefore, the vega of a call must offset the vega of a put so that the vega of the right-hand side is zero.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>A trader has a long position in two options on the same underlying:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp059.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>The vega of Option 1 is:<\/p><\/div>","subj":"derivatives"},{"n":30,"q":"A trader gathers the following information on three long call option positions for a stock where the futures contract currently trades at $58.00: The option with the highest gamma is:","opts":["Option 1.","Option 2.","Option 3."],"ans":"B","expl":"B is Correct because Gamma is defined as the change in a given instrument’s delta for a given small change in the stock’s value, holding everything else constant. And, gamma takes on its largest value near at the money. Options deltas do not change much for small changes in the stock price if the option is either deep in or deep out of the money. Of the three options, Option 2 is the closest to being at the the money.","explhtml":"<p>B is Correct because Gamma is defined as the change in a given instrument’s delta for a given small change in the stock’s value, holding everything else constant. And, gamma takes on its largest value near at the money. Options deltas do not change much for small changes in the stock price if the option is either deep in or deep out of the money. Of the three options, Option 2 is the closest to being at the the money.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>A trader gathers the following information on three long call option positions for a stock where the futures contract currently trades at $58.00:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp060.webp\" style=\"max-width:min(100%,556px)\" alt=\"\"><p>The option with the highest gamma is:<\/p><\/div>","subj":"derivatives"},{"n":31,"q":"A decrease in the value of the risk-free interest rate will:","opts":["decrease the value of a long put.","increase the value of a long put.","increase the value of long call."],"ans":"B","expl":"B is Correct because rho is defined as the change in a given portfolio for a given small change in the risk-free interest rate, holding everything else constant. Thus, rho measures the sensitivity of the portfolio to the risk-free interest rate. And the rho of a put is negative. Intuitively, the option to sell the stock delays the opportunity to earn interest on the proceeds from the sale. For example, purchasing a put option rather than selling the stock deprives an investor of the potential interest that would have been earned from the proceeds of selling the stock. The higher the interest rate, the lower the put value. Interest rates (rho) are inversely related to the value of a put. A decrease in rho will increase the value of a long put.","explhtml":"<p>B is Correct because rho is defined as the change in a given portfolio for a given small change in the risk-free interest rate, holding everything else constant. Thus, rho measures the sensitivity of the portfolio to the risk-free interest rate. And the rho of a put is negative. Intuitively, the option to sell the stock delays the opportunity to earn interest on the proceeds from the sale. For example, purchasing a put option rather than selling the stock deprives an investor of the potential interest that would have been earned from the proceeds of selling the stock. The higher the interest rate, the lower the put value. Interest rates (rho) are inversely related to the value of a put. A decrease in rho will increase the value of a long put.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>A decrease in the value of the risk-free interest rate will:<\/p><\/div>","subj":"derivatives"},{"n":32,"q":"A trader sells a put option on 10,000 shares of a stock. The option call delta is 0.612 and the option put delta is –0.363. Assuming the hedging instrument is stock, the appropriate delta hedge is executed by which of the following transactions?","opts":["Buy 3,630 shares of stock","Short sell 3,630 shares of stock","Short sell 6,120 shares of stock"],"ans":"B","expl":"B is Correct
