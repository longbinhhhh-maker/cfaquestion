 because the put delta is given as –0.363, thus the short put delta is 0.363, and the number of number of hedging units is NH = – Portfolio delta / DeltaH = – (3,630 / 1) = –3,630 or short sell 3,630 shares of stock, where Portfolio delta = 10,000 (0.363) = 3,630 and DeltaH = 1.0. Delta hedging an option is the process of establishing a position in the underlying stock of a quantity that is prescribed by the option delta so as to have no exposure to very small moves up or down in the stock price. Let NH denote the number of units of the hedging instrument and DeltaH denote the delta of the hedging instrument, which could be the underlying stock. Delta neutral implies the portfolio delta plus NHDeltaH is equal to zero. The optimal number of hedging units, NH, is NH = − Portfolio delta / DeltaH. Note that if NH is negative, then one must short the hedging instrument, and if NH is positive, then one must go long the hedging instrument.","explhtml":"<p>B is Correct because the put delta is given as –0.363, thus the short put delta is 0.363, and the number of number of hedging units is NH = – Portfolio delta / DeltaH = – (3,630 / 1) = –3,630 or short sell 3,630 shares of stock, where Portfolio delta = 10,000 (0.363) = 3,630 and DeltaH = 1.0. Delta hedging an option is the process of establishing a position in the underlying stock of a quantity that is prescribed by the option delta so as to have no exposure to very small moves up or down in the stock price. Let NH denote the number of units of the hedging instrument and DeltaH denote the delta of the hedging instrument, which could be the underlying stock. Delta neutral implies the portfolio delta plus NHDeltaH is equal to zero. The optimal number of hedging units, NH, is NH = − Portfolio delta / DeltaH. Note that if NH is negative, then one must short the hedging instrument, and if NH is positive, then one must go long the hedging instrument.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>A trader sells a put option on 10,000 shares of a stock. The option call delta is 0.612 and the option put delta is –0.363. Assuming the hedging instrument is stock, the appropriate delta hedge is executed by which of the following transactions?<\/p><\/div>","subj":"derivatives"},{"n":33,"q":"For a call option, which of the following best describes the estimation error of a delta hedge? As the change in the underlying stock value increases, the delta approximation is biased:","opts":["low for a down move and low for an up move.","low for a down move and high for an up move.","high for a down move and low for an up move."],"ans":"A","expl":"A is Correct because for very small changes in the stock, the delta approximation is fairly accurate. As the change in the stock increases, the estimation error also increases. The delta approximation is biased low for both a down move and an up move.","explhtml":"<p>A is Correct because for very small changes in the stock, the delta approximation is fairly accurate. As the change in the stock increases, the estimation error also increases. The delta approximation is biased low for both a down move and an up move.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>For a call option, which of the following best describes the estimation error of a delta hedge? As the change in the underlying stock value increases, the delta approximation is biased:<\/p><\/div>","subj":"derivatives"},{"n":34,"q":"An investor is short put options on 100,000 shares of stock and the put delta is –0.455. To delta hedge the option position using shares, the investor should:","opts":["sell short 54,500 shares.","sell short 45,500 shares.","purchase 45,500 shares."],"ans":"B","expl":"B is Correct because if NH is negative, then one must short the hedging instrument to delta hedge. The number of shares the investor must sell short is: NH = (–Portfolio delta/DeltaH). Since put delta is –0.455 the short put delta is 0.455 and therefore Portfolio delta = 100,000(0.455) = 45,500. DeltaH, the delta of the hedging instrument shares of stock equals 1. Therefore NH = –45,500/1 = –45,500. The investor must sell short 45,500 shares to delta hedge the option position.","explhtml":"<p>B is Correct because if NH is negative, then one must short the hedging instrument to delta hedge. The number of shares the investor must sell short is: NH = (–Portfolio delta/DeltaH). Since put delta is –0.455 the short put delta is 0.455 and therefore Portfolio delta = 100,000(0.455) = 45,500. DeltaH, the delta of the hedging instrument shares of stock equals 1. Therefore NH = –45,500/1 = –45,500. The investor must sell short 45,500 shares to delta hedge the option position.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>An investor is short put options on 100,000 shares of stock and the put delta is –0.455. To delta hedge the option position using shares, the investor should:<\/p><\/div>","subj":"derivatives"},{"n":35,"q":"A trader examines three call option contracts on the same underlying with the same size and maturity: If the at-the-money forward strike is 100, which option has the largest gamma?","opts":["Option 1","Option 2","Option 3"],"ans":"A","expl":"A is Correct because gamma is defined as the change in a given instrument’s delta for a given small change in the stock’s value, holding everything else constant. Gamma takes on its largest value near at the money. Options deltas do not change much for small changes in the stock price if the option is either deep in or deep out of the money. Also, as the stock price changes and as time to expiration changes, the gamma is also changing. Of the three options, Option 1 is closest to the current price and thus closest being at-the-money.","explhtml":"<p>A is Correct because gamma is defined as the change in a given instrument’s delta for a given small change in the stock’s value, holding everything else constant. Gamma takes on its largest value near at the money. Options deltas do not change much for small changes in the stock price if the option is either deep in or deep out of the money. Also, as the stock price changes and as time to expiration changes, the gamma is also changing. Of the three options, Option 1 is closest to the current price and thus closest being at-the-money.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>A trader examines three call option contracts on the same underlying with the same size and maturity:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp061.webp\" style=\"max-width:min(100%,564px)\" alt=\"\"><p>If the at-the-money forward strike is 100, which option has the largest gamma?<\/p><\/div>","subj":"derivatives"},{"n":36,"q":"An analyst gathers the following information about three portfolios with the same underlying: Which portfolio will have the lowest gamma risk?","opts":["Portfolio 1","Portfolio 2","Portfolio 3"],"ans":"A","expl":"A is Correct because gamma is defined as the change in a given instrument’s delta for a given small change in the stock’s value, holding everything else constant. Since delta is the change in an option price for a corresponding change in the price of the underlying, a long stock position has no gamma. The Delta of a long stock position is 1 and the delta of short stock position is –1. Both puts and calls have gamma so buying either will increase gamma.","explhtml":"<p>A is Correct because gamma is defined as the change in a given instrument’s delta for a given small change in the stock’s value, holding everything else constant. Since delta is the change in an option price for a corresponding change in the price of the underlying, a long stock position has no gamma. The Delta of a long stock position is 1 and the delta of short stock position is –1. Both puts and calls have gamma so buying either will increase gamma.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>An analyst gathers the following information about three portfolios with the same underlying:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp062.webp\" style=\"max-width:min(100%,560px)\" alt=\"\"><p>Which portfolio will have the lowest gamma risk?<\/p><\/div>","subj":"derivatives"},{"n":37,"q":"An investor is short 200 shares of stock. To hedge this position, the investor purchases two call option contracts on the shares at a price significantly below the short sale price. The combined portfolio is:","opts":["gamma negative.","gamma neutral.","gamma positive."],"ans":"C","expl":"C is Correct because gamma is always non-negative. A stock position has a delta of 1 for a long position and –1 for a short position, The stock thus has a gamma of 0 and adding any type of option adds gamma, making the portfolio gamma positive.","explhtml":"<p>C is Correct because gamma is always non-negative. A stock position has a delta of 1 for a long position and –1 for a short position, The stock thus has a gamma of 0 and adding any type of option adds gamma, making the portfolio gamma positive.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>An investor is short 200 shares of stock. To hedge this position, the investor purchases two call option contracts on the shares at a price significantly below the short sale price. The combined portfolio is:<\/p><\/div>","subj":"derivatives"},{"n":38,"q":"An options trader gathers the following data for 1- year call options on three stocks: Based only on this information, which of the following actions is most appropriate for the trader?","opts":["Buy calls on Stock 2","Buy calls on Stock 1 and sell calls on Stock 3","Sell calls on Stock 1 and buy calls on Stock 3"],"ans":"C","expl":"C is Correct because options will be perceived to be under(over) priced if expected volatility is (above)below implied volatility. If expected volatility equals implied volatility, the option will be considered fairly priced. Since the expected volatility of call options for Company 1 is below the implied volatility, the investor would expect the call option to fall in value over time and should sell the option. Conversely, the higher expected volatility for calls of Company 3 suggests the calls should be bought. Much like yield to maturity with bonds, volatility can be inferred from option prices. This inferred volatility is called the implied volatility. Implied volatility varies across time to expiration as well as across exercise prices. The implied volatility with respect to time to expiration is known as the term structure of volatility, whereas the implied volatility with respect to the exercise price is known as the volatility smile or sometimes skew depending on the particular shape Implied volatility is also not constant through calendar time. As implied volatility increases, market participants are communicating an increased market price of risk. Whereas implied volatility can be interpreted as the market’s view of the underlying's future volatility, expected volatility is the view of a particular investor.","explhtml":"<p>C is Correct because options will be perceived to be under(over) priced if expected volatility is (above)below implied volatility. If expected volatility equals implied volatility, the option will be considered fairly priced. Since the expected volatility of call options for Company 1 is below the implied volatility, the investor would expect the call option to fall in value over time and should sell the option. Conversely, the higher expected volatility for calls of Company 3 suggests the calls should be bought. Much like yield to maturity with bonds, volatility can be inferred from option prices. This inferred volatility is called the implied volatility. Implied volatility varies across time to expiration as well as across exercise prices. The implied volatility with respect to time to expiration is known as the term structure of volatility, whereas the implied volatility with respect to the exercise price is known as the volatility smile or sometimes skew depending on the particular shape Implied volatility is also not constant through calendar time. As implied volatility increases, market participants are communicating an increased market price of risk. Whereas implied volatility can be interpreted as the market’s view of the underlying&#x27;s future volatility, expected volatility is the view of a particular investor.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>An options trader gathers the following data for 1- year call options on three stocks:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp063.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>Based only on this information, which of the following actions is most appropriate for the trader?<\/p><\/div>","subj":"derivatives"},{"n":39,"q":"Market participants use the term volatility smile to describe the implied volatility of a stock option with respect to the:","opts":["dividend yield.","exercise price.","time to expiration."],"ans":"B","expl":"B is Correct because the implied volatility with respect to time to expiration is known as the term structure of volatility, whereas the implied volatility with respect to the exercise price is known as the volatility smile or sometimes skew depending on the particular shape.","explhtml":"<p>B is Correct because the implied volatility with respect to time to expiration is known as the term structure of volatility, whereas the implied volatility with respect to the exercise price is known as the volatility smile or sometimes skew depending on the particular shape.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>Market participants use the term volatility smile to describe the implied volatility of a stock option with respect to the:<\/p><\/div>","subj":"derivatives"},{"n":40,"q":"Which of the following statements about implied volatility is least accurate? In practice, the implied volatility of options:","opts":["is constant across exercise price and time to expiration.","may be used to revalue existing option positions over time.","makes it easier to understand the current market price of various risk exposures."],"ans":"A","expl":"A is Correct because this statement is false. In practice, it is very common to observe different implied volatilities for different exercise prices and observe different implied volatilities for calls and puts with the same terms. Implied volatility also varies across time to expiration as well as across exercise prices. Furthermore, implied volatility is also not constant through calendar time.","explhtml":"<p>A is Correct because this statement is false. In practice, it is very common to observe different implied volatilities for different exercise prices and observe different implied volatilities for calls and puts with the same terms. Implied volatility also varies across time to expiration as well as across exercise prices. Furthermore, implied volatility is also not constant through calendar time.<\/p>","qhtml":"<div class=\"pp-topic\">Valuation of Contingent Claims<\/div><div class=\"qtext\"><p>Which of the following statements about implied volatility is least accurate? In practice, the implied volatility of options:<\/p><\/div>","subj":"derivatives"},{"n":41,"q":"A trader buys an asset using funds borrowed at the risk-free interest rate, and simultaneously sells it forward. The no- arbitrage value of the position at the forward expiration date should be:","opts":["negative.","zero.","positive."],"ans":"B","expl":"B is Correct because to prevent arbitrage, the overall portfolio (Asset + Borrowed funds + Short forward) should have a value of zero at time T. If the cost to finance the purchase of the asset, FV(S0), is equal to the initially agreed upon forward price, F0, then there is no arbitrage profit. So, we should have F0 = FV(S0).","explhtml":"<p>B is Correct because to prevent arbitrage, the overall portfolio (Asset + Borrowed funds + Short forward) should have a value of zero at time T. If the cost to finance the purchase of the asset, FV(S0), is equal to the initially agreed upon forward price, F0, then there is no arbitrage profit. So, we should have F0 = FV(S0).<\/p>","qhtml":"<div class=\"pp-topic\">Pricing and Valuation of Forward Commitments<\/div><div class=\"qtext\"><p>A trader buys an asset using funds borrowed at the risk-free interest rate, and simultaneously sells it forward. The no- arbitrage value of the position at the forward expiration date should be:<\/p><\/div>","subj":"derivatives"},{"n":42,"q":"According to future-spot parity, the future value of an underlying asset with carry cash flows is equal to the future value of the spot price:","opts":["minus carry costs and plus carry benefits.","plus carry costs and plus carry benefits.","plus carry costs and minus carry benefits."],"ans":"C","expl":"C is Correct because the key forward pricing equation can be expressed as: F0 = Future value of the underlying adjusted for carry cash flows = FV[S0 + CC0 – CB0]. The equation relates the forward price of an asset to the spot price by considering the cost of carry. It is sometimes referred to as the cost of carry model or future- spot parity. Carry costs (CC) and a positive rate of interest increase the burden of carrying the underlying instrument through time; hence, these costs are added in the forward pricing equation. Conversely, carry benefits (CB) decrease the burden of carrying the underlying instrument through time; hence, these benefits are subtracted in the forward pricing equation.","explhtml":"<p>C is Correct because the key forward pricing equation can be expressed as: F0 = Future value of the underlying adjusted for carry cash flows = FV[S0 + CC0 – CB0]. The equation relates the forward price of an asset to the spot price by considering the cost of carry. It is sometimes referred to as the cost of carry model or future- spot parity. Carry costs (CC) and a positive rate of interest increase the burden of carrying the underlying instrument through time; hence, these costs are added in the forward pricing equation. Conversely, carry benefits (CB) decrease the burden of carrying the underlying instrument through time; hence, these benefits are subtracted in the forward pricing equation.<\/p>","qhtml":"<div class=\"pp-topic\">Pricing and Valuation of Forward Commitments<\/div><div class=\"qtext\"><p>According to future-spot parity, the future value of an underlying asset with carry cash flows is equal to the future value of the spot price:<\/p><\/div>","subj":"derivatives"},{"n":43,"q":"A stock paying a $300 dividend in six months is trading at $10,000. Assume the interest rate is 2% with annual compounding. Based on the current stock price and the no-arbitrage approach, the equilibrium 1-year forward price is closest to:","opts":["$9,897.","$10,049.","$10,503."],"ans":"A","expl":"A is Correct because the equilibrium one-year forward price is F0 = FV(S0) – FV(D) = $10,000(1 + 0.02) – $300(1 + 0.02)0.5 = $10,200 – $302.99 = $9,897. The asset holder receives the benefit of earning interest on the cash flow for six months.","explhtml":"<p>A is Correct because the equilibrium one-year forward price is F0 = FV(S0) – FV(D) = $10,000(1 + 0.02) – $300(1 + 0.02)0.5 = $10,200 – $302.99 = $9,897. The asset holder receives the benefit of earning interest on the cash flow for six months.<\/p>","qhtml":"<div class=\"pp-topic\">Pricing and Valuation of Forward Commitments<\/div><div class=\"qtext\"><p>A stock paying a $300 dividend in six months is trading at $10,000. Assume the interest rate is 2% with annual compounding. Based on the current stock price and the no-arbitrage approach, the equilibrium 1-year forward price is closest to:<\/p><\/div>","subj":"derivatives"},{"n":44,"q":"An investor buys a 1-year futures contract on the DAX index. Later, with six months to expiration, the futures price has risen considerably. Immediately after the daily margin settlement has occurred, the value of the existing contract is:","opts":["negative.","zero.","positive."],"ans":"B","expl":"B is Correct because futures contracts are marked to market daily, which implies that the market value, resulting in profits and losses, is received or paid at each daily settlement. Hence, the equity futures value is zero each day after settlement has occurred.","explhtml":"<p>B is Correct because futures contracts are marked to market daily, which implies that the market value, resulting in profits and losses, is received or paid at each daily settlement. Hence, the equity futures value is zero each day after settlement has occurred.<\/p>","qhtml":"<div class=\"pp-topic\">Pricing and Valuation of Forward Commitments<\/div><div class=\"qtext\"><p>An investor buys a 1-year futures contract on the DAX index. Later, with six months to expiration, the futures price has risen considerably. Immediately after the daily margin settlement has occurred, the value of the existing contract is:<\/p><\/div>","subj":"derivatives"},{"n":45,"q":"An analyst gathers the following current market information: Based on the carry arbitrage model, the 6-month futures price of the FTSE-100 Index will be closest to:","opts":["7,717.","7,733.","7,740."],"ans":"B","expl":"B is Correct because we assume the carry costs (CC) are 0 for a financial asset, such as a stock index. The carry benefit (CB), in this case a 3.75% continuous dividend yield, is smaller than the financing cost rc (3.95%), so the futures price will be above the spot price. The futures price, the future value of the underlying adjusted for carry (i.e., the dividend payments, over the next six months) is: f0 = S0 exp (rc+CC−CB) T f0 = 7,725 exp(0.0395 + 0 – 0.0375)(6/12) = 7,732.73 ≈ 7,733.","explhtml":"<p>B is Correct because we assume the carry costs (CC) are 0 for a financial asset, such as a stock index. The carry benefit (CB), in this case a 3.75% continuous dividend yield, is smaller than the financing cost rc (3.95%), so the futures price will be above the spot price. The futures price, the future value of the underlying adjusted for carry (i.e., the dividend payments, over the next six months) is: f0 = S0 exp (rc+CC−CB) T f0 = 7,725 exp(0.0395 + 0 – 0.0375)(6/12) = 7,732.73 ≈ 7,733.<\/p>","qhtml":"<div class=\"pp-topic\">Pricing and Valuation of Forward Commitments<\/div><div class=\"qtext\"><p>An analyst gathers the following current market information:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp064.webp\" style=\"max-width:min(100%,556px)\" alt=\"\"><p>Based on the carry arbitrage model, the 6-month futures price of the FTSE-100 Index will be closest to:<\/p><\/div>","subj":"derivatives"},{"n":46,"q":"An investor buys a 1-year futures contract at 104 that expires in six months. The underlying is currently trading at 107, and the annually compounded risk-free rate is 3%. Assuming no other carry cash flows, the forward value of the existing contract is closest to:","opts":["–4.53.","2.96.","4.53."],"ans":"C","expl":"C is Correct because we have F0 = 104, S0.5 = 107, r = 3%, and T – t = 0.5. Note that the new forward price at time t is simply Ft = FV(St) = 107(1 + 0.03)0.5 = 108.5931. Therefore: Vt = PV[Ft – F0] = (108.5931 – 104)/(1 + 0.03)0.5 = 4.5931/1.014889 = 4.5257 ≈ 4.53. Note that the current forward value is greater than the difference between the current underlying price of 107 and the initial forward price of 104 due to interest costs.","explhtml":"<p>C is Correct because we have F0 = 104, S0.5 = 107, r = 3%, and T – t = 0.5. Note that the new forward price at time t is simply Ft = FV(St) = 107(1 + 0.03)0.5 = 108.5931. Therefore: Vt = PV[Ft – F0] = (108.5931 – 104)/(1 + 0.03)0.5 = 4.5931/1.014889 = 4.5257 ≈ 4.53. Note that the current forward value is greater than the difference between the current underlying price of 107 and the initial forward price of 104 due to interest costs.<\/p>","qhtml":"<div class=\"pp-topic\">Pricing and Valuation of Forward Commitments<\/div><div class=\"qtext\"><p>An investor buys a 1-year futures contract at 104 that expires in six months. The underlying is currently trading at 107, and the annually compounded risk-free rate is 3%. Assuming no other carry cash flows, the forward value of the existing contract is closest to:<\/p><\/div>","subj":"derivatives"},{"n":47,"q":"An analyst gathers the following information in order to price a forward rate agreement (FRA): Using a 30/360 day count, the 3 × 6 FRA fixed rate is closest to:","opts":["1.49%.","1.75%.","2.49%."],"ans":"C","expl":"C is Correct because the fixed FRA rate (FRA0) is FRA0 = {[1 + LTtT]/[1 + Lhth] – 1}/tm FRA0 = {[1 + 0.02 (180/360)]/[1 + 0.015(90/360)] – 1}/(90/360) = [(1.01/1.00375) – 1]/(0.25) = 0.0062/0.25 = 0.0249 = 2.49%.","explhtml":"<p>C is Correct because the fixed FRA rate (FRA0) is FRA0 = {[1 + LTtT]/[1 + Lhth] – 1}/tm FRA0 = {[1 + 0.02 (180/360)]/[1 + 0.015(90/360)] – 1}/(90/360) = [(1.01/1.00375) – 1]/(0.25) = 0.0062/0.25 = 0.0249 = 2.49%.<\/p>","qhtml":"<div class=\"pp-topic\">Pricing and Valuation of Forward Commitments<\/div><div class=\"qtext\"><p>An analyst gathers the following information in order to price a forward rate agreement (FRA):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp065.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>Using a 30/360 day count, the 3 × 6 FRA fixed rate is closest to:<\/p><\/div>","subj":"derivatives"},{"n":48,"q":"A trader enters into a 3 × 12 forward rate agreement (FRA). The price of the FRA at initiation (FRA0) is the forward rate for a period of:","opts":["270 days beginning at the contract initiation.","270 days beginning at the contract expiration.","360 days beginning at the contract expiration."],"ans":"B","expl":"B is Correct because the FRA price is the implied forward rate for the period beginning when the FRA expires at time h and running m days to the underlying loan maturity at time T. It is similar to any other forward contract. We wish to identify the appropriate FRA0 rate that makes the value of the FRA equal to zero on the initiation date. The FRA expires at time h (90 days) and is based on the rate for a deposit for the number of days m (270 days) until the maturity of the underlying deposit.","explhtml":"<p>B is Correct because the FRA price is the implied forward rate for the period beginning when the FRA expires at time h and running m days to the underlying loan maturity at time T. It is similar to any other forward contract. We wish to identify the appropriate FRA0 rate that makes the value of the FRA equal to zero on the initiation date. The FRA expires at time h (90 days) and is based on the rate for a deposit for the number of days m (270 days) until the maturity of the underlying deposit.<\/p>","qhtml":"<div class=\"pp-topic\">Pricing and Valuation of Forward Commitments<\/div><div class=\"qtext\"><p>A trader enters into a 3 × 12 forward rate agreement (FRA). The price of the FRA at initiation (FRA0) is the forward rate for a period of:<\/p><\/div>","subj":"derivatives"},{"n":49,"q":"If the 180-day spot MRR is 2.00% and the 360-day spot MRR is 2.50%, the no-arbitrage price of a new 6 × 12 forward rate agreement (30/360 day count) is:","opts":["less than 3.00%.","equal to 3.00%.","greater than 3.00%."],"ans":"A","expl":"A is Correct because, for this FRA, 180 is half of 360. Thus, we can use a simple arithmetic average equation—here, (1/2) × 2.00% + (1/2) × X = 2.50%—and solve for the missing variable X: X = 3.00%. Knowing this approximation will always be biased slightly high, we know we are looking for an answer that is a little less than 3.00%. We derive the forward rate (or FRA rate, FRA0) from two spot rates (such as MRR): the longer rate LT and the shorter rate Lh. FRA0 = {[1 + LTtT]/[1 + Lhth] – 1}/tm FRA0 = {[1 + 2.50%]/[1 + 2.00% × (180/360)] – 1}/(180/360) ≈ 2.97%","explhtml":"<p>A is Correct because, for this FRA, 180 is half of 360. Thus, we can use a simple arithmetic average equation—here, (1/2) × 2.00% + (1/2) × X = 2.50%—and solve for the missing variable X: X = 3.00%. Knowing this approximation will always be biased slightly high, we know we are looking for an answer that is a little less than 3.00%. We derive the forward rate (or FRA rate, FRA0) from two spot rates (such as MRR): the longer rate LT and the shorter rate Lh. FRA0 = {[1 + LTtT]/[1 + Lhth] – 1}/tm FRA0 = {[1 + 2.50%]/[1 + 2.00% × (180/360)] – 1}/(180/360) ≈ 2.97%<\/p>","qhtml":"<div class=\"pp-topic\">Pricing and Valuation of Forward Commitments<\/div><div class=\"qtext\"><p>If the 180-day spot MRR is 2.00% and the 360-day spot MRR is 2.50%, the no-arbitrage price of a new 6 × 12 forward rate agreement (30/360 day count) is:<\/p><\/div>","subj":"derivatives"},{"n":50,"q":"Three months ago, a company entered into a long 6 × 12 forward rate agreement (FRA) for £3 million at a fixed rate of 3.1%. If today the quoted rate on a new 3 × 9 FRA is 2.7% and the 9-month MRR is 2.5%, the value of the original FRA to the company is closest to:","opts":["–£8,834.","–£5,890.","£5,890."],"ans":"B","expl":"B is Correct because the Time g value of an FRA initiated at Time 0 is: Long FRA: Vg = NA × {[FRAg – FRA0]tm}/[1 + D(T–g)t(T–g)], where FRA is the FRA rate, Vg is the value at Time g of the original FRA that was initiated at Time 0, DT–g is the discount rate and NA is the notional amount. Thus, the Time g value of the receive-floating FRA initiated at Time 0 (Vg) is just the present value of the difference in FRA rates, one entered at Time g and one entered at Time 0. Hence, in this case, V3months = £3,000,000 × {[2.7% – 3.1%] × (6/12)}/[1 + 2.5% × (9/12)] ≈ –£5,890.","explhtml":"<p>B is Correct because the Time g value of an FRA initiated at Time 0 is: Long FRA: Vg = NA × {[FRAg – FRA0]tm}/[1 + D(T–g)t(T–g)], where FRA is the FRA rate, Vg is the value at Time g of the original FRA that was initiated at Time 0, DT–g is the discount rate and NA is the notional amount. Thus, the Time g value of the receive-floating FRA initiated at Time 0 (Vg) is just the present value of the difference in FRA rates, one entered at Time g and one entered at Time 0. Hence, in this case, V3months = £3,000,000 × {[2.7% – 3.1%] × (6/12)}/[1 + 2.5% × (9/12)] ≈ –£5,890.<\/p>","qhtml":"<div class=\"pp-topic\">Pricing and Valuation of Forward Commitments<\/div><div class=\"qtext\"><p>Three months ago, a company entered into a long 6 × 12 forward rate agreement (FRA) for £3 million at a fixed rate of 3.1%. If today the quoted rate on a new 3 × 9 FRA is 2.7% and the 9-month MRR is 2.5%, the value of the original FRA to the company is closest to:<\/p><\/div>","subj":"derivatives"},{"n":51,"q":"In contrast to forward contract values, futures contract values are:","opts":["zero at the end of each trading day.","not calculated based on carry benefits.","not calculated based on financing costs."],"ans":"A","expl":"A is Correct because the forward value can be expressed as either the present value of the difference in forward prices or as a function of the current underlying price adjusted for carry cash flows and the present value of the initial forward price. Futures prices are generally found using the same model, but futures values are different because of the daily marking to market. Recall that the futures values are zero at the end of each trading day because profits and losses are taken daily.","explhtml":"<p>A is Correct because the forward value can be expressed as either the present value of the difference in forward prices or as a function of the current underlying price adjusted for carry cash flows and the present value of the initial forward price. Futures prices are generally found using the same model, but futures values are different because of the daily marking to market. Recall that the futures values are zero at the end of each trading day because profits and losses are taken daily.<\/p>","qhtml":"<div class=\"pp-topic\">Pricing and Valuation of Forward Commitments<\/div><div class=\"qtext\"><p>In contrast to forward contract values, futures contract values are:<\/p><\/div>","subj":"derivatives"},{"n":52,"q":"According to the carry arbitrage model, forward contract prices decrease when:","opts":["carry costs increase.","carry benefits increase.","financing costs increase."],"ans":"B","expl":"B is Correct because the carry arbitrage model provides an approach for both pricing and valuing forward contracts. F0 = FV(S0 + CC0 – CB0) (Forward pricing) Carry costs (CC) and financing costs increase the forward price, and carry benefits (CB) decrease the forward price. The arbitrageur is carrying the underlying, and costs increase the burden whereas benefits decrease the burden.","explhtml":"<p>B is Correct because the carry arbitrage model provides an approach for both pricing and valuing forward contracts. F0 = FV(S0 + CC0 – CB0) (Forward pricing) Carry costs (CC) and financing costs increase the forward price, and carry benefits (CB) decrease the forward price. The arbitrageur is carrying the underlying, and costs increase the burden whereas benefits decrease the burden.<\/p>","qhtml":"<div class=\"pp-topic\">Pricing and Valuation of Forward Commitments<\/div><div class=\"qtext\"><p>According to the carry arbitrage model, forward contract prices decrease when:<\/p><\/div>","subj":"derivatives"},{"n":53,"q":"The adjusted price of a fixed-income futures contract at Time 0 is equal to the:","opts":["sum of the quoted bond price and accrued interest.","ratio of the quoted futures price to the conversion factor.","product of the quoted futures price and the conversion factor."],"ans":"C","expl":"C is Correct because the fixed-income forward or futures price including the conversion factor, termed the 'adjusted price,' can be expressed as: F0 = Q0 × CF. Fixed-income futures contracts often permit delivery of more than one bond and use the conversion factor system to provide this flexibility. In these markets, the futures price, F0, is defined as the quoted futures price, Q0, times the conversion factor, CF.","explhtml":"<p>C is Correct because the fixed-income forward or futures price including the conversion factor, termed the &#x27;adjusted price,&#x27; can be expressed as: F0 = Q0 × CF. Fixed-income futures contracts often permit delivery of more than one bond and use the conversion factor system to provide this flexibility. In these markets, the futures price, F0, is defined as the quoted futures price, Q0, times the conversion factor, CF.<\/p>","qhtml":"<div class=\"pp-topic\">Pricing and Valuation of Forward Commitments<\/div><div class=\"qtext\"><p>The adjusted price of a fixed-income futures contract at Time 0 is equal to the:<\/p><\/div>","subj":"derivatives"},{"n":54,"q":"When pricing an interest rate swap, which of the following is the easiest to use for replicating the swap's cash flows?","opts":["A pair of bonds","A portfolio of interest rate option contracts","A portfolio of interest rate futures contracts"],"ans":"A","expl":"A is Correct because an interest rate swap can be viewed as a pair of bonds where the coupon dates on the bonds match the settlement dates on the swap, and the maturity date matches the expiration date of the swap. It is worth noting that our replicating portfolio did not need to use a pair of bonds. Swaps can also be viewed as a portfolio of forward or futures contracts and also as a portfolio of options. However, bonds are perhaps the best instruments to replicate a swap because they are easy to value.","explhtml":"<p>A is Correct because an interest rate swap can be viewed as a pair of bonds where the coupon dates on the bonds match the settlement dates on the swap, and the maturity date matches the expiration date of the swap. It is worth noting that our replicating portfolio did not need to use a pair of bonds. Swaps can also be viewed as a portfolio of forward or futures contracts and also as a portfolio of options. However, bonds are perhaps the best instruments to replicate a swap because they are easy to value.<\/p>","qhtml":"<div class=\"pp-topic\">Pricing and Valuation of Forward Commitments<\/div><div class=\"qtext\"><p>When pricing an interest rate swap, which of the following is the easiest to use for replicating the swap&#x27;s cash flows?<\/p><\/div>","subj":"derivatives"},{"n":55,"q":"The equilibrium fixed rate for a 3- year fixed-for-floating interest rate swap with semiannual resets was 1.5% on the initiation date. At the first swap reset, the equilibrium fixed rate for the 2.5-year fixed-for-floating interest rate swap is 1.5% and the present value factors are as follows: The value of the swap to the pay-fixed party is:","opts":["negative.","zero.","positive."],"ans":"B","expl":"B is Correct because the pay-fixed rate of 1.5% at Time 0 is equal to the pay-fixed rate of 1.5% at the first semi-annual reset, hence the value of the swap is zero. The cash flows per unit of notional amount (NA) at each future date will always be based on the difference between the rate we initially received or paid at Time 0 and the current rate at Time t. The value of a receive- or pay-fixed swap at some future point in Time (t) is simply the sum of the present values of the difference in fixed swap rates times the stated notional amount. The market value of a swap to the fixed-rate payer can be computed as NA × (FSt − FS0) × ΣPVi (i = 1 to n). But since FS1 = FS0 (t = 1), the market value of the swap is zero.","explhtml":"<p>B is Correct because the pay-fixed rate of 1.5% at Time 0 is equal to the pay-fixed rate of 1.5% at the first semi-annual reset, hence the value of the swap is zero. The cash flows per unit of notional amount (NA) at each future date will always be based on the difference between the rate we initially received or paid at Time 0 and the current rate at Time t. The value of a receive- or pay-fixed swap at some future point in Time (t) is simply the sum of the present values of the difference in fixed swap rates times the stated notional amount. The market value of a swap to the fixed-rate payer can be computed as NA × (FSt − FS0) × ΣPVi (i = 1 to n). But since FS1 = FS0 (t = 1), the market value of the swap is zero.<\/p>","qhtml":"<div class=\"pp-topic\">Pricing and Valuation of Forward Commitments<\/div><div class=\"qtext\"><p>The equilibrium fixed rate for a 3- year fixed-for-floating interest rate swap with semiannual resets was 1.5% on the initiation date. At the first swap reset, the equilibrium fixed rate for the 2.5-year fixed-for-floating interest rate swap is 1.5% and the present value factors are as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp066.webp\" style=\"max-width:min(100%,556px)\" alt=\"\"><p>The value of the swap to the pay-fixed party is:<\/p><\/div>","subj":"derivatives"},{"n":56,"q":"A 2-year fixed-for-floating interest rate swap with semiannual resets was initiated one year ago. The present value factors are as follows: The fixed rate that sets the swap value to zero one year after swap initiation is closest to:","opts":["2.64%.","2.68%.","3.02%."],"ans":"B","expl":"B is Correct because, one year after swap initiation, the remaining future cash flows are in 0.5 years and 1 year from that point in time (i.e., 1.5 years and 2 years from swap initiation). The fixed swap rate, the 'price' that swap traders quote among one another, is simply one minus the final present value term divided by the sum of present values. Hence, the equilibrium fixed rate one year after swap initiation is [(1 – 0.973710)/(0.987654 + 0.973710)] × 2 ≈ 2.68%.","explhtml":"<p>B is Correct because, one year after swap initiation, the remaining future cash flows are in 0.5 years and 1 year from that point in time (i.e., 1.5 years and 2 years from swap initiation). The fixed swap rate, the &#x27;price&#x27; that swap traders quote among one another, is simply one minus the final present value term divided by the sum of present values. Hence, the equilibrium fixed rate one year after swap initiation is [(1 – 0.973710)/(0.987654 + 0.973710)] × 2 ≈ 2.68%.<\/p>","qhtml":"<div class=\"pp-topic\">Pricing and Valuation of Forward Commitments<\/div><div class=\"qtext\"><p>A 2-year fixed-for-floating interest rate swap with semiannual resets was initiated one year ago. The present value factors are as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp067.webp\" style=\"max-width:min(100%,555px)\" alt=\"\"><p>The fixed rate that sets the swap value to zero one year after swap initiation is closest to:<\/p><\/div>","subj":"derivatives"},{"n":57,"q":"An analyst gathers the following information about the GBP/EUR (amount of GBP per 1 EUR) exchange rate: Entering into an at-market 5-year pay-fixed EUR, receive-fixed GBP currency swap with a notional of EUR 1,000 is equivalent to:","opts":["short-selling a EUR 1,000 par value fixed-rate bond and purchasing a GBP 850 par value fixed-rate bond.","short-selling a EUR 1,000 par value fixed-rate bond and purchasing a GBP 900 par value fixed-rate bond.","purchasing a EUR 1,000 par value fixed-rate bond and short-selling a GBP 900 par value fixed-rate bond."],"ans":"B","expl":"B is Correct because entering into a pay-fixed EUR, receive-fixed GBP currency swap involves short-selling a EUR par value fixed-rate bond and purchasing a GBP par value fixed-rate bond. Furthermore, for a zero cash flow at initiation, the par value of the GBP bond must equal the spot exchange rate of 0.90 GBP/EUR times the notional amount (or par value) of EUR 1,000 of the EUR bond. Hence, the par value of the GBP bond equals GBP 900 = EUR 1,000 × 0.90 GBP/EUR.","explhtml":"<p>B is Correct because entering into a pay-fixed EUR, receive-fixed GBP currency swap involves short-selling a EUR par value fixed-rate bond and purchasing a GBP par value fixed-rate bond. Furthermore, for a zero cash flow at initiation, the par value of the GBP bond must equal the spot exchange rate of 0.90 GBP/EUR times the notional amount (or par value) of EUR 1,000 of the EUR bond. Hence, the par value of the GBP bond equals GBP 900 = EUR 1,000 × 0.90 GBP/EUR.<\/p>","qhtml":"<div class=\"pp-topic\">Pricing and Valuation of Forward Commitments<\/div><div class=\"qtext\"><p>An analyst gathers the following information about the GBP/EUR (amount of GBP per 1 EUR) exchange rate:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp068.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>Entering into an at-market 5-year pay-fixed EUR, receive-fixed GBP currency swap with a notional of EUR 1,000 is equivalent to:<\/p><\/div>","subj":"derivatives"},{"n":58,"q":"A receive-fixed USD, pay-floating JPY currency swap is equivalent to a receive-fixed USD, pay-fixed JPY currency swap paired with a:","opts":["pay-fixed, receive-floating JPY interest rate swap.","receive-fixed, pay-floating JPY interest rate swap.","receive-fixed, pay-floating USD interest rate swap."],"ans":"B","expl":"B is Correct because a fixed-for-floating currency swap (i.e., receive-fixed USD, pay- floating JPY) is simply a fixed-for-fixed currency swap (i.e., receive-fixed USD, pay- fixed JPY) paired with a fixed-for-floating interest rate swap (i.e., receive-fixed JPY, pay-floating JPY).","explhtml":"<p>B is Correct because a fixed-for-floating currency swap (i.e., receive-fixed USD, pay- floating JPY) is simply a fixed-for-fixed currency swap (i.e., receive-fixed USD, pay- fixed JPY) paired with a fixed-for-floating interest rate swap (i.e., receive-fixed JPY, pay-floating JPY).<\/p>","qhtml":"<div class=\"pp-topic\">Pricing and Valuation of Forward Commitments<\/div><div class=\"qtext\"><p>A receive-fixed USD, pay-floating JPY currency swap is equivalent to a receive-fixed USD, pay-fixed JPY currency swap paired with a:<\/p><\/div>","subj":"derivatives"},{"n":59,"q":"A company enters into a 2-year pay- fixed USD, receive-fixed EUR currency swap with semiannual resets. The spot interest rates and present value factors at initiation of the swap are as follows: The respective EUR and USD periodic fixed swap rates are closest to:","opts":["1.22% and 1.93%.","2.00% and 3.18%.","2.44% and 3.86%."],"ans":"A","expl":"A is Correct because the EUR periodic fixed rate is calculated as rEUR = [1 − PV2Y,EUR (1)]/[PV0.5Y,EUR (1) + PV1Y,EUR (1) + PV1.5Y,EUR (1) + PV2Y,EUR (1)] = (1 − 0.952381)/(0.992556 + 0.982318 + 0.968054 + 0.952381) ≈ 1.22%. The USD periodic fixed rate is calculated as rUSD = [1 − PV2Y,USD (1)]/[PV0.5Y,USD (1) + PV1Y,USD (1) + PV1.5Y,USD (1) + PV2Y,USD (1)] = (1 − 0.925926)/(0.988631 + 0.971817 + 0.950997 + 0.925926) ≈ 1.93%.","explhtml":"<p>A is Correct because the EUR periodic fixed rate is calculated as rEUR = [1 − PV2Y,EUR (1)]/[PV0.5Y,EUR (1) + PV1Y,EUR (1) + PV1.5Y,EUR (1) + PV2Y,EUR (1)] = (1 − 0.952381)/(0.992556 + 0.982318 + 0.968054 + 0.952381) ≈ 1.22%. The USD periodic fixed rate is calculated as rUSD = [1 − PV2Y,USD (1)]/[PV0.5Y,USD (1) + PV1Y,USD (1) + PV1.5Y,USD (1) + PV2Y,USD (1)] = (1 − 0.925926)/(0.988631 + 0.971817 + 0.950997 + 0.925926) ≈ 1.93%.<\/p>","qhtml":"<div class=\"pp-topic\">Pricing and Valuation of Forward Commitments<\/div><div class=\"qtext\"><p>A company enters into a 2-year pay- fixed USD, receive-fixed EUR currency swap with semiannual resets. The spot interest rates and present value factors at initiation of the swap are as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp069.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>The respective EUR and USD periodic fixed swap rates are closest to:<\/p><\/div>","subj":"derivatives"},{"n":60,"q":"Six months ago, an investor entered into a receive-fixed 4.5%, pay-equity index 3-year annual reset swap, where both legs have a notional value of $1,000,000. The current present value factors for the appropriate spot interest rate maturities are as follows: If the value of the underlying equity index decreased from 100 to 98 over the recent 6-month period, the current value of the equity swap is closest to:","opts":["–$6,721.","$20,000.","$33,687."],"ans":"C","expl":"C is Correct because finding the value of an equity swap after the swap is initiated, say at Time t (so, VEQ,t), is similar to valuing an interest rate swap except that rather than adjusting the floating-rate bond for the last floating rate observed (remember, advanced set), we adjust the value of the notional amount of equity, as shown below: VEQ,t = VFIX(C0) – (St/St–1)NAE – PV(Par – NAE), where VFIX(C0) denotes the value at Time t of a fixed-rate bond initiated with coupon C0 at Time 0, St denotes the current equity price, St–1 denotes the equity price observed at the last reset date, and PV() denotes the present value function from the swap maturity date to Time t. Hence, the fair value of this swap is found by solving for the fair value of the implied fixed-rate bond. We then adjust for the equity value. The fixed rate of 4.5% results in fixed cash flows of 0.045 × $1,000,000 = $45,000 at each settlement. Applying the respective present value factors gives us the following: Therefore, the fair value of the implied fixed-rate bond, VFIX(C0), is $1,013,687 and the fair value of the equity swap is: VEQ,t = $1,013,687 – (98/100) × $1,000,000 – 0 ≈ $33,687, where the last term is zero since the notional amount of equity and the bond par value are assumed equal.","explhtml":"<p>C is Correct because finding the value of an equity swap after the swap is initiated, say at Time t (so, VEQ,t), is similar to valuing an interest rate swap except that rather than adjusting the floating-rate bond for the last floating rate observed (remember, advanced set), we adjust the value of the notional amount of equity, as shown below: VEQ,t = VFIX(C0) – (St/St–1)NAE – PV(Par – NAE), where VFIX(C0) denotes the value at Time t of a fixed-rate bond initiated with coupon C0 at Time 0, St denotes the current equity price, St–1 denotes the equity price observed at the last reset date, and PV() denotes the present value function from the swap maturity date to Time t. Hence, the fair value of this swap is found by solving for the fair value of the implied fixed-rate bond. We then adjust for the equity value. The fixed rate of 4.5% results in fixed cash flows of 0.045 × $1,000,000 = $45,000 at each settlement. Applying the respective present value factors gives us the following:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp073.webp\" style=\"max-width:min(100%,721px)\" alt=\"\"><p>Therefore, the fair value of the implied fixed-rate bond, VFIX(C0), is $1,013,687 and the fair value of the equity swap is: VEQ,t = $1,013,687 – (98/100) × $1,000,000 – 0 ≈ $33,687, where the last term is zero since the notional amount of equity and the bond par value are assumed equal.<\/p>","qhtml":"<div class=\"pp-topic\">Pricing and Valuation of Forward Commitments<\/div><div class=\"qtext\"><p>Six months ago, an investor entered into a receive-fixed 4.5%, pay-equity index 3-year annual reset swap, where both legs have a notional value of $1,000,000. The current present value factors for the appropriate spot interest rate maturities are as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp070.webp\" style=\"max-width:min(100%,560px)\" alt=\"\"><p>If the value of the underlying equity index decreased from 100 to 98 over the recent 6-month period, the current value of the equity swap is closest to:<\/p><\/div>","subj":"derivatives"},{"n":61,"q":"Six months ago, an investor entered into a receive-fixed, pay-equity swap with the following specifications: Currently, the implied fixed-rate bond used for pricing the swap has a fair value of $18,359,361 (assuming a par value of $20,000,000). If the equity underlying the swap was trading at $75 at the time of swap initiation, which of the following current equity prices would result in an equity swap value closest to zero?","opts":["$69","$78","$82"],"ans":"A","expl":"A is Correct because finding the value of an equity swap after the swap is initiated, say at Time t (so, VEQ,t), is similar to valuing an interest rate swap except that rather than adjusting the floating-rate bond for the last floating rate observed (remember, advanced set), we adjust the value of the notional amount of equity, as shown below: VEQ,t = VFIX(C0) – (St/St–1)NAE – PV(Par – NAE), where VFIX(C0) denotes the value at Time t of a fixed-rate bond initiated with coupon C0 at Time 0, St denotes the current equity price, St–1 denotes the equity price observed at the last reset date, and PV() denotes the present value function from the swap maturity date to Time t. Since the par value of the bond used for pricing is equal to the notional amount of the swap (i.e., Par = NAE), the final term in the valuation formula is zero. Moreover, the current value of the implied fixed-rate bond, VFIX(C0), is given in the question as $18,359,361, and we identify St–1 = $75 and NAE = $20,000,000. Hence, VEQ,t = $18,359,361 – (St/$75)($20,000,000) – 0. Setting VEQ,t = 0 and solving for St yields St = $75 × ($18,359,361/$20,000,000) = $68.85 ≈ $69.","explhtml":"<p>A is Correct because finding the value of an equity swap after the swap is initiated, say at Time t (so, VEQ,t), is similar to valuing an interest rate swap except that rather than adjusting the floating-rate bond for the last floating rate observed (remember, advanced set), we adjust the value of the notional amount of equity, as shown below: VEQ,t = VFIX(C0) – (St/St–1)NAE – PV(Par – NAE), where VFIX(C0) denotes the value at Time t of a fixed-rate bond initiated with coupon C0 at Time 0, St denotes the current equity price, St–1 denotes the equity price observed at the last reset date, and PV() denotes the present value function from the swap maturity date to Time t. Since the par value of the bond used for pricing is equal to the notional amount of the swap (i.e., Par = NAE), the final term in the valuation formula is zero. Moreover, the current value of the implied fixed-rate bond, VFIX(C0), is given in the question as $18,359,361, and we identify St–1 = $75 and NAE = $20,000,000. Hence, VEQ,t = $18,359,361 – (St/$75)($20,000,000) – 0. Setting VEQ,t = 0 and solving for St yields St = $75 × ($18,359,361/$20,000,000) = $68.85 ≈ $69.<\/p>","qhtml":"<div class=\"pp-topic\">Pricing and Valuation of Forward Commitments<\/div><div class=\"qtext\"><p>Six months ago, an investor entered into a receive-fixed, pay-equity swap with the following specifications:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp071.webp\" style=\"max-width:min(100%,550px)\" alt=\"\"><p>Currently, the implied fixed-rate bond used for pricing the swap has a fair value of $18,359,361 (assuming a par value of $20,000,000). If the equity underlying the swap was trading at $75 at the time of swap initiation, which of the following current equity prices would result in an equity swap value closest to zero?<\/p><\/div>","subj":"derivatives"},{"n":62,"q":"If the S&P 500 Index return for a given quarter is –5%, the holder of which of the following S&P 500 Index equity swaps will most likely incur a negative cash flow on the quarterly reset date?","opts":["A pay-equity, receive-fixed swap","A pay-equity, receive-floating swap","A receive-equity, pay-floating swap"],"ans":"C","expl":"C is Correct because the S&P 500 Index return is negative, therefore, the holder of a receive-equity, pay-floating swap must pay 5% and also pay the floating coupon to the counterparty. When the equity leg of the swap is negative, then the receive-equity counterparty must pay both the equity return as well as the fixed rate (or whatever are the payment terms). Note also that equity swaps may cause liquidity problems. As seen here, if the equity return is negative, then the receive-equity return, pay-floating or pay-fixed swap may result in a large negative cash flow for the receive-equity return party.","explhtml":"<p>C is Correct because the S&amp;P 500 Index return is negative, therefore, the holder of a receive-equity, pay-floating swap must pay 5% and also pay the floating coupon to the counterparty. When the equity leg of the swap is negative, then the receive-equity counterparty must pay both the equity return as well as the fixed rate (or whatever are the payment terms). Note also that equity swaps may cause liquidity problems. As seen here, if the equity return is negative, then the receive-equity return, pay-floating or pay-fixed swap may result in a large negative cash flow for the receive-equity return party.<\/p>","qhtml":"<div class=\"pp-topic\">Pricing and Valuation of Forward Commitments<\/div><div class=\"qtext\"><p>If the S&amp;P 500 Index return for a given quarter is –5%, the holder of which of the following S&amp;P 500 Index equity swaps will most likely incur a negative cash flow on the quarterly reset date?<\/p><\/div>","subj":"derivatives"},{"n":63,"q":"Six months ago, a company entered into a 2-year, £10 million pay-fixed, receive-equity swap with the FTSE 250 as the reference index. The company's analyst gathers the following information: The current fair value of this swap to the company is closest to:","opts":["£290,164.","£343,194.","£371,835."],"ans":"C","expl":"C is Correct because, as shown below, the present value of the swap pay leg is – £9,972,993.05 while the present value of the swap receive leg is £10,344,827.59, resulting in a net present value of £371,835. Present value (PV) of pay-fixed leg: PV of receive-equity leg = (7,500/7,250) × £10,000,000 = £10,344,827.59 Fair value to pay-fixed, receive-equity party = £10,344,827.59 – £9,972,993.05 ≈ £371,835","explhtml":"<p>C is Correct because, as shown below, the present value of the swap pay leg is – £9,972,993.05 while the present value of the swap receive leg is £10,344,827.59, resulting in a net present value of £371,835. Present value (PV) of pay-fixed leg:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp074.webp\" style=\"max-width:min(100%,721px)\" alt=\"\"><p>PV of receive-equity leg = (7,500/7,250) × £10,000,000 = £10,344,827.59 Fair value to pay-fixed, receive-equity party = £10,344,827.59 – £9,972,993.05 ≈ £371,835<\/p>","qhtml":"<div class=\"pp-topic\">Pricing and Valuation of Forward Commitments<\/div><div class=\"qtext\"><p>Six months ago, a company entered into a 2-year, £10 million pay-fixed, receive-equity swap with the FTSE 250 as the reference index. The company&#x27;s analyst gathers the following information:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp072.webp\" style=\"max-width:min(100%,483px)\" alt=\"\"><p>The current fair value of this swap to the company is closest to:<\/p><\/div>","subj":"derivatives"}];
const CFG = {"title": "Derivatives — Practice Pack", "subtitle": "CFA Level II · 63 câu · EdZeb", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
