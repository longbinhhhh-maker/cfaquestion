<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "The original issue discount tax provision most likely applies to a(n):", "opts": ["floating-rate note.", "index-linked bond.", "zero-coupon bond."], "ans": "C", "expl": "Original issue discount (OID)\nTax treatment for bonds originally issued at a discount to par\nDescription The OID is the difference between par value and the issue price\nZero-coupon bonds are a common example\nProrated portion of the discount is taxed as income each year\nProrated portion is added to the cost basis\nTax treatment\nNo capital gains taxes at maturity\nNot applicable in all jurisdictions\nThe original issue discount (OID) is a tax provision that applies to bonds that were originally issued at a discount to par. OID is not applicable\nin all tax jurisdictions, but where it is, a prorated portion of the discount is taxed as income every year. This prorated portion is also added to\nthe cost basis of the bond, such that no capital gains taxes are due at maturity.\nA zero-coupon is a classic example of an OID bond since it is issued at a significant discount to par and pays no coupon interest. The bond's\nonly cash flow occurs at maturity, when the investor receives its face value. The difference between par value and the purchase price represents\nthe OID on the bond.\n(Choice A) Floating-rate notes (FRN) are bonds whose coupon interest fluctuates based on a specified reference rate, such as LIBOR. FRN are\nissued at par since the coupon rate is set at the market rate at issuance.\n(Choice B) Index-linked bonds are issued at par. The interest and/or principal payments for index-linked bonds vary based on changes to a\nspecific index, such as a commodity index or an inflation index.\nThings to remember:\nThe original issue discount (OID) is a tax provision that applies to bonds that were originally issued at a discount to par. A prorated portion of the\ndiscount is taxed as income every year and added to the cost basis of the bond, such that no capital gains taxes are due at maturity. A zero-\ncoupon bond is a classic example of an OID bond.\nDescribe how legal, regulatory, and tax considerations affect the issuance and trading of fixed-income securities", "qhtml": null}, {"n": 2, "q": "Which of the following statements is most accurate regarding convertible bonds?", "opts": ["The conversion value equals the conversion price multiplied by the conversion ratio.", "The issuer pays higher coupon rates relative to an otherwise similar option free bond.", "The value of the issuer's straight bond provides a price floor for its convertible bond price."], "ans": "C", "expl": "A convertible bond, a hybrid security with both debt and equity characteristics, gives the bondholder (ie, investor) the option to convert the bond\ninto shares of the issuer's common stock. The conversion option benefits the investor in multiple ways.\nIf the stock price appreciates, the investor can convert the bond into common stock and enjoy the potentially higher equity upside.\nIf the stock price drops, the investor holds onto the convertible bond just like a straight bond (ie, regular nonconvertible bond); therefore, the\nprice of the straight bond serves as the minimum value (ie, price floor) for the convertible debt.\nDue to the conversion option, bondholders are willing to accept lower coupon payments from issuers (ie, borrowers) (Choice B).\n(Choice A) Conversion value equals current share price multiplied by conversion ratio.\nThings to remember:\nA convertible bond gives the bondholder (ie, investor) the option to convert the bond into shares of the issuer's (ie, borrower's) common stock.\nInvestors are willing to pay a higher price and receive lower coupons than on otherwise similar nonconvertible bonds.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}, {"n": 3, "q": "A five-year amortizing bond has a face value of $1,000. If it was issued at par with a yield-to-maturity of 5.18% and pays investors $160 annually at the end of Years 1 through 4, the total payment in Year 5 is closest to:", "opts": ["Income is taxable.", "The bond's cost basis increases.", "Unrealized capital gains are taxable."], "ans": "C", "expl": "Original issue discount (OID)\nTax treatment for bonds originally issued at a discount to par\nDescription The OID is the difference between par value and the issue price\nZero-coupon bonds are a common example\nProrated portion of the discount is taxed as income each year\nProrated portion is added to the cost basis\nTax treatment\nNo capital gains taxes at maturity\nNot applicable in all jurisdictions\nThe original issue discount (OID) is a tax provision that applies to bonds which were originally issued at a discount to par. OID is not\napplicable in all tax jurisdictions, but where it does apply, a prorated portion of the discount is taxed as income each year, not as capital gains\n(Choice A). A prorated portion is also added to the cost basis of the bond, such that no capital gains taxes are due at maturity (Choice B). A\nzero-coupon bond is a classic example of an OID bond.\nThings to remember:\nThe original issue discount (OID) is a tax provision that applies to bonds which were originally issued at a discount to par. OID is not applicable in\nall tax jurisdictions, but where it does apply, a prorated portion of the discount is taxed as income each year, not as capital gains. A prorated\nportion is also added to the cost basis of the bond, such that no capital gains taxes are due at maturity.\nDescribe how legal, regulatory, and tax considerations affect the issuance and trading of fixed-income securities", "qhtml": null}, {"n": 4, "q": "Which of the following statements least likely applies to an original issue discount (OID) bond on an annual basis?", "opts": ["Income is taxable.", "The bond's cost basis increases.", "Unrealized capital gains are taxable."], "ans": "C", "expl": "Original issue discount (OID)\nTax treatment for bonds originally issued at a discount to par\nDescription The OID is the difference between par value and the issue price\nZero-coupon bonds are a common example\nProrated portion of the discount is taxed as income each year\nProrated portion is added to the cost basis\nTax treatment\nNo capital gains taxes at maturity\nNot applicable in all jurisdictions\nThe original issue discount (OID) is a tax provision that applies to bonds which were originally issued at a discount to par. OID is not\napplicable in all tax jurisdictions, but where it does apply, a prorated portion of the discount is taxed as income each year, not as capital gains\n(Choice A). A prorated portion is also added to the cost basis of the bond, such that no capital gains taxes are due at maturity (Choice B). A\nzero-coupon bond is a classic example of an OID bond.\nThings to remember:\nThe original issue discount (OID) is a tax provision that applies to bonds which were originally issued at a discount to par. OID is not applicable in\nall tax jurisdictions, but where it does apply, a prorated portion of the discount is taxed as income each year, not as capital gains. A prorated\nportion is also added to the cost basis of the bond, such that no capital gains taxes are due at maturity.\nDescribe how legal, regulatory, and tax considerations affect the issuance and trading of fixed-income securities", "qhtml": null}, {"n": 5, "q": "A company issued a 2-year bond and chose not to make cash interest payments prior to maturity. Instead, the company elected to add additional debt to the principal amount each period. The company payed off the full principal at maturity. This type of bond is best described as a:", "opts": ["convertible.", "payment-in-kind.", "deferred coupon."], "ans": "B", "expl": "A payment-in-kind (PIK) bond allows the issuer (borrower) to increase the loan principal each period by the amount of interest owed, instead of\nperiodically paying interest in cash. At maturity, the issuer pays the full principal balance, including the additions for unpaid interest. Essentially,\nprior to maturity, the issuer is paying interest in the form additional bonds rather than in cash.\nPIK bonds are commonly issued by companies that suffer from a short-term \"cash crunch.\" Therefore, investors (lenders) typically demand a\nhigher yield in return for allowing borrowers to conserve cash for a longer period. Some PIK agreements allow issuers multiple options each\nperiod: to add interest onto the principal (ie, \"roll interest into principal\"); pay interest in common stock; or pay interest in cash.\n(Choice A) A convertible bond gives the bondholder (investor) the option to convert the entire bond, or portions of the bond, into common shares\nof the issuer's stock.\n(Choice C) A deferred coupon bond pays no interest early in its life but pays a higher interest rate in its later years. This is different from a PIK\nbond since only the principal amount changes on a PIK, not the interest rate.\nThings to remember:\nA payment-in-kind (PIK) bond allows the issuer (borrower) to increase the loan principal each period by the amount of interest owed instead of\nperiodically paying interest. At maturity, the issuer pays the full principal balance, including the additions for unpaid interest.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}, {"n": 6, "q": "If interest rates fall, which of the following is most likely to occur with respect to a callable bond prior to maturity?", "opts": ["The issuer will buy back the bond at a price below par.", "The issuer will buy back the bond at a predetermined price.", "The bondholder will buy back the bond at a predetermined price."], "ans": "B", "expl": "A callable bond contains a call provision that gives the issuer (ie, borrower) the option to buy back the bond from the bondholder (ie, investor)\nat a predetermined price prior to maturity. The issuer may exercise the call option (ie, call the bond) when interest rates fall and then refinance\nthe bond at a lower interest rate. This exposes the investor to reinvestment risk since the proceeds must be reinvested at lower rates. Therefore,\nthe call feature benefits the issuer at the investor's expense.\nHowever, due to the reinvestment risk, investors pay less for callable bonds than for otherwise similar option-free bonds. Likewise, callable bonds\nearn higher yields. To mitigate their risk, these bonds sometimes contain a call protection period (ie, lockout period) that prohibits exercising the\ncall option until a specified date.\n(Choices A and C) The issuer has the option to redeem (ie, buy back) the bond at the predetermined call price, which is at least equal to the par\nvalue.\nThings to remember:\nA callable bond contains a call provision that gives the issuer (ie, borrower) the option to buy back the bond from the bondholder (ie, investor) at a\npredetermined price prior to maturity. An issuer may exercise the call option (ie, call the bond) when interest rates fall and then refinance at a\nlower interest rate. Callable bonds are priced lower than otherwise similar option-free bonds and offer higher yields.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}, {"n": 7, "q": "Three bonds are identical in all respects except for their call provisions: Bond X has an embedded Bermuda-style call Bond Y has an embedded American-style call Bond Z has an embedded European-style call All else being equal, which bond should have the highest yield?", "opts": ["Bond X", "Bond Y", "Bond Z"], "ans": "B", "expl": "Types of call provisions\nAmerican style Continuously callable: the issuer has the right to call at any time beginning on the call date until maturity\nEuropean style Only one call date, and the issuer can call bonds only on that date\nBermuda style Can be called on one of multiple call dates, but only on those dates\nA callable bond gives the issuer the right to buy the bond from the bondholders prior to maturity, which exposes bondholders to the risk of then\nreinvesting at lower yields. Investors will require incrementally higher yields to compensate for any increased risk of exercise; therefore, the more\nflexibility the issuer embeds with the call option, the higher the cost (ie, the bond yield) will be to the issuer.\nAn American-style call provision is often referred to as continuously callable since the issuer has the right to call bonds at any time beginning\non the call date until final maturity. Of the three types of calls, an American-style call gives the issuer the most flexibility and exposes the\ninvestor to the most risk. Therefore, American-style bonds are the most expensive to issue since investors will require the highest yield to\ncompensate for their risk.\n(Choice A) A Bermuda-style call provision has multiple call dates, but bonds can be called only on a specific call date, which often matches\ncoupon payment dates.\n(Choice C) A European-style call provision exposes the investor to the least amount of call risk since there is only one call date and the issuer\ncan call the bonds only on that date.\nThings to remember:\nA callable bond gives the issuer the right to buy the bond from the bondholders prior to maturity, which exposes bondholders to risk. The issuer of\nan American-style call provision has the right to call the bonds at any time beginning on the call date until final maturity. Since an American-style\ncall is the most flexible call type and exposes investors to the most call risk, it is the most expensive to issue.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}, {"n": 8, "q": "A bond indenture is least likely to include:", "opts": ["Covenants", "Credit ratings", "Contingency provisions"], "ans": "B", "expl": "Bond indentures\nObligations of issuers\nContracts\nRights of bondholders\nDue dates of interest and principal\nCash flows\nAmounts due or method of determination\nAffirmative: Actions the issuer must take\nCovenants\nNegative: Actions the issuer is prohibited from taking\nSeniority of bond issue\nCredit protections\nAssets pledged as collateral or credit enhancements\nBondholder options: Put or conversion provisions\nContingency provisions\nIssuer options: Call provisions\nIndentures (eg, bond indentures, trust deeds) are contracts that specify the terms and conditions regarding repayment of debt securities. A bond\nindenture identifies:\nthe rights of bondholders,\nthe obligations of the issuer, and\na trustee to monitor and enforce the issuer's compliance with the contract.\nBond indentures also specify the amount and timing of the interest and principal repayments along with the source(s) of funds to meet those\nobligations. Credit ratings reflect a rating agency's assessment of the bond issuer's ability to make the payments in accordance with the terms\nstated in the indenture. Appraising a bond's creditworthiness involves assessing any protective provisions included in the indenture, but the credit\nrating itself is not an element of the indenture.\n(Choice A) Most indentures include covenants that protect bondholders by placing restrictions (eg, limits on dividends) and/or requirements (eg,\nmaintain minimum net worth) on the issuer.\n(Choice C) Many indentures include contingency provisions granting the issuer and/or the bondholders options to take some action (eg, allowing\nthe issuer to retire bonds prior to maturity).\nThings to remember:\nBond indentures are contracts that specify the terms and conditions regarding repayment of debt. An indenture identifies the rights of\nbondholders, the obligations of the bond issuer, and a trustee to monitor and enforce the issuer's compliance with the contract. It may also include\nprotective covenants or contingency provisions. Credit ratings are not an element of bond indentures.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}, {"n": 9, "q": "A bond with a face value of £1,000 is convertible into shares of the issuer's common stock at £40 per share. If the current price of the stock is £30 per share and the current price of the bond is £950, the bond's conversion ratio is closest to:", "opts": ["23.75", "25.00", "33.33"], "ans": "B", "expl": "A convertible bond is a hybrid security that has both debt and equity characteristics. It is issued as a straight bond, so it has a par value (ie,\nface value) and a maturity date. However, a convertible bond gives the owner the option to convert it into a specific number of shares of the\nissuer's common stock. The conversion feature can benefit the owner, since the company's stock may generate a greater return than the bond.\nThis benefit permits the issuer to pay a lower coupon rate than for a nonconvertible bond.\nThe bond's indenture (contract) may provide the number of shares (conversion ratio) and the per-share price (conversion price) of the common\nstock that the bond can be converted into. If the bond does not specify a conversion ratio, it can be calculated by dividing the bond's par value\nby the conversion price. Since this bond's conversion price is £40, the conversion ratio equals 25 (£1,000 ÷ £40).\n(Choice A) 23.75 results from incorrectly dividing the bond's current price (£950)—rather than its par value—by the conversion price.\n(Choice C) 33.33 results from dividing the bond's par value by the stock's current price (£30) instead of its conversion price (£40).\nThings to remember:\nA convertible bond is a hybrid security that can be converted into a specified number of shares of the issuer's common stock. The bond's\nconversion price is the stock's per-share price for converting the bond. The conversion ratio represents the number of shares that the owner\nreceives when converting the bond. If the ratio is not given, it can be calculated by dividing the bond's par value by the conversion price.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}, {"n": 10, "q": "A bond issued by New York City, denominated in USD, and sold only in Canada and Mexico is most likely a:", "opts": ["Eurobond.", "global bond.", "sovereign bond."], "ans": "A", "expl": "A Eurobond is a bond issued by a nonresident outside the jurisdiction of any one country. Often a Eurobond is sold to investors in more than\none country at the same time. It can be issued in any currency.\nThe main distinction between a Eurobond and a global bond is that a global bond is also issued in the issuer's country as well as other countries.\nThe bond in this question would be a global bond if New York City issued them in the United States as well as in Mexico and Canada (Choice B).\n(Choice C) A sovereign bond is issued by a national government. Bonds from local governments such as New York City are known as\nnonsovereign or quasi-sovereign bonds.\nThings to remember:\nEurobonds represent borrowing by nonresidents of the countries where the bonds are issued. They are often issued simultaneously in more than\none country and are denominated in a currency other than that of the country of issuance or the issuer. Global bonds are Eurobonds that are also\nissued in the issuer's domestic country.\nDescribe how legal, regulatory, and tax considerations affect the issuance and trading of fixed-income securities", "qhtml": null}, {"n": 11, "q": "An investment-grade corporate bond issuer needs capital to fund a project that will not produce cash flow for several years. If the issuer wishes to align coupon payments with the project cash flows, which of the following bond coupon structures best fits this need?", "opts": ["Step-up", "Deferred", "Payment-in-kind"], "ans": "B", "expl": "A bond with a deferred coupon pays no coupon interest early in its life and compensates investors with a higher coupon rate in later years.\nThe most common application of deferred coupon bonds is allowing better cash flow management in project financing, as in this scenario. Due\nto the lack of coupon payments early in their life, deferred coupon bonds are most often issued at a significant discount to par. A zero-coupon\nbond can be thought of as an extreme example of a deferred coupon bond since all principal and interest is deferred until final maturity.\n(Choice A) A step-up coupon bond increases the coupon at a predetermined rate at specified intervals. Step-up bonds are often callable by the\nissuer just before a scheduled increase in the coupon rate. This call flexibility gives the issuer the opportunity to refinance the loan at a lower rate\nif interest rates have not increased.\n(Choice C) A payment-in-kind (PIK) bond allows the issuer to pay coupon interest in cash or in additional bonds. PIK bonds are among the most\nexpensive types of debt a company can issue and are most commonly issued by low-rated or distressed companies with a high debt burden. PIK\nbonds are much more likely to be used to fund a leveraged buyout (LBO) than to be used in project financing by an investment-grade issuer.\nThings to remember:\nA bond with a deferred coupon pays no coupon interest early in its life and compensates investors with a higher coupon rate in later years.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}, {"n": 12, "q": "All else being equal, for an issuer selling 10-year bonds, which of the following most likely requires the highest yield at issuance? A bond that is:", "opts": ["putable.", "callable.", "convertible."], "ans": "B", "expl": "Bonds with contingency provisions combine the cash flows of a debt contract with an option referred to as an embedded option. Three common\nexamples are:\ncallable bonds, which issuers can retire prior to maturity,\nputable bonds, which holders can force issuers to repurchase prior to maturity, and\nconvertible bonds, which holders can exchange for issuers' common stock.\nOwning an option provides an advantage, so the effective price of such bonds reflects whichever counterparty is implicitly \"paying\" for the\nembedded option. Since issuers must pay for the right to retire bonds early, the issuer compensates investors by selling the bonds at a lower\neffective price and at a higher yield than equivalent noncallable (eg, putable, convertible) bonds.\n(Choices A and C) In putable and convertible bonds, investors own the option. Investors must pay the issuer a higher effective price for those\nrights, which is reflected in a lower yield compared with bonds not containing such options.\nThings to remember:\nThe effective price of a bond with an embedded option reflects the counterparty implicitly \"paying\" for the embedded option. For a callable bond,\nthe issuer must pay bondholders for the call option, which results in a lower effective bond price and a higher yield on callable bonds compared\nwith similar noncallable putable or convertible bonds.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}, {"n": 13, "q": "A one-year bond is issued with the following characteristics: Coupon Changes on Call Dates, Callable Quarterly Initial coupon 1.00% Second coupon 1.25% Third coupon 1.50% Final coupon 1.75% This coupon structure is best described as: ", "opts": ["step up.", "floating rate.", "Bermuda style."], "ans": "A", "expl": "A step-up coupon bond has a structure where the coupon increases by a predetermined amount on specific dates. These step-up dates usually\ncorrespond with call dates, allowing the issuer to call the bonds before the coupon increases. A step-up coupon structure offers investors some\nprotection against rising interest rates but also exposes them to call risk.\n(Choice B) Coupons on floating-rate bonds reset periodically, but the amount of change is not preset. Floating-rate coupons are specifically tied\nto an underlying reference rate (eg, LIBOR), with the coupon fixed at that variable rate plus a predetermined spread.\n(Choice C) Bermuda style refers to a type of call structure in which the issuer has the right to call the bonds on predetermined dates (eg,\nquarterly), often in conjunction with coupon payment dates. However, the coupon is not scheduled to increase on each call date.\nThings to remember:\nA step-up coupon bond has a structure where the coupon increases by a predetermined amount on specific dates, often corresponding with call\ndates. A step-up coupon structure offers investors some protection against rising interest rates but also exposes them to call risk.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}, {"n": 14, "q": "One year after it was issued, an investor purchases a tax-exempt, coupon-paying bond for less than its face value and holds it to maturity. The most likely tax consequence for the taxpayer is:", "opts": ["income tax but no capital gains tax.", "no income tax but capital gains tax.", "neither income tax nor capital gains tax."], "ans": "B", "expl": "Receipt of coupon interest and principal exposes investors to two potential types of tax. Interest is normally treated as ordinary income and\nis subject to tax at the same rate as wages. However, interest received on bonds issued by state and local governments is generally exempt from\nincome tax. Tax-exempt bonds tend to be purchased by investors in jurisdictions with high personal income tax rates.\nThe other type of tax is capital gains tax, which taxes an investor's gain (ie, profit) from an investment. This tax applies to all bonds, regardless\nof whether the bondholder pays taxes on interest received. A capital gain occurs when the face value that the investor receives at maturity is\ngreater than the amount the investor paid for the bond.\nFor the exam, remember that the tax-exempt designation does not apply to all taxes. The exemption usually applies to income taxation of coupon\ninterest. Taxes on capital gains apply to all bonds (Choices A and C).\nThings to remember:\nCoupon interest is usually treated as ordinary income, so it is subject to the same tax rate as other types of income. The coupon interest from tax-\nexempt bonds is free from income taxes, but gains on such bonds remain subject to capital gains taxes.\nDescribe how legal, regulatory, and tax considerations affect the issuance and trading of fixed-income securities", "qhtml": null}, {"n": 15, "q": "When interest rates are increasing, which of the following types of bonds is most likely to increase in value?", "opts": ["Callable", "Index-linked", "Payment-in-kind"], "ans": "B", "expl": "The interest and/or principal payments for index-linked bonds can vary based on changes to a specific index, such as a broad equity index or an\nindex of commodities prices. Most index-linked bonds are designed to maintain purchasing power that erodes from inflation.\nWhen inflation increases, interest rates often rise too. Bonds that adjust their coupon interest rate and/or face value for inflation can help mitigate\nthat risk. Inflation-linked bonds, a common category of index-linked bonds, are usually issued by sovereign governments. Adjustments to their\ncoupon and/or principal payments are based on broad inflation indices such as the Consumer Price Index in the United States or the Retail Price\nIndex in the UK.\n(Choice A) Callable bonds can be redeemed by the issuer before maturity (eg, refinancing when interest rates decline). Callability benefits the\nissuer (borrower), not the investors (lenders), since the issuer will call the bond when interest rates are declining.\n(Choice C) Payment-in-kind (PIK) bonds pay interest in the form of additional bonds rather than cash coupon payments. This feature can help\nissuers conserve cash by issuing more debt, but it exposes the investors to higher default risk since the issuer must repay more debt. PIK bonds'\nvalue does not increase when interest rates increase since the bonds do not adjust interest and/or principal in response to higher interest rates.\nThings to remember:\nIndex-linked bonds can adjust payments based on changes in an index. One type of index-linked bond is an inflation-linked bond. These bonds\nare usually issued by sovereign governments and are tied to broad inflation indices such as the Consumer Price Index (US) or the Retail Price\nIndex (UK). Index-linked bonds provide investors with the benefit of rising interest rates since a bond's coupon rate and/or principal increases to\nkeep pace with inflation.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}, {"n": 16, "q": "Which of the following bonds is most likely to be considered a domestic bond? A bond that is:", "opts": ["issued by a US company, denominated in EUR, and sold in Australia.", "issued by a US-based subsidiary of a Japanese company, denominated in USD, and sold in the US.", "issued by a British company, denominated in GBP, and sold in the UK, Japan, and South America."], "ans": "B", "expl": "Regulatory and legal considerations affect where a bond is issued and to whom it is sold. A domestic bond is issued by a company that is\nincorporated within the country of issuance, denominated in that country's currency, and sold to investors within that country. This\nclassification applies even if the issuer is a subsidiary of a foreign company. An example is a US subsidiary of Toyota (a Japanese company)\nissuing USD bonds in the United States.\n(Choice A) A bond issued by a US company in Australia and denominated in EUR is considered a Eurobond.\n(Choice C) This is an example of a global bond, which is issued in the issuer's domestic country as well as in other countries.\nThings to remember:\nDomestic bonds represent the obligation of a domestic issuer, are denominated in the domestic currency, and are sold and traded in the domestic\nmarket. A domestic issuer can be a domestic subsidiary of a foreign company.\nDescribe how legal, regulatory, and tax considerations affect the issuance and trading of fixed-income securities", "qhtml": null}, {"n": 17, "q": "A bond indenture specifies that the coupon rate will increase by 30 basis points (bps) every time the issuer receives a downgrade. This bond is most likely a:", "opts": ["floating rate note.", "step-up coupon bond.", "credit-linked coupon bond."], "ans": "C", "expl": "A credit-linked bond has coupon payments that change as the bond's or issuer's credit rating changes. In this question, the coupon rate\nincreases by 30 bps every time the issuer credit rating deteriorates. Investors may be concerned about an issuer's (borrower's) future\ncreditworthiness, so credit-linked coupons compensate for this risk.\n(Choice A) Changes to a floating rate note's coupons are driven by movements in the underlying reference interest rate (eg, LIBOR), not by\nchanges in the issuer's credit rating.\n(Choice B) Step-up coupon bonds have coupon rates that increase (ie, \"step up\") on preset dates specified in the bond indenture. For example,\na step-up bond indenture may specify an increase of 20 bps every six months. These increases happen regardless of changes to the issuer's\ncredit rating.\nThings to remember:\nA credit-linked bond has coupon payments that change as the issuer's credit rating changes. If investors are concerned about an issuer's\n(borrower's) future creditworthiness, credit-linked coupons may be used to compensate for this risk.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}, {"n": 18, "q": "A floating-rate bond that has regularly scheduled increases in coupon rates and helps mitigate the impact of inflation on investors is most appropriately classified as a(n):", "opts": ["inflation-linked bond.", "step-up coupon bond.", "deferred coupon bond."], "ans": "B", "expl": "A step-up coupon bond may have either fixed or a floating coupon. The main characteristic of a step-up coupon bond is that the coupon rate\nincreases by a predetermined rate at specified intervals. Step-up bonds are often callable by the issuer just before a scheduled increase in the\ncoupon rate.\n(Choice A) An inflation-linked bond offers investors protection against inflation, but changes in the coupon rate are tied to changes in inflation\nrather than being regularly scheduled. Also, since inflation can go up or down, the coupon rates of inflation-linked bonds can change in both\ndirections; the coupon rates of step-up bonds can only increase, never decrease.\n(Choice C) Unlike a step-up bond, a bond with a deferred coupon pays no coupon interest early in its life and compensates investors with a\nhigher coupon rate in later years.\nThings to remember:\nThe coupon rate of a step-up bond increases by a predetermined rate at specified intervals. A step-up bond can offer investors some protection\nagainst inflation, but changes in its coupon rate are not based on changes in inflation. Unlike inflation-linked bonds, step-up bonds have coupon\nrates that only increase—instead of increasing and decreasing along with changes in inflation.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}, {"n": 19, "q": "50,000 bonds with a 15-year maturity were issued 10 years ago and are currently trading at 110. The indenture contains a sinking fund provision that retires 10% of the outstanding bonds every year for the next four years (starting now). If an investor bought 500 bonds at issuance, which of the following is the best outcome for the investor this year?", "opts": ["All bonds are redeemed.", "50 bonds are redeemed.", "No bonds are redeemed."], "ans": "C", "expl": "Sinking fund provision\nPredetermined schedule for retiring a portion of a bond\nissue prior to maturity\nExposes bondholders to:\nReinvestment risk\nGradually reduced credit risk\nA sinking fund arrangement details a schedule for gradually retiring a portion of a bond's principal. For the bondholder (ie, investor), this\nprovision can be either beneficial or detrimental, depending on the circumstance. A sinking fund gradually reduces credit risk by decreasing\nexposure to a specific bond issue. However, early principal repayment increases reinvestment risk since the proceeds must be reinvested at a\ndifferent—and perhaps lower—interest rate.\nSinking fund provisions typically operate on a lottery basis, with a predetermined quantity of bonds (eg, 10%) randomly selected based on a\nserial number or similar identifier. This sinking fund lottery creates a situation in which individual investors could have all, none, or any number of\ntheir bonds redeemed.\nIn this instance, with bonds trading at a large premium (ie, 110), a redemption at par (ie, 100) due to the sinking fund provision is detrimental for\nthe investor since the redeemed principal must now be reinvested at a lower interest rate. Therefore, the best outcome for the investor is to have\nnone of the 500 bonds redeemed (Choices A and B).\nThings to remember:\nA sinking fund arrangement details a schedule for gradually retiring a bond's principal. For the bondholder, this provision can reduce exposure to\ncredit risk but also increases reinvestment risk.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}, {"n": 20, "q": "For the bondholder, a sinking fund arrangement most likely results in:", "opts": ["more reinvestment risk.", "more exposure to credit risk.", "a larger balloon payment at maturity."], "ans": "A", "expl": "A sinking fund arrangement details a schedule for gradually retiring a bond's principal over time. The example above shows a plan to reduce\nprincipal by 10% annually after Year 5 and fully retire the bond in Year 15.\nFor the issuer (ie, borrower), a sinking fund provides a well-timed, disciplined approach to retiring debt. The typical fixed-rate bond has relatively\nsmall periodic interest obligations and a large terminal principal (ie, face value) obligation. An issuer who implements a sinking fund provision can\nease the payment schedule by reducing the principal early on, thus lowering the size of the terminal obligation (Choice C).\nFor the bondholder (ie, investor), this provision can be both beneficial and detrimental. A detailed plan for repaying principal reduces the investor's\nexposure to credit risk (Choice B). However, early principal repayment increases reinvestment risk since the proceeds must be reinvested at a\ndifferent—and perhaps lower—interest rate.\nThings to remember:\nA sinking fund arrangement details a schedule for gradually retiring a bond's principal over time. For the issuer (ie, borrower), a sinking fund\nprovides a well-timed, disciplined approach to retiring debt. For the bondholder (ie, investor), this provision can reduce exposure to credit risk but\nalso increase reinvestment risk.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}, {"n": 21, "q": "Which of the following statements concerning putable bonds is most accurate?", "opts": ["A put provision benefits the issuer when interest rates fall.", "A put provision benefits the bondholder when interest rates rise.", "A putable bond trades at a lower price than an otherwise similar option-free bond."], "ans": "B", "expl": "A putable bond contains a provision (ie, put provision) that gives the bondholder (ie, investor) the option to sell back the bond to the issuer at\na predetermined price prior to maturity. A bondholder may choose to exercise the put option (ie, put the bond back to the issuer) when interest\nrates rise since rising rates lower the bond's value (Choice A). This benefit may allow the bondholder to sell the bond at a predetermined price\nthat is higher than the market price and subsequently reinvest the proceeds at a higher interest rate.\nSince this benefit is bestowed on the bondholder, a putable bond is priced higher than an otherwise similar option-free bond and offers lower yields\n(Choice C). In effect, the bondholder pays a higher price to the issuer for the option to retire the bond early.\nThings to remember:\nA putable bond allows the bondholder to sell back the bond to the issuer at a predetermined price prior to maturity. This benefit is realized when\ninterest rates rise. As such, the bondholder pays a higher price and accepts a lower yield for the putable bond than for an otherwise similar option-\nfree bond.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}, {"n": 22, "q": "A company issues a callable 10-year corporate bond with the following characteristics: Corporate callable bond Comparable government bond Coupon (%) 5.00 3.50 Current YTM (%) 5.50 3.00 The bond has a make-whole provision with a 40-basis-point call spread. If this bond is called, the unpaid coupons and principal will be discounted at a rate closest to:", "opts": ["2.9%", "3.4%", "5.4%"], "ans": "B", "expl": "Make-whole call provision\nLump-sum payment is equal to the present value of all forgone\ncoupon and principal payments.\nLump-sum payment is discounted at the YTM of a predetermined\ncomparable government bond plus a spread.\nA call provision gives the issuer the option to buy back a bond before maturity. A make-whole call provision requires the issuer to make a lump-\nsum payment to bondholders that includes compensation for forgone coupon and principal payments and, thus, to make the bondholders\nwhole if the bond is called.\nThe lump-sum payment is calculated as the present value of all remaining future coupon and principal payments, discounted at a rate equal to\nthe YTM of a predetermined comparable government bond plus a spread. The make-whole call can typically be exercised at any time and the\npayment can never be less than par. A call provision is seldom used since the cost to the issuer is usually substantial, but the provision is included\nin the bond indenture to \"sweeten\" the deal and lower the issuer's borrowing cost.\nIn this scenario, the bond was issued with a 40-basis-point call spread (ie, 0.40%), which is added to the current 3.00% YTM of the referenced\ngovernment bond. Therefore, the present value of the lump sum payment would be discounted at a rate of 3.40%.\n(Choice A) 2.90% results from inappropriately using the difference in yields (ie, yield spread) between the corporate bond and the government\nbond (2.50%) and adding the make-whole call spread of 40 basis points.\n(Choice C) 5.40% results from inappropriately using the corporate coupon rate of 5.00% and adding the make-whole call spread of 40 basis\npoints.\nThings to remember:\nA make-whole call provision requires a bond issuer to make a lump-sum payment to bondholders that includes compensation for forgone coupon\nand principal payments if the bonds are called. The lump-sum payment is calculated as the present value of all remaining future coupon and\nprincipal payments discounted at a rate equal to the YTM of a predetermined comparable government bond plus a spread.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}, {"n": 23, "q": "The biggest determinant of market yields on US dollar-denominated emerging market sovereign debt issued in the Eurobond markets is:", "opts": ["euro interest rates.", "US dollar interest rates.", "the emerging market's domestic interest rates."], "ans": "B", "expl": "Eurobond market\nMarket Part of international bond market outside national markets' jurisdiction\nCurrency\nMajor currency (usually not issuer's domestic currency)\ndenomination\nIssuance currency's benchmark rate + Yield spread reflecting\nValuation\nissuer's credit risk and issue's liquidity risk\nThe market value of a bond is the PV of the coupon and principal amounts discounted by the appropriate market interest rate for the bond's\ncurrency denomination. An interest rate in the same currency must be used since it represents the opportunity cost of debt capital in that\ncurrency. The specific rate used to value the bond is based on the currency's benchmark (eg, government bond, interest rate swap) rate, adjusted\nfor any risk factors (eg, credit, liquidity) that are appropriate for the bond.\nA bond's market yield is the market discount rate used for valuing the bond's cash flows. Therefore, the market yield on US dollar-denominated\nemerging market sovereign debt, as in this case, is primarily determined by US dollar interest rates regardless of where the bonds are issued.\n(Choice A) Euro interest rates are used to value euro-denominated securities but have no direct effect on the value of bonds denominated in\nother currencies. The Eurobond market is a segment of the global fixed-income securities markets that consists of debt issued outside the\njurisdiction of any single country.\n(Choice C) An emerging market's domestic interest rates are the primary determinant of the country's sovereign debt yield if the bond is\ndenominated in that country's currency, regardless of where the debt is issued. However, in this scenario, the bonds are US dollar-denominated.\nThings to remember:\nThe market discount rate for valuing a bond must be in the same currency the bond is denominated in, since the rate represents opportunity cost\nas well as risk. So, the market yield on US dollar-denominated emerging market sovereign debt is primarily determined by US dollar interest\nrates.\nDescribe how legal, regulatory, and tax considerations affect the issuance and trading of fixed-income securities", "qhtml": null}, {"n": 24, "q": "Assuming there are no changes in the credit risk of the issuer, an increase in the volatility of interest rates will least likely have an impact on the price of a:", "opts": ["putable bond.", "callable bond.", "floating rate note."], "ans": "C", "expl": "The coupon rate of a floating rate note (FRN) is reset regularly and often, typically every three months, based on market rates. Therefore,\nincreased volatility in interest rates between coupon dates will not have much impact on the price of an FRN. If the issuer's credit quality has not\nchanged, the price of the bond is equal to par value at each reset.\nCallable and putable bonds have embedded call and put options. Whether those options are exercised depends on interest rates. A rise in\ninterest rate volatility increases the range of possible interest rates. With more possible outcomes, there is a higher probability that a bond's\noption will be exercised, which makes the option worth more.\nInterest rate volatility affects the prices of both callable and putable bonds. The price of a putable bond is the price of an otherwise identical\noption-free bond plus the value of the put option. As the put option increases in value, the price of the bond rises. The opposite applies for\ncallable bonds: An increase in the value of the call option reduces the price of the bond (Choices A and B).\nThings to remember:\nSince the coupon rate of a floating rate note (FRN) resets regularly and often, based on market rates, increased volatility in interest rates will not\nhave much impact on the price of the bond. Higher volatility in interest rates increases the value of both call and put options, which affects the\nprices of callable and putable bonds.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}, {"n": 25, "q": "A government agency issues a one-year, 3% coupon bond at par on June 30, 20X0. The bond is callable in whole or in part at: Call date Price September 30, 20X0 101.00 December 31, 20X0 100.50 March 31, 20X1 100.00 The call provision is best described as: ", "opts": ["Bermuda style.", "American style.", "European style."], "ans": "A", "expl": "Types of call provisions\nAmerican style Continuously callable: the issuer has the right to call at any time beginning on the call date until maturity\nEuropean style Only one call date, and the issuer can call bonds only on that date\nBermuda style Can be called on one of multiple call dates, but only on those dates\nA call provision allows the bond issuer to redeem a bond prior to its final maturity. This allowance exposes bondholders to reinvestment risk, as\nthe call provision is unlikely to be exercised unless yields are lower than when the bond was issued. To compensate for the call risk, investors\nrequire higher yields for callable bonds than for noncallable bonds.\nMost callable bonds have an initial call protection period during which the bonds cannot be called. Once the call protection period has passed, the\nbond is callable within the constraints of the embedded call provision. Specific call dates usually coincide with coupon payment dates.\nIn this scenario, the bond is callable on multiple specific dates and is, therefore, a Bermuda-style call rather than an American- or European-\nstyle call (Choices B and C). Bermuda-style calls often require a premium to par on the earliest call dates, which serves as a \"sweetener\" for the\nbondholder since it discourages the issuer from exercising the call provision early in the life of the bond.\nThings to remember:\nA call provision allows the bond issuer to redeem a bond prior to its final maturity. A Bermuda-style call provision has multiple call dates—but the\nbonds can be called only on specific dates, which usually coincide with coupon payment dates.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}];
const CFG = {"title": "Wiley · Fixed-Income Cash Flows and Types", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Fixed Income · 25 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
