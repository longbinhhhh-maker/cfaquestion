<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 17 — Equity Valuation - Applications and Processes · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>

  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}

  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}

  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->

<script>
const DATA = [{"n": 1, "q": "A valuation of a firm based on the current market price of its assets - liabilities is referred to as the firm's:", "opts": ["operating value.", "liquidation value.", "going-concern value."], "ans": "B", "expl": "The liquidation value is based on the assumption that the firm will cease to operate and all of its assets will be sold to repay liabilities.", "explhtml": "<p>The liquidation value is based on the assumption that the firm will cease to operate and all of its assets will be sold to repay liabilities.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.b<\/div><div class=\"qtext\"><p>A valuation of a firm based on the current market price of its assets - liabilities is referred to as the firm&#x27;s:<\/p><\/div>", "subj": "equity"}, {"n": 2, "q": "Which of the following two ratios are likely to be used for determining value as a function of company peer benchmarks?", "opts": ["Price-to-earnings and price-to-book.", "Price-to-sales and debt/equity.", "Return on equity and net profit margin."], "ans": "A", "expl": "Relative valuation looks at market-based ratios of comparable companies in the industry. Price-to-sales, price-to-book, price-to-earnings, and price-to-cash flow are examples of ratios used in relative valuation analysis.", "explhtml": "<p>Relative valuation looks at market-based ratios of comparable companies in the industry. Price-to-sales, price-to-book, price-to-earnings, and price-to-cash flow are examples of ratios used in relative valuation analysis.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.f<\/div><div class=\"qtext\"><p>Which of the following two ratios are likely to be used for determining value as a function of company peer benchmarks?<\/p><\/div>", "subj": "equity"}, {"n": 3, "q": "One justification for using multiple models to estimate firm value is:", "opts": ["the ability to streamline and economize the development process through repeated use of the same generic baseline.", "the ability to learn from each successive model and to make improvements.", "the ability to examine differences in estimated values can reveal how a model’s assumptions and the perspective of the analysis are affecting the estimated values."], "ans": "C", "expl": "One thing to remember with respect to choice of a valuation model is that the analyst does not have to consider only one. Using multiple models and examining differences in estimated values can reveal how a model's assumptions and the perspective of the analysis are affecting the estimated values.", "explhtml": "<p>One thing to remember with respect to choice of a valuation model is that the analyst does not have to consider only one. Using multiple models and examining differences in estimated values can reveal how a model&#x27;s assumptions and the perspective of the analysis are affecting the estimated values.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.h<\/div><div class=\"qtext\"><p>One justification for using multiple models to estimate firm value is:<\/p><\/div>", "subj": "equity"}, {"n": 4, "q": "Important considerations for choosing an appropriate approach for valuing a given company are least likely to include:", "opts": ["Is the model appropriate based on the quality and availability of input data?", "Is the model consistent with the investor's IPS?", "Is the model suitable given the purpose of the analysis?"], "ans": "B", "expl": "Important considerations when choosing a valuation model include: Does the model fit the characteristics of the company? Is the model suitable given the purpose of the analysis? Is the model appropriate based on the quality and availability of input data?", "explhtml": "<p>Important considerations when choosing a valuation model include:<\/p><p>Does the model fit the characteristics of the company?<\/p><p>Is the model suitable given the purpose of the analysis?<\/p><p>Is the model appropriate based on the quality and availability of input data?<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.h<\/div><div class=\"qtext\"><p>Important considerations for choosing an appropriate approach for valuing a given company are least likely to include:<\/p><\/div>", "subj": "equity"}, {"n": 5, "q": "The value of a conglomerate derived using a sum-of-the-parts valuation would least accurately be called the:", "opts": ["liquidation value.", "breakup value.", "private market value."], "ans": "A", "expl": "Sum-of-the-parts valuation totals the estimated values of each of the company's business divisions as independent going concerns. The value derived using a sum-of-the-parts valuation is also sometimes called the private market value or the breakup value, even when such a restructuring is not necessarily expected.", "explhtml": "<p>Sum-of-the-parts valuation totals the estimated values of each of the company&#x27;s business divisions as independent going concerns. The value derived using a sum-of-the-parts valuation is also sometimes called the private market value or the breakup value, even when such a restructuring is not necessarily expected.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.g<\/div><div class=\"qtext\"><p>The value of a conglomerate derived using a sum-of-the-parts valuation would least accurately be called the:<\/p><\/div>", "subj": "equity"}, {"n": 6, "q": "A valuation of a firm based on the assumption that the firm will continue to operate is referred to as its:", "opts": ["operating value.", "going-concern value.", "status quo value."], "ans": "B", "expl": "The going-concern value is based on the assumption that the firm will continue to operate and the firm's value is the present value of its future dividends.", "explhtml": "<p>The going-concern value is based on the assumption that the firm will continue to operate and the firm&#x27;s value is the present value of its future dividends.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.b<\/div><div class=\"qtext\"><p>A valuation of a firm based on the assumption that the firm will continue to operate is referred to as its:<\/p><\/div>", "subj": "equity"}, {"n": 7, "q": "Financial Analyst Davey Jarvis, CFA, is evaluating Laura's Chocolates, Inc., which processes nut-based toffee for world-wide distribution. Which of the following steps is Jarvis most likely to take as part of the top-down valuation process?", "opts": ["Evaluate price performance on an ongoing basis.", "Learn / understand the business.", "Perform momentum-based technical analysis."], "ans": "B", "expl": "The valuation process consists of 5 steps: 1. Understanding the business. 2. Forecasting company performance. 3. Selecting a valuation model. 4. Complete the valuation. 5. Decision making.", "explhtml": "<p>The valuation process consists of 5 steps:<\/p><p>1. Understanding the business. 2. Forecasting company performance. 3. Selecting a valuation model. 4. Complete the valuation. 5. Decision making.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.e<\/div><div class=\"qtext\"><p>Financial Analyst Davey Jarvis, CFA, is evaluating Laura&#x27;s Chocolates, Inc., which processes nut-based toffee for world-wide distribution. Which of the following steps is Jarvis most likely to take as part of the top-down valuation process?<\/p><\/div>", "subj": "equity"}, {"n": 8, "q": "How can we account for different valuations for the same firm from several analysts even if they use the same required returns?", "opts": ["Valuations are based on the analyst's expectations.", "The analysts may be biased with personal opinions about management.", "Valuation models contain random errors."], "ans": "A", "expl": "Valuation is based on expectations of future cash flows rather than known values. Each analyst will build expectations of cash flows from the fundamental data and from other factors, internal and external, that the analyst believes will affect the firm's performance.", "explhtml": "<p>Valuation is based on expectations of future cash flows rather than known values. Each analyst will build expectations of cash flows from the fundamental data and from other factors, internal and external, that the analyst believes will affect the firm&#x27;s performance.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.a<\/div><div class=\"qtext\"><p>How can we account for different valuations for the same firm from several analysts even if they use the same required returns?<\/p><\/div>", "subj": "equity"}, {"n": 9, "q": "An analyst performing an asset valuation to detect investor's expectations about the future value of the variables that affect a stock's price is most likely using the valuation for:", "opts": ["generating a fairness opinion.", "reading the market.", "projecting the value of corporate actions."], "ans": "B", "expl": "Asset valuation has many uses including stock selection, reading the market, projecting the value of corporate actions, issuing fairness opinions, and valuing private businesses. Reading the market entails detecting investor's expectations about the future value of the variables that affect a stock's price.", "explhtml": "<p>Asset valuation has many uses including stock selection, reading the market, projecting the value of corporate actions, issuing fairness opinions, and valuing private businesses. Reading the market entails detecting investor&#x27;s expectations about the future value of the variables that affect a stock&#x27;s price.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.d<\/div><div class=\"qtext\"><p>An analyst performing an asset valuation to detect investor&#x27;s expectations about the future value of the variables that affect a stock&#x27;s price is most likely using the valuation for:<\/p><\/div>", "subj": "equity"}, {"n": 10, "q": "Which of the following least accurately represents one of the primary steps of the equity valuation process described by Pinto, Henry, Robinson, and Stowe?", "opts": ["Selecting a valuation model.", "Decision making.", "Assessing corporate governance."], "ans": "C", "expl": "The valuation process described by Pinto, Henry, Robinson, and Stowe consists of 5 steps: 1. Understanding the business. 2. Forecasting company performance. 3. Selecting a valuation model. 4. Complete a valuation. 5. Decision making. Corporate governance is important, but is not one of the primary steps.", "explhtml": "<p>The valuation process described by Pinto, Henry, Robinson, and Stowe consists of 5 steps:<\/p><p>1. Understanding the business. 2. Forecasting company performance. 3. Selecting a valuation model. 4. Complete a valuation. 5. Decision making.<\/p><p>Corporate governance is important, but is not one of the primary steps.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.e<\/div><div class=\"qtext\"><p>Which of the following least accurately represents one of the primary steps of the equity valuation process described by Pinto, Henry, Robinson, and Stowe?<\/p><\/div>", "subj": "equity"}, {"n": 11, "q": "Notes to financial statements contain:", "opts": ["discussion of the firm's accounting practices and basis of presentation.", "a description of the firm’s financial condition and future prospects.", "important information about the firm's accounting practices and basis of presentation."], "ans": "C", "expl": "A number of important disclosures regarding a firm's accounting practices and the basis on which income and expense are recognized are contained in the footnotes to the financial statements. An overview by management of the company's past, present, and future can be found in the Management discussion and analysis (MD&A) section of a financial statement.", "explhtml": "<p>A number of important disclosures regarding a firm&#x27;s accounting practices and the basis on which income and expense are recognized are contained in the footnotes to the financial statements. An overview by management of the company&#x27;s past, present, and future can be found in the Management discussion and analysis (MD&amp;A) section of a financial statement.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.e<\/div><div class=\"qtext\"><p>Notes to financial statements contain:<\/p><\/div>", "subj": "equity"}, {"n": 12, "q": "The goal of asset valuation, based on the expected future cash flows of an asset, is to establish an asset's:", "opts": ["relative value.", "intrinsic value.", "market value."], "ans": "B", "expl": "Asset valuation based on the expected future cash flows is utilized to estimate an asset's intrinsic value, or the value derived from the asset's investment characteristics.", "explhtml": "<p>Asset valuation based on the expected future cash flows is utilized to estimate an asset&#x27;s intrinsic value, or the value derived from the asset&#x27;s investment characteristics.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.a<\/div><div class=\"qtext\"><p>The goal of asset valuation, based on the expected future cash flows of an asset, is to establish an asset&#x27;s:<\/p><\/div>", "subj": "equity"}, {"n": 13, "q": "What are three factors that would make a firm's accounting earnings less of a gauge of future economic performance? Late filings, unusually:", "opts": ["high amounts of loans to company insiders, and short tenure of senior management.", "low amounts of loans to company insiders, and short tenure of senior management.", "high amounts of loans to company insiders, and long tenure of senior management."], "ans": "A", "expl": "Quality of earnings looks at the relationship between accounting earnings and economic profit potential of the firm. An analyst is concerned about anything that would render accounting earnings less useful as a gauge of the firm's future expected economic earnings. Warning signals include late filings, unusually high amounts of loans to company insiders, and short tenure of senior management.", "explhtml": "<p>Quality of earnings looks at the relationship between accounting earnings and economic profit potential of the firm. An analyst is concerned about anything that would render accounting earnings less useful as a gauge of the firm&#x27;s future expected economic earnings. Warning signals include late filings, unusually high amounts of loans to company insiders, and short tenure of senior management.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.e<\/div><div class=\"qtext\"><p>What are three factors that would make a firm&#x27;s accounting earnings less of a gauge of future economic performance? Late filings, unusually:<\/p><\/div>", "subj": "equity"}, {"n": 14, "q": "Which of the following is NOT a use of asset valuation?", "opts": ["Issuing fairness opinions.", "Projecting the value of corporate actions.", "Estimating inflation rates."], "ans": "C", "expl": "Asset valuation has many uses including stock selection, reading the market, projecting the value of corporate actions, issuing fairness opinions, and valuing private businesses. Asset valuation is not used to project inflation rates.", "explhtml": "<p>Asset valuation has many uses including stock selection, reading the market, projecting the value of corporate actions, issuing fairness opinions, and valuing private businesses. Asset valuation is not used to project inflation rates.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.d<\/div><div class=\"qtext\"><p>Which of the following is NOT a use of asset valuation?<\/p><\/div>", "subj": "equity"}, {"n": 15, "q": "A valuation of a firm based on the comparison of the firm with the market value of other firms is known as a:", "opts": ["relative valuation.", "comparison valuation.", "peer group valuation."], "ans": "A", "expl": "A relative valuation is a valuation based on comparing the firm to other firms with similar characteristics. Market multiples are commonly used as the basis of relative valuations.", "explhtml": "<p>A relative valuation is a valuation based on comparing the firm to other firms with similar characteristics. Market multiples are commonly used as the basis of relative valuations.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.f<\/div><div class=\"qtext\"><p>A valuation of a firm based on the comparison of the firm with the market value of other firms is known as a:<\/p><\/div>", "subj": "equity"}, {"n": 16, "q": "A comparison between a firm's going-concern valuation and its liquidation value will show that the going-concern value will always be:", "opts": ["equal to the present value of the expected continued operation of the firm.", "greater than the liquidation value.", "less than the liquidation value."], "ans": "A", "expl": "It is not possible to state the relationship between the going-concern value and the liquidation value without examining the prospects for the firm and the current value of the assets. The going-concern value is equal to the present value of the expected dividends arising from continued operation.", "explhtml": "<p>It is not possible to state the relationship between the going-concern value and the liquidation value without examining the prospects for the firm and the current value of the assets. The going-concern value is equal to the present value of the expected dividends arising from continued operation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.b<\/div><div class=\"qtext\"><p>A comparison between a firm&#x27;s going-concern valuation and its liquidation value will show that the going-concern value will always be:<\/p><\/div>", "subj": "equity"}, {"n": 17, "q": "Valuation models for equities contain estimates of required returns and:", "opts": ["expected future cash flows.", "an assumed continuation of past cash flows.", "known future cash flows."], "ans": "A", "expl": "Valuation models used for equities require the analyst to estimate the required return applicable to the investment and to develop an expectation of future cash flows. While cash flows for fixed-income investments are stated, no such definition is available for equities.", "explhtml": "<p>Valuation models used for equities require the analyst to estimate the required return applicable to the investment and to develop an expectation of future cash flows. While cash flows for fixed-income investments are stated, no such definition is available for equities.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.a<\/div><div class=\"qtext\"><p>Valuation models for equities contain estimates of required returns and:<\/p><\/div>", "subj": "equity"}, {"n": 18, "q": "Which of the following is least likely a use of equity valuation?", "opts": ["Projecting the value of corporate actions.", "Assessing corporate governance.", "Issuing fairness opinions."], "ans": "B", "expl": "Equity valuation has many uses including stock selection, reading the market, projecting the value of corporate actions, issuing fairness opinions, and valuing private businesses. Equity valuation is not specifically related to corporate governance.", "explhtml": "<p>Equity valuation has many uses including stock selection, reading the market, projecting the value of corporate actions, issuing fairness opinions, and valuing private businesses. Equity valuation is not specifically related to corporate governance.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.d<\/div><div class=\"qtext\"><p>Which of the following is least likely a use of equity valuation?<\/p><\/div>", "subj": "equity"}, {"n": 19, "q": "Consider the steps in the top down valuation approach as it is applicable for Gold Star. Dentice should forecast the growth of:", "opts": ["each firm in the oil industry, the growth rate of the oil industry, and the growth rate of the economy.", "Gold Star, the growth of the oil industry, and then the growth of the overall economy.", "the overall economy, growth of the industry, and the growth rate of Gold Star."], "ans": "C", "expl": "The top down model for valuation would begin with analysis of the overall economy and the expectation of the growth rate in the economy. Further, the impact of the expected growth rate of the economy on the oil industry needs to be ascertained. The second component is the analysis of the oil industry in which Gold Star operates. That involves the determination of the competitive forces in the industry and the future threats and opportunities faced by the industry. It also determines the variables that determine the future profitability of the entire oil industry. The analyst then forms future expectations of these variables given the expectations about the overall economy. The expectations of variables determining the growth and profitability of the oil industry are then used to determine the expectations of the overall growth of Gold Star. In the company analysis, the analyst reviews the quality of earnings, financial ratios, management and intangibles to ascertain the growth prospects for the company. The analyst then selects an appropriate model to value the company. Assumptions used in the valuation must be clearly spelled out and updated to reflect new information.", "explhtml": "<p>The top down model for valuation would begin with analysis of the overall economy and the expectation of the growth rate in the economy. Further, the impact of the expected growth rate of the economy on the oil industry needs to be ascertained. The second component is the analysis of the oil industry in which Gold Star operates. That involves the determination of the competitive forces in the industry and the future threats and opportunities faced by the industry. It also determines the variables that determine the future profitability of the entire oil industry. The analyst then forms future expectations of these variables given the expectations about the overall economy. The expectations of variables determining the growth and profitability of the oil industry are then used to determine the expectations of the overall growth of Gold Star. In the company analysis, the analyst reviews the quality of earnings, financial ratios, management and intangibles to ascertain the growth prospects for the company. The analyst then selects an appropriate model to value the company. Assumptions used in the valuation must be clearly spelled out and updated to reflect new information.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 19–21<\/div> <div class=\"pp-topic\">Module 17.1, LOS 17.e<\/div><div class=\"kq-note\">Câu thuộc item set (câu 19–21). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Consider the steps in the top down valuation approach as it is applicable for Gold Star. Dentice should forecast the growth of:<\/p><\/div>", "subj": "equity"}, {"n": 20, "q": "Which of the following models would be most suitable to value Gold Star?", "opts": ["Absolute valuation.", "Relative valuation.", "Liquidation value."], "ans": "A", "expl": "Absolute valuation models or intrinsic value models such as the dividend growth rate model and the free cash flow model value a company independent of peer valuation. The valuation is based on the present value of cash-flows for the specific company. Relative valuation models such as P/E ratio compare the earnings multiple to that of similar companies to make a judgment about the valuation. If the P/E ratio is higher than peer company P/E ratio, it is said to be overvalued. Conversely, if the P/E ratio is lower than peer company P/E ratio, it is said to be undervalued. Caution should be taken to make sure that peer companies are indeed comparable. For the valuation of Gold Star, absolute valuation would be suitable since it is closely held and hence market valuation is not available.", "explhtml": "<p>Absolute valuation models or intrinsic value models such as the dividend growth rate model and the free cash flow model value a company independent of peer valuation. The valuation is based on the present value of cash-flows for the specific company. Relative valuation models such as P/E ratio compare the earnings multiple to that of similar companies to make a judgment about the valuation. If the P/E ratio is higher than peer company P/E ratio, it is said to be overvalued. Conversely, if the P/E ratio is lower than peer company P/E ratio, it is said to be undervalued. Caution should be taken to make sure that peer companies are indeed comparable. For the valuation of Gold Star, absolute valuation would be suitable since it is closely held and hence market valuation is not available.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 19–21<\/div> <div class=\"pp-topic\">Module 17.1, LOS 17.e<\/div><div class=\"qtext\"><p>Which of the following models would be most suitable to value Gold Star?<\/p><\/div>", "subj": "equity"}, {"n": 21, "q": "Which discounts must be taken into account while valuing the investment opportunity? Joe should take into account the:", "opts": ["marketability, liquidity, and minority discounts in the valuation.", "marketability, liquidity, and majority discounts in the valuation.", "marketability, liquidity, and control premium in the valuation."], "ans": "A", "expl": "Since Gold Star is closely held, the investment is not easily marketable. Closely linked is the fact that the investment cannot be easily liquidated and the cost of selling the investment needs to be discounted from the value. Finally, since only 5% of the stock is being invested in, the control of the operations of the company still remains with the majority shareholders. This lack of control needs to be quantified and discounted from Gold Star's valuation.", "explhtml": "<p>Since Gold Star is closely held, the investment is not easily marketable. Closely linked is the fact that the investment cannot be easily liquidated and the cost of selling the investment needs to be discounted from the value. Finally, since only 5% of the stock is being invested in, the control of the operations of the company still remains with the majority shareholders. This lack of control needs to be quantified and discounted from Gold Star&#x27;s valuation.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 19–21<\/div> <div class=\"pp-topic\">Module 17.1, LOS 17.e<\/div><div class=\"qtext\"><p>Which discounts must be taken into account while valuing the investment opportunity? Joe should take into account the:<\/p><\/div>", "subj": "equity"}, {"n": 22, "q": "Why is the introductory paragraph in Article One incorrect?", "opts": ["Most analysts believe that at some point intrinsic and market value will converge.", "The harder intrinsic value is to estimate the greater the potential divergence of market and intrinsic value.", "Markets cannot be constantly informationally efficient as this would mean that intrinsic and market price would always be identical."], "ans": "B", "expl": "Intrinsic value is the valuation of an asset by someone who has a perfect understanding of the asset or the firm. Intrinsic value is therefore the theoretical value the stock would take if it were perfectly valued and stock price contained all relevant information. The harder it is to establish the intrinsic value the bigger the potential divergence between market price and intrinsic value.", "explhtml": "<p>Intrinsic value is the valuation of an asset by someone who has a perfect understanding of the asset or the firm. Intrinsic value is therefore the theoretical value the stock would take if it were perfectly valued and stock price contained all relevant information. The harder it is to establish the intrinsic value the bigger the potential divergence between market price and intrinsic value.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 22–26<\/div> <div class=\"pp-topic\">Module 17.1, LOS 17.a<\/div><div class=\"kq-note\">Câu thuộc item set (câu 22–26). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Why is the introductory paragraph in Article One incorrect?<\/p><\/div>", "subj": "equity"}, {"n": 23, "q": "Using Heller's suggestion of an analyst intrinsic value which is $1.20 too high in the illustrative example for Article One, calculate the valuation error and the actual mispricing: Valuation error  Actual mispricing", "opts": ["$1.20 $0.15", "$1.35 $0.15", "$0.15 $1.20"], "ans": "A", "expl": "Valuation error = IVanalyst – IVactual = 1.20 Actual mispricing = IVactual – price = (25.20 – 1.20) – 23.85 = 0.15", "explhtml": "<p>Valuation error = IV<sub>analyst<\/sub> – IV<sub>actual<\/sub> = 1.20<\/p><p>Actual mispricing = IV<sub>actual<\/sub> – price = (25.20 – 1.20) – 23.85 = 0.15<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 22–26<\/div> <div class=\"pp-topic\">Module 17.1, LOS 17.a<\/div><div class=\"qtext\"><p>Using Heller&#x27;s suggestion of an analyst intrinsic value which is $1.20 too high in the illustrative example for Article One, calculate the valuation error and the actual mispricing: Valuation error &nbsp; Actual mispricing<\/p><\/div>", "subj": "equity"}, {"n": 24, "q": "In response to Heller's point regarding the Linpan discussion in Article Two, which of the following correctly identifies the suggested valuation method?", "opts": ["Going Concern Valuation.", "Liquidation Value.", "Orderly Liquidation Value."], "ans": "C", "expl": "The proceeds raised by selling assets over a longer period of time are likely to be larger than those raised in a rapid forced \"fire sale.\" Hence, the term Orderly Liquidation Value is often used to differentiate from a forced liquidation value.", "explhtml": "<p>The proceeds raised by selling assets over a longer period of time are likely to be larger than those raised in a rapid forced &quot;fire sale.&quot; Hence, the term Orderly Liquidation Value is often used to differentiate from a forced liquidation value.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 22–26<\/div> <div class=\"pp-topic\">Module 17.1, LOS 17.b<\/div><div class=\"qtext\"><p>In response to Heller&#x27;s point regarding the Linpan discussion in Article Two, which of the following correctly identifies the suggested valuation method?<\/p><\/div>", "subj": "equity"}, {"n": 25, "q": "In the Toys to You Inc. (TTY) discussion in Article Two, which of the following would be the most appropriate conclusion for the writer to add?", "opts": ["TTY is attempting a strategy of product differentiation by committing to high quality products but appears to be failing as revenues are lower than its competitors.", "TTY is attempting a strategy of cost leadership by keeping prices equal to or lower than its competitors but appears to be failing as margins are lower than its competitor’s.", "TTY is attempting a strategy of cost leadership by producing with the lowest cost base but appears to be failing as margins are lower than its competitor’s."], "ans": "C", "expl": "Product differentiation involves adding product features or services that increase the attractiveness of the firm's product. There is no suggestion that TTY is attempting to do this. Cost leadership is a bid to produce at the lowest cost, a strategy that is evident from the chairperson's statement. However, it has resulted in a margin of only 13.9% compared to the competitor's 15.4%.", "explhtml": "<p>Product differentiation involves adding product features or services that increase the attractiveness of the firm&#x27;s product. There is no suggestion that TTY is attempting to do this.<\/p><p>Cost leadership is a bid to produce at the lowest cost, a strategy that is evident from the chairperson&#x27;s statement. However, it has resulted in a margin of only 13.9% compared to the competitor&#x27;s 15.4%.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 22–26<\/div> <div class=\"pp-topic\">Module 17.1, LOS 17.e<\/div><div class=\"qtext\"><p>In the Toys to You Inc. (TTY) discussion in Article Two, which of the following would be the most appropriate conclusion for the writer to add?<\/p><\/div>", "subj": "equity"}, {"n": 26, "q": "Which of the following would not be an example of one of Michael Porter's 5 competitive forces applicable to Toys to You?", "opts": ["A new chain of toy stores, Games & Goodies, has opened up in key Toys to You territories.", "Toys to You’s biggest supplier have ‘due to unforeseen market conditions’ added a 15% premium to key product lines.", "Due to cash flow issues Toys to You have been forced to halve the marketing and advertising budget compared to the previous financial year."], "ans": "C", "expl": "Porter's Five Forces include risk of new entrants (A), supplier power (B), customer power, established rivals, and the risk of substitute offerings. Marketing and advertising budgetary constraints are not relevant.", "explhtml": "<p>Porter&#x27;s Five Forces include risk of new entrants (A), supplier power (B), customer power, established rivals, and the risk of substitute offerings. Marketing and advertising budgetary constraints are not relevant.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 22–26<\/div> <div class=\"pp-topic\">Module 17.1, LOS 17.e<\/div><div class=\"qtext\"><p>Which of the following would not be an example of one of Michael Porter&#x27;s 5 competitive forces applicable to Toys to You?<\/p><\/div>", "subj": "equity"}, {"n": 27, "q": "For an analyst valuing public equities, the relevant concept of value is most likely to be:", "opts": ["fair market value.", "orderly liquidation value.", "intrinsic value."], "ans": "C", "expl": "For an analyst valuing public equities, the most relevant definition of value is generally intrinsic value. A value based on a going-concern assumption, rather than a liquidation assumption, is the appropriate choice for a company that will continue to produce and sell goods. Fair market value is the most relevant definit pecific characteristics without regard to the market prices of other firms.", "explhtml": "<p>An absolute valuation approach attempts to determine the value of the firm based on its specific characteristics without regard to the market prices of other firms.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.f<\/div><div class=\"qtext\"><p>A valuation of a firm based on the intrinsic value of the firm&#x27;s investment characteristics is known as an:<\/p><\/div>", "subj": "equity"}, {"n": 33, "q": "A valuation of a firm based on a review of other firms' price to earnings, price to sales, and price to return on investment ratios is an example of a:", "opts": ["relative valuation.", "broad-based valuation.", "fundamental valuation."], "ans": "A", "expl": "An approach using market multiples to establish the value of the subject firm in relation to similar firms is an example of a relative valuation approach.", "explhtml": "<p>An approach using market multiples to establish the value of the subject firm in relation to similar firms is an example of a relative valuation approach.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.f<\/div><div class=\"qtext\"><p>A valuation of a firm based on a review of other firms&#x27; price to earnings, price to sales, and price to return on investment ratios is an example of a:<\/p><\/div>", "subj": "equity"}, {"n": 34, "q": "Which of the following would cause an analyst to have concern about a firm's quality of earnings?", "opts": ["A firm books sales when orders are shipped.", "The firm took a write off for a recently impaired asset.", "The gain on the sale of a plant was included in operating earnings."], "ans": "C", "expl": "The inclusion of gains from the sale of assets as operating income would cause the analyst to question the quality of the firm's earnings.", "explhtml": "<p>The inclusion of gains from the sale of assets as operating income would cause the analyst to question the quality of the firm&#x27;s earnings.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.e<\/div><div class=\"qtext\"><p>Which of the following would cause an analyst to have concern about a firm&#x27;s quality of earnings?<\/p><\/div>", "subj": "equity"}, {"n": 35, "q": "Overestimating the growth rate of a firm in using a valuation model would result in a value that is likely to be:", "opts": ["can't tell from this information.", "too high.", "too low."], "ans": "B", "expl": "Using an estimate for a firm's growth rate that is too high would overstate the amount of future returns, resulting in a present value that is too high.", "explhtml": "<p>Using an estimate for a firm&#x27;s growth rate that is too high would overstate the amount of future returns, resulting in a present value that is too high.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.e<\/div><div class=\"qtext\"><p>Overestimating the growth rate of a firm in using a valuation model would result in a value that is likely to be:<\/p><\/div>", "subj": "equity"}, {"n": 36, "q": "The present value of expected future cash flows is the firm's:", "opts": ["terminal value.", "liquidation value.", "going-concern value."], "ans": "C", "expl": "Going-concern value is the present worth of expected future cash flows generated by a business.", "explhtml": "<p>Going-concern value is the present worth of expected future cash flows generated by a business.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.b<\/div><div class=\"qtext\"><p>The present value of expected future cash flows is the firm&#x27;s:<\/p><\/div>", "subj": "equity"}, {"n": 37, "q": "Liquidation value is the:", "opts": ["cash generated by terminating a business, selling its assets, and repaying liabilities.", "market value of the total assets less the market value of the total liabilities.", "present value of future cash flow less the possible liquidation cost."], "ans": "A", "expl": "Liquidation value is the cash generated by terminating a business, selling all of its assets, and repaying liabilities.", "explhtml": "<p>Liquidation value is the cash generated by terminating a business, selling all of its assets, and repaying liabilities.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.b<\/div><div class=\"qtext\"><p>Liquidation value is the:<\/p><\/div>", "subj": "equity"}, {"n": 38, "q": "Minority shareholders often do not have control of the price at which the firm will be sold or merged with another firm. In order to safeguard their interests, minority shareholders will often seek an analyst's opinion of the value of the firm. This opinion is referred to as a:", "opts": ["second opinion.", "fairness opinion.", "minority opinion."], "ans": "B", "expl": "Minority shareholders are often dependent upon an analyst's opinion about the fairness of a price to be received. Hence the term fairness opinion.", "explhtml": "<p>Minority shareholders are often dependent upon an analyst&#x27;s opinion about the fairness of a price to be received. Hence the term fairness opinion.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.d<\/div><div class=\"qtext\"><p>Minority shareholders often do not have control of the price at which the firm will be sold or merged with another firm. In order to safeguard their interests, minority shareholders will often seek an analyst&#x27;s opinion of the value of the firm. This opinion is referred to as a:<\/p><\/div>", "subj": "equity"}, {"n": 39, "q": "A wise analyst will examine a valuation to determine:", "opts": ["ways to enhance a client's valuation.", "how well it will be received by the firm's management.", "its sensitivity to changes in expectations."], "ans": "C", "expl": "The results of valuation models can be very sensitive to changes in the expectations incorporated in the model. Analysis of a valuation's sensitivity to the expectations and a review of the confidence the analyst has in the expectations may lead to the use of a valuation range rather than a pin-point value.", "explhtml": "<p>The results of valuation models can be very sensitive to changes in the expectations incorporated in the model. Analysis of a valuation&#x27;s sensitivity to the expectations and a review of the confidence the analyst has in the expectations may lead to the use of a valuation range rather than a pin-point value.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 17.1, LOS 17.a<\/div><div class=\"qtext\"><p>A wise analyst will examine a valuation to determine:<\/p><\/div>", "subj": "equity"}];
const CFG = {"title": "Reading 17 — Equity Valuation - Applications and Processes", "subtitle": "CFA Level II · 39 câu · Kaplan Schweser QBank 2025 (31 câu đơn · 8 câu item set)", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>

(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

    if(e.target.closest(".bp-x")||e.target.closest(".bp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>
<!--baii-calc-end-->

<!--restart-confirm-start-->
<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
</body>
