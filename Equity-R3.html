<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "In behavioral finance theory, loss aversion is most accurately defined as asserting that for\ngains and losses of equal amounts, investors:", "opts": ["dislike losses more than they like gains.", "dislike for losses and like for gains are proportionate.", "like gains more than they dislike losses."], "ans": "A", "expl": "Behavioral finance proposes that investors are loss averse. Loss aversion means investors\ndislike losses more than they like gains of the same amount.\n(Module 41.1, LOS 41.g)"}, {"n": 2, "q": "The value of an asset that a rational investor with full knowledge about the asset's\ncharacteristics would willingly pay is best described as the asset's:", "opts": ["intrinsic value.", "market value.", "theoretical value."], "ans": "A", "expl": "Intrinsic value is the price a rational investor with full knowledge about an asset's\ncharacteristics would willingly pay for the asset.\n(Module 41.1, LOS 41.b)"}, {"n": 3, "q": "Behavioral finance theory suggests that investors tend to:", "opts": ["mimic the actions of better-informed investors.", "underestimate their ability to analyze security information.", "be more risk averse with respect to gains than with respect to losses."], "ans": "A", "expl": "Mimicking the actions of better-informed investors is an example of herding behavior.\nBehavioral finance suggests investors are more risk averse with respect to losses than\ngains and tend to overestimate their ability to analyze security information.\n(Module 41.1, LOS 41.g)"}, {"n": 4, "q": "Which of the following statements concerning market efficiency is least accurate?", "opts": ["If weak-form market efficiency holds, technical analysis cannot be used to earn abnormal returns over the long-run.", "Tests of the semi-strong form of the EMH require that security returns be risk- adjusted using a market model.", "Market efficiency assumes that individual market participants correctly estimate asset prices."], "ans": "C", "expl": "Market efficiency does not assume that individual market participants correctly estimate\nasset prices, but does assume that their estimates are unbiased. That is, some agents will\nover-estimate and some will under-estimate, but they will be correct, on average.\n(Module 41.1, LOS 41.e)"}, {"n": 5, "q": "Which of the following forms of the EMH assumes that no group of investors has\nmonopolistic access to relevant information?", "opts": ["Both weak and semistrong form.", "Strong-form.", "Weak-form."], "ans": "B", "expl": "According to the strong-form EMH, security prices reflect all information, which includes\nthe privately available (monopolistic) information.\n(Module 41.1, LOS 41.d)"}, {"n": 6, "q": "The opportunity to take advantage of the downward pressure on stock prices that result\nfrom end-of-the-year tax selling is known as the:", "opts": ["end-of-the-year anomaly.", "January anomaly.", "end-of-the-year effect."], "ans": "B", "expl": "The January Anomaly is most likely the result of tax induced trading at year end. An\ninvestor can profit by buying stocks in December and selling them during the first week in\nJanuary.\n(Module 41.1, LOS 41.f)"}, {"n": 7, "q": "Which of the following statements on the forms of the efficient market hypothesis (EMH) is\nleast accurate?", "opts": ["The strong-form EMH assumes market prices reflect all public and private information.", "The semi-strong form EMH assumes market prices reflect all public information.", "The weak-form EMH assumes market prices reflect current public market information and expectations."], "ans": "C", "expl": "The weak-form EMH assumes the price of a security reflects all historical price and volume\ninformation.\nThe other statements are true. The semi-strong form EMH assumes market prices reflect\nall public information. The strong-form EMH states that stock prices reflect all types of\ninformation: market, non-public market, and private.\n(Module 41.1, LOS 41.d)"}, {"n": 8, "q": "In an informationally efficient market:", "opts": ["buying and holding a broad market portfolio is the preferred investment strategy.", "share prices adjust rapidly when companies announce results in line with expectations.", "the conditions exist for active investment strategies to achieve superior risk- adjusted returns."], "ans": "A", "expl": "If financial markets are informationally efficient, active investment strategies cannot\nconsistently achieve risk-adjusted returns superior to holding a passively managed index\nportfolio. In addition, a passive investment strategy has lower transactions costs than an\nactive management strategy. Share prices should not adjust when a company announces\nresults in line with expectations in an informationally efficient market, because the market\nprice already reflects the expected results.\n(Module 41.1, LOS 41.a)"}, {"n": 9, "q": "The weak form of the efficient market hypothesis (EMH) implies that:", "opts": ["no one can achieve abnormal returns using market information.", "insiders, such as specialists and corporate board members, cannot achieve abnormal returns on average.", "investors cannot achieve abnormal returns, on average, using technical analysis, after adjusting for transaction costs and taxes."], "ans": "C", "expl": "The weak form of the EMH implies that an investor cannot earn positive abnormal returns\non average using technical analysis (market information), after adjusting for transaction\ncosts and taxes. Evidence has shown that insiders can achieve positive abnormal returns\non average, but this relates to the strong form of the EMH.\n(Module 41.1, LOS 41.e)"}, {"n": 10, "q": "A market's efficiency is most likely to decrease by:", "opts": ["high volumes of trading activity.", "a ban on short selling.", "substantial analyst coverage of exchange-listed companies."], "ans": "B", "expl": "Short selling helps to prevent market prices from becoming overvalued, while limiting\nshort selling has the opposite effect. More analyst coverage and more liquidity (high\ntrading volume) contribute to market efficiency.\n(Module 41.1, LOS 41.c)"}, {"n": 11, "q": "Investor overreaction that has been documented in securities markets is most likely\nattributable to investors exhibiting:", "opts": ["conservatism.", "loss aversion.", "risk aversion."], "ans": "B", "expl": "Loss aversion refers to the tendency for investors to dislike downside risks more than\nupside risks creating asymmetrical risk preferences. This dislike of losses may be a cause\nof investor overreaction. The standard economic notion of risk aversion assumes\nsymmetric risk preferences. Conservatism is the behavioral bias whereby investors react\nslowly to new information and is unlikely to cause overreaction.\n(Module 41.1, LOS 41.g)"}, {"n": 12, "q": "A stock is said to be undervalued if its market price is:", "opts": ["greater than its intrinsic value.", "less than its book value.", "less than its intrinsic value."], "ans": "C", "expl": "A security with a market price less than its intrinsic value is undervalued.\n(Module 41.1, LOS 41.b)"}, {"n": 13, "q": "Tom Edwin, CFA, states, \"Individuals exhibit biases, such as loss aversion and herding, that\nresult in observed pricing anomalies in financial markets. However, a strategy based on\nexploiting these anomalies will not earn positive abnormal returns over time.\" With regard to\nthe efficient markets and behavioral finance views of market pricing, Edwin's statement is\nmost likely consistent with:", "opts": ["behavioral finance, but not informationally efficient markets.", "neither behavioral finance nor informationally efficient markets.", "both behavioral finance and informationally efficient markets."], "ans": "C", "expl": "Edwin's statement is consistent with both behavioral finance and informationally efficient\nmarkets. While behavioral biases that cause individuals to act irrationally can cause assets\nto be mispriced, markets can still be considered efficient if asset mispricing cannot\nconsistently be exploited to earn positive risk-adjusted returns on average over time.\n(Module 41.1, LOS 41.g)"}, {"n": 14, "q": "Hume Inc. announces fourth quarter earnings per share of $1.20, which is 15% higher than\nlast year. Hume's earnings are equal to the consensus analyst forecast for the quarter.\nAssuming markets are efficient, the announcement will most likely cause the price of Hume's\nstock to:", "opts": ["decrease.", "increase.", "remain the same."], "ans": "C", "expl": "An efficient capital market would price Hume's stock based on the expectation for\nearnings per share. Since actual earnings equal expected earnings, the stock price should\nnot change as a result of the announcement.\n(Module 41.1, LOS 41.a)"}, {"n": 15, "q": "David Farrington is an analyst at Farrington Capital Management. He is aware that many\npeople believe that the capital markets are fully efficient. However, he is not convinced and\nwould like to disprove this claim. Which of the following statements would support\nFarrington in his effort to demonstrate the limitations to fully efficient markets?", "opts": ["Processing new information entails costs and takes at least some time, so security prices are not always immediately affected.", "Stock prices adjust to their new efficient levels within hours of the release of new information.", "Technical analysis has been rendered useless by many academics who have shown that analyzing market trends, past volume and trading data will not lead to abnormal returns."], "ans": "A", "expl": "If market prices are efficient there are no returns to the time and effort spent on\nfundamental analysis. But if no time and effort is spent on fundamental analysis there is\nno process for making market prices efficient. To resolve this apparent conundrum one\ncan look to the time lag between the release of new value-relevant information and the\nadjustment of market prices to their new efficient levels. Processing new information\nentails costs and takes at least some time, which is a limitation of fully efficient markets.\n(Module 41.1, LOS 41.e)"}, {"n": 16, "q": "The idea that uninformed traders, when faced with unclear information, observe the actions\nof informed traders to make decisions, is referred to as:", "opts": ["herding behavior.", "information cascades.", "narrow framing."], "ans": "B", "expl": "\"Information cascades\" refers to uninformed traders watching the actions of informed\ntraders when making investment decisions. Herding behavior is when trading occurs in\nclusters, not necessarily driven by information. Narrow framing refers to investors viewing\nevents in isolation.\n(Module 41.1, LOS 41.g)"}, {"n": 17, "q": "An efficient capital market:", "opts": ["fully reflects all of the information currently available about a given security, excluding risk.", "fully reflects all of the information currently available about a given security, including risk.", "does not fully reflect all of the information currently available about a given security, including risk."], "ans": "B", "expl": "An efficient capital market fully reflects all of the information currently available about a\ngiven security, including risk.\n(Module 41.1, LOS 41.a)"}, {"n": 18, "q": "An investor who is more risk averse with respect to potential negative outcomes than\npotential positive outcomes most likely exhibits which behavioral finance characteristic?", "opts": ["Mental accounting.", "Loss aversion.", "Conservatism."], "ans": "B", "expl": "Loss aversion is exhibited by an investor who dislikes a loss more than he likes an equal\ngain. That is, the investor's risk preferences are asymmetric. Mental accounting refers to\nmentally classifying investments in separate accounts rather than considering them from a\nportfolio perspective. In behavioral finance, conservatism refers to a tendency to maintain\none's prior views even in the presence of new information.\n(Module 41.1, LOS 41.g)"}, {"n": 19, "q": "The strong-form efficient market hypothesis (EMH) asserts that stock prices fully reflect\nwhich of the following types of information?", "opts": ["Market.", "Public and private.", "Public, private, and future."], "ans": "B", "expl": "The strong-form EMH assumes that stock prices fully reflect all information from public\nand private sources.\n(Module 41.1, LOS 41.d)"}, {"n": 20, "q": "Which of the following statements best describes the overreaction effect?", "opts": ["High returns over a one-year period are followed by high returns over the following year.", "High returns over a one-year period are followed by low returns over the following three years.", "Low returns over a three-year period are followed by high returns over the following three years."], "ans": "C", "expl": "The overreaction effect refers to stocks with poor returns over three to five-year periods\nthat had higher subsequent performance than stocks with high returns in the prior period.\nThe result is attributed to overreaction in stock prices that reverses over longer periods of\ntime. Stocks with high previous short-term returns that have high subsequent returns\nshow a momentum effect.\n(Module 41.1, LOS 41.f)"}, {"n": 21, "q": "If stock markets are semistrong-form efficient, a portfolio manager is least likely to create\nvalue for investors by:", "opts": ["allocating invested funds among asset classes.", "analyzing financial statements to select undervalued stocks.", "monitoring clients’ needs and circumstances."], "ans": "B", "expl": "Semistrong-form market efficiency implies that fundamental analysis of publicly available\ninformation will not generate abnormal returns on average. Portfolio managers should\nhelp quantify a client's risk tolerances and return needs, offer portfolio policies and\nstrategies to meet these needs, and construct a portfolio by allocating funds to\nappropriate asset classes. Portfolio managers can also create value by diversifying their\nclients' portfolios globally to reduce risk, monitoring and evaluating changing capital\nmarket conditions, monitoring their clients' needs and circumstances, and rebalancing\ntheir clients' portfolios when necessary.\n(Module 41.1, LOS 41.e)"}, {"n": 22, "q": "Which of the following would be inconsistent with an efficient market?", "opts": ["Price adjustments are biased.", "Price changes are independent.", "Stock prices adjust rapidly to new information."], "ans": "A", "expl": "Market efficiency assumes that investors adjust their estimates of security prices rapidly to\nreflect their unbiased interpretation of the new information. New information arrives\nrandomly and independently. Therefore, price changes are independent.\n(Module 41.1, LOS 41.c)"}, {"n": 23, "q": "The statement, \"Stock prices fully reflect all information from public and private sources,\"\ncan be attributed to which form of the efficient market hypothesis (EMH)?", "opts": ["Semistrong-form EMH.", "Strong-form EMH.", "Weak-form EMH."], "ans": "B", "expl": "This is the definition of the strong-form EMH. Private sources include insider information,\nsuch as persons holding monopolistic access to information relevant to the formation of\nprices.\n(Module 41.1, LOS 41.d)"}, {"n": 24, "q": "The semi-strong form of the efficient market hypothesis (EMH) is most accurately described\nas asserting that security prices fully reflect all:", "opts": ["publicly available information.", "historical price and volume information.", "relevant information, including information not publicly available."], "ans": "A", "expl": "The semi-strong form of the EMH asserts that security prices fully reflect all publicly\navailable information. This includes all historical price and volume information, which the\nweak form of the EMH asserts is fully reflected in security prices. The strong form of the\nEMH asserts that security prices fully reflect all public and private information.\n(Module 41.1, LOS 41.d)"}, {"n": 25, "q": "The semi-strong form of efficient market hypothesis (EMH) asserts that:", "opts": ["all public information is already reflected in security prices.", "both public and private information is already incorporated into security prices.", "only past market information is reflected in security prices."], "ans": "A", "expl": "Semi-strong EMH states that publicly available information cannot be used to consistently\nbeat the market performance.\n(Module 41.1, LOS 41.d)"}, {"n": 26, "q": "If the efficient markets hypothesis is true, portfolio managers should do all of the following\nEXCEPT:", "opts": ["Minimize transaction costs.", "Spend more time working on security selection.", "Work more with clients to better quantify their risk preferences."], "ans": "B", "expl": "In an efficient market all stocks are properly priced and reflect all publicly available\ninformation. Therefore, individual selection of stocks is not important the only thing that is\nrelevant is the portfolio's beta.\n(Module 41.1, LOS 41.e)"}, {"n": 27, "q": "An increase in which of the following factors would most likely improve a market's efficiency?", "opts": ["Number of participants.", "Bid-ask spreads.", "Restrictions on short selling."], "ans": "A", "expl": "As the number of market participants increases, the speed at which markets adjust to new\ninformation is likely to increase. Restrictions on short selling limit the ability of arbitrage to\ncorrect pricing anomalies. High bid-ask spreads increase transaction costs and decrease\nefficiency.\n(Module 41.1, LOS 41.c)"}, {"n": 28, "q": "An analyst with Guffman Investments has developed a stock selection model based on\nearnings announcements made by companies with high P/E stocks. The model predicts that\ninvesting in companies with P/E ratios twice that of their industry average that make positive\nearnings announcements will generate significant excess return. If the analyst has\nconsistently made superior risk-adjusted returns using this strategy, which form of the\nefficient market hypothesis has been violated?", "opts": ["Semistrong and strong forms only.", "Strong, semistrong, and weak forms.", "Weak form only."], "ans": "A", "expl": "The semistrong form of EMH states that security prices rapidly adjust to reflect all publicly\navailable information. If the analyst can use his model, which is based on publicly available\ninformation, to earn above average returns, the semistrong form of the EMH has been\nviolated. If the semistrong form of EMH is violated, the strong form of EMH is also violated.\n(Module 41.1, LOS 41.e)"}, {"n": 29, "q": "The measure of an asset's value that can most likely be determined without estimation is its:", "opts": ["fundamental value.", "intrinsic value.", "market value."], "ans": "C", "expl": "The current price of a traded asset is its market value. An asset's intrinsic or fundamental\nvalue is the price a rational investor with complete information about the asset would pay\nfor it.\n(Module 41.1, LOS 41.b)"}, {"n": 30, "q": "In a perfectly efficient market, portfolio managers should do all of the following EXCEPT:", "opts": ["diversify to eliminate systematic risk.", "monitor their client's needs and circumstances.", "quantify their risk and return needs within the bounds of the client's liquidity, income, time horizon, legal, and regulatory constraints."], "ans": "A", "expl": "Portfolio managers cannot eliminate systematic risk (i.e., market risk) thru the use of\ndiversification. Portfolio managers should try to eliminate unsystematic portfolio risk.\n(Module 41.1, LOS 41.e)"}, {"n": 31, "q": "Which of the following statements about the efficient market hypothesis (EMH) is most\naccurate?", "opts": ["The semistrong form of the EMH states that current security prices fully reflect all public and nonpublic information, both market and nonmarket.", "The strong form of the EMH implies that no group of investors should be able to consistently achieve positive abnormal returns.", "The weak form of the EMH maintains that current security prices fully reflect all past information."], "ans": "B", "expl": "If the strong form of the EMH holds, no group of investors should be able to achieve\npositive abnormal returns consistently. The weak form addresses only past price and\ntrading volume information, not all information. The semistrong form of the EMH does not\nassume that current security prices reflect nonpublic information.\n(Module 41.1, LOS 41.d)"}, {"n": 32, "q": "Under the efficient market hypothesis (EMH), the major effort of the portfolio manager\nshould be to:", "opts": ["achieve complete diversification of the portfolio.", "follow a strict buy and hold strategy.", "minimize systematic risk in the portfolio."], "ans": "A", "expl": "In an efficient market, portfolio managers must create and maintain the appropriate mix\nof assets to meet their client's needs. The portfolio should be diversified to eliminate\nunsystematic risk. The appropriate systematic risk will depend on the clients risk tolerance\nand return requirement. Over time the needs of the client and environment will justify\nchanges to the portfolio. The manager should also try to minimize transaction costs and at\nleast try to match the performance of a benchmark.\n(Module 41.1, LOS 41.e)"}, {"n": 33, "q": "Which of the following forms of the EMH assumes that no group of investors has\nmonopolistic access to relevant information?", "opts": ["Strong-form.", "Weak-form.", "Both weak and semistrong form."], "ans": "A", "expl": "The strong-form EMH assumes that stock prices fully reflect all information from public\nand private sources. In addition, no group of investors has monopolistic access to\ninformation relevant to the formation of prices.\n(Module 41.1, LOS 41.d)"}, {"n": 34, "q": "Which of the following statements least likely describes the role of a portfolio manager in\nperfectly efficient markets? Portfolio managers should:", "opts": ["quantify client's risk tolerance, communicate portfolio policies and strategies, and maintain a strict buy and hold policy avoiding any changes in the portfolio to minimize transaction costs.", "construct a portfolio that includes financial and real assets.", "construct diversified portfolios that include international securities to eliminate unsystematic risk."], "ans": "A", "expl": "A portfolio manager should quantify each client's risk tolerance and communicate\nportfolio policies and strategies. However, portfolio managers should monitor client's\nneeds and changing circumstances and make appropriate changes to the portfolio.\nAdhering to a strict buy and hold policy would not be in the client's best interest. Portfolios\nneed to be rebalanced and changed to meet client's changing needs.\n(Module 41.1, LOS 41.e)"}, {"n": 35, "q": "Octagon Advisors believes that the market is semi-strong efficient. The firm's portfolio\nmanagers most likely will use:", "opts": ["an enhanced indexing strategy that relies on trading patterns.", "passive portfolio management strategies.", "active portfolio management strategies."], "ans": "B", "expl": "If the market is semi-strong efficient, portfolio managers should use passive management\nbecause neither technical analysis nor fundamental analysis will generate positive\nabnormal returns on average over time.\n(Module 41.1, LOS 41.e)"}, {"n": 36, "q": "If the momentum effect persists over time, it would provide evidence against which of the\nfollowing forms of market efficiency?", "opts": ["Both weak form and semistrong form.", "Semistrong form only.", "Weak form only."], "ans": "A", "expl": "The momentum effect suggests it is possible to earn abnormal returns using market data.\nAll three forms of market efficiency (weak form, semistrong form, and strong form)\nassume that market prices fully reflect market data.\n(Module 41.1, LOS 41.f)"}, {"n": 37, "q": "Which of the following would provide evidence against the semistrong form of the efficient\nmarket theory?", "opts": ["All investors have learned to exploit signals related to future performance.", "Low P/E stocks tend to have positive abnormal returns over the long run.", "Trend analysis is worthless in determining stock prices."], "ans": "B", "expl": "P/E information is publicly available information and therefore this test relates to the\nsemistrong-form EMH. Trend analysis is based on historical information and therefore\nrelates to the weak-form EMH. In an efficient market one would expect 50% of pension\nfund managers to do better than average and 50% of pension fund managers to do worse\nthan average. If all investors exploit the same information no excess returns are possible.\n(Module 41.1, LOS 41.f)"}, {"n": 38, "q": "Which of the following is a limitation to fully efficient markets?", "opts": ["Information is always quickly disseminated and fully embedded in a security’s prices.", "There are no limitations to fully efficient markets because the trading actions of fundamental and technical analysts are continuously keeping prices at their intrinsic value.", "The gains to be earned by information trading can be less than the transaction costs the trading would entail."], "ans": "C", "expl": "Market prices that are not precisely efficient can persist if the gains to be made by\ninformation trading are less than the transaction costs such trading would entail.\n(Module 41.1, LOS 41.e)"}];
const CFG = {"title": "Market Efficiency", "subtitle": "CFA · Equity Investments · Reading 41 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; stem.textContent = q.q;
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
</html>
