<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#d86413; --accent2:#f0a05a;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#d86413; --accent2:#a8500e;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#d86413; --accent2:#f0a05a;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#d86413; --accent2:#a8500e;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(216,100,19,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(240,160,90,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(216,100,19,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(216,100,19,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#d86413,secondary:#f0a05a"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#d86413,secondary:#f0a05a"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#d86413,secondary:#f0a05a"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#d86413,secondary:#f0a05a"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Four years ago, Gamma Corporation issued a 20-year bond carrying an annualized coupon\nof 6% to expand its existing operations. The coupon is paid on a semiannual basis, and the\nbond is currently yielding 5.8%. The price of the bond per $100 of principal is closest to:", "opts": ["$104.", "$102.", "$106."], "ans": "B", "expl": "As the bond was issued 4 years ago, its remaining maturity is 16 years. The price is\ncalculated as follows:\nPMT = 6% / 2 × $100 = $3.\nN = 16 × 2 = 32.\nI/Y = 5.8% / 2 = 2.9%.\nFV = $100.\nCPT PV to obtain $102.07.\n(Module 52.1, LOS 52.a)"}, {"n": 2, "q": "Which of the following statements regarding zero-coupon bonds and spot interest rates is\nmost accurate?", "opts": ["Spot interest rates will never vary across time.", "Price appreciation creates only some of the zero-coupon bond's return.", "A coupon bond can be viewed as a collection of zero-coupon bonds."], "ans": "C", "expl": "Zero-coupon bonds are quite special. Because zero-coupon bonds have no coupons (all of\nthe bond's return comes from price appreciation), investors have no uncertainty about the\nrate at which coupons will be invested. Spot rates are defined as interest rates used to\ndiscount a single cash flow to be received in the future. Any bond can be viewed as the\nsum of the present value of its individual cash flows where each of those cash flows are\ndiscounted at the appropriate zero-coupon bond spot rate.\n(Module 52.1, LOS 52.a)"}, {"n": 3, "q": "Matrix pricing is used primarily for pricing bonds that:", "opts": ["have low liquidity.", "differ from their benchmark bond’s maturity.", "differ from their benchmark bond’s credit rating."], "ans": "A", "expl": "For bonds that do not trade or trade infrequently, matrix pricing uses the yields on similar\nissues that do trade to estimate the required yield on the illiquid bonds.\n(Module 52.1, LOS 52.c)"}, {"n": 4, "q": "A 10-year, 5% bond is issued at a price to yield 5.2%. Three months after issuance, the yield\non this bond has decreased by 100 basis points. The price of this bond at issuance and three\nmonths later is:", "opts": ["below par at issuance, but above par three months later.", "below par at issuance, and below par three months later.", "above par at issuance, but below par three months later."], "ans": "A", "expl": "A bond issued at a yield higher than its coupon will be priced below par, or at a discount.\nThree months later, the yield has declined to 4.2% and the bond will trade at a premium to\npar, reflecting the fact that the coupon is now higher than the yield.\n(Module 52.1, LOS 52.b)"}, {"n": 5, "q": "To determine the full price of a corporate bond, a dealer is most likely to calculate accrued\ninterest based on:", "opts": ["30-day months and 360-day years.", "30-day months and 365-day years.", "Actual day counts."], "ans": "A", "expl": "Accrued interest for corporate bonds is typically calculated using the 30/360 method. For\ngovernment bonds, accrued interest is typically calculated using the actual/actual method.\n(Module 52.1, LOS 52.a)"}, {"n": 6, "q": "An analyst using matrix pricing will estimate the value of a bond based on:", "opts": ["a probability model for default risk.", "the issuer’s cost of capital from all sources.", "yields to maturity of other bonds."], "ans": "C", "expl": "Matrix pricing is a method for valuing a non-traded or infrequently traded bond based on\nthe yields to maturity of similar bonds that are traded more frequently.\n(Module 52.1, LOS 52.c)"}, {"n": 7, "q": "The value of a 10 year zero-coupon bond with a par value of $1,000, yielding 9.6% on a\nsemiannual-bond basis, is closest to:", "opts": ["$410.", "$390.", "$400."], "ans": "B", "expl": "Because the yield is quoted on a semiannual-bond basis, we must divide the yield by 2 to\nget the bond's 6-month holding period yield, and multiply the number of years by 2 to get\nthe number of semiannual periods to maturity.\nI/Y = 9.6 / 2 = 4.8; FV = 1,000; N = 10 × 2 = 20; PMT = 0; CPT  PV = –391.54\n→\n(Module 52.1, LOS 52.a)"}, {"n": 8, "q": "A bond has a yield to maturity of 7% with a periodicity of 4. The bond has a face value of\n$100,000 and matures in 13 years. Each coupon payment will be $1,800. The current price of\nthe bond is closest to:", "opts": ["$101,672.", "$101,698.", "$102,768."], "ans": "B", "expl": "N = 13 × 4 = 52; FV = 100,000; PMT = 1,800; I/Y = 7 / 4 = 1.75; CPT  PV = 101,698.\n→\n(Module 52.1, LOS 52.a)"}, {"n": 9, "q": "In the context of bonds, accrued interest:", "opts": ["covers the part of the next coupon payment not earned by seller.", "equals interest earned from the previous coupon to the sale date.", "is discounted along with other cash flows to arrive at the dirty, or full price."], "ans": "B", "expl": "This is a correct definition of accrued interest on bonds.\nThe other choices are false. Accrued interest is not discounted when calculating the price\nof the bond. The statement, \"covers the part of the next coupon payment not earned by\nseller,\" should read, \"…not earned by buyer.\"\n(Module 52.1, LOS 52.a)"}, {"n": 10, "q": "Consider a 10%, 10-year bond sold to yield 8%. If after one year the bond has followed its\nconstant yield price trajectory, its price will most likely have:", "opts": ["increased.", "decreased.", "remained constant."], "ans": "B", "expl": "The path that a bond's price follows over its maturity assuming the yield is held constant is\nknown as the constant yield price trajectory. In this case it is being held constant at 8%.\nGiven the bond is sold at a premium (coupon > YTM), its price will decrease as it moves\ntoward par value.\nPrice at issuance: N = 10; FV = 1,000; PMT = 100; I = 8; CPT  PV = 1,134\n→\nPrice after one year: N = 9; FV = 1,000; PMT = 100; I = 8; CPT  PV = 1,125\n→\n(Module 52.1, LOS 52.b)"}, {"n": 11, "q": "A 5-year bond with a 10% coupon has a present yield to maturity of 8%. If interest rates\nremain constant one year from now, the price of the bond will be:", "opts": ["higher.", "lower.", "the same."], "ans": "B", "expl": "A premium bond sells at more than face value, thus as time passes the bond value will\nconverge upon the face value.\n(Module 52.1, LOS 52.b)"}, {"n": 12, "q": "Consider a 10%, 10-year bond sold to yield 8%. One year passes and interest rates remained\nunchanged (8%). If after one year the bond has followed its constant yield price trajectory, its\nprice will most likely have:", "opts": ["increased.", "decreased.", "remained constant."], "ans": "B", "expl": "The path that a bond's price follows over its maturity assuming the yield is held constant is\nknown as the constant yield price trajectory. In this case it is being held constant at 8%.\nGiven the bond is sold at a premium (coupon > YTM), its price will decrease as it moves\ntoward par value.\nPrice at issuance: N = 10; FV = 1,000; PMT = 100; I = 8; CPT  PV = 1,134\n→\nPrice after one year: N = 9; FV = 1,000; PMT = 100; I = 8; CPT  PV = 1,125\n→\n(Module 52.1, LOS 52.b)"}, {"n": 13, "q": "Today an investor purchases a $1,000 face value, 10%, 20-year, semi-annual bond at a\ndiscount for $900. He wants to sell the bond in 6 years when he estimates the yields will be\n9%. What is the estimate of the future price?", "opts": ["$946.", "$1,079.", "$1,152."], "ans": "B", "expl": "In 6 years, there will be 14 years (20 – 6), or 14 × 2 = 28 semi-annual periods remaining of\nthe bond's life So, N = (20 – 6)(2) = 28; PMT = (1,000 × 0.10) / 2 = 50; I/Y = 9/2 = 4.5; FV =\n1,000; CPT  PV = 1,079.\n→\nNote: Calculate the PV (we are interested in the PV 6 years from now), not the FV.\n(Module 52.1, LOS 52.a)"}, {"n": 14, "q": "Georgia Corporation has $1,000 par value bonds with 10 years remaining maturity. The\nbonds carry a 7.5% coupon that is paid semi-annually. If the current yield to maturity on\nsimilar bonds is 8.2%, what is the current value of the bonds?", "opts": ["$569.52.", "$1,123.89.", "$952.85."], "ans": "C", "expl": "The coupon payment each six months is ($1,000)(0.075 / 2) = $37.50. To value the bond,\nenter FV = $1,000; PMT = $37.50; N = 10 × 2 = 20; I/Y = 8.2 / 2 = 4.1%; CPT  PV = –952.85.\n→\n(Module 52.1, LOS 52.a)"}, {"n": 15, "q": "Ron Logan, CFA, is a bond manager. He purchased $50 million in 6.0% coupon Southwest\nManufacturing bonds at par three years ago. Today, the bonds are priced to yield 6.85%. The\nbonds mature in nine years. The Southwest bonds are trading at a:", "opts": ["discount, and the yield to maturity has increased since purchase.", "premium, and the yield to maturity has decreased since purchase.", "discount, and the yield to maturity has decreased since purchase."], "ans": "A", "expl": "The yield on the bonds has increased, indicating that the value of the bonds has fallen\nbelow par. The bonds are therefore trading at a discount. If a bond is selling at a discount,\nthe bond's current price is lower than its par value and the bond's YTM is higher than the\ncoupon rate. Since Logan bought the bonds at par (coupon = YTM = 6%), the YTM has\nincreased.\n(Module 52.1, LOS 52.b)"}, {"n": 16, "q": "An investor purchases a $1,000 5% coupon bond with quarterly coupon payments that\nmatures in 12 years and has a yield to maturity of 7.0%. The price the investor pays is closest\nto:", "opts": ["$838.53.", "$839.42.", "$841.15."], "ans": "A", "expl": "N = 12 × 4 = 48, FV = 1,000, PMT = 50/4 = 12.5, I/Y = 7.0/4 = 1.75; CPT PV = −838.53.\n(Module 52.1, LOS 52.a)"}, {"n": 17, "q": "A bond offers a 12% coupon paid semiannually and has 15 years left to maturity. Assuming a\npar value of $1,000 and a yield to maturity of 16%, the price of the bond is closest to:", "opts": ["$777.", "$775.", "$776."], "ans": "B", "expl": "The semiannual coupon payment is $1,000 × (0.12 / 2) = $60.\nFV = 1,000; PMT = 60; N = 15 × 2 = 30; I/Y = 16 / 2 = 8; CPT  PV = –774.84\n→\n(Module 52.1, LOS 52.a)"}, {"n": 18, "q": "A year ago a company issued a bond with a face value of $1,000 with an 8% coupon. Now the\nprevailing market yield is 10%. What happens to the bond? The bond:", "opts": ["is traded at a market price higher than $1,000.", "is traded at a market price of less than $1,000.", "price is not affected by the change in market yield, and will continue to trade at $1,000."], "ans": "B", "expl": "A bonds price/value has an inverse relationship with interest rates. Since interest rates are\nincreasing (from 8% when issued to 10% now) the bond will be selling at a discount. This\nhappens so an investor will be able to purchase the bond and still earn the same yield that\nthe market currently offers.\n(Module 52.1, LOS 52.b)"}, {"n": 19, "q": "Assume a city issues a $5 million bond to build a hockey rink. The bond pays 8% semiannual\ninterest and will mature in 10 years. Current interest rates are 6%. What is the present value\nof this bond?", "opts": ["$5,743,874.", "$5,000,000.", "$3,363,478."], "ans": "A", "expl": "Since current interest rates are lower than the coupon rate the bond will be issued at a\npremium. FV = $5,000,000; N = 20; I/Y = 3; PMT = (0.04)($5,000,000) = $200,000. Compute\nPV = $-5,743,874\n(Module 52.1, LOS 52.a)"}, {"n": 20, "q": "A $1,000 par, semiannual-pay bond is trading for 89.14, has a coupon rate of 8.75%, and\naccrued interest of $43.72. The flat price of the bond is:", "opts": ["$847.69.", "$891.40.", "$935.12."], "ans": "B", "expl": "The flat price of the bond is the quoted price, 89.14% of par value, which is $891.40.\n(Module 52.1, LOS 52.a)"}, {"n": 21, "q": "What is the value of a 10-year, semi-annual, 8% coupon bond with a $1,000 face value if\nsimilar bonds are now yielding 10%?", "opts": ["$877.11.", "$875.38.", "$1,135.90."], "ans": "B", "expl": "Using the financial calculator: N = 10 × 2 = 20; PMT = $80 / 2 = $40; I/Y = 10 / 2 = 5%; FV =\n1,000; Compute the bond's value PV = –875.38.\n(Module 52.1, LOS 52.a)"}, {"n": 22, "q": "Assume a bond's quoted price is 105.22 and the accrued interest is $3.54. The bond has a\npar value of $100. What is the bond's clean price?", "opts": ["$105.22.", "$101.68.", "$108.76."], "ans": "A", "expl": "The clean price is the bond price without the accrued interest so it is equal to the quoted\nprice.\n(Module 52.1, LOS 52.a)"}, {"n": 23, "q": "An investor purchased a 6-year annual interest coupon bond one year ago. The coupon rate\nof interest was 10% and par value was $1,000. At the time she purchased the bond, the yield\nto maturity was 8%. The amount paid for this bond one year ago was:", "opts": ["$1,092.46.", "$1,125.53.", "$1,198.07."], "ans": "A", "expl": "N = 6\nPMT = (0.10)(1,000) = 100\nI = 8\nFV = 1,000\nCPT = ?\nPV = 1,092.46\n(Module 52.1, LOS 52.a)"}, {"n": 24, "q": "Given a required yield to maturity of 6%, what is the intrinsic value of a semi-annual pay\ncoupon bond with an 8% coupon and 15 years remaining until maturity?", "opts": ["$1,095.", "$1,196.", "$1,202."], "ans": "B", "expl": "This problem can be solved most easily using your financial calculator. Using semiannual\npayments, I = 6/2 = 3%; PMT = 80/2 = $40; N = 15 × 2 = 30; FV = $1,000; CPT  PV = $1,196.\n→\n(Module 52.1, LOS 52.a)"}, {"n": 25, "q": "A 7% callable semiannual-pay bond with a $1,000 face value has 20 years to maturity. If the\nyield to maturity is 8.25% and the yield to call is 9.25% the value of the bond is closest to:", "opts": ["$836.", "$879.", "$797."], "ans": "B", "expl": "The price of a bond is equal to the present value of future cash flows discounted at the\nyield to maturity.\nN = 20 × 2 = 40; I/Y = 8.25/2 = 4.125; PMT = 70/2 = 35; FV = 1,000;\nCompute PV = 878.56.\nNote that the yield to call cannot be used here to calculate the bond value, because the\ncall date is not given.\n(Module 52.1, LOS 52.a)"}, {"n": 26, "q": "An analyst wants to estimate the yield to maturity on a non-traded 4-year, annual pay bond\nrated A. Among actively traded bonds with the same rating, 3-year bonds are yielding 3.2%\nand 6-year bonds are yielding 5.0%. Using matrix pricing the analyst should estimate a YTM\nfor the non-traded bond that is closest to:", "opts": ["3.6%.", "3.8%.", "4.1%."], "ans": "B", "expl": "Interpolating: 3.2% + [(4 – 3) / (6 – 3)] × (5.0% – 3.2%) = 3.8%\n(Module 52.1, LOS 52.c)"}, {"n": 27, "q": "If yields do not change over the life of a zero-coupon bond, its price will least likely:", "opts": ["approach par value.", "remain constant.", "follow the bond’s constant-yield price trajectory."], "ans": "B", "expl": "A zero coupon bond will be issued at a discount (yield > coupon). If market rates remain\nconstant, the price will rise toward par value as maturity approaches. The path that the\nprice takes if the yield does not change is known as the constant-yield price trajectory.\n(Module 52.1, LOS 52.b)"}, {"n": 28, "q": "An annual-pay, 4% coupon, 10-year bond has a yield to maturity of 5.2%. If the price of this\nbond is unchanged two years later, its yield to maturity at that time is:", "opts": ["5.2%.", "less than 5.2%.", "greater than 5.2%."], "ans": "C", "expl": "This bond is priced at a discount to par value because its 4% coupon is less than its 5.2%\nyield to maturity. As the bond gets closer to maturity, the discount will amortize toward\npar value, which means its price will increase if its yield remains unchanged. For its price\nto remain unchanged, its yield would have to increase.\nPrice with 10 years to maturity:\nN = 10; I/Y = 5.2; PMT = 40; FV = 1,000; CPT PV = –908.23\nYield with 8 years to maturity:\nN = 8; PMT = 40; FV = 1,000; PV = –908.23; CPT I/Y = 5.446%\n(Module 52.1, LOS 52.b)"}, {"n": 29, "q": "A bond with a 12% annual coupon, 10 years to maturity and selling at 88 percent of par has a\nyield to maturity of:", "opts": ["between 10% and 12%.", "between 13% and 14%.", "over 14%."], "ans": "C", "expl": "PMT = 12; N = 10; PV = -88; FV = 100; CPT  I = 14.3\n→\n(Module 52.1, LOS 52.a)"}, {"n": 30, "q": "Other things equal, for option-free bonds:", "opts": ["a bond’s value is more sensitive to yield increases than to yield decreases.", "the value of a long-term bond is more sensitive to interest rate changes than the value of a short-term bond.", "the value of a low-coupon bond is less sensitive to interest rate changes than the value of a high-coupon bond."], "ans": "B", "expl": "Long-term, low-coupon bonds are more sensitive than short-term and high-coupon bonds.\nPrices are more sensitive to rate decreases than to rate increases (duration rises as yields\nfall).\n(Module 52.1, LOS 52.b)"}, {"n": 31, "q": "Assume a city issues a $5 million bond to build a new arena. The bond pays 8% semiannual\ninterest and will mature in 10 years. Current interest rates are 9%. What is the present value\nof this bond and what will the bond's value be in seven years from today if the yield is\nunchanged?\nPresent ValueValue in 7 Years from Today", "opts": ["4,674,8024,871,053", "4,674,8024,931,276", "5,339,7584,871,053"], "ans": "A", "expl": "Present Value:\nSince the current interest rate is above the coupon rate the bond will be priced at a\ndiscount. FV = $5,000,000; N = 20; PMT = (0.04)(5 million) = $200,000; I/Y = 4.5; CPT  PV =\n→\n-$4,674,802\nValue in 7 Years:\nSince the current interest rate is above the coupon rate the bond will be priced at a\ndiscount. FV = $5,000,000; N = 6; PMT = (0.04)(5 million) = $200,000; I/Y = 4.5; CPT  PV =\n→\n-$4,871,053\n(Module 52.1, LOS 52.a)", "qhtml": "<p>Assume a city issues a $5 million bond to build a new arena. The bond pays 8% semiannual interest and will mature in 10 years. Current interest rates are 9%. What is the present value of this bond and what will the bond's value be in seven years from today if the yield is unchanged?</p><p><em>Options show → <strong>Present Value</strong> | <strong>Value in 7 Years from Today</strong></em></p>"}, {"n": 32, "q": "Interest rates have fallen over the seven years since a $1,000 par, 10-year bond was issued\nwith a coupon of 7%. What is the present value of this bond if the required rate of return is\ncurrently four and one-half percent? (For simplicity, assume annual payments.)", "opts": ["$1,044.33.", "$1,052.17.", "$1,068.72."], "ans": "C", "expl": "Each of the remaining cash flows on the bond is discounted at the annual rate of 4.5%.\nPeriodPaymentDiscountPV\n(1.045)\n1$1,000 × 7% = $70$ 66.99\n1\n2$1,000 × 7% = $70(1.045)$ 64.10\n2\n(1.045)\n3$1,000 × 7% = $70$ 61.34\n3\n(1.045)\n3$1,000 principal$ 876.30\n3\nTotal Present Value of Cash Flows$1,068.73\nThe present value can also be determined with a financial calculator. N = 3, I = 4.5%, PMT =\n$1,000 × 7%, FV = $1,000. Solve for PV = $1,068.724.\n(Module 52.1, LOS 52.a)"}, {"n": 33, "q": "Parsons Inc. is issuing an annual-pay bond that will pay no coupon for the first five years and\nthen pay a 10% coupon for the remaining five years to maturity. The 10% coupon interest for\nthe first five years will all be paid (without additional interest) at maturity. If the annual YTM\non this bond is 10%, the price of the bond per $1,000 of face value is closest to:", "opts": ["$814.", "$856.", "$778."], "ans": "A", "expl": "This bond has no cash flows for the first five years. It then has a $100 cash flow for years 6\nthrough 10. Additionally, the accrued interest ($500) that wasn't paid in the first five years\nwould have to be paid at the end, along with the principal. A financial calculator using the\nCF/NPV worksheet can handle this type of problem. The required inputs are CF = 0, CF =\n01\n0, F = 5, CF = 100, F = 4, CF = 1,600, F = 1, NPV, I = 10%, CPT = 813.69. Note that CF is\n122333\nmade up of the principal ($1,000) plus the remaining $100 coupon plus the accrued\ninterest ($500) that was not paid during the first five years of the bond's life.\n(Module 52.1, LOS 52.a)"}, {"n": 34, "q": "Consider a 6-year $1,000 par bond priced at $1,011. The coupon rate is 7.5% paid\nsemiannually. Six-year bonds with comparable credit quality have a yield to maturity (YTM)\nof 6%. Should an investor purchase this bond?", "opts": ["No, the bond is overvalued by $64.", "Yes, the bond is undervalued by $38.", "Yes, the bond is undervalued by $64."], "ans": "C", "expl": "FV = 1,000\nPMT = 37.5\nN = 12\nI/Y = 3%\nCPT PV = –1,074.66\n1,074.66 – 1,011 = 64\n(Module 52.1, LOS 52.a)"}, {"n": 35, "q": "What is the probable change in price of a 30-year semiannual 6.5% coupon, $1000 par value\nbond yielding 8% if the yield decreases to 7%?", "opts": ["$106.34.", "$107.31.", "$98.83."], "ans": "B", "expl": "Price at 8% is N = 60, FV = $1,000, I = 4%, PMT = $32.50, CPT PV = $830.32; price at 7% is N\n= 60, FV = $1,000, I = 3.5%, PMT = $32.50, CPT PV = $937.64. Change in price is $937.64 –\n$830.32 = $107.31.\n(Module 52.1, LOS 52.a)"}, {"n": 36, "q": "An investor gathered the following information about two 7% annual-pay, option-free bonds:\nBond R has 4 years to maturity and is priced to yield 6%\nBond S has 7 years to maturity and is priced to yield 6%\nBoth bonds have a par value of $1,000.\nGiven a 50 basis point parallel upward shift in interest rates, what is the value of the two-\nbond portfolio?", "opts": ["$2,044.", "$2,030.", "$2,086."], "ans": "A", "expl": "Given the shift in interest rates, Bond R has a new value of $1,017 (N = 4; PMT = 70; FV =\n1,000; I/Y = 6.50%; CPT  PV = 1,017). Bond S's new value is $1,027 (N = 7; PMT = 70; FV =\n→\n1,000; I/Y = 6.50%; CPT  PV = 1,027). After the increase in interest rates, the new value of\n→\nthe two-bond portfolio is $2,044 (1,017 + 1,027).\n(Module 52.1, LOS 52.a)"}, {"n": 37, "q": "For an option-free bond, as the yield to maturity increases, the bond price:", "opts": ["decreases at a decreasing rate.", "decreases at an increasing rate.", "increases at a decreasing rate."], "ans": "A", "expl": "The relationship between price and yield for an option-free bond is inverse and convex\ntoward the origin. As the yield increases, the price decreases, but at a decreasing rate.\n(Module 52.1, LOS 52.b)"}, {"n": 38, "q": "Consider a 10-year, 6% coupon, $1,000 par value bond, paying annual coupons, with a 10%\nyield to maturity. The change in the bond price resulting from a 400 basis point increase in\nyield is closest to:", "opts": ["$170.", "$480.", "$1,160."], "ans": "A", "expl": "Using the 10% yield to maturity, the price of the bond originally is $754.22:\nN = 10; I/Y = 10; PMT = 60; FV = 1000; CPT PV = $754.22\nUsing the 14% yield to maturity, the price of the bond changes to $582.71:\nN = 10; I/Y = 14; PMT = 60; FV = 1000; CPT PV = $582.71\nTherefore, the price is expected to change from $754.22 to $582.71, a decrease of $171.51.\n(Module 52.1, LOS 52.a)"}, {"n": 39, "q": "What value would an investor place on a 20-year, $1,000 face value, 10% annual coupon\nbond, if the investor required a 9% rate of return?", "opts": ["$879.", "$920.", "$1,091."], "ans": "C", "expl": "N = 20; I/Y = 9; PMT = 100 (0.10 × 1,000); FV = 1,000; CPT  PV = 1,091.\n→\n(Module 52.1, LOS 52.a)"}, {"n": 40, "q": "A bond with three years to maturity pays an annual coupon of 6%. Assuming a yield to\nmaturity of 7%, the price as a percent of par closest to:", "opts": ["92.03.", "97.38.", "102.67."], "ans": "B", "expl": "This value is computed as follows:\n23\nPresent Value = 6/1.07 + 6/1.07 + 106/1.07 = 97.38\nUsing the calculator:\nI/Y = 7; FV = 100; N = 3; PMT = 6; CPT  PV = $97.38\n→\n(Module 52.1, LOS 52.a)"}, {"n": 41, "q": "An investor buys a 20-year, 10% semi-annual bond for $900. She wants to sell the bond in 6\nyears when she estimates yields will be 10%. What is the estimate of the future price?", "opts": ["$946.", "$1,000.", "$1,079."], "ans": "B", "expl": "Since yields are projected to be 10% and the coupon rate is 10%, we know that the bond\nwill sell at par value.\n(Module 52.1, LOS 52.a)"}, {"n": 42, "q": "Consider a bond that pays an annual coupon of 5% and that has three years remaining until\nmaturity. Assume the term structure of interest rates is flat at 6%. If the term structure of\ninterest rates does not change over the next twelve-month interval, the bond's price change\n(as a percentage of par) will be closest to:", "opts": ["-0.84.", "0.84.", "0.00."], "ans": "B", "expl": "The bond price change is computed as follows:\n22\nBond Price Change = New Price – Old Price = (5/1.06 + 105/1.06) – (5/1.06 + 5/1.06 +\n3\n105/1.06) = 98.17 – 97.33 = 0.84.\n(Module 52.1, LOS 52.a)"}, {"n": 43, "q": "An investor buys a 25-year, 10% annual pay bond for $900 and will sell the bond in 5 years\nwhen he estimates its yield will be 9%. The price for which the investor expects to sell this\nbond is closest to:", "opts": ["$964.", "$1,091.", "$1,122."], "ans": "B", "expl": "This is a present value problem 5 years in the future.\nN = 20, PMT = 100, FV = 1000, I/Y = 9\nCPT PV = -1,091.29\nThe $900 purchase price is not relevant for this problem.\n(Module 52.1, LOS 52.a)"}, {"n": 44, "q": "A coupon bond that pays interest annually has a par value of $1,000, matures in 5 years, and\nhas a yield to maturity of 10%. What is the value of the bond today if the coupon rate is 12%?", "opts": ["$1,077.22.", "$1,075.82.", "$927.90."], "ans": "B", "expl": "FV = 1,000\nN = 5\nI = 10\nPMT = 120\nCPT = ?\nPV = 1,075.82.\n(Module 52.1, LOS 52.a)"}, {"n": 45, "q": "Austin Traynor is considering buying a $1,000 face value, semi-annual coupon bond with a\nquoted price of 104.75 and accrued interest since the last coupon of $33.50. Ignoring\ntransaction costs, how much will the seller receive at the settlement date?", "opts": ["$1,014.00.", "$1,047.50.", "$1,081.00."], "ans": "C", "expl": "The full price is equal to the flat or clean price plus interest accrued from the last coupon\ndate. Here, the flat price is 1,000 × 104.75%, or 1,000 × 1.0475 = 1,047.50. Thus, the full\nprice = 1,047.50 + 33.50 = 1,081.00.\n(Module 52.1, LOS 52.a)"}, {"n": 46, "q": "An investor plans to buy a 10-year, $1,000 par value, 8% semiannual coupon bond. If the\nyield to maturity of the bond is 9%, the bond's value is:", "opts": ["$1,067.95.", "$934.96.", "$935.82."], "ans": "B", "expl": "N = 20, I = 9/2 = 4.5, PMT = 80/2 = 40, FV = 1,000, compute PV = $934.96\n(Module 52.1, LOS 52.a)"}, {"n": 47, "q": "A zero-coupon bond matures three years from today, has a par value of $1,000 and a yield\nto maturity of 8.5% (assuming semi-annual compounding). What is the current value of this\nissue?", "opts": ["$779.01.", "$78.29.", "$782.91."], "ans": "A", "expl": "The value of the bond is computed as follows:\n6\nBond Value = $1,000 / 1.0425 = $779.01.\nN = 6; I/Y = 4.25; PMT = 0; FV = 1,000; CPT  PV = 779.01.\n→\n(Module 52.1, LOS 52.a)"}, {"n": 48, "q": "A new-issue, 15-year, $1,000 face value 6.75% semi-annual coupon bond is priced at $1,075.\nWhich of the following describes the bond and the relationship of the bond's market yield to\nthe coupon?", "opts": ["Premium bond, required market yield is less than 6.75%.", "Premium bond, required market yield is greater than 6.75%.", "Discount bond, required market yield is greater than 6.75%."], "ans": "A", "expl": "When the issue price is greater than par, the bond is selling at a premium. We also know\nthat the current market required rate is less than the coupon rate of 6.75%, because the\nbond is selling at a premium.\nFor the examination, remember the following relationships:\nType of BondMarket Yield to CouponPrice to Par\nPremiumMarket Yield < CouponPrice > Par\nParMarket Yield = CouponPrice = Par\nDiscountMarket Yield > CouponPrice < Par\n(Module 52.1, LOS 52.b)"}, {"n": 49, "q": "Consider a $1,000-face value, 12-year, 8%, semiannual coupon bond with a YTM of 10.45%.\nThe change in value for a decrease in yield of 38 basis points is:", "opts": ["$21.18.", "$22.76.", "$23.06."], "ans": "C", "expl": "With YTM = 10.45% (I/Y = 5.225), PMT = 40, N = 24, FV = 1,000, PV = $834.61. With YTM =\n10.07% (I/Y = 5.035), PV = $857.67, an increase of $23.06.\n(Module 52.1, LOS 52.a)"}];
const CFG = {"title": "Fixed-Income Bond Valuation Prices and Yields", "subtitle": "CFA · Fixed Income · Reading 52 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; stem.textContent = q.q;
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    document.querySelectorAll('.opt.correct').forEach(function(o){ addMark(o,'✅'); });
    document.querySelectorAll('.opt.wrong').forEach(function(o){ addMark(o,'❌'); });
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#d86413','#f0a05a','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>
