s a commodity futures contract:<\/p><p><b>Factor 1:<\/b> Futures roll yield<\/p><p><b>Factor 2:<\/b> Expected volatility of future prices<\/p><p><b>Factor 3:<\/b> Supply and demand fundamentals of the underlying commodity<\/p><\/div><\/details><div class=\"qtext\"><p>Valdez&#x27;s view on futures prices best reflects which of the following theories of commodities futures curve pricing?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q036.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":37,"q":"Which two of Valdez's factors are the most appropriate to value a commodity futures contract?","opts":["Factor 1 and Factor 2","Factor 1 and Factor 3","Factor 2 and Factor 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a038.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a038.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 34–37 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Maria Valdez is a commodity specialist covering global natural resources at Pecos Mutual Fund Inc., a buy-side firm. Valdez&#x27;s commodity price forecasts are used by other analysts at the firm and incorporated into their bottom-up financial models.<\/p><p>Hector Ortiz covers the global automotive industry group, which is significantly impacted by the costs of various commodities used in auto manufacturing. Ortiz is specifically concerned with the price of lithium, a key industrial metal used in the production of lithium-ion battery packs for electric vehicles. Over the past year, lithium prices have increased significantly due to tight supplies.<\/p><p>Ortiz asks Valdez to comment on recent developments impacting the lithium market. Valdez states that it is important to consider how stocks and flows of a commodity impact the market price of that commodity. She then makes the following comments:<\/p><p><b>Comment 1:<\/b> The country that is the world&#x27;s largest supplier of battery-grade lithium recently increased its revenue royalty tax on lithium from 1% to 2%.<\/p><p><b>Comment 2:<\/b> The largest global producer of lithium announced a capacity expansion of an existing mine, which will increase lithium output by 20%.<\/p><p><b>Comment 3:<\/b> Seasonal rains in one of the large lithium-producing countries have been unusually heavy this year.<\/p><p>Later that day, Valdez receives a call from one of the firm&#x27;s quantitative analysts, Pablo Fernandez, who is building a quantitative model to value commodities. As the firm will use commodity futures to implement an investment strategy, Fernandez asks about the underlying drivers of commodities futures prices. Valdez responds that she believes that most commodity producers consistently sell forward to lock in prices, causing futures prices to decrease, resulting in a &quot;normal backwardation&quot; of the futures curve. Valdez then proposes the following factors as potential inputs for valuing a commodity derivative such as a commodity futures contract:<\/p><p><b>Factor 1:<\/b> Futures roll yield<\/p><p><b>Factor 2:<\/b> Expected volatility of future prices<\/p><p><b>Factor 3:<\/b> Supply and demand fundamentals of the underlying commodity<\/p><\/div><\/details><div class=\"qtext\"><p>Which two of Valdez&#x27;s factors are the most appropriate to value a commodity futures contract?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q037.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":38,"q":"Based on Green's forecasts, which type of commodity index swap provides the most appropriate exposure for the pension fund?","opts":["Basis swap","Variance swap","Total return swap"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a039.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a039.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 38–41 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Conrad Green is the chief investment officer at the Municipal Pension Fund. The fund currently holds no commodities, and Green has now decided to allocate 10% of the fund to commodities. The rationale for Green&#x27;s decision is based on the following forecasts:<\/p><p>Commodities&#x27; historically low return correlation with other major asset classes will continue.<\/p><p>In a change from the recent past, commodity prices will steadily rise over the next decade due to persistently higher inflation.<\/p><p>Green recently hired Robert White as the pension fund&#x27;s commodity strategist. White and Green are discussing the initial implementation strategy, and White suggests an investment in a broad-based commodity index using swaps to gain exposure to the asset class. Green cautions that index selection is critical in establishing the proper exposure for the fund and makes the following statements:<\/p><p><b>Statement 1:<\/b> Due to my commodity price expectations, an index with less frequent rebalancing is preferred.<\/p><p><b>Statement 2:<\/b> Production-weighted indexes provide greater diversification benefits relative to fixed-weighted indexes.<\/p><p><b>Statement 3:<\/b> The index&#x27;s methodology for rolling individual futures contracts is critical since it is a key determinant in capturing price return.<\/p><p>White suggests adding a fully collateralized lumber futures position to aid diversification since lumber is not included in any of the indexes that are being considered. The lumber futures data is presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex008.webp\" style=\"max-width:min(100%,390px)\" alt=\"Exhibit\"><p>Green has concerns about buying individual futures contracts for the fund and prefers an index approach. He asks White to explain the expected payoff of a fully collateralized strategy, assuming the collateral earns 3%:<\/p><p>Buy a July 20X3 lumber futures contract.<\/p><p>At expiration, roll that contract into a new six-month contract.<\/p><p>Green provides a lumber futures price forecast in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex009.webp\" style=\"max-width:min(100%,379px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Green&#x27;s forecasts, which type of commodity index swap provides the most appropriate exposure for the pension fund?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q038.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":39,"q":"Which of Green's statements is correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a040.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a040.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 38–41 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Conrad Green is the chief investment officer at the Municipal Pension Fund. The fund currently holds no commodities, and Green has now decided to allocate 10% of the fund to commodities. The rationale for Green&#x27;s decision is based on the following forecasts:<\/p><p>Commodities&#x27; historically low return correlation with other major asset classes will continue.<\/p><p>In a change from the recent past, commodity prices will steadily rise over the next decade due to persistently higher inflation.<\/p><p>Green recently hired Robert White as the pension fund&#x27;s commodity strategist. White and Green are discussing the initial implementation strategy, and White suggests an investment in a broad-based commodity index using swaps to gain exposure to the asset class. Green cautions that index selection is critical in establishing the proper exposure for the fund and makes the following statements:<\/p><p><b>Statement 1:<\/b> Due to my commodity price expectations, an index with less frequent rebalancing is preferred.<\/p><p><b>Statement 2:<\/b> Production-weighted indexes provide greater diversification benefits relative to fixed-weighted indexes.<\/p><p><b>Statement 3:<\/b> The index&#x27;s methodology for rolling individual futures contracts is critical since it is a key determinant in capturing price return.<\/p><p>White suggests adding a fully collateralized lumber futures position to aid diversification since lumber is not included in any of the indexes that are being considered. The lumber futures data is presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex008.webp\" style=\"max-width:min(100%,390px)\" alt=\"Exhibit\"><p>Green has concerns about buying individual futures contracts for the fund and prefers an index approach. He asks White to explain the expected payoff of a fully collateralized strategy, assuming the collateral earns 3%:<\/p><p>Buy a July 20X3 lumber futures contract.<\/p><p>At expiration, roll that contract into a new six-month contract.<\/p><p>Green provides a lumber futures price forecast in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex009.webp\" style=\"max-width:min(100%,379px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of Green&#x27;s statements is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q039.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":40,"q":"Assume the Municipal Pension Fund purchased the January 20X3 contract. Based on Exhibit 1, if the January 20X3 contract is rolled into a new contract, which new contract will generate the greatest roll return?","opts":["March 20X3","May 20X3","July 20X3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a041.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a041.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 38–41 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Conrad Green is the chief investment officer at the Municipal Pension Fund. The fund currently holds no commodities, and Green has now decided to allocate 10% of the fund to commodities. The rationale for Green&#x27;s decision is based on the following forecasts:<\/p><p>Commodities&#x27; historically low return correlation with other major asset classes will continue.<\/p><p>In a change from the recent past, commodity prices will steadily rise over the next decade due to persistently higher inflation.<\/p><p>Green recently hired Robert White as the pension fund&#x27;s commodity strategist. White and Green are discussing the initial implementation strategy, and White suggests an investment in a broad-based commodity index using swaps to gain exposure to the asset class. Green cautions that index selection is critical in establishing the proper exposure for the fund and makes the following statements:<\/p><p><b>Statement 1:<\/b> Due to my commodity price expectations, an index with less frequent rebalancing is preferred.<\/p><p><b>Statement 2:<\/b> Production-weighted indexes provide greater diversification benefits relative to fixed-weighted indexes.<\/p><p><b>Statement 3:<\/b> The index&#x27;s methodology for rolling individual futures contracts is critical since it is a key determinant in capturing price return.<\/p><p>White suggests adding a fully collateralized lumber futures position to aid diversification since lumber is not included in any of the indexes that are being considered. The lumber futures data is presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex008.webp\" style=\"max-width:min(100%,390px)\" alt=\"Exhibit\"><p>Green has concerns about buying individual futures contracts for the fund and prefers an index approach. He asks White to explain the expected payoff of a fully collateralized strategy, assuming the collateral earns 3%:<\/p><p>Buy a July 20X3 lumber futures contract.<\/p><p>At expiration, roll that contract into a new six-month contract.<\/p><p>Green provides a lumber futures price forecast in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex009.webp\" style=\"max-width:min(100%,379px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Assume the Municipal Pension Fund purchased the January 20X3 contract. Based on Exhibit 1, if the January 20X3 contract is rolled into a new contract, which new contract will generate the greatest roll return?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q040.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":41,"q":"Based on Exhibit 1 and Exhibit 2, when the July 20X3 contract is rolled into a new six-month contract, the total return from Green's lumber futures trading strategy example is closest to:","opts":["-0.42%","3.50%","7.42%"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a042.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a042.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 38–41 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Conrad Green is the chief investment officer at the Municipal Pension Fund. The fund currently holds no commodities, and Green has now decided to allocate 10% of the fund to commodities. The rationale for Green&#x27;s decision is based on the following forecasts:<\/p><p>Commodities&#x27; historically low return correlation with other major asset classes will continue.<\/p><p>In a change from the recent past, commodity prices will steadily rise over the next decade due to persistently higher inflation.<\/p><p>Green recently hired Robert White as the pension fund&#x27;s commodity strategist. White and Green are discussing the initial implementation strategy, and White suggests an investment in a broad-based commodity index using swaps to gain exposure to the asset class. Green cautions that index selection is critical in establishing the proper exposure for the fund and makes the following statements:<\/p><p><b>Statement 1:<\/b> Due to my commodity price expectations, an index with less frequent rebalancing is preferred.<\/p><p><b>Statement 2:<\/b> Production-weighted indexes provide greater diversification benefits relative to fixed-weighted indexes.<\/p><p><b>Statement 3:<\/b> The index&#x27;s methodology for rolling individual futures contracts is critical since it is a key determinant in capturing price return.<\/p><p>White suggests adding a fully collateralized lumber futures position to aid diversification since lumber is not included in any of the indexes that are being considered. The lumber futures data is presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex008.webp\" style=\"max-width:min(100%,390px)\" alt=\"Exhibit\"><p>Green has concerns about buying individual futures contracts for the fund and prefers an index approach. He asks White to explain the expected payoff of a fully collateralized strategy, assuming the collateral earns 3%:<\/p><p>Buy a July 20X3 lumber futures contract.<\/p><p>At expiration, roll that contract into a new six-month contract.<\/p><p>Green provides a lumber futures price forecast in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex009.webp\" style=\"max-width:min(100%,379px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and Exhibit 2, when the July 20X3 contract is rolled into a new six-month contract, the total return from Green&#x27;s lumber futures trading strategy example is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q041.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":42,"q":"The majority of LVS's real estate holdings are best described as:","opts":["private debt.","public equity.","private equity."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a043.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a043.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 42–47 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Lucas Moreau is a real estate investment manager for La Vie Solide (LVS), an insurance company. He has prepared a presentation for LVS&#x27;s administrative personnel, who are less familiar with the types of investments the company makes. The presentation begins with a breakdown of the real estate sector into a matrix, using the categories of public, private, equity, and debt investments.<\/p><p>Moreau explains that LVS invests in all four categories, but the majority of its real estate holdings are illiquid and typically held for many years. The company also invests for value appreciation of the assets in addition to cash flows.<\/p><p>The presentation shifts to the roles of real estate in the investment portfolio. Moreau includes the following statements:<\/p><p><b>Statement 1:<\/b> Current income has historically been the largest part of real estate investment returns.<\/p><p><b>Statement 2:<\/b> The ability to adjust rents and realize capital appreciation means that the nominal rate of return for real estate is often less volatile than the real return.<\/p><p><b>Statement 3:<\/b> In general, real estate performance is highly correlated with stocks and bonds, so the investment portfolio does well when the overall market does well.<\/p><p>Finally, Moreau mentions that certain characteristics of real estate investments distinguish them from equity and bond investments, which can make them more difficult to properly value.<\/p><p>After completing the presentation, Moreau meets with Anna Dupont, CFA, the senior portfolio manager at LVS. Moreau tells Dupont about a potential new investment opportunity in a property with a NOI of €800,000 per year. Moreau expects that:<\/p><p>The property&#x27;s NOI will be flat for the next 4 years due to existing leases.<\/p><p>The NOI will increase to €900,000 per year in Year 5 and grow 2% per year thereafter.<\/p><p>LVS will hold the property for 4 years and has a 10% required rate of return.<\/p><p>La Tour Financial provides interest-only loans for LVS&#x27;s real estate investments, with requirements for two key ratios: the loan-to-value ratio (LTV) ratio must be no greater than 60% and the debt service coverage ratio (DSCR) must be at least 1.4. La Tour&#x27;s own estimates and information about the property purchase are shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex010.webp\" style=\"max-width:min(100%,504px)\" alt=\"Exhibit\"><p>LVS may purchase the property with 100% cash or using a €4 million, interest-only loan. Dupont w eases.<\/p><p>The NOI will increase to €900,000 per year in Year 5 and grow 2% per year thereafter.<\/p><p>LVS will hold the property for 4 years and has a 10% required rate of return.<\/p><p>La Tour Financial provides interest-only loans for LVS&#x27;s real estate investments, with requirements for two key ratios: the loan-to-value ratio (LTV) ratio must be no greater than 60% and the debt service coverage ratio (DSCR) must be at least 1.4. La Tour&#x27;s own estimates and information about the property purchase are shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex010.webp\" style=\"max-width:min(100%,504px)\" alt=\"Exhibit\"><p>LVS may purchase the property with 100% cash or using a €4 million, interest-only loan. Dupont wants to know the IRR of each alternative, assuming LVS holds the investment for 4 years and then sells it for €12 million.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and La Tour&#x27;s loan requirements, the largest loan (in € millions) that La Tour would offer is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q046.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":47,"q":"Based on Exhibit 1 and compared to using all cash, if the property is purchased for €10 million using the €4 million loan option, LVS's IRR would most likely increase by:","opts":["2.5%","2.8%","9.0%"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a048.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a048.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 42–47 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lucas Moreau is a real estate investment manager for s, with requirements for two key ratios: the loan-to-value ratio (LTV) ratio must be no greater than 60% and the debt service coverage ratio (DSCR) must be at least 1.4. La Tour&#x27;s own estimates and information about the property purchase are shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex010.webp\" style=\"max-width:min(100%,504px)\" alt=\"Exhibit\"><p>LVS may purchase the property with 100% cash or using a €4 million, interest-only loan. Dupont wants to know the IRR of each alternative, assuming LVS holds the investment for 4 years and then sells it for €12 million.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and compared to using all cash, if the property is purchased for €10 million using the €4 million loan option, LVS&#x27;s IRR would most likely increase by:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q047.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":48,"q":"Which of Tian's comments concerning tax treatment is (are) correct?","opts":["Only Comment 1","Only Comment 2","Both Comments 1 and 2"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a049.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a049.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 48–51 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Hu Lao is a fund manager at an asset management company. The firm has recently modified its investment strategy to include real estate. Lao meets with John Tian, a senior analyst at the firm, to discuss implementing the new strategy.<\/p><p>Lao states, &quot;The local market is very attractive right now due to impressive job growth in our city; we should add commercial real estate exposur ound in an investment brochure. Lao is curious as to why market prices are trading at a discount to their net asset values per share (NAVPS). Tian replies with the following explanations as to why REIT share prices are trading at a discount to NAVPS:<\/p><p>Explanation 1: Market prices have more quickly captured recent near-term deterioration in market conditions.<\/p><p>Explanation 2: Public market liquidity allows shares to trade at a discount to NAVPS.<\/p><p>Explanation 3: Corporate income tax rates have dramatically increased recently.<\/p><p>After viewing the brochure, Lao becomes interested in Lakesphere REIT and speaks with Vanessa Vuong, Lakesphere&#x27;s investor relations manager. Vuong tells Lao that Lakesphere&#x27;s NAVPS will be reappraised soon, based on a next-12-month NOI growth rate of 2.5% and a cap rate of 5.0%. After the call, Vuong&#x27;s team finalizes the inputs for updating the NAVPS, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex011.webp\" style=\"max-width:min(100%,484px)\" alt=\"Exhibit\"><p>Later, Lao reviews several hotel REITs with Tian. Tian notices that one REIT has a much lower P/AFFO multiple relative to its peers. Tian asks Lao to investigate this discrepanc<\/p><\/div><\/details><div class=\"qtext\"><p>All else equal, which of the following will most appropriately justify a lower P/AFFO multiple?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q051.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":52,"q":"Based on the hedging pressure hypothesis, all else equal, in the next month the wheat futures curve will most likely:","opts":["stay the same.","shift to contango.","shift to backwardation."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a053.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a053.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 52–57 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Keiko Takeuchi is a commodity trader with Relic Financial. She is reviewing the futures curve for the wheat market and notices that the curve is more-or-less flat over the next 12 months. Several of her clients have mentioned that wheat consumers are increasingly looking to lock in future delivery prices during the next month, while producers&#x27; demand for price protection will remain constant.<\/p><p>A new client contacts Takeuchi to ask about the differences between spot prices and futures prices. Takeuchi responds:<\/p><p><b>Response 1:<\/b> Both spot prices and futures prices are standardized across regions and therefore are universal.<\/p><p><b>Response 2:<\/b> Although standardized, futures prices can be adjusted to reflect potential quality differences across regions.<\/p><p><b>Response 3:<\/b> Cash settlement of a futures contract upon expiration ensures price convergence between the futures and spot prices.<\/p><p>Asahi Hara, another client of Relic, wants to roll over a futures position in silver. The futures contract expires in March, and Hara wishes to roll over half of the position to a May contract. Takeuchi collects the following data on the position and the relevant contracts:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex012.webp\" style=\"max-width:min(100%,408px)\" alt=\"Exhibit\"><p>Hara also has a $100,000 position in April expiry crude oil futures that he wishes to roll over until July while maintaining the same exposure. Takeuchi collects the following data on the relevant contracts:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex013.webp\" style=\"max-width:min(100%,424px)\" alt=\"Exhibit\"><p>Finally, Hara is considering adding an investment in livestock futures and asks Takeuchi for investing alternatives and information on the market. Takeuchi tells Hara that livestock in the US is exported less than other commodities.<\/p><p>Takeuchi then talks to Setsuko Inoue, a fixed income trader with Relic. She and Takeuchi discuss valuations of their respective asset classes and make the following statements:<\/p><p>Inoue:Fixed income valuation is fundamentally different from commodity valuation. Although fixed income valuation is based on profitability and cash flow expectations, commodity valuation is based on expectations for supply and demand.<\/p><p><b>Takeuchi:<\/b> Commodities are always physical assets and, therefore, considerations like storage must be accounted for, adding to the complexity of forecasting.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the hedging pressure hypothesis, all else equal, in the next month the wheat futures curve will most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q052.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":53,"q":"Which of Takeuchi's responses about spot and futures prices is correct?","opts":["Response 1","Response 2","Response 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a054.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a054.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 52–57 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Keiko Takeuchi is a commodity trader with Relic Financial. She is reviewing the futures curve for the wheat market and notices that the curve is more-or-less flat over the next 12 months. Several of her clients have mentioned that wheat consumers are increasingly looking to lock in future delivery prices during the next month, while producers&#x27; demand for price protection will remain constant.<\/p><p>A new client contacts Takeuchi to ask about the differences between spot prices and futures prices. Takeuchi responds:<\/p><p><b>Response 1:<\/b> Both spot prices and futures prices are standardized across regions and therefore are universal.<\/p><p><b>Response 2:<\/b> Although standardized, futures prices can be adjusted to reflect potential quality differences across regions.<\/p><p><b>Response 3:<\/b> Cash settlement of a futures contract upon expiration ensures price convergence between the futures and spot prices.<\/p><p>Asahi Hara, another client of Relic, wants to roll over a futures position in silver. The futures contract expires in March, and Hara wishes to roll over half of the position to a May contract. Takeuchi collects the following data on the position and the relevant contracts:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex012.webp\" style=\"max-width:min(100%,408px)\" alt=\"Exhibit\"><p>Hara also has a $100,000 position in April expiry crude oil futures that he wishes to roll over until July while maintaining the same exposure. Takeuchi collects the following data on the relevant contracts:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex013.webp\" style=\"max-width:min(100%,424px)\" alt=\"Exhibit\"><p>Finally, Hara is considering adding an investment in livestock futures and asks Takeuchi for investing alternatives and information on the market. Takeuchi tells Hara that livestock in the US is exported less than other commodities.<\/p><p>Takeuchi then talks to Setsuko Inoue, a fixed income trader with Relic. She and Takeuchi discuss valuations of their respective asset classes and make the following statements:<\/p><p>Inoue:Fixed income valuation is fundamentally different from commodity valuation. Although fixed income valuation is based on profitability and cash flow expectations, commodity valuation is based on ly different from commodity valuation. Although fixed income valuation is based on profitability and cash flow expectations, commodity valuation is based on expectations for supply and demand.<\/p><p><b>Takeuchi:<\/b> Commodities are always physical assets and, therefore, considerations like storage must be accounted for, adding to the complexity of forecasting.<\/p><\/div><\/details><div class=\"qtext\"><p>From their discussion about valuations, which statements) is(are) correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q057.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":58,"q":"Which of Beltran's statements is correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a059.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a059.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 58–61 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Thalia Beltran is a recently hired associate at Galant Equity Partners, a private equity (PE) firm specializing in leveraged buyouts (LBO). She is assigned to work with Horace Curtis, a managing director in charge of Galant&#x27;s investment in Fagioli Restaurants, a casual dining restaurant chain.<\/p><p>Curtis wants to assess Beltran&#x27;s knowledge and asks about the sources of value creation in PE investments. Beltran makes the following statements:<\/p><p><b>Statement 1:<\/b> PE firms create value by reengineering acquired companies, whereas public companies do not have that capability.<\/p><p><b>Statement 2:<\/b> PE firms execute buyouts using large amounts of debt with restrictive covenants, reducing the cost of capital.<\/p><p><b>Statement 3:<\/b> Managers from acquired companies typically become more efficient due to PE firms&#x27; focus on short-term results.<\/p><p>Curtis explains to Beltran that Fagioli Restaurants is well positioned in the casual dining industry and has been generating consistent amounts of cash flow in recent years. He adds that Galant, as an LBO firm, seeks investments with a similar profile, whereas venture capital (VC) firms typically invest in early-stage companies, which have less predictable cash flows. He asks Beltran if she knows other characteristics of VC firms.<\/p><p>Curtis says that he is currently discussing the sale of Fagioli Restaurants to a strategic buyer. He asks Beltran to estimate Galant&#x27;s multiple of expected proceeds from the investment and provides the following information:<\/p><p>Galant acquired 100% of Fagioli four years ago for $200 million.<\/p><p>The initial investment was 65% financed from payment-in-kind (PIK) coupon bonds, with annual interest of 10%.<\/p><p>Galant&#x27;s equity investment consisted of $40 million in preferred stock with a 15% annual return (paid at exit) and $30 million of common stock.<\/p><p>The strategic buyer is offering $317 million for 100% of Fagioli.<\/p><p>Curtis tells Beltran that Galant originally expected to sell Fagioli for a greater exit multiple. However, he believes that Fagioli did not perform as well as expected due to a misalignment of interests between the PE firm and Fagioli&#x27;s management team. Beltran asks Curtis for examples of measures that a PE firm could implement to provide the right incentives to the management team of a portfolio company.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Beltran&#x27;s statements is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q058.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":59,"q":"Venture capital firms typically:","opts":["do not charge transaction fees and monitoring fee \/p><p><b>Statement 1:<\/b> PE firms create value by reengineering acquired companies, whereas public companies do not have that capability.<\/p><p><b>Statement 2:<\/b> PE firms execute buyouts using large amounts of debt with restrictive covenants, reducing the cost of capital.<\/p><p><b>Statement 3:<\/b> Managers from acquired companies typically become more efficient due to PE firms&#x27; focus on short-term results.<\/p><p>Curtis explains to Beltran that Fagioli Restaurants is well positioned in the casual dining industry and has been generating consistent amounts of cash flow in recent years. He adds that Galant, as an LBO firm, seeks investments with a similar profile, whereas venture capital (VC) firms typically invest in early-stage companies, which have less predictable cash flows. He asks Beltran if she knows other characteristics of VC firms.<\/p><p>Curtis says that he is currently discussing the sale of Fagioli Restaurants to a strategic buyer. He asks Beltran to estimate Galant&#x27;s multiple of expected proceeds from the investment and provides the following information:<\/p><p>Galant acquired 100% of Fagioli four years ago for $200 million.<\/p><p>The initial investment was 65% financed from payment-in-kind (PIK) coupon bonds, with annual interest of 10%.<\/p><p>Galant&#x27;s equity investment consisted of $40 million in preferred stock with a 15% annual return (paid at exit) and $30 million of common stock.<\/p><p>The strategic buyer is offering $317 million for 100% of Fagioli.<\/p><p>Curtis tells Beltran that Galant originally expected to sell Fagioli for a greater exit multiple. However, he believes that Fagioli did not perform as well as expected due to a misalignment of interests between the PE firm and Fagioli&#x27;s management team. Beltran asks Curtis for examples of measures that a PE firm could implement to provide the right incentives to the management team of a portfolio company.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following most likely aligns the interests of a PE firm and a portfolio company&#x27;s management team?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q061.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":62,"q":"Which of Li's statements on Tailwind's fund structure is incorrect?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a063.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a063.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 62–67 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Chao Li is a vice president at Tailwind Capital, a private equity (PE) firm. He is currently raising £100 million for Tailwind Fund A. Li meets with An Heng, an associate at Insular Insurance Co., a potential institutional investor. In their meeting, Li explains the general structure of PE funds to Heng:<\/p><p><b>Statement 1:<\/b> The limited partners (LPs) and the general partner (GP) in a private equity fund participate in managing the fund.<\/p><p><b>Statement 2:<\/b> The GP is entitled to carried interest, which is typically a percentage of the fund&#x27;s profits after management fees.<\/p><p><b>Statement 3:<\/b> PE funds are closed-end funds, so LPs can redeem their investments only at specified times.<\/p><p>Heng says, &quot;I understand there are costs associated with investing in PE, such as significant performance fees, dilution costs whenever the PE firm starts new funds, and annual audit costs. And I know that there are some agency risks involved with investing in a PE fund. Is there a governance provision that would address GP gross negligence?&quot;<\/p><p>Subsequently, Li raises the full £100 million for Fund A. One of the fund&#x27;s investments is ModernWare, an online services company. The initial investment is £20 million: £13 million in debt, £2 million in preferred equity, and £5 million in the PE fund&#x27;s equity. Tailwind plans to sell ModernWare 5 years from now and plans to reduce the debt balance by £10 million by the time of exit. The promised return for the preferred equity holders is 15%.<\/p><p>Several years after the fund&#x27;s inception, Tailwind exits two investments: StoneWare and BronzeWare (Exhibit 1). Carried interest to the GP is accrued on a deal-by-deal basis and equals 20% of the profits from each exit. The hurdle rate is 10%. When a deal&#x27;s IRR is above the hurdle rate, carried interest is accrued; when a deal&#x27;s IRR is below the hurdle rate, a clawback penalty amount is accrued if there is a loss.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex014.webp\" style=\"max-width:min(100%,506px)\" alt=\"Exhibit\"><p>Twelve years after the fund&#x27;s inception, Li meets with Heng again to review Fund A&#x27;s performance, shown in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex015.webp\" style=\"max-width:min(100%,639px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of Li&#x27;s statements on Tailwind&#x27;s fund structure is incorrect?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q062.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":63,"q":"Which governance provision most likely addresses GP gross negligence?","opts":["No-fault divorce","Key man clause","Removal for cause"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a064.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a064.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span bit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2, the total realized return for every unit of capital raised for Fund A is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q067.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":68,"q":"Which of the risks about real estate identified by Herrera is correct?","opts":["Risk 1","Risk 2","Risk 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a069.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a069.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 68–73 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Eduardo Herrera, a private wealth manager, is discussing portfolio diversification with a client, Ana Castillo. Castillo&#x27;s investment portfolio consists currently of only stocks and bonds (ie, traditional assets), and Herrera suggests adding real estate to the portfolio since real estate is less than perfectly correlated with such assets. Castillo asks about the risks of real estate, and Herrera responds:<\/p><p>Risk 1:Although rents often remain steady throughout the business cycle, excess supply can affect occupancy rates.<\/p><p>Risk 2:Short-term leases increase the risk of declines in real rental income during periods of higher-than-expected inflation.<\/p><p>Risk 3:Real estate competes with other assets for debt and equity capital, and this competition can lower prices when there are shortages of capital.<\/p><p>Herrera tells Castillo that REITs offer an easy way to gain exposure to real estate. He says that NAV is an optimal starting point to estimate a REIT&#x27;s value.<\/p><p>After reviewing her options, Castillo is interested in direct real estate investments. Herrera tells Castillo about Property 1, a retail property where all the leases are structured so that the tenants&#x27; rents increase once their sales reach a certain level. He thinks a property with this type of lease is well positioned to take advantage of an expected rise in consumer spending.<\/p><p>Herrera also notes that he prefers to use the income method to value real estate properties. Castillo asks why the values obtained using the direct capitalization and discounted cash flow (DCF) methods differ.<\/p><p>In response, Herrera explains that although both methods are based on a property&#x27;s income, they apply income differently, and that he will use both the direct capitalization and DCF valuation methods. He provides Castillo with the following information about Property 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex016.webp\" style=\"max-width:min(100%,446px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of the risks about real estate identified by Herrera is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q068.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":69,"q":"Which of the following would Castillo most appropriately include in a calculation of a REIT's NAV?","opts":["Brand name","Deferred tax assets","Land held for future development"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a070.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a070.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 68–73 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Eduardo Herrera, a private wealth manager, is discussing portfolio diversification with a client, Ana Castillo. C ail property where all the leases are structured so that the tenants&#x27; rents increase once their sales reach a certain level. He thinks a property with this type of lease is well positioned to take advantage of an expected rise in consumer spending.<\/p><p>Herrera also notes that he prefers to use the income method to value real estate properties. Castillo asks why the values obtained using the direct capitalization and discounted cash flow (DCF) methods differ.<\/p><p>In response, Herrera explains that although both methods are based on a property&#x27;s income, they apply income differently, and that he will use both the direct capitalization and DCF valuation methods. He provides Castillo with the following information about Property 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex016.webp\" style=\"max-width:min(100%,446px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and using the DCF valuation method, the current value of the property (in BRL millions) is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q072.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":73,"q":"Which of the following would be the most appropriate response to Castillo's question about differences between the direct capitalization and DCF valuation methods? Unlike the direct capitalization method, the DCF method:","opts":["applies an implicit growth rate.","removes capital spending from income.","uses current and future net operating income."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a074.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a074.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 68–73 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Eduardo Herrera, a private wealth manager, is discussing portfolio diversification with a client, Ana Castillo. Castillo&#x27;s investment portfolio consists currently of only stocks and bonds (ie, traditional assets), and Herrera suggests adding real estate to the portfolio since real estate is less than perfectly correlated with such assets. Castillo asks about the risks of real estate, and Herrera responds:<\/p><p>Risk 1:Although rents often remain steady throughout the business cycle, excess supply can affect occupancy rates.<\/p><p>Risk 2:Short-term leases increase the risk of declines in real rental income during periods of higher-than-expected inflation.<\/p><p>Risk 3:Real estate competes with other assets for debt and equity capital, and this competition can lower prices when there are shortages of capital.<\/p><p>Herrera tells Castillo that REITs offer an easy way to gain exposure to real estate. He says that NAV is an optimal starting point to estimate a REIT&#x27;s value.<\/p><p>After reviewing her options, Castillo is interested in direct real estate investments. Herrera tells Castillo about Property 1, a retail property where all the leases are structured so that the tenants&#x27; rents increase once their sales reach a certain level. He thinks a property with this type of lease is well positioned to take advantage of an expected rise in consumer spending.<\/p><p>Herrera also notes that he prefers to use the income method to value real estate properties. Castillo asks why the values obtained using the direct capitalization and discounted cash flow (DCF) methods differ.<\/p><p>In response, Herrera explains that although both methods are based on a property&#x27;s income, they apply income differently, and that he will use both the direct capitalization and DCF valuation methods. He provides Castillo with the following information about Property 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex016.webp\" style=\"max-width:min(100%,446px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of the following would be the most appropriate response to Castillo&#x27;s question about differences between the direct capitalization and DCF valuation methods? Unlike the direct capitalization method, the DCF method:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q073.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":74,"q":"Statement 1 is incorrect regarding:","opts":["borrowing debt at favorable terms.","reengineering portfolio companies.","reducing conflicts of interest by separating ownership and control."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a075.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a075.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 74–79 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Barry Bohana is a new analyst at Turtlerock Partners (Turtlerock) a private equity (PE) firm. Bohana is tasked to meet Malia Mochi, a wealthy client who wants to learn about investing in private equity. During the meeting, Bohana makes the following statements:<\/p><p><b>Statement 1:<\/b> Private equity firms create value by reengineering portfolio companies, borrowing debt at favorable terms, and reducing conflicts of interest by separating ownership and control.<\/p><p><b>Statement 2:<\/b> Private equity investments can be broadly categorized into venture capital (VC) and buyout (LBO) funds. VC investments are primarily funded with debt, have low cash predictability, and have a well-defined route-to-market strategy.<\/p><p>Next, Bohana presents information (Exhibit 1) for a leveraged buyout opportunity of Baluga Corp. (Baluga), a jewelry manufacturer.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex017.webp\" style=\"max-width:min(100%,429px)\" alt=\"Exhibit\"><p>In addition, Bohana makes the following stipulations related to Baluga at exit, after an expected holding period of five years:<\/p><p>debt is expected to have been reduced by $45 million,<\/p><p>preference shareholders are promised a 15% annual return,<\/p><p>PE fund equity is promised 95% of the firm&#x27;s residual value after creditors and preference shareholders are paid, and<\/p><p>management is promised the remaining 5% of the firm&#x27;s residual value.<\/p><p>Mochi responds by asking to see Turtlerock&#x27;s funds&#x27; performance history. Bohana addresses Mochi&#x27;s request by presenting a historical performance for Orca Fund, Turtlerock&#x27;s primary fund. Bohana clarifies that carried interest is initially calculated from the difference between NAV before distributions and committed capital, and subsequently calculated from the difference between NAV before distributions in any given year and NAV before distributions in the prior year.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/wx074.webp\" style=\"max-width:min(100%,478px)\" alt=\"Exhibit\"><p>Mochi wants to interpret the schedule and asks for the realized return metric for Orca Fund. Bohana responds by saying, &quot;the appropriate measure of PE realized returns is total value to paid-in capital (TVPI). The TVPI for Orca is 2.79x.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Statement 1 is incorrect regarding:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q074.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":75,"q":"When addressing venture capital investments, Statement 2 is correct regarding:","opts":["debt funding.","route-to-market.","cash predictability."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWo for that sector. Redmond explains to Jerold the main characteristics of the hotel sector and how returns are affected by various factors.<\/p><p>Jerold then meets with Leroy Langston, a commercial real estate broker, to better understand the different categories of commercial real estate. Langston explains that the primary commercial property types are office, industrial, retail, and multifamily, and makes the following statements:<\/p><p><b>Statement 1:<\/b> A percentage lease is a feature unique to retail properties for which the rent is based on a constant percentage of the total sales.<\/p><p><b>Statement 2:<\/b> In a gross lease, the property owner is responsible for operating expenses, which increases the risk for the owner.<\/p><p><b>Statement 3:<\/b> The demand for multifamily rental properties will decrease if the cost of owning a home is more than the cost of renting.<\/p><p>Langston markets a 100-unit apartment complex selling for $30 million to Jerold, who meets with the property&#x27;s management team to gather information for due diligence. During the meeting, Jerold reviews the costs and incentives that are provided to the renewing tenants and new tenants.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Redmond&#x27;s description, Hightower Realty Capital most likely invests primarily in:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q080.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":81,"q":"Which of the following economic factors most likely has the greatest impact on the hotel real estate sector?","opts":["Retail sales and consumer spending","Household formation and personal income","Business confidence and consumer confidence"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a082.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img els and wants to understand the major factors that impact returns for that sector. Redmond explains to Jerold the main characteristics of the hotel sector and how returns are affected by various factors.<\/p><p>Jerold then meets with Leroy Langston, a commercial real estate broker, to better understand the different categories of commercial real estate. Langston explains that the primary commercial property types are office, industrial, retail, and multifamily, and makes the following statements:<\/p><p><b>Statement 1:<\/b> A percentage lease is a feature unique to retail properties for which the rent is based on a constant percentage of the total sales.<\/p><p><b>Statement 2:<\/b> In a gross lease, the property owner is responsible for operating expenses, which increases the risk for the owner.<\/p><p><b>Statement 3:<\/b> The demand for multifamily rental properties will decrease if the cost of owning a home is more than the cost of renting.<\/p><p>Langston markets a 100-unit apartment complex selling for $30 million to Jerold, who meets with the property&#x27;s management team to gather information for due diligence. During the meeting, Jerold reviews the costs and incentives that are provided to the renewing tenants and new tenants.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Langston&#x27;s statements is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q082.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":83,"q":"In which stage of the due diligence process is Jerold's review of the costs and incentives provided to new and existing rentals most appropriate?","opts":["Lease and rent review","Review of documentation","Review of the cost of re-leasing"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a084.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a084.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 80–83 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rylan Jerold is the chief investment officer at the Crest family office and oversees their large investment portfolio. The Crest family wants to add real estate to their traditional stock and bond portfolio. Jerold is new to real estate investing and schedules several meetings to learn about potential opportunities.<\/p><p>First, Jerold meets with his friend Richard Redmond, a vice president at Hightower Realty Capital. Redmond describes Hightower&#x27;s primary investment approach:<\/p><p>&quot;Hightower typically takes passive ownership stakes in properties with large minimum capital requirements and long capital lockup periods. We benefit primarily from income and capital appreciation.&quot;<\/p><p>Jerold mentions the Crest family&#x27;s interest in investing in hotels and wants to understand the major factors that impact returns for that sector. Redmond explains to Jerold the main characteristics of the hotel sector and how returns are affected by various factors.<\/p><p>Jerold then meets with Leroy Langston, a commercial real estate broker, to better understand the different categories of commercial real estate. Langston explains that the primary commercial property types are office, industrial, retail, and multifamily, and makes the following statements:<\/p><p><b>Statement 1:<\/b> A percentage lease is a feature unique to retail properties for which the rent is based on a constant percentage of the total sales.<\/p><p><b>Statement 2:<\/b> In a gross lease, the property owner is responsible for operating expenses, which increases the risk for the owner.<\/p><p><b>Statement 3:<\/b> The demand for multifamily rental properties will decrease if the cost of owning a home is more than the cost of renting.<\/p><p>Langston markets a 100-unit apartment complex selling for $30 million to Jerold, who meets with the property&#x27;s management team to gather information for due diligence. During the meeting, Jerold reviews the costs and incentives that are provided to the renewing tenants and new tenants.<\/p><\/div><\/details><div class=\"qtext\"><p>In which stage of the due diligence process is Jerold&#x27;s review of the costs and incentives provided to new and existing rentals most appropriate?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q083.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":84,"q":"Compared with directly investing in real estate, which of the following is a drawback to investing in REITs?","opts":["Higher price volatility","Less corporate tax efficiency","Lack of access to professional management"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a085.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a085.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 84–87 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Diana Dragomir is the chief investment officer at WestPacific Regional Bank. WestPacific&#x27;s board recently decided to diversify the bank&#x27;s assets by investing in real estate. Dragomir meets with Vivek Varghese, the investment committee chair, to discuss possibly including publicly traded real estate securities in the investment strategy.<\/p><p>Dragomir tells Varghese that &quot;compared with directly investing in real estate, there are many advantages to investing in publicly traded REITs, such as superior liquidity, lower investment minimums, and greater transparency.&quot; Varghese agrees with those benefits but also wants to know the drawbacks to investing in REITs.<\/p><p>Varghese then asks how REITs are valued. Dragomir replies that REITs can be valued through methods such as net asset value per share (NAVPS), price multiples, and discounted cash flow. She further explains that NAVPS is based on a REIT&#x27;s net assets, and she makes the following statements:<\/p><p><b>Statement 1:<\/b> NAVPS also includes non-real estate asset components.<\/p><p><b>Statement 2:<\/b> NAVPS is based on book value per share of assets.<\/p><p><b>Statement 3:<\/b> All else equal, a higher cap rate results in a higher NAVPS.<\/p><p>Dragomir then explains how REITs are valued using price multiples. Dragomir demonstrates an estimated valuation for Oceanwave REIT and explains that this valuation includes Oceanwave&#x27;s noncash rent. Oceanwave has 108 million shares outstanding, and the price per share is $50. Other data for Oceanwave is shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex018.webp\" style=\"max-width:min(100%,450px)\" alt=\"Exhibit\"><p>In the afternoon, Dragomir spots a post on social media for AVTD Holding Company. The post explains that AVTD primarily develops and sells properties, reinvests significant portions of its profits, and offers brokerage and property management services.<\/p><\/div><\/details><div class=\"qtext\"><p>Compared with directly investing in real estate, which of the following is a drawback to investing in REITs?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q084.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":85,"q":"Which of Dragomir's statements concerning NAVPS is correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a086.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" sr ls properties, reinvests significant portions of its profits, and offers brokerage and property management services.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following types of investment vehicles is best described by the social media post?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q087.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":88,"q":"Which of Daniela's explanations of real estate valuation approaches is correct?","opts":["Approach 1","Approach 2","Approach 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a089.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a089.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 88–91 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Marcel Jaga is a high-net-worth investor who has traditionally invested in stocks and bonds. Jaga wants to diversify his portfolio by investing in real estate. Jaga meets with his friend Lea Daniela, an experienced real estate investor, to learn more and potentially partner together on future opportunities. Daniela explains that there are three common approaches to valuation:<\/p><p><b>Approach 1:<\/b> The cost approach is based on the cost of the land and the building&#x27;s current replacement cost net of any depreciation or obsolescence.<\/p><p><b>Approach 2:<\/b> The sales comparison approach is based on comparisons to historical sales transactions over long periods.<\/p><p><b>Approach 3:<\/b> The gross income multiplier is an income approach that factors in vacancy rates and operating expenses when estimating property values.<\/p><p>Daniela states that under the income approach there are two methods: the direct capitalization (direct cap) method and the discounted cash flow (DCF) method. Daniela elaborates with the following statements:<\/p><p><b>Statement 1:<\/b> Under the direct cap method, a lower growth rate results in a higher cap rate, which results in a lower valuation.<\/p><p><b>Statement 2:<\/b> Under the DCF method, a cap rate is not needed since the value of a property is derived by discounting projected cash flows.<\/p><p><b>Statement 3:<\/b> The cap rate used in the direct cap method is the residual cap rate.<\/p><p>Next Daniela informs Jaga that she is currently assessing a multi-family opportunity; if she purchases the property, she plans on selling it at the end of Year 4. She plans to use both the direct cap method and the DCF method for valuation, averaging the values from both approaches. She collects the following data, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex019.webp\" style=\"max-width:min(100%,388px)\" alt=\"Exhibit\"><p>A few weeks later, a real estate broker approaches Jaga with a different investment opportunity. Jaga accepts the deal and then visits a bank to obtain an interest-only loan. The loan officer gathers relevant information, shown in Exhibit 2, to assess the maximum loan amount available.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex020.webp\" style=\"max-width:min(100%,343px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of Daniela&#x27;s explanations of real estate valuation approaches is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q088.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":89,"q":"Which of Daniela's statements is correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a090.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\" value (in €) is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q090.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":91,"q":"Based on Exhibit 2, the maximum loan amount (in € millions) available from the bank is closest to:","opts":["16.00","16.23","16.46"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a092.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a092.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 88–91 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marcel Jaga is a high-net-worth investor who has traditionally invested in stocks and bonds. Jaga wants to diversify his portfolio by investing in real estate. Jaga meets with his friend Lea Daniela, an experienced real estate investor, to learn more and potentially partner together on future opportunities. Daniela explains that there are three common approaches to valuation:<\/p><p><b>Approach 1:<\/b> The cost approach is based on the cost of the land and the building&#x27;s current replacement cost net of any depreciation or obsolescence.<\/p><p><b>Approach 2:<\/b> The sales comparison approach is based on comparisons to historical sales transactions over long periods.<\/p><p><b>Approach 3:<\/b> The gross income multiplier is an income approach that factors in vacancy rates and operating expenses when estimating property values.<\/p><p>Daniela states that under the income approach there are two methods: the direct capitalization (direct cap) method and the discounted cash flow (DCF) method. Daniela elaborates with the following statements:<\/p><p><b>Statement 1:<\/b> Under the direct cap method, a lower growth rate results in a higher cap rate, which results in a lower valuation.<\/p><p><b>Statement 2:<\/b> Under the DCF method, a cap rate is not needed since the value of a property is derived by discounting projected cash flows.<\/p><p><b>Statement 3:<\/b> The cap rate used in the direct cap method is the residual cap rate.<\/p><p>Next Daniela informs Jaga that she is currently assessing a multi-family opportunity; if she purchases the property, she plans on selling it at the end of Year 4. She plans to use both the direct cap method and the DCF method for valuation, averaging the values from both approaches. She collects the following data, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex019.webp\" style=\"max-width:min(100%,388px)\" alt=\"Exhibit\"><p>A few weeks later, a real estate broker approaches Jaga with a different investment opportunity. Jaga accepts the deal and then visits a bank to obtain an interest-only loan. The loan officer gathers relevant information, shown in Exhibit 2, to assess the maximum loan amount available.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex020.webp\" style=\"max-width:min(100%,343px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2, the maximum loan amount (in € millions) available from the bank is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q091.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":92,"q":"Compared to Pillar's crude oil production, its natural gas production is more likely to:","opts":["be extracted on a seasonal basis.","require more refining before it is consumed.","have fewer steps from extraction to the end consumer."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a093.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a093.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 92–97 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Chris Ward is the Chief Financial Officer of Pillar Energy, an integrated oil and gas company. Pillar regularly sells portions of its inventory during different stages of the refining process. Ward is exploring alternatives to hedge the price of Pillar&#x27;s crude oil and natural gas sales to reduce price risk.<\/p><p>The January contract for Brent crude oil, which is the nearest contract to expiration, is currently trading at $73/barrel. The January–March calendar spread is −$4.00/barrel. Based on the type of contract, Ward knows that the convergence of Brent futures and spot rate prices is ensured.<\/p><p>Ward decides to enter an excess return swap to hedge Pillar&#x27;s crude oil risk. The swap will cost Pillar $50 per contract and Pillar will receive the amount exceeding $72/barrel each month over the next year. Ward creates a forecast of the expected crude oil futures prices at delivery over the next 12 months:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex021.webp\" style=\"max-width:min(100%,368px)\" alt=\"Exhibit\"><p>Working for an integrated oil and gas company, Ward believes that he has more information about the future supply and demand dynamics of oil and gas than the average investor. However, he is focused solely on hedging Pillar&#x27;s future production. He realizes that other companies in the industry tend to speculate more.<\/p><p>Ward wishes to estimate what the futures price of natural gas should be in June based on the theory of storage. He gathers the following current data:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex022.webp\" style=\"max-width:min(100%,391px)\" alt=\"Exhibit\"><p>Ward plans to hedge Pillar&#x27;s natural gas production market to market. Pillar produces some of its natural gas in smaller markets that are more thinly traded, but Ward wants to peg the price of this production to the more liquid Henry Hub natural gas. He plans to enter a swap to pay the difference in price between the illiquid markets and the more commonly traded natural gas prices.<\/p><\/div><\/details><div class=\"qtext\"><p>Compared to Pillar&#x27;s crude oil production, its natural gas production is more likely to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q092.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":93,"q":"Based on the January-March calendar spread, Brent crude oil contracts most likely:","opts":["are settled by cash.","are trading in contango.","have a positive roll yield."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a094.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a094.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 92–97 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Chris Ward is the Chief Financial Officer of Pillar Energy, an integrated oil and gas company. Pillar regularly sells portions of its inventory during different stages of the refining process. Ward is exploring alternatives to hedge the price of Pillar&#x27;s crude oil and natural gas sales to reduce price risk.<\/p><p>The January contract for Brent crude oil, which is the nearest contract to expiration, is currently trading at $73/barrel. The January–March calendar spread is −$4.00/barrel. Based on the type of contract, Ward knows that the convergence of Brent futures and spot rate prices is ensured.<\/p><p>Ward decides to enter an excess return swap to hedge Pillar&#x27;s crude oil risk. The swap will cost Pillar $50 per contract and Pillar will receive the amount exceeding $72/barrel each month over the next year. Ward creates a forecast of the expected crude oil futures prices at delivery over the next 12 months:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex021.webp\" style=\"max-width:min(100%,368px)\" alt=\"Exhibit\"><p>Working for an integrated oil and gas company, Ward believes that he has more information about the future supply and demand dynamics of oil and gas than the average investor. However, he is focused solely on hedging Pillar&#x27;s future production. He realizes that other companies in the industry tend to speculate more.<\/p><p>Ward wishes to estimate what the futures price of natural gas should be in June based on the theory of storage. He gathers the following current data:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex022.webp\" style=\"max-width:min(100%,391px)\" alt=\"Exhibit\"><p>Ward plans to hedge Pillar&#x27;s natural gas production market to market. Pillar produces some of its natural gas in smaller markets that are more thinly traded, but Ward wants to peg the price of this production to the more liquid Henry Hub natural gas. He plans to enter a swap to pay the difference in price between the illiquid markets and the more commonly traded natural gas prices.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the January-March calendar spread, Brent crude oil contracts most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q093.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":94,"q":"Assuming Ward's forecasts in Exhibit 1 prove to be accurate, the net amount per contract (in $) that Pillar would receive from the excess return swap is closest to:","opts":["0","15","65"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a095.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img
