<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

<header>

 contracts 3 months out, then rolling them over before expiration. The spot price for copper has remained relatively stable over time.<\/p><p>Chauhan wants to reduce Navigator&#x27;s exposure to the broad commodities market to focus on certain sectors. When picking an index for this strategy, he considers the following factors:<\/p><p>Factor 1: Since commodities are relatively diversified, there is not much difference between production value-weighted and equal-weighted indexes.<\/p><p>Factor 2: Indexes that invest using exchanges around the world make it more expensive for investors to replicate relative to indexes that focus on regional exchanges.<\/p><p>Factor 3: All major indexes use nearby or front-month contracts, so their roll return will be similar for a given commodity sector.<\/p><p>To reduce Navigator&#x27;s exposure, Chauhan takes a short position in a commodities index total return swap with Genesis Financial. After two months, he collects the following swap data:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex001.webp\" style=\"max-width:min(100%,285px)\" alt=\"Exhibit\"><p>Chauhan expects infrastructure investment in developed markets to increase over the next couple years. He plans to shift his portfolio&#x27;s exposure to the commodity sector that is most likely to benefit from increased infrastructure spending. The portfolio&#x27;s exposure to cotton will be reduced to free up funds to pursue this strategy.<\/p><p>Cotton has been part of Chauhan&#x27;s portfolio for six months since the January 20X4 purchase of the June 20X4 contracts. Chauhan just rolled over his June 20X4 contracts to August 20X4 contracts, and collects the following<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex002.webp\" style=\"max-width:min(100%,374px)\" alt=\"Exhibit\"><p>information:<\/p><p>Chauhan is looking to expand into new commodities to diversify his portfolio. The commodities that he is researching are:<\/p><p>Grains<\/p><p>Coffee<\/p><p>Livestock<\/p><p>However, he is concerned about how seasonality affects the supply of these commodities and how that will impact his investment strategy.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following commodities&#x27; supply life cycle is most affected by seasonality?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q006.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":7,"q":"Suzuki's analysis that the economic environment is favorable for Fuji RIC is most appropriately based on which of the following factors?","opts":["Retail sales growth","Business investment","Consumer confidence"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a007.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a007.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 7–12 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Ichika Suzuki is a REIT analyst at a sell-side firm. Her supervisor, Haruki Kimura, has asked her to write a report on Fuji Residential Investment Corporation (Fuji RIC), an apartment REIT. Kimura notes that apartment REITs are a type of multi-family rental property. Suzuki plans to begin the report with an overview of the economic environment, including factors such as retail sales growth, business investment, and consumer confidence. Based on her analysis, the economic environment is favorable for Fuji RIC. Suzuki then collects the financial data for Fuji RIC shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex003.webp\" style=\"max-width:min(100%,565px)\" alt=\"Exhibit\"><p>Kimura mentions that using NAV to value REITs can have drawbacks and suggests doing a discounted cash flow analysis. He provides Suzuki the information in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex004.webp\" style=\"max-width:min(100%,427px)\" alt=\"Exhibit\"><p>Kimura also notes that Fuji RIC has just purchased a large property and asks Suzuki to value the property. Kimura expects Fuji RIC to sell the property in 3 years. He indicates that there are three methods to value the property, and each method can provide a justified valuation. Suzuki collects information on the property:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex005.webp\" style=\"max-width:min(100%,456px)\" alt=\"Exhibit\"><p>Suzuki suggests adding a section to the report about why investors should invest in REITs instead of investing directly in private real estate. Kimura notes several advantages and disadvantages to REIT investments.<\/p><\/div><\/details><div class=\"qtext\"><p>Suzuki&#x27;s analysis that the economic environment is favorable for Fuji RIC is most appropriately based on which of the following factors?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q007.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":8,"q":"Based on Exhibit 1, Fuji RIC's net asset value (NAV) per share (in ·) is closest to:","opts":["5,286","6,250","6,675"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a008.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a008.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 7–12 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ichika Suzuki is a REIT analyst at a sell-side firm. Her supervisor, Haruki Kimura, has asked her to write a report on Fuji Residential Investment Corporation (Fuji RIC), an apartment REIT. Kimura  Haruki Kimura, has asked her to write a report on Fuji Residential Investment Corporation (Fuji RIC), an apartment REIT. Kimura notes that apartment REITs are a type of multi-family rental property. Suzuki plans to begin the report with an overview of the economic environment, including factors such as retail sales growth, business investment, and consumer confidence. Based on her analysis, the economic environment is favorable for Fuji RIC. Suzuki then collects the financial data for Fuji RIC shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex003.webp\" style=\"max-width:min(100%,565px)\" alt=\"Exhibit\"><p>Kimura mentions that using NAV to value REITs can have drawbacks and suggests doing a discounted cash flow analysis. He provides Suzuki the information in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex004.webp\" style=\"max-width:min(100%,427px)\" alt=\"Exhibit\"><p>Kimura also notes that Fuji RIC has just purchased a large property and asks Suzuki to value the property. Kimura expects Fuji RIC to sell the property in 3 years. He indicates that there are three methods to value the property, and each method can provide a justified valuation. Suzuki collects information on the property:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex005.webp\" style=\"max-width:min(100%,456px)\" alt=\"Exhibit\"><p>Suzuki suggests adding a section to the report about why investors should invest in REITs instead of investing directly in private real estate. Kimura notes several advantages and disadvantages to REIT investments.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 3 and using the cost approach, the value of Fuji RIC&#x27;s recently acquired property (in · millions) is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q011.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":12,"q":"In her report, Suzuki should most appropriately note that, compared to investing in private real estate, investing in REITs provides investors with greater:","opts":["variety of strategies.","control over the asset.","regulatory protections."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a012.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a012.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 7–12 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ichika Suzuki is a REIT analyst at a sell-side firm. Her supervisor, Haruki Kimura, has asked her to write a report on Fuji Residential Investment Corporation (Fuji RIC), an apartment REIT. Kimura notes that apartment REITs are a type of multi-family rental property. Suzuki plans to begin the report with an overview of the economic environment, including factors such as retail sales growth, business investment, and consumer confidence. Based on her analysis, the economic environment is favorable for Fuji RIC. Suzuki then collects the financial data for Fuji RIC shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex003.webp\" style=\"max-width:min(100%,565px)\" alt=\"Exhibit\"><p>Kimura mentions that using NAV to value REITs can have drawbacks and suggests doing a discounted cash flow analysis. He provides Suzuki the information in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex004.webp\" style=\"max-width:min(100%,427px)\" alt=\"Exhibit\"><p>Kimura also notes that Fuji RIC has just purchased a large property and asks Suzuki to value the property. Kimura expects Fuji RIC to sell the property in 3 years. He indicates that there are three methods to value the property, and each method can provide a justified valuation. Suzuki collects information on the property:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex005.webp\" style=\"max-width:min(100%,456px)\" alt=\"Exhibit\"><p>Suzuki suggests adding a section to the report about why investors should invest in REITs instead of investing directly in private real estate. Kimura notes several advantages and disadvantages to REIT investments.<\/p><\/div><\/details><div class=\"qtext\"><p>In her report, Suzuki should most appropriately note that, compared to investing in private real estate, investing in REITs provides investors with greater:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q012.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":13,"q":"Which of Sukohn's comments regarding alignment mechanisms is correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a013.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a013.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 13–18 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Sakchai Mali, CFA, is chief investment officer (CIO) of the Kulap University endowment and wants to allocate some capital to private equity (PE) funds. She speaks with two of her analysts, Hulka Sukohn and Wattana Kamon, to learn more about PE investments. Sukohn first discusses how PE firms adopt mechanisms that align their interests with the interests of the portfolio company&#x27;s management team. Sukohn states:<\/p><p><b>Statement 1:<\/b> A noncompete clause prohibits founders from competing against the firm for an indefinite time period.<\/p><p><b>Statement 2:<\/b> Earn-outs enable a PE firm to pay less to acquire a company if the company reaches certain milestones over time.<\/p><p><b>Statement 3:<\/b> PE firms often exert control over the portfolio company through corporate board seats.<\/p><p>Mali is curious about how target companies are valued. Kamon says:<\/p><p><b>Answer 1:<\/b> The replacement cost method is typically used to value mature companies.<\/p><p><b>Answer 2:<\/b> The discounted cash flow approach is typically used to value companies with a long history of profitable operations.<\/p><p><b>Answer 3:<\/b> The relative value approach is often used to value seed-stage companies.<\/p><p>Next, Sukohn discusses the various exit routes and sources of returns for PE investments. Sukohn says that exit routes include initial public offering (IPO), secondary market sale, and management buyout (MBO). He further makes the following comments:<\/p><p><b>Comment 1:<\/b> It is very common for venture capital investments to exit via a leveraged buyout from another PE firm.<\/p><p><b>Comment 2:<\/b> Decreasing the amount of debt outstanding gradually is crucial to enhancing shareholder returns.<\/p><p><b>Comment 3:<\/b> An IPO can yield the highest valuation but can also incur the highest cost.<\/p><p>Soon after these discussions, Kamon leaves the endowment and starts a PE firm, Raintree Partners. The Raintree Fund has:<\/p><p>Committed capital of $200 million<\/p><p>Carried interest of 20%, computed on a deal-by-deal basis<\/p><p>Hurdle rate of 9%<\/p><p>Called 55% of its committed capital at the beginning of the first year, of which<\/p><p>$100 million was invested in Company A<\/p><p>$10 million was invested in Company B<\/p><p>A clawback provision that includes annual true-up (accounting reconciliation)<\/p><p>At the end of the second year, Raintree made $20 million in profit from the exit of Company A. Raintree retained ownership of Company B, which has not changed in value. At the end of the third year, Raintree had a $10 million loss from the exit of Company B.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Sukohn&#x27;s comments regarding alignment mechanisms is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q013.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":14,"q":"Which of Kamon's answers regarding portfolio company valuation is correct?","opts":["Answer 1","Answer 2","Answer 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a014.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a014.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 13–18 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sakchai Mali, CFA, is chief investment officer (CIO) of the Kulap University endowment and wants to allocate some capital to private equity (PE) funds. She speaks with two of her analysts, Hulka Sukohn and Wattana Kamon, to learn more about PE investments. Sukohn first discusses how PE firms adopt mechanisms that align their interests with the interests of the portfolio company&#x27;s management team. Sukohn states:<\/p><p><b>Statement 1:<\/b> A noncompete clause prohibits founders from competing against the firm for an indefinite time period.<\/p><p><b>Statement 2:<\/b> Earn-outs enable a PE firm to pay less to acquire a company if the company reaches certain milestones over time.<\/p><p><b>Statement 3:<\/b> PE firms often exert control over the portfolio company through corporate board seats.<\/p><p>Mali is curious about how target companies are valued. Kamon says:<\/p><p><b>Answer 1:<\/b> The replacement cost method is typically used to value mature companies.<\/p><p><b>Answer 2:<\/b> The discounted cash flow approach is typically used to value companies with a long history of profitable operations.<\/p><p><b>Answer 3:<\/b> The relative value approach is often used to value seed-stage companies.<\/p><p>Next, Sukohn discusses the various exit routes and sources of returns for PE investments. Sukohn says that exit routes include initial public offering (IPO), secondary market sale, and management buyout (MBO). He further makes the following comments:<\/p><p><b>Comment 1:<\/b> It is very common for venture capital investments to exit via a leveraged buyout from another PE firm.<\/p><p><b>Comment 2:<\/b> Decreasing the amount of debt outstanding gradually is crucial to enhancing shareholder returns.<\/p><p><b>Comment 3:<\/b> An IPO can yield the highest valuation but can also incur the highest cost.<\/p><p>Soon after these discussions, Kamon leaves the endowment and starts a PE firm, Raintree Partners. The Raintree Fund has:<\/p><p>Committed capital of $200 million<\/p><p>Carried interest of 20%, computed on a deal-by-deal basis<\/p><p>Hurdle rate of 9%<\/p><p>Called 55% of its committed capital at the beginning of the first year, of which<\/p><p>$100 million was invested in Company A<\/p><p>$10 million was invested in Company B<\/p><p>A clawback provision that includes annual true-up (accounting reconciliation)<\/p><p>At the end of the second year, Raintree made $20 million in profit from the exit of Company A. Raintree retained ownership of Company B, which has not changed in value. At the end of the third year, Raintree had a $10 million loss from the exit of Company B.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Kamon&#x27;s answers regarding portfolio company valuation is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q014.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":15,"q":"Which of Sukohn's comments on exit routes and sources of returns is incorrect?","opts":["Comment 1","Comment 2","Comment 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc a a leveraged buyout from another PE firm.<\/p><p><b>Comment 2:<\/b> Decreasing the amount of debt outstanding gradually is crucial to enhancing shareholder returns.<\/p><p><b>Comment 3:<\/b> An IPO can yield the highest valuation but can also incur the highest cost.<\/p><p>Soon after these discussions, Kamon leaves the endowment and starts a PE firm, Raintree Partners. The Raintree Fund has:<\/p><p>Committed capital of $200 million<\/p><p>Carried interest of 20%, computed on a deal-by-deal basis<\/p><p>Hurdle rate of 9%<\/p><p>Called 55% of its committed capital at the beginning of the first year, of which<\/p><p>$100 million was invested in Company A<\/p><p>$10 million was invested in Company B<\/p><p>A clawback provision that includes annual true-up (accounting reconciliation)<\/p><p>At the end of the second year, Raintree made $20 million in profit from the exit of Company A. Raintree retained ownership of Company B, which has not changed in value. At the end of the third year, Raintree had a $10 million loss from the exit of Company B.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Sukohn&#x27;s comments on exit routes and sources of returns is incorrect?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q015.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":16,"q":"For the Raintree Fund, the carried interest (in $ millions) owed to the general partner (GP) for Year 2 is closest to:","opts":["0","4","24"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a016.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a016.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 13–18 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-bo illion<\/p><p>Carried interest of 20%, computed on a deal-by-deal basis<\/p><p>Hurdle rate of 9%<\/p><p>Called 55% of its committed capital at the beginning of the first year, of which<\/p><p>$100 million was invested in Company A<\/p><p>$10 million was invested in Company B<\/p><p>A clawback provision that includes annual true-up (accounting reconciliation)<\/p><p>At the end of the second year, Raintree made $20 million in profit from the exit of Company A. Raintree retained ownership of Company B, which has not changed in value. At the end of the third year, Raintree had a $10 million loss from the exit of Company B.<\/p><\/div><\/details><div class=\"qtext\"><p>For the Raintree Fund, the carried interest (in $ millions) owed to the general partner (GP) for Year 2 is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q016.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":17,"q":"Alternatively, if the Raintree Fund's carried interest had been paid instead on a total return basis, requiring portfolio value to exceed committed capital, the resulting carried interest (in $ millions) paid to the GP for Year 2 would have been closest to:","opts":["0","4","24"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a017.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a017.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 13–18 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sakchai Mali, CFA, is chief investment officer (CIO) of the Kulap University endowment and wants to allocate some capital to private equity (PE) funds. She speaks with two of her analysts, Hulka Sukohn and Wattana Kamon, to learn more about PE investments. Sukohn first discusses how PE firms adopt mechanisms that align their interests with the interests of the portfolio company&#x27;s management team. Sukohn states:<\/p><p><b>Statement 1:<\/b> A noncompete clause prohibits founders from competing against the firm for an indefinite time period.<\/p><p><b>Statement 2:<\/b> Earn-outs enable a PE firm to pay less to acquire a company if the company reaches certain milestones over time.<\/p><p><b>Statement 3:<\/b> PE firms often exert control over the portfolio company through corporate board seats.<\/p><p>Mali is curious about how target companies are valued. Kamon says:<\/p><p><b>Answer 1:<\/b> The replacement cost method is typically used to value mature companies.<\/p><p><b>Answer 2:<\/b> The discounted cash flow approach is typically used to value companies with a long history of profitable operations.<\/p><p><b>Answer 3:<\/b> The relative value approach is often used to value seed-stage companies.<\/p><p>Next, Sukohn discusses the various exit routes and sources of returns for PE investments. Sukohn says that exit routes include initial public offering (IPO), secondary market sale, and management buyout (MBO). He further makes the following comments:<\/p><p><b>Comment 1:<\/b> It is very common for venture capital investments to exit via a leveraged buyout from another PE firm.<\/p><p><b>Comment 2:<\/b> Decreasing the amount of debt outstanding gradually is crucial to enhancing shareholder returns.<\/p><p><b>Comment 3:<\/b> An IPO can yield the highest valuation but can also incur the highest cost.<\/p><p>Soon after these discussions, Kamon leaves the endowment and starts a PE firm, Raintree Partners. The Raintree Fund has:<\/p><p>Committed capital of $200 million<\/p><p>Carried interest of 20%, computed on a deal-by-deal basis<\/p><p>Hurdle rate of 9%<\/p><p>Called 55% of its committed capital at the beginning of the first year, of which<\/p><p>$100 million was invested in Company A<\/p><p>$10 million was invested in Company B<\/p><p>A clawback provision that includes annual true-up (accounting reconciliation)<\/p><p>At the end of the second year, Raintree made $20 million in profit from the exit of Company A. Raintree retained ownership of Company B, which has not changed in value. At the end of the third year, Raintree had a $10 million loss from the exit of Company B.<\/p><\/div><\/details><div class=\"qtext\"><p>Alternatively, if the Raintree Fund&#x27;s carried interest had been paid instead on a total return basis,<\/p><p>requiring portfolio value to exceed committed capital, the resulting carried interest (in $ millions) paid to the GP for Year 2 would have been closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q017.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":18,"q":"Based on the clawback provision, the amount (in $ millions) the GP owes the limited partners (LPs) in Year 3 is closest to:","opts":["0","2","4"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a018.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a018.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 13–18 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sakchai Mali, CFA, is chief investment officer (CIO) of the Kulap University endowment and wants to allocate some capital to private equity (PE) funds. She speaks with two of her analysts, Hulka Sukohn and Wattana Kamon, to learn more about PE investments. Sukohn first discusses how PE firms adopt mechanisms that align their interests with the interests of the portfolio company&#x27;s management team. Sukohn states:<\/p><p><b>Statement 1:<\/b> A noncompete clause prohibits founders from competing against the firm for an indefinite time period.<\/p><p><b>Statement 2:<\/b> Earn-outs enable a PE firm to pay less to acquire a company if the company reaches certain milestones over time.<\/p><p><b>Statement 3:<\/b> PE firms often exert control over the portfolio company through corporate board seats.<\/p><p>Mali is curious about how target companies are valued. Kamon says:<\/p><p><b>Answer 1:<\/b> The replacement cost method is typically used to value mature companies.<\/p><p><b>Answer 2:<\/b> The discounted cash flow approach is typically used to value companies with a long history of profitable operations.<\/p><p><b>Answer 3:<\/b> The relative value approach is often used to value seed-stage companies.<\/p><p>Next, Sukohn discusses the various exit routes and sources of returns for PE investments. Sukohn says that exit routes include initial public offering (IPO), secondary market sale, and management buyout (MBO). He further makes the following comments:<\/p><p><b>Comment 1:<\/b> It is very common for venture capital investments to exit via a leveraged buyout from another PE firm.<\/p><p><b>Comment 2:<\/b> Decreasing the amount of debt outstanding gradually is crucial to enhancing shareholder returns.<\/p><p><b>Comment 3:<\/b> An IPO can yield the highest valuation but can also incur the highest cost.<\/p><p>Soon after these discussions, Kamon leaves the endowment and starts a PE firm, Raintree Partners. The Raintree Fund has:<\/p><p>Committed capital of $200 million<\/p><p>Carried interest of 20%, computed on a deal-by-deal basis<\/p><p>Hurdle rate of 9%<\/p><p>Called 55% of its committed capital at the beginning of the first year, of which<\/p><p>$100 million was invested in Company A<\/p><p>$10 million was invested in Company B<\/p><p>A clawback provision that includes annual true-up (accounting reconciliation)<\/p><p>At the end of the second year, Raintree made $20 million in profit from the exit of Company A. Raintree retained ownership of Company B, which has not changed in value. At the end of the third year, Raintree had a $10 million loss from the exit of Company B.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the clawback provision, the amount (in $ millions) the GP owes the limited partners (LPs) in Year 3 is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q018.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":19,"q":"Ervand's explanation of private equity (PE) is incorrect with respect to:","opts":["market risk.","PE fund fees.","debt magnifying returns."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a019.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a019.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 19–24 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Marius Ervand is an associate at Normandy Capital, a private equity (PE) firm focused on leveraged buyouts (LBOs). Ervand is scheduled to meet with Marie Camille, an investment analyst at Bordeaux Pension Fund, a prospective investor. Camille is unfamiliar with PE investments, so Ervand has given her a brief explanation:<\/p><p>&quot;PE funds use debt to magnify returns for investors. As debt is gradually retired over time, more operating cash flows become available to investors. PE funds generally charge higher fees than publicly traded funds such as mutual funds; the difference is partially attributable to high performance fees. PE investments have little to no market risk since portfolio companies are not publicly traded.&quot;<\/p><p>Next, Camille tells Ervand that she wants to assess Normandy&#x27;s historical fund performance, so Ervand selectively presents data on two funds with an original 10-year life (Exhibit 1).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/wx018.webp\" style=\"max-width:min(100%,478px)\" alt=\"Exhibit\"><p>After viewing the data, Camille makes the following comments:<\/p><p>Comment 1: &quot;Fund 1 has distributed €1.39 to investors for every euro invested.&quot;<\/p><p>Comment 2: &quot;If I were a fund investor, gross IRR would be more relevant to me than net IRR.&quot;<\/p><p>Comment 3: &quot;Fund 2&#x27;s low returns can be explained by the J-curve effect.&quot;<\/p><p>A few days later, Ervand meets with Leyonce Cyrille, a Normandy Capital managing partner, to discuss the year-end performance for Normandy Fund 3. This fund has not yet incurred any carried interest, which is paid only when NAV before distributions exceeds committed capital. Carried interest is calculated as 20% of the difference between NAV before distributions and committed capital. Cyrille wants to approximate NAV after distributions net of carried interest, based on the following data (in €): Invested capital: 95 million NAV before distributions: 150 million Annual distributions: 20 million Committed capital: 120 million This year, Normandy Capital will exit its current stake in BigTrailers Industries, a portfolio company that manufactures industrial-grade trailers. Ervand states that market conditions are strong. Cyrille responds, &quot;I prefer the highest exit valuation. We should prepare to sell BigTrailers to WideRoad Inc., the largest company in this space. This transaction would most likely yield the highest premium.&quot; BigTrailers was purchased 5 years ago for €200 million. The purchase was financed as follows (in €): Debt: 140 million Preferred equity: 10 million PE fund equity: 45 million Management equity: 5 million Cyrille expects to sell BigTrailers for €300 million. Normandy Capital will have retired all of BigTrailers&#x27; debt prior to the sale. Preferred equity shareholders are promised a 15% annual return. After accounting for payments to debtholders and preferred equity investors, 95% of the remaining proceeds will go to the PE fund&#x27;s equity and 5% will go to management. In the future, Cyrille wants to start a fund with a target size of €1 billion but will likely require a placement agent to reach that goal. Ervand states: &quot;Management fees will be 1.5%, transaction fees will be split 50/50 between the general partner and the limited partners, and carried interest will be paid on a deal-by-deal basis.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Ervand&#x27;s explanation of private equity (PE) is incorrect with respect to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q019.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":20,"q":"Which of Camille's comments regarding Exhibit 1 is correct?","opts":["Comment 1","Comment 2","Comment 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a020.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a020.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 19–24 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marius Ervand is an associate at Normandy Capital, a private equity (PE) firm focused on leveraged buyouts (LBOs). Ervand is scheduled to meet with Marie Camille, an investment analyst at Bordeaux Pension Fund, a prospective investor. Camille is unfamiliar with PE investments, so Ervand has given her a brief explanation:<\/p><p>&quot;PE funds use debt to magnify returns for investors. As debt is gradually retired over time, more operating cash flows become available to investors. PE funds generally charge higher fees than publicly traded funds such as mutual funds; the difference is partially attributable to high performance fees. PE investments have little to no market risk since portfolio companies are not publicly traded.&quot;<\/p><p>Next, Camille tells Ervand that she wants to assess Normandy&#x27;s historical fund performance, so Ervand selectively presents data on two funds with an original 10-year life (Exhibit 1).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/wx018.webp\" style=\"max-width:min(100%,478px)\" alt=\"Exhibit\"><p>After viewing the data, Camille makes the following comments:<\/p><p>Comment 1: &quot;Fund 1 has distributed €1.39 to investors for every euro invested.&quot;<\/p><p>Comment 2: &quot;If I were a fund investor, gross IRR would be more relevant to me than net IRR.&quot;<\/p><p>Comment 3: &quot;Fund 2&#x27;s low returns can be explained by the J-curve effect.&quot;<\/p><p>A few days later, Ervand meets with Leyonce Cyrille, a Normandy Capital managing partner, to discuss the year-end performance for Normandy Fund 3. This fund has not yet incurred any carried interest, which is paid only when NAV before distributions exceeds committed capital. Carried interest is calculated as 20% of the difference between NAV before distributions and committed capital. Cyrille wants to approximate NAV after distributions net of carried interest, based on the following data (in €): Invested capital: 95 million NAV before distributions: 150 million Annual distributions: 20 million Committed capital: 120 million This year, Normandy Capital will exit its current stake in BigTrailers Industries, a portfolio company that manufactures industrial-grade trailers. Ervand states that market conditions are strong. Cyrille responds, &quot;I prefer the highest exit valuation. We should prepare to sell BigTrailers to WideRoad Inc., the largest company in this space. This transaction would most likely yield the highest premium.&quot; BigTrailers was purchased 5 years ago for €200 million. The purchase was financed as follows (in €): Debt: 140 million Preferred equity: 10 million PE fund equity: 45 million Management equity: 5 million Cyrille expects to sell BigTrailers for €300 million. Normandy Capital will have retired all of BigTrailers&#x27; debt prior to the sale. Preferred equity shareholders are promised a 15% annual return. After accounting for payments to debtholders and preferred equity investors, 95% of the remaining proceeds will go to the PE fund&#x27;s equity and 5% will go to management. In the future, Cyrille wants to start a fund with a target size of €1 billion but will likely require a placement agent to reach that goal. Ervand states: &quot;Management fees will be 1.5%, transaction fees will be split 50/50 between the general partner and the limited partners, and carried interest will be paid on a deal-by-deal basis.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Camille&#x27;s comments regarding Exhibit 1 is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q020.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":21,"q":"The year-end NAV after distributions (in € millions) for Normandy Fund 3 is closest to:","opts":["119","124","130"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a021.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a021.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 19–24 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marius Ervand is an associate at Normandy Capital, a private equity (PE) firm focused on leveraged buyouts (LBOs). Ervand is scheduled to meet with Marie Camille, an investment analyst at Bordeaux Pension Fund, a prospective investor. Camille is unfamiliar with PE investments, it 1).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/wx018.webp\" style=\"max-width:min(100%,478px)\" alt=\"Exhibit\"><p>After viewing the data, Camille makes the following comments:<\/p><p>Comment 1: &quot;Fund 1 has distributed €1.39 to investors for every euro invested.&quot;<\/p><p>Comment 2: &quot;If I were a fund investor, gross IRR would be more relevant to me than net IRR.&quot;<\/p><p>Comment 3: &quot;Fund 2&#x27;s low returns can be explained by the J-curve effect.&quot;<\/p><p>A few days later, Ervand meets with Leyonce Cyrille, a Normandy Capital managing partner, to discuss the year-end performance for Normandy Fund 3. This fund has not yet incurred any carried interest, which is paid only when NAV before distributions exceeds committed capital. Carried interest is calculated as 20% of the difference between NAV before distributions and committed capital. Cyrille wants to approximate NAV after distributions net of carried interest, based on the following data (in €): Invested capital: 95 million NAV before distributions: 150 million Annual distributions: 20 million Committed capital: 120 million This year, Normandy Capital will exit its current stake in BigTrailers Industries, a portfolio company that manufactures industrial-grade trailers. Ervand states that market conditions are strong. Cyrille responds, &quot;I prefer the highest exit valuation. We should prepare to sell BigTrailers to WideRoad Inc., the largest company in this space. This transaction would most likely yield the highest premium.&quot; BigTrailers was purchased 5 years ago for €200 million. The purchase was financed as follows (in €): Debt: 140 million Preferred equity: 10 million PE fund equity: 45 million Management equity: 5 million Cyrille expects to sell BigTrailers for €300 million. Normandy Capital will have retired all of BigTrailers&#x27; debt prior to the sale. Preferred equity shareholders are promised a 15% annual return. After accounting for payments to debtholders and preferred equity investors, 95% of the remaining proceeds will go to the PE fund&#x27;s equity and 5% will go to management. In the future, Cyrille wants to start a fund with a target size of €1 billion but will likely require a placement agent to reach that goal. Ervand states: &quot;Management fees will be 1.5%, transaction fees will be split 50/50 between the general partner and the limited partners, and carried interest will be paid on a deal-by-deal basis.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Given Ervand&#x27;s statement regarding the proposed new PE fund fee structure, transaction fees for the new fund are best described as the fees associated with:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q024.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":25,"q":"Based on her preferences, Khan would most appropriately invest in which of the following types of property?","opts":["Office","Hospitality","Multifamily rentals"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a025.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a025.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 25–30 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Punam Khan is an individual investor considering adding publicly traded real estate instruments to her investment portfolio. After starting her research, she discovers that commercial properties are typically classified into many segments. Khan prefers:<\/p><p>the types of properties that are the most management intensive since she believes management skill is not always properly accounted for in a property&#x27;s value. This allows her to pick undervalued properties with strong management.<\/p><p>taking on riskier investments as she believes the economy will be stable for the foreseeable future.<\/p><p>Khan decides to call Dipak Sahu, another individual investor, who has more experience in real estate. Sahu tells Khan that he trades in three main types of publicly traded real estate securities, a recommended strategy for smaller investments. Of those types, Sahu prefers to invest in assets that:<\/p><p>appreciate when the properties&#x27; value appreciates, and<\/p><p>allow for greater flexibility in how funds are invested.<\/p><p>Sahu also suggests that instruments based on real estate indexes are a viable option for introductory real estate investments. He warns Khan to consider whether a benchmark index is appraisal- or transaction-based since this will affect the index&#x27;s values and returns.<\/p><p>After getting Sahu&#x27;s advice, Khan decides to research Brick and Mortar Financial (BMF), a diversified REIT. Khan collects the following data from BMF&#x27;s financial statements and the industry:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex006.webp\" style=\"max-width:min(100%,436px)\" alt=\"Exhibit\"><p>Khan observes that BMF has a greater amount of land held for development than its peers and wonders how that would affect its funds-from-operations (FFO) ratios. In addition, she notices that FFO multiples vary over time and also between different companies.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on her preferences, Khan would most appropriately invest in which of the following types of property?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q025.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":26,"q":"Based on Sahu's preferences, he should most appropriately invest in a:","opts":["mortgage-backed security.","real estate investment trust.","real estate operating company."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","ex s Khan that he trades in three main types of publicly traded real estate securities, a recommended strategy for smaller investments. Of those types, Sahu prefers to invest in assets that:<\/p><p>appreciate when the properties&#x27; value appreciates, and<\/p><p>allow for greater flexibility in how funds are invested.<\/p><p>Sahu also suggests that instruments based on real estate indexes are a viable option for introductory real estate investments. He warns Khan to consider whether a benchmark index is appraisal- or transaction-based since this will affect the index&#x27;s values and returns.<\/p><p>After getting Sahu&#x27;s advice, Khan decides to research Brick and Mortar Financial (BMF), a diversified REIT. Khan collects the following data from BMF&#x27;s financial statements and the industry:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex006.webp\" style=\"max-width:min(100%,436px)\" alt=\"Exhibit\"><p>Khan observes that BMF has a greater amount of land held for development than its peers and wonders how that would affect its funds-from-operations (FFO) ratios. In addition, she notices that FFO multiples vary over time and also between different companies.<\/p><\/div><\/details><div class=\"qtext\"><p>All else equal, when comparing BMF&#x27;s funds from operations multiples with its peers&#x27; multiples, Khan should most appropriately account for the company&#x27;s land held for development by:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q029.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":30,"q":"All else equal, which of the following is most likely to justify an increase to an analyst's calculated price / funds from operations (PIFFO) multiple for a company? Greater:","opts":["expected growth","financial leverage","cash flow volatility"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a030.webp\" target )\" alt=\"Exhibit\"><p>Khan observes that BMF has a greater amount of land held for development than its peers and wonders how that would affect its funds-from-operations (FFO) ratios. In addition, she notices that FFO multiples vary over time and also between different companies.<\/p><\/div><\/details><div class=\"qtext\"><p>All else equal, which of the following is most likely to justify an increase to an analyst&#x27;s calculated price / funds from operations (PIFFO) multiple for a company? Greater:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q030.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":31,"q":"Which of the following exit routes most likely results in the highest valuation multiples for a PE investment?","opts":["Liquidation","Management buyout","Secondary market sale"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a031.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a031.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 31–33 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Marcus Doppler is the chief information officer (CIO) of Pittman University&#x27;s endowment fund. After analyzing the fund&#x27;s recent performance, he believes that the fund should diversify its investments and allocate a portion of its assets to private equity (PE). He hires Sigrid Marek, a senior analyst with much experience in the PE industry.<\/p><p>Doppler questions Marek about characteristics of PE investments, starting with the rate of return on investments that could be expected for the endowment fund. Marek explains that this return depends on several factors, including the chosen exit route. Typically, she adds, the highest valuation multiples are achieved when the investment is sold in an IPO, but market downturns and other external events may shut down the IPO markets. In those situations, other exit routes are available.<\/p><p>Doppler asks about the costs of investing in PE funds. Marek warns that the costs are higher than the costs of investing in public equities and makes the following comments:<\/p><p><b>Comment 1:<\/b> Fund setup costs include the costs of financing and structuring an acquisition.<\/p><p><b>Comment 2:<\/b> Placement fees are charged as a percentage of the money raised by the PE fund.<\/p><p><b>Comment 3:<\/b> Administrative costs are fixed annual fees that include custodian and transfer-agent costs.<\/p><p>Doppler explains to Marek that the endowment fund recently had the opportunity to invest in Accelana Capital 3 (AC3), an early-stage venture capital (VC) fund managed by Accelana Partners. AC3 invests in start-ups that develop new technologies for the automotive industry. Doppler adds that AC3&#x27;s portfolio companies have short or nonexistent operating histories, but most of them have signed long-term contracts with large car manufacturers. This will substantially increase revenues in the following quarters, although cash flows will still be difficult to predict. Doppler asks Marek what approach she recommends for valuing AC3.<\/p><p>Lastly, Doppler tells Marek that Accelana Partners provided information regarding the firm&#x27;s two previous PE funds as evidence of the firm&#x27;s superior performance. Information about the returns earned by Accelana Capital 1 (AC1) and Accelana Capital 2 (AC2) is presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex007.webp\" style=\"max-width:min(100%,482px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of the following exit routes most likely results in the highest valuation multiples for a PE investment?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q031.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":32,"q":"Which of the following is the most appropriate approach to value AC3?","opts":["Apply an income approach to AC3's investments.","Apply a price-to-sales market multiple, adjusting for illiquidity.","Calculate AC3's NAV at cost, adjusting based on financing events."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a033.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a033.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 31–33 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marcus Doppler is the chief information officer (CIO) of Pittman University&#x27;s endowment fund. After analyzing the fund&#x27;s recent performance, he believes that the fund should diversify its investments and allocate a portion of its assets to private equity (PE). He hires Sigrid Marek, a senior analyst with much experience in the PE industry.<\/p><p>Doppler questions Marek about characteristics of PE investments, starting with the rate of return on investments that could be expected for the endowment fund. Marek explains that this return depends on several factors, including the chosen exit route. Typically, she adds, the highest valuation multiples are achieved when the investment is sold in an IPO, but market downturns and other external events may shut down the IPO markets. In those situations, other exit routes are available.<\/p><p>Doppler asks about the costs of investing in PE funds. Marek warns that the costs are higher than the costs of investing in public equities and makes the following comments:<\/p><p><b>Comment 1:<\/b> Fund setup costs include the costs of financing and structuring an acquisition.<\/p><p><b>Comment 2:<\/b> Placement fees are charged as a percentage of the money raised by the PE fund.<\/p><p><b>Comment 3:<\/b> Administrative costs are fixed annual fees that include custodian and transfer-agent costs.<\/p><p>Doppler explains to Marek that the endowment fund recently had the opportunity to invest in Accelana Capital 3 (AC3), an early-stage venture capital (VC) fund managed by Accelana Partners. AC3 invests in start-ups that develop new technologies for the automotive industry. Doppler adds that AC3&#x27;s portfolio companies have short or nonexistent operating histories, but most of them have signed long-term contracts with large car manufacturers. This will substantially increase revenues in the following quarters, although cash flows will still be difficult to predict. Doppler asks Marek what approach she recommends for valuing AC3.<\/p><p>Lastly, Doppler tells Marek that Accelana Partners provided information regarding the firm&#x27;s two previous PE funds as evidence of the firm&#x27;s superior performance. Information about the returns earned by Accelana Capital 1 (AC1) and Accelana Capital 2 (AC2) is presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex007.webp\" style=\"max-width:min(100%,482px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of the following is the most appropriate approach to value AC3?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q032.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":33,"q":"Compared with AC1 and based on Exhibit 1, AC2 provided a greater:","opts":["IRR to investors.","total value to paid-in capital.","realized return on investment."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a034.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a034.webp\" ong-term contracts with large car manufacturers. This will substantially increase revenues in the following quarters, although cash flows will still be difficult to predict. Doppler asks Marek what approach she recommends for valuing AC3.<\/p><p>Lastly, Doppler tells Marek that Accelana Partners provided information regarding the firm&#x27;s two previous PE funds as evidence of the firm&#x27;s superior performance. Information about the returns earned by Accelana Capital 1 (AC1) and Accelana Capital 2 (AC2) is presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-alt/ex007.webp\" style=\"max-width:min(100%,482px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Compared with AC1 and based on Exhibit 1, AC2 provided a greater:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q033.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":34,"q":"Which of Valdez's comments would most likely affect the flows of the lithium market?","opts":["Comment 1","Comment 2","Comment 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a035.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a035.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 34–37 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Maria Valdez is a commodity specialist covering global natural resources at Pecos Mutual Fund Inc., a buy-side firm. Valdez&#x27;s commodity price forecasts are used by other analysts at the firm and incorporated into their bottom-up financial models.<\/p><p>Hector Ortiz covers the global automotive industry group, which is significantly impacted by the costs of various commodities used in auto manufacturing. Ortiz is specifically concerned with the price of lithium, a key industrial metal used in the production of lithium-ion battery packs for electric vehicles. Over the past year, lithium prices have increased significantly due to tight supplies.<\/p><p>Ortiz asks Valdez to comment on recent developments impacting the lithium market. Valdez states that it is important to consider how stocks and flows of a commodity impact the market price of that commodity. She then makes the following comments:<\/p><p><b>Comment 1:<\/b> The country that is the world&#x27;s largest supplier of battery-grade lithium recently increased its revenue royalty tax on lithium from 1% to 2%.<\/p><p><b>Comment 2:<\/b> The largest global producer of lithium announced a capacity expansion of an existing mine, which will increase lithium output by 20%.<\/p><p><b>Comment 3:<\/b> Seasonal rains in one of the large lithium-producing countries have been unusually heavy this year.<\/p><p>Later that day, Valdez receives a call from one of the firm&#x27;s quantitative analysts, Pablo Fernandez, who is building a quantitative model to value commodities. As the firm will use commodity futures to implement an investment strategy, Fernandez asks about the underlying drivers of commodities futures prices. Valdez responds that she believes that most commodity producers consistently sell forward to lock in prices, causing futures prices to decrease, resulting in a &quot;normal backwardation&quot; of the futures curve. Valdez then proposes the following factors as potential inputs for valuing a commodity derivative such as a commodity futures contract:<\/p><p><b>Factor 1:<\/b> Futures roll yield<\/p><p><b>Factor 2:<\/b> Expected volatility of future prices<\/p><p><b>Factor 3:<\/b> Supply and demand fundamentals of the underlying commodity<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Valdez&#x27;s comments would most likely affect the flows of the lithium market?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading= <\/b> Seasonal rains in one of the large lithium-producing countries have been unusually heavy this year.<\/p><p>Later that day, Valdez receives a call from one of the firm&#x27;s quantitative analysts, Pablo Fernandez, who is building a quantitative model to value commodities. As the firm will use commodity futures to implement an investment strategy, Fernandez asks about the underlying drivers of commodities futures prices. Valdez responds that she believes that most commodity producers consistently sell forward to lock in prices, causing futures prices to decrease, resulting in a &quot;normal backwardation&quot; of the futures curve. Valdez then proposes the following factors as potential inputs for valuing a commodity derivative such as a commodity futures contract:<\/p><p><b>Factor 1:<\/b> Futures roll yield<\/p><p><b>Factor 2:<\/b> Expected volatility of future prices<\/p><p><b>Factor 3:<\/b> Supply and demand fundamentals of the underlying commodity<\/p><\/div><\/details><div class=\"qtext\"><p>A commodity producer that consistently sells forward to lock in prices is best described as a:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-alt/q035.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":36,"q":"Valdez's view on futures prices best reflects which of the following theories of commodities futures curve pricing?","opts":["Insurance theory","Theory of storage","Hedging pressure hypothesis"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-alt/a037.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-alt/a037.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 34–37 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Maria Valdez i
