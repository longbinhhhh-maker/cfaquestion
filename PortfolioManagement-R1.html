<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .stem .qtable{width:100%;border-collapse:collapse;margin:12px 0 2px;font-size:14.5px;
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stem .qtable th,.stem .qtable td{border:1px solid var(--line);padding:8px 11px;
    text-align:left;vertical-align:top}
  .stem .qtable thead th{background:var(--panel2);font-weight:700;color:var(--accent2)}
  .stem .qtable tbody td:first-child{font-weight:600}
  .stem .qtable td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
  .stem .qtable tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
  @media (max-width:520px){.stem .qtable{font-size:13px}.stem .qtable th,.stem .qtable td{padding:6px 8px}}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n":1,"q":"Stock A has a standard deviation of 0.5 and Stock B has a standard deviation of 0.3. Stock A\nand Stock B are perfectly positively correlated. According to Markowitz portfolio theory how\nmuch should be invested in each stock to minimize the portfolio's standard deviation?","opts":["100% in Stock B.","30% in Stock A and 70% in Stock B.","50% in Stock A and 50% in Stock B."],"ans":"A","expl":"Vì các cổ phiếu có mối tương quan hoàn hảo nên sẽ có không được hưởng lợi từ việc đa dạng hóa. Vì vậy, hãy đầu tư\nvào cổ phiếu có rủi ro thấp nhất.\n(Mô-đun 83.4, LOS 83.f)"},{"n":2,"q":"An investor's portfolio currently has an expected return of 11% with a variance of 0.0081.\nShe is considering replacing 20% of the portfolio with a security that has an expected return\nof 12% and a standard deviation of 0.07. If the covariance between the returns on the\nexisting portfolio and the returns on the added security is 0.0058, the variance of returns on\nthe new portfolio will be closest to:","opts":["0.00545.","0.00724.","0.00984."],"ans":"B","expl":"222\n0,8(0,0081) + 0,2 (0,07) + 2(0,8)(0,2)(0,0058) = 0,00724.\n(Mô-đun 83.3, LOS 83.e)"},{"n":3,"q":"Calculating the variance of a two-asset portfolio least likely requires inputs for each asset's:","opts":["beta.","weight in the portfolio.","standard deviation."],"ans":"A","expl":"Beta không phải là thông tin đầu vào để tính toán phương sai của danh mục đầu tư hai tài sản. Công thức\ntính phương sai của danh mục đầu tư hai tài sản là:\n22222\nσ=wσ+wσ+2wwCov\nABAB\nPAABB\n(Module 83.3, LOS 83.e)"},{"n":4,"q":"According to the CAPM, a rational investor would be least likely to choose as his optimal\nportfolio:","opts":["a 130% allocation to the market portfolio.","a 100% allocation to the risk-free asset.","the global minimum variance portfolio."],"ans":"C","expl":"Theo CAPM, các nhà đầu tư hợp lý, không thích rủi ro sẽ chọn nắm giữ\ndanh mục đầu tư dọc theo đường thị trường vốn một cách tối ưu. Điều này có thể dao động từ việc phân bổ 100% cho tài sản không có rủi ro\nđến vị thế có đòn bẩy trong danh mục thị trường được xây dựng bằng cách vay với lãi suất\nkhông có rủi ro để đầu tư hơn 100% giá trị vốn cổ phần của danh mục đầu tư vào danh mục đầu tư thị trường\n. Danh mục chênh lệch tối thiểu toàn cầu nằm dưới CML và không phải là danh mục\nhiệu quả theo các giả định của CAPM.\n(Mô-đun 83.4, LOS 83.g)"},{"n":5,"q":"Which of the following inputs is least likely required for the Markowitz efficient frontier? The:","opts":["covariation between all securities.","expected return of all securities.","level of risk aversion in the market."],"ans":"C","expl":"Mức độ e ngại rủi ro trên thị trường không phải là thông tin đầu vào bắt buộc. Mô hình này yêu cầu\nnhà đầu tư biết lợi nhuận kỳ vọng và phương sai của từng chứng khoán cũng như hiệp phương sai\ngiữa tất cả các chứng khoán.\n(Mô-đun 83.4, LOS 83.g)"},{"n":6,"q":"A portfolio manager adds a new stock that has the same standard deviation of returns as the\nexisting portfolio but has a correlation coefficient with the existing portfolio that is less than\n+1. Adding this stock will have what effect on the standard deviation of the revised\nportfolio's returns? The standard deviation will:","opts":["decrease only if the correlation is negative.","decrease.","increase."],"ans":"B","expl":"Nếu hệ số tương quan nhỏ hơn 1 thì đa dạng hóa sẽ có lợi. Do đó,\nthêm cổ phiếu sẽ làm giảm độ lệch chuẩn của danh mục đầu tư.\n(Mô-đun 83.4, LOS 83.f)"},{"n":7,"q":"Risk aversion means that an individual will choose the less risky of two assets:","opts":["if they have the same expected return.","in all cases.","even if it has a lower expected return."],"ans":"A","expl":"Các nhà đầu tư không thích rủi ro. Khi được lựa chọn giữa các tài sản có tỷ suất lợi nhuận dự kiến\nbằng nhau, nhà đầu tư sẽ luôn chọn tài sản có mức rủi ro thấp nhất. Lo ngại rủi ro\nkhông có nghĩa là nhà đầu tư sẽ chọn hai tài sản ít rủi ro hơn trong mọi trường hợp hoặc\nnhà đầu tư không sẵn sàng chấp nhận rủi ro lớn hơn để đạt được lợi nhuận kỳ vọng lớn hơn.\n(Mô-đun 83.2, LOS 83.b)"},{"n":8,"q":"Assets A (with a variance of 0.25) and B (with a variance of 0.40) are perfectly positively\ncorrelated. If an investor creates a portfolio using only these two assets with 40% invested in\nA, the portfolio standard deviation is closest to:","opts":["0.3742.","0.3400.","0.5795."],"ans":"C","expl":"220.50.50.5\nĐộ lệch chuẩn danh mục đầu tư = [(0,4)(0,25) + (0,6)(0,4) + 2(0,4)(0,6)1(0,25)(0,4)]\n= 0,5795\n(Mô-đun 83.3, LOS 83.e)"},{"n":9,"q":"Which of the following portfolios falls below the Markowitz efficient frontier?\nPortfolioExpected ReturnExpected Standard Deviation\nA7%14%\nB9%26%\nC15%30%\nD12%22%","opts":["B.","C.","D."],"ans":"A","expl":"Danh mục đầu tư B không nằm trong giới hạn hiệu quả vì nó có lợi nhuận thấp hơn nhưng rủi ro cao hơn\nso với Danh mục đầu tư D.\n(Module 83.4, LOS 83.g)","qhtml":"<p>Which of the following portfolios falls below the Markowitz efficient frontier?</p><table class=\"qtable\"><thead><tr><th>Portfolio</th><th>Expected Return</th><th>Expected Standard Deviation</th></tr></thead><tbody><tr><td>A</td><td>7%</td><td>14%</td></tr><tr><td>B</td><td>9%</td><td>26%</td></tr><tr><td>C</td><td>15%</td><td>30%</td></tr><tr><td>D</td><td>12%</td><td>22%</td></tr></tbody></table>"},{"n":10,"q":"The particular portfolio on the efficient frontier that best suits an individual investor is\ndetermined by:","opts":["the current market risk-free rate as compared to the current market return rate.","the individual's asset allocation plan.","the individual's utility curve."],"ans":"C","expl":"Danh mục đầu tư tối ưu cho mỗi nhà đầu tư là đường bàng quan cao nhất tiếp xúc với\nđường biên hiệu quả. Danh mục đầu tư tối ưu là danh mục mang lại cho nhà đầu tư\ntiện ích lớn nhất có thể.\n(Mô-đun 83.2, LOS 83.c)"},{"n":11,"q":"An analyst gathered the following data for Stock A and Stock B:\nTime PeriodStock A ReturnsStock B Returns\n110%15%\n26%9%\n38%12%\nWhat is the covariance for this portfolio?","opts":["12.","3.","6."],"ans":"C","expl":"Công thức tính hiệp phương sai cho dữ liệu lịch sử là:\ncov = {Σ[(R − Mean R)(R − Mean R)]} / (n − 1)\n1,2stock AAstock BB\nTrung bình R = (10 + 6 + 8) / 3 = 8, Trung bình R = (15 + 9 + 12) / 3 = 12\nAB\nỞ đây, cov = [(10 − 8)(15 − 12) + (6 − 8)(9 − 12) + (8 − 8)(12 − 12)] / 2 = 6\n1,2\n(Mô-đun 83.3, LOS 83.d)","qhtml":"<p>An analyst gathered the following data for Stock A and Stock B:</p><table class=\"qtable\"><thead><tr><th>Time Period</th><th>Stock A Returns</th><th>Stock B Returns</th></tr></thead><tbody><tr><td>1</td><td>10%</td><td>15%</td></tr><tr><td>2</td><td>6%</td><td>9%</td></tr><tr><td>3</td><td>8%</td><td>12%</td></tr></tbody></table><p>What is the covariance for this portfolio?</p>"},{"n":12,"q":"In the Markowitz framework, risk is defined as the:","opts":["variance of returns.","probability of a loss.","beta of an investment."],"ans":"A","expl":"Khung Markowitz giả định rằng tất cả các nhà đầu tư đều xem rủi ro là sự biến thiên của lợi nhuận.\nSự biến đổi của lợi nhuận được đo bằng phương sai (hoặc độ lệch chuẩn tương đương)\ncủa lợi nhuận. Mô hình định giá tài sản vốn (CAPM) sử dụng phiên bản beta làm thước đo\nrủi ro hệ thống của khoản đầu tư.\n(Mô-đun 83.4, LOS 83.g)"},{"n":13,"q":"According to Markowitz, an investor's optimal portfolio is determined where the:","opts":["investor's lowest utility curve is tangent to the efficient frontier.","investor's utility curve meets the efficient frontier.","investor's highest utility curve is tangent to the efficient frontier."],"ans":"C","expl":"Danh mục đầu tư tối ưu cho nhà đầu tư được xác định là điểm mà tại đó\nđường cong tiện ích cao nhất của nhà đầu tư tiếp xúc với đường biên hiệu quả.\n(Học phần 83.2, LOS 83.c)"},{"n":14,"q":"Which of the following statements regarding the covariance of rates of return is least\naccurate?","opts":["Covariance is not a very useful measure of the strength of the relationship between rates of return.","If the covariance is negative, the rates of return on two investments will always move in different directions relative to their means.","Covariance is positive if two variables tend to both be above their mean values in the same time periods."],"ans":"B","expl":"Hiệp phương sai âm có nghĩa là tỷ suất lợi nhuận của một chứng khoán sẽ có xu hướng cao hơn lợi tức trung bình\ntrong những khoảng thời gian khi chứng khoán kia ở dưới mức lợi tức trung bình của nó và ngược lại. Hiệp phương sai\ndương có nghĩa là lợi nhuận của cả hai chứng khoán sẽ có xu hướng cao hơn (hoặc thấp hơn) lợi nhuận trung bình\ncủa chúng trong cùng khoảng thời gian. Để lợi nhuận luôn di chuyển theo các hướng\nngược nhau, chúng sẽ phải có mối tương quan nghịch hoàn toàn. Hiệp phương sai âm của\nbản thân nó không hàm ý bất cứ điều gì về độ mạnh của mối tương quan nghịch, nó phải được\nchuẩn hóa bằng cách chia cho tích của độ lệch chuẩn lợi nhuận của chứng khoán.\n(Mô-đun 83.3, LOS 83.d)"},{"n":15,"q":"Of the six attainable portfolios listed, which portfolios are not on the efficient frontier?\nPortfolioExpected ReturnStandard Deviation\nA26%28%\nB23%34%\nC14%23%\nD18%14%\nE11%8%\nF18%16%","opts":["A, B, and C.","B, C, and F.","C, D, and E."],"ans":"B","expl":"Danh mục B không thể nằm ở biên giới vì rủi ro của nó cao hơn Danh mục A\nvới lợi nhuận thấp hơn. Danh mục C không thể nằm trên đường biên vì nó có rủi ro cao hơn\nDanh mục D với lợi nhuận thấp hơn. Danh mục F không thể nằm trên đường biên không thể nằm trên đường biên\nvì rủi ro của nó cao hơn Danh mục D.\n(Module 83.4, LOS 83.g)","qhtml":"<p>Of the six attainable portfolios listed, which portfolios are not on the efficient frontier?</p><table class=\"qtable\"><thead><tr><th>Portfolio</th><th>Expected Return</th><th>Standard Deviation</th></tr></thead><tbody><tr><td>A</td><td>26%</td><td>28%</td></tr><tr><td>B</td><td>23%</td><td>34%</td></tr><tr><td>C</td><td>14%</td><td>23%</td></tr><tr><td>D</td><td>18%</td><td>14%</td></tr><tr><td>E</td><td>11%</td><td>8%</td></tr><tr><td>F</td><td>18%</td><td>16%</td></tr></tbody></table>"},{"n":16,"q":"If two stocks have positive covariance:","opts":["they exhibit a strong correlation of returns.","their rates of return tend to change in the same direction.","they are likely to be in the same industry."],"ans":"B","expl":"Đối với hai cổ phiếu có hiệp phương sai dương, giá của chúng sẽ có xu hướng di chuyển cùng nhau theo thời gian\nvà chúng sẽ có xu hướng tạo ra tỷ suất lợi nhuận lớn hơn lợi nhuận trung bình tại cùng một thời điểm\nvà tạo ra tỷ suất lợi nhuận thấp hơn lợi nhuận trung bình của chúng trong cùng một thời điểm.\nHiệp phương sai dương không nhất thiết hàm ý mối tương quan dương mạnh mẽ. Hai cổ phiếu cần\nkhông cùng ngành để có hiệp phương sai dương.\n(Mô-đun 83.3, LOS 83.d)"},{"n":17,"q":"Which of the following statements best describes an investment that is not on the efficient\nfrontier?","opts":["There is a portfolio that has a lower return for the same risk.","The portfolio has a very high return.","There is a portfolio that has a lower risk for the same return."],"ans":"C","expl":"Đường biên hiệu quả phác thảo tập hợp danh mục đầu tư mang lại cho nhà đầu tư lợi nhuận cao nhất\nđối với một mức rủi ro nhất định hoặc rủi ro thấp nhất đối với một mức lợi nhuận nhất định. Do đó, nếu một danh mục đầu tư\nkhông nằm trên đường biên hiệu quả thì phải có một danh mục đầu tư có rủi ro thấp hơn cho cùng mức lợi nhuận\n. Tương tự, phải có một danh mục đầu tư tạo ra lợi nhuận cao hơn cho cùng một\nrủi ro.\n(Mô-đun 83.4, LOS 83.g)"},{"n":18,"q":"If the standard deviation of asset A is 12.2%, the standard deviation of asset B is 8.9%, and\nthe correlation coefficient is 0.20, what is the covariance between A and B?","opts":["0.0001.","0.0022.","0.0031."],"ans":"B","expl":"Công thức là: (tương quan)(độ lệch chuẩn của A)(độ lệch chuẩn của B) = (0,20)\n(0,122)(0,089) = 0,0022.\n(Mô-đun 83.3, LOS 83.d)"},{"n":19,"q":"A portfolio manager invests 40% of a portfolio in Asset X, which has an expected standard\ndeviation of returns of 15%, and the remainder in Asset Y, which has an expected standard\ndeviation of returns of 25%. If the covariance of returns between assets X and Y is 0.0158,\nthe expected standard deviation of portfolio returns is closest to:","opts":["18.4%.","16.3%.","2.7%."],"ans":"A","expl":"Độ lệch chuẩn dự kiến của lợi nhuận danh mục đầu tư là:\n22221/2\n[0,40 × 0,15 + 0,60 × 0,25 + 2(0,40 × 0,60 × 0,0158)] = 18,35%.\n(Mô-đun 83.3, LOS 83.e)"},{"n":20,"q":"Stock 1 has a standard deviation of 10. Stock 2 also has a standard deviation of 10. If the\ncorrelation coefficient between these stocks is –1, what is the covariance between these two\nstocks?","opts":["1.00.","–100.00.","0.00."],"ans":"B","expl":"Hiệp phương sai = hệ số tương quan × độ lệch chuẩn × độ lệch chuẩn\nStock 1Stock 2\n= (–1,00) (10,00)(10,00) = –100,00.\n(Mô-đun 83.3, LOS 83.d)"},{"n":21,"q":"Over the long term, the annual returns and standard deviations of returns for major asset\nclasses have shown:","opts":["a negative relationship.","a positive relationship.","no clear relationship."],"ans":"B","expl":"Ở hầu hết các thị trường và đối với hầu hết các loại tài sản, lợi nhuận trung bình cao hơn trước đây\ncó liên quan đến rủi ro cao hơn (độ lệch chuẩn của lợi nhuận).\n(Học phần 83.1, LOS 83.a)"},{"n":22,"q":"Which one of the following portfolios does not lie on the efficient frontier?\nPortfolioExpected ReturnStandard Deviation\nA75\nB912\nC1110\nD1515","opts":["A.","C.","B."],"ans":"C","expl":"Danh mục B có lợi tức kỳ vọng thấp hơn Danh mục C với độ lệch chuẩn cao hơn.\n(Học phần 83.4, LOS 83.g)","qhtml":"<p>Which one of the following portfolios does not lie on the efficient frontier?</p><table class=\"qtable\"><thead><tr><th>Portfolio</th><th>Expected Return</th><th>Standard Deviation</th></tr></thead><tbody><tr><td>A</td><td>7%</td><td>5%</td></tr><tr><td>B</td><td>9%</td><td>12%</td></tr><tr><td>C</td><td>11%</td><td>10%</td></tr><tr><td>D</td><td>15%</td><td>15%</td></tr></tbody></table>"},{"n":23,"q":"If the standard deviation of stock A is 10.6%, the standard deviation of stock B is 14.6%, and\nthe covariance between the two is 0.015476, what is the correlation coefficient?","opts":["+1.","0.0002.","0."],"ans":"A","expl":"Công thức là: (Hiệp phương sai của A và B) / [(Độ lệch chuẩn của A)(Độ lệch chuẩn của\n(Mô-đun 83.3, LOS 83.d)"},{"n":24,"q":"The optimal portfolio in the Markowitz framework occurs when an investor achieves the\ndiversified portfolio with the:","opts":["highest return.","lowest risk.","highest utility."],"ans":"C","expl":"Danh mục đầu tư tối ưu trong khuôn khổ Markowitz xảy ra khi nhà đầu tư đạt được\ndanh mục đầu tư đa dạng với tiện ích cao nhất.\n(Mô-đun 83.2, LOS 83.c)"},{"n":25,"q":"Historically, which of the following asset classes has exhibited the smallest standard\ndeviation of monthly returns?","opts":["Large-capitalization stocks.","Long-term corporate bonds.","Treasury bills."],"ans":"C","expl":"Dựa trên dữ liệu về chứng khoán ở Hoa Kỳ Tại các bang từ năm 1926 đến năm 2008, tín phiếu kho bạc\ncó độ lệch chuẩn của lợi nhuận hàng tháng thấp hơn cả cổ phiếu vốn hóa lớn và\ntrái phiếu doanh nghiệp dài hạn.\n(Module 83.1, LOS 83.a)"},{"n":26,"q":"An investment advisor is considering a portfolio that is 60% invested in a broad-based stock\nindex fund with the remainder invested in a taxable bond fund. The stock index fund has an\nexpected return of 7% and variance of 0.04, while the bond fund has an expected return of\n3% and a variance of 0.0081. If the covariance of returns between the bond and index funds\nis 0.0108, the standard deviation of returns for the overall portfolio is closest to:","opts":["12.56%.","14.45%.","1.58%."],"ans":"B","expl":"Độ lệch chuẩn của lợi nhuận cho danh mục tổng thể như sau:\n22\n√\n0,6(0,04)+0,4(0,0081)+2(0,6)(0,4)(0,0108)=14,4499%\n(Mô-đun 83.3, LOS 83.d)"},{"n":27,"q":"Which of the following portfolios falls below the Markowitz efficient frontier?\nPortfolioExpected ReturnExpected Standard Deviation\nA12.1%8.5%\nB14.2%8.7%\nC15.1%8.7%","opts":["Portfolio B.","Portfolio C.","Portfolio A."],"ans":"A","expl":"Danh mục B không hiệu quả (nằm dưới đường biên hiệu quả) vì với cùng mức rủi ro\n(8,7%), bạn có thể có danh mục C với lợi nhuận kỳ vọng cao hơn (15,1% so với 14,2%).\n(Mô-đun 83.4, LOS 83.g)","qhtml":"<p>Which of the following portfolios falls below the Markowitz efficient frontier?</p><table class=\"qtable\"><thead><tr><th>Portfolio</th><th>Expected Return</th><th>Expected Standard Deviation</th></tr></thead><tbody><tr><td>A</td><td>12.1%</td><td>8.5%</td></tr><tr><td>B</td><td>14.2%</td><td>8.7%</td></tr><tr><td>C</td><td>15.1%</td><td>8.7%</td></tr></tbody></table>"},{"n":28,"q":"An investor has identified the following possible portfolios. Which portfolio cannot be on the\nefficient frontier?\nPortfolioExpected ReturnStandard Deviation\nV18%35%\nW12%16%\nX10%10%\nY14%20%\nZ13%24%","opts":["Z.","Y.","X."],"ans":"A","expl":"Danh mục Z phải kém hiệu quả vì rủi ro của nó cao hơn Danh mục Y và lợi nhuận dự kiến\ncủa nó thấp hơn Danh mục đầu tư Y.\n(Mô-đun 83.4, LOS 83.g)","qhtml":"<p>An investor has identified the following possible portfolios. Which portfolio cannot be on the</p><p>efficient frontier?</p><table class=\"qtable\"><thead><tr><th>Portfolio</th><th>Expected Return</th><th>Standard Deviation</th></tr></thead><tbody><tr><td>V</td><td>18%</td><td>35%</td></tr><tr><td>W</td><td>12%</td><td>16%</td></tr><tr><td>X</td><td>10%</td><td>10%</td></tr><tr><td>Y</td><td>14%</td><td>20%</td></tr><tr><td>Z</td><td>13%</td><td>24%</td></tr></tbody></table>"},{"n":29,"q":"A portfolio currently holds Randy Co. and the portfolio manager is thinking of adding either\nXYZ Co. or Branton Co. to the portfolio. All three stocks offer the same expected return and\ntotal risk. The covariance of returns between Randy Co. and XYZ is +0.5 and the covariance\nbetween Randy Co. and Branton Co. is -0.5. The portfolio's risk would decrease:","opts":["more if she bought Branton Co.","more if she bought XYZ Co.","most if she put half your money in XYZ Co. and half in Branton Co."],"ans":"A","expl":"Trong các câu hỏi về thành phần danh mục đầu tư, lợi nhuận và độ lệch chuẩn là các biến chính.\nỞ đây, bạn được thông báo rằng cả lợi nhuận và độ lệch chuẩn đều bằng nhau. Vì vậy, bạn chỉ muốn\nchọn những công ty có hiệp phương sai thấp nhất, vì điều đó có nghĩa là bạn đã chọn\nnhững công ty có hệ số tương quan thấp nhất.\n2222½\nσ = [W σ + W σ + 2W W σ σ r] trong đó σ =Y =\nportfolio112212121,2RandyBranton\nσ vì vậy bạn muốn chọn hiệp phương sai thấp nhất nằm giữa Randy và\nXYZ\nBranton.\n(Module 83.4, LOS 83.f)"},{"n":30,"q":"A stock has an expected return of 4% with a standard deviation of returns of 6%. A bond has\nan expected return of 4% with a standard deviation of 7%. An investor who prefers to invest\nin the stock rather than the bond is best described as:","opts":["risk averse.","risk neutral.","risk seeking."],"ans":"A","expl":"Với hai khoản đầu tư có cùng lợi nhuận kỳ vọng, nhà đầu tư không thích rủi ro sẽ thích\nđầu tư ít rủi ro hơn. Một nhà đầu tư trung lập với rủi ro sẽ không quan tâm đến hai khoản đầu tư\n. Nhà đầu tư tìm kiếm rủi ro sẽ thích khoản đầu tư có nhiều rủi ro hơn.\n(Module 83.2, LOS 83.b)"},{"n":31,"q":"Using the following correlation matrix, which two stocks would combine to make the lowest-\nrisk portfolio? (Assume the stocks have equal risk and returns.)\nStockABC\nA+ 1----\nB- 0.2+ 1--\nC+ 0.6- 0.1+ 1","opts":["A and C.","A and B.","C and B."],"ans":"B","expl":"Danh mục đầu tư A và B có hệ số tương quan thấp nhất và sẽ do đó tạo ra danh mục đầu tư có ít rủi ro nhất\n.\n22221/2\nĐộ lệch chuẩn của danh mục đầu tư = [Wσ + Wσ + 2WWσσr]\n112212121,2\nHệ số tương quan, r, thay đổi từ + 1 đến - 1. tương quan\n1,2\nhệ số thì σ càng nhỏ. Nếu hệ số tương quan là - 1 thì\nportfolio\ncó thể khiến σ về 0 bằng cách chọn trọng số thích hợp của W và W.\nportfolio12\n(Module 83.3, LOS 83.e)","qhtml":"<p>Using the following correlation matrix, which two stocks would combine to make the lowest-risk portfolio? (Assume the stocks have equal risk and returns.)</p><table class=\"qtable\"><thead><tr><th>Stock</th><th>A</th><th>B</th><th>C</th></tr></thead><tbody><tr><td>A</td><td>+1</td><td>--</td><td>--</td></tr><tr><td>B</td><td>−0.2</td><td>+1</td><td>--</td></tr><tr><td>C</td><td>+0.6</td><td>−0.1</td><td>+1</td></tr></tbody></table>"},{"n":32,"q":"Which one of the following statements about correlation is NOT correct?","opts":["Potential benefits from diversification arise when correlation is less than +1.","If the correlation coefficient were -1, a zero variance portfolio could be constructed.","If the correlation coefficient were 0, a zero variance portfolio could be constructed."],"ans":"C","expl":"Hệ số tương quan bằng 0 có nghĩa là không có mối quan hệ nào giữa lợi nhuận\ncủa cổ phiếu. Các câu còn lại đều đúng.\n(Mô-đun 83.4, LOS 83.f)"},{"n":33,"q":"Which of the following statements about the optimal portfolio is NOT correct? The optimal\nportfolio:","opts":["is the portfolio that gives the investor the maximum level of return.","may be different for different investors.","lies at the point of tangency between the efficient frontier and the indifference curve with the highest possible utility."],"ans":"A","expl":"Tuyên bố này không chính xác vì nó không chỉ rõ rằng rủi ro cũng phải xảy ra được xem xét.\n(Mô-đun 83.2, LOS 83.c)"},{"n":34,"q":"Investors who are less risk averse will have what type of indifference curves for risk and\nexpected return?","opts":["Flatter.","Inverted.","Steeper."],"ans":"A","expl":"Các nhà đầu tư ít sợ rủi ro hơn sẽ có thái độ thờ ơ phẳng hơn có nghĩa là họ\nsẵn sàng chấp nhận rủi ro nhiều hơn để có được lợi nhuận cao hơn một chút. Các nhà đầu tư không thích rủi ro hơn\nđòi hỏi lợi nhuận cao hơn nhiều để chấp nhận rủi ro nhiều hơn, tạo ra các đường bàng quan dốc hơn.\n(Mô-đun 83.2, LOS 83.c)"},{"n":35,"q":"A bond analyst is looking at historical returns for two bonds, Bond 1 and Bond 2. Bond 2's\nreturns are much more volatile than Bond 1. The variance of returns for Bond 1 is 0.012 and\nthe variance of returns of Bond 2 is 0.308. The correlation between the returns of the two\nbonds is 0.79, and the covariance is 0.048. If the variance of Bond 1 increases to 0.026 while\nthe variance of Bond 2 decreases to 0.188 and the covariance remains the same, the\ncorrelation between the two bonds will:","opts":["decrease.","increase.","remain the same."],"ans":"A","expl":"0,50,5\nP= 0,048/(0,026 × 0,188) = 0,69 thấp hơn so với ban đầu 0,79.\n1,2\n(Mô-đun 83.3, LOS 83.d)"},{"n":36,"q":"The efficient frontier is best described as the set of attainable portfolios that gives investors:","opts":["the lowest risk for any given level of risk tolerance.","the highest diversification ratio for any given level of expected return.","the highest expected return for any given level of risk."],"ans":"C","expl":"Đường biên hiệu quả là tập hợp danh mục đầu tư hiệu quả mang lại cho nhà đầu tư\nlợi nhuận kỳ vọng cao nhất đối với bất kỳ mức rủi ro nhất định nào hoặc rủi ro thấp nhất đối với bất kỳ mức lợi nhuận kỳ vọng\nnhất định nào. Danh mục đầu tư hiệu quả có tỷ lệ đa dạng hóa thấp.\n(Mô-đun 83.4, LOS 83.g)"},{"n":37,"q":"Smith has more steeply sloped risk-return indifference curves than Jones. Assuming these\ninvestors have the same expectations, which of the following best describes their risk\npreferences and the characteristics of their optimal portfolios? Smith is:","opts":["less risk averse than Jones and will choose an optimal portfolio with a lower expected return.","more risk averse than Jones and will choose an optimal portfolio with a lower expected return.","more risk averse than Jones and will choose an optimal portfolio with a higher expected return."],"ans":"B","expl":"Lợi nhuận-rủi ro dốc dốc các đường cong bàng quan chỉ ra rằng cần phải có sự gia tăng lớn hơn trong lợi nhuận dự kiến\nđể bù đắp cho việc giả định một đơn vị rủi ro bổ sung, so với\ncác đường cong bàng quan ít dốc hơn. Smith càng sợ rủi ro sẽ chọn một danh mục đầu tư tối ưu\ncó rủi ro thấp hơn và lợi nhuận kỳ vọng thấp hơn danh mục đầu tư\ntối ưu của Jones.\n(Module 83.2, LOS 83.c)"},{"n":38,"q":"Which of the following statements about the efficient frontier is least accurate?","opts":["Investors will want to invest in the portfolio on the efficient frontier that offers the highest rate of return.","Portfolios falling on the efficient frontier are fully diversified.","The efficient frontier shows the relationship that exists between expected return and total risk in the absence of a risk-free asset."],"ans":"A","expl":"Danh mục đầu tư tối ưu cho mỗi nhà đầu tư là đường bàng quan cao nhất tiếp xúc với\nđường biên hiệu quả.\n(Học phần 83.2, LOS 83.c)"},{"n":39,"q":"As the correlation between the returns of two assets becomes lower, the risk reduction\npotential becomes:","opts":["greater.","smaller.","decreased by the same level."],"ans":"A","expl":"Mối tương quan dương hoàn hảo (r = +1) của lợi nhuận của hai tài sản không làm giảm rủi ro,\ntrong khi mối tương quan nghịch hoàn hảo (r = -1) mang lại mức giảm rủi ro lớn nhất.\n(Mô-đun 83.4, LOS 83.f)"},{"n":40,"q":"The correlation coefficient between stocks A and B is 0.75. The standard deviation of stock\nA's returns is 16% and the standard deviation of stock B's returns is 22%. What is the\ncovariance between stock A and B?","opts":["0.0352.","0.3750.","0.0264."],"ans":"C","expl":"cov = 0,75 × 0,16 × 0,22 = 0,0264 = hiệp phương sai giữa A và B.\n1,2\n(Mô-đun 83.3, LOS 83.d)"},{"n":41,"q":"The basic premise of the risk-return trade-off suggests that risk-averse individuals\npurchasing investments with higher non-diversifiable risk should expect to earn:","opts":["rates of return equal to the market.","lower rates of return.","higher rates of return."],"ans":"C","expl":"Các nhà đầu tư không thích rủi ro. Khi được lựa chọn giữa hai tài sản có tỷ suất lợi nhuận bằng nhau,\nnhà đầu tư sẽ luôn chọn tài sản có mức độ rủi ro thấp nhất. Điều này có nghĩa là\ncó mối quan hệ tích cực giữa lợi nhuận kỳ vọng (ER) và rủi ro kỳ vọng (Eσ)\nvà đường lợi nhuận rủi ro (đường thị trường vốn [CML] và đường thị trường chứng khoán [SML])\ncó chiều hướng đi lên.\n(Module 83.2, LOS 83.c)"},{"n":42,"q":"A line that represents the possible portfolios that combine a risky asset and a risk free asset\nis most accurately described as a:","opts":["capital allocation line.","capital market line.","characteristic line."],"ans":"A","expl":"Dòng thể hiện sự kết hợp có thể có của một tài sản rủi ro và tài sản không rủi ro được\ngọi là đường phân bổ vốn (CAL). Đường thị trường vốn (CML) thể hiện\nsự kết hợp có thể có của danh mục thị trường với tài sản phi rủi ro. Đường đặc tính\nlà mối quan hệ tuyến tính phù hợp nhất giữa lợi nhuận vượt trội trên một nội dung và lợi nhuận vượt quá\ntrên thị trường và được dùng để ước tính hệ số beta của tài sản.\n(Mô-đun 83.2, LOS 83.c)"},{"n":43,"q":"Two assets are perfectly positively correlated. If 30% of an investor's funds were put in the\nasset with a standard deviation of 0.3 and 70% were invested in an asset with a standard\ndeviation of 0.4, what is the standard deviation of the portfolio?","opts":["0.151.","0.426.","0.370."],"ans":"C","expl":"22221/2\nσ danh mục đầu tư = [Wσ + Wσ + 2WWσσr] cho r = +1\n112212121,21,2\n22221/221/2\nσ = [Wσ + Wσ + 2WWσσ] = (Wσ + Wσ)]\n11221211122\n2\nσ = (Wσ + Wσ) = (0,3)(0,3) + (0,7)(0,4) = 0,09 + 0,28 = 0,37\n1122\n(Mô-đun 83.3, LOS 83.e)"},{"n":44,"q":"There are benefits to diversification as long as:","opts":["there must be perfect negative correlation between the assets.","there is perfect positive correlation between the assets.","the correlation coefficient between the assets is less than 1."],"ans":"C","expl":"Đa dạng hóa có lợi miễn là hệ số tương quan giữa các tài sản\nnhỏ hơn 1.\n(Học phần 83.4, LOS 83.f)"},{"n":45,"q":"If the standard deviation of returns for stock X is 0.60 and for stock Y is 0.40 and the\ncovariance between the returns of the two stocks is 0.009, the correlation between stocks X\nand Y is closest to:","opts":["0.0375.","26.6670.","0.0020."],"ans":"A","expl":"Cov = (r)(s)(s), trong đó r = hệ số tương quan, s = độ lệch chuẩn của cổ phiếu X ,\nX,YX,YXYx\nvà s = độ lệch chuẩn của kho Y\nY\nKhi đó, (r) = Cov / (SD × SD) = 0,009 / (0,600 × 0,400) = 0,0375\nX,YX,YXY\n(Mô-đun 83.3, LOS 83.d)"},{"n":46,"q":"An analyst gathers the following data about the returns for two stocks.\nStock AStock B\nE(R)0.040.09\n2\n0.00250.0064\nσ\nCov= 0.001\nA,B\nThe correlation between the returns of Stock A and Stock B is closest to:","opts":["0.25.","0.50.","0.63."],"ans":"A","expl":"Mối tương quan giữa hai cổ phiếu là:\nρ = COV/ (σ × σ) = 0,001 / (0,05 × 0,08) = 0,001 / (0,004) = 0,25\nA,BA,B AB\nLưu ý rằng công thức sử dụng độ lệch chuẩn chứ không phải phương sai của lợi nhuận trên\nhai chứng khoán.\n(Module 83.1, LOS 83.a)","qhtml":"<p>An analyst gathers the following data about the returns for two stocks.</p><table class=\"qtable\"><thead><tr><th></th><th>Stock A</th><th>Stock B</th></tr></thead><tbody><tr><td>E(R)</td><td>0.04</td><td>0.09</td></tr><tr><td>σ²</td><td>0.0025</td><td>0.0064</td></tr><tr><td>Cov(A,B)</td><td colspan=\"2\" style=\"text-align:center\">0.001</td></tr></tbody></table><p>The correlation between the returns of Stock A and Stock B is closest to:</p>"},{"n":47,"q":"The covariance of the market's returns with the stock's returns is 0.008. The standard\ndeviation of the market's returns is 0.1 and the standard deviation of the stock's returns is\n0.2. What is the correlation coefficient between the stock and market returns?","opts":["0.00016.","0.40.","0.91."],"ans":"B","expl":"Cov = (r)(SD)(SD), trong đó r = hệ số tương quan và SD = độ lệch chuẩn của\nA,BA,BABx\nstock x\nSau đó, (r) = Cov / (SD × SD) = 0,008 / (0,100 × 0,200) = 0,40\nA,BA,BAB\nHãy nhớ: Hệ số tương quan phải nằm trong khoảng từ -1 đến 1.\n(Mô-đun 83.3, LOS 83.d)"},{"n":48,"q":"If the standard deviation of returns for stock A is 0.40 and for stock B is 0.30 and the\ncovariance between the returns of the two stocks is 0.007 what is the correlation between\nstocks A and B?","opts":["0.05830.","0.00084.","17.14300."],"ans":"A","expl":"Cov = (r)(SD)(SD), trong đó r = hệ số tương quan và SD = độ lệch chuẩn của\nA,BA,BABx\nstock x\nKhi đó, (r) = Cov/ (SD × SD) = 0,007 / (0,400 × 0,300) = 0,0583\nA,BA,B AB\n(Mô-đun 83.3, LOS 83.d)"},{"n":49,"q":"Which of the following possible portfolios is least likely to lie on the efficient frontier?\nPortfolioExpected ReturnStandard Deviation\nX9%12%\nY11%10%\nZ13%15%","opts":["Portfolio Z.","Portfolio X.","Portfolio Y."],"ans":"B","expl":"Danh mục X có lợi tức kỳ vọng thấp hơn và độ lệch chuẩn cao hơn Danh mục Y. X\nphải không hiệu quả.\n(Học phần 83.4, LOS 83.g)","qhtml":"<p>Which of the following possible portfolios is least likely to lie on the efficient frontier?</p><table class=\"qtable\"><thead><tr><th>Portfolio</th><th>Expected Return</th><th>Standard Deviation</th></tr></thead><tbody><tr><td>X</td><td>9%</td><td>12%</td></tr><tr><td>Y</td><td>11%</td><td>10%</td></tr><tr><td>Z</td><td>13%</td><td>15%</td></tr></tbody></table>"},{"n":50,"q":"If the standard deviation of stock X is 7.2%, the standard deviation of stock Y is 5.4%, and the\ncovariance between the two is –0.0031, their correlation coefficient is closest to:","opts":["-0.19.","-0.64.","-0.80."],"ans":"C","expl":"Tương quan = (hiệp phương sai của X và Y) / [(độ lệch chuẩn của X)(độ lệch chuẩn của Y)]\n= –0,0031 / [(0,072)(0,054)] = –0,797.\n(Mô-đun 83.3, LOS 83.d)"},{"n":51,"q":"What is the variance of a two-stock portfolio if 15% is invested in stock A (variance of 0.0071)\nand 85% in stock B (variance of 0.0008) and the correlation coefficient between the stocks is\n–0.04?","opts":["0.0007.","0.0020.","0.0026."],"ans":"A","expl":"Phương sai của danh mục đầu tư được tìm thấy bởi:\n22 22 22\n[W σ+ W σ+ 2WWσσr] hoặc [(0,15)(0,0071) + (0,85)(0,0008) + (2)\n112212121,2\n(0,15)(0,85)(0,0843)(0,0283)(–0,04)] = 0,0007.\n(Mô-đun 83.3, LOS 83.e)"},{"n":52,"q":"Kendra Jackson, CFA, is given the following information on two stocks, Rockaway and\nBridgeport.\nCovariance between the two stocks = 0.0325\nStandard Deviation of Rockaway's returns = 0.25\nStandard Deviation of Bridgeport's returns = 0.13\nAssuming that Jackson must construct a portfolio using only these two stocks, which of the\nfollowing combinations will result in the minimum variance portfolio?","opts":["100% in Bridgeport.","50% in Bridgeport, 50% in Rockaway.","80% in Bridgeport, 20% in Rockaway."],"ans":"A","expl":"Trước tiên, hãy tính hệ số tương quan để kiểm tra xem liệu đa dạng hóa có mang lại bất kỳ\nbenefit.\nr = cov / [( σ) × (σ) ] =\nBridgeport, RockawayBridgeport, RockawayBridgeportRockaway\n0,0325 / (0,13 × 0,25) = 1,00\nVì các cổ phiếu có mối tương quan dương hoàn toàn nên không có lợi ích đa dạng hóa\nvà chúng tôi chọn cổ phiếu có rủi ro thấp nhất (được đo bằng phương sai hoặc độ lệch\nchuẩn), đó là Bridgeport.\n(Mô-đun 83.4, LOS 83.g)"},{"n":53,"q":"On a graph of risk, measured by standard deviation and expected return, the efficient\nfrontier represents:","opts":["the group of portfolios that have extreme values and therefore are “efficient” in their allocation.","all portfolios plotted in the northeast quadrant that maximize return.","the set of portfolios that dominate all others as to risk and return."],"ans":"C","expl":"Tập hợp hiệu quả là tập hợp các danh mục đầu tư thống trị tất cả các danh mục đầu tư khác về rủi ro và\nlợi nhuận. Nghĩa là, họ có lợi nhuận kỳ vọng cao nhất ở mỗi mức rủi ro.\n(Module 83.4, LOS 83.g)"},{"n":54,"q":"Becky Scott and Sid Fiona have the same expectations about the risk and return of the\nmarket portfolio; however, Scott selects a portfolio with 30% T-bills and 70% invested in the\nmarket portfolio, while Fiona holds a leveraged portfolio, having borrowed to invest 130% of\nhis portfolio equity value in the market portfolio. Regarding their preferences between risk\nand return and their indifference curves, it is most likely that:","opts":["Scott is willing to take on more risk to increase her expected portfolio return than Fiona is.","Scott is risk averse but Fiona is not.","Fiona’s indifference curves are flatter than Scott’s."],"ans":"C","expl":"Ngay cả những nhà đầu tư không thích rủi ro sẽ thích các danh mục đầu tư rủi ro có đòn bẩy hơn nếu mức tăng lợi nhuận dự kiến\n đủ để bù đắp cho sự gia tăng rủi ro danh mục đầu tư. Lựa chọn danh mục đầu tư của Scott ngụ ý\nrằng cô ấy không thích rủi ro hơn Fiona, có đường bàng quan dốc hơn và sẵn sàng\nchấp nhận ít rủi ro hơn để tăng dần lợi nhuận kỳ vọng so với Fiona.\n(Module 83.2, LOS 83.c)"},{"n":55,"q":"Adding a stock to a portfolio will reduce the risk of the portfolio if the correlation coefficient\nis less than which of the following?","opts":["+0.50.","0.00.","+1.00."],"ans":"C","expl":"Thêm bất kỳ cổ phiếu nào không tương quan hoàn hảo với danh mục đầu tư (+1) sẽ giảm rủi ro\ncủa danh mục đầu tư.\n(Học phần 83.4, LOS 83.f)"},{"n":56,"q":"Which one of the following portfolios cannot lie on the efficient frontier?\nPortfolioExpected ReturnStandard Deviation\nA20%35%\nB11%13%\nC8%10%\nD8%9%","opts":["Portfolio A.","Portfolio C.","Portfolio D."],"ans":"B","expl":"Danh mục C không thể nằm ở biên giới vì nó có cùng lợi nhuận như Danh mục D, nhưng có\nrủi ro hơn.\n(Mô-đun 83.4, LOS 83.g)","qhtml":"<p>Which one of the following portfolios cannot lie on the efficient frontier?</p><table class=\"qtable\"><thead><tr><th>Portfolio</th><th>Expected Return</th><th>Standard Deviation</th></tr></thead><tbody><tr><td>A</td><td>20%</td><td>35%</td></tr><tr><td>B</td><td>11%</td><td>13%</td></tr><tr><td>C</td><td>8%</td><td>10%</td></tr><tr><td>D</td><td>8%</td><td>9%</td></tr></tbody></table>"},{"n":57,"q":"Which of the following statements about the efficient frontier is least accurate?","opts":["A portfolio that plots above efficient frontier is not attainable, while a portfolio that plots below the efficient frontier is inefficient.","The efficient frontier is the set of portfolios with the greatest expected return for a given level of risk.","The slope of the efficient frontier increases steadily as risk increases."],"ans":"C","expl":"Độ dốc của đường biên hiệu quả giảm dần khi rủi ro và lợi nhuận tăng lên.\nBiên giới hiệu quả là tập hợp các danh mục đầu tư có lợi nhuận kỳ vọng lớn nhất cho một mức độ rủi ro\nnhất định được đo bằng độ lệch chuẩn của lợi nhuận. Nghĩa là, đối với một mức rủi ro nhất định,\nlợi tức kỳ vọng lớn hơn lợi tức của danh mục đầu tư trên đường biên hiệu quả là không thể đạt được\nvà danh mục đầu tư có lợi tức kỳ vọng thấp hơn là không hiệu quả.\n(Mô-đun 83.4, LOS 83.g)"},{"n":58,"q":"In a two-asset portfolio, reducing the correlation between the two assets moves the efficient\nfrontier in which direction?","opts":["The efficient frontier is stable unless return expectations change. If expectations change, the efficient frontier will extend to the upper right with little or no change in risk.","The efficient frontier is stable unless the asset’s expected volatility changes. This depends on each asset’s standard deviation.","The frontier extends to the left, or northwest quadrant representing a reduction in risk while maintaining or enhancing portfolio returns."],"ans":"C","expl":"Việc giảm mối tương quan giữa hai tài sản dẫn đến biên giới hiệu quả mở rộng sang\nbên trái và có thể tăng lên một chút. Điều này phản ánh ảnh hưởng của mối tương quan trong việc giảm\nrủi ro danh mục đầu tư.\n(Mô-đun 83.4, LOS 83.g)"},{"n":59,"q":"The graph below combines the efficient frontier with the indifference curves for two\ndifferent investors, X and Y.\nA graph illustrating the efficient frontier, showing the trade-off between expected return and\nstandard deviation of returns, along with two investors' indifference curves (Investor X and\nInvestor Y), representing different risk-return preferences.\nWhich of the following statements about the above graph is least accurate?","opts":["The efficient frontier line represents the portfolios that provide the highest return at each risk level.","Investor X is less risk-averse than Investor Y.","Investor X's expected return is likely to be less than that of Investor Y."],"ans":"B","expl":"Nhà đầu tư X có đường bàng quan dốc, cho thấy anh ta là người không thích rủi ro. Các đường bàng quan\nphẳng hơn, chẳng hạn như đường cong dành cho Nhà đầu tư Y, cho thấy nhà đầu tư ít sợ rủi ro hơn. Các\ncác lựa chọn khác đều đúng. Một nhà đầu tư ngại rủi ro hơn có thể sẽ thu được lợi nhuận thấp hơn so với một\nnhà đầu tư ít sợ rủi ro hơn.\n(Module 83.2, LOS 83.c)","qhtml":"<p>The graph below combines the efficient frontier with the indifference curves for two different investors, X and Y.</p><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 420 300\" style=\"max-width:420px;width:100%;background:#1d2740;border-radius:10px;border:1px solid #2b3a57;margin:10px 0;display:block\">\n  <!-- axes -->\n  <line x1=\"50\" y1=\"260\" x2=\"390\" y2=\"260\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <line x1=\"50\" y1=\"260\" x2=\"50\" y2=\"20\" stroke=\"#94a3b8\" stroke-width=\"1.5\"/>\n  <text x=\"210\" y=\"290\" fill=\"#94a3b8\" font-size=\"12\" text-anchor=\"middle\" font-family=\"Inter,sans-serif\">Standard Deviation of Returns</text>\n  <text x=\"14\" y=\"145\" fill=\"#94a3b8\" font-size=\"12\" text-anchor=\"middle\" font-family=\"Inter,sans-serif\" transform=\"rotate(-90,14,145)\">Expected Return</text>\n  <!-- efficient frontier -->\n  <path d=\"M100,230 Q160,180 230,120 Q290,75 360,45\" stroke=\"#9d8bff\" stroke-width=\"2.5\" fill=\"none\"/>\n  <text x=\"365\" y=\"42\" fill=\"#9d8bff\" font-size=\"11\" font-family=\"Inter,sans-serif\">EF</text>\n  <!-- Investor X indifference curves (steep - more risk averse) -->\n  <path d=\"M70,240 Q100,190 140,155 Q175,125 210,105\" stroke=\"#22c55e\" stroke-width=\"1.8\" fill=\"none\" stroke-dasharray=\"5,3\"/>\n  <path d=\"M95,240 Q130,185 170,148 Q210,115 248,93\" stroke=\"#22c55e\" stroke-width=\"1.8\" fill=\"none\" stroke-dasharray=\"5,3\"/>\n  <text x=\"215\" y=\"100\" fill=\"#22c55e\" font-size=\"11\" font-family=\"Inter,sans-serif\">X</text>\n  <!-- tangency point X -->\n  <circle cx=\"175\" cy=\"143\" r=\"4\" fill=\"#22c55e\"/>\n  <!-- Investor Y indifference curves (flat - less risk averse) -->\n  <path d=\"M130,250 Q200,220 270,175 Q320,148 365,130\" stroke=\"#f59e0b\" stroke-width=\"1.8\" fill=\"none\" stroke-dasharray=\"5,3\"/>\n  <path d=\"M155,250 Q230,215 305,165 Q350,138 390,118\" stroke=\"#f59e0b\" stroke-width=\"1.8\" fill=\"none\" stroke-dasharray=\"5,3\"/>\n  <text x=\"370\" y=\"125\" fill=\"#f59e0b\" font-size=\"11\" font-family=\"Inter,sans-serif\">Y</text>\n  <!-- tangency point Y -->\n  <circle cx=\"305\" cy=\"78\" r=\"4\" fill=\"#f59e0b\"/>\n  <!-- legend -->\n  <line x1=\"58\" y1=\"22\" x2=\"80\" y2=\"22\" stroke=\"#22c55e\" stroke-width=\"1.8\" stroke-dasharray=\"5,3\"/>\n  <text x=\"84\" y=\"26\" fill=\"#22c55e\" font-size=\"10\" font-family=\"Inter,sans-serif\">Investor X (steep)</text>\n  <line x1=\"58\" y1=\"38\" x2=\"80\" y2=\"38\" stroke=\"#f59e0b\" stroke-width=\"1.8\" stroke-dasharray=\"5,3\"/>\n  <text x=\"84\" y=\"42\" fill=\"#f59e0b\" font-size=\"10\" font-family=\"Inter,sans-serif\">Investor Y (flat)</text>\n</svg><p>Which of the following statements about the above graph is least accurate?</p>"},{"n":60,"q":"Which of the following statements about portfolio theory is least accurate?","opts":["Assuming that the correlation coefficient is less than one, the risk of the portfolio will always be less than the simple weighted average of individual stock risks.","For a two-stock portfolio, the lowest risk occurs when the correlation coefficient is close to negative one.","When the return on an asset added to a portfolio has a correlation coefficient of less than one with the other portfolio asset returns but has the same risk, adding the asset will not decrease the overall portfolio standard deviation."],"ans":"C","expl":"Khi lợi tức của một tài sản được thêm vào danh mục đầu tư có hệ số tương quan nhỏ hơn\n1 với lợi nhuận của tài sản danh mục đầu tư khác nhưng có cùng rủi ro, việc thêm tài sản sẽ\ngiảm tỷ lệ độ lệch chuẩn tổng thể của danh mục đầu tư. Bất cứ khi nào hệ số tương quan\nnhỏ hơn 1, thì việc đa dạng hóa sẽ mang lại lợi ích. Các lựa chọn khác đều đúng.\n(Mô-đun 83.4, LOS 83.f)"},{"n":61,"q":"Stock A has a standard deviation of 4.1% and Stock B has a standard deviation of 5.8%. If the\nstocks are perfectly positively correlated, which portfolio weights minimize the portfolio's\nstandard deviation?\nStock AStock B","opts":["0% | 100%","100% | 0%","63% | 37%"],"ans":"B","expl":"Vì có mối tương quan hoàn toàn tích cực nên đa dạng hóa không mang lại lợi ích gì.\nDo đó, nhà đầu tư nên dồn toàn bộ số tiền của mình vào Cổ phiếu A (có độ lệch chuẩn\nthấp nhất) để giảm thiểu rủi ro (độ lệch chuẩn) của danh mục đầu tư.\n(Module 83.4, LOS 83.f)","qhtml":"<p>Stock A has a standard deviation of 4.1% and Stock B has a standard deviation of 5.8%. If the stocks are perfectly positively correlated, which portfolio weights minimize the portfolio's standard deviation?</p><p><em>Options show → <strong>Stock A</strong> | <strong>Stock B</strong></em></p>"},{"n":62,"q":"Three portfolios have the following expected returns and risk:\nPortfolioExpected returnStandard deviation\nJones4%4%\nKelly5%6%\nLewis6%5%\nA risk-averse investor choosing from these portfolios could rationally select:","opts":["Jones, but not Kelly or Lewis.","Jones or Lewis, but not Kelly.","Lewis, but not Kelly or Jones."],"ans":"B","expl":"Không thích rủi ro có nghĩa là để chấp nhận rủi ro lớn hơn, nhà đầu tư phải được đền bù bằng\nlợi nhuận kỳ vọng cao hơn. Nhà đầu tư không thích rủi ro sẽ không chọn danh mục đầu tư nếu một danh mục đầu tư khác\nmang lại lợi nhuận kỳ vọng cao hơn với cùng rủi ro hoặc rủi ro thấp hơn với cùng lợi nhuận kỳ vọng\n. Vì vậy, một nhà đầu tư hợp lý sẽ luôn chọn Lewis thay vì Kelly, bởi vì Lewis có\ncả lợi nhuận kỳ vọng cao hơn và rủi ro thấp hơn Kelly. Cả Lewis và Kelly đều\nkhông nhất thiết phải thích hợp hơn Jones, bởi vì mặc dù Jones có lợi nhuận kỳ vọng thấp hơn nhưng nó\ncũng có rủi ro thấp hơn. Do đó, Jones hoặc Lewis có thể được lựa chọn bởi một nhà đầu tư\nhợp lý, nhưng Kelly thì không.\n(Module 83.2, LOS 83.b)","qhtml":"<p>Three portfolios have the following expected returns and risk:</p><table class=\"qtable\"><thead><tr><th>Portfolio</th><th>Expected return</th><th>Standard deviation</th></tr></thead><tbody><tr><td>Jones</td><td>4%</td><td>4%</td></tr><tr><td>Kelly</td><td>5%</td><td>6%</td></tr><tr><td>Lewis</td><td>6%</td><td>5%</td></tr></tbody></table><p>A risk-averse investor choosing from these portfolios could rationally select:</p>"},{"n":63,"q":"An investor has a two-stock portfolio (Stocks A and B) with the following characteristics:\nσ = 55%\nA\nσ = 85%\nB\nCovariance = 0.09\nA,B\nW = 70%\nA\nW = 30%\nB\nThe variance of the portfolio is closest to:","opts":["0.25.","0.54.","0.39."],"ans":"A","expl":"Công thức tính phương sai của danh mục đầu tư 2 cổ phiếu là:\n22222\ns = [Wσ + Wσ + 2WWσσr]\nAABBABABA,B\nVì σσr = Cov nên\nABA,BA,B\n22222\ns = [(0,7 × 0,55) + (0,3 × 0,85) + (2 × 0,7 × 0,3 × 0,09)] = [0,1482 + 0,0650 +\n0,0378] = 0,2511.\n(Mô-đun 83.3, LOS 83.e)","qhtml":"<p>An investor has a two-stock portfolio (Stocks A and B) with the following characteristics:</p><table class=\"qtable\"><thead><tr><th>Variable</th><th>Value</th></tr></thead><tbody><tr><td>σ<sub>A</sub></td><td>55%</td></tr><tr><td>σ<sub>B</sub></td><td>85%</td></tr><tr><td>Cov(A,B)</td><td>0.09</td></tr><tr><td>W<sub>A</sub></td><td>70%</td></tr><tr><td>W<sub>B</sub></td><td>30%</td></tr></tbody></table><p>The variance of the portfolio is closest to:</p>"},{"n":64,"q":"Over long periods of time, compared to fixed income securities, equities have tended to\nexhibit:","opts":["lower average annual returns and higher standard deviation of returns.","higher average annual returns and lower standard deviation of returns.","higher average annual returns and higher standard deviation of returns."],"ans":"C","expl":"Dựa trên dữ liệu về chứng khoán ở Hoa Kỳ từ năm 1926 đến năm 2008, cả cổ phiếu vốn hóa nhỏ\nvà cổ phiếu vốn hóa lớn đều cho thấy lợi nhuận trung bình hàng năm cao hơn và tiêu chuẩn cao hơn\nđộ lệch lợi nhuận so với trái phiếu doanh nghiệp dài hạn và trái phiếu chính phủ dài hạn.\nKết quả trong thời gian dài cũng tương tự ở các thị trường phát triển khác.\n(Mô-đun 83.1, LOS 83.a)"},{"n":65,"q":"An investor calculates the following statistics on her two-stock (A and B) portfolio.\nσ = 20%\nA\nσ = 15%\nB\nr = 0.32\nA,B\nW = 70%\nA\nW = 30%\nB\nThe portfolio's standard deviation is closest to:","opts":["0.1600.","0.0256.","0.1832."],"ans":"A","expl":"Công thức tính độ lệch chuẩn của danh mục đầu tư 2 cổ phiếu là:\n22221/2\nσ = [Wσ + Wσ + 2WWσσρ]\nAABBABABA,B\n2 22 21/2\nσ = [(0,7× 0,2) + (0,3× 0,15) + ( 2 × 0,7 × 0,3 × 0,2 × 0,15 × 0,32)] = [0,0196 +\n1/21/2\n0,002025 + 0,004032] = 0,0256570 = 0,1602 hoặc khoảng 16,0%.\n(Mô-đun 83.3, LOS 83.e)","qhtml":"<p>An investor calculates the following statistics on her two-stock (A and B) portfolio.</p><table class=\"qtable\"><thead><tr><th>Variable</th><th>Value</th></tr></thead><tbody><tr><td>σ<sub>A</sub></td><td>20%</td></tr><tr><td>σ<sub>B</sub></td><td>15%</td></tr><tr><td>r<sub>A,B</sub></td><td>0.32</td></tr><tr><td>W<sub>A</sub></td><td>70%</td></tr><tr><td>W<sub>B</sub></td><td>30%</td></tr></tbody></table><p>The portfolio's standard deviation is closest to:</p>"},{"n":66,"q":"Betsy Minor is considering the diversification benefits of a two stock portfolio. The expected\nreturn of stock A is 14 percent with a standard deviation of 18 percent and the expected\nreturn of stock B is 18 percent with a standard deviation of 24 percent. Minor intends to\ninvest 40 percent of her money in stock A, and 60 percent in stock B. The correlation\ncoefficient between the two stocks is 0.6. What is the variance and standard deviation of the\ntwo stock portfolio?","opts":["Variance = 0.02206; Standard Deviation = 14.85%.","Variance = 0.03836; Standard Deviation = 19.59%.","Variance = 0.04666; Standard Deviation = 21.60%."],"ans":"B","expl":"2222\n(0,40)(0,18) + (0,60)(0,24) + 2(0,4)(0,6)(0,18)(0,24)(0,6) = 0,03836.\n0,5\n0,03836 = 0,1959 hoặc 19,59%.\n(Mô-đun 83.3, LOS 83.e)"}];
const CFG = {"title": "Portfolio Risk and Return Part I", "subtitle": "CFA · Portfolio Management · Reading 83 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem";
    if(q.qhtml){ stem.innerHTML = q.qhtml; } else { stem.textContent = q.q; }
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  return sections;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
