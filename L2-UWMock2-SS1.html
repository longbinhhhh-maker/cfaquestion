\/p><p><b>Comment 1:<\/b> When the market price of Tiptri&#x27;s common stock is less than the bond&#x27;s conversion price, the bond will trade at a discount to its conversion value.<\/p><p><b>Comment 2:<\/b> Once the bond becomes callable, the bond should not trade at more than a slight premium to its call price.<\/p><p><b>Comment 3:<\/b> When the bond is considered a busted convertible, its minimum value is the value of an otherwise equivalent nonconvertible bond.<\/p><p>Assume all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and Exhibit 2, the arbitrage-free value of Bond 3 is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss1/q023.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":24,"q":"Which of Skya's comments regarding the arbitrage-free value of the Tiptri convertible bond is correct?","opts":["Comment 1","Comment 2","Comment 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss1/a024.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a024.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Aditya Lanka manages a bond fund for an asset management company, and Arina Skya is a fixed-income analyst on his team. Lanka and Skya discuss the use of binomial interest rate trees for valuing straight debt securities and bonds with embedded options. During the discussion, Lanka asks Skya to explain pathwise valuation for a single interest rate path. Skya describes two alternative approaches to pathwise valuation that result in the same value:<\/p><p><b>Approach 1:<\/b> Use period-by-period discounting along a single interest rate path, from maturity to Time 0.<\/p><p><b>Approach 2:<\/b> Sum the PV of all periods&#x27; cash flows, with each discounted by the appropriate term spot rates implied by that interest rate path.<\/p><p>On Aug 15 20X3, Lanka asks Skya to develop a binomial interest rate tree to evaluate three 3-year bonds of Tiptri Corporation being issued that day. Information on the bonds is shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex011.webp\" style=\"max-width:min(100%,635px)\" alt=\"Exhibit\"><p>Exhibit 2 contains the binomial tree developed by Skya:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex012.webp\" style=\"max-width:min(100%,414px)\" alt=\"Exhibit\"><p>the Tiptri convertible callable bond. Skya makes the following comments about the possible range and limitations of the bond&#x27;s no-arbitrage price:<\/p><p><b>Comment 1:<\/b> When the market price of Tiptri&#x27;s common stock is less than the bond&#x27;s conversion price, the bond will trade at a discount to its conversion value.<\/p><p><b>Comment 2:<\/b> Once the bond becomes callable, the bond should not trade at more than a slight premium to its call price.<\/p><p><b>Comment 3:<\/b> When the bond is considered a busted convertible, its minimum value is the value of an otherwise equivalent nonconvertible bond.<\/p><p>Assume all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Skya&#x27;s comments regarding the arbitrage-free value of the Tiptri convertible bond is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss1/q024.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":25,"q":"Which of Siwong's statements about the initial evaluation of the acquisition is correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss1/a025.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a025.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Corporate Issuers<\/summary><div class=\"vig-body\"><p>Sommay Siwong is the senior portfolio manager of an asset management firm. Siwong is considering increasing the firm&#x27;s exposure to Seginus Stores, a large chain of home furnishings stores. Seginus&#x27;s management recently issued a press release announcing its intention to acquire 100% of Hamal Home, a smaller company that operates in the same segment.<\/p><p>Siwong directs Janjira Tay, an equity analyst who reports to him, to perform an initial evaluation of the acquisition. He makes the following statements to guide her analysis:<\/p><p><b>Statement 1:<\/b> The acquisition costs 35% of Seginus&#x27;s EV but does not change Seginus&#x27;s strategy or focus, so it is considered immaterial.<\/p><p><b>Statement 2:<\/b> The greater the size and complexity of the transaction, the longer the timeline from announcement to closing.<\/p><p><b>Statement 3:<\/b> Comparable company analysis is used to understand the acquisition and its motivations.<\/p><p>After analyzing Seginus&#x27;s and Hamal&#x27;s 20X9 forecasted income statements, Tay creates a combined income statement considering the acquisition. She explains to Siwong that the combined statement incorporates assumptions of synergies and acquired intangible assets and that cash costs related to the combination are insignificant. She presents the statements in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex013.webp\" style=\"max-width:min(100%,566px)\" alt=\"Exhibit\"><p>Seginus&#x27;s press release and on its financial statements:<\/p><p>Before the acquisition, Seginus had annual interest expenses of $50 million and 200 million outstanding shares. Hamal does not have any debt.<\/p><p>To finance the acquisition, Seginus expects to issue $500 million in additional debt (at an annual cost of 6%) and 50 million new shares.<\/p><p>Seginus&#x27;s effective tax rate is expected to remain stable at 25%.<\/p><p>Siwong turns his attention to Bubbles Bev, a manufacturer of soft drinks. Recently, Bubbles entered the energy drinks market, which has been growing faster than the soft drinks segment. Bubbles&#x27; management believes that the company is currently trading with a conglomerate discount and studies a potential sale or spin-off of its soft drinks segment.<\/p><p>Siwong requests the most recent data about Bubbles&#x27;s capitalization and EV multiples in the beverage industry. Tay gathers this market data, summarized as follows:<\/p><p>Bubbles has 200 million shares outstanding at a market price of $35.00 per share.<\/p><p>Bubbles&#x27; debt has a market value of $4.0 billion.<\/p><p>Peers in the soft drinks segment have a median EV-to-EBITDA multiple of 8.0.<\/p><p>Peers in the energy drinks segment have a median EV-to-sales (EV/S) multiple of 12.0.<\/p><p>Tay also presents Bubbles&#x27; most recent financial data by segment in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex014.webp\" style=\"max-width:min(100%,478px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of Siwong&#x27;s statements about the initial evaluation of the acquisition is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss1/q025.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"corporate"},{"n":26,"q":"Based on Exhibit 1, the combined 20X9 forecasted income statement is most likely based on which of the following assumptions?","opts":["$20 million in acquired intangible assets","$40 million in synergies from cross-selling of products","$80 million in savings from economies of scale and elimination of redundancies"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss1/a026.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a026.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sommay Siwong is the senior portfolio manager of an asset management firm. Siwong is considering increasing the firm&#x27;s exposure to Seginus Stores, a large chain of home furnishings stores. Seginus&#x27;s management recently issued a press release announcing its intention to acquire 100% of Hamal Home, a smaller company that operates in the same segment.<\/p><p>Siwong directs Janjira Tay, an equity analyst who reports to him, to perform an initial evaluation of the acquisition. He makes the following statements to guide her analysis:<\/p><p><b>Statement 1:<\/b> The acquisition costs 35% of Seginus&#x27;s EV but does not change Seginus&#x27;s strategy or focus, so it is considered immaterial.<\/p><p><b>Statement 2:<\/b> The greater the size and complexity of the transaction, the longer the timeline from announcement to closing.<\/p><p><b>Statement 3:<\/b> Comparable company analysis is used to understand the acquisition and its motivations.<\/p><p>After analyzing Seginus&#x27;s and Hamal&#x27;s 20X9 forecasted income statements, Tay creates a combined income statement considering the acquisition. She explains to Siwong that the combined statement incorporates assumptions of synergies and acquired intangible assets and that cash costs related to the combination are insignificant. She presents the statements in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex013.webp\" style=\"max-width:min(100%,566px)\" alt=\"Exhibit\"><p>Seginus&#x27;s press release and on its financial statements: release and on its financial statements:<\/p><p>Before the acquisition, Seginus had annual interest expenses of $50 million and 200 million outstanding shares. Hamal does not have any debt.<\/p><p>To finance the acquisition, Seginus expects to issue $500 million in additional debt (at an annual cost of 6%) and 50 million new shares.<\/p><p>Seginus&#x27;s effective tax rate is expected to remain stable at 25%.<\/p><p>Siwong turns his attention to Bubbles Bev, a manufacturer of soft drinks. Recently, Bubbles entered the energy drinks market, which has been growing faster than the soft drinks segment. Bubbles&#x27; management believes that the company is currently trading with a conglomerate discount and studies a potential sale or spin-off of its soft drinks segment.<\/p><p>Siwong requests the most recent data about Bubbles&#x27;s capitalization and EV multiples in the beverage industry. Tay gathers this market data, summarized as follows:<\/p><p>Bubbles has 200 million shares outstanding at a market price of $35.00 per share.<\/p><p>Bubbles&#x27; debt has a market value of $4.0 billion.<\/p><p>Peers in the soft drinks segment have a median EV-to-EBITDA multiple of 8.0.<\/p><p>Peers in the energy drinks segment have a median EV-to-sales (EV/S) multiple of 12.0.<\/p><p>Tay also presents Bubbles&#x27; most recent financial data by segment in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex014.webp\" style=\"max-width:min(100%,478px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on market data and Exhibit 2, and assuming that 100% of the corporate costs are allocated to the soft drinks segment, Bubbles&#x27; conglomerate discount (in $ millions) is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss1/q028.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"corporate"},{"n":29,"q":"Which of the following best describes the BSM model valuation of call options?","opts":["[Stock price × N(d)] - [PV of exercise price × N(d2)]","[Stock price × N(d1)] - [PV of exercise price × N(-d2)]","[FV of stock price × N(d1)] - [PV of exercise price × N(dz)]"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss1/a029.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a029.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Derivatives<\/summary><div class=\"vig-body\"><p>Mariel Olidan manages an option trading desk for Bearing Brothers (BB), a global investment bank where Jare Fento is a trader. During a discussion of option pricing models, Olidan asks Fento to explain how the Black-Scholes-Merton (BSM) model values European equity options.<\/p><p>Then Olidan asks Fento to explain the differences between the BSM model for valuing equity options and the Black model for valuing equity futures options. In particular, Olidan wants to understand the reasons why the two models typically calculate different no-arbitrage values for seemingly similar equity and futures options (ie, both options at the money with the same time to expiration). Fento makes two statements to explain the differences in value between the two types of options:<\/p><p><b>Statement 1:<\/b> The primary difference between the values of similar equity options and equity futures options is due to differences in carry costs, which are significantly higher for equities than for a futures contract.<\/p><p><b>Statement 2:<\/b> The BSM model equity option values reflect the difference between the PV of the equity price and the PV of the option exercise price; the Black model equity futures option values reflect the PV of the difference between the futures price and option exercise price.<\/p><p>The BB trading desk is currently short 1,000 1-month Pontus Corporation calls with a 120 strike price. Olidan wants to hedge the position before the current trading session ends since Pontus will announce earnings shortly after the market closes. Olidan asks Fento to identify possible strategies to make the short call position delta neutral. Exhibit 1 contains information on Pontus stock and 1-month options Fento is considering for the delta-neutral strategy.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex015.webp\" style=\"max-width:min(100%,407px)\" alt=\"Exhibit\"><p>generally increased for options on most equities. During the discussion of the general rise in implied vols, Fento provides two possible explanations:<\/p><p>Explanation 1: Higher implied vols indicate the price of risk has increased, which means a greater cost to hedge risk with long options.<\/p><p>Explanation 2: Higher implied vol can be driven by an imbalance between the supply and demand for options in which, on balance, there are more speculators and hedgers seeking to sell options than the number of such traders seeking to buy options.<\/p><p>All options discussed by Olidan and Fento are European options, and each option contract is on one share of the underlying stock.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following best describes the BSM model valuation of call options?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss1/q029.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":30,"q":"Which of Fento's statements regarding the difference between the values of equity options and equity futures options is (are) correct?","opts":["Only Statement 1","Only Statement 2","Both Statement 1 and Statement 2"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss1/a030.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a030.webp\ Fento provides two possible explanations:<\/p><p>Explanation 1: Higher implied vols indicate the price of risk has increased, which means a greater cost to hedge risk with long options.<\/p><p>Explanation 2: Higher implied vol can be driven by an imbalance between the supply and demand for options in which, on balance, there are more speculators and hedgers seeking to sell options than the number of such traders seeking to buy options.<\/p><p>All options discussed by Olidan and Fento are European options, and each option contract is on one share of the underlying stock.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, when combined with BB&#x27;s short position in Pontus calls, which of the following trades is least likely to create a delta-neutral position?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss1/q031.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":32,"q":"Which of Festo's explanations for the general increase in the implied volatility of equity options is (are) correct?","opts":["Only Explanation 1","Only Explanation 2","Both Explanation 1 and Explanation 2"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss1/a032.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a032.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mariel Olidan manages an option trading desk for Bearing Brothers (BB), a global investment bank where Jare Fento is a trader. During a discussion of option pricing models, Olidan asks Fento to explain how the Black-Scholes-Merton (BSM) model values European equity options.<\/p><p>Then Olidan asks Fento to explain the differences between the BSM model for valuing equity options and the Black model for valuing equity futures options. In particular, Olidan wants to understand the reasons why the two models typically calculate different no-arbitrage values for seemingly similar equity and futures options (ie, both options at the money with the same time to expiration). Fento makes two statements to explain the differences in value between the two types of options:<\/p><p><b>Statement 1:<\/b> The primary difference between the values of similar equity options and equity futures options is due to differences in carry costs, which are significantly higher for equities than for a futures contract.<\/p><p><b>Statement 2:<\/b> The BSM model equity option values reflect the difference between the PV of the equity price and the PV of the option exercise price; the Black model equity futures option values reflect the PV of the difference between the futures price and option exercise price.<\/p><p>The BB trading desk is currently short 1,000 1-month Pontus Corporation calls with a 120 strike price. Olidan wants to hedge the position before the current trading session ends since Pontus will announce earnings shortly after the market closes. Olidan asks Fento to identify possible strategies to make the short call position delta neutral. Exhibit 1 contains information on Pontus stock and 1-month options Fento is considering for the delta-neutral strategy.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex015.webp\" style=\"max-width:min(100%,407px)\" alt=\"Exhibit\"><p>generally increased for options on most equities. During the discussion of the general rise in implied vols, Fento provides two possible explanations:<\/p><p>Explanation 1: Higher implied vols indicate the price of risk has increased, which means a greater cost to hedge risk with long options.<\/p><p>Explanation 2: Higher implied vol can be driven by an imbalance between the supply and demand for options in which, on balance, there are more speculators and hedgers seeking to sell options than the number of such traders seeking to buy options.<\/p><p>All options discussed by Olidan and Fento are European options, and each option contract is on one share of the underlying stock.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Festo&#x27;s explanations for the general increase in the implied volatility of equity options is (are) correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss1/q032.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"derivatives"},{"n":33,"q":"Which of LeBlanc's outcomes is (are) most likely to occur?","opts":["Only Outcome 1","Both Outcome 1 and Outcome 2","Neither Outcome 1 nor Outcome 2"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss1/a033.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a033.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Economics<\/summary><div class=\"vig-body\"><p>Pierre LeBlanc is an emerging markets strategist at a buy-side firm. LeBlanc is discussing the investment prospects of various emerging market countries with Noelle Roche, the portfolio manager for the firm&#x27;s emerging market fund. Roche is particularly concerned about Nazca, an emerging market country in South America where the fund has several investments.<\/p><p>Nazca&#x27;s currency is pegged to the US dollar (USD). Nazca has embarked on aggressive expansionary fiscal and monetary policies over the past several years, resulting in a sizeable trade and current account deficit. This deficit was funded primarily with short-term dollar-denominated debt sold to foreigners.<\/p><p>Nazca recently signed a free trade agreement with the United States that the two countries had been working on for several years. Over the past few years, in anticipation of the deal closing, there has been a surge of capital inflows, and local companies have significantly increased debt levels to build the infrastructure necessary for taking advantage of the free trade environment. The net effect of these developments has put significant upward pressure on Nazca&#x27;s currency.<\/p><p>Recently, capital flows appeared to hit a key inflection point and have reversed dramatically over a short period of time. Speculators and other leveraged market participants have begun aggressively selling the local currency. To maintain the currency peg, the country&#x27;s central bank has been buying the local currency, but the cost of issuing new debt has become prohibitive and the central bank&#x27;s reserves are almost exhausted. In response to these developments, Nazca&#x27;s central bank has announced capital controls that prevent foreign investors from repatriating funds.<\/p><p>Based on these events, LeBlanc believes the following outcomes are likely:<\/p><p><b>Outcome 1:<\/b> Most investors will view the capital controls favorably, easing selling pressure on the local currency.<\/p><p><b>Outcome 2:<\/b> Nazca&#x27;s currency will appreciate, and the central bank will reset the peg with the USD to a higher level.<\/p><p>Roche is also concerned about Nazca&#x27;s geographic neighbor Atacama, which has taken a completely different path developed inward-oriented policies allowing domestic industries to develop locally produced substitutes for goods previously imported.<\/p><p>Atacama&#x27;s GDP per capita remains low, and growth has stagnated. There is also a large informal economy and workforce. The country is now considering policy changes in an attempt to increase its GDP growth and standards of living.<\/p><p>LeBlanc lists Atacama&#x27;s proposed new policies:<\/p><p><b>Policy 1:<\/b> Lower the income tax rates.<\/p><p><b>Policy 2:<\/b> Encourage foreign direct investments to build factories that focus on exports.<\/p><p><b>Policy 3:<\/b> Impose higher tariffs on imports of goods produced by certain protected domestic industries.<\/p><p>The conversation then shifts to a discussion on the characteristics of developed versus developing markets. LeBlanc argues that numerous factors limit growth in developing countries relative to developed countries. For example, he cites antitrust regulation as a key protection for investors in developed markets.<\/p><p>LeBlanc continues by stating that, relative to developed countries, economic growth in developing countries is limited by the following key factors:<\/p><p><b>Factor 1:<\/b> High savings rates that result in an inefficient allocation of capital, reducing investment<\/p><p><b>Factor 2:<\/b> Regulatory policies that discourage entrepreneurship<\/p><p><b>Factor 3:<\/b> Poorly developed financial markets, which inhibit capital formation<\/p><\/div><\/details><div class=\"qtext\"><p>Which of LeBlanc&#x27;s outcomes is (are) most likely to occur?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss1/q033.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"economics"},{"n":34,"q":"Which of Atacama's proposed policy changes is most likely to have the largest positive impact on the country's economic growth and standards of living over time?","opts":["Policy 1","Policy 2","Policy 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss1/a034.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a034.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pierre LeBlanc is an emerging markets strategist at a buy-side firm. LeBlanc is discussing the inve ><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a037.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Globetechz is a multinational corporation headquartered in Germany with subsidiaries and investments across the world. Globetechz adheres to IFRS reporting standards.<\/p><p>On Jan 1 20X1 Globetechz acquired 30% of Floridex, a German manufacturer, for €3,600,000. Globetechz will use the equity method to account for its investment in Floridex.<\/p><p>On Jan 1 20X1, the book value of net assets was €10,000,000.<\/p><p>During 20X1, Floridex sold €120,000 of inventory upstream to Globetechz for €150,000. On Dec 31 20X1, €30,000 of that inventory remained unsold by Globetechz.<\/p><p>Floridex reported net income of €800,000 for 20X1 and paid €100,000 in dividends.<\/p><p>Heidi Holmon is Globetechz&#x27;s new chief strategy officer. She recently came to the company from a large US-based competitor that reports under US GAAP. Holmon is unfamiliar with IFRS rules for intercorporate investments and asks Gretchen Goodman, the chief accounting officer, to explain some of the differences. Goodman cites the following differences:<\/p><p><b>Difference 1:<\/b> Under US GAAP, the fair value option is available for all equity method investments. Under IFRS, the fair value option is available only to certain organizations, such as venture capital firms and unit trusts.<\/p><p><b>Difference 2:<\/b> US GAAP require objective evidence of one or more events that resulted in a loss in order to record impairment on an investment in an associate, whereas with IFRS, impairment is recorded when the fair value of the investment falls below its carrying value.<\/p><p><b>Difference 3:<\/b> Under the acquisition method, both US GAAP and IFRS allow for recognition of partial goodwill.<\/p><p>Goodman then focuses on the effective tax rate for Globetechz over the past three years. All of Globetechz&#x27;s foreign subsidiaries operate in countries with higher corporate tax rates than Germany. She notices that the rate has been increasing (as shown in Exhibit 1) and wants to find the cause.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex016.webp\" style=\"max-width:min(100%,610px)\" alt=\"Exhibit\"><p>Finally, Holman and Goodman assess several operating segments for sales performance, as shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex017.webp\" style=\"max-width:min(100%,508px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Applying the equity method, the balance of Globetechz&#x27;s investment in Floridex on Dec 31 20X1 (in €) is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss1/q037.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":38,"q":"Which difference cited by Goodman is correct?","opts":["Difference 1","Difference 2","Difference 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss1/a038.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a038.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Globetechz is a multinational corporation headquartered in Germany with subsidiaries and investments across the world. Globetechz adheres to IFRS reporting standards.<\/p><p>On Jan 1 20X1 Globetechz acquired 30% of Floridex, a German manufacturer, for €3,600,000. Globetechz will use the equity method to account for its investment in Floridex.<\/p><p>On Jan 1 20X1, the book value of net assets was €10,000,000.<\/p><p>During 20X1, Floridex sold €120,000 of inventory upstream to Globetechz for €150,000. On Dec 31 20X1, €30,000 of that inventory remained unsold by Globetechz.<\/p><p>Floridex reported net income of €800,000 for 20X1 and paid €100,000 in dividends.<\/p><p>Heidi Holmon is Globetechz&#x27;s new chief strategy officer. She recently came to the company from a large US-based competitor that reports under US GAAP. Holmon is unfamiliar with IFRS rules for intercorporate investments and asks Gretchen Goodman, the chief accounting officer, to explain some of the differences. Goodman cites the following differences:<\/p><p><b>Difference 1:<\/b> Under US GAAP, the fair value option is available for all equity method investments. Under IFRS, the fair value option is available only to certain organizations, such as venture capital firms and unit trusts.<\/p><p><b>Difference 2:<\/b> US GAAP require objective evidence of one or more events that resulted in a loss in order to record impairment on an investment in an associate, whereas with IFRS, impairment is recorded when the fair value of the investment falls below its carrying value.<\/p><p><b>Difference 3:<\/b> Under the acquisition method, both US GAAP and IFRS allow for recognition of partial goodwill.<\/p><p>Goodman then focuses on the effective tax rate for Globetechz over the past three years. All of Globetechz&#x27;s foreign subsidiaries operate in countries with higher corporate tax rates than Germany. She notices that the rate has been increasing (as shown in Exhibit 1) and wants to find the cause.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex016.webp\" style=\"max-width:min(100%,610px)\" alt=\"Exhibit\"><p>Finally, Holman and Goodman assess several operating segments for sales performance, as shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex017.webp\" style=\"max-width:min(100%,508px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which difference cited by Goodman rla plans to value each company using the market-based valuation approach. She gathers a comparable market value of invested capital-to-EBITDA (MVIC-to-EBITDA) reference for each potential target company (shown in Exhibit 1). Sefu asks which transaction would warrant a valuation premium adjustment with respect to its MVIC-to-EBITDA reference.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex018.webp\" style=\"max-width:min(100%,636px)\" alt=\"Exhibit\"><p>Next, they assess Ranko Tech, a fintech software startup with a unique proprietary platform that is rapidly capturing a growing customer base. No other competition exists in this space. Although Ranko has experienced rapid growth, it has reported negative earnings in the past year due to significant trade-show promotional expenses. Normalized earnings would have been significantly positive after adjusting for these expenses and are expected to continually grow for the foreseeable future. Based on this profile, Sefu tries to determine the appropriate valuation methodology.<\/p><p>They then focus on Jengo LLC, a luxury goods lending company. To value Jengo, they need to determine the appropriate discount rate. Due to Jengo&#x27;s small size, its debt capacity is very low and its financial statements are challenges in accurately forecasting financial results. Narla comments on several factors to consider when estimating Jengo&#x27;s discount rate:<\/p><p><b>Comment 1:<\/b> Using expanded CAPM to calculate Jengo&#x27;s discount rate requires adding an industry premium.<\/p><p><b>Comment 2:<\/b> Due to its lower debt capacity and reliance on other sources of capital, Jengo would have a lower discount rate compared with otherwise similar public competitors.<\/p><p><b>Comment 3:<\/b> The discount rate should be adjusted upward for the lack of reliable financial forecasts.<\/p><p>Finally, they consider Lasco, a wealth management firm. Narla gathers the following information in Exhibit 2 to value 100% of Lasc const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;

})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");

// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;

function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

  if(/portfolio|asset allocation|investment policy statement|\bips\b|behavioral finance|behavioral bias|cognitive error|risk aversion|utility function|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation between|covariance between|portfolio standard deviation|sharpe ratio|treynor ratio|jensen['’]?s alpha|information ratio|two-fund separation|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral investor/.test(prompt)) return "portfolio";
  return "equity";
}

const CFA_SESSION_SUBJECT_RANGES = {
  1:{ethics:[27,27],quant:[11,17],economics:[11,17],fsa:[20,25],corporate:[10,16]},
  2:{equity:[20,25],fixed:[20,25],derivatives:[9,14],alternatives:[11,16],portfolio:[14,22]}
};
const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,
  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,
  fsa:/financial statement|financial reporting|accounting|income statement|balance sheet|cash flow|revenue|expense|inventory|cost of sales|gross profit|gross margin|shareholders?['’]? equity|earnings per share|\beps\b|audit|gaap|ifrs|taxable income|deferred tax|temporary difference|intangible|long-lived|revaluation|impairment|amortization|depreciation|pension|financial ratio|receivables turnover|payables turnover|cash conversion|fixed charge coverage|normalized earnings|management['’]?s commentary/g,
  corporate:/corporate|company lifecycle|start-up|startup|early-stage|business model|franchise|board of directors|proxy voting|stakeholder|shareholder|creditor|governance|capital budgeting|capital investment|project|real option|\bnpv\b|internal rate of return|\birr\b|cost of debt|cost of capital|capital structure|weight of debt|modigliani|dividend policy|double taxation|principal-agent|working capital|liquidity|compensation|competitive strategy|porter|economies of scale|information asymmetry|agency relationship/g,
  equity:/equity|common share|preferred share|stock|market index|index weighting|market efficiency|efficient market|security market|buy order|sell order|limit order|dealer|margin requirement|leverage ratio|industry classification|company analysis|enterprise value|price-to|free cash flow to equity|\bfcfe\b|dividend discount|earnings multiplier|book value per share|intrinsic value|voting|ex-dividend/g,
  fixed:/fixed-income|fixed income|bond|debt|credit rating|credit spread|yield|spot rate|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|repo|covenant|accrued interest|priority of claims|default|extension risk|interest coverage/g,
  derivatives:/derivative|forward|future|swap|option|call buyer|call seller|put buyer|put seller|strike price|premium|put-call|binomial|contingent claim|moneyness|expiration|arbitrage|replication/g,
  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,
  portfolio:/portfolio|asset allocation|investment policy|\bips\b|behavioral|cognitive error|risk aversion|utility|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation|covariance|sharpe|treynor|jensen|information ratio|two-fund|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral/g
};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>

(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

(function(){

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
