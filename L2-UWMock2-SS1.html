<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

<script>
const DATA = [{"n":1,"q":"By participating in the Stone Industries underwriting, did either Nguyen and/or Baghdadi most likely violate Standard |(A) Professionalism -- Knowledge of the Law?","opts":["Al Only Nguyen violated the Standard.","Only Baghdadi violated the Standard.","Both Nguyen and Baghdadi violated the Standard."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss1/a001.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a001.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Daniel Nguyen is a CFA Level II Candidate who was recently hired as a junior analyst at Broadscope &amp; Company. Broadscope is an investment bank based in the United States whose clients include large multinational entities. Broadscope offers investment banking and investment advisory services, and it conducts sales and trading in many countries around the world. In some countries, securities laws and regulations are less strict than those in the US, while in other countries, the laws are more strict.<\/p><p>When underwriting securities outside the United States, Broadscope enters into a syndication agreement with investment banks located in the countries where the securities will be sold. The syndication agreement explicitly states that the local investment banks in a given country are responsible for ensuring that sales of all securities within that country comply with local laws and regulations.<\/p><p>Nguyen is assigned to a group that is underwriting an issue of callable bonds by Stone Industries in several countries, including the United States and Country A. Country A permits only accredited investors to invest in derivatives, and Country A&#x27;s laws treat callable bonds as derivative securities. Nguyen&#x27;s supervisor, Farah Baghdadi, CFA, is aware of this restriction, but Nguyen is not. The local investment bank in Country A sold some of the bonds to nonaccredited investors.<\/p><p>During the underwriting process, Nguyen spoke frequently with Paul Marchesse, a senior analyst at Stone Industries, about issues relating to the underwriting. During one of these conversations, Marchesse told Nguyen, &quot;I&#x27;ve heard from a couple of sources at Barstow Conglomerates that they really like what Broadscope has been able to do for Stone Industries and they are considering giving Broadscope some underwriting business.&quot; Nguyen relayed this information to Baghdadi, who accordingly advised Broadscope&#x27;s business development team.<\/p><p>Vincent Pardew, CFA, is a senior vice president with Broadscope who leads the sales team in the United States for the Stone Industries bonds. Twenty institutional clients expressed interest in purchasing the bonds, but based on their investment policy statements, Pardew concluded that the bonds would be suitable for only five of them. In addition, three of those five clients had discretionary accounts with Broadscope; the other two were nondiscretionary.<\/p><p>total, the clients for whom Pardew believed the bonds would be suitable placed orders for $10 million in face value for the bonds, but Pardew received only $4 million in face value. Pardew allocated the bonds only to the discretionary clients on a pro-rata basis.<\/p><p>Nguyen wants to take a second job to generate more income. He contacts Cleaner Air Products, for whom he worked as an inventory clerk during college. Cleaner Air Products offers him his former position, and he arranges the schedule so that it does not conflict with his duties at Broadscope. Before accepting, however, he asks Baghdadi to approve this arrangement. Baghdadi replies, &quot;Yeah, I guess so. Just make sure it doesn&#x27;t interfere with what you&#x27;re doing for us.&quot;<\/p>< e for ensuring that sales of all securities within that country comply with local laws and regulations.<\/p><p>Nguyen is assigned to a group that is underwriting an issue of callable bonds by Stone Industries in several countries, including the United States and Country A. Country A permits only accredited investors to invest in derivatives, and Country A&#x27;s laws treat callable bonds as derivative securities. Nguyen&#x27;s supervisor, Farah Baghdadi, CFA, is aware of this restriction, but Nguyen is not. The local investment bank in Country A sold some of the bonds to nonaccredited investors.<\/p><p>During the underwriting process, Nguyen spoke frequently with Paul Marchesse, a senior analyst at Stone Industries, about issues relating to the underwriting. During one of these conversations, Marchesse told Nguyen, &quot;I&#x27;ve heard from a couple of sources at Barstow Conglomerates that they really like what Broadscope has been able to do for Stone Industries and they are considering giving Broadscope some underwriting business.&quot; Nguyen relayed this information to Baghdadi, who accordingly advised Broadscope&#x27;s business development team.<\/p><p>Vincent Pardew, CFA, is a senior vice president with Broadscope who leads the sales team in the United States for the Stone Industries bonds. Twenty institutional clients expressed interest in purchasing the bonds, but based on their investment policy statements, Pardew concluded that the bonds would be suitable for only five of them. In addition, three of those five clients had discretionary accounts with Broadscope; the other two were nondiscretionary.<\/p><p>total, the clients for whom Pardew believed the bonds would be suitable placed orders for $10 million in face value for the bonds, but Pardew received only $4 million in face value. Pardew allocated the bonds only to the discretionary clients on a pro-rata basis.<\/p><p>Nguyen wants to take a second job to generate more income. He contacts Cleaner Air Prod he clients for whom Pardew believed the bonds would be suitable placed orders for $10 million in face value for the bonds, but Pardew received only $4 million in face value. Pardew allocated the bonds only to the discretionary clients on a pro-rata basis.<\/p><p>Nguyen wants to take a second job to generate more income. He contacts Cleaner Air Products, for whom he worked as an inventory clerk during college. Cleaner Air Products offers him his former position, and he arranges the schedule so that it does not conflict with his duties at Broadscope. Before accepting, however, he asks Baghdadi to approve this arrangement. Baghdadi replies, &quot;Yeah, I guess so. Just make sure it doesn&#x27;t interfere with what you&#x27;re doing for us.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Based on only the information provided, Pardew&#x27;s actions in allocating the Stone Industries bonds most likely violated the Duties to Clients Standard relating to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss1/q003.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":4,"q":"Did Nguyen violate Standard IV(B) Duties to Employers - Additional Compensation Arrangements through accepting a position with Cleaner Air Products?","opts":["Yes.","No, since he received approval from Baghdadi.","No, since the position does not conflict with Broadscope."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss1/a004.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a004.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Daniel Nguyen is a CFA Level II Candidate who was recently hired as a eam in the United States for the Stone Industries bonds. Twenty institutional clients expressed interest in purchasing the bonds, but based on their investment policy statements, Pardew concluded that the bonds would be suitable for only five of them. In addition, three of those five clients had discretionary accounts with Broadscope; the other two were nondiscretionary.<\/p><p>total, the clients for whom Pardew believed the bonds would be suitable placed orders for $10 million in face value for the bonds, but Pardew received only $4 million in face value. Pardew allocated the bonds only to the discretionary clients on a pro-rata basis.<\/p><p>Nguyen wants to take a second job to generate more income. He contacts Cleaner Air Products, for whom he worked as an inventory clerk during college. Cleaner Air Products offers him his former position, and he arranges the schedule so that it does not conflict with his duties at Broadscope. Before accepting, however, he asks Baghdadi to approve this arrangement. Baghdadi replies, &quot;Yeah, I guess so. Just make sure it doesn&#x27;t interfere with what you&#x27;re doing for us.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Did Nguyen violate Standard IV(B) Duties to Employers - Additional Compensation Arrangements through accepting a position with Cleaner Air Products?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss1/q004.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":5,"q":"Based on only Exhibit 1, from 20X0 to 20X2, Legado Bank most likely:","opts":["improved its sensitivity to market risk.","reduced its reliance on short-term funding sources.","complied with the total capital ratio requirement set forth in Basel III."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss1/a005.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a005.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Modesto Gallardo is an equity analyst at an asset management firm. One of the firm&#x27;s portfolio managers asks Gallardo to analyze Legado Bank, a local commercial bank. Gallardo decides to start his analysis using the CAMELS approach and Legado&#x27;s key performance ratios, which are shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex001.webp\" style=\"max-width:min(100%,498px)\" alt=\"Exhibit\"><p>Gallardo is concerned about the quality of Legado Bank&#x27;s earnings. He analyzes the bank&#x27;s income statement, looking for signs of potential problems. Summarized data is presented in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex002.webp\" style=\"max-width:min(100%,468px)\" alt=\"Exhibit\"><p>Gallardo knows that Legado Bank offers a defined benefit pension plan to all its employees. In 20X2, the bank reported a net pension asset in its balance sheet. Gallardo wants to better understand the plan&#x27;s pension obligation and funding status and asks his colleague, Irina Belda, for support on this issue. Belda makes the following statements:<\/p><p><b>Statement 1:<\/b> The pension obligation is the difference between the PV of future obligations and the fair value of the plan&#x27;s assets.<\/p><p><b>Statement 2:<\/b> The discount rate is based on the plan sponsor&#x27;s cost of debt.<\/p><p>reported net pension asset.<\/p><p>Belda informs Gallardo that companies typically report important information about their pension plans in the notes to the financial statements. For example, Legado Bank presents the effects that potential changes in pension plan assumptions would have on pension obligations. Gallardo uses Exhibit 3 to estimate how a 1 percentage point increase in the discount rate would affect Legado Bank&#x27;s debt-to-equity ratio. Currently, the bank&#x27;s shareholders&#x27; equity is €47 billion and total liabilities are €517 billion.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex003.webp\" style=\"max-width:min(100%,432px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on only Exhibit 1, from 20X0 to 20X2, Legado Bank most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss1/q005.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":6,"q":"All else equal and based on only Exhibit 2, which of the following trends most likely suggests that the quality of Legado Bank's earnings is worsening?","opts":["The decrease in total revenues","The change in the composition of total revenues","• The increasing weight of discretionary decisions in pretax income"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss1/a006.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a006.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Modesto Gallardo is an equity analyst at an asset management firm. One of the firm&#x27;s portfolio managers asks Gallardo to analyze Legado Bank, a local commercial bank. Gallardo decides to start his analysis using the CAMELS approach and Legado&#x27;s key performance ratios, which are shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex001.webp\" style=\"max-width:min(100%,498px)\" alt=\"Exhibit\"><p>Gallardo is concerned about the quality of Legado Bank&#x27;s earnings. He analyzes the bank&#x27;s income statement, looking for signs of potential problems. out their pension plans in the notes to the financial statements. For example, Legado Bank presents the effects that potential changes in pension plan assumptions would have on pension obligations. Gallardo uses Exhibit 3 to estimate how a 1 percentage point increase in the discount rate would affect Legado Bank&#x27;s debt-to-equity ratio. Currently, the bank&#x27;s shareholders&#x27; equity is €47 billion and total liabilities are €517 billion.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex003.webp\" style=\"max-width:min(100%,432px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of Belda&#x27;s statements about Legado Bank&#x27;s pension plan&#x27;s obligation and funding status is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss1/q007.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":8,"q":"Based on Exhibit 3, if there is a 1 percentage point increase in the pension plan discount rate, Legado Bank's debt-to-equity ratio would be closest to:","opts":["10.17","10.24","10.93"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss1/a008.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a008.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Modesto Gallardo is an equity analyst at an asset management firm. One of the firm&#x27;s portfolio managers asks Gallardo to analyze Legado Bank, a local commercial bank. Gallardo decides to start his analysis using the CAMELS approach and Legado&#x27;s key performance ratios, which are shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex001.webp\" style=\"max s<\/p><p><b>Statement 2:<\/b> Are less reliant on terminal value estimates<\/p><p><b>Statement 3:<\/b> Provide a more accurate intrinsic value estimate<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 3 and Exhibit 4, and using the most appropriate valuation metric, relative to industry peers Tangub is:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss1/q011.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":12,"q":"Which of Bulan's statements regarding residual income models is correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss1/a012.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a012.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Romeo Bulan, an equity analyst at Quezon Capital, considers a stock to be over- or undervalued in the market if the stock&#x27;s price differs by more than 5% from his valuation. Bulan is evaluating the investment prospect of Candon, a packaged food producer. On the first day of 20X2, Candon&#x27;s current share price is $55.50. Selected forecasted financial data are presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex004.webp\" style=\"max-width:min(100%,551px)\" alt=\"Exhibit\"><p>Bulan also forecasts the following specific financial line items and assumes growth in free cash flow to equity (FCFE) will match the long-term earnings growth rate beginning in 20X5:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex005.webp\" style=\"max-width:min(100%,513px)\" alt=\"Exhibit\"><p>Next, Bulan focuses on Tangub, a retail drugstore chain that currently has a market price of $60 per common share. Bulan compiles the following selected 20X1 financial information in Exhibit 3 to conduct a relative valuation analysis:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex006.webp\" style=\"max-width:min(100%,423px)\" alt=\"Exhibit\"><p>valuation analysis, as presented in Exhibit 4:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex007.webp\" style=\"max-width:min(100%,461px)\" alt=\"Exhibit\"><p>Later that day, Bulan discusses the merits of various valuation methods with a colleague. Bulan states that, relative to a FCF model, residual income (RI) models:<\/p><p><b>Statement 1:<\/b> Require minimal accounting data input adjustments<\/p><p><b>Statement 2:<\/b> Are less reliant on terminal value estimates<\/p><p><b>Statement 3:<\/b> Provide a more accurate intrinsic value estimate<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Bulan&#x27;s statements regarding residual income models is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss1/q012.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":13,"q":"Based on Jabari's macro situation recap, the current market price (per $100 par value) of a one- year nominal default-free government zero-coupon bond is closest to:","opts":["97.09","98.04","100.00"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss1/a013.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a013.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Kayla Gharib is a macro strategist at a university endowment. Nora Jabari is an investment analyst at the endowment and works closely with Gharib. Gharib and Jabari are discussing key macro assumptions that affect the endowment&#x27;s investment portfolio.<\/p><p>Jabari provides a recap of current macro interest rate conditions:<\/p><p>Over the past year, inflation has averaged 3%.<\/p><p>The real yield on the one-year inflation-protected government bond is currently −2%.<\/p><p>The current break-even inflation rate is 2%.<\/p><p>The market&#x27;s consensus is that the business cycle appears to have peaked, the yield curve has inverted, and an economic contraction seems imminent. The central bank has indicated a policy bias toward easing monetary policy, and current market expectations are for the policy rate to be lowered by 1% over the coming year, with an associated parallel shift in the yield curve.<\/p><p>Based on this macroeconomic backdrop, Gharib and Jabari discuss the upcoming investment prospects for several bond indexes, all of which have a five-year average maturity and four-year duration profile.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex008.webp\" style=\"max-width:min(100%,645px)\" alt=\"Exhibit\"><p>Jabari makes the following statement regarding the one-year return outlook for the indexes:<\/p><p><b>Statement 1:<\/b> Since the interest rate risk is the same for all three indexes, all three should benefit equally from falling interest rates and have similar performance.<\/p><p><b>Statement 2:<\/b> The investment grade corporate index should outperform the government bond index.<\/p><p><b>Statement 3:<\/b> The high yield index is likely to be the best performer as it has an inherent yield advantage.<\/p><p>Shifting the focus of the conversation to corporate earnings growth expectations in relation to the business cycle, Gharib makes the following observations:<\/p><p>Observation 1:A leading indicator of the business cycle is the trend in corporate profit margins.<\/p><p>Observation 2:A downturn in the business cycle will generally result in an equal decline in profit margins across durable and nondurable industries.<\/p><p>Observation 3:A sharp decline in real earnings nearly always coincides with a recession.<\/p><p>With the potential for a downturn in the business cycle, the conversation shifts once again to the consumption hedging properties of bonds and equities. Jabari makes the following comments:<\/p><p><b>Comment 1:<\/b> The equity risk premium can be thought of as a spread relative to credit-risky bonds.<\/p><p><b>Comment 2:<\/b> The consumption hedging properties of equities are a fundamental driver for investors to demand an equity risk premium.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Jabari&#x27;s macro situation recap, the current market price (per $100 par value) of a one- year nominal default-free government zero-coupon bond is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss1/q013.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":14,"q":"Based on Exhibit 1 and the macroeconomic outlook, which of Jabari's and Gharib's statements is (are) most likely correct?","opts":["Only Statement 1","Only Statement 2 and Statement 3","None of the statements are correct"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss1/a014.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a014.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Kayla Gharib is a macro strategist at a university endowment. Nora Jabari is an investment analyst at the endowment and works closely with Gharib. Gharib and Jabari are discussing key macro assumptions that affect the endowment&#x27;s investment portfolio.<\/p><p>Jabari provides a recap of curre h the potential for a downturn in the business cycle, the conversation shifts once again to the consumption hedging properties of bonds and equities. Jabari makes the following comments:<\/p><p><b>Comment 1:<\/b> The equity risk premium can be thought of as a spread relative to credit-risky bonds.<\/p><p><b>Comment 2:<\/b> The consumption hedging properties of equities are a fundamental driver for investors to demand an equity risk premium.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and the macroeconomic outlook, which of Jabari&#x27;s and Gharib&#x27;s statements is (are) most likely correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss1/q014.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":15,"q":"Which two of Gharib's observations regarding corporate earnings growth expectations in relation to the business cycle are correct?","opts":["Observation 1 and Observation 2","Observation 1 and Observation 3","Observation 2 and Observation 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss1/a015.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a015.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Kayla Gharib is a macro strategist at a university endowment. Nora Jabari is an investment analyst at the endowment and works closely with Gharib. Gharib and Jabari are discussing key macro assumptions that affect the endowment&#x27;s investment portfolio.<\/p><p>Jabari provides a recap of current macro interest rate conditions:<\/p><p>Over the past year, inflation has averaged 3%.<\/p><p>The real yield on the one-year inflation-protected government bond is currently −2%.<\/p><p>The current break-even inflation rate is 2%.<\/p><p>The market&#x27;s consensus is that the business cycle appears to have peaked, the yield curve has inverted, and an economic contraction seems imminent. The central bank has indicated a policy bias toward easing monetary policy, and current market expectations are for the policy rate to be lowered by 1% over the coming year, with an associated parallel shift in the yield curve.<\/p><p>Based on this macroeconomic backdrop, Gharib and Jabari discuss the upcoming investment prospects for several bond indexes, all of which have a five-year average maturity and four-year duration profile.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex008.webp\" style=\"max-width:min(100%,645px)\" alt=\"Exhibit\"><p>Jabari makes the following statement regarding the one-year return outlook for the indexes:<\/p><p><b>Statement 1:<\/b> Since the interest rate risk is the same for all three indexes, all three should benefit equally from falling interest rates and have similar performance.<\/p><p><b>Statement 2:<\/b> The investment grade corporate index should outperform the government bond index.<\/p><p><b>Statement 3:<\/b> The high yield index is likely to be the best performer as it has an inherent yield advantage.<\/p><p>Shifting the focus of the conversation to corporate earnings growth expectations in relation to the business cycle, Gharib makes the following observations:<\/p><p>Observation 1:A leading indicator of the business cycle is the trend in corporate profit margins.<\/p><p>Observation 2:A downturn in the business cycle will generally result in an equal decline in profit margins across durable and nondurable industries.<\/p><p>Observation 3:A sharp decline in real earnings nearly always coincides with a recession.<\/p><p>With the potential for a downturn in the business cycle, the conversation shifts once again to the consumption hedging properties of bonds and equities. Jabari makes the following comments:<\/p><p><b>Comment 1:<\/b> The equity risk premium can be thought of as a spread relative to credit-risky bonds.<\/p><p><b>Comment 2:<\/b> The consumption hedging properties of equities are a fundamental driver for investors to demand an equity risk premium.<\/p><\/div><\/details><div class=\"qtext\"><p>Which two of Gharib&#x27;s observations regarding corporate earnings growth expectations in relation to the business cycle are correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss1/q015.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":16,"q":"Which of Jabari's comments is (are) correct?","opts":["Only Comment 1","Only Comment 2","Both Comment 1 and Comment 2"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss1/a016.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a016.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Kayla Gharib is a macro strategist at a university endowment. Nora Jabari is an investment analyst at the endowment and works closely with Gharib. Gharib and Jabari are discussing key macro assumptions that affect the endowment&#x27;s investment portfolio.<\/p><p>Jabari provides a recap of current macro interest rate conditions:<\/p><p>Over the past year, inflation has averaged 3%.<\/p><p>The real yield on the one-year inflation-protected government bond is currently −2%.<\/p><p>The current break-even inflation rate is 2%.<\/p><p>The market&#x27;s consensus is that the business cycle appears to have peaked, the yield curve has inverted, and an economic contraction seems imminent. The central bank has indicated a policy bias toward easing monetary policy, and current market expectations are for the policy rate to be lowered by 1% over the coming year, with an associated parallel shift in the yield curve.<\/p><p>Based on this macroeconomic backdrop, Gharib and Jabari discuss the upcoming investment prospects for several bond indexes, all of which have a five-year average maturity and four-year duration profile.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex008.webp\" style=\"max-width:min(100%,645px)\" alt=\"Exhibit\"><p>Jabari makes the following statement regarding the one-year return outlook for the indexes:<\/p><p><b>Statement 1:<\/b> Since the interest rate risk is the same for all three indexes, all three should benefit equally from falling interest rates and have similar performance.<\/p><p><b>Statement 2:<\/b> The investment grade corporate index should outperform the government bond index.<\/p><p><b>Statement 3:<\/b> The high yield index is likely to be the best performer as it has an inherent yield advantage.<\/p><p>Shifting the focus of the conversation to corporate earnings growth expectations in relation to the business cycle, Gharib makes the following observations:<\/p><p>Observation 1:A leading indicator of the business cycle is the trend in corporate profit margins.<\/p><p>Observation 2:A downturn in the business cycle will generally result in an equal decline in profit margins across durable and nondurable industries.<\/p><p>Observation 3:A sharp decline in real earnings nearly always coincides with a recession.<\/p><p>With the potential for a downturn in the business cycle, the conversation shifts once again to the consumption hedging properties of bonds and equities. Jabari makes the following comments:<\/p><p><b>Comment 1:<\/b> The equity risk premium can be thought of as a spread relative to credit-risky bonds.<\/p><p><b>Comment 2:<\/b> The consumption hedging properties of equities are a fundamental driver for investors to demand an equity risk premium.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Jabari&#x27;s comments is (are) correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss1/q016.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":17,"q":"Based only on Exhibit 1, the implied ROl for Mintaka's investment in CardShield at the time of the Series B financing is closest to:","opts":["44x","48x","50x"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss1/a017.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a017.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Domenic Guimond is a principal at Mintaka Partners, a venture capital (VC) firm. In 20X7, Mintaka invested in CardShield, a cybersecurity start-up that uses artificial intelligence to prevent credit card fraud. Due to CardShield&#x27;s impressive performance in predicting and preventing fraud, its client base and growth prospects increased substantially in 20X8, attracting more investors for a Series B financing.<\/p><p>Guimond asks Tatiana Goyette, a junior associate, to calculate the firm&#x27;s implied ROI after this second round of financing. Goyette prepares data (shown in Exhibit 1) related to CardShield&#x27;s financing by Mintaka and other investors in 20X7 (Series A) and by other VC funds in 20X8 (Series B).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex009.webp\" style=\"max-width:min(100%,462px)\" alt=\"Exhibit\"><p>Guimond adds that the estimated return reflected in the implied ROI is based on the current valuation level, but the actual return will depend on other factors, such as the chosen exit route and the exit timing. He asks about the differences between alternative exit routes, and Goyette makes the following statements:<\/p><p><b>Statement 1:<\/b> An IPO is a more common exit alternative than a secondary market sale.<\/p><p><b>Statement 2:<\/b> A secondary market sale typically results in a greater valuation than a management buyout (MBO).<\/p><p><b>Statement 3:<\/b> An IPO aligns the interests of management and investors more efficiently than an MBO.<\/p><p>Guimond then focuses on Mintaka Capital 3 (MC3), the VC fund that holds the investment in CardShield, among other start-ups. He asks Goyette to gather information about the capital already called down, operating results, fees, and distributions to limited partners. Goyette prepares Exhibit<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex010.webp\" style=\"max-width:min(100%,336px)\" alt=\"Exhibit\"><p>in 20X4:<\/p><p>Goyette tells Guimond that she would like to better understand the structure and life cycle of private equity (PE) funds. Guimond lists the following characteristics of PE funds:<\/p><p><b>Characteristic 1:<\/b> The liability of limited partners is limited to their proportional share of the fund&#x27;s liabilities.<\/p><p><b>Characteristic 2:<\/b> Proceeds from sales of investments are returned to limited partners when the fund is dissolved.<\/p><p><b>Characteristic 3:<\/b> PE funds typically have a duration of 10 to 12 years plus an extension of 2 to 3 years.<\/p><\/div><\/details><div class=\"qtext\"><p>Based only on Exhibit 1, the implied ROl for Mintaka&#x27;s investment in CardShield at the time of the Series B financing is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss1/q017.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":18,"q":"Which of Goyette's statements about alternative exit routes is correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss1/a018.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a018.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Domenic Guimond is a principal at Mintaka Partners, a venture capital (VC) firm. In 20X7, Mintaka invested in CardShield, a cybersecurity start-up that uses artificial intelligence to prevent credit card fraud. Due to CardShield&#x27;s impressive performance in predicting and preventing fraud, its client base and growth prospects increased substantially in 20X8, attracting more investors for a Series B financing.<\/p><p>Guimond asks Tatiana Goyette, a junior associate, to calculate the firm&#x27;s implied ROI after this second round of financing. Goyette prepares data (shown in Exhibit 1) related to CardShield&#x27;s financing by Mintaka and other investors in 20X7 (Series A) and by other VC funds in 20X8 (Series B).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex009.webp\" style=\"max-width:min(100%,462px)\" alt=\"Exhibit\"><p>Guimond adds that the estimated return reflected in the implied ROI is based on the current valuation level, but the actual return will depend on other factors, such as the chosen exit route and the exit timing. He asks about the differences between alternative exit routes, and Goyette makes the following statements:<\/p><p><b>Statement 1:<\/b> An IPO is a more common exit alternative than a secondary market sale.<\/p><p><b>Statement 2:<\/b> A secondary market sale typically results in a greater valuation than a management buyout (MBO).<\/p><p><b>Statement 3:<\/b> An IPO aligns the interests of management and investors more efficiently than an MBO.<\/p><p>Guimond then focuses on Mintaka Capital 3 (MC3), the VC fund that holds the investment in CardShield, among other start-ups. He asks Goyette to gather information about the capital already called down, operating results, fees, and distributions to limited partners. Goyette prepares Exhibit<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex010.webp\" style=\"max-width:min(100%,336px)\" alt=\"Exhibit\"><p>in 20X4:<\/p><p>Goyette tells Guimond that she would like to better understand the structure and life cycle of private equity (PE) funds. Guimond lists the following characteristics of PE funds:<\/p><p><b>Characteristic 1:<\/b> The liability of limited partners is limited to their proportional share of the fund&#x27;s liabilities.<\/p><p><b>Characteristic 2:<\/b> Proceeds from sales of investments are returned to limited partners when the fund is dissolved.<\/p><p><b>Characteristic 3:<\/b> PE funds typically have a duration of 10 to 12 years plus an extension of 2 to 3 years.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Goyette&#x27;s statements about alternative exit routes is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss1/q018.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":19,"q":"Based only on Exhibit 2, the residual value to paid-in capital (RVPI) of MC3 in 20X8 is closest to:","opts":["1.7x","1.9X","2.1x"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss1/a019.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a019.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Domenic Guimond is a principal at Mintaka Partners, a venture capital (VC) firm. In 20X7, Mintaka invested in CardShield, a cybersecurity start-up that uses artificial intelligence to prevent credit card fraud. Due to CardShield&#x27;s impressive performance in predicting and preventing fraud, its client base and growth prospects increased substantially in 20X8, attracting more investors for a Series B financing.<\/p><p>Guimond asks Tatiana Goyette, a junior associate, to calculate the firm&#x27;s implied ROI after this second round of financing. Goyette prepares data (shown in Exhibit 1) related to CardShield&#x27;s financing by Mintaka and other investors in 20X7 (Series A) and by other VC funds in 20X8 (Series B).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex009.webp\" style=\"max-width:min(100%,462px)\" alt=\"Exhibit\"><p>Guimond adds that the estimated return reflected in the implied ROI is based on the current valuation level, but the actual return will depend on other factors, such as the chosen exit route and the exit timing. He asks about the differences between alternative exit routes, and Goyette makes the following statements:<\/p><p><b>Statement 1:<\/b> An IPO is a more common exit alternative than a secondary market sale.<\/p><p><b>Statement 2:<\/b> A secondary market sale typically results in a greater valuation than a management buyout (MBO).<\/p><p><b>Statement 3:<\/b> An IPO aligns the interests of management and investors more efficiently than an MBO.<\/p><p>Guimond then focuses on Mintaka Capital 3 (MC3), the VC fund that holds the investment in CardShield, among other start-ups. He asks Goyette to gather information about the capital already called down, operating results, fees, and distributions to limited partners. Goyette prepares Exhibit<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex010.webp\" style=\"max-width:min(100%,336px)\" alt=\"Exhibit\"><p>in 20X4:<\/p><p>Goyette tells Guimond that she would like to better understand the structure and life cycle of private equity (PE) funds. Guimond lists the following characteristics of PE funds:<\/p><p><b>Characteristic 1:<\/b> The liability of limited partners is limited to their proportional share of the fund&#x27;s liabilities.<\/p><p><b>Characteristic 2:<\/b> Proceeds from sales of investments are returned to limited partners when the fund is dissolved.<\/p><p><b>Characteristic 3:<\/b> PE funds typically have a duration of 10 to 12 years plus an extension of 2 to 3 years.<\/p><\/div><\/details><div class=\"qtext\"><p>Based only on Exhibit 2, the residual value to paid-in capital (RVPI) of MC3 in 20X8 is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss1/q019.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":20,"q":"Which of the characteristics of PE funds listed by Guimond is correct?","opts":["Characteristic 1","Characteristic 2","Characteristic 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss1/a020.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a020.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Domenic Guimond is a principal at Mintaka Partners, a venture capital (VC) firm. In 20X7, Mintaka invested in CardShield, a cybersecurity start-up that uses artificial intelligence to prevent credit card fraud. Due to CardShield&#x27;s impressive performance in predicting and preventing fraud, its client base and growth prospects increased substantially in 20X8, attracting more investors for a Series B financing.<\/p><p>Guimond asks Tatiana Goyette, a junior associate, to calculate the firm&#x27;s implied ROI after this second round of financing. Goyette prepares data (shown in Exhibit 1) related to CardShield&#x27;s financing by Mintaka and other investors in 20X7 (Series A) and by other VC funds in 20X8 (Series B).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex009.webp\" style=\"max-width:min(100%,462px)\" alt=\"Exhibit\"><p>Guimond adds that the estimated return reflected in the implied ROI is based on the current valuation level, but the actual return will depend on other factors, such as the chosen exit route and the exit timing. He asks about the differences between alternative exit routes, and Goyette makes the following statements:<\/p><p><b>Statement 1:<\/b> An IPO is a more common exit alternative than a secondary market sale.<\/p><p><b>Statement 2:<\/b> A secondary market sale typically results in a greater valuation than a management buyout (MBO).<\/p><p><b>Statement 3:<\/b> An IPO aligns the interests of management and investors more efficiently than an MBO.<\/p><p>Guimond then focuses on Mintaka Capital 3 (MC3), the VC fund that holds the investment in CardShield, among other start-ups. He asks Goyette to gather information about the capital already called down, operating results, fees, and distributions to limited partners. Goyette prepares Exhibit<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex010.webp\" style=\"max-width:min(100%,336px)\" alt=\"Exhibit\"><p>in 20X4:<\/p><p>Goyette tells Guimond that she would like to better understand the structure and life cycle of private equity (PE) funds. Guimond lists the following characteristics of PE funds:<\/p><p><b>Characteristic 1:<\/b> The liability of limited partners is limited to their proportional share of the fund&#x27;s liabilities.<\/p><p><b>Characteristic 2:<\/b> Proceeds from sales of investments are returned to limited partners when the fund is dissolved.<\/p><p><b>Characteristic 3:<\/b> PE funds typically have a duration of 10 to 12 years plus an extension of 2 to 3 years.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the characteristics of PE funds listed by Guimond is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss1/q020.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":21,"q":"Which of Skya's approaches for calculating pathwise valuation compared with backward induction is (are) correct?","opts":["Only Approach 1","Only Approach 2","Both Approach 1 and Approach 2"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss1/a021.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a021.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Fixed Income<\/summary><div class=\"vig-body\"><p>Aditya Lanka manages a bond fund for an asset management company, and Arina Skya is a fixed-income analyst on his team. Lanka and Skya discuss the use of binomial interest rate trees for valuing straight debt securities and bonds with embedded options. During the discussion, Lanka asks Skya to explain pathwise valuation for a single interest rate path. Skya describes two alternative approaches to pathwise valuation that result in the same value:<\/p><p><b>Approach 1:<\/b> Use period-by-period discounting along a single interest rate path, from maturity to Time 0.<\/p><p><b>Approach 2:<\/b> Sum the PV of all periods&#x27; cash flows, with each discounted by the appropriate term spot rates implied by that interest rate path.<\/p><p>On Aug 15 20X3, Lanka asks Skya to develop a binomial interest rate tree to evaluate three 3-year bonds of Tiptri Corporation being issued that day. Information on the bonds is shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex011.webp\" style=\"max-width:min(100%,635px)\" alt=\"Exhibit\"><p>Exhibit 2 contains the binomial tree developed by Skya:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex012.webp\" style=\"max-width:min(100%,414px)\" alt=\"Exhibit\"><p>the Tiptri convertible callable bond. Skya makes the following comments about the possible range and limitations of the bond&#x27;s no-arbitrage price:<\/p><p><b>Comment 1:<\/b> When the market price of Tiptri&#x27;s common stock is less than the bond&#x27;s conversion price, the bond will trade at a discount to its conversion value.<\/p><p><b>Comment 2:<\/b> Once the bond becomes callable, the bond should not trade at more than a slight premium to its call price.<\/p><p><b>Comment 3:<\/b> When the bond is considered a busted convertible, its minimum value is the value of an otherwise equivalent nonconvertible bond.<\/p><p>Assume all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Skya&#x27;s approaches for calculating pathwise valuation compared with backward induction is (are) correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss1/q021.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":22,"q":"Based on Exhibit 1 and Exhibit 2, the arbitrage-free value of Bond 2 is closest to:","opts":["100.865","100.976","101.000"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss1/a022.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/a022.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Aditya Lanka manages a bond fund for an asset management company, and Arina Skya is a fixed-income analyst on his team. Lanka and Skya discuss the use of binomial interest rate trees for valuing straight debt securities and bonds with embedded options. During the discussion, Lanka asks Skya to explain pathwise valuation for a single interest rate path. Skya describes two alternative approaches to pathwise valuation that result in the same value:<\/p><p><b>Approach 1:<\/b> Use period-by-period discounting along a single interest rate path, from maturity to Time 0.<\/p><p><b>Approach 2:<\/b> Sum the PV of all periods&#x27; cash flows, with each discounted by the appropriate term spot rates implied by that interest rate path.<\/p><p>On Aug 15 20X3, Lanka asks Skya to develop a binomial interest rate tree to evaluate three 3-year bonds of Tiptri Corporation being issued that day. Information on the bonds is shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex011.webp\" style=\"max-width:min(100%,635px)\" alt=\"Exhibit\"><p>Exhibit 2 contains the binomial tree developed by Skya:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss1/ex012.webp\" style=\"max-width:min(100%,414px)\" alt=\"Exhibit\"><p>the Tiptri convertible callable bond. Skya makes the following comments about the possible range and limitations of the bond&#x27;s no-arbitrage price:<\/p><p><b>Comment 1:<\/b> When the market price of Tiptri&#x27;s common stock is less than the bond&#x27;s conversion price, the bond will trade at a discount to its conversion value.<\/p><p><b>Comment 2:<\/b> Once the bond becomes callable, the bond should not trade at more than a slight premium to its call price.<\/p><p><b>Comment 3:<\/b> When the bond is considered a busted convertible, its minimum value is the value of an otherwise equivalent nonconvertible bond.<\/p><p>Assume all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and Exhibit 2, the arbitrage-free value of Bond 2 is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss1/q022.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":23,"q":"Base
