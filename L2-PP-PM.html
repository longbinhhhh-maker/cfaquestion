<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>
<body>
<header>

  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>

<script>
const DATA = [{"n":1,"q":"Which of the following statements about the use of benchmarks in measuring the value added by active portfolio management is most accurate?","opts":["Benchmark weights should be verifiable ex ante, and return data should be timely ex post","Securities in the active portfolio should always be a subset of the securities in the benchmark portfolio","Non-float-adjusted indexes are better than float-adjusted indexes for use as benchmarks, as the total value of the securities is considered"],"ans":"A","expl":"A is Correct because a benchmark or passive portfolio should have a number of qualities to serve as a relevant comparison for active management, one of which is that benchmark weights are verifiable ex ante, and return data are timely ex post.","explhtml":"<p>A is Correct because a benchmark or passive portfolio should have a number of qualities to serve as a relevant comparison for active management, one of which is that benchmark weights are verifiable ex ante, and return data are timely ex post.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Active Portfolio Management<\/div><div class=\"qtext\"><p>Which of the following statements about the use of benchmarks in measuring the value added by active portfolio management is most accurate?<\/p><\/div>","subj":"portfolio"},{"n":2,"q":"An investor gathers the following information about their portfolio: The portfolio has generated positive alpha over the benchmark from:","opts":["asset allocation decisions only.","security selection decisions only.","both asset allocation decisions and security selection decisions."],"ans":"A","expl":"A is Correct because, using a performance attribution system for just two asset classes, stocks and bonds, gives RA = (ΔwstocksRB,stocks + ΔwbondsRB,bonds) + (wP,stocksRA,stocks + wP,bondsRA,bonds), where R = return, w = weight, P = portfolio, B = benchmark, hence RA = RP – RB = alpha. The first (parenthetical) term is the value added from the asset allocation decision. The second term is the value added from security selection within the stock and bond portfolios. Hence, asset allocation alpha = [(80% – 60%) × 13.0%] + [(20% – 40%) × 4.0%] = 1.8% and security selection alpha = [80% × (11.0% – 13.0%)] + [20% × (5.0% – 4.0%)] = –1.4%. Therefore, positive alpha has only been generated from asset allocation decisions.","explhtml":"<p>A is Correct because, using a performance attribution system for just two asset classes, stocks and bonds, gives RA = (ΔwstocksRB,stocks + ΔwbondsRB,bonds) + (wP,stocksRA,stocks + wP,bondsRA,bonds), where R = return, w = weight, P = portfolio, B = benchmark, hence RA = RP – RB = alpha. The first (parenthetical) term is the value added from the asset allocation decision. The second term is the value added from security selection within the stock and bond portfolios. Hence, asset allocation alpha = [(80% – 60%) × 13.0%] + [(20% – 40%) × 4.0%] = 1.8% and security selection alpha = [80% × (11.0% – 13.0%)] + [20% × (5.0% – 4.0%)] = –1.4%. Therefore, positive alpha has only been generated from asset allocation decisions.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Active Portfolio Management<\/div><div class=\"qtext\"><p>An investor gathers the following information about their portfolio:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp210.webp\" style=\"max-width:min(100%,563px)\" alt=\"\"><p>The portfolio has generated positive alpha over the benchmark from:<\/p><\/div>","subj":"portfolio"},{"n":3,"q":"The information ratio of a portfolio of risky assets will remain unchanged when:","opts":["cash is added to the portfolio.","the use of leverage in the portfolio changes.","each active weight in the portfolio is multiplied by the same constant."],"ans":"C","expl":"C is Correct because, if each active weight is multiplied by some constant, c, then the active return on the altered portfolio, RC, is cRA. Similarly, the active risk of the altered portfolio is cσA, so the information ratio of the altered portfolio is IRC = cRA/cσA = RA/σA = IR, the same as that of the actively managed portfolio with no proportional increase in the active weights.","explhtml":"<p>C is Correct because, if each active weight is multiplied by some constant, c, then the active return on the altered portfolio, RC, is cRA. Similarly, the active risk of the altered portfolio is cσA, so the information ratio of the altered portfolio is IRC = cRA/cσA = RA/σA = IR, the same as that of the actively managed portfolio with no proportional increase in the active weights.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Active Portfolio Management<\/div><div class=\"qtext\"><p>The information ratio of a portfolio of risky assets will remain unchanged when:<\/p><\/div>","subj":"portfolio"},{"n":4,"q":"An actively managed fund has a Sharpe ratio of 2.5. If the Sharpe ratio of the benchmark is 1.5, the fund's information ratio is closest to:","opts":["1.0.","2.0.","2.9."],"ans":"B","expl":"B is Correct because the squared Sharpe ratio of an actively managed portfolio (P) is equal to the squared Sharpe ratio of the benchmark (B) plus the information ratio squared: SRP2 = SRB2 + IR2. Substituting, (2.5)2 = (1.5)2 + IR2 IR = [(2.5)2 – (1.5)2]1/2 = 2.0.","explhtml":"<p>B is Correct because the squared Sharpe ratio of an actively managed portfolio (P) is equal to the squared Sharpe ratio of the benchmark (B) plus the information ratio squared: SRP2 = SRB2 + IR2. Substituting, (2.5)2 = (1.5)2 + IR2 IR = [(2.5)2 – (1.5)2]1/2 = 2.0.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Active Portfolio Management<\/div><div class=\"qtext\"><p>An actively managed fund has a Sharpe ratio of 2.5. If the Sharpe ratio of the benchmark is 1.5, the fund&#x27;s information ratio is closest to:<\/p><\/div>","subj":"portfolio"},{"n":5,"q":"According to the fundamental law of active management, if breadth increased by a factor of four and active portfolio risk decreased by a factor of four, all else being equal, the expected active return would:","opts":["halve.","remain unchanged.","double."],"ans":"A","expl":"A is Correct because the expected active return E(RA) = (TC)(IC)(√BR)σA, where TC = transfer coefficient, IC = information coefficient, BR = breadth, and σA = active portfolio risk. Since E(RA) is proportional to √BR, if BR increases by a factor of 4, then E(RA) increases by a factor of 2. Also, E(RA) is proportional to σA, so if σAdecreases by a factor of 4, then E(RA) decreases by a factor of 4 as well. Combining both effects, if BR increases by a factor of 4 and σA decreases by a factor of 4, then E(RA) increases by a factor of 2/4 = 1/2, i.e. E(RA) halves.","explhtml":"<p>A is Correct because the expected active return E(RA) = (TC)(IC)(√BR)σA, where TC = transfer coefficient, IC = information coefficient, BR = breadth, and σA = active portfolio risk. Since E(RA) is proportional to √BR, if BR increases by a factor of 4, then E(RA) increases by a factor of 2. Also, E(RA) is proportional to σA, so if σAdecreases by a factor of 4, then E(RA) decreases by a factor of 4 as well. Combining both effects, if BR increases by a factor of 4 and σA decreases by a factor of 4, then E(RA) increases by a factor of 2/4 = 1/2, i.e. E(RA) halves.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Active Portfolio Management<\/div><div class=\"qtext\"><p>According to the fundamental law of active management, if breadth increased by a factor of four and active portfolio risk decreased by a factor of four, all else being equal, the expected active return would:<\/p><\/div>","subj":"portfolio"},{"n":6,"q":"In active portfolio management, the transfer coefficient is the correlation between:","opts":["realized active returns and active weights.","forecasted active returns and active weights.","forecasted active returns and realized active returns."],"ans":"B","expl":"B is Correct because the correlation between any set of active weights, Δwi, and forecasted active returns, µi, measures the degree to which the investor’s forecasts are translated into active weights, called the transfer coefficient (TC).","explhtml":"<p>B is Correct because the correlation between any set of active weights, Δwi, and forecasted active returns, µi, measures the degree to which the investor’s forecasts are translated into active weights, called the transfer coefficient (TC).<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Active Portfolio Management<\/div><div class=\"qtext\"><p>In active portfolio management, the transfer coefficient is the correlation between:<\/p><\/div>","subj":"portfolio"},{"n":7,"q":"An actively managed strategy uses individual stock selection with a benchmark composed of 16 securities. The skill of the investor is represented by an information coefficient of 0.12 and the portfolio's active risk target is 5.0% per year. If the strategy's breadth is equal to the number of benchmark securities and the investor's forecasts can be implemented without constraints, the expected active return for this strategy is closest to:","opts":["2.4%.","6.9%.","9.6%."],"ans":"A","expl":"A is Correct because the information ratio of the unconstrained strategy is given by IR = (IC)(√BR) and expected active return is calculated as E(RA) = (IR)σA = (IC)(√BR)σA = (0.12)(√16)(5.0%) = 2.4%.","explhtml":"<p>A is Correct because the information ratio of the unconstrained strategy is given by IR = (IC)(√BR) and expected active return is calculated as E(RA) = (IR)σA = (IC)(√BR)σA = (0.12)(√16)(5.0%) = 2.4%.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Active Portfolio Management<\/div><div class=\"qtext\"><p>An actively managed strategy uses individual stock selection with a benchmark composed of 16 securities. The skill of the investor is represented by an information coefficient of 0.12 and the portfolio&#x27;s active risk target is 5.0% per year. If the strategy&#x27;s breadth is equal to the number of benchmark securities and the investor&#x27;s forecasts can be implemented without constraints, the expected active return for this strategy is closest to:<\/p><\/div>","subj":"portfolio"},{"n":8,"q":"If a portfolio has positive expected active returns, the ex-ante information ratio will most likely increase with an increase in the:","opts":["breadth of the portfolio.","active risk of the portfolio.","number of binding constraints on the portfolio."],"ans":"A","expl":"A is Correct because a portfolio's information ratio, E(RA)/σA, can be expressed as the product of just three terms: IR = (TC)(IC)√BR, where IR = information ratio, TC = transfer coefficient, IC = information coefficient, and BR = breadth of the portfolio. Hence, if the breadth of the portfolio increases, the information ratio will increase.","explhtml":"<p>A is Correct because a portfolio&#x27;s information ratio, E(RA)/σA, can be expressed as the product of just three terms: IR = (TC)(IC)√BR, where IR = information ratio, TC = transfer coefficient, IC = information coefficient, and BR = breadth of the portfolio. Hence, if the breadth of the portfolio increases, the information ratio will increase.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Active Portfolio Management<\/div><div class=\"qtext\"><p>If a portfolio has positive expected active returns, the ex-ante information ratio will most likely increase with an increase in the:<\/p><\/div>","subj":"portfolio"},{"n":9,"q":"An analyst gathers the following information about two portfolios: The expected active return of Portfolio 1 is:","opts":["less than the expected active return of Portfolio 2.","equal to the expected active return of Portfolio 2.","greater than the expected active return of Portfolio 2."],"ans":"A","expl":"A is Correct because the expected active return for each portfolio is calculated as follows: Therefore, Portfolio 1 has a lower expected active return than Portfolio 2.","explhtml":"<p>A is Correct because the expected active return for each portfolio is calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp229.webp\" style=\"max-width:min(100%,721px)\" alt=\"\"><p>Therefore, Portfolio 1 has a lower expected active return than Portfolio 2.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Active Portfolio Management<\/div><div class=\"qtext\"><p>An analyst gathers the following information about two portfolios:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp211.webp\" style=\"max-width:min(100%,552px)\" alt=\"\"><p>The expected active return of Portfolio 1 is:<\/p><\/div>","subj":"portfolio"},{"n":10,"q":"A fund's CIO makes the following changes to the fund's investment strategy: In aggregate, the changes will:","opts":["reduce the expected active return of the fund.","have no impact on the expected active return of the fund.","ncrease the expected active return of the fund."],"ans":"A","expl":"A is Correct because the expanded fundamental law of active management is expressed in the following equation: E(RA) = (TC)(IC)√BR × σA, where E(RA) = expected active return, TC = transfer coefficient, IC = information coefficient, BR = breadth, and σA = active risk. Therefore, the expected active return of the old strategy = 0.3 × 0.5 × (√1,000) × 2.0% = 9.5%, and the expected active return of the new strategy = 0.2 × 0.4 × (√1,500) × 2.5% = 7.7%. Hence, the changes will reduce the expected active return from 9.5% to 7.7%.","explhtml":"<p>A is Correct because the expanded fundamental law of active management is expressed in the following equation: E(RA) = (TC)(IC)√BR × σA, where E(RA) = expected active return, TC = transfer coefficient, IC = information coefficient, BR = breadth, and σA = active risk. Therefore, the expected active return of the old strategy = 0.3 × 0.5 × (√1,000) × 2.0% = 9.5%, and the expected active return of the new strategy = 0.2 × 0.4 × (√1,500) × 2.5% = 7.7%. Hence, the changes will reduce the expected active return from 9.5% to 7.7%.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Active Portfolio Management<\/div><div class=\"qtext\"><p>A fund&#x27;s CIO makes the following changes to the fund&#x27;s investment strategy:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp212.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>In aggregate, the changes will:<\/p><\/div>","subj":"portfolio"},{"n":11,"q":"Breadth can be greater than the number of securities when:","opts":["derivatives are used for hedging in the portfolio.","return forecasts from period to period are correlated.","a decision is made to overweight all stocks in a given industry."],"ans":"A","expl":"A is Correct because, when fundamental law concepts are applied to hedging strategies using derivatives or other forms of arbitrage, breadth can increase well beyond the number of securities.","explhtml":"<p>A is Correct because, when fundamental law concepts are applied to hedging strategies using derivatives or other forms of arbitrage, breadth can increase well beyond the number of securities.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Active Portfolio Management<\/div><div class=\"qtext\"><p>Breadth can be greater than the number of securities when:<\/p><\/div>","subj":"portfolio"},{"n":12,"q":"The breadth of an investment strategy can be significantly higher than the number of individual assets for:","opts":["an arbitrage portfolio where derivatives are used.","a long-only stock portfolio with no systematic risk.","a long-only bond portfolio consisting of US Treasuries."],"ans":"A","expl":"A is Correct because, when fundamental law concepts are applied to hedging strategies using derivatives or other forms of arbitrage, breadth can increase well beyond the number of securities. For example, arbitrage of just two securities—say, a country equity market ETF traded on two different exchanges—can have extremely high breadth. A practical measure of breath is BR = N/[1 + (N – 1)ρ], where BR = breadth, N = number of securities, and ρ = the same correlation coefficient in all the off-diagonal elements of the risk model. For just two securities, N = 2, and a correlation coefficient associated with near-arbitrage opportunities, ρ = −0.8, breadth could be BR = 2/[1 − (2 − 1)0.8] = 10.0. Negative correlation between the individual assets of a portfolio, which is a vey unlikely scenario for a long-only portfolio of bonds/stocks, can lead to a very high breadth.","explhtml":"<p>A is Correct because, when fundamental law concepts are applied to hedging strategies using derivatives or other forms of arbitrage, breadth can increase well beyond the number of securities. For example, arbitrage of just two securities—say, a country equity market ETF traded on two different exchanges—can have extremely high breadth. A practical measure of breath is BR = N/[1 + (N – 1)ρ], where BR = breadth, N = number of securities, and ρ = the same correlation coefficient in all the off-diagonal elements of the risk model. For just two securities, N = 2, and a correlation coefficient associated with near-arbitrage opportunities, ρ = −0.8, breadth could be BR = 2/[1 − (2 − 1)0.8] = 10.0. Negative correlation between the individual assets of a portfolio, which is a vey unlikely scenario for a long-only portfolio of bonds/stocks, can lead to a very high breadth.<\/p>","qhtml":"<div class=\"pp-topic\">Analysis of Active Portfolio Management<\/div><div class=\"qtext\"><p>The breadth of an investment strategy can be significantly higher than the number of individual assets for:<\/p><\/div>","subj":"portfolio"},{"n":13,"q":"With respect to the arbitrage pricing theory, an arbitrage opportunity exists if a trader can earn a positive net profit with:","opts":["no risk and no net investment.","some risk and no net investment.","no risk and a positive net investment."],"ans":"A","expl":"A is Correct because, in the arbitrage pricing theory, an arbitrage opportunity exists when an investor or trader can earn an expected positive net profit without risk and with no net investment of money.","explhtml":"<p>A is Correct because, in the arbitrage pricing theory, an arbitrage opportunity exists when an investor or trader can earn an expected positive net profit without risk and with no net investment of money.<\/p>","qhtml":"<div class=\"pp-topic\">Using Multifactor Models<\/div><div class=\"qtext\"><p>With respect to the arbitrage pricing theory, an arbitrage opportunity exists if a trader can earn a positive net profit with:<\/p><\/div>","subj":"portfolio"},{"n":14,"q":"The arbitrage pricing theory:","opts":["assumes that a single-factor model describes asset returns.","assumes that well-diversified portfolios provide arbitrage opportunities.","does not prescribe the identity of risk factors related to generating returns."],"ans":"C","expl":"C is Correct because, unlike the CAPM, the APT does not indicate the identity or even the number of risk factors. Rather, for any multifactor model assumed to generate returns ('return-generating process'), the theory gives the associated expression for the asset's expected return.","explhtml":"<p>C is Correct because, unlike the CAPM, the APT does not indicate the identity or even the number of risk factors. Rather, for any multifactor model assumed to generate returns (&#x27;return-generating process&#x27;), the theory gives the associated expression for the asset&#x27;s expected return.<\/p>","qhtml":"<div class=\"pp-topic\">Using Multifactor Models<\/div><div class=\"qtext\"><p>The arbitrage pricing theory:<\/p><\/div>","subj":"portfolio"},{"n":15,"q":"An analyst gathers the following information on the expected return of three well-diversified portfolios and their sensitivity to a single factor: Based on a one-factor arbitrage pricing theory model, an arbitrage opportunity can be exploited by:","opts":["buying $400 of Portfolio X and $600 of Portfolio Y, and selling short $1,000 of Portfolio Z.","buying $500 of Portfolio X and $500 of Portfolio Y, and selling short $1,000 of Portfolio Z.","selling short $400 of Portfolio X and $600 of Portfolio Y, and buying $1,000 of Portfolio Z."],"ans":"A","expl":"A is Correct because the expected return and factor sensitivities of a portfolio with a 40% (= $400/$1,000) weight in Portfolio X and a 60% (= $600/$1,000) weight in Portfolio Y are: Expected return = (0.4)(5%) + (0.6)(7%) = 6.2%, Factor sensitivity = (0.4)(0.7) + (0.6)(1.7) = 1.3. The factor sensitivity of this portfolio is the same as the factor sensitivity of Portfolio Z. There is an arbitrage opportunity as the expected return of Portfolio Z is lower than this portfolio's expected return. So, we would sell short $1,000 of Portfolio Z and use the proceeds to buy $400 of Portfolio X and $600 of Portfolio Y.","explhtml":"<p>A is Correct because the expected return and factor sensitivities of a portfolio with a 40% (= $400/$1,000) weight in Portfolio X and a 60% (= $600/$1,000) weight in Portfolio Y are: Expected return = (0.4)(5%) + (0.6)(7%) = 6.2%, Factor sensitivity = (0.4)(0.7) + (0.6)(1.7) = 1.3. The factor sensitivity of this portfolio is the same as the factor sensitivity of Portfolio Z. There is an arbitrage opportunity as the expected return of Portfolio Z is lower than this portfolio&#x27;s expected return. So, we would sell short $1,000 of Portfolio Z and use the proceeds to buy $400 of Portfolio X and $600 of Portfolio Y.<\/p>","qhtml":"<div class=\"pp-topic\">Using Multifactor Models<\/div><div class=\"qtext\"><p>An analyst gathers the following information on the expected return of three well-diversified portfolios and their sensitivity to a single factor:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp213.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>Based on a one-factor arbitrage pricing theory model, an arbitrage opportunity can be exploited by:<\/p><\/div>","subj":"portfolio"},{"n":16,"q":"An analyst gathers the following information about three portfolios: If Portfolio 1 and Portfolio 2 are priced correctly according to a one-factor arbitrage pricing theory model, it can be concluded that Portfolio 3 is:","opts":["undervalued relative to its factor risk.","correctly valued relative to its factor risk.","overvalued relative to its factor risk."],"ans":"A","expl":"A is Correct because, using the one-factor arbitrage pricing theory model E(R) = RF + λβ (where RF is the risk-free rate and β is the factor sensitivity), the values of the expected return and factor sensitivity of Portfolio 1 and Portfolio 2 can be used to derive RF and λ. Specifically, if both portfolios are correctly priced, the following equations must be satisfied: For Portfolio 1: 0.08 = RF +λ(0.6) ... Eq. (1) For Portfolio 2: 0.15 = RF + λ(1.3) ... Eq. (2) Taking Eq. (2) – Eq. (1) gives: 0.07 = 0.7λ, hence λ = 0.1. Substituting this into Eq. (1) yields: 0.08 = RF + 0.1(0.6), hence RF = 0.02. Thus, the one-factor APT model is E(R) = 0.02 + 0.1β. For Portfolio 3, β = 0.8, so E(R) = 0.02 + 0.1(0.8) = 0.02 + 0.08 = 0.10. This is less than the stated expected return of 0.12, hence Portfolio 3 is undervalued relative to its factor risk.","explhtml":"<p>A is Correct because, using the one-factor arbitrage pricing theory model E(R) = RF + λβ (where RF is the risk-free rate and β is the factor sensitivity), the values of the expected return and factor sensitivity of Portfolio 1 and Portfolio 2 can be used to derive RF and λ. Specifically, if both portfolios are correctly priced, the following equations must be satisfied: For Portfolio 1: 0.08 = RF +λ(0.6) ... Eq. (1) For Portfolio 2: 0.15 = RF + λ(1.3) ... Eq. (2) Taking Eq. (2) – Eq. (1) gives: 0.07 = 0.7λ, hence λ = 0.1. Substituting this into Eq. (1) yields: 0.08 = RF + 0.1(0.6), hence RF = 0.02. Thus, the one-factor APT model is E(R) = 0.02 + 0.1β. For Portfolio 3, β = 0.8, so E(R) = 0.02 + 0.1(0.8) = 0.02 + 0.08 = 0.10. This is less than the stated expected return of 0.12, hence Portfolio 3 is undervalued relative to its factor risk.<\/p>","qhtml":"<div class=\"pp-topic\">Using Multifactor Models<\/div><div class=\"qtext\"><p>An analyst gathers the following information about three portfolios:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp214.webp\" style=\"max-width:min(100%,556px)\" alt=\"\"><p>If Portfolio 1 and Portfolio 2 are priced correctly according to a one-factor arbitrage pricing theory model, it can be concluded that Portfolio 3 is:<\/p><\/div>","subj":"portfolio"},{"n":17,"q":"An analyst gathers the following information about two well-diversified portfolios in an economy satisfying a one-factor arbitrage pricing theory model: The expected returns reflect a 1-year investment horizon and all investors agree on the expected returns of these portfolios. The return on the risk-free asset is closest to:","opts":["3.0%.","4.0%.","5.0%."],"ans":"B","expl":"B is Correct because, using the single-factor arbitrage pricing theory equation, E(Rp) = RF + λ1βp,1, and given the factor sensitivities and expected returns for portfolios X and Y, the parameters RF and λ1 can be calculated using: E(Rx) = 8.0% = RF + 0.8λ1, and E(Ry) = 16.0% = RF + 2.4λ1. From the equation for Portfolio X, we have RF = 8.0% − 0.8λ1. Substituting this expression for the risk-free rate into the equation for Portfolio Y, we have: 16.0% = 8.0% − 0.8λ1 + 2.4λ1 = 8.0% + 1.6λ1. So, λ1 = (16.0% − 8.0%)/1.6 = 5.0%. Substituting this value for λ1 back into the equation for Portfolio X gives us: 8.0% = RF + 5.0% × 0.8. So, RF = 8.0% − 5.0% × 0.8 = 4.0%.","explhtml":"<p>B is Correct because, using the single-factor arbitrage pricing theory equation, E(Rp) = RF + λ1βp,1, and given the factor sensitivities and expected returns for portfolios X and Y, the parameters RF and λ1 can be calculated using: E(Rx) = 8.0% = RF + 0.8λ1, and E(Ry) = 16.0% = RF + 2.4λ1. From the equation for Portfolio X, we have RF = 8.0% − 0.8λ1. Substituting this expression for the risk-free rate into the equation for Portfolio Y, we have: 16.0% = 8.0% − 0.8λ1 + 2.4λ1 = 8.0% + 1.6λ1. So, λ1 = (16.0% − 8.0%)/1.6 = 5.0%. Substituting this value for λ1 back into the equation for Portfolio X gives us: 8.0% = RF + 5.0% × 0.8. So, RF = 8.0% − 5.0% × 0.8 = 4.0%.<\/p>","qhtml":"<div class=\"pp-topic\">Using Multifactor Models<\/div><div class=\"qtext\"><p>An analyst gathers the following information about two well-diversified portfolios in an economy satisfying a one-factor arbitrage pricing theory model:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp215.webp\" style=\"max-width:min(100%,550px)\" alt=\"\"><p>The expected returns reflect a 1-year investment horizon and all investors agree on the expected returns of these portfolios. The return on the risk-free asset is closest to:<\/p><\/div>","subj":"portfolio"},{"n":18,"q":"The returns of stocks X and Y are given by a macroeconomic factor model and expressed as follows: RX = 0.08 – 0.05F1 + 0.03F2 + εX RY = 0.16 + 0.02F1 + 0.04F2 + εY, where F1 and F2 reflect surprises in two macroeconomic factors. If a portfolio has one quarter of its investment in Stock X and the rest in Stock Y, the portfolio's expected return is closest to:","opts":["12%.","14%.","18%."],"ans":"B","expl":"B is Correct because the expected return of an asset in a macroeconomic factor model is given by the intercept term. Hence, the expected return of the portfolio is computed as the weighted average of the intercepts in the expressions for RX andRY, i.e. (1/4)(0.08) + (3/4)(0.16) = 0.14 = 14%.","explhtml":"<p>B is Correct because the expected return of an asset in a macroeconomic factor model is given by the intercept term. Hence, the expected return of the portfolio is computed as the weighted average of the intercepts in the expressions for RX andRY, i.e. (1/4)(0.08) + (3/4)(0.16) = 0.14 = 14%.<\/p>","qhtml":"<div class=\"pp-topic\">Using Multifactor Models<\/div><div class=\"qtext\"><p>The returns of stocks X and Y are given by a macroeconomic factor model and expressed as follows: RX = 0.08 – 0.05F1 + 0.03F2 + εX RY = 0.16 + 0.02F1 + 0.04F2 + εY, where F1 and F2 reflect surprises in two macroeconomic factors. If a portfolio has one quarter of its investment in Stock X and the rest in Stock Y, the portfolio&#x27;s expected return is closest to:<\/p><\/div>","subj":"portfolio"},{"n":19,"q":"Which of the following statements about fundamental factor models is most accurate?","opts":["The factors are stated as returns rather than return surprises in relation to predicted values","The factor (surprise) series is developed first and then the factor sensitivities are estimated using regressions","They can be easily applied to various asset classes, including fixed income, as no asset-class-specific tuning is required"],"ans":"A","expl":"A is Correct because, in fundamental factor models, the factors are stated as returns rather than return surprises in relation to predicted values, so they do not generally have expected values of zero. This approach changes the meaning of the intercept, which is no longer interpreted as the expected return.","explhtml":"<p>A is Correct because, in fundamental factor models, the factors are stated as returns rather than return surprises in relation to predicted values, so they do not generally have expected values of zero. This approach changes the meaning of the intercept, which is no longer interpreted as the expected return.<\/p>","qhtml":"<div class=\"pp-topic\">Using Multifactor Models<\/div><div class=\"qtext\"><p>Which of the following statements about fundamental factor models is most accurate?<\/p><\/div>","subj":"portfolio"},{"n":20,"q":"Which of the following statements about factor models is most accurate?","opts":["In a statistical factor model, the factors are defined by portfolio weights","In a macroeconomic factor model, the factors are consensus forecasts of macroeconomic variables","In a fundamental factor model, the factors are company-specific and do not include macroeconomic factors"],"ans":"A","expl":"A is Correct because, in statistical factor models, the factors are actually portfolios of the securities in the group under study and are therefore defined by portfolio weights.","explhtml":"<p>A is Correct because, in statistical factor models, the factors are actually portfolios of the securities in the group under study and are therefore defined by portfolio weights.<\/p>","qhtml":"<div class=\"pp-topic\">Using Multifactor Models<\/div><div class=\"qtext\"><p>Which of the following statements about factor models is most accurate?<\/p><\/div>","subj":"portfolio"},{"n":21,"q":"An analyst gathers the following information on three well-diversified funds, where the returns and tracking errors are based on a five-factor macroeconomic model: The fund with the most favorable information ratio is:","opts":["Fund X.","Fund Y.","Fund Z."],"ans":"A","expl":"A is Correct because Fund X's information ratio (IR) is computed as the active return divided by the tracking error, where the active return is the difference between the return of the fund and the return of its benchmark. Thus, IR = [– 1.5% – (–4.5%)]/1.2% = 2.50. This fund's IR is the highest among the three funds' IRs.","explhtml":"<p>A is Correct because Fund X&#x27;s information ratio (IR) is computed as the active return divided by the tracking error, where the active return is the difference between the return of the fund and the return of its benchmark. Thus, IR = [– 1.5% – (–4.5%)]/1.2% = 2.50. This fund&#x27;s IR is the highest among the three funds&#x27; IRs.<\/p>","qhtml":"<div class=\"pp-topic\">Using Multifactor Models<\/div><div class=\"qtext\"><p>An analyst gathers the following information on three well-diversified funds, where the returns and tracking errors are based on a five-factor macroeconomic model:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp216.webp\" style=\"max-width:min(100%,566px)\" alt=\"\"><p>The fund with the most favorable information ratio is:<\/p><\/div>","subj":"portfolio"},{"n":22,"q":"With respect to risk attribution in active portfolio management, tracking error is defined as the:","opts":["standard deviation of the differences between a portfolio's return and its benchmark return.","quare of the standard deviation of the differences between a portfolio's return and its benchmark return.","difference between the standard deviation of a portfolio's return and the standard deviation of its benchmark return."],"ans":"A","expl":"A is Correct because we will use the abbreviation TE for the concept of active risk and refer to it usually as tracking error: TE = s(RP – RB), which indicates that we take the sample standard deviation (indicated by s) of the time series of differences between the portfolio return, RP, and the benchmark return, RB.","explhtml":"<p>A is Correct because we will use the abbreviation TE for the concept of active risk and refer to it usually as tracking error: TE = s(RP – RB), which indicates that we take the sample standard deviation (indicated by s) of the time series of differences between the portfolio return, RP, and the benchmark return, RB.<\/p>","qhtml":"<div class=\"pp-topic\">Using Multifactor Models<\/div><div class=\"qtext\"><p>With respect to risk attribution in active portfolio management, tracking error is defined as the:<\/p><\/div>","subj":"portfolio"},{"n":23,"q":"A portfolio manager gathers the following information about three well-diversified portfolios and their sensitivities to four factors using a macroeconomic factor model: The portfolio best suited to hedge an existing short exposure to Factor 3 is:","opts":["Portfolio X.","Portfolio Y.","Portfolio Z."],"ans":"C","expl":"C is Correct because Portfolio Z is a factor portfolio with exposure to only one risk factor and exactly represents the risk of that factor. As a pure bet on a source of risk, factor portfolios are of interest to a portfolio manager who wants to hedge that risk (offset it) or speculate on it. So, Portfolio Z is best suited to hedge an existing short exposure to Factor 3.","explhtml":"<p>C is Correct because Portfolio Z is a factor portfolio with exposure to only one risk factor and exactly represents the risk of that factor. As a pure bet on a source of risk, factor portfolios are of interest to a portfolio manager who wants to hedge that risk (offset it) or speculate on it. So, Portfolio Z is best suited to hedge an existing short exposure to Factor 3.<\/p>","qhtml":"<div class=\"pp-topic\">Using Multifactor Models<\/div><div class=\"qtext\"><p>A portfolio manager gathers the following information about three well-diversified portfolios and their sensitivities to four factors using a macroeconomic factor model:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp217.webp\" style=\"max-width:min(100%,563px)\" alt=\"\"><p>The portfolio best suited to hedge an existing short exposure to Factor 3 is:<\/p><\/div>","subj":"portfolio"},{"n":24,"q":"Which of the following statements about the use of multifactor models is most accurate?","opts":["In multifactor models, all investors should optimally invest in two funds: the market portfolio and a risk-free asset","A multifactor approach cannot help investors achieve better-diversified or more-efficient portfolios compared to a single-factor model","Multifactor models can help investors make strategic decisions based on the types of risk they have a comparative advantage in bearing"],"ans":"C","expl":"C is Correct because multifactor models can help investors recognize considerations that are relevant in making various strategic decisions. For example, given a sound model of the systematic risk factors that affect assets’ mean returns, the investor can ask, relative to other investors, ■ What types of risk do I have a comparative advantage in bearing? ■ What types of risk am I at a comparative disadvantage in bearing?","explhtml":"<p>C is Correct because multifactor models can help investors recognize considerations that are relevant in making various strategic decisions. For example, given a sound model of the systematic risk factors that affect assets’ mean returns, the investor can ask, relative to other investors,<\/p><p>■ What types of risk do I have a comparative advantage in bearing?<\/p><p>■ What types of risk am I at a comparative disadvantage in bearing?<\/p>","qhtml":"<div class=\"pp-topic\">Using Multifactor Models<\/div><div class=\"qtext\"><p>Which of the following statements about the use of multifactor models is most accurate?<\/p><\/div>","subj":"portfolio"},{"n":25,"q":"Which of the following investors would least likely have a comparative advantage in bearing business cycle risk in their equity investments?","opts":["An endowment fund","A high-net-worth individual","An individual who depends on income from self-employment"],"ans":"C","expl":"C is Correct because an individual investor who depends on income from salary or self-employment is sensitive to business cycle risk, in particular to the effects of recessions. So, such an individual would be least likely to have a comparative advantage in bearing business cycle risk.","explhtml":"<p>C is Correct because an individual investor who depends on income from salary or self-employment is sensitive to business cycle risk, in particular to the effects of recessions. So, such an individual would be least likely to have a comparative advantage in bearing business cycle risk.<\/p>","qhtml":"<div class=\"pp-topic\">Using Multifactor Models<\/div><div class=\"qtext\"><p>Which of the following investors would least likely have a comparative advantage in bearing business cycle risk in their equity investments?<\/p><\/div>","subj":"portfolio"},{"n":26,"q":"Which of the following statements about multifactor models is most accurate?","opts":["Multifactor models allow a portfolio manager to make focused bets","A pure factor portfolio would have a sensitivity of 1 for a given factor and a sensitivity of –1 for all other factors","The ability of multifactor models to model risk in greater detail is useful in active management but not in passive management"],"ans":"A","expl":"A is Correct because multifactor models permit the portfolio manager to make focused bets or to control portfolio risk relative to the benchmark’s risk.","explhtml":"<p>A is Correct because multifactor models permit the portfolio manager to make focused bets or to control portfolio risk relative to the benchmark’s risk.<\/p>","qhtml":"<div class=\"pp-topic\">Using Multifactor Models<\/div><div class=\"qtext\"><p>Which of the following statements about multifactor models is most accurate?<\/p><\/div>","subj":"portfolio"},{"n":27,"q":"All else being equal, which of the following will most likely result in a rise of a company's stock price?","opts":["A fall in the stock's risk premium only","A rise in the expected inflation rate only","Both a fall in the stock's risk premium and a rise in the expected inflation rate"],"ans":"A","expl":"A is Correct because the stock's risk premium represents the additional return that investors expect for investing in financial assets because of uncertainty about the asset's future cash flows. Hence, a fall in the stock's risk premium will result in a rise of the stock price.","explhtml":"<p>A is Correct because the stock&#x27;s risk premium represents the additional return that investors expect for investing in financial assets because of uncertainty about the asset&#x27;s future cash flows. Hence, a fall in the stock&#x27;s risk premium will result in a rise of the stock price.<\/p>","qhtml":"<div class=\"pp-topic\">Economics and Investment Markets<\/div><div class=\"qtext\"><p>All else being equal, which of the following will most likely result in a rise of a company&#x27;s stock price?<\/p><\/div>","subj":"portfolio"},{"n":28,"q":"All else being equal, an increase in expected inflation will most likely decrease:","opts":["asset values.","discount rates.","risk premiums."],"ans":"A","expl":"A is Correct because a component of the discount rate applied to future cash flows of the asset represents the compensation that investors demand for the inflation that they expect to experience over the investment horizon. Higher inflation expectations lead to higher discount rates and hence lower asset values.","explhtml":"<p>A is Correct because a component of the discount rate applied to future cash flows of the asset represents the compensation that investors demand for the inflation that they expect to experience over the investment horizon. Higher inflation expectations lead to higher discount rates and hence lower asset values.<\/p>","qhtml":"<div class=\"pp-topic\">Economics and Investment Markets<\/div><div class=\"qtext\"><p>All else being equal, an increase in expected inflation will most likely decrease:<\/p><\/div>","subj":"portfolio"},{"n":29,"q":"Which of the following situations would most likely cause a significant change in a company's stock price?","opts":["Investor sentiment changes from enthusiasm to despair","The central bank raises interest rates in line with expectations","The company confirms widely anticipated information about its new project"],"ans":"A","expl":"A is Correct because investor sentiment (e.g., enthusiasm or despair) can also affect asset values through direct effects on discount rates via higher or lower risk premiums (and possibly indirect effects on future cash flows).","explhtml":"<p>A is Correct because investor sentiment (e.g., enthusiasm or despair) can also affect asset values through direct effects on discount rates via higher or lower risk premiums (and possibly indirect effects on future cash flows).<\/p>","qhtml":"<div class=\"pp-topic\">Economics and Investment Markets<\/div><div class=\"qtext\"><p>Which of the following situations would most likely cause a significant change in a company&#x27;s stock price?<\/p><\/div>","subj":"portfolio"},{"n":30,"q":"An analyst gathers the following economic data about three countries: Based on this information, which country most likely has the highest real short- term interest rates?","opts":["Country X","Country Y","Country Z"],"ans":"C","expl":"C is Correct because, when the GDP growth rate is uncertain, the short-term default-free interest rates will still be positively related to the expected growth rate of GDP, but additionally they will be positively related to the expected volatility of GDP growth. Country Z has the highest expected GDP growth rate and also the highest expected volatility of the GDP growth rate and, hence, it is likely to have the highest real short-term interest rates.","explhtml":"<p>C is Correct because, when the GDP growth rate is uncertain, the short-term default-free interest rates will still be positively related to the expected growth rate of GDP, but additionally they will be positively related to the expected volatility of GDP growth. Country Z has the highest expected GDP growth rate and also the highest expected volatility of the GDP growth rate and, hence, it is likely to have the highest real short-term interest rates.<\/p>","qhtml":"<div class=\"pp-topic\">Economics and Investment Markets<\/div><div class=\"qtext\"><p>An analyst gathers the following economic data about three countries:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp218.webp\" style=\"max-width:min(100%,636px)\" alt=\"\"><p>Based on this information, which country most likely has the highest real short- term interest rates?<\/p><\/div>","subj":"portfolio"},{"n":31,"q":"The real default-free interest rate in an economy is most likely positively related to:","opts":["the expected growth rate of GDP only.","the expected volatility of GDP growth only.","both the expected growth rate of GDP and the expected volatility of GDP growth."],"ans":"C","expl":"C is Correct because GDP growth from one period to the next cannot be perfectly anticipated. Under these uncertain circumstances, interest rates will still be positively related to the expected growth rate of GDP, but additionally they will be positively related to the expected volatility of GDP growth.","explhtml":"<p>C is Correct because GDP growth from one period to the next cannot be perfectly anticipated. Under these uncertain circumstances, interest rates will still be positively related to the expected growth rate of GDP, but additionally they will be positively related to the expected volatility of GDP growth.<\/p>","qhtml":"<div class=\"pp-topic\">Economics and Investment Markets<\/div><div class=\"qtext\"><p>The real default-free interest rate in an economy is most likely positively related to:<\/p><\/div>","subj":"portfolio"},{"n":32,"q":"A downward-sloping yield curve most likely implies that:","opts":["investors expect inflation to rise.","investors expect interest rates to fall.","bond risk premiums are negatively correlated with time to maturity."],"ans":"B","expl":"B is Correct because a downward-sloping yield curve is probably largely the result of investor expectations of future declines in interest rates.","explhtml":"<p>B is Correct because a downward-sloping yield curve is probably largely the result of investor expectations of future declines in interest rates.<\/p>","qhtml":"<div class=\"pp-topic\">Economics and Investment Markets<\/div><div class=\"qtext\"><p>A downward-sloping yield curve most likely implies that:<\/p><\/div>","subj":"portfolio"},{"n":33,"q":"In which of the following situations would a central bank most likely raise interest rates?","opts":["When both inflation and economic activity are too low","When both inflation and economic activity are too high","When inflation is too low and economic activity is too high"],"ans":"B","expl":"B is Correct because the central banks and monetary authorities responsible for setting interest rates in an economy do so in response to the economy's position in the business cycle—cutting their policy rates when activity and/or inflation are judged to be 'too low' and raising rates when activity and/or inflation are judged to be 'too high.'","explhtml":"<p>B is Correct because the central banks and monetary authorities responsible for setting interest rates in an economy do so in response to the economy&#x27;s position in the business cycle—cutting their policy rates when activity and/or inflation are judged to be &#x27;too low&#x27; and raising rates when activity and/or inflation are judged to be &#x27;too high.&#x27;<\/p>","qhtml":"<div class=\"pp-topic\">Economics and Investment Markets<\/div><div class=\"qtext\"><p>In which of the following situations would a central bank most likely raise interest rates?<\/p><\/div>","subj":"portfolio"},{"n":34,"q":"The break-even inflation rate:","opts":["is the markets' best guess of future inflation.","includes a risk premium that is lower for longer maturities.","is equal to the yield spread between a real bond and a nominal bond of the same maturity."],"ans":"C","expl":"C is Correct because the difference between the yield on, for example, a zero- coupon default-free nominal bond and on a zero-coupon default-free real bond of the same maturity is known as the break-even inflation (BEI) rate.","explhtml":"<p>C is Correct because the difference between the yield on, for example, a zero- coupon default-free nominal bond and on a zero-coupon default-free real bond of the same maturity is known as the break-even inflation (BEI) rate.<\/p>","qhtml":"<div class=\"pp-topic\">Economics and Investment Markets<\/div><div class=\"qtext\"><p>The break-even inflation rate:<\/p><\/div>","subj":"portfolio"},{"n":35,"q":"The break-even inflation rate is the difference between the yield on a zero-coupon default-free nominal bond and:","opts":["nominal expected inflation for the same period.","the yield on a zero-coupon default-free real bond of the same maturity.","the premium required by investors to compensate them for uncertainty about future inflation."],"ans":"B","expl":"B is Correct because the difference between the yield on, for example, a zero- coupon default-free nominal bond and on a zero-coupon default-free real bond of the same maturity is known as the break-even inflation (BEI) rate.","explhtml":"<p>B is Correct because the difference between the yield on, for example, a zero- coupon default-free nominal bond and on a zero-coupon default-free real bond of the same maturity is known as the break-even inflation (BEI) rate.<\/p>","qhtml":"<div class=\"pp-topic\">Economics and Investment Markets<\/div><div class=\"qtext\"><p>The break-even inflation rate is the difference between the yield on a zero-coupon default-free nominal bond and:<\/p><\/div>","subj":"portfolio"},{"n":36,"q":"Recovery rates on corporate bonds tend to be higher when the economy is expanding because:","opts":["credit spreads are higher.","default probabilities are lower.","any secured assets are likely to be sold at a higher price."],"ans":"C","expl":"C is Correct because assets that can be sold in order to recover value for bond holders are likely to fetch a higher price in a buoyant economic environment than in a stagnant one.","explhtml":"<p>C is Correct because assets that can be sold in order to recover value for bond holders are likely to fetch a higher price in a buoyant economic environment than in a stagnant one.<\/p>","qhtml":"<div class=\"pp-topic\">Economics and Investment Markets<\/div><div class=\"qtext\"><p>Recovery rates on corporate bonds tend to be higher when the economy is expanding because:<\/p><\/div>","subj":"portfolio"},{"n":37,"q":"An analyst gathers the following information about three corporate bonds: All else being equal, which bond is most likely to have the worst performance as the economy enters a recession?","opts":["Bond X","Bond Y","Bond Z"],"ans":"B","expl":"B is Correct because lower-rated (BBB) bonds will underperform higher-rated (AAA) bonds and bonds of issuers in the consumer cyclical sector will underperform bonds of issuers in the consumer non-cyclical sector. Hence, Bond Y is likely to underperform Bond X and Bond Z in a recession. When spreads are narrowing relative to government bonds, the spreads between higher- and lower- rated bond categories also narrow. In these times, although corporate bonds will generally outperform government bonds, lower-rated corporate bonds will tend to outperform higher-rated bonds. The converse is true as spreads widen. Additionally, in past recessions, the spread on the consumer cyclical sector rose more dramatically than it did for corporate bonds in the consumer non-cyclical sector.","explhtml":"<p>B is Correct because lower-rated (BBB) bonds will underperform higher-rated (AAA) bonds and bonds of issuers in the consumer cyclical sector will underperform bonds of issuers in the consumer non-cyclical sector. Hence, Bond Y is likely to underperform Bond X and Bond Z in a recession. When spreads are narrowing relative to government bonds, the spreads between higher- and lower- rated bond categories also narrow. In these times, although corporate bonds will generally outperform government bonds, lower-rated corporate bonds will tend to outperform higher-rated bonds. The converse is true as spreads widen. Additionally, in past recessions, the spread on the consumer cyclical sector rose more dramatically than it did for corporate bonds in the consumer non-cyclical sector.<\/p>","qhtml":"<div class=\"pp-topic\">Economics and Investment Markets<\/div><div class=\"qtext\"><p>An analyst gathers the following information about three corporate bonds:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp219.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>All else being equal, which bond is most likely to have the worst performance as the economy enters a recession?<\/p><\/div>","subj":"portfolio"},{"n":38,"q":"In an environment of widening credit spreads, the credit spreads on bonds issued by corporations with a low credit rating tend to widen:","opts":["less than those of corporations with a high credit rating.","by the same amount as those of corporations with a high credit rating.","more than those of corporations with a high credit rating."],"ans":"C","expl":"C is Correct because corporate bond spreads will be driven over time by the business cycle, but the impact of the economic environment on spreads will depend on issuers' industrial sector and rating. When spreads widen, the spreads on bonds issued by corporations with a low credit rating and/or that are part of a cyclical sector will tend to widen the most.","explhtml":"<p>C is Correct because corporate bond spreads will be driven over time by the business cycle, but the impact of the economic environment on spreads will depend on issuers&#x27; industrial sector and rating. When spreads widen, the spreads on bonds issued by corporations with a low credit rating and/or that are part of a cyclical sector will tend to widen the most.<\/p>","qhtml":"<div class=\"pp-topic\">Economics and Investment Markets<\/div><div class=\"qtext\"><p>In an environment of widening credit spreads, the credit spreads on bonds issued by corporations with a low credit rating tend to widen:<\/p><\/div>","subj":"portfolio"},{"n":39,"q":"Which of the following companies will be most impacted by an improving business cycle? A company that produces:","opts":["non-durable goods","staple consumer goods","discretionary consumer goods"],"ans":"C","expl":"C is Correct because cyclical sectors in this case are represented by companies that produce discretionary consumer goods and there is greater sensitivity to business conditions for the cyclical sector.","explhtml":"<p>C is Correct because cyclical sectors in this case are represented by companies that produce discretionary consumer goods and there is greater sensitivity to business conditions for the cyclical sector.<\/p>","qhtml":"<div class=\"pp-topic\">Economics and Investment Markets<\/div><div class=\"qtext\"><p>Which of the following companies will be most impacted by an improving business cycle? A company that produces:<\/p><\/div>","subj":"portfolio"},{"n":40,"q":"With respect to business cycle sensitivity, which of the following companies are most likely categorized as defensive?","opts":["Toothpaste producers","Airline travel companies","Discretionary consumer goods producers"],"ans":"A","expl":"A is Correct because some companies make products or provide services that are relatively insensitive to general economic conditions. Toothpaste might fall into this category. Companies and equity sectors that produce such products are referred to as non-cyclical or defensive investments.","explhtml":"<p>A is Correct because some companies make products or provide services that are relatively insensitive to general economic conditions. Toothpaste might fall into this category. Companies and equity sectors that produce such products are referred to as non-cyclical or defensive investments.<\/p>","qhtml":"<div class=\"pp-topic\">Economics and Investment Markets<\/div><div class=\"qtext\"><p>With respect to business cycle sensitivity, which of the following companies are most likely categorized as defensive?<\/p><\/div>","subj":"portfolio"},{"n":41,"q":"The consumption hedging properties of equities are considered:","opts":["poor as the potential for loss is high.","poor as equities tend not to pay off in bad times.","good as equities have outperformed bonds historically."],"ans":"B","expl":"B is Correct because, when the economy turns down, so (normally) do corporate profits and it is in these bad times that investors need their investments to offset these worsening earnings. Because of the pro-cyclicality of economies and corporate profits (in aggregate), equities are not a good hedge against bad consumption outcomes. Hence, the consumption hedging properties of equities are considered poor.","explhtml":"<p>B is Correct because, when the economy turns down, so (normally) do corporate profits and it is in these bad times that investors need their investments to offset these worsening earnings. Because of the pro-cyclicality of economies and corporate profits (in aggregate), equities are not a good hedge against bad consumption outcomes. Hence, the consumption hedging properties of equities are considered poor.<\/p>","qhtml":"<div class=\"pp-topic\">Economics and Investment Markets<\/div><div class=\"qtext\"><p>The consumption hedging properties of equities are considered:<\/p><\/div>","subj":"portfolio"},{"n":42,"q":"If investors expect a company's earnings to grow, the company's historical P/E ratio will most likely be:","opts":["less than its forward P/E ratio.","equal to its forward P/E ratio.","greater than its forward P/E ratio."],"ans":"C","expl":"C is Correct because, when the EPS used to estimate the ratio refers to last year's earnings, the P/E is referred to as being a historical or a trailing P/E. However, when the EPS is based on an estimate of future earnings, it is referred to as the leading or forward P/E. If a company's EPS is expected to grow, then its historical P/E will be greater than its forward P/E.","explhtml":"<p>C is Correct because, when the EPS used to estimate the ratio refers to last year&#x27;s earnings, the P/E is referred to as being a historical or a trailing P/E. However, when the EPS is based on an estimate of future earnings, it is referred to as the leading or forward P/E. If a company&#x27;s EPS is expected to grow, then its historical P/E will be greater than its forward P/E.<\/p>","qhtml":"<div class=\"pp-topic\">Economics and Investment Markets<\/div><div class=\"qtext\"><p>If investors expect a company&#x27;s earnings to grow, the company&#x27;s historical P/E ratio will most likely be:<\/p><\/div>","subj":"portfolio"},{"n":43,"q":"An increase of a company's P/E multiple is most consistent with an increase in:","opts":["the equity risk premium.","uncertainty about future inflation.","the expectation of future real earnings growth."],"ans":"C","expl":"C is C
