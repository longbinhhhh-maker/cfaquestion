orrect because, with regard to the basic pricing relationship, the high P/E could be the result of a number of factors, including an increase in the expectation of future real earnings growth.","explhtml":"<p>C is Correct because, with regard to the basic pricing relationship, the high P/E could be the result of a number of factors, including an increase in the expectation of future real earnings growth.<\/p>","qhtml":"<div class=\"pp-topic\">Economics and Investment Markets<\/div><div class=\"qtext\"><p>An increase of a company&#x27;s P/E multiple is most consistent with an increase in:<\/p><\/div>","subj":"portfolio"},{"n":44,"q":"Which of the following best describes a similarity between commercial real estate and equity investments?","opts":["Regular cash flows","The level of liquidity","Returns that are correlated with the state of the economy"],"ans":"C","expl":"C is Correct because the terminal value of the commercial real estate when the lease expires depends largely on the economic activity in the area, which is an equity-like feature. When general economic activity is high and thus there is strong demand for property, then the sale or redevelopment option might be worth pursuing. However, if the location is deemed to be less desirable or the economy is weak, then redevelopment may not be an option. The potential for profit or loss and the uncertainty related to this profit from redevelopment add an equity-like dimension to investment in commercial real estate.","explhtml":"<p>C is Correct because the terminal value of the commercial real estate when the lease expires depends largely on the economic activity in the area, which is an equity-like feature. When general economic activity is high and thus there is strong demand for property, then the sale or redevelopment option might be worth pursuing. However, if the location is deemed to be less desirable or the economy is weak, then redevelopment may not be an option. The potential for profit or loss and the uncertainty related to this profit from redevelopment add an equity-like dimension to investment in commercial real estate.<\/p>","qhtml":"<div class=\"pp-topic\">Economics and Investment Markets<\/div><div class=\"qtext\"><p>Which of the following best describes a similarity between commercial real estate and equity investments?<\/p><\/div>","subj":"portfolio"},{"n":45,"q":"Which of the following aspects of investing in commercial real estate is most similar to investing in equities?","opts":["The existence of a liquid secondary market","The rents collected from tenants net of ownership costs","The uncertain profit from potential redevelopment of the real estate"],"ans":"C","expl":"C is Correct because the potential for profit or loss and the uncertainty related to this profit from redevelopment add an equity-like dimension to investment in commercial real estate. In other words, this potential and uncertainty add either a positive increment to cash flow or a negative one.","explhtml":"<p>C is Correct because the potential for profit or loss and the uncertainty related to this profit from redevelopment add an equity-like dimension to investment in commercial real estate. In other words, this potential and uncertainty add either a positive increment to cash flow or a negative one.<\/p>","qhtml":"<div class=\"pp-topic\">Economics and Investment Markets<\/div><div class=\"qtext\"><p>Which of the following aspects of investing in commercial real estate is most similar to investing in equities?<\/p><\/div>","subj":"portfolio"},{"n":46,"q":"A 5% VaR of $1.5 million over a 1-week period implies that:","opts":["there is a 5% chance of losing $1.5 million over one week.","$1.5 million is the minimum loss expected over one week 95% of the time.","a loss of more than $1.5 million over one week is expected 5% of the time."],"ans":"C","expl":"C is Correct because $1.5 million is the minimum weekly loss expected 5% of the time. This implies that a loss of more than $1.5 million over a 1-week period is expected 5% of the time.","explhtml":"<p>C is Correct because $1.5 million is the minimum weekly loss expected 5% of the time. This implies that a loss of more than $1.5 million over a 1-week period is expected 5% of the time.<\/p>","qhtml":"<div class=\"pp-topic\">Measuring and Managing Market Risk<\/div><div class=\"qtext\"><p>A 5% VaR of $1.5 million over a 1-week period implies that:<\/p><\/div>","subj":"portfolio"},{"n":47,"q":"Given a 5% daily VaR of $20 million, which of the following statements is most accurate?","opts":["The expected daily loss is $1 million","There is a 5% chance of losing $20 million over one day","A minimum daily loss of $20 million is expected to occur once every 20 days"],"ans":"C","expl":"C is Correct because value at risk is the minimum loss that would be expected a certain percentage of the time over a certain period of time given the assumed market conditions. In this case, a minimum daily loss of $20 million is expected to happen 5% of the time, which is one day over a 20-day period.","explhtml":"<p>C is Correct because value at risk is the minimum loss that would be expected a certain percentage of the time over a certain period of time given the assumed market conditions. In this case, a minimum daily loss of $20 million is expected to happen 5% of the time, which is one day over a 20-day period.<\/p>","qhtml":"<div class=\"pp-topic\">Measuring and Managing Market Risk<\/div><div class=\"qtext\"><p>Given a 5% daily VaR of $20 million, which of the following statements is most accurate?<\/p><\/div>","subj":"portfolio"},{"n":48,"q":"Which of the following statements regarding VaR simulation methods is correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"A","expl":"A is Correct because under the parametric method, one cannot estimate a daily VaR and annualize it to arrive at an annual VaR estimate. In contrast, the expected return is annualized by multiplying the daily return by 250, and the standard deviation is annualized by multiplying the daily standard deviation by the square root of 250.","explhtml":"<p>A is Correct because under the parametric method, one cannot estimate a daily VaR and annualize it to arrive at an annual VaR estimate. In contrast, the expected return is annualized by multiplying the daily return by 250, and the standard deviation is annualized by multiplying the daily standard deviation by the square root of 250.<\/p>","qhtml":"<div class=\"pp-topic\">Measuring and Managing Market Risk<\/div><div class=\"qtext\"><p>Which of the following statements regarding VaR simulation methods is correct?<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp220.webp\" style=\"max-width:min(100%,721px)\" alt=\"\"><\/div>","subj":"portfolio"},{"n":49,"q":"Which of the following methods of estimating VaR most likely assumes that the return distributions for the risk factors in the portfolio are normal?","opts":["The parametric method only","The historical simulation method only","Both the parametric method and the historical simulation method"],"ans":"A","expl":"A is Correct because the parametric method typically assumes that the return distributions for the risk factors in the portfolio are normal. It uses the expected return and the standard deviation of return for each risk factor to estimate the VaR.","explhtml":"<p>A is Correct because the parametric method typically assumes that the return distributions for the risk factors in the portfolio are normal. It uses the expected return and the standard deviation of return for each risk factor to estimate the VaR.<\/p>","qhtml":"<div class=\"pp-topic\">Measuring and Managing Market Risk<\/div><div class=\"qtext\"><p>Which of the following methods of estimating VaR most likely assumes that the return distributions for the risk factors in the portfolio are normal?<\/p><\/div>","subj":"portfolio"},{"n":50,"q":"A $900 million portfolio has a daily expected return of 0.0298% and a daily standard deviation of returns of 0.9367%. Assuming normally distributed returns, the 5% daily VaR for the portfolio is closest to:","opts":["$13.6 million.","$19.4 million.","$41.9 million."],"ans":"A","expl":"A is Correct because the daily 5% VaR for a $900 million portfolio is $13.6 million, calculated in four steps: Step 1: The number of standard deviations to attain a 5% threshold, which is 1.65, multiplied by the daily standard deviation, or 1.65 × 0.009367 ≈ 0.015456 Step 2: The daily expected return minus 0.015456, or 0.000298 – 0.015456 = – 0.015158 Step 3: Take the absolute value of –0.015158 which is 0.015158 Step 4: Multiply the percentage value of Step 3 with the portfolio value, or 0.015158 × $900 million = $13.642 million ≈ $13.6 million","explhtml":"<p>A is Correct because the daily 5% VaR for a $900 million portfolio is $13.6 million, calculated in four steps: Step 1: The number of standard deviations to attain a 5% threshold, which is 1.65, multiplied by the daily standard deviation, or 1.65 × 0.009367 ≈ 0.015456 Step 2: The daily expected return minus 0.015456, or 0.000298 – 0.015456 = – 0.015158 Step 3: Take the absolute value of –0.015158 which is 0.015158 Step 4: Multiply the percentage value of Step 3 with the portfolio value, or 0.015158 × $900 million = $13.642 million ≈ $13.6 million<\/p>","qhtml":"<div class=\"pp-topic\">Measuring and Managing Market Risk<\/div><div class=\"qtext\"><p>A $900 million portfolio has a daily expected return of 0.0298% and a daily standard deviation of returns of 0.9367%. Assuming normally distributed returns, the 5% daily VaR for the portfolio is closest to:<\/p><\/div>","subj":"portfolio"},{"n":51,"q":"An analyst gathers the following information about a $100 million portfolio: Using a normal distribution, where a 5% VaR is obtained using a point of 1.65 standard deviations left of the mean, the 5% 1-day VaR of the portfolio is closest to:","opts":["$61,400.","$926,500.","$1,555,939."],"ans":"C","expl":"C is Correct because the steps in calculating the 5% 1-day VaR are: 1. Daily expected return: 0.10/240 = 0.000417. 2. Daily expected volatility (standard deviation): 0.15/240^0.5 = 0.009682. 3. Distance of the point of 5% daily VaR from the distribution mean (1.65 std dev) = 0.009682 × 1.65 = 0.015976. 4. Subtracted from expected daily return: 0.000417 – 0.015976 = –0.015559; absolute value = 0.015559. 5. Multiply by portfolio value: $100,000,000 × 0.015559 = $1,555,900.","explhtml":"<p>C is Correct because the steps in calculating the 5% 1-day VaR are: 1. Daily expected return: 0.10/240 = 0.000417. 2. Daily expected volatility (standard deviation): 0.15/240^0.5 = 0.009682. 3. Distance of the point of 5% daily VaR from the distribution mean (1.65 std dev) = 0.009682 × 1.65 = 0.015976. 4. Subtracted from expected daily return: 0.000417 – 0.015976 = –0.015559; absolute value = 0.015559. 5. Multiply by portfolio value: $100,000,000 × 0.015559 = $1,555,900.<\/p>","qhtml":"<div class=\"pp-topic\">Measuring and Managing Market Risk<\/div><div class=\"qtext\"><p>An analyst gathers the following information about a $100 million portfolio:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp221.webp\" style=\"max-width:min(100%,556px)\" alt=\"\"><p>Using a normal distribution, where a 5% VaR is obtained using a point of 1.65 standard deviations left of the mean, the 5% 1-day VaR of the portfolio is closest to:<\/p><\/div>","subj":"portfolio"},{"n":52,"q":"Which of the following is a limitation of VaR?","opts":["VaR does not consider liquidity","The reliability of VaR cannot be verified","VaR cannot be used for performance evaluation"],"ans":"A","expl":"A is Correct because if some assets in a portfolio are relatively illiquid, VaR could be understated, even under normal market conditions. Additionally, liquidity squeezes are frequently associated with tail events and major market downturns, thereby exacerbating the risk. Although illiquidity in times of stress is a general problem that affects virtually all of a firm’s financial decisions, reliance on VaR in non-normal market conditions will lead the user to underestimate the magnitude of potential losses.","explhtml":"<p>A is Correct because if some assets in a portfolio are relatively illiquid, VaR could be understated, even under normal market conditions. Additionally, liquidity squeezes are frequently associated with tail events and major market downturns, thereby exacerbating the risk. Although illiquidity in times of stress is a general problem that affects virtually all of a firm’s financial decisions, reliance on VaR in non-normal market conditions will lead the user to underestimate the magnitude of potential losses.<\/p>","qhtml":"<div class=\"pp-topic\">Measuring and Managing Market Risk<\/div><div class=\"qtext\"><p>Which of the following is a limitation of VaR?<\/p><\/div>","subj":"portfolio"},{"n":53,"q":"Which of the following measures how much a portfolio is expected to lose if the VaR cutoff is exceeded?","opts":["Relative VaR","Conditional VaR","Incremental VaR"],"ans":"B","expl":"B is Correct because conditional VaR (CVaR) can determine the average loss that would be incurred if the VaR cutoff is exceeded. CVaR answers the question, 'How much can I expect to lose if VaR is exceeded?'","explhtml":"<p>B is Correct because conditional VaR (CVaR) can determine the average loss that would be incurred if the VaR cutoff is exceeded. CVaR answers the question, &#x27;How much can I expect to lose if VaR is exceeded?&#x27;<\/p>","qhtml":"<div class=\"pp-topic\">Measuring and Managing Market Risk<\/div><div class=\"qtext\"><p>Which of the following measures how much a portfolio is expected to lose if the VaR cutoff is exceeded?<\/p><\/div>","subj":"portfolio"},{"n":54,"q":"Which of the following statements regarding sensitivity risk measures is correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"A","expl":"A is Correct because the most fundamental risk of an option is its sensitivity to the price of the underlying, otherwise known as the option’s delta.","explhtml":"<p>A is Correct because the most fundamental risk of an option is its sensitivity to the price of the underlying, otherwise known as the option’s delta.<\/p>","qhtml":"<div class=\"pp-topic\">Measuring and Managing Market Risk<\/div><div class=\"qtext\"><p>Which of the following statements regarding sensitivity risk measures is correct?<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp222.webp\" style=\"max-width:min(100%,721px)\" alt=\"\"><\/div>","subj":"portfolio"},{"n":55,"q":"Which of the following statements about convexity is most accurate?","opts":["Convexity uses volatility as the underlying risk factor","Convexity is a first order risk measure of fixed-income investments","Convexity describes the sensitivity of a bond's duration to changes in interest rates"],"ans":"C","expl":"C is Correct because, as one of the primary sensitivity exposure measures for fixed-income investments, convexity describes the sensitivity of a bond’s duration to changes in interest rates.","explhtml":"<p>C is Correct because, as one of the primary sensitivity exposure measures for fixed-income investments, convexity describes the sensitivity of a bond’s duration to changes in interest rates.<\/p>","qhtml":"<div class=\"pp-topic\">Measuring and Managing Market Risk<\/div><div class=\"qtext\"><p>Which of the following statements about convexity is most accurate?<\/p><\/div>","subj":"portfolio"},{"n":56,"q":"An investor's portfolio consists of out- of-the-money put options on a stock. As expiration approaches, the delta of the portfolio will approach:","opts":["−1.","0.","1."],"ans":"B","expl":"B is Correct because put option deltas range from a value of 0 to a value of −1. A value of 0 means that the option value does not change when the value of the underlying changes. As expiration approaches, an in-the-money call (put) delta approaches 1 (−1) and an out-of-the-money call (put) delta approaches 0.","explhtml":"<p>B is Correct because put option deltas range from a value of 0 to a value of −1. A value of 0 means that the option value does not change when the value of the underlying changes. As expiration approaches, an in-the-money call (put) delta approaches 1 (−1) and an out-of-the-money call (put) delta approaches 0.<\/p>","qhtml":"<div class=\"pp-topic\">Measuring and Managing Market Risk<\/div><div class=\"qtext\"><p>An investor&#x27;s portfolio consists of out- of-the-money put options on a stock. As expiration approaches, the delta of the portfolio will approach:<\/p><\/div>","subj":"portfolio"},{"n":57,"q":"An option has an original price of $1.00, a delta of 0.40 and a gamma of 0.03. Ignoring the effect of volatility, if the underlying's price changes by $0.70, the estimated new price of the option would be closest to:","opts":["$1.287.","$1.291.","$1.295."],"ans":"A","expl":"A is Correct because the formula for estimating the change in the option price is c + Δc = c + ΔcΔS + 1/2Γc(ΔS)2 , where c = original option price Δc = change in the option price Δc = delta ΔS = change in the price of the underlying security, and Γc = gamma. In other words, Δc = (delta)(change in the price of the underlying security) + 0.5(gamma)(change in the price of the underlying security)2 . Here we have Δc = (0.4)(0.7) + (0.5)(0.03)(0.7)2 = 0.28 + 0.00735 = 0.28735, therefore the estimated new option price is 1 + 0.28735 = 1.28735 ≈ 1.287.","explhtml":"<p>A is Correct because the formula for estimating the change in the option price is c + Δc = c + ΔcΔS + 1/2Γc(ΔS)2 , where c = original option price Δc = change in the option price Δc = delta ΔS = change in the price of the underlying security, and Γc = gamma. In other words, Δc = (delta)(change in the price of the underlying security) + 0.5(gamma)(change in the price of the underlying security)2 . Here we have Δc = (0.4)(0.7) + (0.5)(0.03)(0.7)2 = 0.28 + 0.00735 = 0.28735, therefore the estimated new option price is 1 + 0.28735 = 1.28735 ≈ 1.287.<\/p>","qhtml":"<div class=\"pp-topic\">Measuring and Managing Market Risk<\/div><div class=\"qtext\"><p>An option has an original price of $1.00, a delta of 0.40 and a gamma of 0.03. Ignoring the effect of volatility, if the underlying&#x27;s price changes by $0.70, the estimated new price of the option would be closest to:<\/p><\/div>","subj":"portfolio"},{"n":58,"q":"Alessia Rossi is the chief risk officer for Bellotti Bank, which operates in a region dominated by two established industries. Historically, these industries have provided stable employment to the region. Rossi would like to undertake an assessment of how the bank’s loans would perform if the regional economy lost one of these industries. The best choice for this assessment is a(n):","opts":["stress test.","historical scenario analysis.","analysis of loan portfolio duration."],"ans":"A","expl":"A is Correct because a stress test would be appropriate. The region is dominated by two industries that provide stable employment to the region, so the loss of one of these industries would represent an extreme negative event impacting the bank’s loan portfolio. Stress tests apply extreme negative stress to a particular portfolio exposure.","explhtml":"<p>A is Correct because a stress test would be appropriate. The region is dominated by two industries that provide stable employment to the region, so the loss of one of these industries would represent an extreme negative event impacting the bank’s loan portfolio. Stress tests apply extreme negative stress to a particular portfolio exposure.<\/p>","qhtml":"<div class=\"pp-topic\">Measuring and Managing Market Risk<\/div><div class=\"qtext\"><p>Alessia Rossi is the chief risk officer for Bellotti Bank, which operates in a region dominated by two established industries. Historically, these industries have provided stable employment to the region. Rossi would like to undertake an assessment of how the bank’s loans would perform if the regional economy lost one of these industries. The best choice for this assessment is a(n):<\/p><\/div>","subj":"portfolio"},{"n":59,"q":"A benefit of reverse stress testing is its ability to:","opts":["identify a portfolio's most significant risk exposures.","address portfolio vulnerabilities by modeling all market variables.","assess the probability of extreme market movements and their effect on a portfolio"],"ans":"A","expl":"A is Correct because reverse stress testing aids in the design of hypothetical scenarios by identifying a portfolio’s most significant exposures. Under reverse stress testing, the risk manager is seeking answers to such questions as the following: What are the top 10 exposures or risk drivers in my portfolio? What would make them risky? What are the top 10 benchmark-relative exposures? Under what scenario would hedges not hedge?","explhtml":"<p>A is Correct because reverse stress testing aids in the design of hypothetical scenarios by identifying a portfolio’s most significant exposures. Under reverse stress testing, the risk manager is seeking answers to such questions as the following: What are the top 10 exposures or risk drivers in my portfolio? What would make them risky? What are the top 10 benchmark-relative exposures? Under what scenario would hedges not hedge?<\/p>","qhtml":"<div class=\"pp-topic\">Measuring and Managing Market Risk<\/div><div class=\"qtext\"><p>A benefit of reverse stress testing is its ability to:<\/p><\/div>","subj":"portfolio"},{"n":60,"q":"Which of the following is a disadvantage of a hypothetical scenario analysis?","opts":["It needs to rely on history","It cannot take liquidity into account","It may incorrectly specify how assets will co-move"],"ans":"C","expl":"C is Correct because some of the limitations of hypothetical scenarios include the potential for incorrectly specifying how assets will co-move, getting the magnitude of movements wrong, and incorrectly adjusting for the effects of liquidity and concentration.","explhtml":"<p>C is Correct because some of the limitations of hypothetical scenarios include the potential for incorrectly specifying how assets will co-move, getting the magnitude of movements wrong, and incorrectly adjusting for the effects of liquidity and concentration.<\/p>","qhtml":"<div class=\"pp-topic\">Measuring and Managing Market Risk<\/div><div class=\"qtext\"><p>Which of the following is a disadvantage of a hypothetical scenario analysis?<\/p><\/div>","subj":"portfolio"},{"n":61,"q":"To manage market risks, an investment firm allocates a total 5% daily VaR limit among market, credit, and operational risks, as well as across its three international business units. This is an example of:","opts":["position limits.","risk budgeting.","scenario limits."],"ans":"B","expl":"B is Correct because with risk budgeting, the total risk appetite of the firm or portfolio is agreed on at the highest level of the entity and then allocated to its sub-activities.","explhtml":"<p>B is Correct because with risk budgeting, the total risk appetite of the firm or portfolio is agreed on at the highest level of the entity and then allocated to its sub-activities.<\/p>","qhtml":"<div class=\"pp-topic\">Measuring and Managing Market Risk<\/div><div class=\"qtext\"><p>To manage market risks, an investment firm allocates a total 5% daily VaR limit among market, credit, and operational risks, as well as across its three international business units. This is an example of:<\/p><\/div>","subj":"portfolio"},{"n":62,"q":"Position limits:","opts":["take volatility into account.","are good controls on overconcentration.","require a reduction in the size of a portfolio when a loss of a particular size occurs in a specified period."],"ans":"B","expl":"B is Correct because position limits are limits on the market value of any given investment, or the notional principal amount for a derivatives contract. They can be expressed in currency units or as a percentage of some other value, such as net assets. Position limits do not take into account duration, volatility, and correlation but they are excellent controls on overconcentration.","explhtml":"<p>B is Correct because position limits are limits on the market value of any given investment, or the notional principal amount for a derivatives contract. They can be expressed in currency units or as a percentage of some other value, such as net assets. Position limits do not take into account duration, volatility, and correlation but they are excellent controls on overconcentration.<\/p>","qhtml":"<div class=\"pp-topic\">Measuring and Managing Market Risk<\/div><div class=\"qtext\"><p>Position limits:<\/p><\/div>","subj":"portfolio"},{"n":63,"q":"Which of the following statements about market risk management and capital allocation is most accurate? •Statement 1:In market risk management, capital allocation requires a reduction in the size of a portfolio, or its complete liquidation, when a loss of a particular size occurs in a specified period. •Statement 2:Capital allocation cannot be used if leverage is used by the portfolio. •Statement 3:Economic capital is designed to measure how much shareholders’ equity could be required to meet tail risk losses.","opts":["Statement 1","Statement 2","Statement 3"],"ans":"C","expl":"C is Correct because economic capital is, in fact, designed to measure how much shareholders’ equity could be required to meet tail risk losses.","explhtml":"<p>C is Correct because economic capital is, in fact, designed to measure how much shareholders’ equity could be required to meet tail risk losses.<\/p>","qhtml":"<div class=\"pp-topic\">Measuring and Managing Market Risk<\/div><div class=\"qtext\"><p>Which of the following statements about market risk management and capital allocation is most accurate? •Statement 1:In market risk management, capital allocation requires a reduction in the size of a portfolio, or its complete liquidation, when a loss of a particular size occurs in a specified period. •Statement 2:Capital allocation cannot be used if leverage is used by the portfolio. •Statement 3:Economic capital is designed to measure how much shareholders’ equity could be required to meet tail risk losses.<\/p><\/div>","subj":"portfolio"},{"n":64,"q":"Which of the following is the most appropriate action for a hedge fund seeking to apply risk management on a capital allocation basis?","opts":["Establish ex post tracking error budgets","Subdivide its risk appetite among its business units","Require the purchase of protective options after a pre-set level of losses occur"],"ans":"B","expl":"B is Correct because risk management on a capital allocation basis is a form of risk budgeting, which seeks to use resources to maximize return and minimize loss. Risk appetite is decided at the senior level then allocated to various activities. Capital allocation is the practice of placing limits on each of a company’s activities in order to ensure that the areas in which it expects the greatest reward and has the greatest expertise are given the resources needed to accomplish their goals.","explhtml":"<p>B is Correct because risk management on a capital allocation basis is a form of risk budgeting, which seeks to use resources to maximize return and minimize loss. Risk appetite is decided at the senior level then allocated to various activities. Capital allocation is the practice of placing limits on each of a company’s activities in order to ensure that the areas in which it expects the greatest reward and has the greatest expertise are given the resources needed to accomplish their goals.<\/p>","qhtml":"<div class=\"pp-topic\">Measuring and Managing Market Risk<\/div><div class=\"qtext\"><p>Which of the following is the most appropriate action for a hedge fund seeking to apply risk management on a capital allocation basis?<\/p><\/div>","subj":"portfolio"},{"n":65,"q":"A sponsor of a defined benefit pension plan is concerned that the plan assets invested heavily into equity and real estate do not match those of the pension liabilities. Which of the following best estimates how much the assets might underperform the liabilities?","opts":["Surplus at risk","Redemption risk","Maximum drawdown"],"ans":"A","expl":"A is Correct because surplus at risk would address concerns regarding the characteristics of the plan’s assets. It is computed by entering the assets in the portfolio into a VaR model as long positions and the pension liabilities as short fixed-income positions. It estimates how much the assets might underperform the liabilities, usually over one year. The more volatile the investments in the pension fund and the less well correlated these assets are with the liabilities, the higher the surplus at risk.","explhtml":"<p>A is Correct because surplus at risk would address concerns regarding the characteristics of the plan’s assets. It is computed by entering the assets in the portfolio into a VaR model as long positions and the pension liabilities as short fixed-income positions. It estimates how much the assets might underperform the liabilities, usually over one year. The more volatile the investments in the pension fund and the less well correlated these assets are with the liabilities, the higher the surplus at risk.<\/p>","qhtml":"<div class=\"pp-topic\">Measuring and Managing Market Risk<\/div><div class=\"qtext\"><p>A sponsor of a defined benefit pension plan is concerned that the plan assets invested heavily into equity and real estate do not match those of the pension liabilities. Which of the following best estimates how much the assets might underperform the liabilities?<\/p><\/div>","subj":"portfolio"},{"n":66,"q":"An analyst is using historical scenario analysis to assess the performance of an investment strategy in different environments. The results of the analysis for both the benchmark and the strategy portfolios are presented in the table below. The average risk-free rate is 2.0%. With regard to the Sharpe ratio, the strategy:","opts":["performs similarly in a recession and in an expansion.","underperforms the benchmark in an expansionary environment.","outperforms the benchmark in both low volatility and high volatility environments."],"ans":"A","expl":"A is Correct because in both the recession and expansion environments, the Sharpe ratio for strategy remains constant at 2.33. In addition, the strategy outperforms the benchmark in recession and expansion environments. The Sharpe ratio = (Return – Risk free rate)/Standard deviation.","explhtml":"<p>A is Correct because in both the recession and expansion environments, the Sharpe ratio for strategy remains constant at 2.33. In addition, the strategy outperforms the benchmark in recession and expansion environments. The Sharpe ratio = (Return – Risk free rate)/Standard deviation.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp230.webp\" style=\"max-width:min(100%,721px)\" alt=\"\">","qhtml":"<div class=\"pp-topic\">Measuring and Managing Market Risk<\/div><div class=\"qtext\"><p>An analyst is using historical scenario analysis to assess the performance of an investment strategy in different environments. The results of the analysis for both the benchmark and the strategy portfolios are presented in the table below. The average risk-free rate is 2.0%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp223.webp\" style=\"max-width:min(100%,595px)\" alt=\"\"><p>With regard to the Sharpe ratio, the strategy:<\/p><\/div>","subj":"portfolio"},{"n":67,"q":"With regard to ETFs, which of the following is most accurate?","opts":["The daily list of securities that an ETF wants to own is referred to as the redemption basket","For greater tax efficiency, ETF portfolio managers select high-basis holdings for redemptions","Authorized participants (APs) absorb the costs of transacting securities for the ETF’s portfolio"],"ans":"C","expl":"C is Correct because in the ETF creation/redemption process, the AP absorbs all costs of transacting the securities for the fund’s portfolio. APs pass these costs to investors in the ETF’s bid–ask spread, incurred by ETF buyers and sellers. Thus, non-transacting shareholders of an ETF are shielded from the negative impact of transaction costs caused by other investors entering and exiting the fund. In contrast, when investors enter or exit a traditional mutual fund, the mutual fund manager incurs costs to buy or sell investments arising from this activity, which affect all fund shareholders.","explhtml":"<p>C is Correct because in the ETF creation/redemption process, the AP absorbs all costs of transacting the securities for the fund’s portfolio. APs pass these costs to investors in the ETF’s bid–ask spread, incurred by ETF buyers and sellers. Thus, non-transacting shareholders of an ETF are shielded from the negative impact of transaction costs caused by other investors entering and exiting the fund. In contrast, when investors enter or exit a traditional mutual fund, the mutual fund manager incurs costs to buy or sell investments arising from this activity, which affect all fund shareholders.<\/p>","qhtml":"<div class=\"pp-topic\">Exchange-Traded Funds: Mechanics and Applications<\/div><div class=\"qtext\"><p>With regard to ETFs, which of the following is most accurate?<\/p><\/div>","subj":"portfolio"},{"n":68,"q":"Authorized participants (APs) in ETF markets:","opts":["determine the minimum size of creation baskets.","publish a list of required in-kind securities for each ETF.","are the only investors who can create or redeem new shares of an ETF."],"ans":"C","expl":"C is Correct because the only investors who can create or redeem new shares of an ETF are a special group of institutional investors called authorized participants (APs). APs are large broker/dealers, often market makers, who are authorized by the ETF issuer to participate in the creation/redemption process.","explhtml":"<p>C is Correct because the only investors who can create or redeem new shares of an ETF are a special group of institutional investors called authorized participants (APs). APs are large broker/dealers, often market makers, who are authorized by the ETF issuer to participate in the creation/redemption process.<\/p>","qhtml":"<div class=\"pp-topic\">Exchange-Traded Funds: Mechanics and Applications<\/div><div class=\"qtext\"><p>Authorized participants (APs) in ETF markets:<\/p><\/div>","subj":"portfolio"},{"n":69,"q":"Which of the following statements regarding ETF shares is correct?","opts":["ETF shares come to market via an initial public offering of fixed size","Investors can purchase ETF shares in the secondary market from a market maker","US market makers are given up to three days to settle their accounts due to the time required to create or borrow ETF shares"],"ans":"B","expl":"B is Correct because an investor purchases ETF shares in the secondary market from a market maker or other counterparty.","explhtml":"<p>B is Correct because an investor purchases ETF shares in the secondary market from a market maker or other counterparty.<\/p>","qhtml":"<div class=\"pp-topic\">Exchange-Traded Funds: Mechanics and Applications<\/div><div class=\"qtext\"><p>Which of the following statements regarding ETF shares is correct?<\/p><\/div>","subj":"portfolio"},{"n":70,"q":"Which of the following is not a source of tracking error for index-tracking ETFs?","opts":["An ETF holds only a subset of index securities to track the benchmark index","An ETF pays trading commissions to acquire shares in the underlying index's constituents","A market maker sells ETF shares and is required to borrow ETF shares to avoid a short position"],"ans":"C","expl":"C is Correct because the need of a market maker to borrow ETF shares to avoid a short position from an ETF share transaction is likely to impact the bid–ask Zr than represent a source of tracking error.","explhtml":"<p>C is Correct because the need of a market maker to borrow ETF shares to avoid a short position from an ETF share transaction is likely to impact the bid–ask Zr than represent a source of tracking error.<\/p>","qhtml":"<div class=\"pp-topic\">Exchange-Traded Funds: Mechanics and Applications<\/div><div class=\"qtext\"><p>Which of the following is not a source of tracking error for index-tracking ETFs?<\/p><\/div>","subj":"portfolio"},{"n":71,"q":"Which of the following is not a source of tracking error for an index-tracking ETF?","opts":["Representative sampling","The frequency of index tracking","Holding depository receipts instead of index constituents"],"ans":"B","expl":"B is Correct because tracking error is caused by differences in the composition of the ETF and its underlying index, not the frequency of tracking. Sources of benchmark tracking error include the following: ■ Fees and expenses—Index calculation generally assumes that trading is frictionless and occurs at the closing price. A fund’s operating fees and expenses reduce the fund’s return relative to the index. ■ Representative sampling/optimization—Rather than fully replicate the index, funds may hold only a subset of index securities to track the benchmark index. ■ Depositary receipts and other ETFs—Funds may hold securities that are different from those in the index, such as American depositary receipts (ADRs), global depositary receipts (GDRs), and other ETFs. ■ Index changes—Funds may trade index changes at times and prices that are different from those of the benchmark tracked. ■ Fund accounting practices—Fund accounting practices may differ from the index calculation methodology—for example, valuation practices for foreign exchange and fixed income. ■ Asset manager operations—ETF issuers may attempt to offset costs through security lending and foreign dividend recapture. These act as “negative” costs, which enhance fund performance relative to the index.\" ■ Regulatory and tax requirements—Funds may be subject to regulatory and tax requirements that are different from those assumed in index methodology, such as with foreign dividend withholding.\"","explhtml":"<p>B is Correct because tracking error is caused by differences in the composition of the ETF and its underlying index, not the frequency of tracking. Sources of benchmark tracking error include the following:<\/p><p>■ Fees and expenses—Index calculation generally assumes that trading is frictionless and occurs at the closing price. A fund’s operating fees and expenses reduce the fund’s return relative to the index.<\/p><p>■ Representative sampling/optimization—Rather than fully replicate the index, funds may hold only a subset of index securities to track the benchmark index.<\/p><p>■ Depositary receipts and other ETFs—Funds may hold securities that are different from those in the index, such as American depositary receipts (ADRs), global depositary receipts (GDRs), and other ETFs.<\/p><p>■ Index changes—Funds may trade index changes at times and prices that are different from those of the benchmark tracked.<\/p><p>■ Fund accounting practices—Fund accounting practices may differ from the index calculation methodology—for example, valuation practices for foreign exchange and fixed income.<\/p><p>■ Asset manager operations—ETF issuers may attempt to offset costs through security lending and foreign dividend recapture. These act as “negative” costs, which enhance fund performance relative to the index.&quot;<\/p><p>■ Regulatory and tax requirements—Funds may be subject to regulatory and tax requirements that are different from those assumed in index methodology, such as with foreign dividend withholding.&quot;<\/p>","qhtml":"<div class=\"pp-topic\">Exchange-Traded Funds: Mechanics and Applications<\/div><div class=\"qtext\"><p>Which of the following is not a source of tracking error for an index-tracking ETF?<\/p><\/div>","subj":"portfolio"},{"n":72,"q":"A decrease in which of the following most likely reduces an ETF's bid–ask spread?","opts":["Brokerage fees","Daily share volume for the ETF","Competition amongst market makers for the ETF"],"ans":"A","expl":"A is Correct because lower direct trading costs, such as brokerage fees, for the liquidity provider would most likely reduce an ETF's bid–ask spread. If the market maker has lower costs, the need to recoup those costs by way of higher spreads is reduced.","explhtml":"<p>A is Correct because lower direct trading costs, such as brokerage fees, for the liquidity provider would most likely reduce an ETF&#x27;s bid–ask spread. If the market maker has lower costs, the need to recoup those costs by way of higher spreads is reduced.<\/p>","qhtml":"<div class=\"pp-topic\">Exchange-Traded Funds: Mechanics and Applications<\/div><div class=\"qtext\"><p>A decrease in which of the following most likely reduces an ETF&#x27;s bid–ask spread?<\/p><\/div>","subj":"portfolio"},{"n":73,"q":"A frequently traded ETF is constructed using only a sample of the securities in its benchmark index. A portion of the portfolio consists of foreign shares with daily closing times earlier than the ETF. Historically, the ETF manager has observed meaningful differences between the ETF market price and its NAV. Which of the following best explains the observed differences?","opts":["The portfolio construction approach","The level of liquidity in the ETF shares","The closing times of some of its underlying securities"],"ans":"C","expl":"C is Correct because differences in closing times between an ETF and its underlying securities can lead to the ETF trading at a premium/discount to its NAV. Premiums/discounts are driven by a number of factors, including timing differences and stale pricing. NAV is often a poor fair value indicator for ETFs that hold foreign securities because of differences in exchange closing times between the underlying (e.g., foreign stocks, bonds, or commodities) and the exchange where the ETF trades.","explhtml":"<p>C is Correct because differences in closing times between an ETF and its underlying securities can lead to the ETF trading at a premium/discount to its NAV. Premiums/discounts are driven by a number of factors, including timing differences and stale pricing. NAV is often a poor fair value indicator for ETFs that hold foreign securities because of differences in exchange closing times between the underlying (e.g., foreign stocks, bonds, or commodities) and the exchange where the ETF trades.<\/p>","qhtml":"<div class=\"pp-topic\">Exchange-Traded Funds: Mechanics and Applications<\/div><div class=\"qtext\"><p>A frequently traded ETF is constructed using only a sample of the securities in its benchmark index. A portion of the portfolio consists of foreign shares with daily closing times earlier than the ETF. Historically, the ETF manager has observed meaningful differences between the ETF market price and its NAV. Which of the following best explains the observed differences?<\/p><\/div>","subj":"portfolio"},{"n":74,"q":"With regard to the costs of ETF ownership, which of the following statements is correct? •Statement 1:For active short-term ETF investors, management fees and tracking error are far more significant considerations than commission and spreads when entering and exiting ETF positions. •Statement 2:An ETF's daily price is set to its NAV, which is based on closing prices for the fund’s underlying securities. •Statement 3:Both security lending and tracking error are implicit costs for ETF investors.","opts":["Statement 1","Statement 2","Statement 3"],"ans":"C","expl":"C is Correct because implicit costs for ETF investors include security lending and tracking error.","explhtml":"<p>C is Correct because implicit costs for ETF investors include security lending and tracking error.<\/p>","qhtml":"<div class=\"pp-topic\">Exchange-Traded Funds: Mechanics and Applications<\/div><div class=\"qtext\"><p>With regard to the costs of ETF ownership, which of the following statements is correct? •Statement 1:For active short-term ETF investors, management fees and tracking error are far more significant considerations than commission and spreads when entering and exiting ETF positions. •Statement 2:An ETF&#x27;s daily price is set to its NAV, which is based on closing prices for the fund’s underlying securities. •Statement 3:Both security lending and tracking error are implicit costs for ETF investors.<\/p><\/div>","subj":"portfolio"},{"n":75,"q":"Which of the following statements about exchange-traded product (ETP) risks is most accurate?","opts":["Security lending by ETF issuers increases the level of counterparty risk for ETF investors","Exchange-traded notes (ETNs) have the largest potential counterparty risk of all exchange-traded products","ETFs using swaps eliminate settlement risk by disclosing over the counter (OTC) derivatives holdings on a daily basis"],"ans":"B","expl":"B is Correct because ETNs are unsecured, unsubordinated debt notes and, therefore, are subject to default by the ETN issuer.","explhtml":"<p>B is Correct because ETNs are unsecured, unsubordinated debt notes and, therefore, are subject to default by the ETN issuer.<\/p>","qhtml":"<div class=\"pp-topic\">Exchange-Traded Funds: Mechanics and Applications<\/div><div class=\"qtext\"><p>Which of the following statements about exchange-traded product (ETP) risks is most accurate?<\/p><\/div>","subj":"portfolio"},{"n":76,"q":"Settlement risk for an ETF is best described as the risk of:","opts":["loss from security lending.","creation and redemption halts.","counterparty default before gains can be realized."],"ans":"C","expl":"C is Correct because settlement risk represents mark-to-market (unrealized) gains that are subject to counterparty default. To minimize settlement risk, OTC contracts are typically settled frequently—usually on a daily or weekly basis. This frequent settlement reduces the exposure the swap partners face if a company goes bankrupt, but there is a theoretical risk of counterparty default between settlement periods.","explhtml":"<p>C is Correct because settlement risk represents mark-to-market (unrealized) gains that are subject to counterparty default. To minimize settlement risk, OTC contracts are typically settled frequently—usually on a daily or weekly basis. This frequent settlement reduces the exposure the swap partners face if a company goes bankrupt, but there is a theoretical risk of counterparty default between settlement periods.<\/p>","qhtml":"<div class=\"pp-topic\">Exchange-Traded Funds: Mechanics and Applications<\/div><div class=\"qtext\"><p>Settlement risk for an ETF is best described as the risk of:<\/p><\/div>","subj":"portfolio"},{"n":77,"q":"A fund manager uses an ETF to make a tactical adjustment to her existing portfolio, focusing on a specific area of technology. The manager has identified three ETFs as potential investments: Which ETF would be most suitable for the tactical adjustment to the portfolio?","opts":["ETF 1","ETF 2","ETF 3"],"ans":"C","expl":"C is Correct because ETF 3 is a thematic ETF and has the highest ratio of average dollar volume to average assets. Thematic ETFs hold stocks passively but allow investors to take an active view on a market segment they believe will deliver strong returns. These ETFs typically cover a narrow or niche area of the market not well represented by an industry. Examples include focused areas of technology, such as cybersecurity and robotics. In addition, ETFs that have the highest trading volumes in their asset class category are generally preferred for tactical trading applications. Trading costs and liquidity, rather than management fees, are the important criteria in selecting an ETF for tactical adjustments. To identify the most commonly used ETFs for tactical strategies, one can look at the ratio of average dollar volume to average assets for the ETF.","explhtml":"<p>C is Correct because ETF 3 is a thematic ETF and has the highest ratio of average dollar volume to average assets. Thematic ETFs hold stocks passively but allow investors to take an active view on a market segment they believe will deliver strong returns. These ETFs typically cover a narrow or niche area of the market not well represented by an industry. Examples include focused areas of technology, such as cybersecurity and robotics. In addition, ETFs that have the highest trading volumes in their asset class category are generally preferred for tactical trading applications. Trading costs and liquidity, rather than management fees, are the important criteria in selecting an ETF for tactical adjustments. To identify the most commonly used ETFs for tactical strategies, one can look at the ratio of average dollar volume to average assets for the ETF.<\/p>","qhtml":"<div class=\"pp-topic\">Exchange-Traded Funds: Mechanics and Applications<\/div><div class=\"qtext\"><p>A fund manager uses an ETF to make a tactical adjustment to her existing portfolio, focusing on a specific area of technology. The manager has identified three ETFs as potential investments:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp224.webp\" style=\"max-width:min(100%,612px)\" alt=\"\"><p>Which ETF would be most suitable for the tactical adjustment to the portfolio?<\/p><\/div>","subj":"portfolio"},{"n":78,"q":"When evaluating investment strategies, fundamental managers most likely use backtesting to assess:","opts":["how changing key assumptions impact the strategies.","how the strategies would perform in a hypothetical environment.","the ability of a stock screening criterion to generate excess returns."],"ans":"C","expl":"C is Correct because backtesting can uncover the historical efficacy of a screening criterion by determining if its use would have added incremental excess return. Backtesting fits quantitative and systematic investment styles naturally and is widely used by fundamental managers.","explhtml":"<p>C is Correct because backtesting can uncover the historical efficacy of a screening criterion by determining if its use would have added incremental excess return. Backtesting fits quantitative and systematic investment styles naturally and is widely used by fundamental managers.<\/p>","qhtml":"<div class=\"pp-topic\">Backtesting and Simulation<\/div><div class=\"qtext\"><p>When evaluating investment strategies, fundamental managers most likely use backtesting to assess:<\/p><\/div>","subj":"portfolio"},{"n":79,"q":"Identification of downside risk and structural breaks most likely occurs during which of the following steps of the backtesting process?","opts":["Strategy design","Analysis of backtesting output","Historical investment simulation"],"ans":"B","expl":"B is Correct because in the analysis of backtesting output step, it is useful to examine the backtested cumulative performance of an investment strategy over an extended history. Using these cumulative performance graphs, one can readily identify downside risk, performance decay, and structural breaks.","explhtml":"<p>B is Correct because in the analysis of backtesting output step, it is useful to examine the backtested cumulative performance of an investment strategy over an extended history. Using these cumulative performance graphs, one can readily identify downside risk, performance decay, and structural breaks.<\/p>","qhtml":"<div class=\"pp-topic\">Backtesting and Simulation<\/div><div class=\"qtext\"><p>Identification of downside risk and structural breaks most likely occurs during which of the following steps of the backtesting process?<\/p><\/div>","subj":"portfolio"},{"n":80,"q":"A fund manager backtests a strategy of adding non-domestic equities to a domestic portfolio, with a goal of enhancing the portfolio's Sharpe ratio. Transaction costs for non-domestic equities are similar to domestic equities, and no foreign currency hedging is planned. If historical data is available as of 1980, which of the following decisions in the backtest design is not appropriate?","opts":["Transaction costs of the new strategy will be ignored","Use a historical scenario analysis for a backtesting window from 1980","The Sharpe ratio will be computed by translating all investment returns into the domestic currency"],"ans":"A","expl":"A is Correct because with backtesting, consideration of transaction costs is critical, because many market anomalies simply disappear once they are included.","explhtml":"<p>A is Correct because with backtesting, consideration of transaction costs is critical, because many market anomalies simply disappear once they are included.<\/p>","qhtml":"<div class=\"pp-topic\">Backtesting and Simulation<\/div><div class=\"qtext\"><p>A fund manager backtests a strategy of adding non-domestic equities to a domestic portfolio, with a goal of enhancing the portfolio&#x27;s Sharpe ratio. Transaction costs for non-domestic equities are similar to domestic equities, and no foreign currency hedging is planned. If historical data is available as of 1980, which of the following decisions in the backtest design is not appropriate?<\/p><\/div>","subj":"portfolio"},{"n":81,"q":"Which of the following is most likely performed during the strategy design step of backtesting an active investment strategy?","opts":["Identifying the investment goals and hypothesis","Calculating maximum drawdown for the portfolio","Using rolling windows to replicate the live investing process"],"ans":"A","expl":"A is Correct because as the first step in the backtesting process, strategy design involves identifying the investment goals and hypothesis. For active strategies, the goal is typically to achieve excess returns over the relevant benchmark or superior risk-adjusted absolute return. An investment hypothesis is a method—a trading rule, security selection criterion, a portfolio, etc.—aimed at achieving the goal.","explhtml":"<p>A is Correct because as the first step in the backtesting process, strategy design involves identifying the investment goals and hypothesis. For active strategies, the goal is typically to achieve excess returns over the relevant benchmark or superior risk-adjusted absolute return. An investment hypothesis is a method—a trading rule, security selection criterion, a portfolio, etc.—aimed at achieving the goal.<\/p>","qhtml":"<div class=\"pp-topic\">Backtesting and Simulation<\/div><div class=\"qtext\"><p>Which of the following is most likely performed during the strategy design step of backtesting an active investment strategy?<\/p><\/div>","subj":"portfolio"},{"n":82,"q":"An analyst backtests three investment strategies X, Y, Z over the last ten years and gathers the following summary about their monthly returns: Based on the above summary, which strategy most likely has the lowest risk?","opts":["Strategy X","Strategy Y","Strategy Z"],"ans":"B","expl":"B is Correct because the Strategy Y shows a rather similar (only slightly lower) mean return (= 1.0%) compared to strategy X (= 1.1%) and strategy Z (= 1.2%), but at much lower standard deviation (= 0.5%) than strategy X (= 2.0%). Portfolios Y and Z have the same Sharpe ratio (= 2.0), but Strategy Y has a much lower kurtosis (4.2 versus 18.5), which indicates it is less fat tailed, i.e., it has lower probability of extreme negative surprises. Strategy Y also has a lower downside risk compared to Strategies X and Z, as indicated by VaR (95%). Thus, based on available data, Strategy Y most likely has the least amount of risk.","explhtml":"<p>B is Correct because the Strategy Y shows a rather similar (only slightly lower) mean return (= 1.0%) compared to strategy X (= 1.1%) and strategy Z (= 1.2%), but at much lower standard deviation (= 0.5%) than strategy X (= 2.0%). Portfolios Y and Z have the same Sharpe ratio (= 2.0), but Strategy Y has a much lower kurtosis (4.2 versus 18.5), which indicates it is less fat tailed, i.e., it has lower probability of extreme negative surprises. Strategy Y also has a lower downside risk compared to Strategies X and Z, as indicated by VaR (95%). Thus, based on available data, Strategy Y most likely has the least amount of risk.<\/p>","qhtml":"<div class=\"pp-topic\">Backtesting and Simulation<\/div><div class=\"qtext\"><p>An analyst backtests three investment strategies X, Y, Z over the last ten years and gathers the following summary about their monthly returns:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp225.webp\" style=\"max-width:min(100%,550px)\" alt=\"\"><p>Based on the above summary, which strategy most likely has the lowest risk?<\/p><\/div>","subj":"portfolio"},{"n":83,"q":"An analyst gathers the following data regarding three factors from a backtested portfolio: Which factor has the smallest downside risk as measured by the weighted average of all losses that exceed a threshold?","opts":["Factor 1","Factor 2","Factor 3"],"ans":"A","expl":"A is Correct because although it has the highest downside in terms of VaR, Factor 1 has the least downside in terms of Conditional Var (CVaR) and the smallest maximum drawdown. CVar is the key measure of downside risk for a portfolio and is defined as the expected loss if the VaR threshold is exceeded. CVaR answers the question, How much can I expect to lose if VaR is exceeded? CVaR is also sometimes referred to as the expected tail loss or expected shortfall. For simulations, analysts typically use CVaR and maximum drawdown to characterize downside risk. Conditional VaR is defined as the weighted average of all loss outcomes in the return distribution that exceed the VaR loss. Thus, CVaR is a more comprehensive measure of tail loss than VaR.","explhtml":"<p>A is Correct because although it has the highest downside in terms of VaR, Factor 1 has the least downside in terms of Conditional Var (CVaR) and the smallest maximum drawdown. CVar is the key measure of downside risk for a portfolio and is defined as the expected loss if the VaR threshold is exceeded. CVaR answers the question, How much can I expect to lose if VaR is exceeded? CVaR is also sometimes referred to as the expected tail loss or expected shortfall. For simulations, analysts typically use CVaR and maximum drawdown to characterize downside risk. Conditional VaR is defined as the weighted average of all loss outcomes in the return distribution that exceed the VaR loss. Thus, CVaR is a more comprehensive measure of tail loss than VaR.<\/p>","qhtml":"<div class=\"pp-topic\">Backtesting and Simulation<\/div><div class=\"qtext\"><p>An analyst gathers the following data regarding three factors from a backtested portfolio:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp226.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>Which factor has the smallest downside risk as measured by the weighted average of all losses that exceed a threshold?<\/p><\/div>","subj":"portfolio"},{"n":84,"q":"An analyst is launching a new portfolio that uses an equity investment strategy based on a multifactor approach. The analyst has identified five fundamental factors and has conducted backtests on different strategies using point-in-time data adjusted for reporting lags and data revisions. Without considering prior inference, the analyst focuses on the statistical results and selects the strategy with the lowest p-value. This approach:","opts":["suffers from survivorship bias.","is susceptible to look-ahead bias.","can be characterized as data snooping."],"ans":"C","expl":"C is Correct because there is often a temptation to substitute sound portfolio construction by simply backtesting many strategies and picking the best- performing strategy. This bias is called data snooping—making an inference after looking at statistical results rather than testing a prior inference. Because the analyst fails to consider prior inference and focuses on the statistical results by selecting the strategy with the lowest p-value (highest t- statistic), data snooping is likely to have occurred.","explhtml":"<p>C is Correct because there is often a temptation to substitute sound portfolio construction by simply backtesting many strategies and picking the best- performing strategy. This bias is called data snooping—making an inference after looking at statistical results rather than testing a prior inference. Because the analyst fails to consider prior inference and focuses on the statistical results by selecting the strategy with the lowest p-value (highest t- statistic), data snooping is likely to have occurred.<\/p>","qhtml":"<div class=\"pp-topic\">Backtesting and Simulation<\/div><div class=\"qtext\"><p>An analyst is launching a new portfolio that uses an equity investment strategy based on a multifactor approach. The analyst has identified five fundamental factors and has conducted backtests on different strategies using point-in-time data adjusted for reporting lags and data revisions. Without considering prior inference, the analyst focuses on the statistical results and selects the strategy with the lowest p-value. This approach:<\/p><\/div>","subj":"portfolio"},{"n":85,"q":"Data snooping is best mitigated by:","opts":["performing cross-validation.","employing point-in-time data.","using revised macroeconomic data."],"ans":"A","expl":"A is Correct because cross-validation is a technique to detect and mitigate data snooping by partitioning the dataset into training data and testing data (i.e., “validation data”) and testing a model built from the training data on the validation data. Cross-validation splits data into two sets, such as different geographic regions or time periods, and then tests one set against the other to confirm the validity of an inference.","explhtml":"<p>A is Correct because cross-validation is a technique to detect and mitigate data snooping by partitioning the dataset into training data and testing data (i.e., “validation data”) and testing a model built from the training data on the validation data. Cross-validation splits data into two sets, such as different geographic regions or time periods, and then tests one set against the other to confirm the validity of an inference.<\/p>","qhtml":"<div class=\"pp-topic\">Backtesting and Simulation<\/div><div class=\"qtext\"><p>Data snooping is best mitigated by:<\/p><\/div>","subj":"portfolio"},{"n":86,"q":"A type of backtesting that explores the performance and risk of an investment strategy in different structural regimes and at structural breaks is best described as:","opts":["historical simulation.","multifactor modeling.","historical scenario analysis."],"ans":"C","expl":"C is Correct because historical scenario analysis is a type of backtesting that explores the performance and risk of an investment strategy in different structural regimes and at structural breaks.","explhtml":"<p>C is Correct because historical scenario analysis is a type of backtesting that explores the performance and risk of an investment strategy in different structural regimes and at structural breaks.<\/p>","qhtml":"<div class=\"pp-topic\">Backtesting and Simulation<\/div><div class=\"qtext\"><p>A type of backtesting that explores the performance and risk of an investment strategy in different structural regimes and at structural breaks is best described as:<\/p><\/div>","subj":"portfolio"},{"n":87,"q":"The Monte Carlo simulation approach:","opts":["requires bootstrapping from the past record of asset returns.","samples from an assumed multivariate distribution that is calibrated using historical returns.","overestimates true downside risk if a multivariate normal distribution is assumed but actual returns are negatively skewed."],"ans":"B","expl":"B is Correct because Monte Carlo simulation randomly samples from an assumed multivariate joint probability distribution (e.g., normal or another type of distribution), in a manner that the past record of asset returns is used to calibrate the parameters of the multivariate distribution.","explhtml":"<p>B is Correct because Monte Carlo simulation randomly samples from an assumed multivariate joint probability distribution (e.g., normal or another type of distribution), in a manner that the past record of asset returns is used to calibrate the parameters of the multivariate distribution.<\/p>","qhtml":"<div class=\"pp-topic\">Backtesting and Simulation<\/div><div class=\"qtext\"><p>The Monte Carlo simulation approach:<\/p><\/div>","subj":"portfolio"},{"n":88,"q":"Monte Carlo simulation:","opts":["randomly selects returns from various historical periods.","involves assigning each key variable a statistical distribution.","assumes that past asset returns provide guidance about future asset returns."],"ans":"B","expl":"B is Correct because in Monte Carlo simulation, each key variable is assigned a statistical distribution, and observations are drawn at random from the assigned distribution. The Monte Carlo approach is popular because it is highly flexible; an array of different distributions can be used across a variety of key variables.","explhtml":"<p>B is Correct because in Monte Carlo simulation, each key variable is assigned a statistical distribution, and observations are drawn at random from the assigned distribution. The Monte Carlo approach is popular because it is highly flexible; an array of different distributions can be used across a variety of key variables.<\/p>","qhtml":"<div class=\"pp-topic\">Backtesting and Simulation<\/div><div class=\"qtext\"><p>Monte Carlo simulation:<\/p><\/div>","subj":"portfolio"},{"n":89,"q":"The Monte Carlo simulation method:","opts":["uses regression and distribution-fitting techniques to estimate distributional parameter inputs.","employs bootstrapping so that the number of simulations is independent of the size of the historical dataset.","requires the decision whether to sample from the record of past returns with replacement or without replacement."],"ans":"A","expl":"A is Correct because with Monte Carlo simulation, regression and distribution- fitting techniques are used to estimate the parameters (i.e., mean, standard deviation, skewness, kurtosis) underlying the statistical distributions of the key decision variables. This step is typically called model calibration.","explhtml":"<p>A is Correct because with Monte Carlo simulation, regression and distribution- fitting techniques are used to estimate the parameters (i.e., mean, standard deviation, skewness, kurtosis) underlying the statistical distributions of the key decision variables. This step is typically called model calibration.<\/p>","qhtml":"<div class=\"pp-topic\">Backtesting and Simulation<\/div><div class=\"qtext\"><p>The Monte Carlo simulation method:<\/p><\/div>","subj":"portfolio"},{"n":90,"q":"An analyst uses Monte Carlo simulation to measure Conditional Value at Risk (CVaR) on a model that is calibrated to a multivariate Student’s t-distribution. The model is complex and several factors have limited historical data. The model most likely has:","opts":["low estimation error.","high specification error.","the ability to accommodate skewness and excess kurtosis in factor return data."],"ans":"C","expl":"C is Correct because the analyst has specified a multivariate Student’s t- distribution for the model. The [multivariate] Student’s t-distribution is a natural extension of the multivariate normal distribution, because it has the ability to account for the skewness and the excess kurtosis often observed in factor and asset return data.","explhtml":"<p>C is Correct because the analyst has specified a multivariate Student’s t- distribution for the model. The [multivariate] Student’s t-distribution is a natural extension of the multivariate normal distribution, because it has the ability to account for the skewness and the excess kurtosis often observed in factor and asset return data.<\/p>","qhtml":"<div class=\"pp-topic\">Backtesting and Simulation<\/div><div class=\"qtext\"><p>An analyst uses Monte Carlo simulation to measure Conditional Value at Risk (CVaR) on a model that is calibrated to a multivariate Student’s t-distribution. The model is complex and several factors have limited historical data. The model most likely has:<\/p><\/div>","subj":"portfolio"},{"n":91,"q":"Which of the following steps is performed in a Monte Carlo simulation but not in an historical simulation?","opts":["Generation of random numbers from a distribution","Selection of a statistical distribution for key decision variables","Plot of distributions for both benchmark and risk parity simulated portfolios"],"ans":"C","expl":"C is Correct because only the Monte Carlo simulation uses various distributions for key variables. An important issue with historical simulation is that the data are limited to historical observations, which may not represent the future. This deficiency can be addressed with Monte Carlo simulation, which follows similar steps as historical simulation but with a few key differences. First, we need to specify a functional form for each key decision variable. Exploratory data analysis— focusing on moments (i.e., mean, standard deviation, skewness, kurtosis) and tail dependence—is often crucial here. The usefulness of the Monte Carlo simulation technique critically depends on whether the functional form of the statistical distribution that we specify accurately reflects the true distribution of the underlying data. Because the data’s true distribution is unknown, we need to be aware of the fact that our model, like all models, only provides guidance and will not be perfect.","explhtml":"<p>C is Correct because only the Monte Carlo simulation uses various distributions for key variables. An important issue with historical simulation is that the data are limited to historical observations, which may not represent the future. This deficiency can be addressed with Monte Carlo simulation, which follows similar steps as historical simulation but with a few key differences. First, we need to specify a functional form for each key decision variable. Exploratory data analysis— focusing on moments (i.e., mean, standard deviation, skewness, kurtosis) and tail dependence—is often crucial here. The usefulness of the Monte Carlo simulation technique critically depends on whether the functional form of the statistical distribution that we specify accurately reflects the true distribution of the underlying data. Because the data’s true distribution is unknown, we need to be aware of the fact that our model, like all models, only provides guidance and will not be perfect.<\/p>","qhtml":"<div class=\"pp-topic\">Backtesting and Simulation<\/div><div class=\"qtext\"><p>Which of the following steps is performed in a Monte Carlo simulation but not in an historical simulation?<\/p><\/div>","subj":"portfolio"},{"n":92,"q":"An investor wants to determine the sensitivity of returns of the benchmark and risk parity portfolios. The investor performs two different Monte Carlo simulations: Compared to Simulation 1, which of the following is most likely an advantage of Simulation 2?","opts":["Simulation 2 requires fewer parameters to be estimated from historical data","Simulation 2 significantly reduces the number of required steps in the Monte Carlo simulation process","Simulation 2 can account for skewness and excess kurtosis often observed in factor and asset return data"],"ans":"C","expl":"C is Correct because Simulation 2, which uses the Student’s t-distribution, is a natural extension of the multivariate normal distribution because it has the ability to account for the skewness and the excess kurtosis often observed in factor and asset return data.","explhtml":"<p>C is Correct because Simulation 2, which uses the Student’s t-distribution, is a natural extension of the multivariate normal distribution because it has the ability to account for the skewness and the excess kurtosis often observed in factor and asset return data.<\/p>","qhtml":"<div class=\"pp-topic\">Backtesting and Simulation<\/div><div class=\"qtext\"><p>An investor wants to determine the sensitivity of returns of the benchmark and risk parity portfolios. The investor performs two different Monte Carlo simulations:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp227.webp\" style=\"max-width:min(100%,630px)\" alt=\"\"><p>Compared to Simulation 1, which of the following is most likely an advantage of Simulation 2?<\/p><\/div>","subj":"portfolio"},{"n":93,"q":"A portfolio manager is backtesting a multifactor investment strategy and performs additional sensitivity analyses using two Monte Carlo simulations with different factor return assumptions: In comparison to Simulation 2, Simulation 1 most likely:","opts":["allows estimating a smaller number of parameters.","requires fewer steps in the Monte Carlo simulation process.","accounts for skewness and excess kurtosis observed in the factor return data."],"ans":"A","expl":"A is Correct because simulation 1 [multivariate normal distribution] allows estimating a smaller number of parameters than Simulation 2 [multivariate Student’s t-distribution]. The multivariate Student’s t-distribution is a natural extension of the multivariate normal distribution. It is mathematically more complex, however, and requires estimating a larger number of parameters than a normal distribution.","explhtml":"<p>A is Correct because simulation 1 [multivariate normal distribution] allows estimating a smaller number of parameters than Simulation 2 [multivariate Student’s t-distribution]. The multivariate Student’s t-distribution is a natural extension of the multivariate normal distribution. It is mathematically more complex, however, and requires estimating a larger number of parameters than a normal distribution.<\/p>","qhtml":"<div class=\"pp-topic\">Backtesting and Simulation<\/div><div class=\"qtext\"><p>A portfolio manager is backtesting a multifactor investment strategy and performs additional sensitivity analyses using two Monte Carlo simulations with different factor return assumptions:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/pp/pp228.webp\" style=\"max-width:min(100%,553px)\" alt=\"\"><p>In comparison to Simulation 2, Simulation 1 most likely:<\/p><\/div>","subj":"portfolio"}];
const CFG = {"title": "Portfolio Management — Practice Pack", "subtitle": "CFA Level II · 93 câu · EdZeb", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
