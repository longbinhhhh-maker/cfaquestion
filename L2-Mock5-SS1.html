<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

const DATA = [{"n":1,"q":"Is the use of the Durbin Watson statistic in Weatherford's silver regression appropriate and, if so, how should it be interpreted?","opts":["No.","Yes, and it appears that the error terms are serially correlated.","Yes, and it appears that the error terms are not serially correlated."],"ans":"A","expl":"The use of the Durbin-Watson statistic is inappropriate in an autoregressive regression, which is what Weatherford is using. The Durbin-Watson statistic is appropriate for trend models, but not autoregressive models. To determine whether the errors terms are serially correlated in an autoregressive model, the significance of the autocorrelations should be tested using the t-statistic. (Module 2.2, LOS 2.e)","explhtml":"<p>The use of the Durbin-Watson statistic is inappropriate in an autoregressive regression, which is what Weatherford is using. The Durbin-Watson statistic is appropriate for trend models, but not autoregressive models. To determine whether the errors terms are serially correlated in an autoregressive model, the significance of the autocorrelations should be tested using the t-statistic. (Module 2.2, LOS 2.e)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>Joan Fisher and Kim Weatherford are economists responsible for modeling security returns for Quincy Portfolio Managers, which is located in the southwestern United States. Fisher is the firm&#x27;s chief economist and Weatherford is her assistant.<\/p><p>In addition to financial assets, Quincy Portfolio Managers also recommends the use of commodities as a portfolio diversifier. Weatherford has been examining price indices for silver in an attempt to determine whether silver returns are predictable. As an initial step, she uses an autoregressive first-order regression model on daily price data for silver over the past two years. The plot of the raw data and t \"tbl\"><table><tr><td>Multiple R<\/td><td>0.09<\/td><\/tr><tr><td>R-Square<\/td><td>0.01<\/td><\/tr><tr><td>Adjusted R-Square<\/td><td>0.01<\/td><\/tr><tr><td>Standard Error<\/td><td>123.95<\/td><\/tr><tr><td>Observations<\/td><td>520.00<\/td><\/tr><\/table><\/div><p>ANOVA<\/p><div class=\"tbl\"><table><tr><td>df<\/td><td>SS<\/td><td>MS<\/td><td>F<\/td><td>Significance F<\/td><td><\/td><\/tr><tr><td>Regression<\/td><td>1.00<\/td><td>66,742<\/td><td>66,742<\/td><td>4.34<\/td><td>0.04<\/td><\/tr><tr><td>Residual<\/td><td>518.00<\/td><td>7,958,144<\/td><td>15,363<\/td><td><\/td><td><\/td><\/tr><tr><td>Total<\/td><td>519.00<\/td><td>8,024,887<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Coefficients<\/td><td>Standard Error<\/td><td>t-Stat<\/td><td>P-value<\/td><td><\/td><td><\/td><\/tr><tr><td>Intercept<\/td><td>2.00<\/td><td>5.44<\/td><td>0.37<\/td><td>0.71<\/td><td><\/td><\/tr><tr><td>Slope<\/td><td>–0.09<\/td><td>0.04<\/td><td>–2.08<\/td><td>0.04<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Is the use of the Durbin Watson statistic in Weatherford&#x27;s silver regression appropriate and, if so, how should it be interpreted?<\/p><\/div>","subj":"quant"},{"n":2,"q":"Which of the following are the most likely problem in Weatherford's silver regression and the most appropriate test for it?\nProblem | Test","opts":["Multicollinearity Breusch-Pagan","Multicollinearity Dickey-Fuller","Nonstationary data Dickey-Fuller"],"ans":"C","expl":"Weatherford is using an autoregressive first-order regression model in which this period's silver price is regressed on the previous period's price. The regression is of the form:\nXt = b0 + b1Xt–1\nThe most likely problem in this regression is that the data is not covariance stationary. In the plot of the data, the mean of the data does not appear to be constant (it is much higher in the middle period). The estimate of the lag one slope coefficient is close to 1.0, which also suggests that the data is nonstationary. To definitively test this, the Dickey-Fuller test should be used, where the null hypothesis is that b1 – 1 is equal to zero. If the null hypothesis is not rejected, we say that the data has a unit root and is nonstationary. (Module 2.3, LOS 2.j)","explhtml":"<p>Weatherford is using an autoregressive first-order regression model in which this period&#x27;s silver price is regressed on the previous period&#x27;s price. The regression is of the form:<\/p><p>Xt = b0 + b1Xt–1<\/p><p>The most likely problem in this regression is that the data is not covariance stationary. In the plot of the data, the mean of the data does not appear to be constant (it is much higher in the middle period). The estimate of the lag one slope coefficient is close to 1.0, which also suggests that the data is nonstationary. To definitively test this, the Dickey-Fuller test should be used, where the null hypothesis is that b1 – 1 is equal to zero. If the null hypothesis is not rejected, we say that the data has a unit root and is nonstationary. (Module 2.3, LOS 2.j)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Joan Fisher and Kim Weatherford are economists responsible for modeling security returns for Quincy Portfolio Managers, which is located in the southwestern United States. Fisher is the firm&#x27;s chief economist and Weatherford is her assistant.<\/p><p>In addition to financial assets, Quincy Portfolio Managers also recommends the use of commodities as a portfolio diversifier. Weatherford has been examining price indices for silver in an attempt to determine whether silver returns are predictable. As an initial step, she uses an autoregressive first-order regression model on daily price data for silver over the past two years. The plot of the raw data and the results of the regression are shown in  Exhibit 1: Time Series of Silver Prices and  Exhibit 2: Silver Price Regression Results.<\/p><p>Exhibit 1: Time Series of Silver Prices<\/p><img class=\"pimg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAlgCWAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wgARCAFRAgMDAREAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAQBBQIGAwf/xAAZAQEAAwEBAAAAAAAAAAAAAAAAAQMEAgX/2gAMAwEAAhADEAAAAfqgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAKNCwDYsAAAAAAAAAAAAAAAAAAAAAAAAAAAAAwZyp5mp0ZmzxNgAAAAAAAAAAAAAAAAAAAAAAAAAUSyQUWUQjHGgJ5NPEmAAAAAAAAAAAAAAAAAAAAAAAAAAAFIQSpNlAs8zwJgAAAAAAAAAAAAAAAAAAAAAAAAAABpEQ7OJXHXq6AA8jwJgAAAAAAAAAAAAAAAAAAAAAAAAAAB4uMFoxzqtGS4vFAs1PAmAAAAAAAAAAAAAAAAAAAAAAAAAAAGiOe0YclVp9OLuDPMHSmbIhLAAAAAAAAAAAAANDcAAAAAAAAAAAAkHsanL6POzFev2rugHiCcSzxJgAAAAAAAAAAAAKONOyLAAAAAAAAAAAKLNjQ53RgyNWrJ8WgAeR4kwAAAAAAAAAAAAGh8jPrpsAAAAAAAAAAAADWHN6/Py+fZP5sAA8jwJgAAAAAAAAAAAAPI+Nn2c2AAAAAAAAAAAABryxt1E7iz0jvU1LLKPAmAAAAAAAAAAAAA8DhD6AbAAAAAAAAAAAAA1c81qxZKnSru4U9DQ6YzZDJgAAAAAAAAAAABqY8+fH0M9yQWAAAAAAAAAAUST1NUcxow5mrTJ4uxZ4gnEo8SaAAAAAAAAAAAAeZ8lOhJRjz6CbAAAAAAAAAAFGxZqjA35cnVdN5tAA8TxJgAAAAAAAAAAABqfAT7GcoZI6QnHoAAAAAAAAAAAanP6MeWqvl8W2ADyPAmAAAAAAAAAAAAA+GH2Q4M6k5A+ikwAAAAAAAAAAA0hy2jzc1XryHF9FA2NDwJgAAAAAAAAAAABFOUOyBzBhTrDMAAAAAAAAAAAGrnn9GORVdP40cCUDozLEQlgAAAAAAAAAAAGKJJMBzhGPU6cAAAAAAAAAAlnsaw5/ViylN+/F2OPI1MiTDxJgAAAAAAAAAAABhDJEkGp5HIHbAAAAAAAAAAoFmkRy+vDmaNGS4vAA8jwJgAAAAAAAAAAAKOeOgNgAc6dEAAAAAAAAAAAaRHM68OVo0ZTi8ADyPAmAAAAAAAAAAAAo4w7E3AKOeOhLAAAAAB5HoWAAADSI5vVhydOjJ8X2AUeR4kwAAAAAAAAAAAHkc0dSWAUcMDuSwAAAAaHBHSGWPYAAA8XOEvzT67fTi7iTyKOhMwRCYAAAAAAAAAACjyMCZklgAo4YmnVmwAAAAIJ89M8RzqQTTcEo9zSIwt2WfxdfFuKlqUZEnHiTAAAAAAAAAYUyBoSTY5cnmbAAKORJZmSUWUQSWeRuegKOaM2TDU5kwZZ1JmSyzRHP35Mjxfkq7aALPI8CYAAAAAAAAUfNCIZM0M2anXAAAoxpxJFPp56A488CGSTQyhqep0pYNTxPQ5sgnVEw8J4wF+XLU6chzYAB5HgTAAAAAAAAUanyw7czoNgAAAAfLzKGJPohIOAOlMoRD3JBqSSwAAcmex0pZGnnmNGPpKNUvmyigWeZ4kwAAAA tr><tr><td>R-Square<\/td><td>0.01<\/td><\/tr><tr><td>Adjusted R-Square<\/td><td>0.01<\/td><\/tr><tr><td>Standard Error<\/td><td>123.95<\/td><\/tr><tr><td>Observations<\/td><td>520.00<\/td><\/tr><\/table><\/div><p>ANOVA<\/p><div class=\"tbl\"><table><tr><td>df<\/td><td>SS<\/td><td>MS<\/td><td>F<\/td><td>Significance F<\/td><td><\/td><\/tr><tr><td>Regression<\/td><td>1.00<\/td><td>66,742<\/td><td>66,742<\/td><td>4.34<\/td><td>0.04<\/td><\/tr><tr><td>Residual<\/td><td>518.00<\/td><td>7,958,144<\/td><td>15,363<\/td><td><\/td><td><\/td><\/tr><tr><td>Total<\/td><td>519.00<\/td><td>8,024,887<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Coefficients<\/td><td>Standard Error<\/td><td>t-Stat<\/td><td>P-value<\/td><td><\/td><td><\/td><\/tr><tr><td>Intercept<\/td><td>2.00<\/td><td>5.44<\/td><td>0.37<\/td><td>0.71<\/td><td><\/td><\/tr><tr><td>Slope<\/td><td>–0.09<\/td><td>0.04<\/td><td>–2.08<\/td><td>0.04<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following are the most likely problem in Weatherford&#x27;s silver regression and the most appropriate test for it?<\/p><div class=\"tbl\"><table><tr><td>Problem<\/td><td>Test<\/td><\/tr><\/table><\/div><\/div>","subj":"quant"},{"n":3,"q":"To best model the silver price data using an autoregressive first-order regression model, Weatherford should use:","opts":["first differences of the data.","the actual silver price levels.","the predicted silver price levels."],"ans":"A","expl":"Weatherford should use the first differences of the data in the regression. That is, instead of using the actual price levels, she should use the change in the data rather than levels:\nYt = Xt – Xt–1 Then, the appropriate regression will be:\nYt = b0 + b1Yt–1 The transformed time series data will have a mean-reverting level and be covariance stationary. (Module 2.3, LOS 2.j)","explhtml":"<p>Weatherford should use the first differences of the data in the regression. That is, instead of using the actual price levels, she should use the change in the data rather than levels:<\/p><p>Yt = Xt – Xt–1 Then, the appropriate regression will be:<\/p><p>Yt = b0 + b1Yt–1 The transformed time series data will have a mean-reverting level and be covariance stationary. (Module 2.3, LOS 2.j)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Joan Fisher and Kim Weatherford are economists responsible for modeling security returns for Quincy Portfolio Managers, which is located in the southwestern United States. Fisher is the firm&#x27;s chief economist and Weatherford is her assistant.<\/p><p>In addition to financial assets, Quincy Portfolio Managers also recommends the use of commodities as a portfolio diversifier. Weatherford has been examining price indices for silver in an attempt to determine whether silver returns are predictable. As an initial step, she uses an autoregressive first-order regression model on daily price data for silver over the past two years. The plot of the raw data and the results of the regression are shown in  Exhibit 1: Time Series of Silver Prices and  Exhibit 2: Silver Price Regression Results.<\/p><p>Exhibit 1: Time Series of Silver Prices<\/p><img class=\"pimg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAlgCWAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wgARCAFRAgMDAREAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAQBBQIGAwf/xAAZAQEAAwEBAAAAAAAAAAAAAAAAAQMEAgX/2gAMAwEAAhADEAAAAfqgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAKNCwDYsAAAAAAAAAAAAAAAAAAAAAAAAAAAAAwZyp5mp0ZmzxNgAAAAAAAAAAAAAAAAAAAAAAAAAUSyQUWUQjHGgJ5NPEmAAAAAAAAAAAAAAAAAAAAAAAAAAAFIQSpNlAs8zwJgAAAAAAAAAAAAAAAAAAAAAAAAAABpEQ7OJXHXq6AA8jwJgAAAAAAAAAAAAAAAAAAAAAAAAAAB4uMFoxzqtGS4vFAs1PAmAAAAAAAAAAAAAAAAAAAAAAAAAAAG d>0.37<\/td><td>0.71<\/td><td><\/td><\/tr><tr><td>Slope<\/td><td>–0.09<\/td><td>0.04<\/td><td>–2.08<\/td><td>0.04<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>To best model the silver price data using an autoregressive first-order regression model, Weatherford should use:<\/p><\/div>","subj":"quant"},{"n":4,"q":"Using the data for the gold regression, what is the mean-reverting level and what is the two-step-ahead forecast if the current value of the independent variable is –0.80?\nTwo-step-ahead Mean-reverting level forecast","opts":["1.83 1.75","1.83 1.81","2.07 1.75"],"ans":"B","expl":"To determine the mean-reverting level, we divide the intercept by one minus the slope coefficient:\nb0 | 2.00\nmean-reverting level = | = | = 1.83\n1−b1 | 1−(−0.09)\nThe one-step-ahead predicted value is calculated by substituting the current value into the regression equation:\nˆy | = b0 + b1 (y) = 2.00 + (−0.09) (−0.80) = 2.072\nt+1 | t\nThe two-step-ahead predicted value is then calculated by substituting the one-step-ahead predicted value into the regression equation:\nˆyt+2= b0 + b1 (ˆyt+1) = 2.00 + (−0.09) (2.072) = 1.81\n(Module 2.2, LOS 2.d)","explhtml":"<p>To determine the mean-reverting level, we divide the intercept by one minus the slope coefficient:<\/p><div class=\"tbl\"><table><tr><td>b0<\/td><td>2.00<\/td><td><\/td><\/tr><tr><td>mean-reverting level =<\/td><td>=<\/td><td>= 1.83<\/td><\/tr><tr><td>1−b1<\/td><td>1−(−0.09)<\/td><td><\/td><\/tr><\/table><\/div><p>The one-step-ahead predicted value is calculated by substituting the current value into the regression equation:<\/p><div class=\"tbl\"><table><tr><td>ˆy<\/td><td>= b0 + b1 (y) = 2.00 + (−0.09) (−0.80) = 2.072<\/td><\/tr><tr><td>t+1<\/td><td>t<\/td><\/tr><\/table><\/div><p>The two-step-ahead predicted value is then calculated by substituting the one-step-ahead predicted value into the regression equation:<\/p><p>ˆyt+2= b0 + b1 (ˆyt+1) = 2.00 + (−0.09) (2.072) = 1.81<\/p><p>(Module 2.2, LOS 2.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Joan Fisher and Kim Weatherford are economists responsible for modeling security returns for Quincy Portfolio Managers, which is located in the southwestern United States. Fisher is the firm&#x27;s chief economist and Weatherford is her assistant.<\/p><p>In addition to financial assets, Quincy Portfolio Managers also recommends the use of commodities as a portfolio diversifier. Weatherford has been examining price indices for silver in an attempt to determine whether silver returns are predictable. As an initial step, she uses an autoregressive first-order regression model on daily price data for silver over the past two years. The plot of the raw data and the results of the regression are shown in  Exhibit 1: Time Series of Silver Prices and  Exhibit 2: Silver Price Regression Results.<\/p><p>Exhibit 1: Time Series of Silver Prices<\/p><img class=\"pimg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAlgCWAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wgARCAFRAgMDAREAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAQBBQIGAwf/xAAZAQEAAwEBAAAAAAAAAAAAAAAAAQMEAgX/2gAMAwEAAhADEAAAAfqgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAKNCwDYsAAAAAAAAAAAAAAAAAAAAAAAAAAAAAwZyp5mp0ZmzxNgAAAAAAAAAAAAAAAAAAAAAAAAAUSyQUWUQjHGgJ5NPEmAAAAAAAAAAAAAAAAAAAAAAAAAAAFIQSpNlAs8zwJgAAAAAAAAAAAAAAAAAAAAAAAAAABpEQ7OJXHXq6AA8jwJgAAAAAAAAAAAAAAAAAAAAAAAAAAB4uMFoxzqtGS4vFAs1PAmAAAAAAAAAAAAAAAAAAAAAAAAAAAGiOe0YclVp9OLuDPMHSmbIhLAAAAAAAAAAAAANDcAAAAAAAAAAAAkHsanL6POzFev2rugHiCcSzxJgAAAAAAAAAAAAKONOyLAAAAAAAAAAAKLNjQ53RgyNWrJ8WgAeR4kwAAAAAAAAAAAAGh8jPrpsAAAAAAAAAAAADWHN6/Py+fZP5sAA8jwJgAAAAAAAAAAAAPI+Nn2c2AAAAAAAAAAAABryxt1E7iz0jvU1LLKPAmAAAAAAAAAAAAA8DhD6Ab ting level and what is the two-step-ahead forecast if the current value of the independent variable is –0.80?<\/p><p>Two-step-ahead Mean-reverting level forecast<\/p><\/div>","subj":"quant"},{"n":5,"q":"According to relative purchasing power parity, the expected JPY/EUR spot rate two years from now is closest to:","opts":["150.","158.","183."],"ans":"A","expl":"We must start by calculating the JPY/EUR spot rate. This is a simple algebra problem. We know that the JPY/USD spot rate is 120 and the EUR/USD spot rate is 0.7224. Dividing JPY/USD by EUR/USD leaves us with JPY/EUR. Plugging in the numbers, we get a JPY/EUR spot rate of 166.113 (= 120 / 0.7224). Next, we estimate the JPY/EUR spot rate two years from now using the relative PPP formula (for two years), given that EUR inflation is expected to be 5% higher (per year) than JPY inflation:\n2 E(S1) = S0 × (1 – 0.05) = 166.113(0.95) = 149.92 | 2\n(Module 5.2, LOS 5.g)","explhtml":"<p>We must start by calculating the JPY/EUR spot rate. This is a simple algebra problem. We know that the JPY/USD spot rate is 120 and the EUR/USD spot rate is 0.7224. Dividing JPY/USD by EUR/USD leaves us with JPY/EUR. Plugging in the numbers, we get a JPY/EUR spot rate of 166.113 (= 120 / 0.7224). Next, we estimate the JPY/EUR spot rate two years from now using the relative PPP formula (for two years), given that EUR inflation is expected to be 5% higher (per year) than JPY inflation:<\/p><div class=\"tbl\"><table><tr><td><sup>2<\/sup> E(S1) = S0 × (1 – 0.05) = 166.113(0.95) = 149.92<\/td><td><sup>2<\/sup><\/td><\/tr><\/table><\/div><p>(Module 5.2, LOS 5.g)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Economics<\/summary><div class=\"vig-body\"><p>Barton Wilson, a junior analyst, is a new hire at a money center bank. He has been assigned to help Juanita Chevas, CFA, in the currency trading department. Together, Wilson and Chevas are working on the development of new trading software designed to detect profitable opportunities in the foreign exchange market. Obviously, they are interested in risk-free arbitrage opportunities. However, they have also been instructed to investigate the possibility of longer-term currency exposures that are not necessarily risk-free. To test the logic of their new software, Wilson gathers the following market data:<\/p><p>Spot JPY/USD exchange rate = 120.<\/p><p>Spot EUR/USD exchange rate = 0.7224.<\/p><p>U.S. risk-free interest rate = 7%.<\/p><p>Eurozone risk-free rate = 9.08%.<\/p><p>Japanese risk-free rate = 3.88%.<\/p><p>Yield curves in all three currencies are flat.<\/p><p>In addition to in-house currency transactions, the new software program is also intended to provide insight into currency exposure and hedging needs for the bank&#x27;s major customers. These customers typically include large multinational firms. Essentially, the bank wants to provide consulting services to its clients concerning which currency exposures offer the most lucrative opportunities. In this process, the bank will rely on deviations from international parity conditions as an indicator of long-term currency movements. Several bank customers have engaged in a carry trade with Bundovian Bunco (BU) as the investment currency and the USD as the funding currency. The bank will provide risk management advice to customers as it pertains to their FX carry trades.<\/p><p>Wilson obtains the following data from the econometrics department:<\/p><p>JPY/USD spot rate one year ago = 116.<\/p><p>EUR/USD spot rate one year ago = 0.7200.<\/p><p>Anticipated and historical U.S. annual inflation = 3%. Anticipated and historical Japanese annual inflation = 0%. Anticipated and historical eurozone annual inflation = 5%.<\/p><p>One of the bank&#x27;s major customers has significant business interests in Japan and in the eurozone and has long exposure to both currencies. The customer has traditionally hedged all currency risk. However, the customer&#x27;s new risk manager has decided to leave some currency exposure unhedged in an attempt to profit from long-term currency exposure.<\/p><\/div><\/details><div class=\"qtext\"><p>According to relative purchasing power parity, the expected JPY/EUR spot rate two years from now is closest to:<\/p><\/div>","subj":"economics"},{"n":6,"q":"Are the Japanese and eurozone inflation forecasts provided by the econometrics department consistent with the inflation rates implied by the international Fisher relation, given a U.S. inflation rate of 3%?","opts":["Both forecasts are consistent.","Neither forecast is consistent.","One forecast is consistent and the other is not."],"ans":"B","expl":"Using the international Fisher relation, we can solve for the inflation forecasts in Japan and Europe, given interest rate differentials and the U.S. inflation forecast: R nominalA – R nominalB = E(inflationA) – E(inflationB) For Japan: 7.00% – 3.88% ≠ 3% – 0% For eurozone: 9.08% – 7.00% ≠ 5% – 3% Both implied inflation rates are inconsistent with the forecasts from the econometrics department. (Module 5.2, LOS 5.e)","explhtml":"<p>Using the international Fisher relation, we can solve for the inflation forecasts in Japan and Europe, given interest rate differentials and the U.S. inflation forecast: R nominalA – R nominalB = E(inflationA) – E(inflationB) For Japan: 7.00% – 3.88% ≠ 3% – 0% For eurozone: 9.08% – 7.00% ≠ 5% – 3% Both implied inflation rates are inconsistent with the forecasts from the econometrics department. (Module 5.2, LOS 5.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Barton Wilson, a junior analyst, is a new hire at a money center bank. He has been assigned to help Juanita Chevas, CFA, in the currency trading department. Together, Wilson and Chevas are working on the development of new trading software designed to detect profitable opportunities in the foreign exchange market. Obviously, they are interested in risk-free arbitrage opportunities. However, they have also been instructed to investigate the possibility of longer-term currency exposures that are not necessarily risk-free. To test the logic of their new software, Wilson gathers the following market data:<\/p><p>Spot JPY/USD exchange rate = 120.<\/p><p>Spot EUR/USD exchange rate = 0.7224.<\/p><p>U.S. risk-free interest rate = 7%.<\/p><p>Eurozone risk-free rate = 9.08%.<\/p><p>Japanese risk-free rate = 3.88%.<\/p><p>Yield curves in all three currencies are flat.<\/p><p>In addition to in-house currency transactions, the new software program is also intended to provide insight into currency exposure and hedging needs for the bank&#x27;s major customers. These customers typically include large multinational firms. Essentially, the bank wants to provide consulting services to its clients concerning which currency exposures offer the most lucrative opportunities. In this process, the bank will rely on deviations from international parity conditions as an indicator of long-term currency movements. Several bank customers have engaged in a carry trade with Bundovian Bunco (BU) as the investment currency and the USD as the funding currency. The bank will provide risk management advice to customers as it pertains to their FX carry trades.<\/p><p>Wilson obtains the following data from the econometrics department:<\/p><p>JPY/USD spot rate one year ago = 116.<\/p><p>EUR/USD spot rate one year ago = 0.7200.<\/p><p>Anticipated and historical U.S. annual inflation = 3%. Anticipated and historical Japanese annual inflation = 0%. Anticipated and historical eurozone annual inflation = 5%.<\/p><p>One of the bank&#x27;s major customers has significant business interests in Japan and in the eurozone and has long exposure to both currencies. The customer has traditionally hedged all currency risk. However, the customer&#x27;s new risk manager has decided to leave some currency exposure unhedged in an attempt to profit from long-term currency exposure.<\/p><\/div><\/details><div class=\"qtext\"><p>Are the Japanese and eurozone inflation forecasts provided by the econometrics department consistent with the inflation rates implied by the international Fisher relation, given a U.S. inflation rate of 3%?<\/p><\/div>","subj":"economics"},{"n":7,"q":"According to the uncovered interest rate parity, in 12 months, the JPY/USD exchange rate would most likely be closest to:","opts":["116.","118.","124."],"ans":"A","expl":"Uncovered interest rate parity forecast:\nU.S. interest rate is higher by 7% – 3.88% = 3.12% 120 × (1 – 0.0312) = 116.26 (Module 5.2, LOS 5.g)","explhtml":"<p>Uncovered interest rate parity forecast:<\/p><p>U.S. interest rate is higher by 7% – 3.88% = 3.12% 120 × (1 – 0.0312) = 116.26 (Module 5.2, LOS 5.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Barton Wilson, a junior analyst, is a new hire at a money center bank. He has been assigned to help Juanita Chevas, CFA, in the currency trading department. Together, Wilson and Chevas are working on the development of new trading software designed to detect profitable opportunities in the foreign exchange market. Obviously, they are interested in risk-free arbitrage opportunities. However, they have also been instructed to investigate the possibility of longer-term currency exposures that are not necessarily risk-free. To test the logic of their new software, Wilson gathers the following market data:<\/p><p>Spot JPY/USD exchange rate = 120.<\/p><p>Spot EUR/USD exchange rate = 0.7224.<\/p><p>U.S. risk-free interest rate = 7%.<\/p><p>Eurozone risk-free rate = 9.08%.<\/p><p>Japanese risk-free rate = 3.88%.<\/p><p>Yield curves in all three currencies are flat.<\/p><p>In addition to in-house currency transactions, the new software program is also intended to provide insight into currency exposure and hedging needs for the bank&#x27;s major customers. These customers typically include large multinational firms. Essentially, the bank wants to provide consulting services to its clients concerning which currency exposures offer the most lucrative opportunities. In this process, the bank will rely on deviations from international parity conditions as an indicator of long-term currency movements. Several bank customers have engaged in a carry trade with Bundovian Bunco (BU) as the investment currency and the USD as the funding currency. The bank will provide risk management advice to customers as it pertains to their FX carry trades.<\/p><p>Wilson obtains the following data from the econometrics department:<\/p><p>JPY/USD spot rate one year ago = 116.<\/p><p>EUR/USD spot rate one year ago = 0.7200.<\/p><p>Anticipated and historical U.S. annual inflation = 3%. Anticipated and historical Japanese annual inflation = 0%. Anticipated and historical eurozone annual inflation = 5%.<\/p><p>One of the bank&#x27;s major customers has significant business interests in Japan and in the eurozone and has long exposure to both currencies. The customer has traditionally hedged all currency risk. However, the customer&#x27;s new risk manager has decided to leave some currency exposure unhedged in an attempt to profit from long-term currency exposure.<\/p><\/div><\/details><div class=\"qtext\"><p>According to the uncovered interest rate parity, in 12 months, the JPY/USD exchange rate would most likely be closest to:<\/p><\/div>","subj":"economics"},{"n":8,"q":"Based on the assumption that international parity conditions will hold in the long run, should the JPY and euro currency exposures of the bank's major customer be left unhedged?","opts":["Both currencies should be left unhedged.","Neither currency should be left unhedged.","One currency should be left unhedged and the other should not."],"ans":"C","expl":"This question requires you to look at deviations from international parity conditions and then determine whether those deviations will tend to work to the advantage of the customer. In this problem, you are given the necessary information to examine parity conditions using relative purchasing power parity (RPPP). For the JPY, RPPP tells us that, because the spot rate one year ago was 116 and U.S. inflation was 3% higher than Japan's, the spot rate today should be:\nStoday(assuming RPPP held) = Slast year (1 − 0.03) = 116(0.97) = 112.52\nBecause the expected spot rate today, based on RPPP (i.e., 112.52), is not equal to the actual spot rate today (i.e., 120), RPPP did not hold over the past year. Because the actual rate is higher than the rate forecast by RPPP, the long-term trend based on deviations from international parity conditions will be for the rate to fall and the JPY to appreciate. Hence, using deviations from parity conditions as indicators of future currency movements, the bank should recommend that the JPY exposure be left unhedged.\nUsing the same RPPP process for the EUR exposure, we can calculate an RPPP spot rate today of 0.7340 (given that the rate was 0.72 one year ago and that U.S. inflation was lower by 2%):\nStoday(assuming RPPP held) = Slast year (1 + 0.02) = 0.72(1.02) = 0.7344\nAgain, RPPP did not hold (i.e., the actual rate today, 0.7224, is not equal to the RPPP rate that should exist today given the inflation rates). However, for the EUR case, the RPPP expected spot is higher than the actual spot, indicating that the EUR may be currently overvalued and, thus, more likely to depreciate in the future. EUR exposure should be hedged. (Module 5.2, LOS 5.g)","explhtml":"<p>This question requires you to look at deviations from international parity conditions and then determine whether those deviations will tend to work to the advantage of the customer. In this problem, you are given the necessary information to examine parity conditions using relative purchasing power parity (RPPP). For the JPY, RPPP tells us that, because the spot rate one year ago was 116 and U.S. inflation was 3% higher than Japan&#x27;s, the spot rate today should be:<\/p><p>Stoday(assuming RPPP held) = Slast year (1 − 0.03) = 116(0.97) = 112.52<\/p><p>Because the expected spot rate today, based on RPPP (i.e., 112.52), is not equal to the actual spot rate today (i.e., 120), RPPP did not hold over the past year. Because the actual rate is higher than the rate forecast by RPPP, the long-term trend based on deviations from international parity conditions will be for the rate to fall and the JPY to appreciate. Hence, using deviations from parity conditions as indicators of future currency movements, the bank should recommend that the JPY exposure be left unhedged.<\/p><p>Using the same RPPP process for the EUR exposure, we can calculate an RPPP spot rate today of 0.7340 (given that the rate was 0.72 one year ago and that U.S. inflation was lower by 2%):<\/p><p>Stoday(assuming RPPP held) = Slast year (1 + 0.02) = 0.72(1.02) = 0.7344<\/p><p>Again, RPPP did not hold (i.e., the actual rate today, 0.7224, is not equal to the RPPP rate that should exist today given the inflation rates). However, for the EUR case, the RPPP expected spot is higher than the actual spot, indicating that the EUR may be currently overvalued and, thus, more likely to depreciate in the future. EUR exposure should be hedged. (Module 5.2, LOS 5.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Barton Wilson, a junior analyst, is a new hire at a money center bank. He has been assigned to help Juanita Chevas, CFA, in the currency trading department. Together, Wilson and Chevas are working on the development of new trading software designed to detect profitable opportunities in the foreign exchange market. Obviously, they are interested in risk-free arbitrage opportunities. However, they have also been instructed to investigate the possibility of longer-term currency exposures that are not necessarily risk-free. To test the logic of their new software, Wilson gathers the following market data:<\/p><p>Spot JPY/USD exchange rate = 120.<\/p><p>Spot EUR/USD exchange rate = 0.7224.<\/p><p>U.S. risk-free interest rate = 7%.<\/p><p>Eurozone risk-free rate = 9.08%.<\/p><p>Japanese risk-free rate = 3.88%.<\/p><p>Yield curves in all three currencies are flat.<\/p><p>In addition to in-house currency transactions, the new software program is also intended to provide insight into currency exposure and hedging needs for the bank&#x27;s major customers. These customers typically include large multinational firms. Essentially, the bank wants to provide consulting services to its clients concerning which currency exposures offer the most lucrative opportunities. In this process, the bank will rely on deviations from international parity conditions as an indicator of long-term currency movements. Several bank customers have engaged in a carry trade with Bundovian Bunco (BU) as the investment currency and the USD as the funding currency. The bank will provide risk management advice to customers as it pertains to their FX carry trades.<\/p><p>Wilson obtains the following data from the econometrics department:<\/p><p>JPY/USD spot rate one year ago = 116.<\/p><p>EUR/USD spot rate one year ago = 0.7200.<\/p><p>Anticipated and historical U.S. annual inflation = 3%. Anticipated and historical Japanese annual inflation = 0%. Anticipated and historical eurozone annual inflation = 5%.<\/p><p>One of the bank&#x27;s major customers has significant business interests in Japan and in the eurozone and has long exposure to both currencies. The customer has traditionally hedged all currency risk. However, the customer&#x27;s new risk manager has decided to leave some currency exposure unhedged in an attempt to profit from long-term currency exposure.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the assumption that international parity conditions will hold in the long run, should the JPY and euro currency exposures of the bank&#x27;s major customer be left unhedged?<\/p><\/div>","subj":"economics"},{"n":9,"q":"The amount of goodwill resulting from Wayland's acquisition of Optimax is closest to:","opts":["$20,000.","$70,000.","$90,000."],"ans":"A","expl":"The excess of purchase price over the pro rata share of the book value of Optimax is allocated to PP&E. The remainder is goodwill.\nPurchase price (in thousands) | $300\nLess: Pro rata share of\n210 | [$600 Optimax book value × 35%]\nOptimax\nExcess of purchase price | 90 [($1,200 fair value − $1,000 book value) ×\nLess: Excess allocated to PPE | 70 35%]\nAcquisition goodwill | $20\n(Module 8.3, LOS 8.a)","explhtml":"<p>The excess of purchase price over the pro rata share of the book value of Optimax is allocated to PP&amp;E. The remainder is goodwill.<\/p><div class=\"tbl\"><table><tr><td>Purchase price (in thousands)<\/td><td>$300<\/td><\/tr><\/table><\/div><p>Less: Pro rata share of<\/p><div class=\"tbl\"><table><tr><td>210<\/td><td>[$600 Optimax book value × 35%]<\/td><\/tr><\/table><\/div><p>Optimax<\/p><div class=\"tbl\"><table><tr><td>Excess of purchase price<\/td><td>90 [($1,200 fair value − $1,000 book value) ×<\/td><\/tr><tr><td>Less: Excess allocated to PPE<\/td><td>70 35%]<\/td><\/tr><tr><td>Acquisition goodwill<\/td><td>$20<\/td><\/tr><\/table><\/div><p>(Module 8.3, LOS 8.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Kevin Rathbun, CFA, is a financial analyst at a major brokerage firm. His supervisor, Elizabeth Mao, CFA, asks him to analyze the financial position of Wayland, Inc. (Wayland), a manufacturer of components for high quality optic transmission systems. Mao also inquires about the impact of any unconsolidated investments.<\/p><p>On December 31, 2017, Wayland purchased a 35% ownership interest in a strategic new firm called Optimax for $300,000 cash. The pre-acquisition balance sheets of both firms are found in  Exhibit 1: Pre-Acquisition Balance Sheets for Wayland and Optimax.<\/p><p>Exhibit 1: Pre-Acquisition Balance Sheets for Wayland and Optimax<\/p><div class=\"tbl\"><table><tr><td>Balance Sheets as of Dec. 31, 2017 in ThousandsWayland<\/td><td>Optimax<\/td><\/tr><\/table><\/div><p>Assets<\/p><div class=\"tbl\"><table><tr><td>Cash<\/td><td>$710<\/td><td>$100<\/td><\/tr><tr><td>Marketable securities<\/td><td>2,550<\/td><td>–<\/td><\/tr><tr><td>Inventory<\/td><td>2,000<\/td><td>400<\/td><\/tr><tr><td>Accounts receivable<\/td><td>3,000<\/td><td>500<\/td><\/tr><tr><td>Property, plant, and equipment<\/td><td>2,450<\/td><td>1,000<\/td><\/tr><tr><td>Total assets<\/td><td>$10,710<\/td><td>$2,000<\/td><\/tr><\/table><\/div><p>Liabilities<\/p><div class=\"tbl\"><table><tr><td>Accounts payable<\/td><td>$3,310<\/td><td>400<\/td><\/tr><tr><td>Long-term debt<\/td><td>5,000<\/td><td>1,000<\/td><\/tr><tr><td>Equity<\/td><td>2,400<\/td><td>600<\/td><\/tr><tr><td>Total liabilities and equity<\/td><td>$10,710<\/td><td>$2,000<\/td><\/tr><\/table><\/div><p>On the acquisition date, all of Optimax&#x27;s assets and liabilities were stated on its balance sheet at their fair values except for its property, plant, and equipment (PP&amp;E), which had a fair value of $1.2 million. The remaining useful life of the PP&amp;E is 10 years with no salvage value. Both firms use the straight-line depreciation method.<\/p><p>For the year ended 2018, Optimax reported net income of $250,000 and paid dividends of $100,000.<\/p><p>During the first quarter of 2019, Optimax sold goods to Wayland and recognized $15,000 of profit from the sale. At the end of the quarter, half of the goods purchased from Optimax remained in Wayland&#x27;s inventory.<\/p><p>Wayland currently uses the equity method to account for its investment in Optimax.<\/p><p>Rathbun also notes that Wayland owns shares in Vanry, Inc. (Vanry). Rathbun gathers the data in  Exhibit 2: Share Transaction Data, Vanry, Inc. from Wayland&#x27;s financial statements. The year-end portfolio value is the market value of all Vanry shares held on December 31. All security transactions occurred on July 1, and the transaction price is the price that Wayland actually paid for the shares acquired. Vanry pays a cash dividend of $1 per share at the end of each year. Wayland expects to sell its investment in Vanry in the near term and accounts for it as fair value through profit or loss security.<\/p><p>Exhibit 2: Share Transaction Data, Vanry, Inc.<\/p><div class=\"tbl\"><table><tr><td>Year-End Portfolio<\/td><td>Year-End<\/td><td>Year-End<\/td><td>Transaction Price<\/td><\/tr><\/table><\/div><p>Year<\/p><div class=\"tbl\"><table><tr><td>Value<\/td><td>Shares Held<\/td><td>Share Price<\/td><td>(July 1)<\/td><td><\/td><\/tr><tr><td>2017<\/td><td>$1,875,000 25,000<\/td><td><sup>a<\/sup><\/td><td>$75<\/td><td>$85<\/td><\/tr><tr><td>2018<\/td><td>$2,280,000<\/td><td>30,000<\/td><td>$76<\/td><td>$78<\/td><\/tr><\/table><\/div><p>a Purchased on July 1, 2017.<\/p><\/div><\/details><div class=\"qtext\"><p>The amount of goodwill resulting from Wayland&#x27;s acquisition of Optimax is closest to:<\/p><\/div>","subj":"fsa"},{"n":10,"q":"The amount that Wayland should report in its balance sheet at the end of 2018 as a result of its investment in Optimax is closest to:","opts":["$345,500.","$352,000.","$380,500."],"ans":"A","expl":"Under the equity method, Wayland recognizes its pro rata share of Optimax's net income, less the additional depreciation that resulted from the increase in fair value of Optimax's PP&E.\nPro rata share of Optimax's net income | $87,500 | [$250,000 × 35%]\nLess: Additional depreciation from PPE | 7,000 | [($200,000 / 10 years) × 35%]\nEquity income | $80,500\nWayland's investment account on the balance sheet increased by its equity income and decreased by the dividends received from the investment.\nBeginning investment account | $300,000\nEquity income from Optimax | 80,500\nLess: Dividends received | 35,000 | [$100,000 dividends × 35%]\nEnding investment account | $345,500\n(Module 8.1, LOS 8.b)","explhtml":"<p>Under the equity method, Wayland recognizes its pro rata share of Optimax&#x27;s net income, less the additional depreciation that resulted from the increase in fair value of Optimax&#x27;s PP&amp;E.<\/p><div class=\"tbl\"><table><tr><td>Pro rata share of Optimax&#x27;s net income<\/td><td>$87,500<\/td><td>[$250,000 × 35%]<\/td><\/tr><tr><td>Less: Additional depreciation from PPE<\/td><td>7,000<\/td><td>[($200,000 / 10 years) × 35%]<\/td><\/tr><tr><td>Equity income<\/td><td>$80,500<\/td><td><\/td><\/tr><\/table><\/div><p>Wayland&#x27;s investment account on the balance sheet increased by its equity income and decreased by the dividends received from the investment.<\/p><div class=\"tbl\"><table><tr><td>Beginning investment account<\/td><td>$300,000<\/td><td><\/td><\/tr><tr><td>Equity income from Optimax<\/td><td>80,500<\/td><td><\/td><\/tr><tr><td>Less: Dividends received<\/td><td>35,000<\/td><td>[$100,000 dividends × 35%]<\/td><\/tr><tr><td>Ending investment account<\/td><td>$345,500<\/td><td><\/td><\/tr><\/table><\/div><p>(Module 8.1, LOS 8.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Kevin Rathbun, CFA, is a financial analyst at a major brokerage firm. His supervisor, Elizabeth Mao, CFA, asks him to analyze the financial position of Wayland, Inc. (Wayland), a manufacturer of components for high quality optic transmission systems. Mao also inquires about the impact of any unconsolidated investments.<\/p><p>On December 31, 2017, Wayland purchased a 35% ownership interest in a strategic new firm called Optimax for $300,000 cash. The pre-acquisition balance sheets of both firms are found in  Exhibit 1: Pre-Acquisition Balance Sheets for Wayland and Optimax.<\/p><p>Exhibit 1: Pre-Acquisition Balance Sheets for Wayland and Optimax<\/p><div class=\"tbl\"><table><tr><td>Balance Sheets as of Dec. 31, 2017 in ThousandsWayland<\/td><td>Optimax<\/td><\/tr><\/table><\/div><p>Assets<\/p><div class=\"tbl\"><table><tr><td>Cash<\/td><td>$710<\/td><td>$100<\/td><\/tr><tr><td>Marketable securities<\/td><td>2,550<\/td><td>–<\/td><\/tr><tr><td>Inventory<\/td><td>2,000<\/td><td>400<\/td><\/tr><tr><td>Accounts receivable<\/td><td>3,000<\/td><td>500<\/td><\/tr><tr><td>Property, plant, and equipment<\/td><td>2,450<\/td><td>1,000<\/td><\/tr><tr><td>Total assets<\/td><td>$10,710<\/td><td>$2,000<\/td><\/tr><\/table><\/div><p>Liabilities<\/p><div class=\"tbl\"><table><tr><td>Accounts payable<\/td><td>$3,310<\/td><td>400<\/td><\/tr><tr><td>Long-term debt<\/td><td>5,000<\/td><td>1,000<\/td><\/tr><tr><td>Equity<\/td><td>2,400<\/td><td>600<\/td><\/tr><tr><td>Total liabilities and equity<\/td><td>$10,710<\/td><td>$2,000<\/td><\/tr><\/table><\/div><p>On the acquisition date, all of Optimax&#x27;s assets and liabilities were stated on its balance sheet at their fair values except for its property, plant, and equipment (PP&amp;E), which had a fair value of $1.2 million. The remaining useful life of the PP&amp;E is 10 years with no salvage value. Both firms use the straight-line depreciation method.<\/p><p>For the year ended 2018, Optimax reported net income of $250,000 and paid dividends of $100,000.<\/p><p>During the first quarter of 2019, Optimax sold goods to Wayland and recognized $15,000 of profit from the sale. At the end of the quarter, half of the goods purchased from Optimax remained in Wayland&#x27;s inventory.<\/p><p>Wayland currently uses the equity method to account for its investment in Optimax.<\/p><p> p interest]. (Module 8.5, LOS 8.b)","explhtml":"<p>Because all of the profit from the intercompany transaction is included in Optimax&#x27;s net income, Wayland must reduce its equity income of Optimax by the pro rata share of the unconfirmed profit. Because half of the goods remain, half of the profit is unconfirmed. Thus, Wayland must reduce its equity income by $2,625 [($15,000 total profit × 50% unconfirmed) × 35% ownership interest]. (Module 8.5, LOS 8.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Kevin Rathbun, CFA, is a financial analyst at a major brokerage firm. His supervisor, Elizabeth Mao, CFA, asks him to analyze the financial position of Wayland, Inc. (Wayland), a manufacturer of components for high quality optic transmission systems. Mao also inquires about the impact of any unconsolidated investments.<\/p><p>On December 31, 2017, Wayland purchased a 35% ownership interest in a strategic new firm called Optimax for $300,000 cash. The pre-acquisition balance sheets of both firms are found in  Exhibit 1: Pre-Acquisition Balance Sheets for Wayland and Optimax.<\/p><p>Exhibit 1: Pre-Acquisition Balance Sheets for Wayland and Optimax<\/p><div class=\"tbl\"><table><tr><td>Balance Sheets as of Dec. 31, 2017 in ThousandsWayland<\/td><td>Optimax<\/td><\/tr><\/table><\/div><p>Assets<\/p><div class=\"tbl\"><table><tr><td>Cash<\/td><td>$710<\/td><td>$100<\/td><\/tr><tr><td>Marketable securities<\/td><td>2,550<\/td><td>–<\/td><\/tr><tr><td>Inventory<\/td><td>2,000<\/td><td>400<\/td><\/tr><tr><td>Accounts receivable<\/td><td>3,000<\/td><td>500<\/td><\/tr><tr><td>Property, plant, and equipment<\/td><td>2,450<\/td><td>1,000<\/td><\/tr><tr><td>Total assets<\/td><td>$10,710<\/td><td>$2,000<\/td><\/tr><\/table><\/div><p>Liabilities<\/p><div class=\"tbl\"><table><tr><td>Accounts payable<\/td><td>$3,310<\/td><td>400<\/td><\/tr><tr><td>Long-term debt<\/td><td>5,000<\/td><td>1,000<\/td><\/tr><tr><td>Equity<\/td><td>2,400<\/td><td>600<\/td><\/tr><tr><td>Total liabilities and equity<\/td><td>$10,710<\/td><td>$2,000<\/td><\/tr><\/table><\/div><p>On the acquisition date, all of Optimax&#x27;s assets and liabilities were stated on its balance sheet at their fair values except for its property, plant, and equipment (PP&amp;E), which had a fair value of $1.2 million. The remaining useful life of the PP&amp;E is 10 years with no salvage value. Both firms use the straight-line depreciation method.<\/p><p>For the year ended 2018, Optimax reported net income of $250,000 and paid dividends of $100,000.<\/p><p>During the first quarter of 2019, Optimax sold goods to Wayland and recognized $15,000 of profit from the sale. At the end of the quarter, half of the goods purchased from Optimax remained in Wayland&#x27;s inventory.<\/p><p>Wayland currently uses the equity method to account for its investment in Optimax.<\/p><p>Rathbun also notes that Wayland owns shares in Vanry, Inc. (Vanry). Rathbun gathers the data in  Exhibit 2: Share Transaction Data, Vanry, Inc. from Wayland&#x27;s financial statements. The year-end portfolio value is the market value of all Vanry shares held on December 31. All security transactions occurred on July 1, and the transaction price is the price that Wayland actually paid for the shares acquired. Vanry pays a cash dividend of $1 per share at the end of each year. Wayland expects to sell its investment in Vanry in the near term and accounts for it as fair value through profit or loss security.<\/p><p>Exhibit 2: Share Transaction Data, Vanry, Inc.<\/p><div class=\"tbl\"><table><tr><td>Year-End Portfolio<\/td><td>Year-End<\/td><td>Year-End<\/td><td>Transaction Price<\/td><\/tr><\/table><\/div><p>Year<\/p><div class=\"tbl\"><table><tr><td>Value<\/td><td>Shares Held<\/td><td>Share Price<\/td><td>(July 1)<\/td><td><\/td><\/tr><tr><td>2017<\/td><td>$1,875,000 25,000<\/td><td><sup>a<\/sup><\/td><td>$75<\/td><td>$85<\/td><\/tr><tr><td>2018<\/td><td>$2,280,000<\/td><td>30,000<\/td><td>$76<\/td><td>$78<\/td><\/tr><\/table><\/div><p>a Purchased on July 1, 2017.<\/p><\/div><\/details><div class=\"qtext\"><p>Considering Wayland&#x27;s intercompany sales transaction for the quarter ended March 31, 2019, the amount by which Wayland should reduce its equity income is closest to:<\/p><\/div>","subj":"fsa"},{"n":12,"q":"As a result of its investment in Vanry, the amount of profit that Wayland should recognize in its income statement for the year ended 2018 is closest to:","opts":["$15,000.","$25,000.","$45,000."],"ans":"C","expl":"The change in market value for the period and dividends received from the investment are recognized in the income statement for fair value through profit or loss securities. In 2018, there was a $25,000 unrealized gain on the original 25,000 shares [25,000 shares × ($76 – $75)] and a $10,000 unrealized loss on the shares purchased in 2018 [5,000 shares × ($76 – $78)]. Wayland received $30,000 in dividends from Vanry (30,000 shares × $1 per share). For 2018, the income statement impact is a $45,000 profit ($25,000 unrealized gain on original shares – $10,000 unrealized loss on increase in shares + $30,000 dividends received). (Module 8.2, LOS 8.a)","explhtml":"<p>The change in market value for the period and dividends received from the investment are recognized in the income statement for fair value through profit or loss securities. In 2018, there was a $25,000 unrealized gain on the original 25,000 shares [25,000 shares × ($76 – $75)] and a $10,000 unrealized loss on the shares purchased in 2018 [5,000 shares × ($76 – $78)]. Wayland received $30,000 in dividends from Vanry (30,000 shares × $1 per share). For 2018, the income statement impact is a $45,000 profit ($25,000 unrealized gain on original shares – $10,000 unrealized loss on increase in shares + $30,000 dividends received). (Module 8.2, LOS
