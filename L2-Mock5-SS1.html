CjX5vOkhD8f/ACb/AP/Z\" style=\"max-width:min(100%,447px)\" alt=\"\"><p>Thirty months ago, Adams entered into a $1 million notional, 3-year, semiannual settlement, 3% fixed-rate payer swap.<\/p><\/div><\/details><div class=\"qtext\"><p>Suppose that Adams entered into the FRA as a short party and now wants to hedge that exposure. The most appropriate way to achieve that hedge would be to take on exposure to:<\/p><\/div>","subj":"derivatives"},{"n":33,"q":"Which property valuations are most likely to be heavily influenced by their unique characteristics?","opts":["Property #1 and Property #2.","Property #1 and Property #3.","Property #2 and Property #3."],"ans":"C","expl":"While almost any private equity real estate investment will be unique (if for no other reason than that they must be in different locations), residential properties tend to have the fewest unique characteristics. This is why transactions-based indices tend to be more useful for residential commercial property benchmarking than for nonresidential commercial properties due to the large amount of data required for many properties and the unique features of many nonresidential commercial properties.\n(Module 33.1, LOS 33.c)","explhtml":"<p>While almost any private equity real estate investment will be unique (if for no other reason than that they must be in different locations), residential properties tend to have the fewest unique characteristics. This is why transactions-based indices tend to be more useful for residential commercial property benchmarking than for nonresidential commercial properties due to the large amount of data required for many properties and the unique features of many nonresidential commercial properties.<\/p><p>(Module 33.1, LOS 33.c)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Julie Mariluz is a real estate analyst with Young Family Trust (YFT), a family investment office. Aside from investment in equities and bonds, YFT makes direct investment in diverse real estate properties. Mariluz has been asked to evaluate three potential investment properties shown in  Exhibit 1: Property Description<\/p><p>Exhibit 1: Property Description<\/p><div class=\"tbl\"><table><tr><td>Property 1:<\/td><td>A multi-family residential building with high occupancy and in a desirable location.<\/td><\/tr><tr><td>Property 2:<\/td><td>An older office building with dated architectural features and in an area that is undergoing significant improvements.<\/td><\/tr><tr><td>Property 3:<\/td><td>A shopping mall with two anchor tenants.<\/td><\/tr><\/table><\/div><p>Mariluz prepares a presentation for the members of the Young family. In it, she makes the following statements:<\/p><p>Private real estate investments face demand and supply risks due to Statement changes in business conditions and demographics, and due to the 1:<\/p><p>potential for excess supply.<\/p><div class=\"tbl\"><table><tr><td>Statement<\/td><td>Valuation related risk factors include illiquidity, management expertise,<\/td><\/tr><tr><td>2:<\/td><td>and the availability and cost of capital.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which property valuations are most likely to be heavily influenced by their unique characteristics?<\/p><\/div>","subj":"alternatives"},{"n":34,"q":"Regarding statements 1 and 2 made by Mariluz, which of the following is most accurate?","opts":["Only statement 1 is correct.","Only statement 2 is correct.","Both statements are correct"],"ans":"A","expl":"Statement 1 is correct.\nProperty demand and supply risks include the 3 risk factors identified in the statement.\nStatement 2 is incorrect. Management expertise is classified as an operational risk factor and not a valuation risk factor. Valuation-related risk factors include: cost and availability of capital, availability of information, lack of liquidity, and the interest rate environment.\n(Module 33.1, LOS 33.a)","explhtml":"<p>Statement 1 is correct.<\/p><p>Property demand and supply risks include the 3 risk factors identified in the statement.<\/p><p>Statement 2 is incorrect. Management expertise is classified as an operational risk factor and not a valuation risk factor. Valuation-related risk factors include: cost and availability of capital, availability of information, lack of liquidity, and the interest rate environment.<\/p><p>(Module 33.1, LOS 33.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Julie Mariluz is a real estate analyst with Young Family Trust (YFT), a family investment office. Aside from investment in equities and bonds, YFT makes direct investment in diverse real estate properties. Mariluz has been asked to evaluate three potential investment properties shown in  Exhibit 1: Property Description<\/p><p>Exhibit 1: Property Description<\/p><div class=\"tbl\"><table><tr><td>Property 1:<\/td><td>A multi-family residential building with high occupancy and in a desirable location.<\/td><\/tr><tr><td>Property 2:<\/td><td>An older office building with dated architectural features and in an area that is undergoing significant improvements.<\/td><\/tr><tr><td>Property 3:<\/td><td>A shopping mall with two anchor tenants.<\/td><\/tr><\/table><\/div><p>Mariluz prepares a presentation for the members of the Young family. In it, she makes the following statements:<\/p><p>Private real estate investments face demand and supply risks due to Statement changes in business conditions and demographics, and due to the 1:<\/p><p>potential for excess supply.<\/p><div class=\"tbl\"><table><tr><td>Statement<\/td><td>Valuation related risk factors include illiquidity, management expertise,<\/td><\/tr><tr><td>2:<\/td><td>and the availability and cost of capital.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding statements 1 and 2 made by Mariluz, which of the following is most accurate?<\/p><\/div>","subj":"alternatives"},{"n":35,"q":"The least important step in the due diligence of property #1 is:","opts":["Review the local market to identify demographics, preferences and wage growth.","Review of the terms of tenants' leases.","Review of cash flow statements and maintenance expenses."],"ans":"B","expl":"For buildings with large anchor tenants that have multi-year leases (e.g., department stores in shopping malls), the due diligence process should includes a review of leases for major tenants. However, Property 3 is a residential building, so this best practice does not apply directly. The other two risk factors are important elements of due diligence to mitigate the investment risk for property 1.\n(Module 33.1, LOS 33.d)","explhtml":"<p>For buildings with large anchor tenants that have multi-year leases (e.g., department stores in shopping malls), the due diligence process should includes a review of leases for major tenants. However, Property 3 is a residential building, so this best practice does not apply directly. The other two risk factors are important elements of due diligence to mitigate the investment risk for property 1.<\/p><p>(Module 33.1, LOS 33.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Julie Mariluz is a real estate analyst with Young Family Trust (YFT), a family investment office. Aside from investment in equities and bonds, YFT makes direct investment in diverse real estate properties. Mariluz has been asked to evaluate three potential investment properties shown in  Exhibit 1: Property Description<\/p><p>Exhibit 1: Property Description<\/p><div class=\"tbl\"><table><tr><td>Property 1:<\/td><td>A multi-family residential building with high occupancy and in a desirable location.<\/td><\/tr><tr><td>Property 2:<\/td><td>An older office building with dated architectural features and in an area that is undergoing significant improvements.<\/td><\/tr><tr><td>Property 3:<\/td><td>A shopping mall with two anchor tenants.<\/td><\/tr><\/table><\/div><p>Mariluz prepares a presentation for the members of the Young family. In it, she makes the following statements:<\/p><p>Private real estate investments face demand and supply risks due to Statement changes in business conditions and demographics, and due to the 1:<\/p><p>potential for excess supply.<\/p><div class=\"tbl\"><table><tr><td>Statement<\/td><td>Valuation related risk factors include illiquidity, management expertise,<\/td><\/tr><tr><td>2:<\/td><td>and the availability and cost of capital.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The least important step in the due diligence of property #1 is:<\/p><\/div>","subj":"alternatives"},{"n":36,"q":"YFT is considering the use of an index as a benchmark for measuring the performance of the firm's private real estate investments. Compared to a transaction-based real estate index, an appraisal-based real estate index is most likely to have higher:","opts":["lag.","volatility.","correlation with other asset classes."],"ans":"A","expl":"Appraisal-based indices tend to lag transaction-based indices, and will appear to have lower correlation with other asset classes and lower volatility compared to transaction-based indices.\n(Module 33.1, LOS 33.e)","explhtml":"<p>Appraisal-based indices tend to lag transaction-based indices, and will appear to have lower correlation with other asset classes and lower volatility compared to transaction-based indices.<\/p><p>(Module 33.1, LOS 33.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Julie Mariluz is a real estate analyst with Young Family Trust (YFT), a family investment office. Aside from investment in equities and bonds, YFT makes direct investment in diverse real estate properties. Mariluz has been asked to evaluate three potential investment properties shown in  Exhibit 1: Property Description<\/p><p>Exhibit 1: Property Description<\/p><div class=\"tbl\"><table><tr><td>Property 1:<\/td><td>A multi-family residential building with high occupancy and in a desirable location.<\/td><\/tr><tr><td>Property 2:<\/td><td>An older office building with dated architectural features and in an area that is undergoing significant improvements.<\/td><\/tr><tr><td>Property 3:<\/td><td>A shopping mall with two anchor tenants.<\/td><\/tr><\/table><\/div><p>Mariluz prepares a presentation for the members of the Young family. In it, she makes the following statements:<\/p><p>Private real estate investments face demand and supply risks due to Statement changes in business conditions and demographics, and due to the 1:<\/p><p>potential for excess supply.<\/p><div class=\"tbl\"><table><tr><td>Statement<\/td><td>Valuation related risk factors include illiquidity, management expertise,<\/td><\/tr><tr><td>2:<\/td><td>and the availability and cost of capital.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>YFT is considering the use of an index as a benchmark for measuring the performance of the firm&#x27;s private real estate investments. Compared to a transaction-based real estate index, an appraisal-based real estate index is most likely to have higher:<\/p><\/div>","subj":"alternatives"},{"n":37,"q":"In the context of the Code and Standards, which of the items from the background check would most likely indicate that Zonding should not have hired Cooken?","opts":["Item i.","Item ii.","Item iii."],"ans":"A","expl":"Item (i) is a likely violation of the Code and Standards. Working as a waitress is not a conflict of interest for an investment analyst, but Cooken's employer can reasonably assume that a 30-hour-a-week side job could be tiring, depriving the company of her skills and ability during her internship, which would violate Standard IV(A) Loyalty (to employer).\nCooken's description of the CFA exam is accurate, and she takes no liberties with a title. Thus she has not violated Standard VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program.\nOne conviction as a teenager before working as an investment professional is not a violation of Standard I(D) Misconduct. Standard IV(A) Loyalty (to employer) does not hold when illegal activities are involved, and Cooken's willingness to talk to the FBI would most likely not be considered a violation. The Standards do suggest, however, that the member consult with his employer's compliance personnel or outside counsel before disclosing any confidential client information. (Module 42.7, LOS 42.a)","explhtml":"<p>Item (i) is a likely violation of the Code and Standards. Working as a waitress is not a conflict of interest for an investment analyst, but Cooken&#x27;s employer can reasonably assume that a 30-hour-a-week side job could be tiring, depriving the company of her skills and ability during her internship, which would violate Standard IV(A) Loyalty (to employer).<\/p><p>Cooken&#x27;s description of the CFA exam is accurate, and she takes no liberties with a title. Thus she has not violated Standard VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program.<\/p><p>One conviction as a teenager before working as an investment professional is not a violation of Standard I(D) Misconduct. Standard IV(A) Loyalty (to employer) does not hold when illegal activities are involved, and Cooken&#x27;s willingness to talk to the FBI would most likely not be considered a violation. The Standards do suggest, however, that the member consult with his employer&#x27;s compliance personnel or outside counsel before disclosing any confidential client information. (Module 42.7, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Mike Zonding, CFA, is conducting a background check on CFA candidate Annie Cooken, a freshly minted MBA who applied for a stock-analysis job at his firm, Khasko Financial. Zonding does not like to hire anyone who does not adhere to the Code and Standards&#x27; professional conduct requirements.<\/p><p>The background check reveals the following:<\/p><p>(i) While doing a full-time, unpaid internship at Kale Investments, Cooken was reprimanded for working a 30-hour-a-week night job as a waitress.<\/p><p>(ii) As an intern at Lammar Corp., Cooken was fired after revealing to the FBI that one of the principals was embezzling from the firm&#x27;s clients.<\/p><p>(iii) Cooken performed 40 hours of community service in relation to a conviction on a misdemeanor drug possession charge when she was 16 years old.<\/p><p>(iv) On her resume, Cooken writes, &quot;Recently passed Level II of the CFA exam, a test that measures candidates&#x27; knowledge of finance and investing.&quot;<\/p><p>During the interview, Zonding asks Cooken several questions on ethics-related issues, including questions about the role of a fiduciary and Standard III(E) Preservation of Confidentiality. He asks her about her internship at Kale Investments, specifically about the working hours. Cooken replies that the internship turned out to require more time than she originally planned, up to 65 hours per week.<\/p><p>Zonding subsequently hires Cooken and functions as her supervisor. On her third day at the money management boutique firm, portfolio manager Steven Clarrison hands her a report on Mocline Tobacco and tells her to revise the report to reflect a buy rating. Cooken is uncomfortable about revising the report.<\/p><p>Zonding prepared a research report with a buy rating on Orlando Stores, a discount clothing chain. Khasko&#x27;s investment banking department has completed transactions for Orlando in the past 12 months and currently is working with Orlando to evaluate a secondary offering; Khasko has a policy in place that separates the activities of investment banking and research departments.<\/p><p>In the report, Zonding disclosed that Khasko has an investment banking relationship with Orlando and that his wife holds Orlando shares. However, he forgot to comment on the risk profile and suitability of investing in Orlando shares.<\/p><p>Zonding just entered into a brokerage agreement with Zeta Services. According to that agreement, in exchange for client referrals from Zeta, Khasko would give Zeta its brokerage business. Khasko advised its clients about the nature and extent of this relationship in writing.<\/p><\/div><\/details><div class=\"qtext\"><p>In the context of the Code and Standards, which of the items from the background check would most likely indicate that Zonding should not have hired Cooken?<\/p><\/div>","subj":"ethics"},{"n":38,"q":"Which of the following statements provides the least appropriate justification for Cooken's caution about revising the report on Mocline Tobacco?","opts":["Cooken knows next to nothing about Mocline stock.","Cooken’s uncle, George Whates, is the CFO of Mocline.","In college, Cooken worked for Mocline, but never declared the income on her taxes."],"ans":"C","expl":"While Cooken's tax avoidance may represent a professional-conduct issue, it has no bearing on her ability to write a report on Mocline. While Clarrison may be an expert on Mocline, Cooken does not know enough about the stock to write about it without taking the risk of being in violation of Standard V(A) Diligence and Reasonable Basis. Because of Cooken's relationship to the CFO of Mocline and ownership of Mocline stock, her objectivity might be questioned. (Module 42.8, LOS 42.a)","explhtml":"<p>While Cooken&#x27;s tax avoidance may represent a professional-conduct issue, it has no bearing on her ability to write a report on Mocline. While Clarrison may be an expert on Mocline, Cooken does not know enough about the stock to write about it without taking the risk of being in violation of Standard V(A) Diligence and Reasonable Basis. Because of Cooken&#x27;s relationship to the CFO of Mocline and ownership of Mocline stock, her objectivity might be questioned. (Module 42.8, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mike Zonding, CFA, is conducting a background check on CFA candidate Annie Cooken, a freshly minted MBA who applied for a stock-analysis job at his firm, Khasko Financial. Zonding does not like to hire anyone who does not adhere to the Code and Standards&#x27; professional conduct requirements.<\/p><p>The background check reveals the following:<\/p><p>(i) While doing a full-time, unpaid internship at Kale Investments, Cooken was reprimanded for working a 30-hour-a-week night job as a waitress.<\/p><p>(ii) As an intern at Lammar Corp., Cooken was fired after revealing to the FBI that one of the principals was embezzling from the firm&#x27;s clients.<\/p><p>(iii) Cooken performed 40 hours of community service in relation to a conviction on a misdemeanor drug possession charge when she was 16 years old.<\/p><p>(iv) On her resume, Cooken writes, &quot;Recently passed Level II of the CFA exam, a test that measures candidates&#x27; knowledge of finance and investing.&quot;<\/p><p>During the interview, Zonding asks Cooken several questions on ethics-related issues, including questions about the role of a fiduciary and Standard III(E) Preservation of Confidentiality. He asks her about her internship at Kale Investments, specifically about the working hours. Cooken replies that the internship turned out to require more time than she originally planned, up to 65 hours per week.<\/p><p>Zonding subsequently hires Cooken and functions as her supervisor. On her third day at the money management boutique firm, portfolio manager Steven Clarrison hands her a report on Mocline Tobacco and tells her to revise the report to reflect a buy rating. Cooken is uncomfortable about revising the report.<\/p><p>Zonding prepared a research report with a buy rating on Orlando Stores, a discount clothing chain. Khasko&#x27;s investment banking department has completed transactions for Orlando in the past 12 months and currently is working with Orlando to evaluate a secondary offering; Khasko has a policy in place that separates the activities of investment banking and research departments.<\/p><p>In the report, Zonding disclosed that Khasko has an investment banking relationship with Orlando and that his wife holds Orlando shares. However, he forgot to comment on the risk profile and suitability of investing in Orlando shares.<\/p><p>Zonding just entered into a brokerage agreement with Zeta Services. According to that agreement, in exchange for client referrals from Zeta, Khasko would give Zeta its brokerage business. Khasko advised its clients about the nature and extent of this relationship in writing.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following statements provides the least appropriate justification for Cooken&#x27;s caution about revising the report on Mocline Tobacco?<\/p><\/div>","subj":"ethics"},{"n":39,"q":"Was Zonding in compliance with CFA Institute Standards of Professional Conduct with regard to the Orlando Stores research report?","opts":["No, because Zonding neglected to discuss Orlando’s suitability as an investment.","No, because Zonding failed to disclose Orlando’s plans to announce a secondary offering in the near future.","Yes, because Zonding disclosed his firm’s relationship with Orlando, his wife’s ownership of the shares, and the availability of his Orlando report."],"ans":"A","expl":"Zonding's research report failed to include sufficient information be included for investors to assess the appropriateness of the investment for their own personal risk profile violating Standard V(B) Communication with Clients and Prospective Clients. (Module 42.8, LOS 42.a)","explhtml":"<p>Zonding&#x27;s research report failed to include sufficient information be included for investors to assess the appropriateness of the investment for their own personal risk profile violating Standard V(B) Communication with Clients and Prospective Clients. (Module 42.8, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mike Zonding, CFA, is conducting a background check on CFA candidate Annie Cooken, a freshly minted MBA who applied for a stock-analysis job at his firm, Khasko Financial. Zonding does not like to hire anyone who does not adhere to the Code and Standards&#x27; professional conduct requirements.<\/p><p>The background check reveals the following:<\/p><p>(i) While doing a full-time, unpaid internship at Kale Investments, Cooken was reprimanded for working a 30-hour-a-week night job as a waitress.<\/p><p>(ii) As an intern at Lammar Corp., Cooken was fired after revealing to the FBI that one of the principals was embezzling from the firm&#x27;s clients.<\/p><p>(iii) Cooken performed 40 hours of community service in relation to a conviction on a misdemeanor drug possession charge when she was 16 years old.<\/p><p>(iv) On her resume, Cooken writes, &quot;Recently passed Level II of the CFA exam, a test that measures candidates&#x27; knowledge of finance and investing.&quot;<\/p><p>During the interview, Zonding asks Cooken several questions on ethics-related issues, including questions about the role of a fiduciary and Standard III(E) Preservation of Confidentiality. He asks her about her internship at Kale Investments, specifically about the working hours. Cooken replies that the internship turned out to require more time than she originally planned, up to 65 hours per week.<\/p><p>Zonding subsequently hires Cooken and functions as her supervisor. On her third day at the money management boutique firm, portfolio manager Steven Clarrison hands her a report on Mocline Tobacco and tells her to revise the report to reflect a buy rating. Cooken is uncomfortable about revising the report.<\/p><p>Zonding prepared a research report with a buy rating on Orlando Stores, a discount clothing chain. Khasko&#x27;s investment banking department has completed transactions for Orlando in the past 12 months and currently is working with Orlando to evaluate a secondary offering; Khasko has a policy in place that separates the activities of investment banking and research departments.<\/p><p>In the report, Zonding disclosed that Khasko has an investment banking relationship with Orlando and that his wife holds Orlando shares. However, he forgot to comment on the risk profile and suitability of investing in Orlando shares.<\/p><p>Zonding just entered into a brokerage agreement with Zeta Services. According to that agreement, in exchange for client referrals from Zeta, Khasko would give Zeta its brokerage business. Khasko advised its clients about the nature and extent of this relationship in writing.<\/p><\/div><\/details><div class=\"qtext\"><p>Was Zonding in compliance with CFA Institute Standards of Professional Conduct with regard to the Orlando Stores research report?<\/p><\/div>","subj":"ethics"},{"n":40,"q":"Did Zonding and Khasko follow the recommended procedures of the CFA Institute Standards of Professional Conduct with respect to the brokerage arrangement with Zeta?","opts":["Yes, because Khasko disclosed this arrangement to their clients.","No, because Khasko did not preserve confidentiality of their agreement with Zeta.","No, because the agreement inappropriately creates a conflict of interest."],"ans":"A","expl":"Zonding complied with Standard VI(A) in making disclosure about Khasko's relationship with Zeta. Standard III(E) Preservation of Confidentiality is not applicable here because Zeta is not a client. (Module 42.9, LOS 42.b)","explhtml":"<p>Zonding complied with Standard VI(A) in making disclosure about Khasko&#x27;s relationship with Zeta. Standard III(E) Preservation of Confidentiality is not applicable here because Zeta is not a client. (Module 42.9, LOS 42.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mike Zonding, CFA, is conducting a background check on CFA candidate Annie Cooken, a freshly minted MBA who applied for a stock-analysis job at his firm, Khasko Financial. Zonding does not like to hire anyone who does not adhere to the Code and Standards&#x27; professional conduct requirements.<\/p><p>The background check reveals the following:<\/p><p>(i) While doing a full-time, unpaid internship at Kale Investments, Cooken was reprimanded for working a 30-hour-a-week night job as a waitress.<\/p><p>(ii) As an intern at Lammar Corp., Cooken was fired after revealing to the FBI that one of the principals was embezzling from the firm&#x27;s clients.<\/p><p>(iii) Cooken performed 40 hours of community service in relation to a conviction on a misdemeanor drug possession charge when she was 16 years old.<\/p><p>(iv) On her resume, Cooken writes, &quot;Recently passed Level II of the CFA exam, a test that measures candidates&#x27; knowledge of finance and investing.&quot;<\/p><p>During the interview, Zonding asks Cooken several questions on ethics-related issues, including questions about the role of a fiduciary and Standard III(E) Preservation of Confidentiality. He asks her about her internship at Kale Investments, specifically about the working hours. Cooken replies that the internship turned out to require more time than she originally planned, up to 65 hours per week.<\/p><p>Zonding subsequently hires Cooken and functions as her supervisor. On her third day at the money management boutique firm, portfolio manager Steven Clarrison hands her a report on Mocline Tobacco and tells her to revise the report to reflect a buy rating. Cooken is uncomfortable about revising the report.<\/p><p>Zonding prepared a research report with a buy rating on Orlando Stores, a discount clothing chain. Khasko&#x27;s investment banking department has completed transactions for Orlando in the past 12 months and currently is working with Orlando to evaluate a secondary offering; Khasko has a policy in place that separates the activities of investment banking and research departments.<\/p><p>In the report, Zonding disclosed that Khasko has an investment banking relationship with Orlando and that his wife holds Orlando shares. However, he forgot to comment on the risk profile and suitability of investing in Orlando shares.<\/p><p>Zonding just entered into a brokerage agreement with Zeta Services. According to that agreement, in exchange for client referrals from Zeta, Khasko would give Zeta its brokerage business. Khasko advised its clients about the nature and extent of this relationship in writing.<\/p><\/div><\/details><div class=\"qtext\"><p>Did Zonding and Khasko follow the recommended procedures of the CFA Institute Standards of Professional Conduct with respect to the brokerage arrangement with Zeta?<\/p><\/div>","subj":"ethics"},{"n":41,"q":"By not telling her employer about the bartending position, Gunderson has most likely violated:","opts":["no Standards.","Standard IV(B) Additional Compensation Arrangements.","Standard IV(A) Loyalty (to employer) and Standard IV(B) Additional Compensation Arrangements."],"ans":"A","expl":"Standard IV(A) Loyalty (to employer) requires that members and candidates act for the benefit of their employer and not deprive the employer of their skills and abilities. In addition, members and candidates must not cause harm to their employers. It's safe to say that a bar does not compete with a stock analysis/asset management company, and a six-hours-a-week part-time job should not interfere with her ability to perform analysis duties. Standard IV(B) Additional Compensation Arrangements relates to additional compensation related to an employee's services to the employer. The part-time work is not related to her analysis job and, as such, does not violate the Standard. There is nothing inherently unethical about working as a bartender, and working as a barkeeper does not compromise Gunderson's professional reputation, integrity, or competence. Thus, Standard I(D) Misconduct has not been violated. (Module 42.7, LOS 42.a)","explhtml":"<p>Standard IV(A) Loyalty (to employer) requires that members and candidates act for the benefit of their employer and not deprive the employer of their skills and abilities. In addition, members and candidates must not cause harm to their employers. It&#x27;s safe to say that a bar does not compete with a stock analysis/asset management company, and a six-hours-a-week part-time job should not interfere with her ability to perform analysis duties. Standard IV(B) Additional Compensation Arrangements relates to additional compensation related to an employee&#x27;s services to the employer. The part-time work is not related to her analysis job and, as such, does not violate the Standard. There is nothing inherently unethical about working as a bartender, and working as a barkeeper does not compromise Gunderson&#x27;s professional reputation, integrity, or competence. Thus, Standard I(D) Misconduct has not been violated. (Module 42.7, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 41–44 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Brandon Ratlieff, CFA, is a partner at Global Asset Management (GAM). CFA program candidate Sarah Gunderson just completed her first year at GAM. Ratlieff is going over Gunderson&#x27;s annual evaluation completed by her supervisor Peter Jackson, CFA.<\/p><p>To supplement the meager income from her entry-level stock-analysis job, Gunderson took a part-time position working three hours each Friday and Saturday night tending bar at a sports bar and grill downtown. Gunderson did not inform her supervisor or HR about the job.<\/p><p>During her first week, Gunderson has lunch with her former classmates, including Taira Basch, CFA, who works for the compliance officer at a large investment bank in town.<\/p><p>Basch arrives late, explaining, &quot;What a day, it&#x27;s only noon and already I have worked on the following requests:<\/p><p>1. A federal regulator called and wanted information on potentially illegal activities related to one of the firm&#x27;s key clients.<\/p><p>2. A rival company&#x27;s employee wanted information regarding employment opportunities at the firm.<\/p><p>3. A potential client contacted an employee and wanted detailed performance records of client accounts so he can decide whether to invest with the firm.&quot;<\/p><p>One of GAM&#x27;s clients is Bluestar Inc. Several months ago, Ratlieff filed several documents with regulators concerning Bluestar&#x27;s IPO. A Bluestar official later provided Ratlieff information that suggested that the financial statements GAM filed with the regulator overstate the issuer&#x27;s earnings.<\/p><p>Ratlieff seeks the advice of GAM&#x27;s general counsel, who states that because Ratlieff was not aware of the irregularity at the time of the filing, it would be difficult for the regulator to prove that GAM has been involved in any wrongdoing.<\/p><p>GAM provides research coverage for ASE, a European retailer. Gunderson&#x27;s mother owns 30,000 ASE shares. As part of her estate planning, Gunderson&#x27;s mother informs Gunderson that she has created a trust in Gunderson&#x27;s name, into which she has placed 2,000 shares of ASE. The trust is structured so that Gunderson will not receive control of the assets for three years. Gunderson is due to update the research coverage of ASE within the next two weeks.<\/p><\/div><\/details><div class=\"qtext\"><p>By not telling her employer about the bartending position, Gunderson has most likely violated:<\/p><\/div>","subj":"ethics"},{"n":42,"q":"Which of the requests, if fulfilled, is most likely to place Basch in violation of Standard III(E) Preservation of Confidentiality?","opts":["Request 1.","Request 2.","Request 3."],"ans":"C","expl":"Request 3 is a likely violation. Potential clients are not entitled to performance data beyond what the company chooses to disclose. Providing data, particularly client-specific data, could be a violation of the clients' confidentiality.\nMembers and candidates must answer questions asked by CFA Institute's Professional Conduct Program. Members and candidates may report illegal activities (and in some cases may have a legal obligation to report such activities) on the part of clients without fear of violating Standard III(E) Preservation of Confidentiality, so Request 1 is not likely a violation. And unless the firm's policy requires silence about job openings, answering questions about them is ethical, if not always wise, so Request 2 is not likely a violation. (Module 42.6, LOS 42.a)","explhtml":"<p>Request 3 is a likely violation. Potential clients are not entitled to performance data beyond what the company chooses to disclose. Providing data, particularly client-specific data, could be a violation of the clients&#x27; confidentiality.<\/p><p>Members and candidates must answer questions asked by CFA Institute&#x27;s Professional Conduct Program. Members and candidates may report illegal activities (and in some cases may have a legal obligation to report such activities) on the part of clients without fear of violating Standard III(E) Preservation of Confidentiality, so Request 1 is not likely a violation. And unless the firm&#x27;s policy requires silence about job openings, answering questions about them is ethical, if not always wise, so Request 2 is not likely a violation. (Module 42.6, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 41–44 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Brandon Ratlieff, CFA, is a partner at Global Asset Management (GAM). CFA program candidate Sarah Gunderson just completed her first year at GAM. Ratlieff is going over Gunderson&#x27;s annual evaluation completed by her supervisor Peter Jackson, CFA.<\/p><p>To supplement the meager income from her entry-level stock-analysis job, Gunderson took a part-time position working three hours each Friday and Saturday night tending bar at a sports bar and grill downtown. Gunderson did not inform her supervisor or HR about the job.<\/p><p>During her first week, Gunderson has lunch with her former classmates, including Taira Basch, CFA, who works for the compliance officer at a large investment bank in town.<\/p><p>Basch arrives late, explaining, &quot;What a day, it&#x27;s only noon and already I have worked on the following requests:<\/p><p>1. A federal regulator called and wanted information on potentially illegal activities related to one of the firm&#x27;s key clients.<\/p><p>2. A rival company&#x27;s employee wanted information regarding employment opportunities at the firm.<\/p><p>3. A potential client contacted an employee and wanted detailed performance records of client accounts so he can decide whether to invest with the firm.&quot;<\/p><p>One of GAM&#x27;s clients is Bluestar Inc. Several months ago, Ratlieff filed several documents with regulators concerning Bluestar&#x27;s IPO. A Bluestar official later provided Ratlieff information that suggested that the financial statements GAM filed with the regulator overstate the issuer&#x27;s earnings.<\/p><p>Ratlieff seeks the advice of GAM&#x27;s general counsel, who states that because Ratlieff was not aware of the irregularity at the time of the filing, it would be difficult for the regulator to prove that GAM has been involved in any wrongdoing.<\/p><p>GAM provides research coverage for ASE, a European retailer. Gunderson&#x27;s mother owns 30,000 ASE shares. As part of her estate planning, Gunderson&#x27;s mother informs Gunderson that she has created a trust in Gunderson&#x27;s name, into which she has placed 2,000 shares of ASE. The trust is structured so that Gunderson will not receive control of the assets for three years. Gunderson is due to update the research coverage of ASE within the next two weeks.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the requests, if fulfilled, is most likely to place Basch in violation of Standard III(E) Preservation of Confidentiality?<\/p><\/div>","subj":"ethics"},{"n":43,"q":"With respect to the information about Bluestar, Ratlieff's most appropriate course of action would be to:","opts":["treat the information received from the company official as confidential.","seek independent legal counsel about his obligations under the law.","report the information to the regulator."],"ans":"B","expl":"Although it is recommended that members and candidates seek the advice of legal counsel, the reliance on such advice does not absolve a member or candidate from his responsibilities under Standard I(A) – Knowledge of Law. Ratlieff should recognize that the recommendation of the firm's general counsel was not in compliance with the law. There is no requirement under the Standards to report violations to governmental authorities. (Module 42.1, LOS 42.a)","explhtml":"<p>Although it is recommended that members and candidates seek the advice of legal counsel, the reliance on such advice does not absolve a member or candidate from his responsibilities under Standard I(A) – Knowledge of Law. Ratlieff should recognize that the recommendation of the firm&#x27;s general counsel was not in compliance with the law. There is no requirement under the Standards to report violations to governmental authorities. (Module 42.1, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 41–44 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Brandon Ratlieff, CFA, is a partner at Global Asset Management (GAM). CFA program candidate Sarah Gunderson just completed her first year at GAM. Ratlieff is going over Gunderson&#x27;s annual evaluation completed by her supervisor Peter Jackson, CFA.<\/p><p>To supplement the meager income from her entry-level stock-analysis job, Gunderson took a part-time position working three hours each Friday and Saturday night tending bar at a sports bar and grill downtown. Gunderson did not inform her supervisor or HR about the job.<\/p><p>During her first week, Gunderson has lunch with her former classmates, including Taira Basch, CFA, who works for the compliance officer at a large investment bank in town.<\/p><p>Basch arrives late, explaining, &quot;What a day, it&#x27;s only noon and already I have worked on the following requests:<\/p><p>1. A federal regulator called and wanted information on potentially illegal activities related to one of the firm&#x27;s key clients.<\/p><p>2. A rival company&#x27;s employee wanted information regarding employment opportunities at the firm.<\/p><p>3. A potential client contacted an employee and wanted detailed performance records of client accounts so he can decide whether to invest with the firm.&quot;<\/p><p>One of GAM&#x27;s clients is Bluestar Inc. Several months ago, Ratlieff filed several documents with const CFG = {"title": "Schweser Mock 5 (2025) — Session 1", "subtitle": "CFA Level II · 44 câu · 2h12p", "minutes": 132, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;

let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);

}

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<style id="qnav-note-css">
  #navGrid .cell.noted::before{content:"\1F4DD";position:absolute;top:-4px;left:-3px;font-size:10px;line-height:1}
</style>
<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script id="qnotes-panel-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("qnotesPanel");}
  window.qnotesOpen=function(){
    var fr=document.getElementById("qnotesFrame");
    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.qnotesClose=function(){
    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
