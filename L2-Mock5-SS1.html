million. The remaining useful life of the PP&amp;E is 10 years with no salvage value. Both firms use the straight-line depreciation method.<\/p><p>For the year ended 2018, Optimax reported net income of $250,000 and paid dividends of $100,000.<\/p><p>During the first quarter of 2019, Optimax sold goods to Wayland and recognized $15,000 of profit from the sale. At the end of the quarter, half of the goods purchased from Optimax remained in Wayland&#x27;s inventory.<\/p><p>Wayland currently uses the equity method to account for its investment in Optimax.<\/p><p>Rathbun also notes that Wayland owns shares in Vanry, Inc. (Vanry). Rathbun gathers the data in  Exhibit 2: Share Transaction Data, Vanry, Inc. from Wayland&#x27;s financial statements. The year-end portfolio value is the market value of all Vanry shares held on December 31. All security transactions occurred on July 1, and the transaction price is the price that Wayland actually paid for the shares acquired. Vanry pays a cash dividend of $1 per share at the end of each year. Wayland expects to sell its investment in Vanry in the near term and accounts for it as fair value through profit or loss security.<\/p><p>Exhibit 2: Share Transaction Data, Vanry, Inc.<\/p><div class=\"tbl\"><table><tr><td>Year-End Portfolio<\/td><td>Year-End<\/td><td>Year-End<\/td><td>Transaction Price<\/td><\/tr><\/table><\/div><p>Year<\/p><div class=\"tbl\"><table><tr><td>Value<\/td><td>Shares Held<\/td><td>Share Price<\/td><td>(July 1)<\/td><td><\/td><\/tr><tr><td>2017<\/td><td>$1,875,000 25,000<\/td><td><sup>a<\/sup><\/td><td>$75<\/td><td>$85<\/td><\/tr><tr><td>2018<\/td><td>$2,280,000<\/td><td>30,000<\/td><td>$76<\/td><td>$78<\/td><\/tr><\/table><\/div><p>a Purchased on July 1, 2017.<\/p><\/div><\/details><div class=\"qtext\"><p>As a result of its investment in Vanry, the amount of profit that Wayland should recognize in its income statement for the year ended 2018 is closest to:<\/p><\/div>","subj":"fsa"},{"n":13,"q":"Compared to the temporal method, which of the following financial statement elements of the parent are lower under the current rate method?","opts":["Cash and accounts receivable.","Depreciation expense and cost of goods sold.","Common stock and dividends paid."],"ans":"B","expl":"Depreciation expense and COGS are remeasured at the historical rate under the temporal method. Under the current rate method, depreciation and COGS are translated at the average rate. Because the U.S. dollar is depreciating, depreciation expense and COGS are lower under the current rate method. (Module 10.5, LOS 10.e)","explhtml":"<p>Depreciation expense and COGS are remeasured at the historical rate under the temporal method. Under the current rate method, depreciation and COGS are translated at the average rate. Because the U.S. dollar is depreciating, depreciation expense and COGS are lower under the current rate method. (Module 10.5, LOS 10.e)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Ota L&#x27;Abbe, a supervisor at an investment research firm, has asked one of the junior analysts, Andreas Hally, to draft a research report dealing with various accounting issues.<\/p><p>Excerpts from the request are as follows:<\/p><p>&quot;There&#x27;s an exciting company that we&#x27;re starting to follow these days. It&#x27;s called Snowboards and Skateboards, Inc. They are a multinational company with operations and a head office based in the resort town of Whistler in western Canada. However, they also have a significant subsidiary located in the United States.&quot; &quot;Look at the subsidiary and deal with some foreign currency issues, including the specific differences between the temporal and current rate methods of translation, as well as the effect on financial ratios.&quot;<\/p><p>&quot;The attached file contains the September 30, 2018, financial statements of the U.S. subsidiary. Translate the financial statements into Canadian dollars in a manner consistent with U.S. GAAP.&quot;<\/p><p>Snowboards and Skateboards, Inc. (U.S.) (U.S. Dollars) Balance Sheet as of 9/30/2018<\/p><div class=\"tbl\"><table><tr><td>Cash and accounts receivable<\/td><td>775,000<\/td><\/tr><tr><td>Inventory<\/td><td>600,000<\/td><\/tr><tr><td>Property, plant, and equipment (PP&amp;E) – net<\/td><td>730,000<\/td><\/tr><tr><td>Total assets<\/td><td>2,105,000<\/td><\/tr><tr><td>Accounts payable<\/td><td>125,000<\/td><\/tr><tr><td>Long-term debt<\/td><td>400,000<\/td><\/tr><tr><td>Common stock<\/td><td>535,000<\/td><\/tr><tr><td>Retained earnings<\/td><td>1,045,000<\/td><\/tr><tr><td>Total liabilities and shareholders&#x27; equity<\/td><td>2,105,000<\/td><\/tr><\/table><\/div><p>Income statement for the year ended 9/30/2018<\/p><div class=\"tbl\"><table><tr><td>Sales<\/td><td>1,352,000<\/td><\/tr><tr><td>Cost of goods sold<\/td><td>(1,205,000)<\/td><\/tr><tr><td>Depreciation<\/td><td>(140,000)<\/td><\/tr><tr><td>Net income<\/td><td>7,000<\/td><\/tr><\/table><\/div><p>Other information to be considered:<\/p><p>Exchange rates (CAD/USD)<\/p><div class=\"tbl\"><table><tr><td>Fiscal 2017 (average)<\/td><td>1.44<\/td><\/tr><tr><td>Fiscal 2018 (average)<\/td><td>1.35<\/td><\/tr><tr><td>October 1, 2014<\/td><td>1.50<\/td><\/tr><tr><td>September 30, 2017<\/td><td>1.48<\/td><\/tr><tr><td>June 30, 2018<\/td><td>1.37<\/td><\/tr><tr><td>September 30, 2018<\/td><td>1.32<\/td><\/tr><\/table><\/div><p>Beginning inventory for fiscal 2018 had been purchased evenly throughout fiscal 2017. The company uses the FIFO inventory value method. Dividends of USD 25,000 were declared on June 30, 2018. All of the remaining inventory at the end of fiscal 2018 was purchased evenly throughout fiscal 2018.<\/p><p>All of the PP&amp;E was purchased, and all of the common equity was issued at the inception of the company on October 1, 2014. No new PP&amp;E has been acquired, and no additional common stock has been issued since then. However, they plan to purchase new PP&amp;E starting in fiscal 2019. The beginning retained earnings balance for fiscal 2018 was CAD 1,550,000. The accounts payable on the fiscal 2018 balance sheet were all incurred on June 30, 2018.<\/p><p>The U.S. subsidiary&#x27;s operations are highly integrated with the main operations in Canada.<\/p><p>The remeasured inventory for 2018 using the temporal method is CAD 810,000. Costs of goods sold under the temporal method in 2018 is CAD 1,667,250.<\/p><\/div><\/details><div class=\"qtext\"><p>Compared to the temporal method, which of the following financial statement elements of the parent are lower under the current rate method?<\/p><\/div>","subj":"fsa"},{"n":14,"q":"Using the appropriate translation method, which of the following best describes the effect of changing exchange rates on the parent's fiscal 2018 financial statements?","opts":["An accumulated loss of CAD 242,100 is reported in the shareholders’ equity.","A loss of CAD 31,200 is recognized in the income statement.","A gain of CAD 27,400 is recognized in the income statement."],"ans":"B","expl":"Because the subsidiary's operations are highly integrated with the parent, the temporal method is used. Accordingly, a loss of CAD 31,200 is recognized in the parent's income statement (see balance sheet and income statement worksheet next). However, no calculations are actually necessary to answer this question. The parent has a net monetary asset position in the subsidiary (monetary assets > monetary liabilities). Holding net monetary assets when the foreign currency is depreciating will result in a loss. Under the temporal method, the loss is reported in the income statement. Only choice B satisfies this logic.\nThe Canadian dollar is the functional currency because the subsidiary is highly integrated with the parent. Therefore, the temporal method applies.\nStep 1: | Remeasure the balance sheet using the temporal method.\n2018 (USD) | Rate | 2018 (CAD)\nCash and account receivables | 775,000 | 1.32 | 1,023,000\nInventory (given in Item 9) | 600,000 | Given | 810,000\nPP&E (net) | 730,000 | 1.50 | 1,095,000\nTotal assets | 2,105,000 | 2,928,000\nAccounts payable | 125,000 | 1.32 | 165,000\nLong-term debt | 400,000 | 1.32 | 528,000\nCommon stock | 535,000 | 1.50 | 802,500\nRetained earnings | 1,045,000 | (a) | 1,432,500\nTotal liabilities and shareholders'\n2,105,000 | 2,928,000\nequity\n(a) Retained earnings is a plug figure that makes the accounting equation balance CAD 2,928,000 assets − CAD 165,000 accounts payable − CAD 528,000 long-term debt − CAD 802,500 common stock = CAD 1,432,500.\nStep 2: | Derive net income from the beginning and ending balances of retained earnings and dividends paid as follows:\nCAD\nBeginning retained earnings | 1,550,000 | Given Item 6\nNet income | (83,250) | Calculate\nDividends paid in the year | (34,250) | (25,000 × 1.37 historical rate)\nEnding retained earnings | 1,432,500 | From Step 1\nStep 3: | Remeasure the income statement using the temporal method.\n2018 (USD) | Rate | 2018 (CAD)\nSales | 1,352,000 | 1.35 | 1,825,200\nCost of goods sold (given Item 11) | (1,205,000) | Given | (1,667,250)\nDepreciation expense | (140,000) | 1.50 | (210,000)\nRemeasurement loss | (b) | (31,200)\nNet income | 7,000 | From Step 2 | (83,250)\n(b) The remeasurement loss is a plug that is equal to the difference in net income of −CAD 83,250 and income before remeasurement of –CAD 52,050 (CAD 1,825,200 sales − CAD 1,667,250 COGS − CAD 210,000 depreciation).\n(Module 10.5, LOS 10.e)","explhtml":"<p>Because the subsidiary&#x27;s operations are highly integrated with the parent, the temporal method is used. Accordingly, a loss of CAD 31,200 is recognized in the parent&#x27;s income statement (see balance sheet and income statement worksheet next). However, no calculations are actually necessary to answer this question. The parent has a net monetary asset position in the subsidiary (monetary assets &gt; monetary liabilities). Holding net monetary assets when the foreign currency is depreciating will result in a loss. Under the temporal method, the loss is reported in the income statement. Only choice B satisfies this logic.<\/p><p>The Canadian dollar is the functional currency because the subsidiary is highly integrated with the parent. Therefore, the temporal method applies.<\/p><div class=\"tbl\"><table><tr><td>Step 1:<\/td><td>Remeasure the balance sheet using the temporal method.<\/td><td><\/td><td><\/td><\/tr><tr><td>2018 (USD)<\/td><td>Rate<\/td><td>2018 (CAD)<\/td><td><\/td><\/tr><tr><td>Cash and account receivables<\/td><td>775,000<\/td><td>1.32<\/td><td>1,023,000<\/td><\/tr><tr><td>Inventory (given in Item 9)<\/td><td>600,000<\/td><td>Given<\/td><td>810,000<\/td><\/tr><tr><td>PP&amp;E (net)<\/td><td>730,000<\/td><td>1.50<\/td><td>1,095,000<\/td><\/tr><tr><td>Total assets<\/td><td>2,105,000<\/td><td>2,928,000<\/td><td><\/td><\/tr><tr><td>Accounts payable<\/td><td>125,000<\/td><td>1.32<\/td><td>165,000<\/td><\/tr><tr><td>Long-term debt<\/td><td>400,000<\/td><td>1.32<\/td><td>528,000<\/td><\/tr><tr><td>Common stock<\/td><td>535,000<\/td><td>1.50<\/td><td>802,500<\/td><\/tr><tr><td>Retained earnings<\/td><td>1,045,000<\/td><td>(a)<\/td><td>1,432,500<\/td><\/tr><\/table><\/div><p>Total liabilities and shareholders&#x27;<\/p><div class=\"tbl\"><table><tr><td>2,105,000<\/td><td>2,928,000<\/td><\/tr><\/table><\/div><p>equity<\/p><p>(a) Retained earnings is a plug figure that makes the accounting equation balance CAD 2,928,000 assets − CAD 165,000 accounts payable − CAD 528,000 long-term debt − CAD 802,500 common stock = CAD 1,432,500.<\/p><div class=\"tbl\"><table><tr><td>Step 2:<\/td><td>Derive net income from the beginning and ending balances of retained earnings and dividends paid as follows:<\/td><\/tr><\/table><\/div><p>CAD<\/p><div class=\"tbl\"><table><tr><td>Beginning retained earnings<\/td><td>1,550,000<\/td><td>Given Item 6<\/td><td><\/td><\/tr><tr><td>Net income<\/td><td>(83,250)<\/td><td>Calculate<\/td><td><\/td><\/tr><tr><td>Dividends paid in the year<\/td><td>(34,250)<\/td><td>(25,000 × 1.37 historical rate)<\/td><td><\/td><\/tr><tr><td>Ending retained earnings<\/td><td>1,432,500<\/td><td>From Step 1<\/td><td><\/td><\/tr><tr><td>Step 3:<\/td><td>Remeasure the income statement using the temporal method.<\/td><td><\/td><td><\/td><\/tr><tr><td>2018 (USD)<\/td><td>Rate<\/td><td>2018 (CAD)<\/td><td><\/td><\/tr><tr><td>Sales<\/td><td>1,352,000<\/td><td>1.35<\/td><td>1,825,200<\/td><\/tr><tr><td>Cost of goods sold (given Item 11)<\/td><td>(1,205,000)<\/td><td>Given<\/td><td>(1,667,250)<\/td><\/tr><tr><td>Depreciation expense<\/td><td>(140,000)<\/td><td>1.50<\/td><td>(210,000)<\/td><\/tr><tr><td>Remeasurement loss<\/td><td>(b)<\/td><td>(31,200)<\/td><td><\/td><\/tr><tr><td>Net income<\/td><td>7,000<\/td><td>From Step 2<\/td><td>(83,250)<\/td><\/tr><\/table><\/div><p>(b) The remeasurement loss is a plug that is equal to the difference in net income of −CAD 83,250 and income before remeasurement of –CAD 52,050 (CAD 1,825,200 sales − CAD 1,667,250 COGS − CAD 210,000 depreciation).<\/p><p>(Module 10.5, LOS 10.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ota L&#x27;Abbe, a supervisor at an investment research firm, has asked one of the junior analysts, Andreas Hally, to draft a research report dealing with various accounting issues.<\/p><p>Excerpts from the request are as follows:<\/p><p>&quot;There&#x27;s an exciting company that we&#x27;re starting to follow these days. It&#x27;s called Snowboards and Skateboards, Inc. They are a multinational company with operations and a head office based in the resort town of Whistler in western Canada. However, they also have a significant subsidiary located in the United States.&quot; &quot;Look at the subsidiary and deal with some foreign currency issues, including the specific differences between the temporal and current rate methods of translation, as well as the effect on financial ratios.&quot;<\/p><p>&quot;The attached file contains the September 30, 2018, financial statements of the U.S. subsidiary. Translate the financial statements into Canadian dollars in a manner consistent with U.S. GAAP.&quot;<\/p><p>Snowboards and Skateboards, Inc. (U.S.) (U.S. Dollars) Balance Sheet as of 9/30/2018<\/p><div class=\"tbl\"><table><tr><td>Cash and accounts receivable<\/td><td>775,000<\/td><\/tr><tr><td>Inventory<\/td><td>600,000<\/td><\/tr><tr><td>Property, plant, and equipment (PP&amp;E) – net<\/td><td>730,000<\/td><\/tr><tr><td>Total assets<\/td><td>2,105,000<\/td><\/tr><tr><td>Accounts payable<\/td><td>125,000<\/td><\/tr><tr><td>Long-term debt<\/td><td>400,000<\/td><\/tr><tr><td>Common stock<\/td><td>535,000<\/td><\/tr><tr><td>Retained earnings<\/td><td>1,045,000<\/td><\/tr><tr><td>Total liabilities and shareholders&#x27; equity<\/td><td>2,105,000<\/td><\/tr><\/table><\/div><p>Income statement for the year ended 9/30/2018<\/p><div class=\"tbl\"><table><tr><td>Sales<\/td><td>1,352,000<\/td><\/tr><tr><td>Cost of goods sold<\/td><td>(1,205,000)<\/td><\/tr><tr><td>Depreciation<\/td><td>(140,000)<\/td><\/tr><tr><td>Net income<\/td><td>7,000<\/td><\/tr><\/table><\/div><p>Other information to be considered:<\/p><p>Exchange rates (CAD/USD)<\/p><div class=\"tbl\"><table><tr><td>Fiscal 2017 (average)<\/td><td>1.44<\/td><\/tr><tr><td>Fiscal 2018 (average)<\/td><td>1.35<\/td><\/tr><tr><td>October 1, 2014<\/td><td>1.50<\/td><\/tr><tr><td>September 30, 2017<\/td><td>1.48<\/td><\/tr><tr><td>June 30, 2018<\/td><td>1.37<\/td><\/tr><tr><td>September 30, 2018<\/td><td>1.32<\/td><\/tr><\/table><\/div><p>Beginning inventory for fiscal 2018 had been purchased evenly throughout fiscal 2017. The company uses the FIFO inventory value method. Dividends of USD 25,000 were declared on June 30, 2018. All of the remaining inventory at the end of fiscal 2018 was purchased evenly throughout fiscal 2018.<\/p><p>All of the PP&amp;E was purchased, and all of the common equity was issued at the inception of the company on October 1, 2014. No new PP&amp;E has been acquired, and no additional common stock has been issued since then. However, they plan to purchase new PP&amp;E starting in fiscal 2019. The beginning retained earnings balance for fiscal 2018 was CAD 1,550,000. The accounts payable on the fiscal 2018 balance sheet were all incurred on June 30, 2018.<\/p><p>The U.S. subsidiary&#x27;s operations are highly integrated with the main operations in Canada.<\/p><p>The remeasured inventory for 2018 using the temporal method is CAD 810,000. Costs of goods sold under the temporal method in 2018 is CAD 1,667,250.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the appropriate translation method, which of the following best describes the effect of changing exchange rates on the parent&#x27;s fiscal 2018 financial statements?<\/p><\/div>","subj":"fsa"},{"n":15,"q":"As compared to the temporal method, the parent's fixed asset turnover for fiscal 2018 using the current rate method is:","opts":["higher.","lower.","the same."],"ans":"A","expl":"The local currency (the USD) is depreciating, so the historical rate will be higher than the current rate. Fixed asset turnover (sales divided by net PP&E) will be higher under the current rate method. Net PP&E will be translated at the lower current rate, and because sales are the same under both methods, the ratio will be higher. If you want to do the calculations, net PP&E under the current rate method is USD 730,000 × 1.32 CAD/USD = CAD 963,600, and fixed asset turnover is CAD 1,825,200 / CAD 963,600 = 1.9 times. Fixed asset turnover under the temporal method is CAD 1,825,200 / CAD 1,095,000 = 1.7 times. (Module 10.3, LOS 10.d)","explhtml":"<p>The local currency (the USD) is depreciating, so the historical rate will be higher than the current rate. Fixed asset turnover (sales divided by net PP&amp;E) will be higher under the current rate method. Net PP&amp;E will be translated at the lower current rate, and because sales are the same under both methods, the ratio will be higher. If you want to do the calculations, net PP&amp;E under the current rate method is USD 730,000 × 1.32 CAD/USD = CAD 963,600, and fixed asset turnover is CAD 1,825,200 / CAD 963,600 = 1.9 times. Fixed asset turnover under the temporal method is CAD 1,825,200 / CAD 1,095,000 = 1.7 times. (Module 10.3, LOS 10.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ota L&#x27;Abbe, a supervisor at an investment research firm, has asked one of the junior analysts, Andreas Hally, to draft a research report dealing with various accounting issues.<\/p><p>Excerpts from the request are as follows:<\/p><p>&quot;There&#x27;s an exciting company that we&#x27;re starting to follow these days. It&#x27;s called Snowboards and Skateboards, Inc. They are a multinational company with operations and a head office based in the resort town of Whistler in western Canada. However, they also have a significant subsidiary located in the United States.&quot; &quot;Look at the subsidiary and deal with some foreign currency issues, including the specific differences between the temporal and current rate methods of translation, as well as the effect on financial ratios.&quot;<\/p><p>&quot;The attached file contains the September 30, 2018, financial statements of the U.S. subsidiary. Translate the financial statements into Canadian dollars in a manner consistent with U.S. GAAP.&quot;<\/p><p>Snowboards and Skateboards, Inc. (U.S.) (U.S. Dollars) Balance Sheet as of 9/30/2018<\/p><div class=\"tbl\"><table><tr><td>Cash and accounts receivable<\/td><td>775,000<\/td><\/tr><tr><td>Inventory<\/td><td>600,000<\/td><\/tr><tr><td>Property, plant, and equipment (PP&amp;E) – net<\/td><td>730,000<\/td><\/tr><tr><td>Total assets<\/td><td>2,105,000<\/td><\/tr><tr><td>Accounts payable<\/td><td>125,000<\/td><\/tr><tr><td>Long-term debt<\/td><td>400,000<\/td><\/tr><tr><td>Common stock<\/td><td>535,000<\/td><\/tr><tr><td>Retained earnings<\/td><td>1,045,000<\/td><\/tr><tr><td>Total liabilities and shareholders&#x27; equity<\/td><td>2,105,000<\/td><\/tr><\/table><\/div><p>Income statement for the year ended 9/30/2018<\/p><div class=\"tbl\"><table><tr><td>Sales<\/td><td>1,352,000<\/td><\/tr><tr><td>Cost of goods sold<\/td><td>(1,205,000)<\/td><\/tr><tr><td>Depreciation<\/td><td>(140,000)<\/td><\/tr><tr><td>Net income<\/td><td>7,000<\/td><\/tr><\/table><\/div><p>Other information to be considered:<\/p><p>Exchange rates (CAD/USD)<\/p><div class=\"tbl\"><table><tr><td>Fiscal 2017 (average)<\/td><td>1.44<\/td><\/tr><tr><td>Fiscal 2018 (average)<\/td><td>1.35<\/td><\/tr><tr><td>October 1, 2014<\/td><td>1.50<\/td><\/tr><tr><td>September 30, 2017<\/td><td>1.48<\/td><\/tr><tr><td>June 30, 2018<\/td><td>1.37<\/td><\/tr><tr><td>September 30, 2018<\/td><td>1.32<\/td><\/tr><\/table><\/div><p>Beginning inventory for fiscal 2018 had been purchased evenly throughout fiscal 2017. The company uses the FIFO inventory value method. Dividends of USD 25,000 were declared on June 30, 2018. All of the remaining inventory at the end of fiscal 2018 was purchased evenly throughout fiscal 2018.<\/p><p>All of the PP&amp;E was purchased, and all of the common equity was issued at the inception of the company on October 1, 2014. No new PP&amp;E has been acquired, and no additional common stock has been issued since then. However, they plan to purchase new PP&amp;E starting in fiscal 2019. The beginning retained earnings balance for fiscal 2018 was CAD 1,550,000. The accounts payable on the fiscal 2018 balance sheet were all incurred on June 30, 2018.<\/p><p>The U.S. subsidiary&#x27;s operations are highly integrated with the main operations in Canada.<\/p><p>The remeasured inventory for 2018 using the temporal method is CAD 810,000. Costs of goods sold under the temporal method in 2018 is CAD 1,667,250.<\/p><\/div><\/details><div class=\"qtext\"><p>As compared to the temporal method, the parent&#x27;s fixed asset turnover for fiscal 2018 using the current rate method is:<\/p><\/div>","subj":"fsa"},{"n":16,"q":"Suppose the parent uses the current rate method to translate the subsidiary for fiscal 2018. Will return on assets and net profit margin in U.S. dollars before translation be the same as, or different than, the translated Canadian dollar ratios?\nReturn on assets | Net profit margin","opts":["Same Different","Different Different","Different Same"],"ans":"A","expl":"Return on assets prior to translation will be different than the ratio after translation because the numerator (net income) is translated at the average rate, and the denominator (assets) is translated at the current rate using the current rate method. Net profit margin will be the same because both the numerator (net income) and the denominator (sales) are translated at the average rate using the current rate method. (Module 10.6, LOS 10.f)","explhtml":"<p>Return on assets prior to translation will be different than the ratio after translation because the numerator (net income) is translated at the average rate, and the denominator (assets) is translated at the current rate using the current rate method. Net profit margin will be the same because both the numerator (net income) and the denominator (sales) are translated at the average rate using the current rate method. (Module 10.6, LOS 10.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ota L&#x27;Abbe, a supervisor at an investment research firm, has asked one of the junior analysts, Andreas Hally, to draft a research report dealing with various accounting issues.<\/p><p>Excerpts from the request are as follows:<\/p><p>&quot;There&#x27;s an exciting company that we&#x27;re starting to follow these days. It&#x27;s called Snowboards and Skateboards, Inc. They are a multinational company with operations and a head office based in the resort town of Whistler in western Canada. However, they also have a significant subsidiary located in the United States.&quot; &quot;Look at the subsidiary and deal with some foreign currency issues, including the specific differences between the temporal and current rate methods of translation, as well as the effect on financial ratios.&quot;<\/p><p>&quot;The attached file contains the September 30, 2018, financial statements of the U.S. subsidiary. Translate the financial statements into Canadian dollars in a manner consistent with U.S. GAAP.&quot;<\/p><p>Snowboards and Skateboards, Inc. (U.S.) (U.S. Dollars) Balance Sheet as of 9/30/2018<\/p><div class=\"tbl\"><table><tr><td>Cash and accounts receivable<\/td><td>775,000<\/td><\/tr><tr><td>Inventory<\/td><td>600,000<\/td><\/tr><tr><td>Property, plant, and equipment (PP&amp;E) – net<\/td><td>730,000<\/td><\/tr><tr><td>Total assets<\/td><td>2,105,000<\/td><\/tr><tr><td>Accounts payable<\/td><td>125,000<\/td><\/tr><tr><td>Long-term debt<\/td><td>400,000<\/td><\/tr><tr><td>Common stock<\/td><td>535,000<\/td><\/tr><tr><td>Retained earnings<\/td><td>1,045,000<\/td><\/tr><tr><td>Total liabilities and shareholders&#x27; equity<\/td><td>2,105,000<\/td><\/tr><\/table><\/div><p>Income statement for the year ended 9/30/2018<\/p><div class=\"tbl\"><table><tr><td>Sales<\/td><td>1,352,000<\/td><\/tr><tr><td>Cost of goods sold<\/td><td>(1,205,000)<\/td><\/tr><tr><td>Depreciation<\/td><td>(140,000)<\/td><\/tr><tr><td>Net income<\/td><td>7,000<\/td><\/tr><\/table><\/div><p>Other information to be considered:<\/p><p>Exchange rates (CAD/USD)<\/p><div class=\"tbl\"><table><tr><td>Fiscal 2017 (average)<\/td><td>1.44<\/td><\/tr><tr><td>Fiscal 2018 (average)<\/td><td>1.35<\/td><\/tr><tr><td>October 1, 2014<\/td><td>1.50<\/td><\/tr><tr><td>September 30, 2017<\/td><td>1.48<\/td><\/tr><tr><td>June 30, 2018<\/td><td>1.37<\/td><\/tr><tr><td>September 30, 2018<\/td><td>1.32<\/td><\/tr><\/table><\/div><p>Beginning inventory for fiscal 2018 had been purchased evenly throughout fiscal 2017. The company uses the FIFO inventory value method. Dividends of USD 25,000 were declared on June 30, 2018. All of the remaining inventory at the end of fiscal 2018 was purchased evenly throughout fiscal 2018.<\/p><p>All of the PP&amp;E was purchased, and all of the common equity was issued at the inception of the company on October 1, 2014. No new PP&amp;E has been acquired, and no additional common stock has been issued since then. However, they plan to purchase new PP&amp;E starting in fiscal 2019. The beginning retained earnings balance for fiscal 2018 was CAD 1,550,000. The accounts payable on the fiscal 2018 balance sheet were all incurred on June 30, 2018.<\/p><p>The U.S. subsidiary&#x27;s operations are highly integrated with the main operations in Canada.<\/p><p>The remeasured inventory for 2018 using the temporal method is CAD 810,000. Costs of goods sold under the temporal method in 2018 is CAD 1,667,250.<\/p><\/div><\/details><div class=\"qtext\"><p>Suppose the parent uses the current rate method to translate the subsidiary for fiscal 2018. Will return on assets and net profit margin in U.S. dollars before translation be the same as, or different than, the translated Canadian dollar ratios?<\/p><div class=\"tbl\"><table><tr><td>Return on assets<\/td><td>Net profit margin<\/td><\/tr><\/table><\/div><\/div>","subj":"fsa"},{"n":17,"q":"Which of the following would be the most appropriate approach for estimating Alertron's cost of equity?","opts":["Gordon growth model.","CAPM.","Exapnded CAPM."],"ans":"B","expl":"We are given that the company's stock trades; hence, we should be able to estimate the company's beta and apply CAPM to calculate the cost of equity. The Gordon growth model is not appropriate here because the company has stopped making dividend payments (and growth may not be constant, given the significant corporate restructuring that may occur). Expanded CAPM is used for privately held companies. (Module 17.2, LOS 17.d)","explhtml":"<p>We are given that the company&#x27;s stock trades; hence, we should be able to estimate the company&#x27;s beta and apply CAPM to calculate the cost of equity. The Gordon growth model is not appropriate here because the company has stopped making dividend payments (and growth may not be constant, given the significant corporate restructuring that may occur). Expanded CAPM is used for privately held companies. (Module 17.2, LOS 17.d)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Corporate Issuers<\/summary><div class=\"vig-body\"><p>Alertron is a retail pharmacy chain with approximately $3.5 billion in annual sales. After rapid expansion into new geographical markets, Alertron&#x27;s same-store sales have been shrinking, and the firm&#x27;s nonpharmacy business has been a drag on the company&#x27;s bottom line. Alertron stopped making dividend payments last quarter, and the company&#x27;s stock is trading at a multiyear low of $11.<\/p><p>New accounting standards will impact the way Alertron reports leases on the company&#x27;s brick-and-mortar stores. These changes will reduce the company&#x27;s fixed-charge coverage ratio below the level specified in the company&#x27;s debt covenants. The market price and the ratings on the company&#x27;s debt have accordingly dropped.<\/p><p>Analysis of the individual lease terms for new stores reveals that a building with a fair value of $10.2 million (including the lessor&#x27;s initial costs) is leased for 20 years for annual payments of $1.08 million. The value of the building after 20 years is estimated to be $4.6 million. Alertron&#x27;s corporate tax rate is 15%.<\/p><p>Phillip Margos, CEO of the company, is preparing for a tough meeting with Alertron&#x27;s board of directors. One of the items that Margos drafts is a list of potential corporate restructuring actions.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following would be the most appropriate approach for estimating Alertron&#x27;s cost of equity?<\/p><\/div>","subj":"corporate"},{"n":18,"q":"The most appropriate cost of debt for Alertron is:","opts":["the YTM on the longest-maturity straight debt outstanding.","the interest rate on a new bank loan.","the RIIL."],"ans":"A","expl":"If the company's debt is traded, then the yield to maturity on the longest-maturity straight debt should be used as the estimate of cost of debt. The rate on new bank loans is only used for companies that rely on bank loans (not given in this case). The rate implicit in the lease (RIIL) provides an estimate of the cost of lease obligations. (Module 17.1, LOS 17.b)","explhtml":"<p>If the company&#x27;s debt is traded, then the yield to maturity on the longest-maturity straight debt should be used as the estimate of cost of debt. The rate on new bank loans is only used for companies that rely on bank loans (not given in this case). The rate implicit in the lease (RIIL) provides an estimate of the cost of lease obligations. (Module 17.1, LOS 17.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alertron is a retail pharmacy chain with approximately $3.5 billion in annual sales. After rapid expansion into new geographical markets, Alertron&#x27;s same-store sales have been shrinking, and the firm&#x27;s nonpharmacy business has been a drag on the company&#x27;s bottom line. Alertron stopped making dividend payments last quarter, and the company&#x27;s stock is trading at a multiyear low of $11.<\/p><p>New accounting standards will impact the way Alertron reports leases on the company&#x27;s brick-and-mortar stores. These changes will reduce the company&#x27;s fixed-charge coverage ratio below the level specified in the company&#x27;s debt covenants. The market price and the ratings on the company&#x27;s debt have accordingly dropped.<\/p><p>Analysis of the individual lease terms for new stores reveals that a building with a fair value of $10.2 million (including the lessor&#x27;s initial costs) is leased for 20 years for annual payments of $1.08 million. The value of the building after 20 years is estimated to be $4.6 million. Alertron&#x27;s corporate tax rate is 15%.<\/p><p>Phillip Margos, CEO of the company, is preparing for a tough meeting with Alertron&#x27;s board of directors. One of the items that Margos drafts is a list of potential corporate restructuring actions.<\/p><\/div><\/details><div class=\"qtext\"><p>The most appropriate cost of debt for Alertron is:<\/p><\/div>","subj":"corporate"},{"n":19,"q":"The rate implicit in the lease for new stores is closest to:","opts":["8.14%.","8.53%.","9.58%."],"ans":"C","expl":"PV = -10.6, N = 20, PMT = 1.08, and FV = 4.6. CPT I/Y = 9.58%. (Module 17.1, LOS 17.e)","explhtml":"<p>PV = -10.6, N = 20, PMT = 1.08, and FV = 4.6. CPT I/Y = 9.58%. (Module 17.1, LOS 17.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alertron is a retail pharmacy chain with approximately $3.5 billion in annual sales. After rapid expansion into new geographical markets, Alertron&#x27;s same-store sales have been shrinking, and the firm&#x27;s nonpharmacy business has been a drag on the company&#x27;s bottom line. Alertron stopped making dividend payments last quarter, and the company&#x27;s stock is trading at a multiyear low of $11.<\/p><p>New accounting standards will impact the way Alertron reports leases on the company&#x27;s brick-and-mortar stores. These changes will reduce the company&#x27;s fixed-charge coverage ratio below the level specified in the company&#x27;s debt covenants. The market price and the ratings on the company&#x27;s debt have accordingly dropped.<\/p><p>Analysis of the individual lease terms for new stores reveals that a building with a fair value of $10.2 million (including the lessor&#x27;s initial costs) is leased for 20 years for annual payments of $1.08 million. The value of the building after 20 years is estimated to be $4.6 million. Alertron&#x27;s corporate tax rate is 15%.<\/p><p>Phillip Margos, CEO of the company, is preparing for a tough meeting with Alertron&#x27;s board of directors. One of the items that Margos drafts is a list of potential corporate restructuring actions.<\/p><\/div><\/details><div class=\"qtext\"><p>The rate implicit in the lease for new stores is closest to:<\/p><\/div>","subj":"corporate"},{"n":20,"q":"Which of the following corporate restructuring actions would be least appropriate for Margos to include in his presentation to the board?","opts":["Acquisition.","Divestiture.","Cost restructuring."],"ans":"A","expl":"Alertron is facing potential violation of debt covenants. In a divestiture, Alertron would sell a segment of the company (or group of assets) to an acquirer for cash, which would allow Alertron to reallocate capital to debt reduction. A cost restructuring could similarly help to fend off violations in debt covenants. An acquisition, on the other hand, would involve expending scarce corporate resources, which is likely to be inappropriate for Alertron at this time. (Module 18.1, LOS 18.a)","explhtml":"<p>Alertron is facing potential violation of debt covenants. In a divestiture, Alertron would sell a segment of the company (or group of assets) to an acquirer for cash, which would allow Alertron to reallocate capital to debt reduction. A cost restructuring could similarly help to fend off violations in debt covenants. An acquisition, on the other hand, would involve expending scarce corporate resources, which is likely to be inappropriate for Alertron at this time. (Module 18.1, LOS 18.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alertron is a retail pharmacy chain with approximately $3.5 billion in annual sales. After rapid expansion into new geographical markets, Alertron&#x27;s same-store sales have been shrinking, and the firm&#x27;s nonpharmacy business has been a drag on the company&#x27;s bottom line. Alertron stopped making dividend payments last quarter, and the company&#x27;s stock is trading at a multiyear low of $11.<\/p><p>New accounting standards will impact the way Alertron reports leases on the company&#x27;s brick-and-mortar stores. These changes will reduce the company&#x27;s fixed-charge coverage ratio below the level specified in the company&#x27;s debt covenants. The market price and the ratings on the company&#x27;s debt have accordingly dropped.<\/p><p>Analysis of the individual lease terms for new stores reveals that a building with a fair value of $10.2 million (including the lessor&#x27;s initial costs) is leased for 20 years for annual payments of $1.08 million. The value of the building after 20 years is estimated to be $4.6 million. Alertron&#x27;s corporate tax rate is 15%.<\/p><p>Phillip Margos, CEO of the company, is preparing for a tough meeting with Alertron&#x27;s board of directors. One of the items that Margos drafts is a list of potential corporate restructuring actions.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following corporate restructuring actions would be least appropriate for Margos to include in his presentation to the board?<\/p><\/div>","subj":"corporate"},{"n":21,"q":"For this question only, assume that De Jong's estimate of the value of O'Connor stock using a two-stage DDM is $75. Assuming the market has also applied a two-stage DDM, and the market's consensus estimate of dividend growth and required return are the same as De Jong's, the market's consensus estimate of the duration of the high-growth period is most likely:","opts":["less than three years.","equal to three years.","greater than three years."],"ans":"A","expl":"De Jong's estimate of value of $75 (based on a high-growth period of three years) is greater than the market's consensus of $70, which means the market's consensus high-growth duration must be less than three years, all else equal. (Module 20.1, LOS 20.b)","explhtml":"<p>De Jong&#x27;s estimate of value of $75 (based on a high-growth period of three years) is greater than the market&#x27;s consensus of $70, which means the market&#x27;s consensus high-growth duration must be less than three years, all else equal. (Module 20.1, LOS 20.b)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Emily De Jong, CFA, works for Charles &amp; Williams Associates, a medium-sized investment firm operating in the northeastern United States. De Jong is responsible for producing financial reports to use as tools to attract new clients. It is now early in 2019, and De Jong is reviewing information for O&#x27;Connor Textiles and finalizing a report that will be used for an important presentation to a potential investor at the end of the week.<\/p><p>Following an acquisition of a major competitor in 2002, O&#x27;Connor went public in 2003 and paid its first dividend in 2009. Dividends are paid at the end of the year. After 2018, dividends are expected to grow for three years at 11%: $2.13 in 2019, $2.36 in 2020, and $2.63 in 2021. The average of the arithmetic and compound growth rates are given in  Exhibit 1: O&#x27;Connor Textiles Dividend History. Dividends are then expected to settle down to a long-term growth rate of 4%. O&#x27;Connor&#x27;s current share price of $70 is expected to rise to $72.92 by the end of the year according to the consensus of analysts&#x27; forecasts.<\/p><p>O&#x27;Connor&#x27;s annual dividend history is shown in  Exhibit 1: O&#x27;Connor Textiles Dividend History.<\/p><p>Exhibit 1: O&#x27;Connor Textiles Dividend History<\/p><div class=\"tbl\"><table><tr><td>Year<\/td><td>Dividend ($)<\/td><td>% Change<\/td><\/tr><tr><td>2009<\/td><td>0.76<\/td><td><\/td><\/tr><tr><td>2010<\/td><td>0.76<\/td><td>0.000<\/td><\/tr><tr><td>2011<\/td><td>0.76<\/td><td>0.000<\/td><\/tr><tr><td>2012<\/td><td>0.82<\/td><td>7.895<\/td><\/tr><tr><td>2013<\/td><td>0.91<\/td><td>10.976<\/td><\/tr><tr><td>2014<\/td><td>1.03<\/td><td>13.187<\/td><\/tr><tr><td>2015<\/td><td>1.16<\/td><td>12.621<\/td><\/tr><tr><td>2016<\/td><td>1.34<\/td><td>15.517<\/td><\/tr><tr><td>2017<\/td><td>1.52<\/td><td>13.433<\/td><\/tr><tr><td>2018<\/td><td>1.92<\/td><td>26.316<\/td><\/tr><\/table><\/div><p>2009–2018 Arithmetic mean growth = 11.1%<\/p><p>2009–2018 Compound growth = 10.9%<\/p><p>De Jong is also considering whether or not she should value O&#x27;Connor using a free cash flow model instead of the dividend discount model.<\/p><p>Charles Wang, De Jong&#x27;s colleague, is of the opinion that O&#x27;Connor&#x27;s growth rate will be 11% but will decline linearly to a long-term growth rate of 4% over the next six years. Wang also feels that the required rate of return for O&#x27;Connor should be 9.5%. ​<\/p><\/div><\/details><div class=\"qtext\"><p>For this question only, assume that De Jong&#x27;s estimate of the value of O&#x27;Connor stock using a two-stage DDM is $75. Assuming the market has also applied a two-stage DDM, and the market&#x27;s consensus estimate of dividend growth and required return are the same as De Jong&#x27;s, the market&#x27;s consensus estimate of the duration of the high-growth period is most likely:<\/p><\/div>","subj":"equity"},{"n":22,"q":"In what situation is it most appropriate for De Jong to employ these models?\nDividend discount model | FCFE model","opts":["Noncontrol perspective FCFE aligned with profitability","Control perspective FCFE aligned with profitability","Noncontrol perspective FCFE aligned with dividend policy"],"ans":"A","expl":"For the dividend discount model to produce a reasonable estimate of share price, the investor should have a noncontrol perspective. For the FCFE model to be appropriate, there should be a link between FCFE and profitability. (Module 20.1, LOS 20.a)","explhtml":"<p>For the dividend discount model to produce a reasonable estimate of share price, the investor should have a noncontrol perspective. For the FCFE model to be appropriate, there should be a link between FCFE and profitability. (Module 20.1, LOS 20.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Emily De Jong, CFA, works for Charles &amp; Williams Associates, a medium-sized investment firm operating in the northeastern United States. De Jong is responsible for producing financial reports to use as tools to attract new clients. It is now early in 2019, and De Jong is reviewing information for O&#x27;Connor Textiles and finalizing a report that will be used for an important presentation to a potential investor at the end of the week.<\/p><p>Following an acquisition of a major competitor in 2002, O&#x27;Connor went public in 2003 and paid its first dividend in 2009. Dividends are paid at the end of the year. After 2018, dividends are expected to grow for three years at 11%: $2.13 in 2019, $2.36 in 2020, and $2.63 in 2021. The average of the arithmetic and compound growth rates are given in  Exhibit 1: O&#x27;Connor Textiles Dividend History. Dividends are then expected to settle down to a long-term growth rate of 4%. O&#x27;Connor&#x27;s current share price of $70 is expected to rise to $72.92 by the end of the year according to the consensus of analysts&#x27; forecasts.<\/p><p>O&#x27;Connor&#x27;s annual dividend history is shown in  Exhibit 1: O&#x27;Connor Textiles Dividend History.<\/p><p>Exhibit 1: O&#x27;Connor Textiles Dividend History<\/p><div class=\"tbl\"><table><tr><td>Year<\/td><td>Dividend ($)<\/td><td>% Change<\/td><\/tr><tr><td>2009<\/td><td>0.76<\/td><td><\/td><\/tr><tr><td>2010<\/td><td>0.76<\/td><td>0.000<\/td><\/tr><tr><td>2011<\/td><td>0.76<\/td><td>0.000<\/td><\/tr><tr><td>2012<\/td><td>0.82<\/td><td>7.895<\/td><\/tr><tr><td>2013<\/td><td>0.91<\/td><td>10.976<\/td><\/tr><tr><td>2014<\/td><td>1.03<\/td><td>13.187<\/td><\/tr><tr><td>2015<\/td><td>1.16<\/td><td>12.621<\/td><\/tr><tr><td>2016<\/td><td>1.34<\/td><td>15.517<\/td><\/tr><tr><td>2017<\/td><td>1.52<\/td><td>13.433<\/td><\/tr><tr><td>2018<\/td><td>1.92<\/td><td>26.316<\/td><\/tr><\/table><\/div><p>2009–2018 Arithmetic mean growth = 11.1%<\/p><p>2009–2018 Compound growth = 10.9%<\/p><p>De Jong is also considering whether or not she should value O&#x27;Connor using a free cash flow model instead of the dividend discount model.<\/p><p>Charles Wang, De Jong&#x27;s colleague, is of the opinion that O&#x27;Connor&#x27;s growth rate will be 11% but will decline linearly to a long-term growth rate of 4% over the next six years. Wang also feels that the required rate of return for O&#x27;Connor should be 9.5%. ​<\/p><\/div><\/details><div class=\"qtext\"><p>In what situation is it most appropriate for De Jong to employ these models?<\/p><div class=\"tbl\"><table><tr><td>Dividend discount model<\/td><td>FCFE model<\/td><\/tr><\/table><\/div><\/div>","subj":"equity"},{"n":23,"q":"The value of O'Connor stock using Wang's assumptions is closest to:","opts":["$43.64.","$48.75.", g-term growth rate of 4%. O&#x27;Connor&#x27;s current share price of $70 is expected to rise to $72.92 by the end of the year according to the consensus of analysts&#x27; forecasts.<\/p><p>O&#x27;Connor&#x27;s annual dividend history is shown in  Exhibit 1: O&#x27;Connor Textiles Dividend History.<\/p><p>Exhibit 1: O&#x27;Connor Textiles Dividend History<\/p><div class=\"tbl\"><table><tr><td>Year<\/td><td>Dividend ($)<\/td><td>% Change<\/td><\/tr><tr><td>2009<\/td><td>0.76<\/td><td><\/td><\/tr><tr><td>2010<\/td><td>0.76<\/td><td>0.000<\/td><\/tr><tr><td>2011<\/td><td>0.76<\/td><td>0.000<\/td><\/tr><tr><td>2012<\/td><td>0.82<\/td><td>7.895<\/td><\/tr><tr><td>2013<\/td><td>0.91<\/td><td>10.976<\/td><\/tr><tr><td>2014<\/td><td>1.03<\/td><td>13.187<\/td><\/tr><tr><td>2015<\/td><td>1.16<\/td><td>12.621<\/td><\/tr><tr><td>2016<\/td><td>1.34<\/td><td>15.517<\/td><\/tr><tr><td>2017<\/td><td>1.52<\/td><td>13.433<\/td><\/tr><tr><td>2018<\/td><td>1.92<\/td><td>26.316<\/td><\/tr><\/table><\/div><p>2009–2018 Arithmetic mean growth = 11.1%<\/p><p>2009–2018 Compound growth = 10.9%<\/p><p>De Jong is also considering whether or not she should value O&#x27;Connor using a free cash flow model instead of the dividend discount model.<\/p><p>Charles Wang, De Jong&#x27;s colleague, is of the opinion that O&#x27;Connor&#x27;s growth rate will be 11% but will decline linearly to a long-term growth rate of 4% over the next six years. Wang also feels that the required rate of return for O&#x27;Connor should be 9.5%. ​<\/p><\/div><\/details><div class=\"qtext\"><p>The value of O&#x27;Connor stock using Wang&#x27;s assumptions is closest to:<\/p><\/div>","subj":"equity"},{"n":24,"q":"For this question only, assume that the market price of O'Connor stock is $48.00 and the linearly declining high-growth period is five years. The required rate of return implicit in the market price is closest to:","opts":["8.86%.","9.22%.","10.81%."],"ans":"A","expl":"D0\nr | = [( P0 1.92 | ) × [(1 + gL) + [H × (gS −gL)]]] + gL\n= [( 48 | ) × [(1.04) + (2.5 × 0.07)]] + 0.04 = 0.0886\n(Module 20.3, LOS 20.i)","explhtml":"<p>D0<\/p><div class=\"tbl\"><table><tr><td>r<\/td><td>= [( P0 1.92<\/td><td>) × [(1 + gL) + [H × (gS −gL)]]] + gL<\/td><\/tr><tr><td>= [( 48<\/td><td>) × [(1.04) + (2.5 × 0.07)]] + 0.04 = 0.0886<\/td><td><\/td><\/tr><\/table><\/div><p>(Module 20.3, LOS 20.i)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Emily De Jong, CFA, works for Charles &amp; Williams Associates, a medium-sized investment firm operating in the northeastern United States. De Jong is responsible for producing financial reports to use as tools to attract new clients. It is now early in 2019, and De Jong is reviewing information for O&#x27;Connor Textiles and finalizing a report that will be used for an important presentation to a potential investor at the end of the week.<\/p><p>Following an acquisition of a major competitor in 2002, O&#x27;Connor went public in 2003 and paid its first dividend in 2009. Dividends are paid at the end of the year. After 2018, dividends are expected to grow for three years at 11%: $2.13 in 2019, $2.36 in 2020, and $2.63 in 2021. The average of the arithmetic and compound growth rates are given in  Exhibit 1: O&#x27;Connor Textiles Dividend History. Dividends are then expected to settle down to a long-term growth rate of 4%. O&#x27;Connor&#x27;s current share price of $70 is expected to rise to $72.92 by the end of the year according to the consensus of analysts&#x27; forecasts.<\/p><p>O&#x27;Connor&#x27;s annual dividend history is shown in  Exhibit 1: O&#x27;Connor Textiles Dividend History.<\/p><p>Exhibit 1: O&#x27;Connor Textiles Dividend History<\/p><div class=\"tbl\"><table><tr><td>Year<\/td><td>Dividend ($)<\/td><td>% Change<\/td><\/tr><tr><td>2009<\/td><td>0.76<\/td><td><\/td><\/tr><tr><td>2010<\/td><td>0.76<\/td><td>0.000<\/td><\/tr><tr><td>2011<\/td><td>0.76<\/td><td>0.000<\/td><\/tr><tr><td>2012<\/td><td>0.82<\/td><td>7.895<\/td><\/tr><tr><td>2013<\/td><td>0.91<\/td><td>10.976<\/td><\/tr><tr><td>2014<\/td><td>1.03<\/td><td>13.187<\/td><\/tr><tr><td>2015<\/td><td>1.16<\/td><td>12.621<\/td><\/tr><tr><td>2016<\/td><td>1.34<\/td><td>15.517<\/td><\/tr><tr><td>2017<\/td><td>1.52<\/td><td>13.433<\/td><\/tr><tr><td>2018<\/td><td>1.92<\/td><td>26.316<\/td><\/tr><\/table><\/div><p>2009–2018 Arithmetic mean growth = 11.1%<\/p><p>2009–2018 Compound growth = 10.9%<\/p><p>De Jong is also considering whether or not she should value O&#x27;Connor using a free cash flow model instead of the dividend discount model.<\/p><p>Charles Wang, De Jong&#x27;s colleague, is of the opinion that O&#x27;Connor&#x27;s growth rate will be 11% but will decline linearly to a long-term growth rate of 4% over the next six years. Wang also feels that the required rate of return for O&#x27;Connor should be 9.5%. ​<\/p><\/div><\/details><div class=\"qtext\"><p>For this question only, assume that the market price of O&#x27;Connor stock is $48.00 and the linearly declining high-growth period is five years. The required rate of return implicit in the market price is closest to:<\/p><\/div>","subj":"equity"},{"n":25,"q":"Musa's Statement 1 is most likely:","opts":["correct.","incorrect because the process of adjusting ratings on issues by same issuer is not called notching.","incorrect because corporate credit ratings are based on senior unsecured debt of the issuer."],"ans":"C","expl":"Statement 1 is incorrect. Issuer rating for a company is typically based on its senior unsecured debt. Ratings on other classes of debt by the same issuer may be notched. (Module 28.3, LOS 28.b)","explhtml":"<p>Statement 1 is incorrect. Issuer rating for a company is typically based on its senior unsecured debt. Ratings on other classes of debt by the same issuer may be notched. (Module 28.3, LOS 28.b)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Fixed Income<\/summary><div class=\"vig-body\"><p>Ted Thompson, CIO for Aplius Insurance Company, is evaluating the credit risk management models for the company&#x27;s fixed income portfolio. Thompson meets with Nambi Musa, who is the head of Aplius&#x27;s credit risk analysis department. Musa assures Thompson that his team has updated the credit risk analysis models over recent years and that these updated models have performed well over the past 12 months. Thompson, however, is not pleased with the losses incurred on Aplius&#x27;s municipal bond holdings in the last quarter.<\/p><p>Musa mentions that while the credit risk analysis department continues to use credit ratings, they are also evaluating other analytical tools including structural models. He specifically mentions credit valuation adjustment and expected loss as other credit risk measures currently being used. Musa makes the following two statements:<\/p><p>&quot;Company credit ratings are based on senior secured debt<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>issued by the company. Ratings on other issues by the same company are adjusted by a process known as notching.&quot; &quot;The credit valuation adjustment on a bond is the maximum<\/td><\/tr><tr><td>Statement 2:<\/td><td>amount an investor would be willing to pay to an insurer to bear the credit risk of that security.&quot;<\/td><\/tr><\/table><\/div><p>Musa further discusses the credit analysis metrics that are newly developed. As an example, he illustrates the valuation conducted on 3-year, 5% Zeta Corp. $100 par, senior unsecured bonds.  Exhibit 1: Valuation of 3-Year, 5% Zeta Corp. Bond shows the report.<\/p><p>Exhibit 1: Valuation of 3-Year, 5% Zeta Corp. Bond<\/p><div class=\"tbl\"><table><tr><td>Period<\/td><td>Cash Flow<\/td><td>LGD<\/td><td>POD<\/td><td>DF<\/td><\/tr><tr><td>1<\/td><td>5.00<\/td><td>32.648<\/td><td>1.500%<\/td><td>0.971<\/td><\/tr><tr><td>2<\/td><td>5.00<\/td><td>32.083<\/td><td>1.478%<\/td><td>0.943<\/td><\/tr><tr><td>3<\/td><td>105.00<\/td><td>31.500<\/td><td>1.455%<\/td><td>0.915<\/td><\/tr><\/table><\/div><p>Thompson then tells Musa that the credit analysis department should focus on reduced-form models. Thompson states that, &quot;reduced-form models perform better than structural models as they tend to impose assumptions on the outputs of the structural model. However, reduced-form models require a specification of the company&#x27;s balance sheet composition.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Musa&#x27;s Statement 1 is most likely:<\/p><\/div>","subj":"fixed"},{"n":26,"q":"Musa's Statement 2 is most likely:","opts":["correct.","incorrect as the statement only considers credit risk.","incorrect as the statement should refer to expected loss and not to credit valuation adjustment."],"ans":"A","expl":"Statement 2 is correct. Credit valuation adjustment is the compensation an investor receives for bearing the credit risk and is the maximum amount the investor would be willing to pay to insure against credit risk losses. (Module 28.1, LOS 28.a)","explhtml":"<p>Statement 2 is correct. Credit valuation adjustment is the compensation an investor receives for bearing the credit risk and is the maximum amount the investor would be willing to pay to insure against credit risk losses. (Module 28.1, LOS 28.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ted Thompson, CIO for Aplius Insurance Company, is evaluating the credit risk management models for the company&#x27;s fixed income portfolio. Thompson meets with Nambi Musa, who is the head of Aplius&#x27;s credit risk analysis department. Musa assures Thompson that his team has updated the credit risk analysis models over recent years and that these updated models have performed well over the past 12 months. Thompson, however, is not pleased with the losses incurred on Aplius&#x27;s municipal bond holdings in the last quarter.<\/p><p>Musa mentions that while the credit risk analysis department continues to use credit ratings, they are also evaluating other analytical tools including structural models. He specifically mentions credit valuation adjustment and expected loss as other credit risk measures currently being used. Musa makes the following two statements:<\/p><p>&quot;Company credit ratings are based on senior secured debt<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>issued by the company. Ratings on other issues by the same company are adjusted by a process known as notching.&quot; &quot;The credit valuation adjustment on a bond is the maximum<\/td><\/tr><tr><td>Statement 2:<\/td><td>amount an investor would be willing to pay to an insurer to bear the credit risk of that security.&quot;<\/td><\/tr><\/table><\/div><p>Musa further discusses the credit analysis metrics that are newly developed. As an example, he illustrates the valuation conducted on 3-year, 5% Zeta Corp. $100 par, senior unsecured bonds.  Exhibit 1: Valuation of 3-Year, 5% Zeta Corp. Bond shows the report.<\/p><p>Exhibit 1: Valuation of 3-Year, 5% Zeta Corp. Bond<\/p><div class=\"tbl\"><table><tr><td>Period<\/td><td>Cash Flow<\/td><td>LGD<\/td><td>POD<\/td><td>DF<\/td><\/tr><tr><td>1<\/td><td>5.00<\/td><td>32.648<\/td><td>1.500%<\/td><td>0.971<\/td><\/tr><tr><td>2<\/td><td>5.00<\/td><td>32.083<\/td><td>1.478%<\/td><td>0.943<\/td><\/tr><tr><td>3<\/td><td>105.00<\/td><td>31.500<\/td><td>1.455%<\/td><td>0.915<\/td><\/tr><\/table><\/div><p>Thompson then tells Musa that the credit analysis department should focus on reduced-form models. Thompson states that, &quot;reduced-form models perform better than structural models as they tend to impose assumptions on the outputs of the structural model. However, reduced-form models  outputs of the structural model. However, reduced-form models require a specification of the company&#x27;s balance sheet composition.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Using information in  Exhibit 1: Valuation of 3-Year, 5% Zeta Corp. Bond, the credit valuation adjustment for the Zeta Corp. bond is closest to:<\/p><\/div>","subj":"fixed"},{"n":28,"q":"Thompson's statement about reduced-form models relative to structural model is most likely:","opts":["correct.","incorrect regarding assumptions imposed.","incorrect regarding specification of balance sheet composition being required."],"ans":"C","expl":"While Thompson's statement about reduced-form models imposing assumptions on the output of structural models is correct, Thompson is incorrect about balance sheet composition being required—reduced-form models do not require a specification of the company's balance sheet structure. (Module 28.4, LOS 28.d)","explhtml":"<p>While Thompson&#x27;s statement about reduced-form models imposing assumptions on the output of structural models is correct, Thompson is incorrect about balance sheet composition being required—reduced-form models do not require a specification of the company&#x27;s balance sheet structure. (Module 28.4, LOS 28.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ted Thompson, CIO for Aplius Insurance Company, is evaluating the credit risk management models for the company&#x27;s fixed income portfolio. Thompson meets with Nambi Musa, who is the head of Aplius&#x27;s credit risk analysis department. Musa assures Thompson that his team has updated the credit risk analysis models over recent years and that these updated models have performed well over the past 12 months. Thompson, however, is not pleased with the losses incurred on Aplius&#x27;s municipal bond holdings in the last subj":"derivatives"},{"n":30,"q":"After 30 days, Adams wants to value a $10 million short position in the 2×5 FRA. The 90-day forward rate in 30 days is now 4.14%, and the original price of the FRA was 4.30%. 120-day MRR has changed to 3.92%. The current value of the $10 million FRA to the short position under this scenario is closest to:","opts":["$15,794.","$3,948.","–$15,794."],"ans":"B","expl":"(0.0430 – 0.0414) × $10 million × 90 / 360 = $4,000 (expected payoff in 120 days) $4,000\nPV of payoff is  120 | = $3, 948\n1+0.0392( 360 | )\n(Module 30.5, LOS 30.c)","explhtml":"<p>(0.0430 – 0.0414) × $10 million × 90 / 360 = $4,000 (expected payoff in 120 days) $4,000<\/p><div class=\"tbl\"><table><tr><td>PV of payoff is  120<\/td><td>= $3, 948<\/td><\/tr><tr><td>1+0.0392( 360<\/td><td>)<\/td><\/tr><\/table><\/div><p>(Module 30.5, LOS 30.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jonathan Adams, CFA, is doing some scenario analysis on swaps ands forward contracts. The process involves pricing the contracts and then estimating their values based on likely scenarios provided by the firm&#x27;s forecasting and strategy departments. The contracts with which Adams is most concerned are those on interest rates.<\/p><p>The MRR spot curve is as follows:<\/p><div class=\"tbl\"><table><tr><td>30-day: 3.12%<\/td><td>60-day: 3.32%<\/td><td>90-day: 3.52%<\/td><\/tr><tr><td>120-day: 3.72%<\/td><td>150-day: 3.92%<\/td><td>180-day: 4.12%<\/td><\/tr><\/table><\/div><p>Adams determines the price of a 2×5 FRA from the spot yield curve using the following calculation:<\/p><img class=\"pimg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAlgCWAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/ )) = 0.9798\nvaluepayer = ΣZ × (SFRnew ​− S​FRold) × (days / 360) × notional principal = 0.9798 × (0.0412 – 0.03) × (180 / 360) × 1,000,000 = $5,487\n(Module 30.6, LOS 30.e)","explhtml":"<p>Original swap tenor is 3 years, semiannual. After 30 months, there is only one settlement remaining. Hence: SFRnew = MRR corresponding to that settlement = 4.12% DF (180-day) = 1 / (1 + 0.0412 × (180 / 360)) = 0.9798<\/p><p>valuepayer = ΣZ × (SFRnew ​− S​FRold) × (days / 360) × notional principal = 0.9798 × (0.0412 – 0.03) × (180 / 360) × 1,000,000 = $5,487<\/p><p>(Module 30.6, LOS 30.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jonathan Adams, CFA, is doing some scenario analysis on swaps ands forward contracts. The process involves pricing the contracts and then estimating their values based on likely scenarios provided by the firm&#x27;s forecasting and strategy departments. The contracts with which Adams is most concerned are those on interest rates.<\/p><p>The MRR spot curve is as follows:<\/p><div class=\"tbl\"><table><tr><td>30-day: 3.12%<\/td><td>60-day: 3.32%<\/td><td>90-day: 3.52%<\/td><\/tr><tr><td>120-day: 3.72%<\/td><td>150-day: 3.92%<\/td><td>180-day: 4.12%<\/td><\/tr><\/table><\/div><p>Adams determines the price of a 2×5 FRA from the spot yield curve using the following calculation:<\/p><img class=\"pimg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAlgCWAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wgARCAE0Am8DAREAAhEBAxEB/8QAHAABAAMBAQEBAQAAAAAAAAAAAAcGBQQDAgEI/8QAFAEBAAAAAAAAAAAAAAAAAAAAAP/aAAwDAQACEAMQAAABlQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
