<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Which of the following statements about tax deferrals is NOT correct?", "opts": ["A deferred tax liability is expected to result in future cash outflow.", "Income tax paid can include payments or refunds for other years.", "Taxes payable are determined by pretax income and the tax rate."], "ans": "C", "expl": "Taxes payable are the taxes due to the government and are determined by taxable income\nand the tax rate. Note that pretax income is income before tax expense and is used for\nfinancial reporting. Taxable income is the income based upon IRS rules that determines\ntaxes due and is used for tax reporting.\n(Module 35.1, LOS 35.a)"}, {"n": 2, "q": "Which of the following is most likely to result in a deferred tax asset being created?", "opts": ["Depreciation.", "Unearned revenue.", "A decrease in the enacted tax rate."], "ans": "B", "expl": "Unearned revenue is usually taxable at the point of sale, even if not recognized in the\nincome statement until a later period—resulting in higher current taxes payable, and a\ndeferred tax asset being created. Depreciation commonly results in a deferred tax liability\n(e.g., when the tax return uses accelerated depreciation, while the income statement uses\nstraight-line depreciation), although it could result in either a DTA or a DTL, depending on\nthe method used. A decrease in the enacted tax rate will only decrease any existing\ndeferred tax asset or liability.\n(Module 35.1, LOS 35.a)"}, {"n": 3, "q": "When analyzing a company's financial leverage, deferred tax liabilities are best classified as:", "opts": ["a liability or equity, depending on the company's particular situation.", "a liability.", "neither as a liability, nor as equity."], "ans": "A", "expl": "The recommended analyst treatment of deferred tax liabilities is to treat them as liabilities\nif they are expected to reverse or as equity if they are not expected to reverse.\n(Module 35.2, LOS 35.b)"}, {"n": 4, "q": "An analyst gathered the following information about a company:\nPretax income = $10,000.\nTaxes payable = $2,500.\nDeferred taxes = $500.\nTax expense = $3,000.\nWhat is the firm's reported effective tax rate?", "opts": ["25%.", "5%.", "30%."], "ans": "C", "expl": "Reported effective tax rate = Income tax expense / pretax income\n= $3,000 / $10,000\n= 30%\n(Module 35.3, LOS 35.d)"}, {"n": 5, "q": "A temporary difference between pretax income reported in a firm's financial statements and\ntaxable income the firm reports to the tax authorities results in:", "opts": ["an adjustment to the firm's effective tax rate.", "a gain or loss in comprehensive income.", "a deferred tax item."], "ans": "C", "expl": "A temporary difference between pretax income for financial reporting and taxable income\nfor tax reporting results in a deferred tax liability if income tax expense (financial\nreporting) is greater than taxes payable (tax reporting), or a deferred tax asset if income\ntax expense is less than taxes payable. A permanent difference results in the firm having\nan effective tax rate that differs from the statutory tax rate. Neither results in a gain or\nloss.\n(Module 35.1, LOS 35.a)"}, {"n": 6, "q": "Gator Sarl (Gator) purchased some PP&E at the start of the period costing €21,000 with a\nthree-year useful economic life and no residual value. Gator uses straight-line depreciation\nin its accounts, but the tax authorities use double declining balance. The following balances\nare given for carrying value and the value of the tax base over the asset's life:\nYear 1Year 2Year 3\n€€€\nCarrying value14,0007,0000\nTax base7,0002,3330\nAssuming a statutory tax rate of 30%, which of the following is closest to the DTL reported in\nGator's balance sheet at the end of Year 2?", "opts": ["€1,400.", "€700.", "€2,100."], "ans": "A", "expl": "DTL = (carrying value – tax base) × statutory rate\nYear 2 DTL = (€7,000 – €2,333) × 0.3 = €1,400.\n(Module 35.2, LOS 35.b)"}, {"n": 7, "q": "Which of the following statements regarding deferred taxes is NOT correct?", "opts": ["If deferred taxes are not expected to reverse in the future then they should be classified as equity.", "Only those components of deferred tax liabilities that are likely to reverse should be considered a liability.", "If deferred tax liabilities are not included in equity, debt-to-equity ratio will be reduced."], "ans": "C", "expl": "When deferred tax liabilities are included in equity, it will reduce the debt-to-equity ratio\n(by increasing the denominator), in some cases considerably.\n(Module 35.2, LOS 35.b)"}, {"n": 8, "q": "Which of the following financial ratios is least likely to be affected by classification of\ndeferred taxes as a liability or equity?", "opts": ["Leverage ratio.", "Return on equity (ROE).", "Return on assets (ROA)."], "ans": "C", "expl": "The ROA will not be affected by the classification of the deferred taxes. The total assets will\nremain the same regardless of whether the deferred taxes are classified as a liability or\nequity. Return on equity and the leverage ratio (assets/equity) would both be affected.\n(Module 35.2, LOS 35.b)"}, {"n": 9, "q": "If timing differences that give rise to a deferred tax liability are not expected to reverse then\nthe deferred tax:", "opts": ["must be reduced by a valuation allowance.", "should be considered an asset or liability.", "should be considered an increase in equity."], "ans": "C", "expl": "If deferred tax liabilities are expected to reverse in the future, then they should be\nclassified as liabilities.  If, however, they are not expected to reverse in the future, then\nthey should be classified as equity.\n(Module 35.2, LOS 35.b)"}, {"n": 10, "q": "The ratio of taxes paid to pretax income is a company's:", "opts": ["effective tax rate.", "cash tax rate.", "statutory tax rate."], "ans": "B", "expl": "Cash tax rate = cash taxes paid / pretax income.\n(Module 35.3, LOS 35.c)"}, {"n": 11, "q": "A tax loss carryforward is best described as the:", "opts": ["net taxable loss that can be used to reduce taxable income in the future.", "net taxable loss that can be used to recover taxes paid previously.", "difference between deferred tax liabilities and deferred tax assets."], "ans": "A", "expl": "A tax loss carryforward is the net taxable loss that can be used to reduce taxable income\nin the future.\n(Module 35.1, LOS 35.a)"}, {"n": 12, "q": "Compass Company made a donation to a charity and expensed it in the period in which it\nwas made. The country's tax authorities do not allow charitable donations to be deducted\nfor tax purposes. The difference between the treatment of the expense in the accounts and\nthe tax returns will result in:", "opts": ["the creation of a deferred tax asset.", "no deferred tax items being created.", "the creation of a deferred tax liability."], "ans": "B", "expl": "This is an example of a permanent timing difference, as the expense passes through the\nincome statement but is not deducted for tax purposes. Permanent differences do not\nresult in DTAs or DTLs.\n(Module 35.1, LOS 35.a)"}, {"n": 13, "q": "Last year, Schoenberg AG earned net income of €150,000, an income tax expense of\n€47,000, and paid tax of €51,000. What was the effective tax rate?", "opts": ["23.9%.", "25.9%.", "31.3%."], "ans": "A", "expl": "Effective tax rate = income tax expense / pretax income = €47,000 / (€150,000 + €47,000) =\n23.9%. Note that you are given the net income, so add the tax expense back to find pretax\nincome.\n(Module 35.3, LOS 35.c)"}, {"n": 14, "q": "Which of the following statements regarding the disclosure of deferred taxes in a company's\nbalance sheet is most accurate?", "opts": ["Deferred tax assets and liabilities are classified as noncurrent.", "There should be a combined disclosure of all deferred tax assets and liabilities that are likely to reverse in the current period.", "Current deferred tax liability and noncurrent deferred tax asset are netted, resulting in the disclosure of a net noncurrent deferred tax liability or asset."], "ans": "A", "expl": "Deferred tax items are classified as noncurrent.\n(Module 35.3, LOS 35.d)"}, {"n": 15, "q": "A current or past loss in a tax return most likely will result in a:", "opts": ["deferred tax liability.", "deferred tax asset.", "neither a deferred tax asset nor a deferred tax liability."], "ans": "B", "expl": "A tax loss carryforward can offset future taxable income, thereby reducing taxes payable.\nThis will be recorded as a deferred tax asset to the extent that the firm expects this to\nreverse in the future.\n(Module 35.1, LOS 35.a)"}, {"n": 16, "q": "While evaluating the financial statements of Omega, Inc., the analyst observes that the\neffective tax rate is 7% less than the statutory rate. The source of this difference is\ndetermined to be a tax holiday on a manufacturing plant located in South Africa. This item is\nmost likely to be:", "opts": ["continuous in nature, so the termination date is not relevant.", "sporadic in nature, and the analyst should try to identify the termination date and determine if taxes will be payable at that time.", "sporadic in nature, but the effect is typically neutralized by higher home country taxes on the repatriated profits."], "ans": "B", "expl": "As the name suggests, a tax holiday is usually a temporary exemption from having to pay\ntaxes in some tax jurisdiction. Because of the temporary nature, the key issue for the\nanalyst is to determine when the holiday will terminate, and how the termination will\naffect taxes payable in the future.\n(Module 35.3, LOS 35.d)"}, {"n": 17, "q": "Which of the following statements is CORRECT? Income tax expense:", "opts": ["is the amount of taxes due to the government.", "includes taxes payable and deferred income tax expense.", "is the reported net of deferred tax assets and liabilities."], "ans": "B", "expl": "Income tax expense is defined as expense resulting from current period pretax income. It\nincludes taxes payable and deferred income tax expense. Taxes payable are the amount of\ntaxes due the government.\n(Module 35.1, LOS 35.a)"}, {"n": 18, "q": "For analytical purposes, if a deferred tax liability is expected to not be reversed, it should be\ntreated as a(n):", "opts": ["an addition to equity.", "immaterial amount and ignored.", "liability."], "ans": "A", "expl": "If deferred tax liabilities are expected to never reverse, they should be treated as equity\nfor analytical purposes.\n(Module 35.2, LOS 35.b)"}, {"n": 19, "q": "If a firm uses accelerated depreciation for tax purposes and straight-line depreciation for\nfinancial reporting, which of the following results is least likely?", "opts": ["A permanent difference will result between tax and financial reporting.", "A temporary difference will result between tax and financial reporting.", "Income tax expense will be greater than taxes payable."], "ans": "A", "expl": "A permanent difference between tax and financial reporting is a difference that is\nexpected to not reverse itself. Under normal circumstances, the effects of the different\ndepreciation methods will reverse.\n(Module 35.1, LOS 35.a)"}, {"n": 20, "q": "Which of the following best describes valuation allowance? Valuation allowance is a reserve:", "opts": ["against deferred tax assets based on the likelihood that those assets will not be realized.", "against deferred tax liabilities based on the likelihood that those liabilities will be paid.", "created when deferred tax assets are greater than deferred tax liabilities."], "ans": "A", "expl": "Valuation allowance is a reserve against deferred tax assets based on the likelihood that\nthose assets will not be realized. Deferred tax assets reflect the difference in tax expense\nand taxes payable that are expected to be recovered from future operations.\n(Module 35.1, LOS 35.a)"}, {"n": 21, "q": "Which of the following is an analyst least likely to include when analyzing trends in tax rates,\ngiven a reconciliation of statutory to effective tax rates?", "opts": ["Differing tax rates in different countries.", "Tax holiday savings.", "Tax-exempt income."], "ans": "B", "expl": "When analyzing trends in tax rates, an analyst should only include reconciliation items that\nare continuous in nature rather than sporadic. Tax-exempt income and differing tax rates\nin different countries tend to be continuous, whereas tax holiday savings tend to be\nsporadic.\n(Module 35.3, LOS 35.c)"}, {"n": 22, "q": "Which of the following is most likely to cause a difference between a firm's statutory and\neffective tax rates?", "opts": ["An increase in the deferred tax asset from the prior period, and no change in the deferred tax liability.", "An increase in the tax-exempt income earned during the period.", "An increase in the actual cash paid to the tax authorities."], "ans": "B", "expl": "An increase in the actual cash paid will change the cash tax rate, but it will not cause the\nstatutory and effective tax rates to differ. Any changes in deferred tax assets and liabilities\nare because of temporary timing differences, which typically do not cause the statutory\nand effective tax rates to differ. Permanent differences, such as tax-exempt income, do\ncause these rates to differ.\n(Module 35.3, LOS 35.c)"}, {"n": 23, "q": "A firm purchased a piece of equipment for $6,000 with the following information provided:\nRevenue will be $15,000 per year.\nThe equipment has a 3-year life expectancy and no salvage value.\nThe firm's tax rate is 30%.\nStraight-line depreciation is used for financial reporting and double declining is used\nfor tax purposes.\nCalculate taxes payable for years 1 and 2.\nYear 1Year 2", "opts": ["3,3004,100", "600-200", "3,9003,900"], "ans": "A", "expl": "Using DDB:\nYr. 1Yr. 2\nRevenue15,00015,000\nDepreciation4,0001,333\nTaxable Income11,00013,667\nTaxes Payable3,3004,100\nAn asset with a 3-year life would have a straight line depreciation rate of 0.3333 per year.\nUsing DDB the depreciation rate is twice this amount or 0.66667. $2,000 is the amount of\ndepreciation left on the equipment in year 2 ($6,000 − $4,000). Therefore, the amount of\ndepreciation in the 2nd year is (0.66667)(2,000) = $1,333\n(Module 35.3, LOS 35.d)"}, {"n": 24, "q": "Which of the following most accurately depicts the relationship between income tax expense\nand deferred taxes?", "opts": ["ΔDTA = tax payable – tax expense – ΔDTL.", "ΔDTL = tax expense – tax payable + ΔDTA.", "Tax payable = tax expense + ΔDTL – ΔDTA."], "ans": "B", "expl": "Tax expense = tax payable + ΔDTL – ΔDTA. Once rearranged, the correct answer is ΔDTL =\ntax expense – tax payable + ΔDTA.\n(Module 35.1, LOS 35.a)"}, {"n": 25, "q": "Year:200220032004\nIncome Statement:\nRevenues\nafter all\nexpenses$200$300$400\nother than\ndepreciation\nDepreciation505050\nexpense\nIncome\nbefore\n$150$250$350\nincome\ntaxes\nTax return:\nTaxable\nincome\nbefore$200$300$400\ndepreciation\nexpense\nDepreciation755025\nexpense\nTaxable\n$125$250$375\nincome\nAssume an income tax rate of 40%.\nThe company's income tax expense for 2002 is:", "opts": ["$0.", "$50.", "$60."], "ans": "C", "expl": "Effective tax rate = Income tax expense / pretax income\nIncome tax expense = Effective tax rate × pretax income\n= $150(0.40)\n= $60\n(Module 35.3, LOS 35.d)", "qhtml": "<p><strong>Income Statement</strong></p><table class=\"qtable\"><thead><tr><th>Year</th><th>2002</th><th>2003</th><th>2004</th></tr></thead><tbody><tr><td>Revenues after all expenses other than depreciation</td><td>$200</td><td>$300</td><td>$400</td></tr><tr><td>Depreciation expense</td><td>50</td><td>50</td><td>50</td></tr><tr><td>Income before income taxes</td><td>$150</td><td>$250</td><td>$350</td></tr></tbody></table><p><strong>Tax Return</strong></p><table class=\"qtable\"><thead><tr><th>Year</th><th>2002</th><th>2003</th><th>2004</th></tr></thead><tbody><tr><td>Taxable income before depreciation expense</td><td>$200</td><td>$300</td><td>$400</td></tr><tr><td>Depreciation expense</td><td>75</td><td>50</td><td>25</td></tr><tr><td>Taxable income</td><td>$125</td><td>$250</td><td>$375</td></tr></tbody></table><p>Assume an income tax rate of 40%. The company's income tax expense for 2002 is:</p>"}, {"n": 26, "q": "Harding Industrials, Inc., has a deferred tax asset of $300,000 and a deferred tax liability of\n$450,000 at the end of the reporting period, based on a tax rate of 20%. If the tax rate\nincreases to 25%, what will be the most likely impact on the income statement?", "opts": ["Increase in tax expense by $237,500.", "Decrease in net income by $37,500.", "Increase in net income by $7,500."], "ans": "B", "expl": "Deferred taxes are recognized at the enacted tax rate (25%). This will give a deferred tax\nliability of $562,500 ($450,000 / 0.2 × 0.25) and a deferred tax asset of $375,000 ($300,000\n/ 0.2 × 0.25). So, the tax expense = tax payable + ΔDTL – ΔDTA, the increase in the DTL will\nincrease the tax expense on the income statement by $112,500, and the increase in the\nDTA will decrease the tax expense by $75,000. Overall, the tax expense will increase, and\nthe net income will decrease by $37,500.\n(Module 35.1, LOS 35.a)"}, {"n": 27, "q": "A company's effective tax rate is determined using its:", "opts": ["taxable income as shown on its tax filing.", "taxes paid to the government during the period.", "income tax expense from the income statement."], "ans": "C", "expl": "Effective tax rate = income tax expense / pretax income.\n(Module 35.3, LOS 35.c)"}, {"n": 28, "q": "For purposes of financial analysis, an analyst should:", "opts": ["always consider deferred tax liabilities as stockholder's equity.", "always consider deferred tax liabilities as a liability.", "determine the treatment of deferred tax liabilities on a case-by-case basis."], "ans": "C", "expl": "For financial analysis, an analyst must decide on the appropriate treatment of deferred\ntaxes on a case-by-case basis. These can be classified as liabilities or stockholder's equity,\ndepending on various factors. Sometimes, deferred taxes are just ignored altogether.\n(Module 35.2, LOS 35.b)"}, {"n": 29, "q": "Grace Ltd. develops flying discs for use in sport. Grace currently expenses all R&D when\nincurred. The tax authorities require R&D expenditures to be capitalized and amortized. The\ndiffering accounting and tax treatment of R&D will result in:", "opts": ["the creation of a deferred tax asset.", "no deferred tax items being created.", "the creation of a deferred tax liability."], "ans": "A", "expl": "Expensing R&D results in a balance sheet carrying value of zero. The tax base of the asset\nwill be the amortization passing through the tax return in future periods. Carrying value\nless than the tax base results in a DTA. (Module 35.1, LOS 35.a)"}, {"n": 30, "q": "A firm sold 530 units during the year with a one-year warranty. The firm estimates that 20%\nof these units will have claims made on them during the next year, costing the firm $80 per\nunit. In the country where the firm operates, a warranty expense is not tax deductible until\nthe warranty work is performed. What is the tax base of the warranty liability?", "opts": ["$8,480.", "$42,400.", "$0."], "ans": "C", "expl": "On the balance sheet, a warranty liability of $8,480 (530 × 0.2 × $80) will be recorded. The\ntax base is equal to the carrying value ($8,480) minus the amount deductible in the future.\nThe tax base is 0 ($8,480 – $8,480), and a deferred tax asset of $8,480 will be recognized.\n(Module 35.1, LOS 35.a)"}, {"n": 31, "q": "A firm operates in a country with a 30% enacted tax rate. The firm had pretax income of\n$150,000, income tax expense of $47,000, and paid $44,000 in income tax. Which of the\nfollowing tax rates was most likely the highest?", "opts": ["Effective tax rate.", "Statutory tax rate.", "Cash tax rate."], "ans": "A", "expl": "Statutory tax rate = enacted rate of 30%. Effective tax rate = income tax expense / pretax\nincome = $47,000 / $150,000 = 31.3%. Cash tax rate = tax paid (cash) / pretax income =\n$44,000 / $150,000 = 29.3%. In this case, the highest rate was the effective tax rate.\n(Module 35.3, LOS 35.c)"}];
const CFG = {"title": "Analysis of Income Taxes", "subtitle": "CFA · Financial Statement Analysis · Reading 35 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; stem.textContent = q.q;
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>
</body>
