mpany file in the Research Department. This material reveals that FinSoft is about to receive a major contract for an innovative software program that will have a very significant positive impact on earnings as well as on the company's visibility and stature in the industry.<\/p><p>Jay Jones, a CFA candidate and a portfolio manager for Lincoln, has come upon these notes and work sheets while reviewing the FinSoft research file. Jones had been considering sale of the stock from the accounts under his management, but realizes after reading the file material that the recent weakness in operating results is about to be reversed and that the company's prospects are actually quite favorable. Perhaps, he thinks, he should add to his clients' FinSoft positions instead of considering their sale.<\/p><p>Jones briefly reflects on the matter of \"inside information\" in relation to perhaps buying more of the stock instead of selling it, but his recollection is hazy and Lincoln has no formal guidelines on the subject to which he can refer. Based on the circumstances, Jones believes he is free to use this new knowledge for the benefit of Lincoln's clients.<\/p><p>At a local CFA society event, Jones mentions to Mohammed Bamyeh, a friend and financial advisor, that FinSoft is about to receive a major new contract that has yet to be announced.<\/p><p>Later that day, Bamyeh takes a large long position in a technology ETF that has a large weight for FinSoft stock.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.8, LOS 41.a<\/div><div class=\"qtext\"><p>When recommending the purchase of FinSoft company shares to Bamyeh, Jones least likely violated the Standard relating to:<\/p><\/div>", "subj": "ethics"}, {"n": 23, "q": "Lee Hurst, CFA, is an equity research analyst who has recently left a large firm to start independent practice. He is able to re-create several of his previous research reports, based on his clear recollection of supporting documentation he compiled at his previous employer. He publishes the reports and obtains several new clients. Hurst is most likely:", "opts": ["not in violation of any Standard.", "in violation of the Standard concerning diligence and reasonable basis.", "in violation of the Standard concerning record retention."], "ans": "C", "expl": "Hurst is most likely in violation of Standard V(C) Record Retention because the supporting documentation is unavailable. He needs to recreate the supporting records based on information gathered through public sources or the covered company. He may have a reasonable basis for his recommendations and have been diligent in his analysis, but must reconstruct the records of this analysis before issuing the reports.", "explhtml": "<p>Hurst is most likely in violation of Standard V(C) Record Retention because the supporting documentation is unavailable. He needs to recreate the supporting records based on information gathered through public sources or the covered company. He may have a reasonable basis for his recommendations and have been diligent in his analysis, but must reconstruct the records of this analysis before issuing the reports.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(C)<\/div><div class=\"qtext\"><p>Lee Hurst, CFA, is an equity research analyst who has recently left a large firm to start independent practice. He is able to re-create several of his previous research reports, based on his clear recollection of supporting documentation he compiled at his previous employer. He publishes the reports and obtains several new clients. Hurst is most likely:<\/p><\/div>", "subj": "ethics"}, {"n": 24, "q": "Wes Smith, CFA, works for Advisors, Inc. In order to remain in compliance with Standard V(A), Diligence and Reasonable Basis, Smith may recommend a security in which of the following situations?", "opts": ["Advisors' research department recommends a stock.", "For either of the reasons listed here.", "Smith reads a favorable review of the security in a widely read periodical."], "ans": "A", "expl": "Smith will be in violation if he acts solely on the basis of what he read in the periodical. Use of information within the firm can be relied upon unless the Smith has reason to believe the source lacks a sound basis.", "explhtml": "<p>Smith will be in violation if he acts solely on the basis of what he read in the periodical. Use of information within the firm can be relied upon unless the Smith has reason to believe the source lacks a sound basis.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(A)<\/div><div class=\"qtext\"><p>Wes Smith, CFA, works for Advisors, Inc. In order to remain in compliance with Standard V(A), Diligence and Reasonable Basis, Smith may recommend a security in which of the following situations?<\/p><\/div>", "subj": "ethics"}, {"n": 25, "q": "Four months ago Lance Tuipuloto, CFA, analyzed three equity securities for Janet Scadden. However, Scadden decided to invest in bonds instead. Tuipuloto now wants to destroy the records from the stock analysis. Is this action in compliance with Standard V(C)?", "opts": ["Yes. Tuipuloto only needs to keep the records for 90 days.", "Yes. Tuipuloto does not need to keep the records because his advice was not followed.", "No."], "ans": "C", "expl": "According to Standard V(C), Record Retention, the files should be not be destroyed. The CFA Institute recommends keeping all records for at least 7 years.", "explhtml": "<p>According to Standard V(C), Record Retention, the files should be not be destroyed. The CFA Institute recommends keeping all records for at least 7 years.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(C)<\/div><div class=\"qtext\"><p>Four months ago Lance Tuipuloto, CFA, analyzed three equity securities for Janet Scadden. However, Scadden decided to invest in bonds instead. Tuipuloto now wants to destroy the records from the stock analysis. Is this action in compliance with Standard V(C)?<\/p><\/div>", "subj": "ethics"}, {"n": 26, "q": "An analyst has found an investment with what appears to be a great return-to-risk ratio. The analyst double-checks the data for accuracy, keeps careful records, and is careful to not make any misrepresentations as he simultaneously sends an e-mail to all his clients with a \"buy\" recommendation. According to Standard V(A), Diligence and Reasonable Basis, the analyst has:", "opts": ["violated the Standard if he does not verify whether the investment is appropriate for all the clients.", "violated the Standard by communicating the recommendation via e-mail.", "fulfilled all obligations."], "ans": "C", "expl": "If the analyst had been an investment manager, it would have been inappropriate for him to make a blanket recommendation for all of his clients without considering the unique needs of each. However, the analyst is merely stating that given the qualities of the investment, it is an attractive buy. He has kept adequate records, and made fair disclosure of his rating decision.", "explhtml": "<p>If the analyst had been an investment manager, it would have been inappropriate for him to make a blanket recommendation for all of his clients without considering the unique needs of each. However, the analyst is merely stating that given the qualities of the investment, it is an attractive buy. He has kept adequate records, and made fair disclosure of his rating decision.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(A)<\/div><div class=\"qtext\"><p>An analyst has found an investment with what appears to be a great return-to-risk ratio. The analyst double-checks the data for accuracy, keeps careful records, and is careful to not make any misrepresentations as he simultaneously sends an e-mail to all his clients with a &quot;buy&quot; recommendation. According to Standard V(A), Diligence and Reasonable Basis, the analyst has:<\/p><\/div>", "subj": "ethics"}, {"n": 27, "q": "Under the CFA Institute Code and Standards, it is the responsibility of the Director of Research, a CFA Institute member to:", "opts": ["exercise reasonable supervision over those subject to their supervision or authority to prevent any violation of applicable statues, regulations or provisions of the Code and Standards.", "both of these.", "not knowingly participate or assist in any violation of laws, rules, or regulations."], "ans": "B", "expl": "The Director of Research, as a CFA Institute member, is bound by the Standards of Professional Conduct. Accordingly, \"members shall not knowingly participate or assist in any violation of such laws, rules or regulations\" (Standard I(A): Knowledge of the Law). This responsibility is applicable under the circumstances. As a supervisor, the director of research has a responsibility to exercise reasonable supervision over subordinates to prevent violations of laws, regulations, and the provisions of CFA Institute Standards of Professional Conduct (Standard IV(C): Responsibilities of Supervisors).", "explhtml": "<p>The Director of Research, as a CFA Institute member, is bound by the Standards of Professional Conduct. Accordingly, &quot;members shall not knowingly participate or assist in any violation of such laws, rules or regulations&quot; (Standard I(A): Knowledge of the Law). This responsibility is applicable under the circumstances. As a supervisor, the director of research has a responsibility to exercise reasonable supervision over subordinates to prevent violations of laws, regulations, and the provisions of CFA Institute Standards of Professional Conduct (Standard IV(C): Responsibilities of Supervisors).<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 27–30<\/summary><div class=\"vig-body\"><p>Bella Brown is an experienced generalist securities analyst employed by Lang &amp; Co., a major U.S. brokerage firm whose clients have a high regard for her research and stock selection abilities. She was visited recently by a Lang managing director who said, \"Please take a look at SpecChem Inc., the specialty chemical producer. They are going to need an investment banker soon and, because we make a market in their stock, we will be one of the firms considered for this business.I had lunch with SpecChem's Treasurer today, who told me that their European problems are being resolved and that earnings results are definitely looking good. He likes us and is expecting you to call him for details.\" The managing director then left Brown's office, saying, \"It would be great if you could rate the stock a 'Buy'.\" In a subsequent hour-long telephone discussion with the Treasurer, Brown obtained some useful information concerning recent company trends and developments as well as SpecChem's overall view of the outlook for sales and earnings during the next several quarters. Brown began thinking quite positively about the company and its prospects. She then reviewed some general source material on the chemical industry and read the Standard &amp; Poor's Stock Guide on SpecChem Inc. That afternoon, she wrote a report recommending purchase of the stock, shown below as Exhibit B. In accordance with Lang's routine procedures for pre- dissemination review of Research Department recommendations, the report has been sent to the firm's Director of Research, who is aware of the circumstances under which it was prepared.<\/p><p>Exhibit B LANG &amp; COMPANY Company Report Industrial: Specialty Chemicals Equity Research Rating: Buy SpecChem Inc. (NYSE: SCM)<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-8/v002.webp\" style=\"max-width:min(100%,637px)\" alt=\"• We are initiating coverage of SpecChem Inc. with this report. • Earnings, up to 51% in the first quarter, are expected to be up again in the quarter ending June 30. Higher sales, better margins, an improved geographic sales mix, and savings from reduced pension expense are all contributing to this year&#x27;s gains. • Although European production is up only modestly year-over-year, successful cost reduction efforts are limiting the adverse effects of weak volume and pricing. A possible plant closure in September could improve plant utilization by 10%, accompanied by potentially dramatic marg\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-8/v003.webp\" style=\"max-width:min(100%,629px)\" alt=\"• We think SpecChem stock is undervalued and believe it can easily reach the low 100s on the strength of continuing earnings momentum. The downside is estimated to be in the mid-80s. There is plenty of room for upside earnings surprises if volume and prices improve, which would take the stock up strongly. Purchase is recommended.\"><p>Analyst: Bella Brown Research Department This report is based upon information which we consider reliable, but we do not represent that it is accurate, and it should not be relied upon as such. We, or persons involved in the preparation or issuance of this material, may, from time to time, have long or short positions in the securities of the company mentioned herein.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.1, LOS 41.a<\/div><div class=\"qtext\"><p>Under the CFA Institute Code and Standards, it is the responsibility of the Director of Research, a CFA Institute member to:<\/p><\/div>", "subj": "ethics"}, {"n": 28, "q": "Under the current circumstances, the Director of Research should:", "opts": ["allow the report to be distributed, as is.", "require the report to be redone to ensure compliance with CFA Institute Standards.", "require the report to be redone with a neutral or hold rating pending the outcome of the awarding of the investment banking business."], "ans": "B", "expl": "Based on the current circumstances, the supervisor (Director of Research) must not allow the report to be distributed. In this situation the overriding responsibility is to ensure that diligence, thoroughness, and independence be exercised in forming the investment judgment and in preparing the research report.", "explhtml": "<p>Based on the current circumstances, the supervisor (Director of Research) must not allow the report to be distributed. In this situation the overriding responsibility is to ensure that diligence, thoroughness, and independence be exercised in forming the investment judgment and in preparing the research report.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 27–30<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Bella Brown is an experienced generalist securities analyst employed by Lang &amp; Co., a major U.S. brokerage firm whose clients have a high regard for her research and stock selection abilities. She was visited recently by a Lang managing director who said, \"Please take a look at SpecChem Inc., the specialty chemical producer. They are going to need an investment banker soon and, because we make a market in their stock, we will be one of the firms considered for this business.I had lunch with SpecChem's Treasurer today, who told me that their European problems are being resolved and that earnings results are definitely looking good. He likes us and is expecting you to call him for details.\" The managing director then left Brown's office, saying, \"It would be great if you could rate the stock a 'Buy'.\" In a subsequent hour-long telephone discussion with the Treasurer, Brown obtained some useful information concerning recent company trends and developments as well as SpecChem's overall view of the outlook for sales and earnings during the next several quarters. Brown began thinking quite positively about the company and its prospects. She then reviewed some general source material on the chemical industry and read the Standard &amp; Poor's Stock Guide on SpecChem Inc. That afternoon, she wrote a report recommending purchase of the stock, shown below as Exhibit B. In accordance with Lang's routine procedures for pre- dissemination review of Research Department recommendations, the report has been sent to the firm's Director of Research, who is aware of the circumstances under which it was prepared.<\/p><p>Exhibit B LANG &amp; COMPANY Company Report Industrial: Specialty Chemicals Equity Research Rating: Buy SpecChem Inc. (NYSE: SCM)<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-8/v002.webp\" style=\"max-width:min(100%,637px)\" alt=\"• We are initiating coverage of SpecChem Inc. with this report. • Earnings, up to 51% in the first quarter, are expected to be up again in the quarter ending June 30. Higher sales, better margins, an improved geographic sales mix, and savings from reduced pension expense are all contributing to this year&#x27;s gains. • Although European production is up only modestly year-over-year, successful cost reduction efforts are limiting the adverse effects of weak volume and pricing. A possible plant closure in September could improve plant utilization by 10%, accompanied by potentially dramatic marg\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-8/v003.webp\" style=\"max-width:min(100%,629px)\" alt=\"• We think SpecChem stock is undervalued and believe it can easily reach the low 100s on the strength of continuing earnings momentum. The downside is estimated to be in the mid-80s. There is plenty of room for upside earnings surprises if volume and prices improve, which would take the stock up strongly. Purchase is recommended.\"><p>Analyst: Bella Brown Research Department This report is based upon information which we consider reliable, but we do not represent that it is accurate, and it should not be relied upon as such. We, or persons involved in the preparation or issuance of this material, may, from time to time, have long or short positions in the securities of the company mentioned herein.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.8, LOS 41.a<\/div><div class=\"qtext\"><p>Under the current circumstances, the Director of Research should:<\/p><\/div>", "subj": "ethics"}, {"n": 29, "q": "The research report, as shown, has several aspects which violate CFA Institute Standards of Professional Conduct. Which of the following is NOT an apparent violation of CFA Institute Standards?", "opts": ["The report does not adequately discuss the factors important to analysis, recommendations, or action.", "The report violates guidelines on investment performance presentation.", "The report does not distinguish between fact and opinion."], "ans": "B", "expl": "There is no attempt in the report to present data on the firm's performance as an investment manager. Violations relating to the report itself include the following: Though SpecChem's current and prospective earnings are mentioned, no real basis of SpecChem's earnings power is discussed, nor are such factors as cash flow, operating strength or financial condition. Brown has violated Standard V(B): Communication with Clients and Prospective Clients. The report fails to disclose Lang's market-making activities with SpecChem. This omission violates Standard VI(A): Disclosure of Conflicts. Brown is not separating fact from opinion in her comment, \"There is plenty of room for upside earnings surprises if volume and prices improve further, which would take the stock up strongly.\" This is a violation of Standard V(B): Communication with Clients and Prospective Clients. The above-noted comment could also be considered a violation of Standard I(C): Misrepresentation.", "explhtml": "<p>There is no attempt in the report to present data on the firm&#x27;s performance as an investment manager. Violations relating to the report itself include the following:<\/p><p>Though SpecChem&#x27;s current and prospective earnings are mentioned, no real basis of SpecChem&#x27;s earnings power is discussed, nor are such factors as cash flow, operating strength or financial condition. Brown has violated Standard V(B): Communication with Clients and Prospective Clients. The report fails to disclose Lang&#x27;s market-making activities with SpecChem. This omission violates Standard VI(A): Disclosure of Conflicts. Brown is not separating fact from opinion in her comment, &quot;There is plenty of room for upside earnings surprises if volume and prices improve further, which would take the stock up strongly.&quot; This is a violation of Standard V(B): Communication with Clients and Prospective Clients. The above-noted comment could also be considered a violation of Standard I(C): Misrepresentation.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 27–30<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Bella Brown is an experienced generalist securities analyst employed by Lang &amp; Co., a major U.S. brokerage firm whose clients have a high regard for her research and stock selection abilities. She was visited recently by a Lang managing director who said, \"Please take a look at SpecChem Inc., the specialty chemical producer. They are going to need an investment banker soon and, because we make a market in their stock, we will be one of the firms considered for this business.I had lunch with SpecChem's Treasurer today, who told me that their European problems are being resolved and that earnings results are definitely looking good. He likes us and is expecting you to call him for details.\" The managing director then left Brown's office, saying, \"It would be great if you could rate the stock a 'Buy'.\" In a subsequent hour-long telephone discussion with the Treasurer, Brown obtained some useful information concerning recent company trends and developments as well as SpecChem's overall view of the outlook for sales and earnings during the next several quarters. Brown began thinking quite positively about the company and its prospects. She then reviewed some general source material on the chemical industry and read the Standard &amp; Poor's Stock Guide on SpecChem Inc. That afternoon, she wrote a report recommending purchase of the stock, shown below as Exhibit B. In accordance with Lang's routine procedures for pre- dissemination review of Research Department recommendations, the report has been sent to the firm's Director of Research, who is aware of the circumstances under which it was prepared.<\/p><p>Exhibit B LANG &amp; COMPANY Company Report Industrial: Specialty Chemicals Equity Research Rating: Buy SpecChem Inc. (NYSE: SCM)<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-8/v002.webp\" style=\"max-width:min(100%,637px)\" alt=\"• We are initiating coverage of SpecChem Inc. with this report. • Earnings, up to 51% in the first quarter, are expected to be up again in the quarter ending June 30. Higher sales, better margins, an improved geographic sales mix, and savings from reduced pension expense are all contributing to this year&#x27;s gains. • Although European production is up only modestly year-over-year, successful cost reduction efforts are limiting the adverse effects of weak volume and pricing. A possible plant closure in September could improve plant utilization by 10%, accompanied by potentially dramatic marg\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-8/v003.webp\" style=\"max-width:min(100%,629px)\" alt=\"• We think SpecChem stock is undervalued and believe it can easily reach the low 100s on the strength of continuing earnings momentum. The downside is estimated to be in the mid-80s. There is plenty of room for upside earnings surprises if volume and prices improve, which would take the stock up strongly. Purchase is recommended.\"><p>Analyst: Bella Brown Research Department This report is based upon information which we consider reliable, but we do not represent that it is accurate, and it should not be relied upon as such. We, or persons involved in the preparation or issuance of this material, may, from time to time, have long or short positions in the securities of the company mentioned herein.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.6, LOS 41.a<\/div><div class=\"qtext\"><p>The research report, as shown, has several aspects which violate CFA Institute Standards of Professional Conduct. Which of the following is NOT an apparent violation of CFA Institute Standards?<\/p><\/div>", "subj": "ethics"}, {"n": 30, "q": "As to the process by which Brown's report in Exhibit B came into being, which of the following is least likely a procedural error in violation of CFA Institute Standards of Professional Conduct?", "opts": ["Brown has violated the Standard relating to the prohibition against plagiarism.", "Brown has violated the Standard relating to disclosure of basic characteristics.", "Brown has violated the Standard relating to independence and objectivity."], "ans": "A", "expl": "There is nothing to indicate that a violation of the Standard on Prohibition against plagiarism has occurred. The word \"process\" violations include: Brown's report and investment conclusions were influenced by a senior member of her firm. In addition, near total reliance was put on the information supplied by SpecChem's management. She has violated Standard I(B): Independence and Objectivity. Brown showed a lack of diligence and thoroughness in forming her investment decision and preparing the report. Her analysis was cursory at best; the report was not objective nor was it based on adequate understanding of company fundamentals. Standard V(A): Diligence and Reasonable Basis was violated by Brown. A violation of Standard V(B): Communication with Clients and Prospective Clients has also occurred. Brown failed to investigate SpecChem's basic investment characteristics properly and did not communicate the company's investment characteristics through the research report.", "explhtml": "<p>There is nothing to indicate that a violation of the Standard on Prohibition against plagiarism has occurred. The word &quot;process&quot; violations include:<\/p><p>Brown&#x27;s report and investment conclusions were influenced by a senior member of her firm. In addition, near total reliance was put on the information supplied by SpecChem&#x27;s management. She has violated Standard I(B): Independence and Objectivity. Brown showed a lack of diligence and thoroughness in forming her investment decision and preparing the report. Her analysis was cursory at best; the report was not objective nor was it based on adequate understanding of company fundamentals. Standard V(A): Diligence and Reasonable Basis was violated by Brown. A violation of Standard V(B): Communication with Clients and Prospective Clients has also occurred. Brown failed to investigate SpecChem&#x27;s basic investment characteristics properly and did not communicate the company&#x27;s investment characteristics through the research report.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 27–30<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Bella Brown is an experienced generalist securities analyst employed by Lang &amp; Co., a major U.S. brokerage firm whose clients have a high regard for her research and stock selection abilities. She was visited recently by a Lang managing director who said, \"Please take a look at SpecChem Inc., the specialty chemical producer. They are going to need an investment banker soon and, because we make a market in their stock, we will be one of the firms considered for this business.I had lunch with SpecChem's Treasurer today, who told me that their European problems are being resolved and that earnings results are definitely looking good. He likes us and is expecting you to call him for details.\" The managing director then left Brown's office, saying, \"It would be great if you could rate the stock a 'Buy'.\" In a subsequent hour-long telephone discussion with the Treasurer, Brown obtained some useful information concerning recent company trends and developments as well as SpecChem's overall view of the outlook for sales and earnings during the next several quarters. Brown began thinking quite positively about the company and its prospects. She then reviewed some general source material on the chemical industry and read the Standard &amp; Poor's Stock Guide on SpecChem Inc. That afternoon, she wrote a report recommending purchase of the stock, shown below as Exhibit B. In accordance with Lang's routine procedures for pre- dissemination review of Research Department recommendations, the report has been sent to the firm's Director of Research, who is aware of the circumstances under which it was prepared.<\/p><p>Exhibit B LANG &amp; COMPANY Company Report Industrial: Specialty Chemicals Equity Research Rating: Buy SpecChem Inc. (NYSE: SCM)<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-8/v002.webp\" style=\"max-width:min(100%,637px)\" alt=\"• We are initiating coverage of SpecChem Inc. with this report. • Earnings, up to 51% in the first quarter, are expected to be up again in the quarter ending June 30. Higher sales, better margins, an improved geographic sales mix, and savings from reduced pension expense are all contributing to this year&#x27;s gains. • Although European production is up only modestly year-over-year, successful cost reduction efforts are limiting the adverse effects of weak volume and pricing. A possible plant closure in September could improve plant utilization by 10%, accompanied by potentially dramatic marg\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-8/v003.webp\" style=\"max-width:min(100%,629px)\" alt=\"• We think SpecChem stock is undervalued and believe it can easily reach the low 100s on the strength of continuing earnings momentum. The downside is estimated to be in the mid-80s. There is plenty of room for upside earnings surprises if volume and prices improve, which would take the stock up strongly. Purchase is recommended.\"><p>Analyst: Bella Brown Research Department This report is based upon information which we consider reliable, but we do not represent that it is accurate, and it should not be relied upon as such. We, or persons involved in the preparation or issuance of this material, may, from time to time, have long or short positions in the securities of the company mentioned herein.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.2, LOS 41.a<\/div><div class=\"qtext\"><p>As to the process by which Brown&#x27;s report in Exhibit B came into being, which of the following is least likely a procedural error in violation of CFA Institute Standards of Professional Conduct?<\/p><\/div>", "subj": "ethics"}, {"n": 31, "q": "Janice Melfi is a portfolio manager for Soprano Advisors. Soprano has developed a proprietary model that has been thoroughly researched and is known throughout the industry as the Soprano model. The model is purely quantitative and screens stocks into buy, hold, and sell categories. The basic philosophy of the model is thoroughly explained to clients. The director of research frequently alters the model based on rigorous research—an aspect that is well explained to clients, although the specific alterations are not continually disclosed. Portfolio managers use the model to assist them in making portfolio decisions, but, based on their own fundamental research, are allowed to purchase securities not recommended by the model. This fact is not disclosed to the clients, because the head of marketing does not think it is relevant. Which of the following statements regarding the portfolio manager's investment decisions is CORRECT?", "opts": ["Melfi is violating the Standards by using two investment processes that are in conflict with each other.", "There is no violation of the Standards.", "Soprano is violating the Standards by not disclosing the fundamental research aspect of the investment process."], "ans": "C", "expl": "Soprano is violating the Standard on portfolio investment recommendations and actions by excluding relevant factors of the investment process. The fundamental research aspect is highly relevant to the process and should be disclosed to clients. It is acceptable for Melfi to use two investment processes that may be in conflict with each other and to use a process that was not developed by her.", "explhtml": "<p>Soprano is violating the Standard on portfolio investment recommendations and actions by excluding relevant factors of the investment process. The fundamental research aspect is highly relevant to the process and should be disclosed to clients. It is acceptable for Melfi to use two investment processes that may be in conflict with each other and to use a process that was not developed by her.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(B)<\/div><div class=\"qtext\"><p>Janice Melfi is a portfolio manager for Soprano Advisors. Soprano has developed a proprietary model that has been thoroughly researched and is known throughout the industry as the Soprano model. The model is purely quantitative and screens stocks into buy, hold, and sell categories. The basic philosophy of the model is thoroughly explained to clients. The director of research frequently alters the model based on rigorous research—an aspect that is well explained to clients, although the specific alterations are not continually disclosed. Portfolio managers use the model to assist them in making portfolio decisions, but, based on their own fundamental research, are allowed to purchase securities not recommended by the model. This fact is not disclosed to the clients, because the head of marketing does not think it is relevant. Which of the following statements regarding the portfolio manager&#x27;s investment decisions is CORRECT?<\/p><\/div>", "subj": "ethics"}, {"n": 32, "q": "Wanda Brunner, CFA, is preparing for her first meeting with the Johnsons—her firm's newest clients. She makes notes regarding disclosure of the investment process. These notes most likely include reminders to:", "opts": ["adequately disclose the basic security selection and portfolio construction process.", "anticipate changes in her clients’ investment objectives that could cause them to leave her firm.", "notify her supervisors of any potential change in the security selection and portfolio construction process."], "ans": "A", "expl": "Wanda should adequately disclose the basic security selection and portfolio construction process. Wanda should generally stick with the stated investment strategy in the IPS, notify clients and prospective clients of any potential change in the security selection and portfolio construction process, and secure documentation of authorization for proposed changes.", "explhtml": "<p>Wanda should adequately disclose the basic security selection and portfolio construction process. Wanda should generally stick with the stated investment strategy in the IPS, notify clients and prospective clients of any potential change in the security selection and portfolio construction process, and secure documentation of authorization for proposed changes.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(B)<\/div><div class=\"qtext\"><p>Wanda Brunner, CFA, is preparing for her first meeting with the Johnsons—her firm&#x27;s newest clients. She makes notes regarding disclosure of the investment process. These notes most likely include reminders to:<\/p><\/div>", "subj": "ethics"}, {"n": 33, "q": "Randal Brooks is the chief economist for a large brokerage firm. In the aftermath of a national tragedy, Brooks feels that it is very possible that the stock market will drop significantly and not recover for several years. However, he does not believe that this is the most likely scenario but merely that the risk of investing in equities has increased. He decides to write a market commentary to the brokerage clients that discusses the reasons why the market will remain stable and talks about why he, as a private citizen, feels patriotic. He does not mention the increase risk in equities. Brooks has:", "opts": ["violated the Standards by not including all of the relevant factors in the research report and making patriotic statements.", "violated the Standards by not including all of the relevant factors in the research report, but not by making patriotic statements.", "not violated the Standards."], "ans": "B", "expl": "By not mentioning the increased risk of the market, Brooks has violated the Standard on using reasonable judgment in a research report. However, the patriotic statements do not violate the Standards.", "explhtml": "<p>By not mentioning the increased risk of the market, Brooks has violated the Standard on using reasonable judgment in a research report. However, the patriotic statements do not violate the Standards.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41.b<\/div><div class=\"qtext\"><p>Randal Brooks is the chief economist for a large brokerage firm. In the aftermath of a national tragedy, Brooks feels that it is very possible that the stock market will drop significantly and not recover for several years. However, he does not believe that this is the most likely scenario but merely that the risk of investing in equities has increased. He decides to write a market commentary to the brokerage clients that discusses the reasons why the market will remain stable and talks about why he, as a private citizen, feels patriotic. He does not mention the increase risk in equities. Brooks has:<\/p><\/div>", "subj": "ethics"}, {"n": 34, "q": "Midland Investment Banking issues a prospectus for its open-end Midland Gold Fund. In the prospectus, the investment policy is disclosed as, \"We will maintain an investment posture of 50% or more in gold stocks and/or bullion, depending upon market conditions.\" This policy is maintained until the price of gold falls by 20%, leaving the fund 40% invested in gold stocks and bullion. Management decides that since the allocation was affected by market conditions, no action to either change the investment policy or to rebalance the portfolio is required. This decision is:", "opts": ["in violation of the Standard concerning fiduciary duties to clients.", "under the circumstances, not in violation of the Code and Standards.", "in violation of the Standard concerning disclosure of investment processes."], "ans": "C", "expl": "Standard V(B) Communication with Clients and Prospective Clients requires members to disclose \"general principles and investment processes\" to clients and to \"promptly disclose any changes that might significantly affect those processes.\" Under the Standard, Midland management is required either to: 1. rebalance the portfolio in a timely manner so as to maintain compliance with the investment policy or 2. communicate an intended change in that policy well in advance of the actual change so as to afford investors time to act prior to the change in investment policy taking place. Midland is in violation of the Standard.", "explhtml": "<p>Standard V(B) Communication with Clients and Prospective Clients requires members to disclose &quot;general principles and investment processes&quot; to clients and to &quot;promptly disclose any changes that might significantly affect those processes.&quot; Under the Standard, Midland management is required either to:<\/p><p>1. rebalance the portfolio in a timely manner so as to maintain compliance with the investment policy or 2. communicate an intended change in that policy well in advance of the actual change so as to afford investors time to act prior to the change in investment policy taking place.<\/p><p>Midland is in violation of the Standard.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(B)<\/div><div class=\"qtext\"><p>Midland Investment Banking issues a prospectus for its open-end Midland Gold Fund. In the prospectus, the investment policy is disclosed as, &quot;We will maintain an investment posture of 50% or more in gold stocks and/or bullion, depending upon market conditions.&quot; This policy is maintained until the price of gold falls by 20%, leaving the fund 40% invested in gold stocks and bullion. Management decides that since the allocation was affected by market conditions, no action to either change the investment policy or to rebalance the portfolio is required. This decision is:<\/p><\/div>", "subj": "ethics"}, {"n": 35, "q": "Janet Coleman, CFA, is preparing a research report on Union Utilities. During the past year, three of the five utility companies in her region have cut their dividends by 50%, on average, to provide more internal funds for capital investment. Coleman reasons that the management of Union will be under pressure to cut its dividends within the next year to remain competitive. Coleman issues a research report in which she states: \"Union will decrease its dividend from $2 to $1 a share by the second quarter to finance its investment opportunities. If investors buy the stock now at around $50 a share, their total return could exceed 20%.\" With regard to the Standard on communication with clients and prospective clients, Coleman:", "opts": ["did not violate the Standard.", "violated the Standard because she failed to distinguish opinion from fact.", "violated the Standard because she promised a specific return on an investment."], "ans": "B", "expl": "Coleman's statement that Union \"will\" decrease its dividend fails to distinguish between fact and opinion, as required by Standard V(B) Communication with Clients and Prospective Clients, because a prediction is not a fact. Her statement that total return \"could\" exceed 20% is appropriately phrased as an opinion.", "explhtml": "<p>Coleman&#x27;s statement that Union &quot;will&quot; decrease its dividend fails to distinguish between fact and opinion, as required by Standard V(B) Communication with Clients and Prospective Clients, because a prediction is not a fact. Her statement that total return &quot;could&quot; exceed 20% is appropriately phrased as an opinion.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(B)<\/div><div class=\"qtext\"><p>Janet Coleman, CFA, is preparing a research report on Union Utilities. During the past year, three of the five utility companies in her region have cut their dividends by 50%, on average, to provide more internal funds for capital investment. Coleman reasons that the management of Union will be under pressure to cut its dividends within the next year to remain competitive. Coleman issues a research report in which she states:<\/p><p>&quot;Union will decrease its dividend from $2 to $1 a share by the second quarter to finance its investment opportunities. If investors buy the stock now at around $50 a share, their total return could exceed 20%.&quot;<\/p><p>With regard to the Standard on communication with clients and prospective clients, Coleman:<\/p><\/div>", "subj": "ethics"}, {"n": 36, "q": "In order to remain in compliance when managing private client accounts, members must do all of the following EXCEPT:", "opts": ["Conduct regular reviews of client circumstances.", "Use a risk-factor model to assess the client's risk tolerance.", "Seek authorization for changes in investment policy."], "ans": "B", "expl": "There is no requirement to use a specific model in order to assess and document a client's risk tolerance. Risk tolerance is more likely to be addressed implicitly in the asset allocation guidelines that are established and updated based upon client circumstances.", "explhtml": "<p>There is no requirement to use a specific model in order to assess and document a client&#x27;s risk tolerance. Risk tolerance is more likely to be addressed implicitly in the asset allocation guidelines that are established and updated based upon client circumstances.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(B)<\/div><div class=\"qtext\"><p>In order to remain in compliance when managing private client accounts, members must do all of the following EXCEPT:<\/p><\/div>", "subj": "ethics"}, {"n": 37, "q": "Rhonda Meyer, CFA, is preparing a research report on Moon Ventures, Inc. In the course of her research she learns the following: Moon had its credit rating downgraded by a prominent rating agency 3 years ago due to sales pressure in the industry. The rating was restored 3 months later when the pressure resolved. Moon's insider trading has been substantial over the last 3 months. Holdings of Moon shares by officers, directors, and key employees were reduced by 50% during that period. In Meyer's detailed report making a buy recommendation for Moon, both the credit rating downgrade and the insider trading were omitted from the report. Meyer has:", "opts": ["violated the Code and Standards by not including the insider trading information in her report.", "violated the Code and Standards by not including the insider trading information and by not including the credit rating downgrade in her report.", "not violated the Code and Standards in her report."], "ans": "A", "expl": "Standard V(B), Communication with Clients and Prospective Clients, requires analysts to use reasonable judgment regarding the inclusion or exclusion of relevant factors in their research reports. It would not be unreasonable to exclude the temporary credit downgrade from 3 years earlier.", "explhtml": "<p>Standard V(B), Communication with Clients and Prospective Clients, requires analysts to use reasonable judgment regarding the inclusion or exclusion of relevant factors in their research reports. It would not be unreasonable to exclude the temporary credit downgrade from 3 years earlier.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(B)<\/div><div class=\"qtext\"><p>Rhonda Meyer, CFA, is preparing a research report on Moon Ventures, Inc. In the course of her research she learns the following:<\/p><p>Moon had its credit rating downgraded by a prominent rating agency 3 years ago due to sales pressure in the industry. The rating was restored 3 months later when the pressure resolved. Moon&#x27;s insider trading has been substantial over the last 3 months. Holdings of Moon shares by officers, directors, and key employees were reduced by 50% during that period.<\/p><p>In Meyer&#x27;s detailed report making a buy recommendation for Moon, both the credit rating downgrade and the insider trading were omitted from the report.<\/p><p>Meyer has:<\/p><\/div>", "subj": "ethics"}, {"n": 38, "q": "In the preparation of a research report, a CFA Institute member may emphasize certain matters, touch briefly on others, and omit some altogether:", "opts": ["under no circumstances.", "provided that the analyst both has a reasonable basis and is unconstrained by the Mosaic theory.", "provided that the analyst has a reasonable basis for his or her actions."], "ans": "C", "expl": "According to Standard V(B), the analyst must use reasonable judgment in identifying relevant factors when communicating with clients and prospects. The Mosaic theory does not apply here.", "explhtml": "<p>According to Standard V(B), the analyst must use reasonable judgment in identifying relevant factors when communicating with clients and prospects. The Mosaic theory does not apply here.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(B)<\/div><div class=\"qtext\"><p>In the preparation of a research report, a CFA Institute member may emphasize certain matters, touch briefly on others, and omit some altogether:<\/p><\/div>", "subj": "ethics"}, {"n": 39, "q": "According to CFA Institute Standards of Professional Conduct, members are least likely required to:", "opts": ["distribute a detailed research report to clients with any recommendation.", "analyze the investment's basic characteristics before recommending a specific investment to a broad client group.", "make diligent efforts to determine whether third party research relied on is sound."], "ans": "A", "expl": "Recommendations can be made in various contexts. For example, an analyst's firm may issue a list of buy recommendations or a brief recommendation that does not contain all the relevant details of the analysis, but clients must be informed that a full analysis supporting the recommendation is available. The other actions are required by the Standards.", "explhtml": "<p>Recommendations can be made in various contexts. For example, an analyst&#x27;s firm may issue a list of buy recommendations or a brief recommendation that does not contain all the relevant details of the analysis, but clients must be informed that a full analysis supporting the recommendation is available. The other actions are required by the Standards.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(C)<\/div><div class=\"qtext\"><p>According to CFA Institute Standards of Professional Conduct, members are least likely required to:<\/p><\/div>", "subj": "ethics"}, {"n": 40, "q": "The following scenarios refer to recommendations made by two analysts. Jean King, CFA, is a quantitative analyst at Quantlogic, Inc. King uses computer-generated screens to differentiate value and growth stocks based on accounting numbers such as sales, cash flow, earnings, and book value. Based on her analysis of all domestically traded stocks in the U.S. over the past year, King concludes that value stocks as a class have underperformed growth stocks over that period. Using only this analysis, she recommends that account executives at Quantlogic sell all value stocks from the portfolios for which they have discretionary authority to trade and replace these stocks with growth stocks. James Capelli, CFA, is a fundamental analyst at Wheaton Capital Management, which focuses on regional stocks. His analysis of Branson Wireless includes the investment's basic characteristics such as information about historical earnings, ownership of assets, outstanding contracts, and other business factors. In addition to conducting both a general industry analysis and a company financial analysis, Capelli interviews key executives at Branson. Based on his analysis, he concludes that the company's future prospects are strong and issues a \"buy\" recommendation. According to CFA Institute Standards of Professional Conduct, did King and Capelli have a reasonable and adequate basis for making their recommendations?", "opts": ["Capelli has a reasonable basis for his recommendation, but King does not.", "King has a reasonable basis for his recommendation, but Capelli does not.", "Both King and Capelli have a reasonable basis for their recommendations."], "ans": "A", "expl": "Capelli appears to have exercised diligence and thoroughness in making his recommendation. King's recommendation is not based on thorough quantitative work because the period used in her study is only one year. Also, her recommendation does not consider the client's specific needs and circumstances.", "explhtml": "<p>Capelli appears to have exercised diligence and thoroughness in making his recommendation. King&#x27;s recommendation is not based on thorough quantitative work because the period used in her study is only one year. Also, her recommendation does not consider the client&#x27;s specific needs and circumstances.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(A)<\/div><div class=\"qtext\"><p>The following scenarios refer to recommendations made by two analysts.<\/p><p>Jean King, CFA, is a quantitative analyst at Quantlogic, Inc. King uses computer-generated screens to differentiate value and growth stocks based on accounting numbers such as sales, cash flow, earnings, and book value. Based on her analysis of all domestically traded stocks in the U.S. over the past year, King concludes that value stocks as a class have underperformed growth stocks over that period. Using only this analysis, she recommends that account executives at Quantlogic sell all value stocks from the portfolios for which they have discretionary authority to trade and replace these stocks with growth stocks. James Capelli, CFA, is a fundamental analyst at Wheaton Capital Management, which focuses on regional stocks. His analysis of Branson Wireless includes the investment&#x27;s basic characteristics such as information about historical earnings, ownership of assets, outstanding contracts, and other business factors. In addition to conducting both a general industry analysis and a company financial analysis, Capelli interviews key executives at Branson. Based on his analysis, he concludes that the company&#x27;s future prospects are strong and issues a &quot;buy&quot; recommendation.<\/p><p>According to CFA Institute Standards of Professional Conduct, did King and Capelli have a reasonable and adequate basis for making their recommendations?<\/p><\/div>", "subj": "ethics"}, {"n": 41, "q": "An analyst receives a research report from a colleague. The colleague's report has an elaborate table with performance data on publicly traded stocks. The colleague says the data in the table consists of measures provided by Standard & Poor's. The analyst finds the table a useful reference for a report she is writing. She uses several pieces of data from the table. The analyst is potentially in violation of:", "opts": ["no particular standard because this is appropriate activity.", "Standard V(A), Diligence and Reasonable Basis, if she does not first verify the data in the table is accurate.", "Standard I(C), Misrepresentation, concerning the use of the work of others."], "ans": "B", "expl": "Since the data in the table supposedly comes from Standard & Poor's, a recognized data source, the analyst does not have to cite the source of the data. However, the analyst needs to use reasonable care and verify that the data is accurate by going back to the source. Had the analyst printed the table prepared by her colleague without acknowledgement, the analyst would have violated Standard I(C), Misrepresentation.", "explhtml": "<p>Since the data in the table supposedly comes from Standard &amp; Poor&#x27;s, a recognized data source, the analyst does not have to cite the source of the data. However, the analyst needs to use reasonable care and verify that the data is accurate by going back to the source. Had the analyst printed the table prepared by her colleague without acknowledgement, the analyst would have violated Standard I(C), Misrepresentation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(A)<\/div><div class=\"qtext\"><p>An analyst receives a research report from a colleague. The colleague&#x27;s report has an elaborate table with performance data on publicly traded stocks. The colleague says the data in the table consists of measures provided by Standard &amp; Poor&#x27;s. The analyst finds the table a useful reference for a report she is writing. She uses several pieces of data from the table. The analyst is potentially in violation of:<\/p><\/div>", "subj": "ethics"}, {"n": 42, "q": "An analyst finds a stock with historical returns that are not correlated with interest rate changes. The analyst writes a report for his clients that have large allocations in fixed-income instruments and emphasizes the observed lack of correlation. He feels the stock would be of little value to investors whose portfolios are composed primarily of equities. The clients with allocations of fixed income instruments are the only clients to see the report. According to Standard V(B), Communication with Clients and Prospective Clients, the analyst has:", "opts": ["violated the article in the Standard concerning facts and opinions.", "not violated the Standard.", "violated the Standard concerning fair dealings with all clients."], "ans": "B", "expl": "Recommending a stock whose return is uncorrelated with interest rate changes is appropriate for the clients described in the problem. Emphasizing the lack of correlation is appropriate as long as the analyst makes no guarantees concerning the relationship in the future. Reporting historical correlation is a presentation of fact, and is not in violation. The analyst is free to show the report only to investors for whom the investment is appropriate.", "explhtml": "<p>Recommending a stock whose return is uncorrelated with interest rate changes is appropriate for the clients described in the problem. Emphasizing the lack of correlation is appropriate as long as the analyst makes no guarantees concerning the relationship in the future. Reporting historical correlation is a presentation of fact, and is not in violation. The analyst is free to show the report only to investors for whom the investment is appropriate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(B)<\/div><div class=\"qtext\"><p>An analyst finds a stock with historical returns that are not correlated with interest rate changes. The analyst writes a report for his clients that have large allocations in fixed-income instruments and emphasizes the observed lack of correlation. He feels the stock would be of little value to investors whose portfolios are composed primarily of equities. The clients with allocations of fixed income instruments are the only clients to see the report. According to Standard V(B), Communication with Clients and Prospective Clients, the analyst has:<\/p><\/div>", "subj": "ethics"}, {"n": 43, "q": "According to the CFA Institute's Standards of Professional Conduct, Fleming's execution of Waverly's trade order after confirming the appropriateness of the trade is most likely in violation of:", "opts": ["Standard I(C)—Misrepresentation for not disclosing to Waverly that he did not read the marketing materials, but is not in violation of Standard III(C)—Suitability because the client analyzed the investment thoroughly.", "Standard V(B)—Communication with Clients and Prospective Clients for not separating fact from opinion, but is not in violation of Standard I(C )— Misrepresentation because his guarantee of future investment performance was not a written representation.", "Standard V(A)—Diligence and Reasonable Basis for not exercising diligence and thoroughness in his analysis of the investment and Standard III(C)—Suitability for recommending an investment before determining if the investment was appropriate for the client."], "ans": "C", "expl": "Fleming violated Standard V(A)—Diligence and Reasonable Basis because he was not familiar with the specifics of the investment, but made an investment recommendation based upon his confidence in Waverly's investment expertise. Fleming is also in violation of Standard III(C) —Suitability because his agreement with Waverly's investment decision was not based upon the suitability of the offering within the context of Waverly's total portfolio. Standard I(C)— Misrepresentation was also violated when Fleming confirmed that Waverly should purchase shares in DCH's secondary offering, but failed to inform the client that he had not analyzed the investment in any way. Waverly would reasonably expect Fleming to analyze an investment prior to its recommendation and was therefore misled.", "explhtml": "<p>Fleming violated Standard V(A)—Diligence and Reasonable Basis because he was not familiar with the specifics of the investment, but made an investment recommendation based upon his confidence in Waverly&#x27;s investment expertise. Fleming is also in violation of Standard III(C) —Suitability because his agreement with Waverly&#x27;s investment decision was not based upon the suitability of the offering within the context of Waverly&#x27;s total portfolio. Standard I(C)— Misrepresentation was also violated when Fleming confirmed that Waverly should purchase shares in DCH&#x27;s secondary offering, but failed to inform the client that he had not analyzed the investment in any way. Waverly would reasonably expect Fleming to analyze an investment prior to its recommendation and was therefore misled.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 43–46<\/summary><div class=\"vig-body\"><p>William Fleming is an investment advisor for GlobalBank, a large, multinational financial corporation. He is based in the New York office, and his client base consists of medium to large institutional accounts in the United States and Western Europe. Roughly three-quarters of his clients pay performance-based fees, while the remaining one-quarter pay fees based on assets. GlobalBank's investment banking division is an industry leader, and Fleming is able to offer his clients the opportunity to participate in some of the hottest initial public offerings (IPOs) and secondary offerings brought to market.<\/p><p>One of Fleming's accounts, Waverly Capital Partners, has contacted him regarding an upcoming secondary offering by DCH Corp., for which GlobalBank will serve as lead underwriter. Waverly has already performed its due diligence on the offering and is interested in purchasing a substantial position in the secondary offering in order to employ the company's current surplus of cash. Waverly's representative tells Fleming over the phone that they would like to purchase 5,000 shares of the offering but gives no other details of its analysis of the offering. Fleming has not read the prospectus for the offering yet and is not familiar with the details, but because he has confidence in Waverly's investment expertise, he tells them that he too believes they should participate in the offering. Because Waverly does a significant amount of business with GlobalBank's other divisions, Fleming assures them that they will be able to obtain their desired allocation of the offering and takes the order. After taking the purchase order for the Waverly account, Fleming thoroughly reads the prospectus and marketing materials for the offering, as well as past research reports on the issuing company. He determines that DCH shares would be a suitable investment for one of his other clients, The Crockett Foundation. He contacts the Chief Investment Officer (CIO) of the foundation, explains how an investment in DCH would fit with its current risk and return objectives as detailed in the foundation's investment policy statement (IPS) and provides her with the prospectus for the offering. Fleming tells her that GlobalBank was the lead underwriter for DCH's initial public offering three years ago and that since then, the stock has outperformed the S&amp;P 500 by at least 15% every year. Fleming also states that the company's financial position is now even stronger and that the shares will perform at least as well as the lowest return earned on the IPO shares in the last three years. He then proceeds to tell her, \"If the foundation is interested in the offering, you should place an order immediately because the issue may be oversubscribed due to strong interest in the offering from Waverly Capital Partners and other clients.\" This information is enough to motivate Crocket's CIO to call a meeting with the foundation's investment committee.<\/p><p>After a quick meeting with Crockett's investment committee, the CIO calls Fleming to say that the foundation is interested in the offering and would like to place a purchase order. Crockett does not currently conduct any additional business through GlobalBank's other divisions. Because of GlobalBank's trade allocation policy, coupled with the high probability that the offering will be oversubscribed, Crockett is unlikely to be allocated as many shares of the offering as they would like to purchase. In order to obtain the desired number of shares for the client, Fleming devises a plan. He plans to add the Crockett Foundation's order to Waverly's order, and once the order is filled he will re-allocate the extra shares back to the foundation's account at the end of the day. He feels that his action is justified because Crockett has maintained its account with Fleming and GlobalBank for over ten years. In addition, Fleming has traders at GlobalBank sell large blocks of DCH over several days in order to push the stock price lower. The drop in value causes smaller investors at GlobalBank, who are not Fleming's clients, to withdraw their orders for shares of DCH's secondary offering. Fleming determines that the fewer number of purchase orders and the plan to piggyback on Waverly's order will allow Crocket to acquire its desired allocation of shares in DCH's secondary offering. Having achieved his goal, Fleming allows GlobalBank's traders to repurchase the firm's shares of DCH.<\/p><p>Twelve months pass, and the shares of DCH's secondary offering have declined in price by nearly 20%. The CIO of the Crockett Foundation calls a meeting with Fleming to discuss the poor performance of the security and to review the basis upon which Fleming recommended the investment. Fleming prepares Crockett's file to take with him to the meeting. The file contains Crockett's IPS, a detailed account of the purchase order and all conversations held between Fleming and the CIO. In accordance with his own established procedures, however, Fleming maintained the original analysis supporting the purchase of shares in DCH's secondary offering for nine months after the investment was made.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.8, LOS 41.a<\/div><div class=\"qtext\"><p>According to the CFA Institute&#x27;s Standards of Professional Conduct, Fleming&#x27;s execution of Waverly&#x27;s trade order after confirming the appropriateness of the trade is most likely in violation of:<\/p><\/div>", "subj": "ethics"}, {"n": 44, "q": "According to CFA Institute Standards of Professional Conduct, which of the following of Fleming's actions is most likely a violation of Standard I(C)—Misrepresentation? Fleming:", "opts": ["tells the CIO of Crocket Foundation that shares of DCH’s IPO outperformed the S&P 500 by at least 15% in each of the last three years since the offering.", "executes the trades on DCH Corp. per Waverly’s instructions without first referring to Waverly’s IPS.", "tells the CIO of the Crockett Foundation that DCH’s secondary offering will earn at least the lowest return earned on its IPO shares over the last three years."], "ans": "C", "expl": "Standard I(C)—Misrepresentation prohibits members and candidates from making any untrue statements or omissions of facts that may be false or misleading. Guaranteeing a particular rate of return on an investment is in direct violation of the standard. Fleming has essentially guaranteed a minimum rate of return on the secondary offering equal to the lowest rate of return earned on the IPO shares over the last three years. Even though a specific number isn't mentioned in the question, it would be observable by the Crockett Foundation. The other statements might also be considered violations of the standards but are not specifically violations of I(C)—Misrepresentation as noted in the question.", "explhtml": "<p>Standard I(C)—Misrepresentation prohibits members and candidates from making any untrue statements or omissions of facts that may be false or misleading. Guaranteeing a particular rate of return on an investment is in direct violation of the standard. Fleming has essentially guaranteed a minimum rate of return on the secondary offering equal to the lowest rate of return earned on the IPO shares over the last three years. Even though a specific number isn&#x27;t mentioned in the question, it would be observable by the Crockett Foundation. The other statements might also be considered violations of the standards but are not specifically violations of I(C)—Misrepresentation as noted in the question.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 43–46<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>William Fleming is an investment advisor for GlobalBank, a large, multinational financial corporation. He is based in the New York office, and his client base consists of medium to large institutional accounts in the United States and Western Europe. Roughly three-quarters of his clients pay performance-based fees, while the remaining one-quarter pay fees based on assets. GlobalBank's investment banking division is an industry leader, and Fleming is able to offer his clients the opportunity to participate in some of the hottest initial public offerings (IPOs) and secondary offerings brought to market.<\/p><p>One of Fleming's accounts, Waverly Capital Partners, has contacted him regarding an upcoming secondary offering by DCH Corp., for which GlobalBank will serve as lead underwriter. Waverly has already performed its due diligence on the offering and is interested in purchasing a substantial position in the secondary offering in order to employ the company's current surplus of cash. Waverly's representative tells Fleming over the phone that they would like to purchase 5,000 shares of the offering but gives no other details of its analysis of the offering. Fleming has not read the prospectus for the offering yet and is not familiar with the details, but because he has confidence in Waverly's investment expertise, he tells them that he too believes they should participate in the offering. Because Waverly does a significant amount of business with GlobalBank's other divisions, Fleming assures them that they will be able to obtain their desired allocation of the offering and takes the order. After taking the purchase order for the Waverly account, Fleming thoroughly reads the prospectus and marketing materials for the offering, as well as past research reports on the issuing company. He determines that DCH shares would be a suitable investment for one of his other clients, The Crockett Foundation. He contacts the Chief Investment Officer (CIO) of the foundation, explains how an investment in DCH would fit with its current risk and return objectives as detailed in the foundation's investment policy statement (IPS) and provides her with the prospectus for the offering. Fleming tells her that GlobalBank was the lead underwriter for DCH's initial public offering three years ago and that since then, the stock has outperformed the S&amp;P 500 by at least 15% every year. Fleming also states that the company's financial position is now even stronger and that the shares will perform at least as well as the lowest return earned on the IPO shares in the last three years. He then proceeds to tell her, \"If the foundation is interested in the offering, you should place an order immediately because the issue may be oversubscribed due to strong interest in the offering from Waverly Capital Partners and other clients.\" This information is enough to motivate Crocket's CIO to call a meeting with the foundation's investment committee.<\/p><p>After a quick meeting with Crockett's investment committee, the CIO calls Fleming to say that the foundation is interested in the offering and would like to place a purchase order. Crockett does not currently conduct any additional business through GlobalBank's other divisions. Because of GlobalBank's trade allocation policy, coupled with the high probability that the offering will be oversubscribed, Crockett is unlikely to be allocated as many shares of the offering as they would like to purchase. In order to obtain the desired number of shares for the client, Fleming devises a plan. He plans to add the Crockett Foundation's order to Waverly's order, and once the order is filled he will re-allocate the extra shares back to the foundation's account at the end of the day. He feels that his action is justified because Crockett has maintained its account with Fleming and GlobalBank for over ten years. In addition, Fleming has traders at GlobalBank sell large blocks of DCH over several days in order to push the stock price lower. The drop in value causes smaller investors at GlobalBank, who are not Fleming's clients, to withdraw their orders for shares of DCH's secondary offering. Fleming determines that the fewer number of purchase orders and the plan to piggyback on Waverly's order will allow Crocket to acquire its desired allocation of shares in DCH's secondary offering. Having achieved his goal, Fleming allows GlobalBank's traders to repurchase the firm's shares of DCH.<\/p><p>Twelve months pass, and the shares of DCH's secondary offering have declined in price by nearly 20%. The CIO of the Crockett Foundation calls a meeting with Fleming to discuss the poor performance of the security and to review the basis upon which Fleming recommended the investment. Fleming prepares Crockett's file to take with him to the meeting. The file contains Crockett's IPS, a detailed account of the purchase order and all conversations held between Fleming and the CIO. In accordance with his own established procedures, however, Fleming maintained the original analysis supporting the purchase of shares in DCH's secondary offering for nine months after the investment was made.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.2, LOS 41.a<\/div><div class=\"qtext\"><p>According to CFA Institute Standards of Professional Conduct, which of the following of Fleming&#x27;s actions is most likely a violation of Standard I(C)—Misrepresentation? Fleming:<\/p><\/div>", "subj": "ethics"}, {"n": 45, "q": "According to CFA Institute Standards of Professional Conduct, did Fleming's conversation with the CIO of the Crockett Foundation or his decision to sell GlobalBank's position in DCH stock most likely violate Standard II(B)—Market Manipulation? Conversation Sell decision with CIO", "opts": ["Yes No", "Yes Yes", "No Yes"], "ans": "C", "expl": "Standard II(B)—Market Manipulation prohibits practices that distort prices or artificially inflate trading volume with the intent to mislead market participants, including the dissemination of false or misleading information. Although Fleming's conversation included two prohibited comments (a guarantee of performance and an inappropriate disclosure of client information), he did not give the CIO of Crockett information in an attempt to manipulate prices or trading volume and thus did not violate Standard II(B). His decision to sell GlobalBank's shares of DCH, however, was intended to manipulate the price of DCH stock in order to intimidate smaller investors into withdrawing their purchase order in the secondary offering, thereby freeing up shares for his client, the Crockett Foundation. This action is clearly a violation of Standard II(B).", "explhtml": "<p>Standard II(B)—Market Manipulation prohibits practices that distort prices or artificially inflate trading volume with the intent to mislead market participants, including the dissemination of false or misleading information. Although Fleming&#x27;s conversation included two prohibited comments (a guarantee of performance and an inappropriate disclosure of client information), he did not give the CIO of Crockett information in an attempt to manipulate prices or trading volume and thus did not violate Standard II(B). His decision to sell GlobalBank&#x27;s shares of DCH, however, was intended to manipulate the price of DCH stock in order to intimidate smaller investors into withdrawing their purchase order in the secondary offering, thereby freeing up shares for his client, the Crockett Foundation. This action is clearly a violation of Standard II(B).<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 43–46<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>William Fleming is an investment advisor for GlobalBank, a large, multinational financial corporation. He is based in the New York office, and his client base consists of medium to large institutional accounts in the United States and Western Europe. Roughly three-quarters of his clients pay performance-based fees, while the remaining one-quarter pay fees based on assets. GlobalBank's investment banking division is an industry leader, and Fleming is able to offer his clients the opportunity to participate in some of the hottest initial public offerings (IPOs) and secondary offerings brought to market.<\/p><p>One of Fleming's accounts, Waverly Capital Partners, has contacted him regarding an upcoming secondary offering by DCH Corp., for which GlobalBank will serve as lead underwriter. Waverly has already performed its due diligence on the offering and is interested in purchasing a substantial position in the secondary offering in order to employ the company's current surplus of cash. Waverly's representative tells Fleming over the phone that they would like to purchase 5,000 shares of the offering but gives no other details of its analysis of the offering. Fleming has not read the prospectus for the offering yet and is not familiar with the details, but because he has confidence in Waverly's investment expertise, he tells them that he too believes they should participate in the offering. Because Waverly does a significant amount of business with GlobalBank's other divisions, Fleming assures them that they will be able to obtain their desired allocation of the offering and takes the order. After taking the purchase order for the Waverly account, Fleming thoroughly reads the prospectus and marketing materials for the offering, as well as past research reports on the issuing company. He determines that DCH shares would be a suitable investment for one of his other clients, The Crockett Foundation. He contacts the Chief Investment Officer (CIO) of the foundation, explains how an investment in DCH would fit with its current risk and return objectives as detailed in the foundation's investment policy statement (IPS) and provides her with the prospectus for the offering. Fleming tells her that GlobalBank was the lead underwriter for DCH's initial public offering three years ago and that since then, the stock has outperformed the S&amp;P 500 by at least 15% every year. Fleming also states that the company's financial position is now even stronger and that the shares will perform at least as well as the lowest return earned on the IPO shares in the last three years. He then proceeds to tell her, \"If the foundation is interested in the offering, you should place an order immediately because the issue may be oversubscribed due to strong interest in the offering from Waverly Capital Partners and other clients.\" This information is enough to motivate Crocket's CIO to call a meeting with the foundation's investment committee.<\/p><p>After a quick meeting with Crockett's investment committee, the CIO calls Fleming to say that the foundation is interested in the offering and would like to place a purchase order. Crockett does not currently conduct any additional business through GlobalBank's other divisions. Because of GlobalBank's trade allocation policy, coupled with the high probability that the offering will be oversubscribed, Crockett is unlikely to be allocated as many shares of the offering as they would like to purchase. In order to obtain the desired number of shares for the client, Fleming devises a plan. He plans to add the Crockett Foundation's order to Waverly's order, and once the order is filled he will re-allocate the extra shares back to the foundation's account at the end of the day. He feels that his action is justified because Crockett has maintained its account with Fleming and GlobalBank for over ten years. In addition, Fleming has traders at GlobalBank sell large blocks of DCH over several days in order to push the stock price lower. The drop in value causes smaller investors at GlobalBank, who are not Fleming's clients, to withdraw their orders for shares of DCH's secondary offering. Fleming determines that the fewer number of purchase orders and the plan to piggyb
