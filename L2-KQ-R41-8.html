<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 41.8 — Guidance for Standard V · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>

  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}

  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);

  shell.appendChild(content); return shell;
}
</script>

<script>
const DATA = [{"n": 1, "q": "Nicole Wise, CFA, is an analyst at Chicago Securities. She attends a meeting with management of one of the companies that she covers. During the meeting, management expresses great optimism about the company's recent acquisition of a new business. Wise is excited about these prospects and issues a research report that states that the company is about to achieve significant success with the new acquisition. Wise has:", "opts": ["not violated CFA Institute Standards of Professional Conduct because she had reasonable reason to believe that the statements in her report were true.", "violated CFA Institute Standards of Professional Conduct because she did not check the accuracy of the statements that management made.", "violated CFA Institute Standards of Professional Conduct because she misrepresented the optimism by turning it to certainty."], "ans": "C", "expl": "Standard V(B), Communication with Clients and Prospective Clients. Members must distinguish between fact and opinion in the presentation of a research report or investment recommendation. Wise violated the standard because she misrepresented management's enthusiasm by turning it into certainty.", "explhtml": "<p>Standard V(B), Communication with Clients and Prospective Clients. Members must distinguish between fact and opinion in the presentation of a research report or investment recommendation. Wise violated the standard because she misrepresented management&#x27;s enthusiasm by turning it into certainty.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(B)<\/div><div class=\"qtext\"><p>Nicole Wise, CFA, is an analyst at Chicago Securities. She attends a meeting with management of one of the companies that she covers. During the meeting, management expresses great optimism about the company&#x27;s recent acquisition of a new business. Wise is excited about these prospects and issues a research report that states that the company is about to achieve significant success with the new acquisition. Wise has:<\/p><\/div>", "subj": "ethics"}, {"n": 2, "q": "In order to remain an active member of CFA Institute, Jones must annually:", "opts": ["submit her completed Professional Conduct Statement, pay applicable membership dues, and complete forty hours of continuing education.", "pay applicable membership dues and complete forty hours of continuing education.", "submit her completed Professional Conduct Statement and pay applicable membership dues."], "ans": "C", "expl": "To remain an active member, Jones must agree to abide by the Code and Standards and the Professional Conduct Program. This is accomplished by completing the Professional Conduct Statement on an annual basis. In addition, Jones must pay annual membership dues. Continuing education is encouraged but not required to remain an active member.", "explhtml": "<p>To remain an active member, Jones must agree to abide by the Code and Standards and the Professional Conduct Program. This is accomplished by completing the Professional Conduct Statement on an annual basis. In addition, Jones must pay annual membership dues. Continuing education is encouraged but not required to remain an active member.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 2–6<\/summary><div class=\"vig-body\"><p>LMS Securities is a boutique broker-dealer specializing in private placements for technology companies. The firm also provides aftermarket support for the companies that go public after private rounds of financing. This support includes market making and research coverage.<\/p><p>Susan Jones, CFA, is an analyst at LMS Securities. She is responsible for a subset of the companies for which LMS offers research coverage. She recently received her annual CFA. Institute Professional Conduct statement, but has not yet filled it out and turned it in. Steve Brown is an analyst who directs the due diligence process for LMS Securities' private placements. Brown passed the Level II exam five years ago, and has registered for the Level III exam every year since then, but has never taken it. He is registered for the Level III CFA exam next June, but nobody at the office believes he will actually take the test.<\/p><p>Sunrise Technologies is a longtime client of LMS Securities. LMS arranged four levels of private financing, for Sunrise, providing in-depth business consulting as well as handling all of the private placements, Sunrise went public 90 days ago and is currently trading at $14 per share.<\/p><p>Kenneth Karloff, CEO of LMS Securities, instructed Jones to write a favorable research report on Sunrise Technologies right before the company went public, setting a price target of at least $30 per share. Jones has developed a number of alternative cash flow projections for Sunrise Technologies. She picks an optimistic scenario to justify a $30 price target and issues a positive report using those projections.<\/p><p>After Sunrise Technologies has gone public, Karloff decides to help Jones to write a more- detailed research report on the company. Karloff provides Jones with information about the product pipeline and sensitive patent litigation that was given to him in confidence by Sunrise executives while the company was private. Given the product pipeline and legal outlook, Jones revises her cash flow models to reflect greater growth, then writes a positive report and advises LMS's clients to buy the stock.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.8, LOS 41: V(A)<\/div><div class=\"qtext\"><p>In order to remain an active member of CFA Institute, Jones must annually:<\/p><\/div>", "subj": "ethics"}, {"n": 3, "q": "Which of the following statements regarding the research report on Sunrise Technologies after the company went public is CORRECT?", "opts": ["Jones is in compliance with the objectivity Standard because she made her recommendation based facts, not conjecture; Karloff has violated the Standard regarding the use of material nonpublic information.", "Jones has violated the Standard on research reports because she failed to distinguish between fact and opinion; Karloff is in compliance with the supervisoryresponsibilities Standard because he is keeping up with Jones’ actions and ensuring her report is accurate.", "Jones has violated the misrepresentation Standard with her aggressive growth prediction for Sunrise Technologies; Karloff has violated the plagiarism Standard by disseminating information he received in confidence."], "ans": "A", "expl": "Jones' second research report made reference to hard facts, and her analysis and revision of the cash flow projections seems thorough and reasonable. This time, Karloff did not press her to express a certain opinion, and she found the information about the company compelling. She projected higher growth in cash flow for Sunrise, but nowhere is it said that she guaranteed a hard target. Jones is in compliance with the misrepresentation, objectivity, reasonable-basis, and research-report Standards. Karloff violated the insider-trading Standard because the information was given to him in confidence. He may also have violated his fiduciary duty to Sunrise, which probably kept the information private for a reason.", "explhtml": "<p>Jones&#x27; second research report made reference to hard facts, and her analysis and revision of the cash flow projections seems thorough and reasonable. This time, Karloff did not press her to express a certain opinion, and she found the information about the company compelling. She projected higher growth in cash flow for Sunrise, but nowhere is it said that she guaranteed a hard target. Jones is in compliance with the misrepresentation, objectivity, reasonable-basis, and research-report Standards. Karloff violated the insider-trading Standard because the information was given to him in confidence. He may also have violated his fiduciary duty to Sunrise, which probably kept the information private for a reason.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 2–6<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>LMS Securities is a boutique broker-dealer specializing in private placements for technology companies. The firm also provides aftermarket support for the companies that go public after private rounds of financing. This support includes market making and research coverage.<\/p><p>Susan Jones, CFA, is an analyst at LMS Securities. She is responsible for a subset of the companies for which LMS offers research coverage. She recently received her annual CFA. Institute Professional Conduct statement, but has not yet filled it out and turned it in. Steve Brown is an analyst who directs the due diligence process for LMS Securities' private placements. Brown passed the Level II exam five years ago, and has registered for the Level III exam every year since then, but has never taken it. He is registered for the Level III CFA exam next June, but nobody at the office believes he will actually take the test.<\/p><p>Sunrise Technologies is a longtime client of LMS Securities. LMS arranged four levels of private financing, for Sunrise, providing in-depth business consulting as well as handling all of the private placements, Sunrise went public 90 days ago and is currently trading at $14 per share.<\/p><p>Kenneth Karloff, CEO of LMS Securities, instructed Jones to write a favorable research report on Sunrise Technologies right before the company went public, setting a price target of at least $30 per share. Jones has developed a number of alternative cash flow projections for Sunrise Technologies. She picks an optimistic scenario to justify a $30 price target and issues a positive report using those projections.<\/p><p>After Sunrise Technologies has gone public, Karloff decides to help Jones to write a more- detailed research report on the company. Karloff provides Jones with information about the product pipeline and sensitive patent litigation that was given to him in confidence by Sunrise executives while the company was private. Given the product pipeline and legal outlook, Jones revises her cash flow models to reflect greater growth, then writes a positive report and advises LMS's clients to buy the stock.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.8, LOS 41: V(A)<\/div><div class=\"qtext\"><p>Which of the following statements regarding the research report on Sunrise Technologies after the company went public is CORRECT?<\/p><\/div>", "subj": "ethics"}, {"n": 4, "q": "According to CFA Institute Standards concerning fair dealing, Jones is required to do which of the following?", "opts": ["Disseminate new investment recommendations to all clients at the same time.", "Disclose to all clients whether different levels of service are offered.", "Ensure that accounts belonging to her immediate family purchase securities only after other clients have had the chance to buy."], "ans": "B", "expl": "Jones must disclose different levels of service to all clients. Jones must inform clients about new buy recommendations and advise them not to sell, but she cannot disregard the order if the client still wishes to sell. Family-owned accounts should be handled in the same way as other accounts, and cannot be made to wait until everyone else has acted. The Standard allows for the fact that it is impossible to notify everyone at the same time.", "explhtml": "<p>Jones must disclose different levels of service to all clients. Jones must inform clients about new buy recommendations and advise them not to sell, but she cannot disregard the order if the client still wishes to sell. Family-owned accounts should be handled in the same way as other accounts, and cannot be made to wait until everyone else has acted. The Standard allows for the fact that it is impossible to notify everyone at the same time.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 2–6<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>LMS Securities is a boutique broker-dealer specializing in private placements for technology companies. The firm also provides aftermarket support for the companies that go public after private rounds of financing. This support includes market making and research coverage.<\/p><p>Susan Jones, CFA, is an analyst at LMS Securities. She is responsible for a subset of the companies for which LMS offers research coverage. She recently received her annual CFA. Institute Professional Conduct statement, but has not yet filled it out and turned it in. Steve Brown is an analyst who directs the due diligence process for LMS Securities' private placements. Brown passed the Level II exam five years ago, and has registered for the Level III exam every year since then, but has never taken it. He is registered for the Level III CFA exam next June, but nobody at the office believes he will actually take the test.<\/p><p>Sunrise Technologies is a longtime client of LMS Securities. LMS arranged four levels of private financing, for Sunrise, providing in-depth business consulting as well as handling all of the private placements, Sunrise went public 90 days ago and is currently trading at $14 per share.<\/p><p>Kenneth Karloff, CEO of LMS Securities, instructed Jones to write a favorable research report on Sunrise Technologies right before the company went public, setting a price target of at least $30 per share. Jones has developed a number of alternative cash flow projections for Sunrise Technologies. She picks an optimistic scenario to justify a $30 price target and issues a positive report using those projections.<\/p><p>After Sunrise Technologies has gone public, Karloff decides to help Jones to write a more- detailed research report on the company. Karloff provides Jones with information about the product pipeline and sensitive patent litigation that was given to him in confidence by Sunrise executives while the company was private. Given the product pipeline and legal outlook, Jones revises her cash flow models to reflect greater growth, then writes a positive report and advises LMS's clients to buy the stock.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.8, LOS 41: V(A)<\/div><div class=\"qtext\"><p>According to CFA Institute Standards concerning fair dealing, Jones is required to do which of the following?<\/p><\/div>", "subj": "ethics"}, {"n": 5, "q": "Which of the following statements could Brown put on his resume without violating Standard VII(B): Reference to CFA Institute, the CFA Designation, and the CFA Program?", "opts": ["I am a Level III CFA candidate eligible to receive my charter in November 2005.", "If I pass the Level III test, I may be eligible for my CFA charter late next year.", "I am a Level III CFA and should become a chartered financial analyst next year."], "ans": "B", "expl": "This statement is quite literally correct, and complies with the Standards. \"Level III CFA\" is not an acceptable use of the CFA mark. Candidates should not offer a prediction about the time they will earn their charter. While Brown is not likely to take the test, as long as he is registered, he may refer to himself as a candidate.", "explhtml": "<p>This statement is quite literally correct, and complies with the Standards. &quot;Level III CFA&quot; is not an acceptable use of the CFA mark. Candidates should not offer a prediction about the time they will earn their charter. While Brown is not likely to take the test, as long as he is registered, he may refer to himself as a candidate.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 2–6<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>LMS Securities is a boutique broker-dealer specializing in private placements for technology companies. The firm also provides aftermarket support for the companies that go public after private rounds of financing. This support includes market making and research coverage.<\/p><p>Susan Jones, CFA, is an analyst at LMS Securities. She is responsible for a subset of the companies for which LMS offers research coverage. She recently received her annual CFA. Institute Professional Conduct statement, but has not yet filled it out and turned it in. Steve Brown is an analyst who directs the due diligence process for LMS Securities' private placements. Brown passed the Level II exam five years ago, and has registered for the Level III exam every year since then, but has never taken it. He is registered for the Level III CFA exam next June, but nobody at the office believes he will actually take the test.<\/p><p>Sunrise Technologies is a longtime client of LMS Securities. LMS arranged four levels of private financing, for Sunrise, providing in-depth business consulting as well as handling all of the private placements, Sunrise went public 90 days ago and is currently trading at $14 per share.<\/p><p>Kenneth Karloff, CEO of LMS Securities, instructed Jones to write a favorable research report on Sunrise Technologies right before the company went public, setting a price target of at least $30 per share. Jones has developed a number of alternative cash flow projections for Sunrise Technologies. She picks an optimistic scenario to justify a $30 price target and issues a positive report using those projections.<\/p><p>After Sunrise Technologies has gone public, Karloff decides to help Jones to write a more- detailed research report on the company. Karloff provides Jones with information about the product pipeline and sensitive patent litigation that was given to him in confidence by Sunrise executives while the company was private. Given the product pipeline and legal outlook, Jones revises her cash flow models to reflect greater growth, then writes a positive report and advises LMS's clients to buy the stock.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.8, LOS 41: V(A)<\/div><div class=\"qtext\"><p>Which of the following statements could Brown put on his resume without violating Standard VII(B): Reference to CFA Institute, the CFA Designation, and the CFA Program?<\/p><\/div>", "subj": "ethics"}, {"n": 6, "q": "When Jones produced the research report on Sunrise Technologies before it went public, she violated:", "opts": ["Standard I(B): Independence and Objectivity because of her obedience to her CEO, and Standard II(A): Material Nonpublic Information because of Karloff’s involvement.", "Standard V(A): Diligence and Reasonable Basis because her research report was not thorough, and Standard I(B): Independence and Objectivity because of her obedience to her CEO.", "Standard V(B): Communication with Clients and Prospective Clients by leaving relevant facts out of the report, but not Standard III(A): Loyalty, Prudence, and Care because the CEO cannot pass his fiduciary duty on to her."], "ans": "B", "expl": "Jones' research was not thorough, and her report did leave out salient facts. Thus, she violated Standards V(A) and V(B). Her objectivity was certainly in question, so she violated Standard I(B). She also has a fiduciary duty to the clients regardless of what the boss says, so she violated Standard III(A). No nonpublic information was used in this report, so Standard II(A) was not violated.", "explhtml": "<p>Jones&#x27; research was not thorough, and her report did leave out salient facts. Thus, she violated Standards V(A) and V(B). Her objectivity was certainly in question, so she violated Standard I(B). She also has a fiduciary duty to the clients regardless of what the boss says, so she violated Standard III(A). No nonpublic information was used in this report, so Standard II(A) was not violated.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 2–6<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>LMS Securities is a boutique broker-dealer specializing in private placements for technology companies. The firm also provides aftermarket support for the companies that go public after private rounds of financing. This support includes market making and research coverage.<\/p><p>Susan Jones, CFA, is an analyst at LMS Securities. She is responsible for a subset of the companies for which LMS offers research coverage. She recently received her annual CFA. Institute Professional Conduct statement, but has not yet filled it out and turned it in. Steve Brown is an analyst who directs the due diligence process for LMS Securities' private placements. Brown passed the Level II exam five years ago, and has registered for the Level III exam every year since then, but has never taken it. He is registered for the Level III CFA exam next June, but nobody at the office believes he will actually take the test.<\/p><p>Sunrise Technologies is a longtime client of LMS Securities. LMS arranged four levels of private financing, for Sunrise, providing in-depth business consulting as well as handling all of the private placements, Sunrise went public 90 days ago and is currently trading at $14 per share.<\/p><p>Kenneth Karloff, CEO of LMS Securities, instructed Jones to write a favorable research report on Sunrise Technologies right before the company went public, setting a price target of at least $30 per share. Jones has developed a number of alternative cash flow projections for Sunrise Technologies. She picks an optimistic scenario to justify a $30 price target and issues a positive report using those projections.<\/p><p>After Sunrise Technologies has gone public, Karloff decides to help Jones to write a more- detailed research report on the company. Karloff provides Jones with information about the product pipeline and sensitive patent litigation that was given to him in confidence by Sunrise executives while the company was private. Given the product pipeline and legal outlook, Jones revises her cash flow models to reflect greater growth, then writes a positive report and advises LMS's clients to buy the stock.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.8, LOS 41: V(A)<\/div><div class=\"qtext\"><p>When Jones produced the research report on Sunrise Technologies before it went public, she violated:<\/p><\/div>", "subj": "ethics"}, {"n": 7, "q": "Scott LaRue is a portfolio manager for Washington Advisors. Washington has developed a proprietary model that has been thoroughly researched and is known throughout the industry as the Washington model. The model is purely quantitative and screens stocks into buy, hold, and sell categories. The basic philosophy of the model is thoroughly explained to clients. The director of research frequently alters the model based on rigorous research—an aspect that is well explained to clients, although the specific alterations are not continually disclosed. Portfolio managers then make specific sector and security holding decisions, purchasing only securities that are indicated as \"buys\" by the model. La Rue feels the model would be improved by adding some factors but he has not fully tested this new version of the model. LaRue discloses his model to his own clients but not to his supervisor. LaRue is:", "opts": ["not violating the Standards.", "violating the Standards by not considering the appropriateness of the recommendations to clients.", "violating the Standards by not having a reasonable and adequate basis for his investment recommendation."], "ans": "C", "expl": "The ad hoc model is not part of the formal research process and does not formulate an adequate basis for a recommendation.", "explhtml": "<p>The ad hoc model is not part of the formal research process and does not formulate an adequate basis for a recommendation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41.b<\/div><div class=\"qtext\"><p>Scott LaRue is a portfolio manager for Washington Advisors. Washington has developed a proprietary model that has been thoroughly researched and is known throughout the industry as the Washington model. The model is purely quantitative and screens stocks into buy, hold, and sell categories. The basic philosophy of the model is thoroughly explained to clients. The director of research frequently alters the model based on rigorous research—an aspect that is well explained to clients, although the specific alterations are not continually disclosed. Portfolio managers then make specific sector and security holding decisions, purchasing only securities that are indicated as &quot;buys&quot; by the model. La Rue feels the model would be improved by adding some factors but he has not fully tested this new version of the model. LaRue discloses his model to his own clients but not to his supervisor. LaRue is:<\/p><\/div>", "subj": "ethics"}, {"n": 8, "q": "With regard to Ferrazzo's purchase of Bradley stock, she violated:", "opts": ["Standard III(E): Preservation of Confidentiality and Standard II(A): Material Nonpublic Information.", "Standard III(E): Preservation of Confidentiality, but not Standard V(A): Diligence and Reasonable Basis.", "Standard V(A): Diligence and Reasonable Basis, but not Standard II(A): Material Nonpublic Information."], "ans": "C", "expl": "Ferrazzo's disclosure of the name of her client, Parker Jones, to Henderson violated Standard III(E): Preservation of Confidentiality. Ferrazzo used the mosaic theory to determine that Kellogg was pursuing an acquisition and did not violate Standard II(A): Material Nonpublic Information. The purchase of Bradley violated Standard V(A): Diligence and Reasonable Basis, because Ferrazzo had reason to believe that even if Bradley was going to be acquired, the premium was likely to be low. The fact that she got lucky and guessed right does not satisfy the Standard.", "explhtml": "<p>Ferrazzo&#x27;s disclosure of the name of her client, Parker Jones, to Henderson violated Standard III(E): Preservation of Confidentiality. Ferrazzo used the mosaic theory to determine that Kellogg was pursuing an acquisition and did not violate Standard II(A): Material Nonpublic Information. The purchase of Bradley violated Standard V(A): Diligence and Reasonable Basis, because Ferrazzo had reason to believe that even if Bradley was going to be acquired, the premium was likely to be low. The fact that she got lucky and guessed right does not satisfy the Standard.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 8–13<\/summary><div class=\"vig-body\"><p>Vera Sandro recently joined Seamark Securities as a portfolio manager. Sandro also recently took the Level III examination in the Chartered Financial Analyst program, but has not yet received her results. Seamark is a medium-sized firm that employs many CFA Institute members.<\/p><p>Sandro has been asked by her supervisor, Ledia Ferrazzo, CFA, to write a brief biography to be included in the promotional brochure Sandro hands out to prospective clients. Sandro included the following sentences in her biography: \"Vera Sandro, a Chartered Financial Analyst Level III candidate, has focused educational and investment experience in the small-cap stock market. She has consistently achieved better-than-average market returns and expects to do so in the future as well.\" The brochure was printed and is being used by Sandro as a marketing tool.<\/p><p>Soon after joining Seamark, Sandro attended a conference at which Liam Wright presented several computerized spreadsheets that he had developed to value high-tech stocks. During the presentation, Sandro copied the spreadsheets on her laptop computer. Later, Sandro made major changes to Wright's initial model. After testing the new model, Sandro was impressed with the results. Wright used Standard &amp; Poor's data as inputs for the model, but Sandro used data supplied by Moody's Investors Service. Sandro wrote a research report describing the revised model and its results in detail and sent the report to her biggest client, along with some stock picks selected by the model.<\/p><p>Ferrazzo, the head portfolio manager for Seamark, often meets corporate executives in the course of her evaluation of potential investments. A week ago, Ferrazzo had lunch with Ralph Henderson, a senior vice president of Kellogg Industries, a maker of luxury linens. Ferrazzo told Henderson that she was looking for an appropriate investment in the fabric industry for her large client, Parker Jones. Henderson responded that he thought his company was well- positioned in the market, though he admitted to underestimating the demand for silk sheets in the region. After lunch, Ferrazzo read a research report that said all of Kellogg's silk plants were running at capacity, and the company might have trouble meeting the long-term demand. Two days later, Ferrazzo observed another senior vice president of Kellogg at a restaurant having dinner with the chief financial officer of Bradley Textiles, a maker of various kinds of silk fabrics. It is widely known in the market that Bradley is seeking a potential merger partner, as the founder and CEO is ready to retire.<\/p><p>Ferrazzo did additional research and concluded that Kellogg Industries and Bradley Textiles had complementary product lines in several areas and similar management cultures. She also remembered reading in Forbes a story in which Kellogg's CFO was quoted as saying the company had the financial wherewithal for a merger and an interest in expansion. Ferrazzo's research indicated that Bradley's market value exceeded its intrinsic value, suggesting that Kellogg was unlikely to pay a high merger premium. Nonetheless, Ferrazzo proceeded to purchase stock in Bradley on behalf of her clients. Six months later, Kellogg acquired Bradley and paid a 40 percent premium over market price.<\/p><p>Sandro shares a workspace with Don Wilson, a CFA charterholder. Wilson recommends that one of his clients buy Alpha Co. shares based upon detailed research conducted by a Seamark analyst. Sandro recommends that one of her clients sell Alpha Co. shares based upon comprehensive research conducted by another brokerage firm.<\/p><p>Seamark has evaluated prospective brokers to execute trades on behalf of its investment- management clients. The findings are as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-8/v001.webp\" style=\"max-width:min(100%,628px)\" alt=\"• White Brokerage Co. offers best price and execution, charges an average of $99 for a typical trade, and provides generous soft dollars. • Green Brokers Inc., offers good price and execution, charges an average of $59 for a typical trade, and provides moderate soft dollars. • Blue Brokerage Services Inc., offers best price and execution, charges an average of $79 for a typical trade, and provides moderate soft dollars.\"><\/div><\/details><div class=\"pp-topic\">Module 41.8, LOS 41: V(A)<\/div><div class=\"qtext\"><p>With regard to Ferrazzo&#x27;s purchase of Bradley stock, she violated:<\/p><\/div>", "subj": "ethics"}, {"n": 9, "q": "Regarding the high-tech stock model, which of the following actions is least likely to help Sandro avoid violating the standards regarding plagiarism and research reports?", "opts": ["Providing basic information about technology stocks in the research report.", "Acknowledging Wright’s development of the initial model.", "Acknowledging Standard & Poor’s as the original data source and Moody’s Investors Service as the new data source."], "ans": "A", "expl": "To comply with Standard I(C): Misrepresentation, Sandro should have gotten permission from Wright to copy the spreadsheets. The Standard also requires that Sandro identify Wright as the source of the initial model despite the fact that she made major changes to it. The plagiarism standard permits publishing factual information from Moody's and S&P without acknowledgment, but the use of different data sources could affect the performance of the model, and should be disclosed to satisfy Standard V(B): Communication with Clients and Prospective Clients. Because the report is going to an individual client, Sandro need not provide basic information about technology stocks, according to Standard V(B): Communication with Clients and Prospective Clients.", "explhtml": "<p>To comply with Standard I(C): Misrepresentation, Sandro should have gotten permission from Wright to copy the spreadsheets. The Standard also requires that Sandro identify Wright as the source of the initial model despite the fact that she made major changes to it. The plagiarism standard permits publishing factual information from Moody&#x27;s and S&amp;P without acknowledgment, but the use of different data sources could affect the performance of the model, and should be disclosed to satisfy Standard V(B): Communication with Clients and Prospective Clients. Because the report is going to an individual client, Sandro need not provide basic information about technology stocks, according to Standard V(B): Communication with Clients and Prospective Clients.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 8–13<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Vera Sandro recently joined Seamark Securities as a portfolio manager. Sandro also recently took the Level III examination in the Chartered Financial Analyst program, but has not yet received her results. Seamark is a medium-sized firm that employs many CFA Institute members.<\/p><p>Sandro has been asked by her supervisor, Ledia Ferrazzo, CFA, to write a brief biography to be included in the promotional brochure Sandro hands out to prospective clients. Sandro included the following sentences in her biography: \"Vera Sandro, a Chartered Financial Analyst Level III candidate, has rts?<\/p><\/div>", "subj": "ethics"}, {"n": 10, "q": "The production of the advertising represented a violation of:", "opts": ["Standard VII(B): Reference to CFA Institute, the CFA Designation, and the CFA Program, and Standard I(C): Misrepresentation.", "Standard IV(A): Loyalty to Employer and Standard I(C): Misrepresentation.", "Standard IV(C):Responsibilities of Supervisors, but not Standard VII(B): Reference to CFA Institute, the CFA Designation, and the CFA Program."], "ans": "C", "expl": "Sandro's description of her CFA standing is truthful in this case because she is still technically a CFA candidate. Sandro is not allowed to imply that she can continue to produce superior returns, and as such violated the misrepresentation standard. Ferrazzo, in her supervisory role, should have prevented the violation but did not. Standard IV(A): Loyalty to Employer refers to independent practice, and is not relevant to this situation.", "explhtml": "<p>Sandro&#x27;s description of her CFA standing is truthful in this case because she is still technically a CFA candidate. Sandro is not allowed to imply that she can continue to produce superior returns, and as such violated the misrepresentation standard. Ferrazzo, in her supervisory role, should have prevented the violation but did not. Standard IV(A): Loyalty to Employer refers to independent practice, and is not relevant to this situation.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 8–13<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Vera Sandro recently joined Seamark Securities as a portfolio manager. Sandro also recently took the Level III examination in the Chartered Financial Analyst program, but has not yet received her results. Seamark is a medium-sized firm that employs many CFA Institute members.<\/p><p>Sandro has been asked by her supervisor, Ledia Ferrazzo, CFA, to write a brief biography to be included in the prom class=\"qtext\"><p>The production of the advertising represented a violation of:<\/p><\/div>", "subj": "ethics"}, {"n": 11, "q": "Ferrazzo may use which of the following brokers?", "opts": ["Blue and Green only.", "Blue only.", "White and Blue only."], "ans": "C", "expl": "The CFA Institute Soft Dollar Standards dictate members must always seek best price and execution. Soft-dollar arrangements must provide a benefit to clients, be disclosed, and be reasonable in relation to the research and execution services provided. Because both White and Blue provide best price and execution, it is within Ferrazzo's discretion to pay more for White's services as long as the research benefit is reasonable. Both White and Blue may be used.", "explhtml": "<p>The CFA Institute Soft Dollar Standards dictate members must always seek best price and execution. Soft-dollar arrangements must provide a benefit to clients, be disclosed, and be reasonable in relation to the research and execution services provided. Because both White and Blue provide best price and execution, it is within Ferrazzo&#x27;s discretion to pay more for White&#x27;s services as long as the research benefit is reasonable. Both White and Blue may be used.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 8–13<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Vera Sandro recently joined Seamark Securities as a portfolio manager. Sandro also recently took the Level III examination in the Chartered Financial Analyst program, but has not yet received her results. Seamark is a medium-sized firm that employs many CFA Institute members.<\/p><p>Sandro has been asked by her supervisor, Ledia Ferrazzo, CFA, to write a brief biography to be included in the promotional brochure Sandro hands out to prospective clients. Sandro included the following sentences in her biography: \"Vera Sandro, a Chartered Financial Analyst Level III candidate, nder and CEO is ready to retire.<\/p><p>Ferrazzo did additional research and concluded that Kellogg Industries and Bradley Textiles had complementary product lines in several areas and similar management cultures. She also remembered reading in Forbes a story in which Kellogg's CFO was quoted as saying the company had the financial wherewithal for a merger and an interest in expansion. Ferrazzo's research indicated that Bradley's market value exceeded its intrinsic value, suggesting that Kellogg was unlikely to pay a high merger premium. Nonetheless, Ferrazzo proceeded to purchase stock in Bradley on behalf of her clients. Six months later, Kellogg acquired Bradley and paid a 40 percent premium over market price.<\/p><p>Sandro shares a workspace with Don Wilson, a CFA charterholder. Wilson recommends that one of his clients buy Alpha Co. shares based upon detailed research conducted by a Seamark analyst. Sandro recommends that one of her clients sell Alpha Co. shares based upon comprehensive research conducted by another brokerage firm.<\/p><p>Seamark has evaluated prospective brokers to execute trades on behalf of its investment- management clients. The findings are as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-8/v001.webp\" style=\"max-width:min(100%,628px)\" alt=\"• White Brokerage Co. offers best price and execution, charges an average of $99 for a typical trade, and provides generous soft dollars. • Green Brokers Inc., offers good price and execution, charges an average of $59 for a typical trade, and provides moderate soft dollars. • Blue Brokerage Services Inc., offers best price and execution, charges an average of $79 for a typical trade, and provides moderate soft dollars.\"><\/div><\/details><div class=\"pp-topic\">Module 41.8, LOS 41: V(A)<\/div><div class=\"qtext\"><p>Ferrazzo may use which of the following brokers?<\/p><\/div>", "subj": "ethics"}, {"n": 12, "q": "Which of the following statements regarding Alpha Co. is least accurate?", "opts": ["Sandro has breached a fiduciary duty to her client.", "The fair-dealing standard has not been violated.", "Both Wilson and Sandro have a reasonable basis for their recommendations."], "ans": "A", "expl": "The use of a comprehensive research report is reasonable basis for a buy or sell recommendation. The fair-dealing standard has not been violated, as neither client was put at a disadvantage by the advice, even though the analysts' advice was contradictory. The fair-dealing standard requires the notification of clients who trade in opposition to the firm's official recommendation, so the trade should not be executed until the client is told about the firm's buy rating. While Sandro's advice differs from that of her colleague and is based on a competitor's research, she did not necessarily breach a fiduciary duty, if the investment made sense for the client. There are numerous investments that are appropriate for certain types of clients and inappropriate for others.", "explhtml": "<p>The use of a comprehensive research report is reasonable basis for a buy or sell recommendation. The fair-dealing standard has not been violated, as neither client was put at a disadvantage by the advice, even though the analysts&#x27; advice was contradictory. The fair-dealing standard requires the notification of clients who trade in opposition to the firm&#x27;s official recommendation, so the trade should not be executed until the client is told about the firm&#x27;s buy rating. While Sandro&#x27;s advice differs from that of her colleague and is based on a competitor&#x27;s research, she did not necessarily breach a fiduciary duty, if the investment made sense for the client. There are numerous investments that are appropriate for certain types of clients and inappropriate for others.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 8–13<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\ rding the Standards of Practice Handbook, 9th Edition, delivering a copy of the Code and Standards is no longer required. Standard VI(A): Disclosure of Conflicts, requires the disclosure of all security ownership that might interfere with a member&#x27;s duties. While the stock is thinly traded, it still might be of interest to Seamark clients, and Sandro must disclose her ownership. In addition, if she holds a position in the company or on the board that could take up some of her time, Standard IV(A): Loyalty to Employer, also comes into play.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 8–13<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Vera Sandro recently joined Seamark Securities as a portfolio manager. Sandro also recently took the Level III examination in the Chartered Financial Analyst program, but has not yet received her results. Seamark is a medium-sized firm that employs many CFA Institute members.<\/p><p>Sandro has been asked by her supervisor, Ledia Ferrazzo, CFA, to write a brief biography to be included in the promotional brochure Sandro hands out to prospective clients. Sandro included the following sentences in her biography: \"Vera Sandro, a Chartered Financial Analyst Level III candidate, has focused educational and investment experience in the small-cap stock market. She has consistently achieved better-than-average market returns and expects to do so in the future as well.\" The brochure was printed and is being used by Sandro as a marketing tool.<\/p><p>Soon after joining Seamark, Sandro attended a conference at which Liam Wright presented several computerized spreadsheets that he had developed to value high-tech stocks. During the presentation, Sandro copied the spreadsheets on her laptop computer. Later, Sandro made major changes to Wright's initial model. After testing the new model, Sandro was impressed with the results. Wright used Standard &amp; Poor's data as inputs for the model, but Sandro used data supplied by Moody's Investors Service. Sandro wrote a research report describing the revised model and its results in detail and sent the report to her biggest client, along with some stock picks selected by the model.<\/p><p>Ferrazzo, the head portfolio manager for Seamark, often meets corporate executives in the course of her evaluation of potential investments. A week ago, Ferrazzo had lunch with Ralph Henderson, a senior vice president of Kellogg Industries, a maker of luxury linens. Ferrazzo told Henderson that she was looking for an appropriate investment in the fabric industry for her large client, Parker Jones. Henderson responded that he thought his company was well- positioned in the market, though he admitted to underestimating the demand for silk sheets in the region. After lunch, Ferrazzo read a research report that said all of Kellogg's silk plants were running at capacity, and the company might have trouble meeting the long-term demand. Two days later, Ferrazzo observed another senior vice president of Kellogg at a restaurant having dinner with the chief financial officer of Bradley Textiles, a maker of various kinds of silk fabrics. It is widely known in the market that Bradley is seeking a potential merger partner, as the founder and CEO is ready to retire.<\/p><p>Ferrazzo did additional research and concluded that Kellogg Industries and Bradley Textiles had complementary product lines in several areas and similar management cultures. She also remembered reading in Forbes a story in which Kellogg's CFO was quoted as saying the company had the financial wherewithal for a merger and an interest in expansion. Ferrazzo's research indicated that Bradley's market value exceeded its intrinsic value, suggesting that Kellogg was unlikely to pay a high merger premium. Nonetheless, Ferrazzo proceeded to purchase stock in Bradley on behalf of her clients. Six months later, Kellogg acquired Bradley and paid a 40 percent premium over market price.<\/p><p>Sandro shares a workspace with Don Wilson, a CFA charterholder. Wilson recommends that one of his clients buy Alpha Co. shares based upon detailed research conducted by a Seamark analyst. Sandro recommends that one of her clients sell Alpha Co. shares based upon comprehensive research conducted by another brokerage firm.<\/p><p>Seamark has evaluated prospective brokers to execute trades on behalf of its investment- management clients. The findings are as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-8/v001.webp\" style=\"max-width:min(100%,628px)\" alt=\"• White Brokerage Co. offers best price and execution, charges an average of $99 for a typical trade, and provides generous soft dollars. • Green Brokers Inc., offers good price and execution, charges an average of $59 for a typical trade, and provides moderate soft dollars. • Blue Brokerage Services Inc., offers best price and execution, charges an average of $79 for a typical trade, and provides moderate soft dollars.\"><\/div><\/details><div class=\"pp-topic\">Module 41.8, LOS 41: V(A)<\/div><div class=\"qtext\"><p>Which of the following statements regarding Sandro&#x27;s biography is least accurate?<\/p><\/div>", "subj": "ethics"}, {"n": 14, "q": "Several years ago, Hilton and Ross, a full service investment firm, managed the initial public offering of eCom, Inc. Now, eCom wants Hilton and Ross to underwrite its secondary public offering. A senior manager at Hilton and Ross asks Brent Whitman, CFA, one of its equity analysts, to write a favorable research report on eCom to help make the underwriting a success. Whitman conducts a thorough analysis of eCom and concludes that the company has serious problems that do not suggest a favorable financial outlook. Nevertheless, Whitman writes a favorable report because he is fearful of losing his job. Hilton and Ross publicly distribute a report that only contains a buy recommendation and a brief description of the basic characteristics of eCom. Whitman has violated:", "opts": ["Standard V(A) Diligence and Reasonable Basis only.", "Standard I(B) Independence and Objectivity, only.", "Both Standard I(B) Independence and Objectivity and Standard V(A) Diligence and Reasonable Basis."], "ans": "C", "expl": "Whitman violated Standard V(A) Diligence and Reasonable Basis because he did not have a reasonable and adequate basis for issuing a favorable recommendation. Whitman violated Standard I(B) Independence and Objectivity because he did not act independently in issuing his recommendation but instead was influenced by senior management at Hilton and Ross.", "explhtml": "<p>Whitman violated Standard V(A) Diligence and Reasonable Basis because he did not have a reasonable and adequate basis for issuing a favorable recommendation. Whitman violated Standard I(B) Independence and Objectivity because he did not act independently in issuing his recommendation but instead was influenced by senior management at Hilton and Ross.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(A)<\/div><div class=\"qtext\"><p>Several years ago, Hilton and Ross, a full service investment firm, managed the initial public offering of eCom, Inc. Now, eCom wants Hilton and Ross to underwrite its secondary public offering. A senior manager at Hilton and Ross asks Brent Whitman, CFA, one of its equity analysts, to write a favorable research report on eCom to help make the underwriting a success. Whitman conducts a thorough analysis of eCom and concludes that the company has serious problems that do not suggest a favorable financial outlook. Nevertheless, Whitman writes a favorable report because he is fearful of losing his job. Hilton and Ross publicly distribute a report that only contains a buy recommendation and a brief description of the basic characteristics of eCom. Whitman has violated:<\/p><\/div>", "subj": "ethics"}, {"n": 15, "q": "A manager of pooled funds must do all of the following to remain in compliance with the Standards EXCEPT:", "opts": ["seek authorization for any proposed changes.", "disclose portfolio construction processes.", "seek authorization for any trade that involves more than 1 percent of the fund's assets."], "ans": "C", "expl": "There is no requirement to seek authorization for trades on the basis of size.", "explhtml": "<p>There is no requirement to seek authorization for trades on the basis of size.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(B)<\/div><div class=\"qtext\"><p>A manager of pooled funds must do all of the following to remain in compliance with the Standards EXCEPT:<\/p><\/div>", "subj": "ethics"}, {"n": 16, "q": "Todd Gable, CFA, was attending a noon luncheon when he overheard two software executives talking about a common vendor, Datagen, about how wonderful they thought the company was, and about a rumor that a major brokerage firm was preparing to issue a strong buy recommendation on the stock. Gable returned to the office, checked a couple of online sources, and then placed an order to purchase Datagen in all of his discretionary portfolios. The orders were filled within an hour. Three days later, a brokerage house issued a strong buy recommendation and Datagen's share price went up 20%. Gable then obtained the brokerage house's research report on Datagen and quoted parts of it in a report to his clients. Gable has most likely violated the Standards by: Gable has:", "opts": ["using material nonpublic information.", "using the recommendation of another brokerage firm in his report.", "not having a reasonable basis for an investment action."], "ans": "C", "expl": "Standard V(A) requires members to have a reasonable and adequate basis for taking investment actions. Overhearing a conversation does not provide adequate basis. However, the overheard rumor was not material nonpublic information. Quoting another firm's research is acceptable as long as the material is properly attributed to its source.", "explhtml": "<p>Standard V(A) requires members to have a reasonable and adequate basis for taking investment actions. Overhearing a conversation does not provide adequate basis. However, the overheard rumor was not material nonpublic information. Quoting another firm&#x27;s research is acceptable as long as the material is properly attributed to its source.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(A)<\/div><div class=\"qtext\"><p>Todd Gable, CFA, was attending a noon luncheon when he overheard two software executives talking about a common vendor, Datagen, about how wonderful they thought the company was, and about a rumor that a major brokerage firm was preparing to issue a strong buy recommendation on the stock. Gable returned to the office, checked a couple of online sources, and then placed an order to purchase Datagen in all of his discretionary portfolios. The orders were filled within an hour. Three days later, a brokerage house issued a strong buy recommendation and Datagen&#x27;s share price went up 20%. Gable then obtained the brokerage house&#x27;s research report on Datagen and quoted parts of it in a report to his clients. Gable has most likely violated the Standards by:<\/p><p>Gable has:<\/p><\/div>", "subj": "ethics"}, {"n": 17, "q": "In the process of recommending an investment, in order to comply with Standard V(A), Diligence and Reasonable Basis, a CFA Institute member must:", "opts": ["support a recommendation with appropriate research and investigation.", "have a reasonable and adequate basis for the recommendation.", "do both of these."], "ans": "C", "expl": "Both of these are explicitly required by Standard V(A).", "explhtml": "<p>Both of these are explicitly required by Standard V(A).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(A)<\/div><div class=\"qtext\"><p>In the process of recommending an investment, in order to comply with Standard V(A), Diligence and Reasonable Basis, a CFA Institute member must:<\/p><\/div>", "subj": "ethics"}, {"n": 18, "q": "An analyst has constructed an investment policy statement (IPS) and a portfolio for a new client, Stephanie Sasser. He has also provided written guidelines on the processes used to make investment management decisions. Six month later, Sasser questions the analyst about several portfolio holdings. Due to a large allocation in financial services stocks during a severe market downturn, her portfolio has underperformed the benchmark by a large margin. Although the analyst remembers discussing the over-allocation with Sasser, and receiving her approval, he is unable to find supporting documents. Which of the following Standards has the analyst most likely violated?", "opts": ["Standard V(A) Diligence and Reasonable Basis.", "Standard V(C) Record Retention.", "Standard V(B) Communications with Clients and Prospective Clients."], "ans": "B", "expl": "Standard V(C) Record Retention requires analysts to develop and maintain \"...records to support their investment analysis, recommendations...with clients and prospective clients.\" The analyst is unable to document the over-allocation with respect to the benchmark; this is most likely a violation of Standard V(C).", "explhtml": "<p>Standard V(C) Record Retention requires analysts to develop and maintain &quot;...records to support their investment analysis, recommendations...with clients and prospective clients.&quot; The analyst is unable to document the over-allocation with respect to the benchmark; this is most likely a violation of Standard V(C).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(C)<\/div><div class=\"qtext\"><p>An analyst has constructed an investment policy statement (IPS) and a portfolio for a new client, Stephanie Sasser. He has also provided written guidelines on the processes used to make investment management decisions. Six month later, Sasser questions the analyst about several portfolio holdings. Due to a large allocation in financial services stocks during a severe market downturn, her portfolio has underperformed the benchmark by a large margin. Although the analyst remembers discussing the over-allocation with Sasser, and receiving her approval, he is unable to find supporting documents. Which of the following Standards has the analyst most likely violated?<\/p><\/div>", "subj": "ethics"}, {"n": 19, "q": "Based on CFA Institute Standards of Professional Conduct, which of the following is least accurate?", "opts": ["There is no breach of duty if traded on Smith's report because Jones did not conduct the research that produced the information.", "The information is material because the new software is likely to significantly increase FinSoft's future earnings.", "There is misappropriation of information by Jones because the file is marked \"Confidential / Corporate Finance Department.\""], "ans": "A", "expl": "Jones has a duty not to trade or cause others to trade on material nonpublic information. It does not matter that he did not conduct the research.", "explhtml": "<p>Jones has a duty not to trade or cause others to trade on material nonpublic information. It does not matter that he did not conduct the research.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 19–22<\/summary><div class=\"vig-body\"><p>Lon Smith is an analyst in the Research Department of Lincoln &amp; Co., a large investment bank. Smith has just completed a temporary assignment in Lincoln's Corporate Finance Department related to underwriting a debt offering for FinSoft, a computer software company. FinSoft's recent operating record has reflected lagging sales volume and heavy product development expenses. Smith has marked his FinSoft notes and work sheets \"CONFIDENTIAL / CORPORATE FINANCE DEPARTMENT\" and sent them to the company file in the Research Department. This material reveals that FinSoft is about to receive a major contract for an innovative software program that will have a very significant positive impact on earnings as well as on the company's visibility and stature in the industry.<\/p><p>Jay Jones, a CFA candidate and a portfolio manager for Lincoln, has come upon these notes and work sheets while reviewing the FinSoft research file. Jones had been considering sale of the stock from the accounts under his management, but realizes after reading the file material that the recent weakness in operating results is about to be reversed and that the company's prospects are actually quite favorable. Perhaps, he thinks, he should add to his clients' FinSoft positions instead of considering their sale.<\/p><p>Jones briefly reflects on the matter of \"inside information\" in relation to perhaps buying more of the stock instead of selling it, but his recollection is hazy and Lincoln has no formal guidelines on the subject to which he can refer. Based on the circumstances, Jones believes he is free to use this new knowledge for the benefit of Lincoln's clients.<\/p><p>At a local CFA society event, Jones mentions to Mohammed Bamyeh, a friend and financial advisor, that FinSoft is about to receive a major new contract that has yet to be announced.<\/p><p>Later that day, Bamyeh takes a large long position in a technology ETF that has a large weight for FinSoft stock.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.3, LOS 41.a<\/div><div class=\"qtext\"><p>Based on CFA Institute Standards of Professional Conduct, which of the following is least accurate?<\/p><\/div>", "subj": "ethics"}, {"n": 20, "q": "Based on the information presented in this situation, Jones has an obligation to do all of the following EXCEPT:", "opts": ["encourage his employer to review the compliance procedures as they relate to material nonpublic information issues.", "wait to trade on the information until after a reasonable period has passed.", "encourage public dissemination of the information."], "ans": "B", "expl": "Jones has an obligation to not trade on the information until after he is sure the information has been made public.", "explhtml": "<p>Jones has an obligation to not trade on the information until after he is sure the information has been made public.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 19–22<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lon Smith is an analyst in the Research Department of Lincoln &amp; Co., a large investment bank. Smith has just completed a temporary assignment in Lincoln's Corporate Finance Department related to underwriting a debt offering for FinSoft, a computer software company. FinSoft's recent operating record has reflected lagging sales volume and heavy product development expenses. Smith has marked his FinSoft notes and work sheets \"CONFIDENTIAL / CORPORATE FINANCE DEPARTMENT\" and sent them to the company file in the Research Department. This material reveals that FinSoft is about to receive a major contract for an innovative software program that will have a very significant positive impact on earnings as well as on the company's visibility and stature in the industry.<\/p><p>Jay Jones, a CFA candidate and a portfolio manager for Lincoln, has come upon these notes and work sheets while reviewing the FinSoft research file. Jones had been considering sale of the stock from the accounts under his management, but realizes after reading the file material that the recent weakness in operating results is about to be reversed and that the company's prospects are actually quite favorable. Perhaps, he thinks, he should add to his clients' FinSoft positions instead of considering their sale.<\/p><p>Jones briefly reflects on the matter of \"inside information\" in relation to perhaps buying more of the stock instead of selling it, but his recollection is hazy and Lincoln has no formal guidelines on the subject to which he can refer. Based on the circumstances, Jones believes he is free to use this new knowledge for the benefit of Lincoln's clients.<\/p><p>At a local CFA society event, Jones mentions to Mohammed Bamyeh, a friend and financial advisor, that FinSoft is about to receive a major new contract that has yet to be announced.<\/p><p>Later that day, Bamyeh takes a large long position in a technology ETF that has a large weight for FinSoft stock.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.3, LOS 41.a<\/div><div class=\"qtext\"><p>Based on the information presented in this situation, Jones has an obligation to do all of the following EXCEPT:<\/p><\/div>", "subj": "ethics"}, {"n": 21, "q": "Based on the information presented, Lincoln should adopt a set of guidelines on inside information that include each of the following EXCEPT:", "opts": ["have in place a supervisor or compliance officer who has the authority and responsibility to decide whether information is material and nonpublic.", "prohibit exchange of personnel, even temporary, between investment banking and institutional money management departments.", "develop criteria for identifying inside information."], "ans": "B", "expl": "There is no need to avoid transfer of personnel as long as proper safeguards and procedures are observed.", "explhtml": "<p>There is no need to avoid transfer of personnel as long as proper safeguards and procedures are observed.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 19–22<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lon Smith is an analyst in the Research Department of Lincoln &amp; Co., a large investment bank. Smith has just completed a temporary assignment in Lincoln's Corporate Finance Department related to underwriting a debt offering for FinSoft, a computer software company. FinSoft's recent operating record has reflected lagging sales volume and heavy product development expenses. Smith has marked his FinSoft notes and work sheets \"CONFIDENTIAL / CORPORATE FINANCE DEPARTMENT\" and sent them to the company file in the Research Department. This material reveals that FinSoft is about to receive a major contract for an innovative software program that will have a very significant positive impact on earnings as well as on the company's visibility and stature in the industry.<\/p><p>Jay Jones, a CFA candidate and a portfolio manager for Lincoln, has come upon these notes and work sheets while reviewing the FinSoft research file. Jones had been considering sale of the stock from the accounts under his management, but realizes after reading the file material that the recent weakness in operating results is about to be reversed and that the company's prospects are actually quite favorable. Perhaps, he thinks, he should add to his clients' FinSoft positions instead of considering their sale.<\/p><p>Jones briefly reflects on the matter of \"inside information\" in relation to perhaps buying more of the stock instead of selling it, but his recollection is hazy and Lincoln has no formal guidelines on the subject to which he can refer. Based on the circumstances, Jones believes he is free to use this new knowledge for the benefit of Lincoln's clients.<\/p><p>At a local CFA society event, Jones mentions to Mohammed Bamyeh, a friend and financial advisor, that FinSoft is about to receive a major new contract that has yet to be announced.<\/p><p>Later that day, Bamyeh takes a large long position in a technology ETF that has a large weight for FinSoft stock.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.3, LOS 41.a<\/div><div class=\"qtext\"><p>Based on the information presented, Lincoln should adopt a set of guidelines on inside information that include each of the following EXCEPT:<\/p><\/div>", "subj": "ethics"}, {"n": 22, "q": "When recommending the purchase of FinSoft company shares to Bamyeh, Jones least likely violated the Standard relating to:", "opts": ["diligence and reasonable basis.", "loyalty to employer.", "integrity of capital markets."], "ans": "A", "expl": "It is unlikely that Jones violated the Standard relating to diligence and reasonable basis, as Jones appears to have had a reasonable basis for the recommendation as Standard V(A) requires. Once Jones was in possession of material nonpublic information, he was prohibited by Standard II(A) of acting or causing others to act on this information. Jones also violated her duty of loyalty to her employer under Standard IV(A) by encouraging Bamyeh to trade in FinSoft and other securities, possibly harming Lincoln's customer's ability to acquire FinSoft at an attractive price.", "explhtml": "<p>It is unlikely that Jones violated the Standard relating to diligence and reasonable basis, as Jones appears to have had a reasonable basis for the recommendation as Standard V(A) requires. Once Jones was in possession of material nonpublic information, he was prohibited by Standard II(A) of acting or causing others to act on this information. Jones also violated her duty of loyalty to her employer under Standard IV(A) by encouraging Bamyeh to trade in FinSoft and other securities, possibly harming Lincoln&#x27;s customer&#x27;s ability to acquire FinSoft at an attractive price.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 19–22<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lon Smith is an analyst in the Research Department of Lincoln &amp; Co., a large investment bank. Smith has just completed a temporary assignment in Lincoln's Corporate Finance Department related to underwriting a debt offering for FinSoft, a computer software company. FinSoft's recent operating record has reflected lagging sales volume and heavy product development expenses. Smith has marked his FinSoft notes and work sheets \"CONFIDENTIAL / CORPORATE FINANCE DEPARTMENT\" and sent them to the co
