ack on Waverly's order will allow Crocket to acquire its desired allocation of shares in DCH's secondary offering. Having achieved his goal, Fleming allows GlobalBank's traders to repurchase the firm's shares of DCH.<\/p><p>Twelve months pass, and the shares of DCH's secondary offering have declined in price by nearly 20%. The CIO of the Crockett Foundation calls a meeting with Fleming to discuss the poor performance of the security and to review the basis upon which Fleming recommended the investment. Fleming prepares Crockett's file to take with him to the meeting. The file contains Crockett's IPS, a detailed account of the purchase order and all conversations held between Fleming and the CIO. In accordance with his own established procedures, however, Fleming maintained the original analysis supporting the purchase of shares in DCH's secondary offering for nine months after the investment was made.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.3, LOS 41.a<\/div><div class=\"qtext\"><p>According to CFA Institute Standards of Professional Conduct, did Fleming&#x27;s conversation with the CIO of the Crockett Foundation or his decision to sell GlobalBank&#x27;s position in DCH stock most likely violate Standard II(B)—Market Manipulation?<\/p><p>Conversation<\/p><p>Sell decision<\/p><p>with CIO<\/p><\/div>", "subj": "ethics"}, {"n": 46, "q": "Is it most likely that Fleming violated any CFA Institute Standards of Professional Conduct related to his meeting with the CIO of the Crockett Foundation?", "opts": ["No—he maintained an IPS and followed established procedures in maintaining client records and data.", "Yes—he failed to maintain appropriate records to support his investment recommendation.", "No—he does not have a duty to maintain client records, only his employer does."], "ans": "B", "expl": "Standard V(C)—Record Retention states that members and candidate must maintain appropriate records to support their investment recommendations and actions. Fleming maintained an IPS and records of conversations, but he is also required by the standard to keep research and other documentation supporting investment recommendations and actions, which Fleming did not do. When there are no regulatory requirements related to record retention, the Standard recommends that members and candidates keep client records for a minimum of seven years.", "explhtml": "<p>Standard V(C)—Record Retention states that members and candidate must maintain appropriate records to support their investment recommendations and actions. Fleming maintained an IPS and records of conversations, but he is also required by the standard to keep research and other documentation supporting investment recommendations and actions, which Fleming did not do. When there are no regulatory requirements related to record retention, the Standard recommends that members and candidates keep client records for a minimum of seven years.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 43–46<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>William Fleming is an investment advisor for GlobalBank, a large, multinational financial corporation. He is based in the New York office, and his client base consists of medium to large institutional accounts in the United States and Western Europe. Roughly three-quarters of his clients pay performance-based fees, while the remaining one-quarter pay fees based on assets. GlobalBank's investment banking division is an industry leader, and Fleming is able to offer his clients the opportunity to participate in some of the hottest initial public offerings (IPOs) and secondary offerings brought to market.<\/p><p>One of Fleming's accounts, Waverly Capital Partners, has contacted him regarding an upcoming secondary offering by DCH Corp., for which GlobalBank will serve as lead underwriter. Waverly has already performed its due diligence on the offering and ation is enough to motivate Crocket's CIO to call a meeting with the foundation's investment committee.<\/p><p>After a quick meeting with Crockett's investment committee, the CIO calls Fleming to say that the foundation is interested in the offering and would like to place a purchase order. Crockett does not currently conduct any additional business through GlobalBank's other divisions. Because of GlobalBank's trade allocation policy, coupled with the high probability that the offering will be oversubscribed, Crockett is unlikely to be allocated as many shares of the offering as they would like to purchase. In order to obtain the desired number of shares for the client, Fleming devises a plan. He plans to add the Crockett Foundation's order to Waverly's order, and once the order is filled he will re-allocate the extra shares back to the foundation's account at the end of the day. He feels that his action is justified because Crockett has maintained its account with Fleming and GlobalBank for over ten years. In addition, Fleming has traders at GlobalBank sell large blocks of DCH over several days in order to push the stock price lower. The drop in value causes smaller investors at GlobalBank, who are not Fleming's clients, to withdraw their orders for shares of DCH's secondary offering. Fleming determines that the fewer number of purchase orders and the plan to piggyback on Waverly's order will allow Crocket to acquire its desired allocation of shares in DCH's secondary offering. Having achieved his goal, Fleming allows GlobalBank's traders to repurchase the firm's shares of DCH.<\/p><p>Twelve months pass, and the shares of DCH's secondary offering have declined in price by nearly 20%. The CIO of the Crockett Foundation calls a meeting with Fleming to discuss the poor performance of the security and to review the basis upon which Fleming recommended the investment. Fleming prepares Crockett's file to take with him to the meeting. The file contains Crockett's IPS, a detailed account of the purchase order and all conversations held between Fleming and the CIO. In accordance with his own established procedures, however, Fleming maintained the original analysis supporting the purchase of shares in DCH's secondary offering for nine months after the investment was made.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.8, LOS 41.a<\/div><div class=\"qtext\"><p>Is it most likely that Fleming violated any CFA Institute Standards of Professional Conduct related to his meeting with the CIO of the Crockett Foundation?<\/p><\/div>", "subj": "ethics"}, {"n": 47, "q": "The Konkol Company implements a new methodology for portfolio valuation that is licensed to them by ABC Statistics. To comply with the Code and standards, Konkol should:", "opts": ["discuss the new methodology only with clients whose security selection process will change as a result.", "discuss the new methodology with its clients.", "not discuss the new methodology with clients because doing so would fail to preserve ABC’s confidentiality."], "ans": "B", "expl": "Standard V(B) Communication with Clients and Prospective Clients requires any change in the scope, valuation methodology, or focus of the portfolio to be discussed with clients. No information is given that would suggest the methodology is confidential.", "explhtml": "<p>Standard V(B) Communication with Clients and Prospective Clients requires any change in the scope, valuation methodology, or focus of the portfolio to be discussed with clients. No information is given that would suggest the methodology is confidential.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(B)<\/div><div class=\"qtext\"><p>The Konkol Company implements a new methodology for portfolio valuation that is licensed to them by ABC Statistics. To comply with the Code and standards, Konkol should:<\/p><\/div>", "subj": "ethics"}, {"n": 48, "q": "An analyst has several groups of clients who are categorized according to their specific needs. Compared to research reports distributed to all of the clients, reports for a specific group:", "opts": ["may generally exclude more basic facts.", "are not permitted by the Code and Standards.", "are required to include more basic facts."], "ans": "A", "expl": "According to Standard V(B) Communication with Clients and Prospective Clients, an analyst can use reasonable judgment regarding the exclusion of some facts and should include more basic facts for reports to wider audiences. The key issue is that analysts should tailor their reports to the intended audience.", "explhtml": "<p>According to Standard V(B) Communication with Clients and Prospective Clients, an analyst can use reasonable judgment regarding the exclusion of some facts and should include more basic facts for reports to wider audiences. The key issue is that analysts should tailor their reports to the intended audience.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(B)<\/div><div class=\"qtext\"><p>An analyst has several groups of clients who are categorized according to their specific needs. Compared to research reports distributed to all of the clients, reports for a specific group:<\/p><\/div>", "subj": "ethics"}, {"n": 49, "q": "BlueRock Fund uses a proprietary asset selection model that it believes gives the firm a competitive advantage. The model is applied to a universe of all small-cap domestic equities and all publicly-traded corporate bonds. The asset allocations generated by this model range from +200 percent in small-cap equities/-100 percent in bonds to +200 percent in bonds/-100 percent in small-cap equities. Since the fund can invest in both equities and bonds, it is classified as a balanced fund. In the prospectus BlueRock describes the fund's investment policy as \"a balanced fund, with 50 percent of the assets invested in bonds and 50 percent in equities, on average.\" On this basis, BlueRock is:", "opts": ["in violation of CFA Institute Standards concerning the disclosure of security selection and portfolio construction processes.", "not in violation of any CFA Institute Standard.", "in violation of the CFA Institute Standard concerning Fiduciary Duty."], "ans": "A", "expl": "Clearly, the risk profile of this fund is much different from a typical balanced fund. In fact, it could be effectively described as a hedge fund if +200/-100 allocations are typical. BlueRock is in violation of the Standard concerning disclosure of security selection and portfolio construction processes.", "explhtml": "<p>Clearly, the risk profile of this fund is much different from a typical balanced fund. In fact, it could be effectively described as a hedge fund if +200/-100 allocations are typical. BlueRock is in violation of the Standard concerning disclosure of security selection and portfolio construction processes.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(B)<\/div><div class=\"qtext\"><p>BlueRock Fund uses a proprietary asset selection model that it believes gives the firm a competitive advantage. The model is applied to a universe of all small-cap domestic equities and all publicly-traded corporate bonds. The asset allocations generated by this model range from +200 percent in small-cap equities/-100 percent in bonds to +200 percent in bonds/-100 percent in small-cap equities. Since the fund can invest in both equities and bonds, it is classified as a balanced fund. In the prospectus BlueRock describes the fund&#x27;s investment policy as &quot;a balanced fund, with 50 percent of the assets invested in bonds and 50 percent in equities, on average.&quot; On this basis, BlueRock is:<\/p><\/div>", "subj": "ethics"}, {"n": 50, "q": "Bob Hatfield, CFA, has his own money management firm with two clients. The accounts of the two clients are equal in value. It is Hatfield's opinion that interest rates will fall in the near future. Based upon this, Hatfield begins increasing the bond allocation of each portfolio. In order to comply with Standard V(B), Communication with Clients and Prospective Clients, the analyst needs to:", "opts": ["inform the clients of the change and tell them it is based upon an opinion and not a fact.", "perform both of these functions.", "make sure that the change is identical for both clients."], "ans": "A", "expl": "According to Standard V(B), the analyst must inform the clients of the change and tell them it is based upon an opinion and not a fact. Making an identical change in two portfolios may be a violation of this standard if the needs of the clients are not identical.", "explhtml": "<p>According to Standard V(B), the analyst must inform the clients of the change and tell them it is based upon an opinion and not a fact. Making an identical change in two portfolios may be a violation of this standard if the needs of the clients are not identical.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(B)<\/div><div class=\"qtext\"><p>Bob Hatfield, CFA, has his own money management firm with two clients. The accounts of the two clients are equal in value. It is Hatfield&#x27;s opinion that interest rates will fall in the near future. Based upon this, Hatfield begins increasing the bond allocation of each portfolio. In order to comply with Standard V(B), Communication with Clients and Prospective Clients, the analyst needs to:<\/p><\/div>", "subj": "ethics"}, {"n": 51, "q": "Standard V(B), Communication with Clients and Prospective Clients, least likely requires members to:", "opts": ["use reasonable judgment regarding the inclusion or exclusion of relevant factors in research reports.", "make clear buy or sell recommendations on the securities covered in research reports.", "disclose the general principles of investment processes used to analyze and select securities, and construct portfolios."], "ans": "B", "expl": "There is no obligation to make buy or sell recommendations on securities that are covered by research reports.", "explhtml": "<p>There is no obligation to make buy or sell recommendations on securities that are covered by research reports.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(B)<\/div><div class=\"qtext\"><p>Standard V(B), Communication with Clients and Prospective Clients, least likely requires members to:<\/p><\/div>", "subj": "ethics"}, {"n": 52, "q": "Victor Logan is a portfolio manager for McCoy Advisors, and Jack Brisco is the Director of Research for McCoy. Brisco has developed a proprietary model that has been thoroughly researched and is known throughout the industry as the McCoy model. The model is purely quantitative and screens stocks into buy, hold, and sell categories. The basic philosophy of the model is thoroughly explained to clients. Brisco frequently alters the model based on rigorous research—an aspect that is well explained to clients, although the specific alterations are not continually disclosed. Portfolio managers then make specific sector and security holding decisions, purchasing only securities that are indicated as \"buys\" by the model. Logan has conducted very thorough research on his own, using the same process that Brisco uses to validate his findings. Logan feels the model is missing some key elements that would further reduce the list of acceptable securities to purchase, however, Brisco has refused to look at Logan's research. Frustrated by this, Logan applies his own version of the model, with the justification that he is still only purchasing securities on the buy list. Because of the conflict with Brisco, he does not disclose the use of the model to anyone at McCoy or to clients. Which of the following statements regarding Logan and Brisco is CORRECT? Logan is:", "opts": ["not violating the Standards by applying his version of the model, but is violating the Standards by not disclosing it to clients. Brisco is not violating the Standards.", "violating the Standards by applying his version of the model and by not disclosing it to clients. Brisco is not violating the Standards.", "violating the Standards by applying his version of the model and by not disclosing it to clients. Brisco is violating the Standards by failing to consider Logan's research."], "ans": "A", "expl": "Because the research is thoroughly conducted, and Logan has authority to make individual security selection decisions, Logan is not violating the Standards by applying his model. However, Logan is violating the Standard on communication with clients and prospective clients by excluding relevant factors of the investment process. The use of his model is an important aspect of the investment process and should be disclosed to clients. Brisco is not violating the Standards by not considering Logan's research.", "explhtml": "<p>Because the research is thoroughly conducted, and Logan has authority to make individual security selection decisions, Logan is not violating the Standards by applying his model. However, Logan is violating the Standard on communication with clients and prospective clients by excluding relevant factors of the investment process. The use of his model is an important aspect of the investment process and should be disclosed to clients. Brisco is not violating the Standards by not considering Logan&#x27;s research.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41.b<\/div><div class=\"qtext\"><p>Victor Logan is a portfolio manager for McCoy Advisors, and Jack Brisco is the Director of Research for McCoy. Brisco has developed a proprietary model that has been thoroughly researched and is known throughout the industry as the McCoy model. The model is purely quantitative and screens stocks into buy, hold, and sell categories. The basic philosophy of the model is thoroughly explained to clients. Brisco frequently alters the model based on rigorous research—an aspect that is well explained to clients, although the specific alterations are not continually disclosed. Portfolio managers then make specific sector and security holding decisions, purchasing only securities that are indicated as &quot;buys&quot; by the model. Logan has conducted very thorough research on his own, using the same process that Brisco uses to validate his findings. Logan feels the model is missing some key elements that would further reduce the list of acceptable securities to purchase, however, Brisco has refused to look at Logan&#x27;s research. Frustrated by this, Logan applies his own version of the model, with the justification that he is still only purchasing securities on the buy list. Because of the conflict with Brisco, he does not disclose the use of the model to anyone at McCoy or to clients. Which of the following statements regarding Logan and Brisco is CORRECT? Logan is:<\/p><\/div>", "subj": "ethics"}, {"n": 53, "q": "An analyst receives a report from his research department that summarizes and interprets a recent speech from the chairman of the U.S. Federal Reserve. The summary says that the chairman thinks inflation is under control. Based upon this summary, the analyst says in his next newsletter that inflation is under control. This is a violation of:", "opts": ["none of the Standards listed here.", "Standard V(A), Diligence and Reasonable Basis, and Standard V(B), Communication with Clients and Prospective Clients.", "Standard V(A), Diligence and Reasonable Basis, only."], "ans": "B", "expl": "The analyst should verify that the research department has interpreted the chairman's speech correctly. The analyst must make it clear that the statement concerning inflation is only an opinion. No one knows if that is true or not at any point in time. Based upon the given information, we cannot say that the analyst is violating only one standard. The analyst may also be violating plagiarism in accordance with Standard I(C), Misrepresentation. Hence, the answer citing the two standards and not limiting violations to just those two standards is the best answer.", "explhtml": "<p>The analyst should verify that the research department has interpreted the chairman&#x27;s speech correctly. The analyst must make it clear that the statement concerning inflation is only an opinion. No one knows if that is true or not at any point in time. Based upon the given information, we cannot say that the analyst is violating only one standard. The analyst may also be violating plagiarism in accordance with Standard I(C), Misrepresentation. Hence, the answer citing the two standards and not limiting violations to just those two standards is the best answer.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(A)<\/div><div class=\"qtext\"><p>An analyst receives a report from his research department that summarizes and interprets a recent speech from the chairman of the U.S. Federal Reserve. The summary says that the chairman thinks inflation is under control. Based upon this summary, the analyst says in his next newsletter that inflation is under control. This is a violation of:<\/p><\/div>", "subj": "ethics"}, {"n": 54, "q": "An analyst writes a report and includes the forecasts of an econometric model developed by the firm's research department. The analyst identifies the source of the forecast and includes all the relevant statistics concerning the model. With respect to diligence and reasonable basis, the analyst has:", "opts": ["violated the Standards by not evaluating the model independently.", "complied with the Standards.", "violated the Standards by relying on model forecasts."], "ans": "B", "expl": "Members and candidates may reasonably rely on their firms' research departments for analysis and remain in compliance with Standard V(A) Diligence and Reasonable Basis.", "explhtml": "<p>Members and candidates may reasonably rely on their firms&#x27; research departments for analysis and remain in compliance with Standard V(A) Diligence and Reasonable Basis.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(A)<\/div><div class=\"qtext\"><p>An analyst writes a report and includes the forecasts of an econometric model developed by the firm&#x27;s research department. The analyst identifies the source of the forecast and includes all the relevant statistics concerning the model. With respect to diligence and reasonable basis, the analyst has:<\/p><\/div>", "subj": "ethics"}, {"n": 55, "q": "An analyst has constructed an investment policy statement (IPS) and a portfolio for a new client, Susan Stevens. He has also provided written guidelines on the processes used to make investment management decisions. Six month later, Stevens questions the analyst about several portfolio holdings. Although the analyst cannot remember his reasoning for recommending specific securities, and cannot find supporting documents, he assures her that the recommendations were made within the limits of her IPS and the firm's stated processes for making investment management decisions. Stevens is not satisfied by this response, but leaves the portfolio unchanged. The analyst has most likely violated:", "opts": ["Standard V(C) Record Retention.", "Standard V(B) Communications with Clients and Prospective Clients.", "Standard III(C) Suitability."], "ans": "A", "expl": "Standard V(C) Record Retention requires analysts to develop and maintain \"...records to support their investment analysis, recommendations...with clients and prospective clients.\" The analyst is unable to explain why securities were added to the portfolio; this is a violation of Standard V(C).", "explhtml": "<p>Standard V(C) Record Retention requires analysts to develop and maintain &quot;...records to support their investment analysis, recommendations...with clients and prospective clients.&quot; The analyst is unable to explain why securities were added to the portfolio; this is a violation of Standard V(C).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(C)<\/div><div class=\"qtext\"><p>An analyst has constructed an investment policy statement (IPS) and a portfolio for a new client, Susan Stevens. He has also provided written guidelines on the processes used to make investment management decisions. Six month later, Stevens questions the analyst about several portfolio holdings. Although the analyst cannot remember his reasoning for recommending specific securities, and cannot find supporting documents, he assures her that the recommendations were made within the limits of her IPS and the firm&#x27;s stated processes for making investment management decisions. Stevens is not satisfied by this response, but leaves the portfolio unchanged. The analyst has most likely violated:<\/p><\/div>", "subj": "ethics"}, {"n": 56, "q": "Bill Fox, CFA, has been preparing a research report on New London Wire and Cable, one of his major investment clients. He had completed much of his analysis and had planned on having his report typed and bound today. Unfortunately, his briefcase was stolen while he ate breakfast, and he lost all his notes and working papers. The lost materials included his notes from management interviews, conversations with suppliers and competitors, dates of company visits, and his computer diskette containing much of his quantitative analysis. Fox's client needs this report tomorrow. In a panic, Fox called New London's vice president of finance and was faxed a copy of the company's most recent financial projections. Fox remembered that his own analysis showed that management's estimates were too high. He did not remember the exact amount, so he revised New London's figures downward 10%. Fox incorporated some charts and graphs on New London from a research report he received last week from a small regional research firm and some information from a Standard & Poor's reference work in his report, without reference to their sources. Fox has:", "opts": ["violated none of the Standards.", "violated the requirement to have a reasonable basis for a recommendation and the prohibition against plagiarism.", "violated the requirement to have a reasonable basis for a recommendation, the prohibition against plagiarism, and the requirement to maintain appropriate records."], "ans": "C", "expl": "New London's report is potentially self serving, so Fox did not exercise diligence or have an adequate basis for his recommendation. In addition, Fox did not acknowledge his source of the charts and graphs. Finally, he did not maintain adequate records.", "explhtml": "<p>New London&#x27;s report is potentially self serving, so Fox did not exercise diligence or have an adequate basis for his recommendation. In addition, Fox did not acknowledge his source of the charts and graphs. Finally, he did not maintain adequate records.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(A)<\/div><div class=\"qtext\"><p>Bill Fox, CFA, has been preparing a research report on New London Wire and Cable, one of his major investment clients. He had completed much of his analysis and had planned on having his report typed and bound today. Unfortunately, his briefcase was stolen while he ate breakfast, and he lost all his notes and working papers. The lost materials included his notes from management interviews, conversations with suppliers and competitors, dates of company visits, and his computer diskette containing much of his quantitative analysis. Fox&#x27;s client needs this report tomorrow. In a panic, Fox called New London&#x27;s vice president of finance and was faxed a copy of the company&#x27;s most recent financial projections. Fox remembered that his own analysis showed that management&#x27;s estimates were too high. He did not remember the exact amount, so he revised New London&#x27;s figures downward 10%. Fox incorporated some charts and graphs on New London from a research report he received last week from a small regional research firm and some information from a Standard &amp; Poor&#x27;s reference work in his report, without reference to their sources. Fox has:<\/p><\/div>", "subj": "ethics"}, {"n": 57, "q": "Using as his universe all companies in the steel industry, Reynold Anderson analyses the performance of stock prices for the industry. He succeeds in developing a regression model with excellent statistical control measures. The extrapolation from the model shows low risk variance of the securities in this industry. Without the inclusion of non-steel stocks in the portfolio, Anderson concludes that, based on these results, every portfolio can use the steel industry securities to diversify and lower its risk. He persuades his clients to change their current portfolios. Anderson states that, as the model's results show, some particular industries, such as car manufacturers, have underpriced stocks, and investors should take advantage of it. Anderson has violated the Standards because he:", "opts": ["does not distinguish the opinion, based on his model, from the fact.", "is not clear enough about the model results.", "does not consider the suitability of the investment."], "ans": "A", "expl": "While any of the answers can be shown to violate CFA Institute Standards, this cannot be determined conclusively from the information given. However, the scenario clearly indicates that Anderson does not distinguish between opinion and fact in communicating to his clients. Therefore, he violates the Standards on this basis.", "explhtml": "<p>While any of the answers can be shown to violate CFA Institute Standards, this cannot be determined conclusively from the information given. However, the scenario clearly indicates that Anderson does not distinguish between opinion and fact in communicating to his clients. Therefore, he violates the Standards on this basis.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41.b<\/div><div class=\"qtext\"><p>Using as his universe all companies in the steel industry, Reynold Anderson analyses the performance of stock prices for the industry. He succeeds in developing a regression model with excellent statistical control measures. The extrapolation from the model shows low risk variance of the securities in this industry. Without the inclusion of non-steel stocks in the portfolio, Anderson concludes that, based on these results, every portfolio can use the steel industry securities to diversify and lower its risk. He persuades his clients to change their current portfolios. Anderson states that, as the model&#x27;s results show, some particular industries, such as car manufacturers, have underpriced stocks, and investors should take advantage of it. Anderson has violated the Standards because he:<\/p><\/div>", "subj": "ethics"}, {"n": 58, "q": "A manager of pooled funds must do all of the following to remain in compliance with the Standards EXCEPT:", "opts": ["Disclose basic security selection processes.", "Print the investment policy statement in all quarterly reports.", "Notify potential investors of any changes in investment policy."], "ans": "B", "expl": "There is no requirement to include the investment policy statement in all quarterly reports.", "explhtml": "<p>There is no requirement to include the investment policy statement in all quarterly reports.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(B)<\/div><div class=\"qtext\"><p>A manager of pooled funds must do all of the following to remain in compliance with the Standards EXCEPT:<\/p><\/div>", "subj": "ethics"}, {"n": 59, "q": "Ten years ago Lance Tuipuloto, CFA, met with Horace and Nichole Scadden to discuss potential investments, but these prospects never became clients. Tuipuloto now wants to destroy the records from the meeting with the prospective clients. Is this action in compliance with Standard V(C)?", "opts": ["No.", "Yes; the prospects never became clients.", "Yes; A sufficient number of years have passed since the meeting."], "ans": "C", "expl": "According to Standard V(C), Record Retention, the files may be destroyed. The CFA Institute recommends keeping all records for at least 7 years. Given that more than 7 years have passed since Tuipuloto's meeting with the Scaddens, it is not against Standard V(C) to get rid of the records from that meeting.", "explhtml": "<p>According to Standard V(C), Record Retention, the files may be destroyed. The CFA Institute recommends keeping all records for at least 7 years. Given that more than 7 years have passed since Tuipuloto&#x27;s meeting with the Scaddens, it is not against Standard V(C) to get rid of the records from that meeting.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.8, LOS 41: V(C)<\/div><div class=\"qtext\"><p>Ten years ago Lance Tuipuloto, CFA, met with Horace and Nichole Scadden to discuss potential investments, but these prospects never became clients. Tuipuloto now wants to destroy the records from the meeting with the prospective clients. Is this action in compliance with Standard V(C)?<\/p><\/div>", "subj": "ethics"}, {"n": 60, "q": "Womack's trading actions are a violation of:", "opts": ["Standard IV(A)—Loyalty to Employer and Standard III(B)—Fair Dealing.", "Standard III(E)—Preservation of Confidentiality and Standard VI(B)—Priority of Transactions.", "Standard III(A)—Loyalty, Prudence, and Care and Standard VI(B)—Priority of Transactions."], "ans": "C", "expl": "Womack's actions violate the Standards related to fair dealing, priority of transactions, and fiduciary duties. Standard III(A) is about members' duty of loyalty to clients and talks about how members should place their clients' interests before their employers' or their own interests. Womack's actions violate Standard III(A): Womack is essentially front running Horizon's clients. Standard III(E) concerns keeping information about current, former, and prospective clients confidential; QuickStop is not a current, former, or prospective client of Horizon so Standard III(E) does not apply in this case.", "explhtml": "<p>Womack&#x27;s actions violate the Standards related to fair dealing, priority of transactions, and fiduciary duties. Standard III(A) is about members&#x27; duty of loyalty to clients and talks about how members should place their clients&#x27; interests before their employers&#x27; or their own interests. Womack&#x27;s actions violate Standard III(A): Womack is essentially front running Horizon&#x27;s clients. Standard III(E) concerns keeping information about current, former, and prospective clients confidential; QuickStop is not a current, former, or prospective client of Horizon so Standard III(E) does not apply in this case.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 60–63<\/summary><div class=\"vig-body\"><p>Rajiv Singh, a CFA charterholder, works as an equity analyst with Horizon Investments, a large broker/dealer. After ski-resort developer HighLife misses a quarterly earnings target, Singh changes his recommendation on HighLife from buy to hold. Singh has been following HighLife for years. In several previous research reports on HighLife, Singh told clients that, based on his detailed analysis of the financial statements and market position, he believed HighLife had stopped picking up market share. He had mentioned concerns about HighLife several times in his reports and said in the most recent report that he would downgrade the stock if it missed quarterly earnings.<\/p><p>Singh had produced his monthly report on HighLife just a week before the earnings announcement, and because he had just written about his intention to downgrade the stock, he felt he did not need to inform clients of his recommendation change until the next monthly report.<\/p><p>On the same day that the HighLife report was released, Singh initiated coverage on another company with a buy rating, the convenience store operator QuickStop. His research report is distributed that afternoon. A client sends Singh a sell order for QuickStop via e-mail the same day the new recommendation is being disseminated to all Singh's clients and prospects.<\/p><p>John Womack, a Level || CFA candidate, is a trader at Horizon. Womack, walking past the conference room during an investment meeting, learns of the initiation of the buy rating on QuickStop. Prior to the dissemination of the buy rating to Horizon's clients, he buys up a large block of QuickStop shares for Horizon's account in anticipation of clients' interest in the stock. When the rating is released to the firm's customers, he fills the incoming customer orders out of Horizon's inventory, generating a modest profit for the company.<\/p><p>Horizon is drafting trade-allocation guidelines for companywide use. Five regulations the company is considering are listed below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-8/v004.webp\" style=\"max-width:min(100%,637px)\" alt=\"1. Regular orders are processed and executed on a pro-rata basis. 2. Shares in initial public offerings will be allocated on a pro-rata basis to the firm&#x27;s portfolio managers according to advance indications of interest from the managers. 3. When the full amount of a block order is not executed, partially executed orders are allocated on a first-in, first-out basis. 4. Orders must be recorded in writing and stamped with the time of the order and the execution. 5. All clients participating in block trades are given the same execution price, and all clients are charged the same commission.\"><\/div><\/details><div class=\"pp-topic\">Module 41.4, LOS 41.a<\/div><div class=\"qtext\"><p>Womack&#x27;s trading actions are a violation of:<\/p><\/div>", "subj": "ethics"}, {"n": 61, "q": "With regard to his coverage of HighLife stock, Singh:", "opts": ["did not violate the Standards for reasonable basis or research reports.", "violated the research reports Standard because he failed to differentiate between facts and opinions.", "violated the reasonable basis Standard by downgrading a stock because it missed one quarterly earnings estimate."], "ans": "A", "expl": "Singh reported a series of facts that led him to draw a conclusion, and identified the conclusion as his own. No nonpublic information was used in the HighLife analysis. While Singh did say that missing an earnings target would spur a downgrade, he made it clear that he had broader concerns about the firm's market share. Missing an earnings target would simply be confirmation of his concerns, and thus be the catalyst to his change of opinion.", "explhtml": "<p>Singh reported a series of facts that led him to draw a conclusion, and identified the conclusion as his own. No nonpublic information was used in the HighLife analysis. While Singh did say that missing an earnings target would spur a downgrade, he made it clear that he had broader concerns about the firm&#x27;s market share. Missing an earnings target would simply be confirmation of his concerns, and thus be the catalyst to his change of opinion.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 60–63<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rajiv Singh, a CFA charterholder, works as an equity analyst with Horizon Investments, a large broker/dealer. After ski-resort developer HighLife misses a quarterly earnings target, Singh changes his recommendation on HighLife from buy to hold. Singh has been following HighLife for years. In several previous research reports on HighLife, Singh told clients that, based on his detailed analysis of the financial statements and market position, he believed HighLife had stopped picking up market share. He had mentioned concerns about HighLife several times in his reports and said in the most recent report that he would downgrade the stock if it missed quarterly earnings.<\/p><p>Singh had produced his monthly report on HighLife just a week before the earnings announcement, and because he had just written about his intention to downgrade the stock, he felt he did not need to inform clients of his recommendation change until the next monthly report.<\/p><p>On the same day that the HighLife report was released, Singh initiated coverage on another company with a buy rating, the convenience store operator QuickStop. His research report is distributed that afternoon. A client sends Singh a sell order for QuickStop via e-mail the same day the new recommendation is being disseminated to all Singh's clients and prospects.<\/p><p>John Womack, a Level || CFA candidate, is a trader at Horizon. Womack, walking past the conference room during an investment meeting, learns of the initiation of the buy rating on QuickStop. Prior to the dissemination of the buy rating to Horizon's clients, he buys up a large block of QuickStop shares for Horizon's account in anticipation of clients' interest in the stock. When the rating is released to the firm's customers, he fills the incoming customer orders out of Horizon's inventory, generating a modest profit for the company.<\/p><p>Horizon is drafting trade-allocation guidelines for companywide use. Five regulations the company is considering are listed below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-8/v004.webp\" style=\"max-width:min(100%,637px)\" alt=\"1. Regular orders are processed and executed on a pro-rata basis. 2. Shares in initial public offerings will be allocated on a pro-rata basis to the firm&#x27;s portfolio managers according to advance indications of interest from the managers. 3. When the full amount of a block order is not executed, partially executed orders are allocated on a first-in, first-out basis. 4. Orders must be recorded in writing and stamped with the time of the order and the execution. 5. All clients participating in block trades are given the same execution price, and all clients are charged the same commission.\"><\/div><\/details><div class=\"pp-topic\">Module 41.8, LOS 41.a<\/div><div class=\"qtext\"><p>With regard to his coverage of HighLife stock, Singh:<\/p><\/div>", "subj": "ethics"}, {"n": 62, "q": "After Singh changed his investment recommendation for HighLife from a \"buy\" to a \"hold,\" he violated:", "opts": ["Standard I(C)—Misrepresentation by not exercising diligence and thoroughness in his research.", "Standard III(B)—Fair Dealing by not telling clients about the downgrade of HighLife in the wake of his promise to downgrade the stock if it missed estimates.", "Standard V(A)—Loyalty, Prudence, and Care by not exercising reasonable care and prudent judgment in his research."], "ans": "B", "expl": "A change in stock rating is always material, and must always be disclosed to clients. Thus, Singh violated Standard III(B). Singh did not violate a fiduciary duty to his clients because he did not put anyone's interest above theirs. As an analyst, Singh's job is to assess the appeal of an investment, not make investment decisions for individual accounts. As such, he did not violate Standard III(C); Standard I(C) relates to misrepresenting qualifications or guaranteeing investment returns, and is not relevant to this situation.", "explhtml": "<p>A change in stock rating is always material, and must always be disclosed to clients. Thus, Singh violated Standard III(B). Singh did not violate a fiduciary duty to his clients because he did not put anyone&#x27;s interest above theirs. As an analyst, Singh&#x27;s job is to assess the appeal of an investment, not make investment decisions for individual accounts. As such, he did not violate Standard III(C); Standard I(C) relates to misrepresenting qualifications or guaranteeing investment returns, and is not relevant to this situation.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 60–63<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rajiv Singh, a CFA charterholder, works as an equity analyst with Horizon Investments, a large broker/dealer. After ski-resort developer HighLife misses a quarterly earnings target, Singh changes his recommendation on HighLife from buy to hold. Singh has been following HighLife for years. In several previous research reports on HighLife, Singh told clients that, based on his detailed analysis of the financial statements and market position, he believed HighLife had stopped picking up market share. He had mentioned concerns about HighLife several times in his reports and said in the most recent report that he would downgrade the stock if it missed quarterly earnings.<\/p><p>Singh had produced his monthly report on HighLife just a week before the earnings announcement, and because he had just written about his intention to downgrade the stock, he felt he did not need to inform clients of his recommendation change until the next monthly report.<\/p><p>On the same day that the HighLife report was released, Singh initiated coverage on another company with a buy rating, the convenience store operator QuickStop. His research report is distributed that afternoon. A client sends Singh a sell order for QuickStop via e-mail the same day the new recommendation is being disseminated to all Singh's clients and prospects.<\/p><p>John Womack, a Level || CFA candidate, is a trader at Horizon. Womack, walking past the conference room during an investment meeting, learns of the initiation of the buy rating on QuickStop. Prior to the dissemination of the buy rating to Horizon's clients, he buys up a large block of QuickStop shares for Horizon's account in anticipation of clients' interest in the stock. When the rating is released to the firm's customers, he fills the incoming customer orders out of Horizon's inventory, generating a modest profit for the company.<\/p><p>Horizon is drafting trade-allocation guidelines for companywide use. Five regulations the company is considering are listed below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-8/v004.webp\" style=\"max-width:min(100%,637px)\" alt=\"1. Regular orders are processed and executed on a pro-rata basis. 2. Shares in initial public offerings will be allocated on a pro-rata basis to the firm&#x27;s portfolio managers according to advance indications of interest from the managers. 3. When the full amount of a block order is not executed, partially executed orders are allocated on a first-in, first-out basis. 4. Orders must be recorded in writing and stamped with the time of the order and the execution. 5. All clients participating in block trades are given the same execution price, and all clients are charged the same commission.\"><\/div><\/details><div class=\"pp-topic\">Module 41.5, LOS 41.a<\/div><div class=\"qtext\"><p>After Singh changed his investment recommendation for HighLife from a &quot;buy&quot; to a &quot;hold,&quot; he violated:<\/p><\/div>", "subj": "ethics"}, {"n": 63, "q": "Which of the following trade allocation procedures being considered for Horizon's trade allocation policy would NOT be consistent with Standard III(B)—Fair Dealing?", "opts": ["Regular orders are processed and executed on a pro-rata basis.", "When the full amount of a block order is not executed, partially executed orders are allocated on a first-in, first-out basis.", "All clients participating in block trades are given the same execution price and are charged the same commission."], "ans": "B", "expl": "All orders should be allocated on a pro rata basis based on order size, not on a first-in, first-out basis. The other regulations satisfy the fair-dealing Standard.", "explhtml": "<p>All orders should be allocated on a pro rata basis based on order size, not on a first-in, first-out basis. The other regulations satisfy the fair-dealing Standard.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 60–63<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rajiv Singh, a CFA charterholder, works as an equity analyst with Horizon Investments, a large broker/dealer. After ski-resort developer HighLife misses a quarterly earnings target, Singh changes his recommendation on HighLife from buy to hold. Singh has been following HighLife for years. In several previous research reports on HighLife, Singh told clients that, based on his detailed analysis of the financial statements and market position, he believed HighLife had stopped picking up market share. He had mentioned concerns about HighLife several times in his reports and said in the most recent report that he would downgrade the stock if it missed quarterly earnings.<\/p><p>Singh had produced his monthly report on HighLife just a week before the earnings announcement, and because he had just written about his intention to downgrade the stock, he felt he did not need to inform clients of his recommendation change until the next monthly report.<\/p><p>On the same day that the HighLife report was released, Singh initiated coverage on another company with a buy rating, the convenience store operator QuickStop. His research report is distributed that afternoon. A client sends Singh a sell order for QuickStop via e-mail the same day the new recommendation is being disseminated to all Singh's clients and prospects.<\/p><p>John Womack, a Level || CFA candidate, is a trader at Horizon. Womack, walking past the conference room during an investment meeting, learns of the initiation of the buy rating on QuickStop. Prior to the dissemination of the buy rating to Horizon's clients, he buys up a large block of QuickStop shares for Horizon's account in anticipation of clients' interest in the stock. When the rating is released to the firm's customers, he fills the incoming customer orders out of Horizon's inventory, generating a modest profit for the company.<\/p><p>Horizon is drafting trade-allocation guidelines for companywide use. Five regulations the company is considering are listed below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-8/v004.webp\" style=\"max-width:min(100%,637px)\" alt=\"1. Regular orders are processed and executed on a pro-rata basis. 2. Shares in initial public offerings will be allocated on a pro-rata basis to the firm&#x27;s portfolio managers according to advance indications of interest from the managers. 3. When the full amount of a block order is not executed, partially executed orders are allocated on a first-in, first-out basis. 4. Orders must be recorded in writing and stamped with the time of the order and the execution. 5. All clients participating in block trades are given the same execution price, and all clients are charged the same commission.\"><\/div><\/details><div class=\"pp-topic\">Module 41.5, LOS 41.a<\/div><div class=\"qtext\"><p>Which of the following trade allocation procedures being considered for Horizon&#x27;s trade allocation policy would NOT be consistent with Standard III(B)—Fair Dealing?<\/p><\/div>", "subj": "ethics"}];
const CFG = {"title": "Reading 41.8 — Guidance for Standard V", "subtitle": "CFA Level II · 63 câu · Kaplan Schweser QBank 2025 (36 câu đơn · 27 câu item set)", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);

// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,
  fsa:/financial statement|financial reporting|accounting|income statement|balance sheet|cash flow|revenue|expense|inventory|cost of sales|gross profit|gross margin|shareholders?['’]? equity|earnings per share|\beps\b|audit|gaap|ifrs|taxable income|deferred tax|temporary difference|intangible|long-lived|revaluation|impairment|amortization|depreciation|pension|financial ratio|receivables turnover|payables turnover|cash conversion|fixed charge coverage|normalized earnings|management['’]?s commentary/g,
  corporate:/corporate|company lifecycle|start-up|startup|early-stage|business model|franchise|board of directors|proxy voting|stakeholder|shareholder|creditor|governance|capital budgeting|capital investment|project|real option|\bnpv\b|internal rate of return|\birr\b|cost of debt|cost of capital|capital structure|weight of debt|modigliani|dividend policy|double taxation|principal-agent|working capital|liquidity|compensation|competitive strategy|porter|economies of scale|information asymmetry|agency relationship/g,
  equity:/equity|common share|preferred share|stock|market index|index weighting|market efficiency|efficient market|security market|buy order|sell order|limit order|dealer|margin requirement|leverage ratio|industry classification|company analysis|enterprise value|price-to|free cash flow to equity|\bfcfe\b|dividend discount|earnings multiplier|book value per share|intrinsic value|voting|ex-dividend/g,
  fixed:/fixed-income|fixed income|bond|debt|credit rating|credit spread|yield|spot rate|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|repo|covenant|accrued interest|priority of claims|default|extension risk|interest coverage/g,
  derivatives:/derivative|forward|future|swap|option|call buyer|call seller|put buyer|put seller|strike price|premium|put-call|binomial|contingent claim|moneyness|expiration|arbitrage|replication/g,
  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,
  portfolio:/portfolio|asset allocation|investment policy|\bips\b|behavioral|cognitive error|risk aversion|utility|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation|covariance|sharpe|treynor|jensen|information ratio|two-fund|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral/g
};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
