se the model to analyze the effects of the merger on Falcon&#x27;s growth and profitability.<\/p><\/div><\/details><div class=\"qtext\"><p>Which comments) made by Fan and Zhang correctly describe a company&#x27;s intrinsic value?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q055.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":56,"q":"If the unobservable intrinsic value for Falcon's stock is ·840, then based on Zhang's forecast, the true mispricing is closest to:","opts":["·30","·60","·90"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a056.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a056.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 53–58 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lei Fan, CFA and Ju Zhang, CFA, two portfolio managers at Sunrise Capital, are discussing potential investments. Their discussion begins with the construction equipment industry and Falcon Manufacturing&#x27;s competitive position. Fan states that during his initial analysis, he observed that Falcon has been able to improve on the most popular products sold across the industry. The improvements have allowed Falcon to maintain selling prices higher than its competitors.<\/p><p>Zhang mentions that she has analyzed Falcon&#x27;s revenue growth and profitability, compared to its peers, using ratios based on data from its financial statements for the last five years. She finds that Falcon has outperformed its peers for the first four years of her analysis, and then performed on average with peers in the last year.<\/p><p>During their conversation, they also discuss their latest valuations for Falcon and make the following comm ">Vignette<\/span>Case 11 · Câu 53–58 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lei Fan, CFA and Ju Zhang, CFA, two portfolio managers at Sunrise Capital, are discussing potential investments. Their discussion begins with the construction equipment industry and Falcon Manufacturing&#x27;s competitive position. Fan states that during his initial analysis, he observed that Falcon has been able to improve on the most popular products sold across the industry. The improvements have allowed Falcon to maintain selling prices higher than its competitors.<\/p><p>Zhang mentions that she has analyzed Falcon&#x27;s revenue growth and profitability, compared to its peers, using ratios based on data from its financial statements for the last five years. She finds that Falcon has outperformed its peers for the first four years of her analysis, and then performed on average with peers in the last year.<\/p><p>During their conversation, they also discuss their latest valuations for Falcon and make the following comments:<\/p><p>Fan: Investors can only estimate Falcon&#x27;s intrinsic value since knowledge of a company&#x27;s investment characteristics will always be incomplete.<\/p><p>Zhang: My value estimate is above the current market price, and if I am right, convergence will make the price increase in the near-term.<\/p><p>Falcon&#x27;s stock currently trades at ¥780 and Zhang&#x27;s forecast model estimates the stock&#x27;s intrinsic value at ¥870. Zhang expects Falcon to maintain profitability for the foreseeable future. Despite Falcon&#x27;s consistent positive free cash flow generation and profitability, Fan suggests that Zhang also look at Falcon&#x27;s liquidation value and compare it against the going-concern value derived in her forecast.<\/p><p>Fan and Zhang have a meeting with Falcon&#x27;s CFO scheduled for later in the week. Zhang tells Fan that she will send the valuation model she created to the CFO to facilitate communication with her. Zhang plans to ask the CFO about a rumored merger between Falcon and one of its competitors and to use the model to analyze the effects of the merger on Falcon&#x27;s growth and profitability.<\/p><\/div><\/details><div class=\"qtext\"><p>Compared with its liquidation value, Falcon&#x27;s going concern value will most likely be:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q057.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":58,"q":"For her meeting with the CFO, which of the following is an appropriate application of Zhang's valuation model?","opts":["Communicating with the CFO only","Evaluating the effect of the acquisition only","Both communication with the CFO and evaluating the effect of the acquisition"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a058.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a058.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 53–58 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lei Fan, CFA and Ju Zhang, CFA, two portfolio managers at Sunrise Capital, are discussing potential investments. Their discussion begins with the construction equipment industry and Falcon Manufacturing&#x27;s competitive position. Fan states that during his initial analysis, he observed that Falcon has been able to improve on the most popular products sold across the industry. The improvements have allowed Falcon to maintain selling prices higher than its competitors.<\/p><p>Zhang mentions that she has analyzed Falcon&#x27;s revenue growth and profitability, compared to its peers, using ratios based on data from its financial statements for the last five years. She finds that Falcon has outperformed its peers for the first four years of her analysis, and then performed on average with peers in the last year.<\/p><p>During their conversation, they also discuss their latest valuations for Falcon and make the following comments:<\/p><p>Fan: Investors can only estimate Falcon&#x27;s intrinsic value since knowledge of a company&#x27;s investment characteristics will always be incomplete.<\/p><p>Zhang: My value estimate is above the current market price, and if I am right, convergence will make the price increase in the near-term.<\/p><p>Falcon&#x27;s stock currently trades at ¥780 and Zhang&#x27;s forecast model estimates the stock&#x27;s intrinsic value at ¥870. Zhang expects Falcon to maintain profitability for the foreseeable future. Despite Falcon&#x27;s consistent positive free cash flow generation and profitability, Fan suggests that Zhang also look at Falcon&#x27;s liquidation value and compare it against the going-concern value derived in her forecast.<\/p><p>Fan and Zhang have a meeting with Falcon&#x27;s CFO scheduled for later in the week. Zhang tells Fan that she will send the valuation model she created to the CFO to facilitate communication with her. Zhang plans to ask the CFO about a rumored merger between Falcon and one of its competitors and to use the model to analyze the effects of the merger on Falcon&#x27;s growth and profitability.<\/p><\/div><\/details><div class=\"qtext\"><p>For her meeting with the CFO, which of the following is an appropriate application of Zhang&#x27;s valuation model?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q058.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":59,"q":"Which of Madan's statements best describes the process for estimating an asset's intrinsic value?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a059.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a059.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 59–64 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Rudra Dhawan, CFA, is a corporate development analyst at Prime Technologies. He is currently analyzing two large, publicly traded companies identified by his manager, Aditi Madan, as potential acquisition targets. Madan suggests starting the analysis with each company&#x27;s stock price, based on the following statements:<\/p><p><b>Statement 1:<\/b> Since markets are fully efficient and other analysts have done the research, each stock&#x27;s price will accurately represent its intrinsic value.<\/p><p><b>Statement 2:<\/b> The rational efficient markets formulation suggests that investors will not incur the expense of equity analysis without the expectation of greater returns.<\/p><p><b>Statement 3:<\/b> It does not matter which valuation model you choose; all of them will provide valid estimates of intrinsic value.<\/p><p>Dhawan begins his analysis by examining each company&#x27;s competitive positioning and financials, pulling together the following data:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex023.webp\" style=\"max-width:min(100%,606px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex024.webp\" style=\"max-width:min(100%,620px)\" alt=\"Exhibit\"><p>After conducing this analysis, Dhawan begins forecasting each company&#x27;s financials and running valuations based on his estimates. Madan provides Dhawan with the potential synergies that Prime can expect to achieve by buying and integrating each potential acquisition target.<\/p><p>Madan is curious about Target 1 since it is a conglomerate and asks Dhawan what issues she should consider. Dhawan makes two comments in response:<\/p><p><b>Comment 1:<\/b> A conglomerate discount should be applied to any company with multiple business segments.<\/p><p><b>Comment 2:<\/b> The fact that Target 1 is a conglomerate may signal that its primary business unit has underperformed.<\/p><p>Madan tells Dhawan that Prime will acquire one of these companies by taking a majority stake and then taking the acquired company private. Madan is concerned about a scenario in which the acquisition target is purchased, the integration fails, and Prime must then resell the target to another buyer. Madan asks Dhawan what situational adjustments must be made in this scenario to properly value the company to be acquired.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Madan&#x27;s statements best describes the process for estimating an asset&#x27;s intrinsic value?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q059.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":60,"q":"Based on Exhibit 1, what is the most appropriate model for Dhawan to use to estimate the intrinsic value of Target 2?","opts":["Free cash flow","Sum of the parts","P/E relative valuation"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a060.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a060.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 59–64 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rudra Dhawan, CFA, is a corporate development analyst at Prime Technologies. He is currently analyzing two large, publicly traded companies identified by his manager, Aditi Madan, as potential acquisition targets. Madan suggests starting the analysis with each company&#x27;s stock price, ba  properly value the company to be acquired.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, what is the most appropriate model for Dhawan to use to estimate the intrinsic value of Target 2?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q060.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":61,"q":"Based on Exhibit 2, using a sum of the parts valuation, the price of Target 1's stock (in INR) would be closest to:","opts":["6.59","6.78","7.04"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a061.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a061.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 59–64 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rudra Dhawan, CFA, is a corporate development analyst at Prime Technologies. He is currently analyzing two large, publicly traded companies identified by his manager, Aditi Madan, as potential acquisition targets. Madan suggests starting the analysis with each company&#x27;s stock price, based on the following statements:<\/p><p><b>Statement 1:<\/b> Since markets are fully efficient and other analysts have done the research, each stock&#x27;s price will accurately represent its intrinsic value.<\/p><p><b>Statement 2:<\/b> The rational efficient markets formulation suggests that investors will not incur the expense of equity analysis without the expectation of greater returns.<\/p><p><b>Statement 3:<\/b> It does not matter which valuation model you choose; all of them will provide valid estimates of intrinsic value.<\/p><p>Dhawan begins his analysis by examining each company&#x27;s competitive positioning and financials, pulling together the following data ario to properly value the company to be acquired.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Dhawan&#x27;s comments about conglomerate discounts is (are) correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q063.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":64,"q":"If an acquisition target is purchased and then resold, the scenario that Madan discussed with Dhawan, which of the following would be the most appropriate situational adjustment to value the acquired company?","opts":["Control premium","Illiquidity discount","Lack of marketability discount"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a064.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a064.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 59–64 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rudra Dhawan, CFA, is a corporate development analyst at Prime Technologies. He is currently analyzing two large, publicly traded companies identified by his manager, Aditi Madan, as potential acquisition targets. Madan suggests starting the analysis with each company&#x27;s stock price, based on the following statements:<\/p><p><b>Statement 1:<\/b> Since markets are fully efficient and other analysts have done the research, each stock&#x27;s price will accurately represent its intrinsic value.<\/p><p><b>Statement 2:<\/b> The rational efficient markets formulation suggests that investors will not incur the expense of equity analysis without the expectation of greater returns.<\/p><p><b>Statement 3:<\/b> It does not matter which valuation model you choose; all of them will provide valid estimates of intrinsic value.<\/p><p>Dhawan begins his analysis by examining each company&#x27;s competitive positioning and financials, pulling together the following data:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex023.webp\" style=\"max-width:min(100%,606px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex024.webp\" style=\"max-width:min(100%,620px)\" alt=\"Exhibit\"><p>After conducing this analysis, Dhawan begins forecasting each company&#x27;s financials and running valuations based on his estimates. Madan provides Dhawan with the potential synergies that Prime can expect to achieve by buying and integrating each potential acquisition target.<\/p><p>Madan is curious about Target 1 since it is a conglomerate and asks Dhawan what issues she should consider. Dhawan makes two comments in response:<\/p><p><b>Comment 1:<\/b> A conglomerate discount should be applied to any company with multiple business segments.<\/p><p><b>Comment 2:<\/b> The fact that Target 1 is a conglomerate may signal that its primary business unit has underperformed.<\/p><p>Madan tells Dhawan that Prime will acquire one of these companies by taking a majority stake and then taking the acquired company private. Madan is concerned about a scenario in which the acquisition target is purchased, the integration fails, and Prime must then resell the target to another buyer. Madan asks Dhawan what situational adjustments must be made in this scenario to properly value the company to be acquired.<\/p><\/div><\/details><div class=\"qtext\"><p>If an acquisition target is purchased and then resold, the scenario that Madan discussed with Dhawan, which of the following would be the most appropriate situational adjustment to value the acquired company?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q064.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":65,"q":"In his statement about the applications of financial models, Reed is incorrect regarding:","opts":["communicating with company management and investor relations.","the ability to infer market expectations from the model before the IPO.","the similarity between private and public company fundamental modeling."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a065.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a065.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 65–70 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Martha Hayes is a sell-side analyst covering Envision Inc., which is planning an IPO. Given that this will be Hayes&#x27;s first IPO, she asks her senior analyst, Benjamin Reed, CFA, for guidance.<\/p><p>Reed states, &quot;Completing an equity valuation model will make it easier to communicate with company management and investor relations. It will enable us to infer the market&#x27;s expectations about the company before its IPO. In terms of process, creating a fundamental model for a private company is largely the same as creating a fundamental model for a public company.&quot;<\/p><p>Hayes begins her analysis by collecting data on Envision&#x27;s competitive position:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex025.webp\" style=\"max-width:min(100%,623px)\" alt=\"Exhibit\"><p>Hayes then collects data on Envision&#x27;s financial position from its reported financial statements:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex026.webp\" style=\"max-width:min(100%,504px)\" alt=\"Exhibit\"><p>Hayes believes Envision is well positioned to survive and grow for the foreseeable future based on this analysis. She asks Reed which measure of value would be the most suitable basis for their investment recommendation once the company begins trading on the secondary market.<\/p><p>Reed is more concerned about how Envision will compare with its peers once it is priced. Some of Reed&#x27;s clients are asking about whether Envision is likely to be overpriced, fairly priced, or underpriced. Reed asks Hayes to pull together relevant data on Envision and its publicly traded peers with identical investment characteristics, shown in Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex027.webp\" style=\"max-width:min(100%,452px)\" alt=\"Exhibit\"><p>Hayes questions whether a relative valuation is the best way to model Envision. Regarding model selection, she suggests that the valuation models be consistent with:<\/p><p>Factor 1: the analyst&#x27;s purpose of the valuation.<\/p><p>Factor 2: the models used for the company&#x27;s competitors.<\/p><p>Factor 3: the way other analysts are modeling the company for comparison.<\/p><\/div><\/details><div class=\"qtext\"><p>In his statement about the applications of financial models, Reed is incorrect regarding:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q065.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":66,"q":"Based on Exhibit 1, which of the following of Porter's forces would most likely have a negative impact on Envision's profitability?","opts":["Buyer power","Supplier power","Intra-industry rivalry"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a066.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a066.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 65–70 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Martha Hayes is a sell-side analyst covering Envision Inc., which is planning an IPO. Given that this will be ity/ex026.webp\" style=\"max-width:min(100%,504px)\" alt=\"Exhibit\"><p>Hayes believes Envision is well positioned to survive and grow for the foreseeable future based on this analysis. She asks Reed which measure of value would be the most suitable basis for their investment recommendation once the company begins trading on the secondary market.<\/p><p>Reed is more concerned about how Envision will compare with its peers once it is priced. Some of Reed&#x27;s clients are asking about whether Envision is likely to be overpriced, fairly priced, or underpriced. Reed asks Hayes to pull together relevant data on Envision and its publicly traded peers with identical investment characteristics, shown in Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex027.webp\" style=\"max-width:min(100%,452px)\" alt=\"Exhibit\"><p>Hayes questions whether a relative valuation is the best way to model Envision. Regarding model selection, she suggests that the valuation models be consistent with:<\/p><p>Factor 1: the analyst&#x27;s purpose of the valuation.<\/p><p>Factor 2: the models used for the company&#x27;s competitors.<\/p><p>Factor 3: the way other analysts are modeling the company for comparison.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding model selection, which of the factors is most appropriate for Hayes to consider?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q070.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":71,"q":"Based on Exhibit 1, Trottier's justified trailing P/E multiple is closest to:","opts":["10.0","10.8","13.2"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a071.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a071.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 71–76 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Nathan Lavigne works as a senior analyst for a brokerage firm. His supervisor, Agathe Castillon, asks him to update the research report of Trottier Auto Parts, Vertou Retailers, and Chaumont Chemical Industries as of January 1, 20X5, using valuations based on price multiples.<\/p><p>Lavigne gathers information about Trottier and the auto parts industry, summarized in Exhibit 1, and calculates the company&#x27;s justified trailing P/E ratio. He assumes a constant growth rate for dividends and earnings, resulting in a constant dividend payout ratio.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex028.webp\" style=\"max-width:min(100%,432px)\" alt=\"Exhibit\"><p>Castillon asks Lavigne about the assumptions underpinning his estimates. She wants to understand how isolated changes in the model&#x27;s fundamental factors will affect estimates of the trailing P/E and other price multiples, such as price-to-book value. She asks specifically about the effects of changes in the required rate of return and the earnings growth rate. She also asks Lavigne to use the forward P/E-to-growth (PEG) ratio to evaluate whether Trottier&#x27;s stock is undervalued or overvalued relative to the auto parts industry.<\/p><p>Castillon then turns her attention to Vertou Group. Lavigne explains that he projected earnings for three years and gathered the following information and estimates:<\/p><p>Vertou&#x27;s required rate of return = 11%<\/p><p>Vertou&#x27;s expected earnings for Year 3 (E3) = €10.00<\/p><p>Retail industry average dividend payout ratio = 40% Retail industry average ROE = 13%<\/p><p>Retail industry average trailing P/E = 11.0<\/p><p>Castillon asks Lavigne to estimate Vertou&#x27;s terminal value at the end of Year 3 based on comparables and based on fundamentals, using the Gordon growth model.<\/p><p>Lavigne switches his focus to Chaumont Chemical and informs Castillon that the company&#x27;s:<\/p><p>Current stock price is €57.00<\/p><p>20X4 EPS was €5.00<\/p><p>20X5 EPS is estimated to be €6.00<\/p><p>In addition, Lavigne has estimated the forward P/E multiples of Chaumont&#x27;s competitors in the chemical industry, summarized in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex029.webp\" style=\"max-width:min(100%,372px)\" alt=\"Exhibit\"><p>Lavigne believes that Peer 2&#x27;s forward P/E may be abnormally high and asks Castillon to compare Chaumont&#x27;s multiple with the harmonic mean of the peer group&#x27;s multiples.<\/p><p>Castillon wants to expand the comparison to include competitors from other countries, including the United States. Lavigne warns Castillon that cross-border valuation comparisons may show significant differences and makes the following observations:<\/p><p><b>Observation 1:<\/b> Studies show that companies typically report lower ROE under IFRS than they would have reported under US GAAP.<\/p><p><b>Observation 2:<\/b> Goodwill and pension are among the most relevant categories of reconciliation between IFRS and US GAAP.<\/p><p>Observation 3:Multiples based on cash flow are typically more affected by accounting differences than multiples based on EBITDA and book value.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, Trottier&#x27;s justified trailing P/E multiple is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q071.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":72,"q":"All else equal, with regard to the constant dividend growth model, an increase in Trottier's earnings growth rate will result in a decrease in which of the following multiples?","opts":["Dividend yield","Price-to-earnings","Price-to-cash flow"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a072.webp\" target=\"_blank\" rel=\"no 0<\/p><p>Castillon asks Lavigne to estimate Vertou&#x27;s terminal value at the end of Year 3 based on comparables and based on fundamentals, using the Gordon growth model.<\/p><p>Lavigne switches his focus to Chaumont Chemical and informs Castillon that the company&#x27;s:<\/p><p>Current stock price is €57.00<\/p><p>20X4 EPS was €5.00<\/p><p>20X5 EPS is estimated to be €6.00<\/p><p>In addition, Lavigne has estimated the forward P/E multiples of Chaumont&#x27;s competitors in the chemical industry, summarized in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex029.webp\" style=\"max-width:min(100%,372px)\" alt=\"Exhibit\"><p>Lavigne believes that Peer 2&#x27;s forward P/E may be abnormally high and asks Castillon to compare Chaumont&#x27;s multiple with the harmonic mean of the peer group&#x27;s multiples.<\/p><p>Castillon wants to expand the comparison to include competitors from other countries, including the United States. Lavigne warns Castillon that cross-border valuation comparisons may show significant differences and makes the following observations:<\/p><p><b>Observation 1:<\/b> Studies show that companies typically report lower ROE under IFRS than they would have reported under US GAAP.<\/p><p><b>Observation 2:<\/b> Goodwill and pension are among the most relevant categories of reconciliation between IFRS and US GAAP.<\/p><p>Observation 3:Multiples based on cash flow are typically more affected by accounting differences than multiples based on EBITDA and book value.<\/p><\/div><\/details><div class=\"qtext\"><p>All else equal, with regard to the constant dividend growth model, an increase in Trottier&#x27;s earnings growth rate will result in a decrease in which of the following multiples?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q072.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":73,"q":"Based on the information in Exhibit 1 and on the f lowing information and estimates:<\/p><p>Vertou&#x27;s required rate of return = 11%<\/p><p>Vertou&#x27;s expected earnings for Year 3 (E3) = €10.00<\/p><p>Retail industry average dividend payout ratio = 40% Retail industry average ROE = 13%<\/p><p>Retail industry average trailing P/E = 11.0<\/p><p>Castillon asks Lavigne to estimate Vertou&#x27;s terminal value at the end of Year 3 based on comparables and based on fundamentals, using the Gordon growth model.<\/p><p>Lavigne switches his focus to Chaumont Chemical and informs Castillon that the company&#x27;s:<\/p><p>Current stock price is €57.00<\/p><p>20X4 EPS was €5.00<\/p><p>20X5 EPS is estimated to be €6.00<\/p><p>In addition, Lavigne has estimated the forward P/E multiples of Chaumont&#x27;s competitors in the chemical industry, summarized in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex029.webp\" style=\"max-width:min(100%,372px)\" alt=\"Exhibit\"><p>Lavigne believes that Peer 2&#x27;s forward P/E may be abnormally high and asks Castillon to compare Chaumont&#x27;s multiple with the harmonic mean of the peer group&#x27;s multiples.<\/p><p>Castillon wants to expand the comparison to include competitors from other countries, including the United States. Lavigne warns Castillon that cross-border valuation comparisons may show significant differences and makes the following observations:<\/p><p><b>Observation 1:<\/b> Studies show that companies typically report lower ROE under IFRS than they would have reported under US GAAP.<\/p><p><b>Observation 2:<\/b> Goodwill and pension are among the most relevant categories of reconciliation between IFRS and US GAAP.<\/p><p>Observation 3:Multiples based on cash flow are typically more affected by accounting differences than multiples based on EBITDA and book value.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the information in Exhibit 1 and on the forward P/E-to-growth (PEG) ratio, the most appropriate conclusion is that Trottier&#x p><p><b>Observation 2:<\/b> Goodwill and pension are among the most relevant categories of reconciliation between IFRS and US GAAP.<\/p><p>Observation 3:Multiples based on cash flow are typically more affected by accounting differences than multiples based on EBITDA and book value.<\/p><\/div><\/details><div class=\"qtext\"><p>Compared with the harmonic mean of the peer group&#x27;s forward P/Es from Exhibit 2, Chaumont&#x27;s common stock is currently:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q075.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":76,"q":"Which of the following observations is correct?","opts":["Observation 1","Observation 2","Observation 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a076.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a076.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 71–76 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Nathan Lavigne works as a senior analyst for a brokerage firm. His supervisor, Agathe Castillon, asks him to update the research report of Trottier Auto Parts, Vertou Retailers, and Chaumont Chemical Industries as of January 1, 20X5, using valuations based on price multiples.<\/p><p>Lavigne gathers information about Trottier and the auto parts industry, summarized in Exhibit 1, and calculates the company&#x27;s justified trailing P/E ratio. He assumes a constant growth rate for dividends and earnings, resulting in a constant dividend payout ratio.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex028.webp\" style=\"max-width:min(100%,432px)\" alt=\"Exhibit\"><p>Castillon asks Lavigne about the assumptions underpinning his estimates. Sh \/p><p><b>Observation 1:<\/b> Studies show that companies typically report lower ROE under IFRS than they would have reported under US GAAP.<\/p><p><b>Observation 2:<\/b> Goodwill and pension are among the most relevant categories of reconciliation between IFRS and US GAAP.<\/p><p>Observation 3:Multiples based on cash flow are typically more affected by accounting differences than multiples based on EBITDA and book value.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following observations is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q076.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":77,"q":"Which of Ikram's considerations regarding private firm valuation is (are) correct?","opts":["Consideration 1 only","Consideration 2 only","Both Consideration 1 and Consideration 2"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a077.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a077.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 77–82 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Davish Ikram is an associate in the acquisitions department at Stark, Inc., a publicly listed steel producer. Ikram and Kyung Sonam, an intern at the company, are discussing private firm valuation. Ikram advises Sonam to consider the following:<\/p><p><b>Consideration 1:<\/b> Private firms&#x27; management teams tend to have a controlling stake in the firm. Therefore, agency issues are less likely to arise in private firms than in public companies.<\/p><p><b>Consideration 2:<\/b> Private firms are usually smaller than public firms within the same line of business. Thus, management teams in private firms generally provide better oversight and more management depth compared with those in public firms.<\/p><p>Ikram analyzes potential investment opportunities in two private firms: Firm X and Firm Y.<\/p><p>Firm X is a lumber mill with a significant operating history. It is expected to receive a purchase offer from a publicly listed competitor in the same industry. Ikram anticipates that the deal will not go through due to antitrust laws and is considering recommending that Stark&#x27;s management make an offer to acquire Firm X. Ikram asks Sonam to value Firm X using the market approach.<\/p><p>Sonam notes that information is not available on private market transactions of Firm X&#x27;s shares. She presents available data in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex030.webp\" style=\"max-width:min(100%,474px)\" alt=\"Exhibit\"><p>Ikram asks Sonam to compare the firm&#x27;s operating expenses with those of publicly listed firms. Sonam states that operating cost synergies from closing redundant facilities are expected to amount to CAD 400,000 annually. In addition, some of Firm X&#x27;s offices are being used by shareholders for noncore activities, resulting in additional rent expense of CAD 70,000 each year. Sonam also notes that the annual compensation of the firm&#x27;s management is CAD 5 million, 30% above market average, and that management will most likely reject an offer to sell.<\/p><p>Ikram states that Stark would then make a purchase offer to Firm Y, which is expected to grow at a stable rate. Sonam gathers information on Firm Y, based on the current year, in<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex031.webp\" style=\"max-width:min(100%,556px)\" alt=\"Exhibit\"><p>Exhibit 2:<\/p><p>Ikram then asks about the method used to estimate the required return on equity. Sonam states that the expanded CAPM and the build-up approach incorporate company-specific risks and therefore provide a better estimate of required return than CAPM. She then comments:<\/p><p><b>Comment 1:<\/b> The build-up approach is more appropriate to use than the expanded CAPM when guideline public companies are not available.<\/p><p><b>Comment 2:<\/b> The build-up approach considers the sensitivity of company-specific factors to the different risk premiums.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Ikram&#x27;s considerations regarding private firm valuation is (are) correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q077.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":78,"q":"The market approach that is most appropriate for the valuation of Firm X is the:","opts":["prior transaction method.","guideline transactions method.","guideline public company method."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a078.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a078.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 77–82 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Davish Ikram is an associate in the acquisitions department at Stark, Inc., a publicly listed steel producer. Ikram and Kyung Sonam, an intern at the company, are discussing private firm valuation. Ikram advises Sonam to consider the following:<\/p><p><b>Consideration 1:<\/b> Private firms&#x27; management teams tend to have a controlling stake in the firm. Therefore, agency issues are less likely to arise in private firms than in public companies.<\/p><p><b>Consideration 2:<\/b> Private firms are usually smaller than public firms within the same line of business. Thus, management teams in private firms generally provide better oversight and more management depth compared with those in public firms.<\/p><p>Ikram analyzes an the expanded CAPM when guideline public companies are not available.<\/p><p><b>Comment 2:<\/b> The build-up approach considers the sensitivity of company-specific factors to the different risk premiums.<\/p><\/div><\/details><div class=\"qtext\"><p>The market approach that is most appropriate for the valuation of Firm X is the:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q078.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":79,"q":"Using Exhibit 1, the acquisition value (in CAD millions) to the strategic buyer is closest to:","opts":["150","153","156"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a079.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a079.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 77–82 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Davish Ikram is an associate in the acquisitions department at Stark, Inc., a publicly listed steel producer. Ikram and Kyung Sonam, an intern at the company, are discussing private firm valuation. Ikram advises Sonam to consider the following:<\/p><p><b>Consideration 1:<\/b> Private firms&#x27; management teams tend to have a controlling stake in the firm. Therefore, agency issues are less likely to arise in private firms than in public companies.<\/p><p><b>Consideration 2:<\/b> Private firms are usually smaller than public firms within the same line of business. Thus, management teams in private firms generally provide better oversight and more management depth compared with those in public firms.<\/p><p>Ikram analyzes potential investment opportunities in two private firms: Firm X and Firm Y.<\/p><p>Firm X is a lumber mill with a significant operating history. It is expected to receive a purchase offer from a publicly listed competitor in the same industry. Ikram anticipates that the deal will not go through due to antitrust laws and is considering recommending that Stark&#x27;s management make an offer to acquire Firm X. Ikram asks Sonam to value Firm X using the market approach.<\/p><p>Sonam notes that information is not available on private market transactions of Firm X&#x27;s shares. She presents available data in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex030.webp\" style=\"max-width:min(100%,474px)\" alt=\"Exhibit\"><p>Ikram asks Sonam to compare the firm&#x27;s operating expenses with those of publicly listed firms. Sonam states that operating cost synergies from closing redundant facilities are expected to amount to CAD 400,000 annually. In addition, some of Firm X&#x27;s offices are being used by shareholders for noncore activities, resulting in additional rent expense of CAD 70,000 each year. Sonam also notes that the annual compensation of the firm&#x27;s management is CAD 5 million, 30% above market average, and that management will most likely reject an offer to sell.<\/p><p>Ikram states that Stark would then make a purchase offer to Firm Y, which is expected to grow at a stable rate. Sonam gathers information on Firm Y, based on the current year, in<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex031.webp\" style=\"max-width:min(100%,556px)\" alt=\"Exhibit\"><p>Exhibit 2:<\/p><p>Ikram then asks about the method used to estimate the required return on equity. Sonam states that the expanded CAPM and the build-up approach incorporate company-specific risks and therefore provide a better estimate of required return than CAPM. She then comments:<\/p><p><b>Comment 1:<\/b> The build-up approach is more appropriate to use than the expanded CAPM when guideline public companies are not available.<\/p><p><b>Comment 2:<\/b> The build-up approach considers the sensitivity of company-specific factors to the different risk premiums.<\/p><\/div><\/details><div class=\"qtext\"><p>Using Exhibit 1, the acquisition value (in CAD millions) to the strategic buyer is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q079.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":80,"q":"Based on Exhibit 2 and assuming there are no cost or revenue synergies, the equity value of Firm Y (in CAD millions) to Stark, Inc. is closest to:","opts":["106.86","111.42","115.63"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a080.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a080.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 77–82 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Davish Ikram is an associate in the acquisitions department at Stark, Inc., a publicly listed steel producer. Ikram and Kyung Sonam, an intern at the company, are discussing private firm valuation. Ikram advises Sonam to consider the following:<\/p><p><b>Consideration 1:<\/b> Private firms&#x27; management teams tend to have a controlling stake in the firm. Therefore, agency issues are less likely to arise in private firms than in public companies.<\/p><p><b>Consideration 2:<\/b> Private firms are usually smaller than public firms within the same line of business. Thus, management teams in private firms generally provide better oversight and more management depth compared with those in public firms.<\/p><p>Ikram analyzes potential investment opportunities in two private firms: Firm X and Firm Y.<\/p><p>Firm X is a lumber mill with a significant operating history. It is expected to receive a purchase offer from a publicly listed competitor in the same industry. Ikram anticipates that the deal will not go through due to antitrust laws and is considering recommending that Stark&#x27;s management make an offer to acquire Firm X. Ikram asks Sonam to value Firm X using the market approach.<\/p><p>Sonam notes that information is not available on private market transactions of Firm X&#x27;s shares. She presents available data in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex030.webp\" style=\"max-width:min(100%,474px)\" alt=\"Exhibit\"><p>Ikram asks Sonam to compare the firm&#x27;s operating expenses with those of publicly listed firms. Sonam states that operating cost synergies from closing redundant facilities are expected to amount to CAD 400,000 annually. In addition, some of Firm X&#x27;s offices are being used by shareholders for noncore activities, resulting in additional rent expense of CAD 70,000 each year. Sonam also notes that the annual compensation of the firm&#x27;s management is CAD 5 million, 30% above market average, and that management will most likely reject an offer to sell.<\/p><p>Ikram states that Stark would then make a purchase offer to Firm Y, which is expected to grow at a stable rate. Sonam gathers information on Firm Y, based on the current year, in<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex031.webp\" style=\"max-width:min(100%,556px)\" alt=\"Exhibit\"><p>Exhibit 2:<\/p><p>Ikram then asks about the method used to estimate the required return on equity. Sonam states that the expanded CAPM and the build-up approach incorporate company-specific risks and therefore provide a better estimate of required return than CAPM. She then comments:<\/p><p><b>Comment 1:<\/b> The build-up approach is more appropriate to use than the expanded CAPM when guideline public companies are not available.<\/p><p><b>Comment 2:<\/b> The build-up approach considers the sensitivity of company-specific factors to the different risk premiums.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2 and assuming there are no cost or revenue synergies, the equity value of Firm Y (in CAD millions) to Stark, Inc. is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q080.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":81,"q":"Based on Exhibit 2, if Firm Y rejects a full sale and continues to operate as a private firm, then the value of a 15% interest in Firm Y (in CAD millions), using the income approach, is closest to:","opts":["11.67","13.30","16.03"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a081.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a081.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 77–82 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Davish Ikram is an associate in the acquisitions department at Stark, Inc., a publicly listed steel producer. Ikram and Kyung Sonam, an intern at the company, are discussing private firm valuation. Ikram advises Sonam to consider the following:<\/p><p><b>Consideration 1:<\/b> Private firms&#x27; management teams tend to have a controlling stake in the firm. Therefore, agency issues are less likely to arise in private firms than in public companies.<\/p><p><b>Consideration 2:<\/b> Private firms are usually smaller than public firms within the same line of business. Thus, management teams in private firms generally provide better oversight and more management depth compared with those in public firms.<\/p><p>Ikram analyzes potential investment opportunities in two private firms: Firm X and Firm Y.<\/p><p>Firm X is a lumber mill with a significant operating history. It is expected to receive a purchase offer from a publicly listed competitor in the same industry. Ikram anticipates that the deal will not go through due to antitrust laws and is considering recommending that Stark&#x27;s management make an offer to acquire Firm X. Ikram asks Sonam to value Firm X using the market approach.<\/p><p>Sonam notes that information is not available on private market transactions of Firm X&#x27;s shares. She presents available data in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex030.webp\" style=\"max-width:min(100%,474px)\" alt=\"Exhibit\"><p>Ikram asks Sonam to compare the firm&#x27;s operating expenses with those of publicly listed firms. Sonam states that operating cost synergies from closing redundant facilities are expected to amount to CAD 400,000 annually. In addition, some of Firm X&#x27;s offices are being used by shareholders for noncore activities, resulting in additional rent expense of CAD 70,000 each year. Sonam also notes that the annual compensation of the firm&#x27;s management is CAD 5 million, 30% above market average, and that management will most likely reject an offer to sell.<\/p><p>Ikram states that Stark would then make a purchase offer to Firm Y, which is expected to grow at a stable rate. Sonam gathers information on Firm Y, based on the current year, in<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex031.webp\" style=\"max-width:min(100%,556px)\" alt=\"Exhibit\"><p>Exhibit 2:<\/p><p>Ikram then asks about the method used to estimate the required return on equity. Sonam states that the expanded CAPM and the build-up approach incorporate company-specific risks and therefore provide a better estimate of required return than CAPM. She then comments:<\/p><p><b>Comment 1:<\/b> The build-up approach is more appropriate to use than the expanded CAPM when guideline public companies are not available.<\/p><p><b>Comment 2:<\/b> The build-up approach considers the sensitivity of company-specific factors to the different risk premiums.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2, if Firm Y rejects a full sale and continues to operate as a private firm, then the value of a 15% interest in Firm Y (in CAD millions), using the income approach, is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q081.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":82,"q":"Which of Sonam's comments on the estimation of the required return on equity is(are) correct?","opts":["Comment 1 only","Comment 2 only","Both Comment 1 and Comment 2"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a082.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a082.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 77–82 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Davish Ikram is an associate in the acquisitions department at Stark, Inc., a publicly listed steel producer. Ikram and Kyung Sonam, an intern at the company, are discussing private firm valuation. Ikram advises Sonam to consider the following:<\/p><p><b>Consideration 1:<\/b> Private firms&#x27; management teams tend to have a controlling stake in the firm. Therefore, agency issues are less likely to arise in private firms than in public companies.<\/p><p><b>Consideration 2:<\/b> Private firms are usually smaller than public firms within the same line of business. Thus, management teams in private firms generally provide better oversight and more management depth compared with those in public firms.<\/p><p>Ikram analyzes potential investment opportunities in two private firms: Firm X and Firm Y.<\/p><p>Firm X is a lumber mill with a significant operating history. It is expected to receive a purchase offer from a publicly listed competitor in the same industry. Ikram anticipates that the deal will not go through due to antitrust laws and is considering recommending that Stark&#x27;s management make an offer to acquire Firm X. Ikram asks Sonam to value Firm X using the market approach.<\/p><p>Sonam notes that information is not available on private market transactions of Firm X&#x27;s shares. She presents available data in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex030.webp\" style=\"max-width:min(100%,474px)\" alt=\"Exhibit\"><p>Ikram asks Sonam to compare the firm&#x27;s operating expenses with those of publicly listed firms. Sonam states that operating cost synergies from closing redundant facilities are expected to amount to CAD 400,000 annually. In addition, some of Firm X&#x27;s offices are being used by shareholders for noncore activities, resulting in additional rent expense of CAD 70,000 each year. Sonam also notes that the annual compensation of the firm&#x27;s management is CAD 5 million, 30% above market average, and that management will most likely reject an offer to sell.<\/p><p>Ikram states that Stark would then make a purchase offer to Firm Y, which is expected to grow at a stable rate. Sonam gathers information on Firm Y, based on the current year, in<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex031.webp\" style=\"max-width:min(100%,556px)\" alt=\"Exhibit\"><p>Exhibit 2:<\/p><p>Ikram then asks about the method used to estimate the required return on equity. Sonam states that the expanded CAPM and the build-up approach incorporate company-specific risks and therefore provide a better estimate of required return than CAPM. She then comments:<\/p><p><b>Comment 1:<\/b> The build-up approach is more appropriate to use than the expanded CAPM when guideline public companies are not available.<\/p><p><b>Comment 2:<\/b> The build-up approach considers the sensitivity of company-specific factors to the different risk premiums.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Sonam&#x27;s comments on the estimation of the required return on equity is(are) correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q082.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":83,"q":"Assuming that Hagino uses consistent assumptions, which model would be most appropriate to estimate Haiku's intrinsic value?","opts":["The residual income model","The dividend discount model","Both models are equally appropriate"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a083.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a083.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 83–86 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Kaito Fujino, a senior analyst covering the apparel industry, asks Nori Hagino, an associate analyst, to value several companies. The first company, Haiku Apparel, is a mature company that distributes most of its earnings as dividends. Its dividend growth has been constant for a considerable period of time, and Hagino expects this to continue. Fujino suggests modeling Haiku using either the dividend discount model or residual income model. Hagino collects information on Haiku&#x27;s fundamentals in Exhibit 1 and uses the single-stage residual income model. Haiku&#x27;s market price is ¥3,600 per common share.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex032.webp\" style=\"max-width:min(100%,371px)\" alt=\"Exhibit\"><p>Fujino asks what assumptions Hagino used for estimating continuing residual income. Hagino replies that he added a persistence factor to the model to account for a decline in ROE over time. He adds:<\/p><p><b>Comment 1:<\/b> The persistence factor accounts for how quickly a company&#x27;s ROE will revert to its long-term growth rate.<\/p><p><b>Comment 2:<\/b> Increasing the persistence factor results in a slower decay of residual income and higher overall valuation.<\/p><p><b>Comment 3:<\/b> Extreme levels of accounting accruals and a low dividend payout are characteristics of greater residual income persistence.<\/p><p>Fujino then asks Hagino to review Himalayan Outfitters, a foreign retailer that has expanded into Japan. Himalayan is trading at a P/B ratio of 2.0x, a premium to peers. Fujino calculates Himalayan&#x27;s ROE at 10% and required rate of return at 7%.<\/p><\/div><\/details><div class=\"qtext\"><p>Assuming that Hagino uses consistent assumptions, which model would be most appropriate to estimate Haiku&#x27;s intrinsic value?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q083.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":84,"q":"Based on Exhibit 1 and using the single-stage residual income model, Haiku's stock is most appropriately considered:","opts":["undervalued.","fairly valued.","overvalued."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a084.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a084.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 83–86 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Kaito Fujino, a senior analyst covering the apparel industry, asks Nori Hagino, an associate analyst, to value several companies. The first company, Haiku Apparel, is a mature company that distributes most of its earnings as dividends. Its dividend growth has been constant for a considerable period of time, and Hagino expects this to continue. Fujino suggests modeling Haiku using either the dividend discount model or residual income model. Hagino collects information on Haiku&#x27;s fundamentals in Exhibit 1 and uses the single-stage residual income model. Haiku&#x27;s market price is ¥3,600 per common share.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex032.webp\" style=\"max-width:min(100%,371px)\" alt=\"Exhibit\"><p>Fujino asks what assumptions Hagino used for estimating continuing residual income. Hagino replies that he added a persistence factor to the model to account for a decline in ROE over time. He adds:<\/p><p><b>Comment 1:<\/b> The persistence factor accounts for how quickly a company&#x27;s ROE will revert to its long-term growth rate.<\/p><p><b>Comment 2:<\/b> Increasing the persistence factor results in a slower decay of residual income and higher overall valuation.<\/p><p><b>Comment 3:<\/b> Extreme levels of accounting accruals and a low dividend payout are characteristics of greater residual income persistence.<\/p><p>Fujino then asks Hagino to review Himalayan Outfitters, a foreign retailer that has expanded into Japan. Himalayan is trading at a P/B ratio of 2.0x, a premium to peers. Fujino calculates Himalayan&#x27;s ROE at 10% and required rate of return at 7%.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and using the single-stage residual income model, Haiku&#x27;s stock is most appropriately considered:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q084.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":85,"q":"Which of Hagino's comments about the persistence factor is correct?","opts":["Comment 1","Comment 2","Comment 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a085.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh l tor results in a slower decay of residual income and higher overall valuation.<\/p><p><b>Comment 3:<\/b> Extreme levels of accounting accruals and a low dividend payout are characteristics of greater residual income persistence.<\/p><p>Fujino then asks Hagino to review Himalayan Outfitters, a foreign retailer that has expanded into Japan. Himalayan is trading at a P/B ratio of 2.0x, a premium to peers. Fujino calculates Himalayan&#x27;s ROE at 10% and required rate of return at 7%.<\/p><\/div><\/details><div class=\"qtext\"><p>Given the other metrics provided, Himalayan&#x27;s implied constant growth rate is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q086.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":87,"q":"Based on Exhibit 1, Giraffe's required return on equity (%) using the expanded CAPM model is closest to:","opts":["16.0","17.4","18.0"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a087.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a087.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 87–92 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Heinrich Schultz is CFO of C-Store Corp., a private regional convenience store chain. Schultz is evaluating C-Store&#x27;s potential minority investment in or complete acquisition of Giraffe Fuel Distribution Inc. Schultz begins valuation work on Giraffe by determining an appropriate discount rate and gathers the following information.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex033.webp\" style=\"max-width:min(100%,449px)\" alt=\"Exhibit\"><p>Using the most recently reported financial data, Schultz estimates the WACC, a long-term growth rate, and normalized FCFF.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex034.webp\" style=\"max-width:min(100%,420px)\" alt=\"Exhibit\"><p>Giraffe&#x27;s core business is very stable and predictable, while a Giraffe subsidiary, Calf Tanker Trucks, has a history of volatile growth of free cash flow. Calf has acquired numerous small trucking firms over the past several years and carries a significant amount of intangible assets on its balance sheet.<\/p><p>Emma Hoffman, a financial analyst at C-Store, is assisting Schultz in his analysis. Hoffman prepares the following information on Calf.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex035.webp\" style=\"max-width:min(100%,477px)\" alt=\"Exhibit\"><p>Schultz reviews the information and states that to complete his excess earnings model analysis for Calf, he needs to know Hoffman&#x27;s required return estimates for:<\/p><p>Item 1: Working capital<\/p><p>Item 2: Fixed assets<\/p><p>Item 3: Intangible assets<\/p><p>Using the guideline transactions method, Hoffman then estimates the value of equity in the event C-Store takes a minority equity interest in Giraffe. She uses the following estimates:<\/p><p>Value of equity = $150 million<\/p><p>Minority equity ownership stake = 10%<\/p><p>Control premium = 15%<\/p><p>Discount for lack of marketability = 20%<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, Giraffe&#x27;s required return on equity (%) using the expanded CAPM model is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q087.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":88,"q":"Based on Exhibit 1, Giraffe's required return on equity (%) using the build-up method is closest to:","opts":["17.0","18.0","19.8"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a088.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\ ths. She states that the model can calculate the growth rate or required rate of return priced into a stock or index.<\/p><p>Collins plans to use the Gordon growth model to estimate Kosciuszko&#x27;s P/E ratio and compare Kosciuszko with its peers based on this valuation. She provides data on Kosciuszko, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex036.webp\" style=\"max-width:min(100%,510px)\" alt=\"Exhibit\"><p>Reid wishes to use a dividend discount model to value High Tide Bank (HTB), but he believes HTB&#x27;s dividend is growing faster than its sustainable level. He asks Collins for her opinion and provides the following data:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex037.webp\" style=\"max-width:min(100%,388px)\" alt=\"Exhibit\"><p>Collins believes HTB is in a period of above-average dividend growth and that this growth will slow as follows:<\/p><p>Dividends will grow at 10% in 20X6, 20X7, and 20X8.<\/p><p>Dividends will then transition to a long-term growth rate over a 10-year period.<\/p><p>Dividends will grow at 3% in the long term.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Collins&#x27;s reasons for using the Gordon growth model to value Kosciuszko&#x27;s stock is most appropriate?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q093.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":94,"q":"Regarding the Gordon growth model's strengths and limitations, which investors) is(are) correct?","opts":["Only Reid","Only Collins","Both Reid and Collins"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a094.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a094.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Cas er an IPO or outright sale.<\/p><p>Tamika Williams is an investment banking analyst at a sell-side firm that has been approached by Zebra. Williams is conducting an initial valuation due diligence for a possible IPO of Zebra. Two companies have expressed an interest in buying Zebra outright: Strategic Buyer Inc., a competing window and door manufacturer, and Financial Buyer Corp., a private equity firm.<\/p><p>Williams&#x27;s forecasted financial information for 20X1 is presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex038.webp\" style=\"max-width:min(100%,484px)\" alt=\"Exhibit\"><p>In addition, for 20X1, Williams forecasts the following:<\/p><p>15% cost of equity<\/p><p>£500,000 increase in capital expenditures (from reported 20X0 capex)<\/p><p>£50,000 in additional working capital<\/p><p>Williams has been unable to identify any comparable guideline public companies and is concerned the company may be too small for a successful IPO. Given the circumstances surrounding Zebra, Williams believes the capitalized cash flow method (CCM) will provide a good starting point for her initial IPO valuation assessment, although this approach is not typical.<\/p><p>Williams has also done some preliminary analysis for the contingency that Zebra may be acquired by Financial Buyer in a private transaction. The resulting forecast is presented in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex039.webp\" style=\"max-width:min(100%,540px)\" alt=\"Exhibit\"><p>Zebra recently raised equity capital in a private placement, selling a 5% stake that valued the entire firm at £24 million, or 6x market value of invested capital (MVIC)-to-EBITDA. Recent acquisitions by nonstrategic buyers of comparable private companies in the same industry have occurred at 8x MVIC-to-EBITDA.<\/p><\/div><\/details><div class=\"qtext\"><p>Which approach to selling the business is most likely to bring the greatest valuation for Zebra?<\/p><\/div> lic companies and is concerned the company may be too small for a successful IPO. Given the circumstances surrounding Zebra, Williams believes the capitalized cash flow method (CCM) will provide a good starting point for her initial IPO valuation assessment, although this approach is not typical.<\/p><p>Williams has also done some preliminary analysis for the contingency that Zebra may be acquired by Financial Buyer in a private transaction. The resulting forecast is presented in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex039.webp\" style=\"max-width:min(100%,540px)\" alt=\"Exhibit\"><p>Zebra recently raised equity capital in a private placement, selling a 5% stake that valued the entire firm at £24 million, or 6x market value of invested capital (MVIC)-to-EBITDA. Recent acquisitions by nonstrategic buyers of comparable private companies in the same industry have occurred at 8x MVIC-to-EBITDA.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following private company valuation approaches are most appropriate for Zebra?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q100.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":101,"q":"Based on the information provided and Exhibit 1, if Zebra has no debt outstanding, Zebra's value (in £ millions) using the capitalized cash flow method (CCM) is closest to:","opts":["14.59","23.18","29.61"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a101.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a101.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 99–104 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Zebra Windows and Doors is a family-r urer, and Financial Buyer Corp., a private equity firm.<\/p><p>Williams&#x27;s forecasted financial information for 20X1 is presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex038.webp\" style=\"max-width:min(100%,484px)\" alt=\"Exhibit\"><p>In addition, for 20X1, Williams forecasts the following:<\/p><p>15% cost of equity<\/p><p>£500,000 increase in capital expenditures (from reported 20X0 capex)<\/p><p>£50,000 in additional working capital<\/p><p>Williams has been unable to identify any comparable guideline public companies and is concerned the company may be too small for a successful IPO. Given the circumstances surrounding Zebra, Williams believes the capitalized cash flow method (CCM) will provide a good starting point for her initial IPO valuation assessment, although this approach is not typical.<\/p><p>Williams has also done some preliminary analysis for the contingency that Zebra may be acquired by Financial Buyer in a private transaction. The resulting forecast is presented in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex039.webp\" style=\"max-width:min(100%,540px)\" alt=\"Exhibit\"><p>Zebra recently raised equity capital in a private placement, selling a 5% stake that valued the entire firm at £24 million, or 6x market value of invested capital (MVIC)-to-EBITDA. Recent acquisitions by nonstrategic buyers of comparable private companies in the same industry have occurred at 8x MVIC-to-EBITDA.<\/p><\/div><\/details><div class=\"qtext\"><p>The estimate for Zebra&#x27;s required cost of equity is most appropriately based on the:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q104.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":105,"q":"Which of Howard's methods concerning FCF forecasting is (are) appropriate?","opts":["Only Method 1","Both Method 1 and Method 2","Neither Method 1 nor Method 2"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a105.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a105.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 105–110 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Ellis Howard is a junior equity analyst for a university endowment fund. The fund&#x27;s policy for evaluating equity investments is to use free cash flow to the firm (FCFF) and free cash flow to equity (FCFE) to estimate a company&#x27;s intrinsic value. Howard&#x27;s supervisor asks about her methods for forecasting FCFF and FCFE from a company&#x27;s reported net income. Howard replies:<\/p><p><b>Method 1:<\/b> When determining changes in working capital, I do not include short-term notes payable as part of current liabilities.<\/p><p><b>Method 2:<\/b> When using net income to derive FCFF or FCFE, I do not normally add back deferred tax liabilities to net income.<\/p><p>Howard is asked to evaluate Horizon ElectroCar as a potential investment. The company&#x27;s selected financial information is shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex040.webp\" style=\"max-width:min(100%,504px)\" alt=\"Exhibit\"><p>The notes to the company&#x27;s financial statements disclose the following information:<\/p><p>The tax rate is 40%.<\/p><p>In 20X1, Horizon spent SGD 1.0 million to repurchase common equity shares and borrowed SGD 1.3 million.<\/p><p>There are no notes payable, and all debt is long term.<\/p><p>The company classifies interest paid as cash from operations (CFO).<\/p><p>Howard estimated Horizon ElectroCar&#x27;s per-share FCFE for 20X0 to be SGD 2.50. The applicable risk-free interest rate is 2%. Exhibit 2 shows Howard&#x27;s estimates for the ranges of inputs used to value Horizon ElectroCar with a constant-growth FCFE model:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex041.webp\" style=\"max-width:min(100%,527px)\" alt=\"Exhibit\"><p>Howard is also evaluating Innovation Resources, which is located in Chad, where there has been high inflation in recent years. Relevant information concerning Chad and Innovation Resources is shown in Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex042.webp\" style=\"max-width:min(100%,580px)\" alt=\"Exhibit\"><p>Finally, although Howard understands the endowment fund&#x27;s rationale for valuing equity investments based on the company&#x27;s free cash flow (FCF), she believes that other metrics can be adequate substitutes for FCF. She makes the following statements to support her position:<\/p><p><b>Statement 1:<\/b> If a company makes no investment in fixed capital, then EBITDA can be used as a proxy for FCFF.<\/p><p><b>Statement 2:<\/b> CFO is the same as FCFE if the company&#x27;s investment in PPE is equal to its net amount of borrowing.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Howard&#x27;s methods concerning FCF forecasting is (are) appropriate?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q105.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":106,"q":"Based on Exhibit 1 and the notes to the company's financial statements, Horizon ElectroCar's FCFF for 20X1 (SGD thousands) is closest to:","opts":["328","480","928"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a106.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a106.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 105–110 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-bo
