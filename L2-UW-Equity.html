<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

<header>

 Chopin, an analyst and colleague, questions the assumption of zero terminal value for Salt Mine. Chopin proposes that the mine could operate indefinitely and suggests calculating the terminal value as a perpetuity.<\/p><p>Jaworski then reviews the financial statements of Steel Mill and creates the following per-share financial forecasts:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex002.webp\" style=\"max-width:min(100%,524px)\" alt=\"Exhibit\"><p>Jaworski turns her attention to Central Tire and notes that the capital structure is 60% debt and 40% equity and interest expense is tax-deductible. She gathers the following data:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex003.webp\" style=\"max-width:min(100%,468px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Jaworski decides to apply Chopin&#x27;s terminal value suggestion to her residual income model. Based on Exhibit 1, and assuming the present value of residual income over the 20-year forecast horizon is $25, her model shows that Salt Mine is most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q004.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":5,"q":"Based on Exhibit 2, a finite horizon residual income model, and assuming a 10% cost of equity, if the forecasted terminal price for the shares of Steel Mill at the end of Year 3 is $20, the current intrinsic value ($) of Steel Mill is closest to:","opts":["16.43","18.08","18.48"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a005.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a005.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–6 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jonna Jaworski is an equity research analyst at Baltic Investment Partners, a long-only equity manager. She is preparing an equity valuation analysis for three companies: Salt Mine Corp., Steel Mill Inc., and Central Tire. During her preliminary work on these companies, she makes the following observations regarding Salt Mine, a major salt producer in the country.<\/p><p>Observation 1:Last year, Salt Mine reported a relatively large nonrecurring restructuring charge.<\/p><p>Observation 2:Salt Mine has consistently reported significant amounts of other comprehensive income.<\/p><p>Jaworski creates a residual income model for Salt Mine that assumes a 9% cost of equity and a terminal value of zero after 20 years. Salt mine&#x27;s stock price is currently $80, and Jaworski&#x27;s condensed forecast is presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex001.webp\" style=\"max-width:min(100%,610px)\" alt=\"Exhibit\"><p>Jacek Chopin, an analyst and colleague, questions the assumption of zero terminal value for Salt Mine. Chopin proposes that the mine could operate indefinitely and suggests calculating the terminal value as a perpetuity.<\/p><p>Jaworski then reviews the financial statements of Steel Mill and creates the following per-share financial forecasts:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex002.webp\" style=\"max-width:min(100%,524px)\" alt=\"Exhibit\"><p>Jaworski turns her attention to Central Tire and notes that the capital structure is 60% debt and 40% equity and interest expense is tax-deductible. She gathers the following data:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex003.webp\" style=\"max-width:min(100%,468px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2, a finite horizon residual income model, and assuming a 10% cost of equity, if the forecasted terminal price for the shares of Steel Mill at the end of Year 3 is $20, the current intrinsic value ($) of Steel Mill is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q005.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":6,"q":"Based on Exhibit 3, using the WACC and a total capital charge approach, Central Tire's residual income ($ millions) for this period is closest to:","opts":["-4.0","3.2","23.2"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a006.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a006.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–6 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jonna Jaworski is an equity research analyst at Baltic Investment Partners, a long-only equity manager. She is preparing an equity valuation analysis for three companies: Salt Mine Corp., Steel Mill Inc., and Central Tire. During her preliminary work on these companies, she makes the following observations regarding Salt Mine, a major salt producer in the country.<\/p><p>Observation 1:Last year, Salt Mine reported a relatively large nonrecurring restructuring charge.<\/p><p>Observation 2:Salt Mine has consistently reported significant amounts of other comprehensive income.<\/p><p>Jaworski creates a residual income model for Salt Mine that assumes a 9% cost of equity and a terminal value of zero after 20 years. Salt mine&#x27;s stock price is currently $80, and Jaworski&#x27;s condensed forecast is presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex001.webp\" style=\"max-width:min(100%,610px)\" alt=\"Exhibit\"><p>Jacek Chopin, an analyst and colleague, questions the assumption of zero terminal value for Salt Mine. Chopin proposes that the mine could operate indefinitely and suggests calculating the terminal value as a perpetuity.<\/p><p>Jaworski then reviews the financial statements of Steel Mill and creates the following per-share financial forecasts:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex002.webp\" style=\"max-width:min(100%,524px)\" alt=\"Exhibit\"><p>Jaworski turns her attention to Central Tire and notes that the capital structure is 60% debt and 40% equity and interest expense is tax-deductible. She gathers the following data:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex003.webp\" style=\"max-width:min(100%,468px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 3, using the WACC and a total capital charge approach, Central Tire&#x27;s residual income ($ millions) for this period is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q006.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":7,"q":"Which of Vasily's statements is correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a007.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a007.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 7–10 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Vadim Vasiliy is a corporate development analyst at Boleslav JSC, an international conglomerate. Vasiliy has recently identified several acquisition opportunities and asks the firm&#x27;s new junior analyst, Boris Botschenko, to assist him with the valuation process.<\/p><p>Botschenko is unsure of when to use FCFF versus FCFE when valuing companies and seeks guidance from Vasiliy. Vasiliy answers with the following statements:<\/p><p><b>Statement 1:<\/b> Instead of discounting FCFE at the required return on equity to find equity value, one can theoretically derive the same equity value by discounting FCFF at WACC and subtracting the book value of debt and preferred dividends.<\/p><p><b>Statement 2:<\/b> It is more appropriate to use FCFF when a firm has negative FCFE and no debt in its current and target capital structure.<\/p><p><b>Statement 3:<\/b> It is more appropriate to use FCFF when a firm has a volatile capital structure.<\/p><p>Boleslav&#x27;s management is considering acquiring a 90% stake in Agro JSC, an agricultural equipment manufacturer. Agro has historically paid dividends, and will continue to do so in the foreseeable future, at a consistent dividend payout ratio. Vasiliy tells Botschenko that FCFE should be used to value Agro. Botschenko asks why it is more suitable to value Agro using FCFE in place of dividends. Vasiliy responds:<\/p><p><b>Response 1:<\/b> FCFE better aligns to the short-term profitability of the firm.<\/p><p><b>Response 2:<\/b> Use of FCFE implies control and discretion over dividend distribution.<\/p><p><b>Response 3:<\/b> FCFE reflects uses of free cash flow, whereas dividends reflect sources of free cash flow.<\/p><p>Boleslav&#x27;s board believes it can create substantial cross-selling synergies from its existing distribution network by acquiring Freezky JSC, a top home appliance company. Freezky stock is currently trading at RUB 843.28. Botschenko gathers the following data (shown in Exhibit 1) and calculates the intrinsic equity value for Freezky using a one-stage FCFF model:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex004.webp\" style=\"max-width:min(100%,504px)\" alt=\"Exhibit\"><p>Botschenko then develops a sensitivity analysis for another potential investment, Trucksky JSC, a trucking company, based on sales growth, gross margin, and capital expenditures (CAPEX) to gauge how these variables impact his valuation estimate. This analysis is shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex005.webp\" style=\"max-width:min(100%,643px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of Vasily&#x27;s statements is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q007.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":8,"q":"Which of Vasily's responses is correct?","opts":["Response 1","Response 2","Response 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a008.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a008.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 7–10 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Vadim Vasiliy is a corporate development analyst at Boleslav JSC, an international conglomerate. Vasiliy has recently identified several acquisition opportunities and asks the firm&#x27;s new junior analyst, Boris Botschenko, to assist him with the valuation process.<\/p><p>Botschenko is unsure of when to use FCFF versus FCFE when valuing companies and seeks guidance from Vasiliy. Vasiliy answers with the following statements:<\/p><p><b>Statement 1:<\/b> Instead of discounting FCFE at the required return on equity to find equity value, one can theoretically derive the same equity value by discounting FCFF at WACC and subtracting the book value of debt and preferred dividends.<\/p><p><b>Statement 2:<\/b> It is more appropriate to use FCFF when a firm has negative FCFE and no debt in its current and target capital structure.<\/p><p><b>Statement 3:<\/b> It is more appropriate to use FCFF when a firm has a volatile capital structure.<\/p><p>Boleslav&#x27;s ma esponse 2:<\/b> Use of FCFE implies control and discretion over dividend distribution.<\/p><p><b>Response 3:<\/b> FCFE reflects uses of free cash flow, whereas dividends reflect sources of free cash flow.<\/p><p>Boleslav&#x27;s board believes it can create substantial cross-selling synergies from its existing distribution network by acquiring Freezky JSC, a top home appliance company. Freezky stock is currently trading at RUB 843.28. Botschenko gathers the following data (shown in Exhibit 1) and calculates the intrinsic equity value for Freezky using a one-stage FCFF model:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex004.webp\" style=\"max-width:min(100%,504px)\" alt=\"Exhibit\"><p>Botschenko then develops a sensitivity analysis for another potential investment, Trucksky JSC, a trucking company, based on sales growth, gross margin, and capital expenditures (CAPEX) to gauge how these variables impact his valuation estimate. This analysis is shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex005.webp\" style=\"max-width:min(100%,643px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Using a one-stage FCFF model and data from Exhibit 1, Freezky&#x27;s stock is most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q009.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":10,"q":"All else equal, given the sensitivity analysis in Exhibit 2 and based on 31% gross margin and 15% sales growth, the valuation estimate (in RUB billions) is closest to:","opts":["460","490","500"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a010.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a010.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/s d on company-specific characteristics and industry factors.<\/p><\/div><\/details><div class=\"qtext\"><p>If Nguyen uses a multistage residual income model, which company has the lowest residual income persistence at the end of the forecast horizon?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q022.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":23,"q":"Based on Exhibit 1 and Rashid's notes, the amount that Rashid should record as total investment in fixed capital (€ millions) when calculating Velocità's 20X0 FCFF is closest to:","opts":["230","270","290"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a023.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a023.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 23–28 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Hakim Rashid is a credit analyst at an investment management firm. He is evaluating his free cash flow (FCF) forecasts of multiple companies. Rashid first evaluates Velocità Automotive, an Italian car parts manufacturer. Velocità reports under IFRS and has a capital structure that includes common stock, preferred stock, and debt. Rashid compiles information on Velocità&#x27;s 20X0 financials to use as a basis for his forecasts and notes several items that require special attention:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex011.webp\" style=\"max-width:min(100%,498px)\" alt=\"Exhibit\"><p>Rashid notes that Velocità:<\/p><p>purchased an additional €40 million of equipment in exchange for Velocità common stock; this purchase was to replace required operating equipment.<\/p><p>classifies its interest paid and dividends paid as financing cash flows.<\/p><p>will reverse its deferred tax asset in the near future.<\/p><p>will maintain a persistent level of stock-based compensation expense.<\/p><p>Karima Yusuf has developed EPS and FCFE forecasts for EU Telecom and Kamera1 Solutions, and she provides them to Rashid. For EU Telecom, a European wireless telecom carrier, Rashid wishes to convert Yusuf&#x27;s estimates to FCFF to use in his credit analysis. Yusuf&#x27;s 20X1 estimates for EU Telecom are shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex012.webp\" style=\"max-width:min(100%,453px)\" alt=\"Exhibit\"><p>Rashid then reviews the forecast for Kamera1, a German software security firm that is experiencing slowing growth. Kamera1 reported EPS of €3.00 in 20X0, which is the most recently reported period. Rashid reviews Yusuf&#x27;s estimates:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex013.webp\" style=\"max-width:min(100%,629px)\" alt=\"Exhibit\"><p>After 20X5, Kamera1 will grow at a 4% growth rate indefinitely. Based on current market conditions for Kamera1 and using the CAPM, Yusuf assumes a:<\/p><p>Risk-free rate of 3%<\/p><p>Equity risk premium of 5%<\/p><p>Beta of 1.4<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and Rashid&#x27;s notes, the amount that Rashid should record as total investment in fixed capital (€ millions) when calculating Velocità&#x27;s 20X0 FCFF is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q023.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":24,"q":"Based on Exhibit 1 and Rashid's notes, which of the following items should Rashid add to CFO to calculate 20X0 FCFF?","opts":["Interest","Dividends","Neither interest nor dividends"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a024.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\ Rashid wishes to convert Yusuf&#x27;s estimates to FCFF to use in his credit analysis. Yusuf&#x27;s 20X1 estimates for EU Telecom are shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex012.webp\" style=\"max-width:min(100%,453px)\" alt=\"Exhibit\"><p>Rashid then reviews the forecast for Kamera1, a German software security firm that is experiencing slowing growth. Kamera1 reported EPS of €3.00 in 20X0, which is the most recently reported period. Rashid reviews Yusuf&#x27;s estimates:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex013.webp\" style=\"max-width:min(100%,629px)\" alt=\"Exhibit\"><p>After 20X5, Kamera1 will grow at a 4% growth rate indefinitely. Based on current market conditions for Kamera1 and using the CAPM, Yusuf assumes a:<\/p><p>Risk-free rate of 3%<\/p><p>Equity risk premium of 5%<\/p><p>Beta of 1.4<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 3 and Yusuf&#x27;s estimates, if Kamera1&#x27;s stock is trading at €53.60, it would most appropriately be considered:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q028.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":29,"q":"Based on Exhibit 1 and using the single-stage RI valuation model, the intrinsic value per share (in SGD) of MSI's equity is closest to:","opts":["50","60","80"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a029.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a029.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 29–34 · Equity Valuation<\/summary><div class=\"vig-body\"><p>It is December 20X1, and Ananya Gupta, CFA, is analyzing Merlion Singapore, Inc. (MSI). After 20 years of rapid growth, MSI has announced that it will initiate a dividend, but growth and value creation are expected to continue for many years. The company reports under IFRS, and Gupta has analyzed its most recent financial statements, press releases, and current market data. Based on these sources, she compiles the following (in SGD):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex014.webp\" style=\"max-width:min(100%,591px)\" alt=\"Exhibit\"><p>Gupta values MSI using two different applications of the residual income (RI) valuation model.<\/p><p>She applies a single-stage RI valuation model, assuming a constant ROE and constant dividend growth. Based on the CAPM, Gupta estimates that the company&#x27;s required rate of return is 8%.<\/p><p>In addition, she applies a multistage, 15-year RI valuation model, assuming terminal value of zero, and estimates the company&#x27;s intrinsic value per share as SGD 49.58.<\/p><p>Gupta&#x27;s supervisor questions the assumption of a terminal value of zero, so Gupta also runs the multistage model using two alternative assumptions:<\/p><p>Assumption 1: Year 15 residual income of SGD 1.73 continues in perpetuity.<\/p><p>Assumption 2: ROE will revert to the required return, and residual income will eventually be zero. The persistence factor is 0.7 and Year 15 residual income will be SGD 1.73. Another analyst observes that Gupta could just use a dividend discount model (DDM), which would be easier to apply. Then, a colleague from the accounting department, Chan Ding Hao, joins the discussion and suggests Gupta verify that MSI has not violated clean surplus accounting<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and using the single-stage RI valuation model, the intrinsic value per share (in SGD) of MSI&#x27;s equity is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q029.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":30,"q":"If MSI's justified wing data based on his expectations:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex017.webp\" style=\"max-width:min(100%,339px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 3, the market&#x27;s implied dividend growth rate for Wolke is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q040.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":41,"q":"Which of Fortier's statements) is (are) most likely correct?","opts":["Only Statement 1","Only Statement 2","Both Statement 1 and Statement 2"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a041.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a041.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 41–44 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Anna Fortier, head of acquisitions at a major food distributor, is analyzing Modern Farm Markets, a privately held produce retailer, as a possible target for acquisition. Fortier discusses the target company valuation with her team, and she states:<\/p><p><b>Statement 1:<\/b> The market approach is often considered preferable to the income- and asset-based approaches since it relies on actual transaction data, as recommended by accounting standards.<\/p><p><b>Statement 2:<\/b> Price volatility of comparable public company shares is irrelevant to valuations made for acquiring a target private company.<\/p><p>Fortier directs the team to apply the guideline public company method (GPCM), using an average of the market value to invested capital (MVIC)-to-EBITDA multiples of the comparables. She has chosen three comparable companies: Urban Foods Inc. (UFI), Republic Company Ltd. (RCL), and The West Hills Company (WHC). The team gathers selected data, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex018.webp\" style=\"max-width:min(100%,665px)\" alt=\"Exhibit\"><p>Fortier forecasts Modern Farm Markets&#x27; EBITDA at CAD 18 million, applies a 10% downward relative risk adjustment, and determines no control premium is needed.<\/p><p>In addition to Modern Farm Markets, Fortier recently evaluated Montagne&#x27;s Fresh Market, a three-store supermarket chain. Montagne is 100%-owned by its founder, who wishes to retire and sell the company. Fortier views this company as having a moderate risk profile with a stable growth rate. She forecasted EBITDA at CAD 2.4 million.<\/p><p>Due to the company&#x27;s much smaller size and ownership structure, Fortier used the guideline transaction method (GTM) to value Montagne. Her team found two transactions very similar to the proposed acquisition of Montagne: acquisitions of 100% of two privately held small supermarket chains. Exhibit 2 shows the targets&#x27; MVIC-to-EBITDA multiples, after the acquirer applied a relative risk adjustment:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex019.webp\" style=\"max-width:min(100%,539px)\" alt=\"Exhibit\"><p>While Fortier considered the Canada East Foods transaction the most relevant for valuing Montagne, she decided to use both guideline transactions in the valuation calculation. In addition, her team determined that Montagne warranted a 5% downward adjustment for the relative risk. After evaluating the results, an analyst on Fortier&#x27;s team commented on the GTM:<\/p><p><b>Comment 1:<\/b> A control premium for Montagne is already incorporated into the guideline transaction multiple.<\/p><p><b>Comment 2:<\/b> When using the GTM, the difference between the transaction date and the valuation date does not factor in a downward relative risk adjustment.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Fortier&#x27;s statements) is (are) most likely correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q041.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":42,"q":"Based on Exhibit 1 and the information provided, Modern Farm Markets' firm value (in CAD millions) using the GPCM is closest to:","opts":["118.08","121.50","135.00"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a042.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a042.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 41–44 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Anna Fortier, head of acquisitions at a major food distributor, is analyzing Modern Farm Markets, a privately held produce retailer, as a possible target for acquisition. Fortier discusses the target company valuation with her team, and she states:<\/p><p><b>Statement 1:<\/b> The market approach is often considered preferable to the income- and asset-based approaches since it relies on actual transaction data, as recommended by accounting standards.<\/p><p><b>Statement 2:<\/b> Price volatility of comparable public company shares is irrelevant to valuations made for acquiring a target private company.<\/p><p>Fortier directs the team to apply the guideline public company method (GPCM), using an average of the market value to invested capital (MVIC)-to-EBITDA multiples of the comparables. She has chosen three comparable companies: Urban Foods Inc. (UFI), Republic Company Ltd. (RCL), and The West Hills Company (WHC). The team gathers selected data, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex018.webp\" style=\"max-width:min(100%,665px)\" alt=\"Exhibit\"><p>Fortier forecasts Modern Farm Markets&#x27; EBITDA at CAD 18 million, applies a 10% downward relative risk adjustment, and determines no control premium is needed.<\/p><p>In addition to Modern Farm Markets, Fortier recently evaluated Montagne&#x27;s Fresh Market, a three-store supermarket chain. Montagne is 100%-owned by its founder, who wishes to retire and sell the company. Fortier views this company as having a moderate risk profile with a stable growth rate. She forecasted EBITDA at CAD 2.4 million.<\/p><p>Due to the company&#x27;s much smaller size and ownership structure, Fortier used the guideline transaction method (GTM) to value Montagne. Her team found two transactions very similar to the proposed acquisition of Montagne: acquisitions of 100% of two privately held small supermarket chains. Exhibit 2 shows the targets&#x27; MVIC-to-EBITDA multiples, after the acquirer applied a relative risk adjustment:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex019.webp\" style=\"max-width:min(100%,539px)\" alt=\"Exhibit\"><p>While Fortier considered the Canada East Foods transaction the most relevant for valuing Montagne, she decided to use both guideline transactions in the valuation calculation. In addition, her team determined that Montagne warranted a 5% downward adjustment for the relative risk. After evaluating the results, an analyst on Fortier&#x27;s team commented on the GTM:<\/p><p><b>Comment 1:<\/b> A control premium for Montagne is already incorporated into the guideline transaction multiple.<\/p><p><b>Comment 2:<\/b> When using the GTM, the difference between the transaction date and the valuation date does not factor in a downward relative risk adjustment.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and the information provided, Modern Farm Markets&#x27; firm value (in CAD millions) using the GPCM is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q042.webp\" alt=\"Câu h rn Farm Markets, Fortier recently evaluated Montagne&#x27;s Fresh Market, a three-store supermarket chain. Montagne is 100%-owned by its founder, who wishes to retire and sell the company. Fortier views this company as having a moderate risk profile with a stable growth rate. She forecasted EBITDA at CAD 2.4 million.<\/p><p>Due to the company&#x27;s much smaller size and ownership structure, Fortier used the guideline transaction method (GTM) to value Montagne. Her team found two transactions very similar to the proposed acquisition of Montagne: acquisitions of 100% of two privately held small supermarket chains. Exhibit 2 shows the targets&#x27; MVIC-to-EBITDA multiples, after the acquirer applied a relative risk adjustment:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex019.webp\" style=\"max-width:min(100%,539px)\" alt=\"Exhibit\"><p>While Fortier considered the Canada East Foods transaction the most relevant for valuing Montagne, she decided to use both guideline transactions in the valuation calculation. In addition, her team determined that Montagne warranted a 5% downward adjustment for the relative risk. After evaluating the results, an analyst on Fortier&#x27;s team commented on the GTM:<\/p><p><b>Comment 1:<\/b> A control premium for Montagne is already incorporated into the guideline transaction multiple.<\/p><p><b>Comment 2:<\/b> When using the GTM, the difference between the transaction date and the valuation date does not factor in a downward relative risk adjustment.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2 and the information provided, Montagne&#x27;s Fresh Market&#x27;s firm value (in CAD millions) using the GTM is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q043.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":44,"q":"Which of the analyst's comments) about the GTM is (are) most likely correct?","opts":["Only Comment 1","Only Comment 2","Both Comment 1 and Comment 2"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a044.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a044.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 41–44 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Anna Fortier, head of acquisitions at a major food distributor, is analyzing Modern Farm Markets, a privately held produce retailer, as a possible target for acquisition. Fortier discusses the target company valuation with her team, and she states:<\/p><p><b>Statement 1:<\/b> The market approach is often considered preferable to the income- and asset-based approaches since it relies on actual transaction data, as recommended by accounting standards.<\/p><p><b>Statement 2:<\/b> Price volatility of comparable public company shares is irrelevant to valuations made for acquiring a target private company.<\/p><p>Fortier directs the team to apply the guideline public company method (GPCM), using an average of the market value to invested capital (MVIC)-to-EBITDA multiples of the comparables. She has chosen three comparable companies: Urban Foods Inc. (UFI), Republic Company Ltd. (RCL), and The West Hills Company (WHC). The team gathers selected data, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex018.webp\" style=\"max-width:min(100%,665px)\" alt=\"Exhibit\"><p>Fortier forecasts Modern Farm Markets&#x27; EBITDA at CAD 18 million, applies a 10% downward relative risk adjustment, and determines no control premium is needed.<\/p><p>In addition to Modern Farm Markets, Fortier recently evaluated Montagne&#x27;s Fresh Market, a three-store supermarket chain. Montagne is 100%-owned by its founder, who wishes to retire and sell the company. Fortier views this company as having a moderate risk profile with a stable growth rate. She forecasted EBITDA at CAD 2.4 million.<\/p><p>Due to the company&#x27;s much smaller size and ownership structure, Fortier used the guideline transaction method (GTM) to value Montagne. Her team found two transactions very similar to the proposed acquisition of Montagne: acquisitions of 100% of two privately held small supermarket chains. Exhibit 2 shows the targets&#x27; MVIC-to-EBITDA multiples, after the acquirer applied a relative risk adjustment:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex019.webp\" style=\"max-width:min(100%,539px)\" alt=\"Exhibit\"><p>While Fortier considered the Canada East Foods transaction the most relevant for valuing Montagne, she decided to use both guideline transactions in the valuation calculation. In addition, her team determined that Montagne warranted a 5% downward adjustment for the relative risk. After evaluating the results, an analyst on Fortier&#x27;s team commented on the GTM:<\/p><p><b>Comment 1:<\/b> A control premium for Montagne is already incorporated into the guideline transaction multiple.<\/p><p><b>Comment 2:<\/b> When using the GTM, the difference between the transaction date and the valuation date does not factor in a downward relative risk adjustment.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the analyst&#x27;s comments) about the GTM is (are) most likely correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q044.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":45,"q":"Which of the rationales listed by Hernandez best justifies using a multiple other than P/E?","opts":["Rationale 1","Rationale 2","Rationale 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a045.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a045.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 45–48 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Josue Hernandez and Maria Perez are newly hired associates at BLL Bank. Francisco Carrera, a senior analyst at BLL, is testing them on their knowledge of market-based valuation, starting with price multiples. Carrera asks Hernandez about rationales for using multiples other than P/E. Hernandez responds with:<\/p><p><b>Rationale 1:<\/b> Sales is much more difficult to manipulate than earnings, and therefore P/S can be used without fear of manipulation.<\/p><p><b>Rationale 2:<\/b> Since dividends are a less risky component of return than price appreciation, dividend yield is more optimal than P/E.<\/p><p><b>Rationale 3:<\/b> Since book value is cumulative, it is often positive even when earnings are negative and P/E cannot be used.<\/p><p>Carrera then asks Perez to identify some drawbacks to using multiples other than P/E. Perez responds:<\/p><p><b>Drawback 1:<\/b> Due to cost control measures, sales and P/S are often more volatile than EPS and P/E.<\/p><p><b>Drawback 2:<\/b> When cash flow is defined as earnings plus noncash charges, certain items affecting actual cash flow are ignored.<\/p><p><b>Drawback 3:<\/b> P/B is typically viewed as inappropriate for valuing companies with largely liquid assets, such as banks.<\/p><p>Carrera then asks about their familiarity with enterprise-based multiples. He provides the two associates with the financial information for retailer Molina Primero, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex020.webp\" style=\"max-width:min(100%,408px)\" alt=\"Exhibit\"><p>Molina Primero has 10 million shares outstanding, currently priced at MXN 4,500 per share.<\/p><p>Carrera mentions to Hernandez and Perez that investors use the earnings surprise from sell-side analysts&#x27; earnings estimates as an indicator of future stock price movement. Some investors use the accuracy of past forecasts to normalize surprises for a given period. Carrera provides the two associates recent earnings information on three stocks, shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex021.webp\" style=\"max-width:min(100%,590px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of the rationales listed by Hernandez best justifies using a multiple other than P/E?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q045.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":46,"q":"Which of the drawbacks listed by Perez is correct?","opts":["Drawback 1","Drawback 2","Drawback 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a046.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a046.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 45–48 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Josue Hernandez and Maria Perez are newly hired associates at BLL Bank. Francisco Carrera, a senior analyst at BLL, is testing them on their knowledge of market-based valuation, starting with price multiples. Carrera asks Hernandez about rationales for using multiples other than P/E. Hernandez responds with:<\/p><p><b>Rationale 1:<\/b> Sales is much more difficult to manipulate than earnings, and therefore P/S can be used without fear of manipulation.<\/p><p><b>Rationale 2:<\/b> Since dividends are a less risky component of return than price appreciation, dividend yield is more optimal than P/E.<\/p><p><b>Rationale 3:<\/b> Since book value is cumulative, on.<\/p><p><b>Rationale 2:<\/b> Since dividends are a less risky component of return than price appreciation, dividend yield is more optimal than P/E.<\/p><p><b>Rationale 3:<\/b> Since book value is cumulative, it is often positive even when earnings are negative and P/E cannot be used.<\/p><p>Carrera then asks Perez to identify some drawbacks to using multiples other than P/E. Perez responds:<\/p><p><b>Drawback 1:<\/b> Due to cost control measures, sales and P/S are often more volatile than EPS and P/E.<\/p><p><b>Drawback 2:<\/b> When cash flow is defined as earnings plus noncash charges, certain items affecting actual cash flow are ignored.<\/p><p><b>Drawback 3:<\/b> P/B is typically viewed as inappropriate for valuing companies with largely liquid assets, such as banks.<\/p><p>Carrera then asks about their familiarity with enterprise-based multiples. He provides the two associates with the financial information for retailer Molina Primero, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex020.webp\" style=\"max-width:min(100%,408px)\" alt=\"Exhibit\"><p>Molina Primero has 10 million shares outstanding, currently priced at MXN 4,500 per share.<\/p><p>Carrera mentions to Hernandez and Perez that investors use the earnings surprise from sell-side analysts&#x27; earnings estimates as an indicator of future stock price movement. Some investors use the accuracy of past forecasts to normalize surprises for a given period. Carrera provides the two associates recent earnings information on three stocks, shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex021.webp\" style=\"max-width:min(100%,590px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2 and using standardized unexpected earnings (SUE) scores, in 1Q 20X4, the consensus forecasts for which company were most accurate?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q048.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":49,"q":"Based on Exhibit 1, Promenade's stock is relatively:","opts":["undervalued since the current earnings yield is greater than the justified multiple.","fairly valued since the current PIE multiple equals the justified multiple.","overvalued since the current P/E multiple is greater than the justified multiple."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a049.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a049.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 49–52 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Alvin Blake and Amber Cazares, sell-side analysts covering the pulp and paper industry for a brokerage firm, are analyzing Promenade Paper&#x27;s stock. Blake has decided to value the stock by comparing current price multiples, based on market price, with justified multiples based on a constant growth model. He summarizes the information in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex022.webp\" style=\"max-width:min(100%,562px)\" alt=\"Exhibit\"><p>Cazares tells Blake that she prefers to use forecasted earnings to value Promenade. She explains that, before modeling future earnings, she estimates Promenade&#x27;s underlying earnings by adjusting the company&#x27;s reported earnings. Cazares then explains to Blake how to calculate a company&#x27;s underlying earnings.<\/p><p>Blake turns his attention to Papiro Industries. He uses price-to-sales (P/S) multiples to evaluate whether Papiro&#x27;s stock is relatively under- or overvalued and estimates a justified P/S multiple of 0.91 based on a constant growth model. Cazares separately estimates a justified P/S multiple of 1.12 using a similar calculation. She compares her assumptions with those used by Blake to understand the differences in the justified multiples.<\/p><p>Cazares says that she also uses multiples based on the concept of earnings plus noncash charges, or cash flow (CF), to evaluate Papiro&#x27;s stock. Blake agrees that cash flow multiples based on CF are a widely used metric but adds that he prefers to use cash flow from operations (CFO), sourced directly from the statement of cash flows. Blake then lists to Cazares some of the reasons for his preference.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, Promenade&#x27;s stock is relatively:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q049.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":50,"q":"The calculation of underlying earnings proposed by Cazares most likely:","opts":["is performed in conformity with accounting standards.","excludes changes in accounting estimates and goodwill impairment charges.","includes the cash component of earnings and excludes the accrual component."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a050.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a050.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 49–52 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alvin Blake and Amber Cazares, sell-side analysts covering the pulp and paper industry for a brokerage firm, are analyzing Promenade Paper&#x27;s stock. Blake has decided to value the stock by comparing current price multiples, based on market price, with justified multiples based on a constant growth model. He summarizes the information in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex022.webp\" style=\"max-width:min(100%,562px)\" alt=\"Exhibit\"><p>Cazares tells Blake that she prefers to use forecasted earnings to value Promenade. She explains that, before modeling future earnings, she estimates Promenade&#x27;s underlying earnings by adjusting the company&#x27;s reported earnings. Cazares then explains to Blake how to calculate a company&#x27;s underlying earnings.<\/p><p>Blake turns his attention to Papiro Industries. He uses price-to-sales (P/S) multiples to evaluate whether Papiro&#x27;s stock is relatively under- or overvalued and estimates a justified P/S multiple of 0.91 based on a constant growth model. Cazares separately estimates a justified P/S multiple of 1.12 using a similar calculation. She compares her assumptions with those used by Blake to understand the differences in the justified multiples.<\/p><p>Cazares says that she also uses multiples based on the concept of earnings plus noncash charges, or cash flow (CF), to evaluate Papiro&#x27;s stock. Blake agrees that cash flow multiples based on CF are a widely used metric but adds that he prefers to use cash flow from operations (CFO), sourced directly from the statement of cash flows. Blake then lists to Cazares some of the reasons for his preference.<\/p><\/div><\/details><div class=\"qtext\"><p>The calculation of underlying earnings proposed by Cazares most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q050.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":51,"q":"All else equal, Cazares's greater justified P/S multiple most likely assumes a:","opts":["higher profit margin.","greater equity risk premium.","smaller financial leverage ratio."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a051.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a051.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 49–52 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alvin Blake and Amber Cazares, sell-side analysts covering the pulp and paper industry for a brokerage firm, are analyzing Promenade Paper&#x27;s stock. Blake has decided to value the stock by comparing current price multiples, based on market price, with justified multiples based on a constant growth model. He summarizes the information in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex022.webp\" style=\"max-width:min(100%,562px)\" alt=\"Exhibit\"><p>Cazares tells Blake that she prefers to use forecasted earnings to value Promenade. She explains that, before modeling future earnings, she estimates Promenade&#x27;s underlying earnings by adjusting the company&#x27;s reported earnings. Cazares then explains to Blake how to calculate a company&#x27;s underlying earnings.<\/p><p>Blake turns his attention to Papiro Industries. He uses price-to-sales (P/S) multiples to evaluate whether Papiro&#x27;s stock is relatively under- or overvalued and estimates a justified P/S multiple of 0.91 based on a constant growth model. Cazares separately estimates a justified P/S multiple of 1.12 using a similar calculation. She compares her assumptions with those used by Blake to understand the differences in the justified multiples.<\/p><p>Cazares says that she also uses multiples based on the concept of earnings plus noncash charges, or cash flow (CF), to evaluate Papiro&#x27;s stock. Blake agrees that cash flow multiples based on CF are a widely used metric but adds that he prefers to use cash flow from operations (CFO), sourced directly from the statement of cash flows. Blake then lists to Cazares some of the reasons for his preference.<\/p><\/div><\/details><div class=\"qtext\"><p>All else equal, Cazares&#x27;s greater justified P/S multiple most likely assumes a:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q051.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":52,"q":"When compared with cash flow multiples based on CF, multiples based on CFO have the advantage of:","opts":["reflecting changes in working and fixed capital.","addressing aggressive revenue recognition practices.","not requiring adjustments when comparing IFRS multiples with US GAAP multiples."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a052.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a052.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 49–52 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alvin Blake and Amber Cazares, sell-side analysts covering the pulp and paper industry for a brokerage firm, are analyzing Promenade Paper&#x27;s stock. Blake has decided to value the stock by comparing current price multiples, based on market price, with justified multiples based on a constant growth model. He summarizes the information in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex022.webp\" style=\"max-width:min(100%,562px)\" alt=\"Exhibit\"><p>Cazares tells Blake that she prefers to use forecasted earnings to value Promenade. She explains that, before modeling future earnings, she estimates Promenade&#x27;s underlying earnings by adjusting the company&#x27;s reported earnings. Cazares then explains to Blake how to calculate a company&#x27;s underlying earnings.<\/p><p>Blake turns his attention to Papiro Industries. He uses price-to-sales (P/S) multiples to evaluate whether Papiro&#x27;s stock is relatively under- or overvalued and estimates a justified P/S multiple of 0.91 based on a constant growth model. Cazares separately estimates a justified P/S multiple of 1.12 using a similar calculation. She compares her assumptions with those used by Blake to understand the differences in the justified multiples.<\/p><p>Cazares says that she also uses multiples based on the concept of earnings plus noncash charges, or cash flow (CF), to evaluate Papiro&#x27;s stock. Blake agrees that cash flow multiples based on CF are a widely used metric but adds that he prefers to use cash flow from operations (CFO), sourced directly from the statement of cash flows. Blake then lists to Cazares some of the reasons for his preference.<\/p><\/div><\/details><div class=\"qtext\"><p>When compared with cash flow multiples based on CF, multiples based on CFO have the advantage of:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q052.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":53,"q":"Based on Fan's analysis, Falcon's competitive strategy is best described as:","opts":["focus.","differentiation.","cost leadership."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a053.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a053.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 53–58 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Lei Fan, CFA and Ju Zhang, CFA, two portfolio managers at Sunrise Capital, are discussing potential investments. Their discussion begins with the construction equipment industry and Falcon Manufacturing&#x27;s competitive position. Fan states that during his initial analysis, he observed that Falcon has been able to improve on the most popular products sold across the industry. The improvements have allowed Falcon to maintain selling prices higher than its competitors.<\/p><p>Zhang mentions that she has analyzed Falcon&#x27;s revenue growth and profitability, compared to its peers, using ratios based on data from its financial statements for the last five years. She finds that Falcon has outperformed its peers for the first four years of her analysis, and then performed on average with peers in the last year.<\/p><p>During their conversation, they also discuss their latest valuations for Falcon and make the following comments:<\/p><p>Fan: Investors can only estimate Falcon&#x27;s intrinsic value since knowledge of a company&#x27;s investment characteristics will always be incomplete.<\/p><p>Zhang: My value estimate is above the current market price, and if I am right, convergence will make the price increase in the near-term.<\/p><p>Falcon&#x27;s stock currently trades at ¥780 and Zhang&#x27;s forecast model estimates the stock&#x27;s intrinsic value at ¥870. Zhang expects Falcon to maintain profitability for the foreseeable future. Despite Falcon&#x27;s consistent positive free cash flow generation and profitability, Fan suggests that Zhang also look at Falcon&#x27;s liquidation value and compare it against the going-concern value derived in her forecast.<\/p><p>Fan and Zhang have a meeting with Falcon&#x27;s CFO scheduled for later in the week. Zhang tells Fan that she will send the valuation model she created to the CFO to facilitate communication with her. Zhang plans to ask the CFO about a rumored merger between Falcon and one of its competitors and to use the model to analyze the effects of the merger on Falcon&#x27;s growth and profitability.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Fan&#x27;s analysis, Falcon&#x27;s competitive strategy is best described as:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q053.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":54,"q":"With respect to an appropriate analysis of strategy execution, Zhang's analysis of Falcon's revenue growth and profitability is correct in assuming that:","opts":["analyzing five years of financial information is sufficient.","comparing financial ratios to peers can identify successful execution.","Falcon's Year 5 performance does not necessarily indicate a strategy change."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a054.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a054.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 53–58 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lei Fan, CFA and Ju Zhang, CFA, two portfolio managers at Sunrise Capital, are discussing potential investments. Their discussion begins with the construction equipment industry and Falcon Manufacturing&#x27;s competitive position. Fan states that during his initial analysis, he observed that Falcon has been able to improve on the most popular products sold across the industry. The improvements have allowed Falcon to maintain selling prices higher than its competitors.<\/p><p>Zhang mentions that she has analyzed Falcon&#x27;s revenue growth and profitability, compared to its peers, using ratios based on data from its financial statements for the last five years. She finds that Falcon has outperformed its peers for the first four years of her analysis, and then performed on average with peers in the last year.<\/p><p>During their conversation, they also discuss their latest valuations for Falcon and make the following comments:<\/p><p>Fan: Investors can only estimate Falcon&#x27;s intrinsic value since knowledge of a company&#x27;s investment characteristics will always be incomplete.<\/p><p>Zhang: My value estimate is above the current market price, and if I am right, convergence will make the price increase in the near-term.<\/p><p>Falcon&#x27;s stock currently trades at ¥780 and Zhang&#x27;s forecast model estimates the stock&#x27;s intrinsic value at ¥870. Zhang expects Falcon to maintain profitability for the foreseeable future. Despite Falcon&#x27;s consistent positive free cash flow generation and profitability, Fan suggests that Zhang also look at Falcon&#x27;s liquidation value and compare it against the going-concern value derived in her forecast.<\/p><p>Fan and Zhang have a meeting with Falcon&#x27;s CFO scheduled for later in the week. Zhang tells Fan that she will send the valuation model she created to the CFO to facilitate communication with her. Zhang plans to ask the CFO about a rumored merger between Falcon and one of its competitors and to use the model to analyze the effects of the merger on Falcon&#x27;s growth and profitability.<\/p><\/div><\/details><div class=\"qtext\"><p>With respect to an appropriate analysis of strategy execution, Zhang&#x27;s analysis of Falcon&#x27;s revenue growth and profitability is correct in assuming that:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q054.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":55,"q":"Which comments) made by Fan and Zhang correctly describe a company's intrinsic value?","opts":["Only Fan's","Only Zhang's","Both Fan's and Zhang's"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a055.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a055.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 53–58 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-bod
