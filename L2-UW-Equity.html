o analyzes a large number of stocks in the industry and builds a cross-sectional regression model to predict Guadalupe&#x27;s P/E. He compares the predicted price-to-earnings (P/E) ratio with Guadalupe&#x27;s current trailing P/E to evaluate the stock. The model is:<\/p><p>Predicted P/E = 10.7 + (1.1 × Dividend payout ratio) − (0.2 × Beta) + (65.6 × Earnings growth rate)<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2, which of the following fundamental factors most likely explains the difference in the trailing price-to-sales multiples of Guadalupe and Arana?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q141.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":142,"q":"Based on Exhibit 2 and on the predicted P/E from the cross-sectional regression, Guadalupe's stock is currently:","opts":["undervalued.","fairly valued.","overvalued."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a142.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a142.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 26 · Câu 137–142 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tomás Montero is a financial analyst at an independent equity research firm. He is updating, as of January 1, 20X6, the research reports on Industrias Melendez and Tiendas Guadalupe. On that date, the stock prices of Melendez are MXN 150 (per share of common) and MXN 80 (per share of preferred).<\/p><p>Montero summarizes Melendez&#x27;s financial statements in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex054.webp\" style=\"max-width:min(100%,513px)\" alt=\"Exhibit\"><p>Montero calculates Melendez&#x27;s enterprise value (EV) and its EV/EBITDA ratio. He also calculates the price-to-book (P/B) ratio and compares it with the industry multiple of 1.15.<\/p><p>Montero presents his conclusions to his supervisor, Yolanda Barcenas, who asks him to calculate price multiples based on cash flow measures. Montero explains that there are alternative definitions of cash flow, and each has specific limitations:<\/p><p><b>Limitation 1:<\/b> Cash flow from operations (CFO) is not a free cash flow concept.<\/p><p><b>Limitation 2:<\/b> CF (earnings plus noncash charges) is more volatile than FCFE.<\/p><p><b>Limitation 3:<\/b> EBITDA will exceed CFO if working capital is consistently decreasing.<\/p><p>Barcenas asks Montero to include a momentum valuation indicator in his analysis. She recommends using an indicator that compares Melendez&#x27;s stock performance with the performance of a group of similar stocks.<\/p><p>Montero turns his attention to Guadalupe. He gathers information about the company and a competitor, Comercial Arana, summarized in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex055.webp\" style=\"max-width:min(100%,504px)\" alt=\"Exhibit\"><p>Montero notices a significant difference in the trailing price-to-sales (P/S) multiples of both companies. He analyzes three fundamentals—beta, profit margin, and earnings growth rate—to understand whether any of those factors could help explain, at least in part, the difference between the multiples. In this analysis, Montero assumes that both companies&#x27; dividend payout ratio and ROE will not change in the long run.<\/p><p>Montero also analyzes a large number of stocks in the industry and builds a cross-sectional regression model to predict Guadalupe&#x27;s P/E. He compares the predicted price-to-earnings (P/E) ratio with Guadalupe&#x27;s current trailing P/E to evaluate the stock. The model is:<\/p><p>Predicted P/E = 10.7 + (1.1 × Dividend payout ratio) − (0.2 × Beta) + (65.6 × Earnings growth rate)<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2 and on the predicted P/E from the cross-sectional regression, Guadalupe&#x27;s stock is currently:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q142.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":143,"q":"Which of Veronese's statements concerning alternative choices of comparison assets is correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a143.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a143.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 27 · Câu 143–148 · Equity Valuation<\/summary><div class=\"vig-body\"><p>uigi Pellegrini is a portfolio manager at an asset management firm. He asks Gianna Veronese, a senior analyst at the firm, to perform an analysis of Grivola Group, Adamello Industries, and Secchia Systems. He directs Veronese to calculate the companies&#x27; market-based multiples and compare them with an appropriate benchmark.<\/p><p>Veronese explains that there are alternative choices of comparison assets when the method of comparables is used, including a peer group, the firm&#x27;s industry, or the firm&#x27;s historical multiples. After reviewing Grivola Group, a holding company that operates in different business segments, she states:<\/p><p><b>Statement 1:<\/b> Grivola&#x27;s peer group must consist of companies from the same industry that have no significant differences from Grivola.<\/p><p><b>Statement 2:<\/b> Since Grivola operates in different business segments, it may be classified in more than one industry or sector.<\/p><p><b>Statement 3:<\/b> The comparison of current and historical P/E may be affected by changes in Grivola&#x27;s business mix or leverage.<\/p><p>Veronese adds that a multiple of a representative equity index may also be used as a benchmark. However, since the overall market may be over- or undervalued, she uses two models—the Fed model and the Yardeni model—to value the equity index multiple.<\/p><p>Pellegrini would like to compare Grivola with international peers, but he expresses concern about differences in inflation rates. Veronese answers that a justified forward P/E can be calculated based on forecasted fundamentals using the information in Exhibit 1. She uses a constant growth model that assumes earnings growth for the three companies results only from inflation and that earnings are distributed entirely as dividends.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex056.webp\" style=\"max-width:min(100%,506px)\" alt=\"Exhibit\"><p>Veronese adds that, in the analysis, she defined cash flow as earnings plus noncash charges and considered that Adamello&#x27;s industry had a P/CF of 9.0. Adamello&#x27;s income statement is summarized in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex057.webp\" style=\"max-width:min(100%,410px)\" alt=\"Exhibit\"><p>Exhibit 3 presents additional financial information on Adamello gathered by Veronese:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex058.webp\" style=\"max-width:min(100%,440px)\" alt=\"Exhibit\"><p>Finally, Veronese switches her focus to Secchia Systems. Since Secchia has been paying dividends regularly, she decides to calculate the company&#x27;s trailing dividend yield and compare it with a justified multiple based on a constant growth model. She gathers information on the company, presented in Exhibit 4:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex059.webp\" style=\"max-width:min(100%,466px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of Veronese&#x27;s statements concerning alternative choices of comparison assets is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q143.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":144,"q":"Which of the following variables is incorporated in the Yardeni model but not in the Fed model?","opts":["Equity risk premium","Earnings growth rate","Interest yield on bonds"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a144.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a144.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 27 · Câu 143–148 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>uigi Pellegrini is a portfolio manager at an asset management firm. He asks Gianna Veronese, a senior analyst at the firm, to perform an analysis of Grivola Group, Adamello Industries, and Secchia Systems. He directs Veronese to calculate the companies&#x27; market-based multiples and compare them with an appropriate benchmark.<\/p><p>Veronese explains that there are alternative choices of comparison assets when the method of comparables is used, including a peer group, the firm&#x27;s industry, or the firm&#x27;s historical multiples. After reviewing Grivola Group, a holding company that operates in different business segments, she states:<\/p><p><b>Statement 1:<\/b> Grivola&#x27;s peer group must consist of companies from the same industry that have no significant differences from Grivola.<\/p><p><b>Statement 2:<\/b> Since Grivola operates in different business segments, it may be classified in more than one industry or sector.<\/p><p><b>Statement 3:<\/b> The comparison of current and historical P/E may be affected by changes in Grivola&#x27;s business mix or leverage.<\/p><p>Veronese adds that a multiple of a representative equity index may also be used as a benchmark. However, since the overall market may be over- or undervalued, she uses two models—the Fed model and the Yardeni model—to value the equity index multiple.<\/p><p>Pellegrini would like to compare Grivola with international peers, but he expresses concern about differences in inflation rates. Veronese answers that a justified forward P/E can be calculated based on forecasted fundamentals using the information in Exhibit 1. She uses a constant growth model that assumes earnings growth for the three companies results only from inflation and that earnings are distributed entirely as dividends.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex056.webp\" style=\"max-width:min(100%,506px)\" alt=\"Exhibit\"><p>Veronese adds that, in the analysis, she defined cash flow as earnings plus noncash charges and considered that Adamello&#x27;s industry had a P/CF of 9.0. Adamello&#x27;s income statement is summarized in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex057.webp\" style=\"max-width:min(100%,410px)\" alt=\"Exhibit\"><p>Exhibit 3 presents additional financial information on Adamello gathered by Veronese:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex058.webp\" style=\"max-width:min(100%,440px)\" alt=\"Exhibit\"><p>Finally, Veronese switches her focus to Secchia Systems. Since Secchia has been paying dividends regularly, she decides to calculate the company&#x27;s trailing dividend yield and compare it with a justified multiple based on a constant growth model. She gathers information on the company, presented in Exhibit 4:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex059.webp\" style=\"max-width:min(100%,466px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of the following variables is incorporated in the Yardeni model but not in the Fed model?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q144.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":145,"q":"Based on Veronese's assumptions and on Exhibit 1, which company has the highest justified forward P/E?","opts":["Peer 1","Peer 2","Grivola"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a145.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a145.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 27 · Câu 143–148 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>uigi Pellegrini is a portfolio manager at an asset management firm. He asks Gianna Veronese, a senior analyst at the firm, to perform an analysis of Grivola Group, Adamello Industries, and Secchia Systems. He directs Veronese to calculate the companies&#x27; market-based multiples and compare them with an appropriate benchmark.<\/p><p>Veronese explains that there are alternative choices of comparison assets when the method of comparables is used, including a peer group, the firm&#x27;s industry, or the firm&#x27;s historical multiples. After reviewing Grivola Group, a holding company that operates in different business segments, she states:<\/p><p><b>Statement 1:<\/b> Grivola&#x27;s peer group must consist of companies from the same industry that have no significant differences from Grivola.<\/p><p><b>Statement 2:<\/b> Since Grivola operates in different business segments, it may be classified in more than one industry or sector.<\/p><p><b>Statement 3:<\/b> The comparison of current and historical P/E may be affected by changes in Grivola&#x27;s business mix or leverage.<\/p><p>Veronese adds that a multiple of a representative equity index may also be used as a benchmark. However, since the overall market may be over- or undervalued, she uses two eronese answers that a justified forward P/E can be calculated based on forecasted fundamentals using the information in Exhibit 1. She uses a constant growth model that assumes earnings growth for the three companies results only from inflation and that earnings are distributed entirely as dividends.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex056.webp\" style=\"max-width:min(100%,506px)\" alt=\"Exhibit\"><p>Veronese adds that, in the analysis, she defined cash flow as earnings plus noncash charges and considered that Adamello&#x27;s industry had a P/CF of 9.0. Adamello&#x27;s income statement is summarized in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex057.webp\" style=\"max-width:min(100%,410px)\" alt=\"Exhibit\"><p>Exhibit 3 presents additional financial information on Adamello gathered by Veronese:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex058.webp\" style=\"max-width:min(100%,440px)\" alt=\"Exhibit\"><p>Finally, Veronese switches her focus to Secchia Systems. Since Secchia has been paying dividends regularly, she decides to calculate the company&#x27;s trailing dividend yield and compare it with a justified multiple based on a constant growth model. She gathers information on the company, presented in Exhibit 4:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex059.webp\" style=\"max-width:min(100%,466px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>All else equal, based on Exhibits 2 and 3 and relative to the industry&#x27;s P/CF, Adamello&#x27;s shares are most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q147.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":148,"q":"Based on Exhibit 4, the most appropriate conclusion is that Secchia's trailing dividend yield is:","opts":["lower than the justified multiple, and the company is overvalued.","lower than the justified multiple, and the company is undervalued.","higher than the justified multiple, and the company is overvalued."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a148.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a148.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 27 · Câu 143–148 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>uigi Pellegrini is a portfolio manager at an asset management firm. He asks Gianna Veronese, a senior analyst at the firm, to perform an analysis of Grivola Group, Adamello Industries, and Secchia Systems. He directs Veronese to calculate the companies&#x27; market-based multiples and compare them with an appropriate benchmark.<\/p><p>Veronese explains that there are alternative choices of comparison assets when the method of comparables is used, including a peer group, the firm&#x27;s industry, or the firm&#x27;s historical multiples. After reviewing Grivola Group, a holding company that operates in different business segments, she states:<\/p><p><b>Statement 1:<\/b> Grivola&#x27;s peer group must consist of companies from the same industry that have no significant differences from Grivola.<\/p><p><b>Statement 2:<\/b> Since Grivola operates in different business segments, it may be classified in more than one industry or sector.<\/p><p><b>Statement 3:<\/b> The comparison of current and historical P/E may be affected by changes in Grivola&#x27;s business mix or leverage.<\/p><p>Veronese adds that a multiple of a representative equity index may also be used as a benchmark. However, since the overall market may be over- or undervalued, she uses two models—the Fed model and the Yardeni model—to value the equity index multiple.<\/p><p>Pellegrini would like to compare Grivola with international peers, but he expresses concern about differences in inflation rates. Veronese answers that a justified forward P/E can be calculated based on forecasted fundamentals using the information in Exhibit 1. She uses a constant growth model that assumes earnings growth for the three companies results only from inflation and that earnings are distributed entirely as dividends.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex056.webp\" style=\"max-width:min(100%,506px)\" alt=\"Exhibit\"><p>Veronese adds that, in the analysis, she defined cash flow as earnings plus noncash charges and considered that Adamello&#x27;s industry had a P/CF of 9.0. Adamello&#x27;s income statement is summarized in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex057.webp\" style=\"max-width:min(100%,410px)\" alt=\"Exhibit\"><p>Exhibit 3 presents additional financial information on Adamello gathered by Veronese:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex058.webp\" style=\"max-width:min(100%,440px)\" alt=\"Exhibit\"><p>Finally, Veronese switches her focus to Secchia Systems. Since Secchia has been paying dividends regularly, she decides to calculate the company&#x27;s trailing dividend yield and compare it with a justified multiple based on a constant growth model. She gathers information on the company, presented in Exhibit 4:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex059.webp\" style=\"max-width:min(100%,466px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 4, the most appropriate conclusion is that Secchia&#x27;s trailing dividend yield is:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q148.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":149,"q":"Which of the company types identified by Mazur are the most appropriate for a residual income valuation model?","opts":["Type 1 and Type 2","Type 2 and Type 3","Type 1 and Type 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a149.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a149.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 28 · Câu 149–154 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Dimitri Mazur was recently hired as a junior research analyst at Nivki Partners, a sell-side brokerage firm. Oksana Koval is Mazur&#x27;s supervisor and is responsible for covering consumer cyclical stocks.<\/p><p>Koval asks Mazur what he knows about the use of residual income models. Mazur responds that, although there are other discounted cash flow models, residual income models are most suitable for companies that are:<\/p><p>Type 1:Non-dividend paying<\/p><p><b>Type 2:<\/b> Early-stage start-ups<\/p><p><b>Type 3:<\/b> Have terminal values that can be estimated with high confidence<\/p><p>Koval agrees that other discounted cash flow models are available and believes they can be useful in certain situations. However, she states that for estimating a company&#x27;s intrinsic value:<\/p><p><b>Statement 1:<\/b> An FCF approach is preferred because it provides a more accurate estimate than a residual income approach.<\/p><p>Statement 2: Dividend discount models are too simplistic and provide a less accurate intrinsic valuation assessment.<\/p><p>Koval then provides Mazur with the most recent annual financial information on Work Shoe, Inc. She asks him to review this information and be prepared to calculate an<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex060.webp\" style=\"max-width:min(100%,536px)\" alt=\"Exhibit\"><p>intrinsic value:<\/p><p>Koval then turns her attention to Auto Parts, Inc. (AP), a leading after-market auto part retailer in the country. AP has grown steadily over the past few years, and Koval expects that trend to continue.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex061.webp\" style=\"max-width:min(100%,429px)\" alt=\"Exhibit\"><p>Koval adds the following assumptions for AP:<\/p><p>Earnings per share will grow at 10% of beginning book value for each of the next three years.<\/p><p>The present value of residual income per share for the next three years is €3.74.<\/p><p>Ending book value per share in three years&#x27; time is €30.15.<\/p><p>In three years&#x27; time, AP will trade at a price-to-book ratio of 1.6.<\/p><p>Koval mentions that several years ago, AP acquired an exclusive 10-year license to sell a particular brand of automotive battery for a nominal fee. This battery brand is now the most popular in the country.<\/p><p>AP is also rumored to be the target of a takeover by an equal-size direct competitor. Koval asks Mazur to consider the possible implications for the estimated residual income intrinsic value of the combined company if AP were acquired in a fair value cash transaction that produced no goodwill.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the company types identified by Mazur are the most appropriate for a residual income valuation model?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q149.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":150,"q":"Assuming fully consistent assumptions and forecasts of key variables across models, which of Koval's statements is correct?","opts":["Statement 1 only","Both Statement 1 and Statement 2","Neither Statement 1 nor Statement 2"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a150.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a150.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 28 · Câu 149–154 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dimitri Mazur was recently hired as a junior research analyst at Nivki Partners, a sell-side brokerage firm. Oksana Koval is Mazur&#x27;s supervisor and is responsible for covering consumer cyclical stocks.<\/p><p>Koval asks Mazur what he knows about the use of residual income models. Mazur responds that, although there are other discounted cash flow models, residual income models are most suitable for companies that are:<\/p><p>Type 1:Non-dividend paying<\/p><p><b>Type 2:<\/b> Early-stage start-ups<\/p><p><b>Type 3:<\/b> Have terminal values that can be estimated with high confidence<\/p><p>Koval agrees that other discounted cash flow models are available and believes they can be useful in certain situations. However, she states that for estimating a company&#x27;s intrinsic value:<\/p><p><b>Statement 1:<\/b> An FCF approach is preferred because it provides a more accurate estimate than a residual income approach.<\/p><p>Statement 2: Dividend discount models are too simplistic and provide a less accurate intrinsic valuation assessment.<\/p><p>Koval then provides Mazur with the most recent annual financial information on Work Shoe, Inc. She asks him to review this information and be prepared to calculate an<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex060.webp\" style=\"max-width:min(100%,536px)\" alt=\"Exhibit\"><p>intrinsic value:<\/p><p>Koval then turns her attention to Auto Parts, Inc. (AP), a leading after-market auto part retailer in the country. AP has grown steadily over the past few years, and Koval expects that trend to continue.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex061.webp\" style=\"max-width:min(100%,429px)\" alt=\"Exhibit\"><p>Koval adds the following assumptions for AP:<\/p><p>Earnings per share will grow at 10% of beginning book value for each of the next three years.<\/p><p>The present value of residual income per share for the next three years is €3.74.<\/p><p>Ending book value per share in three years&#x27; time is €30.15.<\/p><p>In three years&#x27; time, AP will trade at a price-to-book ratio of 1.6.<\/p><p>Koval mentions that several years ago, AP acquired an exclusive 10-year license to sell a particular brand of automotive battery for a nominal fee. This battery brand is now the most popular in the country.<\/p><p>AP is also rumored to be the target of a takeover by an equal-size direct competitor. Koval asks Mazur to consider the possible implications for the estimated residual income intrinsic value of the combined company if AP were acquired in a fair value cash transaction that produced no goodwill.<\/p><\/div><\/details><div class=\"qtext\"><p>Assuming fully consistent assumptions and forecasts of key variables across models, which of Koval&#x27;s statements is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q150.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":151,"q":"Based on Exhibit 1 and assuming perpetual and unchanging EPS, Work Shoe's intrinsic value (€) using the justified price-to-book ratio is closest to:","opts":["40","48","50"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a151.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a151.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 28 · Câu 149–154 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dimitri Mazur was recently hired as a junior research analyst at Nivki Partners, a sell-side brokerage firm. Oksana Koval is Mazur&#x27;s supervisor and is responsible for coverin ebp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":155,"q":"Based on Exhibit 1 and assuming no adjustments are needed, Turbo's economic value added (€ millions) is closest to:","opts":["130","180","230"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a155.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a155.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 29 · Câu 155–158 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Ilse Hauser is an investor performing valuations on several companies. She read about Turbo Mechanical in an online article and wants to follow up with her own residual income valuation. Turbo is a rapidly growing auto parts manufacturer with a 6% WACC and 20% tax rate. Hauser compiles Turbo&#x27;s latest financials:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex062.webp\" style=\"max-width:min(100%,379px)\" alt=\"Exhibit\"><p>During her research, Hauser notices that an industry leader, Strasse Industries, plans to acquire a specialty manufacturer, Rennen Auto. Both are mature companies, with no expected future growth, that pay out all of their income as dividends and have required rates of return of 10%. This will remain true after the acquisition. Strasse is acquiring Rennen for €2 billion in an all-cash deal with no planned synergies. Hauser collects financial information on both companies and calculates that Rennen&#x27;s fair value is €2 billion, including its customer list.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex063.webp\" style=\"max-width:min(100%,379px)\" alt=\"Exhibit\"><p>Hauser notices that Strasse has been reporting foreign currency translation losses in other comprehensive income over the past two quarters. Based on her macroeconomic forecast, she expects the PV of future foreign currency translation gains/losses to net to zero.<\/p><p>Reiner Eskelson, another investor Hauser collaborates with, asks Hauser why she uses the residual income model over other discounted cash flow models. Hauser provides the following reasons:<\/p><p><b>Reason 1:<\/b> Residual income can be used even when cash flows are unpredictable.<\/p><p><b>Reason 2:<\/b> Book value is less susceptible to manipulation than income statement metrics.<\/p><p><b>Reason 3:<\/b> The model does not assume the cost of debt is appropriately reflected by interest expense.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and assuming no adjustments are needed, Turbo&#x27;s economic value added (€ millions) is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q155.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":156,"q":"Based on Exhibit 2 and all else equal, if Strasse acquired Rennen with only equity instead of only cash, the combined company's valuation using residual income would be:","opts":["less.","unchanged.","greater."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a156.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a156.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 29 · Câu 155–158 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ilse Hauser is an investor performing valuations on several companies. She read about Turbo Mechanical in an online article and wants to follow up with her own residual income valuation. Turbo is a rapidly growing auto parts manufacturer with a 6% WACC and 20% tax rate. Hauser compiles Turbo&#x27;s latest financials:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex062.webp\" style=\"max-width:min(100%,379px)\" alt=\"Exhibit\"><p>During her research, Hauser notices that an industry leader, Strasse Industries, plans to acquire a specialty manufacturer, Rennen Auto. Both are mature companies, with no expected future growth, that pay out all of their income as dividends and have required rates of return of 10%. This will remain true after the acquisition. Strasse is acquiring Rennen for €2 billion in an all-cash deal with no planned synergies. Hauser collects financial information on both companies and calculates that Rennen&#x27;s fair value is €2 billion, including its customer list.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex063.webp\" style=\"max-width:min(100%,379px)\" alt=\"Exhibit\"><p>Hauser notices that Strasse has been reporting foreign currency translation losses in other comprehensive income over the past two quarters. Based on her macroeconomic forecast, she expects the PV of future foreign currency translation gains/losses to net to zero.<\/p><p>Reiner Eskelson, another investor Hauser collaborates with, asks Hauser why she uses the residual income model over other discounted cash flow models. Hauser provides the following reasons:<\/p><p><b>Reason 1:<\/b> Residual income can be used even when cash flows are unpredictable.<\/p><p><b>Reason 2:<\/b> Book value is less susceptible to manipulation than income statement metrics.<\/p><p><b>Reason 3:<\/b> The model does not assume the cost of debt is appropriately reflected by interest expense.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2 and all else equal, if Strasse acquired Rennen with only equity instead of only cash, the combined company&#x27;s valuation using residual income would be:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q156.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":157,"q":"To accurately estimate future residual income and account for Strasse's foreign currency translation losses, Hauser would most appropriately adjust:","opts":["only net income.","both equity and net income.","neither equity nor net income."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a157.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a157.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 29 · Câu 155–158 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ilse Hauser is an investor performing valuations on several companies. She read about Turbo Mechanical in an online article and wants to follow up with her own residual income valuation. Turbo is a rapidly growing auto parts manufacturer with a 6% WACC and 20% tax rate. Hauser compiles Turbo&#x27;s latest financials:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex062.webp\" style=\"max-width:min(100%,379px)\" alt=\"Exhibit\"><p>During her research, Hauser notices that an industry leader, Strasse Industries, plans to acquire a specialty manufacturer, Rennen Auto. Both are mature companies, with no expected future growth, that pay out all of their income as dividends and have required rates of return of 10%. This will remain true after the acquisition. Strasse is acquiring Rennen for €2 billion in an all-cash deal with no planned synergies. Hauser collects financial information on both companies and calculates that Rennen&#x27;s fair value is €2 billion, including its customer list.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex063.webp\" style=\"max-width:min(100%,379px)\" alt=\"Exhibit\"><p>Hauser notices that Strasse has been reporting foreign currency translation losses in other comprehensive income over the past two quarters. Based on her macroeconomic forecast, she expects the PV of future foreign currency translation gains/losses to net to zero.<\/p><p>Reiner Eskelson, another investor Hauser collaborates with, asks Hauser why she uses the residual income model over other discounted cash flow models. Hauser provides the following reasons:<\/p><p><b>Reason 1:<\/b> Residual income can be used even when cash flows are unpredictable.<\/p><p><b>Reason 2:<\/b> Book value is less susceptible to manipulation than income statement metrics.<\/p><p><b>Reason 3:<\/b> The model does not assume the cost of debt is appropriately reflected by interest expense.<\/p><\/div><\/details><div class=\"qtext\"><p>To accurately estimate future residual income and account for Strasse&#x27;s foreign currency translation losses, Hauser would most appropriately adjust:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q157.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":158,"q":"Which of Hauser's reasons for using the residual income model is correct?","opts":["Reason 1","Reason 2","Reason 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a158.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a158.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 29 · Câu 155–158 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ilse Hauser is an investor performing valuations on several companies. She read about Turbo Mechanical in an online article and wants to follow up with her own residual income valuation. Turbo is a rapidly growing auto parts manufacturer with a 6% WACC and 20% tax rate. Hauser compiles Turbo&#x27;s latest financials:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex062.webp\" style=\"max-width:min(100%,379px)\" alt=\"Exhibit\"><p>During her research, Hauser notices that an industry leader, Strasse Industries, plans to acquire a specialty manufacturer, Rennen Auto. Both are mature companies, with no expected future growth, that pay out all of their income as dividends and have required rates of return of 10%. This will remain true after the acquisition. Strasse is acquiring Rennen for €2 billion in an all-cash deal with no planned synergies. Hauser collects financial information on both companies and calculates that Rennen&#x27;s fair value is €2 billion, including its customer list.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex063.webp\" style=\"max-width:min(100%,379px)\" alt=\"Exhibit\"><p>Hauser notices that Strasse has been reporting foreign currency translation losses in other comprehensive income over the past two quarters. Based on her macroeconomic forecast, she expects the PV of future foreign currency translation gains/losses to net to zero.<\/p><p>Reiner Eskelson, another investor Hauser collaborates with, asks Hauser why she uses the residual income model over other discounted cash flow models. Hauser provides the following reasons:<\/p><p><b>Reason 1:<\/b> Residual income can be used even when cash flows are unpredictable.<\/p><p><b>Reason 2:<\/b> Book value is less susceptible to manipulation than income statement metrics.<\/p><p><b>Reason 3:<\/b> The model does not assume the cost of debt is appropriately reflected by interest expense.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Hauser&#x27;s reasons for using the residual income model is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q158.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":159,"q":"Based on Exhibit 1, assuming Federal Mills' stock price reflects its intrinsic value, its present value of growth opportunities (in $ per share) is closest to:","opts":["41.67","48.33","56.67"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a159.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a159.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 30 · Câu 159–162 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Jeremy Collins and Bridget Parker manage an equity fund of dividend-paying stocks and are conducting a quarterly evaluation of the fund&#x27;s constituents. They are also assessing several companies that have recently initiated dividends for inclusion in the fund. Collins collects information (shown in Exhibit 1) about shares of Federal Mills, which initiated a dividend last year.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex064.webp\" style=\"max-width:min(100%,433px)\" alt=\"Exhibit\"><p>Collins and Parker agree to use the two-stage dividend discount model for Federal Mills, given a short-term boost to earnings growth from a new product. They are discussing the best methods to calculate the terminal value, using the estimated final dividend and earnings values calculated by the model. Parker suggests three alternative methods:<\/p><p><b>Method 1:<\/b> Calculate the terminal year stock price using a price ratio.<\/p><p><b>Method 2:<\/b> Forecast the value of all future dividends using the Gordon growth model.<\/p><p><b>Method 3:<\/b> Calculate the terminal value as the dividend discounted by the long-term growth rate.<\/p><p>For another stock recently added to the fund, Garrison Media, Parker begins calculating the rate of return required by investors based on its current stock price of $15. She expects Garrison&#x27;s dividend growth rate to decline linearly during a transition period before reaching a constant growth rate. Parker&#x27;s estimates are provided in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex065.webp\" style=\"max-width:min(100%,353px)\" alt=\"Exhibit\"><p>Collins then evaluates Traverse Technologies, which initiated a dividend last year. Collins expects Traverse&#x27;s growth to slow in phases from its current pace, but he also believes the company will pay a special dividend. The special dividend does not affect the base dividend used to calculate payments in future years. Collins presents his estimates in Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex066.webp\" style=\"max-width:min(100%,465px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, assuming Federal Mills&#x27; stock price reflects its intrinsic value, its present value of growth opportunities (in $ per share) is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q159.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":160,"q":"Which of Parker's suggested methods of calculating terminal value is least appropriate to use for Federal Mills?","opts":["Method 1","Method 2","Method 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a160.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a160.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 30 · Câu 159–162 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jeremy Collins and Bridget Parker manage an equity fund of dividend-paying stocks and are conducting a quarterly evaluation of the fund&#x27;s constituents. They are also assessing several companies that have recently initiated dividends for inclusion in the fund. Collins collects information (shown in Exhibit 1) about shares of Federal Mills, which initiated a dividend last year.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex064.webp\" style=\"max-width:min(100%,433px)\" alt=\"Exhibit\"><p>Collins and Parker agree to use the two-stage dividend discount model for Federal Mills, given a short-term boost to earnings growth from a new product. They are discussing the best methods to calculate the terminal value, using the estimated final dividend and earnings values calculated by the model. Parker suggests three alternative methods:<\/p><p><b>Method 1:<\/b> Calculate the terminal year stock price using a price ratio.<\/p><p><b>Method 2:<\/b> Forecast the value of all future dividends using the Gordon growth model.<\/p><p><b>Method 3:<\/b> Calculate the terminal value as the dividend discounted by the long-term growth rate.<\/p><p>For another stock recently added to the fund, Garrison Media, Parker begins calculating the rate of return required by investors based on its current stock price of $15. She expects Garrison&#x27;s dividend growth rate to decline linearly during a transition period before reaching a constant growth rate. Parker&#x27;s estimates are provided in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex065.webp\" style=\"max-width:min(100%,353px)\" alt=\"Exhibit\"><p>Collins then evaluates Traverse Technologies, which initiated a dividend last year. Collins expects Traverse&#x27;s growth to slow in phases from its current pace, but he also believes the company will pay a special dividend. The special dividend does not affect the base dividend used to calculate payments in future years. Collins presents his estimates in Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex066.webp\" style=\"max-width:min(100%,465px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of Parker&#x27;s suggested methods of calculating terminal value is least appropriate to use for Federal Mills?<\/p><\/div><detai , Garrison Media, Parker begins calculating the rate of return required by investors based on its current stock price of $15. She expects Garrison&#x27;s dividend growth rate to decline linearly during a transition period before reaching a constant growth rate. Parker&#x27;s estimates are provided in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex065.webp\" style=\"max-width:min(100%,353px)\" alt=\"Exhibit\"><p>Collins then evaluates Traverse Technologies, which initiated a dividend last year. Collins expects Traverse&#x27;s growth to slow in phases from its current pace, but he also believes the company will pay a special dividend. The special dividend does not affect the base dividend used to calculate payments in future years. Collins presents his estimates in Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex066.webp\" style=\"max-width:min(100%,465px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2 and the information provided, Garrison&#x27;s required rate of return is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q161.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":162,"q":"Based on Exhibit 3 and the information provided, Collins's most appropriate conclusion is that Traverse's stock is:","opts":["undervalued.","fairly valued.","overvalued."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a162.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a162.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 30 · Câu 159–162 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jeremy Collins and Bridget Parker manage an equity fund of dividend-paying stocks and are conducting a quarterly evaluation of the fund&#x27;s constituents. They are also assessing several companies that have recently initiated dividends for inclusion in the fund. Collins collects information (shown in Exhibit 1) about shares of Federal Mills, which initiated a dividend last year.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex064.webp\" style=\"max-width:min(100%,433px)\" alt=\"Exhibit\"><p>Collins and Parker agree to use the two-stage dividend discount model for Federal Mills, given a short-term boost to earnings growth from a new product. They are discussing the best methods to calculate the terminal value, using the estimated final dividend and earnings values calculated by the model. Parker suggests three alternative methods:<\/p><p><b>Method 1:<\/b> Calculate the terminal year stock price using a price ratio.<\/p><p><b>Method 2:<\/b> Forecast the value of all future dividends using the Gordon growth model.<\/p><p><b>Method 3:<\/b> Calculate the terminal value as the dividend discounted by the long-term growth rate.<\/p><p>For another stock recently added to the fund, Garrison Media, Parker begins calculating the rate of return required by investors based on its current stock price of $15. She expects Garrison&#x27;s dividend growth rate to decline linearly during a transition period before reaching a constant growth rate. Parker&#x27;s estimates are provided in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex065.webp\" style=\"max-width:min(100%,353px)\" alt=\"Exhibit\"><p>Collins then evaluates Traverse Technologies, which initiated a dividend last year. Collins expects Traverse&#x27;s growth to slow in phases from its current pace, but he also believes the company will pay a special dividend. The special dividend does not affect the base dividend used to calculate payments in future years. Collins presents his estimates in Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex066.webp\" style=\"max-width:min(100%,465px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 3 and the information provided, Collins&#x27;s most appropriate conclusion is that Traverse&#x27;s stock is:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q162.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":163,"q":"Based on Exhibit 1, HR-Pay's value of equity (E millions) using the GPCM is closest to:","opts":["150","165","170"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a163.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a163.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 31 · Câu 163–168 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Axelrod Partners, an investment banking firm, has been retained by two firms, HR-Pay Corp. and Potterville Financial, as each is preparing for an IPO.<\/p><p>HR-Pay is an online payroll and human resource software provider that is rapidly growing market share and revenue but is not yet profitable. HR-Pay is currently in the process of raising equity capital to strengthen its financial position by selling a 5% stake through a restricted stock private placement. This sale will be in advance of the IPO, which is expected to occur in the coming months. No individual shareholder owns more than 25% of HR-Pay.<\/p><p>Catherine Evans, an investment banking analyst at Axelrod, is creating a financial model for HR-Pay while also considering an appropriate valuation for the restricted stock sale. Evans is contemplating whether a discount for lack of marketability (DLOM) for HR-Pay&#x27;s restricted stock is appropriate. Evans believes that using the guideline public company method (GPCM) based on market value of invested capital (MVIC) to EBITDA multiple is an appropriate approach for the IPO valuation. She compiles the following:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex067.webp\" style=\"max-width:min(100%,604px)\" alt=\"Exhibit\"><p>In addition to researching comparable private sales of stock prior to a subsequent IPO, Evans is also considering a DLOM based on an option pricing model, which estimates the DLOM as the value of the option as a percent of HR-Pay&#x27;s price. Evans narrows her choices down to the following three option models, based on:<\/p><p>Option model 1: At-the-money put option<\/p><p>Option model 2: In-the-money call option<\/p><p>Option model 3: Out-of-the-money call option<\/p><p>Evans turns her attention to Potterville, a private financial holding company with affiliated companies that provide traditional banking, investment management, and real estate development. Potterville is wholly owned by a single family, except for a 15% minority equity interest owned by Jim Landry, a private investor. Family members hold all significant management positions in the entire organization.<\/p><p>Potterville needs growth funding to expand the business and intends to sell a 10% equity stake in the IPO. Evans believes that, in this situation, an asset-based valuation approach using the GPCM is appropriate. Based on this information and her own estimates, Evans&#x27;s initial valuation estimate for Potterville is £100 million.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, HR-Pay&#x27;s value of equity (E millions) using the GPCM is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q163.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":164,"q":"Relative to a comparable publicly traded firm, the most appropriate valuation discount for lack of marketability of HR-Pay's private placement is:","opts":["zero, since those shares could be sold during the IPO.","modest, since the shares are liquid soon after the IPO.","substantial, since the shares are restricted and the IPO is uncertain."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a164.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a164.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 31 · Câu 163–168 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Axelrod Partners, an investment banking firm, has been retained by two firms, HR-Pay Corp. and Potterville Financial, as each is preparing for an IPO.<\/p><p>HR-Pay is an online payroll and human resource software provider that is rapidly growing market share and revenue but is not yet profitable. HR-Pay is currently in the process of raising equity capital to strengthen its financial position by selling a 5% stake through a restricted stock private placement. This sale will be in advance of the IPO, which is expected to occur in the coming months. No individual shareholder owns more than 25% of HR-Pay.<\/p><p>Catherine Evans, an investment banking analyst at Axelrod, is creating a financial model for HR-Pay while also considering an appropriate valuation for the restricted stock sale. Evans is contemplating whether a discount for lack of marketability (DLOM) for HR-Pay&#x27;s restricted stock is appropriate. Evans believes that using the guideline public company method (GPCM) based on market value of invested capital (MVIC) to EBITDA multiple is an appropriate approach for the IPO valuation. She compiles the following:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex067.webp\" style=\"max-width:min(100%,604px)\" alt=\"Exhibit\"><p>In addition to researching comparable private sales of stock prior const CFG = {"title": "UWorld — Equity Valuation", "subtitle": "CFA Level II · 168 câu · UWorld item sets", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");

  renderSubjectBreakdown();

let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
