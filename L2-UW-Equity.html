quity shares and borrowed SGD 1.3 million.<\/p><p>There are no notes payable, and all debt is long term.<\/p><p>The company classifies interest paid as cash from operations (CFO).<\/p><p>Howard estimated Horizon ElectroCar&#x27;s per-share FCFE for 20X0 to be SGD 2.50. The applicable risk-free interest rate is 2%. Exhibit 2 shows Howard&#x27;s estimates for the ranges of inputs used to value Horizon ElectroCar with a constant-growth FCFE model:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex041.webp\" style=\"max-width:min(100%,527px)\" alt=\"Exhibit\"><p>Howard is also evaluating Innovation Resources, which is located in Chad, where there has been high inflation in recent years. Relevant information concerning Chad and Innovation Resources is shown in Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex042.webp\" style=\"max-width:min(100%,580px)\" alt=\"Exhibit\"><p>Finally, although Howard understands the endowment fund&#x27;s rationale for valuing equity investments based on the company&#x27;s free cash flow (FCF), she believes that other metrics can be adequate substitutes for FCF. She makes the following statements to support her position:<\/p><p><b>Statement 1:<\/b> If a company makes no investment in fixed capital, then EBITDA can be used as a proxy for FCFF.<\/p><p><b>Statement 2:<\/b> CFO is the same as FCFE if the company&#x27;s investment in PPE is equal to its net amount of borrowing.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Howard&#x27;s statements concerning the use of other measures as proxies for FCF is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q110.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":111,"q":"Based on the information available to him, Diakos calculates Othonos Retailers' justified forward PIE ratio using the method:","opts":["of comparables.","of historical average EPS.","based on forecasted fundamentals."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a111.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a111.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 111–116 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Hector Diakos is a financial analyst at an asset management firm. His supervisor, Penelope Panagos, asks him to research three companies from different industries— Othonos Retailers, Sagitta Health, and Galatas Airlines— and update their valuations.<\/p><p>First, Diakos analyzes Othonos, whose stock is currently trading at €45.50. He decides to value the stock by comparing the forward P/E ratio, based on current market price, with a justified forward P/E ratio. Diakos:<\/p><p>estimates an EPS of €3.50 for the next year (ie, the next four quarters),<\/p><p>builds a FCFE model that values the stock at €49.00, and<\/p><p>calculates a justified forward P/E ratio.<\/p><p>Panagos adds that the retail industry currently has an average forward P/E of 12.0.<\/p><p>Diakos tells Panagos that he valued the shares of Sagitta Health and Galatas Airlines as of 1 January 20X9. The data used in his analysis are summarized in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex043.webp\" style=\"max-width:min(100%,609px)\" alt=\"Exhibit\"><p>Diakos evaluated Sagitta&#x27;s stock using three different price multiples: forward P/E, price-to-sales (P/S), and price-to-book value (P/B). He explains the rationales supporting the use of each approach to Panagos:<\/p><p><b>Statement 1:<\/b> P/E ratios do not require adjustments if EPS is positive.<\/p><p><b>Statement 2:<\/b> P/S ratios are less subject to manipulation than P/E or P/B.<\/p><p><b>Statement 3:<\/b> P/B ratios are deemed appropriate to value mature and cyclical companies.<\/p><p>Panagos then asks about Galatas Airlines. Diakos explains that the company&#x27;s business is extremely sensitive to business-cycle influences, which results in large variations in its annual earnings from one year to another. Therefore, Diakos calculates a normalized P/E ratio using the average return on equity (ROE) method. The 20X4–20X8 period in Exhibit 2 represents a full business cycle for Galatas.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex044.webp\" style=\"max-width:min(100%,511px)\" alt=\"Exhibit\"><p>Panagos wants to compare Galatas with competitors in the airline industry. She is concerned, however, that it would not be possible to rank the stocks according to multiples since several competitors frequently experience negative earnings. Diakos proposes a solution for ranking the stocks.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the information available to him, Diakos calculates Othonos Retailers&#x27; justified forward PIE ratio using the method:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q111.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":112,"q":"All else equal, and based on the method of comparables, Othonos Retailers' stock is currently:","opts":["undervalued.","fairly valued.","overvalued."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a112.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a112.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 111–116 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Hector Diakos is a financial analyst at an asset management firm. His supervisor, Penelope Panagos, asks him to research three companies from different industries— Othonos Retailers, Sagitta Health, and Galatas Airlines— and update their valuations.<\/p><p>First, Diakos analyzes Othonos, whose stock is currently trading at €45.50. He decides to value the stock by comparing the forward P/E ratio, based on current market price, with a justified forward P/E ratio. Diakos:<\/p><p>estimates an EPS of €3.50 for the next year (ie, the next four quarters),<\/p><p>builds a FCFE model that values the stock at €49.00, and<\/p><p>calculates a justified forward P/E ratio.<\/p><p>Panagos adds that the retail industry currently has an average forward P/E of 12.0.<\/p><p>Diakos tells Panagos that he valued the shares of Sagitta Health and Galatas Airlines as of 1 January 20X9. The data used in his analysis are summarized in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex043.webp\" style=\"max-width:min(100%,609px)\" alt=\"Exhibit\"><p>Diakos evaluated Sagitta&#x27;s stock using three different price multiples: forward P/E, price-to-sales (P/S), and price-to-book value (P/B). He explains the rationales supporting the use of each approach to Panagos:<\/p><p><b>Statement 1:<\/b> P/E ratios do not require adjustments if EPS is positive.<\/p><p><b>Statement 2:<\/b> P/S ratios are less subject to manipulation than P/E or P/B.<\/p><p><b>Statement 3:<\/b> P/B ratios are deemed appropriate to value mature and cyclical companies.<\/p><p>Panagos then asks about Galatas Airlines. Diakos explains that the company&#x27;s business is extremely sensitive to business-cycle influences, which results in large variations in its annual earnings from one year to another. Therefore, Diakos calculates a normalized P/E ratio using the average return on equity (ROE) method. The 20X4–20X8 period in Exhibit 2 represents a full business cycle for Galatas.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex044.webp\" style=\"max-width:min(100%,511px)\" alt=\"Exhibit\"><p>Panagos wants to compare Galatas with competitors in the airline industry. She is concerned, however, that it would not be possible to rank the stocks according to multiples since several competitors frequently experience negative earnings. Diakos proposes a solution for ranking the stocks.<\/p><\/div><\/details><div class=\"qtext\"><p>All else equal, and based on the method of comparables, Othonos Retailers&#x27; stock is currently:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q112.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":113,"q":"Based on Exhibit 1, which of the following multiples for Sagitta is correct?","opts":["Forward P/E is 10.00","Price-to-sales is 1.25","Price-to-book value is 2.00"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a113.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a113.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 111–116 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Hector Diakos is a financial analyst at an asset management firm. His supervisor, Penelope Panagos, asks him to research three companies from different industries— Othonos Retailers, Sagitta Health, and Galatas Airlines— and update their valuations.<\/p><p>First, Diakos analyzes Othonos, whose stock is currently trading at €45.50. He decides to value the stock by comparing the forward P/E ratio, based on current market price, with a justified forward P/E ratio. Diakos:<\/p><p>estimates an EPS of €3.50 for the next year (ie, the next four quarters),<\/p><p>builds a FCFE model that values the stock at €49.00, and<\/p><p>calculates a justified forward P/E ratio.<\/p><p>Panagos adds that the retail industry currently has an average forward P/E of 12.0.<\/p><p>Diakos tells Panagos that he valued the shares of Sagitta Health and Galatas Airlines as of 1 January 20X9. The data used in his analysis are summarized in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex043.webp\" style=\"max-width:min(100%,609px)\" alt=\"Exhibit\"><p>Diakos evaluated Sagitta&#x27;s stock using three different price multiples: forward P/E, price-to-sales (P/S), and price-to-book value (P/B). He explains the rationales supporting the use of each approach to Panagos:<\/p><p><b>Statement 1:<\/b> P/E ratios do not require adjustments if EPS is positive.<\/p><p><b>Statement 2:<\/b> P/S ratios are less subject to manipulation than P/E or P/B.<\/p><p><b>Statement 3:<\/b> P/B ratios are deemed appropriate to value mature and cyclical companies.<\/p><p>Panagos then asks about Galatas Airlines. Diakos explains that the company&#x27;s business is extremely sensitive to business-cycle influences, which results in large variations in its annual earnings from one year to another. Therefore, Diakos calculates a normalized P/E ratio using the average return on equity (ROE) method. The 20X4–20X8 period in Exhibit 2 represents a full business cycle for Galatas.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex044.webp\" style=\"max-width:min(100%,511px)\" alt=\"Exhibit\"><p>Panagos wants to compare Galatas with competitors in the airline industry. She is concerned, however, that it would not be possible to rank the stocks according to multiples since several competitors frequently experience negative earnings. Diakos proposes a solution for ranking the stocks.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, which of the following multiples for Sagitta is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q113.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":114,"q":"Which of Panagos's statement anipulation than P/E or P/B.<\/p><p><b>Statement 3:<\/b> P/B ratios are deemed appropriate to value mature and cyclical companies.<\/p><p>Panagos then asks about Galatas Airlines. Diakos explains that the company&#x27;s business is extremely sensitive to business-cycle influences, which results in large variations in its annual earnings from one year to another. Therefore, Diakos calculates a normalized P/E ratio using the average return on equity (ROE) method. The 20X4–20X8 period in Exhibit 2 represents a full business cycle for Galatas.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex044.webp\" style=\"max-width:min(100%,511px)\" alt=\"Exhibit\"><p>Panagos wants to compare Galatas with competitors in the airline industry. She is concerned, however, that it would not be possible to rank the stocks according to multiples since several competitors frequently experience negative earnings. Diakos proposes a solution for ranking the stocks.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Panagos&#x27;s statements about price multiples is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q114.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":115,"q":"Based on Exhibits 1 and 2, Galatas's normalized P/E ratio using the average return on equity method is closest to:","opts":["6.0","6.3","6.7"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a115.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a115.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 111–116 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Hector Diakos is a financial analyst at an asset management firm. His supervisor, Penelope Panagos, asks him to research three companies from different industries— Othonos Retailers, Sagitta Health, and Galatas Airlines— and update their valuations.<\/p><p>First, Diakos analyzes Othonos, whose stock is currently trading at €45.50. He decides to value the stock by comparing the forward P/E ratio, based on current market price, with a justified forward P/E ratio. Diakos:<\/p><p>estimates an EPS of €3.50 for the next year (ie, the next four quarters),<\/p><p>builds a FCFE model that values the stock at €49.00, and<\/p><p>calculates a justified forward P/E ratio.<\/p><p>Panagos adds that the retail industry currently has an average forward P/E of 12.0.<\/p><p>Diakos tells Panagos that he valued the shares of Sagitta Health and Galatas Airlines as of 1 January 20X9. The data used in his analysis are summarized in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex043.webp\" style=\"max-width:min(100%,609px)\" alt=\"Exhibit\"><p>Diakos evaluated Sagitta&#x27;s stock using three different price multiples: forward P/E, price-to-sales (P/S), and price-to-book value (P/B). He explains the rationales supporting the use of each approach to Panagos:<\/p><p><b>Statement 1:<\/b> P/E ratios do not require adjustments if EPS is positive.<\/p><p><b>Statement 2:<\/b> P/S ratios are less subject to manipulation than P/E or P/B.<\/p><p><b>Statement 3:<\/b> P/B ratios are deemed appropriate to value mature and cyclical companies.<\/p><p>Panagos then asks about Galatas Airlines. Diakos explains that the company&#x27;s business is extremely sensitive to business-cycle influences, which results in large variations in its annual earnings from one year to another. Therefore, Diakos calculates a normalized P/E ratio using the average return on equity (ROE) method. The 20X4–20X8 period in Exhibit 2 represents a full business cycle for Galatas.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex044.webp\" style=\"max-width:min(100%,511px)\" alt=\"Exhibit\"><p>Panagos wants to compare Galatas with competitors in the airline industry. She is concerned, however, that it would not be possible to rank the stocks according to multiples since several competitors frequently experience negative earnings. Diakos proposes a solution for ranking the stocks.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibits 1 and 2, Galatas&#x27;s normalized P/E ratio using the average return on equity method is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q115.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":116,"q":"Given Panagos's concern with negative earnings, and to allow for a meaningful ranking of relative value in the airline industry under any circumstances, Panagos should most appropriately:","opts":["use an inverse price ratio such as earnings yield (E/P).","use the forward P/E ratio instead of the trailing P/E ratio.","remove all nonrecurring items from the companies' earnings."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a116.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a116.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 111–116 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Hector Diakos is a financial analyst at an asset management firm. His supervisor, Penelope Panagos, asks him to research three companies from different industries— Othonos Retailers, Sagitta Health, and Galatas Airlines— and update their valuations.<\/p><p>First, Diakos analyzes Othonos, whose stock is currently trading at €45.50. He decides to value the stock by comparing the forward P/E ratio, based on current market price, with a justified forward P/E ratio. Diakos:<\/p><p>estimates an EPS of €3.50 for the next year (ie, the next four quarters),<\/p><p>builds a FCFE model that values the stock at €49.00, and<\/p><p>calculates a justified forward P/E ratio.<\/p><p>Panagos adds that the retail industry currently has an average forward P/E of 12.0.<\/p><p>Diakos tells Panagos that he valued the shares of Sagitta Health and Galatas Airlines as of 1 January 20X9. The data used in his analysis are summarized in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex043.webp\" style=\"max-width:min(100%,609px)\" alt=\"Exhibit\"><p>Diakos evaluated Sagitta&#x27;s stock using three different price multiples: forward P/E, price-to-sales (P/S), and price-to-book value (P/B). He explains the rationales supporting the use of each approach to Panagos:<\/p><p><b>Statement 1:<\/b> P/E ratios do not require adjustments if EPS is positive.<\/p><p><b>Statement 2:<\/b> P/S ratios are less subject to manipulation than P/E or P/B.<\/p><p><b>Statement 3:<\/b> P/B ratios are deemed appropriate to value mature and cyclical companies.<\/p><p>Panagos then asks about Galatas Airlines. Diakos explains that the company&#x27;s business is extremely sensitive to business-cycle influences, which results in large variations in its annual earnings from one year to another. Therefore, Diakos calculates a normalized P/E ratio using the average return on equity (ROE) method. The 20X4–20X8 period in Exhibit 2 represents a full business cycle for Galatas.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex044.webp\" style=\"max-width:min(100%,511px)\" alt=\"Exhibit\"><p>Panagos wants to compare Galatas with competitors in the airline industry. She is concerned, however, that it would not be possible to rank the stocks according to multiples since several competitors frequently experience negative earnings. Diakos proposes a solution for ranking the stocks.<\/p><\/div><\/details><div class=\"qtext\"><p>Given Panagos&#x27;s concern with negative earnings, and to allow for a meaningful ranking of relative value in the airline industry under any circumstances, Panagos should most<\/p><p>appropriately:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q116.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":117,"q":"Based on Exhibit 1 and Schmidt's concerns, RamCo's normalized earnings ($ millions) are closest to:","opts":["2.53","2.61","2.73"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a117.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a117.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 117–120 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Quality Roofing, Inc. is a successful, privately owned regional roofing company. CEO Amanda Gagnon has approval from Quality&#x27;s board to pursue acquiring its main supplier of roofing materials, privately held RamCo, Inc. Gagnon asks CFO Brady Schmidt to analyze RamCo&#x27;s financials. Schmidt reviews the income statement, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex045.webp\" style=\"max-width:min(100%,458px)\" alt=\"Exhibit\"><p>Schmidt notes that RamCo has minimal debt and stable long-term revenue growth of 4%, but he has concerns about two SG&amp;A items:<\/p><p>Executive compensation of $1.25 million<\/p><p>Non-business-related CEO personal expenses of $0.10 million<\/p><p>Schmidt observes that the market rate for executive compensation is $0.75 million. He also sees that RamCo has $1.60 million of debt with an interest rate of 8.75%. Gagnon confirms that Quality Roofing would prefer not to change RamCo&#x27;s debt load.<\/p><p>Schmidt consults with an independent appraiser to help him estimate an optimal value for RamCo. The appraiser suggests that Quality Roofing value RamCo using the capitalized cash flow method (CCM). He indicates to Schmidt that although no public company comparables are available, an adjustment for industry risk is warranted for this transaction. He also makes additional comments related to the challenges of estimating the required rate of return for a private company:<\/p><p><b>Comment 1:<\/b> Compared with a similar public company, the lack of information concerning a private company&#x27;s operations introduces greater uncertainty and may lead to a higher required rate of return.<\/p><p><b>Comment 2:<\/b> In an evaluation of an acquisition, finance theory indicates that the cost of capital should be based on the buyer&#x27;s capital structure and the riskiness of its cash flows.<\/p><p>Finally, the appraiser and Schmidt gather additional data on RamCo, shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex046.webp\" style=\"max-width:min(100%,580px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and Schmidt&#x27;s concerns, RamCo&#x27;s normalized earnings ($ millions) are closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q117.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":118,"q":"To incorporate an industry risk premium into RamCo's valuation, the required cost of equity is most appropriately calculated based on the:","opts":["expanded CAPM.","build-up approach.","guideline transactions method."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a118.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a118.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 117–120 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Quality Roofing, Inc. is a successful, privately owned regional roofing company. CEO Amanda Gagnon has approval from Quality&#x27;s board to pursue acquiring its main supplier of roofing materials, privately held RamCo, Inc. Gagnon asks CFO Brady Schmidt to analyze RamCo&#x27;s financials. Schmidt reviews the income statement, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex045.webp\" style=\"max-width:min(100%,458px)\" alt=\"Exhibit\"><p>Schmidt notes that RamCo has minimal debt and stable long-term revenue growth of 4%, but he has concerns about two SG&amp;A items:<\/p><p>Executive compensation of $1.25 million<\/p><p>Non-business-related CEO personal expenses of $0.10 million<\/p><p>Schmidt observes that the market rate for executive compensation is $0.75 million. He also sees that RamCo has $1.60 million of debt with an interest rate of 8.75%. Gagnon confirms that Quality Roofing would prefer not to change RamCo&#x27;s debt load.<\/p><p>Schmidt consults with an independent appraiser to help him estimate an optimal value for RamCo. The appraiser suggests that Quality Roofing value RamCo using the capitalized cash flow method (CCM). He indicates to Schmidt that although no public company comparables are available, an adjustment for industry risk is warranted for this transaction. He also makes additional comments related to the challenges of estimating the required rate of return for a private company:<\/p><p><b>Comment 1:<\/b> Compared with a similar public company, the lack of information concerning a private company&#x27;s operations introduces greater uncertainty and may lead to a higher required rate of return.<\/p><p><b>Comment 2:<\/b> In an evaluation of an acquisition, finance theory indicates that the cost of capital should be based on the buyer&#x27;s capital structure and the riskiness of its cash flows.<\/p><p>Finally, the appraiser and Schmidt gather additional data on RamCo, shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex046.webp\" style=\"max-width:min(100%,580px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>To incorporate an industry risk premium into RamCo&#x27;s valuation, the required cost of equity is most appropriately calculated based on the:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q118.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":119,"q":"Which of the appraiser's comments on the challenges of estimating the required rate of return is (are) correct?","opts":["Only Comment 1","Only Comment 2","Both Comment 1 and Comment 2"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a119.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a119.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 117–120 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Quality Roofing, Inc. is a successful, privately owned regional roofing company. CEO Amanda Gagnon has approval from Quality&#x27;s board to pursue acquiring its main supplier of roofing materials, privately held RamCo, Inc. Gagnon asks CFO Brady Schmidt to analyze RamCo&#x27;s financials. Schmidt reviews the income statement, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex045.webp\" style=\"max-width:min(100%,458px)\" alt=\"Exhibit\"><p>Schmidt notes that RamCo has minimal debt and stable long-term revenue growth of 4%, but he has concerns about two SG&amp;A items:<\/p><p>Executive compensation of $1.25 million<\/p><p>Non-business-related CEO personal expenses of $0.10 million<\/p><p>Schmidt observes that the market rate for executive compensation is $0.75 million. He also sees that RamCo has $1.60 million of debt with an interest rate of 8.75%. Gagnon confirms that Quality Roofing would prefer not to change RamCo&#x27;s debt load.<\/p><p>Schmidt consults with an independent appraiser to help him estimate an optimal value for RamCo. The appraiser suggests that Quality Roofing value RamCo using the capitalized cash flow method (CCM). He indicates to Schmidt that although no public company comparables are available, an adjustment for industry risk is warranted for this transaction. He also makes additional comments related to the challenges of estimating the required rate of return for a private company:<\/p><p><b>Comment 1:<\/b> Compared with a similar public company, the lack of information concerning a private company&#x27;s operations introduces greater uncertainty and may lead to a higher required rate of return.<\/p><p><b>Comment 2:<\/b> In an evaluation of an acquisition, finance theory indicates that the cost of capital should be based on the buyer&#x27;s capital structure and the riskiness of its cash flows.<\/p><p>Finally, the appraiser and Schmidt gather additional data on RamCo, shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex046.webp\" style=\"max-width:min(100%,580px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of the appraiser&#x27;s comments on the challenges of estimating the required rate of return is (are) correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q119.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":120,"q":"Based on Exhibit 1, Exhibit 2, and Schmidt's observations, RamCo's forecasted firm value ($ millions) using the CCM is closest to:","opts":["51.03","51.78","53.38"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a120.webp ainty and may lead to a higher required rate of return.<\/p><p><b>Comment 2:<\/b> In an evaluation of an acquisition, finance theory indicates that the cost of capital should be based on the buyer&#x27;s capital structure and the riskiness of its cash flows.<\/p><p>Finally, the appraiser and Schmidt gather additional data on RamCo, shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex046.webp\" style=\"max-width:min(100%,580px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, Exhibit 2, and Schmidt&#x27;s observations, RamCo&#x27;s forecasted firm value ($ millions) using the CCM is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q120.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":121,"q":"Based on Exhibit 1, in 20X1 Starlight's FCFE (EUR thousands) is closest to:","opts":["11,400","11,500","13,000"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a121.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a121.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 23 · Câu 121–126 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Marina Slevin, CFA, is an equities analyst for a hedge fund. She is analyzing three companies as investment candidates for the fund.<\/p><p>Starlight Industries<\/p><p>Starlight Industries is a publicly traded company that reports financial results under IFRS. Slevin&#x27;s research on Starlight produces the following information:<\/p><p>One family owns 60% of the common shares and occupies 12 of the 20 seats on Starlight&#x27;s board of directors.<\/p><p>Starlight is capitalized with 30% long-term debt and 70% common equity. The average interest rate on its debt is 8%.<\/p><p>Starlight recently began paying dividends, and Slevin believes the company has the ability to greatly increase its dividend payout since the cash reported on its balance sheet has increased each year.<\/p><p>Starlight&#x27;s tax rate is 25%.<\/p><p>Exhibit 1 shows relevant financial information for Starlight:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex047.webp\" style=\"max-width:min(100%,488px)\" alt=\"Exhibit\"><p>Slevin&#x27;s supervisor asks her to estimate an intrinsic value for Starlight using either free cash flow to the firm (FCFF) or free cash flow to equity (FCFE). Slevin makes the following statements in response:<\/p><p><b>Statement 1:<\/b> When a company pays dividends, using a dividend discount model is more appropriate than using a free cash flow model.<\/p><p><b>Statement 2:<\/b> For Starlight, a dividend discount model would be more appropriate than a free cash flow model since the company is family controlled.<\/p><p>Her supervisor insists, however, so Slevin is determining whether to use FCFF or FCFE to value Starlight. She offers the following rationales to her supervisor for using FCFE<\/p><p><b>Rationale 1:<\/b> FCFF is not useful for valuing a firm&#x27;s equity when the firm uses debt in its capital structure.<\/p><p><b>Rationale 2:<\/b> If Starlight&#x27;s capital structure remains stable, it is simpler to use FCFE to value its equity than FCFF.<\/p><p>Slevin&#x27;s supervisor tells her that she could also use cash flow from operations (CFO) as a starting point to derive Starlight&#x27;s FCFF and asks what adjustments to reported CFO would be needed. Slevin makes the following observations in response:<\/p><p>Observation 1:One adjustment to CFO is to subtract changes in the company&#x27;s working capital.<\/p><p>Observation 2:Another adjustment to CFO is to add back depreciation expense.<\/p><p>Observation 3:If Starlight treats interest paid as financing cash flow, then the after-tax interest paid would be added back to CFO.<\/p><p>Deejon Enterprises<\/p><p>Slevin is also evaluating Deejon Enterprises, which is a privately owned foreign company. Slevin&#x27;s assumptions about and estimates for Deejon are shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex048.webp\" style=\"max-width:min(100%,548px)\" alt=\"Exhibit\"><p>Horn Trading Corp.<\/p><p>Finally, Slevin analyzes Horn Trading Corp., a publicly traded company based in the United States. She estimates that Horn Trading&#x27;s FCFF will grow at a constant 2% each year. Relevant information concerning Horn Trading is shown in<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex049.webp\" style=\"max-width:min(100%,394px)\" alt=\"Exhibit\"><p>Exhibit 3:<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, in 20X1 Starlight&#x27;s FCFE (EUR thousands) is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q121.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":122,"q":"Which of Slevin's statements is (are) correct?","opts":["Only Statement 1","Both Statement 1 and Statement 2","Neither Statement 1 nor Statement 2"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a122.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a122.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 23 · Câu 121–126 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marina Slevin, CFA, is an equities analyst for a hedge fund. She is analyzing three companies as investment candidates for the fund.<\/p><p>Starlight Industries<\/p><p>Starlight Industries is a publicly traded company that reports financial results under IFRS. Slevin&#x27;s research on Starlight pro ent 2:<\/b> For Starlight, a dividend discount model would be more appropriate than a free cash flow model since the company is family controlled.<\/p><p>Her supervisor insists, however, so Slevin is determining whether to use FCFF or FCFE to value Starlight. She offers the following rationales to her supervisor for using FCFE<\/p><p><b>Rationale 1:<\/b> FCFF is not useful for valuing a firm&#x27;s equity when the firm uses debt in its capital structure.<\/p><p><b>Rationale 2:<\/b> If Starlight&#x27;s capital structure remains stable, it is simpler to use FCFE to value its equity than FCFF.<\/p><p>Slevin&#x27;s supervisor tells her that she could also use cash flow from operations (CFO) as a starting point to derive Starlight&#x27;s FCFF and asks what adjustments to reported CFO would be needed. Slevin makes the following observations in response:<\/p><p>Observation 1:One adjustment to CFO is to subtract changes in the company&#x27;s working capital.<\/p><p>Observation 2:Another adjustment to CFO is to add back depreciation expense.<\/p><p>Observation 3:If Starlight treats interest paid as financing cash flow, then the after-tax interest paid would be added back to CFO.<\/p><p>Deejon Enterprises<\/p><p>Slevin is also evaluating Deejon Enterprises, which is a privately owned foreign company. Slevin&#x27;s assumptions about and estimates for Deejon are shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex048.webp\" style=\"max-width:min(100%,548px)\" alt=\"Exhibit\"><p>Horn Trading Corp.<\/p><p>Finally, Slevin analyzes Horn Trading Corp., a publicly traded company based in the United States. She estimates that Horn Trading&#x27;s FCFF will grow at a constant 2% each year. Relevant information concerning Horn Trading is shown in<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex049.webp\" style=\"max-width:min(100%,394px)\" alt=\"Exhibit\"><p>Exhibit 3:<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2, the Trading Corp., a publicly traded company based in the United States. She estimates that Horn Trading&#x27;s FCFF will grow at a constant 2% each year. Relevant information concerning Horn Trading is shown in<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex049.webp\" style=\"max-width:min(100%,394px)\" alt=\"Exhibit\"><p>Exhibit 3:<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 3 and her estimate of Horn Trading&#x27;s intrinsic value using a FCFF model, Slevin would most appropriately conclude that the market value of Horn Trading&#x27;s equity is:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q126.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":127,"q":"Based on Exhibit 1, in 20X1, the FCFF for Snowcap Solutions (in € millions) is closest to:","opts":["1,560","2,560","3,400"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a127.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a127.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 24 · Câu 127–132 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Sofia Almado is a research analyst with a large European investment bank. The bank&#x27;s management is considering three companies for recommendation to its clients: Snowcap Solutions, Broadview Analytics, and Evermore Inc. Almado is charged with preparing valuations for each.<\/p><p>Selected data from the financial statements for Snowcap is shown in Exhibit 1, which Almado will use to derive FCFF. Snowcap&#x27;s applicable tax rate is 30%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex050.webp\" style=\"max-width:min(100%,419px)\" alt=\"Exhibit\"><p>One of Almado&#x27;s colleagues asked her why she used FCFF instead of FCFE to value Snowcap. She responded with several ideas.<\/p><p>Broadview plans to repurchase common stock. The most recent annual FCFE for Broadview is €375 million, but Almado wishes to understand how the FCFE would be affected by planned stock repurchases totaling €30 million during the same period. Exhibit 2 shows selected financial data for Broadview:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex051.webp\" style=\"max-width:min(100%,424px)\" alt=\"Exhibit\"><p>Almado believes FCF models are the best option for estimating Broadview&#x27;s value. Her manager, however, states that since Broadview has paid steady dividends for several years, a better option would be to use dividend discount models (DDM). Almado counters that she would normally agree, but Broadview has characteristics that led her to choose FCF valuation. Among them, she states that Broadview has:<\/p><p><b>Reason 1:<\/b> Low dividends relative to its positive FCFE<\/p><p><b>Reason 2:<\/b> A diverse investor base without concentrated stock positions<\/p><p><b>Reason 3:<\/b> Profitability that does not align with FCF over the forecast period<\/p><p>Finally, Almado is reviewing Evermore&#x27;s financials as part of her analysis. She is interested in calculating the company&#x27;s FCFF from its reported net income. She needs to determine the proper treatment of the following noncash items:<\/p><p>Item 1:An impairment charge for an intangible asset<\/p><p>Item 2:A noncash gain related to nonoperating activities<\/p><p>Item 3:Amortization of discounts related to the purchase of long-term bond holdings<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, in 20X1, the FCFF for Snowcap Solutions (in € millions) is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q127.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":128,"q":"Almado's most appropriate response to her colleague is that s ounters that she would normally agree, but Broadview has characteristics that led her to choose FCF valuation. Among them, she states that Broadview has:<\/p><p><b>Reason 1:<\/b> Low dividends relative to its positive FCFE<\/p><p><b>Reason 2:<\/b> A diverse investor base without concentrated stock positions<\/p><p><b>Reason 3:<\/b> Profitability that does not align with FCF over the forecast period<\/p><p>Finally, Almado is reviewing Evermore&#x27;s financials as part of her analysis. She is interested in calculating the company&#x27;s FCFF from its reported net income. She needs to determine the proper treatment of the following noncash items:<\/p><p>Item 1:An impairment charge for an intangible asset<\/p><p>Item 2:A noncash gain related to nonoperating activities<\/p><p>Item 3:Amortization of discounts related to the purchase of long-term bond holdings<\/p><\/div><\/details><div class=\"qtext\"><p>Almado&#x27;s most appropriate response to her colleague is that she chose to use FCFF since Snowcap has a:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q128.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":129,"q":"All else equal, after the planned stock repurchases, Broadview's FCFE would most likely be:","opts":["smaller.","unchanged.","larger."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a129.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a129.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 24 · Câu 127–132 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sofia Almado is a research analyst with a large European investment bank. The bank&#x27;s management is considering three companies for recommendation to its clients: Snowcap Solutions, Broadview Analytics, and Evermore Inc. Almado is charged with preparing valuations for each.<\/p><p>Selected data from the financial statements for Snowcap is shown in Exhibit 1, which Almado will use to derive FCFF. Snowcap&#x27;s applicable tax rate is 30%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex050.webp\" style=\"max-width:min(100%,419px)\" alt=\"Exhibit\"><p>One of Almado&#x27;s colleagues asked her why she used FCFF instead of FCFE to value Snowcap. She responded with several ideas.<\/p><p>Broadview plans to repurchase common stock. The most recent annual FCFE for Broadview is €375 million, but Almado wishes to understand how the FCFE would be affected by planned stock repurchases totaling €30 million during the same period. Exhibit 2 shows selected financial data for Broadview:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex051.webp\" style=\"max-width:min(100%,424px)\" alt=\"Exhibit\"><p>Almado believes FCF models are the best option for estimating Broadview&#x27;s value. Her manager, however, states that since Broadview has paid steady dividends for several years, a better option would be to use dividend discount models (DDM). Almado counters that she would normally agree, but Broadview has characteristics that led her to choose FCF valuation. Among them, she states that Broadview has:<\/p><p><b>Reason 1:<\/b> Low dividends relative to its positive FCFE<\/p><p><b>Reason 2:<\/b> A diverse investor base without concentrated stock positions<\/p><p><b>Reason 3:<\/b> Profitability that does not align with FCF over the forecast period<\/p><p>Finally, Almado is reviewing Evermore&#x27;s financials as part of her analysis. She is interested in calculating the company&#x27;s FCFF from its reported net income. She needs to determine the proper treatment of the following noncash items:<\/p><p>Item 1:An impairment charge for an intangible asset<\/p><p>Item 2:A noncash gain related to nonoperating activiti html":"<a href=\"l2img/uw-equity/a131.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a131.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 24 · Câu 127–132 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sofia Almado is a research analyst with a large European investment bank. The bank&#x27;s management is considering three companies for recommendation to its clients: Snowcap Solutions, Broadview Analytics, and Evermore Inc. Almado is charged with preparing valuations for each.<\/p><p>Selected data from the financial statements for Snowcap is shown in Exhibit 1, which Almado will use to derive FCFF. Snowcap&#x27;s applicable tax rate is 30%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex050.webp\" style=\"max-width:min(100%,419px)\" alt=\"Exhibit\"><p>One of Almado&#x27;s colleagues asked her why she used FCFF instead of FCFE to value Snowcap. She responded with several ideas.<\/p><p>Broadview plans to repurchase common stock. The most recent annual FCFE for Broadview is €375 million, but Almado wishes to understand how the FCFE would be affected by planned stock repurchases totaling €30 million during the same period. Exhibit 2 shows selected financial data for Broadview:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex051.webp\" style=\"max-width:min(100%,424px)\" alt=\"Exhibit\"><p>Almado believes FCF models are the best option for estimating Broadview&#x27;s value. Her manager, however, states that since Broadview has paid steady dividends for several years, a better option would be to use dividend discount models (DDM). Almado counters that she would normally agree, but Broadview has characteristics that led her to choose FCF valuation. Among them, she states that Broadview has:<\/p><p><b>Reason 1:<\/b> Low dividends relative to its positive FCFE<\/p><p><b>Reason 2:<\/b> A diverse investor base without concentrated stock positions<\/p><p><b>Reason 3:<\/b> Profitability that does not align with FCF over the forecast period<\/p><p>Finally, Almado is reviewing Evermore&#x27;s financials as part of her analysis. She is interested in calculating the company&#x27;s FCFF from its reported net income. She needs to determine the proper treatment of the following noncash items:<\/p><p>Item 1:An impairment charge for an intangible asset<\/p><p>Item 2:A noncash gain related to nonoperating activities<\/p><p>Item 3:Amortization of discounts related to the purchase of long-term bond holdings<\/p><\/div><\/details><div class=\"qtext\"><p>All else equal, which of the following characteristics provides the most appropriate reason for Almado to use a FCF model instead of a dividend discount model?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q131.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":132,"q":"For the valuation of Evermore, to calculate FCFF, net income would have to be reduced by which of the listed items?","opts":["Item 1","Item 2","Item 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a132.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a132.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 24 · Câu 127–132 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sofia Almado is a research analyst with a large European investment bank. The bank&#x27;s management is considering three companies for recommendation to its clients: Snowcap Solutions, Broadview Analytics, and Evermore Inc. Almado is charged with preparing valuations for each.<\/p><p>Selected data from the financial statements for Snowcap is shown in Exhibit 1, which Almado will use to derive FCFF. Snowcap&#x27;s applicable tax rate is 30%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex050.webp\" style=\"max-width:min(100%,419px)\" alt=\"Exhibit\"><p>One of Almado&#x27;s colleagues asked her why she used FCFF instead of FCFE to value Snowcap. She responded with several ideas.<\/p><p>Broadview plans to repurchase common stock. The most recent annual FCFE for Broadview is €375 million, but Almado wishes to understand how the FCFE would be affected by planned stock repurchases totaling €30 million during the same period. Exhibit 2 shows selected financial data for Broadview:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex051.webp\" style=\"max-width:min(100%,424px)\" alt=\"Exhibit\"><p>Almado believes FCF models are the best option for estimating Broadview&#x27;s value. Her manager, however, states that since Broadview has paid steady dividends for several years, a better option would be to use dividend discount models (DDM). Almado counters that she would normally agree, but Broadview has characteristics that led her to choose FCF valuation. Among them, she states that Broadview has:<\/p><p><b>Reason 1:<\/b> Low dividends relative to its positive FCFE<\/p><p><b>Reason 2:<\/b> A diverse investor base without concentrated stock positions<\/p><p><b>Reason 3:<\/b> Profitability that does not align with FCF over the forecast period<\/p><p>Finally, Almado is reviewing Evermore&#x27;s financials as part of her analysis. She is interested in calculating the company&#x27;s FCFF from its reported net income. She needs to determine the proper treatment of the following noncash items:<\/p><p>Item 1:An impairment charge for an intangible asset<\/p><p>Item 2:A noncash gain related to nonoperating activities<\/p><p>Item 3:Amortization of discounts related to the purchase of long-term bond holdings<\/p><\/div><\/details><div class=\"qtext\"><p>For the valuation of Evermore, to calculate FCFF, net income would have to be reduced by which of the listed items?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q132.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":133,"q":"Based on Exhibit 1, which of the following methods of calculating normalized earnings results in the greater P/E ratio for Sapphire?","opts":["Historical average EPS","Average return on equity","Both historical average EPS and average return on equity result in the same P/E ratio"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a133.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a133.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 25 · Câu 133–136 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Mei Tong, an equity fund manager at Pearl Investments, is analyzing several companies during a market downturn, starting with Sapphire Electronics. Sapphire&#x27;s earnings are highly cyclical and are the lowest they&#x27;ve been in years. Given the current stage of the business cycle, Tong decides to calculate P/E based on normalized earnings using the method of historical average EPS and the method of average return on equity. She collects the following data from the last full business cycle:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex052.webp\" style=\"max-width:min(100%,543px)\" alt=\"Exhibit\"><p>Tong plans to compare Sapphire with competitors based on their P/E ratios but estimates significantly different growth rates between the companies. She decides to use the P/E-to-growth (PEG) ratio instead of P/E. Bao Lam, a colleague at Pearl, reminds her about several considerations when using the PEG ratio:<\/p><p><b>Consideration 1:<\/b> The PEG ratio does not account for differences in risk between companies.<\/p><p><b>Consideration 2:<\/b> Company-specific growth should be normalized for the growth of the overall economy.<\/p><p><b>Consideration 3:<\/b> The PEG ratio assumes a nonlinear relationship between P/E and growth and must be adjusted for linearity.<\/p><p>Tong and Lam discuss how to evaluate the relative value of Granite Manufacturing compared with peers and then appropriately rank the companies according to a price ratio. Granite has experienced losses in recent years, and earnings are expected to remain negative for the foreseeable future. Granite uses a unique, asset-light manufacturing process that differs from the asset-centric process its peers use, giving it a smaller asset base and lower COGS than its peers.<\/p><p>Tong turns her attention to Sunrise Telecommunications. She wants to compare its value with industry averages based on several ratios. Using this comparison, she will determine whether the company is undervalued or overvalued. She collects the following information on Sunrise and the industry:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex053.webp\" style=\"max-width:min(100%,471px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, which of the following methods of calculating normalized earnings results in the greater P/E ratio for Sapphire?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q133.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":134,"q":"Which of Lam's considerations about the PEG ratio is correct?","opts":["Consideration 1","Consideration 2","Consideration 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a134.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a134.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 25 · Câu 133–136 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mei Tong, an equity fund manager at Pearl Investments, is analyzing several companies during a market downturn, starting with Sapphire Electronics. Sapphire&#x27;s earnings are highly cyclical and are the lowest they&#x27;ve been in years. Given the current stage of the business cycle, Tong decides to calculate P/E based on normalized earnings using the method of historical average EPS and the method of average return on equity. She collects the following data from the last full business cycle:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex052.webp\" style=\"max-width:min(100%,543px)\" alt=\"Exhibit\"><p>Tong plans to compare Sapphire with competitors based on their P/E ratios but estimates significantly different growth rates between the companies. She decides to use the P/E-to-growth (PEG) ratio instead of P/E. Bao Lam, a colleague at Pearl, reminds her about several considerations when using the PEG ratio:<\/p><p><b>Consideration 1:<\/b> The PEG ratio does not account for differences in risk between companies.<\/p><p><b>Consideration 2:<\/b> Company-specific growth should be normalized for the growth of the overall economy.<\/p><p><b>Consideration 3:<\/b> The PEG ratio assumes a nonlinear relationship between P/E and growth and must be adjusted for linearity.<\/p><p>Tong and Lam discuss how to evaluate the relative value of Granite Manufacturing compared with peers and then appropriately rank the companies according to a price ratio. Granite has experienced losses in recent years, and earnings are expected to remain negative for the foreseeable future. Granite uses a unique, asset-light manufacturing process that differs from the asset-centric process its peers use, giving it a smaller asset base and lower COGS than its peers.<\/p><p>Tong turns her attention to Sunrise Telecommunications. She wants to compare its value with industry averages based on several ratios. Using this comparison, she will determine whether the company is undervalued or overvalued. She collects the following information on Sunrise and the industry:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex053.webp\" style=\"max-width:min(100%,471px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of Lam&#x27;s considerations about the PEG ratio is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q134.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":135,"q":"Which of the following ratios would be the most appropriate for ranking Granite against its peers?","opts":["Price-to-book","Price-to-sales","Earnings yield"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a135.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a135.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 25 · Câu 133–136 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mei Tong, an equity fund manager at Pearl Investments, is analyzing several companies during a market downturn, starting with Sapphire Electronics. Sapphire&#x27;s earnings are highly cyclical and are the lowest they&#x27;ve been in years. Given the current stage of the business cycle, Tong decides to calculate P/E based on normalized earnings using the method of historical average EPS and the method of average return on equity. She collects the following data from the last full business cycle:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex052.webp\" style=\"max-width:min(100%,543px)\" alt=\"Exhibit\"><p>Tong plans to compare Sapphire with competitors based on their P/E ratios but estimates significantly different growth rates between the companies. She decides to use the P/E-to-growth (PEG) ratio instead of P/E. Bao Lam, a colleague at Pearl, reminds her about several considerations when using the PEG ratio:<\/p><p><b>Consideration 1:<\/b> The PEG ratio does not account for differences in risk between companies.<\/p><p><b>Consideration 2:<\/b> Company-specific growth should be normalized for the growth of the overall economy.<\/p><p><b>Consideration 3:<\/b> The PEG ratio assumes a nonlinear relationship between P/E and growth and must be adjusted for linearity.<\/p><p>Tong and Lam discuss how to evaluate the relative value of Granite Manufacturing compared with peers and then appropriately rank the companies according to a price ratio. Granite has experienced losses in recent years, and earnings are expected to remain negative for the foreseeable future. Granite uses a unique, asset-light manufacturing process that differs from the asset-centric process its peers use, giving it a smaller asset base and lower COGS than its peers.<\/p><p>Tong turns her attention to Sunrise Telecommunications. She wants to compare its value with industry averages based on several ratios. Using this comparison, she will determine whether the company is undervalued or overvalued. She collects the following information on Sunrise and the industry:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex053.webp\" style=\"max-width:min(100%,471px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of the following ratios would be the most appropriate for ranking Granite against its peers?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q135.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":136,"q":"Based on Exhibit 2, Sunrise is most likely considered:","opts":["overvalued based on dividend yield.","overvalued based on cash flow yield.","undervalued based on price-to-book."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a136.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a136.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 25 · Câu 133–136 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mei Tong, an equity fund manager at Pearl Investments, is analyzing several companies during a market downturn, starting with Sapphire Electronics. Sapphire&#x27;s earnings are highly cyclical and are the lowest they&#x27;ve been in years. Given the current stage of the business cycle, Tong decides to calculate P/E based on normalized earnings using the method of historical average EPS and the method of average return on equity. She collects the following data from the last full business cycle:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex052.webp\" style=\"max-width:min(100%,543px)\" alt=\"Exhibit\"><p>Tong plans to compare Sapphire with competitors based on their P/E ratios but estimates significantly different growth rates between the companies. She decides to use the P/E-to-growth (PEG) ratio instead of P/E. Bao Lam, a colleague at Pearl, reminds her about several considerations when using the PEG ratio:<\/p><p><b>Consideration 1:<\/b> The PEG ratio does not account for differences in risk between companies.<\/p><p><b>Consideration 2:<\/b> Company-specific growth should be normalized for the growth of the overall economy.<\/p><p><b>Consideration 3:<\/b> The PEG ratio assumes a nonlinear relationship between P/E and growth and must be adjusted for linearity.<\/p><p>Tong and Lam discuss how to evaluate the relative value of Granite Manufacturing compared with peers and then appropriately rank the companies according to a price ratio. Granite has experienced losses in recent years, and earnings are expected to remain negative for the foreseeable future. Granite uses a unique, asset-light manufacturing process that differs from the asset-centric process its peers use, giving it a smaller asset base and lower COGS than its peers.<\/p><p>Tong turns her attention to Sunrise Telecommunications. She wants to compare its value with industry averages based on several ratios. Using this comparison, she will determine whether the company is undervalued or overvalued. She collects the following information on Sunrise and the industry:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex053.webp\" style=\"max-width:min(100%,471px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2, Sunrise is most likely considered:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q136.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":137,"q":"Based on Exhibit 1, Melendez's EV/EBITDA is closest to:","opts":["2.0","2.2","2.4"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a137.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a137.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 26 · Câu 137–142 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Tomás Montero is a financial analyst at an independent equity research firm. He is updating, as of January 1, 20X6, the research reports on Industrias Melendez and Tiendas Guadalupe. On that date, the stock prices of Melendez are MXN 150 (per share of common) and MXN 80 (per share of preferred).<\/p><p>Montero summarizes Melendez&#x27;s financial statements in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex054.webp\" style=\"max-width:min(100%,513px)\" alt=\"Exhibit\"><p>Montero calculates Melendez&#x27;s enterprise value (EV) and its EV/EBITDA ratio. He also calculates the price-to-book (P/B) ratio and compares it with the industry multiple of 1.15.<\/p><p>Montero presents his conclusions to his supervisor, Yolanda Barcenas, who asks him to calculate price multiples based on cash flow measures. Montero explains that there are alternative definitions of cash flow, and each has specific limitations:<\/p><p><b>Limitation 1:<\/b> Cash flow from operations (CFO) is not a free cash flow concept.<\/p><p><b>Limitation 2:<\/b> CF (earnings plus noncash charges) is more volatile than FCFE.<\/p><p><b>Limitation 3:<\/b> EBITDA will exceed CFO if working capital is consistently decreasing.<\/p><p>Barcenas asks Montero to include a momentum valuation indicator in his analysis. She recommends using an indicator that compares Melendez&#x27;s stock performance with the performance of a group of similar stocks.<\/p><p>Montero turns his attention to Guadalupe. He gathers information about the company and a competitor, Comercial Arana, summarized in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex055.webp\" style=\"max-width:min(100%,504px)\" alt=\"Exhibit\"><p>Montero notices a significant difference in the trailing price-to-sales (P/S) multiples of both companies. He analyzes three fundamentals—beta, profit margin, and earnings growth rate—to understand whether any of those factors could help explain, at least in part, the difference between the multiples. In this analysis, Montero assumes that both companies&#x27; dividend payout ratio and ROE will not change in the long run.<\/p><p>Montero also analyzes a large number of stocks in the industry and builds a cross-sectional regression model to predict Guadalupe&#x27;s P/E. He compares the predicted price-to-earnings (P/E) ratio with Guadalupe&#x27;s current trailing P/E to evaluate the stock. The model is:<\/p><p>Predicted P/E = 10.7 + (1.1 × Dividend payout ratio) − (0.2 × Beta) + (65.6 × Earnings growth rate)<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, Melendez&#x27;s EV/EBITDA is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q137.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":138,"q":"Based on Exhibit 1 and compared with the industry average price-to-book multiple of 1.15, the common shares of Melendez are:","opts":["undervalued.","fairly valued.","overvalued."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a138.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a138.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 26 · Câu 137–142 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tomás Montero is a financial analyst at an independent equity research firm. He is updating, as of January 1, 20X6, the research reports on Industrias Melendez and Tiendas Guadalupe. On that date, the stock prices of Melendez are MXN 150 (per share of common) and MXN 80 (per share of preferred).<\/p><p>Montero summarizes Melendez&#x27;s financial statements in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex054.webp\" style=\"max-width:min(100%,513px)\" alt=\"Exhibit\"><p>Montero calculates Melendez&#x27;s enterprise value (EV) and its EV/EBITDA ratio. He also calculates the price-to-book (P/B) ratio and compares it with the industry multiple of 1.15.<\/p><p>Montero presents his conclusions to his supervisor, Yolanda Barcenas, who asks him to calculate price multiples based on cash flow measures. Montero explains that there are alternative definitions of cash flow, and each has specific limitations:<\/p><p><b>Limitation 1:<\/b> Cash flow from operations (CFO) is not a free cash flow concept.<\/p><p><b>Limitation 2:<\/b> CF (earnings plus noncash charges) is more volatile than FCFE.<\/p><p><b>Limitation 3:<\/b> EBITDA will exceed CFO if working capital is consistently decreasing.<\/p><p>Barcenas asks Montero to include a momentum valuation indicator in his analysis. She recommends using an indicator that compares Melendez&#x27;s stock performance with the performance of a group of similar stocks.<\/p><p>Montero turns his attention to Guadalupe. He gathers information about the company and a competitor, Comercial Arana, summarized in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex055.webp\" style=\"max-width:min(100%,504px)\" alt=\"Exhibit\"><p>Montero notices a significant difference in the trailing price-to-sales (P/S) multiples of both companies. He analyzes three fundamentals—beta, profit margin, and earnings growth rate—to understand whether any of those factors could help explain, at least in part, the difference between the multiples. In this analysis, Montero assumes that both companies&#x27; dividend payout ratio and ROE will not change in the long run.<\/p><p>Montero also analyzes a large number of stocks in the industry and builds a cross-sectional regression model to predict Guadalupe&#x27;s P/E. He compares the predicted price-to-earnings (P/E) ratio with Guadalupe&#x27;s current trailing P/E to evaluate the stock. The model is:<\/p><p>Predicted P/E = 10.7 + (1.1 × Dividend payout ratio) − (0.2 × Beta) + (65.6 × Earnings growth rate)<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and compared with the industry average price-to-book multiple of 1.15, the common shares of Melendez are:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q138.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":139,"q":"Which of the following limitations of cash flow measures is correct?","opts":["Limitation 1","Limitation 2","Limitation 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a139.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a139.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 26 · Câu 137–142 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tomás Montero is a financial analyst at an independent equity research firm. He is updating, as of January 1, 20X6, the research reports on Industrias Melendez and Tiendas Guadalupe. On that date, the stock prices of Melendez are MXN 150 (per share of common) and MXN 80 (per share of preferred).<\/p><p>Montero summarizes Melendez&#x27;s financial statements in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex054.webp\" style=\"max-width:min(100%,513px)\" alt=\"Exhibit\"><p>Montero calculates Melendez&#x27;s enterprise value (EV) and its EV/EBITDA ratio. He also calculates the price-to-book (P/B) ratio and compares it with the industry multiple of 1.15.<\/p><p>Montero presents his conclusions to his supervisor, Yolanda Barcenas, who asks him to calculate price multiples based on cash flow measures. Montero explains that there are alternative definitions of cash flow, and each has specific limitations:<\/p><p><b>Limitation 1:<\/b> Cash flow from operations (CFO) is not a free cash flow concept.<\/p><p><b>Limitation 2:<\/b> CF (earnings plus noncash charges) is more volatile than FCFE.<\/p><p><b>Limitation 3:<\/b> EBITDA will exceed CFO if working capital is consistently decreasing.<\/p><p>Barcenas asks Montero to include a momentum valuation indicator in his analysis. She recommends using an indicator that compares Melendez&#x27;s stock performance with the performance of a group of similar stocks.<\/p><p>Montero turns his attention to Guadalupe. He gathers information about the company and a competitor, Comercial Arana, summarized in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-equity/ex055.webp\" style=\"max-width:min(100%,504px)\" alt=\"Exhibit\"><p>Montero notices a significant difference in the trailing price-to-sales (P/S) multiples of both companies. He analyzes three fundamentals—beta, profit margin, and earnings growth rate—to understand whether any of those factors could help explain, at least in part, the difference between the multiples. In this analysis, Montero assumes that both companies&#x27; dividend payout ratio and ROE will not change in the long run.<\/p><p>Montero also analyzes a large number of stocks in the industry and builds a cross-sectional regression model to predict Guadalupe&#x27;s P/E. He compares the predicted price-to-earnings (P/E) ratio with Guadalupe&#x27;s current trailing P/E to evaluate the stock. The model is:<\/p><p>Predicted P/E = 10.7 + (1.1 × Dividend payout ratio) − (0.2 × Beta) + (65.6 × Earnings growth rate)<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following limitations of cash flow measures is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-equity/q139.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":140,"q":"According to Barcenas's recommendation, Montero should most appropriately use which of the following momentum indicators?","opts":["Relative strength","Earnings surprise","Standardized unexpected earnings"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-equity/a140.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-equity/a140.webp\" alt=\"Lời giải\"><\/a
