<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#d86413; --accent2:#f0a05a;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#d86413; --accent2:#a8500e;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#d86413; --accent2:#f0a05a;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#d86413; --accent2:#a8500e;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(216,100,19,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(240,160,90,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(216,100,19,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(216,100,19,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .stem .qtable{width:100%;border-collapse:collapse;margin:12px 0 2px;font-size:14.5px;
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stem .qtable th,.stem .qtable td{border:1px solid var(--line);padding:8px 11px;
    text-align:left;vertical-align:top}
  .stem .qtable thead th{background:var(--panel2);font-weight:700;color:var(--accent2)}
  .stem .qtable tbody td:first-child{font-weight:600}
  .stem .qtable td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
  .stem .qtable tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
  @media (max-width:520px){.stem .qtable{font-size:13px}.stem .qtable th,.stem .qtable td{padding:6px 8px}}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#d86413,secondary:#f0a05a"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#d86413,secondary:#f0a05a"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#d86413,secondary:#f0a05a"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#d86413,secondary:#f0a05a"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "An investor buys a share of stock for $200.00 at time t = 0. At time t = 1, the investor buys an\nadditional share for $225.00. At time t = 2 the investor sells both shares for $235.00. During\nboth years, the stock paid a per share dividend of $5.00. What are the approximate time-\nweighted and money-weighted returns respectively?", "opts": ["10.8%; 9.4%.", "7.7%; 7.7%.", "9.0%; 15.0%."], "ans": "A", "expl": "Time-weighted return = (225 + 5 – 200) / 200 = 15%; (470 + 10 – 450) / 450 = 6.67%; [(1.15)\n1/2\n(1.0667)] – 1 = 10.8%\n2\nMoney-weighted return: 200 + [225 / (1 + return)] = [5 / (1 + return)] + [480 / (1 + return)];\nmoney return = approximately 9.4%\nNote that the easiest way to solve for the money-weighted return is to set up the equation\nand plug in the answer choices to find the discount rate that makes outflows equal to\ninflows.\nUsing the financial calculators to calculate the money-weighted return: (The following\nkeystrokes assume that the financial memory registers are cleared of prior work.)\n®\nTI Business Analyst II Plus\nEnter CF: 200, +/-, Enter, down arrow\n0\nEnter CF: 220, +/-, Enter, down arrow, down arrow\n1\nEnter CF: 480, Enter, down arrow, down arrow,\n2\nCompute IRR: IRR, CPT\nResult:  9.39\n®\nHP 12C\nEnter CF: 200, CHS, g, CF\n00\nEnter CF: 220, CHS, g, CF\n1j\nEnter CF: 480, g, CF\n2j\nCompute IRR: f, IRR\nResult:  9.39\n(Module 1.2, LOS 1.c)"}, {"n": 2, "q": "An investor sold a 30-year bond at a price of $850 after he purchased it at $800 a year ago.\nHe received $50 of interest at the time of the sale. The annualized holding period return is:", "opts": ["12.5%.", "6.25%.", "15.0%."], "ans": "A", "expl": "The holding period return (HPR) is calculated as follows:\nHPR = (P – P + D) / P\ntt-1tt\nwhere:\nP = price per share at the end of time period t\nt\nD = cash distributions received during time period t.\nt\nHere, HPR = (850 – 800 + 50) / 800 = 0.1250, or 12.50%.\n(Module 1.3, LOS 1.e)"}, {"n": 3, "q": "On January 1, Jonathan Wood invests $50,000. At the end of March, his investment is worth\n$51,000. On April 1, Wood deposits $10,000 into his account, and by the end of June, his\naccount is worth $60,000. Wood withdraws $30,000 on July 1 and makes no additional\ndeposits or withdrawals the rest of the year. By the end of the year, his account is worth\n$33,000. The time-weighted return for the year is closest to:", "opts": ["5.5%.", "10.4%.", "7.0%."], "ans": "B", "expl": "January – March return = 51,000 / 50,000 − 1 = 2.00%\nApril – June return = 60,000 / (51,000 + 10,000) − 1 = –1.64%\nJuly – December return = 33,000 / (60,000 − 30,000) − 1 = 10.00%\nTime-weighted return = [(1 + 0.02)(1 − 0.0164)(1 + 0.10)] − 1 = 0.1036 or 10.36%\n(Module 1.2, LOS 1.c)"}, {"n": 4, "q": "The product of the arithmetic mean and the harmonic mean is the:", "opts": ["square root of the geometric mean.", "geometric mean.", "square of the geometric mean."], "ans": "C", "expl": "The mathematical relationship among arithmetic, geometric, and harmonic means is as\n2\nfollows: arithmetic mean × harmonic mean = (geometric mean).\n(Module 1.1, LOS 1.b)"}, {"n": 5, "q": "A stock increased in value last year. Which will be greater, its continuously compounded or\nits holding period return?", "opts": ["Its continuously compounded return.", "Its holding period return.", "Neither, they will be equal."], "ans": "B", "expl": "When a stock increases in value, the holding period return is always greater than the\ncontinuously compounded return that would be required to generate that holding period\nreturn. For example, if a stock increases from $1 to $1.10 in a year, the holding period\nreturn is 10%. The continuously compounded rate needed to increase a stock's value by\n10% is Ln(1.10) = 9.53%.\n(Module 1.3, LOS 1.d)"}, {"n": 6, "q": "Time-weighted returns are used by the investment management industry because they:", "opts": ["take all cash inflows and outflows into account using the internal rate of return.", "are not affected by the timing of cash flows.", "result in higher returns versus the money-weighted return calculation."], "ans": "B", "expl": "Time-weighted returns are not affected by the timing of cash flows. Money-weighted\nreturns, by contrast, will be higher when funds are added at a favorable investment period\nor will be lower when funds are added during an unfavorable period. Thus, time-weighted\nreturns offer a better performance measure because they are not affected by the timing of\nflows into and out of the account.\n(Module 1.2, LOS 1.c)"}, {"n": 7, "q": "Based on the advice of his financial advisor regarding dollar cost averaging, a client invests\n$2,000 each month into a blue-chip stock. The stock price on the date of purchase each\nmonth over a four-month stretch was $12, $14, $11, and $9. Using the harmonic mean, the\naverage cost per share of the stock is closest to:", "opts": ["$11.20.", "$11.50.", "$11.75."], "ans": "A", "expl": "The formula to calculate the harmonic mean is equal to:\n4\n¯¯¯¯¯¯\nX\n = =11.2113\nH\n1111\n+++\n9\n121411\nNote that the arithmetic mean stock price is $11.50, and because the harmonic mean will\nalways be less than the arithmetic mean for any dataset with unequal values, $11.75\nwould never be possible.\n(Module 1.1, LOS 1.b)"}, {"n": 8, "q": "The most appropriate measure of the increase in the purchasing power of a portfolio's value\nover a given span of time is a(n):", "opts": ["holding period return.", "real return.", "after-tax return."], "ans": "B", "expl": "A real return is adjusted for the effects of inflation and is used to measure the increase in\npurchasing power over time.\n(Module 1.3, LOS 1.e)"}, {"n": 9, "q": "Assuming at least some variations in a set of data, the:", "opts": ["arithmetic mean is greater than geometric mean, which is greater than the harmonic mean.", "harmonic mean is greater than the geometric mean, which is greater than the arithmetic mean.", "geometric mean is greater than the arithmetic mean, which is greater than the harmonic mean."], "ans": "A", "expl": "As long as there is variability in the data, the arithmetic mean is greater than geometric\nmean, which is greater than the harmonic mean.\n(Module 1.1, LOS 1.b)"}, {"n": 10, "q": "For a given stated annual rate of return, compared to the effective rate of return with\ndiscrete compounding, the effective rate of return with continuous compounding will be:", "opts": ["the same.", "lower.", "higher."], "ans": "C", "expl": "A higher frequency of compounding leads to a higher effective rate of return. The effective\nrate of return with continuous compounding will, therefore, be greater than any effective\nrate of return with discrete compounding.\n(Module 1.3, LOS 1.d)"}, {"n": 11, "q": "A stock that pays no dividend is currently priced at €42.00. One year ago the stock was\n€44.23. The continuously compounded rate of return is closest to:", "opts": ["–5.17%.", "–5.04%.", "+5.17%."], "ans": "A", "expl": "S\n42.00\n1\nln() = ln() = ln(0.9496) = −0.0517 = −5.17%\nS44.23\n0\n(Module 1.3, LOS 1.d)"}, {"n": 12, "q": "A bond was purchased exactly one year ago for $910 and was sold today for $1,020. During\nthe year, the bond made two semi-annual coupon payments of $30. What is the holding\nperiod return?", "opts": ["12.1%.", "18.7%.", "6.0%."], "ans": "B", "expl": "HPY = (1,020 + 30 + 30 – 910) / 910 = 0.1868 or 18.7%.\n(Module 1.3, LOS 1.e)"}, {"n": 13, "q": "T-bill yields can be thought of as:", "opts": ["nominal risk-free rates because they contain an inflation premium.", "nominal risk-free rates because they do not contain an inflation premium.", "real risk-free rates because they contain an inflation premium."], "ans": "A", "expl": "T-bills are government issued securities and are therefore considered to be default risk\nfree. More precisely, they are nominal risk-free rates rather than real risk-free rates since\nthey contain a premium for expected inflation.\n(Module 1.1, LOS 1.a)"}, {"n": 14, "q": "An investor buys a stock on March 24 for $63.25. The stock pays quarterly dividends of $0.54\non May 1 and August 1. On September 27, the investor sells the stock for $62.80. The\ninvestor's holding period return is closest to:", "opts": ["2.5%.", "1.0%.", "2.0%."], "ans": "B", "expl": "62.80+0.54+0.54\n−1=0.01=1%\n. Because we are asked for the HPR, the beginning\n63.25\nand ending dates are irrelevant. If we had been asked to annualize the return, we would\nneed to know the length of the holding period.\n(Module 1.1, LOS 1.b)"}, {"n": 15, "q": "A security portfolio earns a gross return of 7.0% and a net return of 6.5%. The difference of\n0.5% most likely results from:", "opts": ["fees.", "taxes.", "inflation."], "ans": "A", "expl": "The net return on a portfolio is its gross return minus management and administrative\nfees. A return adjusted for taxes is called an after-tax return. A return adjusted for\ninflation is called a real return.\n(Module 1.3, LOS 1.e)"}, {"n": 16, "q": "An investor buys one share of stock for $100. At the end of year one she buys three more\nshares at $89 per share. At the end of year two she sells all four shares for $98 each. The\nstock paid a dividend of $1.00 per share at the end of year one and year two. What is the\ninvestor's money-weighted rate of return?", "opts": ["0.06%.", "5.29%.", "6.35%."], "ans": "C", "expl": "T = 0: Purchase of first share = -$100.00\nT = 1: Dividend from first share = +$1.00\nPurchase of 3 more shares = -$267.00\nT = 2: Dividend from four shares = +4.00\nProceeds from selling shares = +$392.00\nThe money-weighted return is the rate that solves the equation:\n2\n$100.00 = -$266.00 / (1 + r) + 396.00 / (1 + r).\nCFO = -100; CF1 = -266; CF2 = 396; CPT  IRR = 6.35%.\n→\n(Module 1.2, LOS 1.c)"}, {"n": 17, "q": "Vega research has been conducting investor polls for Third State Bank. They have found the\nmost investors are not willing to tie up their money in a 1-year (2-year) CD unless they\nreceive at least 1.0% (1.5%) more than they would on an ordinary savings account. If the\nsavings account rate is 3%, and the bank wants to raise funds with 2-year CDs, the yield must\nbe at least:", "opts": ["4.0%, and this represents a required rate of return.", "4.5%, and this represents a discount rate.", "4.5%, and this represents a required rate of return."], "ans": "C", "expl": "Since we are taking the view of the minimum amount required to induce investors to lend\nfunds to the bank, this is best described as a required rate of return. Based upon the\nnumerical information, the rate must be 4.5% (= 3.0 + 1.5).\n(Module 1.1, LOS 1.a)"}, {"n": 18, "q": "An investor makes the following investments:\nShe purchases a share of stock for $50.00.\nAfter one year, she purchases an additional share for $75.00.\nAfter one more year, she sells both shares for $100.00 each.\nThere are no transaction costs or taxes.\nDuring year one, the stock paid a $5.00 per share dividend. In year 2, the stock paid a $7.50\nper share dividend. The investor's required return is 35%. Her money-weighted return is\nclosest to:", "opts": ["16.1%.", "-7.5%.", "48.9%."], "ans": "C", "expl": "To determine the money weighted rate of return, use your calculator's cash flow and IRR\nfunctions. The cash flows are as follows:\nCF0: initial cash outflow for purchase = $50\nCF1: dividend inflow of $5 - cash outflow for additional purchase of $75 = net cash outflow\nof -$70\nCF2: dividend inflow (2 × $7.50 = $15) + cash inflow from sale (2 × $100 = $200) = net cash\ninflow of $215\nEnter the cash flows and compute IRR:\nCF0 = -50; CF1 = -70; CF2 = +215; CPT IRR = 48.8607\n(Module 1.2, LOS 1.c)"}, {"n": 19, "q": "Given a holding period return of R, the continuously compounded rate of return is:", "opts": ["R e – 1.", "ln(1 + R).", "ln(1 + R) – 1."], "ans": "B", "expl": "This is the formula for the continuously compounded rate of return.\n(Module 1.3, LOS 1.d)"}, {"n": 20, "q": "If an investor bought a stock for $32 and sold it nine months later for $37.50 after receiving\n$2 in dividends, what was the holding period return on this investment?", "opts": ["32.42%.", "17.19%.", "23.44%."], "ans": "C", "expl": "HPR = [ending value – beginning value] / beginning value\nHPR = [(2 + 37.50) – 32] / 32 = 0.2344.\n(Module 1.3, LOS 1.e)"}, {"n": 21, "q": "Which one of the following statements best describes the components of the required\ninterest rate on a security?", "opts": ["The real risk-free rate, the default risk premium, a liquidity premium and a premium to reflect the risk associated with the maturity of the security.", "The real risk-free rate, the expected inflation rate, the default risk premium, a liquidity premium and a premium to reflect the risk associated with the maturity of the security.", "The nominal risk-free rate, the expected inflation rate, the default risk premium, a liquidity premium and a premium to reflect the risk associated with the maturity of the security."], "ans": "B", "expl": "The required interest rate on a security is made up of the nominal rate which is in turn\nmade up of the real risk-free rate plus the expected inflation rate. It should also contain a\nliquidity premium as well as a premium related to the maturity of the security.\n(Module 1.1, LOS 1.a)"}, {"n": 22, "q": "Assume an investor makes the following investments:\nToday, she purchases a share of stock in Redwood Alternatives for $50.00.\nAfter one year, she purchases an additional share for $75.00.\nAfter one more year, she sells both shares for $100.00 each.\nThere are no transaction costs or taxes. The investor's required return is 35.0%.\nDuring year one, the stock paid a $5.00 per share dividend. In year two, the stock paid a\n$7.50 per share dividend.\nThe time-weighted return is:", "opts": ["51.4%.", "23.2%.", "51.7%."], "ans": "A", "expl": "To calculate the time-weighted return:\nStep 1: Separate the time periods into holding periods and calculate the return over that\nperiod:\nHolding period 1: P = $50.00\n0\nD = $5.00\n1\nP = $75.00 (from information on second stock purchase)\n1\nHPR  = (75 – 50 + 5) / 50 = 0.60, or 60%\n1\nHolding period 2: P = $75.00\n1\nD = $7.50\n2\nP = $100.00\n2\nHPR  = (100 – 75 + 7.50) / 75 = 0.433, or 43.3%.\n2\nStep 2: Use the geometric mean to calculate the return over both periods\n1/21/2\nReturn = [(1 + HPR) × (1 + HPR)] – 1 = [(1.60) × (1.433)] – 1 = 0.5142, or\n12\n51.4%.\n(Module 1.2, LOS 1.c)"}, {"n": 23, "q": "The continuously compounded rate of return that will generate a one-year holding period\nreturn of -6.5% is closest to:", "opts": ["-5.7%.", "-6.3%.", "-6.7%."], "ans": "C", "expl": "Continuously compounded rate of return = ln(1 – 0.065) = -6.72%.\n(Module 1.3, LOS 1.d)"}, {"n": 24, "q": "An investor begins with a $100,000 portfolio. At the end of the first period, it generates\n$5,000 of income, which he does not reinvest. At the end of the second period, he\ncontributes $25,000 to the portfolio. At the end of the third period, the portfolio is valued at\n$123,000. The portfolio's money-weighted return per period is closest to:", "opts": ["0.94%.", "1.20%.", "–0.50%."], "ans": "A", "expl": "Using the financial calculator, the initial investment (CF) is –100,000. The income is +5,000\n0\n(CF), and the contribution is –25,000 (CF2). Finally, the ending value is +123,000 (CF)\n13\navailable to the investor. Compute IRR = 0.94\n(Module 1.3, LOS 1.e)"}, {"n": 25, "q": "Over a period of one year, an investor's portfolio has declined in value from 127,350 to\n108,427. What is the continuously compounded rate of return?", "opts": ["-13.84%.", "-14.86%.", "-16.09%."], "ans": "C", "expl": "The continuously compounded rate of return = ln(S / S) = ln(108,427 / 127,350) = –\n10\n16.09%.\n(Module 1.3, LOS 1.d)"}, {"n": 26, "q": "An analyst evaluates a dataset with eight values. From the dataset, she calculates the\ngeometric mean to be 8.50. If the arithmetic mean is equal to 8.90, the harmonic mean is\nclosest to:", "opts": ["9.30.", "8.12.", "8.63."], "ans": "B", "expl": "The relationship between the arithmetic, harmonic, and geometric mean is equal to:\n2\narithmetic mean × harmonic mean = (geometric mean)\n22\n8.90 × harmonic mean = (geometric mean) = (8.50)\n2\n(8.50)\n=8.12\nharmonic mean =\n8.90\nNote: This could also be answered without performing calculations, knowing that\nharmonic < geometric < arithmetic, where values are not equal.\n(Module 1.1, LOS 1.b)"}, {"n": 27, "q": "A 10% coupon bond was purchased for $1,000. One year later the bond was sold for $915 to\nyield 11%. The investor's holding period yield on this bond is closest to:", "opts": ["9.0%.", "1.5%.", "18.5%."], "ans": "B", "expl": "HPY = [(interest + ending value) / beginning value] – 1\n= [(100 + 915) / 1,000] – 1\n= 1.015 – 1 = 1.5%\n(Module 1.3, LOS 1.e)"}, {"n": 28, "q": "Selmer Jones has just inherited some money and wants to set some of it aside for a vacation\nin Hawaii one year from today. His bank will pay him 5% interest on any funds he deposits.\nIn order to determine how much of the money must be set aside and held for the trip, he\nshould use the 5% as a:", "opts": ["discount rate.", "opportunity cost.", "required rate of return."], "ans": "A", "expl": "He needs to figure out how much the trip will cost in one year, and use the 5% as a\ndiscount rate to convert the future cost to a present value. Thus, in this context the rate is\nbest viewed as a discount rate.\n(Module 1.1, LOS 1.a)"}, {"n": 29, "q": "The real risk-free rate can be thought of as:", "opts": ["approximately the nominal risk-free rate plus the expected inflation rate.", "approximately the nominal risk-free rate reduced by the expected inflation rate.", "exactly the nominal risk-free rate reduced by the expected inflation rate."], "ans": "B", "expl": "The approximate relationship between nominal rates, real rates and expected inflation\nrates can be written as:\nNominal risk-free rate = real risk-free rate + expected inflation rate.\nTherefore we can rewrite this equation in terms of the real risk-free rate as:\nReal risk-free rate = Nominal risk-free rate – expected inflation rate\nThe exact relation is: (1 + real)(1 + expected inflation) = (1 + nominal)\n(Module 1.1, LOS 1.a)"}, {"n": 30, "q": "Stock XYZ is purchased on January 2 at a price of $12 per share. The investor receives a\nquarterly dividend of $0.60 per share on April 1, and the stock closes on June 30 at $13 per\nshare. The holding period return is closest to:", "opts": ["13.33%.", "8.33%.", "18.33%."], "ans": "A", "expl": "The holding period return is equal to the change in value from the beginning to the end of\nthe holding period, which will include not only the change in price but also any dividends\nreceived over the period. For each share, the price increased by $1, and the dividend\nreceived was $0.60. The calculation is equal to:\n −  +\nPPDiv13 − 12 + 0.60\ntt\n0\n==13.33%\nP12\n0\nIgnoring the dividend produces an 8.33% return, and doubling the dividend produces an\n18.33% return. It is important to note that only one dividend was received in the six-month\nperiod, and that was on April 1.\n(Module 1.1, LOS 1.b)"}, {"n": 31, "q": "Computing the internal rate of return of the inflows and outflows of a portfolio would give\nthe:", "opts": ["money-weighted return.", "net present value.", "time-weighted return."], "ans": "A", "expl": "The money-weighted return is the internal rate of return on a portfolio that equates the\npresent value of inflows and outflows over a period of time.\n(Module 1.2, LOS 1.c)"}, {"n": 32, "q": "An investor buys a non-dividend paying stock for $100 at the beginning of the year with 50%\ninitial margin. At the end of the year, the stock price is $95. Deflation of 2% occurred during\nthe year. Which of the following return measures for this investment will be greatest?", "opts": ["Real return.", "Nominal return.", "Leveraged return."], "ans": "A", "expl": "No calculations are needed. The real return is greater than the nominal return because the\ninflation rate is negative. The leveraged return is more negative than the nominal return\nbecause the investment lost value and leverage magnifies the loss.\n(Module 1.3, LOS 1.e)"}, {"n": 33, "q": "A dataset contains six values, none of which are equal. The arithmetic mean of the data is\n13.25, and the geometric mean of the data is 12.75. The harmonic mean will be:", "opts": ["greater than 13.25.", "less than 12.75.", "between 12.75 and 13.25."], "ans": "B", "expl": "For any dataset where the values are not equal, the harmonic mean will be less than the\ngeometric mean (which, in turn, will be less than the arithmetic mean). Here, the\narithmetic mean is 13.25, and the geometric mean is 12.75—so the harmonic mean must\nbe less than 12.75. It is worth noting that all three means are equal if every value in the\ndataset is the same.\n(Module 1.1, LOS 1.b)"}, {"n": 34, "q": "An investor expects a stock currently selling for $20 per share to increase to $25 by year-\nend. The dividend last year was $1 but he expects this year's dividend to be $1.25. What is\nthe expected holding period return on this stock?", "opts": ["24.00%.", "28.50%.", "31.25%."], "ans": "C", "expl": "Return = [dividend + (ending value – beginning value)] / beginning price value\n= [1.25 + (25 – 20)] / 20 = 6.25 / 20 = 0.3125\n(Module 1.3, LOS 1.e)"}, {"n": 35, "q": "An investor with a buy-and-hold strategy who makes quarterly deposits into an account\nshould most appropriately evaluate portfolio performance using the portfolio's:", "opts": ["arithmetic mean return.", "geometric mean return.", "money-weighted return."], "ans": "B", "expl": "Geometric mean return (time-weighted return) is the most appropriate method for\nperformance measurement as it does not consider additions to or withdrawals from the\naccount.\n(Module 1.3, LOS 1.e)"}, {"n": 36, "q": "Which of the following is most accurate with respect to the relationship of the money-\nweighted return to the time-weighted return? If funds are contributed to a portfolio just\nprior to a period of favorable performance, the:", "opts": ["money-weighted rate of return will tend to be depressed.", "money-weighted rate of return will tend to be elevated.", "time-weighted rate of return will tend to be elevated."], "ans": "B", "expl": "The time-weighted returns are what they are and will not be affected by cash inflows or\noutflows. The money-weighted return is susceptible to distortions resulting from cash\ninflows and outflows. The money-weighted return will be biased upward if the funds are\ninvested just prior to a period of favorable performance and will be biased downward if\nfunds are invested just prior to a period of relatively unfavorable performance. The\nopposite will be true for cash outflows.\n(Module 1.2, LOS 1.c)"}, {"n": 37, "q": "Over the last four years, an investor's portfolio has the following returns: 5.26%, –2.10%,\n3.86%, and 8.18%. The arithmetic mean return is closest to:", "opts": ["3.76%.", "3.73%.", "3.80%."], "ans": "C", "expl": "The arithmetic mean is equal to the average of the four data points, calculated by\nsumming all four returns and dividing by the number of returns:\n(+++)\nRRRR(0.0526 − 0.0210 + 0.0386 + 0.0818)\n1234\n== 0.0380, or 3.80%\n44\n(Module 1.1, LOS 1.b)"}, {"n": 38, "q": "Wei Zhang has funds on deposit with Iron Range bank. The funds are currently earning 6%\ninterest. If he withdraws $15,000 to purchase an automobile, the 6% interest rate can be\nbest thought of as a(n):", "opts": ["discount rate.", "financing cost.", "opportunity cost."], "ans": "C", "expl": "Since Wei will be foregoing interest on the withdrawn funds, the 6% interest can be best\ncharacterized as an opportunity cost — the return he could earn by postponing his auto\npurchase until the future.\n(Module 1.1, LOS 1.a)"}, {"n": 39, "q": "A stock is currently worth $75. If the stock was purchased one year ago for $60, and the\nstock paid a $1.50 dividend during the year, what is the holding period return?", "opts": ["24.0%.", "27.5%.", "22.0%."], "ans": "B", "expl": "HPR = [ending value – beginning value] / beginning value\n= (75 + 1.50 – 60) / 60 = 27.5%.\n(Module 1.3, LOS 1.e)"}, {"n": 40, "q": "Which of the following return measures is best described as purely representing time\npreference?", "opts": ["Nominal risk-free interest rate.", "Real risk-free interest rate.", "Total rate of return."], "ans": "B", "expl": "The real risk-free interest rate represents time preference, or the degree to which\nconsumers prefer consumption in the present to an equal amount of consumption in the\nfuture. Other measures of return include time preference, but it also reflect other factors,\nsuch as risk or expected inflation.\n(Module 1.1, LOS 1.a)"}, {"n": 41, "q": "An asset manager's portfolio had the following annual rates of return:\nYearReturn\n20X7+6%\n20X8-37%\n20X9+27%\nThe manager states that the return for the period is −5.34%. The manager has reported the:", "opts": ["arithmetic mean return.", "geometric mean return.", "holding period return."], "ans": "B", "expl": "√(1+0.06)(1−0.37)(1+0.27)\n3\nGeometric Mean Return =  – 1 = –5.34%\nHolding period return = (1 + 0.06)(1 − 0.37)(1 + 0.27) − 1 = −15.2%\nArithmetic mean return = (6% − 37% + 27%) / 3 = −1.33%.\n(Module 1.3, LOS 1.e)", "qhtml": "<p>An asset manager's portfolio had the following annual rates of return:</p><table class=\"qtable\"><thead><tr><th>Year</th><th>Return</th></tr></thead><tbody><tr><td>20X7+</td><td>6%</td></tr><tr><td>20X8</td><td>-37%</td></tr><tr><td>20X9+</td><td>27%</td></tr></tbody></table><p>The manager states that the return for the period is −5.34%. The manager has reported the:</p>"}, {"n": 42, "q": "An investor buys one share of stock for $100. At the end of year one she buys three more\nshares at $89 per share. At the end of year two she sells all four shares for $98 each. The\nstock paid a dividend of $1.00 per share at the end of year one and year two. What is the\ninvestor's time-weighted rate of return?", "opts": ["0.06%.", "11.24%.", "6.35%."], "ans": "A", "expl": "The holding period return in year one is ($89.00 – $100.00 + $1.00) / $100.00 = -10.00%.\nThe holding period return in year two is ($98.00 – $89.00 + $1.00) / $89 = 11.24%.\n1/2\nThe time-weighted return is [{1 + (-0.1000)}{1 + 0.1124}] – 1 = 0.06%.\n(Module 1.2, LOS 1.c)"}, {"n": 43, "q": "If a stock decreases from $90 to $80, the continuously compounded rate of return for the\nperiod is:", "opts": ["-0.1000.", "-0.1250.", "-0.1178."], "ans": "C", "expl": "This is given by the natural logarithm of the new price divided by the old price; ln(80 / 90) =\n-0.1178.\n(Module 1.3, LOS 1.d)"}];
const CFG = {"title": "Reading 1 — Rates and Returns", "subtitle": "CFA · Quantitative Methods · Schweser Question Bank", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem";
    if(q.qhtml){ stem.innerHTML = q.qhtml; } else { stem.textContent = q.q; }
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("resumeNote").classList.remove("show");
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    document.querySelectorAll('.opt.correct').forEach(function(o){ addMark(o,'✅'); });
    document.querySelectorAll('.opt.wrong').forEach(function(o){ addMark(o,'❌'); });
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#d86413','#f0a05a','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>
</body>
