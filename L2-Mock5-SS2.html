<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>
<body>
<header>

<script>
const DATA = [{"n":45,"q":"The amount of benefits paid during the year is closest to:","opts":["$76 million.","$132 million.","$188 million."],"ans":"C","expl":"Benefits paid can be determined by reconciling ending PBO to beginning PBO:\nBeginning PBO | 1,022\n+ Current service cost | 118\n+ Past service cost | 36\n+ Interest cost | 82\n+ Actuarial loss | 128\n(–) Benefit paid | 188\n(=) Ending PBO | 1,198\n(Module 9.2, LOS 9.d)","explhtml":"<p>Benefits paid can be determined by reconciling ending PBO to beginning PBO:<\/p><div class=\"tbl\"><table><tr><td>Beginning PBO<\/td><td>1,022<\/td><\/tr><tr><td>+ Current service cost<\/td><td>118<\/td><\/tr><tr><td>+ Past service cost<\/td><td>36<\/td><\/tr><tr><td>+ Interest cost<\/td><td>82<\/td><\/tr><tr><td>+ Actuarial loss<\/td><td>128<\/td><\/tr><tr><td>(–) Benefit paid<\/td><td>188<\/td><\/tr><tr><td>(=) Ending PBO<\/td><td>1,198<\/td><\/tr><\/table><\/div><p>(Module 9.2, LOS 9.d)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 45–48 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Andrew Carson is an equity analyst employed at Lee Vincent and Associates, an investment research firm. Carson is responsible for following Samilski Enterprises (Samilski), a publicly traded firm that produces motorcycles and associated mechanical parts. Samilski reports under U.S. GAAP.<\/p><p>Exhibit 1: Selected Pension Plan Information for FY 20X9 shows selected financial data pertaining to Samilski&#x27;s employee pension plan.<\/p><p>Exhibit 1: Selected Pension Plan Information for FY 20X9<\/p><p>$ Millions<\/p><div class=\"tbl\"><table><tr><td>Current service cost<\/td><td>118<\/td><\/tr><tr><td>Past service cost<\/td><td>36<\/td><\/tr><tr><td>Beginning PBO<\/td><td>1,022<\/td><\/tr><tr><td>Ending PBO<\/td><td>1,198<\/td><\/tr><tr><td>Interest cost<\/td><td>82<\/td><\/tr><tr><td>Actual return on plan assets<\/td><td>214<\/td><\/tr><tr><td>Employer contribution<\/td><td>102<\/td><\/tr><tr><td>Beginning plan assets<\/td><td>896<\/td><\/tr><\/table><\/div><p>During fiscal year 20X9, a change in actuarial assumptions regarding employee life expectancy resulted in an actuarial loss of $128 million. Average employee service life is estimated to be 20 years. In addition to the defined benefit plan, Samilski also offers an executive stock option plan which vests equally over three years. The discount rate and expected return on plan assets are 8% and 10% respectively. Carson believes that rate of compensation increase will be 5% as opposed to the 4% assumed by the plan.<\/p><\/div><\/details><div class=\"qtext\"><p>The amount of benefits paid during the year is closest to:<\/p><\/div>","subj":"fsa"},{"n":46,"q":"The ending fair value of plan assets is closest to:","opts":["$1,024 million.","$1,128 million.","$1,412 million."],"ans":"A","expl":"The ending fair value of plan assets = beginning fair value + contributions + actual return – benefits paid = 896 + 102 + 214 – 188 = $1,024 million (Module 9.2, LOS 9.d)","explhtml":"<p>The ending fair value of plan assets = beginning fair value + contributions + actual return – benefits paid = 896 + 102 + 214 – 188 = $1,024 million (Module 9.2, LOS 9.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 45–48 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Andrew Carson is an equity analyst employed at Lee Vincent and Associates, an investment research firm. Carson is responsible for following Samilski Enterprises (Samilski), a publicly traded firm that produces motorcycles and associated mechanical parts. Samilski reports under U.S. GAAP.<\/p><p>Exhibit 1: Selected Pension Plan Information for FY 20X9 shows selected financial data pertaining to Samilski&#x27;s employee pension plan.<\/p><p>Exhibit 1: Selected Pension Plan Information for FY 20X9<\/p><p>$ Millions<\/p><div class=\"tbl\"><table><tr><td>Current service cost<\/td><td>118<\/td><\/tr><tr><td>Past service cost<\/td><td>36<\/td><\/tr><tr><td>Beginning PBO<\/td><td>1,022<\/td><\/tr><tr><td>Ending PBO<\/td><td>1,198<\/td><\/tr><tr><td>Interest cost<\/td><td>82<\/td><\/tr><tr><td>Actual return on plan assets<\/td><td>214<\/td><\/tr><tr><td>Employer contribution<\/td><td>102<\/td><\/tr><tr><td>Beginning plan assets<\/td><td>896<\/td><\/tr><\/table><\/div><p>During fiscal year 20X9, a change in actuarial assumptions regarding employee life expectancy resulted in an actuarial loss of $128 million. Average employee service life is estimated to be 20 years. In addition to the defined benefit plan, Samilski also offers an executive stock option plan which vests equally over three years. The discount rate and expected return on plan assets are 8% and 10% respectively. Carson believes that rate of compensation increase will be 5% as opposed to the 4% assumed by the plan.<\/p><\/div><\/details><div class=\"qtext\"><p>The ending fair value of plan assets is closest to:<\/p><\/div>","subj":"fsa"},{"n":47,"q":"For this question only, if Samilski used a lower stock price volatility, the most likely impact on return on ending stockholder's equity will be:","opts":["ROE will be lower due to the lower volatility assumption.","ROE will be higher due to the lower volatility assumption.","There will be no impact on ROE."],"ans":"B","expl":"A lower volatility estimate reduces the fair value of the options. Hence the amortized amount (expensed to the income statement) will be lower and net income will be higher. ROE = net income / shareholders' equity. Ending stockholders' equity will not be affected because a higher retained earnings with a lower volatility assumption would offset a lower share based compensation reserve.\n(Module 9.1, LOS 9.b)","explhtml":"<p>A lower volatility estimate reduces the fair value of the options. Hence the amortized amount (expensed to the income statement) will be lower and net income will be higher. ROE = net income / shareholders&#x27; equity. Ending stockholders&#x27; equity will not be affected because a higher retained earnings with a lower volatility assumption would offset a lower share based compensation reserve.<\/p><p>(Module 9.1, LOS 9.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 45–48 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Andrew Carson is an equity analyst employed at Lee Vincent and Associates, an investment research firm. Carson is responsible for following Samilski Enterprises (Samilski), a publicly traded firm that produces motorcycles and associated mechanical parts. Samilski reports under U.S. GAAP.<\/p><p>Exhibit 1: Selected Pension Plan Information for FY 20X9 shows selected financial data pertaining to Samilski&#x27;s employee pension plan.<\/p><p>Exhibit 1: Selected Pension Plan Information for FY 20X9<\/p><p>$ Millions<\/p><div class=\"tbl\"><table><tr><td>Current service cost<\/td><td>118<\/td><\/tr><tr><td>Past service cost<\/td><td>36<\/td><\/tr><tr><td>Beginning PBO<\/td><td>1,022<\/td><\/tr><tr><td>Ending PBO<\/td><td>1,198<\/td><\/tr><tr><td>Interest cost<\/td><td>82<\/td><\/tr><tr><td>Actual return on plan assets<\/td><td>214<\/td><\/tr><tr><td>Employer contribution<\/td><td>102<\/td><\/tr><tr><td>Beginning plan assets<\/td><td>896<\/td><\/tr><\/table><\/div><p>During fiscal year 20X9, a change in actuarial assumptions regarding employee life expectancy resulted in an actuarial loss of $128 million. Average employee service life is estimated to be 20 years. In addition to the defined benefit plan, Samilski also offers an executive stock option plan which vests equally over three years. The discount rate and expected return on plan assets are 8% and 10% respectively. Carson believes that rate of compensation increase will be 5% as opposed to the 4% assumed by the plan.<\/p><\/div><\/details><div class=\"qtext\"><p>For this question only, if Samilski used a lower stock price volatility, the most likely impact on return on ending stockholder&#x27;s equity will be:<\/p><\/div>","subj":"fsa"},{"n":48,"q":"The amount of periodic pension cost reported in P&L if Samilski reported under IFRS would be closest to:","opts":["$144 million.","$152 million.","$166 million."],"ans":"C","expl":"Under IFRS, periodic pension cost reported in P&L would consist of current and past service cost plus/minus net interest expense/income. Net interest income is computed as the discount rate multiplied by beginning funded status (adjusted for past service cost).\nperiodic pension cost in P&L = 118 + 36 – 0.08[896 – 1,022 – 36] = 166.96\nNote that because the beginning funded status is negative, there is a net interest cost.\n(Module 9.2, LOS 9.d)","explhtml":"<p>Under IFRS, periodic pension cost reported in P&amp;L would consist of current and past service cost plus/minus net interest expense/income. Net interest income is computed as the discount rate multiplied by beginning funded status (adjusted for past service cost).<\/p><p>periodic pension cost in P&amp;L = 118 + 36 – 0.08[896 – 1,022 – 36] = 166.96<\/p><p>Note that because the beginning funded status is negative, there is a net interest cost.<\/p><p>(Module 9.2, LOS 9.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 45–48 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Andrew Carson is an equity analyst employed at Lee Vincent and Associates, an investment research firm. Carson is responsible for following Samilski Enterprises (Samilski), a publicly traded firm that produces motorcycles and associated mechanical parts. Samilski reports under U.S. GAAP.<\/p><p>Exhibit 1: Selected Pension Plan Information for FY 20X9 shows selected financial data pertaining to Samilski&#x27;s employee pension plan.<\/p><p>Exhibit 1: Selected Pension Plan Information for FY 20X9<\/p><p>$ Millions<\/p><div class=\"tbl\"><table><tr><td>Current service cost<\/td><td>118<\/td><\/tr><tr><td>Past service cost<\/td><td>36<\/td><\/tr><tr><td>Beginning PBO<\/td><td>1,022<\/td><\/tr><tr><td>Ending PBO<\/td><td>1,198<\/td><\/tr><tr><td>Interest cost<\/td><td>82<\/td><\/tr><tr><td>Actual return on plan assets<\/td><td>214<\/td><\/tr><tr><td>Employer contribution<\/td><td>102<\/td><\/tr><tr><td>Beginning plan assets<\/td><td>896<\/td><\/tr><\/table><\/div><p>During fiscal year 20X9, a change in actuarial assumptions regarding employee life expectancy resulted in an actuarial loss of $128 million. Average employee service life is estimated to be 20 years. In addition to the defined benefit plan, Samilski also offers an executive stock option plan which vests equally over three years. The discount rate and expected return on plan assets are 8% and 10% respectively. Carson believes that rate of compensation increase will be 5% as opposed to the 4% assumed by the plan.<\/p><\/div><\/details><div class=\"qtext\"><p>The amount of periodic pension cost reported in P&amp;L if Samilski reported under IFRS would be closest to:<\/p><\/div>","subj":"fsa"},{"n":49,"q":"What is the change in probability of an increase in dividends when the growth rate in EPS increases by 1%?","opts":["3.13%.","4.19%.","4.37%."],"ans":"B","expl":"The change in ln(odds) for a 1% increase in growth rate = –3.13. -3.13\nThe change in odds = e | = 0.0437.\nThe change in probability = 0.0437 / (1 + 0.0437) = 0.0419, or 4.19%. (Module 1.4, LOS 1.l)","explhtml":"<p>The change in ln(odds) for a 1% increase in growth rate = –3.13. <sup>-3.13<\/sup><\/p><div class=\"tbl\"><table><tr><td>The change in odds = e<\/td><td> = 0.0437.<\/td><\/tr><\/table><\/div><p>The change in probability = 0.0437 / (1 + 0.0437) = 0.0419, or 4.19%. (Module 1.4, LOS 1.l)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>Henke Malfoy, CFA, is an analyst with Alpha Securities. He is interested in forecasting dividend increases in large-cap U.S. stocks. Malfoy starts out with a database of 500 stocks in the S&amp;P 500 Index and formulates the following model: div = b0 + b1ΔFCFE + b2 growth + b3 D/E where:<\/p><p>Div = 1 if the dividend increase, else = 0 ΔFCFE = % change in FCFE from prior year Growth = growth rate in EPS over the past five years D/E = debt-to-equity ratio Exhibit 1: Regression Results shows the results of the model for the year 20X2. Exhibit 1: Regression Results<\/p><div class=\"tbl\"><table><tr><td>Coefficient<\/td><td>P-Value<\/td><td><\/td><\/tr><tr><td>Intercept<\/td><td>-2.03<\/td><td>0.02<\/td><\/tr><tr><td>ΔFCFE<\/td><td>-3.112<\/td><td>0.04<\/td><\/tr><tr><td>Growth<\/td><td>-3.13<\/td><td>0.01<\/td><\/tr><tr><td>D/E<\/td><td>-1.118<\/td><td>0.01<\/td><\/tr><\/table><\/div><p>Malfoy&#x27;s colleague, Beth Griner, comments that the usefulness of the output is dependent on proper model specification. Griner is particularly concerned that improper model specification may lead to biased and inconsistent model parameters. Malfoy wants to use advanced algorithms to parse through MD&amp;A in company 10-Q reports to predict dividend increases. Malfoy starts by removing numbers, punctuation, blank spaces, and HTML tags from the text data.<\/p><\/div><\/details><div class=\"qtext\"><p>What is the change in probability of an increase in dividends when the growth rate in EPS increases by 1%?<\/p><\/div>","subj":"quant"},{"n":50,"q":"Griner is most likely concerned with the model misspecification of:","opts":["inappropriate transformation.","data that is improperly pooled.","the omission of important independent variables."],"ans":"C","expl":"We are given that Griner is concerned with biased and inconsistent model parameters. The omission of important variables could lead to biased and inconsistent regression parameters. It may also lead to serial correlation or heteroskedasticity in residuals. Improperly pooled data may lead to serial correlation or heteroskedasticity in residuals. Inappropriate transformation may lead to heteroskedasticity in residuals. (Module 1.3, LOS 1.g)","explhtml":"<p>We are given that Griner is concerned with biased and inconsistent model parameters. The omission of important variables could lead to biased and inconsistent regression parameters. It may also lead to serial correlation or heteroskedasticity in residuals. Improperly pooled data may lead to serial correlation or heteroskedasticity in residuals. Inappropriate transformation may lead to heteroskedasticity in residuals. (Module 1.3, LOS 1.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Henke Malfoy, CFA, is an analyst with Alpha Securities. He is interested in forecasting dividend increases in large-cap U.S. stocks. Malfoy starts out with a database of 500 stocks in the S&amp;P 500 Index and formulates the following model: div = b0 + b1ΔFCFE + b2 growth + b3 D/E where:<\/p><p>Div = 1 if the dividend increase, else = 0 ΔFCFE = % change in FCFE from prior year Growth = growth rate in EPS over the past five years D/E = debt-to-equity ratio Exhibit 1: Regression Results shows the results of the model for the year 20X2. Exhibit 1: Regression Results<\/p><div class=\"tbl\"><table><tr><td>Coefficient<\/td><td>P-Value<\/td><td><\/td><\/tr><tr><td>Intercept<\/td><td>-2.03<\/td><td>0.02<\/td><\/tr><tr><td>ΔFCFE<\/td><td>-3.112<\/td><td>0.04<\/td><\/tr><tr><td>Growth<\/td><td>-3.13<\/td><td>0.01<\/td><\/tr><tr><td>D/E<\/td><td>-1.118<\/td><td>0.01<\/td><\/tr><\/table><\/div><p>Malfoy&#x27;s colleague, Beth Griner, comments that the usefulness of the output is dependent on proper model specification. Griner is particularly concerned that improper model specification may lead to biased and inconsistent model parameters. Malfoy wants to use advanced algorithms to parse through MD&amp;A in company 10-Q reports to predict dividend increases. Malfoy starts by removing numbers, punctuation, blank spaces, and HTML tags from the text data.<\/p><\/div><\/details><div class=\"qtext\"><p>Griner is most likely concerned with the model misspecification of:<\/p><\/div>","subj":"quant"},{"n":51,"q":"The most appropriate machine learning algorithm for Malfoy to use to analyze MD&A is:","opts":["principal components analysis.","support vector machine.","random forest."],"ans":"B","expl":"Support vector machine can (among other uses) be applied to classify text from documents into categories useful for investors. Principal components analysis is used for unsupervised learning (where there is no target variable; here, we have a qualitative target variable). A random forest is used with a continuous (rather than categorical) target variable. (Module 3.2, LOS 3.c)","explhtml":"<p>Support vector machine can (among other uses) be applied to classify text from documents into categories useful for investors. Principal components analysis is used for unsupervised learning (where there is no target variable; here, we have a qualitative target variable). A random forest is used with a continuous (rather than categorical) target variable. (Module 3.2, LOS 3.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Henke Malfoy, CFA, is an analyst with Alpha Securities. He is interested in forecasting dividend increases in large-cap U.S. stocks. Malfoy starts out with a database of 500 stocks in the S&amp;P 500 Index and formulates the following model: div = b0 + b1ΔFCFE + b2 growth + b3 D/E where:<\/p><p>Div = 1 if the dividend increase, else = 0 ΔFCFE = % change in FCFE from prior year Growth = growth rate in EPS over the past five years D/E = debt-to-equity ratio Exhibit 1: Regression Results shows the results of the model for the year 20X2. Exhibit 1: Regression Results<\/p><div class=\"tbl\"><table><tr><td>Coefficient<\/td><td>P-Value<\/td><td><\/td><\/tr><tr><td>Intercept<\/td><td>-2.03<\/td><td>0.02<\/td><\/tr><tr><td>ΔFCFE<\/td><td>-3.112<\/td><td>0.04<\/td><\/tr><tr><td>Growth<\/td><td>-3.13<\/td><td>0.01<\/td><\/tr><tr><td>D/E<\/td><td>-1.118<\/td><td>0.01<\/td><\/tr><\/table><\/div><p>Malfoy&#x27;s colleague, Beth Griner, comments that the usefulness of the output is dependent on proper model specification. Griner is particularly concerned that improper model specification may lead to biased and inconsistent model parameters. Malfoy wants to use advanced algorithms to parse through MD&amp;A in company 10-Q reports to predict dividend increases. Malfoy starts by removing numbers, punctuation, blank spaces, and HTML tags from the text data.<\/p><\/div><\/details><div class=\"qtext\"><p>The most appropriate machine learning algorithm for Malfoy to use to analyze MD&amp;A is:<\/p><\/div>","subj":"quant"},{"n":52,"q":"The step taken by Malfoy to transform the textual data would most appropriately be called:","opts":["text preprocessing.","data wrangling.","text cleansing."],"ans":"C","expl":"The procedure described would most accurately be called text cleansing. Text cleansing typically involves removing HTML tags, punctuation, white spaces, and most numbers. The data wrangling (also called preprocessing) task performs transformations on cleansed data to ready it for model training. Data wrangling or preprocessing may include dealing with outliers, extracting useful variables, and scaling the data. (Module 4.1, LOS 4.g)","explhtml":"<p>The procedure described would most accurately be called text cleansing. Text cleansing typically involves removing HTML tags, punctuation, white spaces, and most numbers. The data wrangling (also called preprocessing) task performs transformations on cleansed data to ready it for model training. Data wrangling or preprocessing may include dealing with outliers, extracting useful variables, and scaling the data. (Module 4.1, LOS 4.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Henke Malfoy, CFA, is an analyst with Alpha Securities. He is interested in forecasting dividend increases in large-cap U.S. stocks. Malfoy starts out with a database of 500 stocks in the S&amp;P 500 Index and formulates the following model: div = b0 + b1ΔFCFE + b2 growth + b3 D/E where:<\/p><p>Div = 1 if the dividend increase, else = 0 ΔFCFE = % change in FCFE from prior year Growth = growth rate in EPS over the past five years D/E = debt-to-equity ratio Exhibit 1: Regression Results shows the results of the model for the year 20X2. Exhibit 1: Regression Results<\/p><div class=\"tbl\"><table><tr><td>Coefficient<\/td><td>P-Value<\/td><td><\/td><\/tr><tr><td>Intercept<\/td><td>-2.03<\/td><td>0.02<\/td><\/tr><tr><td>ΔFCFE<\/td><td>-3.112<\/td><td>0.04<\/td><\/tr><tr><td>Growth<\/td><td>-3.13<\/td><td>0.01<\/td><\/tr><tr><td>D/E<\/td><td>-1.118<\/td><td>0.01<\/td><\/tr><\/table><\/div><p>Malfoy&#x27;s colleague, Beth Griner, comments that the usefulness of the output is dependent on proper model specification. Griner is particularly concerned that improper model specification may lead to biased and inconsistent model parameters. Malfoy wants to use advanced algorithms to parse through MD&amp;A in company 10-Q reports to predict dividend increases. Malfoy starts by removing numbers, punctuation, blank spaces, and HTML tags from the text data.<\/p><\/div><\/details><div class=\"qtext\"><p>The step taken by Malfoy to transform the textual data would most appropriately be called:<\/p><\/div>","subj":"quant"},{"n":53,"q":"Which of the following amounts is the most appropriate forecast of Schubert's book value per share and residual income, respectively, for 2019?\nBook value per share | Residual income","opts":["$36.43 $0.38","$38.00 $2.32","$36.43 $2.32"],"ans":"A","expl":"Beginning book value | = Total Equity = Common shares + Retained earnings = 2,100,000 + 2,081,000 = $4,181,000\nBeginning book value (Bt–1) | $32.16 ($4,181,000 / 130,000)\nEarnings per share forecast (Et) | $4.50 (given)\nDividend forecast (Dt = Et × payout ratio) | $0.23 ($4.50 × 5%)\nForecast book value per share (Bt–1 + Et − Dt) | $36.43\nEquity charge per share (r × Bt–1) | $4.12 (0.128 × $32.16)\nPer share RIt[(Et − (r × Bt–1)] | $0.38 ($4.50 − $4.12)\n(Module 23.2, LOS 23.c)","explhtml":"<div class=\"tbl\"><table><tr><td>Beginning book value<\/td><td>= Total Equity = Common shares + Retained earnings = 2,100,000 + 2,081,000 = $4,181,000<\/td><\/tr><tr><td>Beginning book value (Bt–1)<\/td><td>$32.16 ($4,181,000 / 130,000)<\/td><\/tr><tr><td>Earnings per share forecast (Et)<\/td><td>$4.50 (given)<\/td><\/tr><tr><td>Dividend forecast (Dt = Et × payout ratio)<\/td><td>$0.23 ($4.50 × 5%)<\/td><\/tr><tr><td>Forecast book value per share (Bt–1 + Et − Dt)<\/td><td>$36.43<\/td><\/tr><tr><td>Equity charge per share (r × Bt–1)<\/td><td>$4.12 (0.128 × $32.16)<\/td><\/tr><tr><td>Per share RIt[(Et − (r × Bt–1)]<\/td><td>$0.38 ($4.50 − $4.12)<\/td><\/tr><\/table><\/div><p>(Module 23.2, LOS 23.c)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 53–56 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Lorenz Kummert is a junior equity analyst who is following Schubert, Inc. (Schubert), a small publicly traded company in the United States. His supervisor, Markus Alter, CFA, has advised him to use the residual income model to analyze Schubert.<\/p><p>Kummert has determined Schubert&#x27;s cost of equity, cost of debt, and weighted s on the income statement. Upon review of Kummert&#x27;s preliminary report, Alter concurs with his analysis of the financial statements but reminds him that Schubert&#x27;s long-term debt is currently trading at 95% of its book value. He also cautions Kummert that violations of the clean surplus relation can bias the results of the residual income model. The consensus annual EPS estimate for 2019 is $4.50, and the dividend payout ratio for 2019 is estimated at 5%.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following amounts is the most appropriate forecast of Schubert&#x27;s book value per share and residual income, respectively, for 2019?<\/p><div class=\"tbl\"><table><tr><td>Book value per share<\/td><td>Residual income<\/td><\/tr><\/table><\/div><\/div>","subj":"equity"},{"n":54,"q":"Which of the following amounts are closest to Schubert's economic value added (EVA) for fiscal year 2018 and market value added (MVA) as of fiscal year-end 2018, respectively?\nEVA | MVA","opts":["$179,361 $188,450","$23,455 $369,500","($70,900) $369,500"],"ans":"A","expl":"Economic value added (EVA) is calculated as follows: $WACC = WACC × total capital (beginning of 2018) = 0.119 × ($6,200,000 + $3,281,000) = $1,128,239 Note that total capital = net working capital + net fixed assets OR book value of long-term debt + book value of equity\nEVA | = NOPAT − $WACC = EBIT(1 − t) − $WACC = $1,868,000(1 − 0.30) − $1,128,239 = $179,361\nmarket value of the company (year-end 2018) = market value of the equity + market value of the debt = ($36 × 130,000) + (0.95 × 6,211,000) = $10,580,450\nmarket value added (MVA) = market value − total capital = $10,580,450 − ($6,211,000 + $2,100,000 + $2,081,000) = $188,450 (Module 23.1, LOS 23.a)","explhtml":"<p>Economic value added (EVA) is calculated as follows: $WACC = WACC × total capital (beginning of 2018) = 0.119 × ($6,200,000 + $3,281,000) = $1,128,239 Note that total capital = net working capital + net fixed assets OR book value most of its first 30 years in business and has prided itself on being the one-stop shopping destination for consumers living on the West Coast of the United States. Recently, FDS began to experience both top and bottom line difficulties due to increased competition from specialty retailers who could operate more efficiently and offer a wider range of products in a focused retailing sector. When the company&#x27;s main bank reduced FDS&#x27;s line of credit, a serious working capital crisis ensued, and the company was forced to issue additional equity in an effort to overcome the problem.<\/p><p>FDS has a cost of capital of 10% and a required rate of return on equity of 12%. Dividends are growing at a rate of 8%, but the growth rate is expected to decline linearly over the next six years to a long-term growth rate of 4%. The company recently paid an annual dividend of $1.<\/p><p>At the end of 2018, FDS announced that it would be expanding its retail operations, moving to a warehouse concept, and opening new stores around the country. FDS also announced it would close some existing stores, write-down assets, and take a large restructuring charge. Upon reviewing the prospects of the firm, Emery issued an earnings-per-share forecast for 2019 of $0.90. He set a 12-month share price target of $22.50. Immediately following the expansion announcement, the share price of FDS jumped from $14 to $18.<\/p><p>Exhibit 1: Summary Income Statement, Ferguson Department Stores, Inc. (U.S. $ millions, except per share data and shares outstanding)<\/p><div class=\"tbl\"><table><tr><td>2018<\/td><td>2017<\/td><td><\/td><\/tr><tr><td>Sales<\/td><td>$6,435.9<\/td><td>$6,322.7<\/td><\/tr><\/table><\/div><p>Cost of goods sold, operating, administrative, and selling<\/p><div class=\"tbl\"><table><tr><td>6,007.9<\/td><td>5,875.9<\/td><\/tr><\/table><\/div><p>expenses<\/p><div class=\"tbl\"><table><tr><td>Depreciation and amortization<\/td><td>148.7<\/td><td>146.6<\/td><\/tr><tr><td>Interest expense<\/td><td>59.8<\/td><td>59.5<\/td><\/tr><tr><td>Unusual items—expense<\/td><td>189.1<\/td><td>5.0<\/td><\/tr><tr><td>Earnings before tax<\/td><td>30.4<\/td><td>235.7<\/td><\/tr><tr><td>Income taxes—current<\/td><td>49.3<\/td><td>7.5<\/td><\/tr><tr><td>Income taxes—future<\/td><td>(71.1)<\/td><td>93.5<\/td><\/tr><tr><td>(21.8)<\/td><td>101.0<\/td><td><\/td><\/tr><tr><td>Net earnings for the year<\/td><td>$52.2<\/td><td>$134.7<\/td><\/tr><tr><td>Earnings per share: Basic<\/td><td>$0.49<\/td><td>$1.26<\/td><\/tr><tr><td>Fully diluted<\/td><td>$0.49<\/td><td>$1.26<\/td><\/tr><tr><td>Weighted average shares outstanding<\/td><td>106,530,610<\/td><td>106,530,610<\/td><\/tr><\/table><\/div><p>In 2018, FDS also reported an unusual expense of $189.1 million related to restructuring costs and asset write downs.<\/p><p>Exhibit 2: Selected Industry Information for 2018<\/p><div class=\"tbl\"><table><tr><td>Estimated earnings growth rate<\/td><td>0.10<\/td><\/tr><tr><td>Mean trailing price/earnings (P/E) ratio<\/td><td>22.50<\/td><\/tr><tr><td>Mean price/sales (P/S) ratio<\/td><td>0.50<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The value of one share of FDS using the H-model is closest to:<\/p><\/div>","subj":"equity"},{"n":58,"q":"Assuming that the cost of equity for FDS does not change, the present value of growth opportunities in the share price following the announcement that the company would be expanding its retail operations, using Emery's 2019 earnings forecast, is closest to:","opts":["$9.00.","$10.50.","$12.50."],"ans":"B","expl":"E1\nThe relationship we need to evaluate is V0= r | + PVGO.\nThis expression can be rewritten as\nE1 | $0.90\nPVGO = V0– | = $18 − | = $10.50.\nr | 0.12\n(Module 20.2, LOS 20.g)","explhtml":"<p>E1<\/p><div class=\"tbl\"><table><tr><td>The relationship we need to evaluate is V0= r<\/td><td>+ PVGO.<\/td><\/tr><\/table><\/div><p>This expression can be rewritten as<\/p><div class=\"tbl\"><table><tr><td>E1<\/td><td>$ nt public in 1979 following a major acquisition, and the Ferguson name quickly became one of the most recognized in retailing. Ferguson had been successful through most of its first 30 years in business and has prided itself on being the one-stop shopping destination for consumers living on the West Coast of the United States. Recently, FDS began to experience both top and bottom line difficulties due to increased competition from specialty retailers who could operate more efficiently and offer a wider range of products in a focused retailing sector. When the company&#x27;s main bank reduced FDS&#x27;s line of credit, a serious working capital crisis ensued, and the company was forced to issue additional equity in an effort to overcome the problem.<\/p><p>FDS has a cost of capital of 10% and a required rate of return on equity of 12%. Dividends are growing at a rate of 8%, but the growth rate is expected to decline linearly over the next six years to a long-term growth rate of 4%. The company recently paid an annual dividend of $1.<\/p><p>At the end of 2018, FDS announced that it would be expanding its retail operations, moving to a warehouse concept, and opening new stores around the country. FDS also announced it would close some existing stores, write-down assets, and take a large restructuring charge. Upon reviewing the prospects of the firm, Emery issued an earnings-per-share forecast for 2019 of $0.90. He set a 12-month share price target of $22.50. Immediately following the expansion announcement, the share price of FDS jumped from $14 to $18.<\/p><p>Exhibit 1: Summary Income Statement, Ferguson Department Stores, Inc. (U.S. $ millions, except per share data and shares outstanding)<\/p><div class=\"tbl\"><table><tr><td>2018<\/td><td>2017<\/td><td><\/td><\/tr><tr><td>Sales<\/td><td>$6,435.9<\/td><td>$6,322.7<\/td><\/tr><\/table><\/div><p>Cost of goods sold, operating, administrative, and selling<\/p><div class=\"tbl\"><table><tr><td>6,007.9<\/td><td>5,875.9<\/td><\/tr><\/table><\/div><p>expenses<\/p><div class=\"tbl\"><table><tr><td>Depreciation and amortization<\/td><td>148.7<\/td><td>146.6<\/td><\/tr><tr><td>Interest expense<\/td><td>59.8<\/td><td>59.5<\/td><\/tr><tr><td>Unusual items—expense<\/td><td>189.1<\/td><td>5.0<\/td><\/tr><tr><td>Earnings before tax<\/td><td>30.4<\/td><td>235.7<\/td><\/tr><tr><td>Income taxes—current<\/td><td>49.3<\/td><td>7.5<\/td><\/tr><tr><td>Income taxes—future<\/td><td>(71.1)<\/td><td>93.5<\/td><\/tr><tr><td>(21.8)<\/td><td>101.0<\/td><td><\/td><\/tr><tr><td>Net earnings for the year<\/td><td>$52.2<\/td><td>$134.7<\/td><\/tr><tr><td>Earnings per share: Basic<\/td><td>$0.49<\/td><td>$1.26<\/td><\/tr><tr><td>Fully diluted<\/td><td>$0.49<\/td><td>$1.26<\/td><\/tr><tr><td>Weighted average shares outstanding<\/td><td>106,530,610<\/td><td>106,530,610<\/td><\/tr><\/table><\/div><p>In 2018, FDS also reported an unusual expense of $189.1 million related to restructuring costs and asset write downs.<\/p><p>Exhibit 2: Selected Industry Information for 2018<\/p><div class=\"tbl\"><table><tr><td>Estimated earnings growth rate<\/td><td>0.10<\/td><\/tr><tr><td>Mean trailing price/earnings (P/E) ratio<\/td><td>22.50<\/td><\/tr><tr><td>Mean price/sales (P/S) ratio<\/td><td>0.50<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Assuming a tax rate of 34%, the underlying earnings per share (EPS) for FDS in 2018 is closest to:<\/p><\/div>","subj":"equity"},{"n":60,"q":"According to FDS's price-to-sales ratio for 2018, based on the post-expansion announcement stock price, FDS is:","opts":["underpriced relative to the industry.","overpriced relative to the industry.","properly priced relative to the industry."],"ans":"A","expl":"FDS has a price-to-sales ratio in 2018 of:\n$18 | $18\n= | = 0.30.\n$6,435,900,000 | $60.41\n( 106,530,610 | )\nBecause its price-to-sales ratio is less than the industry average of 0.50, FDS is relatively underpriced. (Module 22.2, LOS 22.l)","explhtml":"<p>FDS has
