 long-term growth rate of 4%. The company recently paid an annual dividend of $1.<\/p><p>At the end of 2018, FDS announced that it would be expanding its retail operations, moving to a warehouse concept, and opening new stores around the country. FDS also announced it would close some existing stores, write-down assets, and take a large restructuring charge. Upon reviewing the prospects of the firm, Emery issued an earnings-per-share forecast for 2019 of $0.90. He set a 12-month share price target of $22.50. Immediately following the expansion announcement, the share price of FDS jumped from $14 to $18.<\/p><p>Exhibit 1: Summary Income Statement, Ferguson Department Stores, Inc. (U.S. $ millions, except per share data and shares outstanding)<\/p><div class=\"tbl\"><table><tr><td>2018<\/td><td>2017<\/td><td><\/td><\/tr><tr><td>Sales<\/td><td>$6,435.9<\/td><td>$6,322.7<\/td><\/tr><\/table><\/div><p>Cost of goods sold, operating, administrative, and selling<\/p><div class=\"tbl\"><table><tr><td>6,007.9<\/td><td>5,875.9<\/td><\/tr><\/table><\/div><p>expenses<\/p><div class=\"tbl\"><table><tr><td>Depreciation and amortization<\/td><td>148.7<\/td><td>146.6<\/td><\/tr><tr><td>Interest expense<\/td><td>59.8<\/td><td>59.5<\/td><\/tr><tr><td>Unusual items—expense<\/td><td>189.1<\/td><td>5.0<\/td><\/tr><tr><td>Earnings before tax<\/td><td>30.4<\/td><td>235.7<\/td><\/tr><tr><td>Income taxes—current<\/td><td>49.3<\/td><td>7.5<\/td><\/tr><tr><td>Income taxes—future<\/td><td>(71.1)<\/td><td>93.5<\/td><\/tr><tr><td>(21.8)<\/td><td>101.0<\/td><td><\/td><\/tr><tr><td>Net earnings for the year<\/td><td>$52.2<\/td><td>$134.7<\/td><\/tr><tr><td>Earnings per share: Basic<\/td><td>$0.49<\/td><td>$1.26<\/td><\/tr><tr><td>Fully diluted<\/td><td>$0.49<\/td><td>$1.26<\/td><\/tr><tr><td>Weighted average shares outstanding<\/td><td>106,530,610<\/td><td>106,530,610<\/td><\/tr><\/table><\/div><p>In 2018, FDS also reported an unusual expense of $189.1 million related to restructuring costs and asset write downs.<\/p><p>Exhibit 2: Selected Industry Information for 2018<\/p><div class=\"tbl\"><table><tr><td>Estimated earnings growth rate<\/td><td>0.10<\/td><\/tr><tr><td>Mean trailing price/earnings (P/E) ratio<\/td><td>22.50<\/td><\/tr><tr><td>Mean price/sales (P/S) ratio<\/td><td>0.50<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>According to FDS&#x27;s price-to-sales ratio for 2018, based on the post-expansion announcement stock price, FDS is:<\/p><\/div>","subj":"equity"},{"n":61,"q":"If Greenvalley bank had bought protection on their investment in Newspace bonds, their upfront cash flow would have been closest to:","opts":["a receipt of 4.6% of notional.","a payment of 18.2% of notional.","a receipt of 21.3% of notional."],"ans":"C","expl":"The following steps illustrate the computation of the credit spread on Newspace bonds:\n1. Calculate the value of the corporate bond assuming no default (VND): N = 7, PMT = 5, I/Y = 4, FV = 100, PV = 106.00 = VND Given CVA = 7.71, Bond price = 106 – 7.71 = 98.29 2. Calculate the yield to maturity (YTM) of the bond: N = 7, PMT = 5, FV = 100, PV = −98.29, I/Y = 5.30% 3. Credit spread = 5.30% − 4% = 1.30% Upfront payment (from protection buyer) = (credit spread – coupon) × duration = (1.3% – 5%) × 5.76 = −21.31% (Module 29.2, LOS 29.c)","explhtml":"<p>The following steps illustrate the computation of the credit spread on Newspace bonds:<\/p><p>1. Calculate the value of the corporate bond assuming no default (VND): N = 7, PMT = 5, I/Y = 4, FV = 100, PV = 106.00 = VND Given CVA = 7.71, Bond price = 106 – 7.71 = 98.29 2. Calculate the yield to maturity (YTM) of the bond: N = 7, PMT = 5, FV = 100, PV = −98.29, I/Y = 5.30% 3. Credit spread = 5.30% − 4% = 1.30% Upfront payment (from protection buyer) = (credit spread – coupon) × duration = (1.3% – 5%) × 5.76 = −21.31% (Module 29.2, LOS 29.c)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 61–64 · Fixed Income<\/summary><div class=\"vig-body\"><p>Sally Soikins, CFA, Chief Investment Officer at Greenvalley is reviewing the bank&#x27;s policies about credit risk management with Esha Leone, a senior analyst managing the bank&#x27;s fixed income portfolio.<\/p><p>Two years ago, when benchmark rates were flat at 4%, Greenvalley bank purchased $3 million par of 7-year, 5% annual-pay coupon Newspace Inc. bonds. At the time of the purchase, Leone had calculated the CVA on the bond as $7.71 per $100 par. A 5.76-year duration, 5% standardized coupon CDS on those bonds was available at that time but was not purchased by the bank. Since the investment, the credit spread on the bonds has widened by 80bps and the duration of the CDS has changed to 4.31 years.<\/p><p>Soikins observes that credit investment grade credit curves seem to be steepening. Leone makes the following two statements about credit curves:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Lower rated sectors tend to have flatter credit curves due to their higher sensitivity to the business cycle and greater uncertainty.<\/td><\/tr><tr><td>Statement 2:<\/td><td>When a company refinances a maturing debt with a new longer-dated issue, the credit curve for that issuer may experience an inversion due to higher liquidity of the new issue.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>If Greenvalley bank had bought protection on their investment in Newspace bonds, their upfront cash flow would have been closest to:<\/p><\/div>","subj":"fixed"},{"n":62,"q":"If Greenvalley bank had purchased CDS protection on their investment in Newspace bonds upon acquisition, the gain/loss on the CDS would have been closest to:","opts":["a gain of $103,440.","a loss of $344,800.","a gain of $413,760."],"ans":"A","expl":"The profit for protection buyer ≈ change in spread × duration × notional principal = +0.008 × 4.31 × 3,000,000 = $103,440.\n(Module 29.2, LOS 29.c)","explhtml":"<p>The profit for protection buyer ≈ change in spread × duration × notional principal = +0.008 × 4.31 × 3,000,000 = $103,440.<\/p><p>(Module 29.2, LOS 29.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 61–64 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sally Soikins, CFA, Chief Investment Officer at Greenvalley is reviewing the bank&#x27;s policies about credit risk management with Esha Leone, a senior analyst managing the bank&#x27;s fixed income portfolio.<\/p><p>Two years ago, when benchmark rates were flat at 4%, Greenvalley bank purchased $3 million par of 7-year, 5% annual-pay coupon Newspace Inc. bonds. At the time of the purchase, Leone had calculated the CVA on the bond as $7.71 per $100 par. A 5.76-year duration, 5% standardized coupon CDS on those bonds was available at that time but was not purchased by the bank. Since the investment, the credit spread on the bonds has widened by 80bps and the duration of the CDS has changed to 4.31 years.<\/p><p>Soikins observes that credit investment grade credit curves seem to be steepening. Leone makes the following two statements about credit curves:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Lower rated sectors tend to have flatter credit curves due to their higher sensitivity to the business cycle and greater uncertainty.<\/td><\/tr><tr><td>Statement 2:<\/td><td>When a company refinances a maturing debt with a new longer-dated issue, the credit curve for that issuer may experience an inversion due to higher liquidity of the new issue.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>If Greenvalley bank had purchased CDS protection on their investment in Newspace bonds upon acquisition, the gain/loss on the CDS would have been closest to:<\/p><\/div>","subj":"fixed"},{"n":63,"q":"Leone's Statement 1 about credit curves is best described as:","opts":["accurate.","inaccurate regarding the shape of the credit curve for the lower rated sector.","inaccurate regarding sensitivity to the business cycle."],"ans":"B","expl":"Statement 1 is correct about lower-rated sectors having higher sensitivity to the business cycle and greater uncertainty. However, Statement 1 is incorrect about the shape of the credit curve: lower rated sectors tend to have steeper credit curves. (Module 28.6, LOS 28.g)","explhtml":"<p>Statement 1 is correct about lower-rated sectors having higher sensitivity to the business cycle and greater uncertainty. However, Statement 1 is incorrect about the shape of the credit curve: lower rated sectors tend to have steeper credit curves. (Module 28.6, LOS 28.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 61–64 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sally Soikins, CFA, Chief Investment Officer at Greenvalley is reviewing the bank&#x27;s policies about credit risk management with Esha Leone, a senior analyst managing the bank&#x27;s fixed income portfolio.<\/p><p>Two years ago, when benchmark rates were flat at 4%, Greenvalley bank purchased $3 million par of 7-year, 5% annual-pay coupon Newspace Inc. bonds. At the time of the purchase, Leone had calculated the CVA on the bond as $7.71 per $100 par. A 5.76-year duration, 5% standardized coupon CDS on those bonds was available at that time but was not purchased by the bank. Since the investment, the credit spread on the bonds has widened by 80bps and the duration of the CDS has changed to 4.31 years.<\/p><p>Soikins observes that credit investment grade credit curves seem to be steepening. Leone makes the following two statements about credit curves:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Lower rated sectors tend to have flatter credit curves due to their higher sensitivity to the business cycle and greater uncertainty.<\/td><\/tr><tr><td>Statement 2:<\/td><td>When a company refinances a maturing debt with a new longer-dated issue, the credit curve for that issuer may experience an inversion due to higher liquidity of the new issue.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Leone&#x27;s Statement 1 about credit curves is best described as:<\/p><\/div>","subj":"fixed"},{"n":64,"q":"Leone's Statement 2 on credit curves is best described as:","opts":["accurate.","inaccurate about higher liquidity of the new issue.","inaccurate about inversion of the curve."],"ans":"A","expl":"Statement 2 is correct. Due to low liquidity in most corporate issues, the credit curves are most influenced by more-heavily-traded bonds. Because newly issued bonds are generally more liquid, when an issuer refinances a near-dated bond with a longer-term bond, the spread may appear to narrow for the longer maturity (possibly leading to an inverted credit spread curve). (Module 28.6, LOS 28.g)","explhtml":"<p>Statement 2 is correct. Due to low liquidity in most corporate issues, the credit curves are most influenced by more-heavily-traded bonds. Because newly issued bonds are generally more liquid, when an issuer refinances a near-dated bond with a longer-term bond, the spread may appear to narrow for the longer maturity (possibly leading to an inverted credit spread curve). (Module 28.6, LOS 28.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 61–64 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sally Soikins, CFA, Chief Investment Officer at Greenvalley is reviewing the bank&#x27;s policies about credit risk management with Esha Leone, a senior analyst managing the bank&#x27;s fixed income portfolio.<\/p><p>Two years ago, when benchmark rates were flat at 4%, Greenvalley bank purchased $3 million par of 7-year, 5% annual-pay coupon Newspace Inc. bonds. At the time of the purchase, Leone had calculated the CVA on the bond as $7.71 per $100 par. A 5.76-year duration, 5% standardized coupon CDS on those bonds was available at that time but was not purchased by the bank. Since the investment, the credit spread on the bonds has widened by 80bps and the duration of the CDS has changed to 4.31 years.<\/p><p>Soikins observes that credit investment grade credit curves seem to be steepening. Leone makes the following two statements about credit curves:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Lower rated sectors tend to have flatter credit curves due to their higher sensitivity to the business cycle and greater uncertainty.<\/td><\/tr><tr><td>Statement 2:<\/td><td>When a company refinances a maturing debt with a new longer-dated issue, the credit curve for that issuer may experience an inversion due to higher liquidity of the new issue.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Leone&#x27;s Statement 2 on credit curves is best described as:<\/p><\/div>","subj":"fixed"},{"n":65,"q":"Was there a credit event for Welby, and if so what settlement method is Rodney Partners most likely to prefer?","opts":["Yes; cash settlement.","Yes; physical settlement.","No."],"ans":"A","expl":"Under the ISDA terms, a credit event occurs when the issuer fails to make a scheduled coupon payment. RP would prefer a cash settlement because the cheapest-to-deliver bond is the 5% senior unsecured bonds trading at 50% of par. The bank would, therefore, receive 50% of notional (or $6 million) as cash settlement and sell their holdings at 55% of par (or $6.60 million) for a total of $12.60 million. Under physical settlement, the bank would tender its holdings of $12 million par bonds and receive a settlement of $12 million. (Module 29.1, LOS 29.b)","explhtml":"<p>Under the ISDA terms, a credit event occurs when the issuer fails to make a scheduled coupon payment. RP would prefer a cash settlement because the cheapest-to-deliver bond is the 5% senior unsecured bonds trading at 50% of par. The bank would, therefore, receive 50% of notional (or $6 million) as cash settlement and sell their holdings at 55% of par (or $6.60 million) for a total of $12.60 million. Under physical settlement, the bank would tender its holdings of $12 million par bonds and receive a settlement of $12 million. (Module 29.1, LOS 29.b)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 65–68 · Fixed Income<\/summary><div class=\"vig-body\"><p>Nayna Shah, CFA, leads the fixed income department at Rodney Partners (RP). Shah has recently hired Susan Reynolds, a new economics graduate. During a previous meeting with Reynolds, Shah had mentioned purchasing a $12 million CDS on Welby, Inc., bonds that is currently part of the RP&#x27;s portfolio. While Welby has not declared bankruptcy, it recently missed a coupon payment. Shah asks Reynolds to provide details of RP&#x27;s position and planned course of action.  Exhibit 1: Welby Inc. provides some of the information that Reynolds has collected.<\/p><p>Exhibit 1: Welby Inc.<\/p><div class=\"tbl\"><table><tr><td>RP&#x27;s position:<\/td><td>$12 million par, 6% senior unsecured maturing in five years.<\/td><\/tr><\/table><\/div><p>CDS Protection buyer, standardized coupon of 5%<\/p><p>Current market prices of Welby bonds:<\/p><div class=\"tbl\"><table><tr><td>6% senior unsecured<\/td><td>55% of par<\/td><\/tr><tr><td>5% subordinated unsecured debentures<\/td><td>40% of par<\/td><\/tr><tr><td>5% senior unsecured<\/td><td>50% of par<\/td><\/tr><\/table><\/div><p>Shah notes that RP has also purchased $10 million notional, index CDS position in CDX-HY and that Welby is one of the 125 constituents in that index.<\/p><p>While discussing credit risk analysis, Reynolds makes the following two statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>One of the assumptions of the structural models of credit analysis is that the company has no off-balance sheet debt.<\/td><\/tr><tr><td>Statement 2:<\/td><td>In the case of an ABS, credit analysis focuses on the credit quality of the servicer.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Was there a credit event for Welby, and if so what settlement method is Rodney Partners most likely to prefer?<\/p><\/div>","subj":"fixed"},{"n":66,"q":"Assuming a default for Welby, the notional for RP's CDX-HY index CDS would be adjusted to an amount closest to:","opts":["$9.92 million.","$9.99 million.","$10.00 million."],"ans":"A","expl":"The original notional would be reduced by 1/125th of the notional principal of $10 million or $80,000. New notional = $10,000,000 – $80,000 = $9,920,000. (Module 29.1, LOS 29.a)","explhtml":"<p>The original notional would be reduced by 1/125th of the notional principal of $10 million or $80,000. New notional = $10,000,000 – $80,000 = $9,920,000. (Module 29.1, LOS 29.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 65–68 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Nayna Shah, CFA, leads the fixed income department at Rodney Partners (RP). Shah has recently hired Susan Reynolds, a new economics graduate. During a previous meeting with Reynolds, Shah had mentioned purchasing a $12 million CDS on Welby, Inc., bonds that is currently part of the RP&#x27;s portfolio. While Welby has not declared bankruptcy, it recently missed a coupon payment. Shah asks Reynolds to provide details of RP&#x27;s position and planned course of action.  Exhibit 1: Welby Inc. provides some of the information that Reynolds has collected.<\/p><p>Exhibit 1: Welby Inc.<\/p><div class=\"tbl\"><table><tr><td>RP&#x27;s position:<\/td><td>$12 million par, 6% senior unsecured maturing in five years.<\/td><\/tr><\/table><\/div><p>CDS Protection buyer, standardized coupon of 5%<\/p><p>Current market prices of Welby bonds:<\/p><div class=\"tbl\"><table><tr><td>6% senior unsecured<\/td><td>55% of par<\/td><\/tr><tr><td>5% subordinated unsecured debentures<\/td><td>40% of par<\/td><\/tr><tr><td>5% senior unsecured<\/td><td>50% of par<\/td><\/tr><\/table><\/div><p>Shah notes that RP has also purchased $10 million notional, index CDS position in CDX-HY and that Welby is one of the 125 constituents in that index.<\/p><p>While discussing credit risk analysis, Reynolds makes the following two statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>One of the assumptions of the structural models of credit analysis is that the company has no off-balance sheet debt.<\/td><\/tr><tr><td>Statement 2:<\/td><td>In the case of an ABS, credit analysis focuses on the credit quality of the servicer.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Assuming a default for Welby, the notional for RP&#x27;s CDX-HY index CDS would be adjusted to an amount closest to:<\/p><\/div>","subj":"fixed"},{"n":67,"q":"Reynolds's Statement 1 is most likely:","opts":["correct.","incorrect as structural models can incorporate the risk of off-balance sheet debt as long as the assets of the company trade.","incorrect because off-balance sheet debt is a zero-coupon liability."],"ans":"A","expl":"Statement 1 is correct. Structural models assume a simple balance sheet. When companies have off balance sheet debt, the default barrier under the structural model (i.e., \"K\") would be inaccurate and therefore lead to inaccurate estimates of credit risk. (Module 28.4, LOS 28.d)","explhtml":"<p>Statement 1 is correct. Structural models assume a simple balance sheet. When companies have off balance sheet debt, the default barrier under the structural model (i.e., &quot;K&quot;) would be inaccurate and therefore lead to inaccurate estimates of credit risk. (Module 28.4, LOS 28.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 65–68 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Nayna Shah, CFA, leads the fixed income department at Rodney Partners (RP). Shah has recently hired Susan Reynolds, a new economics graduate. During a previous meeting with Reynolds, Shah had mentioned purchasing a $12 million CDS on Welby, Inc., bonds that is currently part of the RP&#x27;s portfolio. While Welby has not declared bankruptcy, it recently missed a coupon payment. Shah asks Reynolds to provide details of RP&#x27;s position and planned course of action.  Exhibit 1: Welby Inc. provides some of the information that Reynolds has collected.<\/p><p>Exhibit 1: Welby Inc.<\/p><div class=\"tbl\"><table><tr><td>RP&#x27;s position:<\/td><td>$12 million par, 6% senior unsecured maturing in five years.<\/td><\/tr><\/table><\/div><p>CDS Protection buyer, standardized coupon of 5%<\/p><p>Current market prices of Welby bonds:<\/p><div class=\"tbl\"><table><tr><td>6% senior unsecured<\/td><td>55% of par<\/td><\/tr><tr><td>5% subordinated unsecured debentures<\/td><td>40% of par<\/td><\/tr><tr><td>5% senior unsecured<\/td><td>50% of par<\/td><\/tr><\/table><\/div><p>Shah notes that RP has also purchased $10 million notional, index CDS position in CDX-HY and that Welby is one of the 125 constituents in that index.<\/p><p>While discussing credit risk analysis, Reynolds makes the following two statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>One of the assumptions of the structural models of credit analysis is that the company has no off-balance sheet debt.<\/td><\/tr><tr><td>Statement 2:<\/td><td>In the case of an ABS, credit analysis focuses on the credit quality of the servicer.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Reynolds&#x27;s Statement 1 is most likely:<\/p><\/div>","subj":"fixed"},{"n":68,"q":"Reynold's Statement 2 is most likely:","opts":["correct.","incorrect as credit analysis of ABS focuses on the quality of the collateral pool and the structure of the ABS and not on servicer quality.","incorrect as credit analysis of ABS focuses on the quality of the collateral pool, the structure of the ABS, and servicer quality, and not on servicer credit quality."],"ans":"C","expl":"Statement 2 is incorrect. Credit analysis of ABS is based on analysis of the collateral pool, the structure of the ABS and servicer quality. (Module 28.7, LOS 28.h)","explhtml":"<p>Statement 2 is incorrect. Credit analysis of ABS is based on analysis of the collateral pool, the structure of the ABS and servicer quality. (Module 28.7, LOS 28.h)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 65–68 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Nayna Shah, CFA, leads the fixed income department at Rodney Partners (RP). Shah has recently hired Susan Reynolds, a new economics graduate. During a previous meeting with Reynolds, Shah had mentioned purchasing a $12 million CDS on Welby, Inc., bonds that is currently part of the RP&#x27;s portfolio. While Welby has not declared bankruptcy, it recently missed a coupon payment. Shah asks Reynolds to provide details of RP&#x27;s position and planned course of action.  Exhibit 1: Welby Inc. provides some of the information that Reynolds has collected.<\/p><p>Exhibit 1: Welby Inc.<\/p><div class=\"tbl\"><table><tr><td>RP&#x27;s position:<\/td><td>$12 million par, 6% senior unsecured maturing in five years.<\/td><\/tr><\/table><\/div><p>CDS Protection buyer, standardized coupon of 5%<\/p><p>Current market prices of Welby bonds:<\/p><div class=\"tbl\"><table><tr><td>6% senior unsecured<\/td><td>55% of par<\/td><\/tr><tr><td>5% subordinated unsecured debentures<\/td><td>40% of par<\/td><\/tr><tr><td>5% senior unsecured<\/td><td>50% of par<\/td><\/tr><\/table><\/div><p>Shah notes that RP has also purchased $10 million notional, index CDS position in CDX-HY and that Welby is one of the 125 constituents in that index.<\/p><p>While discussing credit risk analysis, Reynolds makes the following two statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>One of the assumptions of the structural models of credit analysis is that the company has no off-balance sheet debt.<\/td><\/tr><tr><td>Statement 2:<\/td><td>In the case of an ABS, credit analysis focuses on the credit quality of the servicer.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Reynold&#x27;s Statement 2 is most likely:<\/p><\/div>","subj":"fixed"},{"n":69,"q":"The annualized fixed rate for the $30 million swap on January 1 is closest to:","opts":["3.73%.","3.80%.","3.91%."],"ans":"A","expl":"The semi-annual fixed payment is calculated as:\n1−0.9285 = 0.01867 0.9840+0.9676+0.9488+0.9285 When annualized, this works out to 3.73%.\n(Module 30.6, LOS 30.e)","explhtml":"<p>The semi-annual fixed payment is calculated as:<\/p><p>1−0.9285 = 0.01867 0.9840+0.9676+0.9488+0.9285 When annualized, this works out to 3.73%.<\/p><p>(Module 30.6, LOS 30.e)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 69–72 · Derivatives<\/summary><div class=\"vig-body\"><p>Trent Black is a government fixed-income portfolio manager, and on January 1, he holds $30 million of fixed-rate, semi-annual pay notes. Black is considering entering into a 2-year, $30 million semi-annual pay interest rate swap as the fixed-rate payer. He must first determine the swap rate. Black notes the term structure shown in Exhibit 1: Term Structure of MRR (USD and CHF) on January 1:<\/p><p>Exhibit 1: Term Structure of MRR (USD and CHF) on January 1<\/p><div class=\"tbl\"><table><tr><td>CHF<\/td><td>USD<\/td><\/tr><\/table><\/div><p>Term (Days)<\/p><div class=\"tbl\"><table><tr><td>MRR<\/td><td>Discount Factor<\/td><td>MRR<\/td><td>Discount Factor<\/td><td><\/td><\/tr><tr><td>180<\/td><td>–0.65%<\/td><td>1.0033<\/td><td>3.25%<\/td><td>0.9840<\/td><\/tr><tr><td>360<\/td><td>–0.55%<\/td><td>1.0055<\/td><td>3.35%<\/td><td>0.9676<\/td><\/tr><tr><td>540<\/td><td>–0.20%<\/td><td>1.0030<\/td><td>3.60%<\/td><td>0.9488<\/td><\/tr><tr><td>720<\/td><td>0.10%<\/td><td>0.9980<\/td><td>3.85%<\/td><td>0.9285<\/td><\/tr><tr><td>900<\/td><td>0.30%<\/td><td>0.9926<\/td><td>4.00%<\/td><td>0.9091<\/td><\/tr><tr><td>1,080<\/td><td>0.55%<\/td><td>0.9838<\/td><td>4.10%<\/td><td>0.8905<\/td><\/tr><tr><td>1,260<\/td><td>0.88%<\/td><td>0.9701<\/td><td>4.25%<\/td><td>0.8705<\/td><\/tr><\/table><\/div><p>Black is also evaluating a USD fixed for CHF fixed, 3-year, semiannual currency swap on a notional of USD 10 million. The current exchange rate is CHF/USD 0.97. On July 1, immediately after the first settlement, Black observes that the 18-month semiannual swap fixed rate is 4.62%. The term structure of MRR is given in  Exhibit 2: USD MRR Term Structure on July 1.<\/p><p>Exhibit 2: USD MRR Term Structure on July 1<\/p><div class=\"tbl\"><table><tr><td>Days<\/td><td>Annual Rate (%)<\/td><td>Discount Factor<\/td><\/tr><tr><td>60<\/td><td>3.31<\/td><td>0.9945<\/td><\/tr><tr><td>180<\/td><td>3.66<\/td><td>0.9820<\/td><\/tr><tr><td>360<\/td><td>4.21<\/td><td>0.9596<\/td><\/tr><tr><td>480<\/td><td>4.69<\/td><td>0.9411<\/td><\/tr><tr><td>540<\/td><td>4.74<\/td><td>0.9336<\/td><\/tr><tr><td>720<\/td><td>5.00<\/td><td>0.9091<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The annualized fixed rate for the $30 million swap on January 1 is closest to:<\/p><\/div>","subj":"derivatives"},{"n":70,"q":"For this question only, assume the annualized fixed rate on the $30 million swap is 3.80%. The amount of the first net payment due on this swap is closest to:","opts":["$82,500.","$165,000.","$285,000."],"ans":"A","expl":"The floating rate applicable for the first settlement was determined at the inception of the swap (i.e., 3.25%). The net amount owed by the fixed rate payer of the swap would be (0.0380 – 0.0325) / 2 × $30,000,000 = $82,500.\n(Module 30.6, LOS 30.e)","explhtml":"<p>The floating rate applicable for the first settlement was determined at the inception of the swap (i.e., 3.25%). The net amount owed by the fixed rate payer of the swap would be (0.0380 – 0.0325) / 2 × $30,000,000 = $82,500.<\/p><p>(Module 30.6, LOS 30.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 69–72 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Trent Black is a government fixed-income portfolio manager, and on January 1, he holds $30 million of fixed-rate, semi-annual pay notes. Black is considering entering into a 2-year, $30 million semi-annual pay interest rate swap as the fixed-rate payer. He must first determine the swap rate. Black notes the term structure shown in Exhibit 1: Term Structure of MRR (USD and CHF) on January 1:<\/p><p>Exhibit 1: Term Structure of MRR (USD and CHF) on January 1<\/p><div class=\"tbl\"><table><tr><td>CHF<\/td><td>USD<\/td><\/tr><\/table><\/div><p>Term (Days)<\/p><div class=\"tbl\"><table><tr><td>MRR<\/td><td>Discount Factor<\/td><td>MRR<\/td><td>Discount Factor<\/td><td><\/td><\/tr><tr><td>180<\/td><td>–0.65%<\/td><td>1.0033<\/td><td>3.25%<\/td><td>0.9840<\/td><\/tr><tr><td>360<\/td><td>–0.55%<\/td><td>1.0055<\/td><td>3.35%<\/td><td>0.9676<\/td><\/tr><tr><td>540<\/td><td>–0.20%<\/td><td>1.0030<\/td><td>3.60%<\/td><td>0.9488<\/td><\/tr><tr><td>720<\/td><td>0.10%<\/td><td>0.9980<\/td><td>3.85%<\/td><td>0.9285<\/td><\/tr><tr><td>900<\/td><td>0.30%<\/td><td>0.9926<\/td><td>4.00%<\/td><td>0.9091<\/td><\/tr><tr><td>1,080<\/td><td>0.55%<\/td><td>0.9838<\/td><td>4.10%<\/td><td>0.8905<\/td><\/tr><tr><td>1,260<\/td><td>0.88%<\/td><td>0.9701<\/td><td>4.25%<\/td><td>0.8705<\/td><\/tr><\/table><\/div><p>Black is also evaluating a USD fixed for CHF fixed, 3-year, semiannual currency swap on a notional of USD 10 million. The current exchange rate is CHF/USD 0.97. On July 1, immediately after the first settlement, Black observes that the 18-month semiannual swap fixed rate is 4.62%. The term structure of MRR is given in  Exhibit 2: USD MRR Term Structure on July 1.<\/p><p>Exhibit 2: USD MRR Term Structure on July 1<\/p><div class=\"tbl\"><table><tr><td>Days<\/td><td>Annual Rate (%)<\/td><td>Discount Factor<\/td><\/tr><tr><td>60<\/td><td>3.31<\/td><td>0.9945<\/td><\/tr><tr><td>180<\/td><td>3.66<\/td><td>0.9820<\/td><\/tr><tr><td>360<\/td><td>4.21<\/td><td>0.9596<\/td><\/tr><tr><td>480<\/td><td>4.69<\/td><td>0.9411<\/td><\/tr><tr><td>540<\/td><td>4.74<\/td><td>0.9336<\/td><\/tr><tr><td>720<\/td><td>5.00<\/td><td>0.9091<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>For this question only, assume the annualized fixed rate on the $30 million swap is 3.80%. The amount of the first net payment due on this swap is closest to:<\/p><\/div>","subj":"derivatives"},{"n":71,"q":"For this question only, assume that the original 2-year $30 million notional swap was entered into at a fixed rate of 4.0%. Based on the information in the case and  Exhibit 2: USD MRR Term Structure on July 1, the value of the swap on July 1 to Black is closest to:","opts":["$267,390.","$270,000.","$346,572."],"ans":"A","expl":"After the first settlement date, there are three more settlements remaining, at 180, 360, and 540 days.\nThe sum of the discount factors for those three dates = 0.9820 + 0.9596 + 0.9336 = 2.8752. We are told that the original swap fixed rate is 4.0%, and the new swap fixed rate is given as 4.62%.\nValue to the payer = ΣDF × (SFRnew – SFRold) × (days / 360) × notional principal = 2.8752 × (0.0462 – 0.04) × (180 / 360) × $30,000,000 = $267,394. (Module 30.6, LOS 30.e)","explhtml":"<p>After the first settlement date, there are three more settlements remaining, at 180, 360, and 540 days.<\/p><p>The sum of the discount factors for those three dates = 0.9820 + 0.9596 + 0.9336 = 2.8752. We are told that the original swap fixed rate is 4.0%, and the new swap fixed rate is given as 4.62%.<\/p><p>Value to the payer = ΣDF × (SFRnew – SFRold) × (days / 360) × notional principal = 2.8752 × (0.0462 – 0.04) × (180 / 360) × $30,000,000 = $267,394. (Module 30.6, LOS 30.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 69–72 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Trent Black is a government fixed-income portfolio manager, and on January 1, he holds $30 million of fixed-rate, semi-annual pay notes. Black is considering entering into a 2-year, $30 million semi-annual pay interest rate swap as the fixed-rate payer. He must first determine the swap rate. Black notes the term structure shown in Exhibit 1: Term Structure of MRR (USD and CHF) on January 1:<\/p><p>Exhibit 1: Term Structure of MRR (USD and CHF) on January 1<\/p><div class=\"tbl\"><table><tr><td>CHF<\/td><td>USD<\/td><\/tr><\/table><\/div><p>Term (Days)<\/p><div class=\"tbl\"><table><tr><td>MRR<\/td><td>Discount Factor<\/td><td>MRR<\/td><td>Discount Factor<\/td><td><\/td><\/tr><tr><td>180<\/td><td>–0.65%<\/td><td>1.0033<\/td><td>3.25%<\/td><td>0.9840<\/td><\/tr><tr><td>360<\/td><td>–0.55%<\/td><td>1.0055<\/td><td>3.35%<\/td><td>0.9676<\/td><\/tr><tr><td>540<\/td><td>–0.20%<\/td><td>1.0030<\/td><td>3.60%<\/td><td>0.9488<\/td><\/tr><tr><td>720<\/td><td>0.10%<\/td><td>0.9980<\/td><td>3.85%<\/td><td>0.9285<\/td><\/tr><tr><td>900<\/td><td>0.30%<\/td><td>0.9926<\/td><td>4.00%<\/td><td>0.9091<\/td><\/tr><tr><td>1,080<\/td><td>0.55%<\/td><td>0.9838<\/td><td>4.10%<\/td><td>0.8905<\/td><\/tr><tr><td>1,260<\/td><td>0.88%<\/td><td>0.9701<\/td><td>4.25%<\/td><td>0.8705<\/td><\/tr><\/table><\/div><p>Black is also evaluating a USD fixed for CHF fixed, 3-year, semiannual currency swap on a notional of USD 10 million. The current exchange rate is CHF/USD 0.97. On July 1, immediately after the first settlement, Black observes that the 18-month semiannual swap fixed rate is 4.62%. The term structure of MRR is given in  Exhibit 2: USD MRR Term Structure on July 1.<\/p><p>Exhibit 2: USD MRR Term Structure on July 1<\/p><div class=\"tbl\"><table><tr><td>Days<\/td><td>Annual Rate (%)<\/td><td>Discount Factor<\/td><\/tr><tr><td>60<\/td><td>3.31<\/td><td>0.9945<\/td><\/tr><tr><td>180<\/td><td>3.66<\/td><td>0.9820<\/td><\/tr><tr><td>360<\/td><td>4.21<\/td><td>0.9596<\/td><\/tr><tr><td>480<\/td><td>4.69<\/td><td>0.9411<\/td><\/tr><tr><td>540<\/td><td>4.74<\/td><td>0.9336<\/td><\/tr><tr><td>720<\/td><td>5.00<\/td><td>0.9091<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>For this question only, assume that the original 2-year $30 million notional swap was entered into at a fixed rate of 4.0%. Based on the information in the case and  Exhibit 2: USD MRR Term Structure on July 1, the value of the swap on July 1 to Black is closest to:<\/p><\/div>","subj":"derivatives"},{"n":72,"q":"The CHF fixed payment to be made periodically by the USD receiver is closest to:","opts":["CHF 26,200.","CHF 52,381.","CHF 54,000."],"ans":"A","expl":"CHF notional = 0.97 × 10,000,000 = CHF 9,700,000\n(Module 30.7, LOS 30.f)","explhtml":"<p>CHF notional = 0.97 × 10,000,000 = CHF 9,700,000<\/p><img class=\"pimg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAlgCWAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wgARCACwA/MDAREAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAUEAwIGAQf/xAAYAQEBAQEBAAAAAAAAAAAAAAAAAQIDBP/aAAwDAQACEAMQAAAB/VAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABFCsyTAKEums2c2IqRirZ9mutZxzdy1qaSgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACN57d+MDx6ew3ko8hZ8SY49oDrzzszufR8ukPtDx7q4pbT+NAAAAAAAAAAAAAAADHNz3mOzuJ1zt43pZUqd1nrG7lz0oAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAiee9u/HzXHp6veai6JDzX24kM9PNWSWsfc71SHllLJPUpWejzoAAAAAAAAAAAAAAAecPRpTl8oY6Y8tS+8Wu cy swap on a notional of USD 10 million. The current exchange rate is CHF/USD 0.97. On July 1, immediately after the first settlement, Black observes that the 18-month semiannual swap fixed rate is 4.62%. The term structure of MRR is given in  Exhibit 2: USD MRR Term Structure on July 1.<\/p><p>Exhibit 2: USD MRR Term Structure on July 1<\/p><div class=\"tbl\"><table><tr><td>Days<\/td><td>Annual Rate (%)<\/td><td>Discount Factor<\/td><\/tr><tr><td>60<\/td><td>3.31<\/td><td>0.9945<\/td><\/tr><tr><td>180<\/td><td>3.66<\/td><td>0.9820<\/td><\/tr><tr><td>360<\/td><td>4.21<\/td><td>0.9596<\/td><\/tr><tr><td>480<\/td><td>4.69<\/td><td>0.9411<\/td><\/tr><tr><td>540<\/td><td>4.74<\/td><td>0.9336<\/td><\/tr><tr><td>720<\/td><td>5.00<\/td><td>0.9091<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The CHF fixed payment to be made periodically by the USD receiver is closest to:<\/p><\/div>","subj":"derivatives"},{"n":73,"q":"Alpha fund is most likely participating in the commodity markets as a(n):","opts":["hedger.","speculator.","arbitrageur."],"ans":"C","expl":"Alpha Fund seeks to exploit mispricing in global markets and is thus acting as an arbitrageur. Alpha does not have an underlying exposure to energy, and hence is not a hedger. Furthermore, Alpha does not appear to be acting as a speculator; for example, Alpha Fund is not taking naked positions based on their expectations about future price movements.\n(Module 32.1, LOS 32.d)","explhtml":"<p>Alpha Fund seeks to exploit mispricing in global markets and is thus acting as an arbitrageur. Alpha does not have an underlying exposure to energy, and hence is not a hedger. Furthermore, Alpha does not appear to be acting as a speculator; for example, Alpha Fund is not taking naked positions based on their expectations about future price movements.<\/p><p>(Module 32.1, LOS 32.d)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 73–76 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Steven LaGrasse, CFA is the CIO for a large university endowment fund. LaGrasse wants to add an allocation to commodities for the endowment&#x27;s portfolio. LaGrasse interviews the manager of the Alpha Fund, a fund specializing in energy trading that seeks to profit from mispricing across international energy markets.<\/p><p>LaGrasse then interviews Beta Fund, which uses swap contracts to gain exposure to commodity markets. Beta&#x27;s manager presents an example of a current contract, which involves a long position in an S&amp;P 500 MSCI total return swap. With a notional of $100 million, the swap has monthly resets, and was initiated when short-term benchmark rates were 2%. Exhibit 1 provides the relevant market data.<\/p><p>Exhibit 1: S&amp;P 500 MSCI Index Levels<\/p><div class=\"tbl\"><table><tr><td>March (swap inception)<\/td><td>3922.50<\/td><\/tr><tr><td>April<\/td><td>3877.00<\/td><\/tr><tr><td>May<\/td><td>4123.75<\/td><\/tr><\/table><\/div><p>Jim Myers, the head of Beta Fund, mentions that individual commodity sectors each have their own idiosyncrasies. Myers makes the following 2 statements: Demand for oil is relatively stable and independent of the<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>economic cycle, because people need to drive regardless of economic conditions. Demand for softs increases with increased in incomes in<\/td><\/tr><tr><td>Statement 2:<\/td><td>developing economies, but is dependent on consumer tastes as well.<\/td><\/tr><\/table><\/div><p>Myers further notes that soybean contracts are currently in contango, and that the convenience yield and storage costs for soybeans are equal at the present time.<\/p><\/div><\/details><div class=\"qtext\"><p>Alpha fund is most likely participating in the commodity markets as a(n):<\/p><\/div>","subj":"alternatives"},{"n":74,"q":"The payment to be received (made) in April by Beta Fund related to the total return swap is closest to:","opts":["
