ves"},{"n":76,"q":"The information provided by Myers about soybean contracts is most consistent with:","opts":["the hedging pressure hypothesis.","the theory of storage.","insurance theory."],"ans":"A","expl":"Hedging pressure theory would predict a contango market if the consumers (i.e., the longs) are hedgers (and driving up the forward price of soybean contracts). We are told that soybean contracts are normally in contango, however insurance theory suggests that futures prices should be lower than spot prices (i.e., backwardation) to compensate the speculator who is taking the opposite side of the hedge from the producer. We are not provided with information about current inventory levels, and hence evaluating this situation with respect to the theory of storage is not possible.\n(Module 32.1, LOS 32.f)","explhtml":"<p>Hedging pressure theory would predict a contango market if the consumers (i.e., the longs) are hedgers (and driving up the forward price of soybean contracts). We are told that soybean contracts are normally in contango, however insurance theory suggests that futures prices should be lower than spot prices (i.e., backwardation) to compensate the speculator who is taking the opposite side of the hedge from the producer. We are not provided with information about current inventory levels, and hence evaluating this situation with respect to the theory of storage is not possible.<\/p><p>(Module 32.1, LOS 32.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 73–76 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Steven LaGrasse, CFA is the CIO for a large university endowment fund. LaGrasse wants to add an allocation to commodities for the endowment&#x27;s portfolio. LaGrasse interviews the manager of the Alpha Fund, a fund specializing in energy trading that seeks to profit from mispricing across international energy markets.<\/p><p>LaGrasse then interviews Beta Fund, which uses swap contracts to gain exposure to commodity markets. Beta&#x27;s manager presents an example of a current contract, which involves a long position in an S&amp;P 500 MSCI total return swap. With a notional of $100 million, the swap has monthly resets, and was initiated when short-term benchmark rates were 2%. Exhibit 1 provides the relevant market data.<\/p><p>Exhibit 1: S&amp;P 500 MSCI Index Levels<\/p><div class=\"tbl\"><table><tr><td>March (swap inception)<\/td><td>3922.50<\/td><\/tr><tr><td>April<\/td><td>3877.00<\/td><\/tr><tr><td>May<\/td><td>4123.75<\/td><\/tr><\/table><\/div><p>Jim Myers, the head of Beta Fund, mentions that individual commodity sectors each have their own idiosyncrasies. Myers makes the following 2 statements: Demand for oil is relatively stable and independent of the<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>economic cycle, because people need to drive regardless of economic conditions. Demand for softs increases with increased in incomes in<\/td><\/tr><tr><td>Statement 2:<\/td><td>developing economies, but is dependent on consumer tastes as well.<\/td><\/tr><\/table><\/div><p>Myers further notes that soybean contracts are currently in contango, and that the convenience yield and storage costs for soybeans are equal at the present time.<\/p><\/div><\/details><div class=\"qtext\"><p>The information provided by Myers about soybean contracts is most consistent with:<\/p><\/div>","subj":"alternatives"},{"n":77,"q":"Using the data in  Exhibit 2: Pangia Data and Next Period Forecast, and the screening process outlined in  Exhibit 1: Screening Criteria, Pangia is most likely to:","opts":["fail only the screening criterion related to the real GDP growth rate.","fail only the screening criterion related to the real risk-free rate.","pass both the real GDP growth and real risk-free rates criteria."],"ans":"A","expl":"Pangia Data and Next Period Forecast:\nRisk-free zero-coupon government bond price (£100 face) | £97.20\nForecast inflation rate | 1.2%\nForecast premium for inflation uncertainty | 0.4%\nForecast nominal GDP growth rate | 2.4%\nNominal risk-free rate as implied by the one-year zero-coupon government bond: (100.00 / 97.20) − 1= 2.88% Real risk-free rate = nominal rate – forecast inflation – premium for inflation uncertainty = 2.88% − 1.2% − 0.4% = 1.28% (>1%; passes real risk-free rate screen) Real GDP growth rate = nominal GDP growth rate – inflation forecast = 2.4% − 1.2% = 1.2% (<1.5%; fails real GDP growth rate screen) (Module 39.1, LOS 39.d)","explhtml":"<p>Pangia Data and Next Period Forecast:<\/p><div class=\"tbl\"><table><tr><td>Risk-free zero-coupon government bond price (£100 face)<\/td><td>£97.20<\/td><\/tr><tr><td>Forecast inflation rate<\/td><td>1.2%<\/td><\/tr><tr><td>Forecast premium for inflation uncertainty<\/td><td>0.4%<\/td><\/tr><tr><td>Forecast nominal GDP growth rate<\/td><td>2.4%<\/td><\/tr><\/table><\/div><p>Nominal risk-free rate as implied by the one-year zero-coupon government bond: (100.00 / 97.20) − 1= 2.88% Real risk-free rate = nominal rate – forecast inflation – premium for inflation uncertainty = 2.88% − 1.2% − 0.4% = 1.28% (&gt;1%; passes real risk-free rate screen) Real GDP growth rate = nominal GDP growth rate – inflation forecast = 2.4% − 1.2% = 1.2% (&lt;1.5%; fails real GDP growth rate screen) (Module 39.1, LOS 39.d)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 77–80 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Neil Cernan set up his own investment management firm in 2005. Cernan Investment Management LLC (CIM) is headquartered in Kansas City, MO, with eight offices across the U.S. Midwest and East coast. While initial growth of the firm was relatively slow, over the last six quarters assets under management have increased at their fastest rate since inception.<\/p><p>Cernan now feels that the time is right to expand overseas to help sustain the pace of the firm&#x27;s growth. CIM&#x27;s board has narrowed the expansion down to two possible countries: Pangia and Isopia.<\/p><p>Cernan has historically tried to avoid investing in any country with low real GDP growth or low interest rates, or inflation rates that are too high or volatile. He intends to follow the same rules for CIM. Cernan&#x27;s proposed screening process is shown in Exhibit 1: Screening Criteria.<\/p><p>Exhibit 1: Screening Criteria<\/p><p>A country will not be considered a candidate for CIM&#x27;s expansion if:<\/p><p>1. Forecast real GDP growth for the coming year is less than 1.5% 2. The real risk-free rate is less than 1.0% 3. Forecast inflation is greater than 1.5%<\/p><p>Cernan has gathered some information on Pangia because he is concerned that that economy may not pass the screening process. The data gathered is shown in  Exhibit 2: Pangia Data and Next Period Forecast.<\/p><p>Exhibit 2: Pangia Data and Next Period Forecast<\/p><div class=\"tbl\"><table><tr><td>1-year, zero-coupon government bond price (£100 par)<\/td><td>£97.20<\/td><\/tr><tr><td>Forecast inflation rate<\/td><td>1.2%<\/td><\/tr><tr><td>Forecast premium for inflation uncertainty<\/td><td>0.4%<\/td><\/tr><tr><td>Forecast nominal GDP growth rate<\/td><td>2.4%<\/td><\/tr><\/table><\/div><p>In addition to assessing macroeconomic data in each candidate country, CIM has also researched potential investment managers. In Isopia, CIM staff have identified three potential investment managers with the required skill set and experience. Cernan presents this information to the board, including a definition of the information ratio, plus key performance data for two of the managers as shown in  Exhibit 4: Information Ratio Definition and Isopian Candidate Data.<\/p><p>Exhibit 4: Information Ratio Definition and Isopian Candidate Data<\/p><p>The ex post information ratio is the actual correlation between Information Ratio active returns and expected active returns and may be positive Defined:<\/p><p>or negative.<\/p><p>Candidate Data<\/p><div class=\"tbl\"><table><tr><td>Manager A<\/td><td>Manager B<\/td><td><\/td><\/tr><tr><td>Transfer coefficient<\/td><td>0.70<\/td><td>0.50<\/td><\/tr><tr><td>Information coefficient<\/td><td>0.025<\/td><td>0.034<\/td><\/tr><tr><td>Information Ratio (constrained)<\/td><td>0.192<\/td><td>0.123<\/td><\/tr><\/table><\/div><p>All three candidates work with constrained portfolios due to local laws and regulations. However, Cernan intends to assess the managers by calculating their information ratio had the portfolios been unconstrained. Cernan&#x27;s screen calls for a minimum unconstrained information ratio of 0.25.<\/p><p>A third candidate, Manager X, had an information ratio of 2.99. Although impressive, this IR seemed too high to Cernan and hence Cernan does not consider Manager X. When the CIM board asks Cernan why he did not consider this candidate, Cernan provides the following two reasons why Manager X&#x27;s information ratio may be too high:<\/p><div class=\"tbl\"><table><tr><td>Reason 1:<\/td><td>Manager X&#x27;s information ratio suffers from cross-sectional interdependence, whereby each decision made is not<\/td><\/tr><\/table><\/div><p>independent.<\/p><p>Manager X&#x27;s information ratio suffers from time-series<\/p><div class=\"tbl\"><table><tr><td>Reason 2:<\/td><td>dependence, whereby decisions taken on securities may be correlated over time.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Using the data in  Exhibit 2: Pangia Data and Next Period Forecast, and the screening process outlined in  Exhibit 1: Screening Criteria, Pangia is most likely to:<\/p><\/div>","subj":"portfolio"},{"n":78,"q":"In  Exhibit 4: Information Ratio Definition and Isopian Candidate Data, Cernan's definition of the information ratio is best described as:","opts":["correct.","incorrect because the information ratio cannot be negative.","incorrect because it defines the information coefficient instead."],"ans":"C","expl":"The information coefficient measures the correlation between active returns and expected active returns. When the information coefficient is multiplied by the transfer coefficient and the square root of breadth, we get the information ratio. (Module 40.3, LOS 40.c)","explhtml":"<p>The information coefficient measures the correlation between active returns and expected active returns. When the information coefficient is multiplied by the transfer coefficient and the square root of breadth, we get the information ratio. (Module 40.3, LOS 40.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 77–80 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Neil Cernan set up his own investment management firm in 2005. Cernan Investment Management LLC (CIM) is headquartered in Kansas City, MO, with eight offices across the U.S. Midwest and East coast. While initial growth of the firm was relatively slow, over the last six quarters assets under management have increased at their fastest rate since inception.<\/p><p>Cernan now feels that the time is right to expand overseas to help sustain the pace of the firm&#x27;s growth. CIM&#x27;s board has narrowed the expansion down to two possible countries: Pangia and Isopia.<\/p><p>Cernan has historically tried to avoid investing in any country with low real GDP growth or low interest rates, or inflation rates that are too high or volatile. He intends to follow the same rules for CIM. Cernan&#x27;s proposed screening process is shown in Exhibit 1: Screening Criteria.<\/p><p>Exhibit 1: Screening Criteria<\/p><p>A country will not be considered a candidate for CIM&#x27;s expansion if:<\/p><p>1. Forecast real GDP growth for the coming year is less than 1.5% 2. The real risk-free rate is less than 1.0% 3. Forecast inflation is greater than 1.5%<\/p><p>Cernan has gathered some information on Pangia because he is concerned that that economy may not pass the screening process. The data gathered is shown in  Exhibit 2: Pangia Data and Next Period Forecast.<\/p><p>Exhibit 2: Pangia Data and Next Period Forecast<\/p><div class=\"tbl\"><table><tr><td>1-year, zero-coupon government bond price (£100 par)<\/td><td>£97.20<\/td><\/tr><tr><td>Forecast inflation rate<\/td><td>1.2%<\/td><\/tr><tr><td>Forecast premium for inflation uncertainty<\/td><td>0.4%<\/td><\/tr><tr><td>Forecast nominal GDP growth rate<\/td><td>2.4%<\/td><\/tr><\/table><\/div><p>In addition to assessing macroeconomic data in each candidate country, CIM has also researched potential investment managers. In Isopia, CIM staff have identified three potential investment managers with the required skill set and experience. Cernan presents this information to the board, including a definition of the information ratio, plus key performance data for two of the managers as shown in  Exhibit 4: Information Ratio Definition and Isopian Candidate Data.<\/p><p>Exhibit 4: Information Ratio Definition and Isopian Candidate Data<\/p><p>The ex post information ratio is the actual correlation between Information Ratio active returns and expected active returns and may be positive Defined:<\/p><p>or negative.<\/p><p>Candidate Data<\/p><div class=\"tbl\"><table><tr><td>Manager A<\/td><td>Manager B<\/td><td><\/td><\/tr><tr><td>Transfer coefficient<\/td><td>0.70<\/td><td>0.50<\/td><\/tr><tr><td>Information coefficient<\/td><td>0.025<\/td><td>0.034<\/td><\/tr><tr><td>Information Ratio (constrained)<\/td><td>0.192<\/td><td>0.123<\/td><\/tr><\/table><\/div><p>All three candidates work with constrained portfolios due to local laws and regulations. However, Cernan intends to assess the managers by calculating their information ratio had the portfolios been unconstrained. Cernan&#x27;s screen calls for a minimum unconstrained information ratio of 0.25.<\/p><p>A third candidate, Manager X, had an information ratio of 2.99. Although impressive, this IR seemed too high to Cernan and hence Cernan does not consider Manager X. When the CIM board asks Cernan why he did not consider this candidate, Cernan provides the following two reasons why Manager X&#x27;s information ratio may be too high:<\/p><div class=\"tbl\"><table><tr><td>Reason 1:<\/td><td>Manager X&#x27;s information ratio suffers from cross-sectional interdependence, whereby each decision made is not<\/td><\/tr><\/table><\/div><p>independent.<\/p><p>Manager X&#x27;s information ratio suffers from time-series<\/p><div class=\"tbl\"><table><tr><td>Reason 2:<\/td><td>dependence, whereby decisions taken on securities may be correlated over time.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>In  Exhibit 4: Information Ratio Definition and Isopian Candidate Data, Cernan&#x27;s definition of the information ratio is best described as:<\/p><\/div>","subj":"portfolio"},{"n":79,"q":"Which of the candidates in  Exhibit 4: Information Ratio Definition and Isopian Candidate Data is most likely to pass Cernan's IR screen?","opts":["Only Manager A.","Only Manager B.","Neither Manager A nor Manager B."],"ans":"A","expl":"Manager A | Manager B\nTransfer coefficient | 0.70 | 0.50\nInformation coefficient | 0.025 | 0.034\nInformation ratio (constrained) | 0.192 | 0.123\nIR (unconstrained) = IRc / TC | 0.192 / 0.7 = 0.274 | 0.123/0.5 = 0.246\nAs the IR screen specifies an unconstrained IR of at least 0.25, only Manager A would be considered. (Module 40.3, LOS 40.c)","explhtml":"<div class=\"tbl\"><table><tr><td>Manager A<\/td><td>Manager B<\/td><td><\/td><\/tr><tr><td>Transfer coefficient<\/td><td>0.70<\/td><td>0.50<\/td><\/tr><tr><td>Information coefficient<\/td><td>0.025<\/td><td>0.034<\/td><\/tr><tr><td>Information ratio (constrained)<\/td><td>0.192<\/td><td>0.123<\/td><\/tr><tr><td>IR (unconstrained) = IRc / TC<\/td><td>0.192 / 0.7 = 0.274<\/td><td>0.123/0.5 = 0.246<\/td><\/tr><\/table><\/div><p>As the IR screen specifies an unconstrained IR of at least 0.25, only Manager A would be considered. (Module 40.3, LOS 40.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 77–80 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Neil Cernan set up his own investment management firm in 2005. Cernan Investment Management LLC (CIM) is headquartered in Kansas City, MO, with eight offices across the U.S. Midwest and East coast. While initial growth of the firm was relatively slow, over the last six quarters assets under management have increased at their fastest rate since inception.<\/p><p>Cernan now feels that the time is right to expand overseas to help sustain the pace of the firm&#x27;s growth. CIM&#x27;s board has narrowed the expansion down to two possible countries: Pangia and Isopia.<\/p><p>Cernan has historically tried to avoid investing in any country with low real GDP growth or low interest rates, or inflation rates that are too high or volatile. He intends to follow the same rules for CIM. Cernan&#x27;s proposed screening process is shown in Exhibit 1: Screening Criteria.<\/p><p>Exhibit 1: Screening Criteria<\/p><p>A country will not be considered a candidate for CIM&#x27;s expansion if:<\/p><p>1. Forecast real GDP growth for the coming year is less than 1.5% 2. The real risk-free rate is less than 1.0% 3. Forecast inflation is greater than 1.5%<\/p><p>Cernan has gathered some information on Pangia because he is concerned that that economy may not pass the screening process. The data gathered is shown in  Exhibit 2: Pangia Data and Next Period Forecast.<\/p><p>Exhibit 2: Pangia Data and Next Period Forecast<\/p><div class=\"tbl\"><table><tr><td>1-year, zero-coupon government bond price (£100 par)<\/td><td>£97.20<\/td><\/tr><tr><td>Forecast inflation rate<\/td><td>1.2%<\/td><\/tr><tr><td>Forecast premium for inflation uncertainty<\/td><td>0.4%<\/td><\/tr><tr><td>Forecast nominal GDP growth rate<\/td><td>2.4%<\/td><\/tr><\/table><\/div><p>In addition to assessing macroeconomic data in each candidate country, CIM has also researched potential investment managers. In Isopia, CIM staff have identified three potential investment managers with the required skill set and experience. Cernan presents this information to the board, including a definition of the information ratio, plus key performance data for two of the managers as shown in  Exhibit 4: Information Ratio Definition and Isopian Candidate Data.<\/p><p>Exhibit 4: Information Ratio Definition and Isopian Candidate Data<\/p><p>The ex post information ratio is the actual correlation between Information Ratio active returns and expected active returns and may be positive Defined:<\/p><p>or negative.<\/p><p>Candidate Data<\/p><div class=\"tbl\"><table><tr><td>Manager A<\/td><td>Manager B<\/td><td><\/td><\/tr><tr><td>Transfer coefficient<\/td><td>0.70<\/td><td>0.50<\/td><\/tr><tr><td>Information coefficient<\/td><td>0.025<\/td><td>0.034<\/td><\/tr><tr><td>Information Ratio (constrained)<\/td><td>0.192<\/td><td>0.123<\/td><\/tr><\/table><\/div><p>All three candidates work with constrained portfolios due to local laws and regulations. However, Cernan intends to assess the managers by calculating their information ratio had the portfolios been unconstrained. Cernan&#x27;s screen calls for a minimum unconstrained information ratio of 0.25.<\/p><p>A third candidate, Manager X, had an information ratio of 2.99. Although impressive, this IR seemed too high to Cernan and hence Cernan does not consider Manager X. When the CIM board asks Cernan why he did not consider this candidate, Cernan provides the following two reasons why Manager X&#x27;s information ratio may be too high:<\/p><div class=\"tbl\"><table><tr><td>Reason 1:<\/td><td>Manager X&#x27;s information ratio suffers from cross-sectional interdependence, whereby each decision made is not<\/td><\/tr><\/table><\/div><p>independent.<\/p><p>Manager X&#x27;s information ratio suffers from time-series<\/p><div class=\"tbl\"><table><tr><td>Reason 2:<\/td><td>dependence, whereby decisions taken on securities may be correlated over time.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the candidates in  Exhibit 4: Information Ratio Definition and Isopian Candidate Data is most likely to pass Cernan&#x27;s IR screen?<\/p><\/div>","subj":"portfolio"},{"n":80,"q":"Which of Cernan's reasons for not relying on Manager X's information ratio are based on actual limitations of the fundamental law?","opts":["Reason 1 only.","Reason 2 only.","Both reasons are limitations."],"ans":"C","expl":"Both cross-sectional dependence and time-series dependence may inflate the information ratio. (Module 40.4, LOS 40.f)","explhtml":"<p>Both cross-sectional dependence and time-series dependence may inflate the information ratio. (Module 40.4, LOS 40.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 77–80 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Neil Cernan set up his own investment management firm in 2005. Cernan Investment Management LLC (CIM) is headquartered in Kansas City, MO, with eight offices across the U.S. Midwest and East coast. While initial growth of the firm was relatively slow, over the last six quarters assets under management have increased at their fastest rate since inception.<\/p><p>Cernan now feels that the time is right to expand overseas to help sustain the pace of the firm&#x27;s growth. CIM&#x27;s board has narrowed the expansion down to two possible countries: Pangia and Isopia.<\/p><p>Cernan has historically tried to avoid investing in any country with low real GDP growth or low interest rates, or inflation rates that are too high or volatile. He intends to follow the same rules for CIM. Cernan&#x27;s proposed screening process is shown in Exhibit 1: Screening Criteria.<\/p><p>Exhibit 1: Screening Criteria<\/p><p>A country will not be considered a candidate for CIM&#x27;s expansion if:<\/p><p>1. Forecast real GDP growth for the coming year is less than 1.5% 2. The real risk-free rate is less than 1.0% 3. Forecast inflation is greater than 1.5%<\/p><p>Cernan has gathered some information on Pangia because he is concerned that that economy may not pass the screening process. The data gathered is shown in  Exhibit 2: Pangia Data and Next Period Forecast.<\/p><p>Exhibit 2: Pangia Data and Next Period Forecast<\/p><div class=\"tbl\"><table><tr><td>1-year, zero-coupon government bond price (£100 par)<\/td><td>£97.20<\/td><\/tr><tr><td>Forecast inflation rate<\/td><td>1.2%<\/td><\/tr><tr><td>Forecast premium for inflation uncertainty<\/td><td>0.4%<\/td><\/tr><tr><td>Forecast nominal GDP growth rate<\/td><td>2.4%<\/td><\/tr><\/table><\/div><p>In addition to assessing macroeconomic data in each candidate country, CIM has also researched potential investment managers. In Isopia, CIM staff have identified three potential investment managers with the required skill set and experience. Cernan presents this information to the board, including a definition of the information ratio, plus key performance data for two of the managers as shown in  Exhibit 4: Information Ratio Definition and Isopian Candidate Data.<\/p><p>Exhibit 4: Information Ratio Definition and Isopian Candidate Data<\/p><p>The ex post information ratio is the actual correlation between Information Ratio active returns and expected active returns and may be positive Defined:<\/p><p>or negative.<\/p><p>Candidate Data<\/p><div class=\"tbl\"><table><tr><td>Manager A<\/td><td>Manager B<\/td><td><\/td><\/tr><tr><td>Transfer coefficient<\/td><td>0.70<\/td><td>0.50<\/td><\/tr><tr><td>Information coefficient<\/td><td>0.025<\/td><td>0.034<\/td><\/tr><tr><td>Information Ratio (constrained)<\/td><td>0.192<\/td><td>0.123<\/td><\/tr><\/table><\/div><p>All three candidates work with constrained portfolios due to local laws and regulations. However, Cernan intends to assess the managers by calculating their information ratio had the portfolios been unconstrained. Cernan&#x27;s screen calls for a minimum unconstrained information ratio of 0.25.<\/p><p>A third candidate, Manager X, had an information ratio of 2.99. Although impressive, this IR seemed too high to Cernan and hence Cernan does not consider Manager X. When the CIM board asks Cernan why he did not consider this candidate, Cernan provides the following two reasons why Manager X&#x27;s information ratio may be too high:<\/p><div class=\"tbl\"><table><tr><td>Reason 1:<\/td><td>Manager X&#x27;s information ratio suffers from cross-sectional interdependence, whereby each decision made is not<\/td><\/tr><\/table><\/div><p>independent.<\/p><p>Manager X&#x27;s information ratio suffers from time-series<\/p><div class=\"tbl\"><table><tr><td>Reason 2:<\/td><td>dependence, whereby decisions taken on securities may be correlated over time.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of Cernan&#x27;s reasons for not relying on Manager X&#x27;s information ratio are based on actual limitations of the fundamental law?<\/p><\/div>","subj":"portfolio"},{"n":81,"q":"The least accurate interpretation of the monthly VaR that Mason mentions is:","opts":["5% of the time, the minimum monthly loss experienced by the portfolio is $12,000.","95% of the time, the minimum monthly loss experienced by the portfolio is $12,000.","95% of the time, the maximum monthly loss experienced by the portfolio is $12,000."],"ans":"B","expl":"VaR can be interpreted as the minimum loss at the specified level of significance (5% here), or as the maximum loss with a confidence level of (1 - the level of significance) (=95% here) (Module 37.1, LOS 37.a)","explhtml":"<p>VaR can be interpreted as the minimum loss at the specified level of significance (5% here), or as the maximum loss with a confidence level of (1 - the level of significance) (=95% here) (Module 37.1, LOS 37.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 81–84 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Steve Mason, CFA, is an analyst with Alpha Developers. While discussing backtesting with a client, Mason states, &quot;I am always skeptical when someone shows me a strategy that has performed well based on past data. Did they find this strategy by sifting through many different models and selecting the one based on how good it looked statistically?&quot; Mason then informs the client that the 5% monthly VaR of their portfolio is $12,000.<\/p><p>Another client is concerned with longer term trends in Ruritania, a country where the client has significant investments. A recent paper on consumption trends and that country&#x27;s position in the business cycle left the client with doubts about both Ruritanian interest rates and bond performance.<\/p><p>The relevant extract from the paper is shown in  Exhibit 1: Longer Term Macroeconomic Forecasts for Ruritania – Extract<\/p><p>Exhibit 1: Longer Term Macroeconomic Forecasts for Ruritania – Extract<\/p><p>&quot;Two distinct trends have emerged in the Ruritanian economy over the last 10 quarters. First, the level of wealth per capita has increased, and this increase is only expected to accelerate over the next four years. Compared to today, the average family can expect to increase their wealth at an average of 0.5% per year over this period.<\/p><p>In addition, the reduction of restrictions on capital flows and international trade under the current political regime (which is expected to remain in power for at least four years) is expected to continue, leading to an increase in both GDP and the volatility of GDP growth.&quot;<\/p><p>Mason draws two conclusions from the extract:<\/p><div class=\"tbl\"><table><tr><td>Conclusion<\/td><td>The expected trend in personal wealth will decrease the utility of future<\/td><\/tr><tr><td>1:<\/td><td>consumption relative to consumption today, reduce the inter-temporal rate of substitution, and reduce the real interest rate.<\/td><\/tr><tr><td>Conclusion<\/td><td>The increase in GDP growth is expected to increase real interest rates,<\/td><\/tr><tr><td>2:<\/td><td>but this effect be offset by the impact of the increase in the volatility of that growth.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The least accurate interpretation of the monthly VaR that Mason mentions is:<\/p><\/div>","subj":"portfolio"},{"n":82,"q":"Based on Mason's statement about backtesting, he is most likely to be concerned about:","opts":["data snooping.","statistical anomalies.","survivorship bias."],"ans":"A","expl":"Data snooping is the practice of backtesting numerous strategies and then selecting the best performing one, rather than constructing a portfolio based on sound theory. A strategy chosen by data snooping is unlikely to deliver the same promising results in later periods when the strategy is actually deployed. (Module 38.3, LOS 38.d)","explhtml":"<p>Data snooping is the practice of backtesting numerous strategies and then selecting the best performing one, rather than constructing a portfolio based on sound theory. A strategy chosen by data snooping is unlikely to deliver the same promising results in later periods when the strategy is actually deployed. (Module 38.3, LOS 38.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 81–84 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Steve Mason, CFA, is an analyst with Alpha Developers. While discussing backtesting with a client, Mason states, &quot;I am always skeptical when someone shows me a strategy that has performed well based on past data. Did they find this strategy by sifting through many different models and selecting the one based on how good it looked statistically?&quot; Mason then informs the client that the 5% monthly VaR of their portfolio is $12,000.<\/p><p>Another client is concerned with longer term trends in Ruritania, a country where the client has significant investments. A recent paper on consumption trends and that country&#x27;s position in the business cycle left the client with doubts about both Ruritanian interest rates and bond performance.<\/p><p>The relevant extract from the paper is shown in  Exhibit 1: Longer Term Macroeconomic Forecasts for Ruritania – Extract<\/p><p>Exhibit 1: Longer Term Macroeconomic Forecasts for Ruritania – Extract<\/p><p>&quot;Two distinct trends have emerged in the Ruritanian economy over the last 10 quarters. First, the level of wealth per capita has increased, and this increase is only expected to accelerate over the next four years. Compared to today, the average family can expect to increase their wealth at an average of 0.5% per year over this period.<\/p><p>In addition, the reduction of restrictions on capital flows and international trade under the current political regime (which is expected to remain in power for at least four years) is expected to continue, leading to an increase in both GDP and the volatility of GDP growth.&quot;<\/p><p>Mason draws two conclusions from the extract:<\/p><div class=\"tbl\"><table><tr><td>Conclusion<\/td><td>The expected trend in personal wealth will decrease the utility of future<\/td><\/tr><tr><td>1:<\/td><td>consumption relative to consumption today, reduce the inter-temporal rate of substitution, and reduce the real interest rate.<\/td><\/tr><tr><td>Conclusion<\/td><td>The increase in GDP growth is expected to increase real interest rates,<\/td><\/tr><tr><td>2:<\/td><td>but this effect be offset by the impact of the increase in the volatility of that growth.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Based on Mason&#x27;s statement about backtesting, he is most likely to be concerned about:<\/p><\/div>","subj":"portfolio"},{"n":83,"q":"Mason's Conclusion 1, in response to the extract in Exhibit 3 is least accurate regarding the effect on:","opts":["the utility of future consumption relative to consumption today.","the inter-temporal rate of substitution.","the real interest rate."],"ans":"C","expl":"An increase in wealth will reduce the marginal utility of future consumption relative to consumption today. As a result, the inter-temporal rate of substitution (ut/u0) will also decrease. The price of a risk-free inflation-indexed bond is the expected inter-temporal rate of substitution, hence it will fall and real interest rates will rise. (Module 39.1, LOS 39.c)","explhtml":"<p>An increase in wealth will reduce the marginal utility of future consumption relative to consumption today. As a result, the inter-temporal rate of substitution (ut/u0) will also decrease. The price of a risk-free inflation-indexed bond is the expected inter-temporal rate of substitution, hence it will fall and real interest rates will rise. (Module 39.1, LOS 39.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 81–84 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Steve Mason, CFA, is an analyst with Alpha Developers. While discussing backtesting with a client, Mason states, &quot;I am always skeptical when someone shows me a strategy that has performed well based on past data. Did they find this strategy by sifting through many different models and selecting the one based on how good it looked statistically?&quot; Mason then informs the client that the 5% monthly VaR of their portfolio is $12,000.<\/p><p>Another client is concerned with longer term trends in Ruritania, a country where the client has significant investments. A recent paper on consumption trends and that country&#x27;s position in the business cycle left the client with doubts about both Ruritanian interest rates and bond performance.<\/p><p>The relevant extract from the paper is shown in  Exhibit 1: Longer Term Macroeconomic Forecasts for Ruritania – Extract<\/p><p>Exhibit 1: Longer Term Macroeconomic Forecasts for Ruritania – Extract<\/p><p>&quot;Two distinct trends have emerged in the Ruritanian economy over the last 10 quarters. First, the level of wealth per capita has increased, and this increase is only expected to accelerate over the next four years. Compared to today, the average family can expect to increase their wealth at an average of 0.5% per year over this period.<\/p><p>In addition, the reduction of restrictions on capital flows and international trade under the current political regime (which is expected to remain in power for at least four years) is expected to continue, leading to an increase in both GDP and the volatility of GDP growth.&quot;<\/p><p>Mason draws two conclusions from the extract:<\/p><div class=\"tbl\"><table><tr><td>Conclusion<\/td><td>The expected trend in personal wealth will decrease the utility of future<\/td><\/tr><tr><td>1:<\/td><td>consumption relative to consumption today, reduce the inter-temporal rate of substitution, and reduce the real interest rate.<\/td><\/tr><tr><td>Conclusion<\/td><td>The increase in GDP growth is expected to increase real interest rates,<\/td><\/tr><tr><td>2:<\/td><td>but this effect be offset by the impact of the increase in the volatility of that growth.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Mason&#x27;s Conclusion 1, in response to the extract in Exhibit 3 is least accurate regarding the effect on:<\/p><\/div>","subj":"portfolio"},{"n":84,"q":"Mason's Conclusion 2, in response to the extract in Exhibit 3 is most likely:","opts":["incorrect, as both growth and volatility would increase real interest rates.","incorrect, as both growth and volatility would decrease real interest rates.","correct."],"ans":"A","expl":"High GDP growth reduces the utility of future consumption and, hence, the inter-temporal rate of substitution, so real interest rates should be higher. Increased volatility of growth, leading to uncertainty, will require a higher premium and, hence, also increase rates. (Module 39.1, LOS 39.c)","explhtml":"<p>High GDP growth reduces the utility of future consumption and, hence, the inter-temporal rate of substitution, so real interest rates should be higher. Increased volatility of growth, leading to uncertainty, will require a higher premium and, hence, also increase rates. (Module 39.1, LOS 39.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 81–84 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Steve Mason, CFA, is an analyst with Alpha Developers. While discussing backtesting with a client, Mason states, &quot;I am always skeptical when someone shows me a strategy that has performed well based on past data. Did they find this strategy by sifting through many different models and selecting the one based on how good it looked statistically?&quot; Mason then informs the client that the 5% monthly VaR of their portfolio is $12,000.<\/p><p>Another client is concerned with longer term trends in Ruritania, a country where the client has significant investments. A recent paper on consumption trends and that country&#x27;s position in the business cycle left the client with doubts about both Ruritanian interest rates and bond performance.<\/p><p>The relevant extract from the paper is shown in  Exhibit 1: Longer Term Macroeconomic Forecasts for Ruritania – Extract<\/p><p>Exhibit 1: Longer Term Macroeconomic Forecasts for Ruritania – Extract<\/p><p>&quot;Two distinct trends have emerged in the Ruritanian economy over the last 10 quarters. First, the level of wealth per capita has increased, and this increase is only expected to accelerate over the next four years. Compared to today, the average family can expect to increase their wealth at an average of 0.5% per year over this period.<\/p><p>In addition, the reduction of restrictions on capital flows and international trade under the current political regime (which is expected to remain in power for at least four years) is expected to continue, leading to an increase in both GDP and the volatility of GDP growth.&quot;<\/p><p>Mason draws two conclusions from the extract:<\/p><div class=\"tbl\"><table><tr><td>Conclusion<\/td><td>The expected trend in personal wealth will decrease the utility of future<\/td><\/tr><tr><td>1:<\/td><td>consumption relative to consumption today, reduce the inter-temporal rate of substitution, and reduce the real interest rate.<\/td><\/tr><tr><td>Conclusion<\/td><td>The increase in GDP growth is expected to increase real interest rates,<\/td><\/tr><tr><td>2:<\/td><td>but this effect be offset by the impact of the increase in the volatility of that growth.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Mason&#x27;s Conclusion 2, in response to the extract in Exhibit 3 is most likely:<\/p><\/div>","subj":"portfolio"},{"n":85,"q":"With respect to Bill Stallwell's portfolio, Vrbenic has most likely:","opts":["violated the Standards, both by buying the high-beta stock and by selling the calls.","violated the Standards by selling the options but not by purchasing the high-beta stock.","not violated the Standards because overall portfolio risk needs to be evaluated for the purpose of judging suitability."],"ans":"C","expl":"Standard III(C) – Suitability requires members to judge the suitability of investments in the context of the client's total portfolio. (Module 42.5, LOS 42.a)","explhtml":"<p>Standard III(C) – Suitability requires members to judge the suitability of investments in the context of the client&#x27;s total portfolio. (Module 42.5, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 85–88 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Andrea Vrbenic, CFA, was recently promoted to supervisory analyst at Banke Gjigante, a large brokerage firm that has investment banking and asset management departments. Vrbenic will report to Tom Sheffield, a senior manager and director at the firm.<\/p><p>Currently, Vrbenic manages the investment account of Bill Stallwell, a single retiree who lives off his portfolio and is relatively risk averse. Stallwell&#x27;s account has been with the firm for over fifteen years. Last year, Vrbenic added a stock with a beta of 1.5 to Stallwell&#x27;s portfolio. Since then, Vrbenic has also sold call options on these shares as part of a covered call strategy for Stallwell&#x27;s portfolio.<\/p><p>Sheffield passes on to Vrbenic a request from Amica Biotech, one of the firm&#x27;s clients, to write a research report on Amica. The research will be paid for by Amica, with a flat fee plus a fixed bonus if Amica&#x27;s IPO is fully subscribed.<\/p><p>Mike Callingly, CFA, a senior portfolio manager at Banke Gjigante, routinely distributes performance reports on composite of portfolios managed by him. He claims that the performance reports are GIPS compliant, except that the returns are equally-weighted and not asset-weighted.<\/p><p>As part of communication with her clients, Vrbenic sends out a quarterly performance report comparing the performance of clients&#x27; portfolios to the performance of a broad-based market index. While doing some analysis, Vrbenic notes that her performance would look more attractive if she used a target-date index fund for comparison purposes. She also notes that the risk profile of her client portfolios is more closely tracked by target-date funds than by the broad-based market index. Starting with the first quarter of the current year, Vrbenic updates her client communications, replacing the broad-based market index with target-date funds for comparison purposes.<\/p><\/div><\/details><div class=\"qtext\"><p>With respect to Bill Stallwell&#x27;s portfolio, Vrbenic has most likely:<\/p><\/div>","subj":"ethics"},{"n":86,"q":"With regards to the research report on Amica, Vrbenic will most likely:","opts":["not be in violation of the Standards as long as the fact that the research is issuer- funded is disclosed.","not be in violation of the Standards as long as both the source of the funding and the nature of the compensation is disclosed.","be in violation of the Standards even if both the funding source and the nature of the compensation are disclosed."],"ans":"C","expl":"Issuer-paid research is fraught with potential conflicts. Analysts' compensation for preparing such research should be limited, and the preference is for a flat fee without regard to conclusions or the report's recommendations. As such, the arrangement with Amica Biotech is a violation under Standard I(B) – Independence and Objectivity. (Module 42.1, LOS 42.a)","explhtml":"<p>Issuer-paid research is fraught with potential conflicts. Analysts&#x27; compensation for preparing such research should be limited, and the preference is for a flat fee without regard to conclusions or the report&#x27;s recommendations. As such, the arrangement with Amica Biotech is a violation under Standard I(B) – Independence and Objectivity. (Module 42.1, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 85–88 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Andrea Vrbenic, CFA, was recently promoted to supervisory analyst at Banke Gjigante, a large brokerage firm that has investment banking and asset management departments. Vrbenic will report to Tom Sheffield, a senior manager and director at the firm.<\/p><p>Currently, Vrbenic manages the investment account of Bill Stallwell, a single retiree who lives off his portfolio and is relatively risk averse. Stallwell&#x27;s account has been with the firm for over fifteen years. Last year, Vrbenic added a stock with a beta of 1.5 to Stallwell&#x27;s portfolio. Since then, Vrbenic has also sold call options on these shares as part of a covered call strategy for Stallwell&#x27;s portfolio.<\/p><p>Sheffield passes on to Vrbenic a request from Amica Biotech, one of the firm&#x27;s clients, to write a research report on Amica. The research will be paid for by Amica, with a flat fee plus a fixed bonus if Amica&#x27;s IPO is fully subscribed.<\/p><p>Mike Callingly, CFA, a senior portfolio manager at Banke Gjigante, routinely distributes performance reports on composite of portfolios managed by him. He claims that the performance reports are GIPS compliant, except that the returns are equally-weighted and not asset-weighted.<\/p><p>As part of communication with her clients, Vrbenic sends out a quarterly performance report comparing the performance of clients&#x27; portfolios to the performance of a broad-based market index. While doing some analysis, Vrbenic notes that her performance would look more attractive if she used a target-date index fund for comparison purposes. She also notes that the risk profile of her client portfolios is more closely tracked by target-date funds than by the broad-based market index. Starting with the first quarter of the current year, Vrbenic updates her client communications, replacing the broad-based market index with target-date funds for comparison purposes.<\/p><\/div><\/details><div class=\"qtext\"><p>With regards to the research report on Amica, Vrbenic will most likely:<\/p><\/div>","subj":"ethics"},{"n":87,"q":"With regards to performance presentation, Callingly's performance report is most likely:","opts":["a violation of Standard III(D) – Performance Presentation.","not a violation.","a violation of Standard I(D) – Professional Misconduct."],"ans":"A","expl":"Callingly is in violation of Standard (III)D – Performance Presentation by claiming\n® | ®\nGIPS | compliance even though one of the requirements of GIPS ® | is not complied\nwith. There is no partial GIPS | compliance. (Module 42.6, LOS 42.a)","explhtml":"<p>Callingly is in violation of Standard (III)D – Performance Presentation by claiming<\/p><div class=\"tbl\"><table><tr><td><sup>®<\/sup><\/td><td><sup>®<\/sup><\/td><td><\/td><\/tr><tr><td>GIPS<\/td><td> compliance even though one of the requirements of GIPS <sup>®<\/sup><\/td><td> is not complied<\/td><\/tr><tr><td>with. There is no partial GIPS<\/td><td> compliance. (Module 42.6, LOS 42.a)<\/td><td><\/td><\/tr><\/table><\/div>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 85–88 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Andrea Vrbenic, CFA, was recently promoted to supervisory analyst at Banke Gjigante, a large brokerage firm that has investment banking and asset management departments. Vrbenic will report to Tom Sheffield, a senior manager and director at the firm.<\/p><p>Currently, Vrbenic manages the investment account of Bill Stallwell, a single retiree who lives off his portfolio and is relatively risk averse. Stallwell&#x27;s account has been with the firm for over fifteen years. Last year, Vrbenic added a stock with a beta of 1.5 to Stallwell&#x27;s portfolio. Since then, Vrbenic has also sold call options on these shares as part of a covered call strategy for Stallwell&#x27;s portfolio.<\/p><p>Sheffield passes on to Vrbenic a request from Amica Biotech, one of the firm&#x27;s clients, to write a research report on Amica. The research will be paid for by Amica, with a flat fee plus a fixed bonus if Amica&#x27;s IPO is fully subscribed.<\/p><p>Mike Callingly, CFA, a senior portfolio manager at Banke Gjigante, routinely distributes performance reports on composite of portfolios managed by him. He claims that the performance reports are GIPS compliant, except that the returns are equally-weighted and not asset-weighted.<\/p><p>As part of communication with her clients, Vrbenic sends out a quarterly performance report comparing the performance of clients&#x27; portfolios to the performance of a broad-based market index. While doing some analysis, Vrbenic notes that her performance would look more attractive if she used a target-date index fund for comparison purposes. She also notes that the risk profile of her client portfolios is more closely tracked by target-date funds than by the broad-based market index. Starting with the first quarter of the current year, Vrbenic updates her client communications, replacing the broad-based market index with target-date funds for comparison purposes.<\/p><\/div><\/details><div class=\"qtext\"><p>With regards to performance presentation, Callingly&#x27;s performance report is most likely:<\/p><\/div>","subj":"ethics"},{"n":88,"q":"With respect to Vrbenic's changes to quarterly performance reports for clients, Vrbenic is most likely:","opts":["not in violation of the Standards because the change has a reasonable basis.","in violation of Standard III(D) because changes to an established performance benchmark are prohibited.","not in violation of the Standards if she discloses the change in performance presentation to her clients."],"ans":"C","expl":"Under Standard III(D) – Performance Presentation, members are required to promptly disclose any changes in benchmarks used in performance presentation. To avoid a violation of the Standard, the member must disclose this change to existing and new clients. Vrbenic should explain the reasons for changing the benchmark and present the performance reports using both the old and new methodologies so that clients may compare them. (Module 42.6, LOS 42.a)","explhtml":"<p>Under Standard III(D) – Performance Presentation, members are required to promptly disclose any changes in benchmarks used in performance presentation. To avoid a violation of the Standard, the member must disclose this change to existing and new clients. Vrbenic should explain the reasons for changing the benchmark and present the performance reports using both the old and new methodologies so that clients may compare them. (Module 42.6, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 85–88 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Andrea Vrbenic, CFA, was recently promoted to supervisory analyst at Banke Gjigante, a large brokerage firm that has investment banking and asset management departments. Vrbenic will report to Tom Sheffield, a senior manager and director at the firm.<\/p><p>Currently, Vrbenic manages the investment account of Bill Stallwell, a single retiree who lives off his portfolio and is relatively risk averse. Stallwell&#x27;s account has been with the firm for over fifteen years. Last year, Vrbenic added a stock with a beta of 1.5 to Stallwell&#x27;s portfolio. Since then, Vrbenic has also sold call options on these shares as part of a covered call strategy for Stallwell&#x27;s portfolio.<\/p><p>Sheffield passes on to Vrbenic a request from Amica Biotech, one of the firm&#x27;s clients, to write a research report on Amica. The research will be paid for by Amica, with a flat fee plus a fixed bonus if Amica&#x27;s IPO is fully subscribed.<\/p><p>Mike Callingly, CFA, a senior portfolio manager at Banke Gjigante, routinely distributes performance reports on composite of portfolios managed by him. He claims that the performance reports are GIPS compliant, except that the returns are equally-weighted and not asset-weighted.<\/p><p>As part of communication with her clients, Vrbenic sends out a quarterly performance report comparing the performance of clients&#x27; portfolios to the performance of a broad-based market index. While doing some analysis, Vrbenic notes that her performance would look more attractive if she used a target-date index fund for comparison purposes. She also notes that the risk profile of her client portfolios is more closely tracked by target-date funds than by the broad-based market index. Starting with the first quarter of the current year, Vrbenic updates her client communications, replacing the broad-based market index with target-date funds for comparison purposes.<\/p><\/div><\/details><div class=\"qtext\"><p>With respect to Vrbenic&#x27;s changes to quarterly performance reports for clients, Vrbenic is most likely:<\/p><\/div>","subj":"ethics"}];
const CFG = {"title": "Schweser Mock 5 (2025) — Session 2", "subtitle": "CFA Level II · 44 câu · 2h12p", "minutes": 132, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";

  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

const CFA_SESSION_SUBJECT_RANGES = {

  2:{equity:[20,25],fixed:[20,25],derivatives:[9,14],alternatives:[11,16],portfolio:[14,22]}
};
const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,
  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,
  fsa:/financial statement|financial reporting|accounting|income statement|balance sheet|cash flow|revenue|expense|inventory|cost of sales|gross profit|gross margin|shareholders?['’]? equity|earnings per share|\beps\b|audit|gaap|ifrs|taxable income|deferred tax|temporary difference|intangible|long-lived|revaluation|impairment|amortization|depreciation|pension|financial ratio|receivables turnover|payables turnover|cash conversion|fixed charge coverage|normalized earnings|management['’]?s commentary/g,

  equity:/equity|common share|preferred share|stock|market index|index weighting|market efficiency|efficient market|security market|buy order|sell order|limit order|dealer|margin requirement|leverage ratio|industry classification|company analysis|enterprise value|price-to|free cash flow to equity|\bfcfe\b|dividend discount|earnings multiplier|book value per share|intrinsic value|voting|ex-dividend/g,
  fixed:/fixed-income|fixed income|bond|debt|credit rating|credit spread|yield|spot rate|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|repo|covenant|accrued interest|priority of claims|default|extension risk|interest coverage/g,
  derivatives:/derivative|forward|future|swap|option|call buyer|call seller|put buyer|put seller|strike price|premium|put-call|binomial|contingent claim|moneyness|expiration|arbitrage|replication/g,
  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,
  portfolio:/portfolio|asset allocation|investment policy|\bips\b|behavioral|cognitive error|risk aversion|utility|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation|covariance|sharpe|treynor|jensen|information ratio|two-fund|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral/g
};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();

(function(){

      emoji.textContent='💪';
    }

    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  if(graded) window.showGradedResult();

  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
