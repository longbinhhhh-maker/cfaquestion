<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<body>
<header>
  <button class="back-btn" onclick="location.href='index.html'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Which of the following statements concerning the notes to the audited financial statements\nof a company is least accurate? Financial statement notes:", "opts": ["contain information about contingent losses that may occur.", "are audited.", "include management's assessment of the company's operating performance and financial results."], "ans": "C", "expl": "Management's perspective on the company's results is provided in the Management's\nDiscussion and Analysis supplement to the financial statements. Financial statement notes\n(footnotes) provide information about matters such as the company's accounting methods\nand assumptions, contingencies, and acquisitions and disposals. Footnotes to the financial\nstatements are audited.\n(Module 27.1, LOS 27.c)"}, {"n": 2, "q": "Which of the following is an analyst least likely to rely on as objective information to include\nin a company analysis?", "opts": ["Corporate press releases.", "Government agency statistical data on the economy and the company’s industry.", "Proxy statements."], "ans": "A", "expl": "Corporate reports and press releases are written by management and are often viewed as\npublic relations or sales materials. An analyst should review information on the economy\nand the company's industry and compare the company to its competitors. This\ninformation can be acquired from sources such as trade journals, statistical reporting\nservices, and government agencies. Securities and Exchange Commission (SEC) filings\ninclude Form 8-K, which a company must file to report events such as acquisitions and\ndisposals of major assets or changes in its management or corporate governance and\nproxy statements, which are a good source of information about the election of (and\nqualifications of) board members, compensation, management qualifications, and the\nissuance of stock options.\n(Module 27.1, LOS 27.e)"}, {"n": 3, "q": "A firm's internal controls are most accurately described as:", "opts": ["a responsibility of the firm’s board of directors.", "directly affecting the firm’s financial reporting quality.", "outside the scope of an audit report under IFRS and U.S. GAAP."], "ans": "B", "expl": "Weak internal controls provide an opportunity for low-quality or even fraudulent financial\nreporting. A firm's management, not its board of directors, is responsible for ensuring the\neffectiveness of a firm's internal controls. Under U.S. GAAP, auditors are required to state\nan opinion on a firm's internal controls.\n(Module 27.1, LOS 27.c)"}, {"n": 4, "q": "Which of the following statements about financial statement analysis and reporting is least\naccurate?", "opts": ["Providing information about changes in a company’s financial position is a role of financial reporting.", "Deciding whether to recommend a company’s securities to investors is a role of financial statement analysis.", "Financial statement analysis focuses on the way companies show their financial performance to investors by preparing and presenting financial statements."], "ans": "C", "expl": "Financial reporting refers to the way companies show their financial performance to\ninvestors, creditors, and other interested parties by preparing and presenting financial\nstatements, including information about changes in a company's financial position. The\nrole of financial statement analysis is to use the information in a company's financial\nstatements, along with other relevant information, to make economic decisions, such as\nwhether to invest in the company's securities or recommend them to other investors.\nAnalysts use financial statement data to evaluate a company's past performance and\ncurrent financial position in order to form opinions about the company's ability to earn\nprofits and generate cash flow in the future.\n(Module 27.1, LOS 27.b)"}, {"n": 5, "q": "Which of the following best describes financial reporting and financial statement analysis?", "opts": ["Financial reporting refers to how companies show their financial performance and financial analysis refers to using the information to make economic decisions.", "Financial reports assess a company’s past performance in order to draw conclusions about the company’s ability to generate cash and profits in the future.", "The objective of financial analysis is to provide information about the financial position of an entity that is useful to a wide range of users."], "ans": "A", "expl": "Financial reporting refers to the way companies show their financial performance to\ninvestors, creditors, and other interested parties by preparing and presenting financial\nstatements. The objective of financial statements, not analysis, is to provide information\nabout the financial position, performance and changes in financial position of an entity\nthat is useful to a wide range of users in making economic decisions. The role of financial\nstatement analysis, not reporting, is to use the information in a company's financial\nstatements, along with other relevant information, to assess a company's past\nperformance in order to draw conclusions about the company's ability to generate cash\nand profits in the future.\n(Module 27.1, LOS 27.b)"}, {"n": 6, "q": "Which of the following is least likely to be available on EDGAR (Electronic Data Gathering,\nAnalysis, and Retrieval System)?", "opts": ["Corporate press releases.", "Form 10Q.", "SEC filings."], "ans": "A", "expl": "Securities and Exchange Commission (SEC) filings are available from EDGAR (Electronic\nData Gathering, Analysis, and Retrieval System, www.sec.gov). Companies' annual and\nquarterly financial statements are also filed with the SEC (Form 10-K and Form 10-Q,\nrespectively).\n(Module 27.1, LOS 27.e)"}, {"n": 7, "q": "The standard auditor's report is most likely required to:", "opts": ["provide an \"unqualified\" opinion if material uncertainties exist.", "provide reasonable assurance that the financial statements contain no material errors.", "provide reasonable assurance that management is reliable."], "ans": "B", "expl": "The standard auditor's report contains three parts:\n1. The financial statements are prepared by management and are their responsibility\nand the auditor has performed an independent review.\n2. The audit was conducted using generally accepted auditing standards, which\nprovides reasonable assurance that there are no material errors in the financial\nstatements.\n3. The auditor is satisfied the statements were prepared in accordance with accepted\naccounting principles, and the principles chosen and estimates are reasonable.\nUnder U.S. GAAP, the auditor is required to state an opinion on the company's internal\ncontrols. The auditor may add this opinion as a fourth element of the auditor's report or\nprovide it separately.\n(Module 27.1, LOS 27.c)"}, {"n": 8, "q": "The role of financial statement analysis is most accurately described as:", "opts": ["a common requirement for companies that are listed on public exchanges.", "the reports and presentations a company uses to show its financial performance to investors, creditors, and other interested parties.", "the use of information from a company’s financial statements along with other information to make economic decisions regarding that company."], "ans": "C", "expl": "Financial statement analysis refers to the use of information from a company's financial\nstatements along with other information to make economic decisions regarding that\ncompany. Financial reporting refers to the reports and presentations that a company uses\nto show its financial performance to investors, creditors, and other interested parties.\nFinancial reporting is a requirement for companies that are listed on public exchanges.\n(Module 27.1, LOS 27.b)"}, {"n": 9, "q": "According to the IASB, which of the following least accurately describes financial reporting?\nFinancial reporting:", "opts": ["is useful to a wide range of users.", "provides information about changes in financial position of an entity.", "uses the information in a company’s financial statements to make economic decisions."], "ans": "C", "expl": "The role of financial reporting is described by the International Accounting Standards\nBoard (IASB) in its \"Framework for the Preparation and Presentation of Financial\nStatements\":\nThe objective of financial statements is to provide information about the financial position,\nperformance and changes in financial position of an entity that is useful to a wide range of\nusers in making economic decisions.\nUsing the information in a company's financial statements to make economic decisions is\nfinancial analysis, not financial reporting.\n(Module 27.1, LOS 27.b)"}, {"n": 10, "q": "Which of the following statements about proxy statements is least accurate? Proxy\nstatements are:", "opts": ["available on the EDGAR web site.", "not filed with the SEC.", "a good source of information about the qualifications of board members and management."], "ans": "B", "expl": "Proxy statements are issued to shareholders when there are matters that require a\nshareholder vote. These statements, which are also filed with the SEC and available from\nEDGAR, are a good source of information about the election of (and qualifications of)\nboard members, compensation, management qualifications, and the issuance of stock\noptions.\n(Module 27.1, LOS 27.e)"}, {"n": 11, "q": "A firm engages in a new type of financial transaction that has a material effect on its\nearnings. An analyst should most likely be suspicious of the new transaction if:", "opts": ["management has not explained its business purpose.", "no accounting standard exists that applies to the transaction.", "the transaction is not governed by existing regulations."], "ans": "A", "expl": "New types of transactions may emerge that are not covered by existing accounting\nstandards or regulations. Analysts should obtain information from a firm's management\nabout the economic substance of such transactions to ensure that they serve a business\npurpose and have not been created primarily to manipulate the firm's financial\nstatements.\n(Module 27.1, LOS 27.d)"}, {"n": 12, "q": "The step in the financial statement analysis framework of \"processing the data\" is least likely\nto include which activity?", "opts": ["Acquiring the company’s financial statements.", "Preparing exhibits such as graphs.", "Making appropriate adjustments to the financial statements."], "ans": "A", "expl": "The financial statement analysis framework consists of six steps. Step 2: \"Gather data\"\nincludes acquiring the company's financial statements and other relevant data on its\nindustry and the economy. Step 3. \"Process the data\" includes activities such as making\nany appropriate adjustments to the financial statements and preparing exhibits such as\ngraphs and common-size balance sheets.\n(Module 27.1, LOS 27.a)"}, {"n": 13, "q": "Which of the following is the best description of the financial statement analysis framework?", "opts": ["Gather data, analyze and interpret the data, determine the context, report the conclusions, update the analysis.", "Gather data, analyze and interpret the data, process the conclusions, assess the context, report the recommendations, update the analysis.", "State the objective and context, gather data, process the data, analyze and interpret the data, report the conclusions or recommendations, update the analysis."], "ans": "C", "expl": "The financial statement analysis framework consists of six steps:\n1. State the objective and context.\n2. Gather data.\n3. Process the data.\n4. Analyze and interpret the data.\n5. Report the conclusions or recommendations.\n6. Update the analysis.\n(Module 27.1, LOS 27.a)"}, {"n": 14, "q": "For publicly traded firms in the United States, the Management Discussion and Analysis\n(MD&A) portion of the financial disclosure is least likely required to discuss:", "opts": ["capital resources and liquidity.", "results of operations.", "unusual or infrequent items."], "ans": "C", "expl": "For publicly traded U.S. firms, the MD&A portion of the financial disclosure is required to\ndiscuss results of operations, capital resources and liquidity and a general business\noverview based on known trends. A discussion of unusual or infrequent items may be\nincluded in the MD&A, but is not required.\n(Module 27.1, LOS 27.c)"}, {"n": 15, "q": "In addition to the audited financial statements included in a firm's annual report, which of\nthe following sources of information is most likely to contain audited data?", "opts": ["Interim financial statements filed with the SEC.", "Management’s commentary.", "Footnotes to the annual financial statements."], "ans": "C", "expl": "The footnotes are an integral part of the audited financial statements in a firm's annual\nreport and are included in the audit opinion.\n(Module 27.1, LOS 27.e)"}, {"n": 16, "q": "According to IFRS guidance for management's commentary, addressing the company's key\nrelationships is:", "opts": ["required.", "neither recommended nor required.", "recommended."], "ans": "C", "expl": "IFRS recommends that management commentary address the company's key\nrelationships, resources, and risks, as well as the nature of the business, management's\nobjectives, the company's past performance, and the performance measures used.\nSecurities regulators may impose requirements for publicly traded firms to address certain\ntopics in management's commentary, but accounting standards do not.\n(Module 27.1, LOS 27.c)"}, {"n": 17, "q": "Which of the following is an independent auditor least likely to do with respect to a\ncompany's financial statements?", "opts": ["Confirm assets and liabilities contained in them.", "Prepare and accept responsibility for them.", "Provide an opinion concerning their fairness and reliability."], "ans": "B", "expl": "Auditors make an independent review of financial statements, which are prepared by\ncompany management and are management's responsibility. It is the responsibility of\nauditors to confirm the assets, liabilities, and other items included in the statements and\nthen issue an opinion concerning their fairness and reliability.\n(Module 27.1, LOS 27.c)"}, {"n": 18, "q": "Which of the following is least likely to be considered a role of financial statement analysis?", "opts": ["Assessing the management skill of the company’s executives.", "Determining whether to invest in the company's securities.", "To make economic decisions."], "ans": "A", "expl": "The role of financial statement analysis is to use the information in a company's financial\nstatements, along with other relevant information, to make economic decisions. Examples\nof such decisions include whether to invest in the company's securities or recommend\nthem to other investors, or whether to extend trade or bank credit to the company.\nAlthough the financial statements might provide indirect evidence about the management\nskill of the company's executives, that is not generally considered the role of financial\nstatement analysis.\n(Module 27.1, LOS 27.b)"}, {"n": 19, "q": "In the financial statement analysis framework, using the data to address the objectives of\nthe analysis and deciding what conclusions or recommendations the information supports is\nbest described as:", "opts": ["analyzing and interpreting the data.", "processing the data.", "reporting the conclusions."], "ans": "A", "expl": "The financial statement analysis framework consists of six steps:\n1. State the objective and context. Determine what questions the analysis is meant to\nanswer, the form in which it needs to be presented, and what resources and how\nmuch time are available to perform the analysis.\n2. Gather data. Acquire the company's financial statements and other relevant data on\nits industry and the economy. Ask questions of the company's management,\nsuppliers, and customers, and visit company sites.\n3. Process the data. Make any appropriate adjustments to the financial statements.\nCalculate ratios. Prepare exhibits such as graphs and common-size balance sheets.\n4. Analyze and interpret the data. Use the data to answer the questions stated in the\nfirst step. Decide what conclusions or recommendations the information supports.\n5. Report the conclusions or recommendations. Prepare a report and communicate it\nto its intended audience. Be sure the report and its dissemination comply with the\nCode and Standards that relate to investment analysis and recommendations.\n6. Update the analysis. Repeat these steps periodically and change the conclusions or\nrecommendations when necessary.\n(Module 27.1, LOS 27.a)"}, {"n": 20, "q": "The step in the financial statement analysis framework that includes making any appropriate\nadjustments to the financial statements and calculating ratios is best described as:", "opts": ["analyzing and interpreting the data.", "gathering the data.", "processing the data."], "ans": "C", "expl": "The financial statement analysis framework consists of six steps:\n1. State the objective and context. Determine what questions the analysis is meant to\nanswer, the form in which it needs to be presented, and what resources and how\nmuch time are available to perform the analysis.\n2. Gather data. Acquire the company's financial statements and other relevant data on\nits industry and the economy. Ask questions of the company's management,\nsuppliers, and customers, and visit company sites.\n3. Process the data. Make any appropriate adjustments to the financial statements.\nCalculate ratios. Prepare exhibits such as graphs and common-size balance sheets.\n4. Analyze and interpret the data. Use the data to answer the questions stated in the\nfirst step. Decide what conclusions or recommendations the information supports.\n5. Report the conclusions or recommendations. Prepare a report and communicate it\nto its intended audience. Be sure the report and its dissemination comply with the\nCode and Standards that relate to investment analysis and recommendations.\n6. Update the analysis. Repeat these steps periodically and change the conclusions or\nrecommendations when necessary.\n(Module 27.1, LOS 27.a)"}, {"n": 21, "q": "Which of the following would NOT require an explanatory paragraph added to the auditors'\nreport?", "opts": ["Statements that the financial information was prepared according to GAAP.", "Uncertainty due to litigation.", "Doubt regarding the \"going concern\" assumption."], "ans": "A", "expl": "The statements that the financial information was prepared according to GAAP should be\nincluded in the regular part of the auditors' report and not as an explanatory paragraph.\nThe other information would be contained in explanatory paragraphs added to the\nauditors' report.\n(Module 27.1, LOS 27.c)"}, {"n": 22, "q": "Which of the following statements regarding footnotes to the financial statements is least\naccurate? Financial statement footnotes:", "opts": ["may contain information regarding contingent losses.", "provide information about assumptions and estimates used by management.", "typically include a discussion of the firm’s past performance and future outlook."], "ans": "C", "expl": "Discussion of a firm's past performance and future outlook is most likely to be found in\nmanagement's commentary.\n(Module 27.1, LOS 27.c)"}];
const CFG = {"title": "Introduction to Financial Statement Analysis", "subtitle": "CFA · Financial Statement Analysis · Reading 27 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const day = new Date().toISOString().slice(0,10);
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; stem.textContent = q.q;
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    document.querySelectorAll('.opt.correct').forEach(function(o){ addMark(o,'✅'); });
    document.querySelectorAll('.opt.wrong').forEach(function(o){ addMark(o,'❌'); });
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#6d5efc','#9d8bff','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>
</body>
</html>
