n Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-005.webp\" style=\"max-width:min(100%,498px)\" alt=\"Contribution Contribution Contribution Geographical from Volume from Price from Foreign Segment Growth Growth Exchange X 5% 12% 0% 10% 6% 5% Z 9% 9% 2%\"><p>On 1 January of the most recent year, Estelle established Luna Ltd., a wholly owned subsidiary in Hong Kong SAR. Luna reports under IFRS, and Young decides to use the Hong Kong Dollar (HKD) as its functional currency. Luna is accounted for using the current rate method for consolidation purposes, and has a net monetary asset position. The HKD has strengthened against the EUR during the most recent year. Luna's income statement of the most recent year indicates its depreciation expense was HKD 10 million. Young instructs his team to consolidate Luna's results into Estelle's consolidated financial statements using the exchange rates in EUR/HKD (number of EUR per 1 HKD) for the most recent year in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-006.webp\" style=\"max-width:min(100%,559px)\" alt=\"Date EUR/HKD 1 January 0.1051 Annual average 0.1099 31 December 0.1135\"><p>Crescent Co. is Estelle's wholly owned subsidiary in Country H. Crescent reports under IFRS and uses the local currency (LCY) as its functional currency. Inflation in Country H has been surging over the past three years, and the economy is considered to be hyperinflationary. Crescent's revenue for the most recent year is LCY 200 million. The EUR/LCY exchange rates (number of EUR per 1 LCY) and Country H's consumer price index (CPI) for the most recent year are presented in Exhibit 3.<\/p><p><b>Exhibit 3<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-007.webp\" style=\"max-width:min(100%,450px)\" alt=\"Date EUR/LCY Country H&#x27;s CPI 1 January 0.066 100 Annual average 0.058 155 31 December 0.050 180\"><\/div><\/details><div class=\"qtext\"><p>Which of Estelle's geographical segments most likely has the highest sustainable<\/p><p>sales growth?<\/p><\/div>", "subj": "fsa"}, {"n": 18, "q": "Will Estelle's consolidated income statement include a translation gain or loss as a result of consolidating Luna's financial results?", "opts": ["No", "Yes, it will include a translation loss", "Yes, it will include a translation gain"], "ans": "A", "expl": "A is correct. because Luna is translated using the current rate method. When the current rate method is used, the cumulative translation adjustment needed to keep the translated balance sheet in balance is reported as a separate component of stockholders' equity, not as a translation gain or loss on the income statement.", "explhtml": "<p><b>A is correct.<\/b> because Luna is translated using the current rate method. When the<\/p><p>current rate method is used, the cumulative translation adjustment needed to keep the translated balance sheet in balance is reported as a separate component of stockholders' equity, not as a translation gain or loss on the income statement.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Financial Statement Analysis · Alan Young<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alan Young is the chief financial officer of Estelle S.A., a global luxury jeweler headquartered in Paris. Estelle reports under IFRS, and its functional and presentation currency is EUR. Young reviews a management report comparing Estelle's sales growth in different geographical segments, as shown in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-005.webp\" style=\"max-width:min(100%,498px)\" alt=\"Contribution Contribution Contribution Geographical from Volume from Price from Foreign Segment Growth Growth Exchange X 5% 12% 0% 10% 6% 5% Z 9% 9% 2%\"><p>On 1 January of the most recent year, Estelle established Luna Ltd., a wholly owned subsidiary in Hong Kong SAR. Luna reports under IFRS, and Young decides to use the Hong Kong Dollar (HKD) as its functional currency. Luna is accounted for using the current rate method for consolidation purposes, and has a net monetary asset position. The HKD has strengthened against the EUR during the most recent year. Luna's income statement of the most recent year indicates its depreciation expense was HKD 10 million. Young instructs his team to consolidate Luna's results into Estelle's consolidated financial statements using the exchange rates in EUR/HKD (number of EUR per 1 HKD) for the most recent year in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-006.webp\" style=\"max-width:min(100%,559px)\" alt=\"Date EUR/HKD 1 January 0.1051 Annual average 0.1099 31 December 0.1135\"><p>Crescent Co. is Estelle's wholly owned subsidiary in Country H. Crescent reports under IFRS and uses the local currency (LCY) as its functional currency. Inflation in Country H has been surging over the past three years, and the economy is considered to be hyperinflationary. Crescent's revenue for the most recent year is LCY 200 million. The EUR/LCY exchange rates (number of EUR per 1 LCY) and Country H's consumer price index (CPI) for the most recent year are presented in Exhibit 3.<\/p><p><b>Exhibit 3<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-007.webp\" style=\"max-width:min(100%,450px)\" alt=\"Date EUR/LCY Country H&#x27;s CPI 1 January 0.066 100 Annual average 0.058 155 31 December 0.050 180\"><\/div><\/details><div class=\"qtext\"><p>Will Estelle's consolidated income statement include a translation gain or loss as a<\/p><p>result of consolidating Luna's financial results?<\/p><\/div>", "subj": "fsa"}, {"n": 19, "q": "For the most recent year, Luna's depreciation expense (in EUR millions) that is included in Estelle's consolidated income statement is closest to:", "opts": ["1.05.", "1.10.", "1.14."], "ans": "B", "expl": "B is correct. because under the current rate method, revenues and expenses are translated at the exchange rate that existed when the transactions took place. For practical reasons, a rate that approximates the exchange rates at the dates of the transactions, such as an average exchange rate, may be used. Luna's depreciation expense (in EUR millions) included in Estelle's consolidated income statement for the year just ended is 10 x 0.1099 = 1.099 o EUR 1.10 million, calculated using average rate under the current rate method for income statement items.", "explhtml": "<p><b>B is correct.<\/b> because under the current rate method, revenues and expenses are<\/p><p>translated at the exchange rate that existed when the transactions took place. For practical reasons, a rate that approximates the exchange rates at the dates of the transactions, such as an average exchange rate, may be used. Luna's depreciation expense (in EUR millions) included in Estelle's consolidated income statement for the year just ended is 10 x 0.1099 = 1.099 o EUR 1.10 million, calculated using average rate under the current rate method for income statement items.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Financial Statement Analysis · Alan Young<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alan Young is the chief financial officer of Estelle S.A., a global luxury jeweler headquartered in Paris. Estelle reports under IFRS, and its functional and presentation currency is EUR. Young reviews a management report comparing Estelle's sales growth in different geographical segments, as shown in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-005.webp\" style=\"max-width:min(100%,498px)\" alt=\"Contribution Contribution Contribution Geographical from Volume from Price from Foreign Segment Growth Growth Exchange X 5% 12% 0% 10% 6% 5% Z 9% 9% 2%\"><p>On 1 January of the most recent year, Estelle established Luna Ltd., a wholly owned subsidiary in Hong Kong SAR. Luna reports under IFRS, and Young decides to use the Hong Kong Dollar (HKD) as its functional currency. Luna is accounted for using the current rate method for consolidation purposes, and has a net monetary asset position. The HKD has strengthened against the EUR during the most recent year. Luna's income statement of the most recent year indicates its depreciation expense was HKD 10 million. Young instructs his team to consolidate Luna's results into Estelle's consolidated financial statements using the exchange rates in EUR/HKD (number of EUR per 1 HKD) for the most recent year in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-006.webp\" style=\"max-width:min(100%,559px)\" alt=\"Date EUR/HKD 1 January 0.1051 Annual average 0.1099 31 December 0.1135\"><p>Crescent Co. is Estelle's wholly owned subsidiary in Country H. Crescent reports under IFRS and uses the local currency (LCY) as its functional currency. Inflation in Country H has been surging over the past three years, and the economy is considered to be hyperinflationary. Crescent's revenue for the most recent year is LCY 200 million. The EUR/LCY exchange rates (number of EUR per 1 LCY) and Country H's consumer price index (CPI) for the most recent year are presented in Exhibit 3.<\/p><p><b>Exhibit 3<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-007.webp\" style=\"max-width:min(100%,450px)\" alt=\"Date EUR/LCY Country H&#x27;s CPI 1 January 0.066 100 Annual average 0.058 155 31 December 0.050 180\"><\/div><\/details><div class=\"qtext\"><p>For the most recent year, Luna's depreciation expense (in EUR millions) that is<\/p><p>included in Estelle's consolidated income statement is closest to:<\/p><\/div>", "subj": "fsa"}, {"n": 20, "q": "For the most recent year, Crescent's revenue (in EUR millions) that is included in Estelle's consolidated income statement is closest to:", "opts": ["11.6.", "15.5.", "18.0."], "ans": "A", "expl": "A is correct. because Country H has experienced hyperinflation in the most recent year. IFRS require the foreign currency financial statements first to be restated for inflation using the procedures of IAS 29, and then the inflation-adjusted financial statements are translated using the current exchange rate. IAS 29 requires the following procedure in adjusting financial statements for inflation: All income statement items are restated by applying the change in the general price index from the dates when the items were originally recorded to the balance sheet date. According to IFRS, Crescent's financial statements must be restated for local inflation, then translated into EUR using the current exchange rate at year-end. Crescent's revenue that should be included in Estelle's consolidated income statement is therefore calculated as follows: Crescent's inflation-adjusted revenue in LCY = revenue in LCY × (31 December CPI / average CPI) = LCY 200 million × (180 / 155) = LCY 200 million × 1.1613 = LCY 232.26 million Crescent's revenue in EUR = inflation-adjusted revenue in LCY × 31 December exchange rate (EUR/LCY) = LCY 232.26 million × 0.050 g EUR 11.6 million.", "explhtml": "<p><b>A is correct.<\/b> because Country H has experienced hyperinflation in the most recent<\/p><p>year. IFRS require the foreign currency financial statements first to be restated for inflation using the procedures of IAS 29, and then the inflation-adjusted financial statements are translated using the current exchange rate. IAS 29 requires the following procedure in adjusting financial statements for inflation: All income statement items are restated by applying the change in the general price index from the dates when the items were originally recorded to the balance sheet date. According to IFRS, Crescent's financial statements must be restated for local inflation, then translated into EUR using the current exchange rate at year-end. Crescent's revenue that should be included in Estelle's consolidated income statement is therefore calculated as follows: Crescent's inflation-adjusted revenue in LCY = revenue in LCY × (31 December CPI / average CPI) = LCY 200 million × (180 / 155) = LCY 200 million × 1.1613 = LCY 232.26 million Crescent's revenue in EUR = inflation-adjusted revenue in LCY × 31 December exchange rate (EUR/LCY) = LCY 232.26 million × 0.050 g EUR 11.6 million.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Financial Statement Analysis · Alan Young<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alan Young is the chief financial officer of Estelle S.A., a global luxury jeweler headquartered in Paris. Estelle reports under IFRS, and its functional and presentation currency is EUR. Young reviews a management report comparing Estelle's sales growth in different geographical segments, as shown in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-005.webp\" style=\"max-width:min(100%,498px)\" alt=\"Contribution Contribution Contribution Geographical from Volume from Price from Foreign Segment Growth Growth Exchange X 5% 12% 0% 10% 6% 5% Z 9% 9% 2%\"><p>On 1 January of the most recent year, Estelle established Luna Ltd., a wholly owned subsidiary in Hong Kong SAR. Luna reports under IFRS, and Young decides to use the Hong Kong Dollar (HKD) as its functional currency. Luna is accounted for using the current rate method for consolidation purposes, and has a net monetary asset position. The HKD has strengthened against the EUR during the most recent year. Luna's income statement of the most recent year indicates its depreciation expense was HKD 10 million. Young instructs his team to consolidate Luna's results into Estelle's consolidated financial statements using the exchange rates in EUR/HKD (number of EUR per 1 HKD) for the most recent year in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-006.webp\" style=\"max-width:min(100%,559px)\" alt=\"Date EUR/HKD 1 January 0.1051 Annual average 0.1099 31 December 0.1135\"><p>Crescent Co. is Estelle's wholly owned subsidiary in Country H. Crescent reports under IFRS and uses the local currency (LCY) as its functional currency. Inflation in Country H has been surging over the past three years, and the economy is considered to be hyperinflationary. Crescent's revenue for the most recent year is LCY 200 million. The EUR/LCY exchange rates (number of EUR per 1 LCY) and Country H's consumer price index (CPI) for the most recent year are presented in Exhibit 3.<\/p><p><b>Exhibit 3<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-007.webp\" style=\"max-width:min(100%,450px)\" alt=\"Date EUR/LCY Country H&#x27;s CPI 1 January 0.066 100 Annual average 0.058 155 31 December 0.050 180\"><\/div><\/details><div class=\"qtext\"><p>For the most recent year, Crescent's revenue (in EUR millions) that is included in<\/p><p>Estelle's consolidated income statement is closest to:<\/p><\/div>", "subj": "fsa"}, {"n": 21, "q": "In preparing her report on Kimber, Smith violates the Standard(s) relating to:", "opts": ["misrepresentation only.", "diligence and reasonable basis only.", "misrepresentation as well as diligence and reasonable basis."], "ans": "C", "expl": "C is correct. because Smith violates Standard V(A) Diligence and Reasonable Basis by relying on the work of others without confirming the suitability of the research. Smith also violates Standard I(C) Misrepresentation by not citing the original authors of the financial forecasts of Kimber. Smith should have cited the sources used for the report when she presented it to Lee.", "explhtml": "<p><b>C is correct.<\/b> because Smith violates Standard V(A) Diligence and Reasonable Basis by<\/p><p>relying on the work of others without confirming the suitability of the research. Smith also violates Standard I(C) Misrepresentation by not citing the original authors of the financial forecasts of Kimber. Smith should have cited the sources used for the report when she presented it to Lee.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Ethics · Daisy Lee<\/summary><div class=\"vig-body\"><p>Daisy Lee is the head of research at Easy Street Investments. The firm provides brokerage and research to fee-paying clients. Easy Street has adopted the Standards.<\/p><p>Alexa Smith has recently been hired as an analyst. Lee asks Smith to research Kimber Manufacturing. Smith obtains research reports published by several sell-side analysts at competing firms and uses the average of their financial forecasts to create a report with a 'buy' recommendation. Smith does not mention the source of the data when she presents her analysis to Lee.<\/p><p>Smith next writes and publishes a report on Tollwood Industries. Smith posts the report on a social media platform that allows analysts to share their company research online. Since Smith does not receive any income or financial benefits from the social media platform, she does not disclose this action to Easy Street. A competing firm is impressed by the report and invites Smith to interview for a job. Smith accepts the invitation and updates her resume in preparation for the interview.<\/p><p>The head of Easy Street's investment banking division, Rin Tanaka, CFA, is currently working on a secondary equity issuance for a large client, Pivotal Manufacturing, Plc. Easy Street has a 'neutral' rating on Pivotal, and Tanaka asks Lee to consider changing it to a 'buy' rating. This would allow Pivotal to issue shares at a higher price which would benefit Pivotal and generate a higher fee for Easy Street. Lee agrees with Tanaka's rationale and makes the change.<\/p><p>Tanaka receives a job offer from one of Easy Street's largest competitors. Tanaka does not have a non-compete or non-solicit clause in her employment contract. She accepts the offer and resigns from Easy Street. After starting her new job, Tanaka learns that Pivotal is assessing a potential acquisition and decides to call the CFO of Pivotal to solicit the business for her new firm. Tanaka finds the CFO's phone number on Pivotal's website and wins the business.<\/p><\/div><\/details><div class=\"qtext\"><p>In preparing her report on Kimber, Smith violates the Standard(s) relating to:<\/p><\/div>", "subj": "ethics"}, {"n": 22, "q": "Do Smith's actions following the publication of the Tollwood report violate the Standard relating to loyalty to employers?", "opts": ["No", "Yes, with respect to posting the report on the website", "Yes, with respect to preparing to interview for a competing firm"], "ans": "B", "expl": "B is correct. because Standard IV(A): Duties to Employers - Loyalty states that Members and Candidates must act for the benefit of their employer and not deprive their employer of the advantage of their skills and abilities, divulge confidential information, or otherwise cause harm to their employer. The report was proprietary and posting the research report on the social media platform makes it publicly available and deprives Smith's employer of the advantage of her skills, violating Standard IV(A).", "explhtml": "<p><b>B is correct.<\/b> because Standard IV(A): Duties to Employers - Loyalty states that<\/p><p>Members and Candidates must act for the benefit of their employer and not deprive their employer of the advantage of their skills and abilities, divulge confidential information, or otherwise cause harm to their employer. The report was proprietary and posting the research report on the social media platform makes it publicly available and deprives Smith's employer of the advantage of her skills, violating Standard IV(A).<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Ethics · Daisy Lee<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Daisy Lee is the head of research at Easy Street Investments. The firm provides brokerage and research to fee-paying clients. Easy Street has adopted the Standards.<\/p><p>Alexa Smith has recently been hired as an analyst. Lee asks Smith to research Kimber Manufacturing. Smith obtains research reports published by several sell-side analysts at competing firms and uses the average of their financial forecasts to create a report with a 'buy' recommendation. Smith does not mention the source of the data when she presents her analysis to Lee.<\/p><p>Smith next writes and publishes a report on Tollwood Industries. Smith posts the report on a social media platform that allows analysts to share their company research online. Since Smith does not receive any income or financial benefits from the social media platform, she does not disclose this action to Easy Street. A competing firm is impressed by the report and invites Smith to interview for a job. Smith accepts the invitation and updates her resume in preparation for the interview.<\/p><p>The head of Easy Street's investment banking division, Rin Tanaka, CFA, is currently working on a secondary equity issuance for a large client, Pivotal Manufacturing, Plc. Easy Street has a 'neutral' rating on Pivotal, and Tanaka asks Lee to consider changing it to a 'buy' rating. This would allow Pivotal to issue shares at a higher price which would benefit Pivotal and generate a higher fee for Easy Street. Lee agrees with Tanaka's rationale and makes the change.<\/p><p>Tanaka receives a job offer from one of Easy Street's largest competitors. Tanaka does not have a non-compete or non-solicit clause in her employment contract. She accepts the offer and resigns from Easy Street. After starting her new job, Tanaka learns that Pivotal is assessing a potential acquisition and decides to call the CFO of Pivotal to solicit the business for her new firm. Tanaka finds the CFO's phone number on Pivotal's website and wins the business.<\/p><\/div><\/details><div class=\"qtext\"><p>Do Smith's actions following the publication of the Tollwood report violate the<\/p><p>Standard relating to loyalty to employers?<\/p><\/div>", "subj": "ethics"}, {"n": 23, "q": "When discussing Pivotal Manufacturing, the Standard relating to independence and objectivity is violated by:", "opts": ["Lee only.", "Tanaka only.", "both Lee and Tanaka."], "ans": "C", "expl": "C is correct. because Tanaka asking Lee to change the 'neutral' rating on Pivotal to a \"buy' rating and stating it would generate a higher fee for Easy Street is pressuring Lee to change her opinion on Pivotal and therefore violates Standard I(B) Independence and Objectivity. Standard I(B) states the responsibility of CFA Institute members and candidates in the CFA Program to maintain independence and objectivity so that their clients will have the benefit of their work and opinions unaffected by any potential conflict of interest or other circumstance adversely affecting their judgment. Every member and candidate should endeavor to avoid situations that could cause or be perceived to cause a loss of independence or objectivity in recommending investments or taking investment action.Lee also violates Standard I(B) by agreeing to change her recommendation solely based on the business reasons provided by Tanaka and not because of a change in her opinion of Pivotal. Lee's analysis of Pivotal must be objective and based solely on consideration of company fundamentals.", "explhtml": "<p><b>C is correct.<\/b> because Tanaka asking Lee to change the 'neutral' rating on Pivotal to a<\/p><p>\"buy' rating and stating it would generate a higher fee for Easy Street is pressuring Lee to change her opinion on Pivotal and therefore violates Standard I(B) Independence and Objectivity. Standard I(B) states the responsibility of CFA Institute members and candidates in the CFA Program to maintain independence and objectivity so that their clients will have the benefit of their work and opinions unaffected by any potential conflict of interest or other circumstance adversely affecting their judgment. Every member and candidate should endeavor to avoid situations that could cause or be perceived to cause a loss of independence or objectivity in recommending investments or taking investment action.Lee also violates Standard I(B) by agreeing to change her recommendation solely based on the business reasons provided by Tanaka and not because of a change in her opinion of Pivotal. Lee's analysis of Pivotal must be objective and based solely on consideration of company fundamentals.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Ethics · Daisy Lee<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Daisy Lee is the head of research at Easy Street Investments. The firm provides brokerage and research to fee-paying clients. Easy Street has adopted the Standards.<\/p><p>Alexa Smith has recently been hired as an analyst. Lee asks Smith to research Kimber Manufacturing. Smith obtains research reports published by several sell-side analysts at competing firms and uses the average of their financial forecasts to create a report with a 'buy' recommendation. Smith does not mention the source of the data when she presents her analysis to Lee.<\/p><p>Smith next writes and publishes a report on Tollwood Industries. Smith posts the report on a social media platform that allows analysts to share their company research online. Since Smith does not receive any income or financial benefits from the social media platform, she does not disclose this action to Easy Street. A competing firm is impressed by the report and invites Smith to interview for a job. Smith accepts the invitation and updates her resume in preparation for the interview.<\/p><p>The head of Easy Street's investment banking division, Rin Tanaka, CFA, is currently working on a secondary equity issuance for a large client, Pivotal Manufacturing, Plc. Easy Street has a 'neutral' rating on Pivotal, and Tanaka asks Lee to consider changing it to a 'buy' rating. This would allow Pivotal to issue shares at a higher price which would benefit Pivotal and generate a higher fee for Easy Street. Lee agrees with Tanaka's rationale and makes the change.<\/p><p>Tanaka receives a job offer from one of Easy Street's largest competitors. Tanaka does not have a non-compete or non-solicit clause in her employment contract. She accepts the offer and resigns from Easy Street. After starting her new job, Tanaka learns that Pivotal is assessing a potential acquisition and decides to call the CFO of Pivotal to solicit the business for her new firm. Tanaka finds the CFO's phone number on Pivotal's website and wins the business.<\/p><\/div><\/details><div class=\"qtext\"><p>When discussing Pivotal Manufacturing, the Standard relating to independence and<\/p><p>objectivity is violated by:<\/p><\/div>", "subj": "ethics"}, {"n": 24, "q": "Does Tanaka violate the Standards when she contacts the CFO of Pivotal?", "opts": ["No", "Yes, the Standard relating to loyalty to employers", "Yes, the Standard relating to preservation of confidentiality"], "ans": "A", "expl": "A is correct. because once an employee has left the firm, the skills and experience that an employee obtained while employed are not 'confidential' or 'privileged' information. Similarly, simple knowledge of the names and existence of former clients is generally not confidential information unless deemed such by an agreement or by law. Furthermore, Standard IV(A) does not prohibit experience or knowledge gained at one employer from being used at another employer. In addition, it is clear that Tanaka obtained the CFO's phone number from a public source rather than a confidential record held by Easy Street. Therefore, Tanaka has violated neither Standard IV(A): Duties to Employers - Loyalty nor Standard III(E): Duties to Clients - Preservation of Confidentiality.", "explhtml": "<p><b>A is correct.<\/b> because once an employee has left the firm, the skills and experience<\/p><p>that an employee obtained while employed are not 'confidential' or 'privileged' information. Similarly, simple knowledge of the names and existence of former clients is generally not confidential information unless deemed such by an agreement or by law. Furthermore, Standard IV(A) does not prohibit experience or knowledge gained at one employer from being used at another employer. In addition, it is clear that Tanaka obtained the CFO's phone number from a public source rather than a confidential record held by Easy Street. Therefore, Tanaka has violated neither Standard IV(A): Duties to Employers - Loyalty nor Standard III(E): Duties to Clients - Preservation of Confidentiality.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Ethics · Daisy Lee<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Daisy Lee is the head of research at Easy Street Investments. The firm provides brokerage and research to fee-paying clients. Easy Street has adopted the Standards.<\/p><p>Alexa Smith has recently been hired as an analyst. Lee asks Smith to research Kimber Manufacturing. Smith obtains research reports published by several sell-side analysts at competing firms and uses the average of their financial forecasts to create a report with a 'buy' recommendation. Smith does not mention the source of the data when she presents her analysis to Lee.<\/p><p>Smith next writes and publishes a report on Tollwood Industries. Smith posts the report on a social media platform that allows analysts to share their company research online. Since Smith does not receive any income or financial benefits from the social media platform, she does not disclose this action to Easy Street. A competing firm is impressed by the report and invites Smith to interview for a job. Smith accepts the invitation and updates her resume in preparation for the interview.<\/p><p>The head of Easy Street's investment banking division, Rin Tanaka, CFA, is currently working on a secondary equity issuance for a large client, Pivotal Manufacturing, Plc. Easy Street has a 'neutral' rating on Pivotal, and Tanaka asks Lee to consider changing it to a 'buy' rating. This would allow Pivotal to issue shares at a higher price which would benefit Pivotal and generate a higher fee for Easy Street. Lee agrees with Tanaka's rationale and makes the change.<\/p><p>Tanaka receives a job offer from one of Easy Street's largest competitors. Tanaka does not have a non-compete or non-solicit clause in her employment contract. She accepts the offer and resigns from Easy Street. After starting her new job, Tanaka learns that Pivotal is assessing a potential acquisition and decides to call the CFO of Pivotal to solicit the business for her new firm. Tanaka finds the CFO's phone number on Pivotal's website and wins the business.<\/p><\/div><\/details><div class=\"qtext\"><p>Does Tanaka violate the Standards when she contacts the CFO of Pivotal?<\/p><\/div>", "subj": "ethics"}, {"n": 25, "q": "Based on the pharmacy chain's normalized historical P/E ratio, as determined by Cox's chosen statistical measure, its stock is currently:", "opts": ["undervalued.", "fairly valued.", "overvalued."], "ans": "A", "expl": "A is correct. because, given the choice of a measure of central tendency that mitigates the impact of large and small outliers, the median P/E ratio of 11 (the middlemost value) is the appropriate value to use. Based on an EPS of $2, the justified price of the stock is $2 × 11 = $22, 10% above the current price of $20. The stock is undervalued by 10% based on this metric, which exceeds the company's 5% range within which the stock is considered to be fairly valued. Note that we are using the median rather than the mean value of the peer group's multiple to avoid distortions from outliers—an important issue when dealing with peer groups time frames that often consist of a small number of companies observations.", "explhtml": "<p><b>A is correct.<\/b> because, given the choice of a measure of central tendency that<\/p><p>mitigates the impact of large and small outliers, the median P/E ratio of 11 (the middlemost value) is the appropriate value to use. Based on an EPS of $2, the justified price of the stock is $2 × 11 = $22, 10% above the current price of $20. The stock is undervalued by 10% based on this metric, which exceeds the company's 5% range within which the stock is considered to be fairly valued. Note that we are using the median rather than the mean value of the peer group's multiple to avoid distortions from outliers—an important issue when dealing with peer groups time frames that often consist of a small number of companies observations.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Equity Valuation · Maria Cox<\/summary><div class=\"vig-body\"><p>Maria Cox is an analyst covering the healthcare sector for EX&amp; Partners, an investment management firm.<\/p><p>One of the companies that Cox follows is a small pharmacy chain. The company's stock is currently trading at $20 per share and its estimated EPS for the current year is $2.00. Cox considers the stock's current valuation relative to its own history. For her analysis, she gathers the company's annual P/E ratios for the last seven years: 2, 11, 11, 12, 3, 13, 12. Cox wants to calculate a normalized historical P/E ratio for her valuation and considers using the arithmetic mean or median. She chooses the measure of central tendency that mitigates the impact of large and small outliers. EX8 has a firm-wide policy whereby, if a stock price is within 5% of its estimated fair value or justified/benchmark multiple, it is considered to be fairly valued. Cox has identified two companies, Company A and Company B, that are working on late stages of drug development related to gene therapies. Cox determines how the stocks of the two companies compare based on the valuation information in Exhibit 1. As per EX8's policy for relative valuations, if two securities are within 5% of each other's estimated value, they are considered to be similarly valued.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-008.webp\" style=\"max-width:min(100%,226px)\" alt=\"Company Price EPS A $20 $2.00 $10 $1.10\"><p>Cox is reviewing a company that operates cosmetic surgery centers. The stock is currently trading at $200 per share and has a book value of $15.24 per share. Given the cyclical nature of the business, Cox determines that the normalized averages over the past five years are $6.00 for EPS and 34% for ROE. She determines the company's historical P/E ratio based on two approaches:<\/p><p>• Approach 1 is based on the average normalized EPS. • Approach 2 is based on the average normalized ROE.<\/p><p>Cox has identified three similar large-cap pharmaceutical companies of which she wants to recommend the most attractive stock. She believes that earnings growth will drive the stock prices of these companies in future years. Cox gathers relevant information on the three companies in Exhibit 2 in order to calculate their PEG ratio.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-009.webp\" style=\"max-width:min(100%,493px)\" alt=\"Company Forward P/E Ratio 5-Year EPS Growth Forecast (%) 1 14 7 2 8 3 3 9 5\"><\/div><\/details><div class=\"qtext\"><p>Based on the pharmacy chain's normalized historical P/E ratio, as determined by<\/p><p>Cox's chosen statistical measure, its stock is currently:<\/p><\/div>", "subj": "equity"}, {"n": 26, "q": "Based on the earnings yields of the gene therapy stocks, Cox should conclude that Company A is:", "opts": ["undervalued relative to Company B.", "similarly valued to Company B.", "overvalued relative to Company B."], "ans": "C", "expl": "C is correct. because: Earnings Yield (EY) = EPS/Price EYA = $2.00/$20 = 0.10 EУB = $1.10/$10 = 0.11 The inverse price ratio is earnings to price (E/P), known as the earnings yield. Ranked by earnings yield from highest to lowest, the securities are correctly ranked from cheapest to most costly in terms of the amount of earnings one unit of currency buys. Company B has a higher EY and the difference is 10%, which is outside the 5% range within which the stock would be considered to be fairly valued. Therefore, Company B is undervalued relative to Company A or, in other words, Company A is overvalued relative to Company B.", "explhtml": "<p><b>C is correct.<\/b> because:<\/p><p>Earnings Yield (EY) = EPS/Price EYA = $2.00/$20 = 0.10 EУB = $1.10/$10 = 0.11 The inverse price ratio is earnings to price (E/P), known as the earnings yield. Ranked by earnings yield from highest to lowest, the securities are correctly ranked from cheapest to most costly in terms of the amount of earnings one unit of currency buys. Company B has a higher EY and the difference is 10%, which is outside the 5% range within which the stock would be considered to be fairly valued. Therefore, Company B is undervalued relative to Company A or, in other words, Company A is overvalued relative to Company B.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Equity Valuation · Maria Cox<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Maria Cox is an analyst covering the healthcare sector for EX&amp; Partners, an investment management firm.<\/p><p>One of the companies that Cox follows is a small pharmacy chain. The company's stock is currently trading at $20
