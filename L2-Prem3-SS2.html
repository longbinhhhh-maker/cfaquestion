<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

<header>

arding Client 2?", "opts": ["No", "Yes, because she did not seek authorization from the compliance officer", "Yes, because the company has not yet publicly announced the name change"], "ans": "A", "expl": "A is correct. because the information became public betore the position wc icreased. As a result, there was no need to seek authorization trom the complianc office before increasing the position. Information is 'nonpublic' until it has been disseminated or is available to the marketplace in general (as opposed to a select group of investors). 'Disseminated' can be defined as 'made known.' For example, a company report of profits that is posted on the internet and distributed widely through a press release or accompanied by a filing has been effectively disseminated to the marketplace. Members and candidates must have a reasonable expectation that people have received the information before it can be considered public. It is not necessary, however, to wait for the slowest method of delivery. Once the information is disseminated to the market, it is public information that is no longer covered by this standard.", "explhtml": "<p><b>A is correct.<\/b> because the information became public betore the position wc<\/p><p>icreased. As a result, there was no need to seek authorization trom the complianc office before increasing the position. Information is 'nonpublic' until it has been disseminated or is available to the marketplace in general (as opposed to a select group of investors). 'Disseminated' can be defined as 'made known.' For example, a company report of profits that is posted on the internet and distributed widely through a press release or accompanied by a filing has been effectively disseminated to the marketplace. Members and candidates must have a reasonable expectation that people have received the information before it can be considered public. It is not necessary, however, to wait for the slowest method of delivery. Once the information is disseminated to the market, it is public information that is no longer covered by this standard.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Ethics · Juana Aguilar<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Juana Aguilar, CFA, is a portfolio manager at an investment firm. She is meeting with several discretionary clients, both individual and institutional.<\/p><p>Client 1 is a university endowment with an IPS that only permits investments in public equities and bonds. The endowment recently received a donation and the trustees would like to invest the donation in private credit. Aguilar believes private credit investments are risky and illiquid on their own but would provide diversification benefits in combination with the endowment's current portfolio. Aguilar adds private credit to the endowment's portfolio and will update the IPS at the next regularly scheduled meeting with the trustees.<\/p><p>Client 2 is the CEO of a multinational technology company. The company is headquartered in the same country where Aguilar resides and has shares listed in multiple jurisdictions. The company is planning to publicly announce a name change in a few days, which is expected to affect the company's stock price. During a meeting with Aguilar, the CEO is notified that a regulator in a foreign country mistakenly released the unannounced information about the upcoming name change to the public. The CEO shares this news with Aguilar and asks her to increase his position in the company's stock. Aguilar does this, without first contacting her compliance officer.<\/p><p>Client 3 sends Aguilar a text message complaining about how an excessive allocation to the banking sector has caused his portfolio to perform poorly. Aguilar sends a text back recommending they schedule a meeting. During their meeting, Aguilar and the client normmondins thau achodillo mostine Dinine thoin mostine darlilan aud tha dliont<\/p><p>review whether the IPS is still appropriate and whether the banking sector allocation is consistent with the IPS. The client acknowledges that the allocation is consistent with the current IPS, but continues to complain about the bank allocation and the performance of the portfolio. No changes are made to the IPS. Because the IPS was not revised, Aguilar does not keep a record of these communications with the client. Aguilar works closely with one of her firm's analysts, who is a CFA candidate. The analyst writes a report about a new investment strategy designed by the firm to outperform in an environment of rising interest rates. The report explains the characteristics of the strategy based on an expected increase in interest rates of 0.50%. News outlets are expecting this rate increase at the upcoming meeting of the monetary policy authority. The report does not explain how the strategy would perform if interest rates were to decrease. The report is released to Aguilar's clients.<\/p><\/div><\/details><div class=\"qtext\"><p>Did Aguilar violate the Standards in her actions regarding Client 2?<\/p><\/div>", "subj": "ethics"}, {"n": 3, "q": "Did Aguilar violate the Standards in her actions regarding Client 3?", "opts": ["No", "Yes, because she did not revise the IPS", "Yes, because she did not keep a record of the communications with Client 3"], "ans": "C", "expl": "C is correct. because Aguilar should keep a record of the meeting to review the IPS, but also of related communications even if in electronic form (e.g., text messages); particularly in this case, because the messages explain the nature of the client's continuing complaint. The responsibility to maintain records that support investment action generally falls with the firm rather than individuals. Members and candidates must, however, archive research notes and other documents, either electronically or in hard copy, that support their current investment-related communications. Notes from clients from meetings to review investment policy statements is an example of something that would require keeping records. Examples of non-print media formats that should be retained include, but are not limited to: e-mails, text messages.", "explhtml": "<p><b>C is correct.<\/b> because Aguilar should keep a record of the meeting to review the IPS,<\/p><p>but also of related communications even if in electronic form (e.g., text messages); particularly in this case, because the messages explain the nature of the client's continuing complaint. The responsibility to maintain records that support investment action generally falls with the firm rather than individuals. Members and candidates must, however, archive research notes and other documents, either electronically or in hard copy, that support their current investment-related communications. Notes from clients from meetings to review investment policy statements is an example of something that would require keeping records. Examples of non-print media formats that should be retained include, but are not limited to: e-mails, text messages.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Ethics · Juana Aguilar<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Juana Aguilar, CFA, is a portfolio manager at an investment firm. She is meeting with several discretionary clients, both individual and institutional.<\/p><p>Client 1 is a university endowment with an IPS that only permits investments in public equities and bonds. The endowment recently received a donation and the trustees would like to invest the donation in private credit. Aguilar believes private credit investments are risky and illiquid on their own but would provide diversification benefits in combination with the endowment's current portfolio. Aguilar adds private credit to the endowment's portfolio and will update the IPS at the next regularly scheduled meeting with the trustees.<\/p><p>Client 2 is the CEO of a multinational technology company. The company is headquartered in the same country where Aguilar resides and has shares listed in multiple jurisdictions. The company is planning to publicly announce a name change in a few days, which is expected to affect the company's stock price. During a meeting with Aguilar, the CEO is notified that a regulator in a foreign country mistakenly released the unannounced information about the upcoming name change to the public. The CEO shares this news with Aguilar and asks her to increase his position in the company's stock. Aguilar does this, without first contacting her compliance officer.<\/p><p>Client 3 sends Aguilar a text message complaining about how an excessive allocation to the banking sector has caused his portfolio to perform poorly. Aguilar sends a text back recommending they schedule a meeting. During their meeting, Aguilar and the client normmondins thau achodillo mostine Dinine thoin mostine darlilan aud tha dliont<\/p><p>review whether the IPS is still appropriate and whether the banking sector allocation is consistent with the IPS. The client acknowledges that the allocation is consistent with the current IPS, but continues to complain about the bank allocation and the performance of the portfolio. No changes are made to the IPS. Because the IPS was not revised, Aguilar does not keep a record of these communications with the client. Aguilar works closely with one of her firm's analysts, who is a CFA candidate. The analyst writes a report about a new investment strategy designed by the firm to outperform in an environment of rising interest rates. The report explains the characteristics of the strategy based on an expected increase in interest rates of 0.50%. News outlets are expecting this rate increase at the upcoming meeting of the monetary policy authority. The report does not explain how the strategy would perform if interest rates were to decrease. The report is released to Aguilar's clients.<\/p><\/div><\/details><div class=\"qtext\"><p>Did Aguilar violate the Standards in her actions regarding Client 3?<\/p><\/div>", "subj": "ethics"}, {"n": 4, "q": "Did the analyst violate the Standards in releasing the report about the firm's new investment strategy?", "opts": ["No", "Yes, because the report does not offer a proper description of the strategy", "Yes, because the reportdoes not distinguish between facts and opinions regarding the rate increase"], "ans": "B", "expl": "B is correct. because the report does not explain how the strategy would perform if interest rates decrease and thus fails to describe properly the basic characteristics of the actual and implied risks of the investment strategy, including how the structure was created and the degree to which leverage was embedded in the structure. The report should include a balanced discussion of how the strategy would perform in the case of rising as well as falling interest rates, preferably illustrating how the strategies might be expected to perform in the event of a reasonable variety of interest rate and credit risk-spread scenarios.", "explhtml": "<p><b>B is correct.<\/b> because the report does not explain how the strategy would perform if<\/p><p>interest rates decrease and thus fails to describe properly the basic characteristics of the actual and implied risks of the investment strategy, including how the structure was created and the degree to which leverage was embedded in the structure. The report should include a balanced discussion of how the strategy would perform in the case of rising as well as falling interest rates, preferably illustrating how the strategies might be expected to perform in the event of a reasonable variety of interest rate and credit risk-spread scenarios.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Ethics · Juana Aguilar<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Juana Aguilar, CFA, is a portfolio manager at an investment firm. She is meeting with several discretionary clients, both individual and institutional.<\/p><p>Client 1 is a university endowment with an IPS that only permits investments in public equities and bonds. The endowment recently received a donation and the trustees would like to invest the donation in private credit. Aguilar believes private credit investments are risky and illiquid on their own but would provide diversification benefits in combination with the endowment's current portfolio. Aguilar adds private credit to the endowment's portfolio and will update the IPS at the next regularly scheduled meeting with the trustees.<\/p><p>Client 2 is the CEO of a multinational technology company. The company is headquartered in the same country where Aguilar resides and has shares listed in multiple jurisdictions. The company is planning to publicly announce a name change in a few days, which is expected to affect the company's stock price. During a meeting with Aguilar, the CEO is notified that a regulator in a foreign country mistakenly released the unannounced information about the upcoming name change to the public. The CEO shares this news with Aguilar and asks her to increase his position in the company's stock. Aguilar does this, without first contacting her compliance officer.<\/p><p>Client 3 sends Aguilar a text message complaining about how an excessive allocation to the banking sector has caused his portfolio to perform poorly. Aguilar sends a text back recommending they schedule a meeting. During their meeting, Aguilar and the client normmondins thau achodillo mostine Dinine thoin mostine darlilan aud tha dliont<\/p><p>review whether the IPS is still appropriate and whether the banking sector allocation is consistent with the IPS. The client acknowledges that the allocation is consistent with the current IPS, but continues to complain about the bank allocation and the performance of the portfolio. No changes are made to the IPS. Because the IPS was not revised, Aguilar does not keep a record of these communications with the client. Aguilar works closely with one of her firm's analysts, who is a CFA candidate. The analyst writes a report about a new investment strategy designed by the firm to outperform in an environment of rising interest rates. The report explains the characteristics of the strategy based on an expected increase in interest rates of 0.50%. News outlets are expecting this rate increase at the upcoming meeting of the monetary policy authority. The report does not explain how the strategy would perform if interest rates were to decrease. The report is released to Aguilar's clients.<\/p><\/div><\/details><div class=\"qtext\"><p>Did the analyst violate the Standards in releasing the report about the firm's new<\/p><p>investment strategy?<\/p><\/div>", "subj": "ethics"}, {"n": 5, "q": "Based on the labor productivity growth accounting equation, the potential GDP growth rate of Country A is closest to:", "opts": ["2.1%.", "2.8%.", "3.2%."], "ans": "A", "expl": "A is correct. because the labor productivity growth accounting equation models potential GDP as a function of the labor input and the productivity of the labor input.Under this approach, the equation for estimating potential GDP is: Growth rate in potential GDP = Long-term growth rate of labor force + Long-term growth rate in labor productivity Growth rate of labor force is 0.5% Growth rate of labor productivity per worker is rising at 1.6% Potential GDP growth rate = 0.5% + 1.6% = 2.1%.", "explhtml": "<p><b>A is correct.<\/b> because the labor productivity growth accounting equation models<\/p><p>potential GDP as a function of the labor input and the productivity of the labor input.Under this approach, the equation for estimating potential GDP is:<\/p><p>Growth rate in potential GDP = Long-term growth rate of labor force + Long-term growth rate in labor productivity Growth rate of labor force is 0.5% Growth rate of labor productivity per worker is rising at 1.6% Potential GDP growth rate = 0.5% + 1.6% = 2.1%.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Economics · Michael Dodd<\/summary><div class=\"vig-body\"><p>Michael Dodd is the CIO of GrowGroup, an asset manager specializing in actively managed retail investment funds. Dodd analyzes three countries for potential investments.<\/p><p>Country A is a developed economy that has one of the highest capital-to-labor ratios in the world. Dodd calculates the potential GDP growth rate of Country A based on the labor productivity growth accounting equation and data presented in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-001.webp\" style=\"max-width:min(100%,364px)\" alt=\"|Growth in total factor productivity 0.7% Growth rate of capital 2.0% Growth rate of labor force 0.5% Growth rate of labor productivity 1.6%\"><p>Country A has set aside a large budget in fiscal spending to subsidize any business that increases expenditure on information and telecommunications equipment as well as cloud services which allow employees to get more closely connected and to be able to work remotely, from home.<\/p><p>Country B is a developing economy with a higher per capita growth rate than Country A but a much lower level of capital per worker. Dodd's long-term expectation is that Country B's per capita growth and investment returns will continue to exceed Country A's until Country B reaches its steady-state per capita income. Dodd believes that Country B will introduce appropriate trade policies and develop its legal, political, and economic institutions such that its per capita growth rate will eventually match that of Country A.<\/p><p>Dodd also evaluates Country C, a developed economy operating at its steady-state output-to-capital ratio. As part of his analysis, Dodd creates a scenario in which Country C's savings rate increases. He considers how this would impact its growth rate.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the labor productivity growth accounting equation, the potential GDP growth<\/p><p>rate of Country A is closest to:<\/p><\/div>", "subj": "economics"}, {"n": 6, "q": "Dodd's long-term expectation for Country B's per capita growth and investment returns most likely reflects:", "opts": ["club convergence.", "absolute convergence.", "conditional convergence."], "ans": "A", "expl": "A is correct. because Country B is a developing economy making the required institutional changes to ensure convergence. There is the notion of club convergence, where only rich and middle-income countries that are members of the club are converging to the income level of the world's richest countries. However, poor countries can join the club if they make appropriate institutional changes, (which Country B is assumed to be doing - as highlighted in the vignette - with appropriate trade policies and the development of legal, political, and economic institutions). Convergence means that the rate of growth of potential GDP should be higher in developing countries that have made the institutional changes that are a precondition for growth and that enable these countries to become members of the convergence club. Note that since Country B is a developing economy with a much lower level of capital per worker the two countries start with different capital-to-labor ratios, their growth rates will differ in the transition to the steady state. The economy with a lower capital-to-labor ratio (Country B) will experience more rapid growth of productivity and per capita income, but the differential will diminish until they finally converge. Countries with different saving rates or population growth rates and thus different steady-state values for capital per workler will have different steady-state levels of per capita income, but their growth rates of per capita output will still converge.", "explhtml": "<p><b>A is correct.<\/b> because Country B is a developing economy making the required<\/p><p>institutional changes to ensure convergence. There is the notion of club convergence, where only rich and middle-income countries that are members of the club are converging to the income level of the world's richest countries. However, poor countries can join the club if they make appropriate institutional changes, (which Country B is assumed to be doing - as highlighted in the vignette - with appropriate trade policies and the development of legal, political, and economic institutions). Convergence means that the rate of growth of potential GDP should be higher in developing countries that have made the institutional changes that are a precondition for growth and that enable these countries to become members of the convergence club. Note that since Country B is a developing economy with a much lower level of capital per worker the two countries start with different capital-to-labor ratios, their growth rates will differ in the transition to the steady state. The economy with a lower capital-to-labor ratio (Country B) will experience more rapid growth of productivity and per capita income, but the differential will diminish until they finally converge. Countries with different saving rates or population growth rates and thus different steady-state values for capital per workler will have different steady-state levels of per capita income, but their growth rates of per capita output will still converge.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Economics · Michael Dodd<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Michael Dodd is the CIO of GrowGroup, an asset manager specializing in actively managed retail investment funds. Dodd analyzes three countries for potential investments.<\/p><p>Country A is a developed economy that has one of the highest capital-to-labor ratios in the world. Dodd calculates the potential GDP growth rate of Country A based on the labor productivity growth accounting equation and data presented in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-001.webp\" style=\"max-width:min(100%,364px)\" alt=\"|Growth in total factor productivity 0.7% Growth rate of capital 2.0% Growth rate of labor force 0.5% Growth rate of labor productivity 1.6%\"><p>Country A has set aside a large budget in fiscal spending to subsidize any business that increases expenditure on information and telecommunications equipment as well as cloud services which allow employees to get more closely connected and to be able to work remotely, from home.<\/p><p>Country B is a developing economy with a higher per capita growth rate than Country A but a much lower level of capital per worker. Dodd's long-term expectation is that Country B's per capita growth and investment returns will continue to exceed Country A's until Country B reaches its steady-state per capita income. Dodd believes that Country B will introduce appropriate trade policies and develop its legal, political, and economic institutions such that its per capita growth rate will eventually match that of Country A.<\/p><p>Dodd also evaluates Country C, a developed economy operating at its steady-state output-to-capital ratio. As part of his analysis, Dodd creates a scenario in which Country C's savings rate increases. He considers how this would impact its growth rate.<\/p><\/div><\/details><div class=\"qtext\"><p>Dodd's long-term expectation for Country B's per capita growth and investment<\/p><p>returns most likely reflects:<\/p><\/div>", "subj": "economics"}, {"n": 7, "q": "Based on the endogenous growth theory, under Dodd's scenario Country C's growth rate would be expected to:", "opts": ["remain the same.", "temporarily increase.", "permanently increase."], "ans": "C", "expl": "C is correct. because growth per capita will be permanently higher due to an increase in savings under the endogenous growth theory than under the neoclassical growth theory. Unlike the neoclassical model, there are no diminishing marginal returns to capital for the economy as a whole under the endogenous growth theory. So increasing the saving rate permanently increases the rate of economic growth.", "explhtml": "<p><b>C is correct.<\/b> because growth per capita will be permanently higher due to an increase<\/p><p>in savings under the endogenous growth theory than under the neoclassical growth theory. Unlike the neoclassical model, there are no diminishing marginal returns to capital for the economy as a whole under the endogenous growth theory. So increasing the saving rate permanently increases the rate of economic growth.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Economics · Michael Dodd<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Michael Dodd is the CIO of GrowGroup, an asset manager specializing in actively managed retail investment funds. Dodd analyzes three countries for potential investments.<\/p><p>Country A is a developed economy that has one of the highest capital-to-labor ratios in the world. Dodd calculates the potential GDP growth rate of Country A based on the labor productivity growth accounting equation and data presented in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-001.webp\" style=\"max-width:min(100%,364px)\" alt=\"|Growth in total factor productivity 0.7% Growth rate of capital 2.0% Growth rate of labor force 0.5% Growth rate of labor productivity 1.6%\"><p>Country A has set aside a large budget in fiscal spending to subsidize any business that increases expenditure on information and telecommunications equipment as well as cloud services which allow employees to get more closely connected and to be able to work remotely, from home.<\/p><p>Country B is a developing economy with a higher per capita growth rate than Country A but a much lower level of capital per worker. Dodd's long-term expectation is that Country B's per capita growth and investment returns will continue to exceed Country A's until Country B reaches its steady-state per capita income. Dodd believes that Country B will introduce appropriate trade policies and develop its legal, political, and economic institutions such that its per capita growth rate will eventually match that of Country A.<\/p><p>Dodd also evaluates Country C, a developed economy operating at its steady-state output-to-capital ratio. As part of his analysis, Dodd creates a scenario in which Country C's savings rate increases. He considers how this would impact its growth rate.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the endogenous growth theory, under Dodd's scenario Country C's growth<\/p><p>rate would be expected to:<\/p><\/div>", "subj": "economics"}, {"n": 8, "q": "With its subsidies, Country A is most appropriate to stimulate growth through:", "opts": ["capital deepening.", "network externalities.", "government infrastructure investment."], "ans": "B", "expl": "B is correct. because the subsidies will lead to businesses buying and using more ICT equipment. The greater use of IT equipment in various industries has resulted in network externalities. Computers allow people to interconnect through the internet and by email, enabling them to work more productively. The more people in the network, the greater the potential productivity gains. The effects of the network externalities are largely captured in TFP rather than observed as a distinct, direct effect. The increased network externalities will improve TFP, which further stimulates growth.", "explhtml": "<p><b>B is correct.<\/b> because the subsidies will lead to businesses buying and using more ICT<\/p><p>equipment. The greater use of IT equipment in various industries has resulted in network externalities. Computers allow people to interconnect through the internet and by email, enabling them to work more productively. The more people in the network, the greater the potential productivity gains. The effects of the network externalities are largely captured in TFP rather than observed as a distinct, direct effect. The increased network externalities will improve TFP, which further stimulates growth.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Economics · Michael Dodd<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Michael Dodd is the CIO of GrowGroup, an asset manager specializing in actively managed retail investment funds. Dodd analyzes three countries for potential investments.<\/p><p>Country A is a developed economy that has one of the highest capital-to-labor ratios in the world. Dodd calculates the potential GDP growth rate of Country A based on the labor productivity growth accounting equation and data presented in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-001.webp\" style=\"max-width:min(100%,364px)\" alt=\"|Growth in total factor productivity 0.7% Growth rate of capital 2.0% Growth rate of labor force 0.5% Growth rate of labor productivity 1.6%\"><p>Country A has set aside a large budget in fiscal spending to subsidize any business that increases expenditure on information and telecommunications equipment as well as cloud services which allow employees to get more closely connected and to be able to work remotely, from home.<\/p><p>Country B is a developing economy with a higher per capita growth rate than Country A but a much lower level of capital per worker. Dodd's long-term expectation is that Country B's per capita growth and investment returns will continue to exceed Country A's until Country B reaches its steady-state per capita income. Dodd believes that Country B will introduce appropriate trade policies and develop its legal, political, and economic institutions such that its per capita growth rate will eventually match that of Country A.<\/p><p>Dodd also evaluates Country C, a developed economy operating at its steady-state output-to-capital ratio. As part of his analysis, Dodd creates a scenario in which Country C's savings rate increases. He considers how this would impact its growth rate.<\/p><\/div><\/details><div class=\"qtext\"><p>With its subsidies, Country A is most appropriate to stimulate growth through:<\/p><\/div>", "subj": "economics"}, {"n": 9, "q": "If Proposal 1 is implemented, Edington's current ratio will:", "opts": ["decrease.", "not change.", "increase."], "ans": "A", "expl": "A is correct. because a cash dividend would reduce the amount of cash held by the firm. The result is that current assets are lower, and so the current ratio will also be lower since current liabilities should remain unchanged. Cash dividends reduce assets (because cash is being paid out) and shareholders' equity (by reducing retained earnings). All else equal, liquidity ratios, such as the cash ratio (cash and short-term marketable securities divided by current liabilities) and current ratio (current assets divided by current liabilities), should decrease, reflecting the reduction in cash.", "explhtml": "<p><b>A is correct.<\/b> because a cash dividend would reduce the amount of cash held by the<\/p><p>firm. The result is that current assets are lower, and so the current ratio will also be lower since current liabilities should remain unchanged.<\/p><p>Cash dividends reduce assets (because cash is being paid out) and shareholders' equity (by reducing retained earnings). All else equal, liquidity ratios, such as the cash ratio (cash and short-term marketable securities divided by current liabilities) and current ratio (current assets divided by current liabilities), should decrease, reflecting the reduction in cash.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Corporate Issuers · Frieda Woden<\/summary><div class=\"vig-body\"><p>Frieda Woden, an equity analyst, is researching two manufacturing companies, Edington and Wareham. Both companies are located in the eurozone. Woden gathers data on Edington's stock in Exhibit 1. The company forecasts FCFE of €122 million for the current year.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-002.webp\" style=\"max-width:min(100%,362px)\" alt=\"Current share price €15.00 Book value per share €6.24 Number of shares outstanding 52.5 million\"><p>Edington has not paid any dividends since inception. However, in a recent conference call with analysts, company management indicated that they are considering the implementation of one of the following payout proposals before the end of the current year. All of the proposals would use surplus cash to make distributions to shareholders.<\/p><p>• Proposal 1: Pay a dividend of €1.60 per share • Proposal 2: Repurchase €84 million of shares at the current share price • Proposal 3: Pay €36 million in dividends and repurchase €48 million of shares at the current share price<\/p><p>Woden next evaluates Wareham. Company management recently announced that in the coming days Wareham will repurchase some of its shares at the current market price, using borrowed funds with an after-tax cost of capital of 12%. The company's forward P/E ratio is 9, based on the current market price and forecasted earnings for next year. Woden assesses the impact of the share repurchase on Wareham's forecasted EPS for next year.<\/p><\/div><\/details><div class=\"qtext\"><p>If Proposal 1 is implemented, Edington's current ratio will:<\/p><\/div>", "subj": "corporate"}, {"n": 10, "q": "If Proposal 2 is implemented, Edington's book value per share after the share repurchase will be closest to:", "opts": ["€5.19.", "€6.24.", "€6.99."], "ans": "A", "expl": "A is correct. because this figure accounts for all the factors relevant in calculating the new book value per share. Currently the number of shares outstanding is 52.5 million and the book value per share is €6.24, so the total book value of equity is: 52.5 million × €6.24 = €327.6 million. raleo elih sip be: en 7.u rchion - eha ms.i ton - ter the repurchase, the book If the shares are repurchased at the current price of €15, the number of shares purchased is: €84 million / €15 = 5.6 million shares. The total number of shares remaining after the repurchase is therefore: 52.5 million - 5.6 million = 46.9 million. The new book value per share is then: Book value / number of shares = €243.6 million / 46.9 million shares = €5.19 per share", "explhtml": "<p><b>A is correct.<\/b> because this figure accounts for all the factors relevant in calculating<\/p><p>the new book value per share. Currently the number of shares outstanding is 52.5 million and the book value per share is €6.24, so the total book value of equity is: 52.5 million × €6.24 = €327.6 million. raleo elih sip be: en 7.u rchion - eha ms.i ton - ter the repurchase, the book If the shares are repurchased at the current price of €15, the number of shares purchased is: €84 million / €15 = 5.6 million shares. The total number of shares remaining after the repurchase is therefore: 52.5 million - 5.6 million = 46.9 million. The new book value per share is then: Book value / number of shares = €243.6 million / 46.9 million shares = €5.19 per share<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Corporate Issuers · Frieda Woden<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Frieda Woden, an equity analyst, is researching two manufacturing companies, Edington and Wareham. Both companies are located in the eurozone. Woden gathers data on Edington's stock in Exhibit 1. The company forecasts FCFE of €122 million for the current year.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-002.webp\" style=\"max-width:min(100%,362px)\" alt=\"Current share price €15.00 Book value per share €6.24 Number of shares outstanding 52.5 million\"><p>Edington has not paid any dividends since inception. However, in a recent conference call with analysts, company management indicated that they are considering the implementation of one of the following payout proposals before the end of the current year. All of the proposals would use surplus cash to make distributions to shareholders.<\/p><p>• Proposal 1: Pay a dividend of €1.60 per share • Proposal 2: Repurchase €84 million of shares at the current share price • Proposal 3: Pay €36 million in dividends and repurchase €48 million of shares at the current share price<\/p><p>Woden next evaluates Wareham. Company management recently announced that in the coming days Wareham will repurchase some of its shares at the current market price, using borrowed funds with an after-tax cost of capital of 12%. The company's forward P/E ratio is 9, based on the current market price and forecasted earnings for next year. Woden assesses the impact of the share repurchase on Wareham's forecasted EPS for next year.<\/p><\/div><\/details><div class=\"qtext\"><p>If Proposal 2 is implemented, Edington's book value per share after the share<\/p><p>repurchase will be closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 11, "q": "If Proposal 3 is implemented, the FCFE coverage ratio based on the current-year forecast will be closest to:", "opts": ["1.5.", "2.5.", "3.4."], "ans": "A", "expl": "A is correct. because this is the accurate calculation of the FCFE coverage ratio. The FCFE coverage ratio is defined as: FCFE coverage ratio = FCFE / (Dividends + Share repurchases) FCFE = €122 million (provided in vignette) As the amounts paid out in dividends and share repurchases are €36 million and €48 million, respectively: FCFE coverage ratio = 122 / (36 + 48) = 122 / 84 = 1.4524 • 1.5", "explhtml": "<p><b>A is correct.<\/b> because this is the accurate calculation of the FCFE coverage ratio.<\/p><p>The FCFE coverage ratio is defined as: FCFE coverage ratio = FCFE / (Dividends + Share repurchases) FCFE = €122 million (provided in vignette) As the amounts paid out in dividends and share repurchases are €36 million and €48 million, respectively: FCFE coverage ratio = 122 / (36 + 48) = 122 / 84 = 1.4524 • 1.5<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Corporate Issuers · Frieda Woden<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Frieda Woden, an equity analyst, is researching two manufacturing companies, Edington and Wareham. Both companies are located in the eurozone. Woden gathers data on Edington's stock in Exhibit 1. The company forecasts FCFE of €122 million for the current year.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-002.webp\" style=\"max-width:min(100%,362px)\" alt=\"Current share price €15.00 Book value per share €6.24 Number of shares outstanding 52.5 million\"><p>Edington has not paid any dividends since inception. However, in a recent conference call with analysts, company management indicated that they are considering the implementation of one of the following payout proposals before the end of the current year. All of the proposals would use surplus cash to make distributions to shareholders.<\/p><p>• Proposal 1: Pay a dividend of €1.60 per share • Proposal 2: Repurchase €84 million of shares at the current share price • Proposal 3: Pay €36 million in dividends and repurchase €48 million of shares at the current share price<\/p><p>Woden next evaluates Wareham. Company management recently announced that in the coming days Wareham will repurchase some of its shares at the current market price, using borrowed funds with an after-tax cost of capital of 12%. The company's forward P/E ratio is 9, based on the current market price and forecasted earnings for next year. Woden assesses the impact of the share repurchase on Wareham's forecasted EPS for next year.<\/p><\/div><\/details><div class=\"qtext\"><p>If Proposal 3 is implemented, the FCFE coverage ratio based on the current-year<\/p><p>forecast will be closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 12, "q": "As a result of its share repurchase, Wareham's forecasted EPS for next year is most likely to:", "opts": ["decline.", "not change.", "increase."], "ans": "A", "expl": "A is correct. because the after-tax cost of the borrowing that finances the repurchase (12%) is greater than the earnings yield (11.11%). The earnings yield (based on forecasted EPS for next year) is the inverse of the forward P/E ratio: 1/9 = 0.1111= 11.11% Any after-tax borrowing rate above the earnings yield would result in a decline in EPS.", "explhtml": "<p><b>A is correct.<\/b> because the after-tax cost of the borrowing that finances the<\/p><p>repurchase (12%) is greater than the earnings yield (11.11%). The earnings yield (based on forecasted EPS for next year) is the inverse of the forward P/E ratio: 1/9 = 0.1111= 11.11% Any after-tax borrowing rate above the earnings yield would result in a decline in EPS.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Corporate Issuers · Frieda Woden<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Frieda Woden, an equity analyst, is researching two manufacturing companies, Edington and Wareham. Both companies are located in the eurozone. Woden gathers data on Edington's stock in Exhibit 1. The company forecasts FCFE of €122 million for the current year.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-002.webp\" style=\"max-width:min(100%,362px)\" alt=\"Current share price €15.00 Book value per share €6.24 Number of shares outstanding 52.5 million\"><p>Edington has not paid any dividends since inception. However, in a recent conference call with analysts, company management indicated that they are considering the implementation of one of the following payout proposals before the end of the current year. All of the proposals would use surplus cash to make distributions to shareholders.<\/p><p>• Proposal 1: Pay a dividend of €1.60 per share • Proposal 2: Repurchase €84 million of shares at the current share price • Proposal 3: Pay €36 million in dividends and repurchase €48 million of shares at the current share price<\/p><p>Woden next evaluates Wareham. Company management recently announced that in the coming days Wareham will repurchase some of its shares at the current market price, using borrowed funds with an after-tax cost of capital of 12%. The company's forward P/E ratio is 9, based on the current market price and forecasted earnings for next year. Woden assesses the impact of the share repurchase on Wareham's forecasted EPS for next year.<\/p><\/div><\/details><div class=\"qtext\"><p>As a result of its share repurchase, Wareham's forecasted EPS for next year is most<\/p><p>likely to:<\/p><\/div>", "subj": "corporate"}, {"n": 13, "q": "Based on her investment criteria, which of the following equity REITs is most suitable for Alvarez?", "opts": ["Retail", "Multi-family", "Industrial and warehouse"], "ans": "C", "expl": "C is correct. because the demand for industrial and warehouse space heavily depends on the overall strength of the economy and economic growth. The demand for warehouse space also depends on import and export activity in the economy. Individual (consumer) factors like personal income and consumer confidence do not affect demand for industrial and warehouse space, but rather the demand for multi-family, retail and hotel segments. Additionally, industrial leases are often long- term net leases, especially when the property is built specifically for the tenant. Long-term leases provide greater cash flow stability than short-term leases, especially when market-level rents are changing.", "explhtml": "<p><b>C is correct.<\/b> because the demand for industrial and warehouse space heavily depends<\/p><p>on the overall strength of the economy and economic growth. The demand for warehouse space also depends on import and export activity in the economy. Individual (consumer) factors like personal income and consumer confidence do not affect demand for industrial and warehouse space, but rather the demand for multi-family, retail and hotel segments. Additionally, industrial leases are often long- term net leases, especially when the property is built specifically for the tenant. Long-term leases provide greater cash flow stability than short-term leases, especially when market-level rents are changing.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Alternative Investments · Maria Alvarez<\/summary><div class=\"vig-body\"><p>Maria Alvarez is a portfolio manager at a mid-sized pension fund. Her portfolio is currently composed of stocks and bonds, and she is looking to diversify into real estate.<\/p><p>Alvarez considers investing in equity REITs. Her investment criteria for REITs include underlying property types that offer protection from short-term changes in market- level rents and whose demand would be favorably impacted by positive economic growth. She observes that business confidence remains high, as economists forecast moderately strong GDP growth for the next five years. Alvarez also notes that high levels of household debt have eroded personal income, which has negatively impacted consumer confidence.<\/p><p>Alvarez values REIT A using the data in Exhibit 1. She notes that the market capitalization rate for recent comparable transactions is 7%.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-003.webp\" style=\"max-width:min(100%,380px)\" alt=\"Last 12 months net operating income $70 million Net operating income growth assumption 1.5% Total debt $50 million Shares outstanding 0.5 million\"><p>Alvarez next validates her valuation of REIT A with a relative value measure that is based on both income (including the impact of leverage) and a universally accepted computation methodology. Alvarez also considers an investment in REIT B. As part of her valuation analysis, she calculates REIT B's FFO per share based on the data in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-004.webp\" style=\"max-width:min(100%,491px)\" alt=\"Net Income $27 million Depreciation and amortization $23 million Non-cash rent $5 million Recurring maintenance-type capital expenditures $6 million Loss from sale of real estate $3 million Shares outstanding 0.25 million\"><\/div><\/details><div class=\"qtext\"><p>Based on her investment criteria, which of the following equity REITs is most suitable<\/p><p>for Alvarez?<\/p><\/div>", "subj": "alternatives"}, {"n": 14, "q": "The NAV per share for REIT A is closestto:", "opts": ["$1,900.", "$1,930.", "$2,030."], "ans": "B", "expl": "B is correct. because by capitalizing the estimated next-12-month NOI with certain adjustments, the analyst obtains an estimate of the value of rental properties; then, the value of other tangible assets is added, and the total is netted of liabilities. This net amount, NAV, is then divided by the number of shares outstanding to obtain NAVPS. Estimated value of operating real estate = next-12-month cash NOl/capitalization rate = $71.05", "explhtml": "<p><b>B is correct.<\/b> because by capitalizing the estimated next-12-month NOI with certain<\/p><p>adjustments, the analyst obtains an estimate of the value of rental properties; then, the value of other tangible assets is added, and the total is netted of liabilities. This net amount, NAV, is then divided by the number of shares outstanding to obtain NAVPS.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2a-016.webp\" style=\"max-width:min(100%,526px)\" alt=\"Last-12-month real estate NOI $70 Next-12-month real estate NOl growth = 1.5% x $70 $1.05 Forecast next-12-month cash NOI $71.05\"><p>Estimated value of operating real estate = next-12-month cash NOl/capitalization rate = $71.05<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2a-017.webp\" style=\"max-width:min(100%,526px)\" alt=\"$1015 million/7% Less: total debt $50 NAV $965 NAVPS = S965 million / 500,000 shares $1930\">", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Alternative Investments · Maria Alvarez<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Maria Alvarez is a portfolio manager at a mid-sized pension fund. Her portfolio is currently composed of stocks and bonds, and she is looking to diversify into real estate.<\/p><p>Alvarez considers investing in equity REITs. Her investment criteria for REITs include underlying property types that offer protection from short-term changes in market- level rents and whose demand would be favorably impacted by positive economic growth. She observes that business confidence remains high, as economists forecast moderately strong GDP growth for the next five years. Alvarez also notes that high levels of household debt have eroded personal income, which has negatively impacted consumer confidence.<\/p><p>Alvarez values REIT A using the data in Exhibit 1. She notes that the market capitalization rate for recent comparable transactions is 7%.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-003.webp\" style=\"max-width:min(100%,380px)\" alt=\"Last 12 months net operating income $70 million Net operating income growth assumption 1.5% Total debt $50 million Shares outstanding 0.5 million\"><p>Alvarez next validates her valuation of REIT A with a relative value measure that is based on both income (including the impact of leverage) and a universally accepted computation methodology. Alvarez also considers an investment in REIT B. As part of her valuation analysis, she calculates REIT B's FFO per share based on the data in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-004.webp\" style=\"max-width:min(100%,491px)\" alt=\"Net Income $27 million Depreciation and amortization $23 million Non-cash rent $5 million Recurring maintenance-type capital expenditures $6 million Loss from sale of real estate $3 million Shares outstanding 0.25 million\"><\/div><\/details><div class=\"qtext\"><p>The NAV per share for REIT A is closestto:<\/p><\/div>", "subj": "alternatives"}, {"n": 15, "q": "Which of the following measures should Alvarez use when validating her valuation of REIT A?", "opts": ["Price-to-FFO", "EV-to-EBITDA DintAiAACEO", "Price-to-Adjusted FFO"], "ans": "A", "expl": "A is correct. because FFO and AFFO are based on net income available to equity and thus represent levered income. Furthermore, estimates of FFO are more frequently referenced measures, although analysts and investors will tend to base their investment judgments to a significant degree on their AFFO estimates. Firms that compile statistics and estimates of publicly traded enterprises for publications, such as Bloomberg and Refinitiv, tend not to gather AFFO estimates because of the absence of a universally accepted methodology for computing AFFO and inconsistent corporate reporting of actual AFFO figures, which hinders corroboration of analysts' estimates.", "explhtml": "<p><b>A is correct.<\/b> because FFO and AFFO are based on net income available to equity and<\/p><p>thus represent levered income. Furthermore, estimates of FFO are more frequently referenced measures, although analysts and investors will tend to base their investment judgments to a significant degree on their AFFO estimates. Firms that compile statistics and estimates of publicly traded enterprises for publications, such as Bloomberg and Refinitiv, tend not to gather AFFO estimates because of the absence of a universally accepted methodology for computing AFFO and inconsistent corporate reporting of actual AFFO figures, which hinders corroboration of analysts' estimates.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Alternative Investments · Maria Alvarez<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Maria Alvarez is a portfolio manager at a mid-sized pension fund. Her portfolio is currently composed of stocks and bonds, and she is looking to diversify into real estate.<\/p><p>Alvarez considers investing in equity REITs. Her investment criteria for REITs include underlying property types that offer protection from short-term changes in market- level rents and whose demand would be favorably impacted by positive economic growth. She observes that business confidence remains high, as economists forecast moderately strong GDP growth for the next five years. Alvarez also notes that high levels of household debt have eroded personal income, which has negatively impacted consumer confidence.<\/p><p>Alvarez values REIT A using the data in Exhibit 1. She notes that the market capitalization rate for recent comparable transactions is 7%.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-003.webp\" style=\"max-width:min(100%,380px)\" alt=\"Last 12 months net operating income $70 million Net operating income growth assumption 1.5% Total debt $50 million Shares outstanding 0.5 million\"><p>Alvarez next validates her valuation of REIT A with a relative value measure that is based on both income (including the impact of leverage) and a universally accepted computation methodology. Alvarez also considers an investment in REIT B. As part of her valuation analysis, she calculates REIT B's FFO per share based on the data in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-004.webp\" style=\"max-width:min(100%,491px)\" alt=\"Net Income $27 million Depreciation and amortization $23 million Non-cash rent $5 million Recurring maintenance-type capital expenditures $6 million Loss from sale of real estate $3 million Shares outstanding 0.25 million\"><\/div><\/details><div class=\"qtext\"><p>Which of the following measures should Alvarez use when validating her valuation of<\/p><p>REIT A?<\/p><\/div>", "subj": "alternatives"}, {"n": 16, "q": "The FFO per share for REIT B is closest to:", "opts": ["$168.", "$188.", "$212."], "ans": "C", "expl": "C is correct. because FFO attempts to approximate continuing operating performance. The more complete definition of FFO is as follows: net income (computed in accordance with GAAP) plus losses (minus gains) from sales of properties, plus depreciation and amortization related to real estate, plus real estate impairments and write-downs unrelated to depreciation.", "explhtml": "<p><b>C is correct.<\/b> because FFO attempts to approximate continuing operating performance.<\/p><p>The more complete definition of FFO is as follows: net income (computed in accordance with GAAP) plus losses (minus gains) from sales of properties, plus depreciation and amortization related to real estate, plus real estate impairments and write-downs unrelated to depreciation.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2a-018.webp\" style=\"max-width:min(100%,527px)\" alt=\"Net Income $27 Plus: Depreciation and amortization $23 Plus: Loss from sale of real estate $3 FFO $53 FFO per share = $53 million / 250,000 shares S212\">", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Alternative Investments · Maria Alvarez<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Maria Alvarez is a portfolio manager at a mid-sized pension fund. Her portfolio is currently composed of stocks and bonds, and she is looking to diversify into real estate.<\/p><p>Alvarez considers investing in equity REITs. Her investment criteria for REITs include underlying property types that offer protection from short-term changes in market- level rents and whose demand would be favorably impacted by positive economic growth. She observes that business confidence remains high, as economists forecast moderately strong GDP growth for the next five years. Alvarez also notes that high levels of household debt have eroded personal income, which has negatively impacted consumer confidence.<\/p><p>Alvarez values REIT A using the data in Exhibit 1. She notes that the market capitalization rate for recent comparable transactions is 7%.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-003.webp\" style=\"max-width:min(100%,380px)\" alt=\"Last 12 months net operating income $70 million Net operating income growth assumption 1.5% Total debt $50 million Shares outstanding 0.5 million\"><p>Alvarez next validates her valuation of REIT A with a relative value measure that is based on both income (including the impact of leverage) and a universally accepted computation methodology. Alvarez also considers an investment in REIT B. As part of her valuation analysis, she calculates REIT B's FFO per share based on the data in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-004.webp\" style=\"max-width:min(100%,491px)\" alt=\"Net Income $27 million Depreciation and amortization $23 million Non-cash rent $5 million Recurring maintenance-type capital expenditures $6 million Loss from sale of real estate $3 million Shares outstanding 0.25 million\"><\/div><\/details><div class=\"qtext\"><p>The FFO per share for REIT B is closest to:<\/p><\/div>", "subj": "alternatives"}, {"n": 17, "q": "Which of Estelle's geographical segments most likely has the highest sustainable sales growth?", "opts": ["Segment X", "Segment Y", "Segment Z"], "ans": "C", "expl": "C is correct. as Segment Z has the highest sustainable sales growth out of the three geographical segments. Segment Z's Sustainable Sales Growth = Contribution from Volume Growth + Contribution from Price Growth = 9% + 9% = 18%, which is higher than Segment X's 17% (5% + 12%), as well as Segment Y's 16% (10% + 6%). Arguably. growth in sales that comes from changes in volume or price is more sustainable than growth in sales that comes from changes in exchange rates. Further, management arguably has greater control over growth in sales resulting from greater volume or higher price than from changes in exchange rates.", "explhtml": "<p><b>C is correct.<\/b> as Segment Z has the highest sustainable sales growth out of the three<\/p><p>geographical segments. Segment Z's Sustainable Sales Growth = Contribution from Volume Growth + Contribution from Price Growth = 9% + 9% = 18%, which is higher than Segment X's 17% (5% + 12%), as well as Segment Y's 16% (10% + 6%). Arguably. growth in sales that comes from changes in volume or price is more sustainable than growth in sales that comes from changes in exchange rates. Further, management arguably has greater control over growth in sales resulting from greater volume or higher price than from changes in exchange rates.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Financial Statement Analysis · Alan Young<\/summary><div class=\"vig-body\"><p>Alan Young is the chief financial officer of Estelle S.A., a global luxury jeweler headquartered in Paris. Estelle reports under IFRS, and its functional and presentation currency is EUR. Young reviews a management report comparing Estelle's sales growth in different geographical segments, as shown i
