panies in Exhibit 2 in order to calculate their PEG ratio.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-009.webp\" style=\"max-width:min(100%,493px)\" alt=\"Company Forward P/E Ratio 5-Year EPS Growth Forecast (%) 1 14 7 2 8 3 3 9 5\"><\/div><\/details><div class=\"qtext\"><p>Based on the earnings yields of the gene therapy stocks, Cox should conclude that<\/p><p>Company A is:<\/p><\/div>", "subj": "equity"}, {"n": 27, "q": "The cosmetic surgery center company's historical P/E ratio under Approach 1 is:", "opts": ["lower than that under Approach 2.", "the same as that under Approach 2.", "higher than that under Approach 2."], "ans": "A", "expl": "A is correct. because: P/E = $200/$6 = 33.33 under Approach 1 (based on average normalized EPS) P/E =Price/EPS, where EPS = BVPS × ROE = ($15.24)(0.34) = $5.1816 P/E = $200/$5.1816 = 38.60 under Approach 2 (based on average normalized ROE) As shown in the calculations above, the P/E ratio under the ROE method is higher. The stock is more expensive under the ROE method than under the EPS method", "explhtml": "<p><b>A is correct.<\/b> because:<\/p><p>P/E = $200/$6 = 33.33 under Approach 1 (based on average normalized EPS) P/E =Price/EPS, where EPS = BVPS × ROE = ($15.24)(0.34) = $5.1816 P/E = $200/$5.1816 = 38.60 under Approach 2 (based on average normalized ROE) As shown in the calculations above, the P/E ratio under the ROE method is higher. The stock is more expensive under the ROE method than under the EPS method<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Equity Valuation · Maria Cox<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Maria Cox is an analyst covering the healthcare sector for EX&amp; Partners, an investment management firm.<\/p><p>One of the companies that Cox follows is a small pharmacy chain. The company's stock is currently trading at $20 per share and its estimated EPS for the current year is $2.00. Cox considers the stock's current valuation relative to its own history. For her analysis, she gathers the company's annual P/E ratios for the last seven years: 2, 11, 11, 12, 3, 13, 12. Cox wants to calculate a normalized historical P/E ratio for her valuation and considers using the arithmetic mean or median. She chooses the measure of central tendency that mitigates the impact of large and small outliers. EX8 has a firm-wide policy whereby, if a stock price is within 5% of its estimated fair value or justified/benchmark multiple, it is considered to be fairly valued. Cox has identified two companies, Company A and Company B, that are working on late stages of drug development related to gene therapies. Cox determines how the stocks of the two companies compare based on the valuation information in Exhibit 1. As per EX8's policy for relative valuations, if two securities are within 5% of each other's estimated value, they are considered to be similarly valued.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-008.webp\" style=\"max-width:min(100%,226px)\" alt=\"Company Price EPS A $20 $2.00 $10 $1.10\"><p>Cox is reviewing a company that operates cosmetic surgery centers. The stock is currently trading at $200 per share and has a book value of $15.24 per share. Given the cyclical nature of the business, Cox determines that the normalized averages over the past five years are $6.00 for EPS and 34% for ROE. She determines the company's historical P/E ratio based on two approaches:<\/p><p>• Approach 1 is based on the average normalized EPS. • Approach 2 is based on the average normalized ROE.<\/p><p>Cox has identified three similar large-cap pharmaceutical companies of which she wants to recommend the most attractive stock. She believes that earnings growth will drive the stock prices of these companies in future years. Cox gathers relevant information on the three companies in Exhibit 2 in order to calculate their PEG ratio.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-009.webp\" style=\"max-width:min(100%,493px)\" alt=\"Company Forward P/E Ratio 5-Year EPS Growth Forecast (%) 1 14 7 2 8 3 3 9 5\"><\/div><\/details><div class=\"qtext\"><p>The cosmetic surgery center company's historical P/E ratio under Approach 1 is:<\/p><\/div>", "subj": "equity"}, {"n": 28, "q": "Based on the PEG ratio, which large-cap pharmaceutical stock is the most attractive?", "opts": ["Company 1", "Company 2", "Company 3"], "ans": "C", "expl": "C is correct. because Company 3 has the lowest PEG ratio. Based on this metric and Cox's belief that earnings growth will drive stock prices, Company 3 is the most attractive. PEG = (P/E Ratio) / (EPS Growth) PEG for Company 1= 14/7 = 2.0 PEG for Company 2 = 8/3 = 2.7 PEG for Company 3 = 9/5 = 1.8 The PEG ratio is calculated as the stock's P/E divided by the expected earnings onnwth nnto (in noncontano tonmd) Tho natin in offort icaaalaulatinn of n etark'e growth rate (in percentage terms). The ratio, in effect, is a calculation of a stock's P/E per percentage point of expected growth. Stocks with lower PEG ratios are more attractive than stocks with higher PEG ratios, all else being equal.", "explhtml": "<p><b>C is correct.<\/b> because Company 3 has the lowest PEG ratio. Based on this metric and<\/p><p>Cox's belief that earnings growth will drive stock prices, Company 3 is the most attractive. PEG = (P/E Ratio) / (EPS Growth) PEG for Company 1= 14/7 = 2.0 PEG for Company 2 = 8/3 = 2.7 PEG for Company 3 = 9/5 = 1.8 The PEG ratio is calculated as the stock's P/E divided by the expected earnings onnwth nnto (in noncontano tonmd) Tho natin in offort icaaalaulatinn of n etark'e growth rate (in percentage terms). The ratio, in effect, is a calculation of a stock's P/E per percentage point of expected growth. Stocks with lower PEG ratios are more attractive than stocks with higher PEG ratios, all else being equal.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Equity Valuation · Maria Cox<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Maria Cox is an analyst covering the healthcare sector for EX&amp; Partners, an investment management firm.<\/p><p>One of the companies that Cox follows is a small pharmacy chain. The company's stock is currently trading at $20 per share and its estimated EPS for the current year is $2.00. Cox considers the stock's current valuation relative to its own history. For her analysis, she gathers the company's annual P/E ratios for the last seven years: 2, 11, 11, 12, 3, 13, 12. Cox wants to calculate a normalized historical P/E ratio for her valuation and considers using the arithmetic mean or median. She chooses the measure of central tendency that mitigates the impact of large and small outliers. EX8 has a firm-wide policy whereby, if a stock price is within 5% of its estimated fair value or justified/benchmark multiple, it is considered to be fairly valued. Cox has identified two companies, Company A and Company B, that are working on late stages of drug development related to gene therapies. Cox determines how the stocks of the two companies compare based on the valuation information in Exhibit 1. As per EX8's policy for relative valuations, if two securities are within 5% of each other's estimated value, they are considered to be similarly valued.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-008.webp\" style=\"max-width:min(100%,226px)\" alt=\"Company Price EPS A $20 $2.00 $10 $1.10\"><p>Cox is reviewing a company that operates cosmetic surgery centers. The stock is currently trading at $200 per share and has a book value of $15.24 per share. Given the cyclical nature of the business, Cox determines that the normalized averages over the past five years are $6.00 for EPS and 34% for ROE. She determines the company's historical P/E ratio based on two approaches:<\/p><p>• Approach 1 is based on the average normalized EPS. • Approach 2 is based on the average normalized ROE.<\/p><p>Cox has identified three similar large-cap pharmaceutical companies of which she wants to recommend the most attractive stock. She believes that earnings growth will drive the stock prices of these companies in future years. Cox gathers relevant information on the three companies in Exhibit 2 in order to calculate their PEG ratio.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-009.webp\" style=\"max-width:min(100%,493px)\" alt=\"Company Forward P/E Ratio 5-Year EPS Growth Forecast (%) 1 14 7 2 8 3 3 9 5\"><\/div><\/details><div class=\"qtext\"><p>Based on the PEG ratio, which large-cap pharmaceutical stock is the most attractive?<\/p><\/div>", "subj": "equity"}, {"n": 29, "q": "The no-arbitrage value (in EUR) of the Watercolor put option is closest to:", "opts": ["6.50.", "11.90.", "17.38."], "ans": "A", "expl": "A is correct. because either the expectations approach or the no-arbitrage approach can be used to calculate the no-arbitrage value of the single-period put option. The expectations approach p = PV [пp+ + (1-т)p-] Where i is the risk-neutral probability and it is determined from the expectations approach model, not a true probability of up and down movements of the underlying. The current stock price S = EUR 85 The put option exercise price X = EUR 80 The estimated up factor is 1.25 (u) and down factor is 0.80 (d) The risk-free (Rf) interest rate 0.50% Up outcome: S+ = S * u = 85 * 1.25 = 106.25 Down outcome: S- = S * d = 85 * 0.80 = 68 Put option price when up happens p+ = Max (0, X - S+) = Max (0, 80 - 106.25) = 0 Put option prices when down happens p- = Max (0, X - S-) = Max (0,80-68) = 12 Then, the risk neutral probability of an up movement is: TT = [FV (1) - dJ/(u-d) = (1.005 - 0.80)/(1.25-0.80) = 0.4556 where, FV(1) = 1* (1+Rf)^1 = 1*(1+0.005)^1 = 1.005 The value of the put option is: p = PV [пp+ + (1-п)p-] p = 1/1.005 [0.4556 * 0 + (1-0.4556) * 12] p = 1/1.005 * 0.5444*12 = 6.5003 The no-arbitrage approach p = hS + PV(-h5-+p-) or equivalently. p = h5 + PV(-h5++p+) Applying this method of valuation requires calculation of h besides the pt or p- and the 5t or 5- h defines the hedge ratio or the number of unit of underlying need to replicate or hedge a position on options. h = (p+ - p- )/(S+ - S-) = (0 - 12) / (106.25 - 68) = -0.3137 p= -0.3137 * 85 + 1/1.005 * (0.3137 * 68 + 12) = 6.5013", "explhtml": "<p><b>A is correct.<\/b> because either the expectations approach or the no-arbitrage approach<\/p><p>can be used to calculate the no-arbitrage value of the single-period put option. The expectations approach p = PV [пp+ + (1-т)p-] Where i is the risk-neutral probability and it is determined from the expectations approach model, not a true probability of up and down movements of the underlying. The current stock price S = EUR 85 The put option exercise price X = EUR 80 The estimated up factor is 1.25 (u) and down factor is 0.80 (d) The risk-free (Rf) interest rate 0.50% Up outcome: S+ = S * u = 85 * 1.25 = 106.25 Down outcome: S- = S * d = 85 * 0.80 = 68 Put option price when up happens p+ = Max (0, X - S+) = Max (0, 80 - 106.25) = 0 Put option prices when down happens p- = Max (0, X - S-) = Max (0,80-68) = 12 Then, the risk neutral probability of an up movement is: TT = [FV (1) - dJ/(u-d) = (1.005 - 0.80)/(1.25-0.80) = 0.4556 where, FV(1) = 1* (1+Rf)^1 = 1*(1+0.005)^1 = 1.005 The value of the put option is: p = PV [пp+ + (1-п)p-] p = 1/1.005 [0.4556 * 0 + (1-0.4556) * 12] p = 1/1.005 * 0.5444*12 = 6.5003 The no-arbitrage approach p = hS + PV(-h5-+p-) or equivalently. p = h5 + PV(-h5++p+) Applying this method of valuation requires calculation of h besides the pt or p- and the 5t or 5- h defines the hedge ratio or the number of unit of underlying need to replicate or hedge a position on options. h = (p+ - p- )/(S+ - S-) = (0 - 12) / (106.25 - 68) = -0.3137 p= -0.3137 * 85 + 1/1.005 * (0.3137 * 68 + 12) = 6.5013<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Derivatives · Steven Kramer<\/summary><div class=\"vig-body\"><p>Steven Kramer is the head of the equity derivates trading at Pichon Investments. He is reviewing some potential trades as well as existing positions.<\/p><p>Kramer first calculates the no-arbitrage value of a 1-year European-style put option on Watercolor Inc, a non-dividend-paying stock. For the valuation he uses the binomial model with the following inputs:<\/p><p>• current stock price is EUR 85 • exercise price is EUR 80 • estimated one-year up factor is 1.25 and estimated one-year down factor is 0.80 • risk-free interest rate is 0.50% Kramer considers the following three assumptions regarding option pricing models:<\/p><p>• Assumption 1: there are no market frictions, such as transaction costs and taxes • Assumption 2: the price of the underlying instrument does not jump from one value to another • Assumption 3: short selling of the underlying instrument is allowed, with full use of the proceeds<\/p><p>He considers which of these assumptions apply to either the binomial model or the Black- Scholes-Merton (BSM) model. Kramer uses the BSM model to assess an European-style call option of Dynamics Inc. Using the data in Exhibit 1, he determines the initial trades which would replicate the no-arbitrage payoffs if he bought the call option.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-010.webp\" style=\"max-width:min(100%,157px)\" alt=\"N(di) 0.651 N(d2) 0.555 N(-d1) 0.349 N(-d2) 0.445\"><p>Nine-months ago, Kramer entered a 3-year equity swap with annual reset dates. The notional amount is EUR 15 million. Under the swap he receives the return on an equity index in exchange for paying a fixed rate of 0.50%. At origination the equity index was trading at 14,500. It is currently trading at 14,585. The relevant interest rate present value (PV) factors by maturity are shown in Exhibit 2.<\/p><p><b>Exhibit 2:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-011.webp\" style=\"max-width:min(100%,232px)\" alt=\"Maturity (years) PV Factors 0.25 0.999375 1.25 0.995644 2.25 0.991080\"><\/div><\/details><div class=\"qtext\"><p>The no-arbitrage value (in EUR) of the Watercolor put option is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 30, "q": "Which of the assumptions considered by Kramer applies to the BSM model but not to the binomial model?", "opts": ["Assumption 1", "Assumption 2", "Assumption 3"], "ans": "B", "expl": "B is correct. because only this assumption is a specific assumption of the Black- Scholes-Merton (BSM) model. The BSM model is based on the assumption that the underlying follows a statistical process called geometric Brownian motion which implies continuous prices meaning that the prices of underlying instrument does not jump from one value to another; rather, it moves smoothly from value to value. This assumption of continuous pricing and smooth change in prices is not specific to other models which have discrete changes in prices, from period to period. For example, the binomial option valuation model is a multi-period option valuation model which means that the price of the underlying changes from one period to the next along a binomial lattice.", "explhtml": "<p><b>B is correct.<\/b> because only this assumption is a specific assumption of the Black-<\/p><p>Scholes-Merton (BSM) model. The BSM model is based on the assumption that the underlying follows a statistical process called geometric Brownian motion which implies continuous prices meaning that the prices of underlying instrument does not jump from one value to another; rather, it moves smoothly from value to value. This assumption of continuous pricing and smooth change in prices is not specific to other models which have discrete changes in prices, from period to period. For example, the binomial option valuation model is a multi-period option valuation model which means that the price of the underlying changes from one period to the next along a binomial lattice.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Derivatives · Steven Kramer<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Steven Kramer is the head of the equity derivates trading at Pichon Investments. He is reviewing some potential trades as well as existing positions.<\/p><p>Kramer first calculates the no-arbitrage value of a 1-year European-style put option on Watercolor Inc, a non-dividend-paying stock. For the valuation he uses the binomial model with the following inputs:<\/p><p>• current stock price is EUR 85 • exercise price is EUR 80 • estimated one-year up factor is 1.25 and estimated one-year down factor is 0.80 • risk-free interest rate is 0.50% Kramer considers the following three assumptions regarding option pricing models:<\/p><p>• Assumption 1: there are no market frictions, such as transaction costs and taxes • Assumption 2: the price of the underlying instrument does not jump from one value to another • Assumption 3: short selling of the underlying instrument is allowed, with full use of the proceeds<\/p><p>He considers which of these assumptions apply to either the binomial model or the Black- Scholes-Merton (BSM) model. Kramer uses the BSM model to assess an European-style call option of Dynamics Inc. Using the data in Exhibit 1, he determines the initial trades which would replicate the no-arbitrage payoffs if he bought the call option.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-010.webp\" style=\"max-width:min(100%,157px)\" alt=\"N(di) 0.651 N(d2) 0.555 N(-d1) 0.349 N(-d2) 0.445\"><p>Nine-months ago, Kramer entered a 3-year equity swap with annual reset dates. The notional amount is EUR 15 million. Under the swap he receives the return on an equity index in exchange for paying a fixed rate of 0.50%. At origination the equity index was trading at 14,500. It is currently trading at 14,585. The relevant interest rate present value (PV) factors by maturity are shown in Exhibit 2.<\/p><p><b>Exhibit 2:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-011.webp\" style=\"max-width:min(100%,232px)\" alt=\"Maturity (years) PV Factors 0.25 0.999375 1.25 0.995644 2.25 0.991080\"><\/div><\/details><div class=\"qtext\"><p>Which of the assumptions considered by Kramer applies to the BSM model but not to<\/p><p>the binomial model?<\/p><\/div>", "subj": "derivatives"}, {"n": 31, "q": "To replicate the payoffs to a buyer of a European-style call option on Dynamics, the initial trades are:", "opts": ["buy 0.349 shares of Dynamics stock and short sell 0.555 shares of risk- free zero-coupon bonds. DILAALEIAIAN", "buy 0.651 shares of Dynamics stock and short sell 0.555 shares of risk-", "buy 0.651 shares of Dynamics stock and short sell 0.445 shares of risk-free zero- coupon bonds."], "ans": "B", "expl": "B is correct. because the BSM model can be described as the present value of the expected option payoff at expiration and as having two components: a stock component (the underlying of the option) and a bond component (a financing component). To replicate the payoffs of a buyer of European-style call option, these components are: (i) stock component: N(d1)S for the underlying, meaning N(dl) represents the shares of underlying to buy, and (ii) bond component: -N(d2)e-rTX, where-N(d2) represents the financing component, meaning the shares of zero-coupon bonds shorted at the risk-free rate to finance the purchase of underlying. c = SN(d1) - e-rTXN(d2) where; S = spot price of underlying N(x) = standard normal cumulative distribution functions e-rT = the present value term (r = risk-free rate continuously compounded, T= time) X = strike price of the underlying Replicating strategy cost for both calls and puts = n55 + nBB, where n represents the shares of stocks or bonds bought/short sold to replicate the value of an option. In the case of calls the equivalent number of underlying shares is nS= N(dl) and it is positive, so shares mush be bought and the equivalent number of bonds is nB=-N(d2) and it is negative, so bonds must be sold short to replicate the value of a call option. To replicate the position of a long call, 0.651 shares of stock must be bought and 0.555 shares of risk-free zero-coupon bond must be sold short.", "explhtml": "<p><b>B is correct.<\/b> because the BSM model can be described as the present value of the<\/p><p>expected option payoff at expiration and as having two components: a stock component (the underlying of the option) and a bond component (a financing component). To replicate the payoffs of a buyer of European-style call option, these components are: (i) stock component: N(d1)S for the underlying, meaning N(dl) represents the shares of underlying to buy, and (ii) bond component: -N(d2)e-rTX, where-N(d2) represents the financing component, meaning the shares of zero-coupon bonds shorted at the risk-free rate to finance the purchase of underlying. c = SN(d1) - e-rTXN(d2) where; S = spot price of underlying N(x) = standard normal cumulative distribution functions e-rT = the present value term (r = risk-free rate continuously compounded, T= time) X = strike price of the underlying Replicating strategy cost for both calls and puts = n55 + nBB, where n represents the shares of stocks or bonds bought/short sold to replicate the value of an option. In the case of calls the equivalent number of underlying shares is nS= N(dl) and it is positive, so shares mush be bought and the equivalent number of bonds is nB=-N(d2) and it is negative, so bonds must be sold short to replicate the value of a call option. To replicate the position of a long call, 0.651 shares of stock must be bought and 0.555 shares of risk-free zero-coupon bond must be sold short.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Derivatives · Steven Kramer<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Steven Kramer is the head of the equity derivates trading at Pichon Investments. He is reviewing some potential trades as well as existing positions.<\/p><p>Kramer first calculates the no-arbitrage value of a 1-year European-style put option on Watercolor Inc, a non-dividend-paying stock. For the valuation he uses the binomial model with the following inputs:<\/p><p>• current stock price is EUR 85 • exercise price is EUR 80 • estimated one-year up factor is 1.25 and estimated one-year down factor is 0.80 • risk-free interest rate is 0.50% Kramer considers the following three assumptions regarding option pricing models:<\/p><p>• Assumption 1: there are no market frictions, such as transaction costs and taxes • Assumption 2: the price of the underlying instrument does not jump from one value to another • Assumption 3: short selling of the underlying instrument is allowed, with full use of the proceeds<\/p><p>He considers which of these assumptions apply to either the binomial model or the Black- Scholes-Merton (BSM) model. Kramer uses the BSM model to assess an European-style call option of Dynamics Inc. Using the data in Exhibit 1, he determines the initial trades which would replicate the no-arbitrage payoffs if he bought the call option.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-010.webp\" style=\"max-width:min(100%,157px)\" alt=\"N(di) 0.651 N(d2) 0.555 N(-d1) 0.349 N(-d2) 0.445\"><p>Nine-months ago, Kramer entered a 3-year equity swap with annual reset dates. The notional amount is EUR 15 million. Under the swap he receives the return on an equity index in exchange for paying a fixed rate of 0.50%. At origination the equity index was trading at 14,500. It is currently trading at 14,585. The relevant interest rate present value (PV) factors by maturity are shown in Exhibit 2.<\/p><p><b>Exhibit 2:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-011.webp\" style=\"max-width:min(100%,232px)\" alt=\"Maturity (years) PV Factors 0.25 0.999375 1.25 0.995644 2.25 0.991080\"><\/div><\/details><div class=\"qtext\"><p>To replicate the payoffs to a buyer of a European-style call option on Dynamics, the<\/p><p>initial trades are:<\/p><\/div>", "subj": "derivatives"}, {"n": 32, "q": "From Kramer's perspective, the no-arbitrage value (in EUR) of the equity swap is closest to:", "opts": ["-177,576.", "-136,026.", "-2,226."], "ans": "C", "expl": "C is correct. because the no-arbitrage value of the equity swap at time t after initiation can be calculated as: VEQ,t = VFIX (CO) - St/St-1)NAE - PV(Par - NAE) Where; VFIX (CO) = the value at Time t of a fixed-rate bond initiated with coupon CO at Time 0 St = the current equity index price St-1 = the equity price observed at the last reset date PV O = the present value function from the swap maturity date to Time t Par = the notional amount (face value of a bond that would pay the fixed-rate) NAE = the notional amount used for calculations of return on the equity The swap was entered nine-months ago so the fair value of the swap is determined by comparing the present value of the implied fixed-rate bond with the return on the equity index. The fixed swap rate was 0.50% and the notional amount is EUR 15 million, so the annual fixed cash flow is 0.50% * 15,000,000 = 75,000. The value of the equity leg is 14,585 / 14,500 * 15,000,000 = 15,087,931.03 Since Kramer is the fixed rate payer, the value of the swap is: 15,087,931.03 - 15,090,157.43 = -2,226.40", "explhtml": "<p><b>C is correct.<\/b> because the no-arbitrage value of the equity swap at time t after<\/p><p>initiation can be calculated as: VEQ,t = VFIX (CO) - St/St-1)NAE - PV(Par - NAE) Where; VFIX (CO) = the value at Time t of a fixed-rate bond initiated with coupon CO at Time 0 St = the current equity index price St-1 = the equity price observed at the last reset date PV O = the present value function from the swap maturity date to Time t Par = the notional amount (face value of a bond that would pay the fixed-rate) NAE = the notional amount used for calculations of return on the equity The swap was entered nine-months ago so the fair value of the swap is determined by comparing the present value of the implied fixed-rate bond with the return on the equity index. The fixed swap rate was 0.50% and the notional amount is EUR 15 million, so the annual fixed cash flow is 0.50% * 15,000,000 = 75,000.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2a-019.webp\" style=\"max-width:min(100%,536px)\" alt=\"Maturity (years) PV Factors Fixed cash flow PV of fixed cash flow 0.25 0.999375 75,000 74,953.13 1.25 0.995644 75,000 74,673.30 2.25 0.991080 15,075,000 14,940,531.00 TOTAL 15,090,157.43\"><p>The value of the equity leg is 14,585 / 14,500 * 15,000,000 = 15,087,931.03 Since Kramer is the fixed rate payer, the value of the swap is: 15,087,931.03 - 15,090,157.43 = -2,226.40<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Derivatives · Steven Kramer<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Steven Kramer is the head of the equity derivates trading at Pichon Investments. He is reviewing some potential trades as well as existing positions.<\/p><p>Kramer first calculates the no-arbitrage value of a 1-year European-style put option on Watercolor Inc, a non-dividend-paying stock. For the valuation he uses the binomial model with the following inputs:<\/p><p>• current stock price is EUR 85 • exercise price is EUR 80 • estimated one-year up factor is 1.25 and estimated one-year down factor is 0.80 • risk-free interest rate is 0.50% Kramer considers the following three assumptions regarding option pricing models:<\/p><p>• Assumption 1: there are no market frictions, such as transaction costs and taxes • Assumption 2: the price of the underlying instrument does not jump from one value to another • Assumption 3: short selling of the underlying instrument is allowed, with full use of the proceeds<\/p><p>He considers which of these assumptions apply to either the binomial model or the Black- Scholes-Merton (BSM) model. Kramer uses the BSM model to assess an European-style call option of Dynamics Inc. Using the data in Exhibit 1, he determines the initial trades which would replicate the no-arbitrage payoffs if he bought the call option.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-010.webp\" style=\"max-width:min(100%,157px)\" alt=\"N(di) 0.651 N(d2) 0.555 N(-d1) 0.349 N(-d2) 0.445\"><p>Nine-months ago, Kramer entered a 3-year equity swap with annual reset dates. The notional amount is EUR 15 million. Under the swap he receives the return on an equity index in exchange for paying a fixed rate of 0.50%. At origination the equity index was trading at 14,500. It is currently trading at 14,585. The relevant interest rate present value (PV) factors by maturity are shown in Exhibit 2.<\/p><p><b>Exhibit 2:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-011.webp\" style=\"max-width:min(100%,232px)\" alt=\"Maturity (years) PV Factors 0.25 0.999375 1.25 0.995644 2.25 0.991080\"><\/div><\/details><div class=\"qtext\"><p>From Kramer's perspective, the no-arbitrage value (in EUR) of the equity swap<\/p><p>is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 33, "q": "Which of the following best supports Barril's choice of valuation approach for NoirCo?", "opts": ["NoirCo's lack of dividend payments", "NoirCo's expected financal leverage changes", "Cumbre's consideration of acquiring a controlling interest in NoirCo"], "ans": "B", "expl": "B is correct. because when a firm has changing financial leverage, FCFF is often preferred to FCFE. The two free cash flow approaches for valuing equity, FCFF and FCFE, theoretically should yield the same estimates if all inputs reflect identical assumptions. An analyst may prefer to use one approach rather than the other, however, because of the characteristics of the company being valued. For example, if the company's capital structure is relatively stable, using FCFE to value equity is more direct and simpler than using FCFF. The FCFF model is often chosen, however, in the following case: A levered company with a changing capital structure. First, if historical data are used to forecast free cash flow growth rates, FCFF growth might reflect fundamentals more clearly than does FCFE growth, which reflects fluctuating amounts of net borrowing. Second, in a forward-looking context, the required return on equity might be expected to be more sensitive to changes in financial leverage than changes in the WACC, making the use of a constant discount rate difficult to justify.", "explhtml": "<p><b>B is correct.<\/b> because when a firm has changing financial leverage, FCFF is often<\/p><p>preferred to FCFE. The two free cash flow approaches for valuing equity, FCFF and FCFE, theoretically should yield the same estimates if all inputs reflect identical assumptions. An analyst may prefer to use one approach rather than the other, however, because of the characteristics of the company being valued. For example, if the company's capital structure is relatively stable, using FCFE to value equity is more direct and simpler than using FCFF. The FCFF model is often chosen, however, in the following case: A levered company with a changing capital structure. First, if historical data are used to forecast free cash flow growth rates, FCFF growth might reflect fundamentals more clearly than does FCFE growth, which reflects fluctuating amounts of net borrowing. Second, in a forward-looking context, the required return on equity might be expected to be more sensitive to changes in financial leverage than changes in the WACC, making the use of a constant discount rate difficult to justify.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Equity Valuation · Jorge Barril<\/summary><div class=\"vig-body\"><p>Jorge Barril is an equity analyst for Cumbre Investments. Barril emphasizes free cash flow valuation approaches when evaluating investment opportunities. He is valuing three<\/p><p>portfolios. All three companies report under US GAAP and have a tax rate of 25%.<\/p><p>NoirCo NoirCo, an all-equity-financed firm paying no dividends, has announced a multi-year, debt- financed share repurchase program. Cumbre is considering acquiring a controlling interest in NoirCo. Barril chooses an FCFF approach rather than an FCFE approach to value NoirCo's equity.<\/p><p>AzulEnt AzulEnt reported sales of $4,600 million for the most recent year. Using the forecasts in Exhibit 1, Barril projects AzulEnt's FCFF for the upcoming year.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-012.webp\" style=\"max-width:min(100%,479px)\" alt=\"Sales growth 12% EBIT margin 15% Incremental fixed capital expenditures as a proportion of sales increases 20% Incremental working capital expenditures as a proportion of sales increases 10%\"><p>Proportion of incremental fixed and working capital expenditures financed by debt 40%<\/p><p>VerdeInd Barril calculates VerdeInd's FCFF for the most recent year starting from net income available to common shareholders. He notes that in the most recent year VerdeInd paid $12 million of preferred dividends. He determines whether an adjustment related to preferred stock dividends should be added to net income as part of his calculation of FCFF for the most recent year. After calculating FCFF for the most recent year, Barril uses a two-stage FCFF model and the data in Exhibit 2 to estimate the firm value of VerdeInd.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-013.webp\" style=\"max-width:min(100%,428px)\" alt=\"FCFF for the most recent year $750 million Annual FCFF growth rate in Year 1 and Year 2 9% Annual FCFF growth rate in Year 3 and beyond 3% Required return on equity 7% WACC 6%\"><\/div><\/details><div class=\"qtext\"><p>Which of the following best supports Barril's choice of valuation approach for<\/p><p>NoirCo?<\/p><\/div>", "subj": "equity"}, {"n": 34, "q": "Barril's projected FCFF (in $millions) for AzulEnt in the upcoming year should be closest to:", "opts": ["352.", "414.", "480."], "ans": "B", "expl": "B is correct. because the FCFF forecast is computed as: FCFF = EBIT × (1-Tax rate) - Incremental FC - Incremental WC Where: EBIT = Most recent year sales × (1 + Sales growth) × EBIT margin Incremental FC = (Most recent year sales) × (Sales growth) × (Incr FC as % of Sales growth) Incremental WC = (Most recent year sales) x (Sales growth) × (Incr WC as % of Sales", "explhtml": "<p><b>B is correct.<\/b> because the FCFF forecast is computed as:<\/p><p>FCFF = EBIT × (1-Tax rate) - Incremental FC - Incremental WC Where: EBIT = Most recent year sales × (1 + Sales growth) × EBIT margin Incremental FC = (Most recent year sales) × (Sales growth) × (Incr FC as % of Sales growth) Incremental WC = (Most recent year sales) x (Sales growth) × (Incr WC as % of Sales<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2a-020.webp\" style=\"max-width:min(100%,533px)\" alt=\"growth) Most recent year sales 4,600.00 Projected sales 5,152.00 = 4,600.00 x (1 + 0.12) EBIT 772.80 = 5,152 × 0.15 Compute FCFF EBIT(1 - Tax rate) 579.60 = 772.80 x (1 - 0.25) Less: Incr FC (110.40) = 4,600.00 x 0.12 x 0.20 Less: Incr WC (55.20) = 4,600.00 x 0.12 × 0.10 FCFF 414.00 = 579.60 - 110.40 - 55.20\">", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Equity Valuation · Jorge Barril<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jorge Barril is an equity analyst for Cumbre Investments. Barril emphasizes free cash flow valuation approaches when evaluating investment opportunities. He is valuing three<\/p><p>portfolios. All three companies report under US GAAP and have a tax rate of 25%.<\/p><p>NoirCo NoirCo, an all-equity-financed firm paying no dividends, has announced a multi-year, debt- financed share repurchase program. Cumbre is considering acquiring a controlling interest in NoirCo. Barril chooses an FCFF approach rather than an FCFE approach to value NoirCo's equity.<\/p><p>AzulEnt AzulEnt reported sales of $4,600 million for the most recent year. Using the forecasts in Exhibit 1, Barril projects AzulEnt's FCFF for the upcoming year.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-012.webp\" style=\"max-width:min(100%,479px)\" alt=\"Sales growth 12% EBIT margin 15% Incremental fixed capital expenditures as a proportion of sales increases 20% Incremental working capital expenditures as a proportion of sales increases 10%\"><p>Proportion of incremental fixed and working capital expenditures financed by debt 40%<\/p><p>VerdeInd Barril calculates VerdeInd's FCFF for the most recent year starting from net income available to common shareholders. He notes that in the most recent year VerdeInd paid $12 million of preferred dividends. He determines whether an adjustment related to preferred stock dividends should be added to net income as part of his calculation of FCFF for the most recent year. After calculating FCFF for the most recent year, Barril uses a two-stage FCFF model and the data in Exhibit 2 to estimate the firm value of VerdeInd.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-013.webp\" style=\"max-width:min(100%,428px)\" alt=\"FCFF for the most recent year $750 million Annual FCFF growth rate in Year 1 and Year 2 9% Annual FCFF growth rate in Year 3 and beyond 3% Required return on equity 7% WACC 6%\"><\/div><\/details><div class=\"qtext\"><p>Barril's projected FCFF (in $millions) for AzulEnt in the upcoming year should<\/p><p>be closest to:<\/p><\/div>", "subj": "equity"}, {"n": 35, "q": "In calculating VerdeInd's FCFF for the most recent year, should Barril have added an adjustment related to preferred stock dividends to net income available to common shareholders?", "opts": ["No", "Yes, he should have added $9 million to net income", "Yes, he should have added $12 million to net income"], "ans": "C", "expl": "C is correct. because net income available to common shareholders measures the residual earnings that flow to common shareholders after all other sources of capital have been compensated. When computing FCFF starting from net income, the full amount of the preferred dividends are added back.Similar to the treatment of after- tax interest expense, dividends on preferred stock that are deducted in arriving at net income available to common shareholders must be added back to derive FCFF. The reason for the add-back is that preferred stock dividends are also a cash flow available to one of the company's capital providers and thus constitute part of overall FCFF.", "explhtml": "<p><b>C is correct.<\/b> because net income available to common shareholders measures the<\/p><p>residual earnings that flow to common shareholders after all other sources of capital have been compensated. When computing FCFF starting from net income, the full amount of the preferred dividends are added back.Similar to the treatment of after- tax interest expense, dividends on preferred stock that are deducted in arriving at net income available to common shareholders must be added back to derive FCFF. The reason for the add-back is that preferred stock dividends are also a cash flow available to one of the company's capital providers and thus constitute part of overall FCFF.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Equity Valuation · Jorge Barril<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jorge Barril is an equity analyst for Cumbre Investments. Barril emphasizes free cash flow valuation approaches when evaluating investment opportunities. He is valuing three<\/p><p>portfolios. All three companies report under US GAAP and have a tax rate of 25%.<\/p><p>NoirCo NoirCo, an all-equity-financed firm paying no dividends, has announced a multi-year, debt- financed share repurchase program. Cumbre is considering acquiring a controlling interest in NoirCo. Barril chooses an FCFF approach rather than an FCFE approach to value NoirCo's equity.<\/p><p>AzulEnt AzulEnt reported sales of $4,600 million for the most recent year. Using the forecasts in Exhibit 1, Barril projects AzulEnt's FCFF for the upcoming year.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-012.webp\" style=\"max-width:min(100%,479px)\" alt=\"Sales growth 12% EBIT margin 15% Incremental fixed capital expenditures as a proportion of sales increases 20% Incremental working capital expenditures as a proportion of sales increases 10%\"><p>Proportion of incremental fixed and working capital expenditures financed by debt 40%<\/p><p>VerdeInd Barril calculates VerdeInd's FCFF for the most recent year starting from net income available to common shareholders. He notes that in the most recent year VerdeInd paid $12 million of preferred dividends. He determines whether an adjustment related to preferred stock dividends should be added to net income as part of his calculation of FCFF for the most recent year. After calculating FCFF for the most recent year, Barril uses a two-stage FCFF model and the data in Exhibit 2 to estimate the firm value of VerdeInd.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-013.webp\" style=\"max-width:min(100%,428px)\" alt=\"FCFF for the most recent year $750 million Annual FCFF growth rate in Year 1 and Year 2 9% Annual FCFF growth rate in Year 3 and beyond 3% Required return on equity 7% WACC 6%\"><\/div><\/details><div class=\"qtext\"><p>In calculating VerdeInd's FCFF for the most recent year, should Barril have added<\/p><p>an adjustment related to preferred stock dividends to net income available to common shareholders?<\/p><\/div>", "subj": "equity"}, {"n": 36, "q": "Based on a two-stage FCFF model, the estimated firm value (in $ millions) of VerdeInd is closest to:", "opts": ["21,580.", "27,250.", "28,790."], "ans": "C", "expl": "C is correct. because the firm value of VerdeInd is computed as the sum of the present values of the Year 1 and 2 FCFFs and the terminal value (TV) of VerdeInd at the end of Year 2, as follows: TV2 = [FCFF2 × (1+gLT)] / (WACC-gLT) = ($891.1× 1.03) / (0.06 - 0.03) = $30,593.6 PV(TV2) = TV2 / (1 + WACC)2 = $30,593.6 / 1.062 = $27,228.2 Estimated value of VerdeInd = PV(FCFF1&2) + PV(TV2) = $1,564.3 + $27,228.2 = $28,792.5 ~ $28,790", "explhtml": "<p><b>C is correct.<\/b> because the firm value of VerdeInd is computed as the sum of<\/p><p>the present values of the Year 1 and 2 FCFFs and the terminal value (TV) of VerdeInd at the end of Year 2, as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2a-021.webp\" style=\"max-width:min(100%,527px)\" alt=\"Present value of Year 1 and 2 FCFFs Year FCFF PV(FCFF) 1 FCFF,(1 + gsr) = $750 x 1.09 = $817.5 FCFF,/(1 + WACC) = $817.5/1.06 = $771.2 2 FCFF, (1 + gsт) = $817.5 x 1.09 = $891.1 FCFF,/(1 + WACC)? = $891.1/1.062 = $793.1 Total $1,564.3\"><p>TV2 = [FCFF2 × (1+gLT)] / (WACC-gLT) = ($891.1× 1.03) / (0.06 - 0.03) = $30,593.6 PV(TV2) = TV2 / (1 + WACC)2 = $30,593.6 / 1.062 = $27,228.2 Estimated value of VerdeInd = PV(FCFF1&amp;2) + PV(TV2) = $1,564.3 + $27,228.2 = $28,792.5 ~ $28,790<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Equity Valuation · Jorge Barril<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jorge Barril is an equity analyst for Cumbre Investments. Barril emphasizes free cash flow valuation approaches when evaluating investment opportunities. He is valuing three<\/p><p>portfolios. All three companies report under US GAAP and have a tax rate of 25%.<\/p><p>NoirCo NoirCo, an all-equity-financed firm paying no dividends, has announced a multi-year, debt- financed share repurchase program. Cumbre is considering acquiring a controlling interest in NoirCo. Barril chooses an FCFF approach rather than an FCFE approach to value NoirCo's equity.<\/p><p>AzulEnt AzulEnt reported sales of $4,600 million for the most recent year. Using the forecasts in Exhibit 1, Barril projects AzulEnt's FCFF for the upcoming year.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-012.webp\" style=\"max-width:min(100%,479px)\" alt=\"Sales growth 12% EBIT margin 15% Incremental fixed capital expenditures as a proportion of sales increases 20% Incremental working capital expenditures as a proportion of sales increases 10%\"><p>Proportion of incremental fixed and working capital expenditures financed by debt 40%<\/p><p>VerdeInd Barril calculates VerdeInd's FCFF for the most recent year starting from net income available to common shareholders. He notes that in the most recent year VerdeInd paid $12 million of preferred dividends. He determines whether an adjustment related to preferred stock dividends should be added to net income as part of his calculation of FCFF for the most recent year. After calculating FCFF for the most recent year, Barril uses a two-stage FCFF model and the data in Exhibit 2 to estimate the firm value of VerdeInd.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-013.webp\" style=\"max-width:min(100%,428px)\" alt=\"FCFF for the most recent year $750 million Annual FCFF growth rate in Year 1 and Year 2 9% Annual FCFF growth rate in Year 3 and beyond 3% Required return on equity 7% WACC 6%\"><\/div><\/details><div class=\"qtext\"><p>Based on a two-stage FCFF model, the estimated firm value (in $ millions) of<\/p><p>VerdeInd is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 37, "q": "Which sector considered by Merkel would be least impacted by her concern?", "opts": ["Hotels", "Hospitals", "Automobile manufacturing"], "ans": "B", "expl": "B is correct. because hospital or healthcare services are a defensive sector. Since Merkel has a concern about the relative sensitivity of these sectors to weakening economic conditions, the correct answer is to choose the most defensive sector and the incorrect one would be choose a cyclical sector.", "explhtml": "<p><b>B is correct.<\/b> because hospital or healthcare services are a defensive sector. Since<\/p><p>Merkel has a concern about the relative sensitivity of these sectors to weakening economic conditions, the correct answer is to choose the most defensive sector and the incorrect one would be choose a cyclical sector.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Portfolio Management · Christine Merkel<\/summary><div class=\"vig-body\"><p>Christine Merkel, an active investment manager, is reviewing investment alternatives and preparing to meet with two clients.<\/p><p>Merkel considers an investment in the following three sectors: hotels, hospitals and automotive manufacturing. Merkel is concerned about the relative sensitivity of each of these sectors' earnings to weakening economic conditions. Merkel then begins preparing for her client meetings. Client 1 has a portfolio comprising the three ETFs in Exhibit 1. Merkel wants to calculate the total expected return of the portfolio. The benchmark is equally weighted across the three ETFs and its expected return is 8%.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-014.webp\" style=\"max-width:min(100%,444px)\" alt=\"Expected Active Return Active Weight ETF 1 5% 15% ETF 2 5% 5% ETF 3 -10% -20%\"><p>Client 1 will be receiving an inheritance which she would like to hold as cash in her equity portfolio for a short period of time. She asks Merkel what impact of this will have on the portfolio's information ratio.<\/p><p>For Client 2's portfolio, Merkel uses the expanded fundamental law of active management to calculate the expected active return. For her calculation, Merkel assumes the following:<\/p><p>• a benchmark of 64 equities • an information coefficient of 0.1 tfliatindl tonsot f 30 nondcon • a portfolio active risk target of 2% per year • forecasts are translated into active weights 75% of the time<\/p><\/div><\/details><div class=\"qtext\"><p>Which sector considered by Merkel would be least impacted by her concern?<\/p><\/div>", "subj": "portfolio"}, {"n": 38, "q": "The correct answer to Client I's question regarding the equity portfolio's information ratio is that it would most likely.", "opts": ["decrease.", "remain unchanged.", "increase."], "ans": "A", "expl": "A is correct. because adding cash to the portfolio reduces the information ratio. Unlike the Sharpe ratio, the information ratio is affected by the addition of cash or the use of leverage. For example, if the investor adds cash to a portfolio of risky assets, the information ratio for the combined portfolio will generally shrink.", "explhtml": "<p><b>A is correct.<\/b> because adding cash to the portfolio reduces the information ratio.<\/p><p>Unlike the Sharpe ratio, the information ratio is affected by the addition of cash or the use of leverage. For example, if the investor adds cash to a portfolio of risky assets, the information ratio for the combined portfolio will generally shrink.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Portfolio Management · Christine Merkel<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Christine Merkel, an active investment manager, is reviewing investment alternatives and preparing to meet with two clients.<\/p><p>Merkel considers an investment in the following three sectors: hotels, hospitals and automotive manufacturing. Merkel is concerned about the relative sensitivity of each of these sectors' earnings to weakening economic conditions. Merkel then begins preparing for her client meetings. Client 1 has a portfolio comprising the three ETFs in Exhibit 1. Merkel wants to calculate the total expected return of the portfolio. The benchmark is equally weighted across the three ETFs and its expected return is 8%.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-014.webp\" style=\"max-width:min(100%,444px)\" alt=\"Expected Active Return Active Weight ETF 1 5% 15% ETF 2 5% 5% ETF 3 -10% -20%\"><p>Client 1 will be receiving an inheritance which she would like to hold as cash in her equity portfolio for a short period of time. She asks Merkel what impact of this will have on the portfolio's information ratio.<\/p><p>For Client 2's portfolio, Merkel uses the expanded fundamental law of active management to calculate the expected active return. For her calculation, Merkel assumes the following:<\/p><p>• a benchmark of 64 equities • an information coefficient of 0.1 tfliatindl tonsot f 30 nondcon • a portfolio active risk target of 2% per year • forecasts are translated into active weights 75% of the time<\/p><\/div><\/details><div class=\"qtext\"><p>The correct answer to Client I's question regarding the equity portfolio's information<\/p><p>ratio is that it would most likely.<\/p><\/div>", "subj": "portfolio"}, {"n": 39, "q": "The total expected return for Client I's ETF portfolio is:", "opts": ["3%.", "7%.", "11%."], "ans": "C", "expl": "C is correct. because the total expected return for Client I's ETF portfolio is 11%, consisting of the active portfolio return of 3% plus the benchmark return of 8%.", "explhtml": "<p><b>C is correct.<\/b> because the total expected return for Client I's ETF portfolio is 11%,<\/p><p>consisting of the active portfolio return of 3% plus the benchmark return of 8%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2a-022.webp\" style=\"max-width:min(100%,524px)\" alt=\"Expected Active Retum Active Weight Total Active Return ETF 1 5% 15% 0.75% ETF 2 5% 5% 0.25% ETF 3 -10% -20% 2.00% Total 3.00%\">", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Portfolio Management · Christine Merkel<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Christine Merkel, an active investment manager, is reviewing investment alternatives and preparing to meet with two clients.<\/p><p>Merkel considers an investment in the following three sectors: hotels, hospitals and automotive manufacturing. Merkel is concerned about the relative sensitivity of each of these sectors' earnings to weakening economic conditions. Merkel then begins preparing for her client meetings. Client 1 has a portfolio comprising the three ETFs in Exhibit 1. Merkel wants to calculate the total expected return of the portfolio. The benchmark is equally weighted across the three ETFs and its expected return is 8%.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-014.webp\" style=\"max-width:min(100%,444px)\" alt=\"Expected Active Return Active Weight ETF 1 5% 15% ETF 2 5% 5% ETF 3 -10% -20%\"><p>Client 1 will be receiving an inheritance which she would like to hold as cash in her equity portfolio for a short period of time. She asks Merkel what impact of this will have on the portfolio's information ratio.<\/p><p>For Client 2's portfolio, Merkel uses the expanded fundamental law of active management to calculate the expected active return. For her calculation, Merkel assumes the following:<\/p><p>• a benchmark of 64 equities • an information coefficient of 0.1 tfliatindl tonsot f 30 nondcon • a portfolio active risk target of 2% per year • forecasts are translated into active weights 75% of the time<\/p><\/div><\/details><div class=\"qtext\"><p>The total expected return for Client I's ETF portfolio is:<\/p><\/div>", "subj": "portfolio"}, {"n": 40, "q": "The expected active return of Client 2's portfolio is:", "opts": ["1.2%.", "1.6%.", "9.6%."], "ans": "A", "expl": "A is correct. because the portfolio's active return is calculated to be 1.2% using the expanded Fundamental Law of Active Management. E(RA) = TC× IC x JBR x0A whereby: TC = transfer coefficient = 0.75 (i.e. the manager is likely to be able to translate forecasts into active weights 75% of the time) IC = information coefficient = 0.1 BR = breadth of the strategy = number of securities in the benchmark = 64 oA = annualized active risk = 2% The expected active return then equates to 0.75 × 0.1 x (J64) × 2% = 1.2%", "explhtml": "<p><b>A is correct.<\/b> because the portfolio's active return is calculated to be 1.2% using the<\/p><p>expanded Fundamental Law of Active Management. E(RA) = TC× IC x JBR x0A whereby: TC = transfer coefficient = 0.75 (i.e. the manager is likely to be able to translate forecasts into active weights 75% of the time) IC = information coefficient = 0.1 BR = breadth of the strategy = number of securities in the benchmark = 64 oA = annualized active risk = 2% The expected active return then equates to 0.75 × 0.1 x (J64) × 2% = 1.2%<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Portfolio Management · Christine Merkel<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Christine Merkel, an active investment manager, is reviewing investment alternatives and preparing to meet with two clients.<\/p><p>Merkel considers an investment in the following three sectors: hotels, hospitals and automotive manufacturing. Merkel is concerned about the relative sensitivity of each of these sectors' earnings to weakening economic conditions. Merkel then begins preparing for her client meetings. Client 1 has a portfolio comprising the three ETFs in Exhibit 1. Merkel wants to calculate the total expected return of the portfolio. The benchmark is equally weighted across the three ETFs and its expected return is 8%.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-014.webp\" style=\"max-width:min(100%,444px)\" alt=\"Expected Active Return Active Weight ETF 1 5% 15% ETF 2 5% 5% ETF 3 -10% -20%\"><p>Client 1 will be receiving an inheritance which she would like to hold as cash in her equity portfolio for a short period of time. She asks Merkel what impact of this will have on the portfolio's information ratio.<\/p><p>For Client 2's portfolio, Merkel uses the expanded fundamental law of active management to calculate the expected active return. For her calculation, Merkel assumes the following:<\/p><p>• a benchmark of 64 equities • an information coefficient of 0.1 tfliatindl tonsot f 30 nondcon • a portfolio active risk target of 2% per year • forecasts are translated into active weights 75% of the time<\/p><\/div><\/details><div class=\"qtext\"><p>The expected active return of Client 2's portfolio is:<\/p><\/div>", "subj": "portfolio"}, {"n": 41, "q": "Which of the following is correct about the credit analysis model used by Shenk?", "opts": ["The modeler must specify the value of a default barrier", "The input variables are based on publicly available information", "Default probability is a variable that is endogenous to the model"], "ans": "B", "expl": "B is correct. because the endowment portfolio uses a reduced-form model, whose inputs generally require only publicly available information. Reduced-form models have the advantage that the inputs are observable variables, including historical data. Reduced-form models require only information generally available in financial markets, which suggests that they should be used to value risky debt securities and credit derivatives.", "explhtml": "<p><b>B is correct.<\/b> because the endowment portfolio uses a reduced-form model, whose<\/p><p>inputs generally require only publicly available information. Reduced-form models have the advantage that the inputs are observable variables, including historical data. Reduced-form models require only information generally available in financial markets, which suggests that they should be used to value risky debt securities and credit derivatives.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 41–44 · Fixed Income · Amy Shenk<\/summary><div class=\"vig-body\"><p>Amy Shenk actively manages a corporate bond portfolio for a university endowment. Shenk is reviewing the credit risk of her portfolio, which includes highly diverse issue types and maturities. For her internal credit analysis work, Shenk uses a reduced-form model.<\/p><p>Shenk examines a two-year zero-coupon corporate bond issued by Klopp Co. for possible inclusion in her portfolio. She analyzes the bond to determine an appropriate credit valuation adjustment and then estimates the one-year rate of return given the possibility of credit-rating migration without default. She uses the following information:<\/p><p>• The bond has two years to maturity and a modified duration of 1.95. • Shenk estimates the risk-neutral probability of default at year end to be 1.50% and the recovery rate to be 40%. • The yield on two-year zero-coupon default-free bonds is 3.8%, so discount factors are 0.9634 for Year 1 and 0.9281 for Year 2.<\/p><p><b>Exhibit 1 contains an excerpt from a rating transition matrix and credit spreads. It is a<\/b><\/p><p>partial matrix and all the lower bond ratings are consolidated into one category. Shenk uses the information to calculate the expected percentage price change for the Klopp Co. bond.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2-015.webp\" style=\"max-width:min(100%,427px)\" alt=\"From/To AAA AA A or Lower AA 3% 87% 10% Credit spread 0.72% 0.97% 2.09%\"><p>The investment strategist at Shenk's firm expects the macroeconomy to weaken over the next few quarters, and Shenk makes the following forecasts:<\/p><p>• Forecast 1: High-yield corporate bonds with the largest default probability will trade at prices that approach their recovery rates. • Forecast 2: The term structure of high-yield corporate bond credit spreads will steepen. • Forecast 3: For the highest-quality corporate bonds, credit spreads will decrease.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following is correct about the credit analysis model used by Shenk?<\/p><\/div>", "subj": "fixed"}, {"n": 42, "q": "Given Shenk's estimates of default probability and recovery rate for the two-year corporate bond, the credit valuation adjustment is closest to:", "opts": ["1.66.", "1.75.", "1.89."], "ans": "A", "expl": "A is correct. because the credit valuation adjustment (CVA) is determined based on the table and descriptions below. The CVA is the discount that should be applied to the price of an equivalent US Treasury security, given the default risk of the corporate security. Working from the left to right columns in the table above: Column 2: The exposure in each year is the face value of the zero-coupon bond discounted from the maturity date to that date. As an example, the year 1 exposure is the 100 face value discounted from the year 2 maturity date to year 1, at the risk- free rate of 3.8%: 100/(1+0.038)1 = 96.3391. Column 3: The recovery in each year is that year's exposure times the recovery rate which is given in the case as 40%. Column 4: The loss given default (LGD) in any year is that year's exposure less the amount expected to be recovered. Column 5: The probability of default (POD) is keyed off the initial POD given in the case. Each year's POD is equal to the product of the previous year's POD and probability of survival (POS). Column 6: The POS to each listed year is the previous year's listed POS less the current year's POD. Column 7: The expected loss in each year is that year's LGD times the year's POD. Column 8: These discount factors are given in the case. Column 9: For the two-year corporate bond, the CVA is the sum of the PVs of expected loss for each of the two years. Each year's PV of expected loss is calculated as the product of the expected loss and the discount factor.", "explhtml": "<p><b>A is correct.<\/b> because the credit valuation adjustment (CVA) is determined based on<\/p><p>the table and descriptions below. The CVA is the discount that should be applied to the price of an equivalent US Treasury security, given the default risk of the corporate security.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s2a-023.webp\" style=\"max-width:min(100%,537px)\" alt=\"PV of Expected Discount Expocted Year Exposure Recovery LGD POD (%) POS (%) Loss Factor Loss 1 96.3391 38.5356 57.8035 1.5000 98.5000 0.8671 0.9634 0.8353 2 100.0000 40.0000 60.0000 1.4775 97.0225 0.8865 0.9281 0.8228 CVA= 1.6581\"><p>Working from the left to right columns in the table above: Column 2: The exposure in each year is the face value of the zero-coupon bond discounted from the maturity date to that date. As an example, the year 1 exposure is the 100 face value discounted from the year 2 maturity date to year 1, at the risk- free rate of 3.8%: 100/(1+0.038)1 = 96.3391. Column 3: The recovery in each year is that year's exposure times the recovery rate which is given in the case as 40%. Column 4: The loss given default (LGD) in any year is that year's exposure less the amount expected to be recovered. Column 5: The probability of default (POD) is keyed off
