values converge?\"<\/p><\/div><\/details><div class=\"qtext\"><p>Based on ETFX's factor return model, the equilibrium predicted value for inflation<\/p><p>for last year was closest to.<\/p><\/div>", "subj": "portfolio"}, {"n": 23, "q": "Excluding the compounding effect, the expected total cost for investing in ETFZ for Rocco's assumed holding period is closest to:", "opts": ["0.49%.", "0.59%.", "0.97%."], "ans": "B", "expl": "B is correct. because all components of the total cost are correctly accounted for: (1)) Six month management fee of 0.76% × 0.5 = 0.38% (2) Round trip trading commission of 0.05% (3) Bid-offer spread of 0.16% on purchase and sale. Total six month holding period cost = (1) + (2) + (3) = 0.38 + 0.05 + 0.16 = 0.59%", "explhtml": "<p><b>B is correct.<\/b> because all components of the total cost are correctly accounted for:<\/p><p>(1)) Six month management fee of 0.76% × 0.5 = 0.38% (2) Round trip trading commission of 0.05% (3) Bid-offer spread of 0.16% on purchase and sale. Total six month holding period cost = (1) + (2) + (3) = 0.38 + 0.05 + 0.16 = 0.59%<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Portfolio Management · Maureen Rocco<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Maureen Rocco is a portfolio manager assisting two clients, Bright Minds Foundation and Max Degroom, with the selection of exchange traded funds (ETFs).<\/p><p>Bright Minds Foundation Bright Minds is a perpetual foundation. It wants to add investments which have long- term exposure to economic factors for a part of its fixed income portfolio allocation. Rocco begins by illustrating Arbitrage Pricing Theory (APT), which forms the basis for many factor models, to the CIO of Bright Minds. She uses three well-diversified arbitrage free portfolios and one common factor as shown in Exhibit 1 to demonstrate how parameters are estimated in a one-factor APT model.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-008.webp\" style=\"max-width:min(100%,318px)\" alt=\"Portfolio Expected Return Factor Sensitivity P 0.0850 0.65 Q 0.1200 1.14 R 0.1036 0.91\"><p>Rocco has identified ETFX as a suitable investment for the foundation. ETFX is a well- diversified fixed income ETF based on a macroeconomic factor model that seeks long- term exposure to surprises in GDP growth and inflation.<\/p><p>ETFX's factor return model is formulated as follows:<\/p><p>Rx = 0.025 + 0.8FINF + 1.2FGDP + Ex<\/p><p>where, Rx is the return on ETFX, FInF represents surprise in inflation, and FeDprepresents surprise in GDP growth, both measured by actual values minus predicted values. Ex is the error term which is assumed to be zero.<\/p><p>For last year, the fund had a return of 3.62%, while actual inflation was 2.5% and actual GDP growth was 3%. The predicted value of GDP growth for last year was 2.4%.<\/p><p>Max Degroom Max Degroom is a US based wealthy individual client who is also an active trader. He is considering a short-term position in ETFZ, an ETF leveraged three times to the daily return of a widely used emerging market equity index. Rocco calculates the expected total cost of investing in ETFZ assuming a six-month holding period and the following information.<\/p><p>Annual management fee of 0.76% Round-trip trading commission of 0.05%<\/p><p>Bid-offer spread of 0.16% on purchase and sale<\/p><p>Before purchasing ETFZ, Degroom asks Rocco to explain the role of the authorized participant (AP) in an ETF. He asks \"I observed, for short periods of time the price of another ETF was $101 and its NAV (fair value) was $102. Assuming minimal costs, what arbitrage actions would the AP make so that the two values converge?\"<\/p><\/div><\/details><div class=\"qtext\"><p>Excluding the compounding effect, the expected total cost for investing in ETFZ for<\/p><p>Rocco's assumed holding period is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 24, "q": "Based on Degroom's observations regarding the difference between ETF pricing and its NAV, the AP's arbitrage actions would include:", "opts": ["shorting the ETF.", "delivering ETF shares to the sponsor for redemption.", "delivering creation basket shares to the ETF sponsor."], "ans": "B", "expl": "B is correct. because the correct arbitrage trade will include the authorized participant buying and delivering the redemption units of underpriced ETF shares (USD 101), collecting the underlying basket and selling the securities in the open market for USD 102. If the AP has a block of ETF shares it no longer wants (usually because it bought them from other market participants), the AP presents these shares for redemption to the ETF manager and receives in return the basket of underlying securities, which the AP can then sell in the market if it chooses.", "explhtml": "<p><b>B is correct.<\/b> because the correct arbitrage trade will include the authorized<\/p><p>participant buying and delivering the redemption units of underpriced ETF shares (USD 101), collecting the underlying basket and selling the securities in the open market for USD 102. If the AP has a block of ETF shares it no longer wants (usually because it bought them from other market participants), the AP presents these shares for redemption to the ETF manager and receives in return the basket of underlying securities, which the AP can then sell in the market if it chooses.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Portfolio Management · Maureen Rocco<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Maureen Rocco is a portfolio manager assisting two clients, Bright Minds Foundation and Max Degroom, with the selection of exchange traded funds (ETFs).<\/p><p>Bright Minds Foundation Bright Minds is a perpetual foundation. It wants to add investments which have long- term exposure to economic factors for a part of its fixed income portfolio allocation. Rocco begins by illustrating Arbitrage Pricing Theory (APT), which forms the basis for many factor models, to the CIO of Bright Minds. She uses three well-diversified arbitrage free portfolios and one common factor as shown in Exhibit 1 to demonstrate how parameters are estimated in a one-factor APT model.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-008.webp\" style=\"max-width:min(100%,318px)\" alt=\"Portfolio Expected Return Factor Sensitivity P 0.0850 0.65 Q 0.1200 1.14 R 0.1036 0.91\"><p>Rocco has identified ETFX as a suitable investment for the foundation. ETFX is a well- diversified fixed income ETF based on a macroeconomic factor model that seeks long- term exposure to surprises in GDP growth and inflation.<\/p><p>ETFX's factor return model is formulated as follows:<\/p><p>Rx = 0.025 + 0.8FINF + 1.2FGDP + Ex<\/p><p>where, Rx is the return on ETFX, FInF represents surprise in inflation, and FeDprepresents surprise in GDP growth, both measured by actual values minus predicted values. Ex is the error term which is assumed to be zero.<\/p><p>For last year, the fund had a return of 3.62%, while actual inflation was 2.5% and actual GDP growth was 3%. The predicted value of GDP growth for last year was 2.4%.<\/p><p>Max Degroom Max Degroom is a US based wealthy individual client who is also an active trader. He is considering a short-term position in ETFZ, an ETF leveraged three times to the daily return of a widely used emerging market equity index. Rocco calculates the expected total cost of investing in ETFZ assuming a six-month holding period and the following information.<\/p><p>Annual management fee of 0.76% Round-trip trading commission of 0.05%<\/p><p>Bid-offer spread of 0.16% on purchase and sale<\/p><p>Before purchasing ETFZ, Degroom asks Rocco to explain the role of the authorized participant (AP) in an ETF. He asks \"I observed, for short periods of time the price of another ETF was $101 and its NAV (fair value) was $102. Assuming minimal costs, what arbitrage actions would the AP make so that the two values converge?\"<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Degroom's observations regarding the difference between ETF pricing and<\/p><p>its NAV, the AP's arbitrage actions would include:<\/p><\/div>", "subj": "portfolio"}, {"n": 25, "q": "The approach Estrada uses to analyze the bank fails to consider:", "opts": ["off-balance-sheet items.", "the quality of internal controls.", "contractual maturity mismatches."], "ans": "A", "expl": "A is correct. because there are other factors relevant to the analysis of a bank -and to any kind of company- that are not covered by the CAMELS approach. Off-balance- sheet items are a factor that merits consideration by debt and equity investors in the banks as well as investors in non-banking entities.", "explhtml": "<p><b>A is correct.<\/b> because there are other factors relevant to the analysis of a bank -and<\/p><p>to any kind of company- that are not covered by the CAMELS approach. Off-balance- sheet items are a factor that merits consideration by debt and equity investors in the banks as well as investors in non-banking entities.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Financial Statement Analysis · Victor Estrada<\/summary><div class=\"vig-body\"><p>Victor Estrada is a financial analyst with an investment management firm. He is responsible for the analysis of financial institutions and uses the CAMELS (Capital adequacy, Asset quality, Management capabilities, Earnings sufficiency, Liquidity position, and Sensitivity to market risk) approach to analyze a bank. The bank operates in a regulatory environment that follows Basel III requirements.<\/p><p>To analyze the bank's capital adequacy, Estrada computes the capital ratios in Exhibit 1. He considers alternative capital sources that would allow the bank to achieve the objective of fully complying with regulatory capital requirements.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-009.webp\" style=\"max-width:min(100%,323px)\" alt=\"Most Recent Regulatory Year Requirement Common equity Tier 1 capital ratio 3.5% 4.5% Total Tier 1 capital ratio 5.7% 6.0% Total capital ratio 8.3% 8.0%\"><p>To study the bank's loan portfolio quality, Estrada analyzes its net loan charge-offs, which have been stable in the last three years. He also computes the ratio of provision for loan losses to net loan charge-offs, which went from 1.5 two years ago, to 1.6 one year ago, and 1.8 in the most recent year.<\/p><p>Estrada evaluates the sustainability of the bank's earnings by reviewing its sources of income. He compiles information about the bank's income as a percentage of total income in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-010.webp\" style=\"max-width:min(100%,320px)\" alt=\"Most Recent Prior Two Years Year Year Ago Net interest income 80% 81% 80% Net service income 8% 10% 13% Net trading income 12% 9% 7%\"><\/div><\/details><div class=\"qtext\"><p>The approach Estrada uses to analyze the bank fails to consider:<\/p><\/div>", "subj": "fsa"}, {"n": 26, "q": "Which of the following actions would help bring the bank into regulatory compliance?", "opts": ["Repurchase shares", "Eliminate its dividend", "Raise additional term deposits"], "ans": "B", "expl": "B is correct. because the minimum capital requirements set forth in Basel III are: • Common Equity Tier 1 Capital must be at least 4.5% of risk-weighted assets. • Total Tier 1 Capital must be at least 6.0% of risk-weighted assets. • Total Capital (Tier 1 Capital plus Tier 2 Capital) must be at least 8.0% of risk- weighted assets. The bank is not complying with the Common Equity Tier 1 Capital ratio (3.5%) and the Total Tier 1 Capital Ratio (5.7%). However, it is complying with the Total Capital Ratio (8.3%). All ratios have in the numerator Common Equity Tier 1 Capital as shown below: Common Equity Tier 1 Capital Ratio = CET1/ RWA Tier 1 Capital Ratio = (CET1 + OT1) / RWA Total Capital Ratio = (CET1 + OT1 + T2) / RWA Where CET1 = Common Equity Tier 1 Capital OT1 = Other Tier 1 Capital T2 = Tier 2 Capital RWA = Risk-Weighted Assets. Common Equity Tier 1 Capital includes common stock, issuance surplus related to common stock, retained earnings, accumulated other comprehensive income, and certain adjustments including the deduction of intangible assets and deferred tax assets. Therefore, an increase in Accumulated Other Comprehensive Income will push all capital ratios up, allowing the bank to fully comply with minimum regulatory capital requirements.", "explhtml": "<p><b>B is correct.<\/b> because the minimum capital requirements set forth in Basel III are:<\/p><p>• Common Equity Tier 1 Capital must be at least 4.5% of risk-weighted assets. • Total Tier 1 Capital must be at least 6.0% of risk-weighted assets. • Total Capital (Tier 1 Capital plus Tier 2 Capital) must be at least 8.0% of risk- weighted assets. The bank is not complying with the Common Equity Tier 1 Capital ratio (3.5%) and the Total Tier 1 Capital Ratio (5.7%). However, it is complying with the Total Capital Ratio (8.3%). All ratios have in the numerator Common Equity Tier 1 Capital as shown below: Common Equity Tier 1 Capital Ratio = CET1/ RWA Tier 1 Capital Ratio = (CET1 + OT1) / RWA Total Capital Ratio = (CET1 + OT1 + T2) / RWA Where CET1 = Common Equity Tier 1 Capital OT1 = Other Tier 1 Capital T2 = Tier 2 Capital RWA = Risk-Weighted Assets. Common Equity Tier 1 Capital includes common stock, issuance surplus related to common stock, retained earnings, accumulated other comprehensive income, and certain adjustments including the deduction of intangible assets and deferred tax assets. Therefore, an increase in Accumulated Other Comprehensive Income will push all capital ratios up, allowing the bank to fully comply with minimum regulatory capital requirements.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Financial Statement Analysis · Victor Estrada<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Victor Estrada is a financial analyst with an investment management firm. He is responsible for the analysis of financial institutions and uses the CAMELS (Capital adequacy, Asset quality, Management capabilities, Earnings sufficiency, Liquidity position, and Sensitivity to market risk) approach to analyze a bank. The bank operates in a regulatory environment that follows Basel III requirements.<\/p><p>To analyze the bank's capital adequacy, Estrada computes the capital ratios in Exhibit 1. He considers alternative capital sources that would allow the bank to achieve the objective of fully complying with regulatory capital requirements.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-009.webp\" style=\"max-width:min(100%,323px)\" alt=\"Most Recent Regulatory Year Requirement Common equity Tier 1 capital ratio 3.5% 4.5% Total Tier 1 capital ratio 5.7% 6.0% Total capital ratio 8.3% 8.0%\"><p>To study the bank's loan portfolio quality, Estrada analyzes its net loan charge-offs, which have been stable in the last three years. He also computes the ratio of provision for loan losses to net loan charge-offs, which went from 1.5 two years ago, to 1.6 one year ago, and 1.8 in the most recent year.<\/p><p>Estrada evaluates the sustainability of the bank's earnings by reviewing its sources of income. He compiles information about the bank's income as a percentage of total income in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-010.webp\" style=\"max-width:min(100%,320px)\" alt=\"Most Recent Prior Two Years Year Year Ago Net interest income 80% 81% 80% Net service income 8% 10% 13% Net trading income 12% 9% 7%\"><\/div><\/details><div class=\"qtext\"><p>Which of the following actions would help bring the bank into regulatory compliance?<\/p><\/div>", "subj": "fsa"}, {"n": 27, "q": "The ratio used by Estrada to evaluate loan portfolio quality indicates that the bank's loan provisions are most likely.", "opts": ["conservative.", "neutral.", "aggressive."], "ans": "A", "expl": "A is correct. because the provision for loan losses is the amount added to the allowance each year, and one should expect that the provision correlates to the amount of net loan charge-offs. The ratio that relates both items (ratio of the provision for loan losses to net loan charge-offs) gives indications if the bank is conservative, neutral or aggressive in its formation of the allowance for loan losses. A ratio of one indicates that the amount added to the allowance is exactly the same as the net loan charge-off. A ratio higher (lower) than one indicates that the amount added to the allowance is higher (lower) than the net loan charge-off. In the last 3 years, the ratio has been higher than one and growing. This indicates that the bank has become more conservative in its provisioning.", "explhtml": "<p><b>A is correct.<\/b> because the provision for loan losses is the amount added to the<\/p><p>allowance each year, and one should expect that the provision correlates to the amount of net loan charge-offs. The ratio that relates both items (ratio of the provision for loan losses to net loan charge-offs) gives indications if the bank is conservative, neutral or aggressive in its formation of the allowance for loan losses. A ratio of one indicates that the amount added to the allowance is exactly the same as the net loan charge-off. A ratio higher (lower) than one indicates that the amount added to the allowance is higher (lower) than the net loan charge-off. In the last 3 years, the ratio has been higher than one and growing. This indicates that the bank has become more conservative in its provisioning.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Financial Statement Analysis · Victor Estrada<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Victor Estrada is a financial analyst with an investment management firm. He is responsible for the analysis of financial institutions and uses the CAMELS (Capital adequacy, Asset quality, Management capabilities, Earnings sufficiency, Liquidity position, and Sensitivity to market risk) approach to analyze a bank. The bank operates in a regulatory environment that follows Basel III requirements.<\/p><p>To analyze the bank's capital adequacy, Estrada computes the capital ratios in Exhibit 1. He considers alternative capital sources that would allow the bank to achieve the objective of fully complying with regulatory capital requirements.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-009.webp\" style=\"max-width:min(100%,323px)\" alt=\"Most Recent Regulatory Year Requirement Common equity Tier 1 capital ratio 3.5% 4.5% Total Tier 1 capital ratio 5.7% 6.0% Total capital ratio 8.3% 8.0%\"><p>To study the bank's loan portfolio quality, Estrada analyzes its net loan charge-offs, which have been stable in the last three years. He also computes the ratio of provision for loan losses to net loan charge-offs, which went from 1.5 two years ago, to 1.6 one year ago, and 1.8 in the most recent year.<\/p><p>Estrada evaluates the sustainability of the bank's earnings by reviewing its sources of income. He compiles information about the bank's income as a percentage of total income in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-010.webp\" style=\"max-width:min(100%,320px)\" alt=\"Most Recent Prior Two Years Year Year Ago Net interest income 80% 81% 80% Net service income 8% 10% 13% Net trading income 12% 9% 7%\"><\/div><\/details><div class=\"qtext\"><p>The ratio used by Estrada to evaluate loan portfolio quality indicates that the bank's<\/p><p>loan provisions are most likely.<\/p><\/div>", "subj": "fsa"}, {"n": 28, "q": "Based on the bank's income sources, the sustainability of earnings over the past three years has:", "opts": ["deteriorated.", "remained stable.", "improved."], "ans": "A", "expl": "A is correct. because regarding sustainability of a bank's earnings, it is important to examine the composition of earnings. Banks' earnings typically comprise (a) net interest income (b) service income, and (c) trading income. Of these three general sources, trading income is typically the most volatile. Thus, a greater proportion of net interest income and service income is typically more sustainable than trading income. The bank's income stream in the last 3 years shows an increasing participation of trading income in total income. Therefore, the sustainability of the bank's earnings in the last 3 years has deteriorated.", "explhtml": "<p><b>A is correct.<\/b> because regarding sustainability of a bank's earnings, it is important to<\/p><p>examine the composition of earnings. Banks' earnings typically comprise (a) net interest income (b) service income, and (c) trading income. Of these three general sources, trading income is typically the most volatile. Thus, a greater proportion of net interest income and service income is typically more sustainable than trading income.<\/p><p>The bank's income stream in the last 3 years shows an increasing participation of trading income in total income. Therefore, the sustainability of the bank's earnings in the last 3 years has deteriorated.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Financial Statement Analysis · Victor Estrada<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Victor Estrada is a financial analyst with an investment management firm. He is responsible for the analysis of financial institutions and uses the CAMELS (Capital adequacy, Asset quality, Management capabilities, Earnings sufficiency, Liquidity position, and Sensitivity to market risk) approach to analyze a bank. The bank operates in a regulatory environment that follows Basel III requirements.<\/p><p>To analyze the bank's capital adequacy, Estrada computes the capital ratios in Exhibit 1. He considers alternative capital sources that would allow the bank to achieve the objective of fully complying with regulatory capital requirements.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-009.webp\" style=\"max-width:min(100%,323px)\" alt=\"Most Recent Regulatory Year Requirement Common equity Tier 1 capital ratio 3.5% 4.5% Total Tier 1 capital ratio 5.7% 6.0% Total capital ratio 8.3% 8.0%\"><p>To study the bank's loan portfolio quality, Estrada analyzes its net loan charge-offs, which have been stable in the last three years. He also computes the ratio of provision for loan losses to net loan charge-offs, which went from 1.5 two years ago, to 1.6 one year ago, and 1.8 in the most recent year.<\/p><p>Estrada evaluates the sustainability of the bank's earnings by reviewing its sources of income. He compiles information about the bank's income as a percentage of total income in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-010.webp\" style=\"max-width:min(100%,320px)\" alt=\"Most Recent Prior Two Years Year Year Ago Net interest income 80% 81% 80% Net service income 8% 10% 13% Net trading income 12% 9% 7%\"><\/div><\/details><div class=\"qtext\"><p>Based on the bank's income sources, the sustainability of earnings over the past three<\/p><p>years has:<\/p><\/div>", "subj": "fsa"}, {"n": 29, "q": "The carrying value of Willow's investment in Cedar at the end of the most recent year is:", "opts": ["€4,935,600.", "€4,940,000.", "€4,944,400."], "ans": "A", "expl": "A is correct. because under the equity method of accounting, the equity investment is initially recorded on the investor's balance sheet at cost. In subsequent periods the carrying amount of the investment is adjusted to recognize the investor's proportionate share of the investee's earnings or losses, and these earnings or losses are reported in income. Dividends or other distributions received from the investee are treated as a return of capital and reduce the carrying amount of the investment and are not reported in the investor's profit or loss. Therefore, the carrying value of Cedar will be the initial cost, less Willow's share of Cedar's loss, less the dividends received as follows.", "explhtml": "<p><b>A is correct.<\/b> because under the equity method of accounting, the equity investment<\/p><p>is initially recorded on the investor's balance sheet at cost. In subsequent periods the carrying amount of the investment is adjusted to recognize the investor's proportionate share of the investee's earnings or losses, and these earnings or losses are reported in income. Dividends or other distributions received from the investee are treated as a return of capital and reduce the carrying amount of the investment and are not reported in the investor's profit or loss. Therefore, the carrying value of Cedar will be the initial cost, less Willow's share of Cedar's loss, less the dividends received as follows.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1a-016.webp\" style=\"max-width:min(100%,479px)\" alt=\"Purchase price £5,000.000 Investee loss (£300,000) x 0.20 (60,000) Dividends (£22,000) × 0.20 (4,400) Investment account balance at the end of the year £4,935,600\">", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Financial Statement Analysis · Rosina Fredrickson<\/summary><div class=\"vig-body\"><p>Rosina Fredrickson is a financial analyst evaluating Willow plc, a UK-based company that reports under IFRS.<\/p><p>Fredrickson examines Cedar Ltd., a 20%-owned equity investment that Willow acquired on 1 January of the most recent year for £5.0 million. At the time of acquisition, the book values of all of Cedar's assets and liabilities were equal to their fair values. During the most recent year, Cedar incurred a net loss of £300,000, and declared and paid dividends of £22,000. Willow accounts for its investment in Cedar using the equity method.<\/p><p>Fredrickson then evaluates Willow's geographic segment growth for the most recent year by compiling the information in Exhibit 1.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-011.webp\" style=\"max-width:min(100%,324px)\" alt=\"EBIT % of Total % of Total Segment Margin % Assets Capital Expenditures Asia 19.1 27.6 27.3 Europe 14.7 48.2 45.1 Americas 17.5 24.2 27.6\"><p>Frederickson observes that during the past three years, Willow's M-scores (according to the Beneish model) and Z-scores (according to the Altman model) have both trended lower.<\/p><p>As a final step in her analysis, Fredrickson calculates and evaluates the accruals ratios for Willow, as presented in Exhibit 2.<\/p><p><b>Exhibit 2:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-012.webp\" style=\"max-width:min(100%,324px)\" alt=\"Most Two Recent Prior Years Year Year Ago Cash-flow-based accruals ratio 1.8% -2.2% -2.5% Balance-sheet-based accruals -1.9% -1.6% 1.6%\"><p>ratio<\/p><\/div><\/details><div class=\"qtext\"><p>The carrying value of Willow's investment in Cedar at the end of the most recent<\/p><p>year is:<\/p><\/div>", "subj": "fsa"}, {"n": 30, "q": "Based on the geographic segment analysis, which segment is receiving a growth allocation of capital?", "opts": ["Asia", "Europe", "Americas"], "ans": "C", "expl": "C is correct. because the ratio of Total Capital Expenditures % to Total Asset % is 1.140 (27.6%/24.2%). A ratio greater than 1 indicates that the company is growing the segment; the segment is receiving a \"growth allocation\" of capital spending.", "explhtml": "<p><b>C is correct.<\/b> because the ratio of Total Capital Expenditures % to Total Asset % is<\/p><p>1.140 (27.6%/24.2%). A ratio greater than 1 indicates that the company is growing the segment; the segment is receiving a \"growth allocation\" of capital spending.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Financial Statement Analysis · Rosina Fredrickson<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rosina Fredrickson is a financial analyst evaluating Willow plc, a UK-based company that reports under IFRS.<\/p><p>Fredrickson examines Cedar Ltd., a 20%-owned equity investment that Willow acquired on 1 January of the most recent year for £5.0 million. At the time of acquisition, the book values of all of Cedar's assets and liabilities were equal to their fair values. During the most recent year, Cedar incurred a net loss of £300,000, and declared and paid dividends of £22,000. Willow accounts for its investment in Cedar using the equity method.<\/p><p>Fredrickson then evaluates Willow's geographic segment growth for the most recent year by compiling the information in Exhibit 1.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-011.webp\" style=\"max-width:min(100%,324px)\" alt=\"EBIT % of Total % of Total Segment Margin % Assets Capital Expenditures Asia 19.1 27.6 27.3 Europe 14.7 48.2 45.1 Americas 17.5 24.2 27.6\"><p>Frederickson observes that during the past three years, Willow's M-scores (according to the Beneish model) and Z-scores (according to the Altman model) have both trended lower.<\/p><p>As a final step in her analysis, Fredrickson calculates and evaluates the accruals ratios for Willow, as presented in Exhibit 2.<\/p><p><b>Exhibit 2:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-012.webp\" style=\"max-width:min(100%,324px)\" alt=\"Most Two Recent Prior Years Year Year Ago Cash-flow-based accruals ratio 1.8% -2.2% -2.5% Balance-sheet-based accruals -1.9% -1.6% 1.6%\"><p>ratio<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the geographic segment analysis, which segment is receiving a growth<\/p><p>allocation of capital?<\/p><\/div>", "subj": "fsa"}, {"n": 31, "q": "A deterioration in the quality of Willow's financial reports is most likely indicated by the trend in:", "opts": ["its M-scores only.", "its Z-scores only.", "both its M-scores and its Z-scores."], "ans": "B", "expl": "B is correct. because the interpretation of the Z-score is that a higher Z-score is better. Willow's Z-scores have trended lower during the past three-year period and may therefore be of concern to the analyst.", "explhtml": "<p><b>B is correct.<\/b> because the interpretation of the Z-score is that a higher Z-score is<\/p><p>better. Willow's Z-scores have trended lower during the past three-year period and may therefore be of concern to the analyst.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Financial Statement Analysis · Rosina Fredrickson<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rosina Fredrickson is a financial analyst evaluating Willow plc, a UK-based company that reports under IFRS.<\/p><p>Fredrickson examines Cedar Ltd., a 20%-owned equity investment that Willow acquired on 1 January of the most recent year for £5.0 million. At the time of acquisition, the book values of all of Cedar's assets and liabilities were equal to their fair values. During the most recent year, Cedar incurred a net loss of £300,000, and declared and paid dividends of £22,000. Willow accounts for its investment in Cedar using the equity method.<\/p><p>Fredrickson then evaluates Willow's geographic segment growth for the most recent year by compiling the information in Exhibit 1.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-011.webp\" style=\"max-width:min(100%,324px)\" alt=\"EBIT % of Total % of Total Segment Margin % Assets Capital Expenditures Asia 19.1 27.6 27.3 Europe 14.7 48.2 45.1 Americas 17.5 24.2 27.6\"><p>Frederickson observes that during the past three years, Willow's M-scores (according to the Beneish model) and Z-scores (according to the Altman model) have both trended lower.<\/p><p>As a final step in her analysis, Fredrickson calculates and evaluates the accruals ratios for Willow, as presented in Exhibit 2.<\/p><p><b>Exhibit 2:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-012.webp\" style=\"max-width:min(100%,324px)\" alt=\"Most Two Recent Prior Years Year Year Ago Cash-flow-based accruals ratio 1.8% -2.2% -2.5% Balance-sheet-based accruals -1.9% -1.6% 1.6%\"><p>ratio<\/p><\/div><\/details><div class=\"qtext\"><p>A deterioration in the quality of Willow's financial reports is most likely indicated by<\/p><p>the trend in:<\/p><\/div>", "subj": "fsa"}, {"n": 32, "q": "Willow's accruals ratio information demonstrates improvement in:", "opts": ["its cash-flow-based accruals ratios only.", "its balance-sheet-based accruals ratios only.", "both its cash-flow-based accruals ratio and its balance-sheet-based accruals ratio."], "ans": "A", "expl": "A is correct. because the absolute values of the balance-sheet-based accruals ratios have trended higher (2 years ago: 1.6, prior year: 1.6, most recent year: 1.9) and are therefore deteriorating, whereas the absolute values of the cash-flow-based accruals ratios have trended lower (2 years ago: 2.5, prior year: 2.2, most recent year: 1.8) and are therefore improving. The analyst would have been more concerned if the absolute level of the accruals ratios were high; even more worrisome would have been if they were consistently trending higher.", "explhtml": "<p><b>A is correct.<\/b> because the absolute values of the balance-sheet-based accruals ratios<\/p><p>have trended higher (2 years ago: 1.6, prior year: 1.6, most recent year: 1.9) and are therefore deteriorating, whereas the absolute values of the cash-flow-based accruals ratios have trended lower (2 years ago: 2.5, prior year: 2.2, most recent year: 1.8) and are therefore improving. The analyst would have been more concerned if the absolute level of the accruals ratios were high; even more worrisome would have been if they were consistently trending higher.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Financial Statement Analysis · Rosina Fredrickson<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rosina Fredrickson is a financial analyst evaluating Willow plc, a UK-based company that reports under IFRS.<\/p><p>Fredrickson examines Cedar Ltd., a 20%-owned equity investment that Willow acquired on 1 January of the most recent year for £5.0 million. At the time of acquisition, the book values of all of Cedar's assets and liabilities were equal to their fair values. During the most recent year, Cedar incurred a net loss of £300,000, and declared and paid dividends of £22,000. Willow accounts for its investment in Cedar using the equity method.<\/p><p>Fredrickson then evaluates Willow's geographic segment growth for the most recent year by compiling the information in Exhibit 1.<\/p><p><b>Exhibit 1:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-011.webp\" style=\"max-width:min(100%,324px)\" alt=\"EBIT % of Total % of Total Segment Margin % Assets Capital Expenditures Asia 19.1 27.6 27.3 Europe 14.7 48.2 45.1 Americas 17.5 24.2 27.6\"><p>Frederickson observes that during the past three years, Willow's M-scores (according to the Beneish model) and Z-scores (according to the Altman model) have both trended lower.<\/p><p>As a final step in her analysis, Fredrickson calculates and evaluates the accruals ratios for Willow, as presented in Exhibit 2.<\/p><p><b>Exhibit 2:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-012.webp\" style=\"max-width:min(100%,324px)\" alt=\"Most Two Recent Prior Years Year Year Ago Cash-flow-based accruals ratio 1.8% -2.2% -2.5% Balance-sheet-based accruals -1.9% -1.6% 1.6%\"><p>ratio<\/p><\/div><\/details><div class=\"qtext\"><p>Willow's accruals ratio information demonstrates improvement in:<\/p><\/div>", "subj": "fsa"}, {"n": 33, "q": "The present value of growth opportunities implied by Company A's current stock price is closestto:", "opts": ["$13 per share.", "$16 per share.", "$19 per share."], "ans": "A", "expl": "A is correct. because the present value of growth opportunities (PVGO) for company A is $13. rojects. The actual value per share is the sum of the no-growth value per share anc he PVGO is defined as the forecasted total net present value of futur the present value of growth opportunities: VO = El/r + PVGO LULKU IIOHIUIC where VO is the current stock price El is the forecasted earnings for the next year r is the required return on equity Substituting the values: SA^SANI/AOAA 32 = (1.9 x (1 + 20%)) / 12% + PVGO 32 = 2.28 / 12% + PVGO Therefore PVGO = 32 - 19 = $13.", "explhtml": "<p><b>A is correct.<\/b> because the present value of growth opportunities (PVGO) for company<\/p><p>A is $13. rojects. The actual value per share is the sum of the no-growth value per share anc he PVGO is defined as the forecasted total net present value of futur the present value of growth opportunities: VO = El/r + PVGO LULKU IIOHIUIC<\/p><p>where VO is the current stock price El is the forecasted earnings for the next year r is the required return on equity Substituting the values: SA^SANI/AOAA 32 = (1.9 x (1 + 20%)) / 12% + PVGO 32 = 2.28 / 12% + PVGO Therefore PVGO = 32 - 19 = $13.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Equity Valuation · Sharmeen Silva<\/summary><div class=\"vig-body\"><p>Sharmeen Silva is an analyst valuing several companies in her coverage universe.<\/p><p>Silva first values Company A, a manufacturer of bakery products. She calculates the company's present value of growth opportunities, using the following information:<\/p><p>• Company A's stock trades at $32.00 per share • EPS for the most recent year was $1.90 and is expected to grow by 20% this year • Required return on equity is 12%<\/p><p>Silva next values Company B, a mature company with a stable dividend policy. She assumes that Company B's capital structure will remain constant throughout the investment horizon. Silva gathers information for the year just ended in Exhibit 1 and uses DuPont analysis to calculate Company B's sustainable growth rate.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-013.webp\" style=\"max-width:min(100%,322px)\" alt=\"Net profit margin 13.2% Asset turnover ratio 0.40 D/E ratio 0.60 Financial leverage ratio 1.60 Dividend payout ratio 45%\"><p>Silva then values Company C, a utility company, using a single-stage residual income model. She gathers the following information about the company:<\/p><p>• Current stock price is $64.00 per share • Current book value is $40.00 per share • Expected long-term ROE is 16% • Sustainable growth rate is 4% • Cost of equity is 12%<\/p><p>Silva considers the stock to be fairly valued if the stock price is within 10% of her intrinsic value estimate.<\/p><p>Silva uses the residual income model to value Company D, a technology company. She notices that Company D has reported significant negative other comprehensive income for the past several years as a result of foreign currency translation losses, and she expects this trend to persist in the future. Silva considers what adjustments to company D's reported financial statements are appropriate to apply the residual income model.<\/p><\/div><\/details><div class=\"qtext\"><p>The present value of growth opportunities implied by Company A's current stock price<\/p><p>is closestto:<\/p><\/div>", "subj": "equity"}, {"n": 34, "q": "Company B's sustainable growth rate is closest to:", "opts": ["1.7%.", "3.8%.", "4.6%."], "ans": "C", "expl": "C is correct. because the sustainable growth rate as per DuPont analysis is 4.7%. The expression to calculate the sustainable dividend growth rate is g = Earnings retention ratio × ROE The ROE component can be further broken down: g= Earnings retention ratio × Net profit margin × Asset turnover ratio × Financial leverage Earnings retention ratio = 1 - Dividend payout ratio = 1 - 0.45 = 0.55 Net Profit Margin = 13.2% Asset turnover Ratio = 0.40 Financial leverage = 1.60 g = 0.55 x 13.2% × 0.40 x 1.60 g = 4.6464% × 4.6%.", "explhtml": "<p><b>C is correct.<\/b> because the sustainable growth rate as per DuPont analysis is 4.7%.<\/p><p>The expression to calculate the sustainable dividend growth rate is g = Earnings retention ratio × ROE The ROE component can be further broken down: g= Earnings retention ratio × Net profit margin × Asset turnover ratio × Financial leverage Earnings retention ratio = 1 - Dividend payout ratio = 1 - 0.45 = 0.55 Net Profit Margin = 13.2% Asset turnover Ratio = 0.40 Financial leverage = 1.60 g = 0.55 x 13.2% × 0.40 x 1.60 g = 4.6464% × 4.6%.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Equity Valuation · Sharmeen Silva<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sharmeen Silva is an analyst valuing several companies in her coverage universe.<\/p><p>Silva first values Company A, a manufacturer of bakery products. She calculates the company's present value of growth opportunities, using the following information:<\/p><p>• Company A's stock trades at $32.00 per share • EPS for the most recent year was $1.90 and is expected to grow by 20% this year • Required return on equity is 12%<\/p><p>Silva next values Company B, a mature company with a stable dividend policy. She assumes that Company B's capital structure will remain constant throughout the investment horizon. Silva gathers information for the year just ended in Exhibit 1 and uses DuPont analysis to calculate Company B's sustainable growth rate.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-013.webp\" style=\"max-width:min(100%,322px)\" alt=\"Net profit margin 13.2% Asset turnover ratio 0.40 D/E ratio 0.60 Financial leverage ratio 1.60 Dividend payout ratio 45%\"><p>Silva then values Company C, a utility company, using a single-stage residual income model. She gathers the following information about the company:<\/p><p>• Current stock price is $64.00 per share • Current book value is $40.00 per share • Expected long-term ROE is 16% • Sustainable growth rate is 4% • Cost of equity is 12%<\/p><p>Silva considers the stock to be fairly valued if the stock price is within 10% of her intrinsic value estimate.<\/p><p>Silva uses the residual income model to value Company D, a technology company. She notices that Company D has reported significant negative other comprehensive income for the past several years as a result of foreign currency translation losses, and she expects this trend to persist in the future. Silva considers what adjustments to company D's reported financial statements are appropriate to apply the residual income model.<\/p><\/div><\/details><div class=\"qtext\"><p>Company B's sustainable growth rate is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 35, "q": "Using the single-stage residual income model, Silva should consider Company C's stock to be:", "opts": ["undervalued.", "fairly valued.", "overvalued."], "ans": "B", "expl": "B is correct. because Company C's intrinsic stock value using the residual income model is $60 and the current stock price of $64 is within the 10% range ($54 to $66), hence it is fairly valued based on Silva's assumptions. A stock's intrinsic value under the residual income model, assuming constant growth, can be expressed as: VO = BO + [(ROE - r) / (r - 9)]× BO where VO = value of a share of stock today BO = current per-share book value of equity r = required rate of return on equity investment (cost of equity) ROE = return on equity g = sustainable growth rate Substituting the values from the case for Company C: VO = 40 + [(16% - 12%) / (12% - 4%)] × 40 = 40 + 20 = $60", "explhtml": "<p><b>B is correct.<\/b> because Company C's intrinsic stock value using the residual income<\/p><p>model is $60 and the current stock price of $64 is within the 10% range ($54 to $66), hence it is fairly valued based on Silva's assumptions. A stock's intrinsic value under the residual income model, assuming constant growth, can be expressed as: VO = BO + [(ROE - r) / (r - 9)]× BO where VO = value of a share of stock today BO = current per-share book value of equity r = required rate of return on equity investment (cost of equity) ROE = return on equity g = sustainable growth rate Substituting the values from the case for Company C: VO = 40 + [(16% - 12%) / (12% - 4%)] × 40 = 40 + 20 = $60<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Equity Valuation · Sharmeen Silva<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sharmeen Silva is an analyst valuing several companies in her coverage universe.<\/p><p>Silva first values Company A, a manufacturer of bakery products. She calculates the company's present value of growth opportunities, using the following information:<\/p><p>• Company A's stock trades at $32.00 per share • EPS for the most recent year was $1.90 and is expected to grow by 20% this year • Required return on equity is 12%<\/p><p>Silva next values Company B, a mature company with a stable dividend policy. She assumes that Company B's capital structure will remain constant throughout the investment horizon. Silva gathers information for the year just ended in Exhibit 1 and uses DuPont analysis to calculate Company B's sustainable growth rate.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-013.webp\" style=\"max-width:min(100%,322px)\" alt=\"Net profit margin 13.2% Asset turnover ratio 0.40 D/E ratio 0.60 Financial leverage ratio 1.60 Dividend payout ratio 45%\"><p>Silva then values Company C, a utility company, using a single-stage residual income model. She gathers the following information about the company:<\/p><p>• Current stock price is $64.00 per share • Current book value is $40.00 per share • Expected long-term ROE is 16% • Sustainable growth rate is 4% • Cost of equity is 12%<\/p><p>Silva considers the stock to be fairly valued if the stock price is within 10% of her intrinsic value estimate.<\/p><p>Silva uses the residual income model to value Company D, a technology company. She notices that Company D has reported significant negative other comprehensive income for the past several years as a result of foreign currency translation losses, and she expects this trend to persist in the future. Silva considers what adjustments to company D's reported financial statements are appropriate to apply the residual income model.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the single-stage residual income model, Silva should consider Company C's stock<\/p><p>to be:<\/p><\/div>", "subj": "equity"}, {"n": 36, "q": "Based on the model used by Silva, which of the following adjustments to Company D's reported financial statements is most appropriate?", "opts": ["Upward adjustment to both net income and book value", "Downward adjustment to both net income and book value", "Downward adjustment to net income and no adjustment to book value"], "ans": "C", "expl": "C is correct. because if the clean surplus relationship is violated due to items that bypass the income statement, appropriate adjustments need to be made to the income statement but not to the book value equity. In this case, the OCI is negative as foreign currency losses bypassed the income statement and are directly ad justed to the book equity. As a result, the book value of equity is still accurate and no adjustment is required. The adjustment required is to charge the losses to the income statement (instead of bypassing it), which will mean a downward adjustment to net income.", "explhtml": "<p><b>C is correct.<\/b> because if the clean surplus relationship is violated due to items that<\/p><p>bypass the income statement, appropriate adjustments need to be made to the income statement but not to the book value equity.<\/p><p>In this case, the OCI is negative as foreign currency losses bypassed the income statement and are directly ad justed to the book equity. As a result, the book value of equity is still accurate and no adjustment is required. The adjustment required is to charge the losses to the income statement (instead of bypassing it), which will mean a downward adjustment to net income.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Equity Valuation · Sharmeen Silva<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sharmeen Silva is an analyst valuing several companies in her coverage universe.<\/p><p>Silva first values Company A, a manufacturer of bakery products. She calculates the company's present value of growth opportunities, using the following information:<\/p><p>• Company A's stock trades at $32.00 per share • EPS for the most recent year was $1.90 and is expected to grow by 20% this year • Required return on equity is 12%<\/p><p>Silva next values Company B, a mature company with a stable dividend policy. She assumes that Company B's capital structure will remain constant throughout the investment horizon. Silva gathers information for the year just ended in Exhibit 1 and uses DuPont analysis to calculate Company B's sustainable growth rate.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-013.webp\" style=\"max-width:min(100%,322px)\" alt=\"Net profit margin 13.2% Asset turnover ratio 0.40 D/E ratio 0.60 Financial leverage ratio 1.60 Dividend payout ratio 45%\"><p>Silva then values Company C, a utility company, using a single-stage residual income model. She gathers the following information about the company:<\/p><p>• Current stock price is $64.00 per share • Current book value is $40.00 per share • Expected long-term ROE is 16% • Sustainable growth rate is 4% • Cost of equity is 12%<\/p><p>Silva considers the stock to be fairly valued if the stock price is within 10% of her intrinsic value estimate.<\/p><p>Silva uses the residual income model to value Company D, a technology company. She notices that Company D has reported significant negative other comprehensive income for the past several years as a result of foreign currency translation losses, and she expects this trend to persist in the future. Silva considers what adjustments to company D's reported financial statements are appropriate to apply the residual income model.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the model used by Silva, which of the following adjustments to Company D's<\/p><p>reported financial statements is most appropriate?<\/p><\/div>", "subj": "equity"}, {"n": 37, "q": "Based on an analysis of comparable transactions, the fair takeover price (per share) for Horley is:", "opts": ["$30.00.", "$35.00.", "$43.75."], "ans": "C", "expl": "C is correct. because $43.75 per share is the fair takeover price calculated using comparable transaction analysis. Valuation estimates based on comparable transaction analysis include takeover premiums. Using the comparable transaction P/E ratio and Horley's EPS, the price per share is calculated as: Similar transactions P/E ratio × EPS of Horley =(17.5x $2.50) = $43.75", "explhtml": "<p><b>C is correct.<\/b> because $43.75 per share is the fair takeover price calculated using<\/p><p>comparable transaction analysis. Valuation estimates based on comparable transaction analysis include takeover premiums. Using the comparable transaction P/E ratio and Horley's EPS, the price per share is calculated as: Similar transactions P/E ratio × EPS of Horley =(17.5x $2.50) = $43.75<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Corporate Issuers · Justine Rachelle<\/summary><div class=\"vig-body\"><p>Justine Rachelle is the chief financial officer of Grafton, a packaging company. Rachelle is evaluating a potential acquisition of Horley, a glass packaging company with exposure to high-growth markets. Horley reported EPS of $2.50 in the most recent year and currently has a P/E ratio of 14.0. Available market data show that comparable companies currently trade at an average P/E ratio of 12.0, and comparable transactions were recently completed at an average P/E ratio of 17.5. Rachelle estimates the fair takeover price for Horley.<\/p><p>Rachelle analyzes the impact of the potential Horley acquisition on Grafton's earnings and builds pro forma financial statements. Rachelle plans to finance the acquisition with cash and new debt, and she expects Grafton's tax rate to remain at 25%. Rachelle forecasts income statement items (in $ millions) derived from synergies related to the merger, as shown in Exhibit 1. She uses this information to compute the pro forma increase in Grafton's net income following an acquisition of Horley.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-014.webp\" style=\"max-width:min(100%,322px)\" alt=\"Horley&#x27;s pre-tax earnings 120 Revenue synergies 55 Synergies due to cost savings 40 Increase in depreciation expense 25 Increase in interest expense 50\"><p>In conjunction with the potential acquisition, Rachelle has been asked to explore restructuring options for Grafton's existing metal packaging business line. She has two restructuring objectives: (1) improve liquidity by maximizing the immediate cash proceeds; and (2) transfer complete control of the business line to a third party.<\/p><p>Rachelle believes an acquisition of Horley would improve Grafton's long-term earnings potential. She uses the Grinold-Kroner model to estimate the market's forward-looking equity risk premium. Rachelle observes that nominal risk-free government bonds yield 4.0% and inflation-protected risk-free government bonds with the same maturity yield 1.2%. She estimates that the broad equity market dividend yield will be 5.5%, the P/E ratio will decline by 1.4% per year, and real earnings will grow by 2.1% per year. Rachelle does not expect any change in the number of shares outstanding.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on an analysis of comparable transactions, the fair takeover price (per share)<\/p><p>for Horley is:<\/p><\/div>", "subj": "corporate"}, {"n": 38, "q": "If the acquisition of Horley is completed, the increase (in $ millions) in Grafton's pro forma net income is:", "opts": ["45.", "105.", "140."], "ans": "B", "expl": "B is correct. because the increase in pro forma net income is $105 million, calculated as follows: Horley's pre-tax earnings = $120 million Revenue synergies = $55 million Synergies due to cost savings = $40 million Increase in depreciation expense = $25 million Increase in interest expense = $50 million Change in pre-tax earnings = $120 million + $55 million + $40 million - $25 million - $50 million = $140 million Increase in taxes = $140 million × 25% = $35 million Change in pro forma net income = $140 million - $35 million = $105 million", "explhtml": "<p><b>B is correct.<\/b> because the increase in pro forma net income is $105 million, calculated<\/p><p>as follows: Horley's pre-tax earnings = $120 million Revenue synergies = $55 million Synergies due to cost savings = $40 million Increase in depreciation expense = $25 million Increase in interest expense = $50 million Change in pre-tax earnings = $120 million + $55 million + $40 million - $25 million - $50 million = $140 million Increase in taxes = $140 million × 25% = $35 million Change in pro forma net income = $140 million - $35 million = $105 million<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Corporate Issuers · Justine Rachelle<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Justine Rachelle is the chief financial officer of Grafton, a packaging company. Rachelle is evaluating a potential acquisition of Horley, a glass packaging company with exposure to high-growth markets. Horley reported EPS of $2.50 in the most recent year and currently has a P/E ratio of 14.0. Available market data show that comparable companies currently trade at an average P/E ratio of 12.0, and comparable transactions were recently completed at an average P/E ratio of 17.5. Rachelle estimates the fair takeover price for Horley.<\/p><p>Rachelle analyzes the impact of the potential Horley acquisition on Grafton's earnings and builds pro forma financial statements. Rachelle plans to finance the acquisition with cash and new debt, and she expects Grafton's tax rate to remain at 25%. Rachelle forecasts income statement items (in $ millions) derived from synergies related to the merger, as shown in Exhibit 1. She uses this information to compute the pro forma increase in Grafton's net income following an acquisition of Horley.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-014.webp\" style=\"max-width:min(100%,322px)\" alt=\"Horley&#x27;s pre-tax earnings 120 Revenue synergies 55 Synergies due to cost savings 40 Increase in depreciation expense 25 Increase in interest expense 50\"><p>In conjunction with the potential acquisition, Rachelle has been asked to explore restructuring options for Grafton's existing metal packaging business line. She has two restructuring objectives: (1) improve liquidity by maximizing the immediate cash proceeds; and (2) transfer complete control of the business line to a third party.<\/p><p>Rachelle believes an acquisition of Horley would improve Grafton's long-term earnings potential. She uses the Grinold-Kroner model to estimate the market's forward-looking equity risk premium. Rachelle observes that nominal risk-free government bonds yield 4.0% and inflation-protected risk-free government bonds with the same maturity yield 1.2%. She estimates that the broad equity market dividend yield will be 5.5%, the P/E ratio will decline by 1.4% per year, and real earnings will grow by 2.1% per year. Rachelle does not expect any change in the number of shares outstanding.<\/p><\/div><\/details><div class=\"qtext\"><p>If the acquisition of Horley is completed, the increase (in $ millions) in Grafton's pro<\/p><p>forma net income is:<\/p><\/div>", "subj": "corporate"}, {"n": 39, "q": "Rachelle's restructuring objectives for the metal packaging business line would be best achieved through a:", "opts": ["spin off.", "divestiture.", "dividend recapitalization."], "ans": "B", "expl": "B is correct. because a divestiture, once complete, would satisfy both of Rachelle's objectives, as it would raise the most cash immediately and transfer control to the acquirer. After a sale, Grafton would no longer be exposed to the divested business because it has been exchanged for cash. The choice between selling and spinning off involves many variables, but often valuation is amongst the most significant.", "explhtml": "<p><b>B is correct.<\/b> because a divestiture, once complete, would satisfy both of Rachelle's<\/p><p>objectives, as it would raise the most cash immediately and transfer control to the acquirer. After a sale, Grafton would no longer be exposed to the divested business because it has been exchanged for cash. The choice between selling and spinning off involves many variables, but often valuation is amongst the most significant.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Corporate Issuers · Justine Rachelle<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Justine Rachelle is the chief financial officer of Grafton, a packaging company. Rachelle is evaluating a potential acquisition of Horley, a glass packaging company with exposure to high-growth markets. Horley reported EPS of $2.50 in the most recent year and currently has a P/E ratio of 14.0. Available market data show that comparable companies currently trade at an average P/E ratio of 12.0, and comparable transactions were recently completed at an average P/E ratio of 17.5. Rachelle estimates the fair takeover price for Horley.<\/p><p>Rachelle analyzes the impact of the potential Horley acquisition on Grafton's earnings and builds pro forma financial statements. Rachelle plans to finance the acquisition with cash and new debt, and she expects Grafton's tax rate to remain at 25%. Rachelle forecasts income statement items (in $ millions) derived from synergies related to the merger, as shown in Exhibit 1. She uses this information to compute the pro forma increase in Grafton's net income following an acquisition of Horley.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-014.webp\" style=\"max-width:min(100%,322px)\" alt=\"Horley&#x27;s pre-tax earnings 120 Revenue synergies 55 Synergies due to cost savings 40 Increase in depreciation expense 25 Increase in interest expense 50\"><p>In conjunction with the potential acquisition, Rachelle has been asked to explore restructuring options for Grafton's existing metal packaging business line. She has two restructuring objectives: (1) improve liquidity by maximizing the immediate cash proceeds; and (2) transfer complete control of the business line to a third party.<\/p><p>Rachelle believes an acquisition of Horley would improve Grafton's long-term earnings potential. She uses the Grinold-Kroner model to estimate the market's forward-looking equity risk premium. Rachelle observes that nominal risk-free government bonds yield 4.0% and inflation-protected risk-free government bonds with the same maturity yield 1.2%. She estimates that the broad equity market dividend yield will be 5.5%, the P/E ratio will decline by 1.4% per year, and real earnings will grow by 2.1% per year. Rachelle does not expect any change in the number of shares outstanding.<\/p><\/div><\/details><div class=\"qtext\"><p>Rachelle's restructuring objectives for the metal packaging business line would<\/p><p>be best achieved through a:<\/p><\/div>", "subj": "corporate"}, {"n": 40, "q": "Using the Grinold-Kroner model, the market's equity risk premium is closest to:", "opts": ["3.4%.", "5.0%.", "7.8%."], "ans": "B", "expl": "B is correct. because, using the Grinold-Kroner model, the equity risk premium (ERP) is 5.0%. ERP = Expected dividend yield + Expected change in P/E + Expected inflation + Expected growth rate in real earnings per share + Expected change in shares outstanding - Risk-free rate Expected dividend yield = 5.5% Expected change in P/E = -1.4% Expected inflation = (1 + YTM of government bond) / (1+ YTM of inflation-protected government bond) - 1 LULUU LIWIIIUIL = (1.040/1.012) - 1 = 2.77% ~ 2.8% Expected change in shares outstanding = 0% Expected growth rate in real earnings per share = 2.1% Risk-free rate = 4.0% ERP = 5.5% + (-1.4%) + 2.8% + 2.1% - 4.0% = 5.0%", "explhtml": "<p><b>B is correct.<\/b> because, using the Grinold-Kroner model, the equity risk premium (ERP)<\/p><p>is 5.0%. ERP = Expected dividend yield + Expected change in P/E + Expected inflation + Expected growth rate in real earnings per share + Expected change in shares outstanding - Risk-free rate Expected dividend yield = 5.5% Expected change in P/E = -1.4% Expected inflation = (1 + YTM of government bond) / (1+ YTM of inflation-protected government bond) - 1 LULUU LIWIIIUIL<\/p><p>= (1.040/1.012) - 1 = 2.77% ~ 2.8% Expected change in shares outstanding = 0% Expected growth rate in real earnings per share = 2.1% Risk-free rate = 4.0% ERP = 5.5% + (-1.4%) + 2.8% + 2.1% - 4.0% = 5.0%<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Corporate Issuers · Justine Rachelle<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Justine Rachelle is the chief financial officer of Grafton, a packaging company. Rachelle is evaluating a potential acquisition of Horley, a glass packaging company with exposure to high-growth markets. Horley reported EPS of $2.50 in the most recent year and currently has a P/E ratio of 14.0. Available market data show that comparable companies currently trade at an average P/E ratio of 12.0, and comparable transactions were recently completed at an average P/E ratio of 17.5. Rachelle estimates the fair takeover price for Horley.<\/p><p>Rachelle analyzes the impact of the potential Horley acquisition on Grafton's earnings and builds pro forma financial statements. Rachelle plans to finance the acquisition with cash and new debt, and she expects Grafton's tax rate to remain at 25%. Rachelle forecasts income statement items (in $ millions) derived from synergies related to the merger, as shown in Exhibit 1. She uses this information to compute the pro forma increase in Grafton's net income following an acquisition of Horley.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-014.webp\" style=\"max-width:min(100%,322px)\" alt=\"Horley&#x27;s pre-tax earnings 120 Revenue synergies 55 Synergies due to cost savings 40 Increase in depreciation expense 25 Increase in interest expense 50\"><p>In conjunction with the potential acquisition, Rachelle has been asked to explore restructuring options for Grafton's existing metal packaging business line. She has two restructuring objectives: (1) improve liquidity by maximizing the immediate cash proceeds; and (2) transfer complete control of the business line to a third party.<\/p><p>Rachelle believes an acquisition of Horley would improve Grafton's long-term earnings potential. She uses the Grinold-Kroner model to estimate the market's forward-looking equity risk premium. Rachelle observes that nominal risk-free government bonds yield 4.0% and inflation-protected risk-free government bonds with the same maturity yield 1.2%. She estimates that the broad equity market dividend yield will be 5.5%, the P/E ratio will decline by 1.4% per year, and real earnings will grow by 2.1% per year. Rachelle does not expect any change in the number of shares outstanding.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the Grinold-Kroner model, the market's equity risk premium is closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 41, "q": "The value of Bond A is closest to:", "opts": ["99.51.", "100.59.", "100.88. C. 100.88."], "ans": "B", "expl": "B is correct. because to value the callable bond, we use the backward induction method with the interest rate tree in Exhibit 1. If the value exceeds par (i.e., 100) at a node, we assume that the call option will be exercised and the bond's value will be replaced with par = 100. We then continue working backwards until the bond value at t = 0 is determined. At each node we assume that each up/down move occurs with equal probability (0.50). Cash flow at year 2 (up state) = par value + (par value x coupon rate) = 100 + 100 x 0.022 = 102.20. Present value at year 1 (up state) = VH= Cash flow/(1 + coupon rate) = 102.2/(1 + 0.024) = 99.80 Present Value at year 1 (downstate) = VL = 102.2/(1 + 0.0161) = 100.58, but this will be exercised at 100.00. Present Value at year 0 (probability-weighted present value) = C + (0.5 × VH+ 0.5 x VL)/ (1 + 1) = [2.2 + (0.5 x99.80 + 0.5 ×100.00)]/(1 + 0.015) = 100.59.", "explhtml": "<p><b>B is correct.<\/b> because to value the callable bond, we use the backward induction<\/p><p>method with the interest rate tree in Exhibit 1. If the value exceeds par (i.e., 100) at a node, we assume that the call option will be exercised and the bond's value will be replaced with par = 100. We then continue working backwards until the bond value at t = 0 is determined. At each node we assume that each up/down move occurs with equal probability (0.50). Cash flow at year 2 (up state) = par value + (par value x coupon rate) = 100 + 100 x 0.022 = 102.20. Present value at year 1 (up state) = VH= Cash flow/(1 + coupon rate) = 102.2/(1 + 0.024) = 99.80 Present Value at year 1 (downstate) = VL = 102.2/(1 + 0.0161) = 100.58, but this will be exercised at 100.00. Present Value at year 0 (probability-weighted present value) = C + (0.5 × VH+ 0.5 x VL)/ (1 + 1) = [2.2 + (0.5 x99.80 + 0.5 ×100.00)]/(1 + 0.015) = 100.59.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 41–44 · Fixed Income · Ken Jamison<\/summary><div class=\"vig-body\"><p>Ken Jamison is a fixed income portfolio manager valuing several bonds. He assumes interest rate volatility of 20% and constructs the default-free binomial interest rate tree in Exhibit 1. In the tree, branching from each node to a high state or a low state occurs with equal probability. He first uses the tree to value Bond A, a default-free 2- year bond with an annual coupon of 2.20%. Bond A is callable at its par value of 100 in one year.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-015.webp\" style=\"max-width:min(100%,257px)\" alt=\"Default-free Binomial Interest Rate Tree Year 0 Year 1 2.40% 1.50% 1.61%\"><p>To replace a maturing corporate issue in the portfolio, Jamison considers Bond B, which is callable at par in one year. Using the tree, he determines that the OAS for Bond B is currently 50 bps. Holding the market price constant, Jamison then assesses the effect on the OAS of a revised interest rate volatility assumption of 25%.<\/p><p>Jamison's portfolio includes Bond C, a corporate bond that is callable at par in one year. Bond C's market price is 99.40. Jamison calculates that its price would be 99.80 following an instantaneous 50 bps downward parallel shift in the par yield curve, and 96.80 following a 50 bps upward parallel shift. Jamison owns $10 million of El-Car's Series B senior bonds and has hedged the credit risk by purchasing $10 million notional of CDS protection. El-Car subsequently declares bankruptcy, which triggers its CDS contracts. El-Car has two senior bonds outstanding: Series A trades at 40% of par, and Series B trades at 45% of par.<\/p><\/div><\/details><div class=\"qtext\"><p>The value of Bond A is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 42, "q": "Under Jamison's revised interest rate volatility assumption, the OAS for Bond B would:", "opts": ["decrease.", "not change.", "increase."], "ans": "A", "expl": "A is correct. because the OAS will decline as the assumed volatility increases from 20% to 25%. The value of a callable bond is equal to the value of an equivalent straight bond less the value of the call option. As the volatility is increased, the value of the straight bond component will not change since the term structure is not affected by this assumption. The model value of the callable bond (straight - call option) based on the new tree will, however, go down since the call option will be more valuable. The OAS is the constant spread that, when added to all the one-period forward rates on the interest rate tree, makes the arbitrage-free value of the bond equal to its market price. With the assumed increase in volatility lowering the model price for bond B, the OAS must be lowered to make the model price equal the market price.", "explhtml": "<p><b>A is correct.<\/b> because the OAS will decline as the assumed volatility increases from<\/p><p>20% to 25%. The value of a callable bond is equal to the value of an equivalent straight bond less the value of the call option. As the volatility is increased, the value of the straight bond component will not change since the term structure is not affected by this assumption. The model value of the callable bond (straight - call option) based on the new tree will, however, go down since the call option will be more valuable. The OAS is the constant spread that, when added to all the one-period forward rates on the interest rate tree, makes the arbitrage-free value of the bond equal to its market price. With the assumed increase in volatility lowering the model price for bond B, the OAS must be lowered to make the model price equal the market price.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 41–44 · Fixed Income · Ken Jamison<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ken Jamison is a fixed income portfolio manager valuing several bonds. He assumes interest rate volatility of 20% and constructs the default-free binomial interest rate tree in Exhibit 1. In the tree, branching from each node to a high state or a low state occurs with equal probability. He first uses the tree to value Bond A, a default-free 2- year bond with an annual coupon of 2.20%. Bond A is callable at its par value of 100 in one year.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-015.webp\" style=\"max-width:min(100%,257px)\" alt=\"Default-free Binomial Interest Rate Tree Year 0 Year 1 2.40% 1.50% 1.61%\"><p>To replace a maturing corporate issue in the portfolio, Jamison considers Bond B, which is callable at par in one year. Using the tree, he determines that the OAS for Bond B is currently 50 bps. Holding the market price constant, Jamison then assesses the effect on the OAS of a revised interest rate volatility assumption of 25%.<\/p><p>Jamison's portfolio includes Bond C, a corporate bond that is callable at par in one year. Bond C's market price is 99.40. Jamison calculates that its price would be 99.80 following an instantaneous 50 bps downward parallel shift in the par yield curve, and 96.80 following a 50 bps upward parallel shift. Jamison owns $10 million of El-Car's Series B senior bonds and has hedged the credit risk by purchasing $10 million notional of CDS protection. El-Car subsequently declares bankruptcy, which triggers its CDS contracts. El-Car has two senior bonds outstanding: Series A trades at 40% of par, and Series B trades at 45% of par.<\/p><\/div><\/details><div class=\"qtext\"><p>Under Jamison's revised interest rate volatility assumption, the OAS for Bond B<\/p><p>would:<\/p><\/div>", "subj": "fixed"}, {"n": 43, "q": "The interest rate sensitivity of Bond C is best described by:", "opts": ["modified duration.", "one-sided duration.", "two-sided effective duration."], "ans": "B", "expl": "B is correct. because one-sided durations better capture the interest rate sensitivity of a bond with an embedded option. When we shift the curve down by 50 bp, we can see that its price is 99.80 and there is downward pressure to the price increasing above par. When rates shift up, the price response (96.80) is much greater than for the downward shift and the bond behaves like a straight bond. Consequently one- sided durations gives us a better idea of the risk of this bond. Two-sided duration is the average of the two one-sided durations and would obscure the call/no-call effect. Modified duration does not work for callable bonds since callable bonds have cash flows that depend on interest rates.", "explhtml": "<p><b>B is correct.<\/b> because one-sided durations better capture the interest rate sensitivity<\/p><p>of a bond with an embedded option. When we shift the curve down by 50 bp, we can see that its price is 99.80 and there is downward pressure to the price const CFG = {"title": "CFA Premium Mock 3 — Session 1", "subtitle": "CFA Level II · 44 câu · 2h12p", "minutes": 132, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
