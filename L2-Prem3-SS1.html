</div>

<script>
const DATA = [{"n": 1, "q": "The 2-year forward rate one year from now is closest to:", "opts": ["3.78%.", "4.55%.", "6.52%."], "ans": "C", "expl": "C is correct. because the forward rate is calculated using the following formula: f(1,2) = [(1+ z3)3 / (1 + z1)1]0.5 - 1 = [(1.0534)3 / (1.0302)1]0.5 - 1 = 0.0652 = 6.52%.", "explhtml": "<p><b>C is correct.<\/b> because the forward rate is calculated using the following formula:<\/p><p>f(1,2) = [(1+ z3)3 / (1 + z1)1]0.5 - 1 = [(1.0534)3 / (1.0302)1]0.5 - 1 = 0.0652 = 6.52%.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Fixed Income · Tinker Asset Management, LLC<\/summary><div class=\"vig-body\"><p>Alexander Corey is an analyst at Tinker Asset Management, LLC. He is collecting data to estimate yields and bond values for Tinker's bond portfolio. Corey starts by determining current default-free spot rates in Exhibit 1. All bonds held in the portfolio have a par value of 100.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-001.webp\" style=\"max-width:min(100%,496px)\" alt=\"Maturity (years) Yield (%) 1 3.02 2 4.52 3 5.34\"><p>Using the data in Exhibit 1, Corey derives a table of forward rates to use in his analysis.<\/p><p>Corey also uses data in Exhibit 1 to value the following two annual-pay coupon, option- free bonds, both of which have a first payment in one year.<\/p><p>• Bond D: a 3.20% coupon, 3-year default-free bond • Bond E: a 5.00% coupon, 4-year default-free bond<\/p><p>To value Bond E, Corey determines the 4-year spot rate. He identifies a comparable 4- year bond with a YTM of 5.84% priced at par. He uses bootstrapping along with the rates in Exhibit 1 to calculate the 4-year spot rate.<\/p><p>Finally, Corey is asked to value an emerging market bond, Bond G, and uses the binomial interest rate tree shown in Exhibit 2. Bond G is a 2-year, 10% annual-pay coupon option- free and default-free bond. Corey assumes the branching from each node occurs with equal probability.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-002.webp\" style=\"max-width:min(100%,202px)\" alt=\"Binomial Interest Rate Tree Year 0 Year 1 9.28% 7.58% 6.87%\"><\/div><\/details><div class=\"qtext\"><p>The 2-year forward rate one year from now is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 2, "q": "The arbitrage-free value of Bond D is closest to:", "opts": ["93.76.", "94.21.", "94.32."], "ans": "C", "expl": "C is correct. because by the definition of arbitrage free value, cash flows are discounted by the associated spot rates to calculate the present value of the bond. With a 100 face value, an annual 3.2% coupon, and using the rates from Exhibit 1: P = 3.2 / (1.0302) + 3.2 / (1 + 0.452)2 + (100 + 3.2) / (1 + 0.0534)3 = 3.106193 + 2.929215 + 88.28761 • 94.32.", "explhtml": "<p><b>C is correct.<\/b> because by the definition of arbitrage free value, cash flows are<\/p><p>discounted by the associated spot rates to calculate the present value of the bond. With a 100 face value, an annual 3.2% coupon, and using the rates from Exhibit 1: P = 3.2 / (1.0302) + 3.2 / (1 + 0.452)2 + (100 + 3.2) / (1 + 0.0534)3 = 3.106193 + 2.929215 + 88.28761 • 94.32.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Fixed Income · Tinker Asset Management, LLC<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alexander Corey is an analyst at Tinker Asset Management, LLC. He is collecting data to estimate yields and bond values for Tinker's bond portfolio. Corey starts by determining current default-free spot rates in Exhibit 1. All bonds held in the portfolio have a par value of 100.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-001.webp\" style=\"max-width:min(100%,496px)\" alt=\"Maturity (years) Yield (%) 1 3.02 2 4.52 3 5.34\"><p>Using the data in Exhibit 1, Corey derives a table of forward rates to use in his analysis.<\/p><p>Corey also uses data in Exhibit 1 to value the following two annual-pay coupon, option- free bonds, both of which have a first payment in one year.<\/p><p>• Bond D: a 3.20% coupon, 3-year default-free bond • Bond E: a 5.00% coupon, 4-year default-free bond<\/p><p>To value Bond E, Corey determines the 4-year spot rate. He identifies a comparable 4- year bond with a YTM of 5.84% priced at par. He uses bootstrapping along with the rates in Exhibit 1 to calculate the 4-year spot rate.<\/p><p>Finally, Corey is asked to value an emerging market bond, Bond G, and uses the binomial interest rate tree shown in Exhibit 2. Bond G is a 2-year, 10% annual-pay coupon option- free and default-free bond. Corey assumes the branching from each node occurs with equal probability.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-002.webp\" style=\"max-width:min(100%,202px)\" alt=\"Binomial Interest Rate Tree Year 0 Year 1 9.28% 7.58% 6.87%\"><\/div><\/details><div class=\"qtext\"><p>The arbitrage-free value of Bond D is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 3, "q": "Based on the YTM of the comparable 4-year par bond, the 4-year spot rate is closest to:", "opts": ["5.60%.", "5.95%.", "7.35%."], "ans": "B", "expl": "B is correct. because bootstrapping is the method used to calculate zero rates from the par curve. This method requires a par rate, or a YTM of a bond trading at par, like the bond in question. From this YTM, zero rates are incrementally calculated to complete the entire curve. Based on the bootstrapping method, the 4-year spot rate, r(4), is calculated as: 1 = 0.0584 / (1 + 0.0302) + 0.0584 / (1 + 0.0452) 2 + 0.0584 / (1 + 0.0534) 3 + (1+ 0.0584) / (1 + r(4))4 = 0.056688 + 0.053458 + 0.049961 + 1.0584 / (1 + r(4)))4 0.839893 = 1.0584 / (1 + r(4))4 (1 + r(4))4 = 1.0584 / 0.839893 r(4) = (1.0584 / 0.839893)0.25 - 1 = 0.0595 = 5.95%.", "explhtml": "<p><b>B is correct.<\/b> because bootstrapping is the method used to calculate zero rates from<\/p><p>the par curve. This method requires a par rate, or a YTM of a bond trading at par, like the bond in question. From this YTM, zero rates are incrementally calculated to complete the entire curve. Based on the bootstrapping method, the 4-year spot rate, r(4), is calculated as: 1 = 0.0584 / (1 + 0.0302) + 0.0584 / (1 + 0.0452) 2 + 0.0584 / (1 + 0.0534) 3 + (1+ 0.0584) / (1 + r(4))4 = 0.056688 + 0.053458 + 0.049961 + 1.0584 / (1 + r(4)))4 0.839893 = 1.0584 / (1 + r(4))4 (1 + r(4))4 = 1.0584 / 0.839893 r(4) = (1.0584 / 0.839893)0.25 - 1 = 0.0595 = 5.95%.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Fixed Income · Tinker Asset Management, LLC<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alexander Corey is an analyst at Tinker Asset Management, LLC. He is collecting data to estimate yields and bond values for Tinker's bond portfolio. Corey starts by determining current default-free spot rates in Exhibit 1. All bonds held in the portfolio have a par value of 100.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-001.webp\" style=\"max-width:min(100%,496px)\" alt=\"Maturity (years) Yield (%) 1 3.02 2 4.52 3 5.34\"><p>Using the data in Exhibit 1, Corey derives a table of forward rates to use in his analysis.<\/p><p>Corey also uses data in Exhibit 1 to value the following two annual-pay coupon, option- free bonds, both of which have a first payment in one year.<\/p><p>• Bond D: a 3.20% coupon, 3-year default-free bond • Bond E: a 5.00% coupon, 4-year default-free bond<\/p><p>To value Bond E, Corey determines the 4-year spot rate. He identifies a comparable 4- year bond with a YTM of 5.84% priced at par. He uses bootstrapping along with the rates in Exhibit 1 to calculate the 4-year spot rate.<\/p><p>Finally, Corey is asked to value an emerging market bond, Bond G, and uses the binomial interest rate tree shown in Exhibit 2. Bond G is a 2-year, 10% annual-pay coupon option- free and default-free bond. Corey assumes the branching from each node occurs with equal probability.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-002.webp\" style=\"max-width:min(100%,202px)\" alt=\"Binomial Interest Rate Tree Year 0 Year 1 9.28% 7.58% 6.87%\"><\/div><\/details><div class=\"qtext\"><p>Based on the YTM of the comparable 4-year par bond, the 4-year spot rate<\/p><p>is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 4, "q": "The price of Bond G is closest to:", "opts": ["95.31.", "103.92.", "104.61."], "ans": "B", "expl": "B is correct. because the bond value at a node = C+ (0.5 × VH+ 0.5 × VL) / (1 + i) where C = future coupon payment, VH =average of the value for the forward rate being higher, VL = average of the value for the forward rate being lower, i= one-year forward rate prevailing at the beginning of the time period i, at Time T. Using the values from the binomial interest rate tree: V = 10 / 1.0758 + 0.5 ((110 / (1.0758 × 1.0928) + 110 / (1.0758 x 1.0687)) = 9.295408 + 0.5 (93.56652 + 95.67651) = 103.917 - 103.92.", "explhtml": "<p><b>B is correct.<\/b> because the bond value at a node = C+ (0.5 × VH+ 0.5 × VL) / (1 + i)<\/p><p>where C = future coupon payment, VH =average of the value for the forward rate being higher, VL = average of the value for the forward rate being lower, i= one-year forward rate prevailing at the beginning of the time period i, at Time T. Using the values from the binomial interest rate tree: V = 10 / 1.0758 + 0.5 ((110 / (1.0758 × 1.0928) + 110 / (1.0758 x 1.0687)) = 9.295408 + 0.5 (93.56652 + 95.67651) = 103.917 - 103.92.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Fixed Income · Tinker Asset Management, LLC<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alexander Corey is an analyst at Tinker Asset Management, LLC. He is collecting data to estimate yields and bond values for Tinker's bond portfolio. Corey starts by determining current default-free spot rates in Exhibit 1. All bonds held in the portfolio have a par value of 100.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-001.webp\" style=\"max-width:min(100%,496px)\" alt=\"Maturity (years) Yield (%) 1 3.02 2 4.52 3 5.34\"><p>Using the data in Exhibit 1, Corey derives a table of forward rates to use in his analysis.<\/p><p>Corey also uses data in Exhibit 1 to value the following two annual-pay coupon, option- free bonds, both of which have a first payment in one year.<\/p><p>• Bond D: a 3.20% coupon, 3-year default-free bond • Bond E: a 5.00% coupon, 4-year default-free bond<\/p><p>To value Bond E, Corey determines the 4-year spot rate. He identifies a comparable 4- year bond with a YTM of 5.84% priced at par. He uses bootstrapping along with the rates in Exhibit 1 to calculate the 4-year spot rate.<\/p><p>Finally, Corey is asked to value an emerging market bond, Bond G, and uses the binomial interest rate tree shown in Exhibit 2. Bond G is a 2-year, 10% annual-pay coupon option- free and default-free bond. Corey assumes the branching from each node occurs with equal probability.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-002.webp\" style=\"max-width:min(100%,202px)\" alt=\"Binomial Interest Rate Tree Year 0 Year 1 9.28% 7.58% 6.87%\"><\/div><\/details><div class=\"qtext\"><p>The price of Bond G is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 5, "q": "Based on the regression results for Model 1:", "opts": ["the intercept is not statistically significant.", "a 1% increase in GDP will lead to an expected increase of 3.225% in ROE.", "30.1% of the variation in the dependent variable is explained by the independent variables."], "ans": "B", "expl": "B is correct. because the model is statistically significant and the GDP variable is statistically significant. The coefficient of the GDP variable is 3.225, which implies that every 1% increase in GDP leads to an expected increase in ROE of 3.225%.", "explhtml": "<p><b>B is correct.<\/b> because the model is statistically significant and the GDP variable is<\/p><p>statistically significant. The coefficient of the GDP variable is 3.225, which implies that every 1% increase in GDP leads to an expected increase in ROE of 3.225%.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Quantitative Methods · Anya Singh<\/summary><div class=\"vig-body\"><p>Anya Singh is an analyst with a central bank. She is developing a model to explain variations in the aggregate ROE for the banking sector using economic and fundamental factors. She collects annual data and estimates Model 1, a two-factor regression model, using the following equation:<\/p><p>ROE+= bo + bGDP++ bzINFL++Et<\/p><p>where ROE is the aggregate ROE, GDP is the GDP growth rate, and INFL is the inflation rate. All variables are in % (1% is represented as 1.0).<\/p><p>Singh presents the ANOVA results for Model 1 in Exhibit 1. She uses a critical t-value of 2.15 for hypothesis tests.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-003.webp\" style=\"max-width:min(100%,238px)\" alt=\"R° 0.699\"><p>Adjusted R 0.599 Coefficient t-Statistic<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-004.webp\" style=\"max-width:min(100%,229px)\" alt=\"Intercept -15.798 -2.660 GDP 3.225 3.135 INFL 0.784 2.971\"><p>Singh extends Model 1 into a three-factor regression model, Model 2, by adding NPL (non-performing loans as a % of all loans). She then extends Model 2 into a four-factor regression model, Model 3, by adding LENDRATE (average bank lending rate in %).<\/p><p>Singh observes that the residuals from estimating Model 3 are more dispersed for observations that have a higher LENDRATE. She considers how to correct for this issue.<\/p><p>Singh next tests for multicollinearity among the independent variables. The variance inflation factors (VIFs) for Model 3 are reported in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-005.webp\" style=\"max-width:min(100%,202px)\" alt=\"Independent Variable VIF GDP 1.013 INFL 2.513 NPL 2.290 LENDRATE 1.490\"><p>Separately, Singh is developing a machine-learning model to forecast ROE for individual banks by classifying them into 'high ROE' and 'low ROE' categories, based on the chosen set of variables. She sets the following criteria for the model:<\/p><p>• It should be easy to interpret and visualize. • It should be appropriate for complex and non-linear data. • It should use all of the variables identified in Model 3 for training the algorithm.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the regression results for Model 1:<\/p><\/div>", "subj": "quant"}, {"n": 6, "q": "Based on her observation about the residuals from Model 3, Singh should:", "opts": ["increase the sample size.", "compute robust standard errors.", "exclude influential data points from the analysis."], "ans": "B", "expl": "B is correct. because the fact that the residuals are more dispersed for observations that have a higher LENDRATE represents conditional heteroskedasticity. An important assumption underlying linear regression is that the variance of errors is constant across observations (errors are homoskedastic). Residuals in financial model estimations, however, are often heteroskedastic, meaning the variance of the residuals differs across observations. Conditional heteroskedasticity is problematic for statistical inference—when the error variance is correlated with (conditional on) the values of the independent variables. This type of heteroskedasticity may lead to mistakes in statistical inference. When errors are conditional heteroskedastic, t- tests of individual regression coefficients are unreliable because heteroskedasticity introduces bias into estimators of the standard error of regression coefficients. The easiest method to correct for the effects of conditional heteroskedasticity in linear regression is to compute robust standard errors, which adjusts the standard errors of the regression's estimated coefficients to account for the heteroskedasticity.", "explhtml": "<p><b>B is correct.<\/b> because the fact that the residuals are more dispersed for observations<\/p><p>that have a higher LENDRATE represents conditional heteroskedasticity. An important assumption underlying linear regression is that the variance of errors is constant across observations (errors are homoskedastic). Residuals in financial model estimations, however, are often heteroskedastic, meaning the variance of the residuals differs across observations. Conditional heteroskedasticity is problematic for statistical inference—when the error variance is correlated with (conditional on) the values of the independent variables. This type of heteroskedasticity may lead to mistakes in statistical inference. When errors are conditional heteroskedastic, t- tests of individual regression coefficients are unreliable because heteroskedasticity introduces bias into estimators of the standard error of regression coefficients. The easiest method to correct for the effects of conditional heteroskedasticity in linear regression is to compute robust standard errors, which adjusts the standard errors of the regression's estimated coefficients to account for the heteroskedasticity.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Quantitative Methods · Anya Singh<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Anya Singh is an analyst with a central bank. She is developing a model to explain variations in the aggregate ROE for the banking sector using economic and fundamental factors. She collects annual data and estimates Model 1, a two-factor regression model, using the following equation:<\/p><p>ROE+= bo + bGDP++ bzINFL++Et<\/p><p>where ROE is the aggregate ROE, GDP is the GDP growth rate, and INFL is the inflation rate. All variables are in % (1% is represented as 1.0).<\/p><p>Singh presents the ANOVA results for Model 1 in Exhibit 1. She uses a critical t-value of 2.15 for hypothesis tests.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-003.webp\" style=\"max-width:min(100%,238px)\" alt=\"R° 0.699\"><p>Adjusted R 0.599 Coefficient t-Statistic<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-004.webp\" style=\"max-width:min(100%,229px)\" alt=\"Intercept -15.798 -2.660 GDP 3.225 3.135 INFL 0.784 2.971\"><p>Singh extends Model 1 into a three-factor regression model, Model 2, by adding NPL (non-performing loans as a % of all loans). She then extends Model 2 into a four-factor regression model, Model 3, by adding LENDRATE (average bank lending rate in %).<\/p><p>Singh observes that the residuals from estimating Model 3 are more dispersed for observations that have a higher LENDRATE. She considers how to correct for this issue.<\/p><p>Singh next tests for multicollinearity among the independent variables. The variance inflation factors (VIFs) for Model 3 are reported in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-005.webp\" style=\"max-width:min(100%,202px)\" alt=\"Independent Variable VIF GDP 1.013 INFL 2.513 NPL 2.290 LENDRATE 1.490\"><p>Separately, Singh is developing a machine-learning model to forecast ROE for individual banks by classifying them into 'high ROE' and 'low ROE' categories, based on the chosen set of variables. She sets the following criteria for the model:<\/p><p>• It should be easy to interpret and visualize. • It should be appropriate for complex and non-linear data. • It should use all of the variables identified in Model 3 for training the algorithm.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on her observation about the residuals from Model 3, Singh should:<\/p><\/div>", "subj": "quant"}, {"n": 7, "q": "Do any of the VIF values for Model 3 warrant further investigation of multicollinearity?", "opts": ["No", "Yes, the VIFs for INFL and NPL", "Yes, the VIFs for GDP and LENDRATE"], "ans": "A", "expl": "A is correct. because the VIF value for each of the independent variables is under 5, indicating that the error variances of the estimated variable coefficients are not inflated and further investigation on multicollinearity is not necessary. The variance inflation factor (VIF) is a measure for quantifying multicollinearity. If VIFjis 1 for Xj, then there is no correlation between Xj and the other regressors. VIFj> 5 warrants further investigation, and VIFj> 10 indicates serious multicollinearity requiring correction.", "explhtml": "<p><b>A is correct.<\/b> because the VIF value for each of the independent variables is under 5,<\/p><p>indicating that the error variances of the estimated variable coefficients are not inflated and further investigation on multicollinearity is not necessary. The variance inflation factor (VIF) is a measure for quantifying multicollinearity. If VIFjis 1 for Xj, then there is no correlation between Xj and the other regressors. VIFj&gt; 5 warrants further investigation, and VIFj&gt; 10 indicates serious multicollinearity requiring correction.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Quantitative Methods · Anya Singh<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Anya Singh is an analyst with a central bank. She is developing a model to explain variations in the aggregate ROE for the banking sector using economic and fundamental factors. She collects annual data and estimates Model 1, a two-factor regression model, using the following equation:<\/p><p>ROE+= bo + bGDP++ bzINFL++Et<\/p><p>where ROE is the aggregate ROE, GDP is the GDP growth rate, and INFL is the inflation rate. All variables are in % (1% is represented as 1.0).<\/p><p>Singh presents the ANOVA results for Model 1 in Exhibit 1. She uses a critical t-value of 2.15 for hypothesis tests.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-003.webp\" style=\"max-width:min(100%,238px)\" alt=\"R° 0.699\"><p>Adjusted R 0.599 Coefficient t-Statistic<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-004.webp\" style=\"max-width:min(100%,229px)\" alt=\"Intercept -15.798 -2.660 GDP 3.225 3.135 INFL 0.784 2.971\"><p>Singh extends Model 1 into a three-factor regression model, Model 2, by adding NPL (non-performing loans as a % of all loans). She then extends Model 2 into a four-factor regression model, Model 3, by adding LENDRATE (average bank lending rate in %).<\/p><p>Singh observes that the residuals from estimating Model 3 are more dispersed for observations that have a higher LENDRATE. She considers how to correct for this issue.<\/p><p>Singh next tests for multicollinearity among the independent variables. The variance inflation factors (VIFs) for Model 3 are reported in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-005.webp\" style=\"max-width:min(100%,202px)\" alt=\"Independent Variable VIF GDP 1.013 INFL 2.513 NPL 2.290 LENDRATE 1.490\"><p>Separately, Singh is developing a machine-learning model to forecast ROE for individual banks by classifying them into 'high ROE' and 'low ROE' categories, based on the chosen set of variables. She sets the following criteria for the model:<\/p><p>• It should be easy to interpret and visualize. • It should be appropriate for complex and non-linear data. • It should use all of the variables identified in Model 3 for training the algorithm.<\/p><\/div><\/details><div class=\"qtext\"><p>Do any of the VIF values for Model 3 warrant further investigation of<\/p><p>multicollinearity?<\/p><\/div>", "subj": "quant"}, {"n": 8, "q": "Based on Singh's criteria, which of the following is the most suitable machine- learning model to classify the banks?", "opts": ["K-means clustering", "Support vector machine (SVM)", "Classification and regression tree (CART)"], "ans": "C", "expl": "C is correct. because CART is a supervised machine-learning (ML) algorithm. The CART model is an algorithm for addressing classification problems. Its ability to handle complex, non-linear relationships makes it a good choice to address the modeling problem at hand. An important advantage of CART is that its results are relatively straightforward to visualize and interpret. This makes CART the most suitable ML model to meet Singh's objectives below: 1. The model should be easy to interpret and visualize. 2. The model should be appropriate for complex and non-linear data. 3. The model should use all of the variables identified in Model 3 for training the algorithm. A supervised ML model is appropriate as it requires classification of the banks into 'high ROE' and 'low ROE' categories, based on inference of patterns between the identified input variables/features and the desired output. This implies labelled data, i.e. a dataset which contains a matched set of observed inputs and the associated outputs.", "explhtml": "<p><b>C is correct.<\/b> because CART is a supervised machine-learning (ML) algorithm. The<\/p><p>CART model is an algorithm for addressing classification problems. Its ability to handle complex, non-linear relationships makes it a good choice to address the modeling problem at hand. An important advantage of CART is that its results are relatively straightforward to visualize and interpret. This makes CART the most suitable ML model to meet Singh's objectives below:<\/p><p>1. The model should be easy to interpret and visualize. 2. The model should be appropriate for complex and non-linear data. 3. The model should use all of the variables identified in Model 3 for training the algorithm. A supervised ML model is appropriate as it requires classification of the banks into 'high ROE' and 'low ROE' categories, based on inference of patterns between the identified input variables/features and the desired output. This implies labelled data, i.e. a dataset which contains a matched set of observed inputs and the associated outputs.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Quantitative Methods · Anya Singh<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Anya Singh is an analyst with a central bank. She is developing a model to explain variations in the aggregate ROE for the banking sector using economic and fundamental factors. She collects annual data and estimates Model 1, a two-factor regression model, using the following equation:<\/p><p>ROE+= bo + bGDP++ bzINFL++Et<\/p><p>where ROE is the aggregate ROE, GDP is the GDP growth rate, and INFL is the inflation rate. All variables are in % (1% is represented as 1.0).<\/p><p>Singh presents the ANOVA results for Model 1 in Exhibit 1. She uses a critical t-value of 2.15 for hypothesis tests.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-003.webp\" style=\"max-width:min(100%,238px)\" alt=\"R° 0.699\"><p>Adjusted R 0.599 Coefficient t-Statistic<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-004.webp\" style=\"max-width:min(100%,229px)\" alt=\"Intercept -15.798 -2.660 GDP 3.225 3.135 INFL 0.784 2.971\"><p>Singh extends Model 1 into a three-factor regression model, Model 2, by adding NPL (non-performing loans as a % of all loans). She then extends Model 2 into a four-factor regression model, Model 3, by adding LENDRATE (average bank lending rate in %).<\/p><p>Singh observes that the residuals from estimating Model 3 are more dispersed for observations that have a higher LENDRATE. She considers how to correct for this issue.<\/p><p>Singh next tests for multicollinearity among the independent variables. The variance inflation factors (VIFs) for Model 3 are reported in Exhibit 2.<\/p><p><b>Exhibit 2<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-005.webp\" style=\"max-width:min(100%,202px)\" alt=\"Independent Variable VIF GDP 1.013 INFL 2.513 NPL 2.290 LENDRATE 1.490\"><p>Separately, Singh is developing a machine-learning model to forecast ROE for individual banks by classifying them into 'high ROE' and 'low ROE' categories, based on the chosen set of variables. She sets the following criteria for the model:<\/p><p>• It should be easy to interpret and visualize. • It should be appropriate for complex and non-linear data. • It should use all of the variables identified in Model 3 for training the algorithm.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Singh's criteria, which of the following is the most suitable machine-<\/p><p>learning model to classify the banks?<\/p><\/div>", "subj": "quant"}, {"n": 9, "q": "Which large-cap equity strategy offers the most attractive statistical properties for a risk-averse investor?", "opts": ["Strategy A", "Strategy B", "Strategy C"], "ans": "C", "expl": "C is correct. because this strategy should be most attractive to the risk-averse investor. Strategy B is not attractive because has negative skewness and high excess kurtosis (> 3) signifying higher probability of losses as well as higher losses when losses occur. For a risk-averse investor, the choice falls between Strategy A and Strategy C. Strategy C is better because of positive skew and having the lowest Lintocic comnonod to Ctnntom Aand Rhath of which hac nonntiuo chow and hinhon kurtosis compared to Strategy A and B both of which has negative skew and higher excess kurtosis.", "explhtml": "<p><b>C is correct.<\/b> because this strategy should be most attractive to the risk-averse<\/p><p>investor. Strategy B is not attractive because has negative skewness and high excess kurtosis (&gt; 3) signifying higher probability of losses as well as higher losses when losses occur. For a risk-averse investor, the choice falls between Strategy A and Strategy C. Strategy C is better because of positive skew and having the lowest Lintocic comnonod to Ctnntom Aand Rhath of which hac nonntiuo chow and hinhon kurtosis compared to Strategy A and B both of which has negative skew and higher excess kurtosis.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Portfolio Management · Sania Guha<\/summary><div class=\"vig-body\"><p>Sania Guha is a portfolio manager evaluating the exposures and investment performance of three new US large-cap equity strategies. Guha developed these strategies using five years of point-in-time data and monthly rebalancing. The results of Guha's evaluation are presented in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-006.webp\" style=\"max-width:min(100%,494px)\" alt=\"Standard Kurtosis Mean Return Deviation Skewness Strategy A 0.5% 1.4% -2.5 8.2 Strategy B 0.6% 2.4% -1.5 10.6 Strategy C 0.5% 1.4% 0.5 4.0\"><p>Guha also evaluates the risk exposure of Strategy D, a government bond portfolio that has 20% short-term maturities, 60% intermediate-term maturities, and 20% long-term maturities. Guha assesses how the VaR of Strategy D would change if she increases the long-term maturities allocation to 30% and decreases the intermediate-term allocation to 50%.<\/p><p>Guha is concerned that risk exposures are often measured with the assumption that returns are normally distributed. She uses a hypothetical scenario analysis approach to examine the performance of Strategy D. As Guha reviews her results, one of her colleagues asks her which risk measure is best for examining how the performance of Strategy D responds to a single change to one of its underlying risk factors.<\/p><\/div><\/details><div class=\"qtext\"><p>Which large-cap equity strategy offers the most attractive statistical properties<\/p><p>for a risk-averse investor?<\/p><\/div>", "subj": "portfolio"}, {"n": 10, "q": "The effect of the proposed maturities allocation change for Strategy D would be best measured using:", "opts": ["relative VaR.", "marginal VaR.", "incremental VaR."], "ans": "C", "expl": "C is correct. because incremental VaR is the most appropriate measure to use for a relatively large (10%) change in position size. Guha is increasing the risk of the portfolio by increasing portfolio duration and incremental VaR measures this change from the original 20/60/20 portfolio to the new 20/50/30 portfolio. Beyond assessing tail loss, a risk manager often wants to know how the portfolio VaR will change if a position size is changed relative to the remaining positions. This effect can be captured by a concept called incremental VaR (IVaR).", "explhtml": "<p><b>C is correct.<\/b> because incremental VaR is the most appropriate measure to use for a<\/p><p>relatively large (10%) change in position size. Guha is increasing the risk of the portfolio by increasing portfolio duration and incremental VaR measures this change from the original 20/60/20 portfolio to the new 20/50/30 portfolio. Beyond assessing tail loss, a risk manager often wants to know how the portfolio VaR will change if a position size is changed relative to the remaining positions. This effect can be captured by a concept called incremental VaR (IVaR).<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Portfolio Management · Sania Guha<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sania Guha is a portfolio manager evaluating the exposures and investment performance of three new US large-cap equity strategies. Guha developed these strategies using five years of point-in-time data and monthly rebalancing. The results of Guha's evaluation are presented in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-006.webp\" style=\"max-width:min(100%,494px)\" alt=\"Standard Kurtosis Mean Return Deviation Skewness Strategy A 0.5% 1.4% -2.5 8.2 Strategy B 0.6% 2.4% -1.5 10.6 Strategy C 0.5% 1.4% 0.5 4.0\"><p>Guha also evaluates the risk exposure of Strategy D, a government bond portfolio that has 20% short-term maturities, 60% intermediate-term maturities, and 20% long-term maturities. Guha assesses how the VaR of Strategy D would change if she increases the long-term maturities allocation to 30% and decreases the intermediate-term allocation to 50%.<\/p><p>Guha is concerned that risk exposures are often measured with the assumption that returns are normally distributed. She uses a hypothetical scenario analysis approach to examine the performance of Strategy D. As Guha reviews her results, one of her colleagues asks her which risk measure is best for examining how the performance of Strategy D responds to a single change to one of its underlying risk factors.<\/p><\/div><\/details><div class=\"qtext\"><p>The effect of the proposed maturities allocation change for Strategy D would<\/p><p>be best measured using:<\/p><\/div>", "subj": "portfolio"}, {"n": 11, "q": "An advantage of the approach that Guha uses when examining the performance of Strategy D is that the approach:", "opts": ["can be designed to overcome any assumption of normal distributions.", "correctly specifies asset co-movement and the magnitude of movements.", "uses historical data to assign probabilities to movements in markets and risk factors."], "ans": "A", "expl": "A is correct. because scenarios can be designed to overcome any assumption of normal distributions; the shock used could be the equivalent of 1, 10, or 1,000 standard deviations, at the choice of the analyst-or as provided by an actual moment in history.", "explhtml": "<p><b>A is correct.<\/b> because scenarios can be designed to overcome any assumption of normal<\/p><p>distributions; the shock used could be the equivalent of 1, 10, or 1,000 standard deviations, at the choice of the analyst-or as provided by an actual moment in history.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Portfolio Management · Sania Guha<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sania Guha is a portfolio manager evaluating the exposures and investment performance of three new US large-cap equity strategies. Guha developed these strategies using five years of point-in-time data and monthly rebalancing. The results of Guha's evaluation are presented in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-006.webp\" style=\"max-width:min(100%,494px)\" alt=\"Standard Kurtosis Mean Return Deviation Skewness Strategy A 0.5% 1.4% -2.5 8.2 Strategy B 0.6% 2.4% -1.5 10.6 Strategy C 0.5% 1.4% 0.5 4.0\"><p>Guha also evaluates the risk exposure of Strategy D, a government bond portfolio that has 20% short-term maturities, 60% intermediate-term maturities, and 20% long-term maturities. Guha assesses how the VaR of Strategy D would change if she increases the long-term maturities allocation to 30% and decreases the intermediate-term allocation to 50%.<\/p><p>Guha is concerned that risk exposures are often measured with the assumption that returns are normally distributed. She uses a hypothetical scenario analysis approach to examine the performance of Strategy D. As Guha reviews her results, one of her colleagues asks her which risk measure is best for examining how the performance of Strategy D responds to a single change to one of its underlying risk factors.<\/p><\/div><\/details><div class=\"qtext\"><p>An advantage of the approach that Guha uses when examining the performance of<\/p><p>Strategy D is that the approach:<\/p><\/div>", "subj": "portfolio"}, {"n": 12, "q": "For her colleague's question regarding which risk measure is best for examining the performance of Strategy D, Guha's answer should be:", "opts": ["VaR.", "Scenario risk measures.", "Sensitivity risk measures."], "ans": "C", "expl": "C is correct. because sensitivity risk measures capture changes in the value of an asset in response to a change in something else, such as a market index, an interest rate, or an exchange rate. Guha's colleague is asking how the performance of strategy Dresponds to a single change in an underlying risk factor, and, for Strategy D this would be best measured by sensitivity risk measures such as duration and convexity which measure change in value in response to a change in yield.", "explhtml": "<p><b>C is correct.<\/b> because sensitivity risk measures capture changes in the value of an<\/p><p>asset in response to a change in something else, such as a market index, an interest rate, or an exchange rate. Guha's colleague is asking how the performance of strategy Dresponds to a single change in an underlying risk factor, and, for Strategy D this would be best measured by sensitivity risk measures such as duration and convexity which measure change in value in response to a change in yield.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Portfolio Management · Sania Guha<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sania Guha is a portfolio manager evaluating the exposures and investment performance of three new US large-cap equity strategies. Guha developed these strategies using five years of point-in-time data and monthly rebalancing. The results of Guha's evaluation are presented in Exhibit 1.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-006.webp\" style=\"max-width:min(100%,494px)\" alt=\"Standard Kurtosis Mean Return Deviation Skewness Strategy A 0.5% 1.4% -2.5 8.2 Strategy B 0.6% 2.4% -1.5 10.6 Strategy C 0.5% 1.4% 0.5 4.0\"><p>Guha also evaluates the risk exposure of Strategy D, a government bond portfolio that has 20% short-term maturities, 60% intermediate-term maturities, and 20% long-term maturities. Guha assesses how the VaR of Strategy D would change if she increases the long-term maturities allocation to 30% and decreases the intermediate-term allocation to 50%.<\/p><p>Guha is concerned that risk exposures are often measured with the assumption that returns are normally distributed. She uses a hypothetical scenario analysis approach to examine the performance of Strategy D. As Guha reviews her results, one of her colleagues asks her which risk measure is best for examining how the performance of Strategy D responds to a single change to one of its underlying risk factors.<\/p><\/div><\/details><div class=\"qtext\"><p>For her colleague's question regarding which risk measure is best for examining the<\/p><p>performance of Strategy D, Guha's answer should be:<\/p><\/div>", "subj": "portfolio"}, {"n": 13, "q": "The 3-month total return on Vogel's copper futures trade is closest to:", "opts": ["0.80%.", "2.30%.", "3.52%."], "ans": "A", "expl": "A is correct. because the total return on commodity futures is broken into three components: the price return (or spot yield), the roll return (or roll yield), and the collateral return (or collateral yield). Price return = (Current price - Previous price)/Previous price = ($3.68 - $3.62)/$3.62 = 1.66%. Roll return = [(Near-term futures contract closing price - Farther-term futures contract closing price)/Near-term futures contract closing price] × Percentage of the position in the futures contract being rolled = ($3.68 - $3.73)/$3.68 x 100% = - 1.36%. The collateral return is the yield (e.g., interest rate) for the bonds or cash used to maintain the investor's futures position(s). In this case the collateral earns an annual rate of 2.00%, therefore the collateral return for the three-month period is 2.00%/4 = 0.50%. Total return = 1.66% - 1.36% + 0.50% = 0.80%.", "explhtml": "<p><b>A is correct.<\/b> because the total return on commodity futures is broken into three<\/p><p>components: the price return (or spot yield), the roll return (or roll yield), and the collateral return (or collateral yield). Price return = (Current price - Previous price)/Previous price = ($3.68 - $3.62)/$3.62 = 1.66%.<\/p><p>Roll return = [(Near-term futures contract closing price - Farther-term futures contract closing price)/Near-term futures contract closing price] × Percentage of the position in the futures contract being rolled = ($3.68 - $3.73)/$3.68 x 100% = - 1.36%. The collateral return is the yield (e.g., interest rate) for the bonds or cash used to maintain the investor's futures position(s). In this case the collateral earns an annual rate of 2.00%, therefore the collateral return for the three-month period is 2.00%/4 = 0.50%. Total return = 1.66% - 1.36% + 0.50% = 0.80%.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Alternative Investments · Andreas Vogel<\/summary><div class=\"vig-body\"><p>Andreas Vogel is a portfolio manager for BlueHorizons, a multi-strategy hedge fund. BlueHorizons has a large allocation to commodities, with a concentration in base and precious metals.<\/p><p>Three months ago, Vogel entered into a fully collateralized long position in near-term copper futures at a price of $3.62 per pound. He now wants to roll the whole position forward. The current prices for the near-term and farther-term futures contracts are $3.68 and $3.73 per pound, respectively. The position's collateral earns an annualized rate of 2.00%. Vogel calculates the 3-month total return on the futures trade.<\/p><p>Vogel considers investing in aluminum and zinc futures. Vogel observes that the near- term futures price of aluminum is $2,500 per ton and the farther-term futures price is $2,750 per ton. Vogel is quoted a calendar spread of $185 per ton on the June (near- term)-September (farther-term) zinc contracts.<\/p><p>Vogel next researches the iron ore futures market. His analysis concludes that the insurance theory explains the current pricing of iron ore futures.<\/p><p>Vogel is looking for new investment opportunities in the precious metals market. He computes the last 6-month holding period returns for several metals in Exhibit 1. He believes that the relative outperformance of gold and silver versus platinum and palladium will continue. Vogel considers a relative value trade that would take long positions in gold and silver futures and short positions in platinum and palladium futures.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-007.webp\" style=\"max-width:min(100%,320px)\" alt=\"Precious Metal Return Gold 5.5% Silver 3.6% Platinum 1.2% Palladium -0.8%\"><\/div><\/details><div class=\"qtext\"><p>The 3-month total return on Vogel's copper futures trade is closest to:<\/p><\/div>", "subj": "alternatives"}, {"n": 14, "q": "Are the aluminum and zinc markets both in backwardation?", "opts": ["Yes", "No, only zinc is in backwardation", "No, only aluminum is in backwardation"], "ans": "B", "expl": "B is correct. because the calendar spread of $185 per tonon the June- September zinc contracts implies that the market for zinc is in backwardation. The price difference (whether in backwardation or contango) between the near-term and the farther-term futures prices is called the calendar spread. A positive calendar spread is associated with futures markets that are in backwardation, whereas a negative calendar spread in commodities is associated with futures markets that are in contango. These calendar spreads are traded with their own bid-ask prices. Also, when the near-term (i.e., closer to expiration) futures contract price is higher than the longer-term futures contract price, the futures market for the commodity is in backwardation. The roll return is usually positive in markets in backwardation. Roll return = [(Near-term futures contract closing price - Farther-term futures contract closing price)/Near-term futures contract closing price] * Percentage of the position in the futures contract being rolled.", "explhtml": "<p><b>B is correct.<\/b> because the calendar spread of $185 per tonon the June-<\/p><p>September zinc contracts implies that the market for zinc is in backwardation. The price difference (whether in backwardation or contango) between the near-term and the farther-term futures prices is called the calendar spread. A positive calendar spread is associated with futures markets that are in backwardation, whereas a negative calendar spread in commodities is associated with futures markets that are in contango. These calendar spreads are traded with their own bid-ask prices. Also, when the near-term (i.e., closer to expiration) futures contract price is higher than the longer-term futures contract price, the futures market for the commodity is in backwardation. The roll return is usually positive in markets in backwardation. Roll return = [(Near-term futures contract closing price - Farther-term futures contract closing price)/Near-term futures contract closing price] * Percentage of the position in the futures contract being rolled.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Alternative Investments · Andreas Vogel<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Andreas Vogel is a portfolio manager for BlueHorizons, a multi-strategy hedge fund. BlueHorizons has a large allocation to commodities, with a concentration in base and precious metals.<\/p><p>Three months ago, Vogel entered into a fully collateralized long position in near-term copper futures at a price of $3.62 per pound. He now wants to roll the whole position forward. The current prices for the near-term and farther-term futures contracts are $3.68 and $3.73 per pound, respectively. The position's collateral earns an annualized rate of 2.00%. Vogel calculates the 3-month total return on the futures trade.<\/p><p>Vogel considers investing in aluminum and zinc futures. Vogel observes that the near- term futures price of aluminum is $2,500 per ton and the farther-term futures price is $2,750 per ton. Vogel is quoted a calendar spread of $185 per ton on the June (near- term)-September (farther-term) zinc contracts.<\/p><p>Vogel next researches the iron ore futures market. His analysis concludes that the insurance theory explains the current pricing of iron ore futures.<\/p><p>Vogel is looking for new investment opportunities in the precious metals market. He computes the last 6-month holding period returns for several metals in Exhibit 1. He believes that the relative outperformance of gold and silver versus platinum and palladium will continue. Vogel considers a relative value trade that would take long positions in gold and silver futures and short positions in platinum and palladium futures.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-007.webp\" style=\"max-width:min(100%,320px)\" alt=\"Precious Metal Return Gold 5.5% Silver 3.6% Platinum 1.2% Palladium -0.8%\"><\/div><\/details><div class=\"qtext\"><p>Are the aluminum and zinc markets both in backwardation?<\/p><\/div>", "subj": "alternatives"}, {"n": 15, "q": "Which of the following would be most consistent with Vogel's conclusion about the iron ore futures market?", "opts": ["The futures curve for iron ore is downward sloping", "The convenience yield of iron ore is lower than the direct storage costs", "Iron ore suppliers are less interested in hedging in the forward market than are iron ore buyers"], "ans": "A", "expl": "A is correct. because the insurance theory proposes that a commodity producer is long the physical good and thus would be motivated to sell the commodity for future delivery to hedge its sales price. Producers of a commodity will accept a lower future price (versus the spot price) in exchange for the certainty of locking in that price. Keynes's theory assumes that the futures curve is in backwardation 'normally' because commodity sellers would persistently sell forward, pushing down prices in the future. Alternatively, this theory posits that the futures price has to be lower than the current spot price as a form of payment or remuneration to the speculator who takes on the price risk and provides price insurance to the commodity seller. A downward-sloping futures curve implies the futures market of iron ore is in backwardation.", "explhtml": "<p><b>A is correct.<\/b> because the insurance theory proposes that a commodity producer is<\/p><p>long the physical good and thus would be motivated to sell the commodity for future delivery to hedge its sales price. Producers of a commodity will accept a lower future price (versus the spot price) in exchange for the certainty of locking in that price. Keynes's theory assumes that the futures curve is in backwardation 'normally' because commodity sellers would persistently sell forward, pushing down prices in the future. Alternatively, this theory posits that the futures price has to be lower than the current spot price as a form of payment or remuneration to the speculator who takes on the price risk and provides price insurance to the commodity seller. A downward-sloping futures curve implies the futures market of iron ore is in backwardation.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Alternative Investments · Andreas Vogel<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Andreas Vogel is a portfolio manager for BlueHorizons, a multi-strategy hedge fund. BlueHorizons has a large allocation to commodities, with a concentration in base and precious metals.<\/p><p>Three months ago, Vogel entered into a fully collateralized long position in near-term copper futures at a price of $3.62 per pound. He now wants to roll the whole position forward. The current prices for the near-term and farther-term futures contracts are $3.68 and $3.73 per pound, respectively. The position's collateral earns an annualized rate of 2.00%. Vogel calculates the 3-month total return on the futures trade.<\/p><p>Vogel considers investing in aluminum and zinc futures. Vogel observes that the near- term futures price of aluminum is $2,500 per ton and the farther-term futures price is $2,750 per ton. Vogel is quoted a calendar spread of $185 per ton on the June (near- term)-September (farther-term) zinc contracts.<\/p><p>Vogel next researches the iron ore futures market. His analysis concludes that the insurance theory explains the current pricing of iron ore futures.<\/p><p>Vogel is looking for new investment opportunities in the precious metals market. He computes the last 6-month holding period returns for several metals in Exhibit 1. He believes that the relative outperformance of gold and silver versus platinum and palladium will continue. Vogel considers a relative value trade that would take long positions in gold and silver futures and short positions in platinum and palladium futures.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-007.webp\" style=\"max-width:min(100%,320px)\" alt=\"Precious Metal Return Gold 5.5% Silver 3.6% Platinum 1.2% Palladium -0.8%\"><\/div><\/details><div class=\"qtext\"><p>Which of the following would be most consistent with Vogel's conclusion about the<\/p><p>iron ore futures market?<\/p><\/div>", "subj": "alternatives"}, {"n": 16, "q": "Vogel's relative value trade in precious metals is most likely part of a:", "opts": ["global macro strategy.", "time-series momentum strategy.", "cross-sectional momentum strategy."], "ans": "C", "expl": "C is correct. because cross-sectional momentum (CSM) strategies are implemented with a cross-section of assets (generally within an asset class) by going long those that are rising in price the most and by shorting those that are falling the most. Such CSM strategies generally result in holding a net zero or market-neutral position.", "explhtml": "<p><b>C is correct.<\/b> because cross-sectional momentum (CSM) strategies are implemented<\/p><p>with a cross-section of assets (generally within an asset class) by going long those that are rising in price the most and by shorting those that are falling the most. Such CSM strategies generally result in holding a net zero or market-neutral position.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Alternative Investments · Andreas Vogel<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Andreas Vogel is a portfolio manager for BlueHorizons, a multi-strategy hedge fund. BlueHorizons has a large allocation to commodities, with a concentration in base and precious metals.<\/p><p>Three months ago, Vogel entered into a fully collateralized long position in near-term copper futures at a price of $3.62 per pound. He now wants to roll the whole position forward. The current prices for the near-term and farther-term futures contracts are $3.68 and $3.73 per pound, respectively. The position's collateral earns an annualized rate of 2.00%. Vogel calculates the 3-month total return on the futures trade.<\/p><p>Vogel considers investing in aluminum and zinc futures. Vogel observes that the near- term futures price of aluminum is $2,500 per ton and the farther-term futures price is $2,750 per ton. Vogel is quoted a calendar spread of $185 per ton on the June (near- term)-September (farther-term) zinc contracts.<\/p><p>Vogel next researches the iron ore futures market. His analysis concludes that the insurance theory explains the current pricing of iron ore futures.<\/p><p>Vogel is looking for new investment opportunities in the precious metals market. He computes the last 6-month holding period returns for several metals in Exhibit 1. He believes that the relative outperformance of gold and silver versus platinum and palladium will continue. Vogel considers a relative value trade that would take long positions in gold and silver futures and short positions in platinum and palladium futures.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-007.webp\" style=\"max-width:min(100%,320px)\" alt=\"Precious Metal Return Gold 5.5% Silver 3.6% Platinum 1.2% Palladium -0.8%\"><\/div><\/details><div class=\"qtext\"><p>Vogel's relative value trade in precious metals is most likely part of a:<\/p><\/div>", "subj": "alternatives"}, {"n": 17, "q": "Does Sakuragi violate the Standards when placing the Sashi trades for Client A?", "opts": ["No", "Yes, the Standard relating to suitability", "Yes, the Standard relating to loyalty, prudence, and care"], "ans": "C", "expl": "C is correct. because, according to Standard III(A) Loyalty, Prudence, and Care, Members and Candidates have a duty of loyalty to their clients and must act with reasonable care and exercise prudent judgment. Members and Candidates must act for the benefit of their clients and place their clients' interests before their employer's or their own interests. The Standard requires members and candidates to follow the investment parameters set forth by the client, which in this case of a nondiscretionary account requires Sakuragi to obtain client permission before trading, even though she has her client's interest in mind when submitting the trades.", "explhtml": "<p><b>C is correct.<\/b> because, according to Standard III(A) Loyalty, Prudence, and Care,<\/p><p>Members and Candidates have a duty of loyalty to their clients and must act with reasonable care and exercise prudent judgment. Members and Candidates must act for the benefit of their clients and place their clients' interests before their employer's or their own interests. The Standard requires members and candidates to follow the investment parameters set forth by the client, which in this case of a nondiscretionary account requires Sakuragi to obtain client permission before trading, even though she has her client's interest in mind when submitting the trades.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Ethics · Haru Sakuragi<\/summary><div class=\"vig-body\"><p>Haru Sakuragi, CFA, is a private wealth manager at Taoyuan Bank, where she manages both discretionary and nondiscretionary accounts of high-net-worth clients. The bank has adopted the Standards.<\/p><p>Sakuragi reviews her clients' IPS and analyzes their major investments, including Sashi Artificial Intelligence and other artificial intelligence software stocks. Based on her analysis, she concludes that Sashi should be replaced by a similar stock in the same industry. Unable to reach Client A, who has a nondiscretionary account, Sakuragi emails him the suggested trades and proceeds to execute them for him. Client A later approves the trades via email. Sakuragi's analysis proves accurate, saving her clients from incurring losses.<\/p><p>Sakuragi manages a regular fee-paying account for her grandmother. Sakuragi determines that a new bond offering is appropriate for her grandmother and two other clients. One client requests an allocation of $10,000, while the other client and Sakuragi's grandmother request $20,000 each. The minimum lot size is established at $5,000 and the issue is oversubscribed. Sakuragi is only allocated $30,000 of the new offering. Sakuragi prepares a presentation for a potential client who is considering opening a discretionary account. She presents the performance of the weighted composite of all similar discretionary accounts she manages, including terminated accounts, as part of the performance history. She indicates when the accounts were terminated and explains that the performance results are net of fees. Fees are not presented separately.<\/p><p>One of Sakuragi's account managers, Takeshi Aka, has just received the news that he did not pass the CFA Level III exam. Disappointed, he complains to Sakuragi about the private wealth management topics that were tested on the exam because he thinks the questions were not fair. He also posts to a popular online forum for CFA candidates complaining about the curriculum and the exam, stating that they do not cover crucial topic areas.<\/p><\/div><\/details><div class=\"qtext\"><p>Does Sakuragi violate the Standards when placing the Sashi trades for Client A?<\/p><\/div>", "subj": "ethics"}, {"n": 18, "q": "According to the Standards, how much of the bond offering should Sakuragi allocate to her grandmother's account?", "opts": ["$0", "$10,000", "$12,000"], "ans": "C", "expl": "C is correct. because, according to Standard III(B) Fair Dealing, if a new offering is oversubscribed, then the issue should be prorated to all subscribers. In addition, if the issue is oversubscribed, members and candidates should forgo any sales to themselves or their immediate families in order to free up additional shares for clients. If the investment professional's family-member accounts are managed similarly to the accounts of other clients of the firm, however, the family-member account should not be excluded from buying such shares. In the case, Sakuragi's grandmother has a regular fee-paying account and she is not an immediate family member, so she should receive allocations on a pro-rata basis. Her order size of $20,000 is 2/5 of the total order size ($10,000 + $20,000 × 2 = $50,000), therefore, she should receive 2/5 of the $30,000 allocation (2/5x $30,000 = $12,000).", "explhtml": "<p><b>C is correct.<\/b> because, according to Standard III(B) Fair Dealing, if a new offering is<\/p><p>oversubscribed, then the issue should be prorated to all subscribers. In addition, if the issue is oversubscribed, members and candidates should forgo any sales to themselves or their immediate families in order to free up additional shares for clients. If the investment professional's family-member accounts are managed similarly to the accounts of other clients of the firm, however, the family-member account should not be excluded from buying such shares. In the case, Sakuragi's grandmother has a regular fee-paying account and she is not an immediate family member, so she should receive allocations on a pro-rata basis. Her order size of $20,000 is 2/5 of the total order size ($10,000 + $20,000 × 2 = $50,000), therefore, she should receive 2/5 of the $30,000 allocation (2/5x $30,000 = $12,000).<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Ethics · Haru Sakuragi<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Haru Sakuragi, CFA, is a private wealth manager at Taoyuan Bank, where she manages both discretionary and nondiscretionary accounts of high-net-worth clients. The bank has adopted the Standards.<\/p><p>Sakuragi reviews her clients' IPS and analyzes their major investments, including Sashi Artificial Intelligence and other artificial intelligence software stocks. Based on her analysis, she concludes that Sashi should be replaced by a similar stock in the same industry. Unable to reach Client A, who has a nondiscretionary account, Sakuragi emails him the suggested trades and proceeds to execute them for him. Client A later approves the trades via email. Sakuragi's analysis proves accurate, saving her clients from incurring losses.<\/p><p>Sakuragi manages a regular fee-paying account for her grandmother. Sakuragi determines that a new bond offering is appropriate for her grandmother and two other clients. One client requests an allocation of $10,000, while the other client and Sakuragi's grandmother request $20,000 each. The minimum lot size is established at $5,000 and the issue is oversubscribed. Sakuragi is only allocated $30,000 of the new offering. Sakuragi prepares a presentation for a potential client who is considering opening a discretionary account. She presents the performance of the weighted composite of all similar discretionary accounts she manages, including terminated accounts, as part of the performance history. She indicates when the accounts were terminated and explains that the performance results are net of fees. Fees are not presented separately.<\/p><p>One of Sakuragi's account managers, Takeshi Aka, has just received the news that he did not pass the CFA Level III exam. Disappointed, he complains to Sakuragi about the private wealth management topics that were tested on the exam because he thinks the questions were not fair. He also posts to a popular online forum for CFA candidates complaining about the curriculum and the exam, stating that they do not cover crucial topic areas.<\/p><\/div><\/details><div class=\"qtext\"><p>According to the Standards, how much of the bond offering should Sakuragi allocate<\/p><p>to her grandmother's account?<\/p><\/div>", "subj": "ethics"}, {"n": 19, "q": "Does Sakuragi violate the Standards when preparing the presentation for the prospective client?", "opts": ["No", "Yes, with respect to fees", "Yes, with respect to terminated accounts"], "ans": "A", "expl": "A is correct. because, according to Standard III(D) Performance Presentation, when communicating investment performance information, Members and Candidates must make reasonable efforts to ensure that it is fair, accurate, and complete. Members and candidates should include disclosures that fully explain the performance results being reported (for example, stating, when appropriate, that results are simulated when model results are used, clearly indicating when the performance record is that of a prior entity, or disclosing whether the performance is gross of fees, net of fees, or after tax). In the case, Sakuragi has indicated that the performance is net of fees, although the fees are not presented separately. Furthermore, members and candidates can also meet their obligations under Standard III(D) by including terminated accounts as part of performance history with a clear indication of when the accounts were terminated. Hence, there is no violation of the Standards.", "explhtml": "<p><b>A is correct.<\/b> because, according to Standard III(D) Performance Presentation, when<\/p><p>communicating investment performance information, Members and Candidates must make reasonable efforts to ensure that it is fair, accurate, and complete. Members and candidates should include disclosures that fully explain the performance results being reported (for example, stating, when appropriate, that results are simulated when model results are used, clearly indicating when the performance record is that of a prior entity, or disclosing whether the performance is gross of fees, net of fees, or after tax). In the case, Sakuragi has indicated that the performance is net of fees, although the fees are not presented separately. Furthermore, members and candidates can also meet their obligations under Standard III(D) by including terminated accounts as part of performance history with a clear indication of when the accounts were terminated. Hence, there is no violation of the Standards.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Ethics · Haru Sakuragi<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Haru Sakuragi, CFA, is a private wealth manager at Taoyuan Bank, where she manages both discretionary and nondiscretionary accounts of high-net-worth clients. The bank has adopted the Standards.<\/p><p>Sakuragi reviews her clients' IPS and analyzes their major investments, including Sashi Artificial Intelligence and other artificial intelligence software stocks. Based on her analysis, she concludes that Sashi should be replaced by a similar stock in the same industry. Unable to reach Client A, who has a nondiscretionary account, Sakuragi emails him the suggested trades and proceeds to execute them for him. Client A later approves the trades via email. Sakuragi's analysis proves accurate, saving her clients from incurring losses.<\/p><p>Sakuragi manages a regular fee-paying account for her grandmother. Sakuragi determines that a new bond offering is appropriate for her grandmother and two other clients. One client requests an allocation of $10,000, while the other client and Sakuragi's grandmother request $20,000 each. The minimum lot size is established at $5,000 and the issue is oversubscribed. Sakuragi is only allocated $30,000 of the new offering. Sakuragi prepares a presentation for a potential client who is considering opening a discretionary account. She presents the performance of the weighted composite of all similar discretionary accounts she manages, including terminated accounts, as part of the performance history. She indicates when the accounts were terminated and explains that the performance results are net of fees. Fees are not presented separately.<\/p><p>One of Sakuragi's account managers, Takeshi Aka, has just received the news that he did not pass the CFA Level III exam. Disappointed, he complains to Sakuragi about the private wealth management topics that were tested on the exam because he thinks the questions were not fair. He also posts to a popular online forum for CFA candidates complaining about the curriculum and the exam, stating that they do not cover crucial topic areas.<\/p><\/div><\/details><div class=\"qtext\"><p>Does Sakuragi violate the Standards when preparing the presentation for the<\/p><p>prospective client?<\/p><\/div>", "subj": "ethics"}, {"n": 20, "q": "Regarding the CFA exam, Aka has violated the Standards because of:", "opts": ["his conversation with Sakuragi only.", "his complaint in the online forum only.", "both his conversation with Sakuragi and his complaint in the online forum."], "ans": "A", "expl": "A is correct. because, according to Standard VII(A) Conduct as Participants in CFA Institute Programs, examples of information that cannot be disclosed by candidates sitting for an exam include but are not limited to broad topical areas and formulas tested or not tested on the exam. Therefore, Aka should not have talked to Sakuragi about the private wealth management topics that were tested on the exam.", "explhtml": "<p><b>A is correct.<\/b> because, according to Standard VII(A) Conduct as Participants in CFA<\/p><p>Institute Programs, examples of information that cannot be disclosed by candidates sitting for an exam include but are not limited to broad topical areas and formulas tested or not tested on the exam. Therefore, Aka should not have talked to Sakuragi about the private wealth management topics that were tested on the exam.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Ethics · Haru Sakuragi<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Haru Sakuragi, CFA, is a private wealth manager at Taoyuan Bank, where she manages both discretionary and nondiscretionary accounts of high-net-worth clients. The bank has adopted the Standards.<\/p><p>Sakuragi reviews her clients' IPS and analyzes their major investments, including Sashi Artificial Intelligence and other artificial intelligence software stocks. Based on her analysis, she concludes that Sashi should be replaced by a similar stock in the same industry. Unable to reach Client A, who has a nondiscretionary account, Sakuragi emails him the suggested trades and proceeds to execute them for him. Client A later approves the trades via email. Sakuragi's analysis proves accurate, saving her clients from incurring losses.<\/p><p>Sakuragi manages a regular fee-paying account for her grandmother. Sakuragi determines that a new bond offering is appropriate for her grandmother and two other clients. One client requests an allocation of $10,000, while the other client and Sakuragi's grandmother request $20,000 each. The minimum lot size is established at $5,000 and the issue is oversubscribed. Sakuragi is only allocated $30,000 of the new offering. Sakuragi prepares a presentation for a potential client who is considering opening a discretionary account. She presents the performance of the weighted composite of all similar discretionary accounts she manages, including terminated accounts, as part of the performance history. She indicates when the accounts were terminated and explains that the performance results are net of fees. Fees are not presented separately.<\/p><p>One of Sakuragi's account managers, Takeshi Aka, has just received the news that he did not pass the CFA Level III exam. Disappointed, he complains to Sakuragi about the private wealth management topics that were tested on the exam because he thinks the questions were not fair. He also posts to a popular online forum for CFA candidates complaining about the curriculum and the exam, stating that they do not cover crucial topic areas.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding the CFA exam, Aka has violated the Standards because of:<\/p><\/div>", "subj": "ethics"}, {"n": 21, "q": "In Rocco's APT model illustration, the estimate of the factor risk premium is closestto:", "opts": ["3.86%.", "7.14%.", "13.08%."], "ans": "B", "expl": "B is correct. because the single factor model is: E(Ri) = RF + A1ßi where, E(Ri) = Expected return for portfolio i RF = the risk free rate 11 = the factor risk premium Bi = sensitivity of portfolio return to the factor Portfolio P: E(RP) = 0.085 = RF + 0.6511 Portfolio Q: E(RQ) = 0.120 = RF + 1.1411 From (P), RF = 0.085 - 0.6511 Substituting this value in (Q): 0.120 = 0.085 - 0.6511 + 1.1411 Rearranging provides a value for (11) of 0.0714 or 7.14% This implies a risk free rate of 0.085 - (0.65 x 0.714) = 0.0386 or 3.86%", "explhtml": "<p><b>B is correct.<\/b> because the single factor model is: E(Ri) = RF + A1ßi where,<\/p><p>E(Ri) = Expected return for portfolio i RF = the risk free rate 11 = the factor risk premium Bi = sensitivity of portfolio return to the factor Portfolio P: E(RP) = 0.085 = RF + 0.6511 Portfolio Q: E(RQ) = 0.120 = RF + 1.1411 From (P), RF = 0.085 - 0.6511 Substituting this value in (Q): 0.120 = 0.085 - 0.6511 + 1.1411 Rearranging provides a value for (11) of 0.0714 or 7.14% This implies a risk free rate of 0.085 - (0.65 x 0.714) = 0.0386 or 3.86%<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Portfolio Management · Maureen Rocco<\/summary><div class=\"vig-body\"><p>Maureen Rocco is a portfolio manager assisting two clients, Bright Minds Foundation and Max Degroom, with the selection of exchange traded funds (ETFs).<\/p><p>Bright Minds Foundation Bright Minds is a perpetual foundation. It wants to add investments which have long- term exposure to economic factors for a part of its fixed income portfolio allocation. Rocco begins by illustrating Arbitrage Pricing Theory (APT), which forms the basis for many factor models, to the CIO of Bright Minds. She uses three well-diversified arbitrage free portfolios and one common factor as shown in Exhibit 1 to demonstrate how parameters are estimated in a one-factor APT model.<\/p><p><b>Exhibit 1<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/prem/m3s1-008.webp\" style=\"max-width:min(100%,318px)\" alt=\"Portfolio Expected Return Factor Sensitivity P 0.0850 0.65 Q 0.1200 1.14 R 0.1036 0.91\"><p>Rocco has identified ETFX as a suitable investment for the foundation. ETFX is a well- diversified fixed income ETF based on a macroeconomic factor model that seeks long- term exposure to surprises in GDP growth and inflation.<\/p><p>ETFX's factor return model is formulated as follows:<\/p><p>Rx = 0.025 + 0.8FINF + 1.2FGDP + Ex<\/p><p>where, Rx is the return on ETFX, FInF represents surprise in inflation, and FeDprepresents surprise in GDP growth, both measured by actual values minus predicted values. Ex is the error term which is assumed to be zero.<\/p><p>For last year, the fund had a return of 3.62%, while actual inflation was 2.5% and actual GDP growth was 3%. The predicted value of GDP growth for last year was 2.4%.<\/p><p>Max Degroom Max Degroom is a US based wealthy individual client who is also an active trader. He is considering a short-term position in ETFZ, an ETF leveraged three times to the daily return of a widely used emerging market equity index. Rocco calculates the expected total cost of investing in ETFZ assuming a six-month holding period and the following information.<\/p><p>Annual management fee of 0.76% Round-trip trading commission of 0.05%<\/p><p>Bid-offer spread of 0.16% on purchase and sale<\/p><p>Before purchasing ETFZ, Degroom asks Rocco to explain the role of the authorized participant (AP) in an ETF. He asks \"I observed, for short periods of time the price of another ETF was $101 and its NAV (fair value) was $102. Assuming minimal costs, what arbitrage actions would the AP make so that the two values converge?\"<\/p><\/div><\/details><div class=\"qtext\"><p>In Rocco's APT model illustration, the estimate of the factor risk premium<\/p><p>is closestto:<\/p><\/div>", "subj": "portfolio"}, {"n": 22, "q": "Based on ETFX's factor return model, the equilibrium predicted value for inflation for last year was closest to.", "opts": ["1.75%", "2.00%", "4.80%"], "ans": "B", "expl": "B is correct. because Rocco determines that ETFX's factor return model is formulated as follows: RX = 0.025 + 0.8FINF + 1.2FGDP + EX. It can be rewritten as RX = 0.025+ 0.8(FINFActual - FINFPredicted) + 1.2(FGDPActual - FGDPPredicted) + EX 0.0362 = 0.025 + 0.8(0.025 - FINFPredicted) + 1.2(0.03 -
