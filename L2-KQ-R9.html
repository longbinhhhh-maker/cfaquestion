urrent rate. The value is 0.50 × 450,000,000 = $225,000,000.", "explhtml": "<p>Because the operations are independent from the parent, the current rate method will be used. All debt should be accounted for at the current rate. The value is 0.50 × 450,000,000 = $225,000,000.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 80–83<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>A U.S. company has a subsidiary based in Malaysia, which has the following income statement for 20X6 and balance sheets for 20X5 and 20X6 (in million Ringgit).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v026.webp\" style=\"max-width:min(100%,369px)\" alt=\"1,000 Sales 600 Cost of goods sold 80 Depreciation 120 Operating expenses 200 Earnings before taxes 60 Taxes\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v027.webp\" style=\"max-width:min(100%,539px)\" alt=\"Net income 140 Dividends 20 20X5 20X6 60 50 Cash 110 100 Accounts receivables 110 Inventories 100 110 100 Other current assets 800 700 Gross PP&amp;E Less accumulated depreciation 150 70 Net PP&amp;E 630 650 Other fixed assets 20 40 1,000 1,080 Total assets 70 Account payable 80 Current portion of LTD 100 100 Notes payable 150 100 30 Other current liabilities 30 Long-term debt 200 300 Common stock 100 100 50 50 Paid in capital 370 250 Retained earnings The value of the Ringgit at various times over the past two years is as follows: $0.37 January 1, 20X5 $0.38 April 1, 20X5 $0.40 December 31, 2\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v028.webp\" style=\"max-width:min(100%,369px)\" alt=\"$0.47 June 30, 20X6 $0.50 December 31, 20X6 Average for 20X5 $0.39 Average for 20X6 $0.45\"><p>The common stock and long-term debt were originally issued in January of 20X5. The fixed assets and first inventory purchases were made in April of 20X5. Additional fixed asset purchases were made in June 20X6. Inventory is measured using the FIFO method. It can be assumed that all of the ending inventory was acquired in June when the last major purchase was made. The operations of the subsidiary are independent from the operations of the U.S. parent. Inflation over the past three years has averaged 15% per year.<\/p><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.e<\/div><div class=\"qtext\"><p>The value of all financing debt (notes payable, current portion of long-term debt, and long-term debt) on December 31, 20X6, reported in USD is:<\/p><\/div>", "subj": "fsa"}, {"n": 84, "q": "Which of the following statements regarding the functional currency is least accurate? The functional currency:", "opts": ["is remeasured into the reporting currency under the temporal method.", "is the currency of the primary economic environment in which the foreign subsidiary generates and expends cash.", "is determined by management."], "ans": "A", "expl": "The basis for using the current rate method is when Functional Currency is NOT the same as Parent's Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent's Presentation Currency. The local currency is remeasured into the functional currency under the temporal method. The functional currency is translated into the reporting currency using the current rate method.", "explhtml": "<p>The basis for using the current rate method is when Functional Currency is NOT the same as Parent&#x27;s Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent&#x27;s Presentation Currency.<\/p><p>The local currency is remeasured into the functional currency under the temporal method. The functional currency is translated into the reporting currency using the current rate method.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.1, LOS 9.a<\/div><div class=\"qtext\"><p>Which of the following statements regarding the functional currency is least accurate? The functional currency:<\/p><\/div>", "subj": "fsa"}, {"n": 85, "q": "The local currency is:", "opts": ["the preferred functional currency for subsidiaries that are highly integrated with the parent.", "translated into the functional currency under the current rate method.", "the same as the functional currency under the current rate method."], "ans": "C", "expl": "The local currency is best described as the currency of the country in which the foreign subsidiary is located. If a subsidiary is highly integrated with its parent or operating in a high-inflation environment, the functional currency is the parent's currency. Local currencies are remeasured under the temporal method.", "explhtml": "<p>The local currency is best described as the currency of the country in which the foreign subsidiary is located. If a subsidiary is highly integrated with its parent or operating in a high-inflation environment, the functional currency is the parent&#x27;s currency. Local currencies are remeasured under the temporal method.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.1, LOS 9.a<\/div><div class=\"qtext\"><p>The local currency is:<\/p><\/div>", "subj": "fsa"}, {"n": 86, "q": "Which of the following situations does NOT require the use of the temporal method? The:", "opts": ["local currency is the functional currency.", "foreign subsidiary is operating in a highly inflationary economy.", "functional currency is some currency other that the local currency or the U.S. dollar."], "ans": "A", "expl": "The basis for using the current rate method is when Functional Currency is NOT the same as Parent's Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent's Presentation Currency. The temporal method is not required in the situation when the local currency is the functional currency.", "explhtml": "<p>The basis for using the current rate method is when Functional Currency is NOT the same as Parent&#x27;s Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent&#x27;s Presentation Currency.<\/p><p>The temporal method is not required in the situation when the local currency is the functional currency.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.3, LOS 9.e<\/div><div class=\"qtext\"><p>Which of the following situations does NOT require the use of the temporal method? The:<\/p><\/div>", "subj": "fsa"}, {"n": 87, "q": "Which of the following statements regarding foreign currency translation are least accurate? Under the:", "opts": ["current rate method, the foreign currency translation gain or loss appears on the parent firm's income statement.", "temporal method, COGS and depreciation are remeasured using the historical rate.", "temporal method, sales are remeasured using the average rate."], "ans": "A", "expl": "Under the current rate method, the foreign currency translation gain or loss appears on the parent firm's balance sheet in the equity accounts.", "explhtml": "<p>Under the current rate method, the foreign currency translation gain or loss appears on the parent firm&#x27;s balance sheet in the equity accounts.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.4, LOS 9.e<\/div><div class=\"qtext\"><p>Which of the following statements regarding foreign currency translation are least accurate? Under the:<\/p><\/div>", "subj": "fsa"}, {"n": 88, "q": "The U.S. Deter Company operates a subsidiary in the UK, and the functional currency is the British pound. The subsidiary's 2001 income statement shows £500 of net income and a £50 dividend that was paid on December 31, when the exchange rate was $1.50 per pound. The current exchange rate is $1.65 per pound, and the average rate is $1.58 per pound. What is the change in retained earnings for the period in U.S. dollars under U.S. GAAP?", "opts": ["$715.", "$750.", "$725."], "ans": "A", "expl": "The basis for using the current rate method is when Functional Currency is NOT the same as Parent's Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent's Presentation Currency. Since the functional currency is the local currency, use the current rate method. The net income is translated at the average rate, and dividends are translated at the rate that applied when they were paid. Hence: 1.58(£500) − 1.50(£50) = $715.", "explhtml": "<p>The basis for using the current rate method is when Functional Currency is NOT the same as Parent&#x27;s Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent&#x27;s Presentation Currency.<\/p><p>Since the functional currency is the local currency, use the current rate method. The net income is translated at the average rate, and dividends are translated at the rate that applied when they were paid. Hence: 1.58(£500) − 1.50(£50) = $715.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.4, LOS 9.e<\/div><div class=\"qtext\"><p>The U.S. Deter Company operates a subsidiary in the UK, and the functional currency is the British pound. The subsidiary&#x27;s 2001 income statement shows £500 of net income and a £50 dividend that was paid on December 31, when the exchange rate was $1.50 per pound. The current exchange rate is $1.65 per pound, and the average rate is $1.58 per pound. What is the change in retained earnings for the period in U.S. dollars under U.S. GAAP?<\/p><\/div>", "subj": "fsa"}, {"n": 89, "q": "Dave Iverson, CFA, is analyzing the recently released financial statement of Global Corp., a large multinational manufacturing company with production facilities across Europe and Southeast Asia. The company's choice of functional currency is not disclosed, but Iverson does notice that Global Corp. does not have any cumulative translation adjustments (CTA) on its balance sheet. Which of the following statements is most accurate based upon Iverson's observation?", "opts": ["The temporal method of foreign currency translation is used for at least some of its subsidiaries.", "The temporal method of foreign currency translation is used exclusively.", "The current rate method of foreign currency translation is used exclusively."], "ans": "B", "expl": "The choice of functional currency is the determining factor as to which method of foreign currency translation is utilized. If no CTA appears on the balance sheet, then the parent currency must be the functional currency for all of the company's subsidiaries and only the temporal method is used.", "explhtml": "<p>The choice of functional currency is the determining factor as to which method of foreign currency translation is utilized. If no CTA appears on the balance sheet, then the parent currency must be the functional currency for all of the company&#x27;s subsidiaries and only the temporal method is used.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.3, LOS 9.e<\/div><div class=\"qtext\"><p>Dave Iverson, CFA, is analyzing the recently released financial statement of Global Corp., a large multinational manufacturing company with production facilities across Europe and Southeast Asia. The company&#x27;s choice of functional currency is not disclosed, but Iverson does notice that Global Corp. does not have any cumulative translation adjustments (CTA) on its balance sheet. Which of the following statements is most accurate based upon Iverson&#x27;s observation?<\/p><\/div>", "subj": "fsa"}, {"n": 90, "q": "Which of the following measures is unaffected by the choice between translation under the current rate method and remeasurement under the temporal method?", "opts": ["Cost of goods sold.", "Tax expense.", "Equity."], "ans": "B", "expl": "Taxes are converted at the same rate (average rate) under both methods. Equity under the temporal method is a mixed rate whereas under the current rate method it is at the current rate. COGS under the temporal method is at the historical rate and under the current rate method it is at the average rate.", "explhtml": "<p>Taxes are converted at the same rate (average rate) under both methods. Equity under the temporal method is a mixed rate whereas under the current rate method it is at the current rate. COGS under the temporal method is at the historical rate and under the current rate method it is at the average rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.6, LOS 9.f<\/div><div class=\"qtext\"><p>Which of the following measures is unaffected by the choice between translation under the current rate method and remeasurement under the temporal method?<\/p><\/div>", "subj": "fsa"}, {"n": 91, "q": "Which of the following statements is least accurate regarding accounting for foreign currency translations? The:", "opts": ["current rate method applies the current exchange rate to all balance sheet accounts.", "current rate method applies the average exchange rate to all income statement accounts.", "temporal method uses the historical exchange rate to translate non-monetary assets and liabilities into the currency of the country of the parent company."], "ans": "A", "expl": "The current rate method applies the current exchange rate to all balance sheet accounts except for common stock, which is translated at a historical rate.", "explhtml": "<p>The current rate method applies the current exchange rate to all balance sheet accounts except for common stock, which is translated at a historical rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.4, LOS 9.e<\/div><div class=\"qtext\"><p>Which of the following statements is least accurate regarding accounting for foreign currency translations? The:<\/p><\/div>", "subj": "fsa"}, {"n": 92, "q": "On APJ's 2012 income statement, the level of sales in U.S. dollars would be closest to:", "opts": ["$1,985.", "$1,272.", "$1,377."], "ans": "B", "expl": "The basis for using the current rate method is when Functional Currency is NOT the same as Parent's Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent's Presentation Currency. Since the Australian dollar is the functional currency, use the current rate method. The items in the income statement are translated at the average exchange rate. The average rate is (2.5 + 3) / 2 = 2.75 Australian dollars per = US$. Income Statement (in $) Sales (3,500 / 2.75) $1,272 Costs (2,900 / 2.75) $1,055 Net Income $217", "explhtml": "<p>The basis for using the current rate method is when Functional Currency is NOT the same as Parent&#x27;s Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent&#x27;s Presentation Currency.<\/p><p>Since the Australian dollar is the functional currency, use the current rate method. The items in the income statement are translated at the average exchange rate. The average rate is (2.5 + 3) / 2 = 2.75 Australian dollars per = US$.<\/p><p>Income Statement (in $)<\/p><div class=\"tbl\"><table><tr><td>Sales (3,500 / 2.75)<\/td><td>$1,272<\/td><\/tr><tr><td>Costs (2,900 / 2.75)<\/td><td>$1,055<\/td><\/tr><tr><td>Net Income<\/td><td>$217<\/td><\/tr><\/table><\/div>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 92–95<\/summary><div class=\"vig-body\"><p>Della Air Lines has recently acquired Australian Puddle Jumpers, Inc. (APJ), a small airline located in Sydney. The Australian dollar has been chosen by Della as the functional currency for APJ. The balance sheet of APJ is given below as of Dec. 31, 2011 in U.S. dollars.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v029.webp\" style=\"max-width:min(100%,667px)\" alt=\"Liabilities and Equity Assets $100|Accounts Payable (A/P) $90 Cash 360 Accounts Receivable (A/R) 120 | Common Stock Maintenance Supplies 90 140 Fixed Assets $450 $450|Total Liabilities &amp; Equity Total Assets APJ&#x27;s income statement for the year ending Dec. 31, 2012 is expressed in Australian dollars as: 3,500 Sales Total Costs 2,900 Net Income 600 The Australian dollar has steadily depreciated against the U.S. dollar. At Dec. 31, 2011, the exchange rate was A$/US$ 2.50, the average rate during the year was A$/US$ 2.75 and A$/US$ 3.0 on Dec. 31, 2012. The Dec. 31, 2012 Balance Sheet for \"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v030.webp\" style=\"max-width:min(100%,667px)\" alt=\"468 Fixed Assets 1,530 |Total Liabilities &amp; Equity Total Assets 1,530\"><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.d<\/div><div class=\"qtext\"><p>On APJ&#x27;s 2012 income statement, the level of sales in U.S. dollars would be closest to:<\/p><\/div>", "subj": "fsa"}, {"n": 93, "q": "On APJ's 2012 balance sheet, the level of accounts receivable is U.S. dollars would be closest to:", "opts": ["$110.", "$132.", "$330."], "ans": "A", "expl": "Since we are using the current rate method, all balance sheet accounts are translated at the current exchange rate, except for the common stock account, which is translated at the historical rate. A/R: (330 / 3) = 110", "explhtml": "<p>Since we are using the current rate method, all balance sheet accounts are translated at the current exchange rate, except for the common stock account, which is translated at the historical rate.<\/p><p>A/R: (330 / 3) = 110<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 92–95<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Della Air Lines has recently acquired Australian Puddle Jumpers, Inc. (APJ), a small airline located in Sydney. The Australian dollar has been chosen by Della as the functional currency for APJ. The balance sheet of APJ is given below as of Dec. 31, 2011 in U.S. dollars.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v029.webp\" style=\"max-width:min(100%,667px)\" alt=\"Liabilities and Equity Assets $100|Accounts Payable (A/P) $90 Cash 360 Accounts Receivable (A/R) 120 | Common Stock Maintenance Supplies 90 140 Fixed Assets $450 $450|Total Liabilities &amp; Equity Total Assets APJ&#x27;s income statement for the year ending Dec. 31, 2012 is expressed in Australian dollars as: 3,500 Sales Total Costs 2,900 Net Income 600 The Australian dollar has steadily depreciated against the U.S. dollar. At Dec. 31, 2011, the exchange rate was A$/US$ 2.50, the average rate during the year was A$/US$ 2.75 and A$/US$ 3.0 on Dec. 31, 2012. The Dec. 31, 2012 Balance Sheet for \"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v030.webp\" style=\"max-width:min(100%,667px)\" alt=\"468 Fixed Assets 1,530 |Total Liabilities &amp; Equity Total Assets 1,530\"><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.d<\/div><div class=\"qtext\"><p>On APJ&#x27;s 2012 balance sheet, the level of accounts receivable is U.S. dollars would be closest to:<\/p><\/div>", "subj": "fsa"}, {"n": 94, "q": "For APJ, the conversion to US$ is most likely to result in:", "opts": ["remeasurement gain.", "cumulative translation adjustment loss.", "cumulative translation adjustment gain."], "ans": "B", "expl": "APJ shows a net asset: Total assets A$1,530 / (3.00 A$/US$) = US$510 Total liabilities A$210 / (3.00 A$/US$) = US$70 Net asset = US$440 Because the functional currency is the local currency, the current rate method is used. When we have a net asset balance sheet exposure, a weakening foreign currency will result in a negative translation adjustment. AJP's net asset position will result in a cumulative transaction adjustment loss as the foreign currency, the A$, is depreciating. Exposure Foreign Currency  Current rate method: Appreciating Depreciating Net assets Gain Loss Net liabilities Loss Gain", "explhtml": "<p>APJ shows a net asset:<\/p><div class=\"tbl\"><table><tr><td>Total assets<\/td><td>A$1,530 / (3.00 A$/US$) = US$510<\/td><\/tr><tr><td>Total liabilities<\/td><td>A$210 / (3.00 A$/US$) = US$70<\/td><\/tr><tr><td>Net asset<\/td><td>= US$440<\/td><\/tr><\/table><\/div><p>Because the functional currency is the local currency, the current rate method is used. When we have a net asset balance sheet exposure, a weakening foreign currency will result in a negative translation adjustment. AJP&#x27;s net asset position will result in a cumulative transaction adjustment loss as the foreign currency, the A$, is depreciating.<\/p><div class=\"tbl\"><table><tr><td>Exposure<\/td><td colspan=2>Foreign Currency<\/td><\/tr><tr><td>Current rate method:<\/td><td>Appreciating<\/td><td>Depreciating<\/td><\/tr><tr><td>Net assets<\/td><td>Gain<\/td><td>Loss<\/td><\/tr><tr><td>Net liabilities<\/td><td>Loss<\/td><td>Gain<\/td><\/tr><\/table><\/div>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 92–95<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Della Air Lines has recently acquired Australian Puddle Jumpers, Inc. (APJ), a small airline located in Sydney. The Australian dollar has been chosen by Della as the functional currency for APJ. The balance sheet of APJ is given below as of Dec. 31, 2011 in U.S. dollars.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v029.webp\" style=\"max-width:min(100%,667px)\" alt=\"Liabilities and Equity Assets $100|Accounts Payable (A/P) $90 Cash 360 Accounts Receivable (A/R) 120 | Common Stock Maintenance Supplies 90 140 Fixed Assets $450 $450|Total Liabilities &amp; Equity Total Assets APJ&#x27;s income statement for the year ending Dec. 31, 2012 is expressed in Australian dollars as: 3,500 Sales Total Costs 2,900 Net Income 600 The Australian dollar has steadily depreciated against the U.S. dollar. At Dec. 31, 2011, the exchange rate was A$/US$ 2.50, the average rate during the year was A$/US$ 2.75 and A$/US$ 3.0 on Dec. 31, 2012. The Dec. 31, 2012 Balance Sheet for \"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v030.webp\" style=\"max-width:min(100%,667px)\" alt=\"468 Fixed Assets 1,530 |Total Liabilities &amp; Equity Total Assets 1,530\"><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.d<\/div><div class=\"qtext\"><p>For APJ, the conversion to US$ is most likely to result in:<\/p><\/div>", "subj": "fsa"}, {"n": 95, "q": "If the functional currency is the reporting currency, the exposure and the foreign currency movements are most likely to result in a:", "opts": ["remeasurement loss.", "cumulative translation adjustment loss.", "remeasurement gain."], "ans": "A", "expl": "APJ has a net monetary asset exposure: Total monetary assets: Cash + A/R A$771 / (3.00 A$/US$) = US$257 Total monetary liabilities: A$210 / (3.00 A$/US$) = US$70 Net monetary asset = US$187 Because the functional currency is the reporting currency, the temporal method is used and this means there is remeasurement – a loss as the foreign currency, the A$, is depreciating. Exposure Foreign Currency  Temporal method: Appreciating Depreciating Net monetary assets Gain Loss Net monetary liabilities Loss Gain", "explhtml": "<p>APJ has a net monetary asset exposure:<\/p><p>Total monetary assets: Cash + A/R A$771 / (3.00 A$/US$) = US$257<\/p><p>Total monetary liabilities: A$210 / (3.00 A$/US$) = US$70<\/p><p>Net monetary asset = US$187<\/p><p>Because the functional currency is the reporting currency, the temporal method is used and this means there is remeasurement – a loss as the foreign currency, the A$, is depreciating.<\/p><div class=\"tbl\"><table><tr><td>Exposure<\/td><td colspan=2>Foreign Currency<\/td><\/tr><tr><td>Temporal method:<\/td><td>Appreciating<\/td><td>Depreciating<\/td><\/tr><tr><td>Net monetary assets<\/td><td>Gain<\/td><td>Loss<\/td><\/tr><tr><td>Net monetary liabilities<\/td><td>Loss<\/td><td>Gain<\/td><\/tr><\/table><\/div>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 92–95<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Della Air Lines has recently acquired Australian Puddle Jumpers, Inc. (APJ), a small airline located in Sydney. The Australian dollar has been chosen by Della as the functional currency for APJ. The balance sheet of APJ is given below as of Dec. 31, 2011 in U.S. dollars.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v029.webp\" style=\"max-width:min(100%,667px)\" alt=\"Liabilities and Equity Assets $100|Accounts Payable (A/P) $90 Cash 360 Accounts Receivable (A/R) 120 | Common Stock Maintenance Supplies 90 140 Fixed Assets $450 $450|Total Liabilities &amp; Equity Total Assets APJ&#x27;s income statement for the year ending Dec. 31, 2012 is expressed in Australian dollars as: 3,500 Sales Total Costs 2,900 Net Income 600 The Australian dollar has steadily depreciated against the U.S. dollar. At Dec. 31, 2011, the exchange rate was A$/US$ 2.50, the average rate during the year was A$/US$ 2.75 and A$/US$ 3.0 on Dec. 31, 2012. The Dec. 31, 2012 Balance Sheet for \"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v030.webp\" style=\"max-width:min(100%,667px)\" alt=\"468 Fixed Assets 1,530 |Total Liabilities &amp; Equity Total Assets 1,530\"><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.d<\/div><div class=\"qtext\"><p>If the functional currency is the reporting currency, the exposure and the foreign currency movements are most likely to result in a:<\/p><\/div>", "subj": "fsa"}, {"n": 96, "q": "A Canadian firm owns a foreign subsidiary in the U.S. In 2002, sales were USD1,000,000 and the USD/CAD exchange rate was 0.6329. In 2003, sales were also USD1,000,000 but the exchange rate was 0.7484. What is the impact of the change in the value of the CAD on the parent company's translated sales? Sales will:", "opts": ["decline by 15%.", "decrease by 18%.", "increase by 18%."], "ans": "A", "expl": "While sales were flat at USD 1,000,000 in local currency terms, after translation the parent firm would report sales of CAD 1,336,184 for 2003 (= USD 1,000,000 / 0.7484) versus sales of CAD 1,580,028 for 2002 (= USD 1,000,000 / 0.6329). The 15% sales decline reported by the Canadian firm (CAD 1,336,184 versus CAD 1,580,028) is a flow effect. Even though there was no sales growth in the subsidiary, the parent firm still shows a 15% decrease in revenues from the subsidiary due solely to exchange rate effects. Note that because the subsidiary sales are constant the total exchange rate effect can be measured as (0.6329 / 0.7484) − 1 = −0.15.", "explhtml": "<p>While sales were flat at USD 1,000,000 in local currency terms, after translation the parent firm would report sales of CAD 1,336,184 for 2003 (= USD 1,000,000 / 0.7484) versus sales of CAD 1,580,028 for 2002 (= USD 1,000,000 / 0.6329). The 15% sales decline reported by the Canadian firm (CAD 1,336,184 versus CAD 1,580,028) is a flow effect. Even though there was no sales growth in the subsidiary, the parent firm still shows a 15% decrease in revenues from the subsidiary due solely to exchange rate effects. Note that because the subsidiary sales are constant the total exchange rate effect can be measured as (0.6329 / 0.7484) − 1 = −0.15.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.2, LOS 9.c<\/div><div class=\"qtext\"><p>A Canadian firm owns a foreign subsidiary in the U.S. In 2002, sales were USD1,000,000 and the USD/CAD exchange rate was 0.6329. In 2003, sales were also USD1,000,000 but the exchange rate was 0.7484. What is the impact of the change in the value of the CAD on the parent company&#x27;s translated sales? Sales will:<\/p><\/div>", "subj": "fsa"}, {"n": 97, "q": "After remeasurement, depreciation will be closest to:", "opts": ["$85.", "$80.", "$77."], "ans": "C", "expl": "Expenses related to assets translated at historical exchange rate, (e.g., cost of goods sold; depreciation; amortization) are translated at historical rates under the temporal method. Thus under the temporal method we should use the historical rate to remeasure depreciation: 100SF × 0.77$/SF = $77.", "explhtml": "<p>Expenses related to assets translated at historical exchange rate, (e.g., cost of goods sold; depreciation; amortization) are translated at historical rates under the temporal method. Thus under the temporal method we should use the historical rate to remeasure depreciation: 100SF × 0.77$/SF = $77.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 97–100<\/summary><div class=\"vig-body\"><p>Scud Co. is a Swiss subsidiary of the U.S. firm Patriot, Inc. On December 31, 2012 the $/SF exchange rate was 0.77. (Each Swiss Franc buys 77 cents) and is the historical rate applicable for fixed assets and common stock. One year later the Swiss Franc had appreciated to 0.85 $/SF. Scud Co. pays no dividends. The average exchange rate for the year was 0.80 $/SF. Scud pays no taxes. Assume that inventory is accounted for using the last in, first out (LIFO) inventory assumption and was bought and sold evenly throughout the year.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v031.webp\" style=\"max-width:min(100%,657px)\" alt=\"Scud Co. Int&#x27;l Balance Sheet (in SF thousands) Dec. 31, 2013 Dec. 31, 2012 400 600 Cash &amp; accounts receivables (A/R) 500 500 Inventory 600 700 Net Fixed Assets\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v032.webp\" style=\"max-width:min(100%,656px)\" alt=\"1,700 1,600 Total Assets 100 200 Accounts payable (A/P) 100 200 Long-term debt 1,300 1,300 Common Stock 100 Retained Earnings 1,700 1,600 Total Liabilities Income Statement (in SF thousands) December 31, 2013 In SF 7,000 Sales (6,800) Cost of Goods Sold (COGS) (100) Depreciation Translation Gain/Loss 100 Net Income\"><p>Assume that the functional currency is the U.S. dollar when answering the following questions.<\/p><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.d<\/div><div class=\"qtext\"><p>After remeasurement, depreciation will be closest to:<\/p><\/div>", "subj": "fsa"}, {"n": 98, "q": "The value of common stock on the 2013 balance sheet should be closest to:", "opts": ["$1,100.", "$1,050.", "$1,000."], "ans": "C", "expl": "Common stock is translated using the historical rate under both the temporal method and the current rate method: 1300SF × 0.77$/SF = $1001.", "explhtml": "<p>Common stock is translated using the historical rate under both the temporal method and the current rate method: 1300SF × 0.77$/SF = $1001.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 97–100<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Scud Co. is a Swiss subsidiary of the U.S. firm Patriot, Inc. On December 31, 2012 the $/SF exchange rate was 0.77. (Each Swiss Franc buys 77 cents) and is the historical rate applicable for fixed assets and common stock. One year later the Swiss Franc had appreciated to 0.85 $/SF. Scud Co. pays no dividends. The average exchange rate for the year was 0.80 $/SF. Scud pays no taxes. Assume that inventory is accounted for using the last in, first out (LIFO) inventory assumption and was bought and sold evenly throughout the year.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v031.webp\" style=\"max-width:min(100%,657px)\" alt=\"Scud Co. Int&#x27;l Balance Sheet (in SF thousands) Dec. 31, 2013 Dec. 31, 2012 400 600 Cash &amp; accounts receivables (A/R) 500 500 Inventory 600 700 Net Fixed Assets\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v032.webp\" style=\"max-width:min(100%,656px)\" alt=\"1,700 1,600 Total Assets 100 200 Accounts payable (A/P) 100 200 Long-term debt 1,300 1,300 Common Stock 100 Retained Earnings 1,700 1,600 Total Liabilities Income Statement (in SF thousands) December 31, 2013 In SF 7,000 Sales (6,800) Cost of Goods Sold (COGS) (100) Depreciation Translation Gain/Loss 100 Net Income\"><p>Assume that the functional currency is the U.S. dollar when answering the following questions.<\/p><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.d<\/div><div class=\"qtext\"><p>The value of common stock on the 2013 balance sheet should be closest to:<\/p><\/div>", "subj": "fsa"}, {"n": 99, "q": "For Scud Co. under the temporal method, the monetary exposures and the foreign currency movements resulted in a:", "opts": ["cumulative translation adjustment gain on the balance sheet.", "remeasurement gain on the income statement.", "remeasurement loss on the income statement."], "ans": "B", "expl": "The net monetary exposure is the value of Cash & accounts receivables (A/R) minus Accounts payable (A/P) and Long-term debt. This is Sf.600,000 – (Sf.200,000 +Sf.100,000) = Sf.300,000. As the Swiss franc appreciates from 0.77 $/SF to 0.85 $/SF, there is a remeasurement gain that is recorded as part of net income on the income statement. Exposure Foreign Currency  Temporal method: Appreciating Depreciating Net monetary assets Gain Loss Net monetary liabilities Loss Gain", "explhtml": "<p>The net monetary exposure is the value of Cash &amp; accounts receivables (A/R) minus Accounts payable (A/P) and Long-term debt. This is Sf.600,000 – (Sf.200,000 +Sf.100,000) = Sf.300,000. As the Swiss franc appreciates from 0.77 $/SF to 0.85 $/SF, there is a remeasurement gain that is recorded as part of net income on the income statement.<\/p><div class=\"tbl\"><table><tr><td>Exposure<\/td><td colspan=2>Foreign Currency<\/td><\/tr><tr><td>Temporal method:<\/td><td>Appreciating<\/td><td>Depreciating<\/td><\/tr><tr><td>Net monetary assets<\/td><td>Gain<\/td><td>Loss<\/td><\/tr><tr><td>Net monetary liabilities<\/td><td>Loss<\/td><td>Gain<\/td><\/tr><\/table><\/div>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 97–100<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Scud Co. is a Swiss subsidiary of the U.S. firm Patriot, Inc. On December 31, 2012 the $/SF exchange rate was 0.77. (Each Swiss Franc buys 77 cents) and is the historical rate applicable for fixed assets and common stock. One year later the Swiss Franc had appreciated to 0.85 $/SF. Scud Co. pays no dividends. The average exchange rate for the year was 0.80 $/SF. Scud pays no taxes. Assume that inventory is accounted for using the last in, first out (LIFO) inventory assumption and was bought and sold evenly throughout the year.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v031.webp\" style=\"max-width:min(100%,657px)\" alt=\"Scud Co. Int&#x27;l Balance Sheet (in SF thousands) Dec. 31, 2013 Dec. 31, 2012 400 600 Cash &amp; accounts receivables (A/R) 500 500 Inventory 600 700 Net Fixed Assets\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v032.webp\" style=\"max-width:min(100%,656px)\" alt=\"1,700 1,600 Total Assets 100 200 Accounts payable (A/P) 100 200 Long-term debt 1,300 1,300 Common Stock 100 Retained Earnings 1,700 1,600 Total Liabilities Income Statement (in SF thousands) December 31, 2013 In SF 7,000 Sales (6,800) Cost of Goods Sold (COGS) (100) Depreciation Translation Gain/Loss 100 Net Income\"><p>Assume that the functional currency is the U.S. dollar when answering the following questions.<\/p><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.d<\/div><div class=\"qtext\"><p>For Scud Co. under the temporal method, the monetary exposures and the foreign currency movements resulted in a:<\/p><\/div>", "subj": "fsa"}, {"n": 100, "q": "If Scud Co.'s functional currency is the Euro, then to adjust the currency exposure to the parent's currency, the US$, start with the:", "opts": ["Swiss franc and use the temporal method to convert to the functional currency, the Euro; then use the current rate method to convert to the presentation currency, the US$.", "Swiss franc and use the current rate method to convert to the functional currency, the Euro; then use the temporal method to convert to the presentation currency, the US$.", "Euro and use the current rate method to convert to the local currency, the Swiss franc; then use the temporal method to convert to the presentation currency, the US$."], "ans": "A", "expl": "Because the functional currency is neither the local currency nor the presentation currency, there will be two steps to the conversion. The functional currency is the intermediate step as local currency is converted to the functional currency, and then to the presentation currency: Sf → € → US$. The conversion from local currency to a functional currency uses the temporal method; the conversion from functional currency to a presentation currency uses the current rate method. Translation:\nCurrent Rate Method Remeasurement Temporal\nMethod Current Rate & Temporal\nMethods Presentation Currency Presentation Currency Presentation Currency  =  Functional Currency Functional Currency Functional Currency =   Local Currency Local Currency Local Currency", "explhtml": "<p>Because the functional currency is neither the local currency nor the presentation currency, there will be two steps to the conversion. The functional currency is the intermediate step as local currency is converted to the functional currency, and then to the presentation currency: Sf → € → US$. The conversion from local currency to a functional currency uses the temporal method; the conversion from functional currency to a presentation currency uses the current rate method.<\/p><div class=\"tbl\"><table><tr><td>Translation:<br>Current Rate Method<\/td><td>Remeasurement Temporal<br>Method<\/td><td>Current Rate &amp; Temporal<br>Methods<\/td><\/tr><tr><td>Presentation Currency<\/td><td>Presentation Currency<\/td><td>Presentation Currency<\/td><\/tr><tr><td><\/td><td>=<\/td><td><\/td><\/tr><tr><td>Functional Currency<\/td><td>Functional Currency<\/td><td>Functional Currency<\/td><\/tr><tr><td>=<\/td><td><\/td><td><\/td><\/tr><tr><td>Local Currency<\/td><td>Local Currency<\/td><td>Local Currency<\/td><\/tr><\/table><\/div>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 97–100<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Scud Co. is a Swiss subsidiary of the U.S. firm Patriot, Inc. On December 31, 2012 the $/SF exchange rate was 0.77. (Each Swiss Franc buys 77 cents) and is the historical rate applicable for fixed assets and common stock. One year later the Swiss Franc had appreciated to 0.85 $/SF. Scud Co. pays no dividends. The average exchange rate for the year was 0.80 $/SF. Scud pays no taxes. Assume that inventory is accounted for using the last in, first out (LIFO) inventory assumption and was bought and sold evenly throughout the year.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v031.webp\" style=\"max-width:min(100%,657px)\" alt=\"Scud Co. Int&#x27;l Balance Sheet (in SF thousands) Dec. 31, 2013 Dec. 31, 2012 400 600 Cash &amp; accounts receivables (A/R) 500 500 Inventory 600 700 Net Fixed Assets\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v032.webp\" style=\"max-width:min(100%,656px)\" alt=\"1,700 1,600 Total Assets 100 200 Accounts payable (A/P) 100 200 Long-term debt 1,300 1,300 Common Stock 100 Retained Earnings 1,700 1,600 Total Liabilities Income Statement (in SF thousands) December 31, 2013 In SF 7,000 Sales (6,800) Cost of Goods Sold (COGS) (100) Depreciation Translation Gain/Loss 100 Net Income\"><p>Assume that the functional currency is the U.S. dollar when answering the following questions.<\/p><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.d<\/div><div class=\"qtext\"><p>If Scud Co.&#x27;s functional currency is the Euro, then to adjust the currency exposure to the parent&#x27;s currency, the US$, start with the:<\/p><\/div>", "subj": "fsa"}, {"n": 101, "q": "The Herlitzka Company, a U.S. multinational firm, has a 100% stake in a Swiss subsidiary. The U.S. dollar (USD) has been determined to be the functional currency. All the common stock of the subsidiary was issued at the beginning of the year and the subsidiary uses the weighted-average inventory cost-flow assumption. In addition, the value of the SF is as follows: Beginning of year $0.5902 Average throughout the year $0.6002 End of year $0.6150 The SF-based balance sheet and income statement data for the Swiss subsidiary are as follows: Accounts receivable = 3,000 Inventory = 4,000 Fixed assets = 12,000 Accounts payable = 2,000 Long-term debt = 5,000 Common stock = 10,000 Retained earnings = 2,000 Net income = 2,000 The total value of net monetary assets is equal to:", "opts": ["-4,000 SF.", "12,000 SF.", "3,000 SF."], "ans": "A", "expl": "Monetary assets and liabilities include cash, A/R, A/P and Long-term debt. Hence, net monetary assets is equal to 3,000 − (2,000 + 5,000) = -4,000 SF.", "explhtml": "<p>Monetary assets and liabilities include cash, A/R, A/P and Long-term debt. Hence, net monetary assets is equal to 3,000 − (2,000 + 5,000) = -4,000 SF.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.6, LOS 9.f<\/div><div class=\"qtext\"><p>The Herlitzka Company, a U.S. multinational firm, has a 100% stake in a Swiss subsidiary. The U.S. dollar (USD) has been determined to be the functional currency. All the common stock of the subsidiary was issued at the beginning of the year and the subsidiary uses the weighted-average inventory cost-flow assumption. In addition, the value of the SF is as follows:<\/p><div class=\"tbl\"><table><tr><td>Beginning of year<\/td><td>$0.5902<\/td><\/tr><tr><td>Average throughout the year<\/td><td>$0.6002<\/td><\/tr><tr><td>End of year<\/td><td>$0.6150<\/td><\/tr><\/table><\/div><p>The SF-based balance sheet and income statement data for the Swiss subsidiary are as follows:<\/p><div class=\"tbl\"><table><tr><td>Accounts receivable<\/td><td>= 3,000<\/td><\/tr><tr><td>Inventory<\/td><td>= 4,000<\/td><\/tr><tr><td>Fixed assets<\/td><td>= 12,000<\/td><\/tr><tr><td>Accounts payable<\/td><td>= 2,000<\/td><\/tr><tr><td>Long-term debt<\/td><td>= 5,000<\/td><\/tr><tr><td>Common stock<\/td><td>= 10,000<\/td><\/tr><tr><td>Retained earnings<\/td><td>= 2,000<\/td><\/tr><tr><td>Net income<\/td><td>= 2,000<\/td><\/tr><\/table><\/div><p>The total value of net monetary assets is equal to:<\/p><\/div>", "subj": "fsa"}, {"n": 102, "q": "A U.S. firm owns a foreign subsidiary in France. In 2002, sales were EUR 1,000,000 and the USD/EUR exchange rate was 1.0620. In 2003, sales were EUR 1,100,000 and the exchange rate was 1.1417. What is the impact of the change in the value of the USD on the parent company's translated sales?", "opts": ["Sales will increase by 7.5%.", "Sales will decrease by 7.5%.", "Sales will increase by 18.25%."], "ans": "A", "expl": "The increase in sales due to the appreciating EUR is measured as 7.5% [= (1.1417 / 1.0620) − 1]. Sales for the subsidiary rose 10% [= (1,100,000 / 1,000,000) – 1] in the local currency (EUR). After translation the parent firm will report sales of USD 1,062,000 (= EUR 1,000,000 × 1.0620) for 2002 and USD 1,255,870 (= EUR 1,100,000 × 1.1417) for 2003. Growth measured from the parent's perspective suggests sales rose 18.25% [= (1,255,870 / 1,062,000) − 1], but this includes the growth rate in sales measured in the local currency and the rate of appreciation in the foreign currency, or (1.10 × 1.075) − 1 = 0.1825. The question only asks for the impact of the change in the value of the USD.", "explhtml": "<p>The increase in sales due to the appreciating EUR is measured as 7.5% [= (1.1417 / 1.0620) − 1]. Sales for the subsidiary rose 10% [= (1,100,000 / 1,000,000) – 1] in the local currency (EUR). After translation the parent firm will report sales of USD 1,062,000 (= EUR 1,000,000 × 1.0620) for 2002 and USD 1,255,870 (= EUR 1,100,000 × 1.1417) for 2003.<\/p><p>Growth measured from the parent&#x27;s perspective suggests sales rose 18.25% [= (1,255,870 / 1,062,000) − 1], but this includes the growth rate in sales measured in the local currency and the rate of appreciation in the foreign currency, or (1.10 × 1.075) − 1 = 0.1825. The question only asks for the impact of the change in the value of the USD.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.2, LOS 9.c<\/div><div class=\"qtext\"><p>A U.S. firm owns a foreign subsidiary in France. In 2002, sales were EUR 1,000,000 and the USD/EUR exchange rate was 1.0620. In 2003, sales were EUR 1,100,000 and the exchange rate was 1.1417. What is the impact of the change in the value of the USD on the parent company&#x27;s translated sales?<\/p><\/div>", "subj": "fsa"}, {"n": 103, "q": "Under the temporal method, the inventory and cost of goods sold (COGS) accounts are both nonmonetary accounts. Which of the following statements is least accurate regarding these accounts?", "opts": ["If the firm accounts for inventory using first in, first out (FIFO), then a more recent rate will be applied to the inventory account.", "The Inventory account is remeasured using the historical rate under both LIFO and FIFO.", "If the firm accounts for inventory using last in, first out (LIFO), then the beginningof-period rate is used to remeasure COGS."], "ans": "C", "expl": "Under LIFO, the last goods purchased are the first goods out to COGS. Hence, although technically the historical rate is used to remeasure COGS, a more recent rate is typically more appropriate for COGS under LIFO.", "explhtml": "<p>Under LIFO, the last goods purchased are the first goods out to COGS. Hence, although technically the historical rate is used to remeasure COGS, a more recent rate is typically more appropriate for COGS under LIFO.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.3, LOS 9.e<\/div><div class=\"qtext\"><p>Under the temporal method, the inventory and cost of goods sold (COGS) accounts are both nonmonetary accounts. Which of the following statements is least accurate regarding these accounts?<\/p><\/div>", "subj": "fsa"}, {"n": 104, "q": "On APJ's 2005 income statement, the level of net income in U.S. dollars would be:", "opts": ["$200.00.", "$300.00.", "$240.00."], "ans": "C", "expl": "The basis for using the current rate method is when Functional Currency is NOT the same as Parent's Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent's Presentation Currency. Since the Australian dollar is both the local and the functional currency, use the current rate method. The items in the income statement are translated at the average exchange rate. The average rate is (2 + 3) / 2 = 2.5 Australian dollars = $1.", "explhtml": "<p>The basis for using the current rate method is when Functional Currency is NOT the same as Parent&#x27;s Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent&#x27;s Presentation Currency.<\/p><p>Since the Australian dollar is both the local and the functional currency, use the current rate method. The items in the income statement are translated at the average exchange rate. The average rate is (2 + 3) / 2 = 2.5 Australian dollars = $1.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 104–107<\/summary><div class=\"vig-body\"><p>Dell Air Lines has recently acquired Australian Puddle Jumpers, Inc., a small airline located in Sydney. The Australian dollar has been chosen by Dell as the functional currency for APJ. The Balance Sheet of APJ is given below as of Dec. 31, 2004 in Australian dollars.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v033.webp\" style=\"max-width:min(100%,664px)\" alt=\"Assets Liabilities and Equity 200 A/P 180 Cash Common Stock 720 240 A/R Maintenance Supplies 180 Fixed Assets 280 Total Liab &amp; Equity Total Assets 900 900 APJ&#x27;s income statement for the year ending Dec. 31, 2005 is expressed in Australian dollars as: 3,500 Sales\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v034.webp\" style=\"max-width:min(100%,664px)\" alt=\"2,900 Total Costs Net Income 600 The Australian dollar has steadily depreciated against the U.S. dollar. At Dec. 31, 2004, the exchange rate was 2 Australian dollars = $1 but at Dec. 31, 2005, the exchange rate had deteriorated to 3 Australian dollars = $1. The Dec. 31, 2005 Balance Sheet for APJ is given in Australian dollars as follows: Liabilities and Equity Assets 441 210 Cash A/P Common Stock 720 330 AVR Supplies 291 Retained Earnings 600 Fixed Assets 468 Total Liab. &amp; Equity Total Assets 1,530 1,530\"><\/div><\/details><div class=\"pp-topic\">Module 9.6, LOS 9.f<\/div><div class=\"qtext\"><p>On APJ&#x27;s 2005 income statement, the level of net income in U.S. dollars would be:<\/p><\/div>", "subj": "fsa"}, {"n": 105, "q": "On APJ's 2005 balance sheet, the level of common stock (not including retained earnings) in U.S. dollars would be:", "opts": ["$288.", "$360.", "$240."], "ans": "B", "expl": "Since the Australian dollar is the local and the functional currency, use the current rate method. In the balance sheet, all accounts are translated at the current exchange rate, except for the common stock account, which is translated at the historical rate. Common Stock (720 / 2) = 360", "explhtml": "<p>Since the Australian dollar is the local and the functional currency, use the current rate method.<\/p><p>In the balance sheet, all accounts are translated at the current exchange rate, except for the common stock account, which is translated at the historical rate.<\/p><p>Common Stock (720 / 2) = 360<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 104–107<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dell Air Lines has recently acquired Australian Puddle Jumpers, Inc., a small airline located in Sydney. The Australian dollar has been chosen by Dell as the functional currency for APJ. The Balance Sheet of APJ is given below as of Dec. 31, 2004 in Australian dollars.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v033.webp\" style=\"max-width:min(100%,664px)\" alt=\"Assets Liabilities and Equity 200 A/P 180 Cash Common Stock 720 240 A/R Maintenance Supplies 180 Fixed Assets 280 Total Liab &amp; Equity Total Assets 900 900 APJ&#x27;s income statement for the year ending Dec. 31, 2005 is expressed in Australian dollars as: 3,500 Sales\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v034.webp\" style=\"max-width:min(100%,664px)\" alt=\"2,900 Total Costs Net Income 600 The Australian dollar has steadily depreciated against the U.S. dollar. At Dec. 31, 2004, the exchange rate was 2 Australian dollars = $1 but at Dec. 31, 2005, the exchange rate had deteriorated to 3 Australian dollars = $1. The Dec. 31, 2005 Balance Sheet for APJ is given in Australian dollars as follows: Liabilities and Equity Assets 441 210 Cash A/P Common Stock 720 330 AVR Supplies 291 Retained Earnings 600 Fixed Assets 468 Total Liab. &amp; Equity Total Assets 1,530 1,530\"><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.e<\/div><div class=\"qtext\"><p>On APJ&#x27;s 2005 balance sheet, the level of common stock (not including retained earnings) in U.S. dollars would be:<\/p><\/div>", "subj": "fsa"}, {"n": 106, "q": "On APJ's 2005 balance sheet, the foreign currency translation adjustment in U.S. dollars would be:", "opts": ["−$220.", "−$160.", "−$280."], "ans": "B", "expl": "Since the Australian dollar is both the local and the functional currency, use the current rate method. When using the current rate method, all assets and liabilities are translated at the current rate. Total assets = 1530/3 = 510 and accounts payable = 210/3 = 70. The common stock is translated at the historical rate on the date of purchase = 720/2 = 360. Beginning retained earnings = 0, so ending retained earnings = translated net income = 240. The cumulative translation adjustment is the plug figure that makes the balance sheet balance = 510 − 70 − 360 − 240 = −160.", "explhtml": "<p>Since the Australian dollar is both the local and the functional currency, use the current rate method.<\/p><p>When using the current rate method, all assets and liabilities are translated at the current rate. Total assets = 1530/3 = 510 and accounts payable = 210/3 = 70. The common stock is translated at the historical rate on the date of purchase = 720/2 = 360. Beginning retained earnings = 0, so ending retained earnings = translated net income = 240. The cumulative translation adjustment is the plug figure that makes the balance sheet balance = 510 − 70 − 360 − 240 = −160.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 104–107<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dell Air Lines has recently acquired Australian Puddle Jumpers, Inc., a small airline located in Sydney. The Australian dollar has been chosen by Dell as the functional currency for APJ. The Balance Sheet of APJ is given below as of Dec. 31, 2004 in Australian dollars.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v033.webp\" style=\"max-width:min(100%,664px)\" alt=\"Assets Liabilities and Equity 200 A/P 180 Cash Common Stock 720 240 A/R Maintenance Supplies 180 Fixed Assets 280 Total Liab &amp; Equity Total Assets 900 900 APJ&#x27;s income statement for the year ending Dec. 31, 2005 is expressed in Australian dollars as: 3,500 Sales\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v034.webp\" style=\"max-width:min(100%,664px)\" alt=\"2,900 Total Costs Net Income 600 The Australian dollar has steadily depreciated against the U.S. dollar. At Dec. 31, 2004, the exchange rate was 2 Australian dollars = $1 but at Dec. 31, 2005, the exchange rate had deteriorated to 3 Australian dollars = $1. The Dec. 31, 2005 Balance Sheet for APJ is given in Australian dollars as follows: Liabilities and Equity Assets 441 210 Cash A/P Common Stock 720 330 AVR Supplies 291 Retained Earnings 600 Fixed Assets 468 Total Liab. &amp; Equity Total Assets 1,530 1,530\"><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.e<\/div><div class=\"qtext\"><p>On APJ&#x27;s 2005 balance sheet, the foreign currency translation adjustment in U.S. dollars would be:<\/p><\/div>", "subj": "fsa"}, {"n": 107, "q": "Which one of the following statements correctly describes the effect on Dell's financial statements if the U.S. dollar had been chosen as the functional currency?", "opts": ["The current rate method would apply.", "The translation adjustment would appear as a line item on Dell's balance sheet.", "The translation adjustment would appear as a line item on Dell's income statement."], "ans": "C", "expl": "If the U.S. dollar had been chosen as the functional currency, then the provisions of the temporal method would apply. Under the temporal method, the translation adjustment would appear as a line item on Dell's income statement and not as an element of equity. Hence, earnings may become more volatile as a result.", "explhtml": "<p>If the U.S. dollar had been chosen as the functional currency, then the provisions of the temporal method would apply. Under the temporal method, the translation adjustment would appear as a line item on Dell&#x27;s income statement and not as an element of equity. Hence, earnings may become more volatile as a result.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 104–107<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dell Air Lines has recently acquired Australian Puddle Jumpers, Inc., a small airline located in Sydney. The Australian dollar has been chosen by Dell as the functional currency for APJ. The Balance Sheet of APJ is given below as of Dec. 31, 2004 in Australian dollars.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v033.webp\" style=\"max-width:min(100%,664px)\" alt=\"Assets Liabilities and Equity 200 A/P 180 Cash Common Stock 720 240 A/R Maintenance Supplies 180 Fixed Assets 280 Total Liab &amp; Equity Total Assets 900 900 APJ&#x27;s income statement for the year ending Dec. 31, 2005 is expressed in Australian dollars as: 3,500 Sales\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v034.webp\" style=\"max-width:min(100%,664px)\" alt=\"2,900 Total Costs Net Income 600 The Australian dollar has steadily depreciated against the U.S. dollar. At Dec. 31, 2004, the exchange rate was 2 Australian dollars = $1 but at Dec. 31, 2005, the exchange rate had deteriorated to 3 Australian dollars = $1. The Dec. 31, 2005 Balance Sheet for APJ is given in Australian dollars as follows: Liabilities and Equity Assets 441 210 Cash A/P Common Stock 720 330 AVR Supplies 291 Retained Earnings 600 Fixed Assets 468 Total Liab. &amp; Equity Total Assets 1,530 1,530\"><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.e<\/div><div class=\"qtext\"><p>Which one of the following statements correctly describes the effect on Dell&#x27;s financial statements if the U.S. dollar had been chosen as the functional currency?<\/p><\/div>", "subj": "fsa"}, {"n": 108, "q": "The nation of Deadoa is experiencing hyperinflation. A subsidiary of a multinational operating in Deadoa will notice changes in its purchasing power and in its financial results as reported on its parent company's financial statements. Which of the following best describes the situation for a subsidiary operating in Deadoa? Purchasing power will:", "opts": ["dramatically appreciate and the local currency will be rapidly appreciating against the presentation currency.", "quickly deteriorate and the local currency will be rapidly appreciating against the presentation currency.", "quickly deteriorate and the local currency will be rapidly depreciating against the presentation currency."], "ans": "C", "expl": "Purchasing power and Deadoa currency will depreciate.", "explhtml": "<p>Purchasing power and Deadoa currency will depreciate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.7, LOS 9.g<\/div><div class=\"qtext\"><p>The nation of Deadoa is experiencing hyperinflation. A subsidiary of a multinational operating in Deadoa will notice changes in its purchasing power and in its financial results as reported on its parent company&#x27;s financial statements. Which of the following best describes the situation for a subsidiary operating in Deadoa? Purchasing power will:<\/p><\/div>", "subj": "fsa"}, {"n": 109, "q": "Hann Company is a U.S. multinational firm with operations in several foreign countries. Hann has a 100% stake in a French subsidiary. The foreign subsidiary's local currency has appreciated against the U.S. dollar over the latest financial statement reporting period. In addition, the French firm accounts for inventories using the first in, first out (FIFO) inventory cost-flow assumption. The gross profit margin as computed under the current rate method would most likely be:", "opts": ["lower than the gross profit margin as computed under the temporal method.", "higher than the gross profit margin as computed under the temporal method.", "equal to the gross profit margin as computed under the temporal method."], "ans": "A", "expl": "The average rate is used to convert sales under both the temporal method and the current rate method. Hence, the only difference between the two computations is on cost of goods sold (COGS). Since the firm uses FIFO, older materials are flowing into COGS and an older exchange rate applies. Since in the past the foreign currency bought fewer dollars, the gross profit under the temporal method will be higher than that of the current rate method. It may help to 'think' that with the current rate method, you use the average rate for COGS, which makes COGS higher because the currency has appreciated.", "explhtml": "<p>The average rate is used to convert sales under both the temporal method and the current rate method. Hence, the only difference between the two computations is on cost of goods sold (COGS). Since the firm uses FIFO, older materials are flowing into COGS and an older exchange rate applies. Since in the past the foreign currency bought fewer dollars, the gross profit under the temporal method will be higher than that of the current rate method. It may help to &#x27;think&#x27; that with the current rate method, you use the average rate for COGS, which makes COGS higher because the currency has appreciated.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.6, LOS 9.f<\/div><div class=\"qtext\"><p>Hann Company is a U.S. multinational firm with operations in several foreign countries. Hann has a 100% stake in a French subsidiary. The foreign subsidiary&#x27;s local currency has appreciated against the U.S. dollar over the latest financial statement reporting period. In addition, the French firm accounts for inventories using the first in, first out (FIFO) inventory cost-flow assumption. The gross profit margin as computed under the current rate method would most likely be:<\/p><\/div>", "subj": "fsa"}, {"n": 110, "q": "Which of the following subsidiary ratios will be affected by the translation adjustment under the current rate method?", "opts": ["Return on equity.", "Gross margin.", "Net profit margin."], "ans": "A", "expl": "The translation adjustment will affect the book value of equity and therefore the return on equity ratio. The other ratios are pure ratios (both component of the ratio come from the income statement) and are not affected by translation.", "explhtml": "<p>The translation adjustment will affect the book value of equity and therefore the return on equity ratio. The other ratios are pure ratios (both component of the ratio come from the income statement) and are not affected by translation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.6, LOS 9.f<\/div><div class=\"qtext\"><p>Which of the following subsidiary ratios will be affected by the translation adjustment under the current rate method?<\/p><\/div>", "subj": "fsa"}, {"n": 111, "q": "The U.S. dollar has been depreciating relative to the local currency over the past year. The use of the current rate method to translate a foreign subsidiary's financial statements to U.S. dollars will most likely have which of the following effects on the operating profit margin (EBIT/S) relative to what the ratio would have been without the effects of translation?", "opts": ["The ratio will fall.", "There will be no effect on the ratio.", "The ratio will rise."], "ans": "B", "expl": "Under the current rate method, the average rate is applied to all income statement accounts. Hence, since the average rate is applied to both numerator and denominator of the equation and the ratio will not change.", "explhtml": "<p>Under the current rate method, the average rate is applied to all income statement accounts. Hence, since the average rate is applied to both numerator and denominator of the equation and the ratio will not change.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.6, LOS 9.f<\/div><div class=\"qtext\"><p>The U.S. dollar has been depreciating relative to the local currency over the past year. The use of the current rate method to translate a foreign subsidiary&#x27;s financial statements to U.S. dollars will most likely have which of the following effects on the operating profit margin (EBIT/S) relative to what the ratio would have been without the effects of translation?<\/p><\/div>", "subj": "fsa"}, {"n": 112, "q": "Sopgate is a manufacturer of branded fast moving consumer goods having business operations in 28 countries (in each country, Sopgate has a wholly owned local subsidiary for production and/or distribution). Following information is available from Sopgate's annual report: Region Revenue Growth (USD)* Growth in pre-tax profits\n(USD)* Tax rate Latin America 5% 4% 25% North America 3% 3% 35% Europe 2% −1% 45% Asia pacific 4% 6% 20% *Growth rate indicates expected growth rate over the next five years. Sopgate's effective tax rate is most likely expected to:", "opts": ["remain unchanged.", "decrease.", "increase."], "ans": "B", "expl": "Sopgate's profits are expected to grow at a faster rate for lower tax rate regions as compared to higher tax regions. Hence the effective tax rate can be expected to decrease.", "explhtml": "<p>Sopgate&#x27;s profits are expected to grow at a faster rate for lower tax rate regions as compared to higher tax regions. Hence the effective tax rate can be expected to decrease.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.8, LOS 9.h<\/div><div class=\"qtext\"><p>Sopgate is a manufacturer of branded fast moving consumer goods having business operations in 28 countries (in each country, Sopgate has a wholly owned local subsidiary for production and/or distribution). Following information is available from Sopgate&#x27;s annual report:<\/p><div class=\"tbl\"><table><tr><td>Region<\/td><td>Revenue Growth (USD)*<\/td><td>Growth in pre-tax profits<br>(USD)*<\/td><td>Tax rate<\/td><\/tr><tr><td>Latin America<\/td><td>5%<\/td><td>4%<\/td><td>25%<\/td><\/tr><tr><td>North America<\/td><td>3%<\/td><td>3%<\/td><td>35%<\/td><\/tr><tr><td>Europe<\/td><td>2%<\/td><td>−1%<\/td><td>45%<\/td><\/tr><tr><td>Asia pacific<\/td><td>4%<\/td><td>6%<\/td><td>20%<\/td><\/tr><\/table><\/div><p>*Growth rate indicates expected growth rate over the next five years.<\/p><p>Sopgate&#x27;s effective tax rate is most likely expected to:<\/p><\/div>", "subj": "fsa"}, {"n": 113, "q": "A German company (reporting currency = Euro) owns a foreign subsidiary in the U.S. If the results below are reported in local currency (USD), after translation what is the effect of the change in the exchange rate on revenues? Round to the nearest dollar and/or percent. Year Sales $ per 1 Euro avg.\nExchange Rate 2001 $10,000 0.9 2002 $10,000 0.8", "opts": ["The company shows a 0.1% decline in revenues in 2002.", "The company shows a 12.5% growth in revenues in 2002.", "There is no change is revenue growth between 2001 and 2002."], "ans": "B", "expl": "While sales were flat in terms of local currency, after translation the reported revenue increased 12.5%. 10,000/0.9 = 11,111; 10,000/0.8 = 12,500; 12,500/11,111 = 12.5% increase due to exchange rate effects.", "explhtml": "<p>While sales were flat in terms of local currency, after translation the reported revenue increased 12.5%. 10,000/0.9 = 11,111; 10,000/0.8 = 12,500; 12,500/11,111 = 12.5% increase due to exchange rate effects.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.2, LOS 9.c<\/div><div class=\"qtext\"><p>A German company (reporting currency = Euro) owns a foreign subsidiary in the U.S. If the results below are reported in local currency (USD), after translation what is the effect of the change in the exchange rate on revenues? Round to the nearest dollar and/or percent.<\/p><div class=\"tbl\"><table><tr><td>Year<\/td><td>Sales<\/td><td>$ per 1 Euro avg.<br>Exchange Rate<\/td><\/tr><tr><td>2001<\/td><td>$10,000<\/td><td>0.9<\/td><\/tr><tr><td>2002<\/td><td>$10,000<\/td><td>0.8<\/td><\/tr><\/table><\/div><\/div>", "subj": "fsa"}, {"n": 114, "q": "Which of the following statements regarding the functional currency under US GAAP is least accurate?", "opts": ["Self-contained, independent subsidiaries whose operations are primarily located in the local market will use the local currency as the functional currency.", "If a firm operates in a country or environment which is subject to cumulative inflation of 100% or more over a three year period, that firm will use the parent's currency as the functional currency.", "The functional currency is defined as the primary currency of the economic environment in which the parent firm operates."], "ans": "C", "expl": "The basis for using the current rate method is when Functional Currency is NOT the same as Parent's Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent's Presentation Currency. The functional currency is defined as the primary currency of the economic environment in which the foreign subsidiary operates.", "explhtml": "<p>The basis for using the current rate method is when Functional Currency is NOT the same as Parent&#x27;s Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent&#x27;s Presentation Currency.<\/p><p>The functional currency is defined as the primary currency of the economic environment in which the foreign subsidiary operates.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.3, LOS 9.e<\/div><div class=\"qtext\"><p>Which of the following statements regarding the functional currency under US GAAP is least accurate?<\/p><\/div>", "subj": "fsa"}, {"n": 115, "q": "Before Jameson can perform any financial statement analysis she needs to determine which method WB uses to translate Kasamatsu's earnings into U.S. dollars (USD). Which of the following is the most appropriate method to use?", "opts": ["The temporal method.", "The current rate method.", "First the temporal method, followed by the current rate method."], "ans": "B", "expl": "The basis for using the current rate method is when Functional Currency is NOT the same as Parent's Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent's Presentation Currency. Under US GAAP the current method must be used to translate the yen financial statements into USD, the reporting currency. Had Kasamatsu been operating in a highly inflationary environment or had the local and functional currency not been the same, then WB would be required to use the temporal method.", "explhtml": "<p>The basis for using the current rate method is when Functional Currency is NOT the same as Parent&#x27;s Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent&#x27;s Presentation Currency.<\/p><p>Under US GAAP the current method must be used to translate the yen financial statements into USD, the reporting currency. Had Kasamatsu been operating in a highly inflationary environment or had the local and functional currency not been the same, then WB would be required to use the temporal method.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 115–116<\/summary><div class=\"vig-body\"><p>Wasson Brothers (WB) is a large U.S. based conglomerate with many subsidiaries in both the U.S. and abroad. One of WB's wholly-owned foreign subsidiaries, Kasamatsu Industries, is based in Japan and manufactures a hugely successful line of trading cards, toys, and other related products. All of Kasamatsu's operations and sales take place in Japan, and the corresponding transactions are denominated in Japanese yen, Additionally, Kasamatsu's books and records are all maintained in yen. WB reports its earnings in U.S. dollars. The history of the exchange rate between the dollar and the yen over the last two years is presented in the following table. Figures are presented in Yen/dollars.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v035.webp\" style=\"max-width:min(100%,535px)\" alt=\"Yen/Dollar Exchange Rate 150 December 31, 2005 130 December 31, 2004 140 2005 Average 120 2004 Average Exchange rate on date that 2005 dividends were 145 declared by Kasmatsu Exchange rate on date of stock issue and acquisition of 100 fixed assets.\"><p>Ashley Jameson is an analyst with Henderson-Wells, an investment banking firm in New York, and is the chief analyst covering WB. She believes that the enormous success of the trading cards has contributed greatly to WB's bottom line. However, she believes that this effect may be misstated in the company's financial statements because of the recent volatility in exchange rates. Many analysts at other major investment banking firms have been raising their ratings on WB because of the recent earnings growth. Jameson, however, wants to be absolutely certain that these results are accurate and fully attributable to Kasamatsu's hot new product and not a result of an exchange rate fluctuation. The following are the financial statements of Kasamatsu, stated in thousands of yen.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v036.webp\" style=\"max-width:min(100%,559px)\" alt=\"Financial Statements for Year Ending December 31, 2005 (in thousands of yen) Statement of Income and Retained Earnings 700,000 Sales Expenses 280,000 Cost of Goods Sold (COGS)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v037.webp\" style=\"max-width:min(100%,604px)\" alt=\"126,000 Depreciation 77,000 SG&amp;A Total Expenses 483,000 217,000 Earnings Before Taxes (EBT) 98,000 Income Tax Expense 119,000 Net Income 250,000 Retained Earnings: December 31, 2004 369,000 58,000 Dividends 311,000 Retained Earnings: December 31, 2005* * Retained earnings on 12/31/2005 were US $2million Balance Sheet Assets 60,000 Cash and receivables 180,000 Inventory 200,000 Land Fixed assets 346,000 786,000 Total assets Liabilities and stockholders&#x27; equity Liabilities 300,000 175,000 Capital stock 311,000 Retained earnings Total liabilities and stockholders&#x27; equity 786,000\"><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.e<\/div><div class=\"qtext\"><p>Before Jameson can perform any financial statement analysis she needs to determine which method WB uses to translate Kasamatsu&#x27;s earnings into U.S. dollars (USD). Which of the following is the most appropriate method to use?<\/p><\/div>", "subj": "fsa"}, {"n": 116, "q": "Jameson must also determine how the fluctuation in the yen vs. the dollar has affected Kasamatsu's earnings in the reporting currency. Which of the following best describes the effect of changes in the yen/dollar rate has had on earnings in the reporting currency? Earnings have:", "opts": ["decreased because the yen is depreciating versus the USD.", "increased because the yen is appreciating versus the USD.", "increased because the yen is depreciating versus the USD."], "ans": "A", "expl": "Examination of the history of the exchange rate shows that both the year-end and average exchange rates are lower in 2005 than in 2004 (lower in that the yen has weakened vs. the USD). Therefore, Kasamatsu has to earn more yen than it did in the previous year for WB to be able to report the same dollar amount of net income. This means that the true economic performance of Kasamatsu is understated when viewed as a component of WB's net income.", "explhtml": "<p>Examination of the history of the exchange rate shows that both the year-end and average exchange rates are lower in 2005 than in 2004 (lower in that the yen has weakened vs. the USD). Therefore, Kasamatsu has to earn more yen than it did in the previous year for WB to be able to report the same dollar amount of net income. This means that the true economic performance of Kasamatsu is understated when viewed as a component of WB&#x27;s net income.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 115–116<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Wasson Brothers (WB) is a large U.S. based conglomerate with many subsidiaries in both the U.S. and abroad. One of WB's wholly-owned foreign subsidiaries, Kasamatsu Industries, is based in Japan and manufactures a hugely successful line of trading cards, toys, and other related products. All of Kasamatsu's operations and sales take place in Japan, and the corresponding transactions are denominated in Japanese yen, Additionally, Kasamatsu's books and records are all maintained in yen. WB reports its earnings in U.S. dollars. The history of the exchange rate between the dollar and the yen over the last two years is presented in the following table. Figures are presented in Yen/dollars.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v035.webp\" style=\"max-width:min(100%,535px)\" alt=\"Yen/Dollar Exchange Rate 150 December 31, 2005 130 December 31, 2004 140 2005 Average 120 2004 Average Exchange rate on date that 2005 dividends were 145 declared by Kasmatsu Exchange rate on date of stock issue and acquisition of 100 fixed assets.\"><p>Ashley Jameson is an analyst with Henderson-Wells, an investment banking firm in New York, and is the chief analyst covering WB. She believes that the enormous success of the trading cards has contributed greatly to WB's bottom line. However, she believes that this effect may be misstated in the company's financial statements because of the recent volatility in exchange rates. Many analysts at other major investment banking firms have been raising their ratings on WB because of the recent earnings growth. Jameson, however, wants to be absolutely certain that these results are accurate and fully attributable to Kasamatsu's hot new product and not a result of an exchange rate fluctuation. The following are the financial statements of Kasamatsu, stated in thousands of yen.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v036.webp\" style=\"max-width:min(100%,559px)\" alt=\"Financial Statements for Year Ending December 31, 2005 (in thousands of yen) Statement of Income and Retained Earnings 700,000 Sales Expenses 280,000 Cost of Goods Sold (COGS)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v037.webp\" style=\"max-width:min(100%,604px)\" alt=\"126,000 Depreciation 77,000 SG&amp;A Total Expenses 483,000 217,000 Earnings Before Taxes (EBT) 98,000 Income Tax Expense 119,000 Net Income 250,000 Retained Earnings: December 31, 2004 369,000 58,000 Dividends 311,000 Retained Earnings: December 31, 2005* * Retained earnings on 12/31/2005 were US $2million Balance Sheet Assets 60,000 Cash and receivables 180,000 Inventory 200,000 Land Fixed assets 346,000 786,000 Total assets Liabilities and stockholders&#x27; equity Liabilities 300,000 175,000 Capital stock 311,000 Retained earnings Total liabilities and stockholders&#x27; equity 786,000\"><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.e<\/div><div class=\"qtext\"><p>Jameson must also determine how the fluctuation in the yen vs. the dollar has affected Kasamatsu&#x27;s earnings in the reporting currency. Which of the following best describes the effect of changes in the yen/dollar rate has had on earnings in the reporting currency? Earnings have:<\/p><\/div>", "subj": "fsa"}, {"n": 117, "q": "In a hyperinflationary economy, translation under the current rate method will most likely result in relatively:", "opts": ["low balance sheet values for long term liabilities.", "high balance sheet values for long term assets.", "high translation gains."], "ans": "A", "expl": "In a hyperinflationary economy, translation under the current rate method will most likely result in relatively low balance sheet values for assets and liabilities. Translation losses will also occur.", "explhtml": "<p>In a hyperinflationary economy, translation under the current rate method will most likely result in relatively low balance sheet values for assets and liabilities. Translation losses will also occur.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.7, LOS 9.g<\/div><div class=\"qtext\"><p>In a hyperinflationary economy, translation under the current rate method will most likely result in relatively:<\/p><\/div>", "subj": "fsa"}, {"n": 118, "q": "The Precision Screen Printers (PSP) Company has a foreign subsidiary, the Acer Tool & Die Company, located in the country of Rolivia. The currency of Rolivia is the Chad. The balance sheet and income statement of Acer Tool & Die Company for the year-ended December 31, 20X2, is shown below. The balance sheet has been restated using the U.S. dollar as the functional currency. Acer Tool & Die Company Balance Sheet As of December 31, 20X2     Chad\n(millions) Exchange Rate\n(Chad/US$) U.S. $\n(millions) Cash  20  0.25  $80 | Accounts receivable  30  0.25
