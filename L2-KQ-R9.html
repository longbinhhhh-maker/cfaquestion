<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 9 — Multinational Operations · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}

  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}

    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}

<style id="l2-css">

</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";

ncy gain or loss appears on the income statement under the temporal method. Hence, to make any determinations regarding the movements of this ratio, we need more information regarding the net monetary asset or liability position as of both the beginning and ending balance sheet date.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.6, LOS 9.f<\/div><div class=\"qtext\"><p>Hann Company is a U.S. multinational firm with operations in several foreign countries. Hann has a 100 percent stake in a French subsidiary. The foreign subsidiary&#x27;s local currency has appreciated against the U.S. dollar over the latest financial statement reporting period. In addition, the French firm accounts for inventories using the FIFO inventory cost-flow assumption. The net profit margin as computed under the current rate method would most likely be:<\/p><\/div>", "subj": "fsa"}, {"n": 8, "q": "Which example least accurately describes pure balance sheet and income statement ratios?", "opts": ["All pure balance sheet ratios are affected by the all-current translation method.", "The current ratio is a pure balance sheet ratio.", "When multiplying both the numerator and denominator by the current exchange rate, the current rate is cancelled."], "ans": "A", "expl": "All pure balance sheet ratios are unaffected by the all-current translation method.", "explhtml": "<p>All pure balance sheet ratios are unaffected by the all-current translation method.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.6, LOS 9.f<\/div><div class=\"qtext\"><p>Which example least accurately describes pure balance sheet and income statement ratios?<\/p><\/div>", "subj": "fsa"}, {"n": 9, "q": "An important distinction between the temporal method and the current rate method is that:", "opts": ["the current rate method results in an adjustment to the equity account on the balance sheet. The temporal method results in a gain or loss appearing on the income statement.", "monetary assets and liabilities are remeasured (temporal method) at historical rates but translated (current rate method) at current rates.", "depreciation and cost of goods sold (COGS) are a function of the current rate under translation (current rate method), but a function of the average rate under remeasurement (temporal method)."], "ans": "A", "expl": "The current rate method results in an adjustment to the equity account on the balance sheet. The temporal method results in a gain or loss appearing on the income statement. Depreciation and COGS are a function of the average rate under the current rate method, but a function of the historical rate under the temporal method. Monetary assets and liabilities are use the current rates under both methods.", "explhtml": "<p>The current rate method results in an adjustment to the equity account on the balance sheet. The temporal method results in a gain or loss appearing on the income statement. Depreciation and COGS are a function of the average rate under the current rate method, but a function of the historical rate under the temporal method. Monetary assets and liabilities are use the current rates under both methods.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.4, LOS 9.e<\/div><div class=\"qtext\"><p>An important distinction between the temporal method and the current rate method is that:<\/p><\/div>", "subj": "fsa"}, {"n": 10, "q": "The Herlitzka Company, a U.S. multinational firm, has a 100% stake in a Swiss subsidiary. The Swiss franc (SF) has been determined to be the functional currency. All the common stock of the subsidiary was issued at the beginning of the year and the subsidiary uses the FIFO inventory cost-flow assumption. In addition, the value of the SF is as follows: Beginning of year $0.5902 Average throughout the year $0.6002 End of year $0.6150 The SF-based balance sheet and income statement data for the Swiss subsidiary are as follows: Accounts receivable = 3,000 Inventory = 4,000 Fixed assets = 12,000 Accounts payable = 2,000 Long-term debt = 5,000 Common stock = 10,000 Retained earnings = 2,000 Net income = 2,000 The translated value of common stock and long-term debt respectively are:", "opts": ["$5,902 and $3,001.", "$6,150 and $3,075.", "$5,902 and $3,075."], "ans": "C", "expl": "The basis for using the current rate method is when Functional Currency is NOT the same as Parent's Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent's Presentation Currency. Since the SF is the functional currency, use the current rate method. Common stock is translated at the historical rate which is the rate that applied when the transaction was made or $0.5902 and long-term debt is translated at the current rate of $0.615. 10,000 × 0.5902 = $5,902 for common stock and 5000 × 0.6150 = $3,075 for long term debt.", "explhtml": "<p>The basis for using the current rate method is when Functional Currency is NOT the same as Parent&#x27;s Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent&#x27;s Presentation Currency.<\/p><p>Since the SF is the functional currency, use the current rate method. Common stock is translated at the historical rate which is the rate that applied when the transaction was made or $0.5902 and long-term debt is translated at the current rate of $0.615. 10,000 × 0.5902 = $5,902 for common stock and 5000 × 0.6150 = $3,075 for long term debt.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.6, LOS 9.f<\/div><div class=\"qtext\"><p>The Herlitzka Company, a U.S. multinational firm, has a 100% stake in a Swiss subsidiary. The Swiss franc (SF) has been determined to be the functional currency. All the common stock of the subsidiary was issued at the beginning of the year and the subsidiary uses the FIFO inventory cost-flow assumption. In addition, the value of the SF is as follows:<\/p><div class=\"tbl\"><table><tr><td>Beginning of year<\/td><td>$0.5902<\/td><\/tr><tr><td>Average throughout the year<\/td><td>$0.6002<\/td><\/tr><tr><td>End of year<\/td><td>$0.6150<\/td><\/tr><\/table><\/div><p>The SF-based balance sheet and income statement data for the Swiss subsidiary are as follows:<\/p><div class=\"tbl\"><table><tr><td>Accounts receivable<\/td><td>= 3,000<\/td><\/tr><tr><td>Inventory<\/td><td>= 4,000<\/td><\/tr><tr><td>Fixed assets<\/td><td>= 12,000<\/td><\/tr><tr><td>Accounts payable<\/td><td>= 2,000<\/td><\/tr><tr><td>Long-term debt<\/td><td>= 5,000<\/td><\/tr><tr><td>Common stock<\/td><td>= 10,000<\/td><\/tr><tr><td>Retained earnings<\/td><td>= 2,000<\/td><\/tr><tr><td>Net income<\/td><td>= 2,000<\/td><\/tr><\/table><\/div><p>The translated value of common stock and long-term debt respectively are:<\/p><\/div>", "subj": "fsa"}, {"n": 11, "q": "Which of the following statements regarding the foreign currency translation under US GAAP is least accurate? The functional currency is the:", "opts": ["subsidiary's local currency for self-contained, independent foreign subsidiaries.", "parent firm's home currency for self-contained independent foreign subsidiaries.", "parent firm's home currency if the foreign subsidiary operates in a country with high inflation."], "ans": "B", "expl": "The basis for using the current rate method is when Functional Currency is NOT the same as Parent's Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent's Presentation Currency. This statement is incorrect, both remaining statements are correct regarding rules that govern the determination of the functional currency of subsidiaries.", "explhtml": "<p>The basis for using the current rate method is when Functional Currency is NOT the same as Parent&#x27;s Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent&#x27;s Presentation Currency.<\/p><p>This statement is incorrect, both remaining statements are correct regarding rules that govern the determin e appropriate because all non-monetary accounts are remeasured at the historical rate. Under IFRS, the financials would be restated for inflation, and then translated under the current rate method.", "explhtml": "<p>The temporal method is more appropriate because all non-monetary accounts are remeasured at the historical rate. Under IFRS, the financials would be restated for inflation, and then translated under the current rate method.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.7, LOS 9.g<\/div><div class=\"qtext\"><p>Which translation method should be used under a hyperinflationary economy when using U.S. GAAP?<\/p><\/div>", "subj": "fsa"}, {"n": 19, "q": "Which of the following general statements is most accurate with respect to the temporal method? Nonmonetary assets are translated at:", "opts": ["the current rate.", "historical rates at the time of the transaction.", "the average rate during the year."], "ans": "B", "expl": "As a general rule in using the temporal method, nonmonetary assets are translated using the historical rate at the time of the transaction.", "explhtml": "<p>As a general rule in using the temporal method, nonmonetary assets are translated using the historical rate at the time of the transaction.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.3, LOS 9.e<\/div><div class=\"qtext\"><p>Which of the following general statements is most accurate with respect to the temporal method? Nonmonetary assets are translated at:<\/p><\/div>", "subj": "fsa"}, {"n": 20, "q": "Which of the following statements is most accurate concerning foreign currency translation?", "opts": ["In the case in which a firm uses first in, first out (FIFO) inventory valuation, if the local currency depreciates the cost of good sold under the temporal method is less than the cost of goods sold using the current rate method.", "The receivables turnover ratio is identical under both the temporal method and the current rate method.", "In the case of an appreciating currency, the fixed asset turnover will be lower under the temporal method, as compared to the current rate method."], "ans": "B", "expl": "The receivables turnover (sales / receivables) is unaffected because both methods translate sales at the average rate and accounts receivable at the current rate. When using FIFO and the temporal method we assume that the appropriate rates to use for cost of goods sold (COGS) are the older historical rates. The average rate is used for COGS under the current rate method. If the local currency depreciates, COGS would be higher under the temporal method. With an appreciating currency the fixed asset turnover ratio (sales / fixed assets) will be higher using the temporal method because the temporal method uses the historical rate for fixed assets whereas the current rate method uses the current rate. They both use the same average rate for sales.", "explhtml": "<p>The receivables turnover (sales / receivables) is unaffected because both methods translate sales at the average rate and accounts receivable at the current rate.<\/p><p>When using FIFO and the temporal method we assume that the appropriate rates to use for cost of goods sold (COGS) are the older historical rates. The average rate is used for COGS under the current rate method. If the local currency depreciates, COGS would be higher under the temporal method.<\/p><p>With an appreciating currency the fixed asset turnover ratio (sales / fixed assets) will be higher using the temporal method because the temporal method uses the historical rate for fixed assets whereas the current rate method uses the current rate. They both use the same average rate for sales.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.6, LOS 9.f<\/div><div class=\"qtext\"><p>Which of the following statements is most accurate concerning foreign currency translation?<\/p><\/div>", "subj": "fsa"}, {"n": 21, "q": "Global International Corp. (GIC) has three subsidiaries: GIC Europe whose local currency is the euro and whose functional currency is the euro; GIC China whose local currency is the yuan and whose functional currency is the Hong Kong dollar; and GIC Bahamas whose local currency is the Bahamian dollar and whose functional currency is the U.S. dollar. GIC's reporting currency is the U.S. dollar. Which conversion methods should be used by GIC for each of its subsidiaries?", "opts": ["The financial data for all three subsidiaries should be remeasured under the temporal method. GIC Europe’s data should be translated under the current rate method; GIC China’s", "data should be remeasured under the temporal method into Hong Kong dollars, and then translated under the current rate method into U.S. dollars; and GIC Bahamas’ data should be remeasured under the temporal method into U.S. dollars.", "GIC Europe’s data should be remeasured under the temporal method; GIC China’s data should be remeasured under the temporal method into Hong Kong dollars, and then translated under the current rate method into U.S. dollars; and GIC Bahamas’ data should be translated under the current rate method into U.S. dollars."], "ans": "B", "expl": "The basis for using the current rate method is when Functional Currency is NOT the same as Parent's Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent's Presentation Currency. GIC Europe's data should be translated under the current rate method; GIC China's data should be remeasured under the temporal method into Hong Kong dollars, and then translated under the current rate method into U.S. dollars; and GIC Bahamas' data should be remeasured under the temporal method into U.S. dollars.", "explhtml": "<p>The basis for using the current rate method is when Functional Currency is NOT the same as Parent&#x27;s Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent&#x27;s Presentation Currency.<\/p><p>GIC Europe&#x27;s data should be translated under the current rate method; GIC China&#x27;s data should be remeasured under the temporal method into Hong Kong dollars, and then translated under the current rate method into U.S. dollars; and GIC Bahamas&#x27; data should be remeasured under the temporal method into U.S. dollars.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.4, LOS 9.e<\/div><div class=\"qtext\"><p>Global International Corp. (GIC) has three subsidiaries: GIC Europe whose local currency is the euro and whose functional currency is the euro; GIC China whose local currency is the yuan and whose functional currency is the Hong Kong dollar; and GIC Bahamas whose local currency is the Bahamian dollar and whose functional currency is the U.S. dollar. GIC&#x27;s reporting currency is the U.S. dollar. Which conversion methods should be used by GIC for each of its subsidiaries?<\/p><\/div>", "subj": "fsa"}, {"n": 22, "q": "The Herlitzka Company, a U.S. multinational firm, has a 100% stake in a Swiss subsidiary. The Swiss franc (SF) has been determined to be the functional currency. All the common stock of the subsidiary was issued at the beginning of the year and the subsidiary uses the FIFO inventory cost-flow assumption. In addition, the value of the SF is as follows: Beginning of year $0.5902 Average throughout the year $0.6002 End of year $0.6150 The SF-based balance sheet and income statement data for the Swiss subsidiary are as follows: Accounts receivable = 3,000 Inventory = 4,000 Fixed assets = 12,000 Accounts payable = 2,000 Long-term debt = 5,000 Common stock = 10,000 Retained earnings = 2,000 Net income = 2,000 The translated value of accounts receivable and inventory respectively are:", "opts": ["$1,801 and $2,401.", "$1,845 and $2,401.", "$1,845 and $2,460."], "ans": "C", "expl": "The basis for using the current rate method is when Functional Currency is NOT the same as Parent's Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent's Presentation Currency. Since the SF is the functional currency, then the current rate method is employed to translate the SF amounts into USD. Hence, A/R = 0.615 × 3,000 = $1,845 and 0.615 × 4,000 = $2,460.", "explhtml": "<p>The basis for using the current rate method is when Functional Currency is NOT the same as Parent&#x27;s Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent&#x27;s Presentation Currency.<\/p><p>Since the SF is the functional currency, then the current rate method is employed to translate the SF amounts into USD. Hence, A/R = 0.615 × 3,000 = $1,845 and 0.615 × 4,000 = $2,460.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.6, LOS 9.f<\/div><div class=\"qtext\"><p>The Herlitzka Company, a U.S. multinational firm, has a 100% stake in a Swiss subsidiary. The Swiss franc (SF) has been determined to be the functional currency. All the common stock of the subsidiary was issued at the beginning of the year and the subsidiary uses the FIFO inventory cost-flow assumption. In addition, the value of the SF is as follows:<\/p><div class=\"tbl\"><table><tr><td>Beginning of year<\/td><td>$0.5902<\/td><\/tr><tr><td>Average throughout the year<\/td><td>$0.6002<\/td><\/tr><tr><td>End of year<\/td><td>$0.6150<\/td><\/tr><\/table><\/div><p>The SF-based balance sheet and income statement data for the Swiss subsidiary are as follows:<\/p><div class=\"tbl\"><table><tr><td>Accounts receivable<\/td><td>= 3,000<\/td><\/tr><tr><td>Inventory<\/td><td>= 4,000<\/td><\/tr><tr><td>Fixed assets<\/td><td>= 12,000<\/td><\/tr><tr><td>Accounts payable<\/td><td>= 2,000<\/td><\/tr><tr><td>Long-term debt<\/td><td>= 5,000<\/td><\/tr><tr><td>Common stock<\/td><td>= 10,000<\/td><\/tr><tr><td>Retained earnings<\/td><td>= 2,000<\/td><\/tr><tr><td>Net income<\/td><td>= 2,000<\/td><\/tr><\/table><\/div><p>The translated value of accounts receivable and inventory respectively are:<\/p><\/div>", "subj": "fsa"}, {"n": 23, "q": "Edmonton Oilfield Supply has made an equipment sale in Venezuela in the amount of VEF 15,000,000. On the day of the sale, the exchange rate is 1.7519 VEF per 1 Canadian dollar. 90 days later, when the Venezuelan firm pays for the equipment, the exchange rate is 1.6326. As a result of the change in the exchange rate, Edmonton will recognize a:", "opts": ["gain of $625,666.", "gain of $1,096,104.", "loss of $1,789,500."], "ans": "A", "expl": "On the day of the sale, Edmonton will record an account receivable of 15m/1.7519 = $8,562,133. When the payment is received and converted to CAD, the realized amount will be 15m/1.6326 = $9,187,799. As a result of the appreciating VEF, Edmonton will realize a gain of $9,187,799 − 8,562,133 = CAD 625,666.", "explhtml": "<p>On the day of the sale, Edmonton will record an account receivable of 15m/1.7519 = $8,562,133. When the payment is received and converted to CAD, the realized amount will be 15m/1.6326 = $9,187,799. As a result of the appreciating VEF, Edmonton will realize a gain of $9,187,799 − 8,562,133 = CAD 625,666.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.2, LOS 9.c<\/div><div class=\"qtext\"><p>Edmonton Oilfield Supply has made an equipment sale in Venezuela in the amount of VEF 15,000,000. On the day of the sale, the exchange rate is 1.7519 VEF per 1 Canadian dollar. 90 days later, when the Venezuelan firm pays for the equipment, the exchange rate is 1.6326. As a result of the change in the exchange rate, Edmonton will recognize a:<\/p><\/div>", "subj": "fsa"}, {"n": 24, "q": "Which of the following statements about the methods of currency translation accounting least accurately identifies a plug figure that makes the accounting equation balance?", "opts": ["Under the Monetary/Non-Monetary Method, common stock is the plug.", "Under the Current Rate Method, cumulative translation adjustment is the plug.", "Under the Temporal Method, retained earnings is the plug."], "ans": "A", "expl": "The Monetary/Non-Monetary Method is not addressed in the CFA curriculum. Under the Temporal Method retained earnings is a plug, while under the Current Rate Method the cumulative translation adjustment is a plug.", "explhtml": "<p>The Monetary/Non-Monetary Method is not addressed in the CFA curriculum. Under the Temporal Method retained earnings is a plug, while under the Current Rate Method the cumulative translation adjustment is a plug.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.5, LOS 9.e<\/div><div class=\"qtext\"><p>Which of the following statements about the methods of currency translation accounting least accurately identifies a plug figure that makes the accounting equation balance?<\/p><\/div>", "subj": "fsa"}, {"n": 25, "q": "What is Acer Tool & Die's cost of sales in U.S. dollars using the temporal method?", "opts": ["$2,242.00", "$2,222.00", "$2,240.00"], "ans": "B", "expl": "Purchases = COGS − Beginning inventory + ending inventory = 710 Chad  Chad Conversion US$ Beginning inventory 90 0.3333 $270 Purchases 710 0.3125 2,272 Ending inventory 100 0.3125 320 COGS 700  $2,222", "explhtml": "<p>Purchases = COGS − Beginning inventory + ending inventory = 710 Chad<\/p><div class=\"tbl\"><table><tr><td><\/td><td>Chad<\/td><td>Conversion<\/td><td>US$<\/td><\/tr><tr><td>Beginning inventory<\/td><td>90<\/td><td>0.3333<\/td><td>$270<\/td><\/tr><tr><td>Purchases<\/td><td>710<\/td><td>0.3125<\/td><td>2,272<\/td><\/tr><tr><td>Ending inventory<\/td><td>100<\/td><td>0.3125<\/td><td>320<\/td><\/tr><tr><td>COGS<\/td><td>700<\/td><td><\/td><td>$2,222<\/td><\/tr><\/table><\/div>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 25–26<\/summary><div class=\"vig-body\"><p>The Precision Screen Printers (PSP) Company has a foreign subsidiary, the Acer Tool &amp; Die Company, located in the country of Rolivia. The currency of Rolivia is the Chad. The balance sheet and income statement of Acer Tool &amp; Die Company for the year-ended December 31, 2005, is shown below. The balance sheet has been restated using the U.S. dollar as the functional currency.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v007.webp\" style=\"max-width:min(100%,667px)\" alt=\"Acer Tool &amp; Die Company Balance Sheet As of December 31, 2005 U.S.S Chad Exchange Rate (millions) (millions) (Chad/US$) 0.25 $80 20 Cash 30 0.25 120 Accounts receivable 320 0.3125 Inventory 100 1,500 500 0,3333 Fixed assets (net) $2,020 650 Total assets 50 0.25 $200 Accounts payable\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v008.webp\" style=\"max-width:min(100%,662px)\" alt=\"1,140 380 0.3333 Capital stock 680 220 Retained earnings $2,020 650 Total liabilities and equity Acer Tool &amp; Die Company Income Statement For year ending December 31, 2005 (Amounts in millions of Chad) 1,000 Revenues 700 Cost of sales 50 Depreciation expense 30 Selling expense\"><p>Translation gain (or loss)<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v009.webp\" style=\"max-width:min(100%,407px)\" alt=\"220 Net income\"><p>Acer has determined that the exchange rate exposure at the beginning of 2005 is -260 Chad. The exchange rate at the beginning of 2005 was 0.3333 Chad/US$ and that is the historical rate applicable to beginning inventory of 90 Chad. The exchange rate at the end of 2005 was 0.25 Chad/US$. The average rate for 2005 is 0.3125 Chad/US$. Purchases occurred evenly throughout the year. Acer Tool &amp; Die uses FIFO inventory valuation and depreciates fixed assets using the straight-line method. Assume that retained earnings at year end 2004 were zero, the historical exchange rate for depreciation is 0.333, and no dividends were paid during 2005.<\/p><\/div><\/details><div class=\"pp-topic\">Module 9.6, LOS 9.f<\/div><div class=\"qtext\"><p>What is Acer Tool &amp; Die&#x27;s cost of sales in U.S. dollars using the temporal method?<\/p><\/div>", "subj": "fsa"}, {"n": 26, "q": "What is the remeasurement gain or loss for the period using the temporal method?", "opts": ["$52 loss.", "$32 loss.", "$50 gain."], "ans": "A", "expl": "Remeasured income statement under temporal method: Revenues = 1000/0.3125 = 3200 COGS = 2222 (from previous question) Depreciation = 50/0.3333 = 150 Selling expense = 30/0.3125 = 96 Income before remeasurement gain = 3200 − 2222 − 150 − 96 = 732 Net income = 680 (= retained earnings at year end 2005 − retained earnings at year end 2004) Remeasurement gain/loss = 680 − 732 = -52", "explhtml": "<p>Remeasured income statement under temporal method:<\/p><p>Revenues = 1000/0.3125 = 3200<\/p><p>COGS = 2222 (from previous question)<\/p><p>Depreciation = 50/0.3333 = 150<\/p><p>Selling expense = 30/0.3125 = 96<\/p><p>Income before remeasurement gain = 3200 − 2222 − 150 − 96 = 732<\/p><p>Net income = 680 (= retained earnings at year end 2005 − retained earnings at year end 2004)<\/p><p>Remeasurement gain/loss = 680 − 732 = -52<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 25–26<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>The Precision Screen Printers (PSP) Company has a foreign subsidiary, the Acer Tool &amp; Die Company, located in the country of Rolivia. The currency of Rolivia is the Chad. The balance sheet and income statement of Acer Tool &amp; Die Company for the year-ended December 31, 2005, is shown below. The balance sheet has been restated using the U.S. dollar as the functional currency.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v007.webp\" style=\"max-width:min(100%,667px)\" alt=\"Acer Tool &amp; Die Company Balance Sheet As of December 31, 2005 U.S.S Chad Exchange Rate (millions) (millions) (Chad/US$) 0.25 $80 20 Cash 30 0.25 120 Accounts receivable 320 0.3125 Inventory 100 1,500 500 0,3333 Fixed assets (net) $2,020 650 Total assets 50 0.25 $200 Accounts payable\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v008.webp\" style=\"max-width:min(100%,662px)\" alt=\"1,140 380 0.3333 Capital stock 680 220 Retained earnings $2,020 650 Total liabilities and equity Acer Tool &amp; Die Company Income Statement For year ending December 31, 2005 (Amounts in millions of Chad) 1,000 Revenues 700 Cost of sales 50 Depreciation expense 30 Selling expense\"><p>Translation gain (or loss)<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v009.webp\" style=\"max-width:min(100%,407px)\" alt=\"220 Net income\"><p>Acer has determined that the exchange rate exposure at the beginning of 2005 is -260 Chad. The exchange rate at the beginning of 2005 was 0.3333 Chad/US$ and that is the historical rate applicable to beginning inventory of 90 Chad. The exchange rate at the end of 2005 was 0.25 Chad/US$. The average rate for 2005 is 0.3125 Chad/US$. Purchases occurred evenly throughout the year. Acer Tool &amp; Die uses FIFO inventory valuation and depreciates fixed assets using the straight-line method. Assume that retained earnings at year end 2004 were zero, the historical exchange rate for depreciation is 0.333, and no dividends were paid during 2005.<\/p><\/div><\/details><div class=\"pp-topic\">Module 9.6, LOS 9.f<\/div><div class=\"qtext\"><p>What is the remeasurement gain or loss for the period using the temporal method?<\/p><\/div>", "subj": "fsa"}, {"n": 27, "q": "Which of the following statements describing the choice of the functional currency is least accurate? The functional currency should be the same as the parent's reporting currency if the subsidiary is:", "opts": ["highly integrated with the parent where the local currency, prices, and some costs are controlled or restricted.", "mostly independent from the parent.", "highly integrated with the parent where the local currency, prices, and some costs are not controlled or restricted."], "ans": "B", "expl": "The preferred functional currency for subsidiaries that are mostly independent of the parent is the local currency. For highly integrated subsidiaries (regardless of local conditions), or for subsidiaries operating in high-inflation environments, the parent's reporting currency should be used as the functional currency.", "explhtml": "<p>The preferred functional currency for subsidiaries that are mostly independent of the parent is the local currency. For highly integrated subsidiaries (regardless of local conditions), or for subsidiaries operating in high-inflation environments, the parent&#x27;s reporting currency should be used as the functional currency.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.1, LOS 9.a<\/div><div class=\"qtext\"><p>Which of the following statements describing the choice of the functional currency is least accurate? The functional currency should be the same as the parent&#x27;s reporting currency if the subsidiary is:<\/p><\/div>", "subj": "fsa"}, {"n": 28, "q": "Sycamore Systems sold $5 million worth of software on December 1, 20X1 to a Japanese company with payment denominated in Japanese yen to be received in two months. Sycamore's year end is 31st December. Payment was received on 31 Jan 20X2. Exchange rates (1 USD) 1 Dec 20X1 95 31 Dec 20X1 90 31 Jan 20X2 35 The amount of transaction gain/loss recorded by Sycamore on its income statement for the year ending 31 Dec 20X1 is closest to:", "opts": ["loss of $300,000.", "gain of $580,000.", "gain of $280,000."], "ans": "C", "expl": "Sale amount = $5 million × 95 = 475 million yen. Accounts receivable on sale date = $5 million. Accounts receivable at year-end = 475 million yen/90 = $5.28 million The appreciation of the yen resulted in a gain of $280,000 on the balance sheet date and would be recognized in the income statement.", "explhtml": "<p>Sale amount = $5 million × 95 = 475 million yen. Accounts receivable on sale date = $5 million.<\/p><p>Accounts receivable at year-end = 475 million yen/90 = $5.28 million<\/p><p>The appreciation of the yen resulted in a gain of $280,000 on the balance sheet date and would be recognized in the income statement.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.1, LOS 9.b<\/div><div class=\"qtext\"><p>Sycamore Systems sold $5 million worth of software on December 1, 20X1 to a Japanese company with payment denominated in Japanese yen to be received in two months. Sycamore&#x27;s year end is 31st December. Payment was received on 31 Jan 20X2.<\/p><div class=\"tbl\"><table><tr><td>Exchange rates<\/td><td>(1 USD)<\/td><\/tr><tr><td>1 Dec 20X1<\/td><td>95<\/td><\/tr><tr><td>31 Dec 20X1<\/td><td>90<\/td><\/tr><tr><td>31 Jan 20X2<\/td><td>35<\/td><\/tr><\/table><\/div><p>The amount of transaction gain/loss recorded by Sycamore on its income statement for the year ending 31 Dec 20X1 is closest to:<\/p><\/div>", "subj": "fsa"}, {"n": 29, "q": "The Herlitzka Company, a U.S. multinational firm, has a 100 percent stake in a Swiss subsidiary. The U.S. dollar (USD) has been determined to be the functional currency. All the common stock of the subsidiary was issued at the beginning of the year and the subsidiary uses the weighted-average inventory cost-flow assumption. In addition, the value of the SF is as follows: Beginning of year $0.5902 Average throughout the year $0.6002 End of year $0.6150 The SF-based balance sheet and income statement data for the Swiss subsidiary are as follows: Accounts receivable = 3,000 Inventory = 4,000 Fixed assets = 12,000 Accounts payable = 2,000 Long-term debt = 5,000 Common stock = 10,000 Retained earnings = 2,000 Net income = 2,000 The remeasured value of accounts receivable and inventory respectively are closest to:", "opts": ["$1,771 and $2,361.", "$1,845 and $2,401.", "$1,845 and $2,361."], "ans": "B", "expl": "The basis for using the current rate method is when Functional Currency is NOT the same as Parent's Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent's Presentation Currency. Since the USD is the functional currency, use the temporal method. Under the temporal method, inventory is remeasured using the historical rate. However, our best guess of the historical rate under the weighted average inventory cost-flow assumption is the average rate through the period. Hence, A/R = $0.615 × 3,000 = $1,845 and Inventory = $0.6002 × 4,000 = $2,401.", "explhtml": "<p>The basis for using the current rate method is when Functional Currency is NOT the same as Parent&#x27;s Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent&#x27;s Presentation Currency.<\/p><p>Since the USD is the functional currency, use the temporal method. Under the temporal method, inventory is remeasured using the historical rate. However, our best guess of the historical rate under the weighted average inventory cost-flow assumption is the average rate through the period. Hence, A/R = $0.615 × 3,000 = $1,845 and Inventory = $0.6002 × 4,000 = $2,401.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.6, LOS 9.f<\/div><div class=\"qtext\"><p>The Herlitzka Company, a U.S. multinational firm, has a 100 percent stake in a Swiss subsidiary. The U.S. dollar (USD) has been determined to be the functional currency. All the common stock of the subsidiary was issued at the beginning of the year and the subsidiary uses the weighted-average inventory cost-flow assumption. In addition, the value of the SF is as follows:<\/p><div class=\"tbl\"><table><tr><td>Beginning of year<\/td><td>$0.5902<\/td><\/tr><tr><td>Average throughout the year<\/td><td>$0.6002<\/td><\/tr><tr><td>End of year<\/td><td>$0.6150<\/td><\/tr><\/table><\/div><p>The SF-based balance sheet and income statement data for the Swiss subsidiary are as follows:<\/p><div class=\"tbl\"><table><tr><td>Accounts receivable<\/td><td>= 3,000<\/td><\/tr><tr><td>Inventory<\/td><td>= 4,000<\/td><\/tr><tr><td>Fixed assets<\/td><td>= 12,000<\/td><\/tr><tr><td>Accounts payable<\/td><td>= 2,000<\/td><\/tr><tr><td>Long-term debt<\/td><td>= 5,000<\/td><\/tr><tr><td>Common stock<\/td><td>= 10,000<\/td><\/tr><tr><td>Retained earnings<\/td><td>= 2,000<\/td><\/tr><tr><td>Net income<\/td><td>= 2,000<\/td><\/tr><\/table><\/div><p>The remeasured value of accounts receivable and inventory respectively are closest to:<\/p><\/div>", "subj": "fsa"}, {"n": 30, "q": "Which of the following currency translation methods is most appropriate in a hyperinflationary economy under US GAAP? The:", "opts": ["current/non-current method since current assets and liabilities are translated at the current exchange rate.", "current rate method since the translation gain or loss is shown on the income statement.", "temporal method because all non-monetary accounts are translated at the historical rate."], "ans": "C", "expl": "The temporal rate method is most appropriate because the value of non-monetary assets and liabilities is translated at the historical rate. Under IFRS, the firm restates the financials using an inflation index, and then translates using the current rate method.", "explhtml": "<p>The temporal rate method is most appropriate because the value of non-monetary assets and liabilities is translated at the historical rate. Under IFRS, the firm restates the financials using an inflation index, and then translates using the current rate method.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.3, LOS 9.e<\/div><div class=\"qtext\"><p>Which of the following currency translation methods is most appropriate in a hyperinflationary economy under US GAAP? The:<\/p><\/div>", "subj": "fsa"}, {"n": 31, "q": "Under U.S. GAAP, the temporal method is preferred to the current rate method in hyperinflationary economies because the temporal method:", "opts": ["is easier to perform under hyperinflation.", "provides better conversions of subsidiary revenues.", "results in non-monetary asset values that are a better proxy for the economic values of those assets."], "ans": "C", "expl": "The temporal method results in non-monetary asset values that are a better proxy for the economic values of those assets than those obtained under the current rate method. Both methods convert revenues and SG&A at the average rate so there could be no clear preference when considering these measures.", "explhtml": "<p>The temporal method results in non-monetary asset values that are a better proxy for the economic values of those assets than those obtained under the current rate method. Both methods convert revenues and SG&amp;A at the average rate so there could be no clear preference when considering these measures.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.7, LOS 9.g<\/div><div class=\"qtext\"><p>Under U.S. GAAP, the temporal method is preferred to the current rate method in hyperinflationary economies because the temporal method:<\/p><\/div>", "subj": "fsa"}, {"n": 32, "q": "At what exchange rate are revenues and accounts receivable translated under the current rate method? Accounts Revenues receivable", "opts": ["Average rate Current rate", "Average rate Historical rate", "Current rate Current rate"], "ans": "A", "expl": "Under the current rate method, revenues are translated at the average rate; accounts receivable are translated at the current rate.", "explhtml": "<p>Under the current rate method, revenues are translated at the average rate; accounts receivable are translated at the current rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.4, LOS 9.e<\/div><div class=\"qtext\"><p>At what exchange rate are revenues and accounts receivable translated under the current rate method?<\/p><p>Accounts<\/p><p>Revenues<\/p><p>receivable<\/p><\/div>", "subj": "fsa"}, {"n": 33, "q": "Where does the currency translation gain or loss appear in the financial statements under the temporal method and the current rate method? Temporal  Current rate | method  method", "opts": ["Income Balance sheet statement", "Balance sheet Income statement", "Balance sheet Balance sheet"], "ans": "A", "expl": "Currency translation gain or loss appears on the income statement under the temporal method and the balance sheet under the current rate method.", "explhtml": "<p>Currency translation gain or loss appears on the income statement under the temporal method and the balance sheet under the current rate method.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.6, LOS 9.f<\/div><div class=\"qtext\"><p>Where does the currency translation gain or loss appear in the financial statements under the temporal method and the current rate method?<\/p><div class=\"tbl\"><table><tr><td>Temporal<\/td><td>Current rate<\/td><\/tr><tr><td>method<\/td><td>method<\/td><\/tr><\/table><\/div><\/div>", "subj": "fsa"}, {"n": 34, "q": "Regarding the different methods of consolidating foreign subsidiaries' operating results, it would be most accurate to state that:", "opts": ["under the temporal method, monetary assets and monetary liabilities are translated at a historical exchange rate.", "under the current rate method, revenues and expenses are translated at the exchange rate that existed when the underlying transaction occurred.", "under the current rate method, individual components of stockholder’s equity are translated at the current exchange rates."], "ans": "B", "expl": "Under the current rate method, revenues and expenses are translated at the exchange rate that existed when the underlying transaction occurred. (Though, for practical reasons, an average exchange rate is often used to translate income items.) Under the temporal method, monetary assets and monetary liabilities are translated at the current exchange rate. Under the current rate method, while shareholder's equity (as a whole, including CTA) is translated at the current rate, common stock is translated at historical exchange rate.", "explhtml": "<p>Under the current rate method, revenues and expenses are translated at the exchange rate that existed when the underlying transaction occurred. (Though, for practical reasons, an average exchange rate is often used to translate income items.) Under the temporal method, monetary assets and monetary liabilities are translated at the current exchange rate. Under the current rate method, while shareholder&#x27;s equity (as a whole, including CTA) is translated at the current rate, common stock is translated at historical exchange rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.5, LOS 9.e<\/div><div class=\"qtext\"><p>Regarding the different methods of consolidating foreign subsidiaries&#x27; operating results, it would be most accurate to state that:<\/p><\/div>", "subj": "fsa"}, {"n": 35, "q": "Regarding the statements made at the meeting:", "opts": ["Hirauye’s statement is incorrect; Wilkins’ statement is correct.", "Hirauye’s statement is incorrect; Wilkins’ statement is incorrect.", "Hirauye’s statement is correct; Wilkins’ statement is correct."], "ans": "B", "expl": "The basis for using the current rate method is when Functional Currency is NOT the same as Parent's Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent's Presentation Currency. Hirauye and Wilkins both make incorrect statements regarding local and functional currencies. A foreign subsidiary may have a local currency but designate another currency as its functional currency. The functional currency is defined as the currency of the primary environment in which the subsidiary generates and expends cash, but the choice of the functional currency is ultimately a function of management's judgment. Wilkins is also incorrect because the rate of inflation does not necessarily have an impact on designated currencies.", "explhtml": "<p>The basis for using the current rate method is when Functional Currency is NOT the same as Parent&#x27;s Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent&#x27;s Presentation Currency.<\/p><p>Hirauye and Wilkins both make incorrect statements regarding local and functional currencies. A foreign subsidiary may have a local currency but designate another currency as its functional currency. The functional currency is defined as the currency of the primary environment in which the subsidiary generates and expends cash, but the choice of the functional currency is ultimately a function of management&#x27;s judgment. Wilkins is also incorrect because the rate of inflation does not necessarily have an impact on designated currencies.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 35–38<\/summary><div class=\"vig-body\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v010.webp\" style=\"max-width:min(100%,626px)\" alt=\"Deborah Ortiz, CFA® , is the director of Global Research for F.E. Horton &amp; Co. Ortiz recently\"><p>hired two junior analysts, Tina Hirauye and Dominique Wilkins to assist in the financial statement analysis of global conglomerates. Hirauye and Wilkins are both Level Il candidates in the CFA® Program, so Ortiz thought they would be the ideal people to work on a project dealing with consolidating the results of foreign operating units in the financial statements of the global parent.<\/p><p>Before starting on the project, Ortiz has a meeting with Hirauye and Wilkins to discuss the use of different currencies in a company's operations. At the meeting, Hirauye states that when analyzing multinational firms, there cannot be a difference between local and functional currencies. Wilkins disagrees with her and states that there can be a difference between local and functional currencies, but only if the parent of the subsidiary operates in a hyperinflationary environment. After another 30 minutes of discussion, Ortiz concludes the meeting by telling them to make sure they understand the different accounting rules for remeasurement and translation, under SFAS 52.<\/p><p>Hirauye and Wilkins are given projects involving two different firms:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v011.webp\" style=\"max-width:min(100%,627px)\" alt=\"• Molsan Industries is a Canadian multinational firm with a subsidiary in Japan. The subsidiary has operations in both Japan and Singapore. • Neslarone is based in Switzerland and generates the majority of its cash in Swiss Francs (CHF). The firm issues and prepares its consolidated financial statements in U.S. dollars.\"><p>Hirauye and Wilkins spend the morning reviewing the details of their assignment and decide to take a break for lunch at a restaurant across the street from F.E. Horton &amp; Co.l's headquarters. They agree that they have a challenging task and both are nervous about turning in their consolidated financial statements to Ortiz on the following day.<\/p><\/div><\/details><div class=\"pp-topic\">Module 9.1, LOS 9.a<\/div><div class=\"qtext\"><p>Regarding the statements made at the meeting:<\/p><\/div>", "subj": "fsa"}, {"n": 36, "q": "Hirauye is working on consolidating the financial statements of Molsan Industries' Japanese subsidiary. Under SFAS 52, regarding Foreign Currency Translation, if:", "opts": ["more than half of the subsidiary's revenue is from Japanese sources, then the results of the Singapore operation are translated into Japanese yen and then translated into Canadian dollars.", "management determines that the subsidiary's functional currency is the Japanese yen, the results of the Singapore operation are first remeasured into Japanese yen and then translated into Canadian dollars.", "management determines that the subsidiary's functional currency is the Singapore dollar, then the results of the Singapore operation are remeasured into Canadian dollars."], "ans": "B", "expl": "The functional currency is determined by management. Financial data are remeasured into the functional currency chosen by management and then translated into the reporting currency.", "explhtml": "<p>The functional currency is determined by management. Financial data are remeasured into the functional currency chosen by management and then translated into the reporting currency.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 35–38<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v010.webp\" style=\"max-width:min(100%,626px)\" alt=\"Deborah Ortiz, CFA® , is the director of Global Research for F.E. Horton &amp; Co. Ortiz recently\"><p>hired two junior analysts, Tina Hirauye and Dominique Wilkins to assist in the financial statement analysis of global conglomerates. Hirauye and Wilkins are both Level Il candidates in the CFA® Program, so Ortiz thought they would be the ideal people to work on a project dealing with consolidating the results of foreign operating units in the financial statements of the global parent.<\/p><p>Before starting on the project, Ortiz has a meeting with Hirauye and Wilkins to discuss the use of different currencies in a company's operations. At the meeting, Hirauye states that when analyzing multinational firms, there cannot be a difference between local and functional currencies. Wilkins disagrees with her and states that there can be a difference between local and functional currencies, but only if the parent of the subsidiary operates in a hyperinflationary environment. After another 30 minutes of discussion, Ortiz concludes the meeting by telling them to make sure they understand the different accounting rules for remeasurement and translation, under SFAS 52.<\/p><p>Hirauye and Wilkins are given projects involving two different firms:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v011.webp\" style=\"max-width:min(100%,627px)\" alt=\"• Molsan Industries is a Canadian multinational firm with a subsidiary in Japan. The subsidiary has operations in both Japan and Singapore. • Neslarone is based in Switzerland and generates the majority of its cash in Swiss Francs (CHF). The firm issues and prepares its consolidated financial statements in U.S. dollars.\"><p>Hirauye and Wilkins spend the morning reviewing the details of their assignment and decide to take a break for lunch at a restaurant across the street from F.E. Horton &amp; Co.l's headquarters. They agree that they have a challenging task and both are nervous about turning in their consolidated financial statements to Ortiz on the following day.<\/p><\/div><\/details><div class=\"pp-topic\">Module 9.1, LOS 9.a<\/div><div class=\"qtext\"><p>Hirauye is working on consolidating the financial statements of Molsan Industries&#x27; Japanese subsidiary. Under SFAS 52, regarding Foreign Currency Translation, if:<\/p><\/div>", "subj": "fsa"}, {"n": 37, "q": "Ortiz had told the junior analysts to make sure they understand the different accounting rules under SFAS 52. When referring to foreign exchange rates, the difference between remeasurement and translation is that remeasurement:", "opts": ["refers to the conversion of local currency into the functional currency; translation is the conversion of the functional currency into the reporting currency.", "and translation refer to the same process of translating the functional currency into the reporting currency.", "is used to describe historical exchange rates while translation is used for current rates."], "ans": "A", "expl": "Translation is between functional and reporting currency. Remeasurement occurs between local and functional currencies.", "explhtml": "<p>Translation is between functional and reporting currency. Remeasurement occurs between local and functional currencies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 35–38<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v010.webp\" style=\"max-width:min(100%,626px)\" alt=\"Deborah Ortiz, CFA® , is the director of Global Research for F.E. Horton &amp; Co. Ortiz recently\"><p>hired two junior analysts, Tina Hirauye and Dominique Wilkins to assist in the financial statement analysis of global conglomerates. Hirauye and Wilkins are both Level Il candidates in the CFA® Program, so Ortiz thought they would be the ideal people to work on a project dealing with consolidating the results of foreign operating units in the financial statements of the global parent.<\/p><p>Before starting on the project, Ortiz has a meeting with Hirauye and Wilkins to discuss the use of different currencies in a company's operations. At the meeting, Hirauye states that when analyzing multinational firms, there cannot be a difference between local and functional currencies. Wilkins disagrees with her and states that there can be a difference between local and functional currencies, but only if the parent of the subsidiary operates in a hyperinflationary environment. After another 30 minutes of discussion, Ortiz concludes the meeting by telling them to make sure they understand the different accounting rules for remeasurement and translation, under SFAS 52.<\/p><p>Hirauye and Wilkins are given projects involving two different firms:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v011.webp\" style=\"max-width:min(100%,627px)\" alt=\"• Molsan Industries is a Canadian multinational firm with a subsidiary in Japan. The subsidiary has operations in both Japan and Singapore. • Neslarone is based in Switzerland and generates the majority of its cash in Swiss Francs (CHF). The firm issues and prepares its consolidated financial statements in U.S. dollars.\"><p>Hirauye and Wilkins spend the morning reviewing the details of their assignment and decide to take a break for lunch at a restaurant across the street from F.E. Horton &amp; Co.l's headquarters. They agree that they have a challenging task and both are nervous about turning in their consolidated financial statements to Ortiz on the following day.<\/p><\/div><\/details><div class=\"pp-topic\">Module 9.1, LOS 9.a<\/div><div class=\"qtext\"><p>Ortiz had told the junior analysts to make sure they understand the different accounting rules under SFAS 52. When referring to foreign exchange rates, the difference between remeasurement and translation is that remeasurement:<\/p><\/div>", "subj": "fsa"}, {"n": 38, "q": "Wilkins and Hirauye are working on constructing the consolidated statements for Neslarone. They know that after they convert from Swiss Francs (CHF) to U.S. dollars (USD), they will be left with a foreign currency adjustment that needs to be included on the financial statements. To convert from CHF to USD, the analysts should use the:", "opts": ["current rate method and they should record the foreign currency adjustment on the balance sheet.", "current rate method and they should record the foreign currency adjustment on the income statement.", "temporal method and they should record the foreign currency adjustment on the income statement."], "ans": "A", "expl": "Neslarone is based in Switzerland and generates the majority of its cash in CHF, meaning the local and functional currencies are both CHF. The firm issues financial reports in USD, so the dollar is the reporting currency. The process of converting from the functional currency to the reporting currency is translation and the correct method to use is the current rate method. When using the current rate method, the foreign currency adjustment is recorded in the equity section of the balance sheet.", "explhtml": "<p>Neslarone is based in Switzerland and generates the majority of its cash in CHF, meaning the local and functional currencies are both CHF. The firm issues financial reports in USD, so the dollar is the reporting currency. The process of converting from the functional currency to the reporting currency is translation and the correct method to use is the current rate method. When using the current rate method, the foreign currency adjustment is recorded in the equity section of the balance sheet.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 35–38<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v010.webp\" style=\"max-width:min(100%,626px)\" alt=\"Deborah Ortiz, CFA® , is the director of Global Research for F.E. Horton &amp; Co. Ortiz recently\"><p>hired two junior analysts, Tina Hirauye and Dominique Wilkins to assist in the financial statement analysis of global conglomerates. Hirauye and Wilkins are both Level Il candidates in the CFA® Program, so Ortiz thought they would be the ideal people to work on a project dealing with consolidating the results of foreign operating units in the financial statements of the global parent.<\/p><p>Before starting on the project, Ortiz has a meeting with Hirauye and Wilkins to discuss the use of different currencies in a company's operations. At the meeting, Hirauye states that when analyzing multinational firms, there cannot be a difference between local and functional currencies. Wilkins disagrees with her and states that there can be a difference between local and functional currencies, but only if the parent of the subsidiary operates in a hyperinflationary environment. After another 30 minutes of discussion, Ortiz concludes the meeting by telling them to make sure they understand the different accounting rules for remeasurement and translation, under SFAS 52.<\/p><p>Hirauye and Wilkins are given projects involving two different firms:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v011.webp\" style=\"max-width:min(100%,627px)\" alt=\"• Molsan Industries is a Canadian multinational firm with a subsidiary in Japan. The subsidiary has operations in both Japan and Singapore. • Neslarone is based in Switzerland and generates the majority of its cash in Swiss Francs (CHF). The firm issues and prepares its consolidated financial statements in U.S. dollars.\"><p>Hirauye and Wilkins spend the morning reviewing the details of their assignment and decide to take a break for lunch at a restaurant across the street from F.E. Horton &amp; Co.l's headquarters. They agree that they have a challenging task and both are nervous about turning in their consolidated financial statements to Ortiz on the following day.<\/p><\/div><\/details><div class=\"pp-topic\">Module 9.1, LOS 9.a<\/div><div class=\"qtext\"><p>Wilkins and Hirauye are working on constructing the consolidated statements for Neslarone. They know that after they convert from Swiss Francs (CHF) to U.S. dollars (USD), they will be left with a foreign currency adjustment that needs to be included on the financial statements. To convert from CHF to USD, the analysts should use the:<\/p><\/div>", "subj": "fsa"}, {"n": 39, "q": "Gortal Inc., a U.S. company has a wholly owned subsidiary, Fortina GmBh, based in Germany. The U.S. dollar has been appreciating relative to the Euro over the past year. The use of the temporal method to translate a foreign subsidiary's financial statements to U.S. dollars will most likely have which of the following effects on the fixed-asset turnover ratio (S/FA) relative to what the ratio would have been without the effects of translation assuming no new fixed assets were purchased throughout the year?", "opts": ["There will be no effect on the ratio.", "The ratio will be higher.", "The ratio will be lower."], "ans": "C", "expl": "Since the dollar has appreciated, the local currency has depreciated, so each foreign currency unit bought more dollars in the past relative to the present. Fixed assets are remeasured at the historical rate and sales are remeasured at the average rate under the temporal method. Since the historical rate is buying more dollars relative to the average rate, the denominator is staying the same whereas the numerator is getting smaller. Thus, the ratio is lower.", "explhtml": "<p>Since the dollar has appreciated, the local currency has depreciated, so each foreign currency unit bought more dollars in the past relative to the present. Fixed assets are remeasured at the historical rate and sales are remeasured at the average rate under the temporal method. Since the historical rate is buying more dollars relative to the average rate, the denominator is staying the same whereas the numerator is getting smaller. Thus, the ratio is lower.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.6, LOS 9.f<\/div><div class=\"qtext\"><p>Gortal Inc., a U.S. company has a wholly owned subsidiary, Fortina GmBh, based in Germany. The U.S. dollar has been appreciating relative to the Euro over the past year. The use of the temporal method to translate a foreign subsidiary&#x27;s financial statements to U.S. dollars will most likely have which of the following effects on the fixed-asset turnover ratio (S/FA) relative to what the ratio would have been without the effects of translation assuming no new fixed assets were purchased throughout the year?<\/p><\/div>", "subj": "fsa"}, {"n": 40, "q": "Organic growth in sales is most accurately defined as growth in sales excluding the effects of:", "opts": ["acquisitions/divestitures only.", "acquisitions/divestitures and currency value fluctuations.", "currency value fluctuations."], "ans": "B", "expl": "Organic growth in sales is defined as growth in sales excluding the effects of acquisitions/ divestitures and currency effects.", "explhtml": "<p>Organic growth in sales is defined as growth in sales excluding the effects of acquisitions/ divestitures and currency effects.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.8, LOS 9.i<\/div><div class=\"qtext\"><p>Organic growth in sales is most accurately defined as growth in sales excluding the effects of:<\/p><\/div>", "subj": "fsa"}, {"n": 41, "q": "Which of the following general statements is CORRECT with respect to the temporal method? Revenues and operating expenses (excluding COGS) are translated at the:", "opts": ["average rate.", "historical rate.", "current rate."], "ans": "A", "expl": "As a general rule for the temporal method, all revenues and operating expenses (excluding COGS) are translated using the average rate.", "explhtml": "<p>As a general rule for the temporal method, all revenues and operating expenses (excluding COGS) are translated using the average rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.3, LOS 9.e<\/div><div class=\"qtext\"><p>Which of the following general statements is CORRECT with respect to the temporal method? Revenues and operating expenses (excluding COGS) are translated at the:<\/p><\/div>", "subj": "fsa"}, {"n": 42, "q": "Which of the following ratios is unaffected by the choice between the current rate method and the temporal method?", "opts": ["Inventory turnover.", "Current ratio.", "Quick ratio."], "ans": "C", "expl": "All of the components of the quick ratio (cash and cash equivalents, accounts receivable, and accounts payable) are converted at the same rate under both methods so the ratio is unaffected by the method. The current ratio is the same as the quick ratio except it also contains inventory which is translated at the historical rate with the temporal method and at the current rate with the current rate method. Inventory turnover ratio and current ratio both would be similarly affected as they rely on the value of inventory.", "explhtml": "<p>All of the components of the quick ratio (cash and cash equivalents, accounts receivable, and accounts payable) are converted at the same rate under both methods so the ratio is unaffected by the method. The current ratio is the same as the quick ratio except it also contains inventory which is translated at the historical rate with the temporal method and at the current rate with the current rate method. Inventory turnover ratio and current ratio both would be similarly affected as they rely on the value of inventory.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.6, LOS 9.f<\/div><div class=\"qtext\"><p>Which of the following ratios is unaffected by the choice between the current rate method and the temporal method?<\/p><\/div>", "subj": "fsa"}, {"n": 43, "q": "Each of the following items is considered a monetary asset or liability account under the temporal method for foreign currency translation EXCEPT:", "opts": ["accounts payable.", "long-term debt.", "inventory."], "ans": "C", "expl": "The monetary asset and liability accounts under the temporal method are cash, accounts receivable, accounts payable, and long-term debt.", "explhtml": "<p>The monetary asset and liability accounts under the temporal method are cash, accounts receivable, accounts payable, and long-term debt.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.3, LOS 9.e<\/div><div class=\"qtext\"><p>Each of the following items is considered a monetary asset or liability account under the temporal method for foreign currency translation EXCEPT:<\/p><\/div>", "subj": "fsa"}, {"n": 44, "q": "Giant Company should use the following method to reflect the results of Grande, Inc., in its financial statements:", "opts": ["the temporal method followed by the current rate method.", "the current rate method.", "the temporal method."], "ans": "C", "expl": "The basis for using the current rate method is when Functional Currency is NOT the same as Parent's Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent's Presentation Currency. The temporal method is used when the functional currency is the parent's currency.", "explhtml": "<p>The basis for using the current rate method is when Functional Currency is NOT the same as Parent&#x27;s Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent&#x27;s Presentation Currency.<\/p><p>The temporal method is used when the functional currency is the parent&#x27;s currency.
