 Grande, Inc., that operates in Mexico and is responsible for designing and manufacturing connection fittings that are vital for the proper operation of its parent company's reactors.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v012.webp\" style=\"max-width:min(100%,666px)\" alt=\"• Giant Company considers the U.S. dollar to be the functional currency of Grande, Inc. • Grande, Inc., began operations January 1, 2001. • Common Stock and Fixed Assets were acquired January 1, 2000. • Inventory is accounted for under the last in, first out (LIFO) cost flow assumption, and was purchased evenly through the year. • The inventory in the January 1, 2001, Balance Sheet was acquired on January 1, 2001. $0.14/M peso Exchange Rates were: January 1, 2000 $0.12/M peso January 1, 2001 June 30, 2001 $0.11/M peso (this is the 2001 average rate)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v013.webp\" style=\"max-width:min(100%,666px)\" alt=\"$0.10/M peso December 31, 2001 Grande, Inc. Balance Sheet (in M Pesos) Dec. 31, 2001 Jan. 1, 2001 20,000,000 5,000,000 Cash 35,000,000 20,000,000 Accounts Receivable 15,000,000 15,000,000 Inventory 60,000,000 70,000,000 Fixed Assets (net) 10,000,000 10,000,000 Accounts Payable 40,000,000 35,000,000 Long Term Debt 80,000,000 80,000,000 Common Stock 5,000,000 Retained Earnings 2001 Income Statement (in M Pesos) Sales 60,000,000 (45,000,000) Cost of Goods Sold (10,000,000) Depreciation 5,000,000 Net Income\"><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.e<\/div><div class=\"qtext\"><p>Revenues for 2001 translated into U.S. dollars amount to:<\/p><\/div>", "subj": "fsa"}, {"n": 48, "q": "(Assume U.S. GAAP for this question.) For a subsidiary in a hyperinflationary economy, the functional currency should be the:", "opts": ["Local currency.", "Parent's currency.", "Subsidiary's operating currency."], "ans": "B", "expl": "The functional currency should be the parent's currency. Under IFRS, the firm would restate the financials for inflation, and then translate under the current rate method.", "explhtml": "<p>The functional currency should be the parent&#x27;s currency. Under IFRS, the firm would restate the financials for inflation, and then translate under the current rate method.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.7, LOS 9.g<\/div><div class=\"qtext\"><p>(Assume U.S. GAAP for this question.) For a subsidiary in a hyperinflationary economy, the functional currency should be the:<\/p><\/div>", "subj": "fsa"}, {"n": 49, "q": "Which of the following asset or liability values is likely to be the most understated in a hyperinflationary economy if translation occurs under the current rate method?", "opts": ["A plant purchased several years ago.", "Dividends payable.", "Accounts receivable."], "ans": "A", "expl": "The accounts receivable and dividends payable will each have book values that are closer to their market values than a plant purchased many years ago.", "explhtml": "<p>The accounts receivable and dividends payable will each have book values that are closer to their market values than a plant purchased many years ago.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.7, LOS 9.g<\/div><div class=\"qtext\"><p>Which of the following asset or liability values is likely to be the most understated in a hyperinflationary economy if translation occurs under the current rate method?<\/p><\/div>", "subj": "fsa"}, {"n": 50, "q": "A company is exposed to foreign exchange risk due the impact of changes in currency values on a:", "opts": ["company’s assets only.", "company’s assets, liabilities, and future sales.", "company’s assets and liabilities only."], "ans": "B", "expl": "Foreign exchange risks include the impact of changes in currency values on assets and liabilities of a business, as well as on future sales.", "explhtml": "<p>Foreign exchange risks include the impact of changes in currency values on assets and liabilities of a business, as well as on future sales.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.8, LOS 9.j<\/div><div class=\"qtext\"><p>A company is exposed to foreign exchange risk due the impact of changes in currency values on a:<\/p><\/div>", "subj": "fsa"}, {"n": 51, "q": "The first step in Jameson's analysis is to compute Kasamatsu's impact on WB's net income. What is Kasamatsu's impact on WB's net income (in thousands dollars)?", "opts": ["$821.", "$793.", "$850."], "ans": "C", "expl": "The basis for using the current rate method is when Functional Currency is NOT the same as Parent's Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent's Presentation Currency. Because Kasamatsu is a wholly owned subsidiary of WB, all of its net income will be included in WB's. Kasamatsu's local currency is also the functional currency, so the current rate method should be used to translate the financial statements into U.S. dollars. The appropriate exchange rate to use would be the average exchange rate for 2002, and no adjustment needs to be made for the dividend. The calculation is: 119,000 / 140 = 850 Therefore, WB will report an additional $850,000 of net income as a result of their subsidiary's operating results. Both remaining answers use incorrect exchange rates.", "explhtml": "<p>The basis for using the current rate method is when Functional Currency is NOT the same as Parent&#x27;s Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent&#x27;s Presentation Currency.<\/p><p>Because Kasamatsu is a wholly owned subsidiary of WB, all of its net income will be included in WB&#x27;s. Kasamatsu&#x27;s local currency is also the functional currency, so the current rate method should be used to translate the financial statements into U.S. dollars. The appropriate exchange rate to use would be the average exchange rate for 2002, and no adjustment needs to be made for the dividend. The calculation is:<\/p><p>119,000 / 140 = 850<\/p><p>Therefore, WB will report an additional $850,000 of net income as a result of their subsidiary&#x27;s operating results. Both remaining answers use incorrect exchange rates.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 51–54<\/summary><div class=\"vig-body\"><p>Walter Jameson, CFA®, is an analyst for Continental Corp., a global investment bank. Jameson has been assigned coverage of Wasson Brothers (WB), a large U.S. based conglomerate with many subsidiaries in both the U.S. and abroad. Jameson has completed his review of the firm's U.S. operations, but his research report is due at the end of the week and he has yet to assess the impact of Wasson's foreign subsidiaries on his earnings model.<\/p><p>One of WB's wholly-owned foreign subsidiaries, Kasamatsu Industries, is based in Japan and manufactures a hugely successful line of trading cards, toys, and other related products. All of Kasamatsu's operations and sales take place in Japan, and the corresponding transactions are denominated in Japanese yen. Additionally, Kasamatsu's books and records are all maintained in yen. WB reports its earnings in U.S. dollars. The history of the exchange rate between the dollar and the yen over the last two years is presented in the following table. Figures are presented in yen/$.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v014.webp\" style=\"max-width:min(100%,667px)\" alt=\"Yen/Dollar Exchange Rate 150 December 31, 2002 130 December 31, 2001 140 2002 Average 120 2001 Average Exchange rate on date that 2002 145 dividends were declared (payable to Wasson Brothers) Exchange rate on date of stock 100 issue and acquisition of fixed assets Kasamatsu Industries Financial Data (12/31/02) U.S. Dollars Yen Exchange Rate (in thousands) (in thousands) 700,000 Sales COGS 280,000 126,000 Depreciation 77,000 SG &amp; A 98,000 Income Tax Expense 119,000 Net Income\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v015.webp\" style=\"max-width:min(100%,667px)\" alt=\"2001 Retained Earnings 0 58,000 Dividends 61,000 2002 Retained Earnings 50,000 Current Assets Fixed Assets 486,000 Current Liabilities 46,000 Long Term Debt 254,000 175,000 Capital Stock Accumulated Translation Adjustment\"><\/div><\/details><div class=\"pp-topic\">Module 9.6, LOS 9.f<\/div><div class=\"qtext\"><p>The first step in Jameson&#x27;s analysis is to compute Kasamatsu&#x27;s impact on WB&#x27;s net income. What is Kasamatsu&#x27;s impact on WB&#x27;s net income (in thousands dollars)?<\/p><\/div>", "subj": "fsa"}, {"n": 52, "q": "Jameson now computes the adjustment to WB's financial data due to Kasamatsu's payment of dividends. What is the U.S. dollar amount of this adjustment (in thousands)?", "opts": ["$446.", "$400.", "$414."], "ans": "B", "expl": "WB receives a cash dividend from their subsidiary. This dividend must be translated at the prevailing exchange rate on the date the dividend is declared (145/$). $58,000 / 145 = 400. Both remaining answers use incorrect exchange rates.", "explhtml": "<p>WB receives a cash dividend from their subsidiary. This dividend must be translated at the prevailing exchange rate on the date the dividend is declared (145/$). $58,000 / 145 = 400. Both remaining answers use incorrect exchange rates.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 51–54<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Walter Jameson, CFA®, is an analyst for Continental Corp., a global investment bank. Jameson has been assigned coverage of Wasson Brothers (WB), a large U.S. based conglomerate with many subsidiaries in both the U.S. and abroad. Jameson has completed his review of the firm's U.S. operations, but his research report is due at the end of the week and he has yet to assess the impact of Wasson's foreign subsidiaries on his earnings model.<\/p><p>One of WB's wholly-owned foreign subsidiaries, Kasamatsu Industries, is based in Japan and manufactures a hugely successful line of trading cards, toys, and other related products. All of Kasamatsu's operations and sales take place in Japan, and the corresponding transactions are denominated in Japanese yen. Additionally, Kasamatsu's books and records are all maintained in yen. WB reports its earnings in U.S. dollars. The history of the exchange rate between the dollar and the yen over the last two years is presented in the following table. Figures are presented in yen/$.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v014.webp\" style=\"max-width:min(100%,667px)\" alt=\"Yen/Dollar Exchange Rate 150 December 31, 2002 130 December 31, 2001 140 2002 Average 120 2001 Average Exchange rate on date that 2002 145 dividends were declared (payable to Wasson Brothers) Exchange rate on date of stock 100 issue and acquisition of fixed assets Kasamatsu Industries Financial Data (12/31/02) U.S. Dollars Yen Exchange Rate (in thousands) (in thousands) 700,000 Sales COGS 280,000 126,000 Depreciation 77,000 SG &amp; A 98,000 Income Tax Expense 119,000 Net Income\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v015.webp\" style=\"max-width:min(100%,667px)\" alt=\"2001 Retained Earnings 0 58,000 Dividends 61,000 2002 Retained Earnings 50,000 Current Assets Fixed Assets 486,000 Current Liabilities 46,000 Long Term Debt 254,000 175,000 Capital Stock Accumulated Translation Adjustment\"><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.e<\/div><div class=\"qtext\"><p>Jameson now computes the adjustment to WB&#x27;s financial data due to Kasamatsu&#x27;s payment of dividends. What is the U.S. dollar amount of this adjustment (in thousands)?<\/p><\/div>", "subj": "fsa"}, {"n": 53, "q": "The carrying value of Kasamatsu's total assets on December 31, 2002, using the current rate method of accounting for translations is:", "opts": ["$2,938.", "$3,573.", "$3,240."], "a payable to Wasson Brothers) Exchange rate on date of stock 100 issue and acquisition of fixed assets Kasamatsu Industries Financial Data (12/31/02) U.S. Dollars Yen Exchange Rate (in thousands) (in thousands) 700,000 Sales COGS 280,000 126,000 Depreciation 77,000 SG &amp; A 98,000 Income Tax Expense 119,000 Net Income\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v015.webp\" style=\"max-width:min(100%,667px)\" alt=\"2001 Retained Earnings 0 58,000 Dividends 61,000 2002 Retained Earnings 50,000 Current Assets Fixed Assets 486,000 Current Liabilities 46,000 Long Term Debt 254,000 175,000 Capital Stock Accumulated Translation Adjustment\"><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.e<\/div><div class=\"qtext\"><p>The carrying value of Kasamatsu&#x27;s total assets on December 31, 2002, using the current rate method of accounting for translations is:<\/p><\/div>", "subj": "fsa"}, {"n": 54, "q": "Having converted all of Kasamatsu's accounts using the current rate methods, Jameson is curious to compare the difference between the temporal and current rate methods on balance sheet accounts. The difference in translated fixed assets and long term debt respectively if Jameson were to use the temporal method rather than the current rate method is: Long-Term Fixed Assets Debt", "opts": ["$0 $0", "$1620 $0", "$1620 $121"], "ans": "B", "expl": "Fixed assets under the temporal method, are reported at historical translation rates. 486,000 / 100 = $4,860. Under current rate, fixed assets are translated at the current rate (486,000 / 150) = $3,240, a difference of $1,620. Even though it is a balance sheet account, under the temporal method, long term debt is considered a monetary liability and is translated at the current rate. Under the current rate method, long-term debt is also translated at the current rate, so the difference between the two methods is $0.", "explhtml": "<p>Fixed assets under the temporal method, are reported at historical translation rates. 486,000 / 100 = $4,860. Under current rate, fixed assets are translated at the current rate (486,000 / 150) = $3,240, a difference of $1,620.<\/p><p>Even though it is a balance sheet account, under the temporal method, long term debt is considered a monetary liability and is translated at the current rate. Under the current rate method, long-term debt is also translated at the current rate, so the difference between the two methods is $0.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 51–54<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Walter Jameson, CFA®, is an analyst for Continental Corp., a global investment bank. Jameson has been assigned coverage of Wasson Brothers (WB), a large U.S. based conglomerate with many subsidiaries in both the U.S. and abroad. Jameson has completed his review of the firm's U.S. operations, but his research report is due at the end of the week and he has yet to assess the impact of Wasson's foreign subsidiaries on his earnings model.<\/p><p>One of WB's wholly-owned foreign subsidiaries, Kasamatsu Industries, is based in Japan and manufactures a hugely successful line of trading cards, toys, and other related products. All of Kasamatsu's operations and sales take place in Japan, and the corresponding transactions are denominated in Japanese yen. Additionally, Kasamatsu's books and records are all maintained in yen. WB reports its earnings in U.S. dollars. The history of the exchange rate between the dollar and the yen over the last two years is presented in the following table. Figures are presented in yen/$.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v014.webp\" style=\"max-width:min(100%,667px)\" alt=\"Yen/Dollar Exchange Rate 150 December 31, 2002 130 December 31, 2001 140 2002 Average 120 2001 Average Exchange rate on date that 2002 145 dividends were declared (payable to Wasson Brothers) Exchange rate on date of stock 100 issue and acquisition of fixed assets Kasamatsu Industries Financial Data (12/31/02) U.S. Dollars Yen Exchange Rate (in thousands) (in thousands) 700,000 Sales COGS 280,000 126,000 Depreciation 77,000 SG &amp; A 98,000 Income Tax Expense 119,000 Net Income\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v015.webp\" style=\"max-width:min(100%,667px)\" alt=\"2001 Retained Earnings 0 58,000 Dividends 61,000 2002 Retained Earnings 50,000 Current Assets Fixed Assets 486,000 Current Liabilities 46,000 Long Term Debt 254,000 175,000 Capital Stock Accumulated Translation Adjustment\"><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.e<\/div><div class=\"qtext\"><p>Having converted all of Kasamatsu&#x27;s accounts using the current rate methods, Jameson is curious to compare the difference between the temporal and current rate methods on balance sheet accounts. The difference in translated fixed assets and long term debt respectively if Jameson were to use the temporal method rather than the current rate method is:<\/p><p>Long-Term<\/p><p>Fixed Assets<\/p><p>Debt<\/p><\/div>", "subj": "fsa"}, {"n": 55, "q": "In reality, what best describes the real value of non-monetary assets and liabilities in a hyperinflationary environment?", "opts": ["All non-monetary accounts are re-measured at the current rate.", "Typically not affected because their local currency-denominated values decrease to offset the impact of inflation.", "Typically not affected because their local currency-denominated values increase to offset the impact of inflation."], "ans": "C", "expl": "Typically not affected because their local currency-denominated values increase to offset the impact of inflation (i.e., real estate values typically rise with inflation).", "explhtml": "<p>Typically not affected because their local currency-denominated values increase to offset the impact of inflation (i.e., real estate values typically rise with inflation).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.7, LOS 9.g<\/div><div class=\"qtext\"><p>In reality, what best describes the real value of non-monetary assets and liabilities in a hyperinflationary environment?<\/p><\/div>", "subj": "fsa"}, {"n": 56, "q": "Assuming the current rate method is used to translate Continental's financial statements, as compared to the local currency ratios, which of the following statements about translated operating profit margin and long-term debt to equity ratios is correct?", "opts": ["Operating profit margin will be higher.", "Long-term debt-to-equity ratio will be higher.", "Neither ratio will change."], "ans": "C", "expl": "Under the current rate method, all revenues and all expenses are translated at the average rate. Consequently, the subtotals (gross profit, operating profit, and net profit) are translated at the average rate. Translating the numerator (operating profit) and the denominator (sales) at the same rate will have no impact on the ratio. Under the current rate method, all assets and all liabilities are translated at the current rate. In order for the balance sheet equation to balance, total shareholders' equity must also be translated at the current rate. Translating the numerator (long-term debt) and the denominator (shareholders' equity) at the same rate will have no impact on the ratio.", "explhtml": "<p>Under the current rate method, all revenues and all expenses are translated at the average rate. Consequently, the subtotals (gross profit, operating profit, and net profit) are translated at the average rate. Translating the numerator (operating profit) and the denominator (sales) at the same rate will have no impact on the ratio.<\/p><p>Under the current rate method, all assets and all liabilities are translated at the current rate. In order for the balance sheet equation to balance, total shareholders&#x27; equity must also be translated at the current rate. Translating the numerator (long-term debt) and the denominator (shareholders&#x27; equity) at the same rate will have no impact on the ratio.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 56–59<\/summary><div class=\"vig-body\"><p>Neptune Corporation (Neptune) is a U.S. company located in Detroit, Michigan. Neptune supplies exhaust emission systems to manufacturers of passenger cars and light duty trucks. In January 2006, Neptune formed a wholly owned subsidiary, Continental Systems GmbH (Continental), to supply automotive manufacturers located throughout Europe. Continental is located in Stuttgart, Germany.<\/p><p>Neptune reports its consolidated financial statements in U.S. dollars. The euro has been consistently appreciating against the dollar.<\/p><p>Continental accounts for its inventory using the first-in, first-out (FIFO) cost flow assumption. Fixed assets consist of machinery, tools, and equipment.<\/p><p>Contintential has net monetary assets.<\/p><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.e<\/div><div class=\"qtext\"><p>Assuming the current rate method is used to translate Continental&#x27;s financial statements, as compared to the local currency ratios, which of the following statements about translated operating profit margin and long-term debt to equity ratios is correct?<\/p><\/div>", "subj": "fsa"}, {"n": 57, "q": "When stated in U.S. dollars, would Continental most likely report a higher fixed asset turnover ratio and a higher quick ratio under the temporal method, as compared to the current rate method?", "opts": ["Only the quick ratio will be higher under the temporal method.", "Only fixed asset turnover will be higher under the temporal method.", "Both ratios will be higher under the temporal method."], "ans": "B", "expl": "Continental would report a higher fixed asset turnover ratio (sales/fixed assets) under the temporal method because sales are translated at the same rate under both methods (the average rate), but fixed assets would be translated at the lower historical rate (because the euro is appreciating) under the temporal method. Therefore, the ratio will be higher. Continental would not report a higher quick ratio under the temporal method. Actually, the quick ratio would be the same under both methods. Continental's quick assets include cash and accounts receivable. Quick assets and current liabilities are converted at the current rate under both methods.", "explhtml": "<p>Continental would report a higher fixed asset turnover ratio (sales/fixed assets) under the temporal method because sales are translated at the same rate under both methods (the average rate), but fixed assets would be translated at the lower historical rate (because the euro is appreciating) under the temporal method. Therefore, the ratio will be higher.<\/p><p>Continental would not report a higher quick ratio under the temporal method. Actually, the quick ratio would be the same under both methods. Continental&#x27;s quick assets include cash and accounts receivable. Quick assets and current liabilities are converted at the current rate under both methods.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 56–59<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Neptune Corporation (Neptune) is a U.S. company located in Detroit, Michigan. Neptune supplies exhaust emission systems to manufacturers of passenger cars and light duty trucks. In January 2006, Neptune formed a wholly owned subsidiary, Continental Systems GmbH (Continental), to supply automotive manufacturers located throughout Europe. Continental is located in Stuttgart, Germany.<\/p><p>Neptune reports its consolidated financial statements in U.S. dollars. The euro has been consistently appreciating against the dollar.<\/p><p>Continental accounts for its inventory using the first-in, first-out (FIFO) cost flow assumption. Fixed assets consist of machinery, tools, and equipment.<\/p><p>Contintential has net monetary assets.<\/p><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.e<\/div><div class=\"qtext\"><p>When stated in U.S. dollars, would Continental most likely report a higher fixed asset turnover ratio and a higher quick ratio under the temporal method, as compared to the current rate method?<\/p><\/div>", "subj": "fsa"}, {"n": 58, "q": "Which of the following statements about the temporal method and the current rate method is least accurate?", "opts": ["Subsidiaries whose operations are well integrated with the parent will generally use the current rate method.", "Net income is generally more volatile under the temporal method than under the current rate method.", "Subsidiaries that operate in highly inflationary environments will generally use the temporal method under U.S. GAAP."], "ans": "A", "expl": "Subsidiaries whose operations are well integrated with the parent will generally use the parent's currency as the functional currency. Remeasurement from the local currency to the functional currency is done with the temporal method.", "explhtml": "<p>Subsidiaries whose operations are well integrated with the parent will generally use the parent&#x27;s currency as the functional currency. Remeasurement from the local currency to the functional currency is done with the temporal method.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 56–59<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Neptune Corporation (Neptune) is a U.S. company located in Detroit, Michigan. Neptune supplies exhaust emission systems to manufacturers of passenger cars and light duty trucks. In January 2006, Neptune formed a wholly owned subsidiary, Continental Systems GmbH (Continental), to supply automotive manufacturers located throughout Europe. Continental is located in Stuttgart, Germany.<\/p><p>Neptune reports its consolidated financial statements in U.S. dollars. The euro has been consistently appreciating against the dollar.<\/p><p>Continental accounts for its inventory using the first-in, first-out (FIFO) cost flow assumption. Fixed assets consist of machinery, tools, and equipment.<\/p><p>Contintential has net monetary assets.<\/p><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.e<\/div><div class=\"qtext\"><p>Which of the following statements about the temporal method and the current rate method is least accurate?<\/p><\/div>", "subj": "fsa"}, {"n": 59, "q": "As compared to local currency ratios, which of the following are the most likely impacts on gross profit margin and net profit margin, assuming the temporal method is used to remeasure Continental's financial statements?", "opts": ["Both will be higher.", "Higher net income, with a higher funded status.", "Only net profit margin will be higher."], "ans": "A", "expl": "Under the temporal method, sales are remeasured at the average rate, and cost of goods sold is remeasured at the historical rate. Since the euro is appreciating relative to the dollar, sales will be higher when stated in dollars. Because cost of goods sold is remeasured at the historical rate, it does not reflect the appreciating euro. Therefore, appreciating sales, without a corresponding increase in cost of goods sold, will result in higher gross profit margin. Under the temporal method, exposure is defined as the firm's net monetary asset or net monetary liability position. Continental is holding net monetary assets (monetary assets exceed monetary liabilities), and the position is increasing. Holding net monetary assets when the euro is appreciating will result in the recognition of a gain in the income statement. The gain results in higher net income and, thus, higher net profit margin.", "explhtml": "<p>Under the temporal method, sales are remeasured at the average rate, and cost of goods sold is remeasured at the historical rate. Since the euro is appreciating relative to the dollar, sales will be higher when stated in dollars. Because cost of goods sold is remeasured at the historical rate, it does not reflect the appreciating euro. Therefore, appreciating sales, without a corresponding increase in cost of goods sold, will result in higher gross profit margin.<\/p><p>Under the temporal method, exposure is defined as the firm&#x27;s net monetary asset or net monetary liability position. Continental is holding net monetary assets (monetary assets exceed monetary liabilities), and the position is increasing. Holding net monetary assets when the euro is appreciating will result in the recognition of a gain in the income statement. The gain results in higher net income and, thus, higher net profit margin.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 56–59<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Neptune Corporation (Neptune) is a U.S. company located in Detroit, Michigan. Neptune supplies exhaust emission systems to manufacturers of passenger cars and light duty trucks. In January 2006, Neptune formed a wholly owned subsidiary, Continental Systems GmbH (Continental), to supply automotive manufacturers located throughout Europe. Continental is located in Stuttgart, Germany.<\/p><p>Neptune reports its consolidated financial statements in U.S. dollars. The euro has been consistently appreciating against the dollar.<\/p><p>Continental accounts for its inventory using the first-in, first-out (FIFO) cost flow assumption. Fixed assets consist of machinery, tools, and equipment.<\/p><p>Contintential has net monetary assets.<\/p><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.e<\/div><div class=\"qtext\"><p>As compared to local currency ratios, which of the following are the most likely impacts on gross profit margin and net profit margin, assuming the temporal method is used to remeasure Continental&#x27;s financial statements?<\/p><\/div>", "subj": "fsa"}, {"n": 60, "q": "With respect to the Canadian subsidiary, what method should be used to value its revenues, what is the appropriate exchange rate, and what is the translated value (in USD)?", "opts": ["Temporal method, average rate, USD 34.0 million.", "Current method, average rate, USD 34.0 million.", "Current method, current rate, USD 33.0 million."], "ans": "B", "expl": "The basis for using the current rate method is when Functional Currency is NOT the same as Parent's Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent's Presentation Currency. Self-contained, independent subsidiaries reporting their results in the local currency that is also the functional currency use the current method. Revenues under the current method are translated using the average rate. Hence, 50 × 0.6803 = USD 34.0 million.", "explhtml": "<p>The basis for using the current rate method is when Functional Currency is NOT the same as Parent&#x27;s Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent&#x27;s Presentation Currency.<\/p><p>Self-contained, independent subsidiaries reporting their results in the local currency that is also the functional currency use the current method. Revenues under the current method are translated using the average rate. Hence, 50 × 0.6803 = USD 34.0 million.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 60–63<\/summary><div class=\"vig-body\"><p>Geocorp is a global corporation with operations in North America, Asia, and Europe. Its primary business is marketing industrial machinery for the construction industry, Geocorp has regional headquarters located in New York, Tokyo, and Paris. All North American and U.S operations report to its regional and world headquarters located in New York, while all Asian operations report to Tokyo, and all European operations report to Pa hod. Fixed assets under the temporal method are translated using the historical rate. Hence, 370 × 1.4803 = USD 547.7 million.", "explhtml": "<p>Subsidiaries reporting their results in the local currency that is NOT the functional currency use the temporal method. Fixed assets under the temporal method are translated using the historical rate. Hence, 370 × 1.4803 = USD 547.7 million.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 60–63<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Geocorp is a global corporation with operations in North America, Asia, and Europe. Its primary business is marketing industrial machinery for the construction industry, Geocorp has regional headquarters located in New York, Tokyo, and Paris. All North American and U.S operations report to its regional and world headquarters located in New York, while all Asian operations report to Tokyo, and all European operations report to Paris.<\/p><p>The following information is relevant to Geocorp's subsidiaries:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v016.webp\" style=\"max-width:min(100%,635px)\" alt=\"• Geocorp has a Canadian subsidiary that reports its results in Canadian dollars (CAD). The CAD is the functional currency. • All domestic U.S. operations report their results in U.S. dollars (USD). • Consolidated financial statements are reported in USD. • Geocorp&#x27;s Asian operations report their results in Japanese yen (PY). The JPY is the functional currency. • Geocorp&#x27;s European headquarters (in Paris) operations report their results in euros (EUR). The EUR is the functional currency. • Geocorp has a British subsidiary that reports its results in British pounds (GBP). The USD is t\"><p>The following table is a summary of selected financial results from Geocorp's foreign operations:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v017.webp\" style=\"max-width:min(100%,666px)\" alt=\"CAD GBP EUR JPY All values are in millions 50 150 700 5,000 Revenues 2,700 100 20 480 Cost of goods sold (COGS) 50 220 2,300 30 Gross profit Selling, general &amp; administrative (SGA) 1,000 200 29 18 expenses 1,300 21 12 10 EBIT 4,200 102 400 35 Cash 170 1,400 12 45 Accounts receivable 3,900 123 20 300 Inventory 370 7,680 450 62 Fixed assets 3,300 27 68 350 Accounts payable 550 8,450 320 Long-term debt 0 2,000 10 50 350 Common stock The following exchange rates apply (USD per foreign currency unit): December 31, 20X2 Average Rate Historical Rate Currency USD 0.6592 USD 0.6803 USD 0.7013 CAD\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v018.webp\" style=\"max-width:min(100%,666px)\" alt=\"USD 0.0082 USD 0.0088 USD 0.0094 JPY USD 1.0834 USD 1.0318 USD 0.9801 EUR USD 1,5506 USD 1.6209 USD 1.4803 GBP\"><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.e<\/div><div class=\"qtext\"><p>With respect to the British subsidiary, what method should be used to value its fixed assets, what is the appropriate exchange rate, and what is the translated value (USD)?<\/p><\/div>", "subj": "fsa"}, {"n": 64, "q": "Assuming closing retained earnings for the year 20X8 was $110, the translation gain on the income statement would be:", "opts": ["$17.", "$0.", "$27."], "ans": "C", "expl": "We need to complete our remeasurement of the income statement. Since beginning retained earnings for the year were zero, we know that net income on the remeasured income must be equal to ending retained earnings. The remeasurement gain or loss is the plug figure that causes this to be the case. Income (in SF thousands) December 31, 20X8 $'000 Sales  7,000 × 0.80  5,600 | COGS  Working 1  (5,440) | Gross Profit  160 | Depreciation  100 × 0.77  (77) | Remeasurement gain (plug)  27 | Net Income  110 Working 1 COGS (LIFO) Step 1: Calculate purchases in SF: Beginning inventory 500(given) + Purchases (plug) 6,800 – Ending Inventory 500(given) = COGS 6,800 Step 2: Remeasure COGS: Beginning Inventory 500 SF @ 0.77  =  $385 | (+) Purchases 6,800 SF @ 0.80  =  $5,440 | (–) Ending inventory 500 SF @ 0.77  =  $385 | (=) COGS  $5,440 Note that the amount of inventory did not change in the period. Given that the firm uses a periodic inventory system and LIFO, the same purchases would be included in both beginning and ending inventory and therefore the same historic exchange rate is applied to both. Purchases were made evenly throughout the period and therefore the average rate has been applied.", "explhtml": "<p>We need to complete our remeasurement of the income statement. Since beginning retained earnings for the year were zero, we know that net income on the remeasured income must be equal to ending retained earnings. The remeasurement gain or loss is the plug figure that causes this to be the case.<\/p><p>Income (in SF thousands) December 31, 20X8<\/p><p>$&#x27;000<\/p><div class=\"tbl\"><table><tr><td>Sales<\/td><td>7,000 × 0.80<\/td><td>5,600<\/td><\/tr><tr><td>COGS<\/td><td>Working 1<\/td><td>(5,440)<\/td><\/tr><tr><td>Gross Profit<\/td><td>160<\/td><\/tr><tr><td>Depreciation<\/td><td>100 × 0.77<\/td><td>(77)<\/td><\/tr><tr><td>Remeasurement gain (plug)<\/td><td>27<\/td><\/tr><tr><td>Net Income<\/td><td>110<\/td><\/tr><\/table><\/div><p>Working 1 COGS (LIFO)<\/p><p>Step 1: Calculate purchases in SF:<\/p><p>Beginning inventory 500(given) + Purchases (plug) 6,800 – Ending Inventory 500(given) = COGS 6,800<\/p><p>Step 2: Remeasure COGS:<\/p><div class=\"tbl\"><table><tr><td>Beginning Inventory 500 SF @ 0.77<\/td><td>=<\/td><td>$385<\/td><\/tr><tr><td>(+) Purchases 6,800 SF @ 0.80<\/td><td>=<\/td><td>$5,440<\/td><\/tr><tr><td>(–) Ending inventory 500 SF @ 0.77<\/td><td>=<\/td><td>$385<\/td><\/tr><tr><td>(=) COGS<\/td><td>$5,440<\/td><\/tr><\/table><\/div><p>Note that the amount of inventory did not change in the period. Given that the firm uses a periodic inventory system and LIFO, the same purchases would be included in both beginning and ending inventory and therefore the same historic exchange rate is applied to both. Purchases were made evenly throughout the period and therefore the average rate has been applied.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 64–67<\/summary><div class=\"vig-body\"><p>Scud Co. is a Swiss subsidiary of the U.S. firm Patriot, Inc. On December 31, 20X7 the $/SF exchange rate was 0.77. Assume that this is the historical rate, except as noted below. One year later the Swiss Franc had appreciated to 0.85 $/SF. Scud Co. pays no dividends. The average exchange rate for the year was 0.80 $/SF. Scud pays no taxes. Assume that Scud uses a periodic inventory system and that inventory is accounted for using the LIFO inventory assumption, was bought and sold evenly throughout the year.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v019.webp\" style=\"max-width:min(100%,573px)\" alt=\"Scud Co. Int&#x27;l Balance Sheet (in SF thousands) Dec. 31, 20X8 Dec. 31, 20X7 600 Cash &amp; A/R 400 500 500 Inventory 700 600 Net Fixed Assets 1,700 1,600 Total Assets 200 100 A/P 100 200 Long-term debt 1,300 1,300 Common Stock Retained Earnings 100 1,700 Total Liabilities 1,600 Income Statement (in SF thousands)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v020.webp\" style=\"max-width:min(100%,422px)\" alt=\"December 31,20x8 In SF Sales 7,000 COGS (6,800) (100) Depreciation Remeasurement Gain/Loss - 100 Net Income\"><p>Assume that the functional currency is the U.S. dollar when answering the following questions.<\/p><\/div><\/details><div class=\"pp-topic\">Module 9.6, LOS 9.f<\/div><div class=\"qtext\"><p>Assuming closing retained earnings for the year 20X8 was $110, the translation gain on the income statement would be:<\/p><\/div>", "subj": "fsa"}, {"n": 65, "q": "The level of net fixed assets on the remeasured 20X8 balance sheet would be:", "opts": ["$480.", "$510.", "$462."], "ans": "C", "expl": "Net fixed assets are considered non-monetary assets. For non-monetary assets, the temporal method uses the historical rate: 600SF × 0.77$/SF = $462.", "explhtml": "<p>Net fixed assets are considered non-monetary assets. For non-monetary assets, the temporal method uses the historical rate: 600SF × 0.77$/SF = $462.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 64–67<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Scud Co. is a Swiss subsidiary of the U.S. firm Patriot, Inc. On December 31, 20X7 the $/SF exchange rate was 0.77. Assume that this is the historical rate, except as noted below. One year later the Swiss Franc had appreciated to 0.85 $/SF. Scud Co. pays no dividends. The average exchange rate for the year was 0.80 $/SF. Scud pays no taxes. Assume that Scud uses a periodic inventory system and that inventory is accounted for using the LIFO inventory assumption, was bought and sold evenly throughout the year.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v019.webp\" style=\"max-width:min(100%,573px)\" alt=\"Scud Co. Int&#x27;l Balance Sheet (in SF thousands) Dec. 31, 20X8 Dec. 31, 20X7 600 Cash &amp; A/R 400 500 500 Inventory 700 600 Net Fixed Assets 1,700 1,600 Total Assets 200 100 A/P 100 200 Long-term debt 1,300 1,300 Common Stock Retained Earnings 100 1,700 Total Liabilities 1,600 Income Statement (in SF thousands)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v020.webp\" style=\"max-width:min(100%,422px)\" alt=\"December 31,20x8 In SF Sales 7,000 COGS (6,800) (100) Depreciation Remeasurement Gain/Loss - 100 Net Income\"><p>Assume that the functional currency is the U.S. dollar when answering the following questions.<\/p><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.e<\/div><div class=\"qtext\"><p>The level of net fixed assets on the remeasured 20X8 balance sheet would be:<\/p><\/div>", "subj": "fsa"}, {"n": 66, "q": "The le pt as noted below. One year later the Swiss Franc had appreciated to 0.85 $/SF. Scud Co. pays no dividends. The average exchange rate for the year was 0.80 $/SF. Scud pays no taxes. Assume that Scud uses a periodic inventory system and that inventory is accounted for using the LIFO inventory assumption, was bought and sold evenly throughout the year.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v019.webp\" style=\"max-width:min(100%,573px)\" alt=\"Scud Co. Int&#x27;l Balance Sheet (in SF thousands) Dec. 31, 20X8 Dec. 31, 20X7 600 Cash &amp; A/R 400 500 500 Inventory 700 600 Net Fixed Assets 1,700 1,600 Total Assets 200 100 A/P 100 200 Long-term debt 1,300 1,300 Common Stock Retained Earnings 100 1,700 Total Liabilities 1,600 Income Statement (in SF thousands)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v020.webp\" style=\"max-width:min(100%,422px)\" alt=\"December 31,20x8 In SF Sales 7,000 COGS (6,800) (100) Depreciation Remeasurement Gain/Loss - 100 Net Income\"><p>Assume that the functional currency is the U.S. dollar when answering the following questions.<\/p><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.e<\/div><div class=\"qtext\"><p>The level of retained earnings on the remeasured 20X8 balance sheet would be:<\/p><\/div>", "subj": "fsa"}, {"n": 67, "q": "As compared to the local currency ratio, fixed asset turnover in the reporting currency would most likely be:", "opts": ["higher.", "lower.", "the same."], "ans": "A", "expl": "Fixed asset turnover is calculated as sales / average fixed assets. The numerator is translated at the average rate during the year ($0.80/SF) while fixed assets are translated at historical rate ($0.77/SF). Hence the reporting currency numerator will be higher resulting in a higher fixed-asset turnover ratio.", "explhtml": "<p>Fixed asset turnover is calculated as sales / average fixed assets. The numerator is translated at the average rate during the year ($0.80/SF) while fixed assets are translated at historical rate ($0.77/SF). Hence the reporting currency numerator will be higher resulting in a higher fixed-asset turnover ratio.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 64–67<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Scud Co. is a Swiss subsidiary of the U.S. firm Patriot, Inc. On December 31, 20X7 the $/SF exchange rate was 0.77. Assume that this is the historical rate, except as noted below. One year later the Swiss Franc had appreciated to 0.85 $/SF. Scud Co. pays no dividends. The average exchange rate for the year was 0.80 $/SF. Scud pays no taxes. Assume that Scud uses a periodic inventory system and that inventory is accounted for using the LIFO inventory assumption, was bought and sold evenly throughout the year.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v019.webp\" style=\"max-width:min(100%,573px)\" alt=\"Scud Co. Int&#x27;l Balance Sheet (in SF thousands) Dec. 31, 20X8 Dec. 31, 20X7 600 Cash &amp; A/R 400 500 500 Inventory 700 600 Net Fixed Assets 1,700 1,600 Total Assets 200 100 A/P 100 200 Long-term debt 1,300 1,300 Common Stock Retained Earnings 100 1,700 Total Liabilities 1,600 Income Statement (in SF thousands)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v020.webp\" style=\"max-width:min(100%,422px)\" alt=\"December 31,20x8 In SF Sales 7,000 COGS (6,800) (100) Depreciation Remeasurement Gain/Loss - 100 Net Income\"><p>Assume that the functional currency is the U.S. dollar when answering the following questions.<\/p><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.e<\/div><div class=\"qtext\"><p>As compared to the local currency ratio, fixed asset turnover in the reporting currency would most likely be:<\/p><\/div>", "subj": "fsa"}, {"n": 68, "q": "Which of the following statements regarding the effects of translation on financial statement items/ratios is most accurate?", "opts": ["Fixed assets are relatively overstated under the temporal method compared to the local currency if the local currency has appreciated.", "Leverage is higher under the current rate method as compared to under the local currency.", "Depreciation in the reporting currency under the current rate method is higher than under the temporal method if the local currency has appreciated."], "ans": "C", "expl": "Fixed assets are relatively understated under the temporal method if the local currency appreciates as they are translated at the weaker historic rate. The leverage ratio will be unaltered under the current rate method as it is a pure balance sheet ratio and hence all translated at the current rate.", "explhtml": "<p>Fixed assets are relatively understated under the temporal method if the local currency appreciates as they are translated at the weaker historic rate. The leverage ratio will be unaltered under the current rate method as it is a pure balance sheet ratio and hence all translated at the current rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.6, LOS 9.f<\/div><div class=\"qtext\"><p>Which of the following statements regarding the effects of translation on financial statement items/ratios is most accurate?<\/p><\/div>", "subj": "fsa"}, {"n": 69, "q": "Which of the following statements about the temporal method and the current rate method is least accurate?", "opts": ["Subsidiaries whose operations are well integrated with the parent will generally use the current rate method.", "Net income is generally more volatile under the temporal method than under the current rate method.", "Subsidiaries that operate in highly inflationary environments will generally use the temporal method under U.S. GAAP."], "ans": "A", "expl": "Subsidiaries whose operations are well integrated with the parent will generally use the parent's currency as the functional currency. Remeasurement from the local currency to the functional currency is done with the temporal method.", "explhtml": "<p>Subsidiaries whose operations are well integrated with the parent will generally use the parent&#x27;s currency as the functional currency. Remeasurement from the local currency to the functional currency is done with the temporal method.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 69–72<\/summary><div class=\"vig-body\"><p>Navratov Corp. is a designer and manufacturer of high end sporting goods. The majority of the firm's business comes from Olympic athletes from Russia and the United States. On January 1, 2003, Navratov was purchased by a U.S. competitor, Evert Industries. Because Evert's business focuses on professional athletes in North America and Asia, Evert's management feels the acquisition of Navratov is a natural extension of their business and that buying the Russian firm should generate economies of scale.<\/p><p>Peter Capriati is an analyst for Evert and has been assigned the task of integrating Navratov's financial statements into Evert's. Capriati knows that Evert's management pays a great deal of attention to making sure the firm's financial ratios are above the industry average. Because Navratov's sales are split evenly between the U.S. and Russia, management has given him the flexibility to designate the either the Ruble (Navratov's local currency) or the U.S. dollar (Evert's reporting currency) as Navratov's functional currency. As a result of choosing the functional currency, Capriati will use either the temporal or current rate method to convert Navratov's financial statements, depending on which method will have the most favorable impact on Evert's financial ratios.<\/p><p>Selected financial data for Navratov Corp is shown below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v021.webp\" style=\"max-width:min(100%,667px)\" alt=\"Navratov Corporation Income Statement (in Russian Rubles) 12 months ended December 31, 2003 7,400,000 Revenue (5,200,000) Cost of Goods S nuary 1, 2012 $0.11/peso (this is the 2012 average June 30,2012 rate) $0.10/peso December 31, 2012 Grande, Inc. Balance Sheet (in M Pesos)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r9/v025.webp\" style=\"max-width:min(100%,630px)\" alt=\"35,000,000 40,000,000 Long Term Debt 80,000,000 80,000,000 Common Stock 5,000,000 Retained Earnings 2012 Income Statement (in Pesos) 60,000,000 Sales Cost of Goods Sold (COGS) (45,000,000) (10,000,000) Depreciation 5,000,000 Net Income\"><p>Assume that Giant Company considers the Mexican peso to be both the local currency and the functional currency of Grande, Inc.<\/p><\/div><\/details><div class=\"pp-topic\">Module 9.4, LOS 9.d<\/div><div class=\"qtext\"><p>Compared to the current ratio before translation, the current ratio after translation is most likely to be:<\/p><\/div>", "subj": "fsa"}, {"n": 77, "q": "Which of the following ratios is affected by translation under the current rate method?", "opts": ["Fixed asset turnover ratio.", "Debt/Assets ratio.", "Net profit margin."], "ans": "A", "expl": "Recall that all pure income statements and balance sheet ratios are unaffected by translation under the current rate method. The fixed asset turnover ratio is not a pure ratio; it consists of an income statement measure (sales, translated at the average rate) and a balance sheet measure (fixed assets, translated at the current rate).", "explhtml": "<p>Recall that all pure income statements and balance sheet ratios are unaffected by translation under the current rate method. The fixed asset turnover ratio is not a pure ratio; it consists of an income statement measure (sales, translated at the average rate) and a balance sheet measure (fixed assets, translated at the current rate).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.6, LOS 9.f<\/div><div class=\"qtext\"><p>Which of the following ratios is affected by translation under the current rate method?<\/p><\/div>", "subj": "fsa"}, {"n": 78, "q": "Portinta Inc, a U.S. based pharmaceutical company, has a UK based subsidiary, Medaze plc. The U.S. dollar has been appreciating relative to GBP over the past year. Using the current-rate method to translate a foreign subsidiary's financial statements to U.S. dollars will most likely have which of the following effects on the long-term debt to equity ratio relative to what the ratio would have been without the effects of translation?", "opts": ["The ratio will be lower.", "The ratio will be the same.", "The ratio will be higher."], "ans": "B", "expl": "Under the current rate method, both LTD and equity are translated at the current rate of exchange. Hence, since the same rate is applied in both the numerator and denominator, the ratio will not change. Note: When equity is broken out into separate accounts, common stock is taken at the historical rate. When taken as a whole, equity should be translated at the current rate. In this case we are not given any information on the common stock amount, so we translate equity at the current rate.", "explhtml": "<p>Under the current rate method, both LTD and equity are translated at the current rate of exchange. Hence, since the same rate is applied in both the numerator and denominator, the ratio will not change.<\/p><p>Note: When equity is broken out into separate accounts, common stock is taken at the historical rate. When taken as a whole, equity should be translated at the current rate. In this case we are not given any information on the common stock amount, so we translate equity at the current rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.6, LOS 9.f<\/div><div class=\"qtext\"><p>Portinta Inc, a U.S. based pharmaceutical company, has a UK based subsidiary, Medaze plc. The U.S. dollar has been appreciating relative to GBP over the past year. Using the current-rate method to translate a foreign subsidiary&#x27;s financial statements to U.S. dollars will most likely have which of the following effects on the long-term debt to equity ratio relative to what the ratio would have been without the effects of translation?<\/p><\/div>", "subj": "fsa"}, {"n": 79, "q": "The U.S. dollar (i.e., the reporting currency) has been depreciating relative to the local currency over the past year. The use of the current rate method to translate a foreign subsidiary's financial statements to U.S. dollars will most likely have which of the following effects on return on equity (ROE) based on ending equity relative to what the ratio would have been without the effects of translation?", "opts": ["ROE will most likely decline.", "The impact of the depreciation of the US dollar on ROE is indeterminate.", "ROE will most likely rise."], "ans": "A", "expl": "ROE = Net Income / Equity. Under the current rate method, the equity accounts as a whole are translated at the current rate whereas net income is translated at the average rate. Since the dollar is depreciating, each foreign currency unit is buying more dollars in the denominator relative to the numerator of the equation. Hence, the denominator is increasing and the ratio falls.", "explhtml": "<p>ROE = Net Income / Equity. Under the current rate method, the equity accounts as a whole are translated at the current rate whereas net income is translated at the average rate. Since the dollar is depreciating, each foreign currency unit is buying more dollars in the denominator relative to the numerator of the equation. Hence, the denominator is increasing and the ratio falls.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 9.6, LOS 9.f<\/div><div class=\"qtext\"><p>The U.S. dollar (i.e., the reporting currency) has been depreciating relative to the local currency over the past year. The use of the current rate method to translate a foreign subsidiary&#x27;s financial statements to U.S. dollars will most likely have which of the following effects on return on equity (ROE) based on ending equity relative to what the ratio would have been without the effects of translation?<\/p><\/div>", "subj": "fsa"}, {"n": 80, "q": "The amount of 20X6 cost of goods sold in USD is: (Note: if needed, use $0.40 as the rate to convert 20X5 ending inventory)", "opts": ["$262,800,000.00", "$270,000,000.00", "$300,000,000.00"], "ans": "B", "expl": "The basis for using the current rate method is when Functional Currency is NOT the same as Parent's Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent's Presentation Currency. Note that the 15% inflation over three years results in cumulative price increases of (1.15³) – 1 = 52% over three years.  U.S. GAAP's definition of hyperinflation, requiring the use of the temporal method, is a cumulative three-year rate exceeding 100%. Because the operations are independent from the parent, the current rate method will be used. Cost of goods sold should be accounted for at the average rate for the past year. The amount of cost of goods sold is 0.45 × 600,000,000 = $270,000,000.", "explhtml": "<p>The basis for using the current rate method is when Functional Currency is NOT the same as Parent&#x27;s Presentation (reporting) Currency. The basis for using the temporal method is when Functional Currency = Parent&#x27;s Presentation Currency. Note that the 15% inflation over three years results in cumulative price increases of (1.15<sup>3<\/sup>) – 1 = 52% over three years.  U.S. GAAP&#x27;s definition of hyperinflation, requiring the use of the temporal method, is a cumulative three-year rate exceeding 100%.<\/p><p>Because the operations are independent from the parent, the current rate method will be used. Cost of goods sold should be accounted for at the average rate for the past year. The amount of cost of goods sold is 0.45 × 600,000,000 = $270,000,000.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 80–83<\/summary><div class=\"vig-body\"><p>A U.S. company has a subsidiary based in Malaysia, which has
