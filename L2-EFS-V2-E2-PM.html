rian economy.<\/p><p>One of the many items they study when examining an economy or stock market is the economic information released by governments and private organizations. Hoskins and Lanning use this information to adjust their economic growth forecasts and to accordingly adjust portfolio allocations to the bond and stock markets. Examining information for Maldavia, Hoskins has learned that the Maldavian private sector has embarked on an ambitious plan to increase labor productivity by purchasing more machinery for its factories. Plotting the productivity curve for Maldavia, Hoskins states that labor productivity should increase because the productivity curve will shift up.<\/p><p>Lanning is examining the historical record of economic growth in Petra. He has gathered the data in Exhibit 1 to determine potential economic growth.<\/p><p><b>Exhibit 1: Economic Data for Petra from 20X1 to 20X7<\/b><\/p><div class=\"tbl\"><table><tr><td>Real GDP growth rate<\/td><td>3.9%<\/td><\/tr><tr><td>Growth rate in capital<\/td><td>1.4%<\/td><\/tr><tr><td>Growth rate in labor force<\/td><td>1.9%<\/td><\/tr><\/table><\/div><p>Labor cost/total factor cost 0.52<\/p><p>Lanning then turns his attention to the countries of Alicia and Felicia. He notes that the GDP growth rate in both countries is comparable. Alicia&#x27;s capital to labor ratio is USD 5,000. Felicia&#x27;s capital to labor ratio is USD 2,800. Alicia has a relatively younger labor force and the labor cost represents 35% of total factor cost. Both countries have extensive restrictions on foreign direct investments in their economy.<\/p><p>It has long been Platinum&#x27;s policy for its economists to use long-term economic growth trends to forecast future economic growth, stock returns, and dividends in a country. Lanning also examines the economy of Tiberia. Tiberia has a population of 11 million and is located in northern Africa. Its economy is diversified, and its main exports are agricultural products and heavy machinery. The country&#x27;s economy has been growing at an annual rate of 6.2% for the past 10 years, in part because of technological advances in the manufacturing of heavy equipment. These advances involve the use of computer-operated welding machines that have made the manufacturing process more efficient. Lanning is worried, however, that the current GDP growth rate may not be sustainable and is considering advising Platinum&#x27;s portfolio managers to decrease their portfolio allocations to the country. Before doing so, he will consult with Hoskins.<\/p><\/div><\/details><div class=\"qtext\"><p>The endogenous growth theory predicts that the Tiberian GDP growth rate is most likely to:<\/p><\/div>", "subj": "economics"}, {"n": 19, "q": "Regarding the prior purchase that was accounted for under the pooling of interests method, had Fisher Global reported this purchase under the acquisition method:", "opts": ["the assets and liabilities of the purchased firm would not be included on Fisher’s balance sheet.", "balance sheet assets and liabilities of the purchased firm would have been reported at fair value.", "reported goodwill could be less depending on the fair value of the identifiable assets and liabilities compared to their book values."], "ans": "B", "expl": "The assets and liabilities of the purchased firm are included on the balance sheet of the acquiring firm under either method. Under the pooling method, there is no adjustment of balance sheet asset and liability values to their fair values. Under the acquisition method, assets and liabilities acquired are reported at fair value at the time of the purchase. There is no goodwill reported under the pooling method; the purchase price is not reflected on the balance sheet of the acquiring firm. For Further Reference: (Study Session 5, Module 13.7, LOS 13.a)", "explhtml": "<p>The assets and liabilities of the purchased firm are included on the balance sheet of the acquiring firm under either method. Under the pooling method, there is no adjustment of balance sheet asset and liability values to their fair values. Under the acquisition method, assets and liabilities acquired are reported at fair value at the time of the purchase. There is no goodwill reported under the pooling method; the purchase price is not reflected on the balance sheet of the acquiring firm.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 13.7, LOS 13.a)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Questions 79 through 84 relate to Financial Reporting and Analysis.<\/p><p>Galena Petrovich Case Scenario<\/p><p>Galena Petrovich, CFA, is an analyst in the New York office of TRS Investment Management, Inc. Petrovich is an expert in the industrial electrical equipment sector and is analyzing Fisher Global. Fisher is a global market leader in designing, manufacturing, marketing, and servicing electrical systems and components, including fluid power systems and automotive engine air management systems.<\/p><p>Fisher has generated double-digit growth over the past 10 years, primarily as the result of acquisitions, and has reported positive net income in each year. Fisher reports its financial results using International Financial Reporting Standards (IFRS).<\/p><p>Petrovich is particularly interested in a transaction that occurred several years ago, before the change in accounting standards, in which Fisher used the pooling method to account for a large acquisition of Dartmouth Industries, an industry competitor. She would like to determine the effect of using the purchase method instead of the pooling method on the financial statements of Fisher. Fisher exchanged common stock for all of the outstanding shares of Dartmouth.<\/p><p>Fisher also has a 50% ownership interest in a joint venture with its major distributor, a U.S. company called Hydro Distribution. She determines that Fisher has reported its ownership interest under the equity method, and that the joint venture has been profitable since it was established three years ago. She decides to adjust the financial statements to show how the financial statements would be affected if Fisher had reported its ownership under the acquisition method. Fisher is also considering acquiring 80% to 100% of Brown and Sons Company. Petrovich must consider the effect of such an acquisition on Fisher&#x27;s financial statements.<\/p><p>Petrovich determines from the financial statement footnotes that Fisher had an unrealized gain related to debt securities that are classified as fair value through OCI. Competitor firms classify similar debt securities as fair value through profit or loss.<\/p><p>Finally, Petrovich finds a reference in Fisher&#x27;s footnotes regarding a special purpose entity (SPE). Fisher has reported its investment in the SPE using the equity method, but Petrovich believes that the consolidation method more accurately reflects Fisher&#x27;s true financial position, so she makes the appropriate adjustments to the financial statements.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding the prior purchase that was accounted for under the pooling of interests method, had Fisher Global reported this purchase under the acquisition method:<\/p><\/div>", "subj": "fsa"}, {"n": 20, "q": "Had Fisher Global reported its investment in the joint venture under the acquisition method rather than under the equity method, it is most likely that:", "opts": ["reported revenue would have been the same.", "reported expenses would have been lower.", "net income would not have been affected."], "ans": "C", "expl": "Under the acquisition method, the investee firm's revenue and expenses would be reported on Fisher's income statement, increasing both expenses and revenues. Under the equity method, Fisher's revenue and expenses are reported without adjustment, and the proportion of income from the purchased firm is reported separately, so that net income is the same under either method. For Further Reference: (Study Session 5, Module 13.4, LOS 13.a)", "explhtml": "<p>Under the acquisition method, the investee firm&#x27;s revenue and expenses would be reported on Fisher&#x27;s income statement, increasing both expenses and revenues. Under the equity method, Fisher&#x27;s revenue and expenses are reported without adjustment, and the proportion of income from the purchased firm is reported separately, so that net income is the same under either method.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 13.4, LOS 13.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 79 through 84 relate to Financial Reporting and Analysis.<\/p><p>Galena Petrovich Case Scenario<\/p><p>Galena Petrovich, CFA, is an analyst in the New York office of TRS Investment Management, Inc. Petrovich is an expert in the industrial electrical equipment sector and is analyzing Fisher Global. Fisher is a global market leader in designing, manufacturing, marketing, and servicing electrical systems and components, including fluid power systems and automotive engine air management systems.<\/p><p>Fisher has generated double-digit growth over the past 10 years, primarily as the result of acquisitions, and has reported positive net income in each year. Fisher reports its financial results using International Financial Reporting Standards (IFRS).<\/p><p>Petrovich is particularly interested in a transaction that occurred several years ago, before the change in accounting standards, in which Fisher used the pooling method to account for a large acquisition of Dartmouth Industries, an industry competitor. She would like to determine the effect of using the purchase method instead of the pooling method on the financial statements of Fisher. Fisher exchanged common stock for all of the outstanding shares of Dartmouth.<\/p><p>Fisher also has a 50% ownership interest in a joint venture with its major distributor, a U.S. company called Hydro Distribution. She determines that Fisher has reported its ownership interest under the equity method, and that the joint venture has been profitable since it was established three years ago. She decides to adjust the financial statements to show how the financial statements would be affected if Fisher had reported its ownership under the acquisition method. Fisher is also considering acquiring 80% to 100% of Brown and Sons Company. Petrovich must consider the effect of such an acquisition on Fisher&#x27;s financial statements.<\/p><p>Petrovich determines from the financial statement footnotes that Fisher had an unrealized gain related to debt securities that are classified as fair value through OCI. Competitor firms classify similar debt securities as fair value through profit or loss.<\/p><p>Finally, Petrovich finds a reference in Fisher&#x27;s footnotes regarding a special purpose entity (SPE). Fisher has reported its investment in the SPE using the equity method, but Petrovich believes that the consolidation method more accurately reflects Fisher&#x27;s true financial position, so she makes the appropriate adjustments to the financial statements.<\/p><\/div><\/details><div class=\"qtext\"><p>Had Fisher Global reported its investment in the joint venture under the acquisition method rather than under the equity method, it is most likely that:<\/p><\/div>", "subj": "fsa"}, {"n": 21, "q": "Regarding any potential goodwill on the acquisition of Brown and Sons being considered by Fisher Global, which of the following statements is most accurate? The goodwill will be reported as an asset and:", "opts": ["must be reviewed for impairment at least annually, with different test for impairment under IFRS and U.S. GAAP. Impairment losses can be reversed under U.S. GAAP but not under IFRS.", "amortized, and must be reviewed for impairment at least annually, though impairment losses cannot be reversed under either GAAP or IFRS.", "must be reviewed for impairment at least annually with different tests for impairment under IFRS and U.S. GAAP. The losses on impairment cannot be reversed under either U.S. GAAP or under IFRS."], "ans": "C", "expl": "Goodwill is not amortized under IFRS or U.S. GAAP. The test for impairment is different under IFRS than under U.S. GAAP. Impairment losses cannot be reversed under U.S. GAAP nor under IFRS. For Further Reference: (Study Session 5, Module 13.7, LOS 13.b)", "explhtml": "<p>Goodwill is not amortized under IFRS or U.S. GAAP. The test for impairment is different under IFRS than under U.S. GAAP. Impairment losses cannot be reversed under U.S. GAAP nor under IFRS.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 13.7, LOS 13.b)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 79 through 84 relate to Financial Reporting and Analysis.<\/p><p>Galena Petrovich Case Scenario<\/p><p>Galena Petrovich, CFA, is an analyst in the New York office of TRS Investment Management, Inc. Petrovich is an expert in the industrial electrical equipment sector and is analyzing Fisher Global. Fisher is a global market leader in designing, manufacturing, marketing, and servicing electrical systems and components, including fluid power systems and automotive engine air management systems.<\/p><p>Fisher has generated double-digit growth over the past 10 years, primarily as the result of acquisitions, and has reported positive net income in each year. Fisher reports its financial results using International Financial Reporting Standards (IFRS).<\/p><p>Petrovich is particularly interested in a transaction that occurred several years ago, before the change in accounting standards, in which Fisher used the pooling method to account for a large acquisition of Dartmouth Industries, an industry competitor. She would like to determine the effect of using the purchase method instead of the pooling method on the financial statements of Fisher. Fisher exchanged common stock for all of the outstanding shares of Dartmouth.<\/p><p>Fisher also has a 50% ownership interest in a joint venture with its major distributor, a U.S. company called Hydro Distribution. She determines that Fisher has reported its ownership interest under the equity method, and that the joint venture has been profitable since it was established three years ago. She decides to adjust the financial statements to show how the financial statements would be affected if Fisher had reported its ownership under the acquisition method. Fisher is also considering acquiring 80% to 100% of Brown and Sons Company. Petrovich must consider the effect of such an acquisition on Fisher&#x27;s financial statements.<\/p><p>Petrovich determines from the financial statement footnotes that Fisher had an unrealized gain related to debt securities that are classified as fair value through OCI. Competitor firms classify similar debt securities as fair value through profit or loss.<\/p><p>Finally, Petrovich finds a reference in Fisher&#x27;s footnotes regarding a special purpose entity (SPE). Fisher has reported its investment in the SPE using the equity method, but Petrovich believes that the consolidation method more accurately reflects Fisher&#x27;s true financial position, so she makes the appropriate adjustments to the financial statements.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding any potential goodwill on the acquisition of Brown and Sons being considered by Fisher Global, which of the following statements is most accurate? The goodwill will be reported as an asset and:<\/p><\/div>", "subj": "fsa"}, {"n": 22, "q": "If Fisher Global decides to purchase only 80% of Brown and Sons, under IFRS they will have the option to:", "opts": ["report the acquisition as either a business combination or as an acquisition.", "value the identifiable assets and liabilities of Brown and Sons at their current book values or at fair market value.", "report more or less goodwill depending on the accounting method they choose."], "ans": "C", "expl": "All business combinations (e.g., merger, purchase, or consolidation) are reported under the acquisition method. Identifiable assets and liabilities must be reported at fair value at the time of the acquisition. Under IFRS, Fisher has the option of calculating the goodwill for the acquisition under either the full goodwill or partial goodwill methods. Goodwill is less under the partial goodwill method. For Further Reference: (Study Session 5, Module 13.7, LOS 13.b)", "explhtml": "<p>All business combinations (e.g., merger, purchase, or consolidation) are reported under the acquisition method. Identifiable assets and liabilities must be reported at fair value at the time of the acquisition. Under IFRS, Fisher has the option of calculating the goodwill for the acquisition under either the full goodwill or partial goodwill methods. Goodwill is less under the partial goodwill method.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 13.7, LOS 13.b)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 79 through 84 relate to Financial Reporting and Analysis.<\/p><p>Galena Petrovich Case Scenario<\/p><p>Galena Petrovich, CFA, is an analyst in the New York office of TRS Investment Management, Inc. Petrovich is an expert in the industrial electrical equipment sector and is analyzing Fisher Global. Fisher is a global market leader in designing, manufacturing, marketing, and servicing electrical systems and components, including fluid power systems and automotive engine air management systems.<\/p><p>Fisher has generated double-digit growth over the past 10 years, primarily as the result of acquisitions, and has reported positive net income in each year. Fisher reports its financial results using International Financial Reporting Standards (IFRS).<\/p><p>Petrovich is particularly interested in a transaction that occurred several years ago, before the change in accounting standards, in which Fisher used the pooling method to account for a large acquisition of Dartmouth Industries, an industry competitor. She would like to determine the effect of using the purchase method instead of the pooling method on the financial statements of Fisher. Fisher exchanged common stock for all of the outstanding shares of Dartmouth.<\/p><p>Fisher also has a 50% ownership interest in a joint venture with its major distributor, a U.S. company called Hydro Distribution. She determines that Fisher has reported its ownership interest under the equity method, and that the joint venture has been profitable since it was established three years ago. She decides to adjust the financial statements to show how the financial statements would be affected if Fisher had reported its ownership under the acquisition method. Fisher is also considering acquiring 80% to 100% of Brown and Sons Company. Petrovich must consider the effect of such an acquisition on Fisher&#x27;s financial statements.<\/p><p>Petrovich determines from the financial statement footnotes that Fisher had an unrealized gain related to debt securities that are classified as fair value through OCI. Competitor firms classify similar debt securities as fair value through profit or loss.<\/p><p>Finally, Petrovich finds a reference in Fisher&#x27;s footnotes regarding a special purpose entity (SPE). Fisher has reported its investment in the SPE using the equity method, but Petrovich believes that the consolidation method more accurately reflects Fisher&#x27;s true financial position, so she makes the appropriate adjustments to the financial statements.<\/p><\/div><\/details><div class=\"qtext\"><p>If Fisher Global decides to purchase only 80% of Brown and Sons, under IFRS they will have the option to:<\/p><\/div>", "subj": "fsa"}, {"n": 23, "q": "For comparison purposes, Petrovich decides to reclassify Fisher Global's debt securities as fair value through profit or loss. Ignoring any effect on income taxes, which of the following best describes the effects of the necessary adjustments?", "opts": ["Net income is higher and asset turnover is higher.", "Return on assets is lower and debt-to-equity is lower.", "Return on equity is higher and debt-to-total capital is not affected."], "ans": "C", "expl": "Both FVOCI and FVPL classifications report the security at fair value on the balance sheet, and hence, total assets (and asset turnover) would be unchanged. You are given that the debt securities had an unrealized gain, which, under FVPL classification, would be reported in an income statement, resulting in a higher net income (as opposed to FVOCI classification where the unrealized gain is reported in OCI). Stockholders' equity would be the same under either classification, and hence, debt-to-total capital will be unchanged. Because of higher net income, an FVPL classification would result in a higher ROA and ROE as compared to FVOCI classification. For Further Reference: (Study Session 5, Module 13.1, LOS 13.a)", "explhtml": "<p>Both FVOCI and FVPL classifications report the security at fair value on the balance sheet, and hence, total assets (and asset turnover) would be unchanged. You are given that the debt securities had an unrealized gain, which, under FVPL classification, would be reported in an income statement, resulting in a higher net income (as opposed to FVOCI classification where the unrealized gain is reported in OCI). Stockholders&#x27; equity would be the same under either classification, and hence, debt-to-total capital will be unchanged. Because of higher net income, an FVPL classification would result in a higher ROA and ROE as compared to FVOCI classification.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 13.1, LOS 13.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 79 through 84 relate to Financial Reporting and Analysis.<\/p><p>Galena Petrovich Case Scenario<\/p><p>Galena Petrovich, CFA, is an analyst in the New York office of TRS Investment Management, Inc. Petrovich is an expert in the industrial electrical equipment sector and is analyzing Fisher Global. Fisher is a global market leader in designing, manufacturing, marketing, and servicing electrical systems and components, including fluid power systems and automotive engine air management systems.<\/p><p>Fisher has generated double-digit growth over the past 10 years, primarily as the result of acquisitions, and has reported positive net income in each year. Fisher reports its financial results using International Financial Reporting Standards (IFRS).<\/p><p>Petrovich is particularly interested in a transaction that occurred several years ago, before the change in accounting standards, in which Fisher used the pooling method to account for a large acquisition of Dartmouth Industries, an industry competitor. She would like to determine the effect of using the purchase method instead of the pooling method on the financial statements of Fisher. Fisher exchanged common stock for all of the outstanding shares of Dartmouth.<\/p><p>Fisher also has a 50% ownership interest in a joint venture with its major distributor, a U.S. company called Hydro Distribution. She determines that Fisher has reported its ownership interest under the equity method, and that the joint venture has been profitable since it was established three years ago. She decides to adjust the financial statements to show how the financial statements would be affected if Fisher had reported its ownership under the acquisition method. Fisher is also considering acquiring 80% to 100% of Brown and Sons Company. Petrovich must consider the effect of such an acquisition on Fisher&#x27;s financial statements.<\/p><p>Petrovich determines from the financial statement footnotes that Fisher had an unrealized gain related to debt securities that are classified as fair value through OCI. Competitor firms classify similar debt securities as fair value through profit or loss.<\/p><p>Finally, Petrovich finds a reference in Fisher&#x27;s footnotes regarding a special purpose entity (SPE). Fisher has reported its investment in the SPE using the equity method, but Petrovich believes that the consolidation method more accurately reflects Fisher&#x27;s true financial position, so she makes the appropriate adjustments to the financial statements.<\/p><\/div><\/details><div class=\"qtext\"><p>For comparison purposes, Petrovich decides to reclassify Fisher Global&#x27;s debt securities as fair value through profit or loss. Ignoring any effect on income taxes, which of the following best describes the effects of the necessary adjustments?<\/p><\/div>", "subj": "fsa"}, {"n": 24, "q": "What are the most likely effects on return on assets (ROA) and net profit margin (ignoring any tax effects) of correctly adjusting for Fisher Global's investment in the SPE using the acquisition method? ROA Net profit margin", "opts": ["No change Decrease", "Decrease No change", "Decrease Decrease"], "ans": "C", "expl": "The acquisition method results in higher assets and higher sales, but the same net income. Therefore, both ROA (net income divided by assets) and net profit margin (net income divided by sales) will decrease. For Further Reference: (Study Session 5, Module 13.4, LOS 13.c)", "explhtml": "<p>The acquisition method results in higher assets and higher sales, but the same net income. Therefore, both ROA (net income divided by assets) and net profit margin (net income divided by sales) will decrease.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 13.4, LOS 13.c)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 19–24 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 79 through 84 relate to Financial Reporting and Analysis.<\/p><p>Galena Petrovich Case Scenario<\/p><p>Galena Petrovich, CFA, is an analyst in the New York office of TRS Investment Management, Inc. Petrovich is an expert in the industrial electrical equipment sector and is analyzing Fisher Global. Fisher is a global market leader in designing, manufacturing, marketing, and servicing electrical systems and components, including fluid power systems and automotive engine air management systems.<\/p><p>Fisher has generated double-digit growth over the past 10 years, primarily as the result of acquisitions, and has reported positive net income in each year. Fisher reports its financial results using International Financial Reporting Standards (IFRS).<\/p><p>Petrovich is particularly interested in a transaction that occurred several years ago, before the change in accounting standards, in which Fisher used the pooling method to account for a large acquisition of Dartmouth Industries, an industry competitor. She would like to determine the effect of using the purchase method instead of the pooling method on the financial statements of Fisher. Fisher exchanged common stock for all of the outstanding shares of Dartmouth.<\/p><p>Fisher also has a 50% ownership interest in a joint venture with its major distributor, a U.S. company called Hydro Distribution. She determines that Fisher has reported its ownership interest under the equity method, and that the joint venture has been profitable since it was established three years ago. She decides to adjust the financial statements to show how the financial statements would be affected if Fisher had reported its ownership under the acquisition method. Fisher is also considering acquiring 80% to 100% of Brown and Sons Company. Petrovich must consider the effect of such an acquisition on Fisher&#x27;s financial statements.<\/p><p>Petrovich determines from the financial statement footnotes that Fisher had an unrealized gain related to debt securities that are classified as fair value through OCI. Competitor firms classify similar debt securities as fair value through profit or loss.<\/p><p>Finally, Petrovich finds a reference in Fisher&#x27;s footnotes regarding a special purpose entity (SPE). Fisher has reported its investment in the SPE using the equity method, but Petrovich believes that the consolidation method more accurately reflects Fisher&#x27;s true financial position, so she makes the appropriate adjustments to the financial statements.<\/p><\/div><\/details><div class=\"qtext\"><p>What are the most likely effects on return on assets (ROA) and net profit margin (ignoring any tax effects) of correctly adjusting for Fisher Global&#x27;s investment in the SPE using the acquisition method?<\/p><div class=\"tbl\"><table><tr><td>ROA<\/td><td>Net profit margin<\/td><\/tr><\/table><\/div><\/div>", "subj": "fsa"}, {"n": 25, "q": "The total periodic pension cost for Clear's defined benefit pension scheme in 2015 is closest to:", "opts": ["€405 million.", "€421 million.", "€623 million."], "ans": "C", "expl": "Employer contributions 306 Opening funded status 810 Closing funded status 493 Change in funded status (317) TPPC = contributions − Δ funded status €623 For Further Reference: (Study Session 5, Module 14.3, LOS 14.c)", "explhtml": "<div class=\"tbl\"><table><tr><td>Employer contributions<\/td><td>306<\/td><\/tr><tr><td>Opening funded status<\/td><td>810<\/td><\/tr><tr><td>Closing funded status<\/td><td>493<\/td><\/tr><tr><td>Change in funded status<\/td><td>(317)<\/td><\/tr><tr><td>TPPC = contributions − Δ funded status<\/td><td>€623<\/td><\/tr><\/table><\/div><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 14.3, LOS 14.c)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Questions 85 through 90 relate to Financial Reporting and Analysis.<\/p><p>John Baragutti Case Scenario<\/p><p>John Baragutti, CFA, works in the transaction services arm of HLBB, a large accountancy firm with a substantial advisory business on the east coast of the United States. He is currently advising on a potential M&amp;A transaction between two airlines. Tarpon Airlines, Inc. (Tarpon), which operates out of the east coast of the United States, is the larger of the two companies and its board has entered into discussions with the smaller Clear Air S.A. (Clear). Clear, based in France, would provide Tarpon access to a significant number of landing slots in major European airports.<\/p><p>Baragutti is currently reviewing the income statement of Clear in order to address some concerns raised by Tarpon&#x27;s board. Merger discussions had initially progressed rapidly after an initial review of Clear&#x27;s last five years&#x27; income statements, which revealed an operating profit margin that was in line with that of Tarpon. The board has historically been extremely cautious about acquiring any potential target with a profit margin lower than its own. However, further investigation has revealed concerns regarding the treatment of pension costs in the income statement.<\/p><p>Tarpon runs only a defined contribution pension scheme for its employees and an employee incentive stock option scheme. Clear, however, has a defined benefit scheme that is currently overfunded. Extracts from the pension note included in Clear&#x27;s annual report are shown in Exhibit 1.<\/p><p><b>Exhibit 1: Pension Note (Extracts)<\/b><\/p><p>Present Value of Defined Benefit Fair Value of Plan Assets Obligations<\/p><div class=\"tbl\"><table><tr><td>€ million<\/td><td>€ million<\/td><td><\/td><td><\/td><\/tr><tr><td>As at 1 January<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>As at 1 January 2015<\/td><td>8,110<\/td><td>8,920<\/td><td><\/td><\/tr><tr><td>2015<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Return on plan<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Current service cost<\/td><td>170<\/td><td>145<\/td><td><\/td><\/tr><tr><td>assets<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Employer<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Past service cost<\/td><td>15<\/td><td>306<\/td><td><\/td><\/tr><tr><td>contributions<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Interest cost<\/td><td>365<\/td><td>Benefits paid<\/td><td>(202)<\/td><\/tr><tr><td>Benefits paid<\/td><td>(202)<\/td><td><\/td><td><\/td><\/tr><tr><td>Remeasurement (gains)/loss<\/td><td>218<\/td><td><\/td><td><\/td><\/tr><tr><td>As at 31 December 2015<\/td><td>8,676<\/td><td>As at 31 December<\/td><td>9,169<\/td><\/tr><\/table><\/div><p><b>Notes:<\/b><\/p><p>Pension benefit obligation has been calculated using the average yield on high-quality corporate bonds with similar durations to the benefits in the scheme, currently 4.5%. Due to turbulent economic conditions in the eurozone, return on plan assets was only 1.63%. Remeasurement gains at the start of the year totaled €231 million.<\/p><p>Having never accounted for a defined benefit scheme, in its initial review, the board of Tarpon did not consider the impact of the defined benefit plan on the operating margin. As a result, Baragutti has been asked to address three issues.<\/p><p>First, Clear prepares its financial statements using IFRS whereas Tarpon reports under U.S. GAAP. The board wants to gain an understanding of Clear&#x27;s pension expense for 2015 as computed under U.S. GAAP. Secondly, the disclosure of certain elements of the pension cost has confused the board. Although the notes to the income statement identify that the pension cost has an interest element, this has been included within operating profit.<\/p><p>Finally, the board is concerned about future adjustments that may be required to deal with the amortization of the remeasurement gains that have accumulated in Clear&#x27;s pension scheme. Baragutti intends to perform the following calculations to deal with each issue independently:<\/p><p>Issue 1<\/p><p>Recalculate pension expense included in the income statement under U.S. GAAP. Baragutti has observed that companies reporting pension expense under U.S. GAAP have used an average of 3% for the expected return on plan assets and he intends to apply this rate where applicable. He does not intend to amortize any of this year&#x27;s prior service cost.<\/p><p>Issue 2<\/p><p>Assuming IFRS, recalculate the local currency (€) operating margin excluding any pension scheme interest element. The current income statement before Baragutti&#x27;s adjustments is shown in Exhibit 2.<\/p><p>Issue 3<\/p><p>Baragutti prepares the following note containing two statements to advise the board on the future amortization of actuarial gains and losses:<\/p><p>Statement 1<\/p><p>&quot;Under IFRS, when cumulative remeasurement gains/losses are large enough, they will be amortized through the income statement over the average service life of the employees, reducing net income if net losses are amortized, and increasing net income if net gains are amortized.&quot;<\/p><p>Statement 2<\/p><p>&quot;Under U.S. GAAP, the amortization of net actuarial losses will increase leverage (i.e., debt-to-equity ratio), whereas the amortization of net actuarial gains will decrease leverage.&quot;<\/p><p><b>Exhibit 2: Income Statement (Extracts)<\/b><\/p><p>2015<\/p><p>€ million Revenue<\/p><div class=\"tbl\"><table><tr><td>Passenger<\/td><td>9,321<\/td><\/tr><tr><td>Cargo<\/td><td>456<\/td><\/tr><tr><td>Total<\/td><td>9,777<\/td><\/tr><tr><td>Employee costs<\/td><td>3,654<\/td><\/tr><tr><td>Depreciation, amortization<\/td><td>894<\/td><\/tr><tr><td>Aircraft operating lease costs<\/td><td>156<\/td><\/tr><tr><td>Fuel and oil costs<\/td><td>1,853<\/td><\/tr><tr><td>Engineering and other aircraft costs<\/td><td>542<\/td><\/tr><tr><td>Landing fees<\/td><td>1,458<\/td><\/tr><tr><td>Exchange rate losses<\/td><td>221<\/td><\/tr><tr><td>Ground equipment costs<\/td><td>765<\/td><\/tr><tr><td>Total operating costs<\/td><td>9,543<\/td><\/tr><tr><td>Operating profit<\/td><td>234<\/td><\/tr><tr><td>Fuel derivative losses<\/td><td>32<\/td><\/tr><tr><td>Finance costs<\/td><td>193<\/td><\/tr><tr><td>Finance income<\/td><td>89<\/td><\/tr><tr><td>Profit before tax<\/td><td>98<\/td><\/tr><\/table><\/div><p>Note: Employee costs include the defined benefit pension expense for the period.<\/p><p>Baragutti has also been asked to raise any other points he thinks the board should be aware of surrounding this issue. He intends make the following two observations on cash flow calculations and the impact of Tarpon&#x27;s employee share option scheme.<\/p><p>Cash Flow Calculations<\/p><p>Baragutti noted that the board has used Clear&#x27;s operating cash flow as a basis for its valuation of the entity. He intends to notify the board that whenever it encounters a company with a defined benefit scheme, in his opinion, it would be advisable to adjust CFO to reflect the fact that employer contributions are not the same as the cost of the scheme.<\/p><p>Employee Share Option Scheme<\/p><p>Although Tarpon does not have a defined benefit pension scheme, it does have an equivalent employee compensation expense in the form of an employee share option scheme. Just as there is a cost to Clear of its defined benefit scheme, the cost of Tarpon&#x27;s share option scheme will be charged as an expense to the income statement and hence reduce retained earnings and equity.<\/p><\/div><\/details><div class=\"qtext\"><p>The total periodic pension cost for Clear&#x27;s defined benefit pension scheme in 2015 is closest to:<\/p><\/div>", "subj": "fsa"}, {"n": 26, "q": "In dealing with issue 1 as outlined, Baragutti is likely to calculate a pension expense closest to:", "opts": ["€149 million.", "€267 million.", "€390 million."], "ans": "B", "expl": "Income statement (U.S. GAAP) Service cost 170 (+) Interest cost (4.5%) 365 (−) Expected return on assets (3%) (268) (=) Periodic pension cost in P&L 267 Since beginning actuarial losses were less than 10% of the greater of beginning PBO or beginning plan assets, there would be no amortization. For Further Reference: (Study Session 5, Module 14.3, LOS 14.c)", "explhtml": "<p>Income statement (U.S. GAAP)<\/p><div class=\"tbl\"><table><tr><td>Service cost<\/td><td>170<\/td><td><\/td><\/tr><tr><td>(+) Interest cost<\/td><td>(4.5%)<\/td><td>365<\/td><\/tr><tr><td>(−) Expected return on assets<\/td><td>(3%)<\/td><td>(268)<\/td><\/tr><tr><td>(=) Periodic pension cost in P&amp;L<\/td><td>267<\/td><td><\/td><\/tr><\/table><\/div><p>Since beginning actuarial losses were less than 10% of the greater of beginning PBO or beginning plan assets, there would be no amortization.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 14.3, LOS 14.c)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 85 through 90 relate to Financial Reporting and Analysis.<\/p><p>John Baragutti Case Scenario<\/p><p>John Baragutti, CFA, works in the transaction services arm of HLBB, a large accountancy firm with a substantial advisory business on the east coast of the United States. He is currently advising on a potential M&amp;A transaction between two airlines. Tarpon Airlines, Inc. (Tarpon), which operates out of the east coast of the United States, is the larger of the two companies and its board has entered into discussions with the smaller Clear Air S.A. (Clear). Clear, based in France, would provide Tarpon access to a significant number of landing slots in major European airports.<\/p><p>Baragutti is currently reviewing the income statement of Clear in order to address some concerns raised by Tarpon&#x27;s board. Merger discussions had initially progressed rapidly after an initial review of Clear&#x27;s last five years&#x27; income statements, which revealed an operating profit margin that was in line with that of Tarpon. The board has historically been extremely cautious about acquiring any potential target with a profit margin lower than its own. However, further investigation has revealed concerns regarding the treatment of pension costs in the income statement.<\/p><p>Tarpon runs only a defined contribution pension scheme for its employees and an employee incentive stock option scheme. Clear, however, has a defined benefit scheme that is currently overfunded. Extracts from the pension note included in Clear&#x27;s annual report are shown in Exhibit 1.<\/p><p><b>Exhibit 1: Pension Note (Extracts)<\/b><\/p><p>Present Value of Defined Benefit Fair Value of Plan Assets Obligations<\/p><div class=\"tbl\"><table><tr><td>€ million<\/td><td>€ million<\/td><td><\/td><td><\/td><\/tr><tr><td>As at 1 January<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>As at 1 January 2015<\/td><td>8,110<\/td><td>8,920<\/td><td><\/td><\/tr><tr><td>2015<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Return on plan<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Current service cost<\/td><td>170<\/td><td>145<\/td><td><\/td><\/tr><tr><td>assets<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Employer<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Past service cost<\/td><td>15<\/td><td>306<\/td><td><\/td><\/tr><tr><td>contributions<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Interest cost<\/td><td>365<\/td><td>Benefits paid<\/td><td>(202)<\/td><\/tr><tr><td>Benefits paid<\/td><td>(202)<\/td><td><\/td><td><\/td><\/tr><tr><td>Remeasurement (gains)/loss<\/td><td>218<\/td><td><\/td><td><\/td><\/tr><tr><td>As at 31 December 2015<\/td><td>8,676<\/td><td>As at 31 December<\/td><td>9,169<\/td><\/tr><\/table><\/div><p><b>Notes:<\/b><\/p><p>Pension benefit obligation has been calculated using the average yield on high-quality corporate bonds with similar durations to the benefits in the scheme, currently 4.5%. Due to turbulent economic conditions in the eurozone, return on plan assets was only 1.63%. Remeasurement gains at the start of the year totaled €231 million.<\/p><p>Having never accounted for a defined benefit scheme, in its initial review, the board of Tarpon did not consider the impact of the defined benefit plan on the operating margin. As a result, Baragutti has been asked to address three issues.<\/p><p>First, Clear prepares its financial statements using IFRS whereas Tarpon reports under U.S. GAAP. The board wants to gain an understanding of Clear&#x27;s pension expense for 2015 as computed under U.S. GAAP. Secondly, the disclosure of certain elements of the pension cost has confused the board. Although the notes to the income statement identify that the pension cost has an interest element, this has been included within operating profit.<\/p><p>Finally, the board is concerned about future adjustments that may be required to deal with the amortization of the remeasurement gains that have accumulated in Clear&#x27;s pension scheme. Baragutti intends to perform the following calculations to deal with each issue independently:<\/p><p>Issue 1<\/p><p>Recalculate pension expense included in the income statement under U.S. GAAP. Baragutti has observed that companies reporting pension expense under U.S. GAAP have used an average of 3% for the expected return on plan assets and he intends to apply this rate where applicable. He does not intend to amortize any of this year&#x27;s prior service cost.<\/p><p>Issue 2<\/p><p>Assuming IFRS, recalculate the local currency (€) operating margin excluding any pension scheme interest element. The current income statement before Baragutti&#x27;s adjustments is shown in Exhibit 2.<\/p><p>Issue 3<\/p><p>Baragutti prepares the following note containing two statements to advise the board on the future amortization of actuarial gains and losses:<\/p><p>Statement 1<\/p><p>&quot;Under IFRS, when cumulative remeasurement gains/losses are large enough, they will be amortized through the income statement over the average service life of the employees, reducing net income if net losses are amortized, and increasing net income if net gains are amortized.&quot;<\/p><p>Statement 2<\/p><p>&quot;Under U.S. GAAP, the amortization of net actuarial losses will increase leverage (i.e., debt-to-equity ratio), whereas the amortization of net actuarial gains will decrease leverage.&quot;<\/p><p><b>Exhibit 2: Income Statement (Extracts)<\/b><\/p><p>2015<\/p><p>€ million Revenue<\/p><div class=\"tbl\"><table><tr><td>Passenger<\/td><td>9,321<\/td><\/tr><tr><td>Cargo<\/td><td>456<\/td><\/tr><tr><td>Total<\/td><td>9,777<\/td><\/tr><tr><td>Employee costs<\/td><td>3,654<\/td><\/tr><tr><td>Depreciation, amortization<\/td><td>894<\/td><\/tr><tr><td>Aircraft operating lease costs<\/td><td>156<\/td><\/tr><tr><td>Fuel and oil costs<\/td><td>1,853<\/td><\/tr><tr><td>Engineering and other aircraft costs<\/td><td>542<\/td><\/tr><tr><td>Landing fees<\/td><td>1,458<\/td><\/tr><tr><td>Exchange rate losses<\/td><td>221<\/td><\/tr><tr><td>Ground equipment costs<\/td><td>765<\/td><\/tr><tr><td>Total operating costs<\/td><td>9,543<\/td><\/tr><tr><td>Operating profit<\/td><td>234<\/td><\/tr><tr><td>Fuel derivative losses<\/td><td>32<\/td><\/tr><tr><td>Finance costs<\/td><td>193<\/td><\/tr><tr><td>Finance income<\/td><td>89<\/td><\/tr><tr><td>Profit before tax<\/td><td>98<\/td><\/tr><\/table><\/div><p>Note: Employee costs include the defined benefit pension expense for the period.<\/p><p>Baragutti has also been asked to raise any other points he thinks the board should be aware of surrounding this issue. He intends make the following two observations on cash flow calculations and the impact of Tarpon&#x27;s employee share option scheme.<\/p><p>Cash Flow Calculations<\/p><p>Baragutti noted that the board has used Clear&#x27;s operating cash flow as a basis for its valuation of the entity. He intends to notify the board that whenever it encounters a company with a defined benefit scheme, in his opinion, it would be advisable to adjust CFO to reflect the fact that employer contributions are not the same as the cost of the scheme.<\/p><p>Employee Share Option Scheme<\/p><p>Although Tarpon does not have a defined benefit pension scheme, it does have an equivalent employee compensation expense in the form of an employee share option scheme. Just as there is a cost to Clear of its defined benefit scheme, the cost of Tarpon&#x27;s share option scheme will be charged as an expense to the income statement and hence reduce retained earnings and equity.<\/p><\/div><\/details><div class=\"qtext\"><p>In dealing with issue 1 as outlined, Baragutti is likely to calculate a pension expense closest to:<\/p><\/div>", "subj": "fsa"}, {"n": 27, "q": "Using IFRS and Baragutti's suggested adjustments for issue 2, he is likely to calculate an adjusted operating margin closest to:", "opts": ["2%.", "4%.", "6%."], "ans": "A", "expl": "Under IFRS interest income/expense is calculated by applying the discount rate to the opening funded status. Since the plan is overfunded, Clear is reporting net interest income. Opening funded status: 8920 − 8110 = 810 Net interest income: 810 × 0.045 = 36.45 Operating profit as reported: 234 Less net interest income: (36.45) Adjusted operating profit: 197.55 Adjusted margin: 197.55/9777 = 2.02% For Further Reference: (Study Session 5, Module 14.6,  operating costs<\/td><td>9,543<\/td><\/tr><tr><td>Operating profit<\/td><td>234<\/td><\/tr><tr><td>Fuel derivative losses<\/td><td>32<\/td><\/tr><tr><td>Finance costs<\/td><td>193<\/td><\/tr><tr><td>Finance income<\/td><td>89<\/td><\/tr><tr><td>Profit before tax<\/td><td>98<\/td><\/tr><\/table><\/div><p>Note: Employee costs include the defined benefit pension expense for the period.<\/p><p>Baragutti has also been asked to raise any other points he thinks the board should be aware of surrounding this issue. He intends make the following two observations on cash flow calculations and the impact of Tarpon&#x27;s employee share option scheme.<\/p><p>Cash Flow Calculations<\/p><p>Baragutti noted that the board has used Clear&#x27;s operating cash flow as a basis for its valuation of the entity. He intends to notify the board that whenever it encounters a company with a defined benefit scheme, in his opinion, it would be advisable to adjust CFO to reflect the fact that employer contributions are not the same as the cost of the scheme.<\/p><p>Employee Share Option Scheme<\/p><p>Although Tarpon does not have a defined benefit pension scheme, it does have an equivalent employee compensation expense in the form of an employee share option scheme. Just as there is a cost to Clear of its defined benefit scheme, the cost of Tarpon&#x27;s share option scheme will be charged as an expense to the income statement and hence reduce retained earnings and equity.<\/p><\/div><\/details><div class=\"qtext\"><p>Baragutti is most likely to suggest adjusting the cash flow used by the board as a basis of its valuation by:<\/p><\/div>", "subj": "fsa"}, {"n": 29, "q": "Which of Baragutti's statements on the amortization of actuarial gains and losses in response to issue 3 are most likely correct?", "opts": ["Both statements are correct.", "Only statement two is correct.", "Neither statement is correct."], "ans": "C", "expl": "Under IFRS, Remeasurement gains/losses are never amortized into the income statement, they remain in other comprehensive income. Under U.S. GAAP actuarial gains and losses are amortized using the corridor approach. Amortization removes a gain or loss from OCI and shows it in the income statement. Therefore it has no overall impact on equity. For Further Reference: (Study Session 5, Module 14.3, LOS 14.c)", "explhtml": "<p>Under IFRS, Remeasurement gains/losses are never amortized into the income statement, they remain in other comprehensive income.<\/p><p>Under U.S. GAAP actuarial gains and losses are amortized using the corridor approach. Amortization removes a gain or loss from OCI and shows it in the income statement. Therefore it has no overall impact on equity.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 14.3, LOS 14.c)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 85 through 90 relate to Financial Reporting and Analysis.<\/p><p>John Baragutti Case Scenario<\/p><p>John Baragutti, CFA, works in the transaction services arm of HLBB, a large accountancy firm with a substantial advisory business on the east coast of the United States. He is currently advising on a potential M&amp;A transaction between two airlines. Tarpon Airlines, Inc. (Tarpon), which operates out of the east coast of the United States, is the larger of the two companies and its board has entered into discussions with the smaller Clear Air S.A. (Clear). Clear, based in France, would provide Tarpon access to a significant number of landing slots in major European airports.<\/p><p>Baragutti is currently reviewing the income statement of Clear in order to address some concerns raised by Tarpon&#x27;s board. Merger discussions had initially progressed rapidly after an initial review of Clear&#x27;s last five years&#x27; income statements, which revealed an operating profit margin that was in line with that of Tarpon. The board has historically been extremely cautious about acquiring any potential target with a profit margin lower than its own. However, further investigation has revealed concerns regarding the treatment of pension costs in the income statement.<\/p><p>Tarpon runs only a defined contribution pension scheme for its employees and an employee incentive stock option scheme. Clear, however, has a defined benefit scheme that is currently overfunded. Extracts from the pension note included in Clear&#x27;s annual report are shown in Exhibit 1.<\/p><p><b>Exhibit 1: Pension Note (Extracts)<\/b><\/p><p>Present Value of Defined Benefit Fair Value of Plan Assets Obligations<\/p><div class=\"tbl\"><table><tr><td>€ million<\/td><td>€ million<\/td><td><\/td><td><\/td><\/tr><tr><td>As at 1 January<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>As at 1 January 2015<\/td><td>8,110<\/td><td>8,920<\/td><td><\/td><\/tr><tr><td>2015<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Return on plan<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Current service cost<\/td><td>170<\/td><td>145<\/td><td><\/td><\/tr><tr><td>assets<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Employer<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Past service cost<\/td><td>15<\/td><td>306<\/td><td><\/td><\/tr><tr><td>contributions<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Interest cost<\/td><td>365<\/td><td>Benefits paid<\/td><td>(202)<\/td><\/tr><tr><td>Benefits paid<\/td><td>(202)<\/td><td><\/td><td><\/td><\/tr><tr><td>Remeasurement (gains)/loss<\/td><td>218<\/td><td><\/td><td><\/td><\/tr><tr><td>As at 31 December 2015<\/td><td>8,676<\/td><td>As at 31 December<\/td><td>9,169<\/td><\/tr><\/table><\/div><p><b>Notes:<\/b><\/p><p>Pension benefit obligation has been calculated using the average yield on high-quality corporate bonds with similar durations to the benefits in the scheme, currently 4.5%. Due to turbulent economic conditions in the eurozone, return on plan assets was only 1.63%. Remeasurement gains at the start of the year totaled €231 million.<\/p><p>Having never accounted for a defined benefit scheme, in its initial review, the board of Tarpon did not consider the impact of the defined benefit plan on the operating margin. As a result, Baragutti has been asked to address three issues.<\/p><p>First, Clear prepares its financial statements using IFRS whereas Tarpon reports under U.S. GAAP. The board wants to gain an understanding of Clear&#x27;s pension expense for 2015 as computed under U.S. GAAP. Secondly, the disclosure of certain elements of the pension cost has confused the board. Although the notes to the income statement identify that the pension cost has an interest element, this has been included within operating profit.<\/p><p>Finally, the board is concerned about future adjustments that may be required to deal with the amortization of the remeasurement gains that have accumulated in Clear&#x27;s pension scheme. Baragutti intends to perform the following calculations to deal with each issue independently:<\/p><p>Issue 1<\/p><p>Recalculate pension expense included in the income statement under U.S. GAAP. Baragutti has observed that companies reporting pension expense under U.S. GAAP have used an average of 3% for the expected return on plan assets and he intends to apply this rate where applicable. He does not intend to amortize any of this year&#x27;s prior service cost.<\/p><p>Issue 2<\/p><p>Assuming IFRS, recalculate the local currency (€) operating margin excluding any pension scheme interest element. The current income statement before Baragutti&#x27;s adjustments is shown in Exhibit 2.<\/p><p>Issue 3<\/p><p>Baragutti prepares the following note containing two statements to advise the board on the future amortization of actuarial gains and losses:<\/p><p>Statement 1<\/p><p>&quot;Under IFRS, when cumulative remeasurement gains/losses are large enough, they will be amortized through the income statement over the average service life of the employees, reducing net income if net losses are amortized, and increasing net income if net gains are amortized.&quot;<\/p><p>Statement 2<\/p><p>&quot;Under U.S. GAAP, the amortization of net actuarial losses will increase leverage (i.e., debt-to-equity ratio), whereas the amortization of net actuarial gains will decrease leverage.&quot;<\/p><p><b>Exhibit 2: Income Statement (Extracts)<\/b><\/p><p>2015<\/p><p>€ million Revenue<\/p><div class=\"tbl\"><table><tr><td>Passenger<\/td><td>9,321<\/td><\/tr><tr><td>Cargo<\/td><td>456<\/td><\/tr><tr><td>Total<\/td><td>9,777<\/td><\/tr><tr><td>Employee costs<\/td><td>3,654<\/td><\/tr><tr><td>Depreciation, amortization<\/td><td>894<\/td><\/tr><tr><td>Aircraft operating lease costs<\/td><td>156<\/td><\/tr><tr><td>Fuel and oil costs<\/td><td>1,853<\/td><\/tr><tr><td>Engineering and other aircraft costs<\/td><td>542<\/td><\/tr><tr><td>Landing fees<\/td><td>1,458<\/td><\/tr><tr><td>Exchange rate losses<\/td><td>221<\/td><\/tr><tr><td>Ground equipment costs<\/td><td>765<\/td><\/tr><tr><td>Total operating costs<\/td><td>9,543<\/td><\/tr><tr><td>Operating profit<\/td><td>234<\/td><\/tr><tr><td>Fuel derivative losses<\/td><td>32<\/td><\/tr><tr><td>Finance costs<\/td><td>193<\/td><\/tr><tr><td>Finance income<\/td><td>89<\/td><\/tr><tr><td>Profit before tax<\/td><td>98<\/td><\/tr><\/table><\/div><p>Note: Employee costs include the defined benefit pension expense for the period.<\/p><p>Baragutti has also been asked to raise any other points he thinks the board should be aware of surrounding this issue. He intends make the following two observations on cash flow calculations and the impact of Tarpon&#x27;s employee share option scheme.<\/p><p>Cash Flow Calculations<\/p><p>Baragutti noted that the board has used Clear&#x27;s operating cash flow as a basis for its valuation of the entity. He intends to notify the board that whenever it encounters a company with a defined benefit scheme, in his opinion, it would be advisable to adjust CFO to reflect the fact that employer contributions are not the same as the cost of the scheme.<\/p><p>Employee Share Option Scheme<\/p><p>Although Tarpon does not have a defined benefit pension scheme, it does have an equivalent employee compensation expense in the form of an employee share option scheme. Just as there is a cost to Clear of its defined benefit scheme, the cost of Tarpon&#x27;s share option scheme will be charged as an expense to the income statement and hence reduce retained earnings and equity.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Baragutti&#x27;s statements on the amortization of actuarial gains and losses in response to issue 3 are most likely correct?<\/p><\/div>", "subj": "fsa"}, {"n": 30, "q": "Baragutti's comments regarding Tarpon's employee share option scheme are most likely:", "opts": ["correct.", "incorrect because the cost of issuing shares under an employee stock option scheme will be taken directly to equity via OCI and hence not reduce retained earnings.", "incorrect as the cost of issuing shares under an employee stock option scheme will not reduce equity."], "ans": "C", "expl": "The expense of the employee stock option scheme will be shown as employee compensation expense in the income statement and hence reduce retained earnings. However, there is an offsetting increase in paid-in capital and hence no overall impact on equity. For Further Reference: (Study Session 5, Module 14.7, LOS 14.h)", "explhtml": "<p>The expense of the employee stock option scheme will be shown as employee compensation expense in the income statement and hence reduce retained earnings. However, there is an offsetting increase in paid-in capital and hence no overall impact on equity.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 5, Module 14.7, LOS 14.h)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–30 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 85 through 90 relate to Financial Reporting and Analysis.<\/p><p>John Baragutti Case Scenario<\/p><p>John Baragutti, CFA, works in the transaction services arm of HLBB, a large accountancy firm with a substantial advisory business on the east coast of the United States. He is currently advising on a potential M&amp;A transaction between two airlines. Tarpon Airlines, Inc. (Tarpon), which operates out of the east coast of the United States, is the larger of the two companies and its board has entered into discussions with the smaller Clear Air S.A. (Clear). Clear, based in France, would provide Tarpon access to a significant number of landing slots in major European airports.<\/p><p>Baragutti is currently reviewing the income statement of Clear in order to address some concerns raised by Tarpon&#x27;s board. Merger discussions had initially progressed rapidly after an initial review of Clear&#x27;s last five years&#x27; income statements, which revealed an operating profit margin that was in line with that of Tarpon. The board has historically been extremely cautious about acquiring any potential target with a profit margin lower than its own. However, further investigation has revealed concerns regarding the treatment of pension costs in the income statement.<\/p><p>Tarpon runs only a defined contribution pension scheme for its employees and an employee incentive stock option scheme. Clear, however, has a defined benefit scheme that is currently overfunded. Extracts from the pension note included in Clear&#x27;s annual report are shown in Exhibit 1.<\/p><p><b>Exhibit 1: Pension Note (Extracts)<\/b><\/p><p>Present Value of Defined Benefit Fair Value of Plan Assets Obligations<\/p><div class=\"tbl\"><table><tr><td>€ million<\/td><td>€ million<\/td><td><\/td><td><\/td><\/tr><tr><td>As at 1 January<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>As at 1 January 2015<\/td><td>8,110<\/td><td>8,920<\/td><td><\/td><\/tr><tr><td>2015<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Return on plan<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Current service cost<\/td><td>170<\/td><td>145<\/td><td><\/td><\/tr><tr><td>assets<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Employer<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Past service cost<\/td><td>15<\/td><td>306<\/td><td><\/td><\/tr><tr><td>contributions<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Interest cost<\/td><td>365<\/td><td>Benefits paid<\/td><td>(202)<\/td><\/tr><tr><td>Benefits paid<\/td><td>(202)<\/td><td><\/td><td><\/td><\/tr><tr><td>Remeasurement (gains)/loss<\/td><td>218<\/td><td><\/td><td><\/td><\/tr><tr><td>As at 31 December 2015<\/td><td>8,676<\/td><td>As at 31 December<\/td><td>9,169<\/td><\/tr><\/table><\/div><p><b>Notes:<\/b><\/p><p>Pension benefit obligation has been calculated using the average yield on high-quality corporate bonds with similar durations to the benefits in the scheme, currently 4.5%. Due to turbulent economic conditions in the eurozone, return on plan assets was only 1.63%. Remeasurement gains at the start of the year totaled €231 million.<\/p><p>Having never accounted for a defined benefit scheme, in its initial review, the board of Tarpon did not consider the impact of the defined benefit plan on the operating margin. As a result, Baragutti has been asked to address three issues.<\/p><p>First, Clear prepares its financial statements using IFRS whereas Tarpon reports under U.S. GAAP. The board wants to gain an understanding of Clear&#x27;s pension expense for 2015 as computed under U.S. GAAP. Secondly, the disclosure of certain elements of the pension cost has confused the board. Although the notes to the income statement identify that the pension cost has an interest element, this has been included within operating profit.<\/p><p>Finally, the board is concerned about future adjustments that may be required to deal with the amortization of the remeasurement gains that have accumulated in Clear&#x27;s pension scheme. Baragutti intends to perform the following calculations to deal with each issue independently:<\/p><p>Issue 1<\/p><p>Recalculate pension expense included in the income statement under U.S. GAAP. Baragutti has observed that companies reporting pension expense under U.S. GAAP have used an average of 3% for the expected return on plan assets and he intends to apply this rate where applicable. He does not intend to amortize any of this year&#x27;s prior service cost.<\/p><p>Issue 2<\/p><p>Assuming IFRS, recalculate the local currency (€) operating margin excluding any pension scheme interest element. The current income statement before Baragutti&#x27;s adjustments is shown in Exhibit 2.<\/p><p>Issue 3<\/p><p>Baragutti prepares the following note containing two statements to advise the board on the future amortization of actuarial gains and losses:<\/p><p>Statement 1<\/p><p>&quot;Under IFRS, when cumulative remeasurement gains/losses are large enough, they will be amortized through the income statement over the average service life of the employees, reducing net income if net losses are amortized, and increasing net income if net gains are amortized.&quot;<\/p><p>Statement 2<\/p><p>&quot;Under U.S. GAAP, the amortization of net actuarial losses will increase leverage (i.e., debt-to-equity ratio), whereas the amortization of net actuarial gains will decrease leverage.&quot;<\/p><p><b>Exhibit 2: Income Statement (Extracts)<\/b><\/p><p>2015<\/p><p>€ million Revenue<\/p><div class=\"tbl\"><table><tr><td>Passenger<\/td><td>9,321<\/td><\/tr><tr><td>Cargo<\/td><td>456<\/td><\/tr><tr><td>Total<\/td><td>9,777<\/td><\/tr><tr><td>Employee costs<\/td><td>3,654<\/td><\/tr><tr><td>Depreciation, amortization<\/td><td>894<\/td><\/tr><tr><td>Aircraft operating lease costs<\/td><td>156<\/td><\/tr><tr><td>Fuel and oil costs<\/td><td>1,853<\/td><\/tr><tr><td>Engineering and other aircraft costs<\/td><td>542<\/td><\/tr><tr><td>Landing fees<\/td><td>1,458<\/td><\/tr><tr><td>Exchange rate losses<\/td><td>221<\/td><\/tr><tr><td>Ground equipment costs<\/td><td>765<\/td><\/tr><tr><td>Total operating costs<\/td><td>9,543<\/td><\/tr><tr><td>Operating profit<\/td><td>234<\/td><\/tr><tr><td>Fuel derivative losses<\/td><td>32<\/td><\/tr><tr><td>Finance costs<\/td><td>193<\/td><\/tr><tr><td>Finance income<\/td><td>89<\/td><\/tr><tr><td>Profit before tax<\/td><td>98<\/td><\/tr><\/table><\/div><p>Note: Employee costs include the defined benefit pension expense for the period.<\/p><p>Baragutti has also been asked to raise any other points he thinks the board should be aware of surrounding this issue. He intends make the following two observations on cash flow calculations and the impact of Tarpon&#x27;s employee share option scheme.<\/p><p>Cash Flow Calculations<\/p><p>Baragutti noted that the board has used Clear&#x27;s operating cash flow as a basis for its valuation of the entity. He intends to notify the board that whenever it encounters a company with a defined benefit scheme, in his opinion, it would be advisable to adjust CFO to reflect the fact that employer contributions are not the same as the cost of the scheme.<\/p><p>Employee Share Option Scheme<\/p><p>Although Tarpon does not have a defined benefit pension scheme, it does have an equivalent employee compensation expense in the form of an employee share option scheme. Just as there is a cost to Clear of its defined benefit scheme, the cost of Tarpon&#x27;s share option scheme will be charged as an expense to the income statement and hence reduce retained earnings and equity.<\/p><\/div><\/details><div class=\"qtext\"><p>Baragutti&#x27;s comments regarding Tarpon&#x27;s employee share option scheme are most likely:<\/p><\/div>", "subj": "fsa"}, {"n": 31, "q": "Which of the following choices is closest to the Year 4 total cash flow for the robotics project in Exhibit 1?", "opts": ["$292,400.", "$345,400.", "$367,400."], "ans": "C", "expl": "initial investment outlay = purchase price + increase in net working capital + shipping and installation costs = $700,000 + ($50,000 − $20,000) + $100,000 = $830,000 terminal year after-tax non-operating cash flow (TNOCF) = Sal + NWCInv − T(Sal − B ) T T T = 75,000 + 30,000 − 0.4(75,000 − 0) = 75,000 after-tax operating cash flow (Year 4) = (S − C)(1 − T) + DT = ($750,000 − $225,000 − $75,000)(1 − 0.4) + (0.4)($56,000) = $292,400 The book value at the end of Year 4 is $0 because total depreciation over the four years was $800,000. total CF (Year 4) = $292,400 + $75,000 = $367,400 For Further Reference: (Study Session 7, Module 19.1, LOS 19.a)", "explhtml": "<p>initial investment outlay<\/p><p>= purchase price + increase in net working capital + shipping and installation costs<\/p><p>= $700,000 + ($50,000 − $20,000) + $100,000 = $830,000<\/p><p>terminal year after-tax non-operating cash flow (TNOCF)<\/p><p>= Sal  + NWCInv − T(Sal  − B )<\/p><div class=\"tbl\"><table><tr><td>T<\/td><td>T<\/td><td>T<\/td><\/tr><\/table><\/div><p>= 75,000 + 30,000 − 0.4(75,000 − 0)<\/p><p>= 75,000<\/p><p>after-tax operating cash flow (Year 4)<\/p><p>= (S − C)(1 − T) + DT<\/p><p>= ($750,000 − $225,000 − $75,000)(1 − 0.4) + (0.4)($56,000) = $292,400<\/p><p>The book value at the end of Year 4 is $0 because total depreciation over the four years was $800,000.<\/p><p>total CF (Year 4) = $292,400 + $75,000 = $367,400<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 7, Module 19.1, LOS 19.a)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Corporate Issuers<\/summary><div class=\"vig-body\"><p>Questions 91 through 96 relate to Corporate Finance.<\/p><p>Cummings Enterprises, Inc., Case Scenario<\/p><p>Cummings Enterprises, Inc. (CEI), is a U.S. conglomerate that operates in a variety of markets. CEI&#x27;s marginal tax rate is 40%. One of CEI&#x27;s divisions manufactures small fiberglass products, such as bird baths and outdoor storage lockers. CEI is currently considering the expansion of its fiberglass product line to include booms and buckets for aerial lift trucks (often called cherry pickers), which are used for applications such as high voltage power line maintenance. The addition of this new product line is expected to increase CEI&#x27;s sales by $750,000 per year. Cal Holbrook, CEI&#x27;s manager of fiberglass operations, is deciding whether to purchase a robotic system to produce cherry picker booms and buckets. The price of the robotic system will be $700,000, plus an additional $100,000 for shipping, site preparation, and installation. The new equipment will require a $50,000 increase in inventory and a $20,000 increase in accounts payable. The company uses MACRS to calculate depreciation for tax purposes and the straight-line method for financial reporting. The project has an expected life of four years, at which time the robot is expected to be sold for $75,000. The project will be funded with the debt/equity mix reflected by the company&#x27;s current capital structure. CEI&#x27;s pretax cost of new debt is 7%. Assume a WACC of 8%. Some of the relevant end-of-year cash flows for the robotic project are presented in Exhibit 1.<\/p><p><b>Exhibit 1: Relevant Cash Flows for Robotics Project<\/b><\/p><div class=\"tbl\"><table><tr><td>Year 1<\/td><td>Year 2<\/td><td>Year 3<\/td><td>Year 4<\/td><td><\/td><\/tr><tr><td>Sales<\/td><td>$750,000 $750,000 $750,000 $750,000<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Variable costs<\/td><td>$225,000 $225,000 $225,000 $225,000<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Fixed expense<\/td><td>$75,000<\/td><td>$75,000<\/td><td>$75,000<\/td><td>$75,000<\/td><\/tr><tr><td>Depreciation<\/td><td>$264,000 $360,000 $120,000<\/td><td>$56,000<\/td><td><\/td><td><\/td><\/tr><tr><td>Earnings before tax (EBT) $186,000<\/td><td>$90,000 $330,000 $394,000<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Total after-tax cash flow<\/td><td>$375,600 $414,000 $318,000<\/td><td>?<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Holbrook calculates the NPV of the robotic project and presents his findings to his supervisor, Geoffrey Mans. After reviewing the report, Mans makes the following recommendations:<\/p><p>1. &quot;You forgot to include the $100,000 we have spent so far on consultants and project engineers and who knows what else to evaluate the project&#x27;s feasibility. Rerun the numbers including that amount and get the revised calculations to me this afternoon.&quot; 2. &quot;Rerun the analysis assuming straight-line depreciation for tax purposes. The NPV will be higher, and we&#x27;ll be more likely to get the project funded.&quot;<\/p><p>Cummings has two other projects under consideration that would affect the production of storage lockers. Project 1 relates to changing the production process, and Project 2 relates to expanding the distribution facility. Holbrook estimates the NPV of the expected cash flows for Project 1 at negative $7 million. An additional investment of $3 million would allow management to more rapidly adjust to the demand for a certain type of locker. The value of this flexibility is estimated at $9 million. He estimates that the NPV of the expected cash flows for Project 2 at $3 million. An expansion option would require an additional investment of $2 million. At this time, Cummings does not have any capital rationing restrictions.<\/p><p>Holbrook emails the lead analyst for the budgeting group and indicates that he cannot make a decision on Project 2 without knowing the value the expansion option will provide.<\/p><p>Holbrook calls a capital budgeting meeting with CEI&#x27;s production and quality control manager. Holbrook opens the meeting by stating: &quot;I think we should accept this project based solely on the fact that it provides great operating margins. Nevertheless, I think we should conduct net present value (NPV) analysis to confirm my opinion.&quot; Holbrook then receives the following comments:<\/p><div class=\"tbl\"><table><tr><td>Comment 1:<\/td><td>It is important that interest is included in the cash flows used with NPV analysis because interest<\/td><\/tr><tr><td>is a real and very significant expense.<\/td><td><\/td><\/tr><tr><td>Comment 2:<\/td><td>If applied correctly, the NPV of this project will be higher if we discount economic profits instead<\/td><\/tr><tr><td>of net after-tax operating cash flows in our analysis. I suggest we calculate economic profit as<\/td><td><\/td><\/tr><tr><td>net operating profit after tax minus the dollar cost of capital.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following choices is closest to the Year 4 total cash flow for the robotics project in Exhibit 1?<\/p><\/div>", "subj": "corporate"}, {"n": 32, "q": "Are Mans's recommendations regarding the robotic project correct or incorrect?", "opts": ["Both recommendations are correct.", "Only one of the recommendations is correct.", "Both recommendations are incorrect."], "ans": "C", "expl": "Both recommendations are incorrect. The $100,000 is a sunk cost and is thus not a relevant cash flow. Using straight-line depreciation will reduce the present value of the depreciation tax shield and reduce the NPV. For Further Reference: (Study Session 7, Module 19.1, LOS 19.a)", "explhtml": "<p>Both recommendations are incorrect. The $100,000 is a sunk cost and is thus not a relevant cash flow. Using straight-line depreciation will reduce the present value of the depreciation tax shield and reduce the NPV.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 7, Module 19.1, LOS 19.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 91 through 96 relate to Corporate Finance.<\/p><p>Cummings Enterprises, Inc., Case Scenario<\/p><p>Cummings Enterprises, Inc. (CEI), is a U.S. conglomerate that operates in a variety of markets. CEI&#x27;s marginal tax rate is 40%. One of CEI&#x27;s divisions manufactures small fiberglass products, such as bird baths and outdoor storage lockers. CEI is currently considering the expansion of its fiberglass product line to include booms and buckets for aerial lift trucks (often called cherry pickers), which are used for applications such as high voltage power line maintenance. The addition of this new product line is expected to increase CEI&#x27;s sales by $750,000 per year. Cal Holbrook, CEI&#x27;s manager of fiberglass operations, is deciding whether to purchase a robotic system to produce cherry picker booms and buckets. The price of the robotic system will be $700,000, plus an additional $100,000 for shipping, site preparation, and installation. The new equipment will require a $50,000 increase in inventory and a $20,000 increase in accounts payable. The company uses MACRS to calculate depreciation for tax purposes and the straight-line method for financial reporting. The project has an expected life of four years, at which time the robot is expected to be sold for $75,000. The project will be funded with the debt/equity mix reflected by the company&#x27;s current capital structure. CEI&#x27;s pretax cost of new debt is 7%. Assume a WACC of 8%. Some of the relevant end-of-year cash flows for the robotic project are presented in Exhibit 1.<\/p><p><b>Exhibit 1: Relevant Cash Flows for Robotics Project<\/b><\/p><div class=\"tbl\"><table><tr><td>Year 1<\/td><td>Year 2<\/td><td>Year 3<\/td><td>Year 4<\/td><td><\/td><\/tr><tr><td>Sales<\/td><td>$750,000 $750,000 $750,000 $750,000<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Variable costs<\/td><td>$225,000 $225,000 $225,000 $225,000<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Fixed expense<\/td><td>$75,000<\/td><td>$75,000<\/td><td>$75,000<\/td><td> d quality control manager. Holbrook opens the meeting by stating: &quot;I think we should accept this project based solely on the fact that it provides great operating margins. Nevertheless, I think we should conduct net present value (NPV) analysis to confirm my opinion.&quot; Holbrook then receives the following comments:<\/p><div class=\"tbl\"><table><tr><td>Comment 1:<\/td><td>It is important that interest is included in the cash flows used with NPV analysis because interest<\/td><\/tr><tr><td>is a real and very significant expense.<\/td><td><\/td><\/tr><tr><td>Comment 2:<\/td><td>If applied correctly, the NPV of this project will be higher if we discount economic profits instead<\/td><\/tr><tr><td>of net after-tax operating cash flows in our analysis. I suggest we calculate economic profit as<\/td><td><\/td><\/tr><tr><td>net operating profit after tax minus the dollar cost of capital.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Are Mans&#x27;s recommendations regarding the robotic project correct or incorrect?<\/p><\/div>", "subj": "corporate"}, {"n": 33, "q": "For this question only, assume that the investment in net working capital of $30,000 at the project inception is an inflow and that the amount nets to zero with the outflow that will occur at the end of the project. However, Holbrook does not include a cash flow for net working capital at the beginning or the end of the project. Assuming he correctly analyzes all the other components of the project, has Holbrook correctly estimated the project's net present value?", "opts": ["Yes.", "No, he underestimated the project’s NPV by approximately $7,950.", "No, he underestimated the project’s NPV by approximately $2,222."], "ans": "B", "expl": "By ignoring the initial $30,000 cash inflow (recall that you are asked to assume it is an inflow), he has underestimated project NPV by $30,000. By ignoring the terminal cash outflow of $30,000, he has overestimated the project NPV by T
