on the construction of an ARCH model correct?<\/p><\/div>", "subj": "quant"}, {"n": 10, "q": "Regarding Smith's emerging market regression, should lag 2 and lag 4 terms be included in the regression?", "opts": ["Neither lag should be included.", "Only lag 2 should be included.", "Only lag 4 should be included."], "ans": "A", "expl": "Neither the lag 2 term nor the lag 4 term should be included. To determine the significance of the autocorrelation of the residuals, we need the standard error, which is calculated as one over the square root of the number of observations. There are 36 quarters of inflation data. One quarter is lost because we have a lag 1 term, so there are 35 observations in the regression. Therefore, the standard error is The t-statistics are the autocorrelations divided by the standard error which results in: Lag Autocorrelation Standard Error t-Statistic 1 0.0829 0.1690 0.49 2 0.1293 0.1690 0.76 3 0.0227 0.1690 0.13 4 0.1882 0.1690 1.11 The critical t-value is 2.03 for a two-tail test, so none of the t-statistics indicate that the autocorrelations are significantly different from zero. Therefore, we do not need to include additional lag terms. For Further Reference: (Study Session 2, Module 6.2, LOS 6.d)", "explhtml": "<p>Neither the lag 2 term nor the lag 4 term should be included. To determine the significance of the autocorrelation of the residuals, we need the standard error, which is calculated as one over the square root of the number of observations. There are 36 quarters of inflation data. One quarter is lost because we have a lag 1 term, so there are 35 observations in<\/p><p>the regression. Therefore, the standard error is <\/p><p>The t-statistics are the autocorrelations divided by the standard error which results in:<\/p><p>Lag Autocorrelation Standard Error t-Statistic<\/p><div class=\"tbl\"><table><tr><td>1<\/td><td>0.0829<\/td><td>0.1690<\/td><td>0.49<\/td><\/tr><tr><td>2<\/td><td>0.1293<\/td><td>0.1690<\/td><td>0.76<\/td><\/tr><tr><td>3<\/td><td>0.0227<\/td><td>0.1690<\/td><td>0.13<\/td><\/tr><tr><td>4<\/td><td>0.1882<\/td><td>0.1690<\/td><td>1.11<\/td><\/tr><\/table><\/div><p>The critical t-value is 2.03 for a two-tail test, so none of the t-statistics indicate that the autocorrelations are significantly different from zero. Therefore, we do not need to include additional lag terms.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 2, Module 6.2, LOS 6.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 67 through 72 relate to Quantitative Methods.<\/p><p>Madison Consultants Case Scenario<\/p><p>Ernie Smith and Jamal Sims are analysts with the firm of Madison Consultants. Madison provides statistical modeling and advice to portfolio managers throughout the United States and Canada.<\/p><p>In an effort to estimate future cash flows and value the Canadian stock market, Smith has been examining the country&#x27;s aggregate retail sales. He runs two autoregressive regression models in an attempt to determine whether there are any patterns in the data, utilizing nine years of unadjusted monthly retail sales data. One model uses a lag 1 variable and the other adds a lag 12 variable. The results of both regressions are shown in Exhibit 1 and Exhibit 2.<\/p><p><b>Exhibit 1: Canadian Autoregressive Model With Lag 1<\/b><\/p><div class=\"tbl\"><table><tr><td>Multiple R<\/td><td>0.91<\/td><\/tr><tr><td>R-square<\/td><td>0.83<\/td><\/tr><tr><td>Adjusted R-square<\/td><td>0.83<\/td><\/tr><tr><td>Standard error<\/td><td>17,252.76<\/td><\/tr><tr><td>Observations<\/td><td>108.00<\/td><\/tr><\/table><\/div><p>ANOVA<\/p><div class=\"tbl\"><table><tr><td>df<\/td><td>SS<\/td><td>MS<\/td><td>F<\/td><td>Significance F<\/td><\/tr><tr><td>Regression<\/td><td>1.00 150,813,197,793 150,813,197,793 506.67<\/td><td>0.00<\/td><td><\/td><td><\/td><\/tr><tr><td>Residual<\/td><td>106.00<\/td><td>31,551,711,544<\/td><td>297,657,656<\/td><td><\/td><\/tr><tr><td>Total<\/td><td>107.00 182,364,909,338<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Coefficients Standard Error T-stat P-value<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Intercept<\/td><td>21,750.16<\/td><td>10,379.77<\/td><td>2.10<\/td><td>0.04<\/td><\/tr><tr><td>Lag 1<\/td><td>0.92<\/td><td>0.04<\/td><td>22.51<\/td><td>0.00<\/td><\/tr><\/table><\/div><p><b>Exhibit 2: Canadian Autoregressive Model With Lag 1 and Lag 12<\/b><\/p><p>Regression Statistics for 2nd Regression<\/p><div class=\"tbl\"><table><tr><td>Multiple R<\/td><td>0.96<\/td><\/tr><tr><td>R-square<\/td><td>0.93<\/td><\/tr><tr><td>Adjusted R-square<\/td><td>0.92<\/td><\/tr><tr><td>Standard error<\/td><td>11,336.27<\/td><\/tr><tr><td>Observations<\/td><td>108.00<\/td><\/tr><\/table><\/div><p>ANOVA<\/p><p>Significance F<\/p><div class=\"tbl\"><table><tr><td>df<\/td><td>SS<\/td><td>MS<\/td><td>F<\/td><td><\/td><\/tr><tr><td>Regression<\/td><td>2.00 168,871,246,751 84,435,623,375 657.03<\/td><td>&lt;0.01<\/td><td><\/td><td><\/td><\/tr><tr><td>Residual<\/td><td>105.00<\/td><td>13,493,662,586<\/td><td>128,511,072<\/td><td><\/td><\/tr><tr><td>Total<\/td><td>107.00 182,364,909,338<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Coefficients Standard Error T-stat P-value<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Intercept<\/td><td>–24,861.28<\/td><td>7,872.56<\/td><td>–3.16<\/td><td>&lt;0.01<\/td><\/tr><tr><td>Lag 1<\/td><td>0.30<\/td><td>0.06<\/td><td>5.22<\/td><td>&lt;0.01<\/td><\/tr><tr><td>Lag 12<\/td><td>0.84<\/td><td>0.07<\/td><td>11.85<\/td><td>&lt;0.01<\/td><\/tr><\/table><\/div><p>Sims has been assigned the task of valuing the U.S. stock market and uses data similar to the data that Smith uses for Canada. He decides, however, that the data should be transformed. He takes the natural log of the data and uses it in the following model:<\/p><p>∆ln sales  = b  + b  ∆ln sales<\/p><div class=\"tbl\"><table><tr><td>t<\/td><td>0<\/td><td>1<\/td><td>t − 1<\/td><\/tr><\/table><\/div><p>Parameter estimates for the autoregressive model and the actual data for the two most recent months are shown in Exhibit 3.<\/p><p><b>Exhibit 3: U.S. Autoregressive Model<\/b><\/p><div class=\"tbl\"><table><tr><td>Intercept<\/td><td>0.052<\/td><\/tr><tr><td>Lag 1 coefficient<\/td><td>0.684<\/td><\/tr><tr><td>Actual sales one month ago (–1)<\/td><td>6,270<\/td><\/tr><\/table><\/div><p>Actual sales two months ago (–2) 6,184<\/p><p>Smith and Sims are concerned that the data for Canadian retail sales may be more appropriately modeled with an ARCH process. Smith states, that in order to find out, he would take the residuals from the original autoregressive model for Canadian retail sales and then square them.<\/p><p>Sims states that these residuals would then be regressed against the Canadian retail sales data using the following equation: e  = b  + b X , where e represents the residual terms from the original regression and X represents the<\/p><div class=\"tbl\"><table><tr><td>t<\/td><td>0<\/td><td>1<\/td><td>t<\/td><\/tr><\/table><\/div><p>Canadian retail sales data. If b  is statistically different from zero, then the regression model contains an ARCH process. 1<\/p><p>Smith also examines the quarterly inflation data for an emerging market over the past nine years. He models the data using an autoregressive model with a lag 1 independent variable, which he finds is statistically different from zero. He wonders whether he should also include lag 2 and lag 4 terms, given the magnitude of the autocorrelations of the residuals shown in Exhibit 4, assuming a 5% significance level. The critical t-values, assuming a 5% significance level and 35 degrees of freedom, are 2.03 for a two-tail test and 1.69 for a one-tail test.<\/p><p><b>Exhibit 4: Emerging Market Autoregressive Model<\/b><\/p><p>Lag Autocorrelation<\/p><div class=\"tbl\"><table><tr><td>1<\/td><td>0.0829<\/td><\/tr><tr><td>2<\/td><td>0.1293<\/td><\/tr><tr><td>3<\/td><td>0.0227<\/td><\/tr><tr><td>4<\/td><td>0.1882<\/td><\/tr><\/table><\/div><p>Sims is investigating the performance of 5-year European and British bonds based on the actions of the U.S. Federal Reserve. He uses the U.S. Federal Funds rate. The two regressions he uses are:<\/p><div class=\"tbl\"><table><tr><td>BY<\/td><td> = b  + b FF<\/td><td><\/td><td><\/td><\/tr><tr><td>E,t<\/td><td>0<\/td><td>1<\/td><td>US,t<\/td><\/tr><tr><td>BY<\/td><td> = b  + b FF<\/td><td><\/td><td><\/td><\/tr><tr><td>B,t<\/td><td>0<\/td><td>1<\/td><td>US,t<\/td><\/tr><tr><td>where: FF is the Federal Funds rate in the United States (US), and BY is the bond yield in the European Union<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>(E) and Great Britain (B).<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Before he runs this regression, he investigates the characteristics of the dependent and independent variables. He finds that the Federal Funds rate in the United States and the bond yield in Great Britain have a unit root but that the bond yield in the European Union does not. Furthermore, the Federal Funds rate in the United States and the bond yield in Great Britain are cointegrated, but the Federal Funds rate in the United States and the bond yield in the European Union are not.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Smith&#x27;s emerging market regression, should lag 2 and lag 4 terms be included in the regression?<\/p><\/div>", "subj": "quant"}, {"n": 11, "q": "Will Sims's regressions of European and British bond yields on the U.S. Federal Funds rate produce valid results?", "opts": ["Neither Regression is valid.", "Only Regression 1 is valid.", "Only Regression 2 is valid."], "ans": "C", "expl": "In the first regression, the Federal Funds rate in the United States has a unit root, but the bond yield in the European Union does not. So the former data series is not covariance stationary, but the latter is. In this case, the regression results will not be valid. In the second regression, both the Federal Funds rate in the United States and the bond yield in Great Britain have a unit root. So both data series are not covariance stationary. However, because they are cointegrated, the regression results will be valid. To sum up the possibilities you may face on exam day: If neither data series has a unit root, the regression results are valid. If only one data series has a unit root, the regression results are invalid. If both data series have a unit root and they are cointegrated, the regression results are valid. If both data series have a unit root and they are not cointegrated, the regression results are not valid. For Further Reference: (Study Session 2, Module 6.5, LOS 6.k, 6.n)", "explhtml": "<p>In the first regression, the Federal Funds rate in the United States has a unit root, but the bond yield in the European Union does not. So the former data series is not covariance stationary, but the latter is. In this case, the regression results will not be valid.<\/p><p>In the second regression, both the Federal Funds rate in the United States and the bond yield in Great Britain have a unit root. So both data series are not covariance stationary. However, because they are cointegrated, the regression results will be valid.<\/p><p>To sum up the possibilities you may face on exam day:<\/p><p>If neither data series has a unit root, the regression results are valid. If only one data series has a unit root, the regression results are invalid. If both data series have a unit root and they are cointegrated, the regression results are valid. If both data series have a unit root and they are not cointegrated, the regression results are not valid.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 2, Module 6.5, LOS 6.k, 6.n)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitati <\/b><\/p><p>Regression Statistics for 2nd Regression<\/p><div class=\"tbl\"><table><tr><td>Multiple R<\/td><td>0.96<\/td><\/tr><tr><td>R-square<\/td><td>0.93<\/td><\/tr><tr><td>Adjusted R-square<\/td><td>0.92<\/td><\/tr><tr><td>Standard error<\/td><td>11,336.27<\/td><\/tr><tr><td>Observations<\/td><td>108.00<\/td><\/tr><\/table><\/div><p>ANOVA<\/p><p>Significance F<\/p><div class=\"tbl\"><table><tr><td>df<\/td><td>SS<\/td><td>MS<\/td><td>F<\/td><td><\/td><\/tr><tr><td>Regression<\/td><td>2.00 168,871,246,751 84,435,623,375 657.03<\/td><td>&lt;0.01<\/td><td><\/td><td><\/td><\/tr><tr><td>Residual<\/td><td>105.00<\/td><td>13,493,662,586<\/td><td>128,511,072<\/td><td><\/td><\/tr><tr><td>Total<\/td><td>107.00 182,364,909,338<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Coefficients Standard Error T-stat P-value<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Intercept<\/td><td>–24,861.28<\/td><td>7,872.56<\/td><td>–3.16<\/td><td>&lt;0.01<\/td><\/tr><tr><td>Lag 1<\/td><td>0.30<\/td><td>0.06<\/td><td>5.22<\/td><td>&lt;0.01<\/td><\/tr><tr><td>Lag 12<\/td><td>0.84<\/td><td>0.07<\/td><td>11.85<\/td><td>&lt;0.01<\/td><\/tr><\/table><\/div><p>Sims has been assigned the task of valuing the U.S. stock market and uses data similar to the data that Smith uses for Canada. He decides, however, that the data should be transformed. He takes the natural log of the data and uses it in the following model:<\/p><p>∆ln sales  = b  + b  ∆ln sales<\/p><div class=\"tbl\"><table><tr><td>t<\/td><td>0<\/td><td>1<\/td><td>t − 1<\/td><\/tr><\/table><\/div><p>Parameter estimates for the autoregressive model and the actual data for the two most recent months are shown in Exhibit 3.<\/p><p><b>Exhibit 3: U.S. Autoregressive Model<\/b><\/p><div class=\"tbl\"><table><tr><td>Intercept<\/td><td>0.052<\/td><\/tr><tr><td>Lag 1 coefficient<\/td><td>0.684<\/td><\/tr><tr><td>Actual sales one month ago (–1)<\/td><td>6,270<\/td><\/tr><\/table><\/div><p>Actual sales two months ago (–2) 6,184<\/p><p>Smith and Sims are concerned that the data for Canadian retail sales may be more appropriately modeled with an ARCH process. Smith states, that in order to find out, he would take the residuals from the original autoregressive model for Canadian retail sales and then square them.<\/p><p>Sims states that these residuals would then be regressed against the Canadian retail sales data using the following equation: e  = b  + b X , where e represents the residual terms from the original regression and X represents the<\/p><div class=\"tbl\"><table><tr><td>t<\/td><td>0<\/td><td>1<\/td><td>t<\/td><\/tr><\/table><\/div><p>Canadian retail sales data. If b  is statistically different from zero, then the regression model contains an ARCH process. 1<\/p><p>Smith also examines the quarterly inflation data for an emerging market over the past nine years. He models the data using an autoregressive model with a lag 1 independent variable, which he finds is statistically different from zero. He wonders whether he should also include lag 2 and lag 4 terms, given the magnitude of the autocorrelations of the residuals shown in Exhibit 4, assuming a 5% significance level. The critical t-values, assuming a 5% significance level and 35 degrees of freedom, are 2.03 for a two-tail test and 1.69 for a one-tail test.<\/p><p><b>Exhibit 4: Emerging Market Autoregressive Model<\/b><\/p><p>Lag Autocorrelation<\/p><div class=\"tbl\"><table><tr><td>1<\/td><td>0.0829<\/td><\/tr><tr><td>2<\/td><td>0.1293<\/td><\/tr><tr><td>3<\/td><td>0.0227<\/td><\/tr><tr><td>4<\/td><td>0.1882<\/td><\/tr><\/table><\/div><p>Sims is investigating the performance of 5-year European and British bonds based on the actions of the U.S. Federal Reserve. He uses the U.S. Federal Funds rate. The two regressions he uses are:<\/p><div class=\"tbl\"><table><tr><td>BY<\/td><td> = b  + b FF<\/td><td><\/td><td><\/td><\/tr><tr><td>E,t<\/td><td>0<\/td><td>1<\/td><td>US,t<\/td><\/tr><tr><td>BY<\/td><td> = b  + b FF<\/td><td><\/td><td><\/td><\/tr><tr><td>B,t<\/td><td>0<\/td><td>1<\/td><td>US,t<\/td><\/tr><tr><td>where: FF is the Federal Funds rate in the United States (US), and BY is the bond yield in the European Union<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>(E) and Great Britain (B).<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Before he runs this regression, he investigates the characteristics of the dependent and independent variables. He finds that the Federal Funds rate in the United States and the bond yield in Great Britain have a unit root but that the bond yield in the European Union does not. Furthermore, the Federal Funds rate in the United States and the bond yield in Great Britain are cointegrated, but the Federal Funds rate in the United States and the bond yield in the European Union are not.<\/p><\/div><\/details><div class=\"qtext\"><p>Will Sims&#x27;s regressions of European and British bond yields on the U.S. Federal Funds rate produce valid results?<\/p><\/div>", "subj": "quant"}, {"n": 12, "q": "Which of the following is the appropriate test for cointegration?", "opts": ["Breusch-Pagan.", "Durbin-Watson.", "Engle-Granger."], "ans": "C", "expl": "To test whether two variables are cointegrated, we regress one data series on the other and examine the residuals for a unit root using the Dickey-Fuller/Engle-Granger test. If we reject the null hypothesis, the error terms of the two data series are covariance stationary and cointegrated. The regression results will be valid. For Further Reference: (Study Session 2, Module 6.5, LOS 6.n)", "explhtml": "<p>To test whether two variables are cointegrated, we regress one data series on the other and examine the residuals for a unit root using the Dickey-Fuller/Engle-Granger test. If we reject the null hypothesis, the error terms of the two data series are covariance stationary and cointegrated. The regression results will be valid.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 2, Module 6.5, LOS 6.n)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 67 through 72 relate to Quantitative Methods.<\/p><p>Madison Consultants Case Scenario<\/p><p>Ernie Smith and Jamal Sims are analysts with the firm of Madison Consultants. Madison provides statistical modeling and advice to portfolio managers throughout the United States and Canada.<\/p><p>In an effort to estimate future cash flows and value the Canadian stock market, Smith has been examining the country&#x27;s aggregate retail sales. He runs two autoregressive regression models in an attempt to determine whether there are any patterns in the data, utilizing nine years of unadjusted monthly retail sales data. One model uses a lag 1 variable and the other adds a lag 12 variable. The results of both regressions are shown in Exhibit 1 and Exhibit 2.<\/p><p><b>Exhibit 1: Canadian Autoregressive Model With Lag 1<\/b><\/p><div class=\"tbl\"><table><tr><td>Multiple R<\/td><td>0.91<\/td><\/tr><tr><td>R-square<\/td><td>0.83<\/td><\/tr><tr><td>Adjusted R-square<\/td><td>0.83<\/td><\/tr><tr><td>Standard error<\/td><td>17,252.76<\/td><\/tr><tr><td>Observations<\/td><td>108.00<\/td><\/tr><\/table><\/div><p>ANOVA<\/p><div class=\"tbl\"><table><tr><td>df<\/td><td>SS<\/td><td>MS<\/td><td>F<\/td><td>Significance F<\/td><\/tr><tr><td>Regression<\/td><td>1.00 150,813,197,793 150,813,197,793 506.67<\/td><td>0.00<\/td><td><\/td><td><\/td><\/tr><tr><td>Residual<\/td><td>106.00<\/td><td>31,551,711,544<\/td><td>297,657,656<\/td><td><\/td><\/tr><tr><td>Total<\/td><td>107.00 182,364,909,338<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Coefficients Standard Error T-stat P-value<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Intercept<\/td><td>21,750.16<\/td><td>10,379.77<\/td><td>2.10<\/td><td>0.04<\/td><\/tr><tr><td>Lag 1<\/td><td>0.92<\/td><td>0.04<\/td><td>22.51<\/td><td>0.00<\/td><\/tr><\/table><\/div><p><b>Exhibit 2: Canadian Autoregressive Model With Lag 1 and Lag 12<\/b><\/p><p>Regression Statistics for 2nd Regression<\/p><div class=\"tbl\"><table><tr><td>Multiple R<\/td><td>0.96<\/td><\/tr><tr><td>R-square<\/td><td>0.93<\/td><\/tr><tr><td>Adjusted R-square<\/td><td>0.92<\/td><\/tr><tr><td>Standard error<\/td><td>11,336.27<\/td><\/tr><tr><td>Observations<\/td><td>108.00<\/td><\/tr><\/table><\/div><p>ANOVA<\/p><p>Significance F<\/p><div class=\"tbl\"><table><tr><td>df<\/td><td>SS<\/td><td>MS<\/td><td>F<\/td><td><\/td><\/tr><tr><td>Regression<\/td><td>2.00 168,871,246,751 84,435,623,375 657.03<\/td><td>&lt;0.01<\/td><td><\/td><td><\/td><\/tr><tr><td>Residual<\/td><td>105.00<\/td><td>13,493,662,586<\/td><td>128,511,072<\/td><td><\/td><\/tr><tr><td>Total<\/td><td>107.00 182,364,909,338<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Coefficients Standard Error T-stat P-value<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Intercept<\/td><td>–24,861.28<\/td><td>7,872.56<\/td><td>–3.16<\/td><td>&lt;0.01<\/td><\/tr><tr><td>Lag 1<\/td><td>0.30<\/td><td>0.06<\/td><td>5.22<\/td><td>&lt;0.01<\/td><\/tr><tr><td>Lag 12<\/td><td>0.84<\/td><td>0.07<\/td><td>11.85<\/td><td>&lt;0.01<\/td><\/tr><\/table><\/div><p>Sims has been assigned the task of valuing the U.S. stock market and uses data similar to the data that Smith uses for Canada. He decides, however, that the data should be transformed. He takes the natural log of the data and uses it in the following model:<\/p><p>∆ln sales  = b  + b  ∆ln sales<\/p><div class=\"tbl\"><table><tr><td>t<\/td><td>0<\/td><td>1<\/td><td>t − 1<\/td><\/tr><\/table><\/div><p>Parameter estimates for the autoregressive model and the actual data for the two most recent months are shown in Exhibit 3.<\/p><p><b>Exhibit 3: U.S. Autoregressive Model<\/b><\/p><div class=\"tbl\"><table><tr><td>Intercept<\/td><td>0.052<\/td><\/tr><tr><td>Lag 1 coefficient<\/td><td>0.684<\/td><\/tr><tr><td>Actual sales one month ago (–1)<\/td><td>6,270<\/td><\/tr><\/table><\/div><p>Actual sales two months ago (–2) 6,184<\/p><p>Smith and Sims are concerned that the data for Canadian retail sales may be more appropriately modeled with an ARCH process. Smith states, that in order to find out, he would take the residuals from the original autoregressive model for Canadian retail sales and then square them.<\/p><p>Sims states that these residuals would then be regressed against the Canadian retail sales data using the following equation: e  = b  + b X , where e represents the residual terms from the original regression and X represents the<\/p><div class=\"tbl\"><table><tr><td>t<\/td><td>0<\/td><td>1<\/td><td>t<\/td><\/tr><\/table><\/div><p>Canadian retail sales data. If b  is statistically different from zero, then the regression model contains an ARCH process. 1<\/p><p>Smith also examines the quarterly inflation data for an emerging market over the past nine years. He models the data using an autoregressive model with a lag 1 independent variable, which he finds is statistically different from zero. He wonders whether he should also include lag 2 and lag 4 terms, given the magnitude of the autocorrelations of the residuals shown in Exhibit 4, assuming a 5% significance level. The critical t-values, assuming a 5% significance level and 35 degrees of freedom, are 2.03 for a two-tail test and 1.69 for a one-tail test.<\/p><p><b>Exhibit 4: Emerging Market Autoregressive Model<\/b><\/p><p>Lag Autocorrelation<\/p><div class=\"tbl\"><table><tr><td>1<\/td><td>0.0829<\/td><\/tr><tr><td>2<\/td><td>0.1293<\/td><\/tr><tr><td>3<\/td><td>0.0227<\/td><\/tr><tr><td>4<\/td><td>0.1882<\/td><\/tr><\/table><\/div><p>Sims is investigating the performance of 5-year European and British bonds based on the actions of the U.S. Federal Reserve. He uses the U.S. Federal Funds rate. The two regressions he uses are:<\/p><div class=\"tbl\"><table><tr><td>BY<\/td><td> = b  + b FF<\/td><td><\/td><td><\/td><\/tr><tr><td>E,t<\/td><td>0<\/td><td>1<\/td><td>US,t<\/td><\/tr><tr><td>BY<\/td><td> = b  + b FF<\/td><td><\/td><td><\/td><\/tr><tr><td>B,t<\/td><td>0<\/td><td>1<\/td><td>US,t<\/td><\/tr><tr><td>where: FF is the Federal Funds rate in the United States (US), and BY is the bond yield in the European Union<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>(E) and Great Britain (B).<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Before he runs this regression, he investigates the characteristics of the dependent and independent variables. He finds that the Federal Funds rate in the United States and the bond yield in Great Britain have a unit root but that the bond yield in the European Union does not. Furthermore, the Federal Funds rate in the United States and the bond yield in Great Britain are cointegrated, but the Federal Funds rate in the United States and the bond yield in the European Union are not.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following is the appropriate test for cointegration?<\/p><\/div>", "subj": "quant"}, {"n": 13, "q": "Are the statements made by Hoskins and Lanning regarding the future growth of the Maldavian and Petrian economies most likely to be correct or incorrect?", "opts": ["Both are correct.", "Only Hoskins is correct.", "Only Lanning is correct."], "ans": "A", "expl": "Hoskins's statement is likely to be correct. If the Maldavian government is considering taxing stock market transactions, then this will limit future economic growth. Economic growth is dependent in part on markets, because markets facilitate business transactions between buyers and sellers. Lanning's statement is also likely to be correct. If the president of Petria nationalizes the oil industry, then private property will be seized and property rights will not have been respected. Without property rights, firms and individuals have little incentive to make investments that could lead to future economic growth. For Further Reference: (Study Session 4, Module 11.1, LOS 11.a)", "explhtml": "<p>Hoskins&#x27;s statement is likely to be correct. If the Maldavian government is considering taxing stock market transactions, then this will limit future economic growth. Economic growth is dependent in part on markets, because markets facilitate business transactions between buyers and sellers.<\/p><p>Lanning&#x27;s statement is also likely to be correct. If the president of Petria nationalizes the oil industry, then private property will be seized and property rights will not have been respected. Without property rights, firms and individuals have little incentive to make investments that could lead to future economic growth.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 4, Module 11.1, LOS 11.a)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Economics<\/summary><div class=\"vig-body\"><p>Questions 73 through 78 relate to Economics.<\/p><p>Platinum Advisors Case Scenario<\/p><p>Frank Hoskins and Paul Lanning are economists for a large U.S. investment advisory firm, Platinum Advisors. Hoskins and Lanning use their independent research on U.S. stocks and international stocks to provide advice for the firm&#x27;s network of advisors. As the senior economist at Platinum, Hoskins is a partner in the firm and is Lanning&#x27;s supervisor. Lanning has worked for Platinum for four years. At a lunch meeting, the two economists discuss the usefulness of economic theory, economic data, and the resulting forecasts of the global economic and stock market activity.<\/p><p>Hoskins is investigating the growth prospects of the country of Maldavia. Maldavia is a formerly communist country with a population of 3 million located in Eastern Europe. The Maldavian government had been aggressive in instituting political reform and encouraging the growth of financial markets. However, due to recent increases in stock market volatility, the Maldavian government is considering reigning-in trading volume by imposing a tax on stock market transactions. Hoskins states that this development is not encouraging for future economic growth.<\/p><p>Lanning is examining the country of Petra. Petra is a country of 25 million located in South America and rich with natural resources, including oil. The recently-elected president of Petra, Carlos Basile, has announced that he would like to ensure that the citizens of Petra enjoy the benefits of its natural resources rather than foreign oil companies, and that the government will nationalize these oil companies. Lanning states that these changes would not be beneficial for the future growth of the Petrian economy.<\/p><p>One of the many items they study when examining an economy or stock market is the economic information released by governments and private organizations. Hoskins and Lanning use this information to adjust their economic growth forecasts and to accordingly adjust portfolio allocations to the bond and stock markets. Examining information for Maldavia, Hoskins has learned that the Maldavian private sector has embarked on an ambitious plan to increase labor productivity by purchasing more machinery for its factories. Plotting the productivity curve for Maldavia, Hoskins states that labor productivity should increase because the productivity curve will shift up.<\/p><p>Lanning is examining the historical record of economic growth in Petra. He has gathered the data in Exhibit 1 to determine potential economic growth.<\/p><p><b>Exhibit 1: Economic Data for Petra from 20X1 to 20X7<\/b><\/p><div class=\"tbl\"><table><tr><td>Real GDP growth rate<\/td><td>3.9%<\/td><\/tr><tr><td>Growth rate in capital<\/td><td>1.4%<\/td><\/tr><tr><td>Growth rate in labor force<\/td><td>1.9%<\/td><\/tr><\/table><\/div><p>Labor cost/total factor cost 0.52<\/p><p>Lanning then turns his attention to the countries of Alicia and Felicia. He notes that the GDP growth rate in both countries is comparable. Alicia&#x27;s capital to labor ratio is USD 5,000. Felicia&#x27;s capital to labor ratio is USD 2,800. Alicia has a relatively younger labor force and the labor cost represents 35% of total factor cost. Both countries have extensive restrictions on foreign direct investments in their economy.<\/p><p>It has long been Platinum&#x27;s policy for its economists to use long-term economic growth trends to forecast future economic growth, stock returns, and dividends in a country. Lanning also examines the economy of Tiberia. Tiberia has a population of 11 million and is located in northern Africa. Its economy is diversified, and its main exports are agricultural products and heavy machinery. The country&#x27;s economy has been growing at an annual rate of 6.2% for the past 10 years, in part because of technological advances in the manufacturing of heavy equipment. These advances involve the use of computer-operated welding machines that have made the manufacturing process more efficient. Lanning is worried, however, that the current GDP growth rate may not be sustainable and is considering advising Platinum&#x27;s portfolio managers to decrease their portfolio allocations to the country. Before doing so, he will consult with Hoskins.<\/p><\/div><\/details><div class=\"qtext\"><p>Are the statements made by Hoskins and Lanning regarding the future growth of the Maldavian and Petrian economies most likely to be correct or incorrect?<\/p><\/div>", "subj": "economics"}, {"n": 14, "q": "Hoskins's statement regarding Maldavian labor productivity and its productivity curve is:", "opts": ["incorrect, because labor productivity is not affected in this scenario.", "incorrect, because labor productivity will decrease because of the low skill level of the labor force.", "incorrect, because although labor productivity will increase, the increase will result from a movement along the productivity curve."], "ans": "C", "expl": "Hoskins's reasoning is incorrect because although labor productivity will increase, the increase will result from a movement along the productivity curve. An upward shift in the productivity curve requires an advancement in technology. For Further Reference: (Study Session 4, Module 11.1, LOS 11.d)", "explhtml": "<p>Hoskins&#x27;s reasoning is incorrect because although labor productivity will increase, the increase will result from a movement along the productivity curve. An upward shift in the productivity curve requires an advancement in technology.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 4, Module 11.1, LOS 11.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 73 through 78 relate to Economics.<\/p><p>Platinum Advisors Case Scenario<\/p><p>Frank Hoskins and Paul Lanning are economists for a large U.S. investment advisory firm, Platinum Advisors. Hoskins and Lanning use their independent research on U.S. stocks and international stocks to provide advice for the firm&#x27;s network of advisors. As the senior economist at Platinum, Hoskins is a partner in the firm and is Lanning&#x27;s supervisor. Lanning has worked for Platinum for four years. At a lunch meeting, the two economists discuss the usefulness of economic theory, economic data, and the resulting forecasts of the global economic and stock market activity.<\/p><p>Hoskins is investigating the growth prospects of the country of Maldavia. Maldavia is a formerly communist country with a population of 3 million located in Eastern Europe. The Maldavian government had been aggressive in instituting political reform and encouraging the growth of financial markets. However, due to recent increases in stock market volatility, the Maldavian government is considering reigning-in trading volume by imposing a tax on stock market transactions. Hoskins states that this development is not encouraging for future economic growth.<\/p><p>Lanning is examining the country of Petra. Petra is a country of 25 million located in South America and rich with natural resources, including oil. The recently-elected president of Petra, Carlos Basile, has announced that he would like to ensure that the citizens of Petra enjoy the benefits of its natural resources rather than foreign oil companies, and that the government will nationalize these oil companies. Lanning states that these changes would not be beneficial for the future growth of the Petrian economy.<\/p><p>One of the many items they study when examining an economy or stock market is the economic information released by governments and private organizations. Hoskins and Lanning use this information to adjust their economic growth forecasts and to accordingly adjust portfolio allocations to the bond and stock markets. Examining information for Maldavia, Hoskins has learned that the Maldavian private sector has embarked on an ambitious plan to increase labor productivity by purchasing more machinery for its factories. Plotting the productivity curve for Maldavia, Hoskins states that labor productivity should increase because the productivity curve will shift up.<\/p><p>Lanning is examining the historical record of economic growth in Petra. He has gathered the data in Exhibit 1 to determine potential economic growth.<\/p><p><b>Exhibit 1: Economic Data for Petra from 20X1 to 20X7<\/b><\/p><div class=\"tbl\"><table><tr><td>Real GDP growth rate<\/td><td>3.9%<\/td><\/tr><tr><td>Growth rate in capital<\/td><td>1.4%<\/td><\/tr><tr><td>Growth rate in labor force<\/td><td>1.9%<\/td><\/tr><\/table><\/div><p>Labor cost/total factor cost 0.52<\/p><p>Lanning then turns his attention to the countries of Alicia and Felicia. He notes that the GDP growth rate in both countries is comparable. Alicia&#x27;s capital to labor ratio is USD 5,000. Felicia&#x27;s capital to labor ratio is USD 2,800. Alicia has a relatively younger labor force and the labor cost represents 35% of total factor cost. Both countries have extensive restrictions on foreign direct investments in their economy.<\/p><p>It has long been Platinum&#x27;s policy for its economists to use long-term economic growth trends to forecast future economic growth, stock returns, and dividends in a country. Lanning also examines the economy of Tiberia. Tiberia has a population of 11 million and is located in northern Africa. Its economy is diversified, and its main exports are agricultural products and heavy machinery. The country&#x27;s economy has been growing at an annual rate of 6.2% for the past 10 years, in part because of technological advances in the manufacturing of heavy equipment. These advances involve the use of computer-operated welding machines that have made the manufacturing process more efficient. Lanning is worried, however, that the current GDP growth rate may not be sustainable and is considering advising Platinum&#x27;s portfolio managers to decrease their portfolio allocations to the country. Before doing so, he will consult with Hoskins.<\/p><\/div><\/details><div class=\"qtext\"><p>Hoskins&#x27;s statement regarding Maldavian labor productivity and its productivity curve is:<\/p><\/div>", "subj": "economics"}, {"n": 15, "q": "Which country will experience a higher growth rate in potential GDP due to capital deepening and due to removal of restrictions on inflow of foreign capital? Capital deepening Removal of restrictions on inflow of capital", "opts": ["Alicia Felicia", "Felicia Felicia", "Felicia Alicia"], "ans": "B", "expl": "Felicia has lower capital to labor ratio and would benefit more from capital deepening. Removal of restrictions on the inflow of capital would lead to more investment and hence capital deepening—again benefiting Felicia more. For Further Reference: (Study Session 4, Module 11.1, LOS 11.d)", "explhtml": "<p>Felicia has lower capital to labor ratio and would benefit more from capital deepening. Removal of restrictions on the inflow of capital would lead to more investment and hence capital deepening—again benefiting Felicia more.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 4, Module 11.1, LOS 11.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 73 through 78 relate to Economics.<\/p><p>Platinum Advisors Case Scenario<\/p><p>Frank Hoskins and Paul Lanning are economists for a large U.S. investment advisory firm, Platinum Advisors. Hoskins and Lanning use their independent research on U.S. stocks and international stocks to provide advice for the firm&#x27;s network of advisors. As the senior economist at Platinum, Hoskins is a partner in the firm and is Lanning&#x27;s supervisor. Lanning has worked for Platinum for four years. At a lunch meeting, the two economists discuss the usefulness of economic theory, economic data, and the resulting forecasts of the global economic and stock market activity.<\/p><p>Hoskins is investigating the growth prospects of the country of Maldavia. Maldavia is a formerly communist country with a population of 3 million located in Eastern Europe. The Maldavian government had been aggressive in instituting political reform and encouraging the growth of financial markets. However, due to recent increases in stock market volatility, the Maldavian government is considering reigning-in trading volume by imposing a tax on stock market transactions. Hoskins states that this development is not encouraging for future economic growth.<\/p><p>Lanning is examining the country of Petra. Petra is a country of 25 million located in South America and rich with natural resources, including oil. The recently-elected president of Petra, Carlos Basile, has announced that he would like to ensure that the citizens of Petra enjoy the benefits of its natural resources  the economy of Tiberia. Tiberia has a population of 11 million and is located in northern Africa. Its economy is diversified, and its main exports are agricultural products and heavy machinery. The country&#x27;s economy has been growing at an annual rate of 6.2% for the past 10 years, in part because of technological advances in the manufacturing of heavy equipment. These advances involve the use of computer-operated welding machines that have made the manufacturing process more efficient. Lanning is worried, however, that the current GDP growth rate may not be sustainable and is considering advising Platinum&#x27;s portfolio managers to decrease their portfolio allocations to the country. Before doing so, he will consult with Hoskins.<\/p><\/div><\/details><div class=\"qtext\"><p>Which country will experience a higher growth rate in potential GDP due to capital deepening and due to removal of restrictions on inflow of foreign capital?<\/p><div class=\"tbl\"><table><tr><td>Capital deepening<\/td><td>Removal of restrictions on inflow of capital<\/td><\/tr><\/table><\/div><\/div>", "subj": "economics"}, {"n": 16, "q": "Petra's GDP growth rate attributable to growth in total factor productivity is closest to:", "opts": ["0.6%.", "1.6%.", "2.2%."], "ans": "C", "expl": "GDP growth rate = growth rate in TFP + α (long-term growth rate of capital) + (1 − α) (long-term growth rate of labor). (1 − α) = 0.52 and thus α = 0.48 3.9% = ΔTFP + (0.48)(1.4) + (0.52)(1.9) → ΔTFP = 2.24% For Further Reference: (Study Session 4, Module 11.2, LOS 11.e)", "explhtml": "<p>GDP growth rate = growth rate in TFP + α (long-term growth rate of capital) + (1 − α) (long-term growth rate of labor).<\/p><p>(1 − α) = 0.52 and thus α = 0.48<\/p><p>3.9% = ΔTFP + (0.48)(1.4) + (0.52)(1.9) → ΔTFP = 2.24%<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 4, Module 11.2, LOS 11.e)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–18 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 73 through 78 relate to Economics.<\/p><p>Platinum Advisors Case Scenario<\/p><p>Frank Hoskins and Paul Lanning are economists for a large U.S. investment advisory firm, Platinum Advisors. Hoskins and Lanning use their independent research on U.S. stocks and international stocks to provide advice for the firm&#x27;s network of advisors. As the senior economist at Platinum, Hoskins is a partner in the firm and is Lanning&#x27;s supervisor. Lanning has worked for Platinum for four years. At a lunch meeting, the two economists discuss the usefulness of economic theory, economic data, and the resulting forecasts of the global economic and stock market activity.<\/p><p>Hoskins is investigating the growth prospects of the country of Maldavia. Maldavia is a formerly communist country with a population of 3 million located in Eastern Europe. The Maldavian government had been aggressive in instituting political reform and encouraging the growth of financial markets. However, due to recent increases in stock market volatility, the Maldavian government is considering reigning-in trading volume by imposing a tax on stock market transactions. Hoskins states that this development is not encouraging for future economic growth.<\/p><p>Lanning is examining the country of Petra. Petra is a country of 25 million located in South America and rich with natural resources, including oil. The recently-elected president of Petra, Carlos Basile, has announced that he would like to ensure that the citizens of Petra enjoy the benefits of its natural resources rather than foreign oil companies, and that the government will nationalize these oil companies. Lanning states that these changes would not be beneficial for the future growth of the Petrian economy.<\/p><p>One of the many items they study when examining an economy or stock market is the economic information released by governments and private organizations. Hoskins and Lanning use this information to adjust their economic growth forecasts and to accordingly adjust portfolio allocations to the bond and stock markets. Examining information for Maldavia, Hoskins has learned that the Maldavian private sector has embarked on an ambitious plan to increase labor productivity by purchasing more machinery for its factories. Plotting the productivity curve for Maldavia, Hoskins states that labor productivity should increase because the productivity curve will shift up.<\/p><p>Lanning is examining the historical record of economic growth in Petra. He has gathered the data in Exhibit 1 to determine potential economic growth.<\/p><p><b>Exhibit 1: Economic Data for Petra from 20X1 to 20X7<\/b><\/p><div class=\"tbl\"><table><tr><td>Real GDP growth rate<\/td><td>3.9%<\/td><\/tr><tr><td>Growth rate in capital<\/td><td>1.4%<\/td><\/tr><tr><td>Growth rate in labor force<\/td><td>1.9%<\/td><\/tr><\/table><\/div><p>Labor cost/total factor cost 0.52<\/p><p>Lanning then turns his attention to the countries of Alicia and Felicia. He notes that the GDP growth rate in both countries is comparable. Alicia&#x27;s capital to labor ratio is USD 5,000. Felicia&#x27;s capital to labor ratio is USD 2,800. Alicia has a relatively younger labor force and the labor cost represents 35% of total factor cost. Both countries have extensive restrictions on foreign direct investments in their economy.<\/p><p>It has long been Platinum&#x27;s policy for its economists to use long-term economic growth trends to forecast future economic growth, stock returns, and dividends in a country. Lanning also examines the economy of Tiberia. Tiberia has a population of 11 million and is located in northern Africa. Its economy is diversified, and its main exports are agricultural products and heavy machinery. The country&#x27;s economy has been growing at an annual rate of 6.2% for the past 10 years, in part because of technological advances in the manufac acturing of heavy equipment. These advances involve the use of computer-operated welding machines that have made the manufacturing process more efficient. Lanning is worried, however, that the current GDP growth rate may not be sustainable and is considering advising Platinum&#x27;s portfolio managers to decrease their portfolio allocations to the country. Before doing so, he will consult with Hoskins.<\/p><\/div><\/details><div class=\"qtext\"><p>The classical growth theory predicts that Tiberia&#x27;s long-run future GDP per capita is most likely to:<\/p><\/div>", "subj": "economics"}, {"n": 18, "q": "The endogenous growth theory predicts that the Tiberian GDP growth rate is most likely to:", "opts": ["settle at a long-run steady state because of diminishing marginal productivity of capital.", "continue to increase because technological advances will be shared by many sectors of the economy.", "decline because the current GDP growth rate is not sustainable."], "ans": "B", "expl": "Under the endogenous growth theory, the Tiberian GDP growth rate can continue to increase because technological advances will be shared by many sectors of the economy. Increasing R&D investment, for example, results in benefits not just to the firm making the investment but also to other firms. As these benefits flow to other firms, the economy becomes more productive and the long-term economic growth rate can continue to increase. For Further Reference: (Study Session 4, Module 11.3, LOS 11.i)", "explhtml": "<p>Under the endogenous growth theory, the Tiberian GDP growth rate can continue to increase because technological advances will be shared by many sectors of the economy. Increasing R&amp;D investment, for example, results in benefits not just to the firm making the investment but also to other firms. As these benefits flow to other firms, the economy becomes more productive and the long-term economic growth rate can continue to increase.<\/p><p><b>For Further Reference:<\/b><\/p><p
