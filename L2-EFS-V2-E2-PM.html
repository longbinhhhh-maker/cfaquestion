oject. However, Holbrook does not include a cash flow for net working capital at the beginning or the end of the project. Assuming he correctly analyzes all the other components of the project, has Holbrook correctly estimated the project&#x27;s net present value?<\/p><\/div>", "subj": "corporate"}, {"n": 34, "q": "Which of the following choices is closest to the overall NPV for Project 1, and is Holbrook correct to wait for more information before deciding on Project 2?", "opts": ["The overall NPV is –$1 million, and Holbrook is correct.", "The overall NPV is –$1 million, and Holbrook is incorrect.", "The overall NPV is $13 million, and Holbrook is incorrect."], "ans": "B", "expl": "The overall NPV of Project 1 = project NPV − option cost + option value. overall NPV = –$7 million − $3 million + $9 million = –$1 million Without the option, the NPV of the production facility is negative, and the real option does not add enough value to make the overall project profitable. Holbrook is incorrect that he needs to wait for more information to make the decision on Project 2. If the NPV of the project without the option is positive, the analyst knows that the project with the option must be even more valuable, and determining a specific value for the option is unnecessary. A real option adds value to a project, even if it is difficult to determine the monetary amount of that value. For Further Reference: (Study Session 7, Module 19.3, LOS 19.f)", "explhtml": "<p>The overall NPV of Project 1 = project NPV − option cost + option value.<\/p><p>overall NPV = –$7 million − $3 million + $9 million = –$1 million<\/p><p>Without the option, the NPV of the production facility is negative, and the real option does not add enough value to make the overall project profitable. Holbrook is incorrect that he needs to wait for more information to make the decision on Project 2. If the NPV of the project without the option is positive, the analyst knows that the project with the option must or shipping, site preparation, and installation. The new equipment will require a $50,000 increase in inventory and a $20,000 increase in accounts payable. The company uses MACRS to calculate depreciation for tax purposes and the straight-line method for financial reporting. The project has an expected life of four years, at which time the robot is expected to be sold for $75,000. The project will be funded with the debt/equity mix reflected by the company&#x27;s current capital structure. CEI&#x27;s pretax cost of new debt is 7%. Assume a WACC of 8%. Some of the relevant end-of-year cash flows for the robotic project are presented in Exhibit 1.<\/p><p><b>Exhibit 1: Relevant Cash Flows for Robotics Project<\/b><\/p><div class=\"tbl\"><table><tr><td>Year 1<\/td><td>Year 2<\/td><td>Year 3<\/td><td>Year 4<\/td><td><\/td><\/tr><tr><td>Sales<\/td><td>$750,000 $750,000 $750,000 $750,000<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Variable costs<\/td><td>$225,000 $225,000 $225,000 $225,000<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Fixed expense<\/td><td>$75,000<\/td><td>$75,000<\/td><td>$75,000<\/td><td>$75,000<\/td><\/tr><tr><td>Depreciation<\/td><td>$264,000 $360,000 $120,000<\/td><td>$56,000<\/td><td><\/td><td><\/td><\/tr><tr><td>Earnings before tax (EBT) $186,000<\/td><td>$90,000 $330,000 $394,000<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Total after-tax cash flow<\/td><td>$375,600 $414,000 $318,000<\/td><td>?<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Holbrook calculates the NPV of the robotic project and presents his findings to his supervisor, Geoffrey Mans. After reviewing the report, Mans makes the following recommendations:<\/p><p>1. &quot;You forgot to include the $100,000 we have spent so far on consultants and project engineers and who knows what else to evaluate the project&#x27;s feasibility. Rerun the numbers including that amount and get the revised calculations to me this afternoon.&quot; 2. &quot;Rerun the analysis assuming straight-line depreciation for tax purposes. The NPV will be higher, and we&#x27;ll be more likely to get the project funded.&quot;<\/p><p>Cummings has two other projects under consideration that would affect the production of storage lockers. Project 1 relates to changing the production process, and Project 2 relates to expanding the distribution facility. Holbrook estimates the NPV of the expected cash flows for Project 1 at negative $7 million. An additional investment of $3 million would allow management to more rapidly adjust to the demand for a certain type of locker. The value of this flexibility is estimated at $9 million. He estimates that the NPV of the expected cash flows for Project 2 at $3 million. An expansion option would require an additional investment of $2 million. At this time, Cummings does not have any capital rationing restrictions.<\/p><p>Holbrook emails the lead analyst for the budgeting group and indicates that he cannot make a decision on Project 2 without knowing the value the expansion option will provide.<\/p><p>Holbrook calls a capital budgeting meeting with CEI&#x27;s production and quality control manager. Holbrook opens the meeting by stating: &quot;I think we should accept this project based solely on the fact that it provides great operating margins. Nevertheless, I think we should conduct net present value (NPV) analysis to confirm my opinion.&quot; Holbrook then receives the following comments:<\/p><div class=\"tbl\"><table><tr><td>Comment 1:<\/td><td>It is important that interest is included in the cash flows used with NPV analysis because interest<\/td><\/tr><tr><td>is a real and very significant expense.<\/td><td><\/td><\/tr><tr><td>Comment 2:<\/td><td>If applied correctly, the NPV of this project will be higher if we discount economic profits instead<\/td><\/tr><tr><td>of net after-tax operating cash flows in our analysis. I suggest we calculate economic profit as<\/td><td><\/td><\/tr><tr><td>net operating profit after tax minus the dollar cost of capital.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The economic income for Year 3 for the robotics project from Exhibit 1 is closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 36, "q": "Are the comments made by the CEI's production and quality assurance manager correct or incorrect?", "opts": ["Both comments are correct.", "Only one of the comments is correct.", "Both comments are incorrect."], "ans": "C", "expl": "Comment 1 is incorrect. Interest should not be included in a project's cash flows when conducting NPV analysis because it is a financing cost that is reflected in the discount rate use to compute NPV. Comment 2 is incorrect. In theory, when discounted at the WACC, the present value of the economic profits from a project equals the NPV of the project. For a given period, economic profit = NOPAT − $WACC, where NOPAT is net operating profit after taxes and $WACC is the dollar cost of the capital used during the period. Economic profit reflects the income earned by all capital providers. For Further Reference: (Study Session 7, Module 19.3, LOS 19.i)", "explhtml": "<p>Comment 1 is incorrect. Interest should not be included in a project&#x27;s cash flows when conducting NPV analysis because it is a financing cost that is reflected in the discount rate use to compute NPV.<\/p><p>Comment 2 is incorrect. In theory, when discounted at the WACC, the present value of the economic profits from a project equals the NPV of the project. For a given period, economic profit = NOPAT − $WACC, where NOPAT is net operating profit after taxes and $WACC is the dollar cost of the capital used during the period. Economic profit reflects the income earned by all capital providers.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 7, Module 19.3, LOS 19.i)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 31–36 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 91 through 96 relate to Corporate Finance.<\/p><p>Cummings Enterprises, Inc., Case Scenario<\/p><p>Cummings Enterprises, Inc. (CEI), is a U.S. conglomerate that operates in a variety of markets. CEI&#x27;s marginal tax rate is 40%. One of CEI&#x27;s divisions manufactures small fiberglass products, such as bird baths and outdoor storage lockers. CEI is currently considering the expansion of its fiberglass product line to include booms and buckets for aerial lift trucks (often called cherry pickers), which are used for applications such as high voltage power line maintenance. The addition of this new product line is expected to increase CEI&#x27;s sales by $750,000 per year. Cal Holbrook, CEI&#x27;s manager of fiberglass operations, is deciding whether to purchase a robotic system to produce cherry picker booms and buckets. The price of the robotic system will be $700,000, plus an additional $100,000 for shipping, site preparation, and installation. The new equipment will require a $50,000 increase in inventory and a $20,000 increase in accounts payable. The company uses MACRS to calculate depreciation for tax purposes and the straight-line method for financial reporting. The project has an expected life of four years, at which time the robot is expected to be sold for $75,000. The project will be funded with the debt/equity mix reflected by the company&#x27;s current capital structure. CEI&#x27;s pretax cost of new debt is 7%. Assume a WACC of 8%. Some of the relevant end-of-year cash flows for the robotic project are presented in Exhibit 1.<\/p><p><b>Exhibit 1: Relevant Cash Flows for Robotics Project<\/b><\/p><div class=\"tbl\"><table><tr><td>Year 1<\/td><td>Year 2<\/td><td>Year 3<\/td><td>Year 4<\/td><td><\/td><\/tr><tr><td>Sales<\/td><td>$750,000 $750,000 $750,000 $750,000<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Variable costs<\/td><td>$225,000 $225,000 $225,000 $225,000<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Fixed expense<\/td><td>$75,000<\/td><td>$75,000<\/td><td>$75,000<\/td><td>$75,000<\/td><\/tr><tr><td>Depreciation<\/td><td>$264,000 $360,000 $120,000<\/td><td>$56,000<\/td><td><\/td><td><\/td><\/tr><tr><td>Earnings before tax (EBT) $186,000<\/td><td>$90,000 $330,000 $394,000<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Total after-tax cash flow<\/td><td>$375,600 $414,000 $318,000<\/td><td>?<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Holbrook calculates the NPV of the robotic project and presents his findings to his supervisor, Geoffrey Mans. After reviewing the report, Mans makes the following recommendations:<\/p><p>1. &quot;You forgot to include the $100,000 we have spent so far on consultants and project engineers and who knows what else to evaluate the project&#x27;s feasibility. Rerun the numbers including that amount and get the revised calculations to me this afternoon.&quot; 2. &quot;Rerun the analysis assuming straight-line depreciation for tax purposes. The NPV will be higher, and we&#x27;ll be more likely to get the project funded.&quot;<\/p><p>Cummings has two other projects under consideration that would affect the production of storage lockers. Project 1 relates to changing the production process, and Project 2 relates to expanding the distribution facility. Holbrook estimates the NPV of the expected cash flows for Project 1 at negative $7 million. An additional investment of $3 million would allow management to more rapidly adjust to the demand for a certain type of locker. The value of this flexibility is estimated at $9 million. He estimates that the NPV of the expected cash flows for Project 2 at $3 million. An expansion option would require an additional investment of $2 million. At this time, Cummings does not have any capital rationing restrictions.<\/p><p>Holbrook emails the lead analyst for the budgeting group and indicates that he cannot make a decision on Project 2 without knowing the value the expansion option will provide.<\/p><p>Holbrook calls a capital budgeting meeting with CEI&#x27;s production and quality control manager. Holbrook opens the meeting by stating: &quot;I think we should accept this project based solely on the fact that it provides great operating margins. Nevertheless, I think we should conduct net present value (NPV) analysis to confirm my opinion.&quot; Holbrook then receives the following comments:<\/p><div class=\"tbl\"><table><tr><td>Comment 1:<\/td><td>It is important that interest is included in the cash flows used with NPV analysis because interest<\/td><\/tr><tr><td>is a real and very significant expense.<\/td><td><\/td><\/tr><tr><td>Comment 2:<\/td><td>If applied correctly, the NPV of this project will be higher if we discount economic profits instead<\/td><\/tr><tr><td>of net after-tax operating cash flows in our analysis. I suggest we calculate economic profit as<\/td><td><\/td><\/tr><tr><td>net operating profit after tax minus the dollar cost of capital.<\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Are the comments made by the CEI&#x27;s production and quality assurance manager correct or incorrect?<\/p><\/div>", "subj": "corporate"}, {"n": 37, "q": "Which of the credit analysis models shown in Exhibit 1 can only be used under the assumption that the issuing company's assets trade in a frictionless market?", "opts": ["Structural models.", "Reduced form models.", "Both structural models and reduced form models."], "ans": "A", "expl": "Structural models require that the company's assets trade in a frictionless arbitrage free market. For Further Reference: (Study Session 13, Module 35.4, LOS 35.d)", "explhtml": "<p>Structural models require that the company&#x27;s assets trade in a frictionless arbitrage free market.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 35.4, LOS 35.d)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Fixed Income<\/summary><div class=\"vig-body\"><p>Questions 97 through 102 relate to Fixed Income.<\/p><p>Jon Stevenson Case Scenario<\/p><p>Jon Stevenson, CFA, is an experienced equity fund manager who has recently taken a position with Lohsi Clearview, a UK-based hedge fund that has combined a wide range of strategies to deliver impressive returns over the last five years. One of the fund&#x27;s strategies is to invest in high-credit-risk fixed income instruments. The fund has an excellent track record of identifying bonds in this sector that subsequently outperform the market.<\/p><p>Stevenson wishes to familiarize himself with the fund&#x27;s strategies and has started by looking at some of the techniques used in analyzing fixed income instruments. Exhibit 1 shows the firm&#x27;s approach to analyzing credit risk.<\/p><p><b>Exhibit 1: Credit Analysis Tools<\/b><\/p><p>Credit Ratings<\/p><p>Before undertaking any level of detailed analysis, the credit rating from the three major agencies should be obtained. Typically an instrument that is investment grade according to all three agencies will not be worthy of further consideration.<\/p><p>Structural Models<\/p><p>An initial analysis using a simple structural model should be undertaken to calculate the present value of the expected loss.<\/p><p>Reduced Form Models<\/p><p>Detailed analysis should be undertaken using the reduced form models used by the fixed income team. This analysis should only be undertaken once the structural model analysis has been completed.<\/p><p>Stevenson has no experience with structural models and is interested in learning more. He finds an analysis that has been completed for a recent bond issue. The results are shown in Exhibit 2.<\/p><p><b>Exhibit 2: IMC Bond Issue (ID 062014555612) Structural Model Results<\/b><\/p><div class=\"tbl\"><table><tr><td>Asset value<\/td><td>A<\/td><td>1,200<\/td><\/tr><tr><td>t<\/td><td><\/td><td><\/td><\/tr><tr><td>Expected return on assets μ<\/td><td>0.04<\/td><td><\/td><\/tr><tr><td>Risk free rate<\/td><td>r<\/td><td>0.02<\/td><\/tr><tr><td>Face value<\/td><td>K<\/td><td>850<\/td><\/tr><tr><td>Time to maturity<\/td><td>T−t<\/td><td>1.5<\/td><\/tr><tr><td>Return volatility<\/td><td>σ<\/td><td>0.28<\/td><\/tr><tr><td>d<\/td><td>1.26452<\/td><td><\/td><\/tr><\/table><\/div><p>1<\/p><div class=\"tbl\"><table><tr><td>d<\/td><td>0.92159<\/td><\/tr><\/table><\/div><p>2<\/p><div class=\"tbl\"><table><tr><td>N(–d )<\/td><td>0.1030<\/td><\/tr><\/table><\/div><p>1<\/p><div class=\"tbl\"><table><tr><td>N(–d )<\/td><td>0.1784<\/td><\/tr><\/table><\/div><p>2<\/p><div class=\"tbl\"><table><tr><td>e<\/td><td>1.35200<\/td><\/tr><\/table><\/div><p>1<\/p><div class=\"tbl\"><table><tr><td>e<\/td><td>1.00907<\/td><\/tr><\/table><\/div><p>2<\/p><div class=\"tbl\"><table><tr><td>N(–e )<\/td><td>0.0882<\/td><\/tr><\/table><\/div><p>1<\/p><div class=\"tbl\"><table><tr><td>N(–e )<\/td><td>0.1565<\/td><\/tr><\/table><\/div><p>2<\/p><div class=\"tbl\"><table><tr><td>Expected loss<\/td><td>22.86<\/td><\/tr><tr><td>PV expected loss<\/td><td>23.51<\/td><\/tr><\/table><\/div><p>Stevenson next turns his attention to DEP Bond, one of the fund&#x27;s holdings. The bond was purchased today, immediately after it paid its annual coupon. Stevenson obtains the file for DEP and finds out that the bond was evaluated using a risk- neutral probability of default (POD) as shown in Exhibit 3.<\/p><p><b>Exhibit 3: DEP Bond Issue (ID 071443274112)<\/b><\/p><div class=\"tbl\"><table><tr><td>Rating<\/td><td>B<\/td><td>Modified duration<\/td><td>2.80<\/td><td>POD<\/td><td>2.50%<\/td><\/tr><tr><td>Purchase price $104.85 Coupon (just paid) 5%<\/td><td>Recovery rate 50%<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Par value<\/td><td>$100<\/td><td>Maturity<\/td><td>3 years Risk-free rate<\/td><td>2%<\/td><td><\/td><\/tr><\/table><\/div><p>Stevenson also finds in the file current credit spreads applicable to bonds similar (by ratings class) to DEP bond as shown in Exhibit 4.<\/p><p><b>Exhibit 4: Spreads<\/b><\/p><div class=\"tbl\"><table><tr><td>Rating<\/td><td>AAA<\/td><td>AA<\/td><td>A<\/td><td>BBB<\/td><td>BB<\/td><td>B<\/td><td>CCC/CC/C<\/td><\/tr><tr><td>Avg. Spread 0.24% 0.32% 0.49% 0.60% 0.77% 0.95%<\/td><td>1.22%<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the credit analysis models shown in Exhibit 1 can only be used under the assumption that the issuing company&#x27;s assets trade in a frictionless market?<\/p><\/div>", "subj": "fixed"}, {"n": 38, "q": "According to the structural model shown in Exhibit 2, the maximum amount an investor holding the bond would pay to a third party to remove the risk of default would be:", "opts": ["$0.65.", "$22.86.", "$23.51."], "ans": "C", "expl": "The maximum amount an investor would to pay to remove the credit risk is the present value of the expected loss. For Further Reference: (Study Session 13, Module 35.4, LOS 35.d)", "explhtml": "<p>The maximum amount an investor would to pay to remove the credit risk is the present value of the expected loss.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 35.4, LOS 35.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 97 through 102 relate to Fixed Income.<\/p><p>Jon Stevenson Case Scenario<\/p><p>Jon Stevenson, CFA, is an experienced equity fund manager who has recently taken a position with Lohsi Clearview, a UK-based hedge fund that has combined a wide range of strategies to deliver impressive returns over the last five years. One of the fund&#x27;s strategies is to invest in high-credit-risk fixed income instruments. The fund has an excellent track record of identifying bonds in this sector that subsequently outperform the market.<\/p><p>Stevenson wishes to familiarize himself with the fund&#x27;s strategies and has started by looking at some of the techniques used in analyzing fixed income instruments. Exhibit 1 shows the firm&#x27;s approach to analyzing credit risk.<\/p><p><b>Exhibit 1: Credit Analysis Tools<\/b><\/p><p>Credit Ratings<\/p><p>Before undertaking any level of detailed analysis, the credit rating from the three major agencies should be obtained. Typically an instrument that is investment grade according to all three agencies will not be worthy of further consideration.<\/p><p>Structural Models<\/p><p>An initial analysis using a simple structural model should be undertaken to calculate the present value of the expected loss.<\/p><p>Reduced Form Models<\/p><p>Detailed analysis should be undertaken using the reduced form models used by the fixed income team. This analysis should only be undertaken once the structural model analysis has been completed.<\/p><p>Stevenson has no experience with structural models and is interested in learning more. He finds an analysis that has been completed for a recent bond issue. The results are shown in Exhibit 2.<\/p><p><b>Exhibit 2: IMC Bond Issue (ID 062014555612) Structural Model Results<\/b><\/p><div class=\"tbl\"><table><tr><td>Asset value<\/td><td>A<\/td><td>1,200<\/td><\/tr><tr><td>t<\/td><td><\/td><td><\/td><\/tr><tr><td>Expected return on assets μ<\/td><td>0.04<\/td><td><\/td><\/tr><tr><td>Risk free rate<\/td><td>r<\/td><td>0.02<\/td><\/tr><tr><td>Face value<\/td><td>K<\/td><td>850<\/td><\/tr><tr><td>Time to maturity<\/td><td>T−t<\/td><td>1.5<\/td><\/tr><tr><td>Return volatility<\/td><td>σ<\/td><td>0.28<\/td><\/tr><tr><td>d<\/td><td>1.26452<\/td><td><\/td><\/tr><\/table><\/div><p>1<\/p><div class=\"tbl\"><table><tr><td>d<\/td><td>0.92159<\/td><\/tr><\/table><\/div><p>2<\/p><div class=\"tbl\"><table><tr><td>N(–d )<\/td><td>0.1030<\/td><\/tr><\/table><\/div><p>1<\/p><div class=\"tbl\"><table><tr><td>N(–d )<\/td><td>0.1784<\/td><\/tr><\/table><\/div><p>2<\/p><div class=\"tbl\"><table><tr><td>e<\/td><td>1.35200<\/td><\/tr><\/table><\/div><p>1<\/p><div class=\"tbl\"><table><tr><td>e<\/td><td>1.00907<\/td><\/tr><\/table><\/div><p>2<\/p><div class=\"tbl\"><table><tr><td>N(–e )<\/td><td>0.0882<\/td><\/tr><\/table><\/div><p>1<\/p><div class=\"tbl\"><table><tr><td>N(–e )<\/td><td>0.1565<\/td><\/tr><\/table><\/div><p>2<\/p><div class=\"tbl\"><table><tr><td>Expected loss<\/td><td>22.86<\/td><\/tr><tr><td>PV expected loss<\/td><td>23.51<\/td><\/tr><\/table><\/div><p>Stevenson next turns his attention to DEP Bond, one of the fund&#x27;s holdings. The bond was purchased today, immediately after it paid its annual coupon. Stevenson obtains the file for DEP and finds out that the bond was evaluated using a risk- neutral probability of default (POD) as shown in Exhibit 3.<\/p><p><b>Exhibit 3: DEP Bond Issue (ID 071443274112)<\/b><\/p><div class=\"tbl\"><table><tr><td>Rating<\/td><td>B<\/td><td>Modified duration<\/td><td>2.80<\/td><td>POD<\/td><td>2.50%<\/td><\/tr><tr><td>Purchase price $104.85 Coupon (just paid) 5%<\/td><td>Recovery rate 50%<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Par value<\/td><td>$100<\/td><td>Maturity<\/td><td>3 years Risk-free rate<\/td><td>2%<\/td><td><\/td><\/tr><\/table><\/div><p>Stevenson also finds in the file current credit spreads applicable to bonds similar (by ratings class) to DEP bond as shown in Exhibit 4.<\/p><p><b>Exhibit 4: Spreads<\/b><\/p><div class=\"tbl\"><table><tr><td>Rating<\/td><td>AAA<\/td><td>AA<\/td><td>A<\/td><td>BBB<\/td><td>BB<\/td><td>B<\/td><td>CCC/CC/C<\/td><\/tr><tr><td>Avg. Spread 0.24% 0.32% 0.49% 0.60% 0.77% 0.95%<\/td><td>1.22%<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>According to the structural model shown in Exhibit 2, the maximum amount an investor holding the bond would pay to a third party to remove the risk of default would be:<\/p><\/div>", "subj": "fixed"}, {"n": 39, "q": "If the volatility estimate is changed to 30% in the structural model shown in Exhibit 2, the calculated value of the IMC Bond would most likely:", "opts": ["remain the same.", "decrease.", "increase."], "ans": "B", "expl": "Under the option analogy of the structural model, risky debt can be viewed as a portfolio comprising a long position in risk- free debt and a short put option on the company's asset with a strike price equal to the face value of the risky debt. When the asset volatility increases, the value of the put option increases and the value of the portfolio with short exposure to the put option will decrease. Hence the computed value of risky debt will be lower. For Further Reference: (Study Session 13, Module 35.4, LOS 35.d)", "explhtml": "<p>Under the option analogy of the structural model, risky debt can be viewed as a portfolio comprising a long position in risk- free debt and a short put option on the company&#x27;s asset with a strike price equal to the face value of the risky debt. When the asset volatility increases, the value of the put option increases and the value of the portfolio with short exposure to the put option will decrease. Hence the computed value of risky debt will be lower.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 13, Module 35.4, LOS 35.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–42 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 97 through 102 relate to Fixed Income.<\/p><p>Jon Stevenson Case Scenario<\/p><p>Jon Stevenson, CFA, is an experienced equity fund manager who has recently taken a position with Lohsi Clearview, a UK-based hedge fund that has combined a wide range of strategies to deliver impressive returns over the last five years. One of the fund&#x27;s strategies is to invest in high-credit-risk fixed income instruments. The fund has an excellent tra  / $32.0<\/td><td>$1.80 / $24.0<\/td><td>$3.15 / $45.0<\/td><\/tr><\/table><\/div><p>Cap rate<\/p><div class=\"tbl\"><table><tr><td>= 8.0%<\/td><td>= 7.5%<\/td><td>= 7.0%<\/td><\/tr><\/table><\/div><p>The average cap rate for the three apartment buildings is 7.5%. The estimated value of Parkway Terrance is calculated as the NOI of $3,300,000 divided by the cap rate of 7.5%, or $44.0 million.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 15, Module 39.2, LOS 39.g)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Questions 103 through 108 relate to Alternative Investments.<\/p><p>Parkway Terrace Case Scenario<\/p><p>Rita Larson, CFA, is an investment analyst for Siprah Properties, Inc. A group of wealthy investors, Ken Lundy, Chun Park, and Kareem Shabaz, are interested in purchasing Parkway Terrace, a 120-unit luxury apartment complex in Southeastern Florida. The current owners of Parkway Terrace have agreed to sell the property for $40,000,000.<\/p><p>Siprah represents both the existing owners and the potential new owners and are privy to additional information. Exhibit 1 and Exhibit 2 show the information Larson has collected during her due diligence.<\/p><p><b>Exhibit 1: Parkway Terrace Specifics<\/b><\/p><p>Parkway Terrace<\/p><div class=\"tbl\"><table><tr><td>Projected first year net operating income<\/td><td>$3.3 million<\/td><\/tr><tr><td>Location/condition<\/td><td>Prime/good<\/td><\/tr><tr><td>LTV<\/td><td>75.0%<\/td><\/tr><tr><td>Loan term<\/td><td>25 years<\/td><\/tr><tr><td>Loan interest rate<\/td><td>4.5%<\/td><\/tr><tr><td>Monthly debt service<\/td><td>$166,750<\/td><\/tr><tr><td>Square footage<\/td><td>240,000<\/td><\/tr><tr><td>Expected holding period<\/td><td>10 years<\/td><\/tr><tr><td>Parkway Terrace<\/td><td>Cost Estimates<\/td><\/tr><tr><td>Effective age of building<\/td><td>10 years<\/td><\/tr><tr><td>Total e  "opts": ["Chun Park’s.", "Ken Lundy’s.", "Kareem Shabaz’s."], "ans": "A", "expl": "The economic outlook on home prices and population trends indicate favorable conditions going forward. Shorter leases would allow rents to be adjusted upwards as demand for rentals increase, so Lundy's comment is correct. For a buyer of real estate, low interest rates along with a high loan-to-value (LTV) will maximize the potential for high levered returns. Tenants will benefit from longer leases in a high demand environment; this would not benefit the investors so Park's comment is incorrect. For Further Reference: (Study Session 15, Module 39.1, LOS 39.c, 39.d)", "explhtml": "<p>The economic outlook on home prices and population trends indicate favorable conditions going forward. Shorter leases would allow rents to be adjusted upwards as demand for rentals increase, so Lundy&#x27;s comment is correct. For a buyer of real estate, low interest rates along with a high loan-to-value (LTV) will maximize the potential for high levered returns. Tenants will benefit from longer leases in a high demand environment; this would not benefit the investors so Park&#x27;s comment is incorrect.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 15, Module 39.1, LOS 39.c, 39.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 103 through 108 relate to Alternative Investments.<\/p><p>Parkway Terrace Case Scenario<\/p><p>Rita Larson, CFA, is an investment analyst for Siprah Properties, Inc. A group of wealthy investors, Ken Lundy, Chun Park, and Kareem Shabaz, are interested in purchasing Parkway Terrace, a 120-unit luxury apartment complex in Southeastern Florida. The current owners of Parkway Terrace have agreed to sell the property for $40,000,000.<\/p><p>Siprah represents both the existing owners and the potenti tary index provided by REIQ. The REIQ index is an appraisal-based index that is very popular among real estate professionals. Larson is concerned about appraisal lag in the index and wants to adjust the index to remove this lag.<\/p><\/div><\/details><div class=\"qtext\"><p>Which stated approach is least likely to result in an increase in potential returns?<\/p><\/div>", "subj": "alternatives"}, {"n": 48, "q": "To correct for appraisal lag in the REIQ index, which of the following is the least appropriate course of action for Larson?", "opts": ["‘Unsmooth’ the index.", "Use a transaction-based index.", "Use more-recent appraisals."], "ans": "C", "expl": "Appraisal lag tends to smooth the reported returns of real estate indices, resulting in an artificially low correlation with other asset classes. Appraisal lag can be mitigated by unsmoothing the index or by using a transaction-based index. Using more-recent appraisals still relies on appraisal-based data. For Further Reference: (Study Session 15, Module 39.5, LOS 39.k)", "explhtml": "<p>Appraisal lag tends to smooth the reported returns of real estate indices, resulting in an artificially low correlation with other asset classes. Appraisal lag can be mitigated by unsmoothing the index or by using a transaction-based index. Using more-recent appraisals still relies on appraisal-based data.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 15, Module 39.5, LOS 39.k)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 43–48 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 103 through 108 relate to Alternative Investments.<\/p><p>Parkway Terrace Case Scenario<\/p><p>Rita Larson, CFA, is an investment analyst for Siprah Properties, Inc. A group of wealthy investors, Ken Lundy, Chun Park, and Kareem Shabaz, are interested in purchasing Parkway Terrace, a 120-unit luxury apartment complex in Southeastern Florida. The current owners of Parkway Terrace have agreed to sell the property for $40,000,000.<\/p><p>Siprah represents both the existing owners and the potential new owners and are privy to additional information. Exhibit 1 and Exhibit 2 show the information Larson has collected during her due diligence.<\/p><p><b>Exhibit 1: Parkway Terrace Specifics<\/b><\/p><p>Parkway Terrace<\/p><div class=\"tbl\"><table><tr><td>Projected first year net operating income<\/td><td>$3.3 million<\/td><\/tr><tr><td>Location/condition<\/td><td>Prime/good<\/td><\/tr><tr><td>LTV<\/td><td>75.0%<\/td><\/tr><tr><td>Loan term<\/td><td>25 years<\/td><\/tr><tr><td>Loan interest rate<\/td><td>4.5%<\/td><\/tr><tr><td>Monthly debt service<\/td><td>$166,750<\/td><\/tr><tr><td>Square footage<\/td><td>240,000<\/td><\/tr><tr><td>Expected holding period<\/td><td>10 years<\/td><\/tr><tr><td>Parkway Terrace<\/td><td>Cost Estimates<\/td><\/tr><tr><td>Effective age of building<\/td><td>10 years<\/td><\/tr><tr><td>Total economic life<\/td><td>50 years<\/td><\/tr><tr><td>Estimated value of land<\/td><td>$12,500,000<\/td><\/tr><tr><td>Replacement cost (p.s.f.)<\/td><td>$175.00<\/td><\/tr><tr><td>Developer&#x27;s profit (p.s.f.)<\/td><td>$15.00<\/td><\/tr><tr><td>Curable deterioration<\/td><td>$5,000,000<\/td><\/tr><tr><td>Total obsolescence<\/td><td>$4,000,000<\/td><\/tr><tr><td>Expected selling price in 10 yrs<\/td><td>$60,000,000<\/td><\/tr><tr><td>Loan balance at end of 10 yrs<\/td><td>$21,797,543<\/td><\/tr><\/table><\/div><p><b>Exhibit 2: Recent Transactions of Luxury Apartment Buildings in Southeastern Florida<\/b><\/p><div class=\"tbl\"><table><tr><td>Building<\/td><td>Craig Court Kenton Place Hester Oasis<\/td><td><\/td><td><\/td><\/tr><tr><td>Size in square feet<\/td><td>200,000<\/td><td>150,000<\/td><td>300,000<\/td><\/tr><tr><td>Age in years<\/td><td>7<\/td><td>10<\/td><td>13<\/td><\/tr><tr><td>Condition<\/td><td>Fair<\/td><td>Good<\/td><td>Good<\/td><\/tr><tr><td>Location<\/td><td>Prime<\/td><td>Secondary<\/td><td>Secondary<\/td><\/tr><tr><td>Age of transaction (in months)<\/td><td>9<\/td><td>5<\/td><td>16<\/td><\/tr><tr><td>Sales price<\/td><td>$32,000,000<\/td><td>$24,000,000<\/td><td>$45,000,000<\/td><\/tr><tr><td>Projected NOI<\/td><td>$2,560,000<\/td><td>$1,800,000<\/td><td>$3,150,000<\/td><\/tr><\/table><\/div><p><b>Additional information:<\/b><\/p><p>Depreciation is 1.5% per year. Condition can be good, fair, or bad. 7.5% is the adjustment needed per classification. Location can be prime, secondary, or tertiary. Prime locations are the most sought-after and 7.5% is the adjustment needed per classification. Market prices have been increasing at a rate of 0.50% per month.<\/p><p>Lundy states that all returns and ratios must exceed the minimum standards as listed below.<\/p><p>Minimum Requirements<\/p><p>Levered required rate of return 20.0%<\/p><div class=\"tbl\"><table><tr><td>Debt service coverage ratio<\/td><td>1.50X<\/td><\/tr><tr><td>Equity dividend rate<\/td><td>25.0%<\/td><\/tr><\/table><\/div><p>Economic Outlook for Southeast Florida<\/p><p>Home prices are expected to rise. Interest rates are expected to increase. Population growth is expected to be higher than in other areas as more wealthy retirees are moving to the region.<\/p><p>The investors make the following statements about how to best approach this investment:<\/p><div class=\"tbl\"><table><tr><td>Ken Lundy:<\/td><td>&quot;After we buy Parkway Terrace, we should offer shorter leases to take advantage of market<\/td><\/tr><tr><td>conditions.&quot;<\/td><td><\/td><\/tr><tr><td>Chun Park:<\/td><td>&quot;I think that after we buy, we should offer long leases to lock-in tenants and maximize<\/td><\/tr><tr><td>profitability.&quot;<\/td><td><\/td><\/tr><tr><td>Kareem Shabaz:<\/td><td>&quot;If we buy, we should take advantage of the low interest rates by using as much leverage as<\/td><\/tr><tr><td>possible.&quot;<\/td><td><\/td><\/tr><\/table><\/div><p>Larson is interested in using a real estate index in her analysis of suitability of real estate as an asset class for several of Siprah&#x27;s clients. She notes that the firm subscribes to a proprietary index provided by REIQ. The REIQ index is an appraisal-based index that is very popular among real estate professionals. Larson is concerned about appraisal lag in the index and wants to adjust the index to remove this lag.<\/p><\/div><\/details><div class=\"qtext\"><p>To correct for appraisal lag in the REIQ index, which of the following is the least appropriate course of action for Larson?<\/p><\/div>", "subj": "alternatives"}, {"n": 49, "q": "Considering Gomez's statements 1 and 2:", "opts": ["only statement 1 is accurate.", "only statement 2 is accurate.", "both statements are accurate."], "ans": "B", "expl": "ETFs trade on both primary and secondary markets. Primary market trades occur between authorized participants and an ETF sponsor or manager. The ETF manager discloses a list of securities on a daily basis as part of the creation basket. For Further Reference: (Study Session 16, Module 43.1, LOS 43.a)", "explhtml": "<p>ETFs trade on both primary and secondary markets. Primary market trades occur between authorized participants and an ETF sponsor or manager. The ETF manager discloses a list of securities on a daily basis as part of the creation basket.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 16, Module 43.1, LOS 43.a)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Questions 109 through 112 relate to Portfolio Management.<\/p><p>Seva Wolff Case Scenario Seva Wolff has just inherited $1.2 million. She meets with Roberta Gomez, her financial advisor, about changes to her investment policy statement—and hence, her portfolio—due to this major life event.<\/p><p>Gomez recommends that Wolff consider exchange-traded funds (ETFs) for her portfolio and suggests that she can compile a list of ETFs suitable for Wolff.<\/p><p>Wolff is uncertain about this class of investment product and asks several questions. In her response, Gomez makes the following statements:<\/p><p>ETFs represent shares in a portfolio. The fund manager must disclose the holdings on an annual Statement 1: basis.<\/p><div class=\"tbl\"><table><tr><td>Statement 2:<\/td><td>ETFs trade on both primary and secondary markets.<\/td><\/tr><tr><td>Market makers known as authorized participants keep ETF prices in line with a fund&#x27;s NAV per<\/td><td><\/td><\/tr><tr><td>share through a process known as creation/redemption. The costs of creation/redemption are<\/td><td><\/td><\/tr><\/table><\/div><p>Statement 3: borne by all of the fund&#x27;s shareholders.<\/p><p>Relative to traditional mutual funds, ETFs tend to distribute less in capital gains to their Statement 4: shareholders.<\/p><p>Gomez then mentions that Wolff should consider other asset classes that form part of a well-diversified portfolio. She says the expected return on an asset is affected by the investor&#x27;s intertemporal rate of substitution. She makes the following statements:<\/p><p>Typically, the covariance between a risk-averse investor&#x27;s intertemporal rate of substitution and Statement 5: the current asset price is negative.<\/p><p>An investor&#x27;s breakeven inflation rate is the expected future inflation minus the risk premium for Statement 6: future inflation.<\/p><\/div><\/details><div class=\"qtext\"><p>Considering Gomez&#x27;s statements 1 and 2:<\/p><\/div>", "subj": "portfolio"}, {"n": 50, "q": "Considering Gomez's statements 3 and 4:", "opts": ["only statement 3 is accurate.", "only statement 4 is accurate.", "neither statement is accurate."], "ans": "B", "expl": "Authorized participants pass on the creation/redemption costs in the form of bid-ask spreads, which means that only transacting shareholders pay these costs, unlike with mutual funds where all shareholders bear this cost. Similarly, unlike mutual funds, ETFs are tax fair because redemptions are in-kind and do not affect the nontransacting shareholders; hence, capital gains distributions tend to be lower for ETFs compared to traditional mutual funds. For Further Reference: (Study Session 16, Module 43.1, LOS 43.a)", "explhtml": "<p>Authorized participants pass on the creation/redemption costs in the form of bid-ask spreads, which means that only transacting shareholders pay these costs, unlike with mutual funds where all shareholders bear this cost. Similarly, unlike mutual funds, ETFs are tax fair because redemptions are in-kind and do not affect the nontransacting shareholders; hence, capital gains distributions tend to be lower for ETFs compared to traditional mutual funds.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 16, Module 43.1, LOS 43.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 109 through 112 relate to Portfolio Management.<\/p><p>Seva Wolff Case Scenario Seva Wolff has just inherited $1.2 million. She meets with Roberta Gomez, her financial advisor, about changes to her investment policy statement—and hence, her portfolio—due to this major life event.<\/p><p>Gomez recommends that Wolff consider exchange-traded funds (ETFs) for her portfolio and suggests that she can compile a list of ETFs suitable for Wolff.<\/p><p>Wolff is uncertain about this class of investment product and asks several questions. In her response, Gomez makes the following statements:<\/p><p>ETFs represent shares in a portfolio. The fund manager must disclose the holdings on an annual Statement 1: basis.<\/p><div class=\"tbl\"><table><tr><td>Statement 2:<\/td><td>ETFs trade on both primary and secondary markets.<\/td><\/tr><tr><td>Market makers known as authorized participants keep ETF prices in line with a fund&#x27;s NAV per<\/td><td><\/td><\/tr><tr><td>share through a process known as creation/redemption. The costs of creation/redemption are<\/td><td><\/td><\/tr><\/table><\/div><p>Statement 3: borne by all of the fund&#x27;s shareholders.<\/p><p>Relative to traditional mutual funds, ETFs tend to distribute less in capital gains to their Statement 4: shareholders.<\/p><p>Gomez then mentions that Wolff should consider other asset classes that form part of a well-diversified portfolio. She says the expected return on an asset is affected by the investor&#x27;s intertemporal rate of substitution. She makes the following statements:<\/p><p>Typically, the covariance between a risk-averse investor&#x27;s intertemporal rate of substitution and Statement 5: the current asset price is negative.<\/p><p>An investor&#x27;s breakeven inflation rate is the expected future inflation minus the risk premium for Statement 6: future inflation.<\/p><\/div><\/details><div class=\"qtext\"><p>Considering Gomez&#x27;s statements 3 and 4:<\/p><\/div>", "subj": "portfolio"}, {"n": 51, "q": "Gomez's statement 5 is best described as:", "opts": ["correct.", "incorrect about the covariance between the intertemporal rate of substitution and the current asset price.", "incorrect about covariance being a factor in the pricing of securities."], "ans": "B", "expl": "The covariance between a risk-averse investor's intertemporal rate of substitution and expected future price is negative. For Further Reference: (Study Session 17, Module 46.1, LOS 46.c)", "explhtml": "<p>The covariance between a risk-averse investor&#x27;s intertemporal rate of substitution and expected future price is negative.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 17, Module 46.1, LOS 46.c)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"> n": 52, "q": "Gomez's statement 6 is best described as:", "opts": ["correct.", "incorrect, because breakeven inflation is equal to expected inflation plus a risk premium for inflation uncertainty.", "incorrect, because breakeven inflation is equal to expected inflation minus actual inflation."], "ans": "B", "expl": "The breakeven inflation rate equals expected inflation plus a risk premium for inflation uncertainty. For Further Reference: (Study Session 17, Module 46.1, LOS 46.e)", "explhtml": "<p>The breakeven inflation rate equals expected inflation plus a risk premium for inflation uncertainty.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 17, Module 46.1, LOS 46.e)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 109 through 112 relate to Portfolio Management.<\/p><p>Seva Wolff Case Scenario Seva Wolff has just inherited $1.2 million. She meets with Roberta Gomez, her financial advisor, about changes to her investment policy statement—and hence, her portfolio—due to this major life event.<\/p><p>Gomez recommends that Wolff consider exchange-traded funds (ETFs) for her portfolio and suggests that she can compile a list of ETFs suitable for Wolff.<\/p><p>Wolff is uncertain about this class of investment product and asks several questions. In her response, Gomez makes the following statements:<\/p><p>ETFs represent shares in a portfolio. The fund manager must disclose the holdings on an annual Statement 1: basis.<\/p><div class=\"tbl\"><table><tr><td>Statement 2:<\/td><td>ETFs trade on both primary and secondary markets.<\/td><\/tr><tr><td>Market makers known as authorized participants keep ETF prices in line with a fund&#x27;s NAV per<\/td><td><\/td><\/tr><tr><td>share through a process known as creation/redemption. The costs of creation/redemption are<\/td><td><\/td><\/tr><\/table><\/div><p>Statement 3: borne by all of the fund&#x27;s shareholders.<\/p><p>Relative to traditional mutual funds, ETFs tend to distribute less in capital gains to their Statement 4: shareholders.<\/p><p>Gomez then mentions that Wolff should consider other asset classes that form part of a well-diversified portfolio. She says the expected return on an asset is affected by the investor&#x27;s intertemporal rate of substitution. She makes the following statements:<\/p><p>Typically, the covariance between a risk-averse investor&#x27;s intertemporal rate of substitution and Statement 5: the current asset price is negative.<\/p><p>An investor&#x27;s breakeven inflation rate is the expected future inflation minus the risk premium for Statement 6: future inflation.<\/p><\/div><\/details><div class=\"qtext\"><p>Gomez&#x27;s statement 6 is best described as:<\/p><\/div>", "subj": "portfolio"}, {"n": 53, "q": "Using information in Limit order book for SIVP , the inside spread per share is closest to:", "opts": ["$0.04.", "$0.08.", "$0.12."], "ans": "A", "expl": "The best (i.e., highest) bid is $12.22, and the best (i.e., lowest) ask is $12.26. inside spread = best ask – best bid = $12.26 – $12.22 = $0.04. For Further Reference: (Study Session 17, Module 48.1, LOS 48.b)", "explhtml": "<p>The best (i.e., highest) bid is $12.22, and the best (i.e., lowest) ask is $12.26.<\/p><p>inside spread = best ask – best bid = $12.26 – $12.22 = $0.04.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 17, Module 48.1, LOS 48.b)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 53–56 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Questions 113 through 116 relate to Portfolio Management.<\/p><p>Faver Asset Management Case Scenario<\/p><p>Brendan Mollie is a summer intern at Faver Asset Management. He is currently learning about the trading systems used at Faver. As part of his orientation, Sean McDermott, the head ime interval between<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>the order being placed and executed. The weights used are based on the number of shares in<\/td><\/tr><tr><td>each trade.<\/td><td><\/td><\/tr><tr><td>VWAP is not useful if the trade being evaluated is a significant part of the trading volume. VWAP,<\/td><td><\/td><\/tr><\/table><\/div><p>Statement 2: however, does account for the price impact cost.<\/p><\/div><\/details><div class=\"qtext\"><p>For a purchase transaction at a price of $12.27, and using dealer B quotes, the effective spread per share on the trade is closest to:<\/p><\/div>", "subj": "portfolio"}, {"n": 55, "q": "McDermott's statement 1 is most likely:", "opts": ["correct.", "incorrect about weighted average price during the time interval between the order being placed and executed.", "incorrect about weights being based on the number of shares of each trade."], "ans": "C", "expl": "VWAP is the weighted average price at which all trades were executed during the time interval between the order being placed and executed. The weights used are based on the dollar volume of each trade. For Further Reference: (Study Session 17, Module 48.1, LOS 48.b)", "explhtml": "<p>VWAP is the weighted average price at which all trades were executed during the time interval between the order being placed and executed. The weights used are based on the dollar volume of each trade.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 17, Module 48.1, LOS 48.b)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 53–56 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 113 through 116 relate to Portfolio Management.<\/p><p>Faver Asset Management Case Scenario<\/p><p>Brendan Mollie is a summer intern at Faver Asset Management. He is currently learning about the trading systems used at Faver. As part of his orientation, Sean McDermott, the head trader at Faver, provides a printout to Mollie as shown in Limit order book for SIVP .<\/p><p>Limit order book for SIVP<\/p><div class=\"tbl\"><table><tr><td>Bids<\/td><td>Asks<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Dealer Time Entered Price<\/td><td>Size<\/td><td>Dealer Time Entered Price<\/td><td>Size<\/td><td><\/td><td><\/td><\/tr><tr><td>A<\/td><td>11:29 am<\/td><td>12.22 2,500<\/td><td>C<\/td><td>9:31 am<\/td><td>12.26 1,500<\/td><\/tr><tr><td>B<\/td><td>11:39 am<\/td><td>12.21 2,000<\/td><td>A<\/td><td>9:31 am<\/td><td>12.28 2,500<\/td><\/tr><tr><td>C<\/td><td>11:43 am<\/td><td>12.20 3,000<\/td><td>B<\/td><td>9:41 am<\/td><td>12.31 3,000<\/td><\/tr><\/table><\/div><p>McDermott states that Faver evaluates execution quality using effective spread and volume weighted average price (VWAP) benchmarks. McDermott makes the following statements:<\/p><p>VWAP is the weighted average price of all the trades executed during the time interval between<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>the order being placed and executed. The weights used are based on the number of shares in<\/td><\/tr><tr><td>each trade.<\/td><td><\/td><\/tr><tr><td>VWAP is not useful if the trade being evaluated is a significant part of the trading volume. VWAP,<\/td><td><\/td><\/tr><\/table><\/div><p>Statement 2: however, does account for the price impact cost.<\/p><\/div><\/details><div class=\"qtext\"><p>McDermott&#x27;s statement 1 is most likely:<\/p><\/div>", "subj": "portfolio"}, {"n": 56, "q": "McDermott's statement 2 is best described as:", "opts": ["correct.", "incorrect about VWAP not being useful if the trade being evaluated is a significant part of the trading volume.", "incorrect about VWAP accounting for the price impact cost."], "ans": "C", "expl": "VWAP is not useful if the trade being evaluated is a significant part of the trading volume. In such cases, the benchmark VWAP and the trade VWAP will be close to each other, and the measured transaction cost will be skewed toward zero. VWAP does not capture the price impact cost. For example, if a large buy order was the only trade that was executed during a time interval at a price above the normal trading price, the benchmark VWAP will then be identical to the trade VWAP, and the calculated transaction cost will be zero. However, the trade was not executed at a good price. For Further Reference: (Study Session 17, Module 48.1, LOS 48.b)", "explhtml": "<p>VWAP is not useful if the trade being evaluated is a significant part of the trading volume. In such cases, the benchmark VWAP and the trade VWAP will be close to each other, and the measured transaction cost will be skewed toward zero. VWAP does not capture the price impact cost. For example, if a large buy order was the only trade that was executed during a time interval at a price above the normal trading price, the benchmark VWAP will then be identical to the trade VWAP, and the calculated transaction cost will be zero. However, the trade was not executed at a good price.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 17, Module 48.1, LOS 48.b)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 53–56 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 113 through 116 relate to Portfolio Management.<\/p><p>Faver Asset Management Case Scenario<\/p><p>Brendan Mollie is a summer intern at Faver Asset Management. He is currently learning about the trading systems used at Faver. As part of his orientation, Sean McDermott, the head trader at Faver, provides a printout to Mollie as shown in Limit order book for SIVP .<\/p><p>Limit order book for SIVP<\/p><div class=\"tbl\"><table><tr><td>Bids<\/td><td>Asks<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Dealer Time Entered Price<\/td><td>Size<\/td><td>Dealer Time Entered Price<\/td><td>Size<\/td><td><\/td><t
