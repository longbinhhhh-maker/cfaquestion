<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

<script>
const DATA = [{"n": 1, "q": "Did the marketing materials presented to Crossley by Burton violate Standard III(D) Performance Presentation or Standard VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program?", "opts": ["Standard III(D) only.", "Standard VII(B) only.", "Both Standard III(D) and Standard VII(B) are violated."], "ans": "A", "expl": "By implying that the composite's past performance is representative of future performance, Burton is in violation of Standard III(D) Performance Presentation. A member or candidate should give a fair and complete presentation of performance and not state or imply that clients will obtain a rate of return that was generated in the past. Burton's references to the CFA program in his marketing materials were acceptable according Standard VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program. The Standard states that members and candidates may make references to the rigor of the program and the commitment of members and candidates to ethical and professional standards. However, statements must not exaggerate the meaning or implications of the designation, membership in CFA Institute, or candidacy. For Further Reference: (Study Session 1, Module 2.6, LOS 2.a)", "explhtml": "<p>By implying that the composite&#x27;s past performance is representative of future performance, Burton is in violation of Standard III(D) Performance Presentation. A member or candidate should give a fair and complete presentation of performance and not state or imply that clients will obtain a rate of return that was generated in the past.<\/p><p>Burton&#x27;s references to the CFA program in his marketing materials were acceptable according Standard VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program. The Standard states that members and candidates may make references to the rigor of the program and the commitment of members and candidates to ethical and professional standards. However, statements must not exaggerate the meaning or implications of the designation, membership in CFA Institute, or candidacy.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.6, LOS 2.a)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<\/summary><div class=\"vig-body\"><p>Questions 61 through 66 relate to Ethical and Professional Standards.<\/p><p>United Partners Case Scenario<\/p><p>Connor Burton, CFA, is the managing partner for United Partners, a small investment advisory firm that employs three investment professionals and currently has approximately $250 million of assets under management. The client base of United Partners is varied, and accounts range in size from small retirement accounts to a $30 million private school endowment. In addition to Burton&#x27;s administrative responsibilities as the managing partner at United, he also serves as an investment advisor to several clients. Because United Partners is a small firm, the company does not employ any research analysts but instead obtains its investment research products and services from two national brokerage firms, which in turn execute all client trades for United Partners. The arrangement with the two brokers has enabled United to assure its clients that the firm will always seek the best execution for them by having both brokers competitively bid for United&#x27;s business.<\/p><p>A prospective client, Harold Crossley, has approached Burton about shifting some of his personal assets under management from MoneyCorp to United Partners. Burton provides Crossley with a packet of marketing information that Burton developed himself. The packet contains five years of historical performance data for a value weighted composite of the firm&#x27;s discretionary accounts. Burton states that the composite&#x27;s management style and performance results are representative of the management style and returns that United can be expected to achieve for Crossley. Also included in the information packet are brief bios on each of United&#x27;s three investment professionals. Crossley notices that all three of United&#x27;s investment professionals are described as &quot;CFA charterholders,&quot; but he is not familiar with the designation. In response to Crossley&#x27;s inquiry, Burton explains the significance of the program by stating that the designation, which is only awarded after passing three rigorous exams and obtaining the requisite years of work experience, represents a commitment to the highest standards of ethical and professional conduct.<\/p><p>As a condition of moving his account to United Partners, Crossley insists that all of his trades be executed through his brother-in-law, a broker for Security Bank. Security Bank is a large, New York-based broker/dealer but is not one of the two brokerage firms with which United currently does business. Burton contacts Crossley&#x27;s brother-in-law and determines that Security Bank&#x27;s trade execution is competitive, but Crossley&#x27;s account alone would not generate enough volume to warrant any soft dollar arrangement for research materials. However, Crossley&#x27;s brother-in-law does offer for Security Bank to pay a referral fee to Burton for directing any of United&#x27;s clients to Security Bank&#x27;s retail banking division. To bring Crossley on as a client, Burton agrees to the arrangement. Going forward, Burton will use Security Bank to execute all of Crossley&#x27;s trades.<\/p><p>United Partners currently has no formal policy on proxy voting. Burton wants to develop a policy that conforms to the Code and Standards. Several months later, Burton is invited to a road show for an initial public offering (IPO) for SolutionWare, a software company. Security Bank is serving as lead underwriter on SolutionWare&#x27;s IPO. Burton attends the meeting, which is led by two investment bankers and one software industry research analyst from Security Bank who covers SolutionWare. Burton notes that the bankers from Security Bank have included detailed financial statements for SolutionWare in the offering prospectus and also disclosed that Security Bank provides a warehouse line of credit to SolutionWare. After the meeting, Burton calls Crossley to recommend the purchase of SolutionWare equity. Crossley heeds Burton&#x27;s advice and tells him to purchase 5,000 shares. Before placing Crossley&#x27;s order, Burton reads the SolutionWare marketing materials and performs a detailed analysis of expected future earnings and other key factors for the investment decision. Burton determines that the offering would be a suitable investment for his own retirement portfolio. United Partners, being a small firm, has no formal written policy regarding trade allocation, employee participation in equity offerings, or established blackout periods for employee trading. Burton adds his order to Crossley&#x27;s order and places a purchase order for the combined number of shares with Security Bank. Burton is later notified that the offering was oversubscribed, and United Partners was only able to obtain roughly 75% of the desired number of shares. To be fair, Burton allocates the shares on a pro-rata basis between Crossley&#x27;s account and his own retirement account. When Burton notifies Crossley of the situation, Crossley is nonetheless pleased to have a position, though smaller than requested, in such a &quot;hot&quot; offering.<\/p><\/div><\/details><div class=\"qtext\"><p>Did the marketing materials presented to Crossley by Burton violate Standard III(D) Performance Presentation or Standard VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program?<\/p><\/div>", "subj": "ethics"}, {"n": 2, "q": "According to the CFA Institute Standards of Professional Conduct, the trading arrangement between Burton and Security Bank is most likely:", "opts": ["a violation because the practice of directed brokerage rmines that Security Bank&#x27;s trade execution is competitive, but Crossley&#x27;s account alone would not generate enough volume to warrant any soft dollar arrangement for research materials. However, Crossley&#x27;s brother-in-law does offer for Security Bank to pay a referral fee to Burton for directing any of United&#x27;s clients to Security Bank&#x27;s retail banking division. To bring Crossley on as a client, Burton agrees to the arrangement. Going forward, Burton will use Security Bank to execute all of Crossley&#x27;s trades.<\/p><p>United Partners currently has no formal policy on proxy voting. Burton wants to develop a policy that conforms to the Code and Standards. Several months later, Burton is invited to a road show for an initial public offering (IPO) for SolutionWare, a software company. Security Bank is serving as lead underwriter on SolutionWare&#x27;s IPO. Burton attends the meeting, which is led by two investment bankers and one software industry research analyst from Security Bank who covers SolutionWare. Burton notes that the bankers from Security Bank have included detailed financial statements for SolutionWare in the offering prospectus and also disclosed that Security Bank provides a warehouse line of credit to SolutionWare. After the meeting, Burton calls Crossley to recommend the purchase of SolutionWare equity. Crossley heeds Burton&#x27;s advice and tells him to purchase 5,000 shares. Before placing Crossley&#x27;s order, Burton reads the SolutionWare marketing materials and performs a detailed analysis of expected future earnings and other key factors for the investment decision. Burton determines that the offering would be a suitable investment for his own retirement portfolio. United Partners, being a small firm, has no formal written policy regarding trade allocation, employee participation in equity offerings, or established blackout periods for employee trading. Burton adds his order to Crossley&#x27;s order and places a purchase order for the combined number of shares with Security Bank. Burton is later notified that the offering was oversubscribed, and United Partners was only able to obtain roughly 75% of the desired number of shares. To be fair, Burton allocates the shares on a pro-rata basis between Crossley&#x27;s account and his own retirement account. When Burton notifies Crossley of the situation, Crossley is nonetheless pleased to have a position, though smaller than requested, in such a &quot;hot&quot; offering.<\/p><\/div><\/details><div class=\"qtext\"><p>According to the CFA Institute Standards of Professional Conduct, the trading arrangement between Burton and Security Bank is most likely:<\/p><\/div>", "subj": "ethics"}, {"n": 3, "q": "According to CFA Institute Standards of Professional Conduct, which of the following statements best describes the circumstances under which Burton may enter into the referral agreement with Security Bank? Burton may enter into the agreement:", "opts": ["under no circumstances.", "only after receiving written permission from clients.", "only after fully disclosing the referral arrangement to clients and prospective clients."], "ans": "C", "expl": "Standard VI(C) Referral Fees states that members and candidates must disclose to their clients and prospective clients any compensation or benefit received for the recommendation of services. In this case, Burton may accept a referral fee if he discloses it to the client so that the client may evaluate any partiality shown in the recommendation. For Further Reference: (Study Session 1, Module 2.9, LOS 2.a)", "explhtml": "<p>Standard VI(C) Referral Fees states that members and candidates must disclose to their clients and prospective clients any compensation or benefit received for the recommendation of services. In this case, Burton may accept a referral fee if he discloses it to the client so that the client may evaluate any partiality shown in the recommendation.<\/p><p><b>For Further Reference:<\ led financial statements for SolutionWare in the offering prospectus and also disclosed that Security Bank provides a warehouse line of credit to SolutionWare. After the meeting, Burton calls Crossley to recommend the purchase of SolutionWare equity. Crossley heeds Burton&#x27;s advice and tells him to purchase 5,000 shares. Before placing Crossley&#x27;s order, Burton reads the SolutionWare marketing materials and performs a detailed analysis of expected future earnings and other key factors for the investment decision. Burton determines that the offering would be a suitable investment for his own retirement portfolio. United Partners, being a small firm, has no formal written policy regarding trade allocation, employee participation in equity offerings, or established blackout periods for employee trading. Burton adds his order to Crossley&#x27;s order and places a purchase order for the combined number of shares with Security Bank. Burton is later notified that the offering was oversubscribed, and United Partners was only able to obtain roughly 75% of the desired number of shares. To be fair, Burton allocates the shares on a pro-rata basis between Crossley&#x27;s account and his own retirement account. When Burton notifies Crossley of the situation, Crossley is nonetheless pleased to have a position, though smaller than requested, in such a &quot;hot&quot; offering.<\/p><\/div><\/details><div class=\"qtext\"><p>According to CFA Institute Standards of Professional Conduct, which of the following statements best describes the circumstances under which Burton may enter into the referral agreement with Security Bank? Burton may enter into the agreement:<\/p><\/div>", "subj": "ethics"}, {"n": 4, "q": "When formulating the proxy voting policy, which of the following is least appropriate for Burton to include?", "opts": ["Determine the economic impact of non-routine proxy votes.", "Treat all proposals equally as far as proxy voting goes.", "If the client preference differs from the proxy voter's preference, defer to client wishes."], "ans": "B", "expl": "Standard III(A) Loyalty, Prudence, and Care. Unusual proposals, such as hostile takeovers and executive changes, may require more review than routine matters such as renewing stock-repurchase agreements. Money managers should provide a means to review complex proxies. Establishing evaluation criteria and disclosing the firm's proxy voting policies and procedures to clients are basic elements of a proxy-voting policy. Client wishes regarding proxy voting should always be followed. For Further Reference: (Study Session 1, Module 2.4, LOS 2.a)", "explhtml": "<p>Standard III(A) Loyalty, Prudence, and Care. Unusual proposals, such as hostile takeovers and executive changes, may require more review than routine matters such as renewing stock-repurchase agreements. Money managers should provide a means to review complex proxies. Establishing evaluation criteria and disclosing the firm&#x27;s proxy voting policies and procedures to clients are basic elements of a proxy-voting policy. Client wishes regarding proxy voting should always be followed.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.4, LOS 2.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 61 through 66 relate to Ethical and Professional Standards.<\/p><p>United Partners Case Scenario<\/p><p>Connor Burton, CFA, is the managing partner for United Partners, a small investment advisory firm that employs three investment professionals and currently has approximately $250 million of assets under management. The client base of United Partners is varied, and accounts range in size from small retirement accounts to a $30 million private school endowment. In addition to Burton&#x27;s administrative responsibilities as the managing partner at United, he also serves as an investment advisor to several clients. Because United Partners is a small firm, the company does not employ any research analysts but instead obtains its investment research products and services from two national brokerage firms, which in turn execute all client trades for United Partners. The arrangement with the two brokers has enabled United to assure its clients that the firm will always seek the best execution for them by having both brokers competitively bid for United&#x27;s business.<\/p><p>A prospective client, Harold Crossley, has approached Burton about shifting some of his personal assets under management from MoneyCorp to United Partners. Burton provides Crossley with a packet of marketing information that Burton developed himself. The packet contains five years of historical performance data for a value weighted composite of the firm&#x27;s discretionary accounts. Burton states that the composite&#x27;s management style and performance results are representative of the management style and returns that United can be expected to achieve for Crossley. Also included in the information packet are brief bios on each of United&#x27;s three investment professionals. Crossley notices that all three of United&#x27;s investment professionals are described as &quot;CFA charterholders,&quot; but he is not familiar with the designation. In response to Crossley&#x27;s inquiry, Burton explains the significance of the program by stating that the designation, which is only awarded after passing three rigorous exams and obtaining the requisite years of work experience, represents a commitment to the highest standards of ethical and professional conduct.<\/p><p>As a condition of moving his account to United Partners, Crossley insists that all of his trades be executed through his brother-in-law, a broker for Security Bank. Security Bank is a large, New York-based broker/dealer but is not one of the two brokerage firms with which United currently does business. Burton contacts Crossley&#x27;s brother-in-law and determines that Security Bank&#x27;s trade execution is competitive, but Crossley&#x27;s account alone would not generate enough volume to warrant any soft dollar arrangement for research materials. However, Crossley&#x27;s brother-in-law does offer for Security Bank to pay a referral fee to Burton for directing any of United&#x27;s clients to Security Bank&#x27;s retail banking division. To bring Crossley on as a client, Burton agrees to the arrangement. Going forward, Burton will use Security Bank to execute all of Crossley&#x27;s trades.<\/p><p>United Partners currently has no formal policy on proxy voting. Burton wants to develop a policy that conforms to the Code and Standards. Several months later, Burton is invited to a road show for an initial public offering (IPO) for SolutionWare, a software company. Security Bank is serving as lead underwriter on SolutionWare&#x27;s IPO. Burton attends the meeting, which is led by two investment bankers and one software industry research analyst from Security Bank who covers SolutionWare. Burton notes that the bankers from Security Bank have included detailed financial statements for SolutionWare in the offering prospectus and also disclosed that Security Bank provides a warehouse line of credit to SolutionWare. After the meeting, Burton calls Crossley to recommend the purchase of SolutionWare equity. Crossley heeds Burton&#x27;s advice and tells him to purchase 5,000 shares. Before placing Crossley&#x27;s order, Burton reads the SolutionWare marketing materials and performs a detailed analysis of expected future earnings and other key factors for the investment decision. Burton determines that the offering would be a suitable investment for his own retirement portfolio. United Partners, being a small firm, has no formal written policy regarding trade allocation, employee participation in equity offerings, or established blackout periods for employee trading. Burton adds his order to Crossley&#x27;s order and places a purchase order for the combined number of shares with Security Bank. Burton is later notified that the offering was oversubscribed, and United Partners was only able to obtain roughly 75% of the desired number of shares. To be fair, Burton allocates the shares on a pro-rata basis between Crossley&#x27;s account and his own retirement account. When Burton notifies Crossley of the situation, Crossley is nonetheless pleased to have a position, though smaller than requested, in such a &quot;hot&quot; offering.<\/p><\/div><\/details><div class=\"qtext\"><p>When formulating the proxy voting policy, which of the following is least appropriate for Burton to include?<\/p><\/div>", "subj": "ethics"}, {"n": 5, "q": "According to CFA Institute Standards of Professional Conduct, Burton's recommendation to Crossley that he purchase shares of the SolutionWare initial public offering is most likely:", "opts": ["in violation of Standard III(C) Suitability for not determining the appropriateness of the investment for the portfolio and Standard I(B) Independence and Objectivity for not making the investment recommendation to all of his clients at the same time.", "in violation of Standard V(A) Diligence and Reasonable Basis for not thoroughly analyzing the investment before making a recommendation and in violation of Standard III(C) Suitability for not determining the appropriateness of the investment for the portfolio.", "in violation of Standard V(A) Diligence and Reasonable Basis for not thoroughly analyzing the investment before making a recommendation and in violation of Standard I(B) Independence and Objectivity for not making the investment recommendation to all of his clients at the same time."], "ans": "B", "expl": "Standard V(A) Diligence and Reasonable Basis states that the member or candidate must exercise diligence, independence, and thoroughness before making an investment recommendation. The Standard also requires that members and candidates have a reasonable and adequate basis supported by research and investigation for any investment recommendations or actions. Burton made his purchase recommendation to Crossley purely on the basis of the Security Bank road show and did not perform his own evaluation to determine whether or not the SolutionWare IPO was a good investment opportunity. Burton has therefore violated Standard V(A). Standard III(C) Suitability was also violated because there is no indication that Burton made any effort to determine if the investment was appropriate for Crossley's portfolio. Burton should have determined that the investment was consistent with Crossley's written objectives and constraints before he recommended the investment. Even though he later determined that the investment was suitable, he did not know this was the case before he told Crossley that he should purchase shares in the IPO. Standard III(B) Fair Dealing (and not I(B) Independence and Objectivity) would also be violated if Burton did not afford all the clients for whom the IPO was suitable to participate in the offering. Standard III(B) Fair Dealing (and not standard I(B)) would also be violated if Burton did not extend IPO participation to all portfolios meeting suitability criteria. For Further Reference: (Study Session 1, Module 2.8, LOS 2.a)", "explhtml": "<p>Standard V(A) Diligence and Reasonable Basis states that the member or candidate must exercise diligence, independence, and thoroughness before making an investment recommendation. The Standard also requires that members and candidates have a reasonable and adequate basis supported by research and investigation for any investment recommendations or actions. Burton made his purchase recommendation to Crossley purely on the basis of the Security Bank road show and did not perform his own evaluation to determine whether or not the SolutionWare IPO was a good investment opportunity. Burton has therefore violated Standard V(A). Standard III(C) Suitability was also violated because there is no indication that Burton made any effort to determine if the investment was appropriate for Crossley&#x27;s portfolio. Burton should have determined that the investment was consistent with Crossley&#x27;s written objectives and constraints before he recommended the investment. Even though he later determined that the investment was suitable, he did not know this was the case before he told Crossley that he should purchase shares in the IPO. Standard III(B) Fair Dealing (and not I(B) Independence and Objectivity) would also be violated if Burton did not afford all the clients for whom the IPO was suitable to participate in the offering. Standard III(B) Fair Dealing (and not standard I(B)) would also be violated if Burton did not extend IPO participation to all portfolios meeting suitability criteria.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.8, LOS 2.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 61 through 66 relate to Ethical and Professional Standards.<\/p><p>United Partners Case Scenario<\/p><p>Connor Burton, CFA, is the managing partner for United Partners, a small investment advisory firm that employs three investment professionals and currently has approximately $250 million of assets under management. The client base of United Partners is varied, and accounts range in size from small retirement accounts to a $30 million private school endowment. In addition to Burton&#x27;s administrative responsibilities as the managing partner at United, he also serves as an investment advisor to several clients. Because United Partners is a small firm, the company does not employ any research analysts but instead obtains its investment research products and services from two national brokerage firms, which in turn execute all client trades for United Partners. The arrangement with the two brokers has enabled United to assure its clients that the firm will always seek the best execution for them by having both brokers competitively bid for United&#x27;s business.<\/p><p>A prospective client, Harold Crossley, has approached Burton about shifting some of his personal assets under management from MoneyCorp to United Partners. Burton provides Crossley with a packet of marketing information that Burton developed himself. The packet contains five years of historical performance data for a value weighted composite of the firm&#x27;s discretionary accounts. Burton states that the composite&#x27;s management style and performance results are representative of the management style and returns that United can be expected to achieve for Crossley. Also included in the information packet are brief bios on each of United&#x27;s three investment professionals. Crossley notices that all three of United&#x27;s investment professionals are described as &quot;CFA charterholders,&quot; but he is not familiar with the designation. In response to Crossley&#x27;s inquiry, Burton explains the significance of the program by stating that the designation, which is only awarded after passing three rigorous exams and obtaining the requisite years of work experience, represents a commitment to the highest standards of ethical and professional conduct.<\/p><p>As a condition of moving his account to United Partners, Crossley insists that all of his trades be executed through his brother-in-law, a broker for Security Bank. Security Bank is a large, New York-based broker/dealer but is not one of the two brokerage firms with which United currently does business. Burton contacts Crossley&#x27;s brother-in-law and determines that Security Bank&#x27;s trade execution is competitive, but Crossley&#x27;s account alone would not generate enough volume to warrant any soft dollar arrangement for research materials. However, Crossley&#x27;s brother-in-law does offer for Security Bank to pay a referral fee to Burton for directing any of United&#x27;s clients to Security Bank&#x27;s retail banking division. To bring Crossley on as a client, Burton agrees to the arrangement. Going forward, Burton will use Security Bank to execute all of Crossley&#x27;s trades.<\/p><p>United Partners currently has no formal policy on proxy voting. Burton wants to develop a policy that conforms to the Code and Standards. Several months later, Burton is invited to a road show for an initial public offering (IPO) for SolutionWare, a software company. Security Bank is serving as lead underwriter on SolutionWare&#x27;s IPO. Burton attends the meeting, which is led by two investment bankers and one software industry research analyst from Security Bank who covers SolutionWare. Burton notes that the bankers from Security Bank have included detailed financial statements for SolutionWare in the offering prospectus and also disclosed that Security Bank provides a warehouse line of credit to SolutionWare. After the meeting, Burton calls Crossley to recommend the purchase of SolutionWare equity. Crossley heeds Burton&#x27;s advice and tells him to purchase 5,000 shares. Before placing Crossley&#x27;s order, Burton reads the SolutionWare marketing materials and performs a detailed analysis of expected future earnings and other key factors for the investment decision. Burton determines that the offering would be a suitable investment for his own retirement portfolio. United Partners, being a small firm, has no formal written policy regarding trade allocation, employee participation in equity offerings, or established blackout periods for employee trading. Burton adds his order to Crossley&#x27;s order and places a purchase order for the combined number of shares with Security Bank. Burton is later notified that the offering was oversubscribed, and United Partners was only able to obtain roughly 75% of the desired number of shares. To be fair, Burton allocates the shares on a pro-rata basis between Crossley&#x27;s account and his own retirement account. When Burton notifies Crossley of the situation, Crossley is nonetheless pleased to have a position, though smaller than requested, in such a &quot;hot&quot; offering.<\/p><\/div><\/details><div class=\"qtext\"><p>According to CFA Institute Standards of Professional Conduct, Burton&#x27;s recommendation to Crossley that he purchase shares of the SolutionWare initial public offering is most likely:<\/p><\/div>", "subj": "ethics"}, {"n": 6, "q": "According to CFA Institute Standards of Professional Conduct, Burton's participation in the SolutionWare offering most likely:", "opts": ["is in violation of the Standards because his actions adversely affected the interests of Crossley.", "is in violation of the Standards because he did not disclose his participation in the offering to Security Bank.", "is not in violation of the Standards since the shares obtained in the IPO were distributed equitably on a pro-rata basis."], "ans": "A", "expl": "Standard VI(B) Priority of Transactions clearly states that investment transactions for clients must have priority over members' and candidates' transactions. Members and candidates can profit from personal investments as long as the client is not disadvantaged by the trade. By taking a portion of the IPO shares for his own account, Burton has ensured that Crossley's order will not be completely filled. It does not matter that the trade allocation was done on a pro-rata basis; Burton should have placed his client's transaction ahead of his own. For Further Reference: (Study Session 1, Module 2.9, LOS 2.a)", "explhtml": "<p>Standard VI(B) Priority of Transactions clearly states that investment transactions for clients must have priority over members&#x27; and candidates&#x27; transactions. Members and candidates can profit from personal investments as long as the client is not disadvantaged by the trade. By taking a portion of the IPO shares for his own account, Burton has ensured that Crossley&#x27;s order will not be completely filled. It does not matter that the trade allocation was done on a pro-rata basis; Burton should have placed his client&#x27;s transaction ahead of his own.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 1, Module 2.9, LOS 2.a)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–6 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 61 through 66 relate to Ethical and Professional Standards.<\/p><p>United Partners Case Scenario<\/p><p>Connor Burton, CFA, is the managing partner for United Partners, a small investment advisory firm that employs three investment professionals and currently has approximately $250 million of assets under management. The client base of United Partners is varied, and accounts range in size from small retirement accounts to a $30 million private school endowment. In addition to Burton&#x27;s administrative responsibilities as the managing partner at United, he also serves as an investment advisor to several clients. Because United Partners is a small firm, the company does not employ any research analysts but instead obtains its investment research products and services from two national brokerage firms, which in turn execute all client trades for United Partners. The arrangement with the two brokers has enabled United to assure its clients that the firm will always seek the best execution for them by having both brokers competitively bid for United&#x27;s business.<\/p><p>A prospective client, Harold Crossley, has approached Burton about shifting some of his personal assets under management from MoneyCorp to United Partners. Burton provides Crossley with a packet of marketing information that Burton developed himself. The packet contains five years of historical performance data for a value weighted composite of the firm&#x27;s discretionary accounts. Burton states that the composite&#x27;s management style and performance results are representative of the management style and returns that United can be expected to achieve for Crossley. Also included in the information packet are brief bios on each of United&#x27;s three investment professionals. Crossley notices that all three of United&#x27;s investment professionals are described as &quot;CFA charterholders,&quot; but he is not familiar with the designation. In response to Crossley&#x27;s inquiry, Burton explains the significance of the program by stating that the designation, which is only awarded after passing three rigorous exams and obtaining the requisite years of work experience, represents a commitment to the highest standards of ethical and professional conduct.<\/p><p>As a condition of moving his account to United Partners, Crossley insists that all of his trades be executed through his brother-in-law, a broker for Security Bank. Security Bank is a large, New York-based broker/dealer but is not one of the two brokerage firms with which United currently does business. Burton contacts Crossley&#x27;s brother-in-law and determines that Security Bank&#x27;s trade execution is competitive, but Crossley&#x27;s account alone would not generate enough volume to warrant any soft dollar arrangement for research materials. However, Crossley&#x27;s brother-in-law does offer for Security Bank to pay a referral fee to Burton for directing any of United&#x27;s clients to Security Bank&#x27;s retail banking division. To bring Crossley on as a client, Burton agrees to the arrangement. Going forward, Burton will use Security Bank to execute all of Crossley&#x27;s trades.<\/p><p>United Partners currently has no formal policy on proxy voting. Burton wants to develop a policy that conforms to the Code and Standards. Several months later, Burton is invited to a road show for an initial public offering (IPO) for SolutionWare, a software company. Security Bank is serving as lead underwriter on SolutionWare&#x27;s IPO. Burton attends the meeting, which is led by two investment bankers and one software industry research analyst from Security Bank who covers SolutionWare. Burton notes that the bankers from Security Bank have included detailed financial statements for SolutionWare in the offering prospectus and also disclosed that Security Bank provides a warehouse line of credit to SolutionWare. After the meeting, Burton calls Crossley to recommend the purchase of SolutionWare equity. Crossley heeds Burton&#x27;s advice and tells him to purchase 5,000 shares. Before placing Crossley&#x27;s order, Burton reads the SolutionWare marketing materials and performs a detailed analysis of expected future earnings and other key factors for the investment decision. Burton determines that the offering would be a suitable investment for his own retirement portfolio. United Partners, being a small firm, has no formal written policy regarding trade allocation, employee participation in equity offerings, or established blackout periods for employee trading. Burton adds his order to Crossley&#x27;s order and places a purchase order for the combined number of shares with Security Bank. Burton is later notified that the offering was oversubscribed, and United Partners was only able to obtain roughly 75% of the desired number of shares. To be fair, Burton allocates the shares on a pro-rata basis between Crossley&#x27;s account and his own retirement account. When Burton notifies Crossley of the situation, Crossley is nonetheless pleased to have a position, though smaller than requested, in such a &quot;hot&quot; offering.<\/p><\/div><\/details><div class=\"qtext\"><p>According to CFA Institute Standards of Professional Conduct, Burton&#x27;s participation in the SolutionWare offering most likely:<\/p><\/div>", "subj": "ethics"}, {"n": 7, "q": "Which of the following models would be the best formulation for the Canadian retail sales data?", "opts": ["X  = b  + b X . t t–1", "X  = b X + b X . t 1 t–1 2 t–12", "X  = b  + b X + b X . t 0 1 t–1 2 t–12"], "ans": "C", "expl": "The best formulation for Smith's retail sales data would include the intercept, the lag 1 coefficient, and the lag 12 coefficient. First, note that in the second regression, all of these are statistically significant, with a p-value of less than 1%. Also, the second regression that included the lag 12 term has a higher adjusted R-square at 0.92 compared to 0.83 in the first regression that omits the lag 12 term. Lastly, we should suspect that the lag 12 term is appropriate because this is seasonal, monthly data. We could have also looked at the significance of the autocorrelations if they had been provided. If any are significant in either regression, another lag term would be added to the autoregressive model. For Further Reference: (Study Session 2, Module 6.2, LOS 6.d, 6.l)", "explhtml": "<p>The best formulation for Smith&#x27;s retail sales data would include the intercept, the lag 1 coefficient, and the lag 12 coefficient. First, note that in the second regression, all of these are statistically significant, with a p-value of less than 1%. Also, the second regression that included the lag 12 term has a higher adjusted R-square at 0.92 compared to 0.83 in the first regression that omits the lag 12 term. Lastly, we should suspect that the lag 12 term is appropriate because this is seasonal, monthly data.<\/p><p>We could have also looked at the significance of the autocorrelations if they had been provided. If any are significant in either regression, another lag term would be added to the autoregressive model.<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 2, Module 6.2, LOS 6.d, 6.l)<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>Questions 67 through 72 relate to Quantitative Methods.<\/p><p>Madison Consultants Case Scenario<\/p><p>Ernie Smith and Jamal Sims are analysts with the firm of Madison Consultants. Madison provides statistical modeling and advice to portfolio managers throughout the United States and Canada.<\/p><p>In an effort to estimate future cash flows and value the Canadian stock market, Smith has been examining the country&#x27;s aggregate retail sales. He runs two autoregressive regression models in an attempt to determine whether there are any patterns in the data, utilizing nine years of unadjusted monthly retail sales data. One model uses a lag 1 variable and the other adds a lag 12 variable. The results of both regressions are shown in Exhibit 1 and Exhibit 2.<\/p><p><b>Exhibit 1: Canadian Autoregressive Model With Lag 1<\/b><\/p><div class=\"tbl\"><table><tr><td>Multiple R<\/td><td>0.91<\/td><\/tr><tr><td>R-square<\/td><td>0.83<\/td><\/tr><tr><td>Adjusted R-square<\/td><td>0.83<\/td><\/tr><tr><td>Standard error<\/td><td>17,252.76<\/td><\/tr><tr><td>Observations<\/td><td>108.00<\/td><\/tr><\/table><\/div><p>ANOVA<\/p><div class=\"tbl\"><table><tr><td>df<\/td><td>SS<\/td><td>MS<\/td><td>F<\/td><td>Significance F<\/td><\/tr><tr><td>Regression<\/td><td>1.00 150,813,197,793 150,813,197,793 506.67<\/td><td>0.00<\/td><td><\/td><td><\/td><\/tr><tr><td>Residual<\/td><td>106.00<\/td><td>31,551,711,544<\/td><td>297,657,656<\/td><td><\/td><\/tr><tr><td>Total<\/td><td>107.00 182,364,909,338<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Coefficients Standard Error T-stat P-value<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Intercept<\/td><td>21,750.16<\/td><td>10,379.77<\/td><td>2.10<\/td><td>0.04<\/td><\/tr><tr><td>Lag 1<\/td><td>0.92<\/td><td>0.04<\/td><td>22.51<\/td><td>0.00<\/td><\/tr><\/table><\/div><p><b>Exhibit 2: Canadian Autoregressive Model With Lag 1 and Lag 12<\/b><\/p><p>Regression Statistics for 2nd Regression<\/p><div class=\"tbl\"><table><tr><td>Multiple R<\/td><td>0.96<\/td><\/tr><tr><td>R-square<\/td><td>0.93<\/td><\/tr><tr><td>Adjusted R-square<\/td><td>0.92<\/td><\/tr><tr><td>Standard error<\/td><td>11,336.27<\/td><\/tr><tr><td>Observations<\/td><td>108.00<\/td><\/tr><\/table><\/div><p>ANOVA<\/p><p>Significance F<\/p><div class=\"tbl\"><table><tr><td>df<\/td><td>SS<\/td><td>MS<\/td><td>F<\/td><td><\/td><\/tr><tr><td>Regression<\/td><td>2.00 168,871,246,751 84,435,623,375 657.03<\/td><td>&lt;0.01<\/td><td><\/td><td><\/td><\/tr><tr><td>Residual<\/td><td>105.00<\/td><td>13,493,662,586<\/td><td>128,511,072<\/td><td><\/td><\/tr><tr><td>Total<\/td><td>107.00 182,364,909,338<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Coefficients Standard Error T-stat P-value<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Intercept<\/td><td>–24,861.28<\/td><td>7,872.56<\/td><td>–3.16<\/td><td>&lt;0.01<\/td><\/tr><tr><td>Lag 1<\/td><td>0.30<\/td><td>0.06<\/td><td>5.22<\/td><td>&lt;0.01<\/td><\/tr><tr><td>Lag 12<\/td><td>0.84<\/td><td>0.07<\/td><td>11.85<\/td><td>&lt;0.01<\/td><\/tr><\/table><\/div><p>Sims has been assigned the task of valuing the U.S. stock market and uses data similar to the data that Smith uses for Canada. He decides, however, that the data should be transformed. He takes the natural log of the data and uses it in the following model:<\/p><p>∆ln sales  = b  + b  ∆ln sales<\/p><div class=\"tbl\"><table><tr><td>t<\/td><td>0<\/td><td>1<\/td><td>t − 1<\/td><\/tr><\/table><\/div><p>Parameter estimates for the autoregressive model and the actual data for the two most recent months are shown in Exhibit 3.<\/p><p><b>Exhibit 3: U.S. Autoregressive Model<\/b><\/p><div class=\"tbl\"><table><tr><td>Intercept<\/td><td>0.052<\/td><\/tr><tr><td>Lag 1 coefficient<\/td><td>0.684<\/td><\/tr><tr><td>Actual sales one month ago (–1)<\/td><td>6,270<\/td><\/tr><\/table><\/div><p>Actual sales two months ago (–2) 6,184<\/p><p>Smith and Sims are concerned that the data for Canadian retail sales may be more appropriately modeled with an ARCH process. Smith states, that in order to find out, he would take the residuals from the original autoregressive model for Canadian retail sales and then square them.<\/p><p>Sims states that these residuals would then be regressed against the Canadian retail sales data using the following equation: e  = b  + b X , where e represents the residual terms from the original regression and X represents the<\/p><div class=\"tbl\"><table><tr><td>t<\/td><td>0<\/td><td>1<\/td><td>t<\/td><\/tr><\/table><\/div><p>Canadian retail sales data. If b  is statistically different from zero, then the regression model contains an ARCH process. 1<\/p><p>Smith also examines the quarterly inflation data for an emerging market over the past nine years. He models the data using an autoregressive model with a lag 1 independent variable, which he finds is statistically different from zero. He wonders whether he should also include lag 2 and lag 4 terms, given the magnitude of the autocorrelations of the residuals shown in Exhibit 4, assuming a 5% significance level. The critical t-values, assuming a 5% significance level and 35 degrees of freedom, are 2.03 for a two-tail test and 1.69 for a one-tail test.<\/p><p><b>Exhibit 4: Emerging Market Autoregressive Model<\/b><\/p><p>Lag Autocorrelation<\/p><div class=\"tbl\"><table><tr><td>1<\/td><td>0.0829<\/td><\/tr><tr><td>2<\/td><td>0.1293<\/td><\/tr><tr><td>3<\/td><td>0.0227<\/td><\/tr><tr><td>4<\/td><td>0.1882<\/td><\/tr><\/table><\/div><p>Sims is investigating the performance of 5-year European and British bonds based on the actions of the U.S. Federal Reserve. He uses the U.S. Federal Funds rate. The two regressions he uses are:<\/p><div class=\"tbl\"><table><tr><td>BY<\/td><td> = b  + b FF<\/td><td><\/td><td><\/td><\/tr><tr><td>E,t<\/td><td>0<\/td><td>1<\/td><td>US,t<\/td><\/tr><tr><td>BY<\/td><td> = b  + b FF<\/td><td><\/td><td><\/td><\/tr><tr><td>B,t<\/td><td>0<\/td><td>1<\/td><td>US,t<\/td><\/tr><tr><td>where: FF is the Federal Funds rate in the United States (US), and BY is the bond yield in the European Union<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>(E) and Great Britain (B).<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Before he runs this regression, he investigates the characteristics of the dependent and independent variables. He finds that the Federal Funds rate in the United States and the bond yield in Great Britain have a unit root but that the bond yield in the European Union does not. Furthermore, the Federal Funds rate in the United States and the bond yield in Great Britain are cointegrated, but the Federal Funds rate in the United States and the bond yield in the European Union are not.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following models would be the best formulation for the Canadian retail sales data?<\/p><\/div>", "subj": "quant"}, {"n": 8, "q": "The estimate of forecasted sales for the United States this month, using Sims's model, is closest to:", "opts": ["$6,329.", "$6,453.", "$6,667."], "ans": "C", "expl": "To forecast the sales this month, we first calculate the change in the log of sales last month: Δln sales = ln(6,270) − ln(6,184) = 8.7435 − 8.7297 = 0.0138 t–1 Next, use this change in the regression model to obtain the forecasted change for this month: Δln sales = 0.052 + 0.684(0.0138) = 0.0614 t Add the forecasted change to last month's log sales to obtain this month's forecasted log sales: ln sales = 0.0614 + 8.7435 = 8.8049 t Lastly, convert the forecasted log value to a dollar value by taking its antilog: sales = e 8.8049 = $6,667 t For Further Reference: (Study Session 2, Module 6.2, LOS 6.d)", "explhtml": "<p>To forecast the sales this month, we first calculate the change in the log of sales last month:<\/p><div class=\"tbl\"><table><tr><td>Δln sales<\/td><td> = ln(6,270) − ln(6,184) = 8.7435 − 8.7297 = 0.0138<\/td><\/tr><tr><td>t–1<\/td><td><\/td><\/tr><\/table><\/div><p>Next, use this change in the regression model to obtain the forecasted change for this month:<\/p><p>Δln sales  = 0.052 + 0.684(0.0138) = 0.0614 t<\/p><p>Add the forecasted change to last month&#x27;s log sales to obtain this month&#x27;s forecasted log sales:<\/p><p>ln sales  = 0.0614 + 8.7435 = 8.8049 t<\/p><p>Lastly, convert the forecasted log value to a dollar value by taking its antilog:<\/p><div class=\"tbl\"><table><tr><td>sales  = e<\/td><td>8.8049<\/td><td> = $6,667<\/td><\/tr><tr><td>t<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p><b>For Further Reference:<\/b><\/p><p>(Study Session 2, Module 6.2, LOS 6.d)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 67 through 72 relate to Quantitative Methods.<\/p><p>Madison Consultants Case Scenario<\/p><p>Ernie Smith and Jamal Sims are analysts with the firm of Madison Consultants. Madison provides statistical modeling and advice to portfolio managers throughout the United States and Canada.<\/p><p>In an effort to estimate future cash flows and value the Canadian stock market, Smith has been examining the country&#x27;s aggregate retail sales. He runs two autoregressive regression models in an attempt to determine whether there are any patterns in the data, utilizing nine years of unadjusted monthly retail sales data. One model uses a lag 1 variable and the other adds a lag 12 variable. The results of both regressions are shown in Exhibit 1 and Exhibit 2.<\/p><p><b>Exhibit 1: Canadian Autoregressive Model With Lag 1<\/b><\/p><div class=\"tbl\"><table><tr><td>Multiple R<\/td><td>0.91<\/td><\/tr><tr><td>R-square<\/td><td>0.83<\/td><\/tr><tr><td>Adjusted R-square<\/td><td>0.83<\/td><\/tr><tr><td>Standard error<\/td><td>17,252.76<\/td><\/tr><tr><td>Observations<\/td><td>108.00<\/td><\/tr><\/table><\/div><p>ANOVA<\/p><div class=\"tbl\"><table><tr><td>df<\/td><td>SS<\/td><td>MS<\/td><td>F<\/td><td>Significance F essive model and then square them. Sims is incorrect. The next step in determining whether an ARCH process exists is to regress the squared residuals from this period against the squared residuals from the previous period as follows: If b is statistically different from zero, then we conclude that the regression model contains an ARCH process. 1 For Further Reference: (Study Session 2, Module 6.5, LOS 6.m)", "explhtml": "<p>Smith is correct. The first step in testing for an ARCH process is to take the residuals from the original autoregressive model and then square them.<\/p><p>Sims is incorrect. The next step in determining whether an ARCH process exists is to regress the squared residuals from this period against the squared residuals from the previous period as follows:<\/p><p>If b  is statistically different from zero, then we conclude that the regression model contains an ARCH process. 1<\/p><p><b>For Further Reference:<\/b><\/p><p>(Study Session 2, Module 6.5, LOS 6.m)<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 7–12 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Questions 67 through 72 relate to Quantitative Methods.<\/p><p>Madison Consultants Case Scenario<\/p><p>Ernie Smith and Jamal Sims are analysts with the firm of Madison Consultants. Madison provides statistical modeling and advice to portfolio managers throughout the United States and Canada.<\/p><p>In an effort to estimate future cash flows and value the Canadian stock market, Smith has been examining the country&#x27;s aggregate retail sales. He runs two autoregressive regression models in an attempt to determine whether there are any patterns in the data, utilizing nine years of unadjusted monthly retail sales data. One model uses a lag 1 variable and the other adds a lag 12 variable. The results of both regressions are shown in Exhibit 1 and Exhibit 2.<\/p><p><b>Exhibit 1: Canadian
