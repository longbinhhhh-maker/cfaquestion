perty, Plant and Equipment 55% 32% Goodwill and Intangible Assets 7% 17% Cash and equivalents 16% 12% Account Receivable 15% 17% Inventory 4% 5% EBITDA 2.3 2.7 Features in Existing Debt Put Call Interest Cover 13.3 8.8\"><p>As part of the due diligence process, Braunstein requests that Dubois estimate a forward-looking<\/p><p>forecast for the UK market based on the FTSE 100 index and the data provided in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0122.webp\" style=\"max-width:min(100%,679px)\" alt=\"Exhibit 2: UK Market Data Market Index Analyst Forecast FTSE Index Long-term UK government bond yield (rf) 4.85% 4.65% FTSE 100 Index expected long-term earnings growth 5.75% 5.5% FTSE 100 Index forward dividend yield 4.75% 4.95%\"><p>After she was done with the estimation, Braunstein asked Dubois if the forward-looking approach<\/p><p>used in the ERP estimation had any limitations, to which Dubois responded with the following<\/p><p>comments.<\/p><p>Comment 1: Economic and financial models are susceptible to behavioral biases or modeling<\/p><p>errors in forecasting.<\/p><p>Comment 2: Historical estimates of the ERP tend to be inflated by survivorship bias.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Dubois&#x27; question, is Braunstein most likely incorrect regarding?<\/p><\/div>", "subj": "corporate"}, {"n": 78, "q": "Based on Exhibit 1, the company that is most likely to have a lower cost of capital is:", "opts": ["Sigma.", "Midas", "Neither."], "ans": "A", "expl": "Sigma is most likely to have the lower cost of capital because its asset mix and debt-service capacity are stronger than Midas’s. Specifically: A higher proportion of tangible assets (PPE 55% vs. 32%) means more collateral value and lower financial risk, which lenders and investors view favorably. Lower goodwill/intangibles (7% vs. 17%) reduces valuation uncertainty and risk premiums. Stronger interest coverage (13.3× vs. 8.8×) signals a greater ability to service debt from operating earnings, translating into lower borrowing rates and equity risk premiums. These factors combine to reduce Sigma’s weighted average cost of capital relative to Midas. B is incorrect. Midas has a higher share of intangibles, lower collateral value, and weaker interest cover, all of which increase its risk profile and thus its cost of capital. C is incorrect. The data clearly show Sigma’s structural advantages, so it is not a tie.", "explhtml": "<p>Sigma is most likely to have the lower cost of capital because its asset mix and debt-service capacity are stronger than Midas’s. Specifically: A higher proportion of tangible assets (PPE 55% vs. 32%) means more collateral value and lower financial risk, which lenders and investors view favorably. Lower goodwill/intangibles (7% vs. 17%) reduces valuation uncertainty and risk premiums. Stronger interest coverage (13.3× vs. 8.8×) signals a greater ability to service debt from operating earnings, translating into lower borrowing rates and equity risk premiums. These factors combine to reduce Sigma’s weighted average cost of capital relative to Midas.<\/p><p><b>B is incorrect.<\/b> Midas has a higher share of intangibles, lower collateral value, and weaker interest cover, all of which increase its risk profile and thus its cost of capital.<\/p><p><b>C is incorrect.<\/b> The data clearly show Sigma’s structural advantages, so it is not a tie.<\/p><p class=\"los\">Corporate Issuers, Learning Module 3: Cost of Capital: Advanced Topics, LOS 3(a) Explain top-down and bottom-up factors that impact the cost of capital.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 77–80 · Ed Braunstein<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ed Braunstein is a senior analyst at Kleinstein Group, a corporate finance specialist firm based in<\/p><p>Austria. Braunstein meets with his colleague, Marrisa Dubois, to discuss a potential merger<\/p><p>between Midas, a motor vehicle manufacturer, and Sigma, a motor vehicle engine manufacturer.<\/p><p>Sigma is listed on the London Stock Exchange, while Midas is a family-owned business based in<\/p><p>Germany. Sigma is looking to finance the transaction using equity. Dubois asked Braunstein,<\/p><p>“Which top-down factors would affect Sigma’s cost of capital?” to which Braunstein responded,<\/p><p>Statement 1: Cumulative preferred stock investors are paid any missed dividends before they are<\/p><p>paid to common shareholders. Non-cumulative preferred stock only requires that dividends to<\/p><p>common shareholders cannot be reinstated unless the preferred stock is being paid.<\/p><p>Statement 2: A company with a higher income tax rate will likely experience greater tax benefits<\/p><p>by using debt in its capital structure.<\/p><p>Statement 3: The availability of more capital will lead to lower costs of capital and more<\/p><p>favorable terms for corporate issuers.<\/p><p>Dubois prepares data on the common-size balance sheet and other selected information for both<\/p><p>companies, which she presents in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0121.webp\" style=\"max-width:min(100%,386px)\" alt=\"Exhibit 1: Common Size Balance Sheet Data Sigma Midas Property, Plant and Equipment 55% 32% Goodwill and Intangible Assets 7% 17% Cash and equivalents 16% 12% Account Receivable 15% 17% Inventory 4% 5% EBITDA 2.3 2.7 Features in Existing Debt Put Call Interest Cover 13.3 8.8\"><p>As part of the due diligence process, Braunstein requests that Dubois estimate a forward-looking<\/p><p>forecast for the UK market based on the FTSE 100 index and the data provided in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0122.webp\" style=\"max-width:min(100%,679px)\" alt=\"Exhibit 2: UK Market Data Market Index Analyst Forecast FTSE Index Long-term UK government bond yield (rf) 4.85% 4.65% FTSE 100 Index expected long-term earnings growth 5.75% 5.5% FTSE 100 Index forward dividend yield 4.75% 4.95%\"><p>After she was done with the estimation, Braunstein asked Dubois if the forward-looking approach<\/p><p>used in the ERP estimation had any limitations, to which Dubois responded with the following<\/p><p>comments.<\/p><p>Comment 1: Economic and financial models are susceptible to behavioral biases or modeling<\/p><p>errors in forecasting.<\/p><p>Comment 2: Historical estimates of the ERP tend to be inflated by survivorship bias.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the company that is most likely to have a lower cost of capital is:<\/p><\/div>", "subj": "corporate"}, {"n": 79, "q": "Based on Exhibit 2 and using the constant growth DDM, is the UK ERP estimate closest to?", "opts": ["4.65%", "5.65%", "5.80%"], "ans": "C", "expl": "The ERP estimate is calculated as follows: A is incorrect. It assumes the risk-free rate is the ERP. B is incorrect. It incorrectly uses the analyst’s forecast.", "explhtml": "<p>The ERP estimate is calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0123.webp\" style=\"max-width:min(100%,321px)\" alt=\"ERP = 4.95% + 5.50% −4.65% = 5.80%.\"><p><b>A is incorrect.<\/b> It assumes the risk-free rate is the ERP.<\/p><p><b>B is incorrect.<\/b> It incorrectly uses the analyst’s forecast.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0124.webp\" style=\"max-width:min(100%,322px)\" alt=\"ERP = 4.75% + 5.75% −4.85% = 5.65%.\"><p class=\"los\">Corporate Issuers, Learning Module 3: Cost of Capital: Advanced Topics, LOS 3(a) Explain top-down and bottom-up factors that impact the cost of capital.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 77–80 · Ed Braunstein<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ed Braunstein is a senior analyst at Kleinstein Group, a corporate finance specialist firm based in<\/p><p>Austria. Braunstein meets with his colleague, Marrisa Dubois, to discuss a potential merger<\/p><p>between Midas, a motor vehicle manufacturer, and Sigma, a motor vehicle engine manufacturer.<\/p><p>Sigma is listed on the London Stock Exchange, while Midas is a family-owned business based in<\/p><p>Germany. Sigma is looking to finance the transaction using equity. Dubois asked Braunstein,<\/p><p>“Which top-down factors would affect Sigma’s cost of capital?” to which Braunstein responded,<\/p><p>Statement 1: Cumulative preferred stock investors are paid any missed dividends before they are<\/p><p>paid to common shareholders. Non-cumulative preferred stock only requires that dividends to<\/p><p>common shareholders cannot be reinstated unless the preferred stock is being paid.<\/p><p>Statement 2: A company with a higher income tax rate will likely experience greater tax benefits<\/p><p>by using debt in its capital structure.<\/p><p>Statement 3: The availability of more capital will lead to lower costs of capital and more<\/p><p>favorable terms for corporate issuers.<\/p><p>Dubois prepares data on the common-size balance sheet and other selected information for both<\/p><p>companies, which she presents in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0121.webp\" style=\"max-width:min(100%,386px)\" alt=\"Exhibit 1: Common Size Balance Sheet Data Sigma Midas Property, Plant and Equipment 55% 32% Goodwill and Intangible Assets 7% 17% Cash and equivalents 16% 12% Account Receivable 15% 17% Inventory 4% 5% EBITDA 2.3 2.7 Features in Existing Debt Put Call Interest Cover 13.3 8.8\"><p>As part of the due diligence process, Braunstein requests that Dubois estimate a forward-looking<\/p><p>forecast for the UK market based on the FTSE 100 index and the data provided in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0122.webp\" style=\"max-width:min(100%,679px)\" alt=\"Exhibit 2: UK Market Data Market Index Analyst Forecast FTSE Index Long-term UK government bond yield (rf) 4.85% 4.65% FTSE 100 Index expected long-term earnings growth 5.75% 5.5% FTSE 100 Index forward dividend yield 4.75% 4.95%\"><p>After she was done with the estimation, Braunstein asked Dubois if the forward-looking approach<\/p><p>used in the ERP estimation had any limitations, to which Dubois responded with the following<\/p><p>comments.<\/p><p>Comment 1: Economic and financial models are susceptible to behavioral biases or modeling<\/p><p>errors in forecasting.<\/p><p>Comment 2: Historical estimates of the ERP tend to be inflated by survivorship bias.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2 and using the constant growth DDM, is the UK ERP estimate closest to?<\/p><\/div>", "subj": "corporate"}, {"n": 80, "q": "Is Dubois most likely correct regarding the comment?", "opts": ["Comment 1.", "Comment 2.", "Both comments A and B."], "ans": "A", "expl": "Comment 1 is correct because forward-looking ERP estimation relies on forecasts from economic and financial models, which are inherently subject to Behavioral biases (e.g., overconfidence, anchoring) that can skew model inputs or assumptions. Modeling errors (e.g., mis-specified relationships, omitted variables) that lead to inaccurate forecasts. B and C are incorrect. Comment 2 refers to historical ERP estimates inflated by survivorship bias (i.e., only successful firms remain in long datasets). While true for historical analyses, it does not describe a limitation of the forward-looking approach, which bypasses historical data biases by focusing on expected future cash flows and risk premiums.", "explhtml": "<p>Comment 1 is correct because forward-looking ERP estimation relies on forecasts from economic and financial models, which are inherently subject to Behavioral biases (e.g., overconfidence, anchoring) that can skew model inputs or assumptions. Modeling errors (e.g., mis-specified relationships, omitted variables) that lead to inaccurate forecasts.<\/p><p><b>B and C are incorrect.<\/b><\/p><p>Comment 2 refers to historical ERP estimates inflated by survivorship bias (i.e., only successful firms remain in long datasets). While true for historical analyses, it does not describe a limitation of the forward-looking approach, which bypasses historical data biases by focusing on expected future cash flows and risk premiums.<\/p><p class=\"los\">Corporate Issuers, Learning Module 3: Cost of Capital: Advanced Topics, LOS 3(c) Explain historical and forward-looking approaches to estimating an equity risk premium<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 77–80 · Ed Braunstein<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ed Braunstein is a senior analyst at Kleinstein Group, a corporate finance specialist firm based in<\/p><p>Austria. Braunstein meets with his colleague, Marrisa Dubois, to discuss a potential merger<\/p><p>between Midas, a motor vehicle manufacturer, and Sigma, a motor vehicle engine manufacturer.<\/p><p>Sigma is listed on the London Stock Exchange, while Midas is a family-owned business based in<\/p><p>Germany. Sigma is looking to finance the transaction using equity. Dubois asked Braunstein,<\/p><p>“Which top-down factors would affect Sigma’s cost of capital?” to which Braunstein responded,<\/p><p>Statement 1: Cumulative preferred stock investors are paid any missed dividends before they are<\/p><p>paid to common shareholders. Non-cumulative preferred stock only requires that dividends to<\/p><p>common shareholders cannot be reinstated unless the preferred stock is being paid.<\/p><p>Statement 2: A company with a higher income tax rate will likely experience greater tax benefits<\/p><p>by using debt in its capital structure.<\/p><p>Statement 3: The availability of more capital will lead to lower costs of capital and more<\/p><p>favorable terms for corporate issuers.<\/p><p>Dubois prepares data on the common-size balance sheet and other selected information for both<\/p><p>companies, which she presents in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0121.webp\" style=\"max-width:min(100%,386px)\" alt=\"Exhibit 1: Common Size Balance Sheet Data Sigma Midas Property, Plant and Equipment 55% 32% Goodwill and Intangible Assets 7% 17% Cash and equivalents 16% 12% Account Receivable 15% 17% Inventory 4% 5% EBITDA 2.3 2.7 Features in Existing Debt Put Call Interest Cover 13.3 8.8\"><p>As part of the due diligence process, Braunstein requests that Dubois estimate a forward-looking<\/p><p>forecast for the UK market based on the FTSE 100 index and the data provided in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0122.webp\" style=\"max-width:min(100%,679px)\" alt=\"Exhibit 2: UK Market Data Market Index Analyst Forecast FTSE Index Long-term UK government bond yield (rf) 4.85% 4.65% FTSE 100 Index expected long-term earnings growth 5.75% 5.5% FTSE 100 Index forward dividend yield 4.75% 4.95%\"><p>After she was done with the estimation, Braunstein asked Dubois if the forward-looking approach<\/p><p>used in the ERP estimation had any limitations, to which Dubois responded with the following<\/p><p>comments.<\/p><p>Comment 1: Economic and financial models are susceptible to behavioral biases or modeling<\/p><p>errors in forecasting.<\/p><p>Comment 2: Historical estimates of the ERP tend to be inflated by survivorship bias.<\/p><\/div><\/details><div class=\"qtext\"><p>Is Dubois most likely correct regarding the comment?<\/p><\/div>", "subj": "corporate"}, {"n": 81, "q": "Based on Exhibit 1, which company is most likely to have a high cost of capital?", "opts": ["Lilac.", "Lamek", "Both."], "ans": "B", "expl": "Lamek is most likely to have the higher cost of capital because all four listed risk drivers point to a riskier capital structure and cash flow profile: Low revenue, cash flow, and earnings stability increase equity risk premiums and debt yields, as investors demand compensation for volatility. Low earnings predictability makes future cash flows more uncertain, leading to higher required returns by equity and debt holders. High revenue concentration (dependence on a few products or customers) amplifies idiosyncratic risk, further boosting the equity risk premium. High financial leverage raises default risk and interest spreads on debt, and also magnifies equity volatility, driving up the overall WACC. A is incorrect. Lilac Pharmaceutical has high stability, high predictability, low concentration, and low leverage, all of which lower both its equity and debt costs. C is incorrect. Both is incorrect because Lilac’s favorable risk profile implies a significantly lower cost of capital relative to Lamek.", "explhtml": "<p>Lamek is most likely to have the higher cost of capital because all four listed risk drivers point to a riskier capital structure and cash flow profile: Low revenue, cash flow, and earnings stability increase equity risk premiums and debt yields, as investors demand compensation for volatility. Low earnings predictability makes future cash flows more uncertain, leading to higher required returns by equity and debt holders. High revenue concentration (dependence on a few products or customers) amplifies idiosyncratic risk, further boosting the equity risk premium. High financial leverage raises default risk and interest spreads on debt, and also magnifies equity volatility, driving up the overall WACC.<\/p><p><b>A is incorrect.<\/b> Lilac Pharmaceutical has high stability, high predictability, low concentration, and low leverage, all of which lower both its equity and debt costs.<\/p><p><b>C is incorrect.<\/b> Both is incorrect because Lilac’s favorable risk profile implies a significantly lower cost of capital relative to Lamek.<\/p><p class=\"los\">Corporate Issuers, Learning Module 3: Cost of Capital: Advanced Topics, LOS 3(a) Explain top-down and bottom-up factors that impact the cost of capital.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 81–84 · Sally Gorgon<\/summary><div class=\"vig-body\"><p>Sally Gorgon, CFA, is a senior analyst at Smithson Advisors, a Canadian corporate finance<\/p><p>company. She has been tasked with conducting due diligence on an acquisition between Lilac<\/p><p>Pharmaceutical and Lamek BioResearch Ltd. Both companies are publicly listed on the Toronto<\/p><p>Stock Exchange and the London Stock Exchange, respectively. Part of the due diligence process<\/p><p>included estimating the cost of capital for both companies. For this exercise, she asks her Junior<\/p><p>Analysts, Nneka Simisola, who summarizes the following information in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0125.webp\" style=\"max-width:min(100%,656px)\" alt=\"Exhibit 1: Summary of Select Financial Information Lilac Lamek Pharmaceutical BioResearch Ltd Stability of revenues, cash flows, and earnings High Low Earnings predictability High Low Revenue concentration Low High Financial leverage Low High\"><p>Gorgon then asks Simisola, “What factors are likely to affect the cost of debt of both<\/p><p>companies?” Simisola responds with the following statements:<\/p><p>Statement 1: Senior, secured debt typically carries a lower interest rate than subordinated or<\/p><p>unsecured debt because senior lenders have priority claims on assets in the event of default.<\/p><p>Statement 2: A higher credit rating from agencies (e.g., Moody’s, S&amp;P) signals lower default risk<\/p><p>and allows a company to issue debt at a lower spread over benchmarks; conversely, lower ratings<\/p><p>force issuers to pay higher yields.<\/p><p>Statement 3: Debt issued in a currency with lower prevailing interest rates or lower currency<\/p><p>risk will cost more; issuers may face additional hedging costs or investor risk premiums when<\/p><p>borrowing in currencies outside their home market.<\/p><p>Next, Gorgon estimates a forward-looking ERP for both companies based on the following<\/p><p>information presented in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0126.webp\" style=\"max-width:min(100%,523px)\" alt=\"Exhibit 2: Forward-looking ERP Data Input Lilac Lamek Risk-free rate 3% 4.5% Expected inflation 2% 4% Expected growth rate in real EPS 5% 6% Expected growth rate in the P/E 1% 0% Expected income component 3.3% 2.2% Expected percent change in shares outstanding −0.5% 0.2% Yield on the company’s Bonds\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, which company is most likely to have a high cost of capital?<\/p><\/div>", "subj": "corporate"}, {"n": 82, "q": "Simisola is least likely correct regarding:", "opts": ["Statement 1.", "Statement 2.", "Statement 3."], "ans": "C", "expl": "Statement 3 is incorrect because it reverses the relationship between prevailing interest rates (and currency risk) and borrowing costs. Debt issued in a currency with lower prevailing interest rates will cost less, not more, all else equal. Conversely, borrowing in a currency with higher interest rates or greater currency risk raises the issuer’s cost of debt (through higher coupons and/or risk premiums). Simisola’s claim that lower‐rate, lower‐risk currencies increase cost is therefore backwards. A is incorrect. Statement 1 is correct. Senior, secured debt enjoys priority in claims and lower loss‐given‐default, so lenders accept lower yields versus subordinated or unsecured debt. B is incorrect. Statement 2 is correct. Higher credit ratings signal lower default probability— allowing issuers to borrow at tighter spreads—while downgraded credits pay higher yields to compensate investors.", "explhtml": "<p>Statement 3 is incorrect because it reverses the relationship between prevailing interest rates (and currency risk) and borrowing costs. Debt issued in a currency with lower prevailing interest rates will cost less, not more, all else equal. Conversely, borrowing in a currency with higher interest rates or greater currency risk raises the issuer’s cost of debt (through higher coupons and/or risk premiums). Simisola’s claim that lower‐rate, lower‐risk currencies increase cost is therefore backwards.<\/p><p><b>A is incorrect.<\/b> Statement 1 is correct. Senior, secured debt enjoys priority in claims and lower loss‐given‐default, so lenders accept lower yields versus subordinated or unsecured debt.<\/p><p><b>B is incorrect.<\/b> Statement 2 is correct. Higher credit ratings signal lower default probability— allowing issuers to borrow at tighter spreads—while downgraded credits pay higher yields to compensate investors.<\/p><p class=\"los\">Corporate Issuers, Learning Module 3: Cost of Capital: Advanced Topics, LOS (b) Compare methods used to estimate the cost of debt.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 81–84 · Sally Gorgon<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sally Gorgon, CFA, is a senior analyst at Smithson Advisors, a Canadian corporate finance<\/p><p>company. She has been tasked with conducting due diligence on an acquisition between Lilac<\/p><p>Pharmaceutical and Lamek BioResearch Ltd. Both companies are publicly listed on the Toronto<\/p><p>Stock Exchange and the London Stock Exchange, respectively. Part of the due diligence process<\/p><p>included estimating the cost of capital for both companies. For this exercise, she asks her Junior<\/p><p>Analysts, Nneka Simisola, who summarizes the following information in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0125.webp\" style=\"max-width:min(100%,656px)\" alt=\"Exhibit 1: Summary of Select Financial Information Lilac Lamek Pharmaceutical BioResearch Ltd Stability of revenues, cash flows, and earnings High Low Earnings predictability High Low Revenue concentration Low High Financial leverage Low High\"><p>Gorgon then asks Simisola, “What factors are likely to affect the cost of debt of both<\/p><p>companies?” Simisola responds with the following statements:<\/p><p>Statement 1: Senior, secured debt typically carries a lower interest rate than subordinated or<\/p><p>unsecured debt because senior lenders have priority claims on assets in the event of default.<\/p><p>Statement 2: A higher credit rating from agencies (e.g., Moody’s, S&amp;P) signals lower default risk<\/p><p>and allows a company to issue debt at a lower spread over benchmarks; conversely, lower ratings<\/p><p>force issuers to pay higher yields.<\/p><p>Statement 3: Debt issued in a currency with lower prevailing interest rates or lower currency<\/p><p>risk will cost more; issuers may face additional hedging costs or investor risk premiums when<\/p><p>borrowing in currencies outside their home market.<\/p><p>Next, Gorgon estimates a forward-looking ERP for both companies based on the following<\/p><p>information presented in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0126.webp\" style=\"max-width:min(100%,523px)\" alt=\"Exhibit 2: Forward-looking ERP Data Input Lilac Lamek Risk-free rate 3% 4.5% Expected inflation 2% 4% Expected growth rate in real EPS 5% 6% Expected growth rate in the P/E 1% 0% Expected income component 3.3% 2.2% Expected percent change in shares outstanding −0.5% 0.2% Yield on the company’s Bonds\"><\/div><\/details><div class=\"qtext\"><p>Simisola is least likely correct regarding:<\/p><\/div>", "subj": "corporate"}, {"n": 83, "q": "Based on Exhibit 2 and using the Grinold-Kroner Model, the ERP estimate for Lamek is closest to?", "opts": ["7.5%", "8.8%", "7.9%"], "ans": "A", "expl": "B is incorrect. It calculates the ERP estimate for Lilac B is incorrect. It incorrectly adds the expected percent change in shares outstanding instead of adding it", "explhtml": "<img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0127.webp\" style=\"max-widt to affect the cost of debt of both<\/p><p>companies?” Simisola responds with the following statements:<\/p><p>Statement 1: Senior, secured debt typically carries a lower interest rate than subordinated or<\/p><p>unsecured debt because senior lenders have priority claims on assets in the event of default.<\/p><p>Statement 2: A higher credit rating from agencies (e.g., Moody’s, S&amp;P) signals lower default risk<\/p><p>and allows a company to issue debt at a lower spread over benchmarks; conversely, lower ratings<\/p><p>force issuers to pay higher yields.<\/p><p>Statement 3: Debt issued in a currency with lower prevailing interest rates or lower currency<\/p><p>risk will cost more; issuers may face additional hedging costs or investor risk premiums when<\/p><p>borrowing in currencies outside their home market.<\/p><p>Next, Gorgon estimates a forward-looking ERP for both companies based on the following<\/p><p>information presented in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0126.webp\" style=\"max-width:min(100%,523px)\" alt=\"Exhibit 2: Forward-looking ERP Data Input Lilac Lamek Risk-free rate 3% 4.5% Expected inflation 2% 4% Expected growth rate in real EPS 5% 6% Expected growth rate in the P/E 1% 0% Expected income component 3.3% 2.2% Expected percent change in shares outstanding −0.5% 0.2% Yield on the company’s Bonds\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2 and using the Grinold-Kroner Model, the ERP estimate for Lamek is closest to?<\/p><\/div>", "subj": "corporate"}, {"n": 84, "q": "Based on Exhibit 2, the required return on equity for Lilac using the BYPRP approach is closest to?", "opts": ["9.4%", "12.6$", "10.0%"], "ans": "C", "expl": "The required return on equity for Lilac is calculated as follows: A and B are incorrect. It calculates the required return on equity for Lamek.", "explhtml": "<p>The required return on equity for Lilac is calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0130.webp\" style=\"max-width:min(100%,275px)\" alt=\"re = rd + RP = 4.5% + 5.5% = 10%\"><p><b>A and B are incorrect.<\/b> It calculates the required return on equity for Lamek.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0131.webp\" style=\"max-width:min(100%,280px)\" alt=\"re = rd + RP = 6.0% + 3.4% = 9.4%\"><p class=\"los\">Corporate Issuers, Learning Module 3: Cost of Capital: Advanced Topics, LOS (d) Compare methods used to estimate the required return on equity.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 81–84 · Sally Gorgon<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sally Gorgon, CFA, is a senior analyst at Smithson Advisors, a Canadian corporate finance<\/p><p>company. She has been tasked with conducting due diligence on an acquisition between Lilac<\/p><p>Pharmaceutical and Lamek BioResearch Ltd. Both companies are publicly listed on the Toronto<\/p><p>Stock Exchange and the London Stock Exchange, respectively. Part of the due diligence process<\/p><p>included estimating the cost of capital for both companies. For this exercise, she asks her Junior<\/p><p>Analysts, Nneka Simisola, who summarizes the following information in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0125.webp\" style=\"max-width:min(100%,656px)\" alt=\"Exhibit 1: Summary of Select Financial Information Lilac Lamek Pharmaceutical BioResearch Ltd Stability of revenues, cash flows, and earnings High Low Earnings predictability High Low Revenue concentration Low High Financial leverage Low High\"><p>Gorgon then asks Simisola, “What factors are likely to affect the cost of debt of both<\/p><p>companies?” Simisola responds with the following statements:<\/p><p>Statement 1: Senior, secured debt typically carries a lower interest rate than subordinated or<\/p><p>unsecured debt because senior lenders have priority claims on assets in the event of default.<\/p><p>Statement 2: A higher credit rating from agencies (e.g., Moody’s, S&amp;P) signals lower default risk<\/p><p>and allows a company to issue debt at a lower spread over benchmarks; conversely, lower ratings<\/p><p>force issuers to pay higher yields.<\/p><p>Statement 3: Debt issued in a currency with lower prevailing interest rates or lower currency<\/p><p>risk will cost more; issuers may face additional hedging costs or investor risk premiums when<\/p><p>borrowing in currencies outside their home market.<\/p><p>Next, Gorgon estimates a forward-looking ERP for both companies based on the following<\/p><p>information presented in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0126.webp\" style=\"max-width:min(100%,523px)\" alt=\"Exhibit 2: Forward-looking ERP Data Input Lilac Lamek Risk-free rate 3% 4.5% Expected inflation 2% 4% Expected growth rate in real EPS 5% 6% Expected growth rate in the P/E 1% 0% Expected income component 3.3% 2.2% Expected percent change in shares outstanding −0.5% 0.2% Yield on the company’s Bonds\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2, the required return on equity for Lilac using the BYPRP approach is closest to?<\/p><\/div>", "subj": "corporate"}, {"n": 85, "q": "If AeroDynamics were to have proceeded with the all-stock acquisition of FusionTech as initially analyzed by Tanaka, the post-transaction earnings per share (EPS) for the combined firm would have been closest to:", "opts": ["€2.64", "€2.42", "€2.90"], "ans": "A", "expl": "The calculation for the pro-forma EPS in an all-stock deal is as follows: First, we calculate the number of new shares issued, The total shares of the combined firm. The combined Net Income (NI). Combined NI = Acquirer's NI + Target's NI = €250 million + €40 million = €290 million. The pro-forma EPS. B is incorrect. This result, €2.42, is obtained if you incorrectly add the target's original shares to the acquirer's shares. This error ignores the exchange ratio. C is incorrect. This result, €2.90, is obtained if you correctly calculate the combined net income but fail to account for the new shares issued, dividing only by the acquirer's original shares.", "explhtml": "<p>The calculation for the pro-forma EPS in an all-stock deal is as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0134.webp\" style=\"max-width:min(100%,447px)\" alt=\"Acquirer’s NI + Target’s NI Pro-forma EPS = Acquirer’s Shares + New Shares Issued\"><p>First, we calculate the number of new shares issued,<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0135.webp\" style=\"max-width:min(100%,734px)\" alt=\"New Shares Issued = Target&#x27;s Shares × Exchange Ratio = 20 million × 0.5 = 10 million shares.\"><p>The total shares of the combined firm.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0136.webp\" style=\"max-width:min(100%,743px)\" alt=\"Total Shares = Acquirer&#x27;s Shares + New Shares = 100 million + 10 million = 110 million shares.\"><p>The combined Net Income (NI).<\/p><p>Combined NI = Acquirer&#x27;s NI + Target&#x27;s NI = €250 million + €40 million = €290 million.<\/p><p>The pro-forma EPS.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0137.webp\" style=\"max-width:min(100%,330px)\" alt=\"€290 million Pro-forma EPS = = €2.64 110 million shares\"><p><b>B is incorrect.<\/b> This result, €2.42, is obtained if you incorrectly add the target&#x27;s original shares to the acquirer&#x27;s shares.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0138.webp\" style=\"max-width:min(100%,141px)\" alt=\"290 = 2.42 (100 + 20)\"><p>This error ignores the exchange ratio.<\/p><p><b>C is incorrect.<\/b> This result, €2.90, is obtained if you correctly calculate the combined net income but fail to account for the new shares issued, dividing only by the acquirer&#x27;s original shares.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0139.webp\" style=\"max-width:min(100%,97px)\" alt=\"290 = 2.90 100\"><p class=\"los\">Corporate Issuers, Learning Module 4: Corporate Restructuring LOS 4(d): Demonstrate how corporate restructurings affect an issuer’s EPS, net debt to EBITDA ratio, and weighted average cost of capital.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 85–88 · AeroDynamics Inc.<\/summary><div class=\"vig-body\"><p>Kenji Tanaka, CFA, is an equity analyst evaluating AeroDynamics Inc. (AeroDynamics), a publicly<\/p><p>listed, diversified industrial company. The company’s stock has consistently underperformed its<\/p><p>industry benchmark for the past three years. Management acknowledges that the market seems<\/p><p>to be undervaluing the company&#x27;s distinct business segments, which operate in fundamentally<\/p><p>different industries. However, each division already operates under its own leadership team and<\/p><p>has the discretion to pursue projects that meet the corporate hurdle rate. Management’s internal<\/p><p>reviews consistently show that operating efficiency within both segments is in line with or<\/p><p>outperforms its peers.<\/p><p>A prominent activist investor has proposed that AeroDynamics spin off its Consumer Products<\/p><p>division. The investor&#x27;s report argues that the current corporate structure is inefficient, stating,<\/p><p>&quot;The market struggles to value a single entity with such disparate operations properly. The<\/p><p>Aerospace &amp; Defense (A&amp;D) business is capital-intensive with long-term contracts, while the<\/p><p>Consumer Products business is cyclical and requires a different management approach. A<\/p><p>separation would create two pure-play companies, allowing investors to more accurately assess<\/p><p>their individual performance and prospects, which should enhance total shareholder value.&quot;<\/p><p>In response to this pressure, AeroDynamics&#x27; management is evaluating an alternative strategy:<\/p><p>the acquisition of FusionTech, a private company specializing in advanced composite materials.<\/p><p>Management believes this acquisition will strengthen the core A&amp;D business. As part of his<\/p><p>initial analysis, Tanaka considers a hypothetical all-stock transaction where FusionTech<\/p><p>shareholders would receive 0.5 shares of AeroDynamics for each of their 20 million shares. He<\/p><p>gathers the pre-deal financial data shown in <b>Exhibit 1<\/b>.<\/p><p>Exhibit 1: Pre-Acquisition Financial Data (<b>€<\/b> millions, except per share data)<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0132.webp\" style=\"max-width:min(100%,514px)\" alt=\"Metric AeroDynamics Inc. FusionTech Net Income €250 €40 Shares Outstanding (millions) 100 20 Current Share Price €50.00 N/A Total Debt €1, 200 €100 EBITDA €700 €80\"><p>Note: For this analysis, assume neither company holds any cash or cash equivalents.<\/p><p>After extensive analysis, the AeroDynamics board rejects both the spin-off and the all-stock deal.<\/p><p>Instead, they approve the acquisition of FusionTech using a different financing method. They<\/p><p>agree to a 100% debt-financed deal, purchasing FusionTech for an enterprise value determined<\/p><p>by applying an 8.0x EV/EBITDA multiple to FusionTech&#x27;s current EBITDA. The purchase price for<\/p><p>FusionTech&#x27;s equity will be paid in cash, financed entirely by issuing new bonds. AeroDynamics<\/p><p>will also assume all of FusionTech&#x27;s existing debt. Tanaka compiles the information in <b>Exhibit 2<\/b><\/p><p>to assess the impact on AeroDynamics&#x27; cost of capital.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0133.webp\" style=\"max-width:min(100%,476px)\" alt=\"Exhibit 2: Capital Structure &amp; Cost of Capital Data Metric AeroDynamics Inc. (Pre-Transaction) Cost of Equity 11.0% Pre-tax Cost of Debt 4.0% Corporate Tax Rate 25.0%\"><\/div><\/details><div class=\"qtext\"><p>If AeroDynamics were to have proceeded with the all-stock acquisition of FusionTech as initially analyzed by Tanaka, the post-transaction earnings per share (EPS) for the combined firm would have been closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 86, "q": "Based on the activist investor’s rationale, the primary motivation for the proposed spin-off is most likely to:", "opts": ["Improve management focus and operational efficiency.", "Unlock value from a conglomerate discount.", "Allow each entity to pursue independent capital allocation strategies."], "ans": "B", "expl": "The activist’s report focuses on the market’s mispricing of AeroDynamics because it bundles two fundamentally different businesses (capital-intensive A&D vs. cyclical Consumer Products). The vignette mentions that operational efficiency is already strong, and each division has project-level capital-allocation discretion. Thus, the rationale is to separate the businesses so investors can apply segment-appropriate multiples, eliminating the conglomerate discount and unlocking shareholder value. A is incorrect. The vignette indicates that \"operating efficiency within both segments is in line with or outperforms its peers,\" and each division already operates under its own leadership team. Thus, management focus and operational efficiency are not primary concerns, and the spin-off is not motivated by improving these areas. C is incorrect. The vignette notes that each division \"has the discretion to pursue projects that meet the corporate hurdle rate,\" meaning capital allocation strategies are already decentralized. The activist's argument does not emphasize independent capital allocation as a key issue; instead, it centers on valuation clarity for investors.", "explhtml": "<p>The activist’s report focuses on the market’s mispricing of AeroDynamics because it bundles two fundamentally different businesses (capital-intensive A&amp;D vs. cyclical Consumer Products).<\/p><p>The vignette mentions that operational efficiency is already strong, and each division has project-level capital-allocation discretion. Thus, the rationale is to separate the businesses so investors can apply segment-appropriate multiples, eliminating the conglomerate discount and unlocking shareholder value.<\/p><p><b>A is incorrect.<\/b> The vignette indicates that &quot;operating efficiency within both segments is in line with or outperforms its peers,&quot; and each division already operates under its own leadership team. Thus, management focus and operational efficiency are not primary concerns, and the spin-off is not motivated by improving these areas.<\/p><p><b>C is incorrect.<\/b> The vignette notes that each division &quot;has the discretion to pursue projects that meet the corporate hurdle rate,&quot; meaning capital allocation strategies are already decentralized. The activist&#x27;s argument does not emphasize independent capital allocation as a key issue; instead, it centers on valuation clarity for investors.<\/p><p class=\"los\">Corporate Issuers, Learning Module 4: Corporate Restructuring LOS 4(a): Explain types of corporate restructurings and issuers’ motivations for pursuing them.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 85–88 · AeroDynamics Inc.<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Kenji Tanaka, CFA, is an equity analyst evaluating AeroDynamics Inc. (AeroDynamics), a publicly<\/p><p>listed, diversified industrial company. The company’s stock has consistently underperformed its<\/p><p>industry benchmark for the past three years. Management acknowledges that the market seems<\/p><p>to be undervaluing the company&#x27;s distinct business segments, which operate in fundamentally<\/p><p>different industries. However, each division already operates under its own leadership team and<\/p><p>has the discretion to pursue projects that meet the corporate hurdle rate. Management’s internal<\/p><p>reviews consistently show that operating efficiency within both segments is in line with or<\/p><p>outperforms its peers.<\/p><p>A prominent activist investor has proposed that AeroDynamics spin off its Consumer Products<\/p><p>division. The investor&#x27;s report argues that the current corporate structure is inefficient, stating,<\/p><p>&quot;The market struggles to value a single entity with such disparate operations properly. The<\/p><p>Aerospace &amp; Defense (A&amp;D) business is capital-intensive with long-term contracts, while the<\/p><p>Consumer Products business is cyclical and requires a different management approach. A<\/p><p>separation would create two pure-play companies, allowing investors to more accurately assess<\/p><p>their individual performance and prospects, which should enhance total shareholder value.&quot;<\/p><p>In response to this pressure, AeroDynamics&#x27; management is evaluating an alternative strategy:<\/p><p>the acquisition of FusionTech, a private company specializing in advanced composite materials.<\/p><p>Management believes this acquisition will strengthen the core A&amp;D business. As part of his<\/p><p>initial analysis, Tanaka considers a hypothetical all-stock transaction where FusionTech<\/p><p>shareholders would receive 0.5 shares of AeroDynamics for each of their 20 million shares. He<\/p><p>gathers the pre-deal financial data shown in <b>Exhibit 1<\/b>.<\/p><p>Exhibit 1: Pre-Acquisition Financial Data (<b>€<\/b> millions, except per share data)<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0132.webp\" style=\"max-width:min(100%,514px)\" alt=\"Metric AeroDynamics Inc. FusionTech Net Income €250 €40 Shares Outstanding (millions) 100 20 Current Share Price €50.00 N/A Total Debt €1, 200 €100 EBITDA €700 €80\"><p>Note: For this analysis, assume neither company holds any cash or cash equivalents.<\/p><p>After extensive analysis, the AeroDynamics board rejects both the spin-off and the all-stock deal.<\/p><p>Instead, they approve the acquisition of
