<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnalystPrep — Corporate Issuers</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}

    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}

  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}

  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;

  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
  .expl-html .los{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:12px}
  .expl-html b{color:var(--txt)}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

<script>
const DATA = [{"n": 1, "q": "Which of the following assumptions most likely underlies Argument 1:", "opts": ["Transaction taxes do not exist.", "Investors prefer dividends over capital gains.", "Asymmetric information exists among all investors."], "ans": "A", "expl": "Robert Somers' argument that the design of the dividend policy should have no impact on shareholders' wealth is rooted in the dividend irrelevance theory, which posits that in a perfect market, the method of returning cash to shareholders (whether via dividends or share repurchases) does not affect the value of the firm. This theory assumes that there are no transaction taxes, implying that shareholders can sell a portion of their shares to generate cash equivalent to the dividends they would have received, without incurring any additional costs. Therefore, the assumption that transaction taxes do not exist is crucial for this argument to hold, as it ensures that shareholders can freely adjust their portfolios to suit their liquidity preferences without being penalized financially. B is incorrect. MM assumes perfect capital markets, where investors are indifferent between dividends and capital gains because they can create homemade dividends without taxes or transaction costs. Assuming a preference for dividends contradicts MM’s premise of investor neutrality. C is incorrect. The assumption of asymmetric information among investors would actually counter Somers' argument. If asymmetric information existed, it would imply that not all investors have the same information about the firm's value and future prospects, which could lead to significant differences in how dividend changes are perceived. This could affect the stock price and thus the shareholders' wealth, contrary to what Somers suggests. His argument relies on the assumption of symmetric information, where all investors have equal knowledge, thereby negating any informational advantages or disadvantages that could influence stock prices upon changes in dividend policy.", "explhtml": "<p>Robert Somers&#x27; argument that the design of the dividend policy should have no impact on shareholders&#x27; wealth is rooted in the dividend irrelevance theory, which posits that in a perfect market, the method of returning cash to shareholders (whether via dividends or share repurchases) does not affect the value of the firm. This theory assumes that there are no transaction taxes, implying that shareholders can sell a portion of their shares to generate cash equivalent to the dividends they would have received, without incurring any additional costs. Therefore, the assumption that transaction taxes do not exist is crucial for this argument to hold, as it ensures that shareholders can freely adjust their portfolios to suit their liquidity preferences without being penalized financially.<\/p><p><b>B is incorrect<\/b>. MM assumes <b>perfect capital markets<\/b>, where investors are indifferent between dividends and <b>capital gains<\/b> because they can create homemade dividends without taxes or transaction costs. Assuming a preference for dividends contradicts MM’s premise of investor neutrality.<\/p><p><b>C is incorrect<\/b>. The assumption of asymmetric information among investors would actually counter Somers&#x27; argument. If asymmetric information existed, it would imply that not all investors have the same information about the firm&#x27;s value and future prospects, which could lead to significant differences in how dividend changes are perceived. This could affect the stock price and thus the shareholders&#x27; wealth, contrary to what Somers suggests. His argument relies on the assumption of symmetric information, where all investors have equal knowledge, thereby negating any informational advantages or disadvantages that could influence stock prices upon changes in dividend policy.<\/p><p class=\"los\">Corporate Issuers, Learning Module 1: Analysis of Dividends and Share Repurchases, LOS 1(e): Explain factors that affect dividend policy in practice<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Robert Somers and John Yildiz<\/summary><div class=\"vig-body\"><p>Robert Somers and John Yildiz are developing a dividend policy for their firm - Rocha Tech. During their initial meeting, Somers brings forth the following argument: <\/p><p>Argument 1: “The design of the dividend policy should have no impact on shareholders’ wealth, particularly since shareholders can create homemade dividends to meet their liquidity needs. .” <\/p><p>Yildiz objects to Somers’ argument by making the following counter-argument:<\/p><p>Argument 2: “The bird in the hand argument suggests that the design of the dividend policy does matter. A company’s decision to initiate, increase, or cut a dividend conveys credible information concerning management’s expectations of future cash flows.” <\/p><p>Yildiz identifies two factors that he believes may affect dividend policy to justify his argument. <\/p><p>Factor 1: Rapidly developing companies design their dividend policy to provide them with the flexibility to respond to developments and profitable investment opportunities.<\/p><p>Factor 2: The dividend policy may be subject to certain limitations, such as the impairment of capital rule.<\/p><p>Next, Somers and Yildiz analyze the dividend payment history of Marshal Solutions, a competitor with operations and a financing structure similar to that of Rocha (Exhibit). <\/p><p>Exhibit 1: Marshal Solutions’ Dividend Payment History<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0006.webp\" style=\"max-width:min(100%,419px)\" alt=\"Year EPS (adjusted) Dividends per Share (DPS) 2024 $9.10 $2.73 2023 $7.50 $2.25 2022 $8.80 $2.64 2021 $6.90 $2.07 2020 $7.20 $2.16\"><\/div><\/details><div class=\"qtext\"><p>Which of the following assumptions most likely underlies Argument 1:<\/p><\/div>", "subj": "corporate"}, {"n": 2, "q": "Is Yildiz's counter-argument most likely correct?", "opts": ["Yes.", "No, the bird in the hand argument supports the dividend irrelevance proposition.", "No, his argument primarily reflects the signaling effect."], "ans": "C", "expl": "Yildiz’s counter-argument incorrectly attributes the relevance of dividend policy to the bird in the hand argument, stating that a company’s decision to initiate, increase, or cut a dividend conveys credible information about management’s expectations of future cash flows. This description aligns with the signaling effect, where dividend actions provide information about future performance due to asymmetric information. The bird in the hand argument, however, posits that investors prefer dividends over capital gains because dividends are less risky, not because they convey information. Thus, Yildiz’s argument is incorrect because it mislabels the signaling effect as the bird in the hand argument. A is incorrect. The bird in the hand argument does not support the signaling effect described in Yildiz’s argument. It focuses on investor preference for dividends due to lower risk. B is incorrect. The bird in the hand argument does not support the dividend irrelevance proposition. It argues that dividend policy matters because investors value dividends more than capital gains, contradicting MM’s irrelevance theory.", "explhtml": "<p>Yildiz’s counter-argument incorrectly attributes the relevance of <b>dividend policy<\/b> to the <b>bird in<\/b> <b>the hand argument<\/b>, stating that a company’s decision to initiate, increase, or cut a dividend conveys <b>credible information<\/b> about management’s expectations of <b>future cash flows<\/b>. This description aligns with the <b>signaling effect<\/b>, where dividend actions provide information about future performance due to <b>asymmetric information<\/b>. The <b>bird in the hand argument<\/b>, however, posits that investors prefer dividends over capital gains because dividends are less risky, not because they convey information. Thus, Yildiz’s argument is incorrect because it mislabels the <b>signaling effect<\/b> as the bird in the hand argument.<\/p><p><b>A is incorrect<\/b>. The <b>bird in the hand argument<\/b> does not support the <b>signaling effect<\/b> described in Yildiz’s argument. It focuses on investor preference for dividends due to lower risk.<\/p><p><b>B is incorrect<\/b>. The <b>bird in the hand argument<\/b> does not support the <b>dividend irrelevance<\/b> <b>proposition<\/b>. It argues that dividend policy matters because investors value dividends more than capital gains, contradicting <b>MM’s irrelevance theory.<\/b><\/p><p class=\"los\">Corporate Issuers, Learning Module 1: Analysis of Dividends and Share Repurchases, LOS 1(e): Explain factors that affect dividend policy in practice<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Robert Somers and John Yildiz<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Robert Somers and John Yildiz are developing a dividend policy for their firm - Rocha Tech. During their initial meeting, Somers brings forth the following argument: <\/p><p>Argument 1: “The design of the dividend policy should have no impact on shareholders’ wealth, particularly since shareholders can create homemade dividends to meet their liquidity needs. .” <\/p><p>Yildiz objects to Somers’ argument by making the following counter-argument:<\/p><p>Argument 2: “The bird in the hand argument suggests that the design of the dividend policy does matter. A company’s decision to initiate, increase, or cut a dividend conveys credible information concerning management’s expectations of future cash flows.” <\/p><p>Yildiz identifies two factors that he believes may affect dividend policy to justify his argument. <\/p><p>Factor 1: Rapidly developing companies design their dividend policy to provide them with the flexibility to respond to developments and profitable investment opportunities.<\/p><p>Factor 2: The dividend policy may be subject to certain limitations, such as the impairment of capital rule.<\/p><p>Next, Somers and Yildiz analyze the dividend payment history of Marshal Solutions, a competitor with operations and a financing structure similar to that of Rocha (Exhibit). <\/p><p>Exhibit 1: Marshal Solutions’ Dividend Payment History<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0006.webp\" style=\"max-width:min(100%,419px)\" alt=\"Year EPS (adjusted) Dividends per Share (DPS) 2024 $9.10 $2.73 2023 $7.50 $2.25 2022 $8.80 $2.64 2021 $6.90 $2.07 2020 $7.20 $2.16\"><\/div><\/details><div class=\"qtext\"><p>Is Yildiz&#x27;s counter-argument most likely correct?<\/p><\/div>", "subj": "corporate"}, {"n": 3, "q": "Factor 1 most likely illustrates:", "opts": ["Financial flexibility only.", "Investment opportunities only.", "Both financial flexibility and investment opportunities."], "ans": "C", "expl": "Factor 1, as described by John Yildiz, emphasizes the importance of designing a dividend policy that provides flexibility to rapidly developing companies. This flexibility is crucial because it allows these companies to retain earnings rather than distribute them as dividends, thereby preserving capital for future investment opportunities. Rapidly developing companies often encounter unexpected opportunities or challenges that require immediate financial resources. By maintaining a flexible dividend policy, these companies can quickly allocate funds to these opportunities, enhancing their growth potential and competitive edge in the market. A is incorrect. While Factor 1 does indeed highlight the aspect of financial flexibility, stating that it illustrates financial flexibility only is too narrow an interpretation. The factor explicitly connects the need for flexibility to the ability to respond to new and profitable investment opportunities. Therefore, it is not solely about having financial flexibility but also about what that flexibility enables the company to achieve in terms of capitalizing on investment opportunities. B is incorrect. Similarly, stating that Factor 1 illustrates only investment opportunities overlooks the crucial role of financial flexibility mentioned in the factor. Investment opportunities cannot be pursued without the necessary financial resources to support them. The factor clearly links the dividend policy's flexibility with the ability to invest in profitable ventures, indicating that both elements are intertwined and essential for rapidly developing companies. Thus, focusing solely on investment opportunities without acknowledging the role of financial flexibility provides an incomplete understanding of the factor's implications.", "explhtml": "<p>Factor 1, as described by John Yildiz, emphasizes the importance of designing a dividend policy that provides flexibility to rapidly developing companies. This flexibility is crucial because it allows these companies to retain earnings rather than distribute them as dividends, thereby preserving capital for future investment opportunities. Rapidly developing companies often encounter unexpected opportunities or challenges that require immediate financial resources. By maintaining a flexible dividend policy, these companies can quickly allocate funds to these opportunities, enhancing their growth potential and competitive edge in the market.<\/p><p><b>A is incorrect<\/b>. While Factor 1 does indeed highlight the aspect of financial flexibility, stating that it illustrates financial flexibility only is too narrow an interpretation. The factor explicitly connects the need for flexibility to the ability to respond to new and profitable investment opportunities. Therefore, it is not solely about having financial flexibility but also about what that flexibility enables the company to achieve in terms of capitalizing on investment opportunities.<\/p><p><b>B is incorrect<\/b>. Similarly, stating that Factor 1 illustrates only investment opportunities overlooks the crucial role of financial flexibility mentioned in the factor. Investment opportunities cannot be pursued without the necessary financial resources to support them. The factor clearly links the dividend policy&#x27;s flexibility with the ability to invest in profitable ventures, indicating that both elements are intertwined and essential for rapidly developing companies. Thus, focusing solely on investment opportunities without acknowledging the role of financial flexibility provides an incomplete understanding of the factor&#x27;s implications.<\/p><p class=\"los\">Corporate Issuers, Learning Module 1: Analysis of Dividends and Share Repurchases, LOS 1(e): Explain factors that affect dividend policy in practice<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Robert Somers and John Yildiz<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Robert Somers and John Yildiz are developing a dividend policy for their firm - Rocha Tech. During their initial meeting, Somers brings forth the following argument: <\/p><p>Argument 1: “The design of the dividend policy should have no impact on shareholders’ wealth, particularly since shareholders can create homemade dividends to meet their liquidity needs. .” <\/p><p>Yildiz objects to Somers’ argument by making the following counter-argument:<\/p><p>Argument 2: “The bird in the hand argument suggests that the design of the dividend policy does matter. A company’s decision to initiate, increase, or cut a dividend conveys credible information concerning management’s expectations of future cash flows.” <\/p><p>Yildiz identifies two factors that he believes may affect dividend policy to justify his argument. <\/p><p>Factor 1: Rapidly developing companies design their dividend policy to provide them with the flexibility to respond to developments and profitable investment opportunities.<\/p><p>Factor 2: The dividend policy may be subject to certain limitations, such as the impairment of capital rule.<\/p><p>Next, Somers and Yildiz analyze the dividend payment history of Marshal Solutions, a competitor with operations and a financing structure similar to that of Rocha (Exhibit). <\/p><p>Exhibit 1: Marshal Solutions’ Dividend Payment History<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0006.webp\" style=\"max-width:min(100%,419px)\" alt=\"Year EPS (adjusted) Dividends per Share (DPS) 2024 $9.10 $2.73 2023 $7.50 $2.25 2022 $8.80 $2.64 2021 $6.90 $2.07 2020 $7.20 $2.16\"><\/div><\/details><div class=\"qtext\"><p>Factor 1 most likely illustrates:<\/p><\/div>", "subj": "corporate"}, {"n": 4, "q": "Using the information in the Exhibit, Marshal can most likely be characterized as having:", "opts": ["A stable dividend policy.", "A residual dividend policy.", "A constant dividend payout ratio policy."], "ans": "C", "expl": "Marshal Solutions’ dividends per share (DPS) rise and fall in close proportion to earnings per share (EPS), with the payout ratio holding at roughly 30% each year: A policy that pays a constant percentage of earnings—here about 30%—is by definition a constant dividend payout ratio policy. A is incorrect. A stable dividend policy keeps the cash dividend itself fairly level from year to year, even when earnings fluctuate. Marshal’s DPS moves noticeably—from 2.07 to 2.73— mirroring EPS changes, so the dividends are not stable in absolute terms. B is incorrect Under a residual dividend policy, dividends equal the cash left after funding new projects, producing payout ratios that vary widely and unpredictably. Marshal’s nearly uniform 30% payout shows a systematic approach, not the erratic pattern typical of a residual policy.", "explhtml": "<p>Marshal Solutions’ <b>dividends per share (DPS)<\/b> rise and fall in close proportion to <b>earnings per<\/b> <b>share (EPS)<\/b>, with the payout ratio holding at roughly <b>30%<\/b> each year:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0007.webp\" style=\"max-width:min(100%,538px)\" alt=\"2.73 2.25 2.64 2.07 2.16 ≈0.30, ≈0.30, ≈0.30, ≈0.30, ≈0.30 9.10 7.50 8.80 6.90 7.20\"><p>A policy that pays a <b>constant percentage of earnings<\/b>—here about 30%—is by definition a <b>constant dividend payout ratio policy<\/b>.<\/p><p><b>A is incorrect.<\/b> A <b>stable dividend policy<\/b> keeps the cash dividend itself fairly level from year to year, even when earnings fluctuate. Marshal’s DPS moves noticeably—from 2.07 to 2.73— mirroring EPS changes, so the dividends are <b>not stable<\/b> in absolute terms.<\/p><p><b>B is incorrect<\/b> Under a <b>residual dividend policy<\/b>, dividends equal the cash left after funding new projects, producing payout ratios that vary widely and unpredictably. Marshal’s nearly uniform 30% payout shows a <b>systematic approach<\/b>, not the erratic pattern typical of a residual policy.<\/p><p class=\"los\">Corporate Issuers, Learning Module 1: Analysis of Dividends and Share Repurchases, LOS 1(e): Explain factors that affect dividend policy in practice<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Robert Somers and John Yildiz<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Robert Somers and John Yildiz are developing a dividend policy for their firm - Rocha Tech. During their initial meeting, Somers brings forth the following argument: <\/p><p>Argument 1: “The design of the dividend policy should have no impact on shareholders’ wealth, particularly since shareholders can create homemade dividends to meet their liquidity needs. .” <\/p><p>Yildiz objects to Somers’ argument by making the following counter-argument:<\/p><p>Argument 2: “The bird in the hand argument suggests that the design of the dividend policy does matter. A company’s decision to initiate, increase, or cut a dividend conveys credible information concerning management’s expectations of future cash flows.” <\/p><p>Yildiz identifies two factors that he believes may affect dividend policy to justify his argument. <\/p><p>Factor 1: Rapidly developing companies design their dividend policy to provide them with the flexibility to respond to developments and profitable investment opportunities.<\/p><p>Factor 2: The dividend policy may be subject to certain limitations, such as the impairment of capital rule.<\/p><p>Next, Somers and Yildiz analyze the dividend payment history of Marshal Solutions, a competitor with operations and a financing structure similar to that of Rocha (Exhibit). <\/p><p>Exhibit 1: Marshal Solutions’ Dividend Payment History<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0006.webp\" style=\"max-width:min(100%,419px)\" alt=\"Year EPS (adjusted) Dividends per Share (DPS) 2024 $9.10 $2.73 2023 $7.50 $2.25 2022 $8.80 $2.64 2021 $6.90 $2.07 2020 $7.20 $2.16\"><\/div><\/details><div class=\"qtext\"><p>Using the information in the Exhibit, Marshal can most likely be characterized as having:<\/p><\/div>", "subj": "corporate"}, {"n": 5, "q": "Gregg made statements about the survey estimate method and the difference between two multi-factor models. Are these statements correct ?", "opts": ["Only one of those statements is correct.", "Both statements are correct.", "Both statements are incorrect."], "ans": "C", "expl": "Under the survey estimate method, the equity risk premium is inferred from the expectations of a sample. This sample generally consists of experts in the field of equity valuation. It does not include all equity investors. Thus, the first statement is incorrect. Gregg's statement about the Fama-French (FF) and the Pastor-Stambaugh (PS) models is also incorrect. The FF model does not include a liquidity premium, but the PS model does. A and B are incorrect. The Pastor–Stambaugh model builds on a market beta and explicitly adds a liquidity‐risk factor. Thus, Gregg’s claim that “the Fama–French model takes into consideration a liquidity premium” is incorrect. ", "explhtml": "<p>Under the survey estimate method, the equity risk premium is inferred from the expectations of a sample. This sample generally consists of experts in the field of equity valuation. It does not include all equity investors. Thus, the first statement is incorrect.<\/p><p>Gregg&#x27;s statement about the Fama-French (FF) and the Pastor-Stambaugh (PS) models is also incorrect. The FF model does not include a liquidity premium, but the PS model does.<\/p><p><b>A and B are incorrect.<\/b> The Pastor–Stambaugh model builds on a market beta and explicitly adds a liquidity‐risk factor. Thus, Gregg’s claim that “the Fama–French model takes into consideration a liquidity premium” is incorrect. <\/p><p class=\"los\">Corporate Issuers, Learning Module 3: Cost of Capital: Advanced Topics, LOS 3 (e) Estimate the cost of debt or required return on equity for a public company and a private company.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Darlene Gregg<\/summary><div class=\"vig-body\"><p>Darlene Gregg, a junior analyst, was recently hired at N.A. Financial, a mid-sized Canadian investment firm. She is assisting her manager, Robert Mugo, in the management of a portfolio for high-net-worth clients. Over the years, Mugo has carved out a reputation for unparalleled work ethic and outstanding financial performance. He has been working at N.A. Financial for the last ten years and earned his CFA charter within the last three years. He&#x27;s been and an active member ever since.<\/p><p>Mugo has been analyzing several equity stocks for possible future purchases in line with the<\/p><p>investment needs of a group of her clients. He asks Gregg to help compute the required return<\/p><p>for each stock. Before Gregg gets down to work, Mugo wants to make sure that Gregg has sound<\/p><p>knowledge of basic equity valuation concepts. He invites Gregg to his office to discuss the<\/p><p>various approaches used to calculate the required return.<\/p><p>While discussing the various approaches used to estimate the risk premium, Gregg states that:<\/p><p>&quot;Under the survey estimate method, a survey is conducted for all equity investors. The<\/p><p>data gathered is then used to come up with a reasonable risk premium.&quot;<\/p><p>Gregg believed that he could also use multi-factor models such as the Fama-French model and<\/p><p>Pastor-Stambaugh model to calculate the required return. In response, Mugo stated that both of<\/p><p>these models are based on one similar concept and that only the factors considered by each<\/p><p>method differ. Gregg nodded in agreement, stating that the Fama-French model takes into<\/p><p>consideration a liquidity premium.<\/p><p>To test Gregg&#x27;s knowledge on equity valuation, Mugo asked her to calculate the required return<\/p><p>for KOP based on the CAPM, using a risk premium of 3.5% put forth in a well-known financial<\/p><p>journal. According to Mugo, KOP stock has had a historical sensitivity of 0.9 relative to the<\/p><p>market, and Treasury bills are currently earning 3.8%. KOP also pays a dividend of $2.03 and the<\/p><p>stock trades at $11.04. The company&#x27;s dividend is expected to increase by 6%.<\/p><p>To come up with the required return based on these two models, Gregg gathered the following<\/p><p>data:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0008.webp\" style=\"max-width:min(100%,86px)\" alt=\"Exhibit 1:\"><p>1. R<sub>mkt<\/sub>–R<sub>f<\/sub> = 4.5%; and β<sub>mkt<\/sub> = 1.2 2. R<sub>small<\/sub>– R<sub>big<\/sub> = 2.5; and β<sub>SMB<\/sub> = 0.5 3. R<sub>HMB<\/sub>– R<sub>LBM<\/sub> = 1.5; and β<sub>HML<\/sub> = −0.1 4. Liquidity Premium = 3%; and β<sub>liquidity<\/sub> = −0.1 5. R<sub>f<\/sub> = 3.8%<\/p><\/div><\/details><div class=\"qtext\"><p>Gregg made statements about the survey estimate method and the difference between two multi-factor models. Are these statements correct ?<\/p><\/div>", "subj": "corporate"}, {"n": 6, "q": "KOP's required return based on the CAPM is closest to:", "opts": ["3.83%.", "6.95%.", "7.95%."], "ans": "B", "expl": "A is incorrect. This nearly equals the risk‑free rate alone; it ignores the equity risk premium component. C is incorrect. This overstates the result by effectively using a beta of 1.0 (3.8% + 1.0×3.5%).", "explhtml": "<img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0009.webp\" style=\"max-width:min(100%,455px)\" alt=\"Required return =  Risk-Free Rate + Beta × Risk Premium Required return = 3.8% + 0.9 × 3.5% Required return = 6.95%\"><p><b>A is incorrect.<\/b> This nearly equals the risk‑free rate alone; it ignores the equity risk premium component.<\/p><p><b>C is incorrect.<\/b> This overstates the result by effectively using a beta of 1.0 (3.8% + 1.0×3.5%).<\/p><p class=\"los\">Corporate Issuers, Learning Module 3: Cost of Capital: Advanced Topics, LOS 3 (e) Estimate the cost of debt or required return on equity for a public company and a private company.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Darlene Gregg<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Darlene Gregg, a junior analyst, was recently hired at N.A. Financial, a mid-sized Canadian investment firm. She is assisting her manager, Robert Mugo, in the management of a portfolio for high-net-worth clients. Over the years, Mugo has carved out a reputation for unparalleled work ethic and outstanding financial performance. He has been working at N.A. Financial for the last ten years and earned his CFA charter within the last three years. He&#x27;s been and an active member ever since.<\/p><p>Mugo has been analyzing several equity stocks for possible future purchases in line with the<\/p><p>investment needs of a group of her clients. He asks Gregg to help compute the required return<\/p><p>for each stock. Before Gregg gets down to work, Mugo wants to make sure that Gregg has sound<\/p><p>knowledge of basic equity valuation concepts. He invites Gregg to his office to discuss the<\/p><p>various approaches used to calculate the required return.<\/p><p>While discussing the various approaches used to estimate the risk premium, Gregg states that:<\/p><p>&quot;Under the survey estimate method, a survey is conducted for all equity investors. The<\/p><p>data gathered is then used to come up with a reasonable risk premium.&quot;<\/p><p>Gregg believed that he could also use multi-factor models such as the Fama-French model and<\/p><p>Pastor-Stambaugh model to calculate the required return. In response, Mugo stated that both of<\/p><p>these models are based on one similar concept and that only the factors considered by each<\/p><p>method differ. Gregg nodded in agreement, stating that the Fama-French model takes into<\/p><p>consideration a liquidity premium.<\/p><p>To test Gregg&#x27;s knowledge on equity valuation, Mugo asked her to calculate the required return<\/p><p>for KOP based on the CAPM, using a risk premium of 3.5% put forth in a well-known financial<\/p><p>journal. According to Mugo, KOP stock has had a historical sensitivity of 0.9 relative to the<\/p><p>market, and Treasury bills are currently earning 3.8%. KOP also pays a dividend of $2.03 and the<\/p><p>stock trades at $11.04. The company&#x27;s dividend is expected to increase by 6%.<\/p><p>To come up with the required return based on these two models, Gregg gathered the following<\/p><p>data:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0008.webp\" style=\"max-width:min(100%,86px)\" alt=\"Exhibit 1:\"><p>1. R<sub>mkt<\/sub>–R<sub>f<\/sub> = 4.5%; and β<sub>mkt<\/sub> = 1.2 2. R<sub>small<\/sub>– R<sub>big<\/sub> = 2.5; and β<sub>SMB<\/sub> = 0.5 3. R<sub>HMB<\/sub>– R<sub>LBM<\/sub> = 1.5; and β<sub>HML<\/sub> = −0.1 4. Liquidity Premium = 3%; and β<sub>liquidity<\/sub> = −0.1 5. R<sub>f<\/sub> = 3.8%<\/p><\/div><\/details><div class=\"qtext\"><p>KOP&#x27;s required return based on the CAPM is closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 7, "q": "The forward looking ERP estimate using the dividend discount model method closest to:", "opts": ["14.59%.", "21.69%.", "24.39%."], "ans": "B", "expl": "A is incorrect. It omitted the growth rate. C is incorrect. It omitted the risk-free rate.", "explhtml": "<img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0010.webp\" style=\"max-width:min(100%,413px)\" alt=\"D1 ERP = E( ) + E(g) −rf V0 2.03 × 1.06 ERP = + 0.06 −0.038 = 0.2169 = 21.69% 11.04\"><p><b>A is incorrect.<\/b> It omitted the growth rate.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0011.webp\" style=\"max-width:min(100%,323px)\" alt=\"2.03 ERP = −0.038 = 0.1459 = 14.59% 11.04\"><p><b>C is incorrect.<\/b> It omitted the risk-free rate.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0012.webp\" style=\"max-width:min(100%,313px)\" alt=\"2.03 ERP = + 0.06 = 0.2439 = 24.39% 11.04\"><p class=\"los\">Corporate Issuers, Learning Module 3: Cost of Capital: Advanced Topics, LOS 3 (c) Explain historical and forward-looking approaches to estimating an equity risk premium.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Darlene Gregg<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Darlene Gregg, a junior analyst, was recently hired at N.A. Financial, a mid-sized Canadian investment firm. She is assisting her manager, Robert Mugo, in the management of a portfolio for high-net-worth clients. Over the years, Mugo has carved out a reputation for unparalleled work ethic and outstanding financial performance. He has been working at N.A. Financial for the last ten years and earned his CFA charter within the last three years. He&#x27;s been and an active member ever since.<\/p><p>Mugo has been analyzing several equity stocks for possible future purchases in line with the<\/p><p>investment needs of a group of her clients. He asks Gregg to help compute the required return<\/p><p>for each stock. Before Gregg gets down to work, Mugo wants to make sure that Gregg has sound<\/p><p>knowledge of basic equity valuation concepts. He invites Gregg to his office to discuss the<\/p><p>various approaches used to calculate the required return.<\/p><p>While discussing the various approaches used to estimate the risk premium, Gregg states that:<\/p><p>&quot;Under the survey estimate method, a survey is conducted for all equity investors. The<\/p><p>data gathered is then used to come up with a reasonable risk premium.&quot;<\/p><p>Gregg believed that he could also use multi-factor models such as the Fama-French model and<\/p><p>Pastor-Stambaugh model to calculate the required return. In response, Mugo stated that both of<\/p><p>these models are based on one similar concept and that only the factors considered by each<\/p><p>method differ. Gregg nodded in agreement, stating that the Fama-French model takes into<\/p><p>consideration a liquidity premium.<\/p><p>To test Gregg&#x27;s knowledge on equity valuation, Mugo asked her to calculate the required return<\/p><p>for KOP based on the CAPM, using a risk premium of 3.5% put forth in a well-known financial<\/p><p>journal. According to Mugo, KOP stock has had a historical sensitivity of 0.9 relative to the<\/p><p>market, and Treasury bills are currently earning 3.8%. KOP also pays a dividend of $2.03 and the<\/p><p>stock trades at $11.04. The company&#x27;s dividend is expected to increase by 6%.<\/p><p>To come up with the required return based on these two models, Gregg gathered the following<\/p><p>data:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0008.webp\" style=\"max-width:min(100%,86px)\" alt=\"Exhibit 1:\"><p>1. R<sub>mkt<\/sub>–R<sub>f<\/sub> = 4.5%; and β<sub>mkt<\/sub> = 1.2 2. R<sub>small<\/sub>– R<sub>big<\/sub> = 2.5; and β<sub>SMB<\/sub> = 0.5 3. R<sub>HMB<\/sub>– R<sub>LBM<\/sub> = 1.5; and β<sub>HML<\/sub> = −0.1 4. Liquidity Premium = 3%; and β<sub>liquidity<\/sub> = −0.1 5. R<sub>f<\/sub> = 3.8%<\/p><\/div><\/details><div class=\"qtext\"><p>The forward looking ERP estimate using the dividend discount model method closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 8, "q": "Based on Exhibit 1, the required return according to the Fama-French model is closest to:", "opts": ["10.6%.", "10.3%.", "10.0%."], "ans": "B", "expl": "The Fama-french model is based on three factors: market premium, small-cap return premium, and value return premium. Rmkt–Rf = return on a value-weighted market index minus the risk-free rate Rsmall– Rbig = average return on small-cap portfolios minus average return on large-cap portfolios RHBM– RLBM = average return on high book-to-market portfolios minus average return on low book-to-market portfolios Required return = Rf + Rmkt– Rf × βmkt + Rsmall– Rbig × βSMB Note: incorrectly incorporating the liquidity risk premium will give a required return of 10%. A is incorrect. This result might occur if a candidate omits the negative sign on the HML term (treating −1 × 1.5% giving 3.8 + 5.40 + 1.25 + 0.15 = 10.60%. C is incorrect. This mirrors someone incorrectly adding the liquidity premium from a four‑factor model (3.0%×– 0.1 =– 0.30%) instead of HML, or using the Pastor–Stambaugh liquidity beta, yielding:", "explhtml": "<p>The Fama-french model is based on three factors: market premium, small-cap return premium, and value return premium.<\/p><p>R<sub>mkt<\/sub>–R<sub>f<\/sub> = return on a value-weighted market index minus the risk-free rate<\/p><p>R<sub>small<\/sub>– R<sub>big<\/sub> = average return on small-cap portfolios minus average return on large-cap portfolios<\/p><p>R<sub>HBM<\/sub>– R<sub>LBM<\/sub> = average return on high book-to-market portfolios minus average return on low book-to-market portfolios<\/p><p>Required return = R<sub>f<\/sub> + R<sub>mkt<\/sub>– R<sub>f<\/sub> × β<sub>mkt<\/sub> + R<sub>small<\/sub>– R<sub>big<\/sub> × β<sub>SMB<\/sub><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0013.webp\" style=\"max-width:min(100%,605px)\" alt=\"+ RHBM–RLBM × βHML Required return = 3.8% + 4.5% × 1.2 + 2.5% × 0.5 + 1.5% × −0.1 Required return = 10.3%\"><p>Note: incorrectly incorporating the liquidity risk premium will give a required return of 10%.<\/p><p><b>A is incorrect.<\/b> This result might occur if a candidate omits the negative sign on the HML term (treating −1 × 1.5% giving 3.8 + 5.40 + 1.25 + 0.15 = 10.60%.<\/p><p><b>C is incorrect.<\/b> This mirrors someone incorrectly adding the liquidity premium from a four‑factor model (3.0%×– 0.1 =– 0.30%) instead of HML, or using the Pastor–Stambaugh liquidity beta, yielding:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0014.webp\" style=\"max-width:min(100%,214px)\" alt=\"10.30% −0.30% = 10.00%\"><p class=\"los\">Corporate Issuers, Learning Module 3: Cost of Capital: Advanced Topics, LOS 3 (e) Estimate the cost of debt or required return on equity for a public company and a private company.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Darlene Gregg<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Darlene Gregg, a junior analyst, was recently hired at N.A. Financial, a mid-sized Canadian investment firm. She is assisting her manager, Robert Mugo, in the management of a portfolio for high-net-worth clients. Over the years, Mugo has carved out a reputation for unparalleled work ethic and outstanding financial performance. He has been working at N.A. Financial for the last ten years and earned his CFA charter within the last three years. He&#x27;s been and an active member ever since.<\/p><p>Mugo has been analyzing several equity stocks for possible future purchases in line with the<\/p><p>investment needs of a group of her clients. He asks Gregg to help compute the required return<\/p><p>for each stock. Before Gregg gets down to work, Mugo wants to make sure that Gregg has sound<\/p><p>knowledge of basic equity valuation concepts. He invites Gregg to his office to discuss the<\/p><p>various approaches used to calculate the required return.<\/p><p>While discussing the various approaches used to estimate the risk premium, Gregg states that:<\/p><p>&quot;Under the survey estimate method, a survey is conducted for all equity investors. The<\/p><p>data gathered is then used to come up with a reasonable risk premium.&quot;<\/p><p>Gregg believed that he could also use multi-factor models such as the Fama-French model and<\/p><p>Pastor-Stambaugh model to calculate the required return. In response, Mugo stated that both of<\/p><p>these models are based on one similar concept and that only the factors considered by each<\/p><p>method differ. Gregg nodded in agreement, stating that the Fama-French model takes into<\/p><p>consideration a liquidity premium.<\/p><p>To test Gregg&#x27;s knowledge on equity valuation, Mugo asked her to calculate the required return<\/p><p>for KOP based on the CAPM, using a risk premium of 3.5% put forth in a well-known financial<\/p><p>journal. According to Mugo, KOP stock has had a historical sensitivity of 0.9 relative to the<\/p><p>market, and Treasury bills are currently earning 3.8%. KOP also pays a dividend of $2.03 and the<\/p><p>stock trades at $11.04. The company&#x27;s dividend is expected to increase by 6%.<\/p><p>To come up with the required return based on these two models, Gregg gathered the following<\/p><p>data:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0008.webp\" style=\"max-width:min(100%,86px)\" alt=\"Exhibit 1:\"><p>1. R<sub>mkt<\/sub>–R<sub>f<\/sub> = 4.5%; and β<sub>mkt<\/sub> = 1.2 2. R<sub>small<\/sub>– R<sub>big<\/sub> = 2.5; and β<sub>SMB<\/sub> = 0.5 3. R<sub>HMB<\/sub>– R<sub>LBM<\/sub> = 1.5; and β<sub>HML<\/sub> = −0.1 4. Liquidity Premium = 3%; and β<sub>liquidity<\/sub> = −0.1 5. R<sub>f<\/sub> = 3.8%<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the required return according to the Fama-French model is closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 9, "q": "The ownership structure of Highmark Petroleum is best described as:", "opts": ["An interlocking directorates model.", "A mixed-ownership model.", "A horizontal ownership model."], "ans": "B", "expl": "Highmark Petroleum, as described, is a company that is partially owned by the Canadian government and also has shares traded on the Toronto Stock Exchange. This ownership structure is indicative of a mixed-ownership model, where a state-owned enterprise (SOE) is partially owned by a government but also allows for public investment through the stock market. This model is particularly common in sectors that are vital to national interests or require substantial capital investments, which might be too large for private entities to handle alone. In the case of Highmark Petroleum, the involvement of the government and public investors allows for shared control and funding, which is essential for large-scale projects like the expansion of energy projects in Canada. The mixed-ownership model enables the government to maintain strategic control while also leveraging private capital and expertise to enhance efficiency and innovation. A is incorrect. The interlocking directorates model refers to a scenario where the same individuals serve on the boards of multiple corporations, which is not the case described for Highmark Petroleum. While the CEO and the majority of the executive directors are nominated by the provincial government of British Columbia, there is no indication that these individuals hold board positions in other companies simultaneously. Therefore, this model does not apply to Highmark Petroleum's ownership structure, which is characterized by government involvement coupled with public trading of shares, rather than inter-corporate board linkages. C is incorrect. The horizontal ownership model involves companies that have mutual business interests and engage in cross-holding share arrangements with each other. This model typically sees companies owning stakes in each other to secure business relationships or strategic alliances. In the case of Highmark Petroleum, the company's ownership structure does not suggest any cross-holdings with other firms. Instead, it is partially owned by the government and has publicly traded shares, fitting the characteristics of a mixed-ownership model rather than horizontal ownership. The description provided does not indicate any mutual shareholding arrangements with other entities, which is a key feature of the horizontal ownership model. ", "explhtml": "<p>Highmark Petroleum, as described, is a company that is partially owned by the Canadian government and also has shares traded on the Toronto Stock Exchange. This ownership structure is indicative of a mixed-ownership model, where a state-owned enterprise (SOE) is partially owned by a government but also allows for public investment through the stock market. This model is particularly common in sectors that are vital to national interests or require substantial capital investments, which might be too large for private entities to handle alone. In the case of Highmark Petroleum, the involvement of the government and public investors allows for shared control and funding, which is essential for large-scale projects like the expansion of energy projects in Canada. The mixed-ownership model enables the government to maintain strategic control while also leveraging private capital and expertise to enhance efficiency and innovation.<\/p><p><b>A is incorrect.<\/b> The interlocking directorates model refers to a scenario where the same individuals serve on the boards of multiple corporations, which is not the case described for Highmark Petroleum. While the CEO and the majority of the executive directors are nominated by the provincial government of British Columbia, there is no indication that these individuals hold board positions in other companies simultaneously. Therefore, this model does not apply to Highmark Petroleum&#x27;s ownership structure, which is characterized by government involvement coupled with public trading of shares, rather than inter-corporate board linkages.<\/p><p><b>C is incorrect.<\/b> The horizontal ownership model involves companies that have mutual business interests and engage in cross-holding share arrangements with each other. This model typically sees companies owning stakes in each other to secure business relationships or strategic alliances. In the case of Highmark Petroleum, the company&#x27;s ownership structure does not suggest any cross-holdings with other firms. Instead, it is partially owned by the government and has publicly traded shares, fitting the characteristics of a mixed-ownership model rather than horizontal ownership. The description provided does not indicate any mutual shareholding arrangements with other entities, which is a key feature of the horizontal ownership model. <\/p><p class=\"los\">Corporate Issuers, Learning Module 2:Environmental, Social and Governance (ESG) Considerations in Investment Analysis, LOS 2(a): Describe global variations in ownership structures and the possible effects of these variations on corporate governance policies and practices.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Henry Paul<\/summary><div class=\"vig-body\"><p>Henry Paul is an Investment banker working for a large global bank. Currently, he is analyzing<\/p><p>the Canadian liquified natural gas (LNG) market to structure a deal for one of the bank&#x27;s clients,<\/p><p>Highmark Petroleum, which wants to invest in expanding its energy projects in Canada.<\/p><p>Highmark is a listed state-owned entity, partially owned by the Canadian government, with<\/p><p>shares also traded on the Toronto Stock Exchange. The company has a one-tier board structure,<\/p><p>with the CEO serving as the board&#x27;s chair. The provincial government of British Columbia<\/p><p>nominates the CEO and the majority of the executive directors. The executive directors have<\/p><p>served on the board for an average of 15 years.<\/p><p>While Canada has had large gas reserves for some time, Paul&#x27;s analysis of the global LNG market<\/p><p>suggests these resources may now be available for export, especially since the rise of shale gas<\/p><p>production south of the border has curtailed sales into the US. The key question has always been<\/p><p>whether their development could be done cost-effectively to allow Canadian LNG to compete<\/p><p>with emerging supplies from the rest of the world. The recent decision by Highmark and its<\/p><p>partners to invest in the LNG Canada project has underscored that they, at the very least, believe<\/p><p>the prospects are favorable in British Columbia, based on low upstream costs and the resolution<\/p><p>of numerous midstream and regulatory issues.<\/p><p>Canadian historians know that many of Canada’s Indigenous peoples have, at times, been treated<\/p><p>highly unfairly — their culture and way of life denigrated and disregarded. Many Indigenous<\/p><p>communities in Canada face a lack of economic opportunity in their communities. For example,<\/p><p>poor access to essential services such as clean water and social problems relating to crime and<\/p><p>addiction occur at alarmingly higher rates than national averages. LNG development offers these<\/p><p>mostly remote communities meaningful and sizable opportunities for local employment,<\/p><p>infrastructure development, a boost to entrepreneurship, specialized skill development, and<\/p><p>cultural preservation. Although many contractors and suppliers to major resource projects in<\/p><p>Canada today are Indigenous-owned, Indigenous communities now seek representation on<\/p><p>corporate boards to participate in development decisions affecting their regions. A series of<\/p><p>Supreme Court cases has progressively sought to define this trend.<\/p><p>Research shows Canadian ESG proponents to be trailblazers in reducing liquefaction emissions.<\/p><p>LNG plants in Canada are designed to be 32% more efficient than the world&#x27;s current lowest-<\/p><p>emitting plant. Greater emission reductions would result from plans to power LNG plants with<\/p><p>electric motors using hydroelectricity – the newly sanctioned hydroelectric-driven LNG plant will<\/p><p>emit significantly fewer emissions. However, the plant is not considered world-scale. The IEA<\/p><p>estimates that this electric “cleaner” LNG generates a 40% reduction in GHG emissions from<\/p><p>coal-to-gas switching, compared to only a 30% reduction with industry-standard gas turbine-<\/p><p>powered LNG plants.<\/p><\/div><\/details><div class=\"qtext\"><p>The ownership structure of Highmark Petroleum is best described as:<\/p><\/div>", "subj": "corporate"}, {"n": 10, "q": "The board structure of Highmark Petroleum would most likely warrant a share risk premium that:", "opts": ["Is higher than average.", "Is lower than average.", "Reflects only the volatility of LNG prices."], "ans": "A", "expl": "The structure of the Highmark board, which is a one-tier system where the CEO also serves as the chair, presents a significant governance risk. In corporate governance, the separation of the CEO and board chair roles is recommended to ensure an effective balance of power and enhance the board's ability to monitor and oversee management. However, in Highmark's case, the CEO's dual role, combined with the fact that the provincial government of British Columbia nominates him and the majority of the executive directors, could lead to conflicts of interest and reduced independent oversight. This governance structure can make external investors wary due to the potential for decisions that favor the interests of the provincial government over those of other shareholders. Such concerns are likely to increase the perceived risk associated with the company's shares, thereby justifying a higher than average risk premium. B is incorrect. Arguing that the board structure of Highmark would warrant a lower than average risk premium overlooks the significant governance concerns posed by the CEO's dual role and the influence of the provincial government. In general, strong, independent board governance is associated with lower risk premiums because it assures investors of rigorous oversight and minimized conflicts of interest. Highmark's governance structure, characterized by potential governmental interference and lack of independence, typically increases the uncertainty and risk perceived by investors, not decreases it. Therefore, it is unlikely that this structure would lead to a lower than average risk premium. C is incorrect. While commodity price volatility (like LNG prices) does influence equity risk premiums in energy companies, this choice ignores governance-related risk. The question specifically points to board structure and governance issues, which contribute to a separate layer of risk beyond price volatility. Therefore, this choice misses the core issue. ", "explhtml": "<p>The structure of the Highmark board, which is a one-tier system where the CEO also serves as the chair, presents a significant governance risk. In corporate governance, the separation of the CEO and board chair roles is recommended to ensure an effective balance of power and enhance the board&#x27;s ability to monitor and oversee management. However, in Highmark&#x27;s case, the CEO&#x27;s dual role, combined with the fact that the provincial government of British Columbia nominates him and the majority of the executive directors, could lead to conflicts of interest and reduced independent oversight. This governance structure can make external investors wary due to the potential for decisions that favor the interests of the provincial government over those of other shareholders. Such concerns are likely to increase the perceived risk associated with the company&#x27;s shares, thereby justifying a higher than average risk premium.<\/p><p><b>B is incorrect<\/b>. Arguing that the board structure of Highmark would warrant a lower than average risk premium overlooks the significant governance concerns posed by the CEO&#x27;s dual role and the influence of the provincial government. In general, strong, independent board governance is associated with lower risk premiums because it assures investors of rigorous oversight and minimized conflicts of interest. Highmark&#x27;s governance structure, characterized by potential governmental interference and lack of independence, typically increases the uncertainty and risk perceived by investors, not decreases it. Therefore, it is unlikely that this structure would lead to a lower than average risk premium.<\/p><p><b>C is incorrect<\/b>. While commodity price volatility (like LNG prices) does influence equity risk premiums in energy companies, this choice ignores governance-related risk. The question specifically points to board structure and governance issues, which contribute to a separate layer of risk beyond price volatility. Therefore, this choice misses the core issue. <\/p><p class=\"los\">Corporate Issuers, Learning Module 2:Environmental, Social and Governance (ESG) Considerations in Investment Analysis, LOS 2(a): Describe global variations in ownership structures and the possible effects of these variations on corporate governance policies and practices.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Henry Paul<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Henry Paul is an Investment banker working for a large global bank. Currently, he is analyzing<\/p><p>the Canadian liquified natural gas (LNG) market to structure a deal for one of the bank&#x27;s clients,<\/p><p>Highmark Petroleum, which wants to invest in expanding its energy projects in Canada.<\/p><p>Highmark is a listed state-owned entity, partially owned by the Canadian government, with<\/p><p>shares also traded on the Toronto Stock Exchange. The company has a one-tier board structure,<\/p><p>with the CEO serving as the board&#x27;s chair. The provincial government of British Columbia<\/p><p>nominates the CEO and the majority of the executive directors. The executive directors have<\/p><p>served on the board for an average of 15 years.<\/p><p>While Canada has had large gas reserves for some time, Paul&#x27;s analysis of the global LNG market<\/p><p>suggests these resources may now be available for export, especially since the rise of shale gas<\/p><p>production south of the border has curtailed sales into the US. The key question has always been<\/p><p>whether their development could be done cost-effectively to allow Canadian LNG to compete<\/p><p>with emerging supplies from the rest of the world. The recent decision by Highmark and its<\/p><p>partners to invest in the LNG Canada project has underscored that they, at the very least, believe<\/p><p>the prospects are favorable in British Columbia, based on low upstream costs and the resolution<\/p><p>of numerous midstream and regulatory issues.<\/p><p>Canadian historians know that many of Canada’s Indigenous peoples have, at times, been treated<\/p><p>highly unfairly — their culture and way of life denigrated and disregarded. Many Indigenous<\/p><p>communities in Canada face a lack of economic opportunity in their communities. For example,<\/p><p>poor access to essential services such as clean water and social problems relating to crime and<\/p><p>addiction occur at alarmingly higher rates than national averages. LNG development offers these<\/p><p>mostly remote communities meaningful and sizable opportunities for local employment,<\/p><p>infrastructure development, a boost to entrepreneurship, specialized skill development, and<\/p><p>cultural preservation. Although many contractors and suppliers to major resource projects in<\/p><p>Canada today are Indigenous-owned, Indigenous communities now seek representation on<\/p><p>corporate boards to participate in development decisions affecting their regions. A series of<\/p><p>Supreme Court cases has progressively sought to define this trend.<\/p><p>Research shows Canadian ESG proponents to be trailblazers in reducing liquefaction emissions.<\/p><p>LNG plants in Canada are designed to be 32% more efficient than the world&#x27;s current lowest-<\/p><p>emitting plant. Greater emission reductions would result from plans to power LNG plants with<\/p><p>electric motors using hydroelectricity – the newly sanctioned hydroelectric-driven LNG plant will<\/p><p>emit significantly fewer emissions. However, the plant is not considered world-scale. The IEA<\/p><p>estimates that this electric “cleaner” LNG generates a 40% reduction in GHG emissions from<\/p><p>coal-to-gas switching, compared to only a 30% reduction with industry-standard gas turbine-<\/p><p>powered LNG plants.<\/p><\/div><\/details><div class=\"qtext\"><p>The board structure of Highmark Petroleum would most likely warrant a share risk premium that:<\/p><\/div>", "subj": "corporate"}, {"n": 11, "q": "Granting Indigenous communities board representation as independent directors will most likely:", "opts": ["Increase investors’ perception of the corporation’s risk.", "Decrease investors’ perception of the corporation’s risk.", "Have no effect on investors’ perceived risk."], "ans": "B", "expl": "Granting Indigenous communities a seat at the table and potentially equity ownership in the LNG project managed by Highmark is a strategic decision that aligns with broader social and governance goals. By involving Indigenous communities as stakeholders, Highmark not only fosters goodwill and stronger relationships with these communities but also mitigates potential conflicts and disruptions that could arise from local opposition. This inclusive approach is likely to enhance the company's social license to operate, which is crucial in sectors like natural resources where environmental and social governance (ESG) factors significantly influence investor decisions. Furthermore, the presence of independent directors who represent diverse interests can lead to more balanced and prudent decision-making, reducing governance-related risks. These factors collectively contribute to a decrease in the perceived risk among investors, as they can see that the company is actively managing social and governance challenges. A is incorrect. Increasing the representation of Indigenous communities and independent directors on the board is generally perceived as a positive step towards better governance and community relations. This approach tends to reduce conflicts and enhances the company's reputation, which are factors that lower the perceived risk among investors. C is incorrect. It is unlikely that investors' perception of the corporation's risk remains unchanged when the company takes significant steps towards improving governance and community relations. The inclusion of Indigenous communities and independent directors is not a neutral action; it actively enhances the company's governance structure and community engagement. These changes are typically viewed favorably by investors who are increasingly focusing on ESG factors as critical components of their investment decisions. ", "explhtml": "<p>Granting Indigenous communities a seat at the table and potentially equity ownership in the LNG project managed by Highmark is a strategic decision that aligns with broader social and governance goals. By involving Indigenous communities as stakeholders, Highmark not only fosters goodwill and stronger relationships with these communities but also mitig
