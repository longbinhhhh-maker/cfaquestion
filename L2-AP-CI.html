e was $2, and its pre-<\/p><p>transaction stock price was $ 1.50. Socrates plans to use the proceeds to expand its operations<\/p><p>in Asia and the Middle East. As part of the agreement, Socrates agreed not to sell Metaxas&#x27;<\/p><p>shares for seven years from the date of the acquisition’s closing.<\/p><p>Metaxas financed the acquisition with cash on hand plus a $1 billion loan from a financial<\/p><p>institution at a 7% interest rate. Metaxas expects to realize $180 million in EBITDA by year 3,<\/p><p>driven by its expansion into foreign markets and revenue from the motorcycle manufacturing<\/p><p>business. The incremental amortization expense associated with the net acquired assets is $150<\/p><p>million per year. The income tax rate is 30%. Summarized historical data and financial forecasts<\/p><p>for Metaxas and Socrates are provided in Exhibits 1 and 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0042.webp\" style=\"max-width:min(100%,485px)\" alt=\"Exhibit 1: Metaxas Summary Financial Data (Pre-Acquisition) 20X4 20X5 20X6 Net revenues 21,860 19,980 20,160 Cost of sales (10, 930) (9, 990) (10, 080) Operating expense (2, 500) (3, 000) (2, 600) EBITDA 8,430 6,990 7,480 Depreciation &amp; Amortization (1, 000) (902) (1, 050) EBIT 7,430 6,088 6,430 Int\"><\/div><\/details><div class=\"qtext\"><p>What impact does the acquisition of Socrates have on Metaxas Ltd’s 20X5 debt-to-EBITDA ratio?:<\/p><\/div>", "subj": "corporate"}, {"n": 23, "q": "The impact of the transaction on Metaxas’ Diluted EPS is closest to:", "opts": ["The diluted EPS will increase.", "The diluted EPS will decrease.", "The diluted EPS will remain the same."], "ans": "A", "expl": "The acquisition of Socrates by Metaxas Ltd is expected to result in an increase in the diluted Earnings Per Share (EPS) for Metaxas. This expectation is based on the combined financial projections post-acquisition. Before the acquisition, Metaxas had a diluted EPS of 3.19. After the acquisition, the diluted EPS is projected to increase to 5.04. This increase is primarily due to the expected rise in net income following the integration of Socrates' profitable operations into Metaxas. The financial forecast shows that the combined net revenues will increase from $20,160 million to $30,720 million, and despite the rise in costs and expenses, the overall EBITDA will improve from $7,480 million to $11,560 million. The net income, consequently, is projected to increase from $3,829 million to $6,246 million, even after accounting for increased interest expenses and depreciation & amortization costs. The increase in net income is a significant factor contributing to the rise in diluted EPS, as it directly impacts the bottom line. B is incorrect. The option stating that the diluted EPS will decrease is incorrect because the financial projections indicate an improvement in Metaxas' profitability post-acquisition. The detailed financial analysis shows that despite the initial costs associated with the acquisition, such as increased interest expenses and higher depreciation & amortization costs, the overall effect on net income is positive. The acquisition allows Metaxas to tap into the profitable motorcycle market, which Socrates has successfully penetrated. This strategic move is expected to offset the increased costs and contribute positively to the earnings, thereby increasing the diluted EPS from 3.19 to 5.04. C is incorrect. The statement that the diluted EPS will remain the same overlooks the significant impact of the acquisition on Metaxas' financials. The financial data clearly shows an increase in net revenues and net income, which are critical components in calculating EPS. The integration of Socrates' operations is projected to enhance Metaxas' market position and financial performance, leading to an increase in shareholder value through a higher EPS. Stating that the EPS will remain unchanged does not align with the financial projections and the strategic benefits anticipated from the acquisition. ", "explhtml": "<p>The acquisition of Socrates by Metaxas Ltd is expected to result in an increase in the diluted Earnings Per Share (EPS) for Metaxas. This expectation is based on the combined financial projections post-acquisition. Before the acquisition, Metaxas had a diluted EPS of 3.19. After the acquisition, the diluted EPS is projected to increase to 5.04. This increase is primarily due to the expected rise in net income following the integration of Socrates&#x27; profitable operations into Metaxas. The financial forecast shows that the combined net revenues will increase from $20,160 million to $30,720 million, and despite the rise in costs and expenses, the overall EBITDA will improve from $7,480 million to $11,560 million. The net income, consequently, is projected to increase from $3,829 million to $6,246 million, even after accounting for increased interest expenses and depreciation &amp; amortization costs. The increase in net income is a significant factor contributing to the rise in diluted EPS, as it directly impacts the bottom line.<\/p><p><b>B is incorrect<\/b>. The option stating that the diluted EPS will decrease is incorrect because the financial projections indicate an improvement in Metaxas&#x27; profitability post-acquisition. The detailed financial analysis shows that despite the initial costs associated with the acquisition, such as increased interest expenses and higher depreciation &amp; amortization costs, the overall effect on net income is positive. The acquisition allows Metaxas to tap into the profitable motorcycle market, which Socrates has successfully penetrated. This strategic move is expected to offset the increased costs and contribute positively to the earnings, thereby increasing the diluted EPS from 3.19 to 5.04.<\/p><p><b>C is incorrect<\/b>. The statement that the diluted EPS will remain the same overlooks the significant impact of the acquisition on Metaxas&#x27; financials. The financial data clearly shows an increase in net revenues and net income, which are critical components in calculating EPS. The integration of Socrates&#x27; operations is projected to enhance Metaxas&#x27; market position and financial performance, leading to an increase in shareholder value through a higher EPS. Stating that the EPS will remain unchanged does not align with the financial projections and the strategic benefits anticipated from the acquisition. <\/p><p class=\"los\">Corporate Issuers, Learning Module 4: Corporate Restructuring, LOS 4 (d) Demonstrate how corporate restructuring affect an issuer’s EPS, net debt-to-EBITDA ratio, and weighted average cost of capital.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Metaxas Ltd<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Metaxas Ltd is an automobile manufacturer that specializes in crossover SUVs and sedans.<\/p><p>Metaxas has experienced declining sales due to intense competition from other manufacturers.<\/p><p>To improve its financial position and realize shareholder value, Metaxas is seeking to diversify<\/p><p>away from the competitive automotive market. Socrates is a motorcycle manufacturer that<\/p><p>specializes in producing off-road motorcycles. Socrates has consistently increased sales revenue<\/p><p>and profits over the past five years. This has made it an attractive target for Metaxas.<\/p><p>At the beginning of 20X5, Metaxas Ltd and Socrates announced that the two parties had reached<\/p><p>an agreement in which Metaxas would acquire Socrates. The $4 billion deal included $3 billion in<\/p><p>cash and 60 million Metaxas shares.. Metaxas and Socrates expect to close the deal by June 30,<\/p><p>20X5. At the time of the transaction, Socrates&#x27; deal price per share was $2, and its pre-<\/p><p>transaction stock price was $ 1.50. Socrates plans to use the proceeds to expand its operations<\/p><p>in Asia and the Middle East. As part of the agreement, Socrates agreed not to sell Metaxas&#x27;<\/p><p>shares for seven years from the date of the acquisition’s closing.<\/p><p>Metaxas financed the acquisition with cash on hand plus a $1 billion loan from a financial<\/p><p>institution at a 7% interest rate. Metaxas expects to realize $180 million in EBITDA by year 3,<\/p><p>driven by its expansion into foreign markets and revenue from the motorcycle manufacturing<\/p><p>business. The incremental amortization expense associated with the net acquired assets is $150<\/p><p>million per year. The income tax rate is 30%. Summarized historical data and financial forecasts<\/p><p>for Metaxas and Socrates are provided in Exhibits 1 and 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0042.webp\" style=\"max-width:min(100%,485px)\" alt=\"Exhibit 1: Metaxas Summary Financial Data (Pre-Acquisition) 20X4 20X5 20X6 Net revenues 21,860 19,980 20,160 Cost of sales (10, 930) (9, 990) (10, 080) Operating expense (2, 500) (3, 000) (2, 600) EBITDA 8,430 6,990 7,480 Depreciation &amp; Amortization (1, 000) (902) (1, 050) EBIT 7,430 6,088 6,430 Int\"><\/div><\/details><div class=\"qtext\"><p>The impact of the transaction on Metaxas’ Diluted EPS is closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 24, "q": "The takeover premium of the transaction will be closest to:", "opts": ["33.30%", "20%", "30%"], "ans": "A", "expl": "The calculation of the takeover premium involves determining the percentage increase from the unaffected stock price to the deal price per share. The formula for calculating the takeover premium (PRM) is given by: In this case, the deal price per share (DP) for Socrates is $2, and the unaffected stock price per share (SP) is $1.5. Plugging these values into the formula gives: This calculation shows that the takeover premium is 33.3%, which is a significant increase over the unaffected stock price, reflecting the value that Metaxas Ltd sees in acquiring Socrates to diversify and strengthen its business operations. B is incorrect. The calculation for a 20% takeover premium would imply a different set of financial figures. If the takeover premium were 20%, it would suggest that the deal price per share was calculated as follows: Deal Price = Unaffected Stock Price × (1 + Takeover Premium) = 1.5 × (1 + 0.20) = 1.8 However, the deal price per share as stated in the scenario is $2, not $1.8. Therefore, a 20% premium does not align with the given financial data, making option B incorrect. C is incorrect. To achieve a 30% takeover premium, the deal price would have been calculated as follows: Deal Price = Unaffected Stock Price × (1 + Takeover Premium) = 1.5 × (1 + 0.30) = 1.95 However, the actual deal price per share provided in the scenario is $2, which is higher than $1.95. This discrepancy indicates that the premium is not 30%, but rather 33.3% as correctly calculated in option A. Thus, option C does not accurately reflect the financial terms of the acquisition as described. ", "explhtml": "<p>The calculation of the takeover premium involves determining the percentage increase from the unaffected stock price to the deal price per share. The formula for calculating the takeover premium (PRM) is given by:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0047.webp\" style=\"max-width:min(100%,385px)\" alt=\"(Deal Price −Unaffected Stock Price) PRM = Unaffected Stock Price × 100%\"><p>In this case, the deal price per share (DP) for Socrates is $2, and the unaffected stock price per share (SP) is $1.5. Plugging these values into the formula gives:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0048.webp\" style=\"max-width:min(100%,373px)\" alt=\"(2 −1.5) 0.5 PRM = × 100% = × 100% = 33.3% 1.5 1.5\"><p>This calculation shows that the takeover premium is 33.3%, which is a significant increase over the unaffected stock price, reflecting the value that Metaxas Ltd sees in acquiring Socrates to diversify and strengthen its business operations.<\/p><p><b>B is incorrect<\/b>. The calculation for a 20% takeover premium would imply a different set of financial figures. If the takeover premium were 20%, it would suggest that the deal price per share was calculated as follows:<\/p><p>Deal Price = Unaffected Stock Price × (1 + Takeover Premium) = 1.5 × (1 + 0.20) = 1.8<\/p><p>However, the deal price per share as stated in the scenario is $2, not $1.8. Therefore, a 20% premium does not align with the given financial data, making option B incorrect.<\/p><p><b>C is incorrect<\/b>. To achieve a 30% takeover premium, the deal price would have been calculated as follows:<\/p><p>Deal Price = Unaffected Stock Price × (1 + Takeover Premium) = 1.5 × (1 + 0.30) = 1.95<\/p><p>However, the actual deal price per share provided in the scenario is $2, which is higher than $1.95. This discrepancy indicates that the premium is not 30%, but rather 33.3% as correctly calculated in option A. Thus, option C does not accurately reflect the financial terms of the acquisition as described. <\/p><p class=\"los\">Corporate Issuers, Learning Module 4: Corporate Restructuring, LOS 4 (c) Demonstrate valuation methods for and interpret valuations of, companies involved in corporate restructurings.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Metaxas Ltd<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Metaxas Ltd is an automobile manufacturer that specializes in crossover SUVs and sedans.<\/p><p>Metaxas has experienced declining sales due to intense competition from other manufacturers.<\/p><p>To improve its financial position and realize shareholder value, Metaxas is seeking to diversify<\/p><p>away from the competitive automotive market. Socrates is a motorcycle manufacturer that<\/p><p>specializes in producing off-road motorcycles. Socrates has consistently increased sales revenue<\/p><p>and profits over the past five years. This has made it an attractive target for Metaxas.<\/p><p>At the beginning of 20X5, Metaxas Ltd and Socrates announced that the two parties had reached<\/p><p>an agreement in which Metaxas would acquire Socrates. The $4 billion deal included $3 billion in<\/p><p>cash and 60 million Metaxas shares.. Metaxas and Socrates expect to close the deal by June 30,<\/p><p>20X5. At the time of the transaction, Socrates&#x27; deal price per share was $2, and its pre-<\/p><p>transaction stock price was $ 1.50. Socrates plans to use the proceeds to expand its operations<\/p><p>in Asia and the Middle East. As part of the agreement, Socrates agreed not to sell Metaxas&#x27;<\/p><p>shares for seven years from the date of the acquisition’s closing.<\/p><p>Metaxas financed the acquisition with cash on hand plus a $1 billion loan from a financial<\/p><p>institution at a 7% interest rate. Metaxas expects to realize $180 million in EBITDA by year 3,<\/p><p>driven by its expansion into foreign markets and revenue from the motorcycle manufacturing<\/p><p>business. The incremental amortization expense associated with the net acquired assets is $150<\/p><p>million per year. The income tax rate is 30%. Summarized historical data and financial forecasts<\/p><p>for Metaxas and Socrates are provided in Exhibits 1 and 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0042.webp\" style=\"max-width:min(100%,485px)\" alt=\"Exhibit 1: Metaxas Summary Financial Data (Pre-Acquisition) 20X4 20X5 20X6 Net revenues 21,860 19,980 20,160 Cost of sales (10, 930) (9, 990) (10, 080) Operating expense (2, 500) (3, 000) (2, 600) EBITDA 8,430 6,990 7,480 Depreciation &amp; Amortization (1, 000) (902) (1, 050) EBIT 7,430 6,088 6,430 Int\"><\/div><\/details><div class=\"qtext\"><p>The takeover premium of the transaction will be closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 25, "q": "Based on the median valuation of AgriTech Ltd’s peers and its current valuation, the conglomerate discount, ignoring unallocated costs, is closest to:", "opts": ["ZAR 0", "ZAR 438", "ZAR 2061"], "ans": "B", "expl": "Condensed Solution – Conglomerate Discount Step 1 – Calculate EV and EV/EBITDA for Consulting Comparables The table below summarizes EV and EV/EBITDA calculations for the consulting segment comparables: Ordered EV/EBITDA: Median: Step 2 – Median EV/Sales for Equipment Comparables EV/Sales values: Ordered: Median: Step 3 – Apply Median Multiples to Segment Data Consulting EV: Equipment EV: SOTP Value: Step 4 – Conglomerate Discount AgriTech's current EV: Conglomerate Discount:", "explhtml": "<p><b>Condensed Solution – Conglomerate Discount<\/b><\/p><p><b>Step 1 – Calculate EV and EV/EBITDA for Consulting Comparables<\/b> The table below summarizes EV and EV/EBITDA calculations for the consulting segment comparables:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0052.webp\" style=\"max-width:min(100%,546px)\" alt=\"Company Cash Debt Market Cap EBITDA EV/EBITDA Comp 1 120 240 1,565 160 1,565+240−120 160 = 10.53 Comp 2 90 254 1,243 105 1,243+254−90 105 = 13.40 Comp 3 450 349 2,134 213 2,134+349−450 213 = 9.54 Comp 4 232 126 2,550 305 2,550+126−232 305 = 8.01 Comp 5 103 66 968 78 968+66−103 78 = 11.94\"><p><b>Ordered EV/EBITDA:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0053.webp\" style=\"max-width:min(100%,257px)\" alt=\"8.01,  9.54,  10.53,  11.94, 13.40\"><p><b>Median:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0054.webp\" style=\"max-width:min(100%,204px)\" alt=\"EV/EBITDAMedian = 10.53\"><p><b>Step 2 – Median EV/Sales for Equipment Comparables<\/b><\/p><p>EV/Sales values:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0055.webp\" style=\"max-width:min(100%,165px)\" alt=\"{12,  15,  12, 8,  10}\"><p>Ordered:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0056.webp\" style=\"max-width:min(100%,147px)\" alt=\"8,  10,  12,  12,  15\"><p><b>Median:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0057.webp\" style=\"max-width:min(100%,161px)\" alt=\"EV/SalesMedian = 12\"><p><b>Step 3 – Apply Median Multiples to Segment Data<\/b><\/p><p>Consulting EV:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0058.webp\" style=\"max-width:min(100%,258px)\" alt=\"EVConsulting = 98 × 10.53 = 1,032\"><p>Equipment EV:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0059.webp\" style=\"max-width:min(100%,235px)\" alt=\"EVEquipment = 86 × 12 = 1,032\"><p><b>SOTP Value:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0060.webp\" style=\"max-width:min(100%,272px)\" alt=\"SOTP EV = 1,032 + 1,032 = 2,064\"><p><b>Step 4 – Conglomerate Discount<\/b><\/p><p>AgriTech&#x27;s current EV:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0061.webp\" style=\"max-width:min(100%,133px)\" alt=\"EVActual = 1,626\"><p>Conglomerate Discount:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0062.webp\" style=\"max-width:min(100%,257px)\" alt=\"Discount = 2,064 −1,626 = 438\"><p class=\"los\">Corporate Issuers, Learning Module 4: Corporate Restructuring, LOS 4(f) Evaluate corporate divestment actions, including sales and spin-off<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · AgriTech Ltd<\/summary><div class=\"vig-body\"><p>AgriTech Ltd, based in South Africa, manufactures agricultural equipment in addition to offering<\/p><p>agricultural consulting. The company operates two segments: AgriTech Consulting and AgriTech<\/p><p>Equipment. Summarized financial information for AgriTech Ltd for the last twelve months (LTM)<\/p><p>and the prior year period is shown in Exhibits 1,2, and 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0049.webp\" style=\"max-width:min(100%,481px)\" alt=\"Exhibit 1: AgriTech Reconciliation of Segment EBITDA to Consolidated EPS and Net Income Prior Year Period Last 12 months Total segment EBITDA 85 92 D&amp;A (22) (24) Unallocated cost (6) (6) EBIT 57 62 Interest expense (10) (11) Income taxes (9) (10) Net income 38 41 Shares outstanding 1200 1200 Diluted\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0050.webp\" style=\"max-width:min(100%,439px)\" alt=\"Exhibit 3: AgriTech Ltd Statement of Financial Position: Prior Year, and Most Recent Quarter (MRQ) Prior Year MRQ Cash and equivalents 200 230 Other current assets 150 140 Total current assets 350 370 Non-current assets 620 680 Total assets 970 1050 Current debt 30 30 Other current liabilities 100 1\"><p>AgriTech Equipment&#x27;s sales have grown significantly in recent years, but the company still lags<\/p><p>behind its peers in share price performance over the last five years. AgriTech Ltd is valued at<\/p><p>sales and EBITDA (LTM) multiples of 4 and 21, resulting in an enterprise value of ZAR 1,626<\/p><p>million. A financial institution is looking to acquire a 10% stake in AgriTech Ltd. The company is<\/p><p>looking to work with management to improve shareholder value. AgriTech announced that its<\/p><p>board of directors had initiated a strategic review of alternatives to increase shareholder value.<\/p><p>The board formed a strategy committee where the chairman announced the following:<\/p><p>“We are committed to improving value and have identified strategic alternatives, including<\/p><p>spinning off or selling parts of the business,” the chairman said. “AgriTech’s management has an<\/p><p>unbeatable track record of creating shareholder value.<\/p><p>Management is considering two actions:<\/p><p>I. Spinning off the AgriTech Consulting segment. II. Selling the AgriTech Consulting segment.<\/p><p>Exhibits 4, 5, and 6 contain data from comparable company and transaction analyses for the<\/p><p>consulting segment. If AgriTech decides to sell the consulting segment, annual unallocated costs<\/p><p>are expected to decrease by ZAR 2 million, and D&amp;A expense is expected to decrease by ZAR 16<\/p><p>million. AgriTech plans to use part of the proceeds from the sale to repurchase 300,000 shares and targets an EBITDA of ZAR 120 million post-sale.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0051.webp\" style=\"max-width:min(100%,490px)\" alt=\"Exhibit 4: AgriTech Consulting Segment: Comparable Company Information. Company Cash Debt EBITDA Market cap Comparable 1 120 240 160 1, 565 Comparable 2 90 254 105 1, 243 Comparable 3 450 349 213 2, 134 Comparable 4 232 126 305 2, 550 Comparable 5 103 66 78 968 Exhibit 5: AgriTech Consulting Segment\"><\/div><\/details><div class=\"qtext\"><p>Based on the median valuation of AgriTech Ltd’s peers and its current valuation, the conglomerate discount, ignoring unallocated costs, is closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 26, "q": "Assuming that the unallocated cost is allocated to the AgriTech Consulting segment, the conglomerate discount is closest to?", "opts": ["435", "1656", "375"], "ans": "C", "expl": "Step 1 – Adjust Consulting EBITDA by Allocating Unallocated Cost Given: Unallocated cost: ZAR 6 million Reported Consulting EBITDA: ZAR 98 million Adjusted Consulting EBITDA: Step 2 – Use Median EV/EBITDA Multiple to Estimate Consulting EV From Question 1, we previously calculated the median EV/EBITDA multiple from comparables: Adjusted Consulting EV: Step 3 – Estimate Equipment Segment EV (Unchanged) Using the same EV/Sales multiple as before: Equipment Segment Sales: ZAR 86 million Step 4 – Updated SOTP Valuation Step 5 – Conglomerate Discount AgriTech’s actual EV: ZAR 1,626 million", "explhtml": "<p><b>Step 1 – Adjust Consulting EBITDA by Allocating Unallocated Cost<\/b><\/p><p>Given:<\/p><p>Unallocated cost: ZAR 6 million<\/p><p>Reported Consulting EBITDA: ZAR 98 million<\/p><p><b>Adjusted Consulting EBITDA:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0063.webp\" style=\"max-width:min(100%,313px)\" alt=\"Adjusted EBITDAConsulting = 98 −6 = 92\"><p><b>Step 2 – Use Median EV/EBITDA Multiple to Estimate Consulting EV<\/b><\/p><p>From Question 1, we previously calculated the median EV/EBITDA multiple from comparables:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0064.webp\" style=\"max-width:min(100%,204px)\" alt=\"EV/EBITDAMedian = 10.53\"><p><b>Adjusted Consulting EV:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0065.webp\" style=\"max-width:min(100%,319px)\" alt=\"EVConsulting = 92 × 10.53 = 968.76 ≈969\"><p><b>Step 3 – Estimate Equipment Segment EV (Unchanged)<\/b><\/p><p>Using the same EV/Sales multiple as before:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0066.webp\" style=\"max-width:min(100%,205px)\" alt=\"EV/Sales Median: 12\"><p>Equipment Segment Sales: ZAR 86 million<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0067.webp\" style=\"max-width:min(100%,235px)\" alt=\"EVEquipment = 86 × 12 = 1,032\"><p><b>Step 4 – Updated SOTP Valuation<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0068.webp\" style=\"max-width:min(100%,458px)\" alt=\"SOTP EV = EVConsulting + EVEquipment = 969 + 1,032 = 2,001\"><p><b>Step 5 – Conglomerate Discount<\/b><\/p><p>AgriTech’s actual EV: ZAR 1,626 million<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0069.webp\" style=\"max-width:min(100%,553px)\" alt=\"Conglomerate Discount = SOTP EV −Actual EV = 2,001 −1,626 = 375\"><p class=\"los\">CFA Level II, Learning Module 21: Corporate Restructuring, LOS 21(f) Evaluate corporate divestment actions, including sales and spin-off<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · AgriTech Ltd<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>AgriTech Ltd, based in South Africa, manufactures agricultural equipment in addition to offering<\/p><p>agricultural consulting. The company operates two segments: AgriTech Consulting and AgriTech<\/p><p>Equipment. Summarized financial information for AgriTech Ltd for the last twelve months (LTM)<\/p><p>and the prior year period is shown in Exhibits 1,2, and 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0049.webp\" style=\"max-width:min(100%,481px)\" alt=\"Exhibit 1: AgriTech Reconciliation of Segment EBITDA to Consolidated EPS and Net Income Prior Year Period Last 12 months Total segment EBITDA 85 92 D&amp;A (22) (24) Unallocated cost (6) (6) EBIT 57 62 Interest expense (10) (11) Income taxes (9) (10) Net income 38 41 Shares outstanding 1200 1200 Diluted\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0050.webp\" style=\"max-width:min(100%,439px)\" alt=\"Exhibit 3: AgriTech Ltd Statement of Financial Position: Prior Year, and Most Recent Quarter (MRQ) Prior Year MRQ Cash and equivalents 200 230 Other current assets 150 140 Total current assets 350 370 Non-current assets 620 680 Total assets 970 1050 Current debt 30 30 Other current liabilities 100 1\"><p>AgriTech Equipment&#x27;s sales have grown significantly in recent years, but the company still lags<\/p><p>behind its peers in share price performance over the last five years. AgriTech Ltd is valued at<\/p><p>sales and EBITDA (LTM) multiples of 4 and 21, resulting in an enterprise value of ZAR 1,626<\/p><p>million. A financial institution is looking to acquire a 10% stake in AgriTech Ltd. The company is<\/p><p>looking to work with management to improve shareholder value. AgriTech announced that its<\/p><p>board of directors had initiated a strategic review of alternatives to increase shareholder value.<\/p><p>The board formed a strategy committee where the chairman announced the following:<\/p><p>“We are committed to improving value and have identified strategic alternatives, including<\/p><p>spinning off or selling parts of the business,” the chairman said. “AgriTech’s management has an<\/p><p>unbeatable track record of creating shareholder value.<\/p><p>Management is considering two actions:<\/p><p>I. Spinning off the AgriTech Consulting segment. II. Selling the AgriTech Consulting segment.<\/p><p>Exhibits 4, 5, and 6 contain data from comparable company and transaction analyses for the<\/p><p>consulting segment. If AgriTech decides to sell the consulting segment, annual unallocated costs<\/p><p>are expected to decrease by ZAR 2 million, and D&amp;A expense is expected to decrease by ZAR 16<\/p><p>million. AgriTech plans to use part of the proceeds from the sale to repurchase 300,000 shares and targets an EBITDA of ZAR 120 million post-sale.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0051.webp\" style=\"max-width:min(100%,490px)\" alt=\"Exhibit 4: AgriTech Consulting Segment: Comparable Company Information. Company Cash Debt EBITDA Market cap Comparable 1 120 240 160 1, 565 Comparable 2 90 254 105 1, 243 Comparable 3 450 349 213 2, 134 Comparable 4 232 126 305 2, 550 Comparable 5 103 66 78 968 Exhibit 5: AgriTech Consulting Segment\"><\/div><\/details><div class=\"qtext\"><p>Assuming that the unallocated cost is allocated to the AgriTech Consulting segment, the conglomerate discount is closest to?<\/p><\/div>", "subj": "corporate"}, {"n": 27, "q": "If AgriTech Ltd. sells its Consulting segment and uses proceeds for a share buyback, which statement best describes the strategic rationale for the divestiture and share buyback?", "opts": ["The divestiture simplifies the business model and reallocates capital toward higher- growth opportunities.", "The divestiture increases business diversification to reduce segment-specific risk.", "The divestiture generates cash to raise external equity financing for Equipment segment expansion."], "ans": "A", "expl": "The strategic rationale for selling the Consulting segment and using part of the proceeds for a share buyback aligns with simplifying the business model and reallocating capital to higher-growth opportunities. This is supported by the following points in the case: Simplification of business model: AgriTech Ltd operates two distinct segments— Consulting and Equipment—with differing growth profiles and operational characteristics. By divesting the Consulting segment, the company can focus solely on its Equipment segment, which has demonstrated stronger sales growth (from ZAR 60 million to ZAR 86 million over the last year). Simplifying the business model allows management to concentrate resources and expertise on the core Equipment segment. Reallocation of capital: The sale of the Consulting segment generates significant cash proceeds, which can be used to repurchase shares and reduce the number of outstanding shares. This action enhances shareholder value by increasing earnings per share (EPS) and improving key financial metrics. Additionally, the proceeds could potentially be reinvested into the Equipment segment, which has higher growth potential compared to the Consulting segment. Focus on higher-growth Opportunities: The Equipment segment is likely to benefit from increased investment, particularly given its positive sales growth trajectory. Divesting the Consulting segment allows AgriTech to reallocate capital toward expanding and strengthening the Equipment segment, aligning with the company's goal of improving shareholder value. B is incorrect because selling the Consulting segment reduces operational diversification rather than increasing it. Diversification would involve retaining or acquiring businesses in different sectors, not divesting them. C is incorrect because the divestiture does not raise external equity financing. Instead, it generates internal cash proceeds from the sale of the Consulting segment, which are then used for a share buyback and potentially reinvested in the Equipment segment.", "explhtml": "<p>The strategic rationale for selling the Consulting segment and using part of the proceeds for a share buyback aligns with simplifying the business model and reallocating capital to higher-growth opportunities. This is supported by the following points in the case:<\/p><p><b>Simplification of business model<\/b>: AgriTech Ltd operates two distinct segments—<\/p><p>Consulting and Equipment—with differing growth profiles and operational<\/p><p>characteristics. By divesting the Consulting segment, the company can focus solely on<\/p><p>its Equipment segment, which has demonstrated stronger sales growth (from ZAR 60<\/p><p>million to ZAR 86 million over the last year). Simplifying the business model allows<\/p><p>management to concentrate resources and expertise on the core Equipment segment.<\/p><p><b>Reallocation of capital<\/b>: The sale of the Consulting segment generates significant<\/p><p>cash proceeds, which can be used to repurchase shares and reduce the number of<\/p><p>outstanding shares. This action enhances shareholder value by increasing earnings per<\/p><p>share (EPS) and improving key financial metrics. Additionally, the proceeds could<\/p><p>potentially be reinvested into the Equipment segment, which has higher growth<\/p><p>potential compared to the Consulting segment.<\/p><p><b>Focus on higher-growth Opportunities<\/b>: The Equipment segment is likely to benefit<\/p><p>from increased investment, particularly given its positive sales growth trajectory.<\/p><p>Divesting the Consulting segment allows AgriTech to reallocate capital toward<\/p><p>expanding and strengthening the Equipment segment, aligning with the company&#x27;s<\/p><p>goal of improving shareholder value.<\/p><p><b>B is incorrect<\/b> because selling the Consulting segment reduces operational diversification rather than increasing it. Diversification would involve retaining or acquiring businesses in different sectors, not divesting them.<\/p><p><b>C is incorrect<\/b> because the divestiture does not raise external equity financing. Instead, it generates internal cash proceeds from the sale of the Consulting segment, which are then used for a share buyback and potentially reinvested in the Equipment segment.<\/p><p class=\"los\">CFA Level II, Learning Module 21: Corporate Restructuring, LOS 21(f) Evaluate corporate divestment actions, including sales and spin-off<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · AgriTech Ltd<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>AgriTech Ltd, based in South Africa, manufactures agricultural equipment in addition to offering<\/p><p>agricultural consulting. The company operates two segments: AgriTech Consulting and AgriTech<\/p><p>Equipment. Summarized financial information for AgriTech Ltd for the last twelve months (LTM)<\/p><p>and the prior year period is shown in Exhibits 1,2, and 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0049.webp\" style=\"max-width:min(100%,481px)\" alt=\"Exhibit 1: AgriTech Reconciliation of Segment EBITDA to Consolidated EPS and Net Income Prior Year Period Last 12 months Total segment EBITDA 85 92 D&amp;A (22) (24) Unallocated cost (6) (6) EBIT 57 62 Interest expense (10) (11) Income taxes (9) (10) Net income 38 41 Shares outstanding 1200 1200 Diluted\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0050.webp\" style=\"max-width:min(100%,439px)\" alt=\"Exhibit 3: AgriTech Ltd Statement of Financial Position: Prior Year, and Most Recent Quarter (MRQ) Prior Year MRQ Cash and equivalents 200 230 Other current assets 150 140 Total current assets 350 370 Non-current assets 620 680 Total assets 970 1050 Current debt 30 30 Other current liabilities 100 1\"><p>AgriTech Equipment&#x27;s sales have grown significantly in recent years, but the company still lags<\/p><p>behind its peers in share price performance over the last five years. AgriTech Ltd is valued at<\/p><p>sales and EBITDA (LTM) multiples of 4 and 21, resulting in an enterprise value of ZAR 1,626<\/p><p>million. A financial institution is looking to acquire a 10% stake in AgriTech Ltd. The company is<\/p><p>looking to work with management to improve shareholder value. AgriTech announced that its<\/p><p>board of directors had initiated a strategic review of alternatives to increase shareholder value.<\/p><p>The board formed a strategy committee where the chairman announced the following:<\/p><p>“We are committed to improving value and have identified strategic alternatives, including<\/p><p>spinning off or selling parts of the business,” the chairman said. “AgriTech’s management has an<\/p><p>unbeatable track record of creating shareholder value.<\/p><p>Management is considering two actions:<\/p><p>I. Spinning off the AgriTech Consulting segment. II. Selling the AgriTech Consulting segment.<\/p><p>Exhibits 4, 5, and 6 contain data from comparable company and transaction analyses for the<\/p><p>consulting segment. If AgriTech decides to sell the consulting segment, annual unallocated costs<\/p><p>are expected to decrease by ZAR 2 million, and D&amp;A expense is expected to decrease by ZAR 16<\/p><p>million. AgriTech plans to use part of the proceeds from the sale to repurchase 300,000 shares and targets an EBITDA of ZAR 120 million post-sale.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0051.webp\" style=\"max-width:min(100%,490px)\" alt=\"Exhibit 4: AgriTech Consulting Segment: Comparable Company Information. Company Cash Debt EBITDA Market cap Comparable 1 120 240 160 1, 565 Comparable 2 90 254 105 1, 243 Comparable 3 450 349 213 2, 134 Comparable 4 232 126 305 2, 550 Comparable 5 103 66 78 968 Exhibit 5: AgriTech Consulting Segment\"><\/div><\/details><div class=\"qtext\"><p>If AgriTech Ltd. sells its Consulting segment and uses proceeds for a share buyback, which statement best describes the strategic rationale for the divestiture and share buyback?<\/p><\/div>", "subj": "corporate"}, {"n": 28, "q": "Assuming AgriTech Ltd.’s Consulting segment is valued at an EV/EBITDA multiple of 12, what is the best course of action for AgriTech Ltd.?", "opts": ["Sell the segment.", "Spin-off the segment.", "Retain the segment."], "ans": "A", "expl": "High valuation opportunity — take the cash:   • The Consulting segment can be sold for an EV/EBITDA multiple of 12, which is above the peer-median multiple of ≈ 10.5 already calculated.   • Selling at this premium converts the business into immediate cash, allowing AgriTech to eliminate its conglomerate discount and redeploy capital (e.g., buybacks, debt pay-down, or growth capex).  • A spin-off would leave shareholders with two publicly traded entities but no cash proceeds for balance-sheet repair or share repurchase.   • Because the segment’s valuation is attractive now, an outright sale monetizes that value more effectively than a spin-off. Retaining the segment is sub-optimal:  (SOTP EV − Market EV ≈ discount), so the discount would persist.   • Management has already signaled willingness to divest under-recognized assets to enhance shareholder value. Therefore, selling the Consulting segment at an EV/EBITDA multiple of 12 is the action that most directly unlocks value and provides AgriTech with immediate, flexible liquidity to improve key metrics and address the current valuation gap.", "explhtml": "<p><b>High valuation opportunity — take the cash:<\/b> <\/p><p> • The Consulting segment can be sold for an EV/EBITDA multiple of 12, which is<\/p><p>above the peer-median multiple of ≈ 10.5 already calculated. <\/p><p> • Selling at this premium converts the business into immediate cash, allowing<\/p><p>AgriTech to eliminate its conglomerate discount and redeploy capital (e.g., buybacks,<\/p><p>debt pay-down, or growth capex).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0070.webp\" style=\"max-width:min(100%,217px)\" alt=\"Spin-off versus sale: \"><p> • A spin-off would leave shareholders with two publicly traded entities but no cash<\/p><p>proceeds for balance-sheet repair or share repurchase. <\/p><p> • Because the segment’s valuation is attractive now, an outright sale monetizes that<\/p><p>value more effectively than a spin-off.<\/p><p><b>Retaining the segment is sub-optimal:<\/b> <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0071.webp\" style=\"max-width:min(100%,667px)\" alt=\" •  Keeping  Consulting  preserves  the  existing  conglomerate  structure\"><p>(SOTP EV − Market EV ≈ discount), so the discount would persist. <\/p><p> • Management has already signaled willingness to divest under-recognized assets to<\/p><p>enhance shareholder value.<\/p><p>Therefore, selling the Consulting segment at an EV/EBITDA multiple of 12 is the action that most directly unlocks value and provides AgriTech with immediate, flexible liquidity to improve key metrics and address the current valuation gap.<\/p><p class=\"los\">CFA Level II, Learning Module 21: Corporate Restructuring, LOS 21(f) Evaluate corporate divestment actions, including sales and spin-off<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · AgriTech Ltd<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>AgriTech Ltd, based in South Africa, manufactures agricultural equipment in addition to offering<\/p><p>agricultural consulting. The company operates two segments: AgriTech Consulting and AgriTech<\/p><p>Equipment. Summarized financial information for AgriTech Ltd for the last twelve months (LTM)<\/p><p>and the prior year period is shown in Exhibits 1,2, and 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0049.webp\" style=\"max-width:min(100%,481px)\" alt=\"Exhibit 1: AgriTech Reconciliation of Segment EBITDA to Consolidated EPS and Net Income Prior Year Period Last 12 months Total segment EBITDA 85 92 D&amp;A (22) (24) Unallocated cost (6) (6) EBIT 57 62 Interest expense (10) (11) Income taxes (9) (10) Net income 38 41 Shares outstanding 1200 1200 Diluted\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0050.webp\" style=\"max-width:min(100%,439px)\" alt=\"Exhibit 3: AgriTech Ltd Statement of Financial Position: Prior Year, and Most Recent Quarter (MRQ) Prior Year MRQ Cash and equivalents 200 230 Other current assets 150 140 Total current assets 350 370 Non-current assets 620 680 Total assets 970 1050 Current debt 30 30 Other current liabilities 100 1\"><p>AgriTech Equipment&#x27;s sales have grown significantly in recent years, but the company still lags<\/p><p>behind its peers in share price performance over the last five years. AgriTech Ltd is valued at<\/p><p>sales and EBITDA (LTM) multiples of 4 and 21, resulting in an enterprise value of ZAR 1,626<\/p><p>million. A financial institution is looking to acquire a 10% stake in AgriTech Ltd. The company is<\/p><p>looking to work with management to improve shareholder value. AgriTech announced that its<\/p><p>board of directors had initiated a strategic review of alternatives to increase shareholder value.<\/p><p>The board formed a strategy committee where the chairman announced the following:<\/p><p>“We are committed to improving value and have identified strategic alternatives, including<\/p><p>spinning off or selling parts of the business,” the chairman said. “AgriTech’s management has an<\/p><p>unbeatable track record of creating shareholder value.<\/p><p>Management is considering two actions:<\/p><p>I. Spinning off the AgriTech Consulting segment. II. Selling the AgriTech Consulting segment.<\/p><p>Exhibits 4, 5, and 6 contain data from comparable company and transaction analyses for the<\/p><p>consulting segment. If AgriTech decides to sell the consulting segment, annual unallocated costs<\/p><p>are expected to decrease by ZAR 2 million, and D&amp;A expense is expected to decrease by ZAR 16<\/p><p>million. AgriTech plans to use part of the proceeds from the sale to repurchase 300,000 shares and targets an EBITDA of ZAR 120 million post-sale.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0051.webp\" style=\"max-width:min(100%,490px)\" alt=\"Exhibit 4: AgriTech Consulting Segment: Comparable Company Information. Company Cash Debt EBITDA Market cap Comparable 1 120 240 160 1, 565 Comparable 2 90 254 105 1, 243 Comparable 3 450 349 213 2, 134 Comparable 4 232 126 305 2, 550 Comparable 5 103 66 78 968 Exhibit 5: AgriTech Consulting Segment\"><\/div><\/details><div class=\"qtext\"><p>Assuming AgriTech Ltd.’s Consulting segment is valued at an EV/EBITDA multiple of 12, what is the best course of action for AgriTech Ltd.?<\/p><\/div>", "subj": "corporate"}, {"n": 29, "q": "What was Kruger Tech Solutions Inc.’s total dividend payout in the last fiscal year, given a dividend per share of $2 and 100 million shares outstanding (in USD million)?", "opts": ["$100 million", "$200 million", "$250 million"], "ans": "B", "expl": "To calculate the total dividend payout, we multiply the dividend per share by the total number of shares outstanding: Total Dividends Paid = Dividend per Share × Total Number of Shares Outstanding Total Dividends Paid = $2 × 100 million shares Total Dividends Paid = $200 million A is incorrect. $100 million is incorrect because it does not correctly apply the given formula above. C is incorrect. $250 million is incorrect because it represents the share repurchase amount in Year 4, not the total dividends paid.", "explhtml": "<p>To calculate the total dividend payout, we multiply the dividend per share by the total number of shares outstanding:<\/p><p>Total Dividends Paid = Dividend per Share × Total Number of Shares Outstanding Total Dividends Paid = $2 × 100 million shares Total Dividends Paid = $200 million<\/p><p><b>A is incorrect.<\/b> $100 million is incorrect because it does not correctly apply the given formula above.<\/p><p><b>C is incorrect.<\/b> $250 million is incorrect because it represents the share repurchase amount in Year 4, not the total dividends paid.<\/p><p class=\"los\">CFA Level II, Corporate Issuers, Learning Module 1: Analysis of Dividends and Share Repurchases, LOS (g) Compare stable dividend with constant dividend payout ratio, and calculate the dividend under each policy.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Kruger Tech Solutions Inc.<\/summary><div class=\"vig-body\"><p>Kruger Tech Solutions Inc. (Kruger Tech) is an innovative technology company that specializes in<\/p><p>developing and manufacturing eco-friendly tech products. Over the past decade, Kruger Tech has<\/p><p>established itself as a market leader in the sustainability tech sector, with a strong brand<\/p><p>presence and a loyal customer base. Despite global economic uncertainty, Kruger Tech has<\/p><p>maintained stable revenue growth and strong cash flows due to consumers&#x27; increased awareness<\/p><p>of environmental issues and the company&#x27;s ability to stay ahead of technological trends.<\/p><p>As part of its capital allocation strategy, Kruger Tech has consistently paid dividends to its<\/p><p>shareholders for the last five years and recently announced a large-scale share repurchase<\/p><p>program. The current payout ratio is 40%, and the dividend per share for the last fiscal year was<\/p><p>$2. The total number of shares outstanding is 100 million.<\/p><p>Kruger Tech Solutions Inc.’s management team is considering significant corporate restructuring<\/p><p>to focus on its core business and potentially divest underperforming divisions. This initiative<\/p><p>aims to enhance long-term value for shareholders.<\/p><p>Moreover, Kruger Tech Solutions Inc. is actively integrating ESG practices into its business<\/p><p>model to demonstrate its commitment to sustainability across its products, operations, and<\/p><p>corporate governance.<\/p><p>Tables with essential financial data and metrics, which will be referenced in the questions, are<\/p><p>provided below.<\/p><p>Table 1: Dividend History and Share Repurchase Plan<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0072.webp\" style=\"max-width:min(100%,613px)\" alt=\"Fiscal Year Dividend Per Share Total Dividends Paid Share Repurchase (in millions) (in millions) Year 1 $1.80 $180 $0 Year 2 $1.90 $190 $0 Year 3 $2.00 $200 $200 Year 4 (plan) $2.10 −∗ $250\"><p>• Yet to be paid.<\/p><p>Note: The share repurchase in Year 3 resulted in a decrease of 5% in total shares outstanding.<\/p><p>Table 2: Financial Metrics<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0073.webp\" style=\"max-width:min(100%,338px)\" alt=\"Metric Value Current Share Price $50 Return on Equity 15% Earnings Per Share (last year) $5 Weighted Average Cost of Capital 8% Beta 1.2 Market Risk Premium 6% Risk-free Rate 2%\"><\/div><\/details><div class=\"qtext\"><p>What was Kruger Tech Solutions Inc.’s total dividend payout in the last fiscal year, given a dividend per share of $2 and 100 million shares outstanding (in USD million)?<\/p><\/div>", "subj": "corporate"}, {"n": 30, "q": "The share repurchase in Year 3 resulted in a decrease of 5% in total shares outstanding. What is the most likely number of shares repurchased by Kruger Tech during Year 3?", "opts": ["5 million shares", "10 million shares", "15 million shares"], "ans": "A", "expl": "A 5% decrease in the total number of shares outstanding (100 million) would result in the repurchase of: Number of Shares Repurchased = 5% × Total Number of Shares Outstanding Number of Shares Repurchased = 0.05 × 100million shares Number of Shares Repurchased = 5million shares", "explhtml": "<p>A 5% decrease in the total number of shares outstanding (100 million) would result in the repurchase of:<\/p><p>Number of Shares Repurchased = 5% × Total Number of Shares Outstanding Number of Shares Repurchased = 0.05 × 100million shares Number of Shares Repurchased = 5million shares<\/p><p class=\"los\">CFA Level II, Corporate Issuers, Learning Module 1: Analysis of Dividends and Share Repurchases, LOS (i) Compare share repurchase methods.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Kruger Tech Solutions Inc.<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Kruger Tech Solutions Inc. (Kruger Tech) is an innovative technology company that specializes in<\/p><p>developing and manufacturing eco-friendly tech products. Over the past decade, Kruger Tech has<\/p><p>established itself as a market leader in the sustainability tech sector, with a strong brand<\/p><p>presence and a loyal customer base. Despite global economic uncertainty, Kruger Tech has<\/p><p>maintained stable revenue growth and strong cash flows due to consumers&#x27; increased awareness<\/p><p>of environmental issues and the company&#x27;s ability to stay ahead of technological trends.<\/p><p>As part of its capital allocation strategy, Kruger Tech has consistently paid dividends to its<\/p><p>shareholders for the last five years and recently announced a large-scale share repurchase<\/p><p>program. The current payout ratio is 40%, and the dividend per share for the last fiscal year was<\/p><p>$2. The total number of shares outstanding is 100 million.<\/p><p>Kruger Tech Solutions Inc.’s management team is considering significant corporate restructuring<\/p><p>to focus on its core business and potentially divest underperforming divisions. This initiative<\/p><p>aims to enhance long-term value for shareholders.<\/p><p>Moreover, Kruger Tech Solutions Inc. is actively integrating ESG practices into its business<\/p><p>model to demonstrate its commitment to sustainability across its products, operations, and<\/p><p>corporate governance.<\/p><p>Tables with essential financial data and metrics, which will be referenced in the questions, are<\/p><p>provided below.<\/p><p>Table 1: Dividend History and Share Repurchase Plan<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0072.webp\" style=\"max-width:min(100%,613px)\" alt=\"Fiscal Year Dividend Per Share Total Dividends Paid Share Repurchase (in millions) (in millions) Year 1 $1.80 $180 $0 Year 2 $1.90 $190 $0 Year 3 $2.00 $200 $200 Year 4 (plan) $2.10 −∗ $250\"><p>• Yet to be paid.<\/p><p>Note: The share repurchase in Year 3 resulted in a decrease of 5% in total shares outstanding.<\/p><p>Table 2: Financial Metrics<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0073.webp\" style=\"max-width:min(100%,338px)\" alt=\"Metric Value Current Share Price $50 Return on Equity 15% Earnings Per Share (last year) $5 Weighted Average Cost of Capital 8% Beta 1.2 Market Risk Premium 6% Risk-free Rate 2%\"><\/div><\/details><div class=\"qtext\"><p>The share repurchase in Year 3 resulted in a decrease of 5% in total shares outstanding. What is the most likely number of shares repurchased by Kruger Tech during Year 3?<\/p><\/div>", "subj": "corporate"}, {"n": 31, "q": "Given KrugerTech's earnings per share (EPS) of $5 and dividend per share of $2, what is its dividend payout ratio for the last year?", "opts": ["25%", "40%", "50%"], "ans": "B", "expl": "The dividend payout ratio is calculated by dividing the dividend per share by the earnings per share: (Note that the company's strategy is to maintain a 40% payout ratio.)", "explhtml": "<p>The dividend payout ratio is calculated by dividing the dividend per share by the earnings per share:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0074.webp\" style=\"max-width:min(100%,353px)\" alt=\"Dividend per Share Dividend Payout Ratio = Earnings Per Share $2 Dividend Payout Ratio = $5 Dividend Payout Ratio = 0.4 or 40%\"><p>(Note that the company&#x27;s strategy is to maintain a 40% payout ratio.)<\/p><p class=\"los\">CFA Level II, Corporate Issuers, Learning Module 1: Analysis of Dividends and Share Repurchases, LOS (g) Compare stable dividend with constant dividend payout ratio, and calculate the dividend under each policy.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Kruger Tech Solutions Inc.<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Kruger Tech Solutions Inc. (Kruger Tech) is an innovative technology company that specializes in<\/p><p>developing and manufacturing eco-friendly tech products. Over the past decade, Kruger Tech has<\/p><p>established itself as a market leader in the sustainability tech sector, with a strong brand<\/p><p>presence and a loyal customer base. Despite global economic uncertainty, Kruger Tech has<\/p><p>maintained stable revenue growth and strong cash flows due to consumers&#x27; increased awareness<\/p><p>of environmental issues and the company&#x27;s ability to stay ahead of technological trends.<\/p><p>As part of its capital allocation strategy, Kruger Tech has consistently paid dividends to its<\/p><p>shareholders for the last five years and recently announced a large-scale share repurchase<\/p><p>program. The current payout ratio is 40%, and the dividend per share for the last fiscal year was<\/p><p>$2. The total number of shares outstanding is 100 million.<\/p><p>Kruger Tech Solutions Inc.’s management team is considering significant corporate restructuring<\/p><p>to focus on its core business and potentially divest underperforming divisions. This initiative<\/p><p>aims to enhance long-term value for shareholders.<\/p><p>Moreover, Kruger Tech Solutions Inc. is actively integrating ESG practices into its business<\/p><p>model to demonstrate its commitment to sustainability across its products, operations, and<\/p><p>corporate governance.<\/p><p>Tables with essential financial data and metrics, which will be referenced in the questions, are<\/p><p>provided below.<\/p><p>Table 1: Dividend History and Share Repurchase Plan<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0072.webp\" style=\"max-width:min(100%,613px)\" alt=\"Fiscal Year Dividend Per Share Total Dividends Paid Share Repurchase (in millions) (in millions) Year 1 $1.80 $180 $0 Year 2 $1.90 $190 $0 Year 3 $2.00 $200 $200 Year 4 (plan) $2.10 −∗ $250\"><p>• Yet to be paid.<\/p><p>Note: The share repurchase in Year 3 resulted in a decrease of 5% in total shares outstanding.<\/p><p>Table 2: Financial Metrics<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0073.webp\" style=\"max-width:min(100%,338px)\" alt=\"Metric Value Current Share Price $50 Return on Equity 15% Earnings Per Share (last year) $5 Weighted Average Cost of Capital 8% Beta 1.2 Market Risk Premium 6% Risk-free Rate 2%\"><\/div><\/details><div class=\"qtext\"><p>Given KrugerTech&#x27;s earnings per share (EPS) of $5 and dividend per share of $2, what is its dividend payout ratio for the last year?<\/p><\/div>", "subj": "corporate"}, {"n": 32, "q": "What is the expected return on KrugerTech's stock using the Capital Asset Pricing Model (CAPM)?", "opts": ["8.20%", "9.20%", "10.20%"], "ans": "B", "expl": "The CAPM formula is given by:", "explhtml": "<p>The CAPM formula is given by:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0075.webp\" style=\"max-width:min(100%,521px)\" alt=\"Expected Return = Risk-free Rate + Beta × (Market Risk Premium) Expected Return = 2% + 1.2 × (6%) Expected Return = 2% + 7.2% Expected Return = 9.2%\"><p class=\"los\">CFA Level II, Corporate Issuers, Learning Module 3: Cost of Capital: Advanced Topics, LOS (d) Compare methods used to estimate the required return on equity.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Kruger Tech Solutions Inc.<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Kruger Tech Solutions Inc. (Kruger Tech) is an innovative technology company that specializes in<\/p><p>developing and manufacturing eco-friendly tech products. Over the past decade, Kruger Tech has<\/p><p>established itself as a market leader in the sustainability tech sector, with a strong brand<\/p><p>presence and a loyal customer base. Despite global economic uncertainty, Kruger Tech has<\/p><p>maintained stable revenue growth and strong cash flows due to consumers&#x27; increased awareness<\/p><p>of environmental issues and the company&#x27;s ability to stay ahead of technological trends.<\/p><p>As part of its capital allocation strategy, Kruger Tech has consistently paid dividends to its<\/p><p>shareholders for the last five years and recently announced a large-scale share repurchase<\/p><p>program. The current payout ratio is 40%, and the dividend per share for the last fiscal year was<\/p><p>$2. The total number of shares outstanding is 100 million.<\/p><p>Kruger Tech Solutions Inc.’s management team is considering significant corporate restructuring<\/p><p>to focus on its core business and potentially divest underperforming divisions. This initiative<\/p><p>aims to enhance long-term value for shareholders.<\/p><p>Moreover, Kruger Tech Solutions Inc. is actively integrating ESG practices into its business<\/p><p>model to demonstrate its commitment to sustainability across its products, operations, and<\/p><p>corporate governance.<\/p><p>Tables with essential financial data and metrics, which will be referenced in the questions, are<\/p><p>provided below.<\/p><p>Table 1: Dividend History and Share Repurchase Plan<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0072.webp\" style=\"max-width:min(100%,613px)\" alt=\"Fiscal Year Dividend Per Share Total Dividends Paid Share Repurchase (in millions) (in millions) Year 1 $1.80 $180 $0 Year 2 $1.90 $190 $0 Year 3 $2.00 $200 $200 Year 4 (plan) $2.10 −∗ $250\"><p>• Yet to be paid.<\/p><p>Note: The share repurchase in Year 3 resulted in a decrease of 5% in total shares outstanding.<\/p><p>Table 2: Financial Metrics<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0073.webp\" style=\"max-width:min(100%,338px)\" alt=\"Metric Value Current Share Price $50 Return on Equity 15% Earnings Per Share (last year) $5 Weighted Average Cost of Capital 8% Beta 1.2 Market Risk Premium 6% Risk-free Rate 2%\"><\/div><\/details><div class=\"qtext\"><p>What is the expected return on KrugerTech&#x27;s stock using the Capital Asset Pricing Model (CAPM)?<\/p><\/div>", "subj": "corporate"}, {"n": 33, "q": "What best describes Delta 6's weighted average cost of capital prior to considering any refinancing initiatives?", "opts": ["7.74%", "7.72%", "8.74%"], "ans": "B", "expl": "To determine the correct weighted average cost of capital (WACC), we use the formula: A is incorrect. The calculated WACC based on the given data is 7.72%, . C is incorrect. 8.74% is higher than the given WACC and suggests a calculation different from the one provided.", "explhtml": "<p>To determine the correct weighted average cost of capital (WACC), we use the formula:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0078.webp\" style=\"max-width:min(100%,613px)\" alt=\"E D P WACC = V × re + V × rd × (1 −tc) + V × rp 2600 1200 200 WACC = × 0.09 + × 0.07 × (1 −0.3) + × 0.08 = 0.0772 = 7.72% 4000 4000 4000\"><p><b>A is incorrect.<\/b> The calculated WACC based on the given data is 7.72%, .<\/p><p><b>C is incorrect.<\/b> 8.74% is higher than the given WACC and suggests a calculation different from the one provided.<\/p><p class=\"los\">CFA Level II, Corporate Issuers, Learning Module 3: Cost of Capital: Advanced Topics, LOS (a) Explain top-down and bottom-up factors that impact the cost of capital.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Delta 6<\/summary><div class=\"vig-body\"><p>Delta 6, a well-established enterprise in the aerospace and defense industry, is undertaking a<\/p><p>thorough evaluation of its financial and strategic plans amid a shifting economic landscape<\/p><p>marked by fluctuating interest rates and enhanced competition. The company is contemplating<\/p><p>significant corporate restructuring efforts, including potential mergers and acquisitions (M&amp;A),<\/p><p>divestitures, and modifications to its capital structure to augment shareholder value.<\/p><p>The financial executives at Delta 6 are also considering the refinancing of its extant debt to<\/p><p>capitalize on present-day interest rates, which might be more favorable than those at which the<\/p><p>primary debt was procured. As a result, the CFO is scrutinizing various debt and equity financing<\/p><p>methods to refine the company&#x27;s weighted average cost of capital (WACC).<\/p><p>Delta 6&#x27;s management team is cognizant of the fact that alterations to the cost of capital could<\/p><p>stem from market responses to M&amp;A maneuverings. Therefore, planning includes<\/p><p>accommodating a potential 0.5% uptick in Delta 6&#x27;s WACC following M&amp;A activities.<\/p><p>Assuming Delta 6&#x27;s current WACC stands at 8%, alongside a market risk premium of 6%, a risk-<\/p><p>free rate of 2%, a beta coefficient of 1.2, and a corporate tax rate of 30%, below are pertinent<\/p><p>tables outlining capital structure and prospective restructuring outcomes.<\/p><p>Table 3: Capital Structure and Financing Data<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0076.webp\" style=\"max-width:min(100%,430px)\" alt=\"Capital Component Market Values Before-tax Cost (in millions)  Long-term Debt $1,200 7% Preferred Stock $200 8% Common Equity $2,600 9%\"><p>Table 4: Proposed Restructuring Data<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0077.webp\" style=\"max-width:min(100%,517px)\" alt=\"Action Item Potential Savings/Costs Refinancing Debt $10 million savings Divestiture of Non-core Division $300 million proceeds Potential M&amp;A Transaction Costs $50 million Projected Increase in WACC Post-M&amp;A 0.5%\"><\/div><\/details><div class=\"qtext\"><p>What best describes Delta 6&#x27;s weighted average cost of capital prior to considering any refinancing initiatives?<\/p><\/div>", "subj": "corporate"}, {"n": 34, "q": "How will Delta 6's weighted average cost of capital most likely be affected if it realizes annual interest savings of $10 million through refinancing its debt, and there are no other changes to the capital structure?", "opts": ["WACC will decrease by 0.25%", "WACC will stay unchanged as savings do not influence the cost of capital components", "WACC will reduce, but the exact decrease is contingent on the revised cost of debt."], "ans": "C", "expl": "Interest savings alone do not directly influence the WACC; the decrease in interest expense would lead to a reduced cost of debt, which, in turn, would result in a lower WACC. However, without knowing the new cost of debt, we cannot ascertain the precise impact on WACC. A is incorrect. Stating that WACC will decrease by a specific amount without knowing the revised cost of debt is speculative. B is incorrect. WACC can change when the cost of debt is altered due to refinancing.", "explhtml": "<p>Interest savings alone do not directly influence the WACC; the decrease in interest expense would lead to a reduced cost of debt, which, in turn, would result in a lower WACC. However, without knowing the new cost of debt, we cannot ascertain the precise impact on WACC.<\/p><p><b>A is incorrect.<\/b> Stating that WACC will decrease by a specific amount without knowing the revised cost of debt is speculative.<\/p><p><b>B is incorrect.<\/b> WACC can change when the cost of debt is altered due to refinancing.<\/p><p class=\"los\">CFA Level II, Corporate Issuers, Learning Module 3: Cost of Capital: Advanced Topics, LOS 3(d) Compare methods used to estimate the required return on equity.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Delta 6<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Delta 6, a well-established enterprise in the aerospace and defense industry, is undertaking a<\/p><p>thorough evaluation of its financial and strategic plans amid a shifting economic landscape<\/p><p>marked by fluctuating interest rates and enhanced competition. The company is contemplating<\/p><p>significant corporate restructuring efforts, including potential mergers and acquisitions (M&amp;A),<\/p><p>divestitures, and modifications to its capital structure to augment shareholder value.<\/p><p>The financial executives at Delta 6 are also considering the refinancing of its extant debt to<\/p><p>capitalize on present-day interest rates, which might be more favorable than those at which the<\/p><p>primary debt was procured. As a result, the CFO is scrutinizing various debt and equity financing<\/p><p>methods to refine the company&#x27;s weighted average cost of capital (WACC).<\/p><p>Delta 6&#x27;s management team is cognizant of the fact that alterations to the cost of capital could<\/p><p>stem from market responses to M&amp;A maneuverings. Therefore, planning includes<\/p><p>accommodating a potential 0.5% uptick in Delta 6&#x27;s WACC following M&amp;A activities.<\/p><p>Assuming Delta 6&#x27;s current WACC stands at 8%, alongside a market risk premium of 6%, a risk-<\/p><p>free rate of 2%, a beta coefficient of 1.2, and a corporate tax rate of 30%, below are pertinent<\/p><p>tables outlining capital structure and prospective restructuring outcomes.<\/p><p>Table 3: Capital Structure and Financing Data<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0076.webp\" style=\"max-width:min(100%,430px)\" alt=\"Capital Component Market Values Before-tax Cost (in millions)  Long-term Debt $1,200 7% Preferred Stock $200 8% Common Equity $2,600 9%\"><p>Table 4: Proposed Restructuring Data<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0077.webp\" style=\"max-width:min(100%,517px)\" alt=\"Action Item Potential Savings/Costs Refinancing Debt $10 million savings Divestiture of Non-core Division $300 million proceeds Potential M&amp;A Transaction Costs $50 million Projected Increase in WACC Post-M&amp;A 0.5%\"><\/div><\/details><div class=\"qtext\"><p>How will Delta 6&#x27;s weighted average cost of capital most likely be affected if it realizes annual interest savings of $10 million through refinancing its debt, and there are no other changes to the capital structure?<\/p><\/div>", "subj": "corporate"}, {"n": 35, "q": "Delta 6 chooses to divest a non-core division and receives $300 million in proceeds. Which of the following is most likely to occur?", "opts": ["WACC will automatically decrease as a result of the influx of cash", "Delta 6 could utilize the proceeds to repay debt, potentially reducing the WACC", "Proceeds will have no effect on the WACC unless reinvested in projects exceeding the current WACC"], "ans": "B", "expl": "Using the divestiture proceeds to pay down existing high-cost debt could lead to a reduction in the company’s WACC. This would adjust Delta 6's capital structure and consequently the weighted costs of capital components. A is incorrect. An increase in cash as a result of divestiture does not directly lead to a decreased WACC without specific capital structure management. C is incorrect. Proceeds' impact on WACC can manifest through their use in altering the capital structure, not solely based on investment in projects.", "explhtml": "<p>Using the divestiture proceeds to pay down existing high-cost debt could lead to a reduction in the company’s WACC. This would adjust Delta 6&#x27;s capital structure and consequently the weighted costs of capital components.<\/p><p><b>A is incorrect.<\/b> An increase in cash as a result of divestiture does not directly lead to a decreased WACC without specific capital structure management.<\/p><p><b>C is incorrect.<\/b> Proceeds&#x27; impact on WACC can manifest through their use in altering the capital structure, not solely based on investment in projects.<\/p><p class=\"los\">Corporate Issuers, Learning Module 4: Corporate Restructuring, LOS 4(a) Explain types of corporate restructurings and issuers’ motivations for pursuing them.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Delta 6<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Delta 6, a well-established enterprise in the aerospace and defense industry, is undertaking a<\/p><p>thorough evaluation of its financial and strategic plans amid a shifting economic landscape<\/p><p>marked by fluctuating interest rates and enhanced competition. The company is contemplating<\/p><p>significant corporate restructuring efforts, including potential mergers and acquisitions (M&amp;A),<\/p><p>divestitures, and modifications to its capital structure to augment shareholder value.<\/p><p>The financial executives at Delta 6 are also considering the refinancing of its extant debt to<\/p><p>capitalize on present-day interest rates, which might be more favorable than those at which the<\/p><p>primary debt was procured. As a result, the CFO is scrutinizing various debt and equity financing<\/p><p>methods to refine the company&#x27;s weighted average cost of capital (WACC).<\/p><p>Delta 6&#x27;s management team is cognizant of the fact that alterations to the cost of capital could<\/p><p>stem from market responses to M&amp;A maneuverings. Therefore, planning includes<\/p><p>accommodating a potential 0.5% uptick in Delta 6&#x27;s WACC following M&amp;A activities.<\/p><p>Assuming Delta 6&#x27;s current WACC stands at 8%, alongside a market risk premium of 6%, a risk-<\/p><p>free rate of 2%, a beta coefficient of 1.2, and a corporate tax rate of 30%, below are pertinent<\/p><p>tables outlining capital structure and prospective restructuring outcomes.<\/p><p>Table 3: Capital Structure and Financing Data<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0076.webp\" style=\"max-width:min(100%,430px)\" alt=\"Capital Component Market Values Before-tax Cost (in millions)  Long-term Debt $1,200 7% Preferred Stock $200 8% Common Equity $2,600 9%\"><p>Table 4: Proposed Restructuring Data<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0077.webp\" style=\"max-width:min(100%,517px)\" alt=\"Action Item Potential Savings/Costs Refinancing Debt $10 million savings Divestiture of Non-core Division $300 million proceeds Potential M&amp;A Transaction Costs $50 million Projected Increase in WACC Post-M&amp;A 0.5%\"><\/div><\/details><div class=\"qtext\"><p>Delta 6 chooses to divest a non-core division and receives $300 million in proceeds. Which of the following is most likely to occur?<\/p><\/div>", "subj": "corporate"}, {"n": 36, "q": "Following the M&A transaction, Delta 6 anticipates a rise of 0.5% in their WACC. What does this best indicate about Delta 6's expected new WACC?", "opts": ["7.74%", "8.24%", "8.22%"], "ans": "C", "expl": "If Delta 6's WACC increases by 0.5% as a result of the M&A transaction, and the current WACC is 8%, then the new expected WACC would be 7.72% + 0.5% = 8.22%. A is incorrect. This is lower than the stated WACC and does not account for the M&A transaction's impact. B is incorrect. This answer does not include the 0.5% increase from the M&A transaction.", "explhtml": "<p>If Delta 6&#x27;s WACC increases by 0.5% as a result of the M&amp;A transaction, and the current WACC is 8%, then the new expected WACC would be 7.72% + 0.5% = 8.22%.<\/p><p><b>A is incorrect.<\/b> This is lower than the stated WACC and does not account for the M&amp;A transaction&#x27;s impact.<\/p><p><b>B is incorrect.<\/b> This answer does not include the 0.5% increase from the M&amp;A transaction.<\/p><p class=\"los\">Corporate Issuers, Learning Module 3: Cost of Capital: Advanced Topics, LOS 3(a) Explain top-down and bottom-up factors that impact the cost of capital.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Delta 6<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Delta 6, a well-established enterprise in the aerospace and defense industry, is undertaking a<\/p><p>thorough evaluation of its financial and strategic plans amid a shifting economic landscape<\/p><p>marked by fluctuating interest rates and enhanced competition. The company is contemplating<\/p><p>significant corporate restructuring efforts, including potential mergers and acquisitions (M&amp;A),<\/p><p>divestitures, and modifications to its capital structure to augment shareholder value.<\/p><p>The financial executives at Delta 6 are also considering the refinancing of its extant debt to<\/p><p>capitalize on present-day interest rates, which might be more favorable than those at which the<\/p><p>primary debt was procured. As a result, the CFO is scrutinizing various debt and equity financing<\/p><p>methods to refine the company&#x27;s weighted average cost of capital (WACC).<\/p><p>Delta 6&#x27;s management team is cognizant of the fact that alterations to the cost of capital could<\/p><p>stem from market responses to M&amp;A maneuverings. Therefore, planning includes<\/p><p>accommodating a potential 0.5% uptick in Delta 6&#x27;s WACC following M&amp;A activities.<\/p><p>Assuming Delta 6&#x27;s current WACC stands at 8%, alongside a market risk premium of 6%, a risk-<\/p><p>free rate of 2%, a beta coefficient of 1.2, and a corporate tax rate of 30%, below are pertinent<\/p><p>tables outlining capital structure and prospective restructuring outcomes.<\/p><p>Table 3: Capital Structure and Financing Data<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0076.webp\" style=\"max-width:min(100%,430px)\" alt=\"Capital Component Market Values Before-tax Cost (in millions)  Long-term Debt $1,200 7% Preferred Stock $200 8% Common Equity $2,600 9%\"><p>Table 4: Proposed Restructuring Data<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0077.webp\" style=\"max-width:min(100%,517px)\" alt=\"Action Item Potential Savings/Costs Refinancing Debt $10 million savings Divestiture of Non-core Division $300 million proceeds Potential M&amp;A Transaction Costs $50 million Projected Increase in WACC Post-M&amp;A 0.5%\"><\/div><\/details><div class=\"qtext\"><p>Following the M&amp;A transaction, Delta 6 anticipates a rise of 0.5% in their WACC. What does this best indicate about Delta 6&#x27;s expected new WACC?<\/p><\/div>", "subj": "corporate"}, {"n": 37, "q": "Marigold’s current dividend per share is closest to?", "opts": ["$2.47", "$1.65", "$0.55"], "ans": "A", "expl": "To calculate the dividend per share (DPS):", "explhtml": "<p>To calculate the dividend per share (DPS):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0080.webp\" style=\"max-width:min(100%,460px)\" alt=\"Net Income × Payout Ratio 45 million × 0.55 DPS = = = $2.475 Shares Outstanding 10 million\"><p class=\"los\">Corporate Issuers, Learning Module 1: Analysis of Dividends and Share Repurchases, LOS (g) Compare stable dividend with constant dividend payout ratio, and calculate the dividend under each policy.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Marigold Technology<\/summary><div class=\"vig-body\"><p>Marigold Technology, an innovator in the field of sustainable technology solutions, is assessing<\/p><p>different approaches to enhance shareholder value in an era characterized by rapid<\/p><p>advancements and an increasing focus on sustainability. Having experienced substantial growth<\/p><p>over the past few years, Marigold Technology&#x27;s leadership is now debating whether it would be<\/p><p>more beneficial to distribute capital to shareholders through dividends, share repurchases, or a<\/p><p>blend of these methods.<\/p><p>Currently, Marigold Technology has 10 million shares of common stock in circulation, with each<\/p><p>share trading at around $30. The company&#x27;s annual profit amounts to $45 million, and it has<\/p><p>consistently distributed 55% of its earnings as dividends to its shareholders. In addition to these<\/p><p>dividends, the company&#x27;s board is considering the implementation of a share buyback plan to<\/p><p>purchase 5% of the outstanding shares on the open market using cash.<\/p><p>Given these considerations, the management team intends to carefully examine the costs and<\/p><p>advantages associated with both alternatives, considering factors such as the impact on<\/p><p>shareholder perception, tax consequences, and signals conveyed to the market regarding the<\/p><p>company&#x27;s growth outlook.<\/p><p>Table 1: Dividend Payment and Share Repurchase Data<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0079.webp\" style=\"max-width:min(100%,424px)\" alt=\"Financial Metrics Value Current Share Price $30 Shares Outstanding 10 million Annual Net Income $45 million Dividend Payout Ratio 55% Proposed Share Buyback 5% of outstanding shares Remaining Net Income (after dividends)\"><p>The leadership team is also evaluating how these decisions might affect the share price,<\/p><p>assuming the current profit levels persist and the signaling theory&#x27;s influence on investor<\/p><p>perception based on the selected form of returning capital.<\/p><\/div><\/details><div class=\"qtext\"><p>Marigold’s current dividend per share is closest to?<\/p><\/div>", "subj": "corporate"}, {"n": 38, "q": "If Marigold Technology proceeds with the proposed share repurchase plan, how many shares will the company buy back?", "opts": ["500,000 shares", "150,000 shares", "50,000 shares"], "ans": "A", "expl": "The number of shares that Marigold Technology will repurchase is: Shares Bought Back = Shares Outstanding × Share Buyback Percentage = 10 million × 0.05 = 500", "explhtml": "<p>The number of shares that Marigold Technology will repurchase is:<\/p><p>Shares Bought Back = Shares Outstanding × Share Buyback Percentage = 10 million × 0.05 = 500<\/p><p class=\"los\">Corporate Issuers, Learning Module 1: Analysis of Dividends and Share Repurchases, LOS (a) Describe the expected effect of regular cash dividends, extra dividends, liquidating divi
