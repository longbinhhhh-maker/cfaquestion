ost-Restructure) = USD652 million −USD30 million = USD622 million\"><p>To ensure that the calculation follows the corporate restructuring adjustment accurately, the final answer is adjusted based on the timing of the divestiture and acquisition:<\/p><p>Book Value of Equity (Post-Restructure) = USD622 million<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0114.webp\" style=\"max-width:min(100%,755px)\" alt=\"+ U SD60 million (pre-dividend and repurchase adjustmen = USD682 million(Book Value of Equity (Post-Restructure = USD682 million −USD242 million (spin-off net cash) = USD440 million\"><p><b>B is incorrect.<\/b> USD 510 million does not account for the net cash position from the spin-off.<\/p><p><b>C is incorrect.<\/b> USD 1,010 million is the book value before adjusting for the acquisition cost.<\/p><p class=\"los\">Corporate Issuers, Learning Module 4: Corporate Restructuring, LOS (f) Evaluate corporate divestment actions, including sales and spin offs.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Tanjiro Innovations Inc.<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tanjiro Innovations Inc., formerly known as GreenTech Innovations, is an emergent technology<\/p><p>company that specializes in high-efficiency solar panels and advanced EV batteries. Despite<\/p><p>being at the forefront of the renewable energy market, Tanjiro Innovations has identified a need<\/p><p>to reorganize its operations to stay competitive.<\/p><p>The board has approved a strategic plan that includes divesting the solar panel division and<\/p><p>acquiring a promising EV battery manufacturer, BatteryPlus, in a cash transaction valued at USD<\/p><p>500 million.<\/p><p><b>Exhibit 1: Tanjiro Innovations Inc. Financial Overview (in USD millions)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0106.webp\" style=\"max-width:min(100%,494px)\" alt=\"Year 2020 2021 2022 2023 Revenue 1, 000 1, 150 1, 300 1, 400 Net Income 50 100 110 120 Cash from Operations 150 220 250 280 Capital Expenditures 80 100 120 140 Dividends Paid 10 12 15 18 Share Repurchases 0 0 20 30 Debt Issuance 80 50 10 (20) Solar Panel Division Revenue 400 420 430 440 EV Battery D\"><p>Currently, Tanjiro Innovations has a net debt of USD 250 million and book value of equity USD<\/p><p>850 million. The company&#x27;s beta is 1.6, the risk-free rate is 2.5%, and the expected market return<\/p><p>is 7%. The tax rate is 25%, and the pre-tax cost of debt is 4%.<\/p><p><b>Analysis Required:<\/b><\/p><p>The reorganization plan will shift Tanjiro Innovations&#x27; corporate focus, financial structure, and<\/p><p>potentially its cost of capital and ESG standings.<\/p><p>The following questions will evaluate the reorganization&#x27;s impact using advanced financial<\/p><p>calculations involving the updated financials provided below.<\/p><p><b>Exhibit 2: Tanjiro Post-Restructuring Projected Financials (in USD millions)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0107.webp\" style=\"max-width:min(100%,715px)\" alt=\"Item Pre-Restructure Post-Restructure (Pro Forma) Debt 250 TBD Book Value of Equity 850 TBD Proceeds from Solar Division Spin-off − TBD Cost of Acquisition of BatteryPlus − 500 Cash &amp; Cash Equivalents − TBD New Debt (Post Acquisition and Spin-off) − TBD\"><p>*TBD = To be determined in the questions<\/p><\/div><\/details><div class=\"qtext\"><p>After the spin-off and the acquisition of BatteryPlus, calculate Tanjiro Innovations Inc.&#x27;s new book value of equity, assuming the solar panel division is sold for the valuation calculated in Question 1 and Tanjiro pays for BatteryPlus in cash with no financing involved. Assume the book value of equity pre-restructuring and cash are the only sources to fund the acquisition.<\/p><p>Book Value of Equity (Post-Restructure) = Book Value of Equity (Pre-Restructure)<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0109.webp\" style=\"max-width:min(100%,633px)\" alt=\"−Cost of Acquisition + Proceeds from Spin-off\"><\/div>", "subj": "corporate"}, {"n": 63, "q": "What is the total cash and cash equivalents balance for Tanjiro Innovations Inc. after the restructuring is complete, assuming it started with USD 100 million in cash and cash equivalents before any transactions?", "opts": ["USD 260 million", "USD 160 million", "USD 60 million"], "ans": "A", "expl": "Total Cash & Cash Equivalents (Post-Restructure) = Cash & Cash Equivalents (Pre-Restructure) Total Cash & Cash Equivalents (Post-Restructure) = USD100 million + USD660 million −USD500 Total Cash & Cash Equivalents (Post-Restructure) = USD100 million + USD160 million Total Cash & Cash Equivalents (Post-Restructure) = USD260 million B is incorrect. USD 160 million does not account for the initial cash and cash equivalents balance before restructuring. C is incorrect. USD 60 million does not represent the correct calculation based on the given data.", "explhtml": "<p>Total Cash &amp; Cash Equivalents (Post-Restructure) = Cash &amp; Cash Equivalents (Pre-Restructure)<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0115.webp\" style=\"max-width:min(100%,755px)\" alt=\"+ Proceeds from Spin-off −Cash Used for Acquisition\"><p>Total Cash &amp; Cash Equivalents (Post-Restructure) = USD100 million + USD660 million −USD500 Total Cash &amp; Cash Equivalents (Post-Restructure) = USD100 million + USD160 million Total Cash &amp; Cash Equivalents (Post-Restructure) = USD260 million<\/p><p><b>B is incorrect.<\/b> USD 160 million does not account for the initial cash and cash equivalents balance before restructuring.<\/p><p><b>C is incorrect.<\/b> USD 60 million does not represent the correct calculation based on the given data.<\/p><p class=\"los\">Corporate Issuers, Learning Module 4: Corporate Restructuring, LOS (d) Demonstrate how corporate restructurings affect an issuer’s EPS, net debt to EBITDA ratio, and weighted average cost of capital. &amp; LOS (f) Evaluate corporate divestment actions, including sales and spin offs.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Tanjiro Innovations Inc.<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tanjiro Innovations Inc., formerly known as GreenTech Innovations, is an emergent technology<\/p><p>company that specializes in high-efficiency solar panels and advanced EV batteries. Despite<\/p><p>being at the forefront of the renewable energy market, Tanjiro Innovations has identified a need<\/p><p>to reorganize its operations to stay competitive.<\/p><p>The board has approved a strategic plan that includes divesting the solar panel division and<\/p><p>acquiring a promising EV battery manufacturer, BatteryPlus, in a cash transaction valued at USD<\/p><p>500 million.<\/p><p><b>Exhibit 1: Tanjiro Innovations Inc. Financial Overview (in USD millions)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0106.webp\" style=\"max-width:min(100%,494px)\" alt=\"Year 2020 2021 2022 2023 Revenue 1, 000 1, 150 1, 300 1, 400 Net Income 50 100 110 120 Cash from Operations 150 220 250 280 Capital Expenditures 80 100 120 140 Dividends Paid 10 12 15 18 Share Repurchases 0 0 20 30 Debt Issuance 80 50 10 (20) Solar Panel Division Revenue 400 420 430 440 EV Battery D\"><p>Currently, Tanjiro Innovations has a net debt of USD 250 million and book value of equity USD<\/p><p>850 million. The company&#x27;s beta is 1.6, the risk-free rate is 2.5%, and the expected market return<\/p><p>is 7%. The tax rate is 25%, and the pre-tax cost of debt is 4%.<\/p><p><b>Analysis Required:<\/b><\/p><p>The reorganization plan will shift Tanjiro Innovations&#x27; corporate focus, financial structure, and<\/p><p>potentially its cost of capital and ESG standings.<\/p><p>The following questions will evaluate the reorganization&#x27;s impact using advanced financial<\/p><p>calculations involving the updated financials provided below.<\/p><p><b>Exhibit 2: Tanjiro Post-Restructuring Projected Financials (in USD millions)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0107.webp\" style=\"max-width:min(100%,715px)\" alt=\"Item Pre-Restructure Post-Restructure (Pro Forma) Debt 250 TBD Book Value of Equity 850 TBD Proceeds from Solar Division Spin-off − TBD Cost of Acquisition of BatteryPlus − 500 Cash &amp; Cash Equivalents − TBD New Debt (Post Acquisition and Spin-off) − TBD\"><p>*TBD = To be determined in the questions<\/p><\/div><\/details><div class=\"qtext\"><p>What is the total cash and cash equivalents balance for Tanjiro Innovations Inc. after the restructuring is complete, assuming it started with USD 100 million in cash and cash equivalents before any transactions?<\/p><\/div>", "subj": "corporate"}, {"n": 64, "q": "Calculate the new debt figure for Tanjiro Innovations Inc. after both the spin-off and the acquisition of BatteryPlus using the cash and cash equivalents balance, assuming it started with USD 100 million in cash and no additional financing was used for the acquisition.", "opts": ["USD (160 million)", "USD (260 million)", "USD -10 million"], "ans": "C", "expl": "Using the answer from Question 3 for the total cash and cash equivalents post-restructure, and given the current net debt is USD 250 million: New Debt (Post-Restructure) = Current Debt + Acquisition Cost New Debt (Post-Restructure) = U SD250 million + USD500 million New Debt (Post-Restructure) = U SD750 million −USD760 million New Debt (Post-Restructure) = U SD −10 million A is incorrect. USD (160 million) does not account for the impact of the acquisition cost on the net debt figure. B is incorrect. USD (260 million) represents the total cash and cash equivalents after restructuring, not the new net debt figure.", "explhtml": "<p>Using the answer from Question 3 for the total cash and cash equivalents post-restructure, and given the current net debt is USD 250 million:<\/p><p>New Debt (Post-Restructure) = Current Debt + Acquisition Cost<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0116.webp\" style=\"max-width:min(100%,582px)\" alt=\"−Proceeds from Spin-off −Cash &amp; Cash Equivalents (Pre-Restructure)\"><p>New Debt (Post-Restructure) = U SD250 million + USD500 million<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0117.webp\" style=\"max-width:min(100%,516px)\" alt=\"−U SD660 million −U SD100 million\"><p>New Debt (Post-Restructure) = U SD750 million −USD760 million New Debt (Post-Restructure) = U SD −10 million<\/p><p><b>A is incorrect.<\/b> USD (160 million) does not account for the impact of the acquisition cost on the net debt figure.<\/p><p><b>B is incorrect.<\/b> USD (260 million) represents the total cash and cash equivalents after restructuring, not the new net debt figure.<\/p><p class=\"los\">Corporate Issuers, Learning Module 4: Corporate Restructuring, LOS 4(e) evaluate corporate investment actions, including equity investments, joint ventures, and acquisitions.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Tanjiro Innovations Inc.<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tanjiro Innovations Inc., formerly known as GreenTech Innovations, is an emergent technology<\/p><p>company that specializes in high-efficiency solar panels and advanced EV batteries. Despite<\/p><p>being at the forefront of the renewable energy market, Tanjiro Innovations has identified a need<\/p><p>to reorganize its operations to stay competitive.<\/p><p>The board has approved a strategic plan that includes divesting the solar panel division and<\/p><p>acquiring a promising EV battery manufacturer, BatteryPlus, in a cash transaction valued at USD<\/p><p>500 million.<\/p><p><b>Exhibit 1: Tanjiro Innovations Inc. Financial Overview (in USD millions)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0106.webp\" style=\"max-width:min(100%,494px)\" alt=\"Year 2020 2021 2022 2023 Revenue 1, 000 1, 150 1, 300 1, 400 Net Income 50 100 110 120 Cash from Operations 150 220 250 280 Capital Expenditures 80 100 120 140 Dividends Paid 10 12 15 18 Share Repurchases 0 0 20 30 Debt Issuance 80 50 10 (20) Solar Panel Division Revenue 400 420 430 440 EV Battery D\"><p>Currently, Tanjiro Innovations has a net debt of USD 250 million and book value of equity USD<\/p><p>850 million. The company&#x27;s beta is 1.6, the risk-free rate is 2.5%, and the expected market return<\/p><p>is 7%. The tax rate is 25%, and the pre-tax cost of debt is 4%.<\/p><p><b>Analysis Required:<\/b><\/p><p>The reorganization plan will shift Tanjiro Innovations&#x27; corporate focus, financial structure, and<\/p><p>potentially its cost of capital and ESG standings.<\/p><p>The following questions will evaluate the reorganization&#x27;s impact using advanced financial<\/p><p>calculations involving the updated financials provided below.<\/p><p><b>Exhibit 2: Tanjiro Post-Restructuring Projected Financials (in USD millions)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0107.webp\" style=\"max-width:min(100%,715px)\" alt=\"Item Pre-Restructure Post-Restructure (Pro Forma) Debt 250 TBD Book Value of Equity 850 TBD Proceeds from Solar Division Spin-off − TBD Cost of Acquisition of BatteryPlus − 500 Cash &amp; Cash Equivalents − TBD New Debt (Post Acquisition and Spin-off) − TBD\"><p>*TBD = To be determined in the questions<\/p><\/div><\/details><div class=\"qtext\"><p>Calculate the new debt figure for Tanjiro Innovations Inc. after both the spin-off and the acquisition of BatteryPlus using the cash and cash equivalents balance, assuming it started with USD 100 million in cash and no additional financing was used for the acquisition.<\/p><\/div>", "subj": "corporate"}, {"n": 65, "q": "Hugh’s is most likely correct regarding.", "opts": ["Statement 1.", "Statement 2.", "Statement 3."], "ans": "B", "expl": "Investors and analysts interpret reliably growing dividends as a signal of management’s confidence in stable, sustainable earnings. Empirical evidence shows that unexpected increases in regular dividends often lead to positive share‐price reactions, reflecting the market’s favorable view of consistency and payout growth. A is incorrect. Companies strive not to cut regular dividends even during temporary setbacks, and maintaining or raising them is widely seen as evidence of ongoing profitable operations. C is incorrect. Special (extra) dividends are paid only in strong‐earnings years, allowing firms to retain cash when earnings are weak and distribute surplus cash only when conditions permit. Thus, special dividends do help conserve cash during downturns.", "explhtml": "<p>Investors and analysts interpret reliably growing dividends as a signal of management’s confidence in stable, sustainable earnings. Empirical evidence shows that unexpected increases in regular dividends often lead to positive share‐price reactions, reflecting the market’s favorable view of consistency and payout growth.<\/p><p><b>A is incorrect.<\/b> Companies strive not to cut regular dividends even during temporary setbacks, and maintaining or raising them is widely seen as evidence of ongoing profitable operations.<\/p><p><b>C is incorrect.<\/b> Special (extra) dividends are paid only in strong‐earnings years, allowing firms to retain cash when earnings are weak and distribute surplus cash only when conditions permit. Thus, special dividends do help conserve cash during downturns.<\/p><p class=\"los\">Corporate Issuers, Learning Module 1: Analysis of Dividends and Share Repurchases, LOS 1(a): Describe the expected effect of regular cash dividends, extra dividends, liquidating dividends, stock dividends, stock splits, and reverse stock splits on shareholders’ wealth and a company’s financial ratios.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · Celine Hugh<\/summary><div class=\"vig-body\"><p>Celine Hugh, CFA, is a Senior Analyst at Williamson Group, a UK-based investment firm. Part of<\/p><p>Hugh’s responsibilities include creating dividend policies for the firm. To do this, she enlists the<\/p><p>help of the firm’s associate analyst, Alyisa Summer. During one of their meetings, Hugh makes<\/p><p>the following statements regarding dividends:<\/p><p>Statement 1: Regular cash dividends do not signal a company’s consistent profitability.<\/p><p>Statement 2: Higher and consistent dividend payouts are generally viewed more favorably<\/p><p>Statement 3: Special dividends do not allow companies to conserve cash during economic<\/p><p>downturns.<\/p><p>Summer mentions two factors that may affect dividend policy.<\/p><p>Factor 1: Companies with abundant, profitable investment opportunities will retain more<\/p><p>earnings to fund projects rather than pay dividends, whereas firms with fewer growth prospects<\/p><p>can afford higher payout ratios; similarly, when future earnings are highly volatile, managers<\/p><p>tend to smooth dividends—raising them only when confident the increase can be sustained.<\/p><p>Factor 2: Tax regimes influence investors’ dividend preferences—double taxation, imputation<\/p><p>credits, or split-rate systems alter the after-tax benefit of dividends versus capital gains—while<\/p><p>contractual and legal restrictions (e.g., debt covenants, statutory capital-impairment rules, and<\/p><p>preferred-share priorities) can directly limit how much and when dividends may be distributed.<\/p><p>Following this, Hugh and Summer review the dividend payment history of Dreyfus Ltd, a rival<\/p><p>company with comparable operations and financing structure to Williamson Group, presented in<\/p><p>Exhibit 1<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0118.webp\" style=\"max-width:min(100%,307px)\" alt=\"Exhibit 1: Dreyfus Ltd’s Dividend Data Year DPS Adjusted EPS 2020 £9.1 £18.90 2021 £8.6 £16.22 2022 £9.3 £19.03 2023 £10.1 £18.95 2024 £10.1 £19.10\"><p>Hugh suggests implementing a share repurchase program for Williamson Group. He supports<\/p><p>this recommendation by asserting that the overall effect on shareholders’ wealth would be<\/p><p>equivalent whether the company opts for a repurchase or continues its regular dividend payment<\/p><p>program. Currently, Williamson Group has £65 million in debt and equity with a market value of<\/p><p>£226 million. Hugh concludes that the company should proceed with a repurchase totaling £16<\/p><p>million of its common shares&#x27; market value, funded by issuing new debt.<\/p><\/div><\/details><div class=\"qtext\"><p>Hugh’s is most likely correct regarding.<\/p><\/div>", "subj": "corporate"}, {"n": 66, "q": "Summer is most likely correct regarding:", "opts": ["Factor 1.", "Factor 2.", "Both Factor 1 and 2."], "ans": "C", "expl": "Summer’s factors are drawn directly from the six real‐world considerations managers cite when setting dividend policy. Factor 1 (Investment opportunities & earnings volatility): A firm with plentiful, high-return projects retains cash internally rather than pay it out, because retaining it avoids the higher cost of new equity. When earnings are unpredictable, managers “smooth” dividends, only raising payouts once they’re confident the higher level is Factor 2 (Tax regimes & legal/contractual constraints): Different jurisdictions’ tax systems (double‐taxation, imputation, split-rate) change the net after-tax return shareholders get from dividends versus capital gains, influencing corporate payout strategy. Debt covenants, capital‐impairment rules, and preferred‐share priorities legally limit how much a company can distribute as dividends. These points come straight from the practical factors impeding dividend policy. A and B are incorrect. While correctly stated, Factor 1 omits equally important tax and legal considerations in Factor 2.", "explhtml": "<p>Summer’s factors are drawn directly from the six real‐world considerations managers cite when setting dividend policy.<\/p><p><b>Factor 1 (Investment opportunities &amp; earnings volatility):<\/b> A firm with plentiful,<\/p><p>high-return projects retains cash internally rather than pay it out, because retaining it<\/p><p>avoids the higher cost of new equity. When earnings are unpredictable, managers<\/p><p>“smooth” dividends, only raising payouts once they’re confident the higher level is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0119.webp\" style=\"max-width:min(100%,104px)\" alt=\"sustainable.\"><p><b>Factor 2 (Tax regimes &amp; legal/contractual constraints):<\/b> Different jurisdictions’ tax<\/p><p>systems (double‐taxation, imputation, split-rate) change the net after-tax return<\/p><p>shareholders get from dividends versus capital gains, influencing corporate payout<\/p><p>strategy. Debt covenants, capital‐impairment rules, and preferred‐share priorities<\/p><p>legally limit how much a company can distribute as dividends. These points come<\/p><p>straight from the practical factors impeding dividend policy.<\/p><p><b>A and B are incorrect.<\/b> While correctly stated, Factor 1 omits equally important tax and legal considerations in Factor 2.<\/p><p class=\"los\">Corporate Issuers, Learning Module 1: Analysis of Dividends and Share Repurchases, LOS 1(e): Explain factors that affect dividend policy in practice.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · Celine Hugh<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Celine Hugh, CFA, is a Senior Analyst at Williamson Group, a UK-based investment firm. Part of<\/p><p>Hugh’s responsibilities include creating dividend policies for the firm. To do this, she enlists the<\/p><p>help of the firm’s associate analyst, Alyisa Summer. During one of their meetings, Hugh makes<\/p><p>the following statements regarding dividends:<\/p><p>Statement 1: Regular cash dividends do not signal a company’s consistent profitability.<\/p><p>Statement 2: Higher and consistent dividend payouts are generally viewed more favorably<\/p><p>Statement 3: Special dividends do not allow companies to conserve cash during economic<\/p><p>downturns.<\/p><p>Summer mentions two factors that may affect dividend policy.<\/p><p>Factor 1: Companies with abundant, profitable investment opportunities will retain more<\/p><p>earnings to fund projects rather than pay dividends, whereas firms with fewer growth prospects<\/p><p>can afford higher payout ratios; similarly, when future earnings are highly volatile, managers<\/p><p>tend to smooth dividends—raising them only when confident the increase can be sustained.<\/p><p>Factor 2: Tax regimes influence investors’ dividend preferences—double taxation, imputation<\/p><p>credits, or split-rate systems alter the after-tax benefit of dividends versus capital gains—while<\/p><p>contractual and legal restrictions (e.g., debt covenants, statutory capital-impairment rules, and<\/p><p>preferred-share priorities) can directly limit how much and when dividends may be distributed.<\/p><p>Following this, Hugh and Summer review the dividend payment history of Dreyfus Ltd, a rival<\/p><p>company with comparable operations and financing structure to Williamson Group, presented in<\/p><p>Exhibit 1<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0118.webp\" style=\"max-width:min(100%,307px)\" alt=\"Exhibit 1: Dreyfus Ltd’s Dividend Data Year DPS Adjusted EPS 2020 £9.1 £18.90 2021 £8.6 £16.22 2022 £9.3 £19.03 2023 £10.1 £18.95 2024 £10.1 £19.10\"><p>Hugh suggests implementing a share repurchase program for Williamson Group. He supports<\/p><p>this recommendation by asserting that the overall effect on shareholders’ wealth would be<\/p><p>equivalent whether the company opts for a repurchase or continues its regular dividend payment<\/p><p>program. Currently, Williamson Group has £65 million in debt and equity with a market value of<\/p><p>£226 million. Hugh concludes that the company should proceed with a repurchase totaling £16<\/p><p>million of its common shares&#x27; market value, funded by issuing new debt.<\/p><\/div><\/details><div class=\"qtext\"><p>Summer is most likely correct regarding:<\/p><\/div>", "subj": "corporate"}, {"n": 67, "q": "Based on the information from Exhibit 1, Dreyfus’ dividend policy is closest to:", "opts": ["Constant dividend policy.", "Stable dividend policy.", "Zero dividend policy."], "ans": "B", "expl": "Dreyfus Ltd has maintained a relatively consistent dividend per share (DPS) between £8.6 and £10.1 over five years, despite earnings per share (EPS) fluctuations. This pattern is characteristic of a stable dividend policy, where the company prioritizes paying a consistent or slowly growing dividend regardless of short-term changes in earnings. In a stable dividend policy, firms focus on long-term payout consistency and only increase dividends when they believe higher payouts are sustainable. The flat DPS in 2023 and 2024 at £10.1, even though EPS rose slightly in 2024, supports this. The company appears to smooth dividends over time, which aligns with a typical “stable” policy framework. A is incorrect. This implies a fixed percentage of earnings is paid out as dividends. If Dreyfus followed this, the DPS would vary directly with EPS. However, in the exhibit, EPS changes notably year to year, but DPS does not change proportionally. For instance, in 2021, EPS drops to £16.22, yet the DPS is still a relatively high £8.6—this disproves a constant payout ratio. C is incorrect. This would mean the company pays no dividends instead of reinvesting all profits. Dreyfus pays regular dividends yearly, so this policy does not apply.", "explhtml": "<p>Dreyfus Ltd has maintained a relatively consistent dividend per share (DPS) between £8.6 and £10.1 over five years, despite earnings per share (EPS) fluctuations. This pattern is characteristic of a stable dividend policy, where the company prioritizes paying a consistent or slowly growing dividend regardless of short-term changes in earnings.<\/p><p>In a stable dividend policy, firms focus on long-term payout consistency and only increase dividends when they believe higher payouts are sustainable. The flat DPS in 2023 and 2024 at £10.1, even though EPS rose slightly in 2024, supports this. The company appears to smooth dividends over time, which aligns with a typical “stable” policy framework.<\/p><p><b>A is incorrect.<\/b> This implies a fixed percentage of earnings is paid out as dividends. If Dreyfus followed this, the DPS would vary directly with EPS. However, in the exhibit, EPS changes notably year to year, but DPS does not change proportionally. For instance, in 2021, EPS drops to £16.22, yet the DPS is still a relatively high £8.6—this disproves a constant payout ratio.<\/p><p><b>C is incorrect.<\/b> This would mean the company pays no dividends instead of reinvesting all profits. Dreyfus pays regular dividends yearly, so this policy does not apply.<\/p><p class=\"los\">Corporate Issuers, Learning Module 1: Analysis of Dividends and Share Repurchases, LOS 1(g): Compare stable dividend, constant dividend payout ratio, and residual dividend payout policies, and calculate the dividend under each policy.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · Celine Hugh<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Celine Hugh, CFA, is a Senior Analyst at Williamson Group, a UK-based investment firm. Part of<\/p><p>Hugh’s responsibilities include creating dividend policies for the firm. To do this, she enlists the<\/p><p>help of the firm’s associate analyst, Alyisa Summer. During one of their meetings, Hugh makes<\/p><p>the following statements regarding dividends:<\/p><p>Statement 1: Regular cash dividends do not signal a company’s consistent profitability.<\/p><p>Statement 2: Higher and consistent dividend payouts are generally viewed more favorably<\/p><p>Statement 3: Special dividends do not allow companies to conserve cash during economic<\/p><p>downturns.<\/p><p>Summer mentions two factors that may affect dividend policy.<\/p><p>Factor 1: Companies with abundant, profitable investment opportunities will retain more<\/p><p>earnings to fund projects rather than pay dividends, whereas firms with fewer growth prospects<\/p><p>can afford higher payout ratios; similarly, when future earnings are highly volatile, managers<\/p><p>tend to smooth dividends—raising them only when confident the increase can be sustained.<\/p><p>Factor 2: Tax regimes influence investors’ dividend preferences—double taxation, imputation<\/p><p>credits, or split-rate systems alter the after-tax benefit of dividends versus capital gains—while<\/p><p>contractual and legal restrictions (e.g., debt covenants, statutory capital-impairment rules, and<\/p><p>preferred-share priorities) can directly limit how much and when dividends may be distributed.<\/p><p>Following this, Hugh and Summer review the dividend payment history of Dreyfus Ltd, a rival<\/p><p>company with comparable operations and financing structure to Williamson Group, presented in<\/p><p>Exhibit 1<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0118.webp\" style=\"max-width:min(100%,307px)\" alt=\"Exhibit 1: Dreyfus Ltd’s Dividend Data Year DPS Adjusted EPS 2020 £9.1 £18.90 2021 £8.6 £16.22 2022 £9.3 £19.03 2023 £10.1 £18.95 2024 £10.1 £19.10\"><p>Hugh suggests implementing a share repurchase program for Williamson Group. He supports<\/p><p>this recommendation by asserting that the overall effect on shareholders’ wealth would be<\/p><p>equivalent whether the company opts for a repurchase or continues its regular dividend payment<\/p><p>program. Currently, Williamson Group has £65 million in debt and equity with a market value of<\/p><p>£226 million. Hugh concludes that the company should proceed with a repurchase totaling £16<\/p><p>million of its common shares&#x27; market value, funded by issuing new debt.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the information from Exhibit 1, Dreyfus’ dividend policy is closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 68, "q": "Is Hugh correct in his statement concerning the share repurchase program?", "opts": ["Yes.", "No, the increase in total debt ratio is greater when repurchase is made by issuing new debt.", "No, the total debt ratio is equal regardless of whether debt or cash is used for repurchase."], "ans": "B", "expl": "Hugh is incorrect in asserting that the shareholder wealth impact is the same regardless of how the repurchase is funded. While in perfect capital markets, a repurchase and a dividend might have equivalent effects on shareholder wealth (per the MM dividend irrelevance theory), funding a share repurchase with new debt changes the company’s capital structure, increasing financial leverage and risk, and therefore impacting the total debt ratio. A is incorrect. Hugh ignores the structural difference between financing with debt versus using cash. The method of funding a repurchase does affect leverage and therefore may impact shareholder value, especially when taxes, financial distress, or signaling effects are considered. C is incorrect. Using debt increases liabilities, while using cash reduces assets without affecting liabilities, thus affecting the debt-to-capital ratio differently in each case.", "explhtml": "<p>Hugh is incorrect in asserting that the shareholder wealth impact is the same regardless of how the repurchase is funded. While in perfect capital markets, a repurchase and a dividend might have equivalent effects on shareholder wealth (per the MM dividend irrelevance theory), funding a share repurchase with new debt changes the company’s capital structure, increasing financial leverage and risk, and therefore impacting the total debt ratio.<\/p><p><b>A is incorrect.<\/b> Hugh ignores the structural difference between financing with debt versus using cash. The method of funding a repurchase does affect leverage and therefore may impact shareholder value, especially when taxes, financial distress, or signaling effects are considered.<\/p><p><b>C is incorrect.<\/b> Using debt increases liabilities, while using cash reduces assets without affecting liabilities, thus affecting the debt-to-capital ratio differently in each case.<\/p><p class=\"los\">Corporate Issuers, Learning Module 1: Analysis of Dividends and Share Repurchases, LOS 1(i): Calculate and compare the effect of a share repurchase on earnings per share when 1) the repurchase is financed with the company’s surplus cash and 2) the company uses debt to finance the repurchase.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · Celine Hugh<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Celine Hugh, CFA, is a Senior Analyst at Williamson Group, a UK-based investment firm. Part of<\/p><p>Hugh’s responsibilities include creating dividend policies for the firm. To do this, she enlists the<\/p><p>help of the firm’s associate analyst, Alyisa Summer. During one of their meetings, Hugh makes<\/p><p>the following statements regarding dividends:<\/p><p>Statement 1: Regular cash dividends do not signal a company’s consistent profitability.<\/p><p>Statement 2: Higher and consistent dividend payouts are generally viewed more favorably<\/p><p>Statement 3: Special dividends do not allow companies to conserve cash during economic<\/p><p>downturns.<\/p><p>Summer mentions two factors that may affect dividend policy.<\/p><p>Factor 1: Companies with abundant, profitable investment opportunities will retain more<\/p><p>earnings to fund projects rather than pay dividends, whereas firms with fewer growth prospects<\/p><p>can afford higher payout ratios; similarly, when future earnings are highly volatile, managers<\/p><p>tend to smooth dividends—raising them only when confident the increase can be sustained.<\/p><p>Factor 2: Tax regimes influence investors’ dividend preferences—double taxation, imputation<\/p><p>credits, or split-rate systems alter the after-tax benefit of dividends versus capital gains—while<\/p><p>contractual and legal restrictions (e.g., debt covenants, statutory capital-impairment rules, and<\/p><p>preferred-share priorities) can directly limit how much and when dividends may be distributed.<\/p><p>Following this, Hugh and Summer review the dividend payment history of Dreyfus Ltd, a rival<\/p><p>company with comparable operations and financing structure to Williamson Group, presented in<\/p><p>Exhibit 1<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0118.webp\" style=\"max-width:min(100%,307px)\" alt=\"Exhibit 1: Dreyfus Ltd’s Dividend Data Year DPS Adjusted EPS 2020 £9.1 £18.90 2021 £8.6 £16.22 2022 £9.3 £19.03 2023 £10.1 £18.95 2024 £10.1 £19.10\"><p>Hugh suggests implementing a share repurchase program for Williamson Group. He supports<\/p><p>this recommendation by asserting that the overall effect on shareholders’ wealth would be<\/p><p>equivalent whether the company opts for a repurchase or continues its regular dividend payment<\/p><p>program. Currently, Williamson Group has £65 million in debt and equity with a market value of<\/p><p>£226 million. Hugh concludes that the company should proceed with a repurchase totaling £16<\/p><p>million of its common shares&#x27; market value, funded by issuing new debt.<\/p><\/div><\/details><div class=\"qtext\"><p>Is Hugh correct in his statement concerning the share repurchase program?<\/p><\/div>", "subj": "corporate"}, {"n": 69, "q": "Which ESG integration approach is closest to quantifying SafeWork’s underperformance in forecasts?", "opts": ["Increase discount rate by 50 bp.", "Reduce revenue growth forecasts.", "Model an annual safety-compliance expense."], "ans": "C", "expl": "This method embeds SafeWork’s quantitative safety-related outflows. The Social factors section emphasizes explicitly modeling additional costs (e.g., fines, training, equipment upgrades), which better capture social-risk impacts than a broad discount-rate penalty or top-line adjustment. By adding a line-item expense equal to the incremental safety-compliance spend, forecasts directly reflect the cash-flow hit. A is incorrect. A higher discount rate adjusts all cash flows for perceived risk but does not isolate the specific safety cost impact. B is incorrect. Cutting revenue growth misattributes safety failings to demand issues, rather than properly reflecting them as added expenses.", "explhtml": "<p>This method embeds SafeWork’s quantitative safety-related outflows. The Social factors section emphasizes explicitly modeling additional costs (e.g., fines, training, equipment upgrades), which better capture social-risk impacts than a broad discount-rate penalty or top-line adjustment. By adding a line-item expense equal to the incremental safety-compliance spend, forecasts directly reflect the cash-flow hit.<\/p><p><b>A is incorrect.<\/b> A higher discount rate adjusts all cash flows for perceived risk but does not isolate the specific safety cost impact.<\/p><p><b>B is incorrect.<\/b> Cutting revenue growth misattributes safety failings to demand issues, rather than properly reflecting them as added expenses.<\/p><p class=\"los\">Corporate Issuers, Learning Module 2: Environmental, Social, and Governance (ESG) Considerations in Investment Analysis, LOS (d): Evaluate ESG risk exposures and investment opportunities related to a company.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · John Prescott<\/summary><div class=\"vig-body\"><p>John Prescott, CFA, is a portfolio manager at Eurasian Capital Ltd (EC), which oversees a $4<\/p><p>billion global equity strategy. EC’s investment process incorporates Environmental, Social, and<\/p><p>Governance (ESG) considerations to enhance returns and reduce downside risk. John is<\/p><p>evaluating three candidate companies for inclusion in EC’s ESG-enhanced portfolio:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0120.webp\" style=\"max-width:min(100%,684px)\" alt=\"Company Sector ESG Focus Key Data Eco Chem Chemicals Emissions CO2 intensity: 0.8 t/ton; Industries industry average: 0.6 t/ton; plans 20% cut by 2025 SafeWork Industrial Goods Worker Safety Incident rate: 4.5 per 200 k hrs; Manufacturing peer average: 2.0; missed safety targets two years running. P\"><p>EC’s <b>ESG integration framework<\/b> requires John to:<\/p><p>1. <b>Assess materiality<\/b> – Identify which ESG issue will most likely affect each company’s<\/p><p>valuation in the near term.<\/p><p>2. <b>Adjust discount rates<\/b> – Determine how to shift Prime Tech’s cost of equity for<\/p><p>governance risk.<\/p><p>3. <b>Incorporate ESG into cash-flow forecasts<\/b> – Evaluate the expense implications of<\/p><p>SafeWork’s safety underperformance.<\/p><p>4. <b>Engage and monitor<\/b> – Define the stewardship action most closely aligned with<\/p><p>improving Eco Chem’s emissions profile.<\/p><\/div><\/details><div class=\"qtext\"><p>Which ESG integration approach is closest to quantifying SafeWork’s underperformance in forecasts?<\/p><\/div>", "subj": "corporate"}, {"n": 70, "q": "Which stewardship action is least likely to improve Eco Chem’s emissions profile?", "opts": ["Engage management on carbon reduction targets", "File shareholder resolution on emissions disclosures", "Sell all EcoChem shares"], "ans": "C", "expl": "By exiting the position, EC loses its shareholder voice and cannot advocate for emissions reductions, making divestment the least effective stewardship tool. The “E” Stewardship chapter highlights that active engagement (dialogue, resolutions) can drive management to improve ESG performance. In contrast, divestment removes the investor’s influence entirely and forfeits any opportunity to effect change. A is incorrect. Direct engagement allows EC to press for concrete carbon-cutting targets and monitor progress. B is incorrect. A shareholder resolution can compel Eco Chem to enhance its disclosures and set more ambitious emissions goals.", "explhtml": "<p>By exiting the position, EC loses its shareholder voice and cannot advocate for emissions reductions, making divestment the least effective stewardship tool. The “E” Stewardship chapter highlights that active engagement (dialogue, resolutions) can drive management to improve ESG performance. In contrast, divestment removes the investor’s influence entirely and forfeits any opportunity to effect change.<\/p><p><b>A is incorrect.<\/b> Direct engagement allows EC to press for concrete carbon-cutting targets and monitor progress.<\/p><p><b>B is incorrect.<\/b> A shareholder resolution can compel Eco Chem to enhance its disclosures and set more ambitious emissions goals.<\/p><p class=\"los\">Corporate Issuers, Learning Module 2: Environmental, Social, and Governance (ESG) Considerations in Investment Analysis, LOS (d): Evaluate ESG risk exposures and investment opportunities related to a company.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · John Prescott<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>John Prescott, CFA, is a portfolio manager at Eurasian Capital Ltd (EC), which oversees a $4<\/p><p>billion global equity strategy. EC’s investment process incorporates Environmental, Social, and<\/p><p>Governance (ESG) considerations to enhance returns and reduce downside risk. John is<\/p><p>evaluating three candidate companies for inclusion in EC’s ESG-enhanced portfolio:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0120.webp\" style=\"max-width:min(100%,684px)\" alt=\"Company Sector ESG Focus Key Data Eco Chem Chemicals Emissions CO2 intensity: 0.8 t/ton; Industries industry average: 0.6 t/ton; plans 20% cut by 2025 SafeWork Industrial Goods Worker Safety Incident rate: 4.5 per 200 k hrs; Manufacturing peer average: 2.0; missed safety targets two years running. P\"><p>EC’s <b>ESG integration framework<\/b> requires John to:<\/p><p>1. <b>Assess materiality<\/b> – Identify which ESG issue will most likely affect each company’s<\/p><p>valuation in the near term.<\/p><p>2. <b>Adjust discount rates<\/b> – Determine how to shift Prime Tech’s cost of equity for<\/p><p>governance risk.<\/p><p>3. <b>Incorporate ESG into cash-flow forecasts<\/b> – Evaluate the expense implications of<\/p><p>SafeWork’s safety underperformance.<\/p><p>4. <b>Engage and monitor<\/b> – Define the stewardship action most closely aligned with<\/p><p>improving Eco Chem’s emissions profile.<\/p><\/div><\/details><div class=\"qtext\"><p>Which stewardship action is least likely to improve Eco Chem’s emissions profile?<\/p><\/div>", "subj": "corporate"}, {"n": 71, "q": "Which ESG issue will likely be material for Eco Chem’s short-term valuation?", "opts": ["Dual-class share control", "Emissions intensity", "Worker safety"], "ans": "B", "expl": "Eco Chem’s CO₂ intensity determines its exposure to carbon taxes and the cost of emissions abatement—line items that hit operating margins in the current forecast period. Environmental factors like carbon intensity directly affect near-term cash flows through compliance costs and potential carbon pricing regimes (e.g., planned $25/t CO₂ tax). Emissions improvements immediately reduce operating expenses, whereas governance structures and social metrics typically influence longer-term risk or reputational outcomes rather than upcoming free cash flow. A is incorrect. Dual-class control is a governance concern with limited near-term cash-flow impact. C is incorrect. Worker safety is more relevant to labor-intensive sectors (e.g., SafeWork) than chemicals.", "explhtml": "<p>Eco Chem’s CO₂ intensity determines its exposure to carbon taxes and the cost of emissions abatement—line items that hit operating margins in the current forecast period. Environmental factors like carbon intensity directly affect near-term cash flows through compliance costs and potential carbon pricing regimes (e.g., planned $25/t CO₂ tax). Emissions improvements immediately reduce operating expenses, whereas governance structures and social metrics typically influence longer-term risk or reputational outcomes rather than upcoming free cash flow.<\/p><p><b>A is incorrect.<\/b> Dual-class control is a governance concern with limited near-term cash-flow impact.<\/p><p><b>C is incorrect.<\/b> Worker safety is more relevant to labor-intensive sectors (e.g., SafeWork) than chemicals.<\/p><p class=\"los\">Corporate Issuers, Learning Module 2: Environmental, Social, and Governance (ESG) Considerations in Investment Analysis, LOS 2(A): Evaluate the effectiveness of a company’s corporate governance policies and practices.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · John Prescott<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>John Prescott, CFA, is a portfolio manager at Eurasian Capital Ltd (EC), which oversees a $4<\/p><p>billion global equity strategy. EC’s investment process incorporates Environmental, Social, and<\/p><p>Governance (ESG) considerations to enhance returns and reduce downside risk. John is<\/p><p>evaluating three candidate companies for inclusion in EC’s ESG-enhanced portfolio:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0120.webp\" style=\"max-width:min(100%,684px)\" alt=\"Company Sector ESG Focus Key Data Eco Chem Chemicals Emissions CO2 intensity: 0.8 t/ton; Industries industry average: 0.6 t/ton; plans 20% cut by 2025 SafeWork Industrial Goods Worker Safety Incident rate: 4.5 per 200 k hrs; Manufacturing peer average: 2.0; missed safety targets two years running. P\"><p>EC’s <b>ESG integration framework<\/b> requires John to:<\/p><p>1. <b>Assess materiality<\/b> – Identify which ESG issue will most likely affect each company’s<\/p><p>valuation in the near term.<\/p><p>2. <b>Adjust discount rates<\/b> – Determine how to shift Prime Tech’s cost of equity for<\/p><p>governance risk.<\/p><p>3. <b>Incorporate ESG into cash-flow forecasts<\/b> – Evaluate the expense implications of<\/p><p>SafeWork’s safety underperformance.<\/p><p>4. <b>Engage and monitor<\/b> – Define the stewardship action most closely aligned with<\/p><p>improving Eco Chem’s emissions profile.<\/p><\/div><\/details><div class=\"qtext\"><p>Which ESG issue will likely be material for Eco Chem’s short-term valuation?<\/p><\/div>", "subj": "corporate"}, {"n": 72, "q": "For Prime Tech, which adjustment is most accurate for reflecting governance risk in its cost of equity?", "opts": ["Add 100 bp premium", "Subtract 50 bp discount", "Add 50 bp premium"], "ans": "C", "expl": "EC’s policy aligns with industry guidance to add ~0.5% to the base cost of equity for impaired governance, reflecting the additional risk to non-voting shareholders. Companies with dual-class share structures warrant a governance premium on their discount rate to compensate investors for minority-shareholder control risk, commonly around 50 basis points. A 100 bp uplift would exceed typical practice, whereas a discount is inappropriate. A is incorrect. A 1.00% premium overstates governance risk relative to standard practice. B is incorrect. A discount implies that Prime Tech’s governance is superior to the benchmark, contradicting its 65% founder voting control.", "explhtml": "<p>EC’s policy aligns with industry guidance to add ~0.5% to the base cost of equity for impaired governance, reflecting the additional risk to non-voting shareholders. Companies with dual-class share structures warrant a governance premium on their discount rate to compensate investors for minority-shareholder control risk, commonly around 50 basis points. A 100 bp uplift would exceed typical practice, whereas a discount is inappropriate.<\/p><p><b>A is incorrect.<\/b> A 1.00% premium overstates governance risk relative to standard practice.<\/p><p><b>B is incorrect.<\/b> A discount implies that Prime Tech’s governance is superior to the benchmark, contradicting its 65% founder voting control.<\/p><p class=\"los\">Corporate Issuers, Learning Module 2: Environmental, Social, and Governance (ESG) Considerations in Investment Analysis, LOS 2(A): Evaluate the effectiveness of a company’s corporate governance policies and practices.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · John Prescott<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>John Prescott, CFA, is a portfolio manager at Eurasian Capital Ltd (EC), which oversees a $4<\/p><p>billion global equity strategy. EC’s investment process incorporates Environmental, Social, and<\/p><p>Governance (ESG) considerations to enhance returns and reduce downside risk. John is<\/p><p>evaluating three candidate companies for inclusion in EC’s ESG-enhanced portfolio:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0120.webp\" style=\"max-width:min(100%,684px)\" alt=\"Company Sector ESG Focus Key Data Eco Chem Chemicals Emissions CO2 intensity: 0.8 t/ton; Industries industry average: 0.6 t/ton; plans 20% cut by 2025 SafeWork Industrial Goods Worker Safety Incident rate: 4.5 per 200 k hrs; Manufacturing peer average: 2.0; missed safety targets two years running. P\"><p>EC’s <b>ESG integration framework<\/b> requires John to:<\/p><p>1. <b>Assess materiality<\/b> – Identify which ESG issue will most likely affect each company’s<\/p><p>valuation in the near term.<\/p><p>2. <b>Adjust discount rates<\/b> – Determine how to shift Prime Tech’s cost of equity for<\/p><p>governance risk.<\/p><p>3. <b>Incorporate ESG into cash-flow forecasts<\/b> – Evaluate the expense implications of<\/p><p>SafeWork’s safety underperformance.<\/p><p>4. <b>Engage and monitor<\/b> – Define the stewardship action most closely aligned with<\/p><p>improving Eco Chem’s emissions profile.<\/p><\/div><\/details><div class=\"qtext\"><p>For Prime Tech, which adjustment is most accurate for reflecting governance risk in its cost of equity?<\/p><\/div>", "subj": "corporate"}, {"n": 73, "q": "Which ESG factor will most likely have a material short-term cash-flow impact on Global Grid Energy’s valuation?", "opts": ["Board independence", "Carbon emissions intensity", "Labor rights in the supply chain"], "ans": "B", "expl": "Global Grid’s emissions are 40% above the regional benchmark, which makes it particularly vulnerable to regulatory penalties. The pending €45/tonne carbon tax in the EU directly increases the company's operating cost structure. Since this tax is expected to be implemented soon, it poses a material short-term impact on free cash flow, as Bailey correctly anticipates. This is not just a theoretical concern, it’s a near-term, quantifiable cost that directly lowers profitability and valuation. A is incorrect. This factor relates to Orbis Technologies, not Global Grid Energy. Board independence is a key governance issue, as it impacts long-term accountability, oversight, and risk management. While important for valuation, it does not typically affect short-term cash flows. Its impact is more structural and strategic than operational. C is incorrect. This issue is associated with Safe Harvest Foods, not Global Grid Energy. Labor rights and supply chain ESG concerns fall under the social pillar, and while they can lead to reputational and compliance risks, they are particularly relevant for companies with complex global supply chains, such as those in the agricultural or manufacturing sectors. Global Grid Energy is a European utility, and there's no mention of supply chain labor concerns in its case.", "explhtml": "<p>Global Grid’s emissions are 40% above the regional benchmark, which makes it particularly vulnerable to regulatory penalties. The pending €45/tonne carbon tax in the EU directly increases the company&#x27;s operating cost structure. Since this tax is expected to be implemented soon, it poses a material short-term impact on free cash flow, as Bailey correctly anticipates. This is not just a theoretical concern, it’s a near-term, quantifiable cost that directly lowers profitability and valuation.<\/p><p><b>A is incorrect.<\/b> This factor relates to Orbis Technologies, not Global Grid Energy. Board independence is a key governance issue, as it impacts long-term accountability, oversight, and risk management. While important for valuation, it does not typically affect short-term cash flows. Its impact is more structural and strategic than operational.<\/p><p><b>C is incorrect.<\/b> This issue is associated with Safe Harvest Foods, not Global Grid Energy. Labor rights and supply chain ESG concerns fall under the social pillar, and while they can lead to reputational and compliance risks, they are particularly relevant for companies with complex global supply chains, such as those in the agricultural or manufacturing sectors. Global Grid Energy is a European utility, and there&#x27;s no mention of supply chain labor concerns in its case.<\/p><p class=\"los\">Corporate Issuers, Learning Module 2: Environmental, Social, and Governance (ESG) Considerations in Investment Analysis, LOS 2(A): Evaluate the effectiveness of a company’s corporate governance policies and practices.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 73–76 · Jane Bailey<\/summary><div class=\"vig-body\"><p>Jane Bailey, CFA, is a senior portfolio manager at Westborough Capital Ltd. (WC), a $2.5 billion<\/p><p>asset manager specializing in global equity markets. WC’s investment strategy incorporates ESG<\/p><p>considerations throughout the security selection and valuation process. Jane chairs the ESG<\/p><p>Integration Committee and recently began reviewing three companies under consideration for<\/p><p>inclusion in the firm’s ESG-titled portfolio.<\/p><p>Bailey begins by reviewing Global Grid Energy, a European utility with above-average emissions<\/p><p>relative to sector peers. Although the company has pledged a 30% reduction in Scope 1 and 2<\/p><p>emissions by 2030, its CO<sub>2<\/sub> intensity remains 40% above the regional benchmark. A pending EU<\/p><p>regulatory shift is expected to impose a €45/tonne carbon tax. Jane estimates this could<\/p><p>significantly impact Global Grid’s short-term free cash flow and is concerned about the<\/p><p>company’s pace of transition to cleaner energy sources.<\/p><p>Next, Bailey evaluates Orbis Technologies, a U.S.-based social media firm. While financially<\/p><p>strong, Orbis has raised red flags around governance practices. The founder retains 70% voting<\/p><p>power through a dual-class share structure, and the board has only 33% independent members.<\/p><p>WC’s internal cost of equity model applies a governance risk premium to firms exhibiting weak<\/p><p>shareholder rights, and Jane must determine the appropriate adjustment.<\/p><p>Bailey also reviews Safe Harvest Foods, an agricultural conglomerate with global supply chains.<\/p><p>Recent reports suggest that the company sources raw materials from suppliers using<\/p><p>questionable labor practices. WC’s ESG integration framework emphasizes supply chain due<\/p><p>diligence under the social pillar. Bailey collaborates with ESG analyst Raj Mehta to quantify<\/p><p>potential expense implications if Safe Harvest implements more stringent vendor audits,<\/p><p>training, and traceability programs.<\/p><p>Finally, during the firm’s stewardship strategy meeting, Bailey discusses engagement strategies<\/p><p>for Global Grid. Analyst Priya Kapoor recommends directly engaging with management on<\/p><p>emissions targets, while another colleague suggests divestment. Bailey reminds the team that<\/p><p>WC’s stewardship policy emphasizes proactive engagement and shareholder proposals as<\/p><p>preferred levers for ESG improvement, especially in cases with a credible transition plan.<\/p><\/div><\/details><div class=\"qtext\"><p>Which ESG factor will most likely have a material short-term cash-flow impact on Global Grid Energy’s valuation?<\/p><\/div>", "subj": "corporate"}, {"n": 74, "q": "What adjustment is most accurate when incorporating Orbis Technologies’ governance structure into its cost of equity?", "opts": ["Subtract 50 basis points from the base rate", "Add 50 basis points to the base rate", "Add 150 basis points to the base rate"], "ans": "B", "expl": "Orbis Technologies has significant governance concerns, a dual-class share structure where the founder holds 70% of voting power, despite potentially lower economic ownership. A board with only 33% independent directors raises concerns about oversight and accountability. These factors signal weak shareholder rights and reduced transparency, both indicators of governance risk. A 50 basis point (bps) adjustment is a standard and proportionate increase used in practice to reflect moderate governance risk, such as what is presented here. It signals heightened risk to investors (e.g., risk of management entrenchment, poor responsiveness to shareholders), without overstating the impact on valuation. A is incorrect. Subtracting from the base rate suggests that the firm has superior governance, lower risk, or higher transparency, which is not the case here. Orbis shows clear signs of governance weakness, making a downward adjustment inappropriate. This would underestimate the firm’s risk profile and overvalue the equity. C is incorrect. A 150 bps increase would typically be reserved for severe governance failings or companies with multiple high-impact ESG red flags, including potential fraud risk, board capture, or legal action due to governance failures. While Orbis has notable governance concerns, they are not extreme enough to justify such a high premium. Applying such a steep increase would over-penalize the company and may distort the cost of capital used in valuation.", "explhtml": "<p>Orbis Technologies has significant governance concerns, a dual-class share structure where the founder holds 70% of voting power, despite potentially lower economic ownership. A board with only 33% independent directors raises concerns about oversight and accountability. These factors signal weak shareholder rights and reduced transparency, both indicators of governance risk. A 50 basis point (bps) adjustment is a standard and proportionate increase used in practice to reflect moderate governance risk, such as what is presented here. It signals heightened risk to investors (e.g., risk of management entrenchment, poor responsiveness to shareholders), without overstating the impact on valuation.<\/p><p><b>A is incorrect.<\/b> Subtracting from the base rate suggests that the firm has superior governance, lower risk, or higher transparency, which is not the case here. Orbis shows clear signs of governance weakness, making a downward adjustment inappropriate. This would underestimate the firm’s risk profile and overvalue the equity.<\/p><p><b>C is incorrect.<\/b> A 150 bps increase would typically be reserved for severe governance failings or companies with multiple high-impact ESG red flags, including potential fraud risk, board capture, or legal action due to governance failures. While Orbis has notable governance concerns, they are not extreme enough to justify such a high premium. Applying such a steep increase would over-penalize the company and may distort the cost of capital used in valuation.<\/p><p class=\"los\">Corporate Issuers, Learning Module 2: Environmental, Social, and Governance (ESG) Considerations in Investment Analysis, LOS (A): Evaluate the effectiveness of a company’s corporate governance policies and practices.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 73–76 · Jane Bailey<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jane Bailey, CFA, is a senior portfolio manager at Westborough Capital Ltd. (WC), a $2.5 billion<\/p><p>asset manager specializing in global equity markets. WC’s investment strategy incorporates ESG<\/p><p>considerations throughout the security selection and valuation process. Jane chairs the ESG<\/p><p>Integration Committee and recently began reviewing three companies under consideration for<\/p><p>inclusion in the firm’s ESG-titled portfolio.<\/p><p>Bailey begins by reviewing Global Grid Energy, a European utility with above-average emissions<\/p><p>relative to sector peers. Although the company has pledged a 30% reduction in Scope 1 and 2<\/p><p>emissions by 2030, its CO<sub>2<\/sub> intensity remains 40% above the regional benchmark. A pending EU<\/p><p>regulatory shift is expected to impose a €45/tonne carbon tax. Jane estimates this could<\/p><p>significantly impact Global Grid’s short-term free cash flow and is concerned about the<\/p><p>company’s pace of transition to cleaner energy sources.<\/p><p>Next, Bailey evaluates Orbis Technologies, a U.S.-based social media firm. While financially<\/p><p>strong, Orbis has raised red flags around governance practices. The founder retains 70% voting<\/p><p>power through a dual-class share structure, and the board has only 33% independent members.<\/p><p>WC’s internal cost of equity model applies a governance risk premium to firms exhibiting weak<\/p><p>shareholder rights, and Jane must determine the appropriate adjustment.<\/p><p>Bailey also reviews Safe Harvest Foods, an agricultural conglomerate with global supply chains.<\/p><p>Recent reports suggest that the company sources raw materials from suppliers using<\/p><p>questionable labor practices. WC’s ESG integration framework emphasizes supply chain due<\/p><p>diligence under the social pillar. Bailey collaborates with ESG analyst Raj Mehta to quantify<\/p><p>potential expense implications if Safe Harvest implements more stringent vendor audits,<\/p><p>training, and traceability programs.<\/p><p>Finally, during the firm’s stewardship strategy meeting, Bailey discusses engagement strategies<\/p><p>for Global Grid. Analyst Priya Kapoor recommends directly engaging with management on<\/p><p>emissions targets, while another colleague suggests divestment. Bailey reminds the team that<\/p><p>WC’s stewardship policy emphasizes proactive engagement and shareholder proposals as<\/p><p>preferred levers for ESG improvement, especially in cases with a credible transition plan.<\/p><\/div><\/details><div class=\"qtext\"><p>What adjustment is most accurate when incorporating Orbis Technologies’ governance structure into its cost of equity?<\/p><\/div>", "subj": "corporate"}, {"n": 75, "q": "Which approach is most accurate for integrating Safe Harvest Foods’ supply chain risk into its valuation model?", "opts": ["Increase the cost of equity to reflect ESG risk", "Model explicit supplier-compliance costs in operating expenses", "Reduce revenue projections due to reputational damage"], "ans": "B", "expl": "Safe Harvest Foods faces supply chain-related ESG risks, specifically, questionable labor practices among its suppliers and potential need for vendor audits, worker training, and traceability programs. These risks fall under the “Social” pillar of ESG and are operational in nature, meaning they are best captured as direct costs in the cash flow forecast. By explicitly modeling these costs in operating expenses, the analyst translates qualitative ESG risks into quantifiable financial impacts, which is a core principle of ESG integration. A is incorrect. While governance issues or uncertain regulatory risks may justify adjustments to the cost of equity, this situation involves known, estimable operating costs. Raising the cost of equity is a blunt tool that applies a generalized risk premium across the valuation, rather than isolating the actual cash impact. Moreover, increasing the cost of equity affects the entire valuation disproportionately and may lead to double-counting risk if costs are also modeled elsewhere. C is incorrect. Reputational damage is a potential consequence of ESG failure, but in this case, there’s no indication that Safe Harvest has already suffered revenue loss. The firm is still evaluating compliance improvements, meaning the issue is preventative rather than reactive. Lowering revenue is assumed to have a material impact on brand or customer trust, which is not yet evident or quantifiable from the case. Adjusting revenue also lacks the granularity and transparency of modeling operating cost changes.", "explhtml": "<p>Safe Harvest Foods faces supply chain-related ESG risks, specifically, questionable labor practices among its suppliers and potential need for vendor audits, worker training, and traceability programs. These risks fall under the “Social” pillar of ESG and are operational in nature, meaning they are best captured as direct costs in the cash flow forecast. By explicitly modeling these costs in operating expenses, the analyst translates qualitative ESG risks into quantifiable financial impacts, which is a core principle of ESG integration.<\/p><p><b>A is incorrect.<\/b> While governance issues or uncertain regulatory risks may justify adjustments to the cost of equity, this situation involves known, estimable operating costs. Raising the cost of equity is a blunt tool that applies a generalized risk premium across the valuation, rather than isolating the actual cash impact. Moreover, increasing the cost of equity affects the entire valuation disproportionately and may lead to double-counting risk if costs are also modeled elsewhere.<\/p><p><b>C is incorrect.<\/b> Reputational damage is a potential consequence of ESG failure, but in this case, there’s no indication that Safe Harvest has already suffered revenue loss. The firm is still evaluating compliance improvements, meaning the issue is preventative rather than reactive. Lowering revenue is assumed to have a material impact on brand or customer trust, which is not yet evident or quantifiable from the case. Adjusting revenue also lacks the granularity and transparency of modeling operating cost changes.<\/p><p class=\"los\">Corporate Issuers, Learning Module 2: Environmental, Social, and Governance (ESG) Considerations in Investment Analysis, LOS (A): Evaluate the effectiveness of a company’s corporate governance policies and practices.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 73–76 · Jane Bailey<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jane Bailey, CFA, is a senior portfolio manager at Westborough Capital Ltd. (WC), a $2.5 billion<\/p><p>asset manager specializing in global equity markets. WC’s investment strategy incorporates ESG<\/p><p>considerations throughout the security selection and valuation process. Jane chairs the ESG<\/p><p>Integration Committee and recently began reviewing three companies under consideration for<\/p><p>inclusion in the firm’s ESG-titled portfolio.<\/p><p>Bailey begins by reviewing Global Grid Energy, a European utility with above-average emissions<\/p><p>relative to sector peers. Although the company has pledged a 30% reduction in Scope 1 and 2<\/p><p>emissions by 2030, its CO<sub>2<\/sub> intensity remains 40% above the regional benchmark. A pending EU<\/p><p>regulatory shift is expected to impose a €45/tonne carbon tax. Jane estimates this could<\/p><p>significantly impact Global Grid’s short-term free cash flow and is concerned about the<\/p><p>company’s pace of transition to cleaner energy sources.<\/p><p>Next, Bailey evaluates Orbis Technologies, a U.S.-based social media firm. While financially<\/p><p>strong, Orbis has raised red flags around governance practices. The founder retains 70% voting<\/p><p>power through a dual-class share structure, and the board has only 33% independent members.<\/p><p>WC’s internal cost of equity model applies a governance risk premium to firms exhibiting weak<\/p><p>shareholder rights, and Jane must determine the appropriate adjustment.<\/p><p>Bailey also reviews Safe Harvest Foods, an agricultural conglomerate with global supply chains.<\/p><p>Recent reports suggest that the company sources raw materials from suppliers using<\/p><p>questionable labor practices. WC’s ESG integration framework emphasizes supply chain due<\/p><p>diligence under the social pillar. Bailey collaborates with ESG analyst Raj Mehta to quantify<\/p><p>potential expense implications if Safe Harvest implements more stringent vendor audits,<\/p><p>training, and traceability programs.<\/p><p>Finally, during the firm’s stewardship strategy meeting, Bailey discusses engagement strategies<\/p><p>for Global Grid. Analyst Priya Kapoor recommends directly engaging with management on<\/p><p>emissions targets, while another colleague suggests divestment. Bailey reminds the team that<\/p><p>WC’s stewardship policy emphasizes proactive engagement and shareholder proposals as<\/p><p>preferred levers for ESG improvement, especially in cases with a credible transition plan.<\/p><\/div><\/details><div class=\"qtext\"><p>Which approach is most accurate for integrating Safe Harvest Foods’ supply chain risk into its valuation model?<\/p><\/div>", "subj": "corporate"}, {"n": 76, "q": "Which stewardship action is most likely to drive Global Grid Energy’s emissions reduction?", "opts": ["Engage directly with management on carbon targets.", "File a shareholder resolution demanding enhanced emissions reporting.", "Sell all shares in Global Grid"], "ans": "A", "expl": "Direct engagement is widely regarded as the most effective form of ESG stewardship when the goal is to drive strategic and operational change, particularly for environmental issues like carbon emissions. This approach enables Westborough Capital to initiate targeted conversations with Global Grid’s leadership about emissions goals, set measurable, time-bound objectives for emissions reduction (e.g., Scope 1 & 2 targets), monitor and influence the company’s transition to cleaner energy sources and offer support or feedback as new policies or investments are considered. B is incorrect. While a shareholder resolution is a powerful mechanism to increase transparency, it is still indirect compared to active engagement. Filing a resolution may improve disclosures and reporting standards. However, reporting improvements alone does not guarantee emissions reductions. They can provide better oversight, but they do not ensure operational change. C is incorrect. Divestment removes Westborough Capital’s stakeholder position, effectively silencing its influence over corporate decisions. While selling shares may send a signal to the market, it does not exert any internal pressure on Global Grid to change behavior.", "explhtml": "<p>Direct engagement is widely regarded as the most effective form of ESG stewardship when the goal is to drive strategic and operational change, particularly for environmental issues like carbon emissions. This approach enables Westborough Capital to initiate targeted conversations with Global Grid’s leadership about emissions goals, set measurable, time-bound objectives for emissions reduction (e.g., Scope 1 &amp; 2 targets), monitor and influence the company’s transition to cleaner energy sources and offer support or feedback as new policies or investments are considered.<\/p><p><b>B is incorrect.<\/b> While a shareholder resolution is a powerful mechanism to increase transparency, it is still indirect compared to active engagement. Filing a resolution may improve disclosures and reporting standards. However, reporting improvements alone does not guarantee emissions reductions. They can provide better oversight, but they do not ensure operational change.<\/p><p><b>C is incorrect.<\/b> Divestment removes Westborough Capital’s stakeholder position, effectively silencing its influence over corporate decisions. While selling shares may send a signal to the market, it does not exert any internal pressure on Global Grid to change behavior.<\/p><p class=\"los\">Corporate Issuers, Learning Module 2: Environmental, Social, and Governance (ESG) Considerations in Investment Analysis, LOS (A): Evaluate the effectiveness of a company’s corporate governance policies and practices.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 73–76 · Jane Bailey<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jane Bailey, CFA, is a senior portfolio manager at Westborough Capital Ltd. (WC), a $2.5 billion<\/p><p>asset manager specializing in global equity markets. WC’s investment strategy incorporates ESG<\/p><p>considerations throughout the security selection and valuation process. Jane chairs the ESG<\/p><p>Integration Committee and recently began reviewing three companies under consideration for<\/p><p>inclusion in the firm’s ESG-titled portfolio.<\/p><p>Bailey begins by reviewing Global Grid Energy, a European utility with above-average emissions<\/p><p>relative to sector peers. Although the company has pledged a 30% reduction in Scope 1 and 2<\/p><p>emissions by 2030, its CO<sub>2<\/sub> intensity remains 40% above the regional benchmark. A pending EU<\/p><p>regulatory shift is expected to impose a €45/tonne carbon tax. Jane estimates this could<\/p><p>significantly impact Global Grid’s short-term free cash flow and is concerned about the<\/p><p>company’s pace of transition to cleaner energy sources.<\/p><p>Next, Bailey evaluates Orbis Technologies, a U.S.-based social media firm. While financially<\/p><p>strong, Orbis has raised red flags around governance practices. The founder retains 70% voting<\/p><p>power through a dual-class share structure, and the board has only 33% independent members.<\/p><p>WC’s internal cost of equity model applies a governance risk premium to firms exhibiting weak<\/p><p>shareholder rights, and Jane must determine the appropriate adjustment.<\/p><p>Bailey also reviews Safe Harvest Foods, an agricultural conglomerate with global supply chains.<\/p><p>Recent reports suggest that the company sources raw materials from suppliers using<\/p><p>questionable labor practices. WC’s ESG integration framework emphasizes supply chain due<\/p><p>diligence under the social pillar. Bailey collaborates with ESG analyst Raj Mehta to quantify<\/p><p>potential expense implications if Safe Harvest implements more stringent vendor audits,<\/p><p>training, and traceability programs.<\/p><p>Finally, during the firm’s stewardship strategy meeting, Bailey discusses engagement strategies<\/p><p>for Global Grid. Analyst Priya Kapoor recommends directly engaging with management on<\/p><p>emissions targets, while another colleague suggests divestment. Bailey reminds the team that<\/p><p>WC’s stewardship policy emphasizes proactive engagement and shareholder proposals as<\/p><p>preferred levers for ESG improvement, especially in cases with a credible transition plan.<\/p><\/div><\/details><div class=\"qtext\"><p>Which stewardship action is most likely to drive Global Grid Energy’s emissions reduction?<\/p><\/div>", "subj": "corporate"}, {"n": 77, "q": "Regarding Dubois' question, is Braunstein most likely incorrect regarding?", "opts": ["Statement 1.", "Statement 2.", "Statement 3."], "ans": "A", "expl": "Statement 1 is incorrect because it misstates the rights of non-cumulative preferred stock. Under standard definitions: Cumulative preferred shareholders are entitled to any missed (“in arrears”) dividends before common shareholders receive a payment. Non-cumulative preferred shareholders, however, forfeit any dividends not declared in a given period, they do not carry those missed dividends forward, and ordinary dividends may resume without first “making up” the skipped preferred payments. Braunstein’s claim that non-cumulative preferred prevents the reinstatement of ordinary dividends unless preferred dividends are paid is backwards. Non-cumulatives give the issuer no obligation to pay skipped dividends before paying ordinary dividends. It is also a bottom-up approach. B is incorrect. A higher corporate tax rate magnifies the benefit of debt’s tax-deductible interest expense, lowering the after-tax cost of debt and thus reducing overall WACC. C is incorrect. It is a top-down, market-based view. Greater availability (supply) of capital typically drives down its price, leading to a lower cost of capital and more issuer-friendly terms.", "explhtml": "<p>Statement 1 is incorrect because it misstates the rights of non-cumulative preferred stock. Under standard definitions:<\/p><p>Cumulative preferred shareholders are entitled to any missed (“in arrears”) dividends before common shareholders receive a payment.<\/p><p>Non-cumulative preferred shareholders, however, forfeit any dividends not declared in a given period, they do not carry those missed dividends forward, and ordinary dividends may resume without first “making up” the skipped preferred payments.<\/p><p>Braunstein’s claim that non-cumulative preferred prevents the reinstatement of ordinary dividends unless preferred dividends are paid is backwards. Non-cumulatives give the issuer no obligation to pay skipped dividends before paying ordinary dividends. It is also a bottom-up approach.<\/p><p><b>B is incorrect.<\/b> A higher corporate tax rate magnifies the benefit of debt’s tax-deductible interest expense, lowering the after-tax cost of debt and thus reducing overall WACC.<\/p><p><b>C is incorrect.<\/b> It is a top-down, market-based view. Greater availability (supply) of capital typically drives down its price, leading to a lower cost of capital and more issuer-friendly terms.<\/p><p class=\"los\">Corporate Issuers, Learning Module 3: Cost of Capital: Advanced Topics, LOS 3(a) Explain top-down and bottom-up factors that impact the cost of capital.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 77–80 · Ed Braunstein<\/summary><div class=\"vig-body\"><p>Ed Braunstein is a senior analyst at Kleinstein Group, a corporate finance specialist firm based in<\/p><p>Austria. Braunstein meets with his colleague, Marrisa Dubois, to discuss a potential merger<\/p><p>between Midas, a motor vehicle manufacturer, and Sigma, a motor vehicle engine manufacturer.<\/p><p>Sigma is listed on the London Stock Exchange, while Midas is a family-owned business based in<\/p><p>Germany. Sigma is looking to finance the transaction using equity. Dubois asked Braunstein,<\/p><p>“Which top-down factors would affect Sigma’s cost of capital?” to which Braunstein responded,<\/p><p>Statement 1: Cumulative preferred stock investors are paid any missed dividends before they are<\/p><p>paid to common shareholders. Non-cumulative preferred stock only requires that dividends to<\/p><p>common shareholders cannot be reinstated unless the preferred stock is being paid.<\/p><p>Statement 2: A company with a higher income tax rate will likely experience greater tax benefits<\/p><p>by using debt in its capital structure.<\/p><p>Statement 3: The availability of more capital will lead to lower costs of capital and more<\/p><p>favorable terms for corporate issuers.<\/p><p>Dubois prepares data on the common-size balance sheet and other selected information for both<\/p><p>companies, which she presents in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0121.webp\" style=\"max-width:min(100%,386px)\" alt=\"Exhibit 1: Common Size Balance Sheet Data Sigma Midas Pro
