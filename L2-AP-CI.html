ates potential conflicts and disruptions that could arise from local opposition. This inclusive approach is likely to enhance the company&#x27;s social license to operate, which is crucial in sectors like natural resources where environmental and social governance (ESG) factors significantly influence investor decisions. Furthermore, the presence of independent directors who represent diverse interests can lead to more balanced and prudent decision-making, reducing governance-related risks. These factors collectively contribute to a decrease in the perceived risk among investors, as they can see that the company is actively managing social and governance challenges.<\/p><p><b>A is incorrect<\/b>. Increasing the representation of Indigenous communities and independent directors on the board is generally perceived as a positive step towards better governance and community relations. This approach tends to reduce conflicts and enhances the company&#x27;s reputation, which are factors that lower the perceived risk among investors.<\/p><p><b>C is incorrect<\/b>. It is unlikely that investors&#x27; perception of the corporation&#x27;s risk remains unchanged when the company takes significant steps towards improving governance and community relations. The inclusion of Indigenous communities and independent directors is not a neutral action; it actively enhances the company&#x27;s governance structure and community engagement. These changes are typically viewed favorably by investors who are increasingly focusing on ESG factors as critical components of their investment decisions. <\/p><p class=\"los\">Corporate Issuers, Learning Module 2:Environmental, Social and Governance (ESG) Considerations in Investment Analysis, LOS 2(a): Describe global variations in ownership structures and the possible effects of these variations on corporate governance policies and practices.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Henry Paul<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Henry Paul is an Investment banker working for a large global bank. Currently, he is analyzing<\/p><p>the Canadian liquified natural gas (LNG) market to structure a deal for one of the bank&#x27;s clients,<\/p><p>Highmark Petroleum, which wants to invest in expanding its energy projects in Canada.<\/p><p>Highmark is a listed state-owned entity, partially owned by the Canadian government, with<\/p><p>shares also traded on the Toronto Stock Exchange. The company has a one-tier board structure,<\/p><p>with the CEO serving as the board&#x27;s chair. The provincial government of British Columbia<\/p><p>nominates the CEO and the majority of the executive directors. The executive directors have<\/p><p>served on the board for an average of 15 years.<\/p><p>While Canada has had large gas reserves for some time, Paul&#x27;s analysis of the global LNG market<\/p><p>suggests these resources may now be available for export, especially since the rise of shale gas<\/p><p>production south of the border has curtailed sales into the US. The key question has always been<\/p><p>whether their development could be done cost-effectively to allow Canadian LNG to compete<\/p><p>with emerging supplies from the rest of the world. The recent decision by Highmark and its<\/p><p>partners to invest in the LNG Canada project has underscored that they, at the very least, believe<\/p><p>the prospects are favorable in British Columbia, based on low upstream costs and the resolution<\/p><p>of numerous midstream and regulatory issues.<\/p><p>Canadian historians know that many of Canada’s Indigenous peoples have, at times, been treated<\/p><p>highly unfairly — their culture and way of life denigrated and disregarded. Many Indigenous<\/p><p>communities in Canada face a lack of economic opportunity in their communities. For example,<\/p><p>poor access to essential services such as clean water and social problems relating to crime and<\/p><p>addiction occur at alarmingly higher rates than national averages. LNG development offers these<\/p><p>mostly remote communities meaningful and sizable opportunities for local employment,<\/p><p>infrastructure development, a boost to entrepreneurship, specialized skill development, and<\/p><p>cultural preservation. Although many contractors and suppliers to major resource projects in<\/p><p>Canada today are Indigenous-owned, Indigenous communities now seek representation on<\/p><p>corporate boards to participate in development decisions affecting their regions. A series of<\/p><p>Supreme Court cases has progressively sought to define this trend.<\/p><p>Research shows Canadian ESG proponents to be trailblazers in reducing liquefaction emissions.<\/p><p>LNG plants in Canada are designed to be 32% more efficient than the world&#x27;s current lowest-<\/p><p>emitting plant. Greater emission reductions would result from plans to power LNG plants with<\/p><p>electric motors using hydroelectricity – the newly sanctioned hydroelectric-driven LNG plant will<\/p><p>emit significantly fewer emissions. However, the plant is not considered world-scale. The IEA<\/p><p>estimates that this electric “cleaner” LNG generates a 40% reduction in GHG emissions from<\/p><p>coal-to-gas switching, compared to only a 30% reduction with industry-standard gas turbine-<\/p><p>powered LNG plants.<\/p><\/div><\/details><div class=\"qtext\"><p>Granting Indigenous communities board representation as independent directors will most likely:<\/p><\/div>", "subj": "corporate"}, {"n": 12, "q": "Which of the following is least likely to be a disadvantage for Highmark if Henry Paul recommends issuing green bonds for financing the LNG project?", "opts": ["Additional costs related to the monitoring and reporting on the use of proceeds.", "Reduced liquidity due to securities being held by buy-and-hold investors.", "Trading at a lower yield than comparable conventional bonds."], "ans": "C", "expl": "Green bonds typically command a premium over comparable conventional bonds, which is considered an advantage rather than a disadvantage. This premium, often referred to as a \"greenium,\" arises because green bonds attract investors who are specifically interested in funding projects with environmental benefits. These investors are sometimes willing to accept a lower yield in exchange for the environmental attributes associated with green bonds, thereby driving up the price of these bonds. For Highmark Petroleum, issuing green bonds could potentially reduce borrowing costs compared to conventional bonds, as demand driven by socially responsible investors can lead to more favorable terms. Furthermore, the premium pricing of green bonds reflects a positive market perception, which can enhance Highmark's reputation in financial markets as a sustainable company committed to environmental stewardship. A is incorrect. While it is true that issuing green bonds can lead to additional costs related to the monitoring and reporting on the use of proceeds, this is indeed a disadvantage. These costs are incurred because issuers of green bonds must provide transparency on how the funds are being used, ensuring they are allocated towards their intended green projects. This often involves third-party verification and regular reporting to bondholders, which can add to the administrative burden and overall cost of the bond issuance. However, these costs are typically considered a necessary investment to access the green bond market and its associated benefits, such as potentially lower interest rates and positive branding. B is incorrect. The lack of liquidity when securities are purchased and held by buy-and-hold investors can be a disadvantage of issuing green bonds. Buy-and-hold investors, who are attracted to green bonds due to their environmental impact, may hold onto these bonds until maturity. This long-term holding reduces the secondary market liquidity of the bonds, potentially making it more difficult to trade them and affecting their price volatility. However, this characteristic is a common feature of the bond market where many institutional investors hold bonds as a stable, long-term investment, regardless of whether they are green or conventional. The specific mention of liquidity as a disadvantage in this context is accurate, as it can impact the flexibility and pricing of the bonds in the secondary market. ", "explhtml": "<p>Green bonds typically command a premium over comparable conventional bonds, which is considered an advantage rather than a disadvantage. This premium, often referred to as a &quot;greenium,&quot; arises because green bonds attract investors who are specifically interested in funding projects with environmental benefits. These investors are sometimes willing to accept a lower yield in exchange for the environmental attributes associated with green bonds, thereby driving up the price of these bonds. For Highmark Petroleum, issuing green bonds could potentially reduce borrowing costs compared to conventional bonds, as demand driven by socially responsible investors can lead to more favorable terms. Furthermore, the premium pricing of green bonds reflects a positive market perception, which can enhance Highmark&#x27;s reputation in financial markets as a sustainable company committed to environmental stewardship.<\/p><p><b>A is incorrect.<\/b> While it is true that issuing green bonds can lead to additional costs related to the monitoring and reporting on the use of proceeds, this is indeed a disadvantage. These costs are incurred because issuers of green bonds must provide transparency on how the funds are being used, ensuring they are allocated towards their intended green projects. This often involves third-party verification and regular reporting to bondholders, which can add to the administrative burden and overall cost of the bond issuance. However, these costs are typically considered a necessary investment to access the green bond market and its associated benefits, such as potentially lower interest rates and positive branding.<\/p><p><b>B is incorrect.<\/b> The lack of liquidity when securities are purchased and held by buy-and-hold investors can be a disadvantage of issuing green bonds. Buy-and-hold investors, who are attracted to green bonds due to their environmental impact, may hold onto these bonds until maturity. This long-term holding reduces the secondary market liquidity of the bonds, potentially making it more difficult to trade them and affecting their price volatility. However, this characteristic is a common feature of the bond market where many institutional investors hold bonds as a stable, long-term investment, regardless of whether they are green or conventional. The specific mention of liquidity as a disadvantage in this context is accurate, as it can impact the flexibility and pricing of the bonds in the secondary market. <\/p><p class=\"los\">Corporate Issuers, Learning Module 2:Environmental, Social and Governance (ESG) Considerations in Investment Analysis, LOS 2(d): Evaluate ESG risk exposures and investment opportunities related to a company.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Henry Paul<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Henry Paul is an Investment banker working for a large global bank. Currently, he is analyzing<\/p><p>the Canadian liquified natural gas (LNG) market to structure a deal for one of the bank&#x27;s clients,<\/p><p>Highmark Petroleum, which wants to invest in expanding its energy projects in Canada.<\/p><p>Highmark is a listed state-owned entity, partially owned by the Canadian government, with<\/p><p>shares also traded on the Toronto Stock Exchange. The company has a one-tier board structure,<\/p><p>with the CEO serving as the board&#x27;s chair. The provincial government of British Columbia<\/p><p>nominates the CEO and the majority of the executive directors. The executive directors have<\/p><p>served on the board for an average of 15 years.<\/p><p>While Canada has had large gas reserves for some time, Paul&#x27;s analysis of the global LNG market<\/p><p>suggests these resources may now be available for export, especially since the rise of shale gas<\/p><p>production south of the border has curtailed sales into the US. The key question has always been<\/p><p>whether their development could be done cost-effectively to allow Canadian LNG to compete<\/p><p>with emerging supplies from the rest of the world. The recent decision by Highmark and its<\/p><p>partners to invest in the LNG Canada project has underscored that they, at the very least, believe<\/p><p>the prospects are favorable in British Columbia, based on low upstream costs and the resolution<\/p><p>of numerous midstream and regulatory issues.<\/p><p>Canadian historians know that many of Canada’s Indigenous peoples have, at times, been treated<\/p><p>highly unfairly — their culture and way of life denigrated and disregarded. Many Indigenous<\/p><p>communities in Canada face a lack of economic opportunity in their communities. For example,<\/p><p>poor access to essential services such as clean water and social problems relating to crime and<\/p><p>addiction occur at alarmingly higher rates than national averages. LNG development offers these<\/p><p>mostly remote communities meaningful and sizable opportunities for local employment,<\/p><p>infrastructure development, a boost to entrepreneurship, specialized skill development, and<\/p><p>cultural preservation. Although many contractors and suppliers to major resource projects in<\/p><p>Canada today are Indigenous-owned, Indigenous communities now seek representation on<\/p><p>corporate boards to participate in development decisions affecting their regions. A series of<\/p><p>Supreme Court cases has progressively sought to define this trend.<\/p><p>Research shows Canadian ESG proponents to be trailblazers in reducing liquefaction emissions.<\/p><p>LNG plants in Canada are designed to be 32% more efficient than the world&#x27;s current lowest-<\/p><p>emitting plant. Greater emission reductions would result from plans to power LNG plants with<\/p><p>electric motors using hydroelectricity – the newly sanctioned hydroelectric-driven LNG plant will<\/p><p>emit significantly fewer emissions. However, the plant is not considered world-scale. The IEA<\/p><p>estimates that this electric “cleaner” LNG generates a 40% reduction in GHG emissions from<\/p><p>coal-to-gas switching, compared to only a 30% reduction with industry-standard gas turbine-<\/p><p>powered LNG plants.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following is least likely to be a disadvantage for Highmark if Henry Paul recommends issuing green bonds for financing the LNG project?<\/p><\/div>", "subj": "corporate"}, {"n": 13, "q": "Given the current capital structure, Kyoto’s cost of debt is closest to:", "opts": ["0.0627.", "0.0622.", "0.0589."], "ans": "A", "expl": "To determine this, we utilize matrix pricing, a method that helps estimate the yield to maturity (YTM) of a bond that lacks a reliable market YTM by comparing it to similar bonds with known YTMs. In this case, we analyze four bonds with the same BBB credit rating and varying coupon rates and maturities. By calculating the YTM for each bond based on its market price and coupon payments, we can interpolate to find the YTM for a bond with a 7-year maturity, which matches Kyoto's debt profile. The average YTM for each maturity: Use linear interpolation to estimate the average YTMs B is incorrect. It suggests a cost of debt of 6.22%, which is closer to the average YTM for bonds with a 4-year maturity. This figure does not accurately reflect the cost of debt for a 7-year maturity, as it does not account for the interpolation needed between the 4-year and 8-year maturity YTMs. The calculation for a 7-year maturity specifically yields a lower rate, as demonstrated in the detailed interpolation process, which averages and adjusts the YTMs based on the length of maturity. C is incorrect. It proposes a cost of debt of 5.89%, which aligns more closely with the average YTM for bonds with an 8-year maturity. This figure, while close, does not precisely represent the cost of debt for a 7-year maturity. The interpolation process shows a slight increase in the YTM as the maturity decreases from 8 years to 7 years, resulting in a final estimate of 5.95%. Thus, using the 8-year maturity YTM directly for a 7-year debt estimation does not provide the most accurate result.", "explhtml": "<p>To determine this, we utilize matrix pricing, a method that helps estimate the yield to maturity (YTM) of a bond that lacks a reliable market YTM by comparing it to similar bonds with known YTMs. In this case, we analyze four bonds with the same BBB credit rating and varying coupon rates and maturities. By calculating the YTM for each bond based on its market price and coupon payments, we can interpolate to find the YTM for a bond with a 7-year maturity, which matches Kyoto&#x27;s debt profile.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0019.webp\" style=\"max-width:min(100%,173px)\" alt=\"7 Bond A = = 0.07 100\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0020.webp\" style=\"max-width:min(100%,18px)\" alt=\"6\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0021.webp\" style=\"max-width:min(100%,205px)\" alt=\"Bond B = 6 = 0.0585 102.6 Bond C = 5 = 0.0508 98.5 Bond D = 8 = 0.0735 108.9\"><p>The average YTM for each maturity:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0022.webp\" style=\"max-width:min(100%,346px)\" alt=\"0.07 + 0.0585  4 year maturities = = 0.0643 2 0.0508 + 0.0735  8 year maturities = = 0.0622 2\"><p>Use linear interpolation to estimate the average YTMs<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0023.webp\" style=\"max-width:min(100%,466px)\" alt=\"YTM_Year 7 = YTM_4Year + YTM_8Year × 7 −4 8 −4 7 −4 YTM_Year 7 = 0.0643 + (0.0622 −0.0643) × = 0.0627 8 −4\"><p><b>B is incorrect<\/b>. It suggests a cost of debt of 6.22%, which is closer to the average YTM for bonds with a 4-year maturity. This figure does not accurately reflect the cost of debt for a 7-year maturity, as it does not account for the interpolation needed between the 4-year and 8-year maturity YTMs. The calculation for a 7-year maturity specifically yields a lower rate, as demonstrated in the detailed interpolation process, which averages and adjusts the YTMs based on the length of maturity.<\/p><p><b>C is incorrect<\/b>. It proposes a cost of debt of 5.89%, which aligns more closely with the average YTM for bonds with an 8-year maturity. This figure, while close, does not precisely represent the cost of debt for a 7-year maturity. The interpolation process shows a slight increase in the YTM as the maturity decreases from 8 years to 7 years, resulting in a final estimate of 5.95%. Thus, using the 8-year maturity YTM directly for a 7-year debt estimation does not provide the most accurate result.<\/p><p class=\"los\">Corporate Issuers, Learning Module 3: Cost of Capital: Advanced Topics, LOS 3 (b) Compare methods used to estimate the cost of debt<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Giuseppe Mancini<\/summary><div class=\"vig-body\"><p>Giuseppe Mancini is a junior analyst working for the Orion Investment Group. Giuseppe has had<\/p><p>several meetings with his manager to discuss a possible investment in Kyoto Pharmaceuticals.<\/p><p>Following the discussions, Giuseppe has been asked to estimate Kyoto’s cost of equity and debt<\/p><p>in a bid to determine Kyoto’s valuation and WACC. He managed to gather the following crucial<\/p><p>information about Kyoto.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0015.webp\" style=\"max-width:min(100%,606px)\" alt=\"Company: Large-cap, publicly traded company Kyoto Pharmaceuticals Business Model Manufacture of cancer and diabetes medication. Has high research and development costs. Industry Pharmaceuticals Revenues, Earnings, Cash flows Revenues have been upward, but most of the earnings and cash flows have bee\"><p>Kyoto has had a robust financial performance in terms of profitability and sales. Three years<\/p><p>back, the company made plans to set up an insulin manufacturing plant. Kyoto issued<\/p><p>redeemable preferred stock to finance this project, which came at a high cost. Recent financial<\/p><p>filings show that Kyoto will issue new unsecured debt to retire the preferred shares at par value.<\/p><p>Kyoto’s capital structure is shown in Exhibit 1 below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0016.webp\" style=\"max-width:min(100%,544px)\" alt=\"Exhibit 1: Kyoto’s Current Capital Structure and Related Information. Capital Type Capital Selected Capital Structure Type Information Debt 20% A single debt issue @ 7% coupon rate with seven years left to maturity, paid semiannually —unsecured debt with a BBB credit rating but no available YTM. Com\"><p>Giuseppe also gathered information on four liquid, semiannual-pay corporate bonds with the<\/p><p>same credit rating as Kyoto. The data is presented in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0017.webp\" style=\"max-width:min(100%,424px)\" alt=\"Exhibit 2: Information on BBB-Rated Bonds Current Price Coupon Rate Remaining (per 100 of par Maturity value) Bond A 100 7% 4 years Bond B 102.6 6% 4 years Bond C 98.5 5% 8 years Bond D 108.9 8% 8 years\"><p>Using the Fama-French five-factor (FF5) model and the CAPM, Giuseppe estimates Kyoto’s<\/p><p>equity cost by regressing Kyoto’s excess returns on risk factors with data from the most recent<\/p><p>60 months of returns. He uses the 20-year government benchmark rate of 3.5% as the risk-free<\/p><p>proxy. Exhibit 3 contains information on factor betas along with estimated factor risk premiums.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0018.webp\" style=\"max-width:min(100%,568px)\" alt=\"Exhibit 3: FF5 and CAPM Factor Beta and Risk Premiums Factor Factor Beta Risk Premium CAPM Factor Betas and Risk Premiums Market (ERP) 0.85 4.8% FF5 Factor Betas and Risk Premiums Market (ERP) 0.81 4.8% Size (SMB) 0.5 2% Value (HML) 0.2 4% Profitability (RMW) −0.16 2.9% Investment (CMA) 0.32 3.9%\"><p>Using the BYPRP, Giuseppe estimates Kyoto’s cost of equity. He assumes a historical risk<\/p><p>premium of 5.8% earned by equity investors relative to long-term bond yields. Giuseppe prepares<\/p><p>and submits the report to his manager. The manager is curious about which criteria were used to<\/p><p>estimate the ERP of 4.8% in his cost of equity estimate. Giuseppe informs the manager that the<\/p><p>estimation was derived using the historical approach, electing to use the arithmetic mean and<\/p><p>the short-term government bill rate.<\/p><\/div><\/details><div class=\"qtext\"><p>Given the current capital structure, Kyoto’s cost of debt is closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 14, "q": "Kyoto’s Cost of common equity using the BYPRP model is closest to?", "opts": ["6.28%", "12.07%", "5.80%"], "ans": "B", "expl": "Calculates Kyoto's cost of common equity using the BYPRP model to be 12.07%. This calculation is derived from the formula for estimating the cost of equity, which is the sum of the cost of debt and the equity risk premium. In this case, the cost of debt (r_d) is given as 6.27% (Calculated in the previous question), and the equity risk premium (RP) is assumed to be 5.8%. Therefore, the cost of equity (r_e) can be calculated as follows: This calculation aligns with the fundamental principles of finance that the cost of equity for a company should reflect both the cost of borrowing (debt) and the additional risk premium demanded by equity investors for bearing the risk of the investment. A is incorrect. It suggests a cost of common equity of 6.28%, which appears to be a misunderstanding of the components that make up the cost of equity. The value 6.28% does not correspond to any direct calculation or relevant financial metric provided in the scenario. It is crucial to recognize that the cost of equity is not merely the cost of debt or any singular financial metric but a combination that includes the risk premium, which is significantly higher in this case. C is incorrect. It proposes a cost of common equity of 5.8%, which is actually just the equity risk premium component of the cost of equity calculation. This option fails to include the cost of debt, which is a critical element in the calculation of the cost of equity. The cost of equity cannot be equal to the risk premium alone, as it does not compensate for the base rate at which the company borrows, represented by the cost of debt.", "explhtml": "<p>Calculates Kyoto&#x27;s cost of common equity using the BYPRP model to be 12.07%. This calculation is derived from the formula for estimating the cost of equity, which is the sum of the cost of debt and the equity risk premium. In this case, the cost of debt (r_d) is given as 6.27% (Calculated in the previous question), and the equity risk premium (RP) is assumed to be 5.8%. Therefore, the cost of equity (r_e) can be calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0024.webp\" style=\"max-width:min(100%,310px)\" alt=\"re = rd + RP = 6.27% + 5.8% = 12.07%\"><p>This calculation aligns with the fundamental principles of finance that the cost of equity for a company should reflect both the cost of borrowing (debt) and the additional risk premium demanded by equity investors for bearing the risk of the investment.<\/p><p><b>A is incorrect<\/b>. It suggests a cost of common equity of 6.28%, which appears to be a misunderstanding of the components that make up the cost of equity. The value 6.28% does not correspond to any direct calculation or relevant financial metric provided in the scenario. It is crucial to recognize that the cost of equity is not merely the cost of debt or any singular financial metric but a combination that includes the risk premium, which is significantly higher in this case.<\/p><p><b>C is incorrect<\/b>. It proposes a cost of common equity of 5.8%, which is actually just the equity risk premium component of the cost of equity calculation. This option fails to include the cost of debt, which is a critical element in the calculation of the cost of equity. The cost of equity cannot be equal to the risk premium alone, as it does not compensate for the base rate at which the company borrows, represented by the cost of debt.<\/p><p class=\"los\">Corporate Issuers, Learning Module 3: Cost of Capital: Advanced Topics, LOS 3 (e) Estimate the cost of debt or required return on equity for a public company and a private company<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Giuseppe Mancini<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Giuseppe Mancini is a junior analyst working for the Orion Investment Group. Giuseppe has had<\/p><p>several meetings with his manager to discuss a possible investment in Kyoto Pharmaceuticals.<\/p><p>Following the discussions, Giuseppe has been asked to estimate Kyoto’s cost of equity and debt<\/p><p>in a bid to determine Kyoto’s valuation and WACC. He managed to gather the following crucial<\/p><p>information about Kyoto.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0015.webp\" style=\"max-width:min(100%,606px)\" alt=\"Company: Large-cap, publicly traded company Kyoto Pharmaceuticals Business Model Manufacture of cancer and diabetes medication. Has high research and development costs. Industry Pharmaceuticals Revenues, Earnings, Cash flows Revenues have been upward, but most of the earnings and cash flows have bee\"><p>Kyoto has had a robust financial performance in terms of profitability and sales. Three years<\/p><p>back, the company made plans to set up an insulin manufacturing plant. Kyoto issued<\/p><p>redeemable preferred stock to finance this project, which came at a high cost. Recent financial<\/p><p>filings show that Kyoto will issue new unsecured debt to retire the preferred shares at par value.<\/p><p>Kyoto’s capital structure is shown in Exhibit 1 below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0016.webp\" style=\"max-width:min(100%,544px)\" alt=\"Exhibit 1: Kyoto’s Current Capital Structure and Related Information. Capital Type Capital Selected Capital Structure Type Information Debt 20% A single debt issue @ 7% coupon rate with seven years left to maturity, paid semiannually —unsecured debt with a BBB credit rating but no available YTM. Com\"><p>Giuseppe also gathered information on four liquid, semiannual-pay corporate bonds with the<\/p><p>same credit rating as Kyoto. The data is presented in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0017.webp\" style=\"max-width:min(100%,424px)\" alt=\"Exhibit 2: Information on BBB-Rated Bonds Current Price Coupon Rate Remaining (per 100 of par Maturity value) Bond A 100 7% 4 years Bond B 102.6 6% 4 years Bond C 98.5 5% 8 years Bond D 108.9 8% 8 years\"><p>Using the Fama-French five-factor (FF5) model and the CAPM, Giuseppe estimates Kyoto’s<\/p><p>equity cost by regressing Kyoto’s excess returns on risk factors with data from the most recent<\/p><p>60 months of returns. He uses the 20-year government benchmark rate of 3.5% as the risk-free<\/p><p>proxy. Exhibit 3 contains information on factor betas along with estimated factor risk premiums.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0018.webp\" style=\"max-width:min(100%,568px)\" alt=\"Exhibit 3: FF5 and CAPM Factor Beta and Risk Premiums Factor Factor Beta Risk Premium CAPM Factor Betas and Risk Premiums Market (ERP) 0.85 4.8% FF5 Factor Betas and Risk Premiums Market (ERP) 0.81 4.8% Size (SMB) 0.5 2% Value (HML) 0.2 4% Profitability (RMW) −0.16 2.9% Investment (CMA) 0.32 3.9%\"><p>Using the BYPRP, Giuseppe estimates Kyoto’s cost of equity. He assumes a historical risk<\/p><p>premium of 5.8% earned by equity investors relative to long-term bond yields. Giuseppe prepares<\/p><p>and submits the report to his manager. The manager is curious about which criteria were used to<\/p><p>estimate the ERP of 4.8% in his cost of equity estimate. Giuseppe informs the manager that the<\/p><p>estimation was derived using the historical approach, electing to use the arithmetic mean and<\/p><p>the short-term government bill rate.<\/p><\/div><\/details><div class=\"qtext\"><p>Kyoto’s Cost of common equity using the BYPRP model is closest to?<\/p><\/div>", "subj": "corporate"}, {"n": 15, "q": "Which of the following is the least likely action that Kyoto’s management can take to lower the cost of issuing debt:", "opts": ["Issuing secured debt, secured by some property, plant, and equipment.", "Issuing debt with a put option.", "Issuing unsecured debt."], "ans": "C", "expl": "Issuing unsecured debt typically results in a higher cost of debt compared to issuing secured debt. This is because unsecured debt does not provide the same level of assurance to lenders as secured debt, which is backed by collateral. In the case of Kyoto Pharmaceuticals, securing debt with assets such as property, plant, and equipment could significantly lower the interest rates demanded by creditors, as it reduces their risk. Creditors perceive unsecured debt as riskier because, in the event of default, unsecured creditors are paid after secured creditors, thus increasing the likelihood of higher losses. Therefore, issuing unsecured debt, as mentioned in option C, would not be an effective strategy for lowering the cost of issuing debt. A is incorrect. Issuing secured debt, particularly when backed by tangible assets like property, plant, and equipment, generally results in a lower cost of debt. This is because the security offers a form of protection for the lenders, reducing their perceived risk. In the event of a default, secured lenders have the right to seize the collateral to recover their funds, thereby reducing the potential loss. This security allows lenders to offer lower interest rates, which directly translates to a lower cost of debt for the issuer. Thus, option A is a viable method to reduce the cost of issuing debt, making it an incorrect choice for the 'least likely' action to lower the cost. B is incorrect. Issuing debt with a put option can also be an attractive strategy to lower the cost of debt. A put option provides the bondholders the right, but not the obligation, to sell the bond back to the issuer at a predetermined price before maturity. This feature is particularly appealing in environments of rising interest rates or financial uncertainty, as it provides an added layer of security for the investors. The inclusion of a put option can make the bonds more attractive to investors, potentially allowing the issuer to lower the interest rate offered on the bonds. Therefore, this strategy can effectively reduce the cost of issuing debt, making option B incorrect for the 'least likely' action to lower the cost.", "explhtml": "<p>Issuing unsecured debt typically results in a higher cost of debt compared to issuing secured debt. This is because unsecured debt does not provide the same level of assurance to lenders as secured debt, which is backed by collateral. In the case of Kyoto Pharmaceuticals, securing debt with assets such as property, plant, and equipment could significantly lower the interest rates demanded by creditors, as it reduces their risk. Creditors perceive unsecured debt as riskier because, in the event of default, unsecured creditors are paid after secured creditors, thus increasing the likelihood of higher losses. Therefore, issuing unsecured debt, as mentioned in option C, would not be an effective strategy for lowering the cost of issuing debt.<\/p><p><b>A is incorrect<\/b>. Issuing secured debt, particularly when backed by tangible assets like property, plant, and equipment, generally results in a lower cost of debt. This is because the security offers a form of protection for the lenders, reducing their perceived risk. In the event of a default, secured lenders have the right to seize the collateral to recover their funds, thereby reducing the potential loss. This security allows lenders to offer lower interest rates, which directly translates to a lower cost of debt for the issuer. Thus, option A is a viable method to reduce the cost of issuing debt, making it an incorrect choice for the &#x27;least likely&#x27; action to lower the cost.<\/p><p><b>B is incorrect<\/b>. Issuing debt with a put option can also be an attractive strategy to lower the cost of debt. A put option provides the bondholders the right, but not the obligation, to sell the bond back to the issuer at a predetermined price before maturity. This feature is particularly appealing in environments of rising interest rates or financial uncertainty, as it provides an added layer of security for the investors. The inclusion of a put option can make the bonds more attractive to investors, potentially allowing the issuer to lower the interest rate offered on the bonds. Therefore, this strategy can effectively reduce the cost of issuing debt, making option B incorrect for the &#x27;least likely&#x27; action to lower the cost.<\/p><p class=\"los\">Corporate Issuers, Learning Module 3: Cost of Capital: Advanced Topics, LOS 3 (b) Compare methods used to estimate the cost of debt<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Giuseppe Mancini<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig olves the formula: Where: β is the beta of the stock, and ERP is the equity risk premium. From the provided data, the risk-free rate (rf) is 3.5% or 0.035 in decimal form, the beta (β) of Kyoto Pharmaceuticals is 0.85, and the equity risk premium (ERP) is 4.8% or 0.048 in decimal form. Plugging these values into the CAPM formula gives: This calculation shows that the cost of common equity for Kyoto Pharmaceuticals is 7.58%, which corresponds to option C. A is incorrect. Option A suggests a cost of common equity of 12.08%. This figure does not align with the CAPM calculation based on the given data. It is possible that this figure could have been derived using a different model or incorrect inputs. The CAPM model, which is specifically designed to estimate the expected return on equity based on systematic risk (beta), provides a clear and direct calculation using the risk-free rate, beta, and equity risk premium, leading to a result of 7.58%. B is incorrect. Option B indicates a cost of 6.28%, which is incorrect for the cost of common equity as calculated using the CAPM model. This figure might represent another financial metric, such as the cost of debt or another type of return calculation not relevant to the equity cost under CAPM. The CAPM calculation clearly results in a 7.58% equity cost, which is significantly different from 6.28%, confirming that option B does not represent the correct cost of common equity for Kyoto Pharmaceuticals.", "explhtml": "<p>The calculation of Kyoto&#x27;s cost of common equity using the Capital Asset Pricing Model (CAPM) involves the formula:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0025.webp\" style=\"max-width:min(100%,154px)\" alt=\"re = rf + β × (ERP)\"><p>Where:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0026.webp\" style=\"max-width:min(100%,218px)\" alt=\"re is the cost of equity, rf is the risk-free rate,\"><p>β is the beta of the stock, and<\/p><p>ERP is the equity risk premium.<\/p><p>From the provided data, the risk-free rate (r<sub>f<\/sub>) is 3.5% or 0.035 in decimal form, the beta (β) of Kyoto Pharmaceuticals is 0.85, and the equity risk premium (ERP) is 4.8% or 0.048 in decimal form. Plugging these values into the CAPM formula gives:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0027.webp\" style=\"max-width:min(100%,488px)\" alt=\"re = 0.035 + 0.85 × 0.048 = 0.035 + 0.0408 = 0.0758 or 7.58%\"><p>This calculation shows that the cost of common equity for Kyoto Pharmaceuticals is 7.58%, which corresponds to option C.<\/p><p><b>A is incorrect<\/b>. Option A suggests a cost of common equity of 12.08%. This figure does not align with the CAPM calculation based on the given data. It is possible that this figure could have been derived using a different model or incorrect inputs. The CAPM model, which is specifically designed to estimate the expected return on equity based on systematic risk (beta), provides a clear and direct calculation using the risk-free rate, beta, and equity risk premium, leading to a result of 7.58%.<\/p><p><b>B is incorrect<\/b>. Option B indicates a cost of 6.28%, which is incorrect for the cost of common equity as calculated using the CAPM model. This figure might represent another financial metric, such as the cost of debt or another type of return calculation not relevant to the equity cost under CAPM. The CAPM calculation clearly results in a 7.58% equity cost, which is significantly different from 6.28%, confirming that option B does not represent the correct cost of common equity for Kyoto Pharmaceuticals.<\/p><p class=\"los\">Corporate Issuers, Learning Module 3: Cost of Capital: Advanced Topics, LOS 3 (e) Estimate the cost of debt or required return on equity for a public company and a private company<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Giuseppe Mancini<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Giuseppe Mancini is a junior analyst working for the Orion Investment Group. Giuseppe has had<\/p><p>several meetings with his manager to discuss a possible investment in Kyoto Pharmaceuticals.<\/p><p>Following the discussions, Giuseppe has been asked to estimate Kyoto’s cost of equity and debt<\/p><p>in a bid to determine Kyoto’s valuation and WACC. He managed to gather the following crucial<\/p><p>information about Kyoto.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0015.webp\" style=\"max-width:min(100%,606px)\" alt=\"Company: Large-cap, publicly traded company Kyoto Pharmaceuticals Business Model Manufacture of cancer and diabetes medication. Has high research and development costs. Industry Pharmaceuticals Revenues, Earnings, Cash flows Revenues have been upward, but most of the earnings and cash flows have bee\"><p>Kyoto has had a robust financial performance in terms of profitability and sales. Three years<\/p><p>back, the company made plans to set up an insulin manufacturing plant. Kyoto issued<\/p><p>redeemable preferred stock to finance this project, which came at a high cost. Recent financial<\/p><p>filings show that Kyoto will issue new unsecured debt to retire the preferred shares at par value.<\/p><p>Kyoto’s capital structure is shown in Exhibit 1 below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0016.webp\" style=\"max-width:min(100%,544px)\" alt=\"Exhibit 1: Kyoto’s Current Capital Structure and Related Information. Capital Type Capital Selected Capital Structure Type Information Debt 20% A single debt issue @ 7% coupon rate with seven years left to maturity, paid semiannually —unsecured debt with a BBB credit rating but no available YTM. Com\"><p>Giuseppe also gathered information on four liquid, semiannual-pay corporate bonds with the<\/p><p>same credit rating as Kyoto. The data is presented in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0017.webp\" style=\"max-width:min(100%,424px)\" alt=\"Exhibit 2: Information on BBB-Rated Bonds Current Price Coupon Rate Remaining (per 100 of par Maturity value) Bond A 100 7% 4 years Bond B 102.6 6% 4 years Bond C 98.5 5% 8 years Bond D 108.9 8% 8 years\"><p>Using the Fama-French five-factor (FF5) model and the CAPM, Giuseppe estimates Kyoto’s<\/p><p>equity cost by regressing Kyoto’s excess returns on risk factors with data from the most recent<\/p><p>60 months of returns. He uses the 20-year government benchmark rate of 3.5% as the risk-free<\/p><p>proxy. Exhibit 3 contains information on factor betas along with estimated factor risk premiums.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0018.webp\" style=\"max-width:min(100%,568px)\" alt=\"Exhibit 3: FF5 and CAPM Factor Beta and Risk Premiums Factor Factor Beta Risk Premium CAPM Factor Betas and Risk Premiums Market (ERP) 0.85 4.8% FF5 Factor Betas and Risk Premiums Market (ERP) 0.81 4.8% Size (SMB) 0.5 2% Value (HML) 0.2 4% Profitability (RMW) −0.16 2.9% Investment (CMA) 0.32 3.9%\"><p>Using the BYPRP, Giuseppe estimates Kyoto’s cost of equity. He assumes a historical risk<\/p><p>premium of 5.8% earned by equity investors relative to long-term bond yields. Giuseppe prepares<\/p><p>and submits the report to his manager. The manager is curious about which criteria were used to<\/p><p>estimate the ERP of 4.8% in his cost of equity estimate. Giuseppe informs the manager that the<\/p><p>estimation was derived using the historical approach, electing to use the arithmetic mean and<\/p><p>the short-term government bill rate.<\/p><\/div><\/details><div class=\"qtext\"><p>Kyoto’s cost of common equity using CAPM is closest to?<\/p><\/div>", "subj": "corporate"}, {"n": 17, "q": "Other than an equity investment, which of the following is the most appropriate corporate action Wang Com could take with respect to Cydian Ltd?", "opts": ["Acquisition.", "Spin-off", "Balance sheet restructuring."], "ans": "A", "expl": "Acquiring Cydian Ltd would be a strategic move for Wang Com, allowing it to fully integrate Cydian's advanced 5G technology into its operations. This integration is crucial as Wang Com currently operates with outdated 3G technology and faces the risk of losing market share if it does not upgrade. By acquiring Cydian, Wang Com would not only gain control over the innovative 5G technology but also ensure exclusive access to these advancements, which is vital in maintaining competitive advantage in the rapidly evolving telecommunications market. Furthermore, the acquisition would allow Wang Com to streamline operations and potentially reduce costs through economies of scale and more efficient use of shared resources. This is particularly important given the financial strain of transitioning to a new technology, as evidenced by the need to finance the investment through a loan with a 7% interest rate. B is incorrect. A spin-off involves a company divesting a part of its business to form a new independent entity. In the context of Wang Com and Cydian Ltd, a spin-off would be counterproductive. Wang Com's strategic interest lies in gaining access to and control over Cydian's 5G technology to upgrade its own infrastructure and retain its market share. Divesting Cydian as a separate entity would contradict these strategic goals by potentially reducing Wang Com's direct influence over the 5G technology development and application. Moreover, a spin-off could lead to operational inefficiencies and a dilution of focus on core competencies related to the integration and deployment of 5G technology, which is critical for Wang Com's future growth and competitiveness. C is incorrect. Balance sheet restructuring generally involves reorganizing a company's debts and equity to improve liquidity and operational efficiency. While this could be beneficial for Wang Com in managing the financial aspects of its investment in Cydian, it does not address the core strategic need to upgrade technology and secure a competitive position in the market. Restructuring the balance sheet would not provide Wang Com with the control or ownership of the 5G technology that is crucial for its survival and growth in the telecommunications industry. Therefore, while financially prudent, balance sheet restructuring alone would not fulfill the strategic objectives that an acquisition would, such as securing technology and enhancing market competitiveness. ", "explhtml": "<p>Acquiring Cydian Ltd would be a strategic move for Wang Com, allowing it to fully integrate Cydian&#x27;s advanced 5G technology into its operations. This integration is crucial as Wang Com currently operates with outdated 3G technology and faces the risk of losing market share if it does not upgrade. By acquiring Cydian, Wang Com would not only gain control over the innovative 5G technology but also ensure exclusive access to these advancements, which is vital in maintaining competitive advantage in the rapidly evolving telecommunications market. Furthermore, the acquisition would allow Wang Com to streamline operations and potentially reduce costs through economies of scale and more efficient use of shared resources. This is particularly important given the financial strain of transitioning to a new technology, as evidenced by the need to finance the investment through a loan with a 7% interest rate.<\/p><p><b>B is incorrect.<\/b> A spin-off involves a company divesting a part of its business to form a new independent entity. In the context of Wang Com and Cydian Ltd, a spin-off would be counterproductive. Wang Com&#x27;s strategic interest lies in gaining access to and control over Cydian&#x27;s 5G technology to upgrade its own infrastructure and retain its market share. Divesting Cydian as a separate entity would contradict these strategic goals by potentially reducing Wang Com&#x27;s direct influence over the 5G technology development and application. Moreover, a spin-off could lead to operational inefficiencies and a dilution of focus on core competencies related to the integration and deployment of 5G technology, which is critical for Wang Com&#x27;s future growth and competitiveness.<\/p><p><b>C is incorrect.<\/b> Balance sheet restructuring generally involves reorganizing a company&#x27;s debts and equity to improve liquidity and operational efficiency. While this could be beneficial for Wang Com in managing the financial aspects of its investment in Cydian, it does not address the core strategic need to upgrade technology and secure a competitive position in the market. Restructuring the balance sheet would not provide Wang Com with the control or ownership of the 5G technology that is crucial for its survival and growth in the telecommunications industry. Therefore, while financially prudent, balance sheet restructuring alone would not fulfill the strategic objectives that an acquisition would, such as securing technology and enhancing market competitiveness. <\/p><p class=\"los\">Corporate Issuers, Learning Module 4: Corporate Restructuring, LOS 4(a) Explain types of corporate restructuring and issuers motivations for pursuing them.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Wang Com<\/summary><div class=\"vig-body\"><p>Wang Com is a telecommunications company based in Hong Kong. Over the last ten years, Wang<\/p><p>Com&#x27;s revenues have decreased due to the entry of two competitors in the market. The company<\/p><p>has retained its market share due to a large base of loyal customers. Beyond the impact of<\/p><p>declining revenues, the emergence of 5G wireless technology has presented a significant<\/p><p>challenge for Wang Com. Although management is aware of 5G technology, the company still<\/p><p>operates with 3G hardware and fears losing market share without a timely transition to 5G.<\/p><p>At the end of the year 20X5, Wang Com announced that it would be making a $1.2 billion<\/p><p>investment in Cydian Ltd, a 5G hardware development company. This represents a 40% interest<\/p><p>in Cydian, valuing the company at $3 billion on an enterprise value basis. As part of the deal,<\/p><p>Wang Com will have exclusive access to Cydian’s 5G hardware, and Cydian Ltd will have access<\/p><p>to Wang Com’s sales and marketing infrastructure. Wang Com will finance the transaction with a<\/p><p>loan from a credit facility at an interest rate of 7%. Cydian will use the proceeds to carry out<\/p><p>further research on 5G technology.<\/p><p>Wang Com does not own any other equity investment, and gains/losses from associates are<\/p><p>reported as an operating income item in the profit and loss statement. Summary historical and<\/p><p>forecasted financial information for Wang Com and Cydian Ltd before the transaction is<\/p><p>presented in Exhibit 1 and Exhibit 2. Cydian will retain its earnings and does not intend to pay<\/p><p>dividends in the foreseeable future.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0028.webp\" style=\"max-width:min(100%,526px)\" alt=\"Exhibit 1: Wang Com Summary Financial Data (USD millions) 20X2 20X3 20X4 20X5 Revenues 36, 540 36, 220 35, 990 36, 120 EBITDA 12, 789 12, 677 12, 597 12, 642 EBIT 12, 689 12, 477 12, 397 12, 442 Interest expense (1, 200) (1, 120) (905) (905) Income tax (2, 298) (2, 271) (2, 298) (2, 307) Net income \"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0029.webp\" style=\"max-width:min(100%,523px)\" alt=\"Exhibit 2: Cydian Ltd Summary Financial Data (USD millions) 20X2 20X3 20X4 20X5 Revenues 1, 000 1, 120 1, 500 1, 900 EBITDA (2, 000) (2, 120) (2, 120) (2, 500) EBIT (2, 200) (2, 200) (2, 500) (2, 200) Interest expense 0 0 0 0 Income tax 0 0 0 0 Net income (2, 200) (2, 200) (2, 500) (2, 200) Diluted \"><\/div><\/details><div class=\"qtext\"><p>Other than an equity investment, which of the following is the most appropriate corporate action Wang Com could take with respect to Cydian Ltd?<\/p><\/div>", "subj": "corporate"}, {"n": 18, "q": "Compared to an outright acquisition, an equity investment in Cydian Ltd is most likely to:", "opts": ["Provide Wang Com with greater control over Cydian’s 5G technology development.", "Allow Wang Com to access Cydian’s 5G technology with lower financial commitment.", "Enable Wang Com to fully integrate Cydian’s operations into its business."], "ans": "B", "expl": "Compared to an outright acquisition, an equity investment in Cydian Ltd allows Wang Com to access Cydian’s 5G technology with a lower financial commitment. Wang Com’s $1.2 billion investment secures a 40% stake and exclusive access to Cydian’s 5G hardware, an amount that's significantly less than the $3 billion enterprise value implied for a full acquisition. This lower capital outlay enables Wang Com to pursue its strategic goal of transitioning to 5G while preserving financial flexibility to address competitive pressures. A is incorrect. An equity investment with a 40% stake provides limited control over Cydian’s 5G technology development, as it does not grant majority ownership, unlike an acquisition. C is incorrect. Full integration of Cydian’s operations requires ownership and control, which an acquisition enables, not a 40% equity investment. ", "explhtml": "<p>Compared to an <b>outright acquisition<\/b>, an <b>equity investment<\/b> in Cydian Ltd allows Wang Com to access Cydian’s <b>5G technology<\/b> with a <b>lower financial commitment<\/b>. Wang Com’s $1.2 billion investment secures a 40% stake and exclusive access to Cydian’s 5G hardware, an amount that&#x27;s significantly less than the $3 billion enterprise value implied for a full acquisition. This lower capital outlay enables Wang Com to pursue its strategic goal of transitioning to 5G while preserving financial flexibility to address competitive pressures.<\/p><p><b>A is incorrect.<\/b> An <b>equity investment<\/b> with a 40% stake provides limited <b>control<\/b> over Cydian’s 5G technology development, as it does not grant majority ownership, unlike an acquisition.<\/p><p><b>C is incorrect.<\/b> <b>Full integration<\/b> of Cydian’s operations requires ownership and control, which an acquisition enables, not a 40% equity investment. <\/p><p class=\"los\">Corporate Issuers, Learning Module 4: Corporate Restructuring, LOS 4(a) Explain types of corporate restructuring and issuers motivations for pursing them.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Wang Com<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Wang Com is a telecommunications company based in Hong Kong. Over the last ten years, Wang<\/p><p>Com&#x27;s revenues have decreased due to the entry of two competitors in the market. The company<\/p><p>has retained its market share due to a large base of loyal customers. Beyond the impact of<\/p><p>declining revenues, the emergence of 5G wireless technology has presented a significant<\/p><p>challenge for Wang Com. Although management is aware of 5G technology, the company still<\/p><p>operates with 3G hardware and fears losing market share without a timely transition to 5G.<\/p><p>At the end of the year 20X5, Wang Com announced that it would be making a $1.2 billion<\/p><p>investment in Cydian Ltd, a 5G hardware development company. This represents a 40% interest<\/p><p>in Cydian, valuing the company at $3 billion on an enterprise value basis. As part of the deal,<\/p><p>Wang Com will have exclusive access to Cydian’s 5G hardware, and Cydian Ltd will have access<\/p><p>to Wang Com’s sales and marketing infrastructure. Wang Com will finance the transaction with a<\/p><p>loan from a credit facility at an interest rate of 7%. Cydian will use the proceeds to carry out<\/p><p>further research on 5G technology.<\/p><p>Wang Com does not own any other equity investment, and gains/losses from associates are<\/p><p>reported as an operating income item in the profit and loss statement. Summary historical and<\/p><p>forecasted financial information for Wang Com and Cydian Ltd before the transaction is<\/p><p>presented in Exhibit 1 and Exhibit 2. Cydian will retain its earnings and does not intend to pay<\/p><p>dividends in the foreseeable future.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0028.webp\" style=\"max-width:min(100%,526px)\" alt=\"Exhibit 1: Wang Com Summary Financial Data (USD millions) 20X2 20X3 20X4 20X5 Revenues 36, 540 36, 220 35, 990 36, 120 EBITDA 12, 789 12, 677 12, 597 12, 642 EBIT 12, 689 12, 477 12, 397 12, 442 Interest expense (1, 200) (1, 120) (905) (905) Income tax (2, 298) (2, 271) (2, 298) (2, 307) Net income \"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0029.webp\" style=\"max-width:min(100%,523px)\" alt=\"Exhibit 2: Cydian Ltd Summary Financial Data (USD millions) 20X2 20X3 20X4 20X5 Revenues 1, 000 1, 120 1, 500 1, 900 EBITDA (2, 000) (2, 120) (2, 120) (2, 500) EBIT (2, 200) (2, 200) (2, 500) (2, 200) Interest expense 0 0 0 0 Income tax 0 0 0 0 Net income (2, 200) (2, 200) (2, 500) (2, 200) Diluted \"><\/div><\/details><div class=\"qtext\"><p>Compared to an outright acquisition, an equity investment in Cydian Ltd is most likely to:<\/p><\/div>", "subj": "corporate"}, {"n": 19, "q": "What is the most likely effect of the equity investment in Cydian Ltd on Wang Com’s 20X6 debt-to-EBITDA and interest coverage ratios?", "opts": ["Both ratios increase.", "Debt-to-EBITDA ratio increases; interest coverage ratio decreases.", "Debt-to-EBITDA ratio decreases; interest coverage ratio increases."], "ans": "B", "expl": "To determine the effect of Wang Com’s equity investment in Cydian Ltd on its 20X6 debt-to-EBITDA and interest coverage ratios, let's analyze the transaction step-by-step. Key Details of the Transaction: 1. Investment Amount: $1.2 billion (40% stake in Cydian Ltd). 2. Financing: Wang Com borrows the entire $1.2 billion at 7% interest. 3. Cydian's Financials: Impact on Wang Com's Financials: 1. Debt-to-EBITDA Ratio: Debt Increase: Wang Com's total debt increases by $1.2 billion. New Debt = $17,832 (existing) + $1,200 = $19,032 million New Debt-to-EBITDA: Debt-to-EBITDA = 19,032 / 12,642 = 1.51 (Previously 17,832 / 12,642 = 1.41) Conclusion: The Debt-to-EBITDA ratio increases due to higher debt. 2. Interest Coverage Ratio (EBIT / Interest Expense): Interest Expense Increase: New Interest Coverage Ratio: Interest Coverage = 11,562 / 989 = 11.69 (Previously 12,442 / 905 = 13.75) Conclusion: The Interest Coverage Ratio decreases due to higher interest expense and lower EBIT. ", "explhtml": "<p><b>To determine the effect of Wang Com’s equity investment in Cydian Ltd on its 20X6<\/b> <b>debt-to-EBITDA and interest coverage ratios<\/b>, let&#x27;s analyze the transaction step-by-step.<\/p><p><b>Key Details of the Transaction:<\/b><\/p><p>1. <b>Investment Amount:<\/b> $1.2 billion (40% stake in Cydian Ltd). 2. <b>Financing:<\/b> Wang Com borrows the entire $1.2 billion at <b>7% interest<\/b>. 3. <b>Cydian&#x27;s Financials:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0030.webp\" style=\"max-width:min(100%,656px)\" alt=\"Cydian is currently unprofitable (negative EBITDA and net income). Wang Com will account for its 40% stake using the equity method, recognizing its share of Cydian&#x27;s earnings (losses) in its operating income.\"><p><b>Impact on Wang Com&#x27;s Financials:<\/b><\/p><p><b>1. Debt-to-EBITDA Ratio:<\/b><\/p><p><b>Debt Increase:<\/b> Wang Com&#x27;s total debt increases by $1.2 billion. New Debt = $17,832 (existing) + $1,200 = <b>$19,032 million<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0031.webp\" style=\"max-width:min(100%,718px)\" alt=\"EBITDA Impact: Cydian&#x27;s EBITDA is negative ($2,500 million loss in 20X5). Wang Com&#x27;s 40% share = $1,000 million loss. However, EBITDA excludes equity method earnings/losses. Therefore, Wang Com&#x27;s consolidated EBITDA remains unchanged. Wang Com&#x27;s 20X5 EBITDA = $12,642 million.\"><p><b>New Debt-to-EBITDA:<\/b> Debt-to-EBITDA = 19,032 / 12,642 = <b>1.51<\/b> (Previously 17,832 / 12,642 = 1.41)<\/p><p>Conclusion: The <b>Debt-to-EBITDA ratio increases<\/b> due to higher debt.<\/p><p><b>2. Interest Coverage Ratio (EBIT / Interest Expense):<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0032.webp\" style=\"max-width:min(100%,718px)\" alt=\"EBIT Impact: Under the equity method, Wang Com recognizes 40% of Cydian&#x27;s net loss as part of its operating income. Cydian&#x27;s 20X5 net loss = $2,200 million. Wang Com&#x27;s share = $880 million. This reduces Wang Com&#x27;s EBIT. New EBIT = $12,442 (existing) - $880 = $11,562 million.\"><p><b>Interest Expense Increase:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0033.webp\" style=\"max-width:min(100%,539px)\" alt=\"Additional interest on $1.2 billion loan at 7% = $84 million. Total Interest Expense = $905 (existing) + $84 = $989 million.\"><p><b>New Interest Coverage Ratio:<\/b> Interest Coverage = 11,562 / 989 = <b>11.69<\/b> (Previously 12,442 / 905 = 13.75)<\/p><p>Conclusion: The <b>Interest Coverage Ratio decreases<\/b> due to higher interest expense and lower EBIT. <\/p><p class=\"los\">Corporate Issuers, Learning Module 4: Corporate Restructuring, LOS 4(d) Demonstrate how corporate restructurings affect an issuer’s EPS, net debt to EBITDA ratio, and weighted average cost of capital<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Wang Com<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Wang Com is a telecommunications company based in Hong Kong. Over the last ten years, Wang<\/p><p>Com&#x27;s revenues have decreased due to the entry of two competitors in the market. The company<\/p><p>has retained its market share due to a large base of loyal customers. Beyond the impact of<\/p><p>declining revenues, the emergence of 5G wireless technology has presented a significant<\/p><p>challenge for Wang Com. Although management is aware of 5G technology, the company still<\/p><p>operates with 3G hardware and fears losing market share without a timely transition to 5G.<\/p><p>At the end of the year 20X5, Wang Com announced that it would be making a $1.2 billion<\/p><p>investment in Cydian Ltd, a 5G hardware development company. This represents a 40% interest<\/p><p>in Cydian, valuing the company at $3 billion on an enterprise value basis. As part of the deal,<\/p><p>Wang Com will have exclusive access to Cydian’s 5G hardware, and Cydian Ltd will have access<\/p><p>to Wang Com’s sales and marketing infrastructure. Wang Com will finance the transaction with a<\/p><p>loan from a credit facility at an interest rate of 7%. Cydian will use the proceeds to carry out<\/p><p>further research on 5G technology.<\/p><p>Wang Com does not own any other equity investment, and gains/losses from associates are<\/p><p>reported as an operating income item in the profit and loss statement. Summary historical and<\/p><p>forecasted financial information for Wang Com and Cydian Ltd before the transaction is<\/p><p>presented in Exhibit 1 and Exhibit 2. Cydian will retain its earnings and does not intend to pay<\/p><p>dividends in the foreseeable future.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0028.webp\" style=\"max-width:min(100%,526px)\" alt=\"Exhibit 1: Wang Com Summary Financial Data (USD millions) 20X2 20X3 20X4 20X5 Revenues 36, 540 36, 220 35, 990 36, 120 EBITDA 12, 789 12, 677 12, 597 12, 642 EBIT 12, 689 12, 477 12, 397 12, 442 Interest expense (1, 200) (1, 120) (905) (905) Income tax (2, 298) (2, 271) (2, 298) (2, 307) Net income \"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0029.webp\" style=\"max-width:min(100%,523px)\" alt=\"Exhibit 2: Cydian Ltd Summary Financial Data (USD millions) 20X2 20X3 20X4 20X5 Revenues 1, 000 1, 120 1, 500 1, 900 EBITDA (2, 000) (2, 120) (2, 120) (2, 500) EBIT (2, 200) (2, 200) (2, 500) (2, 200) Interest expense 0 0 0 0 Income tax 0 0 0 0 Net income (2, 200) (2, 200) (2, 500) (2, 200) Diluted \"><\/div><\/details><div class=\"qtext\"><p>What is the most likely effect of the equity investment in Cydian Ltd on Wang Com’s 20X6 debt-to-EBITDA and interest coverage ratios?<\/p><\/div>", "subj": "corporate"}, {"n": 20, "q": "How is the equity investment in Cydian Ltd likely to affect Wang Com's 20X6 diluted EPS?", "opts": ["Diluted EPS will increase.", "Diluted EPS will remain the same.", "Diluted EPS will decrease."], "ans": "C", "expl": "To determine how Wang Com's 20X6 diluted EPS will be affected by its equity investment in Cydian Ltd, let's analyze the key factors step-by-step: 1. Impact of Cydian's Losses on Wang Com's Net Income Wang Com owns a 40% stake in Cydian and uses the equity method to account for Cydian is unprofitable (Exhibit 2 shows consistent net losses): This loss reduces Wang Com's net income: 2. Impact of Additional Interest Expense Wang Com finances the $1.2 billion investment with a 7% loan: This further reduces net income: 3. Diluted Shares Outstanding The problem indicates no change in diluted shares outstanding (20X5: 2,125 Unless there's a new issue (no mention in the case), we assume shares remain the 4. Calculation of 20X6 Diluted EPS Diluted EPS = Net Income / Diluted Shares Outstanding 20X5 Diluted EPS (pre-investment): $4.34 20X6 Diluted EPS (post-investment): $8,266 / 2,125 = $3.89 Result: EPS decreases from $4.34 to $3.89. ", "explhtml": "<p>To determine how Wang Com&#x27;s <b>20X6 diluted EPS<\/b> will be affected by its equity investment in Cydian Ltd, let&#x27;s analyze the key factors step-by-step:<\/p><p><b>1. Impact of Cydian&#x27;s Losses on Wang Com&#x27;s Net Income<\/b><\/p><p>Wang Com owns a <b>40% stake<\/b> in Cydian and uses the <b>equity method<\/b> to account for<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0034.webp\" style=\"max-width:min(100%,131px)\" alt=\"the investment.\"><p>Cydian is <b>unprofitable<\/b> (Exhibit 2 shows consistent net losses):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0035.webp\" style=\"max-width:min(100%,328px)\" alt=\"20X5 Net Loss: $2,200 million Wang Com&#x27;s Share of Loss (40%): 40% × $2,200 = $880 million\"><p>This loss <b>reduces Wang Com&#x27;s net income<\/b>:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0036.webp\" style=\"max-width:min(100%,485px)\" alt=\"20X5 Net Income (before investment): $9,230 million Adjusted 20X6 Net Income (estimate): $9,230 - $880 = $8,350 million\"><p><b>2. Impact of Additional Interest Expense<\/b><\/p><p>Wang Com finances the $1.2 billion investment with a <b>7% loan<\/b>:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0037.webp\" style=\"max-width:min(100%,287px)\" alt=\"Additional Interest Expense: 7% × $1,200 = $84 million\"><p>This further reduces net income:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0038.webp\" style=\"max-width:min(100%,289px)\" alt=\"Revised 20X6 Net Income: $8,350 - $84 = $8,266 million\"><p><b>3. Diluted Shares Outstanding<\/b><\/p><p>The problem indicates <b>no change in diluted shares outstanding<\/b> (20X5: 2,125<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0039.webp\" style=\"max-width:min(100%,130px)\" alt=\"million shares).\"><p>Unless there&#x27;s a new issue (no mention in the case), we assume shares remain the<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0040.webp\" style=\"max-width:min(100%,58px)\" alt=\"same.\"><p><b>4. Calculation of 20X6 Diluted EPS<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0041.webp\" style=\"max-width:min(100%,122px)\" alt=\"Formula:\"><p>Diluted EPS = Net Income / Diluted Shares Outstanding<\/p><p><b>20X5 Diluted EPS (pre-investment):<\/b> $4.34<\/p><p><b>20X6 Diluted EPS (post-investment):<\/b> $8,266 / 2,125 = <b>$3.89<\/b><\/p><p>Result: EPS <b>decreases<\/b> from $4.34 to $3.89. <\/p><p class=\"los\">Corporate Issuers, Learning Module 4: Corporate Restructuring, LOS 4(d) Demonstrate how corporate restructurings affect an issuer’s EPS, net debt to EBITDA ratio, and weighted average cost of capital<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Wang Com<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Wang Com is a telecommunications company based in Hong Kong. Over the last ten years, Wang<\/p><p>Com&#x27;s revenues have decreased due to the entry of two competitors in the market. The company<\/p><p>has retained its market share due to a large base of loyal customers. Beyond the impact of<\/p><p>declining revenues, the emergence of 5G wireless technology has presented a significant<\/p><p>challenge for Wang Com. Although management is aware of 5G technology, the company still<\/p><p>operates with 3G hardware and fears losing market share without a timely transition to 5G.<\/p><p>At the end of the year 20X5, Wang Com announced that it would be making a $1.2 billion<\/p><p>investment in Cydian Ltd, a 5G hardware development company. This represents a 40% interest<\/p><p>in Cydian, valuing the company at $3 billion on an enterprise value basis. As part of the deal,<\/p><p>Wang Com will have exclusive access to Cydian’s 5G hardware, and Cydian Ltd will have access<\/p><p>to Wang Com’s sales and marketing infrastructure. Wang Com will finance the transaction with a<\/p><p>loan from a credit facility at an interest rate of 7%. Cydian will use the proceeds to carry out<\/p><p>further research on 5G technology.<\/p><p>Wang Com does not own any other equity investment, and gains/losses from associates are<\/p><p>reported as an operating income item in the profit and loss statement. Summary historical and<\/p><p>forecasted financial information for Wang Com and Cydian Ltd before the transaction is<\/p><p>presented in Exhibit 1 and Exhibit 2. Cydian will retain its earnings and does not intend to pay<\/p><p>dividends in the foreseeable future.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0028.webp\" style=\"max-width:min(100%,526px)\" alt=\"Exhibit 1: Wang Com Summary Financial Data (USD millions) 20X2 20X3 20X4 20X5 Revenues 36, 540 36, 220 35, 990 36, 120 EBITDA 12, 789 12, 677 12, 597 12, 642 EBIT 12, 689 12, 477 12, 397 12, 442 Interest expense (1, 200) (1, 120) (905) (905) Income tax (2, 298) (2, 271) (2, 298) (2, 307) Net income \"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0029.webp\" style=\"max-width:min(100%,523px)\" alt=\"Exhibit 2: Cydian Ltd Summary Financial Data (USD millions) 20X2 20X3 20X4 20X5 Revenues 1, 000 1, 120 1, 500 1, 900 EBITDA (2, 000) (2, 120) (2, 120) (2, 500) EBIT (2, 200) (2, 200) (2, 500) (2, 200) Interest expense 0 0 0 0 Income tax 0 0 0 0 Net income (2, 200) (2, 200) (2, 500) (2, 200) Diluted \"><\/div><\/details><div class=\"qtext\"><p>How is the equity investment in Cydian Ltd likely to affect Wang Com&#x27;s 20X6 diluted EPS?<\/p><\/div>", "subj": "corporate"}, {"n": 21, "q": "Which of the following is least likely to be Metaxas’s motivation for pursuing the acquisition of Socrates?", "opts": ["To strengthen its balance sheet.", "To diversify its business away from the vehicle business.", "To expand into foreign markets."], "ans": "A", "expl": "Metaxas’s acquisition of Socrates is driven by the strategic goals of diversifying away from the competitive automotive market and expanding into foreign markets, as stated in the vignette. The acquisition aligns with these objectives: Socrates’s motorcycle business diversifies Metaxas’s portfolio, and Socrates’s planned expansion into Asia and the Middle East supports foreign market growth. However, strengthening the balance sheet is least likely a motivation, as the acquisition increases debt ($1 billion loan) and reduces cash ($2 billion from cash reserves), potentially weakening the balance sheet rather than strengthening it, at least in the short term. B is incorrect. By acquiring Socrates, Metaxas moves into the motorcycle manufacturing business, which complements its existing crossover SUV and sedan operations. This reduces reliance on the highly competitive automotive market and provides exposure to a growing segment (off-road motorcycles). C is incorrect. Socrates plans to use the proceeds from the acquisition to expand its operations in Asia and the Middle East. This aligns with Metaxas’s goal of realizing synergies and increasing revenue by tapping into foreign markets. The acquisition provides Metaxas with access to Socrates’s established presence and growth potential in these region. ", "explhtml": "<p>Metaxas’s acquisition of Socrates is driven by the strategic goals of diversifying away from the competitive automotive market and expanding into foreign markets, as stated in the vignette. The acquisition aligns with these objectives: Socrates’s motorcycle business diversifies Metaxas’s portfolio, and Socrates’s planned expansion into Asia and the Middle East supports foreign market growth. However, strengthening the balance sheet is least likely a motivation, as the acquisition increases debt ($1 billion loan) and reduces cash ($2 billion from cash reserves), potentially weakening the balance sheet rather than strengthening it, at least in the short term.<\/p><p><b>B is incorrect<\/b>. By acquiring Socrates, Metaxas moves into the motorcycle manufacturing business, which complements its existing crossover SUV and sedan operations. This reduces reliance on the highly competitive automotive market and provides exposure to a growing segment (off-road motorcycles).<\/p><p><b>C is incorrect<\/b>. Socrates plans to use the proceeds from the acquisition to expand its operations in Asia and the Middle East. This aligns with Metaxas’s goal of realizing synergies and increasing revenue by tapping into foreign markets. The acquisition provides Metaxas with access to Socrates’s established presence and growth potential in these region. <\/p><p class=\"los\">Corporate Issuers, Learning Module 4: Corporate Restructuring, LOS 4 (e) Evaluate corporate investment actions, including equity investments, joint ventures, and acquisitions.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Metaxas Ltd<\/summary><div class=\"vig-body\"><p>Metaxas Ltd is an automobile manufacturer that specializes in crossover SUVs and sedans.<\/p><p>Metaxas has experienced declining sales due to intense competition from other manufacturers.<\/p><p>To improve its financial position and realize shareholder value, Metaxas is seeking to diversify<\/p><p>away from the competitive automotive market. Socrates is a motorcycle manufacturer that<\/p><p>specializes in producing off-road motorcycles. Socrates has consistently increased sales revenue<\/p><p>and profits over the past five years. This has made it an attractive target for Metaxas.<\/p><p>At the beginning of 20X5, Metaxas Ltd and Socrates announced that the two parties had reached<\/p><p>an agreement in which Metaxas would acquire Socrates. The $4 billion deal included $3 billion in<\/p><p>cash and 60 million Metaxas shares.. Metaxas and Socrates expect to close the deal by June 30,<\/p><p>20X5. At the time of the transaction, Socrates&#x27; deal price per share was $2, and its pre-<\/p><p>transaction stock price was $ 1.50. Socrates plans to use the proceeds to expand its operations<\/p><p>in Asia and the Middle East. As part of the agreement, Socrates agreed not to sell Metaxas&#x27;<\/p><p>shares for seven years from the date of the acquisition’s closing.<\/p><p>Metaxas financed the acquisition with cash on hand plus a $1 billion loan from a financial<\/p><p>institution at a 7% interest rate. Metaxas expects to realize $180 million in EBITDA by year 3,<\/p><p>driven by its expansion into foreign markets and revenue from the motorcycle manufacturing<\/p><p>business. The incremental amortization expense associated with the net acquired assets is $150<\/p><p>million per year. The income tax rate is 30%. Summarized historical data and financial forecasts<\/p><p>for Metaxas and Socrates are provided in Exhibits 1 and 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0042.webp\" style=\"max-width:min(100%,485px)\" alt=\"Exhibit 1: Metaxas Summary Financial Data (Pre-Acquisition) 20X4 20X5 20X6 Net revenues 21,860 19,980 20,160 Cost of sales (10, 930) (9, 990) (10, 080) Operating expense (2, 500) (3, 000) (2, 600) EBITDA 8,430 6,990 7,480 Depreciation &amp; Amortization (1, 000) (902) (1, 050) EBIT 7,430 6,088 6,430 Int\"><\/div><\/details><div class=\"qtext\"><p>Which of the following is least likely to be Metaxas’s motivation for pursuing the acquisition of Socrates?<\/p><\/div>", "subj": "corporate"}, {"n": 22, "q": "What impact does the acquisition of Socrates have on Metaxas Ltd’s 20X5 debt-to-EBITDA ratio?:", "opts": ["It increases.", "It decreases.", "It remains constant."], "ans": "B", "expl": "Metaxas finances the acquisition with a $1 billion loan, so total debt rises from $6.99 billion to $7.99 billion. After closing, Metaxas will consolidate Socrates’s EBITDA. Metaxas 20X5 EBITDA (pre-deal): $6.99 billion Socrates 20X5 EBITDA (pre-deal): $3.97 billion Debt-to-EBITDA ratio: Because EBITDA increases proportionally more than debt, the debt-to-EBITDA ratio falls, i.e., it decreases.", "explhtml": "<img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0043.webp\" style=\"max-width:min(100%,146px)\" alt=\"Debt effect:\"><p>Metaxas finances the acquisition with a <b>$1 billion loan<\/b>, so total debt rises from <b>$6.99<\/b><\/p><p><b>billion to $7.99 billion<\/b>.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0044.webp\" style=\"max-width:min(100%,173px)\" alt=\"EBITDA effect:\"><p>After closing, Metaxas will consolidate <b>Socrates’s EBITDA<\/b>.<\/p><p>Metaxas 20X5 EBITDA (pre-deal): <b>$6.99 billion<\/b><\/p><p>Socrates 20X5 EBITDA (pre-deal): <b>$3.97 billion<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0045.webp\" style=\"max-width:min(100%,414px)\" alt=\"Pro-forma EBITDA: 6.99 + 3.97 = 10.96 billion\"><p><b>Debt-to-EBITDA ratio:<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0046.webp\" style=\"max-width:min(100%,250px)\" alt=\"6.99 Pre-acquisition = = 1.00 6.99 7.99 Post-acquisition = ≈0.73 10.96\"><p>Because EBITDA increases proportionally <b>more<\/b> than debt, the <b>debt-to-EBITDA ratio falls<\/b>, i.e., it <b>decreases<\/b>.<\/p><p class=\"los\">Corporate Issuers, Learning Module 4: Corporate Restructuring, LOS 4 (d) Demonstrate how corporate restructuring affect an issuer’s EPS, net debt-to-EBITDA ratio, and weighted average cost of capital.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Metaxas Ltd<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Metaxas Ltd is an automobile manufacturer that specializes in crossover SUVs and sedans.<\/p><p>Metaxas has experienced declining sales due to intense competition from other manufacturers.<\/p><p>To improve its financial position and realize shareholder value, Metaxas is seeking to diversify<\/p><p>away from the competitive automotive market. Socrates is a motorcycle manufacturer that<\/p><p>specializes in producing off-road motorcycles. Socrates has consistently increased sales revenue<\/p><p>and profits over the past five years. This has made it an attractive target for Metaxas.<\/p><p>At the beginning of 20X5, Metaxas Ltd and Socrates announced that the two parties had reached<\/p><p>an agreement in which Metaxas would acquire Socrates. The $4 billion deal included $3 billion in<\/p><p>cash and 60 million Metaxas shares.. Metaxas and Socrates expect to close the deal by June 30,<\/p><p>20X5. At the time of the transaction, Socrates&#x27; deal price per shar
