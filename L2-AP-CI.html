500m.", "explhtml": "<p>A conglomerate discount is the amount by which a company&#x27;s sum-of-the-parts (SOTP) valuation exceeds its current market enterprise value.<\/p><p>First, we calculate the adjusted EBITDA for the Data Security segment. The $100 million in corporate costs must be allocated to the segment.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0155.webp\" style=\"max-width:min(100%,743px)\" alt=\"Adjusted EBITDA = Segment EBITDA −Corporate Costs = $2, 500m −$100m = $2, 400 million.\"><p>Next, we calculate the value of the Data Security segment.<\/p><p>Value = Adjusted EBITDA × Peer EV/EBITDA Multiple = $2,400m × 7.5 = $18, 000 million.<\/p><p>The value of the Cloud AI segment.<\/p><p>Value = Segment Sales × Peer EV/Sales Multiple = $2, 000m × 5.0 = $10, 000 million.<\/p><p>Calculate the SOTP Value.<\/p><p>SOTP Value = Value of Data Security + Value of Cloud AI = $18, 000m + $10, 000m = $28, 000 mill<\/p><p>The Conglomerate Discount is calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0156.webp\" style=\"max-width:min(100%,736px)\" alt=\"Discount = SOTP Value −Current Enterprise Value = $28, 000m −$20, 000m = $8, 000 million.\"><p><b>B is incorrect.<\/b> You would arrive at this value if you failed to allocate the corporate costs and<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0157.webp\" style=\"max-width:min(100%,758px)\" alt=\"used  the  unadjusted  segment  EBITDA  for  the  Data  Security  division:  ($2,500m × 7.5) + ($2, 000m × 5.0) = $28, 750m ,  leading  to  a  discount  of \"><p>$28, 750m −$20, 000m = $8, 750m.<\/p><p><b>C is incorrect.<\/b> This would be the result if you made an error in the opposite direction and incorrectly added the corporate costs to the EBITDA of the Data Security segment instead of<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0158.webp\" style=\"max-width:min(100%,757px)\" alt=\"subtracting  them.  This  would  lead  to  a  sum-of-the-parts  value  of \"><p>($2,500m + $100m) × 7.5 + ($2, 000m × 5.0) = $29, 500m, and an incorrect discount of  $29, 500m − $20, 000m = $9, 500m.<\/p><p class=\"los\">Corporate Issuers, Learning Module 4: Corporate Restructuring LOS 4(a): Explain types of corporate restructurings and issuers’ motivations for pursuing them.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 23 · Câu 89–92 · VeriData Analytics<\/summary><div class=\"vig-body\"><p>Anya Sharma, CFA, is an equity analyst reviewing VeriData Analytics (VeriData). VeriData is a<\/p><p>diversified technology company that reports two operating segments: a mature, highly profitable<\/p><p>legacy segment and a high-growth, lower-margin emerging segment. The company’s share price<\/p><p>has been flat for two years. A significant shareholder advocating strategic change recently<\/p><p>acquired a material stake and publicly claimed that VeriData is trading at a “conglomerate<\/p><p>discount” and should consider strategic alternatives.<\/p><p>Sharma notes that VeriData’s current enterprise value is $20 billion, and it has a data security<\/p><p>division and a high-growth, lower-margin cloud AI division.<\/p><p>Sharma gathers financial data for VeriData’s segments for the last twelve months (LTM) and<\/p><p>compiles valuation data for comparable peer companies in Exhibit 1 to evaluate the investor’s<\/p><p>claim. She notes that corporate/unallocated costs amount to $100 million annually and are not<\/p><p>included in the segment EBITDA figures. For her sum-of-the-parts analysis, she plans to allocate<\/p><p>these costs entirely to the more mature Data Security segment.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0153.webp\" style=\"max-width:min(100%,493px)\" alt=\"Exhibit 1: VeriData Segment &amp; Peer Valuation Data ($ millions) VeriData Segment Data (LTM) Revenues EBITDA Data Security $8, 000 $2, 500 Cloud AI $2, 000 $200 Peer Valuation Data Peer Median Multiple Data Security Peers EV / EBITDA 7.5x Cloud AI Peers EV / Sales 5.0x\"><p>In response to activist pressure, VeriData’s board announced it is conducting a &quot;comprehensive<\/p><p>review of strategic alternatives to maximize stakeholder value.&quot; Sharma believes two main<\/p><p>options are being considered. The first is the outright sale of the Data Security division to a<\/p><p>private equity firm, which will sharpen the company&#x27;s focus on its high-growth Cloud AI<\/p><p>business.<\/p><p>The second option management seems to favor is strengthening the Cloud AI business by<\/p><p>acquiring SynthLogic, a private, fast-growing artificial intelligence company. Management<\/p><p>believes this move aligns with its current strategy. They have proposed a deal to acquire SynthLogic for a total consideration of $3,000 million.<\/p><p>To assess the financial impact of the proposed acquisition, Sharma gathers data on VeriData’s<\/p><p>pre-transaction capital structure in Exhibit 2. The acquisition of SynthLogic would be financed by<\/p><p>issuing $1,000 million in new debt and using $2,000 million of cash on hand.<\/p><p>Exhibit 2: VeriData Pre-Transaction Capital Structure &amp; Costs ($ millions)<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0154.webp\" style=\"max-width:min(100%,292px)\" alt=\"Metric Value Market Value of Equity $17,500 Total Debt $4, 000 Cash and Equivalents $1, 500 Cost of Equity (re) 10.0% Pre-tax Cost of Debt (rd) 5.0% Corporate Tax Rate 25.0%\"><\/div><\/details><div class=\"qtext\"><p>Based on the peer median multiples in Exhibit 1, the conglomerate discount for VeriData is closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 90, "q": "If management chose to sell the Data Security division instead of spinning it off, the most likely primary motivation would be to:", "opts": ["Allow the market to value the unit independently.", "Obtain immediate cash consideration.", "Avoid significant regulatory scrutiny."], "ans": "B", "expl": "Selling the Data Security division to a private-equity buyer would deliver a large, upfront cash inflow that VeriData could redeploy (e.g., fund the proposed SynthLogic acquisition, reduce debt, or return capital to shareholders). A spin-off would not raise cash; instead, it would simply distribute shares of the separated entity to existing shareholders. A is incorrect. Allowing the market to value a unit independently by creating a pure-play public company is a primary motivation for a spin-off, not a sale. C is incorrect. Spin-offs typically face less regulatory scrutiny than sales to a competitor because they reduce market concentration.", "explhtml": "<p>Selling the Data Security division to a private-equity buyer would deliver a large, upfront cash inflow that VeriData could redeploy (e.g., fund the proposed SynthLogic acquisition, reduce debt, or return capital to shareholders).<\/p><p>A spin-off would not raise cash; instead, it would simply distribute shares of the separated entity to existing shareholders.<\/p><p><b>A is incorrect.<\/b> Allowing the market to value a unit independently by creating a pure-play public company is a primary motivation for a spin-off, not a sale.<\/p><p><b>C is incorrect.<\/b> Spin-offs typically face less regulatory scrutiny than sales to a competitor because they reduce market concentration.<\/p><p class=\"los\">Corporate Issuers, Learning Module 4: Corporate Restructuring LOS 4(a): Explain types of corporate restructurings and issuers’ motivations for pursuing them.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 23 · Câu 89–92 · VeriData Analytics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Anya Sharma, CFA, is an equity analyst reviewing VeriData Analytics (VeriData). VeriData is a<\/p><p>diversified technology company that reports two operating segments: a mature, highly profitable<\/p><p>legacy segment and a high-growth, lower-margin emerging segment. The company’s share price<\/p><p>has been flat for two years. A significant shareholder advocating strategic change recently<\/p><p>acquired a material stake and publicly claimed that VeriData is trading at a “conglomerate<\/p><p>discount” and should consider strategic alternatives.<\/p><p>Sharma notes that VeriData’s current enterprise value is $20 billion, and it has a data security<\/p><p>division and a high-growth, lower-margin cloud AI division.<\/p><p>Sharma gathers financial data for VeriData’s segments for the last twelve months (LTM) and<\/p><p>compiles valuation data for comparable peer companies in Exhibit 1 to evaluate the investor’s<\/p><p>claim. She notes that corporate/unallocated costs amount to $100 million annually and are not<\/p><p>included in the segment EBITDA figures. For her sum-of-the-parts analysis, she plans to allocate<\/p><p>these costs entirely to the more mature Data Security segment.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0153.webp\" style=\"max-width:min(100%,493px)\" alt=\"Exhibit 1: VeriData Segment &amp; Peer Valuation Data ($ millions) VeriData Segment Data (LTM) Revenues EBITDA Data Security $8, 000 $2, 500 Cloud AI $2, 000 $200 Peer Valuation Data Peer Median Multiple Data Security Peers EV / EBITDA 7.5x Cloud AI Peers EV / Sales 5.0x\"><p>In response to activist pressure, VeriData’s board announced it is conducting a &quot;comprehensive<\/p><p>review of strategic alternatives to maximize stakeholder value.&quot; Sharma believes two main<\/p><p>options are being considered. The first is the outright sale of the Data Security division to a<\/p><p>private equity firm, which will sharpen the company&#x27;s focus on its high-growth Cloud AI<\/p><p>business.<\/p><p>The second option management seems to favor is strengthening the Cloud AI business by<\/p><p>acquiring SynthLogic, a private, fast-growing artificial intelligence company. Management<\/p><p>believes this move aligns with its current strategy. They have proposed a deal to acquire SynthLogic for a total consideration of $3,000 million.<\/p><p>To assess the financial impact of the proposed acquisition, Sharma gathers data on VeriData’s<\/p><p>pre-transaction capital structure in Exhibit 2. The acquisition of SynthLogic would be financed by<\/p><p>issuing $1,000 million in new debt and using $2,000 million of cash on hand.<\/p><p>Exhibit 2: VeriData Pre-Transaction Capital Structure &amp; Costs ($ millions)<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0154.webp\" style=\"max-width:min(100%,292px)\" alt=\"Metric Value Market Value of Equity $17,500 Total Debt $4, 000 Cash and Equivalents $1, 500 Cost of Equity (re) 10.0% Pre-tax Cost of Debt (rd) 5.0% Corporate Tax Rate 25.0%\"><\/div><\/details><div class=\"qtext\"><p>If management chose to sell the Data Security division instead of spinning it off, the most likely primary motivation would be to:<\/p><\/div>", "subj": "corporate"}, {"n": 91, "q": "After financing and completing the acquisition of SynthLogic, VeriData’s pro forma Weighted Average Cost of Capital (WACC) will be closest to:", "opts": ["8.61%", "8.84%", "8.89%"], "ans": "A", "expl": "The WACC must be recalculated to reflect the new capital structure after the debt- and cash-financed acquisition. First, we calculate the post-transaction Market Value of Debt (MVd) and Market Value of Equity  (MVe): Original Debt + New Debt = $4, 000m + $1, 000m = $5, 000 million. As the acquisition is not financed with stock, the MVe Remains $17,500 million. Next, we calculate the total post-transaction Firm Value (V). V = MVe + MVd = $17, 500m + $5, 000m = $22, 500 million. The new capital structure weights. Weight of Equity (we) = $22,500= 77.78%. Weight of Debt (wd) = $22,500= 22.22%. The new WACC. B is incorrect. The answer represents the pre-transaction WACC. You would arrive at this value if you made the common mistake of using the original capital structure weights instead of recalculating them to reflect the new debt from the acquisition. The pre-transaction WACC is 8.84%. C is incorrect. You would get this answer if you correctly recalculated the capital structure (0.7778 × 10.0%) + (0.2222 × 5.0%) = 8.89%.", "explhtml": "<p>The WACC must be recalculated to reflect the new capital structure after the debt- and cash-financed acquisition.<\/p><p>First, we calculate the post-transaction Market Value of Debt (MV<sub>d<\/sub>) and Market Value of Equity  (MV<sub>e<\/sub>):<\/p><p>Original Debt + New Debt = $4, 000m + $1, 000m = $5, 000 million.<\/p><p>As the acquisition is not financed with stock, the MV<sub>e<\/sub> Remains $17,500 million.<\/p><p>Next, we calculate the total post-transaction Firm Value (V).<\/p><p>V = MV<sub>e<\/sub> + MV<sub>d<\/sub> = $17, 500m + $5, 000m = $22, 500 million.<\/p><p>The new capital structure weights.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0159.webp\" style=\"max-width:min(100%,317px)\" alt=\"$17,500\"><p>Weight of Equity (we) =<sub> $22,500<\/sub>= 77.78%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0160.webp\" style=\"max-width:min(100%,305px)\" alt=\"$5,000\"><p>Weight of Debt (wd) =<sub> $22,500<\/sub>= 22.22%.<\/p><p>The new WACC.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0161.webp\" style=\"max-width:min(100%,451px)\" alt=\"WACC = (we ×re ) + (wd ×rd ×(1 −t)) WACC = (0.7778 × 10.0%) + (0.2222 × 5.0% × (1 −0.25)) WACC = 7.778% + 0.833% = 8.611%.\"><p><b>B is incorrect.<\/b> The answer represents the pre-transaction WACC. You would arrive at this value if you made the common mistake of using the original capital structure weights instead of recalculating them to reflect the new debt from the acquisition. The pre-transaction WACC is 8.84%.<\/p><p><b>C is incorrect.<\/b> You would get this answer if you correctly recalculated the capital structure<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0162.webp\" style=\"max-width:min(100%,757px)\" alt=\"weights  but  forgot  to  apply  the  tax  shield  (1 −t) to  the  cost  of  debt: \"><p>(0.7778 × 10.0%) + (0.2222 × 5.0%) = 8.89%.<\/p><p class=\"los\">Corporate Issuers, Learning Module 4: Corporate Restructuring LOS 4(d): Demonstrate how corporate restructurings affect an issuer’s EPS, net debt to EBITDA ratio, and weighted average cost of capital.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 23 · Câu 89–92 · VeriData Analytics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Anya Sharma, CFA, is an equity analyst reviewing VeriData Analytics (VeriData). VeriData is a<\/p><p>diversified technology company that reports two operating segments: a mature, highly profitable<\/p><p>legacy segment and a high-growth, lower-margin emerging segment. The company’s share price<\/p><p>has been flat for two years. A significant shareholder advocating strategic change recently<\/p><p>acquired a material stake and publicly claimed that VeriData is trading at a “conglomerate<\/p><p>discount” and should consider strategic alternatives.<\/p><p>Sharma notes that VeriData’s current enterprise value is $20 billion, and it has a data security<\/p><p>division and a high-growth, lower-margin cloud AI division.<\/p><p>Sharma gathers financial data for VeriData’s segments for the last twelve months (LTM) and<\/p><p>compiles valuation data for comparable peer companies in Exhibit 1 to evaluate the investor’s<\/p><p>claim. She notes that corporate/unallocated costs amount to $100 million annually and are not<\/p><p>included in the segment EBITDA figures. For her sum-of-the-parts analysis, she plans to allocate<\/p><p>these costs entirely to the more mature Data Security segment.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0153.webp\" style=\"max-width:min(100%,493px)\" alt=\"Exhibit 1: VeriData Segment &amp; Peer Valuation Data ($ millions) VeriData Segment Data (LTM) Revenues EBITDA Data Security $8, 000 $2, 500 Cloud AI $2, 000 $200 Peer Valuation Data Peer Median Multiple Data Security Peers EV / EBITDA 7.5x Cloud AI Peers EV / Sales 5.0x\"><p>In response to activist pressure, VeriData’s board announced it is conducting a &quot;comprehensive<\/p><p>review of strategic alternatives to maximize stakeholder value.&quot; Sharma believes two main<\/p><p>options are being considered. The first is the outright sale of the Data Security division to a<\/p><p>private equity firm, which will sharpen the company&#x27;s focus on its high-growth Cloud AI<\/p><p>business.<\/p><p>The second option management seems to favor is strengthening the Cloud AI business by<\/p><p>acquiring SynthLogic, a private, fast-growing artificial intelligence company. Management<\/p><p>believes this move aligns with its current strategy. They have proposed a deal to acquire SynthLogic for a total consideration of $3,000 million.<\/p><p>To assess the financial impact of the proposed acquisition, Sharma gathers data on VeriData’s<\/p><p>pre-transaction capital structure in Exhibit 2. The acquisition of SynthLogic would be financed by<\/p><p>issuing $1,000 million in new debt and using $2,000 million of cash on hand.<\/p><p>Exhibit 2: VeriData Pre-Transaction Capital Structure &amp; Costs ($ millions)<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0154.webp\" style=\"max-width:min(100%,292px)\" alt=\"Metric Value Market Value of Equity $17,500 Total Debt $4, 000 Cash and Equivalents $1, 500 Cost of Equity (re) 10.0% Pre-tax Cost of Debt (rd) 5.0% Corporate Tax Rate 25.0%\"><\/div><\/details><div class=\"qtext\"><p>After financing and completing the acquisition of SynthLogic, VeriData’s pro forma Weighted Average Cost of Capital (WACC) will be closest to:<\/p><\/div>", "subj": "corporate"}, {"n": 92, "q": "Based on the framework for the initial evaluation of a corporate restructuring, which statement regarding the acquisition of SynthLogic is most accurate?", "opts": ["The acquisition is immaterial because the target is a private company.", "The acquisition is material because its value exceeds 10% of VeriData’s pre- transaction enterprise value.", "The acquisition is material primarily because it signals a significant change in VeriData's corporate strategy."], "ans": "B", "expl": "Materiality is judged by size and strategic fit; the text applies a benchmark that labels an acquisition 'large' when its value exceeds 10% of the acquirer's pre-announcement enterprise value. Acquisition Value: $3,000 million VeriData's Pre-transaction EV: $20,000 million Ratio of Transaction Value to EV = $$32,00,00000mm= 15.0% Since 15% is greater than the 10% threshold, the acquisition is considered material based on its size. A is incorrect. The fact that a target is private does not determine materiality. Over 80% of acquisition targets are private companies. C is incorrect. The vignette states the acquisition aligns with the current strategy, meaning it is not a strategic departure. While \"fit\" is a component of the initial evaluation, the primary driver of materiality in this specific case is the transaction's large size relative to the company's enterprise value.", "explhtml": "<p>Materiality is judged by size and strategic fit; the text applies a benchmark that labels an acquisition &#x27;large&#x27; when its value exceeds 10% of the acquirer&#x27;s pre-announcement enterprise value.<\/p><p>Acquisition Value: $3,000 million<\/p><p>VeriData&#x27;s Pre-transaction EV: $20,000 million<\/p><p>Ratio of Transaction Value to EV =<sup> $<\/sup><sub>$<\/sub><sup>3<\/sup><sub>2<\/sub><sup>,<\/sup><sub>0<\/sub><sup>0<\/sup><sub>,<\/sub><sup>0<\/sup><sub>0<\/sub><sup>0<\/sup><sub>00<\/sub><sup>m<\/sup><sub>m<\/sub>= 15.0%<\/p><p>Since 15% is greater than the 10% threshold, the acquisition is considered material based on its size.<\/p><p><b>A is incorrect.<\/b> The fact that a target is private does not determine materiality. Over 80% of acquisition targets are private companies.<\/p><p><b>C is incorrect.<\/b> The vignette states the acquisition aligns with the current strategy, meaning it is not a strategic departure. While &quot;fit&quot; is a component of the initial evaluation, the primary driver of materiality in this specific case is the transaction&#x27;s large size relative to the company&#x27;s enterprise value.<\/p><p class=\"los\">Corporate Issuers, Learning Module 4: Corporate Restructuring LOS 4(e): Evaluate corporate investment actions, including equity investments, joint ventures, and acquisitions.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 23 · Câu 89–92 · VeriData Analytics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Anya Sharma, CFA, is an equity analyst reviewing VeriData Analytics (VeriData). VeriData is a<\/p><p>diversified technology company that reports two operating segments: a mature, highly profitable<\/p><p>legacy segment and a high-growth, lower-margin emerging segment. The company’s share price<\/p><p>has been flat for two years. A significant shareholder advocating strategic change recently<\/p><p>acquired a material stake and publicly claimed that VeriData is trading at a “conglomerate<\/p><p>discount” and should consider strategic alternatives.<\/p><p>Sharma notes that VeriData’s current enterprise value is $20 billion, and it has a data security<\/p><p>division and a high-growth, lower-margin cloud AI division.<\/p><p>Sharma gathers financial data for VeriData’s segments for the last twelve months (LTM) and<\/p><p>compiles valuation data for comparable peer companies in Exhibit 1 to evaluate the investor’s<\/p><p>claim. She notes that corporate/unallocated costs amount to $100 million annually and are not<\/p><p>included in the segment EBITDA figures. For her sum-of-the-parts analysis, she plans to allocate<\/p><p>these costs entirely to the more mature Data Security segment.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0153.webp\" style=\"max-width:min(100%,493px)\" alt=\"Exhibit 1: VeriData Segment &amp; Peer Valuation Data ($ millions) VeriData Segment Data (LTM) Revenues EBITDA Data Security $8, 000 $2, 500 Cloud AI $2, 000 $200 Peer Valuation Data Peer Median Multiple Data Security Peers EV / EBITDA 7.5x Cloud AI Peers EV / Sales 5.0x\"><p>In response to activist pressure, VeriData’s board announced it is conducting a &quot;comprehensive<\/p><p>review of strategic alternatives to maximize stakeholder value.&quot; Sharma believes two main<\/p><p>options are being considered. The first is the outright sale of the Data Security division to a<\/p><p>private equity firm, which will sharpen the company&#x27;s focus on its high-growth Cloud AI<\/p><p>business.<\/p><p>The second option management seems to favor is strengthening the Cloud AI business by<\/p><p>acquiring SynthLogic, a private, fast-growing artificial intelligence company. Management<\/p><p>believes this move aligns with its current strategy. They have proposed a deal to acquire SynthLogic for a total consideration of $3,000 million.<\/p><p>To assess the financial impact of the proposed acquisition, Sharma gathers data on VeriData’s<\/p><p>pre-transaction capital structure in Exhibit 2. The acquisition of SynthLogic would be financed by<\/p><p>issuing $1,000 million in new debt and using $2,000 million of cash on hand.<\/p><p>Exhibit 2: VeriData Pre-Transaction Capital Structure &amp; Costs ($ millions)<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0154.webp\" style=\"max-width:min(100%,292px)\" alt=\"Metric Value Market Value of Equity $17,500 Total Debt $4, 000 Cash and Equivalents $1, 500 Cost of Equity (re) 10.0% Pre-tax Cost of Debt (rd) 5.0% Corporate Tax Rate 25.0%\"><\/div><\/details><div class=\"qtext\"><p>Based on the framework for the initial evaluation of a corporate restructuring, which statement regarding the acquisition of SynthLogic is most accurate?<\/p><\/div>", "subj": "corporate"}, {"n": 93, "q": "The dividend yield after the 2-for-1 stock split is most likely to:", "opts": ["Double", "Remain unchanged", "Halve"], "ans": "A", "expl": "Before the stock split, the dividend yield was After the 2-for-1 split, the share price is halved. Post Stock Split Share Price = 322 = €16 After the stock split, management pledged to maintain the same dividend per share (€1.20). Dividend Yield = Share price = 1.20 16 = 0.075 or 7.5% The dividend yield doubles immediately after the 2-for-1 stock split because the share price is halved while the dividend per share remains unchanged. B is incorrect. A stock split changes the number of shares outstanding and (typically) the quoted price per share, but not the firm’s aggregate equity value. The only way the dividend yield would remain unchanged is if the dividend per share and the share price changed by the same proportion. In this case, the dividend per share is explicitly unchanged, while the post-split price is halved—a 0% change in dividend versus a 50% change in price—so the yield cannot remain the same. C is incorrect. For the dividend yield to halve, the numerator (dividend per share) would need to fall by half while the price remained constant, or the denominator (share price) would need to double while the dividend remained unchanged. Neither event occurs: management pledges the dividend per share will stay at €1.20, and a 2-for-1 split halves the share price rather than doubling it; consequently, the yield increases (in fact, it doubles), not halves.", "explhtml": "<p>Before the stock split, the dividend yield was<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0164.webp\" style=\"max-width:min(100%,431px)\" alt=\"Dividend Yield = Dividend per share Share price = 1.20 32 = 0.0375 or 3.75%.\"><p>After the 2-for-1 split, the share price is halved.<\/p><p>Post Stock Split Share Price =<sup> 3<\/sup><sub>2<\/sub><sup>2<\/sup> = €16<\/p><p>After the stock split, management pledged to maintain the same dividend per share (€1.20).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0165.webp\" style=\"max-width:min(100%,439px)\" alt=\"Dividend per share\"><p>Dividend Yield =<sub> Share price<\/sub> = 1.20 16 = 0.075 or 7.5%<\/p><p>The dividend yield doubles immediately after the 2-for-1 stock split because the share price is halved while the dividend per share remains unchanged.<\/p><p><b>B is incorrect.<\/b> A stock split changes the number of shares outstanding and (typically) the quoted price per share, but not the firm’s aggregate equity value. The only way the dividend yield would remain unchanged is if the dividend per share and the share price changed by the same proportion. In this case, the dividend per share is explicitly unchanged, while the post-split price is halved—a 0% change in dividend versus a 50% change in price—so the yield cannot remain the same.<\/p><p><b>C is incorrect.<\/b> For the dividend yield to halve, the numerator (dividend per share) would need to fall by half while the price remained constant, or the denominator (share price) would need to double while the dividend remained unchanged. Neither event occurs: management pledges the dividend per share will stay at €1.20, and a 2-for-1 split halves the share price rather than doubling it; consequently, the yield increases (in fact, it doubles), not halves.<\/p><p class=\"los\">Corporate Issuers, Learning Module 1: Analysis of Dividends and Share Repurchases, LOS 1(a): Describe the expected effect of regular cash dividends, extra dividends, liquidating dividends, stock dividends, stock splits, and reverse stock splits on shareholders’ wealth and a company’s financial ratios.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 24 · Câu 93–96 · Zenith Aerocomposites PLC (ZAP)<\/summary><div class=\"vig-body\"><p>Zenith Aerocomposites PLC (ZAP), a Dublin-listed manufacturer of lightweight aircraft fuselage<\/p><p>panels, has 120.0 million ordinary shares outstanding and is trading at €32.00 per share. The<\/p><p>board has maintained a cash dividend of €1.20 per share for six consecutive years. For the year<\/p><p>ending 2025, management forecasts net income of €180 million and free cash flow to equity<\/p><p>(FCFE) of €140 million. The finance function recommends adopting a constant 40% payout ratio<\/p><p>to better align distributions with the earnings volatility typical of the cyclical aerospace sector.<\/p><p>Prospective retail-investor interest prompts directors to approve a 2-for-1 stock split effective 30<\/p><p>June 2025. Management pledges to maintain the €1.20 cash dividend per share after the split.<\/p><p>ZAP’s share price drifts to €12 despite record order backlogs. The CFO announces a €324 million<\/p><p>tender offer to repurchase 12 million shares at €18, funded entirely with new 5-year notes priced<\/p><p>at 4 % after tax.<\/p><p>Ireland applies the classical double-taxation system:<\/p><p>Corporate tax on pretax profit: 12.5 %<\/p><p>Personal tax on dividends: 20 %<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0163.webp\" style=\"max-width:min(100%,224px)\" alt=\"Capital-gains tax: 15 %\"><p>Assume all earnings are distributed and shareholders are fully taxable residents.<\/p><\/div><\/details><div class=\"qtext\"><p>The dividend yield after the 2-for-1 stock split is most likely to:<\/p><\/div>", "subj": "corporate"}, {"n": 94, "q": "The board’s decision after the split best exemplifies which dividend-policy theory?", "opts": ["Bird-in-hand theory", "MM dividend irrelevance proposition", "Tax-preference theory"], "ans": "A", "expl": "The board’s decision to maintain the €1.20 dividend per share aligns with the bird-in-hand theory. By keeping the dividend constant, the company signals its commitment to providing shareholders with reliable income, which may reduce investor uncertainty and increase the perceived value of the stock. This is especially relevant in a cyclical industry like aerospace, where earnings can be volatile. A stable dividend provides reassurance to shareholders during periods of uncertainty. B is incorrect. The MM proposition assumes perfect markets and argues that dividend policy does not affect firm value. However, real-world factors such as taxes, transaction costs, and investor preferences make dividends relevant. The board’s explicit decision to maintain the dividend contradicts the MM proposition, as it implies that dividends do matter to shareholders. C is incorrect. Under tax-preference theory, investors would prefer the company to pay lower dividends and allow them to realize capital gains instead, as capital gains are taxed at a lower rate (15%) compared to dividends (20%). By maintaining the €1.20 dividend per share, the company is prioritizing dividend payments over minimizing tax liabilities for shareholders. This is inconsistent with tax-preference theory.", "explhtml": "<p>The board’s decision to maintain the €1.20 dividend per share aligns with the bird-in-hand theory. By keeping the dividend constant, the company signals its commitment to providing shareholders with reliable income, which may reduce investor uncertainty and increase the perceived value of the stock.<\/p><p>This is especially relevant in a cyclical industry like aerospace, where earnings can be volatile. A stable dividend provides reassurance to shareholders during periods of uncertainty.<\/p><p><b>B is incorrect.<\/b> The MM proposition assumes perfect markets and argues that dividend policy does not affect firm value. However, real-world factors such as taxes, transaction costs, and investor preferences make dividends relevant. The board’s explicit decision to maintain the dividend contradicts the MM proposition, as it implies that dividends do matter to shareholders.<\/p><p><b>C is incorrect.<\/b> Under tax-preference theory, investors would prefer the company to pay lower dividends and allow them to realize capital gains instead, as capital gains are taxed at a lower rate (15%) compared to dividends (20%). By maintaining the €1.20 dividend per share, the company is prioritizing dividend payments over minimizing tax liabilities for shareholders. This is inconsistent with tax-preference theory.<\/p><p class=\"los\">Corporate Issuers, Learning Module 1: Analysis of Dividends and Share Repurchases LOS 1(a): Describe the expected effect of regular cash dividends, extra dividends, liquidating dividends, stock dividends, stock splits, and reverse stock splits on shareholders’ wealth and a company’s financial ratios.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 24 · Câu 93–96 · Zenith Aerocomposites PLC (ZAP)<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Zenith Aerocomposites PLC (ZAP), a Dublin-listed manufacturer of lightweight aircraft fuselage<\/p><p>panels, has 120.0 million ordinary shares outstanding and is trading at €32.00 per share. The<\/p><p>board has maintained a cash dividend of €1.20 per share for six consecutive years. For the year<\/p><p>ending 2025, management forecasts net income of €180 million and free cash flow to equity<\/p><p>(FCFE) of €140 million. The finance function recommends adopting a constant 40% payout ratio<\/p><p>to better align distributions with the earnings volatility typical of the cyclical aerospace sector.<\/p><p>Prospective retail-investor interest prompts directors to approve a 2-for-1 stock split effective 30<\/p><p>June 2025. Management pledges to maintain the €1.20 cash dividend per share after the split.<\/p><p>ZAP’s share price drifts to €12 despite record order backlogs. The CFO announces a €324 million<\/p><p>tender offer to repurchase 12 million shares at €18, funded entirely with new 5-year notes priced<\/p><p>at 4 % after tax.<\/p><p>Ireland applies the classical double-taxation system:<\/p><p>Corporate tax on pretax profit: 12.5 %<\/p><p>Personal tax on dividends: 20 %<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0163.webp\" style=\"max-width:min(100%,224px)\" alt=\"Capital-gains tax: 15 %\"><p>Assume all earnings are distributed and shareholders are fully taxable residents.<\/p><\/div><\/details><div class=\"qtext\"><p>The board’s decision after the split best exemplifies which dividend-policy theory?<\/p><\/div>", "subj": "corporate"}, {"n": 95, "q": "The debt-financed tender offer most likely conveys to the market that Zenith’s shares are:", "opts": ["Overvalued and financially risky", "Undervalued with limited investment opportunities", "Properly valued, but management seeks EPS inflation"], "ans": "B", "expl": "When a company repurchases its own shares, it signals that management believes the shares are undervalued. Issuing debt to fund the repurchase suggests that the company has limited immediate investment opportunities and views debt as a cheaper source of financing compared to equity. A is incorrect. If shares were overvalued, management would not repurchase them, as this would destroy shareholder value. Additionally, taking on debt when shares are overvalued increases financial risk unnecessarily. C is incorrect. While share repurchases can inflate EPS, this is not the primary reason for the tender offer. The significant premium paid (€18 vs. €12) clearly indicates that management views the stock as undervalued rather than properly valued.", "explhtml": "<p>When a company repurchases its own shares, it signals that management believes the shares are undervalued.<\/p><p>Issuing debt to fund the repurchase suggests that the company has limited immediate investment opportunities and views debt as a cheaper source of financing compared to equity.<\/p><p><b>A is incorrect.<\/b> If shares were overvalued, management would not repurchase them, as this would destroy shareholder value. Additionally, taking on debt when shares are overvalued increases financial risk unnecessarily.<\/p><p><b>C is incorrect.<\/b> While share repurchases can inflate EPS, this is not the primary reason for the tender offer. The significant premium paid (€18 vs. €12) clearly indicates that management views the stock as undervalued rather than properly valued.<\/p><p class=\"los\">Corporate Issuers, Learning Module 1: Analysis of Dividends and Share Repurchases LOS 1(c): Describe types of information (signals) that dividend initiations, increases, decreases, and omissions may convey.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 24 · Câu 93–96 · Zenith Aerocomposites PLC (ZAP)<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Zenith Aerocomposites PLC (ZAP), a Dublin-listed manufacturer of lightweight aircraft fuselage<\/p><p>panels, has 120.0 million ordinary shares outstanding and is trading at €32.00 per share. The<\/p><p>board has maintained a cash dividend of €1.20 per share for six consecutive years. For the year<\/p><p>ending 2025, management forecasts net income of €180 million and free cash flow to equity<\/p><p>(FCFE) of €140 million. The finance function recommends adopting a constant 40% payout ratio<\/p><p>to better align distributions with the earnings volatility typical of the cyclical aerospace sector.<\/p><p>Prospective retail-investor interest prompts directors to approve a 2-for-1 stock split effective 30<\/p><p>June 2025. Management pledges to maintain the €1.20 cash dividend per share after the split.<\/p><p>ZAP’s share price drifts to €12 despite record order backlogs. The CFO announces a €324 million<\/p><p>tender offer to repurchase 12 million shares at €18, funded entirely with new 5-year notes priced<\/p><p>at 4 % after tax.<\/p><p>Ireland applies the classical double-taxation system:<\/p><p>Corporate tax on pretax profit: 12.5 %<\/p><p>Personal tax on dividends: 20 %<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0163.webp\" style=\"max-width:min(100%,224px)\" alt=\"Capital-gains tax: 15 %\"><p>Assume all earnings are distributed and shareholders are fully taxable residents.<\/p><\/div><\/details><div class=\"qtext\"><p>The debt-financed tender offer most likely conveys to the market that Zenith’s shares are:<\/p><\/div>", "subj": "corporate"}, {"n": 96, "q": "Under Ireland’s double-taxation regime, the effective tax rate (ETR) on €1.00 of pretax earnings fully paid out as dividends is closest to:", "opts": ["30 %", "32.5 %", "40 %"], "ans": "A", "expl": "First, we calculate the after-tax profit available for dividends. The corporate tax rate is 12.5%, so the company pays: Corporate Tax = 1.00 × 12.5% = 0.125. The remaining profit available for dividends is: After-Tax Profit = 1.00 −0.125 = 0.875. Next, we calculate the personal tax on dividends. Shareholders pay a personal tax rate of 20% on the dividends they receive. The personal tax is: Personal Tax = 0.875 × 20% = 0.175 The total tax burden is the sum of the corporate tax and the personal tax: Total Tax = Corporate Tax + Personal Tax = 0.125 + 0.175 = 0.30. The ETR is the total tax burden expressed as a percentage of the original pretax earnings: Under Ireland’s double-taxation regime, the effective tax rate (ETR) on €1.00 of pretax earnings fully paid out as dividends is closest to 30%. B is incorrect. This figure would result from mistakenly applying the 20% personal tax to the pre-tax €1.00 (i.e., €0.20) and then adding the corporate tax (€0.125), resulting in €0.125 + €0.20 = €0.325 or 32.5%. That is incorrect under a classical system because shareholders pay tax on dividends received (the after-corporate-tax amount), not on the company’s pretax earnings. C is incorrect. No valid application of the stated statutory rates produces a 40% ETR. To create a 40% total tax on €1.00, the personal tax rate on dividends (r) would have to satisfy  €0.125 + €0.875 ⋅ r = €0.40 → r = €0.875 ≈ 31.43%, which is not the given 20% personal tax rate. Therefore 40% cannot be obtained from the rates in question.", "explhtml": "<p>First, we calculate the after-tax profit available for dividends.<\/p><p>The corporate tax rate is 12.5%, so the company pays:<\/p><p>Corporate Tax = 1.00 × 12.5% = 0.125.<\/p><p>The remaining profit available for dividends is:<\/p><p>After-Tax Profit = 1.00 −0.125 = 0.875.<\/p><p>Next, we calculate the personal tax on dividends.<\/p><p>Shareholders pay a personal tax rate of 20% on the dividends they receive. The personal tax is:<\/p><p>Personal Tax = 0.875 × 20% = 0.175<\/p><p>The total tax burden is the sum of the corporate tax and the personal tax:<\/p><p>Total Tax = Corporate Tax + Personal Tax = 0.125 + 0.175 = 0.30.<\/p><p>The ETR is the total tax burden expressed as a percentage of the original pretax earnings:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0166.webp\" style=\"max-width:min(100%,343px)\" alt=\"ETR = Pre-tax earnings Total tax × 100 = 0.30 1.00 × 100 = 30%\"><p>Under Ireland’s double-taxation regime, the effective tax rate (ETR) on €1.00 of pretax earnings fully paid out as dividends is closest to 30%.<\/p><p><b>B is incorrect.<\/b> This figure would result from mistakenly applying the 20% personal tax to the pre-tax €1.00 (i.e., €0.20) and then adding the corporate tax (€0.125), resulting in €0.125 + €0.20 = €0.325 or 32.5%. That is incorrect under a classical system because shareholders pay tax on dividends received (the after-corporate-tax amount), not on the company’s pretax earnings.<\/p><p><b>C is incorrect.<\/b> No valid application of the stated statutory rates produces a 40% ETR. To create a 40% total tax on €1.00, the personal tax rate on dividends (r) would have to satisfy <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0167.webp\" style=\"max-width:min(100%,756px)\" alt=\"€0.275\"><p>€0.125 + €0.875 ⋅ r = €0.40 → r =<sub> €0.875<\/sub> ≈ 31.43%, which is not the given 20% personal tax rate. Therefore 40% cannot be obtained from the rates in question.<\/p><p class=\"los\">Corporate Issuers, Learning Module 1: Analysis of Dividends and Share Repurchases LOS 1(f): Calculate and interpret the effective tax rate on a given currency unit of corporate earnings under double taxation, dividend imputation, and split-rate tax systems<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 24 · Câu 93–96 · Zenith Aerocomposites PLC (ZAP)<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Zenith Aerocomposites PLC (ZAP), a Dublin-listed manufacturer of lightweight aircraft fuselage<\/p><p>panels, has 120.0 million ordinary shares outstanding and is trading at €32.00 per share. The<\/p><p>board has maintained a cash dividend of €1.20 per share for six consecutive years. For the year<\/p><p>ending 2025, management forecasts net income of €180 million and free cash flow to equity<\/p><p>(FCFE) of €140 million. The finance function recommends adopting a constant 40% payout ratio<\/p><p>to better align distributions with the earnings volatility typical of the cyclical aerospace sector.<\/p><p>Prospective retail-investor interest prompts directors to approve a 2-for-1 stock split effective 30<\/p><p>June 2025. Management pledges to maintain the €1.20 cash dividend per share after the split.<\/p><p>ZAP’s share price drifts to €12 despite record order backlogs. The CFO announces a €324 million<\/p><p>tender offer to repurchase 12 million shares at €18, funded entirely with new 5-year notes priced<\/p><p>at 4 % after tax.<\/p><p>Ireland applies the classical double-taxation system:<\/p><p>Corporate tax on pretax profit: 12.5 %<\/p><p>Personal tax on dividends: 20 %<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap04/f0163.webp\" style=\"max-width:min(100%,224px)\" alt=\"Capital-gains tax: 15 %\"><p>Assume all earnings are distributed and shareholders are fully taxable residents.<\/p><\/div><\/details><div class=\"qtext\"><p>Under Ireland’s double-taxation regime, the effective tax rate (ETR) on €1.00 of pretax earnings fully paid out as dividends is closest to:<\/p><\/div>", "subj": "corporate"}];
const CFG = {"title": "AnalystPrep — Corporate Issuers", "subtitle": "CFA Level II · 96 câu · 24 item sets · AnalystPrep 2026", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);

  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>
<!--baii-calc-end-->

<!--restart-confirm-start-->
<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
</body>
