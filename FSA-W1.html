<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "If a company pays a cash dividend to its shareholders, the effect of this payment on the company's retained earnings is best reflected in the:", "opts": ["income statement.", "statement of changes in equity.", "statement of comprehensive income."], "ans": "B", "expl": "Equity is the owners' investment in a company; the statement of changes in equity details the changes in shareholders' equity from the\ncompany's transactions with its owners. It reports differences that occur between two reporting periods, including information about issuances\nof new equity, dividend payments, and stock repurchases, and shows how these events affect retained earnings, paid-in capital, and other\nitems of shareholders' equity.\n(Choice A) Dividends are not considered expenses since they are distributions of previous periods' profits, not costs of generating current net\nincome; therefore, they are not reported in the income statement.\n(Choice C) The statement of comprehensive income, which includes the income statement, explains changes in equity other than transactions\nwith owners and is a tool to evaluate a company's profitability.\nThings to remember:\nThe statement of changes in equity presents a company's transactions with its owners, including information about issuances of new equity,\ndividend payments, and stock repurchases, and shows how these events affect retained earnings, paid-in capital, and other items of shareholders'\nequity.\nDescribe the importance of regulatory filings, financial statement notes and supplementary information, management’s commentary, and audit\nreports", "qhtml": null}, {"n": 2, "q": "An auditor for a US publicly traded company most likely expresses an opinion on a company's:", "opts": ["strategy execution.", "internal control system.", "pro forma financial statements."], "ans": "B", "expl": "Management's internal control (IC) regulatory requirements\nAssess IC's effectiveness using appropriate measures\nUphold IC's assessment with adequate proof\nWrite testimony stating IC's condition\nHire auditor to give opinion on company's IC\nUS law requires US public companies to have their annual financial statements and internal control systems audited. Management is fully\naccountable for the company's internal controls; to meet regulatory requirements, management must perform an assessment, substantiate the\nassessment, and provide a report. In addition, an independent auditor must provide an opinion on the effectiveness of the company's internal\ncontrol system.\n(Choice A) A company communicates the execution of its strategy in the management discussion and analysis section of its annual report. It is\nnot a part of the annual report that is audited, and auditors do not issue an opinion on it.\n(Choice C) Management may present pro forma financial statements to show core results. They are not audited since they are presented without\nadhering to US GAAP or IFRS. Since management may present results in the best light, some consider pro forma statements as examples of\naggressive accounting.\nThings to remember:\nUS law requires US public companies to be fully accountable for their internal control systems. One part of satisfying this requirement is to have\nan independent auditor express an opinion on the effectiveness of the internal control system.\nDescribe the importance of regulatory filings, financial statement notes and supplementary information, management’s commentary, and audit\nreports", "qhtml": null}, {"n": 3, "q": "Which of the following best describes the objective of financial statement audits?", "opts": ["Prevent management from engaging in fraud", "Guarantee that statements are true and presented fairly", "Evaluate the probability that statements are free of material errors"], "ans": "C", "expl": "Objective of audits\nReasonable assurance that statements are:\nPresented fairly\nFree from material misstatements, including:\nErrors\nFraud\nIllegal acts\nPrepared in accordance with US GAAP/IFRS\nThe objective of audits is to determine the likelihood that management's financial statements are free of material errors and prepared in\naccordance with local accounting standards (eg, IFRS). Auditors examine samples of a company's transactions and review its financial reporting\nprocess.\nBased on that evidence, auditors form a subjective opinion, deciding whether there is a reasonable assurance that the company recorded its\ntransactions and presented its financial statements fairly. Auditors express their opinions in a written auditor's report. Although investors prefer\nunqualified opinions, analysts must retain a degree of skepticism since auditor's reports are opinions, not facts.\n(Choice A) Preventing fraud is not the objective of audits since not every transaction is audited; however, auditors should obtain a reasonable\nassurance that financial statements are presented fairly.\n(Choice B) Auditors form an opinion as to whether financial statements are true and fairly presented. They cannot guarantee that a company's\nfinancial statements are true and fair.\nThings to remember:\nThe objective of audits is to obtain a reasonable assurance that a company's financial statements are free of material errors and prepared in\naccordance with local accounting standards (ie, presented fairly). Analysts must retain a degree of skepticism since auditor's reports are opinions,\nnot facts.\nDescribe the importance of regulatory filings, financial statement notes and supplementary information, management’s commentary, and audit\nreports", "qhtml": null}, {"n": 4, "q": "Which of the following best describes an activity involved in the process data step of the financial statement analysis framework?", "opts": ["Prepare a five-year forecast", "Collect five years of financial statements", "Explain insights from adjusted financial statements"], "ans": "A", "expl": "Financial statement analysis framework\nPhase Action Result\nArticulate purpose of analysis Written objective of analyses\nArticulate purpose\nDetermine the audience Nature of reporting\nObtain financial data Organized financial statements\nCollect data\nVisit company Insight to goals and operations\nAdjusted financial statements\nAdjust numbers\nProcess data Common-sized statements\nCalculate data\nFinancial ratios and forecasts\nAnalyze/interpret data Understand the processed data Analyst's report\nDevelop recommendation Plot course of action Recommendation report\nFollow-up Repeat analysis as data changes Reissue analyses and reports\nThe financial statement analysis framework is a series of six phases describing how financial statement analysis is accomplished. During the\ndata processing phase, analysts adjust the raw financial data obtained during the data collection phase. This may include making changes to\nreported financial statements to improve the comparability among companies due to accounting differences. It also may include preparing\nfinancial ratios or developing a forecast.\n(Choice B) Organizing multiple years of a company's financial statements is part of the data collection phase. During this phase, analysts collect\nand organize data (eg, reported financial statements) including management information, industry data, and economic statistics.\n(Choice C) Explaining insights from data that has been processed is part of the data interpretation phase. Interpreting data most often includes\nusing multiple pieces of adjusted data and formulating an opinion.\nThings to remember:\nThe financial statement analysis framework is a series of six phases describing the process of financial analysis. During the data processing\nphase, analysts may adjust the raw financial data to make financial statements, ratios, and forecasts more comparable.\nDescribe the steps in the financial statement analysis framework", "qhtml": null}, {"n": 5, "q": "An independent auditor determines that a company's financial statements are fairly presented except that the company's records regarding accounts payable are materially incomplete. The auditor will most appropriately give an opinion that is:", "opts": ["adverse.", "qualified.", "unqualified."], "ans": "B", "expl": "Regulatory agencies usually require that publicly traded companies have their annual financial reports audited by an independent accounting firm.\nAuditors use sampling techniques with an overall goal to:\nprovide reasonable assurance that the financial statements are free from material errors or misstatements and\ndetermine whether the financial statements have been prepared in accordance with the applicable accounting standards (eg, US GAAP,\nIFRS).\nThe auditor then gives an opinion based on what is sampled. A qualified opinion is used when financial statements are largely presented fairly\nbut:\nthe audit is limited in scope (eg, incomplete records) or\nthere is an exception from the applicable accounting standards.\nA qualified audit opinion suggests that a company's financial statements are less reliable than statements with an unqualified, or \"clean,\" opinion.\nIn this situation, the auditor appends the opinion with additional details explaining the exception so users of the financial statements can decide\nwhether the exception is important.\n(Choice A) An adverse opinion is given when an auditor determines that a company's financial statements differ materially from applicable\naccounting standards in a way that would affect investors' decision-making.\n(Choice C) An unqualified opinion is given when an auditor deems that the financial reports are fairly presented in all respects and in accordance\nwith applicable accounting standards.\nThings to remember:\nAn audit concludes with the auditor's assignment of an unqualified, qualified, or adverse opinion to financial reports, which depends on the reports'\nscope, quality, and adherence to accounting standards. A qualified audit opinion implies that the audit was limited in scope (eg, incomplete\nrecords) or there was an exception from the applicable accounting standards. Companies prefer to receive an unqualified audit opinion.\nDescribe the importance of regulatory filings, financial statement notes and supplementary information, management’s commentary, and audit\nreports", "qhtml": null}, {"n": 6, "q": "The role of a balance sheet is best described as a way to convey information about a company's:", "opts": ["cash inflows and outflows.", "performance and profitability.", "resources and claims on resources."], "ans": "C", "expl": "The role of a company's financial statements is to provide decision-makers (eg, investors, lenders) with economic information about a company. A\ncompany's balance sheet is a snapshot of the company's assets and liabilities on a specific date (eg, year-end). One-way analysts evaluate a\ncompany's financial position is by assessing the company's resources (ie, assets) and the claims on those resources (ie, liabilities and equities).\n(Choice A) Cash flow statements, not balance sheets, show cash collections (ie, inflows) and cash payments (ie, outflows) during a period. Cash\nflow statements show a company's ability to generate cash; investors prefer companies with consistent cash generation since this can fund future\ngrowth opportunities.\n(Choice B) Both a company's income statement and its cash flow statement, not its balance sheet, convey a measure of a company's\nperformance. The income statement shows how profitable the company is over a period; a cash flow statement presents the company's change in\ncash during a period.\nThings to remember:\nThe role of a company's balance sheet is to show its assets, liabilities, and equity at a point in time. Income statements reveal profitability. Cash\nflow statements offer insight into a company's ability to generate cash.\nDescribe the importance of regulatory filings, financial statement notes and supplementary information, management’s commentary, and audit\nreports", "qhtml": null}, {"n": 7, "q": "An analyst is responsible for monitoring developments in financial reporting standards. Which of the following is least likely to help the analyst?", "opts": ["Examining standard setters' exposure drafts.", "Monitoring changes in standards from a preparer's perspective.", "Checking companies' disclosures regarding their new accounting policies."], "ans": "B", "expl": "As financial reporting standards evolve, analysts must monitor ongoing developments since new and changing standards can impact financial\nanalyses. Since they are not accountants, analysts should monitor standards from a user's, not a preparer's, perspective. They can accomplish\nthis by staying aware of new products and transactions, reviewing the actions of standard setters, and identifying new critical accounting\npolicies from company disclosures.\nIt is important to stay current on new financial businesses, such as fintech companies, by reviewing business journals. Reading exposure drafts\nfrom the International Accounting Standards Board, Financial Accounting Standards Board, and CFA Institute websites increases awareness of\nupcoming changes in financial reporting. However, analysts should expect a lag between a new accounting transaction and its eventual reporting\nstandard. Reviewing a company's annual report provides information about new accounting policies (Choices A and C).\nThings to remember:\nAnalysts should monitor evolving financial reporting standards from a user's perspective. They can accomplish this by staying aware of new\nproducts and transactions, reviewing the actions of standard setters, and identifying new critical accounting policies from company disclosures.\nDescribe implications for financial analysis of alternative financial reporting systems and the importance of monitoring developments in financial\nreporting standards", "qhtml": null}, {"n": 8, "q": "Based on the financial statement analysis framework, which of the following is least likely a source of information when collecting input data?", "opts": ["Industry and economic data", "Financial statement forecasts", "Discussions with management"], "ans": "B", "expl": "Financial statement analysis framework\nPhase Action Result\nArticulate purpose of analysis Written objective of analysis\nArticulate purpose\nDetermine the audience Nature of reporting\nObtain financial data Organized financial statements\nCollect data\nVisit company Insight into goals and operations\nAdjusted financial statements\nAdjust numbers\nProcess data Common-sized statements\nCalculate data\nFinancial ratios and forecasts\nAnalyze/interpret data Understand the processed data Analyst's report\nDevelop recommendation Plot course of action Recommendation report\nFollow-up Repeat analysis as data changes Reissue analyses and reports\nThe financial statement analysis framework is a series of six phases that describe how financial statement analysis is accomplished when\nevaluating investments in a company's securities. In each phase, the analyst acts on information and turns it into a result that can be used to\ncomplete the next phase. In the data collection phase, an analyst collects all pertinent data after articulating the purpose(s) of the analysis. Data\ncollected can be quantitative and qualitative items pertaining to:\nMacroeconomic data (eg, GDP, inflation)\nThe prospects of the industry in which the company operates (Choice A)\nThe prospects of the company within the industry (eg, historical financial data, discussions with management) (Choice C)\nThe result of this phase is a collection of data that can be processed in the data processing phase. The results of processing the data include:\nFinancial statement forecasts\nRatios and common-sized financial statements\nCharts and graphs\nThis data can then be used to analyze the company as an investment.\nThings to remember:\nThe financial statement analysis framework describes how financial statement analysis is accomplished when evaluating investments in a\ncompany's securities. The data collection phase results in a collection of data that can be processed in the data processing phase. The results of\nprocessing the data include financial statement forecasts, which can be used to analyze the company as an investment.\nDescribe the steps in the financial statement analysis framework", "qhtml": null}, {"n": 9, "q": "Which of the following is most likely an external source of information that analysts use?", "opts": ["Peer analysis", "Proxy statement", "Earnings conference call"], "ans": "A", "expl": "Analysts use both external and internal information when researching companies; it is critical for insightful financial statement analysis. External\ninformation refers to information not published by the company. Internal information refers to information produced by the company. Examples\nof external data include information from central banks, industry associations (eg, peer analysis), and the press.\n(Choice B) A proxy statement is prepared by the company when it seeks shareholder votes (eg, for board member selection). It includes voting\ninstructions, executive pay structure, and auditor compensation.\n(Choice C) Earnings conference calls are discussions between management and the investing public. Management explains results and\nsometimes provides guidance on forward-looking issues. Most often, a company holds its earnings calls immediately after announcing its\nearnings.\nThings to remember:\nExternal information refers to information not published by the company. Internal information refers to information produced by the company.\nAnalysts use both external and internal information.\nDescribe information sources that analysts use in financial statement analysis besides annual and interim financial reports", "qhtml": null}, {"n": 10, "q": "An analyst examines the last five years of a company's financial statements. Which of the following would be best to use to analyze the company's ability to fund growth opportunities?", "opts": ["Income statement", "Cash flow statement", "Statement of changes in equity"], "ans": "B", "expl": "Cash flow statements show how a company collects cash (ie, cash inflows) and spends cash (ie, cash outflows). Cash flows are classified as\noperating, investing, or financing activities based on their source or use. Cash from operations (CFO) shows how the company generated cash\nfrom its core business.\nCFO is typically a cheaper and more sustainable source of cash than investing or financing activities; a company that reliably generates CFO is in\na better position to fund growth opportunities than one that does not. Analysts can examine multiple years of CFO to determine whether the\ncompany consistently generates cash from its core business; this gives investors confidence that the company can continue to fund growth\nopportunities.\n(Choice A) An income statement exhibits a company's profitability (ie, revenue minus expenses). In this case, it is not the best statement to use\nsince accrual accounting aligns revenues with expenses during a period, regardless of whether cash was exchanged. Although profitability is\nimportant, it does not reflect cash generation.\n(Choice C) A statement of changes in equity presents the increases (eg, issuances of capital) and decreases (eg, dividend payments) to the\nvalue of owners' investment in the firm. Analyzing a statement of changes in equity does not explain how the company could fund new projects.\nThings to remember:\nThe role of cash flow statements is to present information regarding cash inflows (cash collected) and outflows (cash used) during a period.\nConsistent cash generation from its core business gives investors confidence that the company can continue funding growth opportunities.\nDescribe the importance of regulatory filings, financial statement notes and supplementary information, management’s commentary, and audit\nreports", "qhtml": null}, {"n": 11, "q": "The purpose of management's commentary in the annual report is most likely to:", "opts": ["illustrate the compensation structure of senior executives and directors.", "explain the company's goals and risks associated with not reaching them.", "provide reasonable assurance that the financial statements are fairly presented."], "ans": "B", "expl": "Management's commentary, also known as management's discussion and analysis (MD&A), is a section of a company's annual report. It\nexplains current results and highlights significant events. Suggested elements of the MD&A include the company's goals, financial results, and\nstock performance. Most regulatory agencies require publicly traded companies to publish the MD&A.\nThe MD&A is a summary of how the company did in the past year and provides information on its achievements and setbacks. Topics\nmanagement may cover in the MD&A include how the general economy impacted results, sales performance, and profitability. The MD&A may\nalso provide investors with updates on its competition and specific obstacles the company is facing.\n(Choice A) The proxy statement, not management's commentary, illustrates the compensation structure of senior executives and directors.\n(Choice C) The auditor's report, not the MD&A, states that the auditors, not management, provide reasonable assurance that the financial\nstatements are fairly presented.\nThings to remember:\nManagement's commentary, also known as management's discussion and analysis (MD&A), is a section of a company's annual report. It explains\ncurrent results and highlights significant events. Elements of the MD&A include descriptions of the company's operations, current goals, financial\nresults, and stock performance.\nDescribe the importance of regulatory filings, financial statement notes and supplementary information, management’s commentary, and audit\nreports", "qhtml": null}, {"n": 12, "q": "The notes to a company's financial statements most likely contain:", "opts": ["details on the company's strategic objectives.", "accounting estimates used in the statements' preparation.", "an evaluation of the appropriateness of the statements' presentation."], "ans": "B", "expl": "The notes (ie, footnotes) are an essential part of a complete set of annual financial statements. They offer explanatory calculations (ie,\nestimates) and detailed accounting information that analysts read to improve their comprehension of the financial statements. Since it is\nconsidered a part of the financial statements, footnote information is audited.\nAnalysts use the footnotes to understand reporting differences (eg, FIFO versus LIFO) since US GAAP and IFRS allow companies flexibility in\npreparing financial statements. Using the footnotes, analysts can adjust the financials to make them comparable to other companies' statements.\n(Choice A) The details on a company's strategic objectives and risks are written in the management's discussion and analysis, a supplemental\ndisclosure that is not considered part of the footnotes.\n(Choice C) An evaluation of the appropriateness of the statements' presentation describes the auditor's report. The auditor's report supplements\na company's annual report; it is not contained in the footnotes. The auditor's report is an independent opinion regarding whether the company\nfairly presented its financials and abided by local accounting standards.\nThings to remember:\nThe notes (ie, footnotes), an essential part of a complete set of annual financial statements, describe the calculations, accounting policies, and\nestimates used to prepare the statements. The footnotes are an excellent source of information for adjusting company reports for accounting\ndifferences.\nDescribe the importance of regulatory filings, financial statement notes and supplementary information, management’s commentary, and audit\nreports", "qhtml": null}, {"n": 13, "q": "Which of the following least likely describes the role of financial statement analysis?", "opts": ["Supply information about a company's financial position to market participants", "Evaluate the intrinsic value of a stock based on data from a company and the market", "Develop guidance about a company's future operations based on its past performance"], "ans": "A", "expl": "The role of financial reporting, not financial statement analysis, is to disseminate data about a company's business and financial situation to the\nmarketplace. Companies summarize data to show how they have performed and explain the results. Accounting standards (eg, IFRS and US\nGAAP) set the rules for how companies record the data and produce summaries.\nFinancial statement analysis uses these financial reports to appraise a company's past, present, and future execution of its goals and economic\nfitness. The role of financial statement analysis is to make investment decisions (eg, buy or sell) using these reports. Types of decisions\nanalysts make include merger and acquisition evaluations, conclusions of creditworthiness, forecasts of future earnings, and security selections\n(Choices B and C).\nThings to remember:\nThe role of financial statement analysis is to make investment decisions using companies' financial reports. Types of decisions analysts make\ninclude merger and acquisition evaluations, conclusions of creditworthiness, and stock selections. The role of financial reporting, not financial\nstatement analysis, is to disseminate data about a company's business and financial situation to the marketplace.\nDescribe the roles of financial statement analysis", "qhtml": null}, {"n": 14, "q": "Income statement elements most likely reflect:", "opts": ["values at a point in time.", "performance over a certain period.", "inflows and outflows of cash transactions."], "ans": "B", "expl": "An income statement shows the results of a firm's business activity over a specific period (eg, fiscal year, quarter). It displays how much\nexpense the firm took to produce the revenue generated during the period.\n(Choice A) Balance sheet elements (ie, assets, liabilities, equity), not income statement elements, are reported as a snapshot in time.\n(Choice C) Inflows and outflows of cash transactions are reported in the statement of cash flows, not the income statement.\nThings to remember:\nThe income statement shows the results of a firm's business activity and displays how much expense the firm took to produce the revenue\ngenerated over a specific period.\nDescribe the importance of regulatory filings, financial statement notes and supplementary information, management’s commentary, and audit\nreports", "qhtml": null}, {"n": 15, "q": "If a company receives a qualified audit opinion, its financial statements are most likely:", "opts": ["prepared with incomplete records.", "accurate and presented fairly in all material respects.", "unreliable due to intentional accounting misstatements by management."], "ans": "A", "expl": "Regulatory agencies require that publicly traded companies have their financial statements audited by an independent accounting firm. The\nauditor samples transactions to determine whether there is reasonable assurance that the financial statements are free from material\nmisstatements and presented fairly. Subsequently, the auditor issues an opinion on whether the financial statements were prepared in accordance\nwith the applicable accounting standards (eg, US GAAP, IFRS).\nA qualified audit opinion implies that the audit was limited in scope (eg, incomplete records) or there was an exception from the applicable\naccounting standards. Companies strongly prefer not to have a qualified opinion since it reflects poorly on management. Qualified audit\nopinions suggest that the company's financial statements are less reliable than statements with an unqualified opinion.\n(Choice B) If the company's financial statements are accurate and presented fairly in all material respects, the most likely audit opinion is\nunqualified, not qualified.\n(Choice C) If the company's financial statements are unreliable due to management's intentional accounting misstatements, the most likely audit\nopinion is adverse, not qualified.\nThings to remember:\nA qualified audit opinion implies that the audit was limited in scope (eg, incomplete records) or there was an exception from the applicable\naccounting standards. Companies prefer to receive an unqualified audit opinion.\nDescribe the importance of regulatory filings, financial statement notes and supplementary information, management’s commentary, and audit\nreports", "qhtml": null}];
const CFG = {"title": "Wiley · Introduction to Financial Statement Analysis", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Financial Statement Analysis · 15 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
