<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 8 — Employee Compensation - Post-Employment and Share-Based · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>

  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}

  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

<script>
const DATA = [{"n": 1, "q": "Which of the following is NOT an advantage of share based compensation over cash compensation?", "opts": ["Share based compensation does not require a cash outlay.", "Share based compensation serves to align employee interest with the interests of stockholders.", "In a share based compensation plan, expense is not recognized, unless the exercise price is set below the market price."], "ans": "C", "expl": "Share based compensation needs to be recognized at fair value under both U.S. GAAP and IFRS. Intrinsic value does not matter. However, the expense does not require a cash outlay and serves to align the interests of employees and stockholders.", "explhtml": "<p>Share based compensation needs to be recognized at fair value under both U.S. GAAP and IFRS. Intrinsic value does not matter. However, the expense does not require a cash outlay and serves to align the interests of employees and stockholders.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 8.1, LOS 8.b<\/div><div class=\"qtext\"><p>Which of the following is NOT an advantage of share based compensation over cash compensation?<\/p><\/div>", "subj": "fsa"}, {"n": 2, "q": "Under U.S. GAAP, capitalized periodic pension costs included in the value of ending inventory is most likely:", "opts": ["to be expensed as part of cost of goods sold when the inventory is sold.", "to be amortized over the service lives of employees.", "not allowed."], "ans": "A", "expl": "Pension costs included in the cost of production of goods (e.g., labor costs included in the value of work-in-process or finished goods) may be capitalized as part of valuation of ending inventory. When this inventory is eventually sold, such costs are expensed as a component of cost of goods sold.", "explhtml": "<p>Pension costs included in the cost of production of goods (e.g., labor costs included in the value of work-in-process or finished goods) may be capitalized as part of valuation of ending inventory. When this inventory is eventually sold, such costs are expensed as a component of cost of goods sold.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 8.2, LOS 8.d<\/div><div class=\"qtext\"><p>Under U.S. GAAP, capitalized periodic pension costs included in the value of ending inventory is most likely:<\/p><\/div>", "subj": "fsa"}, {"n": 3, "q": "In order to decrease the projected benefit obligation (PBO) of a pension plan, which of the following changes in pension assumptions can be made to yield the desired result?", "opts": ["Decrease the discount rate.", "Increase the expected rate of return.", "Decrease the rate of compensation growth."], "ans": "C", "expl": "A decrease in the rate of compensation growth will lower future pension payments and in turn, lower the PBO.", "explhtml": "<p>A decrease in the rate of compensation growth will lower future pension payments and in turn, lower the PBO.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 8.2, LOS 8.d<\/div><div class=\"qtext\"><p>In order to decrease the projected benefit obligation (PBO) of a pension plan, which of the following changes in pension assumptions can be made to yield the desired result?<\/p><\/div>", "subj": "fsa"}, {"n": 4, "q": "Which of the following statements about share-based compensation is most accurate?", "opts": ["Only the intrinsic value of an option is shown as an expense in the income statement.", "The fair value of an option is expensed when the option is in-the-money.", "The compensation expense is amortized over the vesting period in the income statement."], "ans": "C", "expl": "Compensation expense is based on the fair value of the options on the grant date. The compensation expense is then allocated straight line (i.e., amortized in equal installments) in the income statement over the vesting period, which is the time between the grant date and the vesting date.", "explhtml": "<p>Compensation expense is based on the fair value of the options on the grant date. The compensation expense is then allocated straight line (i.e., amortized in equal installments) in the income statement over the vesting period, which is the time between the grant date and the vesting date.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 8.1, LOS 8.b<\/div><div class=\"qtext\"><p>Which of the following statements about share-based compensation is most accurate?<\/p><\/div>", "subj": "fsa"}, {"n": 5, "q": "Which of the following statements regarding pension accounting is most accurate?", "opts": ["Changes in the projected benefit obligation (PBO) and plan assets fully and immediately affect the balance sheet.", "A reconciliation between the funded status and the net pension asset (liability) reported on the balance is required.", "Changes in actuarial assumptions and past service costs fully and immediately affect the income statement."], "ans": "A", "expl": "Changes in the projected benefit obligation (PBO) and plan assets immediately affect the funded status (difference in PBO and plan assets) and the full amount of the changes is reflected on the balance sheet when the change occurs. Changes in actuarial assumptions and past service costs are recognized in the income statement over time under U.S. GAAP. Under IFRS, vested past service costs are recognized immediately and changes in actuarial assumptions are called re-measurements, which are taken to OCI and not amortized. Since the funded status is equal to the net pension asset (liability) reported on the balance sheet under no reconciliation is required.", "explhtml": "<p>Changes in the projected benefit obligation (PBO) and plan assets immediately affect the funded status (difference in PBO and plan assets) and the full amount of the changes is reflected on the balance sheet when the change occurs.<\/p><p>Changes in actuarial assumptions and past service costs are recognized in the income statement over time under U.S. GAAP. Under IFRS, vested past service costs are recognized immediately and changes in actuarial assumptions are called re-measurements, which are taken to OCI and not amortized.<\/p><p>Since the funded status is equal to the net pension asset (liability) reported on the balance sheet under no reconciliation is required.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 8.2, LOS 8.d<\/div><div class=\"qtext\"><p>Which of the following statements regarding pension accounting is most accurate?<\/p><\/div>", "subj": "fsa"}, {"n": 6, "q": "Wonderful Manufacturing has implemented a change in its pension plan, that will increase the future benefits for all of its current employees. Which of the following is the most likely effect on the company's financial statements of this change in promised benefits under current U.S. GAAP standards?", "opts": ["The pension expense for the next reporting period will increase by the projected increase in pension benefits due to employees.", "The firm’s prior financial statements will be adjusted to reflect the increase in benefits.", "The net pension liability will increase immediately by the projected increase in pension benefits due to employees."], "ans": "C", "expl": "A plan amendment will result in an immediate increase in the PBO. Under current U.S. accounting standards, an increase in PBO will result in an increase in the net pension liability (decrease in funded status).", "explhtml": "<p>A plan amendment will result in an immediate increase in the PBO. Under current U.S. accounting standards, an increase in PBO will result in an increase in the net pension liability (decrease in funded status).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 8.2, LOS 8.e<\/div><div class=\"qtext\"><p>Wonderful Manufacturing has implemented a change in its pension plan, that will increase the future benefits for all of its current employees. Which of the following is the most likely effect on the company&#x27;s financial statements of this change in promised benefits under current U.S. GAAP standards?<\/p><\/div>", "subj": "fsa"}, {"n": 7, "q": "The period at the end of which the employee is unconditionally entitled to a compensation is called the:", "opts": ["entitlement date.", "vesting date.", "settlement date."], "ans": "B", "expl": "The vesting date is the date the employee earns (or becomes unconditionally entitled to) the compensation.", "explhtml": "<p>The vesting date is the date the employee earns (or becomes unconditionally entitled to) the compensation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 8.1, LOS 8.a<\/div><div class=\"qtext\"><p>The period at the end of which the employee is unconditionally entitled to a compensation is called the:<\/p><\/div>", "subj": "fsa"}, {"n": 8, "q": "Fly-By-Night Airlines is a U.S. company planning to change its pension plan so that it can reduce its costs. It is considering reducing its defined benefit percentage from 10% to 5% of ending salary, retroactive for 10 years. In addition, since the firm is anticipating substantially reduced salary increases in the future, it is planning to reduce its compensation growth rate assumption. From a pension accounting perspective, the change in the:", "opts": ["Compensation growth rate assumption is a change in actuarial assumption that will reduce the defined benefit obligation and future pension expense.", "Benefit percentage is a change in actuarial assumption that will be recognized in full in current period pension expense.", "Benefit percentage is a past service cost that will be amortized into and thus increase pension expense over the remaining service lives of its employees."], "ans": "A", "expl": "The change in the compensation growth rate assumption is a change in actuarial assumption that will reduce the defined benefit obligation and future pension expense, as the effect is amortized into pension expense over time. In this question, the change is a reduction in both the defined benefit obligation and pension expense. The change in the contribution percentage is not a change in actuarial assumption but a plan amendment (which would be reflected as negative past service cost and either amortized under US GAAP or expensed in full under IFRS). Amortization of negative past service cost (applicable only under US GAAP) would decrease, not increase, pension expense over the remaining service lives of its employees.", "explhtml": "<p>The change in the compensation growth rate assumption is a change in actuarial assumption that will reduce the defined benefit obligation and future pension expense, as the effect is amortized into pension expense over time. In this question, the change is a reduction in both the defined benefit obligation and pension expense.<\/p><p>The change in the contribution percentage is not a change in actuarial assumption but a plan amendment (which would be reflected as negative past service cost and either amortized under US GAAP or expensed in full under IFRS).<\/p><p>Amortization of negative past service cost (applicable only under US GAAP) would decrease, not increase, pension expense over the remaining service lives of its employees.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 8.2, LOS 8.d<\/div><div class=\"qtext\"><p>Fly-By-Night Airlines is a U.S. company planning to change its pension plan so that it can reduce its costs. It is considering reducing its defined benefit percentage from 10% to 5% of ending salary, retroactive for 10 years. In addition, since the firm is anticipating substantially reduced salary increases in the future, it is planning to reduce its compensation growth rate assumption. From a pension accounting perspective, the change in the:<\/p><\/div>", "subj": "fsa"}, {"n": 9, "q": "Which type of compensation is most likely to increase current liability for a company?", "opts": ["Stock grants.", "Salary and wages.", "Stock-option grants."], "ans": "B", "expl": "Unpaid earned salary and wages would be shown as a current liability. Options and stock grants do not result in a liability.", "explhtml": "<p>Unpaid earned salary and wages would be shown as a current liability. Options and stock grants do not result in a liability.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 8.1, LOS 8.a<\/div><div class=\"qtext\"><p>Which type of compensation is most likely to increase current liability for a company?<\/p><\/div>", "subj": "fsa"}, {"n": 10, "q": "A company reporting under U.S. GAAP reduced the discount rate for its pension obligation from 10% to 8%, reduced the expected long-term rate of return on the assets in its pension plan from 8% to 6%, and changed its compensation growth rate assumption from 4% to 5%. What is the most likely impact of these changes on the current year ending defined benefit obligation and pension expense?", "opts": ["The reduction in the discount rate will decrease the defined benefit obligation and will increase reported pension expense.", "The decrease in the long-term rate of return on plan assets will decrease reported pension expense.", "The decrease in the long-term rate of return will have no impact on the defined benefit obligation and will increase reported pension expense."], "ans": "C", "expl": "The decrease in the expected long-term rate of return on plan assets from 8% to 6% will have no effect on the defined benefit obligation (after all, it is an obligation and not an asset). The reduction will, however, increase reported pension expense for current and future periods because the expected return is subtracted while computing pension expense. The reduction in the discount rate from 10% to 8% will increase (not decrease) the defined benefit obligation and will also increase reported pension expense because it will increase the current service cost. Additionally, the actuarial gains and losses resulting from this change (the difference between the defined benefit obligation after the increase and the defined benefit obligation before the increase) will be amortized into pension expense over time using the corridor approach. Amortization will start in the period after the change is made. The decrease in the expected long-term rate of return on its plan assets from 8% to 6% will increase, not decrease, reported pension expense. Expected return reduces pension expense.", "explhtml": "<p>The decrease in the expected long-term rate of return on plan assets from 8% to 6% will have no effect on the defined benefit obligation (after all, it is an obligation and not an asset). The reduction will, however, increase reported pension expense for current and future periods because the expected return is subtracted while computing pension expense.<\/p><p>The reduction in the discount rate from 10% to 8% will increase (not decrease) the defined benefit obligation and will also increase reported pension expense because it will increase the current service cost. Additionally, the actuarial gains and losses resulting from this change (the difference between the defined benefit obligation after the increase and the defined benefit obligation before the increase) will be amortized into pension expense over time using the corridor approach. Amortization will start in the period after the change is made.<\/p><p>The decrease in the expected long-term rate of return on its plan assets from 8% to 6% will increase, not decrease, reported pension expense. Expected return reduces pension expense.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 8.2, LOS 8.d<\/div><div class=\"qtext\"><p>A company reporting under U.S. GAAP reduced the discount rate for its pension obligation from 10% to 8%, reduced the expected long-term rate of return on the assets in its pension plan from 8% to 6%, and changed its compensation growth rate assumption from 4% to 5%. What is the most likely impact of these changes on the current year ending defined benefit obligation and pension expense?<\/p><\/div>", "subj": "fsa"}, {"n": 11, "q": "Which of the following statements regarding the projected benefit obligation (PBO) and the value of the pension plan assets is most accurate?", "opts": ["Plan amendments during the year generally result in a decrease of the PBO at the end of the year.", "The fair value of plan assets is increased by the amount of the expected return on assets.", "If the PBO and the plan assets are the same, then nothing needs to be reported on the balance sheet."], "ans": "C", "expl": "Neither the PBO nor the plan assets are separately reported on the balance sheet. The funded status is the difference in the PBO and the plan assets. If the PBO exceeds the plan assets, the difference is reported as a liability. If the plan assets exceed the PBO, the difference is reported as an asset. If the amounts are the same, then neither a liability nor asset needs to be reported. Plan amendments (i.e. additional benefits provided that increase the amount of the employer's obligation to plan participants) generally result in an increase of the PBO. The fair value of plan assets at the beginning of the period is increased by the actual return on plan assets as well as any employer contributions. It is reduced by the amount of benefits paid.", "explhtml": "<p>Neither the PBO nor the plan assets are separately reported on the balance sheet. The funded status is the difference in the PBO and the plan assets. If the PBO exceeds the plan assets, the difference is reported as a liability. If the plan assets exceed the PBO, the difference is reported as an asset. If the amounts are the same, then neither a liability nor asset needs to be reported.<\/p><p>Plan amendments (i.e. additional benefits provided that increase the amount of the employer&#x27;s obligation to plan participants) generally result in an increase of the PBO.<\/p><p>The fair value of plan assets at the beginning of the period is increased by the actual return on plan assets as well as any employer contributions. It is reduced by the amount of benefits paid.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 8.2, LOS 8.d<\/div><div class=\"qtext\"><p>Which of the following statements regarding the projected benefit obligation (PBO) and the value of the pension plan assets is most accurate?<\/p><\/div>", "subj": "fsa"}, {"n": 12, "q": "Federal Companies' reports under U.S. GAAP included the following information in the footnotes to its most recent financial statements: Beginning Projected Benefit Obligation (PBO) $65,000,000 Beginning FV of Plan Assets 60,000,000 Service Cost 27,000,000 Interest Cost 3,000,000 Unamortized Actuarial Losses (Start of the Year) 5,000,000 Actual Return on Plan Assets 7,500,000 Expected Return on Plan Assets 8,500,000 Given the information above, calculate Federal's total periodic pension cost for the year.", "opts": ["$27,500,000.00", "$41,000,000.00", "$21,500,000.00"], "ans": "C", "expl": "Periodic pension cost = service cost + interest cost – expected return on plan assets Therefore, $27,000,000 + 3,000,000 – 8,500,000 = $21,500,000 Since the unamortized actuarial loss is less than 10% of beginning PBO, no amortization is needed.", "explhtml": "<p>Periodic pension cost = service cost + interest cost – expected return on plan assets<\/p><p>Therefore, $27,000,000 + 3,000,000 – 8,500,000 = $21,500,000<\/p><p>Since the unamortized actuarial loss is less than 10% of beginning PBO, no amortization is needed.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 8.2, LOS 8.d<\/div><div class=\"qtext\"><p>Federal Companies&#x27; reports under U.S. GAAP included the following information in the footnotes to its most recent financial statements:<\/p><div class=\"tbl\"><table><tr><td>Beginning Projected Benefit Obligation (PBO)<\/td><td>$65,000,000<\/td><\/tr><tr><td>Beginning FV of Plan Assets<\/td><td>60,000,000<\/td><\/tr><tr><td>Service Cost<\/td><td>27,000,000<\/td><\/tr><tr><td>Interest Cost<\/td><td>3,000,000<\/td><\/tr><tr><td>Unamortized Actuarial Losses (Start of the Year)<\/td><td>5,000,000<\/td><\/tr><tr><td>Actual Return on Plan Assets<\/td><td>7,500,000<\/td><\/tr><tr><td>Expected Return on Plan Assets<\/td><td>8,500,000<\/td><\/tr><\/table><\/div><p>Given the information above, calculate Federal&#x27;s total periodic pension cost for the year.<\/p><\/div>", "subj": "fsa"}, {"n": 13, "q": "As of January 1st, 2007, the fair value of plan assets was $19 million. Which three components are necessary to calculate the fair value of the plan assets at the end of the year?", "opts": ["actual return on assets, employer contributions, and benefits paid.", "service cost, interest cost, and benefits paid.", "expected return on plan assets, employer and participant contributions, and benefits paid."], "ans": "A", "expl": "Companies are required to disclose a reconciliation of the beginning and ending balances of the fair value of plan assets, which can be calculated as follows: Fair value of plan assets at the beginning of the year + Actual return on assets + Employer contributions − Benefits paid = Fair value of plan assets at the end of the year", "explhtml": "<p>Companies are required to disclose a reconciliation of the beginning and ending balances of the fair value of plan assets, which can be calculated as follows:<\/p><p>Fair value of plan assets at the beginning of the year<\/p><p>+ Actual return on assets<\/p><p>+ Employer contributions<\/p><p>− Benefits paid<\/p><p>= Fair value of plan assets at the end of the year<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 13–16<\/summary><div class=\"vig-body\"><p>Paul Roberts, CPA, is a partner in Roberts &amp; Smith, an accounting firm that is located in Chicago. The firm has recently been retained by Midwest Manufacturing, a major producer of heavy machinery and tractor parts in the U.S. Midwest has been in operation since 1965, and currently has approximately 700 full-time employees. The company had its initial public offering in 1986. The company has hired Roberts's firm to ensure that the accounting for Midwest's employee pension plan is fully in compliance U.S. GAAP standards.<\/p><p>Selected year-end pension plan information for Midwest Manufacturing<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r8/v001.webp\" style=\"max-width:min(100%,602px)\" alt=\"2007 2006 $23 million $21 million PBO 7.5% 6.0% Discount Rate 4.0% 4.0% Rate of Compensation Increase $0.8m Benefits paid $1m $1.6m Interest cost\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r8/v002.webp\" style=\"max-width:min(100%,602px)\" alt=\"Service cost $3m\"><p>Roberts will educate Midwest's accounting department on pension plan accounting that would be relevant to their situation.<\/p><\/div><\/details><div class=\"pp-topic\">Module 8.2, LOS 8.e<\/div><div class=\"qtext\"><p>As of January 1<sup>st<\/sup>, 2007, the fair value of plan assets was $19 million. Which three components<\/p><p>are necessary to calculate the fair value of the plan assets at the end of the year?<\/p><\/div>", "subj": "fsa"}, {"n": 14, "q": "Current U.S. GAAP pension accounting standards require public companies to report which of the following in the balance sheet?", "opts": ["The expected return on plan assets.", "The pension liability adjusted for unrecognized items.", "The funded status of the plan."], "ans": "C", "expl": "The current standard requires companies to report the funded status of the plan, which is the difference between the PBO and the fair value of plan assets.", "explhtml": "<p>The current standard requires companies to report the funded status of the plan, which is the difference between the PBO and the fair value of plan assets.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 13–16<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Paul Roberts, CPA, is a partner in Roberts &amp; Smith, an accounting firm that is located in Chicago. The firm has recently been retained by Midwest Manufacturing, a major producer of heavy machinery and tractor parts in the U.S. Midwest has been in operation since 1965, and currently has approximately 700 full-time employees. The company had its initial public offering in 1986. The company has hired Roberts's firm to ensure that the accounting for Midwest's employee pension plan is fully in compliance U.S. GAAP standards.<\/p><p>Selected year-end pension plan information for Midwest Manufacturing<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r8/v001.webp\" style=\"max-width:min(100%,602px)\" alt=\"2007 2006 $23 million $21 million PBO 7.5% 6.0% Discount Rate 4.0% 4.0% Rate of Compensation Increase $0.8m Benefits paid $1m $1.6m Interest cost\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r8/v002.webp\" style=\"max-width:min(100%,602px)\" alt=\"Service cost $3m\"><p>Roberts will educate Midwest's accounting department on pension plan accounting that would be relevant to their situation.<\/p><\/div><\/details><div class=\"pp-topic\">Module 8.2, LOS 8.e<\/div><div class=\"qtext\"><p>Current U.S. GAAP pension accounting standards require public companies to report which of the following in the balance sheet?<\/p><\/div>", "subj": "fsa"}, {"n": 15, "q": "As of December 31st, 2007, the fair value of plan assets was $21 million. For this question only, assume that the sum of the unrecognized prior service cost and the unrecognized actuarial losses equals $1.5 million. Calculate the amount attributable to Midwest's pension plan as of December 31st, 2007 that must be reported on the balance sheet under U.S. GAAP.", "opts": ["$2.0 million.", "−$2.0 million.", "−$500,000."], "ans": "B", "expl": "The funded status is the difference between the PBO and the fair value of plan assets as of the reporting date. For Midwest's plan, $21,000,000 − 23,000,000 = −$2,000,000. PBO figure is already given – and it includes all unrecognized items (and hence need not be adjusted).", "explhtml": "<p>The funded status is the difference between the PBO and the fair value of plan assets as of the reporting date. For Midwest&#x27;s plan, $21,000,000 − 23,000,000 = −$2,000,000. PBO figure is already given – and it includes all unrecognized items (and hence need not be adjusted).<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 13–16<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Paul Roberts, CPA, is a partner in Roberts &amp; Smith, an accounting firm that is located in Chicago. The firm has recently been retained by Midwest Manufacturing, a major producer of heavy machinery and tractor parts in the U.S. Midwest has been in operation since 1965, and currently has approximately 700 full-time employees. The company had its initial public offering in 1986. The company has hired Roberts's firm to ensure that the accounting for Midwest's employee pension plan is fully in compliance U.S. GAAP standards.<\/p><p>Selected year-end pension plan information for Midwest Manufacturing<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r8/v001.webp\" style=\"max-width:min(100%,602px)\" alt=\"2007 2006 $23 million $21 million PBO 7.5% 6.0% Discount Rate 4.0% 4.0% Rate of Compensation Increase $0.8m Benefits paid $1m $1.6m Interest cost\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r8/v002.webp\" style=\"max-width:min(100%,602px)\" alt=\"Service cost $3m\"><p>Roberts will educate Midwest's accounting department on pension plan accounting that would be relevant to their situation.<\/p><\/div><\/details><div class=\"pp-topic\">Module 8.2, LOS 8.e<\/div><div class=\"qtext\"><p>As of December 31<sup>st<\/sup>, 2007, the fair value of plan assets was $21 million. For this question only,<\/p><p>assume that the sum of the unrecognized prior service cost and the unrecognized actuarial losses equals $1.5 million. Calculate the amount attributable to Midwest&#x27;s pension plan as of December 31<sup>st<\/sup>, 2007 that must be reported on the balance sheet under U.S. GAAP.<\/p><\/div>", "subj": "fsa"}, {"n": 16, "q": "Which of the following statements regarding the U.S. GAAP pension accounting standards is most accurate?", "opts": ["The balance sheet will now reflect the true economic position of the pension plan, but the income statement will not necessarily reflect a true measure of economic pension expense.", "For most companies, the pension liability will increase while financial leverage may increase or decrease as a result of applying the standard.", "The changes in GAAP now cause U.S. standards to be consistent with the International Financial Reporting Standards (IFRS) for pension plans."], "ans": "A", "expl": "Because deferred and unrecognized items are required to be reported on the balance sheet but not the income statement, the balance sheet will reflect the true economic position of the pension plan, but the income statement will not necessarily reflect a true measure of economic pension expense. U.S. GAAP and IFRS still differ with respect to reporting pension expense.", "explhtml": "<p>Because deferred and unrecognized items are required to be reported on the balance sheet but not the income statement, the balance sheet will reflect the true economic position of the pension plan, but the income statement will not necessarily reflect a true measure of economic pension expense. U.S. GAAP and IFRS still differ with respect to reporting pension expense.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 13–16<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Paul Roberts, CPA, is a partner in Roberts &amp; Smith, an accounting firm that is located in Chicago. The firm has recently been retained by Midwest Manufacturing, a major producer of heavy machinery and tractor parts in the U.S. Midwest has been in operation since 1965, and currently has approximately 700 full-time employees. The company had its initial public offering in 1986. The company has hired Roberts's firm to ensure that the accounting for Midwest's employee pension plan is fully in compliance U.S. GAAP standards.<\/p><p>Selected year-end pension plan information for Midwest Manufacturing<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r8/v001.webp\" style=\"max-width:min(100%,602px)\" alt=\"2007 2006 $23 million $21 million PBO 7.5% 6.0% Discount Rate 4.0% 4.0% Rate of Compensation Increase $0.8m Benefits paid $1m $1.6m Interest cost\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r8/v002.webp\" style=\"max-width:min(100%,602px)\" alt=\"Service cost $3m\"><p>Roberts will educate Midwest's accounting department on pension plan accounting that would be relevant to their situation.<\/p><\/div><\/details><div class=\"pp-topic\">Module 8.2, LOS 8.e<\/div><div class=\"qtext\"><p>Which of the following statements regarding the U.S. GAAP pension accounting standards is most accurate?<\/p><\/div>", "subj": "fsa"}, {"n": 17, "q": "The actuarial present value of all future pension benefits earned to date, based on expected future salary increases, is called the:", "opts": ["total projected pension cost.", "pension liability.", "projected benefit obligation (PBO)."], "ans": "C", "expl": "The PBO is the actuarial present value (at an assumed discount rate) of all future pension benefits earned to date, based on expected future salary increases. It measures the value of the obligation, assuming the firm is a going concern and that the employees will continue to work for the firm until they retire. Pension cost is periodic and not total projected. Pension liability is the net amount of PBO and fair value of plan assets.", "explhtml": "<p>The PBO is the actuarial present value (at an assumed discount rate) of all future pension benefits earned to date, based on expected future salary increases. It measures the value of the obligation, assuming the firm is a going concern and that the employees will continue to work for the firm until they retire. Pension cost is periodic and not total projected. Pension liability is the net amount of PBO and fair value of plan assets.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 8.2, LOS 8.d<\/div><div class=\"qtext\"><p>The actuarial present value of all future pension benefits earned to date, based on expected future salary increases, is called the:<\/p><\/div>", "subj": "fsa"}, {"n": 18, "q": "The projected benefit obligation (PBO) is defined as the:", "opts": ["actuarial future value of all post-retirement healthcare benefits earned to date.", "actuarial present value of all future pension benefits earned to date and based on current salary levels.", "actuarial present value of all future pension benefits earned to date based on expected future salary increases."], "ans": "C", "expl": "The projected benefit obligation (PBO) is defined as the actuarial present value of all future pension benefits earned to date based on expected future salary increases.", "explhtml": "<p>The projected benefit obligation (PBO) is defined as the actuarial present value of all future pension benefits earned to date based on expected future salary increases.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 8.2, LOS 8.d<\/div><div class=\"qtext\"><p>The projected benefit obligation (PBO) is defined as the:<\/p><\/div>", "subj": "fsa"}, {"n": 19, "q": "For a stock grant, from the company's perspective, a tax windfall is most likely to result when the:", "opts": ["stock price at settlement was lower than the stock price on the grant date.", "stock price at settlement was higher than the stock price on the grant date.", "intrinsic value at settlement was lower than the fair value on the grant date."], "ans": "B", "expl": "Tax deduction for stock grant = share price on settlement date x number of shares vested If the stock price on the settlement date is higher than the price on the grant date, there would a higher tax deduction than the cumulative compensation expense reported, resulting in a tax windfall or excess tax benefit.", "explhtml": "<p>Tax deduction for stock grant = share price on settlement date x number of shares vested<\/p><p>If the stock price on the settlement date is higher than the price on the grant date, there would a higher tax deduction than the cumulative compensation expense reported, resulting in a tax windfall or excess tax benefit.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 8.1, LOS 8.b<\/div><div class=\"qtext\"><p>For a stock grant, from the company&#x27;s perspective, a tax windfall is most likely to result when the:<\/p><\/div>", "subj": "fsa"}, {"n": 20, "q": "Tim Gresham, CFO of Alpha Logistics is concerned about changes in the business environment which could lead to Alpha violating some of the covenants of their outstanding debentures. Specifically Gresham is concerned about leverage and profitability ratios. Gresham reviews Alpha's most recent financial statements and decides that changing the assumptions for the company's defined benefit pension plan may provide some relief in the short-run. Alpha reports under U.S. GAAP. Which of the following changes in the pension plan's assumptions would most likely lead to lower reported leverage and higher reported profitability?", "opts": ["Increasing the discount rate.", "Increasing the growth rate in compensation expense.", "Increasing expected return on plan assets."], "ans": "A", "expl": "Increasing discount rate leads to lower present values and reduces reported pension liability in the balance sheet and also reduces pension expense by reducing the service cost component. Increasing expected return on plan assets does reduce pension expense but does not affect reported assets or liabilities. Increasing the growth rate in compensation expense increases service cost as well as reported pension liability.", "explhtml": "<p>Increasing discount rate leads to lower present values and reduces reported pension liability in the balance sheet and also reduces pension expense by reducing the service cost component. Increasing expected return on plan assets does reduce pension expense but does not affect reported assets or liabilities. Increasing the growth rate in compensation expense increases service cost as well as reported pension liability.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 8.2, LOS 8.d<\/div><div class=\"qtext\"><p>Tim Gresham, CFO of Alpha Logistics is concerned about changes in the business environment which could lead to Alpha violating some of the covenants of their outstanding debentures. Specifically Gresham is concerned about leverage and profitability ratios. Gresham reviews Alpha&#x27;s most recent financial statements and decides that changing the assumptions for the company&#x27;s defined benefit pension plan may provide some relief in the short-run. Alpha reports under U.S. GAAP.<\/p><p>Which of the following changes in the pension plan&#x27;s assumptions would most likely lead to lower reported leverage and higher reported profitability?<\/p><\/div>", "subj": "fsa"}, {"n": 21, "q": "An analyst views the assumptions made by a company reporting under U.S. GAAP regarding its pension liabilities as unrealistic, and thinks the discount rate and expected rate of return should both be increased. The most likely effect of increasing the discount rate and expected rate of return on the pension benefit obligation (PBO) is: Expected rate Discount rate of return", "opts": ["No effect Decrease", "Increase Decrease", "Decrease No effect"], "ans": "C", "expl": "The PBO will decrease because a higher discount rate will cause the present value of the future obligations to decline. There will be no effect from changing the expected rate of return because expected return relates to the pension expense, not to the size of the obligation.", "explhtml": "<p>The PBO will decrease because a higher discount rate will cause the present value of the future obligations to decline. There will be no effect from changing the expected rate of return because expected return relates to the pension expense, not to the size of the obligation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 8.2, LOS 8.d<\/div><div class=\"qtext\"><p>An analyst views the assumptions made by a company reporting under U.S. GAAP regarding its pension liabilities as unrealistic, and thinks the discount rate and expected rate of return should both be increased. The most likely effect of increasing the discount rate and expected rate of return on the pension benefit obligation (PBO) is:<\/p><p>Expected rate<\/p><p>Discount rate<\/p><p>of return<\/p><\/div>", "subj": "fsa"}, {"n": 22, "q": "Wes Livingston is the founder and CEO of Bigwell Corporation. Livingston is interested in Bigwell being acquired by a larger competitor and wants to have his company's financial statements appear as attractive as possible to a potential suitor. In order to decrease the projected benefit obligation (PBO) of the company's pension plan, which of the following changes in actuarial assumptions could be made?", "opts": ["Increase the rate of compensation growth.", "Increase the discount rate.", "Decrease the discount rate."], "ans": "B", "expl": "Increasing the assumed discount rate of a pension plan will result in lower projected benefit obligation (PBO). Increasing rate of compensation growth and decreasing discount rate would increase the PBO.", "explhtml": "<p>Increasing the assumed discount rate of a pension plan will result in lower projected benefit obligation (PBO). Increasing rate of compensation growth and decreasing discount rate would increase the PBO.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 8.2, LOS 8.e<\/div><div class=\"qtext\"><p>Wes Livingston is the founder and CEO of Bigwell Corporation. Livingston is interested in Bigwell being acquired by a larger competitor and wants to have his company&#x27;s financial statements appear as attractive as possible to a potential suitor. In order to decrease the projected benefit obligation (PBO) of the company&#x27;s pension plan, which of the following changes in actuarial assumptions could be made?<\/p><\/div>", "subj": "fsa"}, {"n": 23, "q": "Jon Horton, CFA, is the Chief Financial Officer (CFO) for Springtown Corporation, a manufacturer of windows for residential and commercial applications. As part of an ongoing diversification strategy, Springtown Corp. has recently entered into a preliminary agreement to purchase all of the assets of Prime Doors, a manufacturer and distributor of doors to the same residential and commercial market in which Springtown sells its windows. Horton is head of the due diligence team that will fully evaluate Prime Doors' financial statements prior to the proposed acquisition. Prime Doors has been in operation for thirty years, and currently has approximately 800 employees at two operating facilities. Horton observes in the notes to the financial statements that Prime Doors has a defined benefit pension plan, for which all employees are eligible. Employees are vested at the rate of 20% per year of employment, and are fully vested upon completion of five years of employment. Springtown does not offer a pension plan to its employees, but encourages employees to contribute to Individual Retirement Accounts (IRAs) and offers a 401(k) program. Horton wants to fully evaluate the financial implications of Springtown's assumption of Prime Doors' pension assets and the associated future liabilities and expenses. Like most companies, the pension plan for Prime Doors' employees is not fully funded, but Horton wants to review all assumptions used by Prime Doors' accountants in the valuation of the plan's current liabilities. The most current information regarding the pension plans is as follows: Select Pension Plan Information for Prime Doors (as of 12/31/05)  Projected benefit obligation (PBO) $15,500,000 Accumulated benefit obligation (ABO) $13,750,000 Market value of plan assets $11,875,000 Horton notices a paragraph in the pension plan footnotes that the original pension plan was amended last year, effectively increasing the level of benefits to be paid to employees with more than ten years of service. However, he is not able to detect what effect, if any, this change in projected benefits has had on Prime Doors' financial statements or is expected to have in the future. Horton is aware that a commonly used method can be used to adjust the income statement and provide a better measure of Prime Doors' economic pension cost than reported pension expense. He is not quite sure which components of the financial statements are utilized to derive an adjusted pension expense, but intends to investigate what analysis he can perform to gain more insight into the company's position with regards to its pension plan. What effect will an increased discount rate and increased expected rate of return have on a company's projected benefit obligation (PBO) and fair value of plan assets (FVPL) as reflected in the financial statements?", "opts": ["Both will decrease.", "Both will increase.", "Only one will decrease."], "ans": "C", "expl": "The use of a higher discount rate will decrease a company's PBO. The expected rate of return has no impact on pension obligations or the fair value of plan assets.", "explhtml": "<p>The use of a higher discount rate will decrease a company&#x27;s PBO. The expected rate of return has no impact on pension obligations or the fair value of plan assets.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 8.1, LOS 8.b<\/div><div class=\"qtext\"><p>Jon Horton, CFA, is the Chief Financial Officer (CFO) for Springtown Corporation, a manufacturer of windows for residential and commercial applications. As part of an ongoing diversification strategy, Springtown Corp. has recently entered into a preliminary agreement to purchase all of the assets of Prime Doors, a manufacturer and distributor of doors to the same residential and commercial market in which Springtown sells its windows. Horton is head of the due diligence team that will fully evaluate Prime Doors&#x27; financial statements prior to the proposed acquisition.<\/p><p>Prime Doors has been in operation for thirty years, and currently has approximately 800 employees at two operating facilities. Horton observes in the notes to the financial statements that Prime Doors has a defined benefit pension plan, for which all employees are eligible. Employees are vested at the rate of 20% per year of employment, and are fully vested upon completion of five years of employment. Springtown does not offer a pension plan to its employees, but encourages employees to contribute to Individual Retirement Accounts (IRAs) and offers a 401(k) program.<\/p><p>Horton wants to fully evaluate the financial implications of Springtown&#x27;s assumption of Prime Doors&#x27; pension assets and the associated future liabilities and expenses. Like most companies, the pension plan for Prime Doors&#x27; employees is not fully funded, but Horton wants to review all assumptions used by Prime Doors&#x27; accountants in the valuation of the plan&#x27;s current liabilities. The most current information regarding the pension plans is as follows:<\/p><div class=\"tbl\"><table><tr><td colspan=2>Select Pension Plan Information for Prime Doors (as of 12/31/05)<\/td><\/tr><tr><td>Projected benefit obligation (PBO)<\/td><td>$15,500,000<\/td><\/tr><tr><td>Accumulated benefit obligation (ABO)<\/td><td>$13,750,000<\/td><\/tr><tr><td>Market value of plan assets<\/td><td>$11,875,000<\/td><\/tr><\/table><\/div><p>Horton notices a paragraph in the pension plan footnotes that the original pension plan was amended last year, effectively increasing the level of benefits to be paid to employees with more than ten years of service. However, he is not able to detect what effect, if any, this change in projected benefits has had on Prime Doors&#x27; financial statements or is expected to have in the future.<\/p><p>Horton is aware that a commonly used method can be used to adjust the income statement and provide a better measure of Prime Doors&#x27; economic pension cost than reported pension expense. He is not quite sure which components of the financial statements are utilized to derive an adjusted pension expense, but intends to investigate what analysis he can perform to gain more insight into the company&#x27;s position with regards to its pension plan.<\/p><p>What effect will an increased discount rate and increased expected rate of return have on a company&#x27;s projected benefit obligation (PBO) and fair value of plan assets (FVPL) as reflected in the financial statements?<\/p><\/div>", "subj": "fsa"}, {"n": 24, "q": "For forecasting the dilution from future grants of share-based compensation and its effects on valuation, which of the following approaches is least appropriate?", "opts": ["Discount the estimated value of equity by a dilution factor.", "Add share-based compensation expense estimates to free cash flow estimates and increase the number of shares outstanding based on the same estimates.", "Deduct share-based compensation expense from estimates of free cash flows and ignore dilution."], "ans": "B", "expl": "Free cash flows are already estimated by adding share-based compensation, so adding them again would be incorrect. The dilution from future grants can be addressed by discounting the estimated value of equity by a dilution factor or by estimating an increase in the number of shares outstanding. Alternatively, we can just deduct share-based compensation expense from estimates of free cash flows and not worry about forecasting dilutive shares.", "explhtml": "<p>Free cash flows are already estimated by adding share-based compensation, so adding them again would be incorrect. The dilution from future grants can be addressed by discounting the estimated value of equity by a dilution factor or by estimating an increase in the number of shares outstanding. Alternatively, we can just deduct share-based compensation expense from estimates of free cash flows and not worry about forecasting dilutive shares.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 8.1, LOS 8.c<\/div><div class=\"qtext\"><p>For forecasting the dilution from future grants of share-based compensation and its effects on valuation, which of the following approaches is least appropriate?<\/p><\/div>", "subj": "fsa"}, {"n": 25, "q": "The expense reported for 20X1 is closest to:", "opts": ["$133,333.", "$222,833.", "$187,033."], "ans": "B", "expl": "Value of the options on grant date = 1.79 x 150,000 = $268,500 Value of stock grant = 16 x 25,000 = $400,000 Both are amortized straight line over the 3-year vesting period. Expense = (268,500+400,000) / 3 = $222,833 per year", "explhtml": "<p>Value of the options on grant date = 1.79 x 150,000 = $268,500<\/p><p>Value of stock grant = 16 x 25,000 = $400,000<\/p><p>Both are amortized straight line over the 3-year vesting period.<\/p><p>Expense = (268,500+400,000) / 3 = $222,833 per year<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 25–31<\/summary><div class=\"vig-body\"><p>Prisma Inc. started an employee stock option and RSU grant plan. On Jan 1, 20X1, the company made a grant of 150,000 at-the-money options (maturing in five years) and 25,000 shares. The fair value of the options was $1.79 and the stock price on the date of the grant was $16. Both awards vest after 3 years. The average stock price during the year was $17 and it was $17.50 at the end of the year.<\/p><\/div><\/details><div class=\"pp-topic\">Module 8.1, LOS 8.b<\/div><div class=\"qtext\"><p>The expense reported for 20X1 is closest to:<\/p><\/div>", "subj": "fsa"}, {"n": 26, "q": "The cash outflow reported on account of share-based compensation is:", "opts": ["$133,333.", "$222,833.", "$0."], "ans": "C", "expl": "Option and stock grants have zero cash-flow implications (they are non-cash grants).", "explhtml": "<p>Option and st const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){

})();

      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });

    let tbase = prev.tbase;

    localStorage.setItem(PROG_KEY, JSON.stringify(

  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }

// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";

function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";

    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;

                      toggleNav(); };

  });

function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);

  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();

  closeConfirm();

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring

    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option

      const cb = $("opt-"+i+"-"+q.ans);

  const pct = Math.round(correct/DATA.length*100);

  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";

const CFA_SESSION_SUBJECT_RANGES = {
  1:{ethics:[27,27],quant:[11,17],economics:[11,17],fsa:[20,25],corporate:[10,16]},
  2:{equity:[20,25],fixed:[20,25],derivatives:[9,14],alternatives:[11,16],portfolio:[14,22]}
};
const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,
  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,
  fsa:/financial statement|financial reporting|accounting|income statement|balance sheet|cash flow|revenue|expense|inventory|cost of sales|gross profit|gross margin|shareholders?['’]? equity|earnings per share|\beps\b|audit|gaap|ifrs|taxable income|deferred tax|temporary difference|intangible|long-lived|revaluation|impairment|amortization|depreciation|pension|financial ratio|receivables turnover|payables turnover|cash conversion|fixed charge coverage|normalized earnings|management['’]?s commentary/g,
  corporate:/corporate|company lifecycle|start-up|startup|early-stage|business model|franchise|board of directors|proxy voting|stakeholder|shareholder|creditor|governance|capital budgeting|capital investment|project|real option|\bnpv\b|internal rate of return|\birr\b|cost of debt|cost of capital|capital structure|weight of debt|modigliani|dividend policy|double taxation|principal-agent|working capital|liquidity|compensation|competitive strategy|porter|economies of scale|information asymmetry|agency relationship/g,
  equity:/equity|common share|preferred share|stock|market index|index weighting|market efficiency|efficient market|security market|buy order|sell order|limit order|dealer|margin requirement|leverage ratio|industry classification|company analysis|enterprise value|price-to|free cash flow to equity|\bfcfe\b|dividend discount|earnings multiplier|book value per share|intrinsic value|voting|ex-dividend/g,
  fixed:/fixed-income|fixed income|bond|debt|credit rating|credit spread|yield|spot rate|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|repo|covenant|accrued interest|priority of claims|default|extension risk|interest coverage/g,
  derivatives:/derivative|forward|future|swap|option|call buyer|call seller|put buyer|put seller|strike price|premium|put-call|binomial|contingent claim|moneyness|expiration|arbitrage|replication/g,
  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,
  portfolio:/portfolio|asset allocation|investment policy|\bips\b|behavioral|cognitive error|risk aversion|utility|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation|covariance|sharpe|treynor|jensen|information ratio|two-fund|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral/g
};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
