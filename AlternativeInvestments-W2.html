<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "A private equity fund specializes in leveraged buyouts. Its investors have committed a total of €45 million in capital. The fund has invested €40 million as of the end of 20X8 but has not yet demanded the remaining €5 million in commitments. For 20X8, the fund's assets generated a 15% unrealized gain, and the fund has not sold any of its investments. If the fund charges a 2% management fee and a 20% incentive fee, the total fees that the fund earned for 20X8 are closest to: ", "opts": ["€900,000", "€2,100,000", "€2,120,000"], "ans": "A", "expl": "Private equity vs. hedge fund fee structures\nFee Private equity Hedge funds\nInternal rate of return (IRR) of a portfolio, accounts for all contributions\nBased totally on AUM\nand withdrawals\nManagement \"Committed capital\" inapplicable to hedge\nSwitches to % of assets under management (AUM) after investing all\nfunds\ncommitted capital\nAlways based on % of profits (realized or\nBased on % of profits realized on sale of fund holdings\nnot)\nIncentive Profits are not distributed (and incentive fee is not earned) until holdings\nFund has discretion on distributing\nare sold\nrealized profits\nMost private equity funds obtain capital commitments from their investors. This means that for a specified period, such as three years, the\ninvestors are legally obligated to invest a specific amount when demanded by the fund. Investors do not actually provide capital until the fund\nneeds cash for an investment.\nPrivate equity funds typically charge separate management and incentive fees. The management fee is a percentage of the committed capital\nuntil the fund has invested all of the capital committed by its investors. At that point, the management fee is based on assets under management\n(AUM). This fund has invested only €40 million of the €45 million committed, so its management fee is 2% of €45 million, or €900,000. Note that\nthis is lower than if the fee were based on AUM, which would include the 15% gain on the invested funds.\nAny incentive fee is based on the fund's realized profits, so the fund earns an incentive fee only when it sells an asset. The fund's 15% return is\nunrealized, so it earns only the management fee for 20X8.\n(Choice B) The fund earned 15% on the €40 million invested, so AUM is €46 million for a profit of €6 million. Twenty percent of this amount is\n€1.2 million. If the 20% management fee is incorrectly added to the incentive fee, the total fee is computed as €900,000 + €1.2 million = €2.10\nmillion.\n(Choice C) This answer incorrectly bases the management fee on AUM (46 million × 0.02 = €920,000) and also incorrectly adds an incentive fee\nfor a total of €2.12 million.\nThings to remember:\nPrivate equity (PE) funds charge both an annual management fee and an incentive fee. Initially, the management fee is a percentage of\ncommitted capital. The incentive fee is based on realized profits from sales of the funds' assets. PE funds earn no incentive fees on unrealized\ngains.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 2, "q": "A hedge fund began the year with ¥20 billion in assets under management (AUM). It ended the year with ¥25 billion in AUM before deducting any fees. The fund's fee structure is as follows: Management fee: 2% of AUM Incentive fee: 20% of profits, net of management fee, with a high-water mark of ¥23 billion and a 5% hard hurdle rate The total fees charged by the fund for the year are closest to: ", "opts": ["¥570 million", "¥670 million", "¥800 million"], "ans": "A", "expl": "Typical hedge fund fee structure\nFee Basis for calculation Specific details\nTypically 1%−3% of AUM annually\nAssets under\nManagement Does not depend on fund's profitability\nmanagement (AUM)\nAlways calculated before incentive fee\nCan be net or gross of management fee\nPerformance or incentive Annual returns Can be subject to hurdle rate and/or\nhigh-water mark\nHedge funds typically charge both a management fee and an incentive fee. The management fee is calculated as a percentage of the total\nvalue of the fund's assets (ie, assets under management, or AUM). It is assessed each year regardless of whether the fund earned a profit or\nincurred a loss. In this question, the fund's management fee is ¥500 million, calculated as follows:\nThe incentive fee is based on the fund's profits. It can also be subject to a hurdle rate and/or a high-water mark. Since this fund's incentive fee\nis net of the management fee, AUM is adjusted by subtracting the management fee from AUM before calculating the incentive fee. This fund's\nadjusted ending AUM is ¥24.5 billion, which exceeds the high-water mark of ¥23 billion, so the fund is entitled to an incentive fee.\nIf a hurdle rate applies, then the incentive fee is based on the profits in excess of the hurdle rate. This means that the high-water mark is adjusted\nupward by multiplying it by (1 + hurdle rate). After making the necessary adjustments, the fund's profits on which the incentive fee is based are\n¥350 million, as shown below:\nThe incentive fee is 20% × ¥350 million, or ¥70 million. Adding the incentive fee to the management fee results in a total fee of ¥570 million.\nThings to remember:\nHedge funds charge both a management fee, which does not depend on profitability, and an incentive fee. The incentive fee can be calculated\nindependently of the management fee or net of it. The incentive fee can be subject to a high-water mark and/or a hurdle rate.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 3, "q": "The seed investor of a three-year-old hedge fund that invests in high-yield private placements requests a redemption of £20 million. Fund details are listed below: Fund assets £50 million High-water mark £51 million Fee structure 2% and 20% Redemption notice period 2 weeks Lockup period 1 year Hurdle rate 2% Average annual returns since inception 1.5% Number of positions 20 Which of the following is the most likely outcome? ", "opts": ["The forced liquidation causes the hedge fund to close.", "There is sufficient time for an orderly disposition of assets.", "The hedge fund could invoke the lockup clause, delaying the redemption."], "ans": "A", "expl": "Effect of redemptions on hedge funds\nPoor performance often results in redemptions.\nA drawdown below the high-water mark is often a catalyst for redemptions.\nLarge redemptions often cause forced selling, leading to further losses.\nRedemption notice periods help insulate a hedge fund from withdrawals.\nLockup periods commit investors to a minimum investment period.\nThe redemption is most likely catastrophic for this hedge fund for the following reasons:\nThe redemption (£20 million) represents 40% of assets, making it difficult for the fund to continue executing its strategy.\nThe fund has performed poorly, on average not even hitting its hurdle rate, and assets under management are currently valued below the\nhigh-water mark.\nLike other areas of asset management, fees have decreased, even for the hedge fund industry. The 2-and-20 structure, common in the\npast, is now considered high for all but the most successful firms.\nThe two-week redemption notice period is not long enough to result in an orderly disposition of assets since the fund is concentrated (only\n20 positions) in illiquid assets (high-yield private placements) (Choice B).\nThis relatively large redemption will create a negative feedback loop: The fund will be forced to sell assets, most likely creating losses and poor\nperformance that will result in more redemptions, more asset sales, even poorer performance, and eventual liquidation.\n(Choice C) As the seed (ie, initial) investor, this investor has been with the fund since its inception three years ago and is no longer restricted by\nthe lockup period.\nThings to remember:\nRedemptions often coincide with poor performance, particularly when hedge funds fall below their high-water mark. Large redemptions can\ncompound performance issues, driving down the prices of fund holdings and resulting in more redemptions. This vicious cycle can ultimately lead\nto fund closure.\nDescribe the performance appraisal of alternative investments", "qhtml": null}, {"n": 4, "q": "A private equity fund operates with a hard hurdle of 6% and a 20% performance fee. The firm draws down its €200 million initial investment to purchase a portfolio company. Three years later, the portfolio company is sold for €280 million. If the firm operated with a soft hurdle instead of a hard hurdle, the additional performance fees (in € millions) that the GP would earn is closest to:", "opts": ["2.4", "7.6", "12.8"], "ans": "B", "expl": "Alternative asset funds can use many structures to calculate fees. One option is for funds to set a hurdle rate, which is a minimum rate of\nreturn that fund managers must achieve for investors before they start earning performance fees.\nHard hurdle rates allow fund managers to earn performance fees on only returns that are greater than the hurdle rate.\nSoft hurdle rates allow fund managers to earn performance fees on entire returns. They also allow fund managers to catch up their fees\nafter the limited partners (LPs) have been paid.\nIn this question, the fund achieved an €80 million (= €280 million − €200 million), or 40% gain. This exceeds the hurdle rate of 19.1% (= 1.063 −\n1), so the general partner (GP) is entitled to a performance fee. To find the difference between performance fees under hard and soft hurdle rates,\nboth must be calculated:\nAlternatively, the performance fee under the soft hurdle can be calculated as 80.0 × 0.2 (= 16.0). The difference between the soft hurdle and hard\nhurdle is 7.6 million (= 16.0 − 8.4)\n(Choice A) 2.4 incorrectly sets the hurdle rate at 6%, not accounting for three years of returns.\n(Choice C) 12.8 incorrectly calculates the catch-up fee earned under the soft hurdle rate as the performance fee on the whole gain.\nThings to remember:\nA hurdle rate is a minimum rate of return that fund managers much achieve for investors before they start earning performance fees. Hard hurdle\nrates allow fund managers to earn performance fees on only returns greater than the hurdle rate. Soft hurdle rates allow fund managers to earn\nperformance fees on entire returns.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 5, "q": "A hedge fund has EUR 800 million of initial capital. The fund charges a 3.0% management fee and a 15.0% incentive fee based on returns that exceed a 5.0% hurdle rate. Over a year, the fund increases in value by 25.0%. Assuming that management fees are calculated using end-of-year assets under management and that the performance fee is calculated net of the management fee, a fund investor's return, net of fees, is closest to:", "opts": ["12.4%", "14.6%", "18.8%"], "ans": "C", "expl": "Hedge funds typically charge both a management fee and an incentive fee. The management fee is calculated as a percentage of the total\nvalue of the fund's assets (ie, assets under management [AUM]). It is assessed each year regardless of whether the fund earned a profit or\nincurred a loss. In this instance, the fund's management fee is EUR 30 million, calculated as follows:\nThe incentive fee is based on the fund's profits. In this case, the fund earned 25% over the year, resulting in total profits of EUR 200 million\n(ending AUM − beginning AUM or 1,000 − 800). When the incentive fee is subject to a hurdle rate, any incentive fee is calculated on the profit in\nexcess of the hurdle rate. Since the incentive fee is also net of the management fee here, the total profit is adjusted by both the management fee\nand the hurdle rate prior to applying the incentive fee:\nAdding the incentive fee of EUR 19.5 million to the management fee of EUR 30 million results in a total fee of EUR 49.5 million. To calculate the\ninvestor's return, subtract the total fee from ending AUM (1,000 − 49.5 = 950.5) and then calculate the return percentage as follows (recalling\nthat beginning AUM was EUR 800 million):\n(Choice A) 12.4% results from calculating the return as the profit net of fees divided by the ending, not the beginning, AUM.\n(Choice B) 14.6% results from failing to calculate the incentive fee net of the management fee.\nThings to remember:\nHedge funds charge both a management fee (a percentage of the total assets under management) and an incentive fee. The incentive fee is\ncontingent on whether the fund earns a profit and may be subject to a hurdle rate.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 6, "q": "At the end of 20X4, a hedge fund had $25 million in assets under management (AUM). The fund has the following fee structure, high-water mark, and 20X5 results: Selected Data Management fee (average assets) 1% Incentive fee (net of management fee) 10% Soft hurdle rate 6% High-water mark (millions) $27 Year-end fund assets 20X5 (millions) $30 Assuming no inflows or outflows, the incentive fee (in $) earned by this hedge fund for 20X5 is closest to:", "opts": ["109,000", "272,500", "300,000"], "ans": "B", "expl": "Hedge funds charge a management fee and an incentive fee. The management fee is calculated as a percentage of the total value of the fund's\nassets under management (AUM). It is assessed each year regardless of profitability.\nThe incentive fee is levied against the fund's annual gains, subject to certain conditions. It is calculated either gross or net of the management\nfee. The net calculation subtracts the management fee from AUM to arrive at an adjusted AUM that is used to calculate the fund's profits.\nThe high-water mark represents the value of AUM, net of fees, at any time during the fund's existence. To earn an incentive fee, the fund must\nexceed the high-water mark, the base from which the fee is calculated.\nThe hurdle rate is the minimum profit that the fund must earn (usually annually) before it receives an incentive fee. The hurdle rate can either\nbe \"soft,\" meaning that the incentive fee is calculated based on the entire profit, or \"hard,\" meaning that the incentive fee is based on only the\nexcess profit above the hurdle rate.\nIn this scenario, the fund generated net returns in 20X5 of 18.9% ( = (29.725 – 25) / 25 ), above the soft hurdle rate of 6%, and eclipsed the high-\nwater mark of $27 million. Therefore, the fund earned an incentive fee of 10% of profits, net of the management fee on average assets of\n$27,500,000:\n0.10 × (29,725,000 − 27,000,000) = $272,500.\nThings to remember:\nHedge funds charge both a fixed management fee and a variable incentive fee. The incentive fee is contingent on whether the fund earns a profit\nand may be subject to a high-water mark and hurdle rate.\nCalculate and interpret alternative investment returns both before and after fees\n7.An endowment invested €10 million into a hedge fund on January 1 of Year 1 and neither added nor withdrew funds since then. Information\nconcerning the fund is shown as of the beginning of Year 5:\nAssets under management (AUM), beginning of year €200 million\nManagement fee 3% of year-end AUM\nIncentive fee 20% of annual profits\nIncentive fee calculation Independent of management fee\nPrevious high-water mark €250 million\nFund's return for the year 15%\nThe incentive fee is independent of the management fee and is subject to the high-water mark. If the fees are based on year-end AUM, then the\nendowment's return for the year is closest to:\nA. 8.6%\n\nB. 11.6%\nC. 15.0%\nExplanation\nA hedge fund investor's return is calculated after the hedge fund deducts its fees. Hedge funds typically impose both a management fee and an\nincentive fee. The management fee is calculated as a percentage of the total value of fund's assets (ie, assets under management, or AUM).\nIt is assessed at the end of each year regardless of profitability. The fund's management fee is €230 million × 3%, or €6.9 million.\nThe incentive fee is calculated as a percentage of profits. It can be calculated either after deducting the management fee (net) or before doing\nso (gross). Also, the incentive fee may be contingent on profits being greater than the hurdle rate and/or AUM being higher than the high-water\nmark.\nThis fund has no hurdle rate, but its incentive fee is subject to a high-water mark. In this scenario, the high-water mark of €250 million means that\nending AUM must exceed that amount before it can earn an incentive fee from the endowment. With ending AUM of only €230 million, the fund\nreceives no incentive fee.\nThe endowment's return for the year is calculated as follows (AUM and profits in € millions):\nThings to remember:\nHedge funds usually charge both a management fee and an incentive fee. The management fee is calculated as a percentage of the total value of\nfund's assets (AUM). It is assessed at the end of each year regardless of profitability. The incentive fee is calculated as a percentage of profits,\neither net or gross of the management fee. Also, the incentive fee may be contingent on the hurdle rate and/or the high-water mark.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 7, "q": "An endowment invested €10 million into a hedge fund on January 1 of Year 1 and neither added nor withdrew funds since then. Information concerning the fund is shown as of the beginning of Year 5: Assets under management (AUM), beginning of year €200 million Management fee 3% of year-end AUM Incentive fee 20% of annual profits Incentive fee calculation Independent of management fee Previous high-water mark €250 million Fund's return for the year 15% The incentive fee is independent of the management fee and is subject to the high-water mark. If the fees are based on year-end AUM, then the endowment's return for the year is closest to:", "opts": ["8.6%", "11.6%", "15.0%"], "ans": "B", "expl": "A hedge fund investor's return is calculated after the hedge fund deducts its fees. Hedge funds typically impose both a management fee and an\nincentive fee. The management fee is calculated as a percentage of the total value of fund's assets (ie, assets under management, or AUM).\nIt is assessed at the end of each year regardless of profitability. The fund's management fee is €230 million × 3%, or €6.9 million.\nThe incentive fee is calculated as a percentage of profits. It can be calculated either after deducting the management fee (net) or before doing\nso (gross). Also, the incentive fee may be contingent on profits being greater than the hurdle rate and/or AUM being higher than the high-water\nmark.\nThis fund has no hurdle rate, but its incentive fee is subject to a high-water mark. In this scenario, the high-water mark of €250 million means that\nending AUM must exceed that amount before it can earn an incentive fee from the endowment. With ending AUM of only €230 million, the fund\nreceives no incentive fee.\nThe endowment's return for the year is calculated as follows (AUM and profits in € millions):\nThings to remember:\nHedge funds usually charge both a management fee and an incentive fee. The management fee is calculated as a percentage of the total value of\nfund's assets (AUM). It is assessed at the end of each year regardless of profitability. The incentive fee is calculated as a percentage of profits,\neither net or gross of the management fee. Also, the incentive fee may be contingent on the hurdle rate and/or the high-water mark.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 8, "q": "A hedge fund's fees are calculated independently, and the fund does not collect an incentive fee on assets that have already been subject to that fee. Which of the following best describes this fee structure?", "opts": ["Management and incentive fees are on a net basis, subject to a hurdle rate", "Management fees are on a gross basis and incentive fees are on a net basis", "Management and incentive fees are on a gross basis, subject to a high-water mark"], "ans": "C", "expl": "Typical hedge fund fee structure\nFee Basis for calculation Specific details\nTypically 1%−3% of AUM annually\nAssets under\nManagement Does not depend on fund's profitability\nmanagement (AUM)\nAlways calculated before incentive fee\nCan be net or gross of management fee\nPerformance or incentive Annual returns Can be subject to hurdle rate and/or\nhigh-water mark\nHedge funds often levy both a management fee and an incentive fee. If fees are calculated independently, calculations are on a gross basis.\nAn incentive fee is often contingent on:\nprofits being greater than a hurdle rate, which is the minimum performance that a fund must achieve before earning a performance fee,\nand/or\nAssets under management (AUM) being above a high-water mark (HWM), which is the base asset value used to calculate the incentive\nfee. The HWM represents the fund's previous peak value of AUM at which incentive fees have been paid.\nIn this case, the fee structure's management and incentive fees are on a gross basis (ie, independently), subject to a high-water mark, since the\nfund does not collect an incentive fee on assets that have already been subject to that fee (Choices A and B).\nThings to remember:\nHedge funds often levy both a management fee and an incentive fee. If fees are calculated independently, calculations are on a gross basis. The\nhigh-water mark represents the fund's previous peak value of assets under management (AUM) at which incentive fees have been paid.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 9, "q": "An investor most appropriately uses the Sharpe ratio as the risk-adjusted return measure for a hedge fund when the fund's:", "opts": ["holdings are illiquid.", "returns are normally distributed.", "strategy relies on significant leverage."], "ans": "B", "expl": "The Sharpe ratio measures excess return relative to total risk, using standard deviation as the measure of risk. However, standard deviation\nis an appropriate risk metric only when the investment's returns are normally distributed. Many hedge funds' return distributions are non-\nnormal, often exhibiting skewness and kurtosis. For those funds, the Sortino and Calmar ratios may be a more appropriate measure.\n(Choice A) Illiquid assets trade infrequently and their value must be estimated. Calculating returns based on subjective estimates of the assets'\nvalue rather than actual market prices frequently reduces price volatility, resulting in return smoothing. Thus, the standard deviation of those\nreturns most likely understates their true volatility.\n(Choice C) Large amounts of leverage introduce the risk of large left-tail events (ie, negative skew). The Sharpe ratio will often not reveal this\ndynamic until it is \"too late.\" It is equally or even more important to understand how the fund's performance history was created than to know the\nrisk metric's output based on that performance.\nThings to remember:\nThe Sharpe ratio is an appropriate measure for a hedge fund's risk-adjusted return only when the investment's returns are normally distributed.\nMany hedge funds have non-normal distributions, use leverage, and have illiquid holdings; these factors make the Sharpe ratio a less appropriate\nperformance metric.\nDescribe the performance appraisal of alternative investments", "qhtml": null}, {"n": 10, "q": "A hedge fund manager wants the power to liquidate positions in a well-organized way whenever necessary and plans to impose restrictions on investors' ability to redeem capital. Which of the following restrictions would be most appropriate? ", "opts": ["Notice period", "Lockup period", "Redemption fee"], "ans": "A", "expl": "Investor redemptions can significantly impact the performance of hedge funds. Unplanned redemption requests may force the fund manager to\nsell illiquid or volatile assets at unfavorable prices. This may harm fund performance and result in losses for the remaining investors.\nHedge funds often impose restrictions on investors, discouraging or prohibiting redemptions during specific periods:\nA lockup period is the minimum time an investor is committed to a fund after the initial investment. This restriction should give the fund\nmanager a reasonable time frame to select and acquire assets that optimize the fund's strategy. Withdrawals are not allowed during this\nperiod, but nothing restricts redemptions after the lockup period ends (Choice B).\nA notice period is the length of time an investor is required to wait to receive a redemption after requesting it. This restriction gives the fund\nmanager more time to convert assets into cash, which reduces the risk of forced selling and makes the notice period the most appropriate\nchoice for fund managers concerned about liquidity.\nRedemption fees are paid by investors when redeeming their capital and are generally added back to the fund. The fees compensate the\nremaining investors for losses the fund may eventually suffer when liquidating positions in an accelerated way. Redemption fees\ndiscourage but do not prohibit redemptions at any time (Choice C).\nThings to remember:\nHedge funds often impose restrictions on redemptions. These restrictions may prohibit investors from redeeming for a period after the initial\ninvestment (lockup period) and/or require advance notice for processing redemptions (notice period). Funds may also impose redemption fees,\nwhich discourage—but do not prohibit—redemptions and generally compensate the remaining investors for any resulting losses.\nDescribe the performance appraisal of alternative investments", "qhtml": null}, {"n": 11, "q": "Which of the following is the least appropriate ratio to use for evaluating the performance of a market-neutral hedge fund?", "opts": ["MAR ratio", "Calmar ratio", "Treynor ratio"], "ans": "C", "expl": "Investment returns are often expressed on a risk-adjusted basis (ie, return per level of risk). The Treynor ratio measures excess returns relative\nto systematic risk, in which:\nexcess return is calculated as the difference between the portfolio's return and the return of a risk-free asset (eg, US Treasury bill or T-\nbill), and\nsystematic risk is measured by beta.\nThe Treynor ratio is therefore more suitable for evaluating a fully diversified portfolio that does not have company-specific risk.\nMarket-neutral hedge funds invest in individual securities while targeting an average beta of zero so that they carry only nonsystematic risk.\nTherefore, trying to calculate a market-neutral hedge fund's excess return per unit of systematic risk is not appropriate.\n(Choices A and B) Both the Calmar and MAR ratios are appropriate for measuring the risk-adjusted performance of alternative assets or hedge\nfunds by accounting for the drawdown loss. Both compare compounded average annual returns against the maximum drawdown.\nThings to remember:\nThe Treynor ratio determines a portfolio's excess return per unit of systematic risk (and would not be an appropriate measure of performance for a\nmarket-neutral hedge fund). The Calmar and MAR ratios measure the risk-adjusted performance of alternative assets or hedge funds by\naccounting for the drawdown loss.\nDescribe the performance appraisal of alternative investments", "qhtml": null}, {"n": 12, "q": "A hedge fund had the following attributes during 20X3: Management fee 1.5% Incentive fee 15.0% Soft hurdle rate 5.0% High-water mark $200 million Beginning assets $191 million Ending assets $216 million If the management fee is calculated on ending assets and the incentive fee is based on net returns, the return (%) to the investor for 20X3 is closest to:", "opts": ["9.7", "10.4", "10.8"], "ans": "B", "expl": "Typical hedge fund fee structure\nFee Basis for calculation Specific details\nTypically 1%−3% of AUM annually\nAssets under\nManagement Does not depend on fund's profitability\nmanagement (AUM)\nAlways calculated before incentive fee\nCan be net or gross of management fee\nPerformance or incentive Annual returns Can be subject to hurdle rate and/or\nhigh-water mark\nAn investor's hedge fund return is calculated net of fees. Hedge funds often levy both a management fee and an incentive fee. The\nmanagement fee is calculated as a percentage of the fund's total assets under management (AUM) and is assessed regardless of profitability.\nThe incentive fee is calculated as a percentage of profits, either net (ie, after deducting) or gross (ie, before deducting) of management fees.\nAn incentive fee is often contingent on profits being greater than a hurdle rate and/or AUM being higher than the high-water mark. The threshold\nfor this hedge fund to earn an incentive fee is contingent on exceeding the 5% soft hurdle rate and the high-water mark of $200 million. Since this\nfund has a soft hurdle rate, the incentive fee will be applied to the entire gain above the high-water mark.\nThe fund's return for the year is calculated as follows (AUM and profits in $ millions):\n(Choice A) 9.7% is the investor return by assuming no high-water mark.\n(Choice C) 10.8% is the investor return assuming a hard hurdle rate of 5%. A hard hurdle rate increases an investor's return, as the incentive fee\nis earned only on returns at or above the hurdle rate, not the entire gain.\nThings to remember:\nAn investor's return in a hedge fund is calculated net of fees. Hedge funds levy both a management fee and an incentive fee. The management\nfee is calculated as a percentage of the fund's total value and is assessed regardless of profitability. The incentive fee is calculated as a\npercentage of profits, subject to hurdle rates and high-water marks.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 13, "q": "The general partner of a private equity fund will most likely earn an incentive fee once the:", "opts": ["clawback provision has been invoked.", "committed capital has been fully drawn down.", "limited partners' initial investment has been paid back."], "ans": "C", "expl": "Private equity vs. hedge fund fee structures\nFee Private equity Hedge funds\nInternal rate of return (IRR) of a portfolio, accounts for all contributions\nBased totally on AUM\nand withdrawals\nManagement \"Committed capital\" inapplicable to hedge\nSwitches to % of assets under management (AUM) after investing all\nfunds\ncommitted capital\nAlways based on % of profits (realized or\nBased on % of profits realized on sale of fund holdings\nnot)\nIncentive Profits are not distributed (and incentive fee is not earned) until holdings\nFund has discretion on distributing\nare sold\nrealized profits\nPrivate equity (PE) funds charge both an annual management fee and an incentive fee. The incentive fee is based on realized profits from the\nsale of the fund's investments. The general partner (GP) (ie, fund manager) is eligible for the incentive fee once the limited partners (ie,\ninvestors) have received distributions equal to their initial investments.\n(Choice A) If incentive fees are paid throughout the life of the fund as investments are sold, the GP may receive more than the contractually\nagreed upon portion of profits due to losses on other holdings. In this situation, a clawback provision requires the GP to repay a portion of the\nincentive fee or forfeit future incentive fees.\n(Choice B) Committed capital refers to the amount the limited partners have agreed to provide the PE fund upon request to finance a new\ninvestment. A PE fund will draw down these capital commitments, usually over three to five years. The incentive fee is based on fund\nperformance and is not contingent on the full draw down of committed capital.\nThings to remember:\nThe incentive fee is based on realized profits from the sale of the fund's investments. Once investors have received distributions equal to their\ninitial investment, the general partner can be paid an incentive fee.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 14, "q": "An investor invests in the HFX fund of funds at the beginning of 20X2. At that time HFX has a net asset value of $240 million. HFX charges a 1% management fee assessed on ending assets under management and a 10% incentive fee assessed on profits before deducting the management fee. At the end of 20X2, HFX's net assets are valued at $270 million before the assessment of any fees. The annual return earned by the investor, net of all fees, is closest to: ", "opts": ["10.1%", "10.2%", "12.5%"], "ans": "A", "expl": "A fund of funds (FOF) is a hedge fund that invests in multiple hedge funds. This gives an investor diversification among different hedge funds\nthrough a single investment. Other advantages include enhanced due diligence and access to funds that are otherwise closed to investors.\nThe main disadvantage is that a FOF carries higher costs. Investors incur fees on assets under management as well as incentive fees imposed\nby both the fund of funds and the hedge funds in which it invests. The fees of the portfolio hedge funds are a drag on performance, but they are\nalready reflected in HFX's year-end valuation in this scenario and therefore not a separate factor in the FOF return calculation.\nThe incentive fee is calculated as a percentage of profits and can be on either a net (ie, after management fee) or gross (ie, before management\nfee) basis. In this case, the incentive fee is calculated on a gross basis.\n(Choice B) 10.2% results from calculating the incentive fee net of the management fee.\n(Choice C) 12.5% results from failing to deduct the management and incentive fees when calculating the return.\nThings to remember:\nA fund of funds invests in multiple hedge funds. Both the fund of funds and the hedge funds in which it invests assess fees that reduce investor\nreturns. The fees of the portfolio hedge funds are already reflected in the fund of funds' valuation and therefore not a separate factor when\ncalculating its performance.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 15, "q": "For performance appraisal of alternative investments, one advantage of using the IRR instead of the multiple of invested capital (MOIC) is that the IRR:", "opts": ["is perceived as more intuitive.", "has a more straightforward calculation.", "considers the timing of cash flow decisions."], "ans": "C", "expl": "Some types of alternative investments (ie, private equity or real estate) have variable cash flows in which investors often experience low or\nnegative cash flows early in the investment, with cash flows eventually turning positive. Ideally, measuring returns capture both the amount and\nthe timing of cash flows.\nIRR is the primary measure used to assess investments with variable cash flows. The IRR calculation considers the timing of an investment's\ncash flows and its overall time frame, as well as the opportunity cost of the capital committed to an investment.\nThe multiple of invested capital (MOIC) (ie, money multiple) is a ratio of total value of all residual asset values and distributions to the initial\ninvestment; thus, it is expressed as a multiple of the initial investment. This is viewed as a shortcut method that does not consider the\ninvestment time frame.\nIRR's main advantage over MOIC is that it accounts for how cash flow timing affects returns. IRR also has two key disadvantages:\nIt is less intuitive than MOIC: MOIC illustrates how much an investor has received relative to the amount initially invested (Choice A).\nIRR is more complicated to calculate: MOIC is simply a multiple at a point in time and ignores effects from the timing of cash flows; IRR\nrelies on assumptions about financing and reinvestment rates (Choice B).\nThings to remember:\nPrivate equity and real estate investments tend to have variable cash flows and therefore are measured using tools that are suited for cash flow\nvariability. IRR is the primary measure used since it accounts for both cash flow timing and amount. However, investors also rely on other\nmeasures (such as the multiple of invested capital) that are more intuitive.\nDescribe the performance appraisal of alternative investments", "qhtml": null}, {"n": 16, "q": "When evaluating the portfolio risk of an alternative investment with a leptokurtic return profile, which of the following is the most appropriate measure to capture drawdown risk? ", "opts": ["Calmar ratio", "Sharpe ratio", "Treynor ratio"], "ans": "A", "expl": "Alternative investments (eg, hedge funds, private equity) often have non-normal, leptokurtic return distributions (ie, a taller peak and fatter tails\nthan a normal distribution), so risk measures based on a normal distribution, such as the Sharpe ratio, are not appropriate for evaluating those\ninvestments' risk (Choice B).\nThe Calmar ratio takes a commonsense approach to measuring portfolio risk, focusing on drawdown risk. It is the ratio of the most recent\nthree-year annualized returns relative to the peak-to-trough observed loss (ie, maximum drawdown) over the same time. Since it does not use\nthe standard deviation as a measure of risk, it can be applied to investments that are not normally distributed. The advantage of the Calmar ratio\nis its observational and calculational simplicity.\n(Choice C) The Treynor ratio measures excess return relative to the portfolio's beta (versus a market index). The Treynor ratio is a relative\nmeasure, not an absolute measure that measures drawdown risk.\nThings to remember:\nThe Calmar ratio takes a commonsense approach to measuring portfolio risk, focusing on drawdown risk, and is not subject to a normal\ndistribution constraint. The Calmar ratio uses the most recent three-year annualized returns relative to maximum drawdown over the same time.\nThe advantage of the Calmar ratio is its observational and calculational simplicity.\nDescribe the performance appraisal of alternative investments", "qhtml": null}, {"n": 17, "q": "The high-water mark used for incentive fee calculation is most likely based on a fund's:", "opts": ["net assets.", "hurdle rate.", "gross assets."], "ans": "A", "expl": "Hedge funds charge performance-based incentive fees, subject to certain constraints, on investors' assets. One constraint is a high-water mark\n(HWM), the base asset value that is used to calculate the incentive fee:\nThe HWM is the fund's previous peak value of assets under management (AUM) that has earned an incentive fee.\nIt is calculated net of fees, so that all fees and expenses are deducted from the fund's assets before determining the HWM and investors do\nnot pay the incentive fee for those costs (Choice C).\nAn HWM protects investors by preventing the hedge fund from collecting an incentive fee twice for the same performance. For example, in the\nimage above, the fund reached an HWM in Year 2. After a significant decline in Year 3, the fund had a positive performance in Year 4. The fund\nmight have been eligible for an incentive fee in Year 4 had it not already collected an incentive fee on that same value of assets (ie, same\nperformance) in Year 2. The fund may earn an incentive fee in Year 5 since its performance surpasses the HWM set in Year 2.\n(Choice B) A hurdle rate is the minimum total return, either net or gross of management fees, that a fund must earn before it receives an incentive\nfee.\nThings to remember:\nA high-water mark (HWM), the base asset value that is used to calculate the incentive fee, is defined as the fund's previous peak value of assets\nunder management that has earned an incentive fee. HWMs are always calculated net of fees, so that all fees and expenses are deducted from\nthe fund's assets before determining the HWM.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 18, "q": "An analyst using the Sortino ratio to evaluate an alternative investment is most likely interested in the investment's:", "opts": ["total risk.", "downside risk.", "systematic risk."], "ans": "B", "expl": "Alternative investments (eg, hedge funds) often have nonnormal return distributions. The distributions may be negatively skewed or leptokurtic,\nboth of which indicate the investments have a greater probability of negative returns than implied by a normal distribution.\nStandard deviation, the basis of many risk-adjusted return measures (eg, Sharpe ratio), is based on a normal distribution of returns. Given the\nnature of standard deviation, downside (eg, very large negative returns) and upside (eg, very large positive returns) volatility are treated equally in\nassessing risk.\nIn contrast, the Sortino ratio measures return relative to downside deviation and incorporates only returns below a minimum return\nthreshold (eg, risk-free rate, zero) in the risk calculation; in effect, returns below the threshold are the only returns that constitute risk. This ratio is\ntherefore a more appropriate measure of downside risk. The Sortino ratio can be used as a comparative tool; the investment with the higher\nratio is preferred since it is generating more return per downside risk (ie, unfavorable volatility).\n(Choice A) Return relative to total risk is best reflected by the Sharpe ratio, not the Sortino ratio. The Sharpe ratio captures both upside and\ndownside volatility by using the standard deviation as a risk measure.\n(Choice C) Return relative to systematic risk is best reflected by the Treynor ratio, not the Sortino ratio. The Treynor ratio uses beta, a measure\nof systematic risk, as its risk measure.\nThings to remember:\nThe Sortino ratio measures return relative to downside deviation, which penalizes only returns below a minimum return threshold and is therefore\nan appropriate measure of downside risk. Many alternative investments have nonnormal return distributions, making the Sortino ratio an effective\ntool in evaluating the risk of these investments.\nDescribe the performance appraisal of alternative investments", "qhtml": null}, {"n": 19, "q": "A fund of funds (FoF) has a \"1 and 10\" fee structure, with all fees calculated independently at year end. At the beginning of the year, the FoF has €150 million equally allocated among three hedge funds. For the year, the hedge fund's' returns are −2%, 10%, and 16%. If the FoF has a high-water mark of €152 million, the total fee paid to the FoF is closest to:", "opts": ["€2.46 million.", "€2.50 million.", "€2.62 million."], "ans": "C", "expl": "Typical hedge fund fee structure\nFee Basis for calculation Specific details\nTypically 1%−3% of AUM annually\nAssets under\nManagement Does not depend on fund's profitability\nmanagement (AUM)\nAlways calculated before incentive fee\nCan be net or gross of management fee\nPerformance or incentive Annual returns Can be subject to hurdle rate and/or\nhigh-water mark\nA fund of funds (FoF) is a hedge fund that invests in other hedge funds. Hedge funds often levy both a management fee and an incentive fee.\nThe management fee is calculated as a percentage of the fund's end-of-period assets under management (AUM) and is assessed\nregardless of profitability.\nThe incentive fee is calculated as a percentage of profits either gross (ie, before deduction) or net (ie, after deduction) of management\nfees.\nIf fees are calculated independently, calculations are on a gross basis.\nAn incentive fee is often contingent on profits being greater than a hurdle rate and/or the AUM being above a high-water mark (HWM), which is\nthe base asset value used to calculate the incentive fee. The HWM represents the fund's previous peak AUM value that has already earned an\nincentive fee.\nThe FoF's fees and return are calculated (with year-end values and fees in € millions) as follows:\nSteps Calculations\nCalculate the FoF's year-end asset value 49 + 55 + 58 = 162\nCalculate management fee 162 × 0.01 = 1.62\nCalculate HWM-adjusted incentive fee base 162 − 152 = 10.0\nCalculate incentive fee 10.0 × 0.10 = 1.00\nTotal fee paid to FoF 1.62 + 1.00 = 2.62\nIn this scenario, the total fee paid to the FoF is €2.62 million.\n(Choice A) A total fee of €2.46 million results from calculating the incentive fee on a net basis.\n(Choice B) A total of €2.50 million results from inappropriately using beginning AUM to calculate the management fee.\nThings to remember:\nA fund of funds (FoF) is a hedge fund that invests in other hedge funds. Hedge funds often levy both a management fee and an incentive fee.\nInvestors incur fees from the FoF and its underlying hedge funds.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 20, "q": "At the beginning of the year, a new fund of funds invests £300 million equally among three hedge funds. The fund of funds has a \"1 and 10\" fee structure and a 5% soft hurdle rate. Management and incentive fees are calculated independently at year end. After one year, the returns of the underlying hedge funds, gross of fees, are −2%, 6%, and 10%. The total fees paid to the fund of funds is closest to:", "opts": ["£3.14 million.", "£4.54 million.", "£4.74 million."], "ans": "A", "expl": "A fund of funds (FoF) is a hedge fund that invests in other hedge funds. Hedge funds often levy both a management fee and an incentive fee.\nThe management fee is calculated as a percentage of the fund's total ending assets under management (AUM) and is assessed regardless of\nprofitability. The incentive fee is calculated as a percentage of profits either net of (ie, after deducting) or gross of (ie, before deducting) the\nmanagement fee; incentive fees assessed on a gross basis are said to be \"calculated independently.\"\nAn incentive fee is often contingent on profits being greater than a hurdle rate and/or the AUM being above the high-water mark. The FoF's fees\nand return are calculated as follows (year-end values and fees in £ millions):\nSteps Calculations\nFoF year-end value = year-end value of each fund 98 + 106 + 110 = 314\nCalculate return before fees (300 = initial investment) (314 − 300) / 300 ≈ 4.67%\nCalculate management fee 314 × 0.01 = 3.14\nIn this scenario, the FoF's threshold to earn an incentive fee depends on the profits exceeding the hurdle rate. Since the 4.67% return does not\nexceed the 5% hurdle rate, no incentive fee is paid.\n(Choice B) Total fees of £4.54 million result from inappropriately assuming a soft hurdle incentive fee is paid on all gains.\n(Choice C) Total fees of £4.74 million result from inappropriately assuming a soft hurdle incentive fee is paid on the two underlying hedge funds\nthat exceeded the hurdle rate.\nThings to remember:\nA fund of funds (FoF) is a hedge fund that invests in other hedge funds. Hedge funds often levy both a management fee and an incentive fee.\nInvestors incur fees from both the FoF and its underlying hedge funds.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 21, "q": "The following table depicts a hedge fund's performance and fee information for year-end 20X7: Assets $130 million Fund's net performance 30% High-water mark $100 million Incentive fee $3 million Based on only the information provided, which of the following best describes the hedge fund's incentive fee structure? ", "opts": ["A soft hurdle rate of 5% and a 10% incentive fee", "A soft hurdle rate of 10% and a 12% incentive fee", "A hard hurdle rate of 10% and a 10% incentive fee"], "ans": "A", "expl": "A hedge fund charges incentive fees subject to certain constraints that include the following:\nThe hurdle rate, which is the minimum total return, either net or gross of management fees, that the fund must earn before it receives an\nincentive fee. The hurdle rate can be either:\nsoft, so that the incentive fee is based on the entire profit, or\nhard, so that the incentive fee is based on only returns in excess of the hurdle rate.\nThe high-water mark, a base asset value used to calculate the incentive fee. It is the fund's previous peak value of assets under\nmanagement that resulted in an incentive fee.\nIn this scenario, the fund's net performance (ie, after management fees) of 30% cleared all the given hurdle rates, which entitles the fund to an\nincentive fee. The soft hurdle rate allows the fund to collect the incentive fee on the entire gain above the high-water mark (ie, 10% of $30\nmillion = $3 million).\n(Choice B) This structure implies a $3.6 million incentive fee (ie, 12% of $30 million). However, the incentive fee in this scenario is $3 million.\nThe soft hurdle rate of 10% allows the fund to collect on the entire gain above the high-water mark of $100 million (ie, 130 − 100 = 30).\n(Choice C) Given a high-water mark of $100 million and a 10% hard hurdle rate, the fund would receive an incentive fee on only the gains above\nthe hurdle rate. The fund's net performance of 30% minus 10% equals 20%, and 20% of $100 million is $20 million, so the incentive fee would be\n10% of $20 million (ie, $2 million).\nThings to remember:\nThe hurdle rate is the minimum total return that the fund must earn before it receives an incentive fee. A soft hurdle rate allows the incentive fee to\nbe earned on the entire profit. A hard hurdle rate results in an incentive fee based on only the excess returns above the hurdle rate.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 22, "q": "Using internal models to value the assets in a fund's portfolios is most likely for which of the following?", "opts": ["Macro hedge funds", "Hedge funds specializing in distressed debt", "Hedge funds focused on fundamental value strategies"], "ans": "B", "expl": "Proper asset valuations are necessary for calculating investment performance. Valuation is straightforward when an asset is highly liquid and\ntrades frequently since prices are readily available. Valuation becomes more difficult and subjective when prices cannot be readily observed\nor when an asset trades infrequently.\nInternal modeling tends to be used for valuation only if other, more objective methods cannot be applied. Internal modeling is typically used if the\nasset is:\nilliquid,\nnot traded on exchanges,\nnot priced by outside sources, or\naffected by unobservable inputs or assumptions\nDistressed debt generally fits all these criteria, so hedge funds specializing in distressed debt would likely use internal models to value their\nassets.\n(Choice A) Macro hedge funds invest opportunistically across a wide variety of asset classes, including derivatives. The value of certain\nderivatives such as interest rate swaps or currency swaps depends on rates that are directly observable in the market.\n(Choice C) Assets that trade regularly on public exchanges have reliable and easily available prices. Hedge funds specializing in fundamental\nvalue strategies establish long and short positions on assets that are openly traded in the market, and thus are unlikely to rely on internal models.\nThings to remember:\nCalculations of investment performance rely on proper valuations. Some hedge fund strategies rely on assets whose valuation depends on\ninternal modeling instead of market pricing since their assets are typically illiquid, not traded on exchanges, not priced by outside sources, and are\naffected by unobservable inputs or assumptions.\nDescribe the performance appraisal of alternative investments", "qhtml": null}, {"n": 23, "q": "A hedge fund begins the year with £100 million in assets. The fund charges a 2% management fee and 20% incentive fee (calculated net of the management fee) on year-end assets, subject to a 6% hard hurdle rate. At year-end, the fund had appreciated by 8%. The investor's return is closest to:", "opts": ["4.67%", "5.84%", "6.00%"], "ans": "B", "expl": "Typical hedge fund fee structure\nFee Basis for calculation Specific details\nTypically 1%−3% of AUM annually\nAssets under\nManagement Does not depend on fund's profitability\nmanagement (AUM)\nAlways calculated before incentive fee\nCan be net or gross of management fee\nPerformance or incentive Annual returns Can be subject to hurdle rate and/or\nhigh-water mark\nA hedge fund investor's return is calculated net of fees and as a percentage of the fund's beginning-of-period value. Hedge funds often levy both a\nmanagement fee and an incentive fee.\nThe management fee is calculated as a percentage of the fund's total ending assets under management (AUM) and is assessed\nregardless of profitability.\nThe incentive fee is calculated as a percentage of profits either net (ie, after deducting) or gross (ie, before deducting) of management\nfees.\nAn incentive fee is often contingent on profits being greater than a hurdle rate and/or AUM being higher than a high-water mark. In this scenario,\nthe fund's threshold to earn an incentive fee is contingent on exceeding the 6% hard hurdle rate.\nThe investor's return for the year is calculated as follows:\n(Choice A) 4.67% results from not accounting for the hurdle rate and assumes paying an incentive fee on £5.84 million.\n(Choice C) 6.00% inappropriately assumes the management fee is calculated on beginning AUM, so that there are £2 million in total fees paid.\nThings to remember:\nAn investor's return on a hedge fund is calculated net of fees and as a percentage of the fund's beginning value. Hedge funds levy both a\nmanagement fee and an incentive fee. The management fee is calculated as a percentage of the fund's ending total value, gross of fees, and\nassessed regardless of profitability. The incentive fee is calculated as a percentage of profits, subject to hurdle rates and high-water marks.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 24, "q": "Within the context of a new hedge fund, which of the following best describes founders' shares? Founders' shares entitle early fund investors to: ", "opts": ["a lower fee structure than subsequent investors.", "lower fees in exchange for a longer lockup period.", "an \"either/or\" fee structure of management fees or incentive fees."], "ans": "A", "expl": "Hedge funds and funds of funds (FOFs): custom fee arrangements\nFees based on liquidity terms Reduced fees for longer lock-up period, or based on total assets invested in the fund for large\nand/or asset size investors, placement agents, and FOFs\nFounders' shares Early investors in new funds pay a lower fee to incentivize initial fund growth\nEither/or fees Investors pay either a management fee or an incentive fee, but not both\nHedge funds frequently charge both a management fee and an incentive fee. Hedge fund fees are often negotiated, enticing investors to commit\ncapital, particularly for new or small hedge funds. These custom fee arrangements can take many forms, but a common arrangement includes\nfounders' shares, which entitle early investors to:\npermanently lower fees, up to a certain monetary threshold (eg, $100 million invested), or\nfees that do not apply until the fund grows to a certain size (eg, greater than $100 million AUM).\n(Choice B) Lower fees in exchange for a longer lockup period indicate a liquidity-based fee arrangement, not founder's shares.\n(Choice C) An \"either/or\" fee structure is not a characteristic of founders' shares and refers to an arrangement of paying either management or\nincentive fees. For example, an investor may agree to pay a 30% incentive fee if certain performance thresholds are met, but in exchange will not\npay an annual management fee.\nThings to remember:\nHedge fund fees are often negotiated, enticing investors to commit capital, particularly for new or small funds. Founders' shares entitle early fund\ninvestors to permanently lower fees, up to a certain monetary threshold, or to fees that do not apply until the fund grows to a certain size.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 25, "q": "A hedge fund has the following fee structure, charged on year-end assets under management (AUM): Annual management fee 1.5% Incentive fee 12% Soft hurdle rate 5% High-water mark $380 million The fund value is $372 million at the beginning of the year and $412 million, before fees, at the end of the year. For this year, if fees are calculated independently, the net return to the investor is closest to:", "opts": ["7.80%", "8.06%", "8.67%"], "ans": "B", "expl": "An investor's return is calculated net of fees and as a percentage of the fund's beginning value. Hedge funds often levy both a management fee\nand an incentive fee.\nThe management fee is calculated as a percentage of the fund's total ending assets under management (AUM) and is assessed\nregardless of profitability.\nThe incentive fee is calculated as a percentage of profits either net (ie, after deducting) or gross (ie, before deducting) of management\nfees.\nIf fees are calculated independently, the hurdle rate determination and fee calculations are on a gross basis.\nAn incentive fee is often contingent on profits being greater than a hurdle rate and/or AUM being higher than the high-water mark. In this scenario,\nthe fund's threshold to earn an incentive fee is contingent on exceeding the 5% soft hurdle rate and the high-water mark of $380 million. Due to\nthe soft hurdle rate, the incentive fee will be applied to the entire gain above the high-water mark.\nThe investor's return for the year is calculated (in $ millions) as follows:\n(Choice A) A 7.80% return inappropriately calculates returns using beginning AUM, instead of the high-water mark, as the incentive fee's base.\n(Choice C) An 8.67% return inappropriately calculates returns using a hard hurdle rate.\nThings to remember:\nAn investor's return on a hedge fund is calculated net of fees and as a percentage of the fund's beginning value. Hedge funds levy both a\nmanagement fee and an incentive fee. The management fee is calculated as a percentage of the fund's ending total value, gross of fees, and\nassessed regardless of profitability. The incentive fee is calculated as a percentage of profits, subject to hurdle rates and high-water marks.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 26, "q": "Which measure of private equity industry performance is most likely to be overstated?", "opts": ["Volatility", "Published returns", "Correlation with other assets"], "ans": "B", "expl": "Issues when measuring private equity performance\nDescription Published Results\nExcluding firms that no\nSurvivorship bias Overstate returns\nlonger exist\nReporting multiple\nperiods after not\nBackfill bias Overstate returns\nreporting them in the\npast\nNot updating\nFailure to use mark-to- Understate volatility and\ninvestments to market\nmarket accounting correlations\nvaluations\nPrivate equity funds provide the potential for strong returns at increased levels of risk. However, published returns (eg, an index) can\noverstate the performance of funds due to the challenges of measuring private equity performance. These challenges include survivorship bias\nand backfill bias.\nSurvivorship bias occurs when indexes include the performance of funds that exist when the data is collected but exclude funds that\nhave ceased to exist, often due to poor performance.\nBackfill bias occurs when a fund that previously declined to report its results suddenly reports multiple periods of historical returns. This\nis more likely if the fund has experienced a period of improved performance, but a fund is required to report all historical results. Otherwise,\nthe current period's industry results will not reflect the fund's withheld poor performance.\nThe likely effect of both biases is that funds with lower performance are omitted from tracking.\n(Choices A and C) The failure of private equity funds to mark investments to market creates an illusion of stationary pricing when actual values\nhave changed, leading to an understatement of volatility. Observed correlation with other assets is also understated if a fund's reported prices do\nnot accurately reflect movements in the market.\nThings to remember:\nThe published returns of private equity funds can be overstated due to survivorship bias and backfill bias. Survivorship bias occurs when indexes\nfail to include the performance of funds that have ceased to exist. Backfill bias occurs when funds that have been withholding their returns\nsuddenly report multiple periods of historical results.\nDescribe the performance appraisal of alternative investments", "qhtml": null}, {"n": 27, "q": "A hedge fund begins the year with EUR 250 million in assets under management (AUM) and ends the year with EUR 300 million prior to deducting any fees. The fund charges a 1.5% management fee, calculated based on ending AUM, and an 18% incentive fee. There is no hurdle rate or high-water mark. If the incentive fee is calculated net of the management fee, the investor's return net of fees is closest to:", "opts": ["12.4%", "14.6%", "14.9%"], "ans": "C", "expl": "Hedge funds impose both a management fee and an incentive fee. The management fee is calculated as a percentage of the total value of\nthe fund's assets under management (AUM). The management fee is assessed each year regardless of profitability. The incentive fee is\nbased on the fund's annual profits, subject to certain conditions. The incentive fee is calculated either independently of the management fee or\nnet of it.\nIn this instance, the incentive fee is calculated net of management fees. To calculate the incentive fee, first subtract the management fee from the\ntotal profit. Multiply the resulting adjusted profit by the incentive fee percentage. To calculate the return percentage, take the difference\nbetween the ending AUM after fees and the beginning AUM and divide that amount by the beginning AUM.\n(Choice A) 12.4% results from calculating the return as the profit net of fees divided by beginning, not ending, AUM.\n(Choice B) 14.6% results from failing to calculate the incentive fee net of the management fee.\nThings to remember:\nHedge funds charge both a management fee and an incentive fee. The management fee is calculated as a percentage of the total value of the\nfund's assets under management. The incentive fee is contingent on whether the fund earns a profit, whereas the management fee does not\ndepend on profitability.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 28, "q": "A hedge fund charges a 2% management fee and a 20% incentive fee, with a hurdle rate of 5%. Both fees are calculated based on year-end assets under management (AUM), and the incentive fee is calculated net of the management fee. In addition, the incentive fee is subject to a high-water mark of €27 million. This year, the fund began the year with AUM of €25 million and realized a 10% return before fees. The net-of-fee return that an investor in the fund realized for the year is closest to:", "opts": ["2.30%", "2.41%", "7.80%"], "ans": "C", "expl": "Hedge funds impose both a management fee and an incentive fee. The management fee is calculated as a percentage of the total value of the\nfund's assets (ie, assets under management, or AUM). It is assessed each year regardless of profitability.\nThe incentive fee is levied against the fund's annual profits, subject to certain conditions. It is calculated either independently of the\nmanagement fee or net of it. The net calculation means that the fund first subtracts the management fee from AUM; the resulting number is used\nto calculate the fund's profits.\nThe incentive fee can also be subject to a hurdle rate and/or a high-water mark. Here, the fund's hurdle rate is 5%. Its total return is 10%, so any\nincentive fee is calculated on the excess return, or (10% − 5%) = 5%. However, the high-water mark is €27 million. After deducting the\nmanagement fee, adjusted AUM is €26.95 million, which is less than the high-water mark. The fund earns no incentive fee for the year.\nThe investor's return is calculated as follows:\n(Choices A and B) These choices incorrectly assume that the hedge fund earned an incentive fee. This is based on misinterpreting the fund's\nbefore-fee AUM of €27.5 million as exceeding the €27 million high-water mark. Choice A calculates an incentive fee gross of the management fee,\nwhereas Choice B calculates it net of the management fee.\nThings to remember:\nHedge funds charge both a management fee and an incentive fee. The incentive fee is contingent on whether the fund earns a profit, whereas the\nmanagement fee does not depend on profitability. In addition, an incentive fee may be contingent on whether assets under management exceed a\nhigh-water mark and/or whether the fund's return for a period exceeds a hurdle rate.\nCalculate and interpret alternative investment returns both before and after fees", "qhtml": null}];
const CFG = {"title": "Wiley · Alternative Investment Performance and Returns", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Alternative Investments · 28 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
