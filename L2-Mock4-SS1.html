 told that Betacorp is a potential acquisition target for Consolidated, and therefore, valuation based on a controlling interest perspective is appropriate (and a dividend discount model would be inappropriate).<\/p><p>Because Betacorp&#x27;s capital structure is volatile, a FCFF-based valuation model would be preferred over a FCFE-based model.<\/p><p>(Module 21.1, LOS 21.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Carl Warner, CFA, has been asked to review the financial information of Global Drug World (GDW) in preparation for a possible takeover bid by rival competitor Consolidated Drugstores International (Consolidated). GDW has produced impressive results since going public via an initial public offering in 2008. Through a program of aggressive growth by acquisition, GDW is currently seen as a major player and a threat to Consolidated&#x27;s own plans for growth and profitability. In preparation for his analysis, Warner has gathered the following financial data from GDW&#x27;s year-end statements.<\/p><p>GDW Statement of Income for Year Ended May 31, 2018<\/p><div class=\"tbl\"><table><tr><td>Sales<\/td><td>4,052,173<\/td><\/tr><\/table><\/div><p>Expenses<\/p><div class=\"tbl\"><table><tr><td>Cost of goods sold, general and operating expenses<\/td><td>3,735,397<\/td><\/tr><tr><td>Noncash charges<\/td><td>56,293<\/td><\/tr><tr><td>Interest on long-term debt<\/td><td>20,265<\/td><\/tr><tr><td>Other interest 3,817,178<\/td><td>5,223<\/td><\/tr><tr><td>Income before income taxes<\/td><td>234,995<\/td><\/tr><tr><td>Income taxes<\/td><td>70,499<\/td><\/tr><tr><td>Net income<\/td><td>164,497<\/td><\/tr><tr><td>Earnings per share<\/td><td>0.72<\/td><\/tr><\/table><\/div><p>Partial GDW Balance Sheet on May 31, 2018<\/p><p>Assets<\/p><p>Current assets (excluding cash)<\/p><div class=\"tbl\"><table><tr><td>Accounts receivable<\/td><td>284,762<\/td><\/tr><tr><td>Inventories<\/td><td>490,755<\/td><\/tr><tr><td>Prepaid expenses<\/td><td>23,743<\/td><\/tr><tr><td>Total current assets (excluding cash)<\/td><td>799,260<\/td><\/tr><tr><td>Property, plant, and equipment<\/td><td>687,890<\/td><\/tr><tr><td>Other assets<\/td><td>236,417<\/td><\/tr><\/table><\/div><p>Liabilities<\/p><p>Current liabilities (excluding notes payable)<\/p><div class=\"tbl\"><table><tr><td>Accounts payable and accrued liabilities<\/td><td>296,564<\/td><\/tr><tr><td>Other<\/td><td>100,039<\/td><\/tr><tr><td>Total current liabilities (excluding notes payable)<\/td><td>396,603<\/td><\/tr><tr><td>Long-term debt<\/td><td>262,981<\/td><\/tr><tr><td>Other liabilities<\/td><td>15,484<\/td><\/tr><\/table><\/div><p>Additional Information<\/p><div class=\"tbl\"><table><tr><td>Risk-free rate<\/td><td>4.5%<\/td><\/tr><tr><td>WACC<\/td><td>7.5%<\/td><\/tr><tr><td>2018 working capital investment<\/td><td>$7,325<\/td><\/tr><tr><td>2018 dividends<\/td><td>$82,248<\/td><\/tr><tr><td>Beta<\/td><td>1.10<\/td><\/tr><tr><td>Investment in fixed capital in 2018<\/td><td>$143,579<\/td><\/tr><tr><td>Market risk premium<\/td><td>5%<\/td><\/tr><tr><td>Total equity May 31, 2017<\/td><td>$1,019,869<\/td><\/tr><tr><td>Principal repayment of long-term debt in 2018<\/td><td>$33,275<\/td><\/tr><tr><td>Notes payable issued in 2018<\/td><td>$5,866<\/td><\/tr><tr><td>2018 change in liabilities<\/td><td>$27,409<\/td><\/tr><tr><td>Tax rate<\/td><td>30%<\/td><\/tr><\/table><\/div><p>As part of his analysis, Warner needs to forecast the free cash flow to the firm (FCFF) for 2019. The best information he has points to an increase in sales of 6%. The earnings before interest and tax (EBIT) margin is not expected to change from the rate of 6.4% achieved in 2018. Fixed capital spending is expected to be $36,470. Investment in net working capital is expected to be $24,313. Moreover, Warner notes that the only noncash charge is depreciation, which he estimates will be $60,000.<\/p><p>Warner has been asked to analyze the effect each of the following corporate events, if taken during 2019, would have on GDW&#x27;s free cash flow to equity (FCFE):<\/p><p>20% increase in dividends per share.<\/p><p>Repurchase of 25% of the firm&#x27;s outstanding shares using cash. New common share offering that would increase shares outstanding by 30%. New issue of convertible bonds that are not callable for five years and would increase the level of debt by 10%.<\/p><p>Warner is also interested in valuing Betacorp, another acquisition possibility for Consolidated. Warner notes that Betacorp is a mature, profitable company with generous dividend payments, which has resulted in a volatile capital structure for the company.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following approaches would Warner most appropriately use to value Betacorp?<\/p><\/div>","subj":"equity"},{"n":17,"q":"The free cash flow to equity for Schön AG for 20X9 is closest to:","opts":["€439 million.","€488 million.","€499 million."],"ans":"B","expl":"FCFE | = CFO − FCInv + net borrowings\n= 1042 (given), net borrowings is change in long-term debt and notes CFO payable\nFCInv | = CF from investing = 648\nFCFE | = 1042 − 648 + [(2,070 + 644) − (2,020 + 600)] = €488 million\nPlease note that CF from investing activities and FCInv may not be always the same, but in the curriculum (and for this question), they are treated as same.\n(Module 21.4, LOS 21.d)","explhtml":"<div class=\"tbl\"><table><tr><td>FCFE<\/td><td>= CFO − FCInv + net borrowings<\/td><\/tr><\/table><\/div><p>= 1042 (given), net borrowings is change in long-term debt and notes CFO payable<\/p><div class=\"tbl\"><table><tr><td>FCInv<\/td><td>= CF from investing = 648<\/td><\/tr><tr><td>FCFE<\/td><td>= 1042 − 648 + [(2,070 + 644) − (2,020 + 600)] = €488 million<\/td><\/tr><\/table><\/div><p>Please note that CF from investing activities and FCInv may not be always the same, but in the curriculum (and for this question), they are treated as same.<\/p><p>(Module 21.4, LOS 21.d)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Marie LeBlanc, CFA, is an analyst at Lee Nguyen Investments, an international equities investment firm. LeBlanc has been asked to value two European cosmetics companies, Schön AG and Hermosa S.A.<\/p><p>The beauty products industry is a mature industry with few competitors. One segment that is growing is luxury skin care; while the cosmetics industry is expected to grow at a steady rate of 3.5%, the luxury skin care segment is expected to grow at 5.5%.<\/p><p>Schön AG, based in Frankfurt, Germany, is the largest company in the luxury skin care segment of the cosmetics industry. Schön is considered a very stable company within the cosmetics industry and the luxury skin care segment. Schön&#x27;s equity beta is 1.00.<\/p><p>LeBlanc collects selected financial information from Schön&#x27;s income statement and cash flow statement (for the last fiscal year) and from Schön&#x27;s balance sheet (for the last two fiscal year ends). The information is shown in Exhibit 1. Negative numbers are indicated in parentheses. There is no preferred stock, and no long-term asset sales occurred in 20X9.<\/p><p>Exhibit 1: Selected Schön Financial Information (€ millions except for rates and ratios)<\/p><div class=\"tbl\"><table><tr><td>Income Statement<\/td><td>20X9<\/td><td>Balance Sheet<\/td><td>20X8<\/td><td>20X9<\/td><\/tr><tr><td>Revenue<\/td><td>4,250<\/td><td>Total current assets<\/td><td>2,408<\/td><td>2,577<\/td><\/tr><tr><td>EBITDA<\/td><td>1,461<\/td><td>Net PPE<\/td><td>3,794<\/td><td>4,150<\/td><\/tr><tr><td>Operating income<\/td><td>1,169<\/td><td>Notes payable<\/td><td>600<\/td><td>644<\/td><\/tr><tr><td>Interest expense<\/td><td>150<\/td><td>Long-term debt<\/td><td>2,020<\/td><td>2,070<\/td><\/tr><tr><td>Income tax rate<\/td><td>30%<\/td><td>Total liabilities<\/td><td>3,210<\/td><td>3,378<\/td><\/tr><tr><td>Dividends<\/td><td>357<\/td><td>Total equity<\/td><td>2,992<\/td><td>3,349<\/td><\/tr><tr><td>Other Information<\/td><td>20X9<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>CF from operations<\/td><td>1,042<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>CF from investing<\/td><td>(648)<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Risk-free rate<\/td><td>2.50%<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>After-tax cost of debt<\/td><td>4.50%<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Cost of equity<\/td><td>8.50%<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Target D/E ratio<\/td><td>1.00<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Hermosa S.A., based in Barcelona, Spain, is the third largest company in the luxury skin care segment of the cosmetics industry. Hermosa is considered a growth company within the cosmetics industry and the luxury skin care segment. Hermosa has not issued bonds and all of Hermosa&#x27;s debt is considered short and intermediate term. For the fiscal year 20X9, FCFF is €143 million and FCFE is €136.23 million. Hermosa pays no dividends. Hermosa&#x27;s earnings are expected to grow at 14.0% for three years and then at the expected overall rate of growth in the luxury skin care segment. Hermosa&#x27;s equity beta is 1.20. The risk-free rate is 2.5%. Hermosa&#x27;s target weight for debt is 25.0%. Hermosa has 200 million shares outstanding.<\/p><p>Elizabeth Nguyen, one of the partners at Lee Nguyen Investments, approaches LeBlanc about a client interested in buying Hermosa S.A. Nguyen asks LeBlanc about using the residual income method to value Hermosa.<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Residual income models can be used with a variety of inventory cost flow assumptions without any adjustments.<\/td><\/tr><tr><td>Statement 2:<\/td><td>If the company has any special purpose entities that are not consolidated, we need to adjust the reported financial statements, effectively consolidating the SPE, before applying the residual income method.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The free cash flow to equity for Schön AG for 20X9 is closest to:<\/p><\/div>","subj":"equity"},{"n":18,"q":"Assuming that the growth rate of Schön earnings is equal to the overall cosmetics industry growth rate, the value of the firm is closest to:","opts":["€17.2 billion.","€33.6 billion.","€49.9 billion."],"ans":"A","expl":"FCFF = CFO + Int(1 − tax rate) − FCInv = 1042 + 150(0.7) − 648 = €499 Overall growth rate for cosmetics industry = 3.5%\nPercentage | Cost\nDebt | 50% | 4.50%\nEquity | 50% | 8.50%\nWACC | 6.50%\nCosmetics industry growth rate €499×(1+0.035) = €17,216 million 0.065−0.035 | 3.50%\n(Module 21.5, LOS 21.j) (Module 21.5, LOS 21.k)","explhtml":"<p>FCFF = CFO + Int(1 − tax rate) − FCInv = 1042 + 150(0.7) − 648 = €499 Overall growth rate for cosmetics industry = 3.5%<\/p><div class=\"tbl\"><table><tr><td>Percentage<\/td><td>Cost<\/td><td><\/td><\/tr><tr><td>Debt<\/td><td>50%<\/td><td>4.50%<\/td><\/tr><tr><td>Equity<\/td><td>50%<\/td><td>8.50%<\/td><\/tr><tr><td>WACC<\/td><td>6.50%<\/td><td><\/td><\/tr><tr><td>Cosmetics industry growth rate €499×(1+0.035) = €17,216 million 0.065−0.035<\/td><td>3.50%<\/td><td><\/td><\/tr><\/table><\/div><p>(Module 21.5, LOS 21.j) (Module 21.5, LOS 21.k)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marie LeBlanc, CFA, is an analyst at Lee Nguyen Investments, an international equities investment firm. LeBlanc has been asked to value two European cosmetics companies, Schön AG and Hermosa S.A.<\/p><p>The beauty products industry is a mature industry with few competitors. One segment that is growing is luxury skin care; while the cosmetics industry is expected to grow at a steady rate of 3.5%, the luxury skin care segment is expected to grow at 5.5%.<\/p><p>Schön AG, based in Frankfurt, Germany, is the largest company in the luxury skin care segment of the cosmetics industry. Schön is considered a very stable company within the cosmetics industry and the luxury skin care segment. Schön&#x27;s equity beta is 1.00.<\/p><p>LeBlanc collects selected financial information from Schön&#x27;s income statement and cash flow statement (for the last fiscal year) and from Schön&#x27;s balance sheet (for the last two fiscal year ends). The information is shown in Exhibit 1. Negative numbers are indicated in parentheses. There is no preferred stock, and no long-term asset sales occurred in 20X9.<\/p><p>Exhibit 1: Selected Schön Financial Information (€ millions except for rates and ratios)<\/p><div class=\"tbl\"><table><tr><td>Income Statement<\/td><td>20X9<\/td><td>Balance Sheet<\/td><td>20X8<\/td><td>20X9<\/td><\/tr><tr><td>Revenue<\/td><td>4,250<\/td><td>Total current assets<\/td><td>2,408<\/td><td>2,577<\/td><\/tr><tr><td>EBITDA<\/td><td>1,461<\/td><td>Net PPE<\/td><td>3,794<\/td><td>4,150<\/td><\/tr><tr><td>Operating income<\/td><td>1,169<\/td><td>Notes payable<\/td><td>600<\/td><td>644<\/td><\/tr><tr><td>Interest expense<\/td><td>150<\/td><td>Long-term debt<\/td><td>2,020<\/td><td>2,070<\/td><\/tr><tr><td>Income tax rate<\/td><td>30%<\/td><td>Total liabilities<\/td><td>3,210<\/td><td>3,378<\/td><\/tr><tr><td>Dividends<\/td><td>357<\/td><td>Total equity<\/td><td>2,992<\/td><td>3,349<\/td><\/tr><tr><td>Other Information<\/td><td>20X9<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>CF from operations<\/td><td>1,042<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>CF from investing<\/td><td>(648)<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Risk-free rate<\/td><td>2.50%<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>After-tax cost of debt<\/td><td>4.50%<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Cost of equity<\/td><td>8.50%<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Target D/E ratio<\/td><td>1.00<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Hermosa S.A., based in Barcelona, Spain, is the third largest company in the luxury skin care segment of the cosmetics industry. Hermosa is considered a growth company within the cosmetics industry and the luxury skin care segment. Hermosa has not issued bonds and all of Hermosa&#x27;s debt is considered short and intermediate term. For the fiscal year 20X9, FCFF is €143 million and FCFE is €136.23 million. Hermosa pays no dividends. Hermosa&#x27;s earnings are expected to grow at 14.0% for three years and then at the expected overall rate of growth in the luxury skin care segment. Hermosa&#x27;s equity beta is 1.20. The risk-free rate is 2.5%. Hermosa&#x27;s target weight for debt is 25.0%. Hermosa has 200 million shares outstanding.<\/p><p>Elizabeth Nguyen, one of the partners at Lee Nguyen Investments, approaches LeBlanc about a client interested in buying Hermosa S.A. Nguyen asks LeBlanc about using the residual income method to value Hermosa.<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Residual income models can be used with a variety of inventory cost flow assumptions without any adjustments.<\/td><\/tr><tr><td>Statement 2:<\/td><td>If the company has any special purpose entities that are not consolidated, we need to adjust the reported financial statements, effectively consolidating the SPE, before applying the residual income method.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Assuming that the growth rate of Schön earnings is equal to the overall cosmetics industry growth rate, the value of the firm is closest to:<\/p><\/div>","subj":"equity"},{"n":19,"q":"The estimated value of Hermosa stock using FCFE valuation is closest to:","opts":["€19.70.","€21.40.","€22.10."],"ans":"B","expl":"To value Hermosa stock, use the following information and apply the two-stage growth model. FCFE for the fiscal year is €136 million. Growth rate for the first 3 years is 14.0%; growth rate after 3 years is 5.5%. For CAPM, expected return on market = 8.5% (since Schön with a beta of 1 should have the same expected rate of return as the market).\nCost of equity (Hermosa) = 0.025 + 1.2 × (0.085 − 0.025) = 9.70%.\nYr 1 | Yr 2 | Yr 3\n1 | 155.3 | 177.0 | 201.8\nFCFE (in € millions)\nTerminal value 5,069 | 2\nTotal cash flow (in € millions) | 155.3 | 177.0 | 5,270.8\nCost of equity | 9.70%\n1 FCFE1 = FCFE0(1 + g) = 136.23(1 + 0.14) = 155.3\n201.8(1.055)\nTerminal value = (0.097−0.055) | = 5,069\nFor the calculator inputs for NPV function, CF0 = 0, CF1 = 155.3, CF2 = 177.0, CF3 = 5,270.5, I/Y = 9.7.\nEstimated value is €4,281.26 million. Divide this value by 200 million shares for €21.40 per share.\n(Module 21.5, LOS 21.k)","explhtml":"<p>To value Hermosa stock, use the following information and apply the two-stage growth model. FCFE for the fiscal year is €136 million. Growth rate for the first 3 years is 14.0%; growth rate after 3 years is 5.5%. For CAPM, expected return on market = 8.5% (since Schön with a beta of 1 should have the same expected rate of return as the market).<\/p><p>Cost of equity (Hermosa) = 0.025 + 1.2 × (0.085 − 0.025) = 9.70%.<\/p><div class=\"tbl\"><table><tr><td>Yr 1<\/td><td>Yr 2<\/td><td>Yr 3<\/td><td><\/td><\/tr><tr><td><sup>1<\/sup><\/td><td>155.3<\/td><td>177.0<\/td><td>201.8<\/td><\/tr><\/table><\/div><p>FCFE (in € millions)<\/p><div class=\"tbl\"><table><tr><td>Terminal value 5,069<\/td><td><sup>2<\/sup><\/td><td><\/td><td><\/td><\/tr><tr><td>Total cash flow (in € millions)<\/td><td>155.3<\/td><td>177.0<\/td><td>5,270.8<\/td><\/tr><tr><td>Cost of equity<\/td><td>9.70%<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>1 FCFE1 = FCFE0(1 + g) = 136.23(1 + 0.14) = 155.3<\/p><p>201.8(1.055)<\/p><div class=\"tbl\"><table><tr><td>Terminal value = (0.097−0.055)<\/td><td>= 5,069<\/td><\/tr><\/table><\/div><p>For the calculator inputs for NPV function, CF0 = 0, CF1 = 155.3, CF2 = 177.0, CF3 = 5,270.5, I/Y = 9.7.<\/p><p>Estimated value is €4,281.26 million. Divide this value by 200 million shares for €21.40 per share.<\/p><p>(Module 21.5, LOS 21.k)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marie LeBlanc, CFA, is an analyst at Lee Nguyen Investments, an international equities investment firm. LeBlanc has been asked to value two European cosmetics companies, Schön AG and Hermosa S.A.<\/p><p>The beauty products industry is a mature industry with few competitors. One segment that is growing is luxury skin care; while the cosmetics industry is expected to grow at a steady rate of 3.5%, the luxury skin care segment is expected to grow at 5.5%.<\/p><p>Schön AG, based in Frankfurt, Germany, is the largest company in the luxury skin care segment of the cosmetics industry. Schön is considered a very stable company within the cosmetics industry and the luxury skin care segment. Schön&#x27;s equity beta is 1.00.<\/p><p>LeBlanc collects selected financial information from Schön&#x27;s income statement and cash flow statement (for the last fiscal year) and from Schön&#x27;s balance sheet (for the last two fiscal year ends). The information is shown in Exhibit 1. Negative numbers are indicated in parentheses. There is no preferred stock, and no long-term asset sales occurred in 20X9.<\/p><p>Exhibit 1: Selected Schön Financial Information (€ millions except for rates and ratios)<\/p><div class=\"tbl\"><table><tr><td>Income Statement<\/td><td>20X9<\/td><td>Balance Sheet<\/td><td>20X8<\/td><td>20X9<\/td><\/tr><tr><td>Revenue<\/td><td>4,250<\/td><td>Total current assets<\/td><td>2,408<\/td><td>2,577<\/td><\/tr><tr><td>EBITDA<\/td><td>1,461<\/td><td>Net PPE<\/td><td>3,794<\/td><td>4,150<\/td><\/tr><tr><td>Operating income<\/td><td>1,169<\/td><td>Notes payable<\/td><td>600<\/td><td>644<\/td><\/tr><tr><td>Interest expense<\/td><td>150<\/td><td>Long-term debt<\/td><td>2,020<\/td><td>2,070<\/td><\/tr><tr><td>Income tax rate<\/td><td>30%<\/td><td>Total liabilities<\/td><td>3,210<\/td><td>3,378<\/td><\/tr><tr><td>Dividends<\/td><td>357<\/td><td>Total equity<\/td><td>2,992<\/td><td>3,349<\/td><\/tr><tr><td>Other Information<\/td><td>20X9<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>CF from operations<\/td><td>1,042<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>CF from investing<\/td><td>(648)<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Risk-free rate<\/td><td>2.50%<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>After-tax cost of debt<\/td><td>4.50%<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Cost of equity<\/td><td>8.50%<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Target D/E ratio<\/td><td>1.00<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Hermosa S.A., based in Barcelona, Spain, is the third largest company in the luxury skin care segment of the cosmetics industry. Hermosa is considered a growth company within the cosmetics industry and the luxury skin care segment. Hermosa has not issued bonds and all of Hermosa&#x27;s debt is considered short and intermediate term. For the fiscal year 20X9, FCFF is €143 million and FCFE is €136.23 million. Hermosa pays no dividends. Hermosa&#x27;s earnings are expected to grow at 14.0% for three years and then at the expected overall rate of growth in the luxury skin care segment. Hermosa&#x27;s equity beta is 1.20. The risk-free rate is 2.5%. Hermosa&#x27;s target weight for debt is 25.0%. Hermosa has 200 million shares outstanding.<\/p><p>Elizabeth Nguyen, one of the partners at Lee Nguyen Investments, approaches LeBlanc about a client interested in buying Hermosa S.A. Nguyen asks LeBlanc about using the residual income method to value Hermosa.<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Residual income models can be used with a variety of inventory cost flow assumptions without any adjustments.<\/td><\/tr><tr><td>Statement 2:<\/td><td>If the company has any special purpose entities that are not consolidated, we need to adjust the reported financial statements, effectively consolidating the SPE, before applying the residual income method.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The estimated value of Hermosa stock using FCFE valuation is closest to:<\/p><\/div>","subj":"equity"},{"n":20,"q":"Regarding LeBlanc's statements to Nguyen:","opts":["both statements are correct.","neither statement is correct.","only one statement is correct."],"ans":"C","expl":"Statement 1 is incorrect. Inventory for companies that use LIFO (last in, first out) should be adjusted to be comparable with FIFO (first in, first out) by adding the LIFO reserve to inventory and equity (assuming no deferred tax impact). Statement 2 is correct. Special purpose entities (SPEs) with assets and liabilities that are not reflected in the financial statements of the parent company should be consolidated.\n(Module 23.5, LOS 23.k)","explhtml":"<p>Statement 1 is incorrect. Inventory for companies that use LIFO (last in, first out) should be adjusted to be comparable with FIFO (first in, first out) by adding the LIFO reserve to inventory and equity (assuming no deferred tax impact). Statement 2 is correct. Special purpose entities (SPEs) with assets and liabilities that are not reflected in the financial statements of the parent company should be consolidated.<\/p><p>(Module 23.5, LOS 23.k)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marie LeBlanc, CFA, is an analyst at Lee Nguyen Investments, an international equities investment firm. LeBlanc has been asked to value two European cosmetics companies, Schön AG and Hermosa S.A.<\/p><p>The beauty products industry is a mature industry with few competitors. One segment that is growing is luxury skin care; while the cosmetics industry is expected to grow at a steady rate of 3.5%, the luxury skin care segment is expected to grow at 5.5%.<\/p><p>Schön AG, based in Frankfurt, Germany, is the largest company in the luxury skin care segment of the cosmetics industry. Schön is considered a very stable company within the cosmetics industry and the luxury skin care segment. Schön&#x27;s equity beta is 1.00.<\/p><p>LeBlanc collects selected financial information from Schön&#x27;s income statement and cash flow statement (for the last fiscal year) and from Schön&#x27;s balance sheet (for the last two fiscal year ends). The information is shown in Exhibit 1. Negative numbers are indicated in parentheses. There is no preferred stock, and no long-term asset sales occurred in 20X9.<\/p><p>Exhibit 1: Selected Schön Financial Information (€ millions except for rates and ratios)<\/p><div class=\"tbl\"><table><tr><td>Income Statement<\/td><td>20X9<\/td><td>Balance Sheet<\/td><td>20X8<\/td><td>20X9<\/td><\/tr><tr><td>Revenue<\/td><td>4,250<\/td><td>Total current assets<\/td><td>2,408<\/td><td>2,577<\/td><\/tr><tr><td>EBITDA<\/td><td>1,461<\/td><td>Net PPE<\/td><td>3,794<\/td><td>4,150<\/td><\/tr><tr><td>Operating income<\/td><td>1,169<\/td><td>Notes payable<\/td><td>600<\/td><td>644<\/td><\/tr><tr><td>Interest expense<\/td><td>150<\/td><td>Long-term debt<\/td><td>2,020<\/td><td>2,070<\/td><\/tr><tr><td>Income tax rate<\/td><td>30%<\/td><td>Total liabilities<\/td><td>3,210<\/td><td>3,378<\/td><\/tr><tr><td>Dividends<\/td><td>357<\/td><td>Total equity<\/td><td>2,992<\/td><td>3,349<\/td><\/tr><tr><td>Other Information<\/td><td>20X9<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>CF from operations<\/td><td>1,042<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>CF from investing<\/td><td>(648)<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Risk-free rate<\/td><td>2.50%<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>After-tax cost of debt<\/td><td>4.50%<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Cost of equity<\/td><td>8.50%<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Target D/E ratio<\/td><td>1.00<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Hermosa S.A., based in Barcelona, Spain, is the third largest company in the luxury skin care segment of the cosmetics industry. Hermosa is considered a growth company within the cosmetics industry and the luxury skin care segment. Hermosa has not issued bonds and all of Hermosa&#x27;s debt is considered short and intermediate term. For the fiscal year 20X9, FCFF is €143 million and FCFE is €136.23 million. Hermosa pays no dividends. Hermosa&#x27;s earnings are expected to grow at 14.0% for three years and then at the expected overall rate of growth in the luxury skin care segment. Hermosa&#x27;s equity beta is 1.20. The risk-free rate is 2.5%. Hermosa&#x27;s target weight for debt is 25.0%. Hermosa has 200 million shares outstanding.<\/p><p>Elizabeth Nguyen, one of the partners at Lee Nguyen Investments, approaches LeBlanc about a client interested in buying Hermosa S.A. Nguyen asks LeBlanc about using the residual income method to value Hermosa.<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Residual income models can be used with a variety of inventory cost flow assumptions without any adjustments.<\/td><\/tr><tr><td>Statement 2:<\/td><td>If the company has any special purpose entities that are not consolidated, we need to adjust the reported financial statements, effectively consolidating the SPE, before applying the residual income method.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding LeBlanc&#x27;s statements to Nguyen:<\/p><\/div>","subj":"equity"},{"n":21,"q":"The price of Bond A in Exhibit 2 is most accurately described as being sensitive to shifts in:","opts":["the one-year par rate only.","the three-year par rate only.","both the one-year and three-year par rates."],"ans":"C","expl":"Bond A is a three-year bond, callable in one year. Callable bonds are sensitive to par rates corresponding to their call date (particularly if their coupon rate is relatively high) and to the par rates corresponding to their maturity date (especially if the coupon rate is relatively low).\n(Module 27.6, LOS 27.k)","explhtml":"<p>Bond A is a three-year bond, callable in one year. Callable bonds are sensitive to par rates corresponding to their call date (particularly if their coupon rate is relatively high) and to the par rates corresponding to their maturity date (especially if the coupon rate is relatively low).<\/p><p>(Module 27.6, LOS 27.k)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Fixed Income<\/summary><div class=\"vig-body\"><p>Rafael Dias joined Banco Apice S.A. last year as a junior bond analyst. Gabriela Gomes, Dias&#x27;s immediate supervisor, provides him with a binomial interest rate tree with a 20% volatility assumption as shown in Exhibit 1. Exhibit 1: Binomial Interest Rate Tree<\/p><img class=\"pimg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAlgCWAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wgARCAJuAw8DAREAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAYFBAcDAgEI/8QAFAEBAAAAAAAAAAAAAAAAAAAAAP/aAAwDAQACEAMQAAAB2oAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAcwAAAAAAAADoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADkamJAAAAAAAAAVJOi6AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAORBifAAAAAAAAEZMovAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADkQYnwORUF4RskJQGWUxICqMgxyyLA9kZMovAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADkQYnwIuYZNCFEuI0cC9K0iJnns7kkLkjJlF4AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADDKwvzkQYnx8IuRcmpHyXHkiphknI+ZxmFYeibEZMovAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA ive convexity?<\/td><\/tr><tr><td>Question 2:<\/td><td>For a given decline in interest rate, which bond is most likely to have lower upside potential?<\/td><\/tr><tr><td>Question 3:<\/td><td>If interest rates rise, which bond is most likely to see its effective duration increase?<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The price of Bond A in Exhibit 2 is most accurately described as being sensitive to shifts in:<\/p><\/div>","subj":"fixed"},{"n":22,"q":"The most accurate answers to Da Silva's Question 1 and Question 2 are:\nQuestion 1 | Question 2","opts":["Bond A Bond A","Bond A Bond B","Bond B Bond A"],"ans":"A","expl":"Callable bonds exhibit negative convexity due to the price compression that occurs when the call option is in the money. Hence, Bond A would exhibit negative convexity. Also, the upside potential for a callable bond (that is realized when interest rates fall) is limited due to the embedded short call.\n(Module 27.6, LOS 27.k)\n(Module 27.6, LOS 27.l)","explhtml":"<p>Callable bonds exhibit negative convexity due to the price compression that occurs when the call option is in the money. Hence, Bond A would exhibit negative convexity. Also, the upside potential for a callable bond (that is realized when interest rates fall) is limited due to the embedded short call.<\/p><p>(Module 27.6, LOS 27.k)<\/p><p>(Module 27.6, LOS 27.l)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rafael Dias joined Banco Apice S.A. last year as a junior bond analyst. Gabriela Gomes, Dias&#x27;s immediate supervisor, provides him with a binomial interest rate tree with a 20% volatility assumption as shown in Exhibit 1. Exhibit 1: Binomial Interest Rate Tree<\/p><img class=\"pimg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAlgCWAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcF is most likely to see its effective duration increase?<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Using the rates in Exhibit 1 and the information in Exhibit 2, the value of Bond A is closest to:<\/p><\/div>","subj":"fixed"},{"n":24,"q":"In answer to Da Silva's Question 3, the bond whose effective duration is most likely to increase if interest rates rise is:","opts":["Bond A","Bond B","neither Bond A nor Bond B."],"ans":"A","expl":"As interest rates rise, a call option will move out of the money, reducing the likelihood of the bond being called. Thus, callable Bond A's effective duration will increase if interest rates rise. In contrast, Bond B's put option will move into the money as interest rates rise, and reduce its effective duration.\n(Module 27.5, LOS 27.j)","explhtml":"<p>As interest rates rise, a call option will move out of the money, reducing the likelihood of the bond being called. Thus, callable Bond A&#x27;s effective duration will increase if interest rates rise. In contrast, Bond B&#x27;s put option will move into the money as interest rates rise, and reduce its effective duration.<\/p><p>(Module 27.5, LOS 27.j)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rafael Dias joined Banco Apice S.A. last year as a junior bond analyst. Gabriela Gomes, Dias&#x27;s immediate supervisor, provides him with a binomial interest rate tree with a 20% volatility assumption as shown in Exhibit 1. Exhibit 1: Binomial Interest Rate Tree<\/p><img class=\"pimg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAlgCWAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wgARCAJuAw8DAREAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAYFBAcDAgEI/8QAFAEBAAAAAAAAAAAAAAAAAAAAA
